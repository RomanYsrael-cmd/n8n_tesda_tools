    {
      "number": "4",
      "text": "1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1. To attain the National Qualification of the qualification, the candidate must demonstrate in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2. The qualification of Mechatronics Servicing NC II may be attained through accumulation of Certificates of Competency (COCs) in all the following units of competencies:"
    },
    {
      "number": "4.1",
      "text": "2.1. Install Mechatronics and Automation Devices"
    },
    {
      "number": "4.1",
      "text": "2.2. Configure and Test Mechatronics and Automation System Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units."
    },
    {
      "number": "4.1",
      "text": "3. Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate (NC)."
    },
    {
      "number": "4.1",
      "text": "4. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.1",
      "text": "5. The following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "5.1. Graduate of formal and non-formal including enterprise-based training programs."
    },
    {
      "number": "4.1",
      "text": "5.2. Experienced workers (wage employed or self employed)"
    },
    {
      "number": "4.1",
      "text": "6. The existing NCs or COCs in Mechatronics Servicing NC II shall be in effect until the said NCs or COCs have expired. The NCs or COCs may be renewed provided that the holders present evidence that they are currently or have been employed in mechatronics and/or industrial automation job for the past three (3) years. --- PDF PAGE 79 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ TR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 75"
    },
    {
      "number": "4.1",
      "text": "7. The conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose."
    },
