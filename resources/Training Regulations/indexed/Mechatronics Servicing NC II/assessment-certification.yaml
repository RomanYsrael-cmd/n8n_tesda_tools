    {
      "number": "25",
      "text": "Actuator: In a closed-loop control system, that part of the final control element that translates the control signal into action by the control device."
    },
    {
      "number": "26",
      "text": "Assembler: A program that translates assembly language instructions into machine language instructions."
    },
    {
      "number": "27",
      "text": "Assembly Language: A machine oriented language in which mnemonics are used to represent each machine language instruction. Each CPU has its own specific assembly language."
    },
    {
      "number": "28",
      "text": "Automation: (1) The conversion to and implementation of procedures, processes, or equipment by automated means. (2) Industrial open- or closed-loop control systems in which the manual operation of controls is replaced by servo operation."
    },
    {
      "number": "29",
      "text": "CAD: Computer-Aided Design is the use of high-resolution graphics in a wide range of design activities, allowing quick evaluation and modification of intent. It is commonly used to design architectural, mechanical and electrical engineering drawings."
    },
    {
      "number": "30",
      "text": "Calibration: The process of adjusting an instrument or compiling a deviation chart so that its reading can be correlated to the actual value being measured."
    },
    {
      "number": "31",
      "text": "CAM: Computer-Aided Manufacturing is the use of computer technology to generate data to control part or all of a manufacturing process."
    },
    {
      "number": "32",
      "text": "Conveyor: A horizontal, inclined or vertical device for moving or transporting bulk materials, packages, or objects in a path predetermined by the design of the device and having points of loading and discharge fixed, or selective."
    },
    {
      "number": "33",
      "text": "Ergonomics --\"The systematic application of knowledge about the psychological, physical, and social attributes of human beings in the design and use of all things which affect a person's working conditions: equipment and machinery, the work environment and layout, the job itself, training and the organization of work.\" (Human systems Inc)."
    },
    {
      "number": "34",
      "text": "HMI: Human Machine Interface (HMI) is a software application (typically a Graphical User Interface or GUI) that present information to the operator about the state of a process, and to accept and implement the operators control instructions. It may also interpret the plant information and guide the interaction of the operator with the system. Also known as Man Machine Interface (MMI)."
    },
    {
      "number": "35",
      "text": "PID control: Proportional plus Integral plus Derivative control is used in processes where the controlled variable is affected by long downtimes."
    },
    {
      "number": "36",
      "text": "PLC (Programmable Logic Controller) : A class of industrially hardened devices that provides hardware interface for input sensors and output actuators. PLCs can be programmed using relay ladder logic to control the outputs based on input conditions and / or algorithms contained in the memory of the PLC. --- PDF PAGE 83 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ TR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 79"
    },
    {
      "number": "37",
      "text": "Robotics: The study of the design and use of robots, particularly for their use in manufacturing and related processes."
    },
    {
      "number": "38",
      "text": "Sensor: A transducer whose input is a physical phenomenon and whose output is a quantitative measure of the phenomenon."
    },
    {
      "number": "39",
      "text": "Sequence control: The control of a series of machine movements, with the completion of one movement initiating the next. The extent of movements is typically not specified by numerical input data."
    },
    {
      "number": "40",
      "text": "Servomechanism: An automatic device for controlling large amounts of power by means of small amounts of power."
    },
    {
      "number": "41",
      "text": "Servomotor: A power-driven mechanism that supplements a primary control operated by a comparatively feeble force (as in a servomechanism)."
    },
