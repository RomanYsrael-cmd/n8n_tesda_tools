      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of the qualification, the candidate must demonstrate in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General. 4.1.2. The qualification of Mechatronics Servicing NC II may be attained through accumulation of Certificates of Competency (COCs) in all the following units of competencies: 4.1.2.1. Install Mechatronics and Automation Devices 4.1.2.2. Configure and Test Mechatronics and Automation System Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units. 4.1.3. Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate (NC). 4.1.4. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.5. The following are qualified to apply for assessment and certification: 4.1.5.1. Graduate of formal and non-formal including enterprise-based training programs. 4.1.5.2. Experienced workers (wage employed or self employed) 4.1.6. The existing NCs or COCs in Mechatronics Servicing NC II shall be in effect until the said NCs or COCs have expired. The NCs or COCs may be renewed provided that the holders present evidence that they are currently or have been employed in mechatronics and/or industrial automation job for the past three (3) years. 4.1.7. The conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
