        "source_title": "PERFORM COMPUTER OPERATIONS",
        "source_text": "--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          28       \nUNIT TITLE \n: \nPERFORM COMPUTER OPERATIONS \nUNIT CODE \n: \nELC311203 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, (and) attitudes and values \nneeded to perform computer operations which include inputting, \naccessing, producing and transferring data using the appropriate \nhardware and software  \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \ntask to be \nundertaken \n1.1. Requirements of task are \ndetermined \n1.2. Appropriate hardware and \nsoftware are selected \naccording to task assigned \nand required outcome \n1.3. Task is planned to ensure \nOH&S guidelines and \nprocedures are followed \n Main types of \ncomputers and basic \nfeatures of different \noperating systems \n Main parts of a \ncomputer \n Information on \nhardware and \nsoftware \n Data security \nguidelines \n Reading and \ncomprehension \nskills required to \ninterpret work \ninstruction and to \ninterpret basic user \nmanuals. \n Communication \nskills to identify \nlines of \ncommunication, \nrequest advice, \nfollow instructions \nand receive \nfeedback. \n Interpreting user \nmanuals and \nsecurity guidelines \n2. Input data \ninto \ncomputer \n2.1. Data  are entered into the \ncomputer using appropriate \nprogram/application in \naccordance with company \nprocedures \n2.2. Accuracy of information is \nchecked and information is \nsaved in accordance with \nstandard operating \nprocedures \n2.3. Inputted data are stored in \nstorage media according \nto requirements \n2.4. Work is performed within \nergonomic guidelines \n Basic ergonomics of \nkeyboard and \ncomputer user \n Storage devices and \nbasic categories of \nmemory \n Relevant types of \nsoftware \n Technology skills \nto use equipment \nsafely including \nkeyboard skills. \n Entering data \n3. Access \ninformation \nusing \ncomputer \n3.1. Correct \nprogram/application is \nselected based on job \nrequirements \n3.2. Program/application \ncontaining the information \nrequired is accessed \naccording to company \nprocedures \n3.3. Desktop icons are \ncorrectly selected, opened \nand closed for navigation \n General security, \nprivacy legislation \nand copyright \n Productivity \nApplication \n Business Application \n Accessing \ninformation \n Searching and \nbrowsing files and \ndata\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          29       \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \npurposes \n3.4. Keyboard techniques are \ncarried out in line with \nOH&S requirements for \nsafe use of keyboards \n4. Produce/ \noutput data \nusing \ncomputer \nsystem \n4.1. Entered data are \nprocessed using \nappropriate software \ncommands \n4.2. Data printed out as \nrequired using computer \nhardware/peripheral \ndevices in accordance with \nstandard operating \nprocedures \n4.3. Files, data are transferred \nbetween compatible \nsystems using computer \nsoftware, hardware/ \nperipheral devices in \naccordance with standard \noperating procedures  \n Computer application \nin printing, scanning \nand sending facsimile \n Types and function of \ncomputer peripheral \ndevices \n Computer data \nprocessing \n Printing of data  \n Transferring files \nand data \n5. Maintain \ncomputer \nequipment \nand systems\n5.1. Systems for cleaning, \nminor maintenance and \nreplacement of \nconsumables are \nimplemented \n5.2. Procedures for ensuring \nsecurity of data, including \nregular back-ups and virus \nchecks are implemented in \naccordance with standard \noperating procedures \n5.3. Basic file maintenance \nprocedures are \nimplemented in line with \nthe standard operating \nprocedures \n Basic internet \noperation \no Web address \no Types and \nfunctions of \nsearch engines \n Different web browser \nsecurity features and \nmaintenance \n Locating \ninformation using \nbrowser \n Internet browsing\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          30       \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hardware and \nperipheral devices \n1.1. Personal computers \n1.2. Networked systems \n1.3. Communication equipment \n1.4. Printers \n1.5. Scanners \n1.6. Keyboard \n1.7. Mouse \n2. Software \nSoftware includes the following but not limited to: \n2.1. Word processing packages \n2.2. Data base packages \n2.3. Internet \n2.4. Spreadsheets \n3. OH & S guidelines \n3.1. OHS guidelines \n3.2. Enterprise procedures \n4. Storage media \nStorage media include the following but not limited to: \n4.1. diskettes \n4.2. CDs \n4.3. zip disks \n4.4. hard disk drives, local and remote \n5. Ergonomic guidelines \n5.1. Types of equipment used \n5.2. Appropriate furniture \n5.3. Seating posture \n5.4. Lifting posture \n5.5. Visual display unit screen brightness \n6. Desktop icons \nIcons include the following but not limited to: \n6.1. directories/folders \n6.2. files \n6.3. network devices \n6.4. recycle bin \n7. Maintenance \n7.1. Creating more space in the hard disk \n7.2. Reviewing programs \n7.3. Deleting unwanted files \n7.4. Backing up files  \n7.5. Checking hard drive for errors \n7.6. Using up to date anti-virus programs \n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          31       \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Selected and used hardware components correctly and \naccording to the task requirement \n1.2. Identified and explain the functions of both hardware \nand software used, their general features and \ncapabilities \n1.3. Produced accurate and complete data in accordance \nwith the requirements \n1.4. Used appropriate devices and procedures to transfer  \nfiles/data accurately \n1.5. Maintained computer system \n2. Method of assessment \n2.1. The assessor may select two of the following \nassessment methods to objectively assess the \ncandidate: \n2.1.1. Observation \n2.1.2. Questioning \n2.1.3. Practical demonstration \n3. Resource implication \n3.1. Computer hardware   with peripherals \n3.2. Appropriate software \n4. Context of Assessment \n4.1. \nAssessment may be conducted in the workplace or in \na simulated work environment\n",
