          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nhazards and \nrisks \n1.1 Safety regulations and \nworkplace safety and hazard \ncontrol practices and procedures \nare clarified and explained \nbased on organization \nprocedures \n1.2 Hazards/risks in the workplace \nand their corresponding \nindicators are identified to \nminimize or eliminate risk to co-\nworkers, workplace and \nenvironment in accordance with \norganization procedures \n1.3 Contingency measures during \nworkplace accidents, fire and \nother emergencies are \nrecognized and established in \naccordance with organization \nprocedures \n \n OHS procedures \nand practices and \nregulations \n Hazards/risks \nidentification and \ncontrol \n OHS indicators \n Organizational \ncontingency \npractices \n \n Hazards/risks \nidentification and \ncontrol skills \n Practice of  safety \nand health \nprocedures and \npersonal hygiene \n \n2. Evaluate \nhazards and \nrisks \n2.1 Terms of maximum tolerable \nlimits which when exceeded will \nresult in harm or damage are \nidentified based on threshold \nlimit values (TLV) \n2.2 Effects of the hazards are \ndetermined \n2.3  OHS issues and/or concerns \nand identified safety hazards are \nreported to designated \npersonnel in accordance with \nworkplace requirements and \nrelevant workplace OHS \nlegislation \n \n Threshold Limit \nValue (TLV) \n Effects of safety \nhazards \n \n Communication \nskills \n Reporting safety \nhazards \n3. Control \nhazards and \nrisks  \n3.1 Occupational Health and Safety \n(OHS) procedures for controlling \nhazards/risks in workplace are \nconsistently followed \n3.2 Procedures for dealing with \nworkplace accidents, fire and \nemergencies are followed in \naccordance with organization \nOHS policies\n Personal hygiene \npractices \n Organization safety \nand health protocol \n Company \nemergency \nprocedure practices \n Practice of \npersonal hygiene  \n Respond to  \nemergency\n