        "source_text": "500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1. The role and objective of\nthe team is identified from\navailable sources of\ninformation\n1.2. Team parameters, reporting\nrelationships and\nresponsibilities are identified\nfrom team discussions and\nappropriate external sources\n\n• Team roles\n• Definition of Team\n• Difference between\nteam and group\n• Different source of\ninformation\n• Objectives and goals of\nteam\n• Describing the\nteam role and\nscope\n\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1. Individual role and\nresponsibilities within the\nteam environment are\nidentified\n2.2. Roles and responsibility of\nother team members are\nidentified and recognized\n2.3. Reporting relationships within\nteam and external to team are\nidentified\n\n• Team structure\n• Roles and responsibility\nof team members\n• Teams in work\nenvironment\n• Fundamental rights at\nwork including gender\nsensitivity\n• Communicate\nappropriately,\nconsistent with\nthe culture of\nthe workplace\n• Identifying\nindividual role\nand\nresponsibility\n• Identifying\nexternal\nrelationship\n3. Work as a\nteam\nmember\n3.1. Effective and appropriate\nforms of communications\nused and interactions\nundertaken with team\nmembers who contribute to\nknown team activities and\nobjectives\n3.2. Effective and appropriate\ncontributions made to\ncomplement team activities\nand objectives, based on\nindividual skills and\ncompetencies and workplace\ncontext\n3.3. Observed protocols in\nreporting using standard\noperating procedures\n3.4. Contribute to the development\nof team work plans based on\nan understanding of team’s\nrole and objectives and\nindividual competencies of the\nmembers\n• Communication process\n• Group planning and\ndecision making\n• Team goals and\nobjectives\n• Understanding individual\ncompetencies relative to\nteamwork\n• Types of individuals\n• Role of leaders\n• Interacting\neffectively with\nothers\n• Setting team\ngoals and\nexpectations\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with enterprise\nor specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 7\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nObservation of the individual member in relation to the\nwork activities of the group\n3.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 8\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\nUNIT CODE :"
