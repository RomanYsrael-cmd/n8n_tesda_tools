        "source_text": "ELC311209\n\nDESCRIPTON : This unit covers the knowledge, skills and attitudes required to\ntest electronic components. It includes competencies in\ndetermining the criteria for testing electronics components,\nplanning an approach for component testing, testing the\ncomponents and evaluating the testing process.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Determine\ncriteria for\ntesting\nelectronics\ncomponents\n1.1 Work instructions are\nobtained and clarified\nbased on job order or\nclient requirements\n1.2 Responsible person is\nconsulted for effective\nand proper work\ncoordination\n1.3 Data sheets/Application\nnotes are obtained and\ninterpreted based on\nmanufacturer’s\nspecifications\n1.4 Testing criteria are\ndefined to ensure that\ncomponents meet\ntechnical and quality\nrequirements\n1.5 Document and\ncommunicate testing\ncriteria to relevant\npersonnel\n• Mensuration/ Mathematics\no Conversion of Units\no Applied Mathematics\n• Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\n• Systems and Processes\no Principles of electrical /\nelectronic circuits\no Identifying sources of\nelectricity\no Identifying conductors\nand insulators\no Supplying different\nvoltage using variable\npower supply\no Measuring resistance\nusing VOM\no Testing resistors\no Measuring current and\nvoltage using VOM\n• Testing Criteria\no Controls\no Effectiveness\no Efficiency\no Bug detection\no Functionality, including\nflow\no Interoperability\no Performance\no Reliability\no Operating parameters\n• Work efficiently &\nsystematically\n• Communication\nskills\n• Skills in testing\nelectronic\ncomponents\n• Work safety\npractices and\ntime management\n• Reading skills\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 37\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n2. Plan an\napproach\nfor\ncomponent\ntesting\n2.1 Various testing\nmethods are identified\nbased on types of\nelectronic\ncomponents\n2.2 Characteristics and\nappropriateness of\ntesting methods to be\nused during\ndevelopment and on\ncompletion is\ndetermined\n2.3 Testing methods are\nconsidered/selected in\nrelation to appropriate\ntesting strategy\n2.4 Plan for testing\ncomponents is\ndeveloped at specified\npoints during\ndevelopment and on\ncompletion\n2.5 Required test &\nmeasuring\ninstruments and tools\nare prepared and\nchecked in accordance\nwith established\nprocedures\n2.6 Records system is\nestablished to document\ntesting results, including\nproblems and faults\n• Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\no Knowledge in 5S\napplication and\nobservation of required\ntimeframe\n• Materials, tools and\nequipment uses and\nspecifications\no Proper care and use of\ntools\n• Types of electronic\ncomponents\no Passive components\no Active components\no Dynamic components\no Hybrid components\n• Testing methods\no Automated\no Debugging\no Inspection\no Platform testing\no Prototyping\n• Systems and Processes\no Describing resistance\nand identify resistors\no Describing alternating\ncurrent circuits\no Describing capacitance\nand identifying capacitors\no Describing inductance\nand identifying inductors\no Describing the\ncharacteristic of\ntransformers\no Describing and\nidentifying semiconductor\ndiode\no Describing and\nidentifying bipolar\ntransistor\no Describing and analyzing\ndigital gate\n• Skills in testing\nelectronic\ncomponents\n• Work safety\npractices and\ntime\nmanagement\n• Planning skills\n• Problem solving\nskills\n• Reading skills\n• Checking test &\nmeasuring\ninstruments and\ntools\n• Documentation\nskills\n3. Test\ncomponents\n3.1 Testing methods are\napplied to ensure that\nproducts meet creative,\nproduction and\ntechnical requirements\n3.2 Problems and faults\n• Safety\no Work Safety\nrequirements and\neconomy of materials\nwith durability\n• Materials, tools and\nequipment uses and\n• Skills in testing\nelectronic\ncomponents\n• Troubleshooting\nskills\n• Problem solving\nskills\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 38\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\ndetected by testing are\nrecorded and remedial\nsteps taken in records\nsystem is documented\n3.3 Problems and faults\ndetected during testing\nare resolved in\naccordance with\nagreed project or\nindustry practice\n3.4 Evaluate final products\nagainst the previously\ndetermined criteria\n3.5 Testing process is\ndocumented and\nsummarized evaluation\nreport is submitted to\nrelevant personnel\nspecifications\no Proper care and use of\ntools\n• Systems and Processes\no Principles of electrical/\nelectronic circuits\no Supplying different\nvoltage using variable\npower supply\no Measuring resistance\nusing VOM\no Testing resistors\no Measuring current and\nvoltage using VOM\no Observing waveform\nusing oscilloscope\no Generating waveform in\nvarious frequency using\nfunction generator\no Measuring frequency\nusing oscilloscope\no Measuring capacitance\nusing VOM\no Testing capacitors\no Testing inductors\no Testing semiconductor\ndiode\no Testing bipolar\ntransistor\no Testing logic gates\n• Documentation\nskills\n• Work efficiently\n& systematically\n• Product\nanalysis and\nevaluation skills\n• Communication\nskills\n• Reading skills\n4. Evaluate the\ntesting\nprocess\n4.1 Testing methods that\nwere successful and\nthose that led to\ndifficulties are identified\nbased on industry\nstandards\n4.2 Testing process and\nrecords system are\nevaluated based on\nstandard procedures\n4.3 Test results/findings are\ndocumented for\nsubsequent\ncomponents testing.\n• Evaluation of testing process\nand records system\n• Systems and Processes\no Analyzing simple circuit\nusing ohms and power\nlaw\no Analyzing series/ parallel\ncircuits using ohms and\npower law\no Analyzing series/ parallel\ncapacitances\no Analyzing series parallel\ninductors\no Analyzing rectifier circuits\no Analyzing amplifier circuit\no Analyzing multi-vibrator\ncircuit\no Analyzing logic networks\no Analyzing sequence\ncircuits\n• Work efficiently\n& systematically\n• Skills in testing\nelectronic\ncomponents\n• Product\nanalysis and\nevaluation skills\n• Documentation\nskills\n• Communication\nskills\n• Reading skills\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Responsible person\nRelevant personnel may include:\n1.1. Immediate supervisor\n1.2. Manager\n2. Testing criteria\nTesting criteria may include:\n2.1. controls\n2.2. effectiveness\n2.3. efficiency\n2.4. bug detection\n2.5. functionality, including flow\n2.6. interoperability\n2.7. performance\n2.8. reliability\n2.9. operating parameters\n3. Testing methods\nTesting methods may include:\n3.1. automated\n3.2. debugging\n3.3. inspection\n3.4. platform testing\n3.5. prototyping\n4. Types of electronic\ncomponents\n4.1. Passive components\n4.2. Active components\n4.3. Dynamic components\n4.4. Hybrid components\n5. Testing strategy\nTesting strategy may be determined by:\n5.1. Passive testing\n5.2. Dynamic testing\n5.3. In-circuit testing\n6. Test and measuring\ninstruments\nTest and measuring instruments may include:\n6.1. Variable DC power supply\n6.2. Digital VOM\n6.3. analog VOM\n6.4. dual trace triggered oscilloscope\n6.5. function generator\n7. Tools\nTools may include:\n7.1. set of pliers\n7.2. set of screw drivers\n7.3. set of wrenches\n7.4. Hand drills,\n7.5. Hack saw\n7.6. set of files\n7.7. tin snip\n7.8. hammer\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 40\n\nVARIABLE\nRANGE\n8. Records system\nRecords system may include:\n8.1. metadata that includes:\n8.1.1. description of fault\n8.1.2. identification of code\n8.1.3. user responses\n8.1.4. written or verbal comments\n8.1.5. quantitative data\n8.1.6. remedial action taken\n8.1.7. retest result\n8.1.8. date\n8.1.9. tester's details\n8.2. questionnaire\n8.3. survey\n\nEVIDENCE GUIDE\n\n1\nCritical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDetermined criteria for testing electronics components\n1.2\nPlanned an approach for component testing\n1.3\nTested components\n1.4\nEvaluated the testing process\n\n2 Method of\nassessment\n\nCompetency may be assessed through two or more of the\nfollowing methods:\n2.1\nDirect observation of application to tasks and\nquestions related to required knowledge\n2.2\nDemonstration with oral questioning\n2.3\nThird party report\n2.4\nWritten test\n2.5\nPortfolio\n3 Resource\nimplications\n\nThe following resources must be provided:\n3.1\nTools and equipment (see range of variables)\n3.2\nWorking area/bench\n3.3\nElectronic components\n3.4\nTesting instruments and equipment\n3.5\nAssessment rating sheet\n3.6\nReporting forms\n4 Context of\nassessment\n4.1\nAssessment maybe conducted in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 41\nCORE COMPETENCIES\n\nUNIT TITLE\n:\n INSTALL MECHATRONICS AND AUTOMATION DEVICES\n\nUNIT CODE\n :"
