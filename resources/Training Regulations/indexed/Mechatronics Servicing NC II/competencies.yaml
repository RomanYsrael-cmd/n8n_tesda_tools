          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Plan and \nprepare for \nconfiguration \nand testing of \nmechatronics \nand \nautomation \nsystem \n1.1. Configuration and testing \nare planned and prepared in \nline with job requirements. \n1.2. OHS policies and \nprocedures are followed in \nline with job requirements. \n1.3. Mechatronics and \nautomation devices for \nconfiguration & testing are \nchecked against \nspecifications and \nrequirements. \n1.4. Materials necessary to \ncomplete the work are \nobtained in accordance with \nestablished procedures and \nchecked against job \nrequirements. \n1.5. Tools, equipment and \ntesting devices needed for \nconfiguration & testing are \nobtained and checked for \ncorrect operation and safety \n1.6. Mechatronics and \nautomation system to be \nconfigured and tested are \nidentified from the Job/ \nService Order or \ninstructions \n Safety procedures \non configuration \nand testing of \nsystem \n Application of OHS  \n Interpret \ninstructional \nmanuals, protocols \nand methodologies \n Selection of \nappropriate \nmaterials for \nsystem application \n Safe keeping of \ntools and \nequipment \n Preventive \nmaintenance of \ntools and \nequipment \n Different system \nfunctionality and \noperation \n \n Reading and \ncommunication skills \nrequired to interpret \nwork instructions \n Checking defective \ntools and equipment. \n Understand drawing \nand wiring circuit \ndiagram \n Can understand and \nfollow instructional \nmanuals \n Able to analyze \nsystem \n Calculation and \nmensuration skills \n Able to identify \nhazards on \nworkplace \n2. Check and \nconfigure \nmechatronics \nand \nautomation \nsystem \n2.1. Appropriate personal \nprotective equipment is \nused and OHS policies and \nprocedures are followed \n2.2. Normal function of \nmechatronics and \n Safety procedures \non configuration \nand testing of \nmechatronics and \nautomation system \n Logic / Sequential \n Reading and skills \nrequired to interpret \nwork instructions \n Communication \nskills needed to \ninterpret and define\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          47       \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold items are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nautomation system are \nchecked in accordance with \nmanufacturer’s instructions. \n2.3. Fault or problem in the \nsystem is diagnosed in line \nwith the standard operating \nprocedures. \n2.4. Mechatronics and \nautomation system are \nconfigured in line with the \nstandard operating \nprocedures. \n2.5. Unplanned events or \nconditions are responded to \nin accordance with \nestablished procedures \nCircuits \n International \nStandards for block/ \ncircuit diagram \napplicable to the \nsystem \n Procedures and \nmethodologies on \nmechatronics and \nautomation system \nconfiguration \n Identification of \nsafety and hazards \non mechatronics \nand automation \nsystem \n \n \n \nwork procedures \n Understand drawing \nand wiring circuit \ndiagram \n Can understand and \nfollow instructional \nmanuals \n Able to analyze \nsystem \n Able to utilize test \ninstruments \n Able to do continuity \ntest \n Able to identify fault \nindicators \n Able to prepare \naccomplishment \nreport \n Able to identify \nhazards on \nworkplace \n Problem solving in \nemergency situation \n \n3. Inspect and \ntest the \nconfigured \nmechatronics \nand \nautomation \nsystem \n3.1. Final inspections are \nundertaken to ensure that \nthe adjustment & testing \ndone on the system \nconforms with design \nrequirement \n3.2. Configured mechatronics \nand automati