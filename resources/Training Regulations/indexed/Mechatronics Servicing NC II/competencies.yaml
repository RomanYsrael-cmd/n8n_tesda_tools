          "source_text": "1\nCritical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDetermined criteria for testing electronics components\n1.2\nPlanned an approach for component testing\n1.3\nTested components\n1.4\nEvaluated the testing process\n\n2 Method of\nassessment\n\nCompetency may be assessed through two or more of the\nfollowing methods:\n2.1\nDirect observation of application to tasks and\nquestions related to required knowledge\n2.2\nDemonstration with oral questioning\n2.3\nThird party report\n2.4\nWritten test\n2.5\nPortfolio\n3 Resource\nimplications\n\nThe following resources must be provided:\n3.1\nTools and equipment (see range of variables)\n3.2\nWorking area/bench\n3.3\nElectronic components\n3.4\nTesting instruments and equipment\n3.5\nAssessment rating sheet\n3.6\nReporting forms\n4 Context of\nassessment\n4.1\nAssessment maybe conducted in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 41\nCORE COMPETENCIES\n\nUNIT TITLE\n:\n INSTALL MECHATRONICS AND AUTOMATION DEVICES\n\nUNIT CODE\n :"
