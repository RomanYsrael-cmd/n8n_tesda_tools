          "source_text": "REQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS\n1. Identify \ndifferent \nkinds of \ntechnical \ndrawings  \n1.1. Correct technical drawing is \nselected according to job \nrequirements. \n1.2. Technical drawings are \nsegregated in accordance \nwith the types and kinds of \ndrawings \n Types of technical \ndrawings \n Applications for technical \ndrawing  \n Methods of technical \ndrawings \n Symbols \n Mark up/Notation of \nDrawings \n \n Reading skills \nrequired to interpret \nwork instruction \n Interpreting \nelectrical/ electronic \nsigns and symbols   \n2. Interpret \ntechnical \ndrawing \n2.1. Components, assemblies or \nobjects are recognized as \nrequired. \n2.2. Dimensions of the key \nfeatures of the objects \ndepicted in the drawing are \ncorrectly identified. \n2.3. Symbols used in the \ndrawing are identified and \ninterpreted correctly. \n2.4. Drawing is checked and \nvalidated against job \nrequirements or equipment in \naccordance with standard \noperating procedures. \n \n Trade Mathematics \no Linear measurement \no Dimension \no Unit conversion \n Blueprint Reading and \nPlan Specification \no Architectural, \nelectrical, electronics, \nmechanical plan, \nsymbols and \nabbreviations \no Drawing standard \nsymbols \n Trade Theory \no Basic technical \ndrawing \no Types technical plans \no Various types of \ndrawings \no Notes and \nspecifications \n \n Interpreting \ndrawing/ \northographic \ndrawing \n Interpreting \ntechnical plans \n Matching \nspecification details \nwith existing \nresources \n Safety handling of \ndrawing \ninstruments \n \n3. Prepare/ \nmake \nchanges to \nelectrical/ \nelectronic \nschematics \nand \ndrawings \n3.1. Electrical/electronic \nschematic is drawn and \ncorrectly identified. \n3.2. Correct drawing is identified, \nequipment are selected and \nused in accordance with job \nrequirements. \n Drawing conventions \n Dimensioning \nConventions \n Mathematics \no Four fundamental \noperations \no Percentage \no Fraction \no Algebra \no Geometry \n \n Reading skills \nrequired to interpret \nwork instruction \n Communication \nskills \n Preparing/ Making \nelectrical/ electronic \nsigns and symbols   \n Computing \nformulas\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          21       \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS\n4. Store \ntechnical \ndrawings \nand \nequipment/ \ninstruments \n4.1. Care and maintenance of \ndrawings are undertaken \naccording to company \nprocedures. \n4.2. Technical drawings are \nrecorded and inventory is \nprepared in accordance with \ncompany procedures. \n4.3. Proper storage of \ninstruments is undertaken \naccording to company \nprocedures.  \n Effective ways to \ncatalogue and store \ntechnical drawings \n Manual methods of \nhandling, storing and \nmaintaining paper \ndrawings \n Storing drawing in digital \nforms \no Scanner \no CAD \n \n Handling and \nstoring of drawings \n Scanning and \nstoring drawings in \ndigital form \n Matching \nspecification details \nwith existing \nresources \n Handling of drawing \ninstruments\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          22       \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technical drawings \nTechnical drawings include the following but not