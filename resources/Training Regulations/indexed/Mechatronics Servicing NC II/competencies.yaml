        "source_title": "INSTALL MECHATRONICS AND AUTOMATION DEVICES",
        "source_text": "--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          41       \nCORE COMPETENCIES \n \nUNIT TITLE \n: \n INSTALL MECHATRONICS AND AUTOMATION DEVICES \n \nUNIT CODE    \n   : \nELC311301 \n \nUNIT DESCRIPTOR  : \nThis unit covers the knowledge, skills and attitudes necessary to \ninstall mechatronics and automation devices. It includes \nplanning, preparing and installing mechatronics and automation \ndevices. This also includes testing of installed mechatronics and \nautomation devices.  \n \n                                          This unit supersedes the unit of competency with unit code \nELC724308 (Install mechatronics devices). \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare \nmechatronics \nand \nautomation \ndevices for \ninstallation \n1.1. Work instructions are read \nand interpreted to \ndetermine job \nrequirements. \n1.2. Tools and testing \ndevices needed to carry \nout the installation work \nare selected in \naccordance with \nestablished procedures \nand checked for correct \noperation and safety. \n1.3. Materials and devices \nnecessary to complete the \nwork are obtained in \naccordance with job \nrequirements. \n1.4. Components and devices \nare pre-tested in \naccordance to product \nspecifications \n Function, specification \nand configuration of Input \nand output of \nmechatronics and \nautomation devices \n Drawing and wiring circuit \ninterpretation \n Electrical and electronics \nsymbol applicable for \nmechatronics and \nautomation \n Set-up and testing \nmethodologies and \nprocedures \n International standards i.e \nIEC, JIC, JIS, DIN, UL, \nNEMA, ANSI, others. \n Different types of testing \ninstruments such as \nDMM, VOM etc. \n Safe handling of tools and \ndevices \n Type of wires, cables and \nconnectors \n Use of tools \n Use of test equipment/ \ninstruments \n Basic PLC Input/ Output \ndevices wiring and \ntermination  \n visual inspection for wear \nand tear \n Continuity test \n Function test  \n \n Reading skills \nrequired to \ninterpret work \ninstructions \n Checking \ndefective tools \nand equipment.  \n Communication \nskills needed to \ninterpret and \ndefine work \nprocedures \n Understand \ndrawing and \nwiring circuit \ndiagram \n Can understand \nand follow \ninstructional \nmanuals \n Visual inspection \nskills \n Perform proper \nuse of testing \ninstruments\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          42       \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Install \nmechatronics \nand \nautomation \ndevices \n2.1 Appropriate personal \nprotective equipment is \nworn in line with standard \noperating procedures. \n2.2 OH & S policies and \nprocedures for installation \nare followed in line with the \njob requirements. \n2.3 Devices are installed in \naccordance with \nmanufacturer’s \ninstructions, requirements, \nand without damage to the \nsurrounding place or \nenvironment \n2.4 Unplanned events or \nconditions are responded \nto in accordance with \nestablished procedures \n \n Usage of PPEs \n Safety procedures on \ninstallation of \nmechatronics and \nautomation devices \n OSHES policies and \nprocedures \n Manufacturer’s Installation \nstandards for \nmechatronics and \nautomation devices \no Handling of devices \no Wiring and termination \nrequirements \no Safety  \n Basic electricity & \nelectronics \n Identification of work and \nhealth hazards \n Use of installation tools \n \n Reading skills \nrequired to \ninterpret work \ninstructions \n Communication \nskills needed to \ninterpret and \ndefine work \nprocedures \n Understand \ndrawing and \nwiring circuit \ndiagram \n Can understand \nand follow \ninstructional \nmanuals \n Ability to properly \ninstall, wire and \nterminate \nmechatronics \ndevices \n \n3. Test installed \nmechatronics \nand \nautomation \ndevices \n3.1 Devices are tested in \naccordance with \nmanufacturer’s instruction \n3.2 Final inspections are \nundertaken to ensure that \nthe installed devices \nconform to manufacturer’s \ninstruction. \n3.3 Work site is cleaned and \ncleared of all debris and \nleft   safe in accordance \nwith the company \nrequirements \n3.4 Documentation (as-built) \non installation and testing \nof equipment is prepared in \naccordance with the \ncompany requirements. \n Safety procedures on \ntesting of devices \n Function test of installed \ndevices \n Physical inspection of \ndevices set-up. \n Occupational health and \nsafety/ 5S \n Applicable technical report \non device installation  \n \n Able to check \nfunctionality of \nmechatronics \nand automation \ndevices \n Checking \ndefective \nmechatronics \nand automation \ndevices.  \n Able to do \ncontinuity test \n Able to identify \nfault indicators \n Able to prepare \naccomplishment \nreport \n Able to identify \nhazards on \nworkplace\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          43       \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools \nTools may include: \n1.1. \nPliers; assorted \n1.2. \nScrewdrivers; assorted \n1.3. \nWrenches; assorted \n1.4. \nWire Stripper; assorted \n1.5. \nWire Crimper; Assorted \n2. Test equipment/instruments \nIncludes: \n2.1. \nMulti-tester \n2.1.1 Analog \n2.1.2 Digital \n \n3. Materials  \nMaterials may include: \n3.1. \nWires \n3.2. \nTerminal lugs \n3.3. \nTerminal blocks \n3.4. \nTerminal wire marker \n3.5. \nTubing \n3.6. \nTube fittings \n3.7. \nElectrical/Rubber Tape \n3.8. \nTeflon Tape \n4. Pre-testing of components \nand devices \nPre-testing may include: \n4.1. \nvisual inspection for wear and tear \n4.2. \nContinuity test \n \n5. Personal protective \nequipment (PPE) \nPPEs may include: \n5.1. \nSafety hat \n5.2. \nSafety shoes \n5.3. \nEar muffs \n5.4. \nGoggles \n5.5. \nSafety belt/Harness \n5.6. \nGloves \n5.7. \nFace Mask \n6. OH & S policies and \nprocedures \nOH & S policies and procedures may include: \n6.1. \nOH & S guidelines \n6.2. \nPhilippine environmental standards \n6.3. \nOSHE standards\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          44       \n \nVARIABLE \nRANGE \n7. Mechatronics and automation \ndevices \nMechatronics and automation devices may Include:  \n7.1. \nTransducers  \n7.2. \nPneumatic / Hydraulic Actuators \n7.3. \nBuzzers \n7.4. \nIndicating Lamps \n7.5. \nMagnetic contactors \n7.6. \nPhoto-sensors \n7.7. \nProximity sensors \n7.8. \nDirectional solenoid valves \n7.9. \nSwitches  \n7.9.1  Limit switches  \n7.9.2  Push button \n7.9.3  Toggle/Selector switches \n7.9.4  Etc.\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          45       \n \nEVIDENCE GUIDE \n \n1. Critical aspect of competency \nAssessment requires evidence that the candidate: \n1.1. \nRead and interpreted work instructions to \ndetermine job  requirements \n1.2. \nInstalled mechatronics and automation \ndevices according to manufacturer’s \ninstruction \n1.3. \nPre-tested components and devices in \naccordance to product specifications \n1.4. \nInstalled and tested mechatronics and \nautomation devices according to \nmanufacturer’s instruction \n1.5. \nTested installed mechatronics and \nautomation devices. \n1.6. \nPrepared documentation (as-built) on \ninstallation and testing of in accordance with \nthe company requirements. \n2. Method of assessment \n2.1. \nThe assessor may select two of the following \nassessment methods to objectively assess \nthe candidate: \n2.1.1. Direct Observation with oral \nquestioning  \n2.1.2. Demonstration with oral questioning \n2.1.3. Written Exam \n3. Resource Implication \nIncludes but not limited to: \n3.1. \nTools  \n3.2. \nTest equipment/instruments \n3.3. \nMechatronics devices \n3.4. \nMaterials  \n3.5. \nPPE \n3.6. \nTechnical manuals \n4. Context of Assessment \n4.1. \nAssessment may be conducted in the \nworkplace or in a simulated environment\n",
