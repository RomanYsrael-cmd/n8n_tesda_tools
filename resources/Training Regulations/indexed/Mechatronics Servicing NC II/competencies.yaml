ntation (as-built) on\ninstallation and testing of in accordance with\nthe company requirements.\n2. Method of assessment\n2.1.\nThe assessor may select two of the following\nassessment methods to objectively assess\nthe candidate:\n2.1.1. Direct Observation with oral\nquestioning\n2.1.2. Demonstration with oral questioning\n2.1.3. Written Exam\n3. Resource Implication\nIncludes but not limited to:\n3.1.\nTools\n3.2.\nTest equipment/instruments\n3.3.\nMechatronics devices\n3.4.\nMaterials\n3.5.\nPPE\n3.6.\nTechnical manuals\n4. Context of Assessment\n4.1.\nAssessment may be conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 46\nUNIT TITLE\n :\nCONFIGURE AND TEST MECHATRONICS AND\nAUTOMATION SYSTEM\n\nUNIT CODE\n :\nELC311302\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes needed to\nconfigure and test mechatronics and automation system. This\nincludes planning and preparing for configuration and testing,\nchecking and configuring mechatronics and automation system.\nThis also includes inspecting and testing the configured system.\n\n This unit supersedes the unit of competency with unit code\nELC724309 (Configure and adjusts mechatronics devices).\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold items are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\nconfiguration\nand testing of\nmechatronics\nand\nautomation\nsystem\n1.1. Configuration and testing\nare planned and prepared in\nline with job requirements.\n1.2. OHS policies and\nprocedures are followed in\nline with job requirements.\n1.3. Mechatronics and\nautomation devices for\nconfiguration & testing are\nchecked against\nspecifications and\nrequirements.\n1.4. Materials necessary to\ncomplete the work are\nobtained in accordance with\nestablished procedures and\nchecked against job\nrequirements.\n1.5. Tools, equipment and\ntesting devices needed for\nconfiguration & testing are\nobtained and checked for\ncorrect operation and safety\n1.6. Mechatronics and\nautomation system to be\nconfigured and tested are\nidentified from the Job/\nService Order or\ninstructions\n• Safety procedures\non configuration\nand testing of\nsystem\n• Application of OHS\n• Interpret\ninstructional\nmanuals, protocols\nand methodologies\n• Selection of\nappropriate\nmaterials for\nsystem application\n• Safe keeping of\ntools and\nequipment\n• Preventive\nmaintenance of\ntools and\nequipment\n• Different system\nfunctionality and\noperation\n\n• Reading and\ncommunication skills\nrequired to interpret\nwork instructions\n• Checking defective\ntools and equipment.\n• Understand drawing\nand wiring circuit\ndiagram\n• Can understand and\nfollow instructional\nmanuals\n• Able to analyze\nsystem\n• Calculation and\nmensuration skills\n• Able to identify\nhazards on\nworkplace\n2. Check and\nconfigure\nmechatronics\nand\nautomation\nsystem\n2.1. Appropriate personal\nprotective equipment is\nused and OHS policies and\nprocedures are followed\n2.2. Normal function of\nmechatronics and\n• Safety procedures\non configuration\nand testing of\nmechatronics and\nautomation system\n• Logic / Sequential\n• Reading and skills\nrequired to interpret\nwork instructions\n• Communication\nskills needed to\ninterpret and define\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 47\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold items are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nautomation system are\nchecked in accordance with\nmanufacturer’s instructions.\n2.3. Fault or problem in the\nsystem is diagnosed in line\nwith the standard operating\nprocedures.\n2.4. Mechatronics and\nautomation system are\nconfigured in line with the\nstandard operating\nprocedures.\n2.5. Unplanned events or\nconditions are responded to\nin accordance with\nestablished procedures\nCircuits\n• International\nStandards for block/\ncircuit diagram\napplicable to the\nsystem\n• Procedures and\nmethodologies on\nmechatronics and\nautomation system\nconfiguration\n• Identification of\nsafety and hazards\non mechatronics\nand automation\nsystem\n\nwork procedures\n• Understand drawing\nand wiring circuit\ndiagram\n• Can understand and\nfollow instructional\nmanuals\n• Able to analyze\nsystem\n• Able to utilize test\ninstruments\n• Able to do continuity\ntest\n• Able to identify fault\nindicators\n• Able to prepare\naccomplishment\nreport\n• Able to identify\nhazards on\nworkplace\n• Problem solving in\nemergency situation\n\n3. Inspect and\ntest the\nconfigured\nmechatronics\nand\nautomation\nsystem\n3.1. Final inspections are\nundertaken to ensure that\nthe adjustment & testing\ndone on the system\nconforms with design\nrequirement\n3.2. Configured mechatronics\nand automation system are\ntested to ensure safe\noperation.\n3.3. When necessary, problems\nare referred to appropriate\npersonnel.\n3.4. Documentation (as-built) is\nprepared/completed in\naccordance with the\ncompany requirements\n• Final inspections\nprocedures\n• Final wiring, and\ntermination\nprocedures\n• Final testing\nprocedures\n• Technical reports\ni.e daily\naccomplishment,\nservice, progress\netc.\n\n• Communication\nskills needed to\ninterpret and define\nwork procedures\n• Can understand and\nfollow instructional\nmanuals and test\nprotocols\n• Able to analyze\nsystem\n• Able to utilize test\ninstruments\n• Able to do continuity\ntest\n• Able to identify fault\nindicators\n• Able to prepare\naccomplishment\nreport\n• Able to identify\nhazards on\nworkplace\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH & S policies and\nprocedures\nOH & S policies and procedures may include:\n1.1.\nOH & S guidelines\n1.2.\nPhilippine environmental standards\n1.3.\nOSHE standards\n2. Mechatronics and\nautomation devices\nMay include the following but not limited to:\n2.1.1 Transducers\n2.1.2 Pneumatic / Hydraulic Actuators\n2.1.3 Buzzers\n2.1.4 Indicating Lamps\n2.1.5 Magnetic contactors\n2.1.6 Photo-sensors\n2.1.7 Proximity sensors\n2.1.8 Directional solenoid valves\n2.1.9 Switches\n2.1.9.1 Limit switches\n2.1.9.2 Push Button\n2.1.9.3 Toggle/ Selector Switches, etc.\n3. Materials\nMaterials may include:\n3.1. Wires\n3.2. Terminal lugs\n3.3. Terminal blocks\n3.4. Terminal wire marker\n\n3.5. Tubing\n3.6. Tube fittings\n3.7. Teflon tape\n3.8. Electrical Tape\n3.9. Rubber Tape\n4. Tools\nTools may include:\n4.1 Pliers; assorted\n4.2 Screwdrivers; assorted\n4.3 Wrenches; assorted\n4.4 Wire stripper;\n4.5 Wire Crimper;\n5 Test equipment/\ninstruments\nInclude the following but not limited to:\n5.1 Multi-tester\n5.1.1 Analog\n5.1.2 Digital\n6 Personal protective\nequipment (PPE)\nPPEs may include:\n6.1 Safety hat\n6.2 Safety shoes\n6.3 Ear muffs\n6.4 Goggles\n\n6.5 Safety belt/Harness\n6.6 Gloves\n6.7 Face/Nose Mask\n6.8 Safety Mask\n7 Appropriate Personnel\nAppropriate personnel may include:\n7.1 Immediate Superior\n7.2 Senior Technician\n7.3 Maintenance Personnel\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 49\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nSelected, checked, and used tools equipment and\ntesting devices needed for configuration and testing\nfor correct operation and safety\n1.2.\nChecked mechatronics and automation devices for\nconfiguration and testing to conform to the\nspecifications and requirements\n1.3.\nIdentified and tested mechatronics system to be\nconfigured\n1.4.\nConfigured identified mechatronics and automation\nsystem\n1.5.\nDiagnosed faults or problems on the devices\n1.6.\nInspected and tested the configured mechatronics\nand automation system\n1.7.\nPrepared/completed documentation in accordance\nwith the company requirements\n2. Method of assessment\n2.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Direct Observation with oral questioning\n2.1.2. Demonstration with oral questioning\n2.1.3. Written Examination\n3. Resource Implication\nIncludes but not limited to\n3.1. Tools\n3.2. Test equipment/instruments\n3.3. Field devices\n3.4. Materials\n3.5. PPE\n3.6. Technical manuals\n4. Context of Assessment\n4.1.\nAssessment may be conducted in the workplace or\nin a simulated work environment\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 50"
