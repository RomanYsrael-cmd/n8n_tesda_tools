laborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ntasks to be\nundertaken\n1.1. Tasks to be undertaken are\nproperly identified\n1.2. Appropriate hand tools are\nidentified and selected according\nto the task requirements\n• Planning and preparing\ntask/ activity\n• Electronics hand tools\nand their uses\n• Function, operation and\ncommon faults in\nelectronics hand tools\n• Preparing\nrequired tasks\n• Communication\nskills\n• Using hand tools\nproperly\n2. Prepare\nhand tools\n2.1. Appropriate hand tools are\nchecked for proper operation and\nsafety\n2.2. Unsafe or faulty tools are\nidentified and marked for repair\naccording to standard company\nprocedure\n• Checking and safety\nrequirements in handling\ntools\n• Standard procedures in\nchecking, identification\nand marking of safe or\nunsafe/ faulty tools\n• Identifying and\nchecking hand\ntools\n• Marking of safe\nor unsafe/ faulty\nhand tools\n3. Use\nappropriate\nhand tools\nand test\nequipment\n3.1. Tools are used according to\ntasks undertaken\n3.2. All safety procedures in using\ntools are observed at all times\nand appropriate personal\nprotective equipment (PPE) are\nused\n3.3. Malfunctions, unplanned or\nunusual events are reported to\nthe supervisor\n• Safety requirements in\nusing electronics hand\ntools and test equipment\n• Electronics hand tools\nfor adjusting,\ndismantling, assembling,\nfinishing, and cutting.\n• Processes, Operations,\nSystems\no Proper usage and\ncare of hand tools\no Types and uses of\ntest equipment\n• Common faults in the\nuse of hand tool\n• Reading skills\nrequired to\ninterpret work\ninstruction and\nnumerical skills\n• Using PPE\nproperly\n• Problem solving\nin emergency\nsituation\n4. Maintain\nhand tools\n4.1. Tools are not dropped to avoid\ndamage\n4.2. Routine maintenance of tools\nundertaken according to standard\noperational procedures, principles\nand techniques\n4.3. Tools are stored safely in\nappropriate locations in\naccordance with manufacturer’s\nspecifications or standard\noperating procedures\n• Safety requirements in\nmaintenance of hand\ntools\n• Processes, Operations,\nSystems\no Maintenance of tools\no Storage of hand\ntools\n\n• Checking and\ncleaning hand\ntools\n• Storing hand\ntools properly\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\n1.1. Hand tools for adjusting, dismantling, assembling,\nfinishing, and cutting. Tool set includes the following\nbut not limited to: screw drivers, pliers, punches,\nwrenches, files\n2. Personal Protective\nEquipment (PPE)\n2.1. Gloves\n2.2. Protective eyewear\n2.3.\nApron/overall\n3. Maintenance\n3.1. Cleaning\n3.2. Lubricating\n3.3. Tightening\n3.4. Simple tool repairs\n3.5. Hand sharpening\n3.6.\nAdjustment using correct procedures\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes, events or\ntasks being undertaken to ensure a safe and efficient\nworking environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate location\n2. Method of\nassessment\nCompetency in this unit must be assessed through:\n2.1. Observation\n2.2. Oral questioning\n3. Resource Implication\nTools may include the following but not limited to:\n3.1. screw drivers\n3.2. pliers\n3.3. punches\n3.4. wrenches, files\n4. Context of\nAssessment\n4.1. Assessment may be conducted in the workplace or in\na simulated work environment\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 18\nUNIT TITLE\n:\nPERFORM MENSURATION AND CALCULATION\nUNIT CODE\n: ELC311201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded identify, care, handle and use measuring instruments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Select\nmeasuring\ninstruments\n1.1. Object or component to be\nmeasured is identified\n1.2. Correct specifications are\nobtained from relevant\nsource\n1.3. Measuring tools are selected\nin line with job requirements\n\n• Category of measuring\ninstruments\n• Types and uses of\nmeasuring instruments\n• Shapes and\nDimensions\n• Formulas for volume,\nareas, perimeters of\nplane and geometric\nfigures\n• Identifying and\nselecting\nmeasuring\ninstruments\n• Visualizing\nobjects and\nshapes\n2. Carry out\nmeasurements\nand calculation\n2.1. Appropriate measuring\ninstrument is selected to\nachieve required outcome\n2.2. Accurate measurements are\nobtained for job\n2.3. Calculation needed to\ncomplete work tasks are\nperformed using the four\nbasic process of addition (+),\nsubtraction (-), multiplication\n(x), and division (/)\n2.4. Calculation involving\nfractions, percentages and\nmixed numbers are used to\ncomplete workplace tasks.\n2.5. Numerical computation is\nself-checked and corrected\nfor accuracy\n2.6. Instruments are read to the\nlimit of accuracy of the tool.\n• Calculation &\nmeasurement\n• Four fundamental\noperation\n• Linear measurement\n• Dimensions\n• Unit conversion\n• Ratio and proportion\n\n• Performing\ncalculation by\naddition,\nsubtraction,\nmultiplication\nand division;\n• Interpreting\nformulas for\nvolume, areas,\nperimeters of\nplane and\ngeometric\nfigures\n• Handling of\nmeasuring\ninstruments\n3. Maintain\nmeasuring\ninstruments\n3.1.\nMeasuring instruments are\nnot dropped to avoid\ndamage\n3.2.\nMeasuring instruments are\ncleaned before and after\nusing.\n3.3.\nProper storage of\ninstruments undertaken\naccording to manufacturer’s\nspecifications and standard\noperating procedures.\n• Types of measuring\ninstruments and their\nuses\n• Safe handling\nprocedures in using\nmeasuring instruments\n• Four fundamental\noperation of\nmathematics\n• Formula for volume,\narea, perimeter and\nother geometric figures\n• Handling and\nmaintaining\nmeasuring\ninstruments\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\n1.1. Straight edge\n1.2. Torque gauge\n1.3. Try square\n1.4. Protractor\n1.5. Combination gauge\n1.6.\nSteel rule\n2. Calculation\n\nKinds of part mensuration includes the following\nbut not limited to:\n2.1. Volume\n2.2. Area\n2.3. Displacement\n2.4. Inside diameter\n2.5. Circumference\n2.6. Length\n2.7. Thickness\n2.8. Outside diameter\n2.9. Taper\n2.10. Out of roundness\n\nEVIDENCE GUIDE\n\n1. Critical aspect of competency\nAssessment requires evidence that the candidate:\n1.1. Selected proper measuring instruments\naccording to tasks\n1.2. Carried out measurement and calculations\n1.3. Maintained and stores instruments\n2. Method of assessment\nCompetency in this unit must be assessed through:\n2.1. Observation\n2.2. Oral questioning\n\n3. Resource implication\n3.1. Place of assessment\n3.2. Measuring instruments\n3.3. Straight edge\n3.4. Torque gauge\n3.5. Try square\n3.6. Protractor\n3.7. Combination gauge\n3.8. Steel rule\n4. Context of Assessment\n4.1. Assessment may be conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 20\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\n\nUNIT CODE\n: ELC311202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded to prepare/interpret diagrams, engineering abbreviation\nand drawings, symbols, dimension.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Identify\ndifferent\nkinds of\ntechnical\ndrawings\n1.1. Correct technical drawing is\nselected according to job\nrequirements.\n1.2. Technical drawings are\nsegregated in accordance\nwith the types and kinds of\ndrawings\n• Types of technical\ndrawings\n• Applications for technical\ndrawing\n• Methods of technical\ndrawings\n• Symbols\n• Mark up/Notation of\nDrawings\n\n• Reading skills\nrequired to interpret\nwork instruction\n• Interpreting\nelectrical/ electronic\nsigns and symbols\n2. Interpret\ntechnical\ndrawing\n2.1. Components, assemblies or\nobjects are recognized as\nrequired.\n2.2. Dimensions of the key\nfeatures of the objects\ndepicted in the drawing are\ncorrectly identified.\n2.3. Symbols used in the\ndrawing are identified and\ninterpreted correctly.\n2.4. Drawing is checked and\nvalidated against job\nrequirements or equipment in\naccordance with standard\noperating procedures.\n\n• Trade Mathematics\no Linear measurement\no Dimension\no Unit conversion\n• Blueprint Reading and\nPlan Specification\no Architectural,\nelectrical, electronics,\nmechanical plan,\nsymbols and\nabbreviations\no Drawing standard\nsymbols\n• Trade Theory\no Basic technical\ndrawing\no Types technical plans\no Various types of\ndrawings\no Notes and\nspecifications\n\n• Interpreting\ndrawing/\northographic\ndrawing\n• Interpreting\ntechnical plans\n• Matching\nspecification details\nwith existing\nresources\n• Safety handling of\ndrawing\ninstruments\n\n3. Prepare/\nmake\nchanges to\nelectrical/\nelectronic\nschematics\nand\ndrawings\n3.1. Electrical/electronic\nschematic is drawn and\ncorrectly identified.\n3.2. Correct drawing is identified,\nequipment are selected and\nused in accordance with job\nrequirements.\n• Drawing conventions\n• Dimensioning\nConventions\n• Mathematics\no Four fundamental\noperations\no Percentage\no Fraction\no Algebra\no Geometry\n\n• Reading skills\nrequired to interpret\nwork instruction\n• Communication\nskills\n• Preparing/ Making\nelectrical/ electronic\nsigns and symbols\n• Computing\nformulas\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 21\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n4. Store\ntechnical\ndrawings\nand\nequipment/\ninstruments\n4.1. Care and maintenance of\ndrawings are undertaken\naccording to company\nprocedures.\n4.2. Technical drawings are\nrecorded and inventory is\nprepared in accordance with\ncompany procedures.\n4.3. Proper storage of\ninstruments is undertaken\naccording to company\nprocedures.\n• Effective ways to\ncatalogue and store\ntechnical drawings\n• Manual methods of\nhandling, storing and\nmaintaining paper\ndrawings\n• Storing drawing in digital\nforms\no Scanner\no CAD\n\n• Handling and\nstoring of drawings\n• Scanning and\nstoring drawings in\ndigital form\n• Matching\nspecification details\nwith existing\nresources\n• Handling of drawing\ninstruments\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical drawings\nTechnical drawings include the following but not\nlimited to:\n\n1.1. Schematic diagrams\n1.2. Charts\n1.3. Block diagrams\n1.4. Lay-out plans\n1.5. Location plans\n1.6. Process and instrumentation diagrams\n1.7. Loop diagrams\n1.8. System Control Diagrams\n2. Dimensions\nDimensions may include but not limited to:\n\n2.1. Length\n2.2. Width\n2.3. Height\n2.4. Diameter\n2.5. Angles\n3. Symbols\nMay include but not limited to:\n\n3.1. NEC- National Electric Code\n3.2. IEC -International Electrotechnical\nCommission\n3.3. ASME - American Society of Mechanical\nEngineers\n3.4. IEEE - Institute of Electrical and\nElectronics Engineers\n3.5. ISA - Instrumentation System and\nAutomation Society\n4. Instruments/Equipment\n4.1. Components/dividers\n4.2. Drawing boards\n4.3. Rulers\n4.4. T-square\n4.5. Calculator\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 23\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetencies\nAssessment requires evidence that the candidate:\n1.1. selected correct technical drawing in line with\njob requirements\n1.2. correctly identified the objects represented in\nthe drawing\n1.3. identified and interpreted symbols used in the\ndrawing correctly\n1.4. prepared/produced electrical/electronic\ndrawings including all relevant specifications\n1.5. stored diagrams/equipment\n2. Method of assessment\nCompetency in this unit must be assessed through:\n\n2.1. Practical tasks involving interpretation of a\nrange of technical drawings\n2.2. Oral questioning\n3. Resource implication\n3.1. Drawings\n3.2. Diagrams\n3.3. Charts\n3.4. Plans\n4. Context of Assessment\n4.1 Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 24\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nELC311204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and values\nneeded to apply quality standards in the workplace. The unit also\nincludes the application of relevant safety procedures and\nregulations, organization procedures and customer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess\nquality of\nreceived\nmaterials or\ncomponents\n1.1. Work instructions are\nobtained and work is carried\nout in accordance with\nstandard operating\nprocedures\n1.2. Received materials or\ncomponent parts are\nchecked against workplace\nstandards and specifications\n1.3. Faulty material or\ncomponents related to work\nare identified and isolated\n1.4. Faults and any identified\ncauses are recorded and/or\nreported to the supervisor\nconcerned in accordance\nwith workplace procedures\n1.5. Faulty materials or\ncomponents are replaced in\naccordance with workplace\nprocedures\n• Relevant production\nprocesses, materials\nand products\n• Characteristics of\nmaterials, software\nand hardware used in\nproduction processes\n• Quality checking\nprocedures\n• Quality Workplace\nprocedures\n• Identification of faulty\nmaterials related to\nwork\n\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Critical thinking\n• Interpreting work\ninstructions\n2. Assess own\nwork\n2.1. Documentation relative to\nquality within the company is\nidentified and used\n2.2. Completed work is checked\nagainst workplace standards\nrelevant to the task\nundertaken\n2.3. Faulty pieces are identified\nand isolated\n2.4. Information on the quality\nand other indicators of\nproduction performance is\nrecorded in accordance with\nworkplace procedures\n2.5. In cases of deviations from\nspecified quality standards,\ncauses are documented and\nreported in accordance with\nthe workplace’ standards\noperating procedures\n• Safety and\nenvironmental\naspects of production\nprocesses\n• Fault identification\nand reporting\n• Workplace procedure\nin documenting\ncompleted work\n• Workplace Quality\nIndicators\n• Carry out work in\naccordance with\nOHS policies\nand procedures\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 25\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Engage in\nquality\nimprovement\n3.1. Process improvement\nprocedures are participated\nin relation to workplace\nassignment\n3.2. Work is carried out in\naccordance with process\nimprovement procedures\n3.3. Performance of operation or\nquality of product or service\nto ensure customer\nsatisfaction is monitored\n• Quality improvement\nprocesses\n• Company customers\ndefined\n• Solution\nproviding and\ndecision-making\n• Practice\ncompany\nprocess\nimprovement\nprocedure\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 26\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. wires\n1.1.2. cables, soldering lead\n1.1.3. electrical tape\n1.2. Components may include but not limited to:\n1.2.1. ICs\n1.2.2. Diodes\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to specification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Quality standards\n4.1. Quality standards may relate but not limited to the\nfollowing:\n4.1.1. materials\n4.1.2. component parts\n4.1.3. final product\n4.1.4. production processes\n5. Customer\n5.1. Co-worker\n5.2. Supplier\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 27\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Method of assessment\n2.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Observation\n2.1.2. Questioning\n2.1.3. Practical demonstration\n3. Resource implication\n\n3.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n4. Context of Assessment\n\n4.1. Assessment may be conducted in the workplace\nor in a simulated environment.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 28\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n:\nELC311203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and values\nneeded to perform computer operations which include inputting,\naccessing, producing and transferring data using the appropriate\nhardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ntask to be\nundertaken\n1.1. Requirements of task are\ndetermined\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned\nand required outcome\n1.3. Task is planned to ensure\nOH&S guidelines and\nprocedures are followed\n• Main types of\ncomputers and basic\nfeatures of different\noperating systems\n• Main parts of a\ncomputer\n• Information on\nhardware and\nsoftware\n• Data security\nguidelines\n• Reading and\ncomprehension\nskills required to\ninterpret work\ninstruction and to\ninterpret basic user\nmanuals.\n• Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n• Interpreting user\nmanuals and\nsecurity guidelines\n2. Input data\ninto\ncomputer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating\nprocedures\n2.3. Inputted data are stored in\nstorage media according\nto requirements\n2.4. Work is performed within\nergonomic guidelines\n• Basic ergonomics of\nkeyboard and\ncomputer user\n• Storage devices and\nbasic categories of\nmemory\n• Relevant types of\nsoftware\n• Technology skills\nto use equipment\nsafely including\nkeyboard skills.\n• Entering data\n3. Access\ninformation\nusing\ncomputer\n3.1. Correct\nprogram/application is\nselected based on job\nrequirements\n3.2. Program/application\ncontaining the information\nrequired is accessed\naccording to company\nprocedures\n3.3. Desktop icons are\ncorrectly selected, opened\nand closed for navigation\n• General security,\nprivacy legislation\nand copyright\n• Productivity\nApplication\n• Business Application\n• Accessing\ninformation\n• Searching and\nbrowsing files and\ndata\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 29\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\npurposes\n3.4. Keyboard techniques are\ncarried out in line with\nOH&S requirements for\nsafe use of keyboards\n4. Produce/\noutput data\nusing\ncomputer\nsystem\n4.1. Entered data are\nprocessed using\nappropriate software\ncommands\n4.2. Data printed out as\nrequired using computer\nhardware/peripheral\ndevices in accordance with\nstandard operating\nprocedures\n4.3. Files, data are transferred\nbetween compatible\nsystems using computer\nsoftware, hardware/\nperipheral devices in\naccordance with standard\noperating procedures\n• Computer application\nin printing, scanning\nand sending facsimile\n• Types and function of\ncomputer peripheral\ndevices\n• Computer data\nprocessing\n• Printing of data\n• Tra