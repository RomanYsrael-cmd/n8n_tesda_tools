nication\n• Workplace\ninteractions\n• Non verbal\ncommunication\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Interpersonal\ncommunication skill\n• Observing meeting\nprotocols\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of employment\nare asked and responded to\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n3. Complete\nrelevant\nwork related\ndocuments\n3.1 Range of forms relating to\nconditions of employment\nare completed accurately\nand legibly\n3.2 Workplace data is recorded\non standard workplace\nforms and documents\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements to\nsupervisor are completed\naccording to organizational\nguidelines\n• Technology relevant\nto the enterprise and\nthe individual’s work\n• Types of workplace\ndocuments and\nforms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n\n• Apply basic\nmathematical\nprocesses of\naddition, subtraction,\ndivision and\nmultiplication\n• Data recording\n• Report writing\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\