        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value (TLV).\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 16\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
        },
        "source_text": "500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and\nsafety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nhazards and\nrisks\n1.1 Safety regulations and\nworkplace safety and hazard\ncontrol practices and procedures\nare clarified and explained\nbased on organization\nprocedures\n1.2 Hazards/risks in the workplace\nand their corresponding\nindicators are identified to\nminimize or eliminate risk to co-\nworkers, workplace and\nenvironment in accordance with\norganization procedures\n1.3 Contingency measures during\nworkplace accidents, fire and\nother emergencies are\nrecognized and established in\naccordance with organization\nprocedures\n\n• OHS procedures\nand practices and\nregulations\n• Hazards/risks\nidentification and\ncontrol\n• OHS indicators\n• Organizational\ncontingency\npractices\n\n• Hazards/risks\nidentification and\ncontrol skills\n• Practice of safety\nand health\nprocedures and\npersonal hygiene\n\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of maximum tolerable\nlimits which when exceeded will\nresult in harm or damage are\nidentified based on threshold\nlimit values (TLV)\n2.2 Effects of the hazards are\ndetermined\n2.3 OHS issues and/or concerns\nand identified safety hazards are\nreported to designated\npersonnel in accordance with\nworkplace requirements and\nrelevant workplace OHS\nlegislation\n\n• Threshold Limit\nValue (TLV)\n• Effects of safety\nhazards\n\n• Communication\nskills\n• Reporting safety\nhazards\n3. Control\nhazards and\nrisks\n3.1 Occupational Health and Safety\n(OHS) procedures for controlling\nhazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with\nworkplace accidents, fire and\nemergencies are followed in\naccordance with organization\nOHS policies\n• Personal hygiene\npractices\n• Organization safety\nand health protocol\n• Company\nemergency\nprocedure practices\n• Practice of\npersonal hygiene\n• Respond to\nemergency\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n3.3 Personal protective equipment\n(PPE) is correctly used in\naccordance with organization\nOHS procedures and practices\n3.4 Appropriate assistance is\nprovided in the event of a\nworkplace emergency in\naccordance with established\norganization protocol\n\n4. Maintain\nOHS\nawareness\n4.1 Emergency-related drills and\ntrainings are participated in as\nper established organization\nguidelines and procedures\n4.2 OHS personal records are\ncompleted and updated in\naccordance with workplace\nrequirements\n\n• Workplace OHS\npersonal records\n• Information on\nemergency-related\ndrills\n• Practice\nemergency-\nrelated drill skills\nin the workplace\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/\nexcessive force, awkward/static positions,\nfatigue, direct pressure, varying metabolic\ncycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 14\n\nVARIABLE\nRANGE\n\n5. Emergency-related drills\nand training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 15\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value (TLV).\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 16\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
