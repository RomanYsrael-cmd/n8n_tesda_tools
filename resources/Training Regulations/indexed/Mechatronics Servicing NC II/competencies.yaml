-------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 41\nCORE COMPETENCIES\n\nUNIT TITLE\n:\n INSTALL MECHATRONICS AND AUTOMATION DEVICES\n\nUNIT CODE\n :\nELC311301\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes necessary to\ninstall mechatronics and automation devices. It includes\nplanning, preparing and installing mechatronics and automation\ndevices. This also includes testing of installed mechatronics and\nautomation devices.\n\n This unit supersedes the unit of competency with unit code\nELC724308 (Install mechatronics devices).\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare\nmechatronics\nand\nautomation\ndevices for\ninstallation\n1.1. Work instructions are read\nand interpreted to\ndetermine job\nrequirements.\n1.2. Tools and testing\ndevices needed to carry\nout the installation work\nare selected in\naccordance with\nestablished procedures\nand checked for correct\noperation and safety.\n1.3. Materials and devices\nnecessary to complete the\nwork are obtained in\naccordance with job\nrequirements.\n1.4. Components and devices\nare pre-tested in\naccordance to product\nspecifications\n• Function, specification\nand configuration of Input\nand output of\nmechatronics and\nautomation devices\n• Drawing and wiring circuit\ninterpretation\n• Electrical and electronics\nsymbol applicable for\nmechatronics and\nautomation\n• Set-up and testing\nmethodologies and\nprocedures\n• International standards i.e\nIEC, JIC, JIS, DIN, UL,\nNEMA, ANSI, others.\n• Different types of testing\ninstruments such as\nDMM, VOM etc.\n• Safe handling of tools and\ndevices\n• Type of wires, cables and\nconnectors\n• Use of tools\n• Use of test equipment/\ninstruments\n• Basic PLC Input/ Output\ndevices wiring and\ntermination\n• visual inspection for wear\nand tear\n• Continuity test\n• Function test\n\n• Reading skills\nrequired to\ninterpret work\ninstructions\n• Checking\ndefective tools\nand equipment.\n• Communication\nskills needed to\ninterpret and\ndefine work\nprocedures\n• Understand\ndrawing and\nwiring circuit\ndiagram\n• Can understand\nand follow\ninstructional\nmanuals\n• Visual inspection\nskills\n• Perform proper\nuse of testing\ninstruments\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 42\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Install\nmechatronics\nand\nautomation\ndevices\n2.1 Appropriate personal\nprotective equipment is\nworn in line with standard\noperating procedures.\n2.2 OH & S policies and\nprocedures for installation\nare followed in line with the\njob requirements.\n2.3 Devices are installed in\naccordance with\nmanufacturer’s\ninstructions, requirements,\nand without damage to the\nsurrounding place or\nenvironment\n2.4 Unplanned events or\nconditions are responded\nto in accordance with\nestablished procedures\n\n• Usage of PPEs\n• Safety procedures on\ninstallation of\nmechatronics and\nautomation devices\n• OSHES policies and\nprocedures\n• Manufacturer’s Installation\nstandards for\nmechatronics and\nautomation devices\no Handling of devices\no Wiring and termination\nrequirements\no Safety\n• Basic electricity &\nelectronics\n• Identification of work and\nhealth hazards\n• Use of installation tools\n\n• Reading skills\nrequired to\ninterpret work\ninstructions\n• Communication\nskills needed to\ninterpret and\ndefine work\nprocedures\n• Understand\ndrawing and\nwiring circuit\ndiagram\n• Can unders