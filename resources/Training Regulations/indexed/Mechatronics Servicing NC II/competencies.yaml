7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 31\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly and\naccording to the task requirement\n1.2. Identified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3. Produced accurate and complete data in accordance\nwith the requirements\n1.4. Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5. Maintained computer system\n2. Method of assessment\n2.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1. Observation\n2.1.2. Questioning\n2.1.3. Practical demonstration\n3. Resource implication\n3.1. Computer hardware with peripherals\n3.2. Appropriate software\n4. Context of Assessment\n4.1.\nAssessment may be conducted in the workplace or in\na simulated work environment\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 32\nUNIT TITLE\n:\nTERMINATE AND CONNECT ELECTRICAL WIRING AND\nELECTRONICS CIRCUIT\nUNIT CODE\n:\nELC311206\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and values\nneeded to terminate and connect electrical wiring and electronic\ncircuits\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in