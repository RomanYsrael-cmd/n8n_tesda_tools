orted to \nthe supervisor \n Safety requirements in \nusing electronics hand \ntools and test equipment  \n Electronics hand tools \nfor adjusting, \ndismantling, assembling, \nfinishing, and cutting. \n Processes, Operations, \nSystems \no Proper usage and \ncare of hand tools \no Types and uses of \ntest equipment \n Common faults in the \nuse of hand tool \n Reading skills \nrequired to  \ninterpret work \ninstruction and \nnumerical skills \n Using PPE \nproperly \n Problem solving \nin emergency \nsituation \n4. Maintain \nhand tools  \n4.1. Tools are not dropped to avoid \ndamage \n4.2. Routine maintenance of tools \nundertaken according to standard \noperational procedures, principles \nand techniques \n4.3. Tools are stored safely in \nappropriate locations in \naccordance with manufacturer’s \nspecifications or standard \noperating procedures \n Safety requirements in \nmaintenance of hand \ntools   \n Processes, Operations, \nSystems \no Maintenance of tools \no Storage of hand \ntools \n \n Checking and \ncleaning  hand \ntools \n Storing hand \ntools properly\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          17       \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hand tools \n1.1. Hand tools for adjusting, dismantling, assembling, \nfinishing, and cutting. Tool set includes the following \nbut not limited to: screw drivers, pliers, punches, \nwrenches, files\n2. Personal Protective \nEquipment (PPE) \n2.1. Gloves \n2.2. Protective eyewear \n2.3.\nApron/overall\n3. Maintenance \n3.1. Cleaning \n3.2. Lubricating \n3.3. Tightening \n3.4. Simple tool repairs \n3.5. Hand sharpening \n3.6.\nAdjustment using correct procedures\n \n \n \n \nEVIDENCE GUID