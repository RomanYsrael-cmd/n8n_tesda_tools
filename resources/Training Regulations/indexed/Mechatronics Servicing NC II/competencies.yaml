        "source_title": "PERFORM MENSURATION AND CALCULATION",
        "source_text": "--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          18       \nUNIT TITLE \n: \nPERFORM MENSURATION AND CALCULATION \nUNIT CODE \n:    ELC311201  \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes and values \nneeded identify, care, handle and use measuring instruments \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Select \nmeasuring \ninstruments \n1.1. Object or component to be \nmeasured is identified \n1.2. Correct specifications are \nobtained from relevant \nsource \n1.3. Measuring tools are selected \nin line with job requirements \n \n Category of measuring \ninstruments \n Types and uses of \nmeasuring instruments \n Shapes and \nDimensions \n Formulas for volume, \nareas, perimeters of \nplane and geometric \nfigures \n Identifying and \nselecting \nmeasuring \ninstruments \n Visualizing \nobjects and \nshapes \n2. Carry out \nmeasurements \nand calculation \n2.1. Appropriate measuring \ninstrument is selected to \nachieve required outcome \n2.2. Accurate measurements are \nobtained for job \n2.3. Calculation needed to \ncomplete work tasks are \nperformed using the four \nbasic process of addition (+), \nsubtraction (-), multiplication \n(x), and division (/) \n2.4. Calculation involving \nfractions, percentages and \nmixed numbers are used to \ncomplete workplace tasks. \n2.5. Numerical computation is \nself-checked and corrected \nfor accuracy \n2.6. Instruments are read to the \nlimit of accuracy of the tool. \n Calculation & \nmeasurement \n Four fundamental \noperation \n Linear measurement \n Dimensions \n Unit conversion \n Ratio and proportion \n \n Performing \ncalculation by \naddition, \nsubtraction, \nmultiplication \nand division;  \n Interpreting \nformulas for \nvolume, areas, \nperimeters of \nplane and \ngeometric \nfigures \n Handling of \nmeasuring \ninstruments \n3. Maintain \nmeasuring \ninstruments \n3.1. \nMeasuring instruments are \nnot dropped to avoid \ndamage \n3.2. \nMeasuring instruments are \ncleaned before and after \nusing. \n3.3. \nProper storage of \ninstruments undertaken \naccording to manufacturer’s \nspecifications and standard \noperating procedures. \n Types of measuring \ninstruments and their \nuses \n Safe handling \nprocedures in using \nmeasuring instruments \n Four fundamental \noperation of \nmathematics \n Formula for volume, \narea, perimeter and \nother geometric figures \n Handling and \nmaintaining  \nmeasuring \ninstruments\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – MECHATRONICS SERVICING NC II (Amended)        Promulgated     June 16, 2015                                          19       \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Measuring instruments \n1.1. Straight edge \n1.2. Torque gauge \n1.3. Try square \n1.4. Protractor \n1.5. Combination gauge \n1.6.\nSteel rule\n2. Calculation \n \nKinds of part mensuration includes the following \nbut not limited to:  \n2.1. Volume \n2.2. Area \n2.3. Displacement \n2.4. Inside diameter \n2.5. Circumference \n2.6. Length \n2.7. Thickness \n2.8. Outside diameter \n2.9. Taper \n2.10. Out of roundness\n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of competency \nAssessment requires evidence that the candidate: \n1.1. Selected proper measuring instruments \naccording to tasks \n1.2. Carried out measurement and calculations \n1.3. Maintained and stores instruments  \n2. Method of assessment \nCompetency in this unit must be assessed through:\n2.1. Observation  \n2.2. Oral questioning \n \n3. Resource implication \n3.1. Place of assessment \n3.2. Measuring instruments   \n3.3. Straight edge \n3.4. Torque gauge \n3.5. Try square \n3.6. Protractor \n3.7. Combination gauge \n3.8. Steel rule \n4. Context of Assessment \n4.1. Assessment may be conducted in the \nworkplace or in a simulated environment\n",
