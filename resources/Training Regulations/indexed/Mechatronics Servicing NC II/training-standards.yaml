    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Mechatronics Servicing NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: Mechatronics Servicing\n\nNC Level: NC II\n\nNominal Training Duration:\n18 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n80 hrs – Core Competencies\n\n ----------\n\n 158 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\na mechatronics and automation technician, in accordance with industry standards. It\ncovers the basic & common competencies in addition to the core competencies such as\ninstalling, configuring & testing mechatronics and automation devices/system.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 51\nBASIC COMPETENCIES\n(18 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective communication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and systems\n• Technology relevant to\nenterprise and\nindividual’s work\nresponsibilities\n• Sources of information\n• Types of question\n• Medium of communication\n• Flow of communication\n• Storage system\n•Telephone courtesy\n• Follow simple spoken\nlanguage\n• Perform routine workplace\nduties following simple\nwritten notices\n• Participate in workplace\nmeetings and discussions\n• Complete work related\ndocuments\n• Ability to relate to people of\nsocial range in the\nworkplace\n• Gather and provide\ninformation in response to\nworkplace requirements\n• Group\ndiscussion\n• Role Play\n• Demonstration\n• Oral Interview\n• Written test\n• Demonstration\n4 hours\n1.2 Complete\nrelevant work\nrelated\ndocuments\n\n• Communication\nprocedures and systems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of communication\n• Workplace interactions\n• Non verbal\ncommunication\n• Follow simple spoken\nlanguage\n• Perform routine workplace\nduties\n• Participate in workplace\nmeetings and discussions\n• Complete work related\ndocuments\n• Estimate, calculate and\nrecord routine workplace\nmeasures\n• Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n• Role Play\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n\n--- PDF PAGE 56 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 52\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Relate to people of social\nrange in the workplace\n• Gather and provide\ninformation in response to\nworkplace requirements\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Technology relevant to\nenterprise and\nindividual’s work\nresponsibilities\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace report\n\n• Follow simple spoken\nlanguage\n• Ability to relate to people of\nsocial range in the\nworkplace\n• Gather and provide\ninformation in response to\nworkplace requirements\n• Interaction\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility\nin a team.\n• Definition of Team\n• Difference between team\nand group\n• Different sources of\ninformation\n• Objectives and goals of\nteam\n• Describing the team role\nand scope\n• Discussion\n\n• Demonstration\n• Observation\n\n4 hours\n2.2 Describe\nwork as a team\nmember\n• Team goals and\nobjectives\n• Fundamental rights at\nwork including gender\nsensitivity\n• Understanding individual\ncompetencies relative to\nteamwork\n• Types of individuals\n• Role of leaders\n\n• Identifying individual role\nand responsibility\n• Identifying external\nrelationship\n• Interacting effectively with\nothers\n• Setting team goals and\nexpectations\n• Interaction\n\n• Interviews/\nquestioning\n• Demonstration\n\n--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 53\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n• Work values and ethics\n(Code of Conduct, Code\nof Ethics, etc.)\n• Understanding personal\nobjectives\n• Understanding\norganizational goals\n• Difference between intra\nand interpersonal\nrelationship\n•Performance evaluation\n• Demonstrate Intra and\nInterpersonal skills at work\n• Demonstrate personal\ncommitment in work\n• Discussion\n\n• Demonstration\n6 hours\n3.2 Set and meet\nwork\npriorities\n• Company policies\n• Company operations,\nprocedures and standards\n• Time management\n• Basic strategic planning\nconcepts\n• Resource utilization and\nmanagement\n• Managing goals and time\n• Practice economic use of\nresources and facilities\n• Setting work priorities\n• Practice time management\n• Interaction\n• Role Play\n• Observation\n• Demonstration\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Career development\nopportunities\n• Company recognition and\nincentives\n• Information on relevant\nlicenses and or\ncertifications\n\n• Determining personal\ncareer development needs\n• Identifying career\nopportunities\n• Interaction\n• Role Play\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n\n4.1 Identify\nhazard and\nrisks\n• OHS procedures,\npractices and regulations\n• Hazards/risks\nidentification and control\n• OHS indicators\n• Organizational\ncontingency practices\n• Hazards/risks identification\nand control skills\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n4 hours\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 54\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n4.2 Evaluate\nhazard and\nrisks\n• Threshold Limit Value –\nTLV\n• Effects of safety haza