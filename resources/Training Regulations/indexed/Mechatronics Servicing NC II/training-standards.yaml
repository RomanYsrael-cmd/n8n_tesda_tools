-----------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 70\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate\nlearning and formal and non-formal training. Specific guidelines on this mode\nshall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 75 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 71\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed at least 10 yrs. basic education or an\nalternative learning systems (ALS) certificate of achievement with\ngrade 10 equivalent holder\n•\nCan communicate orally & in writing\n•\nCan perform basic mathematical computations\n\nThis list does not include specific institutional requirements such as\nwritten entrance exam, and other that may be required of the trainees by the\nschool or training center delivering TVET program.\n\n--- PDF PAGE 76 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------