ning\ntest equipment\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Structured\nlearning\nexercises\n• Written exam\n• Practical exam\n8 hours\n\n--- PDF PAGE 69 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 65\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1.2 Install mechatronics\nand automation\ndevices.\n• Set-up and testing\nmethodologies and\nprocedures for\nmechatronics and\nautomation devices\n• Manufacturer’s\nInstallation standards\nfor mechatronics and\nautomation devices\n• Handling of devices\n• Safety procedures on\ninstallation of\nmechatronics and\nautomation devices\n• Basic PLC Input/\nOutput devices wiring\nand termination\n• Use of PPEs\n• Use on installation\ntools\n• OSHES policies and\nprocedures on\nhandling of electrical\nand electronics\nequipment\n• Identification of work\nand health hazards\n\n• Wirings and installation\nof mechatronics\ndevices\n• Sensors\n• Relays\n• Timers\n• Counters\n• Motors\n• Motor control devices\n• Electro-pneumatic\ndevices\n• Electro-hydraulic\ndevices\n• PLC input/output\n\n• Following work\ninstruction and\nmanuals\n• Testing of individual\nmechatronics and\nautomation devices\n• Implementing safety\nprecautions\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Hands-on\n• Written exam\n• Practical exam\n48 hours\n\n--- PDF PAGE 70 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 66\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1.3 Test installed\nmechatronics and\nautomation devices.\n•\nSafety procedures\non testing of devices\n•\nTesting procedures\nof installed devices\n•\nPhysical inspection\nof devices set-up\n•\nDifferent types of\ntesting instruments\n•\nApplicable technical\nreport on device\ninstallation\n•\nActual testing of\ninstalled devices\n•\nConfiguring input and\noutput mechatronics\ndevices especially\nsensor technology\n•\nUsing multi-tester to\ntest the functionality\nand continuity of\ndevices\n•\nIdentifying fault and\nhazards in installed\ndevices\n•\nFilling out forms\nrelevant to task\nperformed\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Hands-on\n• Written exam\n• Practical exam\n4 hours\n\n--- PDF PAGE 71 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 67\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Configure and\nTest\nMechatronics\nand\nAutomation\nSystem\n2.1 Plan and prepare for\nconfiguration and\ntesting of\nmechatronics and\nautomation system.\n• Safety procedures on\nconfiguration and\ntesting of system\n• Selection of\nappropriate materials\nfor system application\n• Drawing and wiring\ncircuit interpretation\n• Electrical and\nelectronics symbol\napplicable for\nmechatronics and\nautomation\n• Functionality and\noperation of different\nsystem of\nmechatronics and\nautomation devices\n• Function test of\ninstalled devices\n• Interpret instructional\nmanuals, protocols\nand methodologies\n• Preventive\nmaintenance of tools\nand equipment\n\n• Following sequence\nand flow of\nmechatronics system\nthrough flow chart or\nother technique\n• Acquiring the needed\ninput and output\ndevices on each station\nof the system\n• Interpreting and\nanalyzing drawings and\nwiring diagrams for\nelectronics and\nelectrical circuits\n• Following work\ninstruction and\nmanuals\n• Selecting, Using and\nMaintaining tools and\nequipment\n• Performing calculation\nand mensuration\n• Practicing safety in the\nworkplace\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\n\n4 hours\n\n--- PDF PAGE 72 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 68\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2.2 Check and configure\nmechatronics and\nautomation system.\n•\nSafety procedures on\nconfiguring and\ntesting of\nmechatronics and\nautomation system\n•\nLogic and sequential\ncircuit\n•\nInternational\nstandards for\nblock/circuit diagram\napplicable to the\nsystem\n•\nFunctionality of\nmechatronics and\nautomation system\n•\nSystem conventional\noperation\n•\nSafety and hazards in\nmechatronics and\nautomation system\n•\nProcedures and\nmethodologies on\nchecking and\nconfiguring\nmechatronics and\nautomation system\n\n•\nPerforming the\nsequence and flow of\nmechatronics system\nthrough ladder\ndiagram or other\ntechniques\n•\nUsing and maintaining\ntools and equipment\n•\nChecking and\nAnalyzing the needed\ninput and output\ndevices on each\nstation of the system\n•\nInterfacing of different\nstation one after the\nother on a single\nmechatronics system\n•\nChecking, identifying\nfault and solving\nproblems in\nmechatronics and\nautomation system\noperation\n•\nDifferentiating the\napplication of each\ndevices on a station\nand system\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Structured\nlearning\nexercises\n• Written exam\n• Practical exam\n\n8 hours\n\n--- PDF PAGE 73 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 69\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2.3 Inspect and test the\nconfigured\nmechatronics and\nautomation system\n• Procedures on final\nwiring and termination\nof configured\nmechatronics and\nautomation system\n• Procedures on final\ninspections of\nconfigured\nmechatronics and\nautomation system\n• Procedures on final\ntesting and operation\nof configured\nmechatronics and\nautomation system\n• Preparation of\ntechnical reports\n• Following work\ninstructions, manuals\nand test protocols\n• Analyzing faults and\nhazards and perform\nproblem solving in\nmechatronics and\nautomation system\n• Defining the desired\noutcome on each\nstation in a\nmechatronics system\n• Using and maintaining\ntools and test\nequipment\n• Distinguishing the final\noutput or outcome of\nthe final stage or\nstation of the system\n• Preparing technical\nreports\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Structured\nlearning\nexercises\n• Written exam\n• Practical exam\n\n8 hours\n\n--- PDF PAGE 74 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 70",
