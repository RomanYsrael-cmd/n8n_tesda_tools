      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: Mechatronics Servicing\n\nNC Level: NC II\n\nNominal Training Duration:\n18 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n80 hrs – Core Competencies\n\n ----------\n\n 158 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\na mechatronics and automation technician, in accordance with industry standards. It\ncovers the basic & common competencies in addition to the core competencies such as\ninstalling, configuring & testing mechatronics and automation devices/system.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 51\nBASIC COMPETENCIES\n(18 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective communication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and systems\n• Technology relevant to\nenterprise and\nindividual’s work\nresponsibilities\n• Sources of information\n• T