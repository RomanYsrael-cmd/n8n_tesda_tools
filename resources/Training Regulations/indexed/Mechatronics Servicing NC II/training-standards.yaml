    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: Mechatronics Servicing\n\nNC Level: NC II\n\nNominal Training Duration:\n18 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n80 hrs – Core Competencies\n\n ----------\n\n 158 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\na mechatronics and automation technician, in accordance with industry standards. It\ncovers the basic & common competencies in addition to the core competencies such as\ninstalling, configuring & testing mechatronics and automation devices/system.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 51\nBASIC COMPETENCIES\n(18 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective communication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and systems\n• Technology relevant to\nenterprise and\nindividual’s work\nresponsibilities\n• Sources of information\n• Types of question\n• Medium of communication\n• Flow of communication\n• Storage system\n•Telephone courtesy\n• Follow simple spoken\nlanguage\n• Perform routine workplace\nduties following simple\nwritten notices\n• Participate in workplace\nmeetings and discussions\n• Complete work related\ndocuments\n• Ability to relate to people of\nsocial range in the\nworkplace\n• Gather and provide\ninformation in response to\nworkplace requirements\n• Group\ndiscussion\n• Role Play\n• Demonstration\n• Oral Interview\n• Written test\n• Demonstration\n4 hours\n1.2 Complete\nrelevant work\nrelated\ndocuments\n\n• Communication\nprocedures and systems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of communication\n• Workplace interactions\n• Non verbal\ncommunication\n• Follow simple spoken\nlanguage\n• Perform routine workplace\nduties\n• Participate in workplace\nmeetings and discussions\n• Complete work related\ndocuments\n• Estimate, calculate and\nrecord routine workplace\nmeasures\n• Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n• Role Play\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n\n--- PDF PAGE 56 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 52\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Relate to people of social\nrange in the workplace\n• Gather and provide\ninformation in response to\nworkplace requirements\n\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Technology relevant to\nenterprise and\nindividual’s work\nresponsibilities\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace report\n\n• Follow sim