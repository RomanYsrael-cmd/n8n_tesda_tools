-----------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 70\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate\nlearning and formal and non-formal training. Specific guidelines on this mode\nshall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 75 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 71\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed at least 10 yrs. basic education or an\nalternative learning systems (ALS) certificate of achievement with\ngrade 10 equivalent holder\n•\nCan communicate orally & in writing\n•\nCan perform basic mathematical computations\n\nThis list does not include specific institutional requirements such as\nwritten entrance exam, and other that may be required of the trainees by the\nschool or training center delivering TVET program.\n\n--- PDF PAGE 76 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 72\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of\n\n25 trainees for Mechatronics Servicing NC II:\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 pcs\nLong-nosed\npliers\n10 pcs\nMultimeters\n(Analog/ Digital)\n1 spool\nSolder lead\n10 pcs\nDiagonal cutters\n1 pc.\nAir compressor\n1 spool\nShielded cable\n10 pcs\nStandard\nscrewdrivers\n3 pcs\nTransmitters or\nTransducers\n1 lot\nTerminal lugs\n10 pcs\nPhillips\nscrewdrivers\n 5 pcs\nRegulated DC\npower supplies\n1 lot\nTerminal\nstrips/blocks\n10 pcs\nElectrical pliers\n10 pcs\nCylinder Actuator\n25 pcs\nCotton gloves\n10 pcs\nSoldering iron\n10 pcs\nBuzzers\n1 lot\nPlastic tubing\n10 pcs\nAdjustable\nwrench\n25 pcs\nIndustrial panel\nswitches\n1 lot\nQuick-connect\nfittings\n5 pcs\nWire stripper\n10 pcs\nIndicating lamps\n10 rolls\nElectrical tape\n5 pcs\nCrimping tool\n10 pcs\nDirectional solenoid\nvalves\n1 lot\nWire markers\n5 sets\nAllen wrench\n5 pcs\nPressure gage\n1 lot\nCable ties\n5 sets\nPrecision\nscrewdrivers\n5 pcs\nFilter-Regulator-\nLubricator set\n\n5 pcs\nLimit switches\n\n10 pcs\nPhotoelectric\nswitches\n\n10 pcs\nProximity switches\n\n25 pcs\nRelays\n\n10 pcs\nMagnetic\ncontactors\n\n10 pcs\nTimers\n10 pcs\nCounters\n2 pcs\nDesktop/Laptop PC\n5 pcs.\nSafety helmet\n5 pcs.\nSafety harness\n\n5 pcs.\nSafety\nglasses/goggles\n\n5 pcs.\nEar plugs/ear muffs\n5 pcs.\nGas mask\n5 pcs.\nFace shield\n2 pcs.\n20 I/O’s PLC\n\n--- PDF PAGE 77 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 73\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nLaboratory Area\n5 x 8\n40\n1\n40\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n1 x 2\n2\n1\n2\n Total\n122\nFacilities /Equipment/Circulation**\n\n36\n Total Area\n\n158\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS\n\nMechatronics Servicing NC II\n\n•\nHolder of National TVET Trainer’s Certificate (NTTC) Level 1 in Mechatronics\nServicing NCII or higher;\n\n•\nMust have at least 2 years relevant industry experience.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for\n\neach unit of competency.\n\nThe result of the institutional assessment may be considered as evidence\nfor the assessment for national certification.\n\n--- PDF PAGE 78 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – MECHATRONICS SERVICING NC II (Amended) Promulgated June 16, 2015 74"
