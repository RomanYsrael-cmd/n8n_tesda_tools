chine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n86\nUNIT OF COMPETENCY\n\n:\nPERFORM CNC ELECTRIC DISCHARGE MACHINE\n(EDM) -WIRE CUT OPERATIONS\n\nUNIT CODE\n:\nMEE 821319\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to\noperate CNC EDM wire cut operations such as slots and\nkeyways, profiles like circular, rectangular, vees, and\nexternal / internal radii and tapering.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Operate EDM\nwire cut\n\n1.1 Submerge workpiece\nwith deionized water\naccording to EDM\noperating manual\n 1.2 Dry run is conducted\nand parameter\nadjustments are\nmade if required\naccording to EDM\noperating manual\n1.3 EDM is operated to\nmeet dimensions and\nsurface texture\naccording to job\nrequirements\n1.4 EDM accessories are\nused according to job\nrequirements\n 1.5 Safety practices are\napplied following\nOSHS\n1.1 Procedures in\noperating EDM\n1.2 Kinds of EDM\naccessories\n1.3 Procedure in\nadjusting\nparameters\n1.4 OSH practices\n\n1.1 Operating EDM\n1.2 Using EDM\naccessories\n1.3 Adjusting parameters\n1.4 Practicing OSH\n\n2. Monitor\nperformance of\nmachine and\ncutting wire\n\n2.1 Performance of the\nmachine and cutting\nwire are monitored in\nthe power control\nunit based on the\naccepted industry\nstandards\n2.2 Deionized water level\nis maintained\naccording to machine\noperating manual\n2.3 Flushing pressure is\nprogressively\nincreased based on\njob requirements\n2.4 Safety practices are\napplied following\nOSH\n2.1 Procedures in\nmonitoring EDM\nand cutting wire\nparameters\n2.2 Procedures in\nmaintaining level of\ndeionized water\n2.3 Procedures in\nmonitoring flushing\npressure\n2.4 OSH practices\n\n2.1 Monitoring EDM\nperformance and\ncutting wire\n2.2 Maintaining\ndeionized water level\n2.3 Monitoring flushing\npressure\n2.4 Practicing OSH\n\n--- PDF PAGE 91 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n87\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Visual\ninspection of\nof workpiece and\ncutting wire\n\n3.1 Working table is\nemptied of deionized\nwater according to\noperating manual\n3.2 Surface of workpiece is\ncleaned according to\njob requirement\n 3.3 Surface texture of\nworkpiece is visually\ninspected while on its\nholder according to\njob requirements\n3.4 Tension of cutting wire\nis inspected and\ncorrected/adjusted if\nnecessary according\nto job requirements\n3.5 Safety practices are\napplied following\nOSHS\n\n3.1 Procedures in\nemptying working\ntable from dielectric\nfluid\n3.2 Procedures in\ncleaning workpiece\n3.3 Procedures in visual\ninspection of\nworkpiece\n3.4 Procedures in\nvisual inspection\nand adjustment of\ntension of cutting\nwire\n3.5 OSH practices\n\n3.1 Emptying of dielectric\nfluid\n3.2 Cleaning of\nworkpiece\n3.3 Visual inspection of\nworkpiece\n3.4 Adjusting tension of\ncutting wire\n3.5 Practicing OSH\n\n--- PDF PAGE 92 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n88\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Surface Texture\nMay include:\nValues\n1.1\nnr.12 = 0.40 Ra(um)\n1.2\nnr.15 = 0.56 Ra(um)\n1.3\nnr.18 = 0.80 Ra(um)\n1.4\nnr.21= 1.12 Ra(um)\n1.5\nnr.24 = 1.60 Ra(um)\n1.6\nnr.27 = 2.24 Ra(um)\n1.7\nnr.30 = 3.15 Ra(um)\n1.8\nnr.33 = 4.50 Ra(um)\n1.9\nnr.36 = 6.30 Ra(um)\n1.10 nr.39 = 9.00 Ra(um)\n1.11 nr.42 = 12.5 Ra(um)\n1.12 nr.45 = 18.0 Ra(um\n2. Control unit\n May include:\n2.1 Knob and toggle switches for:\nEDM data\n• Materials\n• Workpiece thickness\n• Type of wire / wire diameter\n• Number of pass or cut\n• Program number\n2.2 Servo speed\n2.3 Cutting speed\n2.4 Wire tension\n2.5 Wire speed\n2.6 Water resistivity\n2.7 Filter\n2.8 Water temperature\n\n3. Corrective measures/\n adjustments\