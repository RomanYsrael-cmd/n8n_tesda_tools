he\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 98 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n94\nSECTION 3 TRAINING ARRANGEMENTS\nThese standards are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for CNC ELECTRIC DISCHARGE MACHINE (EDM) -\nWIRE CUT OPERATION NC III.\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n1.5 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: CNC ELECTRIC DISCHARGE MACHINE (EDM)-WIRE CUT OPERATION\nNC Level: NC III\nNominal Training Duration:\n 40 Hours - Basic Competencies\n120 Hours - Common Competencies\n 136 Hours - Core Competencies\n Total 296 Hours\nCourse Description:\nThis course is designed to enhance the knowledge, skill and attitudes in CNC\nELECTRIC DISCHARGE MACHINE (EDM) - WIRE CUT OPERATION NC III in\naccordance with industry standards. This covers the competencies required to write CNC\nEDM-wire cut program, set-up machine, cutting wire and workpiece and perform CNC\nEDM -wire cutting and perform post-CNC EDM-wire cut operation.\n Upon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for this\nqu