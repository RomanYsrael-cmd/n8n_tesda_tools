    {
      "source_text": "Course Title: CNC ELECTRIC DISCHARGE MACHINE (EDM)-WIRE CUT OPERATION NC Level: NC III Nominal Training Duration: 40 Hours - Basic Competencies 120 Hours - Common Competencies 136 Hours - Core Competencies Total 296 Hours Course Description: This course is designed to enhance the knowledge, skill and attitudes in CNC ELECTRIC DISCHARGE MACHINE (EDM) - WIRE CUT OPERATION NC III in accordance with industry standards. This covers the competencies required to write CNC EDM-wire cut program, set-up machine, cutting wire and workpiece and perform CNC EDM -wire cutting and perform post-CNC EDM-wire cut operation. Upon completion of the course, the learners are expected to demonstrate the above-mentioned competencies to be employed. To obtain this, all units prescribed for this qualification must be achieve."
