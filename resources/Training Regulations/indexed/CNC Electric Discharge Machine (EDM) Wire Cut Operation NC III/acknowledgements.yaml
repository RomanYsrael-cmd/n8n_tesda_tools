      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. CNC EDM wire cut EDM wire cutting uses a metallic wire to cut a programmed contour in a workpiece. Extrusion dies and blanking punches are very often machined by wire cutting. Cutting is always through the entire workpiece. To start machining it is first necessary to drill a hole in the workpiece or start from the edge."
    },
    {
      "source_text": "2. Computer Program A series of instruction, in language a machine control unit can understand, that outlines each steps a machine must take to produce a part"
    },
    {
      "source_text": "3. Computer Numerical Control (CNC) A machine tool microprocessor that permits the creation or modification of parts. The programmed numerical control activates the machine’s servos and spindle drive, and controls the machine operation"
    },
    {
      "source_text": "4. Direct Numerical Control (DNC)"
    },
    {
      "source_text": "5. Programing"
    },
    {
      "source_text": "6. Computer Aided Design (CAD)"
    },
    {
      "source_text": "7. Computer Aided Manufacturing (CAM)"
    },
    {
      "source_text": "8. Surface Finish"
    },
    {
      "source_text": "9. Tolerance"
    },
    {
      "source_text": "10. Zero Reference Point"
    },
    {
      "source_text": "A number of CNC machine in a manufacturing process controlled by one master computer"
    },
    {
      "source_text": "The process of coding machining conditions in which information such as cutter dimensions, cutter movement processing orders, feed rate, or spindle speed all under fixed regulation or specified format which refers to the workpiece drawing to instruct numerically Controlled"
    },
    {
      "source_text": "The use of graphics oriented computer software for designing and drafting application"
    },
    {
      "source_text": "Computer software that generates programs for the operation of NC (numerical control)"
    },
    {
      "source_text": "The degree of variation of a surface roughness or waviness from a reference or normal plane, usually measured in micro inches or micrometer."
    },
    {
      "source_text": "The amount of interference required for two or more parts that are in contact. The amount of variation, over or under required size, permitted on a piece of machine work"
    },
    {
      "source_text": "The point on or off the part, chosen by the programmer as being most suitable for programming and machining purposes"
    },
    {
      "source_text": "-- PDF PAGE 137 --- CNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019) 133"
    },
    {
      "source_text": "11.Sequence of operation"
    },
    {
      "source_text": "12. Manual Programming 13. Automatic Programming"
    },
    {
      "source_text": "The order of steps to be taken to successfully machine a part or perform an operation"
    },
    {
      "source_text": "This refers to the act of creating an NC program entirely through manual calculation"
    },
    {
      "source_text": "As the geometries to be machine get complex, it become difficult to create program through manual calculation. Such programs are created by the help of a special purpose computer"
    },
