ng\nOSHS\n1.1 Procedures in\nopening tank front\nwall\n1.2 Procedures in\nremoving\nworkpiece\n1.3 Procedures in\ncleaning workpiece\n1.4 OSH practices\n\n1.1 Opening of tank wall\n1.2 Removing workpiece\n1.3 Cleaning workpiece\n1.4 Practicing OSH\n2. Final check\nworkpiece\n2.1 Workpiece is\nchecked and\nmeasured using\nmeasuring tools\nfollowing standard\noperating procedures\n2.2 Inspected workpiece\nis applied with anti-\ncorrosion agents\n2.3 Accomplishment\nreport is filled up\naccording to company\nprocedures\n2.4 Inspected workpiece\nand accomplishment\nreport are submitted to\nimmediate supervisor\nfollowing workplace\nprocedures\n2.5 Safety practices are\napplied following\nOSHS\n\n2.1 Procedures in\nchecking and\nmeasuring\nworkpiece\n2.2 Application of anti-\ncorrosion agents\n2.3 Procedures in filling\nup accomplishment\nreport\n2.4 Submission of\ninspected workpiece\nand\naccomplishment\nreport\n2.5 OSH practices\n\n2.1 Checking and\nmeasuring\nworkpiece\n2.2 Applying anti-\ncorrosion agents\n2.3 Reporting\n2.4 Submitting\nworkpiece and\naccomplishment\nreport\n2.5 Practicing OSH\n\n--- PDF PAGE 95 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n91\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. EDM wire cut\nshutdown and\nhousekeeping\n3.1 EDM is shutdown\naccording to\nmanufacturer’s\noperating manual\n3.2 Tools are maintained\nand stored based on\nestablished\nprocedures\n3.3 Defective tools are\ntagged and reported\naccording to\nworkplace procedures\n 3.4 Good housekeeping\nis performed following\n5S\n3.5 Wastes are disposed\naccording to waste\nmanagement\nprocedures and\nenvironmental\nregulations\n3.6 Safety practices are\napplied following\nOSHS\n\n3.1 Procedures of\nshutting down EDM\n3.2 Storage of tools and\nmaterials\n3.3 Tagging of defective\ntools\n3.4 5S\n3.5 Waste management\n3.6 Environmental