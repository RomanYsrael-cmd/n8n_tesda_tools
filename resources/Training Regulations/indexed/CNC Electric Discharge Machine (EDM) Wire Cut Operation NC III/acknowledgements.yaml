      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional Assessment is gathering of evidences to determine the achievements of the requirements of the qualification to enable the trainer make judgement whether the trainee is competent or not competent."
    },
    {
      "source_text": "-- PDF PAGE 130 --- CNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019) 126 SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT"
    },
    {
      "source_text": "Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards. The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to a full qualification or employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s of competency of a qualification with a promulgated Training Regulations."
    },
    {
      "source_text": "4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency."
    },
    {
      "source_text": "4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency assessment."
    },
    {
      "source_text": "4.1.4 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following:"
    },
    {
      "source_text": "a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements as identified by industry"
    },
    {
      "source_text": "4.1.5 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "a. Graduating students/trainees of NTR programs or graduates of formal, non-formal and informal institutions including enterprise- based training programs related to CNC Electric Discharge Machine (EDM) – Wire Cut Operation NC III."
    },
    {
      "source_text": "b. Industry workers in CNC Machining."
    },
    {
      "source_text": "-- PDF PAGE 131 --- CNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019) 127 4.2 Competency Assessment Requisite"
    },
    {
      "source_text": "4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment."
    },
    {
      "source_text": "This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior"
    },
    {
      "source_text": "4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "source_text": "4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    },
