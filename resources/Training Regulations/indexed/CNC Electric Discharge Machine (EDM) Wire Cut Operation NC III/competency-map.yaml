  "source_text": "COMPETENCY MAP\nMETALS AND ENGINEERING SECTOR\nCNC ELECTRIC DISCHARGE MACHINE (EDM)-WIRE CUT OPERATION NC III\nBASIC COMPETENCIES\n\n--- PDF PAGE 133 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n129\n\nUtilize specialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nImplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nApply safety practices\nInterpret working drawings\nand sketches\nSelect/ cut workshop\nmaterials\nPerform shop computations\n(Basic)\nMeasure workpiece (Basic)\nPerform routine housekeeping\nPerform shop computations\n(Intermediate)\nMeasure workpiece using\nangular measuring\ninstruments\nPerform shop computations\n(Advanced)\nMeasure workpiece using\ngages and surface texture\ncomparator\nPerform preventive and\ncorrective maintenance\nOperate a personal computer\nSelect and cut workshop materials\nPrepare cost estimates\nApply Safety Practices\nInterpret Drawings and Sketches\nPerform Industry Calculations\nContribute to Quality System\nUse Hand Tools\nPrepare Weld Materials\nSetup Welding Equipment\nFit up Weld Materials\nRepair Welds\nPerform shop computations\n(Intermediate)\nMeasure workpiece (Intermediate)\nPerform preventive and\ncorrective Maintenance\nCOMMON COMPETENCIES\n\n--- PDF PAGE 134 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n130\n\nCreate drawing using CAD\nsoftware\nApply CAD/CAM program\nWrite basic CNC lathe machine\nprogram\nSet-up CNC lathe machine,\nworkpiece and cutting tools\nPerform basic CNC lathe machine\noperations\nWrite advanced CNC lathe\nmachine program\nSet-up multiple-axis CNC lathe\nmachine, workpiece and cutting\ntools\nPerform advanced CNC lathe\nmachine operations\nWrite basic CNC milling machine\nprogram\nSet-up CNC milling machine,\nworkpiece and cutting tools\nPerform basic CNC milling\nmachine operations\nWrite advanced CNC milling\nmachine program\nSet-up multiple-axis CNC milling\nmachine, workpiece and cutting\ntools\nPerform advanced CNC milling\nmachine operations\nWeld Carbon Steel Plates Using\nFCAW\nWeld Carbon Steel Pipes Using\nFCAW\nWeld Alloy Steel Plates Using\nFCAW\nWeld Alloy Steel Pipes Using\nFCAW\nPerform Gas Welding in Carbon\nSteel Plates and Tubes\nPerform Gas Welding in Alloy\nSteel Plates and Tubes\nWeld Carbon Steel Plates Using\nGMAW\nWeld Carbon Steel Pipes Using\nGMAW\nWeld Alloy Steel Plates Using\nGMAW\nWeld Alloy Steel Pipes Using\nGMAW\nWeld Carbon Steel Plates Using\nGTAW\nWeld Carbon Steel Pipes Using\nGTAW\nWeld Alloy Steel Plates Using\nGTAW\nWeld Alloy Steel Pipes Using\nGTAW\nPerform bench work (Basic)\nTurn workpiece\nMill workpiece\nGrind workpiece\nShape workpiece\nRepair workpiece\nPerform bench work (Basic)\nPerform bench work\n(Complex)\nCORE COMPETENCIES\n\n--- PDF PAGE 135 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n131\nTurn workpiece (Basic)\nTurn workpiece\n(Intermediate)\nMill workpiece (Basic)\nMill workpiece (Intermediate)\nGrind workpiece (Basic)\nGrind workpiece (Complex)\nTurn workpiece (Advanced)\nMill workpiece (Advanced)\nPrepare basic engineering\ndrafting\nPerform basic engineering\ndetail drafting\nPerform Preventive\nMaintenance\nPerform Planned and\nUnplanned (Emergency)\nMaintenance\nFabricate Simple Items\nInstall Machinery\n Perform press machine\nsetting\n Perform mechanical press\noperation\nWeld Plates Using SAW\nWeld Pipes Using SAW\nWeld Carbon Steel Plates\nUsing SMAW\nWeld Carbon Steel Plates\nand Pipes Using SMAW\nWeld Alloy Steel Plates Using\nSMAW\nWeld Alloy Steel Pipes Using\nSMAW\nMachine Die Components\nFit and Assemble Dies\nTest and Try Die\nMachine mold components\nImplement surface finishing\nFit and assemble mold\nRectify mold flaws\nWrite CNC Electric\nDischarge Machine (EDM)-\nwire cut program\nSet-up CNC Electric\nDischarge Machine (EDM)-\nwire cut , cutting wire and\nworkpiece\nPerform CNC Electric\nDischarge Machine (EDM)-\nwire cut operations\nPerform post CNC Electric\nDischarge Machine (EDM)-\nwire cut operations\nCORE COMPETENCIES\n\n--- PDF PAGE 136 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n132\n\nGLOSSARY OF TERMS\n\n1. CNC EDM wire cut\nEDM wire cutting uses a metallic wire to cut a programmed\ncontour in a workpiece. Extrusion dies and blanking\npunches are very often machined by wire cutting. Cutting is\nalways through the entire workpiece. To start machining it\nis first necessary to drill a hole in the workpiece or start from\nthe edge.\n\n2. Computer Program\nA series of instruction, in language a machine control unit\ncan understand, that outlines each steps a machine must\ntake to produce a part\n\n3. Computer Numerical\nControl (CNC)\nA machine tool microprocessor that permits the creation or\nmodification of parts. The programmed numerical control\nactivates the machine’s servos and spindle drive, and\ncontrols the machine operation\n\n4. Direct Numerical\nControl (DNC)\n\n5. Programing\n\n6. Computer Aided\nDesign (CAD)\n\n7. Computer Aided\nManufacturing (CAM)\n\n8. Surface Finish\n\n9. Tolerance\n\n10. Zero Reference Point\n\nA number of CNC machine in a manufacturing process\ncontrolled by one master computer\n\nThe process of coding machining conditions in which\ninformation such as cutter dimensions, cutter movement\nprocessing orders, feed rate, or spindle speed all under\nfixed regulation or specified format which refers to the\nworkpiece drawing to instruct numerically Controlled\n\nThe use of graphics oriented computer software for\ndesigning and drafting application\n\nComputer software that generates programs for the\noperation of NC (numerical control)\n\nThe degree of variation of a surface roughness or\nwaviness from a reference or normal plane, usually\nmeasured in micro inches or micrometer.\n\nThe amount of interference required for two or more parts\nthat are in contact. The amount of variation, over or under\nrequired size, permitted on a piece of machine work\n\nThe point on or off the part, chosen by the programmer as\nbeing most suitable for programming and machining\npurposes\n\n--- PDF PAGE 137 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n133\n\n11.Sequence of operation\n\n 12. Manual Programming\n13. Automatic\n Programming\n\nThe order of steps to be taken to successfully machine a\npart or perform an operation\n\nThis refers to the act of creating an NC program entirely\nthrough manual calculation\n\nAs the geometries to be machine get complex, it become\ndifficult to create program through manual calculation.\nSuch programs are created by the help of a special\npurpose computer\n\n--- PDF PAGE 138 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n134\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nCNC ELECTRIC DISCHARGE MACHINE (EDM)-WIRECUT\nOPERATION NC III\n\nQualification Code:\nMEEEWO319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nCNC Electric\nDischarge\nMachine (EDM)\nWirecut Operation\nNC IIII\n2019-29/\n05-21-2019\n\nLegend: *Description Types\n- Document Created\n\n--- PDF PAGE 139 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n135\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS/TESDA EXPERTS PANEL\n\nMR. HECTOR D. MALONZO\nHDM TECHNOLOGIES INC.,\nCHAIRMAN\nMetalworking Industry Association of\nthe Phil. (MIAP)Treasurer\n\nMR. ERNESTO C. LAURENTE, JR.\nMetalworking Industry Association of\nthe Phil. (MIAP) Manila Chapter\nTESDA Accredited Trainer\nMR. VALENTIN P. CACHO\nMetalworking Industry Association of\nthe Phil. (MIAP) Manila Chapter\nWorkshop Instructor\nMR. RAUL B. SAMSON\nFamous Secret Precision Machining\nInc. Department Head AERO Group\nMetalworking Industry Association of\nthe Phil. (MIAP)\nTESDA Accredited Trainer and\nAssessor\n\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n• Alpha Techno Precision Toolings, Inc.\nEPZA, Rosario Cavite\n\n• Dienamiktool Services\nMandaluyong City\n\n• Fareast Industrial Sales and Tooling Services\nParañaque City\n\n• HDM Technologies\nParañaque City\n\n• Jabez Tech\nParañaque City\n\n• NSB Engineering Design and Fabrication\nTaguig City\n\n--- PDF PAGE 140 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n136\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of t