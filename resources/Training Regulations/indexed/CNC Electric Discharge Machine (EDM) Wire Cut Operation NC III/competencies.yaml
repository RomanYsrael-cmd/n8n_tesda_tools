        "source_text": "--- PDF PAGE 25 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n21 \nUNIT OF COMPETENCY :  \nPROPOSE METHODS OF APPLYING LEARNING  \nAND INNOVATION IN THE ORGANIZATION \n \nUNIT CODE                       :       \n400311323 \n \nUNIT DESCRIPTOR          :  \nThis unit covers the knowledge, skills and attitudes  \n  \nrequired to assess general obstacles in the application  \n  \nof learning and innovation in the organization and to  \n  \npropose practical methods of such in addressing  \n  \norganizational challenges. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Assess work \nprocedures, \nprocesses and \nsystems in \nterms of \ninnovative \npractices \n1.1. Reasons for \ninnovation are \nincorporated \nto work \nprocedures. \n1.2. Models of \ninnovation are \nresearched. \n1.3. Gaps or barriers \nto innovation in \none’s work area \nare analyzed. \n1.4. Staff who can \nsupport and foster \ninnovation in the \nwork procedure \nare identified. \n \n \n \n \n \n1.1 Seven habits of \nhighly effective \npeople. \n1.2 Character \nstrengths that \nfoster innovation \nand learning \n(Christopher \nPeterson and \nMartin Seligman, \n2004) \n1.3 Five minds of the \nfuture concepts \n(Gardner, 2007). \n1.4 Adaptation \nconcepts in \nneuroscience \n(Merzenich, 2013). \n1.5 Transtheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n \n1.1 Demonstrating \ncollaboration and \nnetworking skills. \n1.2 Applying basic \nresearch and \nevaluation skills \n1.3 Generating insights \non how to improve \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation.\n\n--- PDF PAGE 26 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n22 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Generate \npractical action \nplans for \nimproving work \nprocedures, \nprocesses \n2.1 Ideas for \ninnovative work \nprocedure to foster \ninnovation using \nindividual and \ngroup techniques \nare conceptualized \n2.2 Range of ideas \nwith other team \nmembers and \ncolleagues are \nevaluated and \ndiscussed \n2.3 Work procedures \nand processes \nsubject to change \nare selected based \non workplace \nrequirements \n(feasible and \ninnovative). \n2.4 Practical action \nplans are \nproposed to \nfacilitate simple \nchanges in the \nwork procedures, \nprocesses and \nsystems. \n2.5 Critical inquiry is \napplied and used \nto facilitate \ndiscourse on \nadjustments in the \nsimple work \nprocedures, \nprocesses and \nsystems. \n2.1 Seven habits of \nhighly effective \npeople. \n2.2 Character \nstrengths that \nfoster innovation \nand learning \n(Christopher \nPeterson and \nMartin Seligman, \n2004) \n2.3 Five minds of the \nfuture concepts \n(Gardner, 2007). \n2.4 Adaptation \nconcepts in \nneuroscience \n(Merzenich, 2013). \n2.5 Transtheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n2.1 Assessing readiness \nfor change on \nsimple work \nprocedures, \nprocesses and \nsystems. \n2.2 Generating insights \non how to improve \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n2.3 Facilitating action \nplans on how to \napply innovative \nprocedures in the \norganization.\n\n--- PDF PAGE 27 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n23 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Evaluate the \neffectiveness of \nthe proposed \naction plans \n3.1 Work structure is \nanalyzed to \nidentify the \nimpact of the \nnew work \nprocedures  \n3.2 Co-workers/key \npersonnel is \nconsulted to \nknow who will be \ninvolved with or \naffected by the \nwork procedure \n3.3 Work instruction \noperational plan \nof the new work \nprocedure is \ndeveloped and \nevaluated. \n3.4 Feedback and \nsuggestion are \nrecorded. \n3.5 Operational plan \nis updated. \n3.6 Results and \nimpact on the \ndeveloped work \ninstructions are \nreviewed \n3.7 Results of the \nnew work \nprocedure are \nevaluated \n3.8 Adjustments are \nrecommended \nbased on results \ngathered \n3.1 Five minds of the \nfuture concepts \n(Gardner, 2007). \n3.2 Adaptation \nconcepts in \nneuroscience \n(Merzenich, 2013). \n3.3 Transtheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n3.1 Generating \ninsights on how to \nimprove \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n3.2 Facilitating action \nplans on how to \napply innovative \nprocedures in the \norganization. \n3.3 Communicating \nresults of the \nevaluation of the \nproposed and \nimplemented \nchanges in the \nworkplace \nprocedures and \nsystems. \n3.4 Developing action \nplans for \ncontinuous \nimprovement on \nthe basic systems, \nprocesses and \nprocedures in the \norganization.\n\n--- PDF PAGE 28 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n24 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Reasons \nMay include: \n1.1 Strengths and weaknesses of the current \nsystems, processes and procedures. \n1.2 Opportunities and threats of the current systems, \nprocesses and procedures. \n2. Models of innovation \nMay include: \n2.1 Seven habits of highly effective people. \n2.2 Five minds of the future concepts (Gardner, \n2007). \n2.3 Neuroplasticity and adaptation strategies. \n3. Gaps or barriers \nMay include: \n3.1 Machine \n3.2 Manpower \n3.3 Methods \n3.4 Money \n4. Critical Inquiry \nMay include: \n4.1 Preparation. \n4.2 Discussion. \n4.3 Clarification of goals. \n4.4 Negotiate towards a Win-Win outcome. \n4.5 Agreement. \n4.6 Implementation of a course of action. \n4.7 Effective verbal communication. See our pages: \nVerbal Communication and Effective Speaking. \n4.8 Listening. \n4.9 Reducing misunderstandings is a key part of \neffective negotiation. \n4.10 Rapport Building. \n4.11 Problem Solving. \n4.12 Decision Making. \n4.13 Assertiveness. \n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 29 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n25 \nEVIDENCE GUIDE \n \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Established the reasons why innovative systems are \nrequired \n1.2 Established the goals of a new innovative system \n1.3 Analyzed current organizational systems to identify gaps \nand barriers to innovation. \n1.4 Assessed work procedures, processes and systems in \nterms of innovative practices. \n1.5 Generate practical action plans for improving work \nprocedures, and processes. \n1.6 Reviewed the trial innovative work system and adjusted \nreflect evaluation feedback, knowledge management \nsystems and future planning. \n1.7 Evaluated the effectiveness of the proposed action plans. \n2.   Resource \nImplications \nThe following resources should be provided: \n2.1 Pens, papers and writing implements. \n2.2 Cartolina. \n2.3 Manila papers. \n3.   Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Psychological and behavioral Interviews. \n3.2 Performance Evaluation. \n3.3 Life Narrative Inquiry. \n3.4 Review of portfolios of evidence and third-party workplace \nreports of on-the-job performance. \n3.5 Sensitivity analysis. \n3.6 Organizational analysis. \n3.7 Standardized assessment of character strengths and \nvirtues applied. \n4.   Context for \nAssessment \n4.1    Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
