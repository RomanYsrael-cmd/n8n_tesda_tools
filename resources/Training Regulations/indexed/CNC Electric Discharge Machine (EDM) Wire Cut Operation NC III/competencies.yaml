        "source_title": "WRITE CNC ELECTRIC DISCHARGE MACHINE (EDM)-WIRE CUT PROGRAM",
        "source_text": "--- PDF PAGE 82 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n78 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :    \n        WRITE CNC ELECTRIC DISCHARGE MACHINE  \n       (EDM)-WIRE CUT PROGRAM  \n \nUNIT CODE                       :                MEE 821317 \n \nUNIT DESCRIPTOR          :  \nThis unit covers the knowledge and skills required    to write \nprograms for CNC EDM wire cut.  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Confirm job \n    requirement  \n \n \n \n \n \n \n1.1 Drawing is \ninterpreted and \nconfirmed with the \nsupervisor \n1.2 Cutting wire is \nselected  according to \nthe job requirement   \n1.3 Workpiece is \nreceived and \ninspected based on \nthe drawing \n 1.4 Safety practices are \napplied according to \nOSHS \n1.1 Drafting /drawing \nknowledge to \ninclude ability to \napply skills in limits, \nfits, tolerances and \nsurface texture of \nworkpiece  \n1.2 Different types of \ncutting wire  \n1.3 Measuring \nworkpiece \n1.4 Occupational safety \nand health (OSH) \npractices \n1.1 Interpreting drawing  \n1.2 Selecting of cutting \nwire \n1.3 Receiving and \ninspecting workpiece \n1.4  Practicing OSH \n \n2. Write CNC EDM   \nwire cut  \nprogram \n2.1   Desk top computer is \nused according to \nstandard operating \nprocedures. \n2.2   Sequence of wire \ncut operation is \ndetermined \naccording to industry \nstandard procedures  \n2.3   Drawing is generated \nusing software \naccording to industry \nstandard procedures \n 2.4 Wire path programs \nare written according \nto software anual \n2.5   Data of wire \nparameter  is filled \n2.1 Use of desk top \ncomputer \n2.2 Determination of \nsequence of \noperation \n2.3 Generation of 2D \nCAD drawing \n2.4 Application of G-\ncodes, M-codes and \nLetter addresses on \nwire path program \n2.5 Filling up wire data \nparameter \n2.6 Saving CAD drawing \n2.7 Occupational safety \nand health (OSH) \npractices \n2.1 Using desk top \ncomputer \n2.2 Determining \nsequence of \noperation \n2.3 Generating 2D CAD \ndrawing \n2.4 Writing wire path \nprogram \n2.5 Filling up of wire \nparameter \n2.6 Saving of CAD \ndrawing \n2.7 Practicing OSH\n\n--- PDF PAGE 83 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n79 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n        up according to \nstandard operating \nprocedures  \n2.6 CAD drawing is \nsaved to designated \nfolder according to \nindustry procedures \n2.7 Safety practices are \napplied according to \nOSHS \n \n \n3.   Edit  CNC \nEDM wire cut  \nprograms \n3.1 (CAD) Program is \nsimulated and edited \naccording to standard \noperating procedures. \n3.2 Program is saved to \ndesignated folder \naccording to industry \nprocedures   \n3.3 Program is \ndownloaded/ inputted \nto the machine using \nappropriate devices \n(CF card) according to \nindustry procedures  \n3.4 Safety practices are \napplied according to \nOSHS \n3.1 Simulation and \nediting of (CAD) \nprogram   \n3.2 Saving the program \nto designated folder \n3.3  Downloading \nprogram to CF card  \n3.4 Occupational safety \nand health (OSH) \npractices \n \n \n3.1 Simulating and \nediting (CAD) \nprogram \n3.2  Saving program \n3.3 Downloading \nprogram to the \nmachine \n3.4 Practicing OSH\n\n--- PDF PAGE 84 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n80 \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Drawings \nMay include: \n1.1 Dimensions and symbols \n1.2 Limits. fits, tolerances and surface textures   \n \n2.   Cutting Wire \nMay include: \n2.1  Brass wire \n2.2  Copper wire  \n2.3  Coated wire \n2.4  Specialty wire \n \n3.   Workpiece \nMay include: \n3.1 High carbon steel \n3.2 Carbide steel \n3.3 Brass \n3.4 Aluminium \n3.5 Stainless steel \n3.6 Copper \n \n4. Software \nMay include: \n4.1 NX Program \n4.2 Master Cam \n4.3 Del Cam \n4.4 Feature Cam \n4.5 Surf Cam \n4.6 Cam Magic \n5. Wire cut \n     Operations \nMay include: \n5.1 Slotting and keyways  \n5.2  Vees \n5.3  Circular and rectangular  \n5.4  Circular slots \n5.5  Contour \n5.6  Tapering\n\n--- PDF PAGE 85 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n81 \n EVIDENCE GUIDE \n \n1. Critical aspects of \nevidence  \nAssessment requires evidence that the candidate:   \n1.1 Confirmed job requirements \n1.2 Wrote CNC EDM wire cut program \n1.3 Edited CNC EDM wire cut programs \n1.4 Observed safety measures applicable to worksite operation \n1.5 Communicated effectively with others to ensure effective \nwork operation \n2. Resource \nimplications \nThe following resources should be provided: \n2.1  Drawings, sketches or blueprint/materials \n2.2  Computers and simulation software’s \n \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Direct observation with oral questioning \n3.2   Written exam  \n3.3   Demonstration (actual programming) \n \n4. Context for \nassessment \n4.1   Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
