        "source_title": "OPERATE A PERSONAL COMPUTER",
        "source_text": "--- PDF PAGE 76 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n72 \nUNIT OF COMPETENCY \n: \nOPERATE A PERSONAL COMPUTER \n \nUNIT CODE \n \n: \nICT311201 \n \nUNIT DESCRIPTOR   \n: \nThis unit defines the competency required to operate a \npersonal computer by: starting the PC, logging in, using and \nworking with files, folders and programs, saving work, and \nclosing down the PC. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Start the \ncomputer \n \n1.1 The peripheral \ndevices are properly \nconnected  \n1.2 Power is checked and \nthe computer and \nperipheral devices are \nswitched on \n1.3 Proper logging in and \nlogging off is \nsuccessfully done \n1.4 The operating system \nfeatures and functions \nare accessed and \n1.5 Navigated Hardware \nconfiguration and \nother system features \nare checked \n1.1 Computer \nfunctions \n1.2 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n1.3 Keyboard layout \nand functions \n \n \n1.1 Connecting \nperipheral \ndevices \n1.2 Logging in and \nlogging off \nproperly \n \n2. Arrange and \ncustomize \ndesktop display/ \nWindows settings \n2.1 The desktop screen or \nWindows elements are \nchanged as needed \n2.2 Desktop icons are \nadded, renamed, \nmoved, copied or \ndeleted \n2.3 The online help \nfunctions are accessed \nor used as needed \n2.4 Desktop icons of \napplication programs \nare selected, opened \nand closed \n2.5 Properties of icons are \ndisplayed \n2.6 Computer or desktop \nsettings are saved and \nrestored \n2.1 Keyboard layout \nand functions \n2.2 Computer \nfunctions \n2.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n2.4 Storage devices \nand file concepts \n2.5 Basic software \noperation and \nfunctionalities \n2.1 Changing \ndesktop screen \nor windows \nelement \n2.2 Adding, \nrenaming, \nmoving, copying \nand deleting \ndesk top icon \n2.3 Accessing online \nhelp function \n2.4 Opening and \nclosing desk top \nicons \n2.5 Displaying \nproperties of \nicons\n\n--- PDF PAGE 77 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n73 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Work with files and \nfolders (or \ndirectories \n3.1 A file or folder is \ncreated, opened, \nmoved, renamed or \ncopied \n3.2 Files are located, \ndeleted and restored \n3.3 Details and properties \nof files and folders are \ndisplayed or viewed \n3.4 Various files are \norganized for easy \nlookup and use \n3.5 Files and information \nare searched \n3.6 Disks are checked, \nerased or formatted as \nnecessary \n3.1 Keyboard layout \nand functions \n3.2 Computer \nfunctions \n3.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n3.4 Storage devices \nand file concepts \n3.5 Basic software \noperation and \nfunctionalities \n3.1 Creating, \nopening, moving, \nrenaming and \ncopying a file and \nfolder \n3.2 Locating, deleting \nand restoring \nfiles \n3.3 Displaying details \nand properties of \nfiles and folders \n3.4 Organizing files \n3.5 Searching file \nand information \n4. Work with user \napplication \nprograms \n4.1 Application programs \nare added, changed, \nremoved or ran \n4.2 User software or \napplication program \nare installed, updated \nand upgraded \n4.3 Information/data are \nmoved between \ndocuments or files \n4.1 Keyboard layout \nand functions \n4.2 Computer \nfunctions \n4.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n4.4 Storage devices \nand file concepts \n4.5 Basic software \noperation and \nfunctionalities \n4.1 Checking \nhardware \nconfiguration and \nother system \nfeatured \n4.2 Installing, \nupdating and \nupgrading user \nsoftware or \napplication \nprogram \n \n5. Print information \n5.1 Printer is added or \ninstalled and correct \nprinter settings is \nensured \n5.2 Default printer is \nassigned accordingly \n5.3 Information or \ndocument is printed \non the installed printer \n5.4 Progress of print jobs \nare viewed and \ndeleted as required \n5.1 Keyboard layout \nand functions \n5.2 Computer \nfunctions \n5.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n5.4 Storage devices \nand file concepts \n5.5 Basic software \noperation and \nfunctionalities \n5.1 Installing printer \nsettings \n5.2 Printing \ninformation or \ndocument\n\n--- PDF PAGE 78 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n74 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6. Shut down \ncomputer \n6.1 All open application \nprograms are closed \n6.2 Computer and \nperipheral devices \nare properly shut \ndown \n6.1 Keyboard layout \nand functions \n6.2 Computer \nfunctions \n6.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n6.4 Storage devices \nand file concepts \n6.5 Basic software \noperation and \nfunctionalities \n \n6.1 Shutting down \ncomputer and \nperipheral \ndevices\n\n--- PDF PAGE 79 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n75 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Peripheral device \nMay include:  \n1.1 Mouse \n1.2 Keyboard \n1.3 Monitor or visual display unit \n1.4 Printer \n1.5 Scanner \n2. Computer \nMay include: \n2.1 Laptops/notebooks \n2.2 Workstations \n2.3 Servers \n2.4 other personal computer devices \n3. Application programs \nMay include: \n3.1 User programs \n3.2 Database programs \n3.3 Word processors \n3.4 Email programs \n3.5 Internet browsers \n3.6 System browsers  \n3.7 Spreadsheets \n4. Operating system \nMay include: \n4.1 Windows \n4.2 NT \n4.3 Mac OS \n4.4 Linux \n4.5 Solaris \n4.6 Unix  \n5. System features \nMay include:  \n5.1 Memory size \n5.2 Disk capacities \n5.3 Video cards \n5.4 Usbs \n5.5 Modems \n5.6 1394 and lan connectors \n5.7 Sd and pc cards \n5.8 Wireless and infrared connections. \n6. Online help functions \nMay include: \n4.1 An instruction manual, or a portion of the manual, \nintegrated and accessible from within the program or \nsoftware being used\n\n--- PDF PAGE 80 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n76 \nVARIABLE \nRANGE \n7. Properties \nMay include:  \n7.1 File name \n7.2 Type of file \n7.3 File size \n7.4 Date created and modified \n7.5 Attributes (hidden, read-only). \n8. Various files \nMay include: \n8.1 Documents \n8.2 Records \n8.3 Pictures \n8.4 Music \n8.5 Video \n9. Disks \nMay include:  \n9.1 Floppy disks \n9.2 CDs \n9.3 CD-RW (Compact discs-Read/Write) \n9.4 DVD RW \n9.5 zip disks \n9.6 flash drives \n9.7 memory sticks \n9.8 hard drives \n10. Printer settings \nMay include:  \n10.1 Page layout \n10.2 Paper size \n10.3 ink/cartridge type \n10.4 Number of copies \n10.5 Page orientation.\n\n--- PDF PAGE 81 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n77 \n EVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate:   \n1.1 Ability to utilize software, navigate the desktop, \nusing system features to perform tasks and save \nresults of work. \n2. Resource Implications \nThe following resources should be provided: \n2.1 A personal computer \n2.2 A printer \n2.3 Mouse and keyboard \n2.4 Basic systems software \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Observation in a workplace or simulated \nenvironment \n3.2 Third party reports \n3.3 Exams and tests \n3.4 Demonstration of required skills \n3.5 Interviews \n4. Context for Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA Accredited \nAssessment Center\n",
