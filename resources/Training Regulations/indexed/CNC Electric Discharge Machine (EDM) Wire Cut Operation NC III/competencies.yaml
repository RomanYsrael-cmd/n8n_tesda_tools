  "source_section_text": "SECTION 1 CNC ELECTRIC DISCHARGE MACHINE (EDM)-WIRE CUT OPERATION\nNCIII QUALIFICATION\nThe CNC Electric Discharge Machine (EDM)-Wire Cut Operation NC III\nQualification consists of competencies that a person must achieve to write CNC ED- wire\ncut program, set-up CNC EDM-wire cut, cutting wire and workpiece, perform CNC EDM-\nwire cut operation and post CNC EDM-wire cut operations.\n\nThe Units of Competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n400311322\nApply critical thinking and problem-solving techniques in the workplace\nWork in a diverse environment\n400311323\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in the organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE722201\nApply safety practices\nMEE722202\nInterpret working drawings and sketches\nMEE722203\nSelect/ cut workshop materials\nMEE722204\nPerform shop computations (Basic)\nMEE722205\nMEE722206\nMeasure workpiece (Basic)\nPerform routine housekeeping\nMEE722207\nPerform shop computations (Intermediate)\nMEE722208\nMeasure workpiece using angular measuring instruments\nMEE722210\nMeasure workpiece using gages and surface texture comparator\nMEE722211\nICT311201\nPerform preventive and corrective maintenance\nOperate a personal computer\n\nCODE NO.\nCORE COMPETENCIES\nMEE821317\nWrite CNC Electric Discharge Machine (EDM)- wire cut program\nMEE821318\nSet-up CNC Electric Discharge Machine (EDM)- wire cut , cutting\nwire and workpiece\nMEE821319\n\nMEE821320\nPerform CNC Electric Discharge Machine (EDM)-wire cut operations\nPerform post CNC Electric Discharge Machine (EDM)- wire cut\noperations\n\n--- PDF PAGE 6 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n2\nA person who has achieved this qualification is competent to be:\n - CNC EDM Wire Cut Operator\n - CNC EDM Wire Cut Programmer\n\n--- PDF PAGE 7 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n3"
