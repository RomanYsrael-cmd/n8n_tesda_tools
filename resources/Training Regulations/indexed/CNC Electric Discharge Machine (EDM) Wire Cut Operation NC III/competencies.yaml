ion NC II  Revision 00       Promulgated (05/21/2019) \n40 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Apply budgeting \nand financial \nmanagement \nskills   \n3.1 Enterprise is built up and \nsustained through \njudicious control of cash \nflows.  \n3.2 Profitability of enterprise \nis ensured though \nappropriate internal \ncontrols. \n3.3 Unnecessary or lower-\npriority expenses and \npurchases are avoided.  \n3.1 Cash flow \nmanagement \n3.2 Basic financial \nmanagement \n3.3 Basic financial \naccounting    \n3.4 Business internal \ncontrols  \n \n3.1 Setting business \npriorities and \nstrategies \n3.2 Interpreting basic \nfinancial statements \n3.3 Preparing business \nplans\n\n--- PDF PAGE 45 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n41 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business strategies \nMay include: \n1.1. Developing/Maintaining niche market  \n1.2. Use of organic/healthy ingredients   \n1.3. Environment-friendly and sustainable practices  \n1.4. Offering both affordable and high-quality products \nand services  \n1.5. Promotion and marketing strategies (e. g., on-line \nmarketing) \n2. Business operations  \nMay include: \n2.1 Purchasing  \n2.2 Accounting/Administrative work \n2.3 Production/Operations/Sales \n3. Internal controls \nMay include: \n3.1 Accounting systems \n3.2 Financial statements/reports \n3.3 Cash management \n  \n4. Promotional/Advertisi\nng initiatives  \nMay include: \n4.1 Use of tarpaulins, brochures, and/or flyers \n4.2 Sales, discounts and easy payment terms \n4.3 Use of social media/Internet \n4.4 “Service with a smile” \n4.5 Extra attention to regular customers\n\n--- PDF PAGE 46 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II  Revision 00       Promulgated (05/21/2019) \n42"
