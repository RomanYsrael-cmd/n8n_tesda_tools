 should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on the\nDTP;\n\n• Distance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin the same place. Distance learning may employ correspondence\nstudy, audio, video, computer technologies or other modern\n\n--- PDF PAGE 124 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n120\ntechnology that can be used to facilitate learning and formal and\nnon-formal training. Specific guidelines on this mode shall be\nissued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs, training\ncenters and other TVET providers which are intended to address the\nspecific needs of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP).\n\n--- PDF PAGE 125 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n121\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the\nfollowing requirements:\n• Must have completed the 10-year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent holder\n• Must have competence in CNC Programming acquired through training or\nwork experience or certification\n• Can communicate orally and or in writing\n• Can perform basic mathematical computation\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 20 trainees\nfor CNC Electric Discharge Machine (EDM)- Wire Cut Operation NC III are as\nfollows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n1 set\nCombination wrench, Size 6mm to 21mm\n1 set\nNeedle file, 6”, diamond\n1 pc.\nAdjustable wrench, 150mm\n1 set\nAllen wrench, Size4mm to 12mm\n5 pcs\nFlat File, 2nd cut, 150 mm\n1 pc.\nRubber mallet, 250g\n\n--- PDF PAGE 126 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n122\nMEASURING TOOLS\nQTY\nDESCRIPTION\n1 pc.\nVernier caliper (Digital) 300mm\n1 pc.\nInside Micrometer (Digital), 0- 25 mm\n1 pc.\nDial indicator with magnetic stand, lever-type, 0.01\nleast count\n1 pc.\nPrecision Bevel protractor, 200mm\n1 set\nGauge block, Steel, 0.0005 mm – 100mm\n1 pc.\nVernier height gage with dial indicator, 300mm\n2 pcs.\n Depth gage micrometer, 0- 25 mm\n1 set\nSteel Pin block, 0.1 mm – 10 mm\n1 pc.\nSurface gauge comparator, 0 .40-18.0 Ra(um)\n1 pc\nHeight Gage , 300mm\n1 pc\nGranite surface plate 500mm x 500mm x 100mm\n2pcs\nVertical alignment block\n1 pc.\nProfile projector\n1 pc.\nMicroscope\n(10x, minimum)\n\n--- PDF PAGE 127 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n123\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nCNC Electric Discharge Machine wire cut with\ncomplete standard accessories, X/Y/Z\nTravel:320×400×300\nTable size:435×650\nCut taper/thickness:±15°/80\n1 unit\nOverhead/LCD Projector\n10 units\nDesktop PC,\n1 unit\nAir Conditioner, 2HP\n1 set\nMaster CAM or Equivalent\n1 pc\nCAD Software\n\nMATERIALS\nQTY\nDESCRIPTION\n5 spool\nBrass wire (0.25mm)\n5 spool\nBrass wire (0.3mm)\n1 set\nNozzle (0.25 mm)\n1 set\nNozzle (0.3 mm)\n1 set\nFirst aid kit\n20 pcs\nMild Steel (MS) Plate, ground finish\n100mm x 100mm x 12mm\n20 pcs\nAluminum Pla