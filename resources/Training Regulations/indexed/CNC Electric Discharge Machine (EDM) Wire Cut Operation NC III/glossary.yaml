  "source_text": "1. CNC EDM wire cut\nEDM wire cutting uses a metallic wire to cut a programmed\ncontour in a workpiece. Extrusion dies and blanking\npunches are very often machined by wire cutting. Cutting is\nalways through the entire workpiece. To start machining it\nis first necessary to drill a hole in the workpiece or start from\nthe edge.\n\n2. Computer Program\nA series of instruction, in language a machine control unit\ncan understand, that outlines each steps a machine must\ntake to produce a part\n\n3. Computer Numerical\nControl (CNC)\nA machine tool microprocessor that permits the creation or\nmodification of parts. The programmed numerical control\nactivates the machine’s servos and spindle drive, and\ncontrols the machine operation\n\n4. Direct Numerical\nControl (DNC)\n\n5. Programing\n\n6. Computer Aided\nDesign (CAD)\n\n7. Computer Aided\nManufacturing (CAM)\n\n8. Surface Finish\n\n9. Tolerance\n\n10. Zero Reference Point\n\nA number of CNC machine in a manufacturing process\ncontrolled by one master computer\n\nThe process of coding machining conditions in which\ninformation such as cutter dimensions, cutter movement\nprocessing orders, feed rate, or spindle speed all under\nfixed regulation or specified format which refers to the\nworkpiece drawing to instruct numerically Controlled\n\nThe use of graphics oriented computer software for\ndesigning and drafting application\n\nComputer software that generates programs for the\noperation of NC (numerical control)\n\nThe degree of variation of a surface roughness or\nwaviness from a reference or normal plane, usually\nmeasured in micro inches or micrometer.\n\nThe amount of interference required for two or more parts\nthat are in contact. The amount of variation, over or under\nrequired size, permitted on a piece of machine work\n\nThe point on or off the part, chosen by the programmer as\nbeing most suitable for programming and machining\npurposes\n\n--- PDF PAGE 137 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n133\n\n11.Sequence of operation\n\n 12. Manual Programming\n13. Automatic\n Programming\n\nThe order of steps to be taken to successfully machine a\npart or perform an operation\n\nThis refers to the act of creating an NC program entirely\nthrough manual calculation\n\nAs the geometries to be machine get complex, it become\ndifficult to create program through manual calculation.\nSuch programs are created by the help of a special\npurpose computer\n\n--- PDF PAGE 138 ---\nCNC Electric Discharge Machine (EDM)-Wire Cut Operation NC II Revision 00 Promulgated (05/21/2019)\n134",
