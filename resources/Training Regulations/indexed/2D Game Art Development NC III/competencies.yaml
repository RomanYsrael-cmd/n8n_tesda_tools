        "source_title": "DEVELOP AND CONCEPTUALIZE ART STYLE",
        "source_text": "--- PDF PAGE 33 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n31\nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY    \n:    DEVELOP AND CONCEPTUALIZE ART STYLE \n \nUNIT CODE \n:   ICT313344 \n \nUNIT DESCRIPTOR \n:  This unit defines the knowledge, skills and attitude \nrequired to prepare and develop initial art based \non game design document. \n  \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Develop look-and-\nfeel \n \n \n1.1 \nConcept Studies are drawn and compiled based on \nGDD \n1.2 \nReferences are gathered  in line with the game key \nconcept \n1.3 \nStyle guide is defined and explained in line with \nkey concept and target platform \n2. Draw and compile \ncharacters \n2.1 \nGame characters are identified based on GDD \n2.2 \nCharacters are drawn based on the style guide and \nasset list  \n2.3 \nCharacter attributes are explained following \nenterprise procedures \n3. Draw the game \nworld \n3.1 \nSpecific environments or level background are \nidentified based on GDD \n3.2 \nEnvironments or level backgrounds are drawn \nbased on Style Guide \n3.3 \nIn-game worlds/backgrounds are explained \nfollowing enterprise procedures \n4. Draw and compile \nother assets \n4.1 \nResource asset list is prepared in line with GDD \n4.2 \nResources are drawn based on style guide and \nasset list \n4.3 \nAssets behavior and functions are described \nfollowing enterprise procedures \n5. Develop graphical \nuser interface \n5.1 \nGraphical User Interface (GUI) elements are \nidentified based on GDD \n5.2 \nGUI is drawn based on Style Guide\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n32\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. References \nMay include but not limited: \n1.1. \nSample themes \n1.2. \nPrevious designs \n1.3. \nTextures and patters \n2. Style guide \nStyle may include: \n2.1. \nGame art style \n2.2. \nGame engine specification \n2.3. \nGame metrics \n3. Game characters \nMay include but not limited: \n3.1. \nMain character \n3.2. \nSupporting characters \n3.3. \nNon-playable characters \n4. Character \nattributes \nMay include but not limited: \n4.1. \nPersonality \n4.2. \nBackground information \n4.3. \nPhysical attributes \n5. Resources \nMay include but not limited: \n5.1. \nEquipment \n5.2. \nItems/Objects \n6. Graphical User \nInterface (GUI) \nelements \nMay include but not limited: \n6.1 \nUser Interface (UI) icons/controls \n6.2 \nUI backgrounds\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n33\nEVIDENCE GUIDE \n \n1. Critical aspects of  \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDeveloped look-&-feel  \n1.2 \nDrawn and compiled characters \n1.3 \nDrawn the game world \n1.4 \nDrawn and compiled other assets \n1.5 \nDeveloped game interface \n2. Required \nKnowledge and \nAttitudes \n2.1 \nTime management \n2.2 \nUnderstanding the subject matter \n2.3 \nUnderstanding the expectation \n2.4 \nOrganizing your thoughts \n2.5 \nStudying together \n2.6 \nPerspective \n2.7 \nComposition/Layout \n2.8 \nIP knowledge \n2.9 \nBasic Anatomy \n2.10 Art Style/Genre \n2.11 5S and 3Rs \n \n3. Required Skills \n3.1 \nDrawing skills & techniques  \n3.2 \nCreating a project timetable \n3.3 \nUnderstanding key terminology \n3.4 \nDraft a mind map \n3.5 \nResearch skills \n3.6 \nOrganization skills \n3.7 \nDiscussion skills \n3.8 \nCommunication skills \n3.9 \nCreative skills \n3.10 Adherence to instructions \n3.11 Preparing Style Guide documentation \n3.12 Interpreting Style Guide specifications and user \nrequirements\n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nPC with drawing application with peripherals \n4.2 \nMouse \n4.3 \nPencil \n4.4 \nPaper \n4.5 \nPen \n5. Methods of     \nAssessment \nCompetency may be assessed through \n5.1 \nDemonstration / Practical exam  \n5.2 \nPresentation with questioning \n5.3 \nPortfolio of work samples \n5.4 \nGroup interview \n5.5 \nIndividual interview \n6. Context of     \nAssessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment.\n",
