        "source_title": "APPLY IN-GAME ANIMATION",
        "source_text": "--- PDF PAGE 45 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n43\n \nUNIT OF COMPETENCY    : \nAPPLY IN-GAME ANIMATION \n \nUNIT CODE                        : \nICT313348 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to identify, manage, arrange assets into key-\nframes and render the required file format. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Import assets \n1.1. \nAssets to be imported are identified according to \nscene requirements \n1.2. \nAssets are managed according to client’s instructions \nand requirements \n2. Apply assets to \nkey-frame  \n2.1. \nScene length and animation speed  is determined \naccording to provided Reference Materials \n2.2. \nScene shots are staged according to storyboard and \nlayout sheet \n2.3. \nAssets and object priorities that will be used and \nassigned in the scene are determined based on the \nReference Materials.  \n2.4. \nAssets are placed and arranged in key-frames based \non the action required for the scene \n3. Preview animation \n3.1. \nKey drawings with tweens of each required asset in \nthe scene is rendered & viewed to check speed and \nmovement \n3.2. \nKey drawings are revised and re-plotted for \nsmoothness of movements \n3.3. \nSound is applied and synchronized to models based \non given animation \n4. Render required     \nfile format \n4.1. \nExported files are checked and tested in line with style \nguide, story board and GDD requirements. \n4.2. \nAll approved exported files noted and moved \naccordingly to the resource folder based on the style \nguide\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n44\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. Assets  \nMay include but not limited: \n1.1. \nModels \n1.2. \nDialogue \n1.3. \nSound effects \n2. Reference \nMaterials  \nMay include but not limited: \n2.1. \nCut Scenes \n2.2. \nModel Sheets \n2.3. \nStyle Guide \n2.4. \nStory Board \n2.5. \nGame Engine\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n45\nEVIDENCE GUIDE \n \n1. Critical aspects of  \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Imported assets \n1.2 Applied assets to key-frame \n1.3 Previewed animation \n1.4 Rendered required file format \n2. Required \nKnowledge and \nAttitudes \n2.1 Graphic manipulation \n2.2 Graphic Composition (Vector/Raster) \n2.3 Problem solving \n2.4 Project management \n2.5 Observation \n2.6 Deductive reasoning \n2.7 Human, animal, objects and background drawing \nprinciples \n2.8 Perspective, proportion, volume, camera fielding, timing \ntechnicalities \n2.9 Acting, observation of movements and deductive \nreasoning \n2.10 Basic animation principles \n2.11 Graphic application \n2.12 Animation application \n2.13 Phonetics knowledge \n2.14  Creative/Drawing and composition \n2.15 Storyboard and layout \n2.16 5S and 3Rs \n3. Required Skills \n3.1 Drawing skills \n3.2 Applying Various Graphical Composition \n(Vector/Raster) \n3.3 Decision making exercise \n3.4 Implement execution plan \n3.5 Organizational skills \n3.6 Analytical Skills \n3.7 Able to read and interpret storyboard and layout \n3.8 Timing, space, weight analysis skills to animate actions \neffectively \n3.9 Graphic application manipulation \n3.10 Animation application manipulation \n3.11 Communication Skills \n3.12 Composition of elements and staging skills/eye for \ndetails \n3.13 Adherence to instructions \n3.14 Research\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n46\n \n4. Resource \nImplications \nThe following resources must be provided \n4.1 PC with drawing application with peripherals \n4.2 Mouse \n4.3 Electronic pen and tablet \n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 Demonstration / Practical exam  \n5.2 Presentation with questioning \n5.3 Portfolio of work samples \n5.4 Group interview \n5.5 Individual interview \n6. Context of \nAssessment \n6.1 Competency may be assessed in workplace or \nsimulated environment\n",
