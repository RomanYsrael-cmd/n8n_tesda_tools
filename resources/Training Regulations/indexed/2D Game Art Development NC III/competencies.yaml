        "source_title": "CREATE STORYBOARD AND ASSET LIST",
        "source_text": "--- PDF PAGE 36 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n34\n \nUNIT OF COMPETENCY    \n: \nCREATE STORYBOARD AND ASSET LIST \n \nUNIT CODE \n: \nICT313345 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and \nattitudes required to create storyboard and asset \nlist based on the identified key references and \nstoryline.    \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Develop storyboard \n    panels \n1.1 \nStoryline is identified based on GDD \n1.2 \nKey references are identified based on GDD \n1.3 \nCreate Thumbnails/Roughs based on Storyline. \n1.4 \nCreate Asset list based on GDD  \n2. Create narrative   \n    devices \n2.1 \nNarrative elements are prepared based on GDD \n2.2 \nStoryline elements are documented based on \nstoryboard and given script \n2.3 \nItems are improved and added to the previously \ncreated asset list based on GDD \n3. Create cut scenes \n3.1 \nCut scenes are identified based on storyboard and \nscript \n3.2 \nIndividual storyboards are drawn using proxies for each \ncut scene based on the style guide  \n3.3 \nAsset list is finalized based on GDD\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n35\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. Key references \nMay include but are not limited: \n1.1 Scenes \n1.2 Duration \n1.3 Characters \n1.4 Backgrounds \n1.5 Props \n1.6 Special Effects \n1.7 Angles \n2. Narrative elements \nMay include but are not limited: \n2.1 Story outline \n2.2 Scenario matrix \n2.3 Dialogues \n3. Storyline \nMay include but are not limited: \n3.1 Scenes \n3.2 Characters \n3.3 Backgrounds \n3.4 Props \n3.5 Special Effects \n3.6 Angles/Shots  \n3.7 Triggers/Flag\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III                                                              \n \n \n36\nEVIDENCE GUIDE \n \n1. Critical aspects of   \n    competency \nAssessment requires evidence that the candidate: \n1.1 \nDeveloped storyboard panels  \n1.2 \nCreated narrative devices \n1.3 \nCreated cut-scenes \n2. Required \nKnowledge and \nAttitudes \n2.1 \nCreating narrative devices \n2.2 \nIP knowledge \n2.3 \nPerspective \n2.4 \nComposition/Layout \n2.5 \nDynamic Anatomy \n2.6 \n5S and 3Rs \n3. Required Skills \n3.1 \nDrawing Skills \n3.2 \nResearch Skills \n3.3 \nOrganization Skills \n3.4 \nCommunication Skills \n3.5 \nCreative Skills \n3.6 \nStory Telling Skills \n3.7 \nCombine previous skills and knowledge \n3.8 \nAdherence to instructions \n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nMock theme, model sheets, and script \n4.2 \nPen and paper \n5. Methods of     \nAssessment \nCompetency may be assessed through \n5.1 \nDemonstration / Practical exam  \n5.2 \nPresentation with questioning \n5.3 \nPortfolio of work samples \n5.4 \nGroup interview \n5.5 \nIndividual interview \n6. Context of     \nAssessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment\n",
