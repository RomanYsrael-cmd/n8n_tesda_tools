  "source_section_text": "SECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and \ncore units of competency required in 2D GAME ART DEVELOPMENT NC III. \n \nUNIT OF COMPETENCY \n: LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n \n: 500311109 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and \n Attitudes required to lead in the dissemination \n and discussion of ideas, information and issues \n in the workplace. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Communicate \ninformation about \nworkplace \nprocesses \n1.1. Appropriate communication method is selected \n1.2. Multiple operations involving several topics areas \nare communicated accordingly \n1.3. Questions are used to gain extra information \n1.4. Correct sources of information are identified \n1.5. Information is selected and organized correctly \n1.6. Verbal and written reporting is undertaken when \nrequired \n1.7. Communication skills are maintained in all situations \n2. Lead workplace \ndiscussions \n2.1. Response to workplace issues are sought \n2.2. Response to workplace issues are provided \nimmediately \n2.3. Constructive contributions are made to workplace \ndiscussions on such issues as production, quality \nand safety \n2.4. Goals/objectives and action plan undertaken in the \nworkplace are communicated \n3. Identify and \ncommunicate \nissues arising in the \nworkplace \n3.1. Issues and problems are identified as they arise \n3.2. Information regarding problems and issues are \norganized coherently to ensure clear and effective \ncommunication \n3.3. Dialogue is initiated with appropriate personnel \n3.4. Communication problems and issues are raised as \nthey arise\n\n--- PDF PAGE 5 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n3\n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1. \nNon-verbal gestures \n1.2. \nVerbal \n1.3. \nFace to face \n1.4. \nTwo-way radio \n1.5. \nSpeaking to groups \n1.6. \nUsing telephone \n1.7. \nWritten \n1.8. \nInternet\n\n--- PDF PAGE 6 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n4\n EVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDealt with a range of communication/information at \none time \n1.2. \nMade constructive contributions in workplace \nissues \n1.3. \nSought workplace issues effectively \n1.4. \nResponded to workplace issues promptly \n1.5. \nPresented information clearly and effectively \nwritten form \n1.6. \nUsed appropriate sources of information \n1.7. \nAsked appropriate questions \n1.8. \nProvided accurate information \n2. Required \nKnowledge and \nAttitudes \n2.1. \nOrganization \nrequirements \nfor \nwritten \nand \nelectronic communication methods \n2.2. \nEffective verbal communication methods \n3. Required Skills \n3.1. \nOrganize information \n3.2. \nUnderstand and convey intended meaning \n3.3. \nParticipate in variety of workplace discussions \n3.4. \nComply with organization requirements for the use \nof written and electronic communication methods \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1. \nVariety of Information \n4.2. \nCommunication tools \n4.3. \nSimulated workplace \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. \nCompetency in this unit must be assessed through \n5.2. \nDirect Observation \n5.3. \nInterview \n6. Context for \nAssessment \n6.1. \nCompetency may be assessed in the workplace or \nin simulated workplace environment\n\n--- PDF PAGE 7 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n5\nUNIT OF COMPETENCY \n \n: LEAD SMALL TEAMS \n \nUNIT CODE \n \n: 500311110 \n \n UNIT DESCRIPTOR : This unit covers the knowledge, skills and \nattitudes to lead small teams including \nsetting and maintaining team and individual \nperformance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Provide team \nleadership \n1.1. Work requirements are identified and presented to \nteam members \n1.2. Reasons for instructions and requirements are \ncommunicated to team members \n1.3. Team members’ queries and concerns are \nrecognized, discussed and dealt with\n2. Assign \nresponsibilities \n2.1. Duties, and responsibilities are allocated having regard \nto the skills, knowledge and aptitude required to \nproperly undertake the assigned task and according to \ncompany policy \n2.2. Duties are allocated having regard to individual \npreference, domestic and personal considerations, \nwhenever possible \n3. Set performance \nexpectations for \nteam members \n3.1. Performance expectations are established based on \nclient needs and according to assignment requirements \n3.2. Performance expectations are based on individual team \nmembers duties and area of responsibility \n3.3. Performance expectations are discussed and \ndisseminated to individual team members\n4. Supervise team \nperformance \n4.1. Monitoring of performance takes place against \ndefined performance criteria and/or assignment \ninstructions and corrective action taken if required \n4.2. Team members are provided with feedback, positive \nsupport and advice on strategies to overcome any \ndeficiencies \n4.3. Performance issues which cannot be rectified or \naddressed within the team are referenced to appropriate \npersonnel according to employer policy \n4.4. Team members are kept informed of any changes in the \npriority allocated to assignments or tasks which might \nimpact on client/customer needs and satisfaction \n4.5. Team operations are monitored to ensure that \nemployer/client needs and requirements are met \n4.6. Follow-up communication is provided on all issues \naffecting the team \n4.7. All relevant documentation is completed in accordance \nwith company procedures\n\n--- PDF PAGE 8 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n6\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \n1.1. Client Profile \n1.2. Assignment instructions\n2. Team member’s \nconcerns \n2.1. Roster/shift details \n3. Monitor \nperformance \n3.1. Formal process \n3.2. Informal process \n4. Feedback \n4.1. Formal process \n4.2. Informal process\n5. Performance issues \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service\n\n--- PDF PAGE 9 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n7\nEVIDENCE GUIDE \n1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to next \nlevel of management or appropriate specialist and to \nnegotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to \nindividual’s knowledge, skills and aptitude and the needs \nof the tasks to be performed \n1.5. Set and communicated performance expectations for a \nrange of tasks and duties within the team and provided \nfeedback to team members\n2. Required \nKnowledge and \nAttitudes \n2.1. Company policies and procedures \n2.2. Relevant legal requirements \n2.3. How performance expectations are set \n2.4. Methods of Monitoring Performance \n2.5. Client expectations \n2.6.\nTeam member’s duties and responsibilities\n3. Required Skills \n3.1. Communication skills required for leading teams \n3.2. Informal performance counseling skills \n3.3. Team building skills \n3.4.\nNegotiating skills\n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1. Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. Direct observations of work activities of the individual \nmember in relation to the work activities of the group \n5.2. Observation of simulation and/or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3. Case studies and scenarios as a basis for discussion of \nissues and strategies in teamwork\n6. Context of \nAssessment \n6.1. Competency assessment may occur in workplace or any \nappropriately simulated environment \n6.2. Assessment shall be observed while task are being \nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n8\nUNIT OF COMPETENCY: \nDEVELOP AND PRACTICE NEGOTIATION \nSKILLS \n \nUNIT CODE : \n 500311111 \nUNIT DESCRIPTOR : \nThis unit covers the skills, knowledge and attitudes \nrequired to collect information in order to negotiate \nto a desired outcome and participate in the \nnegotiation. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Plan negotiations \n1.1 \n \n1.2 \n \n \n1.3 \n \n1.4 \n \n1.5 \nInformation on preparing for negotiation is \nidentified and included in the plan \nInformation on creating non verbal environments \nfor positive negotiating is identified and included in \nthe plan \nInformation on active listening is identified and \nincluded in the plan \nInformation on different questioning techniques is \nidentified and included in the plan \nInformation is checked to ensure it is correct and up-\nto- date \n2. Participate in \nnegotiations \n2.1 \n \n2.2 \n2.3 \n \n2.4 \n2.5 \n \n2.6 \n \n2.7 \n2.8 \nCriteria for successful outcome are agreed upon by \nall parties \nDesired outcome of all parties are considered \nAppropriate language is used throughout the \nnegotiation \nA variety of questioning techniques are used \nThe issues and processes are documented and \nagreed upon by all parties \nPossible solutions are discussed and their viability \nassessed \nAreas for agreement are confirmed and recorded \nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n9\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Preparing for \nnegotiation \n1.1 \n \n1.2 \n1.3 \n1.4 \n \n \n \n \n \n1.5 \n \n \n \n \n \n \n \n1.6 \nBackground information on other parties to the \nnegotiation \nGood understanding of topic to be negotiated \nClear understanding of desired outcome/s \nPersonal attributes \n1.4.1 self awareness \n1.4.2 self esteem \n1.4.3 objectivity \n1.4.4 empathy \n1.4.5 respect for others \nInterpersonal skills \n1.5.1 listening/reflecting \n1.5.2 non verbal communication \n1.5.3 assertiveness \n1.5.4 behavior labeling \n1.5.5 testing understanding \n1.5.6 seeking information \n1.5.7 self disclosing \nAnalytic skills \n1.6.1 observing differences between content \nand process \n1.6.2 identifying bargaining information \n1.6.3 applying strategies to manage process \n1.6.4 applying steps in negotiating process \n1.6.5 strategies to manage conflict \n1.6.6 steps in negotiating process \n1.6.7 options within organization and \nexternally for resolving conflict \n2. Non-verbal \nenvironments \n2.1 \n2.2 \n2.3 \n2.4 \nFriendly reception \nWarm and welcoming room \nRefreshments offered \nLead in conversation before negotiation begins \n3. Active listening \n3.1 \n3.2 \n3.3 \n3.4 \n3.5 \nAttentive \nDon’t interrupt \nGood posture \nMaintain eye contact \nReflective listening \n \n4. Questioning \ntechniques \n4.1 \n4.2 \n4.3 \nDirect \nIndirect \nOpen-ended\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n10\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated sufficient knowledge of the factors \ninfluencing negotiation to achieve agreed outcome \n1.2 Participated in negotiation with at least one person \nto achieve an agreed outcome \n2. Required \nKnowledge and \nAttitudes \n2.1 Codes of practice and guidelines for the \norganization \n2.2 Organizations policy and procedures for \nnegotiations \n2.3 Decision making and conflict resolution strategies \nprocedures \n2.4 Problem solving strategies on how to deal with \nunexpected questions and attitudes during \nnegotiation \n2.5 Flexibility \n2.6 Empathy \n3. Required Skills \n3.1 Interpersonal skills to develop rapport with other \nparties \n3.2 Communication skills (verbal and listening) \n3.3 Observation skills \n3.1 Negotiation skills \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Room with facilities necessary for the negotiation \nprocess \n4.2 Human resources (negotiators) \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Observation/demonstration and questioning \n5.2 Portfolio assessment \n5.3 Oral and written questioning \n5.4 Third party report \n6. Context for \nAssessment \n6.1 Competency to be assessed in real work \nenvironment or in a simulated workplace setting.\n\n--- PDF PAGE 13 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n11\nUNIT OF COMPETENCY : \nSOLVE PROBLEMS RELATED TO WORK \nACTIVITIES \nUNIT CODE \n \n: 500311112 \nUNIT DESCRIPTOR \n \n: \nThis unit of covers the knowledge, skills and \nattitudes required to solve problems in the \nworkplace including the application of problem \nsolving techniques and to determine and resolve \nthe root cause of problems. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify the problem \n1.1. \nVariances are identified from normal operating \nparameters; and product quality \n1.2. \nExtent, cause and nature are of the problem \nare defined through observation, investigation \nand analytical techniques \n1.3. \nProblems are clearly stated and specified \n2. Determine \nfundamental causes \nof the problem \n2.1. \nPossible causes are identified based on \nexperience and the use of problem solving \ntools / analytical techniques. \n2.2. \nPossible cause statements are developed \nbased on findings \n2.3. \nFundamental causes are identified per results \nof investigation conducted \n3. Determine corrective \naction \n3.1. \nAll possible options are considered for \nresolution of the problem \n3.2. \nStrengths and weaknesses of possible options \nare considered \n3.3. \nCorrective actions are determined to resolve \nthe problem and possible future causes \n3.4. \nAction plans are developed identifying \nmeasurable objectives, resource needs and \ntimelines in accordance with safety and \noperating procedures \n4. \nProvide \nrecommendation/s \nto manager \n4.1. \nReport on recommendations are prepared \n4.2. \nRecommendations are presented to \nappropriate personnel. \n4.3. \nRecommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n12\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Analytical techniques \n1.1. \nBrainstorming \n1.2. \nIntuitions/Logic \n1.3. \nCause and effect diagrams \n1.4. \nPareto analysis \n1.5. \nSWOT analysis \n1.6. \nGant chart, Pert CPM and graphs \n1.7. \nScattergrams \n \n2. Problem \n \n2.1. \nNon – routine process and quality problems \n2.2. \nEquipment selection, availability and failure \n2.3. \nTeamwork and work allocation problem \n2.4. \nSafety and emergency situations and \nincidents \n \n3. Action plans \n \n3.1. \nPriority requirements \n3.2. \nMeasurable objectives \n3.3. \nResource requirements \n3.4. \nTimelines \n3.5. \nCo-ordination and feedback requirements \n3.6. \nSafety requirements \n3.7. \nRisk assessment \n3.8. \nEnvironmental requirements\n\n--- PDF PAGE 15 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n13\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nIdentified the problem \n1.2. \nDetermined the fundamental causes of the problem \n1.3. \nDetermined the correct / preventive action \n1.4. \nProvided recommendation to manager \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a \nwalk through forming part of the response. These \nassessment activities should include a range of problems, \nincluding new, unusual and improbable situations that may \nhave happened. \n2. Required \nKnowledge and \nAttitudes \n2.1. \nCompetence includes a thorough knowledge and \nunderstanding of the process, normal operating \nparameters, and product quality to recognize non-\nstandard situations \n2.2. \nCompetence to include the ability to apply and \nexplain, sufficient for the identification of \nfundamental cause, determining the corrective \naction and provision of recommendations \n2.2.1. Relevant equipment and operational \nprocesses \n2.2.2. Enterprise goals, targets and measures \n2.2.3. Enterprise quality, OHS and environmental \nrequirement \n2.2.4. Principles of decision making strategies and \ntechniques \n2.2.5. Enterprise information systems and data \ncollation \n2.2.6. Industry codes and standards \n \n3. Required Skills \n3.1. \nUsing range of formal problem solving techniques \n3.2. \nIdentifying and clarifying the nature of the problem \n3.3. \nDevising the best solution \n3.4. \nEvaluating the solution \n3.5. \nImplementation of a developed plan to rectify the \nproblem\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n14\n \n4. Resource \nImplications \n4.1. \nAssessment will require access to an operating \nplant over an extended period of time, or a suitable \nmethod of gathering evidence of operating ability \nover a range of situations. A bank of scenarios / \ncase studies / what ifs will be required as well as \nbank of questions which will be used to probe the \nreason behind the observable action. \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. \nCase studies on solving problems in the workplace \n5.2. \nObservation \nThe unit will be assessed in a holistic manner as is \npractical and may be integrated with the assessment of \nother relevant units of competency. Assessment will occur \nover a range of situations, which will include disruptions to \nnormal, smooth operation. Simulation may be required to \nallow for timely assessment of parts of this unit of \ncompetency. Simulation should be based on the actual \nworkplace and will include walk through of the relevant \ncompetency components. \n6. Context of \nAssessment \n6.1. \nIn all workplace, it may be appropriate to assess \nthis unit concurrently with relevant teamwork or \noperation units.\n\n--- PDF PAGE 17 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n15\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND \n TECHNIQUES \nUNIT CODE : \n500311113 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired in the application of mathematical \nconcepts and techniques. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify mathematical \ntools and techniques to \nsolve problem \n1.1 Problem areas are identified based on given \ncondition \n1.2 Mathematical techniques are selected based \non the given problem \n2. Apply mathematical \nprocedure/solution \n2.1 Mathematical techniques are applied based on \nthe problem identified \n2.2 Mathematical computations are performed to the \nlevel of accuracy required for the problem \n2.3 Results of mathematical computation is \ndetermined and verified based on job \nrequirements \n3. Analyze results \n3.1 Result of application is reviewed based on \nexpected and required specifications and \noutcome \n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n16\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Mathematical techniques \nMay include but are not limited to: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n2. Appropriate action \n2.1 Review in the use of mathematical \ntechniques (e.g. recalculation, re-modeling) \n2.2 Report error to immediate superior for proper \naction \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified, applied and reviewed the use of \nmathematical concepts and techniques to workplace \nproblems \n2. Required \nKnowledge and \nAttitude \n2.1 Fundamental operation (addition, subtraction, \ndivision, multiplication) \n2.2 Measurement system \n2.3 Precision and accuracy \n2.4 Basic measuring tools/devices \n3. Required Skills \n3.1 Applying mathematical computations \n3.2 Using calculator \n3.3 Using different measuring tools \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Calculator \n4.2 Basic measuring tools \n4.3 Case Problems \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Authenticated portfolio \n5.2 Written Test \n5.3 Interview/Oral Questioning \n5.4 Demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed in the work place or \nin a simulated work place setting\n\n--- PDF PAGE 19 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n17\nUNIT OF COMPETENCY: \n USE RELEVANT TECHNOLOGIES \n \nUNIT CODE : \n 500311114 \n \nUNIT DESCRIPTOR : \nThis unit of competency covers the knowledge, \nskills, and attitude required in selecting, \nsourcing \nand \napplying \nappropriate \nand \naffordable technologies in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Study/select \nappropriate technology\n \n \n1.1 Usage of different technologies is determined \nbased on job requirements \n1.2 Appropriate technology is selected as per work \n specification \n \n2. Apply relevant \ntechnology \n \n \n2.1 Relevant technology is effectively used in \ncarrying \n out function \n2.2 Applicable software and hardware are used as \nper \n task requirement \n2.3 Management concepts are observed and \npracticed as per established industry practices \n \n3. Maintain/enhance \nrelevant technology \n \n3.1 Maintenance of technology is applied in \naccordance with the industry standard \noperating procedure, manufacturer’s \noperating guidelines and occupational \nhealth and safety procedure to ensure its \noperative ability \n3.2 Updating of technology is maintained through \ncontinuing education or training in accordance \nwith job requirement \n3.3 Technology failure/ defect is immediately \nreported to the concern/responsible person or \nsection for appropriate action\n\n--- PDF PAGE 20 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n18\n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technology \nMay include but are not limited to: \n1.1 Office technology \n1.2 Industrial technology \n1.3 System technology \n1.4 Information technology \n1.5 Training technology \n2. Management concepts \nMay include but are not limited: \n2.1 Real Time Management \n2.2 KAIZEN or continuous improvement \n2.3 5s \n2.4 Total Quality Management \n2.5 Other management/productivity tools \n3. Industry standard operating \nprocedure \n3.1 Written guidelines relative to the usage of \noffice technology/equipment \n3.2 Verbal advise/instruction from the co-worker \n4. Manufacturer’s operating \nguidelines/ instructions \n4.1 Written instruction/manuals of specific \ntechnology/ equipment \n4.2 General instruction manual \n4.3 Verbal advise from manufacturer relative to \nthe operation of equipment \n5. Occupational health and \nsafety procedure \n5.1 Relevant statutes on OHS \n5.2 Company guidelines in using \n technology/equipment \n6. Appropriate action \n6.1 Implementing preventive maintenance \nschedule \n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 21 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n19\n EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Studied and selected appropriate technology \nconsistent with work requirements \n1.2 Applied relevant technology \n1.3 Maintained and enhanced operative ability of \nrelevant technology \n2. Required \nKnowledge and \nAttitude \n2.1 Awareness on technology and its function \n2.2 Repair and maintenance procedure \n2.3 Operating instructions \n2.4 Applicable software \n2.5 Communication techniques \n2.6 Health and safety procedure \n2.7 Company policy in relation to relevant technology \n2.8 Different management concepts \n2.9 Technology adaptability \n3. Required Skills \n3.1 Relevant technology application/implementation \n3.2 Basic communication skills \n3.3 Software skills \n3.4 Basic troubleshooting skills \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Relevant technology \n4.2 Interview and demonstration questionnaires \n4.3 Assessment packages \n5. Methods of \nAssessment \nCompetency must be assessed through: \n5.1 Interview \n5.2 Actual demonstration \n5.3 Authenticated portfolio (related certificates of \ntraining/seminar) \n6. Context of \nAssessment \n6.1 Competency may be assessed in actual workplace or \nsimulated environment\n\n--- PDF PAGE 22 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n20\nCOMMON COMPETENCIES \n \n \nUNIT TITLE \n: \nAPPLY CRITICAL THINKING AND THOUGHT \nORGANIZATION \n \nUNIT CODE \n: \nICT315203 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, attitudes and values \nneeded to develop the ability to extract and use relevant \ndata. This unit will enhance the ability to critically assess \nthe data or information gathered in order to make sound \narguments, informed decisions and problem solving. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Identify the theoretical \nfoundations of critical \nthinking \n1.1. Assess and choose one of the study methods to \neffective data gathering, decision-making and \nproblem solving. \n1.2. Identify the components of critical thinking. \n1.3. Identify the impediments of critical thinking to avoid \nthem in data gathering and decision making \nsituations. \n1.4. Identify the types of claims. \n2. Develop constructive \narguments \n2.1. Establish the premise and possible conclusion based \non the information provided from a job or industry \nscenario. \n2.2. Use methods of careful analysis to make \nconstructive arguments based on a job or industry \nscenario.\n3. Apply methods of \nreasoning \n3.1. Analogies are used to support reasoning. \n3.2. Identify the cause and effects based on the criteria or \ninformation provided to support reasoning. \n3.3. Identify and avoid the common mistakes in \nreasoning about causes. \n3.4. Make evaluations based on the criteria or information \nprovided.\n4. Affirm generalization \n \n4.1. Use past experiences to come up with a good \ngeneralization. \n4.2. Use appropriate samples to support generalization. \n4.3. Validate the generalization with margin of errors, \nvariation in population and risk. \n5. Arrive at a conclusion \n5.1. Make rational arguments using the elements of \nreasoning. \n5.2. Clarify conceptual ideas using organized gathered \ndata and evidences \n5.3. Alternatives are worked out to place argument in the \ncontext of study. \n5.4. Challenge or validate the position of the conclusion \nand make counter responses to emphasize a \nviewpoint.\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n21\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Study methods \nMay include but are not limited to: \n1.1 Creating schedules \n1.2 Prioritizing tasks \n1.3 Researching on resources \n2. Components of \ncritical thinking \nMay include but are not limited to: \n2.1 Motivation \n2.2 Set of information \n2.3 Belief generating \n2.4 Processing skills \n2.5 Intellectual commitment \n2.6 Using skills to guide behavior \n2.7 Possession of a set of skills \n2.8 Skillful manipulation of ideas \n2.9 Exercise without acceptance of skill results \n3. Types of claims \n3.1 Objective \n3.2 Subjective \n3.3 Moral claims\n4. methods of careful \nanalysis \nMay include but are not limited to: \n4.1 Clarity \n4.2 Fill in connecting premises \n4.3 Thought organization \n5. Common mistakes in \nreasoning about \ncauses \nMay include but are not limited to: \n5.1 Logical fallacies \n5.2 Over-analysis \n5.3 Biased Thinking \n5.4 Unawareness/Decisions made based on incomplete \ninformation \n5.5 Bandwagon Mentality \n5.6 Reversing cause and effect\n6. Appropriate samples \nMay pertain but are not limited to: \n6.1 Representative of the population being studied \n6.2 Sample size \n6.3 Depth of the study conducted using the sample\n\n--- PDF PAGE 24 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n22\n \n7. Elements of \nreasoning \nMay pertain but are not limited to: \n7.1 Purpose \n7.2 Question at issue \n7.3 Assumptions \n7.4 Implications \n7.5 Consequences \n7.6 Information \n7.7 Concept \n7.8 Conclusions interpretations \n7.9 Point of view \n7.10 \nAlternatives \n7.11 \nContext \n8. Alternatives \nMay include but are not limited to: \n8.1 Role playing \n8.2 Viewing of media clips \n8.3 Questioning \n8.4 Mind mapping \n8.5 Simulation \n8.6 Demonstration\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n23\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment must show that the candidate: \n1.1 Extract and processed relevant data \n1.2 Recognize fact from fiction \n1.3 Reason with constructive arguments \n1.4 Reason using analogies, and cause and effect as part \nof the argument \n1.5 Evaluate scenarios and explanations \n1.6 Recognize and evaluated assumptions \n1.7 Identify the theoretical foundations of critical thinking \n2. Required \nKnowledge and \nAttitudes \n \n2.1 Thought organization \n2.2 Logic \n2.3 Basic statistics \n2.4 Reasoning \n3. Required skills \n \n3.1 Writing skills \n3.2 Thought organization \n3.3 Negotiation skills \n4. Method of \nassessment \nCompetency may be assessed through: \n4.1 Direct Observation and Oral Questioning \n4.2 Proficiency in doing written analysis \n4.3 Practical demonstration \n4.4 Indirect observation through coaching \n5. Resource \nimplication \nThe following resources MUST be provided: \n5.1 Case studies \n5.2 Paper and pen \n6. Context of \nAssessment \n \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 26 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n24\nUNIT TITLE : \n APPLY QUALITY STANDARDS \n \nUNIT CODE \n: \nICT315202 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills, attitudes and \nvalues needed to apply quality standards in the \nworkplace. The unit also includes the application of \nrelevant safety procedures and regulations, organization \nprocedures and customer requirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of \nreceived materials \n1.1. Work instruction is obtained and work is carried out in \naccordance to the standard operating procedures. \n1.2. Received materials are checked against workplace \nstandards and specifications. \n1.3. Faulty materials related to the work are identified and \nisolated. \n1.4. Faults and any identified causes are recorded and/or \nreported to the supervisor concerned in accordance to \nworkplace procedures. \n1.5. Faulty materials are replaced in accordance to the \nworkplace procedures. \n2. Assess own work \n2.1. Documentation relative to the quality within the \ncompany is identified and used. \n2.2. Completed work is checked against workplace \nstandards relevant to the task undertaken. \n2.3. Errors are identified and isolated. \n2.4. Information on the quality and other indicators of \nproduction performance are recorded in accordance \nto workplace procedures. \n2.5. In cases of deviations from specific quality \nstandards, causes are documented and reported in \naccordance to the workplace’ s standards operating \nprocedures. \n3. Engage in quality \nimprovement \n3.1. Process improvement procedures are participated in \nrelative to the workplace assignment. \n3.2. Work is carried out in accordance to the process \nimprovement procedures. \n3.3. Performance of operation or quality of product of \nservice to ensure customer satisfaction is monitored.\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n25\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Materials \n1.1 Materials May include but are not limited: \n1.1.1. Manuals \n1.1.2. Job orders \n1.1.3. Instructional videos \n2 Faults \n2.1 Faults May include but are not limited: \n2.1.1. Materials not to specification \n2.1.2. Materials contain incorrect/outdated \ninformation \n2.1.3. Hardware defects \n2.1.4. Materials that do not conform with any \nregulatory agencies \n3 Documentation \n3.1 Organization work procedures \n3.2 Manufacturer’s instruction manual \n3.3 Customer requirements \n3.4 Forms \n4 Errors \n4.1 Errors may be related but not limited to the following:\n4.1.1. Deviation from the requirements of the Client \n4.1.2. Deviation from the requirement of the \norganization \n5 Quality standards \n \n5.1 Quality standards may be related but not limited to \nthe following: \n5.1.1. Materials \n5.1.2. Hardware \n5.1.3. Final product \n5.1.4. Production processes \n5.1.5. Customer service \n6 Customer \n6.1 Co-worker \n6.2 Supplier/Vendor \n6.3 Client \n6.4 Organization receiving the product or service\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n26\n \nEVIDENCE GUIDE \n \n \n \n1 Critical aspect of \ncompetency \nAssessment must show that the candidate: \n1.1 Carried out work in accordance with the company’s \nstandard operating procedures \n1.2 Performed task according to specifications \n1.3 Reported defects detected in accordance with \nstandard operating procedures \n1.4 Carried out work in accordance with the process \nimprovement procedures\n2 Required Knowledge \nand Attitude \n2.1 Relevant production processes, materials and \nproducts \n2.2 Characteristics of materials, software and hardware \nused in production processes \n2.3 Quality checking procedures \n2.4 Workplace procedures \n2.5 Safety and environmental aspects of production \nprocesses \n2.6 Fault identification and reporting \n2.7\nQuality improvement processes \n3 Required skills \n3.1 Reading skills required to interpret work instruction \n3.2 Communication skills needed to interpret and apply \ndefined work procedures \n3.3 Carry out work in accordance with OHS policies and \nprocedures \n3.4 Critical thinking \n3.5\nSolution providing and decision-making\n4 Method of \nassessment \nThe assessor must select two of the following to objectively \nevaluate the candidate: \n4.1 Observation and oral questioning \n4.2 Third party report \n4.3 Portfolio \n4.4\nPractical demonstration\n5 Resource implication \n5.1 \nMaterials, software and hardware to be used in a \nreal or simulated situation \n6 Context of \nAssessment \n6.1 \nAssessment may be conducted in the workplace or \nin a simulated environment\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n27\n \nUNIT TITLE \n: \nPERFORM COMPUTER OPERATIONS \nUNIT CODE \n: \nICT 311203 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, attitudes and values \nneeded to perform computer operations which include \ninputting, accessing, producing and transferring data using \nthe appropriate hardware and software.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Plan and prepare \nfor task to be \ntaken undertaken \n1.1. Requirements of task are determined in accordance \nwith the required output. \n1.2. Appropriate hardware and software are selected \naccording to task assigned and required outcome. \n1.3. Task is planned to ensure that OH & S guidelines and \nprocedures are followed. \n1.4. Client -specific guidelines and procedures are followed.\n1.5. Required data security guidelines are applied in \naccordance with existing procedures. \n2. Input data into \ncomputer \n2.1. Data are entered into the computer using appropriate \nprogram/application in accordance with company \nprocedures. \n2.2. Accuracy of information is checked and information is \nsaved in accordance with standard operating \nprocedures. \n2.3. Inputted data is stored in storage media according to \nrequirements. \n2.4.\nWork is performed within ergonomic guidelines.\n3. Access \ninformation using \ncomputer \n3.1. Correct program/application is selected based on job \nrequirements. \n3.2. Program/application containing the information \nrequired is accessed according to company \nprocedures. \n3.3. Desktop icons are correctly selected, opened and \nclosed for navigation purposes. \n3.4. Keyboard techniques are carried out in line with OH & \nS requirements for safe use of keyboards.\n4. Produce output/ \ndata using \ncomputer system \n4.1. Entered data are processed using appropriate software \ncommands. \n4.2. Data are printed out as required using computer \nhardware /peripheral devices in accordance with \nstandard operating procedures. \n4.3. Files and data are transferred between compatible \nsystems using computer software, hardware/peripheral \ndevices in accordance with standard operating \nprocedures.\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n28\n \n5. Use basic \nfunctions of a \nwww-browser to \nlocate information\n5.1. Information requirements for internet search are \nestablished. \n5.2. Browser is launched. \n5.3. Search engine is loaded. \n5.4. Appropriate search criteria/or URL of site is entered. \n5.5. Relevant links are followed to locate required \ninformation. \n5.6. Useful pages are bookmarked or printed as required. \n6. Maintain \ncomputer \nequipment and \nsystems \n6.1. Procedures for ensuring security of data, including \nregular back-ups and virus checks are implemented in \naccordance with standard operating procedures. \n6.2. Basic file maintenance procedures are implemented in \nline with the standards operating procedures.\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n29\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Hardware and \nperipheral \ndevices \n1.1 \nPersonal computers \n1.2 \nNetworked systems \n1.3 \nCommunication equipment \n1.4 \nPrinters \n1.5 \nScanners \n1.6 \nKeyboard \n1.7 \nMouse \n1.8\nVoice/Data logger\n2. Software \nSoftware includes the following but not limited to: \n2.1 \nWord processing packages \n2.2 \nDatabase packages \n2.3 \nInternet \n2.4 \nSpreadsheets \n2.5\nClient Specific Software\n3. OH & S \nguidelines \n3.1 \nOHS guidelines \n3.2 \nEnterprise procedures \n4. Storage media \nStorage media include the following but not limited to: \n4.1 \nCDs / DVDs \n4.2 \nMemory sticks / USB drives \n4.3 \nhard disk drives, local and remote \n4.4\nOptical drives\n5. Ergonomic \nguidelines \n5.1 \nTypes of equipment used \n5.2 \nAppropriate furniture \n5.3 \nSeating posture \n5.4 \nLifting posture \n5.5\nVisual display unit screen brightness\n6. Desktop icons \n6.1 \nIcons include the following but not limited to: \n6.2 \nDirectories/folders \n6.3 \nFiles \n6.4 \nNetwork devices \n6.5 \nRecycle bin \n6.6\nProgram icons\n7. Maintenance \n7.1 \nCreating and managing more space in the hard disk \nand other peripherals \n7.2 \nReviewing programs \n7.3 \nDeleting unwanted files \n7.4 \nBacking up files \n7.5 \nChecking hard drive for errors \n7.6 \nUsing up to date anti-virus programs \n7.7 \nCleaning dust from internal and external surfaces).\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n30\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment must show that the candidate: \n1.1 \nSelected and used hardware components correctly and \naccording to the task requirement \n1.2 \nused basic software applications to create new files and \ndocuments \n1.3 \nProduced accurate and complete data in accordance \nwith the requirements \n1.4 \nUsed appropriate devices and procedures to transfer \nfiles/data accurately \n1.5 \nUsed basic functions of a www-browser to locate \ninformation. \n2. Required \nKnowledge and \nAttitudes \n2.1 \nBasic ergonomics of keyboard and computer user \n2.2 \nMain types of computers and basic features of different \noperating systems \n2.3 \nMain parts of a computer \n2.4 \nStorage devices and basic categories of memory \n2.5 \nRelevant types of software \n2.6 \nGeneral security, privacy legislation and copyright \n2.7 \nViruses \n2.8 \nOH & S principles and responsibilities \n2.9 \nCalculating computer capacity \n2.10 Productivity Application \n2.11 Business Application \n2.12 System Software \n3. Required skills \n3.1 \nReading and comprehension skills required to interpret \nwork instruction and to interpret basic user manuals. \n3.2 \nCommunication skills to identify lines of communication, \nrequest advice, follow instructions and receive feedback.\n3.3 \nTechnology skills to use equipment safely including \nkeyboard skills. \n4. Method of \nassessment \nThe assessor may select two of the following assessment \nmethods to objectively assess the candidate: \n4.1 \nDirect Observation and Oral Questioning \n4.2 \nPractical demonstration \n5. Resource \nimplication \n5.1 \nComputer hardware with peripherals \n5.2 \nAppropriate software \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment.\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n31\nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY \n: DEVELOP AND CONCEPTUALIZE ART STYLE \n \nUNIT CODE \n: ICT313344 \n \nUNIT DESCRIPTOR \n: This unit defines the knowledge, skills and attitude \nrequired to prepare and develop initial art based \non game design document. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Develop look-and-\nfeel \n \n \n1.1 \nConcept Studies are drawn and compiled based on \nGDD \n1.2 \nReferences are gathered in line with the game key \nconcept \n1.3 \nStyle guide is defined and explained in line with \nkey concept and target platform \n2. Draw and compile \ncharacters \n2.1 \nGame characters are identified based on GDD \n2.2 \nCharacters are drawn based on the style guide and \nasset list \n2.3 \nCharacter attributes are explained following \nenterprise procedures \n3. Draw the game \nworld \n3.1 \nSpecific environments or level background are \nidentified based on GDD \n3.2 \nEnvironments or level backgrounds are drawn \nbased on Style Guide \n3.3 \nIn-game worlds/backgrounds are explained \nfollowing enterprise procedures \n4. Draw and compile \nother assets \n4.1 \nResource asset list is prepared in line with GDD \n4.2 \nResources are drawn based on style guide and \nasset list \n4.3 \nAssets behavior and functions are described \nfollowing enterprise procedures \n5. Develop graphical \nuser interface \n5.1 \nGraphical User Interface (GUI) elements are \nidentified based on GDD \n5.2 \nGUI is drawn based on Style Guide\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n32\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. References \nMay include but not limited: \n1.1. \nSample themes \n1.2. \nPrevious designs \n1.3. \nTextures and patters \n2. Style guide \nStyle may include: \n2.1. \nGame art style \n2.2. \nGame engine specification \n2.3. \nGame metrics \n3. Game characters \nMay include but not limited: \n3.1. \nMain character \n3.2. \nSupporting characters \n3.3. \nNon-playable characters \n4. Character \nattributes \nMay include but not limited: \n4.1. \nPersonality \n4.2. \nBackground information \n4.3. \nPhysical attributes \n5. Resources \nMay include but not limited: \n5.1. \nEquipment \n5.2. \nItems/Objects \n6. Graphical User \nInterface (GUI) \nelements \nMay include but not limited: \n6.1 \nUser Interface (UI) icons/controls \n6.2 \nUI backgrounds\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n33\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDeveloped look-&-feel \n1.2 \nDrawn and compiled characters \n1.3 \nDrawn the game world \n1.4 \nDrawn and compiled other assets \n1.5 \nDeveloped game interface \n2. Required \nKnowledge and \nAttitudes \n2.1 \nTime management \n2.2 \nUnderstanding the subject matter \n2.3 \nUnderstanding the expectation \n2.4 \nOrganizing your thoughts \n2.5 \nStudying together \n2.6 \nPerspective \n2.7 \nComposition/Layout \n2.8 \nIP knowledge \n2.9 \nBasic Anatomy \n2.10 Art Style/Genre \n2.11 5S and 3Rs \n \n3. Required Skills \n3.1 \nDrawing skills & techniques \n3.2 \nCreating a project timetable \n3.3 \nUnderstanding key terminology \n3.4 \nDraft a mind map \n3.5 \nResearch skills \n3.6 \nOrganization skills \n3.7 \nDiscussion skills \n3.8 \nCommunication skills \n3.9 \nCreative skills \n3.10 Adherence to instructions \n3.11 Preparing Style Guide documentation \n3.12 Interpreting Style Guide specifications and user \nrequirements\n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nPC with drawing application with peripherals \n4.2 \nMouse \n4.3 \nPencil \n4.4 \nPaper \n4.5 \nPen \n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 \nDemonstration / Practical exam \n5.2 \nPresentation with questioning \n5.3 \nPortfolio of work samples \n5.4 \nGroup interview \n5.5 \nIndividual interview \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment.\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n34\n \nUNIT OF COMPETENCY \n: \nCREATE STORYBOARD AND ASSET LIST \n \nUNIT CODE \n: \nICT313345 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and \nattitudes required to create storyboard and asset \nlist based on the identified key references and \nstoryline. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Develop storyboard \n panels \n1.1 \nStoryline is identified based on GDD \n1.2 \nKey references are identified based on GDD \n1.3 \nCreate Thumbnails/Roughs based on Storyline. \n1.4 \nCreate Asset list based on GDD \n2. Create narrative \n devices \n2.1 \nNarrative elements are prepared based on GDD \n2.2 \nStoryline elements are documented based on \nstoryboard and given script \n2.3 \nItems are improved and added to the previously \ncreated asset list based on GDD \n3. Create cut scenes \n3.1 \nCut scenes are identified based on storyboard and \nscript \n3.2 \nIndividual storyboards are drawn using proxies for each \ncut scene based on the style guide \n3.3 \nAsset list is finalized based on GDD\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n35\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. Key references \nMay include but are not limited: \n1.1 Scenes \n1.2 Duration \n1.3 Characters \n1.4 Backgrounds \n1.5 Props \n1.6 Special Effects \n1.7 Angles \n2. Narrative elements \nMay include but are not limited: \n2.1 Story outline \n2.2 Scenario matrix \n2.3 Dialogues \n3. Storyline \nMay include but are not limited: \n3.1 Scenes \n3.2 Characters \n3.3 Backgrounds \n3.4 Props \n3.5 Special Effects \n3.6 Angles/Shots \n3.7 Triggers/Flag\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n36\nEVIDENCE GUIDE \n \n1. Critical aspects of \n competency \nAssessment requires evidence that the candidate: \n1.1 \nDeveloped storyboard panels \n1.2 \nCreated narrative devices \n1.3 \nCreated cut-scenes \n2. Required \nKnowledge and \nAttitudes \n2.1 \nCreating narrative devices \n2.2 \nIP knowledge \n2.3 \nPerspective \n2.4 \nComposition/Layout \n2.5 \nDynamic Anatomy \n2.6 \n5S and 3Rs \n3. Required Skills \n3.1 \nDrawing Skills \n3.2 \nResearch Skills \n3.3 \nOrganization Skills \n3.4 \nCommunication Skills \n3.5 \nCreative Skills \n3.6 \nStory Telling Skills \n3.7 \nCombine previous skills and knowledge \n3.8 \nAdherence to instructions \n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nMock theme, model sheets, and script \n4.2 \nPen and paper \n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 \nDemonstration / Practical exam \n5.2 \nPresentation with questioning \n5.3 \nPortfolio of work samples \n5.4 \nGroup interview \n5.5 \nIndividual interview \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n37\nUNIT OF COMPETENCY : \nPREPARE ART DOCUMENT \n \nUNIT CODE \n: \nICT313346 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to develop concept art for character, \nprops/objects and background layout constructs. It \nalso involves concepts for special effects. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Prepare concept for \ncharacters \n1.1. Character model sheets are made with \nconstructs in line with GDD \n1.2. Functionality and detail of character construct are \nnoted in line with enterprise procedures. \n1.3. Object priority is assigned based on character \nmodel sheets \n2. Prepare concept art for \nprops/objects \n2.1. Prop/Object model sheets are made with \nconstructs in line with GDD \n2.2. Functionality and detail of object constructs are \nnoted in line with enterprise procedures \n2.3. Object priority is assigned based on prop/object \nmodel sheets \n3. Prepare concept art for \nbackground layout \n3.1. Background model sheets are made with \nconstructs in line with GDD \n3.2. Functionality and detail of object constructs are \nnoted in line with enterprise procedures. \n4. Prepare concepts for \nspecial effects \n4.1. Type of effect is established in line with storyboard \nand script \n4.2. Special effects studies are created based on the \nestablished type of effect \n4.3. Reference frames are drawn based on approved \nspecial effects studies \n4.4. Mock color is added to the effects based on given \nspecial effects studies \n4.5. Object priority is assigned based on given \nspecial effects studies \n5. Prepare concept arts \nfor GUI \n5.1. Prop/Object model sheets are made with \nconstructs in line with GDD \n5.2. Functionality and detail of object constructs are \nnoted in line with enterprise procedures \n5.3. Object priority is assigned based on prop/object \nmodel sheets\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n38\nRANGE OF VARIABLES \n \nVARIABLE \n \n \nRANGE \n \n1. Constructs \nMay include but are not limited: \nCharacters: \n1.1 \nExpressions \n1.2 \nTurnaround \n1.3 \nPoses \n1.4 \nCharacter physical attributes \n1.5 \nClothing and accessories \n1.6 \nMock colors \n \nProps/objects \n1.7 \nTurnaround \n1.8 \nPerspective \n1.9 \nFunctionality \n1.10 Size comparison \n1.11 Mock color \n1.12 References \n \nBackground layout \n1.13 Form \n1.14 Perspective \n1.15 Scale of objects within the background \n1.16 Layout of the map and functionality of the elements \nin the map such as doors, traps, stairs, trees, etc \n1.17 Setting (morning, dusk, etc.) - add to definition of \nterms \n1.18 Mock color and texture of each element in the \nbackground and the background itself \n1.19 Visual appeal \n2. Object Priority \nMay include but are not limited: \n2.1 \nAssign responsibility \n2.2 \nAssign relationship \n2.3 \nAssign limitations \n2.4 \nAssign layer\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n39\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared concept art for characters \n1.2 Prepared concept art for props/objects \n1.3 Prepared concept art for background layout \n1.4 Prepared concepts for special effects \n1.5\nPrepared concepts for GUI\n2. Required Knowledge \nand Attitudes \n2.1 \nKnowledge of Constructs \n2.2 \nCharacters \n2.3 \nObjects \n2.4 \nBackgrounds & Layouts \n2.5 \nSpecial Effects \n2.6 \nResearching using library and printed literature \n2.7 \nCoping with stress \n2.8 \nProblem solving \n2.9 \nProject management \n2.10 \nObservation \n2.11 \nEstimation (for scaling/perspective/volume) \n2.12 \nColor coordination \n2.13 \nBasic animation \n2.14 \nComposition and Layout \n2.15\n5S and 3Rs\n3. Required Skills \n3.1 \nDrawing Skills \n3.2 \nConceptualize \n3.3 \nConduct a simple research \n3.4 \nSetting realistic goals \n3.5 \nDraft a mind map \n3.6 \nActive listening \n3.7 \nDecision making exercise \n3.8 \nDiscussion \n3.9 \nImplement execution plan \n3.10 \nResearch Skills \n3.11 \nOrganization Skills \n3.12 \nBasic problem solving Skills \n3.13\nAdherence to instructions\n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nPC with drawing application with peripherals \n4.2 \nMouse \n4.3 \nPencil \n4.4 \nPaper \n4.5\nPen\n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 \nDemonstration / Practical exam \n5.2 \nPresentation with questioning \n5.3 \nPortfolio of work samples \n5.4 \nGroup interview \n5.5\nIndividual interview\n6. Context of \nAssessment\n6.1 Competency may be assessed in workplace or \nsimulated environment\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n40\nUNIT OF COMPETENCY : \nDEVELOP FINAL ARTWORK USING GRAPHIC \nAPPLICATION \n \nUNIT CODE \n: \nICT313347 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to develop the final artwork and its details \nbased on approved modifications using graphic \napplication. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Create the line-\nwork \n1.1. \nOriginal concept art is redrawn according to style \nguide \n1.2. \nFinal details are added based on approved \nmodifications \n2. Apply color to \nartwork \n2.1. \nBase colors are applied in each layer based on \ncorresponding style guide and concept art \n2.2. \nShades and effects in layers are applied based on \ncorresponding style guide and concept art \n3. Prepare final \npalette/color map \nsheet \n3.1. \nAll colors used in the colored art work are indexed and \ntagged with RGB code \n3.2. \nColor map is prepared based on the index and tags \n3.3. \nColor map sheet is supplemented to the final artwork \n4. Break graphics \ninto assets/create \nobject library \n4.1. \nGraphics are split into separate asset/layers in line \nwith job requirements \n4.2. \nAssets are exported according to game engine \nrequirements\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n41\nRANGE OF VARIABLES \n \nVARIABLE \n \n \nRANGE \n \n1. Style guide \nMay include but not limited: \n1.1. \nGame art style \n1.2. \nGame engine specification \n1.3. \nGame metrics \n2. Game engine \nrequirements \nMay include but not limited: \n2.1 \nFormat \n2.2 \nResolution \n2.3 \nGame limitations\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n42\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nCreated the line-work \n1.2 \nApplied color to artwork \n1.3 \nPrepared final palette/color map sheet \n1.4\nBroke graphics into assets/Created object library\n2. Required \nKnowledge and \nAttitudes \n2.1 \nIP knowledge \n2.2 \nGraphic application knowledge \n2.3 \nPalette/Color Map knowledge \n2.4 \nObject Library knowledge \n2.5 \nCoping with stress \n2.6 \nProblem solving \n2.7 \nProject management \n2.8 \nOrganizing your thoughts \n2.9 \nColor perception \n2.10 \nColor Intuition \n2.11 \nLighting knowledge \n2.12 \nGraphic Composition knowledge (Vector/Raster) \n2.13 \nConcept of layered graphics \n2.14 \nKnowledge of File Types & Formats \n2.15\n5S and 3Rs\n3. Required Skills \n3.1 \nDrawing Skills \n3.2 \nImplement execution plan \n3.3 \nSetting realistic goals \n3.4 \nDraft a mind map \n3.5 \nDecision making exercise \n3.6 \nColoring \n3.7 \nApplying Various Graphical Composition (Vector/Raster)\n3.8 \nResearch Skills \n3.9 \nOrganization Skills \n3.10 \nApplication manipulation \n3.11 \nGraphic application manipulation \n3.12 \nAdherence to instructions \n3.13\nEye for Detail\n4. Resource \nImplications \nThe following resources must be provided \n4.1 \nPC with animation application with peripherals \n4.2 \nMouse \n4.3\nElectronic pen and tablet\n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 \nDemonstration / Practical exam \n5.2 \nPresentation with questioning \n5.3 \nPortfolio of work samples \n5.4 \nGroup interview \n5.5\nIndividual interview\n6. Context of \nAssessment \n6.1 \nCompetency may be assessed in workplace or \nsimulated environment\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n43\n \nUNIT OF COMPETENCY : \nAPPLY IN-GAME ANIMATION \n \nUNIT CODE : \nICT313348 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to identify, manage, arrange assets into key-\nframes and render the required file format. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of Variables\n1. Import assets \n1.1. \nAssets to be imported are identified according to \nscene requirements \n1.2. \nAssets are managed according to client’s instructions \nand requirements \n2. Apply assets to \nkey-frame \n2.1. \nScene length and animation speed is determined \naccording to provided Reference Materials \n2.2. \nScene shots are staged according to storyboard and \nlayout sheet \n2.3. \nAssets and object priorities that will be used and \nassigned in the scene are determined based on the \nReference Materials. \n2.4. \nAssets are placed and arranged in key-frames based \non the action required for the scene \n3. Preview animation \n3.1. \nKey drawings with tweens of each required asset in \nthe scene is rendered & viewed to check speed and \nmovement \n3.2. \nKey drawings are revised and re-plotted for \nsmoothness of movements \n3.3. \nSound is applied and synchronized to models based \non given animation \n4. Render required \nfile format \n4.1. \nExported files are checked and tested in line with style \nguide, story board and GDD requirements. \n4.2. \nAll approved exported files noted and moved \naccordingly to the resource folder based on the style \nguide\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n44\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. Assets \nMay include but not limited: \n1.1. \nModels \n1.2. \nDialogue \n1.3. \nSound effects \n2. Reference \nMaterials \nMay include but not limited: \n2.1. \nCut Scenes \n2.2. \nModel Sheets \n2.3. \nStyle Guide \n2.4. \nStory Board \n2.5. \nGame Engine\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n45\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Imported assets \n1.2 Applied assets to key-frame \n1.3 Previewed animation \n1.4 Rendered required file format \n2. Required \nKnowledge and \nAttitudes \n2.1 Graphic manipulation \n2.2 Graphic Composition (Vector/Raster) \n2.3 Problem solving \n2.4 Project management \n2.5 Observation \n2.6 Deductive reasoning \n2.7 Human, animal, objects and background drawing \nprinciples \n2.8 Perspective, proportion, volume, camera fielding, timing \ntechnicalities \n2.9 Acting, observation of movements and deductive \nreasoning \n2.10 Basic animation principles \n2.11 Graphic application \n2.12 Animation application \n2.13 Phonetics knowledge \n2.14 Creative/Drawing and composition \n2.15 Storyboard and layout \n2.16 5S and 3Rs \n3. Required Skills \n3.1 Drawing skills \n3.2 Applying Various Graphical Composition \n(Vector/Raster) \n3.3 Decision making exercise \n3.4 Implement execution plan \n3.5 Organizational skills \n3.6 Analytical Skills \n3.7 Able to read and interpret storyboard and layout \n3.8 Timing, space, weight analysis skills to animate actions \neffectively \n3.9 Graphic application manipulation \n3.10 Animation application manipulation \n3.11 Communication Skills \n3.12 Composition of elements and staging skills/eye for \ndetails \n3.13 Adherence to instructions \n3.14 Research\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n46\n \n4. Resource \nImplications \nThe following resources must be provided \n4.1 PC with drawing application with peripherals \n4.2 Mouse \n4.3 Electronic pen and tablet \n5. Methods of \nAssessment \nCompetency may be assessed through \n5.1 Demonstration / Practical exam \n5.2 Presentation with questioning \n5.3 Portfolio of work samples \n5.4 Group interview \n5.5 Individual interview \n6. Context of \nAssessment \n6.1 Competency may be assessed in workplace or \nsimulated environment\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________ \nTR - 2D GAME ART NC III \n \n \n47"
