  "source_section_text": "Section 1\n2D GAME ART DEVELOPMENT NC III QUALIFICATIONS\n\nThe 2D GAME ART DEVELOPMENT NC III Qualification consists of\ncompetencies that are required for digital 2D art for video games.\n\nThe units of competency comprising this qualification include the following:\n\nCODE\nUNITS OF COMPETENCY\n\nBASIC COMPETENCIES\n5 00 311 1 09\nLead workplace communication\n5 00 311 1 10\nLead small teams\n5 00 311 1 11\nDevelop and practice negotiation skills\n5 00 311 1 12\nSolve problems related to work activities\n5 00 311 1 13\nUse mathematical concepts and techniques\n5 00 311 1 14\nUse relevant technologies\nCOMMON COMPETENCIES\n\n ICT315203 Apply critical thinking and thought organization\n ICT315202 Apply quality standards\n ICT311203 Perform computer operations\n\nCORE COMPETENCIES\nICT313344\nDevelop and conceptualize art style\nICT313345\nCreate storyboard and asset list\nICT313346\nPrepare art document\nICT313347\nDevelop final artwork using graphic application\nICT313348\nApply in-game animation\n\n\nA person who has achieved this Qualification is competent to be:\n\n•\n2D Game artist\n•\n2D Game concept artist\n•\n2D Game animator\n\n--- PDF PAGE 4 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n2"
