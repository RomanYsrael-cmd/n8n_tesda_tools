    {
      "term": "61",
      "definition": "development. Features usually include but not limited to: single input compile, execute, and debug; convenient source code display; library links for programming language reference. 37. Key-frame - is a single still image in an animated sequence that occurs at an important point in that sequence; key frames are defined throughout an animated sequence, in order to define pivotal points of motion before the frames in between are drawn or otherwise created to \"tween\" the motion between the two key frames. 38. Line-Work - A finalized art work that is normally not colored but has been cleaned and has been readied for final rendering. 39. Local Area Network (LAN) - a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites. 40. Microsoft DirectX - is a collection of application programming interfaces (APIs) for handling tasks related to multimedia, especially game programming and video, on Microsoft platforms. 41. Object code - Output files resulting from compiling the source code. These files contain the machine instructions used upon program execution. 42. Object Library - a consolidated collection of assets developed through the timeline that will be used for production. 43. Object Priority - a component in game development that focuses on the various developed objects and assets to be given an assigned responsibility for the game engine and other development tools within your develop environment. 44. Outsourcing - is when a major business process is contracted with another company. 45. Production - is the main stage of development, when assets and source code for the game are assembled and tested. 46. Programmer - write codes or instructions to make the computer do specific tasks. These instructions are called programs. 47. Prototype - an experimental model that illustrates the typical qualities of the person, animal, object or any element from which it is based on. 48. Prototyping - the method of experimenting on the model that illustrates the typical qualities of the person, animal, object or any element from which it is based on. 49. Quality Assurance - is an implemented process that ensures that a product or service meets a set of documented standards. This process guarantees that the product is free from errors, bugs, and other forms of glitches. 50. Raster - a raster graphics image, or bitmap, is a data structure representing a generally rectangular grid of pixels, or points of color. These images are stored in image files with various formats. 51. References - is an item from which a work is based on. This may include: an existing artwork, a reproduction (i.e., photo), a directly observed object (i.e., person), a documented description, or the artist's memory. 52. Resource Asset List - a registry of resources that is being kept and completed."
