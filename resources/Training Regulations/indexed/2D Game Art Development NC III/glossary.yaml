    {
      "term": "62",
      "definition": "53. Roughs/Thumbnails - A non-formal form of expressing ideas to simple easy to understand sketches for planning the main artwork or scene. 54. Simulation - the process of imitating a real phenomenon. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, even biological processes. 55. Software - computer programs and procedures concerned with the operation of an information system 56. Sound Designer -an individual that manipulates the composition of the songs, effects, voice and music that will be used in each event. 57. Source code -a text or set system instruction used in a programming language. 58. Standards -A criteria to which results are set upon. 59. Story Board - are graphic organizers in the form of illustrations or images displayed in sequence for the purpose of pre-visualizing a motion picture, animation, motion graphic or interactive media sequence. 60. Script - a text that contains organized flow of scenes captioned from a root story that is expressed as interaction of characters, object movement and dialogue. 61. Style Guide - is a set of written design documents, which contain gathered references and key concepts used for a specific publication, organization, metrics, style, approach or field. The implementation of a style guide provides uniformity in style and formatting of a document for compiling concepts for a game. 62. System - an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 63. Vector - is a line or a movement defined by end-points or, essentially, the distance between point A and point B. Vectors can be used to calculate animated motion mathematically instead of through the use of manual key frames. 64. Video Game - is a game that involves interaction with an electronic user interface to generate visual feedback on a video device. 65. User-friendly - also known as “Usability” is the ease of use and learn-ability of a human-made object. The object of use can be an application, website, book, tool, machine, process, or anything a human interacts with. A usability study may be conducted as a primary job function by a usability analyst or as a secondary job function by designers, technical writers, marketing personnel, and others."
