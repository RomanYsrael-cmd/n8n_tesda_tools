      "term": "1. Art Style - Drawn or implied characteristics and elements combined then",
      "definition": "expressed in a particular (often unique) and consistent manner. 2. Art Document - A written instrument that can be used to furnish visual instruction and definitive information in order to achieve a certain trend and standard. 3. Animation - is the rapid display of a sequence of images of 2-D or 3-D artwork or model positions in order to create an illusion of movement. The effect is an optical illusion of motion due to the phenomenon of persistence of vision, and can be created and demonstrated in several ways. 4. Asset List - A series of created resources categorized into an organized medium for reference . 5. Background - the part of a scene or view furthest from the point of interest thus giving further impression on the subject. 6. Browser - an application package that provides the user interface for accessing Internet, intranet and extranet Web sites."
