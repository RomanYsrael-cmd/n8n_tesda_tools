    {
      "term": "60",
      "definition": "23. Flash - can manipulate vector and raster graphics and supports bi-directional streaming of audio and video. It contains a scripting language called Action- Script. It is available in most common web browsers and some mobile phones and other electronic devices. Several software products, systems, and devices are able to create or display Flash, including the Adobe Flash Player. The Adobe Flash Professional multimedia authoring program is used to create content for the Adobe Engagement Platform, such as web applications, games and movies, and content for mobile phones and other embedded devices. 24. Flag - refer to one or more bits that are used to store a binary value or code that has an assigned meaning, but can refer to uses of other data types. 25. Game - any medium of entertainment that involves manipulating a device in response to an interface that views a hypothetical visual world created by a combination of assets. 26. Game Artist (2D/3D) - an artist who creates art for one or more types of games. Game artists are responsible for all of the aspects of game development that call for visual art. 27. Game Designer - an individual who provides a direction to the visual and technical aspect of the game. Making sure the development from start to finish is according to the theme and manner of approach that matches the genre of the game. 28. Game Design Document (GDD) - a body of writing that can be used to furnish decisive instructional and definitive information covering the overall technicalities and range of a game in order to mold and achieve a certain standard. 29. Game Programmer - a software developer who uses programming languages and tools to implement game mechanics and parameters ranging from simple input responses, object physics, and artificial intelligence. 30. Graphic Composition - is when the use of digital graphic formats, styles, renders, modes, and outputs are selected and put together for a dedicated output for various digital media. Such as Raster Graphics and Vector Graphics. 31. Graphical User Interface (GUI) - is a type of user interface that allows the users to interact with electronic devices through images rather than text commands. 32. Graphic Application - any software or collection of programs that enable a person to manipulate visual images on a device or media. 33. In-Game Animation - any representation of action, may it be minor (limited loop sequenced) or major (cinematic) as long as it is integrated within the proper game flow. 34. Information - data placed in a meaningful and useful context for an end user. 35. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 36. Integrated Development Environment (IDE) - a software that provides comprehensive features and user interface for more efficient software"
