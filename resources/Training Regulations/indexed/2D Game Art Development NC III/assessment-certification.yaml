      "number": "26",
      "text": "Game Artist (2D/3D) - an artist who creates art for one or more types of games. Game artists are responsible for all of the aspects of game development that call for visual art."
    },
    {
      "number": "27",
      "text": "Game Designer - an individual who provides a direction to the visual and technical aspect of the game. Making sure the development from start to finish is according to the theme and manner of approach that matches the genre of the game."
    },
    {
      "number": "28",
      "text": "Game Design Document (GDD) - a body of writing that can be used to furnish decisive instructional and definitive information covering the overall technicalities and range of a game in order to mold and achieve a certain standard."
    },
    {
      "number": "29",
      "text": "Game Programmer - a software developer who uses programming languages and tools to implement game mechanics and parameters ranging from simple input responses, object physics, and artificial intelligence."
    },
    {
      "number": "30",
      "text": "Graphic Composition - is when the use of digital graphic formats, styles, renders, modes, and outputs are selected and put together for a dedicated output for various digital media. Such as Raster Graphics and Vector Graphics."
    },
    {
      "number": "31",
      "text": "Graphical User Interface (GUI) - is a type of user interface that allows the users to interact with electronic devices through images rather than text commands."
    },
