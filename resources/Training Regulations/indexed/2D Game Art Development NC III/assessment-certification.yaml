      "number": "4",
      "text": "1 To attain the Qualification in 2D Game Art Development NC III, the candidate must demonstrate competence as described in sub-section"
    },
    {
      "number": "4.2",
      "text": "1 of this Training Regulations. Successful candidates shall be awarded a National Certificate signed by the TESDA Director-General."
    },
    {
      "number": "4",
      "text": "2 The Qualification for the 2D Game Art Development NC III may be attained through:"
    },
    {
      "number": "4.2",
      "text": "1 Accumulation of Certificates of Competency (COC) in all the following units of competency:"
    },
    {
      "number": "4.2",
      "text": "1.1 Develop initial art assets • Develop and conceptualize art style • Create storyboard and asset list • Prepare art document"
    },
    {
      "number": "4.2",
      "text": "1.2 Develop final artwork using graphic application"
    },
    {
      "number": "4.2",
      "text": "1.3 Apply in-game animation"
    },
    {
      "number": "4",
      "text": "3 Upon accumulation and submission of all COCs acquired for all the relevant units of competency comprising this qualification, an individual shall be issued the corresponding National Certificate (NC)."
    },
    {
      "number": "4",
      "text": "4 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4",
      "text": "5 The following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.5",
      "text": "1. Graduates of formal, non-formal and informal including enterprise-based training programs."
    },
    {
      "number": "4.5",
      "text": "2. Experienced workers (wage-employed or self-employed)"
    },
    {
      "number": "4",
      "text": "6 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)\". --- PDF PAGE 58 --- _____________________________________________________________________________ TR - 2D GAME ART NC III 56 ANNEX A. ICT COMPETENCY MAP 2D GAME ART DEVELOPMENT NC III Receive And Respond To Workplace Communication Work With Others Demonstrate Work Values Practice Basic Housekeeping Procedures Participate In Workplace Communication Work In A Team Environment Practice Career Professionalism Practice Occupational Health And Safety Procedures Lead Workplace Communication Lead Small Team Develop And Practice Negotiation Skills Solve Problems Related To Work Activities Use Mathematical Concepts And Techniques Use Relevant Technologies Utilize Specialist Communication Skills Develop Team And Individuals Apply Problem Solving Techniques In The Workplace Collect, Analyze And Organize Information Plan And Organize Work Promote Environmental Protection Apply Critical Thinking And Thought Organization Apply Quality Standards Perform Computer Operations Communicate Effectively In A Customer Contact Center Render Quality Customer Service Utilize Enterprise/ Company Technology Conduct Contact Center Campaign Provide Specialized Support And Assistance To Customers Lead A Contact Center Work Team Manage The Activities Of A Contact Center Work Team Use Business Technology Use Medical Technology To Carry Out Task Produce Text From Audio Transcription Review/Edit Documents Produce Key Drawings For Animation Produce Cleaned-Up And In-Betweened Drawings Create 2D Digital Animation Use An Authoring Tool To Create An Interactive Sequence Use 2D Digital Animation Software Build Library Of Objects Build Scenes And Assets Produce 2D Digital Animation Movies & Animated Movie Clips Create 3D Digital Animation Coordinate T