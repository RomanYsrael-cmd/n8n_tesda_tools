      "number": "32",
      "text": "Graphic Application - any software or collection of programs that enable a person to manipulate visual images on a device or media."
    },
    {
      "number": "33",
      "text": "In-Game Animation - any representation of action, may it be minor (limited loop sequenced) or major (cinematic) as long as it is integrated within the proper game flow."
    },
