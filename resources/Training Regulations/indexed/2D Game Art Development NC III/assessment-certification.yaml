      "text": "Compiler - is a program that translates (compiles) source code(s) written in a high-level language into a set of machine-language instructions that can be understood and executed by a digital computer's Central Processing Unit (CPU). This can also directly pertain to the process of compressing text, images, and other data into one specific file format."
    },
    {
      "number": "10",
      "text": "Computer - a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results."
    },
    {
      "number": "11",
      "text": "Computer Terminal - any input/output device connected by telecommunications links to a computer."
    },
    {
      "number": "12",
      "text": "Construct - Refers to any specific characteristic, trait, detail or reference used by an artist in the visual development of a single whole game object or each of its combining/building parts, which will be found in the model sheet and/or the game environment. Objects in the game environment may refer to a character, props, background, or any other object in game development. Example, character construct, facial construct, weapon construct, etc."
    },
    {
      "number": "13",
      "text": "Concept - Something formed in the mind; a thought or notion."
    },
    {
      "number": "14",
      "text": "Concept Art - is a form of illustration where the main goal is to convey a visual representation of a design, idea, and/or mood for use in films, video games, animation, or comic books before it is put into the final product. Concept art is also referred to as visual development and/or concept design. This term can also be applied to retail design, set design, fashion design and architectural design."
    },
    {
      "number": "15",
      "text": "Critical Thinking - is the process of thinking that questions assumptions. It is a way of deciding whether a claim is true, false; sometimes true, or partly true."
    },
    {
      "number": "16",
      "text": "Cut Scenes - A cut-scene (sometimes in-game cinematic or in-game movie) is a sequence in a video game over which the player has no or only limited control, breaking up the gameplay and used to advance the plot, strengthen the main character's development, introduces enemy characters, and provide background information, atmosphere, dialogue, and clues. Cut-scenes often feature on the fly rendering, using the gameplay graphics to create scripted events. Cut-scenes can also be animated, live action, or pre-rendered computer graphics streamed from a video file."
    },
    {
      "number": "17",
