    {
      "number": "23",
      "text": "Flash - can manipulate vector and raster graphics and supports bi-directional streaming of audio and video. It contains a scripting language called Action- Script. It is available in most common web browsers and some mobile phones and other electronic devices. Several software products, systems, and devices are able to create or display Flash, including the Adobe Flash Player. The Adobe Flash Professional multimedia authoring program is used to create content for the Adobe Engagement Platform, such as web applications, games and movies, and content for mobile phones and other embedded devices."
    },
    {
      "number": "24",
      "text": "Flag - refer to one or more bits that are used to store a binary value or code that has an assigned meaning, but can refer to uses of other data types."
