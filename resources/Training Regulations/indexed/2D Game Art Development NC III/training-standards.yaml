  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: 2D Game Art Development\n NC Level: NC III\n\nNominal Training Duration:\n 64 hrs.\n- Basic Competencies\n 70 hrs.\n- Common Competencies\n 800 hrs.\n- Core Competencies\n 200 hrs. - OJT (in a game studio or a company\nallocating resources for game\ndevelopment related projects)\n -------------\n 1,134 hrs.\n\nCourse Description:\n\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\n2D Game Artist in accordance with industry standards. It covers the basic & common\ncompetencies in addition to the core competencies such as preparing art document,\ncreating storyboard and asset list, developing concept art, developing final artwork\nusing graphic application and applying in-game animation. The nominal duration of\n934 hours covers the required units at 2D Game Art Development NC III and an\nadditional 200 hours on-the-job (OJT) training. TVET providers can however, offer\na longer, ladderized course covering the NC III basic, common, core and elective\nunits.\n\nBASIC COMPETENCIES\n64 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n48\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance\nrelevant technology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n49\nCOMMON COMPETENCIES\n70 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply critical\nthinking and\nthought\norganization\n1.1. Identify the theoretical\nfoundations of critical\nthinking\n1.2. Develop constructive\narguments\n1.3. Apply methods of\nreasoning\n1.4. Affirm generalization\n1.5. Arrive at a conclusion\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party report\n2. Apply Quality\nStandards\n2.1. Asses quality of received\nmaterials\n2.2. Assess own work\n2.3. Engage in quality\nimprovement\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party report\n3. Perform\ncomputer\noperations\n3.1. Plan and prepare for task\nto be taken undertaken\n3.2. Input data into computer\n3.3. Access information using\ncomputer\n3.4. Produce output/ data\nusing computer system\n3.5. Use basic functions of a\nwww-browser to locate\ninformation\n3.6. Maintain computer\nequipment and systems\n Modular\n Film showing\n Computer\nbased training\n(e-learning)\n Project\nmethod\n On the job\ntraining\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party report\n Assessment of\noutput product\n Portfolio\n Computer based\nassessment\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n50\nCORE COMPETENCIES\n800 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nconceptualize\nart style\n\n\n96 hours\n\n1.1. Develop look-and-feel\n1.2. Draw and compile\ncharacters\n1.3. Draw the game world\n1.4. Draw and compile other\nassets\n1.5. Develop graphical user\ninterface\n• Lecture /\nDiscussion\n• Workshop\n• Demonstration\n\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n2. Create\nstoryboard\nand asset list\n\n\n184 hours\n2.1. Develop storyboard panels\n2.2. Create narrative devices\n2.3. Create cut scenes\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n\n3. Prepare art\ndocument\n\n\n\n\n112 hours\n3.1. Prepare concept art for\ncharacters\n3.2. Prepare concept art for\nprops/objects\n3.3. Prepare concept art for\nbackground layout\n3.4. Prepare concept art for\nspecial effects\n3.5. Prepare concept art for GUI\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n4. Develop final\nartwork using\ngraphic\napplication\n\n\n184 hours\n4.1. Create the line-work\n4.2. Apply color to artwork\n4.3. Prepare final palette/color\nmap sheet\n4.4. Break graphics into\nassets/create object library\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n\n\n\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n\n5. Apply in-game\nanimation\n\n\n\n\n184 hours\n5.1. Import assets\n5.2. Apply assets to key-frame\n5.3. Preview animation\n5.4. Render required file format\n\n• Lecture/\nDiscussion\n• Workshop\n• Exercises\n• Demonstration\n\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n51\n3.2 TRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n• Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in - school and in-industry training\nor fieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ntrainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study, or\naudio, video or computer technologies.\n• Project-based instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects that\nhave real world applications.\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n52\n\n3.3\nTrainee Entry Requirements\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n• At least high school graduate or equivalent experience\n• With artistic and drawing skills which will be validated by :\no a talent entrance exam to be administered by the training\ninstitution using a tool devised by the Technical Experts Panel\n(TEP) and Participants of the National Validation of this Training\nRegulation\no the submission of a portfolio (hard & soft copy should be provided)\n• Good moral character\n• Mentally and emotionally able.\n• Has the capacity to communicate in both oral and written\n• Physically able to manipulate a mouse, track-ball, electronic pen, etc.\n• Must know how to operate a computer\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be\nrequired from the trainees by the school or training center delivering the TVET\nprogram.\n\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the conduct of\ntraining in 2D Game Art Development NC III:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n15\nElectronic pen and\ntablet\n15\nErgonomic computer tables\nand chairs\n15\nMock theme and\nscript\n15\nMouse\n2\nScanner\n15\nPen and paper\n15\nEraser\n1\nLCD Projector\n15\nLearning elements\n1\nInternet access/\nLAN connected\n1\nInk-jet Printer\n15\nPrintable\nstoryboard\n15\nlicenses\nper\napplicatio\nn\nComputer\nApplication\n e.g.\n- Flash\n- ToonBoom\n- After Effects\n- Adobe\nPhotoshop CS5+\n1\nLCD Monitor/TV, 42 inches\n15\nHand-outs\n15\nComputer (with peripherals)\nWindows PC or Mac\n- 19in. LCD monitor,\n- multi-core 2GHz CPU,\n- Direct X10, open GL\ncapable video card,\n- 4GB memory,\n- 500 GB hard disk\n15\nPractice materials\n15\nReference books\n15\nLearning materials/\nguide\n\n\n2\nWhite board and / or glass\nboard\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n53\nThe quantity of tools and equipment to be used for the conduct of training for\nthis qualification shall depend on the number of students, size of the class, and/or\nmodality of training. The most important consideration is to make sure that tools and\nequipment are adequately provided to all trainees when needed. The actual list of\ntools, equipment, machines, supplies and other materials to be used shall be\nidentified and detailed in the Competency Based Curriculum (CBC) to be submitted\nby the TVET provider when registering a course or training program with TESDA.\n\nDue to the fast-changing nature of the Information and Communications\nTechnology (ICT) sector, TVET providers are reminded to use and provide their\ntrainees with the latest technology tools, equipment and materials where appropriate\nand applicable.\n\nIn cases where there are specialized tools, equipment and facilities that are\nnot generally considered standard requirements or not absolute requisites for\ntraining, the industry working group or TESDA may provide guidelines or specific\nadvice on such matters.\n\n3.5 TRAINING FACILITIES\n\n\nBased on class size of 15 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nComputer Lab\n5x10\n50\n1\n60\nLearning Resource Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n2 x 5\n10\n2\n20\n Total\n80\nFacilities / Equipment /\nCirculation**\n\n\n\n30\nTotal Area\n110\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\nAppropriate consideration should be given in providing and allocating work\nspace, communications facilities, and the usual workplace amenities to ensure a\nproper learning environment. Where applicable, training shall be held or conducted\nin learning facilities in accordance with generally accepted industry standards and\npractice.\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n54\n\n3.6 TRAINERS QUALIFICATIONS\n\n\n•\nHolder of National TVET Trainer’s Certificate (NTTC) Level 1\n•\n* Must have at least 2-years relevant industry experience.\n•\nMust be physically & mentally fit.\n\n* Optional: Only when required by the hiring institution.\n\n\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA under\nthese training regulations are required to undergo mandatory national\ncompetency assessment upon completion of the program.\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n55"
