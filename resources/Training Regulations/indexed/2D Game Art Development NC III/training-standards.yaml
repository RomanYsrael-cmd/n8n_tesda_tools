    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: 2D Game Art Development\n NC Level: NC III\n\nNominal Training Duration:\n 64 hrs.\n- Basic Competencies\n 70 hrs.\n- Common Competencies\n 800 hrs.\n- Core Competencies\n 200 hrs. - OJT (in a game studio or a company\nallocating resources for game\ndevelopment related projects)\n -------------\n 1,134 hrs.\n\nCourse Description:\n\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\n2D Game Artist in accordance with industry standards. It covers the basic & common\ncompetencies in addition to the core competencies such as preparing art document,\ncreating storyboard and asset list, developing concept art, developing final artwork\nusing graphic application and applying in-game animation. The nominal duration of\n934 hours covers the required units at 2D Game Art Development NC III and an\nadditional 200 hours on-the-job (OJT) training. TVET providers can however, offer\na longer, ladderized course covering the NC III basic, common, core and elective\nunits.\n\nBASIC COMPETENCIES\n64 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n48\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance\nrelevant technology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n49\nCOMMON COMPETENCIES\n70 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply critical\nthinking and\nthought\norganization\n1.1. Identify the theoretical\nfoundations of critical\nthinking\n1.2. Develop constructive\narguments\n1.3. Apply methods of\nreasoning\n1.4. Affirm generalization\n1.5. Arrive at a conclusion\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party report\n2. Apply Quality\nStandards\n2.1. Asses quality of received\nmaterials\n2.2. Assess own work\n2.3. Engage in quality\nimprovement\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party report\n3. Perform\ncomputer\noperations\n3.1. Plan and prepare for task\nto be taken undertaken\n3.2. Input data into computer\n3.3. Access information using\ncomputer\n3.4. Produce output/ data\nusing computer system\n3.5. Use basic functions of a\nwww-browser to locate\ninformation\n3.6. Maintain computer\nequipment and systems\n Modular\n Film showing\n Computer\nbased training\n(e-learning)\n Project\nmethod\n On the job\ntraining\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party report\n Assessment of\noutput product\n Portfolio\n Computer based\nassessment\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n50\nCORE COMPETENCIES\n800 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nconceptualize\nart style\n\n\n96 hours\n\n1.1. Develop look-and-feel\n1.2. Draw and compile\ncharacters\n1.3. Draw the game world\n1.4. Draw and compile other\nassets\n1.5. Develop graphical user\ninterface\n• Lecture /\nDiscussion\n• Workshop\n• Demonstration\n\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n2. Create\nstoryboard\nand asset list\n\n\n184 hours\n2.1. Develop storyboard panels\n2.2. Create narrative devices\n2.3. Create cut scenes\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n\n3. Prepare art\ndocument\n\n\n\n\n112 hours\n3.1. Prepare concept art for\ncharacters\n3.2. Prepare concept art for\nprops/objects\n3.3. Prepare concept art for\nbackground layout\n3.4. Prepare concept art for\nspecial effects\n3.5. Prepare concept art for GUI\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n4. Develop final\nartwork using\ngraphic\napplication\n\n\n184 hours\n4.1. Create the line-work\n4.2. Apply color to artwork\n4.3. Prepare final palette/color\nmap sheet\n4.4. Break graphics into\nassets/create object library\n• Lecture/\nDiscussion\n• Workshop\n• Demonstration\n\n\n\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n\n5. Apply in-game\nanimation\n\n\n\n\n184 hours\n5.1. Import assets\n5.2. Apply assets to key-frame\n5.3. Preview animation\n5.4. Render required file format\n\n• Lecture/\nDiscussion\n• Workshop\n• Exercises\n• Demonstration\n\n• Demonstration /\nPractical exam\n• Presentation with\nquestioning\n• Portfolio of work\nsamples\n• Individual\ninterview\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________\nTR - 2D GAME ART NC III\n\n\n51"
