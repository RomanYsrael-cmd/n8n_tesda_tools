                "number": "4.2",
                "text": "Performance issues which cannot be rectified or addressed within the team are referenced to appropriate personnel according to employer policy",
                "source_number": "4.3"
              },
              {
                "number": "4.3",
                "text": "Team members are kept informed of any changes in the priority allocated to assignments or tasks which might impact on client/customer needs and satisfaction",
                "source_number": "4.4"
              },
              {
                "number": "4.4",
                "text": "Team operations are monitored to ensure that employer/client needs and requirements are met",
                "source_number": "4.5"
              },
              {
                "number": "4.5",
                "text": "Follow-up communication is provided on all issues affecting the team",
                "source_number": "4.6"
              },
              {
                "number": "4.6",
                "text": "All relevant documentation is completed in accordance with company procedures",
                "source_number": "4.7"
              }
