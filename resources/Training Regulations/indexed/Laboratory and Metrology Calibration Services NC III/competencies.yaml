        "source_text": "--- PDF PAGE 28 ---\nTR Laboratory and Metrology/Calibration Services NC III   Promulgated \n- 24 - \nUNIT OF COMPETENCY: \n PERFORM MENSURATION AND CALCULATION \n \nUNIT CODE:  \n \n \nALT311202 \n \nUNIT DESCRIPTOR: \nThis unit includes identifying, caring for, handling, using and \nmaintaining measuring instruments. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n \n1. Select  measuring   \n \n instruments \n \n1.1 Object or component to be measured is identified \n1.2 Correct specifications are obtained from relevant source \n1.3 Appropriate measuring instrument is selected according to job \nrequirements\n \n2. Carry out  \n     measurements  \n     and calculation \n \n \n2.1 Measuring tools are selected in line with job requirements \n2.2 Accurate measurements are obtained to job \n2.3 Calculation needed to complete work tasks are performed using \nthe four basic process of addition (+), subtraction (-), \nmultiplication (x) and division (/). \n2.4 Calculations involving fractions, percentages and mixed  \n       numbers are used to complete workplace tasks. \n2.5 Numerical computation is self-checked and corrected for  \n       accuracy \n2.6 Instruments are read to the limit of accuracy of the tool.\n      \n3. Maintain  \nmeasuring \ninstruments \n \n3.1 Measuring instruments are kept free from corrosion \n3.2 Measuring instruments are not dropped to avoid damage \n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 29 ---\nTR Laboratory and Metrology/Calibration Services NC III   Promulgated \n- 25 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Measuring \ninstruments \nMeasuring instruments includes: \n1.1 Multitester \n1.2 Micrometer (In-out, depth) \n1.3 Vernier caliper (Out, \ninside) \n1.4 Dial Gauge with Mag. Std. \n1.5 Straight Edge \n1.6 Thickness gauge\n \n1.7 Try square \n1.8 Protractor \n1.9  Height gauge \n1.10 Steel rule \n1.11 Shrink rule \n \n2. Calculation \n \nKinds of part mensuration include: \n2.1 Volume \n2.2 Area \n2.3 Displacement \n2.4 Inside diameter \n2.5 Circumference \n2.6 Length \n2.7 Thickness \n2.8 Outside diameter \n2.9 Taper \n2. 10 Out of roundness \n2.11 Shrinkage allowance\n\n--- PDF PAGE 30 ---\nTR Laboratory and Metrology/Calibration Services NC III   Promulgated \n- 26 - \n \n \nEVIDENCE GUIDE \n \n \n1. Critical aspect \nof competency \nAssessment requires evidence that the candidate: \n1.1 Selected measuring instruments \n1.2 Carried-out measurements and calculations. \n1.3 Maintained measuring instruments\n \n2. Underpinning \nknowledge and \nattitudes\n2.1 Types of Measuring instruments and its uses \n2.2 Safe handling procedures in using measuring instruments \n2.3 Four fundamental operation of mathematics \n2.4 Formula for Volume, Area, Perimeter and other geometric figures\n \n3. Underpinning     \n      skills \n3.1 Caring and Handling measuring instruments \n3.2 Calibrating and using measuring instruments \n3.3 Performing calculation by  Addition, Subtraction, Multiplication \nand Division \n3.4  Visualizing objects and shapes \n3.5  Interpreting formula for volume, area, perimeter and other \ngeometric figures\n \n4. Resource     \n      implications \nThe following resources MUST be provided: \n4.1 Workplace location \n4.2 Measuring instrument appropriate to servicing processes \n4.3 Instructional materials relevant to the propose activity \n \n5. Method of  \n    assessment \n \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Written or oral examination \n5.3 Interview \n5.4 Demonstration with questioning\n \n6. Context of  \n    assessment \n \n \n6.1 Competency elements must be assessed in a safe \n       working environment \n6.1 Assessment may be conducted in a workplace or  \n      simulated environment\n",
        "required_knowledge": null,
        "required_skills": null
      },
