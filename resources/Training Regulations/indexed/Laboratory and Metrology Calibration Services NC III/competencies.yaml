  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in LABORATORY AND METROLOGY/CALIBRATION SERVICES NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n\n:\n500311109\n\n UNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to lead in the dissemination and\n\ndiscussion of ideas, information and issues in the\n\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1 Appropriate communication method is selected\n1.2 Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when\nrequired\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided\nimmediately\n2.3 Constructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4 Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 7 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 3 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3 Face to face\n1.4 Two-way radio\n1.5 Speaking to groups\n1.6 Using telephone\n1.7 Written\n1.8 Internet\n\n--- PDF PAGE 8 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 4 -\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning\nskills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of written\nand electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 9 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 5 -\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes to\n\n lead small teams including setting and maintaining\n\n team and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to\nteam members\n1.2\nReasons for instructions and requirements are\ncommunicated to team members\n1.3\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having regard\nto the skills, knowledge and aptitude required to\nproperly undertake the assigned task and according to\ncompany policy\n2.2\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on\nclient needs and according to assignment requirements\n3.2\nPerformance expectations are based on individual team\nmembers duties and area of responsibility\n3.3\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to appropriate\npersonnel according to employer policy\n4.4\nTeam members are kept informed of any changes in the\npriority allocated to assignments or tasks which might\nimpact on client/customer needs and satisfaction\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6\nFollow-up communication is provided on all issues\naffecting the team\n4.7\nAll relevant documentation is completed in accordance\nwith company procedures\n\n--- PDF PAGE 10 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 6 -\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s concerns\n2.1\nRoster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 11 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 7 -\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2\nAssessed and monitored team and individual performance\nagainst set criteria\n1.3\nRepresented concerns of a team and individual to next level of\nmanagement or appropriate specialist and to negotiate on their\nbehalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of the\ntasks to be performed\n1.5\nSet and communicated performance expectations for a range\nof tasks and duties within the team and provided feedback to\nteam members\n2. Underpinning\nknowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual member\nin relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 12 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 8 -\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to collect\ninformation in order to negotiate to a desired outcome and participate\nin the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1 Information on preparing for negotiation is identified and\nincluded in the plan\n1.2 Information on creating non verbal environments for positive\nnegotiating is identified and included in the plan\n1.3 Information on active listening is identified and included in the\nplan\n1.4 Information on different questioning techniques is identified\nand included in the plan\n1.5 Information is checked to ensure it is correct and up-to- date\n2. Participate in\nnegotiations\n2.1 Criteria for successful outcome are agreed upon by all parties\n2.2 Desired outcome of all parties are considered\n2.3 Appropriate language is used throughout the negotiation\n2.4 A variety of questioning techniques are used\n2.5 The issues and processes are documented and agreed upon\nby all parties\n2.6 Possible solutions are discussed and their viability assessed\n2.7 Areas for agreement are confirmed and recorded\n2.8 Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 13 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 9 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the negotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 14 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 10 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to achieve an\nagreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies procedures\n2.4 Problem solving strategies on how to deal with unexpected\nquestions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.4 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation process\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or in a\nsimulated workplace setting.\n\n--- PDF PAGE 15 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 11 -\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to determine and\nresolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nIdentify the problem\n1.1\nVariances are identified from normal operating\nparameters; and product quality\n1.2\nExtent, cause and nature are of the problem are defined\nthrough observation, investigation and analytical\ntechniques\n1.3\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental causes\nof the problem\n2.1\nPossible causes are identified based on experience and\nthe use of problem solving tools / analytical techniques.\n2.2\nPossible cause statements are developed based on\nfindings\n2.3\nFundamental causes are identified per results of\ninvestigation conducted\n3.\nDetermine corrective\naction\n3.1\nAll possible options are considered for resolution of the\nproblem\n3.2\nStrengths and weaknesses of possible options are\nconsidered\n3.3\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in accordance\nwith safety and operating procedures\n4.\nProvide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations are prepared\n4.2\nRecommendations are presented to appropriate\npersonnel.\n4.3\nRecommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 12 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 17 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 13 -\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios /\ncase studies / what ifs as a stimulus with a walk through forming part\nof the response. These assessment activities should include a range\nof problems, including new, unusual and improbable situations that\nmay have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating parameters,\nand product quality to recognize non-standard situations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1\nRelevant equipment and operational processes\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4\nPrinciples of decision making strategies and\ntechniques\n2.2.5\nEnterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n\n--- PDF PAGE 18 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 14 -\n\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A\nbank of scenarios / case studies / what ifs will be required as\nwell as bank of questions which will be used to probe the\nreason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 19 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 15 -\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in the\napplication of mathematical concepts and techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given condition\n1.2 Mathematical techniques are selected based on the\ngiven problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the problem\nidentified\n2.2 Mathematical computations are performed to the level of\naccuracy required for the problem\n2.3 Results of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected and\nrequired specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 20 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 16 -\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\n--- PDF PAGE 21 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 17 -\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nskills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 22 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 18 -\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and attitude\nrequired in selecting, sourcing and applying appropriate and affordable\ntechnologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on\njob requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced as per\nestablished industry practices\n\n3. Maintain/enhance\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance with\nthe industry standard operating procedure,\nmanufacturer’s operating guidelines and occupational\nhealth and safety procedure to ensure its operativ