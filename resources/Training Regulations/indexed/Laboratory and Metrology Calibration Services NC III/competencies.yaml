        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\n Assessment requires evidence that the candidate:\n1.1 Read and construct graph\n1.2 Performed basic statistical computation\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Trend(s) indicated by changes in gradient of a graph\n2.2 Procedures for drawing the line of best fit for the coordinates plotted\n2.3 Standard form of equations relating to straight lines and parabolic\ncurves\n2.4 Gradient, intercepts, maximum and minimum values and limit lines for\nstraight line and parabolic curves\n2.5 Function of control charts\n2.6 Meaning of the terms mean, median and mode\n2.7 Meaning of the term standard deviation\n2.8 Significance of 1, 2 and 3 sigma limits\n2.9 Safe work practices and procedures\n2.10 Characteristics of straight line, parabolic and hyperbolic curves\n2.11\nProcedures for determining the slope/rate of change of a curve\n\n3. Underpinning\nskills\n3.1 Checking for conformance to specifications\n3.2 Undertaking numerical operations, geometry and calculations/formulae\nwithin the scope of this unit\n\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5 Method of\nassessment\nCandidate MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3Third party report\n\n6 Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a combination of\nboth on-and off-the-job.\n6.2 Where assessment occurs off-the-job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n\n--- PDF PAGE 47 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 43 -"
        },
        "source_text": "ALT315313\n\nUNIT DESCRIPTOR\n:\nThis unit covers interpreting and constructing graphs and\ncharts from given or determined data, and performing basic\nstatistical calculations. Application of the Graphs and charts may\nbe applied to information from competency various work\ncontexts, quality processes, production and market trends and\nother engineering applications. A range of devices may be used\nto assist with calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Read and construct\ngraphs\n\n1.1 Complex information is extracted from graphical from given\nor determined representation.\n1.2 Data is analyzed with respect to emerging trends.\n1.3 Graphs are constructed as required from data and drawn\nwith respect to scale and accepted method.\n1.4 Significant features of graphical representation are\nunderstood such as limit lines, gradients (straight line\ngraphs), intercepts, maximum and minimum values.\n1.5 A wide variety of graphs are constructed as required\nincluding histograms, control charts, straight line graphs and\nparabolic graphs.\n\n2. Perform basic statistical\ncomputation\n\n2.1 Mean, median and mode are calculated from given\ncalculations data.\n2.2 Standard deviation is calculated.\n2.3 Application of standard deviation and limits to process\nimprovement techniques is understood.\n\n--- PDF PAGE 45 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 41 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Process improvement\n\nTechniques in which error rates are mathematically\ncalculated and recorded such as:\n1.1 Three sigma\n1.2 Six sigma\n\n--- PDF PAGE 46 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 42 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n Assessment requires evidence that the candidate:\n1.1 Read and construct graph\n1.2 Performed basic statistical computation\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Trend(s) indicated by changes in gradient of a graph\n2.2 Procedures for drawing the line of best fit for the coordinates plotted\n2.3 Standard form of equations relating to straight lines and parabolic\ncurves\n2.4 Gradient, intercepts, maximum and minimum values and limit lines for\nstraight line and parabolic curves\n2.5 Function of control charts\n2.6 Meaning of the terms mean, median and mode\n2.7 Meaning of the term standard deviation\n2.8 Significance of 1, 2 and 3 sigma limits\n2.9 Safe work practices and procedures\n2.10 Characteristics of straight line, parabolic and hyperbolic curves\n2.11\nProcedures for determining the slope/rate of change of a curve\n\n3. Underpinning\nskills\n3.1 Checking for conformance to specifications\n3.2 Undertaking numerical operations, geometry and calculations/formulae\nwithin the scope of this unit\n\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5 Method of\nassessment\nCandidate MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3Third party report\n\n6 Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a combination of\nboth on-and off-the-job.\n6.2 Where assessment occurs off-the-job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n\n--- PDF PAGE 47 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 43 -"
      }
