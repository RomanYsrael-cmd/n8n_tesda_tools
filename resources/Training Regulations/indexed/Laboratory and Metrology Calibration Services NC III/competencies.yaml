ools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 35 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 31 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health and Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 36 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 32 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 37 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 33 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nUSE COMPARISON AND BASIC MEASURING DEVICES\n\nUNIT CODE\n\n:\nALT315311\n\nUNIT DESCRIPTOR\n:\nThis unit covers sorting items using basic comparison\nmeasuring equipment, and maintaining the equipment.\nMeasurements are conducted in a production environment or\nat a work station.\nWork is undertaken autonomously or as part of teamwork. All\ncomparative measurements are undertaken to standard\noperating procedures and to regulatory and legislative\nrequirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify job\nrequirements\n\n1.1 Job sheets or equivalent instructions are interpreted without\nerror and in accordance with company standard operating\nprocedures.\n1.2 Determine what measuring equipment is needed\n2. Set comparative\n measuring devices\n\n2.1 Measuring equipment is set to specifications using\nmanufacturer guidelines or standard operating procedures\nand techniques.\n\n3. Use comparison\nand/or\n basic measuring\ndevices\n\n3.1 Basic measuring devices are identified and used to\nundertake required comparisons or measurements using\nstandard operating procedures.\n3.2 Checking or sorting of items is undertaken using\ncomparison and/or basic measuring device according to\nstandard operating procedures.\n3.3 Measurements are documented and reported as per\ncompany standard operating procedures.\n\n4. Maintain comparison\nand/or basic\nmeasuring devices\n\n4.1 Basic care and storage is maintained according to\nmanufacturers’ standards or standard operating procedures.\n\n--- PDF PAGE 38 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 34 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Basic measuring\ndevices\n\nLinear measuring devices measuring to within 1mm graduation –\nmay include\n1.1 Rules\n1.2 Tapes & retractable tapes\n1.3 Vernier caliper, micrometer\n2. Comparisons\n2.1 Comparison of Length, Angle, shape and Size\n2.2 Comparisons of Temperature, Pressure and Weight\n2.3 Comparisons of Voltage, Resistance and Amperage\n3. Comparison\nmeasuring\ndevices\n\n3.1\nGo/no-go devices\n3.2\nThread angle and taper gauges\n3.3\nOverlay indicators\n3.4\nTemplates\n3.5\nDigital devices\n3.6\nPre-set verniers and micrometers\n3.7\nTemperature gauges\n3.8\nPressure gauges\n3.9\nMeasuring gauges\n3.10 Profile Comparators\n\n--- PDF PAGE 39 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 35 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate used comparison\nand basic measuring devices.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Use and application of various comparison or measurement\ndevices\n2.2 Procedures for the correct use of devices\n2.3 Procedures for maintaining and storing devices\n2.4 Hazards and control measures associated with conducting\nmeasurements, including housekeeping\n2.5\nSafe work practices and procedures\n\n3. Underpinning\nskills\n3.1 Using device in accordance with standard operating procedures\n3.2 Storing and maintaining devices\n3.3 Using basic numeracy skills for undertaking comparison\nmeasurements\n3.4 Following oral instructions and written standard operating\nprocedures\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Real or simulated\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n\n--- PDF PAGE 40 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 36 -\nUNIT OF COMPETENCY :\nMEASURE COMPONENTS USING COORDINATE\nMEASURING MACHINES (CMM)\n\nUNIT CODE\n\n:\nALT315312\n\nUNIT DESCRIPTOR :\nThis unit applies where the operator is following established\nprocesses, practices and standard operating procedures and\nis responsible for providing dimensional detail required for\nadjustment or checking of the manufacturing process.\nWork is carried out autonomously using predetermined\nstandards of quality and safety. Operators would be\nexpected to have competence in basic setting and adjusting\nof machines.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify job\nrequirements\n1.1 Job sheets or equivalent instructions are interpreted without error\nand in accordance with company standard operating procedures.\n\n2. Load components\n2.1 Pre-start checks are undertaken to standard operating\nprocedures.\n2.2 Appropriate safety procedures are observed and safety\nequipment is checked for operation according to job\nrequirements.\n2.3 Appropriate fixture/clamping device are selected according to job\nrequirements.\n2.4 Component and fixtures are loaded and clamped in accordance\nwith standard operating procedures.\n3. Validate/calibrate\n precision\nmeasuring\n equipment\n\n3.1 Calibration of precision measuring equipment is assessed to\nmanufacturers’ specifications and/or standard operating\nprocedures.\n3.2 Equipment is calibrated according to physical standards using\nappropriate calibration devices, equipment, techniques based on\npredetermined procedures.\n3.3 Equipment is recommissioned in accordance with standard\noperating procedures for precision measuring.\n\n4. Set probes\n\n4.1 Probe configuration is checked in accordance with 3 Set probes\nstandard operating procedures.\n4.2 Pre-measurement manual hits are taken for manual\n alignment in accordance with standard operating procedures.\n\n5. Measure\ncomponents\n5.1 Part program is selected as required, run and verified according\nto standard operating procedures.\n5.2 Components measurement is performed according to standard\noperating procedures.\n5.3 Results are interpreted and non-conforming/out of tolerance\nmeasurements are identified and reported.\n5.4 Part program is correctly shut down and components are\nremoved according to standard operating procedures.\n5.5 Coordinate measuring machine, accessories and surrounds\nare left in a clean, safe condition.\n\n--- PDF PAGE 41 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 37 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Probe\n1.1 Solid trigger probes\n1.2 Electronic trigger probes\n\n2. Measurements\nAre limited to those which can be measured directly and do\nnot require to be constructed mathematically such as:\n2.1 Length\n2.2 Squareness\n2.3 Flatness\n2.4 Angle\n2.5 Roundness\n2.6 Clearances or any other measurements that can be read off\n2.7 Analog measuring device\n\n3. Coordinate measuring\nmachine\n\n3.1 Manual machines\n3.2 Machines fitted with microprocessors\n\n--- PDF PAGE 42 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 38 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified job requirements\n1.2 Loaded components\n1.3 Had set probes\n1.4 Measured components\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Information on job sheets or equivalent\n2.2 Pre-start checks in using coordinate measuring machine (CMM)\n2.3 Hazards and control measures associated with operating a CMM,\nincluding housekeeping\n2.4 Usage and application of personal protective equipment (PPE)\n2.5 Safe work practices and procedures\n2.6 Fixtures/clamping devices and their uses\n2.7 Storage location and procedures\n2.8 Fixing/clamping methods\n2.9 Procedures for undertaking pre-measurement manual hits for manual\nalignment\n2.10 Procedures for checking probe configuration\n2.11 Procedures for running and verifying part program\n2.12 Methods/techniques for interpreting results\n2.13 Procedures for reporting results and recommendations for\nadjustment\n2.14 Procedures for shutting down part program\n2.15 Procedures to safely remove and handle components\n2.16 Required cleaning tasks and the importance of cleaning the CMM\n2.17 Effects of contamination\n2.18\nPerseverance, Attention to details and Honesty\n\n3. Underpinning\nskills\n3.1 Reading and following routine, familiar information for loading, setting\nprobes and measuring components\n3.2 Identifying and following pre-start check procedure\n3.3 Following safety procedures\n3.4 Selecting specified fixture/clamping device\n3.5 Positioning and clamping components\n3.6 Taking manual hits and determining probe alignment\n3.7 Verifying probe/s configuration to specifications\n3.8 Selecting and activating part programs as required where machine is\nfitted with microprocessors\n3.9 Verifying and confirming correct program operation\n3.10 Applying correct measuring techniques\n3.11 Reporting out of tolerance measurements\n3.12 Shutting down the part program\n3.13 Removing and handling components\n3.14 Cleaning machine and site\n3.15 Following verbal instructions\n3.16\nOrally reporting routine information\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5. Method of\nassessment\nCandidate MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n\n--- PDF PAGE 43 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 39 -\n5.3 Third party report\n\n6. Context of\nassessment\n\n6.1 This unit may be assessed on-the-job, off-the-job or a\ncombination of both on-and off-the-job.\n6.2 Where assessment occurs off-the job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n\n--- PDF PAGE 44 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 40 -\n UNIT OF COMPETENCY :\nUSE GRAPHICAL TECHNIQUES AND PERFORM\nSIMPLE STATISTICAL COMPUTATIONS\n\nUNIT CODE\n\n:\nALT315313\n\nUNIT DESCRIPTOR\n:\nThis unit covers interpreting and constructing graphs and\ncharts from given or determined data, and performing basic\nstatistical calculations. Application of the Graphs and charts may\nbe applied to information from competency various work\ncontexts, quality processes, production and market trends and\nother engineering applications. A range of devices may be used\nto assist with calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Read and construct\ngraphs\n\n1.1 Complex information is extracted from graphical from given\nor determined representation.\n1.2 Data is analyzed with respect to emerging trends.\n1.3 Graphs are constructed as required from data and drawn\nwith respect to scale and accepted method.\n1.4 Significant features of graphical representation are\nunderstood such as limit lines, gradients (straight line\ngraphs), intercepts, maximum and minimum values.\n1.5 A wide variety of graphs are constructed as required\nincluding histograms, control charts, straight line graphs and\nparabolic graphs.\n\n2. Perform basic statistical\ncomputation\n\n2.1 Mean, median and mode are calculated from given\ncalculations data.\n2.2 Standard deviation is calculated.\n2.3 Application of standard deviation and limits to process\nimprovement techniques is understood.\n\n--- PDF PAGE 45 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 41 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Process improvement\n\nTechniques in which error rates are mathematically\ncalculated and recorded such as:\n1.1 Three sigma\n1.2 Six sigma\n\n--- PDF PAGE 46 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 42 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n Assessment requires evidence that the candidate:\n1.1 Read and construct graph\n1.2 Performed basic statistical computation\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Trend(s) indicated by changes in gradient of a graph\n2.2 Procedures for drawing the line of best fit for the coordinates plotted\n2.3 Standard form of equations relating to straight lines and parabolic\ncurves\n2.4 Gradient, intercepts, maximum and minimum values and limit lines for\nstraight line and parabolic curves\n2.5 Function of control charts\n2.6 Meaning of the terms mean, median and mode\n2.7 Meaning of the term standard deviation\n2.8 Significance of 1, 2 and 3 sigma limits\n2.9 Safe work practices and procedures\n2.10 Characteristics of straight line, parabolic and hyperbolic curves\n2.11\nProcedures for determining the slope/rate of change of a curve\n\n3. Underpinning\nskills\n3.1 Checking for conformance to specifications\n3.2 Undertaking numerical operations, geometry and calculations/formulae\nwithin the scope of this unit\n\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Access to all tools & equipment materials and documentations\n4.3 Relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials\n\n5 Method of\nassessment\nCandidate MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3Third party report\n\n6 Context of\nassessment\n6.1 This unit may be assessed on-the-job, off-the-job or a combination of\nboth on-and off-the-job.\n6.2 Where assessment occurs off-the-job, that is the candidate is not in\nproductive work, then an appropriate simulation must be used where\nthe range of conditions reflects realistic workplace situations.\n\n--- PDF PAGE 47 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 43 -"
