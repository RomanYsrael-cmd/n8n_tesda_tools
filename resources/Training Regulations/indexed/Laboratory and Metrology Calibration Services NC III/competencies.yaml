          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate used comparison\nand basic measuring devices.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Use and application of various comparison or measurement\ndevices\n2.2 Procedures for the correct use of devices\n2.3 Procedures for maintaining and storing devices\n2.4 Hazards and control measures associated with conducting\nmeasurements, including housekeeping\n2.5\nSafe work practices and procedures\n\n3. Underpinning\nskills\n3.1 Using device in accordance with standard operating procedures\n3.2 Storing and maintaining devices\n3.3 Using basic numeracy skills for undertaking comparison\nmeasurements\n3.4 Following oral instructions and written standard operating\nprocedures\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Real or simulated\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n\n--- PDF PAGE 40 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 36 -\nUNIT OF COMPETENCY :\nMEASURE COMPONENTS USING COORDINATE\nMEASURING MACHINES (CMM)\n\nUNIT CODE\n\n:"
        },
        "source_text": "ALT315311\n\nUNIT DESCRIPTOR\n:\nThis unit covers sorting items using basic comparison\nmeasuring equipment, and maintaining the equipment.\nMeasurements are conducted in a production environment or\nat a work station.\nWork is undertaken autonomously or as part of teamwork. All\ncomparative measurements are undertaken to standard\noperating procedures and to regulatory and legislative\nrequirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify job\nrequirements\n\n1.1 Job sheets or equivalent instructions are interpreted without\nerror and in accordance with company standard operating\nprocedures.\n1.2 Determine what measuring equipment is needed\n2. Set comparative\n measuring devices\n\n2.1 Measuring equipment is set to specifications using\nmanufacturer guidelines or standard operating procedures\nand techniques.\n\n3. Use comparison\nand/or\n basic measuring\ndevices\n\n3.1 Basic measuring devices are identified and used to\nundertake required comparisons or measurements using\nstandard operating procedures.\n3.2 Checking or sorting of items is undertaken using\ncomparison and/or basic measuring device according to\nstandard operating procedures.\n3.3 Measurements are documented and reported as per\ncompany standard operating procedures.\n\n4. Maintain comparison\nand/or basic\nmeasuring devices\n\n4.1 Basic care and storage is maintained according to\nmanufacturers’ standards or standard operating procedures.\n\n--- PDF PAGE 38 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 34 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Basic measuring\ndevices\n\nLinear measuring devices measuring to within 1mm graduation –\nmay include\n1.1 Rules\n1.2 Tapes & retractable tapes\n1.3 Vernier caliper, micrometer\n2. Comparisons\n2.1 Comparison of Length, Angle, shape and Size\n2.2 Comparisons of Temperature, Pressure and Weight\n2.3 Comparisons of Voltage, Resistance and Amperage\n3. Comparison\nmeasuring\ndevices\n\n3.1\nGo/no-go devices\n3.2\nThread angle and taper gauges\n3.3\nOverlay indicators\n3.4\nTemplates\n3.5\nDigital devices\n3.6\nPre-set verniers and micrometers\n3.7\nTemperature gauges\n3.8\nPressure gauges\n3.9\nMeasuring gauges\n3.10 Profile Comparators\n\n--- PDF PAGE 39 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 35 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate used comparison\nand basic measuring devices.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Use and application of various comparison or measurement\ndevices\n2.2 Procedures for the correct use of devices\n2.3 Procedures for maintaining and storing devices\n2.4 Hazards and control measures associated with conducting\nmeasurements, including housekeeping\n2.5\nSafe work practices and procedures\n\n3. Underpinning\nskills\n3.1 Using device in accordance with standard operating procedures\n3.2 Storing and maintaining devices\n3.3 Using basic numeracy skills for undertaking comparison\nmeasurements\n3.4 Following oral instructions and written standard operating\nprocedures\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Real or simulated\n4.2 Access to all tools, equipment, materials and documentation\nrequired\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference\nmaterials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n\n--- PDF PAGE 40 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 36 -\nUNIT OF COMPETENCY :\nMEASURE COMPONENTS USING COORDINATE\nMEASURING MACHINES (CMM)\n\nUNIT CODE\n\n:"
