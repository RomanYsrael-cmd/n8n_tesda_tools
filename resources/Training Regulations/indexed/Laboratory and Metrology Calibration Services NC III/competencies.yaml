        "source_title": "MEASURE COMPONENTS USING COORDINATE MEASURING MACHINES (CMM)",
        "source_text": "--- PDF PAGE 40 ---\nTR Laboratory and Metrology/Calibration Services NC III   Promulgated \n- 36 - \nUNIT OF COMPETENCY :  \nMEASURE COMPONENTS USING COORDINATE \nMEASURING MACHINES (CMM) \n \n \nUNIT CODE  \n \n:  \nALT315312 \n \nUNIT DESCRIPTOR           :  \nThis unit applies where the operator is following established \nprocesses, practices and standard operating procedures and \nis responsible for providing dimensional detail required for \nadjustment or checking of the manufacturing process. \nWork is carried out autonomously using predetermined \nstandards of quality and safety. Operators would be \nexpected to have competence in basic setting and adjusting \nof machines. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Identify job \nrequirements \n1.1 Job sheets or equivalent instructions are interpreted without error \nand in accordance with company standard operating procedures. \n \n2. Load components  \n2.1 Pre-start checks are undertaken to standard operating \nprocedures. \n2.2 Appropriate safety procedures are observed and safety \nequipment is checked for operation according to job \nrequirements. \n2.3 Appropriate fixture/clamping device are selected according to job \nrequirements. \n2.4 Component and fixtures are loaded and clamped in accordance \nwith standard operating procedures.\n3.  Validate/calibrate  \n      precision \nmeasuring \n      equipment \n \n3.1 Calibration of precision measuring equipment is assessed to \nmanufacturers’ specifications and/or standard operating \nprocedures. \n3.2 Equipment is calibrated according to physical standards using \nappropriate calibration devices, equipment, techniques based on \npredetermined procedures. \n3.3 Equipment is recommissioned in accordance with standard \noperating procedures for precision measuring.\n \n4. Set probes  \n \n4.1 Probe configuration is checked in accordance with 3 Set probes \nstandard operating procedures. \n4.2 Pre-measurement manual hits are taken for manual  \n      alignment in accordance with standard operating procedures.\n \n5. Measure \ncomponents \n5.1 Part program is selected as required, run and verified according \nto standard operating procedures. \n5.2 Components measurement is performed according to standard \noperating procedures. \n5.3 Results are interpreted and non-conforming/out of tolerance \nmeasurements are identified and reported. \n5.4 Part program is correctly shut down and components are \nremoved according to standard operating procedures. \n5.5 Coordinate measuring machine, accessories and surrounds \nare left in a clean, safe condition.\n\n--- PDF PAGE 41 ---\nTR Laboratory and Metrology/Calibration Services NC III   Promulgated \n- 37 - \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Probe \n1.1 Solid trigger probes \n1.2 Electronic trigger probes \n \n2. Measurements  \nAre limited to those which can be measured directly and do \nnot require to be constructed mathematically such as: \n2.1 Length \n2.2 Squareness \n2.3 Flatness \n2.4 Angle \n2.5 Roundness \n2.6 Clearances or any other measurements that can be read off  \n2.7 Analog measuring device\n \n3. Coordinate measuring \nmachine  \n \n3.1 Manual machines  \n3.2 Machines fitted with microprocessors\n\n--- PDF PAGE 42 ---\nTR Laboratory and Metrology/Calibration Services NC III   Promulgated \n- 38 - \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Identified job requirements  \n1.2 Loaded components  \n1.3 Had set probes \n1.4 Measured components\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Information on job sheets or equivalent  \n2.2 Pre-start checks in using coordinate measuring machine (CMM)  \n2.3 Hazards and control measures associated with operating a CMM, \nincluding housekeeping  \n2.4 Usage and application of personal protective equipment (PPE) \n2.5 Safe work practices and procedures  \n2.6 Fixtures/clamping devices and their uses  \n2.7 Storage location and procedures  \n2.8 Fixing/clamping methods  \n2.9 Procedures for undertaking pre-measurement manual hits for manual \nalignment  \n2.10 Procedures for checking probe configuration  \n2.11 Procedures for running and verifying part program  \n2.12 Methods/techniques for interpreting results  \n2.13 Procedures for reporting results and recommendations for \nadjustment  \n2.14 Procedures for shutting down part program  \n2.15 Procedures to safely remove and handle components  \n2.16 Required cleaning tasks and the importance of cleaning the CMM  \n2.17 Effects of contamination \n2.18\nPerseverance, Attention to details and Honesty\n \n3. Underpinning \nskills \n3.1 Reading and following routine, familiar information for loading, setting \nprobes and measuring components  \n3.2 Identifying and following pre-start check procedure  \n3.3 Following safety procedures  \n3.4 Selecting specified fixture/clamping device  \n3.5 Positioning and clamping components  \n3.6 Taking manual hits and determining probe alignment  \n3.7 Verifying probe/s configuration to specifications  \n3.8 Selecting and activating part programs as required where machine is \nfitted with microprocessors  \n3.9 Verifying and confirming correct program operation  \n3.10 Applying correct measuring techniques  \n3.11 Reporting out of tolerance measurements  \n3.12 Shutting down the part program  \n3.13 Removing and handling components  \n3.14 Cleaning machine and site  \n3.15 Following verbal instructions  \n3.16\nOrally reporting routine information \n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2  Access to all tools & equipment materials and documentations  \n4.3 Relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials\n \n5. Method of \nassessment\nCandidate MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio\n\n--- PDF PAGE 43 ---\nTR Laboratory and Metrology/Calibration Services NC III   Promulgated \n- 39 - \n5.3 Third party report\n \n6. Context of \nassessment \n \n6.1 This unit may be assessed on-the-job, off-the-job or a \ncombination of both on-and off-the-job.  \n6.2 Where assessment occurs off-the job, that is the candidate is not in \nproductive work, then an appropriate simulation must be used where \nthe range of conditions reflects realistic workplace situations.\n",
