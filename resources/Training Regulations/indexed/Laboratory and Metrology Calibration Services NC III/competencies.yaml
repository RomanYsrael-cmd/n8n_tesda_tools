          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 37 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 33 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nUSE COMPARISON AND BASIC MEASURING DEVICES\n\nUNIT CODE\n\n:"
