  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for LABORATORY AND METROLOGY/CALIBRATION SERVICES NC III.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: LABORATORY AND METROLOGY/CALIBRATION SERVICES Level: NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n56 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with competency to perform laboratory and\nmetrology/calibration services work specifically on using comparison and basic measuring\ndevices. It also include competency in measure components using coordinate measuring\nmachines and use graphical techniques and perform simple statistical computations\n\nBasic competencies such as: Lead workplace communication; Lead small teams; Develop\nand practice negotiation skills; Solve problems related to work activities; Use mathematical\nconcepts and techniques and Use relevant technologies are included.\nIt also includes common competencies such as: Read, Interpret and Apply Engineering\nDrawings; Perform Mensuration and Calculation Read; Interpret and Apply Specifications and\nManuals and; Perform Shop Maintenance.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Case studies\n• Modular\n• Written\nexamination\n• Direct\nObservation\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Lecture\n• Role play\n• Practical\nexercises\n• Written test\n• Demonstration\n\n--- PDF PAGE 48 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 44 -\n4. Solve\nworkplace\nproblem\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Lecture\n• Self-paced\ninstruction\n• Group\ndiscussion\n• Practical work\napproach\n• Research\nstudy\n• Written test\n• Demonstration\n• Oral interview\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Lecture\n• Self-paced\ninstruction\nGroup\ndiscussion\n•\nFilm showing\n• Written test\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read,\nInterpret and\nApply\nEngineering\nDrawings\n1.1 Identify and access engineering\ndrawings/ specification\n1.2 Interpret drawings\n1.3 Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1 Select measuring instrument\n2.2 Carry out measurement and\ncalculations.\n2.2 Maintain measuring instruments\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n•\n3. Read,\nInterpret and\nApply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals and\ninterpret data and specification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written/Oral\nquestioning\n• Direct\nobservation\n• Project method\n•Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used lubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\n• Demonstration\n• Self-paced\ninstruction\n• Dual training\n• Simulation\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n•Demonstration\n\n--- PDF PAGE 49 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 45 -\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Use\ncomparison\nand basic\nmeasuring\ndevices\n1.1 Identify job requirements\n1.2 Set comparative measuring\ndevices\n1.3 Use comparison and/or basic\nmeasuring devices\n1.4 Maintain comparison and/or\nbasic measuring devices\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Discussion\n• Direct\nObservation\n• Portfolio\n• Third party\nreport\n2. Measure\ncomponents\nusing\ncoordinate\nmeasuring\nmachines\n2.1 Identify job requirements\n2.2 Load components\n2.3 Validate/calibrate precision\nmeasuring equipment\n2.4 Set probes\n2.5 Measure components\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Discussion\n• Direct\nObservation\n• Portfolio\n• Third party\nreport\n3. Use graphical\ntechniques\nand perform\nsimple\nstatistical\ncomputations\n3.1 Read and construct graphs\n3.2 Perform basic statistical\ncomputation\n\n• Lecture\n• Demonstration\n• Dualized\ntraining\n• Discussion\n\n• Observation\nwith\nquestioning\n• Portfolio\n• Third party\nreport\n\n--- PDF PAGE 50 ---\nTR Laboratory and Metrology/Calibration Services 