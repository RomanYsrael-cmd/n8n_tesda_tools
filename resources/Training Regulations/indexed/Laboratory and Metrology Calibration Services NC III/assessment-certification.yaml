  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of LABORATORY AND METROLOGY/CALIBRATION\nSERVICES NC III, the candidate must demonstrate competence in all the units listed in\nSection 1.\n\nSuccessful candidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.2 Individual aspiring to be awarded the qualification of LABORATORY AND\nMETROLOGY/CALIBRATION SERVICES NC III must acquire Certificates of Competency\n(COC) in all the following core units of the Qualification. Candidates may apply for\nassessment in any accredited assessment center.\n\n4.2.1.\nUse Comparison and Basic Measuring Devices\n4.2.2.\nMeasure Components Using Coordinate Measuring Machines\n4.2.3.\nUse Graphical Techniques and Perform Simple Statistical Computations\n\n4.3 Upon accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the corresponding\nNational Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.4.1. Holder of LABORATORY AND METROLOGY/CALIBRATION SERVICES NC II or\nequivalent qualification; or\n\n4.4.2. Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.4.3. Experienced workers (wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 55 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 51 -\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nLaboratory and Metrology Calibration Services NC III\n-\nLegend:\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nRead & Interpret\nEngineering Drawings\nPerform Mensuration\nand Calculation\nRead, Interpret and\nApply Specifications\nand Manuals\nPerform Shop\nMaintenance\nDevelop and\nManufacture Wood\nPattern\nDevelop and\nManufacture Polymer\nPattern\nDevelop and\nManufacture Assembled\nPlated Pattern\nDevelop and\nManufacture Production\nPattern\nPerform General\nWoodworking Machine\nOperations\nUse and Maintain\nMeasuring Instrument\nPrepare & Mix Sand for\nMetal Molding\nProduce Molds by Hand\nProduce Cores by Hand\nOperate Molding\nMachine\nOperate Core-Making\nMachine\nPour Molten Metal to\nMolds\nOperate Melting\nFurnaces (non-electric)\nOperate Cupola Melting\nFurnace\nOperate Electric\nInduction Melting\nFurnace\nFettle & Trim Metal\nCastings/Forgings\nPerform Refractory\nInstallation & Repair\nMelt Aluminum-\nSilicon Alloys for\nSafety Tested\nCastings\nMelt Metals Using\nCoreless Induction\nFurnace\nMelt Automotive Gray\nIron Castings in Cupola\nPrepare Sand Mixture\nfor Heavy Casting\nPour Molten Metal\nto Heavy Castings\n\nManufacture and\ndevelop corebox for\nShell Core Box\nDevelop and\nManufacture Gear,\nConveyor Screw and\nDevelop Gravity Die\nCasting Mold\n"
