      "number": "17",
      "text": "Go/No Go Device A Go-NoGo gauge (or Go/no go) refers to an inspection tool used to check a workpiece against its allowed tolerances. Its name derives from its use: the gauge itself has two tests; the check involves the workpiece's having to pass one test (Go) and 'fail' the other (No Go). It is an integral part of the quality process that is used in the manufacturing industry to ensure interchangeability of parts between processes, or even between different manufacturers. A Go NoGo gauge is a measuring tool that does not return a size in the conventional sense, but instead returns a state. The state is either acceptable (the part is within tolerance and may be used) or it is unacceptable (and must be rejected). They are well suited for use in the production area of the factory as they require little skill or interpretation to use effectively and have few, if any, moving parts to be damaged in the often hostile production environment."
