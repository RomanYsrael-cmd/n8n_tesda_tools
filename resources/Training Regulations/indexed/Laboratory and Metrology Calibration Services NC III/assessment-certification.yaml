      "number": "16",
      "text": "Coordinate measuring machine A 'coordinate measuring machine' (CMM) is a device for measuring the physical geometrical characteristics of an object. This machine may be manually controlled by an operator or it may be computer controlled. Measurements are defined by a probe attached to the third moving axis of this machine. This probe touches the part of interest and allows collecting discrete points on the object's surface."
