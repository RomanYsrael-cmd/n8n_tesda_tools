      "term": "13. Sine bar",
      "definition": "Sine bar is a hardened, precision ground body with two precision ground cylinders fixed at the ends. The distance between the centers of the cylinders is precisely controlled, and the top of the bar is parallel to a line through the centers of the two rollers. 14. Standard deviation Standard deviation is the measure of the dispersion of a set of data from its mean. The more spread apart the data is, the higher the deviation. 15. Tolerance Tolerance is the allowable variance from a nominal value established by design engineers that is deemed non harmful to the functioning of the product. 16. Coordinate measuring machine A 'coordinate measuring machine' (CMM) is a device for measuring the physical geometrical characteristics of an object. This machine may be manually controlled by an operator or it may be computer controlled. Measurements are defined by a probe attached to the third moving axis of this machine. This probe touches the part of interest and allows collecting discrete points on the object's surface. 17. Go/No Go Device A Go-NoGo gauge (or Go/no go) refers to an inspection tool used to check a workpiece against its allowed tolerances. Its name derives from its use: the gauge itself has two tests; the check involves the workpiece's having to pass one test (Go) and 'fail' the other (No Go). It is an integral part of the quality process that is used in the manufacturing industry to ensure interchangeability of parts between processes, or even between different manufacturers. A Go NoGo gauge is a measuring tool that does not return a size in the conventional sense, but instead returns a state. The state is either acceptable (the part is within tolerance and may be used) or it is unacceptable (and must be rejected). They are well suited for use in the production area of the factory as they require little skill or interpretation to use effectively and have few, if any, moving parts to be damaged in the often hostile production environment. 18. Probe A very common probe was made by soldering a hard ball to the end of a shaft. This was ideal for measuring a whole range of flat, cylindrical or spherical surfaces. Other probes were ground to specific shapes, for example a quadrant, to enable measurement of special features. These probes were physically held against the workpiece with the position in space being read from a 3-Axis digital readout (DRO) or, in more advanced systems, being logged into a computer by means of a footswitch or similar device. Measurements taken by this contact method were often unreliable as machines were moved by hand and each machine operator applied different amounts of pressure on the probe or adopted differing techniques for the measurement."
