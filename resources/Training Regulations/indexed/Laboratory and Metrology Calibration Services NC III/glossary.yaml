      "term": "1. Accuracy",
      "definition": "Accuracy designates the degree of agreement of the measured size with its true magnitude as expressed in standard units of measurement. 2. Caliper gauges Caliper gauges are measuring device with jaws establish the length to be measured by positive contact. One of the jaws is integral with the graduated beam, the other has markings to indicate the corresponding scale position. 3. Dial indicators Dial indicators are instruments used to accurately measure a small distance. These may be used to check the variation in tolerance during the inspection process of a machined part, measure the deflection of a beam or ring under laboratory conditions, as well as many other situations where a small measurement needs to be registered or indicated. 4. Diffraction gratings Diffraction gratings are transparent plates, usually made of glass, having a large number of equally spaced parallel lines. 5. DMC (Dimensional Mark-up Language) DMC (Dimensional Mark-up Language) is the release and ongoing development and testing a global language for metrology systems interfaces. 6. Gauge blocks Gauge blocks are precision ground and lapped measuring standards. They are used as references for the setting of measuring equipment such as micrometers, sine bars, dial indicators (when used in an inspection role). 7. Line graduated master scales Line graduated master scales is the basis for the operation of optical instruments for absolute length measurements. 8. Line graduated rules Line graduated rules are available in widely different degrees of accuracy to suit diverse requirements for plain length measuring tools. 9. Metrology Metrology designates the science of all measurements that are made by comparing the dimensionally measurable conditions of solids, or of diverse physical phenomena to generally accepted units of measurement. It is a branch of technology concerned with the measurement of geometrically defined dimensions of technical parts. 10. Micrometer Micrometer is a measuring device using rotation of the threaded spindle causes controlled advance of the spindle’s contact face relative to an integral reference face. 11. Precision Precision expresses the degree of repeatability of the measuring process. It designates how closely identical values are obtained when repeating the same measurement at various intervals, or duplicating them by means of different instruments. 12. Random errors Random errors are statistical fluctuations (in either direction) in the measured data due to the precision limitations of the measurement device."
