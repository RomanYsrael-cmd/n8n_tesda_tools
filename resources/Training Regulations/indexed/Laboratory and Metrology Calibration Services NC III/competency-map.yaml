  "source_text": "Section 1.\n\nSuccessful candidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.2 Individual aspiring to be awarded the qualification of LABORATORY AND\nMETROLOGY/CALIBRATION SERVICES NC III must acquire Certificates of Competency\n(COC) in all the following core units of the Qualification. Candidates may apply for\nassessment in any accredited assessment center.\n\n4.2.1.\nUse Comparison and Basic Measuring Devices\n4.2.2.\nMeasure Components Using Coordinate Measuring Machines\n4.2.3.\nUse Graphical Techniques and Perform Simple Statistical Computations\n\n4.3 Upon accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the corresponding\nNational Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.4.1. Holder of LABORATORY AND METROLOGY/CALIBRATION SERVICES NC II or\nequivalent qualification; or\n\n4.4.2. Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.4.3. Experienced workers (wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 55 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 51 -\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nLaboratory and Metrology Calibration Services NC III\n-\nLegend:\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nRead & Interpret\nEngineering Drawings\nPerform Mensuration\nand Calculation\nRead, Interpret and\nApply Specifications\nand Manuals\nPerform Shop\nMaintenance\nDevelop and\nManufacture Wood\nPattern\nDevelop and\nManufacture Polymer\nPattern\nDevelop and\nManufacture Assembled\nPlated Pattern\nDevelop and\nManufacture Production\nPattern\nPerform General\nWoodworking Machine\nOperations\nUse and Maintain\nMeasuring Instrument\nPrepare & Mix Sand for\nMetal Molding\nProduce Molds by Hand\nProduce Cores by Hand\nOperate Molding\nMachine\nOperate Core-Making\nMachine\nPour Molten Metal to\nMolds\nOperate Melting\nFurnaces (non-electric)\nOperate Cupola Melting\nFurnace\nOperate Electric\nInduction Melting\nFurnace\nFettle & Trim Metal\nCastings/Forgings\nPerform Refractory\nInstallation & Repair\nMelt Aluminum-\nSilicon Alloys for\nSafety Tested\nCastings\nMelt Metals Using\nCoreless Induction\nFurnace\nMelt Automotive Gray\nIron Castings in Cupola\nPrepare Sand Mixture\nfor Heavy Casting\nPour Molten Metal\nto Heavy Castings\n\nManufacture and\ndevelop corebox for\nShell Core Box\nDevelop and\nManufacture Gear,\nConveyor Screw and\nDevelop Gravity Die\nCasting Mold\nCOMPETENCY MAP\nAUTOMOTIVE PARTS MANUFACTURING\nUse Comparison and Basic\nMeasuring Devices\nMeasure Components\nUsing Coordinate\nMeasuring Machines\nUse Graphical Techniques\nand Perform Simple\nStatistical Computations\nConduct Product\nand/or Process\nCapability Studies\nMaintain/Supervise the\nApplication of Quality\nProcedures\nPerform Mechanical\nPress Forming\nOperation\nChange\nEquipment Dies\nPerform Press Machine\nSetting\nMachine Parts\nPerform Precision\nAssembly\nPerform Mechanical\nShearing Operation\nApply Quality\nSystems\nPerform Hand Forging\nPerform Hammer Forging\nPerform Basic Incidental\nHeat/Quenching,\nTempering and\nAnnealing\nHammer Forge\nComplex Shapes\nPerform Drop and Upset\nForging\nSelect Heat\nTreatment Process\nPerform Heat\nTreatment Process\nHand Forge Complex\nShapes\nPerform Hand Molding\nto Produce Heavy\nCasting\nProduce Injection\nMolded Products\nProduce Blow\nMolded Products\nPrepare and Start\nEquipment for\nProduction\nANNEX A\nSelect and Control\nInspection Processes\nand Procedures\nPerform Precision\nMechanical\nMeasurement\nCalibrate Measuring\nEquipment\nPerform Inspection\nPerform Engineering\nMeasurement\nPerform Basic\nStatistical Quality\nControl\nUse Improvement\nProcesses in Team\nActivities\nOperate injection\nMolding Equipment\nPrepare Materials for\nFormulae\n\nAssemble Materials and\nEquipment for\nProduction\nOperate Blow Molding\nEquipment\nPrepare Molds for\nComposites Production\nMonitor Process\nOperations\nFinish Products and\nComponents\n\n--- PDF PAGE 56 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 52 -\nDEFINITION OF TERMS\n\n1. Accuracy\nAccuracy designates the degree of agreement of the\nmeasured size with its true magnitude as expressed in standard\nunits of measurement.\n2. Caliper gauges\nCaliper gauges are measuring device with jaws establish the\nlength to be measured by positive contact. One of the jaws is\nintegral with the graduated beam, the other has markings to\nindicate the corresponding scale position.\n3. Dial indicators\nDial indicators are instruments used to accurately measure a\nsmall distance. These may be used to check the variation in\ntolerance during the inspection process of a machined part,\nmeasure the deflection of a beam or ring under laboratory\nconditions, as well as many other situations where a small\nmeasurement needs to be registered or indicated.\n4. Diffraction gratings\nDiffraction gratings are transparent plates, usually made of\nglass, having a large number of equally spaced parallel lines.\n5. DMC (Dimensional\nMark-up Language)\nDMC (Dimensional Mark-up Language) is the release and\nongoing development and testing a global language for\nmetrology systems interfaces.\n6. Gauge blocks\nGauge blocks are precision ground and lapped measuring\nstandards. They are used as references for the setting of\nmeasuring equipment such as micrometers, sine bars, dial\nindicators (when used in an inspection role).\n7. Line graduated\nmaster scales\nLine graduated master scales is the basis for the operation of\noptical instruments for absolute length measurements.\n8. Line graduated\nrules\nLine graduated rules are available in widely different degrees\nof accuracy to suit diverse requirements for plain length\nmeasuring tools.\n9. Metrology\nMetrology designates the science of all measurements that are\nmade by comparing the dimensionally measurable conditions of\nsolids, or of diverse physical phenomena to generally accepted\nunits of measurement. It is a branch of technology concerned\nwith the measurement of geometrically defined dimensions of\ntechnical parts.\n10. Micrometer\nMicrometer is a measuring device using rotation of the\nthreaded spindle causes controlled advance of the spindle’s\ncontact face relative to an integral reference face.\n11. Precision\nPrecision expresses the degree of repeatability of the\nmeasuring process. It designates how closely identical values\nare obtained when repeating the same measurement at various\nintervals, or duplicating them by means of different instruments.\n12. Random errors\nRandom errors are statistical fluctuations (in either direction) in\nthe measured data due to the precision limitations of the\nmeasurement device.\n\n--- PDF PAGE 57 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 53 -\n\n13. Sine bar\nSine bar is a hardened, precision ground body with two\nprecision ground cylinders fixed at the ends. The distance\nbetween the centers of the cylinders is precisely controlled, and\nthe top of the bar is parallel to a line through the centers of the\ntwo rollers.\n14. Standard deviation\nStandard deviation is the measure of the dispersion of a set of\ndata from its mean. The more spread apart the data is, the\nhigher the deviation.\n15. Tolerance\nTolerance is the allowable variance from a nominal value\nestablished by design engineers that is deemed non harmful to\nthe functioning of the product.\n16. Coordinate\nmeasuring machine\nA 'coordinate measuring machine' (CMM) is a device for\nmeasuring the physical geometrical characteristics of an object.\nThis machine may be manually controlled by an operator or it\nmay be computer controlled. Measurements are defined by a\nprobe attached to the third moving axis of this machine. This\nprobe touches the part of interest and allows collecting discrete\npoints on the object's surface.\n17. Go/No Go Device\nA Go-NoGo gauge (or Go/no go) refers to an inspection tool\nused to check a workpiece against its allowed tolerances. Its\nname derives from its use: the gauge itself has two tests; the\ncheck involves the workpiece's having to pass one test (Go)\nand 'fail' the other (No Go).\nIt is an integral part of the quality process that is used in the\nmanufacturing industry to ensure interchangeability of parts\nbetween processes, or even between different manufacturers.\nA Go NoGo gauge is a measuring tool that does not return a\nsize in the conventional sense, but instead returns a state. The\nstate is either acceptable (the part is within tolerance and may\nbe used) or it is unacceptable (and must be rejected).\nThey are well suited for use in the production area of the factory\nas they require little skill or interpretation to use effectively and\nhave few, if any, moving parts to be damaged in the often\nhostile production environment.\n18. Probe\nA very common probe was made by soldering a hard ball to the\nend of a shaft. This was ideal for measuring a whole range of\nflat, cylindrical or spherical surfaces. Other probes were ground\nto specific shapes, for example a quadrant, to enable\nmeasurement of special features. These probes were physically\nheld against the workpiece with the position in space being read\nfrom a 3-Axis digital readout (DRO) or, in more advanced\nsystems, being logged into a computer by means of a\nfootswitch or similar device. Measurements taken by this\ncontact method were often unreliable as machines were moved\nby hand and each machine operator applied different amounts\nof pressure on the probe or adopted differing techniques for the\nmeasurement.\n\n--- PDF PAGE 58 ---\nTR Laboratory and Metrology/Calibration Services NC III Promulgated\n- 54 -\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who rendered their time and expertise to the development and validation of this Training\nRegulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nLABORATORY AND METROLOGY CALIBRATION SERVICES NC III\nAntonio A. Gimenez\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nCesar R. Leal\nPhilippine Automotive\nFederation, Inc. (PAFI)\n\nElmo N. Serbito\nPAFI (Samahan ng mga\nManggagawang Supercast)\n\nCarina J. Bondad\n(Administrative Staff)\nThe PARTICIPANTS in the National Validation of this Training Regulation\n• (Supercast Foundry &\nMachinery Corp.\nSFMC)\n\n• Philippine Aluminum Wheels\nInc. (PAWI)\n\n• Toyota Auto Parts Phils. Inc.\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
