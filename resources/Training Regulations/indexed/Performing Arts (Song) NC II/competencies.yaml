        "evidence_guide": {
          "source_text": "1.  Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate: \n1.1 \nRendered voice quality. \n1.2 \nDelivered right diction (“jicussion”). \n1.3 \nDelivered right rhythm. \n1.4 \nProjected right expression/emotion. \n1.5 \nPerformed with showmanship. \n1.6 \nListened effectively for intonation and nuance in performance. \n1.7 \nPerformed with proper or innovative integration and \nexpression.\n2.  Underpinning \nknowledge and \nattitudes \n      \n2.1 \nMusic Craft \n2.1.1 Repertoire \n2.1.2 Musical Terminology \n2.2 \nPlanning and Organization \n2.2.1 Time Frames \n2.2.2 Work Commitments \n2.3 \nPresentation and Communication \n2.3.1 Body movement and breathing \n2.3.2 Stage attire or costume \n2.3.3 Stage deportment appropriate to genre, styles and \ncontext of performance \n2.3.4 Stage performance \n2.3.5 Set of choreographed steps and movements \n2.3.6 Basic Spiels \n2.4 \nTechnology \n2.4.1 Use and maintenance of equipment \n2.4.2 Use of electronic hardware and software \n2.4.3 Music recording \n2.4.4 Special effects \n2.4.5 Basic sound system\n3.  Underpinning skills \n3.1 \nFollowing various range of techniques to achieve voice and \nstage performance. \n3.2\nDisplaying emotion, expression and gestures.\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nRelevant instruments and/or equipment \n4.2 \nOther singers/participants where practical ensemble work is \nbeing assessed \n4.3\nAppropriate venue with adequate space and acoustic qualities\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nObservance of solo performance or performance in a group. \n5.2 \nOral questioning on performance strategies\n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated solo performance setting. \n6.2 \nCompetency may be assessed in an institutions/assessment \ncenters accredited by TESDA.",
