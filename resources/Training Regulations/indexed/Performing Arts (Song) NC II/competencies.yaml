  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in PERFORMING ARTS (SONG) NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources.\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information.\n1.3\nAppropriate medium is used to transfer information and ideas.\n1.4\nAppropriate non- verbal communication is used.\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed.\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used.\n1.7\nPersonal interaction is carried out clearly and concisely.\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time.\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption.\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols.\n2.4\nWorkplace interactions are conducted in a courteous\nmanner.\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to.\n2.6\nMeetings outcomes are interpreted and implemented.\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly.\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments.\n3.3\nBasic mathematical processes are used for routine\ncalculations.\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon.\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 7 ---\nTR Performing Arts (Song) NC II\n\n- 3 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Performing Arts (Song) NC II\n\n- 4 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard format of\nthe organization.\n1.2\nAccessed information using communication equipment.\n1.3\nMade use of relevant terms as an aid to transfer information\neffectively.\n1.4\nConveyed information effectively adopting the formal or\ninformal communication.\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the individual’s work\nresponsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple written\nnotices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace measures\n3.6\nBasic mathematical processes of addition, subtraction, division\nand multiplication\n3.7\nAbility to relate to people of social range in the workplace\n3.8\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect Observation with questioning\n5.2\nOral interview and written test\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution.\n\n--- PDF PAGE 9 ---\nTR Performing Arts (Song) NC II\n\n- 5 -\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\nUNIT CODE\n:\n500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information.\n1.2\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources.\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified.\n2.2\nRoles and responsibility of other team members are identified\nand recognized.\n2.3\nReporting relationships within team and external to team are\nidentified.\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives.\n3.2\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context.\n3.3\nObserved protocols in reporting using standard operating\nprocedures.\n3.4\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Performing Arts (Song) NC II\n\n- 6 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Performing Arts (Song) NC II\n\n- 7 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity.\n1.2\nWorked effectively with others.\n1.3\nConveyed information in written or oral form.\n1.4\nSelected and used appropriate workplace language.\n1.5\nFollowed designated work plan for the job.\n1.6\nReported outcomes.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the work\nactivities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting.\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group.\n\n--- PDF PAGE 12 ---\nTR Performing Arts (Song) NC II\n\n- 8 -\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\nUNIT CODE\n:\n500311107\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession.\n1.2\nIntra and interpersonal relationships are maintained in the\ncourse of managing oneself based on performance\nevaluation.\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties.\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments.\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures.\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements.\n3.2\nRecognitions are sought/received and demonstrated as proof\nof career advancement.\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed.\n\n--- PDF PAGE 13 ---\nTR Performing Arts (Song) NC II\n\n- 9 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\nTR Performing Arts (Song) NC II\n\n- 10 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs).\n1.2\nMaintained intra - and interpersonal relationship in the course\nof managing oneself based on performance evaluation.\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries.\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 15 ---\nTR Performing Arts (Song) NC II\n\n- 11 -\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures.\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures.\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures.\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage is identified based on threshold limit\nvalues (TLV).\n2.2\nEffects of the hazards are determined.\n2.3\n OHS issues and/or concerns and identified safety hazards\nare reported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation.\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed.\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies.\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices.\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol.\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures.\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements.\n\n--- PDF PAGE 16 ---\nTR Performing Arts (Song) NC II\n\n- 12 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling designated emergency personnel\n4. Personal Protective\nEquipment\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal records 6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR Performing Arts (Song) NC II\n\n- 13 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures.\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures.\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies.\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace.\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices.\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\n Workplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 18 ---\nTR Performing Arts (Song) NC II\n\n- 14 -\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nMAINTAIN EFFECTIVE RELATIONSHIP WITH\nCLIENTS/CUSTOMERS\nUNIT CODE\n:\nHCS245201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nbuilding and maintaining effective relationship with clients,\ncustomers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a\nprofessional image\n\n1.1\nUniform and personal grooming maintained to assignment\nrequirements.\n1.2\nPersonal presence maintained according to employer\nstandards.\n1.3\nVisible work area kept tidy and uncluttered.\n1.4\nEquipment stored according to assignment requirements.\n2. Meet client/customer\nrequirements\n2.1\nClient requirements identified and understood by referral to\nthe assignment instructions.\n2.2\nClient requirements met according to the assignment\ninstructions.\n2.3\nChanges to client’s needs and requirements monitored and\nappropriate action taken.\n2.4\nAll communication with the client or customer is clear and\ncomplies with assignment requirements.\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2\nPossible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.3\nClient fully informed of all relevant security matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 19 ---\nTR Performing Arts (Song) NC II\n\n- 15 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanour\n1.5\nGrooming\n2. Employer Standards\nMay include:\n2.1 Standing Orders\n3. Client Requirements\nMay include:\n3.1\nAssignment Instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment instructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n7. Customers\nMay include:\n7.1 All members of the public\n\n--- PDF PAGE 20 ---\nTR Performing Arts (Song) NC II\n\n- 16 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image.\n1.2\nInterpreted client/customer requirements from information\ncontained in the client brief and/or assignment instructions.\n1.3\nDealt successfully with a variety of client/customer\ninteractions.\n1.4\nMonitored and acted on changing client or customer needs.\n1.5\nMet client/customer requirements.\n1.6\nBuilt credibility with customers/clients.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nUniform and personal grooming requirements of the employer\nand the client\n2.2\nOccupational health and safety requirement for the\nassignment\n2.3\nAssignment instructions\n3. Underpinning skills\n3.1\nAttention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer\nneeds\n3.4\nPunctuality\n3.5\nCustomer service\n3.6\nTelephone technique\n3.7\nProblem solving and negotiation\n3.8\nMaintaining records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment centers/venues\n4.2\nAccredited assessors\n4.3\nModes of assessment\n4.4\nEvaluation reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n\n--- PDF PAGE 21 ---\nTR Performing Arts (Song) NC II\n\n- 17 -\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit\n6.5\nContinuous assessment in the workplace, taking into account\nthe range of variables affecting performance\n6.6\nSelf-assessment on the same terms as those described above\n6.7 Simulated assessment or critical-incident assessment, provided\nthat the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria\n\n--- PDF PAGE 22 ---\nTR Performing Arts (Song) NC II\n\n- 18 -\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\nUNIT CODE\n:\nHCS245202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\neffectively managing one’s workload and quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever possible.\n1.5\nWork schedules are known and completed within agreed time\nframes.\n1.6\nWork plans developed according to assignment requirements\nand employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility for\ncompletion passed to incoming shift or other appropriate\npersons.\n2. Maintain quality of\nown performance\n2.1\nPersonal performance continually monitored against agreed\nperformance standards.\n2.2\nAdvice and guidance sought when necessary to achieve or\nmaintain agreed standards.\n2.3\nGuidance from management applied to achieve or maintain\nagreed standards.\n2.4\nStandard of work clarified and agreed according to employer\npolicy and procedures.\n3. Build credibility with\ncustomers/clients\n3.4\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.5\nPossible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.6\nClient fully informed of all relevant security matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 23 ---\nTR Performing Arts (Song) NC II\n\n- 19 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay be identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal instructions by senior officer\n1.1.3 Policy documents\n1.1.4 Duty statements\n1.1.5 Self assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1\nAssignment instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 24 ---\nTR Performing Arts (Song) NC II\n\n- 20 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload.\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements.\n1.3\nDemonstrated capacity to complete task within specified time\nframe.\n1.4\nMaintained quality of own performance.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills\n3.1\nCapacity to plan and prioritize security work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit\n6.5\nContinuous assessment in the workplace, taking into account\nthe range of variables affecting performance\n6.6\nSelf-assessment on the same terms as those described above\n6.7\nSimulated assessment or critical-incident assessment,\nprovided that the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria\n\n--- PDF PAGE 25 ---\nTR Performing Arts (Song) NC II\n\n- 21 -\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEVELOP BASIC SINGING TECHNIQUES\nUNIT CODE\n:\nHCS245301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in developing\nbasic singing techniques, particularly voice quality, diction/chords,\nrhythm/tempo, expression and showmanship.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Render voice quality\n1.1\nSong rendered must be in tune and within singer’s\ncomfortable voice range.\n1.2\nVoice/tone should be appropriate with selected repertoire.\n1.3\nRepertoire selected must be in appropriate style.\n2. Deliver right\ndiction/enunciation\n(“jicussion”)\n2.1\nSong is rendered with the right phrasing.\n2.2\nSong is rendered with the right musical diction.\n3. Deliver right\nrhythm/tempo\n3.1\nSong is rendered in accordance with the proper timing.\n3.2\nSong is rendered in accordance with the proper rhythm.\n4. Project right emotion/\nexpression\n4.1\nSong is rendered with the proper emotion and expression.\n4.2\nGestures should complement displayed emotion.\n5. Perform with\nshowmanship\n5.1\nPerformance must be rendered in accordance with the chosen\nmusical piece/arrangement genre.\n5.2\nPerformance elicited audience attention.\n5.3\nAppropriate attire worn in accordance with the motif of the\nmusical performance.\n5.4\nStage presence projected as per stage movements and in\naccordance with the musical piece.\n\n--- PDF PAGE 26 ---\nTR Performing Arts (Song) NC II\n\n- 22 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Voice/tone Quality\n1.1\nTune\n1.2\nPitch\n1.3\nTone\n1.4\nResonance\n2. Repertoire\nMay include but not limited to:\n2.1\nRock\n2.2\nBlues\n2.3\nBroadway\n2.4\nRhythm & Blues (R & B)\n2.5\nPop\n3. Style\n3.1\nOriginality\n3.2\nInnovative approaches to performance\n3.2\nMusical Nuances\n4. Musical Diction\n\n4.1\nWord-Phrase Delivery\n4.2\nWord Enunciation\n4.3\nEmotional Color\n4.4\nNuances\n4.5\nDynamics\n5. Emotion\n5.1\nLove-Longing\n5.2\nJoy-Happiness\n5.3\nGrief-Sadness\n5.4\nProtest-Rage\n5.5\nWishfullness\n6. Stage Presence\n6.1\nProjection\n6.2\nBody Movements\n6.3\nAttire\n6.4\nStage deportment appropriate to genre, styles and context of\nperformance\n6.5\nStage Presentation\n\n--- PDF PAGE 27 ---\nTR Performing Arts (Song) NC II\n\n- 23 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nRendered voice quality.\n1.2\nDelivered right diction (“jicussion”).\n1.3\nDelivered right rhythm.\n1.4\nProjected right expression/emotion.\n1.5\nPerformed with showmanship.\n1.6\nListened effectively for intonation and nuance in performance.\n1.7\nPerformed with proper or innovative integration and\nexpression.\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nMusic Craft\n2.1.1 Repertoire\n2.1.2 Musical Terminology\n2.2\nPlanning and Organization\n2.2.1 Time Frames\n2.2.2 Work Commitments\n2.3\nPresentation and Communication\n2.3.1 Body movement and breathing\n2.3.2 Stage attire or costume\n2.3.3 Stage deportment appropriate to genre, styles and\ncontext of performance\n2.3.4 Stage performance\n2.3.5 Set of choreographed steps and movements\n2.3.6 Basic Spiels\n2.4\nTechnology\n2.4.1 Use and maintenance of equipment\n2.4.2 Use of electronic hardware and software\n2.4.3 Music recording\n2.4.4 Special effects\n2.4.5 Basic sound system\n3. Underpinning skills\n3.1\nFollowing various range of techniques to achieve voice and\nstage performance.\n3.2\nDisplaying emotion, expression and gestures.\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant instruments and/or equipment\n4.2\nOther singers/participants where practical ensemble work is\nbeing assessed\n4.3\nAppropriate venue with adequate space and acoustic qualities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservance of solo performance or performance in a group.\n5.2\nOral questioning on performance strategies\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated solo performance setting.\n6.2\nCompetency may be assessed in an institutions/assessment\ncenters accredited by TESDA.\n\n--- PDF PAGE 28 ---\nTR Performing Arts (Song) NC II\n\n- 24 -\nUNIT OF COMPETENCY :\nDEMONSTRATE/EXHIBIT STAGE PERFORMANCE SKILLS\nUNIT CODE\n:\nHCS245302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ndemonstrating/exhibiting stage performance skills. It includes\nunderstanding and application of presentation and stage\ncommunication to maximize audience reception of the creative\nwork.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop stage\nperformance skills\n\n1.1\nAppropriate learning and stage experience identified as per\nstage performance requirements.\n1.2\nStrengths and weaknesses identified as per development\ngoals against planned outcomes.\n1.3\nStage image, including posture, attire/costume and make-up\nplanned in accordance with presentation requirements.\n1.4\nRehearsal, stage opportunities and private practice used as\nper planned development strategies.\n1.5\nStage discipline is maintained during performance.\n2. Apply stage\nperformance skills\n2.1\nPerform with confidence and with stage discipline avoiding\nunnecessary mannerisms, movements and reaction.\n2.2\nAppropriate eye contact established with audience.\n2.3\nAppropriate gestures applied during performance.\n2.4\nPerformance energy and flexibility maintained based on\nappropriate spontaneous or rehearsed stage movements.\n2.5\nDistractions occurring on stage responded with flexibility as\nper its occurrence.\n2.6\nPerformance harmonized in accordance with co-performers\nand musicians.\n3. Maintain stage\nperformance skills\n3.1\nOwn stage performance evaluated based on musical piece.\n3.2\nStage performance skill refined as per feedback from peers,\nleaders and relevan