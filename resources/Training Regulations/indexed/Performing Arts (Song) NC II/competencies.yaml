        "source_title": "DEVELOP BASIC SINGING TECHNIQUES",
        "source_text": "--- PDF PAGE 25 ---\nTR Performing Arts (Song) NC II \n \n- 21 - \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : \nDEVELOP BASIC SINGING TECHNIQUES \nUNIT CODE \n: \nHCS245301 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in developing \nbasic singing techniques, particularly voice quality, diction/chords, \nrhythm/tempo, expression and showmanship. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Render voice quality \n1.1 \nSong rendered must be in tune and within singer’s \ncomfortable voice range. \n1.2 \nVoice/tone should be appropriate with selected repertoire. \n1.3 \nRepertoire selected must be in appropriate style. \n2. Deliver right \ndiction/enunciation \n(“jicussion”) \n2.1 \nSong is rendered with the right phrasing. \n2.2 \nSong is rendered with the right musical diction. \n3. Deliver right \nrhythm/tempo \n3.1 \nSong is rendered in accordance with the proper timing. \n3.2 \nSong is rendered in accordance with the proper rhythm. \n4. Project right emotion/ \nexpression \n4.1 \nSong is rendered with the proper emotion and expression. \n4.2 \nGestures should complement displayed emotion. \n5. Perform with \nshowmanship \n5.1 \nPerformance must be rendered in accordance with the chosen \nmusical piece/arrangement genre. \n5.2 \nPerformance elicited audience attention. \n5.3 \nAppropriate attire worn in accordance with the motif of the \nmusical performance. \n5.4 \nStage presence projected as per stage movements and in \naccordance with the musical piece.\n\n--- PDF PAGE 26 ---\nTR Performing Arts (Song) NC II \n \n- 22 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Voice/tone Quality \n1.1 \nTune \n1.2 \nPitch \n1.3 \nTone \n1.4 \nResonance \n2. Repertoire \nMay include but not limited to: \n2.1 \nRock \n2.2 \nBlues \n2.3 \nBroadway \n2.4 \nRhythm & Blues (R & B) \n2.5 \nPop \n3. Style \n3.1 \nOriginality \n3.2 \nInnovative approaches to performance \n3.2 \nMusical Nuances \n4. Musical Diction \n      \n4.1 \nWord-Phrase Delivery \n4.2 \nWord Enunciation \n4.3 \nEmotional Color \n4.4 \nNuances \n4.5 \nDynamics \n5. Emotion \n5.1 \nLove-Longing \n5.2 \nJoy-Happiness \n5.3 \nGrief-Sadness \n5.4 \nProtest-Rage \n5.5 \nWishfullness \n6.  Stage Presence \n6.1 \nProjection \n6.2 \nBody Movements \n6.3 \nAttire \n6.4 \nStage deportment appropriate to genre, styles and context of \nperformance \n6.5 \nStage Presentation\n\n--- PDF PAGE 27 ---\nTR Performing Arts (Song) NC II \n \n- 23 - \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate: \n1.1 \nRendered voice quality. \n1.2 \nDelivered right diction (“jicussion”). \n1.3 \nDelivered right rhythm. \n1.4 \nProjected right expression/emotion. \n1.5 \nPerformed with showmanship. \n1.6 \nListened effectively for intonation and nuance in performance. \n1.7 \nPerformed with proper or innovative integration and \nexpression.\n2.  Underpinning \nknowledge and \nattitudes \n      \n2.1 \nMusic Craft \n2.1.1 Repertoire \n2.1.2 Musical Terminology \n2.2 \nPlanning and Organization \n2.2.1 Time Frames \n2.2.2 Work Commitments \n2.3 \nPresentation and Communication \n2.3.1 Body movement and breathing \n2.3.2 Stage attire or costume \n2.3.3 Stage deportment appropriate to genre, styles and \ncontext of performance \n2.3.4 Stage performance \n2.3.5 Set of choreographed steps and movements \n2.3.6 Basic Spiels \n2.4 \nTechnology \n2.4.1 Use and maintenance of equipment \n2.4.2 Use of electronic hardware and software \n2.4.3 Music recording \n2.4.4 Special effects \n2.4.5 Basic sound system\n3.  Underpinning skills \n3.1 \nFollowing various range of techniques to achieve voice and \nstage performance. \n3.2\nDisplaying emotion, expression and gestures.\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nRelevant instruments and/or equipment \n4.2 \nOther singers/participants where practical ensemble work is \nbeing assessed \n4.3\nAppropriate venue with adequate space and acoustic qualities\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nObservance of solo performance or performance in a group. \n5.2 \nOral questioning on performance strategies\n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated solo performance setting. \n6.2 \nCompetency may be assessed in an institutions/assessment \ncenters accredited by TESDA.\n",
