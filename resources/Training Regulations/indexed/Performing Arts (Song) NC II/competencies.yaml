        "source_text": "HCS245302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ndemonstrating/exhibiting stage performance skills. It includes\nunderstanding and application of presentation and stage\ncommunication to maximize audience reception of the creative\nwork.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop stage\nperformance skills\n\n1.1\nAppropriate learning and stage experience identified as per\nstage performance requirements.\n1.2\nStrengths and weaknesses identified as per development\ngoals against planned outcomes.\n1.3\nStage image, including posture, attire/costume and make-up\nplanned in accordance with presentation requirements.\n1.4\nRehearsal, stage opportunities and private practice used as\nper planned development strategies.\n1.5\nStage discipline is maintained during performance.\n2. Apply stage\nperformance skills\n2.1\nPerform with confidence and with stage discipline avoiding\nunnecessary mannerisms, movements and reaction.\n2.2\nAppropriate eye contact established with audience.\n2.3\nAppropriate gestures applied during performance.\n2.4\nPerformance energy and flexibility maintained based on\nappropriate spontaneous or rehearsed stage movements.\n2.5\nDistractions occurring on stage responded with flexibility as\nper its occurrence.\n2.6\nPerformance harmonized in accordance with co-performers\nand musicians.\n3. Maintain stage\nperformance skills\n3.1\nOwn stage performance evaluated based on musical piece.\n3.2\nStage performance skill refined as per feedback from peers,\nleaders and relevant publications.\n3.3\nPerceived problems rectified by coach, trainer and stage\ndirectors.\n\n--- PDF PAGE 29 ---\nTR Performing Arts (Song) NC II\n\n- 25 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning and Stage\n Experience\n1.1\nStrengths\n1.2\nWeaknesses\n2. Stage Image\n\n2.1\nAttire\n2.2\nMake-up\n2.3\nPosture\n2.4\nRepertoire\n3. Mannerisms\n3.1\nFidgeting\n3.2\nFacial Expressions\n3.3\nBody Movements\n4. Distractions\n\n4.1\nNoise\n4.2\nEquipment\n4.3\nAudience\n5. Stage Performance\nSkills\n5.1\nAudience Interest\n5.2\nEye Contact\n5.3\nGestures\n5.4\nBody Movements/Choreography\n5.5\nEmotions\n5.6\nFacial Expression\n\n--- PDF PAGE 30 ---\nTR Performing Arts (Song) NC II\n\n- 26 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDeveloped stage performance skills.\n1.2\nApplied stage performance skills.\n1.3\nMaintained stage performance skills.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nMusic Craft\n2.1.1 Repertoire\n2.1.2 Musical Terminology\n2.2\nPlanning and Organization\n2.2.1 Time Frames\n2.2.2 Work Commitment\n2.3\nPresentation and Communication\n2.3.1 Body movement\n2.3.2 Stage attire and costume\n2.3.3 Stage deportment appropriate to genre, styles and\ncontext of performance\n2.3.4 Stage performance\n2.3.5 Set of choreographed steps and movement\n2.3.6 Basic Spiels\n2.4\nExpression\n2.4.1 Innovative approaches in stage performance\n2.4.2 Musical nuance\n2.5\nTechnology\n2.5.1 Use and maintenance of equipment\n2.5.2 Use of electronic hardware and software\n2.5.3 Music recording\n2.5.4 Special effects\n3. Underpinning skills\n3.1\nUsing body appropriately in movement\n3.2\nWorking effectively with stage equipment\n3.3\nFollowing stage deportment appropriate to the genre, style\nand context of performance\n3.4\nDemonstrating stage presence and projection\n3.5\nEstablishing rapport\n3.6\nExhibiting sensitivity to sounds and images\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant instruments and/or equipment\n4.2\nOther relevant participants where practical ensemble work is\nbeing assessed\n4.3\nAppropriate venue with adequate space and acoustic qualities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservance of solo performance\n5.2\nOral questioning on performance strategies\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated solo performance setting.\n6.2\nCompetency may be assessed in institutions/assessment\ncenters accredited by TESDA.\n\n--- PDF PAGE 31 ---\nTR Performing Arts (Song) NC II\n\n- 27 -\nUNIT OF COMPETENCY :\nPERFORM SOLO NUMBER\nUNIT CODE\n:"
