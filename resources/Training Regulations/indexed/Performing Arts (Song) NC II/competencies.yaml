ng) NC II\n\n- 28 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Songbook\n\nMay include but not limited to:\n1.1\nRock\n1.2\nBlues\n1.3\nBroadway\n1.4\nR & B\n1.5\nPop\n1.6\nStandard\n2. Physical Preparations\n\n2.1\nRecorded or Live Accompaniments\n2.2\nSongbook\n2.4\nAttire/Costumes\n2.5\nEquipment\n2.6\nRepertoire\n3. Repertoire\nMay include but not limited to:\n3.1\nSlow\n3.2\nUpbeat\n3.3\nFast\n4. Techniques for\nOvercoming\nPerformance Anxiety\n4.1\nBreathing\n4.2\nRelaxation\n4.3\nWarm-up Exercise\n5. Types of Music\nMay include but not limited to:\n5.1\nRock\n5.2\nBlues\n5.3\nBroadway\n5.4\nR & B\n5.5\nPop\n5.6\nStandard\n6. Voice/Tonal Quality\n6.1\nVoice Quality\n6.2\nDiction/Chords Harmony\n6.3\nRhythm/Tempo\n6.4\nExpression\n7. Audience\nAppreciation\n\n7.1\nStage Performance Skills\n7.2\nSpiels\n7.3\nGimmicks and Antics\n\n--- PDF PAGE 33 ---\nTR Performing Arts (Song) NC II\n\n- 29 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed warm-up routine.\n1.3\nInterpreted songs.\n1.4\nUsed relevant musical accompaniment in performance.\n1.5\nListened to information and feedback and adjusted nuance in\nperformance.\n1.6\nInnovated interpretation and expression.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nMusic Knowledge\n2.1.1 Different types of music\n2.1.2 Information and resources to performance development\n2.1.3 Repertoire in selected area of specialization\n2.1.4 Musical terminology, systems, forms, practices,\ncustoms and musical elements\n2.1.5 Range of styles in selected area of specialization\n2.1.6 Understanding musical instrument\n2.1.7 Written music, sheet music and chord charts\n2.2\nExpression\n2.2.1 Facial Expression\n2.2.2 Vocal Expression\n2.2.3 Body Expression\n2.4 Technology\n2.4.1 Use and maintenance of equipment\n2.4.2 Use of electronic hardware and software\n2.4.3 Music recording\n2.4.4 Special effects\n3. Underpinning skills\n3.1\