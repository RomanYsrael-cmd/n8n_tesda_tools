        "source_title": "PERFORM SOLO NUMBER",
        "source_text": "--- PDF PAGE 31 ---\nTR Performing Arts (Song) NC II \n \n- 27 - \nUNIT OF COMPETENCY : \nPERFORM SOLO NUMBER \nUNIT CODE \n: \nHCS245303 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes of  technical, \nexpressive communication and stage skills required to perform for \nan audience as a soloist. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare for rehearsal \n \n1.1 \nRecorded/live accompaniments checked as per standard \noperating procedures. \n1.2 \nCompleteness of songbook checked as per songbook \npagination. \n1.3 \nPhysical preparations prior to singing undertaken in \naccordance with repertoire. \n1.4 \nRecorded practices reviewed as per SOPs . \n2. Perform warm-up \nroutine \n2.1 \nVocal exercises performed in accordance with genre of the \nsong. \n2.2 \nMusic fully rehearsed in accordance with required \nperformance standard. \n2.3 \nPerformance rendered with confidence and  in accordance \nwith techniques for overcoming performance anxieties. \n3. Interpret songs \n3.1 \nDifferent types of music interpreted in accordance with \npresentation requirements. \n3.2 \nVoice/tone harmonized with the selected repertoire. \n3.3 \nSong rendered must be in accordance with the require \nvoice/tonal quality and stage performance. \n3.4 \nAudience appreciation is maintained in accordance with \npresentation requirements.\n\n--- PDF PAGE 32 ---\nTR Performing Arts (Song) NC II \n \n- 28 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Songbook \n        \nMay include but not limited to: \n1.1 \nRock \n1.2 \nBlues \n1.3 \nBroadway \n1.4 \nR & B \n1.5 \nPop \n1.6 \nStandard \n2. Physical Preparations\n  \n2.1 \nRecorded or Live Accompaniments \n2.2 \nSongbook \n2.4 \nAttire/Costumes \n2.5 \nEquipment \n2.6 \nRepertoire \n3. Repertoire \nMay include but not limited to: \n3.1 \nSlow \n3.2 \nUpbeat \n3.3 \nFast \n4. Techniques for \nOvercoming \nPerformance Anxiety \n4.1 \nBreathing \n4.2 \nRelaxation \n4.3 \nWarm-up Exercise \n5. Types of Music \nMay include but not limited to: \n5.1 \nRock \n5.2 \nBlues \n5.3 \nBroadway \n5.4 \nR & B \n5.5 \nPop \n5.6 \nStandard \n6. Voice/Tonal Quality \n6.1 \nVoice Quality \n6.2 \nDiction/Chords Harmony \n6.3 \nRhythm/Tempo \n6.4 \nExpression \n7. Audience \nAppreciation \n      \n7.1 \nStage Performance Skills \n7.2 \nSpiels \n7.3 \nGimmicks and Antics\n\n--- PDF PAGE 33 ---\nTR Performing Arts (Song) NC II \n \n- 29 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate:  \n1.1 \nPrepared for performance. \n1.2 \nPerformed warm-up routine. \n1.3 \nInterpreted songs. \n1.4 \nUsed relevant musical accompaniment in performance. \n1.5 \nListened to information and feedback and adjusted nuance in \nperformance. \n1.6\nInnovated interpretation and expression.\n2. Underpinning \nknowledge and \nattitudes \n2.1 \nMusic Knowledge \n2.1.1 Different types of music \n2.1.2 Information and resources to performance development\n2.1.3 Repertoire in selected area of specialization \n2.1.4 Musical terminology, systems, forms, practices, \ncustoms and musical elements \n2.1.5 Range of styles in selected area of specialization \n2.1.6 Understanding musical instrument \n2.1.7 Written music, sheet music and chord charts \n2.2 \nExpression \n2.2.1 Facial Expression \n2.2.2 Vocal Expression \n2.2.3 Body Expression \n2.4    Technology \n2.4.1 Use and maintenance of equipment \n2.4.2 Use of electronic hardware and software \n2.4.3 Music recording \n2.4.4 Special effects\n3. Underpinning skills \n3.1 \nPitch finding ability \n3.2 \nUsing appropriate rhythms, time signatures, beat patterns and \nrhythmic styles \n3.3 \nInterpreting songs \n3.4\nMaintaining stage presence and rapport with audience\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nRelevant instruments and/or equipment \n4.2\nAppropriate venue with adequate space and acoustic qualities\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nObservance of solo performance \n5.2\nOral questioning on performance strategies\n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated solo performance setting. \n6.2 \nCompetency may be assessed in institutions/assessment \ncenters accredited by TESDA.\n",
