monized as per selected repertoire.\n3.5\nSong delivered in accordance with performance standards\nwith other members.\n3.6\nPerformance must be in accordance with the arranged piece\nwith proper timing and song delivery.\n3.7\nAppropriate attire worn in accordance with motif of the musical\npiece.\n4. Interact with\nperformers in the\ngroup\n4.1\nRendered performance in accordance with performance\nrequirements.\n4.2\nEffectively collaborated with other performers and adapted\nown part to particular methods and style as per musical piece.\n4.3\nConduct, appearance and cues are taken in accordance with\nmusical piece.\n\n--- PDF PAGE 35 ---\nTR Performing Arts (Song) NC II\n\n- 31 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Repertoire\n\n1.1\nSlow\n1.2\nUpbeat\n1.3\nFast\n2. Physical Preparations\n\nMay include but not limited to:\n2.1\nLive or recorded musical accompaniments\n2.2\nAttire/Costume\n2.4\nEquipment\n2.5\nRepertoire\n2.6\nSong Book\n3. Techniques for\nOvercoming\nPerformance Anxiety\n3.1\nBreathing\n3.2\nRelaxation\n3.3\nWarm-up Exercise\n4. Vocal Exercise\n4.1\nProgression\n4.2\nPitch\n5. Types of Music\nMay include but not limited to:\n5.1\nRock\n5.2\nBlues\n5.3\nBroadway\n5.4\nR & B\n5.5\nPop\n5.6\nStandard\n6. Audience\nAppreciation\n6.1\nStage Performance Skills\n6.2\nRapport with audience\n7. Song Delivery\n7.1\nVoice/Tone Quality\n7.2\nDiction/Enunciation\n7.3\nRhythm/Tempo\n7.4\nExpression\n7.5\nChords/Vocal Harmony\n\n--- PDF PAGE 36 ---\nTR Performing Arts (Song) NC II\n\n- 32 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed warm-up routine.\n1.3\nPerformed vocals.\n1.4\nInteracted with performers in the group.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Music Knowledge\n2.1.1 Different types of music\n2.1.2 Information and resources to performance development\n2.1.3 Repertoire in selected area of specialization\n2.1.4 Musical terminol