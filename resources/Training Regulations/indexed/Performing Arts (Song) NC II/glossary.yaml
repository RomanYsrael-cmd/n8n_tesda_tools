      "definition": "Basic Spiels – brief and concise remark in a show or program to arouse audience interest and mood. 2. Chords – three or more musical tones sounded simultaneously. 3. Diction – pronunciation and enunciation of words in singing. 4. Dynamics – contrast and variation of face and intensity. 5. Enunciation – is the expression of words and phrases with utmost clarity, emphasis and feeling to convey a message. 6. Expression – an act, process, or instance of representing in a medium (as words). 7. Gesture – a movement usually of the body or limbs that expresses or emphasizes an idea, sentiment or attitude or use of motives of the limbs or body as a means of expression. 8. Interact – to act upon another. 9. Interpret – to represent by means of art; bring to realization by performance or direction. 10. Mannerism – exaggerated or affected adherence to a particular style or manner. 11. Motif – a single or repeated design or color. 12. Music – the science or art of ordering tones or sounds in succession, in combination and in temporal relationships to produce a composition having unity and continuity. 13. Musical Instrument – a device used to produce music. 14. Musician – a composer, conductor or performer of music. 15. Repertoire – a list or supply of dramas, operas, pieces or parts that a company or person is prepared to perform. 16. Rehearsal – a private performance or practice session preparatory to a public appearance or a practice exercise. 17. Showmanship – an individual having a sense or knack for dramatically effective presentation. 18. Sing – to produce musical tones by means of the voice. 19. Singer – one that sings. 20. Solo – a musical composition for a single voice or instrument with or without accompaniment. 21. Song – a short musical composition of words and music. 22. Stage – is the proper conduct on stage. 23. Stage Discipline – is the ability to project a confident performance by eliminating mannerisms, unnecessary movements and reaction."
