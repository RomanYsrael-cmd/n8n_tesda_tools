  "source_text": "1.\nBasic Spiels – brief and concise remark in a show or program to arouse audience interest\nand mood.\n2.\nChords – three or more musical tones sounded simultaneously.\n3.\nDiction – pronunciation and enunciation of words in singing.\n4.\nDynamics – contrast and variation of face and intensity.\n5.\nEnunciation – is the expression of words and phrases with utmost clarity, emphasis and\nfeeling to convey a message.\n6.\nExpression – an act, process, or instance of representing in a medium (as words).\n7.\nGesture – a movement usually of the body or limbs that expresses or emphasizes an idea,\nsentiment or attitude or use of motives of the limbs or body as a means of expression.\n8.\nInteract – to act upon another.\n9.\nInterpret – to represent by means of art; bring to realization by performance or direction.\n10. Mannerism – exaggerated or affected adherence to a particular style or manner.\n11. Motif – a single or repeated design or color.\n12. Music – the science or art of ordering tones or sounds in succession, in combination and in\ntemporal relationships to produce a composition having unity and continuity.\n13. Musical Instrument – a device used to produce music.\n14. Musician – a composer, conductor or performer of music.\n15. Repertoire – a list or supply of dramas, operas, pieces or parts that a company or person is\nprepared to perform.\n16. Rehearsal – a private performance or practice session preparatory to a public appearance or\na practice exercise.\n17. Showmanship – an individual having a sense or knack for dramatically effective\npresentation.\n18. Sing – to produce musical tones by means of the voice.\n19. Singer – one that sings.\n20. Solo – a musical composition for a single voice or instrument with or without accompaniment.\n21. Song – a short musical composition of words and music.\n22. Stage – is the proper conduct on stage.\n23. Stage Discipline – is the ability to project a confident performance by eliminating\nmannerisms, unnecessary movements and reaction.\n\n--- PDF PAGE 46 ---\nTR Performing Arts (Song) NC II\n\n- 5 -\n24. Stage Performance Skills – is the visual act of using the body to interpret a particular song\nin cooperation with the available technical resources.\n25. Tempo – the rate of speed of a musical piece or passage indicated by one of a series of\ndirections (as largo, presto, or allegro) and often by an exact metronome marking.\n26. Tone – vocal or musical sound of a specific quality; musical sound with respect to timbre and\nmanner of expression.\n27. Tune – quality of sound.\n28. Vocal Exercises – any exercise that enhances one’s voice.\n29. Voice – musical sound produced by the vocal folds and resonated by the cavities of head\nand throat.\n\n--- PDF PAGE 47 ---",
