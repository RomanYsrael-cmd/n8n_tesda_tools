    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for PERFORMING ARTS (SONG) NC II qualifications.\n\nThis includes information on curriculum design, training delivery, trainee entry requirements,\ntools and equipment, training facilities and trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PERFORMING ARTS (SONG)\nNC Level: NC II\n\nNominal Training Duration: 271 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of singers in singing in\naccordance with industry standards. It covers the basic, common and core competencies in\ndevelop basic singing techniques, demonstrate/exhibit stagecraft skills, perform solo number,\nprovide lead vocal for a group performance/band, perform back-up vocal for a group\nperformance/band and perform musical number as a soloist.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 38 ---\nTR Performing Arts (Song) NC II\n\n- 34 -\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/customers\n3.1\nMaintain a professional image\n3.2\nMeet client/customer\nrequirements\n3.3\nBuild credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n2. Manage own\nperformance\n4.1\nIdentify tasks accurately\n4.2\nAllocate priority to each task\n4.3\nAllocate time lines to each\ntask\n4.4\nMeet and comply deadlines\n4.5\nKnow and comply deadlines\n4.6\nDevelop work plans\n4.7\nMonitor personal performance\n4.8\nGet advice and guidance\n4.9\nApply guidance from\nmanagement\n4.10 Clarify standard of work\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n--- PDF PAGE 39 ---\nTR Performing Arts (Song) NC II\n\n- 35 -\nCORE COMPETENCIES\n(235 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop basic\nsinging\ntechniques\n1.1 Demonstrate techniques and\nquality of execution/delivery\nincluding voice quality, tonal\nquality, harmony, timing and\ncoordination\n1.2 Vocal exercise according to\ngenre of a particular song\n1.3 Understanding musical\nterminology\n1.4 Verbalize understanding of\nnature and type of\nsong/music\n• Lecture\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n2. Demonstrate/\nexhibit stage\nperformance\nskills\n2.1 Verbalize understanding of\nbody structure and\nmechanics\n2.2 Demonstrate body\nmovement\n2.3 Demonstrate familiarization\non the different parts and\nset-up of the stage and stage\noperations\n• Lecture\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n3. Perform solo\nnumber\n3.1 Check recorded/live musical\naccomplishment\n3.2 Check completeness of\nsongbook\n3.3 Check physical preparations\n3.4 Review recorded practices\n3.5 Verbalize understanding the\nsolo and ensemble stage\ndeportment, repertoire and\nmusical scales and chords\n3.6 Demonstrate voice quality\nand singing to the rhythm\nand tempo\n3.7 Demonstrate singing in the\nset of dictated tempo\n3.8 Demonstrate singing of song\npiece in time and tune of the\nbeat\n3.9 Demonstrate projecting right\nexpression and delivery or\nshowmanship\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 40 ---\nTR Performing Arts (Song) NC II\n\n- 36 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Provide lead\nvocal for a group\nperformance/\nband\n4.1 Check repertoire and\nsongbook\n4.2 Prepare for performance\n4.3 Perform warm-up routine\n4.4 Verbalize the mechanics and\nprocedures of stage\nperformance\n4.5 Demonstrate delivering right\nphrasing of a song number\n4.6 Demonstrate delivering\nproper pronunciation of\nwords in the song\n4.7 Demonstrate delivering\nproper accents of the\nmusical arrangements\n4.8 Demonstrate techniques and\nprojection\n4.9 Demonstrate chords\nharmony and beat pattern\n4.10 Demonstrate showmanship,\ngrace and visual appeal\n4.11 Demonstrate finishing phrase\nof song in tune/time\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n--- PDF PAGE 41 ---\nTR Performing Arts (Song) NC II\n\n- 37 -\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the following\nrequirements:\n\n• Must be literate (knows how to read and write;\n• Must be physically and mentally healthy;\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nPERFORMING ARTS (SONG) NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees for Performing Arts (Song) NC II are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n1 unit\nExecutive Table\n1 lot\nAV Equipment\n5 units\nMake-up Kit\n25 pcs.\nArmed Chairs\n1 lot\nSound System\n1 box\nCDs/VCDs\n1 pc.\nClerical Table\n1 unit\nCassette Player\n1 box\nCassette Tapes\n1 pc.\nWhiteboard\n1 unit\nComputer with Printer\n25 pcs.\nNumbers\n1 pc.\nBlackboard\n\nAirconditioning Units\nStage Props\n1 unit\nMonitor/Television Set\n\n1 lot\nCommon Musical\nInstruments (e.g.\nguitar-acoustic/electric,\norgan, piano\n\n1 pc.\nMicrophone\n2 pcs.\nSpeakers\n\n--- PDF PAGE 42 ---\nTR Performing Arts (Song) NC II\n\n- 1 -\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\nStudent/Trainee Performance Space\n3x 5 m.\n15 sq. m.\nLearning Resource Center\n1 x 5 m.\n5 sq. m.\nCirculation Area\n(S/TPS+LRC+DR+CRX\n30%)\n(15+5+15+10=45x30%\n=13.5)\n\n13.5 sq. m.\nSeparate Dressing Rooms for Male and Female\nTrainees/Students\n3 x 5 m.\n15 sq. m.\nSeparate Restrooms for Male and Female\nTrainees/Students\n2 x 5 m.\n10 sq. m.\n\nTotal Workshop\nArea\n58.5 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR SERVICES SECTOR\nPERFORMING ARTS (SONG) NC II\n\nTRAINER QUALIFICATION (TQ II)\n\n• Must have at least one (1) year teaching experience\n• Must have attended Trainers Training Methodology Course (TTMC)/TM II or equivalent\ncourse/portfolio evidence covering TM II competencies\n• Must have had at least two (2) years exposure in the entertainment industry\n• Must be physically and mentally fit\n• Must have good moral character\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 43 ---\nTR Performing Arts (Song) NC II\n\n- 2 -"
