    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: PERFORMING ARTS (SONG)\nNC Level: NC II\n\nNominal Training Duration: 271 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of singers in singing in\naccordance with industry standards. It covers the basic, common and core competencies in\ndevelop basic singing techniques, demonstrate/exhibit stagecraft skills, perform solo number,\nprovide lead vocal for a group performance/band, perform back-up vocal for a group\nperformance/band and perform musical number as a soloist.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 38 ---\nTR Performing Arts (Song) NC II\n\n- 34 -\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/customers\n3.1\nMaintain a professional image\n3.2\nMeet client/customer\nrequirements\n3.3\nBuild credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n2. Manage own\nperformance\n4.1\nIdentify tasks accurately\n4.2\nAllocate priority to each task\n4.3\nAllocate time lines to each\ntask\n4.4\nMeet and comply deadlines\n4.5\nKnow and comply deadlines\n4.6\nDevelop work plans\n4.7\nMonitor personal performance\n4.8\nGet advice and guidance\n4.9\nApply guidance from\nmanagement\n4.10 Clarify standard of work\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n--- PDF PAGE 39 ---\nTR Performing Arts (Song) NC II\n\n- 35 -\nCORE COMPETENCIES\n(235 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop basic\nsinging\ntechniques\n1.1 Demonstrate techniques and\nquality of execution/delivery\nincluding voice quality, tonal\nquality, harmony, timing and\ncoordination\n1.2 Vocal exercise according to\ngenre of a particular song\n1.3 Understanding musical\nterminology\n1.4 Verbalize understanding of\nnature and type of\nsong/music\n• Lecture\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n2. Demonstrate/\nexhibit stage\nperformance\nskills\n2.1 Verbalize understanding of\nbody structure and\nmechanics\n2.2 Demonstrate body\nmovement\n2.3 Demonstrate familiarization\non the different parts and\nset-up of the stage and stage\noperations\n• Lecture\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n3. Perform solo\nnumber\n3.1 Check recorded/live musical\naccomplishment\n3.2 Check completeness of\nsongbook\n3.3 Check physical preparations\n3.4 Review recorded practices\n3.5 Verbalize understanding the\nsolo and ensemble stage\ndeportment, repertoire and\nmusical scales and chords\n3.6 Demonstrate voice quality\nand singing to the rhythm\nand tempo\n3.7 Demonstrate singing in the\nset of dictated tempo\n3.8 Demonstrate singing of song\npiece in time and tune of the\nbeat\n3.9 Demonstrate projecting right\nexpression and delivery or\nshowmanship\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 40 ---\nTR Performing Arts (Song) NC II\n\n- 36 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Provide lead\nvocal for a group\nperformance/\nband\n4.1 Check repertoire and\nsongbook\n4.2 Prepare for performance\n4.3 Perform warm-up routine\n4.4 Verbalize the mechanics and\nprocedures of stage\nperformance\n4.5 Demonstrate delivering right\nphrasing of a song number\n4.6 Demonstrate delivering\nproper pronunciation of\nwords in the song\n4.7 Demonstrate delivering\nproper accents of the\nmusical arrangements\n4.8 Demonstrate techniques and\nprojection\n4.9 Demonstrate chords\nharmony and beat pattern\n4.10 Demonstrate showmanship,\ngrace and visual appeal\n4.11 Demonstrate finishing phrase\nof song in tune/time\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation"
