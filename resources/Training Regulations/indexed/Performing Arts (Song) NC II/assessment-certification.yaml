  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To be certified in this Qualification of Performing Arts (Song) NC II, the candidate must\ndemonstrate competence through project-type assessment covering all the units listed in\nSection 1. Successful candidates shall be awarded a National Certificate II signed by the\nTESDA Director General.\n\n4.2 The following are qualified to apply for assessment and certification:\n\n4.2.1 Graduates of formal, non-formal and informal including enterprise-based\n\ntraining programs\n\n4.2.2 Experienced Workers (wage employed or self-employed)\n\n4.3 Reassessment is allowed only after one month from the date of assessment. Reassessment\nfor a National Certificate shall be done only on the task/s that the candidate did not\nsuccessfully achieve.\n\n4.4 A candidate who fails the assessment for two (2) consecutive times will be required to go\nthrough a refresher course before taking another assessment.\n\n4.5 Only certified individuals in this Qualification may be nominated by the industry for\naccreditation as competency assessor.\n\n4.6 Only accredited competency assessors are allowed to conduct competency assessment,\nhowever, trainers who are accredited competency assessors are not allowed to assess their\ntrainees.\n\n4.7 Assessment of competence must be undertaken only in the TESDA accredited assessment\ncenter. The performance assessment (demonstration of competence), however, may be done\nin any venue or workplace duly designated by an accredited assessment center.\n\n4.8 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification.\n\n--- PDF PAGE 44 ---\nTR Performing Arts (Song) NC II\n\n- 3 -\nANNEX A\n\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nCOMPETENCY MAP\nPERFORMING ARTS (SONG) NC II\nDevelop basic\nsinging\ntechniques\nDemonstrate/exhibit\nstage performance\nskills\nParticipate in\nworkplace\ncommunication\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nPerform solo\nnumber\nProvide lead vocal for\na group\nperformance/band\nWork in a team\nenvironment\nMaintain an effective\nrelationship with\nclients/customers\nManage own\nperformance\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nCOMPETENCY MAP\nPERFORMING ARTS (SONG) NC II\nDevelop basic\nsinging\ntechniques\nDemonstrate/exhibit\nstage performance\nskills\nParticipate in\nworkplace\ncommunication\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nPerform solo\nnumber\nProvide lead vocal for\na group\nperformance/band\nWork in a team\nenvironment\nMaintain an effective\nrelationship with\nclients/customers\nManage own\nperformance\n\n--- PDF PAGE 45 ---\nTR Performing Arts (Song) NC II\n\n- 4 -\nDEFINITION OF TERMS\n\n1.\nBasic Spiels – brief and concise remark in a show or program to arouse audience interest\nand mood.\n2.\nChords – three or more musical tones sounded simultaneously.\n3.\nDiction – pronunciation and enunciation of words in singing.\n4.\nDynamics – contrast and variation of face and intensity.\n5.\nEnunciation – is the expression of words and phrases with utmost clarity, emphasis and\nfeeling to convey a message.\n6.\nExpression – an act, process, or instance of representing in a medium (as words).\n7.\nGesture – a movement usually of the body or limbs that expresses or emphasizes an idea,\nsentiment or attitude or use of motives of the limbs or body as a means of expression.\n8.\nInteract – to act upon another.\n9.\nInterpret – to represent by means of art; bring to realization by performance or direction.\n10. Mannerism – exaggerated or affected adherence to a particular style or manner.\n11. Motif – a single or repeated design or color.\n12. Music – the science or art of ordering tones or sounds in succession, in combination and in\ntemporal relationships to produce a composition having unity and continuity.\n13. Musical Instrument – a device used to produce music.\n14. Musician – a composer, conductor or performer of music.\n15. Repertoire – a list or supply of dramas, operas, pieces or parts that a company or person is\nprepared to perform.\n16. Rehearsal – a private performance or practice session preparatory to a public appearance or\na practice exercise.\n17. Showmanship – an individual having a sense or knack for dramatically effective\npresentation.\n18. Sing – to produce musical tones by means of the voice.\n19. Singer – one that sings.\n20. Solo – a musical composition for a single voice or instrument with or without accompaniment.\n21. Song – a short musical composition of words and music.\n22. Stage – is the proper conduct on stage.\n23. Stage Discipline – is the ability to project a confident performance by eliminating\nmannerisms, unnecessary movements and reaction.\n\n--- PDF PAGE 46 ---\nTR Performing Arts (Song) NC II\n\n- 5 -\n24. Stage Performance Skills – is the visual act of using the body to interpret a particular song\nin cooperation with the available technical resources.\n25. Tempo – the rate of speed of a musical piece or passage indicated by one of a series of\ndirections (as largo, presto, or allegro) and often by an exact metronome marking.\n26. Tone – vocal or musical sound of a specific quality; musical sound with respect to timbre and\nmanner of expression.\n27. Tune – quality of sound.\n28. Vocal Exercises – any exercise that enhances one’s voice.\n29. Voice – musical sound produced by the vocal folds and resonated by the cavities of head\nand throat.\n\n--- PDF PAGE 47 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who rendered their time and expertise to the development and validation of these\nTraining Regulations.\n\nMR. BUTCH ALBARRACIN\nFounder and CEO\nThe Center for Pop Music Philippines, Inc.\n73 Ermin Garcia Street, Cubao\nQuezon City\n\nMS. NIKKI ROSS\nProfessional International Artist\nC/o Performing Arts Center\n843 Laurel Street\nMandaluyong City\nMS. GWEN ALBARRACIN\nExecutive Vice President\nThe Center for Pop Music Philippines, Inc.\n73 Ermin Garcia Street, Cubao\nQuezon City\nMR. LEO T. LAFORTEZA\nThe Philippine Association of Recruitment\nAgencies Deploying Artist, Inc. (PARADA)\nG2 Gochangco Building, 610 T.M. Kalaw St.\nErmita, Manila\n\nMS. ROWENA T. LAURON\nHead, Training Department\nThe Center for Pop Music Philippines, Inc.\n73 Ermin Garcia Street, Cubao\nQuezon City\nMR. ELMAR B. INGLA\nOrganisasyon ng Pilipinong Mang-aawit (OPM)\nSuite 24 PB Eisenhower Street\nGreenhills, San Juan\nMetro Manila\n\nMS. ELLA M. IGDALINO\nExecutive Manager (Accounting)/Venue Manager\nThe Center for Pop Music Philippines, Inc.\n73 Ermin Garcia Street, Cubao\nQuezon City\nMS. CHRISTINE G. BUAN\nPresident\nConfederation Association of Licensed\nEntertainment Agencies (CALEA)\n9760 Felicidad Street\nGAT Mendoza Housing Avenue\nParanaque City\n\nMS. JANET B. TORRIBIO\nTraining Director\nTenaj Internationale Learning Centre, Inc.\n2334 Guijo Street\nUnited Hills Village\nParanaque City\nMS. PRISCILLA S. CARO\nPresident\nConfederation of Artist Managers, Developers\nAnd Training Centers, Inc. (CAMDA) and CIFOI,\nInc.\n#2 Senatorial Drive\ncor. March St. Congressional Village 3 Project 8\nQuezon City\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n--- PDF PAGE 48 ---\nList of Published Training Regulations\n\n\nAnimal Production NC II\n\nAquaculture NC II\n\nAutomotive Body Painting/Finishing NC II\n\nAutomotive Body Repair NC II\n\nAutomotive Engine Rebuilding NC II\n\nAutomotive Servicing NC II\n\nBartending NC II\n\nBeauty Care NC II\n\nBeauty Care NC III\n\nBuilding Wiring Installation NC II\n\nCarpentry NC II\n\nCommercial Cooking NC II\n\n