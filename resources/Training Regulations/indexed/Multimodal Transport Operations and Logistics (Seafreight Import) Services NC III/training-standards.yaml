      "source_text": "3.2 TRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb.\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n1.\nThe competency – based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or\ncombination with other modalities when designing and delivering training\nprograms:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe DTS Law and the TESDA Guidelines on the DTP;\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n--- PDF PAGE 134 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n130\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship – is based on training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – short term programs conducted by Non-\nGovernment Organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in informal\nsettings such as barangay hall, basketball courts, etc. These\nprograms can also be Mobile Training Programs (MTP)."
    },
