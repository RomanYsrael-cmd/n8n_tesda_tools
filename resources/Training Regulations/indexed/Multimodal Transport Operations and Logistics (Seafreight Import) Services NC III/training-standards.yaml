  "source_section_text": "SECTION 3 TRAINING ARRANGEMENT\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT\nIMPORT)\nSERVICES NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and institutional\nassessment.\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language,\nenvironment and other academic subjects shall be contextualized. To this end, TVET providers\nshall develop a Contextual Learning Matrix (CLM) to include Technology, Science, Math,\nEnglish/Communication and Safety to Environment. Includes also green technology, issues on\nhealth and drugs and cater to person with disabilities (PWD’s)\nCourse Title: MULTIMODAL TRANSPORT OPERATION NC Level: NC III\n AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES\n\nNominal Training Duration:\n\nNo. of Hours\nCoverage\n40 Hrs. Basic Competencies\n48 Hrs. Common Competencies\n65 Hrs. Core Competencies\n153 Hrs.\n108 Hrs.\n261 Hrs.\n\nSIL\nTotal\n\n--- PDF PAGE 96 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n92\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in providing transport information to customers, promoting and developing\nservices to customers, evaluating and confirming customer freight transport requirements and\nmonitoring and coordinating transport execution and documentation. This include classroom\nlearning activities and practical work in actual work site or simulation area.\n\n The training institution has the option to introduce other methodologies to deliver the\nprogram or the course and to partner with other individuals/organizations that would be able to\nprovide training resources in the conduct of the course.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 97 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n93\nBASIC COMPETENCIES – NATIONAL CERTIFICATE NC III\n(40 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace\nprocesses\n\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Lecture\n• Demonstration\n• Practical exercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n\n1.2 Lead workplace\ndiscussions\n• Describe:\no Organizational policy on\nproduction, quality and safety\no Goals/ objectives and action plan\nsetting\n• Read\no Effective verbal communication\nmethods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and\ncommunicate\nissues arising in the\nworkplace\n• Describe:\no Organizational policy in dealing\nwith issues and problems\n\n• Group discussion\n• Lecture\n• Oral evaluation\n• Written Test\n2