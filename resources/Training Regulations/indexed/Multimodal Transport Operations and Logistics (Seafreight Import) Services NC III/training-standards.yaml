ribe basic ergonomics of\nkeyboard and computer use\n• Group discussion\n• Oral evaluation\n\n• Read:\no Main types of computers and\nbasic features of different\noperating systems\n• Self-learning\n• Written Test\n\no Main parts of a computer\n\no Storage devices and basic\ncategories of memory\n\n• Identify relevant types of\nsoftware\n• Lecture\n• Written\nexamination\n\n• Demonstrate ability to:\no select appropriate hardware\nand software according to\ntask assigned and required\noutcome\n• Demonstration\n• Observation\n\n• Read and interpret work\ninstruction\n• Self-learning\n• Written Test\n\n• Practice communication skills\n• Demonstration\n• Observation\n\n5.2 Input data into\ncomputer\n• Describe:\no Method of entering data into\nthe computer using\nappropriate\nprogram/application in\naccordance with company\nprocedures\n• Group discussion\n• Oral evaluation\n1 hour\n\n--- PDF PAGE 125 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n121\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\no Technique of performing\nwork within ergonomic\nguidelines\n\n• Identify means of storing\ninputted data in storage media\naccording to requirements\n• Lecture\n• Written\nexamination\n\n• Practice checking and saving\ninformation following standard\noperating procedures\n• Demonstration\n• Observation\n\n• Read general security viruses\n• Self-learning\n• Written Test\n\n• Practice calculating computer\ncapacity\n• Demonstration\n• Observation\n\n• Practice OH & S principles\nand responsibilities\n• Demonstration\n• Observation\n\n• Perform work within ergonomic\nguidelines\n• Demonstration\n• Observation\n\n• Demonstrate ability to:\no Store inputted data in\nstorage media according\nto requirements\no Enter data into the\ncomputer and;\no Select application program\nin accordance with\ncompany procedures\n\n• Demonstration\n• Observation\n\n--- PDF PAGE 126 ---\nMTOL SERVICES NC III\nPromulgate