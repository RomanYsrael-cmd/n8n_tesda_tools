oretical\nmodel of behavior change)\n• Demonstrate collaboration and\nnetworking skills\n\n• Show basic skills in research\n• Generate practical insights on\ncontinuous improvement\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 106 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n102\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6. Use information\nsystematically\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\n- Application in collating information\n- Procedures for inputting,\nmaintaining and archiving\ninformation\n- Guidance to people who need to\nfind and use information\n• Organizing information into a suitable\nform for reference and use\n• Classify stored information for\nidentification and retrieval\n• Operate the technical information\nsystem by using agreed procedures\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 Hours\n\n6.2 Apply information\ntechnology\n• Lecture and discussion on:\n- Attributes and limitations of\navailable software tool\n- Procedures and work instructions\nfor the use of IT\n- Operational requirements for IT\nsystems\n- Sources and flow paths of data\n- Security systems and measures\nthat can be used\n- Methods of entering and\nprocessing information\n• Use procedures and work instructions\nfor the use of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group Discussion\n• Self-paced\nhandout/ module\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n---