eedings of\nthe planning strategies and its\nactual application within the\nworkplace.\n• Lecture\n• Group\ndiscussion\n• Role play\n• Demonstration\nwith questioning\n• Interview\n• Written exam\n10 hours\n3.2 Assess operations\nto meet customer’s\ntransport requirements\n\n• Discuss and explain strategies\n• Test the strategies if it is\nworkable or not. If yes,\nimprove it further. If no, modify\nor delete the planned\nstrategies.\n• Lecture\n• Group\ndiscussion\n• Role play\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n• Written exam\n5 hours\n3.3 Confirm\nagreement on\ncustomer’s transport\nrequirements\n\n• Discuss and explain mentoring\nof staffs\n• Discuss and explain\ndocumentation and reporting\n• Lecture\n• Demonstration\n• Group\ndiscussion\n• Experiential\nlearning\n• Demonstration\nwith questioning\n\n--- PDF PAGE 131 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n127\n\n• Mentor the staff properly until\nsaid instructions from\nmanagement is completely\nunderstood and compliant in\naccordance with standards.\n• Report the activity to higher\nmanagement\n• Interview\n• Written exam\n\n• Discuss and explain data\ngathering\n• Discuss and explain budgets\nand targets set-up\nGather all data in relation to\nsetting up of budgets and targets\nfor the department.\n• Lecture\n• Demonstration\n• Case study\n•\n• Written exam\n\n• Discuss and explain evaluation\nof data\n• Evaluate and study all data for\nthe whole year and make\ncomparison with the previous\nyears.\n• Lecture\n• Case study\n•\n• Written exam\n\n--- PDF PAGE 132 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n128\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Monitor and\ncoordinate\ntransport\nexecution and\ndocumentation\n4.1 Coordinate\nexecution of\ntransport plan\n• Read and interpret information\nrepresented in symbols, diagrams\nand pictorial representations\n\n• Self-learning\n• Lecture\n• Written Test\n• Case studies\n12 hours\n\n5. Monitor and\ncoordinate\ntransport\nexecution and\ndocumentation\n5.1 Coordinate\nexecution of\ntransport plan\n• Read and interpret information\nrepresented in symbols, diagrams\nand pictorial representations\n\n• Self-learning\n• Lecture\n• Written Test\n• Case studies\n\n4 hours\n5.2 Monitor\ntransport status of\ncargo\n• Identify methods in interpreting,\nrecognizing and representing,\nInformation in symbols, diagrams\nand pictorial representations\n• Lecture\n• Written\nexamination\n• Oral\nexamination\n\n5.3 Report cargo\ntransport status\n•\nDiscuss and explain business\nprocesses\n•\nDemonstrate implementation of\nbusiness process\n• Lecture\n• Demonstration\n• Video\npresentation\n• Group\ndiscussion\n\n• Experiential\nlearning\n• Demonstration\nwith\nquestioning\n• Interview\n• Written\nExamination\n\n2 hours\n\n--- PDF PAGE 133 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n129\n3.2 TRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb.\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n1.\nThe competency – based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or\ncombination with other modalities when designing and delivering training\nprograms:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe DTS Law and the TESDA Guidelines on the DTP;\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n--- PDF PAGE 134 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n130\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship – is based on training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – short term programs conducted by Non-\nGovernment Organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in informal\nsettings such as barangay hall, basketball courts, etc. These\nprograms can also be Mobile Training Programs (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees who want to enroll in this qualification must possess the following\nrequirements:\n\n• Must have completed the ten (10) year basic education or an Alternative\nLearning System (ALS) Certificate of Completion with Grade 10 equivalent\nholder\n• Must possess good communication skills\n• Must be computer literate\n\n--- PDF PAGE 135 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n131\n3.4 LIST OF TOOLS, EQUIPMENT, AND MATERIALS\n\nMULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT\nIMPORT) SERVICES NC III.\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for MULTIMODAL TRANSPORT OPERATION AND\nLOGISTICS (SEAFREIGHT IMPORT) SERVICES NC III.\n are as follows:\n\nQTY.\nEQUIPMENT\nQTY.\nTOOLS/MATERIAL\nS\nQTY.\nREFERENCES\n1 unit Executive Table\n1 unit\nForms and\nMaterials\n1 unit\nBusiness Process\nManual\n\nTables and\nChairs for 25\nstudents\n1 unit\nCalculator\n1 unit\nHarmonize Systems\nCode and Trade\nAgreements\n1 unit Clerical Table\n1 unit\nInternet Connection\n1 unit\nDictionary of Shipping\nTerms\n 1 pc. Whiteboard\n1 unit\nTraining Handouts\n1 unit\nEmployees Manuals /\nHandbook\n1 unit USB of\nPowerPoint\npresentation\n1 unit\nBusiness Cards\n1unit\nEmployee Profiles /\nTerms of Reference\n1 unit LCD Projector\n1 unit\nStationaries /\nBusiness\nLetterheads\n1unit\nTACT Rules Book\n1 unit Laptop (for\nlecturer)\n1 unit\nLogbook / Master\nfiles\n1unit\nICC Incoterms\n1 unit Computer for\nadministrative\nand clerical\nwork\n1 unit\nCertificates\n1 unit\nIMDG Manual\n5\nunits\nComputer for\ntechnology\nresource center\nand class\ndemonstration\n1 unit\nForms (Report and\nEvaluation)\n1 unit\nWork Instructions\n1 unit Different media\nChannels\n(telephone,\nemails, viber,\nskype)\n1 unit\nWorld Map\n1 unit\nBasic Occupational\nSafety and Health\n1 unit Laser pointer\n1 unit\nTable of\nMeasurement /\nConversion Table\n1 unit\nForeign Exchange\nRates\n1 unit Air-conditioning\nUnit\n1 unit\nQuality\nManagement\nSystems\n1 unit\nQuality Operation\nManuals\n1 unit AV Equipment\n1 unit\nShipping lines\nschedule\n1 unit\nEnvironmental Laws\n\n--- PDF PAGE 136 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n132\n1 unit Sound System\n\n1 unit\nLocal Regulations\n(BOC, DENR, LTFRB,\nDTI, etc.)\n\n1 unit\nAgency contracts /\nagreements\n\n1 unit\nTransport Tariff (e.g.\nDestination, Origin)\n*Note: For demo purposes only\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\n\nStudent/Trainee Performance Space\n(S/TPS)\n\n5 x 8 m.\n\n43 sq. m.\n\nTechnology Resource Center (TRC)\n\n2 x 5 m.\n\n10 sq. m.\n\nCirculation Area\n\n(S/TPS+PSR+TRC+\nCR) X 30%\n(40+6+10+10) X\n30%=19.8sq.m.)\n\n23 sq. m.\n\nSeparate Restrooms for Male and\nFemale Trainees/ Students (CR)\n\n2 x 5 m.\n\n10 sq. m.\n\nTotal Workshop\nArea\n\n86 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR MULTIMODAL TRANSPORT\nOPERATION AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NC III.\n\n• Must be a holder of NTTC I in Multimodal Transport and Logistics Services\nNC III\n• Must have at least 3 years job / freight forwarding documentation services\nexperience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 137 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n133"
