g computer\nsoftware, hardware/\nperipheral devices in\naccordance with standard\noperating procedures\n• Demonstration\n• Observation\n\n--- PDF PAGE 128 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n124\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.5 Maintain\ncomputer\nequipment and\nsystems\n• Describe:\no Method of implementing\nSystems for cleaning, minor\nmaintenance and\nreplacement of\nconsumables\no Procedure of implementing\nprocedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks in accordance with\nSOP’s\n• Group discussion\n• Demonstration\n1 hour\n\n--- PDF PAGE 129 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n125\nCORE COMPETENCIES\n( 65 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Provide transport\ninformation to\ncustomers\n\n1.1. Be able to\ncommunicate\ntransport\ninformation to\ncustomers\n• Discuss and explain planning\nstrategies and actual\napplication\n• Observe the proceedings of\nthe planning strategies and its\nactual application within the\nworkplace.\n\n• Lecture\n• Group\ndiscussion\n• Role play\n• Demonstration\nwith questioning\n• Interview\n• Written exam\n10 hours\n1.2. Provide updates\non industry trends\nand government\nregulations\n\n• Discuss and explain strategies\n• Test the strategies if it is\nworkable or not. If yes,\nimprove it further. If no, modify\nor delete the planned\nstrategies.\n• Lecture\n• Group\ndiscussion\n• Role play\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n• Written exam\n4 hours\n1.3. Maintain and\nstrengthen\nrelationship with\nthe customers\n• Discuss and explain data\ngathering, its effect and\nimplication to department\n• Gather all data and study how\nall these data are further\nimproved to benefit the\ndepartment.\n• Lecture\n• Group\ndiscussion\n• Role play\n• Interview\n• Written exam\n4 hours\n2. Promote and\ndevelop freight\nservices to\ncustomers\n2.1 Recognize\nopportunities to\npromote freight\nservices\n\n• Discuss and explain planning\nstrategies and actual\napplication\n• Observe the proceedings of\nthe planning strategies and its\nactual application within the\nworkplace.\n\n• Lecture\n• Group\ndiscussion\n• Role play\n• Demonstration\nwith questioning\n• Interview\n• Written exam\n\n8hours\n\n--- PDF PAGE 130 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n126\n2.2 Provide updates\non industry trends\nand government\nregulations\n• Discuss and explain strategies\n• Test the strategies if it is\nworkable or not. If yes,\nimprove it further. If no, modify\nor delete the planned\nstrategies.\n• Lecture\n• Group\ndiscussion\n• Role play\n• Experiential\nlearning\n• Demonstration\nwith questioning\n• Interview\n• Written exam\n\n2 hours\n\n2.3 Maintain and\nstrengthen\nrelationship with\ncustomers\n\n• Discuss and explain data\ngathering, its effect and\nimplication to department\n• Gather all data and study how\nall these data are further\nimproved to benefit the\ndepartment.\n• Lecture\n• Group\ndiscussion\n• Role play\n• Interview\n• Written exam\n\n4 hours\n3. Evaluate and\nconfirm\ncustomers’ freight\ntransport\nrequirements\n\n3.1 Familiarize with\ncustomer’s transport\nrequirements\n\n• Discuss and explain planning\nstrategies and actual\napplication\n• Observe the proceedings of\nthe planning strategies and its\nactual application within the\nworkplace.\n• Lecture\n• Group\ndiscussion\n• Role play\n• Demonstration\nwith questioning\n• Interview\n• Written exam\n10 hours\n3.2 Assess operations\nto meet customer’s\ntransport requirements\n\n• Discuss and explain strategies\n• Test the strategies if it is\nworkable or not. If yes,\nimprove it further. If no, modify\nor delete the planned\nstrategies.\n• Lecture\n• Group\ndiscussion\n• Role play\n• Experiential\nlearning\n• Demonstration\nwith questioning\n