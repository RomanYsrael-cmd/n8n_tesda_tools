  "source_text": "COMPETENCY MAP – TRANSPORT AND LOGISTICS SECTOR\n(MULTIMODAL TRANSPORT OPERATIONS AND LOGISTICS SERVICES NCIII)\n\n BASIC COMPETENCIES\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe\nworkplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironment\nal work\npractices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/addres\ns routine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand\nprocedures\nApply\nenvironment\nal work\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and life\ndecisions\nContribute\nto workplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\n\n--- PDF PAGE 140 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n136\nCOMMON COMPETENCIES\n\n CORE COMPETENCIES\n\nProvide transport\ninformation to customers\nPromote and develop\nfreight services to\ncustomers\nEvaluate and confirm\ncustomer freight\ntransport\nrequirements\n\nMonitor and coordinate\ntransport execution and\ndocumentation\nApply freight forwarding\ndocumentation services\nand workplace procedures\nPerform workplace\nsecurity and safety\nProvide effective\ncustomer service\nContribute to quality\nsystem\n\nPerform computer\noperations\n\n--- PDF PAGE 141 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n137\nGLOSSARY OF TERMS\n\nAcumen\nAbility to make good judgement and quick decisions, typically in a particular\ndomain\nAural\nRelating to ear or sense of hearing\nBrainstorm\nA spontaneous group discussion to produce ideas and ways of solving\nproblems\nCoherent\nLogical and consistent\nCollate\nThe grouping together of related items to provide a record of events and\nfacilitate further processing\nContext\nThe circumstances that form the setting for an event, statement, or idea and\nterms to which it can\nbe fully understood or assessed\nConvention\nAn agreement between countries particularly matters, especially one less\nformal than a treaty\nDiscriminating\nHaving or showing refined taste or judgment\nEntrepreneurial Having to do with the creation and development of economic ventures\nErgonomic\nRelating to or designed for efficiency and comfort in the working environment\nFiduciary\nInvolving trust, especially with regards to the relationship of trustee and a\nbeneficiary\nFora\nPlural of forum. Place, meeting or medium where ideas and views in a\nparticular issue can be exchanged\nInterference\nThe act or instance of hindering, obstructing or impeding\nInterpersonal\nRelating to the interactions between individuals\nIntrapersonal\nExisting or occurring within the self or within one's mind\nJudicious\nHaving, showing, or done with good judgment or sense\nMechanism\nA natural or established process by which something takes place or is brought\nabout\nParameter\nA numerical or other measurable factor forming one of a set that defines a\nsystem or sets the conditions of its operation\nPareto\nAnalysis\nFormal technique that helps prioritize decisions so leaders know which one will\nhave the greater influence and least impact on their overall goals\nPeripheral\nA secondary or minor importance\nPillaging\nSteal something using violence especially in war\nPortfolio\nA compilation of materials that exemplifies your beliefs, skills, qualifications,\neducation, training and experiences. It provides insight into your personality\nand work ethics\nProtocol\nAttitudes, etiquette rules and guidelines for behavior that encompass the best\nway to act at work\nRapport\nIn a good understanding of someone and an ability to communicate well with\nthem\nSimulated\nImitating the conditions of something\nStrategic plan\nA document used to communicate with the organization its goals, the actions\nneeded to achieve them\nStrategies\nA plan of action or policy designed to achieve major or overall aim\n\n--- PDF PAGE 142 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n138\n\nACRONYMS\n\nBIR\nBureau of Internal Revenue\nBOC\nBureau of Customs\nCD\nCompact Disc\nDOF\nDepartment of Finance\nDTI\nDepartment of Trade and Industry\nECC\nEnvironmental Clearance Certificate\nEDI\nElectronic Data Interchange\nEHS\nEnvironment, Health and Safety\nETD\nExplosive Trace Detection\nFCL\nFull Container Load\nHR\nHuman Resources\nID\nIdentification\nINCOTERMS\nInternational Commercial Terms\nLCL\nLess Container Load\nMSDS\nMaterial Safety Data Sheet\nOHS\nOccupational Health and Safety\nOS&H\nOccupational Safety & Health\nPPE\nPersonal Protective Equipment\nSRT\nSelf-Regulation Theory\nSWOT\nStrengths, Weaknesses, Opportunities and Threats\nTESDA\nTechnical Education and Skills Development Authority\nTR\nTraining Regulation\n3R\nReduce, Reuse, Recycle\n5S\nSort, Set in order, Shine, Standardize and Sustain\nBOC\nBureau of Customs\nCD\nCompact Disc\nDO\nDelivery Order\nECC\nEnvironmental Compliance Certificate\nEDI\nElectronic Data Interchange\nEMS\nEnvironmental Management System\nETD\nExplosive Trace Detection\nGO\nGovernment Organization\nGPS\nGlobal Positioning System\nHBL\nHouse Bill of Lading\nHR\nHuman Resources\nIATA\nInternational Air Transport Association\nID\nIdentification\nISO\nInternational Organization for Standardization\nIT\nInformation Technology\n\n--- PDF PAGE 143 ---\nMTOL SERVICES NC 