  "source_text": "SECTION 1 MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT\nIMPORT) SERVICES NC III QUALIFICATION\n\nThe MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT\nIMPORT) SERVICES NC III Qualification consists of competencies that a person must\nachieve to provide transport information to customers, assist in marketing and developing\nservices, assess and confirm freight transport requirements, and monitor and coordinate\ntransport execution and documentation.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\n400311319\n400311320\n400311321\n400311322\n400311323\n400311324\n400311325\n400311326\n400311327\n\nBASIC COMPETENCIES\nLead in workplace communication\nLead small teams\nApply critical thinking and problem solving techniques in the workplace\nWork in a diverse environment\nPropose methods of applying learning and innovation in the organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium enterprises\n(MSMEs)\n\nUNIT CODE\nCOMMON COMPETENCIES\nMTO491201\nApply freight forwarding documentation services and workplace\nprocedures\nMTO491202\nPerform workplace security and safety\nMTO491203\nProvide effective customer service\nMTO491204\nContribute to quality system\nMTO491205\nPerform computer operations\n\nUNIT CODE\nCORE COMPETENCIES\nMTO333301\nProvide transport information to customers\nMTO333302\nPromote and develop freight services to customers\nMTO333303\nMTO333304\nEvaluate and confirm customer freight transport requirements\nMonitor and coordinate transport execution and documentation\n\n A person who has achieved this Qualification is competent to be:\n❑ Import Coordinator\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n2"
}
