  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an employable\nunit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence in all unit/s of competency of a qualification\nwith a promulgated Training Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant\nunit/s of competency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment.\n\n 4.1.4 The following are qualified to apply for assessment:\n\n4.1.4.1 Graduating students/trainees of NTR programs or graduates of\nformal/non-formal/informal including enterprise-based trainings\nrelated to multimodal transport operations and logistics\nservices.\n1.1.4.2 Industry workers in the multimodal transport operations and\nlogistics services.\n\n 4.1.5 The industry shall determine assessment and certification\nrequirements for each qualification with promulgated Training\nRegulations. It includes the following:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\n industry\n\n--- PDF PAGE 138 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n134\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1\nSelf-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited\nby TESDA is authorized to conduct competency assessment.\nAssessment centers undergo a quality assured procedure for\naccreditation before they are authorized by TESDA to manage the\nassessment for National Certification.\n4.2.3\nAccredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 139 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n135\n\nCOMPETENCY MAP – TRANSPORT AND LOGISTICS SECTOR\n(MULTIMODAL TRANSPORT OPERATIONS AND LOGISTICS SERVICES NCIII)\n\n BASIC COMPETENCIES\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe\nworkplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironment\nal work\npractices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/addres\ns routine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand\nprocedures\nApply\nenvironment\nal work\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and life\ndecisions\nContribute\nto workplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\n\n--- PDF PAGE 140 ---\nMTOL SERVICES NC III\n\nPromulgated (12/17/2019)\n\n136\nCOMMON COMPETENCIES\n\n CORE COMPETENCIES\n\nProvide transport\ninformation to customers\nPromote and develop\nfreight services to\ncustomers\nEvaluate and confirm\ncustomer freight\ntransport\nrequirements\n\nMonitor and coordinate\ntransport execution and\ndocumentation\nApply freight forwarding\ndocumentation services\nand workplace procedures\nPerform workplace\nsecurity and safety\nProvide effective\ncustomer service\nContribute to quality\nsystem\n\nPerform computer\noperations\n\n--- PDF PAGE 141 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n137\nGLOSSARY OF TERMS\n\nAcumen\nAbility to make good judgement and quick decisions, typically in a particular\ndomain\nAural\nRelating to ear or sense of hearing\nBrainstorm\nA spontaneous group discussion to produce ideas and ways of solving\nproblems\nCoherent\nLogical and consistent\nCollate\nThe grouping together of related items to provide a record of events and\nfacilitate further processing\nContext\nThe circumstances that form the setting for an event, statement, or idea and\nterms to which it can\nbe fully understood or assessed\nConvention\nAn agreement between countries particularly matters, especially one less\nformal than a treaty\nDiscriminating\nHaving or showing refined taste or judgment\nEntrepreneurial Having to do with the creation and development of economic ventures\nErgonomic\nRelating to or designed for efficiency and comfort in the working environment\nFiduciary\nInvolving trust, especially with regards to the relationship of trustee and a\nbeneficiary\nFora\nPlural of forum. Place, meeting or medium where ideas and views in a\nparticular issue can be exchanged\nInterference\nThe act or instance of hindering, obstructing or impeding\nInterpersonal\nRelating to the interactions between individuals\nIntrapersonal\nExisting or occurring within the self or within one's mind\nJudicious\nHaving, showing, or done with good judgment or sense\nMechanism\nA natural or established process by which something takes place or is brought\nabout\nParameter\nA numerical or other measurable factor forming one of a set that defines a\nsystem or sets the conditions of its operation\nPareto\nAnalysis\nFormal technique that helps prioritize decisions so leaders know which one will\nhave the greater influence and least impact on their overall goals\nPeripheral\nA secondary or minor importance\nPillaging\nSteal something using violence especially in war\nPortfolio\nA compilation of materials that exemplifies your beliefs, skills, qualifications,\neducation, training and experiences. It provides insight into your personality\nand work ethics\nProtocol\nAttitudes, etiquette rules and guidelines for behavior that encompass the best\nway to act at work\nRapport\nIn a good understanding of someone and an ability to communicate well with\nthem\nSimulated\nImitating the conditions of something\nStrategic plan\nA document used to communicate with the organization its goals, the actions\nneeded to achieve them\nStrategies\nA plan of action or policy designed to achieve major or overall aim\n\n--- PDF PAGE 142 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n138\n\nACRONYMS\n\nBIR\nBureau of Internal Revenue\nBOC\nBureau of Customs\nCD\nCompact Disc\nDOF\nDepartment of Finance\nDTI\nDepartment of Trade and Industry\nECC\nEnvironmental Clearance Certificate\nEDI\nElectronic Data Interchange\nEHS\nEnvironment, Health and Safety\nETD\nExplosive Trace Detection\nFCL\nFull Container Load\nHR\nHuman Resources\nID\nIdentification\nINCOTERMS\nInternational Commercial Terms\nLCL\nLess Container Load\nMSDS\nMaterial Safety Data Sheet\nOHS\nOccupational Health and Safety\nOS&H\nOccupational Safety & Health\nPPE\nPersonal Protective Equipment\nSRT\nSelf-Regulation Theory\nSWOT\nStrengths, Weaknesses, Opportunities and Threats\nTESDA\nTechnical Education and Skills Development Authority\nTR\nTraining Regulation\n3R\nReduce, Reuse, Recycle\n5S\nSort, Set in order, Shine, Standardize and Sustain\nBOC\nBureau of Customs\nCD\nCompact Disc\nDO\nDelivery Order\nECC\nEnvironmental Compliance Certificate\nEDI\nElectronic Data Interchange\nEMS\nEnvironmental Management System\nETD\nExplosive Trace Detection\nGO\nGovernment Organization\nGPS\nGlobal Positioning System\nHBL\nHouse Bill of Lading\nHR\nHuman Resources\nIATA\nInternational Air Transport Association\nID\nIdentification\nISO\nInternational Organization for Standardization\nIT\nInformation Technology\n\n--- PDF PAGE 143 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n139\n\nMBL\nMaster Bill of Lading\nMSME\nMicro-Small-Medium Enterprises\nNGO\nNon-Government Organization\nOHS\nOccupational Health and Safety\nPDCA\nPlan-Do-Check-Act\nPPE\nPersonal Protective Equipment\nRFID\nRadio Frequency Identifier\nSMS\nShort Messaging System\nSWL\nSafe Working Limits\nSWOT\nStrengths, Weaknesses, Opportunities and Threats\nTESDA\nTechnical Education and Skills Development Authority\nTR\nTraining Regulation\nTVET\nTechnical and Vocational Education and Tr