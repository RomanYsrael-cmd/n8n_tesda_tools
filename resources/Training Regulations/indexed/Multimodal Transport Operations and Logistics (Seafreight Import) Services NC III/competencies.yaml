d\nby customers\n2.1. Attributes and\nlimitations of\navailable software\ntools\n2.2. Procedures and\nwork instructions for\nthe use of IT\n2.3. Operational\nrequirements for IT\nsystems\n2.4. Sources and flow\npaths of data\n2.5. Security systems\nand measures that\ncan be used\n2.6. Extract data and\nformat reports\n2.7. Methods of entering\nand processing\ninformation\n2.8. WWW enabled\napplications\n2.1. Identifying attributes\nand limitations of\navailable software\ntools\n2.2. Using procedures and\nwork instructions for\nthe use of IT\n2.3. Describing operational\nrequirements for IT\nsystems\n2.4. Identifying sources\nand flow paths of data\n2.5. Determining security\nsystems and\nmeasures that can be\nused\n2.6. Extracting data and\nformat reports\n2.7. Describing methods of\nentering and\nprocessing information\n2.8. Using WWW\napplications\n\n2.6 Own skills and\nunderstanding are\nshared to help\nothers\n2.7 Specified\nsecurity\nmeasures are\nimplemented to\nprotect the\nconfidentiality and\nintegrity of project\ndata held in IT\nsystems\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n25\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Edit, format\nand check\ninformation\n3.1 Basic editing\ntechniques are\nused\n3.2 Accuracy of\ndocuments are\nchecked\n3.3 Editing and\nformatting tools\nand techniques are\nused for more\ncomplex\ndocuments\n3.4 Proof reading\ntechniques is used\nto check that\ndocuments look\nprofessional\n3.1 Basic file-handling\ntechniques\n3.2 Techniques in\nchecking documents\n3.3 Techniques in editing\nand formatting\n3.4 Proof reading\ntechniques\n\n3.1 Using basic file-\nhandling techniques is\nused for the software\n3.2 Using different\ntechniques in checking\ndocuments\n3.3 Applying editing and\nformatting techniques\n3.4 Applying proof reading\ntechniques\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-