        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified the layout of the workplace, the flow of materials\nand goods (where relevant) and the workplace procedures\nin each work area\n1.2 Identified and followed workplace emergency procedures in\nreal and simulated emergency situation\n1.3 Planned work activities and communicated progress of\nwork to others whose personal work plans and timelines\nmay be affected\n1.4 Completed work to the standard expected in the workplace\nand in accordance with any guidelines, directions or\ninstructions/ information\n1.5 Identified and followed workplace procedures, regulations\nand legislation appropriate to the position\n1.6 Applied appropriate codes of acceptable and ethical work\npractices\n1.7 Planned daily routine to take into account rosters, agents,\nvendors, clients agreements and workplace procedures\n1.8 Applied appropriate codes of acceptable and ethical work\npractices\n\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials and new technologies relevant to the unit of\ncompetency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n3.3 Interview\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n46\nUNIT OF COMPETENCY :\nPERFORM WORKPLACE SECURITY AND SAFETY\n\nUNIT CODE\n :"
