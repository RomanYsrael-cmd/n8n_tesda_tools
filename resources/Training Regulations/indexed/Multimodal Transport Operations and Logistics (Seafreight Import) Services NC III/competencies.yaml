        "source_text": "MTO432203\n\nUNIT DESCRIPTOR :\nThis unit involves the skills, values, and knowledge required\nto provide effective customer service skills to relevant\nworkplace operations. It includes dealing with customer\ninquiries and monitoring customer satisfaction.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Deal with\ncustomer\ninquiries\n\n1.1 Customer\ninquiries are dealt\nwith courteously\nand efficiently thru\nphone, e-mail and\nface to face.\n1.2 Questions are\nused to clarify the\ncustomer's needs\nor concerns\n1.3 Assistance from\nother staff is\nsought when a\ncustomer' s\ninquiry cannot be\nfully answered\n1.4 Knowledge of\nproducts, services\nand/or operations\nis used to answer\ncustomer queries\nor to respond to\ncustomers' needs\n\n1.1Ways of dealing\nwith Customer\nrequirements\n1.2Appropriate\nmethods of\nproviding\nfeedback to\nmanagers and\ninternal and/or\nexternal\ncustomers\n1.3Sources of\ninformation and\ndocumentation\nneeded to\nassess customer\nsatisfaction\n1.4Ways of\nrecording\ncustomer\ninquiries and\nassociated\naction\n\n1.1 Dealing with\ncustomer\ninquiries\ncourteously and\nefficiently thru\nphone, e-mail\nand face to face\n1.2 Seeking\nassistance from\nother staff or\nsuperior when a\ncustomer' s\ninquiry cannot be\nfully answered\n1.3 Communicating\neffectively with\nothers when\nproviding\ncustomer\nservice,\nincluding the use\nof telephone\ntechniques\n1.4 Handling and\nunderstanding\ncustomer\nqueries and\ncomplaints\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n53\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Monitor\ncustomer\nsatisfaction\n\n2.1 Customer\nrequirements are\ndealt with\naccording to\nworkplace\nprocedures\n2.2 Appropriate\nfeedback is\nprovided to\nmanagers and\ninternal and/or\nexternal\ncustomers\n2.3 Customer inquiries\nand associated\naction are\nrecorded and\nreported in\naccordance with\nworkplace\nprocedures\n\n2.1Ways of dealing\nwith Customer\nrequirements\n2.2Appropriate\nmethods of\nproviding\nfeedback to\nmanagers and\ninternal and/or\nexternal\ncustomers\n2.3.Sources of\ninformation and\ndocumentation\nneeded to\nassess customer\nsatisfaction\n2.4 Ways of\nrecording\ncustomer\ninquiries and\nassociated\naction\n\n2.1 Providing\nappropriate\nfeedback to\nmanagers and\ninternal and/or\nexternal\ncustomers\n2.2 Recording and\nreporting of\ncustomer\ninquiries and\nassociated\naction\n2.3 Completing\ndocumentation\nrelated to the\nprovision of\ncustomer service\n2.4 Writing simple\nreports and\nrecords of\ninquiries\n2.5 Communicating\nregularly with the\nclients to stay on\ntop of the\nsituation.\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n54\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3 Maintain\nstrong\nrapport with\nthe customer\n\n3.1 Customer\nrequirements are\ndealt with\ncourteously and\nefficiently thru\nphone, e-mail and\nface to face.\n3.2 Periodic and\nplanned follow-up\ncalls are made\nwith the customer\n3.3 Special events\nand occasions of\nthe customer are\nattended to\n3.4 Assistance from\nother staff is\nsought when a\ncustomer' s inquiry\ncannot be fully\nanswered\n3.5 Knowledge of\nproducts, services\nand/or operations\nis used to answer\ncustomer queries\nor to respond to\ncustomers' needs\n\n3.1 Ways of dealing\nwith Customer\nrequirements\n3.2 Appropriate\nmethods of\nproviding\nfeedback to\nmanagers and\ninternal and/or\nexternal\ncustomers\n3.3 Sources of\ninformation and\ndocumentation\nneeded to\nassess customer\nsatisfaction\n3.4 Ways of\nrecording\ncustomer\ninquiries and\nassociated\naction\n\n3.1 Dealing with\ncustomer\ninquiries\ncourteously and\nefficien