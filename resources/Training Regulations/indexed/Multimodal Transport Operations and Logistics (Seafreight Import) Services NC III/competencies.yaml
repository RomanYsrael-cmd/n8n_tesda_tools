rkplace safety\nand security\n1.3 Completing\nrequired\ndocumentation\nand reports\nrelated to safety\nand security\nprocedures\n1.4 Applying\nprocedures for\nsafety, security\nchecks and\nprecautions as\nper limits of role\nand\nresponsibilities\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n47\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.5 Relevant OS&H\nand\nenvironmental\nprotection\nprocedures and\nguidelines\n1.6 Common\nsecurity\nproblems that\nmay occur when\ncarrying out\noperations in the\ntransport and\nlogistics\nindustries, and\naction that can\nbe taken to\naddress and\nresolve the\nproblems.\n2 Identify a\nsecurity\nthreat or\nsituation\n\n2.1 Security threat or\nsituation is promptly\nidentified and\nassessed and\nresponse is\nprioritized in\naccordance with the\nworkplace security\nprogram and\nprocedures\n2.2 Implications of the\nsecurity threat or\nsituation are\nevaluated in\naccordance with\nworkplace security\nprogram and\nprocedures\n\n2.1Applicable\ntransport security\nlegislation\nincluding\nrelevant\ninternational,\nnational, state\nand territory\nacts, regulations\ncodes and/or\nguidelines\n2.2Relevant\nworkplace\nsecurity program\nand policies and\nprocedures for\nresponding to\nsecurity threats,\nsituations and\nemergencies\n2.3Relevant\nquarantine and\nbond regulations\nand\nrequirements\n2.4Common\nsecurity threats\n2.1Identifying and\nsolving and/or\nreporting\nproblems that\narise when\nfollowing security\nprocedures\n2.2Recognizing signs\nof security threats\nand situations\n2.3Responding\nappropriately to\ncritical situations\n2.4 Risk\nmanagement\nskills to avoid or\nprevent any threat\nwhere possible\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n48\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIR