SDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n74\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.7 Promptly report\nand/or rectify any\nidentified problems\nthat may arise\nwhen marketing\nservices and\nproducts to clients\n1.8 Monitor work\nactivities in terms of\nplanned schedule\n1.9 Identify\nimprovements to\nservices, resource\nallocation and use\n1.10 Select and\nappropriately\napply technology,\ninformation\nsystems and\nprocedures to\ncomplete\nworkplace tasks\n1.11 Operate and\nadapt to\ndifferences in\nequipment in\naccordance with\nstandard\noperating\nprocedures\n\n2 Provide\nupdates on\nIndustry trends\nand\ngovernment\nregulations\n\n2.1Industry trends and\nnew government\nregulations are\nfamiliarized\n2.2 Information\nupdates are\ndisseminated to all\nconcerned parties\nin accordance with\nthe workplace\nprocedures\n2.3 Implementation of\nnew regulations\nis monitored in\naccordance with\n2.1 Relevant\nregulatory\nrequirements\n2.2 Workplace\nprotocols and\nprocedures for the\nmarketing of\nservices and\nproducts to clients\n2.3 Relevant\nworkplace\nbusiness\nmarketing policies\nand practices,\nincluding\nrequirements for\n2.1 Read and interpret\ninstructions,\nprocedures and\ninformation relevant\nto the marketing of\nservices and\nproducts to clients\n2.2 Operate electronic\ncommunication\nequipment to\nrequired protocol\n2.3 Work\ncollaboratively with\nothers when\nmarketing services\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n75\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nworkplace\nprocedures\nthe maintenance\nof security and\nconfidentiality\n2.4 New\ndevelopments in\nthe marketplace\n2.5 New\ndevelopments and\nchanges in\ngovernment\nregulations\n\nand products to\nclients\n2.4 Adapt appropriately\nto cultural\ndifferences in the\nworkplace,\nincluding modes of\nbehavior and\ninteractions with\nothers\n2.5 Monitor work\nactivities in terms of\nplanned schedule\n2.6 Identify\nimprovements to\nservices, resource\nallocation and use\n\n3 Maintain and\nstrengthen\nrelationship\nwith\ncustomers\n3.1 Regular\ncommunication\nwith clients is\nmaintained in\norder to establish\nquick response to\ntheir requirements\n3.2 Special occasions\nand events such\nas company\nanniversaries are\nacknowledged\n3.3 Feedbacks and\nupdates from\nclients are\nreported to\nconcerned parties\nin the company for\nproper follow up\nactions in\naccordance to\nworkplace\nprocedure\n\n3.1 Calendar of\nspecial events or\noccasions\n3.2 Customer profile\n3.3 Escalation\nprocess\n3.4 Telephone\ntechniques\n3.5 Relevant\nregulatory\ndevelopments\n\n3.1 Interpersonal skills\n3.2 Communication\nskills\n3.3 Customer service\nskills\n3.4 Telephone skills\n3.5 Work\ncollaboratively with\nothers when\nmarketing services\nand products to\nclients\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n76\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cross Selling\nMay include:\n3.1 Warehousing\n3.2 Value-added logistics services\n3.3 Domestic freight forwarding\n3.4 Last mile delivery\n\n2. New Regulations\nMay include:\n3.1 Government agencies\n3.2 Licenses and permits\n3.3 Customs memo orders\n3.4 Road use regulations\n3.5 Clean Air Act\n3.6 Toll fees\n3.7 Routing and re-routing schemes\n3.8 Dangerous goods handling\n3.9 OSHA updates\n\n3. Feedback and updates from\nclients\nMay include:\n3.1New potential business opportunities\n3.2Increase or decrease in production\n3.3Referral\n3.4Service satisfaction\n3.5Customer complaints or claims\n3.6Competitors\n\n--- PDF PAGE 81 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n77\n EVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\nRecognized opportunities to promote products and services\n1.1 Established and maintained contact with clients\n1.2 Initiated sales\n1.3 Conducted after sales activity\n2. Resource\nImplications\n\nThe following resources should be provided\n2.1 Workplace location\n2.2 Relevant and appropriate materials and equipment relevant\nto the unit of competency\n2.3 applicable documentation including workplace procedures,\nregulations, codes of practice and operation manuals\n3. Methods of\nAssessment\n\nCompetency in this unit maybe assessed through:\n3.1 Written Test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n3.4 Interview\n3.5 Portfolio Assessment\n3.6 Work Related Project\n\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 82 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n78\nUNIT OF COMPETENCY:\nEVALUATE AND CONFIRM CUSTOMER FREIGHT\nTRANSPORT REQUIREMENTS\nUNIT CODE :"
