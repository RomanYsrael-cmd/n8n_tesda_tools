        "source_text": "MTO432202\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to follow\nsecurity procedures in the freight forwarding and\ndocumentation services. It includes checking and\nmaintaining the security of the workplace and personnel,\nidentifying and responding to security threats or situations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.Maintain\nsecurity of the\nworkplace\n\n1.1 Workplace is\nsecured within\nspecified locations\nin accordance with\nworkplace security\nprocedures and\napplicable security\nregulations\n1.2 Seals, locks and\nother security\nmeasures in the\nworkplace are\nchecked and\nmaintained in\naccordance with\nworkplace safety\nand security\nprocedures\n1.3 Signs of attempted\nentry, theft, or\ninterference are\nrecognized and\nreported in\naccordance with\nworkplace security\nprocedures\n1.4 Any breaches of\nsecurity\nrequirements are\nreported promptly to\ndesignated\npersonnel in\naccordance with\nworkplace safety\nand security\nprocedures\n1.1 Applicable\ntransport security\nlegislation\nincluding\nrelevant\ninternational,\nnational, state\nand territory\nacts, regulations\ncodes and/or\nguidelines\n1.2 Relevant\nworkplace\nsecurity program\nand policies and\nprocedures for\nresponding to\nsecurity threats,\nsituations and\nemergencies\n1.3 Relevant\nquarantine and\nbond regulations\nand\nrequirements\n1.4 Common\nsecurity threats\nand incidents\nthat may occur in\nthe workplace\nand related roles\nand\nresponsibilities of\npersonnel when\nreporting them\nand responding\nto them\n1.1 Communicating\neffectively with\nconcerned parties\nwhen following\nsecurity\nprocedures\n1.2 Reading and\ninterpreting\ninstructions,\nprocedures,\napplicable\nregulatory\nrequirements,\nlabels, markings,\nID cards and\nother information\nrelevant to\nworkplace safety\nand security\n1.3 Completing\nrequired\ndocumentation\nand reports\nrelated to safety\nand security\nprocedures\n1.4 Applying\nprocedures for\nsafety, security\nchecks and\nprecautions as\nper limits of role\nand\nresponsibilities\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n47\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.5 Relevant OS&H\nand\nenvironmental\nprotection\nprocedures and\nguidelines\n1.6 Common\nsecurity\nproblems that\nmay occur when\ncarrying out\noperations in the\ntransport and\nlogistics\nindustries, and\naction that can\nbe taken to\naddress and\nresolve the\nproblems.\n2 Identify a\nsecurity\nthreat or\nsituation\n\n2.1 Security threat or\nsituation is promptly\nidentified and\nassessed and\nresponse is\nprioritized in\naccordance with the\nworkplace security\nprogram and\nprocedures\n2.2 Implications of the\nsecurity threat or\nsituation are\nevaluated in\naccordance with\nworkplace security\nprogram and\nprocedures\n\n2.1Applicable\ntransport security\nlegislation\nincluding\nrelevant\ninternational,\nnational, state\nand territory\nacts, regulations\ncodes and/or\nguidelines\n2.2Relevant\nworkplace\nsecurity program\nand policies and\nprocedures for\nresponding to\nsecurity threats,\nsituations and\nemergencies\n2.3Relevant\nquarantine and\nbond regulations\nand\nrequirements\n2.4Common\nsecurity threats\n2.1Identifying and\nsolving and/or\nreporting\nproblems that\narise when\nfollowing security\nprocedures\n2.2Recognizing signs\nof security threats\nand situations\n2.3Responding\nappropriately to\ncritical situations\n2.4 Risk\nmanagement\nskills to avoid or\nprevent any threat\nwhere possible\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n48\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nand incidents\nthat may occur in\nthe workplace\nand related roles\nand\nresponsibilities of\npersonnel when\nreporting them\nand responding\nto them\n2.5Relevant OS&H\nand\nenvironmental\nprotection\nprocedures and\nguidelines\n2.6Common\nsecurity\nproblems that\nmay occur when\ncarrying out\noperations in the\ntransport and\nlogistics\nindustries\n3 Respond to a\nsecurity\nthreat or\nsituation\n\n3.1 Response to an\nidentified security\nthreat or situation is\nin accordance with\nworkplace security\nprocedures,\nreceived\ninstructions,\nregulatory\nrequirements and\nemergency\nresponse plan\n3.2 Security threats or\nincidents are\nhandled\nappropriately in\naccordance with\nestablished\nresponse plan and\nwithin limits of\nresponsibility using\navailable\n3.1Common\nsecurity\nproblems that\nmay occur when\ncarrying out\noperations in the\nworkplace and\naction that can\nbe taken to\naddress and\nresolve the\nproblems\n3.2Relevant\ndocumentation\nand reporting\nrequirements\n3.3 Emergency\nresponse plans\n\n3.1 Completing\nrequired\ndocumentation\nand reports\nrelated to security\nprocedures\n3.2 Working\ncollaboratively\nwith others when\nfollowing security\nprocedures\n3.3 Modifying\nactivities\ndepending on\ndiffering\nworkplace risk\nsituations and\nenvironments\n3.4 Applying security\nprograms and\nprocedures in-\nresponse to\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n49\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\ncommunications in\nthe work area\nidentified security\nthreats\n3.5 Promptly reporting\nand/or rectifying\nany identified\nproblems that may\narise when\nfollowing security\nprocedures in\naccordance with\nregulatory\nrequirements and\nworkplace\nprocedures\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n50\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Security Measures\n\nMay include:\n1.1 security guards at access points and gates to\nsecured areas\n1.2 locked doors, gates and fences\n1.3 use of personal electronic access cards\n1.4 recording of carrier and vehicle registration\ndetails at gates and checkpoints\n1.5 bag check points\n1.6 escorts for visitors in restricted areas\n1.7 access control in and out of restricted security\nareas\n1.8 use of ID cards\n1.9 video surveillance equipment\n1.10 X-ray screening of baggage, cargo and goods\n1.11 explosives trace detection (ETD) screening of\npassengers, baggage, cargo and goods\n1.12 screening of passengers using hand-held and\nwalk through magnetometers\n1.13 frisking\n\n2. Workplace Security\nProcedures\nMay include:\n2.1 Established security procedures\n2.2 Standard operating procedures\n2.3 Company procedures\n2.4 Organizational procedures\n\n3. Communications\n\nMay include:\n3.1 Phone\n3.2 Radio\n3.3 Fax\n3.4 Email\n3.5 Electronic data transfer (EDI)\n3.6 Internet\n3.7 Oral, aural or signed communications\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n51\n EVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Secured goods and cargo in accordance with workplace\nsecurity procedures and applicable security regulations\n1.2 Checked and maintained seals, tamper proof packaging,\nlocks and other security measures on goods or cargo in\naccordance with workplace security procedures\n1.3 Identified and assessed security threat or situation in\naccordance with the workplace security program and\nprocedures\n1.4 Responded to an identified security threat or situation in\naccordance with workplace security procedures, received\ninstructions, regulatory requirements and emergency\nresponse plan\n1.5 Handled appropriately any security threats or incidents in\naccordance with established response plan and within limits\nof responsibility\n\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials and new technologies relevant to the unit of\ncompetency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n3.4 Interview\n\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n52\nUNIT OF COMPETENCY :\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n :"
