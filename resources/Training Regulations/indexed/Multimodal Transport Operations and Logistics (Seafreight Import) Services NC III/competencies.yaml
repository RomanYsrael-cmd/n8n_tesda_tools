GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Completed work in accordance with workplace standards as\ndefined in enterprise policies and procedures\n1.2 Applied basic quality concepts to work activities\n1.3 Tested and evaluated improvements to work processes\n1.4 Checked evaluation of improvements for outcomes and\ncompliance with workplace requirements\n1.5 Implemented the tested and confirmed improvement\ninitiatives in accordance with enterprise procedures\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials and new technologies relevant to the unit of\ncompetency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n61\nUNIT OF COMPETENCY :\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n :"
