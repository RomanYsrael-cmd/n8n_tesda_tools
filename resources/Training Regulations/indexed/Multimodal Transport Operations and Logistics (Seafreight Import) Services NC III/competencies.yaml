        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2 Assessed and monitored team and individual\nperformance against set criteria\n1.3 Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4 Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5 Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n3.3 Portfolio\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at\n the designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n9\nUNIT OF COMPETENCY :\nAPPLY CRITICAL THINKING AND PROBLEM-SOLVING\nTECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n :"
        },
        "source_text": "400311320\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting, maintaining and monitoring\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements are\nidentified and presented\nto team members based\non company policies and\nprocedures\n1.2 Reasons for instructions\nand requirements are\ncommunicated to team\nmembers based on\ncompany policies and\nprocedures\n1.3 Team members’ and\nleaders’ concerns are\nrecognized, discussed\nand dealt with based on\ncompany practices\n1.1 Facilitation of\nTeam work\n1.2 Company\npolicies and\nprocedures\nrelating to work\nperformance\n1.3 Performance\nstandards and\nexpectations\n1.4 Monitoring\nindividual’s and\nteam’s\nperformance vis\na vis client’s\nand group’s\nexpectations\n1.1Communication\nskills required for\nleading teams\n1.2 Group facilitation\nskills\n1.3 Negotiating skills\n1.4 Setting\nperformance\nexpectations\n2. Assign\n responsibilities\n2.1. Responsibilities are\nallocated having regard to\nthe skills, knowledge and\naptitude required to\nundertake the assigned\ntask based on company\npolicies.\n2.2. Duties are allocated\nhaving regard to\nindividual preference,\ndomestic and personal\nconsiderations\n\n2.1 Work plan and\nprocedures\n2.2 Work\nrequirements\nand targets\n2.2 Individual and\ngroup\nexpectations\nand\nassignments\n2.3 Ways to\nimprove group\nleadership and\nmembership\n2.1 Communication skills\n2.2 Management skills\n2.3 Negotiating skills\n2.4 Evaluation skills\n2.5 Identifying team\nmember’s strengths\nand rooms for\nimprovement\n\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1 Performance expectations\nare established based on\nclient needs\n3.2 Performance expectations\nare based on individual\nteam members\nknowledge, skills and\naptitude\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n3.1 One’s roles and\nresponsibilities\nin the team\n3.2 Feedback giving\nand receiving\n3.3 Performance\nexpectation\n\n3.1 Communication\nskills\n3.2 Accurate empathy\n3.3 Congruence\n3.4 Unconditional\npositive regard\n3.5 Handling of\nFeedback\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n6\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Supervise team\nperformance\n4.1 Performance is\nmonitored based on\ndefined performance\ncriteria and/or assignment\ninstruction\n 4.2 Team members are\nprovided with feedback\nand positive support on\nstrategies to overcome\nany deficiencies based on\ncompany practices\n4.3 Performance issues\nwhich cannot be rectified\nor addressed within the\nteam are referred to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs\nand requirements are met\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n 4.7 All relevant\ndocumentation is\ncompleted in accordance\nwith company procedures\n\n4.1 Performance\nCoaching\n4.2 Performance\nmanagement\n4.3 Key\nperformance\nindicators\n4.4 Quality Manual\n4.5 Key result areas\n4.6 OHS guidelines\n\n4.1 Communication\nskills required for\nleading teams\n4.2 Coaching skills\n4.3 Interpretation of\nstandards and\nteam handling\nguidelines\n4.4 Motivational skills\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\nMay include:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\nMay include:\n2.1\nRoster/shift details\n3. Monitor performance\nMay include:\n3.1 Formal process\n3.2 Informal process\n4. Feedback\nMay include:\n4.1 Formal process\n4.2 Informal process\n5. Performance issues\nMay include:\n5.1 Work output criteria\n5.2 Work quality\n5.3 Team participation\n5.4 Compliance with workplace protocols\n5.5 Safety\n5.6 Customer service\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n8\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2 Assessed and monitored team and individual\nperformance against set criteria\n1.3 Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4 Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5 Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n3.3 Portfolio\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at\n the designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n9\nUNIT OF COMPETENCY :\nAPPLY CRITICAL THINKING AND PROBLEM-SOLVING\nTECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n :"
