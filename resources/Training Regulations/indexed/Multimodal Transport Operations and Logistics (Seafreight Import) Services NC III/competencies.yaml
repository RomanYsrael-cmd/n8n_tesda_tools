le method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies / what\nifs will be required as well as bank of questions which\nwill be used to probe the reason behind the\nobservable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Case Formulation\n3.3. Life Narrative Inquiry\n3.4. Standardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over\na range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n\nThese assessment activities should include a range of\nproblems, including new, unusual and improbable\nsituations that may have happened.\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n15\n\nUNIT OF COMPETENCY :\nWORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n :"
