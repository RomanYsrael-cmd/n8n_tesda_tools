        "source_text": "400311326\n\nUNIT DESCRIPTOR\n\n:\n\nThis unit covers the knowledge, skills and attitude to\ninterpret environmental Issues, establish targets to\nevaluate\nenvironmental\npractices\nand\nevaluate\neffectiveness of environmental practices.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n1.1 Environmental work\npractices issues are\nidentified relevant to\nwork requirements\n1.2 Environmental\nStandards and\nProcedures nature of\nwork are determined\nbased on Applicability to\nnature of work\n1.3 Gaps in work practices\nrelated to Environmental\nStandards and\nProcedures are\nidentified\n\n1.1 Environmental\nIssues\n1.2 Environmental\nWork Procedures\n1.3 Environmental\nLaws\n1.4 Environmental\nHazardous and\nNon-Hazardous\nMaterials\n1.5 Environmental\nrequired license,\nregistration or\ncertification\n1.1. Analyzing\nEnvironmental\nIssues and\nConcerns\n1.2. Critical thinking\n1.3. Problem Solving\n1.4. Observation Skills\n\n2. Establish\ntargets to\nevaluate\nenvironmental\npractices\n\n2.1. Relevant information are\ngathered necessary to\ndetermine environmental\nwork targets\n2.2. Environmental\nIndicators based on\ngathered information are\nset to measure\nenvironmental work\ntargets\n2.3. Indicators are verified\nwith appropriate\npersonnel\n2.1. Environmental\nIndicators\n2.2. Relevant\nEnvironment\nPersonnel or\nexpert\n2.3. Relevant\nEnvironmental\nTrainings and\nSeminars\n2.1. Investigative\nSkills\n2.2. Critical thinking\n2.3. Problem Solving\n2.4. Observation Skills\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n33\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\neffectiveness of\nenvironmental\npractices\n3.1. Work environmental\npractices are recorded\nbased on workplace\nstandards\n3.2. Recorded work\nenvironmental practices\nare compared against\nplanned indicators\n3.3. Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nenvironment work\nstandards and\nprocedures\n3.4. Results of environmental\nassessment are\nconveyed to appropriate\npersonnel\n\n3.1 Environmental\nPractices\n3.2 Environmental\nStandards and\nProcedures\n3.3 Clean Air Act\n3.4 Resource\noptimization\n3.1 Documentation\nand Record\nKeeping Skills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Environmental practices\nIssues\nMay include:\n1.1\nWater Quality\n1.2\nNational and Local Government Issues\n1.3\nSafety\n1.4\nEndangered Species\n1.5\nNoise\n1.6\nAir Quality\n1.7\nHistoric\n1.8\nWaste\n1.9\nCultural\n2. Environmental Indicators\nMay include:\n2.1\nNoise level\n2.2\nLighting (Lumens)\n2.3\nAir Quality - Toxicity\n2.4\nThermal Comfort\n2.5\nVibration\n2.6\nRadiation\n2.7\nQuantity of the Resources\n2.8\nVolume\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n34\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1. Identified environmental issues relevant to work\nrequirements\n1.2. Identified gaps in work practices related to Environmental\nStandards and Procedures\n1.3. Gathered relevant information necessary to determine\nenvironmental work targets\n1.4. Set environmental indicators based on gathered information\nto measure environmental work targets\n1.5. Recorded work environmental practices are recorded based\non workplace standards\n1.6. Conveyed results of environmental assessment to\nappropriate personnel\n2. Resource Implications The following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n2.3 Case studies/scenarios relating to environmental protection\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs, certificate\nof training – local and abroad)\n3.4 Simulations and role-plays\n4. Context for Assessment 4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n35\nUNIT OF COMPETENCY :\nFACILITATE ENTREPRENEURIAL SKILLS FOR MICRO-\nSMALL-MEDIUM ENTERPRISES (MSMEs)\n\nUNIT CODE\n:"
