        "source_text": "MTO333304\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to\nmonitor and coordinate the transport execution and\ndocumentation of cargo, in compliance with confirmed\ncustomer’s requirements, freight arrangements and to\ncommunicate with overseas agents and other entities.\nLegislative, regulatory or certification requirements are\napplicable to this unit.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Coordinate\nexecution of\ntransport\nplan\n\n1.1 Shipping instruction\nis provided to\noverseas agent and\nother concerned\nparties\n1.2 Schedule of pick-up,\ndeparture and arrival\ndates and routes are\ndetermined in\naccordance with\nagreed transport plan.\n1.3 Draft of transport\ndocuments are\nobtained from\noverseas agent for\nchecking of accuracy\nin accordance with\nshipping instructions\nand workplace\nprocedures\n1.4 Final transport\ndocuments and other\nshipping requirements\nare obtained\nimmediately upon\ndeparture\n1.5 Final transport\ndocuments are\nprovided to\ndocumentation clerk\nand liaison staff for\nproper documentation\nand processing.\n\n1.1. Relevant regulatory\nand code\nrequirements\nincluding\ncharacteristics,\nmass and load\nregulations\n1.2. Environmental\nprotection policies\nand procedures\n1.3. Workplace protocols\nand procedures for\nthe monitoring to\ncustomers\nrequirements\ncustomer transport\nrequirements\n1.4. Strategies to\nimplement\ncontinuous\nimprovement\nprocesses\n1.5. Typical problems\nthat can occur when\nassessing and\nconfirming customer\ntransport\nrequirements and\nrelated appropriate\naction that can be\ntaken\n\n1.1. Communicate\neffectively with\ncustomers,\nsuppliers,\ngovernment\nagencies, and other\nrelevant parties\nwhen monitoring\ncompliance to\nconfirmed customer\ntransport\nrequirements\n1.2. Coordinate and\ncollaborate with\ncustomers,\nsuppliers,\ngovernment\nagencies, and other\nrelevant parties\nwhen monitoring\ncompliance to\ncustomer transport\nrequirements\n1.3. Read and interpret\ndata, instructions,\nprocedures, signs\nand other\ninformation relevant\nto the monitoring\ncompliance to\ncustomer transport\nrequirements\n1.4. Interpret and follow\noperational\ninstructions and\nprioritize work\n1.5. Complete\ndocumentation\n\n--- PDF PAGE 90 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n86\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nrelated to the\nmonitoring\ncompliance to\ncustomer transport\nrequirements\n1.6. Select and\nappropriately apply\ntechnology,\ninformation systems,\nprocedures,\nequipment, tools,\nmanpower and other\nresources to\ncomplete workplace\ntasks\n1.7. Adapt appropriately\nto cultural\ndifferences in the\nworkplace, including\nmodes of behavior\nand interactions with\nothers\n1.8. Check on status of\nwork activities and\nidentify areas for\nimprovement.\n1.9. Modify activities\ndepending on\ndiffering operational\ncontingencies, risk\nsituations and\nenvironments\n1.10. Work\nsystematically with\nrequired attention to\ndetails without injury\nto self or others, or\ndamage to goods or\nequipment\n2. Monitor\ntransport\nstatus of\ncargo\n2.1 Confirmation of\ndispatch of freight\nfrom origin country is\nobtained from\noverseas agent\n2.2 Arrival of cargo at port\nof entry is confirmed\nwith shipping line\n\n2.1 Relevant regulatory\nand code\nrequirements\nincluding\ncharacteristics, mass\nand load regulations\n2.2 Relevant OH&S\npolicies nd\nprocedures\n\n2.1 Communicate\neffectively with\ncustomers, suppliers,\ngovernment\nagencies, and other\nrelevant parties\n2.2 Coordinate and\nCollaborate with\ncustomers, suppliers,\ngovernment\nagencies, and other\nrelevant parties when\n\n--- PDF PAGE 91 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n87\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.3 Cargo in transit is\nregularly tracked and\ntraced in accordance\nwith workplace\nprocedure\n2.4 Processing of\ndocuments by\ndocumentation clerk\nand liaison staff is\nmonitored and\ncoordinated in\naccordance with\nworkplace procedures\nand timelines.\n2.5 Liquidation of\nexpenses of liaison\nand documentation\nclerk are checked in\naccordance with\nworkplace procedures\nand timelines.\n\n2.3 Workplace protocols\nand procedures for\ncoordinating\ncustomers’\nrequirements\n2.4 Strategies to\nimplement\ncontinuous\nimprovement\nprocesses\n2.5 Typical problems that\ncan occur when\ncoordinating\ncustomer transport\nrequirements and\nrelated appropriate\naction that can be\ntaken\n\ncoordinating\ncustomer transport\nrequirements\n2.3 Read and interpret\ndata, instructions,\nprocedures, signs\nand other information\nrelevant to the\ncoordinating\ncustomer transport\nrequirements\n2.4 Interpret and follow\noperational\ninstructions and\nprioritize work\n2.5 Adaptation skills\ntowards different\nkinds of people\n2.6 Promptly report\nand/or rectify any\nidentified problems\nthat may arise when\ncoordinating\ncustomer transport\nrequirements\n3. Report cargo\ntransport\nstatus\n3.1 Any deviation or\nirregularities in the\ntransport plan is\nreported and\ncoordinated with\nsuperior and other\nconcerned parties in\naccordance with\nworkplace procedure.\n3.2 Proof of delivery is\nprovided to the client,\nagent and other\nconcerned parties.\n3.3 Status of cargo is\ncommunicated to\nclient in accordance\nwith workplace\nprocedure.\n3.4 Statistical reports\nsubmitted by\ndocumentation clerk\nare validated and\nchecked prior to\nsubmission to\nsuperior.\n\n3.1. Relevant regulatory\nand code\nrequirements\nincluding\ncharacteristics,\nmass and load\nregulations\n3.2. Relevant OH&S and\nenvironmental\nprotection policies\nand procedures\n3.3. Workplace protocols\nand procedures for\ncoordinating\ncustomers’\nrequirements\n3.4. Strategies to\nimplement\ncontinuous\nimprovement\nprocesses\n3.5. Typical problems\nthat can occur when\ncoordinating\ncustomer transport\nrequirements and\n3.1. Communicate\neffectively with\ncustomers,\nsuppliers,\ngovernment\nagencies, and other\nrelevant parties\nwhen coordinating\nconfirmed customer\ntransport\nrequirements\n3.2. Coordinate and\nCollaborate with\ncustomers,\nsuppliers,\ngovernment\nagencies, and other\nrelevant parties\nwhen coordinating\ncustomer transport\nrequirements\n3.3. Read and interpret\ndata, instructions,\nprocedures, signs\nand other\ninformation relevant\n\n--- PDF PAGE 92 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n88\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nrelated appropriate\naction that can be\ntaken\n\nto the coordinating\ncustomer transport\nrequirements\n3.4. Interpret and follow\noperational\ninstructions and\nprioritize work\n3.5. Complete\ndocumentation\nrelated to the\ncoordinating\ncustomer transport\nrequirements\n3.6. Promptly report\nand/or rectify any\nidentified problems\nthat may arise when\ncoordinating\ncustomer transport\nrequirements\n\n--- PDF PAGE 93 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n89\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Shipping Instructions\n\nMay include:\n1.1 Freight routing\n1.2 Port of origin or loading\n1.3 Port of destination\n2. Overseas Agent\n\n2.1 Incoterms\n2.2 International partner\n2.3 Freight network member\n2.4 Own office or branch\n2.5 Origin or destination agent\n\n3. Final Transport Documents\n\nMay include:\n3.1 Delivery order\n3.2 Master bill of lading\n3.3 House bill of lading\n3.4 Rider Manifest\n3.5 Commercial invoice\n3.6 Packing list\n\n4. Any deviation or irregularities\n\nMay include:\n4.1 Shortlanded or shortshipped cargo\n4.2 Damaged cargo\n4.3 Erroneous documentation\n4.4 Lost documents\n4.5 Wrong freight computation\n4.6 Delayed loading, unloading, berthing and\narrival of vessel\n4.7 Late submission of e-manifest\n4.8 System failures\n\n5. Statistical Reports\n\nMay include:\n5.1 Government required reports\n5.2 Volume performance reports\n5.3 Graph presentation\n5.4 Historical performance reports\n\n--- PDF PAGE 94 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n90\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Confirmed customer requirements\n1.2 Organized freight arrangements\n1.3 Communicated with shipping agents and authorities\n1.4 Applied relevant legislation and workplace procedures\n1.5 Applied other relevant aspects of the range statement\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n2.4 Relevant and appropriate materials and equipment, and\napplicable documentation including workplace procedures,\nregulations, codes of practice and operation manuals\n2.5 Financial resources\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written test\n3.2 Direct observation\n3.3 Demonstration with questioning\n3.4 Interview\n3.5 Case study\n3.6 Work related project\n3.7 Portfolio assessment\n\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 95 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n91"
