        "source_text": "400311322\n\nUNIT DESCRIPTOR\n :\nThis unit covers the outcomes required to work effectively\nin a workplace characterized by diversity in terms of\nreligions, beliefs, races, ethnicities and other differences.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n1.1 Individual\ndifferences with\nclients, customers\nand fellow workers\nare recognized and\nrespected in\naccordance with\nenterprise policies\nand core values.\n1.2 Differences are\nresponded to in a\nsensitive and\nconsiderate\nmanner\n1.3 Diversity is\naccommodated\nusing appropriate\nverbal and non-\nverbal\ncommunication.\n1.1 Understanding\ncultural diversity in\nthe workplace\n1.2 Norms of behavior\nfor interacting and\ndialogue with\nspecific groups\n(e. g., Muslims and\nother non-\nChristians, non-\nCatholics,\ntribes/ethnic groups,\nforeigners)\n1.3 Different methods of\nverbal and non-\nverbal\ncommunication in a\nmulticultural setting\n1.1 Applying cross-\ncultural\ncommunication\nskills (i.e. different\nbusiness customs,\nbeliefs,\ncommunication\nstrategies)\n1.2 Showing affective\nskills – establishing\nrapport and\nempathy,\nunderstanding, etc.\n1.3 Demonstrating\nopenness and\nflexibility in\ncommunication\n1.4 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Work effectively\nin an\nenvironment\nthat\nacknowledges\nand values\ncultural diversity\n2.1 Knowledge, skills\nand experiences\nof others are\nrecognized and\ndocumented in\nrelation to team\nobjectives.\n2.2 Fellow workers are\nencouraged to\nutilize and share\ntheir specific\nqualities, skills or\nbackgrounds with\nother team\nmembers and\nclients to enhance\nwork outcomes.\n2.3 Relations with\ncustomers and\nclients are\nmaintained to\nshow that diversity\nis valued by the\nbusiness.\n2.1 Value of diversity in\nthe economy and\nsociety in terms of\nWorkforce\ndevelopment\n2.2 Importance of\ninclusiveness in a\ndiverse\nenvironment\n2.3 Shared vision and\nunderstanding of\nand commitment to\nteam,\ndepartmental, and\norganizational\ngoals and\nobjectives\n2.4 Strategies for\ncustomer service\nexcellence\n2.1 Demonstrating cross-\ncultural\ncommunication skills\nand active listening\n2.2 Recognizing diverse\ngroups in the\nworkplace and\ncommunity as\ndefined by divergent\nculture, religion,\ntraditions and\npractices\n2.3 Demonstrating\ncollaboration skills\n2.4 Exhibiting customer\nservice excellence\n3. Identify\ncommon issues\nin a\nmulticultural\nand diverse\nenvironment\n3.1 Diversity-related\nconflicts within\nthe workplace are\neffectively\naddressed and\nresolved.\n3.2 Discriminatory\nbehaviors towards\ncustomers/stakeho\nlders are\nminimized and\naddressed\naccordingly.\n3.3 Change\nmanagement\npolicies are in\nplace within the\norganization.\n3.1 Value, and leverage\nof cultural diversity\n3.2 Inclusivity and\nconflict resolution\n3.3 Workplace\nharassment\n3.4 Change\nmanagement and\nways to overcome\nresistance to change\n3.5 Advanced strategies\nfor customer service\nexcellence\n3.1 Addressing\ndiversity-related\nconflicts in the\nworkplace\n3.2 Eliminating\ndiscriminatory\nbehavior towards\ncustomers and co-\nworkers\n3.3 Utilizing change\nmanagement\npolicies in the\nworkplace\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Diversity\nThis refers to diversity in both the workplace and the\ncommunity and may include divergence in :\n1.1 Religion\n1.2 Ethnicity, race or nationality\n1.3 Culture\n1.4 Gender, age or personality\n1.5 Educational background\n2. Diversity-related conflicts\nMay include:\n2.1 Discriminatory behaviors\n2.2 Differences of cultural practices\n2.3 Differences of belief and value systems\n2.4 Gender-based violence\n2.5 Workplace bullying\n2.6 Corporate jealousy\n2.7 Language barriers\n2.8 Individuals being differently-abled persons\n2.9 Ageism (negative attitude and behavior towards\nold people)\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nAdjusted language and behavior as required by interactions\nwith diversity\n1.2\nIdentified and respected individual differences in colleagues,\nclients and customers\n1.3\nApplied relevant regulations, standards and codes of practice\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Manuals and policies on Workplace Diversity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning\n3.2\nGroup discussions and interactive activities\n3.3\nCase studies/problems involving workplace diversity issues\n3.4\nThird-party report\n3.5\nWritten examination\n3.6\nRole Plays\n4. Context for\nAssessment\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n18\n\nUNIT OF COMPETENCY :\nPROPOSE METHODS OF APPLYING LEARNING AND\nINNOVATION IN THE ORGANIZATION\n\n UNIT CODE :"
      },
