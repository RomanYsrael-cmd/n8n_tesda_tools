        "source_text": "400311325\n\nUNIT DESCRIPTO : This unit covers the knowledge, skills and attitudes\nrequired to interpret Occupational Safety and Health\npractices, set OSH work targets, and evaluate\neffectiveness of Occupational Safety and Health work\ninstructions\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\n Occupational\nSafety and\nHealth\npractices\n\n1.1 OSH work practices\nissues are identified\nrelevant to work\nrequirements\n1.2 OSH work standards and\nprocedures are\ndetermined based on\napplicability to nature of\nwork\n1.3 Gaps in work practices\nare identified related to\nrelevant OSH work\nstandards\n\n1.1. OSH work practices\nissues\n1.2. OSH work standards\n1.3. General OSH principles\nand legislations\n1.4. Company/ workplace\npolicies/ guidelines\n1.5. Standards and safety\nrequirements of work\nprocess and procedures\n1.1. Communicatio\nn skills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n2. Set OSH\nwork targets\n\n2.1 Relevant work information\nare gathered necessary to\ndetermine OSH work\ntargets\n2.2 OSH Indicators based on\ngathered information are\nagreed upon to measure\neffectiveness of\nworkplace OSH policies\nand procedures\n2.3 Agreed OSH indicators\nare endorsed for approval\nfrom appropriate\npersonnel\n2.4 OSH work instructions\nare received in\naccordance with\nworkplace policies and\nprocedures\n2.1. OSH work targets\n2.2. OSH Indicators\n2.3. OSH work instructions\n2.4. Safety and health\nrequirements of tasks\n2.5. Workplace guidelines\non providing feedback\non OSH and security\nconcerns\n2.6. OSH regulations\nHazard control\nprocedures\n2.7. OSH trainings relevant\nto work\n2.1.Communication\nskills\n2.2. Collaborating\nskills\n2.3. Critical thinking\nskills\n2.4. Observation\nskills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n29\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n\n3.1 OSH Practices are\nobserved based on\nworkplace\nstandards\n3.2 Observed OSH\npractices are\nmeasured against\napproved OSH\nmetrics\n3.3 Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based\non OSH work\nstandards\n\n3.1. OSH Practices\n3.2. OSH metrics\n3.3. OSH Evaluation\nTechniques\n3.4. OSH work\nstandards\n3.1. Critical thinking\nskills\n3.2. Evaluating skills\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Work\nPractices Issues\nMay include:\n1.1 Workers’ experience/observance on presence of work\nhazards\n1.2 Unsafe/unhealthy administrative arrangements (prolonged\nwork hours, no break-time, constant overtime, scheduling of\ntasks)\n1.3 Reasons for compliance/non-compliance to use of PPEs or\nother OSH procedures/policies/ guidelines\n2. OSH Indicators\nMay include:\n2.1 Increased of incidents of accidents, injuries\n2.2 Increased occurrence of sickness or health\ncomplaints/symptoms\n2.3 Common complaints of workers’ related to OSH\n2.4 High absenteeism for work-related reasons\n3. OSH Work\nInstructions\nMay include:\n3.1 Preventive and control measures, and targets\n3.2 Eliminate the hazard (i.e., get rid of the dangerous machine\n3.3 Isolate the hazard (i.e. keep the machine in a closed room\nand operate it remotely; barricade an unsafe area off)\n3.4 Substitute the hazard with a safer alternative (i.e., replace\nthe machine with a safer one)\n3.5 Use administrative controls to reduce the risk (i.e. give\ntrainings on how to use equipment safely; OSH-related\ntopics, issue warning signages, rotation/shifting work\nschedule)\n3.6 Use engineering controls to reduce the risk (i.e. use safety\nguards to machine)\n3.7 Use personal protective equipment\n3.8 Safety, Health and Work Environment Evaluation\n3.9 Periodic and/or special medical examinations of workers\n4. OSH metrics\nMay include:\n4.1 Statistics on incidence of accidence and injuries\n4.2 Morbidity (Type and Number of Sickness)\n4.3 Mortality (Cause and Number of Deaths)\n4.4 Accident Rate\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n31\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Identify OSH work practices issues relevant to\nwork requirements\n1.2. Identify gaps in work practices related to relevant\nOSH work standards\n1.3. Agree upon OSH Indicators based on gathered\ninformation to measure effectiveness of workplace\nOSH policies and procedures\n1.4. Receive OSH work instructions in accordance\nwith workplace policies and procedures\n1.5. Compare Observed OSH practices with against\napproved OSH work instructions\n1.6. Assess findings regarding effectiveness based on\nOSH work standards\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Facilities, materials, tools and equipment\nnecessary for the activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n3.3 Written exam\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place\nor in a simulated work place setting\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n32\nUNIT OF COMPETENCY\n: EVALUATE ENVIRONMENTAL WORK PRACTICES\n\nUNIT CODE\n:"
