    {
      "source_text": "1 TRAINING REGULATIONS FOR MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NC III"
    },
    {
      "source_text": "SECTION 1 MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NC III QUALIFICATION"
    },
    {
      "source_text": "The MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NC III Qualification consists of competencies that a person must achieve to provide transport information to customers, assist in marketing and developing services, assess and confirm freight transport requirements, and monitor and coordinate transport execution and documentation."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "UNIT CODE 400311319 400311320 400311321 400311322 400311323 400311324 400311325 400311326 400311327"
    },
    {
      "source_text": "BASIC COMPETENCIES Lead in workplace communication Lead small teams Apply critical thinking and problem solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs)"
    },
    {
      "source_text": "UNIT CODE COMMON COMPETENCIES MTO491201 Apply freight forwarding documentation services and workplace procedures MTO491202 Perform workplace security and safety MTO491203 Provide effective customer service MTO491204 Contribute to quality system MTO491205 Perform computer operations"
    },
    {
      "source_text": "UNIT CODE CORE COMPETENCIES MTO333301 Provide transport information to customers MTO333302 Promote and develop freight services to customers MTO333303 MTO333304 Evaluate and confirm customer freight transport requirements Monitor and coordinate transport execution and documentation"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be: ❑ Import Coordinator"
    },
