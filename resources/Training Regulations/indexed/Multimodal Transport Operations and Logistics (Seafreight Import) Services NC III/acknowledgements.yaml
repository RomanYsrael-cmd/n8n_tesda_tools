 at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n46\nUNIT OF COMPETENCY :\nPERFORM WORKPLACE SECURITY AND SAFETY\n\nUNIT CODE\n :\nMTO432202\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to follow\nsecurity procedures in the freight forwarding and\ndocumentation services. It includes checking and\nmaintaining the security of the workplace and personnel,\nidentifying and responding to security threats or situations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.Maintain\nsecurity of the\nworkplace\n\n1.1 Workplace is\nsecured within\nspecified locations\nin accordance with\nworkplace security\nprocedures and\napplicable security\nregulations\n1.2 Seals, locks and\nother security\nmeasures in the\nworkplace are\nchecked and\nmaintained in\naccordance with\nworkplace safety\nand security\nprocedures\n1.3 Signs of attempted\nentry, theft, or\ninterference are\nrecognized and\nreported in\naccordance with\nworkplace security\nprocedures\n1.4 Any breaches of\nsecurity\nrequirements are\nreported promptly to\ndesignated\npersonnel in\naccordance with\nworkplace safety\nand security\nprocedures\n1.1 Applicable\ntransport security\nlegislation\nincluding\nrelevant\ninternational,\nnational, state\nand territory\nacts, regulations\ncodes and/or\nguidelines\n1.2 Relevant\nworkplace\nsecurity program\nand policies and\nprocedures for\nresponding to\nsecurity threats,\nsituations and\nemergencies\n1.3 Relevant\nquarantine and\nbond regulations\nand\nrequirements\n1.4 Common\nsecurity threats\nand incidents\nthat may occur in\nthe workplace\nand related roles\nand\nresponsibilities of\npersonnel when\nreporting them\nand responding\nto them\n1.1 Communicating\neffectively with\nconcerned parties\nwhen following\nsecurity\nprocedures\n1.2 Reading and\ninterpreting\ninstructions,\nprocedures,\napplicable\nregulatory\nrequirements,\nlabels, markings,\nID cards and\nother information\nrelevant to\nworkplace safety\nand security\n1.3 Completing\nrequired\ndocumentation\nand reports\nrelated to safety\nand security\nprocedures\n1.4 Applying\nprocedures for\nsafety, security\nchecks and\nprecautions as\nper limits of role\nand\nresponsibilities\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n47\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.5 Relevant OS&H\nand\nenvironmental\nprotection\nprocedures and\nguidelines\n1.6 Common\nsecurity\nproblems that\nmay occur when\ncarrying out\noperations in the\ntransport and\nlogistics\nindustries, and\naction that can\nbe taken to\naddress and\nresolve the\nproblems.\n2 Identify a\nsecurity\nthreat or\nsituation\n\n2.1 Security threat or\nsituation is promptly\nidentified and\nassessed and\nresponse is\nprioritized in\naccordance with the\nworkplace security\nprogram and\nprocedures\n2.2 Implications of the\nsecurity threat or\nsituation are\nevaluated in\naccordance with\nworkplace security\nprogram and\nprocedures\n\n2.1Applicable\ntransport security\nlegislation\nincluding\nrelevant\ninternational,\nnational, state\nand territory\nacts, regulations\ncodes and/or\nguidelines\n2.2Relevant\nworkplace\nsecurity program\nand policies and\nprocedures for\nresponding to\nsecurity threats,\nsituations and\nemergencies\n2.3Relevant\nquarantine and\nbond regulations\nand\nrequirements\n2.4Common\nsecurity threats\n2.1Identifying and\nsolving and/or\nreporting\nproblems that\narise when\nfollowing security\nprocedures\n2.2Recognizing signs\nof security threats\nand situations\n2.3Responding\nappropriately to\ncritical situations\n2.4 Risk\nmanagement\nskills to avoid or\nprevent any threat\nwhere possible\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC