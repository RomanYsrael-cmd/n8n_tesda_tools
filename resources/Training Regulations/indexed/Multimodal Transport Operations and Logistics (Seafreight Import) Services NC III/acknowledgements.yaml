      "source_text": "91 SECTION 3 TRAINING ARRANGEMENT"
    },
    {
      "source_text": "This set of standards provides Technical and Vocational Education and Training (TVET) providers with information and other important requirements to consider when designing training programs for MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES NC III."
    },
    {
      "source_text": "This includes information on curriculum design; training delivery; trainee entry requirements; tools and equipment; training facilities; and trainer’s qualification and institutional assessment. 3.1 CURRICULUM DESIGN"
    },
    {
      "source_text": "TESDA shall provide the training on the development of competency-based curricula to enable training providers develop their own curricula with the components mentioned below."
    },
    {
      "source_text": "Delivery of knowledge requirements for the basic, common and core units of competency specifically in the areas of mathematics, science/technology, communication/language, environment and other academic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to include Technology, Science, Math, English/Communication and Safety to Environment. Includes also green technology, issues on health and drugs and cater to person with disabilities (PWD’s) Course Title: MULTIMODAL TRANSPORT OPERATION NC Level: NC III AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES"
    },
    {
      "source_text": "Nominal Training Duration:"
    },
    {
      "source_text": "No. of Hours Coverage 40 Hrs. Basic Competencies 48 Hrs. Common Competencies 65 Hrs. Core Competencies 153 Hrs. 108 Hrs. 261 Hrs."
    },
    {
      "source_text": "SIL Total"
    },
    {
      "source_text": "-- PDF PAGE 96 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC III Promulgated (12/17/2019)"
    },
    {
      "source_text": "92 Course Description:"
    },
    {
      "source_text": "This course is designed to provide the learner with knowledge, practical skills and attitude, applicable in providing transport information to customers, promoting and developing services to customers, evaluating and confirming customer freight transport requirements and monitoring and coordinating transport execution and documentation. This include classroom learning activities and practical work in actual work site or simulation area."
    },
    {
      "source_text": "The training institution has the option to introduce other methodologies to deliver the program or the course and to partner with other individuals/organizations that would be able to provide training resources in the conduct of the course."
    },
    {
      "source_text": "Upon completion of the course, the learners are expected to demonstrate the above- mentioned competencies to be employed. To obtain this, all units prescribed for this qualification must be achieve."
    },
