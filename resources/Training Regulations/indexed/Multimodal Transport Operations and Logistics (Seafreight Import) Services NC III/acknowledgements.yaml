      "source_text": "85 UNIT OF COMPETENCY: MONITOR AND COORDINATE TRANSPORT EXECUTION AND DOCUMENTATION UNIT CODE : MTO333304"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit involves the skills and knowledge required to monitor and coordinate the transport execution and documentation of cargo, in compliance with confirmed customer’s requirements, freight arrangements and to communicate with overseas agents and other entities. Legislative, regulatory or certification requirements are applicable to this unit."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Coordinate execution of transport plan"
    },
    {
      "source_text": "1.1 Shipping instruction is provided to overseas agent and other concerned parties 1.2 Schedule of pick-up, departure and arrival dates and routes are determined in accordance with agreed transport plan. 1.3 Draft of transport documents are obtained from overseas agent for checking of accuracy in accordance with shipping instructions and workplace procedures 1.4 Final transport documents and other shipping requirements are obtained immediately upon departure 1.5 Final transport documents are provided to documentation clerk and liaison staff for proper documentation and processing."
    },
    {
      "source_text": "1.1. Relevant regulatory and code requirements including characteristics, mass and load regulations 1.2. Environmental protection policies and procedures 1.3. Workplace protocols and procedures for the monitoring to customers requirements customer transport requirements 1.4. Strategies to implement continuous improvement processes 1.5. Typical problems that can occur when assessing and confirming customer transport requirements and related appropriate action that can be taken"
    },
