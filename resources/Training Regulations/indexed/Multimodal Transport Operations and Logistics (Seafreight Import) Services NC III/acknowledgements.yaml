    {
      "source_text": "UNIT OF COMPETENCY : PROPOSE METHODS OF APPLYING LEARNING AND INNOVATION IN THE ORGANIZATION"
    },
    {
      "source_text": "UNIT CODE : 400311323"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to assess general obstacles in the application of learning and innovation in the organization and to propose practical methods of such in addressing organizational challenges."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Assess work procedures, processes and systems in terms of innovative practices 1.1. Reasons for innovation are incorporated to work procedures. 1.2. Models of innovation are researched. 1.3. Gaps or barriers to innovation in one’s work area are analyzed. 1.4. Staff who can support and foster innovation in the work procedure are identified."
    },
    {
      "source_text": "1.1 Seven habits of highly effective people. 1.2 Character strengths that foster innovation and learning (Christopher Peterson and Martin Seligman, 2004) 1.3 Five minds of the future concepts (Gardner, 2007). 1.4 Adaptation concepts in neuroscience (Merzenich, 2013). 1.5 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992)."
    },
    {
      "source_text": "1.1 Demonstrating collaboration and networking skills. 1.2 Applying basic research and evaluation skills 1.3 Generating insights on how to improve organizational procedures, processes and systems through innovation."
    },
    {
