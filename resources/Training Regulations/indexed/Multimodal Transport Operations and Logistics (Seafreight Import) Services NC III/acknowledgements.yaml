    {
      "source_text": "UNIT OF COMPETENCY : APPLY FREIGHT FORWARDING DOCUMENTATION SERVICES AND WORKPLACE PROCEDURES UNIT CODE : MTO432201"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit involves the skills and knowledge required to apply freight forwarding and documentation services and workplace procedures. It includes identifying major areas of the workplace in terms of workload, ethical practices, and personal daily routine."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Identify major areas of the workplace"
    },
    {
      "source_text": "1.1 The layout of the workplace, the flow of materials and goods/stocks (where relevant) and the workplace procedures in each work area are identified 1.2 Organizational structure of the workplace and the relationship of structure to each occupation and classification grouping is outlined 1.3 Individual responsibilities under agents, vendors, & clients agreements are identified and acted on in the conduct of assigned duties 1.4 Workplace hazards are identified and related hazard minimization procedures followed 1.5 Relevant personal protective equipment (PPE) are identified and 1.1 Applicable transport security legislation including relevant international, national, state and territory acts, regulations codes and/or guidelines 1.2 Relevant workplace security program, policies and procedures for responding to security threats, situations and emergencies 1.3 Relevant quarantine and bond regulations and requirements 1.4 Common security threats and incidents that may occur in the workplace and related roles and responsibilities 1.1 Communicating effectively with others when completing workplace orientation and induction procedures 1.2 Reading and interpreting instructions, procedures, information and signs relevant to work activities 1.3 Interpreting and following operational instructions and prioritize work 1.4 Working collaboratively with others when completing workplace orientation 1.5 Applying precautions and required action to minimize, control or eliminate hazards that may exist during work activities"
    },
