      "source_text": "Acumen Ability to make good judgement and quick decisions, typically in a particular domain Aural Relating to ear or sense of hearing Brainstorm A spontaneous group discussion to produce ideas and ways of solving problems Coherent Logical and consistent Collate The grouping together of related items to provide a record of events and facilitate further processing Context The circumstances that form the setting for an event, statement, or idea and terms to which it can be fully understood or assessed Convention An agreement between countries particularly matters, especially one less formal than a treaty Discriminating Having or showing refined taste or judgment Entrepreneurial Having to do with the creation and development of economic ventures Ergonomic Relating to or designed for efficiency and comfort in the working environment Fiduciary Involving trust, especially with regards to the relationship of trustee and a beneficiary Fora Plural of forum. Place, meeting or medium where ideas and views in a particular issue can be exchanged Interference The act or instance of hindering, obstructing or impeding Interpersonal Relating to the interactions between individuals Intrapersonal Existing or occurring within the self or within one's mind Judicious Having, showing, or done with good judgment or sense Mechanism A natural or established process by which something takes place or is brought about Parameter A numerical or other measurable factor forming one of a set that defines a system or sets the conditions of its operation Pareto Analysis Formal technique that helps prioritize decisions so leaders know which one will have the greater influence and least impact on their overall goals Peripheral A secondary or minor importance Pillaging Steal something using violence especially in war Portfolio A compilation of materials that exemplifies your beliefs, skills, qualifications, education, training and experiences. It provides insight into your personality and work ethics Protocol Attitudes, etiquette rules and guidelines for behavior that encompass the best way to act at work Rapport In a good understanding of someone and an ability to communicate well with them Simulated Imitating the conditions of something Strategic plan A document used to communicate with the organization its goals, the actions needed to achieve them Strategies A plan of action or policy designed to achieve major or overall aim"
