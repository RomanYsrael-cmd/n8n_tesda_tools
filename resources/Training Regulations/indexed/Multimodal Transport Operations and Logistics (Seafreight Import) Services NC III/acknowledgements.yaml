O-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n90\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Confirmed customer requirements\n1.2 Organized freight arrangements\n1.3 Communicated with shipping agents and authorities\n1.4 Applied relevant legislation and workplace procedures\n1.5 Applied other relevant aspects of the range statement\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n2.4 Relevant and appropriate materials and equipment, and\napplicable documentation including workplace procedures,\nregulations, codes of practice and operation manuals\n2.5 Financial resources\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written test\n3.2 Direct observation\n3.3 Demonstration with questioning\n3.4 Interview\n3.5 Case study\n3.6 Work related project\n3.7 Portfolio assessment\n\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 95 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n91\nSECTION 3 TRAINING ARRANGEMENT\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for MULTIMODAL TRANSPORT OPERATION AND LOGISTICS (SEAFREIGHT\nIMPORT)\nSERVICES NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and institutional\nassessment.\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language,\nenvironment and other academic subjects shall be contextualized. To this end, TVET providers\nshall develop a Contextual Learning Matrix (CLM) to include Technology, Science, Math,\nEnglish/Communication and Safety to Environment. Includes also green technology, issues on\nhealth and drugs and cater to person with disabilities (PWD’s)\nCourse Title: MULTIMODAL TRANSPORT OPERATION NC Level: NC III\n AND LOGISTICS (SEAFREIGHT IMPORT) SERVICES\n\nNominal Training Duration:\n\nNo. of Hours\nCoverage\n40 Hrs. Basic Competencies\n48 Hrs. Common Competencies\n65 Hrs. Core Competencies\n153 Hrs.\n108 Hrs.\n261 Hrs.\n\nSIL\nTotal\n\n--- PDF PAGE 96 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n92\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in providing transport information to customers, promoting and developing\nservices to customers, evaluating and confirming customer freight transport requirements and\nmonitoring and coordinating transport execution and documentation. This include classroom\nlearning activities and practical work in actual work site or simulation area.\n\n The training institution has the option to introduce other methodologies to deliver the\nprogram or the course and to partner with other individuals/organizations that would be able to\nprovide training resources in the conduct of the course.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 97 ---\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n93\nBASIC COMPETENCIES – NATIONAL CERTIFICATE NC III\n(40 HOURS)\n\n