ategies\n2.3 Basic market and\nfeasibility studies\n2.4 Basic business\nethics\n2.5 Telephone\ntechniques\n2.1 Building customer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/\ntarpaulins, flyers,\nsocial media,\netc.)\n2.4 Customer service\nskills\n2.5 Telemarketing\nskills\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n36\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Apply budgetting\nand financial\nmanagement\nskills\n3.1 Enterprise is built up and\nsustained through\njudicious control of cash\nflows.\n3.2 Profitability of enterprise\nis ensured though\nappropriate internal\ncontrols.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are avoided.\n3.1 Cash flow\nmanagement\n3.1 Basic financial\nmanagement\n3.2 Basic financial\naccounting\n3.3 Business internal\ncontrols and\nprotocols\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting basic\nfinancial\nstatements\n3.3 Preparing\nbusiness plans\n3.4 Budgetting skills\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business strategies\nMay include:\n1.1. Developing/Maintaining niche market\n1.2. Use of organic/healthy ingredients\n1.3. Environment-friendly and sustainable practices\n1.4. Offering both affordable and high-quality products and\nservices\n1.5. Promotion and marketing strategies (e. g., on-line\nmarketing)\n2. Business operations May include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n4. Promotional/\nAdvertising\ninitiatives\nMay include:\n4.1\nUse of tarpaulins, brochures, and/or flyers\n4.2\n Sales, discounts and easy payment terms\n4.3\nUse of social media/Internet\n4.4\n“Service with a smile”\n4.5\nExtra attention to regular customers\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n38\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated basic entrepreneurial skills\n1.2 Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n1.3 Demonstrated ability to manage/operate a\nmicro/small-scale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate\nthe required tasks\n2.3 References and manuals\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Portfolio assessment with interview\n3.4 Case problems\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nMTOL SERVICES NC III\nPromulgated (12/17/2019)\n\n39\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY FREIGHT FORWARDING DOCUMENTATION\nSERVICES AND WORKPLACE PROCEDURES\nUNIT CODE\n :\nMTO432201\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to apply\nfreight forwarding and documentation services and\nworkplace procedures. It includes identifying major areas of\nthe workplace in terms of workload, ethical practices, and\npersonal daily routine.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify major\nareas of the\nworkplace\n\n1.1 The layout of the\nworkplace, the flow\nof materials and\ngoods/stocks\n(where relevant)\nand the workplace\nprocedures in each\nwork area are\nidentified\n1