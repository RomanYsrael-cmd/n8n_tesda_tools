    {
      "source_text": "9 UNIT OF COMPETENCY : APPLY CRITICAL THINKING AND PROBLEM-SOLVING TECHNIQUES IN THE WORKPLACE"
    },
    {
      "source_text": "UNIT CODE : 400311321"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to solve problems in the workplace including the application of problem solving techniques and to determine and resolve the root cause/s of specific problems in the workplace."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Examine specific workplace challenges 1.1 Variances are examined from normal operating parameters; and product quality. 1.2 Extent, cause and nature of the specific problem are defined through observation, investigation and analytical techniques. 1.3 Problems are clearly stated and specified. 1.1 Competence includes a thorough knowledge and understanding of the process, normal operating parameters, and product quality to recognize non-standard situations. 1.2 Competence to include the ability to apply and explain, enough for the identification of fundamental causes of specific workplace challenges. 1.3 Relevant equipment and operational processes. 1.4 Enterprise goals, targets and measures. 1.5 Enterprise quality OHS and environmental requirement. 1.6 Enterprise information systems and data collation 1.7 Industry codes and standards. 1.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information) in examining specific challenges in the workplace. 1.2 Identifying extent and causes of specific challenges in the workplace."
    },
    {
      "source_text": "-- PDF PAGE 14 --- TESDA-SOP-QSO-01-F08 MTOL SERVICES NC III Promulgated (12/17/2019)"
    },
