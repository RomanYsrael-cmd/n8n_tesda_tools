      "source_text": "REQUIRED SKILLS 3. Formulate resolutions to specific workplace challenges 3.1 All possible options are considered for resolution of the problem. 3.2 Strengths and weaknesses of possible options are considered. 3.3 Corrective actions are determined to resolve the problem and possible future causes. 3.4 Action plans are developed identifying measurable objectives, resource needs and timelines in accordance with safety and operating procedures 3.1 Competence to include the ability to apply and explain, sufficient for the identification of fundamental cause, determining the corrective action and provision of recommendations 3.2Relevant equipment and operational processes 3.3 Enterprise goals, targets and measures 3.4 Enterprise quality OSH and environmental requirement 3.5 Principles of decision making strategies and techniques 3.6 Enterprise information systems and data collation 3.7 Industry codes and standards 3.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information) in examining specific challenges in the workplace. 3.2 Identifying extent and causes of specific challenges in the workplace. 3.3 Providing clear-cut findings on the nature of each identified workplace challenges. 3.4 Devising, communicating, implementing and evaluating strategies and techniques in addressing specific workplace challenges."
