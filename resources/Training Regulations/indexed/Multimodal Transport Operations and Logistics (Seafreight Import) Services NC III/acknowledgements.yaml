    },
    {
      "source_text": "2.1 Relevant work information are gathered necessary to determine OSH work targets 2.2 OSH Indicators based on gathered information are agreed upon to measure effectiveness of workplace OSH policies and procedures 2.3 Agreed OSH indicators are endorsed for approval from appropriate personnel 2.4 OSH work instructions are received in accordance with workplace policies and procedures 2.1. OSH work targets 2.2. OSH Indicators 2.3. OSH work instructions 2.4. Safety and health requirements of tasks 2.5. Workplace guidelines on providing feedback on OSH and security concerns 2.6. OSH regulations Hazard control procedures 2.7. OSH trainings relevant to work 2.1.Communication skills 2.2. Collaborating skills 2.3. Critical thinking skills 2.4. Observation skills"
