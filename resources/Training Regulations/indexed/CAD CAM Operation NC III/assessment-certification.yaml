  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of CAD/CAM Operation NC III, the\ncandidate must demonstrate competence in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nThe qualification of CAD/CAM Operation NC III may be attained through:\n\n4.2.1 Acquisition of COC in\n\n 4.2.1.1 Create drawing using CAD software\n\n4.2.2 Demonstration of competence through project-type\n assessment covering the following units\n\n 4.2.2.1 Create drawing using CAD software\n 4.2.2.2 Apply CAD/CAM program\n\nNote:\nCandidates who are holders of unexpired COCs in Create drawing\nusing CAD software (CAD Operation) leading to CAD/CAM Operation\nNC III may undergo only the assessment for the unit Apply CAD/CAM\nprogram. The assessor, however, may probe the candidate for\nhis/her knowledge and skills on CAD operation, particularly along\nmechanical drafting.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.4.2.\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 66 ---\nTR – CAD CAM Operation NC III\n\n64\n\nSet-up CNC milling\nmachine, work- piece and\ncutting tools\nWrite basic CNC lathe\nmachine program\nPerform basic CNC lathe\nmachine operations\nCORE\nCOMPETENCIES\nCompetency Map\nMetals and Engineering Sector\nReceive and respond\nto workplace\ncommunication\nLead in workplace\ncommunication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\nParticipate in\nworkplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team and\nindividual\nApply problem-solving\ntechniques in the\nworkplace\nDemonstrate\nwork values\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply safety\npractices\nPerform routine\nhousekeeping\nMeasure workpiece\n(Basic)\nInterpret working\ndrawings and\nsketches\nSelect and cut\nworkshop materials\nPerform shop\ncomputations (Basic)\nPerform preventive\nand corrective\nmaintenance\nPerform shop\ncomputations\n(Advanced)\nPerform shop\ncomputations\n(Intermediate)\nMeasure workpiece\nusing gages and\ncomparators\nMeasure workpiece\nusing angular\nmeasuring instruments\nPractice occupational\nhealth and\nsafety procedures\nDevelop and practice\nnegotiation skills\nUse relevant\ntechnologies\nCollect, analyze\nand organize\ninformation\nPlan and\norganize work\nPractice career\nprofessionalism\nUse mathematical\nconcepts and\ntechniques\nPromote\nenvironmental\nprotection\nPractice\nhousekeeping\nprocedures\nTurn workpiece\n(Basic)\nTurn workpiece\n(Intermediate)\nMill workpiece\n(Basic)\nMill workpiece\n(Intermediate)\nGrind workpiece\n(Basic)\nPerform bench work\n(Basic)\nGrind workpiece\n(Complex)\nPerform bench work\n(Complex)\nTurn workpiece\n(Advanced)\nMill workpiece\n(Advanced)\nCAD/CAM Operation NC III\nSet-up CNC lathe\nmachine, work- piece and\ncutting tools\nWrite basic CNC milling\nmachine program\nPerform basic CNC milling\nmachine operations\nSet-up multiple-axis CNC\nlathe machine, workpiece\nand cutting tools\nWrite advanced CNC\nLathe Machine program\nPerform advanced CNC\nLathe Machine operations\nSet-up multiple-axis CNC\nmilling machine, work-piece\nand cutting tools\nWrite advanced CNC\nMilling machine program\nPerform advanced CNC\nMilling Machine operation\nPrepare cost\nestimates\nApply CAD/CAM\nprogram\nCreate drawing using\nCAD software\nOperate a\npersonal\ncomputer\nSet-up CNC milling\nmachine, work- piece and\ncutting tools\nWrite basic CNC lathe\nmachine program\nPerform basic CNC lathe\nmachine operations\nCORE\nCOMPETENCIES\nCompetency Map\nMetals and Engineering Sector\nCompetency Map\nMetals and Engineering Sector\nReceive and respond\nto workplace\ncommunication\nReceive and respond\nto workplace\ncommunication\nLead in workplace\ncommunication\nLead in workplace\ncommunication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\nSolve problems\nrelated to\nworkplace activities\nParticipate in\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nUtilize specialist\ncommunication skills\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team and\nindividual\nDevelop team and\nindividual\nApply problem-solving\ntechniques in the\nworkplace\nApply problem-solving\ntechniques in the\nworkplace\nDemonstrate\nwork values\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply safety\npractices\nApply safety\npractices\nPerform routine\nhousekeeping\nPerform routine\nhousekeeping\nMeasure workpiece\n(Basic)\nMeasure workpiece\n(Basic)\nInterpret working\ndrawings and\nsketches\nInterpret working\ndrawings and\nsketches\nSelect and cut\nworkshop materials\nSelect and cut\nworkshop materials\nPerform shop\ncomputations (Basic)\nPerform shop\ncomputations (Basic)\nPerform preventive\nand corrective\nmaintenance\nPerform preventive\nand corrective\nmaintenance\nPerform shop\ncomputations\n(Advanced)\nPerform shop\ncomputations\n(Advanced)\nPerform shop\ncomputations\n(Intermediate)\nPerform shop\ncomputations\n(Intermediate)\nMeasure workpiece\nusing gages and\ncomparators\nMeasure workpiece\nusing gages and\ncomparators\nMeasure workpiece\nusing angular\nmeasuring instruments\nPractice occupational\nhealth and\nsafety procedures\nPractice occupational\nhealth and\nsafety procedures\nDevelop and practice\nnegotiation skills\nUse relevant\ntechnologies\nUse relevant\ntechnologies\nCollect, analyze\nand organize\ninformation\nCollect, analyze\nand organize\ninformation\nPlan and\norganize work\nPractice career\nprofessionalism\nPractice career\nprofessionalism\nUse mathematical\nconcepts and\ntechniques\nPromote\nenvironmental\nprotection\nPromote\nenvironmental\nprotection\nPractice\nhousekeeping\nprocedures\nTurn workpiece\n(Basic)\nTurn workpiece\n(Intermediate)\nMill workpiece\n(Basic)\nMill workpiece\n(Intermediate)\nGrind workpiece\n(Basic)\nPerform bench work\n(Basic)\nGrind workpiece\n(Complex)\nPerform bench work\n(Complex)\nTurn workpiece\n(Advanced)\nMill workpiece\n(Advanced)\nCAD/CAM Operation NC III\nSet-up CNC lathe\nmachine, work- piece and\ncutting tools\nWrite basic CNC milling\nmachine program\nPerform basic CNC milling\nmachine operations\nSet-up multiple-axis CNC\nlathe machine, workpiece\nand cutting tools\nWrite advanced CNC\nLathe Machine program\nPerform advanced CNC\nLathe Machine operations\nSet-up multiple-axis CNC\nmilling machine, work-piece\nand cutting tools\nWrite advanced CNC\nMilling machine program\nPerform advanced CNC\nMilling Machine operation\nPrepare cost\nestimates\nApply CAD/CAM\nprogram\nCreate drawing using\nCAD software\nOperate a\npersonal\ncomputer\n\n--- PDF PAGE 67 ---\nTR – CAD CAM Operation NC III\n\n65\nDefinition of Terms\n\nbench work\nthe operations incident to the process of laying out, fitting,\nassembling, etc… when the work is placed on the bench or in\na bench vise\n\nboring\nis the operation of enlarging a hole by means of an adjustable\ncutting tool with only one cutting edge\n\nchipping\nis the operation of removing/cutting metal using hammer and\nchisel\n\ncounter boring\nis the operation of enlarging the end of a hole cylindrically\n\ndrilling\nis the operation of producing a circular hole by removing solid\nmetal\n\nfacing\nthe lathe operation of finishing the ends of the work, to make\nthe piece the right length. Also known as squaring\n\ngrinding\nrefers to the removal of material from a workpiece with\ngrinding wheel\n\nlaying out\nterm used to include the marking or scribling of center points,\ncircles, arcs, or straight lines upon metal surfaces, either\ncurved or flat, for the guidance of the worker\n\nmilling\nrefers to removal of metal by feeding a workpiece through the\nperiphery of rotating circular cutter\n\nreaming\nis an operation of sizing and finishing a hole by means of a\ncutting tool having several cutting edges. reaming serves to\nmake the hole smoother, straighter, and more accurate\n\nspot-facing\nis the operation of smoothing and squaring the surface\naround a hole\n\ntapping\nis the operation of forming internal threads by means of a tool\ncalled tap\n\nturning\nrefers to shaping a workpiece by gripping it in a workholding\ndevice and rotating it under power against a suitable cutting\ntool\n\nCNC machining\nrefers to the fabrication of work piece either turning, milling or\nany other machining process with the use of Computerized\nNumerically Controlled machine tools\n\nProgramming\nthe process of coding machining conditions in which\ninformations such as cutter dimensions, cutter movement ,\nprocessing orders, federate or spindle speed all under fixed\nregulation or specified format which refers to the workpiece\ndrawing to instruct Numerically Controlled machine tool\n\nCAD\nComputer Aided Design – the use of graphics-oriented\ncomputer software for designing and drafting applications\n\nCAM\nComputer Aided Manufacturing- computer software that\ngenerates programs for the operation of NC (numerical\ncontrol) machine tools\n\n--- PDF PAGE 68 ---\nTR – CAD CAM Operation NC III\n\n66\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nINDUSTRY EXPERTS:\n\nDR. FELICIANO JAPITANA\nChief, MWTD\nMetal Industry Research and Development\nCenter\nEngr. ROGELITO AQUINO\nEngineer III, MSFS\nMetal Industry Research and\nDevelopment Center\nRAMON MARTIN\nCNC Expert\nMetal Industry Research and Development\nCenter\nHECTOR D. MALONZO\nPresident\nHDM Technologies, Inc.\n\nALANO CABANBAN\nVICTORIANO YAP\nSME\nCHARLIE POLICARPIO\nSME\nOSCAR UNAS\nSME\nTIMOTEO INTALAN\nMetalworking Industries Association of the\nPhilippines, Inc.\nANTONIO TERANIA\nMetalworking Industries Association of\nthe Philippines, Inc.\nVIRGILIO LANZUELA\nPresident / General Manager\nVL Industech Corporation\nENRIQUE PINGOL\nPAA\n\n--- PDF PAGE 69 ---\nTR – CAD CAM Operation NC III\n\n67\nTECHNICAL EXPERTS:\n\nCHARLES A. ANTONIO\nCEMMT Trainer\nTTCTCE\nMODESTO A. VELASQUEZ Jr.\nCEMMT Trainer\nTTCTCE\nFERDINAND E. ESTACIO\nSupervising TESD Specialist / Trainer\nNTTA\nRAMON R. SANTIAGO\nCEMMT Trainer\nTTCTCE\nLORENZO A. LADIA\nTrainer\nNTTA\nNOEL K. MALABAGO\nCEMMT Trainer\nTESDA – RTC\nGIL D. GONZALES\nCEMMT Focal Person\nTESDA – RTC XI\nPABLO H. CORTEZ Jr.\nCEMMT Focal Person\nTESDA – RTC VI\nROGEL M. BORBON\nCEMMT Trainer\nTESDA – RTC\nJIMMY NILLAS\nCEMMT Trainer/ MIAP\nTESDA – RTC VII\n\nEMILIA B. MAGAAN\nCEMMT Trainer\nTESDA – RTC IV-A\n\nJULFORD C. ABASOLO\nSupervising TESD Specialist\nTTCTCE\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQualification and Standards Office (QSO)"
