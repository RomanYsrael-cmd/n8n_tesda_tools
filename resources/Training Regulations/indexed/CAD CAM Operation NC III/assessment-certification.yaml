d metal facing the lathe operation of finishing the ends of the work, to make the piece the right length. Also known as squaring grinding refers to the removal of material from a workpiece with grinding wheel laying out term used to include the marking or scribling of center points, circles, arcs, or straight lines upon metal surfaces, either curved or flat, for the guidance of the worker milling refers to removal of metal by feeding a workpiece through the periphery of rotating circular cutter reaming is an operation of sizing and finishing a hole by means of a cutting tool having several cutting edges. reaming serves to make the hole smoother, straighter, and more accurate spot-facing is the operation of smoothing and squaring the surface around a hole tapping is the operation of forming internal threads by means of a tool called tap turning refers to shaping a workpiece by gripping it in a workholding device and rotating it under power against a suitable cutting tool CNC machining refers to the fabrication of work piece either turning, milling or any other machining process with the use of Computerized Numerically Controlled machine tools Programming the process of coding machining conditions in which informations such as cutter dimensions, cutter movement , processing orders, federate or spindle speed all under fixed regulation or specified format which refers to the workpiece drawing to instruct Numerically Controlled machine tool CAD Computer Aided Design – the use of graphics-oriented computer software for designing and drafting applications CAM Computer Aided Manufacturing- computer software that generates programs for the operation of NC (numerical control) machine tools --- PDF PAGE 68 --- TR – CAD CAM Operation NC III 66 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who rendered their time and expertise to the deve