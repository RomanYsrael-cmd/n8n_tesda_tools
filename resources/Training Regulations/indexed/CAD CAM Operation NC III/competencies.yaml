          "source_text": "1. \nDetermine job \nrequirements \n1.1 \n \n \n1.2 \nWorkpiece, drawing, model or a concept of a new \ndesign are analyzed to produce CAD drawing and \nCAM program. \nSystem parameters are selected according to the \nrequirements of the operation.\n2. \nCreate / import CAD \ndrawing \n2.1 \n \n2.2 \n \n \n2.3 \n \n2.4 \nDrawing reference point is established based on job \nrequirement / workpiece. \nProfile, shape, contour of the workpiece  are created \n/ imported using  CAD  according to job requirements \nand drawing standards. \nCreated / imported drawings are edited according to \ndrawing standards. \nCreated / edited drawing are saved according to job \nrequirements.\n3. \nSet CAM parameters \n3.1 \n \nCAM parameters are identified and set according to \njob requirements / part to be produced. \n4. \nCreate / edit CNC \nprograms \n4.1 \n \n4.2 \n \n4.3 \n \n4.4 \n \n4.5 \n \n \n4.6 \n4.7 \nTools are created (if required) for the tool library and \nloaded based on job requirements. \nCoordinates are set for tool path or machining \nfunctions based on the CAD drawing. \nWorkpiece Zero point identified based on the CAD \ndrawing. \nTool paths generated in cycles format in accordance \nwith the software used. \nTool paths are simulated in moderate speed to \ndetermine the correctness of the tool movements and \nother work parameters. \nCycles are edited if required. \nCNC program generated through post processor in \naccordance with selected machine control standard.\n5. \nLoad and run  program at  \nCNC machine  \n \n5.1 \n5.2 \n \n5.3 \n5.4 \nProgram is loaded using the appropriate devices.  \nDry run is performed in the machine in accordance \nwith established procedures. \nProgram is executed to produce part/ workpiece. \nProblems encountered are documented, reported \nor referred to concerned personnel in accordance \nwith worksite procedures. \n \nNote: (Machine and workpiece are pre-set by the machine setter)\n\n--- PDF PAGE 52 ---\nTR – CAD CAM Operation NC III \n \n50 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.   System Parameters \nMay include but are not limited to the following: \n1.1   Metric or English \n1.2    Layers \n1.3    Tool bars (dimensioning, line types, editing, hatching, \n        etc.) \n2.   Drawing standards \nBased on international accepted standard such as; \n2.1 ISO  \n2.2 German (DIN) \n2.3 Japanese (JIS) \n2.4 American (ANSI) \n2.5 And other existing standards  \n3.   CAM Parameters \nMay include but are not limited to the following: \n3.1 Machine type \n3.2   Workpiece specification \n3.3   Workpiece dimension \n3.4   Tool geometry \n3.5   Workpiece zero point \n3.6   Machine zero point \n3.7   Tool measurement (tool offset, tool wear) \n3.8   Surface texture \n4.   Tools \nTools in the tool library  but are not limited to the following \ncutting tools: \n4.1 lathe machine \n4.2 milling machine \n4.3   wire cut (EDM) \n4.4  Spark erosion machine \n5.   Software \nLicensed software which is commonly used by the local \nindustry such as: \n5.1 Mastercam \n5.2 Solid Works \n5.3 Esprit \n5.5 Goelan \n5.6 Hypermill \n5.7 Pro engineer \n5.8 Surfcam \n5.9 Unigraphics \n5.10 Wincam \n5.11 Heidenhein \n5.12 Turbotek \n5.13 CAM Concept \n5.14 and other CAD/CAM software\n\n--- PDF PAGE 53 ---\nTR – CAD CAM Operation NC III \n \n51 \n \n6. Machine control \nMay include: \n6.1 \nHeidenhein \n6.2 \nFanuc \n6.3 \nSentrol \n6.4 \nMazatrol \n6.5 \nSinumerik \n6.6 \nAnd other existing controls \n7. Problems encountered  \nMay include products not within specifications: \n7.1 \nIncorrect machine set-up \n7.2 \nIncorrect parameter setting \n7.3 \nDefective raw materials \n7.4 \nAnd other related problems \n8. Concerned personnel \nMay include: \n8.1 \nProduction supervisor  \n8.2 \nProgrammer \n8.3 \nDesigner \n8.4 \nOther operators \n8.5 \nClient \n8.6 \nQuality control inspector\n\n--- PDF PAGE 54 ---\nTR – CAD CAM Operation NC III \n \n52"
