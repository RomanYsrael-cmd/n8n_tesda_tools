        "source_text": "MEE312301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to create drawing\n using CAD. It details the requirements for creating\n drawings with the aid of computer software (CAD).\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\nInstructions and relevant materials are gathered\nand understood to produce CAD drawing.\n2.\nPrepare the CAD\nenvironment\n\n2.1\n\n2.2\n\n2.3\nAll relevant manuals, instructions and operating\nprocedures for the CAD software are obtained in\naccordance with workplace procedures.\nThe CAD package is booted up in accordance with\nworkplace procedures.\nScreen display areas and basic parameters are\nset in accordance with instructions.\n3.\nProduce basic drawing\n3.1\n\n3.2\n\n3.3\n\n3.4\nBasic CAD drawings are created and guidance is\nsought as required.\nDrawings are prepared in accordance with the\nexisting standard.\nCAD drawings are reviewed by concerned person\nin accordance with company procedures.\nReviewed CAD drawings are modified, if\nnecessary.\n4.\nSave and print drawing\n4.1\n\n4.2\n\n4.3\nDrawing files are saved in the designated folder in\naccordance with standard operating procedures.\nDrawing files are printed out in accordance with\nstandard operating procedures.\nPrograms and computer are shut-down in\naccordance with workplace procedures.\n\n--- PDF PAGE 48 ---\nTR – CAD CAM Operation NC III\n\n46\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Instructions and relevant\nmaterials\n1.1 Instructions\n1.2 Sample product/workpiece\n1.3 Drawings and/or sketches\n1.4 concept\n2. Basic Parameters\nMay include but are not limited to the following:\n1.1 Layer or level\n1.2 Line types\n1.3 Line width\n1.4 Color and text format\n3. Basic CAD Drawings\nMay include the following characteristics\n2.1 lines\n2.2 arcs\n2.3 circles\n2.4 polygons\n2.5 ellipses\n2.6 hatching or filling of areas\n2.7 text dimensions\n2.8 tangents\n4. Concerned person\n4.1 Supervisor\n4.2 Designer\n4.3 Draftsman\n4.4 Production supervisor\n4.5 Engineer\n4.6 Customer\n5. Printed\nDrawing are printed using :\n5.1 printers\n5.2 plotters\n\n--- PDF PAGE 49 ---\nTR – CAD CAM Operation NC III\n\n47\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 determined job requirements\n1.2 prepared the CAD environment\n1.3 produced basic drawing\n1.4 saved and printed drawing\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Computer hardware safety practices\n2.1.1 Correct voltage supply to computer equipment\n2.1.2 Use of voltage regulator and surge protector\n2.1.3 Start up and shutdown procedures\n2.1.4 Implementation of Housekeeping(5S)\n2.1.5 Application of First-aid\n2.1.7 Use of fire extinguishers\n\n2.2 Drawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic projection (1st and 3rd angle)\n2.2.3 Perspective\n2.2.3.1 isometric\n2.2.3.2 dimetric\n2.2.3.3 cavalier\n2.2.3.4 militar\n2.2.4 Sections\n2.2.4.1 full section\n2.2.4.2 half section\n2.2.4.3 partial or local section\n2.2.4.4 revolve section\n2.2.4.5 assembly and detailed drawings\n2.2.5 Dimensioning\n2.2.5.1 part dimension\n2.2.5.2 location dimension\n2.2.5.3 dimensioning techniques\n2.2.6 Tolerances\n2.2.6.1 bilateral tolerance\n2.2.6.2 unilateral tolerance\n2.2.6.3 ISO system of tolerance for hole and shaft\n2.2.6.4 general tolerance\n2.2.6.5 Geometrical Tolerances (form and position)\n2.2.7 Surface condition (surface finish/texture)\n2.2.8 Limits and fits\n2.2.8.1 classification of fits\n2.2.8.2 hole basis system of fits\n2.2.8.3 shaft basis system of fits\n2.3 Shop mathematics\n2.3.1 Four fundamental operation\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Square and square root of numbers\n2.3.5 Pythagorean theorem\n2.2.6 Basic trigonometric function\n\n--- PDF PAGE 50 ---\nTR – CAD CAM Operation NC III\n\n48\n2.4 Use of Personal Computer Hard and Software\n2.4.1 Windows operation\n2.4.2 Connection to peripherals (Printer, plotter)\n2.4.3 Printing and plotting operations\n2.4.4 File management\n\n2.5 Safe Computer Practices\n2.5.1 Backing up files\n2.5.2 Scanning for viruses\n\n2.6 Knowledge in Mechanical drawing\n3.\nUnderpinning\nskills\n3.1 Drafting skills\n3.2 Communication skills\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Computer equipment, printer/plotter, software and facilities\nappropriate to processes or activities\n4.2 Sample part/model\n4.3 Measuring instruments\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation / demonstration of creation of 2D & 3D\nCAD drawings\n5.2 Written exam\n5.3 Demonstration\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 51 ---\nTR – CAD CAM Operation NC III\n\n49\nUNIT OF COMPETENCY :\nAPPLY CAD/CAM PROGRAM\n\nUNIT CODE\n\n:"
      },
