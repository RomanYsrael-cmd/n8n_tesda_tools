  "source_section_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nThe qualification of CAD/CAM Operation NC III may be attained through:\n\n4.2.1 Acquisition of COC in\n\n 4.2.1.1 Create drawing using CAD software\n\n4.2.2 Demonstration of competence through project-type\n assessment covering the following units\n\n 4.2.2.1 Create drawing using CAD software\n 4.2.2.2 Apply CAD/CAM program\n\nNote:\nCandidates who are holders of unexpired COCs in Create drawing\nusing CAD software (CAD Operation) leading to CAD/CAM Operation\nNC III may undergo only the assessment for the unit Apply CAD/CAM\nprogram. The assessor, however, may probe the candidate for\nhis/her knowledge and skills on CAD operation, particularly along\nmechanical drafting.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.4.2.\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 66 ---\nTR – CAD CAM Operation NC III\n\n64\n\nSet-up CNC milling\nmachine, work- piece and\ncutting tools\nWrite basic CNC lathe\nmachine program\nPerform basic CNC lathe\nmachine operations\nCORE\nCOMPETENCIES\nCompetency Map\nMetals and Engineering Sector\nReceive and respond\nto workplace\ncommunication\nLead in workplace\ncommunication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\nParticipate in\nworkplace\ncommunication\nUtilize specialist\ncommuni