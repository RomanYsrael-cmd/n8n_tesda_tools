rganize work\nPractice career\nprofessionalism\nPractice career\nprofessionalism\nUse mathematical\nconcepts and\ntechniques\nPromote\nenvironmental\nprotection\nPromote\nenvironmental\nprotection\nPractice\nhousekeeping\nprocedures\nTurn workpiece\n(Basic)\nTurn workpiece\n(Intermediate)\nMill workpiece\n(Basic)\nMill workpiece\n(Intermediate)\nGrind workpiece\n(Basic)\nPerform bench work\n(Basic)\nGrind workpiece\n(Complex)\nPerform bench work\n(Complex)\nTurn workpiece\n(Advanced)\nMill workpiece\n(Advanced)\nCAD/CAM Operation NC III\nSet-up CNC lathe\nmachine, work- piece and\ncutting tools\nWrite basic CNC milling\nmachine program\nPerform basic CNC milling\nmachine operations\nSet-up multiple-axis CNC\nlathe machine, workpiece\nand cutting tools\nWrite advanced CNC\nLathe Machine program\nPerform advanced CNC\nLathe Machine operations\nSet-up multiple-axis CNC\nmilling machine, work-piece\nand cutting tools\nWrite advanced CNC\nMilling machine program\nPerform advanced CNC\nMilling Machine operation\nPrepare cost\nestimates\nApply CAD/CAM\nprogram\nCreate drawing using\nCAD software\nOperate a\npersonal\ncomputer\n\n--- PDF PAGE 67 ---\nTR – CAD CAM Operation NC III\n\n65\nDefinition of Terms\n\nbench work\nthe operations incident to the process of laying out, fitting,\nassembling, etc… when the work is placed on the bench or in\na bench vise\n\nboring\nis the operation of enlarging a hole by means of an adjustable\ncutting tool with only one cutting edge\n\nchipping\nis the operation of removing/cutting metal using hammer and\nchisel\n\ncounter boring\nis the operation of enlarging the end of a hole cylindrically\n\ndrilling\nis the operation of producing a circular hole by removing solid\nmetal\n\nfacing\nthe lathe operation of finishing the ends of the work, to make\nthe piece the right length. Also known as squaring\n\ngrinding\nrefers to the removal of material from a workpiece with\ngrinding wheel\n\nlaying out\nterm used to include the marking or scribling of center points,\ncircles, arcs, or straight lines upon metal surfaces, either\ncurved or flat, for the guidance of the worker\n\nmilling\nrefers to removal of metal by feeding a workpiece through the\nperiphery of rotating circular cutter\n\nreaming\nis an operation of sizing and finishing a hole by means of a\ncutting tool having several cutting edges. reaming serves to\nmake the hole smoother, straighter, and more accurate\n\nspot-facing\nis the operation of smoothing and squaring the surface\naround a hole\n\ntapping\nis the operation of forming internal threads by means of a tool\ncalled tap\n\nturning\nrefers to shaping a workpiece by gripping it in a workholding\ndevice and rotating it under power against a suitable cutting\ntool\n\nCNC machining\nrefers to the fabrication of work piece either turning, milling or\nany other machining process with the use of Computerized\nNumerically Controlled machine tools\n\nProgramming\nthe process of coding machining conditions in which\ninformations such as cutter dimensions, cutter movement ,\nprocessing orders, federate or spindle speed all under fixed\nregulation or specified format which refers to the workpiece\ndrawing to instruct Numerically Controlled machine tool\n\nCAD\nComputer Aided Design – the use of graphics-oriented\ncomputer software for designing and drafting applications\n\nCAM\nComputer Aided Manufacturing- computer software that\ngenerates programs for the operation of NC (numerical\ncontrol) machine tools\n\n--- PDF PAGE 68 ---\nTR – CAD CAM Operation NC III\n\n66\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nINDUSTRY EXPERTS:\n\nDR. FELICIANO JAPITANA\nChief, MWTD\nMetal Industry Research and Development\nCenter\nEngr. ROGELITO AQUINO\nEngineer III, MSFS\nMetal Industry Research and\nDevelopment Center\nRAMON MARTIN\nCNC Expert\nMetal Industry Research and Development\nCenter\nHECTOR D. MALONZO\nPresident\nHDM Technologies, Inc.\n\nALANO CABANBAN\nVICTORIANO YAP\nSME\nCHARLIE POLICARPIO\nSME\nOSCAR UNAS\nSME\nTIMOTEO INTALAN\nMetalworking Industries Association of the\nPhilippines, Inc.\nANTONIO TERANIA\nMetalworking Industries Association of\nthe Philippines, Inc.\nVIRGILIO LANZUELA\nPresident / General Manager\nVL Industech Corporation\nENRIQUE PINGOL\nPAA\n\n--- PDF PAGE 69 ---\nTR – CAD CAM Operation NC III\n\n67\nTECHNICAL EXPERTS:\n\nCHARLES A. ANTONIO\nCEMMT Trainer\nTTCTCE\nMODESTO A. VELASQUEZ Jr.\nCEMMT Trainer\nTTCTCE\nFERDINAND E. ESTACIO\nSupervising TESD Specialist / Trainer\nNTTA\nRAMON R. SANTIAGO\nCEMMT Trainer\nTTCTCE\nLORENZO A. LADIA\nTrainer\nNTTA\nNOEL K. MALABAGO\nCEMMT Trainer\nTESDA – RTC\nGIL D. GONZALES\nCEMMT Focal Person\nTESDA – RTC XI\nPABLO H. CORTEZ Jr.\nCEMMT Focal Person\nTESDA – RTC VI\nROGEL M. BORBON\nCEMMT Trainer\nTESDA – RTC\nJIMMY NILLAS\nCEMMT Trainer/ MIAP\nTESDA – RTC VII\n\nEMILIA B. MAGAAN\nCEMMT Trainer\nTESDA – RTC IV-A\n\nJULFORD C. ABASOLO\nSupervising TESD Specialist\nTTCTCE\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQualification and Standards Office (QSO)"
