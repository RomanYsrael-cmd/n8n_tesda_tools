          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including new,\nunusual and improbable situations that may have happened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1. Relevant equipment and operational\n processes\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\n requirement\n2.2.4. Principles of decision making strategies and\n techniques\n2.2.5. Enterprise information systems and data\n collation\n2.2.6.Industry codes and standards\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nImplications\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well\nas bank of questions which will be used to probe the reason\nbehind the observable action.\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n6. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 15 ---\nTR – CAD CAM Operation NC III\n\n13\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
