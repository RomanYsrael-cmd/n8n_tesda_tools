ervation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 31 ---\nTR – CAD CAM Operation NC III\n\n29\nUNIT OF COMPETENCY: PERFORM ROUTINE HOUSEKEEPING\n\nUNIT CODE:"
