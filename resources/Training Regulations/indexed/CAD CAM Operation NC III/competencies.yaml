Classification and mechanical properties of \nengineering materials \n \n2.5   Lathe and Milling machine operations  \n2.5.1   Lathe / milling types and specifications \n2.5.2   Lathe / milling parts and functions \n2.5.3   Setting cutting speed, rpm, feed rate \n2.5.4   Work holding and tool holding devices  \n2.5.5   Turning / milling tools and tool geometry \n2.5.6   Tooling, set up and parameters in turning / milling \noperations \n2.5.7   Lathe / milling accessories, fixtures and attachments \n \n2.6    Application of G – codes and M – codes \n \n2.7    Use of Personal Computer Hardware and Software  \n 2.7.1 Windows operation \n 2.7.2 Connection to peripherals (Printer, plotter, CNC \nmachines) \n2.7.3 Printing and plotting operations \n2.7.4 File management \n \n2.8   Safe Computer Practices \n2.8.1 Backing up files \n2.8.2 Scanning for viruses \n3. \nUnderpinning \nskills \n3.1   Drafting and designing skills \n3.2   Selection of cutting tools \n3.3   Use of measuring instruments \n3.4   Determination of workpiece specifications \n3.5   Computation of feed, cutting speed and machine rpm \n3.6   Application of G – codes and M – codes \n3.7   Communication skills \n4. \nResource \nimplications \nThe following resources must be provided: \n4.1   Computer equipment, printer/plotter, software and facilities \nappropriate to processes or activities \n4.2   Sample part/model  \n4.3   Measuring instruments \n4.3   Drawings, sketches or blueprint \n5. \nMethod of \nassessment \nCompetency must be assessed through:   \n5.1 Direct observation / demonstration of creation of CAD \ndrawings and CAM programs \n5.2 Written exam \n5.3 Demonstration  \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.",
