ized terms are elaborated in the Range of Variables\n1.\nSelect and use\nmeasuring tools\n1.1\n\n1.2\n\n1.3\nMeasuring tools are selected and used\naccording to the level of accuracy required.\nMeasurements taken are accurate to the finest\ngraduation of the selected measuring\ninstrument.\nMeasuring technique used is correct and\nappropriate to the device used.\n\n2.\nClean and store\nmeasuring tools\n2.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard\noperating procedures.\n\n--- PDF PAGE 30 ---\nTR – CAD CAM Operation NC III\n\n28\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring tools\nMeasuring tools include\n1.1 Steel tape\n1.2 Steel rule\n1.3 Straight edge\n1.4 Combination square\n1.5 Steel square\n1.6 Divider or trammel\n1.7 Caliper\n1.8 Protractor\n1.9 Vernier caliper\n1.10 Micrometer\n2. Measurements\n2.1 length\n2.2 diameter\n2.3 depth\n2.4 flatness\n2.5 straightness\n2.6 squareness\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used measuring instruments\n1.2 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge\n2.1 Types, purposes and accuracy of measuring instruments\n2.2 Capability of measuring instruments\n2.3 Part dimensions and tolerances\n2.4 Techniques for measuring dimensions\n2.5 Care and storage procedure of measuring tools\n3.\nUnderpinning skills\n3.1 Safe handling of measuring tools and materials\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 31 ---\nTR – CAD CAM Operation NC III\n\n29\nUNIT OF COMPETENCY: PERFORM ROUTINE HOUSEKEEPING\n\nUNIT CODE: MEE722206\n\nUNIT DESCRIPTOR: This unit covers the competencies required to maintain an\norganized and clean work area.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nOrganize work area\n1.1\n\n1.2\n\n1.3\nWork area maintained in a safe, uncluttered and\norganized manner according to workshop policy.\nAll tasks carried out safely, effectively and\nefficiently with minimum inconvenience according\nto workshop policy.\nWorkshop policies and procedures for tidying work\nareas and placing items in designated areas\napplied.\n2.\nClean work area\n2.1\n\n2.2\n\n2.3\n\n2.4\n\n2.5\n\n2.6\nShop policies and procedures applied for cleaning\nwork area.\nWastes promptly removed and disposed of\naccording to shop policies and environmental\nrequirements.\nSpills, wastes and other potential hazards\nreported to appropriate personnel and removed\naccording to shop policies and environmental\nrequirements.\nSignage promptly displayed in regard to unsafe\nareas.\nConsumable materials maintained and stored\ncorrectly after use.\nTools and equipment (including guards) cleaned\nand used in accordance with manufacturer’s\ninstructions.\n\n--- PDF PAGE 32 ---\nTR – CAD CAM Operation NC III\n\n30\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Workshop policy\nShop policy and procedure in regard to:\n1.1 Housekeeping practices\n1.2 Maintenance and storage of cleaning equipment\n1.3\nUse and storage of cleaning chemicals\n2. Work area\nWork area may include:\n2.1 Work benches\n2.2 Walkways and aisles\n2.3 Fixtures and other working surfaces\n3. Tools and\n Equipment\nEquipment and tools may include:\n3.1 Drill Press\n3.2 Pedestal Grinder\n3.3 Surface plate\n3.4 Layout and marking tools\n3.5 Cutting tools (hacksaw, chisel, files)\n3.6 Inspection and measuring tools (templates, vernier caliper,\nmicrometer, straight edge, gages, etc…)\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate organized\nand cleaned work area according shop policies and\nenvironmental requirements.\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety practices\n2.2 Machine shop equipment\n2.3 Shop policies regulations\n2.4 5-S\n2.5 Shop cleaning equipment\n3.\nUnderpinning skills\n3.1 Using and storing of cleaning equipment\n3.2 Using and storing chemicals, hazardous substances and\nflammable liquids\n3.3 Literacy and numeracy skills in reading and understanding\nlabels and instructions for the handling and use of\nchemicals and hazardous substances\n3.4 Communication skills\n3.5 Organizing skills\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\nactivity\n4.2 Materials and documentation relevant to the proposed\nactivity\n4.3 Shop policy and/or procedures manual on housekeeping,\ncleaning and occupational health and safety\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration or role play\n5.3 written or oral short answer questions\n5.4 identify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 33 ---\nTR – CAD CAM Operation NC III\n\n31\nUNIT OF COMPETENCY: PERFORM SHOP COMPUTATIONS (INTERMEDIATE)\n\nUNIT CODE: MEE722207\n\nUNIT DESCRIPTOR: This unit covers the competencies required to perform\ncalculation involving triangles and tapers.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform calculations\ninvolving triangles\n1.1\n\n1.2\n\nProblems involving right triangles are performed\nusing the trigonometric functions.\nProblems involving non-right triangles are\nperformed using sine and cosine rules.\n2.\nCalculate taper\n2.1\n\nTaper of work calculated correctly using\nappropriate formula.\n\n--- PDF PAGE 34 ---\nTR – CAD CAM Operation NC III\n\n32\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. trigonometric functions\n1.1 Sine\n1.2 Cosine\n1.3 Tangent\n1.4 Cotangent\n1.5 Secant\n1.6 Cosecant\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate\nperformed calculations:\n1.1 Involving right triangles\n1.2 Involving non-right triangles\n1.3 involving tapers\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 English and metric system of measurements\n2.2 Geometrical shapes\n3.\nUnderpinning skills\n3.1 Performing calculations using pen and paper or on a\ncalculator\n\n4.\nResource implications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to\n processes or activity\n4.2 Materials relevant to the proposed activity\n\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 35 ---\nTR – CAD CAM Operation NC III\n\n33\nUNIT OF COMPETENCY: MEASURE WORKPIECE USING ANGULAR\nMEASURING INSTRUMENTS\n\nUNIT CODE: MEE722208\n\nUNIT DESCRIPTOR: This unit covers the competencies required to measure\nworkpieces using angular measuring instruments.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use angular\nmeasuring tools\n1.1\n\n1.2\n\n1.3\nAngular measuring tools are selected and used\naccording to the level of accuracy required.\nMeasurements taken are accurate to the finest\ngraduation of the selected measuring instrument.\nMeasuring technique used is correct and\nappropriate to the device used.\n\n2.\nMaintain angular\nmeasuring tools\n2.1\n\nMeasuring tools are adjusted and maintained to\nthe required accuracy utilizing manufacturer’s or\nworksite procedures.\n3.\nClean and store\nmeasuring tools\n3.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard\noperating procedures.\n\n--- PDF PAGE 36 ---\nTR – CAD CAM Operation NC III\n\n34\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Angular measuring\n tools\nMeasuring tools include\n1.1 Bevel protractor\n1.2 Gage blocks\n1.3 Sine bar\n2. Measurements\n2.1 angle\n2.2 taper\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used angular measuring instruments\n1.2 Maintained/adjusted instruments\n1.3 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge\n2.1 Types, purposes and accuracy of angular measuring\ninstruments\n2.2 Capability of measuring tools\n2.3 Techniques for measuring angles and tapers\n2.4 Care and storage procedure of measuring tools\n3.\nUnderpinning skills\n3.1 Safe handling of measuring tools and materials\n3.2 Reading vernier scale\n3.3 Reading micrometer\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 37 ---\nTR – CAD CAM Operation NC III\n\n35\nUNIT OF COMPETENCY: PERFORM SHOP COMPUTATIONS (ADVANCED)\n\nUNIT CODE: MEE722209\n\nUNIT DESCRIPTOR: This unit covers the competencies required to perform\ncalculation involving gear ratio, indexing problems and\ngearing problems.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nCalculate gear ratio\n1.1\nGear ratio calculated using appropriate formula\n2.\nSolve indexing problems\n2.1\n\nIndexing problems involving number of turns,\nspaces and circle plate are solved using\nappropriate formula\n3.\nSolve gearing problems\n3.1\nGearing problems are solved using appropriate\nformula\n4.\nUse geometrical\nprinciples in the solution\nof problems\n4.1\nSolution to problems is obtained by applying\ngeometrical properties of angles, triangles and\ncircles in the calculation.\n\n--- PDF PAGE 38 ---\nTR – CAD CAM Operation NC III\n\n36\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. gear ratio\n1.1 addendum\n1.2 clearance\n1.3 dedendum\n1.4 diametral pitch\n1.5 module\n1.6 outside diameter\n1.7 pitch diameter\n1.8 root diameter\n1.9 number of teeth\n etc.\n2. indexing\n2.1 direct indexing\n2.2 simple indexing\n2.3 compound indexing\n2.4 differential indexing\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate\nperformed calculations:\n1.1 involving gear ratio\n1.2 involving indexing problems\n1.3 involving gearing problems\n1.4 involving geometrical properties of angles, triangles\nand circles\n2.\nUnderpinning\nknowledge and attitude\n2.1 English and metric system of measurements\n2.2 Geometrical shapes\n2.3 Gear types\n3.\nUnderpinning skills\n3.1 Performing calculations using pen and paper or on a\ncalculator\n3.2 Reading and interpreting working drawings\n4.\nResource implications\nThe following resources MUST be provided:\n4.1\nTools, equipment and facilities appropriate to\nprocesses or activity\n4.2\nMaterials relevant to the proposed activity\n5.\nMethod of assessment\nCompetency may be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 39 ---\nTR – CAD CAM Operation NC III\n\n37\nUNIT OF COMPETENCY: MEASURE WORKPIECE USING GAGES AND SURFACE\nTEXTURE COMPARATOR\n\nUNIT CODE: MEE722210\n\nUNIT DESCRIPTOR: This unit covers the competencies required to measure\nworkpieces using fixed and adjustable gages.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use fixed and\nadjustable gages\n1.1\n\n1.2\n\n1.3\nAppropriate gages are selected and used to\nundertake the required comparison or\nmeasurement using standard operating\nprocedures.\nConsistent and accurate measurements obtained\nconforms to drawing specification\nMeasuring technique used is correct and\nappropriate to the device used.\n2.\nPerform surface texture\nmeasurements\n2.1\n\n2.2\n\nSurface texture are measured according worksite\nprocedures.\nMeasurements taken are within the level of\naccuracy required.\n3.\nClean and store\nmeasuring tools\n3.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard\noperating procedures.\n\n--- PDF PAGE 40 ---\nTR – CAD CAM Operation NC III\n\n38\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Gages\nFixed and adjustable gages include:\n1.1 Gage blocks\n1.2 Telescoping gages\n1.3 Center gages\n1.4 Thread gages\n1.5 Dial bore gages\n1.6 Height gages\n1.7 Radius gages\n1.8 Go-no-go gages\n1.9\nDepth gages\n2. Measurements\nMeasurements undertaken may include:\n2.1 Linear dimensions\n2.2 Diameters\n2.3 Depths\n2.4 Fits\n2.5 Tapers\n2.6 Threads\n2.7 Radius\n2.8 Squareness\n2.9 Surface texture\netc\n\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used fixed and adjustable gages\n1.2 Performed surface texture measurements\n1.3 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge\n2.1 Types and application of fixed and adjustable gages\n2.2 Gage limits and accuracy\n2.3 Techniques for measuring components\n2.4 Care and storage procedure of measuring tools\n3.\nUnderpinning skills\n3.1 Safe handling of measuring tools and materials\n3.2 Verifying measurements with drawing specifications\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n4.3 Drawing\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 41 ---\nTR – CAD CAM Operation NC III\n\n39\nUNIT OF COMPETENCY PERFORM PREVENTIVE AND CORRECTIVE\nMAINTENANCE\n\nUNIT CODE: MEE722211\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nperforming preventive and corrective maintenance\nsuch as inspection and repair of hand tools, cleaning\nand lubrication of machine parts and changing drive\npulley and belts.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform inspection of\nmachine\n\n1.1\n\n1.2\nMachine inspected according to worksite\nprocedures.\nStatus/Report recorded on proforma or reported\norally according to worksite procedure.\n2.\nPerform cleaning and\nlubricating of machine\n\n2.1\n\n2.2\n\nMachines lubricated as per manufacturer’s\nrecommendation using appropriate tools and\nmaterials\nFluids and lubricants replaced and/or topped up\naccording to prescribed schedule.\n3.\nPerform minor machine\nrepair and adjustments\n\n3.1\n\n3.2\n\nMinor machine repairs performed according to\nmanufacturer’s instruction or worksite procedures.\nMachine moving parts adjusted to manufacturer’s\nspecifications.\n4.\nMaintain hand tools\n4.1\n4.2\nTool cutting ground to recommended specifications\nHand tools lubricated and stored according to\nprescribed procedure\n.\n\n--- PDF PAGE 42 ---\nTR – CAD CAM Operation NC III\n\n40\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1 V-belt\n1.2 Bearing\n1.3 Gears\n1.4 Clutch\n1.5 Drive pulley\n2. Machines\nMachine include but not limited to:\n2.1 Lathe machine\n2.2 Milling machine\n2.3 Grinding machine\n2. Tools and materials\nTools and materials used include:\n3.1 Lubricants\n3.2 Oil can\n3.3 Grease gun\n3.4 Oil\n3.5 Coolant or compound\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that that the candidate:\n1.1 Performed inspection of machine\n1.2 Performed cleaning and lubricating of machine\n1.3 Performed minor machine repairs and adjustments\n2. Underpinning\nknowledge\n2.1 Proper cleaning and oiling\n2.2 Kinds of oil\n2.3 Parts and function of machine tools\n2.4 Cutting oil, coolant or compound\n2.5 Pulleys and belts\n2.6 Location of main switches of the machine\n2.7 Handling and storage of tools\n2.8 Checklist of safe working conditions\n2.9 Procedures in cleaning and disposal of waste materials\n3. Underpinning skills\n3.1 Inspecting and repairing hand tools\n3.2 Inspecting and changing drive pulleys and belts\n3.3 Replacing and adjusting machine parts\n3.4 Distinguishing old and new coolant\n3.5 Distinguishing odor of polluted coolant\n3.6 Selecting coolant, cutting oil or compounds\n3.7 Changing coolant\n3.8 Inspecting work area for safe working environment\n3.9 Cleaning work area\n3.10 Disposing metal scraps, chips and waste materials.\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes\nor activity\n4.2 Materials relevant to the proposed activity\n5. Method of Assessment\nCompetency may be assessed through:\n5.1 direct observation of activities\n5.2 oral or written questioning\n6. Context for\nAssessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 43 ---\nTR – CAD CAM Operation NC III\n\n41\n\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:\nICT311201\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using\nand working with files, folders and programs, saving work,\nand closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n\n1. Start the\ncomputer\n\n1.1 The peripheral devices are properly connected\n1.2 Power is checked and the computer and peripheral devices\nare switched on\n1.3 Proper logging in and logging off is successfully done\n1.4 The operating system features and functions are accessed\nand navigated\n1.5 Hardware configuration and other system features are\nchecked\n2. Arrange and\ncustomize\ndesktop display/\nWindows\nsettings\n\n2.1 The desktop screen or Windows elements are changed as\nneeded\n2.2 Desktop icons are added, renamed, moved, copied or\ndeleted\n2.3 The online help functions are accessed or used as needed\n2.4 Desktop icons of application programs are selected,\nopened and closed\n2.5 Properties of icons are displayed\n2.6 Computer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1 A file or folder is created, opened, moved, renamed or copied\n3.2 Files are located, deleted and restored\n3.3 Details and properties of files and folders are displayed or\nviewed\n3.4 Various files are organized for easy lookup and use\n3.5 Files and information are searched\n3.6 Disks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1 Application programs are added, changed, removed or ran\n4.2 User software or application program are installed, updated\nand upgraded\n4.3 Information/data are moved between documents or files\n5. Print information\n5.1 Printer is added or installed and correct printer settings is\nensured\n5.2 Default printer is assigned accordingly\n5.3 Information or document is printed on the installed printer\n5.4 Progress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1 All open application programs are closed\n6.2 Computer and peripheral devices are properly shut down\n\n--- PDF PAGE 44 ---\nTR – CAD CAM Operation NC III\n\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Peripheral device\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n2. Computer\nMay include:\n2.1 Laptops/notebooks\n2.2 Workstations\n2.3 Servers\n2.4 other personal computer devices\n3. Application\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n4. Operating system\nMay include but is not limited to the various versions and\nvariants of:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n\n5. System features\nMay include but is not limited to the operating system features\nand hardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n\n--- PDF PAGE 45 ---\nTR – CAD CAM Operation NC III\n\n43\n\nVARIABLE\nRANGE\n6. Online help\nfunctions\n6.1 An instruction manual, or a portion of the manual,\nintegrated and accessible from within the program or\nsoftware being used.\n7. Properties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n8. Various files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n9. Disks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation.\n\n--- PDF PAGE 46 ---\nTR – CAD CAM Operation NC III\n\n44\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof Competency\n1.1 Assessment must confirm the ability to utilize software,\nnavigate the desktop, using system features to perform\ntasks and save results of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware\ncomponents\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or\ndisk storage\n3.2 Mouse and keyboarding skills for running software\napplications\n3.3 Reading and writing at a level where basic workplace\ndocuments are understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions using\na personal computer whether standalone or in a\nnetworked environment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment.\n\n--- PDF PAGE 47 ---\nTR – CAD CAM Operation NC III\n\n45\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\n CREATE DRAWING USING CAD SOFTWARE\n\nUNIT CODE\n\n: MEE312301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to create drawing\n using CAD. It details the requirements for creating\n drawings with the aid of computer software (CAD).\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\nInstructions and relevant materials are gathered\nand understood to produce CAD drawing.\n2.\nPrepare the CAD\nenvironment\n\n2.1\n\n2.2\n\n2.3\nAll relevant manuals, instructions and operating\nprocedures for the CAD software are obtained in\naccordance with workplace procedures.\nThe CAD package is booted up in accordance with\nworkplace procedures.\nScreen display areas and basic parameters are\nset in accordance with instructions.\n3.\nProduce basic drawing\n3.1\n\n3.2\n\n3.3\n\n3.4\nBasic CAD drawings are created and guidance is\nsought as required.\nDrawings are prepared in accordance with the\nexisting standard.\nCAD drawings are reviewed by concerned person\nin accordance with company procedures.\nReviewed CAD drawings are modified, if\nnecessary.\n4.\nSave and print drawing\n4.1\n\n4.2\n\n4.3\nDrawing files are saved in the designated folder in\naccordance with standard operating procedures.\nDrawing files are printed out in accordance with\nstandard operating procedures.\nPrograms and computer are shut-down in\naccordance with workplace procedures.\n\n--- PDF PAGE 48 ---\nTR – CAD CAM Operation NC III\n\n46\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Instructions and relevant\nmaterials\n1.1 Instructions\n1.2 Sample product/workpiece\n1.3 Drawings and/or sketches\n1.4 concept\n2. Basic Parameters\nMay include but are not limited to the following:\n1.1 Layer or level\n1.2 Line types\n1.3 Line width\n1.4 Color and text format\n3. Basic CAD Drawings\nMay include the following characteristics\n2.1 lines\n2.2 arcs\n2.3 circles\n2.4 polygons\n2.5 ellipses\n2.6 hatching or filling of areas\n2.7 text dimensions\n2.8 tangents\n4. Concerned person\n4.1 Supervisor\n4.2 Designer\n4.3 Draftsman\n4.4 Production supervisor\n4.5 Engineer\n4.6 Customer\n5. Printed\nDrawing are printed using :\n5.1 printers\n5.2 plotters\n\n--- PDF PAGE 49 ---\nTR – CAD CAM Operation NC III\n\n47\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 determined job requirements\n1.2 prepared the CAD environment\n1.3 produced basic drawing\n1.4 saved and printed drawing\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Computer hardware safety practices\n2.1.1 Correct voltage supply to computer equipment\n2.1.2 Use of voltage regulator and surge protector\n2.1.3 Start up and shutdown procedures\n2.1.4 Implementation of Housekeeping(5S)\n2.1.5 Application of First-aid\n2.1.7 Use of fire extinguishers\n\n2.2 Drawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic projection (1st and 3rd angle)\n2.2.3 Perspective\n2.2.3.1 isometric\n2.2.3.2 dimetric\n2.2.3.3 cavalier\n2.2.3.4 militar\n2.2.4 Sections\n2.2.4.1 full section\n2.2.4.2 half section\n2.2.4.3 partial or local section\n2.2.4.4 revolve section\n2.2.4.5 assembly and detailed drawings\n2.2.5 Dimensioning\n2.2.5.1 part dimension\n2.2.5.2 location dimension\n2.2.5.3 dimensioning techniques\n2.2.6 Tolerances\n2.2.6.1 bilateral tolerance\n2.2.6.2 unilateral tolerance\n2.2.6.3 ISO system of tolerance for hole and shaft\n2.2.6.4 general tolerance\n2.2.6.5 Geometrical Tolerances (form and position)\n2.2.7 Surface condition (surface finish/texture)\n2.2.8 Limits and fits\n2.2.8.1 classification of fits\n2.2.8.2 hole basis system of fits\n2.2.8.3 shaft basis system of fits\n2.3 Shop mathematics\n2.3.1 Four fundamental operation\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Square and square root of numbers\n2.3.5 Pythagorean theorem\n2.2.6 Basic trigonometric function\n\n--- PDF PAGE 50 ---\nTR – CAD CAM Operation NC III\n\n48\n2.4 Use of Personal Computer Hard and Software\n2.4.1 Windows operation\n2.4.2 Connection to peripherals (Printer, plotter)\n2.4.3 Printing and plotting operations\n2.4.4 File management\n\n2.5 Safe Computer Practices\n2.5.1 Backing up files\n2.5.2 Scanning for viruses\n\n2.6 Knowledge in Mechanical drawing\n3.\nUnderpinning\nskills\n3.1 Drafting skills\n3.2 Communication skills\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Computer equipment, printer/plotter, software and facilities\nappropriate to processes or activities\n4.2 Sample part/model\n4.3 Measuring instruments\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation / demonstration of creation of 2D & 3D\nCAD drawings\n5.2 Written exam\n5.3 Demonstration\n\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 51 ---\nTR – CAD CAM Operation NC III\n\n49\nUNIT OF COMPETENCY :\nAPPLY CAD/CAM PROGRAM\n\nUNIT CODE\n\n:\nMEE821313\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to apply\nCAD/CAM program for creation of CAD drawings and\nCNC programs based on drawing specifications. It\ndetails the requirements for creating drawings with the\naid of computer software to generate simple and / or\ncomplex CNC machining programs for basic and\nadvanced turning and milling.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\nWorkpiece, drawing, model or a concept of a new\ndesign are analyzed to produce CAD drawing and\nCAM program.\nSystem parameters are selected according to the\nrequirements of the operation.\n2.\nCreate / import CAD\ndrawing\n2.1\n\n2.2\n\n2.3\n\n2.4\nDrawing reference point is established based on job\nrequirement / workpiece.\nProfile, shape, contour of the workpiece are created\n/ imported using CAD according to job requirements\nand drawing standards.\nCreated / imported drawings are edited according to\ndrawing standards.\nCreated / edited drawing are saved according to job\nrequirements.\n3.\nSet CAM parameters\n3.1\n\nCAM parameters are identified and set according to\njob requirements / part to be produced.\n4.\nCreate / edit CNC\nprograms\n4.1\n\n4.2\n\n4.3\n\n4.4\n\n4.5\n\n4.6\n4.7\nTools are created (if required) for the tool library and\nloaded based on job requirements.\nCoordinates are set for tool path or machining\nfunctions based on the CAD drawing.\nWorkpiece Zero point identified based on the CAD\ndrawing.\nTool paths generated in cycles format in accordance\nwith the software used.\nTool paths are simulated in moderate speed to\ndetermine the correctness of the tool movements and\nother work parameters.\nCycles are edited if required.\nCNC program generated through post processor in\naccordance with selected machine control standard.\n5.\nLoad and run program at\nCNC machine\n\n5.1\n5.2\n\n5.3\n5.4\nProgram is loaded using the appropriate devices.\nDry run is performed in the machine in accordance\nwith established procedures.\nProgram is executed to produce part/ workpiece.\nProblems encountered are documented, reported\nor referred to concerned personnel in accordance\nwith worksite procedures.\n\nNote: (Machine and workpiece are pre-set by the machine setter)\n\n--- PDF PAGE 52 ---\nTR – CAD CAM Operation NC III\n\n50\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. System Parameters\nMay include but are not limited to the following:\n1.1 Metric or English\n1.2 Layers\n1.3 Tool bars (dimensioning, line types, editing, hatching,\n etc.)\n2. Drawing standards\nBased on international accepted standard such as;\n2.1 ISO\n2.2 German (DIN)\n2.3 Japanese (JIS)\n2.4 American (ANSI)\n2.5 And other existing standards\n3. CAM Parameters\nMay include but are not limited to the following:\n3.1 Machine type\n3.2 Workpiece specification\n3.3 Workpiece dimension\n3.4 Tool geometry\n3.5 Workpiece zero point\n3.6 Machine zero point\n3.7 Tool measurement (tool offset, tool wear)\n3.8 Surface texture\n4. Tools\nTools in the tool library but are not limited to the following\ncutting tools:\n4.1 lathe machine\n4.2 milling machine\n4.3 wire cut (EDM)\n4.4 Spark erosion machine\n5. Software\nLicensed software which is commonly used by the local\nindustry such as:\n5.1 Mastercam\n5.2 Solid Works\n5.3 Esprit\n5.5 Goelan\n5.6 Hypermill\n5.7 Pro engineer\n5.8 Surfcam\n5.9 Unigraphics\n5.10 Wincam\n5.11 Heidenhein\n5.12 Turbotek\n5.13 CAM Concept\n5.14 and other CAD/CAM software\n\n--- PDF PAGE 53 ---\nTR – CAD CAM Operation NC III\n\n51\n\n6. Machine control\nMay include:\n6.1\nHeidenhein\n6.2\nFanuc\n6.3\nSentrol\n6.4\nMazatrol\n6.5\nSinumerik\n6.6\nAnd other existing controls\n7. Problems encountered\nMay include products not within specifications:\n7.1\nIncorrect machine set-up\n7.2\nIncorrect parameter setting\n7.3\nDefective raw materials\n7.4\nAnd other related problems\n8. Concerned personnel\nMay include:\n8.1\nProduction supervisor\n8.2\nProgrammer\n8.3\nDesigner\n8.4\nOther operators\n8.5\nClient\n8.6\nQuality control inspector\n\n--- PDF PAGE 54 ---\nTR – CAD CAM Operation NC III\n\n52\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 Determined job requirements\n1.2 Created / imported CAD drawing\n1.3 Set CAM parameters\n1.4 Created / edited CNC programs\n1.5 Loaded and run program at CNC machine\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Computer hardware safety practices\n2.1.1 Correct voltage supply to computer equipment\n2.1.2 Use of voltage regulator and surge protector\n2.1.3 Start up and shutdown procedures\n2.1.4 Implementation of Housekeeping(5S)\n2.1.5 Application of First-aid\n2.1.7 Use of fire extinguishers\n2.2 Drawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic projection (1st and 3rd angle)\n2.2.3 Perspective\n2.2.3.1 isometric\n2.2.3.2 dimetric\n2.2.3.3 cavalier\n2.2.3.4 militar\n2.2.4 Sections\n2.2.4.1 full section\n2.2.4.2 half section\n2.2.4.3 partial or local section\n2.2.4.4 revolve section\n2.2.4.5 assembly and detailed drawings\n2.2.5 Dimensioning\n2.2.5.1 part dimension\n2.2.5.2 location dimension\n2.2.5.3 dimensioning techniques\n2.2.6 Tolerances\n2.2.6.1 bilateral tolerance\n2.2.6.2 unilateral tolerance\n2.2.6.3 ISO system of tolerance for hole and shaft\n2.2.6.4 general tolerance\n2.2.6.5 Geometrical Tolerances (form and position)\n2.2.7 Surface condition (surface finish/texture)\n2.2.8 Limits and fits\n2.2.8.1 classification of fits\n2.2.8.2 hole basis system of fits\n2.2.8.3 shaft basis system of fits\n2.3 Shop mathematics\n2.3.1 Four fundamental operation\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Square and square root of numbers\n2.3.5 Pythagorean theorem\n2.3.6 Basic trigonometric function\n\n--- PDF PAGE 55 ---\nTR – CAD CAM Operation NC III\n\n53\n2.4 Materials and related science\n2.4.1 Classification and mechanical properties of\nengineering materials\n\n2.5 Lathe and Milling machine operations\n2.5.1 Lathe / milling types and specifications\n2.5.2 Lathe / milling parts and functions\n2.5.3 Setting cutting speed, rpm, feed rate\n2.5.4 Work holding and tool holding devices\n2.5.5 Turning / milling tools and tool geometry\n2.5.6 Tooling, set up and parameters in turning / milling\noperations\n2.5.7 Lathe / milling accessories, fixtures and attachments\n\n2.6 Application of G – codes and M – codes\n\n2.7 Use of Personal Computer Hardware and Software\n 2.7.1 Windows operation\n 2.7.2 Connection to peripherals (Printer, plotter, CNC\nmachines)\n2.7.3 Printing and plotting operations\n2.7.4 File management\n\n2.8 Safe Computer Practices\n2.8.1 Backing up files\n2.8.2 Scanning for viruses\n3.\nUnderpinning\nskills\n3.1 Drafting and designing skills\n3.2 Selection of cutting tools\n3.3 Use of measuring instruments\n3.4 Determination of workpiece specifications\n3.5 Computation of feed, cutting speed and machine rpm\n3.6 Application of G – codes and M – codes\n3.7 Communication skills\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Computer equipment, printer/plotter, software and facilities\nappropriate to processes or activities\n4.2 Sample part/model\n4.3 Measuring instruments\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation / demonstration of creation of CAD\ndrawings and CAM programs\n5.2 Written exam\n5.3 Demonstration\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 56 ---\nTR – CAD CAM Operation NC III\n\n54"
