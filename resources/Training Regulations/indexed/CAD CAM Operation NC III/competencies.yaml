        "source_text": "MEE821313\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to apply\nCAD/CAM program for creation of CAD drawings and\nCNC programs based on drawing specifications. It\ndetails the requirements for creating drawings with the\naid of computer software to generate simple and / or\ncomplex CNC machining programs for basic and\nadvanced turning and milling.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\nWorkpiece, drawing, model or a concept of a new\ndesign are analyzed to produce CAD drawing and\nCAM program.\nSystem parameters are selected according to the\nrequirements of the operation.\n2.\nCreate / import CAD\ndrawing\n2.1\n\n2.2\n\n2.3\n\n2.4\nDrawing reference point is established based on job\nrequirement / workpiece.\nProfile, shape, contour of the workpiece are created\n/ imported using CAD according to job requirements\nand drawing standards.\nCreated / imported drawings are edited according to\ndrawing standards.\nCreated / edited drawing are saved according to job\nrequirements.\n3.\nSet CAM parameters\n3.1\n\nCAM parameters are identified and set according to\njob requirements / part to be produced.\n4.\nCreate / edit CNC\nprograms\n4.1\n\n4.2\n\n4.3\n\n4.4\n\n4.5\n\n4.6\n4.7\nTools are created (if required) for the tool library and\nloaded based on job requirements.\nCoordinates are set for tool path or machining\nfunctions based on the CAD drawing.\nWorkpiece Zero point identified based on the CAD\ndrawing.\nTool paths generated in cycles format in accordance\nwith the software used.\nTool paths are simulated in moderate speed to\ndetermine the correctness of the tool movements and\nother work parameters.\nCycles are edited if required.\nCNC program generated through post processor in\naccordance with selected machine control standard.\n5.\nLoad and run program at\nCNC machine\n\n5.1\n5.2\n\n5.3\n5.4\nProgram is loaded using the appropriate devices.\nDry run is performed in the machine in accordance\nwith established procedures.\nProgram is executed to produce part/ workpiece.\nProblems encountered are documented, reported\nor referred to concerned personnel in accordance\nwith worksite procedures.\n\nNote: (Machine and workpiece are pre-set by the machine setter)\n\n--- PDF PAGE 52 ---\nTR – CAD CAM Operation NC III\n\n50\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. System Parameters\nMay include but are not limited to the following:\n1.1 Metric or English\n1.2 Layers\n1.3 Tool bars (dimensioning, line types, editing, hatching,\n etc.)\n2. Drawing standards\nBased on international accepted standard such as;\n2.1 ISO\n2.2 German (DIN)\n2.3 Japanese (JIS)\n2.4 American (ANSI)\n2.5 And other existing standards\n3. CAM Parameters\nMay include but are not limited to the following:\n3.1 Machine type\n3.2 Workpiece specification\n3.3 Workpiece dimension\n3.4 Tool geometry\n3.5 Workpiece zero point\n3.6 Machine zero point\n3.7 Tool measurement (tool offset, tool wear)\n3.8 Surface texture\n4. Tools\nTools in the tool library but are not limited to the following\ncutting tools:\n4.1 lathe machine\n4.2 milling machine\n4.3 wire cut (EDM)\n4.4 Spark erosion machine\n5. Software\nLicensed software which is commonly used by the local\nindustry such as:\n5.1 Mastercam\n5.2 Solid Works\n5.3 Esprit\n5.5 Goelan\n5.6 Hypermill\n5.7 Pro engineer\n5.8 Surfcam\n5.9 Unigraphics\n5.10 Wincam\n5.11 Heidenhein\n5.12 Turbotek\n5.13 CAM Concept\n5.14 and other CAD/CAM software\n\n--- PDF PAGE 53 ---\nTR – CAD CAM Operation NC III\n\n51\n\n6. Machine control\nMay include:\n6.1\nHeidenhein\n6.2\nFanuc\n6.3\nSentrol\n6.4\nMazatrol\n6.5\nSinumerik\n6.6\nAnd other existing controls\n7. Problems encountered\nMay include products not within specifications:\n7.1\nIncorrect machine set-up\n7.2\nIncorrect parameter setting\n7.3\nDefective raw materials\n7.4\nAnd other related problems\n8. Concerned personnel\nMay include:\n8.1\nProduction supervisor\n8.2\nProgrammer\n8.3\nDesigner\n8.4\nOther operators\n8.5\nClient\n8.6\nQuality control inspector\n\n--- PDF PAGE 54 ---\nTR – CAD CAM Operation NC III\n\n52\nEVIDENCE GUIDE\n1.\nCritical aspects\nof evidence\nAssessment requires evidence that the candidate:\n1.1 Determined job requirements\n1.2 Created / imported CAD drawing\n1.3 Set CAM parameters\n1.4 Created / edited CNC programs\n1.5 Loaded and run program at CNC machine\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Computer hardware safety practices\n2.1.1 Correct voltage supply to computer equipment\n2.1.2 Use of voltage regulator and surge protector\n2.1.3 Start up and shutdown procedures\n2.1.4 Implementation of Housekeeping(5S)\n2.1.5 Application of First-aid\n2.1.7 Use of fire extinguishers\n2.2 Drawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic projection (1st and 3rd angle)\n2.2.3 Perspective\n2.2.3.1 isometric\n2.2.3.2 dimetric\n2.2.3.3 cavalier\n2.2.3.4 militar\n2.2.4 Sections\n2.2.4.1 full section\n2.2.4.2 half section\n2.2.4.3 partial or local section\n2.2.4.4 revolve section\n2.2.4.5 assembly and detailed drawings\n2.2.5 Dimensioning\n2.2.5.1 part dimension\n2.2.5.2 location dimension\n2.2.5.3 dimensioning techniques\n2.2.6 Tolerances\n2.2.6.1 bilateral tolerance\n2.2.6.2 unilateral tolerance\n2.2.6.3 ISO system of tolerance for hole and shaft\n2.2.6.4 general tolerance\n2.2.6.5 Geometrical Tolerances (form and position)\n2.2.7 Surface condition (surface finish/texture)\n2.2.8 Limits and fits\n2.2.8.1 classification of fits\n2.2.8.2 hole basis system of fits\n2.2.8.3 shaft basis system of fits\n2.3 Shop mathematics\n2.3.1 Four fundamental operation\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Square and square root of numbers\n2.3.5 Pythagorean theorem\n2.3.6 Basic trigonometric function\n\n--- PDF PAGE 55 ---\nTR – CAD CAM Operation NC III\n\n53\n2.4 Materials and related science\n2.4.1 Classification and mechanical properties of\nengineering materials\n\n2.5 Lathe and Milling machine operations\n2.5.1 Lathe / milling types and specifications\n2.5.2 Lathe / milling parts and functions\n2.5.3 Setting cutting speed, rpm, feed rate\n2.5.4 Work holding and tool holding devices\n2.5.5 Turning / milling tools and tool geometry\n2.5.6 Tooling, set up and parameters in turning / milling\noperations\n2.5.7 Lathe / milling accessories, fixtures and attachments\n\n2.6 Application of G – codes and M – codes\n\n2.7 Use of Personal Computer Hardware and Software\n 2.7.1 Windows operation\n 2.7.2 Connection to peripherals (Printer, plotter, CNC\nmachines)\n2.7.3 Printing and plotting operations\n2.7.4 File management\n\n2.8 Safe Computer Practices\n2.8.1 Backing up files\n2.8.2 Scanning for viruses\n3.\nUnderpinning\nskills\n3.1 Drafting and designing skills\n3.2 Selection of cutting tools\n3.3 Use of measuring instruments\n3.4 Determination of workpiece specifications\n3.5 Computation of feed, cutting speed and machine rpm\n3.6 Application of G – codes and M – codes\n3.7 Communication skills\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Computer equipment, printer/plotter, software and facilities\nappropriate to processes or activities\n4.2 Sample part/model\n4.3 Measuring instruments\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation / demonstration of creation of CAD\ndrawings and CAM programs\n5.2 Written exam\n5.3 Demonstration\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 56 ---\nTR – CAD CAM Operation NC III\n\n54"
