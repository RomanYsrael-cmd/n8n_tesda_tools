  "source_text": "bench work\nthe operations incident to the process of laying out, fitting,\nassembling, etc… when the work is placed on the bench or in\na bench vise\n\nboring\nis the operation of enlarging a hole by means of an adjustable\ncutting tool with only one cutting edge\n\nchipping\nis the operation of removing/cutting metal using hammer and\nchisel\n\ncounter boring\nis the operation of enlarging the end of a hole cylindrically\n\ndrilling\nis the operation of producing a circular hole by removing solid\nmetal\n\nfacing\nthe lathe operation of finishing the ends of the work, to make\nthe piece the right length. Also known as squaring\n\ngrinding\nrefers to the removal of material from a workpiece with\ngrinding wheel\n\nlaying out\nterm used to include the marking or scribling of center points,\ncircles, arcs, or straight lines upon metal surfaces, either\ncurved or flat, for the guidance of the worker\n\nmilling\nrefers to removal of metal by feeding a workpiece through the\nperiphery of rotating circular cutter\n\nreaming\nis an operation of sizing and finishing a hole by means of a\ncutting tool having several cutting edges. reaming serves to\nmake the hole smoother, straighter, and more accurate\n\nspot-facing\nis the operation of smoothing and squaring the surface\naround a hole\n\ntapping\nis the operation of forming internal threads by means of a tool\ncalled tap\n\nturning\nrefers to shaping a workpiece by gripping it in a workholding\ndevice and rotating it under power against a suitable cutting\ntool\n\nCNC machining\nrefers to the fabrication of work piece either turning, milling or\nany other machining process with the use of Computerized\nNumerically Controlled machine tools\n\nProgramming\nthe process of coding machining conditions in which\ninformations such as cutter dimensions, cutter movement ,\nprocessing orders, federate or spindle speed all under fixed\nregulation or specified format which refers to the workpiece\ndrawing to instruct Numerically Controlled machine tool\n\nCAD\nComputer Aided Design – the use of graphics-oriented\ncomputer software for designing and drafting applications\n\nCAM\nComputer Aided Manufacturing- computer software that\ngenerates programs for the operation of NC (numerical\ncontrol) machine tools\n\n--- PDF PAGE 68 ---\nTR – CAD CAM Operation NC III\n\n66",
