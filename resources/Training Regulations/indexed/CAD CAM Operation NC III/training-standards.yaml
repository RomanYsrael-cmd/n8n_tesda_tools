.3 Analyze results\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n6. Use relevant\ntechnologies\n\n6.1 Study / select\nappropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain / enhance\nrelevant technology\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n questioning\n\n--- PDF PAGE 58 ---\nTR – CAD CAM Operation NC III\n\n56\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\n practices\n\n1.1 Identify hazards\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling\nof tools, equipment\nand materials\n1.4 Perform first aid\n1.5\nUse fire extinguisher\n• Lecture\n• Group\n discussion\n• Interaction\n• Role playing /\n Simulation\n\n• Observation\n• Demonstration\n• Interview /\n Questioning\n\n2. Interpret\nworking\ndrawing and\nsketches\n\n2.1 Interpret technical\n drawing\n2.2 Prepare freehand\nsketch of parts\n2.3 Interpret details from\n freehand sketch\n• Lecture\n• Group\n discussion\n• Interaction\n\n• Observation\n• Interview /\n Questioning\n\n3. Select / cut\nworkshop\nmaterials\n\n3.1 Determine requirement\n3.2 Select and measure\n materials\n3.3 Cut materials\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n4. Perform shop\ncomputations\n(Basic)\n\n4.1 Perform four\nfundamentals\n operations\n4.2 Perform basic\ncalculations\n involving fractions and\n decimals\n4.3 Perform basic\ncalculations\n involving percentages\n4.4 Perform basic\ncalculation\n involving ration and\n proportion\n4.5 Perform calculations on\nalgebraic expressions\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n5. Measure\n workpiece\n (Basic)\n\n5.1 Select and use\nmeasuring tools\n5.2 Clean and store\nmeasuring tools\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\nQuestioning\n6. Perform\nroutine\nhousekeeping\n\n6.1 Organize work area\n6.2 Clean Work area\n\n• Lecture\n• Group\n discussion\n• Simulation\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 59 ---\nTR – CAD CAM Operation NC III\n\n57\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7. Perform Shop\ncomputations\n(Intermediate)\n\n7.1 Perform calculations\n involving triangles\n7.2 Calculate taper\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n8. Measure\nworkpiece\nusing angular\nmeasuring\ninstruments\n\n8.1 Select and use angular\n measuring tools\n8.2 Maintain angular\nmeasuring tools\nClean and store\nmeasuring Tools\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n9. Perform shop\n Computation\n (Advanced)\n\n9.1 Calculate gear ratio\n9.2 Solve indexing\nproblems\n9.3 Solve gearing\nproblems\n9.4 Use geometrical\nprinciples in the\nsolution of problems\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n10. Measure\nworkpiece\n using gages\n and surface\n texture\n comparator\n10.1 Select and use fixed\nand adjustable gages\n10.2 Perform surface\ntexture measurements\n10.3 Clean and store\nmeasuring tools\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n11. Perform\npreventive\n and\n corrective\n maintenance\n11.1 Perform inspection of\n machine\n11.2 Perform cleaning and\n lubricating of machine\n11.3 Perform minor\n machine repair and\n adjustments\n11.4 Maintain hand tools\n• Lecture\