      "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 To attain the National Qualification of Tool and Die Making NC II, the candidate must demonstrate competence in all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.3 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.3.1 Graduates of formal, non-formal and informal including enterprise-based training programs. 4.3.2 Holders of Machining NC I or COC in Benchwork, Turning, and Milling."
    },
    {
      "source_text": "4.3.3 Experienced workers (wage employed or self employed)"
    },
    {
      "source_text": "4.3 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTOQS)\"."
