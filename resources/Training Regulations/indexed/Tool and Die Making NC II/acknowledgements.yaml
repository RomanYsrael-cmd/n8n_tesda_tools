      "source_text": "1. Critical aspects of Competency Assessment requires evidence that that the candidate: 1.1 performed inspection of machine 1.2 performed cleaning and lubricating of machine performed minor machine repairs and adjustments 2. Underpinning knowledge 2.1 Proper cleaning and oiling 2.2 Kinds of oil 2.3 Parts and function of machine tools 2.4 Cutting oil, coolant or compound 2.5 Pulleys and belts 2.6 Location of main switches of the machine 2.7 Handling and storage of tools 2.8 Checklist of safe working conditions 2.9 Procedures in cleaning and disposal of waste materials 3. Underpinning skills 3.1 Inspecting and repairing hand tools 3.2 Inspecting and changing drive pulleys and belts 3.3 Replacing and adjusting machine parts 3.4 Distinguishing old and new coolant 3.5 Distinguishing odor of polluted coolant 3.6 Selecting coolant, cutting oil or compounds 3.7 Changing coolant 3.8 Inspecting work area for safe working environment 3.9 Cleaning work area 3.10 Disposing metal scraps, chips and waste materials. 4. Resource Implications The following resources MUST be provided: 4.1 Tools, equipment and facilities appropriate to processes or activity 4.2 Materials relevant to the proposed activity 5. Method of Assessment Competency may be assessed through: 5.1 direct observation of activities 5.2 oral or written questioning 6. Context for Assessment Competency may be assessed in the workplace or in simulated workplace environment."
