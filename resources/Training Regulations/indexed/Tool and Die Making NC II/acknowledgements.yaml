    },
    {
      "source_text": "2.3"
    },
    {
      "source_text": "2.4"
    },
    {
      "source_text": "Die set on the bolster plate and punch shank inserted into ram hole and tightened."
    },
    {
      "source_text": "Die set clamped on the bolster plate using the right tightening sequence."
    },
    {
      "source_text": "Press ram adjusted to bottom dead center with the punch end to the required punch setting."
    },
    {
      "source_text": "Press operated manually to check position of punch."
