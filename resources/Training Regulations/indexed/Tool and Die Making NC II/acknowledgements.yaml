    {
      "source_text": "Blank-through die A set of lower and upper plate where the die assembly is set. The upper plate called the punch holder has bushings pressed into it that slides on guide posts pressed unto the lower plate called the die holder to maintain proper alignment of the members of the die Is the part of the die that cuts or remove the blank from the strip. Also called perforator, pierces holes through the blank. They are usually round and usually provided with a shoulder to retain them on a punch plate."
    },
    {
      "source_text": "Plate which retains punches with their heads against the punch holder of the die set. The part with acorn-shaped heads which enter previously pierced holes to shift the work before blanking occurs. A thin member against which the material strip is held against by the operator (or pusher) in its travel through the die. Similar to the back gage but shorter and placed opposite it . This is optional as other has none depending upon the construction of the fixed stripper."
    },
    {
      "source_text": "Locates the lead end of the material strip at the first station of a progressive die."
    },
    {
      "source_text": "Pins or plate that locates a single blank in the die."
    },
    {
      "source_text": "Locates the strip automatically while it is fed through the die."
    },
    {
      "source_text": "Plate that removes the material strip from around the blanking and piercing punches during the upward movement of the die."
    },
    {
      "source_text": "A die in which the stock strip is advanced through a series of operations which work toward completion of a piece part."
    },
    {
      "source_text": "The amount advanced by a strip for each stroke of the press. It is equal to the blank width plus the width of the scrap web (bridge) between blanks."
    },
    {
      "source_text": "Basic divisions of a progressive die into which the stock strip is registered."
    },
    {
      "source_text": "A die that produces a plain blank in one stroke of a press."
    },
