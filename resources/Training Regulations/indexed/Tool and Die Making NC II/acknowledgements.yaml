      "source_text": "2 TRAINING REGULATIONS FOR TOOL AND DIE MAKING NC II"
    },
    {
      "source_text": "SECTION 1 TOOL AND DIE MAKING NC II QUALIFICATION"
    },
    {
      "source_text": "The Tool and Die Making NC II Qualification consists of competencies that a person must achieve to machine die components, fit and assemble dies and test and try die."
    },
    {
      "source_text": "The Units of Competency comprising this qualification include the following:"
    },
    {
      "source_text": "Code No. BASIC COMPETENCIES 500311101 Participate in workplace communication 500311102 Work in team environment 500311103 Practice career professionalism 500311104 Practice occupational health and safety procedures"
    },
    {
      "source_text": "Code No. COMMON COMPETENCIES MEE722204 Perform shop computations (Intermediate) MEE722205 Measure workpiece (Intermediate) MEE722207 Perform preventive and corrective Maintenance"
    },
    {
      "source_text": "Code No. CORE COMPETENCIES MEE722301 Machine Die Components MEE722302 Fit and Assemble Dies MEE722303 Test and Try Die"
    },
    {
      "source_text": "A person who has achieved this qualification is competent to be:"
    },
    {
      "source_text": "Tool Maker, Die maker, Machinist"
    },
    {
      "source_text": "-- PDF PAGE 4 --- Tool and DieMaking NCII 12/02/04"
    },
