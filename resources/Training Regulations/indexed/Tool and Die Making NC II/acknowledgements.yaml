      "source_text": "45 Definition of Terms"
    },
    {
      "source_text": "1. Press A machine by which pressure is applied to a workpiece to cut, pierce, bend or shape it 2. Die A tool used to cut shaped blanks or holes; and bend and form metals into desired shape 3. Blanking A press operation wherein shaped blanks are cut from metal by striking it with a punch against a die by a press. 4. Bending A press operation that involves forming a metal part into a curved or angular shape, or the stretching or flanging of it along a curved path 5. Drawing A press operation that forces plastic deformation of metal in a die to form recessed parts or cuplike shapes 6. Drawing die A die that forms sheet metal into cuplike, wrinkle-free shapes 7. Feed stock The raw material furnished to a press machine to form or shape the metal 8. Trimming Removing excess materials from drawn or blanked part 9. Punching A piece (or a blank) is removed from a sheet metal or other material by a punch press 10. Piercing Pressworking where holes on metal is the desired output 11. Ram A plunger, weight or other guided structure for exerting pressure by impact 12 Tolerance A permissible deviation from a specified value, expressed in actual values or more often as a percentage of the nominal value 13 Limits The maximum and minimum values prescribed for a specific dimension; the limits may be of size if dimension concerned is size dimension, or may be of location if the dimension concerned is a location dimension 14. Fit The dimensional relationship between mating parts, such as press, shrink or sliding fit"
    },
