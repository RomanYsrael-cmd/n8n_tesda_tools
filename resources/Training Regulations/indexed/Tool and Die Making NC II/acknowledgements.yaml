    },
    {
      "source_text": "4. Maintain OHS awareness"
    },
    {
      "source_text": "4.1 Emergency-related drills and trainings are participated in as per established organization guidelines and procedures 4.2 OHS personal records are completed and updated in accordance with workplace requirements"
