      "source_text": "36 CORE COMPETENCIES"
    },
    {
      "source_text": "Unit of Competency Learning Outcomes Methodology Assessment Approach 1. Machine Die Components 1.1 Clarify job instructions as to extent of job and work deadline. 1.2 Discuss with die designer or supervisor the die design, parts drawing, parts for machining, for purchase, for jobbing out. 1.3 Gather all materials and check for right specifications and sufficient machining allowances. 1.4 Plan sequence of operation of each part specifying equipment, tools, speeds and feeds.. 1.5 Machine all plate parts square and flat. 1.6 Mark hole locations, die openings and punch contours according to drawing. 1.7 Turn all die parts of circular shapes with allowances for grinding and die clearances. 1.8 Mill all regular- or irregular- shaped parts according to drawing. 1.9 Mill die openings slightly undersized to allow for final fitting operation. (or arrange for EDMing of die hole)"
    },
    {
      "source_text": "1.10 Mill holes on stripper for the punch to pass through."
    },
    {
      "source_text": "Lecture/ discussion"
    },
    {
      "source_text": "Self-paced instructions"
    },
    {
      "source_text": "Workshop project"
    },
    {
      "source_text": "On-the-job training"
    },
    {
      "source_text": "Observation over time"
    },
    {
      "source_text": "Written or oral"
    },
    {
      "source_text": "Demonstration"
    },
    {
      "source_text": "1.11 Mill back gage and front spacer if required. 1.12 Machine template of the product with applied tolerance. 1.13 Arrange for heat treatment of parts to be hardened except die block which is still to be finished manually.. 1.14 Grind die"
    },
    {
      "source_text": "-- PDF PAGE 38 --- Tool and DieMaking NCII 12/02/04"
    },
    {
      "source_text": "37 2. Fit and assemble die"
    },
    {
      "source_text": "2.1 File die block opening to the template.. 2.2 Determine which part to be fitted another part. 2.3 Drill holes to assemble die block with die holder"
    },
    {
      "source_text": "2.21 Position the punch on the die opening with shim all around representing the die clearance. Drill holes to assemble the punch with the punch holder."
    },
    {
      "source_text": "2.22 Drill holes simultaneously on the fixed stripper plate, back gage, front spacer and die block"
    },
    {
      "source_text": "2.23 In case of movable stripper, drill holes on stripper plate and punch holder to accommodate springs and stripper bolts."
    },
    {
      "source_text": "2.24 Fabricate front stop and automatic stop for fitting with the die block."
    },
    {
      "source_text": "2.8 Assemble die to the die holder"
    },
    {
      "source_text": "2.25 Assemble the punch to the punch holder"
    },
    {
      "source_text": "Lecture/ discussion"
    },
    {
      "source_text": "Self-paced instructions"
    },
    {
      "source_text": "Workshop project"
    },
    {
      "source_text": "On-the-job training"
    },
    {
      "source_text": "Observation over time"
    },
    {
      "source_text": "Written or oral"
    },
    {
      "source_text": "Demonstration"
    },
    {
      "source_text": "2.26 Assemble fixed stripper, Back gage, and front spacer with the die block."
    },
    {
      "source_text": "2.27 In case of movable stripper, assemble stripper with the punch holder with springs and stripper bolts."
    },
    {
      "source_text": "2.28 Try the die using paper as the workpiece and examine the results."
    },
    {
      "source_text": "-- PDF PAGE 39 --- Tool and DieMaking NCII 12/02/04"
    },
    {
      "source_text": "38 3. Test and try Die"
    },
    {
      "source_text": "3.1 Prepare the press for testing"
    },
    {
      "source_text": "3.1 Mount the press on the die. Insert punch shank to the ram hole. 3.2 Adjust ram to the bottom dead center and adjust punch end to position a little below the thickness of material. 3.3 Clamp die and tightened using the correct tightening sequence. 3.4 Turn press manually to test the alignment of the die. 3.5 Prepare material by shearing of strips, or by individual blank, or by coil strip as required. 3.6 Perform the pre-start checks of the press. 3.7 Start the press safely. 3.8 Load the material and trip the switch. 3.9 Examine the product and check against the drawing. 3.10 Make the necessary rectification. 3.12. Observe necessary safety precautions in operating the press."
    },
