      "source_text": "BASIC COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION UNIT CODE : 500311105 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to gather, interpret and convey information in response to workplace requirements. ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Obtain and convey workplace information 1.1 Specific and relevant information is accessed from appropriate sources 1.2 Effective questioning , active listening and speaking skills are used to gather and convey information 1.3 Appropriate medium is used to transfer information and ideas 1.4 Appropriate non- verbal communication is used 1.5 Appropriate lines of communication with supervisors and colleagues are identified and followed 1.6 Defined workplace procedures for the location and storage of information are used 1.7 Personal interaction is carried out clearly and concisely 2. Participate in workplace meetings and discussions 2.1 Team meetings are attended on time 2.2 Own opinions are clearly expressed and those of others are listened to without interruption 2.3 Meeting inputs are consistent with the meeting purpose and established protocols 2.4 Workplace interactions are conducted in a courteous manner 2.5 Questions about simple routine workplace procedures and maters concerning working conditions of employment are asked and responded to 2.6 Meetings outcomes are interpreted and implemented 3. Complete relevant work related documents 3.1 Range of forms relating to conditions of employment are completed accurately and legibly 3.2 Workplace data is recorded on standard workplace forms and documents 3.3 Basic mathematical processes are used for routine calculations 3.4 Errors in recording information on forms/ documents are identified and properly acted upon 3.5 Reporting requirements to supervisor are completed according to organizational guidelines"
    },
