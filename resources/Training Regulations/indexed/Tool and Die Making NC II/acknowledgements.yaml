      "source_text": "3.3"
    },
    {
      "source_text": "3.4 Die base assembled to bottom die holder according to work procedure. Punch plate or punch pedestal drilled for mounting to punch holder according to work procedure Stripper plate and punch plate and guide pin holes drilled and tapped according to work procedure. Drilling operations of screw holes done according work procedure. 4. Assemble die 4.1"
