    },
    {
      "source_text": "Press operated according to standard procedure."
    },
    {
      "source_text": "Material is loaded and the press is tripped for sample product."
    },
    {
      "source_text": "4."
    },
    {
      "source_text": "Inspect product"
    },
    {
      "source_text": "4.1"
    },
    {
      "source_text": "Sample inspected for dimensional errors and deviations."
    },
    {
      "source_text": "5."
    },
    {
      "source_text": "Rectify die"
    },
    {
      "source_text": "5.1"
    },
    {
      "source_text": "Die corrected according to deviations found and standard procedures.."
