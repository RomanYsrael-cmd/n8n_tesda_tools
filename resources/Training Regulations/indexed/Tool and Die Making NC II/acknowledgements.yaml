      "source_text": "33 SECTION 3. TRAINING STANDARDS"
    },
    {
      "source_text": "These guidelines are set to provide the Technical and Vocational Education and Training (TVET) providers with information and other important requirements to consider when designing training programs for TOOL AND DIE MAKING NC II."
    },
    {
      "source_text": "3.1 CURRICULUM DESIGN"
    },
    {
      "source_text": "Course Title"
    },
    {
      "source_text": ": TOOL AND DIE MAKING NC Level: NC II"
    },
    {
      "source_text": "Nominal Training Duration : 598 Hours"
    },
    {
      "source_text": "This qualification is designed to develop knowledge, desirable attitudes and skills in Tool and Die Making NC II"
    },
    {
      "source_text": "It covers the competencies required to Machine Die Components, Fit and Assemble Dies and Test and Try Dies."
    },
    {
      "source_text": "To obtain this, all units of competency prescribed for this qualification must be achieved."
    },
    {
      "source_text": "-- PDF PAGE 35 --- Tool and DieMaking NCII 12/02/04"
    },
    {
      "source_text": "34 BASIC COMPETENCIES"
    },
    {
      "source_text": "Unit of Competency Learning Outcomes Methodology Assessment Approach 1. Participate in workplace communication 1.1 Explain routinary speaking & messages in a workplace 1.2 Follow routinary speaking & messages 1.3 Perform work duties following written notices"
    },
    {
      "source_text": "Group discussion"
