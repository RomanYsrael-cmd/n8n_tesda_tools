    {
      "source_text": "2.8 Plan sequence of operation for each part specifying equipment, tools, speeds and feeds requirement. Die plate parts initially milled to requited dimensions, parallelity and squareness Hole locations and die block hole opening and punch contours marked according the drawing. Die parts of cylindrical section turned and finished to required dimension Die parts of non-cylindrical sections milled to required shape according the drawing and specification. Die block openings milled to slightly undersize dimensions to allow for final finishing and fitting operation. Die parts are ground and finished according the specifications. Die block, punch plate or pedestal punch drilled with assembly holes according drawing specifications."
