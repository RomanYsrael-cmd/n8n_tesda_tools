      "source_text": "UNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND SAFETY PROCEDURES UNIT CODE : 500311108 UNIT DESCRIPTOR : This unit covers the outcomes required to comply with regulatory and organizational requirements for occupational health and safety."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Identify hazards and risks 1.1 Safety regulations and workplace safety and hazard control practices and procedures are clarified and explained based on organization procedures 1.2 Hazards/risks in the workplace and their corresponding indicators are identified to minimize or eliminate risk to co-workers, workplace and environment in accordance with organization procedures 1.3 Contingency measures during workplace accidents, fire and other emergencies are recognized and established in accordance with organization procedures 2. Evaluate hazards and risks 2.1 Terms of maximum tolerable limits which when exceeded will result in harm or damage are identified based on threshold limit values (TLV) 2.2 Effects of the hazards are determined 2.3 OHS issues and/or concerns and identified safety hazards are reported to designated personnel in accordance with workplace requirements and relevant workplace OHS legislation"
    },
