tored measuring instruments \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1  Types, purposes and accuracy of angular measuring \ninstruments \n2.2  Capability of measuring tools \n2.3  Techniques for measuring angles and tapers \n \n3. \nUnderpinning \nskills \n3.1 Safe handling of measuring tools \n3.2 Reading vernier scale \n3.3 Reading micrometer \n4. \nResource \nimplications \nThe following resources MUST be provided: \n4.1  Tools, equipment and facilities appropriate to the activity \n4.2  Specimen component or part to the proposed activity \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1  direct observation \n5.2  demonstration \n5.3   written or oral short answer questions \n5.4   portfolio \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
