        "source_title": "TEST AND TRY DIE",
        "source_text": "--- PDF PAGE 31 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n30\n \nUNIT OF COMPETENCY : \nTEST AND TRY DIE \n \nUNIT CODE  \n \n: \nMEE722    303 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills involved in   \nthe die setting and the press adjustment for the testing  \nof dies and press run. \n \n \nELEMENTS \n \nPERFORMANCE CRITERIA \nItalicized Terms Are Elaborated in the Range Of \nVariables \n \n1.\n \nPrepare for testing of \ndies \n \n \n1.1\n \n1.2\n \nPress checked for suitability to die shut off height. \n \nMaterial strip or blank cut to required size or width \nand grain orientation. \n \n2.\n \n \nSet up press and die \n \n2.1\n \n \n2.2\n \n \n2.3\n \n \n2.4\n \nDie set on the bolster plate and punch shank \ninserted into ram hole and tightened. \n \nDie set clamped on the bolster plate using the right \ntightening sequence. \n \nPress ram adjusted to bottom dead center  with the \npunch end to the required punch setting. \n \nPress operated manually to check position of punch.\n \n3.\n \nOperate press \n \n3.1\n \n3.2\n \n3.3\n \nPress started up safely and correctly. \n \nPress operated according to standard procedure. \n \nMaterial is loaded and the press is tripped for \nsample product.\n \n4.\n \nInspect product \n \n4.1\n \nSample inspected for dimensional errors  and \ndeviations.\n \n5.\n \nRectify die \n \n5.1\n \nDie corrected according to deviations found and \nstandard procedures..\n\n--- PDF PAGE 32 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n31\n \nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n \n1.\n \nPress  \n \n1.1\n \n1.2\n \n1.3\n \n1.4\n \nTypes of Press \n \nCapacity \n \nPress shut height \n \nParts of a Press and their Functions \n \n2.\n \nPress Work Materials \n \n2.1\n \n2.2\n \n2.3\n \n2.4\n \n2.5\n \n \n \n \n2.6\n \nLow carbon steel \n \nSilicon steel \n \nBrass \n  \nCopper \n \nBlank \n Strip material \n Single blank material \n Coiled material \n \nGrain orientation \n \n3.\n \nDie  \n \n3.1\n \nDie shut height\n\n--- PDF PAGE 33 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n32\nEVIDENCE GUIDE \n \n1. \n \nCritical aspects of \ncompetence \n \n1.1\n1.2\n1.3\n1.4\n1.5\n1.6\nAssessment requires evidence that the candidate \nSelected the right press for use in testing. \nPrepared the blank materials required  \nSet the die to the according to procedures \nOperated the press safely as per SOP \nInspected the sample produced  \nRectified the die to correct  deviation if needed \n \n2. \n \n \nUnderpinning \nknowledge \n2.1\n2.2\n2.3\n2.4\n2.5\n2.6\nPress principle of operation \nSafety operation of the press \nCommon faults in pressed materials \nSafe operating  of a press. \nPlate strip shearing \nSingle blank shearing \n \n3. \n \nUnderpinning skills \n \n3.1\n3.2\n3.3\n3.4\nRam adjustment \nBolt tightening sequence \nUse of wrenches and spanners \nUse of measuring tools \n \n4. \n \nResource implication  \n \n4.1\n4.2\n4.3\n4.4\n4.5\nThe following resources should be provided \nPress \nDie \nBlank material \nProduct drawing \nMeasuring tools \n \n5. \n \nMethod of  \nassessment \n \n5.1\n5.2\nThe following assessment method are suggested \nDirect observation \nWritten or oral question demonstration \n \n6. \n \nContext of assessment\n6.1\nCompetency may be assessed in the workplace or in \nworkplace Simulated environment\n",
