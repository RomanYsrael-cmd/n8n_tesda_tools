          "source_text": "VARIABLE \n \nRANGE \n \n1 \n \nFitting tools and \nequipment \n1.1\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n1.2\n \n \nTools \n set of files           \n vise with soft jaws \n transfer screws   \n transfer punches                       \n angle plate                 \n vernier height gage     \n center punch             \n parallel clamps          \n set of twist drills \n hand taps \n counter bore \n portable electric drill \n parallel set \n reamers \n allen wrench \n scribers \n shims \n dowels \n \nEquipment \n filing machine \n die lifter \n \n \n2.\n  \nDrilling operations \n \n2.1\n2.2\n2.3\n2.4\n2.5\n \nDrilling with tap drill size \nDrilling with clearance holes \nCounterboring \nChamfering \nTapping\n\n--- PDF PAGE 30 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n29"
