        "source_title": "FIT AND ASSEMBLE DIE",
        "source_text": "--- PDF PAGE 28 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n27\nUNIT OF COMPETENCY : \nFIT AND ASSEMBLE DIE \n \nUNIT CODE  \n \n: \nMEE722302 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills in the fitting  \n \n \n \n \nand assembly of simple blanking and piercing dies and  \n \n \n \n \nbending dies and limited to 2-station progressive dies utilizing  \n \n \n \n \nblanking and piercing, chop off  and parting principle. \n \n \nELEMENTS \n \nPERFORMANCE CRITERIA \nItalicized Terms Are Elaborated in the Range Of Variables \n \n1.\n \nDetermine die parts to \nbe fitted with one \nanother. \n1.1\n \n1.2\n \n1.3\n \nAssembly drawings interpreted to determine which part to \nbe fitted with another part. \nMachined parts are checked to determine additional \nfitting or finishing work. \nFitting tools and equipment are identified according to \nfitting requirements. \n2 \nFit die parts \n2.1\n \n2.2\n2.3\nTemplate of product prepared as reference for finish \nfiling.  \nDie holes are finish-filed to template size and required \nangle clearance \nStripper plate openings fitted with punches \n \n3.\n \n \nDrill assembly holes \n3.1\n \n3.2\n \n3.3\n \n3.4\nDie base assembled to bottom die holder according to \nwork procedure. \nPunch plate or punch pedestal drilled for mounting to \npunch holder according to work procedure \nStripper plate and punch plate and guide pin holes  drilled \nand tapped according to work procedure. \nDrilling operations of screw  holes done according work \nprocedure.     \n4.  Assemble die \n4.1\n \n4.2\n \n4.3\n \n4.4\n4.5\n4.6\n4.7\nDie base assembled to bottom die holder according to \nwork procedure. \nPunch plate and pedestal punch mounted to punch \nholder according to work procedure \nFixed stripper plate mounted to die block or spring \nstripper mounted on punch plate as per drawing \nOther parts assembled as required  \nDie tested for alignment as per work procedure \nAdjustment made according to found errors \nDowel holes drilled according to work procedure\n\n--- PDF PAGE 29 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n28\n \nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n \n1 \n \nFitting tools and \nequipment \n1.1\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n1.2\n \n \nTools \n set of files           \n vise with soft jaws \n transfer screws   \n transfer punches                       \n angle plate                 \n vernier height gage     \n center punch             \n parallel clamps          \n set of twist drills \n hand taps \n counter bore \n portable electric drill \n parallel set \n reamers \n allen wrench \n scribers \n shims \n dowels \n \nEquipment \n filing machine \n die lifter \n \n \n2.\n  \nDrilling operations \n \n2.1\n2.2\n2.3\n2.4\n2.5\n \nDrilling with tap drill size \nDrilling with clearance holes \nCounterboring \nChamfering \nTapping\n\n--- PDF PAGE 30 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n29\nEVIDENCE GUIDE \n \n1. \n \nCritical aspects of \ncompetency \n \n1.1\n1.2\n \n1.3\nAssessment requires evidence that the candidate \nDie hole filed to a template and angle clearance \nAssembly  holes drilled following the standard work  \n procedure \nDie assembled according to the right sequence\n \n2. \n \nUnderpinning \nknowledge. \n2.1\n2.2\n2.3\n2.4\nPunch and die  clearances and applications. \nTypes of file \n2-reference method of layout \nDetermining tap drill size\n \n3. \n \nUnderpinning skills. \n2.1\n2.2\n2.3\n2.4\n2.5\n2.6\n2.7\nLayout using Vernier height gauge. \nFiling of die hole using a template \nDrilling of holes on mating parts  \nFiling radius of punch corners \nHole tapping. \nCounter boring of holes. \nUse of  transfer screws and transfer punch\n \n5. \n \nResource implications  \n \n5.1\n \n \n \n \n \n \n \n \n \n \n \n5.2\nThe following resources must be provided: \nLayout tools: \n     -vernier height gauge              \n     -angle plate                             \n     -center punch                          \n     -machinist hammer \n     -parallels \n     -parallel clamps \n     -transfer screws \n     -required drills \n     -required  files \n     -required hand taps \n     -tap wrench \nAssembly tools \n     -allen wrench \n    -mallet\n \n6. \n \nMethod of assessment \n \n \n \n6.1\n \n6.2\n6.3\n6.4\nCompetency must be assessed through \nObservation of the candidate performing a range of \ntasks while performed in the workplace  \nWritten test \nOral short answer questions \nInspection of assembled die and resulting product. \n. \n7. \n \nContext of assessment\n7.1\n7.2\nCompetency may be assessed in the workplace or in  \nsimulated workplace environment.\n",
