        "source_title": "MACHINE DIE COMPONENT",
        "source_text": "--- PDF PAGE 25 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n24\n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nMACHINE DIE COMPONENT \n \nUNIT CODE  \n \n: \nMEE722301 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills involved in   \n \n \n \n \nthe machining of die components  such as die blocks, die  \n \n \n \n \nplates and punches utilizing conventional  turning, milling and  \n \n \n \n \ngrinding but does not cover non-conventional machine such  \n \n \n \n \nas EDM and CNC machines \n \n \nELEMENTS \n \nPERFORMANCE CRITERIA \nItalicized Terms Are Elaborated in the Range Of Variables\n \n1.\n \nDetermine job \nrequirements \n1.1 \n \n1.2 \n \n1.3 \n \n1.4 \nDrawings analyzed and cleared with designer for correct \ninterpretation. \nJob instructions clearly understood from superior as to \nwhat part to machine, and what to job out.  \nMaterials to be used for each part with sufficient \nallowances listed.  \nSequence of machining operations for each part \ndetermined according to work procedures\n \n2.\n \n \n \n \n \nMachine die \ncomponents \n \n \n \n \n \n \n \n \n \n \n \n \n2.1 \n \n2.2 \n \n2.3 \n \n2.4 \n \n2.5 \n \n2.6 \n \n2.7 \n \n2.8 \nPlan sequence of operation for each part specifying \nequipment, tools, speeds and feeds requirement. \nDie plate parts initially milled to requited dimensions, \nparallelity and squareness \nHole locations and die block hole opening and punch \ncontours marked according the drawing. \nDie parts of cylindrical section  turned and finished  to \nrequired dimension  \nDie parts  of non-cylindrical sections milled to required \nshape according the drawing and specification. \nDie block openings milled to slightly undersize \ndimensions to allow for final finishing and fitting operation. \nDie parts are ground and finished according the \nspecifications. \nDie block, punch plate or pedestal punch drilled  with \nassembly holes according drawing specifications.\n \n3.\n \nMeasure and check \ndimension \n3.1.\n \n3.2 \n \nDimensions and quality are checked for compliance to \nspecifications. \nDetails and dimensional  errors are identified against \nspecification and reported to standard operation \nprocedure (SOP).\n\n--- PDF PAGE 26 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n25\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1 Drawings \n1.1\n1.2\n1.3\nProduct drawing\nAssembly drawing \nDetailed die part drawings \n2.\n \nJob instructions\n2.1\n2.2\n2.3\n \n \n \n \nWhich parts to machine\nWhich parts to job put \nWhat semi-finished materials to buy \n Die set \n Springs \n Stripper bolts \n Fasteners      \n    \n                \n          \n \n     \n3 \nMaterials \n3.1\n3.2\n3.3\n3.4\n3.5\nLow carbon steel\nMedium carbon steel \nLow alloy steel \nHigh alloy steel \nHeat treatment \n hardening \n tempering \n\nflame hardening\n4\nSequence of \noperations \n4.1\n \nLogical sequence of operation\n equipment \n cutting tools \n rpm \n\nfeeds\n5.\nDie parts of \ncylindrical \nsections \n5.1\n5.2\n5.3\n5.4\n5.5\n5.6\n5.7\nBlanking  punch\nPiercing punch \nGuide pins \nPilots \nBushings \nShanks \nGuide bush\n5.\nDie parts of non-\ncylindrical section \n5.1\n5.2\n5.3\n5.4\n5.5\n5.6\n5.7\n5.8\n5.9\nDie block\nPunch plate \nPedestal punch \nStripper plate \nBack guide \nBack gage \nFixed stripper \nSpring stripper \nDie sections\n6.\nMachining \nOperations \n \n6.1\n \n \n \nConventional machine tools\n          -turning \n          -milling \n          -grinding band sawing \n          -non-conventional machining  \n                 EDM; CNC   (knowledge only)\n\n--- PDF PAGE 27 ---\nTool and DieMaking NCII \n12/02/04                                                                                                                                                                                             \n \n \n26\n \nEVIDENCE GUIDE \n \n \n1.\n \nCritical aspects of \ncompetency \n \n1.1\n1.2\n1.3\n1.4\n1.5\nAssessment requires evidence that the candidates: \nDetermined the job requirements. \nIdentified all the parts of a die. \nPlanned all machining work to be done. \nMachined parts safely and according to procedures. \nDimensions of die parts checked with specifications.\n2.\nUnderpinning \nKnowledge \n2.1\n \n \n \n \n \n2.2\n \n \n \n \n \n \n \n2.3\nPresswork technology \n         -pressworking operations \n         -clearance applications \n         -center of pressure \n         - types of die \n         - parts of a die \nMachining \n        -cutting speed  & Rpm \n        -feed rate \n        -workholding devices \n        -cutting tools \n        -hardening \n        -polishing \n        - heat treatment \nMeasurement\n \n3.\n \nUnderpinning Skills \n3.1\n3.2\n3.3\n3.4\n3.5\n3.6\nSafe working practices \nLayout \nTurning of cylindrical parts \nMilling of non-cylindrical parts \nGrinding \nDrilling of holes\n \n4 \n. \n \n \nResource  \nImplication  \n \n4.1\n4.2\n4.3\n4.4\n4.5\n4.6\n4.7\nThe following resources must be provided \nLathe \nHorizontal milling machine with DRO attachment \nVertical milling machine with DRO \nTool and cutter grinder for grinding punches \nIndexing head \nSurface grinder \nMeasuring tools\n \n5.\n \nMethod of Assessment\n \n5.1\n5.2\n5.3\n5.4\nCompetency must be assessed by \nDirect observation of machining, \nWritten test \noral short answer questions \nDemonstration. \n \n6.\n \nContext for \nAssessment  \n \n \nCompetence may be assessed in the workplace or in \nsimulated  workplace environment.\n",
