  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\n This section gives the details of the contents of the basic, common and core units\nof competency required in TOOL AND DIEMAKING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Obtain and convey\nworkplace information\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills\nare used to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage\nof information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in workplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others\nare listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose\nand established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant work\nrelated documents\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTool and DieMaking NCII\n12/02/04\n\n4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n6. Protocol\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTool and DieMaking NCII\n12/02/04\n\n5\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nKnowledge\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning\nSkills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context for\nAssessment\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 7 ---\nTool and DieMaking NCII\n12/02/04\n\n6\n\nUNIT OF COMPETENCY:\nWORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR\n :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Describe team role and\nscope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and\nobjectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\nTool and DieMaking NCII\n12/02/04\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nTool and DieMaking NCII\n12/02/04\n\n8\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning\nSkills\n3.1.\nCommunicate appropriately, consistent with the culture\nof the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n 4.2. Materials relevant to the proposed activity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the\nwork activities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTool and DieMaking NCII\n12/02/04\n\n9\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are\nmaintained in the course of managing oneself based\non performance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n1.\nSet and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n2.\nMaintain professional\ngrowth and\ndevelopment\n3.1 Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2 Recognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\nTool and DieMaking NCII\n12/02/04\n\n10\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\nTool and DieMaking NCII\n12/02/04\n\n11\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra – and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning\nSkills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\nTool and DieMaking NCII\n12/02/04\n\n12\n\nUNIT OF COMPETENCY:\n PRACTICE\nOCCUPATIONAL\nHEALTH\nAND\nSAFETY PROCEDURES\nUNIT CODE\n:\n 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply\nwith regulatory and organizational requirements for\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify hazards and risks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to\nminimize or eliminate risk to co-workers,\nworkplace and environment in accordance with\norganization procedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate\nhazards\nand\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\n identified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 14 ---\nTool and DieMaking NCII\n12/02/04\n\n13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n3. Control hazards and risks\n3.1 Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace are consistently followed\n3.2 Procedures for dealing with workplace\naccidents, fire and emergencies are followed in\naccordance with organization OHS policies\n3.3 Personal protective equipment (PPE) is\ncorrectly used in accordance with organization\nOHS procedures and practices\n3.4 Appropriate assistance is provided in the event\nof a workplace emergency in accordance with\nestablished organization protocol\n\n4. Maintain OHS awareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and\nupdated in accordance with workplace\nrequirements\n\n--- PDF PAGE 15 ---\nTool and DieMaking NCII\n12/02/04\n\n14\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n\n2. Hazards/Risks\nMay include but are not limited to:\n2.10 Physical hazards – impact, illumination,\n pressure, noise, vibration, temperature,\n radiation\n2.2 Biological hazards- bacteria, viruses, plants,\n parasites, mites, molds, fungi, insects\n2.11 Chemical hazards – dusts, fibers, mists,\nfumes,\n smoke, gasses, vapors\n3. Hazards/Risks\nMay include but are not limited to:\n2.12 Physical hazards – impact, illumination,\n pressure, noise, vibration, temperature,\n radiation\n2.2 Biological hazards- bacteria, viruses, plants,\n parasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\n smoke, gasses, vapors\n2.13 Ergonomics\n• Psychological factors – over exertion/\nexcessive force, awkward/static positions,\nfatigue, direct pressure, varying metabolic\ncycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n\n--- PDF PAGE 16 ---\nTool and DieMaking NCII\n12/02/04\n\n15\n\nVARIABLE\nRANGE\n4. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n5. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n6. Emergency-related drills\nand training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n7. OHS personal records\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 17 ---\nTool and DieMaking NCII\n12/02/04\n\n16\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2.14 Underpinning\nKnowledge\n\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value –TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n2.15 Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n3. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n4. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n5. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTool and DieMaking NCII\n12/02/04\n\n17\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : PERFORM SHOP COMPUTATIONS\n\nUNIT CODE\n\n: MEE722204\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to perform basic\n\n calculations involving triangles and tapers.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform calculations\ninvolving triangles\n\n1.1\n\n1.2\nProblems involving right triangles performed using\ntrigonometric functions\n\nProblems involving non-right triangles performed\nusing sine law and cosine law\n2.\nCalculate tapers\n2.1\nTaper of work calculated correctly using\nappropriate formula.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Trigonometric functions\n1.1 Sine\n1.2 Cosine\n1.3 Tangent\n1.4 Cotangent\n1.5 Secant\n1.6 Cosecant\n\n--- PDF PAGE 19 ---\nTool and DieMaking NCII\n12/02/04\n\n18\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1 Involving right triangles\n1.2 Involving non-right triangles\n1.3 Involving tapers\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Property of right triangles\n2.2 Trigonometric functions\n2.3 Non-right triangles\n2.4 Sine law\n2.5 Cosine law\n3.\nUnderpinning\nskills\n3.1 Performing calculations using pen and paper or on a\ncalculator.\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\nactivity\n4.2 Materials relevant to the proposed activity\n4.3 Trigonometric table\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 20 ---\nTool and DieMaking NCII\n12/02/04\n\n19\n\nUNIT OF COMPETENCY : MEASURE WORKPIECE\n\nUNIT CODE\n\n: MEE722205\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to measure\n\n workpieces using angular measuring instruments\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use angular\nmeasuring tools\n\n1.1\n\n1.2\n\n1.3\nAngular measuring tools are selected according to\nthe the level of accuracy required.\n\nMeasurements taken are accurate to the finest\ngraduation of the selected measuring instrument.\n\nMeasuring technique used to correct and\nappropriate to the device used.\n2.\nMaintain angular\nmeasuring tools\n2.1\nMeasuring tools adjusted and maintained to the\nrequired accuracy utilizing manufacturer’s or\nworksite procedures.\n3\nClean and store\nmeasuring tools\n3.1\nCare and storage of devices undertaken yo\nmanufacturer’s specifications or standard operating\nprocedures\n.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Angular measuring\ntools\n\nMeasuring tools include\n\n1.1 Bevel protractor\n1.2 Gage blocks\n1.3 Sine bar\n\n2. Measurements\n\n2.1 angle\n2.2 taper\n\n--- PDF PAGE 21 ---\nTool and DieMaking NCII\n12/02/04\n\n20\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used angular measuring instruments\n1.2 Maintained / adjusted instruments\n1.3 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Types, purposes and accuracy of angular measuring\ninstruments\n2.2 Capability of measuring tools\n2.3 Techniques for measuring angles and tapers\n\n3.\nUnderpinning\nskills\n3.1 Safe handling of measuring tools\n3.2 Reading vernier scale\n3.3 Reading micrometer\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 22 ---\nTool and DieMaking NCII\n12/02/04\n\n21\n\nUNIT OF COMPETENCY :\nPERFORM PREVENTIVE AND CORRECTIVE\n\nMAINTENANCE\n\nUNIT CODE\n\n:\n MEE722207\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required in\nperforming preventive and corrective maintenance such\nas inspection and repair of hand tools, cleaning and\nlubrication of machine parts and changing drive pulley\nand belts.\n\n ELEMENTS\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\n\nPerform inspection of\nmachine\n\n1.1\n\n1.2\n\nMachine inspected according to worksite\nprocedures.\nStatus/Report recorded on proforma or reported\norally according to worksite procedure.\n2.\nPerform cleaning and\nlubricating of machine\n\n2.1\n\n2.2\n\nMachines lubricated as per manufacturer’s\nrecommendation using appropriate tools and\nmaterials\nFluids and lubricants replaced and/or topped up\naccording to prescribed schedule.\n3.\nPerform minor machine\nrepair and adjustments\n\n3.1\n\n3.2\n\nMinor machine repairs performed according to\nmanufacturer’s instruction or worksite procedures.\nMachine moving parts adjusted to manufacturer’s\nspecifications.\n4.\nMaintain hand tools\n4.1\n4.2\nTool cutting ground to recommended specifications\nHand tools lubricated and stored according to\nprescribed procedure\n.\n\n--- PDF PAGE 23 ---\nTool and DieMaking NCII\n12/02/04\n\n22\n\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1 V-belt\n1.2 Bearing\n1.3 Gears\n1.4 Clutch\n1.5 Drive pulley\n2. Machines\nMachine include but not limited to:\n2.1 Lathe machine\n2.2 Milling machine\n2.3 Grinding machine\n2.4 Mechanical press \u0001 achine\n3. Tools and materials\nTools and materials used include:\n3.1 Lubricants\n3.2 Oil can\n3.3 Grease gun\n3.4 Oil\n3.5 Coolant or compound\n\n--- PDF PAGE 24 ---\nTool and DieMaking NCII\n12/02/04\n\n23\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that that the candidate:\n1.1 performed inspection of machine\n1.2 performed cleaning and lubricating of machine\nperformed minor machine repairs and adjustments\n2. Underpinning knowledge\n2.1 Proper cleaning and oiling\n2.2 Kinds of oil\n2.3 Parts and function of machine tools\n2.4 Cutting oil, coolant or compound\n2.5 Pulleys and belts\n2.6 Location of main switches of the machine\n2.7 Handling and storage of tools\n2.8 Checklist of safe working conditions\n2.9 Procedures in cleaning and disposal of waste\nmaterials\n3. Underpinning skills\n3.1 Inspecting and repairing hand tools\n3.2 Inspecting and changing drive pulleys and belts\n3.3 Replacing and adjusting machine parts\n3.4 Distinguishing old and new coolant\n3.5 Distinguishing odor of polluted coolant\n3.6 Selecting coolant, cutting oil or compounds\n3.7 Changing coolant\n3.8 Inspecting work area for safe working environment\n3.9 Cleaning work area\n3.10 Disposing metal scraps, chips and waste materials.\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to\nprocesses or activity\n4.2 Materials relevant to the proposed activity\n5. Method of Assessment\nCompetency may be assessed through:\n5.1 direct observation of activities\n5.2 oral or written questioning\n6. Context for Assessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 25 ---\nTool and DieMaking NCII\n12/02/04\n\n24\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nMACHINE DIE COMPONENT\n\nUNIT CODE\n\n:\nMEE722301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills involved in\n\nthe machining of die components such as die blocks, die\n\nplates and punches utilizing conventional turning, milling and\n\ngrinding but does not cover non-conventional machine such\n\nas EDM and CNC machines\n\nELEMENTS\n\nPERFORMANCE CRITERIA\nItalicized Terms Are Elaborated in the Range Of Variables\n\n1.\n\nDetermine job\nrequirements\n1.1\n\n1.2\n\n1.3\n\n1.4\nDrawings analyzed and cleared with designer for correct\ninterpretation.\nJob instructions clearly understood from superior as to\nwhat part to machine, and what to job out.\nMaterials to be used for each part with sufficient\nallowances listed.\nSequence of machining operations for each part\ndetermined according to work procedures\n\n2.\n\nMachine die\ncomponents\n\n2.1\n\n2.2\n\n2.3\n\n2.4\n\n2.5\n\n2.6\n\n2.7\n\n2.8\nPlan sequence of operation for each part specifying\nequipment, tools, speeds and feeds requirement.\nDie plate parts initially milled to requited dimensions,\nparallelity and squareness\nHole locations and die block hole opening and punch\ncontours marked according the drawing.\nDie parts of cylindrical section turned and finished to\nrequired dimension\nDie parts of non-cylindrical sections milled to required\nshape according the drawing and specification.\nDie block openings milled to slightly undersize\ndimensions to allow for final finishing and fitting operation.\nDie parts are ground and finished according the\nspecifications.\nDie block, punch plate or pedestal punch drilled with\nassembly holes according drawing specifications.\n\n3.\n\nMeasure and check\ndimension\n3.1.\n\n3.2\n\nDimensions and quality are checked for compliance to\nspecifications.\nDetails and dimensional errors are identified against\nspecification and reported to standard operation\nprocedure (SOP).\n\n--- PDF PAGE 26 ---\nTool and DieMaking NCII\n12/02/04\n\n25\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1 Drawings\n1.1\n1.2\n1.3\nProduct drawing\nAssembly drawing\nDetailed die part drawings\n2.\n\nJob instructions\n2.1\n2.2\n2.3\n\nWhich parts to machine\nWhich parts to job put\nWhat semi-finished materials to buy\n• Die set\n• Springs\n• Stripper bolts\n• Fasteners\n\n3\nMaterials\n3.1\n3.2\n3.3\n3.4\n3.5\nLow carbon steel\nMedium carbon steel\nLow alloy steel\nHigh alloy steel\nHeat treatment\n• hardening\n• tempering\n•\nflame hardening\n4\nSequence of\noperations\n4.1\n\nLogical sequence of operation\n• equipment\n• cutting tools\n• rpm\n•\nfeeds\n5.\nDie parts of\ncylindrical\nsections\n5.1\n5.2\n5.3\n5.4\n5.5\n5.6\n5.7\nBlanking punch\nPiercing punch\nGuide pins\nPilots\nBushings\nShanks\nGuide bush\n5.\nDie parts of non-\ncylindrical section\n5.1\n5.2\n5.3\n5.4\n5.5\n5.6\n5.7\n5.8\n5.9\nDie block\nPunch plate\nPedestal punch\nStripper plate\nBack guide\nBack gage\nFixed stripper\nSpring stripper\nDie sections\n6.\nMachining\nOperations\n\n6.1\n\nConventional machine tools\n -turning\n -milling\n -grinding band sawing\n -non-conventional machining\n EDM; CNC (knowledge only)\n\n--- PDF PAGE 27 ---\nTool and DieMaking NCII\n12/02/04\n\n26\n\nEVIDENCE GUIDE\n\n1.\n\nCritical aspects of\ncompetency\n\n1.1\n1.2\n1.3\n1.4\n1.5\nAssessment requires evidence that the candidates:\nDetermined the job requirements.\nIdentified all the parts of a die.\nPlanned all machining work to be done.\nMachined parts safely and according to procedures.\nDimensions of die parts checked with specifications.\n2.\nUnderpinning\nKnowledge\n2.1\n\n2.2\n\n2.3\nPresswork technology\n -pressworking operations\n -clearance applications\n -center of pressure\n - types of die\n - parts of a die\nMachining\n -cutting speed & Rpm\n -feed rate\n -workholding devices\n -cutting tools\n -hardening\n -polishing\n - heat treatment\nMeasurement\n\n3.\n\nUnderpinning Skills\n3.1\n3.2\n3.3\n3.4\n3.5\n3.6\nSafe working practices\nLayout\nTurning of cylindrical parts\nMilling of non-cylindrical parts\nGrinding\nDrilling of holes\n\n4\n.\n\nResource\nImplication\n\n4.1\n4.2\n4.3\n4.4\n4.5\n4.6\n4.7\nThe following resources must be provided\nLathe\nHorizontal milling machine with DRO attachment\nVertical milling machine with DRO\nTool and cutter grinder for grinding punches\nIndexing head\nSurface grinder\nMeasuring tools\n\n5.\n\nMethod of Assessment\n\n5.1\n5.2\n5.3\n5.4\nCompetency must be assessed by\nDirect observation of machining,\nWritten test\noral short answer questions\nDemonstration.\n\n6.\n\nContext for\nAssessment\n\nCompetence may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 28 ---\nTool and DieMaking NCII\n12/02/04\n\n27\nUNIT OF COMPETENCY :\nFIT AND ASSEMBLE DIE\n\nUNIT CODE\n\n:\nMEE722302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills in the fitting\n\nand assembly of simple blanking and piercing dies and\n\nbending dies and limited to 2-station progressive dies utilizing\n\nblanking and piercing, chop off and parting principle.\n\nELEMENTS\n\nPERFORMANCE CRITERIA\nItalicized Terms Are Elaborated in the Range Of Variables\n\n1.\n\nDetermine die parts to\nbe fitted with one\nanother.\n1.1\n\n1.2\n\n1.3\n\nAssembly drawings interpreted to determine which part to\nbe fitted with another part.\nMachined parts are checked to determine additional\nfitting or finishing work.\nFitting tools and equipment are identified according to\nfitting requirements.\n2\nFit die parts\n2.1\n\n2.2\n2.3\nTemplate of product prepared as reference for finish\nfiling.\nDie holes are finish-filed to template size and required\nangle clearance\nStripper plate openings fitted with punches\n\n3.\n\nDrill assembly holes\n3.1\n\n3.2\n\n3.3\n\n3.4\nDie base assembled to bottom die holder according to\nwork procedure.\nPunch plate or punch pedestal drilled for mounting to\npunch holder according to work procedure\nStripper plate and punch plate and guide pin holes drilled\nand tapped according to work procedure.\nDrilling operations of screw holes done according work\nprocedure.\n4. Assemble die\n4.1\n\n4.2\n\n4.3\n\n4.4\n4.5\n4.6\n4.7\nDie base assembled to bottom die holder according to\nwork procedure.\nPunch plate and pedestal punch mounted to punch\nholder according to work procedure\nFixed stripper plate mounted to die block or spring\nstripper mounted on punch plate as per drawing\nOther parts assembled as required\nDie tested for alignment as per work procedure\nAdjustment made according to found errors\nDowel holes drilled according to work procedure\n\n--- PDF PAGE 29 ---\nTool and DieMaking NCII\n12/02/04\n\n28\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1\n\nFitting tools and\nequipment\n1.1\n\n1.2\n\nTools\n• set of files\n• vise with soft jaws\n• transfer screws\n• transfer punches\n• angle plate\n• vernier height gage\n• center punch\n• parallel clamps\n• set of twist drills\n• hand taps\n• counter bore\n• portable electric drill\n• parallel set\n• reamers\n• allen wrench\n• scribers\n• shims\n• dowels\n\nEquipment\n• filing machine\n• die lifter\n\n2.\n\nDrilling operations\n\n2.1\n2.2\n2.3\n2.4\n2.5\n\nDrilling with tap drill size\nDrilling with clearance holes\nCounterboring\nChamfering\nTapping\n\n--- PDF PAGE 30 ---\nTool and DieMaking NCII\n12/02/04\n\n29\nEVIDENCE GUIDE\n\n1.\n\nCritical aspects of\ncompetency\n\n1.1\n1.2\n\n1.3\nAssessment requires evidence that the candidate\nDie hole filed to a template and angle clearance\nAssembly holes drilled following the standard work\n procedure\nDie assembled according to the right sequence\n\n2.\n\nUnderpinning\nknowledge.\n2.1\n2.2\n2.3\n2.4\nPunch and die clearances and applications.\nTypes of file\n2-reference method of layout\nDetermining tap drill size\n\n3.\n\nUnderpinning skills.\n2.1\n2.2\n2.3\n2.4\n2.5\n2.6\n2.7\nLayout using Vernier height gauge.\nFiling of die hole using a template\nDrilling of holes on mating parts\nFiling radius of punch corners\nHole tapping.\nCounter boring of holes.\nUse of transfer screws and transfer punch\n\n5.\n\nResource implications\n\n5.1\n\n5.2\nThe following resources must be provided:\nLayout tools:\n -vernier height gauge\n -angle plate\n -center punch\n -machinist hammer\n -parallels\n -parallel clamps\n -transfer screws\n -required drills\n -required files\n -required hand taps\n -tap wrench\nAssembly tools\n -allen wrench\n -mallet\n\n6.\n\nMethod of assessment\n\n6.1\n\n6.2\n6.3\n6.4\nCompetency must be assessed through\nObservation of the candidate performing a range of\ntasks while performed in the workplace\nWritten test\nOral short answer questions\nInspection of assembled die and resulting product.\n.\n7.\n\nContext of assessment\n7.1\n7.2\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 31 ---\nTool and DieMaking NCII\n12/02/04\n\n30\n\nUNIT OF COMPETENCY :\nTEST AND TRY DIE\n\nUNIT CODE\n\n:\nMEE722 303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills involved in\nthe die setting and the press adjustment for the testing\nof dies and press run.\n\nELEMENTS\n\nPERFORMANCE CRITERIA\nItalicized Terms Are Elaborated in the Range Of\nVariables\n\n1.\n\nPrepare for testing of\ndies\n\n1.1\n\n1.2\n\nPress checked for suitability to die shut off height.\n\nMaterial strip or blank cut to required size or width\nand grain orientation.\n\n2.\n\nSet up press and die\n\n2.1\n\n2.2\n\n2.3\n\n2.4\n\nDie set on the bolster plate and punch shank\ninserted into ram hole and tightened.\n\nDie set clamped on the bolster plate using the right\ntightening sequence.\n\nPress ram adjusted to bottom dead center with the\npunch end to the required punch setting.\n\nPress operated manually to check position of punch.\n\n3.\n\nOperate press\n\n3.1\n\n3.2\n\n3.3\n\nPress started up safely and correctly.\n\nPress operated according to standard procedure.\n\nMaterial is loaded and the press is tripped for\nsample product.\n\n4.\n\nInspect product\n\n4.1\n\nSample inspected for dimensional errors and\ndeviations.\n\n5.\n\nRectify die\n\n5.1\n\nDie corrected according to deviations found and\nstandard procedures..\n\n--- PDF PAGE 32 ---\nTool and DieMaking NCII\n12/02/04\n\n31\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1.\n\nPress\n\n1.1\n\n1.2\n\n1.3\n\n1.4\n\nTypes of Press\n\nCapacity\n\nPress shut height\n\nParts of a Press and their Functions\n\n2.\n\nPress Work Materials\n\n2.1\n\n2.2\n\n2.3\n\n2.4\n\n2.5\n\n2.6\n\nLow carbon steel\n\nSilicon steel\n\nBrass\n\nCopper\n\nBlank\n• Strip material\n• Single blank material\n• Coiled material\n\nGrain orientation\n\n3.\n\nDie\n\n3.1\n\nDie shut height\n\n--- PDF PAGE 33 ---\nTool and DieMaking NCII\n12/02/04\n\n32\nEVIDENCE GUIDE\n\n1.\n\nCritical aspects of\ncompetence\n\n1.1\n1.2\n1.3\n1.4\n1.5\n1.6\nAssessment requires evidence that the candidate\nSelected the right press for use in testing.\nPrepared the blank materials required\nSet the die to the according to procedures\nOperated the press safely as per SOP\nInspected the sample produced\nRectified the die to correct deviation if needed\n\n2.\n\nUnderpinning\nknowledge\n2.1\n2.2\n2.3\n2.4\n2.5\n2.6\nPress principle of operation\nSafety operation of the press\nCommon faults in pressed materials\nSafe operating of a press.\nPlate strip shearing\nSingle blank shearing\n\n3.\n\nUnderpinning skills\n\n3.1\n3.2\n3.3\n3.4\nRam adjustment\nBolt tightening sequence\nUse of wrenches and spanners\nUse of measuring tools\n\n4.\n\nResource implication\n\n4.1\n4.2\n4.3\n4.4\n4.5\nThe following resources should be provided\nPress\nDie\nBlank material\nProduct drawing\nMeasuring tools\n\n5.\n\nMethod of\nassessment\n\n5.1\n5.2\nThe following assessment method are suggested\nDirect observation\nWritten or oral question demonstration\n\n6.\n\nContext of assessment\n6.1\nCompetency may be assessed in the workplace or in\nworkplace Simulated environment\n\n--- PDF PAGE 34 ---\nTool and DieMaking NCII\n12/02/04\n\n33"
