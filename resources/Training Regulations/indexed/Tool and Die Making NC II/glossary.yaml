      "term": "Die set",
      "definition": "A set of lower and upper plate where the die assembly is set. The upper plate called the punch holder has bushings pressed into it that slides on guide posts pressed unto the lower plate called the die holder to maintain proper alignment of the members of the die"
    },
    {
      "term": "Blanking punch",
      "definition": "Is the part of the die that cuts or remove the blank from the strip."
    },
    {
      "term": "Piercing punch",
      "definition": "Also called perforator, pierces holes through the blank. They are usually round and usually provided with a shoulder to retain them on a punch plate."
