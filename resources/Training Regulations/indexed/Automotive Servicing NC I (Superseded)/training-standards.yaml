    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC I\n\nNominal Training Duration:\n28 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n88 Hours (Core Competencies)\n\n156 Hours\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry\nstandards. It covers core competencies such as; performance of basic engine\nservicing through removal and reinstallation of components for gas and diesel\nengines.\n\nThis course is also designed to enhance the basic and common\nknowledge, skills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n\n1.1\nExplain routinary\nspeaking & messages in a\nworkplace\n1.2\nFollow routinary\nspeaking & message\n1.3\nPerform work duties\nfollowing written notices\nGroup discussion\nInteraction\n\n•Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1\nDevelop effective\nworkplace relationship\n2.2 Contribute to work group\nactivities\nGroup discussion\nInteraction\n\n•Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of\nconduct in the workplace\nGroup discussion\nInteraction\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\nunnecessary items\n4.2 Arrange items\n4.3 Maintain work areas, tools\nand equipment\n4.4 Follow standardize work\nprocess and procedures\n4.5 Perform work\nspontaneously\nGroup discussion\nInteraction\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--