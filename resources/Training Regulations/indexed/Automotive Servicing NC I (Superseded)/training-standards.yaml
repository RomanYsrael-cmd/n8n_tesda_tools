ervation\n• Interview\n3.Remove and\nreplace\nelectrical/electro\nnics\nunit/assemblies\n3.1 Prepare for work\n3.2 Remove electrical / electronic\nunits / assemblies\n3.3 Replace electrical / electronic\nunits / assemblies\n3.4 Clean up work area and\nmaintain equipment\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n4.Remove and\ntag engine\nsystem\ncomponents\n4.1 Prepare to remove and tag\nengine system components\n4.2 Remove engine system\ncomponents\n4.3 Tag engine system components\n\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n5.Remove and\ntag steering,\nsuspension and\nbrake system\ncomponents\n5.1 Prepare to remove and tag\nsteering, suspension and brake\nsystem components\n5.2 Remove steering, suspension\nand brake system components\n5.3 Tag steering, suspension and\nbrake system components\n\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n6.Remove and\ntag transmission\nsystem\ncomponents\n6.1 Prepare to remove and tag\ntransmission components\n6.2 Remove transmission system\ncomponents\n6.3 Tag transmission components\n\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 82 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n80",
