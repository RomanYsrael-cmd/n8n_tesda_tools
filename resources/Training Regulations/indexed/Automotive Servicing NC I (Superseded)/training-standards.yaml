    "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Automotive Servicing NC I.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC I\n\nNominal Training Duration:\n28 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n88 Hours (Core Competencies)\n\n156 Hours\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry\nstandards. It covers core competencies such as; performance of basic engine\nservicing through removal and reinstallation of components for gas and diesel\nengines.\n\nThis course is also designed to enhance the basic and common\nknowledge, skills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n\n1.1\nExplain routinary\nspeaking & messages in a\nworkplace\n1.2\nFollow routinary\nspeaking & message\n1.3\nPerform work duties\nfollowing written notices\nGroup discussion\nInteraction\n\n•Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1\nDevelop effective\nworkplace relationship\n2.2 Contribute to work group\nactivities\nGroup discussion\nInteraction\n\n•Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of\nconduct in the workplace\nGroup discussion\nInteraction\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\nunnecessary items\n4.2 Arrange items\n4.3 Maintain work areas, tools\nand equipment\n4.4 Follow standardize work\nprocess and procedures\n4.5 Perform work\nspontaneously\nGroup discussion\nInteraction\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 79 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n77\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nAppropriate\nSealant/\nAdhesive\n1.1. Identify appropriate sealant/\nadhesive\n1.2. Prepare surface for sealant/\nadhesive application\n1.3. Store unused and dispose\nused sealant/adhesive\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n2. Move and\nPosition\nVehicle\n2.1. Prepare vehicle for driving\n2.2. Move and position vehicle\n2.3. Check the vehicle\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n3. Perform\nMensuration\nand\nCalculation\n3.1. Select measuring instrument\nand carry out measurement\nand calculations.\n3.2. Maintain measuring\ninstruments\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n4. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed manuals\nand interpret data and\nspecification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n5. Use and Apply\nLubricants/\nCoolants\n5.1. Identify type of\nlubricants/coolants\n5.2 Use and apply lubricants\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n6. Perform Shop\nMaintenance\n\n6.1 Inspect/clean tools and work\narea\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose wastes/used lubricants\n6.4 Report damaged\ntools/equipment\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 80 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n78\n\n7.Prepare job\nestimates\n7.1 Identify nature/scope of work\n7.2 Prepare and present estimates\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n8. Interpret/Draw\ntechnical\ndrawing\n8.1 Interpret technical drawing\n8.2 Select correct technical drawing\n8.3 Apply freehand sketching\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n9.Practice health,\nsafety and\nenvironment\nprocedures\n9.1 Apply basic safety procedures\n9.2 Apply emergency procedures\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n10.Inspect\ntechnical quality\nof work\n10.1\nGather information to carry\n out inspection\n10.2\nInspect and apply quality\n standards to work\n10.3\nAchieve quality work\n outcomes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n11.Maintain quality\nsystems\n11.1\nConduct final quality check\non completed work/ orders\n11.2\nReport on the quality of\n processes and work\n outcomes\n11.3\nImplement improvements to\n work processes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n12.Provide work\nskill instructions\n12.1\nOrganize instruction and\n demonstration\n12.2\nConduct instruction and\n demonstration\n12.3\nCheck training performance\n12.4\nReview personal training\n performance and finalize\n documentation\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n13.Identify and\nselect original\nautomotive parts\nand products\n13.1\nIdentify the part/ product\nand its end use\n13.2\nIdentify details of the part/\n product\n13.3\npart/ product is supplied or\n ordered for customer\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 81 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n79\nCORE COMPETENCIES\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform diesel\nengine tune -\nup\n1.1 Measure/Adjust valve tappet\nclearance\n1.2 Test fuel injector and glow\n plug\n1.1 Check/Replace fuel and air filter\n1.2 Check /Adjust injection timing\n1.3 Check and adjust injection\npump setting\n1.4 Perform diesel fuel injection\nbleeding\n1.5 Perform compression testing\n\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n2. Perform Gas\nEngine Tune\nUp\n2.1 Measure/Adjust valve tappet\nclearance\n2.2 Test spark plug\n2.3 Check/Replace fuel and air filter\n2.4 Test and replace ignition\nbreaker\n2.5 Check and adjust distributor\nsetting\n2.6 Set fuel mixture and idle rpm\n2.7 Perform compression testing\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n3.Remove and\nreplace\nelectrical/electro\nnics\nunit/assemblies\n3.1 Prepare for work\n3.2 Remove electrical / electronic\nunits / assemblies\n3.3 Replace electrical / electronic\nunits / assemblies\n3.4 Clean up work area and\nmaintain equipment\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n4.Remove and\ntag engine\nsystem\ncomponents\n4.1 Prepare to remove and tag\nengine system components\n4.2 Remove engine system\ncomponents\n4.3 Tag engine system components\n\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n5.Remove and\ntag steering,\nsuspension and\nbrake system\ncomponents\n5.1 Prepare to remove and tag\nsteering, suspension and brake\nsystem components\n5.2 Remove steering, suspension\nand brake system components\n5.3 Tag steering, suspension and\nbrake system components\n\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n6.Remove and\ntag transmission\nsystem\ncomponents\n6.1 Prepare to remove and tag\ntransmission components\n6.2 Remove transmission system\ncomponents\n6.3 Tag transmission components\n\n• Demonstration\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 82 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n80\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and\nthe curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 83 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n81\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both oral and written; and\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may\nbe required of the trainees by the school or training center delivering the\nTVET program.\n3.4\nTOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE SERVICING – NC\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for Automotive Servicing – NC I\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\nBox wrench of 28 pcs,\n4mm-32mm\n2 units\nMotor Vehicle\n20 ltrs.\nEngine oil\n2 sets\nOpen end wrench of\n28 pcs, 4mm-32mm\n2 units\nEngine\n10 kg\nGrease\n2 sets\nSocket wrench\n2 units\nHydraulic jack/lift\n10 tube Sealant /adhesive\n2 pcs\nPliers\n2 units\nIgnition timing light for\ndiesel engine\n20 ltrs.\nHydraulic oils/gear oil\n6 pcs\nScrew driver, one of\neach kind\n2 units\nIgnition timing light for\ngasoline engine\n20 ltrs.\nAutomatic\ntransmission fluid\n4 sets\nWire strippers\n4 units\nTachometer\n10 pcs. Wheel wedges\n4 pcs\nMechanic’s hammer\n4 units\nDifferential and front\naxle\n10 pcs. Test lamp\n25 pcs. Apron\n4 units\nMultimeter\n2 sets\nOverhauling gasket\n(per engine model)\n2 pcs\nImpact wrench\n4 units\nDiesel fuel injector\nassembly\n25 pcs. Goggles\n4 units\nSoldering gun/iron\n25 pcs.\nGloves\n2 sets\nCarburetor tool set, 8\npcs\n\n2 units\nOil pressure tester\n\nI unit\nInjection nozzle tester\n\n4 sets\nTorque wrench\n\n4 sets\nFeeler gauge\n\n4 units\nCell tester\n\n4 sets\nHydrometer\n\n2 units\nDial gauge\n2 sets\nBore gauge\n4 sets\nCaliper, 25mm to\n100mm\n\n--- PDF PAGE 84 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n82\n3.5\n TRAINING FACILITIES\nAUTOMOTIVE SERVICING – NC I\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies.\nThe class size of 25 students/trainees is reserved for the lecture room and the\npractical demonstration area for carrying out servicing of minor automotive\nparts. Most of the learning activities such as on-vehicle servicing are performed\nin the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN SQ.\nMETERS\nWorkshop/Laboratory area\n\n6 per student\n150\nLecture Room\n\n28.00\n28.00\nLearning Resource Center\n\n20.00\n20.00\nWash/Comfort room\n\n10\n10\nStorage/Tool room\n\n20\n20\nCirculation Area\n\n60\nTotal Area\n\n288\n\n3.6\n TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainers Certificate (NTTC) Level 1 in\nAutomotive Servicing NC I\n• Must be computer literate\n• *Must have at least 2 years job/industry experience\n\n3.7\n INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 85 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n83"
