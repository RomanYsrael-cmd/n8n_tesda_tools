\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose wastes/used lubricants\n6.4 Report damaged\ntools/equipment\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 80 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n78\n\n7.Prepare job\nestimates\n7.1 Identify nature/scope of work\n7.2 Prepare and present estimates\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n8. Interpret/Draw\ntechnical\ndrawing\n8.1 Interpret technical drawing\n8.2 Select correct technical drawing\n8.3 Apply freehand sketching\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n9.Practice health,\nsafety and\nenvironment\nprocedures\n9.1 Apply basic safety procedures\n9.2 Apply emergency procedures\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n10.Inspect\ntechnical quality\nof work\n10.1\nGather information to carry\n out inspection\n10.2\nInspect and apply quality\n standards to work\n10.3\nAchieve quality work\n outcomes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n11.Maintain quality\nsystems\n11.1\nConduct final quality check\non completed work/ orders\n11.2\nReport on the quality of\n processes and work\n outcomes\n11.3\nImplement improvements to\n work processes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDist