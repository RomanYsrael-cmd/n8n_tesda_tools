  "source_section_text": "SECTION 3. TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Automotive Servicing NC I.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC I\n\nNominal Training Duration:\n28 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n88 Hours (Core Competencies)\n\n156 Hours\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry\nstandards. It covers core competencies such as; performance of basic engine\nservicing through removal and reinstallation of components for gas and diesel\nengines.\n\nThis course is also designed to enhance the basic and common\nknowledge, skills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n\n1.1\nExplain routinary\nspeaking & messages in a\nworkplace\n1.2\nFollow routinary\nspeaking & message\n1.3\nPerform work duties\nfollowing written notices\nGroup discussion\nInteraction\n\n•Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1\nDevelop effective\nworkplace relationship\n2.2 Contribute to work group\nactivities\nGroup discussion\nInteraction\n\n•Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of\nconduct in the workplace\nGroup discussion\nInteraction\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\nunnecessary items\n4.2 Arrange items\n4.3 Maintain work areas, tools\nand equipment\n4.4 Follow standardize work\nprocess and procedures\n4.5 Perform work\nspontaneously\nGroup discussion\nInteraction\n\n•Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 79 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n77\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nAppropriate\nSealant/\nAdhesive\n1.1. Identify appropriate sealant/\nadhesive\n1.2. Prepare surface for sealant/\nadhesive application\n1.3. Store unused and dispose\nused sealant/adhesive\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n2. Move and\nPosition\nVehicle\n2.1. Prepare vehicle for driving\n2.2. Move and position vehicle\n2.3. Check the vehicle\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n3. Perform\nMensuration\nand\nCalculation\n3.1. Select measuring instrument\nand carry out measurement\nand calculations.\n3.2. Maintain measuring\ninstruments\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n4. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed manuals\nand interpret data and\nspecification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n5. Use and Apply\nLubricants/\nCoolants\n5.1. Identify type of\nlubricants/coolants\n5.2 Use and apply lubricants\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n6. Perform Shop\nMaintenance\n\n6.1 Inspect/clean tools and work\narea\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose wastes/used lubricants\n6.4 Report damaged\ntools/equipment\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced\n(modular)\n•\nDistance\nLearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 80 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n78\n\n7.Prepare job\nestimates\n7.1 Identify nature/scope of work\n7.2 Prepare and present estimates\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n8. Interpret/Draw\ntechnical\ndrawing\n8.1 Interpret technical drawing\n8.2 Select correct technical drawing\n8.3 Apply freehand sketching\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n9.Practice health,\nsafety and\nenvironment\nprocedures\n9.1 Apply basic safety procedures\n9.2 Apply emergency procedures\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n10.Inspect\ntechnical quality\nof work\n10.1\nGather information to carry\n out inspection\n10.2\nInspect and apply quality\n standards to work\n10.3\nAchieve quality work\n outcomes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n11.Maintain qua