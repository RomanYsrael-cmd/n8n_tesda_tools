ory Liner (Former Service Manager, Toyota) Technical Services Manager, Nissan The PARTICIPANTS in the Validation of these Training Regulations Technical Service Manager Nissan Motor Phils. Manager Honda Phils. Owner Poctoy Motor Repair Shop Fleet Maintenance Supvr. Marycheck Trading • THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT • THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT • Qualifications and Standards Office (QSO) • Zoilo C.Galang - • Florante P. Inoturan - • Abel B. Elpedes - • Howard Mark N. Plete -"
