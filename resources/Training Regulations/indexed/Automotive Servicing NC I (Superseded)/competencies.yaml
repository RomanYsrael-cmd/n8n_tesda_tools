              "source_text": "Assessment requires evidence that the candidate: 1.1 Communicated effectively with others involved in or affected by the work 1.2 Identified quality system procedures and needs 1.3 Identified performance indicators 1.4 Conducted final quality checks on completed work orders 1.5 Reported on the quality of processes and work outcomes 1.6 Monitored and adjusted performance indicators to meet changing circumstances 1.7 Processed and implemented recommendations for change 2. Required Knowledge Competency includes sufficient knowledge to: Knowledge of: • quality systems and application techniques in a work environment • typical loss and damage control systems • work planning and organization processes • occupational health and safety (OHS) regulations/requirements, equipment, material and personal safety requirements at the worksite • enterprise quality systems and procedures • worksite information management systems 3. Required skills Required skills include the ability to: 3.1 Research and interpretive skills to locate, interpret and apply quality audit policies and procedures 3.2 Investigative and analytical skills required for identification and analysis of quality breaches, incidents or risks, and identification of quality related training needs 3.3 English literacy and communication skills in relation to dealing with customers and team members on worksite quality audit issues 3.4 Questioning and active listening skills 3.5 Written communication skills sufficient to prepare reports, document investigations and maintain worksite quality documents 3.6 Plan and organize activities for leadership skills required in organizing, implementing and promoting worksite quality systems and measures --- PDF PAGE 46 --- Automotive Servicing NC I (Amended) Promulgated December 2013 44 3.7 Work with others and in a team by seeking advice and assistance from team members 3.8 Use mathematical ideas and techniques to document quantities and company sampling procedures 3.9 Establish diagnostic processes which analyze problems and recommend solutions 3.10 Use the workplace technology related to document and analyze quality problems"
