        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nDemonstrated knowledge of organizational\nprocedures for handling verbal and written\ncommunications\n1.2.\nReceived and acted on verbal messages and\ninstructions\n1.3.\nDemonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nKnowledge and\nattitude\n2.1.\nKnowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2.\nEthical work practices in handling\ncommunications\n2.3.\nCommunication process\n3. Underpinning\nskills\n3.1.\nConciseness in receiving and clarifying\nmessages/information/communication\n3.2.\nAccuracy in recording messages/information\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nPens\n4.2.\nNote pads\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nDirect Observation\n5.2.\nOral interview\n5.3.\nWritten Evaluation\n5.4.\nThird Party Report\n\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 7 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n5\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:"
        },
        "source_text": "500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to receive, respond and act on verbal and\nwritten communication.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Follow routine spoken\nmessages\n1.1.\nRequired information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2.\nInstructions/information are properly\nrecorded\n1.3.\nInstructions are acted upon immediately in\naccordance with information received\n1.4.\nClarification is sought from workplace\nsupervisor on all occasions when any\ninstruction/information is not clear\n2. Perform workplace\nduties following written\nnotices\n2.1\n Written notices and instructions are read\nand interpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in\nsequence\n2.3 Feedback is given to workplace supervisor\nbased on the instructions/information\nreceived\n\n--- PDF PAGE 5 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n2. Organizational Guidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 6 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n4\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nDemonstrated knowledge of organizational\nprocedures for handling verbal and written\ncommunications\n1.2.\nReceived and acted on verbal messages and\ninstructions\n1.3.\nDemonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nKnowledge and\nattitude\n2.1.\nKnowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2.\nEthical work practices in handling\ncommunications\n2.3.\nCommunication process\n3. Underpinning\nskills\n3.1.\nConciseness in receiving and clarifying\nmessages/information/communication\n3.2.\nAccuracy in recording messages/information\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nPens\n4.2.\nNote pads\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nDirect Observation\n5.2.\nOral interview\n5.3.\nWritten Evaluation\n5.4.\nThird Party Report\n\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 7 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n5\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:"
      },
