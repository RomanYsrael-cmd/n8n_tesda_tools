              "source_text": "Assessment requires evidence that the candidate: 1.1 Elicited sufficient information from the customer and/or other sources to enable a confirmed identification of vehicle or unit the part/product intended 1.2 Accessed the parts/products catalogue systems associated with required vehicle/unit 1.3 Used both manual and computer-based parts/products catalogues and equivalent documentation to trace and identify common specific brand parts/products 1.4 Communicated effectively with others involved in or affected by the work. 2. Required Knowledge Competency includes sufficient knowledge to: 2.1 Structural of computer workstations 2.2 Common automotive terminology 2.3 Main automotive systems and assemblies and their functions 2.4 Parts/product catalogue systems, both brand-specific and general options 2.5 Legal issues associated with the supply and use of non-conforming parts/components/accessories 2.6 Company quality system 2.7 Work organization and planning processes 3. Required skills Required skills include the ability to: 3.1 Apply research and interpretive skills sufficient to locate, interpret and apply manufacturer/component supplier procedures, workplace policies and procedures 3.2 Apply analytical skills required for identification and analysis of technical information 3.3 Apply plain English literacy and communication skills in relation to dealing with customer and team members 3.4 Apply questioning and active listening skills 3.5 Apply oral communication skills sufficient to convey information and concepts to customers 3.6 Apply planning and organizing skills to own work activities, including making good use of time and resources, sorting out priorities and monitoring own performance 3.7 Use mathematical ideas and techniques to correctly calculate material requirements, estimate and calculate costs and establish quality checks 3.8 Use workplace technology related to customer services, including use of measuring equipment, computerized technology, use of communication devices and reporting/ documenting of results --- PDF PAGE 55 --- Automotive Servicing NC I (Amended) Promulgated December 2013 53"
