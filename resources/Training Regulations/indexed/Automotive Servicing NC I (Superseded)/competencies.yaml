              "source_text": "1.1 Carried out a minimum of three training sessions, involving demonstrating and instructing particular work skills for different groups; with each session addressing: 1.1.1 Different learning objectives 1.1.2 A range of techniques and effective communication skills appropriate to the audience 2.Required Knowledge 2.1 Learner characteristics and needs 2.2 Content and requirements of the relevant learning program and/or delivery plan 2.3 Sources and availability of relevant learning resources and learning materials 2.4 Content of learning resources and learning materials 2.5 Training techniques that enhance learning and when to use them 2.6 Introductory knowledge of learning principles and learning styles 2.7 Key OHS issues in the learning environment, including: • roles and responsibilities of key personnel • responsibilities of learners • relevant policies and procedures, including hazard identification, risk assessment, reporting requirements, safe use of equipment and emergency procedures • risk controls for the specific learning environment 3. Required skills 3.1 Non-verbal communication techniques, such as: • asking relevant and appropriate questions • providing explanations • demonstrating • using listening skills • providing information clearly 3.2 Safety skills to implement OHS requirements, by acting and responding safely in order to: • identify hazards • conduct prestart-up checks if required • observe and interpret learner behaviour that may put people at risk 3.3 Time-management, skills to: • ensure all learning objectives are covered • pace learning 3.4 Reflection skills in order to: • identify areas for improvement • maintain personal skill development 3.5 Literacy skills to: • complete and maintain documentation • read and follow learning programs and plans • read and analyze learner information --- PDF PAGE 51 --- Automotive Servicing NC I (Amended) Promulgated December 2013 49 3.6 Technology skills to operate audio-vis