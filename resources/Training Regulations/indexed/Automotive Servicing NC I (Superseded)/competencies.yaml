. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 52 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n50\nUNIT OF COMPETENCY: IDENTIFY AND SELECT ORIGINAL AUTOMOTIVE\nPARTS AND PRODUCTS\nUNIT CODE :"
