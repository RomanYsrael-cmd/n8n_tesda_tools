  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in AUTOMOTIVE SERVICING NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE : 500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to receive, respond and act on verbal and\nwritten communication.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Follow routine spoken\nmessages\n1.1.\nRequired information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2.\nInstructions/information are properly\nrecorded\n1.3.\nInstructions are acted upon immediately in\naccordance with information received\n1.4.\nClarification is sought from workplace\nsupervisor on all occasions when any\ninstruction/information is not clear\n2. Perform workplace\nduties following written\nnotices\n2.1\n Written notices and instructions are read\nand interpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in\nsequence\n2.3 Feedback is given to workplace supervisor\nbased on the instructions/information\nreceived\n\n--- PDF PAGE 5 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n2. Organizational Guidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 6 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n4\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nDemonstrated knowledge of organizational\nprocedures for handling verbal and written\ncommunications\n1.2.\nReceived and acted on verbal messages and\ninstructions\n1.3.\nDemonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nKnowledge and\nattitude\n2.1.\nKnowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2.\nEthical work practices in handling\ncommunications\n2.3.\nCommunication process\n3. Underpinning\nskills\n3.1.\nConciseness in receiving and clarifying\nmessages/information/communication\n3.2.\nAccuracy in recording messages/information\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nPens\n4.2.\nNote pads\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nDirect Observation\n5.2.\nOral interview\n5.3.\nWritten Evaluation\n5.4.\nThird Party Report\n\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 7 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n5\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to develop workplace relationship and\ncontribute in workplace activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a\npositive manner to promote cooperation and good\nrelationship\n1.2 Assistance is sought from workgroup when\ndifficulties arise and addressed through\ndiscussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to\nensure workgroup goals are met\n2.2 Constructive contributions to workgroup goals and\ntasks are made according to organizational\nrequirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 8 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n6\nRANGE OF VARIABLES\n\n VARIABLE\n RANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements\nincluding OHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and\ncolleagues and clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring\nservice delivery\n4. Providing support to\nteam members\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes\nand standards\n\n--- PDF PAGE 9 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n7\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals\nare met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own\npersonal work competencies to enhance team goals\nand outcomes\n2. Underpinning\nKnowledge and\nattitude\n2.1.\nThe relevant legislation that affects operations,\nespecially with regards to safety\n2.2.\nReasons why cooperation and good relationships are\nimportant\n2.3.\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4.\nUnderstanding how to elicit and interpret feedback\n2.5.\nKnowledge of workgroup member’s responsibilities\nand duties\n2.6.\nImportance of demonstrating respect and empathy in\ndealings with colleagues\n2.7.\nUnderstanding of how to identify and prioritize\npersonal development opportunities and options\n3. Underpinning skills\n3.1.\nAbility to read and understand the organization’s\npolicies and work procedures\n3.2.\nWrite simple instructions for particular routine tasks\n3.3.\nInterpret information gained from correspondence\n3.4.\nCommunication skills to request advice, receive\nfeedback and work with a team\n3.5.\nPlanning skills to organized work priorities and\narrangement\n3.6.\nTechnology skills including the ability to select and\nuse technology appropriate to a task\n3.7.\nAbility to relate to people from a range of social,\ncultural and ethnic backgrounds.\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2.\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3.\nCase studies and scenarios as a basis for discussion\nof issues and strategies\n6. Context of\nassessment\n6.1.\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n8\n\nUNIT OF COMPETENCY: DEMONSTRATE WORK VALUES\nUNIT CODE\n 500311103\n\nUNIT DESCRIPTOR :\n This unit covers the knowledge, skills, and attitude in\n demonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Define the purpose\nof work\n\n1.1 One’s unique sense of purpose for working and the\nwhy’s of work are identified, reflected on and\nclearly defined for one’s development as a person\nand as a member of society.\n1.2 Personal mission is in harmony with company’s\nvalues\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent\ncompany ethical standards, policies and guidelines.\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational\npolicy and guidelines\n2.3 Personal behavior and relationships with co-\nworkers and/or clients are conducted in\naccordance with ethical standards, policy and\nguidelines.\n2.4 Company resources are used in accordance with\ntransparent company ethical standard, policies\nand guidelines.\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy\nand guidelines on the prevention and reporting of\nunethical conduct are accessed and applied in\naccordance with transparent company ethical\nstandard, policies and guidelines.\n3.2 Work incidents/situations are reported and/or\nresolved in accordance with company\nprotocol/guidelines.\n3.3 Resolution and/or referral of ethical problems\nidentified are used as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are\ndemonstrated consistently with acceptable ethical\nconduct and company’s core values.\n4.2 Instructions to co-workers are provided based on\nethical, lawful and reasonable directives.\n4.3 Company values/practices are shared with co-\nworkers using appropriate behavior and language.\n\n--- PDF PAGE 11 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work values/ethics/\nconcepts\nMay include but are not limited to:\n1.1 Commitment/ Dedication\n1.2 Sense of urgency\n1.3 Sense of purpose\n1.4 Love for work\n1.5 High motivation\n1.6 Orderliness\n1.7 Reliability\n1.8 Competence\n1.9 Dependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n4. Company resources\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n5. Instructions\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 12 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3 Demonstrated work practices satisfactorily and\nconsistently in compliance with industry work ethical\nstandards, organizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships\nwith co-workers and/or clients consistent with ethical\nstandards, policy and guidelines\n1.5 Used company resources in accordance with\ncompany ethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational\npolicy and guidelines on the prevention and reporting\nof unethical conduct/behavior\n2. Underpinning\nKnowledge and\nattitude\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental\nrights\nat\nwork\nincluding\ngender\nsensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n3. Underpinning\nskills\n3.1 Interpersonal skills\n3.2 Communication skills\n3.3 Self awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Third Party Reports\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 13 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n11\nUNIT OF COMPETENCY: PRACTICE HOUSEKEEPING PROCEDURES\n\n UNIT CODE : 500311104\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Sort and remove\nunnecessary items\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and\ndisposed of in accordance with company or\noffice procedures\n2. Arrange items\n2.1 Items are arranged in accordance with\ncompany/office housekeeping procedures\n2.2 Work area is arranged according to job\nrequirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible\nidentification marks based on procedure\n2.5 Safety equipment and evacuation passages\nare kept clear and accessible based on\ninstructions\n3. Maintain work area, tools\nand equipment\n3.1 Cleanliness and orderliness of work area is\nmaintained in accordance with company/office\nprocedures\n3.2 Tools and equipment are cleaned in\naccordance with manufacturer’s\ninstructions/manual\n3.3 Minor repairs are performed on tools and\nequipment in accordance with manufacturer’s\ninstruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized work\nprocess and procedures\n4.1 Materials for common use are maintained in\ndesignated area based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed\nand complied with\n5.3 Work is performed in accordance with\noccupational health and safety (OHS)\nrequirements\n\n--- PDF PAGE 14 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\n related to work activity\n1.4 Waste materials\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n3. Decorum\n\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 15 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Practiced the basic procedures of 5S\n\n2. Underpinning\nKnowledge and\nattitude\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning\nskills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary for\nthe activity\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Third party report\n5.2 Interview\n5.3 Demonstration with questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE: ALT723201\n\nUNIT DESCRIPTOR: This competency unit covers the knowledge, skills and attitude\nrequired in the selection and application of sealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1Sealant/adhesive are selected in line with job\nrequirements and manufacturer’s specification\n1.1 Sealant/adhesive checking is performed to ensure that\nthe product is fit for use.\n2. Prepare surface for\nSealant/adhesive\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nsealant/adhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in line\n with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n3.3Tools and equipment used to apply sealant/adhesive\nare appropriate to job requirements\n3.1 Safety are observed and PPE are worn in accordance\nwith industry SOP\n3.2 Hazards associated with the use of sealant and\nadhesives are identified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed\nprocedure\n4.2 Waste are disposed as per workshop standard\noperating procedures\n\n--- PDF PAGE 17 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nMay include:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n2. Tools and equipment\nMay include:\n2.1 Putty knife\n2.2 Scraper\n2.3 Compressor\n2.4 Steel brush\n2.5 Paint brush\n2.6 Rubber hammer\n2.7 Hand tools\nPersonal protective equipment include:\n2.8 Gloves\n2.9 Apron\n2.10 Safety shoes\n2.11Goggles\n2.12Gas mask\n3. Safety\nMay include:\n3.1 Ventilation\n3.2 Handling of Flammable/Irritating substances\n3.3 Use of Personal Protective Equipment\n4. Hazards\n May include:\n4.1 Fumes\n4.2 Skin irritation\n4.3 Burns\n5.Adhesive/Sealant\n checking\n\nMay include:\n5.1 Expiry date\n5.2 Free of contamination\n5.1 Cap/Covers\n5.2 Tightly closed\n5.3 Concentration\n\n--- PDF PAGE 18 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n16\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Required\nknowledge\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.2 Procedures in sealant/adhesive application\n2.3 Procedures in interpreting manuals\n3. Required skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3.Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n• Application of adhesive/sealant\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or\nsimulated environment\n\n--- PDF PAGE 19 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n17\nUNIT OF COMPETENCY: MOVE AND POSITION VEHICLE\n\nUNIT CODE: ALT723202\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude needed to\nmove and position vehicle in a workshop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare vehicle for\n driving\n1.1 Correct check-up procedures performed based on\n vehicle manufacturer’s standard\n2. Move and position\n vehicle\n2.1 Select vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3 Park vehicle following parking safety techniques\nand procedure\n3. Check the vehicle\n3.1 Vehicle position is checked as per requirement\n3.2 Vehicle is checked for external damages\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Check up procedure\nMay include:\n1.1 Oil level\n1.2 Brake fluid\n1.3 Clutch fluid\n1.4 Coolant level\n1.5 Battery (electrolyte)\n1.6 Tire pressure\n1.7 Position of driving gear\n1.8 Lighting and warning devices\n2. Vehicles\nMay include:\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n3.Parking safety\n techniques\nMay include:\n3.1 Engaging of Park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 20 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n18\nEVIDENCE GUIDE\n\n1.Critical aspects of\n competency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for driving.\n1.2 Moved and positioned vehicle\n1.3 Checked the vehicle.\n2. Required\n knowledge\n2.1 Driver’s Code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4 Vehicle accessories for safe driving and parking\n3. Required skills\n3.1 Ability to handle/maneuver vehicle the easiest way\n3.2 Immediate response to accident\n3.3 Preparing vehicle for driving\n3.4 Parking Downhill, Uphill, Parallel\n3.5 Shifting Gears\n3.6 Maneuvering\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Driving range/area\n4.2 Appropriate vehicle for driving\n4.3 Vehicle accessories\n5. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n5.4 Observation with questioning\n5.5 Written or oral examination\n6. Context of\n assessment\n6.1 Assessment must be undertaken in accordance with the\n endorsed TESDA assessment guidelines\n6.2 Assessment of practical skills must be done in a\nworkplace or simulated environment.\n\n--- PDF PAGE 21 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n19\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in\nidentifying, caring, handling and sing of measuring\ninstrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to\njob requirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained in accordance with\nthe job requirements\n2.3 Calculation needed to complete work tasks are performed\n using the four fundamental operations of addition (+),\nsubtraction (-),multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 22 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMay include:\n1.1\nMultitester\n1.2\nMicrometer (In-out, depth)\n1.3\nVernier caliper (Out, inside)\n1.4\nDial Gauge with Mag. Std.\n1.5\nPlastigauge\n1.6\nStraight Edge\n1.7\nThickness gauge\n1.8\nTorque Gauge\n1.9\nSmall Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nMay include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11 Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 23 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n21\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Required\nKnowledge\n\n2.1 Types of Measuring instruments and their uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Required\n skills\n\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction,\n Multiplication and Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and\nother geometric figures\n\n4. Resource\n implication\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency in this unit may may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\nworking environment\n6.2 Assessment may be conducted in a workplace or\nsimulated environment\n\n--- PDF PAGE 24 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n22\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying\nservice specification manuals, maintenance procedure\nmanuals and periodic maintenance manual.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per\njob requirements.\n1.2 Version and date of manual are checked to ensure\ncorrect specification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications\nare located in relation to the work to be conducted\n2.2 Information and procedure in the manual are interpreted\nin accordance with industry practices\n\n3. Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data are applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 25 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n23\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n May include:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Required\nKnowledge\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n3.1 Identification of units of measurements\n3.2 Unit conversion\n\n3. Required skills\n\n3.1 Reading and comprehension skills required to identify\nand interpret automotive manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplication\n\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6. Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 26 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n24\nU