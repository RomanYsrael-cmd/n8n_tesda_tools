        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate has:\n1.1\nCommunicated effectively with others involved in or\naffected by the work\n1.2\nIdentified and assessed hazardous situations and\nrectified, or reported to the relevant persons\n1.3\nOperated fire-fighting equipment\n1.4\nHandled safely and stored dangerous and/or\nhazardous goods and substances\n1.5\nApplied safe manual handling practices\n1.6\nOperated safely and effectively equipment and\nutilized materials over the full range of functions\n1.7\nFollowed worksite evacuation procedures.\n2. Required Knowledge General knowledge of:\n2.1\nThe implications of OHS on efficiency, morale and\ncustomer relations\n2.2\nCommon automotive terminology\n2.3\nOHS regulations/requirements, equipment, material\nand personal safety requirements\n2.4\nSafe manual handling theories and practices\n2.5\nThe selection and application of fire-fighting\nequipment\n2.6\nDangerous goods and hazardous chemicals handling\nprocesses\n2.7\nWorksite reporting procedures\n3. Required Skills\n3.1.\nCollect, organize and understand information related\nto recognizing and reporting situations\n3.2.\nCommunicate ideas and information to reporting\nprocedures (verbal and written)\n3.3.\nPlan and organize activities which implement and\nfollow standard procedures\n3.4.\nWork with others and in a team by assisting and\ncooperating with team members\n3.5.\nUse mathematical ideas and techniques to document\nand report numbers for emergency procedures\n3.6.\nEstablish diagnostic processes which recommend\nimprovements for OHS issues\n3.7.\nUse workplace technology related to the use of\ntechnology to assist with safe work practices\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nA workplace or simulated workplace\n4.2.\nSituations requiring safe working practices\n4.3.\nWorksite or equivalent instructions on safe working\npractice\n4.4.\nHazardous chemicals and/or dangerous goods\ninformation\n4.5.\nMaterials, tooling and equipment\n4.6.\nFirefighting appliances and fire test facilities\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 40 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n38\nUNIT OF COMPETENCY: INSPECT TECHNICAL QUALITY OF WORK\nUNIT CODE :"
        },
        "source_text": "ALT723206\nUNIT DESCRIPTOR : This unit of competency incorporates the work safe regional\nguidelines and encompasses competencies necessary to\napply basic safety and emergency procedures to maintain a\nsafe workplace for staff, customers and others.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply basic safety\nprocedures\n1.1.\nPolicies and procedures to achieve a safe working\nenvironment are followed and maintained in line with\noccupational health and safety (OHS) procedures\nand according to worksite policy\n1.2.\nAll unsafe situations are recognized and reported\naccording to worksite policy\n1.3.\nAll breakdowns in relation to machinery and\nequipment are reported to supervisor or nominated\npersons\n1.4.\nFire and safety hazards are identified and\nprecautions are taken or reported according to\nworksite policy and procedures\n1.5.\nDangerous goods and substances are identified,\nhandled and stored according to worksite policy and\nprocedures and OHS requirements\n1.6.\nWorksite policy regarding manual handling practice is\nfollowed\n1.7.\nParticipation in consultative arrangements\nestablished by company for OHS is exercised\n2. Apply emergency\nprocedures\n2.1.\nWorksite policies and emergency procedures\nregarding illness or accidents are identified and\napplied\n2.2.\nSafety alarms are identified\n2.3.\nQualified persons are contacted in the event of\naccident or sickness of customers or staff and\naccident details are documented according to\nworksite accident/ injury procedures\n2.4.\n Worksite evacuation procedures are identified and\napplied\n\n--- PDF PAGE 38 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Policies and\nprocedures\nMay include:\n1.1.\nHazard policies and procedures\n1.2.\nEmergency, fire and accident procedures\n1.3.\nPersonal safety procedures\n1.4.\nProcedures for the use of personal protective clothing\nand equipment\n1.5.\nUse of motor vehicles\n1.6.\nResolution procedures\n1.7.\nJob procedures\n1.8.\nWork instructions\n2. OHS procedures\nMay include:\n2.1.\nSafe manual handling and lifting customers, staff,\nequipment/tooling, premises and stock\n3. Hazards\nMay include:\n3.1.\nSharp cutting tooling and instruments\n3.2.\nElectricity and water\n3.3.\nToxic substances\n3.4.\nDamaged packing material or containers\n3.5.\nBroken or damaged equipment\n3.6.\nFlammable materials and fire hazards\n3.7.\nLifting practices\n3.8.\nSpillages, waste and debris especially on floors,\nladders, trolleys and glue guns/burns\n\n4. Emergency\nprocedures\nMay include:\n4.1.\nSickness\n4.2.\nAccident\n4.3.\nFire or store evacuation involving staff or customers\n\n--- PDF PAGE 39 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n37\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate has:\n1.1\nCommunicated effectively with others involved in or\naffected by the work\n1.2\nIdentified and assessed hazardous situations and\nrectified, or reported to the relevant persons\n1.3\nOperated fire-fighting equipment\n1.4\nHandled safely and stored dangerous and/or\nhazardous goods and substances\n1.5\nApplied safe manual handling practices\n1.6\nOperated safely and effectively equipment and\nutilized materials over the full range of functions\n1.7\nFollowed worksite evacuation procedures.\n2. Required Knowledge General knowledge of:\n2.1\nThe implications of OHS on efficiency, morale and\ncustomer relations\n2.2\nCommon automotive terminology\n2.3\nOHS regulations/requirements, equipment, material\nand personal safety requirements\n2.4\nSafe manual handling theories and practices\n2.5\nThe selection and application of fire-fighting\nequipment\n2.6\nDangerous goods and hazardous chemicals handling\nprocesses\n2.7\nWorksite reporting procedures\n3. Required Skills\n3.1.\nCollect, organize and understand information related\nto recognizing and reporting situations\n3.2.\nCommunicate ideas and information to reporting\nprocedures (verbal and written)\n3.3.\nPlan and organize activities which implement and\nfollow standard procedures\n3.4.\nWork with others and in a team by assisting and\ncooperating with team members\n3.5.\nUse mathematical ideas and techniques to document\nand report numbers for emergency procedures\n3.6.\nEstablish diagnostic processes which recommend\nimprovements for OHS issues\n3.7.\nUse workplace technology related to the use of\ntechnology to assist with safe work practices\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nA workplace or simulated workplace\n4.2.\nSituations requiring safe working practices\n4.3.\nWorksite or equivalent instructions on safe working\npractice\n4.4.\nHazardous chemicals and/or dangerous goods\ninformation\n4.5.\nMaterials, tooling and equipment\n4.6.\nFirefighting appliances and fire test facilities\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 40 ---\nAutomotive Servicing NC I (Amended) Promulgated December 2013\n38\nUNIT OF COMPETENCY: INSPECT TECHNICAL QUALITY OF WORK\nUNIT CODE :"
