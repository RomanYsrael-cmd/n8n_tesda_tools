  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for SLAUGHTERING OPERATIONS (LARGE ANIMALS) NC\nII.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: SLAUGHTERING OPERATIONS (LARGE ANIMALS) NC Level: II\n\nNominal Training Duration:\n20 Hrs. (Basic)\n\n20 Hrs. (Common)\n\n 320 Hrs. (Core)\n\n 360 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, behavior and\nmotivations in accordance with industry standards.\n\n--- PDF PAGE 67 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended)\n\n Promulgated March 2016\n 63\nBASIC COMPETENCIES\n(20 HOURS)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n• Describe Organizational\npolicies\n• Group\ndiscussion\n• Oral evaluation\n5 Hours\n• Read:\no Effective communication\n• Lecture\n• Written\nexamination\n\no Written communication\n\no Communication procedures\nand systems\n\n• Identify:\no Different modes of\ncommunication\n\no Medium of communicati