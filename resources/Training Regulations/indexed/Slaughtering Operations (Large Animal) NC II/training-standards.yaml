petency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-\nwork components.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• Must have completed 10 - years basic education;\n• Can communicate both orally and in writing\n\n--- PDF PAGE 90 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 86\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials or access to these tools\nequipment or materials for the training of 15 trainees for Slaughtering Operations (Large\nAnimal) NC II are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n15 pcs.\nWorking knife\n(8”-10” long, 2” width)\n1 unit\nRestraining box/pen\n(2-2.5 m long, 30” width)\n1 box\n(50\npcs.)\nStunning cartridge\n\n2 pcs.\nSticking knife\n(8” long, 1.5” width)\n1 unit\nStunner (pneumatic or\ncartridge type)\n2\npcs.\nPlastic pail\n15 pcs.\nFlaying knife,\n(curved, 7”-8” long,\n1.5”-2” width)\n1 unit\nHoist (1-1.5 ton)\n1 roll Abaca / Plastic\ntwine\n15 pcs.\nScabbard (either\ndouble or single\ndepending on the\nlength of the knife)\nand belt, plastic\n1 unit\nBlood trough\n (1 meter long, 20” in\nheight, with hole