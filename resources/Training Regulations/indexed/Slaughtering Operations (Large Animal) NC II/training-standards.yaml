    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: SLAUGHTERING OPERATIONS (LARGE ANIMALS) NC Level: II\n\nNominal Training Duration:\n20 Hrs. (Basic)\n\n20 Hrs. (Common)\n\n 320 Hrs. (Core)\n\n 360 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, behavior and\nmotivations in accordance with industry standards.\n\n--- PDF PAGE 67 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended)\n\n Promulgated March 2016\n 63\nBASIC COMPETENCIES\n(20 HOURS)\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n• Describe Organizational\npolicies\n• Group\ndiscussion\n• Oral evaluation\n5 Hours\n• Read:\no Effective communication\n• Lecture\n• Written\nexamination\n\no Written communication\n\no Communication procedures\nand systems\n\n• Identify:\no Different modes of\ncommunication\n\no Medium of communication\n\no Flow of communication\n\no Available technology\nrelevant to the enterprise\nand the individual’s work\nresponsibilities\n\n• Prepare different Types of\nquestion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n\n• Gather different sources of\ninformation\n\n• Apply storage system in\nestablishing workplace\ninformation\n\n• Demonstrate Telephone\ncourtesy\n\n--- PDF PAGE 68 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended)\n\n Promulgated March 2016\n 64\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.2 Complete relevant work\nrelated documents\n• Describe Communication\nprocedures and systems\n• Group\ndiscussion\n• Oral evaluation\n\n• Read:\no Meeting protocols\n• Lecture\n• Written\nexamination\n\no Nature of workplace\nmeetings\n• Lecture\n• Written\nexamination\no Workplace interactions\no Barriers of communication\n\n• Complete work related\ndocuments\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n\n• Read instructions on work\nrelated forms/documents\n• Lecture\n• Written\nexamination\n\n• Practice:\n\no Estimate, calculate and\nrecord routine workplace\nmeasures\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n\n• Demonstrate office activities\nin:\no workplace meetings and\ndiscussions scenario\n• Role play\n• Oral evaluation\n• Demonstration\nwith oral\nquestioning\n\n• Perform workplace duties\nscenario following simple\nwritten notices\n• Role play\n• Oral evaluation\n• Demonstration\nwith oral\nquestioning\n\n• Follow simple spoken\nlanguage\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 69 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended)\n\n Promulgated March 2016\n 65\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Identify the different Non-\nverbal communication\n• Lecture\n• Written\nexamination\n\n• Demonstrate ability to relate to\npeople of social range in the\nworkplace\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n\n• Gather and provide information\nin response to workplace\nrequirements\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n\n1.3 Participate in workplace\nmeeting and discussion\n• Identify:\no Types of workplace\ndocuments and forms\n• Le