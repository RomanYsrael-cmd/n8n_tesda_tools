ible sources of contamination\nduring splitting and quartering and ways to\nprevent it\n• Lecture -\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral\nQuestioning\n\n--- PDF PAGE 87 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended)\n\n Promulgated March 2016\n 83\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nApply occupational safety and health\nstandards\n•\nLecture –\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Demonstration\n• Oral\nQuestioning\n\n4. Perform\nfinal\nprocedures\n4.1 Wash, trim\nand weigh\ncarcass\n•\nPerform washing, trimming and weighing of\ncarcass in accordance with workplace and\nOSHS requirements\n•\nLecture –\nDiscussion\n•\nDemonstration\n•\nGroup\ndiscussion\n•\nHands-on\n• Written\nExamination\n• Observation/\n• Demonstration\n• Oral\nQuestioning\n80 hrs\n\n•\nOperate, clean and maintain the weighing\nequipment according to manufacturer’s\nmanual\n•\nLecture –\nDiscussion\n•\nDemonstration\n•\nGroup\ndiscussion\n•\nHands-on\n• Written\nExamination\n• Observation/\n• Demonstration\n• Oral\nQuestioning\n\n•\nIdentify possible sources of contamination\nduring washing, trimming and weighing of\ncarcass and ways to prevent it\n• Lecture -\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral\nQuestioning\n\n•\nApply occupational safety and health\nstandards\n• Lecture -\n Discussion\n• Demonstration\n\n• Written\nExamination\n• Demonstration\n• Oral\nQuestioning\n\n--- PDF PAGE 88 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended)\n\n Promulgated March 2016\n 84\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n4.2 Label/mark\ncarcass\n•\nPerform labeling/marking of carcass in\naccordance with regulatory, workplace and\nOSHS requirements\n• Lecture -\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Demonstration\n• Oral\nQuestioning\n\n•\nIdentify possible types of damage or out-of-\nspecification conditions\n• Lecture -\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Demonstration\n• Oral\nQuestioning\n\n•\nIdentify possible sources of contamination\nduring labeling of carcass and ways to\nprevent it\n• Lecture -\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Oral\nQuestioning\n\n•\nApply occupational safety and health\nstandards\n• Lecture -\nDiscussion\n• Demonstration\n\n• Written\nExamination\n• Demonstration\n• Oral\nQuestioning\n\n4.3 Clean and\nsanitize tools,\nequipment\nand facilities\n•\nIdentify and describe different types of\ncleaning and sanitizing chemicals and\nagents\n• Lecture -\nDiscussion\n\n• Written\nExamination\n• Oral\nQuestioning\n\n•\nPerform cleaning and sanitation of tools,\nequipment and facilities in accordance with\nregulatory, workplace and OSHS\nrequirements\n• Lecture -\nDiscussion\n• Demonstration\n• Hands-on\n\n• Written\nExamination\n• Observation/\n• Demonstration\n• Oral\nQuestioning\n\n--- PDF PAGE 89 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 85\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-\nwork components.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• Must have completed 10 - years basic education;\n• Can communicate both orally and in writing\n\n--- PDF PAGE 90 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 86\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials or access to these tools\nequipment or materials for the training of 15 trainees for Slaughtering Operations (Large\nAnimal) NC II are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n15 pcs.\nWorking knife\n(8”-10” long, 2” width)\n1 unit\nRestraining box/pen\n(2-2.5 m long, 30” width)\n1 box\n(50\npcs.)\nStunning cartridge\n\n2 pcs.\nSticking knife\n(8” long, 1.5” width)\n1 unit\nStunner (pneumatic or\ncartridge type)\n2\npcs.\nPlastic pail\n15 pcs.\nFlaying knife,\n(curved, 7”-8” long,\n1.5”-2” width)\n1 unit\nHoist (1-1.5 ton)\n1 roll Abaca / Plastic\ntwine\n15 pcs.\nScabbard (either\ndouble or single\ndepending on the\nlength of the knife)\nand belt, plastic\n1 unit\nBlood trough\n (1 meter long, 20” in\nheight, with hole\ndiameter of 1.5-2”\ndepend on workplace\nrequirements)\n\n15 pcs.\nSharpening steel\n(round bar with\nmagnet, 12”-14” long)\n1 unit\nOverhead rails\n(14 feet in height)\n\n15 pcs.\nSharpening stone\n(combination of\ncoarse and fine side -\n12” long, 25” width)\n1 pc\nSpreaders\n(pneumatic operated\nspreaders attached on\nrail\n\n1 unit\nCradle\n(made of stainless pipe,\n3 meter long, 30” width)\n\n1 unit\nBrisket saw\n(pneumatic, circular saw\nblade, 5” in diameter)\n\n15\npcs\nMeat hook and trolley\n(roller - 5 “ diameter\nhook - 18 “)\n\n1 unit\nSplitting axe/saw\n(pneumatic, circular saw\nblade, 16” in dia., motor\n- I HP)\n\n1 pc\nPaunch truck\n(pushcart in form\n4 feet x 3 feet depend\non workplace\nrequirements\n\n--- PDF PAGE 91 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 87\n\nQTY.\nEQUIPMENT\nQTY.\nPERSONNEL\nPROTECTIVE\nEQUIPMENT\n\n2 pcs\nViscera truck (pushcart\nin form\n4 feet x 3 feet depend\non workplace\nrequirements\n15\nunits\nHard hat\n\n2 pcs\nInspection table\n(30” width, 1-2 meter\nlong)\n15\npairs Rubber gloves\n\n2\nsets\nPressurized water\nspray (0.5-1 HP motor)\n5\nunits\nEar plugs/muffs\n\n4\nunits\nSterilizer/handwash\n(box stainless with\nheater, temp. 70-100\ndegrees Celcius)\n15\nunits\nApron (water-proof)\n\n1 unit\nCondemnation\nreceptacle (stainless /\nplastic drum)\n5\nunits\nGoggles\n\n1 unit\nWeighing scale\n(digital, ranging from\n500 kgs. capacity)\n15\npairs Rubber boots\n\n6\nunits\nTool dips/basin\n(sanitizers or sterilizers)\n15\nsets\nUniform (long\npants and shirt or\ncover-all)\n\n6\nunits\nHand Dips\n(Pail, 1 foot in height)\n\nLIVESTOCK\n\n75\nCattle\n\nNOTE: - Facilities, tools and equipment are taken from the Accreditation Requirement of Slaughterhouses by\n National Meat Inspection Service.\no\nTraining Center may enter into Memorandum of Agreement (MOA) with an NMIS accredited\nslaughterhouse (AA accredited).\n\n--- PDF PAGE 92 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 88\n\n3.5\nTRAINING FACILITIES\n\nRequired training facilities for training institution that will offer Slaughtering\nOperations (Large Animal) NC II based on a class intake of 15 students/trainees.\n\nSPACE REQUIREMENT\nAREA IN\nSQ. METERS\nTOTAL AREA IN\nSQ. METERS\nStudent/Trainee Lecture room\n30\n30\nSlaughter house\n43\n43\nHolding Pen\n30\n30\nLoading Bay\n6\n6\nRestroom/Wash/\n6\n6\nLocker/Changing Room\n6\n6\nWaste (water) management facilities\n\nTOTAL AREA\n121\n121\n\n3.6\nTRAINER’S QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer’s Certificate Level I either in :\n Slaughtering Operations (Large Animals) NC II\n Slaughtering Operations (Swine) NC II\n•\nMust have at least 2 years relevant industry experience and teaching experience\n•\nMust have attended relevant training and seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of competency.\n\nThe result of the institutional assessments may be considered as an evidence for\nnational assessment.\n\n--- PDF PAGE 93 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 89"
