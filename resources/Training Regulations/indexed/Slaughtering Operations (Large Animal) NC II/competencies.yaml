ed) Promulgated March 2016 34\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Participate in\nimproving GMP\n4.1 Processes, practices\nor conditions which\ncould result in non-\ncompliance with GMP\nare identified and\nreported according to\nworkplace reporting\nrequirements\n4.2 Corrective action is\nimplemented within\nlevel of responsibility\n4.3 GMP issues are\nraised with designated\npersonnel\n• Non-compliance and\ncorrective action in\nGMP\n• Corrective actions\n• Practicing GMP\n• Reporting\nworkplace\ncondition\n• Implementing\ncorrective\nmeasures\n\n5. Participate in\nvalidation\nprocesses\n5.1 Validation procedures\nare followed to GMP\nrequirements\n5.2 Issues arising from\nvalidation are raised\nwith designated\npersonnel\n5.3 Validation procedures\nare documented to\nmeet GMP\nrequirements\n• Validation\nprocedures in GMP\n• Issues arising from\nvalidation\n• Documentation of\nvalidation\nprocedures\n• Following\nvalidation\nprocedures\n• Reporting issues\narising from\nvalidation\n• Documenting\nvalidation\nprocedures\n6. Complete\nworkplace\ndocumentation\nto support GMP\n6.1 Documentation and\nrecording\nrequirements are\nidentified\n6.2 Information is\nrecorded according to\nworkplace reporting\nprocedures to meet\nGMP requirements\n• Documentation and\nworkplace reporting\nprocedures in GMP\n• Information and\nworkplace reporting\nprocedures\n• Keeping records\n• Recording\ninformation\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH&S requirements\nMay include:\n1.1. OH&S legal requirements\n1.2. Enterprise OH&S policies, procedures and programs\n2. Work is carried out in\naccordance with\nregulatory requirements\nMay include:\n2.1. Relevant regulations regarding food processing and\nfood safety regulations\n2.2. Department of Healt