, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. Personal protective\nequipment (PPE)\nMay include:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 19\nVARIABLE\nRANGE\n5. Emergency-related drills\nand training\nMay include:\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OHS personal records\nMay include:\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 20\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Resource implications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n3. Methods of assessment\nCompetency in this unit maybe assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for assessment\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 21\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY FOOD SAFETY AND SANITATION\n\nUNIT CODE\n:"
