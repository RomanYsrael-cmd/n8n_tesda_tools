        "source_text": "PFB751213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude to perform\nmathematical computations in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Gather and\nTabulate the\nRecorded Data\n\n1.1 Records of weights\nand measurements\nof raw materials and\ningredients are\ngathered and\nsummarized\naccording to\nworkplace standard\noperating procedures\n1.2 Records of weights\nand measurements of\nfinished processed\nproducts are\ngathered and\nsummarized\naccording to\nworkplace standard\noperating procedures\n1.3 Summarized data are\ntabulated according\nto enterprise\nrequirements\n•\nData gathering\n•\nRecord keeping\n•\nData summary and\nanalysis\n•\nBasic Mathematical\nOperations\n•\nGathering data\n•\nKeeping of\nrecords\n•\nSummarizing\nand analyzing\ndata\n•\nBasic\nMathematical\nskills\n•\nBasic\nAccounting\nskills\n2. Review the\nVarious\nFormulations\n2.1 Raw materials and\ningredients and\npercentage\nformulations are\nchecked/counter\nchecked according to\napproved\nspecifications and\nenterprise\nrequirements\n2.2 Finished products\nand percentage\nformulations are\nreviewed according\nto approved\nspecifications and\nenterprise\nrequirements\n•\nPercentages and\nformulations of raw\nmaterials and\ningredient and\nfinished products\n•\nProcedures in\nchecking raw\nmaterials and\nfinished products\nformulation and\npercentages\n•\nBasic Mathematical\nOperations\n•\nChecking\npercentages\nformulations of\nraw materials\nand ingredient\n•\nReviewing\npercentages and\nformulations of\nfinished products\n•\nNumeracy skills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 29\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Calculate\nProduction Input\nand Output\n\n3.1 Data on raw material\nconsumption and\ncorresponding\npercentage\nequivalent are\ncalculated in line\nwith enterprise\nrequirements\n3.2 Data on actual\nspoilage and rejects\nand corresponding\npercentage\nequivalents are\ncalculated according\nto enterprise\nrequirements\n3.3 Data on actual yields\nand recoveries and\ncorresponding\npercentage\nequivalents are\ncalculated according\nto enterprise\nrequirements\n3.4 All calculated data\nare recorded\naccording to\nenterprise\nrequirements\n•\nRecord keeping\n•\nMensuration\n•\nFraction, ratios\nand proportions\n•\nBasic\nMathematical\nOperations\n•\nConversion\nfactors\n•\nPercentage\nformulation\n•\nBasic\nMathematical\nskills\n•\nRecording\nskills\n4. Compute\nProduction Cost\n\n4.1 Costs of production\nare computed\naccording to\norganization’s\nstandard procedures\n4.2 Computed costs of\nproduction are\nreviewed and\nvalidated according to\norganization’s\nproduction\nrequirements\n\n•\nCost of\nproduction\n•\nValidation\nprocedures for\ncomputer costs\n•\nBasic\nMathematical\nOperations\n•\nBasic\nMathematical\nskills\n•\nBasic\nAccounting\nskills\n•\nReviewing\nand validating\ncomputed\ncosts\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Weights and\nmeasurements\nMay include:\n1.1 Gravimetric\n1.2 Volumetric\n1.3 Lengths, diameters, widths\n1.4 Seam measurements\n1.5 Hotness/coldness ( temperature)\n1.6 Concentrations of solutions\n2. Costs of production\nMay include:\n2.1 Ingredient formulation\n2.2 Percentage formulation\n2.3 Conversion\n2.4 Ratios and proportion\n2.5 Spoilage and rejects and corresponding percentages\n2.6 Recoveries and yields and corresponding percentages\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Gathered the records of weights and measurements of\nraw materials/ingredients and finished processed\nproducts\n1.2 Summarized and tabulated all raw data gathered\n1.3 Calculated the production inputs and outputs\n1.4 Computed the costs of production\n1.5 Reviewed all formulations and concentrations of\nsolutions according to specifications and standards of\nthe enterprise\n2. Resource Implications\nThe following resources should be provided:\n2.1 Work area/station\n2.2 Materials relevant to recording and documentation of\nproduction data\n2.3 Computer with printer and software\n2.4 Calculator\n2.5\nWork table\n3. Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1 A combination of direct observation and questioning\nof a candidate computing costs of production\n3.2 Submission of a written report showing a record of\nproduction data including raw data\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 31\nUNIT OF COMPETENCY\n:\n\nIMPLEMENT GOOD MANUFACTURING PRACTICE\n\nAND PROCEDURES\n\nUNIT CODE\n:"
