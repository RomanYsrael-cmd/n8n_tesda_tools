        "source_text": "PFB751335\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to maintain\nknives for safe and effective use in slaughtering and meat\nestablishments.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Sharpen knives\n1.1 Knives are sharpened\naccording to\nworkplace\nrequirements\n1.2 Knives are sharpened\nto maintain a bevel\nedge\n1.3 Steel is used\ncorrectly to maintain\na bevel edge and to\nmeet Occupational\nSafety and Health\nStandards (OSHS)\n1.4 Personal\nProtective\nEquipment(PPE)\nare used according\nto OSHS\n\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no OSHS issues\nrelated to use and\nsharpening knives\no Sterilization and\nhygiene\nrequirements\nrelated to knife\nsharpening\n• SCIENCE\no Techniques in\nsharpening knives\no Steps in steeling\nknives\no Techniques in\nhandling knives\n• TECHNOLOGY\no Different types of\nknives and\nsharpening\nequipment\n•\nHandling and\nsharpening knife\n•\nPracticing OSHS\n2. Work safely with\nknives\n2.1 Knives are used in\nways which minimize\nthe risk of injury\n2.2 Knives are used\nsafely at all times in\naccordance to\nregulatory\nrequirements\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no OSHS issues\nrelated to using\nknives\n• SCIENCE\no Techniques in using\nknives\n1\n•\nUsing knife\n•\nPracticing OSHS\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Maintain knives\nand associated\nequipment\n3.1. Knives are\nmaintained in\naccordance to\nhygiene and\nsanitation and\nworkplace\nrequirements\n3.2. Knife sharpening\nequipment is\nmaintained, cleaned\nand stored to hygiene\nand sanitation and\nworkplace\nrequirements\n• COMMUNICATION\no Work Instructions\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no OSHS issues\nrelated to storing\nknives\n• SCIENCE\no Techniques in\nstoring knives and\nassociated\nequipment\n•\nStoring knife and\nequipment\n•\nPracticing OSHS\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 44\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Workplace requirements\nMay include:\n1.1 Safety work instructions\n1.2 Standard operating procedures\n1.3 Occupational safety and health standards (OSHS)\n1.4 Wearing appropriate PPE\n1.5 Quality assurance requirements\n2. Occupational Safety and\nHealth Standards\n(OSHS)\nMay include:\n2.1 OSHS legal requirements\n2.2 Hygiene and sanitation requirements\n2.3 Enterprise OSHS policies, procedures and programs\n3. Personal Protective\nEquipment (PPE)\nMay include:\n3.1 Uniforms, coat, apron\n3.2 Work, safety or waterproof footwear\n3.3 Protective head and hair covering\n3.4 Protective hand and arm covering\n3.5 Ear plugs/mugs\n3.6 Goggles\n4. Regulatory requirements\nMay include:\n4.1 Relevant regulations regarding food processing and\nfood safety regulations\n4.2 Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856) and NMIS\n4.3 Meat Inspection Code of the Philippines (RA 9296) as\namended by"
