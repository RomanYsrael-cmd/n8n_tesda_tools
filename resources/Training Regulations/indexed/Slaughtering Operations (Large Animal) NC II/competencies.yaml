  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of competency\nrequired in SLAUGHTERING OPERATIONS (LARGE ANIMALS) NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n\n:\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is\naccessed from\nappropriate sources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium\nis used to transfer\ninformation and ideas\n1.4 Appropriate non-\nverbal communication\nis used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and\nfollowed\n1.6 Defined workplace\nprocedures for the\nlocation and storage\nof information are\nused\n1.7 Personal interaction\nis carried out clearly\nand concisely\n\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Sources of\ninformation\n• Types of question\n• Medium of\ncommunication\n• Flow of\ncommunication\n• Storage system\n• Telephone\ncourtesy\n\n• Following simple\nspoken language\n• Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n• Listening skills\n• Questioning skills\n• Workplace\nlanguage skills\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 3\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings\nare attended on\ntime\n2.2 Own opinions are\nclearly expressed\nand those of\nothers are listened\nto without\ninterruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose\nand established\nprotocols\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Questions about\nsimple routine\nworkplace\nprocedures and\nmatters\nconcerning\nworking conditions\nof employment are\nasked and\nresponded to\n2.6 Meetings\noutcomes are\ninterpreted and\nimplemented\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of\ncommunication\n• Workplace interactions\n• Non-verbal\ncommunication\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Interpersonal\ncommunication\nskill\n• Observing\nmeeting\nprotocols\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions\nof employment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used\nfor routine\ncalculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are\nidentified and\nproperly acted upon\n3.5 Reporting\nrequirements to\nsupervisor are\ncompleted according\nto organizational\nguidelines\n• Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n• Types of workplace\ndocuments and\nforms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n\n• Applying basic\nmathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n• Data recording\n• Report writing\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Protocols\nMay include:\n4.1.\nObserving meeting\n4.2.\nCompliance with meeting decisions\n4.3.\nObeying meeting instructions\n5. Workplace interactions\nMay include:\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n6. Forms\nMay include:\nPersonnel forms, telephone message forms, safety reports\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 6\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n2. Resource implications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4.\nInternet\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1. Direct observation\n3.2.\nOral interview and written examination\n4. Context for Assessment\n4.1. Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 7\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n :\n 500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nDescribe team\nrole and scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n•\nTeam roles\n•\nDefinition of Team\n•\nDifference between\nteam and group\n•\nDifferent sources of\ninformation\n•\nObjectives and\ngoals of team\n•\nDescribing the\nteam role and\nscope\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1 Individual role and\nresponsibilities within\nthe team\nenvironment are\nidentified\n2.2 Roles and\nresponsibility of other\nteam members are\nidentified and\nrecognized\n2.3 Reporting\nrelationships within\nteam and external to\nteam are identified\n•\nTeam structure\n•\nRoles and\nresponsibility of\nteam members\n•\nTeams in work\nenvironment\n•\nFundamental rights\nat work including\ngender sensitivity\n•\nCommunicating\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n•\nIdentifying\nindividual role and\nresponsibility\n•\nIdentifying\nexternal\nrelationship\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 8\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Work as a\nteam member\n3.1 Effective and\nappropriate forms of\ncommunications\nused and interactions\nundertaken with team\nmembers who\ncontribute to known\nteam activities and\nobjectives\n3.2 Effective and\nappropriate\ncontributions made to\ncomplement team\nactivities and\nobjectives, based on\nindividual skills and\ncompetencies and\nworkplace context\n3.3 Observed protocols\nin reporting using\nstandard operating\nprocedures\n3.4 Contribute to the\ndevelopment of team\nwork plans based on\nan understanding of\nteam’s role and\nobjectives and\nindividual\ncompetencies of the\nmembers\n•\nCommunication\nprocess\n•\nGroup planning and\ndecision making\n•\nTeam goals and\nobjectives\n•\nUnderstanding\nindividual\ncompetencies relative\nto teamwork\n•\nTypes of individuals\n•\nRole of leaders\n•\nInteracting\neffectively with\nothers\n•\nSetting team\ngoals and\nexpectations\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\nMay include:\n1.1. Work activities in a team environment with enterprise or\nspecific sector\n1.2. Limited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\nMay include:\n2.1. Standard operating and/or other workplace procedures\n2.2. Job procedures\n2.3. Machine/equipment manufacturer’s specifications and\ninstructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OHS and environmental standards\n3. Workplace context\nMay include:\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe handling\nand disposal of chemicals\n3.5. Safety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated in a team to complete workplace activity\n1.2 Worked effectively with others\n1.3 Conveyed information in written or oral form\n1.4 Selected and used appropriate workplace language\n1.5 Followed designated work plan for the job\n1.6 Reported outcomes\n2. Resource implications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of assessment\nCompetency in this unit maybe assessed through:\n3.1 Observation of the individual member in relation to the\nwork activities of the group\n3.2 Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3 Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n4. Context for Assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 11\n\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Integrate\npersonal\nobjectives with\norganizational\ngoals\n1.1 Personal growth and\nwork plans are\npursued towards\nimproving the\nqualifications set for\nthe profession\n1.2 Intra- and\ninterpersonal\nrelationships are\nmaintained in the\ncourse of managing\noneself based on\nperformance\nevaluation\n1.3 Commitment to the\norganization and it’s\ngoal is demonstrated\nin the performance of\nduties\n•\nWork values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n•\nUnderstanding\npersonal objectives\n•\nUnderstanding\norganizational goals\n•\nDifference between\nintra and\ninterpersonal\nrelationship\n•\nPerformance\nevaluation\n\n•\nDemonstrating\nIntra and\nInterpersonal\nskills at work\n•\nDemonstrating\npersonal\ncommitment in\nwork\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 12\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Set and meet\nwork priorities\n2.1 Competing demands\nare prioritized to\nachieve personal,\nteam and\norganizational goals\nand objectives\n2.2 Resources are\nutilized efficiently and\neffectively to manage\nwork priorities and\ncommitments\n2.3 Practices along\neconomic use and\nmaintenance of\nequipment and\nfacilities are followed\nas per established\nprocedures\n•\nCompany policies\n•\nCompany\noperations,\nprocedures and\nstandards\n•\nTime management\n•\nBasic strategic\nplanning concepts\n•\nResource utilization\nand management\n\n•\nManaging goals\nand time\n•\nPracticing\neconomic use of\nresources and\nfacilities\n•\nSetting work\npriorities\n•\nPracticing time\nmanagement\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and\ncareer opportunities\nare identified and\navailed of based on\njob requirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as\nproof of career\nadvancement\n3.3 Licenses and/or\ncertifications\nrelevant to job and\ncareer are obtained\nand renewed\n•\nCareer development\nopportunities\n•\nCompany\nrecognition and\nincentives\n•\nInformation on\nrelevant licenses\nand or certifications\n•\nDetermining\npersonal career\ndevelopment\nneeds\n•\nIdentifying career\nopportunities\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\nMay include:\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\nMay include:\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\nMay include:\n3.1 Participation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\nMay include:\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\nMay include:\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 14\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which\nare based on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Resource implications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n4. Context for assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 15\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\n\nUNIT CODE\n\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply\nwith\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify hazards\nand risks\n1.1 Safety regulations\nand workplace safety\nand hazard control\npractices and\nprocedures are\nclarified and\nexplained based on\norganization\nprocedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding\nindicators are\nidentified to minimize\nor eliminate risk to\nco-workers,\nworkplace and\nenvironment in\naccordance with\norganization\nprocedures\n1.3 Contingency\nmeasures during\nworkplace accidents,\nfire and other\nemergencies are\nrecognized and\nestablished in\naccordance with\norganization\nprocedures\n•\nOHS procedures\nand practices and\nregulations\n•\nHazards/risks\nidentification and\ncontrol\n•\nOHS indicators\n•\nOrganizational\ncontingency\npractices\n•\nHazards/risks\nidentification\nand control\nskills\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 16\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of maximum\ntolerable limits which\nwhen exceeded will\nresult in harm or\ndamage are identified\nbased on threshold\nlimit values (TLV)\n2.2 Effects of the hazards\nare determined\n2.3 OHS issues and/or\nconcerns and\nidentified safety\nhazards are reported\nto designated\npersonnel in\naccordance with\nworkplace\nrequirements and\nrelevant workplace\nOHS legislation\n•\nThreshold Limit\nValue -TLV\n•\nEffects of safety\nhazards\n•\nCommunication\nskills\n•\nReporting safety\nhazards\n3. Control hazards\nand risks\n3.1 Occupational Health\nand Safety (OHS)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace are\nconsistently followed\n3.2 Procedures for\ndealing with\nworkplace accidents,\nfire and emergencies\nare followed in\naccordance with\norganization OHS\npolicies\n3.3 Personal protective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OHS\nprocedures and\npractices\n3.4 Appropriate\nassistance is\nprovided in the event\nof a workplace\nemergency in\naccordance with\nestablished\norganization protocol\n•\nPersonal hygiene\npractices\n•\nOrganization safety\nand health protocol\n•\nCompany\nemergency\nprocedure practices\n•\nPracticing\npersonal hygiene\n•\nResponding to\nemergency\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 17\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Maintain OHS\nawareness\n4.1 Emergency-related\ndrills and trainings\nare participated in as\nper established\norganization\nguidelines and\nprocedures\n4.2 OHS personal\nrecords are\ncompleted and\nupdated in\naccordance with\nworkplace\nrequirements\n•\nWorkplace OHS\npersonal records\n•\nInformation on\nemergency-related\ndrills\n•\nPracticing\nemergency-\nrelated drill skills\nin the workplace\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay inclu