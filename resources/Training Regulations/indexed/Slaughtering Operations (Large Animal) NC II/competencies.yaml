        "source_text": "PFB751210\n\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required to apply food safety\nand sanitation in the workplace\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Wear personal\nprotective\nequipment\n1.1 Personal protective\nequipment are\nchecked according to\nmanufacturer’s\nspecifications\n1.2 Personal protective\nequipment (PPE) are\nworn according to the\njob requirement\n•\nPersonal protective\nequipment (PPE)\n•\nProcedures in\nwearing in PPE\n•\nGood Food\nManufacturing\nPractices\n•\nParts and functions\nof personal\nprotective\nequipment\n•\nChecking PPE\n•\nPracticing GMP\n2. Observe\npersonal\nhygiene and\ngood grooming\n2.1 Personal hygiene\nand good grooming\nis practiced in line\nwith workplace\nhealth and safety\nrequirements\n•\nGood grooming and\npersonal hygiene\n•\nWorkplace health\nand safety\nrequirements\n•\nPracticing good\ngrooming and\npersonal\nhygiene\npractices\n3. Implement food\nsanitation\npractices\n3.1 Sanitary food\nhandling practices\nare implemented in\nline with workplace\nsanitation\nregulations\n3.2 Safety measures are\nobserved in line with\nworkplace safety\npractices.\n•\nProper waste\ndisposal\n•\nEnvironmental\nprotection and\nconcerns\n•\nFood safety\nprinciples and\npractices\n•\nTQM and other food\nquality system\nprinciples\n•\nManaging\nwastes\n•\nImplementing\nsanitary food\nhandling\npractices\n•\nPracticing\nworkplace safety\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 22\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Render safety\nmeasures and\nfirst Aid\nprocedures\n4.1 Safety measures\nare applied\naccording to\nworkplace rules and\nregulations\n4.2 First aid\nprocedures are\napplied and\ncoordinated with\nconcerned\npersonnel according\nto workplace\nstandard operating\nprocedures.\n•\nSafety measures\n•\nFirst aid procedures\n•\nParts and functions\nof personal\nprotective\nequipment\n•\nFirst Aid Kit\n•\nApplying safety\nmeasures\n•\nApplying first\naid treatment\n•\nPracticing PPE\n•\nCoordinating\nwith concerned\npersonnel\n5. Implement\nhousekeeping\nactivities\n5.1 Work area and\nsurroundings are\ncleaned in\naccordance with\nworkplace health\nand safety\nregulations\n5.2 Waste is disposed\naccording to\norganization’s waste\ndisposal system\n5.3 Hazards in the work\narea are recognized\nand reported to\ndesignated\npersonnel according\nto workplace\nprocedures\n\n•\nHazards in work\narea\n•\nWaste disposal\n•\nHousekeeping / 7’s\n•\nProper waste\ndisposal\n•\nImplementing\nhousekeeping\nactivities\n•\nPracticing\nproper waste\ndisposal\n•\nCoordination\nskills\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 23\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manufacturer’s\nspecifications\nMay include:\n1.1 Handling\n1.2 Operating\n1.3 Discharge Label\n1.4 Reporting\n1.5 Testing\n1.6 Positioning\n1.7 Refilling\n2. Personal protective\nequipment(PPE)\nMay include:\n2.1 Apron/laboratory gown\n2.2 Mouth masks\n2.3 Gloves\n2.4 Rubber boots/safety shoes\n2.5 Head gears such as caps, hair nets, earl plug\n3. Workplace health and\nsafety requirements\nMay include:\n3.1 Health/Medical Certificate\n3.2 DOLE requirements\n3.3 BFAD requirements\n3.4 Personal Hygiene and good grooming\n3.5 Plant Sanitation and waste management\n4. Safety measures\nMay include:\n4.1 Labeling of chemicals and other sanitizing agents\n4.2 Installation of fire fighting equipment in the work area\n4.3 Installation of safety signages and symbols\n4.4 Implementation of 5S in the work area\n4.5 Removal of combustible material in the work area\n5. First aid procedures\nMay include:\n5.1 Mouth to mouth resuscitation\n5.2 CPR\n5.3 Application of tourniquet\n5.4 Applying pressure to bleeding wounds or cuts\n5.5 First aid treatment for burned victims\n6. Hazards\nMay include:\n6.1 Physical\n6.2 Biological\n6.3 Chemical\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 24\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned, checked and sanitized personal protective\nequipment\n1.2 Practiced proper personal hygiene and good grooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the work\narea\n2. Resource implications\nThe following resources should be provided:\n2.1 Work area/station\n2.2 First Aid kit\n2.3 PPE relevant to the activities\n2.4 Fire extinguisher\n2.5 Stretcher\n2.6 Materials, tools and equipment relevant to the unit of\ncompetency\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 A combination of direct observation and questioning of\na candidate processing foods.\n4. Context of assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 25\nUNIT OF COMPETENCY :\nUSE STANDARD MEASURING DEVICES AND\nINSTRUMENTS\n\nUNIT CODE\n:"
      }
