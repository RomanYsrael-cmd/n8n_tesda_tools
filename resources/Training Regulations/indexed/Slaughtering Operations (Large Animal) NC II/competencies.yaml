        "source_text": "PFB751336\n\nUNIT DESCRIPTOR\n :\nThis unit deals with the knowledge and skills required to\neffectively and humanely handle and stun, shackle, lift and\nstick large animal on a processing rail.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Restrain animal\n1.1 Animal is conveyed\nfrom the lairage to\nthe restraining box\n1.2 Animal is restrained\nhumanely and safely\nin appropriate\nposition in\naccordance with\nAnimal Welfare Act\n1.3 Animal is placed\ninside stunning box\nwith appropriate\nrestraining\nequipment\n1.4 Personal Protective\nEquipment (PPE) are\nused according to\nOSHS\n1.5 Personal sanitation\nand hygiene is\nobserved\n• ENGLISH/\nCOMMUNICATION\no Company\nOperations Manual\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no Occupational Safety\nand Health\nStandards (OSHS)\no Hygienic standard\npractices\n• SCIENCE\no Animal behavior\no Animal handling\nprocedures\no Restraining\nmethods\n• TECHNOLOGY\no Restraining devices\n• Humane handling\nof animals such\nas:\no\nFlight zone\no\nPoint of\nbalance\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 47\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Stun animal\n2.1 Stunning equipment\nis checked and\noperated in\naccordance with\noperation manual and\nworkplace\nrequirements\nworkplace and\nregulatory\nrequirements\n2.2 Animal is stunned\naccording to\nworkplace\nrequirements and\nOccupational Safety\nand Health\nStandards (OSHS)\n2.3 Animal is checked to\ndetermine if stunning\nhas been effective\n2.4 Corrective action is\ntaken when effective\nstun is not achieved\n2.5 Stunning equipment\nand facilities are\nmaintained in\neffective working\norder\n2.6 Personal Protective\nEquipment (PPE)is\nused according to\nOSHS\n2.7 Personal sanitation\nand hygiene is\nobserved\n• ENGLISH/\nCOMMUNICATION\no Company\nOperations Manual\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no Occupational Safety\nand Health\nStandards (OSHS)\n• SCIENCE\no Animal Anatomy\no Proper stunning\nlocation and\nposition of animal\no Characteristics of a\nproperly stunned\nanimals\n• TECHNOLOGY\no Types and\ndescription of\nstunning equipment\no Parts of stunning\nequipment\no Operation of\nstunning equipment\n\n•\nAbility to identify\nthe site and angle\nof animal’s head\n•\nApply correct\nstunning\nprecision\n•\nAbility to\nrecognize\nstunned animal\n•\nOperating\nstunning\nequipment\n•\nCleaning of\nstunning\nequipment\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 48\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Shackle and\nlift animal\n3.1 Animal is checked\nfor consciousness\nas per Animal\nWelfare Act\n3.2 Animal is shackled\nin accordance with\nworkplace\nrequirements and\nOSHS\n3.3 Animal is lifted at a\nheight and rate\nsuitable for next\noperator\n3.4 Hoisting / lifting\nequipment is used in\naccordance with\nmanufacturer’s\nspecification\n3.5 Hoisting / lifting\nequipment and\nshackles are in good\nworking condition\naccording to\nmanufacturer’s\nspecification\n3.6 Personal Protective\nEquipment is used\naccording to OSHS\n3.7 Personal sanitation\nand hygiene is\nobserved\n• ENGLISH/\nCOMMUNICATION\no Company\nOperations Manual\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no Occupational\nSafety and Health\nStandards (OSHS)\n• SCIENCE\no Animal Anatomy\no Specific location\nand position of\nshackle on the\nanimal\n• TECHNOLOGY\no Hoisting / lifting\nProcedures\n\n•\nShackling,\nHoisting/Lifting of\nanimal\n•\nOperating of\nHoisting/lifting\nequipment\n3 Stick and\nbleed animal\n\n3.1 Knife is used to sever\nthe major blood\nvessels accurately,\nsafely and hygienically\nto workplace\nrequirements\n3.2 Fast and effective\nsticking of animal is\ndone in accordance\nwith the Animal\nWelfare Act\n• ENGLISH/\nCOMMUNICATION\no Company\nOperations Manual\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no Occupational\nSafety and Health\nStandards (OSHS)\n\n•\nPerform sticking\nand bleeding\nprocedures\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 49\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n3.3 Animal is bled in\naccordance with\nworkplace and\nregulatory\nrequirements\n3.4 Blood is collected in\naccordance with\nworkplace and\nregulatory\nrequirements\n3.5 Personal Protective\nEquipment is used\naccording to OSHS\n3.6 Personal sanitation\nand hygiene is\nobserved\n\no Safe and hygienic\nuse of knife\no Hygienic standard\npractices\no Hand washing\ntechniques\n• SCIENCE\no Animal Anatomy\no Identification and\nlocation of major\nblood vessels,\ntrachea and or\nesophagus\n• TECHNOLOGY\no Good sticking and\nbleeding\nprocedures\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 50\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Restraining equipment\nMay include:\n1.1 Restraining/stunning box\n1.2 Catching enclosure\n2. Personal Protective\nEquipment (PPE)\nMay include:\n2.1 Uniforms, coat, apron\n2.2 Work, safety or waterproof footwear\n2.3 Protective head and hair covering\n2.4 Protective hand and arm covering\n2.5 Ear plugs/mugs\n2.6 Goggles\n3. Workplace\nrequirements\nMay include:\n3.1 Safety work instructions\n3.2 Standard operating procedures\n3.3 Occupational safety and health standards (OSHS)\n3.4 Wearing appropriate PPE\n3.5 Quality assurance requirements\n4. Occupational Safety\nand Health Standards\n(OSHS)\nMay include:\n4.1 OSHS legal requirements\n4.2