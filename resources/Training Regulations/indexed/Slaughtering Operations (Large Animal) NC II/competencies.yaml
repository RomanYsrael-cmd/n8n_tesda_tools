azards\nand controls\no\nContamination/\nfood safety risks\n• SCIENCE\no\nHandling\nprocedures\n•\nMeat handling\n3. Clean and\nsanitize tools,\nequipment and\nfacilities\n3.1 Tools and equipment\nare cleaned and\nsanitized according to\nmanual of instructions\n3.2 Work area is cleaned,\nsanitized and\nmaintained according\nto workplace\nrequirements\n3.3 Work is conducted\naccording to\nworkplace\nenvironmental\nguidelines\n• ENGLISH/\nCOMMUNICATION\no Work instructions\n• ENVIRONMENTAL\nISSUES AND\nOTHER CONCERNS\no OSHS\nrequirements\no 5 S\no Solid waste\nsegregation and\ndisposal\n• SCIENCE\no Cleaning and\nsanitizing agents\no Cleaning and\nsanitizing\nprocedures\n•\nCleaning, sanitizing\nand maintenance of\nwork tools,\nequipment and\nfacilities\n\n--- PDF PAGE 64 ---\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 60\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Contamination\nMay include:\n1.1 Dirt from hide such as soil, manure and ruminal materials\n2. Workplace requirements\nMay include:\n2.1 Work instructions\n2.2 Standard operating procedures\n2.3 OSH requirements\n2.4 Quality assurance requirements\n3. Personal Protective\nEquipment (PPE)\nMay include:\n2.1 Uniforms, coat, apron\n2.2 Work, safety or waterproof footwear\n2.3 Protective head and hair covering\n2.4 Protective hand and arm covering\n2.5 Ear plugs/muffs\n2.6 Goggles\n4. Regulatory requirements\nMay include:\n4.1 Meat Inspection Code of the Philippines (R.A. 9296) as\namended by RA No. 10536\n4.2 Animal Welfare Act (RA No. 8485) as amended by RA\nNo. 10631\n4.3 Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856)\n4.4 Relevant regulations regarding meat processing and\nfood safety regulations\n5. Personal sanitation and\nhygiene\nMay include:\n5.1 Good manufacturing practices (GMP) and sanitation\nstandard operating procedures (SSOP)\n5.2 Department of Health – Food Establishments – Code of\nSanitation of the Philippines (P.D.856) and NMIS\n5.3 Requirements set out by Bureau of Food and Drugs\n5.4 Workplace requirements\n\n--- PDF PAGE 65 ---\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 61\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Washed, trimmed and weighed carcass in accordance\nwith standard procedures, workplace and Occupational\nHealth and Safety Standards (OSHS) requirements\n1.2 Labelled carcass in accordance with workplace and\nregulatory requirements\n1.3 Cleaned facilities in accordance with workplace and\nenvironmental guidelines\n1.4 Personal Protective Equipment (PPE) is used according\nto OSHS\n1.5 Personal sanitation and hygiene is observed\n2. Resource implications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Tools and equipment/utensils and materials relevant to\nthe proposed activity and tasks\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation/Demonstration with Oral Questioning\n4. Context for assessment\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 66 ---\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 62"
