        "source_text": "500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is\naccessed from\nappropriate sources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium\nis used to transfer\ninformation and ideas\n1.4 Appropriate non-\nverbal communication\nis used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and\nfollowed\n1.6 Defined workplace\nprocedures for the\nlocation and storage\nof information are\nused\n1.7 Personal interaction\nis carried out clearly\nand concisely\n\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Sources of\ninformation\n• Types of question\n• Medium of\ncommunication\n• Flow of\ncommunication\n• Storage system\n• Telephone\ncourtesy\n\n• Following simple\nspoken language\n• Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n• Listening skills\n• Questioning skills\n• Workplace\nlanguage skills\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 3\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings\nare attended on\ntime\n2.2 Own opinions are\nclearly expressed\nand those of\nothers are listened\nto without\ninterruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose\nand established\nprotocols\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Questions about\nsimple routine\nworkplace\nprocedures and\nmatters\nconcerning\nworking conditions\nof employment are\nasked and\nresponded to\n2.6 Meetings\noutcomes are\ninterpreted and\nimplemented\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of\ncommunication\n• Workplace interactions\n• Non-verbal\ncommunication\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Interpersonal\ncommunication\nskill\n• Observing\nmeeting\nprotocols\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions\nof employment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used\nfor routine\ncalculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are\nidentified and\nproperly acted upon\n3.5 Reporting\nrequirements to\nsupervisor are\ncompleted according\nto organizational\nguidelines\n• Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n• Types of workplace\ndocuments and\nforms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n\n• Applying basic\nmathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n• Data recording\n• Report writing\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.