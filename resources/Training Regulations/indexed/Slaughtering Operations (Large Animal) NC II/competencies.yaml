- PDF PAGE 62 ---\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 58\nUNIT OF COMPETENCY\n:\nPERFORM FINAL PROCEDURES\nUNIT CODE\n\n:\nPFB751338\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required in\nwashing, trimming, weighing and labeling carcass. It also\nincludes cleaning the facilities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Wash, trim and\nweigh carcass\n1.1 Carcass is washed to\nremove foreign\nmatters and\ncontaminants from\nproduct in\naccordance with\nworkplace and OSHS\nrequirements\n1.2 Types and sources of\npotential\ncontamination and\ncross-contamination\nare identified\n1.3 Carcass are trimmed\nfollowing standard\nprocedures and\nOSHS\n1.4 Carcass are weighed\nand recorded\naccording to\nworkplace\nrequirements\n1.5 Personal Protective\nEquipment (PPE)\nare used according to\nwork instructions\n1.6 Personal sanitation\nand hygiene is\nobserved\n• ENGLISH/\nCOMMUNICATION\no Work instructions\n• ENVIRONMENTAL\nISSUES AND\nOTHER\nCONCERNS\no Occupational\nSafety and Health\nStandards\n(OSHS)\no Safe and hygienic\nuse of knife\no Hygienic standard\npractices\no Hand washing\ntechniques\no Waste water\nmanagement\n• SCIENCE\no Types and\nsources of\ncontamination\nand cross-\ncontamination\no Carcass washing\nprocedures\n• TECHNOLOGY\no Weighing scale\n•\nProper carcass\nwashing\n•\nTrimming of inedible\nparts\n•\nOperating weighing\nscale\n\n--- PDF PAGE 63 ---\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 59\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Label/Mark\ncarcass\n2.1 Markings are made or\nlabels are attached to\ncarcass according to\nworkplace and\nregulatory\nrequirements\n2.2 Personal Protective\nEquipment (PPE) is\nused according to\nwork instructions\n2.3 Pe