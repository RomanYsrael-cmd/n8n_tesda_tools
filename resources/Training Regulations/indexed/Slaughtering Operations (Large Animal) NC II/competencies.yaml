d through:\n3.1 A combination of direct observation and questioning of\na candidate processing foods.\n4. Context of assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 25\nUNIT OF COMPETENCY :\nUSE STANDARD MEASURING DEVICES AND\nINSTRUMENTS\n\nUNIT CODE\n:\nPFB751211\n\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required to use standard\nmeasuring devices, instruments in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify standard\nmeasuring\ndevices and\ninstruments\n1.1 Standard measuring\ndevices and\ninstruments are\nidentified according to\nmanufacturer’s\nspecifications\n1.2 Devices and\ninstruments for\nmeasuring are\nproperly checked,\nsanitized and\ncalibrated prior to use\n•\nSafe handling of\nmeasuring devices\nand instruments\n•\nSpecifications and\nfunctions of\nmeasuring devices\nand instruments\n•\nDefects and\nbreakages of\nmeasuring devices\nand instruments\n•\nProcedures in\nsanitizing and\ncalibrating and\nstowing equipment\nand instruments\n•\nCommunication\nskills\n•\nSanitary\nhandling of\ndevices and\ninstruments\n•\nCalibrating skills\n\n2. Review the\nprocedures in\nusing standard\nMeasuring\ndevices and\ninstruments\n\n2.1 Procedures in using\nthe standard\nmeasuring devices\nand instruments are\nrecalled according to\nmanufacturer’s\nspecifications\n2.2 Printed procedures/\nbrochures/\ncatalogues are\nconsulted according\nto specified food\nprocessing\nmethods\n•\nProcedures in using\ndifferent standard\nmeasuring devices\n•\nDifferent food\nprocessing methods\n\n•\nReading and\nfollowing printed\nmanuals and\nbrochures\n•\nUsing standard\nmeasuring\ndevices\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 26\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Follow\nprocedures of\nusing measuring\ndevices and\ninstruments\n3.1 Methods/practices of\nusing measuring\ndevices and\ninstruments are strictly\nobserved according to\nmanufacturer’s\nspecifications and\nworkplace\nrequirements\n3.2 Measuring devices\nand instruments are\ncleaned, wiped dry\nand stowed after use\nto ensure conformity\nwith workplace\nrequirements\n•\nMethods/practice of\nusing measuring\ndevices and\ninstruments\n•\nProcedures in\ncleaning, and\nstowing equipment\nand instruments\n•\nApplying\nmethods/practic\nes in using\nmeasuring\ndevices and\ninstruments\n•\nCleaning and\nstowing\nmeasuring\ndevices and\ninstruments\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Standard measuring\ndevices\nMay include:\n1.1 Weighing scales and balances of various capacities\nand sensitivities\n1.2 Measuring cups of varying capacities for dry\ningredients\n1.3 Measuring cups of varying capacities for liquid\ningredients\n2. Standard Measuring\nInstruments\nMay include:\n2.1 Salinometer\n2.2 Thermometers of varying temperature range (0-300 C)\n2.2.1 Refractometer of varying range (0 – 90 B)\n2.2.2 Glasswares like cylinders, beakers, flasks) of\nvarying graduations\n3. Food Processing\nMethods\nMay include:\n3.1 Process foods by Salting, Curing and Smoking\n3.2 Process foods by Fermentation and Pickling\n3.3 Process foods by Canning and Bottling\n3.4 Process foods by Sugar Concentration\n3.5 Process foods by Drying and Dehydration\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, prepared and calibrated standard\nmeasuring devices and instruments\n1.2 Followed correctly the procedures in using standard\nmeasuring devices and instruments\n1.3 Followed proper cleaning and sanitizing and stowing\nprocedures of measuring devices and equipment\nbefore and after use\n2. Resource implications\nThe following resources should be provided:\n2.1 Work area/station\n2.2 Materials, tools and equipment relevant to the Unit of\nCompetency\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation and questioning of a candidate using\nmeasuring devices and instruments\n4. Context of assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 28\nUNIT OF COMPETENCY\n:\nPERFORM MATHEMATICAL COMPUTATIONS\n\nUNIT CODE\n:\n\nPFB751213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude to perform\nmathematical computations in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Gather and\nTabulate the\nRecorded Data\n\n1.1 Records of weights\nand measurements\nof raw materials and\ningredients are\ngathered and\nsummarized\naccording to\nworkplace standard\noperating procedures\n1.2 Records of weights\nand measurements of\nfinished processed\nproducts are\ngathered and\nsummarized\naccording to\nworkplace standard\noperating procedures\n1.3 Summarized data are\ntabulated according\nto enterprise\nrequirements\n•\nData gathering\n•\nRecord keeping\n•\nData summary and\nanalysis\n•\nBasic Mathematical\nOperations\n•\nGathering data\n•\nKeeping of\nrecords\n•\nSummarizing\nand analyzing\ndata\n•\nBasic\nMathematical\nskills\n•\nBasic\nAccounting\nskills\n2. Review the\nVarious\nFormulations\n2.1 Raw materials and\ningredients and\npercentage\nformulations are\nchecked/counter\nchecked according to\napproved\nspecifications and\nenterprise\nrequirements\n2.2 Finished products\nand percentage\nformulations are\nreviewed according\nto approved\nspecifications and\nenterprise\nrequirements\n•\nPercentages and\nformulations of raw\nmaterials and\ningredient and\nfinished products\n•\nProcedures in\nchecking raw\nmaterials and\nfinished products\nformulation and\npercentages\n•\nBasic Mathematical\nOperations\n•\nChecking\npercentages\nformulations of\nraw materials\nand ingredient\n•\nReviewing\npercentages and\nformulations of\nfinished products\n•\nNumeracy skills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 29\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Calculate\nProduction Input\nand Output\n\n3.1 Data on raw material\nconsumption and\ncorresponding\npercentage\nequivalent are\ncalculated in line\nwith enterprise\nrequirements\n3.2 Data on actual\nspoilage and rejects\nand corresponding\npercentage\nequivalents are\ncalculated according\nto enterprise\nrequirements\n3.3 Data on actual yields\nand recoveries and\ncorresponding\npercentage\nequivalents are\ncalculated according\nto enterprise\nrequirements\n3.4 All calculated data\nare recorded\naccording to\nenterprise\nrequirements\n•\nRecord keeping\n•\nMensuration\n•\nFraction, ratios\nand proportions\n•\nBasic\nMathematical\nOperations\n•\nConversion\nfactors\n•\nPercentage\nformulation\n•\nBasic\nMathematical\nskills\n•\nRecording\nskills\n4. Compute\nProduction Cost\n\n4.1 Costs of production\nare computed\naccording to\norganization’s\nstandard procedures\n4.2 Computed costs of\nproduction are\nreviewed and\nvalidated according to\norganization’s\nproduction\nrequirements\n\n•\nCost of\nproduction\n•\nValidation\nprocedures for\ncomputer costs\n•\nBasic\nMathematical\nOperations\n•\nBasic\nMathematical\nskills\n•\nBasic\nAccounting\nskills\n•\nReviewing\nand validating\ncomputed\ncosts\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Weights and\nmeasurements\nMay include:\n1.1 Gravimetric\n1.2 Volumetric\n1.3 Lengths, diameters, widths\n1.4 Seam measurements\n1.5 Hotness/coldness ( temperature)\n1.6 Concentrations of solutions\n2. Costs of production\nMay include:\n2.1 Ingredient formulation\n2.2 Percentage formulation\n2.3 Conversion\n2.4 Ratios and proportion\n2.5 Spoilage and rejects and corresponding percentages\n2.6 Recoveries and yields and corresponding percentages\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Gathered the records of weights and measurements of\nraw materials/ingredients and finished processed\nproducts\n1.2 Summarized and tabulated all raw data gathered\n1.3 Calculated the production inputs and outputs\n1.4 Computed the costs of production\n1.5 Reviewed all formulations and concentrations of\nsolutions according to specifications and standards of\nthe enterprise\n2. Resource Implications\nThe following resources should be provided:\n2.1 Work area/station\n2.2 Materials relevant to recording and documentation of\nproduction data\n2.3 Computer with printer and software\n2.4 Calculator\n2.5\nWork table\n3. Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1 A combination of direct observation and questioning\nof a candidate computing costs of production\n3.2 Submission of a written report showing a record of\nproduction data including raw data\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 31\nUNIT OF COMPETENCY\n:\n\nIMPLEMENT GOOD MANUFACTURING PR