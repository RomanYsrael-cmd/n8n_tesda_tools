          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1\nLocated and followed workplace information relating\nto GMP responsibilities\n1.2\nMaintained personal hygiene consistent with GMP\n1.3\nFollowed workplace procedures when moving\naround the workplace and/or from one task to\nanother to maintain GMP\n1.4\nUsed, stored and disposed of appropriate\nclothing/footwear as required by work tasks and\nconsistent with GMP\n1.5\nIdentified and reported situations that do or could\ncompromise GMP\n1.6\nApplied appropriate control measures to control\ncontamination\n1.7\nRecorded results of monitoring, and maintain records\nas required by GMP\n1.8\nFollowed validation procedures within level of\nresponsibility\n1.9\nIdentified and responded to out-of-specification or\nunacceptable raw materials, packaging components,\nfinal or part processed product within level of\nresponsibility\n1.10 Followed procedures to isolate or quarantine non-\nconforming product\n1.11 Handled, cleaned and stored equipment, utensils,\nraw materials, packaging components and related\nitems according to GMP and workplace procedures\n1.12 Maintained GMP for own work\n1.13 Handled and/or disposed of out-of-specification or\ncontaminated materials, packaging\ncomponents/consumables and product, waste and\nrecyclable material according to GMP as required by\nwork responsibilities\n1.14 Maintained the work area in a clean and tidy state\n1.15 Identified and reported signs of pest infestation\n2. Resource Implication\nThe following resources should be provided:\n2.1\nWorkplace location and access to workplace policies\n2.2\nMaterials relevant to the proposed activity and tasks\n3. Methods of Assessment\nCompetency in this unit must be assessed using at\nleast two (2) of the following methods:\n3.1\nA combination of direct observation and oral\nquestioning\n3.2\nWritten report\n3.3\nWritten Examination\n3.4\nPortfolio\n4. Context of Assessment\n4.1\nCompetency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 37\n\nUNIT OF COMPETENCY :\nIMPLEMENT ENVIRONMENTAL POLICIES AND\nPROCEDURES\n\nUNIT CODE\n:"
