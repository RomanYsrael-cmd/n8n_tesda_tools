        "source_text": "500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Integrate\npersonal\nobjectives with\norganizational\ngoals\n1.1 Personal growth and\nwork plans are\npursued towards\nimproving the\nqualifications set for\nthe profession\n1.2 Intra- and\ninterpersonal\nrelationships are\nmaintained in the\ncourse of managing\noneself based on\nperformance\nevaluation\n1.3 Commitment to the\norganization and it’s\ngoal is demonstrated\nin the performance of\nduties\n•\nWork values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n•\nUnderstanding\npersonal objectives\n•\nUnderstanding\norganizational goals\n•\nDifference between\nintra and\ninterpersonal\nrelationship\n•\nPerformance\nevaluation\n\n•\nDemonstrating\nIntra and\nInterpersonal\nskills at work\n•\nDemonstrating\npersonal\ncommitment in\nwork\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 12\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Set and meet\nwork priorities\n2.1 Competing demands\nare prioritized to\nachieve personal,\nteam and\norganizational goals\nand objectives\n2.2 Resources are\nutilized efficiently and\neffectively to manage\nwork priorities and\ncommitments\n2.3 Practices along\neconomic use and\nmaintenance of\nequipment and\nfacilities are followed\nas per established\nprocedures\n•\nCompany policies\n•\nCompany\noperations,\nprocedures and\nstandards\n•\nTime management\n•\nBasic strategic\nplanning concepts\n•\nResource utilization\nand management\n\n•\nManaging goals\nand time\n•\nPracticing\neconomic use of\nresources and\nfacilities\n•\nSetting work\npriorities\n•\nPracticing time\nmanagement\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and\ncareer opportunities\nare identified and\navailed of based on\njob requirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as\nproof of career\nadvancement\n3.3 Licenses and/or\ncertifications\nrelevant to job and\ncareer are obtained\nand renewed\n•\nCareer development\nopportunities\n•\nCompany\nrecognition and\nincentives\n•\nInformation on\nrelevant licenses\nand or certifications\n•\nDetermining\npersonal career\ndevelopment\nneeds\n•\nIdentifying career\nopportunities\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\nMay include:\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\nMay include:\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\nMay include:\n3.1 Participation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\nMay include:\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\nMay include:\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 14\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which\nare based on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Resource implications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n4. Context for assessment\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 15\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\n\nUNIT CODE\n\n:"
