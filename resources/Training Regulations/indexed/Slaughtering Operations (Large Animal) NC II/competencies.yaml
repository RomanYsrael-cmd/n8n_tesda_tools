nvironmental\nrisks relates to immediate work responsibilities\n5.8.\nParticipating in improvement may involve participation in\nstructured improvement programs, one-off projects and\nday-to-day problem solving and consultative groups\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 41\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1 Accessed and apply workplace information on\nenvironmental policies and procedures relating to own\nwork\n1.2 Fitted and used appropriate personal protective clothing\nand equipment\n1.3 Checked own work area to identify environmental\nhazards\n1.4 Reported hazards according to workplace procedure in\na clear and timely manner\n1.5 Followed work procedures to control or minimize\nenvironmental risk. This may include monitoring\nparameters set for environmental aspects such as\nairborne particulate, noise, and water quality. It may also\ninclude demonstrating use of emergency equipment\naccording to work role requirements\n1.6 Recorded environmental information as required by the\nenvironmental management program\n1.7 Participated in processes to raise issues and\nsuggestions to improve environmental issues\nmanagement. This requires appropriate communication\nskills to structure and present information and interact\nwith others\n1.8 Followed procedures to collect, deposit, recycle and/or\ndispose of waste in own work area\n1.9 Followed procedures to respond to environmental\nemergencies such as spills and emissions. This may\ninclude following procedures to alert the appropriate\nemergency services\n1.10\nMaintained housekeeping standards in work area\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workplace location and access to workplace policies\n2.2 Materials relevant to the proposed activity and tasks\n3. Methods of Assessment\nCompetency in this unit must be assessed using at\nleast two (2) of the following methods:\n3.1 A combination of direct observation and oral questioning\n3.2 Written report\n3.3 Written Examination\n3.4 Portfolio\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 42\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nHANDLE AND SHARPEN KNIVES\n\nUNIT CODE\n:\nPFB751335\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to maintain\nknives for safe and effective use in slaughtering and meat\nestablishments.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Sharpen knives\n1.1 Knives are sharpened\naccording to\nworkplace\nrequirements\n1.2 Knives are sharpened\nto maintain a bevel\nedge\n1.3 Steel is used\ncorrectly to maintain\na bevel edge and to\nmeet Occupational\nSafety and Health\nStandards (OSHS)\n1.4 Personal\nProtective\nEquipment(PPE)\nare used according\nto OSHS\n\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no OSHS issues\nrelated to use and\nsharpening knives\no Sterilization and\nhygiene\nrequirements\nrelated to knife\nsharpening\n• SCIENCE\no Techniques in\nsharpening knives\no Steps in steeling\nknives\no Techniques in\nhandling knives\n• TECHNOLOGY\no Different types of\nknives and\nsharpening\nequipment\n•\nHandling and\nsharpening knife\n•\nPracticing OSHS\n2. Work safely with\nknives\n2.1 Knives are used in\nways which minimize\nthe risk of injury\n2.2 Knives are used\nsafely at all times in\naccordance to\nregulatory\nrequirements\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no OSHS issues\nrelated to using\nknives\n• SCIENCE\no Techniques in using\nknives\n1\n•\nUsing knife\n•\nPracticing OSHS\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Lar