          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Performed cradle process according to workplace\nrequirements and (OSHS)\n1.2 Performed complete flaying in accordance with workplace\nrequirements and (OSHS)\n1.3 Eviscerated carcass in accordance with work instructions and\nregulatory requirements\n1.4 Split and quartered carcass in accordance with work\ninstructions and (OSHS)\n1.5 Personal Protective Equipment (PPE) is used according to\nOSHS\n1.6 Personal sanitation and hygiene is observed\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Tools and equipment/utensils and materials relevant to the\nproposed activity and tasks\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation/Demonstration with Oral Questioning\n4. Context for\nassessment\n4.1\nCompetency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 62 ---\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 58\nUNIT OF COMPETENCY\n:\nPERFORM FINAL PROCEDURES\nUNIT CODE\n\n:"
