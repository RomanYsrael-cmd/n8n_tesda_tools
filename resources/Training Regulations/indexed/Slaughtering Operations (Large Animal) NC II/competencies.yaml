hold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Resource implications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OHS personal records\n2.3 PPE\n2.4 Health records\n3. Methods of assessment\nCompetency in this unit maybe assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n4. Context for assessment\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 21\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY FOOD SAFETY AND SANITATION\n\nUNIT CODE\n:\nPFB751210\n\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required to apply food safety\nand sanitation in the workplace\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Wear personal\nprotective\nequipment\n1.1 Personal protective\nequipment are\nchecked according to\nmanufacturer’s\nspecifications\n1.2 Personal protective\nequipment (PPE) are\nworn according to the\njob requirement\n•\nPersonal protective\nequipment (PPE)\n•\nProcedures in\nwearing in PPE\n•\nGood Food\nManufacturing\nPractices\n•\nParts and functions\nof personal\nprotective\nequipment\n•\nChecking PPE\n•\nPracticing GMP\n2. Observe\npersonal\nhygiene and\ngood grooming\n2.1 Personal hygiene\nand good grooming\nis practiced in line\nwith workplace\nhealth and safety\nrequirements\n•\nGood grooming and\npersonal hygiene\n•\nWorkplace health\nand safety\nrequirements\n•\nPracticing good\ngrooming and\npersonal\nhygiene\nprac