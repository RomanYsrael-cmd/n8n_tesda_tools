        "source_text": "PFB751214\n\nUNIT DESCRIPTOR\n:\n\nThis unit covers the knowledge, skills and attitudes required\n\nto comply with relevant Good Manufacturing Practice (GMP)\n\ncodes through the implementation of workplace GMP and\n\nquality procedures.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nrequirements of\nGMP related to\nown work\n1.1. Sources of\ninformation on GMP\nrequirements are\nlocated\n1.2. GMP requirements\nand responsibilities\nrelated to own work\nare identified\n•\nGMP Requirements\n•\nGMP Codes of\npractice, policies\nand procedures\n•\nGMP Role of internal\nand external\nauditors\n•\nContamination\nevents and\nperformance\nimprovement\nprocesses\nprocedures\n•\nPersonal clothing\nand footwear\nrequirements at\nwork areas\n•\nUse of personal\nclothing, storage and\ndisposal\nrequirements\n•\nMicro biological,\nphysical and\nchemical\ncontaminants\n•\nBasic concepts of\nquality assurance\n•\nControl methods and\nprocedures used in\nGMP:\n•\nGMP responsibilities\nand requirements\nrelating to work role\n•\nBasic properties,\nhandling and\nstorage\nrequirements of raw\nmaterials, packaging\ncomponents and\nfinal product\n•\nPlanning and\norganizing work\n(time\nmanagement\n•\nWorking with\nothers and in\nteams\n•\nPracticing GMP\n•\nFollowing\ncontamination\ninvestigation\nprocedures\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 32\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n•\nStandards for\nmaterials,\nequipment and\nutensils used in the\nwork area\n•\nRecall and\ntraceability\nprocedures relevant\nto work role\n•\nProcedures for\nidentifying or\nisolating materials\nor product of\nunacceptable\nquality\n•\nRecord keeping\nand the recording\nrequirements of\nGMP.\n