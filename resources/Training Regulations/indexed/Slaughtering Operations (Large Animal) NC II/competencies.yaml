        "source_text": "PFB751337\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required to\nprepare carcass of large animal.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform cradle\nprocess\n1.1 Materials, tools,\nequipment and\nPersonal Protective\nEquipment (PPE) are\nidentified according to\nwork instructions\n1.2 Animal is laid to cradle\nand shackle is\nremoved according to\nworkplace\nrequirements\n1.3 Rectum is tied and cut\naccording to workplace\ninstructions\n1.4 Tail is removed\naccording to workplace\ninstructions\n1.5 Hide is partially flayed\nlongitudinally\n1.6 If male, sex organ is\nremoved using knife\naccording to workplace\nrequirements\n1.7 Brisket is cut\nlongitudinally\n1.8 Esophagus is located\nand tied in accordance\nwith workplace\nrequirements\n1.9 Head and hocks (feet)\nare removed according\nto work instructions\n1.10 Sources of\ncontamination and\ncross-contamination\nare identified and\nminimized\n1.11 Occupational Safety\nand Health\nStandards (OSHS) is\nobserved in\naccordance with\nworkplace\nrequirements\n• ENGLISH/\nCOMMUNICATION\no Work instructions\n• ENVIRONMENTAL\nISSUES AND OTHER\nCONCERNS\no OSHS\nrequirements\no Safe and hygienic\nuse of knife\no Hygienic standard\npractices\no Hand washing\ntechniques\n• SCIENCE\no Anatomy relevant\nto different cradle\nprocesses\no Contamination and\ncross-\ncontamination\n• TECHNOLOGY\no Different types and\nuses of knives\n•\nPositioning of animal\n•\nApplying proper\nflaying techniques\n•\nRemoving sex organ\n•\nCutting brisket\n•\nLocating and tying\nesophagus\n•\nRemoving head and\nhocks\n\n--- PDF PAGE 57 ---\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 53\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform\ncomplete\nflaying\n2.1 Body of animal is\nhooked and lifted from\ncradle and transferred\nto next overhead rail\nusing hoist, hooks and\nspreader\n2.2 Hide is completely\nremoved using\nflaying knife without\ndamaging the hide\nand contaminating\nthe body of animal in\naccordance with\nOSHS requirements\n2.3 Personal Protective\nEquipment (PPE)\nare used according to\nOSH policies\n2.4 OSHS is observed\naccording to\nworkplace\nrequirements\n• ENGLISH/\nCOMMUNICATION\no Work instructions\nincluding\ncorrective action\nrequired in case of\ncontamination\n• ENVIRONMENTAL\nISSUES AND\nOTHER CONCERNS\no OSHS\nrequirements\no Safe and hygienic\nuse of knife\no Hygienic standard\npractices\no Hand washing\ntechniques\n• SCIENCE\no Animal anatomy\no Potential risks of\ncontamination and\ncross-\ncontamination of\nthe carcass and\nthe required steps\nfor corrective\naction\n• TECHNOLOGY\no Different types and\nuses of knives\n•\nHooking and lifting\ncarcass\n•\nApplying flaying\ntechniques\n\n--- PDF PAGE 58 ---\nTR-Slaughtering Operations (Large Animals) NC II (Amended) Promulgated March 2016 54\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Eviscerate\ncarcass\n3.1 Abdomen is opened\naccording to work\ninstructions\n3.2 Organs\nto be removed are\nidentified\n3.3 Sex organ is removed,\nif male\n3.4 Digestive tract and\npluck are removed\nwithout contaminating\nthe carcass in\naccordance with work\ninstructions\n3.5 Ring and tie bung is\nremoved\n3.6 Organs are presented\nfor inspection\naccording to\nregulatory\nrequirements\n3.7 OSHS are identified\nand complied with\n3.8 Sources of\ncontamination and\ncross-contamination\nare identified\n3.9 Corrective action is\ntaken in the event of\ncontamination in line\nwith workplace\nrequirements\n3.10 Personal hygiene\nand sanitation is\nobserved\n• ENGLISH/\nCOMMUNICATION\no Work instructions\nincluding\ncorrective action\nrequired in case of\ncontamination\n• ENVIRON