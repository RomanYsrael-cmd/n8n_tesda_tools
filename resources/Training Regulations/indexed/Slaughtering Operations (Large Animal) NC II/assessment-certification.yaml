ithout internal organs) consisting of meat, fats, bones and connective tissues. Carcass – the body of any slaughtered animal after bleeding and dressing. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No. 10536) 3. Contamination – means direct or indirect transmission of any biological or chemical agent, foreign matter or substances or not intentionally added to food that may compromise food safety or suitability. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No. 10536) 4. Disease or Defect – a pathological change or other abnormality. 5. Fit for Human Consumption – meat that has passed and appropriately marked by an inspector as safe and wholesome and in which no changes due to disease, decomposition or contamination has subsequently been found. 6. Fresh Meat – meat that has not yet been treated in any way other than by modified atmosphere packaging or vacuum packaging to ensure its preservation except that if it has been subjected only to refrigeration, it continues to be considered as fresh. 7. Food Animal – all domestic animals slaughtered for human consumption such as but not limited to cattle, carabaos, buffaloes, horses, sheep, goats, hogs, deer, rabbits, ostrich and poultry. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No. 10536) 8. Good Manufacturing Practice (GMP) – means the conformance with codes of practice, industry standards, regulations and laws concerning production, processing, handling, labeling and sale of foods decreed by industry, local, national and international bodies with the intention of protecting the public from illness, product adulteration and fraud. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No. 10536) 9. Hot meat – refers to carcass or parts of carcass of food animal which was slaughtered in an unregistered establishment and has not undergone the required inspection. Hot meat – the carcass or parts of carcass or food animals which were slaughtered from unregistered/unaccredited meat establishments and have not undergone the required inspection. It also includes undocumented, illegally shipped, and unregistered carcass, parts of carcass and meat products coming from other countries and those that are classified as hot meat by the National Meat --- PDF PAGE 98 --- TR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 94 Inspection Service (NMIS). (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No. 10536)"
