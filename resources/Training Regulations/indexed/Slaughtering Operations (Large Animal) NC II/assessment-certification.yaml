  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of SLAUGHTERING OPERATIONS (LARGE\nANIMALS) NC II, the candidate must demonstrate competence covering all the\nunits of competency listed in Section 1. Successful candidates shall be awarded\na National Certificate signed by the TESDA Director General.\n\n4.1.1. Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.1.3. Recognition of Prior Learning (RPL)/Recognition of Current Competencies (RCC).\nCandidates who have gained competencies through education, informal training,\nand work or life experiences may apply for recognition in a particular qualification\nthrough competency assessment.\n\n4.1.4. The following are qualified to apply for assessment :\n\n4.1.4.1. Graduating students/trainees of WTR-registered programs, graduates of\nNTR programs or graduates of formal/non-formal/informal including\nenterprise-based training programs related to Slaughtering Operations\n(Large Animals).\n\n4.1.4.2. Industry workers in the Slaughtering Operations (Large Animals).\n\n4.1.4.3. Holder of valid Slaughtering Operations NC II shall have to undergo the\nperformance assessment either in Slaughtering Operations (Swine) NC II\nor Slaughtering Operations (Large Animals) NC II.\n\n4.1.5. A candidate who fails the assessment for two (2) consecutive times shall be\nadvised to go through a refresher course before taking another assessment.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1\nSelf-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\n\n--- PDF PAGE 94 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 90\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n4.2.3.1 Qualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate (NTTC) Level I in\nSlaughtering Operations (Large Animals) NC II\n• Have at least three (3) years work experience in Slaughtering\nOperations (Swine and/or Large Animals)\n• Must have knowledge in anatomy of food animals\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\nFor Industry-Assessor\n• Holder of National Certificate in Slaughtering Operations (Large\nAnimals) NC II\n• Holder of Certificate of Competency (COC) in Conduct Competency\nAssessment under the Trainers Methodology Level I (TM I)\n• Have at least three (3) years’ work experience in Slaughtering Operations\n(Swine and/or Large Animals)\n• Have knowledge in anatomy of food animals\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\n--- PDF PAGE 95 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended)\n\n Promulgated March 2016 91\n\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nANNEX A\nCollect, analyze\nand organize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nt\nti\nUtilize specialized\ncommunication\nskills\nDevelop\nteams and\nindividuals\nApply problem-\nsolving\ntechniques in the\nworkplace\nUse\nmathematical\nconcepts and\nt\nh i\nUse relevant\ntechnologies\nLead small\nteams\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and safety\nprocedures\nLead\nworkplace\ncommunicatio\nParticipate in\nworkplace\ncommunicatio\nWork in a\nteam\nenvironment\nRoster staff\nControl and\norder stock\nPerform\ncomputer\nPerform\nworkplace and\nProvide\neffective\ncustomer\nDevelop and\nupdate\nindustry\nk\nl d\nObserve\nworkplace hygiene\nprocedures\nEstablish and\nconduct\nbusiness\nTrain small\ngroups\nConduct\nassessment\nManage\nworkplace\ndiversity\nManage\nfinances\nwithin a\nbudget\nManage quality\ncustomer\nservice\nApply food\nsafety and\nsanitation\nUse standard\nmeasuring devices /\ninstruments\nPerform\nmathematical\ncomputation\nImplement good\nmanufacturing\npractice\nprocedure\nImplement\nenvironmental\npolicies and\nprocedures\nUse food\nprocessing tools,\nequipment and\nutensils\nCOMPETENCY MAP – PROCESSED FOOD AND BEVERAGES SECTOR\nSLAUGHTERING OPERATIONS (LARGE ANIMALS) NC II\n\n--- PDF PAGE 96 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended)\n\n Promulgated March 2016 92\nOperate\ntechnology-\nbased\ninformation\nsystem\nProvide\ncustomers with\ninformation on\nanimals\nProvide\ngeneral\nanimal\ncare\nCORE\nCOMPETENCIES\n\nDevelop an\nevent concept\nDevelop event\nprogram\nSelect event\nvenue and site\nProvide porter\nservices\nPlan and\ndevelop event\nConduct night\naudit\nProvide club\nreception\nservices\nManage\ncontractors for\nindoor events\n\nDevelop and\nupdate\nknowledge on\nt\nl\nProvide on-site\nevent\nmanagement\nDevelop and\nupdate event\nindustry\n\nAccompany and\nguide visitors in\naccordance with\nReceive and\nprocess\nreservations\nOperate\ncomputerized\nreservations\nsystem\nIssue air sea\nland tickets and\nmulti-purpose\nResearch\ninformation\nrelevant to tour\nBook travel-\nrelated\nAdminister\nbilling and\nsettlement\nProvide\naccommodation\nreception\nManage\narrangements for\nvisitors\n\nProvide a site\nbriefing or\nscripted\ncommentary\nOperate a ride\nlocation\nLoad and\nunload a ride\nProvide on-site\ninformation and\nMonitor entry to\nvenue\nOperate a\ngames location\nMaintain\nsafety in\nwater-based\n Operate animal\nenclosure/\nexhibit\nPromote at a\ngames\nlocation\nRescue\nanimals\nPromote\ntourism\nproducts and\nservices\nProvide\nInformation and\nadvice on a\ndestination, product\nor service\nHandle\nand\nsharpen\nknives\n\nPrepare\ncarcass\nPerform initial\npreparation\nPerform final\nprocedures\n\n--- PDF PAGE 97 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 93\nGLOSSARY OF TERMS:\n\nFor the purpose of this competency standard, the following words are defined:\n\n1.\nAbattoir or slaughterhouse – premises that are approved and registered by the\ncontrolling authority in which food animals are slaughtered and dressed for human\nconsumption.\n\n2.\nCarcass – the body of a slaughtered animal (without internal organs) consisting of\nmeat, fats, bones and connective tissues.\n\nCarcass – the body of any slaughtered animal after bleeding and dressing.\n(Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No. 10536)\n\n3.\nContamination – means direct or indirect transmission of any biological or\nchemical agent, foreign matter or substances or not intentionally added to food that\nmay compromise food safety or suitability. (Source: Meat Inspection Code R.A. No.\n9296, as amended by R.A. No. 10536)\n\n4.\nDisease or Defect – a pathological change or other abnormality.\n\n5.\nFit for Human Consumption – meat that has passed and appropriately marked by\nan inspector as safe and wholesome and in which no changes due to disease,\ndecomposition or contamination has subsequently been found.\n\n6.\nFresh Meat – meat that has not yet been treated in any way other than by modified\natmosphere packaging or vacuum packaging to ensure its preservation except that\nif it has been subjected only to refrigeration, it continues to be considered as fresh.\n\n7.\nFood Animal – all domestic animals slaughtered for human consumption such as\nbut not limited to cattle, carabaos, buffaloes, horses, sheep, goats, hogs, deer,\nrabbits, ostrich and poultry. (Source: Meat Inspection Code R.A. No. 9296, as\namended by R.A. No. 10536)\n\n8.\nGood Manufacturing Practice (GMP) – means the conformance with codes of\npractice, industry standards, regulations and laws concerning production,\nprocessing, handling, labeling and sale of foods decreed by industry, local, national\nand international bodies with the intention of protecting the public from illness,\nproduct adulteration and fraud. (Source: Meat Inspection Code R.A. No. 9296, as\namended by R.A. No. 10536)\n\n9.\nHot meat – refers to carcass or parts of carcass of food animal which was\nslaughtered in an unregistered establishment and has not undergone the required\ninspection.\n\nHot meat – the carcass or parts of carcass or food animals which were\nslaughtered from unregistered/unaccredited meat establishments and have not\nundergone the required inspection. It also includes undocumented, illegally\nshipped, and unregistered carcass, parts of carcass and meat products coming\nfrom other countries and those that are classified as hot meat by the National Meat\n\n--- PDF PAGE 98 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 94\nInspection Service (NMIS). (Source: Meat Inspection Code R.A. No. 9296, as\namended by R.A. No. 10536)\n\n10. Inspected and Passed – a condition wherein the carcasses or parts of carcasses\nso marked have been inspected and found to be safe, wholesome and fit for human\nconsumption.\n\n11. Inspected and Condemned – a condition wherein the carcasses or parts of\ncarcasses so marked have been inspected and found to be unsafe, unwholesome\nand unfit for human consumption.\n\n12. Inspection – an act by an official inspector to ensure compliance with rules and\nregulations including but not limited to humane handling of slaughter animals, ante\nand post mortem inspection, quality assurance program, hygiene and sanitation\nprogram, good manufacturing program, sanitation standard operating procedures,\nhazard analysis critical control point program, residue control program on any meat\nand meat product, meat establishment facilities, transport vehicles and conveyance.\n\n13. Label – a display of written, printed or graphic matter upon the immediate container\n(not including package liners) of any article.\n\n14. Large Animal – refers to cattle/ox.\n\n15. Meat – refers to the fresh, chilled or frozen edible carcass including offal derived\nfrom food animals. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A.\nNo. 10536)\n\n16. Meat hygiene – all conditions and measures necessary to ensure the safety and\nsuitability of meat at all stages of the food chain.\n\n17. Meat Product – any food product which is exclusively or predominantly composed\nof meat.\n\nMeat Product – any product capable of use as human food which is made wholly\nor in part from any meat or other portion of the carcass of any food animals,\nexcepting products which contain meat or other portions of such carcasses only in\na relatively small proportion or historically have not been considered by consumers\nas products of the meat industry and which are exempted from definitions as a\nmeat product by the Secretary under such conditions as he may prescribed to\nassure that the meat or other portions of such carcasses contained in such\nproducts are not adulterated and that such products are not represented as meat\nproducts. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No.\n10536)\n\n18. National Meat Inspection Service (NMIS) – the sole national controlling /\ncompetent authority attached to the Department of Agriculture charged by the\ngovernment with the control of meat hygiene and meat inspection.\n\n--- PDF PAGE 99 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 95\n19. Pluck – refers to the internal organs (heart, liver, lungs, trachea and esophagus)\ntaken out from the chest cavity.\n\n20. Post Abattoir Control – shall mean control measures conducted on meat and meat\nproducts during transport up to the time of retail sale for the enforcement of\nregulations governing meat and meat product inspection.\n\n21. Processed - includes all methods of manufacture and preservation but does not\ninclude prepackaged fresh, chilled or frozen meat.\n\n22. Quality Assurance (QA) System – the organization structure, procedures,\nprocesses and resources needed to implement quality assurance.\n\n23. Rendering – means the process of converting condemned carcasses or parts of the\ncarcasses, meat or meat products into inedible by products by heating.\n\n24. Restraint - means the application to an animal of any procedure designed to restrict\nits movements. (Source: OIE Terrestrial Animal Health Code)\n\n25. Safe and wholesome – refers to meat and meat products that has been passed as\nfit for human consumption using the criteria that it a) will not cause food borne\ninfection or intoxication when properly handed and prepared with respect to the\nintended use, b) does not contain residue in excess of set limits, c) is free of obvious\ncontamination, d) is free of defects that are generally as objectionable to consumers,\ne) has been produced under adequate hygiene control, and f) has not been treated\nwith illegal substances as specified in this Act and in other related national\nlegislation. (Source: Meat Inspection Code R.A. No. 9296, as amended by R.A. No.\n10536)\n\n26. Traceability – the ability to track meat and meat products back to their source or to\nidentify the source of products so as to minimize liability and prevent the occurrence\nof food safety problems.\n\n27. Stunning - means any mechanical, electrical, chemical or other procedure which\ncauses immediate loss of consciousness; when used before slaughter,\nthe loss of consciousness lasts until death from the slaughter process in the\nabsence of slaughter, the procedure would allow the animal to recover\nconsciousness. (Source: OIE Terrestrial Animal Health Code)\n\n28. Unfit for human consumption – in relation to meat and meat products, means\ninspected and found not meeting the criteria of safety and wholesomeness.\n\n--- PDF PAGE 100 ---\nTR-Slaughtering Operations (Large Animal) NC II (Amended) Promulgated March 2016 96\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nEDGARDO DC. DIMALANTA, DVM\nPresident\nSlaughterhouse Operators Association of\nthe Philippines (SOAP)\nRAYMOND M. HERNANDEZ\nPresident/CEO - Industry Expert\nRSRH Livestock Corp.\nBalut, Tondo, Manila\nANGEL M. GUNO, DVM\nVeterinarian III\nBureau of Animal Industry\nAnimal Products Development Center\nValenzuela City\nEMELINA A. LOPEZ\nSupervising Science Research Specialist\nBureau of Animal Industry\nAnimal Products Development Center\nValenzuela City\nRENE RICARDO O. TAYAG\nTrainer-Expert\nMother Earth Products, Inc.\nMabalacat, Pampanga\nMA. ELAINE JOY C. VILLAREAL, DVM\nSupervising Meat Control Officer\nNational Meat Inspection Service (NMIS)\nVisayas Avenue, Diliman\nQuezon City\n\nThe PARTICIPANTS in the Validation of this Training Regulations\n•\ne-Synergy International, Inc.\n Imus, Cavite\n\n•\nMother Earth Products, Inc.\n Mabalacat, Pampanga\n•\nNational Meat Inspection Service (NMIS),\nQuezon City\n\n•\nParañaque Meat Processing & Slaughterhouse Corp.,\nParañaque City\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n-\nMa. Isabel G. Gamurot\n-\nHoward Mark N. Plete\n-\nEvangeline A. Cosep"
