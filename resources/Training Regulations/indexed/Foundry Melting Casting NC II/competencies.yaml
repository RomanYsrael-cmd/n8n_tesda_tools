        "source_text": "--- PDF PAGE 11 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC II                                                                                                                Promulgated   \n           \n9\nUNIT OF COMPETENCY:    PRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE                     :    500311107 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes in promoting \ncareer growth and advancement. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Integrate personal \nobjectives with \norganizational goals \n1.1 Personal growth and work plans are pursued towards \nimproving the qualifications set for the profession \n1.2 Intra- and interpersonal relationships is are maintained in the \ncourse of managing oneself based on performance \nevaluation \n1.3 Commitment to the organization and its goal is demonstrated \nin the performance of duties \n2. \nSet and meet work \npriorities \n2.1 Competing demands are prioritized to achieve personal, \nteam and organizational goals and objectives. \n2.2  Resources are utilized efficiently and effectively to manage \nwork priorities and commitments \n2.3  Practices along economic use and maintenance of \nequipment and facilities are followed  as per established \nprocedures \n3. \nMaintain \nprofessional growth \nand development \n3.1  Trainings and career opportunities are identified and \navailed of  based on job requirements \n3.2  Recognitions are  sought/received and demonstrated as \nproof of career advancement \n3.3  Licenses and/or certifications relevant to job and career \nare obtained and renewed\n\n--- PDF PAGE 12 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC II                                                                                                                Promulgated   \n           \n10\n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1  Performance Appraisal \n1.2  Psychological Profile \n1.3 Aptitude Tests \n2.  Resources \n2.1  Human \n2.2  Financial \n2.3  Technology \n2.3.1  Hardware \n2.3.2 Software \n3.  Trainings and career \nopportunities \n3.1 Participation in training programs \n      3.1.1 Technical \n      3.1.2  Supervisory \n      3.1.3  Managerial \n      3.1.4  Continuing Education \n3.2  Serving as Resource Persons in conferences and \nworkshops \n4.  Recognitions \n4.1  Recommendations \n4.2  Citations \n4.3  Certificate of Appreciations \n4.4  Commendations \n4.5  Awards \n4.6 Tangible and Intangible Rewards \n5.  Licenses and/or \ncertifications \n5.1  National Certificates \n5.2  Certificate of Competency \n5.3 Support Level Licenses \n5.4  Professional Licenses\n\n--- PDF PAGE 13 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MELTING/ CASTING NC II                                                                                                                Promulgated   \n           \n11\n     EVIDENCE GUIDE \n       \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Attained job targets within key result areas (KRAs) \n1.2 Maintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 Completed trainings and career opportunities which are \nbased on the requirements of the industries \n1.4 Acquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n2.  Underpinning \nknowledge \n2.1  Work values and ethics (Code of Conduct, Code of Ethics, \netc.) \n2.2  Company policies \n2.3  Company operations, procedures and standards  \n2.4  Fundamental rights at work including gender sensitivity \n2.5  Personal hygiene practices\n3.  Underpinning skills \n3.1  Appropriate practice of personal hygiene \n3.2  Intra and Interpersonal skills \n3.3  Communication skills\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace or assessment location \n4.2  Case studies/scenarios\n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 Portfolio Assessment \n5.2 Interview \n5.3 Simulation/Role-plays \n5.4 Observation \n5.5 Third Party Reports \n5.6 Exams and Tests\n6.  Context of \nassessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n",
