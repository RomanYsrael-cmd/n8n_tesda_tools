    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Foundry-Melting/Casting\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n90 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual the competencies that a person must achieve\nto be able to melt different kinds of metals, cast it using different operations and different\nfurnaces or heating systems and fuel. It also includes fettling and cleaning; ability to inspect,\nmeasure and interpret drawings; set up and operate variety of specialized furnaces; use\nappropriate measuring instrument in operating and maintaining the melting equipment and\nperform repair.\n\nThis course is also designed to provide basic and common skills to equip individual with\noperational skills in foundry-melting/casting.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\n meeting and discussion.\n•\nGroup discussion\n•\nInteraction\n\n•\nWritten test\n•\nPractical/perform\nance test\n•\nInterview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n•\nDiscussion\n•\nInteraction\n\n•\nObservation\n•\nSimulation\n•\nRole playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n•\nGroup Discussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC II Promulgated\n\n51\n4. Practice\noccupational\nhealth and\nsafety\n4.1Identify hazardous risks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in\nthe drawings &\nspecifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct observation\n• Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1. Select measuring\ninstrument and\n2.2 Carry out\nmeasurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral questioning\n• Direct observation\n\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed\nmanuals and interpret\ndata and specification\n4.2 Apply information\naccessed in manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance Learning\n\n• Written test\n• Direct observation\n• Project method\n• Interview\n5. Perform Shop\nMaintenance\n\n5.1 Inspect/clean tools and\nwork area\n5.2 Store/arrange tools and\nshop equipment\n5.3 Dispose wastes/used\nlubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Simulation\n• Written test\n• Direct observation\n• Demonstration\n• Interview\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC II Promulgated\n\n52\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Operate Melting\nFurnaces (Non\nElectric)\n1.1 Select materials\n2.2 Start up non- electric\nfurnace\n3.3 Charge non-electric\nfurnace\n4.4 Monitor non-electric\nfurnace\n5.5 Tap or unload the\nfurnace\n6.6 Shut down furnace\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n2. Operate Cupola\nMelting\nFurnaces\n2.1 Select materials\n2.2 Start up Cupola\nfurnace\n2.3 Charge Cupola\nfurnace’\n2.4 Monitor cupola\nfurnace\n2.5 Tap the furnace\n2.6 Shut down cupola\nfurnace\n2.7 Cool down cupola\nfurnace\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n3. Operate an\nElectric\nInduction\nMelting Furnace\n3.1 Furnace Select\nmaterials\n3.2 Start up Electric\nInduction Melting\n3.3 Charge Electric\nInduction Furnace\n3.4 Monitor furnace\n3.5 Tap and unload\nfurnace\n3.6 Shot down furnace\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n4. Fettle and Trim\nMetal Casting /\nForgings\n4.1 Determine job\nrequirements to fettle\nand trim metal\ncasting/forging\n4.2 Observe safety\nrequirements\n4.3 Identify excess\nmaterial for removal\n4.4 Select correct tools\nand equipment\n4.5 Remove excess\nmaterial\n4.6 Quality assess\ncastings/forgings\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC II Promulgated\n\n53\n\n5. Perform\nRefractory\nInstallation and\nRepair\n5.1 Inspect refractory\n5.2. Knock out refractory\n5.3. Prepare refractory\nmaterials\n5.4. Install refractor\n5.5. Cure refractory\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\nPortfolio\n6. Use and\nMaintain\nMeasuring\nInstruments\n6.1 Measure dimensions\nor variables using\nappropriate\ninstruments\n6.2 Maintain measuring\ninstruments\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC II Promulgated\n\n54"
