ls\n2.2 Start up non- electric\nfurnace\n3.3 Charge non-electric\nfurnace\n4.4 Monitor non-electric\nfurnace\n5.5 Tap or unload the\nfurnace\n6.6 Shut down furnace\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n2. Operate Cupola\nMelting\nFurnaces\n2.1 Select materials\n2.2 Start up Cupola\nfurnace\n2.3 Charge Cupola\nfurnace’\n2.4 Monitor cupola\nfurnace\n2.5 Tap the furnace\n2.6 Shut down cupola\nfurnace\n2.7 Cool down cupola\nfurnace\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n3. Operate an\nElectric\nInduction\nMelting Furnace\n3.1 Furnace Select\nmaterials\n3.2 Start up Electric\nInduction Melting\n3.3 Charge Electric\nInduction Furnace\n3.4 Monitor furnace\n3.5 Tap and unload\nfurnace\n3.6 Shot down furnace\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n4. Fettle and Trim\nMetal Casting /\nForgings\n4.1 Determine job\nrequirements to fettle\nand trim metal\ncasting/forging\n4.2 Observe safety\nrequirements\n4.3 Identify excess\nmaterial for removal\n4.4 Select correct tools\nand equipment\n4.5 Remove excess\nmaterial\n4.6 Quality assess\ncastings/forgings\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\nDemonstration of\npractical skills\n•\nInterview\n•\nPortfolio\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MELTING/ CASTING NC II Promulgated\n\n53\n\n5. Perform\nRefractory\nInstallation and\nRepair\n5.1 Inspect refractory\n5.2. Knock out refractory\n5.3. Prepare refractory\nmaterials\n5.4. Install refractor\n5.5. Cure refractory\n•\nLecture/\nDemonstration\n•\nDual training\n\n•\nObservation with\nQuestioning\n•\n