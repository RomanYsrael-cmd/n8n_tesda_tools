  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and\ncore units of competency required in SHIP’S CATERING SERVICES NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE\n:\n500311101\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\nattitudes required to receive, respond and act on\nverbal and written communication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine\nspoken messages\n1.1 Required information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2 Instructions/information are properly recorded\n1.3 Instructions are acted upon immediately in\naccordance with information received\n1.4 Clarification is sought from workplace supervisor\non all occasions when any instruction/information\nis not clear\n\n2. Perform workplace\nduties following\nwritten notices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in\nsequence\n2.3 Feedback is given to workplace supervisor based\non the instructions/information received\n\n--- PDF PAGE 5 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n 1.1 Handwritten and printed material\n 1.2 Internal memos\n 1.3 External communications\n 1.4 Electronic mail\n 1.5 Briefing notes\n 1.6 General correspondence\n 1.7 Marketing materials\n 1.8 Journal articles\n\n2. Organizational Guidelines\nIt may include:\n 2.1 Information documentation procedures\n 2.2 Company policies and procedures\n 2.3 Organization manuals\n 2.4 Service manual\n\n--- PDF PAGE 6 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of organizational\nprocedures for handling verbal and written\ncommunications\n1.2 Received and acted on verbal messages and\ninstructions\n1.3 Demonstrated competency in recording\ninstructions/information\n2.Underpinning\nknowledge\nand\nattitudes\n2.1 Knowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2 Ethical work practices in handling communications\n2.3 Communication process\n3. Underpinning skills\n3.1 Conciseness in receiving and clarifying\nmessages/information/communication\n3.2 Accuracy in recording messages/information\n4.Resource\nimplications\nThe following resources must be provided:\n4.1 Pens\n4.2 Note pads\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n6. Context for\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 7 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n5\nUNIT OF COMPETENCY :\nWORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit cover the skills, knowledge and attitudes\nrequired to develop workplace relationship and\ncontribute in workplace activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace\nrelationship\n1.1 Duties and responsibilities are done in a\npositive manner to promote cooperation and good\nrelationship\n1.2 Assistance is sought from workgroup when\ndifficulties arise and addressed through\ndiscussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to\nensure workgroup goals are met\n2.2 Constructive contributions to workgroup goals and\ntasks are made according to organizational\nrequirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 8 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements\nincluding OHS\n1.5 Code of conduct\n\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues\nand clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring\nservice delivery\n\n4. Providing support\nto team\nmembers\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 9 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n7\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Provided support to team members to ensure\ngoals are met\n1.2 Acted on feedback from clients and colleagues\n1.4 Accessed learning opportunities to extend own\npersonal work competencies to enhance team\ngoals and outcomes\n2. Underpinning\nKnowledge\n2.1 The relevant legislation that affects operations,\nespecially with regards to safety\n2.2 Reasons why cooperation and good\nrelationships are important\n2.3 Knowledge of the organization’s policies, plans\nand procedures\n2.4 Understanding how to elicit and interpret\nfeedback\n2.5 Knowledge of workgroup member’s\nresponsibilities and duties\n2.6 Importance of demonstrating respect and\nempathy in dealings with colleagues\n2.7 Understanding of how to identify and prioritize\npersonal development opportunities and\noptions\n3. Underpinning Skills\n3.1 Ability to read and understand the\norganization’s policies and work procedures\n3.2 Write simple instructions for particular routine\ntasks\n3.3 Interpret information gained from\ncorrespondence\n3.4 Communication skills to request advice, receive\nfeedback and work with a team\n3.5 Planning skills to organized work priorities and\narrangement\n3.6 Technology skills including the ability to select\nand use technology appropriate to a task\n3.7 Ability to relate to people from a range of\nsocial, cultural and ethnic backgrounds.\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2 Materials relevant to the proposed activity or\ntask\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observations of work activities of the\nindividual member in relation to the work\nactivities of the group\n5.2 Observation of simulation and/or role play\ninvolving the participation of individual member\nto the attainment of organizational goal\n5.3 Case studies and scenarios as a basis for\ndiscussion of issues and strategies\n6. Context for\nAssessment\n6.1 Competency assessment may occur in\nworkplace or any appropriately simulated\nenvironment\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in\ngroup\n\n--- PDF PAGE 10 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n8\nUNIT OF COMPETENCY :\nDEMONSTRATE WORK VALUES\n\nUNIT CODE\n:\n500311103\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and\nattitude in demonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\nof work\n\n1.1 One’s unique sense of purpose for working and\nthe why’s of work are identified, reflected on and\nclearly defined for one’s development as a person\nand as a member of society.\n1.2 Personal mission is in harmony with company’s\nvalues\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent\ncompany ethical standards, policies and\nguidelines.\n2.2 Work practices are undertaken in compliance\nwith industry work ethical standards,\norganizational policy and guidelines\n2.3 Personal behavior and relationships with co-\nworkers and/or clients are conducted in\naccordance with ethical standards, policy and\nguidelines.\n2.4 Company resources are used in accordance\nwith transparent company ethical standard,\npolicies and guidelines.\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy\nand guidelines on the prevention and reporting of\nunethical conduct are accessed and applied in\naccordance with transparent company ethical\nstandard, policies and guidelines.\n3.2 Work incidents/situations are reported and/or\nresolved in accordance with company\nprotocol/guidelines.\n3.3 Resolution and/or referral of ethical problems\nidentified are used as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are\ndemonstrated consistently with acceptable ethical\nconduct and company’s core values.\n4.2 Instructions to co-workers are provided based on\nethical, lawful and reasonable directives.\n4.3 Company values/practices are shared with co-\nworkers using appropriate behavior and\nlanguage.\n\n--- PDF PAGE 11 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work values/ethics/\nconcepts\nMay include but are not limited to:\n1.1 Commitment/ Dedication\n1.2 Sense of urgency\n1.3 Sense of purpose\n1.4 Love for work\n1.5 High motivation\n1.6 Orderliness\n1.7 Reliability\n1.8 Competence\n1.9 Dependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n4. Company resources\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n5. Instructions\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 12 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n10\nEVIDENCE GUIDE\n\n1. Critical Aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3 Demonstrated work practices satisfactorily and\nconsistently in compliance with industry work ethical\nstandards, organizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships\nwith co-workers and/or clients consistent with ethical\nstandards, policy and guidelines\n1.5 Used company resources in accordance with\ncompany ethical standard, policies and guidelines.\n 1.6 Followed company ethical standards, organizational\npolicy and guidelines on the prevention and reporting\nof unethical conduct/behavior\n2. Underpinning\nKnowledge\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender\nsensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n3. Underpinning\nSkills\n3.1 Interpersonal skills\n3.2 Communication skills\n3.3 Self awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Third Party Reports\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 13 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n11\nUNIT OF COMPETENCY :\nPRACTICE HOUSEKEEPING PROCEDURES\n\nUNIT CODE\n:\n500311104\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\nattitudes\nrequired\nto\napply\nthe\nbasic\nhousekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\nunnecessary items\nReusable, recyclable materials are sorted in accordance\nwith company/office procedures\n1.2 Unnecessary items are removed and disposed of\nin accordance with company or office procedures\n2. Arrange items\n2.1 Items are arranged in accordance with\ncompany/office housekeeping procedures\n2.2 Work area is arranged according to job\nrequirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible\nidentification marks based on procedure\n2.5 Safety equipment and evacuation passages are kept\nclear and accessible based on instructions\n3. Maintain work area,\ntools and equipment\n3.1 Cleanliness and orderliness of work area is\nmaintained in accordance with company/office\nprocedures\n3.2 Tools and equipment are cleaned in accordance\nwith manufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and\nequipment in accordance with manufacturer’s\ninstruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized\nwork process and\nprocedures\n4.1 Materials for common use are maintained in\ndesignated area based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\ncomplied with\n5.3 Work is performed in accordance with occupational\nhealth and safety (OHS) requirements\n\n--- PDF PAGE 14 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\nrelated to work activity\n1.4 Waste materials\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n3. Decorum\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 15 ---\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Practiced the basic procedures of 5S\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning\nSkills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary\nfor the activity\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Third party report\n5.2 Interview\n5.3 Demonstration with questioning\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nOBSERVE PERSONAL HYGIENE\n\nUNIT CODE\n:\nMTM512208\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nin observing personal hygiene.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Practice personal\nhygiene and\ngrooming.\n\n1.1\nPersonal hygiene is practiced to comply with the\nrequirements of the ship’s food safety program\n1.2\nAppropriate uniform is worn as required by\nship’s food safety program\n1.3\nWearing of make-up, lipstick, nail polish, jewelry\n(except plain wedding band) is avoided\n2. Comply with food\nhandling safety\npractices\n\n2.1\nHand washing is practiced using prescribed\nprocedure\n2.2\nDisposable gloves is used in handling ready to eat\nfood\n2.3\nCuts and sores are covered with clean water-\nproof dressing.\n2.4\nHealth condition and/or illness is reported\naccording to the ship’s policy and procedures\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n15\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Personal hygiene\nMay include:\n1.1 Taking a bath daily\n1.2 Brushing teeth daily\n1.3 Trimming of hair and fingernails\n2. Appropriate uniform\nMay include:\n2.1 Clean company issued uniform\n2.2 Hairnet or toque\n2.3 Non-skid shoes\n2.4 Black socks\n3. Hand washing\nMay include:\nHand washing is practiced using:\n3.1 Hand washing sink\n3.2 Liquid detergent dispenser\n3.3 Nail Brush\n3.4 Paper towel\n3.5 Air dryer\n3.6 Hand sanitizer\n\n4. Health condition or\nillness\nMay include:\nFood poisoning symptoms:\n4.1 Sore throat\n4.2 Fever\n4.3 Diarrhea\n4.4 Vomiting\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n16\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 practiced personal hygiene and grooming.\n1.2 complied with food handling safety practices.\n2. Required Knowledge 2.1 Hand washing procedure\n2.2 Health condition and/or illness\n2.2.1 Food poisoning symptoms\n2.3 Personal grooming and hygiene\n2.4 Reporting procedures\n2.5 Safety and health conscious\n3. Required Skills\n3.1 Using hand washing tools and supplies\n3.2 Communication skills\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 ventilated and illuminated work place with\nfacilities appropriate to the activity\n4.2 tools and materials/supplies\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 demonstration and oral questioning of related\nunderpinning knowledge\n5.2 portfolio\n6. Context of\nAssessment\n6.1 Competency may be assessed in workplace or\nin a simulated workplace setting\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in-\ngroup\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n17\nUNIT OF COMPETENCY :\nPRACTICE FOOD SAFETY, SANITATION AND\nHYGIENE\n\nUNIT CODE\n:\nMTM512209\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\nattitudes in food safety, sanitation and hygiene,\nfood storage and cleaning procedure.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Practice food safety\nsanitation\n1.1 Sources of food contaminants are identified.\n1.2 Awareness of food safety practices to food\ncontact surfaces is observed to prevent cross\ncontamination.\n1.3 Potentially hazardous foods are determined and\nappropriate measures are undertaken to prevent\nits consumption.\n1.4 Cleaning and sanitizing tools and agents is\nmaintained in accordance with ship’s\nprocedure.\n1.5 Awareness of serving food at recommended\ntemperature is practiced.\n2. Store food\n2.1 Approved methods of refrigeration of food are\ncomplied with.\n2.2 Dry storage of food is practiced according to\ninstructions and procedures.\n2.3 Food is covered and labeled prior to storage in\naccordance with ship’s procedure.\n3. Practice cleaning\nprocedure\n3.1 Appropriate cleaning and sanitizing tools and\nagents are identified and handled based on\ncleaning requirements and manufacturer’s\ninstructions.\n3.2 Cleaning and sanitizing is performed according\nto procedure.\n4. Report pest\ninfestation\n4.1 Sign of pest infestation is identified and reported\nto concerned personnel.\n4.2 Measures to prevent pests entering food\npremises are applied.\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n18\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Sources of food\ncontaminants\nMay include:\n1.1 People\n1.2 Insect\n1.3 Rodent\n1.4 Waste food\n1.5 Refuse\n2. Food safety practices\nMay include:\n2.1 Identification of potentially hazardous foods.\n2.2 Food storage procedures\n2.3 Monitoring of recommended storage\ntemperature\n3. Cleaning and sanitizing\ntools and agents is\nmaintained\nMay include:\n3.1 Follow procedure in cleaning and sanitizing.\n3.2 Follow manufacturer’s instructions in using\ncleaning and sanitizing chemicals.\n3.3 Cover foods while cleaning is in progress.\n3.4 Practice using the three bucket system/three\nsink compartment.\n4. Serving food at\nrecommended\ntemperature\nMay include:\n4.1 Specific internal temperature of food items.\n4.2 Range of temperature danger zone.\n4.3 Temperature of holding equipment.\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n19\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 identified sources of food contaminants and\napplied procedures to control contamination.\n1.2 practiced wet and dry storage of food.\n1.3 used appropriate cleaning and sanitizing agents.\n1.4 identified and reported signs of pest infestation.\n1.5 applied measures to prevent pest infestation.\n2. Required Knowledge\n2.1 Chemical, biological and physical hazards.\n2.2 Six favorable conditions that support bacterial\ngrowth [Food Acid Time Temperature Oxygen\nMoisture.(FATTOM)]\n2.3 Methods in preventing food borne, illness/cross\ncontamination.\n2.4 Food refrigeration and dry storage method.\n2.5 Cleaning methods based on international\nstandards.\n2.6 Cleaning and sanitizing agents.\n2.7 Signs of pest infestation and access.\n3. Required Skills\n3.1 Communication skills\n3.2 Handling cleaning and sanitizing tools and\nagents.\n3.3 Operating food storage equipment\n4. Resource Implications\nThe following resources should be provided:\n4.1 ventilated and illuminated work place with\nfacilities appropriate to the activity\n4.2 tools and materials\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through :\n5.1 demonstration and oral questioning of related\nunderpinning knowledge\n5.2 portfolio\n6. Context of Assessment 6.1 Competency may be assessed in workplace or\nin a simulated workplace setting\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in-\ngroup\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n20\nUNIT OF COMPETENCY :\nOBSERVE CATERING HEALTH AND SAFETY\nPRACTICES\n\nUNIT CODE\n:\nMTM512210\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and\nattitudes required to observe catering health and\nsafety practices.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Handle catering\nequipment.\n1.1 Catering equipment are cleaned and sanitized\nand dried in accordance with ship’s standards.\n1.2 Catering equipment is tested for functionality and\nbreakage, malfunction or defects are reported in\naccordance with ship’s standards and/or\nmanufacturer’s instructions.\n1.3 Catering equipment are stowed in accordance\nwith ship’s standards and/or manufacturer’s\ninstructions.\n2. Prevent common\naccident in the work\nplace.\n2.1 Common causes of accident/s in the galley are\nidentified and preventive measures are\ndiscussed and undertaken.\n2.2 In case of fire in the galley, recommended fire\nextinguisher is used .\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n21\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Catering equipment.\nMay include:\n1.1 Oven/ Microwave\n1.2 Hot Plate\n1.3 Griller\n1.4 Griddle\n1.5 Deep fryer\n1.6 Rice Cooker\n1.7 Pots and Pans\n1.8 Utensils\n1.9 Knives\n2. Accidents\nMay include:\n2.1 Slips and falls\n2.2 Cuts\n2.3 Burns\n2.4 Electrocution\n2.5 Fire\n2.6 Explosion\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n22\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate :\n1.1 identified basic tools and equipment in the\ngalley.\n1.2 demonstrated proper cleaning and stowage\nof tools and equipment.\n1.3 practiced proper monitoring and reporting of\nbreakages, malfunctions and repairs.\n1.4 identified common causes of accidents and\npreventions.\n2. Required Knowledge\n2.1 Catering tools and equipment\n2.2 Procedure/s in cleaning and stowage of\ncatering tools and equipment\n2.3 Catering tools and equipment breakage,\nmalfunction, defect and repair\n2.4 Common causes of accidents in the galley\n2.5 Different types of fire extinguisher and its\nuses.\n2.6 Fire blanket\n3. Required Skills\n3.1 Handling galley tools and equipment\n3.2 Communication skills\n3.3 Using fire extinguishers and fire blanket\n4. Resource Implications\nThe following resources should be provided:\n4.1 ventilated and illuminated work place with\nfacilities appropriate to the activity\n4.2 tools and equipment appropriate to\nscheduled galleys tasks and to monitor and\nmaintain working condition\n4.3 material relevant to the proposed activity\nand tasks\n5. Methods of Assessment\nCompetency in this unit must be assessed\nthrough :\n5.1 demonstration and oral questioning of\nrelated underpinning knowledge\n 5.2 portfolio\n6. Context of Assessment\n 6.1 Competency may be assessed in workplace\nor in a simulated workplace setting\n 6.2 Assessment shall be observed while task\nare being undertaken whether individually or\nin-group\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n23\nUNIT OF COMPETENCY :\nPROTECT MARINE ENVIRONMENT/ WASTE\nSEGREGATION MANAGEMENT\n\nUNIT CODE\n:\nMTM512211\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and\nattitude required to perform waste segregation.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Segregate waste\n1.1 Waste is identified and sorted based on relevant\nregulations.\n1.2 Sorted waste is segregated and placed in\ndesignated bins/containers in accordance with\nrelevant MARPOL regulations and procedures.\n1.3 Task is performed using the recommended\nPersonal protective equipment (PPE)\n2. Package waste\n2.1 Waste are sealed and packaged in accordance\nwith MARPOL Annex V\n2.2 Waste are labeled and placed in a location\ndesignated for the purpose\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Waste\nMay include:\n1.1 Biodegradable waste\n1.2 Non-biodegradable waste and\n1.3 Hazardous waste\n2. Personal protective\nequipment (PPE)\nMay include:\n2.1 Non-skid safety shoes\n2.2 Face mask\n2.3 Disposable gloves\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n24\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate :\n1.1 performed waste segregation procedures.\n1.2 complied with relevant regulations.\n2. Required Knowledge\n2.1 Types of garbage\n2.2 Types of labeled waste bins\n2,3 Relevant regulations (MARPOL, etc…)\n2.4 Waste segregation procedures\n2.5 Personal protective equipment (PPE)\n3. Required Skills\n3.1 Communication skills.\n3.2 Using waste paper bag/plastic liner\n3.3 Handling waste\n4. Resource Implications\nThe following resources should be provided:\n4.1 ventilated and illuminated work place with\nfacilities appropriate to the activity\n4.2 tools and equipment appropriate to\nscheduled galleys tasks and to monitor and\nmaintain working condition\n4.3 material relevant to the proposed activity and\ntasks\n5. Methods of Assessment\nCompetency in this unit must be assessed\nthrough :\n5.1 demonstration and oral questioning of\nrelated underpinning knowledge\n5.2 portfolio\n6. Context of Assessment\n6.1 Competency may be assessed in workplace\nor in a simulated workplace setting\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in-\ngroup\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n25\nUNIT OF COMPETENCY :\nWORK WITHIN MULTI-CULTURAL AND\nRELIGIOUS ENVIRONMENT\n\nUNIT CODE\n:\nMTM512212\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and\nattitudes required to maintain a harmonious and\neffective working environment in a multi-national\ncrew.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Recognize cultural and\nreligious diversity\namong crew\n1.1 Specific religious practices in terms of food\npreferences, prayer time and personal hygiene/\nclothing are recognized and adhered to\n1.2 Food preferences are identified and noted in\naccordance with crew’s cultural, religious\npractices and beliefs\n2. Demonstrate sensitivity\nto specific cultures and\npractices\n2.1 Verbal and non-verbal indecent language are\nknown and avoided in accordance with crew’s\ncultural, religious practices and beliefs.\n2.2 Respect for cultural and religious diversity is\nshown in communication and interaction with\nthe ship’s crew\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Specific religious\npractices\nMay include:\n1.1 Food preferences\n1.2 Prayer time and\n1.3 Personal hygiene/ clothing\n2. Communication\n\nMay include:\n2.1 Verbal\n2.2 Written\n2.3 Gestures and facial and body expressions\n2.4 Posture\n2.5 Sign language\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n26\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate :\n1.1. recognized cultural and religious diversity\namong crew.\n1.2 performed tasks considering the crew’s\nreligious and cultural practices.\n2. Required Knowledge\n2.1 Cultural and religious diversity of different\nnationalities\n2.2 Food preferences of different culture and\nreligion\n2.3 Professionalism in the workplace\n3. Required Skills\n3.1 Communication skills\n3.2 Interpersonal skills\n4. Resource Implications\nThe following resources should be provided:\n4.1 ventilated and illuminated work place with\nfacilities appropriate to the activity\n4.2 tools and equipment appropriate to\nscheduled galleys tasks and to monitor and\nmaintain working condition\n4.3 material relevant to the proposed activity and\ntasks\n5. Methods of Assessment\n Competency in this unit must be assessed\nthrough :\n5.1 demonstration and oral questioning of\nrelated underpinning knowledge\n5.2 portfolio\n6. Context of Assessment\n6.1 Competency may be assessed in workplace\nor in a simulated workplace setting\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in-\ngroup\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n27\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM MESS HALL SERVICE\n\nUNIT CODE\n:\nMTM512313\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and\nattitudes in performing mess hall services. It\nincludes setting up tables, serving food, clearing\nthe table, washing used table ware, disposing\ngarbage and preparing the pantry area.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Set up table\n1.1 Tableware is set-up according to ship’s table\nsetting standards.\n1.2 Tables and chairs are cleaned and checked for\ndamages and functionality\n1.3 Condiments are set up in according to ship’s table\nsetting standards\n2\nServe food\n2.1 Officers and/or visitors are greeted and assisted in\nsitting\n2.2 Prepared food are checked for completeness and\ncorrectness before serving\n2.3 Prepared food are served according to ship’s\nservice standard\n2.4 Officers/visitors needs are checked from time to\ntime until they moved out\n2.5 Hot holding food equipment are monitored during\nservice time\n3\nClear table\n3.1 Unused/Soiled plates/ flat wares are bussed out\n3.2 Condiments / shakers are removed from the tables\nand returned to designated storage\n3.3\n Tables and chairs are cleaned according ship’s\nstandard\n4\nWash used table\nware and dispose\nwaste\n4.1 Table ware are scraped, sorted and stocked\n4.2 Table ware are cleaned and dried according to\nship’s sanitation standards\n4.3 Cleaned table ware are secured in designated\nstorage area\n4.4 Waste are disposed according to relevant\nregulations MARPOL requirements\n5\nPrepare pantry\narea for service\n5.1 Pantry area is cleaned all the time as per ship’s\nsanitation standards\n5.2 Availability of beverages, condiments and table\nware in the pantry area is monitored daily\n5.3 Pantry equipment are used properly in accordance\nwith manufacturer’s instruction or manual.\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n28\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Table ware\nMay include:\n1.1 Plates\n1.1.1 Dinner Plate - 10 in. diameter\n1.1.2 Fish/Luncheon Plate - 8 in. diameter\n1.1.3 Dessert/Salad Plate - 7 in. diameter\n1.1.4 Cereal plate/ bowl - 5 in. diameter\n1.1.5 Side plate or bread plate – 6 in. diameter\n1.1.6 Soup plate\n1.1.7 Oval plate\n1.2 Cup & Saucer\n1.2.1 Soup/bouillon cup / sauce – 8 –10 oz.\n1.2.2 Teacup/ coffee cup & saucer - 6 2/3 oz\n1.2.3 Tea pot - ½ pt ; 1 pt. 1 ½ pt ; 2 pt\n1.2.4 Fork & spoon\n1.2.4.1 Dinner fork & spoon\n1.2.4.2 Service fork & spoon\n1.2.4.3 Teaspoon\n1.2.4.4 Soup spoon\n1.2.4.5 Dessert/Salad fork\n1.2.4.6 Sauce ladle\n1.2.4.7 Soup ladle\n1.2.5 Knife\n1.2.5.1 Bread and butter knife\n1.2.5.2 Dinner knife\n1.2.5.3 Steak knife\n1.2.6 Glass and pitcher\n1.2.6.1 Water gobblet\n1.2.6.2 High ball\n1.2.6.3 Red/white wine glass\n1.2.6.4 Water Pitcher\n1.3 Japanese table ware\n1.3.1 Tray\n1.3.2 Rice bowl\n1.3.3 Soup bowl\n1.3.4 Pickle dish\n1.3.5 Soy dish\n1.3.6 Teacup\n1.3.7 “Shoki” (chopstick rest)\n1.3.8 Chopsticks\n1.3.9 Ramen bowl\n1.3.10 “Donburi” bowl\n1.3.11 Main dish\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n29\n\nVARIABLES\nRANGE\n2. Condiment\nMay include:\n2.1 Ketchup\n2.2 Hot sauce\n2.3 Worcestershire\n2.4 Salad dressing\n2.5 Spreads\n2.6 Mustard\n2.7 Olive oil and vinegar\n2.8 Salt and pepper\n2.9 Japanese condiment\n2.9.1 Soy sauce\n2.9.2 Tonkatsu sauce\n2.9.3 Japanese pepper\n2.9.3 Japanese mayonnaise\n2.9.4 Wasabi\n3. Hot holding food\nequipment\nMay include:\n3.1 Rice cooker\n3.2 Soup warmer\n3.3 Food warmer\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n30\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n3.1 demonstrated proper handling and care of tools\nand equipment.\n3.2 complied with occupational and safety\npractices.\n3.3 set-up and cleared the tables.\n3.4 served food.\n3.5 identified faults and problems and the\nnecessary corrective action.\n3.6 prepared pantry area for service.\n2. Required\nKnowledge\n\n2.1 Types and uses of table ware\n2.2 Types and uses of condiments\n2.3 Handling of garbage/waste\n2.4 Handling of hot holding food equipment\n2.5 Types of food service\n2.6 MARPOL and relevant regulations\n2.7 Safety practices\n2.7.1 Practice hygienic preparation and\nteamwork to colleagues\n2.7.2 Food safety hazard\n2.7.3 Providing safe food\n2.8 Familiarity with food and beverage combination\n3. Required Skills\n\n3.1 Effective communication skills\n3.2 Application of food service\n3.3 Application of cleaning skills\n3.4 Operating hot holding food equipment\n3.5 Care in handling breakable items\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1 access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2 tools, equipment and materials/supplies\nrelevant to the activity or task\n5. Methods of\nAssessment\n\n Competency in this unit must be assessed through :\n5.1 demonstration\nand\nquestioning\nof\nrelated\nunderpinning knowledge\n5.2 written Examination\n5.3 portfolio\n6 Context of\nAssessment\n\n6.1 Competency may be assessed in workplace or in\nsimulated workplace setting (accredited\nassessment centers)\n6.2 Assessment shall be observed while tasks are\nbeing undertaken either individually or as a team\nunder limited supervision\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n31\nUNIT OF COMPETENCY :\nPERFORM HOUSEKEEPING SERVICES\n\nUNIT CODE\n:\nMTM512314\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and\nattitudes in performing housekeeping service.\nIt includes performing cabin service, cleaning\nassigned areas, handling and disposal of\ngarbage, laundering linen/special laundry\nitems and storing of cleaning materials and\nequipment.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform cabin\nservices\n\n1.1 Linens and towels are changed as per ship’s\nstandard\n1.2 Headboard, furniture, appliances and port holes\nare dusted as per ship’s standard practice\n1.3 Glasses, coffee cups, ash trays and utensils are\ncleaned, dried and stored\n1.4 Cabin and toilets are cleaned as per ship’s\nstandard procedures\n1.5 Vacuum cleaning is performed on all carpeted\nareas in the cabin\n1.6 Bed setting is performed as per ship’s standard\n1.7 Cabin and toilet amenities are replenished as\nper ship’s standard\n1.8 Garbage are collected and disposed as per\ngarbage disposal regulations\n1.9 Soiled linens and towels are collected and sorted\naccordingly and readied for laundry\n1.10 Furniture, appliances, light, and air vents are\nchecked for defects and reported to concerned\npersonnel\n2. Clean asssigned\nareas\n2.1 Appropriate cleaning materials and equipment\nare prepared as per ship’s cleaning procedures\n2.2 Assigned areas and its contents are cleaned\nusing appropriate cleaning equipment\n2.3 Stripping and waxing of deck is applied according\nto ship’s schedule\n2.4 Air ducts, lights, walls and ceilings are cleaned as\nper cleaning schedule\n2.5 Cleaning equipment are cleaned after use as per\nmanufacturers’ instruction\n2.6 Toilet amenities are replenished as per ship’s\nstandard\n2.7 Safety signages are placed in the areas to be\ncleaned\n2.8 Garbage are collected and disposed as per\ngarbage disposal regulations\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n32\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Handle and dispose\ngarbage\n3.1 Garbage collected are secured and transported to\ndesignated garbage collection area\n3.2 Garbage is segregated and stored according to\ntype\n3.3 Garbage disposal procedures is applied according\nto type\n3.4 Garbage containers are checked for damages\nand cleaned and sanitized in designated garbage\ncleaning area\n4. Launder soiled\nlinen/special laundry\nitems\n4.1 Soiled linen/special laundry items are collected\nand sorted according to ship’s laundry schedule.\n4.2 Laundry equipment is checked before operation\nand used in accordance with manufacturer’s\ninstructions\n4.3 Sorted soiled linen/special laundry items is\nwashed using designated washing machine\n4.4 Washed linen/special laundry items are checked\nfor stains and damages and appropriate action is\napplied to remove stains\n4.5 Linen/special laundry items are pressed/ironed,\nfolded and stored according to type or delivered\nto owner\n4.6 Any damage arising from the laundering process\nis recorded/reported to concerned personnel/\nsupervisor\n5. Store cleaning\nmaterials and\nequipment\n5.1 Cleaning materials and equipment are stored in\nthe designated areas as per ship’s standard\n5.2 Cleaning materials are kept labeled with its\noriginal container\n5.3 Usage of cleaning materials is monitored and\nrecorded/reported to the supervisor\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n33\n RANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Linens and towels\nMay include:\n1.1 Bed covers\n1.2 Bed sheets\n1.3 Blankets\n1.4 Comforters\n1.5 Pillow cases\n1.6 Bath towels\n1.7 Face towels\n1.8 Hand towel\n1.9 Foot Mat\n1.10 Curtains\n2. Furniture\nMay include:\n2.1 Side and center tables\n2.2 Drawer\n2.3 Sofas\n2.4 Cabinets\n2.5 Bar counters\n3. Appliances\nMay include:\n3.1 TV\n3.2 Radio\n3.3 Telephone\n3.4 Refrigerator\n3.5 Video Player\n3.6 Computer and printer\n4. Cabin and toilet\namenities\nMay include:\n4.1 Hand soap\n4.2 Toilet paper\n5. Cleaning materials and\nequipment\nMay include:\n5.1 Wet or dry vacuum cleaner\n5.2 Mops\n5.3 Mop head squeezer\n5.4 buckets\n5.5 Squeegee\n5.6 Floor polisher\n5.7 Dust pan\n5.8 Push brush\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n34\n\nVARIABLES\nRANGE\n\n5.9. Garbage bin/container\n5.10. Bottle sprayer\n5.11 Sponge\n5.12 Clean rags\n5.13 Glass cleaner\n5.14 Air freshener\n5.15 Furniture polisher\n5.16 Toilet bowl cleaner\n5.17 Laundry cleaning agents (soap, bleach, fabric\nconditioner)\n6. Assigned areas\nMay include:\n6.1 Recreation room\n6.2 Saloon\n6.3 Mess hall\n6.4 Sanitary areas\n6.5 Hall ways\n6.6 Laundry room\n6.7 Day room\n7. Special laundry items\nMay include:\n7.1 Officers’ uniform\n7.2 Personal clothing\n7.3 Apron\n8. Laundry equipment :\nMay include:\n8.1 Washing Machine\n8.2 Dryers\n8.3 Steam Presses\n8.4 Irons\n8.5 Hangers\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n35\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate :\n1.1 performed cabin service.\n1.2 maintained cleanliness in the assigned areas.\n1.3 handled and disposed waste.\n1.4 laundered linen/special laundry items.\n1.5 stored cleaning materials.\n\n2. Required\nKnowledge\n\n2.1 Cabin cleaning procedure\n2.2 Handling and disposing garbage according to\nregulations\n2.3 Types and uses of laundry equipment\n2.4 Types, uses and storing cleaning agents and\nmaterials\n2.5 Relevant regulations pertaining to cleaning of\nwork areas and garbage management\n3. Required Skills\n3.1 Communication skills\n3.2 Operating cleaning equipment\n3.3 Operating laundry equipment\n3.4 Segregating and disposing waste\n3.5 Housekeeping skills\n4. Resource\nImplications\n\nThe following resources should be provided :\n4.1 access to relevant workplace or appropriately\nsimulated environment where assessment\ncan take place\n4.2 tools, equipment and materials/supplies\nrelevant to the activity or task\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed\nthrough :\n5.1 demonstration and questioning of related\nunderpinning knowledge\n5.2 written Examination\n5.3 portfolio\n6. Context of\nAssessment\n\n6.1 Competency may be assessed in workplace\nor in simulated workplace setting (accredited\nassessment centers)\n6.2 Assessment shall be observed while tasks\nare being undertaken either individually or\nas a team under limited supervision\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n36\nUNIT OF COMPETENCY :\nPROVIDE ASSISTANCE IN RECEIVING AND\nSTORING PROVISION AND SUPPLIES\n\nUNIT CODE\n:\nMTM512315\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and\nattitudes in providing assistance in receiving\nand storing provision and supplies\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide assistance in\nreceiving provision\nand supplies\n\n1.1. Trolley is prepared to transport provision and\nsupplies as per standard operating procedures\n1.2 Weighing scale is prepared and used in\naccordance with manufacturer’s instructions\n1.3 Inspected provisions and supplies are received\nin accordance with ship’s standard\n2. Provide assistance in\nstoring provision and\nsupplies\n2.1 Storeroom are kept clean and freed from\nobstruction\n2.2 Provisions and supplies are transported and\narranged in First In First Out (FIFO) order\n2.3 Stocks Control System is identified and applied\nin accordance with industry practice\n2.4 Task is performed using prescribed PPEs\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n37\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Provision\nMay include:\n1.1 Meat\n1.2 Poultry\n1.3 Seafood\n1.4 Fruits and Vegetables\n1.5 Dairy products\n1.6 Starches\n1.7 Dry goods\n1.8 Beverages\n2. Supplies\nMay include:\n2.1 Bonded items\n2.2 Cleaning materials\n2.3 Linen\n3. Storeroom\nMay include:\n3.1 Dry storeroom\n3.2 Refrigerator\n3.3 Freezer\n3.4 Bonded store\n4. Stock Control\nSystem\nMay include:\n4.1 Manual\n4.2 Computerized\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n\n1.1 provided assistance in receiving the provision.\n1.2 provided assistance in storing the provision.\n2. Required Knowledge\n2.1 Different temperatures of storerooms\n2.2 Kinds of provisions\n2.3 Units of measurements\n2.4 Different storing methods\n2.5 Storing of provision\n3. Required Skills\n3.1 Oral and written communication skills\n4. Resource Implications\n\nThe following resources should be provided:\n4.1 access to relevant workplace or\nappropriately simulated environment where\nassessment can take place\n4.2 tools, equipment and materials/supplies\nrelevant to the activity or task\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed\nthrough:\n5.1 demonstration and questioning of related\nunderpinning knowledge\n5.2 written Examination\n5.3 portfolio\n\n6. Context of Assessment\n\n6.1 Competency may be assessed in\nworkplace or in simulated workplace setting\n(accredited assessment centers)\n6.2 Assessment shall be observed while tasks\nare being undertaken under limited\nsupervision\n\n--- PDF PAGE 41 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n39"
