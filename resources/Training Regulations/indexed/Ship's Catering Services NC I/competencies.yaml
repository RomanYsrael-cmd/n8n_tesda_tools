        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate :\n1.1 performed cabin service.\n1.2 maintained cleanliness in the assigned areas.\n1.3 handled and disposed waste.\n1.4 laundered linen/special laundry items.\n1.5 stored cleaning materials.\n\n2. Required\nKnowledge\n\n2.1 Cabin cleaning procedure\n2.2 Handling and disposing garbage according to\nregulations\n2.3 Types and uses of laundry equipment\n2.4 Types, uses and storing cleaning agents and\nmaterials\n2.5 Relevant regulations pertaining to cleaning of\nwork areas and garbage management\n3. Required Skills\n3.1 Communication skills\n3.2 Operating cleaning equipment\n3.3 Operating laundry equipment\n3.4 Segregating and disposing waste\n3.5 Housekeeping skills\n4. Resource\nImplications\n\nThe following resources should be provided :\n4.1 access to relevant workplace or appropriately\nsimulated environment where assessment\ncan take place\n4.2 tools, equipment and materials/supplies\nrelevant to the activity or task\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed\nthrough :\n5.1 demonstration and questioning of related\nunderpinning knowledge\n5.2 written Examination\n5.3 portfolio\n6. Context of\nAssessment\n\n6.1 Competency may be assessed in workplace\nor in simulated workplace setting (accredited\nassessment centers)\n6.2 Assessment shall be observed while tasks\nare being undertaken either individually or\nas a team under limited supervision\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR-SHIP’S CATERING SERVICES NC I\nPromulgated May 2013\n36\nUNIT OF COMPETENCY :\nPROVIDE ASSISTANCE IN RECEIVING AND\nSTORING PROVISION AND SUPPLIES\n\nUNIT CODE\n:",
