  "source_text": "DEFINITION OF TERMS\n\n1.\nBeverage\n-\nany liquid for drinking.\n2. Braise\n-\nto cook (meat and vegetables) by browning in fat, then\nsimmering in a small quantity of liquid in a covered\ncontainer.\n3. Cabin\n-\na room on board a ship for use of one or more officers or\npassengers; a space in which the accommodation for\nofficers and / or passengers is located.\n4.\nCold cuts\n-\nvariety of sliced cold meats and cheeses.\n5. Cross\ncontamination\n-\nthe transfer of harmful micro-organism from one item of\nfood to another.\n6. Environmental\nhazard\n-\nworking conditions unsafe to crew.\n7. Galley\n-\na cook room, kitchen or deckhouse used for cooking\ndrippings.\n8.\nGriddle\n-\na flat metal surface used for cooking by dry heat.\n9. Hollandaise\n-\na permanent emulsion sauce, used for steaks, vegetables\nand fish.\n10. MARPOL\n-\nabbreviation, for Marine Pollution.\n11. Meal Service\n-\nto serve food or beverages.\n12. Menu\n-\na list of food available or choices given to guest before the\nstart of a meal.\n13. Mess hall\n-\na dining room or space on board in which all or part of\nship’s crew eat their meals.\n14. Mirepoix\n-\na mixture of vegetables and herbs to enhance the flavor of\nstock, sauces and soups.\n15. Mise-en place\n-\nis the prepared necessary raw materials, utensils ,\ningredients needed for cooking.\n16. Mixer\n-\na machine / equipment for mixing or beating foods.\n17. Oven\n-\nan enclosed chamber for heating, roasting / baking.\n18. Pantry\n-\na small room or closet, usually of a kitchen where food,\nchine silver linens and similar items are stored.\n19. Personal\nHygiene\n-\nconditions and practices that serve to promote or preserve\nhealth.\n20. Provisions\n-\na store of needed materials for a voyage; especially a\nstock of food for use of crew and passengers (usually 3\nmonths provision / 200 % allowance.\n21. Recipe\n-\nprocedure and direction in preparing dish or drink.\n22. Sanitation\n-\nformulation and application of measures designed to\nprotect public health.\n23. Stock\n-\nbroth in which meat, fish or poultry bones are simmered\nfor a period of time.\n24. Store\n-\nto fill or furnish with supply.\n25. Thaw\n-\nto change from a frozen solid to a liquid by gradual\nwarming.\n26. Victualing /\nVictual\n-\nfood fit for consumption; lay in food supplies or provisions;\nproviding, storing or supplying provisions.\n\n--- PDF PAGE 51 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n49"
