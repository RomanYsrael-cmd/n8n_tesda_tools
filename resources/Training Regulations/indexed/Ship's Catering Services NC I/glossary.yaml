      "definition": "Beverage - any liquid for drinking. 2. Braise - to cook (meat and vegetables) by browning in fat, then simmering in a small quantity of liquid in a covered container. 3. Cabin - a room on board a ship for use of one or more officers or passengers; a space in which the accommodation for officers and / or passengers is located. 4. Cold cuts - variety of sliced cold meats and cheeses. 5. Cross contamination - the transfer of harmful micro-organism from one item of food to another. 6. Environmental hazard - working conditions unsafe to crew. 7. Galley - a cook room, kitchen or deckhouse used for cooking drippings. 8. Griddle - a flat metal surface used for cooking by dry heat. 9. Hollandaise - a permanent emulsion sauce, used for steaks, vegetables and fish. 10. MARPOL - abbreviation, for Marine Pollution. 11. Meal Service - to serve food or beverages. 12. Menu - a list of food available or choices given to guest before the start of a meal. 13. Mess hall - a dining room or space on board in which all or part of ship’s crew eat their meals. 14. Mirepoix - a mixture of vegetables and herbs to enhance the flavor of stock, sauces and soups. 15. Mise-en place - is the prepared necessary raw materials, utensils , ingredients needed for cooking. 16. Mixer - a machine / equipment for mixing or beating foods. 17. Oven - an enclosed chamber for heating, roasting / baking. 18. Pantry - a small room or closet, usually of a kitchen where food, chine silver linens and similar items are stored. 19. Personal Hygiene - conditions and practices that serve to promote or preserve health. 20. Provisions - a store of needed materials for a voyage; especially a stock of food for use of crew and passengers (usually 3 months provision / 200 % allowance. 21. Recipe - procedure and direction in preparing dish or drink. 22. Sanitation - formulation and application of measures designed to protect public health. 23. Stock - broth in which meat, fish or poultry bones are simmered for a period of time. 24. Store - to fill or furnish with supply. 25. Thaw - to change from a frozen solid to a liquid by gradual warming. 26. Victualing / Victual - food fit for consumption; lay in food supplies or provisions; providing, storing or supplying provisions."
