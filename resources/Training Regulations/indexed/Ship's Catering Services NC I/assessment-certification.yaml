  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION\nARRANGEMENTS\n\nAssessment of an individual’s competence leads to the issuance of a\nNational Certificate (NC).\n\nA National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the relevant endorsed\nqualification.\n\n1. Candidate wanting to be certified shall be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of\ncompetency. As a rule, the unit/s of competency shall be the benchmark for\nall assessment under the Training Regulations for Maritime Sector.\n\n2. Candidate must have completed the prescribed course of instruction in all the\nunits of competency contained in the SHIP’S CATERING SERVICES NC I or\nwith equivalent sea service experience before applying for assessment and\ncertification for National Certificate Level. The following are qualified to apply\nfor assessment and certification:\n\n2.1 Those who have completed a course on Ship’s Catering Services NC I;\nor\n2.2 Seafarers with a minimum of 6 months (relevant sea service experience)\nas messman.\n\n3 Conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the purpose.\n\n--- PDF PAGE 49 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n47\n\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\n\nBASIC\nCOMPETENCIES\nShip’s Catering Services NC I\nCOMPETENCY MAP\nFor Maritime Sector\nPerform\nmaintenance and\nsanitation of galley\nequipment and\nConduct\ninventory of tools,\nequipment and\nfacilities\nPerform engine\nroom\nhousekeeping\nPerform\nsupervisory\nfunctions\nAssist in\nperforming deck\nmaintenance\nPerform\nvictualing\nservices\nPerform\nhousekeeping\nservices\nInstall/ reinstall/\nreplace piping\nsystem\nProvide\nassistance in\nbunkering\noperations\nPerform mooring/\nunmooring\noperations\nAssist in\nperforming\nnavigational\nwatchkeeping\nSupervise the\nmaintenance and\nsanitation of galley\nequipment and\nutensils and related\nareas\nPerform mess hall\nservice\nFabricate\nshipboard\ncomponents\nUse and care for\nhand and power\ntools\nPerform\nmarlinspike and\ncanvas work\nAssist in\nperforming\nsimple splicing\nand canvas work\nProvide assistance\nin receiving and\nstoring provisions\nAssist engineer\nin the\nmaintenance of\nmain engine\nPerform engine\nwatchkeeping\nduties\nProvide support\nin cargo\noperations\nPerform\nhousekeeping\nduties\nPrepare and\ncook meat dishes\nPrepare stocks,\nsauces and soups\nEstablish and\nmaintain catering\nstandards\nMaintain/ clean\nengine room,\nmachinery and\nspaces\nPerform deck\nmaintenance\nPerform\nnavigational\nwatchkeeping\nduties\nSupervise\npreparation of\nmeals\nPrepare bread\nproducts and hot\nand cold desserts\nPrepare and\ncook seafood\nPrepare and\ncook poultry\nproducts\nPrepare side\ndishes and\nbreakfast meal\nPrepare\nappetizers, salads\nand sandwiches\n(hot and cold and\nopen)\nComply with\nemergency\nprocedures\nProtect marine\nenvironment\nPerform first-aid\ntreatment on\nboard\nPerform survival\ntechniques\nduring ship\nabandonment\nPrevent and fight\nfire\nLaunch survival\ncraft and rescue\nboats\nPerform stock\ncontrol\nWork within\nmulti-cultural and\nreligious\nenvironment\nProtect marine\nenvironment/ waste\nsegregation mgmt.\nObserve catering\nhealth and safety\npractices\nPractice food\nsafety, sanitation\nand hygiene\nObserve\npersonal hygiene\nConduct\nshipboard\nsecurity check\nLead small teams\nLead in workplace\ncommunication\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nWork with others\nReceive and\nrespond to\nworkplace\ncommunication\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\noccupational\nhealth and safety\nprocedures\nPractice career\nprofessionalism\nPractice basic\nhousekeeping\nprocedures\nDemonstrate\nwork values\nUse relevant\ntechnologies\nUse mathematical\nconcepts and\ntechniques\n\n--- PDF PAGE 50 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n48\nDEFINITION OF TERMS\n\n1.\nBeverage\n-\nany liquid for drinking.\n2. Braise\n-\nto cook (meat and vegetables) by browning in fat, then\nsimmering in a small quantity of liquid in a covered\ncontainer.\n3. Cabin\n-\na room on board a ship for use of one or more officers or\npassengers; a space in which the accommodation for\nofficers and / or passengers is located.\n4.\nCold cuts\n-\nvariety of sliced cold meats and cheeses.\n5. Cross\ncontamination\n-\nthe transfer of harmful micro-organism from one item of\nfood to another.\n6. Environmental\nhazard\n-\nworking conditions unsafe to crew.\n7. Galley\n-\na cook room, kitchen or deckhouse used for cooking\ndrippings.\n8.\nGriddle\n-\na flat metal surface used for cooking by dry heat.\n9. Hollandaise\n-\na permanent emulsion sauce, used for steaks, vegetables\nand fish.\n10. MARPOL\n-\nabbreviation, for Marine Pollution.\n11. Meal Service\n-\nto serve food or beverages.\n12. Menu\n-\na list of food available or choices given to guest before the\nstart of a meal.\n13. Mess hall\n-\na dining room or space on board in which all or part of\nship’s crew eat their meals.\n14. Mirepoix\n-\na mixture of vegetables and herbs to enhance the flavor of\nstock, sauces and soups.\n15. Mise-en place\n-\nis the prepared necessary raw materials, utensils ,\ningredients needed for cooking.\n16. Mixer\n-\na machine / equipment for mixing or beating foods.\n17. Oven\n-\nan enclosed chamber for heating, roasting / baking.\n18. Pantry\n-\na small room or closet, usually of a kitchen where food,\nchine silver linens and similar items are stored.\n19. Personal\nHygiene\n-\nconditions and practices that serve to promote or preserve\nhealth.\n20. Provisions\n-\na store of needed materials for a voyage; especially a\nstock of food for use of crew and passengers (usually 3\nmonths provision / 200 % allowance.\n21. Recipe\n-\nprocedure and direction in preparing dish or drink.\n22. Sanitation\n-\nformulation and application of measures designed to\nprotect public health.\n23. Stock\n-\nbroth in which meat, fish or poultry bones are simmered\nfor a period of time.\n24. Store\n-\nto fill or furnish with supply.\n25. Thaw\n-\nto change from a frozen solid to a liquid by gradual\nwarming.\n26. Victualing /\nVictual\n-\nfood fit for consumption; lay in food supplies or provisions;\nproviding, storing or supplying provisions.\n\n--- PDF PAGE 51 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n49\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who donated their time\nand expertise to the development and validation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nC/E ALFREDO G. HABOC\nConvenor\nPresident\nPhilippine Association of Maritime\nTraining Centers, Inc (PAMTCI)\n\nJOSEFINO M. REYES II\nSection Head\nNYK-Fil Maritime E-Training, Inc.\nIntramuros, Manila\nALLAN A. LORENZO\nChef Instructor\nMagsaysay Institute of Hospitality and Culinary\nArts (MIHCA)\nErmita, Manila\nJOHN S. RACELIS\nChief Cook/ Instructor\nNYK-Fil Maritime E-Training, Inc.\nIntramuros, Manila\nARIEL R. SOTTO\nChief Cook/ Instructor\nNYK-Fil Maritime E-Training, Inc.\nIntramuros, Manila\nThe PARTICIPANTS in the Validation of these Training Regulations\nSHIELA F. ACHAS\nGlobal Skills Formation Institute, Inc. (GSFI)\n FRANCIS C. ASAHAN\nPNTC (formerly Philippine Nautical Training\nInstitute)\nRODOLFO B. BONCAY\nSouthern Institute of Maritime Studies (SIMS)\nERIC G. GRUBA\nMagsaysay Institute of Hospitality & Culinary\nArts (MIHCA)\nPAOLO SANTINO A. GUEVARA\n Magsaysay Center for Hospitality and\nCulinary Arts (MCHCA)\nPEDRO A. LONZAME\n MARITAS\nVICENTE EDUARDO I. MOLINA\nPhilippine Seafarers Training Center 