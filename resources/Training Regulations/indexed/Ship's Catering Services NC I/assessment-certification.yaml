  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION\nARRANGEMENTS\n\nAssessment of an individual’s competence leads to the issuance of a\nNational Certificate (NC).\n\nA National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the relevant endorsed\nqualification.\n\n1. Candidate wanting to be certified shall be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of\ncompetency. As a rule, the unit/s of competency shall be the benchmark for\nall assessment under the Training Regulations for Maritime Sector.\n\n2. Candidate must have completed the prescribed course of instruction in all the\nunits of competency contained in the SHIP’S CATERING SERVICES NC I or\nwith equivalent sea service experience before applying for assessment and\ncertification for National Certificate Level. The following are qualified to apply\nfor assessment and certification:\n\n2.1 Those who have completed a course on Ship’s Catering Services NC I;\nor\n2.2 Seafarers with a minimum of 6 months (relevant sea service experience)\nas messman.\n\n3 Conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the purpose.\n\n--- PDF PAGE 49 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n47\n\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\n\nBASIC\nCOMPETENCIES\nShip’s Catering Services NC I\n"
