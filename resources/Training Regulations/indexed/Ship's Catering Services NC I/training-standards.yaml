    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for Ship’s Catering\nServices NC I.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: SHIP’S CATERING SERVICES NC Level: NC I\n\nSuggested Nominal Training Duration: 18 HOURS (Basic Competencies)\n12 HOURS (Common Competencies)\n20 HOURS (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nStewarding in accordance with industry standards. It covers core competencies\nsuch as perform mess hall service, perform housekeeping service and providing\nassistance in receiving and storing provision and supplies.\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of stewarding.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary speaking\n& messages in a\nworkplace.\n1.2 Follow routinary speaking\n & message\n1.3 Perform work duties\n following written notices.\nGroup\ndiscussion\nInteraction\n\nInterviews/\nquestioning\nObservation\n2. Work with\nothers\n2.1 Develop effective workplace\nrelationship.\n2.2 Contribute to work group\nactivities.\n2.3 Work with multi-culture and\nreligious awareness\nGroup\ndiscussion\nInteraction\n\nInterviews/\nquestioning\nDemonstration\nObservation\n3. Demonstrate\nwork values\n\n 3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct\nin the workplace\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\nunnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\ntools and equipment\n4.4 Follow standardize work\nProcess and procedures\n4.5 Perform work\nspontaneously\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\n--- PDF PAGE 42 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n40\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Observe\npersonal\nhygiene\n\n1.1 Practice proper\npersonal hygiene and\ngrooming.\n1.2 Comply with food\nhandling safety\npractices\nDiscussion\nLecture\nDemonstration\nWritten\nQuestioning\nObservation\nPractical\nperformance\n\n2. Practice food\nsafety,\nsanitation and\nhygiene\n2.1 Practice food safety\nsanitation\n2.2 Store food\n2.3 Practice Cleaning\nProcedure\n2.4 Report pest infestation\nDiscussion\nLecture\nDemonstration\nSimulation\nObservation\nDemonstration\nPractical\n performance\n\n3. Observe\ncatering\nhealth and\nsafety\npractices\n3.1 Handle catering\nequipment\n3.2 Prevent common\naccident in the work\nplace.\nDiscussion\nLecture\nDemonstration\nSimulation\nObservation\nDemonstration\nPractical\n performance\n\n4. Protect\nmarine\nenvironment/\nwaste\nsegregation\nmanagement\n4.1 Segregate waste\n4.2 Package waste\n\nDiscussion\nLecture\nDemonstration\nSimulation\nObservation\nDemonstration\nPractical\n performance\n\n5. Work within\nmulti-cultural\nand religious\nenvironment\n5.1 Recognize cultural and\nreligious diversity\namong crew\n5.2 Demonstrate sensitivity\nto specific cultures and\npractices\nDiscussion\nLecture\nDemonstration\nSimulation\nObservation\nDemonstration\nPractical\n performance\n\n--- PDF PAGE 43 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n41\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform mess\nhall service\n1. Set up table\n2. Serve food\n3. Clear table\n4. Wash used tableware\nand dispose waste\n5. Prepare pantry area for\nservice\n\nLectures\nDemonstration\nDiscussion\nRole Playing\nObservation\nWritten\nExamination\nPractical\ndemonstration\nand oral\nquestioning\n2. Perform\nhousekeeping\nservice\n2.1 Perform cabin services\n2.2 Clean assigned areas\n2.3 Handle and dispose\ngarbage\n2.4 Launder soiled\nlinen/special laundry\nitems\n2.5 Store cleaning\nmaterials and\nequipment\nLectures\nDemonstration\nDiscussion\nRole Playing\nObservation\nWritten\nExamination\nPractical\ndemonstration\nand oral\nquestioning\n\n3. Provide\nassistance in\nreceiving and\nstoring\nprovisions and\nsupplies\n3.1. Provide assistance in\nreceiving provision and\nsupplies\n3.2. Provide assistance in\nstoring provision and\nsupplies\nDiscussion\nDemonstration\nActual\nCleaning\nOJT\nObservation\nWritten\nexamination\nQuestioning/\nInterview\n\n--- PDF PAGE 44 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n42\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by any of the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards\nand the curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n•\nTraining program is based both on and off the job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are Nationally Accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n•\nThe\ndualized\nmode\nof\ntraining\ndelivery\nis\npreferred\nand\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study, or\naudio, video or computer technologies.\n•\nProject-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects that\nhave real world applications.\n\n--- PDF PAGE 45 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n43\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing entry written examinations may also be indicated if necessary.\n\n•\nMust be High School graduate\n•\n18 years old and above\n•\nMust have a good moral character\n•\nMust be physically and mentally fit as per MLC 2006 Regulation 1.2 -\nMedical Certificate\n•\nCan communicate in English both oral and written\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR\nSHIP’S CATERING SERVICES NC I\n\nRecommended list of tools, equipment and materials for the training of 24\ntrainees for SHIP’S CATERING SERVICES NC I\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n2 pcs.\n• Square table 1 unit\n• 3-Compartment\nSink\n2 pcs.\n• Hand towels\n8 pcs.\n•Dining Chairs\n1 pc.\n•Floor Squeegee\n2 pcs.\n•Face towels\n3 pcs.\n• Round Trays\n1 unit\n• Detergents /\ncleaning agents\nstock cabinet\n6 pcs.\n• Hangers\n3 pcs\n• Rectangular\nTrays\n1 unit\n• Storage cabinet\n3 pcs.\n• Bath Towels\n6 pcs.\n• Cloth Table\nnapkins\n1 unit\n• Bed\n1 pc.\n• Blanket /\nComforter\n2 pcs.\n•Table Cloth\n1 unit\n•Mock Bedroom\n3 pcs.\n•Bed Sheets\n1 pc\n• Goblet Glass\nrack\n1 unit\n• Vacuum Cleaner\n(wet and dry)\n2 pcs.\n• Pillows / pillow\ncases\n1 pc.\n• High ball Glass\nrack\n1 unit\n• Floor Polishers\n1 pc.\n• Foot mat\n1 pc.\n•Plate rack\n1 unit\n•Dryer\n\n1 pc.\n•Coffee Urn\n1 unit\n•Washing machine\n\n1 pc.\n•Cork screw\n\nTraining Materials:\n1. Handbook for sanitation\n2. Handbook for safety\n3. Cleaning Procedures\nManual\n\n1 set\n• Sugar and\ncreamer set\nSAFETY\n2 pcs.\n• Ashtray\n1 set First Aid Kit\n2 pcs.\n• Toothpicks\ndispenser\n1 pc. Fire Extinguisher\n6 sets\n• Coffee cup and\nsaucer\n1 set Personal Protective\nEquipment (PPE)\n\n--- PDF PAGE 46 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n44\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n12 pcs.\n•Show plate\n\n2 sets\n• Salt Pepper\nShaker\n\n6 pcs.\n•Tea spoon\n\n6 pcs.\n•Dinner Spoon\n\n6 pcs.\n•Dinner Fork\n\n4 pcs\n•Bread baskets\n\n6 pcs.\n• Fish knife\n\n6 pcs.\n• Salad knife\n\n6 pcs.\n•Dinner Knife\n\n6 pcs\n•Butter spreader\n\n6 pcs.\n•Dessert spoon\n\n6 pcs.\n•Cocktail fork\n\n6 pcs.\n•Salad fork\n\n2 pcs.\n• Demitasse\nspoon\n\n2 sets\n• Demitasse cup\nand saucer\n\n6 pcs.\n• Dinner Plate\n(10”)\n\n6 pcs.\n• Bread Plate\n\n6 pcs.\n•Salad Plates\n\n6 pcs.\n•Dessert Bowl\n\n6 pcs.\n•Entrée plate\n\n6 pcs.\n•Soup bowl\n\n6 pcs.\n•Soup spoon\n\n3 pcs.\n• Stainless water\npitcher\n\n6 pcs.\n•Water goblet\n\n6 pcs.\n•Red wine glass\n\n6 pcs.\n• White wine\nglass\n\n6 pcs.\n• High ball glass\n\n--- PDF PAGE 47 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n45\n3.5\nTRAINING FACILITIES\n SHIP’S CATERING SERVICES NC I\n\nThe workshop must be of concrete structure. Based on a class size of 24\nstudents/trainees the space requirements for the teaching/ learning and circulation\nareas are as follows:\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Lecture Room ( job\nsite / school)\n\n42.00\n• Trainee Working\nSpace\n\n120.00\n• Learning Resource\nCenter\n\n4.00 X 5.00\n\n20.00\n\n20.00\n• Facilities /\nEquipment /\nCirculation Area\n\nTotal Workshop Area\n\n236.60\n\n3.6\nTRAINER’S QUALIFICATIONS FOR MARITIME SECTOR\n\nSHIP’S CATERING SERVICES – NC I\n\n• National TVET Trainers Certificate I (NTTC I) holder\n• With 2 year relevant experience in Hotel and Restaurant OR 2 years on\nboard experience as cook\n• *Must be a BS degree holder\n\n*An institutional requirement that may be required by the school or training\ncenter delivering the TVET program\n\n--- PDF PAGE 48 ---\nTR-SHIP’S CATERING SERVICES NC I Promulgated May 2013\n46"
