    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: SHIP’S CATERING SERVICES NC Level: NC I\n\nSuggested Nominal Training Duration: 18 HOURS (Basic Competencies)\n12 HOURS (Common Competencies)\n20 HOURS (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nStewarding in accordance with industry standards. It covers core competencies\nsuch as perform mess hall service, perform housekeeping service and providing\nassistance in receiving and storing provision and supplies.\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of stewarding.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary speaking\n& messages in a\nworkplace.\n1.2 Follow routinary speaking\n & message\n1.3 Perform work duties\n following written notices.\nGroup\ndiscussion\nInteraction\n\nInterviews/\nquestioning\nObservation\n2. Work with\nothers\n2.1 Develop effective workplace\nrelationship.\n2.2 Contribute to work group\nactivities.\n2.3 Work with multi-culture and\nreligious awareness\nGroup\ndiscussion\nInteraction\n\nInterviews/\nquestioning\nDemonstration\nObservation\n3. Demonstrate\nwork values\n\n 3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct\nin the workplace\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\nunnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\ntools and equipment\n4.4 Follow standardize work\nProcess and procedures\n4.5 Perform work\nspontaneously\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n\