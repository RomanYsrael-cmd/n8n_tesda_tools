  "source_text": "DEFINITION OF TERMS\n\n1. Automotive Vehicles\nThese are motor vehicles whose gross vehicle weight is\nequal or less than 3,500 kgs. Powered by a gas or diesel\nengine. It could be a passenger car or a light utility vehicle\n2. Automotive\nMechanical\nAssembly Technician\nRefers to an all around auto mechanical assembly man that\ncan\nperform\nall\nmechanical\nassembly\nworks\nfrom\nassembling of mechanical assemblies to mounting and\ninstallation to automotive vehicle body.\n\n3. Adhesives\nSubstance used to hold gasket in place during assembly. It\nalso maintains a tight seal by filling in small irregularities on\na surface and prevents gasket from shifting due to vibration.\n4. Point of Fit\n\nRefers to the assembly area where parts / materials /\nassemblies are used or consumed\n5. Mechanical\nAssemblies\nType of construction in which different and related\nparts/components are converted into sub-assembly form.\n\n6. Hardware Parts\nRefers to bolts, nuts, screws, washers and other small parts\n\n7. Catalytic Converter\n\nThe control device fitted in the exhaust system of an internal\ncombustion engine. The converter reduces the toxicity of\nproducts of combustion by catalytic re-combination\n8. Assembly Manuals\nReference manuals with illustration or drawings of\nparts/components and its direction on how they are mounted\nor installed on the automotive vehicle or certain assemblies.\n\n9. Quality Inspection\nManuals\n\nReference manuals with explanation on what quality\nstandards have to be maintained in the conduct of\nassembling automotive vehicle\n\n10. Work Order\n\nA work order is a form of instruction that is broadcasted\neither by manual or by electronic system by preceding\nstations to the next stations regarding on what model\nsequence to produce on a timely-structured manner.\n11. Job Requirements\n\nRefers to specific specifications of model/variant to be\nassembled.\n\n12. Standard Operation\n Sheet\n\nIs a listing of process elements arrange according to the\nassembly sequence for a given job requirements\n\n13. Intake Manifold\n\nTubing attached to the engine through which the air/fuel\nmixture reaches the cylinder.\n\n14. Master Cylinder\n\nThe liquid-filled cylinder in the hydraulic brake system or\nclutch, where hydraulic pressure is developed when\ndepresses a foot pedal.\n\n15. Power Steering\ncolumn\n\nSteering that has been designed to make the wheel move\nmore easily than in a manual steering system. Hydraulic\nassists the process utilizing hydraulic fluid. The fluid\n\n--- PDF PAGE 68 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 65\nincreases pressure in the power steering pump and aids in\nthe movement of the steering mechanism. This fluid, called\npower steering fluid, is what is replaced at regular intervals\nto keep steering soft and comfortable.\n16. Jigs/fixtures\nKind of equipment that is used for sub-assembly operations\nin order to meet the desired dimensions and outcome of a\ncertain assembly.\n\n--- PDF PAGE 69 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 66"
