  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of AUTOMOTIVE MECHANICAL ASSEMBLY\nNC II, the candidate must demonstrate competence through assessment covering\nall the units of competency listed in Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of AUTOMOTIVE MECHANICAL\nASSEMBLY NC II must acquire Certificates of Competency in all the following core\nunits of the Qualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1\nAssemble Mechanical Assemblies using Jigs/Fixtures\n• Assemble Mechanical Assemblies using Jigs/Fixtures\n\n4.2.2\nMount/Install Automotive Mechanical Assemblies\n• Mount/Install Brake and Fuel Systems\n• Mount/Install Power Drive System\n• Mount/Install Suspension Drive Train\n\n4.2.3\nInstall/Fit out Trim Parts/Components\n• Install/Fit out Trim Parts/Components\n\n4.2.4\nPerform Final Engine Run\n• Perform Final Engine Run\n\n4.2.5\nPerform Wheel Alignment Operations\n• Perform Wheel Alignment Operations\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQCS)”.\n\n--- PDF PAGE 66 ---\nTR-Automotive Mechanical Assembly NC II Promulgated\n63\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB SECTOR\n(ASSEMBLY)\n\nAUTOMOTIVE MECHANICAL ASSEMBLY NC II\n\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nAUTOMOTIVE MECHANICAL ASSEMBLIES NC II\nLegend:\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nPerform Mensuration\nand Calculation\nRead, Interpret and Apply\nEngineering Manual and\nSpecifications\nMove and Position\nVehicle\nApply Appropriate\nSealant/Adhesives\nInstall/Fit out Electrical\nParts to Engine\nAssembly\nANNEX A\nAssemble Mechanical\nAssemblies Using Jigs/\nFixtures\nMount/ Install Brake\nFuel System\nMount/ Install\nSuspension Drive\nSystem\nMount/ Install Power\nDrive System\nInstall/Fit Trim\nParts/Components\nPerform Final Engine\nRun\nPerform Wheel\nAlignment Operation\nPerform Shop\nMaintenance\nInstall/Fit out Electronic\nUnits to Body Interior\nComponents\nInstall/Fit out Electrical\nParts & Electronic Units to\nDash Board Instrument\nPanel\nInstall/Fit out Electrical\nParts to Exterior and\nEngine Compartment\nInstall/Fit out Audio and\nVideo Systems\nPerform Headlight\nFocus Aiming Operation\n\n--- PDF PAGE 67 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 64\n\nDEFINITION OF TERMS\n\n1. Automotive Vehicles\nThese are motor vehicles whose gross vehicle weight is\nequal or less than 3,500 kgs. Powered by a gas or diesel\nengine. It could be a passenger car or a light utility vehicle\n2. Automotive\nMechanical\nAssembly Technician\nRefers to an all around auto mechanical assembly man that\ncan\nperform\nall\nmechanical\nassembly\nworks\nfrom\nassembling of mechanical assemblies to mounting and\ninstallation to automotive vehicle body.\n\n3. Adhesives\nSubstance used to hold gasket in place during assembly. It\nalso maintains a tight seal by filling in small irregularities on\na surface and prevents gasket from shifting due to vibration.\n4. Point of Fit\n\nRefers to the assembly area where parts / materials /\nassemblies are used or consumed\n5. Mechanical\nAssemblies\nType of construction in which different and related\nparts/components are converted into sub-assembly form.\n\n6. Hardware Parts\nRefers to bolts, nuts, screws, washers and other small parts\n\n7. Catalytic Converter\n\nThe control device fitted in the exhaust system of an internal\ncombustion engine. The converter reduces the toxicity of\nproducts of combustion by catalytic re-combination\n8. Assembly Manuals\nReference manuals with illustration or drawings of\nparts/components and its direction on how they are mounted\nor installed on the automotive vehicle or certain assemblies.\n\n9. Quality Inspection\nManuals\n\nReference manuals with explanation on what quality\nstandards have to be maintained in the conduct of\nassembling automotive vehicle\n\n10. Work Order\n\nA work order is a form of instruction that is broadcasted\neither by manual or by electronic system by preceding\nstations to the next stations regarding on what model\nsequence to produce on a timely-structured manner.\n11. Job Requirements\n\nRefers to specific specifications of model/variant to be\nassembled.\n\n12. Standard Operation\n Sheet\n\nIs a listing of process elements arrange according to the\nassembly sequence for a given job requirements\n\n13. Intake Manifold\n\nTubing attached to the engine through which the air/fuel\nmixture reaches the cylinder.\n\n14. Master Cylinder\n\nThe liquid-filled cylinder in the hydraulic brake system or\nclutch, where hydraulic pressure is developed when\ndepresses a foot pedal.\n\n15. Power Steering\ncolumn\n\nSteering that has been designed to make the wheel move\nmore easily than in a manual steering system. Hydraulic\nassists the process utilizing hydraulic fluid. The fluid\n\n--- PDF PAGE 68 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 65\nincreases pressure in the power steering pump and aids in\nthe movement of the steering mechanism. This fluid, called\npower steering fluid, is what is replaced at regular intervals\nto keep steering soft and comfortable.\n16. Jigs/fixtures\nKind of equipment that is used for sub-assembly operations\nin order to meet the desired dimensions and outcome of a\ncertain assembly.\n\n--- PDF PAGE 69 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 66\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nAutomotive Mechanical Assembly\nNMPI / CATC/PAFI\nAntonio A. Gimenez-\nExecutive Director -\nCATC/PAFI\n\nRodolfo T. Nunez-\nPlant Manager-Nissan\nMotors Phils. Inc.(NMPI)\nCATC/PAFI\n\nRene Torres\n(Labor Representative)\nNissan Motors Philippines\nWorkers Union-AIWA\nNissan TechnoPark Bo.\nPulong, Sta. Cruz Laguna\nMr. Valentino de Leon\nVP- Plant Adminstration-\nNMPI\nEdgardo P. Zaragoza-\nPaint Shop Manager- NMPI\n(CATC/PAFI)\nCarina J. Bondad-\nAdministrative Support Staff,\n(CATC/PAFI)\n\nThe PARTICIPANTS in the National Validation of this Training Regulation\nROBERTS RADIATOR\nPILIPINAS HINO INC.\nNISSAN MOTOR PHILIPPINES\nINC.\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes\n\n--- PDF PAGE 70 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 67\n\nList of Published Training Regulations\n\n\nAnimal Production NC II\n\nAquaculture NC II\n\nAutomotive Body Painting/Finishing NC II\n\nAutomotive Body Repair NC II\n\nAutomotive Engine Rebuilding NC II\n\nAUTOMOTIVE MECHANICAL ASSEMBLY NC II\n\nBartending NC II\n\nBuilding Wiring Installation NC II\n\nCarpentry NC II\n\nCommercial Cooking NC II\n\nComputer Hardware Servicing NC II\n\nDeck Seafaring NC II\n\nDressmaking NC II\n\nDriving NC II\n\nEngine Seafaring NC II\n\nFood and Beverage Services NC II\n\nFootwear Making NC II\n\nHeavy Equipment Operation NC II\n\nHorticulture NC II\n\nHousehold Services NC II\n\nHousekeeping NC II\n\nMachining NC II\n\nMasonry NC II\n\nMotorcycle and Small Engine Servicing NC II\n\nPlumbing NC II\n\nPyrotechnics NC II\n\nRAC Servicing NC I\n\nRAC Servicing NC II\n\nSecurity Services NC II\n\nTailoring NC II\n\nTour Guiding Services NC II\n\nTransport RAC Servicing NC II\n\nTravel Services NC II\n\nWelding NC II\n\nThese materials are available in both printed and electronic copies.\nFor more information please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTelephone Nos.: 893-8303, 893-2139; 817-4076 to 82 loc. 615 to 617\nor visit our website: www.tesda.gov.ph"
