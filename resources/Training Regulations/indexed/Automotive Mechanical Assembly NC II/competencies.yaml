        "source_title": "ASSEMBLE MECHANICAL ASSEMBLIES USING JIGS/FIXTURES",
        "source_text": "--- PDF PAGE 34 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            31\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:        \nASSEMBLE MECHANICAL ASSEMBLIES USING \nJIGS/FIXTURES \nUNIT CODE \n     :    \nALT 827307     \nUNIT DESCRIPTOR      :         This unit identifies the competence required for the \npreparation, delivery and assembly of mechanical \nassemblies by use of jigs/fixtures for vehicle completion \nor for installing/mounting to automotive vehicle body in \naccordance with company standards. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Obtain materials / \nparts for job. \n1.1 \nMaterials/parts list is read and interpreted to establish \nrequirements for the job. \n1.2 \nParts/materials are picked by matching part numbers \nthat are stacked in the warehouse bin/container and \nfloor stack areas. \n1.3 \nParts/materials are delivered to respective point of fit \nto ensure smooth and continuous production.\n2. Select and use tools \nand equipment \n2.1 \nTools and equipment are selected to meet job \nrequirements. \n2.2 \nTools and equipment are checked to ensure they are \nin good working order. \n2.3 \nAppropriate lifting hoist/hangers/gears are selected \nand used in accordance with OH&S requirements.\n3. Load and unload \nparts into assembly \njigs/fixtures \n3.1 \nParts are matched to the jigging equipment reference \nto part numbers and codes. \n3.2 \nParts are securely clamped to prevent movement and \ndistortion during the assembly operation as specified \nin the standard operation sheet.\n4. Select and use \nadhesives, sealants \nand solvents \n4.1 \nAdhesives, sealants and solvents are selected and \napplied to meet the job requirements. \n4.2 \nSolvents are selected and used to remove excess \nsealants to ensure finished product meets company’s \nquality standard. \n4.3 \nMajor spills are reported to the safety personnel and \nto be cleaned up in accordance with emergency \nprocedures for hazardous materials. \n4.4\nCompany OH&S requirements are observed.\n5. Select and use \nhardware parts \n5.1 \nHardware parts are identified and selected to meet \nthe job requirements as stated in the materials/parts \nlist. \n5.2 \nHardware parts are fitted in the required number to \nthe designated positions stated in the materials/parts \nlist and engineering manuals.\n\n--- PDF PAGE 35 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            32\n \n \n \n6. Assemble \nmechanical \nassemblies \n6.1 \nMaterials/parts list and engineering drawings are \ncorrectly read and interpreted. \n6.2 \nParts are matched with the materials/parts list for the \nparticular requirements for the job. \n6.3 \nParts are positioned and secured to assemble into \nassemblies as per the relevant \ndrawings/instructions. \n6.4 \nSpecified nuts, bolts and screws are tensioned to the \nspecified torque requirements stated in the \nengineering manuals and standard operating sheet.  \n6.5 \nIdentified faults are recorded, reported and \nrectified/scrapped in accordance with company \nprocedures. \n6.6 \nWorkflow and production output are recorded and \nmaintained\n\n--- PDF PAGE 36 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            33\n      RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Requirements for the \nJob \n1.1. Production schedule  \n1.2. Work Order \nNote:  A work order is a form of  instruction that is \nbroadcasted either by manual or by electronic \nsystem by preceding stations to the next stations \nregarding on what model sequence to produce \non a timely-structured manner.\n2. Point of fit \nThis includes the different work stations in the assembly \nline like: \n2.1. \nMain stream or on-line assembly stations \n2.2.\nOff-line assembly stations\n3. Tools and equipment \n3.1. \nJigs and fixtures  \n3.2. \nHand tools \n3.3. \nTorque wrenches \n3.4. \nPower or pneumatic impact guns/wrenches \n3.5. \nLifting equipment \n3.6. \nMechanized or manual Conveyors \n3.7. \nTow motors \n3.8. \nForklifts \n3.9. \nRobotic equipment \n3.10. Hand pallet truck (manual and mechanized)\n4. Standard operation \nsheet \nType of standard operation sheet may include: \n4.1. \nProcedural  \n4.2.\nElemental\n5. Hardware parts \nHardware parts may include and but not limited to: \n5.1. \nNuts \n5.2. \nBolts \n5.3. \nScrews \n5.4. \nFasteners \n5.5.\nWashers\n6. Engineering manuals \n6.1. \nVehicle assembly manuals per model-variants  \n6.2. \nVehicle quality standard manuals per model-\nvariant \n6.3. \nProcess control Chart/sheets \n6.4. \nVehicle Specification sheets \n6.5.\nMaterials/Parts list\n\n--- PDF PAGE 37 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            34\n \n \n \n7. Assemblies  \nParts for mechanical assemblies include and but not \nlimited to: \n7.1. Suspension assembly \n Coil spring \n Shock absorber \n Suspension bushing \n Metal parts/components \n7.2. Power drive assembly \n Bare Engine assembly \n Transmission assembly \n Pressure plate \n Clutch disc \n Intake and exhaust manifold \n Primary muffler \n Catalytic converter \n Air conditioning compressor \n Belt drive \n7.3. Fuel tank assembly \n Fuel tank \n Floater \n Pump \n7.4. Brake, clutch and accelerator pedals assembly \n Bracket \n Pedal and bushing \n7.5. Radiator cooling system assembly \n Radiator  \n Metal brackets \n Inlet, outlet and return water hoses \n7.6. Air conditioning system  \n Condenser assembly \n Expansion valve \n Evaporator assembly \n Evaporator housing \n7.7. Front and rear bumpers assembly \n Bumper fascia \n Insulation \n7.8. Wheel assembly \n Tires \n Steel or aluminum alloy rim  \n Tire valve  \n7.9. Windshield and door glasses  assembly \n Dam rubber kit \n\nDoor glass holders\n\n--- PDF PAGE 38 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            35\n EVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Obtained parts and materials for the job. \n1.2. Interpreted materials/parts list and engineering \ndrawings with the requirements for the job. \n1.3. Selected appropriate parts, materials and set of tools \nand equipment. \n1.4. Assembled parts to form assemblies in accordance \nwith the specification. \n1.5. Ensured specified nuts, bolts and screws are tensioned \nto the specified torque requirements.  \n1.6. Employed safe working practices.\n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Read and interpret engineering drawings \n2.2. Components and their purpose within the assembly  \n2.3. Particular application or use of material handling \nequipment \n2.4. Company policies and procedures \n2.5. Company OH&S procedures \n2.6. Maintenance and calibration of Torque wrench  \n2.7. Work values and ethics  \n2.8. Punctuality\n3. Underpinning skills \n3.1. Parts/materials differentiation and classification \n3.2. Proper use of impact guns and torque wrenches \n3.3. Perform routine workplace duties following simple \nwritten notices \n3.4. Participate in workplace meetings and discussions \n3.5. Complete work related documents \n3.6. Computing basic mathematical operation of addition, \nsubtraction, division and multiplication \n3.7. Gather and provide information in response to \nworkplace requirements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. Parts/materials relevant with the requirements for the \njob. \n4.2. Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3. Supplies and consumable materials \n4.4. Engineering manuals and drawings\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation with questioning \n5.2. Oral interview and written test \n5.3. Portfolio assessment\n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the actual \nworkplace or a simulated workplace environment. \n6.2. Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without \ndirect supervision.\n",
