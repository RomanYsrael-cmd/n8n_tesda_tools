        "evidence_guide": {
          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning\nskills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the work\nactivities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n8\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:"
        },
        "source_text": "500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe\nteam’s role\nand scope\n1.1\nThe role and objective of the team is identified from available\nsources of information\n1.2\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources\n2. Identify own\nrole and\nresponsibility\nwithin the\nteam\n2.1\nIndividual role and responsibilities within the team environment\nare identified\n2.2\nRoles and responsibility of other team members are identified\nand recognized\n2.3\nReporting relationships within team and external to team are\nidentified\n3. Work as a\nteam\nmember\n3.1\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives\n3.2\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3\nObserved protocols in reporting using standard operating\nprocedures\n3.4\nContribute to the development of team work plans based on an\nunderstanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n6\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and\nobjective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgment maybe demonstrated\non the job, either individually or in a team environment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace\ncontext\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n7\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning\nskills\n3.1\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the work\nactivities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n8\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:"
