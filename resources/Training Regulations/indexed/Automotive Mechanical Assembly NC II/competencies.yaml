        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used appropriate tools and equipment\n1.2. Hardware parts are identified and selected to meet\nthe job requirements as stated in the materials/parts\nlist.\n1.3. Interpreted materials/parts list and engineering\nmanuals with the requirements for the job.\n1.4. Selected appropriate parts/materials\n1.5. Mounted/installed assemblies and parts to\nspecification.\n1.6. Ensured specified nuts, bolts and screws are\ntensioned to the specified torque requirements\n1.7.\nEmployed safe working practices\n2. Underpinning\nknowledge and\nattitudes\n\n2.1. Read and interpret engineering manuals\n2.2. Components and their purpose within the assembly\n2.3. Particular application or use of material handling\nequipment\n2.4. Company policies and procedures\n2.5. Company OH&S procedures\n2.6. Maintenance and calibration of Torque wrench\n2.7. Work values and ethics\n2.8.\nPunctuality at workplace area\n3. Underpinning skills\n3.1. Parts/materials differentiation and classification\n3.2. Proper use of pneumatic impact guns and torque\nwrenches\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.6. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Parts/materials relevant with the requirements for the\njob.\n4.2. Tools, equipment and workplace relevant with the\nrequirements for the job.\n4.3. Supplies and consumable materials\n4.4.\nEngineering manuals\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1. Direct Observation on or off-the-job\n5.2. Oral interview and written test\n5.3.\nPortfolio assessment\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the\nactual workplace or a simulated workplace\nenvironment.\n6.2. Practical skills must take place only after a period of\nsupervised practice and repetitive experience.\n6.3. Prescribe outcome must be able to achieve without\ndirect supervision.\n\n--- PDF PAGE 48 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 45\nUNIT OF COMPETENCY: INSTALL/FIT OUT TRIM PARTS AND ASSEMBLIES\n\nUNIT CODE\n :"
        },
        "source_text": "ALT827310\n\nUNIT DESCRIPTOR : This unit identifies the competence required to mount/install\nparts/components and assemblies of suspension drive train\nto automotive vehicle body in accordance with company\nstandards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and\nuse tools and\nequipment\n1.1\nTools and equipment are selected to meet job\nrequirements.\n1.2\nTools and equipment are checked to ensure they are in\ngood working order.\n1.3\nAppropriate lifting hangers/gears are selected and used in\naccordance with OH&S requirements.\n2. Select and\nuse hardware\nparts\n2.1\nHardware parts are identified and selected to meet the job\nrequirements as stated in the materials/parts list.\n2.2\nHardware parts are fitted in the required number to the\ndesignated positions stated in the materials/parts list and\nassociated engineering manuals.\n3. Mount/install\nassemblies\nand parts\n3.1\nMaterials/parts list and engineering drawings are correctly\nread and interpreted.\n3.2\nParts are matched with the materials/parts list for the\nparticular requirements for the job.\n3.3\nAssemblies and parts are positioned and secured into\nautomotive vehicle body as per the relevant drawings and\nstandard operation sheet.\n3.4\nSpecified nuts, bolts and screws are tensioned to the\nspecified torque requirements stated in the engineering\nmanuals and standard operating sheet\n3.5\nIdentified faults are recorded, reported and\nrectified/scrapped in accordance with company procedures.\n3.6\nWorkflow and production output are recorded and\nmaintained\n\n--- PDF PAGE 46 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 43\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Tools and equipment\n1.1.\nHand tools\n1.2.\nTorque wrenches\n1.3.\nPower or pneumatic impact guns/wrenches\n1.4.\nLifting equipment\n2. Hardware parts\nHardware parts may include and but not limited to:\n2.1.\nNuts\n2.2.\nBolts\n2.3.\nScrews\n2.4.\nFasteners\n2.5.\nWashers\n3. Engineering manuals\n3.1.\nVehicle assembly manuals per model-variant\n3.2.\nVehicle quality standard manuals per model-\nvariant\n3.3.\nProcess control Chart/sheets\n3.4.\nVehicle Specification sheets\n3.5.\nMaterials/Parts list\n4. Requirements for the\nJob\n4.1.\nProduction schedule\n4.2.\nWork Order\nNote: A work order is a form of instruction that is\nbroadcasted either by manual or by electronic\nsystem by preceding stations to the next stations\nregarding on what model sequence to produce on\na timely-structured manner.\n5. Assemblies and parts\nMechanical assemblies include and but not limited to:\n5.1.\nSuspension\n5.2.\nWheel assembly\n5.3.\nSteering assembly system – gear box or rack and\npinion type\nMechanical parts include and but not limited to:\n5.4.\nAxle drive\n5.5.\nRotor disc\n5.6.\nStabilizer bars\n5.7.\nTorsion bars\n6. Automotive vehicle\nbody\n6.1.\nPassenger car\n6.2.\nUtility vehicle\n7. Standard operation\nsheet\nType of standard operation sheet may include:\n7.1.\nProcedural\n7.2.\nElemental\n\n--- PDF PAGE 47 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 44\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used appropriate tools and equipment\n1.2. Hardware parts are identified and selected to meet\nthe job requirements as stated in the materials/parts\nlist.\n1.3. Interpreted materials/parts list and engineering\nmanuals with the requirements for the job.\n1.4. Selected appropriate parts/materials\n1.5. Mounted/installed assemblies and parts to\nspecification.\n1.6. Ensured specified nuts, bolts and screws are\ntensioned to the specified torque requirements\n1.7.\nEmployed safe working practices\n2. Underpinning\nknowledge and\nattitudes\n\n2.1. Read and interpret engineering manuals\n2.2. Components and their purpose within the assembly\n2.3. Particular application or use of material handling\nequipment\n2.4. Company policies and procedures\n2.5. Company OH&S procedures\n2.6. Maintenance and calibration of Torque wrench\n2.7. Work values and ethics\n2.8.\nPunctuality at workplace area\n3. Underpinning skills\n3.1. Parts/materials differentiation and classification\n3.2. Proper use of pneumatic impact guns and torque\nwrenches\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.6. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Parts/materials relevant with the requirements for the\njob.\n4.2. Tools, equipment and workplace relevant with the\nrequirements for the job.\n4.3. Supplies and consumable materials\n4.4.\nEngineering manuals\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1. Direct Observation on or off-the-job\n5.2. Oral interview and written test\n5.3.\nPortfolio assessment\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the\nactual workplace or a simulated workplace\nenvironment.\n6.2. Practical skills must take place only after a period of\nsupervised practice and repetitive experience.\n6.3. Prescribe outcome must be able to achieve without\ndirect supervision.\n\n--- PDF PAGE 48 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 45\nUNIT OF COMPETENCY: INSTALL/FIT OUT TRIM PARTS AND ASSEMBLIES\n\nUNIT CODE\n :"
      },
