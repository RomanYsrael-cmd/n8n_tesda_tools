        "source_title": "PERFORM FINAL ENGINE RUN",
        "source_text": "--- PDF PAGE 51 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            48\nUNIT OF COMPETENCY:    PERFORM FINAL ENGINE RUN \n \nUNIT CODE \n     :   ALT827 312     \n \nUNIT DESCRIPTOR      : This unit identifies the competence required for the \nservicing of vehicle after assembly operations. Service \nincludes the addition and/or application of fluids and \nlubricants and the bleeding of air and hydraulic system in \naccordance with specifications and company procedures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Select and \nuse tools and \nequipment \n1.1 \nTools and equipment are selected to meet job \nrequirements. \n1.2 \nTools and equipment are checked to ensure they are in \ngood working order.\n2. Select and \nuse lubricants \nand fluids \n2.1 \nLubricants and fluids are selected and matched to the \nvehicle by codes and numbers as stated on the lubrication \ndata sheets/material lists. \n2.2 \nLubricants and fluids are used on the identified parts of the \nvehicle as stated on the lubrication data sheets/material lists.\n2.3 \nReservoirs and mechanical assemblies are filled with the \nidentified lubricant/fluid to levels specified in the lubrication \ndata sheets. \n2.4 \nExcess lubricants and fluids are removed in accordance with \nthe company quality control standards. \n2.5 \nLubricants and fluids are used in accordance with company \nOH&S procedures.\n3. Bleed air and \nhydraulic \nsystem \n3.1 \nBleeding points for air and hydraulic system are located as \nshown in the engineering manuals. \n3.2 \nWorkflow and production output are recorded and \nmaintained.\n4. Record and \nreport faults \n4.1 \nAppropriate forms are selected for recording and reporting \nidentified faults. \n4.2 \nRelevant forms are completed and maintained in \naccordance with company procedures. \n4.3\nFaults are reported to appropriate personnel for action.\n\n--- PDF PAGE 52 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            49\n RANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Tools and equipment \n1.1. \nHand tools \n1.2. \nPower or pneumatic impact guns/wrenches \n1.3. \nLifting equipment \n1.4. \nVehicle protection cover \n1.5. \nManual air and hydraulic pressurized lubrication \nequipment \n1.6. \nBleeding tools \n2. Lubricants and fluids \nLubricants and fluids include and but not limited to: \n2.1. \nEngine oils \n2.2. \nTransmission oils \n2.3. \nBrake fluid \n2.4. \nPower Steering fluid \n2.5. \nCoolants \n3. Engineering manuals \n3.1. \nVehicle assembly manuals per model-variant \n3.2. \nVehicle quality standard manuals per model-\nvariant \n3.3. \nProcess control Chart/sheets \n3.4. \nVehicle Specification sheets \n3.5. \nMaterials/Parts list \n4. Appropriate forms \nForms include and but not limited to: \n4.1. \nVehicle inspection card \n4.2. \nQuality defect feedback form\n\n--- PDF PAGE 53 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            50\n EVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Read and interpreted work order. \n1.2. Selected and used appropriate lubricants, special \nfluids and coolants. \n1.3. Selected and used relevant tools and equipment. \n1.4. Serviced air and hydraulic system/components. \n1.5.\nEmployed safe working practices.\n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Lubricants and fluids differentiation and \nclassification. \n2.2. Types and characteristic of lubricants and fluids \nused within the operating system  \n2.3. Company policies and procedures \n2.4. Company OH&S procedures \n2.5. Maintenance and calibration of Torque wrench  \n2.6. Work values and ethics  \n2.7.\nPunctuality at workplace area\n3. Underpinning skills \n3.1. Read and interpret engineering manuals \n3.2. Proper use of hydraulic pressurized equipment  \n3.3. Participate in workplace meetings and discussions \n3.4. Complete work related documents \n3.5. Compute basic mathematical operation of addition, \nsubtraction, division and multiplication \n3.6. Gather and provide information in response to \nworkplace requirements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. Lubricants and fluids relevant with the requirements \nfor the job. \n4.2. Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3. Supplies and consumable materials \n4.4. Engineering manuals  \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation on or off-the-job \n5.2. Oral interview and written test \n5.3. Portfolio assessment \n6. Context of \nassessment \n6.1. Competency may be assessed individually in the \nactual workplace or a simulated workplace \nenvironment. \n6.2. Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without \ndirect supervision.\n",
