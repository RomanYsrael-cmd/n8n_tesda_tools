Gas mask\n4. Safety \nSafety includes: \n4.1 Ventilation \n4.2 Handling of Flammable/Irritating  substances \n4.3 Use of Personal Protective Equipment\n5. Hazards \n Hazard includes: \n5.1 Fumes \n5.2 Skin irritation \n5.3 Burns\n\n--- PDF PAGE 30 ---\nTR Automotive Mechanical Assemblies NC II                Promulgated \n27"
