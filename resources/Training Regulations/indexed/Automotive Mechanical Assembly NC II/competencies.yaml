        "source_text": "ALT827308\n\nUNIT DESCRIPTOR :\nThis unit identifies the competence required to\nmount/install assemblies and parts of brake and fuel\nsystems to automotive vehicle body in accordance with\ncompany standards.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nSelect and\nuse tools and\nequipment\n1.1 Tools and equipment are selected to meet job\nrequirements.\n1.2 Tools and equipment are checked to ensure they are in good\nworking order.\n1.3 Appropriate lifting hoist/hangers/gears are selected and used\nin accordance with OH&S requirements.\n2\nSelect and\nuse hardware\nparts\n2.1 Hardware parts are identified and selected to meet the job\nrequirements as stated in the materials/parts list.\n2.2 Hardware or small parts are fitted in the required number to\nthe designated positions stated in the materials/parts list and\nassociated engineering manuals.\n3\nMount/install\nassemblies\nand parts\n3.1 Materials/parts list and engineering drawings are correctly\nread and interpreted.\n3.2 Parts/components are matched with the materials/parts list\nfor the particular requirements for the job.\n3.3 Assemblies and parts are positioned and secured into\nautomotive vehicle body as per the relevant drawings and\nstandard operation sheet.\n3.4 Specified nuts, bolts and screws are tensioned to the\nspecified torque requirements stated in the engineering\nmanuals and standard operating sheet\n3.5 Identified faults are recorded, reported and rectified/scrapped\nin accordance with company procedures.\n4\nRoute service\nlines\n4.1 Materials/parts list and engineering manuals are correctly\nread and interpreted.\n4.2 Appropriate hardware parts are selected and used according\nto specifications.\n4.3 Service lines are routed, tied and clipped to specification.\n4.4 Workflow and production output are recorded and\nmaintained.\n\n--- PDF PAGE 40 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 37\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Tools and equipment\n1.1.\nHand tools\n1.2.\nTorque wrenches\n1.3.\nPower or pneumatic impact guns/wrenches\n1.4.\nLifting equipment\n2. Hardware parts\nHardware parts may include and but not limited to:\n2.1.\nNuts\n2.2.\nBolts\n2.3.\nScrews\n2.4.\nFasteners\n2.5.\nWashers\n3. Engineering manuals\n3.1.\nVehicle assembly manuals per model-variant\n3.2.\nVehicle quality standard manuals per model-\nvariant\n3.3.\nProcess control Chart/sheets\n3.4.\nVehicle Specification sheets\n3.5.\nMaterials/Parts list\n4. Requirements for the\nJob\n4.1.\nProduction Schedule\n4.2.\nWork Order\nNote: A work order is a form of instruction that is\nbroadcasted either by manual or by electronic\nsystem by preceding stations to the next stations\nregarding on what model sequence to produce on\na timely-structured manner.\n5. Assemblies/parts/\ncomponents\nMechanical assemblies include and but not limited to:\n5.1.\nFuel tank\n5.2.\nBrake pedal\n5.3.\nClutch pedal\n5.4.\nAccelerator pedal\nMechanical parts/components include and but not limited\nto:\n5.5.\nFuel filter\n5.6.\nBrake booster\n5.7.\nBrake master cylinder\n5.8.\nBrake and fuel pipes\n5.9.\nBrake and fuel valves\n5.10. Brake caliper disc\n5.11. Anti brake system kit\n5.12. Brake drum\n6. Automotive vehicle\nbody\n6.1.\nPassenger car\n6.2.\nUtility Vehicle\n7. Standard operation\nsheet\nType of standard operation sheet may include:\n7.1.\nProcedural\n7.2.\nElemental\n8. Service lines\n8.1.\nBrake (hydraulic) lines\n8.2.\nFuel lines\n\n--- PDF PAGE 41 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 38\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used appropriate tools and equipment\n1.2. Hardware parts are identified and selected to meet\nthe job requirements as stated in the materials/parts\nlist.\n1.3. Interpreted materials/parts list and engineering\nmanuals with the requirements for the job.\n1.4. Selected appropriate parts/materials\n1.5. Mounted/installed assemblies and parts to\nspecification.\n1.6. Ensured specified nuts, bolts and screws are\ntensioned to the specified torque requirements\n1.7.\nEmployed safe working practices.\n2. Underpinning\nknowledge and\nattitudes\n\n2.1. Read and interpret engineering manuals\n2.2. Components and their purpose within the assembly\n2.3. Company policies and procedures\n2.4. Company OH&S procedures\n2.5. Maintenance and calibration of Torque wrench\n2.6. Work values and ethics\n2.7. Punctuality at workplace area\n3. Underpinning skills\n3.1. Parts/materials differentiation and classification\n3.2. Proper use of pneumatic impact guns and torque\nwrenches.\n3.3. Perform routine workplace duties following simple\nwritten notices\n3.4. Participate in workplace meetings and discussions\n3.5. Complete work related documents\n3.6. Compute basic mathematical operation of addition,\nsubtraction, division and multiplication\n3.7. Gather and provide information in response to\nworkplace requirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Parts/materials relevant with the requirements for the\njob.\n4.2. Tools, equipment and workplace relevant with the\nrequirements for the job.\n4.3. Supplies and consumable materials\n4.4.\nEngineering manuals\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1. Direct Observation on or off-the-job\n5.2. Oral interview and written test\n5.3.\nPortfolio assessment\n6. Context of\nassessment\n6.1. Competency may be assessed individually in the\nactual workplace or a simulated workplace\nenvironment.\n6.2. Practical skills must take place only after a period of\nsupervised practice and repetitive experience.\n6.3. Prescribe outcome must be able to achieve without\ndirect supervision.\n\n--- PDF PAGE 42 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 39\nUNIT OF COMPETENCY: MOUNT/INSTALL POWER DRIVE SYSTEM\n\nUNIT CODE\n :"
      },
