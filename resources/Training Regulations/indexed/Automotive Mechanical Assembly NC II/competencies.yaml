        "evidence_guide": {
          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the course of\nmanaging oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning\nskills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra- and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n11\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:"
        },
        "source_text": "500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance evaluation\n1.3\nCommitment to the organization and its goal is demonstrated in\nthe performance of duties\n2. Set and meet\nwork priorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and availed\nof based on job requirements\n3.2\nRecognitions are sought/received and demonstrated as proof\nof career advancement\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed\n\n--- PDF PAGE 13 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n9\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance appraisal\n1.2\nPsychological profile\n1.3\nAptitude tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings\nand career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing education\n3.2\nServing as resource persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and intangible rewards\n5. Licenses\nand/or\ncertifications\n5.1\nNational certificates\n5.2\nCertificate of competency\n5.3\nSupport level licenses\n5.4\nProfessional licenses\n\n--- PDF PAGE 14 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n10\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the course of\nmanaging oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning\nskills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra- and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n11\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:"
