.4 Vehicle specification manual\n\n--- PDF PAGE 24 ---\nTR Automotive Mechanical Assemblies NC II                Promulgated \n22\n           EVIDENCE GUIDE \n \n1.Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Identified and accessed manual/specification \n1.2 Interpreted manuals \n1.3 Applied information in manuals \n1.4 Stored manuals \n2. Underpinning  \nknowledge  \n2.1 Types of manuals used in automotive industry \n2.2 Identification of symbols used in the manuals \n3.1  Identification of units of measurements \n3.2 Unit conversion\n3. Underpinning \nskills \n3.1 Reading and comprehension skills required to identify and \ninterpret automotive manuals and specifications \n3.2 Accessing information and data\n4. Resource \nImplications \n \nThe following resources MUST be provided: \n4.1  All manuals/catalogues relative to Automotive \n4.2  Work order \n4.3  Actual vehicle or simulator \n5. Method of \nassessment \n \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Interview  \n6. Context of \nassessment  \n \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n       simulated environment.\n",
