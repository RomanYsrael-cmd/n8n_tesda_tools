ay include and but not limited to: \n2.1. \nNuts \n2.2. \nBolts \n2.3. \nScrews \n2.4. \nFasteners \n2.5.\nWashers\n3. Engineering manuals \n3.1. \nVehicle assembly manuals per model-variant  \n3.2. \nVehicle quality standard manuals per model-\nvariant \n3.3. \nProcess control Chart/sheets \n3.4. \nVehicle Specification sheets \n3.5.\nMaterials/Parts list \n4. Requirements for the \nJob \n4.1. \nProduction Schedule \n4.2. \nWork Order \nNote:  A work order is a form of instruction that is \nbroadcasted either by manual or by electronic \nsystem by preceding stations to the next stations \nregarding on what model sequence to produce on \na timely-structured manner. \n5. Assemblies/parts/ \ncomponents \nMechanical assemblies include and but not limited to: \n5.1. \nFuel tank \n5.2. \nBrake pedal  \n5.3. \nClutch pedal \n5.4. \nAccelerator pedal \nMechanical parts/components include and but not limited \nto: \n5.5. \nFuel filter \n5.6. \nBrake booster \n5.7. \nBrake master cylinder \n5.8. \nBrake and fuel pipes \n5.9. \nBrake and fuel valves \n5.10. Brake caliper disc \n5.11. Anti brake system kit \n5.12. Brake drum\n6. Automotive vehicle \nbody \n6.1. \nPassenger car \n6.2. \nUtility Vehicle \n7. Standard operation \nsheet \nType of standard operation sheet may include: \n7.1. \nProcedural  \n7.2.\nElemental\n8. Service lines \n8.1. \nBrake (hydraulic) lines \n8.2.\nFuel lines\n\n--- PDF PAGE 41 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            38"
