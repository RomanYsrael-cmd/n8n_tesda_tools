        "evidence_guide": {
          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned workshop tools/facilities\n1.2 Maintained equipment, tools and facilities\n1.3 Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Underpinning\nknowledge\nand attitudes\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n5.3 Assessment of underpinning knowledge and practical skills\n may be combined.\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 34 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 31\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nASSEMBLE MECHANICAL ASSEMBLIES USING\nJIGS/FIXTURES\nUNIT CODE\n :"
        },
        "source_text": "ALT723205\n\nUNIT DESCRIPTOR : This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and\nchecking of tools/equipment and disposal of used\nmaterials are also incorporated in this competency\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n.1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop\nequipment\n\n1.5 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n3. Dispose\nwastes/used\nlubricants\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared has no error/discrepancy\n\n--- PDF PAGE 32 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n29\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning\n requirement\n1.1 Cleaning solvent\n1.2 Inventory of supplies, tools, equipment, facilities\n1.3 List of mechanics/technicians\n1.4 Rags\n1.5 Broom\n1.6 Map\n1.7 Pail\n1.8 Used oil container\n1.9 Oiler\n1.10 Dust/waste bin\n2. Work Area\nWork areas include:\n2.1 Workshop areas for assembly of automotive vehicle and/or\noutdoor power equipment\n2.2 Open workshop and enclosed, ventilated office area\n2.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n\n--- PDF PAGE 33 ---\nTR Automotive Mechanical Assemblies NC II Promulgated\n30\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned workshop tools/facilities\n1.2 Maintained equipment, tools and facilities\n1.3 Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Underpinning\nknowledge\nand attitudes\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n5.3 Assessment of underpinning knowledge and practical skills\n may be combined.\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 34 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 31\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nASSEMBLE MECHANICAL ASSEMBLIES USING\nJIGS/FIXTURES\nUNIT CODE\n :"
