        "source_title": "PERFORM WHEEL ALIGNMENT OPERATIONS",
        "source_text": "--- PDF PAGE 54 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            51\nUNIT OF COMPETENCY:    PERFORM WHEEL ALIGNMENT OPERATIONS \n \nUNIT CODE \n     :   ALT827313   \n \nUNIT DESCRIPTOR      : This unit identifies the competence required to perform \nwheel alignment operations within the motor vehicle \nassembly industry. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare for \nthe job \n1.1 Work specification is read and interpreted to determine \nalignment process. \n1.2 Wheel alignment pre-checks are completed in accordance \nwith company procedures. \n1.3 Tools and equipment are determined and the alignment \nmeasuring equipment is connected to the vehicle.\n2. Perform wheel \nalignment \n2.1 Wheel alignment equipment information is accessed and \ninterpreted from manufacturer specifications. \n2.2 Wheel alignment procedures are undertaken in accordance \nwith company procedures. \n2.3 Adjustments are undertaken in accordance with the vehicle \nand equipment manufacturer’s specifications. \n2.4 Wheel alignment procedures are carried out and \ndocumentation completed in accordance with company \nprocedures/policies.\n\n--- PDF PAGE 55 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            52\n RANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Tools and equipment \n1.1. \nHand tools \n1.2. \nPower or pneumatic impact guns/wrenches \n1.3. \nSpecial tools \n1.4. \nMechanical equipment \n1.5. \nHydraulic lifter \n1.6. \nLaser wheel alignment equipment \n2. Company procedures \n2.1. \nEquipment manufacturer specifications \n2.2. \nVehicle manufacturer specifications \n2.3. \nWearing of personal protective equipment like: \n Hard hat \n Safety shoes \n Safety goggles \n Safety gloves \n Apron\n\n--- PDF PAGE 56 ---\nTR-Automotive Mechanical Assembly NC II         Promulgated                                            53\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Performed equipment set up for alignment \n1.2. Interpreted alignment information \n1.3. Aligned wheels to specifications \n1.4. Used relevant tools and equipment \n1.5. Completed documentation requirements \n1.6.\nEmployed safe working practices.\n2. Underpinning \nknowledge and \nattitudes \n \n2.1. Wheel alignment principles and purposes \n2.2. Equipment operating principles and alignment \nprocedures \n2.3. Company policies and procedures \n2.4. Company OH&S procedures \n2.5. Maintenance and calibration of Torque wrench  \n2.6. Work values and ethics  \n2.7.\nPunctuality at workplace area\n3. Underpinning skills \n3.1. Safe use of wheel alignment machine. \n3.2. Participate in workplace meetings and discussions \n3.3. Complete work related documents \n3.4. Compute basic mathematical operation of addition, \nsubtraction, division and multiplication \n3.5. Gather and provide information in response to \nworkplace requirements\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. Vehicle to be used for wheel alignment procedure. \n4.2. Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3. Supplies and consumable materials \n4.4. Engineering manuals  \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1. Direct Observation on or off-the-job \n5.2. Oral interview and written test \n5.3. Portfolio assessment \n6. Context of \nassessment \n6.1. Competency may be assessed individually in the \nactual workplace or a simulated workplace \nenvironment. \n6.2. Practical skills must take place only after a period of \nsupervised practice and repetitive experience. \n6.3. Prescribe outcome must be able to achieve without \ndirect supervision.\n",
