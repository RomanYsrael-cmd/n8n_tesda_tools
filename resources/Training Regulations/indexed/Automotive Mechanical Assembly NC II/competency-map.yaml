  "source_text": "COMPETENCY MAP- AUTOMOTIVE SECTOR\nMANUFACTURING SUB SECTOR\n(ASSEMBLY)\n\nAUTOMOTIVE MECHANICAL ASSEMBLY NC II\n\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nAUTOMOTIVE MECHANICAL ASSEMBLIES NC II\nLegend:\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nPerform Mensuration\nand Calculation\nRead, Interpret and Apply\nEngineering Manual and\nSpecifications\nMove and Position\nVehicle\nApply Appropriate\nSealant/Adhesives\nInstall/Fit out Electrical\nParts to Engine\nAssembly\nANNEX A\nAssemble Mechanical\nAssemblies Using Jigs/\nFixtures\nMount/ Install Brake\nFuel System\nMount/ Install\nSuspension Drive\nSystem\nMount/ Install Power\nDrive System\nInstall/Fit Trim\nParts/Components\nPerform Final Engine\nRun\nPerform Wheel\nAlignment Operation\nPerform Shop\nMaintenance\nInstall/Fit out Electronic\nUnits to Body Interior\nComponents\nInstall/Fit out Electrical\nParts & Electronic Units to\nDash Board Instrument\nPanel\nInstall/Fit out Electrical\nParts to Exterior and\nEngine Compartment\nInstall/Fit out Audio and\nVideo Systems\nPerform Headlight\nFocus Aiming Operation\n\n--- PDF PAGE 67 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 64",
