    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE MECHANICAL ASSEMBLY\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n105 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive manufacturing in accordance with industry\nstandards. It covers competencies such as: Assemble and mount/install mechanical\nassemblies and parts/components such as brake and fuel systems, power drive system,\nsuspension drive system and trim parts and assemblies into automotive vehicle body in\naccordance with manufacturer’s specification. It also covers competencies to perform\nfinal engine run and wheel alignment operations.\n.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n\n--- PDF PAGE 58 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 55\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\nproblems\n3.3 Maintain professional\ngrowth and development\n• Interactive\nlecture\n• Structure\nactivity\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Interactive\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Film viewing\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand calculation\n1.1 Select measuring\ninstruments\n1.2 Carry out measurements\nand calculation\n1.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n2. Read, interpret\nand apply\nengineering\nmanuals /\nspecifications\n2.1 Identify/access\nengineering manuals /\nspecification\n2.2 Interpret manual\n2.3 Apply information in\nmanual\n2.4 Store manuals\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n3. Move and\nposition vehicle\n3.1 Prepare vehicle for\ndriving\n3.2 Move and position\nvehicle\n3.3 Check the vehicle\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n--- PDF PAGE 59 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 56\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Apply\nappropriate\nsealant /\nadhesive\n4.1 Identify appropriate\nsealant/ adhesive\n4.2 Prepare surface for\nsealant / adhesive\napplication\n4.4 Store unused and\ndispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n• Project\nmethod\n5. Perform shop\nmaintenance\n5.1 Inspect/clean tools and\nwork area\n5.2 Store/arrange tools and\nshop equipment\n5.3 Dispose waste/used\nlubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n\nCORE COMPETENCIES\n(105 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Assemble\nmechanical\nassemblies\nusing\njigs/fixtures\n1.1\nObtain materials/parts\nfor job\n1.2 Select and use tools and\nequipment\n1.3 Load and unload parts\ninto assembly\njigs/fixtures\n1.4 Select and use\nadhesives, sealants and\nsolvents\n1.5 Select and use hardware\nparts\n1.6 Assemble mechanical\nassemblies\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n2. Mount/install\nbrake and fuel\nsystems\n\n2.1\nSelect and use tools and\nequipment\n2.2 Select and use hardware\nparts\n2.3 Mount/install assemblies\nand parts\n2.4\nRoute service lines\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n3. Mount/install\npower drive\nsystem\n3.1\nSelect and use tools and\nequipment\n3.2 Select and use hardware\nparts\n3.3 Mount/install assemblies\nand parts\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n\n--- PDF PAGE 60 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 57\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3.4 Route service lines\n4. Mount/install\nsuspension\ndrive train\n4.1 Select and use tools and\nequipment\n4.2 Select and use hardware\nparts\n4.3 Mount/install assemblies\nand parts\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n5. Install/Fit out\ntrim parts and\nassemblies\n5.1 Select and use tools and\nequipment\n5.2 Select and use hardware\nparts\n5.3 Install/fit out assemblies\nand parts\n5.4 Select and use\nadhesives, sealants ad\nsolvents\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n6. Perform final\nengine run\n6.1 Select and use tools and\nequipment\n6.2 Select and use\nlubricants and fluids\n6.3 Bleed air and hydraulic\nsystem\n6.4 Record and report faults\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n7. Perform wheel\nalignment\noperations\n\n7.1\nPrepare for the job\n7.2 Perform wheel alignment\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n•Portfolio\n\n--- PDF PAGE 61 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 58"
