      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for AUTOMOTIVE MECHANICAL\nASSEMBLY NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE MECHANICAL ASSEMBLY\nNC Level NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n105 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive manufacturing in accordance with industry\nstandards. It covers competencies such as: Assemble and mount/install mechanical\nassemblies and parts/components such as brake and fuel systems, power drive system,\nsuspension drive system and trim parts and assemblies into automotive vehicle body in\naccordance with manufacturer’s specification. It also covers competencies to perform\nfinal engine run and wheel alignment operations.\n.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Case studies\n• Simulation\n\n• Written test\n• Observation\n• Simulation\n• Role playing\n\n--- PDF PAGE 58 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 55\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\nproblems\n3.3 Maintain professional\ngrowth and development\n• Interactive\nlecture\n• Structure\nactivity\n• Simulation\n• Demonstration\n• Self-paced\ninstruction\n• Role play\n• Interview\n• Written\nexamination\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Interactive\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Film viewing\n• Situational\nanalysis\n• Interview\n• Practical\nexamination\n• Written exam\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand calculation\n1.1 Select measuring\ninstruments\n1.2 Carry out measurements\nand calculation\n1.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n2. Read, interpret\nand apply\nengineering\nmanuals /\nspecifications\n2.1 Identify/access\nengineering manuals /\nspecification\n2.2 Interpret manual\n2.3 Apply information in\nmanual\n2.4 Store manuals\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n3. Move and\nposition vehicle\n3.1 Prepare vehicle for\ndriving\n3.2 Move and position\nvehicle\n3.3 Check the vehicle\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n\n--- PDF PAGE 59 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 56\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Apply\nappropriate\nsealant /\nadhesive\n4.1 Identify appropriate\nsealant/ adhesive\n4.2 Prepare surface for\nsealant / adhesive\napplication\n4.4 Store unused and\ndispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n• Project\nmethod\n5. Perform shop\nmaintenance\n5.1 Inspect/clean tools and\nwork area\n5.2 Store/arrange tools and\nshop equipment\n5.3 Dispose waste/used\nlubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n\nCORE COMPETENCIES\n(105 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Assemble\nmechanical\nassemblies\nusing\njigs/fixtures\n1.1\nObtain materials/parts\nfor job\n1.2 Select and use tools and\nequipment\n1.3 Load and unload parts\ninto assembly\njigs/fixtures\n1.4 Select and use\nadhesives, sealants and\nsolvents\n1.5 Select and use hardware\nparts\n1.6 Assemble mechanical\nassemblies\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n2. Mount/install\nbrake and fuel\nsystems\n\n2.1\nSelect and use tools and\nequipment\n2.2 Select and use hardware\nparts\n2.3 Mount/install assemblies\nand parts\n2.4\nRoute service lines\n•Lecture/\nDemonstration\n• Dual training\n\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n3. Mount/install\npower drive\nsystem\n3.1\nSelect and use tools and\nequipment\n3.2 Select and use hardware\nparts\n3.3 Mount/install assemblies\nand parts\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n\n--- PDF PAGE 60 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 57\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3.4 Route service lines\n4. Mount/install\nsuspension\ndrive train\n4.1 Select and use tools and\nequipment\n4.2 Select and use hardware\nparts\n4.3 Mount/install assemblies\nand parts\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n5. Install/Fit out\ntrim parts and\nassemblies\n5.1 Select and use tools and\nequipment\n5.2 Select and use hardware\nparts\n5.3 Install/fit out assemblies\nand parts\n5.4 Select and use\nadhesives, sealants ad\nsolvents\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n6. Perform final\nengine run\n6.1 Select and use tools and\nequipment\n6.2 Select and use\nlubricants and fluids\n6.3 Bleed air and hydraulic\nsystem\n6.4 Record and report faults\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n• Portfolio\n7. Perform wheel\nalignment\noperations\n\n7.1\nPrepare for the job\n7.2 Perform wheel alignment\n•Lecture/\nDemonstration\n• Dual training\n•Demonstration\nw/ questioning\n• Observation w/\nquestioning\n• Interview\n•Portfolio\n\n--- PDF PAGE 61 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 58\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 62 ---\nTR-Automotive Mechanical Assembly NC II Promulgated 59\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate both oral and written;\n• physically and mentally fit;\n• with good moral character; and\n• with experience in basic machining.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE MECHANICAL ASSEMBLY NC II\n\nRecommended list 