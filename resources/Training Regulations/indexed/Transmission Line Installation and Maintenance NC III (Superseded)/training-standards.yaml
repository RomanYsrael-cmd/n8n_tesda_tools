    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC III\n\nNominal Training Duration:\n_30 Hours (Basic )\n 60 Hours ( Common )\n120 Hours (Core)\n\n210 Hours\nCourse Description:\n\nThis course is designed to equip individuals with the basic and common\ncompetencies in Utilities sector for Transmission Line Installation and Maintenance\nNC III level.\n\nTo obtain these, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n(30 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 52 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n50\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance\nrelevant technology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(60 hours)\n\nSECTOR : UTILITIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Quality\nStandards\n1.1 Check materials and replace\nfaulty ones in accordance\nwith workplace standards\nand requirements\n1.2 Carry out work assignments\nin accordance with standard\noperating procedures\n1.3 Check completed work\nagainst standards and\nspecifications\n1.4 Document and prepare a\nreport on deviations from\nspecific quality standards\n\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party Report\n\n--- PDF PAGE 53 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n51\n3.1 Comply with\nenvironmental\nprotection\nprocedures\n2.1 Access information\nconcerning environmental\nprotection regulations and\nprocedures\n2.2 Implement and monitor\nprocedures concerning\nenvironmental hazards\n2.3 Implement and monitor\nenvironmental control\nprocedures\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n▪\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party Report\n▪\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof\nInstructions\n3.2 Identify and access\nspecification/ 