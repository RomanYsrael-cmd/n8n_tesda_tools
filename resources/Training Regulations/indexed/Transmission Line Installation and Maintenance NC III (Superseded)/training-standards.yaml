  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Transmission Line Installation and\nMaintenance NC III.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC III\n\nNominal Training Duration:\n_30 Hours (Basic )\n 60 Hours ( Common )\n120 Hours (Core)\n\n210 Hours\nCourse Description:\n\nThis course is designed to equip individuals with the basic and common\ncompetencies in Utilities sector for Transmission Line Installation and Maintenance\nNC III level.\n\nTo obtain these, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n(30 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 52 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n50\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance\nrelevant technology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(60 hours)\n\nSECTOR : UTILITIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Quality\nStandards\n1.1 Check materials and replace\nfaulty ones in accordance\nwith workplace standards\nand requirements\n1.2 Carry out work assignments\nin accordance with standard\noperating procedures\n1.3 Check completed work\nagainst standards and\nspecifications\n1.4 Document and prepare a\nreport on deviations from\nspecific quality standards\n\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party Report\n\n--- PDF PAGE 53 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n51\n3.1 Comply with\nenvironmental\nprotection\nprocedures\n2.1 Access information\nconcerning environmental\nprotection regulations and\nprocedures\n2.2 Implement and monitor\nprocedures concerning\nenvironmental hazards\n2.3 Implement and monitor\nenvironmental control\nprocedures\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n▪\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party Report\n▪\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof\nInstructions\n3.2 Identify and access\nspecification/ manuals\n3.3 Interpret and apply\ninformation in manuals\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party Report\n\n3. Maintain and\noperate\ntransmission\nline tools and\nequipment\n4.1 Plan and prepare for work to\noperate and maintain T/L\ntools and equipment\n4.2 Prepare T/L hardware, tools\nand equipment for operation\nand maintenance\n4.3 Operate T/L tools and\nequipment\n4.4 Check condition of T/L tools\nand equipment\n4.5 Perform basic preventive\nmaintenance\n4.6 Store tools and equipment\n\n▪ Lecture\n▪ Discussion\n▪ Demonstration\n▪ Viewing\nmultimedia\n▪ Hands on\npractice\n\n▪ Observation in\nworkplace\n▪ Demonstration\n▪ Oral questioning\n▪ Third Party Report\n\n4. Operate a\nPersonal\nComputer\n5.1 Plan and prepare for task to\nbe undertaken\n5.2 Input data into computer\n5.3 Access information using\ncomputer\n5.4 Produce output/data using\ncomputer system\n5.5 Use basic functions of a\nweb browser to locate\ninformation\n5.6 Maintain computer\nequipment and systems\n• Modular\n• Film showing\n• Computer\nbased training\n(e-learning)\n• Project\nmethod\n• On the job\ntraining\n\n• Demonstration &\nquestioning\n• Observation &\nquestioning\n• Third party report\n• Assessment of\noutput product\n• Portfolio\n• Computer- based\nassessment\n\n--- PDF PAGE 54 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n52\nCORE COMPETENCIES\n\nCourse Title: TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC III\n\nNominal Training Duration: 120 Hours\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\ntransmission line installation and maintenance to be able to plan and implement\ntransmission line maintenance works as well as to inspect/assess transmission line\ncomponents’ conditions.\n\nTo obtain these, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Plan transmission\nline maintenance\njob\n\n1.1 Analyze work order\nfor maintenance\n1.2 Identify and request\nmaterials, tools and\nequipment\n1.3 Inspect equipment,\ninstruments and\nmaterials\n1.4 Discuss and plan\nmaintenance work\n\n-Lecture /\nDiscussion\n\n-Audio Visual\n\n-Demonstration\n\n-Case problems\n\n-Direct observation\n\n-Questions or\ninterview\n\n-Portfolio\n(credentials)\n\n-Written Test\n\n-Case problem\nsolving\n\n2. Implement\ntransmission line\nmaintenance\nwork\n\n2.1 Prepare\nmaintenance\nresources and job\nsite\n2.2 Discuss work\nassignments with\nteam members\n2.3 Supervise\ntransmission line\nmaintenance work\n2.4 Follow occupational\nhealth and safety\nstandards\n2.5 Document\ncompletion of\nmaintenance work\n\n-Audio Visual\n\n-Lecture/\nDiscussion\n\n-Practical\nexercises/Field\nwork\n\n-Demonstration\n\n-Direct observation\n\n-Oral questioning\n\n-Written test or\nexamination\n\n-Demonstration\n\n-Case problem\nsolving\n\n--- PDF PAGE 55 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n53\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n3. Inspect/Assess\ntransmission line\ncomponents’\nconditions\n\n3.1 Plan and prepare\ninspection/\nassessment\nactivities\n3.2 Assess the worksite\nand transmission\nline components\n3.3 Follow occupational\nhealth and safety\nstandards\n3.4 Document findings\nand\nrecommendations\n\n-Audio Visual\n\n-Lecture/\nDiscussion\n\n-Demonstration/\nField work\n\n-Direct\nobservation of\napplication of\ntasks.\n\n-Oral questioning\n\n-Written test or\nexamination\n\n-Demonstration\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the\ncurriculum. Delivery shall be guided by the 10 basic principles of\ncompetency-based TVET:\n\n• The training is based on curriculum developed from the\n\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should\n accommodate individualized and self-paced learning\n strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\n\nstandards and the curriculum modules;\n• Assessment is based on the collection of evidence of the\n\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning\n\n(RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types\nof delivery modes, both on and off-the-job as long as the learning is\ndriven by the competency standards specified by the industry. The\n\n--- PDF PAGE 56 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n54\nfollowing training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing\nRules and Regulations.\n\n• Modular/self-paced is a competency-based training modality\nwherein the trainee is allowed to progress at his/her own\npace. The trainer only facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n\n• Supervised Industry Training or On-the-Job Training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n• Project-based instruction is an authentic instructional model\nor strategy in which students plan, implement and evaluate\nprojects that have real world applications.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTo qualify as trainee for Transmission Line Installation and\nMaintenance NC III, a candidate must be:\n\n• at least a holder of Transmission Line Installation and\nMaintenance NC II or its equivalent\n• at least 5-yrs of relevant or equivalent experience in T/L\ninstallation and maintenance\n• of good moral character\n• able to communicate; and\n• physically and mentally fit\n\n--- PDF PAGE 57 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n55\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nTRANSMISSION LINE INSTALLATION AND MAINTENANCE NC III\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for Transmission Line Installation and Maintenance NC III are as follows:\n\nTOOLS\nEQUIPMENT\nHARDWARE\nQTY\nITEM\nQTY\nITEM\nQTY\nITEM\n20\nPliers\n2\nRatchet hoist\n\nInsulator\n20\nBallpeen hammers\n2\nCapstan/Hand winch\n\nMachine bolts\n20\nScrewdrivers\n2\nBlock and tackle\n\nSuspension clamps\n20\nHacksaw\n2\nCompression\nmachine\n\nStrain clamp\n20\nAdjustable wrenches\n2\nSnatch block\n\nOverhead ground wires\n20\nAuger bit\n20\nClimbing gears set\n\nCross-arms and braces\n20\nCutting tools\n5\nDynamometer/\nTension meter\n\nConductors and\naccessories\n\nHotline tools\n20\nWire grip\n\nTower parts\n1\n- Fiber glass stick\n5\nHydraulic cutter\n\n1\n- Fiber glass\nextension ladder\n1\nLeakage-current\nmonitoring kit\n\n1\n- Fiber glass work\nplatform\n1\nLine truck\n\n1\nBoom truck\n\n1\nConnecting tool\n(wedge connector)\n\nPPE\n\nINSTRUMENTS\n20\nHard hat\nMATERIALS\n5\nTele-height meter\n20\nSafety shoes\n\n20\nSteel tape\n20\nSafety goggles\n\n5\nThermal scanner\n20\nConductive suit\n\n5\ntelescope\n20\nSafety gloves\n\n1\nFirst-aid kit set\n\n--- PDF PAGE 58 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n56\n3.5 TRAINING FACILITIES\n\nTRANSMISSION LINE INSTALLATION AND MAINTENANCE NC III\n\nBased on a class intake of 20students/trainees, below are the\nspace requirement & their sizes:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\n Sq. Meters\n1. Student/Trainee Working\nSpace\n2.50 x 2.50 per\nstudent/trainee\n6.25 per\nstudent\n156.25\n2. Contextual Learning\nLaboratory / Lecture Room\n4 x 5\n20\n20\n3. Learning Resource\nCenter\n4 x 5\n20\n20\n4. Facilities/Equipment/\nCirculation area\n10 x 6\n60\n60\nTOTAL AREA\n\n256.25\n\n3.6\nTRAINER’S QUALIFICATIONS FOR UTILITIES SECTOR\n\n TRANSMISSION LINE INSTALLATION AND MAINTENANCE NC III\nTRAINER QUALIFICATION III (TQ III)\n- Must be a holder of Transmission Line Installation and Maintenance\nNC III or equivalent\n- Must have completed Training Methodology Course III (TM III) or\nequivalent training/experience\n- Must be computer literate\n- Must be physically and mentally fit\n- * Minimum of three (3) years relevant job/industry experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 59 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n57"
