        "source_title": "COMPLY WITH ENVIRONMENTAL PROTECTION PROCEDURES",
        "source_text": "--- PDF PAGE 24 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n22\nUNIT TITLE \n: \nCOMPLY WITH ENVIRONMENTAL PROTECTION \nPROCEDURES \n \nUNIT CODE \n: \nUTL311206 \n \nUNIT DESCRIPTOR     : \nThis unit covers the knowledge, skills and attitudes \nrequired to implement and monitor environmental \nprotection policies and procedures including accessing \nrelevant information concerning environmental protection \nregulations and procedures, and implementing and \nmonitoring procedures concerning environmental \nhazards, related control procedures, environmental \ntraining arrangements, and required records and \ndocumentation \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Access information \nconcerning \nenvironmental \nprotection regulations \nand procedures \n \n \n1.1 Relevant provisions of environmental legislation and \ncodes of practice are accurately followed \n1.2 Information on workplace environmental policies, \nprocedures and programs is stored in a readily \naccessible location and manner \n1.3 Information is accurately and clearly explained to the \nwork team and updated according to change in \nworkplace policy \n1.4 Information about the outcomes of environmental risk \nidentification and control procedures is provided to the \nappropriate personnel \n \n2. Implement and monitor \nprocedures concerning \nenvironmental hazards \n \n2.1 Existing and potential environmental hazards in the \nworkplace are identified and reported \n2.2 Identified hazards are assessed in relation to relevant \nenvironmental protection policies \n2.3 Workplace procedures for dealing with hazardous \nevents are implemented wherever necessary to ensure \nthat prompt control action is taken \n2.4 Personal protective equipment (PPE) are obtained \nand used in accordance with job requirements \n2.5 Hazardous events are investigated to identify causes, \nand control measures are implemented to prevent \nrecurrence and minimize risks of such events \n \n3. Implement and monitor \nenvironmental control \nprocedures \n \n3.1 Existing environmental protection measures are \nimplemented, monitored and reviewed \n3.2 Work procedures to protect environment are \nimplemented and adherence to them by the work group \nis monitored \n3.3 Required improvements to existing control measures \nare identified, including required resources for \nimplementation, and reported to appropriate personnel\n\n--- PDF PAGE 25 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n23\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 environment \n \nEnvironment may include: \n1.1 indoor \n1.2 outdoor \n1.3 marine \n1.4 atmospheric \n2 Information \nInformation/documents may include: \n2.1 \nWorkplace procedures and practices related to \nenvironmental protection, including all \nfinancial, operating and customer service \npolicies and procedures \n2.2 \nOHS and environmental protection regulations \n2.3 \nWorkplace housekeeping procedures and \npolicies \n2.4 \nCode of practice for environmental protection \n2.5 \nMaterial safety data sheets \n2.6 \nPolicies and procedures for entry and work in \nconfined spaces \n2.7 \nManufacturer’s instructions concerning the use \nand servicing of equipment \n2.8 \nEmergency procedures \n2.9 \nRegulations and policies concerning noise, \nwaste disposal/reprocessing, handling of \ndangerous goods/hazardous substances and \nother environmental protection issues \n2.10 Standards and certification requirements \n2.11 Quality assurance procedures \n3 Appropriate personnel \nAppropriate personnel may include: \n3.1 \nWorkplace personnel including supervisors \nand management \n3.2 \nSite visitors \n3.3 \nContractors \n3.4 \nOfficial representatives \n4 Environmental hazards \n4.1 \nOils and lubricants \n4.2 \nExhaust fumes \n4.3 \nGas \n4.4 \nSmoke \n4.5 \nChemicals and detergents \n4.6 \nRubbish \n4.7 \nNoise \n4.8 \nwastes\n\n--- PDF PAGE 26 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n24\n \n5 Workplace procedures for \ndealing with hazardous \nevents \nProcedures may include: \n5.1 \nInspection and housekeeping \n5.2 \nMaintenance including plant and equipment \n5.3 \nPurchasing \n5.4 \nEvacuation \n5.5 \nHazardous substance containment \n5.6 \nOperational instruction \n5.7 \nEnvironmental information including incident \nand management practices \n5.8 \nSpecific hazardous materials policies and \nprocedures \n5.9 \nRisk assessment and control \n5.10 First aid \n6 Personal protective \nequipment (PPE) \nPPE may include: \n6.1 \nGloves \n6.2 \nSafety headwear and footwear \n6.3 \nSafety glasses \n6.4 \nTwo-way radios \n6.5 \nHigh visibility clothing\n\n--- PDF PAGE 27 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n25\nEVIDENCE GUIDE \n \n1. Critical aspects \n     of competency \nAssessment requires that the candidate: \n1.1 Identified and monitored environmental hazards in the workplace \n1.2 Implemented effective procedures for dealing with hazardous events \n1.3 Monitored workplace adherence to environmental practices \n1.4 Communicated effectively with the team members \n2.  Underpinning \nknowledge and \nattitude \n \n \n2.1 Relevant environmental protection regulations & codes of practice \n2.2 Workplace procedures and guidelines for implementing and \nmonitoring environmental protection \n2.3 Environmental risks associated with workplace operations and related \nprecautions to control the risk \n2.4 Environmental protection standards required in the workplace \n2.5 Workplace environmental hazards and related hazard control \nmeasures \n2.6 Equipment and resources required when implementing and \nmonitoring environmental protection procedures \n2.7  Organizational structure and site layout \n3.  Underpinning \nskills \n3.1 Workplace reporting and recording processes and procedures \n3.2 Communication skills \n3.3 Accessing information and data \n3.4 Problem solving skills \n3.5 Ability to: \n3.5.1 recognize potential environmental risks and ways of minimizing \nthem \n3.5.2 modify activities depending on differing workplace contexts, \nrisk situations and environments \n3.5.3 counsel, advise and inform others on environmental protection \nmatters \n3.5.4 identify and correctly use equipment and vehicles in \naccordance with environmental protection regulations and \nguidelines \n4.  Resource \nimplications \nThe following resources should be provided: \n4.1 Environmental protection regulations and guidelines \n4.2 OHS regulations and hazard prevention policies and procedures \n4.3 workplace environmental protection policies, procedures and \ninstructions \n4.4 equipment/vehicle manufacturer’s operating and servicing \ninstructions \n5.  Methods of \nassessment \nCompetency should be assessed through: \n5.1  Direct observation  \n5.2  Oral or written questioning \n5.3  Questions/interview \nAssessment of underpinning knowledge and practical skills may be \ncombined \n6.  Context of \nassessment \n6.1 Competency assessment must be undertaken in accordance with \nthe endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a simulated \nenvironment\n",
