        "source_title": "IMPLEMENT TRANSMISSION-LINE MAINTENANCE WORK",
        "source_text": "--- PDF PAGE 41 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n39\n \nUNIT OF COMPETENCY     : \nIMPLEMENT TRANSMISSION-LINE MAINTENANCE \nWORK \n \n \nUNIT CODE                          : \nUTL723218 \n \n \nUNIT DESCRIPTOR             : \nThis unit covers the knowledge, skills and attitudes in \nsupervising/directing field work for corrective and \npreventive maintenance of overhead transmission lines. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare maintenance \nresources and job site  \n \n \n1.1 Hauling/Transport of tools, equipment and \nmaterials/hardware  to job site is arranged and \ncoordinated with concerned personnel  \n1.2 Job site is prepared / excavated for maintenance work in \naccordance with work standards. \n1.3    Tools, equipment and materials transported to job site are \nchecked prior to maintenance work \n2. Discuss work \nassignments with \nteam members \n2.1 Responsibilities of team members are discussed and \nconfirmed in job site \n2.2 Where necessary, arrangements are negotiated/ \ncoordinated with third parties concerned. \n2.3 Team members’ queries and concerns are recognized, \ndiscussed and dealt with \n3.  Monitor/Supervise \nmaintenance work \n \n3.1 Safety procedures are stressed and enforced before, \nduring and after actual work in job site  \n3.2 Guidance/Assistance is provided to new, inexperienced, \nstressed or uneasy transmission line workers to ensure \nwork quality and safety   \n3.3 Deviations from planned work are documented and dealt \nwith following enterprise procedures \n3.4 Lifting and moving of heavy loads and components are \ncoordinated and performed based on established \nprocedures and using available resources on-site \n3.5 Communication with base/office and substation is \nmaintained to ensure quick response in case of problems \nor emergencies \n3.6 Unexpected situations are responded to in accordance \nwith enterprise procedures \n3.7 Work completion is confirmed and reported to concerned \npersonnel. \n4. Clean up work site \n \n4.1   Work site is cleared and kept in safe state in accordance \nwith established housekeeping procedures. \n4.2   Tools, equipment and unconsumed/unused materials are \ncleaned, checked and documented according to  \nestablished enterprise procedures \n4.3   Documentation related to maintenance work is completed \nand submitted in accordance with enterprise procedures\n\n--- PDF PAGE 42 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Transportation method \n1.1 \nBy land \n1.1.1 \nUsing motor vehicles \n1.1.2 \nUsing animal-drawn vehicles \n1.2 \nBy air (helicopter) \n1.3 \nBy manual hauling \n2.  tools, equipment  and \nmaterials \nMay include but are not limited to: \n2.1 \nTools  \n2.1.1 Pliers \n2.1.2 Screwdrivers \n2.1.3 Adjustable wrenches \n2.1.4 Ball-peen hammer \n2.1.5 Auger bit \n2.1.6 Hacksaw/cutting tools \n2.1.7 Hot-line tools \n2.1.7.1 Fiber glass stick \n2.1.7.2 Fiber glass extendible ladder \n2.1.7.3 Fiber glass work platform \n2.2 \nEquipment \n2.1.1 Ratchet hoist \n2.1.2 Capstan/Hand winch \n2.1.3 Block and tackle \n2.1.4 Compression machine \n2.1.5 Snatch block \n2.1.6 Climbing gears \n2.1.7 Hydraulic cutter \n2.1.8 Wire grip \n2.1.9 Connecting tool (wedge connector) \n2.1.10 Dynamometer/Tension meter \n2.1.11 Leakage-current monitoring kit \n2.1.12 Line truck/Boom truck \n2.1.13 Personal Protective equipment (PPE) \n2.1.13.1 Conductive suit \n2.1.13.2 Hard hat \n2.1.13.3 Safety shoes \n2.1.13.4 Safety goggles \n2.1.13.5 Working clothes \n2.1.13.6 Safety gloves \n2.2 Hardware \n2.2.1 Insulator \n2.2.2 Machine bolts \n2.2.3 Suspension clamps \n2.2.4 Strain clamp \n2.2.5 Overhead ground wires \n2.2.6 Cross-arms and braces \n2.2.7 Conductors and accessories \n2.2.8 Tower parts\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n41\n3 concerned personnel \nMay include: \n3.1 principal engineer \n3.2 safety officer/engineer \n3.3 lineman \n3.4 property custodian \n3.5 heavy equipment operator \n3.6 driver-mechanic \n \n4 Work arrangements \nMay include: \n4.1 Date and time of maintenance work \n4.2  work assignments \n4.3 scope of work activity \n4.4 job hazards identification \n4.5 hotline/coldline tagging \n4.6 coordination with control engineer or substation \n4.7 housekeeping / cleanup procedures  \n5 Third parties \n5.1 residents in the area \n5.2 local officials \n5.3 control engineer or substation personnel \n5.4 other work teams \n6 safety procedures \nIncludes procedures for --  \n6.1   Cold-line maintenance safety procedures \n6.2   Live-line maintenance safety procedures \n6.3   Lifting procedures \n6.4   Installation/use of rigging equipment \n6.5   Hand signaling \n6.6   Installation of ERS \n7 Deviations  \nMay include: \n7.1    unexpected absence of manpower \n7.2    bad weather condition \n7.3    sudden equipment failure \n7.4    damaged materials or hardware \n \n8 Unexpected situations \nMay include: \n8.1   bad weather condition \n8.2   accidents \n8.3   sudden worker sickness, uneasiness or stress  \n8.4   human error \n8.5   sudden equipment failure \n8.6   sudden line tripping\n\n--- PDF PAGE 44 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n42\nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1   Ensured availability of tools, equipment and materials in job site \n1.2   Prepared job site for maintenance work \n1.3   Discussed/Clarified work assignments to team members \n1.4   Enforced safety procedures during maintenance work \n1.5   Responded to deviations and unexpected situations  \n1.6   Enforced housekeeping  \n1.7   Documented and notified completion of maintenance work \n2.  Underpinning \nKnowledge and \nAttitude \n2.1 \nStandards and specifications for construction of overhead \ntransmission lines structures  \n2.2 \nQuality-system policies and procedures for T/L maintenance \n2.3 \nTransmission line hardware and accessories \n2.4 \nOccupational health and safety standards \n2.5 \nUses and specifications of T/L tools & equipment \n2.6 \nInstallation/Use of rigging equipment \n2.7 \nHand signaling  \n2.8 \nKnot tying and splicing procedures for ropes \n2.9 \nConductor splicing and jointing procedures \n2.10 Economic use of materials \n2.11 First-aid procedures \n2.12 Fire-prevention and fire-fighting procedures \n2.13 Safe working habits/Safety procedures \n2.14 Use of maintenance procedures manual \n2.15 Cleaning of worksite, tools and equipment \n2.16 Effective communication \n2.17 Desirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n3.  Underpinning   \nSkills \n3.1. Interpreting work orders \n3.2. Planning and scheduling skills \n3.3. Supervisory/coordination skills \n3.4. Coaching skills \n3.5. Working efficiently and systematically \n3.6. Observing health and safety precautions  \n3.7. Using rigging equipment \n3.8. Rope knot tying and splicing skills \n3.9. Conductor splicing and jointing skills \n3.10. First-aid skills \n3.11. Fire-prevention and fire-fighting skills \n3.12. Verifying materials, tools and testing instruments  \n3.13. Communicating skills (both written and oral)  \n3.14. Hand signaling skills \n3.15. Preparing request forms for supplies/materials/tools and \nequipment  \n4.  Resource    \nImplications \nThe following resources should be provided: \n4.1   Workplace location \n4.2   Tools and equipment appropriate to maintenance work \n4.3   Materials/Hardware relevant to the proposed activity \n4.4   Work order and other documents relevant to the task \n4.5   Safety/First-aid manuals\n\n--- PDF PAGE 45 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n43\n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1   Direct observation/Demonstration with oral questioning \n5.2   Role-playing/Simulation \n5.3   Written test or examination \n5.4   Third-party report \n5.5   Portfolio  \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a simulated \nworkplace setting \n6.2  Assessment shall be observed while the tasks are being  \n       undertaken either individually or as part of a team under  \n       limited supervision\n",
