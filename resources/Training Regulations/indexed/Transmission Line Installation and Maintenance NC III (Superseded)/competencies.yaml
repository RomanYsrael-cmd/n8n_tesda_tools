          "source_text": "VARIABLE \nRANGE \n1. \nPeripheral device \nThis may include but is not limited to:  \n1.1 mouse \n1.2 keyboard \n1.3 monitor or visual display unit \n1.4 printer \n1.5 scanner \n \n2. \nComputer \nMay include: \n2.1 Laptops/notebooks \n2.2 Workstations \n2.3 Servers \n2.4 other personal computer devices \n \n3. \nApplication \nprograms \nCan include: \n3.1 user programs \n3.2 database programs \n3.3 word processors \n3.4 email programs \n3.5 Internet browsers \n3.6 system browsers  \n3.7 spreadsheets \n \n4. \nOperating system \nMay include but is not limited to the various versions and \nvariants of operating systems running on personal \ncomputers and servers, such as: \n4.1 Windows \n4.2 NT \n4.3 Mac OS \n4.4 Linux \n4.5 Solaris \n4.6 Unix  \n \n5. \nSystem features \nMay include but is not limited to the operating system \nfeatures and hardware features like:  \n5.1 memory size \n5.2 disk capacities \n5.3 video cards \n5.4 USBs \n5.5 Modems \n5.6 1394 and LAN connectors \n5.7 SD and PC cards \n5.8 wireless and infrared connections.\n\n--- PDF PAGE 36 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n34\n \nVARIABLE \nRANGE \n6. \nOnline help \nfunctions \n6.1 An instruction manual, or a portion of the manual, \nintegrated and accessible from within the program or \nsoftware being used. \n7. \nProperties \nIndicates the description of the file or folder to include the:  \n7.1 file name \n7.2 type of file \n7.3 file size \n7.4 date created and modified \n7.5 attributes (hidden, read-only). \n \n8. \nVarious files \n8.1 Documents \n8.2 Records \n8.3 Pictures \n8.4 Music \n8.5 Video \n \n9. \nDisks \nMay include but is not limited to:  \n9.1 Floppy disks \n9.2 CDs \n9.3 CD-RW (Compact discs-Read/Write) \n9.4 DVD RW \n9.5 zip disks \n9.6 flash drives \n9.7 memory sticks \n9.8 hard drives \n \n10. Printer settings \nThe properties of the printer that enables it to work  includes:  \n10.1 page layout \n10.2 paper size \n10.3 ink/cartridge type \n10.4 number of copies \n10.5 page orientation.\n\n--- PDF PAGE 37 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n35"
