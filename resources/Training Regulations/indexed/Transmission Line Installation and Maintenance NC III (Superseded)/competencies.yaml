        "source_title": "INSPECT/ASSESS TRANSMISSION LINE COMPONENTS’ CONDITION",
        "source_text": "--- PDF PAGE 46 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n44\n \nUNIT OF COMPETENCY      : \nINSPECT/ASSESS TRANSMISSION LINE \nCOMPONENTS’ CONDITION \n \n \nUNIT CODE                           : \nUTL723219 \n \n \nUNIT DESCRIPTOR              : \nThis unit covers the knowledge, skills and attitudes in \ninspecting or assessing transmission line (T/L) \ncomponents and its conditions.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare and schedule \nconduct of inspection/ \nassessment \n \n \n1.1   Schedule of revalidation or assessment of T/L is \ncoordinated with concerned personnel. \n1.2   Work team is oriented on the scheduled work to \nbe done.  \n1.3   Tools, equipment and instruments required \nfor assessment are identified and acquired. \n1.4   T/L manual of specifications and standards are \naccessed and obtained prior to assessment / \ninspection  \n2.  Assess the worksite and T/L \ncomponents \n \n \n2.1   Area is accessed and surveyed in accordance \nwith established procedures \n2.2   Where necessary, pole or tower structure is \nclimbed/ascended following safety procedures  \n2.3   Condition of pole or tower structure is \nassessed and confirmed based on T/L standards \n2.4   Condition of T/L components are assessed \nthrough visual, sensory and instrument \nmethods. \n2.5   Aerial inspection is conducted for emergency \ncases following established procedures.  \n2.6   Safety procedures are observed and followed \nduring assessment / inspection. \n3.  Document findings and \nrecommendations \n3.1 Findings and observations are documented \nfollowing established procedures and T/L \nstandards \n3.2 Recommendations for corrective/preventive \nmaintenance are prepared based on the findings \nof the assessment.\n\n--- PDF PAGE 47 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n45\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. tools, equipment  and \nmaterials \nMay include: \n1.1 \nTools  \n2.1.1 Screwdrivers \n2.1.2 Adjustable wrenches \n2.1.3 Ballpeen hammer \n2.1.4 Auger bit \n2.2 Equipment \n2.2.1 Climbing gears \n2.2.1.1 Safety harness \n2.2.1.2 Vertical/Horizontal lifeline \n2.2.2 Personal protective equipment \n2.2.2.1 Hard hat \n2.2.2.2 Safety goggles \n2.2.2.3 Safety shoes \n2.2.2.4 Working clothes \n2.2.2.5 Safety gloves \n2.2.3 Line truck/Boom truck \n2.3 Instrument \n2.3.1 Measuring instrument \n2.3.1.1 Tele-height meter \n2.3.1.2 Steel tape \n2.3.2 Thermal scanner \n2.3.3 Telescope \n2.  Condition of pole or \ntower structure \nCondition of pole or tower structure may include: \n2.1 Tower structure \n2.1.1 corroded tower parts \n2.1.2 loose/bent tower parts \n2.1.3 eroded foundation \n2.2 Pole \n2.2.1 rotten pole top \n2.2.2 leaning pole \n2.2.3 eroded foundation \n2.2.4 splitting \n2.2.5 effects of lightning \n2.2.6 splitting or pulling of guys \n2.2.7 twisting or raking \n2.2.8 knotshole or birdshole \n2.2.9 presence of insects \n2.2.10 burned pole \n2.2.11 termite infested pole \n2.2.12 excessive cracks \n2.2.13 corroded pole\n\n--- PDF PAGE 48 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n46\n3. Condition of T/L \ncomponents \nMay include: \n3.1 Support structures (see ROV #2) \n3.2 Crossarms and X’braces \n3.2.1 Rotten crossarm \n3.2.2 Splitting or twisting \n3.2.3 Loose, broken, or missing nuts and \nbraces \n3.2.4 Presence of insects \n3.3 Insulators \n3.3.1 Disc type \n3.3.1.1 \nCorroded pin shank \n3.3.1.2 \nFlashover \n3.3.1.3 \nBroken insulator \n3.3.1.4 \nMolds/moss or algae \n3.3.1.5 \nCorona effect \n3.3.2 Synthetic \n3.3.2.1 \nBroken rubber petticoat at hot \nend part \n3.3.2.2 \nBurned rubber petticoat at hot \nend part \n3.3.2.3 \nCorona effect \n3.4 Conductors \n3.4.1 cut strand \n3.4.2 loosed conductor \n3.4.3 loosed vibration damper spacer \n3.4.4 low clearance (line to ground) for 69KV \n3.4.5 melted conductor at connector \n3.4.6 vegetation clearance \n3.4.7 too much vibration effect and corona \ntracking \n3.5 Other fittings and HDG steel components   \n3.5.1 Corroded bolts and nuts/steel pin \n3.5.2 Loose cotter key \n3.5.3 Dislocated steel pin \n3.5.4 Missing cotter key \n3.6 Ground wires and connectors \n3.6.1 Corroded OHGW \n3.6.2 Corroded/detached connector at jumper \nloop \n3.6.3 Corroded/ cut ground lead \n3.6.4 Detached connector on ground lead and \nOHGW    \n3.7 Guy wires \n3.7.1 Rotten anchor rod \n3.7.2 Corroded anchor rod/lead \n3.7.3 Cut-off lead\n\n--- PDF PAGE 49 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n47\n4.  Transmission line \ncomponents \nMay include: \n4.1 Support structures \n4.1.1 Poles \n4.1.1.1 Wooden \n4.1.1.2 Steel \n4.1.1.3 Concrete \n4.1.2 Towers \n4.1.2.1 Rigid \n4.1.2.2 Flexible  \n4.2 Crossarms and X’braces \n4.3 Insulators \n4.3.1 Disc type \n4.3.2 synthetic \n4.4 Conductors \n4.5 Other fittings and HDG steel components   \n4.6 Ground wires and connectors    \n4.7 Guy wires \n5. Methods \n5.1   visual inspection \n5.2   sounding method \n5.3   use of instruments \n5.3.1   thermal scanner \n5.3.2   tele-height meter \n4.3.3 Binoculars \n4.3.4 Steel tape \n6. Safety procedures \nSafety procedure for: \n6.1 Live-line work \n6.2 Pole and tower-climbing \n7. Findings and \nobservations \nMay include: \n7.1 Defective/Damaged T/L components \n7.2 Defective/Damaged pole/tower structures  \n7.3 Right-of-way problems \n7.3.1 Illegal structures \n7.3.2 Vegetations and other obstructions  \n7.4 Serviceability of T/L components \n \n8. Recommendations \nMay include: \n8.1 \nRetirement/replacement of poles \n8.2 \nRepair of steel tower parts \n8.3 \nReplacement/Adjustment of T/L components \n8.4 \nRemoval of obstructions and illegal structures \n8.5 \nDeferment or postponement of maintenance work \n8.6 \nInstallation of danger signs \n8.7 \nResolution of right-of-way problems\n\n--- PDF PAGE 50 ---\n____________________________________________________________________________________________________ \nTR – Transmission Line Installation and Maintenance NC III \n48\nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1  Prepared and arranged the inspection/assessment activity \n1.2  Accessed and surveyed the target area \n1.3  Identified and validated defects and problems in T/L structures \nand components \n1.4  Documented inspection/assessment results and \nrecommendations \n2.  Underpinning \nKnowledge and \nAttitude \n2.1 \nTransmission line inspection/assessment standards for T/L \ncomponents \n2.2 \nStandards and specifications for construction of overhead \ntransmission lines structures  \n2.3 \nQuality-system policies and procedures for T/L maintenance \n2.4 \nTransmission line hardware and accessories \n2.5 \nOccupational health and safety standards \n2.6 \nUses and specifications of T/L tools and equipment  \n2.7 \nSafe working habits/Safety procedures \n2.8 \nUse of T/L manual of specifications and standards \n2.9 \nCalculation and mensuration \n2.10 Effective communication \n2.11 Desirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n3.  Underpinning \nSkills \n3.1. Interpreting work orders \n3.2. Planning and scheduling skills \n3.3. Working efficiently and systematically \n3.4. Observing health and safety precautions  \n3.5. First-aid skills \n3.6. Communication and negotiation skills (both written and oral) \n3.7. Using measuring instruments  \n3.8. Calculation and mensuration skills \n4.  Resource \nImplications \nThe following resources should be provided: \n4.1  Workplace location \n4.2 Tools, equipment and instruments appropriate to inspection/ \nassessment of T/L structures and components \n4.3  Materials relevant to the proposed activity \n4.4  Manuals and documents relevant to the task \n5.  Methods of \nAssessment \nCompetency in this unit must be assessed: \n5.1  Direct observation/Demonstration with oral questioning \n5.2  Written report \n5.3  Third party report \n5.4  Portfolio \n6.  Context for \nAssessment \n6.1  Competency may be assessed in the workplace or in a  \n        simulated workplace setting \n6.2 Assessment shall be observed while the tasks are being \nundertaken either individually or as part of a team under limited \nsupervision\n",
