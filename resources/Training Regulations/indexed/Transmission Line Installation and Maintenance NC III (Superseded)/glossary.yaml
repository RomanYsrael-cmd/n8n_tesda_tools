      "term": "1) Certification - is the process of verifying and validating the competencies of a",
      "definition": "person through assessment"
    },
    {
      "term": "2) Certificate of Competency (COC) – is a certification issued to individuals who",
      "definition": "pass the assessment for a single unit or cluster of units of competency"
    },
    {
      "term": "3) Common Competencies - are the skills and knowledge needed by all people",
      "definition": "working in a particular industry"
    },
    {
      "term": "4) Competency - is the possession and application of knowledge, skills and",
      "definition": "attitudes to perform work activities to the standard expected in the workplace"
    },
    {
      "term": "5) Competency Assessment - is the process of collecting evidence and making",
      "definition": "judgments on whether competency has been achieved"
    },
    {
      "term": "6) Competency Standard (CS) - is the industry-determined specification of",
      "definition": "competencies required for effective work performance"
    },
    {
      "term": "7) Context of Assessment - refers to the place where assessment is to be",
      "definition": "conducted or carried out"
    },
    {
      "term": "8) Core Competencies - are the specific skills and knowledge needed in a",
      "definition": "particular area of work - industry sector/occupation/job role"
    },
    {
      "term": "9) Critical aspects of competency - refers to the evidence that is essential for",
      "definition": "successful performance of the unit of competency"
    },
    {
      "term": "10) Elective Competencies - are the additional skills and knowledge required by",
      "definition": "the individual or enterprise for work"
    },
    {
      "term": "11) Elements - are the building blocks of a unit of competency. They describe in",
      "definition": "outcome terms the functions that a person performs in the workplace."
    },
    {
      "term": "12) Evidence Guide - is a component of the unit of competency that defines or",
      "definition": "identifies the evidences required to determine the competence of the individual. It provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, assessment method and context of assessment"
    },
    {
