  "source_text": "DEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a\nparticular area of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by\nthe individual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual.\nIt provides information on critical aspects of competency, underpinning\nknowledge, underpinning skills, resource implications, assessment method and\ncontext of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve\nall the required units of competency for a national qualification defined under\nthe Training Regulations. NCs are aligned to specific levels within the PTQF\n\n--- PDF PAGE 62 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n60\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work\nis to be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an\nindividual’s skills, knowledge and attitudes gained from life and work\nexperiences outside registered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It\nincludes work environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for\nwork\n\n22) Training Regulations (TR) – refers to the document promulgated and issued\nby TESDA consisting of competency standards, national qualifications and\ntraining guidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves\nas guide for development of competency-based curricula and instructional\nmaterials including registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes\ngeneric and industry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 63 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n61\nSPECIFIC\n\n1.\nACSR - abbreviation of Aluminum Cable Steel Reinforced, a cable type having\naluminum strands and a core of one or more steel strands. ACSR are primarily\nused for medium and high voltage lines and may also be used for overhead\nservices to individual customers.\n\n2.\nAerial Cable- insulated cable usually supported by a bare cable, for power\ntransmission above ground.\n\n3.\nAir Gap - the shortest air space between two contacts exposed above an\ninsulating barrier.\n\n4.\nArmor Rod - an outer metal layer applied to a cable for mechanical protection.\nArmor rods are comprised of factory formed wire, designed to be applied to a\nrange of conductor sizes\n\n5.\nArmor Rod (preformed) - a spiral-formed aluminum rod, a group of which is\nplaced around a conductor at the point of suspension to minimize vibration and to\nprotect the conductor from burning in case of a flashover.\n\n6.\nBlock and tackle - an apparatus of pulley blocks and ropes or cables used for\nhauling and hoisting heavy objects.\n\n7.\nConductor - 1) a wire or combination of wires suitable for carrying an electrical\ncurrent. Conductors may be insulated or bare. 2) any material that allows\nelectrons to flow through it.\n\n8.\nDamper - a device used to inhibit the vibration of conductors on a transmission\nline.\n\n9.\nGroundman - a person working at ground level in support of a lineman working\naloft.\n\n10. Guy - a rope, cord, or cable used to steady, guide, or secure something.\n\n11. Guy-wire or guy-rope -is a tensioned cable designed to add stability to structures\n(frequently ship masts, radio masts, wind turbines, utility poles, and tents). One\nend of the cable is attached to the structure, and the other is anchored to the\nground at a distance from the structure's base.\n\n12. Guy Strain Insulator - an insulator, normally porcelain, used to electrically isolate\none part of a down guy from another. Guy Strain Insulators are made of porcelain\nproducts.\n\n13. Hazard - a dangerous condition, potential or inherent, that can bring about an\ninterruption or interfere with the expected orderly progress of an activity.\n\n14. Hazardous - an atmosphere that may expose employees to the risk of death,\natmosphere incapacitation, impaired ability to self-rescue unaided, injury, or acute\nillness.\n\n--- PDF PAGE 64 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n62\n\n15. Hazardous atmospheres - include flammable gas, vapor, or mist, airborne\ncombustible dust, oxygen concentration below 19.5 percent or above 23.5\npercent, concentrations of substances that exceed dose or permissible exposure\nlimits, or other atmospheric condition immediately dangerous to life or health.\n\n16. Hot Line Order - a statement with documentation from the Operations Supervisor\nto the Job Supervisor that specific work may be done on or near a line or other\nequipment without requiring that it be disconnected from all sources of energy.\nThe equipment is to be considered energized or “hot.”\n\n17. Hotstick - an insulated stick, usually made of fiberglass, that is used to work\nenergized overhead conductors and operate electrical equipment that is overhead,\nunderground and pad mounted.\n\n18. Insulator - a device that is used to electrically isolate a conductor or electrical\ndevice from ground or a different electrical potential. Insulators must support the\nconductors and withstand both the normal operating voltage and surges due to\nswitching and lightning. Insulators are broadly classified as either pin-type, which\nsupport the conductor above the structure, or suspension type, where the\nconductor hangs below the structure. Up to about 33 kV (69 kV in North America)\nboth types are commonly used. At higher voltages only suspension-type insulators\nare common for overhead conductors. Insulators are usually made of wet-process\nporcelain or toughened glass, with increasing use of glass-reinforced polymer\ninsulators.\n\n19. Lineman - a payroll classification or title given a craftsperson whose duties\ninclude climbing wood poles or steel structures to perform work on electric power\ntransmission and distribution circuits.\n\n20. Overhead power line - is an electric power transmission line suspended by\ntowers or poles. Since most of the insulation is provided by air, overhead power\nlines are generally the lowest-cost method of transmission for large quantities of\nelectric power. Towers for support of the lines are made of wood (as-grown or\nlaminated), steel (either lattice structures or tubular poles), concrete, aluminum,\nand occasionally reinforced plastics. The bare wire conductors on the line are\ngenerally made of aluminum (either plain or reinforced with steel or sometimes\ncomposite materials), though some copper wires are used in medium-voltage\ndistribution and low-voltage connections to customer premises.\n\n21. Personal Protective Equipment (PPE) - the term shall include, but is not limited\nto, devices designed to be worn by workers for eye, face, head, respiratory, hand,\narm, body, leg, foot, and fall protection.\n\n22. Tag Line - A rope used to control the position of equipment being lifted. This is not\nto be confused with the rope used to actually lift the equipment.\n\n23. Transmission line - is the material medium or structure that forms all or part of a\npath from one place to another for directing the transmission of energy, such as\nelectromagnetic waves or acoustic waves, as well as electric power transmission.\n\n--- PDF PAGE 65 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n63\nComponents of transmission lines include wires, coaxial cables, dielectric slabs,\noptical fibers, electric power lines, and waveguides.\n\n24. Low voltage – less than 1000 volts, used for connection between a residential or\nsmall commercial customer and the utility.\n\n25. Medium Voltage (Distribution) – between 1000 volts (1 kV) and to about 33 kV,\nused for distribution in urban and rural areas.\n\n26. High Voltage (Sub-transmission if 33-115kV and transmission if 115kV+) –\nbetween 33 kV and about 230 kV, used for sub-transmission and transmission of\nbulk quantities of electric power and connection to very large consumers.\n\n27. Extra High Voltage (Transmission) – over 230 kV, up to about 800 kV, used for\nlong distance, very high power transmission.\n\n28. Ultra High Voltage – higher than 800 kV.\n\n--- PDF PAGE 66 ---\n____________________________________________________________________________________________________\nTR – Transmission Line Installation and Maintenance NC III\n64"
}
