    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FOUNDRY MOULDING\n\n NC Level: NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n72 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with competency to to prepare sand\nmixture and produce all types of molds manually to cast heavy casting ( 500 kgs or\nmore net weight) individually or as a team. It also include competency in pouring molten\nmetal to heavy castings. The heavy casting are usually cast to make press die parts\nsuch as forming, blanking die and trimming dies, base plates for molding machine.\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\nIt also includes common competencies such as: Read, Interpret and Apply\nEngineering Drawings; Perform Mensuration and Calculation Read; Interpret and Apply\nSpecifications and Manuals and; Perform Shop Maintenance.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 46\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance test\n4. Solve\nworkplace\nproblem\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance test\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1 Select measuring instrument\nand carry out measurement\nand calculations.\n2.2 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals and\ninterpret data and specification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written test\n• Direct\nobservation\n• Project method\n•Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used\nlubricants\n4.4Report damaged tools / equipt\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 47\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare Sand\nMixture for\nHeavy Casting\n1.1 Determine job requirement.\n1.2 Select materials\n1.3 Select mixer\n1.4 Mixing sand mixture\n1.5 Discharge/store sand\n• Lecture/\nDemonstration\n• Discussion\n• Dual training\n\n• Observation w/\nquestioning\n• Demonstration\nof practical\nskills\n• Portfolio\n• Third party\nreport\n2. Perform\nMolding to\nProduce\nHeavy Casting\n2.Determine job requirement\n2.2 Prepare pattern and\naccessories\n2.3 Make mold\n2.4 Apply mold coating\n• Lecture/\nDemonstration\n• Discussion\n• Dual training\n\n• Observation w/\nquestioning\n• Demonstration\nof practical\nskills\n• Portfolio\n•\nThird party\nreport\n3. Pour molten\nmetal to heavy\ncasting\n3.1 Prepare for pouring molten\nmetal\n3.2 Transfer ladle to furnace\n3.3 Maintain quality of metal as\nrequired\n3.4 Pour molten metal\n3.5 Empty excess metal for the\nladle\n• Lecture/\nDemonstration\n• Discussion\n• Dual training\n\n• Observation w/\nquestioning\n• Demonstration\nof practical\nskills\n• Portfolio\nThird party\nreport\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 