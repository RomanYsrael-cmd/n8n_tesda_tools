  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for FOUNDRY MOLDING NC III.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FOUNDRY MOULDING\n\n NC Level: NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n72 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with competency to to prepare sand\nmixture and produce all types of molds manually to cast heavy casting ( 500 kgs or\nmore net weight) individually or as a team. It also include competency in pouring molten\nmetal to heavy castings. The heavy casting are usually cast to make press die parts\nsuch as forming, blanking die and trimming dies, base plates for molding machine.\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\nIt also includes common competencies such as: Read, Interpret and Apply\nEngineering Drawings; Perform Mensuration and Calculation Read; Interpret and Apply\nSpecifications and Manuals and; Perform Shop Maintenance.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 46\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance test\n4. Solve\nworkplace\nproblem\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance test\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1 Select measuring instrument\nand carry out measurement\nand calculations.\n2.2 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals and\ninterpret data and specification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written test\n• Direct\nobservation\n• Project method\n•Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used\nlubricants\n4.4Report damaged tools / equipt\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 47\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare Sand\nMixture for\nHeavy Casting\n1.1 Determine job requirement.\n1.2 Select materials\n1.3 Select mixer\n1.4 Mixing sand mixture\n1.5 Discharge/store sand\n• Lecture/\nDemonstration\n• Discussion\n• Dual training\n\n• Observation w/\nquestioning\n• Demonstration\nof practical\nskills\n• Portfolio\n• Third party\nreport\n2. Perform\nMolding to\nProduce\nHeavy Casting\n2.Determine job requirement\n2.2 Prepare pattern and\naccessories\n2.3 Make mold\n2.4 Apply mold coating\n• Lecture/\nDemonstration\n• Discussion\n• Dual training\n\n• Observation w/\nquestioning\n• Demonstration\nof practical\nskills\n• Portfolio\n•\nThird party\nreport\n3. Pour molten\nmetal to heavy\ncasting\n3.1 Prepare for pouring molten\nmetal\n3.2 Transfer ladle to furnace\n3.3 Maintain quality of metal as\nrequired\n3.4 Pour molten metal\n3.5 Empty excess metal for the\nladle\n• Lecture/\nDemonstration\n• Discussion\n• Dual training\n\n• Observation w/\nquestioning\n• Demonstration\nof practical\nskills\n• Portfolio\nThird party\nreport\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 48\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency\nstandards;\n Learning is modular in its structure;\n Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and\nthe curriculum modules;\n Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real\nworld applications.\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 49\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are\nalso stated. Passing entry written examinations may also be indicated if\nnecessary.\n\n• With background in basic machining\n• Ability to communicate both oral and written; and\n• Physically and mentally fit\n• Must possess the Foundry Molding National Certificate (NC) II\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n FOUNDRY MOLDING NC III\n\nRecommended list of tools, equipment and materials for the training of 12 trainees\nfor Foundry Molding NC III\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2 sets\nBox wrench\n1 set\nSand muller\n(500Kgs capacity)\n5 tons\nSilica sand (minimum\n96% silica)\n2 sets\nOpen wrench\n1 set\nSand mixer\n(250Kgs capacity)\n5 tons\nChromite sand\n2 sets\nSocket wrench\n1 set\n1-AS or 3-DS shell\ncore\n2 tons\nResin bonded shell\ncore sand\n2 pcs\nAdjustable\nwrench (300mm)\n1 set\nAir compressor\n(50hp)\n500Kgs\nBentonite (Volclay)\n2 pcs\nScrewdriver\n(Minus 200mm)\n1 set\nCO2 gas regulator\n400Kgs\nSodium silicate (ratio\n2.5 - 3)\n2 pcs\nScrewdriver\n(Philips 200mm)\n1 set\nLPG burner\n50Kgs\nSea coal\n2 pcs\nElectrical pliers\n1 set\nWeighing scale\n1000Kgs capacity\n100Kgs\nMolasses\n2 sets\nStopwatch with\nlap time\n2 sets\nWorking bench\n(1m x 2m x 1m)\n5Kgs\nParting compound\n(Dry)\n3 pcs\nShovel\n1 set\nWeighing scale\n100Kgs capacity\n10Kgs\nGraphite coating\n2 sets\nSpray gun\n2 sets\nWeighing scale\n15Kgs capacity\n10Kgs\nMagnesia based\ncoating\n4 pcs\nWood mallet\n4 sets\nMolding box\n(30”x40”x6”)\n5\ncylinder\nLPG 50Kgs capacity\n2 pcs\nHack saw Blade\n4 sets\nMolding box\n(30”x40”x8”)\n1 sheet\nStyropore (3 feet x 8\nfeet x 4”)\n10 pcs Paint brush (1”)\n1 set\nSpirit based\nleveling device\n2Kgs\nGrease\n10 pcs Paint brush (2”)\n1 set\nA-crane (1 ton\ncapacity)\n50m\nWire rope (1/2” dia, 6\nstrand)\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 50\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n4 sets\nBlow gun\n1 set\nHoist (1 ton\ncapacity)\n50m\nAir hose (1/4 dia)\n12 pcs Calculator\n(regular)\n1 set\nF-D2 molding\nmachine\n10sqm\nWire screen (mesh #2 /\n#4)\n2 pcs\nWater container\n(60 liters\ncapacity)\n2 pcs\nTooth box with\nwheel\n4 sets\nMolding tools\n5m\nShafting (5mm\ndia)\n1 sets\nOil dispenser\n20 Liters\nMethanol\n5m\nShafting (20mm\ndia)\n1 set\nPattern (Cope and\ndrag)\n2m\nCopper tube (10mm\nOD)\n6 pcs\nEye bolt (12mm\ndia)\n2 sets\nMolding corebox\n36pairs\nCotton gloves\n4 pcs\nClaw hammer\n2 pcs\nWhite board (1m x\n2m each)\n24 pcs\nBroom (ting-ting)\n4 pcs\nBallpein hammer\n2 sets\nStorage cabinet\n20 pcs\nBroom (tambo)\n2 pcs\nLong nose pliers\n2 pcs\nOpen shelf\n4 pcs\nPush broom\n2 sets\nSteel rule (1m\nlong)\n1 set\nShell corebox for\n1-AS or 3-DS with\nejector plate,\nburner plate,\nejector pin\n50Kgs\nCleaning rags\n2 sets\nHack saw with\nblade\n1 set\nLoose piece\npattern\n24 sets\nGoggles\n2 sets\nVernier caliper\n(300mm)\n\nOxyacetylene\nregulator with\nhose and cutter /\nwelding tip\n12 sets\nHard hat\n6 pcs\nSteel brush\n4\ncylinder\nOxygen gas\n12 sets\nSafety shoes\n1 set\nOil dispenser\n2\ncylinder\nAcetylene gas\n24 sets\nT-shirt\n1 set\nGrease gun\n1 set\nWelding machine\n(200-300amperes)\n200Liter\ns\nEcolotic Resin binder\n\nTraining\nmaterials\n2 units\nHand rammer\n2 pcs\nAngular bar (2”x2”x36”)\n\nReference book\n\n10 pcs\nWire rope clamp (½”\ndia)\nMachine manuals\n\nFoundry supplies\ncatalogues /\nbrochures\n\nCD / Video tapes\nNotebook\nBallpen\nPencil\nPentel pen\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 51\n3.5 TRAINING FACILITIES\n FOUNDRY MOLDING NC III\n\nBased on a class size of 12 students/trainees\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building (permanent\nwith toilet & Locker\nroom)\n26.00 x 28.00\n728.00\n728.00\n• Trainee Working\nSpace\n3.50 x 3.50 per\nstudent / trainee\n12.25 per\nstudent\n147.00\n• Lecture room\n9.00 x 10.00\n90.00\n90.00\n• Learning resource\ncenter\n5.00 x 8.00\n40.00\n40.00\n• Facilities /\nEquipment /\nCirculation area\n-\n-\n300.00\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE SECTOR\n MANUFACTURING SUB-SECTOR\n\nFOUNDRY MOLDING NC III\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Foundry Molding NC III\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n• Must be a civil-service eligible or holder of appropriate professional license\nissued by the Professional Regulatory Commission (for government positions\nonly)\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or\nequivalent” upon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 52"
