        "source_title": "POUR MOLTEN METAL TO HEAVY CASTINGS",
        "source_text": "--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           40\nUNIT OF COMPETENCY : \nPOUR MOLTEN METAL TO HEAVY CASTINGS \n            \nUNIT CODE  \n \n:  \nALT812314 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competency in manually  \npouring molten metal as part of metal casting and  \nmolding process with ladle capacities of 500Kgs or  \nmore using bull ladle, crane ladle a bottom poured  \nladle. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Prepare for \npouring \nmolten metal \n \n \n1.1 Condition of the mold is checked according to standard \noperating procedures. \n1.2 Condition of the ladle is checked and appropriate \nmeasures are undertaken to correct ladle defects according \nto standard operating procedures. \n1.3 Temperature of molten metal is checked for conformance to \nspecification and pouring method is sequenced to standard \noperating procedures. \n1.4 The capacity of the required pour is identified against \nspecification according to standard operating procedures. \n1.5 Over-head cranes, wire-ropes, metal shield are checked \naccording to standard operating procedures. \n1.6Ladle is pre-heated according to prescribed procedures.\n \n2. Transfer ladle \nto furnace \n \n2.1 Safety clips of the lifting hooks are checked according to \nstandard operating procedures. \n2.2 Ladle is filled with appropriate weight and transferred to \nthe pouring area in accordance with standard operating \nprocedures. \n2.3 Required additives / ferro-alloys and metal cover \ndetermined from specification and added to molten metal as \nrequired. \n2.4 Chill, wedge test is undertaken as required to standard \noperating procedures.\n \n3. Maintain \nquality of \nmetal as \nrequired\n3.1 Slag or dross is removed as necessary. \n3.2 The temperature is monitored by contact thermocouple as \nrequired. \n3.3 Sample for chemical analysis is taken and submitted to \nlaboratory according to standard operating procedures.\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           41\n \n \n4. Pour molten \nmetal. \n \n4.1 Personnel in the immediate area of metal pour are informed \nthat pouring is to take place and appropriate safety clothing \nand equipment is used as specified in standard operating \nprocedures. \n4.2 Metal is poured safely in accordance with standard \noperating procedures and occupational health and \nsafety (OH & S) requirements. \n4.3 Metal is poured at an appropriate and continuous rate \nwithout over-flowing or splashing. \n4.4 Co-workers are instructed to assist in firing of the mold to \nignite gasses escaping in the parting line, venting, risers and \nflow-off. \n4.5 Test bar is poured in accordance with standard operating \nprocedures.\n \n5. Empty excess \nmetal for the \nladle \n \n5.1 Pig-molds are poured and tagged. \n5.2 Dross/slagged poured in tote boxes \n5.3 The ladle is appropriately cleaned and maintained as per \nstandard operating procedures.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           42\nRANGE OF VARIABLE \nVARIABLE \nRANGE \n \n1. Condition of \nthe mold \n1.1 Mold clamping \n1.2 Weighing \n1.3 Bolting \n1.4 Positioning of the sprue \n1.5 Pouring basin \n1.6 Riser type and position \n1.7 Flame igniter \n1.8 Platform for pourer \n1.9 Fire wall for pourer \n1.10 Vent-off and flow-off.\n \n2. Condition of \nladle \n2.1 \nLining condition \n2.2 \nWheel mechanism \n2.3 \nStopper rod \n2.4\nLadle lips.\n \n3. Ladle defect \n3.1  Cracks \n3.2  Erosion (localized) \n3.3 Tilting mechanism malfunction\n \n4. Pre-heated \n5.1 Thorough drying of lining finally at a “red-heat”      \n      condition. \n \n5. Appropriate \nweight\n6.1 Measured by crane scale or a photo-cell in the   \n      furnace which indicates the amount of metal taken out \n \n6. Additives \n6.1 Alloys  \n6.2 Inoculants \n6.3 Spheroidizer \n6.4 Deoxidizers\n \n7. Temperature \n    monitoring \n \n7.1 Measurement by immersion thermocouple (platinum /  \n      rhodium) couple. \n7.2 Optical pyrometer is not accurate since it is  \n     influenced by slag, dross and smoke.\n \n8. Standard \noperating \nprocedures \n(SOP) and \noccupational \nhealth and \nsafety (OH & S)\nStandard operating procedures (SOP) may include: \n8.1 Use of production drawing and technical specification \n8.2  Practice of quality handbook \n8.3 e Application of process handbook \n8.4 Use of shop instruction \nOccupational health and safety (OH & S) may include: \n8.5 Use of personal protective equipment \n8.6 Storage and disposal of harmful substances  \n8.7Provision of emission control devices\n \n9. Firing of the \nmold\n9.1 To ignite gasses developed inside the mold during  pouring.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           43\n \nEVIDENCE GUIDE \n \n1. Critical aspect of  \n     competency \nAssessment requires evidence that the candidate  \n1.1 Prepared for pouring molten metal. \n1.2 Transferred ladle to furnace. \n1.3 Maintained quality of metal as required. \n1.4 Poured molten metal. \n1.5Emptied excess metal for the ladle.\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Types and pouring characteristics of metals. \n2.2 Types and characteristics of ladles. \n2.3 Procedures for maintaining condition and integrity of ladle. \n2.4 Procedures for safe handling and transference of  \n      molten metal. \n2.5 Metal treatments, applications and procedures for \n      making additions to molten metal. \n2.6 Slag and dross removing procedures. \n2.7 Techniques for sampling and testing molten metal. \n2.8 Pouring procedures. \n2.9 Metal identification and tagging procedures. \n2.10 Use and application of personal protective equipment. \n2.11 Safe work practices and procedures. \n2.12 Hazards and control measures associated with pouring \nmolten metal. \n2.13 Type of ladle refractories, application and pre-heating \nrequirement. \n2.14 Lining mixtures for different ladles and lining procedures \n2.15 Observant/Attentive to details \n2.16 Patient \n2.17 Honest\n  \n3. Underpinning  \n    skills \n \n3.1 Reading and following written instructions, standard \noperating procedures, specifications and standard test data \nsheets. \n3.2 Selecting and checking ladle.  \n3.3 Preparing ladle for pouring. \n3.4 Transferring metal to ladle. \n3.5 Treating metal. \n3.6 Removing slag and dross. \n3.7 Sampling and testing molten metal. \n3.8 Pouring molten metal into moulds and pigs. \n3.9 Tagging pig metal. \n3.10 Using communication skills to effectively transfer skills and      \nknowledge to employees. \n3.11 Lining mixture for pouring ladles, shanks, and crane or bull \nladles. \n3.12 Lining and coating of ladle. \n3.13 Repair / maintenance of ladle. \n3.14 Temperature measurement by optical pyrometer or \nimmersion type thermocouple. \n3.15 Control of ladle wheel mechanism.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           44\n \n \n4. Resource \nimplications \n \n \nThe following resources MUST be provided:  \n4.1  All manuals/catalogues relative to Melting/Casting \n4.2  Job order, requisitions slip for materials \n4.3  Materials, tools and equipment relevant to the activity  \n4.4 Melting furnace  \n \n5. Method of \nassessment \n \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3 Third party report\n \n6. Context of \nassessment  \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n      simulated environment\n",
