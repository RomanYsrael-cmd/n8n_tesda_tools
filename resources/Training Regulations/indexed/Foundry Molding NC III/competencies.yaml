        "source_title": "PREPARE HAND MOLDING TO PRODUCE HEAVY CASTING",
        "source_text": "--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           37\nUNIT OF COMPETENCY : \nPREPARE HAND MOLDING TO PRODUCE  \nHEAVY CASTING \n            \nUNIT CODE  \n \n:  \nALT812313 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the production of mold manually to  \ncast heavy casting (500 kgs. or more net weight) \nindividually or as a team. Examples of application are \ncastings used for stamping, forming, blanking and \ntrimming dies, welding fixtures, skid rails. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Determine job \nrequirements \n \n1.1 Job requirement are determined from job sheet, \ninstruction manual, and shop brainstorming meeting. \n1.2 Pattern size (length, width and height) inspected and \nmeasured according to product drawing. \n1.3 Method of molding and rigging are determined and \nselected according to job requirements. \n1.4 Type of sand mixture to be used is determined \naccording to job requirements.\n \n2. Prepare pattern \nand accessories \n \n2.1 Pattern / corebox is cleaned and inspected according \nto standard operating procedures. \n2.2 Molding box is selected including location of rigging \naccording to job requirements \n2.3 Molding allowances are determined according to job \nrequirements\n \n3. Make mold \n \n3.1 Pattern is set up/positioned according to standard \noperating procedures \n3.2 Mold making is performed according to standard \noperating procedures \n3.3 Riser, gating system, vents, flow-off is  located \naccording to casting plan \n3.4 Mold is inspected, repaired and  finished according to \nstandard operating procedures.\n \n4. Apply mold coating \n \n4.1 Mold coating is prepared / mixed according to \nstandard operating procedures. \n4.2 Mold pre-heated with LPG burner according to \nstandard operating procedures. \n4.3 Mold coating applied to appropriate mold surface \nincluding riser and gating system. \n4.4 Mold secured prior to mold assembly and pouring \naccording to standard operating procedures. \n4.5 Tasks are completed in accordance with standard \noperating procedures and occupational health and \nsafety (OH & S) requirements.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           38\n \nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n \n1. Job requirements \n \n1.1 Number of casting required \n1.2 Priorities \n1.3 Molding box to be used including sand clearance on \nmold edges.\n \n2. Method of \nmolding\n \n2.1 Adapts to pattern construction. \n \n3. Sand mixture \nDepends mostly on: \n3.1 Type of metal  \n3.2 Pouring temperature  \n3.3 Casting weight. \n \n4. Rigging \n \n4.1 Cross bar \n4.2 Guide pin/bushing \n4.3 Molding board \n4.4 Roll over cam \n4.5Anti-shift location\n \n5. Molding \nallowance \n5.1 Sand edge \n5.2 Gating and risering system \n5.3 Flow-off \n5.4Vents\n \n6. Mold coating \n6.1 Alcohol based graphite or non-carbonaceous \ncoating. \n6.2 Application can be brushing, swabbing, spraying. \n6.3 Control of viscosity. \n \n7. Mold pre-heating \n \n7.1 Mold surface only or where mold coating is applied to \n     remove excess moisture.\n8. Standard \noperating \nprocedures (SOP) \nand occupational \nhealth  and safety  \n(OH & S) \nStandard operating procedures (SOP) may include: \n8.1 Use of production drawing and technical specification \n8.2 Practice of quality handbook \n8.3 Use Application of process handbook \n8.4 Use of shop instruction \nOccupational health and safety (OH & S) may include: \n8.5 Use of personal protective equipment \n8.6 Storage and disposal of harmful substances  \n8.7Provision of emission control devices\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           39\nEVIDENCE GUIDE  \n \n1. Critical aspect \nof   \n     competency \nAssessment requires evidence that the candidate  \n1.1 Determined job requirements. \n1.2 Prepared pattern and accessories. \n1.3 Made molds. \n1.4Applied Mold coating.\n \n2. Underpinning \nknowledge \nand attitudes \n2.1 Metal casting process. \n2.2 Variety of pattern types and their application. \n2.3 Pattern assembly techniques. \n2.4 Selection of molding box. \n2.5 How to select ancillary components. \n2.6 Sand types and their bonding systems. \n2.7 Compaction processes. \n2.8 Parting and stripping systems. \n2.9 Mold requirements. \n2.10 Finishing and closing techniques. \n2.11 Core placement. \n2.12 Pouring requirements. \n2.13 Securing systems. \n2.14 Pattern care and storage.\n  \n3. Underpinning  \n      skills \n \n3.1 Interpreting written instruction sketches and drawings. \n3.2 Assembling and positioning pattern in the molding box.  \n3.3 Positioning ancillary methoding components. \n3.4 Preparing molding media. \n3.5 Filling and compacting the mold assembly. \n3.6 Stripping the pattern. \n3.7 Inspecting the mold. \n3.8 Finishing the mold. \n3.9 Positioning cores in prints. \n3.10 Closing molds. \n3.11 Placing pouring basin. \n3.12 Securing mold. \n3.13 Following oral instruction. \n3.14 Entering routine and familiar information on proforma and \nstandard workplace forms.\n \n4. Resource \nimplications \n \nThe following resources MUST be provided:  \n4.1 All manuals/catalogues relative to Melting/Casting \n4.2 Job order, requisitions slip for materials \n4.3 Materials, tools and equipment relevant to the activity  \n4.4Melting furnace \n \n5. Method of \nassessment \n  \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3Third party report \n \n6. Context of \nassessment  \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n      simulated environment\n",
