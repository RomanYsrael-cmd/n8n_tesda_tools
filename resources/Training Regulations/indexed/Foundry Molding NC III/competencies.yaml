  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in FOUNDRY MOLDING NC III.\n\nBASIC COMPETENCIES\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1 Appropriate communication method is selected\n1.2 Multiple operations involving several topics areas\nare communicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when\nrequired\n1.7 Communication skills are maintained in all\nsituations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided\nimmediately\n2.3 Constructive contributions are made to\nworkplace discussions on such issues as\nproduction, quality and safety\n2.4 Goals/objectives and action plan undertaken in\nthe workplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are\norganized coherently to ensure clear and\neffective communication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised\nas they arise\n\n--- PDF PAGE 5 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1 Non-verbal gestures\n1.2 Verbal\n1.3 Face to face\n1.4 Two-way radio\n1.5 Speaking to groups\n1.6 Using telephone\n1.7 Written\n1.8 Internet\n\n--- PDF PAGE 6 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n\n4\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at\none time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written\nform\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning\nskills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n\n--- PDF PAGE 7 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n\n5\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining team\nand individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to\nteam members\n1.2\nReasons for instructions and requirements are\ncommunicated to team members\n1.3\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude\nrequired to properly undertake the assigned task\nand according to company policy\n2.2\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on\nclient needs and according to assignment\nrequirements\n3.2\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2\nTeam members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer policy\n4.4\nTeam members are kept informed of any changes\nin the priority allocated to assignments or tasks\nwhich might impact on client/customer needs and\nsatisfaction\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6\nFollow-up communication is provided on all issues\naffecting the team\n4.7\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 8 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s concerns\n2.1\nRoster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 9 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n\n7\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2\nAssessed and monitored team and individual\nperformance against set criteria\n1.3\nRepresented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5\nSet and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Underpinning\nknowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3\nCase studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n\n8\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto collect information in order to negotiate to a desired\noutcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating non verbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques\nis identified and included in the plan\nInformation is checked to ensure it is correct and\nup-to- date\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content\nand process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally\nfor resolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 12 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 10\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 13 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 11\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills\nand attitudes required to solve problems in the workplace\nincluding the application of problem solving techniques\nand to determine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nIdentify the problem\n1.1 Variances are identified from normal operating\nparameters; and product quality\n1.2 Extent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3 Problems are clearly stated and specified\n2.\nDetermine\nfundamental causes\nof the problem\n2.1 Possible causes are identified based on\nexperience and the use of problem solving tools /\nanalytical techniques.\n2.2 Possible cause statements are developed based\non findings\n2.3 Fundamental causes are identified per results of\ninvestigation conducted\n3.\nDetermine corrective\naction\n3.1 All possible options are considered for resolution\nof the problem\n3.2 Strengths and weaknesses of possible options\nare considered\n3.3 Corrective actions are determined to resolve the\nproblem and possible future causes\n3.4 Action plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and operating\nprocedures\n4.\nProvide\nrecommendation/s to\nmanager\n4.1 Report on recommendations are prepared\n4.2 Recommendations are presented to appropriate\npersonnel.\n4.3 Recommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 13\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1\nRelevant equipment and operational\nprocesses\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4\nPrinciples of decision making strategies\nand techniques\n2.2.5\nEnterprise information systems and data\ncollation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 16 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 14\n\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 17 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 15\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts and\ntechniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 19 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 17\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nskills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 18\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in\naccordance with the industry standard operating\nprocedure, manufacturer’s operating\nguidelines and occupational health and safety\nprocedure to ensure its operative ability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3 Technology failure/ defect is immediately reported\nto the concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 21 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 19\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 20\n EVIDENCE GUIDE\n\n2 1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nskills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 21\nCOMMON COMPETENCIES\n\nAUTOMOTIVE MANUFACTURING\n\nUNIT TITLE\n:\nREAD, INTERPRET AND APPLY ENGINEERING\nDRAWINGS\n\nUNIT CODE\n:\nALT742201\n\nUNIT DESCRIPTOR:\nThis unit deals with identifying, interpreting and applying\nspecification from Engineering blue prints or drawings that\nprovides the measurements of the product and pattern that is\nto be produced.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\ndrawings/\nspecification\n\n1.1 Appropriate Engineering drawings are identified and\naccessed as per job requirements.\n1.2 Version and date of drawing is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret drawings\n\n2.1 Relevant dimensions and sections of the drawings/\nspecifications are located in relation to the work to be\nconducted\n2.2 Information in the manual are interpreted in accordance to\nindustry practices\n\n3 Apply information\nin the drawings &\nspecifications\n\n3.1 Engineering drawing is interpreted according to job\nrequirements\n3.2 Work steps are correctly identified in accordance with the\nspecifications in the drawings.\n3.3 Dimensional data and shape are applied according to the\ngiven task\n\n4. Store drawings\n\n4.1 The drawings and specification are stored properly to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 24 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engineering drawings\nKinds of drawings:\n1.1 Casting drawing\n1.2 Machining drawing\n1.3 Project plan\n1.4 Technical drawing\n2. Data\nData includes but not limited to\n2.1 Material specifications\n2.2 Process specifications\n2.3 Special instructions\n2.4 Machining locating points\n2.5 Clamping points\n2.6 Amount of draft\n2.7 Surface finish\n\n--- PDF PAGE 25 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 23\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed drawings/specification\n1.2 Interpreted drawings\n1.3 Applied information in drawings\n1.4 Stored drawings\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of drawings used in automotive manufacturing industry\n2.2 Identification of symbols used in the drawings\n2.3 Identification of units of measurements\n2.4 Unit conversion\n2.5 Attention to details, Perseverance, Honesty\n\n1. Underpinning\nskills\n\n1.1 Reading and comprehension skills required to identify and\ninterpret engineering drawings and specifications\n1.2 Accessing information and data\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All drawings/engineering specifications relative to automotive\nmanufacturing\n4.2 Job order, requisitions\n4.3 Product sample\n\n5 Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 26 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 24\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n\n:\nALT311202\n\nUNIT DESCRIPTOR\n:\nThis unit includes identifying, caring for, handling,\nusing and maintaining measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according\nto job requirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\nusing the four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 27 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 25\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Straight Edge\nThickness gauge\n1.6 Try square\n1.7 Protractor\n1.8 Height gauge\n1.9 Steel rule\nShrink rule\n\n2. Calculation\n\nKinds of part mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11 Shrinkage allowance\n\n--- PDF PAGE 28 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 26\nEVIDENCE GUIDE\n\n1. Critical aspect\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Underpinning\n skills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction,\nMultiplication and Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.1 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 27\nUNIT TITLE\n:\nREAD, INTERPRET AND APPLY SPECIFICATION AND\nMANUALS\n\nUNIT CODE\n:\nALT723203\n\nUNIT DESCRIPTOR:\nThis unit deals with identifying, interpreting and applying\nservice specification manuals, maintenance procedure\nmanuals and periodic maintenance manual.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per\njob requirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3 Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 29\n\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2Accessing information and data\n\n4 Resource\nImplications\n\nThe following resources must be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 30\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE\n:\nALT723205\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and\nchecking of tools/ equipment and disposal of used\nsupplies/materials are also incorporated in this\ncompetency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools cleaning\nrequirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\nrespective shelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per workshop\nSOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or\nheavy vehicle and/or plant transmissions and/or\noutdoor power equipment\n1.2\nOpen workshop/garage and enclosed, ventilated office\narea\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health and Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 32\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per\nrequired procedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty,\nPatience, Attention to Details)\n3. Underpinning skills\n3.1 Handling/Storing of tools/equipment/supplies and\nmaterial\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a\nsimulated environment.\n6.2\nThe assessment of practical skills must take place after\na period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 33\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPREPARE SAND MIXTURE FOR HEAVY\nCASTING\n\nUNIT CODE\n\n:\nALT812312\n\nUNIT DESCRIPTOR\n:\nThis unit covers the preparation of a sand mixture\nfor molding / core making of heavy casting (500 kgs.\nor more net weight). The mixture will be applied for\nfacing, backing and core sand. The heavy castings\nare usually cast to make press die parts such as\nforming, blanking die and trimming dies, base plates\nfor molding machine.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirement\n\n1.1 Job requirement are determined from job sheet and\ninstruction sheet.\n1.2 Type of sand mixture is selected in accordance with job\nrequirements\n1.3 Volume of sand mixture is prepared according to job\nrequirements.\n\n2. Select materials\n\n2.1 Materials for sand mixture are calculated as per job\nrequirements.\n2.2 Requisition of materials is completed as per standard\noperating procedure.\n\n3. Select mixer\n\n3.1 Mixer selected applying knowledge of facing, backing, core\nsand mixer capacities.\n3.2 Pre-operational equipment inspection is conducted as per\nstandard operating procedures.\n\n4. Mixing of sand\nmixture\n\n4.1 Sand mixer / muller is operated according to manufacturing\ninstruction\n4.2 Loading sequence of sand, binder, additives is\naccomplished according to standard operating procedures.\n4.3 Cycle time per loading / mixing is determined per volume\nof mixture.\n4.4 Moldability of sand mixture is manually tested according to\njob requirements.\n\n5. Discharge / store\nsand\n\n5.1 Sand discharged to sand bin as per standard operating\nprocedures.\n5.2 Mixer / muller shut down as per standard operating\nprocedures.\n5.3 Conditioned sand transfer to molding / core making line\naccording to procedure.\n\n6. Perform house\nkeeping\n\n6.1 Mixer/Muller cleaned according to standard operating\nprocedure.\n6.2 Excess sand and other debris are disposed of according to\noccupational health and safety (OH & S) requirements.\n6.3 Housekeeping around the work area is performed as per\ncompany procedure..\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 34\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Job requirement\n\n1.1 Type of metal to be poured.\n1.2 Number of molds required.\n\n2. Type of sand\nmixture\n2.1 Chromite, silica with silicate binder and hardened by\ncarbon dioxide process.\n2.2 Chemically bonded sand with appropriate catalyst.\n\n3. Sand mixture\n\n3.1 Sand\n3.2 Binder\n3.3 Additives\n\n4. Loading\nsequence\n and cycle time\n\n4.1 Timing of addition.\n4.2 Mixer capabilities (over-loading).\n4.3 The dwell time that each binder / sand / additives is\nmixed before new addition is made.\n5. Occupational\nhealth and safety\n(OH & S)\nOccupational health and safety (OH & S) may include:\n5.1 Use of personal protective equipment\n5.2 Storage and disposal of harmful substances\n5.3Provision of emission control devices\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 35\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate\n1.1 Determined job requirements.\n1.2 Selected materials.\n1.3 Selected mixer.\n1.4 Mixed sand mixture.\n1.5 Discharged / stored sand.\n1.6 Performed housekeeping.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Characteristics, safe handling procedure and mixture\n applications of sand and binding agents.\n2.2 Molding requirements.\n2.3 Mixers, applications, loading, operating and unloading\nprocedures.\n2.4 Volumes, quantities, ratios and percentages.\n2.5 Sampling, testing and acceptance criteria for mixed\nsand.\n2.6 Procedures for cleaning and shutting down mixer.\n2.7 Environmental requirements for the disposal of unwanted\nsand.\n2.8 Use and application of personal protective equipment.\n2.9 Safe work practices and procedures.\n2.10 Hazards and control measures related to preparing\nand mixing sand for metal molding.\n2.11 Sampling, testing and acceptance criteria for raw sand,\nbinders, additives.\n2.12 Properties / characteristics of molding sand.\n2.13 Properties / characteristics of no-bake binders and its\napplication.\n2.14 Sand mixing equipment capabilities / capacities\n2.15 Observant/Attentive to details\n2.16 Patient\n2.17 Honest\n\n3. Underpinning\nskills\n\n3.1 Reading and following written instructions and standard\noperating procedures.\n3.2 Setting parameters for mixing.\n3.3 Loading mixers.\n3.4 Mixing sand and monitoring the process.\n3.5 Sampling and testing mixed sand.\n3.6 Discharging sand.\n3.7 Closing down and cleaning.\n3.8 Using measurement skills for preparing and mixing sand\nwithin the scope of this unit.\n3.9 Routine maintenance of mixers / mullers.\n3.10 Incoming test of raw materials.\n3.11 Visual recognition of sand’s type / binders.\n3.12 Communicate orally.\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 36\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Melting/Casting\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Actual furnace\n\n5 Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 37\nUNIT OF COMPETENCY :\nPREPARE HAND MOLDING TO PRODUCE\nHEAVY CASTING\n\nUNIT CODE\n\n:\nALT812313\n\nUNIT DESCRIPTOR\n:\nThis unit covers the production of mold manually to\ncast heavy casting (500 kgs. or more net weight)\nindividually or as a team. Examples of application are\ncastings used for stamping, forming, blanking and\ntrimming dies, welding fixtures, skid rails.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Determine job\nrequirements\n\n1.1 Job requirement are determined from job sheet,\ninstruction manual, and shop brainstorming meeting.\n1.2 Pattern size (length, width and height) inspected and\nmeasured according to product drawing.\n1.3 Method of molding and rigging are determined and\nselected according to job requirements.\n1.4 Type of sand mixture to be used is determined\naccording to job requirements.\n\n2. Prepare pattern\nand accessories\n\n2.1 Pattern / corebox is cleaned and inspected according\nto standard operating procedures.\n2.2 Molding box is selected including location of rigging\naccording to job requirements\n2.3 Molding allowances are determined according to job\nrequirements\n\n3. Make mold\n\n3.1 Pattern is set up/positioned according to standard\noperating procedures\n3.2 Mold making is performed according to standard\noperating procedures\n3.3 Riser, gating system, vents, flow-off is located\naccording to casting plan\n3.4 Mold is inspected, repaired and finished according to\nstandard operating procedures.\n\n4. Apply mold coating\n\n4.1 Mold coating is prepared / mixed according to\nstandard operating procedures.\n4.2 Mold pre-heated with LPG burner according to\nstandard operating procedures.\n4.3 Mold coating applied to appropriate mold surface\nincluding riser and gating system.\n4.4 Mold secured prior to mold assembly and pouring\naccording to standard operating procedures.\n4.5 Tasks are completed in accordance with standard\noperating procedures and occupational health and\nsafety (OH & S) requirements.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 38\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Job requirements\n\n1.1 Number of casting required\n1.2 Priorities\n1.3 Molding box to be used including sand clearance on\nmold edges.\n\n2. Method of\nmolding\n\n2.1 Adapts to pattern construction.\n\n3. Sand mixture\nDepends mostly on:\n3.1 Type of metal\n3.2 Pouring temperature\n3.3 Casting weight.\n\n4. Rigging\n\n4.1 Cross bar\n4.2 Guide pin/bushing\n4.3 Molding board\n4.4 Roll over cam\n4.5Anti-shift location\n\n5. Molding\nallowance\n5.1 Sand edge\n5.2 Gating and risering system\n5.3 Flow-off\n5.4Vents\n\n6. Mold coating\n6.1 Alcohol based graphite or non-carbonaceous\ncoating.\n6.2 Application can be brushing, swabbing, spraying.\n6.3 Control of viscosity.\n\n7. Mold pre-heating\n\n7.1 Mold surface only or where mold coating is applied to\n remove excess moisture.\n8. Standard\noperating\nprocedures (SOP)\nand occupational\nhealth and safety\n(OH & S)\nStandard operating procedures (SOP) may include:\n8.1 Use of production drawing and technical specification\n8.2 Practice of quality handbook\n8.3 Use Application of process handbook\n8.4 Use of shop instruction\nOccupational health and safety (OH & S) may include:\n8.5 Use of personal protective equipment\n8.6 Storage and disposal of harmful substances\n8.7Provision of emission control devices\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 39\nEVIDENCE GUIDE\n\n1. Critical aspect\nof\n competency\nAssessment requires evidence that the candidate\n1.1 Determined job requirements.\n1.2 Prepared pattern and accessories.\n1.3 Made molds.\n1.4Applied Mold coating.\n\n2. Underpinning\nknowledge\nand attitudes\n2.1 Metal casting process.\n2.2 Variety of pattern types and their application.\n2.3 Pattern assembly techniques.\n2.4 Selection of molding box.\n2.5 How to select ancillary components.\n2.6 Sand types and their bonding systems.\n2.7 Compaction processes.\n2.8 Parting and stripping systems.\n2.9 Mold requirements.\n2.10 Finishing and closing techniques.\n2.11 Core placement.\n2.12 Pouring requirements.\n2.13 Securing systems.\n2.14 Pattern care and storage.\n\n3. Underpinning\n skills\n\n3.1 Interpreting written instruction sketches and drawings.\n3.2 Assembling and positioning pattern in the molding box.\n3.3 Positioning ancillary methoding components.\n3.4 Preparing molding media.\n3.5 Filling and compacting the mold assembly.\n3.6 Stripping the pattern.\n3.7 Inspecting the mold.\n3.8 Finishing the mold.\n3.9 Positioning cores in prints.\n3.10 Closing molds.\n3.11 Placing pouring basin.\n3.12 Securing mold.\n3.13 Following oral instruction.\n3.14 Entering routine and familiar information on proforma and\nstandard workplace forms.\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Melting/Casting\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4Melting furnace\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 40\nUNIT OF COMPETENCY :\nPOUR MOLTEN METAL TO HEAVY CASTINGS\n\nUNIT CODE\n\n:\nALT812314\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competency in manually\npouring molten metal as part of metal casting and\nmolding process with ladle capacities of 500Kgs or\nmore using bull ladle, crane ladle a bottom poured\nladle.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare for\npouring\nmolten metal\n\n1.1 Condition of the mold is checked according to standard\noperating procedures.\n1.2 Condition of the ladle is checked and appropriate\nmeasures are undertaken to correct ladle defects according\nto standard operating procedures.\n1.3 Temperature of molten metal is checked for conformance to\nspecification and pouring method is sequenced to standard\noperating procedures.\n1.4 The capacity of the required pour is identified against\nspecification according to standard operating procedures.\n1.5 Over-head cranes, wire-ropes, metal shield are checked\naccording to standard operating procedures.\n1.6Ladle is pre-heated according to prescribed procedures.\n\n2. Transfer ladle\nto furnace\n\n2.1 Safety clips of the lifting hooks are checked according to\nstandard operating procedures.\n2.2 Ladle is filled with appropriate weight and transferred to\nthe pouring area in accordance with standard operating\nprocedures.\n2.3 Required additives / ferro-alloys and metal cover\ndetermined from specification and added to molten metal as\nrequired.\n2.4 Chill, wedge test is undertaken as required to standard\noperating procedures.\n\n3. Maintain\nquality of\nmetal as\nrequired\n3.1 Slag or dross is removed as necessary.\n3.2 The temperature is monitored by contact thermocouple as\nrequired.\n3.3 Sample for chemical analysis is taken and submitted to\nlaboratory according to standard operating procedures.\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 41\n\n4. Pour molten\nmetal.\n\n4.1 Personnel in the immediate area of metal pour are informed\nthat pouring is to take place and appropriate safety clothing\nand equipment is used as specified in standard operating\nprocedures.\n4.2 Metal is poured safely in accordance with standard\noperating procedures and occupational health and\nsafety (OH & S) requirements.\n4.3 Metal is poured at an appropriate and continuous rate\nwithout over-flowing or splashing.\n4.4 Co-workers are instructed to assist in firing of the mold to\nignite gasses escaping in the parting line, venting, risers and\nflow-off.\n4.5 Test bar is poured in accordance with standard operating\nprocedures.\n\n5. Empty excess\nmetal for the\nladle\n\n5.1 Pig-molds are poured and tagged.\n5.2 Dross/slagged poured in tote boxes\n5.3 The ladle is appropriately cleaned and maintained as per\nstandard operating procedures.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 42\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n\n1. Condition of\nthe mold\n1.1 Mold clamping\n1.2 Weighing\n1.3 Bolting\n1.4 Positioning of the sprue\n1.5 Pouring basin\n1.6 Riser type and position\n1.7 Flame igniter\n1.8 Platform for pourer\n1.9 Fire wall for pourer\n1.10 Vent-off and flow-off.\n\n2. Condition of\nladle\n2.1\nLining condition\n2.2\nWheel mechanism\n2.3\nStopper rod\n2.4\nLadle lips.\n\n3. Ladle defect\n3.1 Cracks\n3.2 Erosion (localized)\n3.3 Tilting mechanism malfunction\n\n4. Pre-heated\n5.1 Thorough drying of lining finally at a “red-heat”\n condition.\n\n5. Appropriate\nweight\n6.1 Measured by crane scale or a photo-cell in the\n furnace which indicates the amount of metal taken out\n\n6. Additives\n6.1 Alloys\n6.2 Inoculants\n6.3 Spheroidizer\n6.4 Deoxidizers\n\n7. Temperature\n monitoring\n\n7.1 Measurement by immersion thermocouple (platinum /\n rhodium) couple.\n7.2 Optical pyrometer is not accurate since it is\n influenced by slag, dross and smoke.\n\n8. Standard\noperating\nprocedures\n(SOP) and\noccupational\nhealth and\nsafety (OH & S)\nStandard operating procedures (SOP) may include:\n8.1 Use of production drawing and technical specification\n8.2 Practice of quality handbook\n8.3 e Application of process handbook\n8.4 Use of shop instruction\nOccupational health and safety (OH & S) may include:\n8.5 Use of personal protective equipment\n8.6 Storage and disposal of harmful substances\n8.7Provision of emission control devices\n\n9. Firing of the\nmold\n9.1 To ignite gasses developed inside the mold during pouring.\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 43\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\n competency\nAssessment requires evidence that the candidate\n1.1 Prepared for pouring molten metal.\n1.2 Transferred ladle to furnace.\n1.3 Maintained quality of metal as required.\n1.4 Poured molten metal.\n1.5Emptied excess metal for the ladle.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types and pouring characteristics of metals.\n2.2 Types and characteristics of ladles.\n2.3 Procedures for maintaining condition and integrity of ladle.\n2.4 Procedures for safe handling and transference of\n molten metal.\n2.5 Metal treatments, applications and procedures for\n making additions to molten metal.\n2.6 Slag and dross removing procedures.\n2.7 Techniques for sampling and testing molten metal.\n2.8 Pouring procedures.\n2.9 Metal identification and tagging procedures.\n2.10 Use and application of personal protective equipment.\n2.11 Safe work practices and procedures.\n2.12 Hazards and control measures associated with pouring\nmolten metal.\n2.13 Type of ladle refractories, application and pre-heating\nrequirement.\n2.14 Lining mixtures for different ladles and lining procedures\n2.15 Observant/Attentive to details\n2.16 Patient\n2.17 Honest\n\n3. Underpinning\n skills\n\n3.1 Reading and following written instructions, standard\noperating procedures, specifications and standard test data\nsheets.\n3.2 Selecting and checking ladle.\n3.3 Preparing ladle for pouring.\n3.4 Transferring metal to ladle.\n3.5 Treating metal.\n3.6 Removing slag and dross.\n3.7 Sampling and testing molten metal.\n3.8 Pouring molten metal into moulds and pigs.\n3.9 Tagging pig metal.\n3.10 Using communication skills to effectively transfer skills and\nknowledge to employees.\n3.11 Lining mixture for pouring ladles, shanks, and crane or bull\nladles.\n3.12 Lining and coating of ladle.\n3.13 Repair / maintenance of ladle.\n3.14 Temperature measurement by optical pyrometer or\nimmersion type thermocouple.\n3.15 Control of ladle wheel mechanism.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 44\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Melting/Casting\n4.2 Job order, requisitions slip for materials\n4.3 Materials, tools and equipment relevant to the activity\n4.4 Melting furnace\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n 45"
