        "source_title": "PREPARE SAND MIXTURE FOR HEAVY CASTING",
        "source_text": "--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           33\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nPREPARE SAND MIXTURE FOR HEAVY  \nCASTING \n            \nUNIT CODE  \n \n:  \nALT812312 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the preparation of a sand mixture  \nfor molding / core making of heavy casting (500 kgs. \nor more net weight). The mixture will be applied for \nfacing, backing and core sand. The heavy castings \nare usually cast to make press die parts such as \nforming, blanking die and trimming dies, base plates \nfor molding machine. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Determine job \nrequirement \n \n1.1 Job requirement are determined from job sheet and \ninstruction sheet. \n1.2 Type of sand mixture is selected in accordance with job \nrequirements \n1.3 Volume of sand mixture is prepared according to job \nrequirements.\n \n2. Select materials \n \n2.1 Materials for sand mixture are calculated as per job \nrequirements. \n2.2 Requisition of materials is completed as per standard \noperating procedure.\n \n3. Select mixer \n \n3.1 Mixer selected applying knowledge of facing, backing, core \nsand mixer capacities. \n3.2 Pre-operational equipment inspection is conducted as per \nstandard operating procedures.\n \n4. Mixing of sand \nmixture \n \n4.1 Sand mixer / muller is operated according to manufacturing \ninstruction \n4.2 Loading sequence of sand, binder, additives is \naccomplished according to standard operating procedures. \n4.3 Cycle time per loading / mixing is determined per volume \nof mixture. \n4.4 Moldability of sand mixture is manually tested according to \njob requirements.\n \n5. Discharge / store \nsand \n \n5.1 Sand discharged to sand bin as per standard operating \nprocedures. \n5.2 Mixer / muller shut down as per standard operating \nprocedures. \n5.3 Conditioned sand transfer to molding / core making line \naccording to procedure.\n \n6. Perform house \nkeeping \n \n6.1 Mixer/Muller cleaned according to standard operating \nprocedure. \n6.2 Excess sand and other debris are disposed of according to \noccupational health and safety (OH & S) requirements. \n6.3  Housekeeping around the work area is performed as per \ncompany procedure..\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           34\nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n \n1. Job requirement \n \n1.1 Type of metal to be poured. \n1.2 Number of molds required. \n \n2. Type of sand \nmixture \n2.1 Chromite, silica with silicate binder and hardened by \ncarbon dioxide process. \n2.2 Chemically bonded sand with appropriate catalyst. \n \n3.  Sand mixture \n \n3.1 Sand \n3.2  Binder \n3.3 Additives \n \n4. Loading \nsequence  \n     and cycle time \n \n4.1 Timing of addition. \n4.2 Mixer capabilities (over-loading). \n4.3 The dwell time that each binder / sand / additives is  \nmixed before new addition is made. \n5. Occupational \nhealth and safety \n(OH & S) \nOccupational health and safety (OH & S) may include: \n5.1 Use of personal protective equipment \n5.2 Storage and disposal of harmful substances  \n5.3Provision of emission control devices\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           35\nEVIDENCE GUIDE \n \n \n1.  Critical aspect of  \n       competency \nAssessment requires evidence that the candidate  \n1.1 Determined job requirements. \n1.2 Selected materials. \n1.3 Selected mixer. \n1.4 Mixed sand mixture. \n1.5 Discharged / stored sand. \n1.6 Performed housekeeping.\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Characteristics, safe handling procedure and mixture  \n      applications of sand and binding agents. \n2.2 Molding requirements. \n2.3 Mixers, applications, loading, operating and unloading \nprocedures. \n2.4 Volumes, quantities, ratios and percentages. \n2.5 Sampling, testing and acceptance criteria for mixed \nsand. \n2.6 Procedures for cleaning and shutting down mixer. \n2.7 Environmental requirements for the disposal of unwanted \nsand. \n2.8 Use and application of personal protective equipment. \n2.9 Safe work practices and procedures. \n2.10 Hazards and control measures related to preparing \nand mixing sand for metal molding. \n2.11 Sampling, testing and acceptance criteria for raw sand, \nbinders, additives. \n2.12 Properties / characteristics of molding sand. \n2.13 Properties / characteristics of no-bake binders and its \napplication. \n2.14 Sand mixing equipment capabilities / capacities \n2.15 Observant/Attentive to details \n2.16 Patient \n2.17 Honest\n  \n3. Underpinning  \nskills \n \n3.1 Reading and following written instructions and standard \noperating procedures. \n3.2 Setting parameters for mixing.  \n3.3 Loading mixers. \n3.4 Mixing sand and monitoring the process. \n3.5 Sampling and testing mixed sand. \n3.6 Discharging sand. \n3.7 Closing down and cleaning. \n3.8 Using measurement skills for preparing and mixing sand \nwithin the scope of this unit. \n3.9 Routine maintenance of mixers / mullers. \n3.10 Incoming test of raw materials. \n3.11 Visual recognition of sand’s type / binders. \n3.12 Communicate orally.\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________ \nTR FOUNDRY MOLDING NC III                                                                                                                Promulgated   \n           36\n \n \n4. Resource \nimplications \n \n \n \nThe following resources MUST be provided:  \n4.1 All manuals/catalogues relative to Melting/Casting \n4.2 Job order, requisitions slip for materials \n4.3 Materials, tools and equipment relevant to the activity  \n4.4 Actual furnace  \n \n5 Method of \nassessment \n    \n     \n \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3 Third party report \n \n6 Context of \nassessment  \n \n \n \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n       simulated environment.\n",
