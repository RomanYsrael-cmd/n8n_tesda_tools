  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of FOUNDRY MOLDING NC III, the candidate\nmust demonstrate competence in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2 The qualification of Foundry Molding NC III may be attained through demonstration\nof competence through project-type assessment covering all required units of\ncompetency of the qualification.\n\n4.2.1\nPerform Hand Molding to Produce Heavy Casting\n\nPrepare Sand Mixture for Heavy Casting\n\nPerform Hand Molding to Produce Heavy Castings\n\nPour Molten Metal to Heavy Casting\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1\nHolder of Foundry Molding NC II or equivalent qualification; or\n\n4.4.2\nGraduates of formal, non-formal and informal including enterprise-\nbased training programs.\n\n4.4.3\nExperienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________\nTR FOUNDRY MOLDING NC III Promulgated\n\n53\n\n"
