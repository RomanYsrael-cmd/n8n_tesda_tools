es\n3\nrolls\nSewing machine thread\n\n--- PDF PAGE 141 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 137\n\n2\npacks\nSpeedy rivet\n1\nroll\nSynthetic leather\n4\npcs\nTalcum powder\n2\nbottle\nDishwashing liquid\n1\nroll\nWire mesh\n4\nsacks\nSand\n6\npcs\nSocket adaptor\n6\npcs\nDouble pyramid receiver\n12\npcs\nTube Clamp\n6\npcs\nAluminum Pylon\n6\npcs\nProsthetic knee joint\n6\npcs\nSolid Ankle Cushion Heel Foot\n6\npcs\nFoot adaptor\n6\npcs\nCosmetic hand\n6\nPcs\nFriction wrist unit\n6\npcs\nManual locking elbow unit\n6\nset\nCable system\n6\nset\nSuction valve\n26\npcs\nTranstibial foam cover\n26\npcs\nTransfemoral foam cover\n\n--- PDF PAGE 142 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 138\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 24 students/trainees.\n(Reference: 1x2=2sqm/trainee or 1.75sqm/trainee)\n\nSPACE\nREQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ. METERS\nA. Building (permanent)\n\nLecture room\n5 x 10\n50\n50\nWash area/comfort room\n(male & female)\n4x2 for male\n4x2 for female\n16\n16\nB. Laboratory Areas\n\nWorkshop Room\n19 x 8\n152\n152\nRectification Room\n14 x 3\n42\n42\nOven Room\n5.2 x 5.2\n10.4\n10.4\nMachine Room\n5 x 7\n35\n35\nStorage Area\n14 x 3\n42\n42\nTotal Workshop Area\n347 sq. m.\n\nNOTE: Access to and use of equipment /facilities can be provided through cooperative\narrangements or MOA with other partner companies.\n\n There should at least be 1 trainer to facilitate lectures / activities involving a maximum of 8\ntrainees. Skills related activities should be supervised with a trainer-trainee ration of 1:4.\n\n3.6\nTRAINER’S QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Assistive\nRehabilitation Technology Services (Prosthetics) NC II or holder of Bachelor’s\nDegree relevant to the qualification (e.g. Prosthetics and Orthotics) with National\nCertificate on Trainer’s Methodology I (TMI)\n\n• Must have at least two (2) years industry experience in Prosthetics and\nOrthotics within the last five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 143 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 139"
