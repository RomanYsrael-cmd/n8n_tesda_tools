• Performing industry related work activities in\naccordance with OSH Standards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n• Identify the processes on environmental\npolicies\n• Relate the necessary skills in response to\nchanging environmental policies needs\n-\nWaste Management Skills\n-\nConservation of Energy in workplace\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n• Discussion of environmental protection and\nresource efficiency targets\n• Analysis on the relevant work procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.3 Convey\ninefficient and\nineffective\nenvironmental\npractices\n• Identification of (re)training needs and usage\nof environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing environment awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on best entrepreneurial practices\n• Discussion on quality procedures and\npractices\n• Case studies on cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 hour\n9.2 Communicate\nentrepreneurial\n• Discussion on communicating entrepreneurial\nworkplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n\n--- PDF PAGE 97 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 93\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nworkplace best\npractices\n9.3 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating entrepreneurial\nworkplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n\n--- PDF PAGE 98 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 94\nCOMMON COMPETENCIES\n(112 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1 Implement\nand monitor\ninfection\ncontrol\npolicies and\nprocedures\n(32 hours)\n1.1 Provide\ninformation to\nthe work group\nabout the\norganization's\ninfection control\npolicies and\nprocedures.\n•\nLecture and discussion on:\n-\nUse of personal protective equipment (PPE)\n-\nTransmission of infectious diseases\n-\nConcepts and modes of communication\n-\nCommunication equipment (computer,\ntelephone, cell phone etc.)\n-\nOSH, infection control, environmental and\ninstitutional, rules, guidelines, policies and\nprocedures\n-\nRespecting for patient / client rights\n-\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n•\nDemonstrate proper use of personal\nprotective equipment (PPE)\n•\nDemonstrate proper hand washing (WHO\nStandard)\n•\nApply Body Substance Isolation (BSI) by\nusing PPE (Personal Protective Equipment)\n•\nDemonstrate use of disinfectant\n•\nApply social distancing\n•\nDemonstrate operating equipment for\ncommunication\n•\nApply effective communicating and\ninterpersonal skills including:\n-\nlanguage competence\n-\nliteracy and reading competence\n-\nnegotiating Skills\n-\nintra and Interpersonal skills\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 99 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 95\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.2 Integrate the\norganization's\ninfection control\npolicy and\nprocedure into\nwork practices\n•\nLecture and discussion on:\n-\nUse of verbal and non-verbal therapeutic\ncommunication\n-\nRA 11058 – OSH Law\n-\nRA 9008 – Ecological Solid Waste\nManagement Act\n-\nRA 856 – Sanitation Code of the Phil.\n-\nHazards and infectious risk\n-\nSafe work procedures\n-\nUse of computer for documentation and\nreporting\n•\nDemonstrate appropriate wearing, removal\nand disposal of PPE (Personal Protective\nEquipment)\n•\nEncourage employees to report hazards and\nrisks in the work place\n•\nRecognize suggestions of employees to\nimprove infection control practices\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n1.3 Monitor infection\ncontrol\nperformance and\nimplement\nimprovements in\npractices\n•\nLecture and discussion on:\n-\nKey performance indicators of infection\ncontrol and prevention\n-\nMonitoring, surveillance and investigation of\ninfection risks and hazardous events\n-\nAggregate infection control information\nreports\n•\nDemonstrate identification, correction and\nreporting inadequacies in work procedures\nand infection control measures\n• Lecture (online /\nface to face)\n• Discussion (online