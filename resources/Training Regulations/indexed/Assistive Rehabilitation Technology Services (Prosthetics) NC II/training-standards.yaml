he vacuum\nforming station\n• Interactive lecture\n• Demonstration and\nreturn\ndemonstration\n• Written exam\n• Practical exam\n16 hours\n\n--- PDF PAGE 131 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 127\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Turn off all machines used during the\nfabrication\n• Return tools to their designated cabinets\n• Demonstrate thermoforming skills\n• Follow safety manual\n• Identify and control hazard/risks\n• Ability to handle operating\ntools/equipment/materials\n• Ability to follow correct procedures and\ninstructions\n5.5 Establish correct\nlength of trans\nhumeral/ elbow\ndisarticulation\naccording to\nmeasurement\nLecture and discussion on the following:\n•\nSystem height computation\n•\nUpper limb prosthetic components\n•\nCutting of pylons\n•\nUse of upper limb prosthetics components\n•\nUse of tools in cutting pylons\n•\nCompute measurements according to\nsystem height and prescription\nPerform the following tasks:\n•\nEstablish the socket extension according to\ncomputed measurements\n•\nAlign the elbow unit according to alignment\nlines\n•\nThermoform the second socket according to\nspecifications\n•\nRemove plaster in transradial/wrist\ndisarticulation socket\n•\nTrim and grind the transradial/wrist\ndisarticulation socket according to\nprescription\n• Interactive\nLecture\n• Demonstration\nand Return\nDemonstration\n• Written Exam\n• Practical Exam\n24 hours\n\n--- PDF PAGE 132 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 128\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5.6 Attach the trans\nhumeral/ elbow\ndisarticulation\ncomponents\naccording to\nalignment and\nsafety\nrequirements\nLecture and discussion on the following:\n•\nTransradial bench alignment\n•\nTools in assembly and bench alignment\n•\nBowden’s cable system principles\n•\nUse upper limb prosthetics components\n•\nUse of bench alignment tools and\nequipment\nPerform the following tasks:\n•\nAttach the terminal device to the upper limb\nwrist joint according to the prescribed\nalignment\n•\nAttach Bowden cable system to the trans\nhumeral/ elbow disarticulation according to\nprosthetic prescription\n•\nTighten the adaptor screws according to\ntightening standards\n•\nApply thread locker to the screws according\nto tightening standards\n•\nFollow safety manual\n•\nIdentify and control hazard/risks\n•\nDemonstrate reading skills\n•\nDemonstrate writing skills\n•\nAbility to handle operating tools/equipment\n•\nDemonstrate transhumeral assembling\nskills\n•\nInteractive\nLecture\n•\nDemonstration\nand Return\nDemonstration\n• Written Exam\n• Practical Exam\n12 hours\n5.7 Store the trans\nhumeral/ elbow\ndisarticulation\nprosthesis\nproperly until\nfitting date\nLecture and discussion on the following:\n•\nReporting\n•\nReporting process\n•\nVerbal communication\n•\nWritten communication\n•\nBasic computation (i.e., addition,\nsubtraction, multiplication and division)\n• Interactive Lecture\n• Demonstration\nand Return\nDemonstration\n• Written Exam\n• Practical Exam\n4 hours\n\n--- PDF PAGE 133 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 129\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nNomenclature of prosthetic and orthotic\ndevices\n•\nMaterials Science\n•\nPrescription terminologies and format\nPerform the following skills\n•\nLabel trans humeral/ elbow disarticulation\nfollowing device safe keeping process\n•\nPlace trans humeral/ elbow disarticulation\nprosthesis in safe and secure environment\nfollowing safe keeping process\n•\nCoordinate the readiness of trans humeral/\nelbow disarticulation prosthesis device\nfollowing institutional procedures\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping\n•\nDemonstrate reading skills\n•\nDemonstrate writing skills\n•\nAbility to handle operating tools/equipment\n6. Perform basic\nrepair and/or\nreplacement\nof the\nprosthetic\ndevices\n(18 hours)\n6.1 Received the\ndevice for repair\nor replacement of\nprosthetic\ncomponents\nLecture and discussion on the following:\n•\nReporting\n•\nReporting process\n•\nVerbal communication\n•\nOffice protocol\n•\nNomenclature of prosthetic and orthotic\ndevices\n•\nCommon problems in prosthesis\n•\nMaterials Science\n•\nProsthetic components\n•\nUse of prosthetic components\nPerform the following tasks:\n•\nReceive prescription in accordance with\nestablished documentation procedures\n•\nInteractive\nLecture\n•\nSmall Group\nDiscussion\n• Written Exam\n• Practical Exam\n4 hours\n\n--- PDF PAGE 134 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 130\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nVerify prescription according to established\ndocumentation procedures\n•\nLog prescription in accordance to\nestablished documentation procedures\n•\nDemonstrate interpersonal skills\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping skills\n•\nDemonstrate reading skills\n•\nFollow manufacturer ‘s specification\n6.2 Perform the\nnecessary repair\nor replacement\nneeded according\nto latest\nprescription\nLecture and discussion on the following:\n•\nTools\n•\nEquipment\n•\nUse of prosthetic components\n•\nUse of tools and equipment\nPerform the following tasks:\n•\nOrder replacement part/s or materials\naccording to prosthetist’s orders\n•\nConfirm order of replacement part/s\n•\nPerform the replacement needed according\nto the specifications and Prosthetist’s\norders\n•\nFollow safety manual\n•\nIdentify and control hazard/risks\n•\nDemonstrate reading skills\n•\nDemonstrate writing skills\n•\nDemonstrate repair skills\n•\nInteractive lecture\n•\nDemonstration\nand return\ndemonstration\n•\nWritten exam\n•\nPractical exam\n6 hours\n\n--- PDF PAGE 135 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 131\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n6.3 Secure the\nprosthetic device\nfor functionality\nand safety\nLecture and discussion on the following:\n•\nReporting\n•\nReporting process\n•\nVerbal communication and division)\n•\nUse of prosthetic components\nPerform the following tasks:\n•\nSecure all bolts and components\n•\nTest for safety and functionality of the\ndevice according to specifications\n•\nSend the repaired device to the Prosthetist\n•\nDemonstrate interpersonal skills\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping\n•\nDemonstrate reading skills\n•\nDemonstrate safe manual handling skills\n• Interactive Lecture\n• Demonstration and\nReturn\nDemonstration\n• Written Exam\n• Practical Exam\n8 hours\n\n--- PDF PAGE 136 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 132"
