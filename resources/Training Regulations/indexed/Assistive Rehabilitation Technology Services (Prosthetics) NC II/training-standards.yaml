ools and supplies in\naccordance to stock inventory protocols\nReceive tools and supplies in accordance with the\nrequest form.\n•\nDemonstrate interpersonal skills\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping\n•\nDemonstrate safe handling of tools and\nmaterials\n•\nDemonstrate hazard/risks identification and\ncontrol\n•\nDemonstrate ready skills to access industry\ninformation\n•\nDemonstrate verification skills\n• Interactive Lecture\n• Small Group\nDiscussion\n• Written Exam\n• Practical Exam\n4 hours\n5.3 Prepare a trans\nhumeral/ elbow\ndisarticulation\npositive cast for\nfabrication\n\nLecture and discussion on the following:\n•\nVacuum forming process and principles\n•\nUse of vacuum station\nPerform the following tasks:\n•\nEnsure that the positive cast is ensured free\nof bumps and sharp edges\n•\nInteractive\nLecture\n•\nDemonstration\nand Return\nDemonstration\n• Written Exam\n• Practical Exam\n4 hours\n\n--- PDF PAGE 130 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 126\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nPosition the positive cast in the vacuum\npipe securely\n•\nCheck the vacuum suction following the\nrequired pressure (PSI)\n•\nFollow safety manual\n•\nIdentify and control hazard/risks\n•\nDemonstrate vacuum forming skills\n•\nAbility to follow correct procedures and\ninstructions\n5.4 Thermoform hard\nplastic component\ntrans\nhumeral/elbow\ndisarticulation\nsocket\nLecture and discussion on the following:\n•\nTypes and thickness of Plastics\n•\nPrinciples of thermoforming\n•\nSocket adaptor placement and alignment\n•\nCuring of Plastic\n•\nUse of tools, materials and equipment\n•\nUse of upper limb prosthetic components\nPerform the following tasks:\n• Secure the adaptors according to the\nprescribed alignment\n• Position the positive mold on the vacuum\npipe properly\n• Ensure that the vacuum suction is working\n• Prepare materials according to prescribed\ndimensions\n• Vacuum form the plastic to the positive mold\n• Check if the trans humeral/ elbow\ndisarticulation socket has cooled and\nhardened before dismounting\n• Dismount the trans humeral/ elbow\ndisarticulation socket from the vacuum\nforming station\n• Interactive lecture\n• Demonstration and\nreturn\ndemonstration\n• Written exam\n• Practical exam\n16 hours\n\n--- PDF PAGE 131 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 127\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Turn off all machines used during the\nfabrication\n• Return tools to their designated cabinets\n• Demonstrate thermoforming skills\n• Follow safety manual\n• Identify and control hazard/risks\n• Ability to handle operating\ntools/equipment/materials\n• Ability to follow correct procedures and\ninstructions\n5.5 Establish correct\nlength of trans\nhumeral/ elbow\ndisarticulation\naccording to\nmeasurement\nLecture and discussion on the following:\n•\nSystem height computation\n•\nUpper limb prosthetic components\n•\nCutting of pylons\n•\nUse of upper limb prosthetics components\n•\nUse of tools in cutting pylons\n•\nCompute measurements according to\nsystem height and prescription\nPerform the following tasks:\n•\nEstablish the socket extension according to\ncomputed measurements\n•\nAlign the elbow unit according to alignment\nlines\n•\nThermoform the second socket according to\nspecifications\n•\nRemove plaster in transradial/wrist\ndisarticulation socket\n•\nTrim and grind the transradial/wrist\ndisarticulation socket according to\nprescription\n• Interactive\nLecture\n• Demonstration\nand Return\nDemonstration\n• Written Exam\n• Practical Exam\n24 hours\n\n--- PDF PAGE 132 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 128\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5.6 Attach the trans\nhumeral/ elbow\ndisarticulation\ncomponents\naccording to\nalignment and\nsafety\nrequirements\nLecture and discussion on the following:\n•\nTransradial bench alignment\n•\nTools in assembly and bench alignment\n•\nBowden’s cable system principles\n•\nUse upper limb prosthetics components\n•\nUse of bench alignment tools and\nequipment\nPerform the following tasks:\n•\nAttach the terminal device to the upper limb\nwrist joint according to the prescribed\nalignment\n•\nAttach Bowden cable system to the trans\nhumeral/ elbow disarticulation according to\nprosthetic prescription\n•\nTighten the adaptor screws according to\ntightening standards\n•\nApply thread locker to the screws according\nto tightening standards\n•\nFollow safety manual\n•\nIdentify and control hazard/risks\n•\nDemonstrate reading skills\n•\nDemonstrate writing skills\n•\nAbility to handle operating tools/equipment\n•\nDemonstrate transhumeral assembling\nskills\n•\nInteractive\nLecture\n•\nDemonstration\nand Return\nDemonstration\n• Written Exam\n• Practical Exam\n12 hours\n5.7 Store the trans\nhumeral/ elbow\ndisarticulation\nprosthesis\nproperly until\nfitting date\nLecture and discussion on the following:\n•\nReporting\n•\nReporting process\n•\nVerbal communication\n•\nWritten communication\n•\nBasic computation (i.e., addition,\nsubtraction, multiplication and division)\n• Interactive Lecture\n• Demonstration\nand Return\nDemonstration\n• Written Exam\n• Practical Exam\n4 hours\n\n--- PDF PAGE 133 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 129\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nNomenclature of prosthetic and orthotic\ndevices\n•\nMaterials Science\n•\nPrescription terminologies and format\nPerform the following skills\n•\nLabel trans humeral/ elbow disarticulation\nfollowing device safe keeping process\n•\nPlace trans humeral/ elbow disarticulation\nprosthesis in safe and secure environment\nfollowing safe keeping process\n•\nCoordinate the readiness of trans humeral/\nelbow disarticulation prosthesis device\nfollowing institutional procedures\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping\n•\nDemonstrate reading skills\n•\nDemonstrate writing skills\n•\nAbility to handle operating tools/equipment\n6. Perform basic\nrepair and/or\nreplacement\nof the\nprosthetic\ndevices\n(18 hours)\n6.1 Received the\ndevice for repair\nor replacement of\nprosthetic\ncomponents\nLecture and discussion on the following:\n•\nReporting\n•\nReporting process\n•\nVerbal communication\n•\nOffice protocol\n•\nNomenclature of prosthetic and orthotic\ndevices\n•\nCommon problems in prosthesis\n•\nMaterials Science\n•\nProsthetic components\n•\nUse of prosthetic components\nPerform the following tasks:\n•\nReceive prescription in accordance with\nestablished documentation procedures\n•\nInteractive\nLecture\n•\nSmall Group\nDiscussion\n• Written Exam\n• Practical Exam\n4 hours\n\n--- PDF PAGE 134 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 130\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nVerify prescription according to established\ndocumentation procedures\n•\nLog prescription in accordance to\nestablished documentation procedures\n•\nDemonstrate interpersonal skills\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping skills\n•\nDemonstrate reading skills\n•\nFollow manufacturer ‘s specification\n6.2 Perform the\nnecessary repair\nor replacement\nneeded according\nto latest\nprescription\nLecture and discussion on the following:\n•\nTools\n•\nEquipment\n•\nUse of prosthetic components\n•\nUse of tools and equipment\nPerform the following tasks:\n•\nOrder replacement part/s or materials\naccording to prosthetist’s orders\n•\nConfirm order of replacement part/s\n•\nPerform the replacement needed according\nto the specifications and Prosthetist’s\norders\n•\nFollow safety manual\n•\nIdentify and control hazard/risks\n•\nDemonstrate reading skills\n•\nDemonstrate writing skills\n•\nDemonstrate repair skills\n•\nInteractive lecture\n•\nDemonstration\nand return\ndemonstration\n•\nWritten exam\n•\nPractical exam\n6 hours\n\n--- PDF PAGE 135 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 131\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n6.3 Secure the\nprosthetic device\nfor functionality\nand safety\nLecture and discussion on the following:\n•\nReporting\n•\nReporting process\n•\nVerbal communication and division)\n•\nUse of prosthetic components\nPerform the following tasks:\n•\nSecure all bolts and components\n•\nTest for safety and functionality of the\ndevice according to specifications\n•\nSend the repaired device to the Prosthetist\n•\nDemonstrate interpersonal skills\n•\nDemonstrate communication skills\n•\nDemonstrate record-keeping\n•\nDemonstrate reading skills\n•\nDemonstrate safe manual handling skills\n• Interactive Lecture\n• Demonstration and\nReturn\nDemonstration\n• Written Exam\n• Practical Exam\n8 hours\n\n--- PDF PAGE 136 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 132\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nand their variations/components may be adopted singly or in combination with\nother modalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n● Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n● Supervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative\n\n--- PDF PAGE 137 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 133\nthat the deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and\nprogress of trainees are closely monitored by the training institutions to\nprevent opportunity for work exploitation.\n\n● The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprentice\nable occupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\n● Community-based is short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training\nprogram (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program should possess the\nfollowing requirements:\n\n• Must have completed at least 10 years basic education or Holder of\nAlternative Learning Systems (ALS) certificate of completion with grade\n10 equivalent; and\n• Must possess good communication skills\n\n* Note: PWDs are accepted unless safety is compromised\n\n--- PDF PAGE 138 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 134\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 24\ntrainees for Assistive Rehabilitation Technology Services (Prosthetics) NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices and\ntheir availability in the local market.\n\nEQUIPMENT\n\nQTY\nUNIT\nSPECIFICATION/DESCRIPTION\n2\npc\nProjector + White Screen OR Television set for lectures\n2\nset\nMicrophone and speakers\nAppropriate for room area\n3\nunits\nStorage Cabinet (2 Door; For tools, devices and\nmaterials)\n2\npcs\nAlignment Jig\n2\npcs\nAnvil\n1\npcs\nBench grinder\n5\npcs\nBench vise\n1\nunit\nDrill press\n1\nunit\nDust collection system\n1\nunit\nOven (Convection or Infrared only)\n4\npcs\nCold Chisel\n1\npcs\nRiveting bar\n2\nunit\nRouter/ grinding machine/ belt sander\n1\nunit\nSewing machine\n1\npcs\nSoldering Iron with holder\n1\npcs\nVacuum pump\n2\npcs\nOscillating/Cast Saw\n2\npcs\nVacuum station\n5\npcs\nWork benches (size:1m x 0.4m, thickness: 2” counter top\nwith metal frame)\n2\npcs\nSink with plaster trap\n1\nPc\nSand box (size:1m x 0.5m)\n\nTOOLS\n\nQTY\nUNIT\nSPECIFICATION/DESCRIPTION\n5\npcs\n12\" steel Rule\n\n--- PDF PAGE 139 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 135\n5\npcs\n40” steel Rule\n5\npcs\nAdjustable knife\n5\npcs\nGoniometer\n5\