    "training_delivery": {
      "present": true,
      "source_text": "1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nand their variations/components may be adopted singly or in combination with\nother modalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n● Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n● Supervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative\n\n--- PDF PAGE 137 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 133\nthat the deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and\nprogress of trainees are closely monitored by the training institutions to\nprevent opportunity for work exploitation.\n\n● The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprentice\nable occupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\n● Community-based is short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training\nprogram (MTP).",
      "pdf_pages": []
    },
