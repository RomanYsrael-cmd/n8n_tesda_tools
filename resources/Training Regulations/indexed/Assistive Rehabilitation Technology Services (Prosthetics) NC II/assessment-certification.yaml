’s growth\nand development\nPerform caring\nskills for newborn\nParticipate in the\nimplementation\nand monitoring of\ninfant’s care plan\nProvide physical\nneeds, care and\nsupport to infant\nFoster social,\nintellectual and\nemotional\ndevelopment of\ninfant\nParticipate in the\nimplementation\nand monitoring of\ntoddler’s care plan\nDevelop the\nability to\nrecognize\ntoddler’s growth\nand development\nPerform caring skills\nfor toddler\nParticipate in the\nimplementation\nand monitoring of\npre-schooler’s\ncare plan\nDevelop the\nability to\nrecognize pre-\nschooler’s growth\nand development\nPerform caring\nskills for pre-\nschooler\nProvide\nassistance and\ncare to personal\nneeds of grade\nschooler\nFoster\nphysiological\nneeds and\ncognitive\ndevelopment of\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\ngrade schooler\nRespond to\nemergency for\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\nadolescent\nPromote\ndevelopmental\ntasks for\nadolescent\nRespond to\nemergency for\nadolescent\nDevelop the\nability to\nrecognize aging\nprocess\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nPerform caring\nskills\nPerform specialty\ncare procedures\nAssist client in\nadministering\nprescribed\nmedication\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nProvide\nassistance and\nsupport on\nenvironment and\nbiopsychosocial\nneeds of clients\nDevelop the ability\nto recognize\nhealthy body\nsystems and\napply medical\nterminologies\nProvide care and\nsupport to\nactivities of daily\nliving (ADL) of\nclients\nProvide assistance in\nadministering\nprescribed\nmedications to clients\nProvide care and\nsupport to clients\nwith special\nneeds\nRespond to\nemergency\nsituations\nProvide immediate\ncare and support\nto children with\nspecial needs\nProvide\nimmediate care\nand support to\nadults and elderly\nwith special\nneeds\nCarry out\nresponse\nintegration and\ncoordination in a\nmass casualty\nincident\nPerform patient\nassessment\nProvide\nemergency care\nfor suspected\nspine injury\nProvide pre-\nhospital\ninterventions for\ntrauma patients\nProvide pre-\nhospital\ninterventions for\nshock patients\nProvide pre-hospital\ninterventions for\nmedical patients\nPerform basic life\nsupport and use\nairway adjuncts\nProvide pre-\nhospital\ninterventions for\nspecial patient\npopulations\nPerform patient\npackaging\nConduct patient\ntransport\nDeliver basic pre-\nhospital\ncommunication\nskills\nCreate a positive\nmold from a\nnegative cast\nFabricate a\ntranstibial/ankle\ndisarticulation\nprosthesis\nFabricate a\ntransfemoral/knee\ndisarticulation\nprosthesis\nFabricate a\ntransradial/wrist\ndisarticulation\nprosthesis\nFabricate a\ntranshumeral/elbow\ndisarticulation/shoulder\ndisarticulation\nprosthesis\nPerform basic\nrepair and/or\nreplacement of\nthe prosthetic\ndevices\nFabricate a foot\northosis\nFabricate an\nankle-foot orthosis\nFabricate a knee-\nankle-foot\northosis\nFabricate a wrist-\nhand orthosis\nFabricate a\ncustomized\nplastic thoraco-\nlumbo-sacral\northosis\nPerform basic\nrepair and/or\nreplacement of the\northotic devices\nReceive\nwheelchair\nreferral and\nappointment\nAssist the\nwheelchair\nclinician during\nassessment\nCoordinate\nprocurement of the\nappropriate wheelchair\nsize and its parts\nPerform\nwheelchair\nassembly and\nmodifications\nAssist the\nwheelchair\nclinician in\nwheelchair\ncheckout and\nfitting\nAssist wheelchair\nclinician in user\ntraining\nPerform\nmaintenance and\nrepair on\nwheelchair\n\n--- PDF PAGE 148 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 144\nGLOSSARY OF TERMS\n\n1. CAST\n\nA copy of the patient’s limb/amputated limb. Can be negative\ncast or positive cast\n2. KNEE DISARTICULATION\nPROSTHESIS\nA prosthetic device for a through-the-knee amputation\n3. MANDREL\n\nA pipe used to hold the positive mold/cast\n4. NEGATIVE CAST\n\na plaster mold taken directly from the patient’s limb\n5. PLASTER\n\na hard-white substance made by the addition of water to\npowdered and partly dehydrated gypsum, used for making\ncasts\n6. POSITIVE MOLD\n\na solid copy of patient’s limb. It is the product when a plaster\nmixture is poured in a negative cast and cured.\n7. PRESCRIPTION\n\nA customized design of a prosthesis usually given by a\nProsthetist\n8. PROSTHESIS\n\nany device that replaces a part, or all, of an absent body\nsegment. It is also known as a Prosthetic Device.\n\n9. PYLONS\n\nA tube-like prosthetic component used to extend the\nprosthesis to match the correct height\n10. THERMOFORM\n\na manufacturing process where a plastic sheet is heated to a\npliable forming temperature, formed to a specific shape in a\nmold. It is also known as vacuum forming\n11. TRANSFEMORAL\n\nA prosthetic device for an above-the-knee amputation\n12. TRANSHUMERAL/ELBOW\nDISARTICULATION\n\nA prosthetic device for an above-the-elbow amputation\n13. TRANSRADIAL/WRIST\nDISARTICULATION\nPROSTHESIS\nA prosthetic device for a below-the-elbow amputation\n14. TRANSTIBIAL/ANKLE\nDISARTICULATION\nPROSTHESIS\n\nA prosthetic device for a below-the-knee amputation\n\n--- PDF PAGE 149 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 145\n\nREFERENCES\n\nDisability and health [Internet]. World Health Organization. 2017 [cited 29 December\n2017]. http://www.who.int/mediacentre/factsheets/fs352/en/\n\nWHO standards for prosthetics and orthotics Contents: Part 1. Standards; Part 2.\nImplementation manual, 2017\n\nWHO Guidelines for Training Personnel in Developing Countries\n\nPhysicians for Peace Philippines Data, UERMMMCI-CARES\n\nAt a glance: The Philippine health care system https://www.manilatimes.net/at-a-\nglance-the-philippine-health-care-system/395117/\n\n--- PDF PAGE 150 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 146\n\nACK