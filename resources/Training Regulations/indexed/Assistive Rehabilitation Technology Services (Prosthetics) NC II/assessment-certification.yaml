  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of ASSISTIVE REHABILITATION TECHNOLOGY\nSERVICES (PROSTHETICS) NC II, the candidate must demonstrate competence in\nall units listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1\nGraduates of WTR-registered, NTR-registered programs or formal/non-\nformal/informal including enterprise-based trainings related to Assistive\nRehabilitation Technology Services (Prosthetics) NC II; or\n\n4.1.3.2\nExperienced workers (wage employed or self-employed) who gained\ncompetencies in fabrication of prosthetic devices for at least 3 years\nwithin the last 5 years.\n\n2.\nRecognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences with at least\n5 years of experience in fabrication of prosthetic devices (within the last 10\nyears) may apply for recognition in this Qualification through Portfolio Assessment.\nHis/her employer/s must be company/ies duly registered and recognized on\nfabrication of prosthetic devices.\n\nRequirements and implementation procedure of Portfolio Assessment must be\nconsistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines\non the Implementation of Portfolio Assessment Leading to Recognition of Prior\nLearning (RPL) within the TESDA Assessment and Certification System, and with\nTESDA Circular No. 118, series of 2019 on “Addendum to the Implementing\nGuidelines on the Implementation Portfolio Assessment Leading to Recognition of\nPrior Learning (RPL) within the TESDA Assessment and Certification System.”\n\n4.2\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)”.\n\n--- PDF PAGE 144 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 140\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including readiness\nfor assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment.\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification. (to be reflected in the IG)\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification. (to be reflected in the IG)\n\n--- PDF PAGE 145 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 141\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement skills\nSupport Innovation\nAccess and\nmaintain information\nFollow occupational safety\nand health policies and\nprocedures\nApply environmental\nwork standards\nAdopt entrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nSolve/address\ngeneral workplace\nproblems\nDevelop career\nand life decisions\nContribute to\nworkplace innovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health policies\nand procedures\nExercise efficient and\neffective sustainable\npractices in the\nworkplace\nPractice\nentrepreneurial skills\nin the workplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in the\nworkplace\nWork in a diverse\nenvironment\nPropose methods of\napplying learning and\ninnovation in the\norganization\nUse information\nsystematically\nEvaluate occupational\nsafety and health work\npractices\nEvaluate\nenvironmental work\npractices\nFacilitate\nentrepreneurial skills\nfor micro-small-\nmedium enterprises\n(MSMEs)\nUtilize specialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply techniques in\nthe workplace\nContribute to the\npractice of social\njustice in the\nworkplace\nManage innovative\nwork instructions\nManage and\nevaluate us