      "number": "4.1",
      "text": "3.2 Experienced workers (wage employed or self-employed) who gained competencies in fabrication of prosthetic devices for at least 3 years within the last 5 years. 2. Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least 5 years of experience in fabrication of prosthetic devices (within the last 10 years) may apply for recognition in this Qualification through Portfolio Assessment. His/her employer/s must be company/ies duly registered and recognized on fabrication of prosthetic devices. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System, and with TESDA Circular No. 118, series of 2019 on “Addendum to the Implementing Guidelines on the Implementation Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System.”"
