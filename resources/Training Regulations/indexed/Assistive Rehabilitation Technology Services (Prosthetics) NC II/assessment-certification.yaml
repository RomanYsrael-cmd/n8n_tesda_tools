      "text": "CAST A copy of the patient’s limb/amputated limb. Can be negative cast or positive cast"
    },
    {
      "number": "2",
      "text": "KNEE DISARTICULATION A prosthetic device for a through-the-knee amputation"
    },
    {
      "number": "3",
      "text": "MANDREL A pipe used to hold the positive mold/cast"
    },
    {
      "number": "4",
      "text": "NEGATIVE CAST a plaster mold taken directly from the patient’s limb"
    },
    {
      "number": "5",
      "text": "PLASTER a hard-white substance made by the addition of water to powdered and partly dehydrated gypsum, used for making casts"
    },
    {
      "number": "6",
      "text": "POSITIVE MOLD a solid copy of patient’s limb. It is the product when a plaster mixture is poured in a negative cast and cured."
    },
    {
      "number": "7",
      "text": "PRESCRIPTION A customized design of a prosthesis usually given by a Prosthetist"
    },
    {
      "number": "8",
      "text": "PROSTHESIS any device that replaces a part, or all, of an absent body segment. It is also known as a Prosthetic Device."
