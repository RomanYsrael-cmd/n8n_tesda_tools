  "source_text": "1. CAST\n\nA copy of the patient’s limb/amputated limb. Can be negative\ncast or positive cast\n2. KNEE DISARTICULATION\nPROSTHESIS\nA prosthetic device for a through-the-knee amputation\n3. MANDREL\n\nA pipe used to hold the positive mold/cast\n4. NEGATIVE CAST\n\na plaster mold taken directly from the patient’s limb\n5. PLASTER\n\na hard-white substance made by the addition of water to\npowdered and partly dehydrated gypsum, used for making\ncasts\n6. POSITIVE MOLD\n\na solid copy of patient’s limb. It is the product when a plaster\nmixture is poured in a negative cast and cured.\n7. PRESCRIPTION\n\nA customized design of a prosthesis usually given by a\nProsthetist\n8. PROSTHESIS\n\nany device that replaces a part, or all, of an absent body\nsegment. It is also known as a Prosthetic Device.\n\n9. PYLONS\n\nA tube-like prosthetic component used to extend the\nprosthesis to match the correct height\n10. THERMOFORM\n\na manufacturing process where a plastic sheet is heated to a\npliable forming temperature, formed to a specific shape in a\nmold. It is also known as vacuum forming\n11. TRANSFEMORAL\n\nA prosthetic device for an above-the-knee amputation\n12. TRANSHUMERAL/ELBOW\nDISARTICULATION\n\nA prosthetic device for an above-the-elbow amputation\n13. TRANSRADIAL/WRIST\nDISARTICULATION\nPROSTHESIS\nA prosthetic device for a below-the-elbow amputation\n14. TRANSTIBIAL/ANKLE\nDISARTICULATION\nPROSTHESIS\n\nA prosthetic device for a below-the-knee amputation\n\n--- PDF PAGE 149 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 145\n\nREFERENCES\n\nDisability and health [Internet]. World Health Organization. 2017 [cited 29 December\n2017]. http://www.who.int/mediacentre/factsheets/fs352/en/\n\nWHO standards for prosthetics and orthotics Contents: Part 1. Standards; Part 2.\nImplementation manual, 2017\n\nWHO Guidelines for Training Personnel in Developing Countries\n\nPhysicians for Peace Philippines Data, UERMMMCI-CARES\n\nAt a glance: The Philippine health care system https://www.manilatimes.net/at-a-\nglance-the-philippine-health-care-system/395117/\n\n--- PDF PAGE 150 ---\nAssistive Rehabilitation Technology Services (Prosthetics) NC II - HHCARP221 Promulgated (05/2021) 146",
