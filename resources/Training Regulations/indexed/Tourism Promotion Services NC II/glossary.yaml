  "source_text": "1. DESTINATION - a geographical area with basic infrastructure and tourism\nattractions, products and services.\n\n2. DOT – Department of Tourism\n\n3. INFORMATION SYSTEM - a system of persons, data records and activities\nthat process the data and information in a given organization, including manual\nprocesses or automated processes\n\n4. TOURISM PRODUCTS - refer to the product of tourism sector which is a\nnecessity for the tourist during their travel activity. This includes lodging\nestablishments, food and beverage outlets, attractions and activities, arts and\ncrafts/souvenirs, native food and delicacies, sightseeing tours and tour\npackages, outdoor and sports packages\n\n5. TOURISM SERVICES – refer to the services one receives from their tourist\nprovider. This includes to transportation and communication, local guide,\nhealth and wellness/spa, interpreter, child daycare, financial services and\ninstitutions\n\n--- PDF PAGE 85 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 81\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.i\n\nREVIEW PANEL\n\nANABELLE O. MORENO\nTechnical Expert\nTourism Industry Board Foundation, Inc.\nUniversity of the Philippines - Asian\n Institute of Tourism (UP-AIT)\nPast President, Association of Human\n Resources Managers for Hotels and\n Restaurants (AHRM)\nBIENVENIDO G. CLARAVALL\nTechnical Expert\nTIBFI – IWG Member\nUniversity of the Philippines - Asian\n Institute of Tourism (UP-AIT)\nU.P. Diliman, Quezon City\n\nThe Participants in the Validation of these Training Regulations\nCHRISTINA G. AQUINO\n\nCHRISTINE ANN IBARRETA\nTechnical Expert\n\nTechnical Expert\nPlanning and Development\n\nFILXENOS Marketing Consultancy\nLyceum of the Philippines University\n University of the Philippines\n\nIntramuros, Manila/\n\n.\nCouncil of Hotel and Restaurant\n\n Educators of the Philippines (COHREP)\n\nMIGUELA M. MENA\n\nGLORIA BAKEN W. SIY\nTechnical Expert\n\n Technical Expert\nUP-Asian Institute of Tourism (UP-AIT)\n\nAssociation of Administrators in\n\nHotel and Restaurant Management\n\nEducational Institutions (AAHRMEI)\nFE ABLING-YU\nTechnical Expert\nARFEL Travel and Tours/\nPhilippine Travel Agencies\nAssociation (PTAA)\n\n DANIEL L. EDRALIN\n Technical Expert\n Tourism Industry Board Foundation, Inc.\n (TIBFI)\n National Union of Workers in Hotels and\n Restaurant and Allied Industries\n (NUWHRAIN-APL)\n\nThe TESDA Board Members and Secretariat\n\n The MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQualifications and Standards Office (QSO)\n\n--- PDF PAGE 86 ---",
