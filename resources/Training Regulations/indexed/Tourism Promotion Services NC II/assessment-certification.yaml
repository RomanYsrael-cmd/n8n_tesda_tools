  "source_text": "SECTION 4\nASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated\ncompetence\nthrough\nproject-type\nfull\nqualification\nassessment sequentially covering all the units of competency that\ncomprise the Training Regulations for Tourism Promotion Services NC II\nas follows:\n\nBASIC COMPETENCIES\nParticipate in workplace communication\nWork in team environment\nPractice career professionalism\nPractice occupational health and safety procedures\nCOMMON COMPETENCIES\nDevelop and update industry knowledge\nObserve computer operations\nPerform workplace and safety practices\nProvide effective customer service\nCORE COMPETENCIES\nOperate technology-based information system\nProvide information and advice on a destination,\nproduct or service\nPromote tourism products and services\n4.1.2 Candidates wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s\nof competency.\n4.1.3 Candidates applying for competency assessment and certification for\nTourism Promotion Services NC II:\n4.1.3.1 Graduates of formal, non-formal and informal institutions including\nenterprise-based training programs\n4.1.3.2 Experienced workers (wage-employed or self-employed)\n\n--- PDF PAGE 82 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 78\n4.1.4 Conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the\npurpose.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for\nassessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 83 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015\n\n 79\nOperate\ntechnology-\nbased\ninformation\nProvide\ncustomers with\ninformation on\nanimals\nProvide\ngeneral\nanimal\ncare\nCOMPETENCY MAP - TOURISM Sector\nTOURISM PROMOTION SERVICES NC II\nANNEX A\nCollect,\nanalyze and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nUtilize\nspecialized\ncommunication\nskills\nDevelop teams\nand individuals\nApply problem-\nsolving\ntechniques in\nthe workplace\nUse\nmathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nLead small\nteams\nDevelop and\npractice\nnegotiation\nskills\nSolve\nproblems\nrelated to work\nactivities\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and safety\npractices\nLead\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nRoster staff\nControl and\norder stock\nPerform\ncomputer\noperations\nPerform\nworkplace and\nsafety practices\nProvide\neffective\ncustomer\nservice\nDevelop and\nupdate\nindustry\nknowledge\nObserve\nworkplace\nhygiene\nprocedures\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nEstablish and\nconduct\nbusiness\nrelationships\nTrain small\ngroups\nConduct\nassessment\nManage\nworkplace\ndiversity\nManage\nfinances within\na budget\nManage\nquality\ncustomer\nservice\n\nDevelop an\nevent concept\nDevelop event\nprogram\nSelect event\nvenue and site\nProvide porter\nservices\nPlan and develop\nevent proposal\nand bid\nConduct night\naudit\nProvide club\nreception\nservices\nManage\ncontractors for\nindoor events\n\nDevelop and\nupdate\nknowledge on\nprotocol\nProvide on-site\nevent\nmanagement\nservices\nDevelop and\nupdate event\nindustry\nknowledge\n\nAccompany and\nguide visitors in\naccordance with\nthe tour itinerary\nReceive and\nprocess\nreservations\nOperate\ncomputerized\nreservations\nsystem\nIssue air sea\nland tickets and\nmulti-purpose\ndocuments\nResearch\ninformation\nrelevant to tour\nitinerary\nBook travel-\nrelated\nreservation\nAdminister\nbilling and\nsettlement\nplan\nProvide\naccommodation\nreception\nservices\nManage\narrangements for\nvisitors\n\nProvide a site\nbriefing or\nscripted\ncommentary\nOperate a ride\nlocation\nLoad and\nunload a ride\nProvide on-site\ninformation and\nassistance\nMonitor entry to\nvenue\nOperate a\ngames location\nMaintain safety\nin water-based\nrides\nOperate animal\nenclosure/\nexhibit\nPromote at a\ngames location\nRescue\nanimals\nPromote\ntourism\nproducts and\nservices\nProvide\nInformation and advice\non a destination,\nproduct or service\n\n--- PDF PAGE 84 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 80\nDEFINITION OF TERMS\n\n1. DESTINATION - a geographical area with basic infrastructure and tourism\nattractions, products and services.\n\n2. DOT – Department of Tourism\n\n3. INFORMATION SYSTEM - a system of persons, data records and activities\nthat process the data and information in a given organization, including manual\nprocesses or automated processes\n\n4. TOURISM PRODUCTS - refer to the product of tourism sector which is a\nnecessity for the tourist during their travel activity. This includes lodging\nestablishments, food and beverage outlets, attractions and activities, arts and\ncrafts/souvenirs, native food and delicacies, sightseeing tours and tour\npackages, outdoor and sports packages\n\n5. TOURISM SERVICES – refer to the services one receives from their tourist\nprovider. This includes to transportation and communication, local guide,\nhealth and wellness/spa, interpreter, child daycare, financial services and\ninstitutions\n\n--- PDF PAGE 85 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 81\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.i\n\nREVIEW PANEL\n\nANABELLE O. MORENO\nTechnical Expert\nTourism Industry Board Foundation, Inc.\nUniversity of the Philippines - Asian\n Institute of Tourism (UP-AIT)\nPast President, Association of Human\n Resources Managers for Hotels and\n Restaurants (AHRM)\nBIENVENIDO G. CLARAVALL\nTechnical Expert\nTIBFI – IWG Member\nUniversity of the Philippines - Asian\n