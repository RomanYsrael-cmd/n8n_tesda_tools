      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence through project-type full qualification assessment sequentially covering all the units of competency that comprise the Training Regulations for Tourism Promotion Services NC II as follows: BASIC COMPETENCIES Participate in workplace communication Work in team environment Practice career professionalism Practice occupational health and safety procedures COMMON COMPETENCIES Develop and update industry knowledge Observe computer operations Perform workplace and safety practices Provide effective customer service CORE COMPETENCIES Operate technology-based information system Provide information and advice on a destination, product or service Promote tourism products and services 4.1.2 Candidates wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.3 Candidates applying for competency assessment and certification for Tourism Promotion Services NC II: 4.1.3.1 Graduates of formal, non-formal and informal institutions including enterprise-based training programs 4.1.3.2 Experienced workers (wage-employed or self-employed) 4.1.4 Conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose."
    },
    {
