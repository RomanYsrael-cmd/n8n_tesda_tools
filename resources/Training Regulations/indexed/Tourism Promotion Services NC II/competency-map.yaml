  "source_text": "SECTION 1 TOURISM PROMOTION SERVICES NC II QUALIFICATION\n\nThe TOURISM PROMOTION SERVICES NC II Qualification consists of\ncompetencies that a person must achieve to advocate and sell tourism destination,\nproducts and services through technology-based information gathering and application\nof sales and promotions principles and techniques.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\nas shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n500311105\nParticipate in workplace communication\n500311106\nWork in team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nCODE NO.\nCOMMON COMPETENCIES\n\nTRS311201\nDevelop and update industry knowledge\nTRS311202\nObserve workplace hygiene procedures\nTRS311203\nPerform computer operations\nTRS311204\nPerform workplace and safety practices\nTRS311205\nProvide effective customer service\n\nCODE NO.\nCORE COMPETENCIES\n\nTRS5113123\nOperate technology-based information system\nTRS5113124\nProvide information and advice on a destination, product or service\nTRS5113125\nPromote tourism products and services\n\nA person who has achieved this Qualification is competent to be a:\n\n❑ Tourist Information Officer (LGU)\n❑ Tourism Desk Officer (LGU)\n❑ Travel Adviser/Consultant (Tourism Enterprise)\n❑ Concierge Agent (Tourism Enterprise)\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 2"
