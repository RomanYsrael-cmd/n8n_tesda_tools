        "source_text": "--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         15 \n \nUNIT OF COMPETENCY :         PRACTICE OCCUPATIONAL HEALTH AND \nSAFETY   PROCEDURES  \n \nUNIT CODE                      :            500311108 \n \nUNIT DESCRIPTOR         :       \nThis unit covers the outcomes required to comply with \nregulatory \nand \norganizational \nrequirements \nfor \noccupational health and safety.  \n \n \n \n \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Identify hazards \nand risks \n1.1 Safety regulations \nand workplace safety \nand hazard control \npractices and \nprocedures are \nclarified and \nexplained based on \norganization \nprocedures \n1.2 Hazards/risks in the \nworkplace and their \ncorresponding \nindicators are \nidentified to minimize \nor eliminate risk to \nco-workers, \nworkplace and \nenvironment in \naccordance with \norganization \nprocedures \n1.3 Contingency \nmeasures during \nworkplace accidents, \nfire and other \nemergencies are \nrecognized and \nestablished in \naccordance with \norganization \nprocedures \n1.1  OHS procedures \nand practices and \nregulations \n1.2  Hazards/risks \nidentification and \ncontrol \n1.3  OHS indicators \n1.4  Organizational \ncontingency \npractices \n1.1  Hazards/risks \nidentification and \ncontrol skills\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         16 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Evaluate \nhazards and \nrisks \n2.1 Terms of maximum \ntolerable limits which  \nwhen exceeded will \nresult in harm or \ndamage are identified \nbased on threshold \nlimit values (TLV) \n2.2 Effects of the hazards \nare determined \n2.3 OHS issues and/or \nconcerns and \nidentified  safety \nhazards are reported \nto designated \npersonnel in \naccordance with \nworkplace \nrequirements and \nrelevant workplace \nOHS legislation \n2.1  Threshold Limit \nValue -TLV \n2.2  Effects of safety \nhazards \n2.1  Communication \nskills \n2.2  Reporting safety \nhazards \n3. Control hazards \nand risks  \n3.1 Occupational Health \nand Safety (OHS) \nprocedures for \ncontrolling \nhazards/risks in \nworkplace are \nconsistently followed \n3.2 Procedures for \ndealing with \nworkplace accidents, \nfire and emergencies \nare followed in \naccordance with \norganization OHS \npolicies \n3.3 Personal protective \nequipment (PPE) is \ncorrectly used in \naccordance with \norganization OHS \nprocedures and \npractices  \n3.1  Personal hygiene \npractices \n3.2  Organization safety \nand health protocol \n3.3  Company \nemergency \nprocedure practices \n3.1  Practicing personal \nhygiene  \n3.2  Responding to \nemergency\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         17 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n3.4 Appropriate \nassistance is \nprovided in the event \nof a workplace \nemergency in \naccordance with \nestablished \norganization protocol \n \n \n \n4. Maintain OHS \nawareness \n4.1   Emergency-\nrelated drills and \ntrainings are \nparticipated in as \nper established \norganization \nguidelines and \nprocedures \n4.2   OHS personal \nrecords are \ncompleted and \nupdated in \naccordance with \nworkplace \nrequirements  \n \n4.1  Workplace OHS \npersonal records \n4.2  Information on \nemergency-related \ndrills \n4.1  Practicing \nemergency-related \ndrill skills in the \nworkplace\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         18 \n \n    RANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Safety regulations \nMay include: \n1.1 Clean Air Act \n1.2 Building code \n1.3 National Electrical and Fire Safety Codes \n1.4 Waste management statutes and rules \n1.5 Philippine Occupational Safety and Health \nStandards \n1.6 DOLE regulations on safety legal requirements \n1.7 ECC regulations \n \n \n2. Hazards/Risks \nMay include: \n2.1 Physical hazards – impact, illumination, pressure,   \n      noise, vibration, temperature, radiation  \n2.2 Biological hazards- bacteria, viruses, plants,   \n      parasites, mites, molds, fungi, insects \n2.3 Chemical hazards – dusts, fibers, mists, fumes,     \n      smoke, gasses, vapors \n2.4 Ergonomics \n2.4.1 Psychological factors – over exertion/  \n         excessive force, awkward/static  \n         positions, fatigue, direct pressure,  \n         varying metabolic cycles \n2.4.2 Physiological factors – monotony,  \n         personal relationship, work out cycle \n \n \n \n3. Contingency \nmeasures \nMay include: \n3.1 Evacuation \n3.2 Isolation \n3.3 Decontamination \n3.4 (Calling designed) emergency personnel\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         19 \n \nVARIABLES \nRANGE \n4. PPE \nMay include: \n4.1 Mask \n4.2 Gloves \n4.3 Goggles \n4.4 Hair Net/cap/bonnet \n4.5 Face mask/shield \n4.6 Ear muffs \n4.7 Apron/Gown/coverall/jump suit \n4.8 Anti-static suits \n \n \n5. Emergency-related \ndrills and training \nMay include: \n5.1 Fire drill \n5.2 Earthquake drill  \n5.3 Basic life support/CPR \n5.4 First aid \n5.5 Spillage control  \n5.6 Decontamination of chemical and toxic \n5.7 Disaster preparedness/management \n \n \n6. OHS personal records \nMay include: \n6.1  Medical/Health records \n6.2  Incident reports \n6.3  Accident reports \n6.4  OHS-related training completed\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         20 \n \n           EVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Explained clearly established workplace safety and \nhazard control practices and procedures \n1.2 Identified hazards/risks in the workplace and its \ncorresponding indicators in accordance with  company  \nprocedures \n1.3 Recognized contingency measures during workplace \naccidents, fire and other emergencies \n1.4 Identified terms of maximum tolerable limits based on \nthreshold limit value- TLV. \n1.5 Followed Occupational Health and Safety (OHS) \nprocedures for controlling hazards/risks in workplace \n1.6 Used Personal Protective Equipment (PPE) in \naccordance with company OHS procedures and \npractices  \n1.7 Completed and updated OHS personal records in \naccordance with workplace requirements   \n2.  Resource   \nimplications \nThe following resources should be provided: \n2.1  Workplace or assessment location \n2.2  OHS personal records \n2.3   PPE \n2.4   Health records \n3.   Methods of  \nassessment \nCompetency in this unit may be assessed through: \n3.1   Portfolio Assessment  \n3.2   Interview \n3.3   Case Study/Situation \n4.  Context for \nassessment \n4.1   Competency assessment may occur in workplace or \nany appropriately simulated environment. \n4.2   Assessment shall be observed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
