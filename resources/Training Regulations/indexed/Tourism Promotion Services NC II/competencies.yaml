        "source_title": "PARTICIPATE IN WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         2 \n \nSECTION 2   COMPETENCY STANDARDS \n \n \nThis section details the contents of the basic, common and core units of competency \nrequired in TOURISM PROMOTION SERVICES NC II. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY:    PARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n     :    500311105 \nUNIT DESCRIPTOR      : This unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1  Specific and  relevant \ninformation is \naccessed from \nappropriate sources  \n1.2  Effective questioning,  \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3  Appropriate medium \nis used to transfer \ninformation and ideas \n1.4  Appropriate non- \nverbal communication \nis used \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and \nfollowed \n1.6  Defined workplace \nprocedures for the \nlocation and storage \nof information are \nused \n1.7  Personal interaction \nis carried out clearly \nand concisely \n1.1  Effective \ncommunication \n1.2  Different modes of \ncommunication  \n1.3  Written \ncommunication \n1.4  Organizational \npolicies \n1.5  Sources of \ninformation \n1.6  Types of question \n1.7  Medium of \ncommunication \n1.8  Flow of \ncommunication \n1.9  Storage system \n1.10 Telephone \ncourtesy \n \n \n1.1  Following simple \nspoken language \n1.2  Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3  Ability to relate to \npeople of social \nrange in the \nworkplace \n1.4  Gathering and \nproviding information \nin response to \nworkplace \nrequirements \n1.5  Listening skills \n1.6  Questioning skills \n1.7  Workplace language \nskills\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         3 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.   Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2  Own opinions are \nclearly expressed and \nthose of others are \nlistened to without \ninterruption \n2.3  Meeting inputs are \nconsistent with the \nmeeting purpose and \nestablished \nprotocols \n2.4  Workplace \ninteractions are \nconducted in a \ncourteous manner  \n2.5  Questions about \nsimple routine \nworkplace \nprocedures and \nmatters concerning \nworking conditions of \nemployment are \nasked and responded \nto \n2.6  Meetings outcomes \nare interpreted and \nimplemented \n2.1  Communication \nprocedures and \nsystems \n2.2  Meeting protocols \n2.3  Nature  of \nworkplace meetings \n2.4  Barriers of \ncommunication \n2.5  Workplace \ninteractions \n2.6  Non-verbal \ncommunication \n2.1  Ability to relate to \npeople of social \nrange in the \nworkplace \n2.2  Interpersonal \ncommunication skill \n2.3  Observing meeting \nprotocols\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         4 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.   Complete \nrelevant work \nrelated \ndocuments \n3.1  Range of forms \nrelating to conditions \nof employment are \ncompleted accurately \nand legibly \n3.2  Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3  Basic mathematical \nprocesses are used \nfor routine \ncalculations \n3.4  Errors in recording \ninformation on forms/ \ndocuments are \nidentified and \nproperly acted upon \n3.5  Reporting \nrequirements to \nsupervisor are \ncompleted according \nto organizational \nguidelines \n3.1 Technology relevant \nto the enterprise \nand the individual’s \nwork \nresponsibilities  \n3.2  Types of workplace  \ndocuments and \nforms \n3.3  Basic mathematical \nconcepts \n3.4  Kinds of workplace \nreport \n \n3.1  Applying basic \nmathematical \nprocesses of \naddition, subtraction, \ndivision and \nmultiplication \n3.2  Data recording \n3.3  Report writing\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         5 \n   RANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Appropriate sources \nMay include: \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \nMay include: \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6. \nFace to face communication \n3. Storage \nMay include: \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Forms \nMay include: \n4.1. \nPersonnel forms, telephone message forms, \nsafety reports \n5. Workplace \ninteractions \nMay include: \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, \ninstruction and forms, non-verbal including \ngestures, signals, signs and diagrams \n6. Protocols \nMay include: \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         6 \n EVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard \nformat  of the organization \n1.2. Accessed information using communication equipment \n1.3. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4. Conveyed information effectively adopting the formal \nor informal communication \n2. Resource \nimplications \nThe following resources should be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Writing materials \n2.4. Internet \n3. Methods of \nassessment \nCompetency in this unit may be assessed through: \n3.1. Direct observation \n3.2. Oral interview and written test \n4. Context for \nAssessment \n4.1 Competency assessment may occur in workplace or any     \n      appropriately simulated environment. \n4.2 Assessment shall be observed on multiple occasions   \n      involving a combination of direct, indirect and      \n      supplementary forms of evidence.\n",
