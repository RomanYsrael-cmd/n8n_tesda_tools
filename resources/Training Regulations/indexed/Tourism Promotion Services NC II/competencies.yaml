        "source_title": "OPERATE TECHNOLOGY-BASED INFORMATION SYSTEM",
        "source_text": "--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         43 \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY     : \nOPERATE TECHNOLOGY-BASED INFORMATION \nSYSTEM \n \nUNIT CODE \n \n        :     TRS5113123 \n  \nUNIT DESCRIPTOR       :    This unit deals with the knowledge, skills, behavior and \nmotivations required to access and interpret information \nby using computer-based systems and internet resources \nto acquire and interpret  tourism-related information on a \ndestination, product or service. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Access \ninformation on \nan automated \nsystem \n1.1  Sources of \ninformation and \nInformation \nrequirements are \nidentified as to \nrelevance and \naccessibility \n1.2  Identified \ninformation \nsources are \naccessed with the \nautomated system \nin an efficient manner \n1.3  Appropriate search \nmethods are selected \nfor the type of \ninformation required \n1.4  Key words and \nphrases are used to \nsearch for required \ninformation \n1.5  Other sources of \ninformation – \nelectronic or \notherwise - selected \nin accordance with \nenterprise policy, \ncommercial \nagreements and  \n1.1 Role of automated \ninformation \nsystems in the \ntourism industry \n1.2 Functions of the \ninformation system \n1.3 Sources of tourism \nproduct information \n1.4 Major automated \nsystems of \ninformation \ngathering  \n1.5 Industry \nterminology and \ncommon \nabbreviations \n1.1  Basic keyboarding  \nskills \n1.2  Querying and \ninformation-retrieval  \nskills \n1.3  Electronic file \nhandling (saving, \ncopying, printing) \n1.4  Establishing source \nof information and \naccessing the \nrequired information\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         44 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \nother specific need \nthat meet sales and \noperational needs \n1.6  Features of the \nsystem are used \nand manipulated to \naccess the full range \nof system \ninformation \n \n \n2.  Check and \ndownload \ninformation \n2.1  Information is \naccessed to meet \nthe required scope \nand purpose \n2.2  Further search is \nconducted if \ninformation is \ninsufficient \n2.3  Information is   \nselected based on \nclient/situation   \nrequirements \n2.4  Order is placed for \nany information that \nrequires purchase \n2.5  Information is \ndownloaded/printed \nin accordance with \nsystem procedures \nand company \nrequirements \n \n2.1. Functions and \nrole of automated \ninformation \nsystem \n2.2. Other sources of    \ntourism product \ninformation \n2.1 Basic keyboarding \nskills \n2.2 Querying and \ninformation-retrieval \nskills \n2.3 Establishing the correct \nsource of information \nand accessing the \nrequired information \n3.  Interpret \ndownloaded \ninformation \n3.1  Downloaded \ninformation is \ninterpreted and \nclassified to meet \nany particular need \n3.2  Specific information \nis correctly \ninterpreted and \nselected to meet \nspecific operational \nneeds \n \n3.1  Tourism \nterminology and \nabbreviations \n3.2  Use of the 24-\nhour clock \n3.3  Product systems \nand procedures \n3.4  Understanding    \ncopy rights and \nintellectual \nproperty of on- \nline information  \n3.5  Specific legal \nissues relating to \ndifferent products  \n3.1  Collecting, \norganizing and \nanalyzing \ninformation to \ndetermine what \nproduct information \nis needed\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         45 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n3.3  Specific technical \nterms or jargon are \ncorrectly interpreted \nto facilitate delivery \nof accurate \ninformation \n \n \n4.  Organize \ninformation  \n4.1  Information is \nclassified in a \nsuitable format for \nuse \n4.2  Information is \nstored/ filed in \naccordance with \ncompany policies \n4.1  Categories of \nproducts and \nservices \n4.2. Electronic and \nmanual filing \nsystems \n \n4.1  Electronic file \nhandling (saving, \ncopying, printing)\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         46 \nRANGE OF VARIABLES \n \n \nVARIABLES \n \n \nRANGE \n \n1.  Information \nrequirements \nMay include: \n1.1  Destination/s \n1.1.1 General destination location, description, \naccessibility and essential information \n1.1.2 Main existing attractions and activities \n1.1.3 Special destination features and attributes \n1.2  Product/s \n1.2.1 General product description and information \n1.2.2 Product prices and inclusions \n1.2.3 Special product features \n1.2.4 Booking and payment procedures \n1.3  Services \n1.3.1 General Transportation Information \n      1.3.1.1 Fares and schedules \n      1.3.1.2 Types of service and equipment \n1.4  Miscellaneous Services \n      1.4.1 Guides services and fees \n      1.4.2 Outfitters services and fees \n      1.4.3 Other services and fees \n \n2.  Information sources \nidentified \nMay include: \n2.1  Principal or supplier of the product \n2.2  Product library of the company and company-designed \ninformation systems (e.g. inventory control base)  \n2.3  Internet \n2.4  Local government tourism authority information \nsystems \n2.5  National government tourism authority information \nsystems \n2.6  Brochures \n2.7  Timetables \n2.8  Sales kits \n2.9  Supplier information kits \n2.10 Product manuals \n2.11 Advertising fliers \n2.12 Manufacturer’s specifications\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         47 \n \n \n \nVARIABLES \n \n \nRANGE \n \n3.  Automated system \nMay include: \n3.1 Internet \n3.2 Enterprise-designed systems \n3.3 Local government tourism authority information \nsystems \n3.4 National government tourism authority information \nsystems \n3.5 Global distribution systems \n4.  Features of the \nsystem \nMay include: \n4.1 Different search engines \n4.2 Database research functions \n5.  Information is \nclassified \nMay include: \n5.1  Destination/s \n5.2  Product/s \n5.3  Service/s \n5.4  Others\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         48 \nEVIDENCE GUIDE \n \n1.  Critical aspects of   \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated the ability to use an industry-current \nautomated information system to source multiple types of \ninformation for differing customer needs \n1.2 Demonstrated ability to utilize computers, printers and \ninformation systems currently used within the industry to \nstore tourism-related information such as the internet \n1.3  Demonstrated ability to access and interpret information on \ndifferent categories of tourism products within company \nacceptable timeframes \n1.4 Demonstrated knowledge of product terminology and \nprocedures according to the industry sector and workplace \n1.5   Completed activities to access and retrieve a range of \ninformation within typical workplace time constraints. \n2.  Resource  \nimplications \nThe following resources should be provided: \n2.1  Fully-equipped industry-realistic office environment using \nappropriate computers, printers, information programs and \npublications \n2.2  Access to industry-current automated information system to \nsource multiple types of information for differing customer \nneeds \n3. Methods of   \nassessment \nCompetency in this unit may be assessed through: \n3.1  Demonstration with questioning of the candidate using the \nsystem in response to specific requests. \n3.2  Evaluation of candidate’s output such as information \nsamples sourced by the candidate to meet particular \ncustomer needs. \n3.3  Third -party workplace reports of on-the-job performance by \nthe candidate. \n3.4  Written Examination \n4. Context for \nassessment \n4.1  Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2  Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
