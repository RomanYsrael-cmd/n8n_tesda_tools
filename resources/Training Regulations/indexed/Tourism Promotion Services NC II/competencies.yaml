        "source_title": "WORK IN TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         7 \n \nUNIT OF COMPETENCY:    WORK IN TEAM ENVIRONMENT \n \nUNIT CODE \n    :     500311106 \n \nUNIT DESCRIPTOR     : \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. \nDescribe team \nrole and scope \n1.1 The role and \nobjective of the \nteam is identified \nfrom available \nsources of \ninformation \n1.2 Team parameters, \nreporting \nrelationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources  \n1.1  Team roles \n1.2  Definition of Team  \n1.3  Difference between \nteam and group \n1.4  Different sources of \ninformation \n1.5  Objectives and \ngoals of team  \n1.1  Describing the team \nrole and scope \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1  Individual role and \nresponsibilities within \nthe team environment \nare identified \n2.2  Roles and \nresponsibility of other \nteam members are \nidentified and \nrecognized \n2.3  Reporting \nrelationships within \nteam and external to \nteam are identified \n2.1  Team structure \n2.2  Roles and \nresponsibility of \nteam members \n2.3  Teams in work \nenvironment \n2.4  Fundamental rights \nat work including \ngender sensitivity \n2.1  Communicating \nappropriately, \nconsistent with the \nculture of the \nworkplace \n2.2  Identifying individual \nrole and \nresponsibility \n2.3  Identifying external \nrelationship \n3. Work as a team \nmember  \n3.1  Effective and \nappropriate forms of \ncommunications used \nand interactions \nundertaken with team \nmembers who \ncontribute to known \nteam activities and \nobjectives \n \n3.1  Communication \nprocess \n3.2  Group planning and \ndecision making \n3.3  Team goals and \nobjectives \n3.4  Understanding \nindividual \ncompetencies \nrelative to \nteamwork \n3.5  Types of individuals \n3.6  Role of leaders  \n3.1  Interacting \neffectively with \nothers \n3.2  Setting team goals \nand expectations\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         8 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n3.2  Effective and \nappropriate \ncontributions made to \ncomplement team \nactivities and \nobjectives, based on \nindividual skills and \ncompetencies and \nworkplace context \n3.3  Observed protocols in \nreporting using \nstandard operating \nprocedures \n3.4  Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of  \nteam’s role and \nobjectives and \nindividual \ncompetencies of the \nmembers\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         9 \n \n   RANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Role and objective \nof team  \nMay include: \n1.1. \nWork  activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a \nteam environment \n \n2. Sources of \ninformation \nMay include: \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s specifications \nand instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \nMay include: \n3.1. \nWork procedures and practices \n3.2. \nConditions of  work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         10 \n \n  EVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1     Operated in a team to complete workplace activity \n1.2     Worked effectively with others \n1.3     Conveyed information in written or oral form \n1.4     Selected and used appropriate workplace language \n1.5     Followed designated work plan for the job \n1.6     Reported outcomes  \n2.  Resource      \n     implications \nThe following resources should be provided: \n2.1 Access to relevant workplace or appropriately simulated  \nenvironment where assessment can take place  \n2.2  Materials relevant to the proposed activity or tasks \n3.  Methods of           \n assessment \nCompetency in this unit may be assessed through: \n3.1 Observation   of the individual member in relation to the  \nwork activities of the group \n3.2 Observation of simulation and or role play involving the  \nparticipation of individual member to the attainment of \norganizational goal \n3.3  Case studies and scenarios as a basis for discussion of \nissues and strategies in teamwork \n4.   Context for \nAssessment \n4.1    Competency assessment may occur in workplace or \nany appropriately simulated environment. \n4.2    Assessment shall be observed on multiple occasions       \n         involving a combination of direct, indirect and    \n         supplementary forms of evidence.\n",
