          "source_text": "VARIABLES \n \n \nRANGE \n \n1.  Information \nrequirements \nMay include: \n1.1  Destination/s \n1.1.1 General destination location, description, \naccessibility and essential information \n1.1.2 Main existing attractions and activities \n1.1.3 Special destination features and attributes \n1.2  Product/s \n1.2.1 General product description and information \n1.2.2 Product prices and inclusions \n1.2.3 Special product features \n1.2.4 Booking and payment procedures \n1.3  Services \n1.3.1 General Transportation Information \n      1.3.1.1 Fares and schedules \n      1.3.1.2 Types of service and equipment \n1.4  Miscellaneous Services \n      1.4.1 Guides services and fees \n      1.4.2 Outfitters services and fees \n      1.4.3 Other services and fees \n \n2.  Information sources \nidentified \nMay include: \n2.1  Principal or supplier of the product \n2.2  Product library of the company and company-designed \ninformation systems (e.g. inventory control base)  \n2.3  Internet \n2.4  Local government tourism authority information \nsystems \n2.5  National government tourism authority information \nsystems \n2.6  Brochures \n2.7  Timetables \n2.8  Sales kits \n2.9  Supplier information kits \n2.10 Product manuals \n2.11 Advertising fliers \n2.12 Manufacturer’s specifications\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         47 \n \n \n \nVARIABLES \n \n \nRANGE \n \n3.  Automated system \nMay include: \n3.1 Internet \n3.2 Enterprise-designed systems \n3.3 Local government tourism authority information \nsystems \n3.4 National government tourism authority information \nsystems \n3.5 Global distribution systems \n4.  Features of the \nsystem \nMay include: \n4.1 Different search engines \n4.2 Database research functions \n5.  Information is \nclassified \nMay include: \n5.1  Destination/s \n5.2  Product/s \n5.3  Service/s \n5.4  Others\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         48"
        },
        "evidence_guide": {
          "source_text": "1.  Critical aspects of   \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated the ability to use an industry-current \nautomated information system to source multiple types of \ninformation for differing customer needs \n1.2 Demonstrated ability to utilize computers, printers and \ninformation systems currently used within the industry to \nstore tourism-related information such as the internet \n1.3  Demonstrated ability to access and interpret information on \ndifferent categories of tourism products within company \nacceptable timeframes \n1.4 Demonstrated knowledge of product terminology and \nprocedures according to the industry sector and workplace \n1.5   Completed activities to access and retrieve a range of \ninformation within typical workplace time constraints. \n2.  Resource  \nimplications \nThe following resources should be provided: \n2.1  Fully-equipped industry-realistic office environment using \nappropriate computers, printers, information programs and \npublications \n2.2  Access to industry-current automated information system to \nsource multiple types of information for differing customer \nneeds \n3. Methods of   \nassessment \nCompetency in this unit may be assessed through: \n3.1  Demonstration with questioning of the candidate using the \nsystem in response to specific requests. \n3.2  Evaluation of candidate’s output such as information \nsamples sourced by the candidate to meet particular \ncustomer needs. \n3.3  Third -party workplace reports of on-the-job performance by \nthe candidate. \n3.4  Written Examination \n4. Context for \nassessment \n4.1  Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2  Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.",
