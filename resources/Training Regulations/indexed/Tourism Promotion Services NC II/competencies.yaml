        "source_title": "PROVIDE INFORMATION AND ADVICE ON A DESTINATION, PRODUCT OR SERVICE",
        "source_text": "--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         49 \nUNIT OF COMPETENCY:    PROVIDE INFORMATION   AND ADVICE ON A \nDESTINATION, PRODUCT OR SERVICE \n \nUNIT CODE  \n        :   TRS5113124 \n \nUNIT DESCRIPTOR       :   This unit deals with the knowledge, skills, behavior and \nmotivations required to provide information and advice to \nfulfill a range of sales and operational activities such as \npromoting a destination, products and services.  \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Develop \ninformation on \na destination, \nproduct or \nservice  \n1.1  Information \nsources are \nidentified and \naccessed for current \nand accurate \ninformation on a \ndestination, product \nor service \n1.2  Information is \nobtained on \nfeatures of the \ndestination and the \ngeneral type of \ntourism products \nand services  \navailable \n1.3  Information is \nidentified and \nobtained on the \ndifferent tourism \nproducts and \nservices available \nwhich can meet \ncustomer needs. \n1.4  Information is \nrecorded and stored \nfor future use in \naccordance with \nenterprise \nprocedures. \n1.1  Sources of \ninformation on \ndestinations \n1.2  Industry \ninformation \nnetworks \n1.3  Methods of \nsourcing \ninformation \nsought by  \ncustomers  \n1.4  Destination \nknowledge as \nappropriate to the \nsector or specific \nworkplace \n1.1  Fundamental research \nskills\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         50 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.  Update \ninformation on \na destination, \nproduct or \nservice  \n2.1  Informal and formal \nresearch are used \nto update destination \nand general product \nand services \nknowledge \n2.2  Feedback is sought \non experience with \ndestinations from \nboth colleagues and \ncustomers and this \nis provided to other \norganizations where \nappropriate.  \n2.3  Updated information \nis shared with \ncolleagues in \naccordance with \nenterprise \nprocedures. \n2.1 Sources of \ninformation on \ndestinations and \nservices \n2.2 Industry  \ninformation \nnetworks \n2.3  Methods of \nupdating \ninformation on  \ntourism products \nand services  \n  \n3.1 Analyzing information to \ndetermine up-datedness  \n3.2 Identifying a correct \nsource of information \n3.3 Accessing this source to \nestablish its applicability   \n3.4 Collecting the up-dated \nand applicable \ninformation   \n3.5  Organizing the \ninformation collected  \n3.6 Preparing the \ninformation in a manner \nthat facilitate its retrieval \nas and when needed  \n \n3.   Provide \ninformation \nand advice on \na destination, \nproduct or \nservices \navailable at \nthe \ndestination  \n3.1  Specific information \nand advice needs of \nthe customer are \naccurately identified \n3.2  Range of current \nand accurate \ndestination and \ngeneral product \ninformation and \nadvice is provided in \na timely manner and \nin accordance with \ncompany procedures \n3.3  Customer needs are \naddressed by \nensuring appropriate \nscope and depth of \ninformation \n3.4  Information and \nadvice are presented \nin an appropriate \nformat and style \n3.1  Destination  \nknowledge as \nappropriate to the \nsector or specific \nworkplace  \n3.2. Customer-focus \ninformation and \ndata \n \n3.1 Communication skills to \nbe able to explain \nindustry jargon to a \ncustomer \n3.2 Communication skills for \ndealing with customers \nand colleagues\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         51 \nRANGE OF VARIABLES   \n   \n \nVARIABLES \n \n \nRANGE \n \n1. Information sources \nMay include: \n1.1  Destination and product library of the \ncompany \n1.2  Internet \n1.3  Local government tourism authority \ninformation systems \n1.4  National government tourism authority \ninformation systems \n1.5  Brochures \n1.6  Sales kits \n1.7  Supplier information kits \n1.8  Product manuals \n1.9  Advertising fliers \n2. Features of the destination \nMay include: \n2.1 Major tourist areas \n2.2 Geographic features \n2.3 History \n2.4 Local economy \n2.5 Local customs \n2.6 Specific regional features \n2.7 Cultural elements \n2.8 Special features of the host community \n2.9 Appropriate health and safety considerations \n2.10 Climate and seasonal factors \n2.11 Local facilities \n2.12 Banking, currency information \n2.13 Facilities for customers with special needs \n3. Informal and formal research \nMay include: \n3.1 Informal discussions with colleagues \n3.2 Formal study \n3.3 Reading of brochures \n3.4 Trade and general media \n3.5 Product updates and launches \n3.6 Promotional seminars \n3.7 Direct contact with other organizations \n3.8 Familiarizations \n3.9 Reading of travel guide books \n3.10 Accessing the internet \n3.11 Personal on-site observation/exploration \n3.12 Organizing information from own memory and \nexperiences \n3.13 Watching TV, videos and films \n3.14 Listening to radio \n3.15 Reading newspapers, books and other references\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         52 \n \n \nVARIABLES \n \n \nRANGE \n \n4.  General product information \nMay include: \n4.1 Types of product available within the \ndestination \n4.2 Seasonal availability of product \n4.3 Location of product within the destination \n5.  Sales or operational need \nMay include: \n5.1 Providing destination information and advice \n5.2 Promoting tourism products to the customer \n5.3 Coordinating supplier services for the \ncustomer \n5.4 Purchasing promotional products \n6.  Specific details about the \nproduct or service \nMay include: \n6.1 Costs/tariffs/rates \n6.2 Conditions and rules \n6.3 Scheduling information \n6.4 Product codes \n6.5 Booking procedures \n6.6 Point of departure \n6.7 Touring inclusions and exclusions \n6.8 Technical specifications for audio visual and \nother meetings and events equipment \n6.9 Specifications for products to be branded with \ncorporate details\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         53 \nEVIDENCE GUIDE \n \n1.  Critical aspects of   \ncompetency \nAssessment requires evidences that the candidate: \n1.1 Demonstrated the ability to locate in the office files relevant \nand accurate information on tourism destinations and the \ntypes of product offered in those destinations \n1.2 Demonstrated knowledge to source of current industry \ninformation requested  \n1.3 Demonstrated ability to provide information on different \ncategories of tourism products within company acceptable \ntimeframes \n1.4 Demonstrated ability to provide knowledge of product \nterminology and procedures according to the industry \nsector and workplace  \n2.  Resource  \nimplications \nThe following resources should be provided: \n2.1  Fully-equipped industry-realistic office environment using \nappropriate computers, printers, information programs and \npublications \n2.2 Provision of information and advice within timeframes and \nconstraints that reflect typical industry practice \n3.  Methods of   \nassessment \nCompetency in this unit  may be assessed through: \n3.1  Demonstration of skills with oral questioning through the \npresentation of product options prepared by the candidate \nto meet differing customer needs \n3.2 Evaluation of candidate’s output to check whether content, \nformat and style of information presented is consistent with \nrequested information. \n3.3 Third-party reports of on-the-job performance by the \ncandidate. \n4.  Context for  \nassessment \n4.1 Competency assessment may occur in workplace or any \nappropriately simulated environment \n4.2 Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
