        "source_text": "--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         54 \n \nUNIT OF COMPETENCY    :   PROMOTE TOURISM PRODUCTS AND SERVICES \nUNIT CODE \n \n        :   TRS5113125 \nUNIT DESCRIPTOR    \n: This unit deals with the knowledge, skills, behavior and \nmotivations required to promote a destination and sell tourism \nproducts and services proactively in a range of industry \ncontexts. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Identify \ncustomer \nneeds \n1.1   Specific customer \nneeds and \npreferences are \naccurately identified, \nincluding cultural \nneeds and \nexpectations. \n1.2   Customer \nrequirements which, \nif met, would breach \nethical and legal \ncommitments, are \nimmediately \nidentified. \n1.3   Rapport is \nestablished with the \ncustomer to promote \ngoodwill and trust.  \n1.1  Fundamental \ncommunication \nprinciples  \n1.2  Customer \npreferences \n1.3. Customer profile – \nsocio-economic \nstatus  \n1.4  Available time or \ntime element \n1.1  Communication \nskills, specifically \nactive listening and \nquestioning \n1.2  Interpreting \ncustomer profile \n \n2.   Suggest \nproducts to \nmeet \ncustomer \nneeds \n2.1  Research is \nconducted, when \nrequired, to source \ninformation to meet \nspecific customer \nneeds \n2.2  Product options are \ntailored to the specific \nneeds of the \ncustomer \n2.3  Product suggestions \nare made in \naccordance with \ncurrent enterprise \npromotional focus \nand any preferred \nproduct arrangements \nwhere appropriate \n \n2.1  General product or \nservice knowledge \nas appropriate to \nthe enterprise or \nindustry sector \n2.2  Content and format \nof product \ninformation \n2.3. Enterprise \npreference for \nspecific products \nand services \n2.1  Communication \nskills, persuasive, \npositive and active \n2.2  Reading facial \nexpression and body \nlanguage \n2.3  Meeting and \nmanaging objections\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         55 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n2.4  Customers are made \naware of additional \nproducts and options \nwhich may enhance \ntheir itinerary \n2.5  All options are \nprovided within the \nappropriate or agreed \ntimeframe \n2.6  All options are \npresented in a format \nand style most \nappropriate to the \nparticular customer \nand in accordance \nwith enterprise \nprocedures \n \n \n3.   Provide \nproduct \ninformation \nand advice \n3.1 Specific product \ninformation and \nadvice needs of the \ncustomer are \naccurately identified \n3.2 Current and accurate \nproduct information \nand advice are \nprovided in a timely \nmanner \n3.3 Scope and depth of \nthe information are \nmade appropriate to \ncustomer needs \n3.4 Information and \nadvice are presented \nin an appropriate \nformat and style \n3.5 Features and benefits \nare clearly explained \nand promoted to the \ncustomer \n \n3.1  Specific product \ninformation   \n3.2. Required and \nessential scope and \ndepth of the \ninformation that is \nappropriate to \ncustomer needs \n3.2. Enterprise  \npreference for \nspecific products \nand services \n3.4. Basic information of \nChild-wise Tourism \nProgram and \nrelated topics \n3.5. Environmental \nprotection and \nconservation \npractices in the \nlocality \n3.1 Positive presentation \nof information on the \nproduct or service to \nthe customer – \nhighlight the features \nand the benefits \n3.2 Providing additional \ninformation to meet, \nmanage and \novercome objections\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         56 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4.  Sell tourism \nrelated \nproducts and \nservices  \n4.1  Customer interest is \ncreated according to \nestablished sales \nguidelines \n4.2  Suitable sales pitch/ \npresentation \nregarding tourism-\nrelated products \nand services are \ncreated and executed \n4.3  Customer’s reactions \nto sales pitch is \nobserved and \naddressed \naccordingly \n4.4  Customer’s issues \nand problems are \nproactively identified \nand resolved \n4.5  Appropriate sales \nclosing techniques \nare applied according \nto established sales \nguidelines \n \n \n4.1  Sales principles \nand selling \ntechniques  \n4.2  Price and inclusions \nof the product or \nservice \n4.3  Specific terms and \nconditions of the \nsale \n4.4  On-line sales and \nmarketing \npromotional \ntechniques \n4.5  Tourism- related \nproducts and \nservices \n4.6  Local tourism \nordinances and \nrules, regulations \nand practices \n4.1  Application of sales \nprinciples and selling \ntechniques \n4.2  Providing additional \ninformation to meet, \nmanage and \novercome objections \n4.3  Application of \nclosure techniques \nat the appropriate \ntime\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         57 \nRANGE OF VARIABLES \n \n \nVARIABLES \n \n \nRANGE \n \n1.  Specific customer needs \nand preferences \nMay include: \n1.1 Preferences of different cultures/nationalities \n1.2 Family status \n1.3 Age \n1.4 Gender \n1.5 Available budget \n1.6 Time available \n1.7 Special interests \n2.  Ethical and legal \ncommitments \nMay include: \n2.1 Child sex tourism products or services \n2.2 Products which breach environmental laws \n3. Products \nMay include: \n3.1  Lodging establishments \n3.2  Food and Beverage outlets \n3.3  Attractions and activities \n3.4  Arts and crafts/souvenirs \n3.5  Native food and delicacies \n3.6  Sightseeing tours and tour packages \n3.7  Outdoor and sports packages \n4.  Services \nMay include: \n4.1 Transportation and communication \n4.2  Local guide \n4.3  Health and wellness/spa \n4.4  Interpreter \n4.5  Child daycare \n4.6  Financial services and institutions\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         58 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of   \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Demonstrated the ability to communicate with the customer \nand interpreted the customer’s requirements \n1.2  Demonstrated the ability to create customer’s interests \n1.3  Demonstrated good product knowledge and suggestive \nadvice and selling  skills  \n1.4  Demonstrated the ability to apply closing sales techniques \n2.   Resource  \nimplications \nThe following resources should be provided: \n2.1  Interaction with others to demonstrate selling skills  \n2.2  Relevant and current product information eg. brochures, \ntimetables, product sales kits \n2.3  Access to internet resources and gadgets, smart phones \nand the like \n3.  Methods of   \nassessment \nCompetency in this unit may be assessed through: \n3.1  Demonstration of skills with questioning in promoting a \nproduct or service. \n3.2  Evaluation of candidate’s output. \n3.3  Third party workplace reports of on-the-job performance by \nthe candidate. \n4. Context for  \nassessment \n4.1  Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2  Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
