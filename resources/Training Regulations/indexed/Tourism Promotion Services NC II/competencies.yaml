        "source_title": "PROVIDE EFFECTIVE CUSTOMER SERVICE",
        "source_text": "--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         38 \n      UNIT OF COMPETENCY: \nPROVIDE EFFECTIVE CUSTOMER SERVICE \n \n      UNIT CODE \n      :     TRS311205 \n \n      UNIT DESCRIPTOR       : \nThis unit of competency deals with the knowledge, skills and \nattitudes in providing effective customer service. It includes \ngreeting customer, identifying customer needs, delivering \nservice to customer, handling queries through telephone, fax \nmachine, internet and email and handling complaints, \nevaluation and recommendation. \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Greet customer \n1.1 \nGuests \nare greeted in line with \nenterprise procedure \n1.2 Verbal and non-verbal \ncommunications are \nappropriate to the given \nsituation \n1.3 Non-verbal \ncommunication of \ncustomer is observed \nresponding to customer \n1.4  Sensitivity to cultural \nand social differences \nis demonstrated \n1.1  Communication \n         1.1.1 Interactive \ncommunication with \nothers \n         1.1.2 Interpersonal \nskills/ social graces \nwith sincerity \n1.2  Attitude \n         1.2.1  Attentive, \npatient and cordial \n         1.2.2 Eye-to-eye  \n          contact \n         1.2.3 Maintain  \n          teamwork and  \n          cooperation \n1.3  Theory \n         1.3.1 Interview  \n          techniques \n         1.3.2 Communication \nprocess \n         1.3.3 Communication  \n          barriers \n1.1  Effective \ncommunicatio\nn skills \n1.2   Non-verbal \ncommunicatio\nn - body \nlanguage \n1.3  Good time \nmanagement \n1.4  Ability to work \ncalmly and \nunobtrusively \neffectively  \n \n2.   Identify \ncustomer needs \n2.1  Appropriate \ninterpersonal skills \nare used to ensure that \ncustomer needs are \naccurately identified \n2.2 Customer needs are \nassessed for urgency \nso that priority for \nservice delivery can be \nidentified \n2.3  Customers are provided \nwith information \n2.1  Communication \n2.1.1 Interactive \ncommunication with \nothers \n2.1.2 Interpersonal \nskills/ social graces \nwith sincerity \n2.2  Safety Practices \n2.2.1 Safe work \npractices \n2.2.2 Personal \nhygiene \n2.3  Attitude \n2.3.1  Attentive, patient and \ncordial \n2.3.2 Eye-to-eye contact \n2.3.3 Maintain teamwork and \ncooperation  \n2.1  Effective \ncommunicatio\nn skills \n2.2   Non-verbal \ncommunicatio\nn - body \nlanguage \n2.3  Good time \nmanagement \n2.4  Ability to work \ncalmly and \nunobtrusively \neffectively\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         39 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n2.4  Personal limitation in \naddressing customer \nneeds is identified and \nwhere appropriate, \nassistance is sought \nfrom supervisor \n \n2.4  Theory \n     2.4.1 Selling/upselling  \n              techniques \n     2.4.2 Interview \ntechniques \n     2.4.3 Conflict resolution  \n     2.4.4 Communication  \n              process \n     2.4.5 Communication  \n              barriers \n \n3.   Deliver service \nto   customer \n3.1  Customer needs are \npromptly attended to in \nline with enterprise \nprocedure \n3.2 Appropriate rapport is \nmaintained with \ncustomer to enable \nhigh quality service \ndelivery \n3.3 Opportunity to enhance \nthe quality of service \nand products are taken \nwherever possible \n \n3.1  Communication \n       3.1. Interactive  \n              communication \nwith  \n              others \n       3.1.2 Interpersonal \nskills/  \n                social graces \nwith  \n                sincerity \n3.2  Safety Practices \n       3.2.1 Safe work  \n                practices \n       3.2.2 Personal \nhygiene \n3.3  Attitude \n       3.3.1  Attentive, \npatient  \n                 and cordial \n       3.3.2 Eye-to-eye \ncontact \n       3.3.3 Maintain \nteamwork  \n                and cooperation \n3.4  Theory \n       3.4.1 Selling/upselling  \n                techniques \n       3.4.2 Interview  \n                techniques \n       3.4.3 Conflict \nresolution  \n       3.4.4 Communication  \n                process \n       3.4.5 Communication  \n                Barriers \n \n \n \n \n3.1  Effective \ncommunicatio\nn skills \n3.2   Non-verbal \ncommunicatio\nn - body \nlanguage \n3.3  Good time \nmanagement \n3.4  Ability to work \ncalmly and \nunobtrusively \neffectively\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         40 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4.   Handle queries \nthrough \ntelephone, fax \nmachine, \ninternet and \nemail \n4.1  Use telephone, \ncomputer, fax machine, \ninternet                     \nefficiently to determine \ncustomer requirements \n4.2  Queries/ information \nare recorded in line with \nenterprise procedure \n4.1  Communication \n      4.1.1 Interactive \ncommunication with \nothers \n     4.1.2 Interpersonal \nskills/ social graces \nwith sincerity \n4.2  Attitude \n      4.2.1  Attentive, patient \nand cordial \n      4.2.2 Maintain \nteamwork and \ncooperation \n4.1  Effective \ncommunicatio\nn skills \n4.2   Non-verbal \ncommunicatio\nn - body \nlanguage \n4.3  Good time \nmanagement \n4.4  Ability to work \ncalmly and \nunobtrusively \neffectively  \n \n4.3  Queries are acted upon \npromptly and correctly \nin line with enterprise \nprocedure \n4.3  Theory \n       4.3.1 Interview  \n              techniques \n       4.3.2 Communication     \n              process \n 4.3.3 Communication \nbarriers \n \n5.   Handle \ncomplaints, \nevaluation and \nrecommendatio\nns \n5.1 Guests are greeted with \na smile and eye-to-eye \ncontact \n5.2 Responsibility for \nresolving the complaint \nis taken within limit of \nresponsibility \n5.3 Nature and details of \ncomplaint are \nestablished and agreed \nwith the customer  \n5.4 Appropriate action is \ntaken to resolve the \ncomplaint to the \ncustomers satisfaction \nwherever possible   \n \n5.1  Communication \n       5.1.1 Interactive \ncommunication with \nothers \n       5.1.2 Interpersonal \nskills/ social graces \nwith           sincerity \n5.2  Attitude \n       5.2.1 Attentive, patient    \n              and cordial \n       5.2.2 Eye-to-eye \ncontact \n       5.2.3 Maintain \nteamwork  \n                and cooperation \n5.3  Theory \n       5.3.1 Interview  \n                techniques \n       5.3.2 Conflict \nresolution  \n       5.3.3 Communication  \n                process \n       5.3.4 Communication  \n                barriers \n5.1  Effective \ncommunicatio\nn skills \n5.2  Non-verbal \ncommunicatio\nn - body \nlanguage \n5.3  Good time \nmanagement \n5.4  Ability to work \ncalmly and \nunobtrusively \neffectively  \n5.5  Proper way of \nhandling \ncomplaints\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         41 \n  \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Non-verbal communication May include: \n1.1 Body language \n1.2 Dress and accessories \n1.3 Gestures and mannerisms \n1.4 Voice tonality and volume \n1.5 Use of space \n1.6 Culturally specific communication customs and \npractices \n2.  Cultural and social                \ndifferences \nMay include: \n2.1 Modes of greeting, farewelling and \nconversation \n2.2 Body language/  use of body gestures \n2.3 Formality of language \n3. Interpersonal skills \nMay include: \n3.1  Interactive communication \n3.2  Public relation \n3.3  Good working attitude \n3.4  Sincerity \n3.5  Pleasant disposition \n3.6  Effective communication skills \n4.  Customer needs \nMay include: \n4.1 Those with a disability \n4.2 Those with special cultural or language needs \n4.3 Unaccompanied children \n4.4 Parents with young children \n4.5 Pregnant women \n4.6 Single women\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         42 \n \nVARIABLES \nRANGE \n5.  Enterprise procedure \nMay include: \n5.1 Modes of greeting and farewelling \n5.2 Addressing the person by name \n5.3 Time-lapse before a response \n5.4 Style manual requirements \n5.5 Standard letters and proformas \n \n EVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \n \n \n \n \n \n \n \n \nAssessment requires evidence that the candidate: \n1.1 Complied with industry practices and procedures \n1.2 Used interactive communication with others \n1.3 Complied with occupational, health and safety practices \n1.4 Promoted public relation among others \n1.5 Complied with service manual standards \n1.6 Demonstrated familiarity with company facilities, \nproducts and services \n1.7 Applied company rules and standards \n1.8 Applied telephone ethics \n1.9 Applied correct procedure in using telephone, fax \nmachine, internet \n1.10 Handled customer complaints \n2.  Resource \nimplications  \nThe following resources should be provided: \n2.1  Availability of telephone, fax machine, internet, etc. \n2.2  Availability of data on projects and services; tariff and \nrates, promotional activities in place etc. \n2.3  Availability of office supplies \n3.  Methods of \nassessment \nCompetency in this unit may be assessed through: \n3.1  Written examination \n3.2  Practical demonstration  \n4.  Context for \nassessment \n4.1  Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2 Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
