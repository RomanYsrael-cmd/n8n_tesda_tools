ntenance of \nequipment and \nfacilities are followed \nas per established \nprocedures \n \n2.1  Company policies \n2.2  Company \noperations, \nprocedures and \nstandards  \n2.3 Time management \n2.4  Basic strategic \nplanning concepts \n2.5  Resource utilization \nand management \n \n2.1  Managing goals and \ntime \n2.2  Practicing economic \nuse of resources \nand facilities \n2.3  Setting work \npriorities \n2.4  Practicing time \nmanagement \n3.  Maintain \nprofessional \ngrowth and \ndevelopment \n3.1  Trainings and \ncareer \nopportunities are \nidentified and \navailed of  based \non job requirements \n3.2  Recognitions are  \nsought/received \nand demonstrated \nas proof of career \nadvancement \n3.3  Licenses and/or \ncertifications \nrelevant to job and \ncareer are obtained \nand renewed  \n \n3.1  Career \ndevelopment \nopportunities \n3.2  Company \nrecognition and \nincentives \n3.3  Information on \nrelevant licenses \nand or certifications \n3.1  Determining \npersonal career \ndevelopment needs \n3.2  Identifying career \nopportunities\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         13 \n \n \n \n \n \n \n \n \n \n \n     RANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Evaluation \nMay include:   \n1.1 Performance Appraisal \n1.2 Psychological Profile \n1.3 Aptitude Tests \n \n2.  Resources \nMay include:  \n2.1 Human \n2.2 Financial \n2.3 Technology \n2.3.1  Hardware \n2.3.2 Software \n \n3.  Trainings and career \nopportunities \nMay include:  \n3.1 Participation in training programs \n      3.1.1 Technical \n      3.1.2  Supervisory \n      3.1.3  Managerial \n      3.1.4  Continuing Education \n3.2  Serving as Resource Persons in conferences and \nworkshops \n \n4.  Recognitions \nMay include:  \n4.1 Recommendations \n4.2  Citations \n4.3  Certificate of Appreciations \n4.4  Commendations \n4.5  Awards \n4.6 Tangible and Intangible Rewards \n \n5.  Licenses and/or \ncertifications \nMay include:   \n5.1 National Certificates \n5.2  Certificate of Competency \n5.3 Support Level Licenses \n5.4 Professional Licenses\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         14 \n        EVIDENCE GUIDE \n       \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Attained job targets within key result areas (KRAs) \n1.2 Maintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 Completed trainings and career opportunities which are \nbased on the requirements of the industries \n1.4 Acquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n2.  Resource \nimplications \nThe following resources should be provided: \n2.1  Workplace or assessment location \n2.2  Case studies/scenarios \n3.  Methods of \nassessment \nCompetency in this unit may be assessed through: \n3.1  Portfolio Assessment \n3.2  Interview \n3.3  Simulation/Role-plays \n3.4  Observation \n3.5  Third Party Reports \n3.6  Exams and Tests \n4.  Context for \nassessment \n4.1  Competency assessment may occur in workplace or \nany appropriately simulated environment. \n4.2 Assessment shall be observed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
