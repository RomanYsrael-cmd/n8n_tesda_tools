        "source_title": "OBSERVE WORKPLACE HYGIENE PROCEDURES",
        "source_text": "--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         24 \nUNIT OF COMPETENCY :    OBSERVE WORKPLACE  HYGIENE  \n                                               PROCEDURES \n \nUNIT CODE                      :    TRS311202 \n \nUNIT DESCRIPTOR        :    This unit of competency deals with the knowledge, skills \nand attitudes in observing workplace hygiene \nprocedures. It includes following hygiene procedures and \nidentifying and preventing hygiene risks. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Follow \nhygiene \nprocedures \n1.1 Workplace hygiene \nprocedures are \nimplemented in line \nwith enterprise and \nlegal requirements \n1.2 Handling and \nstorage of items are \nundertaken in line \nwith enterprise and \nlegal requirements  \n1.1 Typical hygiene and \ncontrol procedures \nin the hospitality and \ntourism industries \n1.2 Overview of \nlegislation and \nregulation in relation \nto food handling, \npersonal and \ngeneral hygiene \n1.3  Knowledge on \nfactors which \ncontribute to \nworkplace hygiene \nproblems \n1.4  General hazards in \nhandling of food, \nlinen and laundry \nand garbage, \nincluding major \ncauses of \ncontamination and \ncross-infection \n \n1.1  Ability to follow \ncorrect procedures \nand instructions \n1.2  Ability to handle \noperating tools/ \nequipment \n1.3  Application to \nhygiene principles\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         25 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.   Identify and \nprevent \nhygiene risks \n2.1 Potential hygiene \nrisks are identified \nin line with \nenterpris