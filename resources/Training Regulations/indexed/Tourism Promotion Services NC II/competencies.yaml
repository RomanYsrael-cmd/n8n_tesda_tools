        "source_text": "--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         34 \n \n  UNIT OF COMPETENCY:       PERFORM WORKPLACE AND SAFETY   PRACTICES \n \n  UNIT CODE \n \n   :      TRS311204 \n \n  UNIT DESCRIPTOR        :       This unit of competency deals with the knowledge, skills and \nattitudes in following health, safety and security practices. It \nincludes dealing with emergency situations and maintaining \nsafe personal presentation standards. \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Follow \nworkplace \nprocedures for \nhealth, safety \nand security \npractices \n1.1 Correct health, \nsafety and security \nprocedures are \nfollowed in line with \nlegislation, \nregulations and \nenterprise procedures \n1.2 Breaches of health, \nsafety and security \nprocedures are \nidentified and \nreported in line with \nenterprise procedure \n1.3 Suspicious behavior \nor unusual \noccurrence are \nreported in line with \nenterprise procedure   \n \n1.1 Communication \n      1.1.1 Interactive       \n             communication  \n             with others \n      1.1.2 Interpersonal    \n               skills \n      1.1.3 Good working  \n               attitude \n      1.1.4 Ability to work   \n              quietly; with  \n              cooperation;  \n              patience,  \n              carefulness,  \n              cleanliness  \n              and aesthetic  \n              values \n      1.1.5 Ability to  \n               focus on task  \n              at hand \n1.2 Systems, \nProcesses and \nOperations \n    1.2.1 Workplace \nhealth, safety and \nsecurity \nprocedures     \n    1.2.2 Emergency \nprocedures \n    1.2.3 Personal \npresentation \n1.3 Safety Practices \n    1.3.1 Proper \ndisposal of \ngarbage \n    1.3.2 Practice safety \nmeasures \n    1. 3.3 5S \nImplementation \n1.1  Ability to make  \ndecision \n1.2  Time management \n1.3   Ability to offer \nalternative steps \n1.4  Care in handling \nand operating \nequipment\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         35 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nBold and italicized terms \nare elaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2.   Deal with \nemergency      \n      situations \n2.1  Emergency and \npotential \nemergency \nsituations     are \nrecognized and \nappropriate action \nare taken within \nindividual’s scope \nof responsibility \n2.2 Emergency \nprocedures are \nfollowed in line with  \nenterprise \nprocedures \n2.3 Assistance is \nsought from \ncolleagues to \nresolve or respond \nto emergency \nsituations \n2.4 Details of \nemergency \nsituations are \nreported in line \nwith enterprise \nprocedures \n \n2.1 Systems, \nProcesses and \nOperations \n    2.1.1 Workplace   \n             health, safety  \n             and security  \n             procedures     \n     2.1.2 Emergency  \n             procedures \n     2.1.3 Personal   \n             presentation \n2.2 Safety Practices \n     2.2.1 Practice safety   \n              measures \n     2.2.2 5S       \n             Implementation \n2.1  Ability to make  \ndecision \n2.2  Time management \n2.3   Ability to offer \nalternative steps \n2.4   Applying \nemergency \nprocedures \n3.   Maintain safe \npersonal \npresentation \nstandards \n 3.1 Safe personal \nstandards are \nidentified and \nfollowed in line with \nenterprise \nrequirements \n3.1 Personal \npresentation \n3.2 Safety Practices \n         3.2.1 Practice   \n           safety measures \n          3.2.2 5S \nImplementation \n3.1 Following safe  \npersonal standards\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         36 \n \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Health, safety and security \nprocedures \nMay include : \n1.1 Use of personal protective clothing and \nequipment \n1.2 Safe posture including sitting, standing, bending \n1.3 Manual handling including lifting, transferring \n1.4 Safe work techniques including knives and \nequipment, handling hot surfaces, computers \nand electronic equipment \n1.5 Safe handling of chemicals, poisons and \ndangerous materials \n1.6 Ergonomically sound furniture and work stations \n1.7 Emergency fire and accident \n1.8 Hazard identification and control \n1.9 Security of documents, cash, equipment, people \n1.10 Key control systems \n2. Breaches of procedure \nMay include: \n2.1 Loss of keys \n2.2 Strange or suspicious persons \n2.3 Broken or malfunctioning equipment \n2.4 Loss of property, goods or materials \n2.5 Damaged property or fittings \n2.6 Lack of suitable signage when required \n2.7 Lack of training on health and safety issues \n2.8 Unsafe work practices \n3. Emergency \nMay include: \n3.1   Personal injuries                              \n3.2   Fire \n3.3   Electrocution \n3.4   Natural calamity i.e. earthquake/flood \n3.5   Criminal acts i.e. robbery\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         37 \nEVIDENCE GUIDE \n \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate : \n1.1  Complied with industry practices and procedures \n1.2  Used interactive communication with others \n1.3  Complied with workplace safety, security and hygiene \npractices \n1.4   Identified faults & problems and the necessary corrective \naction \n1.5   Promoted public relation among others \n1.6   Complied with quality standards \n1.7  Responded to emergency situations in line with enterprise \nguidelines \n1.8  Complied with proper dress code \n2.  Resource \nimplications \nThe following resources should be provided: \n2.1   Procedures Manual on safety, security, health and \nemergency \n2.2   Availability of tools, equipment, supplies and materials  \n3.  Methods of \nassessment \nCompetency in this unit may  be assessed through: \n3.1   Written examination \n3.2   Practical demonstration  \n3.3   Interview \n4.   Context for \nassessment \n4.1   Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2   Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
