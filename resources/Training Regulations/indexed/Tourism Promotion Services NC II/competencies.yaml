        "source_text": "--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         28 \n \nUNIT OF COMPETENCY:   PERFORM COMPUTER OPERATIONS \n \nUNIT CODE \n   :   TRS311203 \n \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes and \nvalues needed to perform computer operations which \nincludes inputting, accessing, producing and transferring \ndata using the appropriate hardware and software  \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.   Plan and \nprepare for task \nto be \nundertaken \n1.1 Requirements of task \nare determined \n1.2 Appropriate hardware \nand software is \nselected according to \ntask assigned and \nrequired outcome \n1.3 Task is planned to \nensure OH & S \nguidelines and \nprocedures are \nfollowed \n1.1 Basic ergonomics of \nkeyboard and \ncomputer use \n1.2 Main types of \ncomputers and basic \nfeatures of different \noperating systems \n1.3 Main parts of a \ncomputer \n1.4 Storage devices and \nbasic categories of \nmemory \n1.5 Relevant types of \nsoftware \n1.6 General security \n1.7 Viruses \n1.8 OH & S principles \nand responsibilities \n1.9 Calculating \ncomputer capacity \n1.1  Reading skills \nrequired to \ninterpret work \ninstruction \n1.2  Communication \nskills \n \n2.  Input data into \ncomputer \n2.1 Data are entered into \nthe computer using \nappropriate \nprogram/application in \naccordance with \ncompany procedures \n2.2 Accuracy of \ninformation is checked \nand information is \nsaved in accordance \nwith standard \noperating procedures \n2.3 Inputted data are \nstored in storage \nmedia according to \nrequirements \n2.1 Storage devices and \nbasic categories of \nmemory \n2.2 Relevant types of \nsoftware \n2.3 General security \n2.4 Viruses \n2.5 OH & S principles \nand responsibilities \n2.6 Calculating \ncomputer capacity \n2.1  Reading skills \nrequired to \ninterpret work \ninstruction \n2.2  Communication \nskills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         29 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n \n2.4 Work is performed \nwithin ergonomic \nguidelines \n \n \n3.   Access \ninformation \nusing computer \n3.1 Correct program/ \napplication is selected \nbased on job \nrequirements \n3.2 Program/application \ncontaining the \ninformation required is \naccessed according to \ncompany procedures \n3.3 Desktop icons are \ncorrectly selected, \nopened and closed for \nnavigation purposes \n3.4 Keyboard techniques \nare carried out in line \nwith OH & S \nrequirements for safe \nuse of keyboards \n3.1 Relevant types of \nsoftware \n3.2 OH & S principles \nand responsibilities \n3.3 Calculating \ncomputer capacity \n3.1  Reading skills \nrequired to \ninterpret work \ninstruction \n3.2  Communication \nskills \n \n4.   Produce/output \ndata using \ncomputer \nsystem \n4.1 Entered data are \nprocessed using \nappropriate software \ncommands \n4.2 Data are printed out \nas required using \ncomputer \nhardware/peripheral \ndevices in accordance \nwith standard \noperating procedures \n4.3 Files and data are \ntransferred between \ncompatible systems \nusing computer \nsoftware, hardware/ \nperipheral devices in \naccordance with \nstandard operating \nprocedures  \n4.1 Relevant types of \nsoftware \n4.2 General security \n4.3 Viruses \n4.4 OH & S principles \nand responsibilities \n4.5 Calculating \ncomputer capacity \n4.1  Reading skills \nrequired to \ninterpret work \ninstruction \n4.2  Communication \nskills\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \nTR - TOURISM PROMOTION SERVICES NC II (Amended)            Promulgated June 16, 2015         30 \n \n