  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for TOURISM PROMOTION SERVICES NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: TOURISM PROMOTION SERVICES\n\nNC Level: II\n\nNominal Training Duration: 20 Hrs. (Basic)\n\n 28 Hrs. (Common)\n\n 28 Hrs. (Core)\n\n 76 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, behavior and\nmotivations in accordance with industry standards.\n\nTo advocate and sell tourism destination, products and services through\ntechnology-based information gathering and application of sales and promotions\nprinciples and techniques.\n\n--- PDF PAGE 64 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015\n\n 60\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective communication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and systems\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Sources of information\n• Types of question\n• Medium of communication\n• Flow of communication\n• Storage system\n• Telephone courtesy\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in workplace\nmeetings and\ndiscussions\n• Complete work related\ndocuments\n• Ability to relate to people\nof social range in the\nworkplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Group\ndiscussion\n• Role Play\n• Demonstration\n• Oral Interview\n• Written test\n• Demonstration\n5 hours\n1.2 Complete\nrelevant work\nrelated\ndocuments\n\n• Communication\nprocedures and systems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of communication\n• Workplace interactions\n• Non-verbal\ncommunication\n•\nFollow simple spoken\nlanguage\n•\nPerform routine\nworkplace duties\nfollowing simple written\nnotices\n•\nParticipate in\nworkplace meetings and\ndiscussions\n•\nComplete work related\ndocuments\n•\nEstimate, calculate and\nrecord routine workplace\nmeasures\n• Role Play\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n\n--- PDF PAGE 65 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015\n\n 61\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nBasic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n•\nAbility to relate to\npeople of social range in\nthe workplace\n•\nGather and provide\ninformation in response\nto workplace\nrequirements\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace report\n• Follow simple