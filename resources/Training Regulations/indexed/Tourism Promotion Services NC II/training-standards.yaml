 hours\n3.2 Suggest\nproducts to\nmeet customer\nneeds\n• Price and inclusions of the\nproduct or service\n• Specific terms and\nconditions of the sale\n• General product or service\nknowledge as appropriate to\nthe enterprise or industry\nsector\n• Content and format of\nproduct information\n• Enterprise preference for\nspecific products and\nservices\n• Communication skills,\npersuasive, positive\nand active\n• Reading facial\nexpression and body\nlanguage\n• Meeting and\nmanaging objections\n• Group Discussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n\n--- PDF PAGE 76 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015\n\n 72\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3.3 Provide\nproduct\ninformation and\nadvice\n• Specific product information\n• Required and essential\nscope and depth of the\ninformation that is\nappropriate to customer\nneeds\n• Enterprise preference for\nspecific products and\nservices\n• Basic information of Child-\nwise Tourism and related\ntopics\n• Environmental protection\nand conservation practices\nin the locality\n• Positive presentation\nof information on the\nproduct or service to\nthe customer –\nhighlight the features\nand the benefits\n• Providing additional\ninformation to meet,\nmanage and\novercome objections\n• Application of closure\ntechniques at the\nappropriate time\n• Group Discussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n• Written tests\n\n--- PDF PAGE 77 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015\n\n 73\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.4 Sell tourism\nrelated\nproducts and\nservices\n\n4.1 Customer interest is\ncreated according to\nestablished sales\nguidelines\n4.2 Suitable sales pitch/\npresentation regarding\ntourism-related\nproducts and services\nare created and\nexecuted\n4.3 Customer’s reactions to\nsales pitch is observed\nand addressed\naccordingly\n4.4 Customer’s issues and\nproblems are\nproactively identified\nand resolved\n4.5 Appropriate sales\nclosing techniques are\napplied according to\nestablished sales\nguidelines\n\n• Sales presentation\n• Demonstration and\nsampling\n• Use of sales tools\n• Use of Interactive\nLearning thru\ntechnology\n\n• Lecture\n• group\ndiscussions\n• Study tour\n• Demonstration\n• Role play\n• Group\nPresentation\n\n• Oral interview\n• Demonstration\n• Observation\n8\nhours\n\n--- PDF PAGE 78 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 74\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n2.2\nEnterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n--- PDF PAGE 79 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 75\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• can communicate in basic English in both oral and written form\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for TOURISM PROMOTION SERVICES NC II are as\nfollows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\n(Latest Versions)\nQTY\n\nQTY\n\nQTY\n\n5 units Computer with\ninternet connection\n1 set\nTelephone Directory\n\n1 unit\nLCD projector\n1 set\nMaps (world, national &\nregional)\n\n1 unit\nTelephone\n\nPosters of destinations\n\nAssort\ned\nTravel brochures &\nguidebooks\n\n1 unit\nFax machine\nAssort\ned\nPictures/samples of\nsouvenirs, arts & crafts &\ndelicacies\n\n1 unit\nSound system\n1 set\nPrice lists of products &\nservices\n\n1 unit\nPhotocopier\n1 set\nDOT latest version,\nregional situationer\nreports, statistics and\nmarketing plan\n\n1 unit\nPrinter\n1 set\nCurrent schedules of\ndifferent modes of\ntransportation to different\nlocal destinations\n\n5 sets\nHeadset\n\n*NOTE: Implementation of the training program can be facilitated through a Memorandum of\nAgreement between the training provider and industry partner/s regarding the use of\nfacilities. This is in response to the high cost of facilities and equipment. Air-\nconditioned vehicles can be hired on a per trip basis subject to requirement.\n\n--- PDF PAGE 80 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 76\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n24 sq. m.\nTotal workshop area:\n104 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM SECTOR\n\n TOURISM PROMOTION SERVICES NCII\n\n TRAINER’S QUALIFICATIONS\n\n•\nMust be a holder of National TVET Trainer’s Certificate Level I in Tourism\nPromotion Services NC II\n•\nMust have at least 3-5 years job/industry experience\n•\nMust have attended relevant training and seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\nThe result of the institutional assessments may be considered as an\nevidence for national assessment.\n\n--- PDF PAGE 81 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015 77"
