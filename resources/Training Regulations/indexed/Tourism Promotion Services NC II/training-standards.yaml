    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: TOURISM PROMOTION SERVICES\n\nNC Level: II\n\nNominal Training Duration: 20 Hrs. (Basic)\n\n 28 Hrs. (Common)\n\n 28 Hrs. (Core)\n\n 76 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills, behavior and\nmotivations in accordance with industry standards.\n\nTo advocate and sell tourism destination, products and services through\ntechnology-based information gathering and application of sales and promotions\nprinciples and techniques.\n\n--- PDF PAGE 64 ---\nTR - TOURISM PROMOTION SERVICES NC II (Amended) Promulgated June 16, 2015\n\n 60\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective communication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and systems\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Sources of information\n• Types of question\n• Medium of communication\n• Flow of communication\n• Storage system\n• Telephone courtesy\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in workplace\nmeetings and\ndiscussions\n• Complete work related\ndocuments\n• Ability 