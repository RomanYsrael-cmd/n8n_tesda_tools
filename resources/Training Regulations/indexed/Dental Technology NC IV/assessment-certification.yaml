  "arrangements": [
    {
      "number": "4.1",
      "text": "The National Qualification of Dental Technology NC IV covers the competency requirements for practicing as a Registered Dental Technologist under the Philippine Dental Act of 2007 (RA 9484)"
    },
    {
      "number": "4.2",
      "text": "In accordance with Section 13 of Republic Act 9484, examination and licensing of Dental Technologists shall be administered by the Board of Dentistry of the Professional Regulations Commission."
    },
    {
      "number": "4.3",
      "text": "In accordance with Section 14 of Republic Act 9484 and its IRR, applicants for admission to the licensure examination at the time of filing his/her application must be: 4.3.1 A citizen of the Philippines; 4.3.2 Of good moral character; 4.3.3 He/she had finished the two years and six months program certificate in dental technology conferred by a recognized and legally constituted college, or school of dentistry registered with the TESDA; 4.3.4 Undergone on –the- job training in a registered/accredited dental laboratory for at least six months; and/or Those who have failed the PRC examination three times shall take a refresher course in a PRC accredited dental school which will be posted in the PRC Application Division and a certificate thereon shall be submitted with the application."
    },
    {
      "number": "4.4",
      "text": "The core competencies for the following National Qualifications are embedded in the Dental Technology NC IV Qualification. • Dental Laboratory Technology Services NC I • Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II • Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II National Assessment shall continue to be administered by TESDA for the above qualifications. For further details, please refer to the Training Regulations for the above qualifications."
    }
