  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 The National Qualification of Dental Technology NC IV covers the competency requirements\nfor practicing as a Registered Dental Technologist under the Philippine Dental Act of 2007\n(RA 9484)\n\n4.2 In accordance with Section 13 of Republic Act 9484, examination and licensing of Dental\nTechnologists shall be administered by the Board of Dentistry of the Professional Regulations\nCommission.\n\n4.3 In accordance with Section 14 of Republic Act 9484 and its IRR, applicants for admission to\nthe licensure examination at the time of filing his/her application must be:\n\n4.3.1\nA citizen of the Philippines;\n4.3.2\nOf good moral character;\n4.3.3\nHe/she had finished the two years and six months program certificate in dental\ntechnology conferred by a recognized and legally constituted college, or school of\ndentistry registered with the TESDA;\n4.3.4\nUndergone on –the- job training in a registered/accredited dental laboratory for at\nleast six months; and/or\n\nThose who have failed the PRC examination three times shall take a refresher course in a\nPRC accredited dental school which will be posted in the PRC Application Division and a\ncertificate thereon shall be submitted with the application.\n\n4.4 The core competencies for the following National Qualifications are embedded in the Dental\nTechnology NC IV Qualification.\n\n• Dental Laboratory Technology Services NC I\n• Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II\n• Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II\n\nNational Assessment shall continue to be administered by TESDA for the above\nqualifications. For further details, please refer to the Training Regulations for the above\nqualifications.\n\n--- PDF PAGE 161 ---\nTR Dental Technology NC IV\n\n156\n\nCOMPETENCY MAP – HEALTH CARE SECTOR (DENTAL TECHNOLOGY NC IV)\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with others\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop teams\nand individuals\nApply problem\nsolving\ntechniques in\nthe workplace\nCollect, analyze\nand organize\ninformation\nPlan and organize\nwork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond\neffectively to\ndifficult/challenging\nbehavior\nApply basic first\naid\nMaintain high\nstandard of\npatient services\nProcess reusable\ninstruments and\nequipment in\nhealth work\nPrepare for and\nassist with oral\nhealth care\nprocedures\nAssist in dental\nlaboratory\nprocedures\nAssist with\nadministration in\ndental practice\nMaintain an\neffective\nrelationship with\ncustormers and\nclients\nManage own\nperformance\nFollow\noccupational\nhealth and\nsafety policies in\ndental practice\nMaintain infection\ncontrol in dental\npractice\nMaintain\ninstruments and\nequipment in\nwork area\nApply quality\nstandards\n\nOperate a personal\ncomputer\n\n--- PDF PAGE 162 ---\nTR Dental Technology NC IV\n\n157\n\nCORE COMPETENCIES\n\nProvide care and\nsupport to infants and\ntoddlers\nProvide care and\nsupport to children\nFoster social,\nintellectual,\ncreative and\nemotional\ndevelopment of\nchildren\nFoster the\nphysical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people\nwith special\nneeds\nMaintain a\nhealthy and safe\nenvironment\nRespond to\nemergency\nClean living room,\ndining room,\nbedrooms, toilet\nand bathroom\nWash and iron\nclothes, linen and\nfabric\nPrepare hot and\ncold meals\nPrepare and\nmaintain beds\nCollect and\nmaintain linen\nstocks at end\nusers location\nAssist in patient\nmobility\n\nAssist in transporting\npatients\nAssist in bio-\npsychosocial\nsupport care of\npatients\nHandle waste in a\nhealth care\nenvironment\nInstall\nbiomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical\nequipment\nPerform\npreventive\nmaintenance on\nbiomedical\nequipment\nRepair\nbiomedical\nequipment\n\nPerform basic life\nsupport\n\nMaintain life\nsupport equipment\nand resources\nImplement safe\naccess and\nextrication\nprocedures in an\nemergency\nManage request\nfor ambulance\nservice\nAllocate\nambulance\nservice resources\nCoordinate\nemergency\nresources\nDeliver basic\nambulance\ncommunication\nskills\n\nSupervise on-road\noperations\nManage the scene\nof a special event\nManage routine\nscene\nDeliver pre-\nhospital patient\ncare\nManage\nambulance\noperations\nTransport\nemergency\npatients\nTransport non-\nemergency\npatients\nDrive vehicles under\noperational\nconditions\nWork within a\nholistic therapeutic\nmassage\nframework\nPerform\ntherapeutic\nmassage\nassessment\nPlan the\ntherapeutic\nmassage\ntreatment\nImplement\ntherapeutic\nmassage\ntreatment\nPerform remedial\ntherapeutic\nmassage\ntreatment\nWork within a\ncommunity\ndevelopment\nframework\n\n--- PDF PAGE 163 ---\nTR Dental Technology NC IV\n\n158\nPrepare for work in\nthe community\nservice industry\nSupport\ncommunity\nresources\nProvide\nprimary/residential\ncare\nSupport\ncommunity\nparticipation\nRecruit and\ncoordinate\nvolunteers\nRespond\nholistically to\nclient issues\nDevelop and\nprovide health\neducation\nprogram in the\ncommunity\nImplement health\npromotion and\ncommunity\ninterventions\nFabricate models\nFabricate custom\nimpression trays\nFabricate\nregistration bite\nrims\nArticulate models\nand transfer\nrecords\nFabricate\nmouthguard\nArrange artificial\nteeth for\ncomplete\ndentures\nSet up and wax\nremovable partial\ndentures\nWax, process and\nfinish acrylic\ndentures and\nappliances\nFabricate thermo\nformed bases and\nappliances\nRepair and\nmodify dentures\nand appliances\nFabricate oral\nsplints\nFabricate\northodontic\nappliances\nFabricate cast\nmetal removable\npartial denture\nframework\nFabricate ceramic\nrestorations\nFabricate metal\ncrown and bridge\nstructures\nFabricate indirect\ncomposite/polymer\nfixed restorations\nJoin alloy\nstructures\nPerform\nadministrative\nfunctions\nManage dental\nlaboratory\nproduction and\noperations\nContinue\nprofessional\ngrowth and\ndevelopment\n\n--- PDF PAGE 164 ---\nTR Dental Technology NC IV\n\n 159\nDEFINITION OF TERMS\n\nABUTMENT\n-\nTooth or teeth that support a fixed or removable bridge\nANTERIOR TEETH\n-\nthe six upper or six lower front teeth (canines, laterals & central incisors)\nAPEX\n-\nthe tip of the root of a tooth\nARCH\n-\ndescribes the alignment of the upper or lower teeth\nARTICULATE\n-\nto unite by forming a joint or joints\nARTICULATOR\n-\na mechanical device representing the temporomandibular joints and jaw\nmembers to which casts of the mouth\nBASE\n-\ncement placed under a dental restoration to insulate the pulp (nerve\nchamber)\nBITE\n-\nrelationship of the upper and lower teeth on closure (occlusion)\nBONDING\n-\nadhesive dental restoration technique; a tooth-colored composite resin to\nrepair and/or change the color or shape of a tooth\nBRACES\n-\ndevices used by orthodontists to gradually reposition teeth to a more\nfavorable alignment\nBRIDGE\n-\nstationary dental prosthesis (appliance) fixed to teeth adjacent to a space;\nreplaces one or more missing teeth, cemented or bonded to supporting\nteeth or implants adjacent to the space\nCANTILEVER BRIDGE\n-\nfixed bridge that attaches to adjacent teeth only on one end\nCAP\n-\ncommon term for dental crown\nCLASP\n-\ndevice that retains a removable partial denture to stationary teeth; can be\nmetal or acrylic (matches teeth and gums)\nCROSS BITE\n-\nreverse biting relationship of upper and lower teeth; aka \"under bite,\" as in\nClass III malocclusuion (prognathic jaw)\nCROWN\n\n(1) the portion of a tooth above the gum line;\n(2) dental restoration covering all or most of the natural tooth\nCUSTOM IMPRESION\nTRAY\n-\nan impression tray made from a preliminary impression used to make the\nfinal impression\nDENTAL WAXES\n-\n wax compounds used in dentistry are mixtures of individual waxes of\nmaterials or synthetic origin. As with all other dental materials, each\ncomponent n the mixture is selected to given specific properties best suited\nfor the procedure being performed\nDENTURE\n-\nremovable (partial or complete) set of artificial teeth\nDIASTEMA\n-\nopen space between teeth\nDISTAL\n-\nfarthest from any point of reference\nDUPLICATE\n-\nidentically copied from an original\nFABRICATE\n-\nto make; create; to construct by combining or assembling\nFACE-BOW FORK\n-\na device used to attach the face-bow to an occlusion rim for a face-bow\ntransfer\nFACING\n-\ntooth colored overlay on the visible portion of a crown; may be acrylic,\ncomposite or porcelain\n\n--- PDF PAGE 165 ---\nTR Dental Technology NC IV\n\n 160\n\nFILLING\n-\nrestoration of lost tooth structure with metal, porcelain or resin materials\nFULL DENTURE\n-\nremovable dental prosthesis (appliance) replacing all upper or lower teeth\nFULL MOUTH\nRECONSTRUCTION\n-\nextensive restorations of natural teeth with crowns and or fixed bridges to\nmanage restorative and bite problems.\nGYPSUM\n-\nis the common name for calcium sulfate dehydrate. Gypsum products are\nmore frequently used on laboratory procedures than any other single group\nof compounds. Controlled variations in the manufacturing of gypsum\nproducts yield a group of dental materials including plaster, artificial stone\n(hydrosol), disc stone, casting investment and soldering investment\nIMPRESSION\n-\nmold made of the teeth and soft tissues\nINLAY\n-\nindirect – filling made by a dental laboratory that is cemented or bonded\ninto place,\ndirect – placement of dental composite resin, or porcelain restoration at\nchair side\nINTEROCCLUSAL\n-\nspace between upper and lower teeth\nJACKET\n-\ncrown for a front tooth, usually made of porcelain\nLAMINATE\n-\nthin plastic or porcelain veneer produced in a dental laboratory and then\nbonded to a tooth\nMALOCCLUSION\n-\n“bad bite” or misalignment of the upper and lower teeth\nMARGIN\n-\ninterface between a restoration and tooth structure\nMARYLAND BRIDGE\n-\na bridge that is bonded to the back of the adjacent teeth; requires minimum\ntooth reduction\nMODEL\n-\na material used extensively for making impressions. It contains shellac, talc,\nglycerin, wax, tallow and palm oil\nOVERBITE\n-\nvertical overlap of the front teeth; deep bite\nPARTIAL DENTURE\n-\nremovable dental prosthesis (appliance) replacing one or more natural\nteeth\nPONTIC\n-\nreplacement tooth mounted on a fixed or removal appliance\nPORCELAIN CROWN\n-\nall porcelain restoration covering the coronal portion of tooth (above the\ngum line)\nPORCELAIN FUSED TO\nMETAL (PFM) CROWN\n-\nrestoration with metal coping (for strength) covered by porcelain (for\nappearance)\nPORCELAIN INLAY OR\nONLAY\n-\ntooth-colored restoration made of porcelain, cemented or bonded in place\nPORCELAIN VENEERS\n-\na thin layer of porcelain, fabricated by a laboratory) bonded to a natural\ntooth to replace lost tooth structure, close spaces, straighten teeth or\nchange color and/or shape\nPROSTHESIS\n\nan artificial appliance for the replacement for a body part, tooth or teeth\nSOLDERING\nINVESTMENT\n-\na soldering investment is similar in composition to a casting investment that\nhas a\nSPLINT\n-\nconnection of two or more teeth so they function as a stronger single\nstructure\n\n--- PDF PAGE 166 ---\nTR Dental Technology NC IV Promulgated\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies, non-government organizations including professional associations who donated their\ntime and expertise to the development and validation of these Training Regulations.\n\nDR. ARNON L. RIVERA\n\nPresident\n\nNational Association of Dental/Prosthesis Laboratory Inc.\n\n#96 Hoover Street, San Juan, Metro Manila\n\nDR. MACARIO FADRIGALAN IV\n\nFaculty\n\nEmilio Aguinaldo College\n1113-1117 San Marcelino St., Ermita, Manila\n\nMR. GIL CAMPANA\nOwner\nGC Dental Laboratory\n96 Hoover St., cor. Araullo St., San Juan, Metro Manila\n\nDR. BUENA V. LADERA\nBranch Manager\nInternational Dental Inc. (INTERDENT, Inc.)\n#5307 Gilbarco Bldg., South Superhighway, Makati City\n\nMS. WILMA E. REDLER, C.D.T.\n\nVP Technical and Lecturer\n\nSkytech International Dental Laboratory\n\nRamon Magsaysay, Sta. Mesa, Manila\n\nMR. KOJI MIYATA, C.D.T.\n\nLecturer/Teacher/Maxillo Facial Technician\n\nEmilio Aguinaldo College\n\n1112-1117 San Marcelino St., Ermita, Manila\n\nMR. CHRISTOPHER P. LOZANO\n\nOperations Manager\n\nPearl of the Orient Dental Studio, Inc.\n\n#770 Aurora Blvd., Cubao, Quezon City\n\nDR. ROMEO G. GAJO, JR.\nVice President for Administration/Marketing Manager\nPearl of the Orient Dental Studio, Inc.\n\n#770 Aurora Blvd., Cubao, Quezon City\n\nMR. RUVENSTEIN M. LADERA\nMarketing Director for Dental Laboratory\nInternational Dental Inc. (INTERDENT, Inc.)\n#5307 Gilbarco Bldg., South Superhighway, Makati City\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe Management and Staff of the TESDA Secretariat\n\n--- PDF PAGE 167 ---\nTR Dental Technology NC IV Promulgated\n\nList of Published Training Regulations\n\nAnimal Production NC II\n\nAquaculture NC II\n\nAutomotive Body Painting/Finishing NC II\n\nAutomotive Body Repair NC II\n\nAutomotive Engine Rebuilding NC II\n\nAutomotive Servicing NC II\n\nBartending NC II\n\nBuilding Wiring Installation NC I