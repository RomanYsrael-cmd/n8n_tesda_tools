  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 The National Qualification of Dental Technology NC IV covers the competency requirements\nfor practicing as a Registered Dental Technologist under the Philippine Dental Act of 2007\n(RA 9484)\n\n4.2 In accordance with Section 13 of Republic Act 9484, examination and licensing of Dental\nTechnologists shall be administered by the Board of Dentistry of the Professional Regulations\nCommission.\n\n4.3 In accordance with Section 14 of Republic Act 9484 and its IRR, applicants for admission to\nthe licensure examination at the time of filing his/her application must be:\n\n4.3.1\nA citizen of the Philippines;\n4.3.2\nOf good moral character;\n4.3.3\nHe/she had finished the two years and six months program certificate in dental\ntechnology conferred by a recognized and legally constituted college, or school of\ndentistry registered with the TESDA;\n4.3.4\nUndergone on –the- job training in a registered/accredited dental laboratory for at\nleast six months; and/or\n\nThose who have failed the PRC examination three times shall take a refresher course in a\nPRC accredited dental school which will be posted in the PRC Application Division and a\ncertificate thereon shall be submitted with the application.\n\n4.4 The core competencies for the following National Qualifications are embedded in the Dental\nTechnology NC IV Qualification.\n\n• Dental Laboratory Technology Services NC I\n• Dental Laboratory Technology Services (Removable Dentures/Appliances) NC II\n• Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II\n\nNational Assessment shall continue to be administered by TESDA for the above\nqualifications. For further details, please refer to the Training Regulations for the above\nqualifications.\n\n--- PDF PAGE 161 ---\nTR Dental Technology NC IV\n\n156\n\n"
}
