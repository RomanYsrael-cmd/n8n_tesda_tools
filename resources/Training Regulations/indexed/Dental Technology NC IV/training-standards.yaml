materials\n\n* Optional\n\n3.5 TRAINING FACILITIES\nDENTAL TECHNOLOGY NC IV\n\nThe Dental Technology Learning Facility must be of concrete structure. Based on class\nsize of 25 students / trainees the space requirements for the teaching / learning and\ncurriculum areas are as follows.\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN S.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nStudent/Trainee Performance Space\n(S/TPS)\n5 X 4\n20\n20\nLearning Resource Center (LRC)\n3 X 5\n15\n15\nCirculation Area\n21\n21\nSeparate Restrooms for Male and\nFemale Trainees/Students\n2 X 5\n10\n10\nTotal Workshop Area\n\n75 sq. m.\n\n3.6 TRAINER QUALIFICATION (TQ IV)\n\nTechnical\n Must be a licensed Dentist with experience in managing dental laboratory or licensed\nDental Technologist\n Must have completed Trainer’s Methodology Course\n Must be a holder of a NC I Dental Laboratory Technology Services, NC II FIXED\nDentures/Restorations AND REMOVABLE Dentures/Appliances\n\nNon-Technical\n Must have 18 units in Education\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of units of\ncompetency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 160 ---\nTR Dental Technology NC IV\n\n155"
