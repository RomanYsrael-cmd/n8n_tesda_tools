    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL TECHNOLOGY\nNC Level: NC IV\n\nNominal Training Hours: 3499 Hours + 1056 Hours OJT*\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and attitudes of a dental\ntechnologist in accordance with industry standards. It covers the fabrication/construction and\nrepair of crowns, bridges, dentures and other dental prosthetics/appliances based on dentist’s\nprescriptions; management functions in dental laboratory production and operation; performing\nadministrative functions; and career advancement through continuous professional growth and\ndevelopment.\nThis course is also designed to enhance the basic and common knowledge, skills and\nattitudes of an individual in the field of dental technology.\nTo obtain this, all units prescribed for this qualification must be achieved.\nThis course satisfies the prescribed two (2) year program and six (6) months on-the-job\ntraining (OJT) of Republic Act 9484.\nPursuant to the provision of Republic Act (RA) 9484, the Dental Technology NC IV program\nshall be registered in Unified Training Program Registration and Accreditation System (UTPRAS)\nto a recognized and legally constituted college, or school of dentistry.\nCompletion of this two-year course that includes six-month on-the-job-training is required for\nthose applying for the PRC licensure exam.\nDental Technology NC IV maybe offered as accumulation of qualifications in Dental\nLaboratory Technology Services NC I, Dental Laboratory Technology Services (Removable\nDentures/Appliances)\nNC\nII\nand\nDental\nLaboratory\nTechnology\nServices\n(Fixed\nDentures/Restorations) NC II and the three units of competency for the laboratory management of\nDental Technology NC IV provided that all the competency requirements for the abovementioned\nqualifications are all complied with. Thus trainees may complete the basic, common and core\ncompetency requirements for Dental Laboratory Technology Services NC I then proceed to Dental\nLaboratory Technology Services (Removable Dentures/Appliances) NC II and Dental Laboratory\nTechnology Services (Fixed Dentures/Restorations) NC II and thereafter proceed to Dental\nTechnology NC IV.\n*Note: The six-month OJT is required for all graduates of this course applying for the Dental\nTechnology licensure, as per the provisions of RA 9484. This OJT component is\nconsidered separate from the two-year Dental Technology NC IV program, as per the\npolicy set by the Board of Dentistry-PRC.\n\n--- PDF PAGE 147 ---\nTR Dental Technology NC IV\n\n142\nBASIC COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n\n1. Receive and\nrespond to\nworkplace\ncommunication\n\n1.1 Follow routine spoken\nmessages\n1.2 Perform workplace\nduties following written\nnotices\n\n• Group discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n2. Work with others\n\n2.1 Develop effective\nworkplace relationship\n2.2 Contribute to work group\nactivities\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n3. Demonstrate work\nvalues\n\n3.1 Define the purpose of\nwork\n3.2 Apply work values/ethics\n3.3 Deal with ethical\nproblems\n3.4 Maintain integrity of\nconduct in the workplace\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n4. Practice\nhousekeeping\nprocedures\n\n4.1 Sort and remove\nunnecessary items\n4.2 Arrange items\n4.3 Maintain work area, tools\nand equipment\n4.4 Follow standardized work\nprocess and procedures\n4.5 Perform work\nspontaneously\n\n• Discussion\n• Plant tour\n• Symposium\n\n• Observation\n• Interview\n5 Participate in\nworkplace\ncommunication\n5.1 Obtain and convey\nworkplace information.\n5.2 Complete relevant work\nrelated documents.\n5.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n6 Work in a team\nenvironment\n6.1 Describe and identify\nteam role and\nresponsibility in a team.\n6.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n7 Practice career\nprofessionalism\n7.1 Integrate personal\nobjectives with\norganizational goals.\n7.2 Set and meet work\npriorities.\n7.3 Maintain professional\ngrowth and\ndevelopment.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n Observation\n• Interviews/\n• Questioning\n\n--- PDF PAGE 148 ---\nTR Dental Technology NC IV\n\n143\n8 Practice\noccupational\nhealth and safety\n8.1\nEvaluate hazard and\nrisks.\n8.2\nControl hazards and\nrisks.\n8.3\nMaintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n9. Utilize specialized\ncommunication\nskills\n5.1 Apply communication\nstrategies to meet\nspecific needs of internal\nand external client.\n5.2 Represent the\norganization in internal\nand external forums\n5.3 Facilitate group\ndiscussion\n5.4 Conduct interview\n• Discussion\nmethod\n• Role Play\n• Brainstorming\n• Lecture\n\n• Written test\n• Performance\ntest\n• Interview\n10. Develop team\nand individual\nneeds\n10.1 Determine development\nneeds.\n10.2 Foster individual and\norganization growth\n10.3 Monitor and evaluate\nworkplace learning\n10.4 Develop team\ncommitment and\ncooperation\n10.5 Facilitate\naccomplishment of\norganizational goals\n• Discussion\n• Role playing\n• Observation\n• Written test\n• Direct\nobservation\n• Role playing\n11. Apply problem\nsolving\ntechniques in the\nworkplace\n11.1 Analyze the problem\n11.2 Identify fundamental\ncause of the problem\n11.3 Determine possible\nsolution\n11.4 Prepare communication\nor documentation report\n11.5 Present\nrecommendation to\nappropriate personnel\n11.6 Implement solution\n• Brainstorming\n• Discussion\n• Case studies\n• Role playing\n• Small\ngroup\nwork\n\n• Written test\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 149 ---\nTR Dental Technology NC IV\n\n144\n12. Collect, analyze\nand organize\ninformation\n12.1 Study information\nrequirements.\n12.2 Process data.\n12.3 Analyze, interpret and\norganize information\ngathered.\n12.4 Present findings/\nrecommendations\n• Group\ndiscussion\n• Case study\n• Interaction\n• Written test\n• Practical/\nperformance\ntest\n13. Plan and\norganize work\n13.1 Set work objectives\n13.2 Plan and schedule\nwork activities\n13.3 Implement and monitor\nplans/activities\n13.4 Review and evaluate\nwork plans and\nactivities\n• Brainstorming\n• Discussion\n• Case studies\n• Role playing\n• Small group\nwork\n• Written test\n• Direct\nobservation\n• Interview\n14. Promote\nenvironmental\nprotection\n14.1 Study guidelines for\nenvironmental\nconcerns.\n14.2 Implement specific\nenvironmental\nprograms\n14.3 Monitor activities on\nenvironmental\nprotection/programs\n• Group\ndiscussion\n• Case study\n• Interaction\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Maintain\ninstruments and\nequipment in work\narea\n1.1\nPrepare to clean dental\nlaboratory instruments\nand work area\n1.2\nClean and dry dental\nlaboratory instruments\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n•Interview\n\n2. Assist in dental\nlaboratory\nprocedures\n\n2.1\nIdentify dental\nlaboratory procedures\n2.2\nUse dental terminology\nin communication\nwithin the health care\nsetting\n\n• Group Discussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance Test\n• Interview\n\n--- PDF PAGE 150 ---\nTR Dental Technology NC IV\n\n145\n3. Assist with\nadministration in\ndental laboratory\npractice\n3.1\nCommunicate\neffectively with clients\nand other persons\n3.2\nRespond appropriately\nto inquiries from clients\nand visitors\n3.3\nAllocate appointments\nappropriate to client\nand organization\nrequirements\n3.4\nCalculate and record\nbasic financial\ntransactions\n3.5\nHandle cash and\nrecord financial\ntransactions\n3.6\nMaintain client records\n\n• Group Discussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance Test\n• Interview\n4 Apply quality\nstandard\n4.1\nAssess quality of\nreceived materials\n4.2\nAssess own work\n4.3\nEngage in quality\nimprovement\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n•Interview\n5. Maintain an\neffective\nrelationship with\nclients and\ncustomers\n5.1\nMaintain a clean and\nhygienic environment.\n5.2\nMeet client/custormer\nrequirements\n5.3\nBuild credibility with\ncustomers/clients\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n6. Manage own\nperformance\n6.1\nPlan for completion of\nown workload.\n6.2\nMaintain quality\nperformance.\n6.3\nBuild credibility with\ncustomers/clients\n\n• Lecturette\n• Brainstroming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n--- PDF PAGE 151 ---\nTR Dental Technology NC IV\n\n146\n\n7. Follow\noccupational health\nand safety policies\nin dental facilities\n\n7.1 Apply workplace\nprocedures for hazard\nidentification and risk\ncontrol\n7.2 Utilize and implement\nstrategies as directed to\nprevent infection in the\nworkplace\n7.3 Work in a safe manner\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n8 Maintain infection\ncontrol in dental\npractice\n8.1 Monitor and maintain the\ncleanliness of the dental\nlaboratory rooms\n8.2 Clean and maintain\ndental instruments and\nequipment\n8.3 Maintain hygiene and\npersonal protection\n8.4 Dispose of dental\nlaboratory waste safely\n8.5 Disinfect and clean\nimpressions\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n9 Operate a personal\ncomputer\n9.1 Start and shut down the\ncomputer\n9.2 Arrange and customize\ndesktop display/window\nsetting\n9.3 Work with files and\nfolders (or directories)\n9.4 Work with user\napplication programs\n9.5 Print information\n\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n• Written Exam\n\n--- PDF PAGE 152 ---\nTR Dental Technology NC IV\n\n147\nCORE COMPETENCIES\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n\n1 Fabricate models\n\n1.1 Verify integrity of\nimpressions\n1.2 Select and prepare model\nmaterials\n1.3 Pour impressions\n1.4 Finish model\n1.5 Duplicate model\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n2 Fabricate custom\nimpression trays\n\n2.1 Prepare model\n2.2 Select and prepare\nmaterials\n2.3 Fabricate custom\nimpression trays\n\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n3 Fabricate\nregistration bite\nrims\n3.1 Select and prepare\nmaterials\n3.2 Fabricate base\n3.3 Fabricate registration bit\nrims\n3.4 Prepare face-bow (if\nrequired)\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n\n4 Articulate models\nand transfer\nrecords\n4.1 Select and prepare\narticulator\n4.2 Select and prepare\nmaterials\n4.3 Transfer oral records to\narticulator\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n\n5 Fabricate\nmouthguard\n5.1 Prepare model for\nprocedure\n5.2 Check the dental\nmouthguard prior to\ninsertion\n5.3 Fit and evaluate the\nmouthguard\n5.4 Alter mouthguard if\nrequired\n• Discussion/\nDemonstration\n• Written\nExamination\n• Demonstration\n• Observation\n6 Arrange artificial\nteeth for complete\ndentures\n6.1 Prepare case for setting\nof teeth\n6.2 Arrange artificial teeth\n6.3 Wax up denture for try-in\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n\n--- PDF PAGE 153 ---\nTR Dental Technology NC IV\n\n148\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n7\nSet-up and wax\nremovable partial\ndentures\n7.1 Design acrylic removable\npartial denture\n7.2 Select and prepare\nmaterials\n7.3 Arrange artificial teeth\n7.4 Fabricate retainer units\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n\n8\nWax, process and\nfinish acrylic\ndentures and\nappliances\n8.1 Wax case for finish\nconsistent with work\norder\n8.2 Select and prepare\nmaterials and processing\n8.3 Process denture or\nappliance\n8.4 Grind dentures and\nappliances selectively\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexamination\n• Observation\n• Questioning\n9\nFabricate thermo-\nformed bases and\nappliances\n9.1 Prepare model\n9.2 Thermo-form appliance or\nbase\n9.3 Trim, shape and finish\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n10 Repair and\nmodify dentures\nand appliances\n10.1 Prepare case\n10.2 Prepare model\n10.3 Repair denture or\nappliance\n10.4 Modify denture or\nappliance, where\nrequired\n10.5 Trim, shape and finish\ndenture or appliance\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n11. Fabricate oral\nsplints\n\n11.1 Fabricate splint\n11.2 Trim, shape and finish\n\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n12. Fabricate\northodontic\nappliances\n12.1 Select or fabricate and\nassemble components\nand materials\n12.2 Fabricate orthodontic\nappliance\n12.3 Finish orthodontic\nappliance\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 154 ---\nTR Dental Technology NC IV\n\n149\nUNIT OF\nCOMPETENCY\nLEARNING O