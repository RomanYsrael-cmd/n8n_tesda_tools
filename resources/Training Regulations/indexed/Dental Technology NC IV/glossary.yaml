  "source_text": "ABUTMENT\n-\nTooth or teeth that support a fixed or removable bridge\nANTERIOR TEETH\n-\nthe six upper or six lower front teeth (canines, laterals & central incisors)\nAPEX\n-\nthe tip of the root of a tooth\nARCH\n-\ndescribes the alignment of the upper or lower teeth\nARTICULATE\n-\nto unite by forming a joint or joints\nARTICULATOR\n-\na mechanical device representing the temporomandibular joints and jaw\nmembers to which casts of the mouth\nBASE\n-\ncement placed under a dental restoration to insulate the pulp (nerve\nchamber)\nBITE\n-\nrelationship of the upper and lower teeth on closure (occlusion)\nBONDING\n-\nadhesive dental restoration technique; a tooth-colored composite resin to\nrepair and/or change the color or shape of a tooth\nBRACES\n-\ndevices used by orthodontists to gradually reposition teeth to a more\nfavorable alignment\nBRIDGE\n-\nstationary dental prosthesis (appliance) fixed to teeth adjacent to a space;\nreplaces one or more missing teeth, cemented or bonded to supporting\nteeth or implants adjacent to the space\nCANTILEVER BRIDGE\n-\nfixed bridge that attaches to adjacent teeth only on one end\nCAP\n-\ncommon term for dental crown\nCLASP\n-\ndevice that retains a removable partial denture to stationary teeth; can be\nmetal or acrylic (matches teeth and gums)\nCROSS BITE\n-\nreverse biting relationship of upper and lower teeth; aka \"under bite,\" as in\nClass III malocclusuion (prognathic jaw)\nCROWN\n\n(1) the portion of a tooth above the gum line;\n(2) dental restoration covering all or most of the natural tooth\nCUSTOM IMPRESION\nTRAY\n-\nan impression tray made from a preliminary impression used to make the\nfinal impression\nDENTAL WAXES\n-\n wax compounds used in dentistry are mixtures of individual waxes of\nmaterials or synthetic origin. As with all other dental materials, each\ncomponent n the mixture is selected to given specific properties best suited\nfor the procedure being performed\nDENTURE\n-\nremovable (partial or complete) set of artificial teeth\nDIASTEMA\n-\nopen space between teeth\nDISTAL\n-\nfarthest from any point of reference\nDUPLICATE\n-\nidentically copied from an original\nFABRICATE\n-\nto make; create; to construct by combining or assembling\nFACE-BOW FORK\n-\na device used to attach the face-bow to an occlusion rim for a face-bow\ntransfer\nFACING\n-\ntooth colored overlay on the visible portion of a crown; may be acrylic,\ncomposite or porcelain\n\n--- PDF PAGE 165 ---\nTR Dental Technology NC IV\n\n 160\n\nFILLING\n-\nrestoration of lost tooth structure with metal, porcelain or resin materials\nFULL DENTURE\n-\nremovable dental prosthesis (appliance) replacing all upper or lower teeth\nFULL MOUTH\nRECONSTRUCTION\n-\nextensive restorations of natural teeth with crowns and or fixed bridges to\nmanage restorative and bite problems.\nGYPSUM\n-\nis the common name for calcium sulfate dehydrate. Gypsum products are\nmore frequently used on laboratory procedures than any other single group\nof compounds. Controlled variations in the manufacturing of gypsum\nproducts yield a group of dental materials including plaster, artificial stone\n(hydrosol), disc stone, casting investment and soldering investment\nIMPRESSION\n-\nmold made of the teeth and soft tissues\nINLAY\n-\nindirect – filling made by a dental laboratory that is cemented or bonded\ninto place,\ndirect – placement of dental composite resin, or porcelain restoration at\nchair side\nINTEROCCLUSAL\n-\nspace between upper and lower teeth\nJACKET\n-\ncrown for a front tooth, usually made of porcelain\nLAMINATE\n-\nthin plastic or porcelain veneer produced in a dental laboratory and then\nbonded to a tooth\nMALOCCLUSION\n-\n“bad bite” or misalignment of the upper and lower teeth\nMARGIN\n-\ninterface between a restoration and tooth structure\nMARYLAND BRIDGE\n-\na bridge that is bonded to the back of the adjacent teeth; requires minimum\ntooth reduction\nMODEL\n-\na material used extensively for making impressions. It contains shellac, talc,\nglycerin, wax, tallow and palm oil\nOVERBITE\n-\nvertical overlap of the front teeth; deep bite\nPARTIAL DENTURE\n-\nremovable dental prosthesis (appliance) replacing one or more natural\nteeth\nPONTIC\n-\nreplacement tooth mounted on a fixed or removal appliance\nPORCELAIN CROWN\n-\nall porcelain restoration covering the coronal portion of tooth (above the\ngum line)\nPORCELAIN FUSED TO\nMETAL (PFM) CROWN\n-\nrestoration with metal coping (for strength) covered by porcelain (for\nappearance)\nPORCELAIN INLAY OR\nONLAY\n-\ntooth-colored restoration made of porcelain, cemented or bonded in place\nPORCELAIN VENEERS\n-\na thin layer of porcelain, fabricated by a laboratory) bonded to a natural\ntooth to replace lost tooth structure, close spaces, straighten teeth or\nchange color and/or shape\nPROSTHESIS\n\nan artificial appliance for the replacement for a body part, tooth or teeth\nSOLDERING\nINVESTMENT\n-\na soldering investment is similar in composition to a casting investment that\nhas a\nSPLINT\n-\nconnection of two or more teeth so they function as a stronger single\nstructure\n\n--- PDF PAGE 166 ---\nTR Dental Technology NC IV Promulgated",
