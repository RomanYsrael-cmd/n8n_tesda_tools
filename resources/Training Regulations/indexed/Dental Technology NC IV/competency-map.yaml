  "source_text": "COMPETENCY MAP – HEALTH CARE SECTOR (DENTAL TECHNOLOGY NC IV)\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with others\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop teams\nand individuals\nApply problem\nsolving\ntechniques in\nthe workplace\nCollect, analyze\nand organize\ninformation\nPlan and organize\nwork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond\neffectively to\ndifficult/challenging\nbehavior\nApply basic first\naid\nMaintain high\nstandard of\npatient services\nProcess reusable\ninstruments and\nequipment in\nhealth work\nPrepare for and\nassist with oral\nhealth care\nprocedures\nAssist in dental\nlaboratory\nprocedures\nAssist with\nadministration in\ndental practice\nMaintain an\neffective\nrelationship with\ncustormers and\nclients\nManage own\nperformance\nFollow\noccupational\nhealth and\nsafety policies in\ndental practice\nMaintain infection\ncontrol in dental\npractice\nMaintain\ninstruments and\nequipment in\nwork area\nApply quality\nstandards\n\nOperate a personal\ncomputer\n\n--- PDF PAGE 162 ---\nTR Dental Technology NC IV\n\n157\n\nCORE COMPETENCIES\n\nProvide care and\nsupport to infants and\ntoddlers\nProvide care and\nsupport to children\nFoster social,\nintellectual,\ncreative and\nemotional\ndevelopment of\nchildren\nFoster the\nphysical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people\nwith special\nneeds\nMai