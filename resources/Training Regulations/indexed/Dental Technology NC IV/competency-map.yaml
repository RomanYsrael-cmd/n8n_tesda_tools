te\nregistration bite\nrims\nArticulate models\nand transfer\nrecords\nFabricate\nmouthguard\nArrange artificial\nteeth for\ncomplete\ndentures\nSet up and wax\nremovable partial\ndentures\nWax, process and\nfinish acrylic\ndentures and\nappliances\nFabricate thermo\nformed bases and\nappliances\nRepair and\nmodify dentures\nand appliances\nFabricate oral\nsplints\nFabricate\northodontic\nappliances\nFabricate cast\nmetal removable\npartial denture\nframework\nFabricate ceramic\nrestorations\nFabricate metal\ncrown and bridge\nstructures\nFabricate indirect\ncomposite/polymer\nfixed restorations\nJoin alloy\nstructures\nPerform\nadministrative\nfunctions\nManage dental\nlaboratory\nproduction and\noperations\nContinue\nprofessional\ngrowth and\ndevelopment\n\n--- PDF PAGE 164 ---\nTR Dental Technology NC IV\n\n 159",
