  "source_text": "SECTION 1 DENTAL TECHNOLOGY NC IV\n\nThis DENTAL TECHNOLOGY NC IV covers the fabrication/construction and repair of\ncrowns, bridges, dentures and other dental prosthetics/appliances based on dentist’s\nprescriptions.\n\nThe Units of Competency comprising this qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311101\nReceive and respond to workplace communication\n500311102\nWork with others\n500311103\nDemonstrate work values\n500311104\nPractice basic housekeeping procedures\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n500311115\nUtilize specialized communication skills\n500311116\nDevelop teams and individuals\n500311117\nApply problem solving techniques in the workplace\n500311118\nCollect, analyze and organize information\n500311119\nPlan and organize work\n500311120\nPromote environmental protection\n\nUNIT CODE\nCOMMON COMPETENCIES\nHCS346201\n Maintain instruments and equipment in work area\nHCS346202\n Assist in dental laboratory procedures\nHCS346203\n Assist with administration in dental laboratory practice\nHCS315202\n Apply quality standards\nHCS516201\nMaintain an effective relationship with customers and clients\nHCS516202\nManage own performance\nHCS346204\nFollow occupational health and safety policies in dental laboratory\nfacilities\nHCS346205\nMaintain infection control in dental practice\nICT311201\nOperate a personal computer\n\n--- PDF PAGE 6 ---\nTR Dental Technology NC IV\n\n2\n\nUNIT CODE\nCORE COMPETENCIES\nHCS322323\nFabricate models\nHCS322324\nFabricate custom impression trays\nHCS322325\nFabricate registration bite rims\nHCS322326\nArticulate models and transfer records\nHCS322327\nFabricate mouthguard\nHCS322328\nArrange artificial teeth for complete dentures\nHCS322329\nSet-up and wax removable partial dentures\nHCS322330\nWax, process and finish acrylic dentures and appliances\nHCS322331\nFabricate thermo formed bases and appliances\nHCS322339\nRepair and modify dentures and appliances\nHCS322332\nFabricate oral splints\nHCS322333\nFabricate orthodontic appliances\nHCS322334\nFabricate cast metal removable partial denture framework\nHCS322335\nFabricate metal crown and bridge structures\nHCS322336\nFabricate ceramic restorations\nHCS322337\nFabricate indirect composite/polymer fixed restorations\nHCS322338\nJoin alloy structures\nHCS322340\nManage dental laboratory production and operation\nHCS322341\nPerform administrative functions\nHCS322342\nContinue professional growth and development\n\nOccupational/Job titles corresponding to this qualification may include:\n\n Dental Technologist\n Dental Lab Technical Services Supervisor\n\nThe national practice of this qualification requires a license from the Board of Dentistry –\nProfessional Regulations Commission.\n\n--- PDF PAGE 7 ---\nTR Dental Technology NC IV\n\n3"
