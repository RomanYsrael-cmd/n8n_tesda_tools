ce is monitored\n4.3\nDeviations from work activities are reported and\nrecommendations are coordinated with appropriate personnel\nand in accordance with set standards\n4.4\nReporting requirements are complied with in accordance with\nrecommended format\n4.5\nObserve timeliness of report\n4.6\nFiles are established and maintained in accordance with\nstandard operating procedures\n\n--- PDF PAGE 48 ---\nTR Dental Technology NC IV\n\n44\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5.\nReview and evaluate\nwork plans and\nactivities\n5.1\nWork plans, strategies and implementation are reviewed\nbased on accurate, relevant and current information\n5.2\nReview is based on comprehensive consultation with\nappropriate personnel on outcomes of work plans and reliable\nfeedback\n5.3\nResults of review are provided to concerned parties and\nformed as the basis for adjustments/simplifications to be made\nto policies, processes and activities\n5.4\nPerformance appraisal is conducted in accordance with\norganization rules and regulations\n5.5\nPerformance appraisal report is prepared and documented\nregularly as per organization requirements.\n5.6\nRecommendations are prepared and presented to\nappropriate personnel/authorities\n5.7\nFeedback mechanisms are implemented in line with\norganization policies\n\n--- PDF PAGE 49 ---\nTR Dental Technology NC IV\n\n45\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Objectives\n1.1. Specific\n1.2. General\n2. Resources\n2.1. Personnel\n2.2. Equipment and technology\n2.3. Services\n2.4. Supplies and materials\n2.5. Sources for accessing specialist advice\n2.6. Budget\n3. Schedule of work activities\n3.1. Daily\n3.2. Work-based\n3.3. Contractual\n3.4. Regular\n3.5. Confidential\n3.6. Disclosure\n3.7. Non-disclosure\n4. Work methods and\npractices\n4.1. Work methods and practices may include but not limited\nto:\n4.2. Legislated regulations and codes of practice\n4.3. Industry regulations and codes