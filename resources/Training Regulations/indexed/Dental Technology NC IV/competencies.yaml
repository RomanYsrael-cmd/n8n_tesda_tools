        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFollowed safe handling, drying and cleaning protocols\n1.2\nFollowed correct packing, assembly and wrapping procedures\nand storage\n1.3\nFollowed appropriate OH&S procedures\n2. Underpinning\nknowledge\n2.1\nWorkflow protocols in the instrument reprocessing area\n2.2\nWorkplace procedures for using an ultrasonic cleaner\n2.3\nWorkplace procedures for manual cleaning\n2.4\nInstrument maintenance checklists\n3. Underpinning skills\n3.1\nFollowing safe work practices and applying standard\nprecautions during cleaning and preparation of items:\n3.1.1 checking items for defects after cleaning\n3.1.2 selecting and safely using appropriate cleaning agents\n3.1.3 selecting and wearing appropriate personal protective\nequipment\n3.2\nMaintaining workflow protocols in instrument reprocessing\narea from contaminated to clean and disinfect\n3.3\nOperating mechanical cleaners including ultrasonic cleaner or\nsteamer\n3.4\nDrying items before packaging\n3.5\nStoring packaged items in a clean place away from sources of\nmoisture and contamination\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 59 ---\nTR Dental Technology NC IV\n\n55\n\nUNIT OF COMPETENCY:\nASSIST IN DENTAL LABORATORY PROCEDURES\nUNIT CODE:"
        },
        "source_text": "HCS346201\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in\nmaintaining instruments and equipment in the work area.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to clean\nused items\n\n1.1\nSafe work practices and standard precautions are followed\nat all times in accordance with legislative and workplace\nguidelines.\n1.2\nSharps and sharps debris are disposed into a container and in\naccordance with workplace guidelines.\n1.3 Waste is segregated and disposed in accordance with\norganization and legislative guidelines.\n2. Clean and dry used\nitems\n2.1\nWorkflow protocols are maintained in instrument\nreprocessing area and in accordance with workplace\nguidelines.\n2.2\nInstruments are prepared for cleaning and in accordance\nwith workplace guidelines.\n2.3\nAppropriate cleaning agents are selected and used in\naccordance with workplace guidelines and manufacturer’s\nspecification.\n2.4\nCleaning methods that avoid the generation of aerosols are\nused in accordance with workplace guidelines.\n2.5\nInstruments are dried and inspected for damage and\nremaining debris and in accordance with workplace\nprocedures.\n2.6\n Cleaning process is monitored in accordance with\nworkplace guidelines.\n3. Prepare and pack\nitems for storage\n\n3.1 Instruments with hinges or ratchets are opened and unlocked\nin accordance with standard operating procedures.\n3.2\nInstrument trays are prepared in accordance with workplace\nprotocols.\n3.3\nCritical site instruments are packaged or wrapped in a\nmanner that prevents damage to delicate items.\n\n--- PDF PAGE 56 ---\nTR Dental Technology NC IV\n\n52\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safe work practices\n\nMay include but are not limited to:\n1.1\nTreatment of all items as a potential source of infection\n1.2\nPersonal hygiene practices especially washing and drying\nhands\n1.3\nWork practices for the safe handling of sharps\n1.4\nWork practices for the safe disposal of sharps and other\nclinical waste\n1.5\nThe use of personal protective equipment:\n1.5.1 heavy duty gloves\n1.5.2 mask and protective eyewear\n1.5.3 hair protection or covering\n1.5.4 protective clothing and safety footwear\n1.6 Safe handling, storage and disposal of chemicals\n1.7 Safe handling techniques especially as they relate to lifting\nand handling dangerous and contaminated items\n2. Legislative and\nworkplace guidelines\nMay include:\n2.1 Infection control guidelines for the transmission of infectious\ndiseases in the health care setting\n2.2\nState legislative requirements\n2.3\nOrganization infection control policies and procedures\n2.4\nOccupational Health and Safety policies and procedures\n2.5\nMaterial Safety Data Sheets for the chemicals used\n3. Waste\nMay include but is not limited to:\n3.1\nClinical waste:\n3.1.1 discarded sharps\n3.1.2 human tissues\n3.1.3 laboratory waste\n3.1.4 any other waste as specified by the workplace\n3.2\nRelated waste:\n3.2.1 radiographic waste\n3.2.2 chemical waste\n3.2.3 metal alloy waste\n3.3\nGeneral waste\n4. Disposal of waste\nrequirements\nMay include:\n4.1\nDisposal in accordance with:\n4.1.1 Environment Protection Policy (Waste Management)\n4.1.2 Environment Protection Regulations (Waste\nManagement)\n4.2\nOrganization policy\n5. Work flow protocols\nMay include:\n5.1\nSeparate hand washing facilities\n5.2\nSink suitable for disposal of liquid waste\n5.3\nOne direction flow of instruments from contaminated to clean\nto sterile\n5.4\nDesignated work area that is physically separate to prevent\npossible contamination of processed items\n5.5\nIdentification and reporting of disruptions to work flow\nprotocols in accordance with workplace procedures\n\n--- PDF PAGE 57 ---\nTR Dental Technology NC IV\n\n53\n\nVARIABLE\nRANGE\n6. Preparation of\ninstruments for\ncleaning\n\nMay include:\n6.1\nSorting according to type of instrument and corresponding\ncleaning method\n6.2 Written procedures for handling specialized items\n6.3\nDisassembly of instruments where possible for detergent to\nreach all surfaces\n6.4 Checking for instrument defects, damage and missing parts\n7. Selection and use of\nappropriate cleaning\nagents\nMay include:\n7.1 Meeting requirements of Product Data Bulletins and Materials\nSafety Data Sheets for the chemicals used\n8. Cleaning methods\nMay include:\n8.1 Initial treatment of used instruments close to their point of use\nto decrease bio burden\n8.2 Thermal washer/disinfector in accordance with current\nstandards\n8.3\nUltrasonic cleaner in accordance with current standards\n8.4\nManual cleaning\n9. Monitoring the\ncleaning process\nMay include:\n9.1 Visual inspection of all items for cleanliness and absence of\ndetergent or rinse additive residues\n9.2 Daily cleaning and maintenance of ultrasonic cleaner and\nwasher/disinfector\n9.3\nDaily performance testing of ultrasonic cleaner\n9.4\nDaily checks of washer/disinfector function and detergent\ndispenser\n10. Critical site\ninstruments\nMay include:\n10.1 Instruments which must be cleaned and disinfected as\nneeded\n11 Routine cleaning and\nchecking of\nsterilizers\nMay include but is not limited to:\n11.1 Daily checks:\n11.1.1 floor of sterilizer is free of debris\n11.1.2 chamber drain and filter are clear\n11.1.3 recording devices, gauges and timers are functioning\ncorrectly\n11.1.4 water reservoir (portable benchtop sterilizers) emptied,\ncleaned and refilled with distilled water\n11.1.5 door seals are intact\n11.2 Cleaning:\n11.2.1 loading tray and external surfaces cleaned daily\n\n--- PDF PAGE 58 ---\nTR Dental Technology NC IV\n\n54\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFollowed safe handling, drying and cleaning protocols\n1.2\nFollowed correct packing, assembly and wrapping procedures\nand storage\n1.3\nFollowed appropriate OH&S procedures\n2. Underpinning\nknowledge\n2.1\nWorkflow protocols in the instrument reprocessing area\n2.2\nWorkplace procedures for using an ultrasonic cleaner\n2.3\nWorkplace procedures for manual cleaning\n2.4\nInstrument maintenance checklists\n3. Underpinning skills\n3.1\nFollowing safe work practices and applying standard\nprecautions during cleaning and preparation of items:\n3.1.1 checking items for defects after cleaning\n3.1.2 selecting and safely using appropriate cleaning agents\n3.1.3 selecting and wearing appropriate personal protective\nequipment\n3.2\nMaintaining workflow protocols in instrument reprocessing\narea from contaminated to clean and disinfect\n3.3\nOperating mechanical cleaners including ultrasonic cleaner or\nsteamer\n3.4\nDrying items before packaging\n3.5\nStoring packaged items in a clean place away from sources of\nmoisture and contamination\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 59 ---\nTR Dental Technology NC IV\n\n55\n\nUNIT OF COMPETENCY:\nASSIST IN DENTAL LABORATORY PROCEDURES\nUNIT CODE:"
