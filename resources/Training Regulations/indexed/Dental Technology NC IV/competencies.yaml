        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidences that the candidate:\n1.1 Demonstrated knowledge of organizational and/or industry\nprofessional development requirements on dental laboratory skills\nand technologies\n1.2 Planned support systems and resources requirements, effective\naction planning skills to provide quality career development service\ndelivery relevant to dental technology\n1.3 Applied and maintained career development standards and\ncompetence to all aspects of work role\n1.4 Participated in continuing professional education program\n1.5 Improved professional practices through the use of continuous\nimprovement techniques and processes\n1.6 Established basis for career advancement\n2. Underpinning\nKnowledge\n2.1 Principles and techniques of measuring performance and self-\nassessment\n2.2 Concepts of career development and management\n2.3 Range of career development strategies and plans\n2.4 Development needs analysis techniques\n2.5 Relevant competency standards and training programs on dental\ntechnology\n2.6 Range of evaluation methodologies\n2.7 Organizational policies and procedures, particularly in relation to\nemployment, career planning and progression\n2.8 Organizational and professional procedures, practices and social,\nethical and business standards\n2.9 Economic environmental trends\n2.10 Limitations of work role, responsibility and professional abilities\n2.11 Equal employment opportunity (EEO), equity and diversity principles\n2.12 Legislation and statutory requirements\n3. Underpinning\nSkills\n3.1 Monitoring own performance and identifying and prioritizing any\npersonal development needs\n3.2 Creating a personal professional development plan\n3.3 Identifying ways to improve performance\n3.4 Accessing learning opportunities to extend own personal work\ncompetencies\n3.5 Developing and expanding professional networks and participate in\npositive relationship building to further enhance skills and knowledge\n3.6 Setting career goals and evaluating alternative career paths\n3.7 Working effectively with teams and groups\n3.8 Accurately completing appropriate documentation\n\n--- PDF PAGE 145 ---\nTR Dental Technology NC IV\n\n140\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Computer hardware with peripherals\n4.2 Appropriate software\n4.3 Forms, materials and equipment\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation or demonstration with oral questioning\n to the candidate in pursuing professional development in dental\ntechnology\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace environment\n\n--- PDF PAGE 146 ---\nTR Dental Technology NC IV\n\n141"
        },
        "source_text": "HCS322342\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required to\ncontinue professional growth and development in line with dental\nlaboratory production and operations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Keep abreast of laboratory\nskills and technologies\n2.1 Training objectives and activities are developed based\non considered assessment of existing individual and team\ncompetencies, potential competency and career\naspirations according to standards, policies and\nprocedures\n2.2 Personal professional development plan relevant to\ndental technology is designed and identified needs and\nobjectives are reflected in accordance with organizational\nrequirements\n2.3 Personal development strategies suitable to individual\nlearning are selected and used to maintain currency of\nprofessional development and competence\n24 Personal performance and progress is reviewed to\ndetermine the efficiency and effectiveness of own\nprofessional development and competence\n2.5 Information regarding competency development is\ndocumented and maintained in accordance with\norganizational requirements\n2. Improve professional\npractices\n2.1 Professional networks and associations are\nparticipated in to identify and build relationships to provide\nbenefit and positive outcomes for individuals and the\norganization\n2.2 New developments and trends across the dental industry\nsector are identified and the associated knowledge and\nskills acquired are applied to improve current processes\nand practices\n2.3 Ethical behaviors and competent performance is\ndeveloped to maintain positive relationships with relevant\npersons\n2.4 Development opportunities for improving professional\npractices and services are identified through the use of\ncontinuous improvement techniques and processes\n3. Establish basis for career\nadvancement\n3.1 Training certificates and recognitions are\nsought/received and demonstrated as proof of professional\nexpertise and career advancement\n3.2 Licenses and/or certifications relevant to job and career\nare obtained and renewed\n3.3 Relevant support resources and technology are used\nto ensure they support quality outcomes for career\ndevelopment services\n\n--- PDF PAGE 142 ---\nTR Dental Technology NC IV\n\n137\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Training objectives\nMay include but are not limited to:\n1.1 Existing staff competencies\n1.2 Level of competencies required by staff\n1.3 Budget allocation for staff training\n1.4 Varying levels of staff training\n2. Personal professional\ndevelopment plan relevant\nto dental technology\nMay include but is not limited to:\n2.1 Capability build-up program on:\n2.1.1 Concepts and Principles on Dental Technology\n2.1.2 Code of Conduct and Ethics\n2.2 Advocacy of professional standards, coaching, mentoring and\nconflict resolution\n2.3 Industry immersion (Participation)\n2.4 Educating clients/general public\n3. Personal development\nstrategies\nMay include but are not limited to:\n3.1 Short course or qualification base training\n3.2 Interpersonal/technical skills development\n3.3 Updating stress management abilities\n3.4 Adapting work rotation to facilitate changing personal/work\npriorities\n3.5 Formal/informal learning programs\n3.6 Utilization of existing strengths to focus future career\ndevelopment\n3.7 Coaching, mentoring and/or supervision\n3.8 Establishment of new career paths\n3.9 Promote individual ethics and integrity\n3.10 Improve workplace performance resulting from adaptation to\nnew technologies/organizational climates, acquisition of new\nskills, adaptation of new work practices\n3.11 Facilitate and encourage the development and maintenance\nof high levels of professionalism\n4. Professional networks and\nassociations\nMay include but are not limited to:\n4.1 PRC – accredited professional organizations\n4.2 Philippine Dental Association\n4.3 National Association of Dental Prosthetic Laboratories, Inc.\n5. Ethical behaviors\nMay include but is not limited to:\n5.1 Compliance with industry codes of practice\n5.2 Compliance with legislative and regulatory requirements\n5.3 Compliance with client instructions and agency requirements\n5.4 Avoiding conflicts of interest\n5.5 Disclosure of all fees, charges, commissions, special interests\nand relationships relevant to a clients financial plan\n5.6 Organizational standards\n\n--- PDF PAGE 143 ---\nTR Dental Technology NC IV\n\n138\n\nVARIABLE\nRANGE\n6. Development opportunities\nMay include but are not limited to:\n6.1 Action learning\n6.2 Coaching\n6.3 Exchange/rotation\n6.4 Induction\n6.5 Mentoring\n6.6 Structured training programs\n7. Training certificates and\nrecognitions\nMay include but are not limited to:\n7.1 Participation in training programs\n7.1.1 Technical\n7.1.2 Supervisory\n7.1.3 Managerial\n7.1.4 Continuing Education\n7.2 Serving as Resource Persons in conferences and workshops\n7.3 Recognitions\n7.3.1 Recommendations\n7.3.2 Citations\n7.3.3 Certificates of Appreciations\n7.3.4 Commendations\n7.3.5 Awards\n7.3.6 Tangible and Intangible Rewards\n8. Licenses and/or\ncertification\nMay include but is not limited to:\n8.1 National Certificates\n8.2 Certificate of Competency\n8.3 Support Level Licenses\n8.4 Professional Licenses\n9. Relevant support\nresources and technology\nMay include but are not limited to:\n9.1 Career information and support materials\n9.2 Communication technologies, such as telephones and email\n9.3 Electronic and information technology\n9.4 Meeting rooms and facilities\n9.5 Physical support services\n10. Quality outcomes for\n career development\n services\nMay include but are not limited to:\n10.1 Capacity to offer a range of choice and advice\n10.2 Careers counseling\n10.3 Compliance with regulatory, professional and\n organizational standards\n10.4 Effective conflict resolution/mediation\n10.5 Industry’s advocacy, enterprising and mentoring\n skills\n10.6 Relevance, currency and appropriateness of\n services provided to individuals\n10.7 Satisfaction of needs associated with a specific context and\ntarget group\n\n--- PDF PAGE 144 ---\nTR Dental Technology NC IV\n\n139\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidences that the candidate:\n1.1 Demonstrated knowledge of organizational and/or industry\nprofessional development requirements on dental laboratory skills\nand technologies\n1.2 Planned support systems and resources requirements, effective\naction planning skills to provide quality career development service\ndelivery relevant to dental technology\n1.3 Applied and maintained career development standards and\ncompetence to all aspects of work role\n1.4 Participated in continuing professional education program\n1.5 Improved professional practices through the use of continuous\nimprovement techniques and processes\n1.6 Established basis for career advancement\n2. Underpinning\nKnowledge\n2.1 Principles and techniques of measuring performance and self-\nassessment\n2.2 Concepts of career development and management\n2.3 Range of career development strategies and plans\n2.4 Development needs analysis techniques\n2.5 Relevant competency standards and training programs on dental\ntechnology\n2.6 Range of evaluation methodologies\n2.7 Organizational policies and procedures, particularly in relation to\nemployment, career planning and progression\n2.8 Organizational and professional procedures, practices and social,\nethical and business standards\n2.9 Economic environmental trends\n2.10 Limitations of work role, responsibility and professional abilities\n2.11 Equal employment opportunity (EEO), equity and diversity principles\n2.12 Legislation and statutory requirements\n3. Underpinning\nSkills\n3.1 Monitoring own performance and identifying and prioritizing any\npersonal development needs\n3.2 Creating a personal professional development plan\n3.3 Identifying ways to improve performance\n3.4 Accessing learning opportunities to extend own personal work\ncompetencies\n3.5 Developing and expanding professional networks and participate in\npositive relationship building to further enhance skills and knowledge\n3.6 Setting career goals and evaluating alternative career paths\n3.7 Working effectively with teams and groups\n3.8 Accurately completing appropriate documentation\n\n--- PDF PAGE 145 ---\nTR Dental Technology NC IV\n\n140\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Computer hardware with peripherals\n4.2 Appropriate software\n4.3 Forms, materials and equipment\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation or demonstration with oral questioning\n to the candidate in pursuing professional development in dental\ntechnology\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace environment\n\n--- PDF PAGE 146 ---\nTR Dental Technology NC IV\n\n141"
