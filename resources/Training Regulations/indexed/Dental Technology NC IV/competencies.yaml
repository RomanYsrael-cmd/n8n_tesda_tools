nage facilities in a dental laboratory environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Supervise laboratory\ntechnicians\n\n1.1 Staffing patterns and staffing performance involving dental\nlaboratory operation are maintained and monitored in\naccordance with standards, policies and procedures\n1.2 Staffing plan is maintained involving dental laboratory\noperation following standards, policies and procedures\n1.3 Staff turnover problems are identified, analyzed and rectified\nas required in accordance with standards, policies and\nprocedures\n1.4 Performance appraisal and counseling are conducted as\nrequired according to standards, policies and procedures\n1.5 Performance and achievement is recognized and individuals\nare encouraged to contribute to their own assessment and in\nimproving policies and procedures\n1.6 Staff dismissals are implemented in accordance with\nstandards, policy and procedures and statutory\nrequirements\n1.7 Details of all procedures are accurately and completely\nrecorded and made available to authorized personnel\n2. Manage dental\nlaboratory maintenance\nprogram\n2.1 Premises, fittings, fixtures and equipment are monitored and\nmaintained according to standards, policies and procedures\n2.2 Deficiencies in dental laboratory maintenance procedures\nare identified and remedial action is taken as required\naccording to standards, policies and procedures\n2.3 Maintenance program on dental equipment is monitored and\nimplemented according to manufacturer’s designs and\nspecifications\n2.4 Maintenance procedures are monitored to ensure products\nand tasks meet the required specifications\n2.5 Equipment faults or failures are reported according to\nservice agreements, standards, policies and procedures\n3. Manage dental\nlaboratory facilities and\nspace requirements\n3.1 Facilities and space requirements are identified according to\nstandards, policy and procedures\n3.2 Suitable facilities and space are located following standards,\npolicies and procedures\n3.3 Space utilization is maximized with considerations to\nexisting configuration\n\n--- PDF PAGE 132 ---\nTR Dental Technology NC IV\n\n127\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Comply with dental\nethics and jurisprudence\n4.1 Key elements of major legal systems affecting business to\ndental laboratory operations are examined to ensure full\ncompliance under legal and legislative provisions\n4.2 Various issues affecting different forms of contract are\ncompared within business operations\n4.3 Statutory and legal requirements for the sale of products\nand services are determined across the industry\n4.4 Dental products are handled and stored according to\nstandards, policies and procedures, and safety practices\n4.5 Purchase of dental products and laboratory supplies and\nmaterials are made in accordance with legal requirements\nand established procedures.\n4.6 Compliance of current product are monitored in accordance\nwith statutory and legal requirements\n\n--- PDF PAGE 133 ---\nTR Dental Technology NC IV\n\n128\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Standards, policies and\nprocedures\n\nMay include but are not limited to:\n1.1 Staffing\n1.2 Staffing performance and evaluation\n1.3 Employee relations and staff development\n1.4 Maintenance\n1.5 Facilities management\n1.6 Reporting mechanism\n1.7 Occupational Health and Safety (OHS)\n1.8 Dept. of Health (DOH- BFHS)\n2. Statutory requirements\nMay include but are not limited to:\n2.1 Equal Employment Opportunity (EEO) policies\n2.2 Disciplinary procedures\n2.3 Awards and agreements\n2.4 Wages and conditions\n2.5 OHS\n2.6 Anti-discrimination\n2.7 Company policies and procedures\n3. Dental laboratory\nmaintenance\nMay include but are not limited to:\n3.1 Facilities maintenance\n3.2 Equipment maintenance\n3.3 Maintenance contract terms and options\n3.4 OHS legislation and codes of practice\n3.4.1\nHandling and storage of goods\n3.4.2 Waste management\n3.5 Standards, policy procedures\n4. Legal systems\nMay include but are not limited to:\n4.1 Workplace relations\n4.2 Industry codes and practices\n4.3 License, patent or copyright arrangements\n5. Legal and legislative\nprovisions\nMay include but are not limited to:\n5.1 Dental Law\n5.2 Occupational Health and Safety (OHS)\n5.3 Workplace relations\n5.4 Workers’ compensations\n5.5 Equal employment opportunity (EEO)\n5.6 Environmental protection legislation\n\n--- PDF PAGE 134 ---\nTR Dental Technology NC IV\n\n129\n\n6. Different forms of\ncontracts\nMay include but are not limited to:\n6.1 Letters of appointments or intent\n6.2 Memorandum of agreement\n6.2.1 External contracts\n6.2.2 Written contracts\n6.3 Terms of payment agreement\n6.4 Purchase order\n6.5 Petty cash\n7. Statutory and legal\nrequirements\nMay include but are not limited to:\n7.1 Types of products and services provided\n7.2 Size, type and location of business\n7.3 Characteristics of specific products or services\n7.4 Worksite-specific context, variations and\n environments\n\n--- PDF PAGE 135 ---\nTR Dental Technology NC IV\n\n130\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Supervised laboratory technicians in accordance with standards,\npolicies and procedures\n1.2 Managed dental laboratory maintenance program and procedures\nin accordance with standards, policies and procedures\n1.3 Managed dental laboratory facilities and space requirements\nfollowing standards, policies and procedures\n1.4 Complied with dental ethics and jurisprudence in accordance with\nlegal and legislative provisions\n1.5 Demonstrated knowledge on dental law, and other relevant legal\nand statutory requirements\n2. Underpinning\nknowledge\n2.1 Dental Act of 2007 (RA No. 9484) and implementing rules\n2.2 Relevant standards, policy and procedures\n2.3 Relevant statutory and legal requirements\n2.4 