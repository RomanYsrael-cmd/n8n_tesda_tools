        "source_text": "HCS322337\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude in fabricating\nindirect composite/polymer fixed restorations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPrepare model\n1.1\nWork order is interpreted.\n1.2\nModel is treated as required.\n1.3\nSub-structure (if used) is treated for application of material.\n2.\nFabricate\nrestoration\n2.1\nAppropriate system is selected.\n2.2\nMargin is indicated as required.\n2.3\nMaterials are selected.\n2.4\nMaterials are mixed or manipulated.\n2.5\nMaterials are applied and adapted.\n2.6\nSurface of the restoration is treated if required.\n2.7\nMaterial is processed to industry standard.\n3.\nTrim, shape and\nfinish restoration\n3.1\nRotary trimmers are selected.\n3.2\nShape is refined.\n3.3\nRestoration is finished according to work order requirements.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nRestorations\nMay include but are not limited to:\n1.1\nSingle full crowns\n1.2\nBridges\n1.3\nMaryland bridges\n1.4\nImplant supported restorations\n1.5\nVeneers\n1.6\nInlays\n1.7\nHalf and three-quarter crowns\n1.8\nOn-lays\n\n--- PDF PAGE 127 ---\nTR Dental Technology NC IV\n\n122\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model\n1.2\nFabricated restoration\n1.3\nTrimmed, shaped and finished restoration\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies\n2.\nUnderpinning\nknowledge\n2.1\nRelevant material science for carrying out procedures\n2.2\nArticulation and occlusion\n2.3\nTooth morphology\n2.4\nOral anatomy\n2.5\nColor\n2.6\nCurrent DOH infection control guidelines\n2.7\nMetallurgy\n2.8\nPolymer science\n2.9\nIndustry Codes of Practice\n2.10 Relevant Laws as appropriate\n2.11 Housekeeping and Maintenance Procedures\n3\nUnderpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nCarving restorations\n3.4\nMatching of color and shades\n3.5\nAnalyzing of faults\n3.6\nMaintaining personal hygiene\n3.7\nUse of materials\n3.8\nPlanning and organizing work activities\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRelevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3\nColor and shades of teeth\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n\n--- PDF PAGE 128 ---\nTR Dental Technology NC IV\n\n123\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6.\nContext of\nassessment\n6.1\nCompetency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 129 ---\nTR Dental Technology NC IV\n\n124\n\nUNIT OF COMPETENCY:\nJOIN ALLOY STRUCTURES\nUNIT CODE:"
