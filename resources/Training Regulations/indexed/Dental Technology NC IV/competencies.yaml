  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in DENTAL TECHNOLOGY NC IV.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY:\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE:\n500311101\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required\nto receive, respond and act on verbal and written\ncommunication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine\nspoken messages\n1.1\nRequired information is gathered by listening attentively and\ncorrectly interpreting or understanding\ninformation/instructions.\n1.2\nInstructions/information are properly recorded.\n1.3\nInstructions are acted upon immediately in accordance with\ninformation received.\n1.4\nClarification is sought from workplace supervisor on all\noccasions when any instruction/information is not clear.\n2. Perform workplace\nduties following\nwritten notices\n2.1\nWritten notices and instructions are read and interpreted\ncorrectly in accordance with organizational guidelines.\n2.2\nRoutine written instructions are followed in sequence.\n2.3\nFeedback is given to workplace supervisor based on the\ninstructions/information received.\n\n--- PDF PAGE 8 ---\nTR Dental Technology NC IV\n\n4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nMay refer to:\n1.1\nHandwritten and printed material\n1.2\nInternal memos\n1.3\nExternal communications\n1.4\nElectronic mail\n1.5\nBriefing notes\n1.6\nGeneral correspondence\n1.7\nMarketing materials\n1.8 Journal articles\n2. Organizational\nGuidelines\nMay include:\n2.1\nInformation documentation procedures\n2.2\nCompany policies and procedures\n2.3\nOrganizational manuals\n2.4\nService manual\n\n--- PDF PAGE 9 ---\nTR Dental Technology NC IV\n\n5\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2\nReceived and acted on verbal messages and instructions\n1.3\nDemonstrated competency in recording\ninstructions/information\n2. Underpinning\nknowledge\n\n2.1\nKnowledge of organizational policies/guidelines in regard to\nprocessing internal/external information\n2.2\nEthical work practices in handling communications\n2.3\nCommunication process\n\n3. Underpinning skills\n3.1\nConciseness in receiving and clarifying\nmessages/information/communication\n3.2\nAccuracy in recording messages/information\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nPens\n4.2\nNote pads\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview\n5.3\nWritten Evaluation\n5.4\nThird Party Report\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 10 ---\nTR Dental Technology NC IV\n\n6\n\nUNIT OF COMPETENCY:\nWORK WITH OTHERS\nUNIT CODE:\n500311102\nUNIT DESCRIPTOR:\nThis unit covers the skills, knowledge and attitudes required to\ndevelop workplace relationship and contribute in workplace\nactivities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace\nrelationship\n1.1.\nDuties and responsibilities are done in a positive manner to\npromote cooperation and good relationship.\n1.2.\nAssistance is sought from workgroup when difficulties arise\nand addressed through discussions.\n1.3.\nFeedback provided by others in the team is encouraged,\nacknowledged and acted upon.\n1.4.\nDifferences in personal values and beliefs are respected and\nacknowledged in the development.\n2. Contribute to work\ngroup activities\n2.1.\nSupport is provided to team members to ensure workgroup\ngoals are met.\n2.2.\nConstructive contributions to workgroup goals and tasks are\nmade according to organizational requirements.\n2.3.\nInformation relevant to work is shared with team members to\nensure designated goals are met.\n\n--- PDF PAGE 11 ---\nTR Dental Technology NC IV\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1\nJob description and employment arrangements\n1.2\nOrganization’s policy relevant to work role\n1.3\nOrganizational structures\n1.4\nSupervision and accountability requirements including OHS\n1.5\nCode of conduct\n2. Work group\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3. Feedback on\nperformance\n3.1\nFormal/Informal performance appraisal\n3.2\nObtaining feedback from supervisors and colleagues and\nclients\n3.3\nPersonal, reflective behavior strategies\n3.4\nRoutine organizational methods for monitoring service\ndelivery\n4. Providing support to\nteam members\n4.1\nExplaining/clarifying\n4.2\nHelping colleagues\n4.3\nProviding encouragement\n4.4\nProviding feedback to another team member\n4.5\nUndertaking extra tasks if necessary\n5. Organizational\nrequirements\n5.1\nGoals, objectives, plans, systems and process\n5.2\nLegal and organization policy/guidelines\n5.3\nOHS policies, procedures and programs\n5.4\nEthical standards\n5.5\nDefined resources parameters\n5.6\nQuality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 12 ---\nTR Dental Technology NC IV\n\n8\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nProvided support to team members to ensure goals are met\n1.2\nActed on feedback from clients and colleagues\n1.3\nAccessed learning opportunities to extend own personal work\ncompetencies to enhance team goals and outcomes.\n\n2. Underpinning\nknowledge\n\n2.1\nThe relevant legislation that affect operations, especially with\nregards to safety\n2.2\nReasons why cooperation and good relationships are important\n2.3\nKnowledge of the organization’s policies, plans and procedures\n2.4\nUnderstanding how to elicit and interpret feedback\n2.5\nKnowledge of workgroup member’s responsibilities and duties\n2.6\nImportance of demonstrating respect and empathy in dealings\nwith colleagues\n2.7\nUnderstanding of how to identify and prioritize personal\ndevelopment opportunities and options\n\n3. Underpinning skills\n\n3.1\nAbility to read and understand the organization’s policies and\nwork procedures\n3.2\nWrite simple instructions for particular routine tasks\n3.3\nInterpret information gained from correspondence\n3.4\nCommunication skills to request advice, receive feedback and\nwork with a team\n3.5\nPlanning skills to organize work priorities and arrangement\n3.6\nTechnology skills including the ability to select and use\ntechnology appropriate to a task\n3.7\nAbility to relate to people from a range of social, cultural and\nethnic backgrounds\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual member\nin relation to the work activities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies\n\n6. Context of\nassessment\n\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 13 ---\nTR Dental Technology NC IV\n\n9\n\nUNIT OF COMPETENCY :\nDEMONSTRATE WORK VALUES\nUNIT CODE :\n500311103\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required in demonstrating and\nliving by desirable values and ethics in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\nof work\n1.1\nOne’s unique sense of purpose for working and the why’s of\nwork are identified, reflected on and clearly defined for one’s\ndevelopment as a person and as a member of society.\n1.2\nPersonal mission is in harmony with company’s values.\n2. Apply work\nvalues/ethics\n2.1\nWork values/ethics/concepts are classified and reaffirmed in\naccordance with the transparent company ethical standards,\npolicies and guidelines.\n2.2\nWork practices are undertaken in compliance with industry\nwork ethical standards, organizational policy and guidelines.\n2.3\nPersonal behavior and relationships with co-workers and/or\nclients are conducted in accordance with ethical standards,\npolicy and guidelines.\n2.4 Company resources are used in accordance with transparent\ncompany ethical standards, policy and guidelines.\n3. Deal with ethical\nproblems\n3.1\nCompany ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and guidelines.\n3.2\nWork incidents/situations are reported and/or resolved in\naccordance with company protocol/guidelines.\n3.3\nResolution and/or referral of ethical problems identified are\nused as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and company’s\ncore values.\n4.2 Instructions to co-workers are provided based on ethical,\nlawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers using\nappropriate behavior and language.\n\n--- PDF PAGE 14 ---\nTR Dental Technology NC IV\n\n10\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work values/ethics/\n concepts\nMay include but are not limited to:\n1.1\nCommitment/Dedication\n1.2\nSense of urgency\n1.3\nSense of purpose\n1.4\nLove for work\n1.5\nHigh motivation\n1.6\nOrderliness\n1.7\nReliability\n1.8\nCompetence\n1.9\nDependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19\nSense of nationalism\n2. Work practices\n2.1\nQuality of work\n2.2\nPunctuality\n2.3\nEfficiency\n2.4 Effectiveness\n2.5\nProductivity\n2.6\nResourcefulness\n2.7\nInnovativeness/Creativity\n2.8\nCost Consciousness\n2.9\n5S\n2.10\nAttention to details\n3. Incidents/situations\n3.1\nViolent/intensed dispute or argument\n3.2\nGambling\n3.3\nUse of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n4. Company resources\n4.1\nConsumable materials\n4.2\nEquipment/Machineries\n4.3\nHuman\n4.4\nTime\n4.5\nFinancial resources\n5. Instructions\n5.1\nVerbal\n5.1\nWritten\n\n--- PDF PAGE 15 ---\nTR Dental Technology NC IV\n\n11\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDefined one’s unique sense of purpose for working\n1.2\nClarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3\nDemonstrated work practices satisfactorily and consistently in\ncompliance with industry work ethical standards,\norganizational policy and guidelines\n1.4\nDemonstrated personal behavior and relationships with co-\nworkers and/or clients consistent with ethical standards, policy\nand guidelines\n1.5\nUsed company resources in accordance with company ethical\nstandard, policies and guidelines\n1.6\nFollowed company ethical standards, organizational policy\nand guidelines on the prevention and reporting of unethical\nconduct/behavior\n2. Underpinning\nknowledge\n2.1\nOccupational health and safety\n2.2\nWork values and ethics\n2.3\nCompany performance and ethical standards\n2.4\nCompany policies and guidelines\n2.5\nFundamental rights at work including gender sensitivity\n2.6\nWork responsibilities/job functions\n2.7\nCorporate social responsibilities\n2.8\nCompany code of conduct/values\n2.9\nBalancing work and family responsibilities\n3. Underpinning skills\n3.1\nInterpersonal skills\n3.2\nCommunication skills\n3.3\nSelf awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of assessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nThird Party Reports\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 16 ---\nTR Dental Technology NC IV\n\n12\n\nUNIT OF COMPETENCY:\nPRACTICE HOUSEKEEPING PROCEDURES\nUNIT CODE:\n500311104\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\napply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\nunnecessary items\n1.1\nReusable, recyclable materials are sorted in accordance with\ncompany/office procedures.\n1.2\nUnnecessary items are removed and disposed of in\naccordance with company or office procedures.\n2. Arrange items\n2.1\nItems are arranged in accordance with company/office\nhousekeeping procedures.\n2.2\nWork area is arranged according to job requirements.\n2.3\nActivities are prioritized based on instructions.\n2.4\nItems are provided with clear and visible identification\nmarks based on procedure.\n2.5\nSafety equipment and evacuation passages are kept clear\nand accessible based on instructions.\n3. Maintain work area,\ntools and equipment\n3.1\nCleanliness and orderliness of work area is maintained in\naccordance with company/office procedures.\n3.2\nTools and equipment are cleaned in accordance with\nmanufacturer’s instructions/manual.\n3.3\nMinor repairs are performed on tools and equipment in\naccordance with manufacturer’s instruction and manual.\n3.4\nDefective tools and equipment are reported to immediate\nsupervisor.\n4. Follow standardized\nwork process and\nprocedures\n4.1\nMaterials for common use are maintained in designated area\nbased on procedures.\n4.2\nWork is performed according to standard work procedures.\n4.3\nAbnormal incidents are reported to immediate supervisor.\n5. Perform work\nspontaneously\n5.1\nWork is performed as per instruction.\n5.2\nCompany and office decorum are followed and complied with.\n5.3\nWork is performed in accordance with occupational health\nand safety (OHS) requirements.\n\n--- PDF PAGE 17 ---\nTR Dental Technology NC IV\n\n13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1\nNon-recyclable materials\n1.2\nUnserviceable tools and equipment\n1.3\nPictures, posters and other materials not related to work\nactivity\n1.4\nWaste materials\n2. Identification marks\n2.1\nLabels\n2.2\nTags\n2.3\nColor coding\n3. Decorum\n3.1\nCompany/office rules and regulations\n3.2\nCompany/office uniform\n3.3\nBehavior\n4. Minor repair\nMinor repair include but are not limited to:\n4.1\nReplacement of parts\n4.2\nApplication of lubricants\n4.3\nSharpening of tools\n4.4\nTightening of nuts, bolts and screws\n\n--- PDF PAGE 18 ---\nTR Dental Technology NC IV\n\n14\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPracticed the basic procedures of 5S\n2. Underpinning\nknowledge\n2.1\nPrinciples of 5S\n2.2\nWork process and procedures\n2.3\nSafety signs and symbols\n2.4\nGeneral OH & S principles and legislation\n2.5\nEnvironmental requirements relative to work safety\n2.6\nAccident/Hazard reporting procedures\n3. Underpinning skills\n3.1\nBasic communication skills\n3.2\nInterpersonal skills\n3.3\nReading skills required to interpret instructions\n3.4\nReporting/recording accidents and potential hazards\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFacilities, materials, tools and equipment necessary for the\nactivity\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nThird Party Report\n5.2\nInterview\n5.3\nDemonstration with questioning\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 19 ---\nTR Dental Technology NC IV\n\n15\n\nUNIT OF COMPETENCY:\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE:\n500311105\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Obtain and convey\nworkplace\ninformation\n3.1\nSpecific and relevant information is accessed from\nappropriate sources.\n3.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information.\n3.3\nAppropriate medium is used to transfer information and ideas\n3.4\nAppropriate non- verbal communication is used.\n3.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed.\n3.6\nDefined workplace procedures for the location and storage of\ninformation are used.\n3.7\nPersonal interaction is carried out clearly and concisely.\n4. Participate in\nworkplace meetings\nand discussions\n4.1\nTeam meetings are attended on time.\n4.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption.\n4.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols.\n4.4\nWorkplace interactions are conducted in a courteous\nmanner.\n4.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to.\n4.6\nMeetings outcomes are interpreted and implemented.\n5. Complete relevant\nwork related\ndocuments\n5.1\nRange of forms relating to conditions of employment is\ncompleted accurately and legibly.\n5.2\nWorkplace data is recorded on standard workplace forms and\ndocuments.\n5.3\nBasic mathematical processes are used for routine\ncalculations.\n5.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon.\n5.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines.\n\n--- PDF PAGE 20 ---\nTR Dental Technology NC IV\n\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 21 ---\nTR Dental Technology NC IV\n\n17\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard format of\nthe organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfe