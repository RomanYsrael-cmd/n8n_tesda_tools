        "source_text": "HCS322335\nUNIT DESCRIPTOR:\nThis unit involves fabrication of metal alloy, crown and bridge\nstructures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nsectionalized\nmodels\n1.1\nModels are sectioned.\n1.2\nMargins are identified and models are trimmed.\n1.3\nMargins are hardened if required.\n2.\nWax and invest\nfixed partial\ndentures and\nstructures\n2.1\nCrown and bridge restorations are waxed up.\n2.2\nCrown and bridge wax pattern is sprued and prepared for\ninvesting.\n2.3\nAppropriate investment material is selected and wax patterns\nare selected.\n2.4\nWax patterns are invested.\n3.\nBurn-out cast and\nfinish alloy fixed\npartial dentures and\nstructures\n3.1\nBurnout techniques are selected appropriate to the technique.\n3.2\nMetal restorations are cast in appropriate alloy.\n3.3\nMetal restoration is devested without damaging casting.\n3.4\nMetal restoration is trimmed and polished while maintaining all\ncontact areas and margin.\n\n--- PDF PAGE 121 ---\nTR Dental Technology NC IV\n\n117\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Construction of crown and\nbridges structures\n\nMay include but are not limited to:\n1.1\nA range of designs\n1.2\nAnterior and posterior teeth\n1.3\nMetal inlays, crowns and bridges\n1.4\nCeramic fused to metal sub structures\n2. Alloy\nMay include but are not limited to:\n2.1\nCobalt chromium based alloys\n2.2\nGold alloys\n2.3\nMetal/ceramic alloys\n3. Restoration\nMay include but are not limited to:\n3.1\nComplete and partial dentures\n3.2\nCrown and bridge\n3.3\nImplant\n3.4\nSplints\n\n--- PDF PAGE 122 ---\nTR Dental Technology NC IV\n\n118\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared and sectionalized models\n1.2\nWaxed and invested fixed partial dentures and structures\n1.3\nBurned-out cast and finished alloy fixed partial dentures and\nstructures\n1.4\nApplied the different principles, policies and techniques on\ncasting, spruing, soldering, waxing, investing and finishing\n1.5\nFollowed OH&S and Department of Health infection control\nguidelines\n2. Underpinning\nknowledge\nKnowledge and principles on:\n2.1\nCasting techniques\n2.2\nSpruing techniques\n2.3\nTooth morphology\n2.4\nArticulation and occlusion\n2.5\nRelevant material science for carrying out procedures\n2.6\nSoldering techniques\n2.7\nWax and plastic pattern techniques\n2.8\nInvesting techniques\n2.9\nOccupation Health and Safety\n2.10 Finishing techniques\n2.11 Current DOH infection control guidelines\n2.12 Dental Policies and Procedures\n2.13\nRegulatory and Legislation Requirements\n3. Underpinning skills\n3.1\nCasting techniques\n3.2\nSpruing techniques\n3.3\nSoldering techniques\n3.4\nWax and plastic pattern techniques\n3.5\nInvesting techniques\n3.6\nFinishing technique\n3.7\nManual dexterity\n3.8\nAbility to work as part of the team\n3.9\nPlanning of work\n3.10 Language, literacy and numeracy skills appropriate to the role\nand workplace requirements\n3.11 Operational skills to consistently use time effectively and\nprovide quality customer service in the dental environment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA real simulated dental environment\n4.2\nRelevant documentation such as:\n4.2.1 dental policies and procedures\n4.2.2 regulatory and legislation requirements as appropriate\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 123 ---\nTR Dental Technology NC IV\n\n119\n\nUNIT OF COMPETENCY:\nFABRICATE CERAMIC RESTORATIONS\nUNIT CODE:"
