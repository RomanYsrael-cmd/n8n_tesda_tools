        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated effective communication skills with clients\naccessing service and work colleagues\n1.2\nAdopted relevant communication techniques and strategies to\nmeet client particular needs and difficulties\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nDynamics of groups and different styles of group leadership\n2.3\nCommunication skills relevant to client groups\n3. Underpinning\nskills\n3.1\nFull range of communication techniques including:\n3.1.1\nFull range of communication\n3.1.2\nActive listening\n3.1.3\nFeedback\n3.1.4\nInterpretation\n3.1.5\nRole boundaries setting\n3.1.6\nNegotiation\n3.1.7\nEstablishing empathy\n3.2\nCommunication skills required to fulfill job roles as specified by\nthe organization\n4. Resource\nimplications\n4.1\nAccess to appropriate workplace where assessment can take\nplace\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1\nDirect observation\n5.2\nOral Interview\n6. Context of\nassessment\n6.1\nThis unit should be assessed on the job through simulation\n\n--- PDF PAGE 35 ---\nTR Dental Technology NC IV\n\n31\n\nUNIT OF COMPETENCY:\nDEVELOP TEAMS AND INDIVIDUALS\nUNIT CODE:"
        },
        "source_text": "500311115\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to use\nspecialized communication skills to meet specific needs of internal\nand internal clients, conduct interviews, facilitate group of\ndiscussions, and contribute to the development of communication\nstrategies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Meet common and\nspecific\ncommunication\nneeds of clients and\ncolleagues\n1.1\nSpecific communication needs of clients and colleagues are\nidentified and met\n1.2\nDifferent approaches are used to meet communication needs\nof clients and colleagues\n1.3\nConflict is addressed promptly and in a timely way and in a\nmanner which does not compromise the standing of the\norganization\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1\nStrategies for internal and external dissemination of\ninformation are developed, promoted, implemented and\nreviewed as required\n2.2\nChannels of communication are established and reviewed\nregularly\n2.3\nCoaching in effective communication is provided\n2.4\nWork related network and relationship are maintained as\nnecessary\n2.5\nNegotiation and conflict resolution strategies are used where\nrequired\n2.6\nCommunication with clients and colleagues is appropriate to\nindividual needs and organizational objectives\n3. Represent the\norganization\n3.1\nWhen participating in internal or external forums, presentation is\nrelevant, appropriately researched and presented in a manner\nto promote the organization\n3.2\nPresentation is clear and sequential and delivered within a\npredetermined time\n3.3\nUtilize appropriate media to enhance presentation\n3.4\nDifferences in views are respected\n3.5\nWritten communication is consistent with organizational\nstandards\n3.6\nInquiries are responded in a manner consistent with\norganizational standard\n\n--- PDF PAGE 32 ---\nTR Dental Technology NC IV\n\n28\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Facilitate group\ndiscussion\n4.1\nMechanisms which enhance effective group interaction\nis defined and implemented\n4.2\nStrategies which encourage all group members to\nparticipate are used routinely\n4.3\nObjectives and agenda for meetings and discussions are\nroutinely set and followed\n4.4\nRelevant information is provided to group to facilitate\noutcomes\n4.5\nEvaluation of group communication strategies is\nundertaken to promote participation of all parties\n4.6\nSpecific communication needs of individuals are identified\nand addressed\n5. Conduct interview\n5.1\nA range of appropriate communication strategies are\nemployed in interview situations\n5.2\nRecords of interviews are made and maintained in\naccordance with organizational procedures\n5.3\nEffective questioning, listening and nonverbal\ncommunication techniques are used to ensure that\nrequired message is communicated\n\n--- PDF PAGE 33 ---\nTR Dental Technology NC IV\n\n29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\n1.1\nRecognizing own limitations\n1.2\nReferral to specialists\n1.3\nUtilizing techniques and aids\n1.4\nProviding written drafts\n1.5\nVerbal and non verbal communication\n2. Effective group interaction\n2.1\nIdentifying and evaluating what is occurring within an\ninteraction in a non judgmental way\n2.2\nUsing active listening\n2.3\nMaking decision about appropriate words, behavior\n2.4\nPutting together response which is culturally appropriate\n2.5\nExpressing an individual perspective\n2.6\nExpressing own philosophy, ideology and background\nand exploring impact with relevance to communication\n3. Types of Interview\n3.1\nRelated to staff issues\n3.2\nRoutine\n3.3\nConfidential\n3.4\nEvidential\n3.5\nNon disclosure\n3.6\nDisclosure\n4. Interview situations\n4.1\nEstablish rapport\n4.2\nElicit facts and information\n4.3\nFacilitate resolution of issues\n4.4\nDevelop action plans\n4.5\nDiffuse potentially difficult situation\n\n--- PDF PAGE 34 ---\nTR Dental Technology NC IV\n\n30\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated effective communication skills with clients\naccessing service and work colleagues\n1.2\nAdopted relevant communication techniques and strategies to\nmeet client particular needs and difficulties\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nDynamics of groups and different styles of group leadership\n2.3\nCommunication skills relevant to client groups\n3. Underpinning\nskills\n3.1\nFull range of communication techniques including:\n3.1.1\nFull range of communication\n3.1.2\nActive listening\n3.1.3\nFeedback\n3.1.4\nInterpretation\n3.1.5\nRole boundaries setting\n3.1.6\nNegotiation\n3.1.7\nEstablishing empathy\n3.2\nCommunication skills required to fulfill job roles as specified by\nthe organization\n4. Resource\nimplications\n4.1\nAccess to appropriate workplace where assessment can take\nplace\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1\nDirect observation\n5.2\nOral Interview\n6. Context of\nassessment\n6.1\nThis unit should be assessed on the job through simulation\n\n--- PDF PAGE 35 ---\nTR Dental Technology NC IV\n\n31\n\nUNIT OF COMPETENCY:\nDEVELOP TEAMS AND INDIVIDUALS\nUNIT CODE:"
