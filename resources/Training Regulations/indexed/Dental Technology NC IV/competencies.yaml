        "source_text": "500311117\nUNIT DESCRIPTOR:\nThis competency covers the knowledge, skills and attitudes\nrequired to apply the process of problem solving and other\nproblems beyond those associated directly with the process unit. It\nincludes the application of structured processes and improvement\ntools. This competency is typically performed by an experienced\ntechnician, team leader or supervisor.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nAnalyze the problem\n1.1. Issues/concerns are evaluated based on data gathered\n1.2. Possible causes of problem are identified within the area of\nresponsibility as based on experience and the use of\nproblem solving tools/analytical techniques\n1.3 Possible cause statements are developed based on findings\n2.\nIdentify possible\nsolutions\n2.1 All possible options are considered for resolution of the\nproblem in accordance with safety and operating procedures\n2.2 Strengths and weaknesses of possible options are considered\n2.3 Corrective action is determined to resolve the problem and its\npossible future causes\n3.\nRecommend solution\nto higher\nmanagement\n3.1 Report/communication or documentation are prepared\n3.2 Recommendations are presented to appropriate personnel\n3.3 Recommendations are followed-up, if required\n4.\nImplement solution\n4.1 Measurable objectives are identified\n4.2 Resource needs are identified\n4.3 Timelines are identified in accordance with plan\n5.\nEvaluate/Monitor\nresults and outcome\n5.1. Processes and improvements are identified based on\nevaluative assessment of problem\n5.2. Recommendations are prepared and submitted to superiors.\n\n--- PDF PAGE 41 ---\nTR Dental Technology NC IV\n\n37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Area of responsibility\nVariables may include but are limited to:\n1.1.\nWork environment\n1.2.\nProblem solution processes\n1.3.\nPreventative maintenance and diagnostic policy\n1.4.\nRoles and technical responsibilities\n2. Occupational Health and\nSafety\n2.1.\nAs per company, statutory and vendor requirements.\nErgonomic and environmental factors must be\nconsidered during the demonstration of this competency.\n3. Communication\n3.1.\nVariables may include but are not limited to:\n3.2.\nWritten communication can involve both hand written and\nprinted material, internal memos, electronic mail, briefing\nnotes and bulletin boards.\n4. Documentation\n4.1.\nAudit trails\n4.2.\nNaming standards\n4.3.\nVersion control\n\n--- PDF PAGE 42 ---\nTR Dental Technology NC IV\n\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Analyzed the problem\n1.2. Identified possible solutions\n1.3. Implemented solutions\n1.4. Recommended solutions to higher management\n1.5. Outcome evaluated/monitored\nEvidence of satisfactory performance in this unit can be obtained by\nobservation of performance and questioning to indicate knowledge and\nunderstanding of the elements of the competency and performance\ncriteria.\n2. Underpinning\nknowledge\n2.1. Broad understanding of systems, organizational systems and\nfunctions\n2.2. Broad knowledge of help desk and maintenance practices\n2.3. Current industry accepted hardware and software products with\nbroad and detailed knowledge of its general features and\ncapabilities\n2.4. Broad knowledge of the operating system\n2.5. Broad knowledge of the client business domain\n2.6. Broad knowledge based incorporating current industry practices\nrelated to escalation procedures\n2.7. Broad knowledge based of diagnostic tools\n2.8 . General principles of OHS\n2.8. Divisional/unit responsibilities\n3. Underpinning\nskills\n3.1. Decision making within a limited range of options.\n3.2. Communication is clear, precise and varies according to the type\nof audience\n3.3. Teamwork in reference to personal responsibility\n3.4. Time management as applied to self-management.\n3.5. Analytical skills in relation to routine malfunctions.\n3.6. General customer service skills displayed.\n3.7. Questioning and active listening is employed to clarify general\ninformation\n\n--- PDF PAGE 43 ---\nTR Dental Technology NC IV\n\n39\n\n4. Resource\nimplications\n4.1. Assessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios/case studies/what ifs will be required as well as\nbank of questions which will be used to probe the reasoning\nbehind the observable actions.\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1. Through direct observation of application to tasks and\nquestions related to underpinning knowledge\nUnder general guidance, checking various stages of operation and\nat the completion of the activity against performance criteria and\nspecifications\n\n6. Context of\nassessment\n6.1. Competency may be assessed in the work place or in a\nsimulated work place setting\n6.2. Assessment shall be carried out through TESDA’s Accredited\nAssessment Centers/Venues while tasks are undertaken\neither individually or as part of a team under limited\nsupervision\n\n--- PDF PAGE 44 ---\nTR Dental Technology NC IV\n\n40\n\nUNIT OF COMPETENCY:\nCOLLECT, ANALYZE AND ORGANIZE INFORMATION\nUNIT CODE:"
