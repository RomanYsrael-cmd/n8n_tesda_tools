        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Waxed case for finish consistent with work orders\n1.2 Selected and prepared materials and processing techniques\n1.3 Processed denture or appliance\n1.4 Grind dentures and appliances selectively\n1.5 Finished denture or appliance\n1.6 Complied with infection control policies and procedures\n1.7 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Relevant material science for carrying out procedures\n2.2 Tooth morphology and anatomy\n2.3 OH&S and materials safety data sheets\n2.4 Current DOH infection control guidelines\n2.5 Workplace Policy and Procedures Manuals\n2.6 Product Labels and Sources of Product Information\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nMaintaining personal hygiene\n3.4\nPlanning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 Relevant documentation, such as:\n - workplace policy and procedures manuals\n4.2 Access to a range of clients with different requirements\n4.3 A range of equipment and products appropriate to the\nworkplace\n4.4\n Product labels and sources of product information\n4.5\nA qualified workplace assessor or assessment team\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 107 ---\nTR Dental Technology NC IV\n\n103\n\nUNIT OF COMPETENCY:\nFABRICATE THERMO-FORMED BASES AND APPLIANCES\nUNIT CODE:"
        },
        "source_text": "HCS322330\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes concerned with\nthe process involved in polymerization and finishing of acrylic\ndentures and appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Wax case for finish\nconsistent with work\norder\n1.1\nWax is applied as required by work order.\n1.2\nFacial and lingual aspects are contoured.\n2. Select and prepare\nmaterials and\nprocessing\n2.1\nAppropriate polymer system for case is identified.\n2.2\nAppropriate investment technique is identified.\n2.3\nAppropriate processing cycle is identified.\n2.4\nMaterial is selected from identified polymer system.\n2.5\nSystem components are combined.\n2.6\nMaterials are allowed to reach application stage.\n3. Process denture or\nappliance\n3.1\nAppropriate investment techniques are applied.\n3.2\nMaterial is applied to mould.\n3.3\nAppropriate processing cycle is applied.\n3.4\nModel is divested.\n3.5\nRemount on articulator.\n4. Grind dentures and\nappliances selectively\n4.1\nCentric occlusion is restored.\n4.2\nBalanced occlusion is restored.\n4.3\nBalanced articulation is restored.\n4.4\nFunction is restored.\n5. Finish denture or\nappliance\n5.1\nDenture or appliance is trimmed, shaped and finished\naccording to job specifications.\n5.2\nDentures are disinfected according to current DOH infection\nguidelines.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Acrylic dentures and\nappliances\nMay include but are not limited to:\n1.1\nComplete and partial dentures\n1.2\nOrthodontic appliances\n1.3\nTherapeutic appliances\n\n--- PDF PAGE 106 ---\nTR Dental Technology NC IV\n\n102\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Waxed case for finish consistent with work orders\n1.2 Selected and prepared materials and processing techniques\n1.3 Processed denture or appliance\n1.4 Grind dentures and appliances selectively\n1.5 Finished denture or appliance\n1.6 Complied with infection control policies and procedures\n1.7 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Relevant material science for carrying out procedures\n2.2 Tooth morphology and anatomy\n2.3 OH&S and materials safety data sheets\n2.4 Current DOH infection control guidelines\n2.5 Workplace Policy and Procedures Manuals\n2.6 Product Labels and Sources of Product Information\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nMaintaining personal hygiene\n3.4\nPlanning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 Relevant documentation, such as:\n - workplace policy and procedures manuals\n4.2 Access to a range of clients with different requirements\n4.3 A range of equipment and products appropriate to the\nworkplace\n4.4\n Product labels and sources of product information\n4.5\nA qualified workplace assessor or assessment team\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 107 ---\nTR Dental Technology NC IV\n\n103\n\nUNIT OF COMPETENCY:\nFABRICATE THERMO-FORMED BASES AND APPLIANCES\nUNIT CODE:"
