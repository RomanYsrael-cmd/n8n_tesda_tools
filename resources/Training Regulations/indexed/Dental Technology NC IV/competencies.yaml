        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Analyzed market in accordance with standards, policies and\nprocedures\n1.2 Planned dental product ranges according business policy\n1.3 Marketed dental products and services in accordance with\nbusiness plan, marketing strategies and marketing mix\n1.4 Monitored merchandise quality standards according to legal\nrequirements, customer requirements and business policy\n1.5 Demonstrated knowledge on dental laws and regulations\n2. Underpinning\nknowledge\n2.1 Dental Act of 2007 (RA No. 9484) and its implementing rules\n2.2 Relevant standards, policy and procedures\n2.3 Research methods\n2.4 Marketing principles, strategies and practices\n2.5 Planning integration of development and maintenance functions\n2.6 Business policies and procedures\n2.7 Staff product knowledge training\n2.8 Industry and business information\n 2.8.1 market needs\n 2.8.2 range of product availability\n 2.8.3 market competition\n 2.8.4 channels of distribution\n2.9 Occupational Health and Safety (OHS)\n3. Underpinning skills\n3.1 Interpersonal communication skills\n3.2 Research skills\n3.3 Planning marketing strategy consistent with principles and\n practices of marketing\n3.4 Developing and implementing marketing strategies\n3.5 Applying relevant legal principles\n3.5 Determining customer needs, expectations and satisfaction\nlevels\n3.6 Recording and reporting\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate technicians, supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration or Observation with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 141 ---\nTR Dental Technology NC IV\n\n136\n\nUNIT OF COMPETENCY\nCONTINUE PROFESSIONAL GROWTH AND DEVELOPMENT\nUNIT CODE"
        },
        "source_text": "HCS322341\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\nperform administrative functions relating to market/promotion and\nquality control dental-laboratory products and services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Analyze market\n1.1 Merchandise and marketing policies and procedures are\nidentified and analyzed in accordance with standards\noperating procedures\n1.2 Customer requirements are monitored in order to evaluate\nmarket trends and customer needs\n1.3 New products and services are researched in following the\nstandards operating procedures\n1.4 Opportunities to improve sales of products or services are\nidentified and evaluated\n1.5 Merchandise range are monitored to identify the demand\nfor individual needs\n2. Plan dental product\nranges\n2.1 Buying plan is developed and implemented according to\noutcomes of analysis and business policy\n2.2 Future directions for merchandise ranges are determined\naccording to business policy\n2.3 Product sales or services are analyzed to determine\ncontribution rates of product lines\n2.4 Investment levels are determined with reference to previous\nyear’s product sales, predicted demand and its impact on\nbusiness operations\n2.5 Merchandise range sources of supply is analyzed,\nevaluated and amended according to management, staff\ncustomer feedback\n3. Market dental products\nand services\n3.1 Customer requirements are established in accordance with\nstandards, policy and procedures\n3.2 Marketing strategies are developed and implemented in\naccordance with the business plan\n3.3 Marketing strategies are monitored in accordance with\nmarketing activities\n3.4 Marketing strategies and customer satisfaction are\nevaluated in accordance with marketing mix\n3.5 Product range is introduced according to marketing plan and\nactivities\n\n--- PDF PAGE 137 ---\nTR Dental Technology NC IV\n\n132\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n4. Implement quality control\n4.1 Quality standards for dental-laboratory products and\nservices are established according to legal requirements,\ncustomer requirements and business policy\n4.2 Quality of merchandise is monitored and ensured during\nsupply, production and delivery processes\n4.3 Stock product returns are recorded and analyzed against\ntarget figures\n\n--- PDF PAGE 138 ---\nTR Dental Technology NC IV\n\n133\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Merchandise\nand\nmarketing\npolicies and\nprocedures\n\nMay include but are not limited to:\n1.1 Business culture\n1.2 Current market position\n1.3 Target market\n2. Customer\nrequirements\nMay include but are not limited to:\n2.1 Observations\n2.2 Questionnaires\n2.3 Surveys\n3. Merchandise\nrange\nMay include but are not limited to:\n3.1 Existing stocks\n3.2 New stocks\n4. Buying plan\nMay include but are not limited to:\n4.1 Financial requirement\n4.2 Inventory of stocks\n4.3 Dental manufacturers/suppliers\n5. Impact on\nbusiness\noperations\nMay include but are not limited to:\n5.1 Buying\n5.2 Ordering patterns\n5.3 Planning\n5.4 Budgeting\n6. Feedback\nMay include but are not limited to:\n6.1 Verbal or written\n6.2 Groups\n6.3 Individuals\n7. Marketing\nstrategies\nMay include but are not limited to:\n7.1 Product or service\n7.2 Business relationships\n7.3 Strategic imperative\n7.4 Sales strategy\n7.5 Promotional strategies and their duration, cycle and product or service\n8. Business plan\nMay include but are not limited to:\n8.1 Sales\n8.2 Marketing\n8.3 Purchasing and procurement\n8.4 Disposal\n8.5 Human resources\n8.6 Public relations\n8.7 Contingency\n8.8 Risk management\n8.9 Environmental impact\n\n--- PDF PAGE 139 ---\nTR Dental Technology NC IV\n\n134\nVARIABLE\nRANGE\n9. Marketing activities\nMay include but are not limited to:\n9.1 Market control\n9.2 Market information\n9.3 Market planning\n9.4 Market structure\n9.5 Market share\n10. Marketing mix\nMay include but are not limited to:\n10.1 Promotions\n10.2 Product\n10.3 Price\n10.4 Market research information\n10.5 Customers\n10.6 Resource requirements\n11. Legal requirements\nIncludes:\n11.1 Standard of care – nature and manner of delivery of\ndental services\n11.2 Purchase of dental products – commercial acquisition of\ndental products and materials\n11.3 Technical services – design and fabrication of dental\nappliances and repair of previously fabricated dental\nappliances\n\n--- PDF PAGE 140 ---\nTR Dental Technology NC IV\n\n135\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Analyzed market in accordance with standards, policies and\nprocedures\n1.2 Planned dental product ranges according business policy\n1.3 Marketed dental products and services in accordance with\nbusiness plan, marketing strategies and marketing mix\n1.4 Monitored merchandise quality standards according to legal\nrequirements, customer requirements and business policy\n1.5 Demonstrated knowledge on dental laws and regulations\n2. Underpinning\nknowledge\n2.1 Dental Act of 2007 (RA No. 9484) and its implementing rules\n2.2 Relevant standards, policy and procedures\n2.3 Research methods\n2.4 Marketing principles, strategies and practices\n2.5 Planning integration of development and maintenance functions\n2.6 Business policies and procedures\n2.7 Staff product knowledge training\n2.8 Industry and business information\n 2.8.1 market needs\n 2.8.2 range of product availability\n 2.8.3 market competition\n 2.8.4 channels of distribution\n2.9 Occupational Health and Safety (OHS)\n3. Underpinning skills\n3.1 Interpersonal communication skills\n3.2 Research skills\n3.3 Planning marketing strategy consistent with principles and\n practices of marketing\n3.4 Developing and implementing marketing strategies\n3.5 Applying relevant legal principles\n3.5 Determining customer needs, expectations and satisfaction\nlevels\n3.6 Recording and reporting\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate technicians, supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration or Observation with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 141 ---\nTR Dental Technology NC IV\n\n136\n\nUNIT OF COMPETENCY\nCONTINUE PROFESSIONAL GROWTH AND DEVELOPMENT\nUNIT CODE"
      }
