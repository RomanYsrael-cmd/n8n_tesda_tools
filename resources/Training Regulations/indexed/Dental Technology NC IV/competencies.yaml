        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model.\n1.2\nSelected and prepared materials\n1.3\nFabricated custom impression tray\n1.4\nFollowed OH&S and DOH infection control guidelines\n1.5\nIdentified oro-facial anatomy\n1.6\nFollowed different techniques in model fabrication\n2. Underpinning\nknowledge\n\nKnowledge on the following:\n2.1\nRelevant material science for carrying out procedures\n2.2\nModel fabrication techniques\n2.3\nOro-facial anatomy\n2.4\nCurrent infection control DOH guidelines\n2.5\nOHS and material data safety sheets\n2.6\nDental workplace policies and procedures\n2.7\nIndustry codes of practice, standards and guidelines\n2.8\nNational and local legislation where appropriate\n3. Underpinning skills\n3.1\nModel fabrication techniques\n3.2\nManual dexterity\n3.3\nThermo-forming technology\n3.4\nVisible light-cured techniques\n3.5 Planning and organizing work activities\n3.5\nLanguage, literacy and numeracy skills appropriate to the role\nand workplace requirements\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 Dental policies and procedures\n4.2.2 Industry codes of practice, standards and guidelines\n4.2.3 State legislation where appropriate\n4.3 Access to a range of customers with different requirements\n(real or simulated)\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 95 ---\nTR Dental Technology NC IV\n\n91\n\nUNIT OF COMPETENCY:\nFABRICATE REGISTRATION BITE RIMS\nUNIT CODE:"
        },
        "source_text": "HCS322324\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in fabricating\ncustom impression trays.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare model\n1.1\nWork is interpreted.\n1.2\nUndesirable undercuts are blocked out.\n1.3 Outline is marked and spacer is applied as required.\n2. Select and prepare\nmaterials\n2.1\nSelected materials are obtained and mixed in accordance with\nmanufacturer’s instructions.\n2.2 Equipment is prepared for processing.\n2.3\nMixing vessels and templates are provided.\n3. Fabricate custom\nimpression tray\n3.1\nMaterials are mixed or manipulated to desired outcome.\n3.2\nMaterial is adapted to the cast.\n3.3\nHandle is fabricated and attached as required.\n3.4\nCustom tray is processed in accordance with industry\nstandards.\n3.5\nOutline is trimmed.\n3.6\nSpacer material is removed.\n3.7\nOutline is refined and polished as required.\n3.8\nImpression tray is customized to particular impression\nmaterial requirements.\n3.9\nImpression tray is disinfected according to DOH guidelines.\n\n--- PDF PAGE 93 ---\nTR Dental Technology NC IV\n\n89\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Custom Trays\n\nTrays may be fabricated for:\n1.1\nFully edentoulous\n1.2\nPartially dentate\n1.3\nFully dentate\n1.4\nImplant cases\n\n2. Spacer materials\n\nA range of spacer materials may be used:\n2.1 Acrylic\n2.2 Thermoplastic\n2.3 Light-cured composite\n\n3. Impression tray\n\nMay include but are not limited to:\n3.1\nFull arch\n3.2\nAnterior\n3.3\nPosterior\n3.4\nQuadrant\n\n--- PDF PAGE 94 ---\nTR Dental Technology NC IV\n\n90\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model.\n1.2\nSelected and prepared materials\n1.3\nFabricated custom impression tray\n1.4\nFollowed OH&S and DOH infection control guidelines\n1.5\nIdentified oro-facial anatomy\n1.6\nFollowed different techniques in model fabrication\n2. Underpinning\nknowledge\n\nKnowledge on the following:\n2.1\nRelevant material science for carrying out procedures\n2.2\nModel fabrication techniques\n2.3\nOro-facial anatomy\n2.4\nCurrent infection control DOH guidelines\n2.5\nOHS and material data safety sheets\n2.6\nDental workplace policies and procedures\n2.7\nIndustry codes of practice, standards and guidelines\n2.8\nNational and local legislation where appropriate\n3. Underpinning skills\n3.1\nModel fabrication techniques\n3.2\nManual dexterity\n3.3\nThermo-forming technology\n3.4\nVisible light-cured techniques\n3.5 Planning and organizing work activities\n3.5\nLanguage, literacy and numeracy skills appropriate to the role\nand workplace requirements\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 Dental policies and procedures\n4.2.2 Industry codes of practice, standards and guidelines\n4.2.3 State legislation where appropriate\n4.3 Access to a range of customers with different requirements\n(real or simulated)\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 95 ---\nTR Dental Technology NC IV\n\n91\n\nUNIT OF COMPETENCY:\nFABRICATE REGISTRATION BITE RIMS\nUNIT CODE:"
      },
