        "source_text": "HCS322331\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes concerned with\nfabrication of alloy removable partial denture framework.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare master\nmodel\n1.1\nWork order is interpreted.\n1.2\nAlloy is selected\n1.3\nModel is surveyed.\n1.4\nDesigned is transferred to master model.\n1.5\nUndesirable undercuts are blocked out.\n1.6\nClasp ledges are created.\n1.7\nFinished lines are scribed.\n1.8\nTissue relief is applied.\n1.9\nSaddle relief is applied.\n2. Construct refractory\nmodel\n2.1\nMaster model is duplicated in refractory material and sprue\nformer is constructed, as necessary.\n2.2\nRefractory model surface is treated.\n3. Wax and invest\nremovable partial\ndenture framework\n3.1\nDesign is transferred to refractory model.\n3.2\nPatterns and waxes are selected.\n3.3\nPatterns are waxed up and sprues attached.\n3.4\nAppropriate investment and technique are selected.\n3.5\nInvestment material is prepared.\n3.6\nWax, patterns and sprues are treated.\n3.7\nInvestment setting time is allowed for.\n4. Burn out, cast and\nfinish removable\npartial denture\nframework\n4.1\nBurn out and preheat cycles are selected for appropriate\ninvestment/alloy combination.\n4.2\nInvestment mould is burnt out and preheated.\n4.3\nAlloy is melted and cast using appropriate\nequipment/technique.\n4.4\nCooling cycle is selected and applied.\n4.5\nDenture framework is divested.\n4.6\nDenture framework is trimmed, shaped, treated, finished and\nfitted to master model.\n4.7\nFramework is treated in accordance with DOH infection\ncontrol guidelines.\n\n--- PDF PAGE 118 ---\nTR Dental Technology NC IV\n\n114\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Alloy\nMay include but are not limited to:\n1.1 Cobalt chromium based alloys\n1.2 Gold alloys\n1.3 Metal/ceramic alloys\n\n2. Melting/casting\ntechniques\nMay include but are not limited to:\n2.1 Flame melting\n2.2 Induction melting\n2.3 Resistance melting\n2.4 Centrifugal casting\n2.5 Gas pressure casting\n2.6 Vacuum casting\n\n--- PDF PAGE 119 ---\nTR Dental Technology NC IV\n\n115\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared materials for fabrication of metal/cast\nmetal alloy\n1.2 Fabricated base and registration rim\n1.3 Prepared face-bow (if required)\n1.4 Complied with infection control policies and procedures\n1.5 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Dental alloy\n2.2 Relevant material science for carrying out procedures\n2.3 Solidification\n2.4 Melting and casting\n2.5 Heat treatment\n2.6 Surface finishing\n2.7 Industry Codes of Practice\n2.8 Relevant Laws as appropriate\n2.9 Housekeeping Maintenance\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Melting and casting techniques\n3.4 Maintaining personal hygiene\n3.5 Planning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation, such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance\n4.3 Dental alloys\n4.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 120 ---\nTR Dental Technology NC IV\n\n116\n\nUNIT OF COMPETENCY:\nFABRICATE METAL CROWN AND BRIDGE STRUCTURES\nUNIT CODE:"
