        "source_text": "HCS346203\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in\nmanaging appointments to suit the client and the organization, to\nrecord and reconcile payments and to maintain client record.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\neffectively with\nclients and other\npersons\n\n1.1\nClients and other visitors are greeted appropriately.\n1.2\nAn appropriate environment is made available for the client to\ncomplete medical, dental and financial details.\n1.3\nClient and/or carer point of view is listened carefully.\n1.4\nInformation provided to client and/or carer appropriately and\nlanguage used completely so that it can easily be understood.\n1.5\nClient and/or carer ensured they understood information\nprovided to them.\n1.6\nBeing polite and negative comments avoided shows empathy\nand respect for client and/or carer.\n2. Respond\nappropriately to\nenquiries from\nclients and visitors\n2.1\nPersonal dress and presentation is maintained.\n2.2\nCommunication equipment is used effectively.\n2.3\nEnquiries are responded promptly, politely and ethically.\n2.4\nPurpose of an enquiry, the identity of the person is determined\nand relevant record/s retrieved if required.\n2.5\nMessages prioritized and recorded legibly and accurately.\n2.6\nEnquiries outside area of responsibility are referred to\nappropriate supervisor.\n2.7\nElectronic communication with clients and /or carers is complied\nin accordance with organizational protocols.\n2.8\nConfidentiality of information relating to clients, staff and the\ndental practice/organization is maintained.\n3. Allocate\nappointments\nappropriate to\nclient and\norganization\nrequirements\n3.1\nClient’s appointment requirements are identified.\n3.2\nAppointment time is set in accordance with the client’s\npreferences and the organization’s requirements.\n3.3\nAppointment details are recorded accurately and legibly using\nstandard dental notation in the organizations appointment\nsystem.\n3.4\nCopy of appointment details is provided to the client.\n3.5\nAppointment schedules are monitored; clients and the oral health\ncare team are notified of any necessary changes within a\nsuitable timeframe.\n4. Calculate and\nrecord basic\nfinancial\ntransactions\n4.1\nPetty cash vouchers and all monies are completed accurately\nand account for.\n4.2\nCorrect fees are calculated.\n4.3\nGST applied in accordance with identified requirements.\n4.4\nPayments received are checked and recorded legibly and\naccurately.\n4.5\nChecks and credit card vouchers are validated\n4.6\nClient is provided with a receipt.\n\n--- PDF PAGE 63 ---\nTR Dental Technology NC IV\n\n59\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5. Handle cash and\nrecord financial\ntransactions\n5.1\nBalances accurately monies received against records of\npayment in accordance with organization policies\n5.2\nCash is secured in an approved location.\n5.3\nSuspected breaches of security are responded and\nappropriate action taken within minimum delay in accordance\nwith organization policies.\n5.4\nRecord of bad debts identified and appropriate action taken in\nline with office procedures.\n5.5\nBanking procedures are followed in accordance with\norganization policies.\n6. Maintain client\nrecords\n6.1\nCorrect client files are removed and appropriate fees and\ndiagnostic records attached.\n6.2\nOrder of payment is placed in files.\n6.3\nInformation entered legibly, accurately and updated as\nappropriate\n6.4\nClient’s dental records are filed correctly after use\n6.5\nRecords of laboratory work are maintained up-to-date,\naccurate, legible and complete\n7. Assist with client\nrecalls\n7.1\nKnowledge of client recall system is applied\n7.2\nClient records is marked with relevant recall date as\nappropriate and as directed by the operator\n7.3\nClients who are due for recall are identified and notified them\nthat an appointment is due\n7.4\nClients who do not respond to a recall appointment request\nare followed-up with courtesy\n\n--- PDF PAGE 64 ---\nTR Dental Technology NC IV\n\n60\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Communication\nequipment\nMay include but are not limited to:\n1.1 Telephone/Mobile Phone\n1.2 Facsimile\n1.3\nE-mail/Website\n2. Maintaining\nconfidentiality\nMay include but are not limited to:\n2.1 Public environments\n2.2 Legal and ethical requirements\n2.3 Writing personal details such as medical and dental histories\nand consent forms\n2.4 Conversations on the telephone/mobile phone\n2.5 Secure location for written records\n2.6 Offering a private location for discussion\n2.7 Information disclosed to an appropriate person consistent with\nthe responsibility of a dental assistant\n3 Appointment\nrequirements\nMay include but are not limited to:\n3.1 Appointment requirements of the client:\n3.1.1\nRoutine examination\n3.1.2\nDefined procedures\n3.1.3\nEmergencies\n3.2 Special requirements of the dental practice:\n3.2.1\nTiming requirements for different types of procedures\n3.2.2\nAvailability of staff\n3.3\nScheduling a series of appointments\n4. Recording of\nappointment details\nMay include:\n4.1 Manual – appointment book\n4.2 Electronic – computer based program\n4.3 Appointment details include the following:\n4.3.1\nClient’s name\n4.3.2\nClient’s contact details\n4.3.3\nProcedure to be performed for that appointment\n5. Dental records\nMay include but are not limited to:\n5.1 Dental charts and dental treatment records\n5.2 Completed medical questionnaires\n5.3 Consent documents obtained for treatment\n5.4 Radiographs, tracings and measurements\n5.5 Diagnostic models\n5.6 Photographs\n5.7 Records of financial transactions\n5.8 Notes made by staff following telephone conversations\n5.9 Reports to and from referring dentists and specialists\n5.10 Copies of correspondence relating to the client\n6. Recall system\nMay include:\n6.1 Manual\n6.2 Electronic\n\n--- PDF PAGE 65 ---\nTR Dental Technology NC IV\n\n61\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied consistently with infection control guidelines of DOH\nand occupational health and safety policies of OHSS\n1.2 Demonstrated consistent performance in the following workplace\nsituations such as:\n1.2.1 Responding to a variety of requests for information from\na range of persons\n1.2.2 Accurate calculation of fees\n1.2.3 Recording of financial transactions in accordance with\ndental practice/organization requirements\n1.2.4 Assist with management of an effective appointment and\nrecall system\n1.2.5 Recording, labeling and filing forms and records in\naccordance with legislation and the dental practice /\norganization policies\n\n2. Underpinning\nknowledge\n\n2.1 Dental terminology:\n2.1.1 Abbreviations and symbols used when recording dental\ntreatment\n2.1.2 FDI notation system used to designate the permanent\nand deciduous teeth during examination and charting\n2.1.3 Palmer notation system used to designate the permanent\nand deciduous teeth during examination and charting\n2.1.4 Community periodontal index\n2.1.5 Symbols used during charting of individual\n\n2.2 Handling and recording financial transactions:\n2.2.1 Itemizing of client accounts\n2.2.2 Issuing invoices\n2.2.3 Recording of payments and issuing receipts\n2.2.4 The different methods of payment\n2.2.5 The details that need to be recorded and checked for\ncredit and/or debit cards and check payments\n2.2.6 Operating a petty cash system\n2.2.7 Organization policy on banking and handling of cash\nsecurely\n\n2.3 Legal requirements\n2.3.1 The reasons for ensuring the confidentiality of\ninformation provided by the client\n2.3.2 Confidentiality requirements for the recording and\nstorage of client records\n2.3.3 The requirements of the Health Privacy Principle and\ntheir application to the collection of information by the\ndental practice or organization\n\n--- PDF PAGE 66 ---\nTR Dental Technology NC IV\n\n62\n\n2.4 Appointments:\n2.4.1 The time requirements of different treatment procedures\nand the effect this has on appointment scheduling\n2.4.2 The particular needs which clients may have for the\ntiming of appointments\n2.4.3 The dentists preferred work routine\n2.4.4 The time constraints imposed by the dental laboratory\n2.4.5 The relevant details that must be entered into the\nappointment system and the written confirmation that\nmust be provided to the client\n2.4.6 The action that must be taken for broken and/or\ncancelled appointments\n2.4.7 Confirmation of appointments\n\n2.5 Recall appointment\n2.5.1 Methods used by the dental practice or the organization\nto identify those clients who require either recall\nexamination or follow-up treatment\n2.5.2 Methods used to follow-up clients who do not respond to\nrecall\n\n3. Underpinning skills\n3.1 Using available technology and software for recording\nappointments and payments\n3.2 Using oral communication skills required to fulfill the job role as\nspecified by the dental practice/organization\n3.2.1 Negotiation\n3.2.2 Asking questions\n3.2.3 Active listening\n3.2.4 Asking for clarification from caller or client\n3.2.5 Acknowledging and responding to a range of views\n3.3 Using literacy skills to read and following directions, policies and\nprocedures\n3.3.1 Occupational health and safety policies and procedures\n3.3.2 Infection control policies and procedures\n3.3.3 Practice/Organization policies and procedures\n3.4 Using numeracy skills\n3.4.1 Basic mathematical calculations such as addition,\nmultiplication and calculations of percentages\n3.4.2 Handling and recording of basic financial calculations\n3.5 Selecting and applying procedures to perform a range of tasks;\nfollowing sequenced written instructions, recording accurately\nand legibly client details\n3.6 Dealing with conflict\n3.7 Using problem solving skills required including using available\nresources, prioritizing appointments and assessing urgency of\ncalls\n\n--- PDF PAGE 67 ---\nTR Dental Technology NC IV\n\n63\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.4 Appropriate supplies and materials\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 68 ---\nTR Dental Technology NC IV\n\n64\n\nUNIT OF COMPETENCY:\nAPPLY QUALITY STANDARDS\nUNIT CODE:"
