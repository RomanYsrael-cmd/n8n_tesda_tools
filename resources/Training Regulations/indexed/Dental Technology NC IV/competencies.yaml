 facilities appropriate to the proposed\nactivities\n4.2.\nMaterials relevant to the proposed activities\n4.3.\nWork plan schedules\n4.4.\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nDirect observation/questioning\n5.2.\nPractical exercises on Planning and Scheduling Work Activities\n5.3.\nThird Party Report (collection of competency evidence)\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in the workplace or in simulated\nwork\n\n--- PDF PAGE 52 ---\nTR Dental Technology NC IV\n\n48\n\nUNIT OF COMPETENCY :\nPROMOTE ENVIRONMENTAL PROTECTION\nUNIT CODE:\n500311120\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in\nadhering to environmental protection principles, strategies and\nguidelines\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n 1. Study guidelines for\nenvironmental\nconcerns.\n 1.1 Environmental legislations/conventions and local ordinances\nare identified according to the different environmental\naspects/impact.\n 1.2 Industrial standard/environmental practices are described\naccording to the different environmental concerns.\n 2. Implement specific\nenvironmental\nprograms.\n2.1 Programs/Activities are identified according to organizations\npolicies and guidelines.\n2.2 Individual roles/responsibilities are determined and performed\nbased on the activities identified.\n 2.4 Problems/ constraints encountered are resolved in accordance with\norganizations’ policies and guidelines\n 2.5 Stakeholders are consulted based on company guidelines.\n\n 3. Monitor activities on\nenvironmental\nprotection /programs\n 3.1 Activities are periodically monitored and evaluated according to\nthe objectives of the environmental program\n 3.2 Feedback from stakeholders are gathered and considered in\nproposing enhancements to the program based on consultations\n 3.3 Data gathered are analyzed based on evaluation requirements\n 3.4 Recommendations are submitted based on the findings.\n3.5 Management support systems are\n set/established to sustain and enhance the program\n3.6 Environmental incidents are monitored and reported to\nconcerned/proper authorities.\n\n--- PDF PAGE 53 ---\nTR Dental Technology NC IV\n\n49\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n\n 1. Legislations/Conventions\n May include but are not limited to:\n 1.1 Clean Air act\n 1.2 Clean Water Act\n1.3 Solid Waste Management\n1.4 Montreal Protocol\n1.5 Kyoto Protocol\n\n 2. Environmental\naspects/impacts\n\n2.1 Air pollution\n2.2 Water pollution\n2.3 Noise pollution\n2.4 Solid waste\n2.5 Flood control\n2.6 Deforestation/Denudation\n2.7 Radiation/Nuclear /Radio Frequency/ Microwaves\n2.8 Situation\n2.9 Soil erosion (e.g. Quarrying, Mining, etc.)\n2.10 Coral reef/marine life protection\n\n 3. Industrial standards/\nEnvironmental practices\n\n3.1 ECC standards\n3.2 ISO standards\n3.3 company environmental management systems (EMS)\n\n 4. Periodic\n\n4.1 hourly\n4.2 daily\n4.3 weekly\n4.4 monthly\n4.5 quarterly\n4.6 yearly\n\n 5. Programs/Activities\n\n5.1 Waste disposal (on-site and off-site)\n5.2 Repair and maintenance of equipment\n5.3 Treatment and disposal operations\n5.4 Clean-up activities\n5.5 Laboratory and analytical test\n5.6 Monitoring and evaluation\n 5.7 Environmental advocacy programs\n\n--- PDF PAGE 54 ---\nTR Dental Technology NC IV\n\n50\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n Assessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of environmental legislations and local\nordinances according to the different environmental issues/concerns.\n1.2 Described industrial standard environmental practices according to the\ndifferent environmental issues/concerns.\n1.3 Resolved problems/ constraints encountered based on management\nstandard procedures\n1.4 Implemented and monitored environmental practices on a periodic\nbasis as per company guidelines\n1.5 Recommended solutions for the improvement of the program\n1.6 Monitored and reported to proper authorities any environmental\nincidents\n 2. Underpinning\nknowledge\n2.1 Features of an environmental management strategy\n2.2 Environmental issues/concerns\n2.3 International Environmental Protocols (Montreal, Kyoto)\n2.4 Waste minimization hierarchy\n2.5 Environmental planning/management\n2.6 Community needs and expectations\n2.7 Resource availability\n2.8 Environment-friendly/environmental advocates\n2.9 5S of Good Housekeeping\n2.10 3Rs – Reduce, Reuse & Recycle\n 2.11 Sanitary Code\n 2.12 Environmental Code of practice\n 3. Underpinning\n skills\n3.1 Communicating effectively\n3.2 Performing research and analysis\n3.3 Reading / interpreting data and information\n3.4 Problem solving\n 4. Resource\nimplications\n The following resources MUST be provided:\n4.1 Workplace/Assessment location\n4.2 Legislation, policies, procedures, protocols and local ordinances relating\nto environmental protection\n4.3 Case studies/scenarios relating to environmental protection\n 5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written/ Oral Examination\n5.2 Interview/Third Party Reports\n5.3 Portfolio (citations/awards from GOs and NGOs, certificate of training –\nlocal and abroad)\n 5.4 Simulations and role-plays\n 6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 55 ---\nTR Dental Technology NC IV\n\n51\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: MAINTAIN INSTRUMENTS AND EQUIPMENT IN WORK AREA\nUNIT CODE:\nHCS346201\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in\nmaintaining instruments and equipment in the work area.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to clean\nused items\n\n1.1\nSafe work practices and standard precautions are followed\nat all times in accordance with legislative and workplace\nguidelines.\n1.2\nSharps and sharps debris are disposed into a container and in\naccordance with workplace guidelines.\n1.3 Waste is segregated and disposed in accordance with\norganization and legislative guidelines.\n2. Clean and dry used\nitems\n2.1\nWorkflow protocols are maintained in instrument\nreprocessing area and in accordance with workplace\nguidelines.\n2.2\nInstruments are prepared for cleaning and in accordance\nwith workplace guidelines.\n2.3\nAppropriate cleaning agents are selected and used in\naccordance with workplace guidelines and manufacturer’s\nspecification.\n2.4\nCleaning methods that avoid the generation of aerosols are\nused in accordance with workplace guidelines.\n2.5\nInstruments are dried and inspected for damage and\nremaining debris and in accordance with workplace\nprocedures.\n2.6\n Cleaning process is monitored in accordance with\nworkplace guidelines.\n3. Prepare and pack\nitems for storage\n\n3.1 Instruments with hinges or ratchets are opened and unlocked\nin accordance with standard operating procedures.\n3.2\nInstrument trays are prepared in accordance with workplace\nprotocols.\n3.3\nCritical site instruments are packaged or wrapped in a\nmanner that prevents damage to delicate items.\n\n--- PDF PAGE 56 ---\nTR Dental Technology NC IV\n\n52\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safe work practices\n\nMay include but are not limited to:\n1.1\nTreatment of all items as a potential source of infection\n1.2\nPersonal hygiene practices especially washing and drying\nhands\n1.3\nWork practices for the safe handling of sharps\n1.4\nWork practices for the safe disposal of sharps and other\nclinical waste\n1.5\nThe use of personal protective equipment:\n1.5.1 heavy duty gloves\n1.5.2 mask and protective eyewear\n1.5.3 hair protection or covering\n1.5.4 protective clothing and safety footwear\n1.6 Safe handling, storage and disposal of chemicals\n1.7 Safe handling techniques especially as they relate to lifting\nand handling dangerous and contaminated items\n2. Legislative and\nworkplace guidelines\nMay include:\n2.1 Infection control guidelines for the transmission of infectious\ndiseases in the health care setting\n2.2\nState legislative requirements\n2.3\nOrganization infection control policies and procedures\n2.4\nOccupational Health and Safety policies and procedures\n2.5\nMaterial Safety Data Sheets for the chemicals used\n3. Waste\nMay include but is not limited to:\n3.1\nClinical waste:\n3.1.1 discarded sharps\n3.1.2 human tissues\n3.1.3 laboratory waste\n3.1.4 any other waste as specified by the workplace\n3.2\nRelated waste:\n3.2.1 radiographic waste\n3.2.2 chemical waste\n3.2.3 metal alloy waste\n3.3\nGeneral waste\n4. Disposal of waste\nrequirements\nMay include:\n4.1\nDisposal in accordance with:\n4.1.1 Environment Protection Policy (Waste Management)\n4.1.2 Environment Protection Regulations (Waste\nManagement)\n4.2\nOrganization policy\n5. Work flow protocols\nMay include:\n5.1\nSeparate hand washing facilities\n5.2\nSink suitable for disposal of liquid waste\n5.3\nOne direction flow of instruments from contaminated to clean\nto sterile\n5.4\nDesignated work area that is physically separate to prevent\npossible contamination of processed items\n5.5\nIdentification and reporting of disruptions to work flow\nprotocols in accordance with workplace procedures\n\n--- PDF PAGE 57 ---\nTR Dental Technology NC IV\n\n53\n\nVARIABLE\nRANGE\n6. Preparation of\ninstruments for\ncleaning\n\nMay include:\n6.1\nSorting according to type of instrument and corresponding\ncleaning method\n6.2 Written procedures for handling specialized items\n6.3\nDisassembly of instruments where possible for detergent to\nreach all surfaces\n6.4 Checking for instrument defects, damage and missing parts\n7. Selection and use of\nappropriate cleaning\nagents\nMay include:\n7.1 Meeting requirements of Product Data Bulletins and Materials\nSafety Data Sheets for the chemicals used\n8. Cleaning methods\nMay include:\n8.1 Initial treatment of used instruments close to their point of use\nto decrease bio burden\n8.2 Thermal washer/disinfector in accordance with current\nstandards\n8.3\nUltrasonic cleaner in accordance with current standards\n8.4\nManual cleaning\n9. Monitoring the\ncleaning process\nMay include:\n9.1 Visual inspection of all items for cleanliness and absence of\ndetergent or rinse additive residues\n9.2 Daily cleaning and maintenance of ultrasonic cleaner and\nwasher/disinfector\n9.3\nDaily performance testing of ultrasonic cleaner\n9.4\nDaily checks of washer/disinfector function and detergent\ndispenser\n10. Critical site\ninstruments\nMay include:\n10.1 Instruments which must be cleaned and disinfected as\nneeded\n11 Routine cleaning and\nchecking of\nsterilizers\nMay include but is not limited to:\n11.1 Daily checks:\n11.1.1 floor of sterilizer is free of debris\n11.1.2 chamber drain and filter are clear\n11.1.3 recording devices, gauges and timers are functioning\ncorrectly\n11.1.4 water reservoir (portable benchtop sterilizers) emptied,\ncleaned and refilled with distilled water\n11.1.5 door seals are intact\n11.2 Cleaning:\n11.2.1 loading tray and external surfaces cleaned daily\n\n--- PDF PAGE 58 ---\nTR Dental Technology NC IV\n\n54\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFollowed safe handling, drying and cleaning protocols\n1.2\nFollowed correct packing, assembly and wrapping procedures\nand storage\n1.3\nFollowed appropriate OH&S procedures\n2. Underpinning\nknowledge\n2.1\nWorkflow protocols in the instrument reprocessing area\n2.2\nWorkplace procedures for using an ultrasonic cleaner\n2.3\nWorkplace procedures for manual cleaning\n2.4\nInstrument maintenance checklists\n3. Underpinning skills\n3.1\nFollowing safe work practices and applying standard\nprecautions during cleaning and preparation of items:\n3.1.1 checking items for defects after cleaning\n3.1.2 selecting and safely using appropriate cleaning agents\n3.1.3 selecting and wearing appropriate personal protective\nequipment\n3.2\nMaintaining workflow protocols in instrument reprocessing\narea from contaminated to clean and disinfect\n3.3\nOperating mechanical cleaners including ultrasonic cleaner or\nsteamer\n3.4\nDrying items before packaging\n3.5\nStoring packaged items in a clean place away from sources of\nmoisture and contamination\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 59 ---\nTR Dental Technology NC IV\n\n55\n\nUNIT OF COMPETENCY:\nASSIST IN DENTAL LABORATORY PROCEDURES\nUNIT CODE:\nHCS346202\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in\nassisting in dental laboratory procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow dental\nlaboratory\nprocedures\n1.1\nPlanned procedure is identified correctly.\n1.2\nEquipment, instruments and materials is anticipated and\nselected for the planned procedure and arranged them in their\nlikely order of use.\n2. Use dental laboratory\nterminology in\ncommunication\n5.2\nDental terminology is used in communicating with the dental\nteam.\n5.3\nDental terminology is used in receiving, understanding and\ndocumenting written and oral instructions.\n5.4\nFrequently used abbreviations and symbols in dental\nlaboratory are understood.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Equipment,\ninstruments,\nmaterials\nMay include but are not limited to:\n1.1\nHand Instruments\n1.2\nLaboratory Equipment\n1.3\nLaboratory Materials\n2 Personal Protective\nEquipment\nMay include but are not limited to:\n2.1\nGowns and waterproof aprons\n2.2\nGlasses, goggles or face-shields\n2.3\nFace masks\n\n--- PDF PAGE 60 ---\nTR Dental Technology NC IV\n\n56\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nComplied consistently with occupational health and safety\npolicies of OHSS\n1.2\nDemonstrated consistent performance in the following\nworkplace situations such as:\n1.2.1 Maintenance and storage of instruments, equipment\nand materials in accordance with manufacturer\nspecifications and operator’s requirements\n1.2.2 Compliance with occupational health and safety\nprocedures\n1.2.3 Storage of materials in accordance with manufacturer\nspecifications and operator’s requirements\n1.2.4 Maintenance of records of maintenance procedures\nand processes\n\n2. Underpinning\nknowledge\n\n2.1\nFundamental knowledge of oral anatomy including:\n2.1.1 Structure and functions of teeth and the periodontal\ntissues\n2.1.2 Structures of the oral cavity\n2.1.3 Tooth identification\n2.2\nDental laboratory records and laboratory prescriptions\nincluding:\n2.2.1 knowledge of correct dental terminology and how it is\nused in dental laboratory prescription items that\nconstitute a dental laboratory record\n2.2.2 Dental notation systems and prescription symbols\n2.2.3 Confidentiality of prescriptions\n2.2.4 The purpose of study casts and the materials used in\ntheir fabrication\n2.3 Fundamental knowledge of dental laboratory materials\n2.4\nDental laboratory practice/organization policies and\nprocedures\n\n--- PDF PAGE 61 ---\nTR Dental Technology NC IV\n\n57\n\n3. Underpinning skills\n\n3.1\nConsistently using safe work practices to minimize the risk of\ntransmission of infection including:\n3.1.1 Following the procedure for washing and drying of\nhands\n3.1.2 Putting into practice cleaning techniques\n3.1.3 Using personal protective equipment\n3.1.4 Limiting contamination\n3.1.5 Protecting materials, equipment and instruments from\ncontamination until required for use\n3.2\nUsing literacy skills to read and follow directions, policies and\nprocedures including:\n3.2.1 Occupational health and safety policies and procedures\n3.2.2 Infection control policies and procedures\n3.2.3 Practice policies and procedures\n3.3\nConsistently following sequenced written instructions and\nmanufacturer specifications for the preparation of dental\nlaboratory materials\n3.4\nConsistently demonstrating interpersonal skills when relating\nto people from a range of social, cultural and religious\nbackgrounds and physical and mental abilities.\n3.5\nConsistently demonstrating communication skills as required\nin fulfilling the job role as specified by the dental laboratory\npractice /organization including:\n3.5.1 Negotiation\n3.5.2 Asking questions\n3.5.3 Active listening\n3.5.4 Asking for clarification from client and /or carer\n3.5.5 Acknowledging and responding to a range of views\n3.6\nConsistently dealing with conflict\n3.7\nConsistently working with others and displaying empathy with\nclient and relatives\n3.8\nConsistently using problem solving skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate supplies and materials\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 62 ---\nTR Dental Technology NC IV\n\n58\n\nUNIT OF COMPETENCY:\nASSIST WITH ADMINISTRATION IN DENTAL LABORATORY\nPRACTICE\nUNIT CODE:\nHCS346203\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in\nmanaging appointments to suit the client and the organization, to\nrecord and reconcile payments and to maintain client record.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\neffectively with\nclients and other\npersons\n\n1.1\nClients and other visitors are greeted appropriately.\n1.2\nAn appropriate environment is made available for the client to\ncomplete medical, dental and financial details.\n1.3\nClient and/or carer point of view is listened carefully.\n1.4\nInformation provided to client and/or carer appropriately and\nlanguage used completely so that it can easily be understood.\n1.5\nClient and/or carer ensured they understood information\nprovided to them.\n1.6\nBeing polite and negative comments avoided shows empathy\nand respect for client and/or carer.\n2. Respond\nappropriately to\nenquiries from\nclients and visitors\n2.1\nPersonal dress and presentation is maintained.\n2.2\nCommunication equipment is used effectively.\n2.3\nEnquiries are responded promptly, politely and ethically.\n2.4\nPurpose of an enquiry, the identity of the person is determined\nand relevant record/s retrieved if required.\n2.5\nMessages prioritized and recorded legibly and accurately.\n2.6\nEnquiries outside area of responsibility are referred to\nappropriate supervisor.\n2.7\nElectronic communication with clients and /or carers is complied\nin accordance with organizational protocols.\n2.8\nConfidentiality of information relating to clients, staff and the\ndental practice/organization is maintained.\n3. Allocate\nappointments\nappropriate to\nclient and\norganization\nrequirements\n3.1\nClient’s appointment requirements are identified.\n3.2\nAppointment time is set in accordance with the client’s\npreferences and the organization’s requirements.\n3.3\nAppointment details are recorded accurately and legibly using\nstandard dental notation in the organizations appointment\nsystem.\n3.4\nCopy of appointment details is provided to the client.\n3.5\nAppointment schedules are monitored; clients and the oral health\ncare team are notified of any necessary changes within a\nsuitable timeframe.\n4. Calculate and\nrecord basic\nfinancial\ntransactions\n4.1\nPetty cash vouchers and all monies are completed accurately\nand account for.\n4.2\nCorrect fees are calculated.\n4.3\nGST applied in accordance with identified requirements.\n4.4\nPayments received are checked and recorded legibly and\naccurately.\n4.5\nChecks and credit card vouchers are validated\n4.6\nClient is provided with a receipt.\n\n--- PDF PAGE 63 ---\nTR Dental Technology NC IV\n\n59\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5. Handle cash and\nrecord financial\ntransactions\n5.1\nBalances accurately monies received against records of\npayment in accordance with organization policies\n5.2\nCash is secured in an approved location.\n5.3\nSuspected breaches of security are responded and\nappropriate action taken within minimum delay in accordance\nwith organization policies.\n5.4\nRecord of bad debts identified and appropriate action taken in\nline with office procedures.\n5.5\nBanking procedures are followed in accordance with\norganization policies.\n6. Maintain client\nrecords\n6.1\nCorrect client files are removed and appropriate fees and\ndiagnostic records attached.\n6.2\nOrder of payment is placed in files.\n6.3\nInformation entered legibly, accurately and updated as\nappropriate\n6.4\nClient’s dental records are filed correctly after use\n6.5\nRecords of laboratory work are maintained up-to-date,\naccurate, legible and complete\n7. Assist with client\nrecalls\n7.1\nKnowledge of client recall system is applied\n7.2\nClient records is marked with relevant recall date as\nappropriate and as directed by the operator\n7.3\nClients who are due for recall are identified and notified them\nthat an appointment is due\n7.4\nClients who do not respond to a recall appointment request\nare followed-up with courtesy\n\n--- PDF PAGE 64 ---\nTR Dental Technology NC IV\n\n60\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Communication\nequipment\nMay include but are not limited to:\n1.1 Telephone/Mobile Phone\n1.2 Facsimile\n1.3\nE-mail/Website\n2. Maintaining\nconfidentiality\nMay include but are not limited to:\n2.1 Public environments\n2.2 Legal and ethical requirements\n2.3 Writing personal details such as medical and dental histories\nand consent forms\n2.4 Conversations on the telephone/mobile phone\n2.5 Secure location for written records\n2.6 Offering a private location for discussion\n2.7 Information disclosed to an appropriate person consistent with\nthe responsibility of a dental assistant\n3 Appointment\nrequirements\nMay include but are not limited to:\n3.1 Appointment requirements of the client:\n3.1.1\nRoutine examination\n3.1.2\nDefined procedures\n3.1.3\nEmergencies\n3.2 Special requirements of the dental practice:\n3.2.1\nTiming requirements for different types of procedures\n3.2.2\nAvailability of staff\n3.3\nScheduling a series of appointments\n4. Recording of\nappointment details\nMay include:\n4.1 Manual – appointment book\n4.2 Electronic – computer based program\n4.3 Appointment details include the following:\n4.3.1\nClient’s name\n4.3.2\nClient’s contact details\n4.3.3\nProcedure to be performed for that appointment\n5. Dental records\nMay include but are not limited to:\n5.1 Dental charts and dental treatment records\n5.2 Completed medical questionnaires\n5.3 Consent documents obtained for treatment\n5.4 Radiographs, tracings and measurements\n5.5 Diagnostic models\n5.6 Photographs\n5.7 Records of financial transactions\n5.8 Notes made by staff following telephone conversations\n5.9 Reports to and from referring dentists and specialists\n5.10 Copies of correspondence relating to the client\n6. Recall system\nMay include:\n6.1 Manual\n6.2 Electronic\n\n--- PDF PAGE 65 ---\nTR Dental Technology NC IV\n\n61\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied consistently with infection control guidelines of DOH\nand occupational health and safety policies of OHSS\n1.2 Demonstrated consistent performance in the following workplace\nsituations such as:\n1.2.1 Responding to a variety of requests for information from\na range of persons\n1.2.2 Accurate calculation of fees\n1.2.3 Recording of financial transactions in accordance with\ndental practice/organization requirements\n1.2.4 Assist with management of an effective appointment and\nrecall system\n1.2.5 Recording, labeling and filing forms and records in\naccordance with legislation and the dental practice /\norganization policies\n\n2. Underpinning\nknowledge\n\n2.1 Dental terminology:\n2.1.1 Abbreviations and symbols used when recording dental\ntreatment\n2.1.2 FDI notation system used to designate the permanent\nand deciduous teeth during examination and charting\n2.1.3 Palmer notation system used to designate the permanent\nand deciduous teeth during examination and charting\n2.1.4 Community periodontal index\n2.1.5 Symbols used during charting of individual\n\n2.2 Handling and recording financial transactions:\n2.2.1 Itemizing of client accounts\n2.2.2 Issuing invoices\n2.2.3 Recording of payments and issuing receipts\n2.2.4 The different methods of payment\n2.2.5 The details that need to be recorded and checked for\ncredit and/or debit cards and check payments\n2.2.6 Operating a petty cash system\n2.2.7 Organization policy on banking and handling of cash\nsecurely\n\n2.3 Legal requirements\n2.3.1 The reasons for ensuring the confidentiality of\ninformation provided by the client\n2.3.2 Confidentiality requirements for the recording and\nstorage of client records\n2.3.3 The requirements of the Health Privacy Principle and\ntheir application to the collection of information by the\ndental practice or organization\n\n--- PDF PAGE 66 ---\nTR Dental Technology NC IV\n\n62\n\n2.4 Appointments:\n2.4.1 The time requirements of different treatment procedures\nand the effect this has on appointment scheduling\n2.4.2 The particular needs which clients may have for the\ntiming of appointments\n2.4.3 The dentists preferred work routine\n2.4.4 The time constraints imposed by the dental laboratory\n2.4.5 The relevant details that must be entered into the\nappointment system and the written confirmation that\nmust be provided to the client\n2.4.6 The action that must be taken for broken and/or\ncancelled appointments\n2.4.7 Confirmation of appointments\n\n2.5 Recall appointment\n2.5.1 Methods used by the dental practice or the organization\nto identify those clients who require either recall\nexamination or follow-up treatment\n2.5.2 Methods used to follow-up clients who do not respond to\nrecall\n\n3. Underpinning skills\n3.1 Using available technology and software for recording\nappointments and payments\n3.2 Using oral communication skills required to fulfill the job role as\nspecified by the dental practice/organization\n3.2.1 Negotiation\n3.2.2 Asking questions\n3.2.3 Active listening\n3.2.4 Asking for clarification from caller or client\n3.2.5 Acknowledging and responding to a range of views\n3.3 Using literacy skills to read and following directions, policies and\nprocedures\n3.3.1 Occupational health and safety policies and procedures\n3.3.2 Infection control policies and procedures\n3.3.3 Practice/Organization policies and procedures\n3.4 Using numeracy skills\n3.4.1 Basic mathematical calculations such as addition,\nmultiplication and calculations of percentages\n3.4.2 Handling and recording of basic financial calculations\n3.5 Selecting and applying procedures to perform a range of tasks;\nfollowing sequenced written instructions, recording accurately\nand legibly client details\n3.6 Dealing with conflict\n3.7 Using problem solving skills required including using available\nresources, prioritizing appointments and assessing urgency of\ncalls\n\n--- PDF PAGE 67 ---\nTR Dental Technology NC IV\n\n63\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.4 Appropriate supplies and materials\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 68 ---\nTR Dental Technology NC IV\n\n64\n\nUNIT OF COMPETENCY:\nAPPLY QUALITY STANDARDS\nUNIT CODE:\nHCS315202\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills, attitudes and values needed\nto apply quality standards in the workplace. The unit also includes\nthe application of relevant safety procedures and regulations,\norganization procedures and customer requirements.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials\n1.1. Work instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2. Received materials are checked against workplace standards\nand specifications.\n1.3. Faulty materials related to work are identified and isolated.\n1.4. Faults and any identified causes are recorded and/or reported\nto the supervisor concerned in accordance with workplace\nprocedures.\n1.5. Faulty materials are replaced in accordance with workplace\nprocedures.\n2. Assess own work\n2.1. Documentation relative to quality within the company is\nidentified and used.\n2.2. Completed work is checked against workplace standards\nrelevant to the task undertaken.\n2.3. Errors are identified and isolated.\n2.4. Information on the quality and other indicators of production\nperformance are recorded in accordance with workplace\nprocedures.\n2.5. In cases of deviations from specific quality standards, causes\nare documented and reported in accordance with the\nworkplace’ s standards operating procedures.\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated in relative to\nworkplace assignment.\n3.2. Work is carried out in accordance with process improvement\nprocedures.\n3.3. Performance of operation or quality of product of service to\nensure customer satisfaction is monitored.\n\n--- PDF PAGE 69 ---\nTR Dental Technology NC IV\n\n65\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Materials\n1.1\nMaterials may include but not limited to:\n1.1.1. Manuals\n1.1.2. Job orders\n1.1.3. Instructional videos\n2 Faults\n2.1\nFaults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated information\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any regulatory\nagencies\n3 Documentation\n3.1\nOrganization work procedures\n3.2\nManufacturer’s instruction manual\n3.3\nCustomer requirements\n3.4\nForms\n4 Errors\n4.1 Errors may be related but not limited to the following:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the organization\n5 Quality standards\n\n5.1 Quality standards may be related but not limited to the\nfollowing:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1\nCo-worker\n6.2\nSupplier/Vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 70 ---\nTR Dental Technology NC IV\n\n66\n\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s standard\noperating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with standard\noperating procedures\n1.4 Carried out work in accordance with the process improvement\nprocedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and products\n2.2 Characteristics of materials, software and hardware used in\nproduction processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production processes\n2.6 Fault identification and reporting\n2.7 Quality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply defined\nwork procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5 Solution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to objectively evaluate\nthe candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4 Practical demonstration\n5 Resource implication\nMaterials, software and hardware to be used in a real or simulated\nsituation\n6 Context of\nAssessment\nAssessment may be conducted in the workplace or in a simulated\nenvironment\n\n--- PDF PAGE 71 ---\nTR Dental Technology NC IV\n\n67\n\nUNIT OF COMPETENCY:\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS AND\nCUSTOMERS\nUNIT CODE:\nHCS516201\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes and values\nrequired in building and maintaining an effective relationship with\nclients, customers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a clean and\nhygienic environment\n\n1.1\nUniform and personal grooming maintained to assignment\nrequirements.\n1.2\nPersonal presence maintained according to employer\nstandards.\n1.3\nVisible work area kept tidy and uncluttered.\n1.4\nEquipment stored according to assignment requirements.\n\n2. Meet client/customer\nrequirements\n\n2.1\nClient requirements identified and understood by referral to\nassignment instructions.\n2.2\nClient requirements met according to the assignment\ninstructions.\n2.3\nChanges to client’s needs and requirements monitored and\nappropriate action taken.\n2.4\nAll communication with client or customer is cleared and\ncomplied with assignment requirements.\n\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2\nPossible causes of client/customer dissatisfaction identified,\ndealt with recorded according employer policy.\n3.3\nClient fully informed of all relevant matters in a timely manner\nand according to agreed reporting procedures.\n\n--- PDF PAGE 72 ---\nTR Dental Technology NC IV\n\n68\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\nMay include but not limited to:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanor\n1.5\nGrooming\n\n 2. Employer Standards\nMay include but not limited to:\n2.1\nStanding Orders\n\n3. Client Requirements\nMay include but are not limited to:\n3.1\nAssignment instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n\n5. Client Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment instructions\n5.2\nDiscussion with the client/customer\n\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferring to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n6.4\nHazard reports\n\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 73 ---\nTR Dental Technology NC IV\n\n69\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image\n1.2\nInterpreted client/customer requirements from information\n1.3\nDealt successfully with a variety of client/customer interactions\n1.4\nMonitored and acted on changing client or customer needs\n1.5\nMet client/customer requirements\n1.6\nBuilt credibility with customers/client\n2. Underpinning\nknowledge\n2.1\nUniform and personal grooming requirements of the employer\n2.2\nOccupational health and safety requirement for the\nassignment\n2.3\nAssignment Instructions\n3. Underpinning skills\n3.1 Attention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer\nneeds\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and Negotiation\n3.8\nMaintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers/customers’ instructions\n4.9\nAssessment instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 74 ---\nTR Dental Technology NC IV\n\n70\n\nUNIT OF COMPETENCY:\nMANAGE OWN PERFORMANCE\nUNIT CODE:\nHCS516202\nUNIT DESCRIPTOR:\nThis unit of competency covers the knowledge, skills and attitudes\nin effectively managing own workload and quality work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever possible.\n1.5\nWork schedules are known and completed with agreed time\nframes.\n1.6\nWork plans developed according to assignment requirements\nand employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility for\ncompletion passed to incoming shift or other appropriate\npersons.\n\n2. Maintain quality of\nperformance\n2.1\nPersonal performance continually monitored against agreed\nperformance standards.\n2.2\nAdvice and guidance sought when necessary to achieve or\nmaintain agreed standards.\n2.3\nGuidance from management applied to achieve or maintain\nagreed standards.\n2.4\nStandard of work clarified and agreed according employer\npolicy and procedures.\n\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.2\nPossible causes of client/customer dissatisfaction identified,\ndealt with, recorded and in accordance with employer policy.\n3.3\nClient fully informed of all relevant matters in a timely manner.\n\n--- PDF PAGE 75 ---\nTR Dental Technology NC IV\n\n71\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n1.1\nMay be identified through:\n1.1.1 Assignment Instructions\n1.1.2 Verbal Instructions by Senior Staff\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n\n2. Performance\nStandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 76 ---\nTR Dental Technology NC IV\n\n72\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified time\nframe\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge\n2.1\nSight and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills\n3.1\nCapacity to plan and prioritize work loads and requirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3 Observation with questioning\n5.4 Oral questioning/Interview\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 77 ---\nTR Dental Technology NC IV\n\n73\n\nUNIT OF COMPETENCY:\nFOLLOW OCCUPATIONAL HEALTH AND SAFETY POLICIES IN\nDENTAL LABORATORY FACILITIES\nUNIT CODE:\nHCS346204\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in\napplying relevant OHS legislation and codes of practice, including\nduties and responsibilities for all parties under general duty of care.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nFollow workplace\nprocedures for\nhazard identification\nand risk control\n\n1.1\nHazards in the work area are recognized and reported to\nsupervisor in accordance with workplace procedures.\n1.2\nWorkplace procedures and work instructions for\ncontrolling risks, including infection control, are followed\naccurately.\n1.3\nWorkplace procedures for dealing with accidents, fires and\nemergencies are followed where necessary.\n2\nContribute to the\nmanagement of\nOHS\n2.1\nOHS issues are raised with designated personnel and co-\nworkers as appropriate.\n2.2\nContributions are made as appropriate to workplace OHS\ndiscussions.\n3\nUtilize and\nimplement\nstrategies as\ndirected to prevent\ninfection in the\nworkplace\n3.1\nThe environment is kept clean and tidy.\n3.2\nPersonal hygiene practices are followed.\n3.3\nAny items that may be contaminated are disposed of safely.\n4\nUtilize strategies to\nprevent stress\noverload\n4.1\nNominated rest time and breaks are taken.\n4.2\nSources of stress are identified and issues raised with\nsupervisor.\n4.3\nWork roles are clarified and followed.\n5\nWork in a safe\nmanner\n5.1\nDefined procedures are followed to ensure personal safety.\n5.2\nAll work is carried out in a manner which ensures safety\nof self and others\n5.3\nOrganizational security measures are followed.\n5.4\nSafe manual handling procedures are followed.\n\n--- PDF PAGE 78 ---\nTR Dental Technology NC IV\n\n74\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nWorkplace\nprocedures for\ncontrolling risks\n\nMay include:\n1.1\nManual handling techniques\n1.2\nSafe handling, storage and disposal of inflammable or\npotentially dangerous substances\n1.3\nStrategies for reducing the amount of manual handling\nrequired\n2.\nStress\nMay include:\n2.1\nHealth problems\n2.2\nChanges in behavior\n2.3\nFrequent absences\n2.4\nNegative attitudes\n2.5\nUnawareness of own stress levels\n3.\nRest time and\nbreaks\nMay include:\n3.1\nMorning and afternoon tea, lunch, dinner breaks\n4.\nWorkplace\nprocedures\nMay include:\n4.1\nGrievance procedures\n4.2\nTeam meetings\n4.3\nIncident reports\n4.4\nDebriefing procedures following crisis\n4.5\nSmoke free environment\n5.\nItems that may be\ncontaminated\nMay include:\n5.1\nWork surfaces\n5.2\nClothing\n6.\nWorking in a\nmanner that\nensures personal\nsafety\nMay include:\n6.1\nCarrying communication equipment\n6.2\nUsing personal protection equipment\n6.3\nSafe work practices for handling sharps and other hazards in\ndental laboratory practice\n6.4\nCarrying alarms\n6.5\nMaintaining infection control in dental laboratory practice\n7.\nOrganizational\nsecurity measures\nMay include:\n7.1\nLocking doors\n7.2\nAlarm system\n7.3\nContracted security personnel\n\n--- PDF PAGE 79 ---\nTR Dental Technology NC IV\n\n75\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nWorked safely and followed OHS policies and procedures in\ndental laboratory practice\n1.2\nComplied with DOH infection control guidelines\n1.3\nContributed to the management of OHS\n1.4\nUtilized and implemented strategies as directed to prevent\ninfection in the workplace\n1.5\nUtilized strategies to prevent stress overload\n1.6\nWorked in a safe manner\n2. Underpinning\nknowledge\n2.1\nCompliance with OHS policy and procedures and infection\ncontrol guidelines and procedures\n2.2\nKnowledge of potential hazards in the workplace\n2.3\nKnowledge of laboratory waste disposal methods\n2.4\nKnowledge of personal hygiene and personal protection\nincluding immunization\n2.5\nKnowledge of legislative requirements and best practice\napproaches to OHS\n2.6\nEmergency procedures\n3. Underpinning skills\n3.1\nManual handling techniques\n3.2\nSafe handling techniques\n3.3\nCorrect use of equipment, instruments and materials in\naccordance with manufacturer specifications\n3.4\nTechnology used to work safely and competently\n3.5\nSafe work practices to prevent or minimize risk\n3.6\nReading and writing skills\n3.7\nOral communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational policies and\nprocedures manuals such as:\n4.1.1 Incident reporting procedures\n4.1.2 OHS policy and procedures\n4.1.3 Infection control guidelines (DOH)\n4.1.4 Waste management policies\n4.1.5 Relevant state legislation\n4.1.6 Manufacturer’s instructions for the use of relevant\nequipment, instruments and materials\n4.1.7 Material Safety Data Sheets (MSDs)\n5\nMethod of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nPortfolio\n5.4\nThird Party Report\n6\nContext of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 80 ---\nTR Dental Technology NC IV\n\n76\n\nUNIT OF COMPETENCY:\nMAINTAIN INFECTION CONTROL IN DENTAL LABORATORY\nPRACTICE\nUNIT CODE:\nHCS346205\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\ncomply with infection control procedures before, during and after\nhealth care procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nMonitor and\nmaintain the\ncleanliness of the\ndental laboratory\n\n1.1\nAppropriate personal protective wear is used during cleaning\nof equipment and surfaces.\n1.2\nAppropriate disinfectants and cleaning equipment are\nselected, prepared and used on surfaces in accordance with\nthe manufacturer’s specification.\n1.3\nUsed surface covers, if applicable, are removed and replaced\nin a manner to prevent cross contamination.\n1.4\nCleaning equipment is correctly stored.\n1.5\nAll surfaces including internal storage units within the dental\nlaboratory are monitored and maintained for cleanliness.\n2\nClean and disinfect\ndental laboratory\n/instruments and\nequipment\n2.1\nDental laboratory instruments and equipment are cleaned of\nbio-burden and lubricated, where appropriate, prior to cleaning\nand disinfecting.\n2.2\nDental laboratory instruments and equipment are checked for\nfaults and disassembled where appropriate.\n2.3\nPrior to cleaning of dental laboratory instruments and\nequipment are loaded safely and effectively.\n2.4\nAppropriate cleaning procedures are carried out in the correct\nsequence and duration in accordance with manufacturer\nspecifications.\n2.5\nRegular maintenance program including faults and incidences\nare recognized, reported and documented.\n\n--- PDF PAGE 81 ---\nTR Dental Technology NC IV\n\n77\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3\nMaintain hygiene\nand personal\nprotection\n\n3.1\nHand washing procedures are correctly followed.\n3.2\nOpen cuts and abrasions are covered with a waterproof\ndressing.\n3.3\nAppropriate personal protection wear is correctly worn.\n3.4\nImmunization is undertaken in accordance with current\nrecommendations for dental health care worker.\n3.5\nAll work is carried out in a manner that minimizes the risk of\ncross contamination and complies with OHS policy and\nprocedures.\n3.6\nHazards in the dental laboratory is recognized and reported to\noperator.\n3.7\nAppropriate procedures for dealing with accidents, including\nsharp injuries, are followed correctly.\n4\nDispose of dental\nlaboratory waste\nsafely\n4.1\nAppropriate protective clothing is worn or used in accordance\nwith OHS policy and procedures when handling waste.\n4.2\nWaste is segregated, contained, stored and transported\ncorrectly.\n4.3\nDamaged and/or pre-packed items are disposed of safely.\n4.4\nWaste is disposed of safely.\n5\nUndertake the\nnecessary\nmeasures to ensure\nprevention of\ntransmission of\ninfection\n5.1\nRisks of cross contamination are identified and appropriate\nresponses implemented within dental practice.\n5.2\nClean, contaminated and administrative zones are clearly\nidentified and maintained.\n5.3\nInstruments, materials, medicaments and equipment are set\nup prior to commencement of treatment where appropriate.\n5.4\nOne-way workflow from clean to dirty zone is maintained.\n5.5\nRisk of transmission of infection is minimized in all dental\nlaboratory related and administrative procedures.\n5.6\nSpills are removed correctly.\n\n--- PDF PAGE 82 ---\nTR Dental Technology NC IV\n\n78\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nInfection control\nguidelines and\nprocedures\nMay include but are not limited to:\n1.1\nCurrent DOH guidelines for infection control in health care\nsettings\n1.2\nStandard Precautions and Additional Precautions as defined\nby DOH\n1.3\nDental laboratory practice/organizational policy procedures\nand infection control guidelines and procedures\n1.4\nMaterial Safety Data Sheets (MSDS)\n1.5\nLocal government ordinances\n1.6\nLegislative requirements\n2.\nPersonal protective\nwear\nMay include but not limited to:\n2.1\nSterile and non sterile gloves including heavy duty\n2.2\nMasks\n2.3\nEye protection\n2.4\nEnclosed footwear\n2.5\nGowns\n2.6\nAprons\n3.\nCleaning equipment\nMay include but is not limited to:\n3.1\nUltrasonic cleaner\n3.2\nManual cleaning with a range of brushes\n3.3\nDrying\n3.4\nBuckets and mops\n4\nWaste segregation\nMay include but is not limited to:\n4.1\nClinical and related waste\n4.2\nInfectious waste\n4.3\nSharps\n4.4\nGeneral waste\n4.5\nOther hazardous substances\n5\nRequirements for\nsafe disposal of\nwaste\nMay be determined by:\n5.1\nMain drainage\n5.2\nLocal government ordinances\n5.3\nMaterial Safety Data Sheet (MSDS)\n\n--- PDF PAGE 83 ---\nTR Dental Technology NC IV\n\n79\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of infection risks in health\nenvironment and specifically in dental laboratory practice\n1.2\nComplied with current DOH infection control guidelines and\nprocedures, OHS and legislative requirements\n1.3\nHandled waste safely managed procedures in accordance\nwith legislative requirements\n1.4\nSelected and used appropriate cleaning agents for particular\nsurfaces and equipment in accordance with the\nmanufacturer’s specifications\n2.\nUnderpinning\nknowledge\n2.1\nKnowledge on how infection is spread, cross infection and\nprevention strategies\n2.2\nKnowledge of relevant OHS policies and procedures\n2.3\nLimitations, properties and precautions required of\ndisinfectants and decontaminates\n2.4\nKnowledge of potential hazards in a health environment\n2.5\nKnowledge of currently available vaccinations against\ntransmissible disease\n2.6\nKnowledge of dental laboratory waste disposal methods\n3.\nUnderpinning skills\n3.1\nApplying standard and additional precautions\n3.2\nUsing safe work practices to minimize the risk of transmission\nof infection\n3.3\nSelecting and using appropriate chemicals in cleaning and\nsanitizing\n3.4\nUsing correct hand washing and hand care techniques\n3.5\nUsing correct hygiene procedures\n3.6\nSelecting and using equipment and cleaning agents effectively\n3.7\nUsing procedures appropriate to the cleaning area and\npurpose\n3.8\nMinimizing disruption to the work environment\n3.9\nMinimizing safety hazards for self and others\n3.10 Using time management strategies to set priorities\n3.11\nUsing technology to work safely and competently\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational policy and\nprocedures\n4.2\nIncident reporting procedures\n4.3\nOccupational health and safety policy and procedures\n4.4\nInfection control guidelines\n4.5\nWaste management policies\n4.6\nRelevant state legislations\n4.7\nManufacturer’s instructions for the use of relevant equipment,\ninstruments, medicaments, materials and Material Safety Data\nSheets (MSDS)\n4.8\nCleaning agents currently used in the workplace\n\n--- PDF PAGE 84 ---\nTR Dental Technology NC IV\n\n80\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nPortfolio\n5.5\nThird Party Report\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 85 ---\nTR Dental Technology NC IV\n\n81\n\nUNIT OF COMPETENCY:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE:\nICT311201\nUNIT DESCRIPTOR:\nThis unit defines the competency required to operate a personal\ncomputer by: starting the PC, logging in, using and working with\nfiles, folders and programs, saving work, and closing down the\nPC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1\nThe peripheral devices are properly connected\n1.2\nPower is checked and the computer and peripheral devices are\nswitched on\n1.3\nProper logging in and logging off is successfully done\n1.4\nThe operating system features and functions are accessed and\nnavigated\n1.5\nHardware configuration and other system features are checked\n2. Arrange and\ncustomize\ndesktop display/\nWindows\nsettings\n\n2.1\nThe desktop screen or Windows elements are changed as needed\n2.2\nDesktop icons are added, renamed, moved, copied or deleted\n2.3\nThe online help functions are accessed or used as needed\n2.4\nDesktop icons of application programs are selected, opened and\nclosed\n2.5\nProperties of icons are displayed\n2.6\nComputer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1\nA file or folder is created, opened, moved, renamed or copied\n3.2\nFiles are located, deleted and restored\n3.3\nDetails and properties of files and folders are displayed or viewed\n3.4\nVarious files are organized for easy lookup and use\n3.5\nFiles and information are searched\n3.6\nDisks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1\nApplication programs are added, changed, removed or ran\n4.2\nUser software or application program are installed, updated and\nupgraded\n4.3\nInformation/data are moved between documents or files\n5. Print\ninformation\n5.1\nPrinter is added or installed and correct printer settings is ensured\n5.2\nDefault printer is assigned accordingly\n5.3\nInformation or document is printed on the installed printer\n5.4\nProgress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1\nAll open application programs are closed\n6.2\nComputer and peripheral devices are properly shut down\n\n--- PDF PAGE 86 ---\nTR Dental Technology NC IV\n\n82\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Peripheral device\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n2. Computer\nMay include:\n2.1 Laptops/notebooks\n2.2 Workstations\n2.3 Servers\n2.4 other personal computer devices\n3. Application\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n4. Operating system\nMay include but is not limited to the various versions and variants of:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n\n5. System features\nMay include but is not limited to the operating system features and\nhardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n\n--- PDF PAGE 87 ---\nTR Dental Technology NC IV\n\n83\n\nVARIABLE\nRANGE\n6. Online help\nfunctions\n6.1 An instruction manual, or a portion of the manual, integrated and\naccessible from within the program or software being used.\n7. Properties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n8. Various files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n9. Disks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation.\n\n--- PDF PAGE 88 ---\nTR Dental Technology NC IV\n\n84\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof Competency\n1.1 Assessment must confirm the ability to utilize software, navigate\nthe desktop, using system features to perform tasks and save\nresults of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware components\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or disk\nstorage\n3.2 Mouse and keyboarding skills for running software applications\n3.3 Reading and writing at a level where basic workplace documents\nare understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions using a\npersonal computer whether standalone or in a networked\nenvironment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nwork environment.\n\n--- PDF PAGE 89 ---\nTR Dental Technology NC IV\n\n85\n\nCORE COMPETENCIES\nUNIT OF COMPETENCY:\nFABRICATE MODELS\nUNIT CODE:\nHCS322323\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in fabricating\nmodels.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Verify integrity of\nimpressions\n\n1.1\nImpression is disinfected according to Department of Health\nguidelines.\n1.2\nImpressions are examined for defects.\n1.3\nImpression is checked to ensure it meets the specifications of\nthe work.\n2. Select and prepare\nmodel materials\n2.1\nAppropriate materials are selected.\n2.2\nMaterials are prepared in accordance with desired outcome.\n3. Pour impressions\n3.1\nImpressions are prepared for pouring.\n3.2\nMaterials are poured into impressions in accordance with\naccepted techniques.\n3.3\nRequired setting time is allowed.\n5. Finish model\n\n4.1\nModel is recovered intact from impression.\n4.2\nModel is inspected for defects.\n4.3 Models a re trimmed according to requirements.\n\n5. Duplicate model\n5.1\nDuplicating materials are prepared according to\nmanufacturer’s instructions.\n5.2\nDuplicating materials are mixed according to manufacturer’s\ninstructions.\n5.3\nAn accurate, bubble free cast is produced.\n\n--- PDF PAGE 90 ---\nTR Dental Technology NC IV\n\n86\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Impression\n\nMay include but are not limited to:\n1.1\nEdentulous impression\n1.2\nDentulous impressions\n1.3\nPartially dentulous\n\n2. Pour materials into\nimpressions\n\nMay include but are not limited to:\n\n2.1\nRigid impression materials\n2.2\nAqueous elastomers\n2.3\nNon-aqueous elastomers\n3. Duplicating materials\nMay include but are not limited to:\n3.1 Stones\n3.2 Diestones\n3.4\nRefractories\n\n--- PDF PAGE 91 ---\nTR Dental Technology NC IV\n\n87\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nVerified integrity of impressions\n1.2\nSelected and prepared model materials\n1.3\nPoured impressions\n1.4\nFinished models\n1.5 Duplicated model\n1.6\nFollowed OH&S and Department of Health (DOH) infection\ncontrol guidelines\n2. Underpinning\nknowledge\n2.1\nKnowledge on basic oral anatomy and occlusion\n2.2\nKnowledge and application of basic hygiene and the\nimportance of maintaining clean equipment and working\nenvironment\n2.3\nRelevant material science for carrying out procedure\n2.4 Occupation Health and Safety and material safety datasheets\n2.5\nCurrent Department of Health infection control guidelines,\nuses and specifications of dental packaging equipment and\nrelated products\n2.6\nDental policies and procedures\n2.7\nIndustry codes of practice and relevant legislation\n\n3. Underpinning skills\n3.1\nCommunicating and interacting appropriately with colleagues,\nhealth care practitioners, other clients and patients\n3.2\nCommunicating ideas and information\n3.3\nMaintaining cleanliness\n3.4\nDemonstrating manual dexterity\n3.5\nWorking with others and in teams\n3.6\nPlanning and organizing activities\n3.7\nLanguage, literacy and numeracy skills appropriate to the job\nrole and function e.g. documenting packaging information and\nrecording procedures\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRelevant documentation such as:\n4.2.1 dental policies and procedures\n4.2.2 industry codes of practice and relevant legislation\n4.3\nAccess to a range of packaging equipment and related\nproducts\n4.4\nA qualified workplace assessor and/or technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 92 ---\nTR Dental Technology NC IV\n\n88\n\nUNIT OF COMPETENCY:\nFABRICATE CUSTOM IMPRESSION TRAYS\nUNIT CODE:\nHCS322324\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in fabricating\ncustom impression trays.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare model\n1.1\nWork is interpreted.\n1.2\nUndesirable undercuts are blocked out.\n1.3 Outline is marked and spacer is applied as required.\n2. Select and prepare\nmaterials\n2.1\nSelected materials are obtained and mixed in accordance with\nmanufacturer’s instructions.\n2.2 Equipment is prepared for processing.\n2.3\nMixing vessels and templates are provided.\n3. Fabricate custom\nimpression tray\n3.1\nMaterials are mixed or manipulated to desired outcome.\n3.2\nMaterial is adapted to the cast.\n3.3\nHandle is fabricated and attached as required.\n3.4\nCustom tray is processed in accordance with industry\nstandards.\n3.5\nOutline is trimmed.\n3.6\nSpacer material is removed.\n3.7\nOutline is refined and polished as required.\n3.8\nImpression tray is customized to particular impression\nmaterial requirements.\n3.9\nImpression tray is disinfected according to DOH guidelines.\n\n--- PDF PAGE 93 ---\nTR Dental Technology NC IV\n\n89\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Custom Trays\n\nTrays may be fabricated for:\n1.1\nFully edentoulous\n1.2\nPartially dentate\n1.3\nFully dentate\n1.4\nImplant cases\n\n2. Spacer materials\n\nA range of spacer materials may be used:\n2.1 Acrylic\n2.2 Thermoplastic\n2.3 Light-cured composite\n\n3. Impression tray\n\nMay include but are not limited to:\n3.1\nFull arch\n3.2\nAnterior\n3.3\nPosterior\n3.4\nQuadrant\n\n--- PDF PAGE 94 ---\nTR Dental Technology NC IV\n\n90\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model.\n1.2\nSelected and prepared materials\n1.3\nFabricated custom impression tray\n1.4\nFollowed OH&S and DOH infection control guidelines\n1.5\nIdentified oro-facial anatomy\n1.6\nFollowed different techniques in model fabrication\n2. Underpinning\nknowledge\n\nKnowledge on the following:\n2.1\nRelevant material science for carrying out procedures\n2.2\nModel fabrication techniques\n2.3\nOro-facial anatomy\n2.4\nCurrent infection control DOH guidelines\n2.5\nOHS and material data safety sheets\n2.6\nDental workplace policies and procedures\n2.7\nIndustry codes of practice, standards and guidelines\n2.8\nNational and local legislation where appropriate\n3. Underpinning skills\n3.1\nModel fabrication techniques\n3.2\nManual dexterity\n3.3\nThermo-forming technology\n3.4\nVisible light-cured techniques\n3.5 Planning and organizing work activities\n3.5\nLanguage, literacy and numeracy skills appropriate to the role\nand workplace requirements\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 Dental policies and procedures\n4.2.2 Industry codes of practice, standards and guidelines\n4.2.3 State legislation where appropriate\n4.3 Access to a range of customers with different requirements\n(real or simulated)\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 95 ---\nTR Dental Technology NC IV\n\n91\n\nUNIT OF COMPETENCY:\nFABRICATE REGISTRATION BITE RIMS\nUNIT CODE:\nHCS322325\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in fabricating\nregistration bite rims.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and prepare\nmaterials\n1.1\nAppropriate material for the base and rims is selected.\n1.2\nModel is prepared to enable appropriate application of\nselected base metal.\n2. Fabricate base\n2.1\nSelected base material is applied to model.\n2.2 Base material is processed in accordance with type of base\nmaterial selected.\n2.3\nBase material is trimmed to peripheral contours of model and\nappropriate landmarks.\n3. Fabricate registration\nbite rims\n3.1 Bite rim is fabricated in selected material.\n3.2\nBite rim is trimmed to prescribed dimensions and appropriate\nlandmarks.\n3.3 Bite rim is smoothed and polished in accordance with material\nchosen.\n4. Prepare face-bow (if\nrequired)\n5.1\nFace-bow fork is located in required position.\n5.2\nMaterial is selected as required by the presentation.\n5.3\nFace-bows are finished in accordance with acceptable industry\nstandard.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Appropriate materials\nfor base\n\nMay include but are not limited to:\n1.1 Wax\n1.2 Thermo-formed materials\n1.3 Light-cured composite\n1.4 Acrylic\n1.5 Cast metal framework\n\n--- PDF PAGE 96 ---\nTR Dental Technology NC IV\n\n92\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nSelected and prepared materials for fabrication of registration\nbite rim.\n1.2\nConstructed base and registration bite rim\n1.3\nPrepared face-bow (if required)\n1.4\nComplied with DOH infection control policies and procedures\n1.5\nFollowed OH&S policies\n\n2. Underpinning\nknowledge\n\n2.1\nRelevant material science for carrying out procedures\n2.2 Basic oral anatomy and occlusion\n2.3 Range of standard dimensions\n2.4\nApplication of registration bite rim\n2.5\nIndustry codes and practices\n2.6\nNational and local legislation as appropriate\n2.7\nHousekeeping/maintenance procedures\n\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nProcessing techniques\n3.4\nMaintaining personal hygiene\n3.5 Following correct measurements\n3.6\nPlanning and organizing work activities\n\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 97 ---\nTR Dental Technology NC IV\n\n93\n\nUNIT OF COMPETENCY:\nARTICULATE MODELS AND TRANSFER RECORDS\nUNIT CODE:\nHCS322326\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in articulating\nmodels and transferring records.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and prepare\narticulator\n1.1\nWork order requirements are confirmed.\n1.2\nArticulator is selected and adjusted as required.\n1.3\nMounting method to be used is identified in accordance with\nthe type of articulator.\n2. Select and prepare\nmaterials\n2.1\nModels and oral records are positioned in articulator.\n2.2 Mounting materials are prepared and applied to models.\n2.3 Centric records are established and secured.\n2.4 Excess material is removed in accordance with industry\nstandards\n2.5\nEquipment is cleaned in accordance with standard operating\nprocedures (SOPs).\n3. Transfer oral records\nto articulator\n3.1 Records are transported as provided.\n3.2\nMidline is recorded.\n3.3 Vertical height is set and recorded.\n3.4 Condylar angle is set as required.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Type of articulators\n\nMay include but are not limited to:\n1.1 Average movement\n1.2 Semi-adjustable\n1.3 Fully adjustable\n\n--- PDF PAGE 98 ---\nTR Dental Technology NC IV\n\n94\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nSelected and prepared articulator\n1.2\nSelected and prepared materials\n1.3\nTransferred oral records to articulator\n1.4\nComplied with DOH infection control policies and procedures\n1.5\nFollowed OH&S policies\n2. Underpinning\nknowledge\n\n2.1\nRecording techniques and devices\n2.2 Mechanical devices\n2.3 Articulators\n2.4 Face-bows\n2.5 Relevant material science for carrying out procedures\n2.6\nBasic oral anatomy and occlusion\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nRecording techniques\n3.4\nArticulating procedure\n3.5\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Range of articulators\n4.3 Range of jaw relationship\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 99 ---\nTR Dental Technology NC IV\n\n95\n\nUNIT OF COMPETENCY:\nFABRICATE MOUTHGUARD\nUNIT CODE:\nHCS322327\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in fabricating\nmouthguard.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare model for\nprocedure\n1.1\nPrescription is interpreted in accordance with the dentist’s\ninstruction.\n1.2\nModel is seated and correctly positioned for procedure.\n2. Check the dental\nmouthguard prior to\ninsertion\n2.1\nMouthguard is decontaminated in accordance with DOH\ninfection control guidelines.\n2.2 Potential injury causing areas of a mouthguard are removed\nprior to insertion.\n2.3\nMouthguard is assessed to ensure desired thickness and\nprotective capabilities have been achieved.\n3. Fit and evaluate the\nmouthguard\n3.1 Retention and stability are examined.\n3.2\nThe fitting surfaces of the mouthguard are checked for\naccuracy and comfort.\n3.3 Current DOH infection control guidelines are followed.\n4. Alter mouthguard if\nrequired\n4.1\nMaterials and equipment required to carry out alterations are\nused in accordance with manufacturer’s instructions, current\nDOH infection control and OHS guidelines.\n4.2\nFitting surfaces and occlusion are checked for accuracy and\naltered where pressure is indicated or where discrepancies to\nretention and stability are found.\n4.3\nDocumentation is completed as required.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Guidelines\n\nRelevant guidelines may include but are not limited to:\n1.1 Department of Health (DOH) infection control guidelines and\nprocedures\n1.2 Occupational Health and Safety Practices\n\n--- PDF PAGE 100 ---\nTR Dental Technology NC IV\n\n96\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model for procedure\n1.2\nChecked the dental mouthguard prior to insertion\n1.3\nFitted and evaluated the mouthguard\n1.4\nAltered mouthguard if required\n1.5 Complied with DOH infection control policies and procedures\n1.6\nFollowed OH&S policies and procedures\n2. Underpinning\nknowledge\n\n2.1\nRationale and objectives for mouthguard\n2.2 Types of mouthguard\n2.3 Maintenance requirements for mouthguard\n2.4 Principles of quality assurance and work effectiveness\n2.5 Legal and ethical issues relating to: informed consent, duty of\ncare and confidentiality\n2.6 Relevant OH&S regulations\n2.7\nCurrent DOH infection control guidelines\n3. Underpinning skills\n3.1\nCommunications Skills\n3.2\nProblem Solving\n3.3\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nA real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 101 ---\nTR Dental Technology NC IV\n\n97\n\nUNIT OF COMPETENCY:\nARRANGE ARTIFICIAL TEETH FOR COMPLETE DENTURES\nUNIT CODE:\nHCS322328\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required in the\nselection, arrangement and wax contouring of a complete denture.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare case for\nsetting of teeth\n1.1\nArtificial teeth are selected to work order.\n1.2\nBases and rims are modified as required for positioning of\nteeth.\n2 Arrange artificial\nteeth\n2.1\nWork order is followed.\n2.2\nTeeth are positioned to achieve aesthetics and centric\nocclusion, balanced articulation and balanced occlusion.\n2.3\nTeeth are secured in wax and contoured to gingival outline.\n3. Wax up denture for\ntry-in\n3.1\nWax is applied as required.\n3.2\nFacial and lingual aspects are contoured.\n3.3\nMuscle attachments are located and relieved.\n3.4\nPeripheral extensions are smoothened and rounded.\n3.5\nDistal extensions are confirmed.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Dentures\nMay include but are not limited to:\n1.1\nComplete maxillary or complete mandibular\n1.2\nCombined complete maxillary and complete mandibular.\n\n--- PDF PAGE 102 ---\nTR Dental Technology NC IV\n\n98\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared case for setting of teeth\n1.2\nArranged artificial teeth\n1.3\nWaxed up denture for try-in\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies and procedures\n2. Underpinning\nknowledge\n2.1\nRange of articulators\n2.2\nSelection of artificial teeth\n2.3\nArticulation and occlusion\n2.4\nTooth morphology\n2.5\nCurrent DOH infection control guidelines\n2.6\nRelevant material science for carrying out procedures\n2.7\nOH&S and material safety data sheets\n2.8\nIndustry Codes of Practice\n2.9\nRelevant laws as appropriate\n2.10 Housekeeping and maintenance procedures\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nSelecting artificial teeth\n3.4\nMaintaining personal hygiene\n3.5\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 relevant laws as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 Range of articulators\n4.1 A qualified workplace assessor and/or a technical expert working\nin partnership with assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 103 ---\nTR Dental Technology NC IV\n\n99\n\nUNIT OF COMPETENCY:\nSET-UP AND WAX REMOVABLE PARTIAL DENTURES\nUNIT CODE:\nHCS322329\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\nset-up and wax removable partial dentures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Design acrylic\nremovable partial\ndenture\n1.1\nModels are surveyed.\n1.2\nDesign is established and transferred to master model.\n1.3\nUndesirable undercuts are blocked out.\n1.4\nFood lines are scribed.\n\n2. Select and prepare\nmaterials\n2.1\nMaterials are selected according to work order.\n2.2\nShape and dimension of components are established from\ndesign.\n\n3. Arrange artificial\nteeth\n3.1\nTeeth are selected and positioned in wax to established\naesthetics and function.\n3.2\nWax is contoured and dentures made suitable for try-in in\nmouth.\n\n4. Fabricate retainer\nunits\n4.1\nComponents are constructed as required.\n4.2\nComponents are joined as required.\n4.3\nTeeth and components are secured in wax.\n4.4\nFacial and lingual aspects are contoured.\n4.5\nAppliance is secured for processing.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Material options for\nbase\nMay include but are not limited to:\n1.1\nAcrylic\n1.2\nLight-cured\n1.3\nFlexible materials\n\n--- PDF PAGE 104 ---\nTR Dental Technology NC IV\n\n100\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Designed acrylic removable partial denture\n1.2 Selected and prepared materials\n1.3 Arrange artificial teeth\n1.4 Fabricated retainer units\n1.5 Complied with infection control policies and procedures\n1.6 Followed OH&S policies\n1.7 Industry Codes of Practice\n1.8 Relevant laws as appropriate\n1.9 Housekeeping Maintenance Procedures\n1.10 Dental Alloys\n2. Underpinning\nknowledge\n\n2.1 Metallurgy - soldering techniques\n2.2 Wrought component fabrication techniques\n2.3 Tooth morphology\n2.4 Articulation and occlusion\n2.5 Principles of partial denture design\n2.6 Relevant material science for carrying out procedures\n2.7 Duplication techniques\n2.8\nCurrent DOH infection control guidelines\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Investing and packing techniques\n3.4 Duplicating techniques\n3.5\nFabricating techniques of wrought components\n3.6\nMaintaining personal hygiene\n3.7\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 Dental alloys\n4.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 105 ---\nTR Dental Technology NC IV\n\n101\n\nUNIT OF COMPETENCY:\nWAX, PROCESS AND FINISH ACRYLIC DENTURES AND\nAPPLIANCES\nUNIT CODE:\nHCS322330\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes concerned with\nthe process involved in polymerization and finishing of acrylic\ndentures and appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Wax case for finish\nconsistent with work\norder\n1.1\nWax is applied as required by work order.\n1.2\nFacial and lingual aspects are contoured.\n2. Select and prepare\nmaterials and\nprocessing\n2.1\nAppropriate polymer system for case is identified.\n2.2\nAppropriate investment technique is identified.\n2.3\nAppropriate processing cycle is identified.\n2.4\nMaterial is selected from identified polymer system.\n2.5\nSystem components are combined.\n2.6\nMaterials are allowed to reach application stage.\n3. Process denture or\nappliance\n3.1\nAppropriate investment techniques are applied.\n3.2\nMaterial is applied to mould.\n3.3\nAppropriate processing cycle is applied.\n3.4\nModel is divested.\n3.5\nRemount on articulator.\n4. Grind dentures and\nappliances selectively\n4.1\nCentric occlusion is restored.\n4.2\nBalanced occlusion is restored.\n4.3\nBalanced articulation is restored.\n4.4\nFunction is restored.\n5. Finish denture or\nappliance\n5.1\nDenture or appliance is trimmed, shaped and finished\naccording to job specifications.\n5.2\nDentures are disinfected according to current DOH infection\nguidelines.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Acrylic dentures and\nappliances\nMay include but are not limited to:\n1.1\nComplete and partial dentures\n1.2\nOrthodontic appliances\n1.3\nTherapeutic appliances\n\n--- PDF PAGE 106 ---\nTR Dental Technology NC IV\n\n102\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Waxed case for finish consistent with work orders\n1.2 Selected and prepared materials and processing techniques\n1.3 Processed denture or appliance\n1.4 Grind dentures and appliances selectively\n1.5 Finished denture or appliance\n1.6 Complied with infection control policies and procedures\n1.7 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Relevant material science for carrying out procedures\n2.2 Tooth morphology and anatomy\n2.3 OH&S and materials safety data sheets\n2.4 Current DOH infection control guidelines\n2.5 Workplace Policy and Procedures Manuals\n2.6 Product Labels and Sources of Product Information\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nMaintaining personal hygiene\n3.4\nPlanning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 Relevant documentation, such as:\n - workplace policy and procedures manuals\n4.2 Access to a range of clients with different requirements\n4.3 A range of equipment and products appropriate to the\nworkplace\n4.4\n Product labels and sources of product information\n4.5\nA qualified workplace assessor or assessment team\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 107 ---\nTR Dental Technology NC IV\n\n103\n\nUNIT OF COMPETENCY:\nFABRICATE THERMO-FORMED BASES AND APPLIANCES\nUNIT CODE:\nHCS322334\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude in fabricating\nthermo-formed bases and appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare model\n1.1\nWork order is interpreted.\n1.2\nOutline is marked and finished lines are scribed where\napplicable.\n1.3\nBlock-out material is applied as required.\n2. Thermo-form\nappliance or base\n2.1\n Thermo-forming material and apparatus is selected.\n2.2\n Heat is applied to material.\n2.3\n Softened material is adapted.\n2.4\n Material is allowed to cool.\n2.5 Adaptation is verified.\n3. Trim, shape and\nfinish appliances or\nbases\n3.1 Thermo-formed blank is removed.\n3.2 Outline is trimmed and fitted to model.\n3.3 Outline is refined.\n3.4 Appliance or base is smoothened and finished.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nAppliances\nMay include but are not limited to:\n1.1\nMouthguard\n1.2 Bleach trays\n1.3 Occlussal splints\n1.4 Baseplates\n1.5 Temporary crown stents\n1.6 Retaining devices\n1.7 Custom impression trays\n2. Thermo-forming\nequipment used\nMay include but are not limited to:\n2.1 Vacuum\n2.2 Pressure\n\n--- PDF PAGE 108 ---\nTR Dental Technology NC IV\n\n104\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared model\n1.2 Thermo-formed appliance or base from blank\n1.3 Trimmed, shaped and finished appliance or bases\n1.4 Complied with infection control policies and procedures\n1.5 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Relevant material science for carrying out procedures\n2.2 Oro-facial anatomy\n2.3 Thermoforming technology\n2.4 Polymer science\n2.5 Tooth morphology\n2.6 Principles of occlusion\n2.7 Industry Codes of Practice\n2.8 Relevant laws as appropriate\n2.9 Housekeeping and Maintenance Procedures\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Performing orthodontic procedures and wrought wire\nfabrication techniques\n3.4 Maintaining personal hygiene\n3.5 Following correct measurements\n3.6 Planning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 109 ---\nTR Dental Technology NC IV\n\n105\nUNIT OF COMPETENCY:\nREPAIR AND MODIFY DENTURES AND APPLIANCES\nUNIT CODE :\nHCS322339\nUNIT DESCRIPTION:\nThis unit covers the knowledge and skills required to reline,\nrebase, repair and modify removable prostheses.\n\nDemonstration of this unit of competency requires training and/or\nexperience in infection-control procedures, constructing models,\narticulating models and transferring records, and constructing\nsimple complete removable acrylic dentures and appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare case\n\n1.1 Standard precautions are applied when receiving, handling and\nworking on dentures and appliances\n1.2 Dentures and appliances are decontaminated according to\ninfection control guidelines\n1.3 Prescription are read and interpreted\n1.4 Fractured components are examined for defects\n1.5 Fractured components are realigned, positioned and secured in\ntheir correct relationship\n2. Prepare model\n\n2.1 Model is constructed in accordance with the dentist requirements\n2.2 Articulation key is constructed if required\n3. Repair denture or\nappliance\n\n3.1 Denture surfaces are prepared and shaped to allow for bonding with\nthe new material\n3.2 Components are relocated\n3.3 Materials and processing equipment are selected and prepared\n3.4 Repair material is applied using the correct technique to acquire the\nrequired shape and thickness\n3.5 Material is processed in accordance with manufacturer’s\ninstructions/specifications\n4. Modify denture or\nappliance, where\nrequired\n\n4.1 Impressions are decontaminated according to infection control\nguidelines\n4.2 The model material is poured into the impression in accordance\nwith accepted techniques\n4.3 Where necessary, case is articulated and records are transferred or\narticulation key is constructed based on client requirement\n4.4 Denture or appliance surfaces are prepared appropriately in\naccordance with modification to be made\n4.5 Denture is relined, re-based or modified in accordance with dentist\nprescription\n5. Trim, shape and\nfinish denture or\nappliance\n\n5.1 Denture or appliance is trimmed to relevant anatomical outline or\nrequired extension of the base\n5.2 The tissue fitting surface is examined and any processing\nanomalies and sharp surfaces are removed\n5.3 Surfaces are refined and polished in order produce required\ncontours\n5.4 Finished prosthesis are evaluated in accordance with quality\nstandard\n5.5 The appliance is decontaminated according to infection control\nguidelines\n5.6 The appliance is placed in a sealed container for dispatch\n\n--- PDF PAGE 110 ---\nTR Dental Technology NC IV\n\n106\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Standard precautions\n\nMay include but are not limited to:\n1.1 A dedicated clean area to receive incoming cases\n1.2 Appropriate personal protection:\n1.2.1 disposable gloves\n1.2.2 apron\n1.2.3 eye protection\n1.2.4 mask where there is a risk of airborne transmission of\ninfection\n1.3 Decontamination of dentures and appliances\n1.4 Disposal of all packaging materials in accordance with the waste\nregulations of DOH and environmental authorities (DENR)\n1.5 Cleaning reusable containers with detergent followed by\ndisinfection\n1.6 Washing hands before leaving the work area\n1.7 Excluding all food and drink from the work area\n2. Decontamination of\ndentures and\nappliances\n\nMay include but is not limited to:\n2.1 Rinsing denture or appliance in clean running water\n2.2 Cleaning in an ultrasonic cleaner\n2.3 Cleaning in a mild detergent solution until all traces of blood and\nbody fluids are removed, followed by rinsing\n3. Preparation of\nmaterials\n\nMay include but is not limited to:\n3.1 Selection of materials appropriate to the removable prosthesis\nthat is to be repaired\n3.2 The correct quantities necessary for the repair\n4. Modifications to a\nprothesis\n\nMay include but is not limited to:\n4.1 Adding new artificial teeth\n4.2 Replacing existing artificial teeth\n4.3 Modifying the denture base\n4.4 Adding new metallic components\n4.5 Modifying existing metallic components\n5. Evaluation of the\nfinished prosthesis\n\nMay include but is not limited to:\n5.1 Checking the prosthesis for:\n 5.1.1 Compliance with the prescription\n 5.1.2 Quality and freedom from defects\n 5.1.3 Functional effectiveness of the design\n 5.1.4 Accurate fit to the cast\n\n--- PDF PAGE 111 ---\nTR Dental Technology NC IV\n\n107\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Complied consistently with current infection control guidelines,\nDOH and PDA requirements as they relate to the dental\ntechnician’s specific job role\n1.2 Complied consistently with occupational health and safety\npolicies and procedures as they relate to the dental technician’s\nspecific job role\n1.3 Demonstrated consistent performance over the required range of\nworkplace situations including:\n1.3.1 consistently design and manufacture oral splints using a\nrange of materials, for a range of jaw relations and\nmalocclusions\n1.3.2 consistently use a range of articulators\n1.4 Trimmed, polished, finished and evaluated oral splints for\nsuitability for insertion in the mouth\n2. Underpinning\nknowledge\n and attitudes\nKnowledge on:\n2.1 Infection control guidelines for the decontamination of dentures\nand appliances that have already been inserted into the mouth\n2.2 Applied oral anatomy\n2.2.1 structures of the oral cavity – hard and soft palate, lateral\nand posterior borders of the oral cavity, tongue and floor\nof the mouth\n2.2.2 teeth – form and function\n2.2.3 dentition – Arrangement of the teeth, naming and coding\nof teeth\n2.3 Constructional faults that cause fractures of denture base\nincluding:\n2.3.1 incorrect positioning of upper posterior teeth\n2.3.2 absence of balanced occlusion\n2.3.3 insufficient thickness of acrylic resin in the anterior palatal\nregion of the denture\n2.3.4 incorrect dough consistency when packing\n2.3.5 inadequate polymerisation times and temperatures\n2.3.6 rapid cooling after processing\n2.4 Constructional faults that cause broken teeth\n2.5 Methods for modifying, repairing and maintaining removable\nprostheses\n2.6 Denture base materials\n\n--- PDF PAGE 112 ---\nTR Dental Technology NC IV\n\n108\n\n3. Underpinning skills\n3.1 Use safe work practices to minimize the risk of transmission of\ninfection including:\n3.1.1 consistently following the procedure for washing and\ndrying hands\n3.1.2 consistently putting into practice clean techniques\n3.1.3 consistently using personal protective equipment\n3.1.4 consistently limiting contamination\n3.1.5 consistently maintaining clean receiving and work areas\n3.2 Consistently follow occupational health and safety policies and\nprocedures\n3.3 Use literacy skills to read and follow directions, policies and\nprocedures including:\n3.3.1 occupational health and safety policies and procedures\n 3.3.2 infection control policies and procedures\n 3.3.3 material safety data sheets\n 3.3.4 laboratory policies and procedures\n3.4 Select materials, techniques and equipment to reline, rebase,\nrepair and modify removable prostheses\n3.5 Consistently follow sequenced written instructions and\nmanufacturer specifications for the preparation of materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nDental materials\n4.3\nDental tools and equipment\n4.4\nDentist requirements/prescription\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 113 ---\nTR Dental Technology NC IV\n\n109\n\nUNIT OF COMPETENCY:\nFABRICATE ORAL SPLINTS\nUNIT CODE:\nHCS322332\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude in fabricating oral\nsplints.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Fabricate splint\n1.1\nMaterials for the fabrication of splint are selected.\n1.2\nSplint is fabricated according to work order requirements.\n1.3\nSplint is processed according to manufacturer’s\nrecommendations.\n\n2. Trim, shape and\nfinish\n2.1\nSplint is trimmed according to material selection.\n2.2\nSplint is shaped according to work order and rechecked on\narticulator.\n2.3\nSplint is fitted back to master model.\n2.4\nSplint is finished appropriately according to type of material\nselected.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include but are not limited to:\n1.1\nCast alloys\n1.2\nAcrylic resins (heat activated, chemically activated, thermo-\nformed)\n1.3\nVisible light-cured composite resins\n2. Splint to be fabricated\nMay include but are not limited to:\n2.1\nCast metal alloy cap splints\n2.2\nAcrylic cap splints\n2.3\nGunning splints\n2.4\nWrought wire retained splints\n2.5\nOcclusal splints (bruxing, neutral, anterior, repositioning, TMJ,\northodontic)\n\n--- PDF PAGE 114 ---\nTR Dental Technology NC IV\n\n110\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFabricated splint\n1.2\nTrimmed, shaped and finished splint\n1.3\nFollowed OH&S and DOH infection control guidelines\n1.4\nIdentified dental anatomy and dental metallurgy\n1.5\nUsed surveying equipment and vacuum forming procedures\n2. Underpinning\nknowledge\nKnowledge on:\n2.1\nArticulation and occlusion\n2.2\nRelevant dental anatomy\n2.3\nDental metallurgy\n2.4\nRelevant material science for carrying out procedures\n2.5\nUse of surveying equipment\n2.6\nOHS and material safety data sheets\n2.7\nCurrent DOH infection control guidelines\n2.8\nProcessing of wax patterns in acrylic resin\n2.9\nUsing of vacuum forming procedures\n2.10 Dental Laboratory Materials, splint materials, jaw relations and\nmalocclusions of severe skeletal orthodontic type\n2.11 Range of articulators\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nSurveying and blocking out undercuts\n3.3\nSelecting articulators\n3.4\nUsing face-bow and centric records\n3.5\nPlanning and organizing\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRange of dental laboratory materials, splint materials, jaw\nrelations and malocclusions of severe skeletal orthodontic\ntype\n4.3\nRange of articulators\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 115 ---\nTR Dental Technology NC IV\n\n111\n\nUNIT OF COMPETENCY:\nFABRICATE ORTHODONTIC APPLIANCES\nUNIT CODE:\nHCS322333\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude in fabricating\northodontic appliances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select or fabricate\nand assemble\ncomponents and\nmaterials\n1.1\nMaterials are selected according to design and function\nspecified by work order.\n1.2\nIndividual components are selected and/or fabricated as\nappropriate to work order.\n\n2. Fabricate orthodontic\nappliance\n2.1\nComponents are secured to model by appropriate means.\n2.2\nMaterials are applied and processed according to\nmanufacturer’s instructions.\n\n3. Finish orthodontic\nappliance\n3.1\nAppliances are trimmed, shaped and finished.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Components\nMay include but are not limited to:\n1.1\nScrews\n1.2\nPiston-screws\n1.3\nSprings an sheaths made in a variety of metals and polymers\n2. Materials\nMay include but are not limited to:\n2.1\nPolymers or metals and metal joining techniques\n3. Appliances\nMay include but are not limited to:\n3.1\nFunctional appliances\n3.2\nRetainers of varying types\n3.2.1 bite opening\n3.2.2 retraction\n3.2.3 expansion\n3.2.4 retaining\n3.2.5 incline plane\n3.2.6\noral screen\n\n--- PDF PAGE 116 ---\nTR Dental Technology NC IV\n\n112\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSelected or fabricated and assembled components and\nmaterials\n1.2\nFabricated orthodontic appliance\n1.3\nFinished orthodontic appliances\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies\n2. Underpinning\nknowledge\n2.1\nDental metallurgy\n2.2\nRelevant material science for carrying out procedures\n2.3\nRelevant oral anatomy\n2.4\nPrinciples of Orthodontic Procedures\n2.5\nOcclusion\n2.6\nWrought wire fabrication techniques\n2.7\nIndustry Codes of Practice\n2.8\nRelevant laws as appropriate\n2.9\nHousekeeping and maintenance procedures\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Performing orthodontic procedures and wrought wire\nfabrication techniques\n3.4 Maintaining personal hygiene\n3.5 Following correct measurements\n3.6 Planning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 117 ---\nTR Dental Technology NC IV\n\n113\n\nUNIT OF COMPETENCY:\nFABRICATE CAST METAL REMOVABLE PARTIAL DENTURE\nFRAMEWORK\nUNIT CODE:\nHCS322331\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes concerned with\nfabrication of alloy removable partial denture framework.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare master\nmodel\n1.1\nWork order is interpreted.\n1.2\nAlloy is selected\n1.3\nModel is surveyed.\n1.4\nDesigned is transferred to master model.\n1.5\nUndesirable undercuts are blocked out.\n1.6\nClasp ledges are created.\n1.7\nFinished lines are scribed.\n1.8\nTissue relief is applied.\n1.9\nSaddle relief is applied.\n2. Construct refractory\nmodel\n2.1\nMaster model is duplicated in refractory material and sprue\nformer is constructed, as necessary.\n2.2\nRefractory model surface is treated.\n3. Wax and invest\nremovable partial\ndenture framework\n3.1\nDesign is transferred to refractory model.\n3.2\nPatterns and waxes are selected.\n3.3\nPatterns are waxed up and sprues attached.\n3.4\nAppropriate investment and technique are selected.\n3.5\nInvestment material is prepared.\n3.6\nWax, patterns and sprues are treated.\n3.7\nInvestment setting time is allowed for.\n4. Burn out, cast and\nfinish removable\npartial denture\nframework\n4.1\nBurn out and preheat cycles are selected for appropriate\ninvestment/alloy combination.\n4.2\nInvestment mould is burnt out and preheated.\n4.3\nAlloy is melted and cast using appropriate\nequipment/technique.\n4.4\nCooling cycle is selected and applied.\n4.5\nDenture framework is divested.\n4.6\nDenture framework is trimmed, shaped, treated, finished and\nfitted to master model.\n4.7\nFramework is treated in accordance with DOH infection\ncontrol guidelines.\n\n--- PDF PAGE 118 ---\nTR Dental Technology NC IV\n\n114\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Alloy\nMay include but are not limited to:\n1.1 Cobalt chromium based alloys\n1.2 Gold alloys\n1.3 Metal/ceramic alloys\n\n2. Melting/casting\ntechniques\nMay include but are not limited to:\n2.1 Flame melting\n2.2 Induction melting\n2.3 Resistance melting\n2.4 Centrifugal casting\n2.5 Gas pressure casting\n2.6 Vacuum casting\n\n--- PDF PAGE 119 ---\nTR Dental Technology NC IV\n\n115\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared materials for fabrication of metal/cast\nmetal alloy\n1.2 Fabricated base and registration rim\n1.3 Prepared face-bow (if required)\n1.4 Complied with infection control policies and procedures\n1.5 Followed OH&S policies\n2. Underpinning\nknowledge\n2.1 Dental alloy\n2.2 Relevant material science for carrying out procedures\n2.3 Solidification\n2.4 Melting and casting\n2.5 Heat treatment\n2.6 Surface finishing\n2.7 Industry Codes of Practice\n2.8 Relevant Laws as appropriate\n2.9 Housekeeping Maintenance\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Melting and casting techniques\n3.4 Maintaining personal hygiene\n3.5 Planning and organizing work activities\n4. Resource implication\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation, such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance\n4.3 Dental alloys\n4.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 120 ---\nTR Dental Technology NC IV\n\n116\n\nUNIT OF COMPETENCY:\nFABRICATE METAL CROWN AND BRIDGE STRUCTURES\nUNIT CODE:\nHCS322335\nUNIT DESCRIPTOR:\nThis unit involves fabrication of metal alloy, crown and bridge\nstructures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nsectionalized\nmodels\n1.1\nModels are sectioned.\n1.2\nMargins are identified and models are trimmed.\n1.3\nMargins are hardened if required.\n2.\nWax and invest\nfixed partial\ndentures and\nstructures\n2.1\nCrown and bridge restorations are waxed up.\n2.2\nCrown and bridge wax pattern is sprued and prepared for\ninvesting.\n2.3\nAppropriate investment material is selected and wax patterns\nare selected.\n2.4\nWax patterns are invested.\n3.\nBurn-out cast and\nfinish alloy fixed\npartial dentures and\nstructures\n3.1\nBurnout techniques are selected appropriate to the technique.\n3.2\nMetal restorations are cast in appropriate alloy.\n3.3\nMetal restoration is devested without damaging casting.\n3.4\nMetal restoration is trimmed and polished while maintaining all\ncontact areas and margin.\n\n--- PDF PAGE 121 ---\nTR Dental Technology NC IV\n\n117\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Construction of crown and\nbridges structures\n\nMay include but are not limited to:\n1.1\nA range of designs\n1.2\nAnterior and posterior teeth\n1.3\nMetal inlays, crowns and bridges\n1.4\nCeramic fused to metal sub structures\n2. Alloy\nMay include but are not limited to:\n2.1\nCobalt chromium based alloys\n2.2\nGold alloys\n2.3\nMetal/ceramic alloys\n3. Restoration\nMay include but are not limited to:\n3.1\nComplete and partial dentures\n3.2\nCrown and bridge\n3.3\nImplant\n3.4\nSplints\n\n--- PDF PAGE 122 ---\nTR Dental Technology NC IV\n\n118\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared and sectionalized models\n1.2\nWaxed and invested fixed partial dentures and structures\n1.3\nBurned-out cast and finished alloy fixed partial dentures and\nstructures\n1.4\nApplied the different principles, policies and techniques on\ncasting, spruing, soldering, waxing, investing and finishing\n1.5\nFollowed OH&S and Department of Health infection control\nguidelines\n2. Underpinning\nknowledge\nKnowledge and principles on:\n2.1\nCasting techniques\n2.2\nSpruing techniques\n2.3\nTooth morphology\n2.4\nArticulation and occlusion\n2.5\nRelevant material science for carrying out procedures\n2.6\nSoldering techniques\n2.7\nWax and plastic pattern techniques\n2.8\nInvesting techniques\n2.9\nOccupation Health and Safety\n2.10 Finishing techniques\n2.11 Current DOH infection control guidelines\n2.12 Dental Policies and Procedures\n2.13\nRegulatory and Legislation Requirements\n3. Underpinning skills\n3.1\nCasting techniques\n3.2\nSpruing techniques\n3.3\nSoldering techniques\n3.4\nWax and plastic pattern techniques\n3.5\nInvesting techniques\n3.6\nFinishing technique\n3.7\nManual dexterity\n3.8\nAbility to work as part of the team\n3.9\nPlanning of work\n3.10 Language, literacy and numeracy skills appropriate to the role\nand workplace requirements\n3.11 Operational skills to consistently use time effectively and\nprovide quality customer service in the dental environment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA real simulated dental environment\n4.2\nRelevant documentation such as:\n4.2.1 dental policies and procedures\n4.2.2 regulatory and legislation requirements as appropriate\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 123 ---\nTR Dental Technology NC IV\n\n119\n\nUNIT OF COMPETENCY:\nFABRICATE CERAMIC RESTORATIONS\nUNIT CODE:\nHCS322336\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude in\nfabricating ceramic restorations and fixed partial dentures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nPrepare sub-\nstructures\n1.1\nSub-structure is assessed for accuracy and appropriateness.\n1.2\nSub-structure conformed to standard guidelines.\n1.3\nStructure is prepared for porcelain build-up.\n1.4\nSub-structure is treated according to manufacturer’s\nguidelines.\n2\nSelect and apply\nceramics\n2.1\nPorcelains appropriate to the procedure is selected and\napplied.\n2.2\nOperator requirements are selected and applied.\n3\nTrim, shape and\nfinish restorations\n3.1\nCeramic restoration is trimmed to required anatomical shape.\n3.2\nCeramic restoration is completed to meet the clinically\naccepted standards.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedures\nProcedures to include crowns and bridges of the following types:\n1.1\nCeramic fused to precious, semi-precious and non-precious\nmetal/alloy\n1.2\nAll ceramic restorations\n1.3\nCeramic veneers, inlays and onlays\n1.4\nCastable ceramic\n2. Restoration\nMay include but not limited to:\n2.1\nComplete and partial\n2.2\nCrown and bridge\n2.3\nImplant\n2.4\nSplint\n\n--- PDF PAGE 124 ---\nTR Dental Technology NC IV\n\n120\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared sub-structures\n1.2\nSelected and applied ceramics\n1.3\nTrimmed, shaped and finished restorations\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies\n2.\nUnderpinning\nknowledge\n2.1\nCeramics\n2.2\nMetallurgy\n2.3\nColor\n2.4\nScience\n2.5\nCurrent DOH infection control guidelines\n2.6\nOral Anatomy\n2.7\nCause of faults during fabrication\n2.8\nRationale for processes and procedures\n2.9\nPrinciples of occlusion\n2.10 Industry Codes of Practice\n2.11 Relevant Laws as appropriate\n2.12 Housekeeping and Maintenance Procedures\n3.\nUnderpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nCarving teeth\n3.4\nAccuracy\n3.5\nEfficient use of materials\n3.6\nAnalyzing faults\n3.7\nMaintaining personal hygiene\n3.8\nFollowing correct measurements\n3.9\nPlanning and organizing work activities\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRelevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n\n--- PDF PAGE 125 ---\nTR Dental Technology NC IV\n\n120\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6.\nContext of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 126 ---\nTR Dental Technology NC IV\n\n121\n\nUNIT OF COMPETENCY:\nFABRICATE INDIRECT COMPOSITE/POLYMER FIXED\nRESTORATIONS\nUNIT CODE:\nHCS322337\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude in fabricating\nindirect composite/polymer fixed restorations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPrepare model\n1.1\nWork order is interpreted.\n1.2\nModel is treated as required.\n1.3\nSub-structure (if used) is treated for application of material.\n2.\nFabricate\nrestoration\n2.1\nAppropriate system is selected.\n2.2\nMargin is indicated as required.\n2.3\nMaterials are selected.\n2.4\nMaterials are mixed or manipulated.\n2.5\nMaterials are applied and adapted.\n2.6\nSurface of the restoration is treated if required.\n2.7\nMaterial is processed to industry standard.\n3.\nTrim, shape and\nfinish restoration\n3.1\nRotary trimmers are selected.\n3.2\nShape is refined.\n3.3\nRestoration is finished according to work order requirements.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nRestorations\nMay include but are not limited to:\n1.1\nSingle full crowns\n1.2\nBridges\n1.3\nMaryland bridges\n1.4\nImplant supported restorations\n1.5\nVeneers\n1.6\nInlays\n1.7\nHalf and three-quarter crowns\n1.8\nOn-lays\n\n--- PDF PAGE 127 ---\nTR Dental Technology NC IV\n\n122\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model\n1.2\nFabricated restoration\n1.3\nTrimmed, shaped and finished restoration\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies\n2.\nUnderpinning\nknowledge\n2.1\nRelevant material science for carrying out procedures\n2.2\nArticulation and occlusion\n2.3\nTooth morphology\n2.4\nOral anatomy\n2.5\nColor\n2.6\nCurrent DOH infection control guidelines\n2.7\nMetallurgy\n2.8\nPolymer science\n2.9\nIndustry Codes of Practice\n2.10 Relevant Laws as appropriate\n2.11 Housekeeping and Maintenance Procedures\n3\nUnderpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nCarving restorations\n3.4\nMatching of color and shades\n3.5\nAnalyzing of faults\n3.6\nMaintaining personal hygiene\n3.7\nUse of materials\n3.8\nPlanning and organizing work activities\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRelevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3\nColor and shades of teeth\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n\n--- PDF PAGE 128 ---\nTR Dental Technology NC IV\n\n123\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6.\nContext of\nassessment\n6.1\nCompetency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 129 ---\nTR Dental Technology NC IV\n\n124\n\nUNIT OF COMPETENCY:\nJOIN ALLOY STRUCTURES\nUNIT CODE:\nHCS322338\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in joining alloy\nstructures through thermal processes.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSolder components\n1.1\nComponent materials are identified.\n1.2\nAppropriate solder and flux are selected.\n1.3\nAppropriate heating methods are selected.\n1.4\nComponents are selected and soldered.\n1.5\nComponents are cleaned, trimmed, shaped and finished.\n1.6\nComponents are disinfected according to DOH guidelines.\n2.\nWeld components\n2.1\nComponent materials are identified.\n2.2\nAppropriate welding techniques are selected.\n2.3\nComponents are welded.\n2.4\nComponents are cleaned, trimmed, shaped and finished.\n2.5\nComponents are disinfected according to DOH guidelines.\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Component materials May include but are not