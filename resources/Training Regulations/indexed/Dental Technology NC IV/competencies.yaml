        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nComplied consistently with occupational health and safety\npolicies of OHSS\n1.2\nDemonstrated consistent performance in the following\nworkplace situations such as:\n1.2.1 Maintenance and storage of instruments, equipment\nand materials in accordance with manufacturer\nspecifications and operator’s requirements\n1.2.2 Compliance with occupational health and safety\nprocedures\n1.2.3 Storage of materials in accordance with manufacturer\nspecifications and operator’s requirements\n1.2.4 Maintenance of records of maintenance procedures\nand processes\n\n2. Underpinning\nknowledge\n\n2.1\nFundamental knowledge of oral anatomy including:\n2.1.1 Structure and functions of teeth and the periodontal\ntissues\n2.1.2 Structures of the oral cavity\n2.1.3 Tooth identification\n2.2\nDental laboratory records and laboratory prescriptions\nincluding:\n2.2.1 knowledge of correct dental terminology and how it is\nused in dental laboratory prescription items that\nconstitute a dental laboratory record\n2.2.2 Dental notation systems and prescription symbols\n2.2.3 Confidentiality of prescriptions\n2.2.4 The purpose of study casts and the materials used in\ntheir fabrication\n2.3 Fundamental knowledge of dental laboratory materials\n2.4\nDental laboratory practice/organization policies and\nprocedures\n\n--- PDF PAGE 61 ---\nTR Dental Technology NC IV\n\n57\n\n3. Underpinning skills\n\n3.1\nConsistently using safe work practices to minimize the risk of\ntransmission of infection including:\n3.1.1 Following the procedure for washing and drying of\nhands\n3.1.2 Putting into practice cleaning techniques\n3.1.3 Using personal protective equipment\n3.1.4 Limiting contamination\n3.1.5 Protecting materials, equipment and instruments from\ncontamination until required for use\n3.2\nUsing literacy skills to read and follow directions, policies and\nprocedures including:\n3.2.1 Occupational health and safety policies and procedures\n3.2.2 Infection control policies and procedures\n3.2.3 Practice policies and procedures\n3.3\nConsistently following sequenced written instructions and\nmanufacturer specifications for the preparation of dental\nlaboratory materials\n3.4\nConsistently demonstrating interpersonal skills when relating\nto people from a range of social, cultural and religious\nbackgrounds and physical and mental abilities.\n3.5\nConsistently demonstrating communication skills as required\nin fulfilling the job role as specified by the dental laboratory\npractice /organization including:\n3.5.1 Negotiation\n3.5.2 Asking questions\n3.5.3 Active listening\n3.5.4 Asking for clarification from client and /or carer\n3.5.5 Acknowledging and responding to a range of views\n3.6\nConsistently dealing with conflict\n3.7\nConsistently working with others and displaying empathy with\nclient and relatives\n3.8\nConsistently using problem solving skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate supplies and materials\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 62 ---\nTR Dental Technology NC IV\n\n58\n\nUNIT OF COMPETENCY:\nASSIST WITH ADMINISTRATION IN DENTAL LABORATORY\nPRACTICE\nUNIT CODE:"
