          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image\n1.2\nInterpreted client/customer requirements from information\n1.3\nDealt successfully with a variety of client/customer interactions\n1.4\nMonitored and acted on changing client or customer needs\n1.5\nMet client/customer requirements\n1.6\nBuilt credibility with customers/client\n2. Underpinning\nknowledge\n2.1\nUniform and personal grooming requirements of the employer\n2.2\nOccupational health and safety requirement for the\nassignment\n2.3\nAssignment Instructions\n3. Underpinning skills\n3.1 Attention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer\nneeds\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and Negotiation\n3.8\nMaintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers/customers’ instructions\n4.9\nAssessment instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 74 ---\nTR Dental Technology NC IV\n\n70\n\nUNIT OF COMPETENCY:\nMANAGE OWN PERFORMANCE\nUNIT CODE:"
