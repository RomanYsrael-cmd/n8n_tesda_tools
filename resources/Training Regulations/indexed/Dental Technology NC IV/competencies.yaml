        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for others\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the team\n1.4. Negotiated learning plans to improve the effectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6.\nAccessed and designated learning opportunities\n2. Underpinning\nknowledge\n2.1. Coaching and mentoring principles\n2.2. Understanding how to work effectively with team members who\nhave diverse work styles, aspirations, cultures and perspective\n2.3. Understanding how to facilitate team development and\nimprovement\n2.4. Understanding methods and techniques for eliciting and\ninterpreting feedback\n2.5. Understanding methods for identifying and prioritizing personal\ndevelopment opportunities and options\n2.6. Knowledge of career paths and competency standards in the\nindustry\n3. Underpinning\nskills\n3.1. Ability to read and understand a variety of texts, prepare general\ninformation and documents according to target audience; spell\nwith accuracy; use grammar and punctuation effective\nrelationships and conflict management\n3.2. Communication skills including receiving feedback and reporting,\nmaintaining effective relationships and conflict management\n3.3. Planning skills to organize required resources and equipment to\nmeet learning needs\n3.4. Coaching and mentoring skills to provide support to colleagues\n3.5. Reporting skills to organize information; assess information for\nrelevance and accuracy; identify and elaborate on learning\noutcomes\n3.6. Facilitation skills to conduct small group training sessions\n3.7. Ability to relate to people from a range of social, cultural, physical\nand mental backgrounds\n\n--- PDF PAGE 39 ---\nTR Dental Technology NC IV\n\n35\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Observation of work activities of the individual member in relation\nto the work activities of the group\n5.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of issues\nand strategies in teamwork\n6. Context of\nassessment\n6.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n6.2. Assessment shall be observed while task are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 40 ---\nTR Dental Technology NC IV\n\n36\nUNIT OF COMPETENCY:\nAPPLY\nPROBLEM\nSOLVING\nTECHNIQUES\nIN\nTHE\nWORKPLACE\nUNIT CODE:"
