          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Designed acrylic removable partial denture\n1.2 Selected and prepared materials\n1.3 Arrange artificial teeth\n1.4 Fabricated retainer units\n1.5 Complied with infection control policies and procedures\n1.6 Followed OH&S policies\n1.7 Industry Codes of Practice\n1.8 Relevant laws as appropriate\n1.9 Housekeeping Maintenance Procedures\n1.10 Dental Alloys\n2. Underpinning\nknowledge\n\n2.1 Metallurgy - soldering techniques\n2.2 Wrought component fabrication techniques\n2.3 Tooth morphology\n2.4 Articulation and occlusion\n2.5 Principles of partial denture design\n2.6 Relevant material science for carrying out procedures\n2.7 Duplication techniques\n2.8\nCurrent DOH infection control guidelines\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Investing and packing techniques\n3.4 Duplicating techniques\n3.5\nFabricating techniques of wrought components\n3.6\nMaintaining personal hygiene\n3.7\nPlanning and organizing work activities\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A real or simulated dental laboratory environment\n4.2 Relevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3 Dental alloys\n4.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 105 ---\nTR Dental Technology NC IV\n\n101\n\nUNIT OF COMPETENCY:\nWAX, PROCESS AND FINISH ACRYLIC DENTURES AND\nAPPLIANCES\nUNIT CODE:"
