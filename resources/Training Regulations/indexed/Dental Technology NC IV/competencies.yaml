s\n2 Faults\n2.1\nFaults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated information\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any regulatory\nagencies\n3 Documentation\n3.1\nOrganization work procedures\n3.2\nManufacturer’s instruction manual\n3.3\nCustomer requirements\n3.4\nForms\n4 Errors\n4.1 Errors may be related but not limited to the following:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the organization\n5 Quality standards\n\n5.1 Quality standards may be related but not limited to the\nfollowing:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1\nCo-worker\n6.2\nSupplier/Vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 70 ---\nTR Dental Technology NC IV\n\n66\n\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s standard\noperating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with standard\noperating procedures\n1.4 Carried out work in accordance with the process improvement\nprocedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and products\n2.2 Characteristics of materials, software and hardware used in\nproduction processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production processes\n2.6 Fault identification and reporting\n2.7 Quality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply defined\nwork procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5 Solution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to objectively evaluate\nthe candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4 Practical demonstration\n5 Resource implication\nMaterials, software and hardware to be used in a real or simulated\nsituation\n6 Context of\nAssessment\nAssessment may be conducted in the workplace or in a simulated\nenvironment\n\n--- PDF PAGE 71 ---\nTR Dental Technology NC IV\n\n67\n\nUNIT OF COMPETENCY:\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS AND\nCUSTOMERS\nUNIT CODE:"
