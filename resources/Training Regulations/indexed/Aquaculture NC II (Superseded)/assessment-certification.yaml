  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Aquaculture NC II, the candidate\nmust demonstrate competence in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed\nby the TESDA Director General.\n\n4.2.\nThe qualification of Aquaculture NC II may be attained through:\n\n4..2.1. Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1.1.\nPrepare and maintain aquaculture facilties\n\n4.2.1.2.\nOperate Fish Nursery\n4.2.1.2.1. Conduct Pre-Operation Aquaculture activities\n4.2.1.2.2. Operate Fish Nursery\n\n4.2.1.3.\nPerform shrimp and fish grow-out operations\n4.2.1.3.1. Conduct Pre-operation aquaculture activities\n4.2.1.3.2. Perform shrimp and fish grow-out operations\n\n Successful candidates shall be awarded Certificates of\nCompetency (COCs) bearing the signature of the Regional\nDirector and Chair of the recognized local industry body.\n\n4.2.2. Demonstration of competence through project-type assessment\ncovering all required units of the qualification.\n\n4.3.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.4.\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.3.2 Experienced Workers (wage employed or self-employed)\n\n4.5.\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 59 ---\n____________________________________________________________________________\nTR-Aquaculture NC II Promulgated December 2004\n\n71\n\nCOMMON\nCOMPETENCIES\nApply Safely\nMeasures in\nfarm\