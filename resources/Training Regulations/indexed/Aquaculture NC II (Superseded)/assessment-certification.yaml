      "text": "5. The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 59 --- ____________________________________________________________________________ TR-Aquaculture NC II Promulgated December 2004 71 Apply Safely Measures in farm operations Use Farm Tools and Equipment Perform Estimation and Basic Calculation Produce Vegetables Produce Grain Crops Service and Repair Business Machines Perform Landscaping Activities Perform Post Harvest Operations of Major Lowland and Semi Temperate Vegetables Crops Operate and Maintain Mechanical Grain Dryer Test & Analyze Physico-Chemical Properties of Foods, Agri Products, Water & Wastewater Grade and Classify Grain Raise Small Ruminants Control Pest of Stored Grains and Products Service Tractor’s Rear Axle, Front Axle & Brake System Operate Fish Nursery Service Tractor’s Electrical System Perform Fish or Shrimp Grow Out Operations Prepare and Maintain Aquaculture Facilities Supermarket of Competencies AGRI-FISHERY Sector Produce Fruit Bearing Crops Produce Cut Flowers Operate Seedling Nursery Manage Farm Operate and Maintain Rice Mill Equipment Perform Post Harvest Operations of Major Tropical Fruits Perform On Farm Grain Post Harvest Analyze Foods and Agricultural products Service, Repair & Maintain Small Gasoline Engines Test & Analyze Microbiological Properties of Foods, Agri Products, Water & Wastewater Service, Repair & Maintain Crop Post Harvest Equipment Service, Repair & Maintain Crop Production Service, Repair & Maintain Small Diesel Engines Service Tractor’s Engine Service Tractor’s Clutch & Transmission System Service Tractor’s Hydraulic System Operate Tilapia Hatchery Grow Seaweed Operate catfish Hatchery Profile the Market Develop Marketing Plan Develop Marketing Communication Plan Promote Products & Services Market Agri Products Service Tractor’s Steering System Produce Fuel Byproducts Produce Compost Produce Handpaper Assess Farm Resources Assist in Aquaculture Operations Assist in Horticulture Operations Produce Biogas Byproducts Raise Poultry Raise swine Raise large Ruminants Aquaculture NC II Work in a team environment Demonstrate work values Practice housekeeping procedures (5S) Participate in workplace communication Work in team environment Practice career professionalism Work with others Develop and practice negotiation skills Use mathematical concepts and techniques Use relevant technologies Solve problems related to work activities Receive and respond to workplace communication Develop teams and individuals Utilize specialized communication skills Practice occupational health and safety procedures Lead workplace communication Collect, analyze and organize information Plan and organize work Apply problem- solving techniques in the workplace Lead small teams Promote environmental protection --- PDF PAGE 60 --- _______________________________________________________________________________ TR-Aquaculture NC II Promulgated December 2004 72 Acclimation - refers to adjusting the prevailing water condition of fish in an environment from lower to higher temperature to optimal temperature, from tower or higher salinity to optimal salinity (like from freshwater to salt water environment), etc. Average Body Weight - is the total weight of fish over the number of Fish AD-Libitum - refers to the mode of providing unlimited fish feeds to fish AFMA - Agriculture and Fisheries Modernization Act Aquarium Fish or Ornamental fish - Any fish that can be placed in confinement and with aesthetic value Artemia - live food commonly used for fish larvae BFAR - Bureau of Fisheries and Aquatic Resources BOD - Biological Oxygen Demand Brackish Water - refers to the mixture of freshwater and sea water naturally occurring in estuaries. Brachionus - a rotifer used as larval feed for marine & freshwater fish larvae Breeder - Sexually mature fish that are used for breeding Chlorella - A unicellular green algae cultured to serve as food of the zooplankton, rotifers and fry. Conditioning of Breeders - a method wherein the breeders are pampered by providing them nutritious feeds and optimum water conditions to effect the maturity of the fish D.O. (Dissolved Oxygen) - refers to a quantity of oxygen mixed with water in the operation of a paddle wheel or the action of air current. The unit of the D.O. is commonly expressed in part per million (ppm). FCR - Food Conversion Ratio is the Total amount of Feeds consumed over the Net Weight of Fish. Egg Fertilization - the process of mixing the fish eggs with fish milt either by natural or artificial method. Fish Nursery - refers to smaller unit areas of confinement wherein small fish larvae or fish fry are reared. It may either be in ponds, cages, tanks, etc Fish Pond - an aquaculture facility with an earthen bottom surrounded by dikes, with water inlets and drain outlets. --- PDF PAGE 61 --- _______________________________________________________________________________ TR-Aquaculture NC II Promulgated December 2004 73 Fish Cage - an aquaculture facility made of frames, net enclosures, mooring rope, anchors or poles installed in open waters like lakes, dams, rivers and sea-water coves, lagoons, impoundments etc. Fish Pen - aquaculture facility in inland areas such as lakes, rivers, darns spring and deep wells devoid of salinity Fry - newly hatched fish. Which are transparent, with big, head and does not in any way resemble the adult fish Grow out - refers to bigger unit areas of confinement where fingerlings are stocked and grown to marketable size. It may either be in ponds, cages and fish pens. Hapa Net - an enclosure made of fine mesh net for larvae/fry Hatchery Operation - refers to a large production of larvae/fry Hormones - are agents, (synthetically or naturally produced) used to fasten growth and induce ovulation and to effect sex reversal in fish. Incubator - are hatching facilities where fertilized eggs are hatched. Mature Breeders - fishes that are gravid (female) or with milt (male) Induce Spawning - an artificial propagation method through hormone injection to hasten the maturity of the eggs and trigger spawning Larvae - refers to newly hatched fish eggs Liming - application of agricultural lime in ponds to elevate soil pH of acidic ponds Modular Culture Technique - the process of culturing fish in grow-out units in short culture period. This requires one nursery unit in for every grow-out culture unit, thus making 4 to 5 harvests per year in one grow-out unit depending on the market size of fish OHS - Operating Health Standard Optimum - refers to the best environmental condition provided to the fish to effect maximum production Pathogenic Bacteria – disease causing bacteria pH Meter - instrument used to measure the hydrogen ions concentration of soil or water Phytoplankton - unicellular microscopic algae suspended in water Sea-Water - refers to waters with at east 32 ppt salinity Satiation feeding - refers to the feed consumption of fish wherein it indicates whether fish is fully filled-up to the gut. Seine Net - a type of fishing gear made up of nets, ropes, floats and sinkers used to harvest fish. --- PDF PAGE 62 --- _______________________________________________________________________________ TR-Aquaculture NC II Promulgated December 2004 74 Spawner - mature female fish or shrimp used for breeding. Stress - a negative environmental condition caused by biological, physical or chemical factors affecting the health, growth and well being of fish Stripping - an artificial method by gently pressing the belly of male and female brood fish to release eggs and milt Tanks - a culture system that is made up of cement, glass and plastic of different shapes Viable - a state or condition where an undertaking or venture in aquaculture results to good performance as to technical and economic profitability of a project Water Quality - refers to the over-all physical, chemical and biological parameters of the water Zooplankton - animal base food protein --- PDF PAGE 63 --- _______________________________________________________________________________ TR-Aquaculture NC II Promulgated December 2004 75 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies and labor groups who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL ADVISORY PANEL (TAP) MR. JOSE P.BALDIA MR. ENRIQUE A. MACADANGDANG President Aquaculture Consultant- Dagatan Agri- Ventures, Inc. Agri- Aqua Network Inc.(AANI) Barrio Liliw Laguna FTI Compound Consultant Head, Technical Operation Maya Farma Southern Triangle Management Inc. Sta. Maria, Bulacan Lower Baluan, General Santos City Aquaculture Consultant Chief Operating Officer Agri- Aqua Network Inc. (AANI) GIFT (Genetically Improved Farmed Tilapia) LHP Farm, Cabuyao, Laguna MR. JIMMY SAN JOSE MR. ALEJANDRO T. ESCANO Secretary General Chairperson Pambansang Alyansa ng Mangigisda ng Pamunuan at mga Organisasyon (PAMPANO) Aquaculture Based Countryside Development Enterprises, Inc. Jalajala, Rizal, Philippines NFARMC PMC Office, 880 Estuar Bldg., Quezon Avenue, Quezon City MR. EDUARDO A. LOPEZ Professor College of Fisheries Central Luzon State University Muñoz, Nueva Ecija • THE TECHNICAL EXPERT PANEL (TEP) MR. MAXIMO ARADA MR. LEOPOLDO C. RUBIA Training Consultant Vice Presient for Operations Agri-Aqua Network Inc. (AANI) Agri- Aqua Network Inc. (AANI) FTI Compound, Taguig, Metro Manila Technological University of the Phils. (TUP) Ayala Boulevard, Manila MR. FELIXBERTO C. MADLANGBAYAN MS. SOLEDAD CRUZ Owner - Instructor Provincial Aquaculture Officer JUST Agri- Aqua Resources Hagonoy, Bulacan Imus, Cavite --- PDF PAGE 64 --- _________