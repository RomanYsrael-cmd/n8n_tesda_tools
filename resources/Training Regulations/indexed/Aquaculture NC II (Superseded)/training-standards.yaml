  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for Aquaculture NC II.\n\n3.1.\nCURRICULUM DESIGN\n\nCourse Title: AQUACULTURE\n\nNC Level: NC II\n\nNominal Training Hours: 1,276 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and\nattitudes of aquaculture NCll in accordance with industry standards. It covers core\ncompetencies in assisting in aquaculture operations, preparing and maintaining\naquaculture facilities, operating fish nursery, performing fish or shrimp grow-out\noperations, and growing seaweeds..\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n\n1.2 Complete relevant work\nrelated documents.\n\n1.3 Participate in workplace\nmeeting and discussion.\n\nGroup discussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n\n2.2 Describe work as a team\nmember.\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n\n3.2 Set and meet work priorities.\n\n3.3 Maintain professional growth\nand development.\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n\n4.2 Control hazards and risks\n\n4.3 Maintain occupational health\nand safety awareness\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 44\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate safety\nmeasures\n1.3. Safekeep/maintain/\ndispose tools, materials\nand outfit.\nSelf-paced/modular\nLecture/Discussion\nInteraction\nPractical\nDemonstration\nVisit/tour\nOral/Written\nInterviews\nDirect\nObservation\nPractical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use farm\ntools\n2.2. Prepare and operate\nfarm equipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\nSelf-paced/modular\nLecture/Discussion\nInteraction\nPractical\nDemonstration\nVisit/tour\n\nOral/Written\nInterviews\nDirect\nObservation\nPractical\nDemonstration\n3. Perform\nestimation\nand\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n3.3. Apply corrective\nmeasures as necessary\nSelf-paced/modular\nLecture/Discussion\nInteraction\nPractical Exercise\nOral/Written\nexamination\nPractical\nexercise\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 45\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1\nConduct pre-\noperational\naquaculture\nactivities\n\n1.1 Inspect, clean/disinfect and\nrepair tools, simple equipment\nand aquaculture facilities\n1.2 Enumerate and explain\nfisheries and environmental\nlaws, rules and regulations\n1.3 Enumerate and explain the\nreasons for applying disease\ntreatment\n1.4 Apply the procedures in using\ndisinfectants, lime and\nfertilizers\n1.5 Determine method and volume\nof water for water exchange\n1.6 Differentiate normal mortality\nfrom initial outbreak of disease\n1.7 Apply the procedures in\nmonitoring, collecting and\nanalyzing mortalities\n1.8 Identify and apply the various\nmethods used in securing\naquaculture facilities from\nvarious predators and other\nthreats\nDemonstration\n\nDual training\n\nSelf-paced\nlearning\n(modular)\n\nWritten\nexamination\n\nDemonstration\nof practical\nskills\n\nDirect\nobservation\n\nInterview\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 46\n2 Prepare and\nmaintain\nAquaculture\nFacilities\n\n2.1 Select suitable pond site\nbased on ECC/EMB-DENR\nRequirement\n2.2 Determine Type of Soil\n2.3 Determine Water Adequacy\nand Quality\n2.4 Identify Prescribed\nTopography\n2.5 Determine land area, size and\nproject budget to suit the size\nshape, slope and materials to\nbe used\n2.6 Determine water adequacy\nand quality\n2.7 Analyze water for water current\nspeed using water current\nmeter\n2.8 Determine natural food by\nplankton sampling and\nmicroscopic examination\n2.9 Measure water transparency\n2.10 Determine substrate and tide\nlevel\n2.11 Identify and design and print\nspecification as to area of the\nland species to be cultured\nand systems\n2.12 Design strong dike to counter\nact forces of nature\n2.13 Identify materials to be used\nbased on production target\nand capitalization\n2.14 Plot markers as guide to the\nlay-out\n2.15 Determine number of farm\nfacilities\n2.16 Determine number, size of\ncompartment, depth of tank,\nbased on the area available\nand the species for culture.\n2.17 Identify materials to be used as\nto production and\ncapitalization.\n2.18 Plot markers as guide to the\nlay-out\n2.19 Determine number of farm\nfacilities to be used.\nDemonstration\nDual training\nSelf-paced\nlearning\nLecture\n\nWritten\nexamination\nDemonstration\nof practical\nskills\nDirect\nobservation\nInterview\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 47\n\n2.20 Determine pen and cages size,\nnumber to be constructed as to\navailability of the given area.\n2.21 Selecting framing materials,\ntype of nets to be used as to\nthe availability and suitability of\nthe area and species to be\ncultured.\n2.22 Determine materials based on\nsite selected\n2.23 Identify other farm facilities\nnecessary to the culture\nmodule\n2.24 Prepare Construction\nResources for Pen and Cages\n2.25 Fabricate Nets\n2.26 Construct and Set Net Frame\n2.27 Prepare Construction\nResources for Ponds.\n2.28 Perform Positioning of Major\nand Other Support Farm\nFacilities.\n2.29 Position Equipment\n2.30 Prepare construction\nresources for tanks\n2.31 Install life support system and\nposition equipment\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 48\n\n3\nOperate Fish\nNursery\n\n3.1 Dry the pond.\n3.2 Harrow and Dry the Soil\n3.3 Select Lime to be Used and\nApply\n3.4 Select and Apply Predator\nControl\n3.5 Allow the Natural Food to\nBloom\n3.6 Select Fertilizer and Compute\nRate Application\n3.7 Set-up aerators/agitators\n3.8 Determine water quality\nparameters\n3.9 Observe care in handling,\ntransporting and stocking of\nfishes\n3.10 Store Feeds Properly\n3.11 Sample and Analyze Feeds for\nRation\n3.12 Compute Daily Feed Ration\n3.13 Monitor Water Quality\n3.14 Maintain Optimum Water\nQuality\n3.15 Monitor and Observe Diseases\n3.16 Diagnose Infected Fish\n3.17 Identify Appropriate Treatment\n3.18 Practice Preventive Measures\nAgainst Disease\n3.19 Schedule harvest\n3.20 Prepare harvesting materials\n3.21 Observe proper handling while\nharvesting\n3.22 Demonstrate proper grading,\ncounting and packing of live\nfish\nDemonstration\n\nDual training\n\nSelf-paced\nlearning\n\nLecture\n\nWritten\nexamination\n\nDemonstration\nof practical\nskills\n\nDirect\nobservation\n\nInterview\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 49\n\n4 Perform Fish\nOr Shrimp\nGrow-Out\nOperations\n\n4.1 Prepare pond\n4.2 Install Pens and Cages\n4.3 Clean Tanks\n4.4 Acclimatize fish / crustacean\nfingerlings to pH, temperature\nand Salinity.\n4.5 Release fingerlings at\nappropriate time of the day.\n4.6 Determine procedures in stock\nsampling\n4.7 Calculate periodic stock\nsampling\n4.8 Source feeds\n4.9 Store feeds properly\n4.10 Compute feed ration and feed\nthe fish\n4.11 Monitor water quality using\nappropriate instrument\n4.12 Maintain optimum water quality\n4.13 Observe and Monitor Disease\n4.14 Sample and Diagnose Infected\nFish\n4.15 Identify and Implement\nTreatment\n4.16 Determine preventive\nmeasures against agents of\ndiseases\n4.17 Prepare harvesting materials\n4.18 Seine stocks in pond and pen\n4.19 Lift cage bags\n\nDemonstration\n\nDual training\n\nSelf-paced\nlearning\n\nLecture\n\nWritten\nexamination\n\nDemonstration\nof practical\nskills\n\nDirect\nobservation\n\nInterview\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 50\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\n The training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards\nand the curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in school and in-industry training\nor fieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ntrainer facilitates the training delivery\n\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 51\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study, or\naudio, video or computer technologies.\n\n• Project-Based Instruction is an authentic instructional model or strategy\nin which students plan, implement and evaluate projects that have\nreal world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements:\n\n•\nAble to read and write\n•\nWith good moral character;\n•\nAbility to communicate, both oral and written\n•\nPhysically fit and mentally healthy as certified by a Public Health\nOfficer\n\n--- PDF PAGE 54 ---\n____________________________________________________________________________\nTR-Aquaculture NC II Promulgated December 2004\n\n66\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nAQUACULTURE NCII\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Aquaculture NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\nQTY\n5 pcs\nDO meters\n1\n Surveying\nequipment\n1\nManpower\nResources\n5 pcs\nFlow rate meter\n\n1\n generator\n1\nLearning Materials\n25 pcs\nLaboratory\nthermometer\n2\nMicroscope\n\n1\nR.A. 8550\n10 pcs\nShovel\n1\nPlankton counter\n1\nReference book\n5 pcs\nWater depth\ngauge\n1\nWelding machine\n1\nInstructional manual\n5 pcs\nDigging blades\n5\nG.I. pipe\n1\nReference book\n5 sets\nElectrical tools\n2\nPuddle wheel\n1\nBrochures\n\nLumber\n1\nWater pump\n1\nLocal map\n2 sets\nMasonry tools\n\n1\nHauling containers\n1\nTide calendar\n\n2 sets\nCarpentry tools\n1\noxygen tank\n1\nModel of different\npond design\n\n5 pcs\nCultivator / rake\n1\nStorage/tool cabinet\n1\nList of species for\ncultivation\n\nLime\n1\nFeed storage\n1\nList of culture\nsystem\n\nNet\n\n1\nfilled oxygen tank\n1\nDrawing materials\n\nP.E. rope\n1\nChilling tank\n1\nTide indicators\n\n10 pcs\nPail, plastic\n1\nGuard house\n\n1\nCopy of financial\nstatement\n5 pcs\nRunning board\n\n1\nLay-out plan\n5 pcs\nWeighing scale\n\n1\nList of dealers\n10 pcs\nWelding rod\n\n5 pcs\nCutting tools\n\n1\n Price list\n5 rolls\nTying materials\n\n1\nProduction size\n\n5\nFloats\n\nSupplies and\nMaterials\n1\nIllustration of\ndifferent design and\nshape of pen and\ncages\n\n25 pcs\nSafety shoes\n\n5\nLive specimens\n1\nList of framing\nmaterials\n\n25 pcs\nPencil\n\n5\nNormal fish,\nsamples\n1\nList of materials\navailable in the area\n25 pcs\nRuler\n5\nInfected fish,\n1\nList of farm facilities\n\n--- PDF PAGE 55 ---\n__________________________