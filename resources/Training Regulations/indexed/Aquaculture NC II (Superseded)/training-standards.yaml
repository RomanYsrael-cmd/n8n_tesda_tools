 Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by the learner who enrolled in\na structured learning program to determine the achievement of\ncompetencies. It is administered by the trainer/assessor at end of each\nlearning module.\n\n--- PDF PAGE 58 ---\n____________________________________________________________________________\nTR-Aquaculture NC II Promulgated December 2004\n\n70"
