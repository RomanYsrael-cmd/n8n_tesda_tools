        "source_text": "--- PDF PAGE 27 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 25\n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :    CONDUCT PRE-OPERATIONAL AQUACULTURE \nACTIVITIES \n \nUNIT CODE  \n \n: \nAGR641301 \n \nUNIT DESCRIPTOR: This unit covers the knowledge and skills required to assist in \naquaculture operations including the preparation of tools and simple equipment and \nperformance of simple routine operations \n \nELEMENTS \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Prepare tools and \nsimple equipment  \n1.1 Tools and equipment are checked and cleaned  \n1.2 Harvesting tools are checked for damage and simple \nrepair is performed if necessary \n1.3 Catch nets are inspected and worn-out nets, if \npossible, are repaired  \n1.4 Aquaculture facilities are inspected and minor repair, \nif possible, are performed\n2. Change water of \naquaculture facility \n2.1 Volume of water to be changed is determined in \naccordance to organizational standard procedures \n2.2 Appropriate method of water exchange is selected in \naccordance to organizational standards \n2.3 Water exchange is carried-out in accordance with \nsupervisor instructions and standard procedures \n3. Monitor and collect \nmortalities \n3.1 Normal mortality is determined and differentiated from \ninitial disease outbreak \n3.2 Mortalities are counted and documented daily in \naccordance to organizational standard procedures \n3.3 Mortalities are collected and placed in appropriate \nfreezer for post mortem analysis\n4. Prepare \naquaculture \nfacilities \n4.1 Pond preparation is conducted in accordance to \norganizational standard procedures \n4.2 Net cages and frames are brushed and repaired if \npossible \n4.3  Tanks are cleaned and disinfected following standard \nprocedures\n5. Secure facilities \n5.1  Facilities are checked for fish predators and \ntrespassers \n5.2  Fish predators and trespassers are prevented to enter \nthe aquaculture facilities \n5.3  Preventive structures are installed during inclement \nweather following standard procedures  \n5.4  Tools and equipment are properly stored\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 26\n \n \n \nRANGE OF VARIABLES \nVARIABLE \nSCOPE\n1.  Tools \n1.1 Scoop nets \n1.2 Basins \n1.3 Buckets \n1.4 Glassware \n \n2.  Simple \nequipment \n2.1 Pumps \n2.2 Weighing scales \n2.3 Thermometer \n \n3.  Aquaculture \nfacilities \n3.1 Dikes \n3.2 Nets \n3.3 Frames \n3.4 Drainage system \n \n4.  Method of water \nexchange \n4.1 Flow-through \n4.2 Drain and fill \n \n5.  Predators \n      \n \n5.1 Birds \n5.2 Frogs \n5.3 Man\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 27\n \nEVIDENCE GUIDE\n1.  Critical Aspects of \nCompetency: \n \nAssessment requires evidence that the candidate: \n1.1  Prepared tools and simple equipment for aquaculture \noperations \n1.2 Changed water of aquaculture facility \n1.3 Monitored and collected mortalities \n1.4 Prepared aquaculture facilities \n1.5 Secured facilities \n \n2. Underpinning \nKnowledge and \nSkills  \n \n2.1   Safety Practices \n2.1.2 Swimming \n2.1.3 Weighing  \n2.1.4 Proper application of disease treatment \n2.1.5 Proper application of disinfectants, lime and \nfertilizers \n \n2.2   Communication \n2.2.1 Prepare and submit regular accomplishment \nreports on all fish aquaculture activities \n2.3   Mathematics and Mensuration \n2.3.1 Basic mathematical operations \n2.3.1.1 \nProduction recording \n2.3.2 Percentages and rations \n \n2.4   Blueprint reading \n2.5   Codes and Regulations \n2.5.1 Comply with fisheries and Environmental Laws, \nRules and Regulations \n2.6   Tools & Equipment: Uses and Specifications \n2.6.2 Can understand and follow instructional \nmanuals \n2.6.3 Safe keeping of equipments every after use \n2.7   Materials: Uses and Specifications \n2.7.1 Where to source good quality supplies, materials \nand equipment needed in the operation of the \naqua farm project \n2.8   Systems, Processes and Operations \n2.8.1 Program of work activities are implemented as \nscheduled \n2.9   Maintenance \n2.9.1 Regular upkeep of equipments and facilities \n2.9.2 Preventive maintenance skills \n2.10 Values \n2.10.1 Positive outlook towards work \n2.10.2 Possesses pre-emptive/anticipatory skills\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 28\n3. Underpinning Skills \n3.1 Skills to determine good quality and expected \nperformance of supplies, materials and equipment \nbefore accepting the goods delivered \n3.2 Planning and prioritizing work activities to be \nundertaken \n3.3 Regular monitoring, recording and making progress \naccomplishment reports about the aquaculture project \n4. Method of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation and questions  \n4.2 Third party report \n \n5. Resource \nImplications \n5.1 All supplies, materials and equipment needed during \ndesign, construction and operations of fish \nhatcheries should be readily available at the farm \nsite \n5.2 All workers involved in the fish hatchery project must \nbe fully oriented and cautioned on the different \nspecific work activities of the project \n5.3 Technical supervisors should have skills and ability \nin the successful implementation of work program \nactivities \n \n6. Context of \nAssessment \n6.1 In the workplace or in a simulated workplace setting \n6.2 While tasks are undertaken either individually or as \npart of a team under limited supervision \n6.3 Third party report\n",
