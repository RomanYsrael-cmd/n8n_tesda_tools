          "source_text": "1. Critical Aspects of\nCompetency\n\n1.1 Prepared nursery ponds\n1.2 Performed nursery operations\n1.3 Performed feeding operations\n1.4 Maintained good water quality\n1.5 Performed common disease monitoring and implement\ntreatment\n1.6 Practiced techniques in harvest and post harvest\nhandling\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Good work supervision during the construction of\naqua farm ensuring that specifications are strictly\nfollowed and implemented\n2.1.2 Ideal good technical work habits to demonstrate to\nworkers easy and safety standards during\nconstruction and operation of aqua farm projects\n\n2.2\nCommunication\n2.2.1 Prepare and submit regular accomplishment\nreports on all aqua farm activities\n\n2.3 Mathematics and Mensuration\n2.3.1 Calculation to determine Average Body Weight\n(ABW) of fish, daily feeding ration and Feed\nConversion ratio (FCR)\n2.3.2 Calculation in fertilizer and lime application for a\ngiven unit area\n2.3.3 Calculation for disease treatment and pest control\n\n2.4\nDrawings reading\n2.4.1\nKnowledgeable in reading, design lay-out and\nsystems of a nursery ponds\n\n2.5 Codes and Regulations\n2.5.1\nComply with fisheries and Environmental Laws,\nRules and Regulations\n\n2.6 Tools & Equipment: Uses and Specifications\n2.6.1 Knowledgeable in calibrating & using common\naquaculture equipment\n2.6.2 Can understand and follow instructional manuals\n2.6.3 Safe keeping of equipment every after use\n\n2.7\nMaterials: Uses and Specifications\n2.7.1 Where to source good quality supplies, materials\nand equipment needed in the construction of the\naqua farm project\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 38\n2.8 Systems, Processes and Operations\n2.8.1 Program of work activities are implemented as\nscheduled\n\n2.9 Maintenance\n2.9.1 Regular upkeep of equipment and facilities\n2.9.2 Preventive maintenance skills\n\n2.10 Values\n2.10.1 Positive outlook towards work\n2.10.2 Possesses pre-emptive/anticipatory skills\n3. Underpinning Skills\n3.1 Computed lime, fertilizer and predator control requirement\nfor pond application\n3.2 Performed correct fish sampling procedures\n3.3 Solved problems related to fish nursery operations\n3.4 Used and maintained aquaculture tools and equipment\n4. Method of Assessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation and questioning\n4.2 Third party report\n5. Resource Implications\n5.1 All supplies, materials and equipment needed during\ndesign, construction and operations of aqua farms\nshould be readily available at the farm site\n5.2 All workers involved in the aqua farm project must be fully\noriented and cautioned on the different specific work\nactivities of the project\n5.3 Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities\n6. Context of Assessment 6.1 In the workplace or in a simulated workplace setting\n6.2 While tasks are undertaken either individually or as part of\na team under limited supervision\n6.3 Third party report\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 39\nUNIT OF COMPETENCY :\nPERFORM FISH OR SHRIMP GROW-OUT\nOPERATIONS\n\nUNIT CODE\n\n:"
