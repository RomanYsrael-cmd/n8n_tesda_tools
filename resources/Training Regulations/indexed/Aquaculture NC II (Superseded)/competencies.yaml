 Skills to determine good quality and expected\nperformance of supplies, materials and equipment\nbefore accepting the goods delivered\n3.2 Planning and prioritizing work activities to be\nundertaken\n3.3 Regular monitoring, recording and making progress\naccomplishment reports about the aquaculture project\n4. Method of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation and questions\n4.2 Third party report\n\n5. Resource\nImplications\n5.1 All supplies, materials and equipment needed during\ndesign, construction and operations of fish\nhatcheries should be readily available at the farm\nsite\n5.2 All workers involved in the fish hatchery project must\nbe fully oriented and cautioned on the different\nspecific work activities of the project\n5.3 Technical supervisors should have skills and ability\nin the successful implementation of work program\nactivities\n\n6. Context of\nAssessment\n6.1 In the workplace or in a simulated workplace setting\n6.2 While tasks are undertaken either individually or as\npart of a team under limited supervision\n6.3 Third party report\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 29\nUNIT OF COMPETENCY :\nPREPARE AND MAINTAIN AQUACULTURE\nFACILITIES\n\nUNIT CODE\n\n:\nAGR641302\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required\nto prepare and maintain aquaculture facilities for\ngrow-out operations. Aquaculture facilities include\nthe pond, tanks, pens and cages.\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nEvaluate site\n\n1.1 Pond\n1.1.1 Site is determined for suitability for a\nspecific aquaculture project based on\nproject standard\n1.1.2 Soil is sampled using an Eckman Dredge\nand analyzed for soil type to ascertain\nwater retention capacity such as clay:\nloam ratio\n1.1.3 Water resource is determined for volume\nadequacy using flow rate meter or by\nvolume calibration technique.\n1.1.4 Water quality for suitability is assessed for\ncommon physico-chemical parameters\nbased on The Standard Methods in the\nAnalysis of Water and Wastewater.\n1.1.5 Topography is measured using a transit\nto establish the zero datum, level for\nwater supply and drainage system,\n1.2 Pens and Cages\n1.2.1 Water is analyzed for water current speed\nusing water current meter\n1.2.2 Natural food is determined by plankton\nsampling and microscopic examination to\nestablish the feeding requirement\n1.2.3 Transparency is measured using a Secchi\ndisc to determine the suitable species to\nculture.\n1.2.4 Substrate is determined by using the\nEckman Dredge\n1.2.5 Tide level of the area is read to establish\ntype of material and depth of facilities\n1.3 Tank\n1.3.1 Land area size and project budget is\ndetermined to suite the size, shape and\nmaterials to be used.\n1.3.2 Water is sampled/analyzed using water\nquality test instruments\n1.3.3 Water adequacy is determined by water\nflow rate translated to liters per minute\n(lpm).\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 30\n2.\nDraw the lay-out plan\n2.1 Pond\n2.1.1 Area and depth of pond is in conformity\nwith project requirement and species to\nbe cultured\n2.1.2 The number and size of compartments is\ndetermined based on the available area\nof the land\n2.1.3 Dikes crown and base is confirmed\nbased on the tide level, typhoon and\nflooding history of the area\n2.1.4 The materials to be used are determined\nbased on production target and\ncapitalization\n2.1.5 Markers,/strings are placed as guide to\nthe layout\n2.1.6 Number of water pumps and well/water\nresource to be used and its location is\ndetermined\n2.1.7 Other farm facilities are planned and laid-\nout\n2.2 Tanks\n2.2.1 Area and depth of Tank should conform\nwith available site selected and species\nto be cultured\n2.2.2 The number and size of compartments is\ndetermined based on the area of the land\n2.2.3 The materials to be used are determined\nbased on production target and\ncapitalization\n2.2.4 Markers,/strings are placed as guide to\nthe layout\n2.2.5 Determine number of water pumps and\nwell/water resource to be used and\nlocation\n2.2.6 Other farm facilities are planned and\nlaid-out\n2.3 Pens\n2.3.1\nArea and depth of facilities should\nconform with available site selected\n2.3.2\n Materials for frame and type of net to\nbe used are determined based on the\nsite selected and species to be cultured\n2.3.3\nMaterials are source for availability in\nthe area and cost is determined\n2.3.4\n Other farm facilities are planned and\nlaid-out\n\n2.4 Cages\n2.4.1\n Area and depth of facilities should\nconform with project requirement and\nspecies to be cultured\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 31\n2.4.2\n Materials for frame and type to be used\nare determined based on the site\nselected\n2.4.3\nMesh size of net is determined based\non available fingerling size in the area\nand species of fish\n2.4.4\nMaterials are source for availability in\nthe area and cost is determined\n2.4.5\nOther farm facilities are laid-out\n3.\nMobile resources and\ncarry-out installation of\nfacilities\n3.1 Ponds\n3.1.1 Construction resources (materials and\nmanpower) for ponds are prepared\n3.1.2 Major and other support farm facilities\nare installed\n3.1.3 Equipment is positioned according to\nenterprise requirement\n3.2 Tanks\n3.2.1 Construction resources (materials and\nmanpower) are prepared adequately\n3.2.2 Lay-out of facilities are installed\n3.2.3 Life support system is appropriately\ninstalled\n3.2.4 Equipment is appropriately positioned\n3.3 Pens\n3.3.1 Construction resources are prepared\nincluding materials and manpower\n3.3.2 Posts are positioned appropriately\n3.3.3 Netting materials and attach floats and\nsinkers are fabricated\n3.3.4 Net are inspected for any damage\n3.3.5 Set-up Net are st up to fit the frame\n3.3.6 Bottom of net is placed in proper place\n3.4 Cages\n3.4.1 Construction resources including\nmaterials and manpower are prepared\n3.4.2 Posts are positioned according to\nenterprise requirements\n3.4.3 netting materials are fabricated and\nattached to floats and sinkers\n3.4.4 Net are inspected for damage\n3.4.5 Net are set-up to fit the frame\n3.4.6 Bottom of net is checked if it is in proper\nplace\n3.4.7 Mooring system is checked accdg. to\nindustry requirements\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 32\n\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n1. Soil type\n\n1.1 Clay\n1.2 Loam\n1.3 Sand\n2. Water resource\n2.1 Shallow well\n2.2 Irrigation\n2.3 Natural waters (Lake, lagoon, impoundments, river)\n3. Species\n\n3.1 Tilapia\n3.1 Milkfish\n3.2 Grouper\n3.3 Sea bass\n3.4 Catfish\n4. Life Support\n4.1\nAeration line\n4.2\nWater Line\n4.3\nDrainage Line\n5. Pumps\n5.1 Electric\n5.2 Diesel\n5.3 Gasoline\n6. Topography\n6.1 Flat\n6.2 Sloping\n7. Farm Facilities\n7.1 Guardhouse\n7.2 Staff house\n7.3 Feed warehouse\n8. Materials to be\nused\n8.1 Tanks\n8.1.1\nCement\n8.1.2\nFiberglass\n8.1.3\nCanvass\n8.1.4\nPlastic\n8.2 Pens/Cages Frames\n8.2.1\nBamboo\n8.2.2\nG.I. Pipe\n8.2.3\nPVC Pipes\n8.3 Net Mesh\n8.3.1\nSize 22\n8.3.2\nSize 20\n8.3.3\nSize 17\n8.3.4\nSize 14\n8.4 Pond\n8.4.1\nCemented Dike\n8.4.2\nPlastic Lined\n8.4.3\nEarthen\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 33\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Selected a site that is suitable and available using\nthe following skills:\n1.1.1. Environmental scanning and survey using\nInstrument to measure water current\nvelocity, volume assessment, water depth,\netc.\n1.1.2. Soil/water sampling for analysis using\ntesting Instruments.\n1.2 Selected site in conformity with ECC requirement\nand EMB-DENR regulations.\n1.3 Effectively supervised, mobilized and utilized to\nthe fullest the available construction resources:\n1.3.1 Scheduled and implemented work program\nactivities and attained targeted budget and\ntime frame\n1.3.2 Mobilized construction equipment and\nmanpower requirement as per schedule\n1.3.3 Canvassed construction materials and\nequipment and prioritized acquisition based\non budget limitations\n1.3.4 Supervised construction work in strict\nconformity with the project design and\nlayout.\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Safety Practices\n2.1.1 Good work supervision during the\nconstruction of aqua arm facilities ensuring\nthat specifications are strictly followed and\nimplemented\n2.1.2 Where to source good quality supplies,\nmaterials and skilled laborers needed for the\naqua facilities\n2.1.3 Ideal good technical work habits to\ndemonstrate to workers easy and safety\nstandards during construction of the aqua\nfarm projects\n2.1.4 Program of work activities are implemented\nas scheduled\n2.2 Communication\n2.2.1 Prepare and submit regular accomplishment\nreports on all aqua facilities construction\nactivities\n2.3 Mathematics and Mensuration\n2.3.1 Ability to calculate and measure volume, weight\nand distances. Ratio and proportion calculation\n2.4 Drawings reading\n2.4.1 Ability to read and interpret layout plan of an\naquaculture facility\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 34\n\n2.5\nCodes and regulations\n2.5.1 Environmental Compliance Certificate (ECC)\n2.5.2 Municipal Permit and regulations\n2.5.3 Rules and regulations of mangrove\nexploitation\n\n2.6\nMaterials: Uses and Specifications\n2.6.1 Where to source good quality supplies,\nmaterials and equipment needed in the\nconstruction of the aqua farm project\n\n2.7\nSystems, Processes and Operations\n2.7.1 Program of work activities are implemented\nas scheduled\n\n2.8\nValues\n2.8.1 Positive attitude towards work\n2.8.2 Possesses pre-emptive/anticipatory skills\n3. Underpinning Skills\n3.1 Sampled soil using Eckman Dredge and analyzed\nsoil type\n3.2 Assessed water for suitability based on the\nStandard Methods in the Analysis of water and\nwastewater\n3.3 Assessed water volume adequacy using current\nflow or volumetric method\n3.4 Established ground elevation using a transit\n4. Method of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation of applicant to task and questions\nrelated to underpinning knowledge\n4.2 Third Party report\n5. Resource Implications 5.1 All required supplies, materials and equipment\nneeded during design, construction and operations\nof aquaculture facilities should be readily available\nat the farm site\n5.2 All workers involved in the aqua farm project must be\nfully oriented and cautioned on the different specific\nwork activities of the project\n5.3 Technical supervisors should have skills and ability in\nthe successful implementation of the work program\n6. Context of\nAssessment\n6.1 Direct observation and questioning\n6.2 Third party report\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 35\nUNIT OF COMPETENCY :\nOPERATE FISH NURSERY\n\nUNIT CODE\n\n:\nAGR641303\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required\nto prepare and operate fish nursery in ponds.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare nursery ponds\n1.1 Dry pond until cracking stage\n1.2 Repaired & plowed the soil and dried again\n1.3 Selected lime to be used and computed for amount\nbased on soil pH\n1.4 Predator control is selected, amount computed and\napplied\n1.5 Selected fertilizer and computed amount of\napplication\n1.6 Natural food is allowed to bloom\n1.7 Aerators/agitators are set-up\n2. Stock fish in nursery pond 2.1 Water quality parameters i.e. D.O., Transparency,\nNitrates, Ammonia and Temperature are determined\nprior to stocking of fry\n2.2 Determined amount of fry to be stocked\n2.3 Assessed fry quality\n2.4 Care was observed in handling, transporting and\nstocking of fishes\n3. Perform feeding\noperations\n3.1 Feeds are sourced, processed and stored properly\n3.2 Formulated feed is sampled and analyzed for feed\nration\n3.3Daily feed ration is computed\n4. Monitor good water quality 4.1 Water quality is maintained\n4.2 Water is changed regularly\n4.3 Sustained the growth of natural food\n5. Perform common disease\nmonitoring and implement\ntreatment\n\n5.1 Disease is periodically observed and monitored\n5.2 Prevention and safeguard of disease and parasite\noccurrence\n5.3 Diseased or moribund fish is sampled and brought\nto the laboratory for diagnosis based on symptoms\n5.4 Appropriate treatment is determined\n6. Harvest and post harvest\nhandling\n6.1 Timely scheduled harvest\n6.2 Prepare supplies and materials required in the\nharvest operation\n6.3 Observe proper capture and handling procedure\nduring harvest so as to maintain good quality fish\nfingerlings\n6.4 Initiated proper conditioning, grading, counting,\npacking and live fish handling/transport\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 36\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1.\nLimed\n1.1 Agricultural lime\n1.2 Hydrated lime\n1.3 Industrial lime\n2. Fertilized\n2.1 Chicken Manure\n2.2 Urea\n2.3 Ammonium phosphate\n2.4 Combinations\n3.\nPredator Control\n3.1 Derris Roots (Tubli),\n3.2 Tea Seed Cake,\n3.3 Tobacco Dust,\n3.4 Ammonium Sulfate.\n4.\nAerators/agitators\n4.1 Ring/vortex blowers\n4.2 Roots blower\n4.3 Paddlewheel aerator\n4.4 Airo2\n5.\nDisease\n5.1 Nutritional\n5.2 Bacterial\n5.3 Fungal\n5.4 Parasitic\n5.5 Viral\n5.6 Environmental\n6.\nSymptoms\n6.1 Swirling\n6.2 Swimming at surface\n6.3 Non-feeding\n6.4 Lethargic\n6.5 Cottony growth\n6.6 Lesions\n6.7 Septicemia\n6.8 Over production of mucous\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 37\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\n\n1.1 Prepared nursery ponds\n1.2 Performed nursery operations\n1.3 Performed feeding operations\n1.4 Maintained good water quality\n1.5 Performed common disease monitoring and implement\ntreatment\n1.6 Practiced techniques in harvest and post harvest\nhandling\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Good work supervision during the construction of\naqua farm ensuring that specifications are strictly\nfollowed and implemented\n2.1.2 Ideal good technical work habits to demonstrate to\nworkers easy and safety standards during\nconstruction and operation of aqua farm projects\n\n2.2\nCommunication\n2.2.1 Prepare and submit regular accomplishment\nreports on all aqua farm activities\n\n2.3 Mathematics and Mensuration\n2.3.1 Calculation to determine Average Body Weight\n(ABW) of fish, daily feeding ration and Feed\nConversion ratio (FCR)\n2.3.2 Calculation in fertilizer and lime application for a\ngiven unit area\n2.3.3 Calculation for disease treatment and pest control\n\n2.4\nDrawings reading\n2.4.1\nKnowledgeable in reading, design lay-out and\nsystems of a nursery ponds\n\n2.5 Codes and Regulations\n2.5.1\nComply with fisheries and Environmental Laws,\nRules and Regulations\n\n2.6 Tools & Equipment: Uses and Specifications\n2.6.1 Knowledgeable in calibrating & using common\naquaculture equipment\n2.6.2 Can understand and follow instructional manuals\n2.6.3 Safe keeping of equipment every after use\n\n2.7\nMaterials: Uses and Specifications\n2.7.1 Where to source good quality supplies, materials\nand equipment needed in the construction of the\naqua farm project\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 38\n2.8 Systems, Processes and Operations\n2.8.1 Program of work activities are implemented as\nscheduled\n\n2.9 Maintenance\n2.9.1 Regular upkeep of equipment and facilities\n2.9.2 Preventive maintenance skills\n\n2.10 Values\n2.10.1 Positive outlook towards work\n2.10.2 Possesses pre-emptive/anticipatory skills\n3. Underpinning Skills\n3.1 Computed lime, fertilizer and predator control requirement\nfor pond application\n3.2 Performed correct fish sampling procedures\n3.3 Solved problems related to fish nursery operations\n3.4 Used and maintained aquaculture tools and equipment\n4. Method of Assessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation and questioning\n4.2 Third party report\n5. Resource Implications\n5.1 All supplies, materials and equipment needed during\ndesign, construction and operations of aqua farms\nshould be readily available at the farm site\n5.2 All workers involved in the aqua farm project must be fully\noriented and cautioned on the different specific work\nactivities of the project\n5.3 Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities\n6. Context of Assessment 6.1 In the workplace or in a simulated workplace setting\n6.2 While tasks are undertaken either individually or as part of\na team under limited supervision\n6.3 Third party report\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 39\nUNIT OF COMPETENCY :\nPERFORM FISH OR SHRIMP GROW-OUT\nOPERATIONS\n\nUNIT CODE\n\n:\nAGR641304\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required\nto perform fish or crustacean grow-out operations like the preparation of grow-out\nfacilities, stocking, undertake grow-out farming protocols and harvesting.\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare grow-out\nfacilities\n1.1 Ponds\n1.1.1\nPond is dried\n1.1.2\nEliminated predators by applying predator\ncontrol\n1.1.3\nLime is applied to elevate soil pH\n1.1.4\nFertilizer is applied\n1.2 Pens and Cages\n1.2.1\nFrames are installed or set-up\n1.2.2\nNet Mesh are determined and fabricated into\ncages and installed to the cage frame\n1.3 Tanks\n1.3.1\nTanks are cleaned, dried and disinfected\n2. Stocking of\nfingerlings\n2.1 Fish/crustacean fingerlings are acclimatized for pH,\ntemperature and salinity\n2.2 Fingerling quality is assessed\n2.3 Fingerlings are released as schedule or at appropriate\ntime of the day\n2.4 Maintained growth of natural food\n3. Stock sampling\nProcedures in stock sampling\n3.1 Stock samples are weighed for ABW determination and\ncounting for survival estimates\n3.2 Stock sampling are undertaken regularly\n4. Perform feeding\noperations\n4.1 Feeds are selected based on quality\n4.2 Feeds are sampled and analyzed periodically\n4.3 Daily feed ration is computed and feed given are\nrecorded\n5. Maintain good\nwater quality\n5.1 Water quality is monitored using appropriate\nmeasuring instruments according to the Standard\nMethods In The Analysis Of Water And Wastewater\n5.2 Optimum water quality is maintained by water exchange\nand bio-manipulation\n5.3 Amount of water changed was based on water quality\n6. Perform common\ndisease diagnosis\nand treatment\n6.1 Disease is observed and monitored through physical\nappearance and behavioral patterns\n6.2 Infected fish is sampled and diagnosed\n6.3 Treatment is identified and implemented\n6.4 Prevention/safeguard against occurrences of viral,\nbacterial, fungal and parasitic diseases\n7. Harvest stocks &\nPost harvest\nhandling\n7.1 Pond and cages are seined\n7.2 Cages are lifted\n7.3 Harvested fishes are packed and transported\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 40\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Limed\n\n1.1 Agri-Lime\n1.2\nHydrated Lime\n\n2. Fertilized\n2.1 Chicken Manure\n2.2 Urea\n2.3 Ammonium phosphate\n2.4 Combinations\n3. Appropriate\nMeasuring\ninstruments\n3.1 DO Meter\n3.2 Thermometer\n3.3 PH meter\n3.4 Secchi Disc\n3.5 Ammonia and Nitrate test Kits\n4. Predator Control\n4.1 Derris Roots (Tubli)\n4.2 Tea Seed Cake\n4.3 Tobacco Dust\n4.4 Ammonium Sulfate.\n5. Disease\n5.1 Nutritional\n5.2 Bacterial\n5.3 Fungal\n5.4 Parasitic\n5.5 Viral\n5.6 Environmental\n6. Physical\nappearance and\nbehavioral\npatterns\n6.1\nSwirling\n6.2\nSwimming at surface\n6.3\nNon-feeding\n6.4\nLethargic\n6.5\nCottony growth\n6.6\nLesions\n6.7\nSepticemia\n6.8\nOver production of mucous\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 41\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared grow-out facilities\n1.2 Stocked fingerlings\n1.3 Sampled the stocks\n1.4 Performed feeding operations\n1.5 Maintained good water quality\n1.6 Performed common disease diagnosis and treatment\n1.7 Harvested the stocks\n2. Underpinning\nKnowledge and\nSkills\n\n2.1 Safety Practices\n2.2.1 Good work supervision during the construction\nof aqua farm facilities ensuring that\nspecifications are strictly followed and\nimplemented\n2.2.2 Ideal good technical work habits to demonstrate\nto workers easy and safety standards during\nconstruction and operation of aqua farm\nprojects\n\n2.2 Communication\n2.2.1 Prepare and submit regular accomplishment\nreports on all aqua farm activities\n\n2.3 Mathematics and Mensuration\n2.3.1 Calculation to determine Average Body Weight\n(ABW) of fish, daily feeding ration and Feed\nConversion ratio (FCR)\n2.3.2 Calculation in fertilizer and lime application for a\ngiven unit area\n2.3.3 Calculation for disease treatment and pest\ncontrol\n2.4\nDrawings reading\n2.4.1 Knowledgeable in reading and interpreting,\ndesign lay-out and systems of grow-out ponds\n\n2.5 Codes and Regulations\n2.5.1 Comply with fisheries and Environmental Laws,\nRules and Regulations\n\n2.6 Tools & Equipment: Uses and Specifications\n2.6.1 Knowledgeable in calibrating & using common\naquaculture equipment\n2.6.2 Can understand and follow instructional\nmanuals\n2.6.3 Safe keeping of equipments every after use\n\n2.7\nMaterials: Uses and Specifications\n2.7.1 Where to source good quality supplies,\nmaterials and equipment needed in the\nconstruction of the aqua farm project\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 42\n2.8 Systems, Processes and Operations\n2.8.1 Program of work activities are implemented as\nscheduled\n\n2.9 Maintenance\n2.10.1 Regular upkeep of equipments and facilities\n2.9.2 Preventive maintenance skills\n\n2.10\nValues\n2.10.1 Positive outlook towards work\n2.10.2 Possesses pre-emptive/anticipatory skills\n3. Underpinning\nSkills\n3.1 Prepared facilities properly\n3.2 Performed correct fish stocking procedures\n3.3 Maintained growth of natural food\n3.4 Performed fish sampling fish weekly\n3.5 Computed ration\n3.6 Monitored water quality parameters\n3.7 Common diseases were diagnosed and treated\n3.8 Used and maintained aquaculture tools and\nequipment\n4. Method of\nAssessment\nCompetency in this unit will be assessed through:\n4.1 Direct observation and questions\n4.2 Third party report\n5. Resource\nImplications\n5.1 All supplies, materials and equipment needed during\ndesign, construction and operations of aquaculture\nfarms should be readily available at the farm site\n5.2 All workers involved in the aqua farm project must be\nfully oriented and cautioned on the different specific\nwork activities of the project\n5.3 Technical supervisors should have skills and ability in\nthe successful implementation of work program\nactivities\n6. Context of\nAssessment\n6.1 Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be done while tasks are undertaken\neither individually or as part of a team under limited\nsupervision\n6.3 Third party report\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________\nTR-Aquaculture NC II\n\nPromulgated December 2004 43"
