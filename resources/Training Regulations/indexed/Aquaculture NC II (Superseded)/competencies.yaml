Water is sampled/analyzed using water \nquality test instruments  \n1.3.3 Water adequacy is determined by water \nflow rate translated to liters per minute \n(lpm).\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 30\n2. \nDraw the lay-out plan \n2.1 Pond  \n2.1.1   Area and depth of pond is in conformity \nwith project requirement and species to \nbe cultured \n2.1.2 The number and size of compartments is \ndetermined based on the available area \nof the land \n2.1.3 Dikes crown and base is confirmed \nbased on the tide level, typhoon and \nflooding history of the area \n2.1.4 The materials to be used are determined \nbased on production target and \ncapitalization \n2.1.5 Markers,/strings are placed as guide to \nthe layout \n2.1.6 Number of water pumps and well/water \nresource to be used and its location is \ndetermined \n2.1.7 Other farm facilities are planned and laid-\nout \n2.2 Tanks \n2.2.1 Area and depth of Tank should conform \nwith available site selected and species \nto be cultured \n2.2.2 The number and size of compartments is \ndetermined based on the area of the land \n2.2.3 The materials to be used are determined \nbased on production target and \ncapitalization \n2.2.4  Markers,/strings are placed as guide to \nthe layout \n2.2.5 Determine number of water pumps and \nwell/water resource to be used and \nlocation  \n2.2.6 Other farm facilities are planned and \nlaid-out \n2.3 Pens  \n2.3.1 \nArea and depth of facilities should \nconform with available site selected \n2.3.2 \n Materials for frame and type of net to \nbe used are determined based on the \nsite selected and species to be cultured \n2.3.3 \nMaterials are source for availability in \nthe area and cost is determined \n2.3.4 \n Other farm facilities are planned and \nlaid-out \n \n2.4 Cages \n2.4.1 \n Area and depth of facilities should \nconform with project requirement and \nspecies to be cultured\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 31\n2.4.2 \n Materials for frame and type to be used \nare determined based on the site \nselected  \n2.4.3 \nMesh size of net is determined based \non available fingerling size in the area \nand species of fish \n2.4.4 \nMaterials are source for availability in \nthe area and cost is determined \n2.4.5\nOther farm facilities are laid-out \n3. \nMobile resources and \ncarry-out installation of \nfacilities \n3.1 Ponds \n3.1.1 Construction resources (materials and \nmanpower) for ponds are prepared \n3.1.2  Major and other support farm facilities \nare installed  \n3.1.3 Equipment is positioned according to \nenterprise requirement \n3.2 Tanks \n3.2.1 Construction resources  (materials and \nmanpower) are prepared adequately \n3.2.2 Lay-out of facilities are installed \n3.2.3 Life support system is appropriately \ninstalled \n3.2.4 Equipment is appropriately positioned  \n3.3 Pens \n3.3.1 Construction resources are prepared \nincluding materials and manpower \n3.3.2 Posts are positioned appropriately \n3.3.3  Netting materials and attach floats and \nsinkers are fabricated \n3.3.4 Net are inspected for any damage \n3.3.5 Set-up Net are st up to fit the frame \n3.3.6 Bottom of net is placed in proper place \n3.4 Cages \n3.4.1 Construction resources including \nmaterials and manpower are prepared \n3.4.2 Posts are positioned according to \nenterprise requirements \n3.4.3 netting materials are fabricated and \nattached to floats and sinkers \n3.4.4 Net are inspected  for damage \n3.4.5  Net are set-up to fit the frame \n3.4.6 Bottom of net is checked if it is in proper \nplace \n3.4.7 Mooring system is checked accdg. to \nindustry requirements\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 32\n \nRANGE OF VARIABLE \nVARIABLE \nRANGE\n1. Soil type \n \n \n1.1 Clay \n1.2 Loam \n1.3 Sand \n2. Water resource \n2.1 Shallow well \n2.2 Irrigation \n2.3 Natural waters (Lake, lagoon, impoundments, river) \n3. Species \n \n3.1 Tilapia \n3.1 Milkfish \n3.2 Grouper \n3.3 Sea bass \n3.4 Catfish\n4. Life Support \n4.1 \nAeration line \n4.2 \nWater Line \n4.3 \nDrainage Line\n5. Pumps \n5.1 Electric \n5.2 Diesel \n5.3 Gasoline \n6. Topography \n6.1 Flat \n6.2 Sloping \n7.  Farm Facilities \n7.1 Guardhouse \n7.2 Staff house \n7.3 Feed warehouse\n8. Materials to be \nused \n8.1 Tanks \n8.1.1 \nCement \n8.1.2 \nFiberglass \n8.1.3 \nCanvass \n8.1.4 \nPlastic \n8.2 Pens/Cages Frames \n8.2.1 \nBamboo \n8.2.2 \nG.I. Pipe \n8.2.3 \nPVC Pipes  \n8.3 Net Mesh \n8.3.1 \nSize 22 \n8.3.2 \nSize 20 \n8.3.3 \nSize 17 \n8.3.4 \nSize 14 \n8.4 Pond \n8.4.1 \nCemented Dike \n8.4.2 \nPlastic Lined \n8.4.3 \nEarthen\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 33\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 Selected a site that is suitable and available using \nthe following skills: \n1.1.1. Environmental scanning and survey using \nInstrument to measure water current \nvelocity, volume assessment, water depth, \netc. \n1.1.2. Soil/water sampling for analysis using \ntesting Instruments. \n1.2 Selected site in conformity with ECC requirement \nand EMB-DENR regulations. \n1.3 Effectively supervised, mobilized and utilized to \nthe fullest the available construction resources: \n1.3.1 Scheduled and implemented work program \nactivities and attained targeted budget and \ntime frame \n1.3.2 Mobilized construction equipment and \nmanpower requirement as per schedule \n1.3.3 Canvassed construction materials and \nequipment and prioritized acquisition based \non budget limitations \n1.3.4 Supervised construction work in strict \nconformity with the project design and \nlayout.\n2. Underpinning \nKnowledge and \nAttitudes \n2.1 Safety Practices \n2.1.1 Good work supervision during the \nconstruction of aqua arm facilities ensuring \nthat specifications are strictly followed and \nimplemented \n2.1.2 Where to source good quality supplies, \nmaterials and skilled laborers needed for the \naqua facilities \n2.1.3 Ideal good technical work habits to \ndemonstrate to workers easy and safety \nstandards during construction of the aqua \nfarm projects \n2.1.4 Program of work activities are implemented \nas scheduled \n2.2 Communication \n2.2.1 Prepare and submit regular accomplishment \nreports on all aqua facilities construction \nactivities \n2.3 Mathematics and Mensuration \n2.3.1 Ability to calculate and measure volume, weight \nand distances. Ratio and proportion calculation \n2.4 Drawings reading \n2.4.1 Ability to read and interpret layout plan of an \naquaculture facility\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 34\n \n2.5 \nCodes and regulations \n2.5.1 Environmental Compliance Certificate (ECC) \n2.5.2 Municipal Permit and regulations \n2.5.3 Rules and regulations of mangrove \nexploitation \n \n2.6 \nMaterials: Uses and Specifications \n2.6.1 Where to source good quality supplies, \nmaterials and equipment needed in the \nconstruction of the aqua farm project \n \n2.7 \nSystems, Processes and Operations \n2.7.1 Program of work activities are implemented \nas scheduled \n \n2.8 \nValues \n2.8.1 Positive attitude towards work \n2.8.2 Possesses pre-emptive/anticipatory skills \n3. Underpinning Skills \n3.1 Sampled soil using Eckman Dredge and analyzed \nsoil type \n3.2 Assessed water for suitability based on the \nStandard Methods in the Analysis of water and \nwastewater \n3.3 Assessed water volume adequacy using current \nflow or volumetric method \n3.4 Established ground elevation using a transit \n4. Method of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation of applicant to task and questions \nrelated to underpinning knowledge \n4.2 Third Party report\n5. Resource Implications 5.1 All required supplies, materials and equipment \nneeded during design, construction and operations \nof aquaculture facilities should be readily available \nat the farm site \n5.2 All workers involved in the aqua farm project must be \nfully oriented and cautioned on the different specific \nwork activities of the project \n5.3 Technical supervisors should have skills and ability in \nthe successful implementation of the work program \n6. Context of \nAssessment \n6.1   Direct observation and questioning \n6.2   Third party report\n",
