        "source_title": "PERFORM FISH OR SHRIMP GROW-OUT OPERATIONS",
        "source_text": "--- PDF PAGE 41 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 39\nUNIT OF COMPETENCY : \nPERFORM FISH OR SHRIMP GROW-OUT \nOPERATIONS \n \nUNIT CODE  \n \n: \nAGR641304 \n \nUNIT DESCRIPTOR          :   \nThis unit covers the knowledge and skills required \nto perform fish or crustacean grow-out operations like the preparation of grow-out \nfacilities, stocking, undertake grow-out farming protocols and harvesting. \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare grow-out \nfacilities \n1.1 Ponds \n1.1.1 \nPond is dried \n1.1.2 \nEliminated predators by applying predator \ncontrol \n1.1.3 \nLime is applied to elevate soil pH \n1.1.4 \nFertilizer is applied \n1.2 Pens and Cages \n1.2.1 \nFrames are installed or set-up \n1.2.2 \nNet Mesh are determined and fabricated into \ncages and installed to the cage frame \n1.3 Tanks \n1.3.1\nTanks are cleaned, dried and disinfected\n2. Stocking of \nfingerlings \n2.1 Fish/crustacean fingerlings are acclimatized for pH, \ntemperature and salinity \n2.2 Fingerling quality is assessed \n2.3 Fingerlings are released as schedule or at appropriate \ntime of the day \n2.4 Maintained growth of natural food\n3. Stock sampling \nProcedures in stock sampling \n3.1 Stock samples are weighed for ABW determination and \ncounting for survival estimates \n3.2 Stock sampling are undertaken regularly \n4. Perform feeding \noperations \n4.1 Feeds are selected based on quality \n4.2 Feeds are sampled and analyzed periodically \n4.3 Daily feed ration is computed and feed given are \nrecorded\n5. Maintain good \nwater quality \n5.1 Water quality is monitored using appropriate \nmeasuring instruments according to the Standard \nMethods In The Analysis Of Water And Wastewater \n5.2 Optimum water quality is maintained by water exchange \nand bio-manipulation \n5.3 Amount of water changed was based on water quality\n6. Perform common \ndisease diagnosis \nand treatment \n6.1 Disease is observed and monitored through physical \nappearance and behavioral patterns \n6.2 Infected fish is sampled and diagnosed \n6.3 Treatment is identified and implemented \n6.4 Prevention/safeguard against occurrences of viral, \nbacterial, fungal and parasitic diseases \n7. Harvest stocks & \nPost harvest \nhandling \n7.1 Pond and cages are seined \n7.2 Cages are lifted  \n7.3 Harvested fishes are packed and transported\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 40\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE\n1. Limed \n \n1.1 Agri-Lime  \n1.2 \nHydrated Lime \n \n2. Fertilized \n2.1 Chicken Manure \n2.2 Urea \n2.3 Ammonium phosphate \n2.4 Combinations\n3. Appropriate \nMeasuring \ninstruments \n3.1 DO Meter \n3.2 Thermometer \n3.3 PH meter \n3.4 Secchi Disc \n3.5 Ammonia and Nitrate test Kits\n4. Predator Control \n4.1 Derris Roots (Tubli) \n4.2 Tea Seed Cake \n4.3 Tobacco Dust \n4.4 Ammonium Sulfate. \n5. Disease \n5.1 Nutritional \n5.2 Bacterial \n5.3 Fungal \n5.4 Parasitic \n5.5 Viral \n5.6 Environmental\n6. Physical \nappearance and \nbehavioral \npatterns \n6.1 \nSwirling \n6.2 \nSwimming at surface \n6.3 \nNon-feeding \n6.4 \nLethargic \n6.5 \nCottony growth \n6.6 \nLesions \n6.7 \nSepticemia \n6.8 \nOver production of mucous\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 41\n \nEVIDENCE GUIDE\n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 Prepared grow-out facilities \n1.2 Stocked fingerlings \n1.3 Sampled the stocks \n1.4 Performed feeding operations \n1.5 Maintained good water quality \n1.6 Performed common disease diagnosis and treatment \n1.7 Harvested the stocks\n2. Underpinning \nKnowledge and \nSkills  \n \n2.1 Safety Practices \n2.2.1 Good work supervision during the construction \nof aqua farm facilities ensuring that \nspecifications are strictly followed and \nimplemented \n2.2.2 Ideal good technical work habits to demonstrate \nto workers easy and safety standards during \nconstruction and operation of aqua farm \nprojects \n \n2.2 Communication \n2.2.1 Prepare and submit regular accomplishment \nreports on all aqua farm activities \n \n2.3 Mathematics and Mensuration \n2.3.1 Calculation to determine Average Body Weight \n(ABW) of fish, daily feeding ration and Feed \nConversion ratio (FCR) \n2.3.2 Calculation in fertilizer and lime application for a \ngiven unit area \n2.3.3 Calculation for disease treatment and pest \ncontrol \n2.4 \nDrawings reading \n2.4.1 Knowledgeable in reading and interpreting, \ndesign lay-out and systems of grow-out ponds \n \n2.5 Codes and Regulations \n2.5.1 Comply with fisheries and Environmental Laws, \nRules and Regulations \n \n2.6 Tools & Equipment: Uses and Specifications \n2.6.1 Knowledgeable in calibrating & using common \naquaculture equipment \n2.6.2 Can understand and follow instructional \nmanuals \n2.6.3 Safe keeping of equipments every after use \n \n2.7 \nMaterials: Uses and Specifications \n2.7.1 Where to source good quality supplies, \nmaterials and equipment needed in the \nconstruction of the aqua farm project\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 42\n2.8 Systems, Processes and Operations \n2.8.1 Program of work activities are implemented as \nscheduled \n \n2.9 Maintenance \n2.10.1 Regular upkeep of equipments and facilities \n2.9.2 Preventive maintenance skills \n \n2.10 \nValues \n2.10.1 Positive outlook towards work \n2.10.2 Possesses pre-emptive/anticipatory skills \n3. Underpinning \nSkills \n3.1 Prepared facilities properly \n3.2 Performed correct fish stocking procedures \n3.3 Maintained growth of natural food \n3.4 Performed fish sampling fish weekly \n3.5 Computed ration  \n3.6 Monitored water quality parameters \n3.7 Common diseases were diagnosed and treated \n3.8 Used and maintained aquaculture tools and \nequipment\n4. Method of \nAssessment \nCompetency in this unit will be assessed through: \n4.1 Direct observation and questions  \n4.2 Third party report \n5. Resource \nImplications \n5.1 All supplies, materials and equipment needed during \ndesign, construction and operations of aquaculture \nfarms should be readily available at the farm site \n5.2 All workers involved in the aqua farm project must be \nfully oriented and cautioned on the different specific \nwork activities of the project \n5.3 Technical supervisors should have skills and ability in \nthe successful implementation of work program \nactivities\n6. Context of \nAssessment \n6.1 Competency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2 Assessment shall be done while tasks are undertaken \neither individually or as part of a team under limited \nsupervision \n6.3 Third party report\n",
