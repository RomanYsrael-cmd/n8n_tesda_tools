          "source_text": "1. Prepare nursery ponds \n1.1   Dry pond until cracking stage \n1.2   Repaired & plowed the soil and dried again \n1.3   Selected lime to be used and computed for amount  \nbased on soil pH \n1.4   Predator control is selected, amount computed and \napplied \n1.5 Selected fertilizer and computed amount of \napplication  \n1.6 Natural food is allowed to bloom \n1.7 Aerators/agitators are set-up\n2. Stock fish in nursery pond  2.1 Water quality parameters i.e. D.O., Transparency, \nNitrates, Ammonia and Temperature are determined \nprior to stocking of fry \n2.2 Determined amount of fry to be stocked \n2.3 Assessed fry quality \n2.4 Care was observed in handling, transporting and \nstocking of fishes \n3. Perform feeding \noperations \n3.1 Feeds are sourced, processed and stored properly \n3.2 Formulated feed is sampled and analyzed for feed \nration  \n3.3Daily feed ration is computed\n4. Monitor good water quality 4.1 Water quality is maintained \n4.2 Water is changed regularly \n4.3 Sustained the growth of natural food \n5. Perform common disease \nmonitoring and implement \ntreatment \n \n5.1 Disease is periodically observed and monitored \n5.2  Prevention and safeguard of disease and parasite \noccurrence \n5.3 Diseased or moribund fish is sampled and brought \nto the laboratory for diagnosis based on symptoms \n5.4 Appropriate treatment is determined  \n6. Harvest and post harvest \nhandling \n6.1 Timely scheduled harvest  \n6.2 Prepare supplies and materials required in the \nharvest operation \n6.3 Observe proper capture and handling procedure \nduring harvest so as to maintain good quality fish \nfingerlings \n6.4 Initiated proper conditioning, grading, counting, \npacking and live fish handling/transport\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 36\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE\n1. \nLimed \n1.1 Agricultural lime  \n1.2 Hydrated lime \n1.3 Industrial lime\n2.     Fertilized \n2.1 Chicken Manure \n2.2 Urea \n2.3 Ammonium phosphate \n2.4 Combinations\n3. \nPredator Control \n3.1 Derris Roots (Tubli),  \n3.2 Tea Seed Cake,  \n3.3 Tobacco Dust,  \n3.4 Ammonium Sulfate. \n4. \nAerators/agitators \n4.1 Ring/vortex blowers \n4.2 Roots blower \n4.3 Paddlewheel aerator \n4.4 Airo2\n5. \nDisease \n5.1 Nutritional \n5.2 Bacterial \n5.3 Fungal \n5.4 Parasitic \n5.5 Viral \n5.6 Environmental\n6. \nSymptoms \n6.1 Swirling \n6.2 Swimming at surface \n6.3 Non-feeding \n6.4 Lethargic \n6.5 Cottony growth \n6.6 Lesions \n6.7 Septicemia \n6.8 Over production of mucous\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 37"
