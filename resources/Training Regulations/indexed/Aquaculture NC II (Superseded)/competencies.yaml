        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 Prepared grow-out facilities \n1.2 Stocked fingerlings \n1.3 Sampled the stocks \n1.4 Performed feeding operations \n1.5 Maintained good water quality \n1.6 Performed common disease diagnosis and treatment \n1.7 Harvested the stocks\n2. Underpinning \nKnowledge and \nSkills  \n \n2.1 Safety Practices \n2.2.1 Good work supervision during the construction \nof aqua farm facilities ensuring that \nspecifications are strictly followed and \nimplemented \n2.2.2 Ideal good technical work habits to demonstrate \nto workers easy and safety standards during \nconstruction and operation of aqua farm \nprojects \n \n2.2 Communication \n2.2.1 Prepare and submit regular accomplishment \nreports on all aqua farm activities \n \n2.3 Mathematics and Mensuration \n2.3.1 Calculation to determine Average Body Weight \n(ABW) of fish, daily feeding ration and Feed \nConversion ratio (FCR) \n2.3.2 Calculation in fertilizer and lime application for a \ngiven unit area \n2.3.3 Calculation for disease treatment and pest \ncontrol \n2.4 \nDrawings reading \n2.4.1 Knowledgeable in reading and interpreting, \ndesign lay-out and systems of grow-out ponds \n \n2.5 Codes and Regulations \n2.5.1 Comply with fisheries and Environmental Laws, \nRules and Regulations \n \n2.6 Tools & Equipment: Uses and Specifications \n2.6.1 Knowledgeable in calibrating & using common \naquaculture equipment \n2.6.2 Can understand and follow instructional \nmanuals \n2.6.3 Safe keeping of equipments every after use \n \n2.7 \nMaterials: Uses and Specifications \n2.7.1 Where to source good quality supplies, \nmaterials and equipment needed in the \nconstruction of the aqua farm project\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 42\n2.8 Systems, Processes and Operations \n2.8.1 Program of work activities are implemented as \nscheduled \n \n2.9 Maintenance \n2.10.1 Regular upkeep of equipments and facilities \n2.9.2 Preventive maintenance skills \n \n2.10 \nValues \n2.10.1 Positive outlook towards work \n2.10.2 Possesses pre-emptive/anticipatory skills \n3. Underpinning \nSkills \n3.1 Prepared facilities properly \n3.2 Performed correct fish stocking procedures \n3.3 Maintained growth of natural food \n3.4 Performed fish sampling fish weekly \n3.5 Computed ration  \n3.6 Monitored water quality parameters \n3.7 Common diseases were diagnosed and treated \n3.8 Used and maintained aquaculture tools and \nequipment\n4. Method of \nAssessment \nCompetency in this unit will be assessed through: \n4.1 Direct observation and questions  \n4.2 Third party report \n5. Resource \nImplications \n5.1 All supplies, materials and equipment needed during \ndesign, construction and operations of aquaculture \nfarms should be readily available at the farm site \n5.2 All workers involved in the aqua farm project must be \nfully oriented and cautioned on the different specific \nwork activities of the project \n5.3 Technical supervisors should have skills and ability in \nthe successful implementation of work program \nactivities\n6. Context of \nAssessment \n6.1 Competency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2 Assessment shall be done while tasks are undertaken \neither individually or as part of a team under limited \nsupervision \n6.3 Third party report",
