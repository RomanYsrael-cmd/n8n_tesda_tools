        "source_title": "OPERATE FISH NURSERY",
        "source_text": "--- PDF PAGE 37 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 35\nUNIT OF COMPETENCY : \nOPERATE FISH NURSERY \n \nUNIT CODE  \n \n: \nAGR641303 \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge and skills required \nto prepare and operate fish nursery in ponds. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare nursery ponds \n1.1   Dry pond until cracking stage \n1.2   Repaired & plowed the soil and dried again \n1.3   Selected lime to be used and computed for amount  \nbased on soil pH \n1.4   Predator control is selected, amount computed and \napplied \n1.5 Selected fertilizer and computed amount of \napplication  \n1.6 Natural food is allowed to bloom \n1.7 Aerators/agitators are set-up\n2. Stock fish in nursery pond  2.1 Water quality parameters i.e. D.O., Transparency, \nNitrates, Ammonia and Temperature are determined \nprior to stocking of fry \n2.2 Determined amount of fry to be stocked \n2.3 Assessed fry quality \n2.4 Care was observed in handling, transporting and \nstocking of fishes \n3. Perform feeding \noperations \n3.1 Feeds are sourced, processed and stored properly \n3.2 Formulated feed is sampled and analyzed for feed \nration  \n3.3Daily feed ration is computed\n4. Monitor good water quality 4.1 Water quality is maintained \n4.2 Water is changed regularly \n4.3 Sustained the growth of natural food \n5. Perform common disease \nmonitoring and implement \ntreatment \n \n5.1 Disease is periodically observed and monitored \n5.2  Prevention and safeguard of disease and parasite \noccurrence \n5.3 Diseased or moribund fish is sampled and brought \nto the laboratory for diagnosis based on symptoms \n5.4 Appropriate treatment is determined  \n6. Harvest and post harvest \nhandling \n6.1 Timely scheduled harvest  \n6.2 Prepare supplies and materials required in the \nharvest operation \n6.3 Observe proper capture and handling procedure \nduring harvest so as to maintain good quality fish \nfingerlings \n6.4 Initiated proper conditioning, grading, counting, \npacking and live fish handling/transport\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 36\n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE\n1. \nLimed \n1.1 Agricultural lime  \n1.2 Hydrated lime \n1.3 Industrial lime\n2.     Fertilized \n2.1 Chicken Manure \n2.2 Urea \n2.3 Ammonium phosphate \n2.4 Combinations\n3. \nPredator Control \n3.1 Derris Roots (Tubli),  \n3.2 Tea Seed Cake,  \n3.3 Tobacco Dust,  \n3.4 Ammonium Sulfate. \n4. \nAerators/agitators \n4.1 Ring/vortex blowers \n4.2 Roots blower \n4.3 Paddlewheel aerator \n4.4 Airo2\n5. \nDisease \n5.1 Nutritional \n5.2 Bacterial \n5.3 Fungal \n5.4 Parasitic \n5.5 Viral \n5.6 Environmental\n6. \nSymptoms \n6.1 Swirling \n6.2 Swimming at surface \n6.3 Non-feeding \n6.4 Lethargic \n6.5 Cottony growth \n6.6 Lesions \n6.7 Septicemia \n6.8 Over production of mucous\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 37\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency  \n \n1.1 Prepared nursery ponds \n1.2 Performed nursery operations \n1.3 Performed feeding operations \n1.4 Maintained good water quality \n1.5 Performed common disease monitoring and implement \ntreatment \n1.6 Practiced techniques in harvest and post harvest \nhandling\n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Safety Practices \n2.1.1 Good work supervision during the construction of \naqua farm ensuring that specifications are strictly \nfollowed and implemented \n2.1.2 Ideal good technical work habits to demonstrate to \nworkers easy and safety standards during \nconstruction and operation of aqua farm projects \n \n2.2 \nCommunication \n2.2.1 Prepare and submit regular accomplishment \nreports on all aqua farm activities \n \n2.3 Mathematics and Mensuration \n2.3.1 Calculation to determine Average Body Weight \n(ABW) of fish, daily feeding ration and Feed \nConversion ratio (FCR) \n2.3.2 Calculation in fertilizer and lime application for a \ngiven unit area \n2.3.3 Calculation for disease treatment and pest control \n \n2.4 \nDrawings reading \n2.4.1 \nKnowledgeable in reading, design lay-out and \nsystems of a nursery ponds \n \n2.5 Codes and Regulations \n2.5.1 \nComply with fisheries and Environmental Laws, \nRules and Regulations \n \n2.6 Tools & Equipment: Uses and Specifications \n2.6.1 Knowledgeable in calibrating & using common \naquaculture equipment \n2.6.2 Can understand and follow instructional manuals \n2.6.3 Safe keeping of equipment every after use \n \n2.7 \nMaterials: Uses and Specifications \n2.7.1 Where to source good quality supplies, materials \nand equipment needed in the construction of the \naqua farm project\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________ \nTR-Aquaculture NC II     \n \nPromulgated  December 2004 38\n2.8 Systems, Processes and Operations \n2.8.1 Program of work activities are implemented as \nscheduled \n \n2.9 Maintenance \n2.9.1 Regular upkeep of equipment and facilities \n2.9.2 Preventive maintenance skills \n \n2.10 Values \n2.10.1 Positive outlook towards work \n2.10.2 Possesses pre-emptive/anticipatory skills \n3. Underpinning Skills \n3.1 Computed lime, fertilizer and predator control requirement \nfor pond application \n3.2 Performed correct fish sampling procedures \n3.3 Solved problems related to fish nursery operations \n3.4 Used and maintained aquaculture tools and equipment \n4. Method of Assessment \nCompetency in this unit must be assessed through: \n4.1 Direct observation and questioning \n4.2 Third party report \n5. Resource Implications \n5.1 All supplies, materials and equipment needed during \ndesign, construction and operations of aqua farms \nshould be readily available at the farm site \n5.2 All workers involved in the aqua farm project must be fully \noriented and cautioned on the different specific work \nactivities of the project \n5.3 Technical supervisors should have skills and ability in the \nsuccessful implementation of work program activities\n6. Context of Assessment 6.1 In the workplace or in a simulated workplace setting \n6.2 While tasks are undertaken either individually or as part of \na team under limited supervision \n6.3 Third party report\n",
