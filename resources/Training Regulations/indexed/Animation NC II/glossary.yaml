      "term": "Animation",
      "definition": "a simulation of movement created by displaying a series of pictures, or frames. Cartoons on television are one example of animation. Animation on computers is one of the chief ingredients of multimedia presentations. There are many software applications that enable you to create animations that you can display on a computer monitor."
    },
    {
