      "definition": "supplemental key drawing guide to ensure proper action flow and spacing between two animation keys."
    },
    {
      "term": "Clean-up",
      "definition": "refers to the process of refining the rough artwork of 2D animation. The purpose of clean-up is to recreate the animation with smooth, consistent line art and line weights before it is transferred to cels for painting."
    },
    {
      "term": "Column or Layer",
      "definition": "Column is a vertical chart viewed on the exposure sheet. Layer is a horizontal chart viewed on the timeline."
