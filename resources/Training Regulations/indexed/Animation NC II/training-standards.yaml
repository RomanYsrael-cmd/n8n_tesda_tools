es\no Understanding organizational goals\n• Demonstrate Intra and Interpersonal skills at\nwork\n• Demonstrate personal commitment in work\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n3.2. Set and meet work\npriorities\n• Discuss company policies, operations,\nprocedures and standards\n• Read:\no Time Management\no Basic strategic planning concepts\no Resource utilization and management\no Apply managing goals and time\n• Practice:\no economic use of resources and facilities\no time management\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n4 hours\n\n--- PDF PAGE 72 ---\n_____________________________________________________________________________________ 68\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.3. Maintain\nprofessional growth\nand development\n• Discuss company recognition and incentives\n• Read:\no Career development opportunities\no Information on relevant licenses and or\ncertifications personal career development\nneeds\n• Identify career opportunities\n• Determine personal career development needs\n\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written\nexamination\n2 hours\n4. Practice\noccupational\nhealth and\nsafety\n4.1. Identify hazard and\nrisks\n• Discuss OHS procedures, practices and\nregulations\n• Read\no OHS indicators\no Organizational contingency practices\n• Practice hazards/risks identification and control\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written\nexamination\n2 hours\n4.2. Evaluate hazard\nand risks\n• Describe effects of safety hazards\no Read Threshold Limit Value –TLV\n• Practice reporting safety hazards\n• Demonstrate evaluating hazards and risks\nusing communication equipment\n• Group\ndiscussion\n• Lecture\n• Role play\n• Demonstration\n• 