sted\nimprovements or innovations may not be\nimplemented, including operational and\nmanagement constraints\n• Present/Suggest ideas/changes in consultation\nwith others for improvement\n• Group\ndiscussion\n• Lecture\n• Role play\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n4 hours\n6. Solve/address\ngeneral\nworkplace\nproblems\n6.1. Identify routine\nproblems\n• Lecture and discussion on:\no Possible routine problems or procedural\nproblem areas\no Current industry hardware and software\nproducts and services\no Malfunctions and resolutions\n• Group\ndiscussion\n• Lecture\n• Role play\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n6.2. Look for solutions\nto routine problems\n• Lecture and discussion on:\no Industry service and helpdesk practices,\nprocesses and procedures\no Operating systems\no Industry standard diagnostic tools\no Root cause analysis\n• Group\ndiscussion\n• Lecture\n• Role play\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 74 ---\n_____________________________________________________________________________________ 70\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Identification of potential solutions to problem\n6.3. Recommend\nsolutions to\nproblems\n• Lecture and discussion on:\no Standard/Established procedures\no Implementation of solutions\no Evaluation of implemented solutions\n• Produce documentation that recommends\nsolutions to identified problems\n\n• Group\ndiscussion\n• Lecture\n• Role play\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n4 hours\n7. Exercise\nsustainable\ndevelopment in\nthe workplace\n7.1. Identify current\nresource use\n• Lecture and discussion on:\no Types of resources\no Techniques in measuring current usage of\nresources\no Calcul