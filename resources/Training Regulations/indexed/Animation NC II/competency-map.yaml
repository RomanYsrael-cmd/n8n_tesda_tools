  "source_text": "Section 1. Successful candidates\nshall be awarded a National Certificate II level signed by the TESDA Director\nGeneral.\n\n4.2 The qualification of Animation NC II may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in all the following\nunits of competencies:\n\nCOC-1: Producing traditional cleaned-up key drawings\n• Apply traditional drawing techniques for animation\n• Produce traditional cleaned-up key drawings\n\nCOC-2: Producing traditional in-between drawings\n• Apply traditional drawing techniques for animation\n• Produce traditional in-between drawings\n\nCOC-3: Producing digital cleaned-up key drawings and in between\ndrawings\n• Produce digital cleaned-up key drawings\n• Produce digital in-between drawings\n\nSuccessful candidates shall be awarded a Certificate of Competency\n(COC) in each of the core units.\n4.2.2 Demonstration of competence through a single comprehensive project-\ntype assessment covering all required units of competency of this\nqualification.\n\n4.3 Upon accumulation and submission of all COCs acquired for all the relevant units\nof competency comprising this qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall cover all competencies, with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n--- PDF PAGE 88 ---\n_____________________________________________________________________________________ 84\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\n4.5 Any of the following are qualified to apply for assessment and certification:\n\na. Graduate of formal, non-formal, and informal, including enterprise-based,\ntraining programs.\n\nb. Experienced workers (wage employed or self-employed)\n\n4.6 Existing National Certificate (NC) of individuals in Animation NCII will still be in\neffect until such time that such NC will have expired. Individuals are advised to\ntake the assessment/s for this amended TR on or before the expiration of such\ncertificates.\n\n4.7 The guidelines on assessment and certification are discussed in detail in the\n\"Operating Procedures on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)\".\n\n4.1. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior to\nassessment.\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment activities of candidates for\nnational certification.\n\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited by\nTESDA is authorized to assess the competencies of candidates for national\ncertification.\n\n--- PDF PAGE 89 ---\n_____________________________________________________________________________________ 85\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\nANNEX A. ICT COMPETENCY MAP – ANIMATION NC II\n\nBASIC COMPETENCIES\n\nReceive and\nRespond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems Related\nto Work Activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem Solving\nTechniques in the\nWorkplace\nCollect, analyze and\norganize information\nPlan and Organize\nWork\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nApply Quality\nStandards\nPerform Computer\nOperations\n\nCORE COMPETENCIES\n\nCommunicate\neffectively in a customer\ncontact center\nRender quality\ncustomer service\nUtilize enterprise/\ncompany technology\nConduct contact\ncenter campaign\nProvide specialized\nsupport and assistance\nto customers\nLead a contact center\nwork team\nManage the activities\nof a contact center\nwork team\nUse business\ntechnology\nUse medical\ntechnology to carry\nout task\nProduce text from audio\ntranscription\nReview/edit documents\nLead a team in\ndelivering quality\nservice\nApply traditional\ndrawing techniques\nfor animation\nProduce traditional\ncleaned-up\ndrawings\nProduce traditional in-\nbetween drawings\nProduce Traditional key\nposes/drawings for\nanimation\nCreate 2D digital\nanimation\nExport Animation into\nVideo file format\nProduce digital\ncleaned-up\ndrawings\nProduce digital in-\nbetween drawings\nProduce background\ndesigns\nComposite and edit\nanimation sequence\nCreate 3D digital\nanimation\nProduce storyboard\nfor animation\nCoordinate the\nproduction of animation\nProduce over-all\ndesigns for animation\nProduce key drawings\nfor animation\nCreate 3D models for\nanimation\nApply 3D texture and\nlighting to 3D models\nSet character rigging\nAnimate character\nComposite and render\nanimation sequence\nCreate 2D digital\nanimation\nProduce cleaned-up\nand in-between\ndrawings\nUse an authoring tool to\ncreate an interactive\nsequence\nProduce key drawings\nfor animation\nUtilize Software\nMethodologies\nDevelop Responsive\nWeb Design\nCreate Interactive\nWebsites (Using JavaScript)\nDevelop Website\nBackend Systems\nDevelop designs for a\nlogo\nDevelop designs for\nprint media\nDevelop designs for\nuser experience\nDevelop designs for\nuser interface\nDevelop designs for\nproduct packaging\nDesign booth and\nproduct/window display\n\n--- PDF PAGE 90 ---\n_____________________________________________________________________________________ 86\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgements on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person perform in the workplace\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when\nevidence should be collected\n\n--- PDF PAGE 91 ---\n_____________________________________________________________________________________ 87\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 92 ---\n_____________________________________________________________________________________ 88\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\nSECTOR SPECIFIC\n\n1. Action Poses - *see dynamic pose\n2. Animation – a simulation of movement created by displaying a series of pictures,\nor frames. Cartoons on television are one example of animation. Animation on\ncomputers is one of the chief ingredients of multimedia presentations. There are\nmany software applications that enable you to create animations that you can\ndisplay on a computer monitor.\n3. Animator’s Breakdown/Breakdown Drawing – supplemental key drawing guide\nto ensure proper action flow and spacing between two animation keys.\n4. Clean-up - refers to the process of refining the rough artwork of 2D animation. The\npurpose of clean-up is to recreate the animation with smooth, consistent line art\nand line weights before it is transferred to cels for painting.\n5. Column or Layer - Column is a vertical chart viewed on the exposure sheet. Layer\nis a horizontal chart viewed on the timeline.\n6. Construction – Roughing out the shape and volume of the character\n7. Data - objective measurements of the attributes (characteristics) of entities such as\npeople, places, things, and events.\n8. Digital rough breakdowns - a special digital drawing that is provided only by\nanimators or directors if needed in the scene.\n9. Dynamic Pose - a pose that appears to be moving, shows movement or action\n10. Documentation – a collection of documents or information.\n11. Edit – to modify the form or format of data\n12. End-user – anyone who uses an information system or the information it\nproduces.\n13. Ergonomics - the science and technology emphasizing the safety, comfort, and\nease of use of human-operated machines. The goal of ergonomics is to produce\nsystems that are user-friendly: safe, comfortable and easy to use.\n14. Exposure Sheet – This is the technical part of animation which requires all the\naction and other details plotted down, also, a numerical and alphabetical order of\ndrawing labels written down following the sequence of action.\n15. File folders, also called directories, - a way to organize computer files.\n16. In-between drawing - The drawing produced between two key drawings. The\nmiddle drawing between two timing grid lines\n17. Information – data placed in a meaningful and useful context for an end user.\n18. Information and Communication Technology (ICT) - refers to technologies\nassociated with the transmission and exchange of data in the form of sound, text,\nvisual images, signals or any combination of those forms through the use of digital\ntechnology. It encompasses such services as telecommunications, posts,\nmultimedia, electronic commerce, broadcasting, and information technology.\n19. Key frame - is a single still image in an animated sequence that occurs at an\nimportant point in that sequence; key frames are defined throughout an animated\n\n--- PDF PAGE 93 ---\n_____________________________________________________________________________________ 89\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\nsequence, in order to define pivotal points of motion before the frames in between\nare drawn or otherwise created to \"tween\" the motion between the two key frames.\n20. Line drawing - a drawing done using only narrow lines, a variation of which, in\nwidth and density, produce such effects as tone and shading.\n21. Lipsync – (short for “lip synchronization”) in animation, lipsync is the art of making\nan animated character appear to speak in a prerecorded track of dialogue. *see\nalso Phonetic Mouth Chart\n22. Local Area Network (LAN) – a communications network that typically connects\ncomputers, terminals, and other computerized devices within a limited physical\narea such as an office, building, manufacturing plant and other work sites.\n23. Model Sheet – refers to the model character in different rotating angles. Also,\nrefers to the set of expressions, action poses, mouth charts of a certain character.\nCan also be a model of a prop, object and backgrounds / sceneries\n24. Off – model - A drawing that does not conform the look of the character to the\nmodel sheet.\n25. Onion skin / Lightbox feature - A feature of the animation software that can show\nthe previous and next drawings respectively while working on the current in-\nbetween frame.\n26. On – model – a character drawn and constructed to the likeness and conforms to\nthe model sheet\n27. Outsourcing – turning over all or part of an organization’s information systems\noperation to outside contractors, known as systems integrators or facilities\nmanagement companies.\n28. Phonetic mouth chart – a chart showing different mouth openings that can…\n29. Quality Assurance – methods for ensuring that information systems are free from\nerrors and fraud and provide information products of high quality.\n30. Rough Breakdown - *see Animator’s Breakdown\n31. Rough expressions - A rough drawing that shows different expressions of a\nparticular character in its basic construction.\n32. Rough Key Poses - Rough initial drawings of Key drawings which are drawn in\nlousy sketches, contain the main construction of the character in the required\nposes of the scene to be followed by the clean-up and in-between artist.\n33. Simulation - the process of imitating a real phenomenon with a set of\nmathematical formulas. Advanced computer programs can simulate weather\nconditions, chemical reactions, atomic reactions, even biological processes.\n34. Software – computer programs and procedures concerned with the operation of\nan information system.\n35. Standards – measures of performance developed to evaluate the progress of a\nsystem toward its objectives\n36. System – an assembly of methods, procedures, or techniques unified by regulated\ninteraction to form an organized whole\n37. Timing grid – bar lines indicating action speed, this enables the animator to\ncontrol the speed, spacing and weight of a particular action.\n\n--- PDF PAGE 94 ---\n_____________________________________________________________________________________ 90\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\n38. Timing grid lines - these are horizontal or vertical lines with varying length sizes\ndividing a single straight line into specific spaces.\n39. Traditional Cleaned-up Key Drawings - Key drawings that are already on-\nmodeled and cleaned-up and drawn with similarity to the model sheet.\n40. Turn Around - *see Model Sheet\n41. Tween - is actually short for \"in-between\", and refers to the creation of successive\nframes of animation between key frames. In computer animation, the term is most\ncommonly used for Flash's \"shape tweening\" and \"motion tweening\" processes,\nwhere the user can define two key frames and Flash will automatically create the\nin-between frames, either morphing one shape into another over a set period of\ntime or else moving a shape or shapes from point A to point B over a set period of\ntime. 3D animation programs also have their own method of \"tweening\".\n42. User- friendly – a characteristic of human-operated equipment and systems that\nmakes them safe, comfortable, and easy to use.\n\n--- PDF PAGE 95 ---\n_____________________________________________________________________________________ 91\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Animation NC II\nQualification Code: ICTANM218\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nAnimation NC III\n\nNot Applicable\nTB No. 2005-19/\nNovember 10, 2005\nNot Applicable\n01\nDocument Amended –\nAnimation NC II\n\nTB No. 2005-19/\nNovember 10, 2005\nTB No. 2007-22/\nJuly 27, 2007\nNot Applicable\n02\nDocument Amended –\nAnimation NC II\n\nTB No. 2007-22/\nJuly 27, 2007\nTB No. 2018-04/\nFebruary 27, 2018\nTESDA Circular\nNo. __ s. 2018\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 96 ---\n_____________________________________________________________________________________ 92\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERT COMMITTEE – FY 2007\n\nMS. GRACE A. DIMARANAN\nAnimation Council of the Philippines, Inc.\n\nMS. JOY I. BACON\nAnimation Council of the Philippines, Inc.\n\n• THE ANIMATION COUNCIL OF THE PHILIPPINES, INC. (ACPI)\n\n• THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS\nDEVELOPMENT COMMITTEE\n\n• THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING\nREGULATION\n\n• Animation Council of the Philippines, Inc.\n\n• THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT\n\no Qualifications and Standards Office (QSO)\n\n--- PDF PAGE 97 ---\n_____________________________________________________________________________________ 93\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\nFOR THE REVISION / AMENDMENT STAGE\n\n• THE TECHNICAL EXPERTS PANEL (TEP) – FY 2016-2017\n\nMS. MARIE GRACE A. DIMARANAN\nVice President, Animation Council of the Philippines, Inc. (ACPI)\nCEO, Top Peg Animation & Creative Studio\n\nMR. ACERON RAMIREZ\nAsst. Animator Trainer; Traditional & Digital assistant Animator\nCentral Luzon School of Digital Arts\n\nMS. CYNTHIA Z. JAVIER\n2D & 3D Animation Trainer; Traditional & Digital Animator\nHuman Resource Development Institute\n\nMR. PATRICK “ANGIE” PALANCA\n2D Animation Trainer; 2D Traditional & Digital Animator\n(Freelancer)\n\n• THE ANIMATION COUNCIL OF THE PHILIPPINES, INC. (ACPI)\n\n• THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS\nDEVELOPMENT COMMITTEE\n\n• THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING\nREGULATION\n\n• RENE B. MISA\n\n- Central Luzon School of Digital Arts\n• OSCAR A. ADVENTO\n- Central Luzon School of Digital Arts\n• LINA A. VALDEZ\n\n- Guhit Pinoy Animation, Inc.\n• DARREN MARVIN B. SANCHEZ - Guhit Pinoy Animation, Inc.\n• RONILO H. DAYAO\n\n- College of St. Benilde / KorPhil IT Center\n• ALDWIN M. AYAO\n\n- ToonCity Animation\n• JOHN MASANGCAY\n\n- Top Peg Animation\n• WILLIE BLUE B. BUSSELL\n- Top Peg Animation / Genesis\n• FEDERICO R. NIVERBA JR. - Snipple Animation\n• ROSARIO G. MONOY\n- Immersive Animation, Inc.\n• ACERON M. RAMIREZ\n- Central Luzon School of Digital Arts\n\n• THE MANAGEMENT AND STAFF OF TESDA SECRETARIAT\n\n• Qualifications and Standards Office (QSO)\nDIR. IMELDA B. 