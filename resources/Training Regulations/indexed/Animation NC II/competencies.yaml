        "source_text": "--- PDF PAGE 26 ---\n_____________________________________________________________________________________          22 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nUNIT OF COMPETENCY  :   EXERCISE SUSTAINABLE DEVELOPMENT IN THE \nWORKPLACE \nUNIT CODE              \n:   500311134 \nUNIT DESCRIPTOR          :   This unit covers knowledge, skills and attitude to identify \ncurrent resource use, comply with environmental \nregulations and seek opportunities to improve resource \nefficiency. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify current \nresource use \n1.1. Resources used in the \nworkplace and potential for \nenvironmental \nimprovements are listed \nfollowing industry \nprocedures. \n1.2. Current usage of resources \nused in the workplace is \nmeasured using appropriate \ntechniques. \n1.3. Data are recorded and \nstored following workplace \nprotocol. \n1.4. All workplace resource \nefficiency issues are \nconveyed to work \nteam and supervisor \n1.1. Types of \nresources \n1.2. Techniques in \nmeasuring current \nusage of \nresources \n1.3. Calculating current \nusage of \nresources \n1.4. Data recording \nand storage \n1.5. Workplace \nresource efficiency \nissues \n1.1. Listing of \nresources used \n1.2. Measuring current \nusage of resources\n1.3. Recording and \nstoring of data \n1.4. Conveying \nworkplace \nresource efficiency \nissues \n2. Comply with \nenvironmental \nregulations \n2.1 Workplace environmental \nhazards are identified and \nreported to appropriate \nsupervisor. \n2.2 All workplace  \nenvironmental efficiency \nissues are conveyed to \nwork team and supervisor. \n2.3 Environmental regulations \nare followed based on \nindustry protocol. \n2.4 Work toward meeting \nefficiency targets are \npracticed following \nenvironmental regulations \n \n \n2.1 Types of \nworkplace \nenvironmental \nhazards \n2.2 Workplace \nenvironmental \nefficiency issues \n2.3 Environmental \nregulations \n2.4 Methods of \nmeeting efficiency \ntargets \n2.1 Identifying and \nreporting \nworkplace \nenvironmental \nhazards \n2.2 Conveying all \nenvironmental \nissues. \n2.3 Following \nenvironmental \nregulations. \n2.4 Practicing meeting \nefficiency targets \nin complying \nenvironmental \nregulations\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________________          23 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Seek \nopportunities to \nimprove \nresource \nefficiency \n3.1 Enterprise plans to \nimprove environmental \npractices and resource \nefficiency are followed \nbased on industry \nprocedures \n3.2 Suggestions for \nimprovements to workplace\npractices and resource \nefficiency are made \naccording to industry \nprotocol \n3.3 Clarifications relating to \nwork requirements, \nefficiency and impact of \nsustainable practices are \nsought from team members \nand/or supervisors. \n3.1 Enterprise plans \n3.2 Improvement of \nenvironmental \npractices and \nresource \nefficiency \n3.3 Impact of \nsustainable \npractices on work \nrequirements and \nefficiency \n3.4 Preparation of \nenvironmental \nplan \n3.5 Sustainable \npractices \n3.1 Following \nenterprise plans to \nimprove \nenvironmental \npractices and \nresource efficiency\n3.2 Making \nsuggestions for \nimprovements to \nworkplace \npractices and \nresource efficiency\n3.3 Seeking \nclarifications \nrelating to work \nrequirements and \nefficiency and \nimpact of \nsustainable \npractices\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________________          24 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \n \nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1.\nResources\nMay include:\n1.1 Electric \n1.2 Water \n1.3 Fuel \n1.4 Telecommunications \n1.5 Supplies \n1.6 Materials \n2.\nWorkplace environmental \nhazards \nMay include:\n2.1 Biological hazards \n2.2 Chemical and dust hazards \n2.3 Physical hazards \n \n \nEVIDENCE GUIDE \n1. Critical aspects of\nCompetency \nAssessment requires evidence that the candidate:\n1.1. Identified current resource use \n1.2. Complied with environmental regulations \n1.3. Sought opportunities to improve resource \nefficiency \n2. Resource\nImplications \nThe following resources should be provided:\n2.1. Workplace \n2.2. Tools, materials and equipment relevant to the \ntasks \n2.3. PPE \n2.4. Manuals and references \n3. Methods of\nAssessment \nCompetency in this unit may be assessed through:\n3.1. Demonstration \n3.2. Oral questioning \n3.3. Written examination \n4. Context for\nAssessment \n4.1.\nCompetency assessment may occur in workplace \nor any appropriately simulated environment \n4.2. Assessment shall be observed while task are \nbeing undertaken whether individually or in-group\n",
