        "source_text": "500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1. The role and objective of\nthe team is identified from\navailable sources of\ninformation\n1.2. Team parameters, reporting\nrelationships and\nresponsibilities are identified\nfrom team discussions and\nappropriate external\nsources\n1.1. Company vision/\nmission statements\n1.2. Company policies and\nemployee code of\nconduct\n1.3. Communication process\n1.4. Team structure\n1.5. Team roles\n1.6. Group planning and\ndecision making\n1.1. Communicating\nskills\nappropriately\nand consistent\nwith the culture\nof the workplace\n1.2. Adopting skills to\nteam role and\nscope of\nresponsibilities\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1. Individual role and\nresponsibilities within the\nteam environment are\nidentified\n2.2. Roles and responsibility of\nother team members are\nidentified and recognized\n2.3. Reporting relationships\nwithin team and external to\nteam are identified\n2.1. Company vision/\nmission statements\n2.2. Company policies and\nemployee code of\nconduct\n2.3. Communication process\n2.4. Team structure\n2.5. Team roles\n2.6. Group planning and\ndecision making\n2.7. Methods and techniques\nof role and responsibility\nidentification with a\nteam\n2.1. Communicating\nskills\nappropriately\nand consistent\nwith the culture\nof the workplace\n2.2. Role and\nresponsibility\nidentification\nskills\n\n3. Work as a\nteam\nmember\n3.1. Effective and appropriate\nforms of communications\nare used and interactions\nundertaken with team\nmembers who contribute to\nknown team activities and\nobjectives\n3.2. Effective and appropriate\ncontributions are made to\ncomplement team activities\nand objectives, based on\nindividual skills and\ncompetencies and\nworkplace context\n3.3. SOP/Protocols in reporting\nare observed\n3.4. Contribute to the\ndevelopment of team work\nplans based on an\nunderstanding of team’s\nrole and objectives and\nindividual competencies of\nthe members\n3.1. Approaches of\ninteracting with team\nmembers\n3.2. Types of\ncommunications used in\neffective interaction with\nteam members\n3.3. Methods of working as a\nteam\n3.4. Techniques in working\nas a team\n\n3.1. Team working\nskills\n3.2. Communicating\nskills\nappropriately\nand consistent\nwith the culture\nof the workplace\n3.3. Skills in\nobserving\nprotocols when\nmaking reports\n3.4. Using standard\nprocedures when\nmaking reports\n3.5. Developing\nteamwork plans\nbased on team’s\nrole and\nobjectives\n\n--- PDF PAGE 11 ---\n_____________________________________________________________________________________ 7\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1. Work activities in a team environment with enterprise\nor specific sector\n1.2. Limited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of\ninformation\n2.1. Standard operating and/or other workplace\nprocedures\n2.2. Job procedures\n2.3. Machine/equipment manufacturer’s specifications\nand instructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OSH and environmental standards\n3. Workplace context\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5. Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________________________ 8\nTR - ANIMATION NC II (Vers