        "source_title": "PRODUCE DIGITAL CLEANED-UP DRAWINGS",
        "source_text": "--- PDF PAGE 53 ---\n_____________________________________________________________________________________          49 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nUNIT TITLE                : \nPRODUCE DIGITAL CLEANED-UP DRAWINGS \nUNIT CODE                :     ICT216303 \nUNIT DESCRIPTOR  : \nThis unit covers the knowledge, skills and attitude required to \ndraw, analyze, and produce digital cleaned-up key drawings for \nanimation to ensure integrity of movement and character model is \nmaintained. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nrequirements \nfor digital \ncleaned-up \ndrawings \n1.1 Digital animation \nequipment & materials \nare identified and prepared \naccording to the task \nundertaken. \n1.2 Digital clean-up drawing \nrequirements are identified \nfrom the given source \nmaterial. \n1.3 Appropriate digital copies \nof model sheets are \ngathered for reference in \nthe given file folder. \n1.4 Range of industry standard \n2D animation software \nincluding computer-\nassisted techniques are \nidentified for suitability \n1.5 Software selected is in \naccordance with the \nspecified delivery \nplatform. \n1.6 Incomplete materials and \nfaulty equipment are \nreported to appropriate \npersonnel. \n1.1 Verbal \nCommunication \n1.2 Written \nCommunication \n1.3 Intellectual Property \nrights and concerns \n1.4 OHS processes and \nprocedure for \nComputer Hardware \n1.5 Computer hardware \nrequirements for \nvideo playback \n1.6 Digital animation \nequipment & \nmaterials \n1.7 Digital Clean-up \nDrawing \nrequirements \n1.8 Model sheets \n1.9 2D animation \nsoftware \n1.10 Cross platform / \ndelivery platform \n1.1 Effective \nCommunication \nskills \n1.2 Computer \noperation skills \n1.3 Drawing skills \n1.4 Reporting skills \n \n2. Produce \ndigital \ncleaned-up \nkey drawings \n2.1 User interface and basic \ntools of selected 2D \nanimation software is \nutilized based on the \nclient’s specific technical \nrequirements. \n2.2 Scanned hard copy or soft \ncopy of digital rough \nanimation key drawings \nare provided in file folder \nper scene number. \n2.3 Digital rough \nbreakdowns are checked \nif provided and indicated \non timeline or exposure \nsheet \n2.4 Digital model sheets and \nspecial file instructions \nare gathered and uploaded \nfor reference use on the \nspecified task undertaken. \n2.5 Digital rough key drawings \n2.1 Verbal \nCommunication \n2.2 Written \nCommunication \n2.3 OHS Standards and \n5S’s principles \n2.4 Intellectual Property \nRights and concerns \n2.5 Knowledge in \ncomputer operations \nand applications \n2.6 OHS processes and \nprocedures for \ncomputer hardware \n2.7 timeline or exposure \nsheet \n2.8 User interface and \ntools of 2D \nanimation software \n2.9 Rough animation \nkey drawings \n2.10 Digital rough \n2.1 Digital clean-up \ndrawing Skills  \n2.2 Analytical and \ncomprehension \nskills \n2.3 Skills in reading \nand analyzing \ntiming grids \nand exposure \nsheet \n2.4 Skills in \nanalyzing \nanimation \nbreakdowns \n2.5 Computer \noperating skills \n2.6 Effective \nCommunication \nskills \n2.7 Presentation \nskills \n2.8 Practicing\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________________          50 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n& breakdowns provided \nare played back to view \nand analyze the fluidity of \nanimation movements and \nconsistency in drawings  \n2.6 New column or layer is \nadded to the to the \ntimeline or exposure sheet \nin preparation for the layer \nof the digital cleaned-up \nkey drawings \n2.7 All off-model drawings \nare re-drawn based on \ndigital model sheets \nprovided and put on-\nmodel and placed also in \nits own layer \n2.8 Required digital line size \n& stroke is applied to all \ndigital cleaned-up key \ndrawings. \n2.9 Digital key drawing & \ndigital breakdown labels, \nproduction information, \ntiming grids are copied \ncarefully from the original \nrough key drawings and \nwritten clearly at an \nappropriate position on \nthe workspace \n2.10 All finished Digital drawing \nsequences are exported to \nvideo format and saved at \nscene file folder. \n2.11 Scene File folder \ncontents are double \nchecked and submitted to \nappropriate personnel  \nbreakdowns \n2.11 Digital model \nsheets \n2.12 special file \ninstructions \n2.13 layering of drawing \nelements \n2.14 digital line size & \nstroke \n2.15 Digital Key drawing \n& Digital \nBreakdown labels  \n2.16 production \ninformation  \n2.17 Timing grids \n2.18 Cross platform data \ntransfer \n2.19 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns \n2.20 Geometry for Basic \nShapes \n \nOSHS, EHSM, \n3Rs and 5S \n3. Edit / Revise \ndigital \ncleaned-up \nkey drawings \n3.1. Returned file folder with \nrevision calls are read \nand analyzed based on the \ninstructions written. \n3.2. All affected digital cleaned-\nup drawings & breakdowns \nare redrawn accordingly \nbased on the scope of the \nrevision calls \n3.3. All revised digital drawings \nare labeled appropriately \nto distinguish that it is the \nlatest revised version. \n3.4. Final Revised Digital \ncleaned-up drawings and \nbreakdowns are exported \nto video format to check \n3.1. Verbal \nCommunication \n3.2. Written \nCommunication \n3.3. OHS Standards and \n5S’s principles \n3.4. Intellectual Property \nRights and concerns \n3.5. Knowledge in \ncomputer operations \nand applications \n3.6. OHS processes and \nprocedures for \nComputer Hardware \n3.7. User interface and \ntools of 2D \