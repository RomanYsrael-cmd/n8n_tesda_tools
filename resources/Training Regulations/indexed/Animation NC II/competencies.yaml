        "source_text": "--- PDF PAGE 24 ---\n_____________________________________________________________________________________          20 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nUNIT OF COMPETENCY  :   SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS \nUNIT CODE              \n:   500311133 \nUNIT DESCRIPTOR          :   This unit of covers the knowledge, skills and attitudes \nrequired to apply problem-solving techniques to determine \nthe origin of a malfunction and plan for its resolution. \nELEMENTS \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify \nroutine \nproblems \n1.1. Identify routine problems \nor procedural problem \nareas. \n1.2. Define and determine \nproblem to be \ninvestigated. \n1.3. Identify and document \ncurrent conditions of the \nproblem. \n1.1. Current industry \nhardware and \nsoftware products \nand services \n1.2. Industry \nmaintenance, \nservice and \nhelpdesk practices, \nprocesses and \nprocedures \n1.3. Industry standard \ndiagnostic tools \n1.4. Malfunctions and \nresolutions \n1.1. Identifying current industry \nhardware and software \nproducts and services \n1.2. Identifying current industry \nmaintenance, services and \nhelpdesk practices, \nprocesses and procedures\n1.3. Identifying current industry \nstandard diagnostic tools  \n1.4. Describing common \nmalfunctions and \nresolutions.  \n1.5. Determining the root cause \nof a routine malfunction \n2. Look for \nsolutions to \nroutine \nproblems \n2.1. Identify potential \nsolutions to problem. \n2.2. Develop, document, rank \nand present \nrecommendations about \npossible solutions to \nappropriate person for \ndecision. \n2.1. Current industry \nhardware and \nsoftware products \nand services  \n2.2. Industry service and \nhelpdesk practices, \nprocesses and \nprocedures  \n2.3. Operating systems \n2.4. Industry standard \ndiagnostic tools  \n2.5. Malfunctions and \nresolutions. \n2.6. Root cause analysis\n2.1. Identifying current industry \nhardware and software \nproducts and services \n2.2. Identifying services and \nhelpdesk practices, \nprocesses and procedures.\n2.3. Identifying operating system\n2.4. Identifying current industry \nstandard diagnostic tools  \n2.5. Describing common \nmalfunctions and \nresolutions.  \n2.6. Determining the root cause \nof a routine malfunction \n3. Recommend \nsolutions to \nproblems \n3.1. Plan implementation of \nsolutions \n3.2. Plan evaluation of \nimplemented solutions \n3.3. Document \nrecommended solution \nand submit to \nappropriate person for \nconfirmation. \n3.1. Standard \nprocedures \n3.2. Documentation \nproduce \n3.1 Producing documentation \nthat recommends solutions \nto problems  \n3.2 Following established \nprocedures\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________________          21 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1. Appropriate person\nMay Include:  \n1.1. Supervisor or manager  \n1.2. Peers/work colleagues  \n1.3. Other members of the organization \n2. Plan \nMay include\n2.1. Priority requirements  \n2.2. Co-ordination and feedback requirements  \n2.3. Safety requirements  \n2.4. Risk assessment  \n2.5. Environmental requirements \n3. Document\nMay include :  \n3.1. Electronic mail  \n3.2. Briefing notes  \n3.3. Written report \n \nEVIDENCE GUIDE \n1. Critical aspects\nof Competency \nAssessment requires evidence that the candidate:\n1.1. Determine the root cause of a routine malfunction \n1.2. Identify solutions \n1.3. Produce documentation that recommends solutions to \nproblems  \n1.4. Follow established procedures  \n1.5. Refer unresolved problems to support persons. \n2. Resource\nImplications \n2.1.\nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a \nrange of situations \n3. Methods of\nAssessment \nCompetency in this unit may be assessed through:\n3.1. Written test \n3.2. Interview  \n \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk \nthrough of the relevant competency components \n4. Context for\nAssessment \n4.1.\nIn all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits\n",
