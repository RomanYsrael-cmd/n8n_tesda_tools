n1.3 Physical Science (all\nenvironments)\n1.4 Mechanical science\n1.5 Basic principles of\nanimation\n1.6 Traditional animation\nequipment &\nmaterials\n1.7 Traditional Clean up\nKey Drawing\nrequirements\n1.1 Drawing skills\nfor both living\nand non-living.\n1.2 Analytical and\ncomprehension\nskills\n1.3 Skills in reading\nand analyzing\nstoryboard\n1.4 Effective\nCommunication\nskills\n1.5 Presentation\nskills\n2. Prepare\nTraditional\nRough Key\nDrawings\n2.1 Rough key animation\ndrawings in a scene folder\nare counted and checked if\ncomplete and written on the\nprovided exposure sheet.\n2.2 Rough breakdowns are\nchecked if provided by the\nanimator\n2.3 Timing grid is checked if\nwritten legibly and\ncorresponding to the\ndrawings indicated in the\nexposure sheet\n2.4 Special instructions from\nAnimator or animation\ndirector are checked and\nread if written on the Timing\ngrid or in the exposure\nsheet\n2.5 Traditional cleaned-up\nline quality stroke\nrequirement for the final\ndrawing is checked against\nthe approved model sheets.\n2.1 Verbal\nCommunication\n2.2 Written\nCommunication\n2.3 Physical Science (all\nenvironments)\n2.4 Human anatomy\n2.5 Mechanical science\n2.6 Basic principles of\nanimation\n2.7 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover and\nenvironmental\nconcerns\n2.8 Exposure sheet\n2.9 Timing grid\n2.10 Rough key animation\ndrawings\n2.11 Knowledge on\nexposure sheets\n2.12 Rough breakdowns\n2.13 Cleaned-up line\nquality stroke\nrequirement\n\n2.1 Drawing skills\nfor both living\nand non-living.\n2.2 Analytical and\ncomprehension\nskills\n2.3 Skills in reading\nand analyzing\ntiming grids and\nexposure sheet\n2.4 Effective\nCommunication\nskills\n2.5 Presentation\nskills\n2.6 Practicing\nOSHS, EHSM,\n3Rs and 5S\n3. Produce\nTraditional\ncleaned-up\nkey\n3.1 All rough key drawings\nare arranged properly and\nflipped by hand to see and\nanalyze the animation\n3.1 Verbal\nCommunication\n3.2 Written\nCommunication\n3.1 Clean-up\nDrawing Skills\n3.2 Analytical and\ncomprehension\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________________ 35\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndrawings\nmovements\n3.2 Rough Key drawings poses\nand rough expressions are\nanalyzed and understood\nas indicated in the\nstoryboard and the\nexposure sheet.\n3.3 All rough key drawings\npose that are off-model are\nredrawn using the correct\nmodel sheet construction &\nproportion.\n3.4 Rough body Attitude and\nfacial expressions are\nmaintained and captured\nduring the redrawing and\nmodeling process.\n3.5 Rough breakdowns are\nanalyzed, redrawn and put\non model based on\nanimation flow.\n3.6 Line quality stroke is\napplied to all redrawn\nrough key animation poses\nand breakdowns.\n3.7 Key drawing &\nbreakdown labels,\nanimator instructions,\nproduction information,\ntiming grid are copied\ncarefully from the original\nrough key drawings and\nwritten clearly on the clean\nanimation paper in the\nappropriate position.\n3.8 All final traditional cleaned-\nup key drawings and\nbreakdowns are organized\nand bundled neatly\ntogether inside a folder.\n3.9 Old rough key drawings\nand rough breakdowns are\nalso organized, bundled\nand returned neatly\ntogether inside scene\nfolder.\n3.10 Scene folder contents are\ndouble checked, signed\nand submitted to\nappropriate personnel.\n3.3 Physical Science (all\nenvironments)\n3.4 Mechanical science\n3.5 Basic principles of\nanimation\n3.6 Human anatomy\n3.7 Cross platform data\ntransfer\n3.8 Rough Key\ndrawings poses and\nrough expressions\n3.9 Body Attitude and\nfacial expressions\n3.10 Rough breakdowns\n3.11 Key drawing &\nbreakdown labels\n3.12 animator\ninstructions\n3.13 production\ninformation\n3.14 timing grid\n3.15 Cleaned-up Key\ndrawings and\nbreakdowns\n3.16 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover\nand environmental\nconcerns\n3.17 Geometry for Basic\nShapes\nskills\n3.3 Skills in\nreading and\nanalyzing\ntiming grids\nand\nbreakdowns\n3.4 Effective\nCommunicatio\nn skills\n3.5 Computer\noperation skills\n3.6 Presentation\nskills\n3.7 Practicing\nOSHS, EHSM,\n3Rs and 5S\n4. Edit / Revise\ncleaned-up\nKey\nDrawings\n4.1 Scene folder with revision\ncalls are read and\nunderstood based on the\ninstructions written by a\n4.1 Verbal\nCommunication\n4.2 Written\nCommunication\n4.1 Clean-up\nDrawing Skills\n4.2 Analytical and\ncomprehension\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________________ 36\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nsupervisor.\n4.2 All affected cleaned-up key\ndrawings & breakdowns are\nredrawn based on the\nscope of the revision calls.\n4.3 Revised scene folder\ncontents are doubled\nchecked and signed off as\ndone after all corrections\nare made.\n4.4 Revised scene folder is\nsubmitted to appropriate\npersonnel.\n4.3 Physical Science (all\nenvironments)\n4.4 Mechanical science\n4.5 Basic principles of\nanimation\n4.6 Cross platform data\ntransfer\n4.7 Rough Key drawings\nposes and rough\nexpressions\n4.8 Body Attitude and\nfacial expressions\n4.9 Rough breakdowns\n4.10 Key drawing &\nbreakdown labels\n4.11 animator instructions\n4.12 production\ninformation\n4.13 timing grid\n4.14 Cleaned-up Key\ndrawings and\nbreakdowns\n4.15 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover\nand environmental\nconcerns\nskills\n4.3 Skills in reading\nand analyzing\ntiming grids and\nbreakdowns\n4.4 Effective\nCommunication\nskills\n4.5 Computer\noperation skills\n4.6 Presentation\nskills\n4.7 Practicing\nOSHS, EHSM,\n3Rs and 5S\n\n--- PDF PAGE 41 ---\n__________________________________________________________________