Key animation drawings \n3.5 \nAnimation scene file \n3.6 \nModel sheets \n3.7 \nExported video file \n4. Digital Model sheets \nMay include digital copies of: \n4.1 \nCharacter turn around \n4.2 \nProps turn around \n4.3 \nbackground angles \n4.4 \nmouth/ lip-sync chart \n4.5 \nPoses / Attitude \n4.6 \nExpressions \n4.7 \nSpecial effects \n4.8 \nConstruction instructions \n4.9 \nsize comparison \n4.10 Main characters \n4.11 incidental characters \n5. Appropriate personnel \nMay include: \n5.1 \nProduction assistant \n5.2 \nProduction manager \n5.3 \nDepartment head \n5.4 \nAnimation Director \n5.5 \nSupervisor (* this can also be the Trainer)\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________________          61 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nVARIABLE \nRANGE \n6. 2D animation \nsoftware \nMay include one of the following: \n6.1 \nCTP Pro \n6.2 \nRetas Pro \n6.3 \nFlipbook \n6.4 \nFlash \n6.5 \nToonboom \n6.6 \nAfter Effects \n6.7 \nOpen Toonz \n6.8 \nPaintool Sai \n6.9 \nKrita \n6.10 Clip Studio \n6.11 TV Paint \n7. Video Format \nMay include following video file format: \n7.1 \nQuickTime file format (.mov) \n7.2 \nAVI (.avi) \n7.3 \nFlash video (FLV) \n7.4 \nMP4, etc. \n8. Exposure sheet \nA vertical chart containing the following: \n8.1 \nDirectors notes and instructions \n8.2 \nNumber of drawings \n8.3 \nCamera instructions \n8.4 \nDialogue track and mouth lip-sync \n8.5 \nLength of scene \n8.6\nProduction information \n9. Timeline \nA horizontal chart containing layers similar to the exposure \nsheet that may contain the following: \n9.1 \nDirectors notes and instructions \n9.2 \nFrame Numbers \n9.3 \nNumber of drawings \n9.4 \nCamera instructions \n9.5 \nDialogue track and lip sync \n9.6 \nLength of scene \n9.7\nProduction information \n10. Timing grid lines \nMay include: \n10.1 Single long line – the first to be in-between \n10.2 Short line – the last to be in-between \n10.3 Equal length lines – indicating equal spaced in-\nbetweens \n10.4 Line with an “X” mark – indicating a special in-\nbetween instruction of a favored space \n10.5 Series of lines that gradually tapers like a fish bone \non one or both sides of a single line, indicating a \nseries on in-betweens that starts with the longest \nand ends at the shortest line. \n11. Labeling system \nMay include: \n11.1 Letter and number \n11.2 double letter and number \n11.3\nSymbol and a number \n12. Revision calls \nMay include:\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________________          62 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nVARIABLE \nRANGE \n12.1 Off model digital In-between drawings  \n12.2 Poor cleaned-up line quality \n12.3 wrong labels \n12.4 dirty and crumpled animation paper \n12.5 Disorganized submission of scene folder \n12.6 Missing final cleaned-up Key drawing \n12.7 Missing rough key drawings \n12.8 Missing exposure sheet \n12.9 Missing details \n12.10 wrong mouth chart / lipsync used \n12.11 Timing grid copied wrong \n12.12 Wrong counting of drawing contents \n12.13 Wrong eye direction \n12.14 Wrong costume, props \n12.15 Wrong light direction/shadows/tones/highlights/mark \nup \n \n13. Revised scene \nfolder \nMay include: \n13.1 Revision call instructions \n13.2 Revised Cleaned-up Key Drawings \n13.3 Original Rough key drawings \n13.4 Original Cleaned-up Key drawings \n13.5 Exposure sheet \n13.6 Layout \n13.7\nStoryboard\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________          63 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1 Identified all digital in-between requirements \nincluding source materials, file folders, materials \nand equipment. \n1.2 Produced on-model digital cleaned-up and in-\nbetween drawings using appropriate tools and \nfeatures of the selected software to meet the \nconstraints of the production \n1.3 Edited the necessary revision to obtain quality \nstandard of the clean-up and in-between drawing \nin compliance with relevant personnel\n2. Method of Assessment \nCompetency in this unit may be assessed through: \n2.1 Demonstration with oral questioning \n2.2 Interview \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials \n3.2 Applicable equipment \n4. Context of Assessment \n4.1 Competency maybe assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center.\n",
