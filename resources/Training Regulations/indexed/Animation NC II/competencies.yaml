ocument, rank\nand present\nrecommendations about\npossible solutions to\nappropriate person for\ndecision.\n2.1. Current industry\nhardware and\nsoftware products\nand services\n2.2. Industry service and\nhelpdesk practices,\nprocesses and\nprocedures\n2.3. Operating systems\n2.4. Industry standard\ndiagnostic tools\n2.5. Malfunctions and\nresolutions.\n2.6. Root cause analysis\n2.1. Identifying current industry\nhardware and software\nproducts and services\n2.2. Identifying services and\nhelpdesk practices,\nprocesses and procedures.\n2.3. Identifying operating system\n2.4. Identifying current industry\nstandard diagnostic tools\n2.5. Describing common\nmalfunctions and\nresolutions.\n2.6. Determining the root cause\nof a routine malfunction\n3. Recommend\nsolutions to\nproblems\n3.1. Plan implementation of\nsolutions\n3.2. Plan evaluation of\nimplemented solutions\n3.3. Document\nrecommended solution\nand submit to\nappropriate person for\nconfirmation.\n3.1. Standard\nprocedures\n3.2. Documentation\nproduce\n3.1 Producing documentation\nthat recommends solutions\nto problems\n3.2 Following established\nprocedures\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________________ 21\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate person\nMay Include:\n1.1. Supervisor or manager\n1.2. Peers/work colleagues\n1.3. Other members of the organization\n2. Plan\nMay include\n2.1. Priority requirements\n2.2. Co-ordination and feedback requirements\n2.3. Safety requirements\n2.4. Risk assessment\n2.5. Environmental requirements\n3. Document\nMay include :\n3.1. Electronic mail\n3.2. Briefing notes\n3.3. Written report\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Determine the root cause of a routine malfunction\n1.2. Identify solutions\n1.3. Produce documentation that recommends solutions to\nproblem