          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nrequirements \nfor traditional \nin-between \ndrawings \n1.1 Traditional animation \nequipment & materials are \nidentified and prepared \naccording to the task \nundertaken. \n1.2 Traditional in-between \nrequirements are identified \nfrom the given source \nmaterial. \n1.3 Appropriate model sheets \nare gathered for reference in \nthe given scene folder \n1.4 Incomplete materials and \nfaulty equipment are reported \nto appropriate personnel \n1.1 Verbal \nCommunication \n1.2 Written \nCommunication \n1.3 Physical Science (all \nelements) \n1.4 Mechanical Science \n1.5 Basic principles of \nanimation \n1.6 Traditional \nanimation \nequipment & \nmaterials \n1.7 Traditional in-\nbetween drawing \nrequirements \n1.8 Model sheets \n1.1 Drawing skills for \nboth living and \nnon-living. \n1.2 Analytical and \ncomprehension \nskills \n1.3 Skills in reading \nand analyzing \nstoryboard and \nexposure sheet \n1.4 Effective \nCommunication \nskills \n1.5 Presentation \nskills \n \n2. Prepare \nmaterials for \ntraditional In-\nbetween \ndrawings \n2.1 Required Model sheets are \ntaped, clipped or pinned at a \nlocation easily seen by the \neye within arm’s length of the \ndrawing area. \n2.2 Animation paper and \ndrawing materials are \nprepared in the drawing area \nfor easy access. \n2.3 Cleaned-up key animation \ndrawings and breakdowns \nin the scene folder are \ncounted and checked if \ncomplete and written on the \nprovided exposure sheet. \n2.4 Scene folder contents are \nchecked if bundled, organized \nand complete inside the \nfolder for reference. \n2.5 Timing grids are checked if \nwritten legibly on each \ncleaned-up key drawing and \nindicated on the exposure \nsheet \n2.6 Special instructions written \non the cleaned-up key \ndrawings and exposure sheet \nare noted and will be used for \nreference on in-between \nwork. \n \n2.1 Verbal \nCommunication \n2.2 Written \nCommunication \n2.3 Physical Science (all \nenvironments) \n2.4 Mechanical Science \n2.5 Basic principles of \nanimation \n2.6 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns \n2.7 Exposure sheet \n2.8 Timing grids \n2.9 Rough key \nanimation drawings \n2.10 Knowledge on \nexposure sheets  \n2.11 Rough breakdowns \n2.12 Cleaned-up line \nquality stroke \nrequirement \n \n \n \n \n \n2.1 Drawing skills \nfor both living \nand non-living. \n2.2 Analytical and \ncomprehension \nskills \n2.3 Skills in reading \nand analyzing \nstoryboard  \n2.4 Skills in reading \nand analyzing \ntiming grids and \nexposure sheet \n2.5 Effective \nCommunication \nskills \n2.6 Presentation \nskills \n2.7 Practicing \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________          42 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.7 Traditional cleaned-up key \ndrawing line quality stroke is \nnoted and will be followed \nstrictly for all required in-\nbetween drawings in the \nscene. \n \n3. Produce \ntraditional in-\nbetween \ndrawings \n3.1 All cleaned-up key drawings \nand breakdowns are carefully \nheld together and flipped by \nhand to see and analyze the \nline quality and animation \nmovement flow. \n \n3.2 Two cleaned-up key drawings \nare arranged on top of each \nother at a time and higher \nnumber is always placed at \nthe topmost pile. \n \n3.3 Light from the animation \nlightbox / table is opened to \nsee through the two cleaned-\nup key drawings and see the \nintersecting lines of both \npapers. \n \n3.4 A clean sheet of animation \npaper is placed on top of the \ntwo cleaned-up key drawings \nin preparation to sketch the \nfirst traditional rough in-\nbetween drawing. \n \n3.5 Timing written on the \ncleaned-up key drawing at \nthe topmost pile is analyzed & \nfollowed to produce the first \ntraditional rough in-between \nsketch based on the length of \nthe indicated timing grid \nlines and the model sheet. \n \n3.6 Traditional rough in-betweens \nare labeled properly based on \nthe labeling system of the \ncleaned-up key drawings \n \n3.7 Breakdowns are strictly \nfollowed as an in-between \ndrawing if provided in the \nscene folder. \n3.8 All remaining rough in-\nbetweens are produced from \nthe timing grid lines written on \nthe remaining pairs of \narranged cleaned-up key \ndrawings contained in the \nscene folder. \n \n3.1 Verbal \nCommunication \n3.2 Written \nCommunication \n3.3 Physical Science (all \nenvironments) \n3.4 Mechanical Science \n3.5 Basic principles of \nanimation \n3.6 Computer hardware \nrequirements for \nlinetest \n3.7 Cross platform data \ntransfer \n3.8 Rough key drawing \nposes and rough \nexpressions \n3.9 Body attitude and \nfacial expressions \n3.10 Rough breakdowns \n3.11 Key drawing & \nbreakdown labels \n3.12 animator instructions \n3.13 production \ninformation \n3.14 timing grid \n3.15 Cleaned-up Key \ndrawings and \nbreakdowns \n3.16 Linetest software \n3.17 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns \n3.18 Geometry for Basic \nShapes \n \n \n \n3.1 Clean-up and \nIn-between \nDrawing Skills  \n3.2 Analytical and \ncomprehension \nskills \n3.3 Skills in reading \nand analyzing \ntiming grids and \nexposure sheet \n3.4 Skills in \nanalyzing \nanimation \nbreakdowns \n3.5 Effective \nCommunication \nskills \n3.6 Presentation \nskills \n3.7 Practicing \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________          43 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.9 All rough in-betweens \nproduced are carefully \ncleaned-up using the same \nline quality stroke clearly \nseen at the cleaned-up key \ndrawings. \n \n3.10 All cleaned-up In-between \ndrawings are carefully \nchecked again against the \nlight of the lightbox if all \ntiming grid lines are followed.\n \n3.11 All final key drawings and in-\nbetween drawings are shot \nin sequence at the linetest \nsoftware to check model \ndrawing & line consistency \nand to produce correct flow \nof in-between drawing. \n \n3.12 All final cleaned-up key \ndrawings & final in-between \ndrawings are arranged, \norganized and bundled \nneatly together inside scene \nfolder. \n \n3.13 Old rough key drawings and \nrough in-betweens are \norganized, bundled and \nreturned neatly together \ninside scene folder. \n \n3.14 Scene folder contents are \ndouble checked, signed and \nsubmitted to appropriate \npersonnel. \n4. Edit / Revise \nin-between \ndrawings \n4.1 Returned scene folder with \nrevision calls are read and \nanalyzed based on the \ninstructions written \nspecifically for the affected in-\nbetween drawings. \n4.2 All affected in-between \ndrawings are redrawn \naccordingly based on the \nscope of the revision calls \n4.3 Revised scene folder \ncontents and revision calls \nare doubled checked, \norganized properly and \nsigned off as done after all \ncorrections are made. \n4.4 Revised scene folder is \nsubmitted to appropriate \npersonnel. \n4.1 Verbal \nCommunication \n4.2 Written \nCommunication \n4.3 Physical Science \n(all environments) \n4.4 Mechanical Science\n4.5 Basic principles of \nanimation \n4.6 Computer hardware \nrequirements for \nlinetest \n4.7 Linetest software \n4.8 Cross platform data \ntransfer \n4.9 In-between \ndrawings \n4.10 Rough key drawing \nposes and rough \nexpressions\n4.1 Clean-up and In-\nbetween \nDrawing Skills  \n4.2 Analytical and \ncomprehension \nskills \n4.3 Skills in reading \nand analyzing \ntiming grids and \nexposure sheet \n4.4 Skills in \nanalyzing \nanimation \nbreakdowns \n4.5 Effective \nCommunication \nskills \n4.6 Presentation \nskills \n4.7 Practicing\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________          44 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.11 Body attitude and \nfacial expressions \n4.12 Rough breakdowns \n4.13 Key drawing & \nbreakdown labels \n4.14 animator \ninstructions \n4.15 production \ninformation \n4.16 timing grid \n4.17 Cleaned-up key \ndrawings and \nbreakdowns \n4.18 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns \n4.19 Geometry for basic \nshapes \n \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________          45 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Traditional \nanimation \nequipment & \nmaterials \nMay include: \n1.1 \nAnimation table \n1.2 \nlightbox \n1.3 \nanimation disc \n1.4 \nManual/ electric \nsharpener \n1.5 \nDesk lamp \n1.6 \nchair \n1.7 \nAnimation paper \n1.8 \nPegbar \n1.9\nRuler\n \n1.10 bull clip \n1.11 magic tape \n1.12 Light colored pencils \n1.13 Lead pencils \n1.14 Rubber/ kneaded eraser \n1.15 Reinforcement peghole \nstickers \n1.16 line test machine / computer\n1.17 linetest software \n2. Source material \nMay include: \n2.1 \nStoryboard \n2.2 \nLay-out drawings \n2.3 \nDirector’s instructions \n2.4 \nModel sheets \n2.5 \nExposure sheets \n2.6 \nKey animation drawings \n2.7 \nAnimation folder / envelope \n3. Scene folder \nMay include: \n3.1 \nStoryboard \n3.2 \nLay-out \n3.3 \nExposure sheets \n3.4 \nKey animation drawings \n3.5\nModel sheets\n4. Model sheets \nMay include: \n4.1 \nCharacter turn around \n4.2 \nProps turn around \n4.3 \nbackground angles \n4.4 \nmouth/ lip-sync chart \n4.5 \nPoses / Attitude \n4.6 \nExpressions \n4.7 \nSpecial effects \n4.8 \nConstruction instructions \n4.9 \nsize comparison \n4.10 Main characters \n4.11 incidental characters \n5. Appropriate \npersonnel \n5.1 \nProduction assistant \n5.2 \nProduction manager \n5.3 \nDepartment head \n5.4 \nAnimation director \n5.5\nSupervisor ( * this can also be the Trainer )\n6. Animation paper \nMay include: \n6.1 \nstandard pegbar punched bond paper \n6.2 \nstandard pegbar punched Animation paper \n \n7. Drawing materials\nMay include: \n7.1 \ncolored pencils \n7.2 \nlead pencils \n7.3 \nkneaded / rubber eraser \n7.4 \nruler \n7.5\nsharpener\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________________          46 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nVARIABLE \nRANGE \n8. Cleaned-up Key \nanimation  \ndrawings   \nMay include: \n8.1 \nCharacters \n8.2 \nAnimals \n8.3 \nprops \n8.4 \nobjects \n8.5\nbackgrounds\n9. Breakdowns \nA special drawing that is provided only by Animators if needed \nin the scene. May include: \n9.1 \na drawing with a different path of action \n9.2 \na drawing with a wave or flow action \n9.3\na drawing that favors its spacing to one key drawing\n10. Exposure sheet \nA chart containing the following: \n10.1 Directors notes and instructions \n10.2 Number of drawings \n10.3 camera instructions \n10.4 dialogue track and mouth lip-sync \n10.5 length of scene \n10.6 Production information\n11. Timing grid \nMay include: \n11.1 slow in timing grid \n11.2 slow out timing grid \n11.3 equal timing grid \n11.4 special timing grid\n12. Special \nInstructions \nSpecial Instructions may include: \n12.1 separation parts \n12.2 mouth / lip-sync \n12.3 breakdown \n12.4 cycles in timing \n \n12.5 shadow/ high light \nindications \n12.6 shading instructions \n12.7 eye blinks / eye \nmovement\n13. Line quality stroke\nMay include \n13.1 Thin lines \n13.2 Thick lines \n13.3 Thin & thick lines combined \n13.4 Wriggly lines \n13.5 Broken / stylized lines\n14. Animation \nlightbox / table \nMay include \n14.1 Portable square lightbox \n14.2 Animation table with disc \n14.3 Square lightbox with animation disc\n15. Timing grid lines \nThese are horizontal or vertical lines with varying length sizes \ndividing a single straight line into specific spaces. This May \ninclude: \n15.1 Single long line – the first to be in-between \n15.2 Short line – the last to be in-between \n15.3 Equal length lines – indicating equal spaced in-betweens \n15.4 Line with an “X” mark – indicating a special in-between \ninstruction of a favored space \n15.5 Series of lines that gradually tapers like a fish bone on \none or both sides of a single line, indicating a series on \nin-betweens that starts with the longest and ends at the \nshortest line.\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________          47 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nVARIABLE \nRANGE \n16. Labeling system \nMay include: \n16.1 Letter and number \n16.2 double letter and number \n16.3 Symbol and a number \n17. Linetest software \nMay include: \n17.1 CTP pro \n17.2 Retas Pro \n17.3 Flipbook \n17.4 Flash \n17.5 Toonboom \n17.6 After effects \n18. Revision calls \nMay include: \n18.1 \nOff model in-between drawings \n18.2 \nPoor in-between line quality \n18.3 \nwrong labels \n18.4 \nwrong in-betweens \n18.5 \ndirty and crumpled animation paper \n18.6 \nDisorganized submission of scene folder \n18.7 \nMissing final in-between drawings \n18.8 \nMissing rough in-between drawings \n18.9 \nMissing rough key drawings \n18.10 Missing details \n18.11 Missing Drawings \n18.12 Missing exposure sheet \n18.13 wrong mouth chart / lipsync used \n18.14 Wrong counting of drawing contents \n18.15 Wrong eye direction \n18.16 Wrong costume, props \n18.17 Wrong light direction/shadows/tones/highlights/mark up \n19. Revised scene \nfolder \nMay include: \n19.1 Revision call instructions \n19.2 Revised cleaned-up in-between drawings \n19.3 Original rough in-between drawings \n19.4 Original rough key drawings \n19.5 Original cleaned-up key drawings \n19.6 Exposure sheet \n19.7 Layout \n19.8 Storyboard\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________          48 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018"
