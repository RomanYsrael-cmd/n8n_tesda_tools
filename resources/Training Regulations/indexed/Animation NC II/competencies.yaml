censes\n5.4\nProfessional Licenses\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________________ 12\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in\nthe course of managing oneself based on\nperformance evaluation\n1.3\nCompleted trainings and career opportunities\nwhich are based on the requirements of the\nindustries\n1.4\nAcquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nPortfolio Assessment\n3.2\nInterview\n3.3\nSimulation/Role-plays\n3.4\nObservation\n3.5\nThird Party Reports\n3.6\nExams and Tests\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 17 ---\n_____________________________________________________________________________________ 13\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE :"
