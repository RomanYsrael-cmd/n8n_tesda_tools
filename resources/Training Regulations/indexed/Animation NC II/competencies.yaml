\nBreakdowns \n A special drawing provided only by animators to indicate: \n8.1 \na different path of action or movement \n8.2 \na special timing or spacing \n9. Timing grid \nMay include: \n9.1 \nslow in timing grid \n9.2 \nslow out timing grid \n9.3 \nequal timing grid \n9.4\nspecial timing grid\n10. Special \nInstructions \nMay include: \n10.1 separation parts \n10.2 mouth / lip-sync \n10.3 breakdown \n10.4 cycles in timing \n10.5 shadow/ high light indications \n10.6 shading instructions \n10.7 eye blinks / eye movement \n10.8 head turn\n11. Traditional \ncleaned-up line \nquality stroke \nrequirements \nMay include: \n11.1 Thin lines \n11.2 Thick lines \n11.3 Thin & thick lines combined \n11.4 Wriggly lines \n11.5 Broken / stylized lines\n12. Rough Key \ndrawings \nMay include: \n12.1 Action poses \n12.2 Expressions \n12.3 Gestures \n13. Key drawing & \nBreakdown  \nlabels \nMay include: \n13.1 Encircled letters with numbers \n13.2 Triangle shaped symbol with letters &numbers \n13.3 Abbreviation ( eg : B/D) with letter & numbers \n14. Animator \ninstructions \nMay include: \n14.1 eye blink/ eye ball direction \n14.2 separation of parts \n14.3 Registration mark \n14.4 mouth chart / lip-sync \n14.5 cycle instructions \n14.6 wave flow instructions \n14.7 arrows & direction of action\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________________          39 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nVARIABLE \nRANGE \n14.8 highlight / shadows   \n15. Production \ninformation \nMay include: \n15.1 production episode \n15.2 production title \n15.3 scene number \n15.4 registration instructions \n16. Linetest software May include one of the following: \n16.1 CTP pro \n16.2 Retas Pro \n16.3 Flipbook \n16.4 Flash \n16.5 Toonboom \n16.6 After effects \n \n17. Appropriate \nposition (of \ndrawing labels) \nMay include: \n17.1 Bottom portion near or beside the peg holes \n17.2 upper portion on top of paper \n17.3 lower right or left corner of the paper \n17.4 upper right or left corner of paper \n18. Revision calls \nMay include: \n18.1 Off model key drawings \n18.2 Poor cleaned-up line quality \n18.3 Wrong labels \n18.4 Dirty and crumpled animation paper \n18.5 Disorganized submission of scene folder \n18.6 Missing final cleaned-up Key drawing \n18.7 Missing rough key drawings \n18.8 Missing details \n18.9 Missing Drawings \n18.10 Missing exposure sheet \n18.11 Wrong labels on exposure sheet \n18.12 Wrong mouth chart / lip-sync used \n18.13 Timing grid copied wrong \n18.14 Wrong counting of drawing contents \n18.15 Wrong eye direction \n18.16 Wrong costume, props \n18.17 Wrong light direction/shadows/tones/highlights/mark up \n19. Revised scene \nfolder \nMay include: \n19.1 Revision call instructions \n19.2 Revised Cleaned-up Key Drawings \n19.3 Original Rough key drawings \n19.4 Original Cleaned-up Key drawings \n19.5 Exposure sheet \n19.6 Layout \n19.7 Storyboard\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________          40 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment must show that the candidate: \n \n1.1 Identified and prepared all Traditional clean up \ndrawing requirements including Model sheets, \nequipment and materials \n1.2 Prepared all Traditional rough key in accordance \nwith the instructions contained on the scene \nfolders \n1.3 Produced on-model traditional cleaned-up key \ndrawings following all the constraints of production \n1.4 Edited the necessary revision to obtain quality \nstandard of the Cleaned-up drawings in \ncompliance with relevant personnel\n2. Method of Assessment \nCompetency must be assessed through: \n4.1 Demonstration with oral questioning \n4.2\nInterview\n3. Resource Implication \n3.1 Appropriate supplies and materials \n3.2 Applicable equipment \n4. Context of Assessment \n4.1 Assessment may be conducted in the workplace  \nor in a simulated environment\n",
