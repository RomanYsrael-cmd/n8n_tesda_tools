 \n11.7 \nSlugging \n11.8\nProduction information\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________          54 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \nVARIABLE \nRANGE \n12. Special  file \nInstructions \nMay include instructions on: \n12.1 separation parts \n12.2 mouth / lip-sync \n12.3 breakdown \n12.4 cycles in timing \n12.5 shadow/ high light \nindications \n12.6 drawing registration \ninstructions\n \n12.7 special effects \n12.8 shading \ninstructions \n12.9 eye blinks / eye \nmovement \n12.10 timing \nspecifications \n13.  Off-model drawings \nA drawing that does not look or conform to the provided \nmodel sheet. May include: \n13.1 wrong proportion \n13.2 wrong details \n13.3 wrong expression \n13.4 wrong construction \n13.5\nwrong face features\n14. On-model  \nShould include: \n14.1 proportion \n14.2 volume \n14.3 size \n14.4 facial features \n14.5 attitude and appeal \n14.6 arms and legs  \n14.7 design and style  specifications\n15.  Digital  line size and  \nstroke \nMay include size and stroke for: \n15.1 Thin lines \n15.2 Thick lines \n15.3 Thin & thick lines combined \n15.4 Wriggly lines \n15.5 Broken / stylized lines\n16. Digital key drawings & \ndigital breakdown \nlabels \nMay include: \n16.1 Letter and number \n16.2 double letter and number \n16.3 Symbol and a number\n17.  Production information May include: \n17.1 episode number \n17.2 production title \n17.3 Act number\n18. Appropriate personnel May include: \n21.1 Production Manager \n21.2 Production Assistant \n21.3 Animation director\n19. Video Format \nMay include following video file format: \n18.1 QuickTime file format (.mov) \n18.2 AVI (.avi) \n18.3 Flash video (FLV) \n18.4 MP4 \n18.5 Matroska (.mkv) \n18.6 .vlc \n18.7 Windows media video .wmv \n18.8 Windows media player (WMP)\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________________          55 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018 \n \nVARIABLE \nRANGE \n20. Revised scene file folder May include \n20.1 Revision call instructions \n20.2 Revised digital cleaned-up key drawings \n20.3 Original digital rough key drawings \n20.4 Original digital cleaned-up key drawings \n21. Revision calls \nMay include \n19.1 Off model digital key drawings \n19.2 Poor line quality \n19.3 Wrong labels \n19.4 Missing digital drawings \n19.5 Wrong lip-sync \n19.6 Wrong Action \n19.7 Wrong counting of drawing contents \n19.8 Wrong layering \n19.9 Wrong labels \n19.10 Missing details \n19.11 Missing exposure sheet \n19.12 Wrong mouth chart / lip-sync used \n19.13 Wrong eye direction \n19.14 Wrong costume, props \n19.15 Wrong light direction/shadows/tones/ \nhighlights/mark up\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________          56 \nTR - ANIMATION NC II     (Version 02)                                           Amended   February 27, 2018"
