        "source_text": "500311132\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nmake a pro-active and positive contribution to workplace\ninnovation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nopportunities\nto do things\nbetter\n1.1. Be aware of own role in\nworkplace innovation\n1.2. Opportunities for\nimprovement are identified\nproactively in own area of\nwork\n1.3. Information are gathered\nand reviewed which may\nbe relevant to ideas and\nwhich might assist in\ngaining support for idea.\n1.1. Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements\n1.2. Positive impacts\nand challenges\nin innovation\n1.3. Types of\nchanges and\nresponsibility\n1.1. Identifying roles of\nindividuals in suggesting\nand making improvements\nand the importance of pro-\nactive involvement\n1.2. Listing of positive impacts\nand the challenges of\nchange and innovation\n1.3. Identifying examples of\nthe types of changes that\nare within and outside\nown scope of\nresponsibility\n2. Discuss and\ndevelop\nideas with\nothers\n2.1. Identify people who could\nprovide input into ideas for\nimprovements\n2.2. Select the best way of\napproaching people to\nbegin sharing ideas\n2.3. Review and select ideas\nfor follow up based on\nfeedback\n2.1. Types of\nchanges in the\nindividual\nparticipation\n2.2. Improvements\nor innovations\nin the\nimplementation\n2.3. Communication\nof ideas for\nimprovement\n2.1. Providing examples of the\ntypes of changes that can\noccur as a result of\neffective individual\nparticipation within own\nscope of responsibility\n2.2. Listing of typical reasons\nwhy suggested\nimprovements or\ninnovations may not be\nimplemented, including\nconstraints\n3. Implement\nchanges and\npresent/\nsuggest\nideas with\nothers\n3.1. Take action to implement\nroutine changes in\nconsultation with others\nand within scope of own\nresponsibility\n3.2. Present ideas and\npractical suggestions to\nthe appropriate people\nabout how improvements\ncould be made\n3.1. Types of\nchanges and\neffective\nindividual\nparticipation\n3.2. Communicate\nideas for\nimprovement\n3.1. Providing examples of the\ntypes of changes that can\noccur as a result of\neffective individual\nparticipation within own\nscope of responsibility\n3.2. Stating the typical reasons\nwhy suggested\nimprovements or\ninnovations may not be\nimplemented, including\noperational and\nmanagement constraints\n3.3. Describing how to prepare\nand communicate ideas\nfor improvement to\nmaximize likelihood of\nsupport.\n\n--- PDF PAGE 22 ---\n_____________________________________________________________________________________ 18\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\n1.1.\nStandard operating and/or other workplace\nprocedures\n1.2.\nJob procedures\n1.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n1.4.\nOrganizational or external personnel\n1.5.\nClient/supplier instructions\n1.6.\nQuality standards\n1.7.\nOSH and environmental standards\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________________________ 19\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1. Identified ideas for improvements and used information\nfrom a range of sources including other people to\nreview and select ideas to put forward for\nimplementation\n1.2. Identified ideas are implemented and communicated to\nseek input from others.\n1.3. Implemented routine changes within scope of\nresponsibility.\n2. Resource\nimplication\nThe following resources should be provided:\n2.1 Pens\n2.2 Note pads\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Interview\n3.2. Written Evaluation\n4. Context of\nAssessment\n4.1. Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 24 ---\n_____________________________________________________________________________________ 20\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nUNIT OF COMPETENCY : SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS\nUNIT CODE\n:"
