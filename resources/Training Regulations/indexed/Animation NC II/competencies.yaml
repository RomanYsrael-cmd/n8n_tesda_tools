        "source_text": "ICT 216304\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\nproduce digital in-between drawings to ensure that the flow of\nanimation based on the digital key drawings will move smoothly.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nrequirements\nfor Digital In-\nbetween\ndrawings\n1.1 Digital animation\nequipment & materials\nare identified and prepared\naccording to the task\nundertaken.\n1.2 Digital in-between drawing\nrequirements are identified\nfrom the given source\nmaterial.\n1.3 Appropriate digital copies\nof model sheets are\ngathered for reference in\nthe given file folder.\n1.4 Incomplete materials and\nfaulty equipment are\nreported to appropriate\npersonnel.\n\n1.1 Verbal\nCommunication\n1.2 Written\nCommunication\n1.3 OHS Standards and\n5S’s principles\n1.4 Intellectual Property\nRights and concerns\n1.5 OHS processes and\nprocedures for\nComputer Hardware\n1.6 Digital animation\nequipment &\nmaterials\n1.7 Digital in-between\nDrawing\nrequirements\n1.8 Source materials\n1.9 Digital model sheets\n1.10 Geometry for Basic\nShapes\n1.11 timing grids and\nexposure sheet\n1.1 Analytical and\ncomprehension\nskills\n1.2 Skills in reading\nand analyzing\ntiming grids and\nexposure sheet\n1.3 Skills in\nanalyzing\nanimation\nbreakdowns\n1.4 Effective\nCommunication\nskills\n1.5 Computer\noperating skills\n1.6 Presentation\nskills\n\n2. Produce Digital\nIn-between\ndrawings\n2.1 Digital scene file folder\nis obtained containing\ndigital cleaned-up key\ndrawings & breakdowns\n2.2 Appropriate 2D animation\nsoftware is used based\non the file format\ncontained inside the\nscene file folder.\n2.3 All digital cleaned-up key\ndrawings and breakdowns\nare played back to see\nand analyze the animation\nmovements\n2.4 Digital model sheets and\nspecial file instructions\nare gathered and\nuploaded for reference\nuse on the specified task\nundertaken.\n2.5 Onion skin/ light table\nfeature of the 2D\nanimation software is\nused to see through the\ntwo digital Cleaned-up\n2.1 Verbal\nCommunication\n2.2 Written\nCommunication\n2.3 OHS Standards and\n5S’s principles\n2.4 Intellectual Property\nRights and concerns\n2.5 OHS processes and\nprocedures for\nComputer Hardware\n2.6 Use of 2D animation\nsoftware.\n2.7 Digital model sheets\nand special file\ninstructions\n2.8 Onion skin/ light\ntable feature\n2.9 Timing grid\n2.10 Digital rough in-\nbetweens\n2.11 labeling system\n2.12 digital breakdowns\n2.13 Cross platform data\ntransfer\n2.1 Digital In-\nbetween\nDrawing Skills\n2.2 Analytical and\ncomprehension\nskills\n2.3 Skills in reading\nand analyzing\ntiming grids and\nexposure sheet\n2.4 Skills in\nanalyzing\nanimation\nbreakdowns\n2.5 Computer\noperating skills\n2.6 Effective\nCommunication\nskills\n2.7 Presentation\nskills\n2.8 Practicing\nOSHS, EHSM,\n3Rs and 5S\n\n--- PDF PAGE 62 ---\n_____________________________________________________________________________________ 58\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nKey drawings and see\nintersecting lines of both\nframes\n2.6 Timing grid written on the\ncleaned-up key drawing is\nanalyzed & followed to\nproduce the first rough\ndigital in-between sketch\n2.7 Digital rough in-betweens\nare labeled and marked\non the timeline or\nexposure sheet based on\nthe labeling system of\nthe Cleaned-up Key\ndrawings\n2.8 Digital Breakdowns are\nstrictly followed if provided\nin the scene file folder\n2.9 All remaining digital in-\nbetweens are produced\nbasing from the timing\ngrid lines written on the\nremaining pairs of\narranged digital Cleaned-\nup key drawings\n2.10 All digital in-betweens\nproduced should follow\nthe same line quality\nstroke of the digital\ncleaned-up key drawings\n2.11 All completed digital\ndrawings are checked\nthrough playback if\nanimation movements are\nrunning smoothly.\n2.12 Final digital drawings are\nexported to required\nvideo format and saved\nin a scene file folder.\n2.13 Complete scene File\nfolder contents are double\nchecked and submitted to\nappropriate personnel\n\n2.14 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover\nand environmental\nconcerns\n2.15 Geometry for Basic\nShapes\n3. Edit / Revise\ndigital in-\nbetween\ndrawings\n3.1 Returned file folder with\nrevision calls are read\nand analyzed based on\nthe instructions written\nspecifically for the\naffected Digital In-\nbetween Drawings.\n3.2 All affected digital in-\nbetween drawings are\nredrawn accordingly\nbased on the scope of the\n3.1 Verbal\nCommunication\n3.2 Written\nCommunication\n3.3 OHS Standards and\n5S’s principles\n3.4 Intellectual Property\nRights and concerns\n3.5 OHS processes and\nprocedures for\nComputer Hardware\n3.1 Digital In-\nbetween\nDrawing Skills\n3.2 Analytical and\ncomprehension\nskills\n3.3 Skills in reading\nand analyzing\ntiming grids and\nexposure sheet\n3.4 Skills in\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________________ 59\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nrevision calls\n3.3 Revised File folder\ncontents and revision\ncalls are double checked,\norganized and signed off\nas done after al\ncorrections are made.\n3.4 Revised Digital cleaned-\nup drawings and in-\nbetween drawings are\nexported to video format\nto check the consistency\nof revised drawings\n3.5 Revised file folder is\nsubmitted to appropriate\npersonnel.\n3.6 Use of 2D animation\nsoftware.\n3.7 Digital model sheets\nand special file\ninstructions\n3.8 Onion skin/ lightbox\nfeature\n3.9 Timing\n3.10 Digital rough in-\nbetweens\n3.11 Labeling and\nmarking\n3.12 labeling system of\nthe Cleaned-up Key\ndrawings\n3.13 Cross platform data\ntransfer\n3.14 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover\nand environmental\nconcerns\n3.15 Geometry for Basic\nShapes\nanalyzing\nanimation\nbreakdowns\n3.5 Computer\noperating skills\n3.6 Effective\nCommunication\nskills\n3.7 Presentation\nskills\n3.8 Practicing\nOSHS, EHSM,\n3Rs and 5S\n\n--- PDF PAGE 64 ---\n_____________________________________________________________________________________ 60\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Digital Animation\nEquipment & materials\nMay include:\n1.1 Chair\n1.2 Table\n1.3 computer\n1.4 computer peripherals\n1.5 Digitizing pen and tablet\n1.6 2D animation software\n1.7 Mouse\n1.8 Keyboard\n1.9 USB\n1.10 removable hard drive\n2. Source material\n2.1\nStoryboard\n2.2\nLay-out drawings\n2.3\nDirector’s instructions\n2.4\nModel sheets\n2.5\nExposure sheets\n2.6\nKey animation drawings\n3. File folder\nAlso called directories a way to organize computer files.\nMay include files of:\n3.1\nStoryboard\n3.2\nLay-out\n3.3\nExposure sheets\n3.4\nKey animation drawings\n3.5\nAnimation scene file\n3.6\nModel sheets\n3.7\nExported video file\n4. Digital Model sheets\nMay include digital copies of:\n4.1\nCharacter turn around\n4.2\nProps turn around\n4.3\nbackground angles\n4.4\nmouth/ lip-sync chart\n4.5\nPoses / Attitude\n4.6\nExpressions\n4.7\nSpecial effects\n4.8\nConstruction instructions\n4.9\nsize comparison\n4.10 Main characters\n4.11 incidental characters\n5. Appropriate personnel\nMay include:\n5.1\nProduction assistant\n5.2\nProduction manager\n5.3\nDepartment head\n5.4\nAnimation Director\n5.5\nSupervisor (* this can also be the Trainer)\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________________ 61\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nVARIABLE\nRANGE\n6. 2D animation\nsoftware\nMay include one of the following:\n6.1\nCTP Pro\n6.2\nRetas Pro\n6.3\nFlipbook\n6.4\nFlash\n6.5\nToonboom\n6.6\nAfter Effects\n6.7\nOpen Toonz\n6.8\nPaintool Sai\n6.9\nKrita\n6.10 Clip Studio\n6.11 TV Paint\n7. Video Format\nMay include following video file format:\n7.1\nQuickTime file format (.mov)\n7.2\nAVI (.avi)\n7.3\nFlash video (FLV)\n7.4\nMP4, etc.\n8. Exposure sheet\nA vertical chart containing the following:\n8.1\nDirectors notes and instructions\n8.2\nNumber of drawings\n8.3\nCamera instructions\n8.4\nDialogue track and mouth lip-sync\n8.5\nLength of scene\n8.6\nProduction information\n9. Timeline\nA horizontal chart containing layers similar to the exposure\nsheet that may contain the following:\n9.1\nDirectors notes and instructions\n9.2\nFrame Numbers\n9.3\nNumber of drawings\n9.4\nCamera instructions\n9.5\nDialogue track and lip sync\n9.6\nLength of scene\n9.7\nProduction information\n10. Timing grid lines\nMay include:\n10.1 Single long line – the first to be in-between\n10.2 Short line – the last to be in-between\n10.3 Equal length lines – indicating equal spaced in-\nbetweens\n10.4 Line with an “X” mark – indicating a special in-\nbetween instruction of a favored space\n10.5 Series of lines that gradually tapers like a fish bone\non one or both sides of a single line, indicating a\nseries on in-betweens that starts with the longest\nand ends at the shortest line.\n11. Labeling system\nMay include:\n11.1 Letter and number\n11.2 double letter and number\n11.3\nSymbol and a number\n12. Revision calls\nMay include:\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________________ 62\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nVARIABLE\nRANGE\n12.1 Off model digital In-between drawings\n12.2 Poor cleaned-up line quality\n12.3 wrong labels\n12.4 dirty and crumpled animation paper\n12.5 Disorganized submission of scene folder\n12.6 Missing final cleaned-up Key drawing\n12.7 Missing rough key drawings\n12.8 Missing exposure sheet\n12.9 Missing details\n12.10 wrong mouth chart / lipsync used\n12.11 Timing grid copied wrong\n12.12 Wrong counting of drawing contents\n12.13 Wrong eye direction\n12.14 Wrong costume, props\n12.15 Wrong light direction/shadows/tones/highlights/mark\nup\n\n13. Revised scene\nfolder\nMay include:\n13.1 Revision call instructions\n13.2 Revised Cleaned-up Key Drawings\n13.3 Original Rough key drawings\n13.4 Original Cleaned-up Key drawings\n13.5 Exposure sheet\n13.6 Layout\n13.7\nStoryboard\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________ 63\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Identified all digital in-between requirements\nincluding source materials, file folders, materials\nand equipment.\n1.2 Produced on-model digital cleaned-up and in-\nbetween drawings using appropriate tools and\nfeatures of the selected software to meet the\nconstraints of the production\n1.3 Edited the necessary revision to obtain quality\nstandard of the clean-up and in-between drawing\nin compliance with relevant personnel\n2. Method of Assessment\nCompetency in this unit may be assessed through:\n2.1 Demonstration with oral questioning\n2.2 Interview\n3. Resource Implication\nThe following resources should be provided:\n3.1 Appropriate supplies and materials\n3.2 Applicable equipment\n4. Context of Assessment\n4.1 Competency maybe assessed in actual\nworkplace or at the designated TESDA\nAccredited Assessment Center.\n\n--- PDF PAGE 68 ---\n_____________________________________________________________________________________ 64\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018"
