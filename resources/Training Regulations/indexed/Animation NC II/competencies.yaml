        "source_text": "ICT 216300\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to apply\ndrawing techniques in preparation for traditional animation\nproductions.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\ntraditional\ndrawing\nrequirements\nfor animation\n1.1 Different drawing\nmaterials are identified\nin preparation for hand\ndrawing requirements.\n1.2 Animation drawing\nequipment are prepared\nto support hand drawing\nactivities\n1.3 Drawing references are\ngathered to use as guide\nfor lecture activities or\nassignments\n1.4 Storyboard, layout,\nbackground and model\nsheet are identified\naccording to task\nundertaken\n1.1 Verbal\nCommunication\n1.2 Written\nCommunication\n1.3 Layout drawings\nand instruction\n1.4 Animation\nterminologies and\nproduction\nprocedure\n1.5 Physical Science\n(environment)\n1.6 Physiology\n(anatomy of human\nand animals)\n1.7 Mechanical science\n1.8 Basic principles of\nanimation\n1.9 Computer line test\n1.10 Drawing equipment\nand materials\n1.11 Knowledge in\nIdentification of\nStoryboard, layout\nand model sheet\n1.1 Drawing skills for\nboth living and non-\nliving.\n1.2 Analytical and\ncomprehension\nskills\n1.3 Observational skills\n1.4 Skills in analyzing\nthe animator’s\nrough and timing\ngrid\n1.5 Effective\nCommunication\nskills\n1.6 Skills in interpreting\nbasic principles of\nanimation\n1.7 Presentation skills\n2. Apply hand\ndrawn\ntechniques\n2.1 Hand & wrist pencil\nexercises techniques\nare performed on paper\nto practice right pencil\ngrip, hand position and\narm movement.\n2.2 Different Line drawing\nstrokes are practiced to\nfamiliarize hand grip on\npencil for line\nconsistency.\n2.3 Basic construction\ntechniques are applied to\ndraw human figure,\ncartoons, animals and\nobjects using basic\nshapes.\n2.4 Proportion of sizes is\nmaintained in drawing\ncharacters, props and\nobjects.\n2.1 Verbal\nCommunication\n2.2 Written\nCommunication\n2.3 Constructive Solid\nGeometry for basic\nshapes\n2.4 Human and Animal\nAnatomy\n2.5 Mechanical science\n2.6 Basic principles of\nanimation\n2.7 Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies.\n2.1 Drawing skills for\nboth living and non-\nliving.\n2.2 Analytical and\ncomprehension\nskills\n2.3 Effective\nCommunication\nskills\n2.4 Skills in interpreting\nbasic principles of\nanimation\n2.5 Presentation skills\n2.6 Practicing OSHS,\nEHSM, 3Rs and 5S\n2.7 Human and animal\nanatomy drawing\nskills\n2.8 Skills in copying or\ntracing characters,\nobjects and\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________________ 30\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.5 Basic perspectives are\napplied to draw angles\non characters, props,\nobjects and\nbackgrounds.\nenvironment\n2.9 Skills in perspective\ndrawings both living\nand non-living\nthings.\n3. Apply line art\ndrawings\nbased on\nmodel sheet\n3.1 Model sheets are\nprepared to serve as\nreference for hand\ndrawing activities.\n3.2 Rough action poses,\nattitude poses and\ndifferent facial\nexpressions are drawn\non-model.\n3.3 Different line drawing\nstrokes are identified and\napplied based on the\nmodel sheet.\n3.4 Colored pencil is used to\ndraw rough sketches,\nconstruction & proportion\n3.5 Lead pencil is used to\ndraw quality line art in\ncleaning up rough\ndrawings\n3.6 Full drawings in pencil\nline style are submitted\nfor comments,\ncorrections & evaluation\nof relevant personnel.\n3.1 Verbal\nCommunication\n3.2 Written\nCommunication\n3.3 Constructive Solid\nGeometry for Basic\nShapes\n3.4 Human and Animal\nAnatomy (Rough\naction, attitude\nposes and different\nfacial expressions)\n3.5 Mechanical science\n(rough movement\nand behavior)\n3.6 Basic principles of\nanimation\n3.7 Practicing 3Rs –\nReduce, Re-use,\nRecycle/recover\nand environmental\npolicies\n3.8 Different Line\ndrawing strokes\n3.1 Drawing skills for\nboth living and non-\nliving.\n3.2 Analytical and\ncomprehension\nskills\n3.3 Effective\nCommunication\nskills\n3.4 Skills in interpreting\nbasic principles of\nanimation\n3.5 Presentation skills\n3.6 Practicing OSHS,\nEHSM, 3Rs and 5S\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________________ 31\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing materials\nMay include:\n1.1 Lead pencils – B, 2B, 3B soft pencils\n1.2 Bond paper\n1.3 Animation paper\n1.4 Eraser - kneaded eraser, rubber eraser\n1.5 Ruler\n1.6 Sharpener – Manual or electric\n1.7 Mechanical pencil\n1.8 Mechanical eraser\n\n2. Animation drawing\nequipment\nMay include:\n2.1\nAnimation Table with lightbox\n2.2\nPeg Bar\n2.3\nChair\n2.4\nPortable Animation lightbox\n2.5\nMovable Light / desk lamp\n3. Drawing references\nMay include:\n3.1\nBasic Drawing books/e-books\n3.2\nAnatomy books/e-books\n3.3\nCharacter design books/e-books\n3.4\nMagazines\n3.5\nModel sheets\n3.6\nVideos / DVDs\n3.7\nLive model\n3.8\nOnline references\n3.9\nPhotographs\n3.10 Background books/e-books\n3.11 Buildings and houses books/e-books\n3.12 Mechanical design books/e-books\n4. Hand & wrist pencil\nexercises techniques\nMay include:\n4.1\nDrawing loops – clockwise and\ncounterclockwise\n4.2\nPencil, hand and arm movement\n4.3\nDrawing zigzag lines\n4.4\nDrawing vertical and horizontal lines\n4.5\nDrawing gradient lines\n4.6\nPencil grip exercises\n5. Line drawing strokes\nMay include:\n5.1\nThin lines\n5.2\nThick lines\n5.3\nThin & thick lines combined\n5.4\nCircles and spheres\n5.5\nWriggly lines\n5.6\nStraight lines\n5.7\nZigzag lines\n5.8\nCurve and loops\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________________ 32\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nVARIABLE\nRANGE\n\n6. Model sheets\nMay include:\n6.1\nCharacter turn around\n6.2\nAnimal turn around\n6.3\nObjects turn around\n6.4\nProps turn around\n6.5\nBackground angles\n6.6\nExpressions and special poses\n6.7\nCharacter size comparison\n6.8\nMouth chart\n7. Action poses\nMay include dynamic poses of:\n7.1\nRunning\n7.2\nFighting\n7.3\nPushing\n7.4\nLifting\n7.5\nWalking\n8. Expressions\nMay Include facial expressions:\n8.1\nAngry / Mad\n8.2\nHappy / Ecstatic\n8.3\nSad / depressed\n8.4\nIn love / passion\n9. On-model\nShould include:\n9.1\nProportion\n9.2\nVolume\n9.3\nSize\n9.4\nFacial features\n9.5\nAttitude and appeal\n9.6\nArms and legs\n9.7\nDesign and style specifications\n10. Relevant personnel\nMay include:\n10.1 Trainer\n10.2 Animation Checker\n10.3 Animation Director\n10.4 Supervisor\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________________ 33\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1\nIdentified all traditional drawing requirements\nincluding line drawing materials, equipment\nand references\n1.2\nApplied hand drawn techniques including\nbasic construction, proportion, perspective\nand foreshortening\n1.3\nApplied line art drawings based on the\ncreative requirements using appropriate\ntools and materials\n\n2. Method of Assessment\nCompetency must be assessed through:\n2.1 Demonstration with oral questioning\n2.2 Interview\n3. Resource Implication\nThe following resources should be provided:\n3.1 Appropriate work area or location\n3.2 Appropriate supplies and materials\n3.3 Applicable tools and equipment\n4. Context of Assessment\n4.1 Competency maybe assessed in actual\nworkplace or at the designated TESDA\nAccredited Assessment Center.\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________________ 34\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nUNIT TITLE :\nPRODUCE TRADITIONAL CLEANED-UP KEY DRAWINGS\nUNIT CODE :"
