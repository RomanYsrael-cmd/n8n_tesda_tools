            "title": "Edit / Revise cleaned-up Key Drawings",
            "performance_criteria": [
              {
                "number": "4.1",
                "text": "Rough Key drawings poses and rough expressions are analyzed and understood as indicated in the storyboard and the exposure sheet.",
                "source_number": "3.2"
              },
              {
                "number": "4.2",
                "text": "All rough key drawings pose that are off-model are redrawn using the correct model sheet construction & proportion.",
                "source_number": "3.3"
              },
              {
                "number": "4.3",
                "text": "Rough body Attitude and facial expressions are maintained and captured during the redrawing and modeling process.",
                "source_number": "3.4"
              },
              {
                "number": "4.4",
                "text": "Rough breakdowns are analyzed, redrawn and put on model based on animation flow.",
                "source_number": "3.5"
              },
              {
                "number": "4.5",
                "text": "Line quality stroke is applied to all redrawn rough key animation poses and breakdowns.",
                "source_number": "3.6"
              },
              {
                "number": "4.6",
                "text": "Key drawing & breakdown labels, animator instructions, production information, timing grid are copied carefully from the original rough key drawings and written clearly on the clean animation paper in the appropriate position.",
                "source_number": "3.7"
              },
              {
                "number": "4.7",
                "text": "All final traditional cleaned- up key drawings and breakdowns are organized and bundled neatly together inside a folder.",
                "source_number": "3.8"
              },
              {
                "number": "4.8",
                "text": "Old rough key drawings and rough breakdowns are also organized, bundled and returned neatly together inside scene folder.",
                "source_number": "3.9"
              },
              {
                "number": "4.9",
                "text": "Scene folder contents are double checked, signed and submitted to appropriate personnel.",
                "source_number": "3.10"
              },
              {
                "number": "4.10",
                "text": "Scene folder with revision calls are read and understood based on the instructions written by a",
                "source_number": "4.1"
              },
              {
                "number": "4.11",
                "text": "All affected cleaned-up key drawings & breakdowns are redrawn based on the scope of the revision calls.",
                "source_number": "4.2"
              },
              {
                "number": "4.12",
                "text": "Revised scene folder contents are doubled checked and signed off as done after all corrections are made.",
                "source_number": "4.3"
              },
              {
                "number": "4.13",
                "text": "Revised scene folder is submitted to appropriate personnel.",
                "source_number": "4.4"
