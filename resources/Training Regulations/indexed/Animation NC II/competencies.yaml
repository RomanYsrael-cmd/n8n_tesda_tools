        "source_text": "500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and\nsafety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nhazards and\nrisks\n1.1 Safety regulations and\nworkplace safety and\nhazard control practices\nand procedures are\nclarified and explained\nbased on organization\nprocedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding indicators\nare identified to minimize\nor eliminate risk to co-\nworkers, workplace and\nenvironment in\naccordance with\norganization procedures\n1.3 Contingency measures\nduring workplace\naccidents, fire and other\nemergencies are\nrecognized and\nestablished in\naccordance with\norganization procedures\n1.1. Company workplace\nsafety regulations\n1.2. Industry hazard control\npractices and\nprocedures\n1.3. Internationally\nrecognized OSH\nprocedures and\npractices and\nregulations\n1.4. PPE types and uses\n1.5. Personal hygiene\npractices\n1.6. Hazards/risks\nidentification and\ncontrol\n1.7. Threshold Limit Value -\nTLV\n1.8. OSH indicators\n1.9. Organization safety\nand health protocol\n1.10. Safety consciousness\n1.11. Health consciousness\n1.1 Clarifying and\nexplaining safety\nregulations and\nworkplace safety\nand hazard control\n1.2 Identifying\nhazards/risks in\nthe workplace and\ntheir\ncorresponding\nindicators\n1.3 Recognizing\ncontingency\nmeasures during\nworkplace\naccidents, fire and\nother emergencies\n1.4 Practice of\npersonal hygiene\n1.5 Interpersonal skills\n1.6 Communication\nskills\n\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of maximum\ntolerable limits which\nwhen exceeded will\nresult in harm or damage\nare identified based on\nthreshold limit values\n(TLV)\n2.2 Effects of the hazards\nare determined\n2.3 OSH issues and/or\nconcerns and identified\nsafety hazards are\nreported to designated\npersonnel in accordance\nwith workplace\nrequirements and\nrelevant workplace OSH\nlegislation\n2.1 Methods of identifying\nterms of maximum\ntolerable limits\n2.2 Hazard effects\n2.3 Reporting methods on\nOSH issues/concerns\n2.4 OSH procedures and\npractices and\nregulations\n2.5 PPE types and uses\n2.6 Hazards/risks\nidentification and\ncontrol\n2.7 Threshold Limit Value -\nTLV\n2.8 OSH indicators\n2.9 Organization safety\nand health protocol\n2.10 Safety consciousness\n2.11 Health consciousness\n\n2.1 Identifying terms\nof maximum\ntolerable limits\n2.2 Determining\neffects of hazards\nand risks\n2.3 Reporting OSH\nissues and/or\nconcerns\n2.4 Identifying safety\nhazards\n2.5 Hazards/risks\nidentification and\ncontrol skills\n2.6 Interpersonal\nskills\n2.7 Communication\nskills\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________________ 14\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Control\nhazards and\nrisks\n3.1 Occupational Safety and\nHealth (OSH)\nprocedures for\ncontrolling hazards/risks\nin workplace are\nconsistently followed\n3.2 Procedures for dealing\nwith workplace\naccidents, fire and\nemergencies are\nfollowed in accordance\nwith organization OSH\npolicies\n3.3 Personal protective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OSH\nprocedures and\npractices\n3.4 Appropriate assistance\nis provided in the event\nof a workplace\nemergency in\naccordance with\nestablished organization\nprotocol\n3.1 Ways of following\nOccupational Safety\nand Health (OSH)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace\n3.2 Ways of following\nprocedures for dealing\nwith workplace\naccidents, fire and\nemergencies\n3.3 Types and use of\npersonal protective\nequipment (PPE)\n3.4 OSH procedures and\npractices and\nregulations\n3.5 Methods and\ntechniques in providing\nappropriate assistance\nin the event of a\nworkplace emergency\n3.6 Hazards/risks\nidentification and\ncontrol\n3.1 Following\noccupational\nhealth and safety\n(OSH)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace\n3.2 Following\nprocedures for\ndealing with\nworkplace\naccidents, fire\nand emergencies\n3.3 Using correctly\npersonal\nprotective\nequipment (PPE)\n3.4 Providing\nassistance in the\nevent of a\nworkplace\nemergency in\naccordance with\nestablished\norganization\nprotocol\n4. Maintain\nOSH\nawareness\n4.1 Emergency-related\ndrills and trainings are\nparticipated in as per\nestablished organization\nguidelines and\nprocedures\n4.2 OSH personal records\nare completed and\nupdated in accordance\nwith workplace\nrequirements\n\n4.1 Participation\nprocedures in\nemergency-related\ndrills and trainings\n4.2 Ways of completing\nand updating OSH\npersonal records\n4.3 OSH procedures and\npractices and\nregulations\n4.4 OSH indicators\n4.1 Participating in\nemergency-\nrelated drills and\ntrainings\n4.2 Completing and\nupdating OSH\npersonal records\n\n--- PDF PAGE 19 ---\n_____________________________________________________________________________________ 15\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2 Biological hazards - bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n• 