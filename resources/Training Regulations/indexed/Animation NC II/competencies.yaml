        "source_title": "PARTICIPATE IN WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\n_____________________________________________________________________________________          2 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nSECTION 2   COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units \nof competency required in ANIMATION NC II. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE                      : \n500311105 \nUNIT DESCRIPTOR         : \nThis unit covers the knowledge, skills and attitudes   required \nto gather, interpret and convey information in response to \nworkplace requirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Obtain and \nconvey \nworkplace \ninformation \n1.1. Specific and relevant \ninformation is accessed from \nappropriate sources \n1.2. Effective questioning, active \nlistening and speaking skills \nare used to gather and \nconvey information \n1.3. Appropriate medium is used \nto transfer information and \nideas \n1.4. Appropriate non- verbal \ncommunication is used \n1.5. Appropriate lines of \ncommunication with \nsupervisors and colleagues \nare identified and followed \n1.6. Defined workplace \nprocedures for the location \nand storage of information \nare used \n1.7. Personal interaction is \ncarried out clearly and \nconcisely\n1.1. Procedure of \ngathering workplace \ninformation \n1.2. Techniques in \ngathering information \n1.3. Effective methods of \nconveying information \n1.4. Written \ncommunication \nmethods \n1.5. Techniques in \nconveying \ncommunication \n1.6. Different modes of \ncommunication \n1.7. Organizational policies \n1.8. Communication \nprocedures and \nsystems \n1.9. Technology relevant to \nthe enterprise and the \nindividual’s work \nresponsibilities \n1.1. Gathering of \nworkplace \ninformation skills \n1.2. Sourcing of \ninformation skills \n1.3. Sorting of \ninformation skills \n1.4. Obtaining \nworkplace \ninformation skills \n1.5. Conveying \nworkplace \ninformation skills \n1.6. Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements \n2. Participate in \nworkplace \nmeetings and \ndiscussions \n2.1. Team meetings are attended \non time \n2.2. Own opinions are clearly \nexpressed and those of \nothers are listened to without \ninterruption \n2.3. Meeting inputs are \nconsistent with the meeting \npurpose and established \nprotocols \n2.4. Workplace interactions are \nconducted in a courteous \nmanner \n2.5. Questions about simple \n2.1 Effective \ncommunication \n2.2 Different modes of \ncommunication \n2.3 Written communication \n2.4 Organizational policies \n2.5 Communication \nprocedures and \nsystems \n2.6 Decorum in \nparticipating workplace \nmeetings and \ndiscussions \n2.1 Participating skills \nin workplace \nmeetings and \ndiscussions \n2.2 Following simple \nspoken language \n2.3 Completing work \nrelated \ndocuments \n2.4 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures\n\n--- PDF PAGE 7 ---\n_____________________________________________________________________________________          3 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nroutine workplace \nprocedures and matters \nconcerning working \nconditions of employment \nare asked and responded to \n2.6. Meetings outcomes are \ninterpreted and implemented \n2.5 Relating to people \nof social range in \nthe workplace \n2.6 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements \n3. Complete \nrelevant work \nrelated \ndocuments \n3.1. Range of forms relating to \nconditions of employment \nare completed accurately \nand legibly \n3.2. Workplace data is recorded \non standard workplace \nforms and documents \n3.3. Basic mathematical \nprocesses are used for \nroutine calculations \n3.4. Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon \n3.5. Reporting requirements to \nsupervisor are completed \naccording to organizational \nguidelines \n3.1 Methods of \nmaking/completing \nwork related \ndocuments \n3.2 Company standards \nand procedures in \nmaking work related \ndocuments \n3.3 Effective \ncommunication \n3.4 Different modes of \ncommunication \n3.5 Written \ncommunication \n3.6 Organizational \npolicies \n3.7 Communication \nprocedures and \nsystems \n3.8 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n3.1 Documenting \nskills \n3.2 Report writing \nskills \n3.3 Making/developin\ng work related \ndocuments \n3.4 Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n3.5 Completing work \nrelated \ndocuments \n3.6 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n3.7 Ability to relate to \npeople of social \nrange in the \nworkplace\n\n--- PDF PAGE 8 ---\n_____________________________________________________________________________________          4 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal instructions \n2.6. \nFace to face communication \n3. Storage \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Forms \n4.1. \nPersonnel forms  \n4.2. \nTelephone message forms \n4.3. \nSafety reports \n5. Workplace \ninteractions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two-way radio \n5.4. \nWritten including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs \nand diagrams \n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions\n\n--- PDF PAGE 9 ---\n_____________________________________________________________________________________          5 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard \nformat of the organization \n1.2. Accessed information using communication \nequipment \n1.3. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4. Conveyed information effectively adopting the formal \nor informal communication \n2. Resource Implications The following resources should be provided: \n2.1. Fax machine \n2.2. Telephone \n2.3. Writing materials \n2.4. Internet \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Direct Observation \n3.2. Oral interview and written test \n4. Context for \nAssessment \n4.1. Competency may be assessed individually in the \nactual workplace or through accredited institution\n",
