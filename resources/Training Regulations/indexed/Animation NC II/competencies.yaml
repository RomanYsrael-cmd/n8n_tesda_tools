        "source_text": "--- PDF PAGE 13 ---\n_____________________________________________________________________________________          9 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nUNIT OF COMPETENCY : \nPRACTICE CAREER PROFESSIONALISM \nUNIT CODE                      : \n500311107 \nUNIT DESCRIPTOR         : \nThis unit covers the knowledge, skills and attitudes in promoting \ncareer growth and advancement. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Integrate \npersonal \nobjectives with \norganizational \ngoals \n1.1. Personal growth and work \nplans are pursued towards \nimproving the qualifications \nset for the profession \n1.2. Intra- and interpersonal \nrelationships are maintained \nin the course of managing \noneself based on \nperformance evaluation \n1.3. Commitment to the \norganization and its goal is \ndemonstrated in the \nperformance of duties \n1.1. Work values and \nethics (Code of \nConduct, Code of \nEthics, etc.) \n1.2. Company policies \n1.3. Company operations, \nprocedures and \nstandards \n1.4. Company \nmission/vision \nstatements \n1.5. Ways of integrating \npersonal objectives \nwith organizational \ngoals \n1.1.  Integrating skills \nof personal \nobjectives with \norganizational \ngoals \n1.2. Pursuing \npersonal growth \nand work plans \n1.3. Demonstrating \ncommitment to \nthe organization \nand its goals \n1.4. Intra and \nInterpersonal \nskills \n2. Set and meet \nwork priorities \n2.1. Competing demands are \nprioritized to achieve \npersonal, team and \norganizational goals and \nobjectives. \n2.2. Resources are utilized \nefficiently and effectively to \nmanage work priorities and \ncommitments \n2.3. Practices along economic \nuse and maintenance of \nequipment and facilities are \nfollowed  as per established \nprocedures \n2.1. Company policies \nprocedures and \nstandards \n2.2. Company and \ndepartmental goals \nand priorities \n2.3. Managing priorities \nand commitments \n2.4. Economic use and \nmaintenance of \nequipment and \nfacilities \n2.5. Ways and means of \npracticing economic \nuse and maintenance \nof equipment and \nfacilities \n2.1. Setting skills of \nwork priorities \n2.2. Meeting with \nwork priorities \n2.3. Intra and \nInterpersonal \nskills \n2.4. Communication \nskills\n\n--- PDF PAGE 14 ---\n_____________________________________________________________________________________          10 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Maintain \nprofessional \ngrowth and \ndevelopment \n3.1. Trainings and career \nopportunities are identified \nand availed of based on job \nrequirements \n3.2. Recognitions are \nsought/received and \ndemonstrated as proof of \ncareer advancement \n3.3. Licenses and/or \ncertifications relevant to \njob and career are obtained \nand renewed \n \n3.1. Ways of identifying \ntrainings and career \nopportunities \n3.2. Techniques of seeking \nand receiving \nrecognitions \n3.3. Procedures of \nobtaining licenses \nand/or certifications \nrelevant to the job \n \n \n3.1. Identifying \ntrainings and \ncareer \nopportunities \n3.2. Seeking \nrecognitions are \nsought/received \nand \ndemonstrated as \nproof of career \nadvancement \n3.3. Obtaining and \nrenewing \nLicenses and/or \ncertifications \nrelevant to job \nand career\n\n--- PDF PAGE 15 ---\n_____________________________________________________________________________________          11 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1 Performance Appraisal \n1.2 Psychological Profile \n1.3 Aptitude Tests \n2.  Resources \n2.1 \nHuman \n2.2  Financial \n2.3  Technology \n2.3.1 Hardware \n2.3.2 Software \n3.  Trainings and career \nopportunities \n3.1  Participation in training programs \n      3.1.1 Technical \n      3.1.2 Supervisory \n      3.1.3 Managerial \n      3.1.4 Continuing Education \n3.2   Serving as Resource Persons in conferences and \nworkshops \n4.  Recognitions \n4.1  Recommendations \n4.2  Citations \n4.3  Certificate of Appreciations \n \nCommendations \n4.6 \nAwards \n4.7 \nTangible and Intangible Rewards \n5.  Licenses and/or \ncertifications \n5.1 \nNational Certificates \n5.2 \nCertificate of Competency \n5.3 \nSupport Level Licenses \n5.4 \nProfessional Licenses\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________________          12 \nTR - ANIMATION NC II      (Version 02)                                      Amended   February 27, 2018 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in \nthe course of managing oneself based on \nperformance evaluation \n1.3 \nCompleted trainings and career opportunities \nwhich are based on the requirements of the \nindustries \n1.4 \nAcquired and maintained licenses and/or \ncertifications according to the requirement of the \nqualification \n2.  Resource Implications \nThe following resources should be provided: \n2.1  Workplace or assessment location \n2.2  Case studies/scenarios \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nPortfolio Assessment \n3.2 \nInterview \n3.3 \nSimulation/Role-plays \n3.4 \nObservation \n3.5 \nThird Party Reports \n3.6 \nExams and Tests \n4.  Context for \nAssessment \n4.1 Competency may be assessed in the work place or \nin a simulated work place setting\n",
