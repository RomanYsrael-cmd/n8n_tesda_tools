        "source_text": "ICT 216301\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ndraw, analyze and produce traditional clean up key drawings\nfor animation to ensure integrity of movement and character\nmodel is maintained.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nrequirements\nfor traditional\ncleaned-up\ndrawings\n1.1 Traditional animation\nequipment & materials are\nidentified and prepared\naccording to the task\nundertaken.\n1.2 Traditional Clean up Key\nDrawing requirements are\nidentified from the given\nsource material.\n1.3 Appropriate model sheets\nare gathered for reference\nin the given scene folder\n1.4 Incomplete materials and\nfaulty equipment are\nreported to appropriate\npersonnel\n\n1.1 Verbal\nCommunication\n1.2 Written\nCommunication\n1.3 Physical Science (all\nenvironments)\n1.4 Mechanical science\n1.5 Basic principles of\nanimation\n1.6 Traditional animation\nequipment &\nmaterials\n1.7 Traditional Clean up\nKey Drawing\nrequirements\n1.1 Drawing skills\nfor both living\nand non-living.\n1.2 Analytical and\ncomprehension\nskills\n1.3 Skills in reading\nand analyzing\nstoryboard\n1.4 Effective\nCommunication\nskills\n1.5 Presentation\nskills\n2. Prepare\nTraditional\nRough Key\nDrawings\n2.1 Rough key animation\ndrawings in a scene folder\nare counted and checked if\ncomplete and written on the\nprovided exposure sheet.\n2.2 Rough breakdowns are\nchecked if provided by the\nanimator\n2.3 Timing grid is checked if\nwritten legibly and\ncorresponding to the\ndrawings indicated in the\nexposure sheet\n2.4 Special instructions from\nAnimator or animation\ndirector are checked and\nread if written on the Timing\ngrid or in the exposure\nsheet\n2.5 Traditional cleaned-up\nline quality stroke\nrequirement for the final\ndrawing is checked against\nthe approved model sheets.\n2.1 Verbal\nCommunication\n2.2 Written\nCommunication\n2.3 Physical Science (all\nenvironments)\n2.4 Human anatomy\n2.5 Mechanical science\n2.6 Basic principles of\nanimation\n2.7 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover and\nenvironmental\nconcerns\n2.8 Exposure sheet\n2.9 Timing grid\n2.10 Rough key animation\ndrawings\n2.11 Knowledge on\nexposure sheets\n2.12 Rough breakdowns\n2.13 Cleaned-up line\nquality stroke\nrequirement\n\n2.1 Drawing skills\nfor both living\nand non-living.\n2.2 Analytical and\ncomprehension\nskills\n2.3 Skills in reading\nand analyzing\ntiming grids and\nexposure sheet\n2.4 Effective\nCommunication\nskills\n2.5 Presentation\nskills\n2.6 Practicing\nOSHS, EHSM,\n3Rs and 5S\n3. Produce\nTraditional\ncleaned-up\nkey\n3.1 All rough key drawings\nare arranged properly and\nflipped by hand to see and\nanalyze the animation\n3.1 Verbal\nCommunication\n3.2 Written\nCommunication\n3.1 Clean-up\nDrawing Skills\n3.2 Analytical and\ncomprehension\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________________ 35\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndrawings\nmovements\n3.2 Rough Key drawings poses\nand rough expressions are\nanalyzed and understood\nas indicated in the\nstoryboard and the\nexposure sheet.\n3.3 All rough key drawings\npose that are off-model are\nredrawn using the correct\nmodel sheet construction &\nproportion.\n3.4 Rough body Attitude and\nfacial expressions are\nmaintained and captured\nduring the redrawing and\nmodeling process.\n3.5 Rough breakdowns are\nanalyzed, redrawn and put\non model based on\nanimation flow.\n3.6 Line quality stroke is\napplied to all redrawn\nrough key animation poses\nand breakdowns.\n3.7 Key drawing &\nbreakdown labels,\nanimator instructions,\nproduction information,\ntiming grid are copied\ncarefully from the original\nrough key drawings and\nwritten clearly on the clean\nanimation paper in the\nappropriate position.\n3.8 All final traditional cleaned-\nup key drawings and\nbreakdowns are organized\nand bundled neatly\ntogether inside a folder.\n3.9 Old rough key drawings\nand rough breakdowns are\nalso organized, bundled\nand returned neatly\ntogether inside scene\nfolder.\n3.10 Scene folder contents are\ndouble checked, signed\nand submitted to\nappropriate personnel.\n3.3 Physical Science (all\nenvironments)\n3.4 Mechanical science\n3.5 Basic principles of\nanimation\n3.6 Human anatomy\n3.7 Cross platform data\ntransfer\n3.8 Rough Key\ndrawings poses and\nrough expressions\n3.9 Body Attitude and\nfacial expressions\n3.10 Rough breakdowns\n3.11 Key drawing &\nbreakdown labels\n3.12 animator\ninstructions\n3.13 production\ninformation\n3.14 timing grid\n3.15 Cleaned-up Key\ndrawings and\nbreakdowns\n3.16 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover\nand environmental\nconcerns\n3.17 Geometry for Basic\nShapes\nskills\n3.3 Skills in\nreading and\nanalyzing\ntiming grids\nand\nbreakdowns\n3.4 Effective\nCommunicatio\nn skills\n3.5 Computer\noperation skills\n3.6 Presentation\nskills\n3.7 Practicing\nOSHS, EHSM,\n3Rs and 5S\n4. Edit / Revise\ncleaned-up\nKey\nDrawings\n4.1 Scene folder with revision\ncalls are read and\nunderstood based on the\ninstructions written by a\n4.1 Verbal\nCommunication\n4.2 Written\nCommunication\n4.1 Clean-up\nDrawing Skills\n4.2 Analytical and\ncomprehension\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________________ 36\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nsupervisor.\n4.2 All affected cleaned-up key\ndrawings & breakdowns are\nredrawn based on the\nscope of the revision calls.\n4.3 Revised scene folder\ncontents are doubled\nchecked and signed off as\ndone after all corrections\nare made.\n4.4 Revised scene folder is\nsubmitted to appropriate\npersonnel.\n4.3 Physical Science (all\nenvironments)\n4.4 Mechanical science\n4.5 Basic principles of\nanimation\n4.6 Cross platform data\ntransfer\n4.7 Rough Key drawings\nposes and rough\nexpressions\n4.8 Body Attitude and\nfacial expressions\n4.9 Rough breakdowns\n4.10 Key drawing &\nbreakdown labels\n4.11 animator instructions\n4.12 production\ninformation\n4.13 timing grid\n4.14 Cleaned-up Key\ndrawings and\nbreakdowns\n4.15 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover\nand environmental\nconcerns\nskills\n4.3 Skills in reading\nand analyzing\ntiming grids and\nbreakdowns\n4.4 Effective\nCommunication\nskills\n4.5 Computer\noperation skills\n4.6 Presentation\nskills\n4.7 Practicing\nOSHS, EHSM,\n3Rs and 5S\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________________ 37\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Traditional\nanimation\nequipment and\nmaterials\nMay include:\n1.1 Animation table\n1.2 Lightbox\n1.3 Animation disc\n1.4 Manual/ electric\nsharpener\n1.5 Desk lamp\n1.6 Chair\n1.7 Animation paper\n1.8 Peg bar\n\n1.9\nRuler\n1.10 Bull clip\n1.11 Magic tape\n1.12 Light colored pencils\n1.13 Lead pencils\n1.14 Rubber/ kneaded eraser\n1.15 Reinforcement peg hole\nstickers\n\n2. Source material\nMay include:\n2.1\nStoryboard\n2.2\nLay-out drawings\n2.3\nDirector’s instructions\n2.4\nModel sheets\n2.5\nExposure sheets\n2.6\nKey animation drawings\n2.7\nAnimation folder / envelope\n3. Scene folder\nMay include:\n3.1\nStoryboard\n3.2\nLay-out\n3.3\nBackground Layout/ Rough Background\n3.4\nExposure sheets\n3.5\nKey animation drawings\n3.6\nModel sheets\n3.7\nSpecial Instructions\n4. Model sheets\nMay include:\n4.1\nCharacter turn around\n4.2\nProps turn around\n4.3\nbackground angles\n4.4\nmouth/ lip-sync chart\n4.5\nPoses / Attitude\n4.6\nExpressions\n\n4.7\nSpecial effects\n4.8\nConstruction\ninstructions\n4.9\nsize comparison\n4.10 Main characters\n4.11 incidental characters\n5. Appropriate\npersonnel\nMay include:\n5.1\nProduction assistant\n5.2\nProduction manager\n5.3\nDept. head\n5.4\nAnimation Director\n5.5\nSupervisor (* this can also be the Trainer)\n6. Rough key\nanimation\ndrawings\nMain rough drawing poses drawn only by animators and is\ndistinguished on paper by:\n6.1\nNumbers & letters that are encircled\n6.2\nTiming grid\n6.3\nSpecial animation Instructions\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________________ 38\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nVARIABLE\nRANGE\n7. Exposure sheet\nA chart containing the following:\n7.1\nDirectors notes and instructions\n7.2\nNumber of drawings\n7.3\ncamera instructions\n7.4\ndialogue track and mouth lip-sync\n7.5\nlength of scene\n7.6\nProduction information\n8. Rough\nBreakdowns\n A special drawing provided only by animators to indicate:\n8.1\na different path of action or movement\n8.2\na special timing or spacing\n9. Timing grid\nMay include:\n9.1\nslow in timing grid\n9.2\nslow out timing grid\n9.3\nequal timing grid\n9.4\nspecial timing grid\n10. Special\nInstructions\nMay include:\n10.1 separation parts\n10.2 mouth / lip-sync\n10.3 breakdown\n10.4 cycles in timing\n10.5 shadow/ high light indications\n10.6 shading instructions\n10.7 eye blinks / eye movement\n10.8 head turn\n11. Traditional\ncleaned-up line\nquality stroke\nrequirements\nMay include:\n11.1 Thin lines\n11.2 Thick lines\n11.3 Thin & thick lines combined\n11.4 Wriggly lines\n11.5 Broken / stylized lines\n12. Rough Key\ndrawings\nMay include:\n12.1 Action poses\n12.2 Expressions\n12.3 Gestures\n13. Key drawing &\nBreakdown\nlabels\nMay include:\n13.1 Encircled letters with numbers\n13.2 Triangle shaped symbol with letters &numbers\n13.3 Abbreviation ( eg : B/D) with letter & numbers\n14. Animator\ninstructions\nMay include:\n14.1 eye blink/ eye ball direction\n14.2 separation of parts\n14.3 Registration mark\n14.4 mouth chart / lip-sync\n14.5 cycle instructions\n14.6 wave flow instructions\n14.7 arrows & direction of action\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________________ 39\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nVARIABLE\nRANGE\n14.8 highlight / shadows\n15. Production\ninformation\nMay include:\n15.1 production episode\n15.2 production title\n15.3 scene number\n15.4 registration instructions\n16. Linetest software May include one of the following:\n16.1 CTP pro\n16.2 Retas Pro\n16.3 Flipbook\n16.4 Flash\n16.5 Toonboom\n16.6 After effects\n\n17. Appropriate\nposition (of\ndrawing labels)\nMay include:\n17.1 Bottom portion near or beside the peg holes\n17.2 upper portion on top of paper\n17.3 lower right or left corner of the paper\n17.4 upper right or left corner of paper\n18. Revision calls\nMay include:\n18.1 Off model key drawings\n18.2 Poor cleaned-up line quality\n18.3 Wrong labels\n18.4 Dirty and crumpled animation paper\n18.5 Disorganized submission of scene folder\n18.6 Missing final cleaned-up Key drawing\n18.7 Missing rough key drawings\n18.8 Missing details\n18.9 Missing Drawings\n18.10 Missing exposure sheet\n18.11 Wrong labels on exposure sheet\n18.12 Wrong mouth chart / lip-sync used\n18.13 Timing grid copied wrong\n18.14 Wrong counting of drawing contents\n18.15 Wrong eye direction\n18.16 Wrong costume, props\n18.17 Wrong light direction/shadows/tones/highlights/mark up\n19. Revised scene\nfolder\nMay include:\n19.1 Revision call instructions\n19.2 Revised Cleaned-up Key Drawings\n19.3 Original Rough key drawings\n19.4 Original Cleaned-up Key drawings\n19.5 Exposure sheet\n19.6 Layout\n19.7 Storyboard\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________ 40\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment must show that the candidate:\n\n1.1 Identified and prepared all Traditional clean up\ndrawing requirements including Model sheets,\nequipment and materials\n1.2 Prepared all Traditional rough key in accordance\nwith the instructions contained on the scene\nfolders\n1.3 Produced on-model traditional cleaned-up key\ndrawings following all the constraints of production\n1.4 Edited the necessary revision to obtain quality\nstandard of the Cleaned-up drawings in\ncompliance with relevant personnel\n2. Method of Assessment\nCompetency must be assessed through:\n4.1 Demonstration with oral questioning\n4.2\nInterview\n3. Resource Implication\n3.1 Appropriate supplies and materials\n3.2 Applicable equipment\n4. Context of Assessment\n4.1 Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________ 41\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nUNIT TITLE :\nPRODUCE TRADITIONAL IN-BETWEEN DRAWINGS\nUNIT CODE :"
