        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified all digital clean-up requirements\nincluding source materials, file folders, appropriate\n2D animation software, materials and equipment.\n1.2 Produced on-model digital cleaned-up key\ndrawings using appropriate tools and features of\nthe selected software to meet the constraints of the\nproduction\n1.3 Edited the necessary revision to obtain quality\nstandard of the clean-up drawing in compliance\nwith relevant personnel\n2. Method of Assessment Competency in this unit may be assessed through:\n4.3 Demonstration with oral questioning\n4.4\nInterview\n3. Resource Implication\nThe following resources should be provided:\n3.1 Appropriate supplies and materials\n3.2 Applicable equipment\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 61 ---\n_____________________________________________________________________________________ 57\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nUNIT TITLE\n : PRODUCE DIGITAL IN-BETWEEN DRAWINGS\nUNIT CODE :"
        },
        "source_text": "ICT216303\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ndraw, analyze, and produce digital cleaned-up key drawings for\nanimation to ensure integrity of movement and character model is\nmaintained.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nrequirements\nfor digital\ncleaned-up\ndrawings\n1.1 Digital animation\nequipment & materials\nare identified and prepared\naccording to the task\nundertaken.\n1.2 Digital clean-up drawing\nrequirements are identified\nfrom the given source\nmaterial.\n1.3 Appropriate digital copies\nof model sheets are\ngathered for reference in\nthe given file folder.\n1.4 Range of industry standard\n2D animation software\nincluding computer-\nassisted techniques are\nidentified for suitability\n1.5 Software selected is in\naccordance with the\nspecified delivery\nplatform.\n1.6 Incomplete materials and\nfaulty equipment are\nreported to appropriate\npersonnel.\n1.1 Verbal\nCommunication\n1.2 Written\nCommunication\n1.3 Intellectual Property\nrights and concerns\n1.4 OHS processes and\nprocedure for\nComputer Hardware\n1.5 Computer hardware\nrequirements for\nvideo playback\n1.6 Digital animation\nequipment &\nmaterials\n1.7 Digital Clean-up\nDrawing\nrequirements\n1.8 Model sheets\n1.9 2D animation\nsoftware\n1.10 Cross platform /\ndelivery platform\n1.1 Effective\nCommunication\nskills\n1.2 Computer\noperation skills\n1.3 Drawing skills\n1.4 Reporting skills\n\n2. Produce\ndigital\ncleaned-up\nkey drawings\n2.1 User interface and basic\ntools of selected 2D\nanimation software is\nutilized based on the\nclient’s specific technical\nrequirements.\n2.2 Scanned hard copy or soft\ncopy of digital rough\nanimation key drawings\nare provided in file folder\nper scene number.\n2.3 Digital rough\nbreakdowns are checked\nif provided and indicated\non timeline or exposure\nsheet\n2.4 Digital model sheets and\nspecial file instructions\nare gathered and uploaded\nfor reference use on the\nspecified task undertaken.\n2.5 Digital rough key drawings\n2.1 Verbal\nCommunication\n2.2 Written\nCommunication\n2.3 OHS Standards and\n5S’s principles\n2.4 Intellectual Property\nRights and concerns\n2.5 Knowledge in\ncomputer operations\nand applications\n2.6 OHS processes and\nprocedures for\ncomputer hardware\n2.7 timeline or exposure\nsheet\n2.8 User interface and\ntools of 2D\nanimation software\n2.9 Rough animation\nkey drawings\n2.10 Digital rough\n2.1 Digital clean-up\ndrawing Skills\n2.2 Analytical and\ncomprehension\nskills\n2.3 Skills in reading\nand analyzing\ntiming grids\nand exposure\nsheet\n2.4 Skills in\nanalyzing\nanimation\nbreakdowns\n2.5 Computer\noperating skills\n2.6 Effective\nCommunication\nskills\n2.7 Presentation\nskills\n2.8 Practicing\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________________ 50\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n& breakdowns provided\nare played back to view\nand analyze the fluidity of\nanimation movements and\nconsistency in drawings\n2.6 New column or layer is\nadded to the to the\ntimeline or exposure sheet\nin preparation for the layer\nof the digital cleaned-up\nkey drawings\n2.7 All off-model drawings\nare re-drawn based on\ndigital model sheets\nprovided and put on-\nmodel and placed also in\nits own layer\n2.8 Required digital line size\n& stroke is applied to all\ndigital cleaned-up key\ndrawings.\n2.9 Digital key drawing &\ndigital breakdown labels,\nproduction information,\ntiming grids are copied\ncarefully from the original\nrough key drawings and\nwritten clearly at an\nappropriate position on\nthe workspace\n2.10 All finished Digital drawing\nsequences are exported to\nvideo format and saved at\nscene file folder.\n2.11 Scene File folder\ncontents are double\nchecked and submitted to\nappropriate personnel\nbreakdowns\n2.11 Digital model\nsheets\n2.12 special file\ninstructions\n2.13 layering of drawing\nelements\n2.14 digital line size &\nstroke\n2.15 Digital Key drawing\n& Digital\nBreakdown labels\n2.16 production\ninformation\n2.17 Timing grids\n2.18 Cross platform data\ntransfer\n2.19 Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover\nand environmental\nconcerns\n2.20 Geometry for Basic\nShapes\n\nOSHS, EHSM,\n3Rs and 5S\n3. Edit / Revise\ndigital\ncleaned-up\nkey drawings\n3.1. Returned file folder with\nrevision calls are read\nand analyzed based on the\ninstructions written.\n3.2. All affected digital cleaned-\nup drawings & breakdowns\nare redrawn accordingly\nbased on the scope of the\nrevision calls\n3.3. All revised digital drawings\nare labeled appropriately\nto distinguish that it is the\nlatest revised version.\n3.4. Final Revised Digital\ncleaned-up drawings and\nbreakdowns are exported\nto video format to check\n3.1. Verbal\nCommunication\n3.2. Written\nCommunication\n3.3. OHS Standards and\n5S’s principles\n3.4. Intellectual Property\nRights and concerns\n3.5. Knowledge in\ncomputer operations\nand applications\n3.6. OHS processes and\nprocedures for\nComputer Hardware\n3.7. User interface and\ntools of 2D\nanimation software\n3.1. Clean-up and\nIn-between\nDrawing Skills\n3.2. Analytical and\ncomprehension\nskills\n3.3. Skills in reading\nand analyzing\ntiming grids and\nexposure sheet\n3.4. Skills in\nanalyzing\nanimation\nbreakdowns\n3.5. Computer\noperating skills\n3.6. Effective\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________________________ 51\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nthe consistency of revised\ndrawings\n3.5. Revised scene File folder\ncontents are double-\nchecked and then saved in\na different folder label as a\nrevised work version.\n3.6. Revised scene file folder\nis submitted to\nappropriate personnel.\n3.8. Rough Animation\nKey Drawings\n3.9. Digital Rough\nBreakdowns\n3.10. Digital model\nsheets\n3.11. special file\ninstructions\n3.12. layering of drawing\nelements\n3.13. digital Line size &\nstroke\n3.14. Digital Key drawing\n& Digital\nBreakdown labels\n3.15. production\ninformation\n3.16. Timing grids\n3.17. Cross platform data\ntransfer\n3.18. Cross platform data\ntransfer\n3.19. Practicing 3Rs –\nReduce, Re-use,\nRecycle/Recover\nand environmental\nconcerns\n3.20. Geometry for Basic\nShapes\nCommunication\nskills\n3.7. Presentation\nskills\n3.8. Practicing\nOSHS, EHSM,\n3Rs and 5S\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________ 52\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Digital Animation\nEquipment & materials\nMay include:\n1.1 Chair\n1.2 Table\n1.3 computer\n1.4 computer peripherals\n1.5 pen tablet\n1.6 2D animation software\n1.7 USB\n1.8 external hard drive\n1.9 keyboard\n1.10 mouse\n2. Source materials\nMay include Digital copies of:\n2.1 Storyboard\n2.2 Lay-out drawings\n2.3 Director’s instructions\n2.4 Model sheets\n2.5 Exposure sheets\n2.6 Key animation drawings\n2.7 file folder\n3. Model sheets\nMay include\n3.1 Character turn around\n3.2 Props turn around\n3.3 background angles\n3.4 mouth/ lip-sync chart\n3.5 Poses / Attitude\n3.6 Expressions\n3.7 Special effects\n3.8 Construction instructions\n3.9 size comparison\n3.10 Main characters\n3.11 incidental characters\n4. File folder\nFile folders, also called directories may include files of:\n4.1\nStoryboard\n4.2\nLay-out\n4.3\nExposure sheets\n4.4\nKey animation drawings\n4.5\nAnimation scene file\n4.6\nModel sheets\n4.7\nExported video file\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________________ 53\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nVARIABLE\nRANGE\n5. 2D animation software\nMay include one of the\nfollowing:\n5.1 CTP Pro\n5.2 Retas Pro\n5.3 Flipbook\n5.4 Flash\n5.5\nToonboom\n5.6 After Effects\n5.7 Open Toonz\n5.8 Paintool Sai\n5.9 Krita\n5.10 Clip Studio\n5.11 TV Paint\n6. Delivery Platform\nDelivery platform may include:\n6.1\nWorldwide web\n6.2\nCD-ROM\n6.3\nDVD\n6.4\nFilm\n6.5\nVideo format\n6.6\nBroadcast format\n6.7\nVideo game format\n7. Appropriate personnel\n7.1 Production assistant\n7.2 Production manager\n7.3 Department head\n7.4 Animation Director\n7.5\nSupervisor ( * this can also be the Trainer )\n8. Digital Rough key\nanimation drawings\nMay include digitally produced rough drawings of:\n8.1 Characters\n8.2 Animals\n8.3 props\n8.4 objects\n8.5\nbackgrounds\n9. Digital rough breakdowns Digital rough breakdowns may include:\n9.1 a drawing with a different path of action\n9.2 a drawing with a wave or flow action\n9.3 a drawing that favors its spacing to one key\ndrawing\n10. Exposure sheet\nA vertical chart with columns containing the following:\n10.1 Directors notes and instructions\n10.2 Number of drawings\n10.3 Camera instructions\n10.4 Dialogue track and mouth lip-sync\n10.5 Length of scene\n10.6 Slugging\n10.7\nProduction information\n11. Timeline\nA horizontal chart containing layers similar to the\nexposure sheet that may contain the following:\n11.1\nDirectors notes and instructions\n11.2\nFrame Numbers\n11.3\nNumber of drawings\n11.4\ncamera instructions\n11.5\ndialogue track and lip sync\n11.6\nlength of scene\n11.7\nSlugging\n11.8\nProduction information\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________ 54\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nVARIABLE\nRANGE\n12. Special file\nInstructions\nMay include instructions on:\n12.1 separation parts\n12.2 mouth / lip-sync\n12.3 breakdown\n12.4 cycles in timing\n12.5 shadow/ high light\nindications\n12.6 drawing registration\ninstructions\n\n12.7 special effects\n12.8 shading\ninstructions\n12.9 eye blinks / eye\nmovement\n12.10 timing\nspecifications\n13. Off-model drawings\nA drawing that does not look or conform to the provided\nmodel sheet. May include:\n13.1 wrong proportion\n13.2 wrong details\n13.3 wrong expression\n13.4 wrong construction\n13.5\nwrong face features\n14. On-model\nShould include:\n14.1 proportion\n14.2 volume\n14.3 size\n14.4 facial features\n14.5 attitude and appeal\n14.6 arms and legs\n14.7 design and style specifications\n15. Digital line size and\nstroke\nMay include size and stroke for:\n15.1 Thin lines\n15.2 Thick lines\n15.3 Thin & thick lines combined\n15.4 Wriggly lines\n15.5 Broken / stylized lines\n16. Digital key drawings &\ndigital breakdown\nlabels\nMay include:\n16.1 Letter and number\n16.2 double letter and number\n16.3 Symbol and a number\n17. Production information May include:\n17.1 episode number\n17.2 production title\n17.3 Act number\n18. Appropriate personnel May include:\n21.1 Production Manager\n21.2 Production Assistant\n21.3 Animation director\n19. Video Format\nMay include following video file format:\n18.1 QuickTime file format (.mov)\n18.2 AVI (.avi)\n18.3 Flash video (FLV)\n18.4 MP4\n18.5 Matroska (.mkv)\n18.6 .vlc\n18.7 Windows media video .wmv\n18.8 Windows media player (WMP)\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________________ 55\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\n\nVARIABLE\nRANGE\n20. Revised scene file folder May include\n20.1 Revision call instructions\n20.2 Revised digital cleaned-up key drawings\n20.3 Original digital rough key drawings\n20.4 Original digital cleaned-up key drawings\n21. Revision calls\nMay include\n19.1 Off model digital key drawings\n19.2 Poor line quality\n19.3 Wrong labels\n19.4 Missing digital drawings\n19.5 Wrong lip-sync\n19.6 Wrong Action\n19.7 Wrong counting of drawing contents\n19.8 Wrong layering\n19.9 Wrong labels\n19.10 Missing details\n19.11 Missing exposure sheet\n19.12 Wrong mouth chart / lip-sync used\n19.13 Wrong eye direction\n19.14 Wrong costume, props\n19.15 Wrong light direction/shadows/tones/\nhighlights/mark up\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________ 56\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified all digital clean-up requirements\nincluding source materials, file folders, appropriate\n2D animation software, materials and equipment.\n1.2 Produced on-model digital cleaned-up key\ndrawings using appropriate tools and features of\nthe selected software to meet the constraints of the\nproduction\n1.3 Edited the necessary revision to obtain quality\nstandard of the clean-up drawing in compliance\nwith relevant personnel\n2. Method of Assessment Competency in this unit may be assessed through:\n4.3 Demonstration with oral questioning\n4.4\nInterview\n3. Resource Implication\nThe following resources should be provided:\n3.1 Appropriate supplies and materials\n3.2 Applicable equipment\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 61 ---\n_____________________________________________________________________________________ 57\nTR - ANIMATION NC II (Version 02) Amended February 27, 2018\nUNIT TITLE\n : PRODUCE DIGITAL IN-BETWEEN DRAWINGS\nUNIT CODE :"
