  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Telecom OSP and Subscriber Line\nInstallation (Copper Cable/POTS and DSL) NC II, the candidate must\ndemonstrate competency in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate II signed by the TESDA\nDirector General.\n\n4.2\nThe qualification of Telecom OSP and Subscriber Line Installation\n(Copper Cable/POTS and DSL) NC II may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in all the following\nareas:\n\n Telecom Outside Plant Line Installation (Copper cable)\n\nThis COC covers the following competency units:\no Install pole hardware, cable terminal, line wire and accessories\no Perform main cable installation\no Splice/Joint cable terminal to main aerial and/or underground\ncopper cable splicing\no Perform basic troubleshooting on cable faults and errors\n\n Subscriber Line/POTS and DSL Installation\n\nThis COC covers the following competency units:\no Install POTS Subscriber Line\no Install Digital Subscriber Line (DSL)\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs).\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1. Graduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.4.2. Experienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 53 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 51\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\n"
}
