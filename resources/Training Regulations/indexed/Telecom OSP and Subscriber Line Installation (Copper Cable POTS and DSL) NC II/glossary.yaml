  "source_text": "DEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a\nparticular area of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by\nthe individual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the\nindividual. It provides information on critical aspects of competency,\nunderpinning\nknowledge,\nunderpinning\nskills,\nresource\nimplications,\nassessment method and context of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 54 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 52\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve\nall the required units of competency for a national qualification defined under\nthe Training Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the\nwork is to be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an\nindividual’s skills, knowledge and attitudes gained from life and work\nexperiences outside registered training programs\n\n20) Required Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n21) Required Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and\nindustry specific skills\n\n22) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It\nincludes work environment and conditions, materials, tools and equipment\n\n23) Basic Competencies - are the skills and knowledge that everyone needs for\nwork\n\n24) Training Regulations (TR) – refers to the document promulgated and issued\nby TESDA consisting of competency standards, national qualifications and\ntraining guidelines for specific sectors/occupations. The TR serves as basis\nfor establishment of qualification and certification under the PTQF. It also\nserves as guide for development of competency-based curricula and\ninstructional materials including registration of TVET programs offered by\nTVET providers\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 55 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 53\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nSECTOR SPECIFIC\n\n1. Aerial Cable – suspended and attached on telephone pole for distribution porposes.\n\n2. Broadband - broadband refers to telecommunication in which a wide band of\nfrequencies is available to transmit information. Information can be multiplexed and\nsent on many different frequencies or channels within the band concurrently,\nallowing more information to be transmitted in a given amount of time.\n\n3. CBK – connecting block\n\n4. Communication Cable – is used for the distribution and small copper wires for\nvoice and data signals\n\n5. Component - That portion of a unit of equipment, which has been designed as a\ndiscrete unit and that can be identified as such.\n\n6. Connectorization – proper preparation of cable for installation of appropriate type of\nconnectors.\n\n7. Copper cable -- Electric power cables made from twisted pair copper wire.\n\n8. Drop cable – a small-diameter cable leading from the tap-off in the cable plant to\nthe subscribers’ TV receivers. A drop cable used by the CATV system should be\neither RG-59 or RG-6, 75-ohms coaxial cable (foam).\n\n9. DSL - stands for digital subscriber line. DSL is a way to connect to the internet. DSL\nis a high speed connection (256kb/s to 24mb/s down and about the same up\ndepending on DSL technology and equipment) that transfers data using the same\nwires as a regular telephone line.\n\n10. Environment - The area surrounding the work site which can be directly or indirectly\naffected by occurrences at the work site. It includes the atmosphere, soils, drains,\nunderground water tables, and the ecosystem. Protection of the environment would\nrequire the proper disposal of waste materials, restriction of burning off, the correct\nhandling of toxic substances, the containment of CFCs and the like.\n\n11. Established procedures - Formal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done.\n\n12. Flash testing – air pressure testing to prevent water/moisture entry\n\n13. Hazardous materials - Flammable gases and vapors and combustible dusts.\n\n14. Head-end – is the main site at which all the signals from the various program\nsources are received, assembled, processed and combined for transmission through\nthe distribution network. It is the originating point for all services carried on a cable\ntelevision system\n\n15. Line extender amplifier – extends further the feeder line from the trunk bridger.\n\n--- PDF PAGE 56 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 54\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\n16. Modifications - To make changes to the physical parameters or operational\nfunction of a device, component or piece of equipment or apparatus.\n\n17. Modem - is an electronic device that converts digital data into analog (modulated-\nwave) signals suitable for transmission over analog telecommunications circuits\n(e.g., traditional phone lines) and demodulates received analog signals to recover\nthe digital data transmitted. The \"modulator/demodulator\" thus makes it possible for\nexisting communications channels to support a variety of digital communications,\nincluding e-mail, Internet access, and fax transmissions.\n\n18. Notification (notified) - Can include verbal, written, electronic or recorded\ninformation at completion of work which may be required to be completed in\naccordance with established procedures.\n\n19. OH&S policies and procedures - Arrangements of an organization or enterprise to\nmeet their legal and ethical obligations of ensuring the workplace is safe and without\nrisk to health.\n\n20. Outside Plant (OSP) – is a part of Communication Network system that provides for\nthe distribution voice and data signals from the head-end to the paying subscribers.\n\n21. POTS- Plain Old Telephone Service\n\n22. Requirements - That to which equipment and procedures and their outcomes must\nconform and includes statutory obligations and regulations and standards called-up\nby legislation or regulations.\n\n23. Servicing - Undertaking routine inspection, repair and maintenance of circuits,\nsystems or apparatus. Maintaining, fault finding and repair of equipment, plant and\nmachinery.\n\n24. Splicing - the act or process of creating a physical connection between two\nseparate pieces of optical fiber. Optical fibers should only be spliced by a technician\nwho possesses the required skills and interconnection technology.\n\n25. Splitter – is a passive device used to divide the power equally into two path.\n\n26. Standards - Technical documents, which set out specifications and other criteria for\nequipment, materials, and methods to ensure them consistently, perform as\nintended.\n\n27. Subscriber – a person who pays a fee for cable services.\n\n28. Subscriber terminal – the cable television system terminal to which a subscriber’s\nequipment is connected.\n\n29. Supervised Industry Training – similar to on-the-job training – an approach in\ntraining designed to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n--- PDF PAGE 57 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 55\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\n30. System - A group or combination of inter-related, inter-dependent or interlocking\nelements forming a collective entity. Includes circuits, apparatus, equipment and the\nlike.\n\n31. Telecom – refers to Telecommunication. It is the process of transmitting information\nto a receiver by means of electric current or pulses of light.\n\n32. Termination - The act by means of which an electrical connection to an apparatus is\nestablished; specifically a prepared joint or connection between a cable, cord or\nconductor and a point in an electrical circuit such as a terminal or connection point.\nSuch terminations include soldering, crimping, clamping, wire wrapping, insulation\npiercing/compression.\n\n33. Testing devices - Devices and instruments used to ensure safety requirements and\noperational functions are met, and to diagnose faults in apparatus, circuits or\nsystems.\n\n34. Wiring systems - Permitted cables, enclosures, supports and accessories for\npower, measurement, control or communications purposes.\n\n--- PDF PAGE 58 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 56\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nANNEX A - ICT COMPETENCY MAP\n\nTELECOM OSP AND SUBSCRIBER LINE INSTALLATION (COPPER CABLE/POTS AND DSL) NC II\n\nBASIC COMPETENCIES\n\nReceive & Respond\nto Workplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice\noccupational health\n& safety procedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize information\nPlan and Organize\nWork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nUse Hand Tools\nPerform Mensuration\nand Calculation\nPrepare and Interpret\nTechnical Drawing\nApply Quality\nStandards\nOperate a Personal\nComputer\nTerminate & Connect\nElectrical Wiring and\nElectronic Circuits\nPerform Computer\nOperations\n\nCORE COMPETENCIES\n\nRender Service Excellence\nto Customers\nInstall Mast and Accessories\nInstall and Lay Out Cables\nInstall and Configure\nCPE\nInstall Pole Hardware and\nAccessories\nLay Out and Install Fiber-\nOptic/ Coaxial Cables\nInstall Active and Passive\nDevices and Accessories\nInstall Subscriber Drop\nLines and CPE\nInstall Cables and Devices\nfor MDU\nOperate CATV system\nImplement preventive\nmaintenance of CATV system\nPerform CATV system\ntroubleshooting and\nrepair\nCommission CATV system\nPerform CATV outside plant\nexpansion works\nInstall pole hardware, cable\nterminal, line wire and\naccessories\nPerform main cable\ninstallation\nSplice/Joint cable\nterminal to main aerial\nand/or underground\ncopper cable splice\nPerform basic\ntroubleshooting and\ncorrection of cable fault\nand error\nInstall POTS subscriber line\nInstall Digital\nSubscriber Line (DSL)\nInstall and Splice\nAerial/Underground Fiber\nOptic Cables\n Perform optical testing and\nrepair\n\n--- PDF PAGE 59 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 57\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011"
}
