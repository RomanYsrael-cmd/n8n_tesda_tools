  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Telecom Installation (Copper Cable and DSL) NC Level: NC II\n\nNominal Training Duration: 16 hrs – Basic Competencies\n\n 16 hrs – Common Competencies\n\n 448 hrs – Core Competencies\n 160 hrs in-school +\n\n288 hrs Supervised-Industry Training (SIT) in\n\n__________\n actual work environment\n\n 480 hrs. – Total training duration\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes\nof a Copper Cable Splicer/Jointer and Telephone and Broadband Installer, in\naccordance with industry standards. It covers the basic and common competencies in\naddition to the core competencies such as installing pole hardware, cable terminal,\nline wire and accessories; installing main copper cable; splicing/jointing cable terminal\nto main aerial/underground copper cable splices; performing basic troubleshooting on\ncable fault and errors; installing/connecting parallel wires; installing jacketed wire, CBK\nand telephone instrument; and installing digital subscriber lines.\n\nBASIC COMPETENCIES\n16 hrs\n\nUnit of\nCompetency\nLearning Outcome\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Participate in\nWorkplace\nCommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work-\nrelated document\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a Team\nEnvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam\n2.2 Describe work as a team\nmember\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 45 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 43\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\n3. Practice Career\nProfessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nOccupational\nHealth and\nSafety\nProcedures\n4.1 Identify hazards and risks.\n4.2 Evaluate hazards and\nrisks.\n4.3 Control hazards and risks.\n4.4 Maintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 46 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 44\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nCOMMON COMPETENCIES\n16 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Apply Quality\nStandards\n1.1 Asses quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n2. Operate a\nPersonal\nComputer\n2.1 Start and shutdown\ncomputer\n2.2 Work with files and folders\n2.3 Arrange and customize\ndesktop display\n2.4 Utilize OS bundled\napplication\n• Modular\n• Film showing\n• Computer\nbased training\n(e-learning)\n• Project method\n• On the job\ntraining\n\n• Demonstration &\nquestioning\n• Observation &\nquestioning\n• Third party\nreport\n• Assessment of\noutput product\n• Portfolio\n• Computer-\nbased\nassessment\n\n--- PDF PAGE 47 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 45\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nCORE COMPETENCIES\n480 hrs. (160 hrs in-school + 288 hrs. SIT*)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Install Pole\nHardware,\nCable Terminal,\nLine Wire and\nAccessories\n\n1.1\nPrepare for pole hardware, cable\nterminal and line wire installation\n1.2 Perform pole hardware, cable\nterminal, line wire and accessories\ninstallation\n Lecture\n Discussion\n Demonstration\n Hands on\npractice / SIT\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Written test\n2. Perform Main\nCable\nInstallation\n\n2.1 Prepare for copper cable jointing and\ninstallation\n2.2 Install main copper cable\n\n Lecture\n Discussion\n Demonstration\n Hands on\npractice / SIT\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Written test\n3. Splice/Joint\ncable terminal\nto main aerial\ncable and/or\nunderground\ncable splice\n\n3.1 Splice and join cable terminal and\nmain cable pairs for aerial copper\ncable works\n3.2 Splice and join straight and branch\ncable pairs for underground copper\ncable works\n3.3 Install Cable Closure\n3.4 Install Cable Support\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice/ SIT\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Written test\n4. Perform basic\ntroubleshooting\nand correction\nof cable faults\nand errors\n4.1 Prepare for cable fault and error\ntroubleshooting\n4.2 Test and correct cable faults and\nerrors\n4.3 Wrap up job\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice/ SIT\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Written test\n5. Install POTS\nsubscriber line\n5.1 Prepare distribution joint to customer\npremises installation\n5.2 Layout and install drop wire and\nhouse attachment\n5.3 Install telephone set and accessories\n5.4 Wrap up job\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice/ SIT\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Written test\n6. Install digital\nsubscriber lines\n(DSL)\n6.1 Prepare for DSL Modem Installation\n6.2 Perform Installation of DSL Modem\n6.3 Wrap up job\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n Hands on\npractice/ SIT\n Observation in\nworkplace\n Demonstration\n Oral\nquestioning\n Written test\n\n*Note: Supervised-Industry Training (SIT) in actual work environment is included in the training duration.\n\n--- PDF PAGE 48 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 46\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is by group/individualized and self paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n• Training is based both on and off-the-job requirements;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ntrainer conducts and facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire a specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructors are not in the\nsame place. Distance learning may employ correspondence study,\nor audio, video or computer technologies.\n\n--- PDF PAGE 49 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 47\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nCan communicate in oral and written language\n•\nCan perform basic mathematical computations\n•\nMust be physically and mentally fit to undergo training\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be\nrequired from the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS (Institution-based)\n\nRecommended list of tools, equipment and materials required for a class size\nof 15 trainees for Copper Cable Splicing and Installation NC II:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n5\nset of wrenches\n\nLine extender*\n1 roll\nmessengered cable\n10\nSet of screwdrivers\n\nService vehicle*\n3\nset of suspension clamps\n10\ntorque wrench\n1\nlineman boom truck*\n3\npole extension arm\n10\nF-open wrench\n1\ncable trailer*\n5\nPressure testing valve\n3\nbolt cutter\n1\nreel stand*\n5\npole insulator\n5\ncable slitter\n1\nlashing machine*\n5\nground/guying insulator\n5\nElectrician scissors\n1\nManhole pump\n5\npole tag\n3\nStaple gun\n1\nPower supply\n5\ncable tag\n3\nTechnician’s knife\n1\nTrunk amplifier\n10\nsets of washer, bolts and\nnuts, machine bolts\n5\nCable prep tool\n1\nTV set\n1\nmachine bolts – straight,\nthimble-eye and bent types\n2\nset of hammer\n1\nLCD\n1 rl\nstainless lashing wire\n10\nset of pliers\n1\nKaraoke\n60\nlashing wire clamps\n5\nBoring tools\n1\nmicrophone\n\n5\nBlow torch\n1\nDVD /VCD /MP3 players\n\n10\nPoly knife\n1\nPersonal computers/\ninternet\n\n5\nhacksaw\n5\ncable tensioner/\nrachet/ coping jack\n\n10\nCrimping/\ncompression tool\n\n5\ncable guide\n10\naerial handline\n5\nset of ropes\n10\ntape linen/steel tape\n\n5\nManhole hook\n\n5\nManhole Ladder 10 ft\n\n5\nExtension Ladder 20ft\n\n--- PDF PAGE 50 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 48\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nTOOLS\nEQ