        "source_title": "INSTALL DIGITAL SUBSCRIBER LINE (DSL)",
        "source_text": "--- PDF PAGE 41 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 39 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \n \nUNIT OF COMPETENCY   :    INSTALL DIGITAL SUBSCRIBER LINE (DSL)  \nUNIT CODE \n:    ICT724610 \nDESCRIPTOR                    : This unit covers the knowledge, skills and attitudes \nrequired to install DSL modems.  \n \nELEMENT \nPERFORMANCE CRITERIA \nBold & Italicized fonts are elaborated in the range of variables \n1. Prepare for DSL \nModem Installation  \n1.1 \nSubscriber’s unit specification is checked in \naccordance with system requirements \n1.2 \nNecessary tools, equipment, materials and personal \nprotective equipment (PPE) are identified and \nprepared in line with job requirements.  \n2. Perform Installation \nof DSL Modem \n2.1 \nOccupational health & safety (OH&S) policies and \nprocedures are followed based on safety requirements. \n2.2 \nVoice-Data splitter is connected in line with installation \nmanual. \n2.3 \nModem is installed and configured in line with modem \ninstallation manual. \n2.4 \nInternet connection is tested in line with enterprise \nprocedure \n2.5 \nInstallation report is documented according to SOP \n2.6 \nInterpersonal skills is demonstrated in dealing with \nsubscriber concerns in line with enterprise procedures \n3. Wrap up job \n3.1 \nTools, equipment and materials are gathered and \nstored back to the service vehicle  \n3.2 \nWaste materials are removed from work place and \ndisposed off in accordance with environmental \nrequirements\n\n--- PDF PAGE 42 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 40 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Unit specification \nMay include: \n1.1 PC hardware \n1.2 PC Operating system \n2. Tools, equipment, \nmaterials and  PPE  \n \n \n \n \nMay include but not limited to: \nTools: \n \n2.1 Crimping tool \n \nMaterials: \n2.2 \nSplitters \n2.3 \nLine cord RJ11 \n2.4 \nData cable RJ 45 \n2.5 \nMicro filter \nEquipment: \n2.6 \nDSL modem \n \nPPE: \n2.7 \ntool pouch / holster\n\n--- PDF PAGE 43 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 41 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Installed DSL modem  \n1.2 Configure Modems \n1.3 Demonstrated interpersonal skills in dealing with \nsubscriber concerns  \n2. Required \nknowledge and \nattitude \n2.1 Safety Practices \n2.1.1 \nWork safety requirements \n2.1.2 \nProper handling and use of tools and equipment  \n2.2 Materials, Tools and Equipment: Uses and Specifications \n2.2.1 \nIdentification of appropriate tools, equipment; and \ndevices and proper usage \n2.3 Theory and Practices \n2.3.1 \nADSL Technology \n2.3.2 \nBasic Electricity \n2.3.3 \nModem set up  \n2.3.4 \nBasic Internet principles of operation \n2.3.5 \nBasic networking and network troubleshooting  \n2.4 Government regulations and environmental health & safety \nrequirements \n2.5 Desirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n3. Required skills \n3.1 Work efficiently and systematically \n3.2 Computer manipulation skills \n3.3 Modem installation and configuration skills \n3.4 Network testing \n3.5 Proper handling of tools, equipment and proper \nmaintenance. \n3.6 Communicating effectively \n4. Resource \nimplications \nThe following resources must be available: \n4.1 \nTools and test instruments and PPE (see range of \nvariables) \n4.2 \nLaptop with appropriate OS and software \n4.3 \nDSL Modem \n4.4\nAccess to telephone line with internet connection\n5. Method of \nassessment \n5.1 Direct observation/demonstration with oral questioning  \n5.2 Written test \n6. Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting \n6.2 \nAssessment shall be undertaken either individually or part \nof team under limited supervision\n",
