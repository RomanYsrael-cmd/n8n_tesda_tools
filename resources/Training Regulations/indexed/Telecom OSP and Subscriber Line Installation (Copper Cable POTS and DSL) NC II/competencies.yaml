        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Required\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Required Skills\n3.1.\nCommunicate appropriately, consistent with the culture of\nthe workplace\n3.2.\nParticipate in workplace discussion\n3.3.\nComply with organization work requirements\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or tasks\n4.3.\nCommunication and work tools\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the\nwork activities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken individually\n\n--- PDF PAGE 10 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 8\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE :"
