        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nSpliced and joined cable terminal and main cable pairs for\naerial copper cable works,\n1.2.\nSpliced and joined straight and branch cable pairs for\nunderground copper cable works,\n1.3.\nInstalled cable closure.\n1.4.\nInstalled cable support.\n2. Required\nknowledge and\nattitude\n\n2.1\nSafety Practices\n2.1.1 Work safety requirements\n2.1.2 Proper use of tools and equipment\n2.2\nMaterials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment; and\nmaterials and proper usage\n2.3\nTheory and Practices\n2.3.1 Telephone Cable Color Codes\n2.3.2 Identification and usage of tools, materials and\nequipment\n2.3.3 Aerial and underground cable practices and\ninstallations\n2.3.4 Pole climbing techniques and ladder handling –aerial\nand underground procedures and practices.\n2.3.5 Aerial/Underground cable splicing/jointing\n2.3.6 Cable closure Installation\n2.3.7 Basic Electricity\n2.3.8 Copper cable handling\n2.3.9 Closure set-up\n2.4\nGovernment regulations and environmental health &\nsafety requirements\n2.5\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nproper handling of extension ladder/MH ladder\n3.4.\nProper handling, use and maintenance of tools and equipment.\n3.5.\nProper handling of copper cables and terminal\n3.6.\nIdentification of cable pairs and cable binders\n3.7.\nCable splicing\n3.8.\nCommunicating effectively\n3.9.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of variables)\n4.2.\nMockup/sample service order\n4.3.\nWork area with aerial and underground cable installed\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nWritten\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 35 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 33\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nUNIT OF COMPETENCY : PERFORM BASIC TROUBLESHOOTING AND\nCORRECTION OF CABLE FAULT AND ERROR\nUNIT CODE\n:"
        },
        "source_text": "ICT724607\nDESCRIPTOR\n: This unit covers the outcomes required for joining/ splicing\ncable terminal to main aerial cable and/or underground\ncable splicing/jointing for outside plant telephone network. It\nalso includes installing cable closure and cable supports.\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the range of variables\n1. Splice and join\ncable terminal and\nmain cable pairs\nfor aerial copper\ncable works\n1.1. Necessary tools, equipment, materials and personal\nprotective equipment (PPE) are identified and prepared in\nline with job requirements.\n1.2. Cable pairs Identification, twisting techniques and\ncrimping/connectorization are performed in accordance with\nmanufacturer’s specifications and as per design\nplan/assignment.\n1.3. Group binders and segregation of cable pairs are performed\nas per job requirements and assignment.\n1.4. Accomplishment reports are accurately reported/\ndocumented in accordance with job requirements\n2. Splice and join\nstraight and branch\ncable pairs for\nunderground\ncopper cable works\n2.1. Necessary tools, equipment, materials and personal\nprotective equipment (PPE) are identified and prepared in\nline with job requirements\n2.2. Manhole and cable preparation for splicing/joining of\nstraight/branch splices is performed in line with job\nrequirements\n2.3. Cable pairs identification, twisting techniques and\ncrimping/connectorization is performed in accordance with\nmanufacturer’s specifications and as per design\nplan/assignment\n2.4. Group binders and segregation of cable pairs are performed\nas per job requirements and assignment.\n2.5. Accomplishment reports are accurately reported/\ndocumented in accordance with job requirements\n3. Install Cable\nClosure\n3.1. Cable closure is applied to spliced cable pairs in accordance\nwith product specification\n3.2. Problems encountered are reported as per standard\noperating procedures (SOP).\n3.3. Flush testing of completed closure is performed according to\njob requirements and SOP to prevent water and moisture\nentry.\n4. Install Cable\nSupport\n4.1. Spliced cable are attached to messenger wire/cable rack for\nsupport in line with job requirements and product\nspecifications\n4.2. Job completion report is prepared in line with enterprise\nprocedures\n\n--- PDF PAGE 33 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 31\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, equipment,\nmaterials and\nPPE\n\nMay include but not limited to:\nTools:\n1.1\nCable cutter\n1.2\nSide cutter\n1.3\nCrimping tools\n1.4\nCable Slitter\n1.5\nPolyethylene knife\n1.6\nScrewdrivers\n1.7\nSocket / adjustable\nwrench\n1.8\nManhole hook\nMaterials:\n1.9\nbond clip\n1.10 Bond bar\n1.11 cable gel cleaner\n1.12 tie wrap\n1.13 color coded binders\n1.14 connectors\n1.15 tap-off bracket\n1.16 electric meter\n1.17 circuit breaker\n\n1.18 grounding wire (gauge\n12, stranded)\n1.19 TW wire (gauge 12,\nstranded or solid)\nEquipment:\n1.20 Hand/Head-set\n1.21 Service vehicle\n1.22 extension ladders (24\nft/20 ft length)\n1.23 MH ladder\n1.24 manhole pump\n\nPPE:\n1.25 body belt & strap\n1.26 hard hat/ helmet\n1.27 set gloves\n1.28 goggles\n1.29 safety shoes\n1.30 tool pouch / holster\n1.31 safety cones/traffic safety\ndevices\n2. Manhole and\ncable preparation\n2.1 Manhole preparation\n2.1.1. Drain and clean manhole\n2.1.2. Install drain plugs\n2.2 Cable preparation\n2.2.1. Positioning/attachment of splices to cable racks\n2.2.2. Cable pairs preparation and connectorization\n2.2.3. Alignments of splices/joints as specified by the\nproduct manufacturers/suppliers\n\n--- PDF PAGE 34 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 32\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nSpliced and joined cable terminal and main cable pairs for\naerial copper cable works,\n1.2.\nSpliced and joined straight and branch cable pairs for\nunderground copper cable works,\n1.3.\nInstalled cable closure.\n1.4.\nInstalled cable support.\n2. Required\nknowledge and\nattitude\n\n2.1\nSafety Practices\n2.1.1 Work safety requirements\n2.1.2 Proper use of tools and equipment\n2.2\nMaterials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment; and\nmaterials and proper usage\n2.3\nTheory and Practices\n2.3.1 Telephone Cable Color Codes\n2.3.2 Identification and usage of tools, materials and\nequipment\n2.3.3 Aerial and underground cable practices and\ninstallations\n2.3.4 Pole climbing techniques and ladder handling –aerial\nand underground procedures and practices.\n2.3.5 Aerial/Underground cable splicing/jointing\n2.3.6 Cable closure Installation\n2.3.7 Basic Electricity\n2.3.8 Copper cable handling\n2.3.9 Closure set-up\n2.4\nGovernment regulations and environmental health &\nsafety requirements\n2.5\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nproper handling of extension ladder/MH ladder\n3.4.\nProper handling, use and maintenance of tools and equipment.\n3.5.\nProper handling of copper cables and terminal\n3.6.\nIdentification of cable pairs and cable binders\n3.7.\nCable splicing\n3.8.\nCommunicating effectively\n3.9.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of variables)\n4.2.\nMockup/sample service order\n4.3.\nWork area with aerial and underground cable installed\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nWritten\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 35 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 33\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nUNIT OF COMPETENCY : PERFORM BASIC TROUBLESHOOTING AND\nCORRECTION OF CABLE FAULT AND ERROR\nUNIT CODE\n:"
