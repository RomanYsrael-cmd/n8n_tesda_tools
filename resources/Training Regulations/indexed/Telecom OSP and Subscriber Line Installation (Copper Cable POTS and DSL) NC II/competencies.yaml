        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Complied with job requirements and safety procedures at all\ntimes during installation\n1.2.\nIdentified tools, materials, hardware and other accessories\n1.3.\nAttached cable terminal pole\n1.4.\nStenciled cable assignment\n2. Required\nknowledge and\nattitude\n\n2.1\nSafety Practices\n1.1.1 Work safety requirements\n1.1.2 Proper use of tools and equipment\n1.1.3 OH&S policies and procedures\n2.2\nMaterials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment; and\ndevices\n2.2.2 Familiarity with the use of standard tools (both for\nheavy construction)\n2.3 Theory and Practices\n2.3.1 Outside plant construction principles and standards\n2.3.2 Outside plant protection concept\n2.3.3 Pole hardware and accessories\n2.3.4 Cable Terminal Attachments\n2.2.1 Line wires\n2.2.2 Stenciling, support and measurements\n2.2.3 Grounding and bonding techniques\n\n2.3\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling and positioning of extension ladder\n3.4.\nProper handling, use and maintenance of tools and\nequipment\n3.5.\nCommunicate effectively\n3.6.\nInterpretation of plans and symbols\n3.7.\nDocumentation skills\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of variables)\n4.2.\nMockup/Sample service order\n4.3.\nWork area\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nWritten Test\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually\n\n--- PDF PAGE 29 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 27\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nUNIT OF COMPETENCY :\nPERFORM MAIN CABLE INSTALLATION\nUNIT CODE\n:"
