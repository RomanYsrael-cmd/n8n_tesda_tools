        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified cable faults and errors\n1.2\nCorrected cable fault and errors\n2. Required\nknowledge and\nattitude\n2.1 Safety Practices\n2.1.1 Work safety requirements\n2.1.2 Proper handling and use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.2.2 Identification of appropriate tools, equipment and\nproper usage\n2.3 Theory and Practices\n2.3.1 Cable types and its characteristics\n2.3.2 Basic Electricity\n2.3.3 Pole climbing techniques\n2.3.4 Identification and usage of pole hardware\n2.3.5 Copper cable handling\n2.3.6 Cable common faults and errors\n2.3.7 Troubleshooting techniques\n2.4 Government regulations and environmental health & safety\nrequirements\n2.5 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1\nWork efficiently and systematically\n3.2\nObserving safety precautions\n3.3\nCable Map/Plan interpretation skills\n3.4\nCopper cable troubleshooting and testing skills\n3.5\nProper handling of tools, equipment and proper\nmaintenance.\n3.6\nCommunicating effectively\n4. Resource\nimplications\nThe following resources must be available:\n4.1 Tools and test instruments and PPE (see range of\nvariables)\n4.2 Mockup/sample service order\n4.3 Work area with OSP telephone cable network\n4.4 Access to distribution point, manhole locations\n4.5 Extension ladder, manhole ladder\n5. Method of\nassessment\n5.1 Direct observation/ oral questioning\n5.2 Written Test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 38 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 36\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nUNIT OF COMPETENCY :\nINSTALL POTS SUBSCRIBER LINE\nUNIT CODE\n:"
