        "source_title": "APPLY QUALITY STANDARDS",
        "source_text": "--- PDF PAGE 18 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 16 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \nCOMMON COMPETENCIES \n \n \nUNIT TITLE \n: \nAPPLY QUALITY STANDARDS \nUNIT CODE \n: \nELC315202 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes needed \nto apply quality standards in the workplace.  The unit also \nincludes the application of relevant safety procedures and \nregulations, \norganization \nprocedures \nand \ncustomer \nrequirements \n \nELEMENT \nPERFORMANCE CRITERIA \nBold & Italicized fonts are elaborated in the Range of Variables\n1. Assess quality of \nreceived materials or \ncomponents \n1.1. Work instructions are obtained and work is carried out \nin accordance with standard operating procedures \n1.2. Received materials or component parts are \nchecked against workplace standards and \nspecifications \n1.3. Faulty material or components related to work are \nidentified and isolated \n1.4. Faults and any identified causes are recorded and/or \nreported to the supervisor concerned in accordance \nwith workplace procedures \n1.5. Faulty materials or components are replaced in \naccordance with workplace procedures \n2. Assess own work \n2.1. Documentation relative to quality within the \ncompany is identified and used \n2.2. Completed work is checked against workplace \nstandards relevant to the task undertaken \n2.3. Faulty pieces  are identified and isolated \n2.4. Information on the quality and other indicators of \nproduction performance is recorded in accordance \nwith workplace procedures \n2.5. Deviations from specified quality standards, causes \nare documented and   reported in accordance with \nthe workplace’ standards operating procedures \n3. Engage in quality \nimprovement  \n3.1. Process improvement procedures are participated in \nrelation to workplace assignment \n3.2. Work is carried out in accordance with process \nimprovement procedures \n3.3. Performance of operation or quality of product or \nservice to ensure customer satisfaction is monitored\n\n--- PDF PAGE 19 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 17 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials/components\n1.1.  Materials may include but not limited to: \n1.1.1. Wires \n1.1.2. Cables, soldering lead \n1.1.3. Electrical tape \n1.1.4. Connectors \n1.1.5. Cable terminal/closures \n1.2. Components may include but not limited to: \n1.2.1. ICs \n1.2.2. Diodes \n1.2.3. Resistors \n1.2.4. capacitors \n2. Faults \nFaults may include but not limited to: \n2.1. Components/materials not according to \nspecification \n2.2. Components/materials contain manufacturing \ndefects \n2.3. Components/materials do not conform with \ngovernment regulation i.e., PEC, environmental \ncode \n2.4. Components/materials have safety defect \n3. Documentation \n3.1. Organization work procedures \n3.2. Manufacturer’s instruction manual \n3.3. Customer requirements \n3.4. Forms \n4. Quality standards \n4.1. Quality standards may relate but not limited to the \nfollowing: \n4.1.1. Materials \n4.1.2. Component parts \n4.1.3. Final product \n4.1.4. Production processes \n5. Customer \n5.1. Co-worker \n5.2. Supplier \n5.3. Client \n5.4. Organization receiving the product or service\n\n--- PDF PAGE 20 ---\n-