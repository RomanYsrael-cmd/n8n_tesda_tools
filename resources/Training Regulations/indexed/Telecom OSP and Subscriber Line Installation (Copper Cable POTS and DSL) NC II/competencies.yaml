        "source_text": "ICT724608\nDESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to perform the basic troubleshooting of copper\ncable faults and errors\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the range of variables\n1. Prepare for cable fault\nand error\ntroubleshooting\n1.1 Documentation are required and interpreted in\naccordance with enterprise procedures\n1.2 Necessary tools, equipment, materials and\npersonal protective equipment (PPE) are identified\nand prepared in line with job requirements.\n1.3 Cable pair’s identification and preparation is performed\nin accordance with job requirements and assignments.\n2. Test and correct cable\nfaults and errors\n2.1 Identification and interpretation of cable faults and\nerrors is performed as per job requirements\n2.2 Corrective action is applied in line with enterprise\nprocedure\n2.3 Accomplishment report is prepared according to\nenterprise policy\n3. Wrap up job\n3.1 Tools, equipment and materials are gathered and\nstored back to the service vehicle\n3.2 Waste materials are removed from work place and\ndisposed off in accordance with government\nregulations and environmental requirements\n3.3 Changes made are restored to the work area during\ninstallation, splicing/jointing and re-splicing to\ncomplete/clear for acceptance and approval.\n\n--- PDF PAGE 36 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 34\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, equipment,\nmaterials and\nPPE\n\nMay include but not limited to:\nTools:\n1.1 Cable cutter\n1.2 Cable prep tool\n1.3 Crimping / compression\ntool\n1.4 NT cutter / blade cutter\n1.5 Staple gun\n1.6 Set of pliers\n1.7 Set of screwdrivers\n1.8 F-open wrench\n\nMaterials:\n1.9\nUY/UG-connectors\n(crimped or compression\ntype)\n1.10 cable tie\n1.11 remnant cloth\n1.12 cable cleaner\n1.13 silicon gel\n1.14 rubber boots\n1.15 cable tag\n1.16 terminators\n1.17 grounding wire (gauge\n12, stranded)\n\n1.18 grounding rod (1/4’ by 4’\nwith clamp)\n1.19 grounding block\n1.20 Cable clamp\n1.21 Lasing wire\n1.22 Lashing wire clamp\nEquipment:\n1.23 Hand/head-set\n1.24 Tone identifier\n1.25 Service vehicle\n1.26 Extension ladders (24ft.)\n1.27 Manhole ladder\n1.28 Manhole hook\n1.29 Manhole pump\nPPE:\n1.30 body belt & strap\n1.31 hard hat/ helmet\n1.32 set gloves\n1.33 goggles\n1.34 safety shoes\n1.35 tool pouch / holster\n1.36 safety cones/traffic\nsafety devices\n2. Troubleshooting of\ncable faults and\nerrors\n2.1\nIdentify splicing/jointing errors\n2.2\nTest for grounded circuit\n2.3\nTest for shorted circuit\n2.4\nTest open circuit\n\n--- PDF PAGE 37 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 35\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified cable faults and errors\n1.2\nCorrected cable fault and errors\n2. Required\nknowledge and\nattitude\n2.1 Safety Practices\n2.1.1 Work safety requirements\n2.1.2 Proper handling and use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.2.2 Identification of appropriate tools, equipment and\nproper usage\n2.3 Theory and Practices\n2.3.1 Cable types and its characteristics\n2.3.2 Basic Electricity\n2.3.3 Pole climbing techniques\n2.3.4 Identification and usage of pole hardware\n2.3.5 Copper cable handling\n2.3.6 Cable common faults and errors\n2.3.7 Troubleshooting techniques\n2.4 Government regulations and environmental health & safety\nrequirements\n2.5 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1\nWork efficiently and systematically\n3.2\nObserving safety precautions\n3.3\nCable Map/Plan interpretation skills\n3.4\nCopper cable troubleshooting and testing skills\n3.5\nProper handling of tools, equipment and proper\nmaintenance.\n3.6\nCommunicating effectively\n4. Resource\nimplications\nThe following resources must be available:\n4.1 Tools and test instruments and PPE (see range of\nvariables)\n4.2 Mockup/sample service order\n4.3 Work area with OSP telephone cable network\n4.4 Access to distribution point, manhole locations\n4.5 Extension ladder, manhole ladder\n5. Method of\nassessment\n5.1 Direct observation/ oral questioning\n5.2 Written Test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 38 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 36\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nUNIT OF COMPETENCY :\nINSTALL POTS SUBSCRIBER LINE\nUNIT CODE\n:"
