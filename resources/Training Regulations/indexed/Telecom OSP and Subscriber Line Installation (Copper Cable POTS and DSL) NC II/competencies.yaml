        "source_text": "--- PDF PAGE 25 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 23 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \n \nCORE COMPETENCIES \nUNIT OF COMPETENCY : \nINSTALL POLE HARDWARE, CABLE TERMINAL, \nLINE WIRE AND ACCESSORIES  \nUNIT CODE \n:       ICT724605 \nDESCRIPTOR \n: \nThis unit covers the outcomes required for installing \npole \nhardware, \ncable \nterminal, \nline \nwire \nand \naccessories. This involves working with a team. \nELEMENT \nPERFORMANCE CRITERIA \nBold & Italicized fonts are elaborated in the range of variables \n1. Prepare for pole \nhardware, cable \nterminal and line \nwire installation \n \n1.1 Necessary tools, materials and personal protective \nequipment (PPE) are prepared in line with job \nrequirements.  \n1.2 Information on proposed locations and necessary \napprovals from relevant authorities is obtained. \n1.3 Site is cleared and prepared to provide unrestricted access \nfor installation works in accordance with joint pole \nagreement  \n1.4 Installation constraints and safety hazards are identified \nand suitable action is determined\n2. Perform pole \nhardware, cable \nterminal, line wire \nand accessories  \ninstallation \n2.1 \nInstallation site is made safe through erection of necessary \nbarriers in accordance with standard practices and \napplicable rules and regulations \n2.2 \nFixing structures on pole are installed securely in \naccordance with manufacturer’s specifications and joint \npole agreement (JPA) and/or enterprise standards \n2.3 \nFixing devices where the support is other than a pole are \ninstalled in accordance with the JPA and/or enterprise \nstandards \n2.4 \nPole identifier marks are placed on installed poles for \nidentification \n2.5 \nGround are installed and grounding wires are bonded to \nmessenger wire of copper cable in accordance with the \nindustry construction standards \n2.6 \nGuy-wire assembly is installed and tensioned to required \nspecifications   \n2.7 \nProblems encountered are reported as per standard \noperating procedures (SOP). \n2.8 \nInstallation and design amendments are reported/ \ndocumented in accordance with job requirements\n\n--- PDF PAGE 26 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 24 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools and \nequipment, \nmaterials and \nPPE  \nMay include but not limited to: \nTools and equipment: \n1.1 \nset of wrenches \n1.2 \nset of pliers \n1.3 \nextension ladder \n1.4 \nbolt cutter \n1.5 \nset of screw drivers \n1.6 \ncome-a-long / guy grip \n1.7 \nClaw  hammer \n1.8 \nhacksaw \n1.9 \ncanvass bag \n1.10 tabbing shear \n1.11 cable puncher \n1.12 closure tool kit \n1.13 reel stand \n1.14 bender board/cable form \n1.15 polyethylene knife \n1.16 pole mount cable block (for \nself support cable) \n1.17 hand/head - set \n1.18 crimping tool \n1.19 lay-up stick / cable lifter \n1.20 multiple cable puller \n1.21 messenger wire raising tool \nMaterials: \n1.22 pole clamps of various \nsizes \n1.23 set of suspension clamps \n1.24 messengered cable \n1.25 pole extension arm \n1.26 grounding rod/wires \n \n1.27 cable clamps \n1.28 set of guy grips \n1.29 guy protector \n1.30 anchor rod \n1.31 ground/guying insulator \n1.32 tie wrap \n1.33 thimble eye nut \n1.34 stainless strap and \nbuckle \n1.35 cable closures kit \n1.36 sets of washer, bolts and \nnuts \n1.37 cable terminal \n1.38 cable tag \n1.39 pole tag \n1.40 stainless lashing wire \n1.41 lashing clamp \n1.42 grounding wire \n1.43 bullet bond clip/bar \n1.44 scotch/vinyl tape \n1.45 Scotch lock connectors \n \nPPE: \n1.46 body belt & strap \n1.47 hard hat/ helmet \n1.48 set gloves \n1.49 goggles \n1.50 safety shoes \n1.51 tool pouch \n1.52 safety cones/other \ncollapsible signs \n2. relevant \nauthorities  \n2.1 local government \n2.1.1. barangay \n2.1.2. municipality/city \n2.2 DPWH \n2.3 homeowner’s association \n2.4 house owners \n3. barriers \n3.1 safety cones \n3.2 early warning devices \n3.3 collapsible barrier and signs \n3.4 service vehicles \n3.5 wooden barricades \n3.6 red flag warning signs \n4. Applicable rules \nand regulations \n4.1 Local Government Regulations \n4.2 PEC \n5. Fixing structures \n5.1 pole dressing  \n5.2 anchor rod \n5.3\nanchor block\n\n--- PDF PAGE 27 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 25 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \n \n6. Fixing devices \n6.1 screw hooks \n6.2 set of bolts, nuts and \nwashers \n6.3 machine bolts – straight, \nthimble-eye and bent \ntypes   \n6.4 lag screws \n6.5 conduit pipes \n6.6 messenger-wire clamps \n6.7 \nmessenger wire \n6.8 \nextension arm \n6.9 \nsuspension clamps \n6.10 anchor and grounding \nrods \n6.11 sidewalk guy fixture  \n6.12 bonding clamp \n7. Pole identifier \nmarks  \n7.1 Written or stamped on steel plate and strapped to concrete \npole or nailed to wooden pole \n7.2 Contains data on \n7.2.1. Company markings \n7.2.2. Pole identification\n8. Guy-wire \nassembly \n8.1 Guy grip \n8.2 Insulator strain \n8.3 Guy wire \n8.4\nGuy-wire protector\n9. Installation and \ndesign \namendments \n9.1 \ncable re-routing \n9.2 \nas-built plan\n\n--- PDF PAGE 28 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------------    Page 26 \nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II      \nPromulgated:   October 2011                                                              \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Complied with job requirements and safety procedures at all \ntimes during installation \n1.2. \nIdentified tools, materials, hardware and other accessories \n1.3. \nAttached cable terminal pole \n1.4. \nStenciled cable assignment \n2. Required \nknowledge and \nattitude \n \n \n \n \n2.1 \nSafety Practices \n1.1.1 Work safety requirements \n1.1.2 Proper use of tools and equipment  \n1.1.3 OH&S policies and procedures \n2.2 \nMaterials, Tools and Equipment: Uses and Specifications \n2.2.1 Identification of appropriate tools, equipment; and \ndevices \n2.2.2 Familiarity with the use of standard tools (both for \nheavy construction) \n2.3  Theory and Practices \n2.3.1 Outside plant construction principles and standards  \n2.3.2 Outside plant protection concept \n2.3.3 Pole hardware and accessories \n2.3.4 Cable Terminal Attachments \n2.2.1 Line wires \n2.2.2 Stenciling, support and measurements \n2.2.3 Grounding and bonding techniques \n \n2.3 \nDesirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n3. Required skills \n3.1. \nWork efficiently and systematically \n3.2. \nObserving safety precautions  \n3.3. \nProper handling and positioning of extension ladder \n3.4. \nProper handling, use and maintenance of tools and \nequipment \n3.5. \nCommunicate 