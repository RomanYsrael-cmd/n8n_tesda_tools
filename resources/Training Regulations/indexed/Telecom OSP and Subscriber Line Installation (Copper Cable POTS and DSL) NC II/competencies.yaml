        "source_text": "ICT724609\nDESCRIPTOR\n:\nThis unit covers the outcomes required in installing POTS\nsubscriber line. It includes preparation of distribution point, lay-\nouting and installation of drop wire, house attachment and\ncustomer premises equipment (CPE) and accessories.\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the range of variables\n1. Prepare\ndistribution point\nto customer\npremises\ninstallation\n\n1.1 Necessary tools, materials and personal protective\nequipment (PPE) are prepared in line with job requirements.\n1.2 Information on proposed installation locations are identified\nbased on service order\n1.3 Site is cleared and prepared to provide unrestricted access\nfor installation works in accordance with joint pole agreement\n1.4 Installation constraints and safety hazards are identified and\nsuitable action determined\n2. Layout and install\ndrop wire and\nhouse attachment\n2.1\nOccupational health & safety (OH&S) policies and procedures\nare followed based on safety requirements.\n2.2\nDistribution point terminal are identified in line with service order\n2.3\nDrop wire are terminated in line with service order\n2.4\nDrop wire layout installation from distribution point to station\nprotector is performed in line with standard installation\nprocedure\n2.5\nHouse attachment is installed and secured permanently to\nsupport drop wire in accordance with standard installation\nprocedure\n2.6\nGrounding elements are installed in accordance with\nestablished standards\n2.7\nProblems encountered are reported in line with standard\noperating procedures (SOP).\n3. Install telephone\nset and\naccessories\n3.1\nConnecting Block (CBK) are installed in line with installation\nmanual\n3.2\nJacketed wire is terminated and connected to CBK based on\ninstallation manual\n3.3\nTelephone instrument is installed in line with installation\nmanual\n3.4\nProblems encountered are reported as per standard\noperating procedures (SOP).\n3.5\nInstallation is properly documented according to SOP.\n4. Wrap up job\n4.1\nTools, equipment and materials are gathered and stored\nback to the service vehicle\n4.2\nWaste materials are removed from work place and disposed\noff in accordance with government regulations and\nenvironmental health & safety requirements\n4.3\nChanges made are restored to the work area during\ninstallation, disconnection and reconnection to the\ncustomer's satisfaction\n\n--- PDF PAGE 39 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 37\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and\nequipment,\nmaterials and\nPPE\nMay include but not limited to:\nTools and equipment:\n1.1\nWire Slitter\n1.2\nTool 216 – B\n1.3\nScrew Driver\n1.4\nLong nose/cutter pliers\n1.5\nExtension Ladder\n\nMaterials:\n1.6\nParallel wires AWG # 18/22\n\nPPE:\n1.7\nbody belt & strap\n1.8\nhard hat/ helmet\n1.9\nset gloves\n1.10 safety shoes\n1.11 tool pouch\n1.12 safety cones/other\ncollapsible signs\n2. House\nattachments\n2.1 Protector\n2.2 House bracket\n2.3 Span clamp\n2.4 C-knob\n3. Grounding\nelements\n3.1 Ground rod\n3.2 Ground wire\n3.3 Ground clamp\n\n--- PDF PAGE 40 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 38\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1.\nInstalled drop wire from DP to protector\n1.2.\nInstalled grounding elements\n1.3.\nInstalled jacketed wire from protector to CBK\n1.4.\nInstalled telephone set and accessories\n2. Required\nknowledge and\nattitude\n\n2.1\nSafety Practices\n2.1.1 Work safety requirements\n2.1.2 Proper use of tools and equipment\n2.2\nMaterials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment; and\ndevices\n2.3\n Theory and Practices\n2.3.1 Cable Terminal Attachments\n2.3.2 Installation of cable clamps\n2.3.3 Stenciling, support and measurements\n2.3.4 Grounding and bonding techniques\n2.3.5 Basic Telephone Installation\n2.3.6 Telephone installation standards\n2.3.7 Basic Electricity\n2.3.8 Identification and usage of tools and materials\n2.4\nGovernment regulations and environmental health & safety\nrequirements\n2.5\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nproper handling and positioning of extension ladder\n3.4.\nProper handling, use and maintenance of tools and\nequipment\n3.5.\nIn-house wiring skills\n3.6.\nCommunicate effectively\n3.7.\nInterpretation of plans and symbols\n3.8.\ndocumentation skills\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of variables)\n4.2.\nMockup/Sample service order\n4.3.\nWork area\n5. Method of\nassessment\n5.1\nDirect observation/demonstration with oral questioning\n5.2\nWritten test\n6. Context of\nassessment\n6.1\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 41 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 39\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nUNIT OF COMPETENCY : INSTALL DIGITAL SUBSCRIBER LINE (DSL)\nUNIT CODE\n:"
