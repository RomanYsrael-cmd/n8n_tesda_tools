        "source_text": "ICT724606\nDESCRIPTOR\n:\nThis unit covers the outcomes required for performing\nmain cable installation. This involves working with a\nteam.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the range of variables\n1. Prepare for cable\njointing and\ninstallation\n\n1.1. Necessary tools, equipment, materials and personal\nprotective equipment (PPE) are prepared in line with\njob requirements.\n1.2. Cable preparation and installation requirements and\nconstraints from plan and site inspection are identified as\nper job requirements\n1.3. Cable preparation and installation equipment is set up in\naccordance with manufacturer's and job requirements\n1.4. Site is made safe and secure for cable installation\n1.5. Suitable protective clothing is selected and required\nsafety devices used\n1.6. Support structure is assessed as safe for normal\nworking conditions\n1.7. Cable route is checked for obstructions and vertical\nclearances from street level and are made clear using\nsuitable methods and in coordination with authorities\nconcerned.\n2. Install main cable\n2.1\nOccupational health & safety (OH&S) policies and\nprocedures are followed based on safety requirements.\n2.2\nTools, equipment, clothing and safety requirements are\nidentified and obtained for the sheath opening, bonding,\ngrounding and securing bunch end.\n2.3\nSheath opening of the cable terminal stub and main\ncable, bonding and grounding are installed as required\nper outside plant standards.\n2.4\nCables are bind and secured in accordance with\nstandard installation procedures\n2.5\nLoop and bending radius tolerance is insured for cable\nmaterials at all times in accordance with outside plant\nstandards\n2.6\nProblems encountered are reported as per standard\noperating procedures (SOP).\n2.7\nWaste materials are removed from workplace and\ndisposed off in accordance with government regulations\nand environmental health and safety requirements.\n\n--- PDF PAGE 30 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 28\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, equipment\nand materials and\nPPE\n\nMay include but not limited to:\nTools and Equipment:\n1.1\nhammers\n1.2\naerial handline\n1.3\nextension ladders (24 ft.\nand 20 ft. length)\n1.4\nadjustable wrench\n1.5\nfixing brackets/clamps\n1.6\ncable tensioner/rachet/\ncoping jack\n1.7\ncome-a-long / guy grip\n1.8\npolyethylene knife\n1.9\nwire/lashing wire\n1.10 cable puncher\n1.11 tape linen/steel tape\n1.12 Height measuring\nstick/pole stick for\nclearances.\n1.13 Cable slitter\n1.14 Gimlet\n1.15 hacksaw\nMaterials:\n1.16 cable clip\n1.17 grounding wire\n1.18 lashing wire\n1.19 lashing wire clamps\n1.20 cable support\n1.21 cable spacer\n\n1.22 adhesive tape\n1.23 cable clamps\n1.24 cable roller\n1.25 standard rope\n1.26 tie wrap\n1.27 cable-loop form / X-frame\n1.28 bonding jumper wire\n1.29 thimble eye nut\n1.30 sets of washer, bolts and\nnuts, machine bolts\n1.31 cable straps\n1.32 connectors\n1.33 cable tag\n1.34 pole tag\n1.35 screws\n1.36 color coded marked tape\n1.37 poly vinyl sleeve\nPPE:\n1.38 body belt & strap\n1.39 hard hat/ helmet\n1.40 set gloves\n1.41 safety goggles\n1.42 safety shoes\n1.43 tool pouch\n1.44 safety cones/traffic safety\ndevices\n2. Support structure\n2.1\nElectric/Telephone pole (JPA)\n2.2\nGuy wire/Messenger wire\n2.3\nPole dressing/Cable tagging\n3. Obstructions\n\n3.1\nTrees\n3.2\nStructures such as arcs, billboards, etc.\n3.3\nParts of buildings and houses, i.e. roof extensions/overhangs\n3.4\nTraffic lights, street lights, etc.\n3.5\nPower lines\n4. Suitable methods\nfor removing\nobstructions\n4.1\nTrimming of tree branches\n4.2\nInstallation of ten-pin alley arm\n4.3\nInstallation of high-tension insulation materials\n5. Installation\nprocedures\n5.1\nStringing of cable between suspension clamps\n5.2\nTensioning of cable\n\n--- PDF PAGE 31 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 29\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1.\nInstalled main cable\n1.2.\nBind and secured cables\n2. Required\nknowledge and\nattitude\n\n2.1 Safety Practices\n1.1.4 Occupational health & safety requirements\n1.1.5 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.3.5 Identification of appropriate tools, equipment; and\ndevices and proper usage\n2.3 Theory and Practices\n2.3.1 Introduction to Telephone Outside Plant Network\n2.3.2 Outside Plant Standard Symbols/Diagrams\nInterpretation\n2.3.3 Types of Cables and their Characteristics\n2.3.4 Cable installation and preparation\n2.3.5 Outside plant safety and practices\n2.4 Government regulations and environmental health & safety\nrequirements\n2.5 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Required skills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nPole climbing & proper handling of extension ladder\n3.4.\nProper handling, use and maintenance of tools and\nequipment.\n3.5.\nCable binding\n3.6.\nCable pair identification and splicing\n3.7.\nProper handling copper cables\n3.8.\nCommunicating effectively\n3.9.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of\nvariables)\n4.2.\nMockup/Sample service order\n4.3.\nWork area with pole/s installed with messenger\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nWritten test\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken individually with\nsupervision\n\n--- PDF PAGE 32 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------- Page 30\nTRAINING REGULATIONS – Telecom OSP and Subscriber Line Installation (Copper Cable/POTS and DSL) NC II\nPromulgated: October 2011\n\nUNIT OF COMPETENCY : SPLICE/JOINT CABLE TERMINAL TO MAIN AERIAL\nAND/OR UNDERGROUND COPPER CABLE SPLICE\nUNIT CODE\n:"
