mpetency\nLearning\nOutcome\nLearning activities\nMethodology\nMethods of\nAssessment\nNominal\nDuration\n• Carry out removal,\nreplacement and alignment\nactivities\n\n2.3 Complete work\nprocesses\n\n•\nDiscuss final inspection\nprocedures relating to\nquality control\n•\nExplain turn-over\nprocedures of component\n•\nDiscuss 5S of Good\nHousekeeping relating to\nrestoration of work area,\ncleaning and storage of tools\nand equipment\n•\nDescribe waste\nmanagement\n•\nExplain workplace\ndocumentation\n•\nComplete workplace\nprocess\n•\nLecture-discussion\n•\nDemonstration\n•\nVideo Presentation\n\n•\nWritten examination\n•\nDemonstration\n•\nDirect observation\n•\nOral questioning\n3 Hours\n3. Repair\nvehicle body\npanels using\nfiller (rough\nfinish)\n3.1 Prepare to repair\nbody panels using\nfiller\n•\nDiscuss the determination of\njob requirements.\n\n•\nIdentify sources of\nmanufacturer specifications\nfor body filler application and\nrelevant safety data sheets\n(SDS).\n\n•\nIdentify unserviceable tools\nand equipment\n\n•\nLecture-discussion\n•\nDemonstration\n•\nVideo Presentation\n\n•\nWritten examination\n•\nDemonstration\n•\nDirect observation\n•\nOral questioning\n(174 Hours)\n56Hours\n\n--- PDF PAGE 113 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 109\nUnit of Competency\nLearning\nOutcome\nLearning activities\nMethodology\nMethods of\nAssessment\nNominal\nDuration\n•\nExplain management of\nwork hazards\n\n•\nEnumerate types and uses\nof tools, equipment and PPE\n\n•\nDiscuss planning of work\nrelating to waste and time\nmanagement\n\n•\nPrepare to repair body\npanels using filler\n\n3.2 Carry out activities\nusing filler\n\n•\nExplain industry criteria for\nremoving paint\n•\nDiscuss rectification of\ndamaged body panels\n•\nDescribe mixing procedures\nof body filler\n•\nEnumerate steps on filler\napplication\n•\nExplain rough finishing\n•\nEnumerate safety practices\nrelevant to the tasks\n•\nCarry out activities usi