  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for AUTOMOTIVE BODY REPAIRING NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nAUTOMOTIVE BODY REPAIRING\nNC II\nNC Level:\nNC II\n\nNominal Training Duration:\n\n37 Hours (Basic Competencies)\n\n162 Hours (Common Competencies)\n\n348 Hours (Core Competencies)\n\n547\n\n 348 Supervised Industry Learning (SIL)\n\n895 TOTAL HOURS\nNote: SIL with allowance\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry standards. It\ncovers competencies such as removal and storing vehicle body components,\nreplacement and repairing vehicle body panels and components, and repair of vehicle\nbody panels using filler (rough finish).\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 90 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 86\n\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate i