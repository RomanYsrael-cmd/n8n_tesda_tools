  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for AUTOMOTIVE BODY REPAIRING NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nAUTOMOTIVE BODY REPAIRING\nNC II\nNC Level:\nNC II\n\nNominal Training Duration:\n\n37 Hours (Basic Competencies)\n\n162 Hours (Common Competencies)\n\n348 Hours (Core Competencies)\n\n547\n\n 348 Supervised Industry Learning (SIL)\n\n895 TOTAL HOURS\nNote: SIL with allowance\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry standards. It\ncovers competencies such as removal and storing vehicle body components,\nreplacement and repairing vehicle body panels and components, and repair of vehicle\nbody panels using filler (rough finish).\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 90 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 86\n\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures\nand systems\n•\nIdentify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n•\nPrepare different Types of\nquestion\n•\nGather different sources of\ninformation\n•\nApply storage system in\nestablishing workplace\ninformation\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n1.2 Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and\ninstructions\no Workplace interactions and\nprocedures\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 91 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 87\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties\nscenario following workplace\nnstructions\n\n1.3 Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication\nprocedures and systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and\nrecord routine workplace\nmeasures\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nPerform workplace duties\nscenario following simple written\nnotices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 92 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 88\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nGather and provide information in\nresponse to workplace\nrequirements\n•\nComplete work related\ndocuments\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and\nscope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team\nand group\no\nObjectives and goals of team\n•\nLocate needed information from\nthe different sources of\ninformation\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and\nresponsibility\n•\nRole Play\no Understanding Individual\ndifferences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a team\nmember\n• Participate in group planning\nactivities\n• Role play: Communication\nprotocols\n• Participate in the discussion of\nstandard work procedures and\npractices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n--- PDF PAGE 93 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 89\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry\nhardware and software products\nand services\n• Identify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\n