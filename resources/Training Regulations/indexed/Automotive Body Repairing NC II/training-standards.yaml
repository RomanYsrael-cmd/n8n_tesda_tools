ion of a workplace\nand/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 School/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\n\n--- PDF PAGE 116 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 112\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits\nto contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – short term program conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers which\nare intended to address the specific needs of a community. Such programs can\nbe conducted in informal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP).\n\n--- PDF PAGE 117 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 113\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who would like to enroll in this program must possess the\nfollowing requirements:\n\n•\nA holder of National Certificate in Automotive Servicing NC I;\n•\nBasic communication skills;\n•\nBasic mathematical skills;\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering the TVET program.\n\nNote: National Certification in Automotive Servicing NC I can be obtained through direct assessment applying principle of\nRecognition of Prior Learning (RPL).\n\n3.4\nLIST OF TOOLS, EQUIPMENT, AND MATERIALS\n\nAUTOMOTIVE BODY REPAIRING NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nAUTOMOTIVE BODY REPAIRING NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their availability\nin the local market.\n\nA. FULL QUALIFICATION\n\nTOOLS\nQTY\nDESCRIPTION\n2 sets\nStandard body technician hand tools\n5 pcs\nClip removers, small\n5 pcs\nClip removers, big\n2 pcs\nAir Impact Wrench, ½ dr.\n1 pc\nHorizontal hammer\n1 pc\nCross chisel hammer\n1 pc\nVertical chisel hammer\n5 pcs\nPick hammer\n5 pcs\nSmoothing Hammer\n5 pcs\nRubber mallet\n5 pcs\nWooden hammer\n5 pcs\nDolly (85x70mm)\n5 pcs\nDolly (105x65mm)\n5 pcs\nDolly (135x65mm)\n5 pcs\nFile dolly\n1 pc\nBody spoon\n1 set\nHand puller\n1 pc\nBody line chisel\n\n--- PDF PAGE 118 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 114\nTOOLS\nQTY\nDESCRIPTION\n5 pcs\nMixing stick, plastic\n10 pcs\nPutty spatula, plastic\n5 pcs\nSanding block, 4”\n5 pcs\nSanding block, 5”\n5 pcs\nSanding block, 7”\n5 pcs\nRuler, stainless steel, 12”\n1 pc\nSealant gun\n\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nWasher welder, single phase\n2 units\nCrocodile jack, 1 ton\n1 unit\nParts Rack, 4x3x2ft\n1 pc\nTrolley, 3 layers\n4 pcs\nCar Stand, adjustable, 1 t