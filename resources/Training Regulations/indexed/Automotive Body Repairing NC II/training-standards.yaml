      "source_text": "AUTOMOTIVE BODY REPAIRING NC II\n\nThe automotive workshop must be made of reinforced concrete or steel structure. The\nsize must be suited on the requirements of the competencies. The class size of 25\nstudents/trainees is reserved for the lecture room and the practical demonstration area for\ncarrying out servicing of minor automotive parts. Most of the learning activities such as on-\nvehicle servicing is performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nGRAND TOTAL\nAREA IN SQ.\nMETERS\nA. Building (permanent)\n\n164.00\nLecture Room\n5 x 6\n30\n30.00\nLaboratory/Workshop\nArea\n4 x 7\n28.00 x 3\n84.00\nTool room & S/M storage\narea\n\n20\n20.00\nLearning resource area\n5 x 4\n20\n20.00\nWash area/comfort room\n(male & female)\n\n10\n10.00\n\nTOTAL\n\n164.00\nNOTE: Access to and use of equipment /facilities can be provided through cooperative arrangements or MOA\nwith other partner- companies/institutions.\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE BODY REPAIRING NC II\n\nNew Trainer\n•\nHolder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive Body\nRepairing NC II; and\n•\nMust have at least 2-years industry experience in Automotive Body Repair for the\nlast 4 years\n\nExisting Trainer\n•\nHolder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive Body\nRepairing NC II; and\n•\nMust have at least 48 hours of industry immersion in automotive painting within the\nlast 2 years (industry training which includes structured training program inclusive\nof hands-on activities and observation in a workshop, and training certificates with\nnumber of hours)",
