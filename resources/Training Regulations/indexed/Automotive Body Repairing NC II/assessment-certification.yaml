iohazards, and airborne particulate matter.\n\nSafety data sheets\nA document that summarizes the performance and\nother technical characteristics of a product, machine,\ncomponent.\n\nWorkplace procedure\npprocedures explain how to perform tasks and duties. A\nprocedure may specify who in the organization is\nresponsible for particular tasks and activities, or how\nthey should carry out their duties.\n\n--- PDF PAGE 130 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 126\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAUTOMOTIVE BODY REPAIRING NC II\nQualification Code:\nALTABR220\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nAutomotive Body Repairing\nNC II\nTBR No. 2004 - 21/\n12-09-2004\nNA\n01\nDocument\nAmended\nAutomotive Body Repairing\nNC II\nTBR No. 2020-43/\n10-13-2020\nTESDA Circular No.\n137 series of 2020\nLegend: *Description Types\n-Document Created\n\n-Document Amended\n-Document Superseded\n\n--- PDF PAGE 131 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 127\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) is\nparticularly grateful for the valuable technical support provided by the following\nindustry stakeholders for the review and development of this Training Regulations.\nThe time and inputs generously given during this undertaking are also highly\nappreciated and recognized as they made significant contributions to the constitution\nof this TR.\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nMR. WILLET EDWIN LLOYD C. GENEROSO\nTechnical Expert\nBermanz Auto Philippines Inc. (BAPI)\n\nMR. ELMER B. DEL ROSARIO\nTechnical Expert\nToyota Motor Phils. Corp. (TMPC)\n\nMR. ROMMEL O. CABANELA\nTechnical Expert\nSuzuki Philippines Inc. (SPH)\nMR. MARLON V. SOLLEZA\nTechnical Expert\nAsian Carmak