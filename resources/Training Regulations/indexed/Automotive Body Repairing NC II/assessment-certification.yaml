  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of AUTOMOTIVE BODY REPAIRING NC\nII the candidate must demonstrate competence in all units of competency\nlisted in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 Assessment shall cover all competencies, with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.3 The following are qualified to apply for assessment and certification, as long\nas they are holders of National Certificate in the amended Automotive\nServicing NC I:\n\n4.1.3.1 Graduates of WTR-registered program on Automotive Body\nRepairing NC II, or graduates of NTR programs or formal/non-\nformal/informal including enterprise-based training programs related\nto automotive body repair; or\n\n4.1.3.2 Candidates who gained competencies in implementing automotive\nbody repair or any related field through informal training or previous\nwork experiences for at least two (2) years within the last five (5)\nyears. A Certificate of Employment and Job Description must be\nprovided as proof.\n\n4.1.4. Current holders of National Certificate (NC) in AUTOMOTIVE BODY\nREPAIRING NC II shall have their certificates renewed and converted to the\namended TR provided he/she has accumulated at least two (2) years within\nthe last five (5) years work experience, practicing the competencies\nprescribed in his/her certificate. A Certificate of Employment and Job\nDescription must be provided as proof. He/she must be a holder of National\nCertificate in the amended Automotive Servicing NC I.\n\nCurrent holders of National Certificate (NC) in AUTOMOTIVE BODY\nREPAIRING NC II with no work experience of at least two (2) years within\nthe last five (5) years shall have to undergo reassessment in the amended\n\n--- PDF PAGE 122 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 118\nTraining Regulations upon expiration of their Certificate. He/she must be a\nholder of National Certificate in the amended Automotive Servicing NC I.\n\n4.1.5. Current holders of Certificate of Competency (COC) in AUTOMOTIVE BODY\nREPAIRING NC II, shall undergo reassessment in the amended Training\nRegulations upon expiration of their Certificate/s. He/she must be a holder of\nNational Certificate in the amended Automotive Servicing NC I.\n\n4.1.6. Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency.\n\n4.1.7. The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as by industry.\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including readiness\nfor assessment.\n\nThis document can:\n\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited\nby TESDA is authorized to conduct competency assessment.\nAssessment centers undergo a quality assured procedure for\naccreditation before they are authorized by TESDA to manage the\nassessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\n\n--- PDF PAGE 123 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 119\naccreditation procedure before they are authorized by TESDA to assess\nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 124 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 120\n\n"
