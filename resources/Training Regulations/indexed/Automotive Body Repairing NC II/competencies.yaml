ective-ness\n2.1 Deductive\nReasoning Skills\n2.2 Critical thinking\n2.3 Problem Solving\n2.4 Observation\nSkills\n\n--- PDF PAGE 35 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 31\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nenvironmental\nprocedures.\n3. Convey inefficient\nand ineffective\nenvironmental\npractices\n3.1 Efficiency and\neffectiveness of\nresource utilization\nare reported to\nappropriate\npersonnel.\n3.2 Concerns related\nresource utilization\nare discussed with\nappropriate\npersonnel.\n3.3 Feedback on\ninformation/\nconcerns raised are\nclarified with\nappropriate\npersonnel.\n3.1 Appropriate\nPersonnel to\naddress the\nenvironmental\nhazards\n3.2 Environmental\ncorrective actions\n3.1 Written and Oral\nCommunication\nSkills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation\nSkills\n3.5 Practice\nEnvironmental\nAwareness\n\n--- PDF PAGE 36 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1 Utilization of Energy, Water, Fuel Procedures\n1.2 Waster Segregation Procedures\n1.3 Waste Disposal and Reuse Procedures\n1.4 Waste Collection Procedures\n1.5 Usage of Hazardous Materials Procedures\n1.6 Chemical Application Procedures\n1.7 Labeling Procedures\n2. Appropriate Personnel\nMay include:\n2.1 Manager\n2.2 Safety Officer\n2.3 EHS Offices\n2.4 Supervisors\n2.5 Team Leaders\n2.6 Administrators\n2.7 Stakeholders\n2.8 Government Official\n2.9 Key Personnel\n2.10 Specialists\n2.11 Himself\n\n--- PDF PAGE 37 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 33\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Measured required resource utilization in the workplace\nusing appropriate techniques\n1.2 Recorded data in a