        "source_text": "ALT723216\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work\narea including tools, equipment and facilities.\nStorage of equipment, including operating of basic\nworkshop equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform pre-\noperation activities\n1.1 Workshop\nfacilities are\nprepared according\nto work\nrequirements.\n1.2 Equipment are\nprepared according\nto work\nrequirements.\n1.3 Equipment are\ncalibrated following\nusers’ manual.\n1.4 Minor repairs are\ncarried out based\non users’ manual.\n1.5 Defective\nequipment are\nreported to\nimmediate\nsupervisor following\ncompany\nprocedures.\n1.6 Safety practices are\napplied following\nOSHS.\n1.1 Different areas of\nan automotive\nservice facilities\n1.2 Preparation\nprocedures of\nautomotive\nservice facilities\n1.3 Different\nequipment in the\nautomotive\nservice facilities\n1.4 Preparation\nprocedures of\nautomotive\nequipment\n1.5 Minor repairs of\nautomotive\nequipment\n1.6 Report of\ndefective\nequipment\n1.7 Reporting\nprocedures for\ndefective\nequipment\n1.8 OSHS practices\nrelated to the\npreparation of\nfacilities and\nequipment\n1.9 Workshop\nfacilities and\nequipment\n1.1 Preparing work\narea\n1.2 Preparing\nequipment\n1.3 Calibrating\nequipment\n1.4 Repairing minor\nequipment\nissues\n1.5 Reporting\ndefective\nequipment\n1.6 Applying safety\npractice\n1.7 Following\nmanuals\n\n--- PDF PAGE 62 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 58\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Use facilities and\nequipment\n2.1 Equipment is\noperated according\nto operation\nmanual.\n2.2 Facilities are\nutilized according to\nworkshop\nprocedures.\n2.3 Equipment\nperformance is\nmonitored following\nusers’ manual.\n2.4 Facilities\nfunctionalities are\nmonitored following\nworkplace\nprocedures.\n2.5 Safety practices are\napplied following\nOSHS.\n2.1 Operate\nEquipment\n2.2 Identify facilities\nrequired for task\n2.3 Evaluate\nequipment\noperation\n2.4 Inspect facility\nfunctionalities\n2.5 OSHS practices\nrelated to\noperation of\nfacilities and\nequipment\n2.6 Manuals in\nutilizing facility\nand equipment\n2.7 Monitoring\nprocedure of\nequipment’s\nperformance\n2.8 Evaluate\nequipment\noperation\n2.9 Inspection of\nfacility\nfunctionalities\n2.1 Operating\nequipment\n2.2 Utilizing facility\n2.3 Monitoring\nequipment\nperformance\n2.4 Monitoring\nfunctionalities of\nfacility\n2.5 Practicing safety\n2.6 Following\nmanual\n3. Conduct post-\noperation activities\n3.1 Workshop facilities\nare restored\naccording to 5S of\ngood\nhousekeeping.\n3.2 Equipment are\ncleaned and stored\naccording to good\nhousekeeping.\n3.3 Wastes are\ndisposed following\nwaste management\nprocedure and\nOSHS.\n3.4 PPEs and Safety\npractices are\napplied following\nOSHS.\n3.5 Report is prepared\nbased on workshop\nprocedure.\n3.1 5S of Good\nhousekeeping\n3.2 3Rs/ Waste\nsegregation and\ndisposal\n3.3 Restoration of the\nfacilities\n3.4 Maintenance and\nstorage of\nEquipment\n3.5 OSHS\n3.6 Preparation of\nreport\n3.1 Restoring\nworkshop\nfacilities properly\n3.2 Cleaning\nEquipment\n3.3 Storing\nequipment in\nproper location\n3.4 Disposing waste\nmaterials\n3.5 Reporting\nfacilities and\nequipment\ncondition\n3.6 Practicing safety\n3.7 Practicing 5S\nand 3Rs\n\n--- PDF PAGE 63 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 59\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\nMay include:\n1.1 Lifter (Two Post Lifter / Four Post Lifter/ Scissor\ntype)\n1.2 Crocodile Jack\n1.3 Jack Stand\n1.4 Air Compressor\n1.5 Oil drain\n2. Workshop facilities\nMay include:\n2.1 Service Stall / Working Bay / Workshop areas for\nservicing/repairing light and/or heavy vehicle and/or\nplant transmissions and/or outdoor power\nequipment\n2.2 Overhauling Room\n2.3 Electrical / Air-con Room\n2.4 Inspection Area\n2.5 Open workshop/garage and enclosed, ventilated\noffice area\n2.6 Car wash area\n2.7 Other variables may include workshop with:\n2.7.1 Mess hall\n2.7.2 Wash room\n2.7.3 Comfort room\n2.7.4 Storage Room\n2.7.5 Training Room\n3. Manuals\nMay include:\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Industry Occupational Health &Safety\n3.6 Equipment Operation Guidelines\n3.7 Service/workshop/repair manual\n4. PPEs\nMay include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4 Safety shoes\n4.5 Uniforms\n4.6 Cap\n4.7 Safety helmet\n5. Minor repairs\nMay include:\n5.1 Lubrication\n5.2 Bolt tightening\n5.3 Worn-out parts replacement\n\n--- PDF PAGE 64 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 60\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed pre-operation activities\n1.2 Used facilities and equipment\n1.3 Conducted post-operation activities\n1.4 Applied safety practices and good housekeeping\n1.5 Disposed wastes\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate Equipment\n2.3 Materials relevant to the activity\n2.4 Manuals/references\n2.5 PPEs\n2.6 Fire Extinguishers\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written exam\n3.2 Demonstration with oral questioning\n3.3 Direct observation\n4. Context of\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution.\n\n--- PDF PAGE 65 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 61\n\nUNIT OF COMPETENCY\n:\nPREPARE SERVICING PARTS AND\nCONSUMABLES\n\nUNIT CODE\n:"
