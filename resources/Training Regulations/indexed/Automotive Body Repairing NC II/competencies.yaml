          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared to remove and store vehicle body components\n1.2 Removed, tagged and secured body components\n1.3 Inspected damaged body components\n1.4 Completed work processes\n1.5 Demonstrated proper handling techniques of body panels\n1.6 Applied safety practices\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Automotive repair workplace or simulated workplace\n2.2 Workplace instructions\n2.3 PPEs\n2.4 Supplies, tools, materials and equipment needed to\ndemonstrate required tasks\n2.5 References and repair manuals\n2.6 Training vehicle\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 78 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 74\n\nUNIT OF COMPETENCY\n:\nREPLACE AND REPAIR VEHICLE BODY\nPANELS AND COMPONENTS\n\nUNIT CODE\n:"
        },
        "source_text": "ALT213304\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto perform pre-repair activities by removing and storing\nvehicle body components. It involves preparing for the task,\nselecting and using tools, following workplace instructions in\nremoving, tagging and storing body components as part of\npre-repair\nrequirements,\nand\ncompleting\nworkplace\nprocesses and documentation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare to remove\nand store vehicle\nbody components\n1.1 Job requirements\nare determined from\nworkplace\ninstructions.\n1.2 Repair information is\nsourced and\ninterpreted\naccording to\nmanufacturer’s\nrepair manual.\n1.3 Hazards associated\nwith the work are\nidentified and risks\nare managed based\non OSHS.\n1.4 Standard technician\nhand tools and\npersonal protective\nequipment (PPEs),\nare selected and\nchecked for\nserviceability.\n1.5 Defective and\ndamaged standard\ntechnician hand\ntools are reported\nfollowing workplace\nprocedures.\n1.6 Work is planned\naccording to\n1.1 Job requirements\n1.2 Workplace hazards\n1.3 Use of standard\ntechnician hand\ntools\n1.4 OSHS\n1.5 Wearing of PPEs\n1.6 Workplace\nprocedures\n1.7 Attitude:\n• Patience\n• Attention to details\n• Time conscious\n• Honest\n• Resourceful\n1.1 Determining job\nrequirements\n1.2 Sourcing and\ninterpreting repair\ninformation\n1.3 Identifying\nhazards\nassociated with\nthe work\n1.4 Selecting\nstandard\ntechnician hand\ntools\n1.5 Reporting\ndefective and\ndamaged\nstandard\ntechnician hand\ntools\n1.6 Locating\nspecifications and\nrelevant\ninformation\nefficiently\n1.7 Clarifying\ninstructions and\nprocedures\n1.8 Planning own\nwork\nrequirements and\nprioritize actions\n\n--- PDF PAGE 74 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 70\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nworkplace\nprocedures.\n1.7 Safety practices are\napplied according to\nOSHS.\n1.9 Selecting and\nchecking\nstandard\ntechnician hand\n1.10 Applying safety\nmeasures\n2. Remove, tag and\nsecure body\ncomponents\n2.1 Vehicle body\ncomponents are\nremoved according\nto manufacturer’s\nrepair manual.\n2.2 Components are\ntagged and stored\naccording to\nworkplace\nprocedures and\nwithout causing\ndamage to system\nor components.\n2.3 Additional parts\nrequired to\ncomplete repair are\nidentified, listed and\nreported.\n2.4 Safety practices are\napplied following\nOSHS.\n2.1 Automotive body\nparts\n2.1.1 Tagging\n2.1.2 Handling\n2.2 Workshop\nprocedure:\n2.2.1Accomplishmen\nt of checklist\n2.3 Procedure in\nremoving body\ncomponents\n2.4 OSHS\n2.5 Wearing of PPEs\n2.6 Functionality of\ncomponents\n2.7 Attitude:\n• Patience\n• Attention to details\n• Time conscious\nHonest\n2.1 Removing body\ncomponents\n2.2 Checking\ncomponents’\nfunctionality\n2.3 Identifying, listing\nand reporting\nadditional parts\nrequired\n2.4 Locating\nspecifications and\nrelevant\ninformation\n2.5 Filling out\nworkplace\ndocumentation\n2.6 Counting vehicle\nbody components\n2.7 Applying safety\npractices\n3. Inspect damaged\nbody components\n3.1 Vehicle body\ncomponents are\ncleaned according\nto safety and\nenvironmental\nrequirements.\n3.2 Vehicle body\ncomponents are\ninspected according\nto workplace\nprocedures\n3.3 Damaged body\ncomponents are\nreported according\nto workplace\nprocedures.\n3.4 Safety practices are\napplied following\nOSHS.\n3.1 Cleaning of body\ncomponents\n3.2 Inspection\nprocedure for body\ncomponents\n3.3 Workshop\nprocedure:\n3.3.1\nAccomplishmen\nt of checklist\n3.4 OSHS\n3.5 Wearing of PPEs\n3.6 Waste management\n3.7 Attitude:\n• Patience\n• Attention to details\n• Time conscious\n• Honest\n• Organized\n3.1 Cleaning vehicle\nbody components\n3.2 Inspecting vehicle\nbody components\n3.3 Reporting\ndamaged body\ncomponents\n3.4 Filling out\nworkplace\ndocumentation\n3.5 Inspection skills\n3.6 Reporting skills\n3.7 Applying safety\nmeasures\n4. Complete work\nprocesses\n4.1 Final inspection is\nmade based on\n4.1 Final inspection\nprocedure\n4.1 Filling out\nworkplace\ndocumentation\n\n--- PDF PAGE 75 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 71\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nworkplace\nprocedure.\n4.2 Body components\nare turned-over to\nimmediate superior\nfor quality control\nfollowing workplace\nprocedure.\n4.3 Work area is\nrestored following\n5S of good\nhousekeeping.\n4.4 Wastes are\nmanaged following\nenvironmental rules\nand regulations.\n4.5 Standard technician\nhand tools are\nchecked and stored\naccording to\nworkplace\nprocedures.\n4.7 Workplace\ndocuments are\naccomplished and\nsubmitted to\nimmediate superior\naccording to\nworkplace\nprocedures.\n4.2 Body component\nalignment\nmeasurement\n4.3 Body component\nclearance\n4.4 Checking and\nstoring of tools\n4.5 Workshop\nprocedure:\n4.5.1 Accomplishment\nof checklist\n4.6 OSHS\n4.7 Wearing of PPEs\n4.8 5S of Good\nHousekeeping\n4.9 Waste management\n4.10 Attitude:\n• Patience\n• Attention to details\n• Time conscious\n• Honest\n4.2 Inspection skills\n4.3 Managing wastes\n4.4 Accomplishing\nchecklist\n\n--- PDF PAGE 76 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 72\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\nMay include:\n1.1 Remove and store front fender\n1.2 Remove and store front and rear door\n1.3 Remove and store front and rear bumper\n1.4 Remove and store tail gate\n1.5 Remove and store hood\n1.6 Remove and store trunk lid\n1.7 Remove and store back door\n2. Safety and environmental\nrequirements\nSafety and environmental requirements may include:\n2.1 Selecting and using PPE\n2.2 Manually handling and storing vehicle body\ncomponents\n2.3 Using tools and equipment\n2.4 Environmental requirements, including procedures\nfor storing and disposing of waste materials\n3. Workplace documents\nMay include:\n3.1 Repair order\n3.2 Inspection form\n\n--- PDF PAGE 77 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 73\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared to remove and store vehicle body components\n1.2 Removed, tagged and secured body components\n1.3 Inspected damaged body components\n1.4 Completed work processes\n1.5 Demonstrated proper handling techniques of body panels\n1.6 Applied safety practices\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Automotive repair workplace or simulated workplace\n2.2 Workplace instructions\n2.3 PPEs\n2.4 Supplies, tools, materials and equipment needed to\ndemonstrate required tasks\n2.5 References and repair manuals\n2.6 Training vehicle\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 78 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 74\n\nUNIT OF COMPETENCY\n:\nREPLACE AND REPAIR VEHICLE BODY\nPANELS AND COMPONENTS\n\nUNIT CODE\n:"
