          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate perform the\nfollowing:\n1.1 Selected measuring instruments\n1.2 Performed measurements and calculation\n1.3 Maintained measuring instruments\n1.4 Applied safety practices\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate Automotive Measuring Tools & equipment\n2.3 Materials relevant to the activity\n2.4 Training vehicle or simulators\n2.5 User’s manual\n2.6 Repair manual\n3. Method of\nassessment\nCompetency MUST be assessed through:\n3.1 Written exam\n3.2 Demonstration with oral questioning\n3.3 Third party report\n3.4 Interview\n4. Context of\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution.\n\n--- PDF PAGE 61 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 57\n\nUNIT OF COMPETENCY\n:\nUTILIZE WORKSHOP FACILITIES AND\nEQUIPMENT\n\nUNIT CODE\n:"
