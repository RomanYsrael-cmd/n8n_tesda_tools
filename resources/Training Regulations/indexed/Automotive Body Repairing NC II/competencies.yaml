ndividually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 84 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 80\n\nUNIT OF\nCOMPETENCY\n:\nREPAIR BODY PANELS USING FILLER (ROUGH\nFINISH)\n\nUNIT CODE\n:\nALT213306\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to repair body panels using filler. It involves\npreparing for the task, selecting and using specialist tools\nand\nequipment,\nidentifying\nbody\nfiller\ntype\nand\nspecifications, calculating and mixing body filler and\napplying it to panels, completing repairs to pre-paint\ncondition and completing workplace documents.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare to repair\nbody panels using\nfiller\n1.1 Job requirements\nare determined from\nworkplace\ninstructions\n1.2 Manufacturer\nspecifications for\nbody filler\napplication and\nrelevant safety data\nsheets (SDS) are\nsourced and\ninterpreted.\n1.3 Materials,\nare selected and\nchecked for quality\nbased on\nmanufacturer’s\nspecification.\n1.4 Hazards associated\n with the work are\nidentified and risks\nare managed\naccording to\nworkplace\nprocedures.\n1.5 Tools and\nequipment,\nincluding personal\nprotective\nequipment (PPEs),\nare selected and\n1.1 Job requirements\n1.2 Industry criteria\n1.3 Tools, equipment,\nand materials\n1.4 Work hazards\n1.5 PPEs\n1.6 OSHS\n1.7 Degreasing of\nbody panels\n1.8 5S of good\nhousekeeping\n1.9 Attitude:\n• Patience\n• Attention to\ndetails\n• Time conscious\n• Honest\n1.1 Locating\nspecifications and\nrelevant\ninformation\n1.2 Clarifying\ninstructions\n1.3 and procedures\n1.4 Determining job\nrequirements\n1.5 Sourcing and\ninterpreting\nmanufacturer’s\nspecification\n1.6 Selecting and\nchecking\nmaterials\n1.7 Identifying\nhazards\n1.8 Applying safety\npractices\n\n--- PDF PAGE 85 ---\nTR-A