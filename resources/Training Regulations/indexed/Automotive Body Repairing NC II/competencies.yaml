        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed pre-operation activities\n1.2 Used facilities and equipment\n1.3 Conducted post-operation activities\n1.4 Applied safety practices and good housekeeping\n1.5 Disposed wastes\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate Equipment\n2.3 Materials relevant to the activity\n2.4 Manuals/references\n2.5 PPEs\n2.6 Fire Extinguishers\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written exam\n3.2 Demonstration with oral questioning\n3.3 Direct observation\n4. Context of\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution.\n\n--- PDF PAGE 65 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 61\n\nUNIT OF COMPETENCY\n:\nPREPARE SERVICING PARTS AND\nCONSUMABLES\n\nUNIT CODE\n:"
