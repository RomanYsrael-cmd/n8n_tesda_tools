        "source_text": "ALT213305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to remove, repair, and reinstall body panels\nand components by hammer and dolly, washer\nwelder, and shrinking method.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare to remove,\nrepair, and reinstall\nvehicle body panels\nand components\n1.1 Job requirements\nare determined\nfrom workplace\ninstructions\n1.2 Vehicle\ncomponents are\ninspected for\ndamage and repair\naccording to\nworkplace\nprocedures\n1.3 Repair methods\nare determined\nfrom workplace\nprocedures and\nvehicle\nspecifications\n1.4 Hazards associated\nwith the work are\nidentified and risks\nare managed\naccording to\nworkplace\nprocedures.\n1.5 Tools and\nequipment,\nincluding personal\nprotective\nequipment (PPEs),\nare identified and\nchecked for\nserviceability\n1.6 Materials are\nprepared according\nto workplace\nprocedure\n1.1 Job requirements\n1.2 Vehicle body\npanels and\ncomponents\n1.3 Accomplishment\nof checklist\n1.4 PPEs\n1.5 Work hazards\n1.6 Tools and\nequipment\n1.7 Materials\n1.8 Work area\n1.9 OSHS\n1.10 Wearing of PPEs\n1.11 Attitude:\n• Patience\n• Attention to\ndetails\n• Time\nconscious\n• Honest\n\n1.1 Locating\nspecifications\nand relevant\ninformation.\n1.2 Clarifying\ninstructions and\nprocedures\n1.3 Planning own\nwork\nrequirements\nand prioritize\nactions.\n1.4 Determining job\nrequirements\n1.5 Inspecting\nvehicle\ncomponents\n1.6 Determining\nrepair methods\n1.7 Identifying work\nhazards and\nrisks\n1.8 Identifying tools\nand equipment\n1.9 Checking tools\nand equipment\nserviceability\n1.10 Preparing\nvehicle and\nwork area\n\n--- PDF PAGE 79 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 75\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.7 Vehicle and work\narea are prepared\naccording to\nworkplace\nprocedures\n1.8 Safety practices are\napplied following\nOSHS\n2. Carry out removal,\nreplacement and\nalignment activities\n2.1 Materials are used\naccording to\nindustry criteria.\n2.1 Body panels and\ncomponents are\nremoved, tagged,\nand stored\naccording to\nindustry criteria\n2.2 Body panels and\ncomponents are\nreplaced according\nto job\nrequirements.\n2.3 Body panels and\ncomponents are\naligned using\nrepair methods\n2.4 Safety practices are\napplied using\nOSHS\n\n2.1 Tools, equipment\nand materials\n2.2 Materials\n2.3 Removal,\nreplacement, and\nalignment\nmethods and\ntechniques\nincluding:\n2.3.1 Measuring\npanel gaps\n2.3.2 Tagging and\nstoring\npanels and\ncomponents\n2.3.3 Panel\nsealant and\napplication\n2.4 Repair methods:\n2.4.1 Using\nhammer and\ndolly\n2.4.2 Using\nwasher\nwelder\n2.4.3 Using\nshrinking\nmethod\n2.5 OSHS\n2.6 Wearing of PPEs\n2.7 Attitude:\n• Patience\n• Attention to\ndetails\n• Time conscious\n• Honest\n• Organized\n2.1 Locating\nspecifications\nand relevant\ninformation\n2.2 Filling out\nworkplace\ndocumentation\n2.3 Clarify\ninstructions and\nprocedures.\n2.4 Plan own work\nrequirements\nand prioritize\nactions\n2.5 Preparing and\nusing materials\n2.6 Removing,\ntagging, and\nstoring body\npanels and\ncomponents\n2.7 Replacing body\npanels and\ncomponents\n2.8 Aligning body\npanels and\ncomponents\n2.9 Applying safety\npractices\n3. Complete work\nprocesses\n3.1 Final inspection is\nmade to ensure\nwork meets\nworkplace\n3.1 Final inspection\nprocedure\n3.2 Turn-over of\nvehicle\n3.1 Filling out\nworkplace\ndocumentation\n\n--- PDF PAGE 80 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 76\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nexpectations and\nvehicle is presented\nready for use\n3.2 Vehicle and\nreplaced parts are\nturned-over to\nimmediate superior\nfor quality control\nfollowing workplace\nprocedure.\n3.3 Work area is\nrestored following\n5S of good\nhousekeeping.\n3.4 Wastes are\nmanaged following\nenvironmental rules\nand regulations.\n3.5 Tools and\nequipment are\nchecked and stored\naccording to\nworkplace\nprocedures\n3.6 Workplace\ndocuments are\naccomplished and\nsubmitted to\nimmediate superior\naccording to\nworkplace\n3.3 Accomplishment\nof repair order and\nother forms\n3.3.1 Job done\n3.4 OSHS\n3.5 Wearing of PPEs\n3.6 3Rs\n3.7 5S of Good\nHousekeeping\n3.8 Waste\nmanagement\n3.9 Checking and\nstorage of tools\nand equipment\n3.10 Workplace\ndocuments\n3.11 Attitude:\n• Patience\n• Attention to\ndetails\n• Time conscious\n• Honest\n3.2 Conducting final\ninspection\n3.3 Performing\nvehicle and\nreplaced parts\nturn-over\n3.4 Restoring work\narea\n3.5 Managing\nwastes\n3.6 Checking and\nstoring tools and\nequipment\n3.7 Wearing of PPEs\n3.8 Applying safety\npractices\n\n--- PDF PAGE 81 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 77\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\nMay include:\n1.1 Replace and align front fender\n1.2 Replace and align front and rear door\n1.3 Replace and align hood\n1.4 Replace and align trunk lid\n1.5 Replace and align back door\n1.6 Replace and align tail gate\n2. Tools\nMay include:\n2.1 Standard technician Hand tools\n2.2 Spatula\n2.3 Hammer\n2.4 Dolly\n2.5 File dolly\n2.6 Spoon\n2.7 Measuring instrument\n3. Equipment\nMay include:\n3.1 Washer welder\n3.2 Body panel stand\n3.3 Body panel puller\n3.4 Grinder\n3.5 Air Compressor\n3.6 Heat gun\n3.7 Belt sander\n4. PPEs\nMay include:\n4.1 Gloves\n4.2 Goggles\n4.3 Mask\n4.4 Safety shoes\n5. Materials\nMay include:\n5.1 Sealant\n\n5.2 Washer\n5.3 Marker\n5.4 Rags\n6. Body panels\nIncludes:\n6.1 Front fender\n6.2 Front and rear door\n6.3 Hood\n6.4 Trunk (sedan)\n6.5 Back door (SUV, wagon)\n6.6 Tail gate (pick-up)\n6.7 Quarter panel\n7. Industry criteria\nMay include:\n7.1 Manufacturer specifications\n7.2 Repair manual\n\n--- PDF PAGE 82 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 78\nVARIABLE\nRANGE\n7.3 Workplace procedures\n7.4 Safety and environmental requirements\n7.5 Service history\n8. Repair method\nIncludes:\n8.1 Hammer and dolly\n8.2 Washer welder\n8.3 Shrinking method\n9. Work documents\nMay include:\n9.1 Repair order\n9.2 Job done\n9.3 Receiving reports of parts\n\n--- PDF PAGE 83 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 79\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate must:\n1.1 Prepared to repair, align and reinstall vehicle body panels\nand components\n1.2 Carried out removal, replacement and alignment activities\n1.3 Completed work processes\n1.4 Applied safety practices\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Actual or simulated work area\n2.2 Appropriate tools\n2.3 Materials relevant to the activity\n2.4 Repair manuals and related reference materials\n2.5 Training vehicle\n2.6 PPEs\n3. Method of\nassessment\nCompetency MUST be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Direct observation\n3.3 Written examination\n4. Context of\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 84 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 80\n\nUNIT OF\nCOMPETENCY\n:\nREPAIR BODY PANELS USING FILLER (ROUGH\nFINISH)\n\nUNIT CODE\n:"
