        "source_text": "ALT723215\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills on how to\nuse automotive measuring tools.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select measuring\ninstruments\n1.1 Component to be\nmeasured is\nidentified based on\njob requirements.\n1.2 Automotive\nmeasuring\ninstrument is\nidentified based on\njob requirements.\n1.3 Correct\nspecifications are\nobtained from\nrepair manual.\n1.4 Measuring tools are\ncalibrated in line\nwith job\nrequirements.\n1.5 Measuring\ninstruments are\nchecked for\naccuracy and\nadjusted according\nto manufacturer’s\nmanual.\n1.6 Defective\nmeasuring\ninstruments are\nreported and\nreturned to\ntoolkeeper following\nindustry standards.\n1.7 Safety practices are\napplied following\nOSHS.\n1.1 Category of\nmeasuring\ninstruments\n1.2 Types and uses\nof measuring\ninstruments\n1.3 Shapes and\nDimensions\n1.4 Use of user’s\nmanual\n1.5 Workshop\nprocedures in\nreporting\ndefective\ninstruments\n1.6 Characteristics of\ndefective\nmeasuring\ninstruments\n1.7 Procedure in\npreparing report\n1.8 OSHS in\ncalibrating\nmeasuring\ninstruments\n1.9 Calibration of\nmeasuring tools\n1.10 Inspection of\nmeasuring tools\n1.11 Segregation and\nreporting of\ndefective\nmeasuring\ninstruments\n1.1 Identifying and\nselecting\nmeasuring\ninstruments\n1.2 Visualizing\nobjects and\nshapes\n1.3 Calibration skills\n1.4 Identifying\ndefective\nmeasuring\ninstruments\n1.5 Reporting skills\n1.6 Applying safety\npractices\n1.7 Obtaining correct\nspecifications\n1.8 Checking\nmeasuring\ninstruments for\naccuracy\n1.9 Reporting and\nsegregating\ndefective\nmeasuring\ninstruments\n2. Carry out\nmeasurements\nand calculation\n2.1 Automotive\nmeasuring\ninstrument is\nselected to achieve\nrequired outcome in\n2.1 Formulas for\nvolume, areas,\nperimeters of\nplane and\ngeometric figures\n2.1 Performing\ncalculation\n2.2 Applyin