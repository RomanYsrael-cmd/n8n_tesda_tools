---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 82\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.10 Performing pre-\npaint panel\nfinishing\n2.11 Applying filler to\nrepair panels\n2.12 Applied safety\npractices\n3. Complete work\nprocesses\n3.1 Final inspection is\nmade to ensure\nwork meets\nworkplace repair\nstandards and\npanel is ready for\npainting.\n3.2 Body panel is\nturned-over to\nimmediate superior\nfor quality control\nfollowing workplace\nprocedure.\n3.3 Work area is\nrestored following\n5S of good\nhousekeeping.\n3.4 Wastes are\nmanaged following\nenvironmental rules\nand regulations.\n3.5 Tools and\nequipment are\nchecked, reported if\nfaulty, and stored\naccording to\nworkplace\nprocedures\n3.6 Workplace\ndocuments are\naccomplished and\nsubmitted to\nimmediate superior\naccording to\nworkplace\nprocedures\n3.1 Procedures for\nfinal inspection of\nbody filler repair\n3.2 Turn-over of\ncomponent\n3.3 Accomplishment\nof repair order and\nother forms\n3.3.1 Job done\n3.4 OSHS\n3.5 Wearing of PPEs\n3.6 3Rs\n3.7 5S\n3.8 Waste\nmanagement\n3.9 Checking and\nstorage of tools\nand equipment\n3.10 Workplace\ndocuments\n3.1 Filling out\nworkplace\ndocumentation\n3.2 Clearly report\nissues or\noutcomes\n3.3 Conducting final\ninspection\n3.4 Performing\nvehicle turn-over\n3.5 Restoring work\narea\n3.6 Managing wastes\n3.7 Checking and\nstoring tools and\nequipment\n3.8 Wearing of PPEs\n3.9 Applying safety\npractices\n\n--- PDF PAGE 87 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 83\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Sand paper\n1.2 Filler\n1.3 Mixing board\n2. Tools\nMay include:\n2.1 Spatula\n2.2 Ruler\n3. Equipment\nMay include:\n3.1 Sander\n3.2 Orbital Sander\n3.3 Infrared dryer\n3.4 Industrial vacuum cleaner\n4. PPEs\nMay include:\n4.1 Gloves, solvent resistant\n4.2 Respirator mask\n4.3 Goggles\n5. Industry criteria\nMay include:\n5.1 Manufacturer specifications\n5.1.1 Repair manual\n5.2 Workplace procedures\n5.3 Safety and environmental requirements\n6. Body panels\nMay include but not limited to:\n6.1 Fender\n6.2 Door panel\n6.3 Hood\n6.4 Trunk lid\n6.5 Side panel\n6.6 Roof panel\n7. Discrepancies\nMay include:\n7.1 Improper paint removal\n7.2 Improper mixing ratio of putty and hardener\n7.3 Uneven application of putty\n7.4 Improper sanding\n7.5 Improper cleaning\n8. Sanding\nIncludes:\n8.1 Wet sanding\n8.2 Dry sanding\n9. Workplace documents\nMay include:\n9.1 Repair order\n9.1.1 Job done\n9.2 Parts and materials requisition\n\n--- PDF PAGE 88 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 84\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared to repair body panels using filler\n1.2 Carried out repair activities using filler\n1.3 Completed work processes\n1.4 Applied safety practices\n2. Resource implications\nThe following resources MUST be provided:\n2.1 Workplace: Actual or simulated work area\n2.2 Appropriate tools and equipment\n2.3 Materials relevant to the activity\n2.4 Repair manuals and related reference materials\n2.5 PPEs\n2.6 Training vehicle\n2.7 Body panels\n3. Method of assessment\nCompetency MUST be assessed through:\n3.1 Direct observation\n3.2 Written examination\n3.3 Demonstration with oral questioning\n4. Context of assessment\n4.1 Competency may be assessed on the job or\n simulated environment.\n\n--- PDF PAGE 89 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 85"
