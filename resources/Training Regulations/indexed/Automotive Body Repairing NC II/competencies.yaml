        "source_text": "ALT723218\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes\nneeded in identifying and preparing the vehicle for\nservicing and releasing.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Receive vehicle\n1.1 Vehicle is located\nfollowing company\nstandard.\n1.2 Checklist is\nvalidated for\nexterior and interior\nitems in accordance\nwith vehicle\nchecklist.\n1.3 Job Order is\nchecked for proper\nassignment\naccording to work\nclassification.\n1.4 Work bay for\nvehicle is\ndesignated based\nfrom Job Order.\n1.5 Vehicle is moved\non the designated\nwork bay.\n1.1 Identification of\nbasic vehicle\ncomponents\n1.2 Types of defects\n1.3 Read &\nunderstand Job\nOrder\n1.4 Flat rate time\n1.5 Use of PPEs\n1.6 Adherence to\nsafety procedures\n1.7 Vehicle checklist\n1.8 Work\nclassification\n1.9 Work bay\n1.10 Attitudes\n1.10.1 Patient\n1.10.2 Attention\nto details\n1.10.3 Honest\n1.10.4 Time\nConscious\n1.1 Completing\nvehicle checklist\n1.2 Classifying work\nto be performed\n1.3 Assigning work\nbay\n1.4 Validating\nchecklist for\nexterior and\ninterior items\n1.5 Checking job\norder for proper\nassignment\n1.6 Identifying\nvehicle\n1.7 Moving vehicle\nto designated\nwork bay\n2. Prepare vehicle for\nservicing\n2.1 Protective covers\nare installed prior to\nservicing based on\nworkshop operating\nstandards.\n2.2 Vehicle is\npositioned and set-\nup for lifting\naccording to repair\norder.\n2.3 Vehicle is lifted for\nservicing following\nmanufacturer’s\nmanual.\n2.1 Familiarization on\nequipment &\nfacilities\n2.2 Time estimation\nof completion\n2.3 Vehicle tagging\n2.4 Types of\nprotective covers\n2.5 Setting-up of\nvehicle for lifting\n2.6 Read &\nunderstand repair\norder\n2.7 Use of PPEs\n2.8 Use of safety\ngears\n2.1 Understanding of\nvehicle status\n2.2 Installation of\nprotective covers\n2.3 Positioning\nvehicle\n2.4 Operating lifter\n2.5 Moving vehicle\n2.6 Setting-up\nvehicle for lifting\n2.7 Practicing safety\n\n--- PDF PAGE 70 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 66\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4 Safety practices are\napplied following\nsafety procedures.\n2.9 OSHS\n\n2.10 Adherence to\nsafety procedures\n2.11Attitudes:\n2.11.1 Patient\n2.11.2 Attention\nto details\n2.11.3 Honest\n2.11.4 Time\nConscious\n3. Prepare vehicle for\nreleasing\n3.1 Job done is\nconfirmed\naccording to repair\norder.\n3.2 Quality check is\ndone based from\nrepair order.\n3.3 Transfer of vehicle\nto wash bay is\ncoordinated\naccording to SOP.\n3.3 Vehicle is endorsed\nto quality control\nperson following\nworkplace\nprocedure.\n3.1 Familiarization of\nequipment &\nfacilities\n3.2 Read &\nunderstand repair\norder\n3.3 Confirmation of\njob done\n3.4 Quality standards\nchecking\n3.5 Coordination of\ntransferring\nvehicle\n3.6 Endorsement\nprocedures for\nvehicle\n3.7 Attitudes\n3.7.1 Patient\n3.7.2 Attention to\ndetails\n3.7.3 Honest\n3.7.4 Time\nConscious\n3.1 Confirming job\ndone\n3.2 Performing\nquality checking\n3.3 Coordinating\ntransfer of\nvehicle to wash\nbay\n3.4 Endorsing and\nturning-over\nvehicle\n\n--- PDF PAGE 71 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 67\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Vehicle checklist\nMay include:\n1.1 External scratches, accessories, items, dents,\ndamages and cracks\n1.2 Internal items, scratches, noticeable damages,\nincluding spare tire, tools, and loose items\n1.3 Standard items that are not present during\ninspection\n1.4 Valuable/personal belongings\n2. Work classification\nMay include:\n2.1 Body and Paint repair\n2.2 General Job repair\n2.3 Periodic maintenance service (PMS)\n3. Work bay\nMay include:\n3.1 Service Stall / Working Bay / Workshop areas for\nservicing/repairing light and/or heavy vehicle and/or\nplant transmissions and/or outdoor power\nequipment\n3.2 Overhauling Room\n3.3 Electrical / Air-con Room\n3.4 Inspection Area\n3.5 Open workshop/garage and enclosed, ventilated\noffice area\n5. Protective covers\nMay include but not limited to:\n5.1 Seat Cover\n5.2 Steering Wheel Cover\n5.3 Handbrake Cover\n5.4 Shift Knob Cover\n5.5 Fender Cover\n5.6 Paper mat\n\n--- PDF PAGE 72 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 68\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Received vehicle\n1.2 Prepared vehicle for servicing\n1.3 Prepared vehicle for releasing\n1.4 Applied safety practices\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate Tools & Equipment\n2.3 Materials relevant to the activity\n2.4 Manuals and references\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Direct observation\n3.2 Demonstration with Oral questioning\n3.3 Interview\n3.4 Written Evaluation\n3.5 Third Party Report\n4. Context of\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution.\n\n--- PDF PAGE 73 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 69\n\nCORE COMPETENCY\n\nUNIT OF COMPETENCY : REMOVE AND STORE VEHICLE BODY COMPONENTS\n\nUNIT CODE\n:"
