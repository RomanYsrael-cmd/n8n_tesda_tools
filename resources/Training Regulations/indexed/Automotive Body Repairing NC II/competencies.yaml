        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\nAssessment requires evidence that the candidate must:\n1.1 Prepared to repair, align and reinstall vehicle body panels\nand components\n1.2 Carried out removal, replacement and alignment activities\n1.3 Completed work processes\n1.4 Applied safety practices\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Actual or simulated work area\n2.2 Appropriate tools\n2.3 Materials relevant to the activity\n2.4 Repair manuals and related reference materials\n2.5 Training vehicle\n2.6 PPEs\n3. Method of\nassessment\nCompetency MUST be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Direct observation\n3.3 Written examination\n4. Context of\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 84 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 80\n\nUNIT OF\nCOMPETENCY\n:\nREPAIR BODY PANELS USING FILLER (ROUGH\nFINISH)\n\nUNIT CODE\n:"
