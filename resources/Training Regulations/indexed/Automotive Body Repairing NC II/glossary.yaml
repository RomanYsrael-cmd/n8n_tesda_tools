  "source_text": "Alignment methods\nRefers to the body alignments methods includes\nhammer and dolly, washer welder and shrinking method.\n\nBody filler\nSomething added to augment weight or size or fill space,\na composition, especially a semisolid that hardens on\ndrying.\n\nBody panels\nComponents and parts that make up automobile bodies\nincluding accessories.\n\nOSHS\nStands for Occupational Safety and Health Standards,\nwas formulated in 1978 in compliance with the\nconstitutional mandate to safeguard the worker’s social\nand economic well-being as well as his physical safety\nand health.\n\nPPE\nStands for Personal Protective Equipment, refers to\nprotective clothing, goggles, or other garments or\nequipment designed to protect the wearer's body from\ninjury or infection. The hazards addressed by protective\nequipment include physical, electrical, heat, chemicals,\nbiohazards, and airborne particulate matter.\n\nSafety data sheets\nA document that summarizes the performance and\nother technical characteristics of a product, machine,\ncomponent.\n\nWorkplace procedure\npprocedures explain how to perform tasks and duties. A\nprocedure may specify who in the organization is\nresponsible for particular tasks and activities, or how\nthey should carry out their duties.\n\n--- PDF PAGE 130 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 126",
