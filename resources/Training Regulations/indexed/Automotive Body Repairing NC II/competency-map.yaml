  "source_text": "SECTION 1 AUTOMOTIVE BODY REPAIRING NC II QUALIFICATION\n\nThe AUTOMOTIVE BODY REPAIRING NC II Qualification consists of\ncompetencies that a person must achieve to remove and store vehicle body\ncomponents, replace and repair vehicle body panels and components and repair\nvehicle body panels using filler (rough finish).\nThis Qualification is packaged from the competency map of the Automotive and\nLand Transport Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nALT723211\nValidate vehicle specification\nALT723212\nMove and position vehicle\nALT723214\nUtilize automotive tools\nALT723215\nPerform mensuration and calculation\nALT723216\nUtilize workshop facilities and equipment\nALT723217\nPrepare servicing parts and consumables\nALT723218\nPrepare vehicle for servicing and releasing\n\nCODE NO.\nCORE COMPETENCIES\nALT213304\nRemove and store vehicle body components\nALT213305\nReplace and repair vehicle body panels and components\nALT213306\nRepair vehicle body panels using filler (rough finish)\n\n--- PDF PAGE 6 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 2\nA person who has achieved this Qualification is competent to be:\n\n Body Repair Personnel\n Tinsmith\n Body Repair Technician\n\n--- PDF PAGE 7 ---\nTR-Automotive Body Repairing NC II Revision 01 Promulgated (10/13/2020)\n 3"
