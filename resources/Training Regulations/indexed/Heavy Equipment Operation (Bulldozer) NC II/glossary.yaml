      "term": "1. Bulldozer",
      "definition": "Refers to earthmoving equipment used in clearing/ pushing, winching, ripping, excavating and stockpiling operations. 2. Company Refers to private or government entity employing Bulldozer operator. 3. Daily Equipment Time Report Refers to the Bulldozer operating or working hours. 4. Engine RPM Refers to revolution per minute of crank shaft. 5. Operator Serviceable (OS) parts Refer any part of the equipment that can be serviced by the operator, e.g., air cleaner, fuel filter, battery clamp, fan belt, etc. 6. Size Refers to small medium or large equipment depending on its capacity, blade size and design application. 7. Work equipment Refers to a dozer structure such as blade, ripper, winch and other attachment. 8. Site inspection Refers to a work activity in determining the actual condition of the project site to include location, transport route, site terrain, work area, hazards, type of material, etc."
