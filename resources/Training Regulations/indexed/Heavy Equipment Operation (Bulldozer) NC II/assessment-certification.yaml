  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of HEAVY-EQUIPMENT\nOPERATION (Bulldozer) NC II, the candidate must demonstrate\ncompetence in all the units of competency in Section 1. The\nsuccessful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2\nThe\nqualification\nof\nHEAVY\nEQUIPMENT\nOPERATION\n(Bulldozer) NC II may be attained through demonstration of\ncompetence in a project-type assessment covering the following\ncore units.\n\n4.2.1 Bulldozer operation\n\nPerform pre- and post-operation for earthmoving\nequipment\n\nPerform productive operation for bulldozer operation\n\nPerform basic preventive maintenance servicing for\nearth-moving equipment\n\n4.3\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently\nwith the core units.\n\n4.4\nThe following are qualified to apply for assessment and\ncertification:\n\n4.4.1 Graduates of formal, non-formal and/or informal training\nincluding enterprise-based training programs\n\n4.4.2 Experienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\"\n\n--- PDF PAGE 79 ---\n\n--- PDF PAGE 80 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION - SUB- SECTOR\nBASIC\nInspect\nrigging\ngears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall\nrigging\ngears\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nAssist\ncrane\noperator\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\ntools\nInterpret technical\ndrawings and plans\nObserve procedures,\nspecifications and\nmanual of instructions\nMaintain tools and\nequipment\nPerform\nmensuration and\ncalculations\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 81 ---\nTR HEAVY-EQUIPMENT OPERATION (BULLDOZER) NC II\nPromulgated July 2007\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Bulldozer\nRefers to earthmoving equipment used in clearing/\npushing, winching, ripping, excavating and stockpiling\noperations.\n2. Company\nRefers to private or government entity employing\nBulldozer operator.\n3. Daily Equipment Time\nReport\nRefers to the Bulldozer operating or working hours.\n4. Engine RPM\nRefers to revolution per minute of crank shaft.\n5. Operator\nServiceable\n(OS) parts\nRefer any part of the equipment that can be serviced by\nthe operator, e.g., air cleaner, fuel filter, battery clamp, fan\nbelt, etc.\n6. Size\nRefers to small medium or large equipment depending on\nits capacity, blade size and design application.\n7. Work equipment\nRefers to a dozer structure such as blade, ripper, winch\nand other attachment.\n8. Site inspection\nRefers to a work activity in determining the actual\ncondition of the project site to include location, transport\nroute, site terrain, work area, hazards, type of material,\netc.\n\n--- PDF PAGE 82 ---\nTR HEAVY-EQUIPMENT OPERATION (BULLDOZER) NC II\nPromulgated July 2007\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies and who contributed their\ntime and expertise to the development and validation of this Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quianzon\nConsultant, Equipment Concrete Product Division\n(Equipment Management)\nMakati Development Corporation\nAyala-Alabang, Muntinlupa City\nRenato P. Faigao\nEquipment Ma