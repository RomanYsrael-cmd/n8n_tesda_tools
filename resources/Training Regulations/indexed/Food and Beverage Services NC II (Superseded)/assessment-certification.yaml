  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of FOOD AND BEVERAGE SERVICES NC II,\nthe candidate must demonstrate competence in all the units of competency listed in\nSection 1. Successful candidates shall be awarded a National Certificate signed by\nthe TESDA Director General.\n\n4.2 The qualification for FOOD AND BEVERAGE SERVICES NC II may be attained\nthrough demonstration of competence in all the units of competency covering all\nthe required core units of qualification.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs\n4.4.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 74 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 70\n\n--- PDF PAGE 75 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 71\n\n--- PDF PAGE 76 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 72\n"
