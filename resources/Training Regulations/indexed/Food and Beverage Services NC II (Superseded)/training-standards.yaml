      "source_text": "3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• can communicate in basic English both oral and written\n• at least completed the 10-year basic education\n• can perform basic mathematical computation\n\n3.4\nLIST OF TOOL, EQUIPMENT AND MATERIALS FOR FOOD AND BEVERAGE\nSERVICES NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Food and Beverage Services NC II.\n\nWAITERING TOOLS, MATERIALS AND EQUIPMENT\nQTY\nDINNERWARE\nQTY\nCUTLERIES\nQTY\nGLASSWARE\n24 pcs\nDinner plates,\n10”\n24 pcs.\nDinner knives\n24\npcs.\nRed wine glasses\n6 pcs.\nShow/service\nplates, 11-14”\n24 pcs.\nDinner forks\n24\npcs.\nWhite wine glasses\n24 pcs.\nSalad plates 7-\n8”\n24 pcs.\nSalad knives\n24\npcs.\nWater goblets\n24 pcs.\nFish plates, 8-\n9”\n24 pcs.\nSalad forks\n24\npcs.\nJuice glasses/Hi ball\n24 pcs.\nDessert plates,\n7-8”\n24 pcs.\nFish knives\n24\npcs.\nChampagne flute\n24 pcs.\nSide plates or\nbread plates, 6”\n24 pcs.\nFish forks\n24\npcs. Collins glasses\n24 pcs.\nSoup\nplate/bowl\n24 pcs.\nSoup spoons (cream\nand consume)\n24\npcs.\nPilsner glasses/Ice tea\nglasses\n24 pcs.\nCups and\nsaucers 5-6 oz\n24 pcs. Dessert spoons\n\n24 pcs. Dessert forks\n\n24 pcs. Teaspoons\n\n24 pcs. Cocktail forks\n\n6 pcs.\nService forks\n\n6 pcs.\nService spoons\n\n24 pcs. Steak knives\n\n24 pcs. Butter knives\n\n24 pcs. Oyster forks\n\n--- PDF PAGE 71 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 67\n\nQTY\nOTHER\nSERVICEWARE\nQTY\n\nQTY\nOTHER ACCESSORIES\n2 units Coffee pot\n4\npcs.\n54”X54 table cloth\n2\npcs.\nMenu Folders\n2 units Tea pot\n2\npcs.\nTable skirting cloths\n2\npcs.\nOrder pads\n4pcs\nSalt and Pepper\nshakers\n2\npcs.\nRectangular table\ncloths\n2\npcs.\nBill folder/change trays\n6 pcs\nservice trays\n4\npcs.\nSide towels\n1\nunit\nWaiter station/cabinet\n8 pcs\nSilver platters\n30\npcs.\n16” x16” Cloth Table\nnapkin\n2\npcs.\nTray stand (optional)\n8 pcs\nRound (bar) trays\n\n4 pcs\nTooth pick\nholders\n\nTABLES/CHAIRS\n6 pcs\nNapkin holders\n\n4\npcs.\nSquare/rectangular\ntables (4’s/6’s)\n5 pcs\nSugar containers\n\n2\npcs.\nround tables (8’s)\n5 pcs\nCreamer\ncontainers\n\n36\npcs.\nDining/Banquet chairs\n4 pcs\nSauce/gravy\nboats\n\n4 pcs\nSoup tureen\n\n2 pcs Peppermill\n\n2 pcs\nFood tongs\n\n2 pcs. Sauce ladles\n\n2 pcs. Soup ladles\n\n2 pcs. Cake servers\n\n6 pcs. Water pitchers\n\n8 pcs. (Room Service)\nPlate covers\n\n2 pcs. Ice buckets with\ntongs\n\n--- PDF PAGE 72 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 68"
