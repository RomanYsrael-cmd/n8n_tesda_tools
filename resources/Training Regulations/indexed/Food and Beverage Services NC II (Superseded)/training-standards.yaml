    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for FOOD AND BEVERAGE SERVICES NC II.\n\nThe guidelines include information on curriculum design, training delivery, trainee\nentry requirements, tools and equipment, training facilities, and trainer’s qualification\namong others.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: FOOD AND BEVERAGE SERVICES\nNC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n 18 Hrs. (Common)\n\n 320 Hrs. (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes in FOOD\nAND BEVERAGE SERVICES NC II in accordance with industry standards. It covers the\nbasic, common and core competencies required in the delivery of food and beverage\nservice in various foodservice facilities. It covers the core competencies on preparing the\ndining room for service, welcoming guests and taking food and beverage orders,\npromoting food and beverage products, providing food and beverage service to guests,\nproviding room service, and receiving and handling guest concerns.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Speak English at a\nbasic operational level\n1.3 Participate in\nworkplace meeting and\ndiscussion\n1.4 Complete relevant\nwork related documents\nGroup\nDiscussion\nInteraction\nPractice session\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a\nteam member\n2.3 Work effectively with\ncolleagues\n2.3 Work in a socially\ndiverse environment\nDiscussion\nInteraction\nSimulation\nGames\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\nRole Play\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 65 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 61\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment Approach\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n4.4 Perform basic first-aid\nprocedures\nLecture-\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1\nSeek information on\nthe industry\n1.2\nUpdate continuously\nrelevant industry\nknowledge\n1.3\nDevelop and update\nlocal knowledge\n1.4\nPromote products and\nservices to customers\nLecture\nGroup\nDiscussion\nIndividual/Group\nAssignment\n\nField Visit\nVideo\nPresentation\n\n• Interviews/\nQuestioning\n• Individual/Group\nProject or Report\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1\nFollow hygiene\nprocedures\n2.2\nIdentify and prevent\nhygiene risk\nLecture\nDemonstration\nRole-play\n\nCase Study\n• Demonstration\n• Written\nExamination\n• Interviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1\nPlan and prepare task\nto be undertaken\n3.2\nInput data into a\ncomputer\n3.3\nAssess information\nusing computer\n3.4\nProduce/ output data\nusing computer system\n3.5\nMaintain computer\nsystem\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\nDemonstration\n\nPractice Session\n• Interviews/\nQuestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 66 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 62\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform\nworkplace and\nsafety practices\n4.1\nPractice workplace\nprocedures for health,\nsafety and security\npractices\n4.2\nPerform child\nprotection duties\nrelevant to the tourism\nindustry\n4.3\nObserve and monitor\npeople\n4.4\nDeal with emergency\nsituations\n4.5\nMaintain safe personal\npresentation standards\n4.6\nMaintain a safe and\nsecure workplace\nLecture\nDemonstration\nRole-play\nSimulation\n• Demonstration\n• Interviews/\nQuestioning\n• Written\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1\nGreet customers\n5.2\nIdentify needs of\ncustomers\n5.3\nDeliver service to\ncustomer\n5.4\nHandle queries through\nuse of common\nbusiness tools and\ntechnology\n5.5\nHandle complaints/\nconflict situations,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\n• Demonstration\n• Interviews/\nQuestioning\n• Observation\n\n--- PDF PAGE 67 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 63\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Prepare the\ndining room/\nrestaurant\narea for\nservice\n1.1 Take table\nreservation\n1.2 Prepare service\nstations and\nequipment\n1.3 Set-up the tables in\nthe dining area\n1.4 Set the\nmood/ambiance of\nthe dining area\nLecture-\nDiscussion\nDemonstration\nwith return demo\nRole Play\nAudio-visual\npresentations\nVisual aids\n(photos,\ndrawings)\n• Simulation/\n Practical test\n• Oral questioning\n• Written exam\n2. Welcome\nguests and\ntake food and\nbeverage\norders\n2.1 Welcome and greet\nguests\n2.2 Seat the guest\n2.3 Take food and\nbeverage orders\n2.4 Liaise between\nkitchen and service\nareas\nLecture-\nDiscussion\nDemonstration\nRole Play\n• Simulation/Practical\ntest with oral\nquestioning\n3. Promote food\nand beverage\nproducts\n3.1 Know the product\n3.2 Undertake\nSuggestive selling\n3.3 Carry out Upselling\nstrategies\n\nLecture-\nDiscussion\nRole Play\n• Practical test\n• Oral Questioning\n\n4. Provide food\nand beverage\nservices to\nguests\n4.1 Serve food orders\n4.2 Assist the diners\n4.3 Perform banquet or\ncatering food service\n4.4 Serve beverage\norders\n4.5 Process payments\nand receipts\n4.6 Conclude food\nservice and close\ndown dining area\n4.7 Manage intoxicated\npersons\nLecture-\nDiscussion\nAV/Film viewing\nDemonstration\nRole Play\n• Written or oral\nexamination\n• Practical test\n\n--- PDF PAGE 68 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 64\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Provide room\nservice\n5.1 Take and process\nroom service orders\n5.2 Set up trays and\ntrolleys\n5.3 Present and serve\nfood and beverage\norders to guests\n5.4 Present room service\naccount\n5.5 Clear away room\nservice equipment\nLecture-\nDiscussion\nDemonstration\nRole Play\n• Written or Oral test\n• Practical test\n\n6. Receive and\nhandle guest\nconcerns\n6.1 Listen to the complaint\n6.2 Apologize to the guest\n6.3 Take proper action on\nthe complaint\n6.4 Record complaint\nLecture-\nDiscussion\nRole Play\n• Practical Role play\nor Oral\nexamination\n\n--- PDF PAGE 69 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 65\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should follow to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based on the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended, thus,\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations\n• Modular/self-paced learning is a competency-based training modality where the\ntrainee is allowed to progress at his own pace. The trainer only facilitates the\ntraining delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners\n• Supervised industry training or on-the-job training is a training approach\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies\n\n--- PDF PAGE 70 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 66\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• can communicate in basic English both oral and written\n• at least completed the 10-year basic education\n• can perform basic mathematical computation\n\n3.4\nLIST OF TOOL, EQUIPMENT AND MATERIALS FOR FOOD AND BEVERAGE\nSERVICES NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Food and Beverage Services NC II.\n\nWAITERING TOOLS, MATERIALS AND EQUIPMENT\nQTY\nDINNERWARE\nQTY\nCUTLERIES\nQTY\nGLASSWARE\n24 pcs\nDinner plates,\n10”\n24 pcs.\nDinner knives\n24\npcs.\nRed wine glasses\n6 pcs.\nShow/service\nplates, 11-14”\n24 pcs.\nDinner forks\n24\npcs.\nWhite wine glasses\n24 pcs.\nSalad plates 7-\n8”\n24 pcs.\nSalad knives\n24\npcs.\nWater goblets\n24 pcs.\nFish plates, 8-\n9”\n24 pcs.\nSalad forks\n24\npcs.\nJuice glasses/Hi ball\n24 pcs.\nDessert plates,\n7-8”\n24 pcs.\nFish knives\n24\npcs.\nChampagne flute\n24 pcs.\nSide plates or\nbread plates, 6”\n24 pcs.\nFish forks\n24\npcs. Collins glasses\n24 pcs.\nSoup\nplate/bowl\n24 pcs.\nSoup spoons (cream\nand consume)\n24\npcs.\nPilsner glasses/Ice tea\nglasses\n24 pcs.\nCups and\nsaucers 5-6 oz\n24 pcs. Dessert spoons\n\n24 pcs. Dessert forks\n\n24 pcs. Teaspoons\n\n24 pcs. Cocktail forks\n\n6 pcs.\nService forks\n\n6 pcs.\nService spoons\n\n24 pcs. Steak knives\n\n24 pcs. Butter knives\n\n24 pcs. Oyster forks\n\n--- PDF PAGE 71 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 67\n\nQTY\nOTHER\nSERVICEWARE\nQTY\n\nQTY\nOTHER ACCESSORIES\n2 units Coffee pot\n4\npcs.\n54”X54 table cloth\n2\npcs.\nMenu Folders\n2 units Tea pot\n2\npcs.\nTable skirting cloths\n2\npcs.\nOrder pads\n4pcs\nSalt and Pepper\nshakers\n2\npcs.\nRectangular table\ncloths\n2\npcs.\nBill folder/change trays\n6 pcs\nservice trays\n4\npcs.\nSide towels\n1\nunit\nWaiter station/cabinet\n8 pcs\nSilver platters\n30\npcs.\n16” x16” Cloth Table\nnapkin\n2\npcs.\nTray stand (optional)\n8 pcs\nRound (bar) trays\n\n4 pcs\nTooth pick\nholders\n\nTABLES/CHAIRS\n6 pcs\nNapkin holders\n\n4\npcs.\nSquare/rectangular\ntables (4’s/6’s)\n5 pcs\nSugar containers\n\n2\npcs.\nround tables (8’s)\n5 pcs\nCreamer\ncontainers\n\n36\npcs.\nDining/Banquet chairs\n4 pcs\nSauce/gravy\nboats\n\n4 pcs\nSoup tureen\n\n2 pcs Peppermill\n\n2 pcs\nFood tongs\n\n2 pcs. Sauce ladles\n\n2 pcs. Soup ladles\n\n2 pcs. Cake servers\n\n6 pcs. Water pitchers\n\n8 pcs. (Room Service)\nPlate covers\n\n2 pcs. Ice buckets with\ntongs\n\n--- PDF PAGE 72 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 68\n3.5\nTRAINING FACILITIES\n\nFOOD AND BEVERAGE SERVICES NC II\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in\nSq. Meters\nLecture/Laboratory Area\n5 x 10\n50\n50\nWash Room\n2 x 5\n10\n10\nTool Room/Supply Room\n5 x 4\n20\n20\nCirculation Area\n5 x 5\n25\n25\nTotal Workshop Area :\n105\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM SECTOR (HOTEL AND\nRESTAURANT)\n\nFOOD AND BEVERAGE SERVICES NC II\n\n TRAINER'S QUALIFICATION\n\n• Must be a holder of National TVET Trainers Certificate (NTTC) Level I in Food\nand Beverage Services NC II\n• Must have at least 2 years industry experience\n• Must have attended and/or has been involved in food and beverage service\ntrainings, seminars, conventions or related activities in the last 5 years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 73 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 69"
