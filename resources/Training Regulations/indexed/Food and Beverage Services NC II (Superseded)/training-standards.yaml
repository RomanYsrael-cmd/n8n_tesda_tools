    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: FOOD AND BEVERAGE SERVICES\nNC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n 18 Hrs. (Common)\n\n 320 Hrs. (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes in FOOD\nAND BEVERAGE SERVICES NC II in accordance with industry standards. It covers the\nbasic, common and core competencies required in the delivery of food and beverage\nservice in various foodservice facilities. It covers the core competencies on preparing the\ndining room for service, welcoming guests and taking food and beverage orders,\npromoting food and beverage products, providing food and beverage service to guests,\nproviding room service, and receiving and handling guest concerns.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Speak English at a\nbasic operational level\n1.3 Participate in\nworkplace meeting and\ndiscussion\n1.4 Complete relevant\nwork related documents\nGroup\nDiscussion\nInteraction\nPractice session\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a\nteam member\n2.3 Work effectively with\ncolleagues\n2.3 Work in a socially\ndiverse environment\nDiscussion\nInteraction\nSimulation\nGames\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\nRole Play\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 65 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 61\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment Approach\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n4.4 Perform basic first-aid\nprocedures\nLecture-\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1\nSeek information on\nthe industry\n1.2\nUpdate continuously\nrelevant industry\nknowledge\n1.3\nDevelop and update\nlocal knowledge\n1.4\nPromote products and\nservices to customers\nLecture\nGroup\nDiscussion\nIndividual/Group\nAssignment\n\nField Visit\nVideo\nPresentation\n\n• Interviews/\nQuestioning\n• Individual/Group\nProject or Report\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1\nFollow hygiene\nprocedures\n2.2\nIdentify and prevent\nhygiene risk\nLecture\nDemonstration\nRole-play\n\nCase Study\n• Demonstration\n• Written\nExamination\n• Interviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1\nPlan and prepare task\nto be undertaken\n3.2\nInput data into a\ncomputer\n3.3\nAssess information\nusing computer\n3.4\nProduce/ output data\nusing computer system\n3.5\nMaintain computer\nsystem\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\nDemonstration\n\nPractice Session\n• Interviews/\nQuestioning\n• Demonstration\n• Observation\n\n--- PDF PAGE 66 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 62\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Perform\nworkplace and\nsafety practices\n4.1\nPractice workplace\nprocedures for health,\nsafety and security\npractices\n4.2\nPerform child\nprotection duties\nrelevant to the tourism\nindustry\n4.3\nObserve and monitor\npeople\n4.4\nDeal with emergency\nsituations\n4.5\nMaintain safe personal\npresentation standards\n4.6\nMaintain a safe and\nsecure workplace\nLecture\nDemonstration\nRole-play\nSimulation\n• Demonstration\n• Interviews/\nQuestioning\n• Written\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1\nGreet customers\n5.2\nIdentify needs of\ncustomers\n5.3\nDeliver service to\ncustomer\n5.4\nHandle queries through\nuse of common\nbusiness tools and\ntechnology\n5.5\nHandle complaints/\nconflict situations,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\n• Demonstration\n• Interviews/\nQuestioning\n• Observation\n\n--- PDF PAGE 67 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 63\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Prepare the\ndining room/\nrestaurant\narea for\nservice\n1.1 Take table\nreservation\n1.2 Prepare service\nstations and\nequipment\n1.3 Set-up the tables in\nthe dining area\n1.4 Set the\nmood/ambiance of\nthe dining area\nLecture-\nDiscussion\nDemonstration\nwith return demo\nRole Play\nAudio-visual\npresentations\nVisual aids\n(photos,\ndrawings)\n• Simulation/\n Practical test\n• Oral questioning\n• Written exam\n2. Welcome\nguests and\ntake food and\nbeverage\norders\n2.1 Welcome and greet\nguests\n2.2 Seat the guest\n2.3 Take food and\nbeverage orders\n2.4 Liaise between\nkitchen and service\nareas\nLecture-\nDiscussion\nDemonstration\nRole Play\n• Simulation/Practical\ntest with oral\nquestioning\n3. Promote food\nand beverage\nproducts\n3.1 Know the product\n3.2 Undertake\nSuggestive selling\n3.3 Carry out Upselling\nstrategies\n\nLecture-\nDiscussion\nRole Play\n• Practical test\n• Oral Questioning\n\n4. Provide food\nand beverage\nservices to\nguests\n4.1 Serve food orders\n4.2 Assist the diners\n4.3 Perform banquet or\ncatering food service\n4.4 Serve beverage\norders\n4.5 Process payments\nand receipts\n4.6 Conclude food\nservice and close\ndown dining area\n4.7 Manage intoxicated\npersons\nLecture-\nDiscussion\nAV/Film viewing\nDemonstration\nRole Play\n• Written or oral\nexamination\n• Practical test\n\n--- PDF PAGE 68 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 64\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Provide room\nservice\n5.1 Take and process\nroom service orders\n5.2 Set up trays and\ntrolleys\n5.3 Present and serve\nfood and beverage\norders to guests\n5.4 Present room service\naccount\n5.5 Clear away room\nservice equipment\nLecture-\nDiscussion\nDemonstration\nRole Play\n• Written or Oral test\n• Practical test\n\n6. Receive and\nhandle guest\nconcerns\n6.1 Listen to the complaint\n6.2 Apologize to the guest\n6.3 Take proper action on\nthe complaint\n6.4 Record complaint\nLecture-\nDiscussion\nRole Play\n• Practical Role play\nor Oral\nexamination\n\n--- PDF PAGE 69 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 65"
  },
