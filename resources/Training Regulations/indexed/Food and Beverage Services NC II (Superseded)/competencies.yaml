        "source_text": "--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               57 \nUNIT OF COMPETENCY   : \nRECEIVE AND HANDLE GUEST CONCERNS \n \nUNIT CODE                        : \nTRS512392 \n \nUNIT DESCRIPTOR           : \nThis unit deals with the knowledge and skills required in \nreceiving and handling guest complaints.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Listen to the \ncomplaint \n1.1 \nThe entire story or issue of concern is obtained from \nthe guest without interruption. \n1.2 \nDetails of the guest complaint or concern are noted. \n1.3 \nFull attention is given to the complaining guest. \n1.4 \nGuest complaint is paraphrased to determine if the \nconcern is correctly understood. \n2. Apologize to the \nguest \n2.1 \nSincere apology is offered for the disservice. \n2.2 \nEmpathy is shown to the guest to show genuine \nconcern and consideration. \n2.3 \nExcuses or blaming others are avoided. \n2.4 \nGratitude is expressed to the guest for bringing the \nmatter up for attention. \n3. Take proper action \non the complaint \n3.1 \nAppropriate action is taken regarding guest’s \nconcerns. \n3.2 \nThe right person or department who can solve the \nproblem is informed for proper action. \n3.3 \nDifficult situations or serious concerns are elevated or \nreferred to higher authority. \n3.4 \nProblem is followed-up to check whether it solved or \nnot. \n \n4. Record complaint \n4.1 \nComplaints are documented according to the \nestablishment standard procedures. \n4.2 \nPersons concerned are recognized and actions taken \nare recorded. \n4.3 \nFeedback received from guests is logged and collated.\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               58 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Guest complaint \nMay include: \n1.1 \nUndelivered promise \n1.2 \nPoor condition of property \n1.3 \nDirty property \n1.4 \nPoor service \n1.5 \nUnfriendly personnel \n \n2. Empathy \nMay include: \n2.1 \nAgree truthfully to minor points \n2.2 \nExpress sincere regret  \n2.3 \nThank the guest for bringing up the matter  \n2.4 \nDo not take offense when guest complains \n2.5 \nApproach with friendly spirit \n \n3. Appropriate actions \nMay include: \n3.1 \nProduct replacements \n3.2 \nCorrection \n3.3 \nAddition \n3.4 \nProper endorsement\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               59 \nEVIDENCE GUIDE \n \n1. Critical aspects of  \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nListened and obtained the entire story or complaint \n1.2 \nParaphrased the guest complaint \n1.3 \nShowed empathy towards complaining guest \n1.4 \nTook action on the guest complaint \n1.5 \nRecorded complaint \n \n2. Required Knowledge \n2.1 \nGeneral service principles/Standards of service \n2.2 \nSequence of service \n2.3 \nHandling guests with special needs \n2.4 \nDealing with difficult customer/clients \n \n3. Required Skills \n3.1 \nListening skills \n3.2 \nBasic problem solving skills \n3.3 \nEffective communication skills \n3.4 \nSummarizing and paraphrasing \n \n4. Resource Implications  \n \nThe following resources MUST be provided: \n4.1 \nActual documents or records of guest complaints \n4.2 \nFeedback forms \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nRole play/Simulation to test candidate’s knowledge and \nskills in listening to guest complaints, paraphrasing \nconcerns and taking action on the guest complaint. \n \n6. Context for \nAssessment \nAssessment may be conducted in: \n6.1 \nWorkplace or simulated work environment  or \n6.2 \nTESDA accredited assessment center/venue\n",
