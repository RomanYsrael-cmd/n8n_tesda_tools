e risks\n2.1\nPotential hygiene risks are identified in line with\nenterprise procedures\n2.2\nAction to minimize and remove risks are taken within\nscope of individual responsibility of enterprise/legal\nrequirements\n2.3\nHygiene risks beyond the control of individual staff\nmembers are reported to the appropriate person for\nfollow up\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hygiene procedures\nMay include :\n1.1\nsafe and hygienic handling of food and beverage\n1.2\nregular hand washing\n1.3\ncorrect food storage\n1.4\nappropriate and clean clothing\n1.5\navoidance of cross-contamination\n1.6\nsafe handling disposal of linen and laundry\n1.7\nappropriate handling and disposal of garbage\n1.8\ncleaning and sanitizing procedures\n1.9\npersonal hygiene\n\n2. Hygiene risk\nMay include:\n2.1\nbacterial and other contamination arising from poor\nhandling of food\n2.2\ninappropriate storage of foods\n2.3\nstorage at incorrect temperatures\n2.4\nfoods left uncovered\n2.5\npoor personal hygiene practices\n2.6\npoor work practices\n2.6.1 cleaning\n2.6.2 housekeeping\n2.6.3 food handling\n2.6.4 vermin\n2.6.5 airborne dust\n2.7\ncross-contamination through cleaning inappropriate\ncleaning practices\n2.8\ninappropriate handling of potentially infectious linen\n2.9\ncontaminated wastes such as blood and body\nsecretions\n2.10 disposal of garbage and contaminated or potentially\ncontaminated wastes\n\n3. Minimizing or\nremoving risk\nMay include:\n3.1\nauditing staff skills and providing training\n3.2\nensuring policies and procedures are followed strictly\n3.3\naudits or incidents with follow up actions\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 20\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment required evidence that the candidate :\n1.1\nFollowed hygiene procedures\n1.2\nIdentified and responded to hygiene risk\n1.3\nPracticed personal grooming and hygiene\n\n2. Required Knowledge\n2.1\nTypical hygiene and control procedures in the hospitality\nand tourism industries\n2.2\nOverview of legislation and regulation in relation to food\nhandling, personal and general hygiene\n2.3\nKnowledge on factors which contribute to workplace\nhygiene problems\n2.4\nGeneral hazards in handling of food, linen and laundry\nand garbage, including major causes of contamination\nand cross-infection\n2.5\nSources of and reasons for food poisoning\n\n3. Required Skills\n3.1\nAbility to follow correct procedures and instructions\n3.2\nAbility to handle operating tools/ equipment\n3.3\nApplication to hygiene principles\n\n4. Resource Implications The following resources should be provided:\n4.1\nHygiene procedures, actual or simulated workplace,\nproducts used in hotel/restaurant /tourism workplace\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 21\nUNIT OF COMPETENCY :\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\nTRS311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and\nvalues needed to perform computer operations which\nincludes inputting, accessing, producing and transferring\ndata using the appropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be undertaken\n1.1\nRequirements of task are determined\n1.2\nAppropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3\nTask is planned to ensure OH & S guidelines and\nprocedures are followed\n\n2. Input data into\ncomputer\n2.1\nData are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2\nAccuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3\nInputted data are stored in storage media according to\nrequirements\n2.4\nWork is performed within ergonomic guidelines\n\n3. Access information\nusing computer\n3.1\nCorrect program/application is selected based on job\nrequirements\n3.2\nProgram/application containing the information required\nis accessed according to company procedures\n3.3\nDesktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4\nKeyboard techniques are carried out in line with OH & S\nrequirements for safe use of keyboards\n\n4. Produce/output data\nusing computer\nsystem\n4.1\nEntered data are processed using appropriate software\ncommands\n4.2\nData are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3\nFiles and data are transferred between compatible\nsystems using computer software, hardware/ peripheral\ndevices in accordance with standard operating\nprocedures\n\n5. Maintain computer\nequipment and\nsystems\n5.1\nSystems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2\nProcedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3\nBasic file maintenance procedures are implemented in\nline with the standard operating procedures\n5.4\nDocument systems are maintained\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\nMay include:\n1.1\nPersonal computers\n1.2\nNetworked systems\n1.3\nCommunication equipment\n1.4\nPrinters\n1.5\nScanners\n1.6\nKeyboard\n1.7\nMouse\n\n2. Software\nMay include:\n2.1\nWord processing packages\n2.2\nData base packages\n2.3\nInternet\n2.4\nSpreadsheets\n\n3. OH & S guidelines\nMay include:\n3.1\nOHS guidelines\n3.2\nEnterprise procedures\n\n4. Storage media\nMay include:\n4.1\ndiskettes\n4.2\nCDs\n4.3\nzip disks\n4.4\nhard disk drives, local and remote\n\n5. Ergonomic guidelines\nMay include:\n5.1\nTypes of equipment used\n5.2\nAppropriate furniture\n5.3\nSeating posture\n5.4\nLifting posture\n5.5\nVisual display unit screen brightness\n\n6. Desktop icons\nMay include:\n6.1\ndirectories/folders\n6.2\nfiles\n6.3\nnetwork devices\n6.4\nrecycle bin\n\n7. Maintenance\nMay include:\n7.1\nCreating more spaces in the hard disk\n7.2\nReviewing programs\n7.3\nDeleting unwanted files\n7.4\nBacking up files\n7.5\nChecking hard drive for errors\n7.6\nUsing up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 23\nEVIDENCE GUIDE\n\n1. Critical aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nSelected and used hardware components correctly and\naccording to the task requirement\n1.2\nIdentified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3\nProduced accurate and complete data in accordance\nwith the requirements\n1.4\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.5\nMaintained computer system\n2. Required Knowledge\n2.1\nBasic ergonomics of keyboard and computer use\n2.2\nMain types of computers and basic features of different\noperating systems\n2.3\nMain parts of a computer\n2.4\nStorage devices and basic categories of memory\n2.5\nRelevant types of software\n2.6\nGeneral security\n2.7\nViruses\n2.8\nOH & S principles and responsibilities\n2.9\nCalculating computer capacity\n\n3. Required Skills\n3.1\nReading skills required to interpret work instruction\n3.2\nCommunication skills\n\n4. Resource Implications\nThe following resources should be provided:\n4.1 Computer hardware with peripherals\n4.2 Appropriate software\n5. Methods of\nAssessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n5.1\nObservation\n5.2\nQuestioning\n5.3\nPractical demonstration\n\n6. Context for\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 24\nUNIT OF COMPETENCY :\nPERFORM WORKPLACE AND SAFETY PRACTICES\n\nUNIT CODE\n:\nTRS311204\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in following health, safety and security\npractices. It includes dealing with emergency situations\nand maintaining safe personal presentation standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Follow workplace\nprocedures for health,\nsafety and security\npractices\n1.1\nCorrect health, safety and security procedures are\nfollowed in line with legislation, regulations and\nenterprise procedures\n1.2\nBreaches of health, safety and security procedures are\nidentified and reported in line with enterprise procedure\n1.3\nSuspicious behavior or unusual occurrence are reported\nin line with enterprise procedure\n\n2. Perform child\nprotection duties\nrelevant to the tourism\nindustry\n\n2.1 Issue of sexual exploitation of children is identified\n2.2 National, regional and international actions are described\nto prevent the sexual exploitation of children\n2.3 Actions that can be taken in the workplace are described\nto protect children from sexual exploitation\n3. Observe and monitor\npeople\n3.1 Areas and people who require observation and\nmonitoring is prepared\n3.2 Observation and monitoring activities are implemented\n3.3 Apprehension of offenders are determined\n3.4 Offenders are arrested according to enterprise\nprocedures\n3.5 Administrative responsibilities are fulfilled\n4. Deal with emergency\nsituations\n4.1\nEmergency and potential emergency situations are\nrecognized and appropriate action are taken within\nindividual’s scope of responsibility\n4.2\nEmergency procedures are followed in line with\nenterprise procedures\n4.3\nAssistance is sought from colleagues to resolve or\nrespond to emergency situations\n4.4\nDetails of emergency situations are reported in line with\nenterprise procedures\n\n5. Maintain safe personal\npresentation\nstandards\n\n5.1\nSafe personal standards are identified and followed in\nline with enterprise requirements\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 25\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n6. Maintain a safe and\nsecure workplace\n6.1 Workplace health, safety and security responsibilities are\nidentified\n6.2 Framework to maintain workplace health, safety and\nsecurity are and maintained\n6.3 Procedures for identifying or assessing health, safety\nand security hazards and risks are implemented\n6.4 Injuries, illnesses and incidents are investigated\n6.5 Organization's health, safety and security effectiveness\nare evaluated\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 26\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health, safety and\nsecurity procedures\nMay include:\n1.1\nUse of personal protective clothing and equipment\n1.2\nSafe posture including sitting, standing, bending\n1.3\nManual handling including lifting, transferring\n1.4\nSafe work techniques including knives and equipment,\nhandling hot surfaces, computers and electronic\nequipment\n1.5\nSafe handling of chemicals, poisons and dangerous\nmaterials\n1.6\nErgonomically sound furniture and work stations\n1.7\nEmergency fire and accident\n1.8\nHazard identification and control\n1.9\nSecurity of documents, cash, equipment, people\n1.10 Key control systems\n\n2. Breaches of procedure\nMay include:\n2.1\nLoss of keys\n2.2\nStrange or suspicious persons\n2.3\nBroken or malfunctioning equipment\n2.4\nLoss of property, goods or materials\n2.5\nDamaged property or fittings\n2.6\nLack of suitable signage when required\n2.7\nLack of training on health and safety issues\n2.8\nUnsafe work practices\n\n3. Emergency\nMay include:\n3.1\nPersonal injuries\n3.2\nFire\n3.3\nElectrocution\n3.4\nNatural calamity i.e. earthquake/flood\n3.5\nCriminal acts i.e. robbery\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 27\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with workplace safety, security and hygiene\npractices\n1.4\nIdentified faults & problems and the necessary\ncorrective action\n1.5\nDemonstrated ability to perform child protection duties\nrelevant to the tourism industry\n1.6\nDemonstrated ability to prepare for observation and\nmonitoring activities relevant to designated situations\n1.7\nPromoted public relation among others\n1.8\nComplied with quality standards\n1.9\nResponded to emergency situations in line with\nenterprise guidelines\n1.10 Complied with proper dress code\n\n2. Required Knowledge\nand Attitude\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills\n2.1.3 Good working attitude\n2.1.4 Ability to work quietly; with cooperation; patience,\ncarefulness, cleanliness and aesthetic values\n2.1.5 Ability to focus on task at hand\n2.2\nSystems, Processes and Operations\n2.2.1 Workplace health, safety and security procedures\n2.2.2 Emergency procedures\n2.2.3 Personal presentation\n2.3\nSafety Practices\n2.3.1 Proper disposal of garbage\n2.3.2 Practice safety measures\n2.3.3 5S Implementation\n2.4 Child protection duties relevant to tourism industry\n 2.4.1 Rules, regulations, policies and laws\n3. Required Skills\n3.1\nAbility to make decision\n3.2\nTime management\n3.3\nAbility to offer alternative steps\n3.4\nCare in handling and operating equipment\n3.5\nAbility to use observation and monitoring techniques\n\n4. Resource Implications The following resources should be provided:\n4.1\nProcedures Manual on safety, security, health and\nemergency\n4.2\nAvailability of tools, equipment, supplies and materials\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 28\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n5.3\nInterview\n\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 29\nUNIT OF COMPETENCY :\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n:\nTRS311205\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in providing effective customer service. It\nincludes greeting customer, identifying customer needs,\ndelivering service to customer, handling queries through\nuse of common business tools and technology and\nhandling complaints/conflict situation, evaluation and\nrecommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Greet customer\n1.1\nCustomers are greeted according to enterprise\nprocedure\n1.2\nVerbal and non-verbal communications are appropriate\nto the given situation\n1.3\nNon verbal communication are observed when\nresponding to customers\n1.4\nSensitivity to cultural and social differences is\ndemonstrated\n\n2. Identify needs of\ncustomers\n2.1\nAppropriate interpersonal skills are used to ensure\nthat customer needs are accurately identified\n2.2\nCustomer needs are assessed for urgency so that\npriority for service delivery can be identified\n2.3\nCustomers are provided with information\n2.4\nPersonal limitation in addressing customer and\ncolleague needs is identified and where appropriate,\nassistance is sought from supervisor\n\n3. Deliver service to\ncustomer\n3.1 Customer needs are promptly attended to in line with\nenterprise procedure\n3.2 Appropriate rapport is maintained with customer to\nenable high quality service delivery\n3.3 Opportunity to enhance the quality of service and\nproducts are taken wherever possible\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 30\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n4. Handle queries through\nuse of common\nbusiness tools and\ntechnology\n4.1 Common business tools and technology are used\nefficiently to determine customer requirements\n4.2 Queries/ information are recorded in line with enterprise\nprocedure\n4.3 Queries are acted upon promptly and correctly in line\nwith enterprise procedure\n\n5. Handle complaints/\nconflict situations,\nevaluation and\nrecommendations\n5.1 Guests are greeted with a smile and eye-to-eye contact\n5.2 Responsibility for resolving the complaint is taken\nwithin limit of responsibility and according to enterprise\npolicy\n5.3 Nature and details of complaint are established and\nagreed with the customer\n5.4 Threats to personal safety are identified and managed\nto personal safety of customers or colleagues and\nappropriate assistance is organized\n5.4 Appropriate action is taken to resolve the complaint to\nthe customers satisfaction wherever possible\n5.5 Conflict situations are resolved within scope of individual\nresponsibility by applying effective communication skills\nand according to enterprise policy\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 31\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Customers\nMay include:\n1.1 internal\n1.2 external\n2. Non-verbal\ncommunication\nMay include:\n2.1\nbody language\n2.2\ndress and accessories\n2.3\ngestures and mannerisms\n2.4\nvoice tonality and volume\n2.5\nuse of space\n2.6\nculturally specific communication customs and\npractices\n3. Cultural and social\ndifferences\nMay include:\n3.1\nmodes of greeting, farewell and conversation\n3.2\nbody language/ use of body gestures\n3.3\nformality of language\n4. Interpersonal skills\nMay include:\n4.1\ninteractive communication\n4.2\npublic relation\n4.3\ngood working attitude\n4.4\nsincerity\n4.5\npleasant disposition\n4.6\neffective communication skills\n5. Customer needs\nMay include:\n5.1\nthose with a disability\n5.2\nthose with special cultural or language needs\n5.3\nunaccompanied children\n5.4\nparents with young children\n5.5\npregnant women\n5.6\nsingle women\n6. Enterprise procedure\nMay include:\n6.1 modes of greeting and farewell\n6.2 addressing the person by name\n6.3 time-lapse before a response\n6.4 style manual requirements\n6.5 standard letters and format\n7. Business tools and\ntechnology\nMay include:\n7.1 telephone\n7.2 fax machine\n7.3 computer equipment\n7.4 internet, email\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 32\n\nVARIABLE\nRANGE\n8. Complaint\nMay include:\n8.1 level of service\n8.2 product standards\n8.3 processes\n8.4 information given\n8.5 charges and fees\n9. Threats to personal\nsafety\nMay include:\n9.1 violent customers\n9.2 drug and alcohol affected customers\n9.3 customers fighting amongst themselves\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 33\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with occupational, health and safety practices\n1.4\nPromoted public relation among others\n1.5\nComplied with service manual standards\n1.6\nDemonstrated familiarity with company facilities,\nproducts and services\n1.7\nDemonstrated ability to work effectively with others\n1.8\nApplied company rules and standards\n1.9\nApplied telephone ethics\n1.10 Applied correct procedure in using telephone, fax\nmachine, internet\n1.11 Handled customer complaints within limit of individual\nresponsibility\n\n2. Required Knowledge\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with\nsincerity\n2.2\nSafety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3\nAttitude\n2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4\nTheory\n2.4.1 Selling/up selling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n\n3. Required Skills\n3.1\nEffective communication skills\n3.2\nNon-verbal communication - body language\n3.3\nGood time management\n3.4\nAbility to work calmly and unobtrusively effectively\n3.5\nAbility to handle telephone inquiries and conversations\n3.6\nCorrect procedure in handling telephone inquiries\n3.7\nProper way of handling complaints\n3.8\nAbility to apply basic principles of conflict resolution and\nrespond to complaints\n4. Resource Implications The following resources should be provided\n4.1\nAvailability of telephone, fax machine, internet,\netc.\n4.2\nAvailability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3\nAvailability of office supplies\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through\n5.1\nWritten examination\n5.2\nPractical demonstration\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 34\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPREPARE THE DINING ROOM/RESTAURANT AREA\nFOR SERVICE\n\nUNIT CODE\n:\nTRS512387\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required in the\npreparation of the dining room /restaurant area before the\nstart of the service operations. It involves opening duties\nor the dining room mise-en-place prior to service. This\nunit includes the knowledge and skills in taking\nreservations, preparing service stations, table-setting,\nand setting the ambiance of the food service facility.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Take table\nreservations\n1.1\nInquiries are answered promptly, clearly and\naccurately.\n1.2\nPertinent questions are asked to complete the details of\nthe reservations.\n1.3\nReservations data are recorded on forms accurately\nbased on establishment’s standards.\n1.4\nDetails of the reservations are repeated back and\nconfirmed with the party making the reservation.\n1.5\nAdditional information about the food service\nestablishment is provided when necessary.\n\n2. Prepare service\nstations and\nequipment\n\n2.1\nService or waiter’s stations are stocked with supplies\nnecessary for service.\n2.2\nAll tableware and dining room equipment are\ncleaned, wiped and put in their proper places.\n2.3\nSpecial tent cards and similar special displays are put\nup for promotion.\n2.4\nCleanliness and condition of all tables, tableware and\ndining room equipment are checked.\n2.5\nWater pitchers and ice buckets are filled.\n2.6\nElectrical appliance or equipment like coffee pots, tea\npots, plate warmers etc. in the dining area are turned on\nand kept ready.\n2.7\nCondiments and sauce bottles are refilled and the necks\nand tops of the bottles are wiped clean and dry.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 35\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n3. Set up the tables in\nthe dining area\n3.1\nTables are set according to the standards of the food\nservice establishment.\n3.2\nIn cases where the menu is pre-arranged or fixed,\ncovers are set correctly according to the predetermined\nmenu.\n3.3\nTableware and glassware are wiped and polished\nbefore they are set up on the table.\n3.4\nCloth napkins are folded properly and laid on the table\nappropriately according to napkin folding style.\n3.5\nBuffet or display tables are skirted properly taking into\naccount symmetry, balance and harmony in size and\ndesign.\n4. Set the\nmood/ambiance of the\ndining area\n4.1\nLights are adjusted according to time of the day.\n4.2\nTables, chairs and other dining room furniture are\narranged to ensure comfort and convenience of the\nguests.\n4.3\nAppropriate music is played when applicable\n4.4\nFloors/carpets are cleaned and made sure are dry.\n4.5\nAir-condition or cooling units are adjusted for the\ncomfort of the guests\n4.6\nDecorations are set-up according to theme or concept of\nthe dining room.\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Inquiries\nMay be received through the following:\n1.1\nTelephone\n1.2\nFax\n1.3\nEmail\n1.4\nInternet\n1.5\nIn person\n\n2. Details of the\nreservation\nMay include:\n2.1\nDate of reservation\n2.2\nTime of arrival\n2.3\nNumber of persons\n2.4\nName of person who will use the reservation\n2.5\nName of person making the reservation\n2.6\nContact details of the person checking in and of the\nperson making the reservation\n2.7\nSpecial requirements\n\n3. Reservation records or\nforms\nMay include:\n3.1\nReservation Sheets\n3.2\nLogbook\n3.3\nComputer\n3.4\nReservation Cards\n\n4. Supplies\nMay include:\n4.1\nNapkins\n4.2\nMenu folders\n4.3\nOrder slips\n4.4\nWine list\n4.5\nCondiments\n4.6\nToothpicks\n4.7\nTable cloth/Placemats\n4.8\nSalt and Pepper shakers\n\n5. Tableware\nMay include:\n5.1\nDinnerware/chinaware\n5.1.1 Cover/service plate\n5.1.2 Dinner plate\n5.1.3 Entrée plate\n5.1.4 Fish plate\n5.1.5 Bread plate\n5.1.6 Soup bowl/plate\n5.1.7 Cups and saucers\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 37\n\nVARIABLE\nRANGE\n\n5.2\nGlassware\n5.2.1 Stem wares\n5.2.2 Footed wares\n5.2.3 Tumblers\n5.2.4 Mugs\n5.3\nSilverware/Flatware\n5.3.1 Dinner fork\n5.3.2 Dinner spoon\n5.3.3 Soup spoon\n5.3.4 Butter knife/spreader\n5.3.5 Steak knife\n5.3.6 Fish Fork\n5.3.7 Dessert fork\n5.3.8 Teaspoon\n5.4\nHolloware\n5.4.1 Soup tureen\n5.4.2 Platters\n5.4.3 Coffeepots\n5.4.4 Teapots\n\n6. Dining room/\nRestaurant equipment\n\nMay include:\n6.1\nService tray stands\n6.2\nGueridon\n6.3\nCake display\n6.4\nRefrigerators/Chillers\n6.5\nCoffee makers/machines\n6.6\nPoint Of Sales (POS)\n6.7\nWine service equipment\n\n7. Napkin folding styles\nMay include:\n7.1\nPyramid\n7.2\nBird of Paradise\n7.3\nBishop’s Hat\n7.4\nRose bud\n7.5\nSail\n7.6\nCandle\n7.7\nCrown\n7.8\nGoblet Fan\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 38\n\nVARIABLE\nRANGE\n8. Table skirting designs\nMay include but not limited to:\n8.1\nDiamond style\n8.2\nPleated box\n8.3\nShirred Pleat\n8.4\nSingle Pleats\n8.5\nTulips\n8.6\nScallops\n8.7\nButterfly\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 39\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nTook table reservations accurately\n1.2\nIdentified and explained the use of the different food\nand beverage wares and equipment e.g. Dinnerware,\nglassware, silverware etc.\n1.3\nCompleted and prepared service or waiter’s station\n1.4\nSet up tables according to predetermined menu\n1.5\nPerformed different table napkin folding styles\n2. Required Knowledge\n2.1\nFoodservice operations\n2.2\nReservations process\n2.3\nBasic types of tableware\na..Dinnerware\nb. Beverageware/glassware\nc. Silverware/cutlery\n2.4\nGeneral rules in laying covers/table set-up\n2.5\nDifferent napkin folding styles\n2.6\nStation mise-en-place\n2.7\nTelephone ethics\n2.8\nTable skirting styles\n2.9\nBanquet set-up styles\n3. Required Skills\n3.1\nTaking reservations\n3.2\nTable set-up\n3.3\nNapkin folding\n3.4\nSkirting buffet/display tables\n3.5\nBanquet set-ups\n4. Resource\nImplications\n\nThe following resources MUST be provided:\n4.1\nDifferent tableware and dining room equipment.\n4.2\nTable skirting and set-up paraphernalia\n4.3\nCloth napkins (correct size and material)\n5. Methods of\nAssessment\n\nCompetency may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on the different tableware and equipment\nand Station mise-en-place\n5.2\nSimulation/role play to test the candidate’s knowledge\nand skills in taking reservations telephone skills\n5.3\nPractical/Demonstration for table setting, skirting and\nnapkin folding\n5.4\nDemonstration to show the types of service\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 40\n\nUNIT OF COMPETENCY: WELCOME GUESTS AND TAKE FOOD AND BEVERAGE\nORDERS\n\nUNIT CODE : TRS512388\n\nUNIT DESCRIPTOR : This unit deals with the knowledge and skills required in\nproviding pre-meal services to the dining guests as soon as\nthey arrive in the foodservice facility. It covers the dining\nroom or restaurant service procedures before the food and\nbeverage orders are served. This unit involves the initial\nsteps in the sequence of service that includes the welcoming\nof guests, seating the guests, taking food and beverage\norders and liaising between the kitchen and the service\narea.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of\nVariables\n1. Welcome\nand\ngreet\nguests\n1.1 Guests are acknowledged as soon as they arrive.\n1.2 Guests are greeted with an appropriate welcome.\n1.3 Details of reservations are checked based on\nestablished standard policy.\n2. Seat the guests\n2.1 Guests are escorted and seated according to table\nallocations\n2.2 Tables are utilized according to the number of\nparty.\n2.3 Guests are seated evenly among stations to control\nthe traffic flow of guests in the dining room.\n2.4 Cloth napkins are opened for the guests when\napplicable.\n2.5 Water is served when applicable, according to the\nstandards of the foodservice facility.\n3. Take food and beverage\norders\n3.1 Guests are presented with the menu according to\nestablished standard practice.\n3.2 Orders are taken completely in accordance with\nthe establishment’s standard procedures.\n3.3 Special requests and requirements are noted\naccurately.\n3.4 Orders are repeated back to the guests to confirm\nitems.\n3.5 Tableware and cutlery appropriate for the menu\nchoices are provided and adjusted in accordance\nwith establishment procedures.\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 41\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of\nVariables\n4. Liaise between kitchen\nand service areas\n4.1 Orders are placed and sent to the kitchen promptly.\n4.2 Quality of food is checked in accordance with\nestablishment standards\n4.3 Tableware is checked for chips, marks, cleanliness,\nspills, and drips\n4.4 Plates and/or trays are carried out safely.\n4.5 Colleagues are advised promptly regarding\nreadiness of items for service\n4.6 Information about special requests, dietary or\ncultural requirements is relayed accurately to\nkitchen where appropriate.\n4.7 Work technology are observed according to\nestablishment standard policy and procedures\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 42\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Types of menu\nMay include:\n1.1\nA la carte\n1.2\nTable d’hote\n1.3\nCarte du jour\n2. Ordering systems\nMay include:\n2.1\nDocket system\n2.2\nChecklist\n2.3\nBlank order slips\n2.4\nTouchscreen POS system\n3. Work technology\nMay include:\n3.1 POS\n3.2 Electronic tablet order\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 43\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Welcomed and greeted the guests\n1.2 Took food and beverage orders\n1.3 Liaised between kitchen and service areas\n2. Required\nKnowledge\n2.1\nWelcoming and greeting guests procedures\n2.2\nSeating guests procedures\n2.3\nSequence of Food Service\n2.4\nBasic Menu types\n2.5\nOrder taking procedures\n2.6\nPrinciples of promotion and selling\n2.7\nSuggestive selling techniques\n2.8\nProduct and service knowledge\n3. Required Skills\n3.1\nBasic communication skills\n3.2\nTaking food and beverage order\n3.3\nSkill in Technology knowledge (e.g. POS, electronic order\ntablet, etc.\n4. Resource\nImplications\nThe following resources must be provided:\n4.1\nDifferent order taking systems\n4.2\nDifferent menu forms\n5. Methods of\nAssessment\n\nCompetency may be assessed through :\n5.1 Practical demonstration or\n5.2 Simulation/role plays to test the candidate’s knowledge and skills\nin:\na. Welcoming and greeting guests\nb. Seating the guests\nc. Taking food and beverage orders.\n6. Context for\nAssessment\nAssessment must be conducted in\n6.1 Workplace or simulated work environment or\n6.2 TESDA accredited assessment center/venue\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 44\nUNIT OF COMPETENCY: PROMOTE FOOD AND BEVERAGE PRODUCTS\n\nUNIT CODE : TRS512389\n\nUNIT DESCRIPTOR : This unit deals with the knowledge and skills required in\nproviding advice to customers on food and beverage\nproducts in foodservice enterprises.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Know the product\n1.1 Names and pronunciations of dishes in the menu\nare mastered.\n1.2 Ingredients of dishes are memorized.\n1.3 Sauces and accompaniments are known by heart.\n1.4 Descriptions of every item in the menu are studied.\n1.5 Common food allergens are mastered to prevent\nserious health consequences.\n2. Undertake Suggestive\nselling\n\n2.1 Information about the food items are provided in\nclear explanations and descriptions.\n2.2 Items on specials or promos are offered to assist\nguests with food and beverage selections.\n2.3 Name of specific menu items are suggested to\nguests rather than just mentioning the general\ncategories in the menu to help them make the\nchoice and know what they want.\n2.4 Standard food and beverage pairings are\nrecommended.\n2.5 Several choices are given to provide more options\nto guests\n2.6 Descriptive words are used while explaining the\ndishes to make it more tempting and appetizing.\n2.7 Suggestive selling is carried out discreetly so as\nnot to be too pushy or too aggressive.\n3. Carry out Upselling\n strategies\n3.1 Slow moving but highly profitable items are\nsuggested to increase guest check.\n3.2 Second servings of items ordered are offered.\n3.3 Food portion or size is mentioned for possible\nadjustments with the orders.\n3.4 New items are recommended to regular guests to\nencourage them to try other items in the menu.\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 45\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information about the food\nMay include:\n1.1 Cooking method\n1.2 Serving portions\n1.3 Tastes and flavors\n1.4 Ingredients including food allergens\n1.5 Cooking time\n1.6 Side dishes\n2. Items on specials or promos\nMay include:\n2.1 House specials\n2.2 Soup of the day\n2.3 Combo meals\n2.4 Best sellers\n2.5 Chef’s pick\n2.6 Seasonal items\n3. General categories in the menu\nMay include:\n3.1 Meat\n3.2 Vegetable\n3.3 Dessert\n3.4 Beverages\n3.5 Entrée\n3.6 Seafood\n4. Standard food and beverage\npairings\nMay include:\n4.1 Burgers and fries\n4.2 Steaks and salad\n4.3 Steak and mashed potato\n4.4 Dessert and coffee\n4.5 Seafood with white wine\n5. Descriptive words\nMay include:\n5.1 Freshly prepared\n5.2 Delicately seasoned\n5.3 Soft and juicy\n5.4 Mouth watering\n5.5 Flavorful\n5.6 Spicy\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 46\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Demonstrated ability to apply relevant food and beverage\nproduct knowledge\n1.2 Provided advice on food and beverage compatibility\n1.3 Demonstrated ability to apply up selling products knowledge\n2. Required\nKnowledge\n2.1 Menu familiarization\n2.2 Types of Menus\n2.3 Food pairing\n2.4 Beverage pairing\n2.5 Suggestive selling techniques and principles\n2.6 Upselling techniques\n2.7 Food allergens\n3. Required Skills\n3.1 Basic communication skills\n3.2 Ability to apply selling techniques\n3.3 Ability to make suggestions and recommendations in line with\ncustomer wants and needs\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Menu\n4.2 Order taking systems\n5. Methods of\nAssessment\n\nCompetency may be assessed through:\n5.3 Practical demonstration or\n5.4 Simulation/role plays to test the candidate’s knowledge and skills\nin suggestive selling and up selling\n6. Context for\nAssessment\nAssessment must be conducted in\n6.1 Workplace or simulated work environment or\n6.2 TESDA accredited assessment center/venue\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 47\nUNIT OF COMPETENCY :\nPROVIDE FOOD AND BEVERAGE SERVICES TO\nGUESTS\n\nUNIT CODE\n:\nTRS512390\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required in\nthe provision of food and beverage service to guests in\nvarious types of dining venues and diverse styles of\nservice. This unit focuses on the procedures in the\ndelivery of food and beverages to the guest as well as on\nthe knowledge and skills that underpins the efficient work\nperformance in assisting the dining guest during and after\nthe meal service.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Serve food orders\n\n1.1\nFood orders are picked up promptly from service areas.\n1.2\nFood orders are checked for presentation and\nappropriate garnish and accompaniments.\n1.3\nFood orders are served to the guests who ordered\nthem.\n1.4\nFood orders are served and cleared with minimal\ndisturbance to the other guests and in accordance to\nhygienic requirements.\n1.5\nFood orders are served in accordance with the\nenterprise serving style standards.\n1.6\nName of the dish or order is mentioned upon serving the\nguest.\n1.7\nSequence of service and meal delivery is monitored in\naccordance with enterprise procedures.\n\n2. Assist the diners\n2.1\nAdditional requests or needs of the guests are\nanticipated.\n2.2\nAdditional food and beverage are offered and served at\nthe appropriate times.\n2.3\nNecessary condiments and appropriate tableware are\nprovided based on the food order.\n2.4\nDelays or deficiencies in service are recognized and\nfollowed up promptly based on enterprise policy.\n2.5\nThe “3-minute check” is conducted to check guest ‘s\nsatisfaction.\n2.6\nChildren and guests with special needs are treated\nwith extra attention and care.\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 48\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n3. Perform banquet or\ncatering food service\n3.1\nServiceware are prepared and checked for\ncompleteness ahead of time.\n3.2\nTables and chairs are set up in accordance with the\nevent requirements.\n3.3\nFood is served according to general service\nprinciples.\n3.4\nFood is handled based on food safety procedures.\n3.5\nCoordinated service of meal courses is ensured.\n3.6\nAssigned areas are kept clean in accordance with\nenterprise procedures.\n3.7\nTables are cleared and soiled dishes prepared to be\nbrought for dishwashing after the event or function,\n3.8\nNumber of guests being served is noted and monitored.\n\n4. Serve Beverage\nOrders\n4.1\nBeverage orders are picked up promptly from the bar.\n4.2\nBeverage orders are checked for presentation and\nappropriate garnishes.\n4.3\nBeverages are served at appropriate times during meal.\n4.4\nBeverages are served efficiently according to\nestablished standards of service.\n4.5\nBeverages are served at the right temperature.\n4.6\nFor full bottle wine orders, wine is opened efficiently with\nminimal disturbance to the other guests.\n4.7\nWine service is carried out in accordance with\nestablishment procedures.\n4.8\nCoffee and/or tea service is carried out in accordance\nwith establishment procedure.\n5. Process payments and\nreceipts\n5.1 Bills are prepare and processed accurately in\ncoordination with cashier.\n5.2 Amount due is verified with customer.\n5.3 Cash and non-cash payments are accepted and\nreceipts are issued.\n5.4 Change are given as required.\n5.5 Required documentation is completed in accordance\n with enterprise policy.\n6. Conclude food service\nand close down dining\narea\n6.1 Soiled dishes are removed when guests are finished\nwith the meal.\n6.2 Food scraps are handled in accordance with hygiene\nregulations and enterprise procedures.\n6.3 Equipment are cleaned and stored in accordance with\nhygiene regulations and enterprise procedures.\n6.4 Tables are cleared, reset and made ready for the next\nsitting when guests are finished with the meal.\n6.5 Guests are thanked and given a warm farewell.\n6.6 Electrical equipment are turned off where appropriate.\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 49\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n7. Manage intoxicated\npersons\n7.1 Levels of intoxication of customers are determined\n7.2 Difficult situations are referred to an appropriate person\n7.3 Appropriate procedures are applied to the situation and\nin accordance with enterprise policy\n7.4 Legislative requirements are applied\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 50\nRANGE OF VAIABLES\n\nVARIABLE\nSCOPE\n1. Serving styles\nMay include:\n1.1\nAmerican Service (Plate Service)\n1.2\nRussian Service (Platter Service)\n1.3\nBuffet Service\n2. Sequence of service\nMay include:\n2.1\nWelcoming/Greeting of guest\n2.2\nSeating the guest\n2.3\nTaking beverage orders\n2.4\nPresenting the menu\n2.5\nTaking food orders\n2.6\nWine service\n2.7\nServing food orders\n2.8\nCrumbling/brushing table\n2.9\nCoffee/tea service\n2.10 Preparing and presenting the bill\n3. 3-Minute Check\nMay include:\n3.1\nEnsure guest satisfaction about their meals\n3.2\nReplenish condiments\n3.3\nProviding additional items\n3.4\nClear unused items\n4. Guests with special\nneeds\nMay include:\n4.1\nChildren\n4.2\nElderly people\n4.3\nPersons with Disability\n4.4\nVIP guests\n5. General service\nprinciples\nMay include:\n5.1\nNever reach in front of the guest when serving\nanother.\n5.2\nDo not place dirty, chipped, cracked tableware before\nthe guest.\n5.3\nHandle flatware/cutleries and glassware properly\n5.4\nGlasses should never be filled too full.\n5.5\nGlasses are handled by the base or the stem.\n5.6\nCrumb table when necessary.\n6. Beverages\nMay include:\n6.1\nAlcoholic beverages\n6.2\nNon-Alcoholic beverages( e.g. juices, sodas, coffee,\ntea)\n7. Wine service\n\nMay include:\n7.1\nPresenting the wine.\n7.2\nOpening wine\n7.3\nPouring wine\n8. Cash payments\nMay include:\n8.1 Payment in notes and coins\n8.2 Payment in a foreign currency\n8.3 Calculating currency exchange rates\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 51\n\nVARIABLE\nSCOPE\n9. Non-cash payments\nMay include:\n9.1 Debit and credit cards\n9.2 Checks (Personal, business, travelers)\n9.3 In-house vouchers\n9.4 Charges to company accounts\n\n10. Receipts issued\nMay include:\n10.1 Issuing receipts via cash register/terminal\n10.2 Issuing hand written receipt\n10.3 Complying with legal requirements of host country to\nprovide receipt\n11. Required\ndocumentation\nMay include:\n11.1 Internal documentation\n11.2 External agent documentation\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 52\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Performed the various styles of food service\n1.2 Demonstrated service principles\n1.3 Explained the sequence of service\n1.4 Performed the “3-minute” check\n1.5 Described how to handle guests with special needs\n1.6 Opened wine bottles in front of a guest\n1.7 Described banquet service\n1.8 Explained closing duties\n1.9 Processed payments and receipts during the trade\n1.10 Managed intoxicated persons\n2. Required Knowledge\n2.1 Different Food service styles\n2.2 General service principles\n2.3 Sequence of service\n2.4 Handling guests with special needs\n2.5 Wine knowledge and service\n2.6 Banquet service\n2.7 Food safety principles\n\n3. Required Skills\n3.1 Food service styles\n3.2 Carrying plates and trays\n3.3 Presenting and opening wines\n3.4 Beverage service\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Different kinds of tableware: dinnerware, glassware,\nflatware, hollowware\n4.2 Wines (unopened bottles)\n4.3 Bar tools (e.g. Cork screw or wine opener)\n4.4 Dining room/restaurant equipment e.g Coffee pots.\ndumbwaiter (stand)\n5. Methods of\nAssessment\n\nCompetency may be assessed through :\n5.1 Written and/or oral questions to test candidate’s\nknowledge on:\n5.1.1\nThe sequence of service\n5.1.2\nDifferent food service styles\n5.1.3\nBanquet service\n5.1.4\nBeverage service\n5.1.5\nAssisting the dining guests\n5.2 Demonstration with questioning on\n5.2.1\nSequence of service\n5.2.2\nFood service styles\n5.2.3\nHow to present, open and serve wine in front\nof the guest\n6. Context for\nAssessment\nAssessment must be conducted in\n6.1 Workplace or simulated work environment or\n6.2 TESDA accredited assessment center/venue\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 53\nUNIT OF COMPETENCY :\nPROVIDE ROOM SERVICE\n\nUNIT CODE\n:\nTRS512391\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required in\nthe provision of food and beverage service particularly\nin the guest room of a commercial accommodation\nestablishment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Take and process\nroom service orders\n\n1.1\nTelephone call is answered promptly and courteously\nin accordance with customer service standards.\n1.2\nGuests’ name is checked and used throughout the\ninteraction\n1.3\nDetails of orders are clarified, repeated and checked\nwith guests for accuracy\n1.4\nSuggestive selling techniques are used.\n1.5\nGuests are advised of approximate time of delivery\n1.6\nRelevant information are recorded and checked in\naccordance with establishment policy and procedures\n1.7\nRoom service orders received from doorknob dockets\nare interpreted accurately.\n1.8\nOrders are promptly transferred and relayed to\nappropriate location for preparation.\n2. Set up trays and\ntrolleys\n2.1\nRoom service equipment and supplies are\nprepared in accordance with establishment\nprocedures.\n2.2\nProper room service equipment and supplies are\nselected and checked for cleanliness and condition.\n2.3\nTrays and trolleys are set up keeping in mind balance,\nsafety and attractiveness.\n2.4\nRoom service trays or trolleys are set up according\nto the food and beverage ordered\n2.5\nOrders are checked before leaving the kitchen for\ndelivery.\n2.6\nFood items are covered during transportation to the\nroom.\n3. Present and serve\nfood and beverage\norders to guests\n3.1\nThe guest’s name is verified on the bill before\nannouncing the staff’s presence outside the door.\n3.2\nGuests are greeted politely in accordance with the with\nestablishment’s service procedures.\n3.3\nGuests are asked where they want the tray or trolley\npositioned.\n3.4\nFood orders are delivered on the time desired by the\nguest.\n4. Present room service\naccount\n4.1\nGuests’ accounts are checked for accuracy and\npresented in accordance with establishment procedures\n4.2\nCash payments are acknowledged and then presented\nto the cashier for processing in accordance with\nestablishment guidelines\n4.3\nFor charge accounts, guests are asked to sign the bills.\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 54\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5. Clear away room\nservice equipment\n5.1\nProcedure to take away the tray or trolley when the\nguests have finished their meal is explained.\n5.2\nFloors are checked and cleared in accordance with\nestablishment policy and guidelines.\n5.3\nDirty trays are cleared in accordance with the\nestablishment’s procedure.\n5.4\nTrays and trolleys are cleaned and returned to the room\nservice area.\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Relevant information\nMay include :\n1.1\nName of the guest\n1.2\nRoom number\n1.3\nNumber of persons\n1.4\nDetailed food orders\n1.5\nTime the order was taken\n1.6\nTime for delivery\n\n2. Room service\nequipment and\nsupplies\nMay include:\n2.1\nTrays and trolleys\n2.2\nToasters\n2.3\nTableware and appointments\n2.4\nWarming equipment\n2.5\nLinen\n2.6\nPrinted materials\n\n3. Set-ups for room\nservice trays and or\ntrolleys\nMay include:\n3.1\nButters\n3.2\nCondiments\n3.3\nCutlery\n3.4\nGlassware\n3.5\nBeverages\n3.6\nLinen\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 56\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nTook room service orders properly\n1.2\nRecorded and processed room service orders\naccurately\n1.3\nSet up a variety of room service meals according to\nordered food and beverage\n1.4\nPresented and served room service orders\n\n2. Required Skills\n2.1 Take room service orders\n2.2 Setting up trays or trolleys\n2.3 Suggestive selling\n3. Required Knowledge\n3.1 Room service procedures\n3.2 Suggestive selling\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nFood and beverage room service supplies and\nequipment\n4.2\nRoom service menu\n4.3\nRoom service tableware and appointments\n\n5. Methods of\nAssessment\nCompetency may be assessed through :\n5.1\nDemonstration with questioning of the candidate taking\na room service orders and preparing a room service\ntray.\n5.2\nRole play on the whole room service procedure\n\n6. Context for\nAssessment\nAssessment must be conducted in:\n6.1\nWorkplace or simulated work environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 57\nUNIT OF COMPETENCY :\nRECEIVE AND HANDLE GUEST CONCERNS\n\nUNIT CODE :\nTRS512392\n\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge and skills required in\nreceiving and handling guest complaints.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Listen to the\ncomplaint\n1.1\nThe entire story or issue of concern is obtained from\nthe guest without interruption.\n1.2\nDetails of the guest complaint or concern are noted.\n1.3\nFull attention is given to the complaining guest.\n1.4\nGuest complaint is paraphrased to determine if the\nconcern is correctly understood.\n2. Apologize to the\nguest\n2.1\nSincere apology is offered for the disservice.\n2.2\nEmpathy is shown to the guest to show genuine\nconcern and consideration.\n2.3\nExcuses or blaming others are avoided.\n2.4\nGratitude is expressed to the guest for bringing the\nmatter up for attention.\n3. Take proper action\non the complaint\n3.1\nAppropriate action is taken regarding guest’s\nconcerns.\n3.2\nThe right person or department who can solve the\nproblem is informed for proper action.\n3.3\nDifficult situations or serious concerns are elevated or\nreferred to higher authority.\n3.4\nProblem is followed-up to check whether it solved or\nnot.\n\n4. Record complaint\n4.1\nComplaints are documented according to the\nestablishment standard procedures.\n4.2\nPersons concerned are recognized and actions taken\nare recorded.\n4.3\nFeedback received from guests is logged and collated.\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Guest complaint\nMay include:\n1.1\nUndelivered promise\n1.2\nPoor condition of property\n1.3\nDirty property\n1.4\nPoor service\n1.5\nUnfriendly personnel\n\n2. Empathy\nMay include:\n2.1\nAgree truthfully to minor points\n2.2\nExpress sincere regret\n2.3\nThank the guest for bringing up the matter\n2.4\nDo not take offense when guest complains\n2.5\nApproach with friendly spirit\n\n3. Appropriate actions\nMay include:\n3.1\nProduct replacements\n3.2\nCorrection\n3.3\nAddition\n3.4\nProper endorsement\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 59\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nListened and obtained the entire story or complaint\n1.2\nParaphrased the guest complaint\n1.3\nShowed empathy towards complaining guest\n1.4\nTook action on the guest complaint\n1.5\nRecorded complaint\n\n2. Required Knowledge\n2.1\nGeneral service principles/Standards of service\n2.2\nSequence of service\n2.3\nHandling guests with special needs\n2.4\nDealing with difficult customer/clients\n\n3. Required Skills\n3.1\nListening skills\n3.2\nBasic problem solving skills\n3.3\nEffective communication skills\n3.4\nSummarizing and paraphrasing\n\n4. Resource Implications\n\nThe following resources MUST be provided:\n4.1\nActual documents or records of guest complaints\n4.2\nFeedback forms\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nRole play/Simulation to test candidate’s knowledge and\nskills in listening to guest complaints, paraphrasing\nconcerns and taking action on the guest complaint.\n\n6. Context for\nAssessment\nAssessment may be conducted in:\n6.1\nWorkplace or simulated work environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 64 ---\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 60"
}
