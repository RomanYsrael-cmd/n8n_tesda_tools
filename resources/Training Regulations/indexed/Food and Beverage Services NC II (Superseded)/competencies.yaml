        "source_title": "PROVIDE EFFECTIVE CUSTOMER SERVICE",
        "source_text": "--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               29 \nUNIT OF COMPETENCY : \nPROVIDE EFFECTIVE CUSTOMER SERVICE \n \nUNIT CODE \n: \nTRS311205 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency deals with the knowledge, skills \nand attitudes in providing effective customer service. It \nincludes greeting customer, identifying customer needs, \ndelivering service to customer, handling queries through \nuse of common business tools and technology and \nhandling complaints/conflict situation, evaluation and \nrecommendation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n1.  Greet customer  \n1.1 \nCustomers are greeted according to enterprise \nprocedure \n1.2 \nVerbal and non-verbal communications are appropriate \nto the given situation \n1.3 \nNon verbal communication are observed when  \nresponding to customers  \n1.4 \nSensitivity to cultural and social differences is \ndemonstrated \n \n2.  Identify needs of \ncustomers  \n2.1 \nAppropriate interpersonal skills are used to ensure \nthat customer needs are accurately identified \n2.2 \nCustomer needs are assessed for urgency so that \npriority for service delivery can be identified \n2.3 \nCustomers are provided with information \n2.4 \nPersonal limitation in addressing customer and \ncolleague needs is identified and where appropriate, \nassistance is sought from supervisor \n \n3.  Deliver service to   \ncustomer \n3.1   Customer needs are promptly attended to in line with \nenterprise procedure \n3.2   Appropriate rapport is maintained with customer to \nenable high quality service delivery \n3.3   Opportunity to enhance the quality of service and \nproducts are taken wherever possible\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013          