        "source_text": "--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               34 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nPREPARE THE DINING ROOM/RESTAURANT AREA \nFOR SERVICE \n \nUNIT CODE \n: \nTRS512387 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills required in the \npreparation of the dining room /restaurant area before the \nstart of the service operations. It involves opening duties \nor the dining room mise-en-place prior to service. This \nunit includes the knowledge and skills in taking \nreservations, preparing service stations, table-setting, \nand setting the ambiance of the food service facility. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n1. Take table \nreservations \n1.1 \nInquiries are answered promptly, clearly and \naccurately. \n1.2 \nPertinent questions are asked to complete the details of \nthe reservations. \n1.3 \nReservations data are recorded on forms accurately \nbased on establishment’s standards. \n1.4 \nDetails of the reservations are repeated back and \nconfirmed with the party making the reservation. \n1.5 \nAdditional information about the food service \nestablishment is provided when necessary. \n \n2. Prepare service \nstations and \nequipment \n \n2.1 \nService or waiter’s stations are stocked with supplies \nnecessary for service. \n2.2 \nAll tableware and dining room equipment are \ncleaned, wiped and put in their proper places. \n2.3 \nSpecial tent cards and similar special displays are put \nup for promotion. \n2.4 \nCleanliness and condition of all tables, tableware and \ndining room equipment are checked. \n2.5 \nWater pitchers and ice buckets are filled. \n2.6 \nElectrical appliance or equipment like coffee pots, tea \npots, plate warmers etc. in the dining area are turned on \nand kept ready. \n2.7 \nCondiments and sauce bottles are refilled and the necks \nand tops of the bottles are wiped clean and dry.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               35 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n3. Set up the tables in \nthe dining area \n3.1 \nTables are set according to the standards of the food \nservice establishment. \n3.2 \nIn cases where the menu is pre-arranged or fixed, \ncovers are set correctly according to the predetermined \nmenu.  \n3.3 \nTableware and glassware are wiped and polished \nbefore they are set up on the table. \n3.4 \nCloth napkins are folded properly and laid on the table \nappropriately according to napkin folding style. \n3.5 \nBuffet or display tables are skirted properly taking into \naccount symmetry, balance and harmony in size and \ndesign.  \n4. Set the \nmood/ambiance of the \ndining area \n4.1 \nLights are adjusted according to time of the day. \n4.2 \nTables, chairs and other dining room furniture are \narranged to ensure comfort and convenience of the \nguests. \n4.3 \nAppropriate music is played when applicable \n4.4 \nFloors/carpets are cleaned and made sure are dry. \n4.5 \nAir-condition or cooling units are adjusted for the \ncomfort of the guests \n4.6 \nDecorations are set-up according to theme or concept of \nthe dining room.\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               36 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Inquiries \nMay be received through the following: \n1.1 \nTelephone \n1.2 \nFax \n1.3 \nEmail \n1.4 \nInternet \n1.5 \nIn person \n \n2. Details of the \nreservation \nMay include: \n2.1 \nDate of reservation \n2.2 \nTime of arrival \n2.3 \nNumber of persons \n2.4 \nName of person who will use the reservation \n2.5 \nName of person making the reservation \n2.6 \nContact details of the person checking in and of the \nperson making the reservation \n2.7 \nSpecial requirements \n \n3. Reservation records or \nforms \nMay include: \n3.1 \nReservation Sheets \n3.2 \nLogbook \n3.3 \nComputer \n3.4 \nReservation Cards \n \n4. Supplies \nMay include: \n4.1 \nNapkins \n4.2 \nMenu folders \n4.3 \nOrder slips \n4.4 \nWine list \n4.5 \nCondiments \n4.6 \nToothpicks \n4.7 \nTable cloth/Placemats \n4.8 \nSalt and Pepper shakers \n \n5. Tableware \nMay include: \n5.1 \nDinnerware/chinaware \n5.1.1 Cover/service plate \n5.1.2 Dinner plate \n5.1.3 Entrée plate \n5.1.4 Fish plate \n5.1.5 Bread plate \n5.1.6 Soup bowl/plate \n5.1.7 Cups and saucers\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               37 \n \nVARIABLE \nRANGE \n \n5.2 \nGlassware \n5.2.1 Stem wares \n5.2.2 Footed wares \n5.2.3 Tumblers \n5.2.4 Mugs \n5.3 \nSilverware/Flatware \n5.3.1 Dinner fork \n5.3.2 Dinner spoon \n5.3.3 Soup spoon \n5.3.4 Butter knife/spreader \n5.3.5 Steak knife \n5.3.6 Fish Fork \n5.3.7 Dessert fork \n5.3.8 Teaspoon \n5.4 \nHolloware \n5.4.1 Soup tureen \n5.4.2 Platters \n5.4.3 Coffeepots \n5.4.4 Teapots \n \n6. Dining room/ \nRestaurant equipment \n \nMay include: \n6.1 \nService tray stands \n6.2 \nGueridon  \n6.3 \nCake display  \n6.4 \nRefrigerators/Chillers \n6.5 \nCoffee makers/machines \n6.6 \nPoint Of Sales (POS) \n6.7 \nWine service equipment \n \n7. Napkin folding styles  \nMay include: \n7.1 \nPyramid \n7.2 \nBird of Paradise \n7.3 \nBishop’s Hat \n7.4 \nRose bud \n7.5 \nSail \n7.6 \nCandle \n7.7 \nCrown \n7.8 \nGoblet Fan\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               38 \n \nVARIABLE \nRANGE \n8. Table skirting designs  \nMay include but not limited to: \n8.1 \nDiamond style \n8.2 \nPleated box \n8.3 \nShirred Pleat \n8.4 \nSingle Pleats \n8.5 \nTulips \n8.6 \nScallops \n8.7 \nButterfly\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               39 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \n1.1 \nTook table reservations  accurately  \n1.2 \nIdentified and explained the use of the different food \nand beverage wares and equipment e.g.  Dinnerware, \nglassware, silverware etc. \n1.3 \nCompleted and prepared service or waiter’s station  \n1.4 \nSet up tables  according to predetermined menu \n1.5 \nPerformed different table napkin folding styles \n2. Required Knowledge \n2.1 \nFoodservice operations \n2.2 \nReservations process \n2.3 \nBasic types of tableware \na..Dinnerware \nb. Beverageware/glassware \nc. Silverware/cutlery \n2.4 \nGeneral rules in laying covers/table set-up \n2.5 \nDifferent napkin folding styles \n2.6 \nStation mise-en-place \n2.7 \nTelephone ethics \n2.8 \nTable skirting styles \n2.9 \nBanquet set-up styles \n3. Required Skills \n3.1 \nTaking reservations \n3.2 \nTable set-up \n3.3 \nNapkin folding  \n3.4 \nSkirting buffet/display tables \n3.5 \nBanquet set-ups \n4. Resource  \nImplications \n \nThe following resources MUST be provided: \n4.1 \nDifferent tableware and dining room equipment. \n4.2 \nTable skirting and set-up paraphernalia  \n4.3 \nCloth napkins (correct size and material)  \n5. Methods of \nAssessment     \n \nCompetency may be assessed through : \n5.1 \nWritten and/or oral questions to test candidate’s \nknowledge on the different tableware and equipment \nand Station mise-en-place \n5.2 \nSimulation/role play to test the candidate’s  knowledge \nand skills in taking reservations telephone skills \n5.3 \nPractical/Demonstration for table setting, skirting and \nnapkin folding \n5.4 \nDemonstration to show the types of service  \n6. Context of \nAssessment \nAssessment must be conducted in  \n6.1 \nWorkplace or simulated environment or \n6.2 \nTESDA accredited assessment center/venue\n",
