h records\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promulgated December 2013 14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE\n\nUNIT CODE\n:\nTRS311201\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitude required to access, increase and update\nindustry knowledge. It includes seek information on the\nindustry and update industry knowledge\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Seek information on\nthe industry\n1.1\nSources of information on the industry are correctly\nidentified and accessed\n1.2\nInformation to assist effective work performance is\nobtained in line with job requirements\n1.3\nSpecific information on sector of work is accessed and\nupdated\n1.4\nIndustry information is correctly applied to day-to-day\nwork activities\n2. Update industry\nknowledge\n2.1\nInformal and/or formal research is used to update\ngeneral knowledge of the industry\n2.2\nUpdated knowledge is shared with customers and\ncolleagues as appropriate and incorporated into day-to-\nday working activities\n3. Develop and update\nlocal knowledge\n3.1 Local knowledge is developed to assist queries on\nlocal/national tourism industry\n3.2 Local knowledge is updated using informal and/or\nformal research\n3.3 Contact with local communities is maintained\n4. Promote products\nand services to\ncustomers\n\n4.1 Promotional initiatives are described that may be used\nto promote products and services\n4.2 Selling skills are applied according to customer needs\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR – Food and Beverage Services NC II (Amended) Promu