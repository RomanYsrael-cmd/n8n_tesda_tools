        "source_title": "PROVIDE FOOD AND BEVERAGE SERVICES TO GUESTS",
        "source_text": "--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               47 \nUNIT OF COMPETENCY : \nPROVIDE FOOD AND BEVERAGE SERVICES TO \nGUESTS \n \nUNIT CODE \n: \nTRS512390 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge and skills required in \nthe provision of food and beverage service to guests in \nvarious types of dining venues and diverse styles of \nservice. This unit focuses on the procedures in the \ndelivery of food and beverages to the guest as well as on \nthe knowledge and skills that underpins the efficient work \nperformance in assisting the dining guest during and after \nthe meal service.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n1. Serve food orders  \n \n1.1 \nFood orders are picked up promptly from service areas. \n1.2 \nFood orders are checked for presentation and \nappropriate garnish and accompaniments. \n1.3 \nFood orders are served to the  guests who ordered \nthem. \n1.4 \nFood orders are served and cleared with minimal \ndisturbance to the other guests and in accordance to \nhygienic requirements. \n1.5 \nFood orders are served in accordance with the \nenterprise serving style standards. \n1.6 \nName of the dish or order is mentioned upon serving the \nguest. \n1.7 \nSequence of service and meal delivery is monitored in \naccordance with enterprise procedures. \n \n2. Assist the diners \n2.1 \nAdditional requests or needs of the guests are \nanticipated. \n2.2 \nAdditional food and beverage are offered and served at \nthe appropriate times. \n2.3 \nNecessary condiments and appropriate tableware are \nprovided based on the food order. \n2.4 \nDelays or deficiencies in service are recognized and \nfollowed up promptly based on enterprise policy. \n2.5 \nThe “3-minute check” is conducted to check guest ‘s \nsatisfaction. \n2.6 \nChildren and guests with special needs are treated \nwith extra attention and care.\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               48 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n3. Perform banquet or \ncatering food service \n3.1 \nServiceware are prepared and checked for \ncompleteness ahead of time. \n3.2 \nTables and chairs are set up in accordance with the \nevent requirements. \n3.3 \nFood is served according to general service \nprinciples. \n3.4 \nFood is handled based on food safety procedures. \n3.5 \nCoordinated service of meal courses is ensured. \n3.6 \nAssigned areas are kept clean in accordance with \nenterprise procedures. \n3.7 \nTables are cleared and soiled dishes prepared to be \nbrought for dishwashing after the event or function, \n3.8 \nNumber of guests being served is noted and monitored. \n \n4. Serve Beverage \nOrders \n4.1 \nBeverage orders are picked up promptly from the bar. \n4.2 \nBeverage orders are checked for presentation and \nappropriate garnishes. \n4.3 \nBeverages are served at appropriate times during meal. \n4.4 \nBeverages are served efficiently according to \nestablished standards of service. \n4.5 \nBeverages are served at the right temperature. \n4.6 \nFor full bottle wine orders, wine is opened efficiently with \nminimal disturbance to the other guests. \n4.7 \nWine service is carried out in accordance with \nestablishment procedures. \n4.8 \nCoffee and/or tea service is carried out in accordance \nwith establishment procedure. \n5.  Process payments and \nreceipts  \n5.1    Bills are prepare and processed accurately in \ncoordination with cashier. \n5.2    Amount due is verified with customer. \n5.3    Cash and non-cash payments are accepted and \nreceipts are issued. \n5.4    Change are given as required. \n5.5    Required documentation is completed in accordance   \n         with enterprise policy. \n6.  Conclude food service \nand close down dining \narea \n6.1    Soiled dishes are removed when guests are finished \nwith the meal. \n6.2    Food scraps are handled in accordance with hygiene \nregulations and enterprise procedures.  \n6.3    Equipment are cleaned and stored in accordance with \nhygiene regulations and enterprise procedures. \n6.4    Tables are cleared, reset and made ready for the next \nsitting when guests are finished with the meal. \n6.5    Guests are thanked and given a warm farewell. \n6.6    Electrical equipment are turned off where appropriate.\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               49 \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n7.   Manage intoxicated \npersons \n7.1    Levels of intoxication of customers are determined  \n7.2    Difficult situations are referred to an appropriate person \n7.3    Appropriate procedures are applied to the situation and \nin accordance with enterprise policy \n7.4    Legislative requirements are applied\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               50 \nRANGE OF VAIABLES \n \nVARIABLE \nSCOPE \n1. Serving styles   \nMay include: \n1.1 \nAmerican Service (Plate Service) \n1.2 \nRussian Service (Platter Service) \n1.3 \nBuffet Service \n2. Sequence of service  \nMay include: \n2.1 \nWelcoming/Greeting of guest \n2.2 \nSeating the guest \n2.3 \nTaking beverage orders \n2.4 \nPresenting the menu \n2.5 \nTaking food orders \n2.6 \nWine service \n2.7 \nServing food orders \n2.8 \nCrumbling/brushing table \n2.9 \nCoffee/tea service \n2.10 Preparing and presenting the bill \n3. 3-Minute Check \nMay include: \n3.1 \nEnsure guest satisfaction about their meals \n3.2 \nReplenish condiments \n3.3 \nProviding additional items \n3.4 \nClear unused items \n4. Guests with special \nneeds \nMay include: \n4.1 \nChildren \n4.2 \nElderly people \n4.3 \nPersons with Disability \n4.4 \nVIP guests \n5. General service \nprinciples  \nMay include: \n5.1 \nNever reach in front of the guest when serving \nanother. \n5.2 \nDo not place dirty, chipped, cracked tableware before \nthe guest. \n5.3 \nHandle flatware/cutleries and glassware properly \n5.4 \nGlasses should never be filled too full. \n5.5 \nGlasses are handled by the base or the stem. \n5.6 \nCrumb table when necessary. \n6. Beverages \nMay include: \n6.1 \nAlcoholic beverages  \n6.2 \nNon-Alcoholic beverages( e.g. juices, sodas, coffee, \ntea) \n7. Wine service  \n \nMay include: \n7.1 \nPresenting the wine. \n7.2 \nOpening wine \n7.3 \nPouring wine \n8. Cash payments \nMay include: \n8.1   Payment in notes and coins \n8.2   Payment in a foreign currency \n8.3   Calculating currency exchange rates\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               51 \n \n \n \nVARIABLE \nSCOPE \n9. Non-cash payments \nMay include: \n9.1   Debit and credit cards \n9.2   Checks (Personal, business, travelers) \n9.3   In-house vouchers \n9.4   Charges to company accounts \n \n10. Receipts issued \nMay include: \n10.1   Issuing receipts via cash register/terminal \n10.2   Issuing hand written receipt \n10.3   Complying with legal requirements of host country to \nprovide receipt \n11. Required \ndocumentation \nMay include: \n11.1  Internal documentation \n11.2  External agent documentation\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               52 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidences that the candidate: \n1.1 Performed the various styles of food service \n1.2 Demonstrated service principles  \n1.3 Explained the sequence of service \n1.4 Performed the “3-minute” check \n1.5 Described how to handle guests with special needs \n1.6 Opened wine bottles in front of a guest \n1.7 Described banquet service \n1.8 Explained closing duties \n1.9 Processed payments and receipts during the trade \n1.10 Managed intoxicated persons \n2. Required Knowledge \n2.1 Different Food service styles \n2.2 General service principles \n2.3 Sequence of service \n2.4 Handling guests with special needs \n2.5 Wine knowledge and service \n2.6 Banquet service \n2.7 Food safety principles \n \n3. Required Skills \n3.1 Food service styles \n3.2 Carrying plates and trays \n3.3 Presenting and opening wines \n3.4 Beverage service  \n4. Resource  \nImplications  \nThe following resources MUST be provided: \n4.1 Different kinds of tableware: dinnerware, glassware, \nflatware, hollowware \n4.2 Wines (unopened bottles) \n4.3 Bar tools (e.g. Cork screw or wine opener) \n4.4 Dining room/restaurant equipment e.g Coffee pots. \ndumbwaiter (stand) \n5. Methods of \nAssessment     \n \nCompetency may be assessed through : \n5.1 Written and/or oral questions to test candidate’s    \nknowledge on: \n5.1.1 \nThe sequence of service \n5.1.2 \nDifferent food service styles \n5.1.3 \nBanquet service \n5.1.4 \nBeverage service \n5.1.5 \nAssisting the dining guests \n5.2 Demonstration with questioning on \n5.2.1 \nSequence of service \n5.2.2 \nFood service styles \n5.2.3 \nHow to present, open and serve wine in front \nof the guest \n6. Context for \nAssessment \nAssessment must be conducted in \n6.1 Workplace or simulated work environment or \n6.2 TESDA accredited assessment center/venue\n",
