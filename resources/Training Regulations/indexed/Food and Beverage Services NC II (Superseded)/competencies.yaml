nMay include: \n4.1 \ninteractive communication \n4.2 \npublic relation \n4.3 \ngood working attitude \n4.4 \nsincerity \n4.5 \npleasant disposition \n4.6 \neffective communication skills \n5.  Customer needs \nMay include: \n5.1 \nthose with a disability \n5.2 \nthose with special cultural or language needs \n5.3 \nunaccompanied children \n5.4 \nparents with young children \n5.5 \npregnant women \n5.6 \nsingle women \n6.  Enterprise procedure \nMay include: \n6.1    modes of greeting and farewell \n6.2    addressing the person by name \n6.3    time-lapse before a response \n6.4    style manual requirements \n6.5    standard letters and format \n7.  Business tools and \ntechnology \nMay include: \n7.1    telephone \n7.2    fax machine \n7.3    computer equipment \n7.4    internet, email\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               32 \n \n \nVARIABLE \nRANGE \n8.  Complaint \nMay include: \n8.1   level of service \n8.2   product standards \n8.3   processes \n8.4   information given \n8.5   charges and fees \n9.  Threats to personal \nsafety \nMay include: \n9.1    violent customers \n9.2   drug and alcohol affected customers \n9.3   customers fighting amongst themselves\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               33 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate : \n1.1 \nComplied with industry practices and procedures \n1.2 \nUsed interactive communication with others \n1.3 \nComplied with occupational, health and safety practices \n1.4 \nPromoted public relation among others \n1.5 \nComplied with service manual standards \n1.6 \nDemonstrated familiarity with company facilities, \nproducts and services \n1.7 \nDemonstrated ability to work effectively with others \n1.8 \nApplied compan