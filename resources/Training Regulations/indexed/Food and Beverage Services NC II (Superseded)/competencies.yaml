        "source_text": "--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               14 \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE \n \nUNIT CODE \n: \nTRS311201 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency deals with the knowledge, skills \nand attitude required to access, increase and update \nindustry knowledge.  It includes seek information on the \nindustry and update industry knowledge \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n1.  Seek information on \nthe industry \n1.1 \nSources of information on the industry are correctly \nidentified and accessed \n1.2 \nInformation to assist effective work performance is \nobtained in line with job requirements \n1.3 \nSpecific information on sector of work is accessed and \nupdated \n1.4 \nIndustry information is correctly applied to day-to-day \nwork activities \n2.  Update industry \nknowledge \n2.1 \nInformal  and/or formal research is used to update \ngeneral knowledge of the industry \n2.2 \nUpdated knowledge is shared with customers and \ncolleagues as appropriate and incorporated into day-to-\nday working activities  \n3.  Develop and update \nlocal knowledge \n3.1    Local knowledge is developed  to assist queries on \nlocal/national tourism industry \n3.2    Local knowledge is updated using informal and/or \nformal research  \n3.3    Contact with local communities is maintained  \n4.  Promote  products \nand services to \ncustomers \n \n4.1    Promotional initiatives are described that may be used \nto promote products and services \n4.2    Selling skills are applied according to customer needs\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               15 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information sources \nMay include: \n1.1 \nmedia \n1.2 \nreference books \n1.3 \nlibraries \n1.4 \nunions \n1.5 \nindustry associations \n1.6 \nindustry journals \n1.7 \ninternet \n1.8 \npersonal observation and experience \n \n2.  Information to assist \neffective work \nperformance \nMay include: \n2.1 \nDifferent sectors of the industry and the services \navailable in each sector \n2.2 \nRelationship between tourism and hospitality \n2.3 \nRelationship between the industry and other \nindustries \n2.4 \nIndustry working conditions \n2.5 \nLegislation that affects the industry \n2.5.1 liquor \n2.5.2 health and safety \n2.5.3 hygiene \n2.5.4 gaming \n2.5.5 workers compensation \n2.5.6 consumer protection  \n2.5.7 duty of care \n2.5.8 building regulations \n2.6 \nTrade unions environmental issues and \nrequirements \n2.7 \nIndustrial relations issues and major \norganizations \n2.8 \nCareer opportunities within the industry \n2.9 \nWork ethic required to work in the industry and \nindustry expectations of staff \n2.10 Quality assurance  \n3.  Informal and formal \nresearch \nMay include: \n3.1    Discussions with colleagues, management and customer\n3.2    Reading internal enterprise material about products and \nservices \n3.3    Familiarity with customer comments including complaints\n3.4    Reading and researching product data and information\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               16 \n \nVARIABLE \nRANGE \n \n3.5    Conducting internal testing to determine quality and \ndifferentials \n3.6    General media research \n3.7    Developing and analyzing responses to questionnaires \n3.8    Reading surveys and ratings  \n4.  Promotional initiatives \nMay include: \n4.1    Media campaigns \n4.2    Internal promotions, including static displays, \ndemonstrations, tastings, videos, competitions, \npackages, events\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               17 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of  \nCompetency \nAssessment requires evidence that the candidate/ trainee : \n1.1 \nKnew key sources of information on the industry \n1.2 \nUpdated industry knowledge \n1.3 \nAccessed and used industry information \n1.4 \nDeveloped and updated local knowledge \n1.5 \nPromoted products and services \n \n2.  Required Knowledge  \n2.1 \nOverview of quality assurance in the industry \n2.2 \nRole of individual staff members \n2.3 \nIndustry information sources \n \n3.  Required Skills \n3.1 \nTime management \n3.2 \nReady skills needed to access industry information \n3.3 \nBasic competency skills needed to access the internet \n \n4.  Resource Implications  The following resources should be provided: \n4.1 \nSources of information on the industry \n4.2 \nIndustry knowledge \n \n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nInterview/questions \n5.2 \nPractical demonstration \n5.3 \nPortfolio of industry information related to trainee’s work \n \n6.  Context of \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through TESDA's \naccredited assessment center\n",
