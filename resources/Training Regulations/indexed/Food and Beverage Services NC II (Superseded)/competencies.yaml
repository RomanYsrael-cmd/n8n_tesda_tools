        "source_title": "WELCOME GUESTS AND TAKE FOOD AND BEVERAGE ORDERS",
        "source_text": "--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               40 \n \n \nUNIT OF COMPETENCY:     WELCOME GUESTS AND TAKE FOOD AND BEVERAGE \nORDERS \n \nUNIT CODE                      :   TRS512388 \n \nUNIT DESCRIPTOR    :  This unit deals with the knowledge and skills required in \nproviding pre-meal services to the dining guests as soon as \nthey arrive in the foodservice facility. It covers the dining \nroom or restaurant service procedures before the food and \nbeverage orders are served. This unit involves the initial \nsteps in the sequence of service that includes the welcoming \nof guests, seating the guests, taking food and beverage \norders and liaising between the kitchen and the service \narea. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of \nVariables  \n1. Welcome \nand \ngreet \nguests  \n1.1 Guests are acknowledged as soon as they arrive. \n1.2 Guests are greeted with an appropriate welcome. \n1.3 Details of reservations are checked based on \nestablished standard policy. \n2. Seat the guests \n2.1 Guests are escorted and seated according to table \nallocations \n2.2 Tables are utilized according to the number of \nparty. \n2.3 Guests are seated evenly among stations to control \nthe traffic flow of guests in the dining room. \n2.4 Cloth napkins are opened for the guests when \napplicable. \n2.5 Water is served when applicable, according to the \nstandards of the foodservice facility.  \n3. Take food and beverage \norders \n3.1 Guests are presented with the menu according to \nestablished standard practice. \n3.2 Orders are taken completely in accordance with \nthe establishment’s standard procedures. \n3.3 Special requests and requirements are noted \naccurately. \n3.4 Orders are repeated back to the guests to confirm \nitems. \n3.5 Tableware and cutlery appropriate for the menu \nchoices are provided and adjusted in accordance \nwith establishment procedures.\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               41 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of \nVariables  \n4. Liaise between kitchen \nand service areas \n4.1 Orders are placed and sent to the kitchen promptly. \n4.2 Quality of food is checked in accordance with \nestablishment standards \n4.3 Tableware is checked for chips, marks, cleanliness, \nspills, and drips \n4.4 Plates and/or trays are carried out safely. \n4.5 Colleagues are advised promptly regarding \nreadiness of items for service \n4.6 Information about special requests, dietary or \ncultural requirements is relayed accurately to \nkitchen where appropriate. \n4.7 Work technology  are observed according to \nestablishment standard policy and procedures\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               42 \n  \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Types of menu  \nMay include: \n1.1 \nA la carte \n1.2 \nTable d’hote \n1.3 \nCarte du jour \n2. Ordering systems  \nMay include: \n2.1 \nDocket system \n2.2 \nChecklist \n2.3 \nBlank order slips \n2.4 \nTouchscreen POS system \n3.  Work technology \nMay include: \n3.1  POS \n3.2  Electronic tablet order\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               43 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidences that the candidate: \n1.1  Welcomed and greeted the guests \n1.2 Took food and beverage orders  \n1.3  Liaised between kitchen and service areas \n2. Required \nKnowledge \n2.1 \nWelcoming and greeting guests procedures \n2.2 \nSeating guests procedures \n2.3 \nSequence of Food Service \n2.4 \nBasic Menu types \n2.5 \nOrder taking procedures \n2.6 \nPrinciples of promotion and selling \n2.7 \nSuggestive selling techniques \n2.8 \nProduct and service knowledge   \n3. Required Skills \n3.1 \nBasic communication skills \n3.2 \nTaking food and beverage order \n3.3 \nSkill in Technology knowledge (e.g. POS, electronic order \ntablet, etc. \n4. Resource  \nImplications  \nThe following resources must be provided: \n4.1 \nDifferent order taking systems \n4.2 \nDifferent menu forms \n5. Methods of \nAssessment     \n \nCompetency may be assessed through : \n5.1 Practical demonstration or \n5.2 Simulation/role plays to test the candidate’s knowledge and skills \nin: \na. Welcoming and greeting guests \nb. Seating the guests \nc. Taking food and beverage orders. \n6. Context for \nAssessment \nAssessment must be conducted in \n6.1 Workplace or simulated work environment or \n6.2 TESDA accredited assessment center/venue\n",
