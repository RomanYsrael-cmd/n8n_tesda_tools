presence outside the door. \n3.2 \nGuests are greeted politely in accordance with the with \nestablishment’s service procedures. \n3.3 \nGuests are asked where they want the tray or trolley \npositioned. \n3.4 \nFood orders are delivered on the time desired by the \nguest. \n4.  Present room service \naccount \n4.1 \nGuests’ accounts are checked for accuracy and \npresented in accordance with establishment procedures \n4.2 \nCash payments are acknowledged and then presented \nto the cashier for processing in accordance with \nestablishment guidelines \n4.3 \nFor charge accounts, guests are asked to sign the bills.\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               54 \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n5.  Clear away room \nservice equipment \n5.1 \nProcedure to take away the tray or trolley when the \nguests have finished their meal is explained. \n5.2 \nFloors are checked and cleared in accordance with \nestablishment policy and guidelines. \n5.3 \nDirty trays are cleared in accordance with the \nestablishment’s procedure.  \n5.4 \nTrays and trolleys are cleaned and returned to the room \nservice area.\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               55 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant information \nMay include : \n1.1 \nName of the guest \n1.2 \nRoom number \n1.3 \nNumber of persons \n1.4 \nDetailed food orders \n1.5 \nTime the order was taken \n1.6 \nTime for delivery \n \n2. Room service \nequipment and \nsupplies \nMay include: \n2.1 \nTrays and trolleys \n2.2 \nToasters     \n2.3 \nTableware and appointments \n2.4 \nWarming equipment \n2.5 \nLinen \n2.6 \nPrinted materials \n \n3. Set-ups for room \nservice trays and or \ntrolleys  \nMay include: \n3.1 \nButters \n3.2 \nCondiments  \n3.3 \nCutlery \n3.4 \nGlassware \n3.5 \nBeverages  \n3.6 \nLinen\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               56 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nTook room service orders properly \n1.2 \nRecorded and processed room service orders \naccurately \n1.3 \nSet up a variety of room service meals according to \nordered food and beverage \n1.4 \nPresented and served room service orders \n \n2. Required Skills \n2.1   Take room service orders \n2.2   Setting up trays or trolleys  \n2.3   Suggestive selling \n3. Required Knowledge \n3.1   Room service procedures \n3.2   Suggestive selling \n4. Resource Implications \nThe following resources MUST be provided: \n4.1 \nFood and beverage room service supplies and \nequipment \n4.2 \nRoom service menu  \n4.3 \nRoom service tableware and appointments \n \n5. Methods of \nAssessment \nCompetency may be assessed through : \n5.1 \nDemonstration with questioning of the candidate  taking \na room service orders and preparing a room service \ntray. \n5.2 \nRole play on the whole room service procedure \n \n6. Context for \nAssessment \nAssessment must be conducted in: \n6.1 \nWorkplace or simulated work environment  or  \n6.2 \nTESDA accredited assessment center/venue\n",
