ment standard policy and procedures\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               42 \n  \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Types of menu  \nMay include: \n1.1 \nA la carte \n1.2 \nTable d’hote \n1.3 \nCarte du jour \n2. Ordering systems  \nMay include: \n2.1 \nDocket system \n2.2 \nChecklist \n2.3 \nBlank order slips \n2.4 \nTouchscreen POS system \n3.  Work technology \nMay include: \n3.1  POS \n3.2  Electronic tablet order\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR – Food and Beverage Services NC II (Amended)                    Promulgated  December 2013               43"
