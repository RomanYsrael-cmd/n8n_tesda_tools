  "source_text": "DEFINITION OF TERMS\n\n1. Framework - refers to the basic supporting idea / concept / theory.\n2. Community Development Framework – includes a range of methods\ndesigned to strengthen and develop communities.\n3. Community Structures – groups/ organizations in the community\nwhether political, socio-cultural or groups in the academe who share\nconcerns and issues.\n4. Problem solving skills – skills needed to solve routine problems related\nto the workplace under direction\n5. Client-centered approach – a non-discriminatory approach to all client,\ntheir family and friends, commitment to meeting their needs and upholding\ntheir rights as well as empowering them.\n6. Residential care - this includes planning for resources, services and on-\ngoing support for the client and significant others to ensure resettlement\nneeds are assessed and addressed.\n7. AOD - alcohol and other drugs problems\n\n--- PDF PAGE 123 ---"
