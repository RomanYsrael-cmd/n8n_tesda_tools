        "source_title": "DEVELOP AND PROVIDE HEALTH EDUCATION PROGRAM IN THE COMMUNITY",
        "source_text": "--- PDF PAGE 96 ---\nUNIT OF COMPETENCY :   DEVELOP AND PROVIDE  HEALTH EDUCATION  \n                                              PROGRAM IN THE COMMUNITY \nUNIT CODE                      :   HCS346308 \nUNIT DESCRIPTOR         :   Working with the community to develop and provide  \n                                              education projects in relevant issues. \n \n \nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n1. \nDevelop  the  \n         health program \n         education. \n \n1.1 Project  plan is developed in consultation \nwith key people and organizations and \nidentifies priorities and desired outcomes \nto address issues of concerns of target \ngroup/s. \n1.2 Appropriate \nhuman, \nfinancial \nand \nphysical resources are identified and \nsecured \n1.3 Marketing materials are prepared and \ndisseminated to target audience and \nothers as appropriate. \n \n2. \nOrganize \nparticipants to the  \n          program. \n \n2.1 Strategies for delivery of the project are \ndeveloped and implemented to ensure \nmaximum effectiveness. \n2.2 Education \n/ \nresource \nmaterials \nappropriate to the context, issue and \naudience are developed and distributed. \n2.3 Strategies \nare \nimplemented \nto \nencourage full participation in the project \nand the expression of views and feelings \nabout its process or content. \n2.4 Project \nadjustments \nare \nmade \nas \nrequired to meet the needs of specific \ngroup. \n2.5 Feedback on the education project or \nactivity is sought from participants.\n\n--- PDF PAGE 97 ---\nELEMENT \n \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n3. \nCoordinate \nhealth \nteaching program. \n \n3.1 The education project is assessed \nagainst the planned goals and objectives \nin \naccordance \nwith \norganizational \npolicies and procedures. \n3.2 Outcomes of project evaluations are \ndiscussed \nwith \nkey \npeople \nand \norganizations \nto \ndetermine \nfuture \ndirections. \n3.3 Education \nproject \noutcomes \nare \ndocumented, \nand \nwhere \nnecessary \nacted \non \nin \naccordance \nwith \norganizational procedures.\n\n--- PDF PAGE 98 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n \n1. \nEducation projects  \n         \n \nMay include: \n1.1 Projects of varying scope and scale \nranging from state wide initiatives, to \nspecific activities \n- \nA \nsingle \nevent, \nsuch \nas \nan \ninformation stall in a shopping centre \n- \nA multi session education and skill \n- \nA complex, large scale series of \nactivities that incorporates diverse but \ncoordinated elements, such as a \nstatewide \neducation \ncampaign \ninvolving mass media information. \n \n2. \nKey people and  \n        organizations  \n \nMay include:     \n       2.1   Target group \n       2.2   Other relevant organizations \n       2.3   Funding bodies \n       2.4   Community support groups \n       2.5    The media \n \n3. \nResources  \n \nMay include: \n3.1 Equipment \n3.2 Staff skills \n3.3 Time \n3.4 Space \n3.5 Venue \n3.6 Educational materials \n3.7 Funding \n \n4. \nMarketing materials  \n \n4.1 Culturally appropriate \n \n5. \nAssessment and  \n        evaluation of the  \n        education project  \n        may include: \n \nMay include: \n       5.1   Use of feedback \n       5.2   Discussions with stakeholders,  \n               organizations and other participants \n       5.3   Discussion with colleagues\n\n--- PDF PAGE 99 ---\nEVIDENCE GUIDE \n \n1. Critical aspects of  \n      competency \n \nAssessment \nrequires \nevidence \nthat \nthe \ncandidate: \n1.1 Matched \neducation \nactivities \nwith \ncommunity needs and priorities \n1.2 Collaborated and consulted with key  \n        people and organizations \n1.3 Delivered \nhigh \nquality \ninnovative \neducational projects \n \n2. Underpinning \nknowledge \nand \nattitudes \n \n2.1 Needs assessment and analysis \n2.2 Goals and objectives for project selected \n2.3 Resource \navailability \nfor \nparticular \nprojects \n2.4 Strategies and actions needed to achieve \ngoals \n2.5 Organizational policies and procedures \nfor dealing with the media \n2.6 Accountability requirements \n2.7 Resources \nand \nsupport \nwithin \nthe \ncommunity \n2.8 Government funding policies \n2.9 Knowledge of local area \n2.10 Relevant \nlocal, \nstate \nand \nfederal \nstrategies \n \n3. Underpinning skills \n \n3.1 Liaison and networking \n3.2 Communication \n3.3 Research skills \n3.4 Time management \n3.5 Budgeting \n3.6 Report writing \n3.7 Evaluation \n3.8 Presentation \n3.9 Marketing and promotion \n3.10  Negotiation \n \n4. Resource implications \n \nThe following resources MUST be provided: \n4.1 Access to appropriate resources for \ndeveloping, delivering and evaluating \ncommunity education projects  (or access \nto \nan \nappropriately \nsimulated \nenvironment).\n\n--- PDF PAGE 100 ---\nEVIDENCE GUIDE \n \n \n5. Method of \nassessment \n \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Observation with questioning \n5.3 Oral questioning/Interview \n5.4 Portfolio \n \n \n6. Context of  \n      assessment \n \n \n6.1 Competency may be assessed in the \nworkplace or in a simulated work setting.\n",
