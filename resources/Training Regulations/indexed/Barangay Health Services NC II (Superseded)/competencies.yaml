        "source_title": "RECRUIT AND COORDINATE VOLUNTEERS",
        "source_text": "--- PDF PAGE 79 ---\nUNIT OF COMPETENCY :   RECRUIT AND COORDINATE VOLUNTEERS \nUNIT CODE                      :   HCS346306 \nUNIT DESCRIPTOR         :   This unit deals with developing and supporting \\ \n                                              volunteer workers in an agency. \n \n \nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n1. Identify the need and  \n      roles for volunteers in  \n      the organization \n \n1.1 Potential \nroles \nfor \nvolunteers \nare \nidentified. \n1.2 Roles are discussed and agreed upon by \nmanagement. \n1.3 Role descriptions as developed. \n1.4 Processes for support of volunteers are \nidentified. \n \n2. Recruit volunteers \n \n2.1 Volunteers are sought through advertising \nin \nrelevant \nmedia \nand \ncommunity \nnetworks. \n2.2 Interviews with potential volunteers are \narranged and completed. \n2.3 Selections are made and management \nadvised. \n2.4 Successful volunteers are advised of their \nselection. \n2.5 When \nnecessary, \na \nwaiting \nlist \nof \nappropriate applicants is maintained. \n2.6 An on-going recruitment program is \nimplemented as required. \n \n       3.  Orient volunteers to | \n             organization. \n \n3.1 Volunteers are provided with an orientation \nto the organization. \n3.2 Training for specific role is provided in a \nmanner appropriate to the needs and \nresources of the organization. \n \n4.  Monitor performance  \n      of volunteers \n \n4.1 \nRegular meetings of volunteers are \nestablished. \n4.2 \nA review of roles and performance is \nregularly undertaken. \n4.3 \nIndividual support and debriefing is \nprovided when necessary.\n\n--- PDF PAGE 80 ---\nRANGE OF VARIABLES \n \n \n \n \nVARIABLE \n \nRANGE \n \n1. Volunteers  \n \n \nMay include: \n1.1 Unpaid \nworkers \nwho \nare \nin \npaid \nemployment elsewhere \n1.2 Unpaid workers who are not in paid \nemployment \n \n2. Roles of volunteers  \n \nMay include: \n2.1 Agency management \n2.2 Direct \nservice \nincluding \nreception, \ntelephone advice lines, service user \nsupport\n\n--- PDF PAGE 81 ---\nEVIDENCE GUIDE \n \n1. Critical aspects of  \n      competency \n \nAssessment \nrequires \nevidence \nthat \nthe \ncandidate: \n1.1 \nVolunteer recruitment and coordination \nmeets \nboth \nthe \nneeds \nof \nthe \norganization and support requirements \nfor volunteer roles \n \n2. Underpinning \nknowledge \nand \nattitudes \n \n2.1 \nThe impact of cultural community \nattitudes \non \nappropriate \nroles, \nrelationships and approaches of the \nvolunteer worker \n2.2 \nThe implications of differences in \nattitudes and values in working in the \nagency \n2.3 \nRelevant legislation and public policies \nrelating to the employment of unpaid \nworkers \n \n3. Underpinning skills \n \n3.1 \nCoordination of people, processes and \ninformation \n3.2 \nProvision of support to a diverse range \nof people \n3.3 \nConflict resolution / negotiation and \nmediation \n3.4 \nCross cultural communication and \nnegotiation \n3.5 \nVerbal and written communication \n \n4. Resource implications \n \nThe following resources MUST be provided: \n4.1 \nAccess to appropriate workplace or \ncommunity where assessment can \ntake place; or \n4.2 \nSimulation of realistic workplace or \ncommunity setting for assessment \n \n5. Method  of \nassessment \n \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n5.3 \nOral questioning/Interview \n5.4       Portfolio \n6. Context of  \nassessment \n \n6.1 \nCompetency may be assessed in the \nworkplace or in a simulated work \nsetting.\n",
