ients and \nstakeholders. \n4.3 \nOperational \narrangements \nfor \nconducting \nthe \nprogram \nare \ndetermined \nand \nassessed \nfor \nfeasibility. \n4.4 \nPlanning activities reflect accepted \ngood practice in working with young \npeople.\n\n--- PDF PAGE 103 ---\nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n5. Deliver activity /  \n      program \n \n5.1 \nThe \nprogram \nis \nimplemented \nin \naccordance with the program plan, \norganization guidelines and legal / \nstatutory requirements. \n5.2 \nParticipants are provided with access \nto a range of activities suited to their \nneeds and interests. \n5.3 \nFlexible \nimplementation \nplans \nare \ndeveloped to suit a variety of contexts \nand to cope with contingencies. \n5.4 \nThe \nprogram \nis \nadapted \nto \nthe \nchanging needs of participants as \nrequired. \n5.5 \nProblem \nin program \ndelivery \nare \naddressed promptly. \n \n6. Evaluate activity  \n      program \n \n6.1 \nCriteria to judge the effectiveness of \nthe program are defined in consultation \nwith clients and stakeholders. \n6.2 \nAppropriate evaluation strategies are \nused routinely during and after the \nprogram and used for revision and \ndevelopment. \n6.3 \nEvaluation information is collected, \norganized and reported in a format \nwhich is accessible and meaningful to \nthe clients and stakeholders. \n6.4 \nReports are prepared and presented \nas required.\n\n--- PDF PAGE 104 ---\nRANGE OF VARIABLES \n \n \n \n \nVARIABLE \n \nRANGE \n \n \n1. Key resource  \n      information  \n             \n \n \n \n1.1 WHO concept of Health \n \n \n2. Key issues and  \n      prevention strategies  \n      affecting people’s  \n      health \n \n \n2.1 Nutrition \n2.2 Substance use and misuse \n2.3 Environmental health \n2.4 Mental health \n2.5 Sexual and reproductive health \n2.6 Other determinants \n \n \n3. Programs  \n \n \n3.1 Activities designed to address needs of \ntarget groups. \n3.2 Activities \ndesigned \nto \nmeet \nneeds \nidentified in research \n3.3 Strategies to implement government / \nfunding agency policy \n3.4 Activities to extend the participation \nnumbers in existing programs \n3.5 Strategies \nto \naddress \nexclusion, \ndiscrimination and alienation \n3.6 Those directed at individual young people \nand their needs \n3.7 Those directed at the general community \nwhich affect young people \n3.8 Those initiated by the organization, by \ncommunity \ngroups, \nby \nother \norganizations, or by community leaders \nand decision makers \n3.9 Those designed to respond to social, \neconomic and demographic changes\n\n--- PDF PAGE 105 ---\nVARIABLE \n \nRANGE \n \n4. Programs  \n \nMay have the following focus: \n4.1 Education / learning / training  eg.  \nHomework support and study \n4.2 Personal development and support  eg. \nLife skills education \n4.3 Music and performing arts  eg.  Youth \ntheatres, band, video production team \n4.4 Research, planning and management  \neg. Aboriginal cultural camp, scouts \nmeeting \n4.5 Community action  eg.  Anti violence \ngroup \n4.6 Special interests  causes eg. Young \npeople against nuclear disarmament \n4.7 Enterprise development activities \n4.8 Employment, fund raining, small business \n \n5. Program activities  \n       \n \nMay include: \n5.1 Discussion groups  e.g.  About safe sex, \nreligious beliefs \n5.2 Sporting and recreation activities  e.g.  \nBasketball at the drop in centre, pool \ngame, disco, bush excursion \n5.3 Structured \nand \nunstructured \nsocial \nactivities  e.g.  Party, shopping, visit to \ncinema \n \n6. Programs are   \n      planned and   \n      implemented  \n \nFor the purpose of:   \n       6.1    Providing immediate support \n       6.2   Promoting  individual’s participation and  \n               personal development \n       6.3   Enabling individual to use their time  \n               constructively, have fund and develop  \n              qualities of self reliance \n       6.4  Enabling young people to learn life skills,  \n              knowledge and attitudes\n\n--- PDF PAGE 106 ---"
