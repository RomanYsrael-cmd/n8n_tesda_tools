        "evidence_guide": {
          "source_text": "1.\nCritical aspects of\ncompetency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Identified the range of relevant issues\nthat may impact on service delivery\n1.2 Developed and implemented a plan in\nconjunction with the client to address\ntheir issues\n1.3 Provided referral to appropriate services\n1.4 Evaluated effectiveness of services\n1.5 Operated within duty of care and\norganizational requirements to address\nclient needs\n\n2.\nUnderpinning\nknowledge\nand\nattitudes\n\nIdentification of the impact of issues relating\nto:\n2.1 Mental Health\n2.2 Child Protection\n2.3 Domestic Violence\n2.4 Disability\n2.5 Homelessness\n2.6 Unemployment\n2.7 AOD\nKnowledge\nof\naccepted\npractices\nand\navailable referral agencies for working with\npeople experiencing issues related to:\n2.8 Mental Health\n2.9 Child Protection\n2.10 Domestic Violence\n2.11 Disability\n2.12 Homelessness\n2.13 AOD\n2.14 Or in any form of crisis\n\n--- PDF PAGE 95 ---\n3.\nUnderpinning skills\n\n3.1 Interpersonal skills to facilitate client to\nidentify options for change and for\naddressing their issues.\n3.2 Case work skills to ensure effective\nassessment, intervention and referral.\n3.3 Client management skills to deal with\ncomplex\nneeds\nand\ndifficult\nor\nchallenging behaviour.\n3.4 Information management to ensure all\nrecords are maintained, stored and\naccessible.\n3.5 Research skills to ensure a current and\ncorrect list of relevant services are\nreadily available to the client.\n3.6 Provision of a brief intervention to raise\nawareness, share knowledge and help\nclient to think about making changes to\nimprove well-being.\n3.7 Crisis intervention skills.\n4.\nResource\nimplications\nThe following resources MUST be provided:\n 4.1 Access to an appropriate workplace or an\nenvironment\ncapable\nof\naccurately\nstimulating the workplace of assessment\npurposes.\n5.\nMethod\nof\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6.\nContext\nof\nassessment\n 6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 96 ---\nUNIT OF COMPETENCY : DEVELOP AND PROVIDE HEALTH EDUCATION\n PROGRAM IN THE COMMUNITY\nUNIT CODE :",
          "underpinning_skills": [
            "3.1 Interpersonal skills to facilitate client to identify options for change and for addressing their issues. 3.2 Case work skills to ensure effective assessment, intervention and referral. 3.3 Client management skills to deal with complex needs and difficult or challenging behaviour. 3.4 Information management to ensure all records are maintained, stored and accessible. 3.5 Research skills to ensure a current and correct list of relevant services are readily available to the client. 3.6 Provision of a brief intervention to raise awareness, share knowledge and help client to think about making changes to improve well-being. 3.7 Crisis intervention skills. 4. Resource implications The following resources MUST be provided: 4.1 Access to an appropriate workplace or an environment capable of accurately stimulating the workplace of assessment purposes. 5. Method of assessment Competency may be assessed through: 5.1 Demonstration with questioning 5.2 Observation with questioning 5.3 Oral questioning/Interview 5.4 Portfolio 6. Context of assessment 6.1 Competency may be assessed in the workplace or in a simulated work setting.",
            "-- PDF PAGE 96 --- UNIT OF COMPETENCY : DEVELOP AND PROVIDE HEALTH EDUCATION PROGRAM IN THE COMMUNITY UNIT CODE :"
          ]
        },
        "source_text": "HCS346307\nUNIT DESCRIPTOR : This focus of the work is assisting clients to address\ntheir own issues. On completion of this unit, the\nworker will be able to respond appropriately to clients\nthat have complex issues outside and in addition to\nthe area of immediate focus, expertise or interests of\nthe worker and their organization. For instance, the\nworker might work for an agency, and possess\nrelevant competence, in the area of child protection,\nbut will still be able to identify when say alcohol and\nother drug issues are important in the life of a\npresenting client. Completion of the unit will also\nprovide the worker with competencies to make\ndecisions as to whether to refer or retain the client.\n\nThe worker will first be able to make a decision as to\nwhether a brief intervention is appropriate (instead of\nan immediate referral). The worker will be able to\nimplement and monitor brief intervention strategies in\na variety of community service contexts, with the\nprimary aim of helping the client accept the\nintervention.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1.\nEvaluate the range\nof issues impacting\non the client and\non the delivery of\nappropriate service\n\n1.1 Identify indicators of harm, neglect,\nabuse or risk of harm.\n1.2 Use observations, assessment tools and\nquestioning\nto\nidentify\npossible\npresenting issues.\n\n--- PDF PAGE 83 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n1.3 Seek information from a range of\nappropriate sources to determine the\nrange of issues that may be affecting the\nclient within organizations policies and\nprocedures regarding autonomy, privacy\nand confidentiality.\n1.4 Apply organizational procedures for\ncollecting\nand\nanalyzing\nclient\ninformation.\n1.5 Examine\nall\nclient\ninformation\nto\ndetermine the degree to which other\nissues may impact on the possible\nservices that can be provided by the\norganization.\n\n2.\nDetermine\nthe\ncourse of action to\nbe followed\n\n2.1 Assess the level of risk to the client and\nothers directly involved including family\nmembers\n2.2 Follow organizational procedures, legal\nrequirements and duty of care obligation\nto responding to indicators of risk of\nabuse, neglect or harm\n2.3 Check the services the organization\ndelivers against the range of client needs\nto be addressed\n2.4 Refer\nclient\nappropriately\nfollowing\norganizational protocols, policies and\nprocedures\n2.5 Apply accepted procedures to evaluate\nthe benefit to the client of referral to\nanother service.\n2.6 Evaluate the benefits of providing a brief\nintervention in facilitating the client to\naccess other services\n2.7 Apply accepted procedures to evaluate\nthe option of bringing in specialist support\nand continuing to work with the client.\n\n--- PDF PAGE 84 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n2.8 Provide the client with resources, such as\nwritten\nand\nverbal\ninformation,\nappropriate to their stage of change and\nactions to be followed.\n\n3.\nEstablish\ninterpersonal\nrelationship with the\nclient that will enable\nall\nissues\nto\nbe\naddressed\n\n3.1 Facilitative communication skills are\nutilized to assist the client to identify\nareas of concern, to prioritize areas for\nimmediate and longer term action to\ndetermine\noptions\nfor\naction\nand\nworkable strategies to address their\npriority areas.\n3.2 Define\nboundaries\nand\nuse\ncommunication skills that will establish a\ntrusting and respectful relationship.\n3.3 Assist client to develop their own action\nplans to address their circumstances.\n3.4 Relevant information is shared will the\nclient about services available, options,\nand health and well being issues to assist\nthem in determining a course of action.\n3.5 Work with the client to set personal goals\nand explore personal strategies, to\nidentify a hierarchy of strategies including\ncontingency plans.\n3.6 Work with the client to identify and plan\nfor potential consequences\nof\ntheir\ndecision.\n3.7 Implement procedures to ensure all\nservices and responses to client comply\nwith duty of care and accepted standards\nof ethical behaviour.\n\n4.\nProvide a brief\n intervention as\n required\n\n4.1 Assess a client’s need for intervention\nand the type of brief intervention\nrequired.\n4.2 Use brief intervention strategies which\nmatch the client’s stage of change.\n4.3 Implement appropriate procedures to\nprevent escalation of any potential\nemergency or crisis situation.\n\n--- PDF PAGE 85 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n4.4 Respond\nappropriately\nto\nemergencies\nand crisis\nsituations\naccording to organization procedures and\nin\naccordance\nwith\nduty\nof\ncare\nresponsibilities.\n4.5 Comply with cultural obligations which\ninfluence the use of brief intervention with\nparticular clients.\n4.6 Employ strategies to motivate, support\nand encourage the client.\n4.7 Current needs and sources of assistance\nare identified, and support given as\nappropriate.\n\n5.\nRespond\nappropriately\nto\npeople\nwho\nare\nvulnerable\nand\nat\nsignificant risk\n\n5.1 Apply a range of information collection\nmechanisms and assessment tools to\nestablish the degree of risk, neglect or\nharm.\n5.2 Assess the priority need for intervention.\n5.3 Implement appropriate procedures to\nprevent escalation of any potential\nemergency or crisis situation.\n5.4 Respond appropriately to emergencies\nand\ncrisis\nsituations\naccording\nto\norganization\nprocedures\nand\nin\naccordance with duty of care.\n5.5 Follow\norganizations\npolicies\nand\nprocedures and duty of care obligation in\nresponding to indicators of actual or\npotential risk of abuse, neglect or harm.\n\n--- PDF PAGE 86 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n6.\nEvaluate\neffectiveness\nof\nservices provided to\nmeet client needs\n\n6.1 Client’s\nprogress\nor\noutcomes\nare\nreviewed regularly in accordance with\norganizational\nprocedures\nand\nin\nconsultation with clients.\n6.2 Ensure client’s file notes are complete,\nup to date and include the client’ s stage\nof decision making on each occasion.\n6.3 Implement reflective practice strategies to\nensure\nfeedback\nis\nsought\nand\nincorporated in services delivery.\n\n--- PDF PAGE 87 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1.\nPresenting problem\nor issued\n\nA client with secondary or multiple issues is most\nlikely to present ‘first’ to the following types of\nservices (for an issue relevant to those services)\n1.1 Child protection\n1.2 Juvenile justice / youth services\n1.3 Social housing\n1.4 Employment service\n\n2.\nIndicators of harm,\nneglect, abuse or\nrisk of harm\n\n2.1 Physical symptoms such as injuries or\nloss of weight\n2.2 Verbal and non-verbal cues\n2.3 Impairment\nto\ncognitive\nfunctioning\ncaused by acquired brain injury such as\nloss of memory, inability to concentrate,\nplan, organize\n2.4 Reports from the individual, carers or\nother workers\n\n3.\nHarm,\nneglect,\nabuse\nor risk\nof\nharms\n\nIncludes:\n3.1 Physical\n3.2 Emotional\n3.3 Cognitive\n3.4 Psychological\n3.5 Sexual\n3.6 Financial\n\n4.\nAppropriate sources\nof information would\ninclude:\n\nInclude:\n4.1 Case notes\n4.2 File\n4.3 Other workers\n5.\nHarm,\nneglect,\nabuse\nor risk\nof\nharm\n\nMay be from:\n5.1 Carers\n5.2 Workers / service providers\n5.3 Self\n5.4 Family or significant others\n5.5 Community members\n\n--- PDF PAGE 88 ---\nVARIABLE\n\nRANGE\n\n6.\nResponses\nto\nindicators of risk of\nabuse, neglect or\nharm\n\nInclude:\n6.1 Intervention to remove the risk\n6.2 Reporting to appropriate personnel\n6.3 Investigating\n6.4 Seeking specialist support / services\n6.5 Referral\n\n7.\nResponses\nto\nindicators of risk of\nabuse, neglect or\nharm\n\nDetermined by:\n7.1 Legislation\n7.2 The specific job role\n7.3 Organizational procedures\n7.4 Family and cultural mores\n8.\nPeople\nwho\nare\nvulnerable and at\nsignificant risk\n\nMay be\n8.1 People with a disability\n8.2 People with an acquired brain injury\n8.3 Elderly people\n8.4 People with mental health issues\n8.5 Children and young people\n8.6 People who are homeless\n8.7 People in unequal power relationships\n\n9.\nAppropriate\nprocedures to\n prevent escalation\n of a potential\n emergency or crisis\n situation\nInclude:\n9.1 Calming skills\n9.2 Management\nand\ncontain\nemotional\nresponses and escalating behaviour\n9.3 Identify and address source of the issue\n9.4 Seek assistance from other workers,\ncarers, family or services\n\n10. Non\npresenting\nproblems or issues\n\nLikely to be:\n10.1 Alcohol and other drugs\n10.2 Mental illness\n10.3 Developmental disability\n10.4 Acquired Brain Injury\n10.5 Abuse and risk of abuse\n10.6 Domestic violence\n10.7 Homelessness / inadequate housing\n10.8 Unemployment\n10.9 Juvenile justice issues\n10.10\nCommunicable diseases\n10.11\nFinancial difficulties\n10.12\nNew arrival in the country\n\n--- PDF PAGE 89 ---\nVARIABLE\n\nRANGE\n\n11. Approaches\nto\naddressing specific\nissues\ninclude\napplying\naccepted\nmethodologies\nunderpinning values\nand philosophies of\nthe\nspecific\narea.\nThe following notes\noffer a guide:\n\n11.1 AOD may include knowledge of harm\nminimization practices, of the effects of\nAOD\non\nbody\nsystem\nand\nsocial\nrelationships, and of the signs and\nsymptoms of intoxication. Knowledge of\ngroups and agencies in the community\nwho can respond to individuals with AOD\nproblems by providing treatment and\ndetoxification programs is central. Also\nimportant is an awareness of personal\nbias, and models or perspectives on drug\nuse i.e. disease perspective, moral\nperspective of both the client and of\nreferral agencies.\n11.2 Mental health may include recognizing\nbasic signs and symptoms of anxiety,\ndepression,\nsuicidal\nimpulses,\nand\nindicators of mental illness such as\nhallucinations or delusion. Knowledge of\nappropriate\nreferral\nand\nintervention\nservices in the community is critical.\n11.3 Domestic violence may include an\nunderstanding of such violence as an\nabuse of power perpetrated both in a\nrelationship and after separation and that\nsuch violence takes a number of forms.\nThese\ninclude\nphysical\nand\nsexual\nviolence, emotional and psychological\nabuse\nand\neconomic\ndeprivation.\nDomestic violence occurs across all\ngroups, cultures and creeds. The safety\nand well-being of individuals subjected to\ndomestic violence should be of primary\nconcern. Knowledge of groups and\nagencies in the community who can\nrespond to individuals with domestic\nviolence issues is required.\n\n--- PDF PAGE 90 ---\nVARIABLE\n\nRANGE\n\n11.4 Child Protection will include knowledge\nof relevant state mandatory reporting\nlegislation and its application, of child\ndevelopment and behavioural / physical\nindicators of abuse, and of services in the\ncommunity\nthat\nrespond\nto\nchild\nprotection issues, it is vital to recognize\nthat children in families experiencing\ndifficulties, particularly where abuse of\nalcohol or other drugs occurs, are more\nlikely to be at risk of abuse. Working of\nfamilies and care givers to ensure the\nsafety of children is a priority.\n11.5 Development disability may describe\nindividuals who have a multiplicity of\ndisabilities including difficulty learning,\nthinking\na\nreasoning,\nretaining\ninformation\nand\nforming\nsocial\nrelationships. It is vital to recognize the\nindividuality of developmental disabled\npersons, there rights to age appropriate\nconsultation and to self determination.\nNeeds arising from social isolation and\nthe critical importance of primary care-\ngivers in the lives of developmental\ndisabled\npersons\nshould\nalso\nbe\nrecognized. Knowledge of groups and\nagencies in the community that can\nprovide advocacy services is required.\n\n--- PDF PAGE 91 ---\nVARIABLE\n\nRANGE\n\n11.6 Juvenile justice may include knowledge\nof adolescent clients and their special\nneed as individuals, within families and\nas part of a group, including stages of\ndevelopment and social issues affecting\nyouth. Recognition of the vulnerability of\nyoung people in their dealings with\nauthority and of the protection that should\noperate\nduring\nan\ninvestigation\nor\nproceeding in relation to an offense is\nrequired. Knowledge of groups and\nagencies in the community that can\nprovide services such as advocacy and\nlegal advice to young people in their\ndealings with the justice system is\nessential.\n11.7 Acquired Brain Injury may include\nawareness of the causes and effects of\nABI; understanding of the impact of\ncognitive impairment on the individual\nand families, including associated grief\nand loss issued; knowledge of the ABI\nservice system; skills in working with\npeople with challenging behaviours.\n\n12. Organizational\nprocedures\nfor\ncollecting\nand\nanalyzing\nclient\ninformation\n\nMay include written and oral input to:\n12.1 Questionnaires\n12.2 Assessment\n12.3 Client profile forms, etc.\n\n--- PDF PAGE 92 ---\nVARIABLE\n\nRANGE\n\n13. Procedures\nto\nprevent escalation of\na\npotential\nemergency or crisis\nsituation\n\nMay include:\n13.1 Using calming communication skills\n13.2 Managing and containing emotional\n responses and escalating behaviour\n13.3 Discussing the situation with the client\n13.4 Negotiation and mediation\n13.5 Seeking assistance from other workers\n or client carers\n13.6 Providing physical and visual barriers\n13.7 Evaluating the potential risk of the\n emergency\n13.8 Implementing specific communication\nskills including questioning, reflective\nlistening and body language\n\n14. Appropriate\nresponse\nto\nemergencies\nand\ncrisis situations\n\nMay include:\n14.1 Negotiating to prevent escalation\n14.2 Seeking assistance from other people or\nagencies\n14.3 Immediate referral\n14.4 Intervention to ensure physical safety\n15. Other information\n\nMay include:\n15.1 The client’s carers and or family\n15.2 Other\nagencies\nor\nworkers\nwith\nknowledge of the client\n15.3 Client files\n\n16. Specialist support\n\nMay include:\n16.1 Health professionals\n16.2 Careers and employment advice\n16.3 Financial counseling\n16.4 Family and relationship counseling\n16.5 Child Protection officers\n16.6 Mental health professional\n16.7 AOD detox, withdrawal and support\n16.8 Child care\n16.9 Centerlink officers\n\n--- PDF PAGE 93 ---\nVARIABLE\nRANGE\n\n17. All client information\n\nIncludes:\n17.1 Behaviour\n17.2 Responses to questions and other\ninformation provided by client\n17.3 Physical appearance and acuity\n17.4 File information\n17.5 Information on the client provided by\nfamily, carers, other workers, other\nagencies\n\n18. Accepted\nprocedures\nto\nevaluate the benefit\nto\nthe\nclient\nof\nreferral\n\nIncludes:\n18.1 Discussing options with the client, carers\nand family\n18.2 Checking the availability of services\nwithin the organization\n18.3 Checking\nthe\navailability\nand\naccessibility of other services\n\n19. Brief intervention will\nbe\nfocused\non\nproviding\nde-\nescalation\nand\nemotional support\n\n19.1 One-to-one approach, private\n19.2 Takes short period of time\n19.3 Can be done by anyone in the team\n19.4 A client led process\n19.5 Opportunistic\n19.6 Used for harm reduction and facilitating\nbehaviour change\n19.7 Carer respite (eg for client with ABI)\n\n20. Organizational\npolices\nand\nprocedures\n\nMay include:\n20.1 Incident reporting and documentation\n20.2 Operational\nguidelines\nfor\nhandling\ncases involving difficult and challenging\nbehaviour\n20.3 Record keeping\n20.4 Legal responses\n\n21. Decisions to provide\na brief intervention\n\nWill be based on:\n21.1 The issues of concern to the client and\nthe stage of decision to change is\ndetermined\n21.2 Availability of resources to support the\nbrief intervention\n21.3 Agency and worker mandate and focus\n\n--- PDF PAGE 94 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Identified the range of relevant issues\nthat may impact on service delivery\n1.2 Developed and implemented a plan in\nconjunction with the client to address\ntheir issues\n1.3 Provided referral to appropriate services\n1.4 Evaluated effectiveness of services\n1.5 Operated within duty of care and\norganizational requirements to address\nclient needs\n\n2.\nUnderpinning\nknowledge\nand\nattitudes\n\nIdentification of the impact of issues relating\nto:\n2.1 Mental Health\n2.2 Child Protection\n2.3 Domestic Violence\n2.4 Disability\n2.5 Homelessness\n2.6 Unemployment\n2.7 AOD\nKnowledge\nof\naccepted\npractices\nand\navailable referral agencies for working with\npeople experiencing issues related to:\n2.8 Mental Health\n2.9 Child Protection\n2.10 Domestic Violence\n2.11 Disability\n2.12 Homelessness\n2.13 AOD\n2.14 Or in any form of crisis\n\n--- PDF PAGE 95 ---\n3.\nUnderpinning skills\n\n3.1 Interpersonal skills to facilitate client to\nidentify options for change and for\naddressing their issues.\n3.2 Case work skills to ensure effective\nassessment, intervention and referral.\n3.3 Client management skills to deal with\ncomplex\nneeds\nand\ndifficult\nor\nchallenging behaviour.\n3.4 Information management to ensure all\nrecords are maintained, stored and\naccessible.\n3.5 Research skills to ensure a current and\ncorrect list of relevant services are\nreadily available to the client.\n3.6 Provision of a brief intervention to raise\nawareness, share knowledge and help\nclient to think about making changes to\nimprove well-being.\n3.7 Crisis intervention skills.\n4.\nResource\nimplications\nThe following resources MUST be provided:\n 4.1 Access to an appropriate workplace or an\nenvironment\ncapable\nof\naccurately\nstimulating the workplace of assessment\npurposes.\n5.\nMethod\nof\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6.\nContext\nof\nassessment\n 6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 96 ---\nUNIT OF COMPETENCY : DEVELOP AND PROVIDE HEALTH EDUCATION\n PROGRAM IN THE COMMUNITY\nUNIT CODE :"
