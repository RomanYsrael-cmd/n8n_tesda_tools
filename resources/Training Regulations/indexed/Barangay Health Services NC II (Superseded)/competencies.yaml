          "source_text": "1. Critical aspects of  \ncompetency \n \nAssessment \nrequires \nevidence \nthat \nthe \ncandidate: \n1.1 Provided a range of types of support to \ncommunities \naccording \nto \norganizational \nprocedures \n1.2 Communicated with a range of people in the \ncommunity \n1.3 Maintained and accessed effective networks \nwhich contribute to the achievement of \nobjectives \n1.4 Motivated individuals and groups to work \ncooperatively to address common concerns \n2. Underpinning \nknowledge and \nattitudes \n \n2.1 Nature of the community and significant \nrelationships and resources including \ncultural program / service objectives \n2.2 Relevant agencies programs and criteria \n2.3 Communication strategies \n2.4 Principles of social organization and \nstructures \n2.5 Depending on the work role or services \nprovided specific knowledge of particular \ngroups or issues may be required, \nincluding: \n- \nAlcohol and other drugs \n- \nCultural and linguistic diversity \n- \nRisk of self harm \n- \nWomen \n- \nMen \n- \nCommunity education \n- \nMental health\n\n--- PDF PAGE 67 ---\n3. Underpinning skills \n \n3.1 Oral communication competence  \n3.2 Asking questions, listening to \ninformation, and seeking clarification \n3.3 Reading competence required if worker \nis using pamphlets or written information, \nto determine if an organization or service \nis relevant to a particular group   \n3.4 Writing skills will be needed if \norganizations require a written list of \ncommunity facilities and resources \n3.5 Documenting what is required by the \norganization \n3.6   Encoding skills \n4. Resource implications \n \nThe following resources MUST be provided: \n4.1   Access to a workplace or community or an \nenvironment that effectively simulates \nworkplace or community conditions. \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Observation with questioning \n5.3 Oral questioning/Interview \n5.4 Portfolio \n6. Context of \nassessment \n6.1 Competency may be assessed in the \nworkplace or in a simulated work setting.",
