  "source_section_text": "SECTION 2. COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in BARANGAY HEALTH SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: PARTICIPATE IN WORKPLACE\n COMMUNICATION\nUNIT CODE : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n required to gather, interpret and convey information\n in response to workplace requirements.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Obtain and convey\n workplace\n information\n\n1.1 Specific and relevant information is accessed from\nappropriate sources.\n1.2 Effective\nquestioning,\nactive\nlistening\nand\nspeaking skills are used to gather and convey\ninformation.\n1.3 Appropriate\nmedium\nis\nused\nto\ntransfer\ninformation and ideas.\n1.4 Appropriate non-verbal communication is used.\n1.5 Appropriate\nlines\nof\ncommunication\nwith\nsupervisors and colleagues are identified and\nfollowed.\n1.6 Defined workplace procedures for the location and\nstorage of information are used.\n1.7 Personal interaction is carried out clearly and\nconcisely.\n\n2. Participate in\n workplace meetings\n and discussions\n\n2.1 Team meetings are attended on time.\n2.2 Own opinions are clearly expressed and those of\nothers are listened to without interruption.\n2.3 Meeting inputs are consistent with the meeting\npurpose and established protocols.\n\n--- PDF PAGE 8 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n2.4 Workplace interactions are conducted in a\ncourteous manner.\n2.5 Questions\nabout\nsimple\nroutine\nworkplace\nprocedures and matters concerning working\nconditions\nof\nemployment\nare\nasked\nand\nresponded to.\n2.6 Meetings\noutcomes\nare\ninterpreted\nand\nimplemented.\n\n3. Complete relevant\n work related\n documents\n\n3.1\nRange of forms relating to conditions of\nemployment are completed accurately and\nlegibly.\n3.2\nWorkplace data is recorded on standard\nworkplace forms and documents.\n3.3\nBasic mathematical processes are used for\nroutine calculations.\n3.4\nErrors in recording information on forms /\ndocuments are identified and properly acted\nupon.\n\n--- PDF PAGE 9 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Appropriate sources\n\n1.1 Team members\n1.2 Suppliers\n1.3 Trade personnel\n1.4 Local government\n1.5 Industry bodies\n\n2. Medium\n2.1 Memorandum\n2.2 Circular\n2.3 Notice\n2.4 Information discussion\n2.5 Follow-up or verbal instructions\n2.6 Face to face communication\n\n3. Storage\n3.1 Manual filing system\n3.2 Computer-based filing system\n\n4. Forms\n4.1 Personnel forms, telephone message forms,\n safety reports\n\n5. Workplace\n interaction\n\n5.1 Face to face\n5.2 Telephone\n5.3 Electronic and two way radio\n5.4 Written including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n\n6. Protocols\n6.1 Observing meeting\n6.2 Compliance with meeting decisions\n6.3 Obeying meeting instructions\n\n--- PDF PAGE 10 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following\nstandard format of the organization\n1.2\nAccessed\ninformation\nusing\ncommunication equipment\n1.3\nMade use of relevant terms as an aid to\ntransfer information effectively\n1.4\nConveyed information effectively adopting\nthe formal or informal communication\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and\nthe individual’s work responsibilities\n3.\nUnderpinning\nskills\n\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following\nsimple written notices\n3.3\nParticipate in workplace meetings and\ndiscussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine\nworkplace measures\n3.6\nBasic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7\nAbility to relate to people of social range in\nthe workplace\n3.8\nGather\nand\nprovide\ninformation\nin\nresponse to workplace requirements\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5.\nMethod of\n assessment\n\nCompetency may be assessed through:\n5.1\nDirect observation\n5.2\nOral interview and written test\n6.\nContext of\n assessment\n6.1\nCompetency may be assessed individually\nin the actual workplace or through\naccredited institution.\n\n--- PDF PAGE 11 ---\nUNIT OF COMPETENCY: WORK IN A TEAM ENVIRONMENT\nUNIT CODE : 500311106\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n to identify role and responsibility as a member of a\n team.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\nDescribe\nteam\nrole and scope\n\n1.1 The role and objective of the team is\nidentified\nfrom\navailable\nsources\nof\ninformation.\n1.2 Team parameters, reporting relationships and\nresponsibilities are identified from team\ndiscussions and appropriate external sources.\n2.\nIdentify own role\nand\nresponsibility\nwithin team\n\n2.1 Individual role and responsibilities within the\nteam environment are identified.\n2.2 Roles and responsibility of other team\nmembers are identified and recognized.\n2.3 Reporting relationships within team and\nexternal to team are identified.\n3.\nWork as a team\nmember\n\n3.1 Effective\nand\nappropriate\nforms\nof\ncommunications\nused\nand\ninteractions\nundertaken\nwith\nteam\nactivities\nand\nobjectives.\n3.2 Effective and appropriate contributions made\nto complement team activities and objectives,\nbased on individual skills and competencies\nand workplace context.\n3.3 Observe protocols in reporting using standard\noperating procedures.\n3.4 Contribute to the development of teamwork\nplans based on an understanding of team’s\nrole\nand\nobjectives\nand\nindividual\ncompetencies of the members.\n\n--- PDF PAGE 12 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Role and\n objective of team\n\n1.1\nWork activities in a team environment with\nenterprise or specific sector\n1.2\nLimited discretion, initiative and judgment\nmaybe demonstrated on the job, either\nindividually or in a team environment\n\n2. Sources of\n information\n\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine\n/\nequipment\nmanufacturer’s\nspecifications and instructions\n2.4\nOrganizational or external personnel\n2.5\nClient / supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n\n3. Workplace\ncontext\n\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard\nwork\npractice\nincluding\nthe\nstorage, safe handling and disposal of\nchemicals\n3.5\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 13 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Operated in a team to complete workplace\nactivity\n1.2 Worked effectively with others\n1.3 Conveyed information in written or oral form\n1.4 Selected and used appropriate workplace\nlanguage\n1.5 Followed designated work plan for the job\n1.6 Reported outcomes\n\n2.\nUnderpinning\nknowledge and\nattitude\n\n2.1 Communication process\n2.2 Team structure\n2.3 Team roles\n2.4 Group planning and decision making\n\n3.\nUnderpinning\nskills\n\n3.1 Communicate appropriately, consistent with\nthe culture of the workplace\n\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment\ncan take place\n4.2 Materials relevant to the proposed activity or\ntasks\n\n5.\nMethod of\n assessment\n\nCompetency may be assessed through:\n5.1 Observation of the individual member in relation\nof the work activities of the group.\n5.2 Observation of simulation and or role play\ninvolving the participation of individual member to\nthe attainment of organizational goal.\n5.3 Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork.\n\n6.\nContext of\n assessment\n\n6.1 Competency may be assessed in workplace or in\na simulated workplace setting.\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in group.\n\n--- PDF PAGE 14 ---\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\nUNIT CODE : 500311107\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n in promoting career growth and advancement.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\nIntegrate\npersonal\nobjectives with\norganizational\ngoals\n\n1.1\nPersonal growth and work plans are pursued\ntowards improving the qualifications set for\nthe profession.\n1.2\nIntra-and\ninterpersonal\nrelationships\nare\nmaintained in the course of managing oneself\nbased on performance evaluation.\n1.3\nCommitment to the organization and its goal\nis demonstrated in the performance of duties.\n\n2.\nSet and meet\nwork priorities\n\n2.1\nCompeting\ndemands\nare\nprioritized\nto\nachieve personal, team and organizational\ngoals and objectives.\n2.2\nResources\nare\nutilized\nefficiently\nand\neffectively to manage work priorities and\ncommitments.\n2.3\nPractices\nalong\neconomic\nuse\nand\nmaintenance of equipment and facilities are\nfollowed as per established procedures.\n\n3.\nMaintain\nprofessional\ngrowth\nand\ndevelopment\n\n3.1\nTrainings and career opportunities are\nidentified and availed of based on job\nrequirements.\n3.2\nRecognitions are sought / received and\ndemonstrated\nas\nproof\nof\ncareer\nadvancement.\n3.3\nLicenses and/or certifications relevant to\njob and career are obtained and renewed.\n\n--- PDF PAGE 15 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Evaluation\n\n1.1 Performance Appraisal\n1.2 Psychological profile\n1.3 Aptitude Tests\n\n2. Resources\n\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1. Hardware\n2.3.2. Software\n\n 3. Trainings and\n career\n opportunities\n\n3.1 Participation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n\n 4. Recognitions\n\n4.1 Recommendations\n 4.2 Citations\n 4.3 Certificate of Appreciation\n 4.4 Commendations\n 4.5 Awards\n 4.6 Tangible and Intangible Rewards\n\n 5. Licenses and/or\n certifications\n\n 5.1 National Certificates\n 5.2 Certificate of Competency\n 5.3 Support Level Licenses\n 5.4 Professional Licenses\n\n--- PDF PAGE 16 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas\n(KRAs)\n1.2\nMaintained\nintra-\nand\ninterpersonal\nrelationship in the course of managing\noneself based on performance evaluation\n1.3\nCompleted\ntrainings\nand\ncareer\nopportunities which are based on the\nrequirements of the industries\n1.4\nAcquired and maintained licenses and/or\ncertifications according to the requirement\nof the qualification\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nWork values and ethics (Code of Conduct,\nCode of Ethics, etc.)\n2.2\nCompany policies\n2.3\nCompany-operations,\nprocedures\nand\nstandards\n2.4\nFundamental rights and work including\ngender sensitivity\n2.5\nPersonal hygiene practices\n\n3.\nUnderpinning\nskills\n\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and interpersonal skills\n3.3\nCommunication skills\n\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies / scenarios\n\n5.\nMethod of\nassessment\n\nCompetency may be assessed through:\n 5.1 Portfolio Assessment\n 5.2 Interview\n 5.3 Simulation / Role-plays\n 5.4 Observation\n 5.5 Third Party Reports\n 5.6 Exams and Tests\n\n6.\nContext of\n assessment\n\n6.1 Competency may be assessed in the workplace\nor in a simulated work place setting\n\n--- PDF PAGE 17 ---\nUNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND\n SAFETY PROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply\n with regulatory and organizational requirements for\n occupational health and safety.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards\nand risks\n\n1.1\nSafety regulations and workplace safety\nand hazard control practices and procedures\nare\nclarified\nand explained based on\norganization procedures.\n1.2\nHazards/risks in the workplace and their\ncorresponding indicators are identified to\nminimize or eliminate risk to co-workers,\nworkplace and environment in accordance\nwith organization procedures.\n1.3\nContingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance\nwith organization procedures.\n\n2. Evaluate\nhazards and\n risks\n\n2.1\nTerms of maximum tolerable limits which\nwhen exceeded will result in harm or\ndamage are identified based on threshold\nlimit values (TLV).\n2.2\nEffects of the hazards are determined.\n2.3\nOHS issues and/or concerns and identified\nsafety hazards are reported to designated\npersonnel in accordance with workplace\nrequirements and relevant workplace OHS\nlegislation.\n\n--- PDF PAGE 18 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n3. Control hazards\nand risks\n\n3.1\nOccupational Health and Safety (OHS)\nprocedures for controlling hazards/ risks in\nworkplace are consistently followed.\n3.2\nProcedures for dealing\nwith workplace\naccidents, fire and emergencies are followed\nin\naccordance\nwith\norganization\nOHS\npolicies.\n3.3\nPersonal protective equipment (PPE) is\ncorrectly\nused\nin\naccordance\nwith\norganization OHS procedures and practices.\n3.4\nAppropriate assistance is provided in the\nevent\nof\na\nworkplace\nemergency\nin\naccordance with established organization\nprotocol.\n\n4. Maintain\nOHS\nawareness\n\n4.1\nEmergency-related drills and trainings are\nparticipated\nin\nas\nper\nestablished\norganization guidelines and procedures.\n4.2\nOHS personal records are completed and\nupdated in accordance with workplace\nrequirements.\n\n--- PDF PAGE 19 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Safety\nregulations\n\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building Code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n\n2. Hazards / Risks\n\nMay include but are not limited to:\n2.1 Physical hazards - impact, illumination,\npressure,\nnoise,\nvibration,\ntemperature,\nradiation\n2.2 Biological hazards – bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists,\nfumes, smoke, gasses, vapors\n2.4 Ergonomics\n● Psychological factors – over exertion /\n excessive force, awkward / static positions,\nfatigue, direct pressure, varying metabolic\ncycles\n ● Physiological factors – monotony, personal\n relationship, work out cycle\n\n3. Contingency\n measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n\n--- PDF PAGE 20 ---\nVARIABLE\n\nRANGE\n4. PPE\n\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/ cap/ bonnet\n4.5 Face mask/ shield\n4.6 Ear muffs\n4.7 Apron/ Gown/ coverall / jump suit\n4.8 Anti-static suits\n\n5. Emergency –\n related drills and\n training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support /CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical toxic\n5.7 Disaster preparedness / management\n\n6. OHS personal\n records\n\n6.1 Medical / Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 21 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1\nExplained\nclearly\nestablished\nworkplace\nsafety and hazard control practices and\nprocedures\n1.2\nIdentified hazards/risks in the workplace and\nits corresponding indicators in accordance\nwith company procedures\n1.3\nRecognized contingency measures during\nworkplace\naccidents,\nfire\nand\n\nother\nemergencies\n1.4\nIdentified terms of maximum tolerable limits\nbased on threshold limit value –TLV.\n1.5\nFollowed Occupational Health and Safety\n(OHS) procedures for controlling hazards /\nrisks in workplace\n1.6\nUsed Personal Protective Equipment (PPE)\nin\naccordance\nwith\ncompany\nOHS\nprocedures and practices\n1.7\nCompleted and updated OHS personal\nrecords\nin\naccordance\nwith\nworkplace\nrequirements\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nOHS\nprocedures\nand\npractices\nand\nregulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards / risks identification and control\n2.5\nThreshold Limit Value (TLV)\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3.\nUnderpinning\nskills\n\n3.1\nPractice of personal hygiene\n3.2\nHazards / risks identification and control\nskills\n3.3\nInterpersonal skills\n3.4\nCommunication sills\n\n--- PDF PAGE 22 ---\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n\n5.\nMethod of\nassessment\n\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study / Situation\n\n6.\nContext of\n assessment\n\n6.1\nCompetency may be assessed in the work\nplace or in a simulated work place setting\n\n--- PDF PAGE 23 ---\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: IMPLEMENT AND MONITOR INFECTION\n CONTROL POLICIES AND PROCEDURES\nUNIT CODE : HCS323202\nUNIT DESCRIPTOR : This unit is concerned with infection control\n responsibilities of employees with supervisory\n accountability to implement and monitor infection\n control policy and procedures in a specific work unit\n or team within an organization. This unit does not\n apply to a role with organization-wide responsibilities\n for infection control policy and procedure\n development, implementation or monitoring.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\nProvide\ninformation\nto\nthe work group\nabout\nthe\norganization’s\ninfection control\npolicies\nand\nprocedures\n\n1.1\nRelevant\ninformation\nabout\nthe\norganization’s infection control policy and\nprocedures, and applicable industry codes of\npractice are accurately and clearly explained\nto the work group.\n1.2\nInformation about identified hazards and the\noutcomes of infection risk assessments is\nregularly provided to the work group.\n1.3\nOpportunity is provided for the work group to\nseek\nfurther\ninformation\non\nworkplace\ninfection control issues and practices.\n\n2.\nIntegrate\nthe\norganization’s\ninfection control\npolicy\nand\nprocedure\ninto\nwork practices\n\n2.1\nInfection control policy and procedures are\nimplemented by supervisor and members of\nthe work group.\n2.2\nLiaison\nis\nmaintained\nwith\nperson\nresponsible for organization-wide infection\ncontrol.\n2.3\nThe supervisor’s coaching support ensures\nthat individuals/teams are able to implement\ninfection control practices.\n2.4\nWork procedures are adopted to reflect\nappropriate infection control practices.\n\n--- PDF PAGE 24 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n2.5\nIssues raised through consultation are dealt\nwith and resolved promptly or referred to the\nappropriate personnel for resolution.\n2.6\nWorkplace procedures for dealing with\ninfection control risks and hazardous events\nare implemented whenever necessary.\n2.7\nEmployees\nare\nencouraged\nto\nreport\ninfection.\n\n3.\nMonitor infection\ncontrol\nperformance\nand\nimplement\nimprovements in\npractices\n\n3.1\nInfection control hazardous events are\ninvestigated promptly to identify their cause\nin accordance with organization policy and\nprocedures.\n3.2\nWork procedures to control infection risks\nare monitored to ensure compliance.\n3.3\nWork procedures are regularly reviewed and\nadjusted to ensure improvements in infection\ncontrol practice.\n3.4\nSupervisor provides feedback to team and\nindividuals on compliance issues, changes in\nwork\nprocedures\nand\ninfection\ncontrol\noutcomes.\n3.5\nTraining in work procedures is provided as\nrequired to ensure maintenance of infection\ncontrol standards.\n3.6\nInadequacies\nin\nwork\nprocedures\nand\ninfection control measures are identified,\ncorrected\nor\nreported\nto\ndesignated\npersonnel.\n3.7\nRecords of infection control risks and\nincidents are accurately maintained as\nrequired.\n3.8\nAggregate infection control information\nreports are used to identify hazards, to\nmonitor an improve risk control methods and\nto indicate training needs.\n\n--- PDF PAGE 25 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1.\nInfection\nControl\nPolicies\nand\nProcedures\n\nThis may include but not limited to:\n1.1 Cleaning procedures and schedules\n1.2 Cleaning agents\n1.3 Cleaning equipment\n1.4 Handling, storage and disposal of all types of\nwaste\n1.5 Food handling and food safety\n1.6 Hygiene procedures\n1.7 Infection control risk management\n1.8 Infection control incident and hazard reporting\n1.9 Sterilizing\n1.10\nLinen production and handling\n1.11\nMaintenance procedures\n1.12\nStorage requirements\n1.13\nPersonal protective clothing\n1.14\nWork flows\n1.15\nManagement of blood and body fluid\nspills\n1.16\nSingle use of disposables\n1.17\nAseptic techniques\n1.18\nSkin preparation procedures\n1.19\nImmunization\n1.20\nNeedle stick injuries\n1.21\nPersonal contact with infectious patients\n1.22\nStandard and additional precautions\n1.23\nConfidentiality\n1.24\nEmployee training\n1.25\nContractors\n\n2.\nIndustry\nCodes\nof\nPractice\n\n2.1 National Health and Medical Research Council\nGuidelines for infection control\n2.2 Local and National Government Guidelines\nand Standards\n2.3 Manufacturer’s\nrecommendations\nand\noperating manuals\n\n--- PDF PAGE 26 ---\nVARIABLE\n\nRANGE\n\n3.\nIdentified\nhazards\nand\nthe outcomes\nof\ninfection\nrisk\nassessment\n3.1 Sharps\n3.2 Glass\n3.3 Waste\n3.4 Human waste and human tissues\n3.5 Personal contact with infectious patients\n3.6 Animals, insects and vermin\n3.7 Stock, including food, which has passed “used-\nby” dates.\n3.8 Incorrect concentration of disinfectants and\nchemicals\n3.9 Cleaning procedures\n3.10\nLinen handling procedures\n3.11\nWork flows\n3.12\nUse of personal protective clothing\n3.13\nFood safety\n3.14\nPersonal hygiene\n\n4.\nInfection\nControl\nMonitoring\nProcedures\n\n4.1 Observations\n4.2 Interviews\n4.3 Surveys and inspections\n4.4 Quality assurance activities\n4.5 Review of outcomes\n4.6 Data analysis\n\n5.\nDesignated\npersonnel\n\n5.1 Manager\n5.2 Infection Control Coordinator\n5.3 Quality Improvement Coordinator\n5.4 Infection Control Committee\n5.5 Occupational Health and Safety Committee\n\n6.\nAggregate\ninfection\ncontrol\ninformation\n\n6.1 Records of needle stick injuries\n6.2 Hospital-acquired infection rates\n6.3 DOH healthcare standards clinical indicators\n6.4 HACCP records\n6.5 Hazard reports\n\n--- PDF PAGE 27 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate\n1.1\nCommunicated with team and individuals on\norganizational policy and procedures for\ninfection control\n1.2\nApplied\ninfection\ncontrol\npolicies\nand\nprocedures which impact on work processes\nof the specific work unit\n1.3\nApplied procedures for adopting appropriate\ninfection practices within work unit\n1.4\nProvided appropriate supervision of work\ngroup\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nWorking knowledge, consistent with the\nelements\nof\ncompetence,\nof\nthe\norganization’s applicable infection control\npolicy and procedures and relevant industry\ncodes of practice\n2.2\nThe hierarchy risk control measures from\nmost to least preferred, that is, elimination,\nengineering controls, administrative control,\nand lastly, personal protective equipment\n2.3\nKnowledge of infection risks and control\nmeasures in specific work unit and related\nwork processes\n2.4\nThe significance of patient confidentiality in\nrelation to infection control\n2.5\nThe significance of other management\nsystems and procedures for infection control\n2.6\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n2.7\nOrganizational procedures for monitoring,\ntraining\n2.8\nBasic\nunderstanding\nof\ncommunicable\ndisease transmission\n3.\nUnderpinning\nskills\n\n3.1\nEffective communication and interpersonal\nskills including:\n-\nlanguage competence\n-\nliteracy and reading competence\n3.2\nNegotiation\n3.3\nWork planning and management\n3.4\nManaging change of work processes\n\n--- PDF PAGE 28 ---\n3.5\nMonitoring\ncompliance\nwith\npolicy\nand\nprocedures\n3.6\nMaintaining and interpreting infection control\nrecords\n\n4.\nResource\nImplications\n\nThe following resources MUST be provided:\n4.1\nWorkplace infection control and health and\nsafety policies and procedures\n4.2\nWaste management procedures\n4.3\nFood safety procedures\n4.4\nOther organizational policies and procedures\n4.5\nDuties statements and/or job descriptions\n\n5.\nMethod\nof\nassessment\n\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n5.3\nPortfolio\n5.4\nDemonstration with questioning\n\n6.\nContext\nof\nassessment\n\n6.1\nAssessment may be done in the workplace\nor in a simulated workplace setting.\n\n--- PDF PAGE 29 ---\nUNIT OF COMPETENCY: RESPOND EFFECTIVELY TO DIFFICULTY /\n CHALLENGING BEHAVIOR\nUNIT CODE : HCS323203\nUNIT DESCRIPTOR : This unit of competency covers the knowledge,\n skills and attitudes required to effectively respond to\n difficult or challenging behavior of patients.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan responses\n\n1.1 Responses are planned to instances of\ndifficult or challenging behavior to maximize\nthe availability of other appropriate staff and\nresources.\n1.2 Specific\nmanifestations\nof\ndifficult\nor\nchallenging behavior are identified and\nstrategies appropriate to these behaviors are\nplanned as required.\n1.3 Safety of self and others is given priority in\nresponding to difficult or challenging behavior\naccording\nto\ninstitutional\npolicies\nand\nprocedures.\n\n2. Apply response\n\n2.1 Difficult or challenging behavior is dealt with\npromptly,\nfirmly\nand\ndiplomatically\nin\naccordance with institutional policy and\nprocedures.\n2.2 Communication is used effectively to achieve\nthe desired outcomes in responding to difficult\nor challenging behavior.\n2.3 Appropriate strategies are selected to suit\nparticular instances of difficult or challenging\nbehavior.\n\n--- PDF PAGE 30 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Report\nand\nreview incidents\n\n3.1 Incidents are reported according to institutional\npolicies and procedures.\n3.2 Incidents are reviewed with appropriate staff\nand suggestions appropriate to area of\nresponsibility are made.\n3.3 Debriefing mechanisms and other activities\nare used and participated in.\n3.4 Advice\nand\nassistance\nis\nsought\nfrom\nlegitimate sources when appropriate.\n\n--- PDF PAGE 31 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Planned\nresponses\n\n1.1 Own ability and experience\n1.2 Established institutional procedures\n1.3 Knowledge\nof\nindividual\npersons\nand\nunderlying causes\n\n2. Difficult\nor\nchallenging\nbehavior\n\n2.1 Aggression / Assaultive behavior\n2.2 Confusion or other cognitive impairment\n2.3 Noisiness\n2.4 Manipulative\n2.5 Wandering\n2.6 Self-destructive\n2.7 Intoxication\n2.8 Withdrawn / depressed\n2.9 Negativistic\n2.10\nIntrusive behavior\n2.11\nVerbal offensiveness\n\n3. Strategies\nfor\ndealing\nwith\nchallenging\nbehaviors\n\n3.1 Diversional activities\n3.2 Referring to appropriate personnel e.g.\nsupervisor, security officer\n3.3 Following established emergency response\nprocedures\n\n4. Selection\nof\nstrategies\nfor\ndealing\nwith\nchallenging\nbehaviors\n\n4.1 The nature of the incident\n4.2 Potential effect on different parties, patient,\nstaff and others\n4.3 Established procedures and guidelines\n\n5. Institutional\npolices\nand\nprocedures\n\n5.1 Incident reporting and documentation\n5.2 Operational guidelines for handling incidents\nand/or cases involving difficult and challenging\nbehavior\n5.3 Debriefing of staff involved in the incident\n\n--- PDF PAGE 32 ---\nEVIDENCE GUIDE\n\n1. Critical\naspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified specific manifestations of difficult or\nchallenging behavior and strategies are\nplanned, selected and applied as required\n1.2 Maintained personal safety and the safety of\nothers\n1.3 Reported incidents, reviewed and responded\nquickly and effectively to contingencies\n1.4 Debriefing mechanisms are used\n\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1 OSH and issues relating to difficult and\nchallenging behavior\n2.2 Patient issues which need to be referred to an\nappropriate health professional\n2.3 Ability to interpret and follow the instructions\nand guidance of health professionals involved\nwith the care of patient / client\n\n3. Underpinning\nskills\n\n3.1 Effectively using techniques for monitoring\nown service area including client satisfaction\n3.2 Speaking in a firm, diplomatic and culturally\nappropriate manner\n3.3 Remaining calm and positive in adversity\n3.4 Thinking\nand\nresponding\nquickly\nand\nstrategically\n3.5 Remaining alert to potential incidents of\ndifficult or challenging behavior\n3.6 Monitoring\nand/or\nmaintaining\nsecurity\nequipment\n3.7 Working with others and displaying empathy\nwith patient and relatives\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment\ncan take place\n4.2 Relevant\ninstitutional\npolicy,\nguidelines,\nprocedures and protocols\n4.3 Emergency\nresponse\nprocedures\nand\nemployee support arrangements\n\n--- PDF PAGE 33 ---\n5. Method\nof\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n\n6. Context\nof\nassessment\n\n6.1 Assessment may be done in the workplace or\nin a simulated workplace setting.\n\n--- PDF PAGE 34 ---\nUNIT OF COMPETENCY: APPLY BASIC FIRST AID\nUNIT CODE : HCS323204\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \\\nrequired to provide an initial response where First Aid\nis required. In this unit it is assumed that the First\nAider is working under supervision and /or according\nto established workplace First Aid procedures and\npolicies.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess\nthe\nsituation\n\n1.1 Physical hazards to self and casualty’s health\nand safety are identified.\n1.2 Immediate risks to self and casualty’s\noccupational health and safety (OSH) are\nminimized\nby\ncontrolling\nthe\nhazard\nin\naccordance with OSH requirements.\n1.3 Casualty’s vital signs and physical condition\nare assessed in accordance with workplace\nprocedures.\n\n2. Apply basic first\naid techniques\n\n2.1 First\nAid\nmanagement\nis\nprovided\nin\naccordance\nwith\nestablished\nFirst\nAid\nprocedures.\n2.2 Casualty is reassured in a caring and calm\nmanner and made comfortable using available\nresources.\n2.3 First Aid assistance is sought from others in a\ntimely manner and as appropriate.\n2.4 Casualty’s\ncondition\nis\nmonitored\nand\nresponded to in accordance with effective.\nFirst\nAid\nprinciples\nand\nworkplace\nprocedures.\n2.5 Details\nof\ncasualty’s\nphysical\ncondition,\nchanges in conditions, management and\nresponse are accurately recorded in line with\norganizational procedures.\n2.6 Casualty management is finalized according to\nhis/her needs and First Aid principles.\n\n--- PDF PAGE 35 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Communicable\ndetails\nof\nthe\nincident\n\n3.1 Appropriate medical assistance is requested\nusing relevant communication media and\nequipment.\n3.2 Details\nof\ncasualty’s\ncondition\nand\nmanagement\nactivities\nare\naccurately\nconveyed to emergency services / relieving\npersonnel.\n3.3 Reports to supervisors are prepared in a\ntimely manner, presenting all relevant facts\naccording\nto\nestablished\ncompany\nprocedures.\n\n--- PDF PAGE 36 ---\n\n--- PDF PAGE 37 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. First Aid\n Management\n\nThis may include but not limited to:\n1.1 Workplace policies and procedures\n1.2 Industry / site specific regulations, codes\n1.3 OSH\n1.4 State and territory workplace health and safety\nrequirements\n1.5 Allergies the casualty may have\n\n2. Physical Hazards\n\nPhysical hazards may include:\n2.1 Workplace hazards\n2.2 Environmental hazards\n2.3 Proximity of other people\n2.4 Hazards associated with casualty management\nprocesses\n\n3. Risks\n\nRisks may include:\n3.1 Worksite\nequipment,\nmachinery\nand\nsubstances\n3.2 Environmental risks\n3.3 Bodily fluids\n3.4 Risk of further injury to the casualty\n3.5 Risk associated with the proximity of the others\nand bystanders\n\n4. Casualty’s\ncondition\n\nCasualty’s condition may include but not limited to the\nfollowing:\n4.1 Abdominal injuries\n4.2 Allergic reactions\n4.3 Bleeding\n4.4 Burns – thermal, chemical, friction, electrical\n4.5 Cardiac conditions\n4.6 Chemical contamination\n4.7 Cod injuries\n\n--- PDF PAGE 38 ---\nVARIABLE\n\nRANGE\n\n4.8 Crush injuries\n4.9 Dislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n\n5. Equipment\nand\nResources\n\nEquipment and other resources may include:\n5.1 Defibrillation units\n5.2 Pressure bandages\n5.3 Thermometers\n5.4 First Aid Kit\n5.5 Eyewash\n5.6 Thermal blankets\n5.7 Pocket face masks\n5.8 Rubber gloves\n5.9 Dressing\n5.10\nSpace device\n5.11\nCervical collars\n\n6. Communication\nsystem\n\n6.1 Mobile phone\n6.2 Satellite phones\n6.3 HF /VHF radio\n6.4 Flags\n6.5 Flares\n6.6 Two-way radio\n6.7 Email\n6.8 Electronic equipment\n\n--- PDF PAGE 39 ---\nVARIABLE\n\nRANGE\n7. Vital signs\n\n7.1 Breathing\n7.2 Circulation\n7.3 Consciousness\n\n8. First\nAid\nPrinciples\n\n8.1 Checking the site for danger to self, casualty\nand others and minimizing the danger\n8.2 Checking and maintaining the casualty’s\nairways, breathing and circulation\n\n--- PDF PAGE 40 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements,\nOSH laws infections control and manual\nhandling procedures and relevant health\nregulations\n1.2\nIdentified physical hazards of the casualty\nand minimized immediate risks\n1.3\nAssessed\nand\nmonitored\nthe\nphysical\ncondition of the casualty\n1.4\nResponded to emergency using basic life\nsupport measures\n1.5\nProvided initial response where First Aid is\nrequired\n1.6\nDealt with complex casualties or incident\n1.7\nPrepared reports to concerned personnel in\na timely manner\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures\n(SOPS)\n2.3\nDealing with confidentiality\n2.4\nKnowledge\nof\nthe\nFirst\nAider’s\nskills\nlimitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material\nsafety data sheets\n\n3.\nUnderpinning\nskills\n\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nPreparing reports\n3.5\nCommunication skills\n3.6\nInterpreting and using listed documents\n\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines\nprocedures and protocol\n4.3\nEquipment and materials relevant to the\nproposed activities\n\n--- PDF PAGE 41 ---\n5.\nMethod\nof\nassessment\n\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n5.4\nPortfolio\n\n6.\nContext\nof\nassessment\n\n6.1\nAssessment may be done in a workplace or\nsimulated work area setting.\n\n--- PDF PAGE 42 ---\nUNIT OF COMPETENCY: MAINTAIN HIGH STANDARDS OF PATIENT\n SERVICES\nUNIT CODE : HCS323204\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \\\nrequired in the maintenance of high standards of\npatient services.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\n appropriately with\n patients\n\n1.1\nEffective communication strategies and\ntechniques are identified and used to achieve\nbest patient service outcomes.\n1.2\nComplaints are responded to in accordance\nwith organizational policy to ensure best\nservice to patients.\n1.3\nComplaints are dealt with in accordance with\nestablished procedures.\n1.4\nInterpreter services are accessed as required.\n1.5\nAction is taken to resolve conflicts either\ndirectly, where a positive outcome can be\nimmediately achieved, or by referral to the\nappropriate personnel.\n1.6\nParticipation in work team is constructive and\ncollaborative\nand\ndemonstrates\nan\nunderstanding of own role.\n\n2. Establish and\n maintain good\n interpersonal\n relationship with\n patients\n\n2.1 Rapport is established to ensure the service is\nappropriate to and in the best interests of\npatients.\n2.2 Effective listening skills are used to ensure a\nhigh level of effective communication and\nquality of service.\n2.3 Patient concerns and needs are correctly\nidentified and responded to responsibly and\naccordingly\nestablished\nprocedures\nand\nguidelines.\n2.4 Effectiveness of interpersonal interaction is\nconsistently monitored and evaluated to\nensure best patient service outcomes.\n\n--- PDF PAGE 43 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Act in a\n respectful\n manner at all\n times\n\n3.1 Respect for differences is positively, actively\nand consistently demonstrated in all work.\n3.2 Confidentiality and privacy of patient is\nmaintained.\n3.3 Courtesy is demonstrated in all interactions with\npatients, their visitors, carers and family.\n3.4 Assistance with the care of patients with\nchallenging behaviors is provided in accordance\nwith established procedures.\n3.5 Techniques are used to manage and miminize\naggression.\n\n4. Evaluate\nown\nwork to maintain\na high standard\nof patient service\n\n4.1 Advice and assistance is received or sought\nfrom\nappropriate\nsources\non\nown\nperformance.\n4.2 Own\nwork\nis\nadjusted,\nincorporating\nrecommendations that address performance\nissues, to maintain the agreed standard of\npatient support.\n\n--- PDF PAGE 44 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Patients\n\nThis may include but not limited to:\n1.1 Patients\n1.2 Prospective patients to the service or\nservices\n1.3 Patients may be in contact with the institution\nthrough appropriate health care personnel\nand professionals or other advocates or\nagencies\n\n2. Others with whom\ninteraction\nis\nrequired in regard\nto patient services\n\n2.1 Other staff and team members\n2.2 Service units or departments\n2.3 Family members, carers and friends of\npatients\n2.4 Professional representatives or agents of\npatient such as:\n-\nMedical specialist\n-\nNurses\n-\nSocial workers\n-\nDietitians\n-\nTherapists\n-\nAllied health professionals\n-\nVolunteers\n-\nTeachers and/or spiritual\n-\nCommunity\n2.5 General public\n\n3. Communication\n\n3.1 English / Tagalog / Vernacular\n3.2 Sign language\n3.3 Through an interpreter\n3.4 Community language as required by the\nservice / organization\n\n4. Modes\nof\ncommunication:\n\n4.1 Continuing interaction with patients and\nclients\n4.2 Verbal conversations either in person or via\ntelephone\n4.3 Written notes by post or electronic media\n4.4 Worker, family member friend or professional\ninterpreter who has relevant languages\n\n--- PDF PAGE 45 ---\nVARIABLE\n\nRANGE\n\n5. Respect\nfor\ndifference\n5.1 Physical\n5.2 Cognitive / mental or intellectual issues that\nmay impact on communication\n5.3 Cultural and ethnic\n5.4 Religious / spiritual\n5.5 Social\n5.6 Age\n5.7 Language literacy and numeracy abilities\n5.8 Sexuality and sexual preference\n\n6. Confidentiality\nand privacy of\npatients\n\n6.1 Fees\n6.2 Health fund entitlements\n6.3 Welfare entitlements\n6.4 Payment methods and records\n6.5 Public environments\n6.6 Legal and ethical requirements\n6.7 Writing details i.e. medical and consent forms\n6.8 Conversations on the telephone\n6.9 Secure location for written records\n6.10\nOffering a private location for discussions\n6.11\nInformation disclosed to an appropriate\nperson\nconsistent\nwith\none’s\nlevel\nof\nresponsibility\n\n7. Performance\nmonitoring\n\n7.1 Self-monitoring\n7.2 Supervisor assessment\n7.3 Patient feedback\n\n--- PDF PAGE 46 ---\n\n--- PDF PAGE 47 ---\nEVIDENCE GUIDE\n\n1. Critical\naspects\nof competency\n\nAssessment requires evidences that the candidate:\n1.1 Communicated appropriately with patients\n1.2 Handled complaints and resolved conflict, or\nreferred matters to supervisors when required\n1.3 Complied with relevant policies, protocols,\nguidelines and procedures of the organization\n1.4 Establish and maintained good interpersonal\nrelationship with patients\n1.5 Demonstrated courtesy in all interactions with\npatients, their visitors, and family\n\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1 Roles and responsibilities of self and other\nworkers within the organization\n2.2 When client / patient issues need to be\nreferred to an appropriate health professional\n2.3 Organizational policies and procedures for\nprivacy and confidentiality of information\nprovided by patients and others\n2.4 Knowledge of cultures relevant to the particular\nservice\n2.5 Institutional policy on patient rights and\nresponsibilities\n\n3. Underpinning\nskills\n\n3.1 Establishing and maintaining relationships,\ntaking into account individual differences\n3.2 Using effective listening techniques\n3.3 Using appropriate verbal and non verbal\ncommunication styles\n3.4 Interpreting and following the instructions and\nguidance of health professionals involved with\nthe care of patients / clients\n3.5 Oral and written communication\n3.6 Problem solving skills required include the\nability to use available resources and prioritize\nworkload\n3.7 Dealing with conflict\n3.8 Working with others and displaying empathy\nwith patient and relatives\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place.\n\n--- PDF PAGE 48 ---\n4.2 Relevant government and organizational policy\nguidelines, procedures and protocols\n4.3 Any relevant legislation in relation to service\ndelivery\n\n5. Method\nof\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Interview\n5.3 Third party report\n\n6. Context\nof\nassessment\n\n6.1 Assessment may be done in a simulated\nworkplace setting\n\n--- PDF PAGE 49 ---\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : WORK WITHIN THE COMMUNITY\n DEVELOPMENT FRAMEWORK\nUNIT CODE : HCS346301\nUNIT DESCRIPTOR : This unit reflects skills and knowledge required for\n working within a community development\n framework. A community development framework\n may include of a range of methods designed to\n strengthen and develop communities by enhancing\n individual and group capacity to confidently engage\n with community structures and to address problems\n and issues.\n\n Application of a community development\n framework may be undertaken within the scope of\n or in conjunction with a range of work roles / areas\n in the community services industry including\n specific areas of service delivery, community\n education activities and working with groups to\n address issues.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n1. Operate within a\n community\n development\n framework\n\n1.1 Work undertaken reflects a current\nworking knowledge and understanding of\ncommunity\ndevelopment\nvision\nand\nmission\n1.2 Work\nreflects\na\ncommitment\nto\nempowering / individuals to resolve their\nissues\nthrough\nenhancing\nskills,\naccessing\nappropriate\nsupport\nand\nworking with others in the community\nwho share concerns and issues\n1.3 Work is based on a demonstrated\nunderstanding of the interrelationships of\nthe needs and rights of the individual, the\nfamily, the community and society.\n\n--- PDF PAGE 50 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n1.4 Work\nreflects\na\ndemonstrated\nunderstanding of the impact of current\nand\nchanging\nsocial,\npolitical\nand\neconomic contexts\n1.5 Work undertaken in the industry reflects\nan application of:\n-\nAccepted\nstandards\nof\nethical\npractice\n-\nThe\nprinciples\nof\nsocial\njustice,\nhuman rights, anti discrimination and\nconfidentiality\n-\nRelevant occupational health and\nsafety\nand\nequal\nemployment\nopportunity principles and practices\n-\nPractices which protect confidentiality\n-\nThe impact of worker’s own value\nbase and values within a community\ndevelopment framework\n\n2. Work\nwith\nindividuals\nand\ngroups to achieve\ncommunity\ndevelopment\noutcomes\n\n2.1 Details of relevant individual and group\nissues are identified\n2.2 Relevant approaches to working with\nindividual and groups are assessed in\norder to ensure needs are met\n2.3 Relevant\ncommunity\nstructures\nare\nidentified\nand\nutilized\nto\nmaximize\noutcomes for individuals and groups\n2.4 Advice and information is provided to\ngroups and individuals as required to\nensure they are fully informed about\nrelevant issues and opportunities\n\n3. Address individual\n issues arising when\n working within a\n community\n development\n framework\n\n3.1 Appropriate interpersonal skills are employed\nto provide a first point of contact where\nindividual stories are heard and understood\n3.2 The capacity to address identified individual\nissues is assessed\n3.3 Appropriate referrals are provided both within\nand outside the organization to ensure\nindividual issues will be addressed\n\n--- PDF PAGE 51 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n3.4 Relevant facilitation skills are employed to\nassist individuals to identify the most\nappropriate course of action to ensure\ntheir issues are addressed\n3.5 All\nwork\nreflects\nknowledge\nand\nunderstanding of the impact of applying\ndifferent methods to address individual\nissues and meeting duty of care\n\n4. Work effectively with\n diversity in the\n community\n\n4.1 All work reflects the application of processes\nwhich aim to minimize the impact of own\npersonal biases and experiences\n4.2 All work reflects respect and understanding\nof individual differences\n4.3 All work reflects recognition of the positive\ncontribution of diversity in the community\n4.4 Work processes are adapted as appropriate\nto meet the specific cultural and linguistic\nneeds of individuals\n\n--- PDF PAGE 52 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1.\nWork in the industry\n\nIncludes:\n1.1 Voluntary\n1.2 Paid work\n2.\nEthical practices\n\n Includes:\n 2.1 Professional relationships\n 2.2 Financial management\n 2.3 Information collection, storage and\n Dissemination\n 2.4 Operation of community and other\n organizations\n3.\nWorking\nwith\nindividuals\nand\ngroups to achieve\ncommunity\ndevelopment\noutcomes\nmay\ninclude engagement\nwith\nvarious\nstructures\nand\npatterns\nof\nwork\nundertaken\nby\npractitioners\nand\ncommunity\nmembers\n\nIncludes:\n3.1 Community service delivery\n3.2 Community projects\n3.3 Community development\n3.4 Community action\n3.5 Community planning\n3.6 Consultative and planning committees\n3.7 Sector development structures\n4.\nAppropriate course\nof action\n\nIncludes:\n4.1 A public response / meeting\n4.2 Group action\n4.3 Conducting a specific project\n4.4 Development of a program\n4.5 Establishment\nof\norganizational\narrangements\n5.\nCommunity\ndevelopment\noutcomes\n\nMay include:\n5.1 Building capacity to solve problems in the\ncommunity and to strengthen community\nstructures\n5.2 Increased community self confidence in\npublic activity\n5.3\nIncreased\ncapacity\nof\ngroups\nand\nindividuals to engage with community\nstructures\n\n--- PDF PAGE 53 ---\nVARIABLE\n\nRANGE\n6.\nAreas of differences\nand\ndiversity\ninclude:\n\n6.1 Language\n6.2 Culture and cultural practices relating to:\n-\nReligion / spiritual observances\n-\nFamily relationships\n-\nStatus / protocol\n-\nCeremonies / celebrations\n-\nProhibition / taboos\n6.3 Social, economic, physical and health\nissues\n\n--- PDF PAGE 54 ---\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Demonstrated the applications of community\ndevelopment theories and practices to all\naspects of work\n1.2 Elicited a story from individuals, to test\ncommon\nunderstandings\nand\nfacilitated\nagreement on actions to be followed based\non information and assistance provided by\nthe worker\n1.3 Reviewed and modified own work practice\nwithin a community development framework\n\n2. Underpinning knowledge\nand attitudes\n\n2.1 The historical, social, legislative, statutory,\npolitical, economic and cultural context of\nwork in the industry\n2.2 Philosophy and accepted practices of work\n2.3 Own biases and personal history related to\nwork area\n2.4 Strategies\nfor\naddressing\nindividual\ndifferences\n2.5 Principles and practices of a community\ndevelopment work\n2.6 Work models\n2.7 Knowledge of relevant issues specific to\ncommunities\n3. Underpinning skills\n\n3.1 Communication and interpersonal skills\nrelevant to work area\n3.2 Using appropriate personal authority and\ninfluence to enhance work role\n3.3 Analyzing and assessing\n3.4 Relevant literacy standards and skills to\nmeet reporting requirements of work area\n3.5 Reflective listening\n3.6 Referral\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Access to a workplace or to an environment\nthat accurately simulates the workplace\n\n--- PDF PAGE 55 ---\n5. Method of assessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6. Context of assessment\n\n6.1Competency\nmay\nbe\nassessed\nin\nthe\nworkplace or in a simulated workplace and\nunder\nthe\nnormal\nrange\nof\nworkplace\nconditions.\n\n--- PDF PAGE 56 ---\nUNIT OF COMPETENCY : PREPARE FOR WORK IN THE COMMUNITY\nSERVICE INDUSTRY\nUNIT CODE : HCS346302\nUNIT DESCRIPTOR : This competency standard covers the skills and\n knowledge required to interpret legal and\n procedural requirements of the community services\n industry. It requires the ability to access industry\n information and applicable legislative guidelines. It\n also requires a knowledge of identifying and\n accessing future learning opportunities. These\n work functions would be carried out under\n supervision within organizational guidelines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Access industry\ninformation and\napplicable\nlegislative\nguidelines\n\n1.1 A range of legislation and procedural\nrequirements relevant to employment in\nthe community services industry is\naccessed.\n1.2 Key community services industry\norganizations able to provide information\nand assist individuals and enterprise are\nidentified.\n1.3 Various roles are identified and current\nknowledge reflects an understanding of\nemployee and employer rights and\nresponsibilities.\n1.4 Own conduct and/or demonstrate a\ncommitment to comply with applicable\nlegislative and procedural\nrequirements.\n\n2. Identify future career /\noccupations\nopportunities in the\ncommunity.\n\n2.1 Key industry sectors and possible career\ndirections in the services industry or\norganization are identified and discussed\nwith appropriate persons.\n2.2 Personal values and attitudes regarding\nwork and business are taken into account\nwhen planning future work / career\ndirections.\n\n--- PDF PAGE 57 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n2.3 Current skills and knowledge are\n assessed against a checklist of target\n competencies.\n2.4 Opportunities for additional skills are\n identified in consultation with appropriate\n persons.\n3. Work in a team at all\ntimes\n\n3.1 Courteous and helpful manner is\n displayed at all times.\n3.2 Allocated tasks are completed as required\n3.3 Assistance is sought when difficulties\narise\n3.4 Questioning is used to clarify instructions\nor responsibilities\n3.5 Non discriminatory attitude is identified\nand displayed\n3.6 Work\nand\npersonal\npriorities\nare\nidentified\nand\na\nbalance\nachieved\nbetween competing priorities\n3.7 Time management strategies are applied\nto work duties\n3.8 Appropriate dress and behaviour are\nobserved in the workplace.\n\n--- PDF PAGE 58 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Applicable legislation,\n codes, legislation and\n national standards of\n operation\n\nMay include but not limited to:\n1.1. Occupational Health and Safety\n1.2. Equal employment opportunity\n1.3. Industrial relations\n1.4. Anti-discrimination and diversity\n1.5. Relevant industry Code of Practice\n1.6. Award and enterprise agreements\n2.\nIndustry\nprocedures\nmay\ninvolve legislation\nrelating to:\n\nMay involve legislation relating to:\n2.1 Duty of care\n2.2 Emergency and evacuation procedures\n2.3 Privacy\n2.4 Workplace practices\n2.5 Human and civil rights\n3.\nRights and\n responsibilities of\n employees\n\nMay relate to:\n3.1 Obeying lawful orders\n3.2 Confidentiality and privacy rights\n3.3 Safety and care with respect to Occupational\nHealth and Safety requirements\n3.4 Knowing the terms and conditions of own\nemployment\\\n3.5 Protection from discrimination and sexual\nharassment\n4.\nAppropriate\npersons\n\nMay include:\n4.1 Supervisors\n4.2 Colleagues\n4.3 Trainer\n4.4 Assessor\n 5. Opportunities for\n additional\nskills\n\nMay include:\n5.1 Coaching, mentoring and/or supervision\n5.2 Formal/informal learning programs\n5.3 Internal/external training provision\n5.4 Work experience/exchange opportunities\n5.5 Personal study\n5.6 Career planning / development\n5.7 Workplace skills assessment\n5.8 Quality\nassurance\nassessments\nand\nrecommendation\n5.9 Recognition of Prior Learning assessment\n5.10. Recognition of Current Competency\n assessment\n\n--- PDF PAGE 59 ---\nVARIABLE\n\nRANGE\n\n6.\nNo\ndiscriminatory\nattitudes\n\nMay include:\n6.1\nAll contacts with other staff, clients or\nmanagement\n6.2\nVerbal or non verbal communication\n\n7.\nWork\nand\npersonal\npriorities related to work\n/ life balance and may\ninclude work and other\ncommitments\n\nMay include:\n7.1 School / homework\n7.2 Home / family / parties / friends\n7.3 Other jobs\n7.4 Culture\n7.5 Disability\n8.\nAppropriate dress and\nbehaviour relate to:\n\nRelate to:\n8.1 Personal dress, presentation and hygiene\n8.2 Demeanor in the workplace and attitude\ndisplayed to customers and other team\nmembers\n8.3 Organization requirements\n8.4 Type of work\n8.5 Degree of client / customer contact\n9.\nBehaviour which\n contributes to a safe\n work environment\n\n9.1\nDiscussion and negotiating problems and\ntasks with other team members\n9.2\nSharing knowledge and skills\n9.3\nIdentifying and reporting any risks or\nhazards\n9.4\nUsing business equipment according to\ninstructions\n\n--- PDF PAGE 60 ---\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Interpreted various roles in the organization\nparticularly on processes and procedures\n1.2 Accessed, interpreted and complied with a\nrange\nof\nlegislative\nand\nprocedural\nrequirements\n1.3Developed\neffective\nand\npersonal\nrelationships through the application of\norganizational social, ethical and operational\nstandards\nand\nuse\nof\nappropriate\ninterpersonal styles and techniques\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Legislation,\nregulations\nand\ncodes\nor\npractice applicable to specific community\nservices functions.\n2.2 Types\nof\ncommunity\nservices\nand\norganizations and functions\n2.3 Terms and conditions of employment\n2.4 Workplace communication channels and\nprocedures\n2.5 Principles of effective communication\n2.6 OHS issues and requirements\n2.7 Approaches to work in the industry and a\n range of activities which support this\n2.8 Holistic and client-centered care\n2.9 Client needs and rights including duty of care\n2.10 Principles of access and equity\n2.11 Current issues facing clients and the sector\n2.12 Basic knowledge responsibilities in relation\nto child protection\n2.13 Awareness of own biases and beliefs\n2.14 Limitations of work role and responsibilities\n3. Underpinning skills\n\n3.1 Communicating in a clear and concise\nmanner in both written and verbal modes\n3.2 Requesting advice or further information\n3.3 Seeking and receiving feedback\n3.4 Working on an individual basis and within a\nteam\n3.5 Using information technology appropriate to\nspecific talk\n3.6\nSourcing,\norganizing\nand\nrecording\ninformation\n3.7 Processing workplace documentation\n3.8 Estimating time to complete activities and\n\n--- PDF PAGE 61 ---\nprioritizing task\n3.9 Relating to people from a range of social,\ncultural and ethnic backgrounds and varying\nphysical and mental abilities\n3.10 Identifying work requirements and process\nbasic relevant workplace documentation\n3.11 Requesting advice, receiving feedback and\nworking with a team\n3.12 Solving routine problems related to the\nworkplace under direct supervision\n3.13 Relating to people from a range of social,\ncultural, ethnic backgrounds and physical and\nmental abilities\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Access to a suitable venue and equipment\n4.2 Assignment instructions, work plans and\nschedules,\npolicy\ndocuments\nand\nduly\nstatements\n4.3 Assessment instruments, including personal\nplanner and assessment record book\n4.4 Access to registered provider of assessment\nservices\n5. Method of assessment Competency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6. Context of\nassessment\n\n6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 62 ---\nUNIT OF COMPETENCY : SUPPORT COMMUNITY RESOURCES\nUNIT CODE : HCS346303\nUNIT DESCRIPTOR : This unit applies to the work performed in providing\n and maintaining support to community groups.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1.\nDevelop an\n information base of\n community\n resources\n\n1.1 Relevant\ninformation\nabout\nthe\ncommunity,\nits\norganizations\nand\nservices\nis\ncollected\nand\nstored\naccording\nto\nthe\norganizational\npractices so ongoing work is facilitated.\n1.2\nA\ncurrent\ndirectory\nof\ncommunity\nresources is maintained so it is useable\nand accessible.\n2.\nEstablish\nrelationship with key\npeople\n\n2.1 Appropriate contact is established and\nmaintained with key people using a\nrange of communication strategies to\nensure that the outcomes from work in\nthe community is maximized.\n2.2 The roles and responsibilities of key\npeople and services are defined so that\nwork is effective and coordinated.\n3.\nApply strategies for\nlinking people\n\n3.1 Appropriate work is undertaken to create\nopportunities\nto\ndevelop\nsupportive\nconnections\nbetween\nkey\npeople\nincluding\narranging\nand\nconducting\nmeetings.\n3.2 Obstacles to effective contact between\npeople are identified and appropriate\nstrategies are developed to overcome\nthese.\n3.3 Appropriate levels of ongoing support is\nprovided\nto\npromote\ncommunity\ninteraction.\n\n--- PDF PAGE 63 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n4.\nMaintain community\nfacilities\nand\nresources\n\n4.1 All relevant records are maintained and\nmake available as required to facilitate\ncommunity interaction.\n4.2 Appropriate\nwork\nis\nundertaken\nto\nensure that maintenance of community\nresources is carried out according to\nagreed\nprocedures\nand\nbudget\nallocations.\n4.3 Appropriate action is taken to ensure\npublic\nand\ncommunal\nareas\nare\naccessible and meet community needs.\n\n--- PDF PAGE 64 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Community\n\nMay include:\n1.1 Individuals and groups defined by\n organization programs and services\n1.2 Other agencies providing services to\n individuals and groups\n1.3 People with specified needs and interests\n1.4 People using the organization’s services /\n programs\n2. Relevant information\nabout the community\n\nMay include:\n2.1 Composition and social / cultural profile\n2.2 Cultural characteristics\n2.3 Scope defined by organization’s objectives\nand priorities\n2.4 Size\n2.5 Nature and history of issues and interests\n2.6 Range and nature of other services\n2.7 Existing practice, process and protocol\n2.8 Data base of key people\n2.9 Details of other services / agencies\n2.10 Networks, support systems, groups\n2.11 Resources\n2.12 Protocols for communication\n3. Key people\n\nMay include:\n3.1 People with an interest in the purpose of the\norganization\n3.2 Designated groups in the community\n3.3 Community leaders, representatives\n3.4 Other providers\n3.5 People using the services of the organization\n3.6 Specialist providers\n\n--- PDF PAGE 65 ---\nVARIABLE\n\nRANGE\n4. Communication\nstrategies\n\n4.1 Attending meetings, groups. Shift hand over.\n4.2 Phone contact\n4.3 Sharing information\n4.4 Information newsletter\n4.5 Premises,\ngrounds,\naccommodation,\nworkplace\n4.6 Purpose designed and provided for the\ncommunity or workplace\n4.7 Exclusive use, ownership or shared of\nequipment and materials\n4.8 Information\n4.9 Personnel\n4.10 Financial\n\n 5. Organization’s\nprocedures\n\nMay include:\n5.1 Formally documented policies, guidelines,\ndelegations, philosophy\n5.2 Direction through supervision\n5.3 Management decisions, directives\n5.4 Information,\ndata\ncollection,\nproforma,\nreporting requirements\n5.5 Formal and informal negotiated agreement\n\n--- PDF PAGE 66 ---\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Provided a range of types of support to\ncommunities\naccording\nto\norganizational\nprocedures\n1.2 Communicated with a range of people in the\ncommunity\n1.3 Maintained and accessed effective networks\nwhich contribute to the achievement of\nobjectives\n1.4 Motivated individuals and groups to work\ncooperatively to address common concerns\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Nature of the community and significant\nrelationships and resources including\ncultural program / service objectives\n2.2 Relevant agencies programs and criteria\n2.3 Communication strategies\n2.4 Principles of social organization and\nstructures\n2.5 Depending on the work role or services\nprovided specific knowledge of particular\ngroups or issues may be required,\nincluding:\n-\nAlcohol and other drugs\n-\nCultural and linguistic diversity\n-\nRisk of self harm\n-\nWomen\n-\nMen\n-\nCommunity education\n-\nMental health\n\n--- PDF PAGE 67 ---\n3. Underpinning skills\n\n3.1 Oral communication competence\n3.2 Asking questions, listening to\ninformation, and seeking clarification\n3.3 Reading competence required if worker\nis using pamphlets or written information,\nto determine if an organization or service\nis relevant to a particular group\n3.4 Writing skills will be needed if\norganizations require a written list of\ncommunity facilities and resources\n3.5 Documenting what is required by the\norganization\n3.6 Encoding skills\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Access to a workplace or community or an\nenvironment that effectively simulates\nworkplace or community conditions.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 68 ---\nUNIT OF COMPETENCY : PROVIDE PRIMARY / RESIDENTIAL CARE\nUNIT CODE : HCS346304\nUNIT DESCRIPTOR : This consists of knowledge, skills and attitude in\n providing for care and support of clients and assist\n their transition from primary / residential care.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Outline terms of\n placement\nwith\nclient in care\n\n1.1\nWhere appropriate, explanations are\neffectively communicated to clients\nabout what they can expect from the\nplacement; the philosophies, values\nand rules operating; opportunities\nwithin the placement , and strategies\nfor\nmaximizing\nbenefits\nof\nthe\nplacement.\n1.2\nThe boundaries of confidentiality are\nclarified with the client\n1.3\nProcesses\nfor\nresolving\nissues,\nreviewing placement and the external\nand internal grievance procedures are\ncommunicated\nin\nappropriate\nlanguage and approach\n1.4\nUnderstanding of client rights and\nexpectations about direct care is\nexplored and clarified\n1.5\nRules\nand\nconsequences\nfor\nbehaviour\nare\nexplained,\nand\nnegotiated where appropriate with\nclient in ways that are understandable\nand culturally appropriate\n1.6\nAll\nrelevant\ndocumentation\nis\ncompleted\nand\nmaintained\nin\naccordance\nwith\norganizational\nprocedures.\n\n2. Provide\n/\nmobilize\ndomestic support\n\n2.1\nWays of addressing daily needs are\nprovided for and negotiated with client\n2.2\nAll\nappropriate\nprocedures\nare\nimplemented\nto\nensure\nthe\nenvironment is clean, healthy and\nsafe\n\n--- PDF PAGE 69 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n2.3\nAppropriate strategies are negotiated\nfor the continued use, maintenance\nand/or\ndisposal\nof\npersonal\npossessions of the client\n\n3. Provide\nfor\nclient\neducation,\nsupport\nand development\n\n3.1\nA range of approaches to life skills\ntraining,\nincluding\nprovision\nof\npositive role models is implemented\nto ensure client’s specific needs are\naddressed.\n3.2\nAssistance is provided to the client to\nidentify and implement appropriate\ngoals, strategies and activities so their\nmoves\nto\nautonomy\nand\nself\nempowerment is enhanced.\n3.3\nAppropriate arrangement are made to\nsupport client in care to undertaken\nrelevant vocational training and/or\nemployment.\n3.4\nAppropriate processes for provision of\nhealth care education are negotiated\nwith\nrelevant\nreferral\nagency/\norganization/ department to ensure\ntheir delivery.\n3.5\nAppropriate processes are negotiated\nwith client and relevant personnel to\nensure client access to a range of\nemotional, social and physical support\nmechanisms\n3.6\nAppropriate relationship is established\nwith client to ensure maximum access\nto development opportunities and\nparticipation in a range of services.\n\n--- PDF PAGE 70 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n4. Contribute to\n reintegration of client\n\n4.1\nPlanning for resources, services and\nongoing support are negotiated with\nthe client and significant others to\nensure\nresettlement\nneeds\nare\nassessed and addressed.\n4.2\nArrangements\nfor\nparticipation\nin\nemployment, counseling, education\nand accommodation are made with\nrelevant parties are appropriate\n4.3\nAll\nrelevant\navailable\nactivities,\ndesigned\nto\nassist\na\nsuccessful\ntransition from care, are undertaken\n4.4\nNegotiations are undertaken with all\nrelevant parties to identify appropriate\nlevels of contact with client, once out\nof care\n\n--- PDF PAGE 71 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1.\nOutline\nterms\nof\nplacement\nwith\nclient in care\n\nMay include:\n1.1 On the selection and implementation of\nan intervention either on a voluntary or\ninvoluntary basis\n1.2 A voluntary seeking for support outside\nof statutory mandates\n1.3 A preventative pro-active activity\n1.4 Government,\nnon-government\nand\ncommunity based range of services\n\n2.\nProvision of positive\nrole models\n\nUndertaken within requirements established by:\n2.1 State and national legislation\n2.2 Organization processes, procedures and\nstandards\n2.3 Organizational codes of conduct and\nethical position\n2.4 International conventions on the rights of\nchildren and young people\n\n--- PDF PAGE 72 ---\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1\nNegotiated\neffective\ncare\narrangements,\nrights\nand\nresponsibilities\n1.2\nProvided a range of care services\n1.3\nProvided\nopportunities\nfor\npositive\nexperiences, client self development\nand self esteem building\n1.4\nDemonstrated knowledge related to\napplicable organization and legislative\nrequirements\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nRelevant\nstatutory\nprocedures,\nresponsibilities and rights\n2.2\nService protocols, philosophies and\nprocesses\n2.3\nResources and programs available\n2.4\nStage of grief\n2.5\nImpact and signs of abuse\n2.6\nCultural protocols, systems, taboos\n2.7\nParenting models\n2.8\nBudgeting practices\n2.9\nProtocols in working with professional\nservice providers\n2.10 Child development stages / models\n3. Underpinning skills\n\n3.1\nEffective communication\n3.2\nBehaviour management\n3.3\nStress management\n3.4\nInterpersonal, including:\n-\nAssertion\n-\nNegotiation\n- Establishing role boundaries\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1\nAccess to an appropriate workplace or\nan environment capable of accurately\nsimulating\nthe\nworkplace\nfor\nassessment purposes.\n\n--- PDF PAGE 73 ---\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n\n5. Context of\nassessment\n\n6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 74 ---\nUNIT OF COMPETENCY : SUPPORT COMMUNITY PARTICIPATION\nUNIT CODE : HCS346305\nUNIT DESCRIPTOR : This unit of competency covers the knowledge,\n skills and attitude required in providing a range of\n opportunities for community groups and individuals\n to participate and design cooperative\n arrangements for addressing common concerns.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Work with individuals\nand the community to\npromote participation\n\n1.1\nWork is undertaken to identify key\ncommunity issues to be addressed\n1.2\nTo\naddress\ncommunity\nissues\nplanning is undertaken to ensure:\n-\nAppropriate policies and strategies\nare developed\n-\nAdequate resourcing is identified\n-\nKey people are consulted\n-\nIdentified needs are addressed\n1.3\nProcesses are forward looking and\nproactive\n1.4\nAppropriate\ninterpersonal\nand\nnetworking skills are used to enlist\nsupport from key people and groups\n1.5\nOpportunities\nare\nprovided\nfor\ncommunity input to planning provision\nof services\n1.6\nCommunity input and participation in\nservices is guaranteed\n\n2. Support existing\n community activities\n\n2.1\nAppropriate review of the relevance of\nexisting\ncommunity\nactivities\nis\nundertaken,\nbased\non\nchanging\ncommunity needs\n2.2\nRelevant support and assistance is\nprovided\nto\nexisting\ncommunity\nactivities\nto\nobtain\nadditional\nresources\nrequired\nfor\neffective\noperation\n\n--- PDF PAGE 75 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n2.3\nSupport is provided to community\n groups to monitor and evaluate\n processes, progress and outcomes of\n activities.\n2.4\nAppropriate support is provided to\ncommunity groups to become self\nmanaging in the implementation of\nplans.\n\n--- PDF PAGE 76 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Working with the\n community\n\nMay include activities associated with:\n1.1 Health promotion\n1.2 Community service delivery\n1.3 Community projects\n1.4 Community development\n1.5 Community action\n1.6 Community planning\n1.7 Consultative and planning committees\n1.8 Sector development structures\n\n2. Opportunities for\n consumers,\n community members\n and groups to\n participate\n\nMay include:\n 2.1 Systems within and outside the\n organization\n2.2 Activities at program, operative and\n management levels\n2.3 Formal and informal systems\n2.4 Focus groups on relevant issues\n2.5 Inviting community participation on\n organizational committees e.g. quality\n assurance committees, ethics\n committees\n2.6 Through publications\n2.7 Group facilitation\n2.8 Peer education / training\n2.9 Seminars and workshops\n\n3. Key people\nMay include:\n 3.1 Advocacy groups\n 3.2 Policy and decision makers in the\n specific to community\n3.3 Individuals, groups or communities most\nlikely to be affected by strategies or\naction plans\n3.4 Community leaders\n3.5 People\nwith\nformal\nand\ninformal\nrepresentative roles\n\n--- PDF PAGE 77 ---\nVARIABLE\n\nRANGE\n\n4.Strategies\nwhich\nthe\nworker may develop\n\nMay include:\n4.1 Development of new business, employment\nopportunities for individuals\n4.2 Establishment of advocacy groups\n4.3 Health promotion activities\n4.4 Development of community facilities\n4.5 Strategies to increase access to facilities,\nservices or decision making\n4.6 Providing direction, advice and information\n\n5. Information and\n resources\n\nMay include:\n5.1 Equipment\n5.2 Staff skills and time\n5.3 Provision of facilities\n5.4 Educational materials\n5.5 Funding\n5.6 Skills / administrative support\n5.7 Physical,\ntransport,\nvenues,\nmaterials,\nequipment\n5.8 Developmental training\n5.9 Financial\n\n--- PDF PAGE 78 ---\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Demonstrated the capacity to undertake a\nrange of activities to ensure appropriate\nparticipation by groups and individuals in\ncommunity based activities.\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1\nCommunity development methods and\ntheir principles and practices\n2.2\nFunding sources and their policies and\nstrategies for encouraging community\ninput and participation\n2.3\nBudget and funding allocation\n2.4\nLocal, state strategies / legislation\n2.5\nHealth promotion\n3. Underpinning skills\n\n3.1\nPolicy development\n3.2\nReport writing\n3.3\nEvaluating effectiveness of community\nbased activities\n3.4\nBudgeting\n3.5\nNegotiating, liaisoning, networking\n3.6\nMarketing\n3.7\nFacilitating\n3.8 Researching relating to the community\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Demonstration of competency will include\nthe ability to work with key people or\nstakeholders\nin\nthe\ncommunity.\nAssessors are allowed for access to\nappropriate\nstructures,\npeople\nor\norganizations for assessment purposes.\n5. Method\nof\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n5.4\nPortfolio\n6. Context of\n assessment\n\n6.1\nCompetency may be assessed in the\nworkplace or in a simulated workplace\nsetting.\n\n--- PDF PAGE 79 ---\nUNIT OF COMPETENCY : RECRUIT AND COORDINATE VOLUNTEERS\nUNIT CODE : HCS346306\nUNIT DESCRIPTOR : This unit deals with developing and supporting \\\n volunteer workers in an agency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Identify the need and\n roles for volunteers in\n the organization\n\n1.1 Potential\nroles\nfor\nvolunteers\nare\nidentified.\n1.2 Roles are discussed and agreed upon by\nmanagement.\n1.3 Role descriptions as developed.\n1.4 Processes for support of volunteers are\nidentified.\n\n2. Recruit volunteers\n\n2.1 Volunteers are sought through advertising\nin\nrelevant\nmedia\nand\ncommunity\nnetworks.\n2.2 Interviews with potential volunteers are\narranged and completed.\n2.3 Selections are made and management\nadvised.\n2.4 Successful volunteers are advised of their\nselection.\n2.5 When\nnecessary,\na\nwaiting\nlist\nof\nappropriate applicants is maintained.\n2.6 An on-going recruitment program is\nimplemented as required.\n\n 3. Orient volunteers to |\n organization.\n\n3.1 Volunteers are provided with an orientation\nto the organization.\n3.2 Training for specific role is provided in a\nmanner appropriate to the needs and\nresources of the organization.\n\n4. Monitor performance\n of volunteers\n\n4.1\nRegular meetings of volunteers are\nestablished.\n4.2\nA review of roles and performance is\nregularly undertaken.\n4.3\nIndividual support and debriefing is\nprovided when necessary.\n\n--- PDF PAGE 80 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Volunteers\n\nMay include:\n1.1 Unpaid\nworkers\nwho\nare\nin\npaid\nemployment elsewhere\n1.2 Unpaid workers who are not in paid\nemployment\n\n2. Roles of volunteers\n\nMay include:\n2.1 Agency management\n2.2 Direct\nservice\nincluding\nreception,\ntelephone advice lines, service user\nsupport\n\n--- PDF PAGE 81 ---\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1\nVolunteer recruitment and coordination\nmeets\nboth\nthe\nneeds\nof\nthe\norganization and support requirements\nfor volunteer roles\n\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1\nThe impact of cultural community\nattitudes\non\nappropriate\nroles,\nrelationships and approaches of the\nvolunteer worker\n2.2\nThe implications of differences in\nattitudes and values in working in the\nagency\n2.3\nRelevant legislation and public policies\nrelating to the employment of unpaid\nworkers\n\n3. Underpinning skills\n\n3.1\nCoordination of people, processes and\ninformation\n3.2\nProvision of support to a diverse range\nof people\n3.3\nConflict resolution / negotiation and\nmediation\n3.4\nCross cultural communication and\nnegotiation\n3.5\nVerbal and written communication\n\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1\nAccess to appropriate workplace or\ncommunity where assessment can\ntake place; or\n4.2\nSimulation of realistic workplace or\ncommunity setting for assessment\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n5.4 Portfolio\n6. Context of\nassessment\n\n6.1\nCompetency may be assessed in the\nworkplace or in a simulated work\nsetting.\n\n--- PDF PAGE 82 ---\nUNIT OF COMPETENCY : RESPOND HOLISTICALLY TO CLIENT ISSUES\nUNIT CODE : HCS346307\nUNIT DESCRIPTOR : This focus of the work is assisting clients to address\ntheir own issues. On completion of this unit, the\nworker will be able to respond appropriately to clients\nthat have complex issues outside and in addition to\nthe area of immediate focus, expertise or interests of\nthe worker and their organization. For instance, the\nworker might work for an agency, and possess\nrelevant competence, in the area of child protection,\nbut will still be able to identify when say alcohol and\nother drug issues are important in the life of a\npresenting client. Completion of the unit will also\nprovide the worker with competencies to make\ndecisions as to whether to refer or retain the client.\n\nThe worker will first be able to make a decision as to\nwhether a brief intervention is appropriate (instead of\nan immediate referral). The worker will be able to\nimplement and monitor brief intervention strategies in\na variety of community service contexts, with the\nprimary aim of helping the client accept the\nintervention.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1.\nEvaluate the range\nof issues impacting\non the client and\non the delivery of\nappropriate service\n\n1.1 Identify indicators of harm, neglect,\nabuse or risk of harm.\n1.2 Use observations, assessment tools and\nquestioning\nto\nidentify\npossible\npresenting issues.\n\n--- PDF PAGE 83 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n1.3 Seek information from a range of\nappropriate sources to determine the\nrange of issues that may be affecting the\nclient within organizations policies and\nprocedures regarding autonomy, privacy\nand confidentiality.\n1.4 Apply organizational procedures for\ncollecting\nand\nanalyzing\nclient\ninformation.\n1.5 Examine\nall\nclient\ninformation\nto\ndetermine the degree to which other\nissues may impact on the possible\nservices that can be provided by the\norganization.\n\n2.\nDetermine\nthe\ncourse of action to\nbe followed\n\n2.1 Assess the level of risk to the client and\nothers directly involved including family\nmembers\n2.2 Follow organizational procedures, legal\nrequirements and duty of care obligation\nto responding to indicators of risk of\nabuse, neglect or harm\n2.3 Check the services the organization\ndelivers against the range of client needs\nto be addressed\n2.4 Refer\nclient\nappropriately\nfollowing\norganizational protocols, policies and\nprocedures\n2.5 Apply accepted procedures to evaluate\nthe benefit to the client of referral to\nanother service.\n2.6 Evaluate the benefits of providing a brief\nintervention in facilitating the client to\naccess other services\n2.7 Apply accepted procedures to evaluate\nthe option of bringing in specialist support\nand continuing to work with the client.\n\n--- PDF PAGE 84 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n2.8 Provide the client with resources, such as\nwritten\nand\nverbal\ninformation,\nappropriate to their stage of change and\nactions to be followed.\n\n3.\nEstablish\ninterpersonal\nrelationship with the\nclient that will enable\nall\nissues\nto\nbe\naddressed\n\n3.1 Facilitative communication skills are\nutilized to assist the client to identify\nareas of concern, to prioritize areas for\nimmediate and longer term action to\ndetermine\noptions\nfor\naction\nand\nworkable strategies to address their\npriority areas.\n3.2 Define\nboundaries\nand\nuse\ncommunication skills that will establish a\ntrusting and respectful relationship.\n3.3 Assist client to develop their own action\nplans to address their circumstances.\n3.4 Relevant information is shared will the\nclient about services available, options,\nand health and well being issues to assist\nthem in determining a course of action.\n3.5 Work with the client to set personal goals\nand explore personal strategies, to\nidentify a hierarchy of strategies including\ncontingency plans.\n3.6 Work with the client to identify and plan\nfor potential consequences\nof\ntheir\ndecision.\n3.7 Implement procedures to ensure all\nservices and responses to client comply\nwith duty of care and accepted standards\nof ethical behaviour.\n\n4.\nProvide a brief\n intervention as\n required\n\n4.1 Assess a client’s need for intervention\nand the type of brief intervention\nrequired.\n4.2 Use brief intervention strategies which\nmatch the client’s stage of change.\n4.3 Implement appropriate procedures to\nprevent escalation of any potential\nemergency or crisis situation.\n\n--- PDF PAGE 85 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n4.4 Respond\nappropriately\nto\nemergencies\nand crisis\nsituations\naccording to organization procedures and\nin\naccordance\nwith\nduty\nof\ncare\nresponsibilities.\n4.5 Comply with cultural obligations which\ninfluence the use of brief intervention with\nparticular clients.\n4.6 Employ strategies to motivate, support\nand encourage the client.\n4.7 Current needs and sources of assistance\nare identified, and support given as\nappropriate.\n\n5.\nRespond\nappropriately\nto\npeople\nwho\nare\nvulnerable\nand\nat\nsignificant risk\n\n5.1 Apply a range of information collection\nmechanisms and assessment tools to\nestablish the degree of risk, neglect or\nharm.\n5.2 Assess the priority need for intervention.\n5.3 Implement appropriate procedures to\nprevent escalation of any potential\nemergency or crisis situation.\n5.4 Respond appropriately to emergencies\nand\ncrisis\nsituations\naccording\nto\norganization\nprocedures\nand\nin\naccordance with duty of care.\n5.5 Follow\norganizations\npolicies\nand\nprocedures and duty of care obligation in\nresponding to indicators of actual or\npotential risk of abuse, neglect or harm.\n\n--- PDF PAGE 86 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n6.\nEvaluate\neffectiveness\nof\nservices provided to\nmeet client needs\n\n6.1 Client’s\nprogress\nor\noutcomes\nare\nreviewed regularly in accordance with\norganizational\nprocedures\nand\nin\nconsultation with clients.\n6.2 Ensure client’s file notes are complete,\nup to date and include the client’ s stage\nof decision making on each occasion.\n6.3 Implement reflective practice strategies to\nensure\nfeedback\nis\nsought\nand\nincorporated in services delivery.\n\n--- PDF PAGE 87 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1.\nPresenting problem\nor issued\n\nA client with secondary or multiple issues is most\nlikely to present ‘first’ to the following types of\nservices (for an issue relevant to those services)\n1.1 Child protection\n1.2 Juvenile justice / youth services\n1.3 Social housing\n1.4 Employment service\n\n2.\nIndicators of harm,\nneglect, abuse or\nrisk of harm\n\n2.1 Physical symptoms such as injuries or\nloss of weight\n2.2 Verbal and non-verbal cues\n2.3 Impairment\nto\ncognitive\nfunctioning\ncaused by acquired brain injury such as\nloss of memory, inability to concentrate,\nplan, organize\n2.4 Reports from the individual, carers or\nother workers\n\n3.\nHarm,\nneglect,\nabuse\nor risk\nof\nharms\n\nIncludes:\n3.1 Physical\n3.2 Emotional\n3.3 Cognitive\n3.4 Psychological\n3.5 Sexual\n3.6 Financial\n\n4.\nAppropriate sources\nof information would\ninclude:\n\nInclude:\n4.1 Case notes\n4.2 File\n4.3 Other workers\n5.\nHarm,\nneglect,\nabuse\nor risk\nof\nharm\n\nMay be from:\n5.1 Carers\n5.2 Workers / service providers\n5.3 Self\n5.4 Family or significant others\n5.5 Community members\n\n--- PDF PAGE 88 ---\nVARIABLE\n\nRANGE\n\n6.\nResponses\nto\nindicators of risk of\nabuse, neglect or\nharm\n\nInclude:\n6.1 Intervention to remove the risk\n6.2 Reporting to appropriate personnel\n6.3 Investigating\n6.4 Seeking specialist support / services\n6.5 Referral\n\n7.\nResponses\nto\nindicators of risk of\nabuse, neglect or\nharm\n\nDetermined by:\n7.1 Legislation\n7.2 The specific job role\n7.3 Organizational procedures\n7.4 Family and cultural mores\n8.\nPeople\nwho\nare\nvulnerable and at\nsignificant risk\n\nMay be\n8.1 People with a disability\n8.2 People with an acquired brain injury\n8.3 Elderly people\n8.4 People with mental health issues\n8.5 Children and young people\n8.6 People who are homeless\n8.7 People in unequal power relationships\n\n9.\nAppropriate\nprocedures to\n prevent escalation\n of a potential\n emergency or crisis\n situation\nInclude:\n9.1 Calming skills\n9.2 Management\nand\ncontain\nemotional\nresponses and escalating behaviour\n9.3 Identify and address source of the issue\n9.4 Seek assistance from other workers,\ncarers, family or services\n\n10. Non\npresenting\nproblems or issues\n\nLikely to be:\n10.1 Alcohol and other drugs\n10.2 Mental illness\n10.3 Developmental disability\n10.4 Acquired Brain Injury\n10.5 Abuse and risk of abuse\n10.6 Domestic violence\n10.7 Homelessness / inadequate housing\n10.8 Unemployment\n10.9 Juvenile justice issues\n10.10\nCommunicable diseases\n10.11\nFinancial difficulties\n10.12\nNew arrival in the country\n\n--- PDF PAGE 89 ---\nVARIABLE\n\nRANGE\n\n11. Approaches\nto\naddressing specific\nissues\ninclude\napplying\naccepted\nmethodologies\nunderpinning values\nand philosophies of\nthe\nspecific\narea.\nThe following notes\noffer a guide:\n\n11.1 AOD may include knowledge of harm\nminimization practices, of the effects of\nAOD\non\nbody\nsystem\nand\nsocial\nrelationships, and of the signs and\nsymptoms of intoxication. Knowledge of\ngroups and agencies in the community\nwho can respond to individuals with AOD\nproblems by providing treatment and\ndetoxification programs is central. Also\nimportant is an awareness of personal\nbias, and models or perspectives on drug\nuse i.e. disease perspective, moral\nperspective of both the client and of\nreferral agencies.\n11.2 Mental health may include recognizing\nbasic signs and symptoms of anxiety,\ndepression,\nsuicidal\nimpulses,\nand\nindicators of mental illness such as\nhallucinations or delusion. Knowledge of\nappropriate\nreferral\nand\nintervention\nservices in the community is critical.\n11.3 Domestic violence may include an\nunderstanding of such violence as an\nabuse of power perpetrated both in a\nrelationship and after separation and that\nsuch violence takes a number of forms.\nThese\ninclude\nphysical\nand\nsexual\nviolence, emotional and psychological\nabuse\nand\neconomic\ndeprivation.\nDomestic violence occurs across all\ngroups, cultures and creeds. The safety\nand well-being of individuals subjected to\ndomestic violence should be of primary\nconcern. Knowledge of groups and\nagencies in the community who can\nrespond to individuals with domestic\nviolence issues is required.\n\n--- PDF PAGE 90 ---\nVARIABLE\n\nRANGE\n\n11.4 Child Protection will include knowledge\nof relevant state mandatory reporting\nlegislation and its application, of child\ndevelopment and behavioural / physical\nindicators of abuse, and of services in the\ncommunity\nthat\nrespond\nto\nchild\nprotection issues, it is vital to recognize\nthat children in families experiencing\ndifficulties, particularly where abuse of\nalcohol or other drugs occurs, are more\nlikely to be at risk of abuse. Working of\nfamilies and care givers to ensure the\nsafety of children is a priority.\n11.5 Development disability may describe\nindividuals who have a multiplicity of\ndisabilities including difficulty learning,\nthinking\na\nreasoning,\nretaining\ninformation\nand\nforming\nsocial\nrelationships. It is vital to recognize the\nindividuality of developmental disabled\npersons, there rights to age appropriate\nconsultation and to self determination.\nNeeds arising from social isolation and\nthe critical importance of primary care-\ngivers in the lives of developmental\ndisabled\npersons\nshould\nalso\nbe\nrecognized. Knowledge of groups and\nagencies in the community that can\nprovide advocacy services is required.\n\n--- PDF PAGE 91 ---\nVARIABLE\n\nRANGE\n\n11.6 Juvenile justice may include knowledge\nof adolescent clients and their special\nneed as individuals, within families and\nas part of a group, including stages of\ndevelopment and social issues affecting\nyouth. Recognition of the vulnerability of\nyoung people in their dealings with\nauthority and of the protection that should\noperate\nduring\nan\ninvestigation\nor\nproceeding in relation to an offense is\nrequired. Knowledge of groups and\nagencies in the community that can\nprovide services such as advocacy and\nlegal advice to young people in their\ndealings with the justice system is\nessential.\n11.7 Acquired Brain Injury may include\nawareness of the causes and effects of\nABI; understanding of the impact of\ncognitive impairment on the individual\nand families, including associated grief\nand loss issued; knowledge of the ABI\nservice system; skills in working with\npeople with challenging behaviours.\n\n12. Organizational\nprocedures\nfor\ncollecting\nand\nanalyzing\nclient\ninformation\n\nMay include written and oral input to:\n12.1 Questionnaires\n12.2 Assessment\n12.3 Client profile forms, etc.\n\n--- PDF PAGE 92 ---\nVARIABLE\n\nRANGE\n\n13. Procedures\nto\nprevent escalation of\na\npotential\nemergency or crisis\nsituation\n\nMay include:\n13.1 Using calming communication skills\n13.2 Managing and containing emotional\n responses and escalating behaviour\n13.3 Discussing the situation with the client\n13.4 Negotiation and mediation\n13.5 Seeking assistance from other workers\n or client carers\n13.6 Providing physical and visual barriers\n13.7 Evaluating the potential risk of the\n emergency\n13.8 Implementing specific communication\nskills including questioning, reflective\nlistening and body language\n\n14. Appropriate\nresponse\nto\nemergencies\nand\ncrisis situations\n\nMay include:\n14.1 Negotiating to prevent escalation\n14.2 Seeking assistance from other people or\nagencies\n14.3 Immediate referral\n14.4 Intervention to ensure physical safety\n15. Other information\n\nMay include:\n15.1 The client’s carers and or family\n15.2 Other\nagencies\nor\nworkers\nwith\nknowledge of the client\n15.3 Client files\n\n16. Specialist support\n\nMay include:\n16.1 Health professionals\n16.2 Careers and employment advice\n16.3 Financial counseling\n16.4 Family and relationship counseling\n16.5 Child Protection officers\n16.6 Mental health professional\n16.7 AOD detox, withdrawal and support\n16.8 Child care\n16.9 Centerlink officers\n\n--- PDF PAGE 93 ---\nVARIABLE\nRANGE\n\n17. All client information\n\nIncludes:\n17.1 Behaviour\n17.2 Responses to questions and other\ninformation provided by client\n17.3 Physical appearance and acuity\n17.4 File information\n17.5 Information on the client provided by\nfamily, carers, other workers, other\nagencies\n\n18. Accepted\nprocedures\nto\nevaluate the benefit\nto\nthe\nclient\nof\nreferral\n\nIncludes:\n18.1 Discussing options with the client, carers\nand family\n18.2 Checking the availability of services\nwithin the organization\n18.3 Checking\nthe\navailability\nand\naccessibility of other services\n\n19. Brief intervention will\nbe\nfocused\non\nproviding\nde-\nescalation\nand\nemotional support\n\n19.1 One-to-one approach, private\n19.2 Takes short period of time\n19.3 Can be done by anyone in the team\n19.4 A client led process\n19.5 Opportunistic\n19.6 Used for harm reduction and facilitating\nbehaviour change\n19.7 Carer respite (eg for client with ABI)\n\n20. Organizational\npolices\nand\nprocedures\n\nMay include:\n20.1 Incident reporting and documentation\n20.2 Operational\nguidelines\nfor\nhandling\ncases involving difficult and challenging\nbehaviour\n20.3 Record keeping\n20.4 Legal responses\n\n21. Decisions to provide\na brief intervention\n\nWill be based on:\n21.1 The issues of concern to the client and\nthe stage of decision to change is\ndetermined\n21.2 Availability of resources to support the\nbrief intervention\n21.3 Agency and worker mandate and focus\n\n--- PDF PAGE 94 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Identified the range of relevant issues\nthat may impact on service delivery\n1.2 Developed and implemented a plan in\nconjunction with the client to address\ntheir issues\n1.3 Provided referral to appropriate services\n1.4 Evaluated effectiveness of services\n1.5 Operated within duty of care and\norganizational requirements to address\nclient needs\n\n2.\nUnderpinning\nknowledge\nand\nattitudes\n\nIdentification of the impact of issues relating\nto:\n2.1 Mental Health\n2.2 Child Protection\n2.3 Domestic Violence\n2.4 Disability\n2.5 Homelessness\n2.6 Unemployment\n2.7 AOD\nKnowledge\nof\naccepted\npractices\nand\navailable referral agencies for working with\npeople experiencing issues related to:\n2.8 Mental Health\n2.9 Child Protection\n2.10 Domestic Violence\n2.11 Disability\n2.12 Homelessness\n2.13 AOD\n2.14 Or in any form of crisis\n\n--- PDF PAGE 95 ---\n3.\nUnderpinning skills\n\n3.1 Interpersonal skills to facilitate client to\nidentify options for change and for\naddressing their issues.\n3.2 Case work skills to ensure effective\nassessment, intervention and referral.\n3.3 Client management skills to deal with\ncomplex\nneeds\nand\ndifficult\nor\nchallenging behaviour.\n3.4 Information management to ensure all\nrecords are maintained, stored and\naccessible.\n3.5 Research skills to ensure a current and\ncorrect list of relevant services are\nreadily available to the client.\n3.6 Provision of a brief intervention to raise\nawareness, share knowledge and help\nclient to think about making changes to\nimprove well-being.\n3.7 Crisis intervention skills.\n4.\nResource\nimplications\nThe following resources MUST be provided:\n 4.1 Access to an appropriate workplace or an\nenvironment\ncapable\nof\naccurately\nstimulating the workplace of assessment\npurposes.\n5.\nMethod\nof\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6.\nContext\nof\nassessment\n 6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 96 ---\nUNIT OF COMPETENCY : DEVELOP AND PROVIDE HEALTH EDUCATION\n PROGRAM IN THE COMMUNITY\nUNIT CODE : HCS346308\nUNIT DESCRIPTOR : Working with the community to develop and provide\n education projects in relevant issues.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1.\nDevelop the\n health program\n education.\n\n1.1 Project plan is developed in consultation\nwith key people and organizations and\nidentifies priorities and desired outcomes\nto address issues of concerns of target\ngroup/s.\n1.2 Appropriate\nhuman,\nfinancial\nand\nphysical resources are identified and\nsecured\n1.3 Marketing materials are prepared and\ndisseminated to target audience and\nothers as appropriate.\n\n2.\nOrganize\nparticipants to the\n program.\n\n2.1 Strategies for delivery of the project are\ndeveloped and implemented to ensure\nmaximum effectiveness.\n2.2 Education\n/\nresource\nmaterials\nappropriate to the context, issue and\naudience are developed and distributed.\n2.3 Strategies\nare\nimplemented\nto\nencourage full participation in the project\nand the expression of views and feelings\nabout its process or content.\n2.4 Project\nadjustments\nare\nmade\nas\nrequired to meet the needs of specific\ngroup.\n2.5 Feedback on the education project or\nactivity is sought from participants.\n\n--- PDF PAGE 97 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n3.\nCoordinate\nhealth\nteaching program.\n\n3.1 The education project is assessed\nagainst the planned goals and objectives\nin\naccordance\nwith\norganizational\npolicies and procedures.\n3.2 Outcomes of project evaluations are\ndiscussed\nwith\nkey\npeople\nand\norganizations\nto\ndetermine\nfuture\ndirections.\n3.3 Education\nproject\noutcomes\nare\ndocumented,\nand\nwhere\nnecessary\nacted\non\nin\naccordance\nwith\norganizational procedures.\n\n--- PDF PAGE 98 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1.\nEducation projects\n\nMay include:\n1.1 Projects of varying scope and scale\nranging from state wide initiatives, to\nspecific activities\n-\nA\nsingle\nevent,\nsuch\nas\nan\ninformation stall in a shopping centre\n-\nA multi session education and skill\n-\nA complex, large scale series of\nactivities that incorporates diverse but\ncoordinated elements, such as a\nstatewide\neducation\ncampaign\ninvolving mass media information.\n\n2.\nKey people and\n organizations\n\nMay include:\n 2.1 Target group\n 2.2 Other relevant organizations\n 2.3 Funding bodies\n 2.4 Community support groups\n 2.5 The media\n\n3.\nResources\n\nMay include:\n3.1 Equipment\n3.2 Staff skills\n3.3 Time\n3.4 Space\n3.5 Venue\n3.6 Educational materials\n3.7 Funding\n\n4.\nMarketing materials\n\n4.1 Culturally appropriate\n\n5.\nAssessment and\n evaluation of the\n education project\n may include:\n\nMay include:\n 5.1 Use of feedback\n 5.2 Discussions with stakeholders,\n organizations and other participants\n 5.3 Discussion with colleagues\n\n--- PDF PAGE 99 ---\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Matched\neducation\nactivities\nwith\ncommunity needs and priorities\n1.2 Collaborated and consulted with key\n people and organizations\n1.3 Delivered\nhigh\nquality\ninnovative\neducational projects\n\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1 Needs assessment and analysis\n2.2 Goals and objectives for project selected\n2.3 Resource\navailability\nfor\nparticular\nprojects\n2.4 Strategies and actions needed to achieve\ngoals\n2.5 Organizational policies and procedures\nfor dealing with the media\n2.6 Accountability requirements\n2.7 Resources\nand\nsupport\nwithin\nthe\ncommunity\n2.8 Government funding policies\n2.9 Knowledge of local area\n2.10 Relevant\nlocal,\nstate\nand\nfederal\nstrategies\n\n3. Underpinning skills\n\n3.1 Liaison and networking\n3.2 Communication\n3.3 Research skills\n3.4 Time management\n3.5 Budgeting\n3.6 Report writing\n3.7 Evaluation\n3.8 Presentation\n3.9 Marketing and promotion\n3.10 Negotiation\n\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Access to appropriate resources for\ndeveloping, delivering and evaluating\ncommunity education projects (or access\nto\nan\nappropriately\nsimulated\nenvironment).\n\n--- PDF PAGE 100 ---\nEVIDENCE GUIDE\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n\n6. Context of\n assessment\n\n6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 101 ---\nUNIT OF COMPETENCY : IMPLEMENT HEALTH PROMOTION AND\n COMMUNITY INTERVENTION\nUNIT CODE : HCS346309\nUNIT DESCRIPTOR : This unit describes the competencies required to\n implement health promotion and community\n\n intervention. It covers the setting up, devising,\n coordinating, delivering and evaluating health\n promotion and community intervention program.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Identify\ncommunity\nissues in preventive\nhealth care\n\n1.1\nSocial research methods in analyzing\ndemographic\ndata\nof\ncommunity\nhealth profile are collated.\n1.2\nKey issues in preventative health care\nidentified.\n1.3\nCurrent responses to preventative\nhealth care are identified.\n1.4\nInformation on preventative health\ncare are accessed and applied to\ndeveloping solutions to community\nissues.\n1.5\nTarget populations are identified and\nconsultation\nprocesses\nare\ndetermined.\n1.6\nPolicy and funding contexts and issues\nare examined.\n\n2. Work\nwithin\nthe\neducational\nframework of health\npromotion\n\n2.1\nDevelop an educational perspective\nbased on a philosophical and historical\nunderstanding of preventive health\ncare.\n2.2\nPreventive health care perspective is\nintegrated\ninto\ncommunity\ndevelopment and capacity building.\n2.3\nRelevant\nstrategies\napplicable\nfor\nhealth promotion are applied in the\ncommunity.\n\n--- PDF PAGE 102 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n\n2.4\nPartnerships with stakeholders are\nplanned.\n2.5\nA range of techniques to engage\ncommunity\nin\nhealth\npromotion\nactivities are identified.\n2.6\nKey resources for health promotion\n activities are accessed.\n\n3. Identify the activity /\nprogram required.\n\n3.1\nThe need for particular program is\nassessed\nfrom\nrelevant\nevidence\ncollected.\n3.2\nA range of possible programs to meet\nthe defined needs are identified and\nreviewed.\n3.3\nSelection of a program type is based\non client needs, organization’s criteria,\nand availability of resources.\n\n4. Prepare\nactivity\n/\nprogram plan\n\n4.1\nAppropriate strategic planning activities\nare undertaken, to ensure client needs\nare met.\n4.2\nPlanning\nactivities\nincorporate\nconsultation with key clients and\nstakeholders.\n4.3\nOperational\narrangements\nfor\nconducting\nthe\nprogram\nare\ndetermined\nand\nassessed\nfor\nfeasibility.\n4.4\nPlanning activities reflect accepted\ngood practice in working with young\npeople.\n\n--- PDF PAGE 103 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n5. Deliver activity /\n program\n\n5.1\nThe\nprogram\nis\nimplemented\nin\naccordance with the program plan,\norganization guidelines and legal /\nstatutory requirements.\n5.2\nParticipants are provided with access\nto a range of activities suited to their\nneeds and interests.\n5.3\nFlexible\nimplementation\nplans\nare\ndeveloped to suit a variety of contexts\nand to cope with contingencies.\n5.4\nThe\nprogram\nis\nadapted\nto\nthe\nchanging needs of participants as\nrequired.\n5.5\nProblem\nin program\ndelivery\nare\naddressed promptly.\n\n6. Evaluate activity\n program\n\n6.1\nCriteria to judge the effectiveness of\nthe program are defined in consultation\nwith clients and stakeholders.\n6.2\nAppropriate evaluation strategies are\nused routinely during and after the\nprogram and used for revision and\ndevelopment.\n6.3\nEvaluation information is collected,\norganized and reported in a format\nwhich is accessible and meaningful to\nthe clients and stakeholders.\n6.4\nReports are prepared and presented\nas required.\n\n--- PDF PAGE 104 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Key resource\n information\n\n1.1 WHO concept of Health\n\n2. Key issues and\n prevention strategies\n affecting people’s\n health\n\n2.1 Nutrition\n2.2 Substance use and misuse\n2.3 Environmental health\n2.4 Mental health\n2.5 Sexual and reproductive health\n2.6 Other determinants\n\n3. Programs\n\n3.1 Activities designed to address needs of\ntarget groups.\n3.2 Activities\ndesigned\nto\nmeet\nneeds\nidentified in research\n3.3 Strategies to implement government /\nfunding agency policy\n3.4 Activities to extend the participation\nnumbers in existing programs\n3.5 Strategies\nto\naddress\nexclusion,\ndiscrimination and alienation\n3.6 Those directed at individual young people\nand their needs\n3.7 Those directed at the general community\nwhich affect young people\n3.8 Those initiated by the organization, by\ncommunity\ngroups,\nby\nother\norganizations, or by community leaders\nand decision makers\n3.9 Those designed to respond to social,\neconomic and demographic changes\n\n--- PDF PAGE 105 ---\nVARIABLE\n\nRANGE\n\n4. Programs\n\nMay have the following focus:\n4.1 Education / learning / training eg.\nHomework support and study\n4.2 Personal development and support eg.\nLife skills education\n4.3 Music and performing arts eg. Youth\ntheatres, band, video production team\n4.4 Research, planning and management\neg. Aboriginal cultural camp, scouts\nmeeting\n4.5 Community action eg. Anti violence\ngroup\n4.6 Special interests causes eg. Young\npeople against nuclear disarmament\n4.7 Enterprise development activities\n4.8 Employment, fund raining, small business\n\n5. Program activities\n\nMay include:\n5.1 Discussion groups e.g. About safe sex,\nreligious beliefs\n5.2 Sporting and recreation activities e.g.\nBasketball at the drop in centre, pool\ngame, disco, bush excursion\n5.3 Structured\nand\nunstructured\nsocial\nactivities e.g. Party, shopping, visit to\ncinema\n\n6. Programs are\n planned and\n implemented\n\nFor the purpose of:\n 6.1 Providing immediate support\n 6.2 Promoting individual’s participation and\n personal development\n 6.3 Enabling individual to use their time\n constructively, have fund and develop\n qualities of self reliance\n 6.4 Enabling young people to learn life skills,\n knowledge and attitudes\n\n--- PDF PAGE 106 ---\nEVIDENCE GUIDE\n\n1. Critical\naspects\nof\ncompetency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Identified community issues in preventive\nhealth care\n1.2 Worked within the educational framework\nof health promotion\n1.3 Identified the activity/program required\n1.4 Prepared activity/program plan\n1.5 Delivered activity/program\n1.6 Evaluated activity program\n\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1 A philosophical and historical\n understanding of preventive health care\n2.2 Knowledge of social research and date\nrelating to health issues\n2.3 Primary health care principles\n2.4 Funding and policy environment\n2.5 A range of individual’s activities and\nprograms\n2.6 Legal and safety requirements as they\nrelate to activities and programs\n2.7 Relevant funding sources\n\n3. Underpinning skills\n\n3.1 Oral\ncommunication\nskills\n(language\ncompetence) required to fulfill job roles\nas specified by the organization / service.\nOral communication skills include asking\nquestions, active listening, asking for\nclarification,\nnegotiating\nsolutions,\nacknowledging and responding to a range\nviews.\n3.2 Written communication skills (literacy\ncompetence) required to fulfill job roles as\nspecified.\n3.3 Research skills\n3.4 Database use and interpretation\n3.5 Oral and written communication skills\n3.6 Numerical skills to enable statistical\ninterpretation\n\n--- PDF PAGE 107 ---\n3.7 Research and consultation\n3.8 Coordination\nand\nmanagement\nof\nprograms\n3.9 Analysis\nof\ndata,\ninformation\nand\nrelationships\n3.10\nAdvocacy\n3.11\nProvision of support to a diverse\nrange of people / organizations\n3.12\nConflict resolution / negotiation and\nmediation\n3.13\nCross cultural communication and\nnegotiation\n3.14\nLiteracy adequate to prepare a range\nof appropriate resource material\n3.15\nWorking with and through community\nleaders\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Access to workplace or to an accurately\nsimulated\nenvironment\nwhere\nassessment may take place\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6. Context of\n assessment\n\n6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 108 ---"
