        "source_text": "HCS323203\nUNIT DESCRIPTOR : This unit of competency covers the knowledge,\n skills and attitudes required to effectively respond to\n difficult or challenging behavior of patients.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan responses\n\n1.1 Responses are planned to instances of\ndifficult or challenging behavior to maximize\nthe availability of other appropriate staff and\nresources.\n1.2 Specific\nmanifestations\nof\ndifficult\nor\nchallenging behavior are identified and\nstrategies appropriate to these behaviors are\nplanned as required.\n1.3 Safety of self and others is given priority in\nresponding to difficult or challenging behavior\naccording\nto\ninstitutional\npolicies\nand\nprocedures.\n\n2. Apply response\n\n2.1 Difficult or challenging behavior is dealt with\npromptly,\nfirmly\nand\ndiplomatically\nin\naccordance with institutional policy and\nprocedures.\n2.2 Communication is used effectively to achieve\nthe desired outcomes in responding to difficult\nor challenging behavior.\n2.3 Appropriate strategies are selected to suit\nparticular instances of difficult or challenging\nbehavior.\n\n--- PDF PAGE 30 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Report\nand\nreview incidents\n\n3.1 Incidents are reported according to institutional\npolicies and procedures.\n3.2 Incidents are reviewed with appropriate staff\nand suggestions appropriate to area of\nresponsibility are made.\n3.3 Debriefing mechanisms and other activities\nare used and participated in.\n3.4 Advice\nand\nassistance\nis\nsought\nfrom\nlegitimate sources when appropriate.\n\n--- PDF PAGE 31 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Planned\nresponses\n\n1.1 Own ability and experience\n1.2 Established institutional procedures\n1.3 Knowledge\nof\nindividual\npersons\nand\nunderlying causes\n\n2. Difficult\nor\nchallenging\nbehavior\n\n2.1 Aggression / Assaultive behavior\n2.2 Confusion or other cognitive impairment\n2.3 Noisiness\n2.4 Manipulative\n2.5 Wandering\n2.6 Self-destructive\n2.7 Intoxication\n2.8 Withdrawn / depressed\n2.9 Negativistic\n2.10\nIntrusive behavior\n2.11\nVerbal offensiveness\n\n3. Strategies\nfor\ndealing\nwith\nchallenging\nbehaviors\n\n3.1 Diversional activities\n3.2 Referring to appropriate personnel e.g.\nsupervisor, security officer\n3.3 Following established emergency response\nprocedures\n\n4. Selection\nof\nstrategies\nfor\ndealing\nwith\nchallenging\nbehaviors\n\n4.1 The nature of the incident\n4.2 Potential effect on different parties, patient,\nstaff and others\n4.3 Established procedures and guidelines\n\n5. Institutional\npolices\nand\nprocedures\n\n5.1 Incident reporting and documentation\n5.2 Operational guidelines for handling incidents\nand/or cases involving difficult and challenging\nbehavior\n5.3 Debriefing of staff involved in the incident\n\n--- PDF PAGE 32 ---\nEVIDENCE GUIDE\n\n1. Critical\naspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Identified specific manifestations of difficult or\nchallenging behavior and strategies are\nplanned, selected and applied as required\n1.2 Maintained personal safety and the safety of\nothers\n1.3 Reported incidents, reviewed and responded\nquickly and effectively to contingencies\n1.4 Debriefing mechanisms are used\n\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1 OSH and issues relating to difficult and\nchallenging behavior\n2.2 Patient issues which need to be referred to an\nappropriate health professional\n2.3 Ability to interpret and follow the instructions\nand guidance of health professionals involved\nwith the care of patient / client\n\n3. Underpinning\nskills\n\n3.1 Effectively using techniques for monitoring\nown service area including client satisfaction\n3.2 Speaking in a firm, diplomatic and culturally\nappropriate manner\n3.3 Remaining calm and positive in adversity\n3.4 Thinking\nand\nresponding\nquickly\nand\nstrategically\n3.5 Remaining alert to potential incidents of\ndifficult or challenging behavior\n3.6 Monitoring\nand/or\nmaintaining\nsecurity\nequipment\n3.7 Working with others and displaying empathy\nwith patient and relatives\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment\ncan take place\n4.2 Relevant\ninstitutional\npolicy,\nguidelines,\nprocedures and protocols\n4.3 Emergency\nresponse\nprocedures\nand\nemployee support arrangements\n\n--- PDF PAGE 33 ---\n5. Method\nof\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n\n6. Context\nof\nassessment\n\n6.1 Assessment may be done in the workplace or\nin a simulated workplace setting.\n\n--- PDF PAGE 34 ---\nUNIT OF COMPETENCY: APPLY BASIC FIRST AID\nUNIT CODE :"
