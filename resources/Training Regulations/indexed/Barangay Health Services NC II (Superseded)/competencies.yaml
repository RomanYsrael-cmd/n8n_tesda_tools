        "source_text": "--- PDF PAGE 17 ---\nUNIT OF COMPETENCY:   PRACTICE OCCUPATIONAL HEALTH AND  \n                                            SAFETY PROCEDURES \nUNIT CODE                     :   500311108 \nUNIT DESCRIPTOR        :   This unit covers the outcomes required to comply  \n                                              with regulatory and organizational requirements for  \n                                              occupational health and safety. \n \n \n \nELEMENT \n \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify hazards \nand risks \n \n1.1 \nSafety regulations and workplace safety \nand hazard control practices and procedures \nare \nclarified \nand explained based on \norganization procedures. \n1.2 \nHazards/risks in the workplace and their \ncorresponding indicators are identified to \nminimize or eliminate risk to co-workers, \nworkplace and environment in accordance \nwith organization procedures. \n1.3 \nContingency measures during workplace \naccidents, fire and other emergencies are \nrecognized and established in accordance \nwith organization procedures. \n \n2. Evaluate \nhazards and  \n      risks \n \n2.1 \nTerms of maximum tolerable limits which \nwhen exceeded will result in harm or \ndamage are identified based on threshold \nlimit values (TLV). \n2.2 \nEffects of the hazards are determined. \n2.3 \nOHS issues and/or concerns and identified \nsafety hazards are reported to designated \npersonnel in accordance with workplace \nrequirements and relevant workplace OHS \nlegislation.\n\n--- PDF PAGE 18 ---\nELEMENT \n \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n3. Control hazards \nand risks \n \n \n3.1 \nOccupational Health and Safety (OHS) \nprocedures for controlling hazards/ risks in \nworkplace are consistently followed. \n3.2 \nProcedures for dealing \nwith workplace \naccidents, fire and emergencies are followed \nin \naccordance \nwith \norganization \nOHS \npolicies. \n3.3 \nPersonal protective equipment (PPE) is \ncorrectly \nused \nin \naccordance \nwith \norganization OHS procedures and practices. \n3.4 \nAppropriate assistance is provided in the \nevent \nof \na \nworkplace \nemergency \nin \naccordance with established organization \nprotocol. \n \n4. Maintain \nOHS \nawareness \n \n4.1 \nEmergency-related drills and trainings are \nparticipated \nin \nas \nper \nestablished \norganization guidelines and procedures. \n4.2 \nOHS personal records are completed and \nupdated in accordance with workplace \nrequirements.\n\n--- PDF PAGE 19 ---\nRANGE OF VARIABLES \n \n \n \n \nVARIABLE \n \nRANGE \n \n \n1. Safety \nregulations \n \n \nMay include but are not limited to: \n1.1 Clean Air Act \n1.2 Building Code \n1.3 National Electrical and Fire Safety Codes \n1.4 Waste management statutes and rules \n1.5 Philippine Occupational Safety and Health \nStandards \n1.6 DOLE regulations on safety legal requirements \n1.7 ECC regulations \n \n2. Hazards / Risks \n \nMay include but are not limited to: \n2.1 Physical hazards -  impact, illumination, \npressure, \nnoise, \nvibration, \ntemperature, \nradiation \n2.2 Biological hazards – bacteria, viruses, plants, \nparasites, mites, molds, fungi, insects \n2.3 Chemical hazards – dusts, fibers, mists, \nfumes, smoke, gasses, vapors \n2.4 Ergonomics \n●  Psychological factors – over exertion /  \n    excessive force, awkward / static positions,  \nfatigue, direct pressure, varying metabolic  \ncycles \n             ● Physiological factors – monotony, personal  \n                 relationship, work out cycle \n \n3. Contingency \n      measures \nMay include but are not limited to: \n3.1 Evacuation \n3.2 Isolation \n3.3 Decontamination \n3.4 (Calling designed) emergency personnel\n\n--- PDF PAGE 20 ---\nVARIABLE \n \n \nRANGE \n4. PPE \n \nMay include but are not limited to: \n4.1 Mask \n4.2 Gloves \n4.3 Goggles \n4.4 Hair Net/ cap/ bonnet \n4.5 Face mask/ shield \n4.6 Ear muffs \n4.7 Apron/ Gown/ coverall / jump suit \n4.8 Anti-static suits \n \n5. Emergency –  \n     related drills and  \n     training \n \n5.1 Fire drill \n5.2 Earthquake drill \n5.3 Basic life support /CPR \n5.4 First aid \n5.5 Spillage control \n5.6 Decontamination of chemical toxic \n5.7 Disaster preparedness / management \n \n6. OHS personal  \n      records \n \n6.1 Medical / Health records \n6.2 Incident reports \n6.3 Accident reports \n6.4 OHS-related training completed\n\n--- PDF PAGE 21 ---\nEVIDENCE GUIDE \n \n \n1. \nCritical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 \nExplained \nclearly \nestablished \nworkplace \nsafety and hazard control practices and \nprocedures \n1.2 \nIdentified hazards/risks in the workplace and \nits corresponding indicators in accordance \nwith company procedures \n1.3 \nRecognized contingency measures during \nworkplace \naccidents, \nfire \nand \n \nother \nemergencies \n1.4 \nIdentified terms of maximum tolerable limits \nbased on threshold limit value –TLV. \n1.5 \nFollowed Occupational Health and Safety \n(OHS) procedures for controlling hazards / \nrisks in workplace \n1.6 \nUsed Personal Protective Equipment (PPE) \nin \naccordance \nwith \ncompany \nOHS \nprocedures and practices \n1.7 \nCompleted and updated OHS personal \nrecords \nin \naccordance \nwith \nworkplace \nrequirements \n \n2. \nUnderpinning \nknowledge and \nattitudes \n \n2.1 \nOHS \nprocedures \nand \npractices \nand \nregulations \n2.2 \nPPE types and uses \n2.3 \nPersonal hygiene practices \n2.4 \nHazards / risks identification and control \n2.5 \nThreshold Limit Value (TLV) \n2.6 \nOHS indicators \n2.7 \nOrganization safety and health protocol \n2.8 \nSafety consciousness \n2.9 \nHealth consciousness \n \n3. \nUnderpinning \nskills \n \n3.1 \nPractice of personal hygiene \n3.2 \nHazards / risks identification and control \nskills \n3.3 \nInterpersonal skills \n3.4 \nCommunication sills\n\n--- PDF PAGE 22 ---\n4. \nResource \nimplications \n \nThe following resources MUST be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nOHS personal records \n4.3 \nPPE \n4.4 \nHealth records \n \n5. \nMethod of  \nassessment \n \nCompetency may be assessed through: \n5.1 Portfolio Assessment \n5.2 Interview \n5.3 Case Study / Situation \n \n6. \nContext of  \n        assessment \n \n6.1 \nCompetency may be assessed in the work \nplace or in a simulated work place setting\n",
