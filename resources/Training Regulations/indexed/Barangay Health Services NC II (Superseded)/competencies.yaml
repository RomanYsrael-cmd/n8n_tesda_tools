        "descriptor": "This focus of the work is assisting clients to address their own issues. On completion of this unit, the worker will be able to respond appropriately to clients that have complex issues outside and in addition to the area of immediate focus, expertise or interests of the worker and their organization. For instance, the worker might work for an agency, and possess relevant competence, in the area of child protection, but will still be able to identify when say alcohol and other drug issues are important in the life of a presenting client. Completion of the unit will also provide the worker with competencies to make decisions as to whether to refer or retain the client. The worker will first be able to make a decision as to whether a brief intervention is appropriate (instead of an immediate referral). The worker will be able to implement and monitor brief intervention strategies in a variety of community service contexts, with the primary aim of helping the client accept the intervention.",
