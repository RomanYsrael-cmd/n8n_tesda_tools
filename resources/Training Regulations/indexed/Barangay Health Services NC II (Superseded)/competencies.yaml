          "source_text": "1. \nDevelop  the  \n         health program \n         education. \n \n1.1 Project  plan is developed in consultation \nwith key people and organizations and \nidentifies priorities and desired outcomes \nto address issues of concerns of target \ngroup/s. \n1.2 Appropriate \nhuman, \nfinancial \nand \nphysical resources are identified and \nsecured \n1.3 Marketing materials are prepared and \ndisseminated to target audience and \nothers as appropriate. \n \n2. \nOrganize \nparticipants to the  \n          program. \n \n2.1 Strategies for delivery of the project are \ndeveloped and implemented to ensure \nmaximum effectiveness. \n2.2 Education \n/ \nresource \nmaterials \nappropriate to the context, issue and \naudience are developed and distributed. \n2.3 Strategies \nare \nimplemented \nto \nencourage full participation in the project \nand the expression of views and feelings \nabout its process or content. \n2.4 Project \nadjustments \nare \nmade \nas \nrequired to meet the needs of specific \ngroup. \n2.5 Feedback on the education project or \nactivity is sought from participants.\n\n--- PDF PAGE 97 ---\nELEMENT \n \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n3. \nCoordinate \nhealth \nteaching program. \n \n3.1 The education project is assessed \nagainst the planned goals and objectives \nin \naccordance \nwith \norganizational \npolicies and procedures. \n3.2 Outcomes of project evaluations are \ndiscussed \nwith \nkey \npeople \nand \norganizations \nto \ndetermine \nfuture \ndirections. \n3.3 Education \nproject \noutcomes \nare \ndocumented, \nand \nwhere \nnecessary \nacted \non \nin \naccordance \nwith \norganizational procedures.\n\n--- PDF PAGE 98 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n \n1. \nEducation projects  \n         \n \nMay include: \n1.1 Projects of varying scope and scale \nranging from state wide initiatives, to \nspecific activities \n- \nA \nsingle \nevent, \nsuch \nas \nan \ninformation stall in a shopping centre \n- \nA multi session education and skill \n- \nA complex, large scale series of \nactivities that incorporates diverse but \ncoordinated elements, such as a \nstatewide \neducation \ncampaign \ninvolving mass media information. \n \n2. \nKey people and  \n        organizations  \n \nMay include:     \n       2.1   Target group \n       2.2   Other relevant organizations \n       2.3   Funding bodies \n       2.4   Community support groups \n       2.5    The media \n \n3. \nResources  \n \nMay include: \n3.1 Equipment \n3.2 Staff skills \n3.3 Time \n3.4 Space \n3.5 Venue \n3.6 Educational materials \n3.7 Funding \n \n4. \nMarketing materials  \n \n4.1 Culturally appropriate \n \n5. \nAssessment and  \n        evaluation of the  \n        education project  \n        may include: \n \nMay include: \n       5.1   Use of feedback \n       5.2   Discussions with stakeholders,  \n               organizations and other participants \n       5.3   Discussion with colleagues\n\n--- PDF PAGE 99 ---"
