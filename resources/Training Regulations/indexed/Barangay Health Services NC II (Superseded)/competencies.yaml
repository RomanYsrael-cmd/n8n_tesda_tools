        "source_text": "500311106\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n to identify role and responsibility as a member of a\n team.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\nDescribe\nteam\nrole and scope\n\n1.1 The role and objective of the team is\nidentified\nfrom\navailable\nsources\nof\ninformation.\n1.2 Team parameters, reporting relationships and\nresponsibilities are identified from team\ndiscussions and appropriate external sources.\n2.\nIdentify own role\nand\nresponsibility\nwithin team\n\n2.1 Individual role and responsibilities within the\nteam environment are identified.\n2.2 Roles and responsibility of other team\nmembers are identified and recognized.\n2.3 Reporting relationships within team and\nexternal to team are identified.\n3.\nWork as a team\nmember\n\n3.1 Effective\nand\nappropriate\nforms\nof\ncommunications\nused\nand\ninteractions\nundertaken\nwith\nteam\nactivities\nand\nobjectives.\n3.2 Effective and appropriate contributions made\nto complement team activities and objectives,\nbased on individual skills and competencies\nand workplace context.\n3.3 Observe protocols in reporting using standard\noperating procedures.\n3.4 Contribute to the development of teamwork\nplans based on an understanding of team’s\nrole\nand\nobjectives\nand\nindividual\ncompetencies of the members.\n\n--- PDF PAGE 12 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Role and\n objective of team\n\n1.1\nWork activities in a team environment with\nenterprise or specific sector\n1.2\nLimited discretion, initiative and judgment\nmaybe demonstrated on the job, either\nindividually or in a team environment\n\n2. Sources of\n information\n\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine\n/\nequipment\nmanufacturer’s\nspecifications and instructions\n2.4\nOrganizational or external personnel\n2.5\nClient / supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n\n3. Workplace\ncontext\n\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard\nwork\npractice\nincluding\nthe\nstorage, safe handling and disposal of\nchemicals\n3.5\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 13 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Operated in a team to complete workplace\nactivity\n1.2 Worked effectively with others\n1.3 Conveyed information in written or oral form\n1.4 Selected and used appropriate workplace\nlanguage\n1.5 Followed designated work plan for the job\n1.6 Reported outcomes\n\n2.\nUnderpinning\nknowledge and\nattitude\n\n2.1 Communication process\n2.2 Team structure\n2.3 Team roles\n2.4 Group planning and decision making\n\n3.\nUnderpinning\nskills\n\n3.1 Communicate appropriately, consistent with\nthe culture of the workplace\n\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment\ncan take place\n4.2 Materials relevant to the proposed activity or\ntasks\n\n5.\nMethod of\n assessment\n\nCompetency may be assessed through:\n5.1 Observation of the individual member in relation\nof the work activities of the group.\n5.2 Observation of simulation and or role play\ninvolving the participation of individual member to\nthe attainment of organizational goal.\n5.3 Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork.\n\n6.\nContext of\n assessment\n\n6.1 Competency may be assessed in workplace or in\na simulated workplace setting.\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in group.\n\n--- PDF PAGE 14 ---\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\nUNIT CODE :"
