        "source_text": "--- PDF PAGE 34 ---\nUNIT OF COMPETENCY:   APPLY BASIC FIRST AID \nUNIT CODE                     :   HCS323204 \nUNIT DESCRIPTOR        :   This unit  covers the knowledge, skills and attitudes \\ \nrequired to provide an initial response where First Aid \nis required.  In this unit it is assumed that the First \nAider is working under supervision and /or according \nto established workplace First Aid procedures and \npolicies. \n \n \nELEMENT \n \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Assess \nthe \nsituation \n \n1.1 Physical hazards to self and casualty’s health \nand safety are identified. \n1.2 Immediate risks to self and casualty’s \noccupational health and safety (OSH) are \nminimized \nby \ncontrolling \nthe \nhazard \nin \naccordance with OSH requirements. \n1.3 Casualty’s vital signs and physical condition \nare assessed in accordance with workplace \nprocedures. \n \n2. Apply basic first \naid techniques \n \n2.1 First \nAid \nmanagement \nis \nprovided \nin \naccordance \nwith \nestablished \nFirst \nAid \nprocedures. \n2.2 Casualty is reassured in a caring and calm \nmanner and made comfortable using available \nresources. \n2.3 First Aid assistance is sought from others in a \ntimely manner and as appropriate. \n2.4 Casualty’s \ncondition \nis \nmonitored \nand \nresponded to in accordance with effective. \nFirst \nAid \nprinciples \nand \nworkplace \nprocedures. \n2.5 Details \nof \ncasualty’s \nphysical \ncondition, \nchanges in conditions, management and \nresponse are accurately recorded in line with \norganizational procedures. \n2.6 Casualty management is finalized according to \nhis/her needs and First Aid principles.\n\n--- PDF PAGE 35 ---\nELEMENT \n \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3. Communicable \ndetails \nof \nthe \nincident \n \n3.1 Appropriate medical assistance is requested \nusing relevant communication media and \nequipment. \n3.2 Details \nof \ncasualty’s \ncondition \nand \nmanagement \nactivities \nare \naccurately \nconveyed to emergency services / relieving \npersonnel. \n3.3 Reports to supervisors are prepared in a \ntimely manner, presenting all relevant facts \naccording \nto \nestablished \ncompany \nprocedures.\n\n--- PDF PAGE 36 ---\n\n\n--- PDF PAGE 37 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \n \nRANGE \n1. First Aid  \n     Management \n \nThis may include but not limited to: \n1.1 Workplace policies and procedures \n1.2 Industry / site specific regulations, codes \n1.3 OSH \n1.4 State and territory workplace health and safety \nrequirements \n1.5 Allergies the casualty may have \n \n2. Physical Hazards \n \nPhysical hazards may include: \n2.1 Workplace hazards \n2.2 Environmental hazards \n2.3 Proximity of other people \n2.4 Hazards associated with casualty management \nprocesses \n \n3. Risks \n \nRisks may include: \n3.1 Worksite \nequipment, \nmachinery \nand \nsubstances \n3.2 Environmental risks \n3.3 Bodily fluids \n3.4 Risk of further injury to the casualty \n3.5 Risk associated with the proximity of the others \nand bystanders \n \n4. Casualty’s \ncondition \n \nCasualty’s condition may include but not limited to the \nfollowing: \n4.1  Abdominal injuries \n4.2 Allergic reactions \n4.3 Bleeding \n4.4 Burns – thermal, chemical, friction, electrical \n4.5 Cardiac conditions \n4.6 Chemical contamination \n4.7 Cod injuries\n\n--- PDF PAGE 38 ---\nVARIABLE \n \n \nRANGE \n \n \n4.8 Crush injuries \n4.9 Dislocations \n4.10 Drowning \n4.11 Eye injuries \n4.12 Fractures \n4.13 Head injuries \n4.14 Epilepsy \n4.15 Minor skin injuries \n4.16 Neck and spinal injuries \n4.17 Needle stick injuries \n4.18 Poisoning and toxic substances \n4.19 Shock \n4.20 Smoke inhalation \n \n5. Equipment \nand \nResources \n \nEquipment and other resources may  include: \n5.1 Defibrillation units \n5.2 Pressure bandages \n5.3 Thermometers \n5.4 First Aid Kit \n5.5 Eyewash \n5.6 Thermal blankets \n5.7 Pocket face masks \n5.8 Rubber gloves \n5.9 Dressing \n5.10 \nSpace device \n5.11 \nCervical collars \n \n6. Communication \nsystem \n \n6.1 Mobile phone \n6.2 Satellite phones \n6.3 HF /VHF radio \n6.4 Flags \n6.5 Flares \n6.6 Two-way radio \n6.7 Email \n6.8 Electronic equipment\n\n--- PDF PAGE 39 ---\nVARIABLE \n \n \nRANGE \n7. Vital signs \n \n7.1 Breathing \n7.2 Circulation \n7.3 Consciousness \n \n8. First \nAid \nPrinciples \n \n8.1 Checking the site for danger to self, casualty \nand others and minimizing the danger \n8.2 Checking and maintaining the casualty’s \nairways, breathing and circulation\n\n--- PDF PAGE 40 ---\nEVIDENCE GUIDE \n \n \n1. \nCritical aspects \nof competency \n \n \nAssessment requires evidence that the candidate: \n1.1 \nComplied with institutional requirements, \nOSH laws infections control and manual \nhandling procedures and relevant health \nregulations \n1.2 \nIdentified physical hazards of the casualty \nand minimized immediate risks \n1.3 \nAssessed \nand \nmonitored \nthe \nphysical \ncondition of the casualty \n1.4 \nResponded to emergency using basic life \nsupport  measures \n1.5 \nProvided initial response where First Aid is \nrequired \n1.6 \nDealt with complex casualties or incident \n1.7 \nPrepared reports to concerned personnel in \na timely manner \n \n2. \nUnderpinning \nknowledge and \nattitudes \n \n2.1 \nBasic anatomy and physiology \n2.2 \nCompany standard operating procedures \n(SOPS) \n2.3 \nDealing with confidentiality \n2.4 \nKnowledge \nof \nthe \nFirst \nAider’s \nskills \nlimitations \n2.5 \nOSH legislation and regulations \n2.6 \nHow to gain access to and interpret material \nsafety data sheets \n \n3. \nUnderpinning \nskills \n \n3.1 \nResuscitation \n3.2 \nSafe manual handling of casualty \n3.3 \nConsideration of the welfare of the casualty \n3.4 \nPreparing reports \n3.5 \nCommunication skills \n3.6 \nInterpreting and using listed documents \n \n4. \nResource \nimplications \n \nThe following resources MUST be provided: \n4.1 \nAccess to relevant work station \n4.2 \nRelevant institutional policies, guidelines \nprocedures and protocol \n4.3 \nEquipment and materials relevant to the \nproposed activities\n\n--- PDF PAGE 41 ---\n5. \nMethod \nof \nassessment \n \n \n \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nThird party report \n5.4 \nPortfolio \n \n6. \nContext \nof \nassessment \n \n6.1 \nAssessment may be done in a workplace or \nsimulated work area setting.\n",
