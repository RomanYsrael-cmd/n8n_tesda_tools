        "evidence_guide": {
          "source_text": "1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate\n1.1\nCommunicated with team and individuals on\norganizational policy and procedures for\ninfection control\n1.2\nApplied\ninfection\ncontrol\npolicies\nand\nprocedures which impact on work processes\nof the specific work unit\n1.3\nApplied procedures for adopting appropriate\ninfection practices within work unit\n1.4\nProvided appropriate supervision of work\ngroup\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nWorking knowledge, consistent with the\nelements\nof\ncompetence,\nof\nthe\norganization’s applicable infection control\npolicy and procedures and relevant industry\ncodes of practice\n2.2\nThe hierarchy risk control measures from\nmost to least preferred, that is, elimination,\nengineering controls, administrative control,\nand lastly, personal protective equipment\n2.3\nKnowledge of infection risks and control\nmeasures in specific work unit and related\nwork processes\n2.4\nThe significance of patient confidentiality in\nrelation to infection control\n2.5\nThe significance of other management\nsystems and procedures for infection control\n2.6\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n2.7\nOrganizational procedures for monitoring,\ntraining\n2.8\nBasic\nunderstanding\nof\ncommunicable\ndisease transmission\n3.\nUnderpinning\nskills\n\n3.1\nEffective communication and interpersonal\nskills including:\n-\nlanguage competence\n-\nliteracy and reading competence\n3.2\nNegotiation\n3.3\nWork planning and management\n3.4\nManaging change of work processes\n\n--- PDF PAGE 28 ---\n3.5\nMonitoring\ncompliance\nwith\npolicy\nand\nprocedures\n3.6\nMaintaining and interpreting infection control\nrecords\n\n4.\nResource\nImplications\n\nThe following resources MUST be provided:\n4.1\nWorkplace infection control and health and\nsafety policies and procedures\n4.2\nWaste management procedures\n4.3\nFood safety procedures\n4.4\nOther organizational policies and procedures\n4.5\nDuties statements and/or job descriptions\n\n5.\nMethod\nof\nassessment\n\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n5.3\nPortfolio\n5.4\nDemonstration with questioning\n\n6.\nContext\nof\nassessment\n\n6.1\nAssessment may be done in the workplace\nor in a simulated workplace setting.\n\n--- PDF PAGE 29 ---\nUNIT OF COMPETENCY: RESPOND EFFECTIVELY TO DIFFICULTY /\n CHALLENGING BEHAVIOR\nUNIT CODE :",
          "critical_aspects": [
            "of competency",
