          "source_text": "1.  Communicate  \n     appropriately with  \n     patients \n \n1.1 \nEffective communication strategies and \ntechniques are identified and used to achieve \nbest patient service outcomes. \n1.2 \nComplaints are responded to in accordance \nwith organizational policy to ensure best \nservice to patients. \n1.3 \nComplaints are dealt with in accordance with \nestablished procedures. \n1.4 \nInterpreter services are accessed as required. \n1.5 \nAction is taken to resolve conflicts either \ndirectly, where a positive outcome can be \nimmediately achieved, or by referral to the \nappropriate personnel. \n1.6 \nParticipation in work team is constructive and \ncollaborative \nand \ndemonstrates \nan \nunderstanding of own role. \n \n2. Establish and  \n      maintain good  \n      interpersonal  \n      relationship with  \n      patients \n \n2.1 Rapport is established to ensure the service is \nappropriate to and in the best interests of \npatients. \n2.2 Effective listening skills are used to ensure a \nhigh level of effective communication and \nquality of service. \n2.3 Patient concerns and needs are correctly \nidentified and responded to responsibly and \naccordingly \nestablished \nprocedures \nand \nguidelines. \n2.4 Effectiveness of interpersonal interaction is \nconsistently monitored and evaluated to \nensure best patient service outcomes.\n\n--- PDF PAGE 43 ---\nELEMENT \n \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3. Act in a  \n     respectful  \n     manner at all  \n     times \n \n3.1 Respect for differences is positively, actively \nand consistently demonstrated in all work. \n3.2 Confidentiality and privacy of patient is  \nmaintained. \n3.3 Courtesy is demonstrated in all interactions with \npatients, their visitors, carers and family. \n3.4 Assistance with the care of patients with \nchallenging behaviors is provided in accordance \nwith established procedures. \n3.5 Techniques are used to manage and miminize \naggression. \n \n4. Evaluate \nown \nwork to maintain \na high standard \nof patient service \n \n4.1 Advice and assistance is received or sought \nfrom \nappropriate \nsources \non \nown \nperformance. \n4.2 Own \nwork \nis \nadjusted, \nincorporating \nrecommendations that address performance \nissues, to maintain the agreed standard of \npatient support.\n\n--- PDF PAGE 44 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n \n1. Patients \n \nThis may include but not limited to: \n1.1 Patients \n1.2 Prospective patients to the service or \nservices \n1.3 Patients may be in contact with the institution \nthrough appropriate health care personnel \nand professionals or other advocates or \nagencies \n \n2. Others with whom \ninteraction \nis \nrequired in regard \nto patient services \n \n2.1 Other staff and team members \n2.2 Service units or departments \n2.3 Family members, carers and friends of \npatients \n2.4 Professional representatives or agents of \npatient such as: \n- \nMedical specialist \n- \nNurses \n- \nSocial workers \n- \nDietitians \n- \nTherapists \n- \nAllied health professionals \n- \nVolunteers \n- \nTeachers and/or spiritual \n- \nCommunity \n2.5 General public \n \n3. Communication \n \n3.1 English / Tagalog / Vernacular \n3.2 Sign language \n3.3 Through an interpreter \n3.4 Community language as required by the \nservice / organization \n \n4. Modes \nof \ncommunication: \n \n4.1 Continuing interaction with patients and \nclients \n4.2 Verbal conversations either in person or via \ntelephone \n4.3 Written notes by post or electronic media  \n4.4 Worker, family member friend or professional \ninterpreter who has relevant languages\n\n--- PDF PAGE 45 ---\nVARIABLE \n \nRANGE \n \n5. Respect \nfor \ndifference \n5.1 Physical \n5.2 Cognitive / mental or intellectual issues that \nmay impact on communication \n5.3 Cultural and ethnic \n5.4 Religious / spiritual \n5.5 Social \n5.6 Age \n5.7 Language literacy and numeracy abilities \n5.8 Sexuality and sexual preference \n \n6. Confidentiality \nand privacy of \npatients \n \n6.1 Fees \n6.2 Health fund entitlements \n6.3 Welfare entitlements \n6.4 Payment methods and records \n6.5 Public environments \n6.6 Legal and ethical requirements \n6.7 Writing details  i.e. medical and consent forms \n6.8 Conversations on the telephone \n6.9 Secure location for written records \n6.10 \nOffering a private location for discussions \n6.11 \nInformation disclosed to an appropriate \nperson \nconsistent \nwith \none’s \nlevel \nof \nresponsibility \n \n7. Performance \nmonitoring \n \n7.1 Self-monitoring \n7.2 Supervisor assessment \n7.3 Patient feedback\n\n--- PDF PAGE 46 ---\n\n\n--- PDF PAGE 47 ---"
