        "source_title": "WORK WITHIN THE COMMUNITY DEVELOPMENT FRAMEWORK",
        "source_text": "--- PDF PAGE 49 ---\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :   WORK WITHIN THE  COMMUNITY  \n                                              DEVELOPMENT FRAMEWORK \nUNIT CODE                      :   HCS346301 \nUNIT DESCRIPTOR         :   This unit reflects skills and knowledge required for  \n                                               working within a community development  \n                                               framework.  A community development framework  \n                                               may include of a range of methods designed to  \n                                               strengthen and develop communities by enhancing  \n                                               individual and group capacity to confidently engage  \n                                               with community structures and to address problems  \n                                               and issues. \n \n \n \n \n \n    Application of a community development  \n    framework may be undertaken within the scope of  \n    or in conjunction with a range of work roles / areas  \n    in the community services industry including  \n    specific areas of service delivery, community  \n    education activities and working with groups to  \n    address issues. \n \nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n \n1. Operate within a  \n      community  \n      development  \n      framework \n \n \n1.1 Work undertaken reflects a current \nworking knowledge and understanding of \ncommunity \ndevelopment \nvision \nand \nmission \n1.2 Work \nreflects \na \ncommitment \nto \nempowering / individuals to resolve their \nissues \nthrough \nenhancing \nskills, \naccessing \nappropriate \nsupport \nand \nworking with others in the community \nwho share concerns and issues \n1.3 Work is based on a demonstrated \nunderstanding of the interrelationships of \nthe needs and rights of the individual, the \nfamily, the community and society.\n\n--- PDF PAGE 50 ---\nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n \n \n1.4 Work \nreflects \na \ndemonstrated \nunderstanding of the impact of current \nand \nchanging \nsocial, \npolitical \nand \neconomic contexts \n1.5 Work undertaken in the industry reflects \nan application of: \n- \nAccepted \nstandards \nof \nethical \npractice \n- \nThe \nprinciples \nof \nsocial \njustice, \nhuman rights, anti discrimination and \nconfidentiality \n- \nRelevant occupational health and \nsafety \nand \nequal \nemployment \nopportunity principles and practices \n- \nPractices which protect confidentiality \n- \nThe impact of worker’s own value \nbase and values within a community \ndevelopment framework \n \n2. Work \nwith \nindividuals \nand \ngroups to achieve \ncommunity \ndevelopment \noutcomes \n \n2.1 Details of relevant individual and group \nissues are identified \n2.2 Relevant approaches to working with \nindividual and groups are assessed in \norder to ensure needs are met \n2.3 Relevant \ncommunity \nstructures \nare \nidentified \nand \nutilized \nto \nmaximize \noutcomes for individuals and groups \n2.4 Advice and information is provided to \ngroups and individuals as required to \nensure they are fully informed about \nrelevant issues and opportunities \n \n3. Address individual  \n     issues arising when  \n     working within a  \n     community  \n     development  \n     framework \n \n3.1 Appropriate interpersonal skills are employed \nto provide a first point of contact where \nindividual stories are heard and understood \n3.2 The capacity to address identified individual \nissues is assessed \n3.3 Appropriate referrals are provided both within \nand outside the organization to ensure \nindividual issues will be addressed\n\n--- PDF PAGE 51 ---\nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n \n3.4 Relevant facilitation skills are employed to \nassist individuals to identify the most \nappropriate course of action to ensure \ntheir issues are addressed \n3.5 All \nwork \nreflects \nknowledge \nand \nunderstanding of the impact of applying \ndifferent methods to address individual \nissues and meeting duty of care \n \n4. Work effectively with  \n      diversity in the  \n      community \n \n4.1 All work reflects the application of processes \nwhich aim to minimize the impact of  own \npersonal biases and experiences \n4.2 All work reflects respect and understanding \nof individual differences \n4.3 All work reflects recognition of the positive  \ncontribution of diversity in the community \n4.4 Work processes are adapted as appropriate \nto meet the specific cultural and linguistic \nneeds of individuals\n\n--- PDF PAGE 52 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n \n1. \nWork in the industry  \n \nIncludes: \n1.1 Voluntary \n1.2 Paid work \n2. \nEthical practices  \n          \n \n      Includes: \n      2.1   Professional relationships \n      2.2   Financial management \n      2.3   Information collection, storage and  \n              Dissemination \n       2.4   Operation of community and other  \n               organizations \n3. \nWorking \nwith \nindividuals \nand \ngroups to achieve \ncommunity \ndevelopment \noutcomes \nmay \ninclude engagement \nwith \nvarious \nstructures \nand \npatterns \nof \nwork \nundertaken \nby \npractitioners \nand \ncommunity \nmembers  \n \nIncludes: \n3.1 Community service delivery \n3.2 Community projects \n3.3 Community development \n3.4 Community action \n3.5 Community planning \n3.6 Consultative and planning committees \n3.7 Sector development structures \n4. \nAppropriate course \nof action  \n \nIncludes: \n4.1 A public response / meeting \n4.2 Group action \n4.3 Conducting a specific project \n4.4 Development of a program \n4.5 Establishment \nof \norganizational \narrangements \n5. \nCommunity \ndevelopment \noutcomes  \n        \nMay include: \n5.1 Building capacity to solve problems in the \ncommunity and to strengthen community \nstructures \n5.2 Increased community self confidence in \npublic activity \n5.3 \nIncreased \ncapacity \nof \ngroups \nand \nindividuals to engage with community \nstructures\n\n--- PDF PAGE 53 ---\nVARIABLE \n \n \nRANGE \n6. \nAreas of differences \nand \ndiversity \ninclude: \n \n6.1 Language \n6.2 Culture and cultural practices relating to: \n- \nReligion / spiritual observances \n- \nFamily relationships \n- \nStatus / protocol \n- \nCeremonies / celebrations \n- \nProhibition / taboos \n6.3 Social, economic, physical and health \nissues\n\n--- PDF PAGE 54 ---\nEVIDENCE GUIDE \n \n \n1.  Critical aspects of  \ncompetency \n \nAssessment \nrequires \nevidence \nthat \nthe \ncandidate: \n1.1  Demonstrated the applications of community \ndevelopment theories and practices to all \naspects of work \n1.2 Elicited a story from individuals, to test \ncommon \nunderstandings \nand \nfacilitated \nagreement on actions to be followed based \non information and assistance provided by \nthe worker \n1.3 Reviewed and modified own work practice \nwithin a community development framework \n \n2.  Underpinning knowledge \nand attitudes \n \n2.1 The historical, social, legislative, statutory, \npolitical, economic and cultural context of \nwork in the industry \n2.2 Philosophy and accepted practices of work \n2.3 Own biases and personal history related to \nwork area \n2.4 Strategies \nfor \naddressing \nindividual \ndifferences \n2.5 Principles and practices of a community \ndevelopment work \n2.6 Work models \n2.7 Knowledge of relevant issues specific to \ncommunities \n3.  Underpinning skills \n \n3.1 Communication and interpersonal skills \nrelevant to work area \n3.2  Using appropriate personal authority and \ninfluence to enhance work role \n3.3    Analyzing and assessing \n3.4   Relevant literacy standards and skills to \nmeet reporting requirements of work area \n3.5     Reflective listening \n3.6     Referral \n4.  Resource implications \n \nThe following resources MUST be provided: \n4.1  Access to a workplace or to an environment \nthat accurately simulates the workplace\n\n--- PDF PAGE 55 ---\n5.  Method of assessment \n \nCompetency may be assessed through: \n5.1  Demonstration with questioning \n5.2  Observation with questioning \n5.3  Oral questioning/Interview \n5.4  Portfolio \n6.  Context of assessment \n \n6.1Competency \nmay \nbe \nassessed \nin \nthe \nworkplace or in a simulated workplace and \nunder \nthe \nnormal \nrange \nof \nworkplace \nconditions.\n",
