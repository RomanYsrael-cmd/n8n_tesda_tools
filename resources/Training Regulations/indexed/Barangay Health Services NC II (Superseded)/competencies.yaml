  "source_section_text": "SECTION 1. BARANGAY HEALTH SERVICES NC II QUALIFICATION\n\nThe BARANGAY HEALTH SERVICES NC II Qualification consists of\ncompetencies that a person must achieve to work within a community\ndevelopment framework, prepare for work in the community service industry,\nsupport community resources, provide primary/residential care, support\ncommunity participation, recruit and coordinate volunteers, develop and provide\nhealth education program in the community, implement health promotion and\ncommunity interventions.\n\nThe Units of Competency comprising this Qualification include the following:\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice Occupational health and safety procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\nHCS323201\nImplement and monitor infection control policies and\nprocedures\nHCS323202\nRespond effectively to difficult / challenging behavior\nHCS323203\nApply basic first aid\nHCS323204\nMaintain high standard of patient services\n\nUNIT CODE\nCORE COMPETENCIES\nHCS346301\nWork within a community development framework\nHCS346302\nPrepare for work in the community service industry\nHCS346303\nSupport community resources\nHCS346304\nProvide primary / residential care\nHCS346305\nSupport community participation\nHCS346306\nRecruit and coordinate volunteers\n\n--- PDF PAGE 6 ---\nHCS346307\nRespond holistically to client issues\nHCS346308\nDevelop and provide health education program in the\ncommunity\nHCS346309\n Implement\nhealth\npromotion\nand\ncommunity\ninterventions\n\nA person who has achieved this Qualification is competent to be:\n\n● Barangay Health Worker NC II\n● Community Health Assistant NC II\n\n--- PDF PAGE 7 ---"
}
