          "source_text": "1. \nDevelop an  \n        information base of  \n        community  \n        resources \n \n1.1 Relevant \ninformation \nabout \nthe \ncommunity, \nits \norganizations \nand \nservices \nis \ncollected \nand \nstored \naccording \nto \nthe \norganizational \npractices so ongoing work is facilitated. \n1.2 \nA \ncurrent \ndirectory \nof \ncommunity \nresources is maintained so it is useable \nand accessible. \n2. \nEstablish \nrelationship with key \npeople \n \n2.1 Appropriate contact is established and \nmaintained with key people using a \nrange of communication strategies to \nensure that the outcomes from work in \nthe community is maximized. \n2.2 The roles and responsibilities of key \npeople and services are defined so that \nwork is effective and coordinated. \n3. \nApply strategies for \nlinking people \n \n3.1 Appropriate work is undertaken to create \nopportunities \nto \ndevelop \nsupportive \nconnections \nbetween \nkey \npeople \nincluding \narranging \nand \nconducting \nmeetings. \n3.2 Obstacles to effective contact between \npeople are identified and appropriate \nstrategies are developed to overcome \nthese. \n3.3  Appropriate levels of ongoing support is \nprovided \nto \npromote \ncommunity \ninteraction.\n\n--- PDF PAGE 63 ---\nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n4. \nMaintain community \nfacilities \nand \nresources \n \n4.1 All relevant records are maintained and \nmake available as required to facilitate \ncommunity interaction. \n4.2 Appropriate \nwork \nis \nundertaken \nto \nensure that  maintenance of community \nresources is carried out according to \nagreed \nprocedures \nand \nbudget \nallocations. \n4.3 Appropriate action is taken to ensure \npublic \nand \ncommunal \nareas \nare \naccessible and meet community needs.\n\n--- PDF PAGE 64 ---\nRANGE OF VARIABLES \n \n \n \nVARIABLE \n \n \nRANGE \n       1.  Community  \n             \nMay include: \n1.1    Individuals and groups defined by  \n          organization programs and services \n1.2    Other agencies providing services to  \n          individuals and groups \n1.3     People with specified needs and interests \n1.4     People using the organization’s services /    \n          programs \n2. Relevant information \nabout the community  \n \nMay include: \n2.1 Composition and social / cultural profile \n2.2 Cultural characteristics  \n2.3 Scope defined by organization’s objectives \nand priorities \n2.4 Size \n2.5 Nature and history of issues and interests \n2.6 Range and nature of other services \n2.7 Existing practice, process and protocol \n2.8  Data base of key people \n2.9  Details of other services / agencies \n2.10  Networks, support systems, groups \n2.11  Resources  \n2.12  Protocols for communication \n3. Key people  \n \nMay include: \n3.1  People with an interest in the purpose of the \norganization \n3.2  Designated groups in the community \n3.3  Community leaders, representatives \n3.4  Other providers \n3.5  People using the services of the organization \n3.6 Specialist providers\n\n--- PDF PAGE 65 ---\nVARIABLE \n \n \nRANGE \n4. Communication \nstrategies \n \n4.1   Attending meetings, groups. Shift hand over. \n4.2   Phone contact \n4.3   Sharing information \n4.4   Information newsletter \n4.5   Premises, \ngrounds, \naccommodation, \nworkplace \n4.6   Purpose designed and provided for the \ncommunity or workplace \n4.7  Exclusive use, ownership or shared of \nequipment and materials \n4.8  Information \n4.9  Personnel \n4.10 Financial \n \n       5.  Organization’s   \nprocedures        \n \nMay include: \n5.1  Formally documented policies, guidelines,  \ndelegations, philosophy \n5.2 Direction through supervision \n5.3 Management decisions, directives \n5.4 Information, \ndata \ncollection, \nproforma, \nreporting requirements \n5.5 Formal and informal negotiated agreement\n\n--- PDF PAGE 66 ---"
