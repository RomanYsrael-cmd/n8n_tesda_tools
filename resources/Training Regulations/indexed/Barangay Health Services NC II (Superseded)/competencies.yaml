        "source_text": "HCS323204\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \\\nrequired to provide an initial response where First Aid\nis required. In this unit it is assumed that the First\nAider is working under supervision and /or according\nto established workplace First Aid procedures and\npolicies.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess\nthe\nsituation\n\n1.1 Physical hazards to self and casualty’s health\nand safety are identified.\n1.2 Immediate risks to self and casualty’s\noccupational health and safety (OSH) are\nminimized\nby\ncontrolling\nthe\nhazard\nin\naccordance with OSH requirements.\n1.3 Casualty’s vital signs and physical condition\nare assessed in accordance with workplace\nprocedures.\n\n2. Apply basic first\naid techniques\n\n2.1 First\nAid\nmanagement\nis\nprovided\nin\naccordance\nwith\nestablished\nFirst\nAid\nprocedures.\n2.2 Casualty is reassured in a caring and calm\nmanner and made comfortable using available\nresources.\n2.3 First Aid assistance is sought from others in a\ntimely manner and as appropriate.\n2.4 Casualty’s\ncondition\nis\nmonitored\nand\nresponded to in accordance with effective.\nFirst\nAid\nprinciples\nand\nworkplace\nprocedures.\n2.5 Details\nof\ncasualty’s\nphysical\ncondition,\nchanges in conditions, management and\nresponse are accurately recorded in line with\norganizational procedures.\n2.6 Casualty management is finalized according to\nhis/her needs and First Aid principles.\n\n--- PDF PAGE 35 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Communicable\ndetails\nof\nthe\nincident\n\n3.1 Appropriate medical assistance is requested\nusing relevant communication media and\nequipment.\n3.2 Details\nof\ncasualty’s\ncondition\nand\nmanagement\nactivities\nare\naccurately\nconveyed to emergency services / relieving\npersonnel.\n3.3 Reports to supervisors are prepared in a\ntimely manner, presenting all relevant facts\naccording\nto\nestablished\ncompany\nprocedures.\n\n--- PDF PAGE 36 ---\n\n--- PDF PAGE 37 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. First Aid\n Management\n\nThis may include but not limited to:\n1.1 Workplace policies and procedures\n1.2 Industry / site specific regulations, codes\n1.3 OSH\n1.4 State and territory workplace health and safety\nrequirements\n1.5 Allergies the casualty may have\n\n2. Physical Hazards\n\nPhysical hazards may include:\n2.1 Workplace hazards\n2.2 Environmental hazards\n2.3 Proximity of other people\n2.4 Hazards associated with casualty management\nprocesses\n\n3. Risks\n\nRisks may include:\n3.1 Worksite\nequipment,\nmachinery\nand\nsubstances\n3.2 Environmental risks\n3.3 Bodily fluids\n3.4 Risk of further injury to the casualty\n3.5 Risk associated with the proximity of the others\nand bystanders\n\n4. Casualty’s\ncondition\n\nCasualty’s condition may include but not limited to the\nfollowing:\n4.1 Abdominal injuries\n4.2 Allergic reactions\n4.3 Bleeding\n4.4 Burns – thermal, chemical, friction, electrical\n4.5 Cardiac conditions\n4.6 Chemical contamination\n4.7 Cod injuries\n\n--- PDF PAGE 38 ---\nVARIABLE\n\nRANGE\n\n4.8 Crush injuries\n4.9 Dislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n\n5. Equipment\nand\nResources\n\nEquipment and other resources may include:\n5.1 Defibrillation units\n5.2 Pressure bandages\n5.3 Thermometers\n5.4 First Aid Kit\n5.5 Eyewash\n5.6 Thermal blankets\n5.7 Pocket face masks\n5.8 Rubber gloves\n5.9 Dressing\n5.10\nSpace device\n5.11\nCervical collars\n\n6. Communication\nsystem\n\n6.1 Mobile phone\n6.2 Satellite phones\n6.3 HF /VHF radio\n6.4 Flags\n6.5 Flares\n6.6 Two-way radio\n6.7 Email\n6.8 Electronic equipment\n\n--- PDF PAGE 39 ---\nVARIABLE\n\nRANGE\n7. Vital signs\n\n7.1 Breathing\n7.2 Circulation\n7.3 Consciousness\n\n8. First\nAid\nPrinciples\n\n8.1 Checking the site for danger to self, casualty\nand others and minimizing the danger\n8.2 Checking and maintaining the casualty’s\nairways, breathing and circulation\n\n--- PDF PAGE 40 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements,\nOSH laws infections control and manual\nhandling procedures and relevant health\nregulations\n1.2\nIdentified physical hazards of the casualty\nand minimized immediate risks\n1.3\nAssessed\nand\nmonitored\nthe\nphysical\ncondition of the casualty\n1.4\nResponded to emergency using basic life\nsupport measures\n1.5\nProvided initial response where First Aid is\nrequired\n1.6\nDealt with complex casualties or incident\n1.7\nPrepared reports to concerned personnel in\na timely manner\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures\n(SOPS)\n2.3\nDealing with confidentiality\n2.4\nKnowledge\nof\nthe\nFirst\nAider’s\nskills\nlimitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material\nsafety data sheets\n\n3.\nUnderpinning\nskills\n\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nPreparing reports\n3.5\nCommunication skills\n3.6\nInterpreting and using listed documents\n\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines\nprocedures and protocol\n4.3\nEquipment and materials relevant to the\nproposed activities\n\n--- PDF PAGE 41 ---\n5.\nMethod\nof\nassessment\n\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird party report\n5.4\nPortfolio\n\n6.\nContext\nof\nassessment\n\n6.1\nAssessment may be done in a workplace or\nsimulated work area setting.\n\n--- PDF PAGE 42 ---\nUNIT OF COMPETENCY: MAINTAIN HIGH STANDARDS OF PATIENT\n SERVICES\nUNIT CODE : HCS323204\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \\\nrequired in the maintenance of high standards of\npatient services.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\n appropriately with\n patients\n\n1.1\nEffective communication strategies and\ntechniques are identified and used to achieve\nbest patient service outcomes.\n1.2\nComplaints are responded to in accordance\nwith organizational policy to ensure best\nservice to patients.\n1.3\nComplaints are dealt with in accordance with\nestablished procedures.\n1.4\nInterpreter services are accessed as required.\n1.5\nAction is taken to resolve conflicts either\ndirectly, where a positive outcome can be\nimmediately achieved, or by referral to the\nappropriate personnel.\n1.6\nParticipation in work team is constructive and\ncollaborative\nand\ndemonstrates\nan\nunderstanding of own role.\n\n2. Establish and\n maintain good\n interpersonal\n relationship with\n patients\n\n2.1 Rapport is established to ensure the service is\nappropriate to and in the best interests of\npatients.\n2.2 Effective listening skills are used to ensure a\nhigh level of effective communication and\nquality of service.\n2.3 Patient concerns and needs are correctly\nidentified and responded to responsibly and\naccordingly\nestablished\nprocedures\nand\nguidelines.\n2.4 Effectiveness of interpersonal interaction is\nconsistently monitored and evaluated to\nensure best patient service outcomes.\n\n--- PDF PAGE 43 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Act in a\n respectful\n manner at all\n times\n\n3.1 Respect for differences is positively, actively\nand consistently demonstrated in all work.\n3.2 Confidentiality and privacy of patient is\nmaintained.\n3.3 Courtesy is demonstrated in all interactions with\npatients, their visitors, carers and family.\n3.4 Assistance with the care of patients with\nchallenging behaviors is provided in accordance\nwith established procedures.\n3.5 Techniques are used to manage and miminize\naggression.\n\n4. Evaluate\nown\nwork to maintain\na high standard\nof patient service\n\n4.1 Advice and assistance is received or sought\nfrom\nappropriate\nsources\non\nown\nperformance.\n4.2 Own\nwork\nis\nadjusted,\nincorporating\nrecommendations that address performance\nissues, to maintain the agreed standard of\npatient support.\n\n--- PDF PAGE 44 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Patients\n\nThis may include but not limited to:\n1.1 Patients\n1.2 Prospective patients to the service or\nservices\n1.3 Patients may be in contact with the institution\nthrough appropriate health care personnel\nand professionals or other advocates or\nagencies\n\n2. Others with whom\ninteraction\nis\nrequired in regard\nto patient services\n\n2.1 Other staff and team members\n2.2 Service units or departments\n2.3 Family members, carers and friends of\npatients\n2.4 Professional representatives or agents of\npatient such as:\n-\nMedical specialist\n-\nNurses\n-\nSocial workers\n-\nDietitians\n-\nTherapists\n-\nAllied health professionals\n-\nVolunteers\n-\nTeachers and/or spiritual\n-\nCommunity\n2.5 General public\n\n3. Communication\n\n3.1 English / Tagalog / Vernacular\n3.2 Sign language\n3.3 Through an interpreter\n3.4 Community language as required by the\nservice / organization\n\n4. Modes\nof\ncommunication:\n\n4.1 Continuing interaction with patients and\nclients\n4.2 Verbal conversations either in person or via\ntelephone\n4.3 Written notes by post or electronic media\n4.4 Worker, family member friend or professional\ninterpreter who has relevant languages\n\n--- PDF PAGE 45 ---\nVARIABLE\n\nRANGE\n\n5. Respect\nfor\ndifference\n5.1 Physical\n5.2 Cognitive / mental or intellectual issues that\nmay impact on communication\n5.3 Cultural and ethnic\n5.4 Religious / spiritual\n5.5 Social\n5.6 Age\n5.7 Language literacy and numeracy abilities\n5.8 Sexuality and sexual preference\n\n6. Confidentiality\nand privacy of\npatients\n\n6.1 Fees\n6.2 Health fund entitlements\n6.3 Welfare entitlements\n6.4 Payment methods and records\n6.5 Public environments\n6.6 Legal and ethical requirements\n6.7 Writing details i.e. medical and consent forms\n6.8 Conversations on the telephone\n6.9 Secure location for written records\n6.10\nOffering a private location for discussions\n6.11\nInformation disclosed to an appropriate\nperson\nconsistent\nwith\none’s\nlevel\nof\nresponsibility\n\n7. Performance\nmonitoring\n\n7.1 Self-monitoring\n7.2 Supervisor assessment\n7.3 Patient feedback\n\n--- PDF PAGE 46 ---\n\n--- PDF PAGE 47 ---\nEVIDENCE GUIDE\n\n1. Critical\naspects\nof competency\n\nAssessment requires evidences that the candidate:\n1.1 Communicated appropriately with patients\n1.2 Handled complaints and resolved conflict, or\nreferred matters to supervisors when required\n1.3 Complied with relevant policies, protocols,\nguidelines and procedures of the organization\n1.4 Establish and maintained good interpersonal\nrelationship with patients\n1.5 Demonstrated courtesy in all interactions with\npatients, their visitors, and family\n\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1 Roles and responsibilities of self and other\nworkers within the organization\n2.2 When client / patient issues need to be\nreferred to an appropriate health professional\n2.3 Organizational policies and procedures for\nprivacy and confidentiality of information\nprovided by patients and others\n2.4 Knowledge of cultures relevant to the particular\nservice\n2.5 Institutional policy on patient rights and\nresponsibilities\n\n3. Underpinning\nskills\n\n3.1 Establishing and maintaining relationships,\ntaking into account individual differences\n3.2 Using effective listening techniques\n3.3 Using appropriate verbal and non verbal\ncommunication styles\n3.4 Interpreting and following the instructions and\nguidance of health professionals involved with\nthe care of patients / clients\n3.5 Oral and written communication\n3.6 Problem solving skills required include the\nability to use available resources and prioritize\nworkload\n3.7 Dealing with conflict\n3.8 Working with others and displaying empathy\nwith patient and relatives\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place.\n\n--- PDF PAGE 48 ---\n4.2 Relevant government and organizational policy\nguidelines, procedures and protocols\n4.3 Any relevant legislation in relation to service\ndelivery\n\n5. Method\nof\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Interview\n5.3 Third party report\n\n6. Context\nof\nassessment\n\n6.1 Assessment may be done in a simulated\nworkplace setting\n\n--- PDF PAGE 49 ---\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : WORK WITHIN THE COMMUNITY\n DEVELOPMENT FRAMEWORK\nUNIT CODE :"
