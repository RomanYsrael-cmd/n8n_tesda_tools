elation to service \ndelivery \n \n5. Method \nof \nassessment \n \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Interview \n5.3 Third party report \n \n6. Context \nof \nassessment \n \n6.1 Assessment may be done in a simulated \nworkplace setting",
