          "source_text": "1. Outline terms of  \n      placement \nwith \nclient  in care \n \n1.1 \nWhere appropriate, explanations are \neffectively communicated to clients \nabout what they can expect from the \nplacement;  the philosophies, values \nand rules operating;  opportunities \nwithin the placement , and strategies \nfor \nmaximizing \nbenefits \nof \nthe \nplacement. \n1.2 \nThe boundaries of confidentiality are \nclarified with the client \n1.3 \nProcesses \nfor \nresolving \nissues, \nreviewing placement and the external \nand internal grievance procedures are \ncommunicated \nin \nappropriate \nlanguage and approach \n1.4 \nUnderstanding of client rights and \nexpectations about direct care is \nexplored and clarified \n1.5 \nRules \nand \nconsequences \nfor \nbehaviour \nare \nexplained, \nand \nnegotiated where appropriate with \nclient in ways that are understandable \nand culturally appropriate \n1.6 \nAll \nrelevant \ndocumentation \nis \ncompleted \nand \nmaintained \nin \naccordance \nwith \norganizational \nprocedures. \n \n2. Provide \n/ \nmobilize \ndomestic support \n \n2.1 \nWays of addressing daily needs are \nprovided for and negotiated with client \n2.2 \nAll \nappropriate \nprocedures \nare \nimplemented \nto \nensure \nthe \nenvironment is clean, healthy and \nsafe\n\n--- PDF PAGE 69 ---\nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n \n2.3 \nAppropriate strategies are negotiated \nfor the continued use, maintenance \nand/or \ndisposal \nof \npersonal \npossessions of the client \n \n3. Provide \nfor \nclient \neducation, \nsupport \nand development \n \n3.1 \nA range of approaches to life skills \ntraining, \nincluding \nprovision \nof \npositive role models is implemented \nto ensure client’s specific needs are \naddressed. \n3.2 \nAssistance is provided to the client to \nidentify and implement appropriate \ngoals, strategies and activities so their \nmoves \nto \nautonomy \nand \nself \nempowerment is enhanced. \n3.3 \nAppropriate arrangement are made to \nsupport client in care to undertaken \nrelevant vocational training and/or \nemployment. \n3.4 \nAppropriate processes for provision of \nhealth care education are negotiated \nwith \nrelevant \nreferral \nagency/ \norganization/ department to ensure \ntheir delivery. \n3.5 \nAppropriate processes are negotiated \nwith client and relevant personnel to \nensure client access to a range of \nemotional, social and physical support \nmechanisms \n3.6 \nAppropriate relationship is established \nwith client to ensure maximum access \nto development opportunities and \nparticipation in a range of services.\n\n--- PDF PAGE 70 ---\nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n4. Contribute to  \n      reintegration of client \n \n4.1 \nPlanning for resources, services and \nongoing support are negotiated with \nthe client and significant others to \nensure \nresettlement \nneeds \nare \nassessed and addressed. \n4.2 \nArrangements \nfor \nparticipation \nin \nemployment, counseling, education \nand accommodation are made with \nrelevant parties are appropriate \n4.3 \nAll \nrelevant \navailable \nactivities, \ndesigned \nto \nassist \na \nsuccessful \ntransition from care, are undertaken \n4.4 \nNegotiations are undertaken with all \nrelevant parties to identify appropriate \nlevels of contact with client, once out \nof care\n\n--- PDF PAGE 71 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \n \nRANGE \n1. \nOutline \nterms \nof \nplacement \nwith \nclient in  care \n \n \nMay include: \n1.1 On the selection and implementation of \nan intervention either on a voluntary or \ninvoluntary basis \n1.2 A voluntary seeking for support outside \nof statutory mandates \n1.3 A preventative pro-active activity \n1.4 Government, \nnon-government \nand \ncommunity based range of services \n \n2. \nProvision of positive \nrole models   \n \nUndertaken within requirements established by: \n2.1 State and national legislation \n2.2 Organization processes, procedures and \nstandards \n2.3 Organizational codes of conduct and \nethical position \n2.4 International conventions on the rights of \nchildren and young people\n\n--- PDF PAGE 72 ---"
