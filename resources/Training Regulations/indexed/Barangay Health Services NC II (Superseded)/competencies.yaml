 the continued use, maintenance \nand/or \ndisposal \nof \npersonal \npossessions of the client \n \n3. Provide \nfor \nclient \neducation, \nsupport \nand development \n \n3.1 \nA range of approaches to life skills \ntraining, \nincluding \nprovision \nof \npositive role models is implemented \nto ensure client’s specific needs are \naddressed. \n3.2 \nAssistance is provided to the client to \nidentify and implement appropriate \ngoals, strategies and activities so their \nmoves \nto \nautonomy \nand \nself \nempowerment is enhanced. \n3.3 \nAppropriate arrangement are made to \nsupport client in care to undertaken \nrelevant vocational training and/or \nemployment. \n3.4 \nAppropriate processes for provision of \nhealth care education are negotiated \nwith \nrelevant \nreferral \nagency/ \norganization/ department to ensure \ntheir delivery. \n3.5 \nAppropriate processes are negotiated \nwith client and relevant personnel to \nensure client access to a range of \nemotional, social and physical support \nmechanisms \n3.6 \nAppropriate relationship is established \nwith client to ensure maximum access \nto development opportunities and \nparticipation in a range of services.\n\n--- PDF PAGE 70 ---\nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n4. Contribute to  \n      reintegration of client \n \n4.1 \nPlanning for resources, services and \nongoing support are negotiated with \nthe client and significant others to \nensure \nresettlement \nneeds \nare \nassessed and addressed. \n4.2 \nArrangements \nfor \nparticipation \nin \nemployment, counseling, education \nand accommodation are made with \nrelevant parties are appropriate \n4.3 \nAll \nrelevant \navailable \nactivities, \ndesigned \nto \nassist \na \nsuccessful \ntransition from care, are undertaken \n4.4 \nNegotiations are undertaken with all \nrelevant parties to identify appropriate \nlevels of contact with client, once out \nof care\n\n--- PDF PAGE 71 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \n \nRANGE \n1. \nOutline \nterms \nof \nplacement \nwith \nclient in  care \n \n \nMay include: \n1.1 On the selection and implementation of \nan intervention either on a voluntary or \ninvoluntary basis \n1.2 A voluntary seeking for support outside \nof statutory mandates \n1.3 A preventative pro-active activity \n1.4 Government, \nnon-government \nand \ncommunity based range of services \n \n2. \nProvision of positive \nrole models   \n \nUndertaken within requirements established by: \n2.1 State and national legislation \n2.2 Organization processes, procedures and \nstandards \n2.3 Organizational codes of conduct and \nethical position \n2.4 International conventions on the rights of \nchildren and young people\n\n--- PDF PAGE 72 ---\nEVIDENCE GUIDE \n \n1. Critical aspects of  \n      competency \n \nAssessment \nrequires \nevidence \nthat \nthe \ncandidate: \n1.1 \nNegotiated \neffective \ncare \narrangements, \nrights \nand \nresponsibilities \n1.2 \nProvided a range of care services \n1.3 \nProvided \nopportunities \nfor \npositive \nexperiences, client self development \nand self esteem building \n1.4 \nDemonstrated knowledge related to \napplicable organization and legislative \nrequirements \n \n2. Underpinning \nknowledge and \nattitudes \n \n2.1 \nRelevant \nstatutory \nprocedures, \nresponsibilities and rights \n2.2 \nService protocols, philosophies and \nprocesses \n2.3 \nResources and programs available \n2.4 \nStage of grief \n2.5 \nImpact and signs of abuse \n2.6 \nCultural protocols, systems, taboos \n2.7 \nParenting models \n2.8 \nBudgeting practices \n2.9 \nProtocols in working with professional \nservice providers \n2.10   Child development stages / models \n3. Underpinning skills \n \n3.1 \nEffective communication \n3.2 \nBehaviour management \n3.3 \nStress management \n3.4 \nInterpersonal, including: \n- \nAssertion \n- \nNegotiation \n-    Establishing role boundaries \n4. Resource implications \n \nThe following resources MUST be provided: \n4.1 \nAccess to an appropriate workplace or \nan environment capable of accurately \nsimulating \nthe \nworkplace \nfor \nassessment purposes.\n\n--- PDF PAGE 73 ---\n5.    Method of \nassessment \n \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n5.3 \nOral questioning/Interview \n \n5. Context of  \nassessment \n \n6.1   Competency may be assessed in the \nworkplace or in a simulated work setting.\n",
