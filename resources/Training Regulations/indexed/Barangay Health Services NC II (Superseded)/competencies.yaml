        "source_text": "HCS323202\nUNIT DESCRIPTOR : This unit is concerned with infection control\n responsibilities of employees with supervisory\n accountability to implement and monitor infection\n control policy and procedures in a specific work unit\n or team within an organization. This unit does not\n apply to a role with organization-wide responsibilities\n for infection control policy and procedure\n development, implementation or monitoring.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\nProvide\ninformation\nto\nthe work group\nabout\nthe\norganization’s\ninfection control\npolicies\nand\nprocedures\n\n1.1\nRelevant\ninformation\nabout\nthe\norganization’s infection control policy and\nprocedures, and applicable industry codes of\npractice are accurately and clearly explained\nto the work group.\n1.2\nInformation about identified hazards and the\noutcomes of infection risk assessments is\nregularly provided to the work group.\n1.3\nOpportunity is provided for the work group to\nseek\nfurther\ninformation\non\nworkplace\ninfection control issues and practices.\n\n2.\nIntegrate\nthe\norganization’s\ninfection control\npolicy\nand\nprocedure\ninto\nwork practices\n\n2.1\nInfection control policy and procedures are\nimplemented by supervisor and members of\nthe work group.\n2.2\nLiaison\nis\nmaintained\nwith\nperson\nresponsible for organization-wide infection\ncontrol.\n2.3\nThe supervisor’s coaching support ensures\nthat individuals/teams are able to implement\ninfection control practices.\n2.4\nWork procedures are adopted to reflect\nappropriate infection control practices.\n\n--- PDF PAGE 24 ---\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n2.5\nIssues raised through consultation are dealt\nwith and resolved promptly or referred to the\nappropriate personnel for resolution.\n2.6\nWorkplace procedures for dealing with\ninfection control risks and hazardous events\nare implemented whenever necessary.\n2.7\nEmployees\nare\nencouraged\nto\nreport\ninfection.\n\n3.\nMonitor infection\ncontrol\nperformance\nand\nimplement\nimprovements in\npractices\n\n3.1\nInfection control hazardous events are\ninvestigated promptly to identify their cause\nin accordance with organization policy and\nprocedures.\n3.2\nWork procedures to control infection risks\nare monitored to ensure compliance.\n3.3\nWork procedures are regularly reviewed and\nadjusted to ensure improvements in infection\ncontrol practice.\n3.4\nSupervisor provides feedback to team and\nindividuals on compliance issues, changes in\nwork\nprocedures\nand\ninfection\ncontrol\noutcomes.\n3.5\nTraining in work procedures is provided as\nrequired to ensure maintenance of infection\ncontrol standards.\n3.6\nInadequacies\nin\nwork\nprocedures\nand\ninfection control measures are identified,\ncorrected\nor\nreported\nto\ndesignated\npersonnel.\n3.7\nRecords of infection control risks and\nincidents are accurately maintained as\nrequired.\n3.8\nAggregate infection control information\nreports are used to identify hazards, to\nmonitor an improve risk control methods and\nto indicate training needs.\n\n--- PDF PAGE 25 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1.\nInfection\nControl\nPolicies\nand\nProcedures\n\nThis may include but not limited to:\n1.1 Cleaning procedures and schedules\n1.2 Cleaning agents\n1.3 Cleaning equipment\n1.4 Handling, storage and disposal of all types of\nwaste\n1.5 Food handling and food safety\n1.6 Hygiene procedures\n1.7 Infection control risk management\n1.8 Infection control incident and hazard reporting\n1.9 Sterilizing\n1.10\nLinen production and handling\n1.11\nMaintenance procedures\n1.12\nStorage requirements\n1.13\nPersonal protective clothing\n1.14\nWork flows\n1.15\nManagement of blood and body fluid\nspills\n1.16\nSingle use of disposables\n1.17\nAseptic techniques\n1.18\nSkin preparation procedures\n1.19\nImmunization\n1.20\nNeedle stick injuries\n1.21\nPersonal contact with infectious patients\n1.22\nStandard and additional precautions\n1.23\nConfidentiality\n1.24\nEmployee training\n1.25\nContractors\n\n2.\nIndustry\nCodes\nof\nPractice\n\n2.1 National Health and Medical Research Council\nGuidelines for infection control\n2.2 Local and National Government Guidelines\nand Standards\n2.3 Manufacturer’s\nrecommendations\nand\noperating manuals\n\n--- PDF PAGE 26 ---\nVARIABLE\n\nRANGE\n\n3.\nIdentified\nhazards\nand\nthe outcomes\nof\ninfection\nrisk\nassessment\n3.1 Sharps\n3.2 Glass\n3.3 Waste\n3.4 Human waste and human tissues\n3.5 Personal contact with infectious patients\n3.6 Animals, insects and vermin\n3.7 Stock, including food, which has passed “used-\nby” dates.\n3.8 Incorrect concentration of disinfectants and\nchemicals\n3.9 Cleaning procedures\n3.10\nLinen handling procedures\n3.11\nWork flows\n3.12\nUse of personal protective clothing\n3.13\nFood safety\n3.14\nPersonal hygiene\n\n4.\nInfection\nControl\nMonitoring\nProcedures\n\n4.1 Observations\n4.2 Interviews\n4.3 Surveys and inspections\n4.4 Quality assurance activities\n4.5 Review of outcomes\n4.6 Data analysis\n\n5.\nDesignated\npersonnel\n\n5.1 Manager\n5.2 Infection Control Coordinator\n5.3 Quality Improvement Coordinator\n5.4 Infection Control Committee\n5.5 Occupational Health and Safety Committee\n\n6.\nAggregate\ninfection\ncontrol\ninformation\n\n6.1 Records of needle stick injuries\n6.2 Hospital-acquired infection rates\n6.3 DOH healthcare standards clinical indicators\n6.4 HACCP records\n6.5 Hazard reports\n\n--- PDF PAGE 27 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate\n1.1\nCommunicated with team and individuals on\norganizational policy and procedures for\ninfection control\n1.2\nApplied\ninfection\ncontrol\npolicies\nand\nprocedures which impact on work processes\nof the specific work unit\n1.3\nApplied procedures for adopting appropriate\ninfection practices within work unit\n1.4\nProvided appropriate supervision of work\ngroup\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nWorking knowledge, consistent with the\nelements\nof\ncompetence,\nof\nthe\norganization’s applicable infection control\npolicy and procedures and relevant industry\ncodes of practice\n2.2\nThe hierarchy risk control measures from\nmost to least preferred, that is, elimination,\nengineering controls, administrative control,\nand lastly, personal protective equipment\n2.3\nKnowledge of infection risks and control\nmeasures in specific work unit and related\nwork processes\n2.4\nThe significance of patient confidentiality in\nrelation to infection control\n2.5\nThe significance of other management\nsystems and procedures for infection control\n2.6\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n2.7\nOrganizational procedures for monitoring,\ntraining\n2.8\nBasic\nunderstanding\nof\ncommunicable\ndisease transmission\n3.\nUnderpinning\nskills\n\n3.1\nEffective communication and interpersonal\nskills including:\n-\nlanguage competence\n-\nliteracy and reading competence\n3.2\nNegotiation\n3.3\nWork planning and management\n3.4\nManaging change of work processes\n\n--- PDF PAGE 28 ---\n3.5\nMonitoring\ncompliance\nwith\npolicy\nand\nprocedures\n3.6\nMaintaining and interpreting infection control\nrecords\n\n4.\nResource\nImplications\n\nThe following resources MUST be provided:\n4.1\nWorkplace infection control and health and\nsafety policies and procedures\n4.2\nWaste management procedures\n4.3\nFood safety procedures\n4.4\nOther organizational policies and procedures\n4.5\nDuties statements and/or job descriptions\n\n5.\nMethod\nof\nassessment\n\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n5.3\nPortfolio\n5.4\nDemonstration with questioning\n\n6.\nContext\nof\nassessment\n\n6.1\nAssessment may be done in the workplace\nor in a simulated workplace setting.\n\n--- PDF PAGE 29 ---\nUNIT OF COMPETENCY: RESPOND EFFECTIVELY TO DIFFICULTY /\n CHALLENGING BEHAVIOR\nUNIT CODE :"
