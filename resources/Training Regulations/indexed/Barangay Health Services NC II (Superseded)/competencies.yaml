          "source_text": "1. Access industry \ninformation and \napplicable \nlegislative \nguidelines \n \n1.1 A range of legislation and procedural \nrequirements relevant to employment in \nthe community services industry is \naccessed. \n1.2 Key community services industry \norganizations able to provide information \nand assist individuals and enterprise are \nidentified. \n1.3 Various roles are identified and current \nknowledge reflects an understanding of \nemployee and employer rights and \nresponsibilities. \n1.4 Own conduct and/or demonstrate a \ncommitment to comply with applicable \nlegislative and procedural \nrequirements. \n \n2. Identify future career / \noccupations \nopportunities in the \ncommunity. \n \n2.1 Key industry sectors and possible career \ndirections in the services industry or \norganization are identified and discussed \nwith appropriate persons. \n2.2 Personal values and attitudes regarding \nwork and business are taken into account \nwhen planning future work / career \ndirections.\n\n--- PDF PAGE 57 ---\nELEMENT \nPERFORMANCE CRITERIA  \nItalicized terms are elaborated in the Range of \nVariables \n \n \n \n \n \n2.3   Current skills and knowledge are   \n        assessed against a checklist of target  \n        competencies. \n2.4   Opportunities for additional skills are  \n        identified in consultation with appropriate  \n        persons. \n3. Work in a team at all \ntimes \n \n3.1 Courteous and helpful manner is    \n        displayed at all times. \n3.2 Allocated tasks are completed as required \n3.3 Assistance is sought when difficulties \narise \n3.4 Questioning is used to clarify instructions \nor responsibilities \n3.5 Non discriminatory attitude is identified \nand displayed \n3.6 Work \nand \npersonal \npriorities \nare \nidentified \nand \na \nbalance \nachieved \nbetween competing priorities \n3.7 Time management strategies are applied \nto work duties \n3.8 Appropriate dress and behaviour are \nobserved in the workplace.\n\n--- PDF PAGE 58 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n \n1. Applicable legislation,  \n     codes, legislation and  \n     national standards of  \n     operation \n \nMay include but not limited to: \n1.1. Occupational Health and Safety \n1.2. Equal employment opportunity \n1.3. Industrial relations \n1.4. Anti-discrimination and diversity \n1.5. Relevant industry Code of Practice \n1.6. Award and enterprise agreements \n2. \nIndustry \nprocedures \nmay \ninvolve legislation \nrelating to: \n \nMay involve legislation relating to: \n2.1  Duty of care \n2.2  Emergency and evacuation procedures \n2.3  Privacy \n2.4  Workplace practices \n2.5  Human and civil rights \n3. \nRights and  \n           responsibilities of  \n           employees  \n \nMay relate to: \n3.1 Obeying lawful orders \n3.2 Confidentiality and privacy rights \n3.3 Safety and care with respect to Occupational \nHealth and Safety requirements \n3.4 Knowing the terms and conditions of own \nemployment\\ \n3.5 Protection from discrimination and sexual \nharassment \n4. \nAppropriate \npersons  \n \nMay include: \n4.1  Supervisors \n4.2  Colleagues \n4.3  Trainer \n4.4  Assessor \n      5.     Opportunities for  \n              additional \nskills  \n \nMay include: \n5.1 Coaching, mentoring and/or supervision \n5.2 Formal/informal learning programs  \n5.3 Internal/external training provision \n5.4 Work experience/exchange opportunities \n5.5 Personal study \n5.6 Career planning / development \n5.7 Workplace skills assessment \n5.8 Quality \nassurance \nassessments \nand \nrecommendation \n5.9 Recognition of Prior Learning assessment \n5.10. Recognition of Current Competency  \n          assessment\n\n--- PDF PAGE 59 ---\nVARIABLE \n \nRANGE \n \n6. \nNo \ndiscriminatory  \nattitudes   \n \nMay include: \n6.1 \nAll contacts with other staff, clients or \nmanagement \n6.2 \nVerbal or non verbal communication \n \n7. \nWork \nand \npersonal \npriorities related to work \n/ life balance and may \ninclude work and other \ncommitments  \n \nMay include: \n7.1 School / homework \n7.2 Home / family / parties / friends \n7.3 Other jobs \n7.4 Culture \n7.5 Disability \n8. \nAppropriate dress and \nbehaviour relate to: \n \nRelate to: \n8.1 Personal dress, presentation and hygiene \n8.2 Demeanor in the workplace and attitude \ndisplayed to customers and other team \nmembers \n8.3 Organization requirements \n8.4 Type of work \n8.5  Degree of client / customer contact \n9. \nBehaviour which  \n        contributes to a safe  \n        work environment \n \n9.1 \nDiscussion and negotiating problems and \ntasks with other team members \n9.2 \nSharing knowledge and skills \n9.3 \nIdentifying and reporting any risks or \nhazards \n9.4 \nUsing business equipment according to \ninstructions\n\n--- PDF PAGE 60 ---"
