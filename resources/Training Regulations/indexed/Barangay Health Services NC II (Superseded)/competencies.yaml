          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Provided a range of types of support to\ncommunities\naccording\nto\norganizational\nprocedures\n1.2 Communicated with a range of people in the\ncommunity\n1.3 Maintained and accessed effective networks\nwhich contribute to the achievement of\nobjectives\n1.4 Motivated individuals and groups to work\ncooperatively to address common concerns\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Nature of the community and significant\nrelationships and resources including\ncultural program / service objectives\n2.2 Relevant agencies programs and criteria\n2.3 Communication strategies\n2.4 Principles of social organization and\nstructures\n2.5 Depending on the work role or services\nprovided specific knowledge of particular\ngroups or issues may be required,\nincluding:\n-\nAlcohol and other drugs\n-\nCultural and linguistic diversity\n-\nRisk of self harm\n-\nWomen\n-\nMen\n-\nCommunity education\n-\nMental health\n\n--- PDF PAGE 67 ---\n3. Underpinning skills\n\n3.1 Oral communication competence\n3.2 Asking questions, listening to\ninformation, and seeking clarification\n3.3 Reading competence required if worker\nis using pamphlets or written information,\nto determine if an organization or service\nis relevant to a particular group\n3.4 Writing skills will be needed if\norganizations require a written list of\ncommunity facilities and resources\n3.5 Documenting what is required by the\norganization\n3.6 Encoding skills\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Access to a workplace or community or an\nenvironment that effectively simulates\nworkplace or community conditions.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 68 ---\nUNIT OF COMPETENCY : PROVIDE PRIMARY / RESIDENTIAL CARE\nUNIT CODE :"
        },
        "source_text": "HCS346303\nUNIT DESCRIPTOR : This unit applies to the work performed in providing\n and maintaining support to community groups.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1.\nDevelop an\n information base of\n community\n resources\n\n1.1 Relevant\ninformation\nabout\nthe\ncommunity,\nits\norganizations\nand\nservices\nis\ncollected\nand\nstored\naccording\nto\nthe\norganizational\npractices so ongoing work is facilitated.\n1.2\nA\ncurrent\ndirectory\nof\ncommunity\nresources is maintained so it is useable\nand accessible.\n2.\nEstablish\nrelationship with key\npeople\n\n2.1 Appropriate contact is established and\nmaintained with key people using a\nrange of communication strategies to\nensure that the outcomes from work in\nthe community is maximized.\n2.2 The roles and responsibilities of key\npeople and services are defined so that\nwork is effective and coordinated.\n3.\nApply strategies for\nlinking people\n\n3.1 Appropriate work is undertaken to create\nopportunities\nto\ndevelop\nsupportive\nconnections\nbetween\nkey\npeople\nincluding\narranging\nand\nconducting\nmeetings.\n3.2 Obstacles to effective contact between\npeople are identified and appropriate\nstrategies are developed to overcome\nthese.\n3.3 Appropriate levels of ongoing support is\nprovided\nto\npromote\ncommunity\ninteraction.\n\n--- PDF PAGE 63 ---\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n4.\nMaintain community\nfacilities\nand\nresources\n\n4.1 All relevant records are maintained and\nmake available as required to facilitate\ncommunity interaction.\n4.2 Appropriate\nwork\nis\nundertaken\nto\nensure that maintenance of community\nresources is carried out according to\nagreed\nprocedures\nand\nbudget\nallocations.\n4.3 Appropriate action is taken to ensure\npublic\nand\ncommunal\nareas\nare\naccessible and meet community needs.\n\n--- PDF PAGE 64 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Community\n\nMay include:\n1.1 Individuals and groups defined by\n organization programs and services\n1.2 Other agencies providing services to\n individuals and groups\n1.3 People with specified needs and interests\n1.4 People using the organization’s services /\n programs\n2. Relevant information\nabout the community\n\nMay include:\n2.1 Composition and social / cultural profile\n2.2 Cultural characteristics\n2.3 Scope defined by organization’s objectives\nand priorities\n2.4 Size\n2.5 Nature and history of issues and interests\n2.6 Range and nature of other services\n2.7 Existing practice, process and protocol\n2.8 Data base of key people\n2.9 Details of other services / agencies\n2.10 Networks, support systems, groups\n2.11 Resources\n2.12 Protocols for communication\n3. Key people\n\nMay include:\n3.1 People with an interest in the purpose of the\norganization\n3.2 Designated groups in the community\n3.3 Community leaders, representatives\n3.4 Other providers\n3.5 People using the services of the organization\n3.6 Specialist providers\n\n--- PDF PAGE 65 ---\nVARIABLE\n\nRANGE\n4. Communication\nstrategies\n\n4.1 Attending meetings, groups. Shift hand over.\n4.2 Phone contact\n4.3 Sharing information\n4.4 Information newsletter\n4.5 Premises,\ngrounds,\naccommodation,\nworkplace\n4.6 Purpose designed and provided for the\ncommunity or workplace\n4.7 Exclusive use, ownership or shared of\nequipment and materials\n4.8 Information\n4.9 Personnel\n4.10 Financial\n\n 5. Organization’s\nprocedures\n\nMay include:\n5.1 Formally documented policies, guidelines,\ndelegations, philosophy\n5.2 Direction through supervision\n5.3 Management decisions, directives\n5.4 Information,\ndata\ncollection,\nproforma,\nreporting requirements\n5.5 Formal and informal negotiated agreement\n\n--- PDF PAGE 66 ---\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Provided a range of types of support to\ncommunities\naccording\nto\norganizational\nprocedures\n1.2 Communicated with a range of people in the\ncommunity\n1.3 Maintained and accessed effective networks\nwhich contribute to the achievement of\nobjectives\n1.4 Motivated individuals and groups to work\ncooperatively to address common concerns\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Nature of the community and significant\nrelationships and resources including\ncultural program / service objectives\n2.2 Relevant agencies programs and criteria\n2.3 Communication strategies\n2.4 Principles of social organization and\nstructures\n2.5 Depending on the work role or services\nprovided specific knowledge of particular\ngroups or issues may be required,\nincluding:\n-\nAlcohol and other drugs\n-\nCultural and linguistic diversity\n-\nRisk of self harm\n-\nWomen\n-\nMen\n-\nCommunity education\n-\nMental health\n\n--- PDF PAGE 67 ---\n3. Underpinning skills\n\n3.1 Oral communication competence\n3.2 Asking questions, listening to\ninformation, and seeking clarification\n3.3 Reading competence required if worker\nis using pamphlets or written information,\nto determine if an organization or service\nis relevant to a particular group\n3.4 Writing skills will be needed if\norganizations require a written list of\ncommunity facilities and resources\n3.5 Documenting what is required by the\norganization\n3.6 Encoding skills\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Access to a workplace or community or an\nenvironment that effectively simulates\nworkplace or community conditions.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 68 ---\nUNIT OF COMPETENCY : PROVIDE PRIMARY / RESIDENTIAL CARE\nUNIT CODE :"
