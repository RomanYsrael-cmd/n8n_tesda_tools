        "source_text": "500311107\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n in promoting career growth and advancement.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\nIntegrate\npersonal\nobjectives with\norganizational\ngoals\n\n1.1\nPersonal growth and work plans are pursued\ntowards improving the qualifications set for\nthe profession.\n1.2\nIntra-and\ninterpersonal\nrelationships\nare\nmaintained in the course of managing oneself\nbased on performance evaluation.\n1.3\nCommitment to the organization and its goal\nis demonstrated in the performance of duties.\n\n2.\nSet and meet\nwork priorities\n\n2.1\nCompeting\ndemands\nare\nprioritized\nto\nachieve personal, team and organizational\ngoals and objectives.\n2.2\nResources\nare\nutilized\nefficiently\nand\neffectively to manage work priorities and\ncommitments.\n2.3\nPractices\nalong\neconomic\nuse\nand\nmaintenance of equipment and facilities are\nfollowed as per established procedures.\n\n3.\nMaintain\nprofessional\ngrowth\nand\ndevelopment\n\n3.1\nTrainings and career opportunities are\nidentified and availed of based on job\nrequirements.\n3.2\nRecognitions are sought / received and\ndemonstrated\nas\nproof\nof\ncareer\nadvancement.\n3.3\nLicenses and/or certifications relevant to\njob and career are obtained and renewed.\n\n--- PDF PAGE 15 ---\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Evaluation\n\n1.1 Performance Appraisal\n1.2 Psychological profile\n1.3 Aptitude Tests\n\n2. Resources\n\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1. Hardware\n2.3.2. Software\n\n 3. Trainings and\n career\n opportunities\n\n3.1 Participation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n\n 4. Recognitions\n\n4.1 Recommendations\n 4.2 Citations\n 4.3 Certificate of Appreciation\n 4.4 Commendations\n 4.5 Awards\n 4.6 Tangible and Intangible Rewards\n\n 5. Licenses and/or\n certifications\n\n 5.1 National Certificates\n 5.2 Certificate of Competency\n 5.3 Support Level Licenses\n 5.4 Professional Licenses\n\n--- PDF PAGE 16 ---\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas\n(KRAs)\n1.2\nMaintained\nintra-\nand\ninterpersonal\nrelationship in the course of managing\noneself based on performance evaluation\n1.3\nCompleted\ntrainings\nand\ncareer\nopportunities which are based on the\nrequirements of the industries\n1.4\nAcquired and maintained licenses and/or\ncertifications according to the requirement\nof the qualification\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nWork values and ethics (Code of Conduct,\nCode of Ethics, etc.)\n2.2\nCompany policies\n2.3\nCompany-operations,\nprocedures\nand\nstandards\n2.4\nFundamental rights and work including\ngender sensitivity\n2.5\nPersonal hygiene practices\n\n3.\nUnderpinning\nskills\n\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and interpersonal skills\n3.3\nCommunication skills\n\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies / scenarios\n\n5.\nMethod of\nassessment\n\nCompetency may be assessed through:\n 5.1 Portfolio Assessment\n 5.2 Interview\n 5.3 Simulation / Role-plays\n 5.4 Observation\n 5.5 Third Party Reports\n 5.6 Exams and Tests\n\n6.\nContext of\n assessment\n\n6.1 Competency may be assessed in the workplace\nor in a simulated work place setting\n\n--- PDF PAGE 17 ---\nUNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND\n SAFETY PROCEDURES\nUNIT CODE :"
