        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1\nVolunteer recruitment and coordination\nmeets\nboth\nthe\nneeds\nof\nthe\norganization and support requirements\nfor volunteer roles\n\n2. Underpinning\nknowledge\nand\nattitudes\n\n2.1\nThe impact of cultural community\nattitudes\non\nappropriate\nroles,\nrelationships and approaches of the\nvolunteer worker\n2.2\nThe implications of differences in\nattitudes and values in working in the\nagency\n2.3\nRelevant legislation and public policies\nrelating to the employment of unpaid\nworkers\n\n3. Underpinning skills\n\n3.1\nCoordination of people, processes and\ninformation\n3.2\nProvision of support to a diverse range\nof people\n3.3\nConflict resolution / negotiation and\nmediation\n3.4\nCross cultural communication and\nnegotiation\n3.5\nVerbal and written communication\n\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1\nAccess to appropriate workplace or\ncommunity where assessment can\ntake place; or\n4.2\nSimulation of realistic workplace or\ncommunity setting for assessment\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n5.4 Portfolio\n6. Context of\nassessment\n\n6.1\nCompetency may be assessed in the\nworkplace or in a simulated work\nsetting.\n\n--- PDF PAGE 82 ---\nUNIT OF COMPETENCY : RESPOND HOLISTICALLY TO CLIENT ISSUES\nUNIT CODE :"
