        "evidence_guide": {
          "source_text": "1. Critical aspects of\n competency\n\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate:\n1.1 Interpreted various roles in the organization\nparticularly on processes and procedures\n1.2 Accessed, interpreted and complied with a\nrange\nof\nlegislative\nand\nprocedural\nrequirements\n1.3Developed\neffective\nand\npersonal\nrelationships through the application of\norganizational social, ethical and operational\nstandards\nand\nuse\nof\nappropriate\ninterpersonal styles and techniques\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Legislation,\nregulations\nand\ncodes\nor\npractice applicable to specific community\nservices functions.\n2.2 Types\nof\ncommunity\nservices\nand\norganizations and functions\n2.3 Terms and conditions of employment\n2.4 Workplace communication channels and\nprocedures\n2.5 Principles of effective communication\n2.6 OHS issues and requirements\n2.7 Approaches to work in the industry and a\n range of activities which support this\n2.8 Holistic and client-centered care\n2.9 Client needs and rights including duty of care\n2.10 Principles of access and equity\n2.11 Current issues facing clients and the sector\n2.12 Basic knowledge responsibilities in relation\nto child protection\n2.13 Awareness of own biases and beliefs\n2.14 Limitations of work role and responsibilities\n3. Underpinning skills\n\n3.1 Communicating in a clear and concise\nmanner in both written and verbal modes\n3.2 Requesting advice or further information\n3.3 Seeking and receiving feedback\n3.4 Working on an individual basis and within a\nteam\n3.5 Using information technology appropriate to\nspecific talk\n3.6\nSourcing,\norganizing\nand\nrecording\ninformation\n3.7 Processing workplace documentation\n3.8 Estimating time to complete activities and\n\n--- PDF PAGE 61 ---\nprioritizing task\n3.9 Relating to people from a range of social,\ncultural and ethnic backgrounds and varying\nphysical and mental abilities\n3.10 Identifying work requirements and process\nbasic relevant workplace documentation\n3.11 Requesting advice, receiving feedback and\nworking with a team\n3.12 Solving routine problems related to the\nworkplace under direct supervision\n3.13 Relating to people from a range of social,\ncultural, ethnic backgrounds and physical and\nmental abilities\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 Access to a suitable venue and equipment\n4.2 Assignment instructions, work plans and\nschedules,\npolicy\ndocuments\nand\nduly\nstatements\n4.3 Assessment instruments, including personal\nplanner and assessment record book\n4.4 Access to registered provider of assessment\nservices\n5. Method of assessment Competency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Observation with questioning\n5.3 Oral questioning/Interview\n5.4 Portfolio\n6. Context of\nassessment\n\n6.1 Competency may be assessed in the\nworkplace or in a simulated work setting.\n\n--- PDF PAGE 62 ---\nUNIT OF COMPETENCY : SUPPORT COMMUNITY RESOURCES\nUNIT CODE :"
