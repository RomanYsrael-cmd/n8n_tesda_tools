        "evidence_guide": {
          "source_text": "1. Critical aspects of  \n      competency \n \nAssessment \nrequires \nevidence \nthat \nthe \ncandidate: \n1.1 Matched \neducation \nactivities \nwith \ncommunity needs and priorities \n1.2 Collaborated and consulted with key  \n        people and organizations \n1.3 Delivered \nhigh \nquality \ninnovative \neducational projects \n \n2. Underpinning \nknowledge \nand \nattitudes \n \n2.1 Needs assessment and analysis \n2.2 Goals and objectives for project selected \n2.3 Resource \navailability \nfor \nparticular \nprojects \n2.4 Strategies and actions needed to achieve \ngoals \n2.5 Organizational policies and procedures \nfor dealing with the media \n2.6 Accountability requirements \n2.7 Resources \nand \nsupport \nwithin \nthe \ncommunity \n2.8 Government funding policies \n2.9 Knowledge of local area \n2.10 Relevant \nlocal, \nstate \nand \nfederal \nstrategies \n \n3. Underpinning skills \n \n3.1 Liaison and networking \n3.2 Communication \n3.3 Research skills \n3.4 Time management \n3.5 Budgeting \n3.6 Report writing \n3.7 Evaluation \n3.8 Presentation \n3.9 Marketing and promotion \n3.10  Negotiation \n \n4. Resource implications \n \nThe following resources MUST be provided: \n4.1 Access to appropriate resources for \ndeveloping, delivering and evaluating \ncommunity education projects  (or access \nto \nan \nappropriately \nsimulated \nenvironment).\n\n--- PDF PAGE 100 ---\nEVIDENCE GUIDE \n \n \n5. Method of \nassessment \n \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Observation with questioning \n5.3 Oral questioning/Interview \n5.4 Portfolio \n \n \n6. Context of  \n      assessment \n \n \n6.1 Competency may be assessed in the \nworkplace or in a simulated work setting.",
