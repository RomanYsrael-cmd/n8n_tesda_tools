        "evidence_guide": {
          "source_text": "1.\nCritical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1\nExplained\nclearly\nestablished\nworkplace\nsafety and hazard control practices and\nprocedures\n1.2\nIdentified hazards/risks in the workplace and\nits corresponding indicators in accordance\nwith company procedures\n1.3\nRecognized contingency measures during\nworkplace\naccidents,\nfire\nand\n\nother\nemergencies\n1.4\nIdentified terms of maximum tolerable limits\nbased on threshold limit value –TLV.\n1.5\nFollowed Occupational Health and Safety\n(OHS) procedures for controlling hazards /\nrisks in workplace\n1.6\nUsed Personal Protective Equipment (PPE)\nin\naccordance\nwith\ncompany\nOHS\nprocedures and practices\n1.7\nCompleted and updated OHS personal\nrecords\nin\naccordance\nwith\nworkplace\nrequirements\n\n2.\nUnderpinning\nknowledge and\nattitudes\n\n2.1\nOHS\nprocedures\nand\npractices\nand\nregulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards / risks identification and control\n2.5\nThreshold Limit Value (TLV)\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3.\nUnderpinning\nskills\n\n3.1\nPractice of personal hygiene\n3.2\nHazards / risks identification and control\nskills\n3.3\nInterpersonal skills\n3.4\nCommunication sills\n\n--- PDF PAGE 22 ---\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n\n5.\nMethod of\nassessment\n\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study / Situation\n\n6.\nContext of\n assessment\n\n6.1\nCompetency may be assessed in the work\nplace or in a simulated work place setting\n\n--- PDF PAGE 23 ---\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: IMPLEMENT AND MONITOR INFECTION\n CONTROL POLICIES AND PROCEDURES\nUNIT CODE :",
