          {
            "number": 11,
            "title": "Approaches",
            "performance_criteria": [
              {
                "number": "11.1",
                "text": "AOD may include knowledge of harm minimization practices, of the effects of AOD on body system and social relationships, and of the signs and symptoms of intoxication. Knowledge of groups and agencies in the community who can respond to individuals with AOD problems by providing treatment and detoxification programs is central. Also important is an awareness of personal bias, and models or perspectives on drug use i.e. disease perspective, moral perspective of both the client and of referral agencies."
              },
              {
                "number": "11.2",
                "text": "Mental health may include recognizing basic signs and symptoms of anxiety, depression, suicidal impulses, and indicators of mental illness such as hallucinations or delusion. Knowledge of appropriate referral and intervention services in the community is critical."
              },
              {
                "number": "11.3",
                "text": "Domestic violence may include an understanding of such violence as an abuse of power perpetrated both in a relationship and after separation and that such violence takes a number of forms. These include physical and sexual violence, emotional and psychological abuse and economic deprivation. Domestic violence occurs across all groups, cultures and creeds. The safety and well-being of individuals subjected to domestic violence should be of primary concern. Knowledge of groups and agencies in the community who can respond to individuals with domestic violence issues is required. --- PDF PAGE 90 --- VARIABLE RANGE"
              },
              {
                "number": "11.4",
                "text": "Child Protection will include knowledge of relevant state mandatory reporting legislation and its application, of child development and behavioural / physical indicators of abuse, and of services in the community that respond to child protection issues, it is vital to recognize that children in families experiencing difficulties, particularly where abuse of alcohol or other drugs occurs, are more likely to be at risk of abuse. Working of families and care givers to ensure the safety of children is a priority."
              },
              {
                "number": "11.5",
                "text": "Development disability may describe individuals who have a multiplicity of disabilities including difficulty learning, thinking a reasoning, retaining information and forming social relationships. It is vital to recognize the individuality of developmental disabled persons, there rights to age appropriate consultation and to self determination. Needs arising from social isolation and the critical importance of primary care- givers in the lives of developmental disabled persons should also be recognized. Knowledge of groups and agencies in the community that can provide advocacy services is required. --- PDF PAGE 91 --- VARIABLE RANGE"
              },
              {
                "number": "11.6",
                "text": "Juvenile justice may include knowledge of adolescent clients and their special need as individuals, within families and as part of a group, including stages of development and social issues affecting youth. Recognition of the vulnerability of young people in their dealings with authority and of the protection that should operate during an investigation or proceeding in relation to an offense is required. Knowledge of groups and agencies in the community that can provide services such as advocacy and legal advice to young people in their dealings with the justice system is essential."
              },
              {
                "number": "11.7",
                "text": "Acquired Brain Injury may include awareness of the causes and effects of ABI; understanding of the impact of cognitive impairment on the individual and families, including associated grief and loss issued; knowledge of the ABI service system; skills in working with people with challenging behaviours."
              }
            ]
