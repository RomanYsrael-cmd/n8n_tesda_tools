ies, \nservices or decision making \n4.6 Providing direction, advice and information \n \n5. Information and  \n     resources  \n \nMay include: \n5.1 Equipment \n5.2 Staff skills and time \n5.3 Provision of facilities \n5.4 Educational materials \n5.5 Funding \n5.6 Skills / administrative support \n5.7 Physical, \ntransport, \nvenues, \nmaterials, \nequipment \n5.8 Developmental training \n5.9 Financial\n\n--- PDF PAGE 78 ---\nEVIDENCE GUIDE \n \n1. Critical aspects of  \n      competency \n \nAssessment \nrequires \nevidence \nthat \nthe \ncandidate: \n1.1  Demonstrated the capacity to undertake a \nrange of activities to ensure appropriate \nparticipation by groups and individuals in \ncommunity based activities. \n2. Underpinning \nknowledge \nand \nattitudes \n \n2.1 \nCommunity development methods and \ntheir principles and practices \n2.2 \nFunding sources and their policies and \nstrategies for encouraging community \ninput and participation \n2.3 \nBudget and funding allocation \n2.4 \nLocal, state strategies / legislation \n2.5 \nHealth promotion  \n3. Underpinning skills \n \n3.1 \nPolicy development \n3.2 \nReport writing \n3.3 \nEvaluating effectiveness of community \nbased activities \n3.4 \nBudgeting \n3.5 \nNegotiating, liaisoning, networking \n3.6 \nMarketing \n3.7 \nFacilitating \n3.8     Researching relating to the community \n4. Resource implications \n \nThe following resources MUST be provided: \n4.1  Demonstration of competency will include \nthe ability to work with key people or \nstakeholders \nin \nthe \ncommunity.  \nAssessors are allowed for access to \nappropriate \nstructures, \npeople \nor \norganizations for assessment purposes. \n5. Method \nof \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n5.3 \nOral questioning/Interview \n5.4 \nPortfolio  \n6. Context of  \n      assessment \n \n6.1 \nCompetency may be assessed in the \nworkplace or in a simulated 