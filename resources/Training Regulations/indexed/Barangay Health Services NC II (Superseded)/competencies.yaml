        "source_text": "--- PDF PAGE 7 ---\nSECTION 2.   COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units \nof competency required in BARANGAY HEALTH SERVICES NC II. \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY:   PARTICIPATE IN WORKPLACE  \n                                             COMMUNICATION \nUNIT CODE                     :   500311105 \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes   \n                                              required to gather, interpret and convey information  \n                                              in response to workplace requirements. \n \n \n \nELEMENT \n \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1.  Obtain and convey \n     workplace  \n     information \n \n \n1.1 Specific and relevant information is accessed from \nappropriate sources. \n1.2 Effective \nquestioning, \nactive \nlistening \nand \nspeaking skills are used to gather and convey \ninformation. \n1.3 Appropriate \nmedium \nis \nused \nto \ntransfer \ninformation and ideas. \n1.4 Appropriate non-verbal communication is used. \n1.5 Appropriate \nlines \nof \ncommunication \nwith \nsupervisors and colleagues are identified and \nfollowed. \n1.6 Defined workplace procedures for the location and \nstorage of information are used. \n1.7 Personal interaction is carried out clearly and \nconcisely. \n \n2.  Participate in  \n     workplace meetings  \n     and discussions \n \n2.1 Team meetings are attended on time. \n2.2 Own opinions are clearly expressed and those of \nothers are listened to without interruption. \n2.3 Meeting inputs are consistent with the meeting \npurpose and established protocols.\n\n--- PDF PAGE 8 ---\nELEMENT \n \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n \n2.4 Workplace interactions are conducted in a \ncourteous manner. \n2.5 Questions \nabout \nsimple \nroutine \nworkplace \nprocedures and matters concerning working \nconditions \nof \nemployment \nare \nasked \nand \nresponded to. \n2.6 Meetings \noutcomes \nare \ninterpreted \nand \nimplemented. \n \n3.  Complete relevant  \n     work related  \n     documents \n \n3.1 \nRange of forms relating to conditions of \nemployment are completed accurately and \nlegibly. \n3.2 \nWorkplace data is recorded on standard \nworkplace forms and documents. \n3.3 \nBasic mathematical processes are used for \nroutine calculations. \n3.4 \nErrors in recording information on forms / \ndocuments are identified and properly acted \nupon.\n\n--- PDF PAGE 9 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \n \nRANGE \n \n1.  Appropriate sources \n \n1.1 Team members \n1.2 Suppliers \n1.3 Trade personnel \n1.4 Local government \n1.5 Industry bodies \n \n2.  Medium \n2.1  Memorandum \n2.2  Circular \n2.3  Notice \n2.4  Information discussion \n2.5  Follow-up or verbal instructions \n2.6  Face to face communication \n \n3.  Storage \n3.1  Manual filing system \n3.2  Computer-based filing system \n \n4.  Forms \n4.1  Personnel forms, telephone message forms,  \n       safety reports \n \n5.  Workplace  \n     interaction \n \n5.1 Face to face \n5.2 Telephone \n5.3 Electronic and two way radio \n5.4 Written including electronic, memos, instruction \nand forms, non-verbal including gestures, signals, \nsigns and diagrams \n \n6.  Protocols \n6.1  Observing meeting \n6.2  Compliance with meeting decisions \n6.3  Obeying meeting instructions\n\n--- PDF PAGE 10 ---\nEVIDENCE GUIDE \n \n \n1. \nCritical aspects \nof competency \n \n \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following \nstandard format of the organization \n1.2 \nAccessed \ninformation \nusing \ncommunication equipment \n1.3 \nMade use of relevant terms as an aid to \ntransfer information effectively \n1.4 \nConveyed information effectively adopting \nthe formal or informal communication \n2. \nUnderpinning \nknowledge and \nattitudes \n \n2.1 \nEffective communication \n2.2 \nDifferent modes of communication \n2.3 \nWritten communication \n2.4 \nOrganizational policies \n2.5 \nCommunication procedures and systems \n2.6 \nTechnology relevant to the enterprise and \nthe individual’s work responsibilities \n3. \nUnderpinning \nskills \n \n3.1 \nFollow simple spoken language \n3.2 \nPerform routine workplace duties following \nsimple written notices \n3.3 \nParticipate in workplace meetings and \ndiscussions \n3.4 \nComplete work related documents \n3.5 \nEstimate, calculate and record routine \nworkplace measures \n3.6 \nBasic mathematical processes of addition, \nsubtraction, division and multiplication \n3.7 \nAbility to relate to people of social range in \nthe workplace \n3.8 \nGather \nand \nprovide \ninformation \nin \nresponse to workplace requirements \n4. \nResource \nimplications \n \nThe following resources MUST be provided: \n4.1 \nFax machine \n4.2 \nTelephone \n4.3 \nWriting materials \n4.4 \nInternet \n5. \nMethod of  \n        assessment \n \nCompetency may be assessed through: \n5.1 \nDirect observation \n5.2 \nOral interview and written test \n6. \nContext of  \n        assessment \n6.1 \nCompetency may be assessed individually \nin the actual workplace or through \naccredited institution.\n",
