          "source_text": "1. Plan responses \n \n1.1 Responses are planned to instances of \ndifficult or challenging behavior to maximize \nthe availability of other appropriate staff and \nresources. \n1.2 Specific \nmanifestations \nof \ndifficult \nor \nchallenging behavior are identified and \nstrategies appropriate to these behaviors are \nplanned as required. \n1.3 Safety of self and others is given priority in \nresponding to difficult or challenging behavior \naccording \nto \ninstitutional \npolicies \nand \nprocedures. \n \n2. Apply response \n \n2.1 Difficult or challenging behavior is dealt with \npromptly, \nfirmly \nand \ndiplomatically \nin \naccordance with institutional policy and \nprocedures. \n2.2 Communication is used effectively to achieve \nthe desired outcomes in responding to difficult \nor challenging behavior. \n2.3 Appropriate strategies are selected to suit \nparticular instances of difficult or challenging \nbehavior.\n\n--- PDF PAGE 30 ---\nELEMENT \n \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3. Report \nand \nreview incidents \n \n3.1 Incidents are reported according to institutional \npolicies and procedures. \n3.2 Incidents are reviewed with appropriate staff \nand suggestions appropriate to area of \nresponsibility are made. \n3.3 Debriefing mechanisms and other activities \nare used and participated in. \n3.4 Advice \nand \nassistance \nis \nsought \nfrom \nlegitimate sources when appropriate.\n\n--- PDF PAGE 31 ---\nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n \n1. Planned \nresponses \n \n1.1 Own ability and experience \n1.2 Established institutional procedures \n1.3 Knowledge \nof \nindividual \npersons \nand \nunderlying causes \n \n2. Difficult \nor \nchallenging \nbehavior \n \n2.1 Aggression / Assaultive behavior \n2.2 Confusion or other cognitive impairment \n2.3 Noisiness \n2.4 Manipulative \n2.5 Wandering \n2.6 Self-destructive \n2.7 Intoxication \n2.8 Withdrawn / depressed \n2.9 Negativistic \n2.10 \nIntrusive behavior \n2.11 \nVerbal offensiveness \n \n3. Strategies \nfor \ndealing \nwith \nchallenging \nbehaviors \n \n3.1 Diversional activities \n3.2 Referring to appropriate personnel  e.g.  \nsupervisor, security officer \n3.3 Following established emergency response \nprocedures \n \n4. Selection \nof \nstrategies \nfor \ndealing \nwith \nchallenging  \nbehaviors \n \n4.1 The nature of the incident \n4.2 Potential effect on different parties, patient, \nstaff and others \n4.3 Established procedures and guidelines \n \n5. Institutional \npolices \nand \nprocedures \n \n5.1 Incident reporting and documentation \n5.2 Operational guidelines for handling incidents \nand/or cases involving difficult and challenging \nbehavior \n5.3 Debriefing of staff involved in the incident\n\n--- PDF PAGE 32 ---"
