  "source_text": "SECTION 4 - NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of BARANGAY HEALTH\nSERVICES NC II, the candidate must demonstrate competence\nthrough project-base type assessment covering all units listed in\nSection 1. Successful candidates shall be awarded a National\nCertification II (NC II), signed by the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The\nbasic and common units shall be integrated or assessed\nconcurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and\ncertification:\n4.3.1\nGraduates of formal, non-formal and informal including\nenterprise-based training programs\n4.3.2\nExperienced Workers (waged employed or self-employed)\n\n4.4\nRe-assessment in a unit of competency is allowed only after one\nmonth from the date of assessment. Re-assessment for a\nNational Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.5\nA candidate who fails the assessment for two (2) consecutive\ntimes will be required to go through a refresher course before\ntaking another assessment.\n\n4.6\nThe guidelines on assessment and certification are discussed in\ndetail in the Procedures Manual on Assessment and Certification.\n\n--- PDF PAGE 121 ---\nCOMPETENCY MAP – HEALTH SECTOR (BARANGAY HEALTH SERVICES NC II)\nBASIC COMPETENCIES\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nPractice housekeeping\nprocedures (5S)\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop team and\nindividual\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high standard\nof patient services\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals/food\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end-\nusers location\nAssist in patient\nmobility\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\nAssess and refer biomedical\nequipment\nPerform basic life support\nMaintain life support\nequipment and resources\nImplement safe\naccess and extrication\nprocedures in an\nemergency\nManage request for an\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic ambulance\ncommunication skills\nSupervise on-road\noperations\nManage the scene of an\nemergency\nManage the scene of\na special event\nManage routine scene\nDeliver pre-hospital\npatient care\nDeliver intensive pre-\nhospital patient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\nDrive vehicles under\noperational conditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a community\ndevelopment framework\nPrepare for work in the\ncommunity service\nindustry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education program\nin the community\nImplement health\npromotion and\ncommunity\ninterventions\n\n--- PDF PAGE 122 ---\nDEFINITION OF TERMS\n\n1. Framework - refers to the basic supporting idea / concept / theory.\n2. Community Development Framework – includes a range of methods\ndesigned to strengthen and develop communities.\n3. Community Structures – groups/ organizations in the community\nwhether political, socio-cultural or groups in the academe who share\nconcerns and issues.\n4. Problem solving skills – skills needed to solve routine problems related\nto the workplace under direction\n5. Client-centered approach – a non-discriminatory approach to all client,\ntheir family and friends, commitment to meeting their needs and upholding\ntheir rights as well as empowering them.\n6. Residential care - this includes planning for resources, services and on-\ngoing support for the client and significant others to ensure resettlement\nneeds are assessed and addressed.\n7. AOD - alcohol and other drugs problems\n\n--- PDF PAGE 123 ---\nACKNOWLEDGEMENT\n\nThe Technical Education and skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies, non-government\norganizations including professional associations who donated their time and\nexpertise to the development and validation of this Training Regulations.\n\n● EXECUTIVE COMMITTEE, Health Care Industry Training Council, Inc.\n\nDr. Juan Ma. Pablo R. Nañagas, MPH, MNSA\n\nChairperson\n\nDr. Kenneth Vincent Ronquillo, MPHM\n\nDeputy Chair\n\nPilar L. Singson Malabunga, RN, MAN\n\nSecretary (2003-2004)\n\nEvangeline E. Rafael, RN, MPA, MHA, PhD\n\nSecretary\n\nDr. Ireneo Bernardo, III\n\nTreasurer\n\nProfessor Quintin G. Tan\n\nBoard Member (2003-2004)\n\nMa. Rita V. Tamse, RN, MN\n\nBoard Member\n\n● Committee Chairs, Health Care Industry Training Council, Inc.\n\nProf. Agnes Rosario A. De Leon, RN, MHA, CHCM\n\nTraining and Development Committee\n\nDr. Rodel Nodora, EMBA\n\nPlanning Research, Marketing and Advocacy Committee\n\nMa. Rita V. Tamse, RN, MN\n\nStandards and Assessment Development Committee (2003-2004)\n\nMs. Gwyn Grace M. Dacurawat\n\nStandards and Assessment Development Committee\n\n--- PDF PAGE 124 ---\n● PAQTVET\n\nMark Douglas Kilner\n\nAustralian Project Director and Industry Advisor, Health Sector\n\nMr. Nicholas Crosling\n\nMs. Sonya Casey\n\nMr. Patrick Cumming\n\nMr. Anthony Audley\n\nMr. Dexter Merquita\n\nMs. Erma David\n\nMs. Olivia Angel\n\nMs. Dazymea Gaan\n\nMr. Charles Del Rosario\n\nMs. Rabbi Morata\n\n● Committee on Standards and Assessment Development\n\nMs. Gwyn Marantan Dacurawat, RN, MAN\n\nDeputy Chair\n\nDr. Ponciano Jerez\n\nNational Vice President, Philippine Government Employees Association\n\nDr. Leopoldo Vocalan, Jr.\n\nVeterans Memorial Medical Center\n\nMs. Imelda A. Mañgaser, RN, MN\n\nDivision of Nursing Education and Training, Philippine General Hospital\n\nDr. Remigia Lorenzo, RN, DEd.\n\nHoly Spirit Occupational Skills Training Center\n\nMs. Hiyasmin Lozada, RM, RN\n\nNew Lucena Polytechnic College\n\nMr. Antonio P. Gunay, Jr.\n\nOrganizational of Non-Academic Personnel of UP (ONAPUP)\n\nPhilippine Government Employees Association\n\nMs. Nanette JC. Masangkay\n\nPhilippine General Hospital\n\n--- PDF PAGE 125 ---\n● Committee on Planning Research, Marketing an