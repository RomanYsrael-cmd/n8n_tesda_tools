  "source_text": "SECTION 4 - NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of BARANGAY HEALTH\nSERVICES NC II, the candidate must demonstrate competence\nthrough project-base type assessment covering all units listed in\nSection 1. Successful candidates shall be awarded a National\nCertification II (NC II), signed by the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The\nbasic and common units shall be integrated or assessed\nconcurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and\ncertification:\n4.3.1\nGraduates of formal, non-formal and informal including\nenterprise-based training programs\n4.3.2\nExperienced Workers (waged employed or self-employed)\n\n4.4\nRe-assessment in a unit of competency is allowed only after one\nmonth from the date of assessment. Re-assessment for a\nNational Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.5\nA candidate who fails the assessment for two (2) consecutive\ntimes will be required to go through a refresher course before\ntaking another assessment.\n\n4.6\nThe guidelines on assessment and certification are discussed in\ndetail in the Procedures Manual on Assessment and Certification.\n\n--- PDF PAGE 121 ---\n"
