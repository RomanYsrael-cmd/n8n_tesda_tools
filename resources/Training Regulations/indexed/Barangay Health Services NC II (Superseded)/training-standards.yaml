    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: BARANGAY HEALTH SERVICES\n\nNC Level: NC II\n\nNominal Training Hours: 560 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nBarangay Health Workers and Community Health Assistants in accordance with\nindustry standards. It covers basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and\nconvey\nworkplace\ncommunication\n1.2 Complete\nrelevant work\nrelated\ndocuments\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Group discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews\n• Questioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility in\na team\n2.2 Describe work\nas a team\nmember\n• Group discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews\n• Questioning\n\n--- PDF PAGE 109 ---\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n\n3.1 Integrate\npersonal\nobjectives with\norganizational\ngoals\n3.2 Set and meet\nwork priorities\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Group discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews\n• Questioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard\nand risks\n4.2 Control hazards\nand risks\n4.3 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n1. Implement and\nmonitor\ninfection control\npolicies and\nprocedures\n\n1.1 Provide\ninformation to\nthe work group\nabout the\norganization’s\ninfection control\npolicies and\nprocedures\n1.2 Integrate the\norganization’s\ninfection control\npolicy and\nprocedure into\nwork practices\n1.3 Monitor infection\ncontrol\nperformance\nand implement\nimprovements in\npractices\n• Lecturette\n• Brainstorming\n• Observation\nand\noral questioning\n• Grid question\n• Practical exercise\n\n--- PDF PAGE 110 ---\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n2. Respond\neffectively to\ndifficult/challeng\ning behavior\n\n2.1 Plan and\nrespond to\nemergencies\n2.2 Report and\nreview incidents\n• Lecturette\n• Brainstorming\n• Observation\nand\noral questioning\n• Grid question\n• Practical exercise\n\n3. Apply basic first\naid\n3.1 Assess the\nsituation\n3.2 Apply basic first\naid techniques\n3.3 Communicate\ndetails of the\nincident\n• Lecturette\n• Brainstorming\n• Observation\nand\noral questioning\n• Grid question\n• Practical exercise\n4. Maintain high\nstandard of\npatient services\n4.1 Communicate\nappropriately\nwith patients\n4.2 Establish and\nmaintain good\ninterpersonal\nrelationship with\npatients\n4.3 Act in a\nrespectful\nmanner at all\ntimes\n4.4 Evaluate own\nwork to\nmaintain a high\nstandard of\npatient service\n• Lecturette\n• Brainstorming\n• Observation\nand\noral questioning\n• Grid question\n• Practical exercise\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n1. Work within a\ncommunity\ndevelopment\nframework\n\n1.1 Demonstrate\n commitment to\n central\n philosophies of\n Barangay\nHealth\n Service health /\n Practice\n1.2 Identify and\n describe the\n principles and\n practices of\n Barangay\nHealth\n Services\nLecture\nCase studies\nFilm showing\nField visitation to\n Local Barangay\nSimulation of\n workplace\nOn-the-job practice\n\nQuestioning\nObservation\nPractical exam\nReturn demo\n\n--- PDF PAGE 111 ---\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n2. Prepare for\nwork\n in\nthe\ncommunity\n service\nindustry\n\n2.1 Access\nindustry\ninformation\napplicable\nlegislative\