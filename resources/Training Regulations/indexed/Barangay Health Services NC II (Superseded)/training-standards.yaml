  "source_section_text": "SECTION 3. TRAINING STANDARDS\n\nThis set of standards provides the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements\nto consider when designing training programs for BARANGAY HEALTH\nSERVICES NC II.\n\nThis includes information on curriculum design, training delivery, trainee\nentry requirements, tools and equipment, training facilities, trainer’s qualification\nand institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: BARANGAY HEALTH SERVICES\n\nNC Level: NC II\n\nNominal Training Hours: 560 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nBarangay Health Workers and Community Health Assistants in accordance with\nindustry standards. It covers basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and\nconvey\nworkplace\ncommunication\n1.2 Complete\nrelevant work\nrelated\ndocuments\n1.3 Participate in\nworkplace\nmeeting and\ndiscussion\n• Group discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews\n• Questioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team\nrole and\nresponsibility in\na team\n2.2 Describe work\nas a team\nmember\n• Group discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews\n• Questioning\n\n--- PDF PAGE 109 ---\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n\n3.1 Integrate\npersonal\nobjectives with\norganizational\ngoals\n3.2 Set and meet\nwork priorities\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Group discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews\n• Questioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard\nand risks\n4.2 Control hazards\nand risks\n4.3 Maintain\noccupational\nhealth and\nsafety\nawareness\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n1. Implement and\nmonitor\ninfection control\npolicies and\nprocedures\n\n1.1 Provide\ninformation to\nthe work group\nabout the\norganization’s\ninfection control\npolicies and\nprocedures\n1.2 Integrate the\norganization’s\ninfection control\npolicy and\nprocedure into\nwork practices\n1.3 Monitor infection\ncontrol\nperformance\nand implement\nimprovements in\npractices\n• Lecturette\n• Brainstorming\n• Observation\nand\noral questioning\n• Grid question\n• Practical exercise\n\n--- PDF PAGE 110 ---\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n2. Respond\neffectively to\ndifficult/challeng\ning behavior\n\n2.1 Plan and\nrespond to\nemergencies\n2.2 Report and\nreview incidents\n• Lecturette\n• Brainstorming\n• Observation\nand\noral questioning\n• Grid question\n• Practical exercise\n\n3. Apply basic first\naid\n3.1 Assess the\nsituation\n3.2 Apply basic first\naid techniques\n3.3 Communicate\ndetails of the\nincident\n• Lecturette\n• Brainstorming\n• Observation\nand\noral questioning\n• Grid question\n• Practical exercise\n4. Maintain high\nstandard of\npatient services\n4.1 Communicate\nappropriately\nwith patients\n4.2 Establish and\nmaintain good\ninterpersonal\nrelationship with\npatients\n4.3 Act in a\nrespectful\nmanner at all\ntimes\n4.4 Evaluate own\nwork to\nmaintain a high\nstandard of\npatient service\n• Lecturette\n• Brainstorming\n• Observation\nand\noral questioning\n• Grid question\n• Practical exercise\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n1. Work within a\ncommunity\ndevelopment\nframework\n\n1.1 Demonstrate\n commitment to\n central\n philosophies of\n Barangay\nHealth\n Service health /\n Practice\n1.2 Identify and\n describe the\n principles and\n practices of\n Barangay\nHealth\n Services\nLecture\nCase studies\nFilm showing\nField visitation to\n Local Barangay\nSimulation of\n workplace\nOn-the-job practice\n\nQuestioning\nObservation\nPractical exam\nReturn demo\n\n--- PDF PAGE 111 ---\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n2. Prepare for\nwork\n in\nthe\ncommunity\n service\nindustry\n\n2.1 Access\nindustry\ninformation\napplicable\nlegislative\nguidelines\n2.2 Identify\nfuture career\nopportunities\nin\nthe\ncommunity\n2.3 Work on an\nindividual\nbasis\nand\nwithin\na\nteam\n\n➢ Assignment\nInstructions\n➢ Work plans and\nschedules\n➢ Lecture\n➢ Film showing\n\n➢ Questioning\n➢ Observation\nthrough\ndemonstra-tion\n➢ Portfolio\n3. Support\n community\n resources\n\n3.1 Develop an\n information\n bases of\n community\n resources\n3.2 Establish\nrelationship\nwith key\npeople\n3.3\nApply\nstrategies\nfor linkages\npeople\n3.4\nMaintain\ncommunity\nresources\nand facilities\n\n➢ Lecture\n➢ Demonstration\n➢ Film showing\n➢ Role play\n➢ Case study\n➢ Written tests\n➢ Oral\nquestioning\n➢ Observation\n➢ Demonstra-\ntion\n4.\n\nProvide\nprimary /\n residential\ncare\n\n4.1 Outline terms\nof placement\nwith client on\ncare\n4.2 Provide\n/\nmobilize\ndomestic\nsupport\n4.3 Provide\nfor\nclient\neducation\nsupport and\ndevelopment\n4.4 Contribute to\nreintegration\n➢ Lecture\n➢ Demonstration\n➢ Film showing\n➢ Role play\n➢ Case study\n➢ Written\ntests\nand reports\n➢ Oral\nquestioning\n➢ Observation\n➢ Return\ndemonstra- tion\n\n--- PDF PAGE 112 ---\nof clients\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment Approach\n5. Support\n community\n\nparticipation\n\n5.1 Work with\nindividual\nand the\ncommunity to\npromote\nparticipation\n5.2 Support\nexisting\ncommunity\nactivities\n\n➢ Lecture\n➢ Demonstration\n➢ Observation\n➢ Third party report\n➢ Demonstra- tion\n6. Recruit and\n coordinate\n volunteers\n\n6.1 identify the\n needs\nand\nroles\n for volunteers\nin\n the\norganization\n6.2 Recruit\nvolunteers\n6.3 Orient\nvolunteers to\norganization\n6.4 Monitor\nperformance\nof volunteers\n\n➢ Lecture\n➢ Role play\n➢ Demonstration\n➢ Observation\n➢ Demonstra- tion\n➢ Third party reports\n7.\n\nDevelop\nand\n provide\nhealth\n education\n program in\nthe\n community\n\n7.1 Develop the\n health\n education\n program\n7.2 Organize\n participant in\nthe\n program\n7.3 Coordinate\nhealth\nteaching\nprogram\n\n➢ Lecture sessions\n➢ Film showing\n➢ On the job training\n➢ Observation\n➢ Third party report\n➢ Demonstra- tion\n8. Respond\n Holistically\nto\n client\nissues\n8.1\nEvaluate\nthe range\nof\nissues\nimpacting\non\nthe\n➢ Lecture-\ndiscussion\n➢ Demonstration\n➢ Role play\n\n➢ Observation\n➢ Demonstration\n➢ Questioning\n\n--- PDF PAGE 113 ---\nclient and\non\nthe\ndelivery of\nappropriat\ne theories\n8.2\nDetermine\nthe course\nof action to\nbe\nfollowed\n\n➢ Lecture-\ndiscussion\n\n➢ Questioning\n➢ Observation\n➢ Demonstration\n\n--- PDF PAGE 114 ---\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment Approach\n\n8.3\nEstablish\ninterpersona\nl\nrelationship\nwith\nthe\nclient\nthat\nwill\nenable\nall issues to\nbe\naddressed\n8.4\nProvide\na\nbrief\nintervention\nas required\n\n8.5\nRespond\nappropriatel\ny to people\nwho\nare\nvulnerable\nand\nat\nsignificant\nrisk\n\n8.6\nEvaluate\neffectivenes\ns of services\nprovided to\nmeet client\nneeds\n\n➢ Lecture\n➢ Film showing\n➢ Role play\n➢ Return\ndemonstratio\nn\n\n➢ Lecture-\ndemonstratio\nn\n➢ Role play\n\n➢ Lecture-\ndemonstratio\nn\n➢ Role play\n\n➢ Lecture\n\n➢ Observation\n➢ Return\ndemonstra-tion\n➢ Feedback\nfrom\nclient\n\n➢ Observation\n➢ Return\ndemonstration\n\n➢ Observation\n\n➢ Return\ndemonstration\n\n➢ Questioning\n\n➢ Questionnaire\nsurvey\n\n➢ Feedback\nfrom\nclient\n\n9. Implement\n Health\n Promotion and\n community\n Intervention\n\n9.1 Identify\n community\n issues in\n proactive\nhealth\n care\n9.2 Work within the\neducation\nframework\nof\nhealth\npromotions\n9.3 Identify\nthe\nactivity\nprogram\nrequired\n9.4 Plan\nand\ndeliver activity\nprogram\n9.5 Evaluate\n➢ Lecture\nsessions\n➢ Role play\n➢ On the job\ntraining\n➢ Observation\n➢ Demonstra- tion\n➢ Case\nwork\nreports\n➢ Third party report\n\n--- PDF PAGE 115 ---\nactivity\nprogram\n\n--- PDF PAGE 116 ---\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the basic 10 principles of competency-based\nTVET.\n● The training is based on curriculum developed from competency\n standards;\n● Learning is modular in its structure;\n● Training delivery is individualized and self-paced;\n● Training is based on work that must be performed;\n● Training materials are directly related to the competency standards and\n the curriculum modules;\n● Assessment is based on the collection of evidence of the performance\nof work to the industry required standard;\n\n● Training is based both on the off-the-job components;\n\n● Allows for recognition of prior learning (RPL) or current competencies;\n\n● Training allows for multiple entry and exit; and\n\n● Approved training programs are nationally accredited;\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the job as long as the learning is driven by the\ncompetency standards specified by the industry.\n\nThe following training modalities may be adopted when designing training\nprograms:\n\n● The dualized mode of training delivery is preferred and recommended.\n Thus programs would contain both in-school and industry training or\n fieldwork components. Details can be referred to the Dual Training\n System (DTS) implementing Rules and Regulations.\n\n● Modular/self-paced learning is a competency-based training modality\n wherein the trainee is allowed to progress at his own pace. The trainer\n facilitates the training delivery.\n\n● Peer teaching/mentoring is a training modality wherein fast learners are\n given the opportunity to assist the slow learners\n\n● Supervised industry training or on-the-job training is an approach in\n training designed to enhance the knowledge and skills of the trainee\n through actual experience in the workplace to acquire specific\n competencies prescribed in the training regulations.\n\n--- PDF PAGE 117 ---\n3.3 TRAINEE ENTRY REQUIREMENT\n\nTrainees or students wishing to enroll in this course qualification should\npossess the following requirements:\n\n○ 16 years old and above\n○ Must pass the trainability / aptitude test\n○ Can communicate effectively both orally and in written form\n○ Physically, emotionally and mentally fit\n○ Can perform basic mathematical computation\n○ Preferably based in a certain barangay\n○ With good reputation in the community\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may\nbe required of the trainees by the school or training center delivery this\nTVET program.\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nBARANGAY HEALTH SERVICES NC II\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for the Barangay Health Services NC II\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQTY DESCRIPTION\nQTY DESCRIPTION QTY\nDESCRIPTION\n\n1\n1\n2\n\nMonkey wrench\nScrew driver\nFlashlight\n\n1\n2\n2\n1\n1\n1\n1\n1\n1\n\n1\n\nWeighing scale\nOxygen\ngauges\nOxygen tank\nBlood pressure\n apparatus\nStethoscope\nAmbu bag\nCardiac board\nCabinets\n(steel)\n for record\nRadiophone\n\n1 rl\n1 rl\n\n1 bx\n1 bx\n1 bx\n1 bx\n4 pc\n4 pc\n10\n\n10\n4\n1\nFirst Aid Kit\n➢ cotton balls\n➢ gauze\n➢ elastic bandage\n1 inch\n1 ½ inch\n-2 inches\n➢ plaster\n➢ forceps\n➢ scissors\n➢ suction catheter\n➢ thermometer\n➢ penlight\n➢ splints\n\n--- PDF PAGE 118 ---\nTOOLS\nEQUIPMENT\nMATERIAL\nQTY DESCRIPTION\nQTY DESCRIPTION QTY\nDESC