gram\n\n➢ Lecture sessions\n➢ Film showing\n➢ On the job training\n➢ Observation\n➢ Third party report\n➢ Demonstra- tion\n8. Respond\n Holistically\nto\n client\nissues\n8.1\nEvaluate\nthe range\nof\nissues\nimpacting\non\nthe\n➢ Lecture-\ndiscussion\n➢ Demonstration\n➢ Role play\n\n➢ Observation\n➢ Demonstration\n➢ Questioning\n\n--- PDF PAGE 113 ---\nclient and\non\nthe\ndelivery of\nappropriat\ne theories\n8.2\nDetermine\nthe course\nof action to\nbe\nfollowed\n\n➢ Lecture-\ndiscussion\n\n➢ Questioning\n➢ Observation\n➢ Demonstration\n\n--- PDF PAGE 114 ---\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment Approach\n\n8.3\nEstablish\ninterpersona\nl\nrelationship\nwith\nthe\nclient\nthat\nwill\nenable\nall issues to\nbe\naddressed\n8.4\nProvide\na\nbrief\nintervention\nas required\n\n8.5\nRespond\nappropriatel\ny to people\nwho\nare\nvulnerable\nand\nat\nsignificant\nrisk\n\n8.6\nEvaluate\neffectivenes\ns of services\nprovided to\nmeet client\nneeds\n\n➢ Lecture\n➢ Film showing\n➢ Role play\n➢ Return\ndemonstratio\nn\n\n➢ Lecture-\ndemonstratio\nn\n➢ Role play\n\n➢ Lecture-\ndemonstratio\nn\n➢ Role play\n\n➢ Lecture\n\n➢ Observation\n➢ Return\ndemonstra-tion\n➢ Feedback\nfrom\nclient\n\n➢ Observation\n➢ Return\ndemonstration\n\n➢ Observation\n\n➢ Return\ndemonstration\n\n➢ Questioning\n\n➢ Questionnaire\nsurvey\n\n➢ Feedback\nfrom\nclient\n\n9. Implement\n Health\n Promotion and\n community\n Intervention\n\n9.1 Identify\n community\n issues in\n proactive\nhealth\n care\n9.2 Work within the\neducation\nframework\nof\nhealth\npromotions\n9.3 Identify\nthe\nactivity\nprogram\nrequired\n9.4 Plan\nand\ndeliver activity\nprogram\n9.5 Evaluate\n➢ Lecture\nsessions\n➢ Role play\n➢ On the job\ntraining\n➢ Observation\n➢ Demonstra- tion\n➢ Case\nwork\nreports\n➢ Third party report\n\n--- PDF PAGE 115 ---\nactivity\nprogram\n\n--- PDF PAGE 116 ---"
