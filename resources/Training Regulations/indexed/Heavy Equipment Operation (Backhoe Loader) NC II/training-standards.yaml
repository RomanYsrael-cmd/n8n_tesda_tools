      "source_text": "3.5 TRAINING FACILITIES\n\nThe backhoe loader operation workshop must be of concrete structure.\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL\nAREA IN\nSQ.\nMETERS\n•\nLecture area\n8.0 x 6.0 meters\n48M2\n1\n48M2\n•\nLearning resource area\n4.0 x 6.0 meters\n24M2\n1\n24M2\n•\nTool room / Storage area\n3.0 x 3.0 meters\n9M2\n1\n9M2\n• Wash, toilet and locker\nroom\n8.0 x 4.0 meters\n32M2\n1\n32M2\nTOTAL\n-\n-\n113M2\nFacilities / Equipment /\nCirculation*\n-\n\n1,000M2\nTOTAL AREA\n1,113M2\nArea requirement is equivalent to 30 percent of total teaching / learning areas\n*Training area (Practical) (MOA)\n\n--- PDF PAGE 78 ---\nTR HEAVY EQUIPMENT OPERATION\n\n 3.6 TRAINERS’ QUALIFICATION\n\n HEAVY EQUIPMENT OPERATION (BACKHOE LOADER)\n\n• Must be a holder of Heavy Equipment Operation (Backhoe\nLoader) NC II\n• Must have undergone training on Training Methodology III (TM III)\nor its equivalent\n• Must be physically and mentally fit\n• Must have at least 5 years job/industry experience*\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 79 ---\nTR HEAVY EQUIPMENT OPERATION"
