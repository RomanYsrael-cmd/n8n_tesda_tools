    "source_text": "SECTION 3\nTRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY\nEQUIPMENT OPERATION (BACKHOE LOADER) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION – BACKHOE LOADER\nNC Level: NC II\n\nBASIC COMPETENCIES\n\nNominal Training Hours:\n18 Hours (Basic) + 24 Hours (Common)\n\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation (Backhoe Loader).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\n related documents\n1.3 Participate in workplace\n meeting and discussion\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n1. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\n sketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify materials\n5.2 Request materials\n5.3 Receive and inspect\n materials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n(80 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nBackhoe Loader\n1.1 Identify and\nexplain the\nfunctions of\nequipment and its\ncontrols,\ninstruments,\ngauges,\nindicators, safety\ndevices and\nattachments\n1.2 Explain the\nimportance of\nfluids and\nelaborate on\nequipment\nchecking\nprocedures\n1.3 Perform checking\nprocedures\nLecture\nPractical\nDemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform\nproductive\noperation for\nBackhoe Loader\n2.1 Identify and\nexplain safe work\npractices\n2.2 Identify and\nexplain possible\nunexpected\nsituation in\nproductive\noperation\n2.3 Perform\nprocedures for\nloading and\nunloading of\nequipment to low\nbed trailer\n2.4 Perform\nprocedures for\nexcavating,\ncarrying and\nloading of earth\nmaterial to dump\ntruck\n2.5 Perform\nsecondary\noperation\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Perform basic\npreventive\nmaintenance\nservicing for\nBackhoe Loader\n3.1 Identify minor\n and major\n defects\n3.2 Identify and\n explain the use\n of basic hand\n tools and\nconsumables\n3.3 Use basic hand\n tools in servicing\n minor defects\n and OS parts\n3.4 Prepare\n equipment report\n3.5 Perform good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\n--- PDF PAGE 75 ---\nTR HEAVY EQUIPMENT OPERATION\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated.\n\n• Can communicate both oral and written (English or Tagalog)\n• Physically and mentally fit\n• Can perform basic mathematical computation.\n\n--- PDF PAGE 76 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nBelow is the recommended list of tools, equipment and materials for the\ntraining of 25 trainees for the operation of backhoe loader.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\n• Standard\nmechanical hand\ntools\n2\nunits\n• Backhoe\nLoader\n25 kls.\n• grease\n2 pcs.\n• Grease gun\n1 unit\n• Water pressure\nwasher\n800\nliters\n• Diesel oil\n25 pcs.\n•\nMask\n1 unit\n•\nAir compressor\n25 kls.\n•\nrags\n25 pcs\n•\nGoggles\n\n15liters\n•\nEngine oil\n25 pcs.\n•\nSafety helmet\n\n15 liters\n•Hydraulic oil\n25 pcs.\n•\nSafety vest\n\n1 liter\n•Fluid\n2 pcs.\n•\nFire Extinguisher\n\n5 liters\n•Distilled water\n2 pcs.\n•\nVoltmeter pump\n\n*Quantity will depend on actual training consumption\n\n--- PDF PAGE 77 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.5 TRAINING FACILITIES\n\nThe backhoe loader operation workshop must be of concrete structure.\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL\nAREA IN\nSQ.\nMETERS\n•\nLecture area\n8.0 x 6.0 meters\n48M2\n1\n48M2\n•\nLearning resource area\n4.0 x 6.0 meters\n24M2\n1\n24M2\n•\nTool room / Storage area\n3.0 x 3.0 meters\n9M2\n1\n9M2\n• Wash, toilet and locker\nroom\n8.0 x 4.0 meters\n32M2\n1\n32M2\nTOTAL\n-\n-\n113M2\nFacilities / Equipment /\nCirculation*\n-\n\n1,000M2\nTOTAL AREA\n1,113M2\nArea requirement is equivalent to 30 percent of total teaching / learning areas\n*Training area (Practical) (MOA)\n\n--- PDF PAGE 78 ---\nTR HEAVY EQUIPMENT OPERATION\n\n 3.6 TRAINERS’ QUALIFICATION\n\n HEAVY EQUIPMENT OPERATION (BACKHOE LOADER)\n\n• Must be a holder of Heavy Equipment Operation (Backhoe\nLoader) NC II\n• Must have undergone training on Training Methodology III (TM III)\nor its equivalent\n• Must be physically and mentally fit\n• Must have at least 5 years job/industry experience*\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 79 ---\nTR HEAVY EQUIPMENT OPERATION"
  },
