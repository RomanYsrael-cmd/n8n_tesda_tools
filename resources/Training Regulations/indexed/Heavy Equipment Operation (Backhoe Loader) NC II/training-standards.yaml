tion\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform\nproductive\noperation for\nBackhoe Loader\n2.1 Identify and\nexplain safe work\npractices\n2.2 Identify and\nexplain possible\nunexpected\nsituation in\nproductive\noperation\n2.3 Perform\nprocedures for\nloading and\nunloading of\nequipment to low\nbed trailer\n2.4 Perform\nprocedures for\nexcavating,\ncarrying and\nloading of earth\nmaterial to dump\ntruck\n2.5 Perform\nsecondary\noperation\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Perform basic\npreventive\nmaintenance\nservicing for\nBackhoe Loader\n3.1 Identify minor\n and major\n defects\n3.2 Identify and\n explain the use\n of basic hand\n tools and\nconsumables\n3.3 Use basic hand\n tools in servicing\n minor defects\n and OS parts\n3.4 Prepare\n equipment report\n3.5 Perform good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration with\noral questioning\n• Written test\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved