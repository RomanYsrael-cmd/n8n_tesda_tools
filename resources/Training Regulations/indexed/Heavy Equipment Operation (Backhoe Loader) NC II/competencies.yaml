        "source_title": "PERFORM PRODUCTIVE OPERATION FOR BACKHOE LOADER",
        "source_text": "--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY: \nPERFORM PRODUCTIVE OPERATION FOR BACKHOE \nLOADER \nUNIT CODE                     : \nCON833303 \nUNIT DESCRIPTOR        : \nThis unit describes the outcomes required in the productive \noperation of Backhoe Loader. It covers the skills required to \nload to and unload Backhoe Loader from low-bed trailer bed. \nIt also deals with the skills required to excavate earth \nmaterials on a very limited scale, carrying and loading of \nmaterials to dump truck and in performing secondary \noperations. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the  \nRange of Variables \n1. Load Backhoe Loader \nto low-bed trailer  \n1.1 Coordination and communication with authorized \nsignalman is maintained during loading operation. \n1.2 Backhoe Loader is loaded in correct position using \nadequate ramp and based on safe operating procedure.   \n1.3 Proper positioning of wheels is observed according to safe \nworking procedure. \n1.4 All safety locks and controls are properly secured. \n1.5 Loader bucket is properly rested based on safe work \nprocedure. \n1.6 Wheels are secured with stopper blocks and binders. \n1.7 Controls and brakes are checked in line with safety \nprocedure and prior to starting / moving the machine. \n1.8 Unexpected situations are responded to in line with \ncompany rules and regulations and in a manner that \nminimizes risk to personnel and equipment.\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n2. Unload equipment from \nTruck/Trailer (Low) \n \n \n \n \n \n2.1 Coordination and communication with authorized \nsignalman is maintained during unloading operation. \n2.2 Binders and stopper blocks are removed prior to unloading \noperation. \n2.3 All safety locks and controls are set at required position. \n2.4 Loader bucket is properly positioned while Backhoe \nLoader is being unloaded from low-bed trailer bed.  \n2.5 Backhoe Loader is unloaded in correct position using \nadequate ramp and based on safe operating procedure. \n2.6 Unexpected situations are responded to in line \n      with company rules and regulations in a manner that  \n      minimizes risk to personnel and equipment. \n3. Travel Backhoe Loader  \n \n \n \n \n \n \n3.1 Work area is surveyed for safe accessibility or potential \nhazards in accordance with safe operating procedures. \n3.2 Loader bucket height position is maintained following \nstandard traveling procedure. \n3.3 Travel speed is observed following manufacturer’s \nrecommendations. \n3.4 Unexpected situations are responded to in line with \ncompany rules and regulations in a manner that minimizes \nrisk to personnel and equipment.\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n4. Perform excavation work \n \n \n \n \n \n4.1 Work site inspection is performed in accordance with \nsafety requirements. \n4.2 Engine RPM is set at desired operating condition. \n4.3  Work equipment is properly positioned according to  \n       correct operating procedure. \n4.4  Bucket penetration angle position is observed. \n4.5  Correct operation of arm and boom is observed during  \n       scooping of excavated  materials. \n4.6  Required excavation dimensions are observed  \n       according to work specifications. \n4.7  Unexpected situations are responded to in line with  \n       company rules and regulations and in a manner that  \n     minimizes risk to personnel and equipment. \n5. Perform loading and \ncarrying of materials  \n5.1 Loader bucket clearance is maintained based on  \n      recommended height above ground during transport of  \n      excavated materials and according to safe operating  \n      procedures. \n5.2 Most efficient route selected is within recommended  \n      economic hauling distance  and in accordance with  \n      company rules and regulations / manufacturer’s  \n      performance manual. \n5.3 Load is carried within loader bucket capacity according to  \n      manufacturer’s performance specifications. \n5.4 Machine travel and engine speed is controlled during  \n      travel with load and in accordance with work area  \n      condition.   \n5.5 Unexpected situations are responded to in line with  \n       company rules and regulations.\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n5. Perform loading of \nmaterials to dump truck \n6.1 Loading operation to dump truck is performed according to  \n       safe operating procedure  \n6.2 Ground is checked and cleared of obstructions as per  \n      standard operating procedures \n6.3 Load is carried within bucket capacity and based on  \n      manufacturer’s specifications. \n6.4 Travel and engine speed is controlled during loading of  \n      materials to dump truck as per manufacturer’s  \n      recommendations. \n6.5 Recommended dump height/clearance is followed in  \n      loading material to dump truck based on manufacturer’s  \n      recommendations. \n6.6 Unexpected situations are responded to in line with  \n       company rules and regulations.  \n6. Perform secondary \noperations  \n \n \n \n \n \n6.1 Work site inspection is performed in accordance with  \n       safety requirements. \n7.2  Secondary operations are performed following  \n       manufacturer’s recommendations. \n7.3 Unexpected situations are responded to in line with  \n      company rules and regulations.\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Safety locks and \ncontrols  \n \n1.1 Controls \n1.2 Travel \n1.3 Swing lock \n1.4 Bucket \n        1.4.1 Backhoe \n        1.4.2 Loader \n1.5 Boom \n1.6 Arm \n1.7 Articulation lock \n2. Stopper blocks \n \n2.1 Wood / lumber \n2.2 Metal \n3. Binders \n3.1 Turnbuckles \n3.2 Shackle \n3.3 Wire rope sling \n3.4 Chain sling \n4. Unexpected situations \nMay include but are not limited to: \n4.1 Collapse of unstable terrain \n4.2 Busted hoses (hydraulic) \n4.3 Natural calamities e.g., flashfloods \n4.4 Situations arising from poor peace and order conditions \n5. Potential hazards \nMay include but are not limited to: \n5.1 Other equipment \n5.2 Building \n5.3 Deep excavation \n5.4 Fog \n5.5 Electric wires / high tension wires \n5.6 Protruding nails / steel bars  \n5.7 Boulders and rocks \n5.8 Muddy roads or unstable terrain \n5.9 Ravine \n5.10 Landslide\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n6. Safety requirements \n6.1 Barricades \n6.2 Caution tape \n6.3 Blinkers \n6.4 Signages \n6.5 Horns \n6.6 Reflector \n6.7 Fire extinguisher \n6.8 Safety belts \n6.9 PPE \n6.10 Decals / labels \n6.11 Beacon lights \n7. Engine RPM \n7.1 Low (700 – 900) \n7.2 Medium (900 – 1300) \n7.3 High (1400 – 2200) \n8. Work equipment \nMay include but not limited to: \n8.1 Boom \n8.2 Arm \n8.3 Bucket \n8.4 Rock breaker (optional) \n9. Correct operating \nprocedure \n9.1 Stabilizer pad /outrigger are properly positioned. \n9.2 Boom is aligned with the digging trench. \n9.3 Wheels are positioned on stable and level ground.  \n9.4 Initial arm digging position of 30 degrees before vertical  \n      axis and 45 degrees end of digging position after vertical  \n      axis.\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n10. Excavated materials \nMay include but are not limited to: \n10.1 Soil \n10.2 Sand \n10.3 Debris \n10.4 Landfill \n10.5 Silt \n11. Excavation dimensions 11.1 Depth \n11.2 Reach  \n11.3 Width \n11.4 Height \n15. Economic hauling \ndistance\n12.1 50m to 150m depending on amount of load the Backhoe  \n       Loader capacity\n16. Safe operating \nprocedure \n13.1 No dropping of materials from bucket \n13.2 No excessive tire spinning \n13.3 Perpendicular position of loader during trust / shove /  \n        scooping / penetration of bucket  \n13.4 No part of dump truck is hit by loader during loading of  \n        earth materials  \n13.7 Smooth application of accelerator pedal (inching,  \n        neutralizer, brake, accelerator) \n13.8 Observed 5-minute warm-up and cooling down \n13.9 Avoid hard impact of bucket to ground \n13.10 Avoid impact feathering of bucket \n14. Secondary  \n      operations \nMay include but not limited to: \n14.1 Lifting  \n14.2 Filling and spreading  \n14.3 Clearing / road preparation\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \nEVIDENCE GUIDE \n1. Critical aspects of \nevidence to  \n     be considered \n \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to perform loading of Backhoe Loader \nto low-bed trailer \n1.2 Demonstrates ability to perform unloading Backhoe \nLoader from low-bed trailer  \n1.3 Demonstrates ability to travel Backhoe Loader  \n1.4 Demonstrates ability to perform excavation work \n1.5 Demonstrates ability to perform loading and carrying of \nmaterials \n1.6 Demonstrates ability to perform loading of materials to \ndump truck \n1.7 Demonstrates ability to perform secondary operations \n1.8 Demonstrates ability to carry-out safe work practices  \n2. Underpinning \n     (related)   \n     knowledge  \n     and attitude \n \n \n2.1 Types and uses of PPE \n2.2 Use of operation and maintenance manual \n2.3 System operation and component functions  \n2.4 Types and uses of optional attachments \n2.4 Controls, gauges and indicators \n2.5 Mensuration \n2.6 Basic arithmetic \n2.7 Backhoe Loader operations safety procedures and  \n      practices \n2.8 Company rules and regulations \n2.9 Positive work values (cost, time, quality conscious, etc.)  \n3. Underpinning skills \n \n3.1 Using appropriate PPE \n3.2 Interpreting operation and maintenance manual  \n3.3 Identifying system operation and component functions  \n3.4 Interpreting controls, gauges and indicators \n3.5 Calculations \n3.6 Following safety procedures and practices \n3.7 Following company rules and regulations \n4. Resource implications \n \nThe following resources must be provided: \n4.1 Access to Backhoe Loader and jobsite  \n4.2 Ramp \n4.3 Dump truck \n4.4 Low-bed trailer and prime mover \n4.5 Earth materials  \n4.6 Barricades and informative signages \n4.7 Signalman\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n5. Method of assessment \n \nCompetency in this unit must be assessed through  \n5.1 Oral/written questioning  \n5.2 Observation of practical demonstration \n5.3 Work record and documents \n6. Context for assessment \n \n6.1 Assessment may be conducted in the work site or in a  \n      simulated venue. \n6.2 Competency shall be assessed while work is being  \n      undertaken.\n",
