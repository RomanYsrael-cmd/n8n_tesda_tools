          "source_text": "1. Perform adjustments/ \nreplacements \n \n \n \n1.1 Minor defects are identified and remedied in accordance \nwith company/manufacturer’s procedures. \n1.2 Correct/proper tools are selected based on job \nrequirements. \n1.3  Major defects are identified with checklist and referred to \nappropriate personnel. \n \n2. Perform basic \npreventive maintenance \nservicing (PMS)  \n \n \n \n \n2.1 OS parts/standards are identified and serviced according \nto manufacturer’s recommendations.  \n2.2 Fluids and lubricants are used based on manufacturer’s \nmanual. \n2.3 Appropriate basic hand tools and equipment are \nidentified and used in accordance with site requirements. \n2.4 Basic preventive maintenance servicing (PMS) is \ncarried out in accordance with manufacturer’s and/or site \nconditions/requirements. \n3. Prepare equipment \nreports \n \n \n3.1 Daily checklist form is properly accomplished in \naccordance with manufacturer’s/company requirements. \n3.2 Minor/major equipment defects are reported to concerned \npersonnel.\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Minor defects  \n \n \nMay include but not limited to: \n1.1 Weak battery  \n1.2 Improper belt tension  \n1.3 Clogged air filter/cleaner \n1.4 Loose clamps \n \nHydraulic Excavator, Wheel Loader and Motor Grader, Road \nRoller and Backhoe Loader \n1.5 Incorrect tire inflation \n \nHydraulic Excavator and Bulldozer \n1.6 Incorrect/insufficient track tension \n \nBackhoe Loader \n1.7 Busted bulbs\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n2. Major defects \n \n \n \n \n \nMay include but not limited to: \n2.1 Busted hydraulic hose \n2.2 Defective electrical system/electro-mechanical system \n          2.2.1 Lighting \n          2.2.2 Starting \n          2.2.3 Monitoring gauge \n \n         Hydraulic Excavator, Wheel Loader and Motor Grader, \nRoad Roller and Backhoe Loa