          "source_text": "1. Perform visual check \nof equipment \n \n \n \n \n \n1.1 Earth moving equipment is selected based on job \nrequirements. \n1.2 Operator serviceable (OS) parts are checked in \naccordance with equipment checklist and manufacturer’s \nprocedures. \n1.3 Walk-around check is performed with equipment \nchecklist and with engine stopped/not running. \n2. Perform “B L O W A F”  \ncheck \n \n \n \n \n \n2.1 “BLOWAF” check is performed with checklist form and \nwith engine stopped/not running. \n2.2 Deficiencies in fluid levels are identified and if below \nnormal level are refilled/topped up in accordance with \nequipment maintenance manual. \n2.3 Abnormal conditions are noted in checklist and reported to \nauthorized person.\n\n--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n3. Perform operation \ncheck \n \n \n \n \n \n3.1 Starting/running check is performed with checklist and in \naccordance with manufacturer’s recommendations. \n3.2 Brake, steering and controls are checked for normal \nfunctioning \n3.3 Walk-around check is performed with equipment checklist \nand with engine running. \n3.4 Safety devices and accessories are checked for proper \nfunctions in accordance with safe operating procedures.  \n4. Perform post-operation \nprocedures  \n4.1 Earth moving equipment is parked and turned off after \nproductive operation in accordance with company rules \nand regulations. \n4.2 Equipment controls are set into neutral position and \nparking brakes are engaged according to manufacturer’s \noperations manual. \n4.3 Safety locks and brakes are all set/engaged in \naccordance with operator’s manual. \n4.4 Walk-around inspection check is re-conducted while doing \nengine cool down \n4.5 Daily equipment time record/report (DETR) is \naccomplished/submitted according to company rules and \nregulations\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Earth moving  \n \n1.1 Hydraulic Excavator  \n          1.1.1 Crawler type \n          1.1.2 Wheel type \n1.2 Wheel Loader \n1.3 Bulldozer \n1.4 Motor Grader \n1.5 Backhoe Loader \n1.6 Road Roller \n1.6.1 Static roller  \n                 1.6.1.1 Pneumatic roller \n                 1.6.1.2 Drum roller \n                             1.6.1.2.1 Single drum \n                             1.6.1.2.2 Double drum \n1.6.2 Vibratory roller \n                 1.6.2.1 Single drum \n                 1.6.2.2 Double drum \n2. Operator-serviceable \n(OS) parts \n \n2.1 Air cleaner \n2.2 Battery terminals/Connection \n2.3 Belt \n2.4 Tire inflation \n2.5 Grease/lube points \n \nHydraulic Excavator and Backhoe Loader \n2.6 Fuel water separator \n \nBulldozer \n2.7 Track tension\n\n--- PDF PAGE 42 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n3. Walk-around check  \n \n \n \n \n \n3.1 Engine off \n              \nHydraulic Excavator, Wheel Loader, and Bulldozer \nBackhoe Loader and Road Roller \n             3.1.1 Leaks  \n             3.1.2 Worn out/damaged parts  \n             3.1.3 Fluid levels \n             3.1.4 Loose parts/connections \n             3.1.5 Missing parts \n \n             Hydraulic Excavator \n             3.1.6 Hook block  \n             3.1.7 Wire rope cable \n             3.1.8 Pulleys \n \n             Backhoe Loader \n             3.1.9 Tire condition \n \n3.2 Engine on \n \n             Hydraulic Excavator and Backhoe Loader \n             3.2.1 Gauges and controls \n             3.2.2 Oil and air leaks \n             3.2.3 Safety devices \n             3.2.4 Working equipment function e.g. outriggers,  \n                      boom, hoist \n \n             Motor Grader and Road Roller \n             3.2.5 Unusual sounds \n \nRoad Roller \n3.2.6 Unusual emission of smoke (blue, black and \nwhite) \n4. B L O W A F check \n \n \n \n \n \n4.1 Battery (starting and charging system) \n4.2 Light (lighting system) \n4.3 Oil (lubricating system) \n4.4 Water (cooling system) \n4.5 Air (intake and exhaust system) \n4.6 Fuel (fuel system)\n\n--- PDF PAGE 43 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n5. Fluid levels \n \n \n \n \n \n5.1 Battery electrolyte (maintenance type) \n5.2 Engine oil \n5.3 Hydraulic oil \n5.4 Radiator coolant \n \nHydraulic Excavator, Wheel Loader, Motor Grader, Bulldozer, \nBackhoe Loader \n5.5 Transmission \n \nBulldozer, and Motor Grader \n5.6 Fuel  \n \nHydraulic Excavator \n5.7 Gear Oil \n6. Authorized person \n6.1 Equipment supervisor \n6.2 Equipment dispatcher/Foreman  \n6.3 Maintenance personnel\n\n--- PDF PAGE 44 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n7. Starting/ \n     Running check \n \n \n \n \n \nMay include but not limited to: \n7.1 Controls  \n         7.1.1 Travel \n \n         Wheel Loader, Bulldozer, and Motor Grader Backhoe \nLoader and Road Roller \n         7.1.2 Steering/articulation \n \n         Hydraulic Excavator, and Wheel Loader and Backhoe \nLoader \n         7.1.3 Boom \n \n         Bulldozer, Motor Grader and Road Roller \n         7.1.4 Blade \n \nBulldozer and Motor Grader \n         7.1.5 Ripper  \n         7.1.6 Attachment \n \n                 Bulldozer \n                 7.1.6.1 Drawbar \n                 7.1.6.2 Disc plow \n                 7.1.6.3 Bedder  \n  \n                 Motor Grader \n                 7.1.6.4 Ripper \n                 7.1.6.5 Scarifier \n \n         Bulldozer \n         7.1.7 Winch \n         7.1.8 Tilt/Lift \n \n         Motor Grader \n         7.1.9 Lean  \n    \n         Wheel Loader and Backhoe Loader \n         7.1.10 Bucket \n \n         Hydraulic Excavator and Backhoe Loader \n         7.1.11 Out rigger \n         7.1.12 Arm  \n         7.1.13 Swing\n\n--- PDF PAGE 45 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \ncontinuation \nHydraulic Excavator \n         7.1.14 Arm  \n \n         Road Roller  \n         7.1.15 Drum \n         7.1.16 Vibratory \n \n7.2 Gauges  \n     