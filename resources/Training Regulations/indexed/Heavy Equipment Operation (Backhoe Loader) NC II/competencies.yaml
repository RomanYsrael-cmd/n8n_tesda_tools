rols \n             3.2.2 Oil and air leaks \n             3.2.3 Safety devices \n             3.2.4 Working equipment function e.g. outriggers,  \n                      boom, hoist \n \n             Motor Grader and Road Roller \n             3.2.5 Unusual sounds \n \nRoad Roller \n3.2.6 Unusual emission of smoke (blue, black and \nwhite) \n4. B L O W A F check \n \n \n \n \n \n4.1 Battery (starting and charging system) \n4.2 Light (lighting system) \n4.3 Oil (lubricating system) \n4.4 Water (cooling system) \n4.5 Air (intake and exhaust system) \n4.6 Fuel (fuel system)\n\n--- PDF PAGE 43 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n5. Fluid levels \n \n \n \n \n \n5.1 Battery electrolyte (maintenance type) \n5.2 Engine oil \n5.3 Hydraulic oil \n5.4 Radiator coolant \n \nHydraulic Excavator, Wheel Loader, Motor Grader, Bulldozer, \nBackhoe Loader \n5.5 Transmission \n \nBulldozer, and Motor Grader \n5.6 Fuel  \n \nHydraulic Excavator \n5.7 Gear Oil \n6. Authorized person \n6.1 Equipment supervisor \n6.2 Equipment dispatcher/Foreman  \n6.3 Maintenance personnel\n\n--- PDF PAGE 44 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n7. Starting/ \n     Running check \n \n \n \n \n \nMay include but not limited to: \n7.1 Controls  \n         7.1.1 Travel \n \n         Wheel Loader, Bulldozer, and Motor Grader Backhoe \nLoader and Road Roller \n         7.1.2 Steering/articulation \n \n         Hydraulic Excavator, and Wheel Loader and Backhoe \nLoader \n         7.1.3 Boom \n \n         Bulldozer, Motor Grader and Road Roller \n         7.1.4 Blade \n \nBulldozer and Motor Grader \n         7.1.5 Ripper  \n         7.1.6 Attachment \n \n                 Bulldozer \n                 7.1.6.1 Drawbar \n                 7.1.6.2 Disc plow \n                 7.1.6.3 Bedder  \n  \n                 Motor Grader \n                 7.1.6.4 Ripper \n                 7.1.6.5 Scarifier \n \n         Bulldozer \n         7.1.7 Winch \n         7.1.8 Tilt/Lift \