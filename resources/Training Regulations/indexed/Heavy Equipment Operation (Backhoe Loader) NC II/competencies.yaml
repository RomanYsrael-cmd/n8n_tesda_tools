        "source_text": "--- PDF PAGE 23 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \nUNIT OF COMPETENCY: \nOBSERVE PROCEDURES, SPECIFICATIONS AND \nMANUALS OF INSTRUCTIONS \nUNIT CODE                     :\nCON311201 \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes on \nidentifying, interpreting, applying services to specifications and \nmanuals and storing manuals. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the  \nRange of Variables \n1.  Identify and access \nspecification/manuals \n \n1.1  Appropriate manuals are identified and accessed as per \njob requirements \n1.2  Version and date of manual are checked to ensure that \ncorrect specification and procedures are identified \n2.  Interpret manuals \n2.1  Relevant sections, chapters of specifications/ manuals are \nlocated in relation to the work to be conducted \n2.2  Information and procedure in the manual are interpreted in \naccordance with industry practices \n3.  Apply information in  \n     manual \n3.1  Manual is interpreted according to job requirements \n3.2  Work steps are correctly identified in accordance with \nmanufacturer's specification \n3.3  Manual data are applied according to the given task \n3.4  All correct sequencing and adjustments are interpreted in \naccordance with information contained on the manual or \nspecifications \n4.  Store manuals \n4.1  Manual or specification is stored appropriately to prevent \ndamage, ready access and updating of information when \nrequired in accordance with company requirements\n\n--- PDF PAGE 24 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.  Procedures, \nSpecifications and \nManuals of Instructions \n \n \nKinds of Manuals: \n1.1  Manufacturer's Specification Manual \n1.2  Repair Manual \n1.3  Maintenance Procedure Manual \n1.4  Periodic Maintenance Manual\n\n--- PDF PAGE 25 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n1.  Critical aspects \n     of competency \nAssessment requires that the candidate: \n1.1  Identified and accessed specification/manuals as per job \nrequirements \n1.2  Interpreted manuals in accordance with industry practices \n1.3  Applied information in manuals according to the given task \n1.4  Stored manuals in accordance with company requirements \n2.  Underpinning \nknowledge \n \n \n2.1  Types of manuals used in construction sector \n2.2  Identification of symbols used in the manuals \n2.3  Identification of units of measurements \n2.4  Unit conversion \n3.  Underpinning skills \n3.1  Reading and comprehension skills required to identify and \ninterpret construction manuals and specifications \n3.2  Accessing information and data \n4.  Resource implications \nThe following resources should be provided: \n4.1  All manuals/catalogues relative to construction  \n       sector \n5.  Methods of \nassessment \nCompetency should be assessed through: \n5.1  Direct observation  \n5.2  Questions/interview \n \nAssessment of underpinning knowledge and practical skills may \nbe combined \n6.  Context of assessment \n6.1 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines \n6.2  Assessment may be conducted in the workplace or a \nsimulated environment\n",
