ad Roller \n9.5 Implement lock switch \n9.6 Engine gull wing \n \nHydraulic Excavator and Backhoe Loader \n9.7 Swing lock \n \nHydraulic Excavator \n9.8 House lock  \n \nBackhoe Loader \n9.9 Outrigger lock \n9.10 Bucket lever lock\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \nevidence to be \nconsidered \n \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to select earthmoving equipment \nbased on the job requirements \n1.2 Demonstrates ability to check and service operator-\nserviceable (OS) parts  \n1.3 Demonstrates ability to perform walk-around and \n“BLOWAF” inspection following equipment checklist and \nwith engine stopped/not running. \n1.4 Demonstrates ability to perform walk-around check while \nengine is running. \n1.5 Demonstrates ability to follow risk-control/safe procedures \n1.6 Demonstrates ability to perform post-operation checking \nprocedures \n1.7 Demonstrates ability to accomplished daily equipment time \nrecord/report (DETR) \n2. Underpinning (related) \nknowledge and attitude\n \n \n2.1 Types and uses of personal protective equipment (PPE) \n2.2 Controls, instruments, indicators and their usage \n2.3 Start-up and shutdown procedures \n2.4 Familiarity with manufacturer’s operation manual \n2.5 Familiarity with job site and work conditions \n2.6 Familiarity with pre- and post-operation checklist \n2.7 Positive work values (cost, time, quality conscious, etc.) \n3. Underpinning skills \n \n3.1 Performing pre- and post-operation procedures of \nequipment using standard or special attachments \n3.2 Using personal protective equipment \n3.3 Maintaining equipment records \n3.4 Communicating with work site personnel and clients \n3.5 Complying with the manufacturer’s operation manual \n3.6 Accomplishing pre- and post-operation checklist \n4. Resource implications \n \nThings necessary for the conduct of assessment include \n4.1 Appropriate work area for earthmoving operation \n4.2 Access to earthmoving equipment and corresponding \nmanuals.\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n5. Method of assessment \n \nCompetency in this unit must be assessed through  \n5.1 Written/oral questioning \n5.2 Observation of practical demonstration \n5.3 Work record and documents  \n6. Context for \nassessment \n \n6.1 Competency shall be assessed in a normal or a simulated \nwork place environment and in accordance with safe work \nprocedures. \n6.2 Competency shall be assessed while work is being \nundertaken independently.\n",
