        "source_title": "MAINTAIN TOOLS AND EQUIPMENT",
        "source_text": "--- PDF PAGE 34 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT \nUNIT CODE                     :\nCON311204\nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes on \nchecking condition, performing preventive maintenance and \nstoring of tools and equipment based on the required \nperformance standards. \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the  \nRange of Variables \n1.  Check condition of \ntools and equipment \n \n1.1  Materials, tools and equipment are identified according \nto classification and job requirements \n1.2   Non-functional tools and equipment are segregated and  \n        labeled according to classification \n1.3  Safety of tools and equipment are observed in accordance \nwith manufacturer's instructions \n1.4   Condition of PPE are checked in accordance with  \n        manufacturer's instructions \n2.  Perform basic \npreventive \nmaintenance \n2.1  Appropriate lubricants are identified according to        \ntypes of equipment \n2.2  Tools and equipment are lubricated according to   \npreventive maintenance schedule or manufacturer's \nspecifications \n2.3  Measuring instruments are checked and calibrated  in  \n       accordance with manufacturer’s instructions \n2.4  Tools are cleaned and lubricated according to   \n    standard procedures \n2.5  Defective instruments, equipment and accessories are  \n       inspected and replaced according to manufacturer’s  \n       specifications \n2.6  Tools are inspected, repaired and replaced after use \n2.7  Work place is cleaned and kept in safe state in line with  \n       OHSA regulations\n\n--- PDF PAGE 35 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n3.  Store tools and \nequipment \n \n3.1  Inventory of tools, instruments and equipment are \nconducted and recorded as per company practices \n3.2  Tools and equipment are stored safely in  \n       appropriate locations in accordance with  \n       manufacturer's specifications or company  \n       procedures\n\n--- PDF PAGE 36 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1.  Materials \nIncluding but not limited to: \n1.1  Lubricants \n1.2  Cleaning materials \n1.3  Rust remover \n1.4  Rugs \n1.5  Spare parts \n2.  Tools and equipment \n \n \n \nIncluding but not limited to: \n2.1 Tools \nCutting tools - hacksaw, crosscut saw, rip saw \nBoring tools - auger, brace, grinlet, hand drill \nHolding tools - vise grip, C-clamp, bench vise \nThreading tools - die and stock, taps \n \n2.2  Measuring instruments/equipment \n3.  PPE \nIncluding but not limited to: \n3.1  Goggles \n3.2  Gloves \n3.3  Safety shoes \n3.4  Aprons/Coveralls \n4.  Forms \n4.1  Maintenance schedule forms \n4.2  Requisition slip \n4.3  Inventory Form  \n4.4  Inspection Form  \n4.5  Procedures\n\n--- PDF PAGE 37 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n1.  Critical aspects   \n      of competency \nAssessment requires that the candidate: \n1.1  Selected and used appropriate processes, tools and   \nequipment to carry out task \n1.2  Identified functional and non-functional tools and  \n       equipment  \n1.3  Checked, lubricated and calibrated tools, equipment and  \ninstruments according to manufacturer’s specifications \n1.4  Replaced defective tools, equipment and their accessories  \n1.5  Observed and applied safe handling of tools and \nequipment and safety work practices \n1.6  Prepared and submitted inventory report,  where applicable \n1.7  Maintained workplace in accordance with OHSA  \n       regulations \n1.8  Stored tools and equipment safely in appropriate locations \nand in accordance with company practices \n2.  Underpinning   \nknowledge \n \n \n \n \n \n2.1  SAFETY PRACTICES \n       2.1.1  Use of PPE \n2.1.2  Handling of tools and equipment \n2.1.3  Good housekeeping \n2.2  MATERIALS, TOOLS AND EQUIPMENT \n2.2.1  Types and uses of lubricants \n2.2.2  Types and uses of cleaning materials \n2.2.3  Types and uses of measuring instruments and \nequipment \n2.3  PREVENTIVE MAINTENANCE \n2.3.1  Methods and techniques \n2.3.2  Procedures \n \n3.  Underpinning   skills \n3.1  Preparing maintenance materials, tools and equipment \n3.2  Proper handling of tools and equipment \n3.3  Performing preventive maintenance \n3.4  Following instructions \n4.  Resource  implications \nThe following resources should be provided: \n4.1   Workplace \n4.2  Maintenance schedule \n4.3  Maintenance materials, tools and equipment relevant to the \n       proposed activity/task \n5.  Methods of \nassessment \nCompetency should be assessed through: \n5.1   Direct observation \n5.2   Written test/questioning relevant to Underpinning \n        knowledge\n\n--- PDF PAGE 38 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n \n \n \n \n \n \n6.  Context of assessment \n6.1  Competency assessment may occur in workplace or any \nappropriate  simulated environment \n6.2  Competency assessment must be undertaken in \naccordance with the endorsed TESDA  assessment \nguidelines\n",
