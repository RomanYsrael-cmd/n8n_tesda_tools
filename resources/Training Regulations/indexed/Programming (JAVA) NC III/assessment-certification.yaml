      "text": "Qualification - is a cluster of units of competencies that meets job roles and is significant in the workplace. It is also a certification awarded to a person on successful completion of a course in recognition of having demonstrated competencies in an industry sector --- PDF PAGE 51 --- _________________________________________________________________________________ Programming (Java) NC III Promulgated : June 8, 2021 49"
