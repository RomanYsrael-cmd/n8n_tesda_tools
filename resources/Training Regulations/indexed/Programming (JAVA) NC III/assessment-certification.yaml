      "number": "21",
      "text": "HTML, which stands for HyperText Markup Language - is the predominant markup language for web pages. It is written in the form of HTML elements consisting of \"tags\" surrounded by angle brackets within the web page content. It is the building blocks of all basic websites."
    },
    {
      "number": "22",
      "text": "Information – data placed in a meaningful and useful context for an end user."
