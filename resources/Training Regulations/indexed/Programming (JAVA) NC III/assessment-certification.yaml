    {
      "number": "19",
      "text": "End user – anyone who uses an information system or the information it produces."
    },
    {
      "number": "20",
      "text": "Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use."
    },
