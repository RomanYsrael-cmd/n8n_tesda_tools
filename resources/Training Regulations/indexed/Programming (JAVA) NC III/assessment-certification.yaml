  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Programming (Java) NC III, the\ncandidate must demonstrate competency in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate level III\nsigned by the TESDA Director General.\n\n4.2\nThe qualification Programming (Java) NC III may be attained by passing the\nOracle Certified Associate Java SE 8 Programmer or Java SE 8\nProgrammer I Certification Exam.\n\n4.3\nUpon submission of the Oracle Certified Associate Java SE 8\nProgrammer or Java SE 8 Programmer I (OCAJP 8) Certificate, an\nindividual shall be issued the corresponding National Certificate.\n\n4.4\nThe following are qualified to apply for certification, as long as they are\nholders of Oracle Certified Associate Java SE 8 Programmer or Java SE\n8 Programmer I (OCAJP 8) Certificate:\n\n4.4.1.\nGraduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.4.2.\nExperienced workers (wage employed or self-employed)\n\n4.5\nIndividuals who already possess National Certificate in Programming (Java)\nNC III are required to take the certification for this TR on or before the\nexpiration of their NC.\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n--- PDF PAGE 49 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated: June 8, 2021\n\n47\n"
