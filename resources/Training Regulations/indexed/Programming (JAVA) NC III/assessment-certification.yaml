      "number": "24",
      "text": "Integrated development environment (IDE) - is a software application that provides comprehensive facilities to computer programmers for software development. An IDE normally consists of a source code editor, a compiler and/or interpreter, build automation tools, and (usually) a debugger. Typically an IDE is dedicated to a specific programming language, so as to provide a feature set which most closely matches the programming paradigms of the language. However, some multiple-language IDEs are in use, such as Eclipse, ActiveState Komodo, recent versions of NetBeans, and Microsoft Visual Studio."
    },
    {
      "number": "25",
      "text": "Java - is a general-purpose, concurrent, class-based, object-oriented language that is specifically designed to have as few implementation dependencies as possible. It is intended to let application developers \"write once, run anywhere\". Java is currently one of the most popular programming languages in use, and is widely used from application software to web applications"
    },
    {
      "number": "26",
      "text": "Java applications - are typically compiled to bytecode (class file) that can run on any Java Virtual Machine (JVM) regardless of computer architecture."
    },
    {
      "number": "27",
      "text": "Local Area Network (LAN) – a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites."
    },
    {
      "number": "28",
      "text": "Microsoft .NET Framework - is a software framework that can be installed on computers running Microsoft Windows operating systems. It includes a large library of coded solutions to common programming problems and a common language infrastructure that manages the execution of programs written specifically for the framework. The .NET Framework supports multiple programming languages in a manner that allows language interoperability, whereby each language can utilize code written in other languages; in particular, the .NET library is available to all the programming languages that .NET encompasses."
    },
    {
      "number": "29",
      "text": "Microsoft SQL Server - is a relational model database server produced by Microsoft. Its primary query languages are T-SQL and ANSI SQL"
