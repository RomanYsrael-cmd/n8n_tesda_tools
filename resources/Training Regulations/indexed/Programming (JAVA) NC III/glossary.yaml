  \ area of\n      work - industry sector/occupation/job role\n   9) Critical aspects of competency - refers to the evidence\
  \ that is essential for successful\n      performance of the unit of competency\n   10) Elective Competencies - are the\
  \ additional skills and knowledge required by the\n       individual or enterprise for work\n   11) Elements - are the building\
  \ blocks of a unit of competency. They describe in\n       outcome terms the functions that a person perform in the workplace\n\
  \   12) Evidence Guide - is a component of the unit of competency that defines or identifies the\n       evidences required\
  \ to determine the competence of the individual. It provides\n       information on critical aspects of competency, underpinning\
  \ knowledge, underpinning\n       skills, resource implications, assessment method and context of assessment\n   13) Level\
  \ - refers to the category of skills and knowledge required to do a job\n   14) Method of Assessment - refers to the ways\
  \ of collecting evidence and when evidence\n       should be collected\n   15) National Certificate (NC) – is a certification\
  \ issued to individuals who achieve all the\n       required units of competency for a national qualification defined under\
  \ the Training\n       Regulations. NCs are aligned to specific levels within the PTQF\n   16) Performance Criteria - are\
  \ evaluative statements that specify what is to be           assessed\n       and the required level of performance\n  \
  \ 17) Qualification - is a cluster of units of competencies that meets job roles and is significant\n       in the workplace.\
  \ It is also a certification awarded to a person on successful completion\n       of a course in recognition of having demonstrated\
  \ competencies in an industry sector\n   18) Range of Variables - describes the circumstances or context in which the work\
  \ is to be\n       performed\n   19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s skills,\n\
