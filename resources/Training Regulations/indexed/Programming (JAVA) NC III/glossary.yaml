  \ Resource Implications - refers to the resources needed for the successful performance\n       of the work activity described\
  \ in the unit of competency. It includes work environment\n       and conditions, materials, tools and equipment\n   21)\
  \ Basic Competencies - are the skills and knowledge that everyone needs for work\n   22) Training Regulations (TR) – refers\
  \ to the document promulgated and issued by TESDA\n       consisting of competency standards, national qualifications and\
