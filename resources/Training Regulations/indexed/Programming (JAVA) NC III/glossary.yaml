  \ to the list of the skills needed to achieve the elements and\n       performance criteria in the unit of competency. It\
  \ includes generic and industry specific\n       skills\n   25) Unit of Competency – is a component of the competency standards\
  \ stating a specific\n       key function or role in a particular job or occupation; it is the smallest component of\n \
  \      achievement that can be assessed and certified under the PTQF\n   SECTOR SPECIFIC\n   1.    ADO.NET - is a set of\
  \ computer software components that programmers can use to\n         access data and data services. It is a part of the\
  \ base class library that is included with\n         the Microsoft .NET Framework. It is commonly used by programmers to\
  \ access and\n         modify data stored in relational database systems, though it can also access data in non-\n     \
  \    relational sources. ADO.NET is sometimes considered an evolution of ActiveX Data\n         Objects (ADO) technology,\
  \ but was changed so extensively that it can be considered an\n         entirely new product.\n   2.    ASP.NET - is a web\
  \ application framework developed and marketed by Microsoft to\n         allow programmers to build dynamic web sites, web\
  \ applications and web services.\n         ASP.NET is built on the Common Language Runtime (CLR), allowing programmers to\n\
  \         write ASP.NET code using any supported .NET language.\n   3.    Algorithm - is a type of effective method in which\
  \ a list of well-defined instructions for\n         completing a task will, when given an initial state, proceed through\
  \ a well-defined series\n         of successive states, eventually terminating in an end-state. The transition from one\n\
  \         state to the next is not necessarily deterministic; some algorithms, known as probabilistic\n         algorithms,\
  \ incorporate randomness.\n   4.    Artificial intelligence programmer - develops the logic the game uses to carry out a\n\
