  \ – a collection of documents or information.\n   18. Edit – to modify the form or format of data\n   19. End user – anyone\
  \ who uses an information system or the information it produces.\n   20. Ergonomics - the science and technology emphasizing\
  \ the safety, comfort, and ease of\n       use of human-operated machines. The goal of ergonomics is to produce systems\
  \ that\n       are user-friendly: safe, comfortable and easy to use.\n   21. HTML, which stands for HyperText Markup Language\
  \ - is the predominant markup\n       language for web pages. It is written in the form of HTML elements consisting of \"\
  tags\"\n       surrounded by angle brackets within the web page content. It is the building blocks of all\n       basic\
  \ websites.\n   22. Information – data placed in a meaningful and useful context for an end user.\n   23. Information and\
  \ Communication Technology (ICT) - refers to technologies associated\n       with the transmission and exchange of data\
  \ in the form of sound, text, visual images,\n       signals or any combination of those forms through the use of digital\
  \ technology. It\n       encompasses such services as telecommunications, posts, multimedia, electronic\n       commerce,\
