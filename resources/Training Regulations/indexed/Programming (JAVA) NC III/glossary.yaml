  \ consists of a source code editor, a compiler and/or interpreter, build automation\n       tools, and (usually) a debugger.\
  \ Typically an IDE is dedicated to a specific programming\n       language, so as to provide a feature set which most closely\
  \ matches the programming\n       paradigms of the language. However, some multiple-language IDEs are in use, such as\n\
  \       Eclipse, ActiveState Komodo, recent versions of NetBeans, and Microsoft Visual Studio.\n   25. Java - is a general-purpose,\
  \ concurrent, class-based, object-oriented language that is\n       specifically designed to have as few implementation\
  \ dependencies as possible. It is\n       intended to let application developers \"write once, run anywhere\". Java is currently\
  \ one\n       of the most popular programming languages in use, and is widely used from application\n       software to\
  \ web applications\n   26. Java applications - are typically compiled to bytecode (class file) that can run on any\n   \
  \    Java Virtual Machine (JVM) regardless of computer architecture.\n   27. Local Area Network (LAN) – a communications\
  \ network that typically connects\n       computers, terminals, and other computerized devices within a limited physical\
  \ area\n       such as an office, building, manufacturing plant and other work sites.\n   28. Microsoft .NET Framework -\
  \ is a software framework that can be installed on\n       computers running Microsoft Windows operating systems. It includes\
  \ a large library of\n       coded solutions to common programming problems and a common language\n       infrastructure\
  \ that manages the execution of programs written specifically for the\n       framework. The .NET Framework supports multiple\
  \ programming languages in a manner\n       that allows language interoperability, whereby each language can utilize code\
  \ written in\n       other languages; in particular, the .NET library is available to all the programming\n       languages\
  \ that .NET encompasses.\n   29. Microsoft SQL Server - is a relational model database server produced by Microsoft. Its\n\
  \       primary query languages are T-SQL and ANSI SQL\n   30. Object code - or an object file, is the representation of\
  \ code that a compiler or\n       assembler generates by processing a source code file. Object files contain compact\n \
  \      code, often called \"binaries\". A linker is typically used to generate an executable or\n       library by linking\
  \ object files together. The only essential element in an object file is\n       machine code (code directly executed by\
  \ a computer's CPU). Object files for embedded\n       systems might contain nothing but machine code. However, object files\
  \ often also\n       contain data for use by the code at runtime, relocation information, program symbols\n       (names\
  \ of variables and functions) for linking and/or debugging purposes, and other\n       debugging information.\n   31. Oracle\
  \ - the Oracle Database (commonly referred to as Oracle RDBMS or simply\n       as Oracle) is an object-relational database\
  \ management system [2] produced and\n       marketed by Oracle Corporation.\n   32. Oracle Forms - is a software product\
  \ for creating screens that interact with an Oracle\n       database. It has a typical IDE including an object navigator,\
  \ property sheet and code\n       editor that uses PL/SQL. It was originally developed to run server-side in character mode\n\
  \       terminal sessions. It was ported to other platforms, including Windows, to function in a\n       client–server environment.\
  \ Later versions were ported to Java where it runs in a Java EE\n       container and can integrate with Java and web services.\
  \ The primary focus of Forms is\n       to create data entry systems that access an Oracle database.\n   33. Oracle Reports\
  \ - is a tool for developing reports against data stored in an Oracle\n       database. Oracle Reports consists of Oracle\
  \ Reports Developer (a component of the\n       Oracle Developer Suite) and Oracle Application Server Reports Services (a\
  \ component\n       of the Oracle Application Server).\n   34. Outsourcing – turning over all or part of an organization’s\
  \ information systems operation\n       to outside contractors, known as systems integrators or facilities management\n\
  \       companies.\n   35. Programming language - is an artificial language designed to express computations\n       that\
  \ can be performed by a machine, particularly a computer. Programming languages\n       can be used to create programs that\
  \ control the behavior of a machine, to express\n       algorithms precisely, or as a mode of human communication.\n   36.\
  \ Quality Assurance – methods for ensuring that information systems are free from errors\n       and fraud and provide information\
  \ products of high quality.\n   37. Relational database management system (RDBMS) - is a database management\n       system\
  \ (DBMS) that is based on the relational model as introduced by E. F. Codd. Most\n       popular commercial and open source\
  \ databases currently in use are based on the\n       relational database model. A short definition of an RDBMS may be a\
  \ DBMS in which\n       data is stored in the form of tables and the relationship among the data is also stored in\n   \
  \    the form of tables.\n   38. Service-oriented programming (SOP) - is a programming paradigm that uses\n       \"services\"\
  \ as the unit of computer work, to design and implement integrated business\n       applications and mission critical software\
  \ programs. Services can represent steps of\n       business processes and thus one of the main applications of this paradigm\
  \ is the cost-\n       effective delivery of standalone or composite business applications that can “integrate\n       from\
  \ the inside-out.”\n   39. Software – computer programs and procedures concerned with the operation of an\n       information\
  \ system.\n   40. Source code - is any collection of statements or declarations written in some human-\n       readable\
  \ computer programming language. Source code is the means most often used\n       by programmers to specify the actions\
  \ to be performed by a computer.\n   41. SQL, often referred to as Structured Query Language - is a database computer\n\
  \       language designed for managing data in relational database management systems\n       (RDBMS), and originally based\
  \ upon relational algebra. Its scope includes data insert,\n       query, update and delete, schema creation and modification,\
  \ and data access control.\n   42. Standards – measures of performance developed to evaluate the progress of a system\n\
  \       toward its objectives\n   43. System – an assembly of methods, procedures, or techniques unified by regulated\n\
  \       interaction to form an organized whole\n   44. User- friendly – a characteristic of human-operated equipment and\
  \ systems that makes\n       them safe, comfortable, and easy to use.\n   45. User interface - is the system by which people\
  \ (users) interact with a machine. The user\n       interface includes hardware (physical) and software (logical) components.\
  \ User\n       interfaces exist for various systems, and provide a means of: 1) Input, allowing the users\n       to manipulate\
  \ a system, and/or 2) Output, allowing the system to indicate the effects of\n       the users' manipulation.\n   46. VB.NET\
  \ – is a redesigned, object-oriented dialect of Visual Basic.\n   47. Web application - is an application that is accessed\
  \ over a network such as the Internet\n       or an intranet. The term may also mean a computer software application that\
  \ is hosted in\n       a browser-controlled environment (e.g. a Java applet) or coded in a browser-supported\n       language\
  \ (such as JavaScript, combined with a browser-rendered markup language like\n       HTML) and reliant on a common web browser\
  \ to render the application executable.\n   48. Windows Forms - is the name given to the graphical application programming\
  \ interface\n       (API) included as a part of Microsoft's .NET Framework, providing access to the native\n       Microsoft\
  \ Windows interface elements by wrapping the existing Windows API in\n       managed code. While it is seen as a replacement\
  \ for the earlier and more complex C++\n       based Microsoft Foundation Class Library, it does not offer a paradigm comparable\
  \ to\n       model–view–controller.\n   49. Windows Forms application - is an event-driven application supported by Microsoft's\n\
  \       .NET Framework. Unlike a batch program, it spends most of its time simply waiting for\n       the user to do something,\
  \ such as fill in a text box or click a button."
