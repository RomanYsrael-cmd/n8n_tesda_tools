source:
  heading: DEFINITION OF TERMS
  printed_pages: 48-53
  pdf_pages: 50-55
groups:
  general:
  - number: 1
    term: Certification
    definition: is the process of verifying and validating the competencies of a person through assessment
  - number: 2
    term: Certificate of Competency (COC)
    definition: is a certification issued to individuals who pass the assessment for a single unit or cluster of units of
      competency
  - number: 3
    term: Common Competencies
    definition: are the skills and knowledge needed by all people working in a particular industry
  - number: 4
    term: Competency
    definition: is the possession and application of knowledge, skills and attitudes to perform work activities to the standard
      expected in the workplace
  - number: 5
    term: Competency Assessment
    definition: is the process of collecting evidence and making judgments on whether competency has been achieved
  - number: 6
    term: Competency Standard (CS)
    definition: is the industry-determined specification of competencies required for effective work performance
  - number: 7
    term: Context of Assessment
    definition: refers to the place where assessment is to be conducted or carried out
  - number: 8
    term: Core Competencies
    definition: are the specific skills and knowledge needed in a particular area of work - industry sector/occupation/job
      role
  - number: 9
    term: Critical aspects of competency
    definition: refers to the evidence that is essential for successful performance of the unit of competency
  - number: 10
    term: Elective Competencies
    definition: are the additional skills and knowledge required by the individual or enterprise for work
  - number: 11
    term: Elements
    definition: are the building blocks of a unit of competency. They describe in outcome terms the functions that a person
      perform in the workplace
  - number: 12
    term: Evidence Guide
    definition: is a component of the unit of competency that defines or identifies the evidences required to determine the
      competence of the individual. It provides information on critical aspects of competency, underpinning knowledge, underpinning
      skills, resource implications, assessment method and context of assessment
  - number: 13
    term: Level
    definition: refers to the category of skills and knowledge required to do a job
  - number: 14
    term: Method of Assessment
    definition: refers to the ways of collecting evidence and when evidence should be collected
  - number: 15
    term: National Certificate (NC)
    definition: is a certification issued to individuals who achieve all the required units of competency for a national qualification
      defined under the Training Regulations. NCs are aligned to specific levels within the PTQF
  - number: 16
    term: Performance Criteria
    definition: are evaluative statements that specify what is to be assessed and the required level of performance
  - number: 17
    term: Qualification
    definition: is a cluster of units of competencies that meets job roles and is significant in the workplace. It is also
      a certification awarded to a person on successful completion of a course in recognition of having demonstrated competencies
      in an industry sector
  - number: 18
    term: Range of Variables
    definition: describes the circumstances or context in which the work is to be performed
  - number: 19
    term: Recognition of Prior Learning (RPL)
    definition: is the acknowledgement of an individual’s skills, knowledge and attitudes gained from life and work experiences
      outside registered training programs
  - number: 20
    term: Resource Implications
    definition: refers to the resources needed for the successful performance of the work activity described in the unit of
      competency. It includes work environment and conditions, materials, tools and equipment
  - number: 21
    term: Basic Competencies
    definition: are the skills and knowledge that everyone needs for work
  - number: 22
    term: Training Regulations (TR)
    definition: refers to the document promulgated and issued by TESDA consisting of competency standards, national qualifications
      and training guidelines for specific sectors/occupations. The TR serves as basis for establishment of qualification
      and certification under the PTQF. It also serves as guide for development of competency-based curricula and instructional
      materials including registration of TVET programs offered by TVET providers
  - number: 23
    term: Underpinning Knowledge
    definition: refers to the competency that involves in applying knowledge to perform work activities. It includes specific
      knowledge that is essential to the performance of the competency
  - number: 24
    term: Underpinning Skills
    definition: refers to the list of the skills needed to achieve the elements and performance criteria in the unit of competency.
      It includes generic and industry specific skills
  - number: 25
    term: Unit of Competency
    definition: is a component of the competency standards stating a specific key function or role in a particular job or
      occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF
  sector_specific:
  - number: 1
    term: ADO.NET
    definition: is a set of computer software components that programmers can use to access data and data services. It is
      a part of the base class library that is included with the Microsoft .NET Framework. It is commonly used by programmers
      to access and modify data stored in relational database systems, though it can also access data in non- relational sources.
      ADO.NET is sometimes considered an evolution of ActiveX Data Objects (ADO) technology, but was changed so extensively
      that it can be considered an entirely new product.
  - number: 2
    term: ASP.NET
    definition: is a web application framework developed and marketed by Microsoft to allow programmers to build dynamic web
      sites, web applications and web services. ASP.NET is built on the Common Language Runtime (CLR), allowing programmers
      to write ASP.NET code using any supported .NET language.
  - number: 3
    term: Algorithm
    definition: is a type of effective method in which a list of well-defined instructions for completing a task will, when
      given an initial state, proceed through a well-defined series of successive states, eventually terminating in an end-state.
      The transition from one state to the next is not necessarily deterministic; some algorithms, known as probabilistic
      algorithms, incorporate randomness.
  - number: 4
    term: Artificial intelligence programmer
    definition: develops the logic the game uses to carry out a large number of actions. An AI programmer may program pathfinding,
      strategy and enemy tactic systems. This is one of the most challenging aspects of game programming and its sophistication
      is developing rapidly.
  - number: 5
    term: Browser
    definition: a software package that provides the user interface for accessing Internet, intranet and extranet Web sites.
  - number: 6
    term: COBOL
    definition: is one of the oldest programming languages. Its name is an acronym for COmmon Business-Oriented Language,
      defining its primary domain in business, finance, and administrative systems for companies and governments.
  - number: 7
    term: Compiler
    definition: is a computer program (or set of programs) that transforms source code written in a programming language (the
      source language) into another computer language (the target language, often having a binary form known as object code).
      The most common reason for wanting to transform source code is to create an executable program.
  - number: 8
    term: Computer
    definition: a device that has the ability to accept data; internally store and execute a program of instructions; perform
      mathematical, logical, and manipulative operations on data; and report the results.
  - number: 9
    term: Computer program
    definition: also a software program, or just a program, is a sequence of instructions written to perform a specified task
      for a computer. A computer requires programs to function, typically executing the program's instructions in a central
      processor. The program has an executable form that the computer can use directly to execute the instructions. The same
      program in its human-readable source code form, from which executable programs are derived (e.g., compiled), enables
      a programmer to study and develop its algorithms.
  - number: 10
    term: Computer programming
    definition: is the iterative process of writing or editing source code. Editing source code involves testing, analyzing,
      and refining, and sometimes coordinating with other programmers on a jointly developed program. A person who practices
      this skill is referred to as a computer programmer, software developer or coder. The sometimes lengthy process of computer
      programming is usually referred to as software development.
  - number: 11
    term: Computer Terminal
    definition: any input/output device connected by telecommunications links to a computer.
  - number: 12
    term: C language
    definition: is an imperative (procedural) systems implementation language. It was designed to be compiled using a relatively
      straightforward compiler, to provide low-level access to memory, to provide language constructs that map efficiently
      to machine instructions, and to require minimal run-time support. C was therefore useful for many applications that
      had formerly been coded in assembly language.
  - number: 13
    term: C++ language
    definition: is a statically typed, free-form, multi-paradigm, compiled, general- purpose programming language. It comprises
      a combination of both high-level and low- level language features. Some of its application domains include systems software,
      application software, device drivers, embedded software, high-performance server and client applications, and entertainment
      software such as video games.
  - number: 14
    term: Data
    definition: objective measurements of the attributes (characteristics) of entities such as people, places, things, and
      events.
  - number: 15
    term: Data access
    definition: typically refers to software and activities related to storing, retrieving, or acting on data housed in a
      database or other repository. Historically, different methods and languages were required for every repository, including
      each different database, file system, etc., and many of these repositories stored their content in different and incompatible
      formats.
  - number: 16
    term: Decompiler
    definition: is the name given to a computer program that performs the reverse operation to that of a compiler. That is,
      it translates a file containing information at a relatively low level of abstraction (usually designed to be computer
      readable rather than human readable) into a form having a higher level of abstraction (usually designed to be human
      readable)
  - number: 17
    term: Documentation
    definition: a collection of documents or information.
  - number: 18
    term: Edit
    definition: to modify the form or format of data
  - number: 19
    term: End user
    definition: anyone who uses an information system or the information it produces.
  - number: 20
    term: Ergonomics
    definition: 'the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The
      goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use.'
  - number: 21
    term: HTML, which stands for HyperText Markup Language
    definition: is the predominant markup language for web pages. It is written in the form of HTML elements consisting of
      "tags" surrounded by angle brackets within the web page content. It is the building blocks of all basic websites.
  - number: 22
    term: Information
    definition: data placed in a meaningful and useful context for an end user.
  - number: 23
    term: Information and Communication Technology (ICT)
    definition: refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual
      images, signals or any combination of those forms through the use of digital technology. It encompasses such services
      as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology.
  - number: 24
    term: Integrated development environment (IDE)
    definition: is a software application that provides comprehensive facilities to computer programmers for software development.
      An IDE normally consists of a source code editor, a compiler and/or interpreter, build automation tools, and (usually)
      a debugger. Typically an IDE is dedicated to a specific programming language, so as to provide a feature set which most
      closely matches the programming paradigms of the language. However, some multiple-language IDEs are in use, such as
      Eclipse, ActiveState Komodo, recent versions of NetBeans, and Microsoft Visual Studio.
  - number: 25
    term: Java
    definition: is a general-purpose, concurrent, class-based, object-oriented language that is specifically designed to have
      as few implementation dependencies as possible. It is intended to let application developers "write once, run anywhere".
      Java is currently one of the most popular programming languages in use, and is widely used from application software
      to web applications
  - number: 26
    term: Java applications
    definition: are typically compiled to bytecode (class file) that can run on any Java Virtual Machine (JVM) regardless
      of computer architecture.
  - number: 27
    term: Local Area Network (LAN)
    definition: a communications network that typically connects computers, terminals, and other computerized devices within
      a limited physical area such as an office, building, manufacturing plant and other work sites.
  - number: 28
    term: Microsoft .NET Framework
    definition: is a software framework that can be installed on computers running Microsoft Windows operating systems. It
      includes a large library of coded solutions to common programming problems and a common language infrastructure that
      manages the execution of programs written specifically for the framework. The .NET Framework supports multiple programming
      languages in a manner that allows language interoperability, whereby each language can utilize code written in other
      languages; in particular, the .NET library is available to all the programming languages that .NET encompasses.
  - number: 29
    term: Microsoft SQL Server
    definition: is a relational model database server produced by Microsoft. Its primary query languages are T-SQL and ANSI
      SQL
  - number: 30
    term: Object code
    definition: or an object file, is the representation of code that a compiler or assembler generates by processing a source
      code file. Object files contain compact code, often called "binaries". A linker is typically used to generate an executable
      or library by linking object files together. The only essential element in an object file is machine code (code directly
      executed by a computer's CPU). Object files for embedded systems might contain nothing but machine code. However, object
      files often also contain data for use by the code at runtime, relocation information, program symbols (names of variables
      and functions) for linking and/or debugging purposes, and other debugging information.
  - number: 31
    term: Oracle
    definition: the Oracle Database (commonly referred to as Oracle RDBMS or simply as Oracle) is an object-relational database
      management system [2] produced and marketed by Oracle Corporation.
  - number: 32
    term: Oracle Forms
    definition: is a software product for creating screens that interact with an Oracle database. It has a typical IDE including
      an object navigator, property sheet and code editor that uses PL/SQL. It was originally developed to run server-side
      in character mode terminal sessions. It was ported to other platforms, including Windows, to function in a client–server
      environment. Later versions were ported to Java where it runs in a Java EE container and can integrate with Java and
      web services. The primary focus of Forms is to create data entry systems that access an Oracle database.
  - number: 33
    term: Oracle Reports
    definition: is a tool for developing reports against data stored in an Oracle database. Oracle Reports consists of Oracle
      Reports Developer (a component of the Oracle Developer Suite) and Oracle Application Server Reports Services (a component
      of the Oracle Application Server).
  - number: 34
    term: Outsourcing
    definition: turning over all or part of an organization’s information systems operation to outside contractors, known
      as systems integrators or facilities management companies.
  - number: 35
    term: Programming language
    definition: is an artificial language designed to express computations that can be performed by a machine, particularly
      a computer. Programming languages can be used to create programs that control the behavior of a machine, to express
      algorithms precisely, or as a mode of human communication.
  - number: 36
    term: Quality Assurance
    definition: methods for ensuring that information systems are free from errors and fraud and provide information products
      of high quality.
  - number: 37
    term: Relational database management system (RDBMS)
    definition: is a database management system (DBMS) that is based on the relational model as introduced by E. F. Codd.
      Most popular commercial and open source databases currently in use are based on the relational database model. A short
      definition of an RDBMS may be a DBMS in which data is stored in the form of tables and the relationship among the data
      is also stored in the form of tables.
  - number: 38
    term: Service-oriented programming (SOP)
    definition: is a programming paradigm that uses "services" as the unit of computer work, to design and implement integrated
      business applications and mission critical software programs. Services can represent steps of business processes and
      thus one of the main applications of this paradigm is the cost- effective delivery of standalone or composite business
      applications that can “integrate from the inside-out.”
  - number: 39
    term: Software
    definition: computer programs and procedures concerned with the operation of an information system.
  - number: 40
    term: Source code
    definition: is any collection of statements or declarations written in some human- readable computer programming language.
      Source code is the means most often used by programmers to specify the actions to be performed by a computer.
  - number: 41
    term: SQL, often referred to as Structured Query Language
    definition: is a database computer language designed for managing data in relational database management systems (RDBMS),
      and originally based upon relational algebra. Its scope includes data insert, query, update and delete, schema creation
      and modification, and data access control.
  - number: 42
    term: Standards
    definition: measures of performance developed to evaluate the progress of a system toward its objectives
  - number: 43
    term: System
    definition: an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole
  - number: 44
    term: User- friendly
    definition: a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use.
  - number: 45
    term: User interface
    definition: 'is the system by which people (users) interact with a machine. The user interface includes hardware (physical)
      and software (logical) components. User interfaces exist for various systems, and provide a means of: 1) Input, allowing
      the users to manipulate a system, and/or 2) Output, allowing the system to indicate the effects of the users'' manipulation.'
  - number: 46
    term: VB.NET
    definition: is a redesigned, object-oriented dialect of Visual Basic.
  - number: 47
    term: Web application
    definition: is an application that is accessed over a network such as the Internet or an intranet. The term may also mean
      a computer software application that is hosted in a browser-controlled environment (e.g. a Java applet) or coded in
      a browser-supported language (such as JavaScript, combined with a browser-rendered markup language like HTML) and reliant
      on a common web browser to render the application executable.
  - number: 48
    term: Windows Forms
    definition: is the name given to the graphical application programming interface (API) included as a part of Microsoft's
      .NET Framework, providing access to the native Microsoft Windows interface elements by wrapping the existing Windows
      API in managed code. While it is seen as a replacement for the earlier and more complex C++ based Microsoft Foundation
      Class Library, it does not offer a paradigm comparable to model–view–controller.
  - number: 49
    term: Windows Forms application
    definition: is an event-driven application supported by Microsoft's .NET Framework. Unlike a batch program, it spends
      most of its time simply waiting for the user to do something, such as fill in a text box or click a button.
