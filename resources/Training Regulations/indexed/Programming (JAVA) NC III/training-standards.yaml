  \                          level\n3.2.   TRAINING DELIVERY\n          The delivery of training should adhere to the design\
  \ of the curriculum. Delivery\n       should be guided by the 10 basic principles of the competency-based TVET.\n      \
  \    • The training is based on curriculum developed from the competency\n             standards;\n          • Learning\
  \ is modular in its structure;\n          • Training delivery is individualized and self-paced;\n          • Training is\
  \ based on work that must be performed;\n          • Training materials are directly related to the competency standards\
  \ and the\n             curriculum modules;\n          • Assessment is based in the collection of evidence of the performance\
  \ of\n             work to the industry required standard;\n          • Training is based both on and off-the-job components;\n\
  \          • Allows for recognition of prior learning (RPL) or current competencies;\n          • Training allows for multiple\
  \ entry and exit; and\n          • Approved training programs are nationally accredited.\n          The competency-based\
  \ TVET system recognizes various types of delivery\n       modes, both on and off-the-job as long as the learning is driven\
  \ by the\n       competency standards specified by the industry. The following training modalities\n       may be adopted\
  \ when designing training programs:\n          • The dualized mode of training delivery is preferred and recommended.\n\
  \             Thus programs would contain both in-school and in-industry training or\n             fieldwork components.\
  \ Details can be referred to the Dual Training System\n             (DTS) Implementing Rules and Regulations.\n        \
  \  • Modular/self-paced learning is a competency-based training modality\n             wherein the trainee is allowed to\
  \ progress at his own pace. The trainer\n             facilities the training delivery.\n          • Peer teaching/mentoring\
  \ is a training modality wherein fast learners are\n             given the opportunity to assist the slow learners.\n  \
  \        • Supervised industry training or on-the-job training is an approach in training\n             designed to enhance\
  \ the knowledge and skills of the trainee through actual\n             experience in the workplace to acquire a specific\
  \ competencies prescribed\n             in the training regulations.\n          • Distance learning is a formal education\
  \ process in which majority of the\n             instruction occurs when the students and instructors are not in the same\n\
  \             place. Distance learning may employ correspondence study, or audio,\n             video or computer technologies.\n\
  3.3.                 TRAINEE ENTRY REQUIREMENTS\n                        Trainees or students should possess the following\
  \ requirements:\n                           • Must have completed at least 10 yrs. basic education or an ALS grade\n   \
  \                           10 certificate of rating holder Must have completed at least 10 yrs. basic\n               \
  \               education or an ALS grade 10 certificate of rating holder\n                           • can communicate\
  \ either oral or written;\n                           • with basic computer skills\n                        This list does\
  \ not include specific institutional requirements such as\n                     educational attainment, appropriate work\
  \ experience, and others that may be\n                     required of the trainees by the school or training center delivering\
  \ the TVET\n                     program.\n3.4.                 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n               \
