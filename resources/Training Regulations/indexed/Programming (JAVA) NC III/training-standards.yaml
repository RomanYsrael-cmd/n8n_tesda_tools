  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Programming (Java) NC III.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Java Programming\n\nNC Level:\nNC III\n\nNominal Training Duration:\n 64 hrs – Basic Competencies\n\n 16 hrs – Common Competencies\n\n 160 hrs – Core Competencies\n\n ---------------------\n\n240 hours\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\nprogrammer in accordance with industry standards. It covers the basic, common & core\ncompetencies on programming language, specifically Java. The nominal duration of 240\nhours covers the required units at Java Programming NC III. TVET providers can\nhowever, offer a longer, ladderized course covering the basic, common and core plus\nspecialized competency unit/s.\n\nBASIC COMPETENCIES\n64 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace processes.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and\ncommunicate issues\narising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team\nleadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 43 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated: June 8, 2021\n\n41\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in\nplanning negotiations\n3.2 Participate in\nnegotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the\npossible cause/s of the\nproblem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques\nto solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain/enhance\nrelevant technology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n16 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply\nQuality\nStandards\n1.1 Asses quality of\nreceived materials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n▪ Field trip\n▪ Symposium\n▪ Film showing\n▪ Simulation\n▪ On the job\ntraining\n▪ Demonstration &\nquestioning\n▪ Observation &\nquestioning\n▪ Third party\nreport\n2. Operate a\nPersonal\nComputer\n2.1 Plan and prepare for task\nto be undertaken\n2.2 Input data into computer\n2.3 Access information using\ncomputer\n2.4 Produce output/data using\ncomputer system\n2.5 Use basic functions of a\nweb browser to locate\ninformation\n2.6 Maintain computer\nequipment and systems\n• Modular\n• Film showing\n• Computer based\ntraining (e-\nlearning)\n• Project method\n• On the job\ntraining\n\n• Demonstration &\nquestioning\n• Observation &\nquestioning\n• Third party report\n• Assessment of\noutput product\n• Portfolio\n• Computer- based\nassessment\n\n--- PDF PAGE 44 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated: June 8, 2021\n\n42\nCORE COMPETENCIES\n160 hrs.\n\nUnit of Competency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Perform object-\noriented analysis\nand design in\nJava technology\n\n1.1 Apply basics of Java\nlanguage\n1.2 Work with methods and\nencapsulation\n1.3 Work with inheritance\nand handling exceptions.\n1.4 Examine object-oriented\nconcepts and\nterminology\n1.5 Explain modeling and\nsoftware development\nprocess\n1.6 Create Use Case\nDiagrams and Use Case\nScenarios\n1.7 Transition analysis to\ndesign using Interaction\nDiagrams\n1.8 Introduce Architectural\nConcepts and\nArchitecture Tiers\nDiagrams\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n\n• Practical exam\n• Interviews/\nquestioning\n\n2. Create and fine\ntune Java\ntechnology\napplications using\nobject-oriented\nprogramming\nconcept\n\n2.1 Apply Basics of Java\nClass Design\n2.2 Apply Java Advance\nClass Design and\nObject Oriented Design\nPrinciples\n2.3 Apply string processing,\nexceptions and\nassertions\n2.4 Build database\napplications with JDBC\n2.5 Monitor operating\nsystem performance\n2.6 Work with language\nlevel concerns and\ngarbage collection\n2.7 Work with performance\ntuning at the language\nlevel\n\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n\n• Practical exam\n• Interviews/\nquestioning\n\n--- PDF PAGE 45 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated: June 8, 2021\n\n43\n3.2.\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of the competency-based TVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilities the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire a specific competencies prescribed\nin the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 46 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated: June 8, 2021\n\n44\n3.3.\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n• Must have completed at least 10 yrs. basic education or an ALS grade\n10 certificate of rating holder Must have completed at least 10 yrs. basic\neducation or an ALS grade 10 certificate of rating holder\n• can communicate either oral or written;\n• with basic computer skills\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4.\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the conduct of training in\nProgramming (Java) NC III\nTOOLS\nEQUIPMENT\nMATERIALS\nQty\nDescription\nQty\nDescription\nQty\nDescription\nAs required\nComputer Software\ne.g.\n - IDE\n - Libraries\n15\nNetwork Computer with\nperipherals\nAs required\nLearning materials/\nguide\n1\nServer\nPractice materials\n1\nPrinter\nHand-outs\n1\nWhite board\nReference books\n1\nInternet access\n1\nLCD Projector and screen\n\nAs\nrequired\nApplication servers\ne.g. - database\n - web\n15\nErgonomic computer\ntables and chairs\n\nThe quantity of tools and equipment to be used for the conduct of training for this\nqualification shall depend on the number of students, size of the class, and/or modality of\ntraining. The most important consideration is to make sure that tools and equipment are\nadequately provided to all trainees when needed. The actual list of tools, equipment,\nmachines, supplies and other materials to be used shall be identified and detailed in the\nCompetency Based Curriculum (CBC) to be submitted by the TVET provider when\nregistering a course or training program with TESDA.\n\nDue to the fast-changing nature of the Information and Communications\nTechnology (ICT) sector, TVET providers are reminded to use and provide their trainees\nwith the latest technology tools, equipment and materials where appropriate and\napplicable.\n\nIn cases where there are specialized tools, equipment and facilities that are\nnot generally considered standard requirements or not absolute requisites for training,\nthe industry working group or TESDA may provide guidelines or specific advice on such\nmatters.\n\n--- PDF PAGE 47 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated: June 8, 2021\n\n45\n3.5.\nTRAINING FACILITIES\n\nThe Programming workshop must be of concrete structure. Based on class size of\n15 student/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nComputer laboratory\n6 x 8\n48\n1\n48\nLearning Resource Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n2 x 5\n10\n2\n20\n Total\n128\nFacilities / Equipment /\nCirculation**\n\n38\nTotal Area\n166\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6.\nTRAINERS QUALIFICATION\nProgramming (Java) NC III\n\n•\nMust be Oracle Certified Associate Java SE 8 Programmer or Java SE 8\nProgrammer I (OCAJP 8)\n•\nMust be a holder of National TVET Trainer’s Certificate (NTTC) Level 1 in\nProgramming (Java) NC III\n•\nMust be physically & mentally fit.\n\n3.7.\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency. The institutional assessment is administered by the\ntrainer/assessor.\n\nThe result of the institutional assessment may be considered as an\nevidence for national assessment.\n\n--- PDF PAGE 48 ---\n_________________________________________________________________________________\nTR – Programming (Java) NC III Promulgated: June 8, 2021\n\n46"
