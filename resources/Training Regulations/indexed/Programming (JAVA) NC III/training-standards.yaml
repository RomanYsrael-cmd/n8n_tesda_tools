  \             - web\n        The quantity of tools and equipment to be used for the conduct of training for this\nqualification\
  \ shall depend on the number of students, size of the class, and/or modality of\ntraining. The most important consideration\
  \ is to make sure that tools and equipment are\nadequately provided to all trainees when needed. The actual list of tools,\
  \ equipment,\nmachines, supplies and other materials to be used shall be identified and detailed in the\nCompetency Based\
  \ Curriculum (CBC) to be submitted by the TVET provider when\nregistering a course or training program with TESDA.\n   \
  \    Due to the fast-changing nature of the Information and Communications\nTechnology (ICT) sector, TVET providers are\
  \ reminded to use and provide their trainees\nwith the latest technology tools, equipment and materials where appropriate\
  \ and\napplicable.\n       In cases where there are specialized tools, equipment and facilities that are\nnot generally\
  \ considered standard requirements or not absolute requisites for training,\nthe industry working group or TESDA may provide\
  \ guidelines or specific advice on such\nmatters.\n3.5.   TRAINING FACILITIES\n       The Programming workshop must be of\
