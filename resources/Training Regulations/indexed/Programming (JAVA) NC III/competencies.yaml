  - unit_code: '500311111'
    title: Develop and practice negotiation skills
    printed_pages: 10-12
    pdf_pages: 12-14
    descriptor: This unit covers the skills, knowledge and attitudes required to collect information in order to negotiate
      to a desired outcome and participate in the negotiation.
    elements:
    - number: 1
      title: Plan negotiations
      performance_criteria:
      - number: '1.1'
        text: Information on preparing for negotiation is identified and included in the plan
      - number: '1.2'
        text: Information on creating non verbal environments for positive negotiating is identified and included in the plan
      - number: '1.3'
        text: Information on active listening is identified and included in the plan
      - number: '1.4'
        text: Information on different questioning techniques is identified and included in the plan
      - number: '1.5'
        text: Information is checked to ensure it is correct and up- to- date
    - number: 2
      title: Participate in negotiations
      performance_criteria:
      - number: '2.1'
        text: Criteria for successful outcome are agreed upon by all parties
      - number: '2.2'
        text: Desired outcome of all parties are considered
      - number: '2.3'
        text: Appropriate language is used throughout the negotiation
      - number: '2.4'
        text: A variety of questioning techniques are used
      - number: '2.5'
        text: The issues and processes are documented and agreed upon by all parties
      - number: '2.6'
        text: Possible solutions are discussed and their viability assessed
      - number: '2.7'
        text: Areas for agreement are confirmed and recorded
      - number: '2.8'
        text: Follow-up action is agreed upon by all parties
