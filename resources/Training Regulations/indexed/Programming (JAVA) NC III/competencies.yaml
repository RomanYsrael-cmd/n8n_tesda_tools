  - unit_code: '506315202'
    title: Apply quality standards
    printed_pages: 23-25
    pdf_pages: 25-27
    descriptor: This unit covers the knowledge, skills, attitudes and values needed to apply quality standards in the workplace.
      The unit also includes the application of relevant safety procedures and regulations, organization procedures and customer
      requirements.
    elements:
    - number: 1
      title: Assess quality of received materials
      performance_criteria:
      - number: '1.1'
        text: Work instruction is obtained and work is carried out in accordance with standard operating procedures.
      - number: '1.2'
        text: Received materials are checked against workplace standards and specifications.
      - number: '1.3'
        text: Faulty materials related to work are identified and isolated.
      - number: '1.4'
        text: Faults and any identified causes are recorded and/or reported to the supervisor concerned in accordance with
          workplace procedures.
      - number: '1.5'
        text: Faulty materials are replaced in accordance with workplace procedures.
    - number: 2
      title: Assess own work
      performance_criteria:
      - number: '2.1'
        text: Documentation relative to quality within the company is identified and used.
      - number: '2.2'
        text: Completed work is checked against workplace standards relevant to the task undertaken.
      - number: '2.3'
        text: Errors are identified and isolated.
      - number: '2.4'
        text: Information on the quality and other indicators of production performance are recorded in accordance with workplace
          procedures.
      - number: '2.5'
        text: In cases of deviations from specific quality standards, causes are documented and reported in accordance with
          the workplace’ s standards operating procedures.
    - number: 3
      title: Engage in quality improvement
      performance_criteria:
      - number: '3.1'
        text: Process improvement procedures are participated in relative to workplace assignment.
      - number: '3.2'
        text: Work is carried out in accordance with process improvement procedures.
      - number: '3.3'
        text: Performance of operation or quality of product of service to ensure customer satisfaction is monitored.
