    descriptor: This unit of covers the knowledge, skills and attitudes required to solve problems in the workplace including
      the application of problem solving techniques and to determine and resolve the root cause of problems.
    elements:
    - number: 1
      title: Identify the problem
      performance_criteria:
      - number: '1.1'
        text: Variances are identified from normal operating parameters; and product quality
      - number: '1.2'
        text: Extent, cause and nature are of the problem are defined through observation, investigation and analytical techniques
      - number: '1.3'
        text: Problems are clearly stated and specified
    - number: 2
      title: Determine fundamental causes of the problem
      performance_criteria:
      - number: '2.1'
        text: Possible causes are identified based on experience and the use of problem solving tools / analytical techniques.
      - number: '2.2'
        text: Possible cause statements are developed based on findings
      - number: '2.3'
        text: Fundamental causes are identified per results of investigation conducted
    - number: 3
      title: Determine corrective action
      performance_criteria:
      - number: '3.1'
        text: All possible options are considered for resolution of the problem
      - number: '3.2'
        text: Strengths and weaknesses of possible options are considered
      - number: '3.3'
        text: Corrective actions are determined to resolve the problem and possible future causes
      - number: '3.4'
        text: Action plans are developed identifying measurable objectives, resource needs and timelines in accordance with
          safety and operating procedures
    - number: 4
      title: Provide recommendations to manager
      performance_criteria:
      - number: '4.1'
        text: Report on recommendations are prepared
      - number: '4.2'
        text: Recommendations are presented to appropriate personnel.
      - number: '4.3'
        text: Recommendations are followed-up, if required
