  - unit_code: '500311109'
    title: Lead workplace communication
    printed_pages: 4-6
    pdf_pages: 6-8
    descriptor: This unit covers the knowledge, skills and attitudes required to lead in the dissemination and discussion
      of ideas, information and issues in the workplace.
    elements:
    - number: 1
      title: Communicate information about workplace processes
      performance_criteria:
      - number: '1.1'
        text: Appropriate communication method is selected
      - number: '1.2'
        text: Multiple operations involving several topics areas are communicated accordingly
      - number: '1.3'
        text: Questions are used to gain extra information
      - number: '1.4'
        text: Correct sources of information are identified
      - number: '1.5'
        text: Information is selected and organized correctly
      - number: '1.6'
        text: Verbal and written reporting is undertaken when required
      - number: '1.7'
        text: Communication skills are maintained in all situations
    - number: 2
      title: Lead workplace discussions
      performance_criteria:
      - number: '2.1'
        text: Response to workplace issues are sought
      - number: '2.2'
        text: Response to workplace issues are provided immediately
      - number: '2.3'
        text: Constructive contributions are made to workplace discussions on such issues as production, quality and safety
      - number: '2.4'
        text: Goals/objectives and action plan undertaken in the workplace are communicated
    - number: 3
      title: Identify and communicate issues arising in the workplace
      performance_criteria:
      - number: '3.1'
        text: Issues and problems are identified as they arise
      - number: '3.2'
        text: Information regarding problems and issues are organized coherently to ensure clear and effective communication
      - number: '3.3'
        text: Dialogue is initiated with appropriate personnel
      - number: '3.4'
        text: Communication problems and issues are raised as they arise
