  - unit_code: '506311203'
    title: Perform computer operations
    printed_pages: 26-29
    pdf_pages: 28-31
    descriptor: This unit covers the knowledge, skills, attitudes and values needed to perform computer operations which include
      inputting, accessing, producing and transferring data using the appropriate hardware and software.
    elements:
    - number: 1
      title: Plan and prepare for task to be undertaken
      performance_criteria:
      - number: '1.1'
        text: Requirements of task are determined in accordance with the required output.
      - number: '1.2'
        text: Appropriate hardware and software are selected according to task assigned and required outcome.
      - number: '1.3'
        text: Task is planned to ensure that OH & S guidelines and procedures are followed.
      - number: '1.4'
        text: Client -specific guidelines and procedures are followed.
      - number: '1.5'
        text: Required data security guidelines are applied in accordance with existing procedures.
    - number: 2
      title: Input data into computer
      performance_criteria:
      - number: '2.1'
        text: Data are entered into the computer using appropriate program/application in accordance with company procedures.
      - number: '2.2'
        text: Accuracy of information is checked and information is saved in accordance with standard operating procedures.
      - number: '2.3'
        text: Inputted data is stored in storage media according to requirements.
      - number: '2.4'
        text: Work is performed within ergonomic guidelines.
    - number: 3
      title: Access information using computer
      performance_criteria:
      - number: '3.1'
        text: Correct program/application is selected based on job requirements.
      - number: '3.2'
        text: Program/application containing the information required is accessed according to company procedures.
