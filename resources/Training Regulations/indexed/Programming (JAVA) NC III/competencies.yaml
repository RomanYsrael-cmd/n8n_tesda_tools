  core:
  - unit_code: ICT313359
    title: Perform object-oriented analysis and design in Java technology
    printed_pages: 30-34
    pdf_pages: 32-36
    descriptor: This unit covers the knowledge, skills and attitude needed to use various Java programming language constructs
      to create several Java technology applications. Specifically, it consist of competencies in applying basics of Java
      language, working with methods and encapsulation, and working with inheritance and handling exceptions. It also focuses
      on effectively using object-oriented technologies and the use of software modeling, as applied to a software development
      process. Students will learn to present one practical & complete object-oriented analysis and design (OOAD) roadmap,
      and will get hands-on experience, from requirements gathering to system design.
    elements:
    - number: 1
      title: Apply basics of Java language
      performance_criteria:
      - number: '1.1'
        text: Executable Java applications are created in accordance with Java framework
      - number: '1.2'
        text: Java packages are imported to make them accessible in the code
      - number: '1.3'
        text: Working with Java Data types is demonstrated in accordance with Java framework
      - number: '1.4'
        text: Using Operators and Decision Constructs is demonstrated in accordance with Java framework
      - number: '1.5'
        text: Creating and Using Arrays is demonstrated in accordance with Java framework
      - number: '1.6'
        text: Using Loop Constructs is demonstrated in accordance with Java framework
    - number: 2
      title: Work with methods and encapsulation
      performance_criteria:
      - number: '2.1'
        text: Methods with arguments and return values are created in accordance with Java framework
      - number: '2.2'
        text: Static keywords are applied to methods and fields in accordance with Java framework
      - number: '2.3'
        text: Overloaded method is created in accordance with Java framework
      - number: '2.4'
        text: Access modifiers are applied in accordance with Java framework
      - number: '2.5'
        text: Encapsulation principled are applied to a class in accordance with Java framework
    - number: 3
      title: Work with inheritance and handling exceptions
      performance_criteria:
      - number: '3.1'
        text: Inheritance is implemented in accordance with Java framework
      - number: '3.2'
        text: Code that demonstrates the use of polymorphism is developed in accordance with Java framework
      - number: '3.3'
        text: Super and this syntax are used to access objects and constructors in accordance with Java framework
      - number: '3.4'
        text: Abstract classes and interfaces are used in accordance with Java framework
      - number: '3.5'
        text: How exceptions alter normal program flow are determined by creating a try-catch block.
    - number: 4
      title: Examine object-oriented concepts and terminology
      performance_criteria:
      - number: '4.1'
        text: Important object-oriented (OO) concepts are described in accordance with Java framework
      - number: '4.2'
        text: Fundamental OO terminology are defined in accordance with Java framework
    - number: 5
      title: Explain modeling and software development process
      performance_criteria:
      - number: '5.1'
        text: Object-Oriented Software Development (OOSD) process is explained in accordance with Java framework
      - number: '5.2'
        text: Benefits of modeling software are explained in accordance with Java framework
      - number: '5.3'
        text: Purpose, activities, and artifacts of the following OOSD workflows (disciplines) are explained
    - number: 6
      title: Create Use Case Diagrams and Use Case Scenarios
      performance_criteria:
      - number: '6.1'
        text: The need for a Use Case Diagram is justified in accordance with Java framework
      - number: '6.2'
        text: Use Case Diagram for a software system is developed based on the goals of the business owner
      - number: '6.3'
        text: Use Case Diagrams is developed based on the goals of all the stakeholders
      - number: '6.4'
        text: Use Case form is created describing a summary of the scenarios in the main and alternate flows
    - number: 7
      title: Transition analysis to design using Interaction Diagrams
      performance_criteria:
      - number: '7.1'
        text: Purpose and elements of the Design model are explained in accordance with Java framework
      - number: '7.2'
        text: Essential elements of a UML Communication diagram are identified in accordance with Java framework
      - number: '7.3'
        text: Communication diagram view of the Design model is created in accordance with Java framework
      - number: '7.4'
        text: Sequence diagram view of the Design model is created in accordance with Java framework
    - number: 8
      title: Introduce Architectural Concepts and Architecture Tiers Diagrams
      performance_criteria:
      - number: '8.1'
        text: Difference between architecture and design is distinguished in accordance with Java framework
      - number: '8.2'
        text: Tiers, layers, and systemic qualities are described in accordance with Java framework
      - number: '8.3'
        text: Architecture workflow is described in accordance with Java framework
      - number: '8.4'
        text: Architecture Tiers are defined in accordance with Java framework
