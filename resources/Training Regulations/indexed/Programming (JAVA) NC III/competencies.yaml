    source_block: "UNIT OF COMPETENCY: CREATE AND FINE TUNE JAVA TECHNOLOGY\n                    APPLICATIONS USING OBJECT-ORIENTED\n\
      \                    PROGRAMMING CONCEPT\nUNIT CODE              :   ICT313360\nUNIT DESCRIPTION : This unit covers\
      \ the core Application Programming Interfaces\n                   (API) used to design object-oriented applications\
