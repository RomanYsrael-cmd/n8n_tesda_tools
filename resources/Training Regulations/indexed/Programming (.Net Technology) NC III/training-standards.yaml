    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Programming (.NET Technology) NC III.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Programming (.NET Technology)\n\nNC Level:\nNC III\n\nNominal Training Duration:\n64 hrs. – Basic Competencies\n\n 16 hrs. – Common Competencies\n\n 120 hrs. – Core Competencies (6hours x 20 workdays)\n\n 352 hrs. – S.I.T. (Supervised-Industry Training)\n\n--------- -----------------------------------------\n\n 552 hrs. – Total Training Duration\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\nprogrammer in accordance with industry standards. It covers the basic, common & core\ncompetencies on programming language, specifically .NET technology. The nominal\nduration of 552 hours covers the required units at Programming (.NET Technology) NC\nIII. TVET providers can however, offer a longer, ladderized course covering the\nProgramming (.NET Technology) NC III basic, common and core competency unit/s.\n\nBASIC COMPETENCIES\n64 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace processes\n1.2 Lead workplace\ndiscussions\n1.3 Identify & communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership\n2.2 Assign responsibilities\namong members\n2.3 Set performance\nexpectation for team\nmembers\n\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 46 ---\nPage 44\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in\nnegotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain/enhance\nrelevant technology\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n16 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply\nQuality\nStandards\n1.1 Asses quality of\nreceived materials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n2. Operate a\nPersonal\nComputer\n2.1 Plan and prepare for\ntask to be undertaken\n2.2 Input data into computer\n2.3 Access information\nusing computer\n2.4 Produce output/data\nusing computer system\n2.5 Use basic functions of a\nweb browser to locate\ninformation\n2.6 Maintain computer\nequipment and systems\n• Modular\n• Film showing\n• Computer based\ntraining (e-\nlearning)\n• Project method\n• On the job\ntraining\n\n• Demonstration &\nquestioning\n• Observation &\nquestioning\n• Third party\nreport\n• Assessment of\noutput product\n• Portfolio\n• Computer-\nbased\nassessment\n\n--- PDF PAGE 47 ---\nPage 45\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nCORE COMPETENCIES\n472 hrs. (120 hrs. in-school + 352 hrs. S.I.T.*)\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Perform\nProgramming\nin HTML5\nwith\nJavaScript\nand CSS3\n1.1. Develop basic HTML document\nusing HTMP5 and CSS 3 syntax\n1.2. Create HTML5 document using\nadvanced techniques with\nJavaScript and CSS3\n1.3. Communicate with Remote\nData Source and Create Objects\nand Methods using JavaScript\n1.4. Create interactive and\nresponsive user interface\n1.5. Add offline support to Web\nApplications\n1.6. Implement an Adaptive User\nInterface\n1.7. Use CSS3 to create scalable\ngraphics and animated user\ninterface\n1.8. Implement real-time\ncommunications by using web-\nsockets and web worker\nprocess\n1.9. Design and implement Windows\nStore applications using MVVM\ndesign pattern\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Written\nexam\n• Practical\nexam\n• Observation\nin workplace\n• Interviews/\nquestioning\n2. Develop\nASP.NET\nMVC5 Web\nApplications\n2.1. Employ basic project\nmanagement tasks\n2.2. Perform Object-oriented\nprogramming with C#\n2.3. Develop ASP.NET Web\nApplications using Model View\nController or architectural\npatterns\n2.4. Test and debug ASP.NET MVC\nWeb Applications\n2.5. Create custom URLs and apply\nstyle to ASP.NET MVC Web\napplications\n2.6. Create responsive web pages\nand implementing security\n2.7. Create RESTful API, modify\nURLs and deploy ASP.NET\nMVC applications\n\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Written\nexam\n• Practical\nexam\n• Observation\nin workplace\n• Interviews/\nquestioning\n*Note: Supervised-Industry Training (SIT) in actual work environment is included in the training duration.\n\n--- PDF PAGE 48 ---\nPage 46\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n3.1.\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of the competency-based TVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilities the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire a specific competencies prescribed\nin the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 49 ---\nPage 47\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n3.2.\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n• Must have completed at least 10 yrs. basic education or an ALS\ngrade 10 certificate of rating holder\n• Can communicate either oral or written;\n• With basic computer skills\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.3.\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the conduct of\ntraining in Programming (.NET Technology) NC III:\n(Computed/estimated based on a class size of 15)\n\nTOOLS\nEQUIPMENT\nMATERIALS/RESOURCES\nQty\nDescription\nQty\nDescription\nQty\nDescription\nAs required\nComputer Software\ne.g. Visual Studio\nExpress 2012 or\nhigher\n15\nNetwork Computer\n(on Windows 8 or\nhigher) with\nperipherals\n1 free\naccount\nwww.microsoftvirtual\nacademy.com\n1\nNetwork Printer\n\nPractice materials\n1\nInternet access\n1\nWhite board\n\nHand-outs\nAs\nrequired\nMVC5 or higher\n1\nLCD projector and\nscreen\n\nReference books\n1\nApplication servers\ne.g.-SQL Server Express\n2012 or higher\n - IIS Express\n15\nErgonomic chairs\nand tables\n\nLearning\nmaterials/guide\n\nThe quantity of tools and equipment to be used for the conduct of training for this\nqualification shall depend on the number of students, size of the class, and/or modality of\ntraining. The most important consideration is to make sure that tools and equipment are\nadequately provided to all trainees when needed. The actual list of tools, equipment,\nmachines, supplies and other materials to be used shall be identified and detailed in the\nCompetency Based Curriculum (CBC) to be submitted by the TVET provider when\nregistering a course or training program with TESDA.\n\nDue to the fast-changing nature of the Information and Communications\nTechnology (ICT) sector, TVET providers are reminded to use and provide their trainees\nwith the latest technology tools, equipment and materials where appropriate and\napplicable.\n\nIn cases where there are specialized tools, equipment and facilities that are\nnot generally considered standard requirements or not absolute requisites for training,\nthe industry working group or TESDA may provide guidelines or specific advice on such\nmatters.\n\n--- PDF PAGE 50 ---\nPage 48\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\n3.4.\nTRAINING FACILITIES\n\nThe Programming workshop must be of concrete structure. Based on class size of\n25 student/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nComputer laboratory\n6 x 8\n48\n1\n48\nLearning Resource Area\n4 x 5\n20\n1\n20\nWash,Toilet & Locker Room\n2 x 5\n10\n2\n20\n Total\n128\nFacilities / Equipment /\nCirculation**\n\n38\nTotal Area\n166\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.5.\nTRAINERS QUALIFICATION\n\nProgramming (.NET Technology) NC III\n\n•\nMust be a holder of National TVET Trainer’s Certificate Level 1(NTTC)\n-\nMust be a holder of Programming NC IV or equivalent\n•\nMust be a holder of a current Microsoft Developer Certificate\n•\nMust have at least 2-years relevant industry experience*\n\n* Optional: Only when required by the hiring institution.\n\n3.6.\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency. The institutional assessment is administered by the\ntrainer/assessor.\n\nThe result of the institutional assessment may be considered as an\nevidence for national assessment.\n\n--- PDF PAGE 51 ---\nPage 49\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013"
  },
