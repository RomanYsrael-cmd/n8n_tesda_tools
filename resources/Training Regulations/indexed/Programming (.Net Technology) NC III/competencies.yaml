        "source_title": "DEVELOPING ASP.NET MVC WEB APPLICATIONS",
        "source_text": "--- PDF PAGE 36 ---\nPage  34  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \nUNIT OF COMPETENCY :    DEVELOPING ASP.NET MVC WEB APPLICATIONS  \n \nUNIT CODE  \n         :     ICT313358 \n \nUNIT DESCRIPTOR        : \nIn this course, students will learn to develop advanced \nASP.NET MVC 5 (or higher) applications using .NET \nFramework 4.5 (or higher) tools and technologies. The \nfocus will be on coding activities that enhance the \nperformance and scalability of the Web site application. \nThe Model View Controller (MVC) architectural pattern will \nbe explained in this course. ASP.NET MVC will be \nintroduced and compared with Web Forms so that students \nknow when each should/could be used.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Employ basic \nproject \nmanagement tasks\n \n1.1 Feature list is prepared in line with client requirements \n1.2 Effective Excel Survey form is used to gather client \ninformation and requirements \n1.3 Release plan is prepared and agreed with clients  based on \ndependencies and business values \n1.4 Visual presentation and supporting documents are presented \nduring the client meeting \n1.5 Tasks required to complete the feature are identified based on \nfeature list and established design approach \n1.6 Time estimates per task is assigned based on degree of \ncomplexity and size. \n1.7 Analysis of development resources is performed \n1.8 Tasks and To-do list are itemized using OneNote and Team \nSites \n1.9 Lync Online is used effectively for online internal meetings \nthroughout the project development \n1.10 Used test case scenarios are formulated and documented \nusing specified format and in line with client requirements \n1.11 Test cases are plotted in Excel Worksheets \n1.12 Business process are documented using agreed \nrepresentation format\n2. Perform Object-\noriented \nprogramming with \nC# \n2.1 The architecture of .NET Framework applications is described \nand the features that Visual Studio 2013 or higher and \nprogramming language provided are used to support .NET \nFramework development.  \n2.2 The basic data types, operators, and expressions are used. \n2.3 Standard programming language constructs is used. \n2.4 Create and invoke methods, pass parameters to methods, \nand return values from methods are used.  \n2.5 Overloaded methods are created and optional & output \nparameters are used.  \n2.6 Exceptions are catch and handled and information are written \nto the event log. \n \n2.7 Requirement for implementing logging, tracing, and profiling is \nexplained when building large-scale applications. \n2.8 Principles of object-oriented programming are described. \n2.9 Custom classes are created and used.\n\n--- PDF PAGE 37 ---\nPage  35  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \n2.10 Custom interfaces are defined and implemented.  \n2.11 Generics are used to implement type-safe collections. \n2.12 Abstract classes and inherit are defined from base classes to \ncreate a class hierarchy. \n2.13 Inherit from .NET Framework classes and extension methods \nare used to add custom functionality to the inherited class. \n2.14 Generic classes and methods are created. \n3. Develop ASP.NET \nWeb Applications \nusing Model View \nController \narchitectural \npattern \n3.1 The Microsoft Web Technologies stack is described. \n3.2 Appropriate technology is selected to use to develop any \ngiven application. \n3.3 Architecture of web application is designed to meet a set \nof functional requirements, user interface requirements, and \naddress business models.  \n3.4 The implementation of a web application that will meet a set \nof functional requirements, user interface requirements, and \naddress business models is designed. \n3.5 MVC Models are created. \n3.6 Code that implements business logic within Model methods, \nproperties, and events is written. \n3.7 Controllers to an MVC Application is added to manage user \ninteraction \n3.8 Models are updated. \n3.9 Select and return Views. \n3.10 Razor syntax is used to create Views in an MVC application \nthat display  \n3.11 Data is edited. \n3.12 Interact with Models and Controllers. \n4. Test and debug \nASP.NET MVC \nWeb Applications \n4.1 Unit tests and debugging tools are ran against a web \napplication in Visual Studio  \n4.2 An application for troubleshooting is configured. \n5. Create custom \nURLs and apply \nstyle to ASP.NET \nMVC Web \napplications   \n5.1 A web application that uses the ASP.NET routing engine to \npresent friendly URLs is developed. \n5.2 A web application that uses the ASP.NET routing engine to a \nlogical navigation hierarchy to users is developed. \n5.3 Template Views are used. \n5.4 A Consistent Look and Feel is applied to an MVC Application \n5.5\nWeb Pages for Different Browsers are adapted \n6. Create responsive \nweb pages and \nimplementing \nsecurity \n6.1 Partial page updates and caching are used to reduce the \nnetwork bandwidth used by an application  \n6.2 Accelerate responses to user requests is performed. \n6.3 JavaScript code that runs on the client-side is written \n6.4 JQuery script library is utilized to optimize the \nresponsiveness of an MVC web application. \n6.5 Authentication is implemented in an MVC web application \nusing Membership Provider. \n6.6 Authorization is implemented in an MVC web application \nusing Role Provider. \n6.7 A secure MVC application that resists malicious attacks is \nbuilt. \n6.8 An MVC application that persist information about users and \npreferences is built.\n\n--- PDF PAGE 38 ---\nPage  36  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \n \n7. Create RESTful \nAPI, modify URLs \nand deploy \nASP.NET MVC \napplications \n7.1 \nA Web API is described  \n7.2 \nWhy developers might add a Web API to an application is \nidentified and explained. \n7.3 \nRESTful web API is built and consumed from other \napplications. \n7.4 \nModifying the way browser requests are handled by an MVC \napplication using HTTP modules and HTTP handlers. \n7.5 \nRequest from browser using web sockets is intercepted. \n7.6 \nWindows Azure web service  is written \n7.7 \nCode written to call the web service from and MVC \napplication. \n7.8 \nAn ASP.NET MVC 5 web application from a development \ncomputer is packaged to a web server for staging or \nproduction. \n7.9 \nAn ASP.NET MVC 5 web application from a development \ncomputer is deployed to a web server for staging or \nproduction.\n\n--- PDF PAGE 39 ---\nPage  37  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Client \nrequirements \nClient requirements may include: \n Application features \n\nTechnical requirements\n2. development \nresources  \nDevelopment resources may include:\n personnel \n time \n\nclient specifications\n3. OneNote \nOffice OneNote may include: \n Creating notebook \n Creating sections \n\nRecord meetings\n4. Team Sites \nTeam Sites may include: \n Team tasks/to do \n Team calendar \n Team files \n\nTeam OneNote\n5. Lync Online \nLync Online may include: \n Audio and Video Conference \n Desktop and PowerPoint Sharing \n\nOneNote and File Attachment Sharing\n6. Specified format \nSpecified format may be: \n \nUML –Use Cases \n \nStep-by-step procedure \n \nProduct backlog list \n \nSprint backlog list \n\nBurn down chart\n7. Excel Worksheet \nExcel Worksheet may include but not limited: \n Tables or PivotTables \n Spark Lines \n\nGraphs or Charts\n8. Representation \nformat \nRepresentation format may be: \n UML Activity diagram \n Diagram for the domain model \n Flow chart \n Written step-by-step procedure \n Table (ie. Taxation table) \n Lists of company policies \n Sample reports and forms \n9. Microsoft web \ntechnologies \nstack \nASP.NET web technologies stack may include : \n Personalization \n Membership \n Roles \n Data Sources \n Site Map \n Resource \n\nSecurity\n\n--- PDF PAGE 40 ---\nPage  38  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \n \n10. Architecture of web \napplications \nThis may include the following: \n Planning Models \n Planning Controllers \n Planning Views \n Architecting an MVC Application \n11. Create MVC \nModels \nCreating MVC Models may include: \n Creating an MVC Project and Adding a Model \n Creating a New SQL Azure Database in Visual Studio \n Adding Properties and Methods to MVC Models \n Using Display and Edit Annotations in MVC Models \n12. Add Controllers \nThis may include the following: \n Adding an MVC Controller and Writing the Actions \n Writing the Action Filters in a Controller \n13. Create Views \nThis may include the following: \n Adding a View for Web Page Display \n Creating and Using a Partial View \n Testing the Views\n14. Accelerate \nResponses \nThis may include the following: \n \nChoose a state management mechanism (in-process and out \nof process state management) \n \nPlan for scalability; use cookies or local storage to maintain \nstate \n \nApply configuration settings in web.config file \n \nImplement session less state (for example, QueryString) \n \nImplement page output caching (performance oriented) \n \nImplement data caching; implement HTTP caching \n \nRead and write string and binary data asynchronously (long-\nrunning data transfers) \n \nChoose a connection loss strategy \n \nDecide a strategy for when to use Web Sockets \n15.  Optimize the \nresponsiveness \nThis may include the following: \n \nImplement client validation with JQuery \n \nUse JavaScript and the DOM to control application behavior \n \nExtend objects by using prototypal inheritance \nUse AJAX to make partial page updates \n \nImplement the UI by using JQuery \n16.  Authentication  \nThis may include the following: \n \nConfiguring Authentication and Membership Provider \n \nAuthenticate users \n \nEnforce authentication settings \n \nChoose between Windows, Forms, and custom authentication \n \nManage user session by using cookies \n \nConfigure membership providers \n \nCreate custom membership providers \n \nBuilding the Logon and Register Views \n \nBuilding a Password Reset View\n\n--- PDF PAGE 41 ---\nPage  39  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \n \n17. Authorization \nThis may include the following: \n Configuring Authorization and Roles Provider \n Authorizing Access to Resources \n Create roles \n Authorize roles by using configuration \n Authorize roles programmatically \n Create custom role providers; implement WCF service \nauthorization\n18.  Secure MVC Web \nApplication \nThis may include the following: \n Secure communication by applying SSL certificates \n Salt and hash passwords for storage \n Use HTML encoding to prevent cross-site scripting \nattacks (ANTI-XSS Library) \n Implement deferred validation and handle unvalidated \nrequests, for example, form, querystring, and URL \n Prevent SQL injection attacks by parameterizing queries \n Prevent cross-site request forgeries (XSRF) \n19.  Malicious Attacks \nThis may include the following: \n Cross-site scripting \n\nSQL injection\n20.  HTTP Modules and \nHTTP Handlers \nThis may include the following: \n Implement synchronous and asynchronous modules \nand handlers \n\nChoose between modules and handlers in IIS\n21.  Windows Azure \nWeb Service \nThis may include the following: \n Creating and Coding a service on Windows Azure \nCloud Services \n Consuming Data from a Windows Azure Service \n22. Staging or \nProduction \nStaging or production server may include: \n On-premise web server \n Windows Azure Cloud Service, Websites, or Virtual \nMachine with Internet information Services (IIS) \ninstalled\n\n--- PDF PAGE 42 ---\nPage  40  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Employed basic project management tasks \n1.2. Performed Object-oriented programming with C# \n1.3. Developed ASP.NET Web Applications using Model View \nController or architectural patterns \n1.4. Tested and debugged ASP.NET MVC Web Applications \n1.5. Created custom URLs and apply style to ASP.NET MVC \nWeb applications \n1.6. Created responsive web pages and implementing security \n1.7. Created RESTful API, modify URLs and deploy ASP.NET \nMVC applications \n \n2. Underpinning \nKnowledge  \n2.1. \nValue of an end-to-end view of Application Lifecycle \nManagement (ALM) tools and practices. ALM practice may \ninclude agile methodologies, such as, SCRUM and KANBAN  \n2.2. \nBenefits of fast feedback \n2.3. \nImplementation strategies to reduce end-to-end cycle time \n2.4. \nImplementation strategies to improve software quality \n2.5. \nImplementation strategies to reduce waste \n2.6. \nCreate a process improvement plan \n2.7. \nRole of different ALM processes \n2.8. \nImplementation of a Scrum/Agile process \n2.9. \nDefine a Scrum/Agile process for a team \n2.10. Implementation of  Microsoft Solution Framework for CMMI \nprocess improvement \n2.11. Plan a release \n2.12. Definition of a project-tracking process \n2.13. Scoping of a project \n2.14. Elicit requirements \n2.15. Estimation of requirements \n2.16. Document requirements \n2.17. Prioritization of requirements \n2.18. Define code quality indicators \n2.19. Incorporation of unit testing \n2.20. Code Development \n2.21. Quality Validation \n2.22. Team project customization \n2.23. Implementation of an automated deployment process \n2.24. Implementation of  pre-production environment \n2.25. Manage feedback between development and operations \n2.26. Troubleshoot production issues \n2.27. Planning the application layers \n2.28. Designing a distributed application \n2.29. Designing and implementing the Windows Azure life cycle \n2.30. Configure state management \n2.31. Designing a caching strategy \n2.32. Designing and implementing a Web Socket strategy \n2.33. Designing HTTP modules and handlers \n2.34. Apply the user interface design for a web application \n2.35. Designing and implementing UI behavior \n2.36. Compose the UI layout of an application\n\n--- PDF PAGE 43 ---\nPage  41  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \n2.37. Enhance application behavior and style based on browser \nfeature detection \n2.38. Plan an adaptive UI layout \n2.39. Plan for search engine optimization and accessibility \n2.40. Plan and implement globalization and localization \n2.41. Design and implement MVC controllers and actions \n2.42. Design and implement routes \n2.43. Control application behavior by using MVC controllers and \nactions \n2.44. Design and implement routes \n2.45. Control application behavior by using MVC extensibility points \n2.46. Reduce network bandwidth \n2.47. Prevent and troubleshoot runtime issues \n2.48. Design an exception handling strategy \n2.49. Debug a Windows Azure application \n2.50. Configure authentication \n2.51. Configure and apply authorization \n2.52. Design and implement claims-based authentication across \nfederated identity stores \n2.53. Manage data integrity \n2.54. Implement a secure site with ASP.NET \n2.55. Implement multithreading and asynchronous processing \n2.56. Manage multithreading \n2.57. Implement program flow \n2.58. Create and implement events and callbacks \n2.59. Implement exception handling \n2.60. Create types \n2.61. Consume types \n2.62. Enforce encapsulation \n2.63. Create and implement a class hierarchy \n2.64. Find, execute & create types at runtime by using reflection \n2.65. Manage the object life cycle \n2.66. Manipulate strings \n2.67. Validate application input \n2.68. Perform symmetric and asymmetric encryption \n2.69. Manage assemblies \n2.70. Debug an application \n2.71. Implement diagnostics in an application \n2.72. Perform I/O operations \n2.73. Consume data \n2.74. Query and manipulate data and objects by using LINQ \n2.75. Serialize and deserialize data \n2.76. Store data in and retrieve data from collections\n3. Underpinning \nSkills \n3.1. Interaction diagram modeling. \n3.2. Detailed/ step-by-step process modeling \n3.3. Documentation \n3.4. Using IDE \n3.5. Testing and debugging ASP.NET MVC Web Applications  \n3.6. Tracing \n3.7. Developing ASP.NET web applications \n3.8. Creating an installation package \n3.9.\nDeploying and configuring installation package\n\n--- PDF PAGE 44 ---\nPage  42  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1. Access to PC work station and requisite software \n4.2. Access to .NET development tools and hardware \n4.3. Office 365 account  \n4.4. Materials relevant to the proposed activity or tasks  \n4.5. Internet connection (for setting up and familiarization with \nsoftware sources) \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. Demonstration with questioning \n5.2. Observation with questioning \n5.3. Third party report \n5.4. Portfolio \n5.5. Deployment of “Developing ASP.NET MVC5 (or higher) \nWeb Applications” certification exam \n \n6. Context for \nAssessment \n6.1. Competency may be assessed in workplace or in a \nsimulated workplace setting \n6.2. Assessment shall be observed while task are being \nundertaken whether individually or in group \n \n  \nReference: Contents of Core Competencies are derived from the contents of the Certification \nExams from Microsoft Learning < http://www.microsoft.com/learning>.\n",
