          "source_text": "1. Develop basic \nHTML document \nusing HTMP5 and \nCSS 3 syntax  \n \n1.1 Domain model is produced to illustrate different business \ndomain features. \n1.2 Business processes are documented using agreed \nrepresentation format. \n1.3 Interaction diagrams are produced that describe in detail \nhow the objects will interact with the business logic to \nperform the methods or functions of the business \nprocesses.   \n1.4 Interaction diagrams are documented using agreed \nrepresentation format. \n1.5 An HTML5 document is created and configured according \nto user’s specification.  \n1.6 The HTML5 document is designed using cascading style \nsheet 3 (CSS3).\n2. Create HTML5 \ndocument using \nadvanced \ntechniques with \nJavaScript and \nCSS3  \n \n2.1 Static pages are created using the new features available \nin HTML5. \n2.2 CSS3 is used to apply basic styling to the elements in an \nHTML5 page. \n2.3 Syntax of JavaScript is explained and how to use \nJavaScript with HTML5 is described.  \n2.4 JavaScript code that manipulates the HTML DOM is written \nand events are handled.  \n2.5 How to use jQuery is described to simplify code that uses \nmany common JavaScript APIs. \n2.6 Forms that use the new HTML5 input types are created.  \n2.7 User input is validated and feedback is provided by using \nthe new HTML5 attributes.\n\n--- PDF PAGE 31 ---\nPage  29  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \n2.8 JavaScript code is written to validate user input and \nfeedback is provided in cases where it is not suitable to use \nHTML5 attributes \n2.9 Text elements are styled on an HTML5 page by using \nCSS3.  \n2.10 Styling is applied to block elements by using CSS3.  \n2.11 CSS3 selectors are used to specify the elements to be \nstyled in a Web application.  \n2.12 Graphical effects and transformations are implemented by \nusing the new CSS3 properties \n3. Communicate with  \nRemote Data \nSource and Create \nObjects and \nMethods using \nJavaScript \n3.1 Data are serialized, deserialized, sent and received by \nusing XMLHTTPRequest object.  \n3.2 Code that serializes, deserializes, sends, and receives data \nis simplified by using the jQuery ajax method. \n3.3 Benefits of structuring JavaScript code is described \ncarefully to aid maintainability and extensibility.  \n3.4 Best practices are explained for creating custom objects in \nJavaScript. \n3.5 How to extend custom and native objects is described to \nadd functionality. \n4. Create intuitive \nuser interface and \nadd offline support \nfor web \napplications  \n4.1 Drag and Drop and File APIs are used to interact with files \nin a Web application.  \n4.2 Audio and video are incorporated into a Web application.  \n4.3 Location of the user running a Web application is detected \nby using the Geolocation API.  \n4.4 How to debug and profile a Web application is explained by \nusing the Web Timing API. \n4.5 The need to detect device capabilities is described and \nreacted to different form factors in a Web application.  \n4.6 Web page that can dynamically adapt its layout to match \ndifferent form factors is created. \n4.7 Data is saved and retrieved locally on the user's computer \nby using the Local Storage API.  \n4.8 Offline support is provided for a Web application by using \nthe Application Cache API. \n5. Use CSS3 to \ncreate scalable \ngraphics and \nanimated user \ninterface \n5.1 Scalable Vector Graphics are used to add interactive \ngraphics to an application.  \n5.2  Complex graphics are drawn on an HTML5 Canvas \nelement by using JavaScript code. \n5.3 CSS transitions are applied to elements on an HTML5 \npage, and write JavaScript code to detect when a transition \nhas occurred.  \n5.4 Different types of 2D and 3D transitions available with \nCSS3 are described.  \n5.5 Complex animations are implemented by using CSS key-\nframes and JavaScript code.\n\n--- PDF PAGE 32 ---\nPage  30  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \n \n6. Implement real-\ntime \ncommunications \nby using web-\nsockets and web \nworker process \n6.1 How Web Sockets work is explained and how to send and \nreceive data through a Web Socket is described. \n6.2 Web Socket API with JavaScript is used to connect to a \nWeb Socket server, send and receive data, and handle the \ndifferent events that can occur when a message is sent or \nreceived. \n6.3 The purpose of a Web Worker process and how it can be \nused to perform asynchronous processing as well as \nprovide isolation for sensitive operations is described.  \n6.4 Web Worker APIs from JavaScript code is used to create, \nrun, and monitor a Web Worker process. \n6.5 Occupational health and safety standards in the workplace \nand 5S disciplines are strictly followed as per enterprise \npolicies and procedures. \n7. Explore the \nWindows 8 \nplatform and \nWindows Store \nApps \n7.1 Windows 8 platform, architecture, and features are \ndescribed. \n7.2 Basics of the Windows 8 UI and Windows Store app \nexperience and how it differs from Windows desktop apps \nare explained. \n7.3 New API model, how it supports building Windows Store \napps, and how it supports multiple language-specific \nprojections are explained. \n7.4 Single-page based Windows Store apps is described \n7.5 Windows store apps using MVVM (model-view-view-\nmodel) design pattern with JavaScript are designed and \nimplemented.\n\n--- PDF PAGE 33 ---\nPage  31  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business domain \nfeatures \nBusiness domain features may include but not limited: \n Business domain objects \n Inheritance relationships \n Aggregation and Composition relationships \n Methods or functions that identify the business \nprocesses that will be performed by the application \n2. Representation \nformat (business \nprocesses) \nRepresentation format may be: \n Class diagram \n Class Responsibility cards or diagram \n3. Interaction diagrams \nMay include: \n Domain model \n\nBusiness processes (see Analyze feature functionality)\n4. Representation \nformat (interaction \ndiagrams) \nRepresentation format may include and is not limited to: \n Sequence diagrams \n Communication diagrams \n Interaction overview diagrams \n\nTiming diagrams\n5. User’s Specifications\nThis may include configuring a window to control: \n Accessibility \n Appearance \n Behavior \n Configuration \n Data \n Design \n Focus \n Layout \n\nStyle\n6. New Features \nNew features may include: \n Audio \n Video \n Canvas \n SVG graphics \n Storage \n\nGeolocation\n \n Section \n Article \n Nav \n Header \n Footer \n\nAside\n7. HTML5 input types \nNew input types may include: \n date \n datetime \n datetime-local \n month \n number \n email \n telephone \n time \n URL \n week \n range \n Search \n\ncolor\n8. MVVM design \npattern with \nJavaScript \nThis can be implemented using, but not limited, to the \nfollowing frameworks: \n \nAngularJS \n\nKnockoutJS\n\n--- PDF PAGE 34 ---\nPage  32  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013"
