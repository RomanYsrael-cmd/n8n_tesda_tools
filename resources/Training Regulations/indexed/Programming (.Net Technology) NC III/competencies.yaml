  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, core and\nspecialized units of competency required in PROGRAMMING (.NET TECHNOLOGY)\nNC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n\n : 500311109\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace\nprocesses\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas\nare communicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality\nand safety\n2.4. Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate\nissues arising in the\nworkplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\nPage 3\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1.\nNon-verbal gestures\n1.2.\nVerbal\n1.3.\nFace to face\n1.4.\nTwo-way radio\n1.5.\nSpeaking to groups\n1.6.\nUsing telephone\n1.7.\nWritten\n1.8.\nInternet\n\n--- PDF PAGE 6 ---\nPage 4\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace\nissues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively\nwritten form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge\n2.1.\nOrganization\nrequirements\nfor\nwritten\nand\nelectronic communication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning Skills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n\n--- PDF PAGE 7 ---\nPage 5\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\nUNIT OF COMPETENCY: LEAD SMALL TEAMS\n\nUNIT CODE\n\n: 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1. Work requirements are identified and presented to\nteam members\n1.2. Reasons for instructions and requirements are\ncommunicated to team members\n1.3. Team members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign\nresponsibilities\n2.1. Duties, and responsibilities are allocated having regard\nto the skills, knowledge and aptitude required to\nproperly undertake the assigned task and according to\ncompany policy\n2.2. Duties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for\nteam members\n3.1. Performance expectations are established based on\nclient needs and according to assignment requirements\n3.2. Performance expectations are based on individual team\nmembers duties and area of responsibility\n3.3. Performance expectations are discussed and\ndisseminated to individual team members\n4. Supervise team\nperformance\n4.1. Monitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2. Team members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3. Performance issues which cannot be rectified or\naddressed within the team are referenced to appropriate\npersonnel according to employer policy\n4.4. Team members are kept informed of any changes in the\npriority allocated to assignments or tasks which might\nimpact on client/customer needs and satisfaction\n4.5. Team operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6. Follow-up communication is provided on all issues\naffecting the team\n4.7. All relevant documentation is completed in accordance\nwith company procedures\n\n--- PDF PAGE 8 ---\nPage 6\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 9 ---\nPage 7\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nKnowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6.\nTeam member’s duties and responsibilities\n3. Underpinning\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4.\nNegotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nAssessment\n6.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\nPage 8\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE :\n 500311111\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating nonverbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\nPage 9\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 Self-awareness\n1.4.2 Self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 nonverbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self-disclosing\nAnalytic skills\n1.6.1 observing differences between content\nand process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and\nexternally for resolving conflict\n\n2. Non-verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 12 ---\nPage 10\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during\nnegotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning Skills\n3.1 Interpersonal skills to develop rapport with other\nparties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency to be assessed in real work\nenvironment or in a simulated workplace setting.\n\n--- PDF PAGE 13 ---\nPage 11\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nUNIT OF COMPETENCY:\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n : 500311112\nUNIT DESCRIPTOR\n :\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem\nare defined through observation, investigation\nand analytical techniques\n1.3.\nProblems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1.\nPossible causes are identified based on\nexperience and the use of problem solving\ntools / analytical techniques.\n2.2.\nPossible cause statements are developed\nbased on findings\n2.3.\nFundamental causes are identified per results\nof investigation conducted\n3. Determine corrective\naction\n3.1.\nAll possible options are considered for\nresolution of the problem\n3.2.\nStrengths and weaknesses of possible options\nare considered\n3.3.\nCorrective actions are determined to resolve\nthe problem and possible future causes\n3.4.\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to\nappropriate personnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\nPage 12\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScatter grams\n\n2. Problem\n\n2.1.\nNon–routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCoordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\nPage 13\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1. Relevant equipment and operational\nprocesses\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 16 ---\nPage 14\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nCase studies on solving problems in the workplace\n5.2.\nObservation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 17 ---\nPage 15\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\nUNIT CODE :\n500311113\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts\nand techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\nPage 16\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 19 ---\nPage 17\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nKnowledge\n2.1 Fundamental operation (addition, subtraction,\ndivision, multiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning Skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 20 ---\nPage 18\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on\njob requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced as\nper established industry practices\n\n3. Maintain/enhance\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance with\nthe industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to ensure\nits operative ability\n3.2 Updating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3 Technology failure/ defect is immediately reported to the\nconcern/responsible person or section for appropriate\naction\n\n--- PDF PAGE 21 ---\nPage 19\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\nPage 20\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of\nrelevant technology\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning Skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nAssessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\nPage 21\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\n506315202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to apply quality standards in the workplace. The unit\nalso includes the application of relevant safety procedures\nand regulations, organization procedures and customer\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials\n1.1. Work instruction is obtained and work is carried out\nin accordance with standard operating procedures.\n1.2. Received materials are checked against workplace\nstandards and specifications.\n1.3. Faulty materials related to work are identified and\nisolated.\n1.4. Faults and any identified causes are recorded and/or\nreported to the supervisor concerned in accordance\nwith workplace procedures.\n1.5. Faulty materials are replaced in accordance with\nworkplace procedures.\n2. Assess own work\n2.1. Documentation relative to quality within the\ncompany is identified and used.\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken.\n2.3. Errors are identified and isolated.\n2.4. Information on the quality and other indicators of\nproduction performance are recorded in accordance\nwith workplace procedures.\n2.5. In cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ s standards\noperating procedures.\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated in\nrelative to workplace assignment.\n3.2. Work is carried out in accordance with process\nimprovement procedures.\n3.3. Performance of operation or quality of product of\nservice to ensure customer satisfaction is\nmonitored.\n\n--- PDF PAGE 24 ---\nPage 22\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Materials\n1.1 Materials may include but not limited to:\n1.1.1. Manuals\n1.1.2. Job orders\n1.1.3. Instructional videos\n2 Faults\n2.1 Faults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated\ninformation\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any\nregulatory agencies\n3 Documentation\n3.1 Organization work procedures\n3.2 Manufacturer’s instruction manual\n3.3 Customer requirements\n3.4 Forms\n4 Errors\n4.1 Errors may be related but not limited to the following:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the\norganization\n5 Quality standards\n\n5.1 Quality standards may be related but not limited to the\nfollowing:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1 Co-worker\n6.2 Supplier/Vendor\n6.3 Client\n6.4 Organization receiving the product or service\n\n--- PDF PAGE 25 ---\nPage 23\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s\nstandard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with\nstandard operating procedures\n1.4 Carried out work in accordance with the process\nimprovement procedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and\nproducts\n2.2 Characteristics of materials, software and hardware\nused in production processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production\nprocesses\n2.6 Fault identification and reporting\n2.7\nQuality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply\ndefined work procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5\nSolution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to\nobjectively evaluate the candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4\nPractical demonstration\n5 Resource implication\nMaterials, software and hardware to be used in a real or\nsimulated situation\n6 Context of\nAssessment\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 26 ---\nPage 24\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\n506311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to perform computer operations which include\ninputting, accessing, producing and transferring data using\nthe appropriate hardware and software.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be taken\nundertaken\n1.1. Requirements of task are determined in\naccordance with the required output.\n1.2. Appropriate hardware and software are selected\naccording to task assigned and required outcome.\n1.3. Task is planned to ensure that OH & S guidelines\nand procedures are followed.\n1.4. Client -specific guidelines and procedures are\nfollowed.\n1.5. Required data security guidelines are applied in\naccordance with existing procedures.\n2. Input data into\ncomputer\n2.1. Data are entered into the computer using\nappropriate program/application in accordance with\ncompany procedures.\n2.2. Accuracy of information is checked and information\nis saved in accordance with standard operating\nprocedures.\n2.3. Inputted data is stored in storage media according\nto requirements.\n2.4. Work is performed within ergonomic guidelines.\n3. Access information\nusing computer\n3.1. Correct program/application is selected based on\njob requirements.\n3.2. Program/application containing the information\nrequired is accessed according to company\nprocedures.\n3.3. Desktop icons are correctly selected, opened and\nclosed for navigation purposes.\n3.4. Keyboard techniques are carried out in line with OH\n& S requirements for safe use of keyboards.\n\n--- PDF PAGE 27 ---\nPage 25\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\n4. Produce output/ data\nusing computer system\n4.1. Entered data are processed using appropriate\nsoftware commands.\n4.2. Data are printed out as required using computer\nhardware /peripheral devices in accordance with\nstandard operating procedures.\n4.3. Files and data are transferred between compatible\nsystems using computer software,\nhardware/peripheral devices in accordance with\nstandard operating procedures.\n5. Use basic functions of\na www-browser to\nlocate information\n5.1. Information requirements for internet search are\nestablished.\n5.2. Browser is launched.\n5.3. Search engine is loaded.\n5.4. Appropriate search criteria/or URL of site is\nentered.\n5.5. Relevant links are followed to locate required\ninformation.\n5.6. Useful pages are bookmarked or printed as\nrequired.\n6. Maintain computer\nequipment and\nsystems\n6.1. Procedures for ensuring security of data, including\nregular back-ups and virus checks are\nimplemented in accordance with standard\noperating procedures.\n6.2. Basic file maintenance procedures are\nimplemented in line with the standards operating\nprocedures.\n\n--- PDF PAGE 28 ---\nPage 26\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Hardware and\nperipheral devices\n1.1\nPersonal computers\n1.2\nNetworked systems\n1.3\nCommunication equipment\n1.4\nPrinters\n1.5\nScanners\n1.6\nKeyboard\n1.7\nMouse\n1.8\nVoice/Data logger\n2 Software\nSoftware includes the following but not limited to:\n2.1\nWord processing packages\n2.2\nDatabase packages\n2.3\nInternet\n2.4\nSpreadsheets\n2.5\nClient Specific Software\n3 OH & S guidelines\n3.1\nOHS guidelines\n3.2\nEnterprise procedures\n4 Storage media\nStorage media include the following but not limited to:\n4.1\nDiskettes\n4.2\nCDs\n4.3\nZip disks\n4.4\nhard disk drives, local and remote\n4.5\nOptical drives\n5 Ergonomic guidelines\n5.1\nTypes of equipment used\n5.2\nAppropriate furniture\n5.3\nSeating posture\n5.4\nLifting posture\n5.5\nVisual display unit screen brightness\n6 Desktop icons\n6.1\nIcons include the following but not limited to:\n6.2\nDirectories/folders\n6.3\nFiles\n6.4\nNetwork devices\n6.5\nRecycle bin\n6.6\nProgram icons\n7 Maintenance\n7.1\nCreating and managing more space in the hard disk\nand other peripherals\n7.2\nReviewing programs\n7.3\nDeleting unwanted files\n7.4\nBacking up files\n7.5\nChecking hard drive for errors\n7.6\nUsing up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 29 ---\nPage 27\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1 Selected and used hardware components correctly and\naccording to the task requirement\n1.2 used basic software applications to create new files and\ndocuments\n1.3 Produced accurate and complete data in accordance with\nthe requirements\n1.4 Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5 Used basic functions of a www-browser to locate\ninformation.\n2 Underpinning\nknowledge\n2.1 Basic ergonomics of keyboard and computer user\n2.2 Main types of computers and basic features of different\noperating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security, privacy legislation and copyright\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n2.10 Productivity Application\n2.11 Business Application\n2.12 System Software\n3 Underpinning\nskills\n3.1 Reading and comprehension skills required to interpret\nwork instruction and to interpret basic user manuals.\n3.2 Communication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.3 Technology skills to use equipment safely including\nkeyboard skills.\n4 Method of\nassessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1 Direct Observation and Oral Questioning\n4.2 Practical demonstration\n5 Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n6 Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 30 ---\nPage 28\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM PROGRAMMING IN HTML5 WITH\nJAVASCRIPT AND CSS3\n\nUNIT CODE :\nICT313357\n\nUNIT DESCRIPTOR :\nThis unit provides an introduction to HTML5, CSS3, and\nJavaScript. This course helps students gain basic\nHTML5/CSS3/JavaScript programming skills. This course\nis an entry point into both the Web application and\nWindows Store apps training paths. The course focuses\non\nusing\nHTML5/CSS3/JavaScript\nto\nimplement\nprogramming logic, define and use variables, perform\nlooping and branching, develop user interfaces, capture\nand validate user input, store data, and create well-\nstructured application. Further, this unit covers the skills,\nknowledge and attitude required in developing HTML5\nwebsites. This also includes an introduction to the\nWindows 8 platform and the Windows Store apps.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop basic\nHTML document\nusing HTMP5 and\nCSS 3 syntax\n\n1.1 Domain model is produced to illustrate different business\ndomain features.\n1.2 Business processes are documented using agreed\nrepresentation format.\n1.3 Interaction diagrams are produced that describe in detail\nhow the objects will interact with the business logic to\nperform the methods or functions of the business\nprocesses.\n1.4 Interaction diagrams are documented using agreed\nrepresentation format.\n1.5 An HTML5 document is created and configured according\nto user’s specification.\n1.6 The HTML5 document is designed using cascading style\nsheet 3 (CSS3).\n2. Create HTML5\ndocument using\nadvanced\ntechniques with\nJavaScript and\nCSS3\n\n2.1 Static pages are created using the new features available\nin HTML5.\n2.2 CSS3 is used to apply basic styling to the elements in an\nHTML5 page.\n2.3 Syntax of JavaScript is explained and how to use\nJavaScript with HTML5 is described.\n2.4 JavaScript code that manipulates the HTML DOM is written\nand events are handled.\n2.5 How to use jQuery is described to simplify code that uses\nmany common JavaScript APIs.\n2.6 Forms that use the new HTML5 input types are created.\n2.7 User input is validated and feedback is provided by using\nthe new HTML5 attributes.\n\n--- PDF PAGE 31 ---\nPage 29\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n2.8 JavaScript code is written to validate user input and\nfeedback is provided in cases where it is not suitable to use\nHTML5 attributes\n2.9 Text elements are styled on an HTML5 page by using\nCSS3.\n2.10 Styling is applied to block elements by using CSS3.\n2.11 CSS3 selectors are used to specify the elements to be\nstyled in a Web application.\n2.12 Graphical effects and transformations are implemented by\nusing the new CSS3 properties\n3. Communicate with\nRemote Data\nSource and Create\nObjects and\nMethods using\nJavaScript\n3.1 Data are serialized, deserialized, sent and received by\nusing XMLHTTPRequest object.\n3.2 Code that serializes, deserializes, sends, and receives data\nis simplified by using the jQuery ajax method.\n3.3 Benefits of structuring JavaScript code is described\ncarefully to aid maintainability and extensibility.\n3.4 Best practices are explained for creating custom objects in\nJavaScript.\n3.5 How to extend custom and native objects is described to\nadd functionality.\n4. Create intuitive\nuser interface and\nadd offline support\nfor web\napplications\n4.1 Drag and Drop and File APIs are used to interact with files\nin a Web application.\n4.2 Audio and video are incorporated into a Web application.\n4.3 Location of the user running a Web application is detected\nby using the Geolocation API.\n4.4 How to debug and profile a Web application is explained by\nusing the Web Timing API.\n4.5 The need to detect device capabilities is described and\nreacted to different form factors in a Web application.\n4.6 Web page that can dynamically adapt its layout to match\ndifferent form factors is created.\n4.7 Data is saved and retrieved locally on the user's computer\nby using the Local Storage API.\n4.8 Offline support is provided for a Web application by using\nthe Application Cache API.\n5. Use CSS3 to\ncreate scalable\ngraphics and\nanimated user\ninterface\n5.1 Scalable Vector Graphics are used to add interactive\ngraphics to an application.\n5.2 Complex graphics are drawn on an HTML5 Canvas\nelement by using JavaScript code.\n5.3 CSS transitions are applied to elements on an HTML5\npage, and write JavaScript code to detect when a transition\nhas occurred.\n5.4 Different types of 2D and 3D transitions available with\nCSS3 are described.\n5.5 Complex animations are implemented by using CSS key-\nframes and JavaScript code.\n\n--- PDF PAGE 32 ---\nPage 30\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\n6. Implement real-\ntime\ncommunications\nby using web-\nsockets and web\nworker process\n6.1 How Web Sockets work is explained and how to send and\nreceive data through a Web Socket is described.\n6.2 Web Socket API with JavaScript is used to connect to a\nWeb Socket server, send and receive data, and handle the\ndifferent events that can occur when a message is sent or\nreceived.\n6.3 The purpose of a Web Worker process and how it can be\nused to perform asynchronous processing as well as\nprovide isolation for sensitive operations is described.\n6.4 Web Worker APIs from JavaScript code is used to create,\nrun, and monitor a Web Worker process.\n6.5 Occupational health and safety standards in the workplace\nand 5S disciplines are strictly followed as per enterprise\npolicies and procedures.\n7. Explore the\nWindows 8\nplatform and\nWindows Store\nApps\n7.1 Windows 8 platform, architecture, and features are\ndescribed.\n7.2 Basics of the Windows 8 UI and Windows Store app\nexperience and how it differs from Windows desktop apps\nare explained.\n7.3 New API model, how it supports building Windows Store\napps, and how it supports multiple language-specific\nprojections are explained.\n7.4 Single-page based Windows Store apps is described\n7.5 Windows store apps using MVVM (model-view-view-\nmodel) design pattern with JavaScript are designed and\nimplemented.\n\n--- PDF PAGE 33 ---\nPage 31\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business domain\nfeatures\nBusiness domain features may include but not limited:\n• Business domain objects\n• Inheritance relationships\n• Aggregation and Composition relationships\n• Methods or functions that identify the business\nprocesses that will be performed by the application\n2. Representation\nformat (business\nprocesses)\nRepresentation format may be:\n• Class diagram\n• Class Responsibility cards or diagram\n3. Interaction diagrams\nMay include:\n• Domain model\n•\nBusiness processes (see Analyze feature functionality)\n4. Representation\nformat (interaction\ndiagrams)\nRepresentation format may include and is not limited to:\n• Sequence diagrams\n• Communication diagrams\n• Interaction overview diagrams\n•\nTiming diagrams\n5. User’s Specifications\nThis may include configuring a window to control:\n• Accessibility\n• Appearance\n• Behavior\n• Configuration\n• Data\n• Design\n• Focus\n• Layout\n•\nStyle\n6. New Features\nNew features may include:\n• Audio\n• Video\n• Canvas\n• SVG graphics\n• Storage\n•\nGeolocation\n\n• Section\n• Article\n• Nav\n• Header\n• Footer\n•\nAside\n7. HTML5 input types\nNew input types may include:\n• date\n• datetime\n• datetime-local\n• month\n• number\n• email\n• telephone\n• time\n• URL\n• week\n• range\n• Search\n•\ncolor\n8. MVVM design\npattern with\nJavaScript\nThis can be implemented using, but not limited, to the\nfollowing frameworks:\n•\nAngularJS\n•\nKnockoutJS\n\n--- PDF PAGE 34 ---\nPage 32\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Developed basic HTML document using HTMP5 and CSS 3\nsyntax\n1.2. Created HTML5 document using advanced techniques with\nJavaScript and CSS3\n1.3. Communicated with Remote Data Source and Created Objects\nand Methods using JavaScript\n1.4. Created interactive and responsive user interface\n1.5. Added offline support to Web Applications\n1.6. Implemented an Adaptive User Interface\n1.7. Used CSS3 to create scalable graphics and animated user\ninterface\n1.8. Implemented real-time communications by using web-sockets\nand web worker process\n1.9. Design and implement Windows Store applications using\nMVVM design pattern\n2. Underpinning\nKnowledge and\nAttitude\n2.1. Knowledge of UML or other modelling tools\n2.2. Create the document structure\n2.3. Write code that interacts with UI controls\n2.4. Apply styling to HTML elements programmatically\n2.5. Write code against HTML5 APIs\n2.6. Establish the scope of objects and variables\n2.7. Create and implement objects and methods\n2.8. Implement program flow\n2.9. Raise and handle an event\n2.10. Implement exception handling\n2.11. Implement a callback\n2.12. Create a web worker process\n2.13. Validate user input by using HTML5 elements\n2.14. Validate user input by using JavaScript\n2.15. Consume data\n2.16. Serialize, de-serialize and transmit data\n2.17. Style HTML properties\n2.18. Create a flexible content layout\n2.19. Create an animated and adaptive UI\n2.20. Find elements by using CSS selectors and jQuery\n2.21. Structure a CSS file by using CSS selectors\n2.22. OHS standards and 5S principles\n3. Underpinning\nSkills\n3.1. Domain modeling / Object-Oriented breakdown and\nencapsulation\n3.2. Function breakdown and encapsulation\n3.3. Interaction diagram modeling.\n3.4. Detailed / step-by-step process modeling\n3.5. Documentation\n3.6. Write website with HTML5, CSS3 and JavaScript\n3.7. Usage of IDE\n3.8. Debugging\n3.9. Testing\n3.10. Tracing\n3.11. Manipulating XML and JSON\n3.12. Creating an installation package\n3.13. Deploying and configuring installation package\n\n--- PDF PAGE 35 ---\nPage 33\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to PC work station and requisite software\n4.2. Access to HTML5 development tools and hardware\n4.3. Access to Windows store development tools and\nhardware\n4.4. Materials relevant to the proposed activity or tasks\n4.5. Internet connection (for setting up and familiarization with\nsoftware sources)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Demonstration with questioning\n5.2. Observation with questioning\n5.3. Third party report\n5.4. Assessment of produced documents\n5.5. Deployment of “Programming in HTML5 with JavaScript\nand CSS3” certification exam\n6. Context for\nAssessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 36 ---\nPage 34\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nUNIT OF COMPETENCY : DEVELOPING ASP.NET MVC WEB APPLICATIONS\n\nUNIT CODE\n : ICT313358\n\nUNIT DESCRIPTOR :\nIn this course, students will learn to develop advanced\nASP.NET MVC 5 (or higher) applications using .NET\nFramework 4.5 (or higher) tools and technologies. The\nfocus will be on coding activities that enhance the\nperformance and scalability of the Web site application.\nThe Model View Controller (MVC) architectural pattern will\nbe explained in this course. ASP.NET MVC will be\nintroduced and compared with Web Forms so that students\nknow when each should/could be used.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Employ basic\nproject\nmanagement tasks\n\n1.1 Feature list is prepared in line with client requirements\n1.2 Effective Excel Survey form is used to gather client\ninformation and requirements\n1.3 Release plan is prepared and agreed with clients based on\ndependencies and business values\n1.4 Visual presentation and supporting documents are presented\nduring the client meeting\n1.5 Tasks required to complete the feature are identified based on\nfeature list and established design approach\n1.6 Time estimates per task is assigned based on degree of\ncomplexity and size.\n1.7 Analysis of development resources is performed\n1.8 Tasks and To-do list are itemized using OneNote and Team\nSites\n1.9 Lync Online is used effectively for online internal meetings\nthroughout the project development\n1.10 Used test case scenarios are formulated and documented\nusing specified format and in line with client requirements\n1.11 Test cases are plotted in Excel Worksheets\n1.12 Business process are documented using agreed\nrepresentation format\n2. Perform Object-\noriented\nprogramming with\nC#\n2.1 The architecture of .NET Framework applications is described\nand the features that Visual Studio 2013 or higher and\nprogramming language provided are used to support .NET\nFramework development.\n2.2 The basic data types, operators, and expressions are used.\n2.3 Standard programming language constructs is used.\n2.4 Create and invoke methods, pass parameters to methods,\nand return values from methods are used.\n2.5 Overloaded methods are created and optional & output\nparameters are used.\n2.6 Exceptions are catch and handled and information are written\nto the event log.\n\n2.7 Requirement for implementing logging, tracing, and profiling is\nexplained when building large-scale applications.\n2.8 Principles of object-oriented programming are described.\n2.9 Custom classes are created and used.\n\n--- PDF PAGE 37 ---\nPage 35\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n2.10 Custom interfaces are defined and implemented.\n2.11 Generics are used to implement type-safe collections.\n2.12 Abstract classes and inherit are defined from base classes to\ncreate a class hierarchy.\n2.13 Inherit from .NET Framework classes and extension methods\nare used to add custom functionality to the inherited class.\n2.14 Generic classes and methods are created.\n3. Develop ASP.NET\nWeb Applications\nusing Model View\nController\narchitectural\npattern\n3.1 The Microsoft Web Technologies stack is described.\n3.2 Appropriate technology is selected to use to develop any\ngiven application.\n3.3 Architecture of web application is designed to meet a set\nof functional requirements, user interface requirements, and\naddress business models.\n3.4 The implementation of a web application that will meet a set\nof functional requirements, user interface requirements, and\naddress business models is designed.\n3.5 MVC Models are created.\n3.6 Code that implements business logic within Model methods,\nproperties, and events is written.\n3.7 Controllers to an MVC Application is added to manage user\ninteraction\n3.8 Models are updated.\n3.9 Select and return Views.\n3.10 Razor syntax is used to create Views in an MVC application\nthat display\n3.11 Data is edited.\n3.12 Interact with Models and Controllers.\n4. Test and debug\nASP.NET MVC\nWeb Applications\n4.1 Unit tests and debugging tools are ran against a web\napplication in Visual Studio\n4.2 An application for troubleshooting is configured.\n5. Create custom\nURLs and apply\nstyle to ASP.NET\nMVC Web\napplications\n5.1 A web application that uses the ASP.NET routing engine to\npresent friendly URLs is developed.\n5.2 A web application that uses the ASP.NET routing engine to a\nlogical navigation hierarchy to users is developed.\n5.3 Template Views are used.\n5.4 A Consistent Look and Feel is applied to an MVC Application\n5.5\nWeb Pages for Different Browsers are adapted\n6. Create responsive\nweb pages and\nimplementing\nsecurity\n6.1 Partial page updates and caching are used to reduce the\nnetwork bandwidth used by an application\n6.2 Accelerate responses to user requests is performed.\n6.3 JavaScript code that runs on the client-side is written\n6.4 JQuery script library is utilized to optimize the\nresponsiveness of an MVC web application.\n6.5 Authentication is implemented in an MVC web application\nusing Membership Provider.\n6.6 Authorization is implemented in an MVC web application\nusing Role Provider.\n6.7 A secure MVC application that resists malicious attacks is\nbuilt.\n6.8 An MVC application that persist information about users and\npreferences is built.\n\n--- PDF PAGE 38 ---\nPage 36\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\n7. Create RESTful\nAPI, modify URLs\nand deploy\nASP.NET MVC\napplications\n7.1\nA Web API is described\n7.2\nWhy developers might add a Web API to an application is\nidentified and explained.\n7.3\nRESTful web API is built and consumed from other\napplications.\n7.4\nModifying the way browser requests are handled by an MVC\napplication using HTTP modules and HTTP handlers.\n7.5\nRequest from browser using web sockets is intercepted.\n7.6\nWindows Azure web service is written\n7.7\nCode written to call the web service from and MVC\napplication.\n7.8\nAn ASP.NET MVC 5 web application from a development\ncomputer is packaged to a web server for staging or\nproduction.\n7.9\nAn ASP.NET MVC 5 web application from a development\ncomputer is deployed to a web server for staging or\nproduction.\n\n--- PDF PAGE 39 ---\nPage 37\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Client\nrequirements\nClient requirements may include:\n• Application features\n•\nTechnical requirements\n2. development\nresources\nDevelopment resources may include:\n• personnel\n• time\n•\nclient specifications\n3. OneNote\nOffice OneNote may include:\n• Creating notebook\n• Creating sections\n•\nRecord meetings\n4. Team Sites\nTeam Sites may include:\n• Team tasks/to do\n• Team calendar\n• Team files\n•\nTeam OneNote\n5. Lync Online\nLync Online may include:\n• Audio and Video Conference\n• Desktop and PowerPoint Sharing\n•\nOneNote and File Attachment Sharing\n6. Specified format\nSpecified format may be:\n•\nUML –Use Cases\n•\nStep-by-step procedure\n•\nProduct backlog list\n•\nSprint backlog list\n•\nBurn down chart\n7. Excel Worksheet\nExcel Worksheet may include but not limited:\n• Tables or PivotTables\n• Spark Lines\n•\nGraphs or Charts\n8. Representation\nformat\nRepresentation format may be:\n• UML Activity diagram\n• Diagram for the domain model\n• Flow chart\n• Written step-by-step procedure\n• Table (ie. Taxation table)\n• Lists of company policies\n• Sample reports and forms\n9. Microsoft web\ntechnologies\nstack\nASP.NET web technologies stack may include :\n• Personalization\n• Membership\n• Roles\n• Data Sources\n• Site Map\n• Resource\n•\nSecurity\n\n--- PDF PAGE 40 ---\nPage 38\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\n10. Architecture of web\napplications\nThis may include the following:\n• Planning Models\n• Planning Controllers\n• Planning Views\n• Architecting an MVC Application\n11. Create MVC\nModels\nCreating MVC Models may include:\n• Creating an MVC Project and Adding a Model\n• Creating a New SQL Azure Database in Visual Studio\n• Adding Properties and Methods to MVC Models\n• Using Display and Edit Annotations in MVC Models\n12. Add Controllers\nThis may include the following:\n• Adding an MVC Controller and Writing the Actions\n• Writing the Action Filters in a Controller\n13. Create Views\nThis may include the following:\n• Adding a View for Web Page Display\n• Creating and Using a Partial View\n• Testing the Views\n14. Accelerate\nResponses\nThis may include the following:\n•\nChoose a state management mechanism (in-process and out\nof process state management)\n•\nPlan for scalability; use cookies or local storage to maintain\nstate\n•\nApply configuration settings in web.config file\n•\nImplement session less state (for example, QueryString)\n•\nImplement page output caching (performance oriented)\n•\nImplement data caching; implement HTTP caching\n•\nRead and write string and binary data asynchronously (long-\nrunning data transfers)\n•\nChoose a connection loss strategy\n•\nDecide a strategy for when to use Web Sockets\n15. Optimize the\nresponsiveness\nThis may include the following:\n•\nImplement client validation with JQuery\n•\nUse JavaScript and the DOM to control application behavior\n•\nExtend objects by using prototypal inheritance\nUse AJAX to make partial page updates\n•\nImplement the UI by using JQuery\n16. Authentication\nThis may include the following:\n•\nConfiguring Authentication and Membership Provider\n•\nAuthenticate users\n•\nEnforce authentication settings\n•\nChoose between Windows, Forms, and custom authentication\n•\nManage user session by using cookies\n•\nConfigure membership providers\n•\nCreate custom membership providers\n•\nBuilding the Logon and Register Views\n•\nBuilding a Password Reset View\n\n--- PDF PAGE 41 ---\nPage 39\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\n17. Authorization\nThis may include the following:\n• Configuring Authorization and Roles Provider\n• Authorizing Access to Resources\n• Create roles\n• Authorize roles by using configuration\n• Authorize roles programmatically\n• Create custom role providers; implement WCF service\nauthorization\n18. Secure MVC Web\nApplication\nThis may include the following:\n• Secure communication by applying SSL certificates\n• Salt and hash passwords for storage\n• Use HTML encoding to prevent cross-site scripting\nattacks (ANTI-XSS Library)\n• Implement deferred validation and handle unvalidated\nrequests, for example, form, querystring, and URL\n• Prevent SQL injection attacks by parameterizing queries\n• Prevent cross-site request forgeries (XSRF)\n19. Malicious Attacks\nThis may include the following:\n• Cross-site scripting\n•\nSQL injection\n20. HTTP Modules and\nHTTP Handlers\nThis may include the following:\n• Implement synchronous and asynchronous modules\nand handlers\n•\nChoose between modules and handlers in IIS\n21. Windows Azure\nWeb Service\nThis may include the following:\n• Creating and Coding a service on Windows Azure\nCloud Services\n• Consuming Data from a Windows Azure Service\n22. Staging or\nProduction\nStaging or production server may include:\n• On-premise web server\n• Windows Azure Cloud Service, Websites, or Virtual\nMachine with Internet information Services (IIS)\ninstalled\n\n--- PDF PAGE 42 ---\nPage 40\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Employed basic project management tasks\n1.2. Performed Object-oriented programming with C#\n1.3. Developed ASP.NET Web Applications using Model View\nController or architectural patterns\n1.4. Tested and debugged ASP.NET MVC Web Applications\n1.5. Created custom URLs and apply style to ASP.NET MVC\nWeb applications\n1.6. Created responsive web pages and implementing security\n1.7. Created RESTful API, modify URLs and deploy ASP.NET\nMVC applications\n\n2. Underpinning\nKnowledge\n2.1.\nValue of an end-to-end view of Application Lifecycle\nManagement (ALM) tools and practices. ALM practice may\ninclude agile methodologies, such as, SCRUM and KANBAN\n2.2.\nBenefits of fast feedback\n2.3.\nImplementation strategies to reduce end-to-end cycle time\n2.4.\nImplementation strategies to improve software quality\n2.5.\nImplementation strategies to reduce waste\n2.6.\nCreate a process improvement plan\n2.7.\nRole of different ALM processes\n2.8.\nImplementation of a Scrum/Agile process\n2.9.\nDefine a Scrum/Agile process for a team\n2.10. Implementation of Microsoft Solution Framework for CMMI\nprocess improvement\n2.11. Plan a release\n2.12. Definition of a project-tracking process\n2.13. Scoping of a project\n2.14. Elicit requirements\n2.15. Estimation of requirements\n2.16. Document requirements\n2.17. Prioritization of requirements\n2.18. Define code quality indicators\n2.19. Incorporation of unit testing\n2.20. Code Development\n2.21. Quality Validation\n2.22. Team project customization\n2.23. Implementation of an automated deployment process\n2.24. Implementation of pre-production environment\n2.25. Manage feedback between development and operations\n2.26. Troubleshoot production issues\n2.27. Planning the application layers\n2.28. Designing a distributed application\n2.29. Designing and implementing the Windows Azure life cycle\n2.30. Configure state management\n2.31. Designing a caching strategy\n2.32. Designing and implementing a Web Socket strategy\n2.33. Designing HTTP modules and handlers\n2.34. Apply the user interface design for a web application\n2.35. Designing and implementing UI behavior\n2.36. Compose the UI layout of an application\n\n--- PDF PAGE 43 ---\nPage 41\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n2.37. Enhance application behavior and style based on browser\nfeature detection\n2.38. Plan an adaptive UI layout\n2.39. Plan for search engine optimization and accessibility\n2.40. Plan and implement globalization and localization\n2.41. Design and implement MVC controllers and actions\n2.42. Design and implement routes\n2.43. Control application behavior by using MVC controllers and\nactions\n2.44. Design and implement routes\n2.45. Control application behavior by using MVC extensibility points\n2.46. Reduce network bandwidth\n2.47. Prevent and troubleshoot runtime issues\n2.48. Design an exception handling strategy\n2.49. Debug a Windows Azure application\n2.50. Configure authentication\n2.51. Configure and apply authorization\n2.52. Design and implement claims-based authentication across\nfederated identity stores\n2.53. Manage data integrity\n2.54. Implement a secure site with ASP.NET\n2.55. Implement multithreading and asynchronous processing\n2.56. Manage multithreading\n2.57. Implement program flow\n2.58. Create and implement events and callbacks\n2.59. Implement exception handling\n2.60. Create types\n2.61. Consume types\n2.62. Enforce encapsulation\n2.63. Create and implement a class hierarchy\n2.64. Find, execute & create types at runtime by using reflection\n2.65. Manage the object life cycle\n2.66. Manipulate strings\n2.67. Validate application input\n2.68. Perform symmetric and asymmetric encryption\n2.69. Manage assemblies\n2.70. Debug an application\n2.71. Implement diagnostics in an application\n2.72. Perform I/O operations\n2.73. Consume data\n2.74. Query and manipulate data and objects by using LINQ\n2.75. Serialize and deserialize data\n2.76. Store data in and retrieve data from collections\n3. Underpinning\nSkills\n3.1. Interaction diagram modeling.\n3.2. Detailed/ step-by-step process modeling\n3.3. Documentation\n3.4. Using IDE\n3.5. Testing and debugging ASP.NET MVC Web Applications\n3.6. Tracing\n3.7. Developing ASP.NET web applications\n3.8. Creating an installation package\n3.9.\nDeploying and configuring installation package\n\n--- PDF PAGE 44 ---\nPage 42\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to PC work station and requisite software\n4.2. Access to .NET development tools and hardware\n4.3. Office 365 account\n4.4. Materials relevant to the proposed activity or tasks\n4.5. Internet connection (for setting up and familiarization with\nsoftware sources)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Demonstration with questioning\n5.2. Observation with questioning\n5.3. Third party report\n5.4. Portfolio\n5.5. Deployment of “Developing ASP.NET MVC5 (or higher)\nWeb Applications” certification exam\n\n6. Context for\nAssessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\nReference: Contents of Core Competencies are derived from the contents of the Certification\nExams from Microsoft Learning < http://www.microsoft.com/learning>.\n\n--- PDF PAGE 45 ---\nPage 43\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013"
