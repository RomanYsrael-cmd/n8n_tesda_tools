wing programs \n7.3 \nDeleting unwanted files \n7.4 \nBacking up files \n7.5 \nChecking hard drive for errors \n7.6 \nUsing up to date anti-virus programs \n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 29 ---\nPage  27  \nTraining Regulations – Programming (.NET Technology) NC III                    Promulgated – December 2013"
