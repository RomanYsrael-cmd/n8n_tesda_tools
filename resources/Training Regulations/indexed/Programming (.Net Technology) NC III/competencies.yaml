        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Developed basic HTML document using HTMP5 and CSS 3\nsyntax\n1.2. Created HTML5 document using advanced techniques with\nJavaScript and CSS3\n1.3. Communicated with Remote Data Source and Created Objects\nand Methods using JavaScript\n1.4. Created interactive and responsive user interface\n1.5. Added offline support to Web Applications\n1.6. Implemented an Adaptive User Interface\n1.7. Used CSS3 to create scalable graphics and animated user\ninterface\n1.8. Implemented real-time communications by using web-sockets\nand web worker process\n1.9. Design and implement Windows Store applications using\nMVVM design pattern\n2. Underpinning\nKnowledge and\nAttitude\n2.1. Knowledge of UML or other modelling tools\n2.2. Create the document structure\n2.3. Write code that interacts with UI controls\n2.4. Apply styling to HTML elements programmatically\n2.5. Write code against HTML5 APIs\n2.6. Establish the scope of objects and variables\n2.7. Create and implement objects and methods\n2.8. Implement program flow\n2.9. Raise and handle an event\n2.10. Implement exception handling\n2.11. Implement a callback\n2.12. Create a web worker process\n2.13. Validate user input by using HTML5 elements\n2.14. Validate user input by using JavaScript\n2.15. Consume data\n2.16. Serialize, de-serialize and transmit data\n2.17. Style HTML properties\n2.18. Create a flexible content layout\n2.19. Create an animated and adaptive UI\n2.20. Find elements by using CSS selectors and jQuery\n2.21. Structure a CSS file by using CSS selectors\n2.22. OHS standards and 5S principles\n3. Underpinning\nSkills\n3.1. Domain modeling / Object-Oriented breakdown and\nencapsulation\n3.2. Function breakdown and encapsulation\n3.3. Interaction diagram modeling.\n3.4. Detailed / step-by-step process modeling\n3.5. Documentation\n3.6. Write website with HTML5, CSS3 and JavaScript\n3.7. Usage of IDE\n3.8. Debugging\n3.9. Testing\n3.10. Tracing\n3.11. Manipulating XML and JSON\n3.12. Creating an installation package\n3.13. Deploying and configuring installation package\n\n--- PDF PAGE 35 ---\nPage 33\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to PC work station and requisite software\n4.2. Access to HTML5 development tools and hardware\n4.3. Access to Windows store development tools and\nhardware\n4.4. Materials relevant to the proposed activity or tasks\n4.5. Internet connection (for setting up and familiarization with\nsoftware sources)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Demonstration with questioning\n5.2. Observation with questioning\n5.3. Third party report\n5.4. Assessment of produced documents\n5.5. Deployment of “Programming in HTML5 with JavaScript\nand CSS3” certification exam\n6. Context for\nAssessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 36 ---\nPage 34\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nUNIT OF COMPETENCY : DEVELOPING ASP.NET MVC WEB APPLICATIONS\n\nUNIT CODE\n :"
        },
        "source_text": "ICT313357\n\nUNIT DESCRIPTOR :\nThis unit provides an introduction to HTML5, CSS3, and\nJavaScript. This course helps students gain basic\nHTML5/CSS3/JavaScript programming skills. This course\nis an entry point into both the Web application and\nWindows Store apps training paths. The course focuses\non\nusing\nHTML5/CSS3/JavaScript\nto\nimplement\nprogramming logic, define and use variables, perform\nlooping and branching, develop user interfaces, capture\nand validate user input, store data, and create well-\nstructured application. Further, this unit covers the skills,\nknowledge and attitude required in developing HTML5\nwebsites. This also includes an introduction to the\nWindows 8 platform and the Windows Store apps.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop basic\nHTML document\nusing HTMP5 and\nCSS 3 syntax\n\n1.1 Domain model is produced to illustrate different business\ndomain features.\n1.2 Business processes are documented using agreed\nrepresentation format.\n1.3 Interaction diagrams are produced that describe in detail\nhow the objects will interact with the business logic to\nperform the methods or functions of the business\nprocesses.\n1.4 Interaction diagrams are documented using agreed\nrepresentation format.\n1.5 An HTML5 document is created and configured according\nto user’s specification.\n1.6 The HTML5 document is designed using cascading style\nsheet 3 (CSS3).\n2. Create HTML5\ndocument using\nadvanced\ntechniques with\nJavaScript and\nCSS3\n\n2.1 Static pages are created using the new features available\nin HTML5.\n2.2 CSS3 is used to apply basic styling to the elements in an\nHTML5 page.\n2.3 Syntax of JavaScript is explained and how to use\nJavaScript with HTML5 is described.\n2.4 JavaScript code that manipulates the HTML DOM is written\nand events are handled.\n2.5 How to use jQuery is described to simplify code that uses\nmany common JavaScript APIs.\n2.6 Forms that use the new HTML5 input types are created.\n2.7 User input is validated and feedback is provided by using\nthe new HTML5 attributes.\n\n--- PDF PAGE 31 ---\nPage 29\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n2.8 JavaScript code is written to validate user input and\nfeedback is provided in cases where it is not suitable to use\nHTML5 attributes\n2.9 Text elements are styled on an HTML5 page by using\nCSS3.\n2.10 Styling is applied to block elements by using CSS3.\n2.11 CSS3 selectors are used to specify the elements to be\nstyled in a Web application.\n2.12 Graphical effects and transformations are implemented by\nusing the new CSS3 properties\n3. Communicate with\nRemote Data\nSource and Create\nObjects and\nMethods using\nJavaScript\n3.1 Data are serialized, deserialized, sent and received by\nusing XMLHTTPRequest object.\n3.2 Code that serializes, deserializes, sends, and receives data\nis simplified by using the jQuery ajax method.\n3.3 Benefits of structuring JavaScript code is described\ncarefully to aid maintainability and extensibility.\n3.4 Best practices are explained for creating custom objects in\nJavaScript.\n3.5 How to extend custom and native objects is described to\nadd functionality.\n4. Create intuitive\nuser interface and\nadd offline support\nfor web\napplications\n4.1 Drag and Drop and File APIs are used to interact with files\nin a Web application.\n4.2 Audio and video are incorporated into a Web application.\n4.3 Location of the user running a Web application is detected\nby using the Geolocation API.\n4.4 How to debug and profile a Web application is explained by\nusing the Web Timing API.\n4.5 The need to detect device capabilities is described and\nreacted to different form factors in a Web application.\n4.6 Web page that can dynamically adapt its layout to match\ndifferent form factors is created.\n4.7 Data is saved and retrieved locally on the user's computer\nby using the Local Storage API.\n4.8 Offline support is provided for a Web application by using\nthe Application Cache API.\n5. Use CSS3 to\ncreate scalable\ngraphics and\nanimated user\ninterface\n5.1 Scalable Vector Graphics are used to add interactive\ngraphics to an application.\n5.2 Complex graphics are drawn on an HTML5 Canvas\nelement by using JavaScript code.\n5.3 CSS transitions are applied to elements on an HTML5\npage, and write JavaScript code to detect when a transition\nhas occurred.\n5.4 Different types of 2D and 3D transitions available with\nCSS3 are described.\n5.5 Complex animations are implemented by using CSS key-\nframes and JavaScript code.\n\n--- PDF PAGE 32 ---\nPage 30\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n\n6. Implement real-\ntime\ncommunications\nby using web-\nsockets and web\nworker process\n6.1 How Web Sockets work is explained and how to send and\nreceive data through a Web Socket is described.\n6.2 Web Socket API with JavaScript is used to connect to a\nWeb Socket server, send and receive data, and handle the\ndifferent events that can occur when a message is sent or\nreceived.\n6.3 The purpose of a Web Worker process and how it can be\nused to perform asynchronous processing as well as\nprovide isolation for sensitive operations is described.\n6.4 Web Worker APIs from JavaScript code is used to create,\nrun, and monitor a Web Worker process.\n6.5 Occupational health and safety standards in the workplace\nand 5S disciplines are strictly followed as per enterprise\npolicies and procedures.\n7. Explore the\nWindows 8\nplatform and\nWindows Store\nApps\n7.1 Windows 8 platform, architecture, and features are\ndescribed.\n7.2 Basics of the Windows 8 UI and Windows Store app\nexperience and how it differs from Windows desktop apps\nare explained.\n7.3 New API model, how it supports building Windows Store\napps, and how it supports multiple language-specific\nprojections are explained.\n7.4 Single-page based Windows Store apps is described\n7.5 Windows store apps using MVVM (model-view-view-\nmodel) design pattern with JavaScript are designed and\nimplemented.\n\n--- PDF PAGE 33 ---\nPage 31\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business domain\nfeatures\nBusiness domain features may include but not limited:\n• Business domain objects\n• Inheritance relationships\n• Aggregation and Composition relationships\n• Methods or functions that identify the business\nprocesses that will be performed by the application\n2. Representation\nformat (business\nprocesses)\nRepresentation format may be:\n• Class diagram\n• Class Responsibility cards or diagram\n3. Interaction diagrams\nMay include:\n• Domain model\n•\nBusiness processes (see Analyze feature functionality)\n4. Representation\nformat (interaction\ndiagrams)\nRepresentation format may include and is not limited to:\n• Sequence diagrams\n• Communication diagrams\n• Interaction overview diagrams\n•\nTiming diagrams\n5. User’s Specifications\nThis may include configuring a window to control:\n• Accessibility\n• Appearance\n• Behavior\n• Configuration\n• Data\n• Design\n• Focus\n• Layout\n•\nStyle\n6. New Features\nNew features may include:\n• Audio\n• Video\n• Canvas\n• SVG graphics\n• Storage\n•\nGeolocation\n\n• Section\n• Article\n• Nav\n• Header\n• Footer\n•\nAside\n7. HTML5 input types\nNew input types may include:\n• date\n• datetime\n• datetime-local\n• month\n• number\n• email\n• telephone\n• time\n• URL\n• week\n• range\n• Search\n•\ncolor\n8. MVVM design\npattern with\nJavaScript\nThis can be implemented using, but not limited, to the\nfollowing frameworks:\n•\nAngularJS\n•\nKnockoutJS\n\n--- PDF PAGE 34 ---\nPage 32\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Developed basic HTML document using HTMP5 and CSS 3\nsyntax\n1.2. Created HTML5 document using advanced techniques with\nJavaScript and CSS3\n1.3. Communicated with Remote Data Source and Created Objects\nand Methods using JavaScript\n1.4. Created interactive and responsive user interface\n1.5. Added offline support to Web Applications\n1.6. Implemented an Adaptive User Interface\n1.7. Used CSS3 to create scalable graphics and animated user\ninterface\n1.8. Implemented real-time communications by using web-sockets\nand web worker process\n1.9. Design and implement Windows Store applications using\nMVVM design pattern\n2. Underpinning\nKnowledge and\nAttitude\n2.1. Knowledge of UML or other modelling tools\n2.2. Create the document structure\n2.3. Write code that interacts with UI controls\n2.4. Apply styling to HTML elements programmatically\n2.5. Write code against HTML5 APIs\n2.6. Establish the scope of objects and variables\n2.7. Create and implement objects and methods\n2.8. Implement program flow\n2.9. Raise and handle an event\n2.10. Implement exception handling\n2.11. Implement a callback\n2.12. Create a web worker process\n2.13. Validate user input by using HTML5 elements\n2.14. Validate user input by using JavaScript\n2.15. Consume data\n2.16. Serialize, de-serialize and transmit data\n2.17. Style HTML properties\n2.18. Create a flexible content layout\n2.19. Create an animated and adaptive UI\n2.20. Find elements by using CSS selectors and jQuery\n2.21. Structure a CSS file by using CSS selectors\n2.22. OHS standards and 5S principles\n3. Underpinning\nSkills\n3.1. Domain modeling / Object-Oriented breakdown and\nencapsulation\n3.2. Function breakdown and encapsulation\n3.3. Interaction diagram modeling.\n3.4. Detailed / step-by-step process modeling\n3.5. Documentation\n3.6. Write website with HTML5, CSS3 and JavaScript\n3.7. Usage of IDE\n3.8. Debugging\n3.9. Testing\n3.10. Tracing\n3.11. Manipulating XML and JSON\n3.12. Creating an installation package\n3.13. Deploying and configuring installation package\n\n--- PDF PAGE 35 ---\nPage 33\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to PC work station and requisite software\n4.2. Access to HTML5 development tools and hardware\n4.3. Access to Windows store development tools and\nhardware\n4.4. Materials relevant to the proposed activity or tasks\n4.5. Internet connection (for setting up and familiarization with\nsoftware sources)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Demonstration with questioning\n5.2. Observation with questioning\n5.3. Third party report\n5.4. Assessment of produced documents\n5.5. Deployment of “Programming in HTML5 with JavaScript\nand CSS3” certification exam\n6. Context for\nAssessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 36 ---\nPage 34\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\nUNIT OF COMPETENCY : DEVELOPING ASP.NET MVC WEB APPLICATIONS\n\nUNIT CODE\n :"
