    {
      "number": "9",
      "text": "Computer program - also a software program, or just a program, is a sequence of instructions written to perform a specified task for a computer. A computer requires programs to function, typically executing the program's instructions in a central processor. The program has an executable form that the computer can use directly to execute the instructions. The same program in its human-readable source code form, from which executable programs are derived (e.g., compiled), enables a programmer to study and develop its algorithms."
    },
    {
      "number": "10",
      "text": "Computer programming - is the iterative process of writing or editing source code. Editing source code involves testing, analyzing, and refining, and sometimes coordinating with other programmers on a jointly developed program. A person who practices this skill is referred to as a computer programmer, software developer or coder. The sometimes lengthy process of computer programming is usually referred to as software development."
    },
    {
      "number": "11",
      "text": "Computer Terminal – any input/output device connected by telecommunications links to a computer."
    },
    {
      "number": "12",
      "text": "C language - is an imperative (procedural) systems implementation language. It was designed to be compiled using a relatively straightforward compiler, to provide low-level access to memory, to provide language constructs that map efficiently to machine instructions, and to require minimal run-time support. C was therefore useful for many applications that had formerly been coded in assembly language."
    },
    {
      "number": "13",
      "text": "C++ language - is a statically typed, free-form, multi-paradigm, compiled, general- purpose programming language. It comprises a combination of both high-level and low- level language features. Some of its application domains include systems software, application software, device drivers, embedded software, high-performance server and client applications, and entertainment software such as video games."
    },
    {
      "number": "14",
      "text": "Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. --- PDF PAGE 56 --- _________________________________________________________________________________ TR – Programming (.Net Technology) NC III Promulgated____________ 2013 54"
    },
    {
      "number": "15",
      "text": "Data access - typically refers to software and activities related to storing, retrieving, or acting on data housed in a database or other repository. Historically, different methods and languages were required for every repository, including each different database, file system, etc., and many of these repositories stored their content in different and incompatible formats."
    },
    {
      "number": "16",
      "text": "Decompiler - is the name given to a computer program that performs the reverse operation to that of a compiler. That is, it translates a file containing information at a relatively low level of abstraction (usually designed to be computer readable rather than human readable) into a form having a higher level of abstraction (usually designed to be human readable)"
    },
