      "text": "5 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”. --- PDF PAGE 52 --- Page 50 Training Regulations – Programming (.NET Technology) NC III Promulgated – December 2013 COMPETENCY MAP – INFORMATION AND COMMUNICATIONS TECHNOLOGY (ICT) SECTOR Receive and Respond to workplace communication Work with Others Demonstrate Work Values Participate in Workplace Communication Work in a Team Environment Practice Career Professionalism Practice occupational Health and Safety Procedures Practice Housekeeping Procedures (5S) Lead Workplace Communication Lead Small Team Develop and Practice Negotiation Skills Solve Problems Related to Work Activities Use Mathematical Concepts and Techniques Use Relevant Technologies Utilize Specialized Communication skills Develop Team and Individual Apply Problem Solving Techniques in the Workplace Collect, Analyze and Organize Information Plan and Organize Work Promote Environmental Protection Perform Computer Operation Apply Quality Standards Communicate Effectively using the English Language Deliver Quality Customer Service Communicate Effectively in a Customer Contact Center Utilize Enterprise/ Company Technology Conduct Contact Center Campaign Provide Specialized Support and Assistance to Customers Manage the Activities of a Contact Center Work Team Demonstrate Understanding and Knowledge of the American Culture and Geography Perform Basic Computer Operation and Internet Navigation Lead a Contact Center Work Team Use Business Technology Use Medical Terminology to Carry Out Task Produce Text from Audio Transcription Produce Cleaned-up and In- betweened Drawings Review / Edit Documents Manage the Activities of a Work Team Lead a Team in Delivering Quality Service Produce Over-all Designs for Animation Create 2D Models and Images Produce 2D Colo