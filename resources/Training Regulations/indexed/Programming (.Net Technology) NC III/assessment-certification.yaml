      "number": "29",
      "text": "Microsoft SQL Server - is a relational model database server produced by Microsoft. Its primary query languages are T-SQL and ANSI SQL --- PDF PAGE 57 --- _________________________________________________________________________________ TR – Programming (.Net Technology) NC III Promulgated____________ 2013 55"
