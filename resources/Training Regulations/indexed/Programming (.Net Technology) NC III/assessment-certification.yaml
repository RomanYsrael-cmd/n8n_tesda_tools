      "number": "30",
      "text": "Object code - or an object file, is the representation of code that a compiler or assembler generates by processing a source code file. Object files contain compact code, often called \"binaries\". A linker is typically used to generate an executable or library by linking object files together. The only essential element in an object file is machine code (code directly executed by a computer's CPU). Object files for embedded systems might contain nothing but machine code. However, object files often also contain data for use by the code at runtime, relocation information, program symbols (names of variables and functions) for linking and/or debugging purposes, and other debugging information."
    },
    {
      "number": "31",
      "text": "Oracle Forms - is a software product for creating screens that interact with an Oracle database. It has a typical IDE including an object navigator, property sheet and code editor that uses PL/SQL. It was originally developed to run server-side in character mode terminal sessions. It was ported to other platforms, including Windows, to function in a client–server environment. Later versions were ported to Java where it runs in a Java EE container and can integrate with Java and web services. The primary focus of Forms is to create data entry systems that access an Oracle database."
    },
