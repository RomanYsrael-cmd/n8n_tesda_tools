  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Programming (.NET Technology) NC\nIII, the candidate must demonstrate competency in all the units listed in\nSection 1. Successful candidates shall be awarded a National Certificate\nlevel III signed by the TESDA Director General.\n\n4.2\nThe qualification Programming (.NET Technology) NC III may be attained\nthrough accumulation of Microsoft Examinations, specifically relevant to the\nfollowing employable competencies:\n\n4.2.1 Perform Programming in HTML5 with JavaScript and CSS3\n\n4.2.2 Develop ASP.NET MVC5 (or higher) Web Applications\n\nUpon accumulation and submission of all Microsoft certificates acquired for\nall the relevant units of competency comprising this qualification, an\nindividual shall be issued the corresponding National Certificate.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.4.2.\nExperienced workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 52 ---\nPage 50\nTraining Regulations – Programming (.NET Technology) NC III Promulgated – December 2013\n"
}
