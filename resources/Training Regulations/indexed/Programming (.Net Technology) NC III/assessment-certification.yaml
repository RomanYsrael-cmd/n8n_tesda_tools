    {
      "number": "16",
      "text": "National Certificate (NC) – is a certification issued to individuals who achieve all the required units of competency for a national qualification defined under the Training Regulations. NCs are aligned to specific levels within the PTQF"
    },
    {
      "number": "17",
      "text": "Performance Criteria - are evaluative statements that specify what is to be assessed and the required level of performance"
    },
    {
      "number": "18",
      "text": "Qualification - is a cluster of units of competencies that meets job roles and is significant in the workplace. It is also a certification awarded to a person on successful completion of a course in recognition of having demonstrated competencies in an industry sector"
    },
    {
      "number": "19",
      "text": "Range of Variables - describes the circumstances or context in which the work is to be performed"
    },
    {
      "number": "20",
      "text": "Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s skills, knowledge and attitudes gained from life and work experiences outside registered training programs"
    },
    {
      "number": "21",
      "text": "Resource Implications - refers to the resources needed for the successful performance of the work activity described in the unit of competency. It includes work environment and conditions, materials, tools and equipment"
    },
    {
      "number": "22",
      "text": "Training Regulations (TR) – refers to the document promulgated and issued by TESDA consisting of competency standards, national qualifications and training guidelines for specific sectors/occupations. The TR serves as basis for establishment of qualification and certification under the PTQF. It also serves as guide for development of competency-based curricula and instructional materials including registration of TVET programs offered by TVET providers"
    },
    {
      "number": "23",
      "text": "Underpinning Knowledge - refers to the competency that involves in applying knowledge to perform work activities. It includes specific knowledge that is essential to the performance of the competency"
    },
    {
      "number": "24",
      "text": "Underpinning Skills - refers to the list of the skills needed to achieve the elements and performance criteria in the unit of competency. It includes generic and industry specific skills"
