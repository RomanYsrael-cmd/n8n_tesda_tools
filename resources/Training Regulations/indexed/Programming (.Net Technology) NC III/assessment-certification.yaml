      "number": "1",
      "text": "Basic Competencies - are the skills and knowledge that everyone needs for work"
    },
    {
      "number": "2",
      "text": "Certification - is the process of verifying and validating the competencies of a person through assessment"
    },
    {
      "number": "3",
      "text": "Certificate of Competency (COC) – is a certification issued to individuals who pass the assessment for a single unit or cluster of units of competency"
    },
    {
      "number": "4",
      "text": "Common Competencies - are the skills and knowledge needed by all people working in a particular industry"
    },
    {
      "number": "5",
      "text": "Competency - is the possession and application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace"
    },
    {
