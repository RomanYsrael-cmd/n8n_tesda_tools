      "number": "38",
      "text": "Service-oriented programming (SOP) - is a programming paradigm that uses \"services\" as the unit of computer work, to design and implement integrated business applications and mission critical software programs. Services can represent steps of business processes and thus one of the main applications of this paradigm is the cost- effective delivery of standalone or composite business applications that can “integrate from the inside-out.”"
