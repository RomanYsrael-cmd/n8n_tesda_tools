    {
      "number": "1",
      "text": "ADO.NET - is a set of computer software components that programmers can use to access data and data services. It is a part of the base class library that is included with the Microsoft .NET Framework. It is commonly used by programmers to access and modify data stored in relational database systems, though it can also access data in non- relational sources. ADO.NET is sometimes considered an evolution of ActiveX Data Objects (ADO) technology, but was changed so extensively that it can be considered an entirely new product. --- PDF PAGE 55 --- _________________________________________________________________________________ TR – Programming (.Net Technology) NC III Promulgated____________ 2013 53"
    },
    {
      "number": "2",
      "text": "ASP.NET - is a web application framework developed and marketed by Microsoft to allow programmers to build dynamic web sites, web applications and web services. ASP.NET is built on the Common Language Runtime (CLR), allowing programmers to write ASP.NET code using any supported .NET language."
    },
    {
      "number": "3",
      "text": "Algorithm - is a type of effective method in which a list of well-defined instructions for completing a task will, when given an initial state, proceed through a well-defined series of successive states, eventually terminating in an end-state. The transition from one state to the next is not necessarily deterministic; some algorithms, known as probabilistic algorithms, incorporate randomness."
    },
    {
      "number": "4",
      "text": "Artificial intelligence programmer - develops the logic the game uses to carry out a large number of actions. An AI programmer may program pathfinding, strategy and enemy tactic systems. This is one of the most challenging aspects of game programming and its sophistication is developing rapidly."
    },
    {
      "number": "5",
      "text": "Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites."
    },
    {
      "number": "6",
      "text": "COBOL - is one of the oldest programming languages. Its name is an acronym for COmmon Business-Oriented Language, defining its primary domain in business, finance, and administrative systems for companies and governments."
    },
    {
      "number": "7",
      "text": "Compiler - is a computer program (or set of programs) that transforms source code written in a programming language (the source language) into another computer language (the target language, often having a binary form known as object code). The most common reason for wanting to transform source code is to create an executable program."
    },
    {
      "number": "8",
      "text": "Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results."
