      "definition": "is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF SECTOR SPECIFIC 1. ADO.NET - is a set of computer software components that programmers can use to access data and data services. It is a part of the base class library that is included with the Microsoft .NET Framework. It is commonly used by programmers to access and modify data stored in relational database systems, though it can also access data in non- relational sources. ADO.NET is sometimes considered an evolution of ActiveX Data Objects (ADO) technology, but was changed so extensively that it can be considered an entirely new product. TR – Programming (.Net Technology) NC III Promulgated____________ 2013 53 2. ASP.NET - is a web application framework developed and marketed by Microsoft to allow programmers to build dynamic web sites, web applications and web services. ASP.NET is built on the Common Language Runtime (CLR), allowing programmers to write ASP.NET code using any supported .NET language. 3. Algorithm - is a type of effective method in which a list of well-defined instructions for completing a task will, when given an initial state, proceed through a well-defined series of successive states, eventually terminating in an end-state. The transition from one state to the next is not necessarily deterministic; some algorithms, known as probabilistic algorithms, incorporate randomness. 4. Artificial intelligence programmer - develops the logic the game uses to carry out a large number of actions. An AI programmer may program pathfinding, strategy and enemy tactic systems. This is one of the most challenging aspects of game programming and its sophistication is developing rapidly. 5. Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. 6. COBOL - is one of the oldest programming languages. Its name is an acronym for COmmon Business-Oriented Language, defining its primary domain in business, finance, and administrative systems for companies and governments. 7. Compiler - is a computer program (or set of programs) that transforms source code written in a programming language (the source language) into another computer language (the target language, often having a binary form known as object code). The most common reason for wanting to transform source code is to create an executable program. 8. Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 9. Computer program - also a software program, or just a program, is a sequence of instructions written to perform a specified task for a computer. A computer requires programs to function, typically executing the program's instructions in a central processor. The program has an executable form that the computer can use directly to execute the instructions. The same program in its human-readable source code form, from which executable programs are derived (e.g., compiled), enables a programmer to study and develop its algorithms. 10. Computer programming - is the iterative process of writing or editing source code. Editing source code involves testing, analyzing, and refining, and sometimes coordinating with other programmers on a jointly developed program. A person who practices this skill is referred to as a computer programmer, software developer or coder. The sometimes lengthy process of computer programming is usually referred to as software development. 11. Computer Terminal – any input/output device connected by telecommunications links to a computer. 12. C language - is an imperative (procedural) systems implementation language. It was designed to be compiled using a relatively straightforward compiler, to provide low-level access to memory, to provide language constructs that map efficiently to machine instructions, and to require minimal run-time support. C was therefore useful for many applications that had formerly been coded in assembly language. 13. C++ language - is a statically typed, free-form, multi-paradigm, compiled, general- purpose programming language. It comprises a combination of both high-level and low- level language features. Some of its application domains include systems software, application software, device drivers, embedded software, high-performance server and client applications, and entertainment software such as video games. 14. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. TR – Programming (.Net Technology) NC III Promulgated____________ 2013 54 15. Data access - typically refers to software and activities related to storing, retrieving, or acting on data housed in a database or other repository. Historically, different methods and languages were required for every repository, including each different database, file system, etc., and many of these repositories stored their content in different and incompatible formats. 16. Decompiler - is the name given to a computer program that performs the reverse operation to that of a compiler. That is, it translates a file containing information at a relatively low level of abstraction (usually designed to be computer readable rather than human readable) into a form having a higher level of abstraction (usually designed to be human readable) 17. Documentation – a collection of documents or information. 18. Edit – to modify the form or format of data 19. End user – anyone who uses an information system or the information it produces. 20. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use. 21. HTML, which stands for HyperText Markup Language - is the predominant markup language for web pages. It is written in the form of HTML elements consisting of \"tags\" surrounded by angle brackets within the web page content. It is the building blocks of all basic websites. 22. Information – data placed in a meaningful and useful context for an end user. 23. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 24. Integrated development environment (IDE) - is a software application that provides comprehensive facilities to computer programmers for software development. An IDE normally consists of a source code editor, a compiler and/or interpreter, build automation tools, and (usually) a debugger. Typically an IDE is dedicated to a specific programming language, so as to provide a feature set which most closely matches the programming paradigms of the language. However, some multiple-language IDEs are in use, such as Eclipse, ActiveState Komodo, recent versions of NetBeans, and Microsoft Visual Studio. 25. Java - is a general-purpose, concurrent, class-based, object-oriented language that is specifically designed to have as few implementation dependencies as possible. It is intended to let application developers \"write once, run anywhere\". Java is currently one of the most popular programming languages in use, and is widely used from application software to web applications 26. Java applications - are typically compiled to bytecode (class file) that can run on any Java Virtual Machine (JVM) regardless of computer architecture. 27. Local Area Network (LAN) – a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites. 28. Microsoft .NET Framework - is a software framework that can be installed on computers running Microsoft Windows operating systems. It includes a large library of coded solutions to common programming problems and a common language infrastructure that manages the execution of programs written specifically for the framework. The .NET Framework supports multiple programming languages in a manner that allows language interoperability, whereby each language can utilize code written in other languages; in particular, the .NET library is available to all the programming languages that .NET encompasses. 29. Microsoft SQL Server - is a relational model database server produced by Microsoft. Its primary query languages are T-SQL and ANSI SQL TR – Programming (.Net Technology) NC III Promulgated____________ 2013 55 30. Object code - or an object file, is the representation of code that a compiler or assembler generates by processing a source code file. Object files contain compact code, often called \"binaries\". A linker is typically used to generate an executable or library by linking object files together. The only essential element in an object file is machine code (code directly executed by a computer's CPU). Object files for embedded systems might contain nothing but machine code. However, object files often also contain data for use by the code at runtime, relocation information, program symbols (names of variables and functions) for linking and/or debugging purposes, and other debugging information. 31. Oracle Forms - is a software product for creating screens that interact with an Oracle database. It has a typical IDE including an object navigator, property sheet and code editor that uses PL/SQL. It was originally developed to run server-side in character mode terminal sessions. It was ported to other platforms, including Windows, to function in a client–server environment. Later versions were ported to Java where it runs in a Java EE container and can integrate with Java and web services. The primary focus of Forms is to create data entry systems that access an Oracle database. 32. Oracle Reports - is a tool for developing reports against data stored in an Oracle database. Oracle Reports consists of Oracle Reports Developer (a component of the Oracle Developer Suite) and Oracle Application Server Reports Services (a component of the Oracle Application Server). 33. Outsourcing – turning over all or part of an organization’s information systems operation to outside contractors, known as systems integrators or facilities management companies. 34. Programming language - is an artificial language designed to express computations that can be performed by a machine, particularly a computer. Programming languages can be used to create programs that control the behavior of a machine, to express algorithms precisely, or as a mode of human communication. 35. Program Evaluation and Review Technique (PERT) – a statistical tool used in project management, that is designed to analyze and represent the tasks involved in completing a given project. 36. Quality Assurance – methods for ensuring that information systems are free from errors and fraud and provide information products of high quality. 37. Relational database management system (RDBMS) - is a database management system (DBMS) that is based on the relational model as introduced by E. F. Codd. Most popular commercial and open source databases currently in use are based on the relational database model. A short definition of an RDBMS may be a DBMS in which data is stored in the form of tables and the relationship among the data is also stored in the form of tables. 38. Service-oriented programming (SOP) - is a programming paradigm that uses \"services\" as the unit of computer work, to design and implement integrated business applications and mission critical software programs. Services can represent steps of business processes and thus one of the main applications of this paradigm is the cost- effective delivery of standalone or composite business applications that can “integrate from the inside-out.” 39. Software – computer programs and procedures concerned with the operation of an information system. 40. Source code - is any collection of statements or declarations written in some human- readable computer programming language. Source code is the means most often used by programmers to specify the actions to be performed by a computer. 41. SQL, often referred to as Structured Query Language - is a database computer language designed for managing data in relational database management systems (RDBMS), and originally based upon relational algebra. Its scope includes data insert, query, update and delete, schema creation and modification, and data access control. TR – Programming (.Net Technology) NC III Promulgated____________ 2013 56 42. Standards – measures of performance developed to evaluate the progress of a system toward its objectives 43. System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 44. User- friendly – a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use. 45. User interface - is the system by which people (users) interact with a machine. The user interface includes hardware (physical) and software (logical) components. User interfaces exist for various systems, and provide a means of: 1) Input, allowing the users to manipulate a system, and/or 2) Output, allowing the system to indicate the effects of the users' manipulation. 46. VB.NET – is a redesigned, object-oriented dialect of Visual Basic. 47. Web application - is an application that is accessed over a network such as the Internet or an intranet. The term may also mean a computer software application that is hosted in a browser-controlled environment (e.g. a Java applet) or coded in a browser-supported language (such as JavaScript, combined with a browser-rendered markup language like HTML) and reliant on a common web browser to render the application executable. 48. Windows Forms - is the name given to the graphical application programming interface (API) included as a part of Microsoft's .NET Framework, providing access to the native Microsoft Windows interface elements by wrapping the existing Windows API in managed code. While it is seen as a replacement for the earlier and more complex C++ based Microsoft Foundation Class Library, it does not offer a paradigm comparable to model–view–controller. 49. Windows Forms application - is an event-driven application supported by Microsoft's .NET Framework. Unlike a batch program, it spends most of its time simply waiting for the user to do something, such as fill in a text box or click a button. 50. Work Breakdown Structure (WBS) - is a deliverable oriented decomposition of a project into smaller components. TR – Programming (.Net Technology) NC III Promulgated____________ 2013 57"
