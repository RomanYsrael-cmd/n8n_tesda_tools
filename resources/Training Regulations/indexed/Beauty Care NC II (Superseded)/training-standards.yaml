    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: BEAUTY CARE\n\nNC Level: NC II\n\nNominal Training Duration:\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of beauticians in\naccordance with industry standards. It Covers basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Written\nexamination\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role Playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interview/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks.\n4.2 Control hazards and risks.\n4.3 Maintain occupational health\nand safety awareness.\n• Group\ndiscussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 61 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 57 -\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n1.1\nMaintain a professional image\n1.2\nBuild credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n2. Manage own\nperformance\n2.1\nPlan completion of own\nworkload\n2.2\nMaintain quality of own\nperformance\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Apply quality\nstandards\n3.1\nAssess clients service needs\n3.2\nAssess own work\n3.3\nEngage in quality improvement\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Maintain a safe,\nclean and\nefficient work\nenvironment\n4.1\nComply with health regulations\n4.2\nPrepare and maintain work\narea\n4.3\nCheck and maintain tools and\nequipment\n4.4\nCheck and maintain stocks\n4.5\nProvide a relaxed and caring\nenvironment\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 62 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 58 -\nCORE COMPETENCIES\n(1,060 Hours (6 months))\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre\nand post\nbeauty care\nservices\n1.1 Prepare tools and equipment\n1.2 Prepare clients\n1.3 Store tools, supplies,\nmaterials and equipment\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n2. Perform\nmanicure and\npedicure\n2.1 Prepare client\n2.2 Clean finger nails and toe\nnails\n2.3 Apply nail polish\n2.4 Perform final retouch\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n3. Perform hand\nspa\n3.1 Prepare clients\n3.2 Apply hand treatment\n3.3 Perform post hand activity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n4. Perform hand\nspa\n\n4.1 Prepare client\n4.2 Massage body\n4.3 Post body massage\ntreatment\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n5. Perform body\nscrub\n\n5.1 Prepare client\n5.2 Scrub body surface\n5.3 Perform final checking and\npolish output\n• Lecture/\ndemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6. Perform facial\ntreatment\n6.1\nPrepare clients\n6.2\nPerform cleaning and actual\ntreatment of face (separate\ncleaning from actual\ntreatment, these can be two\nactivities or elements)\n6.3\nPerform post treatment\nactivity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n7. Perform foot\nspa\n\n7.1\nPrepare clients\n7.2\nApply foot spa\n7.3\nPerform post foot spa activity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n8. Apply facial\nmake-up\n\n8.1\nPrepare client\n8.2\nPerform application of make-\nup\n8.3\nPerform post facial make-up\nactivities\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 63 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 1 -"
