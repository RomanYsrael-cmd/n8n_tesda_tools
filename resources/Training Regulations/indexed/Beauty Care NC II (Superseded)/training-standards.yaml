    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for BEAUTY CARE NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; trainers qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: BEAUTY CARE\n\nNC Level: NC II\n\nNominal Training Duration:\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of beauticians in\naccordance with industry standards. It Covers basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Written\nexamination\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role Playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interview/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks.\n4.2 Control hazards and risks.\n4.3 Maintain occupational health\nand safety awareness.\n• Group\ndiscussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 61 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 57 -\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n1.1\nMaintain a professional image\n1.2\nBuild credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n2. Manage own\nperformance\n2.1\nPlan completion of own\nworkload\n2.2\nMaintain quality of own\nperformance\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Apply quality\nstandards\n3.1\nAssess clients service needs\n3.2\nAssess own work\n3.3\nEngage in quality improvement\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Maintain a safe,\nclean and\nefficient work\nenvironment\n4.1\nComply with health regulations\n4.2\nPrepare and maintain work\narea\n4.3\nCheck and maintain tools and\nequipment\n4.4\nCheck and maintain stocks\n4.5\nProvide a relaxed and caring\nenvironment\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 62 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 58 -\nCORE COMPETENCIES\n(1,060 Hours (6 months))\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre\nand post\nbeauty care\nservices\n1.1 Prepare tools and equipment\n1.2 Prepare clients\n1.3 Store tools, supplies,\nmaterials and equipment\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n2. Perform\nmanicure and\npedicure\n2.1 Prepare client\n2.2 Clean finger nails and toe\nnails\n2.3 Apply nail polish\n2.4 Perform final retouch\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n3. Perform hand\nspa\n3.1 Prepare clients\n3.2 Apply hand treatment\n3.3 Perform post hand activity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n4. Perform hand\nspa\n\n4.1 Prepare client\n4.2 Massage body\n4.3 Post body massage\ntreatment\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n5. Perform body\nscrub\n\n5.1 Prepare client\n5.2 Scrub body surface\n5.3 Perform final checking and\npolish output\n• Lecture/\ndemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6. Perform facial\ntreatment\n6.1\nPrepare clients\n6.2\nPerform cleaning and actual\ntreatment of face (separate\ncleaning from actual\ntreatment, these can be two\nactivities or elements)\n6.3\nPerform post treatment\nactivity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n7. Perform foot\nspa\n\n7.1\nPrepare clients\n7.2\nApply foot spa\n7.3\nPerform post foot spa activity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n8. Apply facial\nmake-up\n\n8.1\nPrepare client\n8.2\nPerform application of make-\nup\n8.3\nPerform post facial make-up\nactivities\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 63 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 1 -\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n\n• Project-based instruction is an authentic instructional model strategy in which students\nplan, implement and evaluate projects that have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n•\nMUST be able to communicate effectively both orally and in written form\n•\nMUST be physically, emotionally, psychologically and mentally fit\n•\nMUST be able to perform basic mathematical computation\n\n--- PDF PAGE 64 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 2 -\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a minimum of 25\ntrainees for Beauty Care NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\nBRUSH\n1 unit\nInfrared\n1 btl.\nShampoo, gal\n3 pcs.\nHair brush\n1 unit\nSteamer\n1 btl.\nConditioner, 1 gal\n3 pcs.\nbarber brush\n1 unit\nIron Plate\n1 doz\nBath Towel\n3 pcs.\nSkeleton brush\n1 unit\nHair Dryer\n1 doz\nFace Towel\n3 pcs.\nRoller brush\n1 unit\nBlower\n1 doz\nHand Towel\n3 pcs.\nPaddle brush\n1 unit\nHand blower\n1 roll\nPaper towel\n3 pcs.\nApplicator brush\n2 units\nTimer\n2 sets\nNeck band, ½ doz\n3 pcs.\nTinting brush\n1 unit\nCrimpers\n3 pcs.\nHead band\n\n1 unit\nCurling Iron\n3 pcs.\nFlannel headband\nMIRROR\n3 units\nElectric Curlers\n(optional)\n3 btl.\nGauze mask\n5 pcs.\nHand mirror\n1 unit\nFoot spa machine\n1 btl.\nMousse\n10\npcs.\nFront mirror\n1 unit\nFacial machine (5 in\n1)\n1 btl.\nGel, 500 ml.\n\n1 unit\nHand Spa Machine\n1 btl.\nSpray net, 500 ml.\nCOMB\n 1 unit\nHeating cap\n1 btl.\nHair polish\n3 pcs.\nWide toothed comb\n 1 unit\nFacial Steamer\n1 roll\nAluminum foil\n3 pcs.\nBath comb\n 1 unit\nHot cabinet\n1 box\nTissue paper\n3 pcs.\nTail comb\n 1 unit\nMagnifying glass\n(2 in 1)\n1 doz\nTissue roll\n3 pcs.\nLarge tooth comb\n 1 unit\nSterilizer\n1 btl.\nTalcum powder, 500\ngrams\n3 pcs.\nAll purpose comb\n\n1 btl.\nCotton, 500 grams\n3 pcs.\nHaircutting comb\n\n1 roll\nCling Wrap\n3 pcs.\nTeasing comb\n\n1 box\nEnd paper\n3 pcs.\nFork comb\n\n3 sets.\nEar pads\n\n1 box\nRubber band\nGLOVES\n\n1 btl.\nPerm lotion w/ neutralizer,\n500 ml.\n3 pcs.\nRubber gloves\n\n1 set\nDeveloper, 6% 20\nvolumes; 9% 30 volumes;\n12% 40 volumes, 500 ml.\neach\n1 box\nDisposable gloves, box\n\n1 btl.\nHair wax, 500 ml.\nCAP\n\n3 pcs.\nNeck strip (cloth)\n3 pcs.\nShower cap\n\n1 set\nColor product form\nCream, Liquid & Powder\n3 pcs.\nPerming cap\n\n3 pcs.\nFrosting Cap w/ Hook\n\n3 pcs.\nPlastic applicator\nCLIPS\n\n3 btls.\nPress spray plastic\ndispenser bottle\n12\npcs.\nHair clips, 1 doz.\nSingle prong clip\n(optional)\n\n1 pc.\nWig\nDouble prong clip\n(optional)\n\n1 pc.\nHairpiece\nPIN\n\n1\nHairpin, box\n\n60\npcs.\nRoller pin, pcs., 5 doz\n\n60\nPin curl clips, 5 doz.\n\n--- PDF PAGE 65 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 3 -\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\npcs.\n1 box\nInvisible pins\n\n6 pcs.\nClamps\n\n6 pcs.\nDuck bill clamp\n\nROLLERS\n\n5 doz\nCylinder shaped rollers\n(long and short) doz.\n\n5 doz\nMedium size rollers,\ndoz.\n\n5 doz\nLarge size rollers, doz.\n\n5 doz\nJumbo rollers, doz.\n\n5 doz\nSmall size hair rollers\nwire, doz.\n\n1 pc.\nMeasuring glass\n\n6 pcs.\nInvisible hairnet\n\n3\nSmock gown\n\nTraining Materials:\n3\nApron\n\nCATALOG\n5\nCape\n\n1\nMen’s Cut Catalog\n3\nPlastic cape\n\n1\nLadies Cut Catalog\n3\nMixing bowls\n\n1\nKid’s Cut Catalog\nPlastic scoop\n.\n\nMagazines\n2\nDrip pan\n\nTextbooks\n\nSCISSORS\n\n1 pc.\nThinning scissor\n\n1 pc.\nCutting scissor\n\n.\n\n.\n\n0.\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\n\nStudent/Trainee Working Space\n\n1 x 1 m.\n\n1 sq. m.\n\n25 sq. m\n\nLecture/Demo Room\n\n8 x 5 m.\n\n40 sq. m.\n\n40 sq. m.\n\nLearning Resource Center\n\n3 x 5 m.\n\n15 sq. m.\n\n15 sq. m.\n\nFacilities/Equipment/ Circulation\nArea\n\n6 x 4 m.\n\n24 sq. m.\n\n24 sq. m.\nTotal :\n104 sq. m.\n\n--- PDF PAGE 66 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 4 -\n3.6 TRAINER’S QUALIFICATIONS FOR BEAUTY CARE NC II\n\nBEAUTY CARE – NC II\n\nTRAINER QUALIFICATION (TQ II)\n\n•\nMUST have completed Trainer’s Training Methodology Course (TTMC) or its\nequivalent\n•\nMUST be able to communicate effectively both orally and in written form\n•\nMUST be physically, emotionally, psychologically and mentally fit\n•\nMUST have at least two (2) years experience in the industry\n•\nMUST possess good moral character\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 67 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 5 -"
