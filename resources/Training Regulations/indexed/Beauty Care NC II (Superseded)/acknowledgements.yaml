      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Attained job targets within key result areas (KRAs). 1.2 Maintained intra and interpersonal relationship in the course of managing oneself based on performance evaluation. 1.3 Completed trainings and career opportunities which are based on the requirements of the industries. 1.4 Acquired and maintained licenses and/or certifications according to the requirement of the qualification. 2. Underpinning knowledge and attitudes 2.1 Work values and ethics (code of conduct, code of ethics, etc.) 2.2 Company policies 2.3 Company operations, procedures and standards 2.4 Fundamental rights at work including gender sensitivity 2.5 Personal hygiene practices 3. Underpinning skills 3.1 Appropriate practice of personal hygiene 3.2 Intra and Interpersonal skills 3.3 Communication skills 4. Resource implications The following resources MUST be provided: 4.1 Workplace or assessment location 4.2 Case studies/scenarios 5. Method of assessment Competency may be assessed through: 5.1 Portfolio Assessment 5.2 Interview 5.3 Simulation/Role-plays 5.4 Observation 5.5 Third Party Reports 5.6 Exams and Tests 6. Context of assessment 6.1 Competency may be assessed in the work place or in a simulated work place setting"
