      "source_text": "30 - UNIT OF COMPETENCY : PERFORM MANICURE AND PEDICURE UNIT CODE : HCS515302 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in performing manicure and pedicure. This involves preparing the client, cleaning of finger nails and toe nails, applying nail polish, and apply final retouch."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Prepare clients"
    },
    {
      "source_text": "1.1 Client is consulted on desired nail service activity and specific requirements. 1.2 Clients’ hand nail structure and condition are checked and analyzed. 1.3 Client is provided with protective materials for hygiene purposes. 1.4 Nail disorder is recognized and if necessary, referred to appropriate personnel. 1.5 Appropriate sanitized tools and equipment, supplies and materials are selected and prepared according to salon procedures. 1.6 Clients’ safety and comfort is ensured during the entire process. 2. Clean the finger nails and toe nails 2.1 Nail polish is completely removed with nail polish remover. 2.2 Fingernails are soaked in warm water with soap following salon standards. 2.3 Cuticles and dry skins are slightly pushed and completely removed using appropriate tools observing safety precautions. 2.4 Nails are trimmed and filed following customer’s desired shape and style. 2.5 Antiseptic is applied immediately upon accidental cut is incurred. 3. Apply nail polish 3.1 Hands and foot fingernails are massaged following different massage movements according to salon procedure. 3.2 Base coat is applied with long strokes starting with the little finger. 3.3 Color of the nail polish is selected and agreed according to customer desire or requirements. 3.4 Polish is applied from the base to the edge of the nail using light sweeping stroked around the cuticle. 3.5 Top or seal coat is applied with long strokes in the same manner as the base coat. 4. Perform final retouch 4.1 Outcome is checked and analyzed against agreed nail service result. 4.2 Excess polish is removed around the cuticle and nail using appropriate tools. 4.3 Quick drying agent is applied on each polished nail according to salon standard. 4.4 Client is advised on nail maintenance practices."
    },
