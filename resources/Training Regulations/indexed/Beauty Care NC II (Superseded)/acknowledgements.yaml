UTY CARE NC II, MUST acquire\nCertificates of Competency in all of the following individual core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment center.\n\n4.2.1 Perform pre and post beauty care activities\n4.2.2 Perform manicure and pedicure\n4.2.3 Perform hand spa\n4.2.4 Perform body massage\n4.2.5 Perform body scrub\n4.2.6 Perform facial treatment\n4.2.7 Perform foot spa\n4.2.8 Apply facial make-up\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of competency\ncomprising a qualification, an individual shall be issued the corresponding National\nCertificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units shall\nbe integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures\nManual on Assessment and Certification” and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS)”.\n\n--- PDF PAGE 68 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 6 -\nANNEX A\nCOMPETENCY MAP\nBEAUTY CARE NC II\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nPerform pre and\npost beauty care\nservices\nPerform\nmanicure and\npedicure\nPerform body scrub\nPerform facial\ntreatment\nMaintain an\neffective\nrelationship with\nclients/customers\nManage own\nperformance\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nApply quality\nstandards\nMaintain a safe,\nclean and efficient\nenvironment\nPerform hand\nspa\nPerform foot\nspa\nPractice career\nprofessionalism\nPractice occupa-\ntional health and\nsafety procedure\nPerform body\nmassage\nPerform facial\n