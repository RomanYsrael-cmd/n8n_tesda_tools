cial skin tone and condition.\n1.2\nUsed protective clothing and gadget.\n1.3\nObserved personal hygiene sanitation practices during the\nentire process.\n1.4\nUsed appropriate types and amount of treatment products.\n1.5\nPerformed cleaning and massage following standard\ntechniques and procedures.\n1.6\nApplied listening and questioning skills ensuring the safety\nand comfort of clients.\n1.7\nChecked set, use and sanitize tools and equipment supplies\nand materials according to OHSC requirements.\n1.8\nChecked final outcome and advises client on post treatment\nprecautions and use of appropriate facial maintenance\nproducts.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFacial Skin Type and Condition\n2.2\nCode of Ethics\n2.3\nTreatment Products (Types)\n2.4\nCorrect Massage Techniques\n2.5\nMachine Equipment Procedure\n2.6\nProtective Clothing and Gadget\n2.7\nD.O.H. Rules and Regulations\n2.8\nSalon Policies and Procedures\n2.9\nTime Management\n3. Underpinning skills\n3.1\nHandling Tools and Equipment\n3.2\nOperating Equipment\n3.3\nApplying Massage Techniques\n3.4\nApplying Customer Relations\n3.5\nApplying Treatment Product\n3.6\nProper disposing of waste\n3.7\nCommunicating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nTreatment Products\n4.3\nTools and Equipment\n4.4\nActual workstation or simulated workplace with complete\nfacilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 53 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 49 -\nUNIT OF COMPETENCY :\nPERFORM FOOT SPA\nUNIT CODE\n:\nHCS515307\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in performing foot\nspa. It involves the preparation of the clients, application of foot spa\nproducts and performing post foot spa activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nFoot condition is checked and analyzed.\n1.2\nClient safety and comfort is ensured during the entire process.\n1.3\nTools, equipment, supplies and materials are prepared and\nused according to salon procedures.\n1.4\nPersonal protective clothing and gadget are worn before the\nstart of the procedure.\n1.5\nWater temperature is checked against client heat tolerance.\n2. Apply foot spa\n2.1\nFoot is thoroughly scrubbed using appropriate tools following\nsafety procedures.\n2.2\nFoot is applied with treatment product before and after\nsoaking in foot spa machine.\n2.3\nTreatment is performed within the required salon time frame.\n2.4\nFoot is massage following basic foot massage motion\nmovement.\n2.5\nFoot is cleaned thoroughly by soaking in liquid soap and\nlukewarm water for 10-15 minutes.\n3. Perform post foot spa\nactivity\n3.1\nTools, equipment, supplies and materials are disinfected and\nstored according to OHSC requirements.\n3.2\nOutcome of treatment is assessed against clients’\nrequirements and recorded following salon procedure.\n3.3\nAfter care advice and homecare products are recommended\naccording to clients needs.\n3.4\nWorkstation is sanitized and prepared for the succeeding\nsalon activities.\n3.5\nWastes are disposed according to OHSC requirements.\n\n--- PDF PAGE 54 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 50 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Condition of the Foot\n1.1\nNormal\n1.2\nDry\n1.3\nWith abrasions or cuts\n1.4\nWith fungal infection or wounds\n1.5\nWith open wound\n2. Tools and Equipment\n2.1\nFoot Spa Machine\n2.2\nFoot File\n2.3\nFoot Stool\n2.4\nPumice Stone\n2.5\nGloves\n2.6\nMetal File\n2.7\nBrush\n2.8\nSmall Basin\n2.9\nFoot Towel\n2.10 Mixing Bowl\n2.11 Callous Scraper\n3. Supplies and\nmaterials\n3.1\nFoot Toner\n3.2\nWhitening Powder\n3.3\nMoisturizing Lotion\n3.4\nMedicated Liquid Soap\n3.5\nAntiseptics\n3.6\nLiquid Soap\n3.7\nFoot Lotion\n3.8\nFoot Scrub Lotion\n3.9\nOil\n3.10 Warm Water\n4. Basic Foot Massage\nMovement\n4.1\nSliding\n4.2\nCircular Motion\n4.3\nPressing\n4.4\nStretching of Finger Toes\n5. Home Care Products\n5.1\nFoot Powder\n5.2\nFoot Spray\n5.3\nFoot Lotion\n5.4\nPetroleum Jelly\n\n--- PDF PAGE 55 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 51 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nApplied salon policies and procedures in performing foot\ntreatment.\n1.2\nApplied of safety rules and regulations during the entire\nprocess.\n1.3\nAnalyzed varied condition of the foot.\n1.4\nChecked, handled and stored appropriate tools, equipment,\nsupplies, materials according to OHSC requirements.\n1.5\nApplied basic foot massage following different prescribed\nmovements.\n1.6\nApplied treatment product as per clients needs following\nmanufacturers instructions and safety practices.\n1.7\nDisplayed the ability to use effective questioning and listening\nskills in consulting and negotiating with clients.\n1.8\nUsed personal protective clothing and gadgets in performing\nthe activity.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFoot Condition\n2.2\nCode of Ethics\n2.3\nOHSC and D.O.H. Rules and Regulations\n2.4\nBasic Foot Massage Procedure\n2.5\nSalon Policies and Procedures\n2.6\nBasic Product Knowledge\n2.7\nTime Management\n3. Underpinning skills\n3.1\nApplying basic massage\n3.2\nApplying proper massage procedure\n3.3\nHandling of tools\n3.4\nHandling client\n3.5\nManaging time\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant Supplies and Materials\n4.2\nLive Model\n4.3\nSimulated or Actual Workplace\n4.4\nTools and Equipment used in the treatment\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2\nDirect Observation with Questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 56 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 52 -\nUNIT OF COMPETENCY :\nAPPLY FACIAL MAKE-UP\nUNIT CODE\n:\nHCS515314\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in applying\nfacial make-up. It also involves the preparation of the client,\napplication of make-up and the performance of post-facial make-\nup activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is consulted on specific make-up requirements.\n1.2\nClients’ shapes of face and skin type / tones are analyzed.\n1.3\nClient is seated in a comfortable position during the entire\nprocess.\n1.4\nProtective clothing is provided to the client.\n1.5\nClient is advised to remove all personal accessories.\n2. Perform application\nof make-up\n2.1\nHand is sanitized before actual application of make-up.\n2.2\nMake-up tools, supplies and materials are selected\naccording to client make – up requirement.\n2.3\nThe eyebrow is defined using appropriate tools.\n2.4\nClients face is thoroughly cleaned using appropriate\ncleansing products.\n2.5\nConcealer and foundation are applied to cover dark spots of\nthe face according to clients’ skintone.\n2.6\nAppropriate make-up products and accessories are\nselected and applied in standard sequence/procedure in\naccordance with OHSC regulations.\n3. Perform post facial\nmake-up activities\n3.1\nMake-up result is checked before application of final touch.\n3.2\nMake-up products tools and materials are stored according to\nsafety and sanitation rules and regulations.\n3.3\nClient is advised on appropriate product and procedure to\napply retouch.\n3.4\nWorkstation is cleared and prepared for next customer.\n\n--- PDF PAGE 57 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 53 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Make-up\nRequirements\n1.1\nDay Make-Up\n1.2\nEvening Make-Up\n1.3\nPhotographic\n1.4\nBridal\n1.5\nStage\n1.6\nFantasy\n1.7\nDebutant Make–Up\n1.8\nCinematic and Television Make–Up\n2. Shape of Face\n2.1\nRectangle or Elongated\n2.2\nInverted\n2.3\nHeart\n2.4\nOval\n2.5\nTriangular\n2.6\nSquare\n2.7\nDiamond\n2.8\nRound\n3. Skin Type\n3.1\nDry\n3.2\nNormal\n3.3\nOily\n4. Skintone\n4.1\nDark\n4.2\nFair\n4.3\nLight\n5. Protective clothing\nmay include\n5.1\nBath Towel\n5.2\nHeadband\n5.3\nSmock Gown\n5.4\nFace Towel or Towellette\n6. Foundation Eye Liner 6.1\nLiquid 6.3 Cake Eye Liner\n6.2\nPencil 6.4 Gel Eye Liner\n7. Eyebrow may be\ndefined through\n7.1\nPlucking\n7.2\nThreading\n7.3\nShaving\n8. Make-up Tools\n8.1\nSponge\n8.1.1 Natural\n8.1.2 Sea Sponge\n8.1.3 Soft for Cake\n8.1.4 Finger Tips\n8.2\nSharpener\n8.3\nCotton Buds\n8.4\nEyelash Curler\n8.5\nPowder Applicator\n8.6\nFlat brush\n8.6.1 Lip Brush\n8.6.2 Eye Liner Brush\n8.6.3 Eye Shadow Brush\n8.6.4 Large Eyebrow Brush\n8.6.5 Small Eyebrow Brush\n8.6.6 Large Blusher Brush\n8.6.7 Powder Brush\n8.6.8 Brow with Comb Brush\n8.6.9 Body Brush\n\n--- PDF PAGE 58 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 54 -\nVARIABLE\nRANGE\n\n8.7\nEye Brow Scissor\n8.8\nCurl Lash\n8.9\nFun Brush\n8.10 Eye Brow Blade\n8.11 Tweezer\n9. Cleansing Products\n9.1\nCream Form\n9.2\nLiquid Form\n10. Make-up Product\n10.0 Concealer\n10.1 Cake of Liquid Foundation\n10.2 Blusher\n10.3 Eyeshadow\n10.4 Eye Liner\n10.5 Eye Brow Pencil\n10.6 Lip Pencil\n10.7 Lip Stick\n10.8 Mascara\n10.9 Face Powder\n11. Face Powder\n11.1 Pressed Powder\n11.2 Loose Powder\n12. Accessories\n12.1 Glitter Gel\n12.2 Eye Gel\n12.3 Stoned Glitter\n12.4 Powder Glitter\n12.5 Lasher Glue (Artificial)\n13. Personal\nAccessories\n13.1 Earrings\n13.2 Necklace\n13.3 Any pierced items in the face\n\n--- PDF PAGE 59 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 55 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted clients’ make-up requirements.\n1.2\nPerformed analysis of clients face, skintone and types.\n1.3\nUsed appropriate make-up tools and materials and\naccessories.\n1.4\nSelected and applied appropriate make-up products.\n1.5\nPerformed checking and apply final touch on client.\n1.6\nPerformed safe and sanitary procedures in handling customer.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCode of Ethics\n2.2\nMake-Up Procedure\n2.3\nFacial Skin and Type Analysis\n2.4\nMake-Up Product Knowledge\n2.5\nMake–Up Technique\n3. Underpinning skills\n3.1\nHandling Client\n3.2\nHandling tools and materials\n3.3\nApplying make-up\n3.4\nBlending of color\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nMake-Up Tools and Materials\n4.3\nMake-Up Products\n4.4\nActual work facilities or simulated work place\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 60 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 56 -\nSECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for BEAUTY CARE NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; trainers qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: BEAUTY CARE\n\nNC Level: NC II\n\nNominal Training Duration:\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of beauticians in\naccordance with industry standards. It Covers basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n(20 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Written\nexamination\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role Playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interview/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks.\n4.2 Control hazards and risks.\n4.3 Maintain occupational health\nand safety awareness.\n• Group\ndiscussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 61 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 57 -\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n1.1\nMaintain a professional image\n1.2\nBuild credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n2. Manage own\nperformance\n2.1\nPlan completion of own\nworkload\n2.2\nMaintain quality of own\nperformance\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Apply quality\nstandards\n3.1\nAssess clients service needs\n3.2\nAssess own work\n3.3\nEngage in quality improvement\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Maintain a safe,\nclean and\nefficient work\nenvironment\n4.1\nComply with health regulations\n4.2\nPrepare and maintain work\narea\n4.3\nCheck and maintain tools and\nequipment\n4.4\nCheck and maintain stocks\n4.5\nProvide a relaxed and caring\nenvironment\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 62 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 58 -\nCORE COMPETENCIES\n(1,060 Hours (6 months))\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre\nand post\nbeauty care\nservices\n1.1 Prepare tools and equipment\n1.2 Prepare clients\n1.3 Store tools, supplies,\nmaterials and equipment\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n2. Perform\nmanicure and\npedicure\n2.1 Prepare client\n2.2 Clean finger nails and toe\nnails\n2.3 Apply nail polish\n2.4 Perform final retouch\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n3. Perform hand\nspa\n3.1 Prepare clients\n3.2 Apply hand treatment\n3.3 Perform post hand activity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n4. Perform hand\nspa\n\n4.1 Prepare client\n4.2 Massage body\n4.3 Post body massage\ntreatment\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n5. Perform body\nscrub\n\n5.1 Prepare client\n5.2 Scrub body surface\n5.3 Perform final checking and\npolish output\n• Lecture/\ndemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6. Perform facial\ntreatment\n6.1\nPrepare clients\n6.2\nPerform cleaning and actual\ntreatment of face (separate\ncleaning from actual\ntreatment, these can be two\nactivities or elements)\n6.3\nPerform post treatment\nactivity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n7. Perform foot\nspa\n\n7.1\nPrepare clients\n7.2\nApply foot spa\n7.3\nPerform post foot spa activity\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n8. Apply facial\nmake-up\n\n8.1\nPrepare client\n8.2\nPerform application of make-\nup\n8.3\nPerform post facial make-up\nactivities\n• Lecture/\ndemonstration\n• OJT\n• Written\nexamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 63 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 1 -\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n\n• Project-based instruction is an authentic instructional model strategy in which students\nplan, implement and evaluate projects that have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n•\nMUST be able to communicate effectively both orally and in written form\n•\nMUST be physically, emotionally, psychologically and mentally fit\n•\nMUST be able to perform basic mathematical computation\n\n--- PDF PAGE 64 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 2 -\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a minimum of 25\ntrainees for Beauty Care NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\nBRUSH\n1 unit\nInfrared\n1 btl.\nShampoo, gal\n3 pcs.\nHair brush\n1 unit\nSteamer\n1 btl.\nConditioner, 1 gal\n3 pcs.\nbarber brush\n1 unit\nIron Plate\n1 doz\nBath Towel\n3 pcs.\nSkeleton brush\n1 unit\nHair Dryer\n1 doz\nFace Towel\n3 pcs.\nRoller brush\n1 unit\nBlower\n1 doz\nHand Towel\n3 pcs.\nPaddle brush\n1 unit\nHand blower\n1 roll\nPaper towel\n3 pcs.\nApplicator brush\n2 units\nTimer\n2 sets\nNeck band, ½ doz\n3 pcs.\nTinting brush\n1 unit\nCrimpers\n3 pcs.\nHead band\