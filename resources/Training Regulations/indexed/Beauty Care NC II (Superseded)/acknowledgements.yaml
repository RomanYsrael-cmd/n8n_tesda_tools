    {
      "source_text": "5 - SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 To attain the National Qualification of BEAUTY CARE NC II, the candidate MUST demonstrate competence in all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 Individuals aspiring to be awarded the qualification of BEAUTY CARE NC II, MUST acquire Certificates of Competency in all of the following individual core units of the Qualification. Candidates may apply for assessment in any accredited assessment center."
    },
    {
      "source_text": "4.2.1 Perform pre and post beauty care activities 4.2.2 Perform manicure and pedicure 4.2.3 Perform hand spa 4.2.4 Perform body massage 4.2.5 Perform body scrub 4.2.6 Perform facial treatment 4.2.7 Perform foot spa 4.2.8 Apply facial make-up"
    },
    {
      "source_text": "4.3 Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate."
    },
    {
      "source_text": "4.4 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.5 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.5.1 Graduates of formal, non-formal and informal including enterprise-based training programs 4.5.2 Experienced workers (wage employed or self employed)"
    },
    {
      "source_text": "4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”."
