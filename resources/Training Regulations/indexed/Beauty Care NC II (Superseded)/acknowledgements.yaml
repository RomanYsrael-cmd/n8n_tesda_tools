    {
      "source_text": "4 - EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Prepared written communication following standard format of the organization. 1.2 Accessed information using communication equipment. 1.3 Made use of relevant terms as an aid to transfer information effectively. 1.4 Conveyed information effectively adopting the formal or informal communication. 2. Underpinning knowledge and attitudes 2.1 Effective communication 2.2 Different modes of communication 2.3 Written communication 2.4 Organizational policies 2.5 Communication procedures and systems 2.6 Technology relevant to the enterprise and the individual’s work responsibilities 3. Underpinning skills 3.1 Follow simple spoken language 3.2 Perform routine workplace duties following simple written notices 3.3 Participate in workplace meetings and discussions 3.4 Complete work related documents 3.5 Estimate, calculate and record routine workplace measures 3.6 Basic mathematical processes of addition, subtraction, division and multiplication 3.7 Ability to relate to people of social range in the workplace 3.8 Gather and provide information in response to workplace Requirements 4. Resource implications The following resources MUST be provided: 4.1 Fax machine 4.2 Telephone 4.3 Writing materials 4.4 Internet 5. Method of assessment Competency MUST be assessed through: 5.1 Direct Observation 5.2 Oral interview and written test 6. Context of assessment 6.1 Competency may be assessed individually in the actual workplace or through accredited institution"
