      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Operated in a team to complete workplace activity. 1.2 Worked effectively with others. 1.3 Conveyed information in written or oral form. 1.4 Selected and used appropriate workplace language. 1.5 Followed designated work plan for the job. 1.6 Reported outcomes. 2. Underpinning knowledge and attitudes 2.1 Communication process 2.2 Team structure 2.3 Team roles 2.4 Group planning and decision making 3. Underpinning skills 3.1 Communicate appropriately, consistent with the culture of the workplace 4. Resource implications The following resources MUST be provided: 4.1 Access to relevant workplace or appropriately simulated environment where assessment can take place 4.2 Materials relevant to the proposed activity or tasks 5. Method of assessment Competency may be assessed through: 5.1 Observation of the individual member in relation to the work activities of the group 5.2 Observation of simulation and or role play involving the participation of individual member to the attainment of organizational goal 5.3. Case studies and scenarios as a basis for discussion of issues and strategies in teamwork 6. Context of assessment 6.1 Competency may be assessed in workplace or in a simulated workplace setting. 6.2 Assessment shall be observed while task are being undertaken whether individually or in group."
