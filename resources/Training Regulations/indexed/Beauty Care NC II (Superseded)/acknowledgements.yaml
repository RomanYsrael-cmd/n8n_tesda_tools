      "source_text": "45 - UNIT OF COMPETENCY : PERFORM FACIAL TREATMENT UNIT CODE : HCS515306 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in performing facial treatment. It also covers the competency in assessing the clients; perform actual facial cleansing and treatment of the face and post treatment activity."
