RIPTOR\n:\nThis unit covers the knowledge, skills and attitude in performing\npre and post beauty care services. These include in the preparing\nof tools and equipment, preparing the client and performing of\ncorrect storing of tools and equipment and proper disposing of\nwastage from the beauty care service.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare tools and\nequipment\n1.1\nNecessary tools and equipment are selected, checked and\nprepared for the specific treatment activity.\n1.2\nAppropriate supplies and materials are prepared according to\nsalon policies and procedures.\n1.3\nTreatment products are prepared following salon safety\npolicies and procedures.\n1.4\nWork station / cubicle is thoroughly checked and sanitized.\n2. Prepare the client\n2.1\nClients’ special personal needs are attended according to\nsalon policies and procedures.\n2.2\nAppropriate protective clothing materials are provided to\nthe client according to OHSC requirements.\n2.3\nClients’ safety and comfort is ensured during the entire\nprocess.\n2.4\nClient is provided with salon amenities following salon\nprocedures.\n2.5\nIf required by client, other beauty care options are offered\nand advised to the client.\n3. Perform storing of\ntools and equipment\nand disposing of\nwastage\n3.1\nTools and equipment used are stored according to salon\nsafety policies and procedures.\n3.2\nUsed treatment products and other chemicals are stored\nfollowing safety and environmental codes and regulations.\n3.3\nWorkstation is checked, cleaned and sanitized and prepared\nfor succeeding treatment.\n3.4\nSupplies and materials used are cleaned and stored\naccording to salon policies and procedures.\n3.5\nWaste materials are segregated, and disposed following\nD.O.H. and local rules and regulations.\n\n--- PDF PAGE 32 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 28 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clients\n1.1\nChild\n1.2\nMen\n