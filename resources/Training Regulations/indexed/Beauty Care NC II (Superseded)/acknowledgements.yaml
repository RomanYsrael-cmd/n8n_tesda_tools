    },
    {
      "source_text": "UNIT CODE : HCS515204"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed to apply quality standards in the workplace. The unit also includes the application of relevant safety procedures and regulations, salon/organizational procedures and other client requirements."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Assess clients service needs"
    },
    {
      "source_text": "1.1 Work instruction is obtained and work is carried out in accordance with standard operating procedures. 1.2 Clients needs are checked against workplace standards and specifications. 1.3 Faults on clients and any identified causes are recorded and/or reported to the supervisor concerned in accordance with workplace procedures. 1.4 Clients profile and service extended to them are documented in accordance with workplace procedures. 2. Assess own work 2.1 Documentation relative to quality within the company is identified and used. 2.2 Completed work is checked against workplace standards relevant to the task undertaken. 2.3 Errors are identified and improved on. 2.4 Information on the quality and other indicators of individual performance is recorded in accordance with workplace procedures. 2.5 In cases of deviations from specific quality standards, causes are documented and reported in accordance with the workplace’ standard operating procedures. 3. Engage in quality improvement 3.1 Process improvement procedures are participated in relative to workplace assignment. 3.2 Work is carried out in accordance with process improvement procedures. 3.3 Performance of operation or quality of product of service to ensure other client satisfaction is monitored."
    },
