      "source_text": "1 - TRAINING REGULATIONS FOR BEAUTY CARE NC II"
    },
    {
      "source_text": "SECTION 1 BEAUTY CARE NC II QUALIFICATION"
    },
    {
      "source_text": "The BEAUTY CARE NC II Qualification consists of competencies that a person must achieve to perform pre and post beauty care services, perform manicure and pedicure, perform hand spa, perform body massage, perform body scrub, perform facial treatment, perform foot spa and apply facial make-up."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "UNIT CODE BASIC COMPETENCIES 500311105 Participate in workplace communication 500311106 Work in team environment 500311107 Practice career professionalism 500311108 Practice occupational health and safety procedures"
    },
    {
      "source_text": "UNIT CODE COMMON COMPETENCIES HCS515201 Maintain an effective relationship with clients/customers HCS515202 Manage own performance HCS515204 Apply quality standards HCS515205 Maintain a safe, clean and efficient environment"
    },
    {
      "source_text": "UNIT CODE CORE COMPETENCIES HCS515301 Perform pre and post beauty care services HCS515302 Perform manicure and pedicure HCS515303 Perform hand spa HCS515304 Perform body massage HCS515305 Perform body scrub HCS515306 Perform facial treatment HCS515307 Perform foot spa HCS515314 Apply facial make-up"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be:"
    },
    {
      "source_text": "❑ Junior Beautician"
    },
    {
      "source_text": "-- PDF PAGE 6 --- TR Beauty Care NC II Promulgated August 2005"
