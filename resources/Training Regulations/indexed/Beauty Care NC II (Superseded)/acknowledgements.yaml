      "source_text": "VARIABLE RANGE 1. Role and objective of team 1.1 Work activities in a team environment with enterprise or specific sector 1.2 Limited discretion, initiative and judgment may be demonstrated on the job, either individually or in a team environment 2. Sources of information 2.1 Standard operating and/or other workplace procedures 2.2 Job procedures 2.3 Machine/equipment manufacturer’s specifications and instructions 2.4 Organizational or external personnel 2.5 Client/supplier instructions 2.6 Quality standards 2.7 OHS and environmental standards 3. Workplace context 3.1 Work procedures and practices 3.2 Conditions of work environments 3.3 Legislation and industrial agreements 3.4 Standard work practice including the storage, safe handling and disposal of chemicals 3.5 Safety, environmental, housekeeping and quality guidelines"
    },
