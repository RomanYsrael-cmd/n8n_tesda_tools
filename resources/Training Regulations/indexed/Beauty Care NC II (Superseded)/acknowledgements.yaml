    },
    {
      "source_text": "-- PDF PAGE 63 --- TR Beauty Care NC II Promulgated August 2005"
    },
    {
      "source_text": "1 - 3.2 TRAINING DELIVERY"
    },
    {
      "source_text": "The delivery of training should adhere to the design of the curriculum. Delivery should be guided by the 10 basic principles of competency-based TVET."
    },
    {
      "source_text": "The training is based on curriculum developed from the competency standards;"
    },
    {
      "source_text": "Learning is modular in its structure;"
    },
    {
      "source_text": "Training delivery is individualized and self-paced;"
    },
    {
      "source_text": "Training is based on work that must be performed;"
    },
    {
      "source_text": "Training materials are directly related to the competency standards and the curriculum modules;"
    },
    {
      "source_text": "Assessment is based in the collection of evidence of the performance of work to the industry required standard;"
    },
    {
      "source_text": "Training is based both on and off-the-job components;"
    },
    {
      "source_text": "Allows for recognition of prior learning (RPL) or current competencies;"
    },
    {
      "source_text": "Training allows for multiple entry and exit; and"
    },
    {
      "source_text": "Approved training programs are nationally accredited."
    },
    {
      "source_text": "The competency-based TVET system recognizes various types of delivery modes, both on and off-the-job as long as the learning is driven by the competency standards specified by the industry. The following training modalities may be adopted when designing training programs:"
    },
    {
      "source_text": "The dualized mode of training delivery is preferred and recommended. Thus programs would contain both in-school and in-industry training or fieldwork components. Details can be referred to the Dual Training System (DTS) Implementing Rules and Regulations."
    },
    {
      "source_text": "Modular/self-paced learning is a competency-based training modality wherein the trainee is allowed to progress at his own pace. The trainer just facilitates the training delivery."
    },
    {
      "source_text": "Peer teaching/mentoring is a training modality wherein fast learners are given the opportunity to assist the slow learners."
    },
    {
      "source_text": "Supervised industry training or on-the-job training is an approach in training designed to enhance the knowledge and skills of the trainee through actual experience in the workplace to acquire specific competencies prescribed in the training regulations."
    },
    {
      "source_text": "Distance learning is a formal education process in which majority of the instruction occurs when the students and instructor are not in the same place. Distance learning may employ correspondence study, audio, video or computer technologies."
    },
    {
      "source_text": "Project-based instruction is an authentic instructional model strategy in which students plan, implement and evaluate projects that have real world applications."
    },
    {
      "source_text": "3.3 TRAINEE ENTRY REQUIREMENTS"
    },
    {
      "source_text": "Trainees or students wishing to gain entry into these qualifications should possess the following requirements:"
    },
    {
      "source_text": "MUST be able to communicate effectively both orally and in written form"
    },
    {
      "source_text": "MUST be physically, emotionally, psychologically and mentally fit"
    },
    {
      "source_text": "MUST be able to perform basic mathematical computation"
    },
    {
      "source_text": "-- PDF PAGE 64 --- TR Beauty Care NC II Promulgated August 2005"
