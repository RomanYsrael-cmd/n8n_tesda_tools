    {
      "source_text": "UNIT CODE : 500311106"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to identify role and responsibility as a member of a team."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Describe team role and scope 1.1. The role and objective of the team is identified from available sources of information. 1.2. Team parameters, reporting relationships and responsibilities are identified from team discussions and appropriate external sources. 2. Identify own role and responsibility within team 2.1. Individual role and responsibilities within the team environment are identified. 2.2. Roles and responsibility of other team members are identified and recognized. 2.3. Reporting relationships within team and external to team are identified. 3. Work as a team member 3.1. Effective and appropriate forms of communications used and interactions undertaken with team members who contribute to known team activities and objectives. 3.2. Effective and appropriate contributions made to complement team activities and objectives, based on individual skills and competencies and workplace context. 3.3. Observed protocols in reporting using standard operating procedures. 3.4. Contribute to the development of team work plans based on an understanding of team’s role and objectives and individual competencies of the members."
    },
