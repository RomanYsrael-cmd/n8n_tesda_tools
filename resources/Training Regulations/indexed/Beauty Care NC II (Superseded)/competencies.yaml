        "source_text": "--- PDF PAGE 46 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 42 - \nUNIT OF COMPETENCY : \nPERFORM BODY SRUB \nUNIT CODE \n: \nHCS515305 \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in performing \nbody scrub. It involves the preparation of the clients, application of \nbody scrub treatment products and performing post body scrubbing \nactivities. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare client \n1.1 \nClients’ skin condition and types are checked and analyzed. \n1.2 \nClient is provided with appropriate clothing material. \n1.3 \nClient is advised to remove personal accessories to achieve \noptimum service results. \n1.4 \nClient is positioned lying upside down. \n1.5 \nWork station is thoroughly checked according to salon policies \nand procedures. \n1.6 \nNecessary tools and equipment are prepared according to \nthe service requirements. \n1.7 \nSkin test is administered to prevent possible contraindications.  \n2.  Scrub body surface \n2.1 \nClient is bathe in lukewarm water before and after scrubbing \nthe body surface using face towel. \n2.2 \nSkin scrub product is applied thoroughly on the body surface \nusing hand in a to and fro motion. \n2.3 \nClients’ safety and comfort is ensured during the entire \nprocess. \n2.4 \nSupplies and materials are prepared and used according to \nOHSC requirement. \n2.5 \nScrubbing is performed with the timeline and procedure \nprescribed by salon or industry. \n3.  Perform final \nchecking and polish \noutput  \n3.1 \nResult is checked according to the clients desired outcome. \n3.2 \nClient is advised with appropriate maintenance progress. \n3.3 \nClient is consulted and prepared for other possible skin \nenhancement/improvement activity. \n3.4 \nUsed supplies and material scrub products are stored and \ndisposed according to OHSC requirements. \n3.5 \nWorkstation is sanitized and prepared for next salon activity.\n\n--- PDF PAGE 47 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 43 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Types and skin \nconditions \n1.1 \nDry \n1.2 \nOily \n1.3 \nNormal \n1.4 \nFine \n1.5 \nRough \n2. Protective clothing \nmaterials \n2.1 \nBath Towel \n2.2 \nBath Robe \n2.3 \nHeadband \n2.4 \nGauge Mask \n2.5 \nSlippers \n3. Personal accessories 3.1 \nWrist Watch \n3.2 \nRing \n3.3 \nBangles and Bracelet \n3.4 \nNecklace \n3.5 \nAnklet \n4. Supplies/materials \n4.1 \nScrubbing Product \n4.2 \nScrubbing Cream \n4.3 \nBody Lotion \n4.4 \nBed Sheet \n4.5 \nLukewarm Water \n4.6 \nWhitening Soap \n5. Tools and equipment \n5.1 \nStool \n5.2 \nFace Towel \n5.3 \nBasin \n5.4 \nScrubbing Gloves \n5.5 \nTimer \n5.6 \nPillow \n6. Timeline procedure \n6.1 \n45 minutes \n6.2 \n1 hour \n7. Scrubbing area \n7.1 \nArms \n7.2 \nLegs \n7.3 \nArmpit \n7.4 \nEntire body\n\n--- PDF PAGE 48 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 44 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nChecked and analyzed the clients skin type condition. \n1.2 \nProvides client with appropriate clothing material. \n1.3 \nBathe client with lukewarm water. \n1.4 \nApplied appropriate skin scrub products on body surface \nfollowing salon policies and procedures. \n1.5 \nEnsured clients safety and comfort during the entire process \nby questioning-listening to them. \n1.6 \nPrepared and used S/M according to OHSC requirements. \n1.7 \nPerformed the scrubbing activity following prescribed salon \npolicies and procedures. \n1.8 \nChecked result and advice client on appropriate maintenance \nprogram. \n1.9 \nConsulted and explained all possible skin improvement \nenhancement of skin. \n2. Underpinning \nknowledge and \nattitudes  \n2.1 \nSkin Type Condition \n2.2 \nCode of Ethics \n2.3 \nTreatment Products \n2.4 \nClothing Material \n2.5 \nD.O.H. Rules and Regulations \n2.6 \nTime Management \n3. Underpinning skills \n3.1 \nApply scrubbing product \n3.2 \nApply client relationship \n3.3 \nApply scrubbing technique \n3.4 \nUse supply and materials \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nLive Model \n4.2 \nSupplies and Materials \n4.3 \nActual workstation or simulated workplace with complete \nfacilities. \n4.4 \nBody skin scrubbing products. \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nDirect observation with questioning \n6. Context of \nassessment \n6.1  Competency may be assessed in the workplace or accredited \nassessment center.\n",
