e processes \n2.7 \nError identification and reporting \n2.8 \nQuality improvement processes \n3. Underpinning skills \n3.1 \nReading skills required to interpret work instructions, product \nmanufacturer’s requirements \n3.2 \nCommunication skills needed to interpret and apply defined \nwork procedures \n3.3 \nCarry out work in accordance with OHS policies and \nprocedures \n3.4 \nCritical thinking \n3.5 \nSolution providing and decision making \n3.6 \nInterpersonal skills or dealing with varied type of clients \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nMaterials \n4.2 \nProduct  \n4.3 \nEquipment \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nObservation with oral questioning \n5.2 \nThird Party Report \n5.3 \nPractical Demonstration \n6. Context of \nassessment \n6.1  Assessment may be conducted in the workplace or in a \nsimulated environment.\n",
