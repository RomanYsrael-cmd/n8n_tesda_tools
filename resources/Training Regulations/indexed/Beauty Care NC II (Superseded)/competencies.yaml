            "title": "Prepare clients",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Client is consulted on desired nail service activity and specific requirements."
              },
              {
                "number": "1.2",
                "text": "Clients’ hand nail structure and condition are checked and analyzed."
              },
              {
                "number": "1.3",
                "text": "Client is provided with protective materials for hygiene purposes."
              },
              {
                "number": "1.4",
                "text": "Nail disorder is recognized and if necessary, referred to appropriate personnel."
              },
              {
                "number": "1.5",
                "text": "Appropriate sanitized tools and equipment, supplies and materials are selected and prepared according to salon procedures."
              },
