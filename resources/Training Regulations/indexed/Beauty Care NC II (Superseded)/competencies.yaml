            "title": "Apply nail polish",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Hands and foot fingernails are massaged following different massage movements according to salon procedure."
              },
              {
                "number": "3.2",
                "text": "Base coat is applied with long strokes starting with the little finger."
              },
              {
                "number": "3.3",
                "text": "Color of the nail polish is selected and agreed according to customer desire or requirements."
              },
              {
                "number": "3.4",
                "text": "Polish is applied from the base to the edge of the nail using light sweeping stroked around the cuticle."
              },
              {
                "number": "3.5",
                "text": "Top or seal coat is applied with long strokes in the same manner as the base coat."
              }
            ],
            "source_number": 3
          },
          {
            "number": 4,
            "title": "Perform final retouch",
            "performance_criteria": [
              {
                "number": "4.1",
                "text": "Outcome is checked and analyzed against agreed nail service result."
              },
              {
                "number": "4.2",
                "text": "Excess polish is removed around the cuticle and nail using appropriate tools."
              },
              {
                "number": "4.3",
                "text": "Quick drying agent is applied on each polished nail according to salon standard."
              },
              {
                "number": "4.4",
                "text": "Client is advised on nail maintenance practices."
              }
            ],
            "source_number": 4
          }
