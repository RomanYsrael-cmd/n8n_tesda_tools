        "source_title": "PRACTICE OCCUPATIONAL HEALTH AND SAFETY PROCEDURES",
        "source_text": "--- PDF PAGE 15 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 11 - \nUNIT OF COMPETENCY : \nPRACTICE OCCUPATIONAL HEALTH AND SAFETY \nPROCEDURES  \n \nUNIT CODE \n: \n500311108 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to comply with regulatory \nand organizational requirements for occupational health and safety.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify hazards and \nrisks \n1.1 \nSafety regulations and workplace safety and hazard control \npractices and procedures are clarified and explained based on \norganization procedures. \n1.2 \nHazards/risks in the workplace and their corresponding \nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with \norganization procedures. \n1.3 \nContingency measures during workplace accidents, fire and \nother emergencies are recognized and established in \naccordance with organization procedure. \n2. Evaluate hazards \nand risks \n2.1 \nTerms of maximum tolerable limits which when exceeded will \nresult in harm or damage are identified based on threshold \nlimit values (TLV). \n2.2 \nEffects of the hazards are determined. \n2.3 \nOHS issues and/or concerns and identified safety hazards are \nreported to designated personnel in accordance with \nworkplace requirements and relevant workplace OHS \nlegislation. \n3. Control hazards and \nrisks  \n3.1 \nOccupational Health and Safety (OHS) procedures for \ncontrolling hazards/risks in workplace are consistently \nfollowed. \n3.2 \nProcedures for dealing with workplace accidents, fire and \nemergencies are followed in accordance with organization \nOHS policies. \n3.3 \nPersonal protective equipment (PPE) is correctly used in \naccordance with organization OHS procedures and practices.  \n3.4 \nAppropriate assistance is provided in the event of a workplace \nemergency in accordance with established organization \nprotocol. \n4. Maintain OHS \nawareness \n4.1 \nEmergency-related drills and trainings are participated in \nas per established organization guidelines and procedures. \n4.2 \nOHS personal records are completed and updated in \naccordance with workplace requirements.\n\n--- PDF PAGE 16 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 12 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Safety regulations \nMay include but are not limited to: \n1.1 \nClean Air Act \n1.2 \nBuilding code \n1.3 \nNational Electrical and Fire Safety Codes \n1.4 \nWaste management statutes and rules \n1.5 \nPhilippine Occupational Safety and Health Standards \n1.6 \nDOLE regulations on safety legal requirements \n1.7 \nECC regulations \n2. Hazards/Risks \nMay include but are not limited to: \n2.1 \nPhysical hazards – impact, illumination, pressure, noise,      \nvibration, temperature, radiation  \n2.2 \nBiological hazards- bacteria, viruses, plants, parasites,     \nmites, molds, fungi, insects \n2.3 \nChemical hazards – dusts, fibers, mists, fumes, smoke, \ngases, vapors \n2.4 \nErgonomics \n• Psychological factors – over exertion/ excessive force, \nawkward/static positions, fatigue, direct pressure, varying \nmetabolic cycles \n• Physiological factors – monotony, personal relationship, \nwork out cycle \n3. Contingency \nmeasures \nMay include but are not limited to: \n3.1 \nEvacuation \n3.2 \nIsolation \n3.3 \nDecontamination \n3.4 \n(Calling designed) emergency personnel \n4. PPE \nMay include but are not limited to: \n4.1 \nMask \n4.2 \nGloves \n4.3 \nGoggles \n4.4 \nHair Net/cap/bonnet \n4.5 \nFace mask/shield \n4.6 \nEar muffs \n4.7 \nApron/Gown/coverall/jump suit \n4.8 \nAnti-static suits \n5. Emergency-related \ndrills and training \n5.1 \nFire drill \n5.2 \nEarthquake drill  \n5.3 \nBasic life support/cardio pulmonary resuscitation (CPR) \n5.4 \nFirst aid \n5.5 \nSpillage control  \n5.6 \nDecontamination of chemical and toxic \n5.7 \nDisaster preparedness/management \n6. OHS personal \nrecords \n6.1 \nMedical/Health records \n6.2 \nIncident reports \n6.3 \nAccident reports \n6.4 \nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 13 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nExplained clearly established workplace safety and hazard \ncontrol practices and procedures. \n1.2 \nIdentified hazards/risks in the workplace and its corresponding \nindicators in accordance with  company  procedures. \n1.3 \nRecognized contingency measures during workplace \naccidents, fire and other emergencies. \n1.4 \nIdentified terms of maximum tolerable limits based on \nthreshold limit value (TLV). \n1.5 \nFollowed Occupational Health and Safety (OHS) procedures \nfor controlling hazards/risks in workplace. \n1.6 \nUsed Personal Protective Equipment (PPE) in accordance \nwith company OHS procedures and practices. \n1.7 \nCompleted and updated OHS personal records in accordance \nwith workplace requirements.   \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nOHS procedures and practices and regulations \n2.2 \nPPE types and uses \n2.3 \nPersonal hygiene practices \n2.4 \nHazards/risks identification and control \n2.5 \nThreshold limit value (TLV) \n2.6 \nOHS indicators  \n2.7 \nOrganization safety and health protocol \n2.8 \nSafety consciousness \n2.9 \nHealth consciousness \n3. Underpinning skills \n3.1 \nPractice of personal hygiene  \n3.2 \nHazards/risks identification and control skills \n3.3 \nInterpersonal skills \n3.4 \nCommunication skills \n2. Resource   \nimplications \nThe following resources MUST be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nOHS personal records \n4.3 \nPPE \n4.4 \nHealth records \n3. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nPortfolio Assessment  \n5.2 \nInterview \n5.3 \nCase Study/Situation \n4. Context of \nassessment \n6.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting.\n",
