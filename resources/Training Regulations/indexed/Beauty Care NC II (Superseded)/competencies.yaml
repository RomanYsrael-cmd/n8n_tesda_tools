        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment required evidence that the candidate:\n1.1\nChecked and analyzed clients’ facial skin tone and condition.\n1.2\nUsed protective clothing and gadget.\n1.3\nObserved personal hygiene sanitation practices during the\nentire process.\n1.4\nUsed appropriate types and amount of treatment products.\n1.5\nPerformed cleaning and massage following standard\ntechniques and procedures.\n1.6\nApplied listening and questioning skills ensuring the safety\nand comfort of clients.\n1.7\nChecked set, use and sanitize tools and equipment supplies\nand materials according to OHSC requirements.\n1.8\nChecked final outcome and advises client on post treatment\nprecautions and use of appropriate facial maintenance\nproducts.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFacial Skin Type and Condition\n2.2\nCode of Ethics\n2.3\nTreatment Products (Types)\n2.4\nCorrect Massage Techniques\n2.5\nMachine Equipment Procedure\n2.6\nProtective Clothing and Gadget\n2.7\nD.O.H. Rules and Regulations\n2.8\nSalon Policies and Procedures\n2.9\nTime Management\n3. Underpinning skills\n3.1\nHandling Tools and Equipment\n3.2\nOperating Equipment\n3.3\nApplying Massage Techniques\n3.4\nApplying Customer Relations\n3.5\nApplying Treatment Product\n3.6\nProper disposing of waste\n3.7\nCommunicating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nTreatment Products\n4.3\nTools and Equipment\n4.4\nActual workstation or simulated workplace with complete\nfacilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 53 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 49 -\nUNIT OF COMPETENCY :\nPERFORM FOOT SPA\nUNIT CODE\n:"
        },
        "source_text": "HCS515306\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in performing\nfacial treatment. It also covers the competency in assessing the\nclients; perform actual facial cleansing and treatment of the face\nand post treatment activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess clients needs\n1.1\nClients’ facial skin condition is checked and analyzed.\n1.2\nClient is advised on appropriate facial treatment option.\n1.3\nProtective clothing and gadget are worn by the client and\nattendant.\n1.4\nHands are thoroughly washed and sanitized before performing\nthe activity.\n1.5\nClient is consulted to confirm health condition per instruction if\nany.\n2. Perform cleaning and\nactual treatment of\nthe face (separate\ncleaning from actual\ntreatment, these can\nbe two activities or\nelements)\n2.1\nTreatment products are prepared and used according to salon\nprocedures and manufacturer’s instruction.\n2.2\nAppropriate cleaning technique and application of cleansing\nproduct is performed following salon policies.\n2.3\nClient safety and comfort is ensured during the process.\n2.4\nFace is massaged thoroughly using different strokes always\nin upward movement.\n2.5\nAppropriate timeline prescribed for each step is followed.\n2.6\nWater level of facial steamer is checked according to D.O.H.\nrules and regulations.\n2.7\nSkin is toned with manual or facial machine and applied with\nappropriate finishing facial products.\n3. Perform post\ntreatment activity\n3.1\nResult is checked through visual or with the use of equipment.\n3.2\nClient is advised on post treatment precautions and\nappropriate maintenance product procedure.\n3.3\nTools, equipment and materials are cleaned and sanitized\nand stored according to OHSC.\n3.4\nWorkstation is cleaned for next activities.\n3.5\nCleansing and treatment products are stored in designated\nareas.\n3.6\nWastes are disposed following DENR regulations.\n3.7\nCold compress is applied on treated area following salon\npolicies and procedures.\n\n--- PDF PAGE 50 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 46 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Skin Condition\n1.1\nWith Pimples\n1.2\nWith Acne\n1.3\nWith Warts\n2. Protective Clothing\nAnd Gadget\n2.1\nEyepads\n2.2\nTowel\n2.3\nHeadband\n2.4\nFacial Gown\n2.5\nGauze Mask\n2.6\nBib (White Cloth)\n2.7\nBath Towel\n2.8\nLinen (Leg Cover)\n2.9\nFacial Mask\n3. Treatment Product\n3.1\nSkin Toner\n3.2\nFacial Cream\n3.3\nMoisturizer\n3.4\nAstringent\n3.5\nBleaching Cream\n3.6\nAcne Cream\n3.7\nSun Block Cream\n3.8\nPeeling Lotion\n3.9\nPeel-Off Mask\n3.10 Mud Pack\n3.11 Honey Pack\n3.12 Cleansing Cream\n3.13 Facial Scrub\n4. Supplies And\nMaterials\n4.1\nBed Sheet\n4.2\nTowelette\n4.3\nTissue\n4.4\nFacial Mask\n4.5\nCotton\n4.6\nSkin Tone\n5. Tools And Equipment 5.1\nFacial machine with the following accessories:\n5.1.1 Scrubbing Brush\n5.1.2 Ultraviolet\n5.1.3 Vacuum\n5.1.4 Spray\n5.1.5 Galvanic\n5.2\nMagnifying Lamp\n5.3\nHot Cabinet\n5.4\nFacial Steamer\n5.5\nFacial Bed\n5.6\nFacial Brush\n5.7\nFacial Bowl\n5.8\nFacial Glass\n5.9\nFacial Basin\n5.10 Sterilizer\n5.11 Stool\n5.12 Pricking Tools\n\n--- PDF PAGE 51 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 47 -\nVARIABLE\nRANGE\n6. Different Strokes\n6.1\nSpreading\n6.2\nChin Movements\n6.3\nLower Cheeks\n6.4\nMouth Nose Cheek Movement\n6.5\nLinear Movement Forehead\n6.6\nCircular Movements Forehead\n6.7\nCriss - Cross\n6.8\nStroking Movements\n6.9\nBrow and Eye Movements\n6.10 Nose and Upper Cheek Movements\n6.11 Lip and Chin Movement\n6.12 Optional Movement\n6.13 Lifting Movement of Cheeks\n6.14 Rotary Move of Cheeks\n6.15 Light Tapping Movement\n6.16 Stroking Movement of Neck\n6.17 Circular Movement Over Neck and Chest\n6.18 Shoulder and Back Movement\n6.19 Chest and Back Movement\n6.20 Back Massage (optional)\n\n--- PDF PAGE 52 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 48 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment required evidence that the candidate:\n1.1\nChecked and analyzed clients’ facial skin tone and condition.\n1.2\nUsed protective clothing and gadget.\n1.3\nObserved personal hygiene sanitation practices during the\nentire process.\n1.4\nUsed appropriate types and amount of treatment products.\n1.5\nPerformed cleaning and massage following standard\ntechniques and procedures.\n1.6\nApplied listening and questioning skills ensuring the safety\nand comfort of clients.\n1.7\nChecked set, use and sanitize tools and equipment supplies\nand materials according to OHSC requirements.\n1.8\nChecked final outcome and advises client on post treatment\nprecautions and use of appropriate facial maintenance\nproducts.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFacial Skin Type and Condition\n2.2\nCode of Ethics\n2.3\nTreatment Products (Types)\n2.4\nCorrect Massage Techniques\n2.5\nMachine Equipment Procedure\n2.6\nProtective Clothing and Gadget\n2.7\nD.O.H. Rules and Regulations\n2.8\nSalon Policies and Procedures\n2.9\nTime Management\n3. Underpinning skills\n3.1\nHandling Tools and Equipment\n3.2\nOperating Equipment\n3.3\nApplying Massage Techniques\n3.4\nApplying Customer Relations\n3.5\nApplying Treatment Product\n3.6\nProper disposing of waste\n3.7\nCommunicating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nTreatment Products\n4.3\nTools and Equipment\n4.4\nActual workstation or simulated workplace with complete\nfacilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 53 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 49 -\nUNIT OF COMPETENCY :\nPERFORM FOOT SPA\nUNIT CODE\n:"
