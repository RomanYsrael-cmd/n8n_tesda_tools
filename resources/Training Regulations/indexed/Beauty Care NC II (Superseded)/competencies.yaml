          "source_text": "1. Comply with health \nregulations \n \n1.1 \nSalon policies and procedures for personal hygiene applied. \n1.2 \nProcedures and practices implemented in a variety of salon \nsituations in accordance with state and local government \nhealth regulations. \n2. Assess own work \n2.1 \nReception, work areas and walkways maintained in a safe, \nuncluttered and organized manner according to salon policy. \n2.2 \nAll routines carried out safely, effectively with minimum \ninconvenience to clients and staff. \n2.3 \nWaste is stored and disposed of according to OHSC \nrequirements. \n2.4 \nSpills, food, waste, hair or potential hazards promptly \nremoved from floors according to salon policy. \n2.5 \nSpills, food, waste, hair or other potential hazards promptly \nremoved from floors according to salon policy. \n2.6 \nLinen is stored, cleaned and disinfected in line with OHS \nrequirements and salon procedures. \n2.7 \nRefreshments are provided to all clients. \n3. Check and maintain \ntools and equipment \n3.1 \nTools and equipment are stored safely and in position to \ncomply with salon requirements and local health regulations. \n3.2 \nTools and equipment are prepared for specific services as \nrequired. \n3.3 \nTools and equipment are checked for maintenance \nrequirements. \n3.4 \nTools and equipment are referred for repair as required. \n4.  Check and maintain \nstocks \n \n4.1 \nStock rotation procedures are carried out routinely and \naccurately according to salon procedures. \n4.2 \nStock levels are accurately recorded according to salon \nprocedures. \n4.3 \nUnder or over supplied stock items are notified immediately to \nthe salon supervisor. \n4.4 \nIncorrectly ordered or delivered stock is referred to the salon \nsupervisor for return to supplier. \n4.5 \nSafe lifting and carrying techniques maintained in line with \nsalon occupational health and safety policy and government \nlegislation. \n5.  Provide a relaxed \nand caring \nenvironm