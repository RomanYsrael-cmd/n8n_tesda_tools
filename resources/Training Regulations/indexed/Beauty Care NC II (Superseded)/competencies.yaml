        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted clients’ make-up requirements.\n1.2\nPerformed analysis of clients face, skintone and types.\n1.3\nUsed appropriate make-up tools and materials and\naccessories.\n1.4\nSelected and applied appropriate make-up products.\n1.5\nPerformed checking and apply final touch on client.\n1.6\nPerformed safe and sanitary procedures in handling customer.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCode of Ethics\n2.2\nMake-Up Procedure\n2.3\nFacial Skin and Type Analysis\n2.4\nMake-Up Product Knowledge\n2.5\nMake–Up Technique\n3. Underpinning skills\n3.1\nHandling Client\n3.2\nHandling tools and materials\n3.3\nApplying make-up\n3.4\nBlending of color\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nMake-Up Tools and Materials\n4.3\nMake-Up Products\n4.4\nActual work facilities or simulated work place\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 60 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 56 -"
        },
        "source_text": "HCS515314\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in applying\nfacial make-up. It also involves the preparation of the client,\napplication of make-up and the performance of post-facial make-\nup activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is consulted on specific make-up requirements.\n1.2\nClients’ shapes of face and skin type / tones are analyzed.\n1.3\nClient is seated in a comfortable position during the entire\nprocess.\n1.4\nProtective clothing is provided to the client.\n1.5\nClient is advised to remove all personal accessories.\n2. Perform application\nof make-up\n2.1\nHand is sanitized before actual application of make-up.\n2.2\nMake-up tools, supplies and materials are selected\naccording to client make – up requirement.\n2.3\nThe eyebrow is defined using appropriate tools.\n2.4\nClients face is thoroughly cleaned using appropriate\ncleansing products.\n2.5\nConcealer and foundation are applied to cover dark spots of\nthe face according to clients’ skintone.\n2.6\nAppropriate make-up products and accessories are\nselected and applied in standard sequence/procedure in\naccordance with OHSC regulations.\n3. Perform post facial\nmake-up activities\n3.1\nMake-up result is checked before application of final touch.\n3.2\nMake-up products tools and materials are stored according to\nsafety and sanitation rules and regulations.\n3.3\nClient is advised on appropriate product and procedure to\napply retouch.\n3.4\nWorkstation is cleared and prepared for next customer.\n\n--- PDF PAGE 57 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 53 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Make-up\nRequirements\n1.1\nDay Make-Up\n1.2\nEvening Make-Up\n1.3\nPhotographic\n1.4\nBridal\n1.5\nStage\n1.6\nFantasy\n1.7\nDebutant Make–Up\n1.8\nCinematic and Television Make–Up\n2. Shape of Face\n2.1\nRectangle or Elongated\n2.2\nInverted\n2.3\nHeart\n2.4\nOval\n2.5\nTriangular\n2.6\nSquare\n2.7\nDiamond\n2.8\nRound\n3. Skin Type\n3.1\nDry\n3.2\nNormal\n3.3\nOily\n4. Skintone\n4.1\nDark\n4.2\nFair\n4.3\nLight\n5. Protective clothing\nmay include\n5.1\nBath Towel\n5.2\nHeadband\n5.3\nSmock Gown\n5.4\nFace Towel or Towellette\n6. Foundation Eye Liner 6.1\nLiquid 6.3 Cake Eye Liner\n6.2\nPencil 6.4 Gel Eye Liner\n7. Eyebrow may be\ndefined through\n7.1\nPlucking\n7.2\nThreading\n7.3\nShaving\n8. Make-up Tools\n8.1\nSponge\n8.1.1 Natural\n8.1.2 Sea Sponge\n8.1.3 Soft for Cake\n8.1.4 Finger Tips\n8.2\nSharpener\n8.3\nCotton Buds\n8.4\nEyelash Curler\n8.5\nPowder Applicator\n8.6\nFlat brush\n8.6.1 Lip Brush\n8.6.2 Eye Liner Brush\n8.6.3 Eye Shadow Brush\n8.6.4 Large Eyebrow Brush\n8.6.5 Small Eyebrow Brush\n8.6.6 Large Blusher Brush\n8.6.7 Powder Brush\n8.6.8 Brow with Comb Brush\n8.6.9 Body Brush\n\n--- PDF PAGE 58 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 54 -\nVARIABLE\nRANGE\n\n8.7\nEye Brow Scissor\n8.8\nCurl Lash\n8.9\nFun Brush\n8.10 Eye Brow Blade\n8.11 Tweezer\n9. Cleansing Products\n9.1\nCream Form\n9.2\nLiquid Form\n10. Make-up Product\n10.0 Concealer\n10.1 Cake of Liquid Foundation\n10.2 Blusher\n10.3 Eyeshadow\n10.4 Eye Liner\n10.5 Eye Brow Pencil\n10.6 Lip Pencil\n10.7 Lip Stick\n10.8 Mascara\n10.9 Face Powder\n11. Face Powder\n11.1 Pressed Powder\n11.2 Loose Powder\n12. Accessories\n12.1 Glitter Gel\n12.2 Eye Gel\n12.3 Stoned Glitter\n12.4 Powder Glitter\n12.5 Lasher Glue (Artificial)\n13. Personal\nAccessories\n13.1 Earrings\n13.2 Necklace\n13.3 Any pierced items in the face\n\n--- PDF PAGE 59 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 55 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted clients’ make-up requirements.\n1.2\nPerformed analysis of clients face, skintone and types.\n1.3\nUsed appropriate make-up tools and materials and\naccessories.\n1.4\nSelected and applied appropriate make-up products.\n1.5\nPerformed checking and apply final touch on client.\n1.6\nPerformed safe and sanitary procedures in handling customer.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCode of Ethics\n2.2\nMake-Up Procedure\n2.3\nFacial Skin and Type Analysis\n2.4\nMake-Up Product Knowledge\n2.5\nMake–Up Technique\n3. Underpinning skills\n3.1\nHandling Client\n3.2\nHandling tools and materials\n3.3\nApplying make-up\n3.4\nBlending of color\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nMake-Up Tools and Materials\n4.3\nMake-Up Products\n4.4\nActual work facilities or simulated work place\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 60 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 56 -"
      }
    ],
