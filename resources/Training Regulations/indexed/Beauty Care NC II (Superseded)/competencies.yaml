        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on desired nail service activity and specific\nrequirements.\n1.2\nChecked and analyze nail condition, structure, shape and\nstyle.\n1.3\nProvided client with protective clothing.\n1.4\nRecognized nail disorder and give advice or referral to\nappropriate personnel.\n1.5\nSelected and prepared sanitized tools and equipment.\n1.6\nPrepared appropriate supplies and materials.\n1.7\nUsed questioning and listening skills to ensure client s safety\nand comfort during the entire process.\n1.8\nCleaned nails by pushing cuticle and removing dry skin using\nappropriate tools observing safety precautions.\n1.9\nMassaged hand and foot following D.O.H. rules and\nregulations.\n1.10 Applied base coat and tip seal coat using long strokes and\nsingle direction.\n1.11 Applied agreed nail polish color using light sweeping strokes\naround the cuticle and nail.\n1.12 Checked outcome and apply finishing touches according to\nsalon standard.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of Nails\n2.2\nCondition of Nail\n2.3\nStructure, Shape and Styles of Nails\n2.4\nHand and Foot Massage Movements\n2.5\nCode of Ethics\n2.6\nAnalysis of Nail Disorder\n2.7\nD.O.H. Rules and Regulations\n2.8\nOHSC Rules and Regulations\n2.9\nSalon Policies and Procedures\n2.10 Different Kinds of Antiseptic\n3. Underpinning skills\n3.1\nTechnique in Massage\n3.2\nNail Polish Application Technique\n3.3\nNegotiations Skills\n3.4\nBase and Top Coat Application Technique\n3.5\nProper Use of Tools and Equipment\n3.6\nClient Relations\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nTreatment Products\n4.3\nTools and Equipment\n4.4\nActual workstation or simulated workplace with complete\nfacilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 39 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 35 -\nUNIT OF COMPETENCY :\nPERFORM HAND SPA\nUNIT CODE\n:"
