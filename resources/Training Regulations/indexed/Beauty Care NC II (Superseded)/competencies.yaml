        "source_title": "APPLY FACIAL MAKE-UP",
        "source_text": "--- PDF PAGE 56 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 52 - \nUNIT OF COMPETENCY : \nAPPLY FACIAL MAKE-UP \nUNIT CODE \n: \nHCS515314 \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in applying \nfacial make-up.  It also involves the preparation of the client, \napplication of make-up and the performance of post-facial make-\nup activities. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare clients \n1.1 \nClient is consulted on specific make-up requirements. \n1.2 \nClients’ shapes of face and skin type / tones are analyzed. \n1.3 \nClient is seated in a comfortable position during the entire \nprocess. \n1.4 \nProtective clothing is provided to the client. \n1.5 \nClient is advised to remove all personal accessories. \n2.  Perform application \nof make-up \n2.1 \nHand is sanitized before actual application of make-up. \n2.2 \nMake-up tools, supplies and materials are selected \naccording to client make – up requirement. \n2.3 \nThe eyebrow is defined using appropriate tools. \n2.4 \nClients face is thoroughly cleaned using appropriate \ncleansing products. \n2.5 \nConcealer and foundation are applied to cover dark spots of \nthe face according to clients’ skintone. \n2.6 \nAppropriate make-up products and accessories are \nselected and applied in standard sequence/procedure in \naccordance with OHSC regulations. \n3.  Perform post facial \nmake-up activities \n3.1 \nMake-up result is checked before application of final touch. \n3.2 \nMake-up products tools and materials are stored according to \nsafety and sanitation rules and regulations. \n3.3 \nClient is advised on appropriate product and procedure to \napply retouch. \n3.4 \nWorkstation is cleared and prepared for next customer.\n\n--- PDF PAGE 57 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 53 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Make-up \nRequirements