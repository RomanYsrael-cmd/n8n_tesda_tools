VIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked and analyzed body condition.\n1.2\nRequested the un - wearing of personal accessories to\nachieve optimum result.\n1.3\nEnsured clients comfort and safety in performing the body\nmassage in any position.\n1.4\nPrepared and used Tools, Supplies and Materials according to\nOHSC requirements.\n1.5\nApplied appropriate and necessary strokes and movements\nfollowing DOH requirements.\n1.6\nApplied necessary movements according to prescribed\ndirection.\n1.7\nObserved timeline according to salon standard.\n1.8\nAdvise clients on safety precautions after the massage.\n1.9\nAcknowledged pain or other complains made by the client.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nDifferent types of Massage\n2.2\nD.O.H. Rules and Regulations\n2.3\nOHSC Policies and Procedures\n2.4\nTimeline\n2.5\nProtective Clothing\n2.6\nSalon Policies and Procedures\n2.7\nClient Relations\n2.8\nDifferent Body Conditions\n2.9\nDifferent Massage Products\n2.10 Body Critical Points\n3. Underpinning skills\n3.1\nObserve personal hygiene\n3.2\nApply different types of massage\n3.3\nUse tools and equipment\n3.4\nUse appropriate strokes / movements\n3.5\nUse of different massage product\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nSupplies and Materials\n4.3\nBody Massage Product\n4.4\nProtective Clothing and Gadget\n4.5\nSimulated or Actual Workplace\n4.6\nAppropriate Tools and Equipment\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect Observation with Questioning\n5.2\nDemonstration with Questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 46 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 42 -\nUNIT OF COMPETENCY :\nPERFORM BODY SRUB\nUNIT CODE\n:\nHCS515305\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in performing\nbody scrub. It involves the preparation of the clients, application of\nbody scrub treatment products and performing post body scrubbing\nactivities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClients’ skin condition and types are checked and analyzed.\n1.2\nClient is provided with appropriate clothing material.\n1.3\nClient is advised to remove personal accessories to achieve\noptimum service results.\n1.4\nClient is positioned lying upside down.\n1.5\nWork station is thoroughly checked according to salon policies\nand procedures.\n1.6\nNecessary tools and equipment are prepared according to\nthe service requirements.\n1.7\nSkin test is administered to prevent possible contraindications.\n2. Scrub body surface\n2.1\nClient is bathe in lukewarm water before and after scrubbing\nthe body surface using face towel.\n2.2\nSkin scrub product is applied thoroughly on the body surface\nusing hand in a to and fro motion.\n2.3\nClients’ safety and comfort is ensured during the entire\nprocess.\n2.4\nSupplies and materials are prepared and used according to\nOHSC requirement.\n2.5\nScrubbing is performed with the timeline and procedure\nprescribed by salon or industry.\n3. Perform final\nchecking and polish\noutput\n3.1\nResult is checked according to the clients desired outcome.\n3.2\nClient is advised with appropriate maintenance progress.\n3.3\nClient is consulted and prepared for other possible skin\nenhancement/improvement activity.\n3.4\nUsed supplies and material scrub products are stored and\ndisposed according to OHSC requirements.\n3.5\nWorkstation is sanitized and prepared for next salon activity.\n\n--- PDF PAGE 47 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 43 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Types and skin\nconditions\n1.1\nDry\n1.2\nOily\n1.3\nNormal\n1.4\nFine\n1.5\nRough\n2. Protective clothing\nmaterials\n2.1\nBath Towel\n2.2\nBath Robe\n2.3\nHeadband\n2.4\nGauge Mask\n2.5\nSlippers\n3. Personal accessories 3.1\nWrist Watch\n3.2\nRing\n3.3\nBangles and Bracelet\n3.4\nNecklace\n3.5\nAnklet\n4. Supplies/materials\n4.1\nScrubbing Product\n4.2\nScrubbing Cream\n4.3\nBody Lotion\n4.4\nBed Sheet\n4.5\nLukewarm Water\n4.6\nWhitening Soap\n5. Tools and equipment\n5.1\nStool\n5.2\nFace Towel\n5.3\nBasin\n5.4\nScrubbing Gloves\n5.5\nTimer\n5.6\nPillow\n6. Timeline procedure\n6.1\n45 minutes\n6.2\n1 hour\n7. Scrubbing area\n7.1\nArms\n7.2\nLegs\n7.3\nArmpit\n7.4\nEntire body\n\n--- PDF PAGE 48 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 44 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked and analyzed the clients skin type condition.\n1.2\nProvides client with appropriate clothing material.\n1.3\nBathe client with lukewarm water.\n1.4\nApplied appropriate skin scrub products on body surface\nfollowing salon policies and procedures.\n1.5\nEnsured clients safety and comfort during the entire process\nby questioning-listening to them.\n1.6\nPrepared and used S/M according to OHSC requirements.\n1.7\nPerformed the scrubbing activity following prescribed salon\npolicies and procedures.\n1.8\nChecked result and advice client on appropriate maintenance\nprogram.\n1.9\nConsulted and explained all possible skin improvement\nenhancement of skin.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSkin Type Condition\n2.2\nCode of Ethics\n2.3\nTreatment Products\n2.4\nClothing Material\n2.5\nD.O.H. Rules and Regulations\n2.6\nTime Management\n3. Underpinning skills\n3.1\nApply scrubbing product\n3.2\nApply client relationship\n3.3\nApply scrubbing technique\n3.4\nUse supply and materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nSupplies and Materials\n4.3\nActual workstation or simulated workplace with complete\nfacilities.\n4.4\nBody skin scrubbing products.\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 49 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 45 -\nUNIT OF COMPETENCY :\nPERFORM FACIAL TREATMENT\nUNIT CODE\n:\nHCS515306\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in performing\nfacial treatment. It also covers the competency in assessing the\nclients; perform actual facial cleansing and treatment of the face\nand post treatment activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess clients needs\n1.1\nClients’ facial skin condition is checked and analyzed.\n1.2\nClient is advised on appropriate facial treatment option.\n1.3\nProtective clothing and gadget are worn by the client and\nattendant.\n1.4\nHands are thoroughly washed and sanitized before performing\nthe activity.\n1.5\nClient is consulted to confirm health condition per instruction if\nany.\n2. Perform cleaning and\nactual treatment of\nthe face (separate\ncleaning from actual\ntreatment, these can\nbe two activities or\nelements)\n2.1\nTreatment products are prepared and used according to salon\nprocedures and manufacturer’s instruction.\n2.2\nAppropriate cleaning technique and application of cleansing\nproduct is performed following salon policies.\n2.3\nClient safety and comfort is ensured during the process.\n2.4\nFace is massaged thoroughly using different strokes always\nin upward movement.\n2.5\nAppropriate timeline prescribed for each step is followed.\n2.6\nWater level of facial steamer is checked according to D.O.H.\nrules and regulations.\n2.7\nSkin is toned with manual or facial machine and applied with\nappropriate finishing facial products.\n3. Perform post\ntreatment activity\n3.1\nResult is checked through visual or with the use of equipment.\n3.2\nClient is advised on post treatment precautions and\nappropriate maintenance product procedure.\n3.3\nTools, equipment and materials are cleaned and sanitized\nand stored according to OHSC.\n3.4\nWorkstation is cleaned for next activities.\n3.5\nCleansing and treatment products are stored in designated\nareas.\n3.6\nWastes are disposed following DENR regulations.\n3.7\nCold compress is applied on treated area following salon\npolicies and procedures.\n\n--- PDF PAGE 50 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 46 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Skin Condition\n1.1\nWith Pimples\n1.2\nWith Acne\n1.3\nWith Warts\n2. Protective Clothing\nAnd Gadget\n2.1\nEyepads\n2.2\nTowel\n2.3\nHeadband\n2.4\nFacial Gown\n2.5\nGauze Mask\n2.6\nBib (White Cloth)\n2.7\nBath Towel\n2.8\nLinen (Leg Cover)\n2.9\nFacial Mask\n3. Treatment Product\n3.1\nSkin Toner\n3.2\nFacial Cream\n3.3\nMoisturizer\n3.4\nAstringent\n3.5\nBleaching Cream\n3.6\nAcne Cream\n3.7\nSun Block Cream\n3.8\nPeeling Lotion\n3.9\nPeel-Off Mask\n3.10 Mud Pack\n3.11 Honey Pack\n3.12 Cleansing Cream\n3.13 Facial Scrub\n4. Supplies And\nMaterials\n4.1\nBed Sheet\n4.2\nTowelette\n4.3\nTissue\n4.4\nFacial Mask\n4.5\nCotton\n4.6\nSkin Tone\n5. Tools And Equipment 5.1\nFacial machine with the following accessories:\n5.1.1 Scrubbing Brush\n5.1.2 Ultraviolet\n5.1.3 Vacuum\n5.1.4 Spray\n5.1.5 Galvanic\n5.2\nMagnifying Lamp\n5.3\nHot Cabinet\n5.4\nFacial Steamer\n5.5\nFacial Bed\n5.6\nFacial Brush\n5.7\nFacial Bowl\n5.8\nFacial Glass\n5.9\nFacial Basin\n5.10 Sterilizer\n5.11 Stool\n5.12 Pricking Tools\n\n--- PDF PAGE 51 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 47 -\nVARIABLE\nRANGE\n6. Different Strokes\n6.1\nSpreading\n6.2\nChin Movements\n6.3\nLower Cheeks\n6.4\nMouth Nose Cheek Movement\n6.5\nLinear Movement Forehead\n6.6\nCircular Movements Forehead\n6.7\nCriss - Cross\n6.8\nStroking Movements\n6.9\nBrow and Eye Movements\n6.10 Nose and Upper Cheek Movements\n6.11 Lip and Chin Movement\n6.12 Optional Movement\n6.13 Lifting Movement of Cheeks\n6.14 Rotary Move of Cheeks\n6.15 Light Tapping Movement\n6.16 Stroking Movement of Neck\n6.17 Circular Movement Over Neck and Chest\n6.18 Shoulder and Back Movement\n6.19 Chest and Back Movement\n6.20 Back Massage (optional)\n\n--- PDF PAGE 52 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 48 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment required evidence that the candidate:\n1.1\nChecked and analyzed clients’ facial skin tone and condition.\n1.2\nUsed protective clothing and gadget.\n1.3\nObserved personal hygiene sanitation practices during the\nentire process.\n1.4\nUsed appropriate types and amount of treatment products.\n1.5\nPerformed cleaning and massage following standard\ntechniques and procedures.\n1.6\nApplied listening and questioning skills ensuring the safety\nand comfort of clients.\n1.7\nChecked set, use and sanitize tools and equipment supplies\nand materials according to OHSC requirements.\n1.8\nChecked final outcome and advises client on post treatment\nprecautions and use of appropriate facial maintenance\nproducts.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFacial Skin Type and Condition\n2.2\nCode of Ethics\n2.3\nTreatment Products (Types)\n2.4\nCorrect Massage Techniques\n2.5\nMachine Equipment Procedure\n2.6\nProtective Clothing and Gadget\n2.7\nD.O.H. Rules and Regulations\n2.8\nSalon Policies and Procedures\n2.9\nTime Management\n3. Underpinning skills\n3.1\nHandling Tools and Equipment\n3.2\nOperating Equipment\n3.3\nApplying Massage Techniques\n3.4\nApplying Customer Relations\n3.5\nApplying Treatment Product\n3.6\nProper disposing of waste\n3.7\nCommunicating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nTreatment Products\n4.3\nTools and Equipment\n4.4\nActual workstation or simulated workplace with complete\nfacilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 53 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 49 -\nUNIT OF COMPETENCY :\nPERFORM FOOT SPA\nUNIT CODE\n:\nHCS515307\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in performing foot\nspa. It involves the preparation of the clients, application of foot spa\nproducts and performing post foot spa activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nFoot condition is checked and analyzed.\n1.2\nClient safety and comfort is ensured during the entire process.\n1.3\nTools, equipment, supplies and materials are prepared and\nused according to salon procedures.\n1.4\nPersonal protective clothing and gadget are worn before the\nstart of the procedure.\n1.5\nWater temperature is checked against client heat tolerance.\n2. Apply foot spa\n2.1\nFoot is thoroughly scrubbed using appropriate tools following\nsafety procedures.\n2.2\nFoot is applied with treatment product before and after\nsoaking in foot spa machine.\n2.3\nTreatment is performed within the required salon time frame.\n2.4\nFoot is massage following basic foot massage motion\nmovement.\n2.5\nFoot is cleaned thoroughly by soaking in liquid soap and\nlukewarm water for 10-15 minutes.\n3. Perform post foot spa\nactivity\n3.1\nTools, equipment, supplies and materials are disinfected and\nstored according to OHSC requirements.\n3.2\nOutcome of treatment is assessed against clients’\nrequirements and recorded following salon procedure.\n3.3\nAfter care advice and homecare products are recommended\naccording to clients needs.\n3.4\nWorkstation is sanitized and prepared for the succeeding\nsalon activities.\n3.5\nWastes are disposed according to OHSC requirements.\n\n--- PDF PAGE 54 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 50 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Condition of the Foot\n1.1\nNormal\n1.2\nDry\n1.3\nWith abrasions or cuts\n1.4\nWith fungal infection or wounds\n1.5\nWith open wound\n2. Tools and Equipment\n2.1\nFoot Spa Machine\n2.2\nFoot File\n2.3\nFoot Stool\n2.4\nPumice Stone\n2.5\nGloves\n2.6\nMetal File\n2.7\nBrush\n2.8\nSmall Basin\n2.9\nFoot Towel\n2.10 Mixing Bowl\n2.11 Callous Scraper\n3. Supplies and\nmaterials\n3.1\nFoot Toner\n3.2\nWhitening Powder\n3.3\nMoisturizing Lotion\n3.4\nMedicated Liquid Soap\n3.5\nAntiseptics\n3.6\nLiquid Soap\n3.7\nFoot Lotion\n3.8\nFoot Scrub Lotion\n3.9\nOil\n3.10 Warm Water\n4. Basic Foot Massage\nMovement\n4.1\nSliding\n4.2\nCircular Motion\n4.3\nPressing\n4.4\nStretching of Finger Toes\n5. Home Care Products\n5.1\nFoot Powder\n5.2\nFoot Spray\n5.3\nFoot Lotion\n5.4\nPetroleum Jelly\n\n--- PDF PAGE 55 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 51 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nApplied salon policies and procedures in performing foot\ntreatment.\n1.2\nApplied of safety rules and regulations during the entire\nprocess.\n1.3\nAnalyzed varied condition of the foot.\n1.4\nChecked, handled and stored appropriate tools, equipment,\nsupplies, materials according to OHSC requirements.\n1.5\nApplied basic foot massage following different prescribed\nmovements.\n1.6\nApplied treatment product as per clients needs following\nmanufacturers instructions and safety practices.\n1.7\nDisplayed the ability to use effective questioning and listening\nskills in consulting and negotiating with clients.\n1.8\nUsed personal protective clothing and gadgets in performing\nthe activity.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFoot Condition\n2.2\nCode of Ethics\n2.3\nOHSC and D.O.H. Rules and Regulations\n2.4\nBasic Foot Massage Procedure\n2.5\nSalon Policies and Procedures\n2.6\nBasic Product Knowledge\n2.7\nTime Management\n3. Underpinning skills\n3.1\nApplying basic massage\n3.2\nApplying proper massage procedure\n3.3\nHandling of tools\n3.4\nHandling client\n3.5\nManaging time\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant Supplies and Materials\n4.2\nLive Model\n4.3\nSimulated or Actual Workplace\n4.4\nTools and Equipment used in the treatment\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2\nDirect Observation with Questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 56 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 52 -\nUNIT OF COMPETENCY :\nAPPLY FACIAL MAKE-UP\nUNIT CODE\n:\nHCS515314\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in applying\nfacial make-up. It also involves the preparation of the client,\napplication of make-up and the performance of post-facial make-\nup activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is consulted on specific make-up requirements.\n1.2\nClients’ shapes of face and skin type / tones are analyzed.\n1.3\nClient is seated in a comfortable position during the entire\nprocess.\n1.4\nProtective clothing is provided to the client.\n1.5\nClient is advised to remove all personal accessories.\n2. Perform application\nof make-up\n2.1\nHand is sanitized before actual application of make-up.\n2.2\nMake-up tools, supplies and materials are selected\naccording to client make – up requirement.\n2.3\nThe eyebrow is defined using appropriate tools.\n2.4\nClients face is thoroughly cleaned using appropriate\ncleansing products.\n2.5\nConcealer and foundation are applied to cover dark spots of\nthe face according to clients’ skintone.\n2.6\nAppropriate make-up products and accessories are\nselected and applied in standard sequence/procedure in\naccordance with OHSC regulations.\n3. Perform post facial\nmake-up activities\n3.1\nMake-up result is checked before application of final touch.\n3.2\nMake-up products tools and materials are stored according to\nsafety and sanitation rules and regulations.\n3.3\nClient is advised on appropriate product and procedure to\napply retouch.\n3.4\nWorkstation is cleared and prepared for next customer.\n\n--- PDF PAGE 57 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 53 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Make-up\nRequirements\n1.1\nDay Make-Up\n1.2\nEvening Make-Up\n1.3\nPhotographic\n1.4\nBridal\n1.5\nStage\n1.6\nFantasy\n1.7\nDebutant Make–Up\n1.8\nCinematic and Television Make–Up\n2. Shape of Face\n2.1\nRectangle or Elongated\n2.2\nInverted\n2.3\nHeart\n2.4\nOval\n2.5\nTriangular\n2.6\nSquare\n2.7\nDiamond\n2.8\nRound\n3. Skin Type\n3.1\nDry\n3.2\nNormal\n3.3\nOily\n4. Skintone\n4.1\nDark\n4.2\nFair\n4.3\nLight\n5. Protective clothing\nmay include\n5.1\nBath Towel\n5.2\nHeadband\n5.3\nSmock Gown\n5.4\nFace Towel or Towellette\n6. Foundation Eye Liner 6.1\nLiquid 6.3 Cake Eye Liner\n6.2\nPencil 6.4 Gel Eye Liner\n7. Eyebrow may be\ndefined through\n7.1\nPlucking\n7.2\nThreading\n7.3\nShaving\n8. Make-up Tools\n8.1\nSponge\n8.1.1 Natural\n8.1.2 Sea Sponge\n8.1.3 Soft for Cake\n8.1.4 Finger Tips\n8.2\nSharpener\n8.3\nCotton Buds\n8.4\nEyelash Curler\n8.5\nPowder Applicator\n8.6\nFlat brush\n8.6.1 Lip Brush\n8.6.2 Eye Liner Brush\n8.6.3 Eye Shadow Brush\n8.6.4 Large Eyebrow Brush\n8.6.5 Small Eyebrow Brush\n8.6.6 Large Blusher Brush\n8.6.7 Powder Brush\n8.6.8 Brow with Comb Brush\n8.6.9 Body Brush\n\n--- PDF PAGE 58 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 54 -\nVARIABLE\nRANGE\n\n8.7\nEye Brow Scissor\n8.8\nCurl Lash\n8.9\nFun Brush\n8.10 Eye Brow Blade\n8.11 Tweezer\n9. Cleansing Products\n9.1\nCream Form\n9.2\nLiquid Form\n10. Make-up Product\n10.0 Concealer\n10.1 Cake of Liquid Foundation\n10.2 Blusher\n10.3 Eyeshadow\n10.4 Eye Liner\n10.5 Eye Brow Pencil\n10.6 Lip Pencil\n10.7 Lip Stick\n10.8 Mascara\n10.9 Face Powder\n11. Face Powder\n11.1 Pressed Powder\n11.2 Loose Powder\n12. Accessories\n12.1 Glitter Gel\n12.2 Eye Gel\n12.3 Stoned Glitter\n12.4 Powder Glitter\n12.5 Lasher Glue (Artificial)\n13. Personal\nAccessories\n13.1 Earrings\n13.2 Necklace\n13.3 Any pierced items in the face\n\n--- PDF PAGE 59 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 55 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted clients’ make-up requirements.\n1.2\nPerformed analysis of clients face, skintone and types.\n1.3\nUsed appropriate make-up tools and materials and\naccessories.\n1.4\nSelected and applied appropriate make-up products.\n1.5\nPerformed checking and apply final touch on client.\n1.6\nPerformed safe and sanitary procedures in handling customer.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCode of Ethics\n2.2\nMake-Up Procedure\n2.3\nFacial Skin and Type Analysis\n2.4\nMake-Up Product Knowledge\n2.5\nMake–Up Technique\n3. Underpinning skills\n3.1\nHandling Client\n3.2\nHandling tools and materials\n3.3\nApplying make-up\n3.4\nBlending of color\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nLive Model\n4.2\nMake-Up Tools and Materials\n4.3\nMake-Up Products\n4.4\nActual work facilities or simulated work place\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nDirect observation with questioning\n5.3\nWritten test\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 60 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 56 -"
