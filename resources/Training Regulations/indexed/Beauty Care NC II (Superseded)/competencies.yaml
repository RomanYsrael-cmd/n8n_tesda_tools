oot \n1.1 \nNormal \n1.2 \nDry \n1.3 \nWith abrasions or cuts \n1.4 \nWith fungal infection or wounds \n1.5 \nWith open wound \n2. Tools and Equipment \n2.1 \nFoot Spa Machine \n2.2 \nFoot File \n2.3 \nFoot Stool \n2.4 \nPumice Stone \n2.5 \nGloves \n2.6 \nMetal File \n2.7 \nBrush \n2.8 \nSmall Basin \n2.9 \nFoot Towel \n2.10 Mixing Bowl \n2.11 Callous Scraper \n3. Supplies and \nmaterials \n3.1 \nFoot Toner \n3.2 \nWhitening Powder \n3.3 \nMoisturizing Lotion \n3.4 \nMedicated Liquid Soap \n3.5 \nAntiseptics \n3.6 \nLiquid Soap \n3.7 \nFoot Lotion \n3.8 \nFoot Scrub Lotion \n3.9 \nOil \n3.10 Warm Water \n4. Basic Foot Massage \nMovement \n4.1 \nSliding \n4.2 \nCircular Motion \n4.3 \nPressing \n4.4 \nStretching of Finger Toes \n5. Home Care Products \n5.1 \nFoot Powder \n5.2 \nFoot Spray \n5.3 \nFoot Lotion \n5.4 \nPetroleum Jelly\n\n--- PDF PAGE 55 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 51 - \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nApplied salon policies and procedures in performing foot \ntreatment. \n1.2 \nApplied of safety rules and regulations during the entire \nprocess. \n1.3 \nAnalyzed varied condition of the foot. \n1.4 \nChecked, handled and stored appropriate tools, equipment, \nsupplies, materials according to OHSC requirements. \n1.5 \nApplied basic foot massage following different prescribed \nmovements. \n1.6 \nApplied treatment product as per clients needs following \nmanufacturers instructions and safety practices. \n1.7 \nDisplayed the ability to use effective questioning and listening \nskills in consulting and negotiating with clients. \n1.8 \nUsed personal protective clothing and gadgets in performing \nthe activity. \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nFoot Condition \n2.2 \nCode of Ethics \n2.3 \nOHSC and D.O.H. Rules and Regulations \n2.4 \nBasic Foot Massage Procedure \n2.5 \nSalon Policies and Procedures \n2.6 \nBasic Product Knowledge \n2.7 \nTime Management \n3. Underpinning skills \n3.1 \nApplying basic massage \n3.2 \nApplying proper massage procedure \n3.3 \nHandling of tools \n3.4 \nHandling client  \n3.5 \nManaging time  \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nRelevant Supplies and Materials \n4.2 \nLive Model \n4.3 \nSimulated or Actual Workplace \n4.4 \nTools and Equipment used in the treatment \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDemonstration with Questioning \n5.2 \nDirect Observation with Questioning \n6. Context of \nassessment \n6.1  Competency may be assessed in the workplace or accredited \nassessment center.\n",
