          "source_text": "1.  Prepare client \n1.1 \nFoot condition is checked and analyzed. \n1.2 \nClient safety and comfort is ensured during the entire process. \n1.3 \nTools, equipment, supplies and materials are prepared and \nused according to salon procedures. \n1.4 \nPersonal protective clothing and gadget are worn before the \nstart of the procedure. \n1.5 \nWater temperature is checked against client heat tolerance. \n2.  Apply foot spa \n2.1 \nFoot is thoroughly scrubbed using appropriate tools following \nsafety procedures. \n2.2 \nFoot is applied with treatment product before and after \nsoaking in foot spa machine. \n2.3 \nTreatment is performed within the required salon time frame. \n2.4 \nFoot is massage following basic foot massage motion \nmovement. \n2.5 \nFoot is cleaned thoroughly by soaking in liquid soap and \nlukewarm water for 10-15 minutes. \n3.  Perform post foot spa \nactivity \n3.1 \nTools, equipment, supplies and materials are disinfected and \nstored according to OHSC requirements. \n3.2 \nOutcome of treatment is assessed against clients’ \nrequirements and recorded following salon procedure. \n3.3 \nAfter care advice and homecare products are recommended \naccording to clients needs. \n3.4 \nWorkstation is sanitized and prepared for the succeeding \nsalon activities. \n3.5 \nWastes are disposed according to OHSC requirements.\n\n--- PDF PAGE 54 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 50 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Condition of the Foot \n1.1 \nNormal \n1.2 \nDry \n1.3 \nWith abrasions or cuts \n1.4 \nWith fungal infection or wounds \n1.5 \nWith open wound \n2. Tools and Equipment \n2.1 \nFoot Spa Machine \n2.2 \nFoot File \n2.3 \nFoot Stool \n2.4 \nPumice Stone \n2.5 \nGloves \n2.6 \nMetal File \n2.7 \nBrush \n2.8 \nSmall Basin \n2.9 \nFoot Towel \n2.10 Mixing Bowl \n2.11 Callous Scraper \n3. Supplies and \nmaterials \n3.1 \nFoot Toner \n3.2 \nWhitening Powder \n3.3 \nMoisturizing Lotion \n3.4 \nMedicated Liquid Soap \n3.5 \nAntiseptics \n3.6 \nLiquid Soap \n3.7 \nFoot Lotion \n3.8 \nFoot Scrub Lotion \n3.9 \nOil \n3.10 Warm Water \n4. Basic Foot Massage \nMovement \n4.1 \nSliding \n4.2 \nCircular Motion \n4.3 \nPressing \n4.4 \nStretching of Finger Toes \n5. Home Care Products \n5.1 \nFoot Powder \n5.2 \nFoot Spray \n5.3 \nFoot Lotion \n5.4 \nPetroleum Jelly\n\n--- PDF PAGE 55 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 51 -"
