        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload.\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements.\n1.3\nDemonstrated capacity to complete task within specified time\nframe.\n1.4\nMaintained quality of own performance.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills\n3.1\nCapacity to plan and prioritize security work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit.\n6.5\nContinuous assessment in the workplace, taking into account\nthe range of variables affecting performance.\n6.6\nSelf-assessment on the same terms as those described\nabove.\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria.\n\n--- PDF PAGE 25 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 21 -\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
        },
        "source_text": "HCS516202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\neffectively managing own workload and quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever possible.\n1.5\nWork schedules are known and completed within agreed time\nframes.\n1.6\nWork plans developed according to assignment requirements\nand employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility for\ncompletion passed to incoming shift or other appropriate\npersons.\n2. Maintain quality of\nown performance\n2.1 Personal performance continually monitored against agreed\nperformance standards.\n2.2\nAdvice and guidance sought when necessary to achieve or\nmaintain agreed standards.\n2.3\nGuidance from management applied to achieve or maintain\nagreed standards.\n2.4\nStandard of work clarified and agreed according to employer\npolicy and procedures.\n3. Build credibility with\ncustomers/clients\n3.4\nClient expectations for reliability, punctuality and appearance\nadhered to.\n3.5\nPossible causes of client/customer dissatisfaction identified,\ndealt with and recorded according to employer policy.\n3.6\nClient fully informed of all relevant security matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 23 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 19 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal Instructions by senior officer\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nstandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 24 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 20 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload.\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements.\n1.3\nDemonstrated capacity to complete task within specified time\nframe.\n1.4\nMaintained quality of own performance.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills\n3.1\nCapacity to plan and prioritize security work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit.\n6.5\nContinuous assessment in the workplace, taking into account\nthe range of variables affecting performance.\n6.6\nSelf-assessment on the same terms as those described\nabove.\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria.\n\n--- PDF PAGE 25 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 21 -\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
