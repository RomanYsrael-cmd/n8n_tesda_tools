            "title": "Clean the finger nails and toe nails",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Nail polish is completely removed with nail polish remover."
              },
              {
                "number": "2.2",
                "text": "Fingernails are soaked in warm water with soap following salon standards."
              },
              {
                "number": "2.3",
                "text": "Cuticles and dry skins are slightly pushed and completely removed using appropriate tools observing safety precautions."
              },
              {
                "number": "2.4",
                "text": "Nails are trimmed and filed following customer’s desired shape and style."
              },
              {
                "number": "2.5",
                "text": "Antiseptic is applied immediately upon accidental cut is incurred."
              }
