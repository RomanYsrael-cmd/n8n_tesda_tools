        "source_title": "PERFORM BODY MASSAGE",
        "source_text": "--- PDF PAGE 42 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 38 - \nUNIT OF COMPETENCY : \nPERFORM BODY MASSAGE \nUNIT CODE \n: \nHCS515304 \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in performing \nbody massage. This involves preparing the client, massaging the \ndesired and planned body area and applies post body massage \ntreatment activities. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare clients \n1.1 \nClients’ body condition is checked and analyzed. \n1.2 \nClient is consulted on what type of massage is desired. \n1.3 \nClient is provided with protective clothing materials. \n1.4 \nAll product, tools are prepared and used according to OHSC \nrequirements. \n1.5 \nClient is consulted on the type of massage products are to be \nused.  \n1.6 \nClient is advised to remove all personal accessories and kept \nin a safe place. \n2. Massage body \n2.1 \nClient is laid in a position ensuring the safety and comfort \nduring the entire process. \n2.2 \nCorrect direction and required movements / strokes are \nfollowed in the massage technique. \n2.3 \nAppropriate timeline is observed according to salon policies \nstandard. \n2.4 \nBody massage product is spread out on the area and \nfollowed with massage according to salon standard \nprocedures. \n2.5 \nCritical body points are massage with soft pressure. \n2.6 \nAny pain / complain made by the client is immediately \nacknowledged. \n3. Post body massage \ntreatment \n3.1 \nClient is advised not to take a bath within 12 hours according \nto D.O.H. rules. \n3.2 \nCubicle is sanitized and prepared for the next salon activity. \n3.3 \nTools, massage products are cleaned and sterilized and kept \nin designated cabinets. \n3.4 \nMassage activity is recorded according to salon policies and \nprocedures.\n\n--- PDF PAGE 43 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 39 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Body Condition \n1.1 \nNormal \n1.2 \nWith Low Blood Pressure \n1.3 \nWith High Blood Pressure \n1.4 \nWith Deformities \n1.5 \nWith Skin Rashes \n2.  Types of Massage \n2.1 \nSwedish \n2.2 \nSiatzu \n2.3 \nReflexology \n2.4 \nBasic \n2.5 \nChair Spot \n2.6 \nThai \n3.  Timeline \n3.1 \n45 mins. \n3.2 \n1 hour \n3.3 \n20 minutes (for partial area of the body) \n4.  Cleaning \n4.1 \nUse face towel with lukewarm water \n4.2 \nSteam Bath \n4.3 \nQuick Shower \n5.   Tools and \nEquipment \n5.1 \nMassage Gadgets \n5.2 \nMassage Bed \n5.3 \nBed Sheets \n5.4 \nPillow \n5.5 \nStool \n6.  Personal Accessories 6.1 \nJewelries \n6.2 \nHead Band \n6.3 \nWrist Watch \n6.4 \nHair Accessories \n7.  Massage Technique \n7.1 \nSoft Pressure \n7.2 \nHard Pressure \n8.  Protective Clothing \nMaterials \n8.1 \nFace Towel \n8.2 \nBath Towel \n8.3 \nShorts \n8.4 \nGauze Mask \n8.5 \nSmock Gown \n8.6 \nBath Robe \n8.7 \nHead Band \n8.8 \nApron \n9. Massage Products \n9.1 \nLotion \n9.2 \nAromatic Oil \n9.3 \nOlive Oil \n9.4 \nPowder \n9.5 \nMentholated Oil \n9.6 \nHerbal Oil \n10. Critical Body Points \n10.1 Nape \n10.2 Breast \n10.3 Spinal \n10.4 Head \n10.5 Stomach \n10.6 Back of Knee\n\n--- PDF PAGE 44 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 40 - \nVARIABLE \nRANGE \n11. Movements/Stroke \n11.1 Spreading \n11.2 Pressing \n11.3 Sliding \n11.4 Circular \n11.5 Tapping \n11.6 Kneading \n11.7 Stretching \n12. Body Position \n12.1 Sitting Position \n12.2 Lying Position \n12.3 Prone Position\n\n--- PDF PAGE 45 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 41 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nChecked and analyzed body condition. \n1.2 \nRequested the un - wearing of personal accessories to \nachieve optimum result. \n1.3 \nEnsured clients comfort and safety in performing the body \nmassage in any position. \n1.4 \nPrepared and used Tools, Supplies and Materials according to \nOHSC requirements. \n1.5 \nApplied appropriate and necessary strokes and movements \nfollowing DOH requirements. \n1.6 \nApplied necessary movements according to prescribed \ndirection. \n1.7 \nObserved timeline according to salon standard. \n1.8 \nAdvise clients on safety precautions after the massage. \n1.9 \nAcknowledged pain or other complains made by the client. \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nDifferent types of Massage \n2.2 \nD.O.H. Rules and Regulations \n2.3 \nOHSC Policies and Procedures \n2.4 \nTimeline \n2.5 \nProtective Clothing \n2.6 \nSalon Policies and Procedures \n2.7 \nClient Relations \n2.8 \nDifferent Body Conditions \n2.9 \nDifferent Massage Products \n2.10 Body Critical Points \n3. Underpinning skills \n3.1 \nObserve personal hygiene \n3.2 \nApply different types of massage \n3.3 \nUse tools and equipment \n3.4 \nUse appropriate strokes / movements \n3.5 \nUse of different massage product \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nLive Model \n4.2 \nSupplies and Materials \n4.3 \nBody Massage Product \n4.4 \nProtective Clothing and Gadget \n4.5 \nSimulated or Actual Workplace \n4.6 \nAppropriate Tools and Equipment \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDirect Observation with Questioning \n5.2 \nDemonstration with Questioning \n6. Context of \nassessment \n6.1  Competency may be assessed in the workplace or accredited \nassessment center.\n",
