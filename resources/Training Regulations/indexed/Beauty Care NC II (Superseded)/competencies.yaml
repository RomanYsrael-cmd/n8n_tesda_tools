        "source_title": "PERFORM PRE AND POST BEAUTY CARE SERVICES",
        "source_text": "--- PDF PAGE 31 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 27 - \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nPERFORM PRE AND POST BEAUTY CARE SERVICES \nUNIT CODE \n: \nHCS515301 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude in performing \npre and post beauty care services. These include in the preparing \nof tools and equipment, preparing the client and performing of \ncorrect storing of tools and equipment and proper disposing of \nwastage from the beauty care service. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare tools and \nequipment \n1.1 \nNecessary tools and equipment are selected, checked and \nprepared for the specific treatment activity. \n1.2 \nAppropriate supplies and materials are prepared according to \nsalon policies and procedures. \n1.3 \nTreatment products are prepared following salon safety \npolicies and procedures. \n1.4 \nWork station / cubicle is thoroughly checked and sanitized. \n2. Prepare the client \n2.1 \nClients’ special personal needs are attended according to \nsalon policies and procedures. \n2.2 \nAppropriate protective clothing materials are provided to \nthe client according to OHSC requirements. \n2.3 \nClients’ safety and comfort is ensured during the entire \nprocess. \n2.4 \nClient is provided with salon amenities following salon \nprocedures. \n2.5 \nIf required by client, other beauty care options are offered \nand advised to the client. \n3. Perform storing of \ntools and equipment \nand disposing of \nwastage \n3.1 \nTools and equipment used are stored according to salon \nsafety policies and procedures. \n3.2 \nUsed treatment products and other chemicals are stored \nfollowing safety and environmental codes and regulations. \n3.3 \nWorkstation is checked, cleaned and sanitized and prepared \nfor succeeding treatment. \n3.4 \nSupplies and materials used are cleaned and stored \naccording to salon policies and procedures. \n3.5 \nWaste materials are segregated, and disposed following \nD.O.H. and local rules and regulations.\n\n--- PDF PAGE 32 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 28 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Clients \n1.1 \nChild \n1.2 \nMen \n1.3 \nWomen \n1.4 \nWorking Group \n1.5 \nTeener \n1.6 \nElderly \n2. Tools \n2.1 \nNail Care Tools \n2.2 \nTowel \n2.3 \nFacial Cleansing Tools \n2.4 \nFacial Treatment Tools \n2.5 \nMirror \n2.6 \nFoot and Hand Treatment Tools \n3. Equipment \n3.1 \nFoot Bath Machine \n3.2 \nFacial Machine \n3.3 \nNail Care Machine \n4. Beauty Care Options \n4.1 \nFacial Treatment \n4.2 \nFoot Spa \n4.3 \nHand Spa \n4.4 \nPedicure \n4.5 \nManicure \n4.6 \nFacial Cleansing \n4.7 \nBody Bleach \n4.8 \nBody Scrub \n4.9 \nBody Massage \n4.10 Make – Up \n4.11 Chair Spot Massage / Half Massage \n4.12 Waxing \n4.13 Ear Cleaning \n5. Protective Clothing \nMaterials  \n5.1 \nDraper \n5.2 \nTowel / Towelette \n5.3 \nSmock Gown \n5.4 \nHeadband for Facial \n6. Waste Segregation \n6.1 \nBiodegradable \n6.2 \nNon - Biodegradable\n\n--- PDF PAGE 33 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 29 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared and stored the tools and equipment according to \nOHSC requirements. \n1.2 \nEnsured clients safety and comfort during the entire process. \n1.3 \nApplied correct techniques in draping, providing of other \nprotective clothing to clients. \n1.4 \nApplied questioning and listening skills in assessing the needs \nof clients. \n1.5 \nDisposed wastage according to environmental rules and \nregulations. \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nSalon Procedures \n2.2 \nSalon Policies \n2.3 \nDifferent Types of Beauty Care Products \n2.4 \nProper Use of Tools, Equipment, Supplies and Materials \n2.5 \nCode of Ethics \n2.6 \nDifferent Types and Condition of Skin \n2.7 \nOHSC Rules and Regulations \n2.8 \nTime Management \n2.9 \nWater Temperature \n2.10 Proper Hygiene \n2.11 Different Beauty Care Services \n3. Underpinning skills \n3.1 \nListening and Questioning Skills \n3.2 \nCorrect Draping Technique \n3.1 \nCorrect Checking \n3.2 \nProper Cleaning and Sanitization Practices \n3.3 \nProper Setting of Tools and Equipment \n3.4 \nCorrect Use of Tools and Equipment \n3.5 \nProper Storage Technique \n3.6 \nClient Relations \n3.7 \nProper Disposal Practices \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nLive model \n4.1 \n Actual work station or simulated workplace \n4.2 \n Supplies and materials \n4.3 \n Tools and Equipment \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n6. Context of \nassessment \n6.1  Competency may be assessed in the workplace or accredited \nassessment center.\n",
