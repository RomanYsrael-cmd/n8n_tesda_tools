          "source_text": "1.  Prepare clients \n \n \n1.1 \nClient is consulted on desired nail service activity and specific \nrequirements. \n1.2 \nClients’ hand nail structure and condition are checked and \nanalyzed. \n1.3 \nClient is provided with protective materials for hygiene \npurposes. \n1.4 \nNail disorder is recognized and if necessary, referred to \nappropriate personnel. \n1.5 \nAppropriate sanitized tools and equipment, supplies and \nmaterials are selected and prepared according to salon \nprocedures. \n1.6 \nClients’ safety and comfort is ensured during the entire \nprocess. \n2.  Clean the finger nails \nand toe nails \n2.1 \nNail polish is completely removed with nail polish remover. \n2.2 \nFingernails are soaked in warm water with soap following \nsalon standards. \n2.3 \nCuticles and dry skins are slightly pushed and completely \nremoved using appropriate tools observing safety precautions. \n2.4 \nNails are trimmed and filed following customer’s desired \nshape and style. \n2.5 \nAntiseptic is applied immediately upon accidental cut is \nincurred. \n3. Apply nail polish \n3.1 \nHands and foot fingernails are massaged following different \nmassage movements according to salon procedure. \n3.2 \nBase coat is applied with long strokes starting with the little \nfinger. \n3.3 \nColor of the nail polish is selected and agreed according to \ncustomer desire or requirements. \n3.4 \nPolish is applied from the base to the edge of the nail using \nlight sweeping stroked around the cuticle. \n3.5 \nTop or seal coat is applied with long strokes in the same \nmanner as the base coat. \n4. Perform final retouch \n4.1 \nOutcome is checked and analyzed against agreed nail service \nresult. \n4.2 \nExcess polish is removed around the cuticle and nail using \nappropriate tools. \n4.3 \nQuick drying agent is applied on each polished nail according \nto salon standard. \n4.4 \nClient is advised on nail maintenance practices.\n\n--- PDF PAGE 35 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 31 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Nail Condition  \n1.1 \nNormal Nail \n1.2 \nAbnormal Nail  \n1.3 \nHang Nail \n2. Nail Disorder \n2.1 \nWavy Ridges - Corrugation \n2.2 \nDepression - Furrous \n2.3 \nWhite Spots - Leuconychia \n2.4 \nHypertrophy - Onychauxis \n2.5 \nWasting Away - Atrophy \n2.6 \nPterygium \n2.7 \nBitten Nails - Onycophay \n2.8 \nBrittle Nails - Onychorrhexis \n3. Shape of Nails \n3.1 \nFlat of Arched - Acora \n3.2 \nRoofed \n3.3 \nTrapezoid \n3.4 \nOlive \n3.5 \nDate \n3.6 \nConcave \n3.7 \nConvex \n3.8 \nSquare \n3.9 \nAngular \n3.10 Narrow \n3.11 Fan \n3.12 Circumflex \n3.13 Arched  \n3.14 Tubular \n4. Different Diseased \n4.1 \nNail \n4.2 \nHand \n4.3 \nFoot \n5. Massage \n5.1 \nPulling \n5.2 \nSliding \n5.3 \nCircular \n5.4 \nStretching \n6. Foot/Hand Condition \n6.1 \nWith Corns \n6.2 \nWith Calluses \n6.3 \nWith Ingrown \n6.4 \nWith Normal Condition \n6.5 \nWith Fungal Infection \n6.6 \nWith Cuts \n6.7 \nWith Wound \n7. Kinds of Nails \n7.1 \nNatural \n7.2 \nSculptured \n7.3 \nArtificial \n7.4 \nEggshell \n7.5 \nBlue \n7.6 \nBruised \n8. Nail Service Activity \n8.1 \nOil Manicure/Pedicure \n8.2 \nLadies Manicure/Pedicure \n8.3 \nMen’s Manicure/Pedicure \n8.4 \nHand / Toe Nail Design (Manual) \n8.5 \nMachine – Based Nail Design\n\n--- PDF PAGE 36 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 32 - \nVARIABLE \nRANGE \n9. Nail Style \n9.1 \nSquare or Rectangular \n9.2 \nRound \n9.3 \nOval \n9.4 \nPointed \n10. Equipment \n10.1 Manicuring Table \n10.2 Adjustable Lamp \n10.3 Clients Chair \n10.4 Manicurist Hair or Stool \n10.5 Supply Tray \n10.6 Finger Bowl \n10.7 Container for Cotton \n10.8 Wet Sanitizer \n10.9 Glass Container \n10.10 Hand Towel \n10.11 Ottoman \n10.12 Low Stool \n10.13 Apron \n10.14 Special Toe Nail Clippers \n11.Implements \n11.1 Orange Wood Sticks \n11.2 Nail File \n11.3 Cuticle Pusher \n11.4 Cuticle Nipper \n11.5 Nail Brush \n11.6 Emery Boards \n11.7 Nail Buffer \n11.8 Fine Camels Hair Brush \n11.9 Tweezers \n11.10 Cuticle Scissors \n12. Supplies/Materials \n12.1 Antiseptic Solution \n12.2 Cotton \n12.3 Foot Powder \n12.4 Foot Lotion \n12.5 Nail Cleansers \n12.6 Nail Polish Remover \n12.7 Cuticle Oil \n12.8 Cuticle Cream \n12.9 Cuticle Remover \n12.10 Nail Bleaches \n12.11 Nail Whiteners \n12.12 Dry Nail Polish \n12.13 Abrasine \n12.14 Liquid Nail Polish \n12.15 Nail Polish Thinner \n12.16 Base Coat \n12.17 Top Coat \n12.18 Nail String Thinner \n12.19 Nail Dryer \n12.20 Alum Solution \n12.21 Hand Cream or Hand Lotion \n12.22 Absorbent Cotton \n12.23 Cleanser \n12.24 Sanitized Towel\n\n--- PDF PAGE 37 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 33 - \nVARIABLE \nRANGE \n12.25 Antiseptic Solution \n12.26 Disinfectant \n12.27 Spatula \n12.28 Mending Tissue \n12.29 Silk \n12.30 Linen \n12.31 Plastic or Liquid Fibers \n12.32 Alcohol \n12.33 Nail Polish\n\n--- PDF PAGE 38 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 34 -"
