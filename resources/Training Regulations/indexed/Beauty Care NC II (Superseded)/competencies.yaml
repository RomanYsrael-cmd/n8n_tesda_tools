          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nApplied salon policies and procedures in performing foot\ntreatment.\n1.2\nApplied of safety rules and regulations during the entire\nprocess.\n1.3\nAnalyzed varied condition of the foot.\n1.4\nChecked, handled and stored appropriate tools, equipment,\nsupplies, materials according to OHSC requirements.\n1.5\nApplied basic foot massage following different prescribed\nmovements.\n1.6\nApplied treatment product as per clients needs following\nmanufacturers instructions and safety practices.\n1.7\nDisplayed the ability to use effective questioning and listening\nskills in consulting and negotiating with clients.\n1.8\nUsed personal protective clothing and gadgets in performing\nthe activity.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFoot Condition\n2.2\nCode of Ethics\n2.3\nOHSC and D.O.H. Rules and Regulations\n2.4\nBasic Foot Massage Procedure\n2.5\nSalon Policies and Procedures\n2.6\nBasic Product Knowledge\n2.7\nTime Management\n3. Underpinning skills\n3.1\nApplying basic massage\n3.2\nApplying proper massage procedure\n3.3\nHandling of tools\n3.4\nHandling client\n3.5\nManaging time\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant Supplies and Materials\n4.2\nLive Model\n4.3\nSimulated or Actual Workplace\n4.4\nTools and Equipment used in the treatment\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2\nDirect Observation with Questioning\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 56 ---\nTR Beauty Care NC II\nPromulgated August 2005\n- 52 -\nUNIT OF COMPETENCY :\nAPPLY FACIAL MAKE-UP\nUNIT CODE\n:"
