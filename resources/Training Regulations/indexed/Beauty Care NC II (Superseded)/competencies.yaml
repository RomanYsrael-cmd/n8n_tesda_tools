        "source_title": "PERFORM HAND SPA",
        "source_text": "--- PDF PAGE 39 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 35 - \nUNIT OF COMPETENCY : \nPERFORM HAND SPA \nUNIT CODE \n: \nHCS515303 \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in performing spa \nfor the hands.  It also involves preparing the client, application of \nhand spa products and performing post hand spa activities. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare client \n1.1 \nCondition of hand and nails are checked and analyzed. \n1.2 \nClients’ safety and comfort is ensured prior start of activity. \n1.3 \nHand is washed with warm water and soap before and after \nscrubbing. \n1.4 \nHand is towel dried and scrubbed with appropriate lotion. \n1.5 \nHand spa machine is set to regulate heat to achieve required \nmelting of wax. \n2. Apply hand treatment 2.1 \nHand spa machine is set to regulate heat to achieve required \nmelting of wax. \n2.2 \nNecessary tools and supplies/materials are prepared and \nused according to OHSC requirements. \n2.3 \nAppropriate temperature is determined and tested by client \nrespective heat tolerance. \n2.4 \nHand is submerged for 4 seconds for 3 consecutive times. \n2.5 \nHand is wrapped with plastic gloves and mittens for client \nrequirements. \n2.6 \nWax is removed from hand according to manufacturer’s \ninstructions. \n2.7 \nHand is applied with hand softening product and massaged \naccording to prescribed procedures. \n3. Perform post hand \nactivity \n3.1 \nWaste products including used wax are disposed according to \nOHSC & DOH requirements. \n3.2 \nTools and equipment are sanitized and stored. \n3.3 \nClient is advised on after service maintenance program. \n3.4 \nWorkstation is cleaned and sanitized for next treatment \nactivity. \n3.5 \nDesired service outcome is confirmed with client and \nrecorded.\n\n--- PDF PAGE 40 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 36 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Hand and Nail \nConditions \n1.1 \nSuper Callous \n1.2 \nNormal \n1.3 \nDry \n2. Tools \n2.1 \nMittens \n2.2 \nTransparent Plastic \n2.3 \nHand Towel \n2.4 \nSmall Basin \n2.5 \nStool \n2.6 \nHand Spa Machine \n3.  Hand Spa Machine \nSetting  \n3.1 \nMelt or Boil \n3.2 \nWarm \n4.  After Service \nMaintenance \nProgram \n4.1 \nFrequent Salon Visit (Twice a Month) \n4.2 \n3-5 Times a day application of lotion. \n5.  Supplies and \nMaterials \n5.1 \nSoftening Lotion \n5.2 \nParaffin Wax \n5.3 \nSoap \n5.4 \nScrub Lotion \n5.5 \nLiniment Oil \n5.6 \nAromatherapy Oil \n5.7 \nOlive Oil \n5.8 \nCling Wrap \n5.9 \nRubbing Alcohol\n\n--- PDF PAGE 41 ---\nTR Beauty Care NC II \nPromulgated August 2005 \n- 37 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nChecked and analyzed hand and nail conditions. \n1.2 \nPerformed standard procedure in washing, scrubbing and \nmassaging of hands. \n1.3 \nFollowed safety rules in setting and handling, cleaning and \nstoring of tools and equipment. \n1.4 \nApplied salon policies and procedures and industry codes of \npractice in application of hand and nail treatment. \n1.5 \nConsistently used effective questioning and listening \ntechniques in ensuring client safety and comfort through out \nthe service. \n1.6 \nProperly set spa machine to appropriate temperature. \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nHand Analysis \n2.2 \nCode of Ethics \n2.3 \nD.O.H. and OHSC Regulations \n2.4 \nSalon Practice and Procedures \n2.5 \nDifferent Hand Treatments \n2.6 \nDifferent Hand Conditions \n3. Underpinning skills \n3.1 \nApply Standard Procedures \n3.2 \nSetting of Tools and Equipment \n3.3 \nProper Handling, Cleaning and Storing of Tools and \nEquipment \n3.4 \nEffective Questioning and Listening Skills \n3.5 \nSelection of Treatment Product \n3.6 \nTime Management. \n3.7 \nScrubbing, Massaging Technique \n3.8 \nClient Relations \n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nLive Model \n4.2 \nSupplies and materials \n4.3 \nActual or simulated work station  \n4.4 \nTools and equipment \n4.5 \nProtective clothing and gadgets \n5.  Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDemonstration with questioning. \n5.2 \nDirect observation with questioning \n6.  Context of \nassessment \n6.1  Competency may be assessed in the workplace or accredited \nassessment center.\n",
