  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of Commercial Refrigeration Installation\nand Servicing NC III, the candidate must demonstrate competence covering\nall the units listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.1.2 The qualification of Commercial Refrigeration Installation and Servicing\nNC III can be attained through demonstration of competence through project-\ntype assessment covering all the units required in the qualification.\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.1.4 The following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduates of WTR-registered program, NTR-registered programs\nor formal/non-formal/informal including enterprise-based trainings\nrelated to RAC installation and servicing\n\n4.1.4.2 Experienced Workers in RAC servicing for at least 2 years (wage\nemployed or self-employed)\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through previous work or life experiences, education, and\ninformal training related to all the core competencies may apply for\nrecognition in the qualification through Portfolio Assessment in accordance\nwith the provision of TESDA Circular No. 59, Series of 2020.\n\n4.1.6 The Existing National Certificate (NC) and Certificate of Competency (COC)\nof individuals in RAC Servicing (PACU-CRE) NCIII will still be in effect until\nsuch time that such NC and COC will have expired. Individuals are advised to\ntake the assessment for this amended/updated TR on or before the expiration\nof such certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\n\n--- PDF PAGE 128 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n\n124\nImplementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)\".\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment of candidates for national\ncertification.\n\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited\nby TESDA is authorized to assess the competencies of candidates for\nnational certification.\n\n--- PDF PAGE 129 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n\n125\nCOMPETENCY MAP - HVAC/R Sector\nCommercial Refrigeration Installation and Servicing NC III\n\nCORE COMPETENCIES\n\nInstall window- type AC/\ndomestic refrigeration units\nService & maintain window-type\nAC/ domestic refrigeration units\nTroubleshoot window-type\nAC/domestic refrigeration\nsystems\nRecover & recycle refrigerant\nin window-type AC/domestic\nrefrigeration systems\nRepair & retrofit window-type\nAC/ domestic refrigeration\nsystems\nPerform Testing and\ncommissioning for window-\ntype AC/domestic refrigeration\nInstall package-type air-conditioning\nunit (PACU) / commercial\nrefrigeration equipment (CRE)\nInstall PACU/CRE electrical\nsystems\nInstall PACU/CRE piping\nsystems\nService & maintain PACU/CRE\nunits\nSurvey site for installation\nTroubleshoot PACU/CRE n systems\nRecover / recycle refrigerant\nin PACU/ CRE systems\nRepair & retrofit PACU/CRE\nsystems & its accessories\nPerform start-up, testing and\ncommissioning for PACU/CRE\nInstall transport air-\nconditioning\n& refrigeration units\nService & maintain transport AC\n& refrigeration units\nRecover & recycle\nrefrigerant in transport AC &\nrefrigeration systems\nTroubleshoot transport air-\nconditioning & refrigeration\nsystems\nPerform testing &\ncommissioning for transport AC\n& refrigeration\nInstall package-type air-\nconditioning unit (PACU)\nService & maintain PACU\nTroubleshoot and repair\nPACU\nPerform start-up, test and\ncommissioning for PACU\nService & maintain mobile air-\nconditioning (MAC) units\nInstall commercial\nrefrigeration equipment\n(CRE)\nService & maintain CRE\nTroubleshoot and repair\nCRE\nPerform start-up, test and\ncommissioning for CRE\nTroubleshoot & repair mobile\nair-conditioning systems\nInstall commercial air-\nconditioning unit (CACU)\nService & maintain CACU\nTroubleshoot and repair\nCACU\nPerform start-up, testing and\ncommissioning for CACU\nPerform start-up, test and\ncommissioning for mobile air-\nconditioning systems\nRepair & retrofit transport ac &\nrefrigeration systems & its\naccessories\nInstall domestic refrigeration and\nair-conditioning units\nService & maintain domestic\nrefrigeration and air-\nconditioning units\nTroubleshoot & repair\ndomestic refrigeration and\nair-conditioning units\n\nCOMMON COMPETENCIES\n\nPrepare materials and\ntools\nObserve procedures,\nspecifications & manuals of instructions\nPerform mensurations &\ncalculations\nPerform basic benchwork\nPerform basic electrical\nworks\nMaintain tools and\nequipment\nPerform housekeeping and safety\npractices\nDocument work\naccomplished\nInterpret technical\ndrawings and plans\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace\ncommunication\nUtilize specialized communication\nskill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher order thinking\nprocesses and apply techniques\nin the workplace\nEvaluate higher order thinking\nskills and adjust problem solving\ntechniques\nEnhance self-management\nskills\nDevelop career and life\ndecisions\nWork in a diverse environment\nContribute to the practice of social\njustice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport Innovation\nContribute to workplace\ninnovation\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into work\nprocedures\nAccess and maintain\ninformation\nPresent relevant\ninformation\nUse information systematically\nManage and evaluate usage of\ninformation\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety\nand health policies and\nprocedures\nPractice occupational safety\nand health policies and\nprocedures\nEvaluate occupational safety\nand health work practices\nLead in improvement of\nOccupational Safety and Health\nProgram, Policies and Procedures\nManage implementation of\noccupational safety and health\nprograms in the workplace\nApply environmental work\nstandards\nExercise efficient and\neffective sustainable\npractices in the workplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial\nmindset in the workplace\nPractice entrepreneurial\nskills in the workplace\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\nDevelop and sustain a high-\nperforming enterprise\n\nANNEX A\n\n--- PDF PAGE 130 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n\n126\nGLOSSARY OF TERMS:\n\n1)\nAir Cooled Condensing Unit (ACCU)/Outdoor Unit – an equipment that condenses\nrefrigerant vapor using air as the condensing medium. It consists of compressor,\ncondenser coil and fan motor\n\n2)\nAir Cooled Condenser – an equipment that condenses refrigerant vapor using air as\nthe condensing medium\n\n3)\nAir Handling Unit (AHU)/Indoor Unit – an air-conditioning component that consists\nof a fan motor and an evaporator coil. It is this equipment used in air-conditioning that\nabsorbs heat from the space\n\n4)\nAir Distribution – the process of distributing conditioned air into a confined space\n\n5)\nCheck – to verify, inspect, or test an HVAC/R component for satisfactory condition\nwith the use of an instrument or a device\n\n6)\nCommercial Refrigeration - covers water coolers/ display coolers, vendo machine,\nbeverage machine icedrop/ice cream/ice cube vending machines\n\n7)\nCommissioning - process by which an equipment, facility, or plant (which is installed, or\nis complete or near completion) is tested to verify if it functions according to its design\nobjectives or specifications.\n\n8)\nDehydration – the process of removing moisture from a refrigeration system\n\n9)\nElectric Heat Defrost – use of electric resistance heating coils to melt ice or frost\nfrom evaporators\n\n10) Evacuation – removal of air/any gas and moisture from a refrigeration system\n\n11) Evaporator – the component in a refrigeration system where liquid refrigerant is\nchanged into a vapor by the absorption of heat\n\n12) Fan – a mechanical device for moving air\n\n13) Fan Coil Unit (FCU) – an air-conditioning component that consists of a fan motor\nand an evaporator coil\n\n14) Filter Drier – the component part used in air-conditioning or refrigeration system\nto filter and dehydrates refrigerant in the system\n\n15) Hot Gas Defrost – component part used to remove frosting on the evaporator\ncoil using hot gas refrigerant from the compressor\n\n16) Idler Pulley – a pulley used to maintain proper belt tension\n\n--- PDF PAGE 131 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n\n127\n17) Inspect – determine the actual condition of HVAC/R component without the use of\ninstrument\n\n18) Interlocking – it is the action of interconnecting electric control wires to achieve a\nsequential action\n\n19) Leak Test – the procedure of determining/pin pointing leaks in a pressurized system\n\n20) Liquid Line Solenoid Valve – electrically operated valve that shuts-off the flow of the\nrefrigerant to the evaporator\n\n21) Metering Device – it is one of the major components in a refrigeration system used to\nregulate the flow of refrigerant into the evaporator\n\n22) Package Air-conditioning Unit (PACU)– an air-conditioning unit that contains the\ncompressor, water-cooled condenser, metering device and evaporator all of which is\nin one casing.\n\n23) Pull-out – to remove from a place of installation\n\n24) Pressure Test – a procedure whereby pressure is applied to the piping system, the\npurpose of which is to determine its soundness and stability\n\n25) Pump down – a process of using the compressor to pump and contain all the\nrefrigerant charge into the condenser and/or receiver\n\n26) Refrigerant Charging – the process of introducing into the system the proper amount\nof refrigerant\n\n27) Retrofitting – a process of upgrading existing equipment or system using ozone\ndepleting substances to environmentally friendly refrigerant\n\n28) Service Mechanic – worker who possess basic skills related to HVAC/R system\n\n29) Sight Glass/Liquid Line Moisture Indicator – indicates refrigerant quality and\ncharge\n\n30) Split-type Air-conditioner – an air conditioning system that comes in two pieces: one\npiece contains the compressor, condenser, and a fan; the other unit contains the\nevaporator and a fan. The condenser, installed outside the house, connects to several\nevaporators, one in each room to be cooled, mounted inside the house. Each\nevaporator is individually controlled, allowing different rooms or zones to be cooled to\nvarying degrees.\n\n31) Supervised Industry Learning – similar to on-the-job training – an approach in\ntraining designed to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations. Likewise, the term Supervised Industry Learning or SIL in\nreplacement of the term Supervised Industry Training (SIT) or On-the-Job Training\n(OJT) to provide more focus on the process of absorbing and retaining learner's\n\n--- PDF PAGE 132 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n\n128\nenhanced competencies in a workplace and thus enable the learner to practice those\ncompetencies in a variety of workplace situation\n\n32) Thermostat Expansion Valve (TXV) – a refrigerant control valve connected before\nan evaporator that regulates flow of refrigerant. Operated by temperature and\npressure, and reacts to the degree of gas superheat at the evaporator outlet through a\nfeeler bulb\n\n33) Transport Air-conditioning Unit – refers to an air-conditioning unit driven directly\nfrom the turning axle of the vehicle when they are in motion, or by the vehicle engine\nitself, or by a separate gasoline/diesel engine and/or electric motor mounted on the\nsame vehicle. It covers the land and marine/sea transports.\n\n34) Troubleshoot – the process of analyzing system defect or malfunction\n\n35) Vacuum – pressure lower than atmospheric pressure measured in inches of mercury.\nComplete vacuum is 29.92 in. mercury or at least 500 microns\n\n36) Water Treatment – the use of chemicals in water to prevent corrosion, formation of\nscales, algae growth and formation of slime\n\n37) Window Type Air-conditioning Unit – is a self-contained air-conditioning unit house\nin a single casing mounted in a wall or window opening\n\n38) Workmanlike-manner – quality of work within the accepted industry standard\n\n--- PDF PAGE 133 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n\n129\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nFOR THE REVISION STAGE\n\n• THE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL – FY 2019\n\nMR. MANUEL P. AZUCENA\nRACTAP\nMR. EDUARDO M. FERNANDEZ\nRACTAP/ PSVARE / TUP–Manila\n\nMR. RAMON ELIAS F. ORTIZ\nRACTAP\n\nMR. AUGUSTO T. QUITCO\nRACTAP/ Koppel Industries\n\nMR. KRIZ S. BERNARDINO\nRACTAP/PSVARE/KSB HVAC-R Services\nMR. LAMBERTO B. BALDOVINO\nILAC HVAC-R Services\n\n• THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING