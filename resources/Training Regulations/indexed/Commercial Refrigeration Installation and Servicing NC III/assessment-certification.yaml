      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of Commercial Refrigeration Installation and Servicing NC III, the candidate must demonstrate competence covering all the units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The qualification of Commercial Refrigeration Installation and Servicing NC III can be attained through demonstration of competence through project- type assessment covering all the units required in the qualification. 4.1.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 The following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to RAC installation and servicing 4.1.4.2 Experienced Workers in RAC servicing for at least 2 years (wage employed or self-employed) 4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through previous work or life experiences, education, and informal training related to all the core competencies may apply for recognition in the qualification through Portfolio Assessment in accordance with the provision of TESDA Circular No. 59, Series of 2020. 4.1.6 The Existing National Certificate (NC) and Certificate of Competency (COC) of individuals in RAC Servicing (PACU-CRE) NCIII will still be in effect until such time that such NC and COC will have expired. Individuals are advised to take the assessment for this amended/updated TR on or before the expiration of such certificates. 4.1.7 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Commercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021"
    },
