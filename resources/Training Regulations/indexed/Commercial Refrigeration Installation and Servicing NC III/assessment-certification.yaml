ty and health policies and procedures Practice occupational safety and health policies and procedures Evaluate occupational safety and health work practices Lead in improvement of Occupational Safety and Health Program, Policies and Procedures Manage implementation of occupational safety and health programs in the workplace Apply environmental work standards Exercise efficient and effective sustainable practices in the workplace Evaluate environmental work practices Lead towards improvement of environmental work programs, policies and procedures Manage implementation of environmental programs in the workplace Adopt entrepreneurial mindset in the workplace Practice entrepreneurial skills in the workplace Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs) Sustain entrepreneurial skills Develop and sustain a high- performing enterprise --- PDF PAGE 130 --- Commercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021 126 GLOSSARY OF TERMS: 1) Air Cooled Condensing Unit (ACCU)/Outdoor Unit – an equipment that condenses refrigerant vapor using air as the condensing medium. It consists of compressor, condenser coil and fan motor 2) Air Cooled Condenser – an equipment that condenses refrigerant vapor using air as the condensing medium 3) Air Handling Unit (AHU)/Indoor Unit – an air-conditioning component that consists of a fan motor and an evaporator coil. It is this equipment used in air-conditioning that absorbs heat from the space 4) Air Distribution – the process of distributing conditioned air into a confined space 5) Check – to verify, inspect, or test an HVAC/R component for satisfactory condition with the use of an instrument or a device 6) Commercial Refrigeration - covers water coolers/ display coolers, vendo machine, beverage machine icedrop/ice cream/ice cube vending machines 7) Commissioning - process by which an equipment, facility, or plant (which is installed, or is complete or near completion) is tested to verify if it functions according to its design objectives or specifications. 8) Dehydration – the process of removing moisture from a refrigeration system 9) Electric Heat Defrost – use of electric resistance heating coils to melt ice or frost from evaporators"
