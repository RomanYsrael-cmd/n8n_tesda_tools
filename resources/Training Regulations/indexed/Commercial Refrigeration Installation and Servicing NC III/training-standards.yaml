    "source_text": "SECTION 3. - TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Commercial Refrigeration Installation and Servicing NC III.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude green technology, issues on health and drugs and catering to persons with\ndisabilities (PWD’s) to accompany their curricula.\n\nCourse Title\n:\nCommercial Refrigeration Installation and Servicing\nPQF\n\n:\nNC III\nNominal Training\n\n 40 Hours (Basic)\nDuration: 40 Hours (Common)\n\n 240 Hours (Core) [inclusive of SIL]*\n ----------------------------------------------------\n\n 320 Hours – Total\n\n 400 Hours – Supervised Industry Learning (SIL)\n\n ----------------------------------------------------\n 720 Hours - Total training duration\n______\n* SIL can be delivered thru Dual Training System (DTS)/Dualized Training Program (DTP) or\nEnterprise-based Training\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitudes applicable in installing, servicing and maintaining, troubleshooting and\nrepairing including starting-up, testing and commissioning commercial refrigeration\nequipment. This includes classroom learning activities and practical work in actual\nwork site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 91 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n\n87\nBASIC COMPETENCIES\n(40 hrs)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead\nworkplace\ncommunication\n1.1. Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication methods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for written\nand electronic communication methods\n• Follow organization requirements for the use\nof written and electronic communication\nmethods\n• Perform exercises on understanding and\nconveying intended meaning scenario\n• Lecture\n• Demonstration\n• Practical exercises\n• Role Play\n• Written Test\n• Observation\n2 hours\n1.2. Lead workplace\ndiscussions\n• Describe:\no Organizational policy on production, quality\nand safety\no Goals/ objectives and action plan setting\n• Read\no Effective verbal communication methods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 hours\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing with issues\nand problems\n• Read\no Effective verbal communication methods\n• Group discussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 hours\n2. Lead small\nteams\n2.1. Provide team\nleadership\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational leadership\n• Role play on situational leadership\n• Group work\n• Role Play\n• Lecture/ Discussion\n• Individual Work\n• Role Play\n• Written Test\n1 Hour\n\n--- PDF PAGE 92 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgat