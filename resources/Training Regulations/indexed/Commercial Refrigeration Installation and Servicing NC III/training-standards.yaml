      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude green technology, issues on health and drugs and catering to persons with\ndisabilities (PWD’s) to accompany their curricula.\n\nCourse Title\n:\nCommercial Refrigeration Installation and Servicing\nPQF\n\n:\nNC III\nNominal Training\n\n 40 Hours (Basic)\nDuration: 40 Hours (Common)\n\n 240 Hours (Core) [inclusive of SIL]*\n ----------------------------------------------------\n\n 320 Hours – Total\n\n 400 Hours – Supervised Industry Learning (SIL)\n\n ----------------------------------------------------\n 720 Hours - Total training duration\n______\n* SIL can be delivered thru Dual Training System (DTS)/Dualized Training Program (DTP) or\nEnterprise-based Training\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitudes applicable in installing, servicing and maintaining, troubleshooting and\nrepairing including starting-up, testing and commissioning commercial refrigeration\nequipment. This includes classroom learning activities and practical work in actual\nwork site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 91 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n\n87\nBASIC COMPETENCIES\n(40 hrs)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activiti