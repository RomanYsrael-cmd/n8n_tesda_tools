        "source_text": "400311323\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto assess general obstacles in the application of learning and\ninnovation in the organization and to propose practical\nmethods of such in addressing organizational challenges.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Assess work\nprocedures,\nprocesses\nand systems\nin terms of\ninnovative\npractices\n1.1. Reasons for innovation are\nincorporated to work\nprocedures.\n1.2. Models of innovation are\nresearched.\n1.3. Gaps or barriers to\ninnovation in one’s work\narea are analyzed.\n1.4. Staff who can support and\nfoster innovation in the\nwork procedure are\nidentified.\n1.1 Seven habits of highly\neffective people.\n1.2 Character strengths\nthat foster innovation\nand learning\n(Christopher Peterson\nand Martin Seligman,\n2004)\n1.3 Five minds of the\nfuture concepts\n(Gardner, 2007).\n1.4 Adaptation concepts in\nneuroscience\n(Merzenich, 2013).\n1.5 Transtheoretical\nmodel of behavior\nchange (Prochaska,\nDiClemente, &\nNorcross, 1992).\n1.1 Demonstrating\ncollaboration\nand networking\nskills.\n1.2 Applying basic\nresearch and\nevaluation skills\n1.3 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n2. Generate\npractical\naction plans\nfor improving\nwork\nprocedures,\nprocesses\n2.1 Ideas for innovative work\nprocedure to foster\ninnovation using individual\nand group techniques are\nconceptualized\n2.2 Range of ideas with other\nteam members and\ncolleagues are evaluated\nand discussed\n2.3 Work procedures and\nprocesses subject to change\nare selected based on\nworkplace requirements\n(feasible and innovative).\n2.4 Practical action plans are\nproposed to facilitate simple\nchanges in the work\nprocedures, processes and\nsystems.\n2.5 Critical inquiry is applied\nand used to facilitate\ndiscourse on adjustments in\nthe simple work procedures,\nprocesses and systems.\n2.1 Seven habits of\nhighly effective\npeople.\n2.2 Character strengths\nthat foster innovation\nand learning\n(Christopher\nPeterson and Martin\nSeligman, 2004)\n2.3 Five minds of the\nfuture concepts\n(Gardner, 2007).\n2.4 Adaptation concepts\nin neuroscience\n(Merzenich, 2013).\n2.5 Transtheoretical\nmodel of behavior\nchange (Prochaska,\nDiClemente, &\nNorcross, 1992).\n2.1 Assessing\nreadiness for\nchange on\nsimple work\nprocedures,\nprocesses and\nsystems.\n2.2 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n2.3 Facilitating\naction plans on\nhow to apply\ninnovative\nprocedures in\nthe organization.\n\n--- PDF PAGE 21 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n17\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Evaluate the\neffectiveness\nof the\nproposed\naction plans\n3.1 Work structure is analyzed\nto identify the impact of the\nnew work procedures\n3.2 Co-workers/key personnel\nis consulted to know who\nwill be involved with or\naffected by the work\nprocedure\n3.3 Work instruction\noperational plan of the new\nwork procedure is\ndeveloped and evaluated.\n3.4 Feedback and suggestion\nare recorded.\n3.5 Operational plan is\nupdated.\n3.6 Results and impact on the\ndeveloped work\ninstructions are reviewed\n3.7 Results of the new work\nprocedure are evaluated\n3.8 Adjustments are\nrecommended based on\nresults gathered\n3.1 Five minds of the\nfuture concepts\n(Gardner, 2007).\n3.2 Adaptation concepts\nin neuroscience\n(Merzenich, 2013).\n3.3 Transtheoretical\nmodel of behavior\nchange (Prochaska,\nDiClemente, &\nNorcross, 1992).\n3.1 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems\nthrough\ninnovation.\n3.2 Facilitating\naction plans on\nhow to apply\ninnovative\nprocedures in\nthe\norganization.\n3.3 Communicating\nresults of the\nevaluation of\nthe proposed\nand\nimplemented\nchanges in the\nworkplace\nprocedures and\nsystems.\n3.4 Developing\naction plans for\ncontinuous\nimprovement on\nthe basic\nsystems,\nprocesses and\nprocedures in\nthe\norganization.\n\n--- PDF PAGE 22 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n18\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Reasons\nMay include:\n1.1. Strengths and weaknesses of the current\nsystems, processes and procedures.\n1.2. Opportunities and threats of the current\nsystems, processes and procedures.\n2. Models of innovation\nMay include:\n2.1. Seven habits of highly effective people.\n2.2. Five minds of the future concepts (Gardner,\n2007).\n2.3. Neuroplasticity and adaptation strategies.\n3. Workplace\nrequirements\nMay include:\n3.1. Feasible\n3.2. Innovative\n4. Gaps or barriers\nMay include:\n4.1. Machine\n4.2. Manpower\n4.3. Methods\n4.4. Money\n5. Critical Inquiry\nMay include:\n5.1. Preparation.\n5.2. Discussion.\n5.3. Clarification of goals.\n5.4. Negotiate towards a Win-Win outcome.\n5.5. Agreement.\n5.6. Implementation of a course of action.\n5.7. Effective verbal communication. See our pages:\nVerbal Communication and Effective Speaking.\n5.8. Listening.\n5.9. Reducing misunderstandings is a key part of\neffective negotiation.\n5.10. Rapport Building.\n5.11. Problem Solving.\n5.12. Decision Making.\n5.13. Assertiveness.\n5.14. Dealing with Difficult Situations.\n\n--- PDF PAGE 23 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n19\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nEstablished the reasons why innovative systems are\nrequired\n1.2\nEstablished the goals of a new innovative system\n1.3\nAnalyzed current organizational systems to identify\ngaps and barriers to innovation.\n1.4\nAssessed work procedures, processes and systems\nin terms of innovative practices.\n1.5\nGenerated practical action plans for improving work\nprocedures, and processes.\n1.6\nReviewed the trial innovative work system and\nadjusted reflect evaluation feedback, knowledge\nmanagement systems and future planning.\n1.7\nEvaluated the effectiveness of the proposed action\nplans.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Psychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party\nworkplace reports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character strengths and\nvirtues applied.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions.\n\n--- PDF PAGE 24 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n20\n\nUNIT OF COMPETENCY: USE INFORMATION SYSTEMATICALLY\n\nUNIT CODE :"
