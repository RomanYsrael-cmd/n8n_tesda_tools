        "source_text": "HVC311205\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nchecking condition, performing preventive maintenance and\nstoring of tools, instruments and equipment based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check\ncondition of\ntools,\ninstruments\nand\nequipment\n\n1.1. Materials, tools, instruments\nand equipment are identified\naccording to classification and\njob requirements\n1.2. Non-functional tools, instruments\nand equipment are segregated\nand labeled according to\nclassification\n1.3. Safety of tools, instruments and\nequipment are observed in\naccordance with manufacturer's\ninstructions\n1.4. Condition of PPE are checked in\naccordance with manufacturer's\ninstructions\n1.1. Safety Practices\no Use of PPE\no Handling of tools\nand equipment\no Good housekeeping\n1.2. Materials, Tools,\ninstruments and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\no Types and uses of\nHVAC/R tools\no Types and uses of\nHVAC/R instruments\no Types and uses of\nHVAC/R equipment\n1.3. Operational conditions\nof HVAC/R tools,\ninstrument and\nequipment\n1.4. HVAC/R tools,\ninstrument and\nequipment defects\n1.1. Maintaining\ntools,\ninstruments\nand\nequipment\n1.2. Handling of\ntools,\ninstruments\nand\nequipment\n1.3. Identifying\ntools,\ninstruments\nand\nequipment\ndefects\n2. Perform basic\npreventive\nmaintenance\n2.1. Appropriate lubricants are\nidentified according to types of\nequipment\n2.2. Tools and equipment are\nlubricated according to\npreventive maintenance\nschedule or manufacturer's\nspecifications\n2.3. Measuring instruments are\nchecked and calibrated in\naccordance with manufacturer’s\ninstructions\n2.4. Tools are cleaned and lubricated\naccording to standard\nprocedures\n2.5. Defective instruments,\nequipment and accessories are\ninspected and replaced\naccording to manufacturer’s\nspecifications\n2.1. Safety Practices\no Use of PPE\no Handling of tools,\ninstruments and\nequipment\no Good housekeeping\n2.2. Materials, Tools and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\n2.3. Preventive\nMaintenance\no Methods and\ntechniques\no Procedures\n\n2.1. Handling of\ntools,\ninstruments\nand\nequipment\n2.2. Performing\npreventive\nmaintenance\n\n--- PDF PAGE 56 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n52\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.6. Tools are inspected, repaired\nand replaced every after use\n2.7. Work place are cleaned and in\nsafe state in line with OHSA\nregulations\n3. Store tools,\ninstruments\nand\nequipment\n\n3.1. Inventory of tools, instruments\nand equipment are conducted\nand recorded as per company\npractices\n3.2. Tools, instruments and\nequipment are stored safely in\nappropriate locations in\naccordance with manufacturer's\nspecifications or company\nprocedures\n\n3.1. Safety Practices\no Use of PPE\no Handling of tools,\ninstruments and\nequipment\no Storing procedures\nand techniques\no Storage conditions/\nlocations\n\n3.1. Storing tools,\ninstruments\nand\nequipment\n3.2. Handling of\ntools,\ninstruments\nand\nequipment\n\n--- PDF PAGE 57 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n53\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1. Lubricants\n1.2. Cleaning materials\n1.3. Rust remover\n1.4. Rugs\n1.5. Spare parts\n\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\n-\nCutting tools - hacksaw, crosscut saw, rip saw\n-\nBoring tools - auger, brace, grinlet, hand drill\n-\nHolding tools - vise grip, C-clamp, bench vise\n-\nThreading tools - die and stock, taps\n\n2.2 Measuring instruments/Equipment\n\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n\n4. Forms\n4.1. Maintenance schedule forms\n4.2. Requisition Slip\n4.3. Inventory Form Slip\n4.4. Inspection Form Slip\n4.5. Procedures\n\n--- PDF PAGE 58 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n54\n\nEVIDENCE GUIDE\n\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1. Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2. Identified functional and non-functional tools and equipment\n1.3. Checked, lubricated and calibrated tools, equipment and\n instruments according to manufacturer’s specifications\n1.4. Replaced defective tools, equipment and its accessories\n1.5. Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6. Prepared and submitted inventory report, where applicable\n1.7. Maintained work place in accordance with OHSA regulations\n1.8. Stored tools and equipment safely in appropriate locations\nand in accordance with company practices\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Work place\n2.2 Maintenance Schedule\n2.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct observation\n3.2 Written test/questioning relevant to required knowledge\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n4.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 59 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n55\n\nUNIT OF COMPETENCY : PERFORM HOUSEKEEPING AND SAFETY\n PRACTICES FOR RAC SERVICING\n\n UNIT CODE\n :"
