cial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n72 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work instructions \nMay include: \n1.1 Work permits \n1.2 Job orders \n1.3 Blueprints \n2. Abnormal conditions \nMay include: \n2.1 leaks \n2.2 insulation cracks \n2.3 looseness of supports/brackets \n3. Operation/Controls/Settings \nMay include: \n3.1 Pressures \n3.2 Temperatures \n3.3 Voltages \n3.4 Current draws \n3.5 Air flow \n3.6 Noise level \n3.7 Vibrations \n4. Refrigeration accessories \n \n \nMay include: \n4.1 Pressure switch \n4.2 Temperature control \n4.3 Pulley alignment/belt tension \n4.4 Unloader \n4.5 Fan blades/blower \n4.6 Fan motors \n4.7 Filter/Driers \n4.8 Sight glass \n4.9 Defrost heaters \n4.10 Timers and relays \n4.11 Drain line heaters \n4.12 Crankcase heaters \n4.13 Evaporator pressure regulators \n4.14 Solenoid valves \n4.15 Suction/discharge service valves \n4.16 Accumulators \n4.17 Oil separators \n5. Oil parameters \nMay include: \n5.1 Oil levels \n5.2 Oil properties \n5.3 Purity of oil \n5.4 Oil viscosity \n6. Operating parameters \nMay include: \n6.1 Operating temperature \n6.2 Superheat \n6.3 Pressure  \n6.4 Voltage  \n6.5 Current  \n6.6 Air velocity\n\n--- PDF PAGE 77 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n73 \n \nVARIABLE \nRANGE \n7. Refrigeration components \n \n \nMay include: \n7.1 Refrigerant flow controls \n7.2 Evaporator  \n7.3 Compressor  \n7.4 Condenser \n8. Consumables \nMay include: \n8.1 Oil \n8.2 Refrigerant \n8.3 V-belts \n9.  Air distribution system \n \n \nMay include: \n9.1 Grilles \n9.2 Louvers \n9.3 Evaporator blower\n\n--- PDF PAGE 78 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n74 \n \nEVIDENCE GUIDE \n \n1 Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Prepared for maintenance activities. \n1.2 Checked and adjusted refrigeration equipment accessories, \ncontrols and operating conditions \n1.3 Applied maintenance procedures according to \nmanufacturer’s maintenance manual. \n1.4 Checked and maintained lubrication system in CRE. \n1.5 Checked and maintained refrigeration system in CRE. \n1.6 Checked and maintained air distribution system in CRE. \n1.7 Communicated interactively with others where applicable to \nensure safe and effective work operations \n \n2 Resource \nImplications \nThe following resources should be provided: \n2.1 Work place location \n2.2 Tools and equipment appropriate to maintaining \ncommercial refrigeration equipment processes \n2.3 Materials relevant to the activity \n2.4 Drawings and specifications relevant to the task \n \n3 Methods of  \nAssessment \nCompetency must be assessed through: \n3.1 Direct observation /demonstration with oral questioning \n3.2  Written test \n3.3  Portfolio with interview \n \n4 Context for \nAssessment \n4.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n",
