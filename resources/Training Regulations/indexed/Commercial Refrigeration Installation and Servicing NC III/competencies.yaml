rankcase heaters \n2.2.13. Evaporator pressure regulators \n2.2.14. Solenoid valves \n2.2.15. Suction/discharge service valves \n2.2.16. Accumulators \n2.2.17. Oil separators \n3. Faults/problems in \ndiagnosing \nMay include: \n3.1 \nLeakage \n3.2 \nContamination \n3.3 \nFractionation  \n3.4 \nRestriction  \n \n4. Manufacturer's \nrecommendations \nIncludes but not limited to: \n4.1. Equipment operator's manual \n4.2. Equipment service manual \n4.2.1. Error codes \n4.2.2. Troubleshooting guide \n4.3. Nameplate data\n\n--- PDF PAGE 84 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n80 \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Interpreted appropriate wiring diagrams, charts and \nmanuals. \n1.2 Checked power supply in compliance with nameplate rating \nand/or manufacturer’s standard \n1.3 Tested refrigerant system components as per standard \nprocedures \n1.4 Diagnosed and repaired faults/problems. \n1.5 Demonstrated compliance with safety regulations applicable \nto worksite operations \n1.6 Performed refrigerant recovery/recycling accordingly. \n1.7 Test run air-conditioning unit in line with manufacturer’s \ninstruction.  \n1.8 Communicated Interactively others where applicable to \nensure safe and effective work operations \n \n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1  Work place location \n4.2  Tools and equipment appropriate to troubleshooting \nrefrigerant system \n4.3  Materials relevant to the proposed activity \n4.4  Drawings and specifications relevant to the task \n \n5.  Methods of \nAssessment \nCompetency must be assessed through: \n5.1  Direct observation / demonstration with oral questioning \n5.2  Written test \n5.3  Portfolio with interview \n \n6.  Context for \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting\n",
