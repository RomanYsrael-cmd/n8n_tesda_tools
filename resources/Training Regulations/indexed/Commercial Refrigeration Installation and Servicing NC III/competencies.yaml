        "source_text": "--- PDF PAGE 72 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n68 \n \nUNIT OF COMPETENCY:  SERVICE AND MAINTAIN COMMERCIAL  \nREFRIGERATION EQUIPMENT (CRE)  \n \nUNIT CODE \n \n      :  HVC723343 \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes in   \nservicing and maintaining refrigeration system, components \nand accessories including lubrication and air-distribution \nsystems in commercial refrigeration equipment (CRE). \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Prepare for \nservice and \nmaintenance \nactivities \n1.1. Work instructions are \nread interpreted to \ndetermine job \nrequirements \n1.2. Appropriate \nmanufacturer's manual is \nconsulted if available; \notherwise, RAC Code of \nPractice and/or \nenterprise maintenance \npolicy procedures are \nadopted. \n1.3. Tools and equipment are \nselected in accordance \nwith job requirements \n1.4. Work safety is observed \naccording to enterprise \nregulations \n1.1. Protective personal \nequipment/ safety gear \n1.2. Safety hazards \n1.3. Handling of tools and \nequipment and \naccessories \n1.4. Safety signs and \nsymbols \n1.5. Good housekeeping \n1.6. Proper use and care of \ntools needed \n1.7. Types of refrigerant \n1.8. Types of coil cleaner \n1.9. Types of fins and \nmaterials use \n1.10. Plan specification \n1.11. Electrical wiring \ndiagram \n1.12. Electrical plans, \nsymbols and \nabbreviations \n1.1. Interpreting \nplans and details \n1.2. Preparing \nmaterials \n2. Check and \nadjust \ncommercial \nrefrigeration \nequipment \n(CRE) \naccessories, \ncontrols and \noperating \nconditions \n2.1. Maintenance procedures \nare applied according to \nmanufacturer's \nmaintenance manual \n2.2. Evaporator/condenser \ncoils are cleaned in \naccordance with \nmanufacturer's \nmaintenance manual. \n2.3. Refrigerant piping is \nchecked for abnormal \nconditions based on \nprocedure. \n2.4. Operation/Controls/ \nSettings are checked \nand adjusted in \naccordance with \nmanufacturer's \nspecifications. \n2.5. Refrigeration \naccessories are \nadjusted accordingly \n2.1. Protective personal \nequipment/safety gear \n2.2. Handling of tools and \nequipment and \naccessories \n2.3. Safety signs and \nsymbols \n2.4. Unit conversion \n2.5. Types of electrical \ncontrols \n2.6. Types refrigerant flow \ncontrol devices \n2.7. Types of compressor \n2.8. Types of refrigerant \n2.9. Types of pulley \n2.10. Types of belts \n2.11. Types of latches \n2.12. Types of door hinges \n2.13. Types of coil cleaner \n2.14. Types of fins and \nmaterials use \n2.15. RA 11058 provisions \n2.1. Interpreting  \nplans and details \n2.2. Preparing \nmaterials \n2.3. Using of \nelectrical and \nmechanical tools \nand equipment \nproperly \n2.4. Troubleshooting \ntechnique \n2.5. Calibrating of \nrefrigerant flow \ncontrol valve \n2.6. Performing work \nsafety practices \n2.7. Adjusting \nsuperheat \n2.8. belt and pulley  \n2.9. Aligning door\n\n--- PDF PAGE 73 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n69 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nbased on manufacturer's \nmaintenance manual.  \n \n2.16. Plan specification \n2.17. Electrical wiring \ndiagram \n2.18. Electrical plans, \nsymbols and \nabbreviations \n2.19. Fundamentals of \nrefrigeration \n2.20. Basic refrigeration \ncycle \n2.21. Refrigeration service \nvalves \n2.22. Basic electricity \n2.23. Understanding of \ntroubleshooting \ncharts/service charts \n2.24. Refrigerant flow \ncontrol device  \n2.25. How to charge the \nsystem \n2.26. How to evaluate the \nsystem \n2.27. Pump down procedure \n2.28. Resistance testing \nprocedure \n2.29. Mechanical testing \nprocedure \