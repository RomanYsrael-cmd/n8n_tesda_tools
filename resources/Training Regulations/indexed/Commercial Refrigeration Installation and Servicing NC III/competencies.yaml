l aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Completed pre-start-up, testing and commissioning checks and \ncomplied with manufacturer’s manuals. \n1.2. Performed electrical related checks. \n1.3. Performed refrigerant piping related checks. \n1.4. Performed condensing unit related checks. \n1.5. Performed compressor unit related checks. \n1.6. Performed indoor unit related checks. \n1.7. Performed metering device related checks. \n1.8. Charged refrigeration system with the correct refrigerant  \n1.9. Tested and set electrical, pneumatic and other controls to meet \nspecified and safety performance requirements \n1.10. Communicated interactively with others where applicable to \nensure safe and effective work operations \n1.11. Completed commissioning and starting-up procedures in \naccordance with the standard procedures \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Work place location \n2.2. Tools and equipment appropriate in performing start-up, testing \nand commissioning refrigeration and air-conditioning systems \n2.3. Materials relevant to the proposed activity \n2.4. Drawings and specifications relevant to the task \n3. Methods of \nAssessment \nCompetency must be assessed through: \n3.1. Direct observation /demonstration with oral questioning \n3.2. Written test \n3.3. Portfolio with interview \n4. Context for \nAssessment \n4.1. Competency may be assessed in the work place or in a \nsimulated work place setting\n",
