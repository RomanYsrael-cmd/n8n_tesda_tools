  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in Commercial Refrigeration Installation and Servicing NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311319\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout workplace\nprocesses\n1.1. Relevant communication\nmethod is selected based\non workplace procedures\n1.2. Multiple operations involving\nseveral topics/areas are\ncommunicated following\nenterprise requirements\n1.3. Questioning is applied to\ngain extra information\n1.4. Relevant sources of\ninformation are identified in\naccordance with workplace/\nclient requirements\n1.5. Information is selected and\norganized following\nenterprise procedures\n1.6. Verbal and written reporting\nis undertaken when\nrequired\n1.7. Communication and\nnegotiation skills are applied\nand maintained in all\nrelevant situations\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Business writing\n1.4. Workplace\netiquette\n1.1. Organizing\ninformation\n1.2. Conveying intended\nmeaning\n1.3. Participating in a\nvariety of workplace\ndiscussions\n1.4. Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n1.5. Effective business\nwriting\n1.6. Effective clarifying\nand probing skills\n1.7. Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2. Lead workplace\ndiscussions\n2.1. Response to workplace\nissues are sought following\nenterprise procedures\n2.2. Response to workplace\nissues are provided\nimmediately\n2.3. Constructive contributions\nare made to workplace\ndiscussions on such\n2.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n2.2 Effective verbal\ncommunication\nmethods\n2.3 Workplace\n2.1 Organizing\ninformation\n2.2 Conveying\nintended meaning\n2.3 Participating in\nvariety of workplace\ndiscussions\n2.4 Complying with\norganization\nrequirements for\n\n--- PDF PAGE 7 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n3\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nissues as production, quality\nand safety\n2.4. Goals/objectives and action\nplans undertaken in the\nworkplace are\ncommunicated promptly\netiquette\nthe use of written\nand electronic\ncommunication\nmethods\n2.5 Effective clarifying\nand probing skills\n\n3. Identify and\ncommunicate\nissues arising in\nthe workplace\n3.1. Issues and problems are\nidentified as they arise\n3.2. Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3. Dialogue is initiated with\nappropriate personnel\n3.4. Communication problems\nand issues are raised as\nthey arise\n3.5. Identify barriers in\ncommunication to be\naddressed appropriately\n\n3.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2. Effective verbal\ncommunication\nmethods\n3.3. Workplace\netiquette\n3.4. Communication\nproblems and\nissues\n3.5. Barriers in\ncommunication\n\n3.1. Organizing\ninformation\n3.2. Conveying intended\nmeaning\n3.3. Participating in a\nvariety of workplace\ndiscussions\n3.4. Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n3.5. Effective clarifying\nand probing skills\n3.6. Identifying issues\n3.7. Negotiation and\ncommunication\nskills\n\n--- PDF PAGE 8 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face-to-face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n2. Workplace discussions\nMay include:\n2.1. Coordination meetings\n2.2. Toolbox discussion\n2.3. Peer-to-peer discussion\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at one\ntime\n1.2.\nDemonstrated leadership skills in workplace\ncommunication\n1.3.\nMade constructive contributions in workplace issues\n1.4.\nSought workplace issues effectively\n1.5.\nResponded to workplace issues promptly\n1.6.\nPresented information clearly and effectively written form\n1.7.\nUsed appropriate sources of information\n1.8.\nAsked appropriate questions\n1.9.\nProvided accurate information\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nVariety of Information\n2.2.\nCommunication tools\n2.3.\nSimulated workplace\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through\n3.1.\nCase problem\n3.2.\nThird-party report\n3.3.\nPortfolio\n3.4.\nInterview\n3.5.\nDemonstration/Role-playing\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 9 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n5\n\nUNIT OF COMPETENCY : LEAD SMALL TEAMS\n\nUNIT CODE\n : 400311320\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting, maintaining and monitoring\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1. Work requirements are\nidentified and presented\nto team members based\non company policies and\nprocedures\n1.2. Reasons for instructions\nand requirements are\ncommunicated to team\nmembers based on\ncompany policies and\nprocedures\n1.3. Team members’ queries\nand concerns are\nrecognized, discussed\nand dealt with based on\ncompany practices\n1.1. Facilitation of\nTeam work\n1.2. Company policies\nand procedures\nrelating to work\nperformance\n1.3. Performance\nstandards and\nexpectations\n1.4. Monitoring\nindividual’s and\nteam’s\nperformance vis a\nvis client’s and\ngroup’s\nexpectations\n1.1. Communication\nskills required for\nleading teams\n1.2. Group facilitation\nskills\n1.3. Negotiating skills\n1.4. Setting\nperformance\nexpectation\n2. Assign\nresponsibilities\n2.1. Responsibilities are\nallocated having regard to\nthe skills, knowledge and\naptitude required to\nundertake the assigned\ntask based on company\npolicies.\n2.2. Duties are allocated\nhaving regard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n2.1. Work plan and\nprocedures\n2.2. Work requirements\nand targets\n2.3. Individual and\ngroup expectations\nand assignments\n2.4. Ways to improve\ngroup leadership\nand membership\n2.1. Communication\nskills\n2.2. Management\nskills\n2.3. Negotiating skills\n2.4. Evaluation skills\n2.5. Identifying team\nmember’s\nstrengths and\nrooms for\nimprovement\n3. Set performance\nexpectations for\nteam members\n3.1 Performance expectations\nare established based on\nclient needs\n3.2 Performance expectations\nare based on individual\nteam members\nknowledge, skills and\naptitude\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n3.1 One’s roles and\nresponsibilities in\nthe team\n3.2 Feedback giving\nand receiving\n3.3 Performance\nexpectation\n3.1 Communication\nskills\n3.2 Accurate\nempathy\n3.3 Congruence\n3.4 Unconditional\npositive regard\n3.5 Handling of\nFeedback\n4. Supervised team\nperformance\n4.1 Performance is\nmonitored based on\ndefined performance\ncriteria and/or assignment\n4.1 Performance\nCoaching\n4.2 Performance\nmanagement\n4.1 Communication\nskills required for\nleading teams\n4.2 Coaching skill\n\n--- PDF PAGE 10 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n6\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ninstructions\n4.2 Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies based on\ncompany practices\n4.3 Performance issues\nwhich cannot be rectified\nor addressed within the\nteam are referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n4.7 All relevant\ndocumentation is\ncompleted in accordance\nwith company procedures\n4.3 Performance\nIssues\n\n--- PDF PAGE 11 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n7\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\nMay include:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\nMay include:\n2.1. Roster/shift details\n3. Monitor performance\nMay include:\n3.1. Formal process\n3.2. Informal process\n4. Feedback\nMay include:\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\nMay include:\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual performance\nagainst set criteria\n1.3. Represented concerns of a team and individual to next level\nof management or appropriate specialist and to negotiate on\ntheir behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 12 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n8\n\nUNIT OF COMPETENCY: APPLY CRITICAL THINKING AND PROBLEM SOLVING\nTECHNIQUES IN THE WORKPLACE\n\nUNIT CODE : 400311321\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nsolve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the\nroot cause/s of specific problems in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Examine\nspecific\nworkplace\nchallenges\n1.1. Variances are examined\nfrom normal operating\nparameters; and product\nquality.\n1.2. Extent, cause and nature\nof the specific problem\nare defined through\nobservation, investigation\nand analytical\ntechniques.\n1.3. Problems are clearly\nstated and specified.\n1.1. Competence includes\na thorough knowledge\nand understanding of\nthe process, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations.\n1.2. Competence to\ninclude the ability to\napply and explain,\nenough for the\nidentification of\nfundamental causes of\nspecific workplace\nchallenges.\n1.3. Relevant equipment\nand operational\nprocesses.\n1.4. Enterprise goals,\ntargets and measures.\n1.5. Enterprise quality OHS\nand environmental\nrequirement.\n1.6. Enterprise information\nsystems and data\ncollation\n1.7. Industry codes and\nstandards.\n1.1. Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n1.2. Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n\n2. Analyze the\ncauses of\nspecific\nworkplace\nchallenges.\n2.1. Possible causes of\nspecific problems are\nidentified based on\nexperience and the use\nof problem-solving tools /\nanalytical techniques.\n2.2. Possible cause\nstatements are\ndeveloped based on\nfindings.\n2.3. Fundamental causes are\nidentified per results of\ninvestigation conducted.\n2.1 Competence includes\na thorough knowledge\nand understanding of\nthe process, normal\noperating parameters,\nand product quality to\nrecognize non-\nstandard situations.\n2.2 Competence to include\nthe ability to apply and\nexplain, sufficient for\nthe identification of\nfundamental cause,\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n\n--- PDF PAGE 13 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n9\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndetermining the\ncorrective action and\nprovision of\nrecommendations.\n2.3 Relevant equipment\nand operational\nprocesses.\n2.4 Enterprise goals,\ntargets and measures.\n2.5 Enterprise quality\nOSH and\nenvironmental\nrequirement.\n2.6 Enterprise information\nsystems and data\ncollation.\n2.7 Industry codes and\nstandards.\n2.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n2.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n\n3. Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n3.1. All possible options are\nconsidered for resolution\nof the problem.\n3.2. Strengths and\nweaknesses of possible\noptions are considered.\n3.3. Corrective actions are\ndetermined to resolve the\nproblem and possible\nfuture causes.\n3.4. Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and operating\nprocedures\n3.1. Competence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action and\nprovision of\nrecommendations\n3.2. Relevant equipment\nand operational\nprocesses\n3.3. Enterprise goals,\ntargets and measures\n3.4. Enterprise quality OSH\nand environmental\nrequirement\n3.5. Principles of decision\nmaking strategies and\ntechniques\n3.6. Enterprise information\nsystems and data\ncollation\n3.7. Industry codes and\nstandards\n3.1. Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n3.2. Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n3.3. Providing clear-\ncut findings on the\nnature of each\nidentified\nworkplace\nchallenges.\n3.4. Devising,\ncommunicating,\nimplementing and\nevaluating\nstrategies and\ntechniques in\naddressing\nspecific workplace\nchallenges.\n\n--- PDF PAGE 14 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n10\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n4. Implement\naction plans\nand\ncommunicate\nresults\n4.1. Action plans are\nimplemented and\nevaluated.\n4.2. Results of plan\nimplementation and\nrecommendations are\nprepared.\n4.3. Recommendations are\npresented to appropriate\npersonnel.\n4.4. Recommendations are\nfollowed-up, if required.\n4.1 Competence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action and\nprovision of\nrecommendations\n4.2. Relevant equipment\nand operational\nprocesses\n4.3 Enterprise goals,\ntargets and\nmeasures\n4.4 Enterprise quality,\nOSH and\nenvironmental\nrequirement\n4.5 Principles of decision\nmaking strategies\nand techniques\n4.6 Enterprise\ninformation systems\nand data collation\n4.7 Industry codes and\nstandards\n4.1 Using range of\nanalytical\ntechniques\n(e.g., planning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in\nthe workplace.\n4.2 Identifying\nextent and\ncauses of\nspecific\nchallenges in\nthe workplace.\n4.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n4.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges.\n\n--- PDF PAGE 15 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n11\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Parameters\nMay include:\n1.1 Processes\n1.2 Procedures\n1.3 Systems\n2. Analytical techniques\nMay include:\n2.1. Brainstorming\n2.2. Intuitions/Logic\n2.3. Cause and effect diagrams\n2.4. Pareto analysis\n2.5. SWOT analysis\n2.6. Gant chart, Pert CPM and graphs\n2.7. Scattergrams\n3. Problem\n\nMay include:\n3.1. Routine, non – routine and complex workplace\nand quality problems\n3.2. Equipment selection, availability and failure\n3.3. Teamwork and work allocation problem\n3.4. Safety and emergency situations and incidents\n3.5. Risk assessment and management\n4. Action plans\n\nMay include:\n4.1. Priority requirements\n4.2. Measurable objectives\n4.3. Resource requirements\n4.4. Timelines\n4.5. Co-ordination and feedback requirements\n4.6. Safety requirements\n4.7. Risk assessment\n4.8.\nEnvironmental requirements\n\n--- PDF PAGE 16 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n12\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Examined specific workplace challenges.\n1.2. Analyzed the causes of specific workplace challenges.\n1.3. Formulated resolutions to specific workplace\nchallenges.\n1.4. Implemented action plans and communicated results\non specific workplace challenges.\n\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant\nover an extended period of time, or a suitable method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies / what\nifs will be required as well as bank of questions which\nwill be used to probe the reason behind the observable\naction.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Case Formulation\n3.3. Life Narrative Inquiry\n3.4. Standardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n\nThese assessment activities should include a range of\nproblems, including new, unusual and improbable situations\nthat may have happened.\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 17 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n13\n\nUNIT OF COMPETENCY :\nWORK IN A DIVERSE ENVIRONMENT\nUNIT CODE\n: 400311322\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to work effectively in\na workplace characterized by diversity in terms of religions,\nbeliefs, races, ethnicities and other differences.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n1.1. Individual differences with\nclients, customers and\nfellow workers are\nrecognized and respected\nin accordance with\nenterprise policies and\ncore values.\n1.2. Differences are\nresponded to in a\nsensitive and considerate\nmanner\n1.3. Diversity is\naccommodated using\nappropriate verbal and\nnon-verbal\ncommunication.\n1.1. Understanding cultural\ndiversity in the\nworkplace\n1.2. Norms of behavior for\ninteracting and\ndialogue with specific\ngroups\n(e. g., Muslims and\nother non-Christians,\nnon-Catholics,\ntribes/ethnic groups,\nforeigners)\n1.3. Different methods of\nverbal and non-verbal\ncommunication in a\nmulticultural setting\n1.1. Applying cross-\ncultural\ncommunication\nskills (i.e. different\nbusiness\ncustoms, beliefs,\ncommunication\nstrategies)\n1.2. Showing affective\nskills –\nestablishing\nrapport and\nempathy,\nunderstanding,\netc.\n1.3. Demonstrating\nopenness and\nflexibility in\ncommunication\n1.4. Recognizing\ndiverse groups in\nthe workplace\nand community\nas defined by\ndivergent culture,\nreligion, traditions\nand practices\n2. Work\neffectively in\nan\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n2.1 Knowledge, skills and\nexperiences of others are\nrecognized and\ndocumented in relation to\nteam objectives.\n2.2 Fellow workers are\nencouraged to utilize and\nshare their specific\nqualities, skills or\nbackgrounds with other\nteam members and\nclients to enhance work\noutcomes.\n2.3 Relations with customers\nand clients are\nmaintained to show that\ndiversity is valued by the\n2.1 Value of diversity in\nthe economy and\nsociety in terms of\nWorkforce\ndevelopment\n2.2 Importance of\ninclusiveness in a\ndiverse environment\n2.3 Shared vision and\nunderstanding of and\ncommitment to team,\ndepartmental, and\norganizational goals\nand objectives\n2.4 Strategies for\ncustomer service\nexcellence\n2.1 Demonstrating\ncross-cultural\ncommunication\nskills and active\nlistening\n2.2 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n2.3 Demonstrating\ncollaboration skills\n2.4 Exhibiting\ncustomer service\n\n--- PDF PAGE 18 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n14\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nbusiness.\nexcellence\n3. Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n3.1 Diversity-related\nconflicts within the\nworkplace are effectively\naddressed and resolved.\n3.2 Discriminatory behaviors\ntowards customers/\nstakeholders are\nminimized and addressed\naccordingly.\n3.3 Change management\npolicies are in place within\nthe organization.\n3.1 Value, and leverage of\ncultural diversity\n3.2 Inclusivity and conflict\nresolution\n3.3 Workplace\nharassment\n3.4 Change management\nand ways to overcome\nresistance to change\n3.5 Advanced strategies\nfor customer service\nexcellence\n3.1 Addressing\ndiversity-related\nconflicts in the\nworkplace\n3.2 Eliminating\ndiscriminatory\nbehavior towards\ncustomers and\nco-workers\n3.3 Utilizing change\nmanagement\npolicies in the\nworkplace\n\n--- PDF PAGE 19 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nDiversity\nThis refers to diversity in both the workplace and the\ncommunity and may include divergence in :\n1.1\nReligion\n1.2\nEthnicity, race or nationality\n1.3\nCulture\n1.4\nGender, age or personality\n1.5\nEducational background\n2. Diversity-related conflicts\nMay include conflicts that result from:\n2.1\nDiscriminatory behaviors\n2.2\nDifferences of cultural practices\n2.3\nDifferences of belief and value systems\n2.4\nGender-based violence\n2.5\nWorkplace bullying\n2.6\nCorporate jealousy\n2.7\nLanguage barriers\n2.8\nIndividuals being differently-abled persons\n2.9\nAgeism (negative attitude and behavior towards\nold people)\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAdjusted language and behavior as required by\ninteractions with diversity\n1.2\nIdentified and respected individual differences in\ncolleagues, clients and customers\n1.3\nApplied relevant regulations, standards and codes of\npractice\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Manuals and policies on Workplace Diversity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning\n3.2\nGroup discussions and interactive activities\n3.3\nCase studies/problems involving workplace diversity\nissues\n3.4\nThird-party report\n3.5\nWritten examination\n3.6\nRole Plays\n4. Context for\nAssessment\n