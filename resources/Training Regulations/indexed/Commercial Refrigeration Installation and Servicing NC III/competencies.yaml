        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Conducted survey of site for installation of the unit.\n1.2 Prepared and installed piping materials correctly.\n1.3 Used and installed correct insulation and\nsealing/adhesive materials.\n1.4 Prepared, laid out and installed electrical system\ncorrectly.\n1.5 Tested/Energized electrical system in line with applicable\nprovision of latest edition of PEC.\n1.6 Installed indoor and outdoor units and accessories\naccordingly.\n1.7 Corrected faults/problems arising from installation.\n1.8 Undertook pre-start up checks.\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Technical plan/drawing relevant to the task\n2.2 Work place location\n2.3 Tools and equipment appropriate to installing commercial\nrefrigeration processes\n2.4 Materials relevant to the proposed activity\n2.5 Drawings and specifications relevant to the task\n\n3. Methods of\nAssessment\n\nCompetency may be assessed through:\n3.1 Direct observation / Demonstration with oral questioning\n3.2 Written test\n3.3 Portfolio with interview\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 72 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n68\n\nUNIT OF COMPETENCY: SERVICE AND MAINTAIN COMMERCIAL\nREFRIGERATION EQUIPMENT (CRE)\n\nUNIT CODE\n\n :"
        },
        "source_text": "HVC723341\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to safely\ninstall the commercial refrigeration equipment (CRE)\ncomponents as well as accessories based on manufacturer's\nrecommendations. It also includes site survey, installation of\nelectrical and piping systems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Survey site\nfor\ninstallation\n1.1. Work instructions/\ntechnical plans/drawings\nare interpreted as per job\nrequirements\n1.2. Installation\nrequirements are verified\nin line with site conditions\n1.3. Alteration/comments are\nprepared as per survey\nconducted\n1.4. Result of survey is\nprepared in line with\nenterprise procedures.\n\n1.1 Protective personal\nequipment/safety gears\n1.2 Safety signs and symbols\n1.3 Trade mathematics/\nmensuration\no Linear measurements\no Ratio and proportion\no Dimension\n1.4 Mechanical plans, symbols\nand abbreviations\n1.5 Electrical plans, symbols and\nabbreviations\n1.6 Architectural/Structural plans\n1.7 Plumbing plans, symbols\nand abbreviations\n1.8 Equipment selection and\napplication\n1.9 Knowledge to understand the\ngeographical location/site\nlocation\n1.10 RA 11058 provisions\n1.1 Interpreting plan\nand details\n1.2 Preparing\nmaterials\n1.3 Performing work\nsafety practices\n1.4 Work set-up and\nplanning\n1.5 Communication\nskills\n\n2. Install\ncommercial\nrefrigeration\nequipment\npiping\nsystems\n2.1. Piping materials are\nprepared consistent with\nthe approved designs and\nspecifications\n2.2. Brackets and supports are\nmounted in accordance\nwith site conditions\n2.3. Piping are installed,\ncleaned and tested in\naccordance with\nmanufacturer's\nspecifications,\nrecommendations and\nRAC Code of Practice\n2.4. Correct insulation and\nsealing/adhesive\nmaterials are used and\ninstalled in accordance\nwith manufacturer's\n2.1. Protective personal\nequipment/safety gears\n2.2. Handling of tools, equipment\nand accessories\n2.3. Safety signs and symbols\n2.4. Good housekeeping\n2.5. Trade mathematics/\nmensuration\no Linear measurements\no Ratio and proportion\no Dimension\n2.6. Mechanical plans, symbols\nand abbreviations\n2.7. Architectural/Structural plans\n2.8. Plumbing plans, symbols\nand abbreviations\n2.9. Fundamental of refrigeration\n2.10. Basic masonry\n2.11. Basic sheet metal\n2.1. Interpreting plan\nand details\n2.2. Preparing\nmaterials\n2.3. Proper handling\nof tools and\nequipment\n2.4. Performing work\nsafety practices\n2.5. Work set-up and\nplanning\n2.6. Tube processing\n2.7. Plumbing works\n2.8. Communication\nskills\n\n--- PDF PAGE 67 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n63\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\nspecifications\n2.12. Basic welding (SMAW and\nGas)\n2.13. Basic plumbing\n2.14. RA 11058 provisions\n3. Install\ncommercial\nrefrigeration\nequipment\nelectrical\nsystems\n3.1. Electrical materials are\nprepared consistent with\njob requirements and are\nchecked for damage\n3.2. Appropriate PPE is\nselected and used in line\nwith the job requirements\n3.3. Electrical system is laid-\nout and installed in\naccordance with the\napproved designs,\nspecifications, working\nplans, drawings and\napplicable provisions of\nthe latest edition of PEC\n3.4. Electrical system is\ntested/energized in line\nwith applicable provisions\nof the latest edition of\nPEC\n3.5. Report on testing/\nenergization of electrical\nsystem is prepared in line\nwith enterprise\nprocedures\n\n3.1. Protective personal\nequipment/safety gears\n3.2. Handling of tools, equipment\nand accessories\n3.3. Safety signs and symbols\n3.4. Good housekeeping\n3.5. Trade mathematics/\nmensuration\no Linear measurements\no Ratio and proportion\no Dimension\n3.6. Electrical plans, symbols and\nabbreviations\n3.7. Architectural/Structural plans\n3.8. Basic electricity\n3.9. Fundamental of refrigeration\n3.10. How to select wire size\n3.11. Equipment selection and\napplication\n3.12. Knowledge to understand\nthe geographical\nlocation/site location\n3.13. PEC Provisions\n3.14. RA 11058 provisions\n3.1. Interpreting plan\nand details\n3.2. Preparing\nmaterials\n3.3. Proper handling\nof tools and\nequipment\n3.4. Performing work\nsafety practices\n3.5. Work set-up and\nplanning\n3.6. Basic electrical\ninstallation\n3.7. Communication\nskills\n4. Install fan\ncoil\nunits/evapor\nator and\ncondensers\n(air-cooled\nor water-\ncooled) and\naccessories\n\n4.1. Fan coil units/\nevaporator and\ncondensers are mounted\nin accordance with site\nconditions and\nmanufacturer’s\nspecifications\n4.2. Accessories are installed\naccording to\nmanufacturer’s\nspecifications\n4.3. Refrigerant lines are\nconnected in accordance\nwith manufacturer’s\nspecifications\n4.4. Electrical connections are\nterminated in accordance\nwith manufacturer’s\nspecifications\n4.5. Condensate drain line is\ninstalled in accordance\nwith manufacturer’s\nspecification.\n4.1. Protective personal\nequipment/safety gears\n4.2. Handling of tools, equipment\nand accessories\n4.3. Safety signs and symbols\n4.4. Good housekeeping\n4.5. Trade mathematics/\nmensuration\no Linear measurements\no Ratio and proportion\no Dimension\n4.6. Mechanical plans, symbols\nand abbreviations\n4.7. Electrical plans, symbols and\nabbreviations\n4.8. Architectural/Structural plans\n4.9. Plumbing plans, symbols\nand abbreviations\n4.10. Basic masonry work\n4.11. Basic sheet metal work\n4.12. Basic bench work\n4.13. Basic welding (SMAW and\nGas)\n4.1. Interpreting plan\nand details\n4.2. Preparing\nmaterials\n4.3. Proper handling\nof tools and\nequipment\n4.4. Performing work\nsafety practices\n4.5. Work set-up and\nplanning\n4.6. Basic electrical\ninstallation\n4.7. Tube processing\n4.8. Plumbing works\n4.9. Communication\nskills\n\n--- PDF PAGE 68 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n64\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n4.6. Pre-start up checks are\nundertaken in accordance\nwith manufacturer’s\nspecifications and\nenterprise policies\n4.7. Faults/problems arising\nfrom installation are\ncorrected in line with\nstandard installation\nguidelines\n\n4.14. Basic electricity\n4.15. Basic plumbing\n4.16. Fundamental of\nrefrigeration\n4.17. How to select conductor\nwire size\n4.18. Principles of air distribution\n4.19. Equipment selection and\napplication\n4.20. Knowledge to understand\nthe geographical\nlocation/site location\n4.21. Clean Air Act (RA 8749)\n4.22. Montreal Protocol/DENR\nrules\n4.23. Ozone Depleting / Global\nwarming Refrigerants\n(ODS/GWP)\n4.24. RA 11058 provisions\n\n--- PDF PAGE 69 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n65\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1\nInstallation\nrequirements\nMay include:\n1.1 Piping requirements\n1.1.1\nRefrigerant piping\n1.1.2\nDrain piping\n1.1.3\nHot gas defrost piping (optional)\n1.2 Electrical requirements\n1.3 Drain location\n1.4 Mounting location\n1.5 Equipment requirements\n1.6 Permits and licenses\n1.6.1\nInstallation permit\n1.6.2\nMechanical permit\n1.6.3\nGovernment and private permits\n2\nPiping materials\nMay include:\n2.1 Pipes and fittings\n2.2 Tubing\n2.3 Insulations\n2.4 Hangers, clamps, brackets\n\n3\nElectrical materials\nMay include:\n3.1 Electrical tape\n3.2 Wire connector\n3.3 Wires and cables\n3.4 Breaker\n3.5 Terminal clips/plugs\n4\nElectrical system\nMay include:\n4.1 Electrical conduits\n4.2 Controls and protective devices\n4.3 Electrical control wires/cables\n4.4 Power supply\n5\nFan coil units/\nevaporator and\ncondensers\nMay include:\n5.1 Fan coil units/evaporator\n5.1.1\nWalk-in cooler/freezer evaporator\n5.1.2\nReach-in chiller/freezer evaporator\n5.2 Condensers\n5.2.1\nAir-cooled condenser\n5.2.2\nWater-cooled condenser\n\n6\nAccessories\nMay include:\n6.1 filter drier (soldered/flared)\n6.2 sight glass or moisture\nindicator\n6.3 solenoid valve\n6.4 high pressure control (HPC)\n6.5 low pressure control (LPC)\n6.6 defrost timer\n6.7 evaporator pressure\nregulator (EPR)\n\n6.8 non-return valve\n6.9 drain line heater\n6.10 defrost heater\n6.11 crankcase heater\n6.12 accumulator\n6.13 oil separator\n\n--- PDF PAGE 70 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n66\n\nVARIABLE\nRANGE\n7\nRefrigerant lines\nMay include:\n7.1 Gas lines (vapor lines)\n7.2 Liquid lines\n7.3 Hot gas lines\n8\nCondensate drain\nMay include:\n8.1 PVC pipe/clamp\n8.2 Plastic tubing/clamp\n8.3 G.I. or metal tubing/clamp\n9\nPre-start up checks\nMay include:\n9.1 Insulation\n9.2 Termination\n9.3 Sequence test\n9.4 Refrigerant leakage\n9.5 Equipment\n10 Faults/problems\nMay include:\n10.1 factory defects\n10.2 material defects\n10.3 loose connections\n10.4 wrong connections\n10.5 mismatching of indoor and outdoor units (for multi-unit\ninstallations)\n\n--- PDF PAGE 71 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n67\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Conducted survey of site for installation of the unit.\n1.2 Prepared and installed piping materials correctly.\n1.3 Used and installed correct insulation and\nsealing/adhesive materials.\n1.4 Prepared, laid out and installed electrical system\ncorrectly.\n1.5 Tested/Energized electrical system in line with applicable\nprovision of latest edition of PEC.\n1.6 Installed indoor and outdoor units and accessories\naccordingly.\n1.7 Corrected faults/problems arising from installation.\n1.8 Undertook pre-start up checks.\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Technical plan/drawing relevant to the task\n2.2 Work place location\n2.3 Tools and equipment appropriate to installing commercial\nrefrigeration processes\n2.4 Materials relevant to the proposed activity\n2.5 Drawings and specifications relevant to the task\n\n3. Methods of\nAssessment\n\nCompetency may be assessed through:\n3.1 Direct observation / Demonstration with oral questioning\n3.2 Written test\n3.3 Portfolio with interview\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 72 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n68\n\nUNIT OF COMPETENCY: SERVICE AND MAINTAIN COMMERCIAL\nREFRIGERATION EQUIPMENT (CRE)\n\nUNIT CODE\n\n :"
