d\nand discussed\n2.3 Work procedures and\nprocesses subject to change\nare selected based on\nworkplace requirements\n(feasible and innovative).\n2.4 Practical action plans are\nproposed to facilitate simple\nchanges in the work\nprocedures, processes and\nsystems.\n2.5 Critical inquiry is applied\nand used to facilitate\ndiscourse on adjustments in\nthe simple work procedures,\nprocesses and systems.\n2.1 Seven habits of\nhighly effective\npeople.\n2.2 Character strengths\nthat foster innovation\nand learning\n(Christopher\nPeterson and Martin\nSeligman, 2004)\n2.3 Five minds of the\nfuture concepts\n(Gardner, 2007).\n2.4 Adaptation concepts\nin neuroscience\n(Merzenich, 2013).\n2.5 Transtheoretical\nmodel of behavior\nchange (Prochaska,\nDiClemente, &\nNorcross, 1992).\n2.1 Assessing\nreadiness for\nchange on\nsimple work\nprocedures,\nprocesses and\nsystems.\n2.2 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n2.3 Facilitating\naction plans on\nhow to apply\ninnovative\nprocedures in\nthe organization.\n\n--- PDF PAGE 21 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n17\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Evaluate the\neffectiveness\nof the\nproposed\naction plans\n3.1 Work structure is analyzed\nto identify the impact of the\nnew work procedures\n3.2 Co-workers/key personnel\nis consulted to know who\nwill be involved with or\naffected by the work\nprocedure\n3.3 Work instruction\noperational plan of the new\nwork procedure is\ndeveloped and evaluated.\n3.4 Feedback and suggestion\nare recorded.\n3.5 Operational plan is\nupdated.\n3.6 Results and impact on the\ndeveloped work\ninstructions are reviewed\n3.7 Results of the new work\nprocedure are evaluated\n3.8 Adjustments are\nrecommended based on\nresults gathered\n3.1 Five minds of the\nfutu