 and \nsustained through judicious \ncontrol of cash flows.  \n3.2 Profitability of enterprise is \nensured though appropriate \ninternal controls. \n3.3 Unnecessary or lower-priority \nexpenses and purchases are \navoided.  \n3.1 Cash flow \nmanagement \n3.2 Basic financial \nmanagement \n3.3 Basic financial \naccounting    \n3.4 Business \ninternal controls  \n \n3.1 Setting \nbusiness \npriorities and \nstrategies \n3.2 Interpreting \nbasic financial \nstatements \n3.3 Preparing \nbusiness plans\n\n--- PDF PAGE 35 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n31 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business \nstrategies \nMay include: \n1.1. Developing/Maintaining niche market  \n1.2. Use of organic/healthy ingredients   \n1.3. Environment-friendly and sustainable practices  \n1.4. Offering both affordable and high-quality products and services  \n1.5. Promotion and marketing strategies (e. g., on-line marketing) \n2. Business \noperations  \nMay include: \n2.1 Purchasing  \n2.2 Accounting/Administrative work \n2.3 Production/Operations/Sales \n3. Internal controls \nMay include: \n3.1 Accounting systems \n3.2 Financial statements/reports \n3.3 Cash management  \n4. Promotional/ \nAdvertising \ninitiatives  \nMay include: \n4.1 \nUse of tarpaulins, brochures, and/or flyers \n4.2 \n Sales, discounts and easy payment terms \n4.3 \nUse of social media/Internet \n4.4 \n“Service with a smile” \n4.5 \nExtra attention to regular customers"
