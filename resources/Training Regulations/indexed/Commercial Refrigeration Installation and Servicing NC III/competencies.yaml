        "source_text": "HVC723343\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nservicing and maintaining refrigeration system, components\nand accessories including lubrication and air-distribution\nsystems in commercial refrigeration equipment (CRE).\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Prepare for\nservice and\nmaintenance\nactivities\n1.1. Work instructions are\nread interpreted to\ndetermine job\nrequirements\n1.2. Appropriate\nmanufacturer's manual is\nconsulted if available;\notherwise, RAC Code of\nPractice and/or\nenterprise maintenance\npolicy procedures are\nadopted.\n1.3. Tools and equipment are\nselected in accordance\nwith job requirements\n1.4. Work safety is observed\naccording to enterprise\nregulations\n1.1. Protective personal\nequipment/ safety gear\n1.2. Safety hazards\n1.3. Handling of tools and\nequipment and\naccessories\n1.4. Safety signs and\nsymbols\n1.5. Good housekeeping\n1.6. Proper use and care of\ntools needed\n1.7. Types of refrigerant\n1.8. Types of coil cleaner\n1.9. Types of fins and\nmaterials use\n1.10. Plan specification\n1.11. Electrical wiring\ndiagram\n1.12. Electrical plans,\nsymbols and\nabbreviations\n1.1. Interpreting\nplans and details\n1.2. Preparing\nmaterials\n2. Check and\nadjust\ncommercial\nrefrigeration\nequipment\n(CRE)\naccessories,\ncontrols and\noperating\nconditions\n2.1. Maintenance procedures\nare applied according to\nmanufacturer's\nmaintenance manual\n2.2. Evaporator/condenser\ncoils are cleaned in\naccordance with\nmanufacturer's\nmaintenance manual.\n2.3. Refrigerant piping is\nchecked for abnormal\nconditions based on\nprocedure.\n2.4. Operation/Controls/\nSettings are checked\nand adjusted in\naccordance with\nmanufacturer's\nspecifications.\n2.5. Refrigeration\naccessories are\nadjusted accordingly\n2.1. Protective personal\nequipment/safety gear\n2.2. Handling of tools and