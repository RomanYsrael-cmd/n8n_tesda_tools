        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Interpreted appropriate wiring diagrams, charts and\nmanuals.\n1.2 Checked power supply in compliance with nameplate rating\nand/or manufacturer’s standard\n1.3 Tested refrigerant system components as per standard\nprocedures\n1.4 Diagnosed and repaired faults/problems.\n1.5 Demonstrated compliance with safety regulations applicable\nto worksite operations\n1.6 Performed refrigerant recovery/recycling accordingly.\n1.7 Test run air-conditioning unit in line with manufacturer’s\ninstruction.\n1.8 Communicated Interactively others where applicable to\nensure safe and effective work operations\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Work place location\n4.2 Tools and equipment appropriate to troubleshooting\nrefrigerant system\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation / demonstration with oral questioning\n5.2 Written test\n5.3 Portfolio with interview\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 85 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n81\n\nUNIT OF COMPETENCY: PERFORM START-UP, TEST AND COMMISSIONING FOR\nCOMMERCIAL REFRIGERATION EQUIPMENT\n\nUNIT CODE :"
