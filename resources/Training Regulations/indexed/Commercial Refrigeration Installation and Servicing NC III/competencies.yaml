        "source_title": "EVALUATE ENVIRONMENTAL WORK PRACTICES",
        "source_text": "--- PDF PAGE 31 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n27 \n \n \nUNIT OF COMPETENCY \n: EVALUATE ENVIRONMENTAL WORK PRACTICES  \nUNIT CODE \n: 400311326 \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitude to interpret \nenvironmental \nIssues, \nestablish \ntargets \nto \nevaluate \nenvironmental practices and evaluate effectiveness of \nenvironmental practices \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Interpret \nenvironmental \npractices, policies \nand procedures \n1.1. Environmental work \npractices issues are \nidentified relevant to work \nrequirements \n1.2. Environmental Standards and \nProcedures nature of work are \ndetermined based on \nApplicability to nature of work  \n1.3. Gaps in work practices related \nto Environmental Standards \nand Procedures are identified \n \n1.1. Environmental \nIssues  \n1.2. Environmental Work \nProcedures \n1.3. Environmental Laws \n1.4. Environmental \nHazardous and Non-\nHazardous Materials \n1.5. Environmental \nrequired license, \nregistration or \ncertification \n1.1. Analyzing \nEnvironmental \nIssues and \nConcerns \n1.2. Critical thinking \n1.3. Problem \nSolving \n1.4. Observation \nSkills \n \n2. Establish targets \nto evaluate \nenvironmental \npractices \n \n \n2.1. Relevant information are \ngathered necessary to \ndetermine environmental work \ntargets \n2.2. Environmental Indicators \nbased on gathered information \nare set to measure \nenvironmental work targets \n2.3. Indicators are verified with \nappropriate personnel \n2.1. Environmental \nIndicators \n2.2. Relevant \nEnvironment \nPersonnel or expert \n2.3. Relevant \nEnvironmental \nTrainings and \nSeminars \n2.1. Investigative \nSkills \n2.2. Critical \nthinking \n2.3. Problem \nSolving \n2.4. Observation \nSkills \n \n3. Evaluate \neffectiveness of \nenvironmental \npractices \n3.1. Work environmental practices \nare recorded based on \nworkplace standards \n3.2. Recorded work environmental \npractices are compared \nagainst planned indicators \n3.3. Findings regarding \neffectiveness are assessed \nand gaps identified are \nimplemented based on \nenvironment work standards \nand procedures \n3.4. Results of environmental \nassessment are conveyed to \nappropriate personnel \n3.1. Environmental \nPractices \n3.2. Environmental \nStandards and \nProcedures \n3.1. Documentation \nand Record \nKeeping Skills \n3.2. Critical thinking \n3.3. Problem \nSolving \n3.4. Observation \nSkills\n\n--- PDF PAGE 32 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n28 \n \nRANGE OF VARIABLES \n \nVARIABLE \nR A N G E \n1. Environmental Work \nPractices Issues \nMay include: \n1.1 \nWater Quality  \n1.2 \nNational and Local Government Issues \n1.3 \nSafety \n1.4 \nEndangered Species \n1.5 \nNoise \n1.6 \nAir Quality \n1.7 \nHistoric \n1.8 \nWaste \n1.9 \nCultural \n \n2. Environmental Indicators May include: \n2.1 \nNoise level \n2.2 \nLighting (Lumens) \n2.3 \nAir Quality - Toxicity \n2.4 \nThermal Comfort \n2.5 \nVibration \n2.6 \nRadiation  \n2.7 \nQuantity of the Resources \n2.8 \nVolume\n\n--- PDF PAGE 33 ---\nCommercial Refrigeration Installation and Servicing NC III  (HVCCRE321)  Promulgated: June 8, 2021 \n29 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of  \n      Competency  \nAssessment requires evidence that the candidate: \n1.1. Identified environmental issues relevant to work \nrequirements \n1.2. Identified gaps in work practices related to Environmental \nStandards and Procedures \n1.3. Gathered relevant information necessary to determine \nenvironmental work targets \n1.4. Set environmental indicators based on gathered information \nto measure environmental work targets \n1.5. Recorded work environmental practices are recorded based \non workplace standards \n1.6. Conveyed results of environmental assessment to \nappropriate personnel \n2.  Resource   \nImplications \nThe following resources should be provided: \n2.1  Workplace/Assessment location \n2.2  Legislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n2.3  Case studies/scenarios relating to environmental protection \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1  Written/ Oral Examination \n3.2  Interview/Third Party Reports \n3.3  Portfolio (citations/awards from GOs and NGOs, certificate of  \ntraining – local and abroad) \n 3.4  Simulations and role-plays \n4.  Context for \nAssessment \n4.1. Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
