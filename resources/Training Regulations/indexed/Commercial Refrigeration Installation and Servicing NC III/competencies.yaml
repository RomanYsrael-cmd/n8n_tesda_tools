          "source_text": "1 Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Prepared for maintenance activities.\n1.2 Checked and adjusted refrigeration equipment accessories,\ncontrols and operating conditions\n1.3 Applied maintenance procedures according to\nmanufacturer’s maintenance manual.\n1.4 Checked and maintained lubrication system in CRE.\n1.5 Checked and maintained refrigeration system in CRE.\n1.6 Checked and maintained air distribution system in CRE.\n1.7 Communicated interactively with others where applicable to\nensure safe and effective work operations\n\n2 Resource\nImplications\nThe following resources should be provided:\n2.1 Work place location\n2.2 Tools and equipment appropriate to maintaining\ncommercial refrigeration equipment processes\n2.3 Materials relevant to the activity\n2.4 Drawings and specifications relevant to the task\n\n3 Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Direct observation /demonstration with oral questioning\n3.2 Written test\n3.3 Portfolio with interview\n\n4 Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 79 ---\nCommercial Refrigeration Installation and Servicing NC III (HVCCRE321) Promulgated: June 8, 2021\n75\n\nUNIT OF COMPETENCY: TROUBLESHOOT AND REPAIR COMMERCIAL\nREFRIGERATION EQUIPMENT (CRE)\n\nUNIT CODE :"
