        "source_text": "HVC723345\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ntroubleshooting and repairing commercial refrigeration\nequipment systems. It includes planning troubleshooting and\nrepair, preparing materials, tools and equipment and identifying\nand repairing faults including recovery/recycle of refrigerants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntroubleshooting\nand repair\n1.1. Appropriate wiring\ndiagrams, charts and\nmanuals are interpreted\nin line with the job\nrequirements\n1.2. Appropriate materials,\ntools and equipment are\nselected based on job\nrequirements\n1.3. Power supply is checked\nto ensure compliance\nwith nameplate rating\nand/or manufacturer’s\nspecifications\n1.4. Nameplates are\ninterpreted as per\nmanufacturer’s\nspecifications\n1.1. SAFETY PRACTICES\n1.2. Protective personal\nequipment/safety gears\n1.3. Safe handling of tools and\nequipment\n1.4. Safety signs and symbols\n1.5. Safety hazard\n1.6. Good housekeeping\n1.7. Electrical wiring control\ndiagram\n1.8. Mechanical plan/symbols\nand abbreviation\n1.9. Fundamentals of\nrefrigeration and control\n1.10. PEC provisions\n1.11. Montreal protocol\n1.12. EMB/DENR regulations\n1.13. RA 11058 provisions\n1.14. Fire Code (RA 9514)\n\n1.1. Interpreting plan\nand details\n1.2. Preparing\nmaterials\n1.3. Following work\nsafety\n1.4. Using electrical\ntools and testing\nequipment\n1.5. Communicating\nskills\n\n2. Identify and\nrepair faults/\ntroubles in\nCRE\n2.1. Appropriate PPE is\nselected and used in line\nwith the job requirements\n2.2. Refrigeration system\ncomponents and\naccessories are tested\nfollowing manufacturer’s\nmanual, RAC Code of\nPractice and/or\nenterprise\ntroubleshooting policy\n2.3. Faults/problems with\nrefrigerant system are\ndiagnosed in line with\nmanufacturer’s manual,\nRAC Code of Practice\nand/or enterp