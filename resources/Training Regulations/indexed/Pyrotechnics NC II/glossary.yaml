  "source_text": "Binder\nThis can be sugar or starch. Mixed with water, these\nchemicals form a slurry that can be coated on a wire (by\ndipping) or poured into a tube.\nBlack Match\nA fuse made from string that is impregnated with Black\nPowder.\nBlack Powder\nMaterial found in fireworks. This material can be used as\na propellant charge, to produce sound, as a constituent of\nother compositions, or in the ignition fuse or timing\nsystem of fireworks. Also known as gun powder.\n Certification\nThe process of verifying and validating competencies of a\nperson through qualifications assessment.\nChemical\nComposition\nAll pyrotechnic and explosive composition contained in a\nfireworks device. Inert materials (such as clay used for\nplugs or organic matter used for density) are not\nconsidered to be part of chemical composition.\nCompetency\nrefers to the specification of knowledge, skills and\nattitudes to perform work activities to the standard\nexpected in the workplace\nDisplay Fireworks\n(formerly known as special fireworks) Large fireworks\narticles designed to produce visible or audible effects for\nentertainment purposes by combustion, deflagration, or\ndetonation.\nDisplay Site\nThe immediate area where a fireworks display is\nconducted, including the discharge site, the fallout area,\nand the required separation distance from mortars to\nspectator viewing areas, but not spectator viewing areas\nor vehicle parking areas.\nDud\nAny device in which the fuse or igniter fails to ignite the\nmain pyrotechnic charge. The term, dud, is reported to\nhave originated as an acronym for dangerous unexploded\ndevice.\nElectrical Firing Unit\nA device that provides and controls the electric current\nused to ignite fireworks during a display.\n\n--- PDF PAGE 72 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n72\n\nElectrical Firing Unit,\nAutomatic\nA panel or box that operates automatically to provide the\nsource of electric current used to ignite electric matches.\nElectrical Firing Unit,\nHandheld\nA small, handheld unit with manually operated switches\nthat control the flow of electric current to electric matches\nattached to fireworks devices.\nElectrical Firing Unit,\nManual\nA panel or box with manually operated switches that\ncontrol the flow of electric current to electric matches\nattached to fireworks devices.\nElectrical Ignition\nA technique used to ignite fireworks using a source of\nelectric current.\nElectric Match\nAn electric device that contains a small amount of\npyrotechnic material that ignites when current flows\nthrough the device.\n Element\nAre the building blocks of a unit of competency. It\ndescribe in outcome terms the functions that a person\nwho works in a particular area of work is able to perform.\nEvidence Guide\nGuide for assessment that provides information on critical\naspects\nof\ncompetency,\nunderpinning\nknowledge,\nunderpinning skills, resource implications, context of\nassessment and assessment method.\nExplosive\n(Technical Definition) Any material that is capable of\nundergoing\na\nself-contained\nand\nself-sustained\nexothermic chemical reaction at a rate that is sufficient to\nproduce substantial pressures on their surroundings, thus\ncausing physical damage. Explosives fall into 2 classes,\ndetonating and deflagerating.\nExplosive\nComposition\nAny chemical compound or mixture, the primary purpose\nof which is to function by explosion, producing an audible\neffect.\nFire\nTo ignite pyrotechnics by using an electric match,\nelectrical current, or some other means.\nFirecrackers\nConsist of either black powder (also known as\ngunpowder) or flash powder in a tight paper tube with a\nfuse to light the powder.\n\n--- PDF PAGE 73 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n73\n\nFireworks\nAny composition or device for the purpose of producing a\nvisible or an audible effect by combustion, deflagration, or\ndetonation, and that meets the definition of consumer\nfireworks or display fireworks.\nFireworks Display\nA presentation of fireworks for a public or private\ngathering.\nFlash Powder\nMixtures which contain powdered aluminum or a\nmagnesium/aluminum alloy which, when ignited, can\nresult in a violent explosion and flash.\nFountain\nDevice that projects a spray of sparks.\nFuel\nMaterial (charcoal or sulfur) that can be burned or\notherwise consumed to produce heat.\nFuse\nProvides a time delay so the shell explodes at the right\naltitude.\nGerb\nSmall fountain sometimes used with lance-work set\npieces.\nGirandola\nSpecial wheel which rises rapidly in the air while emitting\na spray of sparks and, sometimes, a whistle.\nLabels\nAll legal consumer explosives have mandatory labeling\nrequirements. Included on these labels should be the\nmanufacturer's\nname\nand\naddress,\ncautions,\nand\ndirections for use.\nLevel\nRefers to the category according to the level of difficulty\nand complexity of skills and knowledge required to the job\nLow Level Fireworks\n(Also Ground-to-Air Fireworks) Any of a class of fireworks\ndevices that either perform below approximately 200 feet\n(60 m) or begin their display at ground level and rise to\ncomplete their effect. Some examples of low level\nfireworks are comets, mines, roman candles, and many\nconsumer fireworks.\nMortar\nA tube from which certain aerial devices are fired into the\nair.\nMortar Rack\nSturdy wooden or metal frames used to support mortars\nin an upright position usually above ground.\n\n--- PDF PAGE 74 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n74\nOccupational Safety\nand Health Center\n(OSHC) - A government agency that promotes and\nprotects\nworkers’\nwelfare\nthrough\neffective\nimplementation of the OSH programs that will enhance\nproductivity and subsequently contribute to national\neconomic development efforts as well as preventive\napproach of reducing/eliminating occupational accidents\nand illnesses in the workplace.\nPerformance Criteria\nAre evaluative statements that specify what is to be\nassessed and the required level of performance\nPTQF\nIt provides a comprehensive, nationally consistent\nframework for qualifications in the TVET sector. It also\nprovides the parameter for the integration of learning and\nassessment in the middle skills development\nPyrotechnic Device\nAny device containing pyrotechnic materials and capable\nof producing a special effect.\nPyrotechnic Material\nA chemical mixture used in the entertainment industry to\nproduce visible or audible effects by combustion,\ndeflagration, or detonation.\nPyrotechnic Special\nEffect\nA special effect created through the use of pyrotechnic\nmaterials and devices.\nPyrotechnics\nControlled exothermic chemical reactions that are timed\nto create the effects of heat, gas, sound, dispersion of\naerosols, emission of visible electromagnetic radiation, or\na combination of these effects to provide the maximum\neffect from the least volume.\n Qualification\nRefers to the national certificate issued by the TESDA or\nits accredited industry organizations in recognition that a\nperson has achieved competencies relevant to a trade or\nindustry.\nRange of Variable\nDescribes the circumstances or context in which the work\nis to be performed.\nRoman Candle\nA chain-fused firework that propels a series of aerial shell,\ncomet or mine effects into the air from a single tube.\nSafety Cap\nA tube, closed at one end that is placed over the end of\nthe fuse until intended ignition to protect it from damage\nand accidental ignition.\n\n--- PDF PAGE 75 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n75\n\nSparklers\nA very different from firecrackers. A sparkler burns over a\nlong period of time (up to 1 minute) and produces\nextremely bright and showery light.\nTheatrical\nPyrotechnics\nPyrotechnic\ndevices\nfor\nprofessional\nuse\nin\nthe\nentertainment industry. Similar to consumer fireworks in\nchemical composition and construction but not intended\nfor consumer use.\nUnit of competency\nDescribe a work activity.\n\n--- PDF PAGE 76 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n76",
