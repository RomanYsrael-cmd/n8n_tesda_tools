ed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 14 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n12\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply\nwith regulatory and organizational requirements for\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n\n2.2 Effects of the hazards are determined\n\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 15 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\\\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 16 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n14\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n 2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\n gasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 17 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n15\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal\nrecords\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 18 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n16\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\n Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning Skills\n\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.3 Communication skills\n\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 19 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n17\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\n\nOBSERVE PROCEDURES, SPECIFICATIONS\nAND MANUALS OF INSTRUCTIONS\nUNIT CODE :\nPYR311202\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin identifying, interpreting, applying services to\nspecifications and manuals, and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and accessed\nas per job requirements.\n1.2 Version and date of manual are checked to\nensure that correct specification and procedure\nare identified.\n2. Interpret manuals\n\n2.1 Relevant\nsections/\nchapters\nof\nspecifications/manuals are located in relation to\nthe work to be conducted.\n2.2 Information and procedure in the manual are\ninterpreted in accordance with industry practices.\n3. Apply information in\nmanual\n3.1 Manual\nis\ninterpreted\naccording\nto\njob\nrequirements.\n3.2 Work steps are correctly identified in accordance\nwith manufacturer’s specification.\n3.3 Manual data are applied according to the given\ntask.\n3.4 All correct sequencing and adjustments are\ninterpreted\nin\naccordance\nwith\ninformation\ncontained on the manual or specifications.\n4. Store manuals\n4.1 Manual or specification is stored appropriately to\nensure prevention of damage, ready access and\nupdating\nof\ninformation\nwhen\nrequired\nin\naccordance with company requirements.\n\n--- PDF PAGE 20 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n18\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Procedures,\nSpecifications and\nMnanuals of instructions\n\nKinds of Manuals:\n• Manufacturer’s Specification Manual\n• Repair Manual\n• Maintenance Procedure Manual\n• Periodic Maintenance Manual\n\n--- PDF PAGE 21 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n19\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed specification/manuals as per\njob requirements.\n1.2 Interpreted manuals in accordance with industry\npractices.\n1.3 Applied information in manuals according to the given\ntask.\n1.4 Stored manuals in accordance with company\nrequirements.\n2. Underpinning\nKnowledge\n2.1 Type of manuals used in Pyrotechnics Sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit of conversion\n3. Underpinning Skills\n3.1 Reading and comprehension skills required to identify\nand interpret pyrotechnics manuals and specifications\n3.2 Accessing information and data\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to Pyrotechnics sector\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions/Interview\n6. Context for\nAssessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or\nsimulated environment\n\n--- PDF PAGE 22 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n20\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATIONS AND\nCALCULATIONS\nUNIT CODE :\nPYR311203\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin identifying and measuring objects based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select measuring\ninstrument\n\n1.1 Object or component to be measured is\nidentified, classified and interpreted to the\nappropriate geometric shape.\n1.2 Measuring tools are selected/identified as per\nobject to be measured or job requirements\n1.3 Correct specifications are obtained from relevant\nsources.\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.5 Alternative measuring tools are used without\nsacrificing cost and quality of work.\n2. Carry out measurements\nand calculations\n\n2.1 Accurate\nmeasurements\nare\nobtained\naccording to job requirements.\n2.2 Alternative measuring tools are used without\nsacrificing cost and quality of work.\n2.3 Calculation needed to complete work tasks are\nperformed using four basic process of addition\n(+),\nsubtraction\n(-)\nmultiplication\n(x)\nand\ndivision(/) including but not limited to\ntrigonometric functions, algebraic computations\n2.4 Calculations involving fractions, percentages\nand mixed numbers are used to complete\nworkplace tasks.\n2.5 Numerical computation is self-checked and\ncorrected for accuracy.\n2.6 Instruments are read to the limit of accuracy of\nthe tool.\n2.7 Systems of measurement are identified and\nconverted according to job requirements/ISO\n2.8 Workpieces are measured according to job\nrequirements.\n\n--- PDF PAGE 23 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n21\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Geometric shape\n\nIncluding but not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring instruments\n\nIncluding but not limited to:\n2.1 tape measure\n2.2 caliper\n2.3 weighing scale\n3. Measurements and\ncalculations\n\nIncluding but not limited to:\n3.1 size\n3.2 width\n3.3 length\n3.4 weight\n3.5 area\n3.6 volume\n3.7 diameter\n3.8 thickness\n3.9 frequency\n\n--- PDF PAGE 24 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n22\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared appropriate measuring\ninstruments in accordance with job requirements\n1.2 Performed measurements and calculations according to\njob requirements/ISO\n2. Underpinning\nKnowledge\n2.1 TRADE MATHEMATICS/MENSURATION\n2.1.1 Four fundamental operation\n2.1.2 Linear measurement\n2.1.3 Dimensions\n2.1.4 Unit conversion\n2.1.5 Ratio and proportion\n2.1.6 Trigonometric functions\n2.1.7 Algebraic equations\n3. Underpinning\nSkills\n3.1 Performing\ncalculation\nby\naddition,\nsubtraction,\nmultiplication and division: trigonometric functions and\nalgebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of\nplane and geometric figures\n3.4 Proper handling of measuring instruments\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions/Interview\n6. Context for\nAssessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 25 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n23\n\nUNIT OF COMPETENCY :\nPERFORM FIRE FIGHTING AND FIRE\nPREVENTION\nUNIT CODE :\nPYR516201\n\nUNIT DESCRIPTOR :\nThis unit identifies the competence required to\nprevent and fight fires including management of fire\nprevention measures, initiation and management of\nevacuation, emergency shutdown and isolation\nprocedures and the execution and coordination of\nfire fighting operations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Manage fire prevention\nprocedures\n\n1.1 Fire hazards are identified and action is taken to\neliminate or minimize them\n1.2 Fire detection and fire fighting equipment and\nsystems are regularly checked and appropriate\naction is taken to ensure that they are operational\n1.3 Appropriate educational activities are organized\nto ensure that personnel are aware of the\ndangers of fire, how to prevent it and what to do if\na fire is detected\n1.4 Personnel in the workplace are made aware of\nemergency procedures to be followed in the event\nof fire\n2. Operate fire fighting\nequipment\n\n2.1 Classes of fires are correctly identified in\naccordance with accepted fire-fighting practice\n2.2 Correct\nportable\nfire-fighting\nequipment\nis\nselected and used to fight specific classes of fire\n2.3 Class F fires are correctly extinguished with a fire\nblanket in accordance with accepted fire-fighting\npractice\n2.4 Methods of extinguishing fire in the workplace\nare correctly applied\n2.5 Correct techniques are applied for the setting up\nof foam-making equipment to extinguish B Class\nFires on board vessel\n2.6 Where applicable, correct techniques are used to\nrecharge the various types of portable fire\nextinguisher\n2.7 Where applicable, portable fire fighting equipment\nis confirmed as operational following recharging\n\n--- PDF PAGE 26 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n24\n\n3. Conduct interior search\nand rescue fire-fighting\noperations (where\napplicable)\n3.1 Search and rescue operations in a smoke filled\nenvironment are correctly conducted as a\nmember of a fire-fighting team in accordance\nwith accepted fire-fighting practice\n3.2 Interior fires are extinguished using appropriate\nfirefighting equipment and procedures as a\nmember of a fire fighting team in accordance\nwith accepted firefighting practice\n3.3 Lifeline signals are correctly used during interior\nfirefighting operations\n\n--- PDF PAGE 27 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n25\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Classes of fire\n\nClass A\n1.1 All solid materials, usually organic origin in nature\n(contains compounds of carbon) and generally\nproduce glowing embers- i.e., wood, textiles,\ncurtains, furniture and plastics\nClass B\n1.2 All flammable liquids and solids, which can also\nbe sub-divided into:\n1.3 Miscible with water (i.e., petrol, oils, lubricants,\npaints and waxes)\n1.4 Non miscible with water (i.e., alcohol)\nClass C\n1.5 Fires involving domestic main gas, cylinder gases\n(i.e., Acetylene) or Liquid Petroleum Gases\n(LPG) such as Butane or Propane\nClass D\n1.6 Fires involving metals (where water is generally\nineffective and dangerous) i.e., metal powders\nsuch as magnesium, titanium, and alloys, etc.\nClass F\n1.7 New\nclass\nspecifically\ndealing\nwith\nhigh\ntemperature (360 degree centigrade) cooking oils\nin large industrial catering kitchens, restaurants\nand take-away establishments, etc.\nElectrical\n1.8 Electrical fires are not considered to continue a\nfire class on their own,, as electricity is a source\nof ignition that will feed the fire until removed.\nWhen the electrical supply has been isolated, the\nfire can be treated (generally) as Class A for\nextinguishing purposes. However, you should\nuse a non-conducting agent on all possible\noccasions.\n\n--- PDF PAGE 28 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n26\n\n2. Fire detection and fire\nfighting equipment and\nsystem\n\n2.1 Portable fire extinguisher including foam, water,\nCO2, dry chemical and wet foam\n2.2 Fire blankets\n2.3 CO2 fixed system\n2.4 Foam installation including semi-portable and\nfixed system\n2.5 Sprinkler system\n2.6 Fire pumps (main and emergency fire pump)\n2.7 Fire hoses, hydrants, branches and international\nshore connection\n3. Methods of extinguishing\nfire\n\n3.1 Cooling\n3.2 Reducing the ignition temperature by taking the\nheat out of the fire – using water (limiting the\ntemperature)\n3.3 Smothering\n3.4 Limiting the oxygen available by smothering and\npreventing the mixture of oxygen and flammable\nvapour – by use of foam or a fire blanket\n3.5 Starving\n3.6 Limiting the fuel supply – by removing the source\nof fuel; by switching off electrical power, isolating\nthe flow of flammable liquids or pulling away\nburning wood or straw, etc.\n3.7 Chemical reaction\n3.8 By interrupting the chain of combustion and\ncombining the hydrogen atoms with chlorine\natoms in the hydrocarbon chain, e.g. Halons\nextinguisher\n (NB: Halons have now generally been withdrawn\nunder the Montreal Protocol of 1990, as ozone\ndepleting agents)\n\n--- PDF PAGE 29 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n27\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Managed and implemented fire prevention measures and\nprocedures on board a vessel\n1.2 Assessed the operational capability of the fire detection\nand firefighting equipment and systems and initiate any\nrequired maintenance or replenishment action\n1.3 Participated in simulated firefighting activities\n1.4 Participated in search and rescue and firefighting teams\n1.5 Implemented OHS principles and policies when carrying\nout firefighting duties\n1.6 Communicated effectively with others as required during\nfire emergencies\n2. Underpinning\nKnowledge\n2.1 Types of fire detection, firefighting, life saving and safety\nequipment and systems used in the workplace and the\nprocedures for their use.\n2.2 Relevant regulations, code of practice, policies and\nprocedures related to the maintenance of fire detection,\nfire fighting, the life saving and safety equipment and\nsystem\n2.3 Faults that can occur with workplace fire detection, fire\nfighting, life saving and safety equipment and appropriate\nremedial action and solutions\n2.4 Statutory and typical company requirements for the\ndocumentation of maintenance procedures and outcomes\nfor fire detection, fire fighting, life saving and safety\nequipment and systems used in the workplace\n3. Underpinning\nSkills\n3.1\nProcedures in checking and replacing consumable\nmaterials in typical workplace fire detection, fire fighting\nand safety equipment and system\n3.2\nProcedures in identifying and evaluating operational\nand maintenance problems with fire detection, fire\nfighting, life saving and safety equipment and systems\nand determining appropriate courses of action\n3.3\nProcedures\nin\nidentifying\nand\nimplementing\nimprovements to maintenance for fire detection and fire\nfighting\n3.4\nProcedures in workplace housekeeping processes\n\n--- PDF PAGE 30 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n28\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Tools\nand\nequipment\nappropriate\nto\nschedule\nhousekeeping activities and to monitor and maintain\nworking condition\n4.3 Material relevant to the proposed activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2 Under general guidance, checking various stages of the\nprocesses and at the completion of the activity against\nperformance criteria and specifications\n5.3 While tasks are being undertaken\n6. Context for\nAssessment\n6.1 Assessment may be conducted in the workplace or\nsimulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group in accordance\nwith the approved industry OHSA regulations\n\n--- PDF PAGE 31 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n29\nUNIT OF COMPETENCY :\nAPPLY FIRST AID TREATMENT\n\nUNIT CODE :\nPYR513201\nUNIT DESCRIPTOR :\nThis unit identifies the competence required to\nperform fist aid treatment to workers during a\nmedical emergency in the workplace, including the\nperformance of immediate life saving first aid until\nqualified medical assistance is available, the\nrecognition of symptoms and sign of acute illness\nand or injury and the taking of appropriate action.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform immediate life\nsaving first aid pending\nthe arrival of medical\nassistance\n\n1.1 The priorities of First Aid Care are correctly\napplied in real or simulated first aid situation\n1.2 The DRABC Action Plan is correctly used to\nidentify and control danger, loss of consciousness,\nloss of airway, breathing and circulation\n1.3 An unconscious casualty is correctly placed in\nstable side position and the steps in clearing the\nairways to promote breathing in accordance with\nestablished first aid procedures\n1.4 The correct method of Expired Air Resuscitation\n(EAR), External Cardiac Compression (ECC) and\nCardio Pulmonary Resuscitation (CPR) is applied\nin real life resuscitation situation or in a simulated\nexercise using a mannequin\n2. Recognize the\nsymptoms and acute\nillness and or injury and\ntake appropriate action\n\n2.1 The conditions requiring special first aid\nprocedures are correctly identified\n2.2 A real or simulated unconscious casualty is cared\nfor in accordance with established first aid\nprocedures\n2.3 Cause of respiratory failure and breathing difficulty\nare correctly identified and appropriate care is\nprovided for a real or simulated casualty with\nobstructed breathing\n2.4 The symptoms and signs of casualty with angina\npain, heart attack and heart failure are correctly\nidentified\n2.5 The symptoms and signs of poisoning, bites and\nstings are correctly identified and appropriate\nimmediate management of the conditions is\nprovided in real or simulated situation\n2.6 A real or simulated conscious casualty with an\nacute illness and or injury is cared for in\naccordance with established first aid procedures\n\n--- PDF PAGE 32 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n30\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Manage wounds and\nbleeding\n3.1 Severe external bleeding is correctly controlled in a\nreal or simulated situation\n3.2 The symptoms and signs of severe internal\nbleeding are correctly identified and appropriate\nimmediate management of these conditions is\nprovided in a real or simulated situation\n3.3 A real or simulated laceration, abrasion and a deep\npuncture wound is correctly manage in accordance\nwith established first aid procedures\n3.4 The signs of wound infection is correctly managed\nin accordance with established procedures\n\n4. Manage burns\n4.1 Immediate rescue procedures are correctly used in\nreal or simulated first aid situations involving a\nburned casualty\n4.2 The severity of burn is correctly assessed in terms\nof depth, position and size in accordance with\nestablished procedures\n4.3 The correct method of treatment for burns and\nassociated shock is correctly applied in real or\nsimulated first aid situations involving a burned\ncasualty\n\n5. Manage bone, joint and\nmuscles injuries\n5.1 Symptoms and signs of fractures (simple and\ncomplicated)\nare\ncorrectly\nrecognized\nin\naccordance with established first aid procedures\n5.2 Problems and treatment associated with dislocated\njoints are correctly managed in accordance with\nestablished procedures\n5.3 First aid treatment of pelvic and chest injuries and\nfractures\nof\nlimbs,\nincluding\nimmobilization\ntechniques is correctly performed in accordance\nwith established procedures\n5.4 The symptoms and signs of sprains and strains are\ncorrectly identified in accordance with established\nprocedures\n\n--- PDF PAGE 33 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n31\n\n6. Adapt first aid procedures\nfor remote situations\n6.1 Safety precautions needed to prevent accidents,\nillness and injuries and infection in remote\nsituations are correctly applied in real or\nsimulated situations\n6.2 Identify and discuss the factors involved in the\nprevention of heat and cold exposure\n6.3 The symptoms and signs of real or simulated\ncasualty exposed to heat or cold are correctly\nidentified\nincluding\nhyperthermia\nand\nhypothermia and appropriate management of the\ncasualty\ncarried\nout\nin\naccordance\nwith\nestablished procedures\n6.4 A real or simulated ill or injured person in remote\nconditions is correctly cared for until help arrives,\nincluding the monitoring of airway, breathing and\nheart beat, the control of pain, hydration and\nmaintenance of body temperature\n6.5 First\naid\nresources\nand\nemergency\nequipment required for remote area situations\nare correctly identified and used in real or\nsimulated\nsituations\nin\naccordance\nwith\nestablished first aid procedures\n\n--- PDF PAGE 34 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n32\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. First aid care in a\nworkplace may need to be\nprovided in situation\ninvolving:\n1.1 Acute illness or injury\n1.2 Laceration, abrasion and a deep puncture\nwounds\n1.3 Respiratory failure and breathing difficulty\n1.4 Shock as a result of severe injury\n1.5 Abdominal, pelvic and chest injuries\n1.6 Fractures of limbs\n1.7 Poisoning, bites and stings\n1.8 Sprains, strains and dislocations\n1.9 Facial, ear and eye injuries\n1.10 Suspected head, neck and back injuries\n2. Conditions requiring\nspecial first aid procedures\ninclude:\n\n2.1 Explosion injuries\n2.2 Burns\n2.3 Poisons and envenomation\n2.4 Hypothermia and hyperthemia\n3. First aid resources and\nequipment include:\n\n3.1 Medicine cabinet\n3.2 First aid boxes\n3.3 Emergency first aid carry bags\n3.4 Specific first aid resources\n3.5 Roller bandages\n3.6 Triangular bandages\n3.7 Face masks\n3.8 Cleaning swabs\n3.9 Cleaning brush\n3.10\nCleaning materials\n3.11\nMedicines\n\n--- PDF PAGE 35 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n33\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed immediate life saving first aid\n1.2 Recognized the symptoms and sign of acute illness and\nor injury and take appropriate action\n1.3 Managed wounds and bleeding\n1.4 Managed burns\n1.5 Managed bone, joints and muscle injuries\n1.6 Adapted first aid procedures for remote situation\n1.7 Communicated effectively with others during provision of\nfirst aid\n1.8 Prepared report on first aid situations and activities in\naccordance with company and regulatory requirements\n2. Underpinning\nknowledge and\nattitude\n2.1 Duties and responsibilities of the designated first aid\nofficer in the workplace\n2.2 Knowledge on ways on how disease can spread in the\nworkplace and ways of preventing the spread\n2.3 Legal issues related to administration of drugs and\nmedicines in the workplace\n2.4 Knowledge on body structures and functions relevant to\npossible injury, illnesses and disease that may be\nencountered in the workplace\n3. Underpinning\nskills\n\n3.1 Medical first aid procedures\n3.2 Procedures for conducting an initial patient first aid\ntreatment\n3.3 Managing injuries and medical emergencies\n3.4 Managing medical resources\n3.5 Techniques for care of wounds\n3.6 Correct methods of Expired Air Resuscitation (EAR),\nExternal Cardiac Compression (ECC) and Cardio\nPulmonary Resuscitation (CPR)\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Tools\nand\nequipment\nappropriate\nto\nschedule\nhousekeeping activities and to monitor and maintain\nworking condition\n4.3 Material relevant to the activity and tasks\n\n--- PDF PAGE 36 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n34\n\n5. Method of\nassessment\n\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2 Under general guidance, checking various stages of the\nprocesses and at the completion of the activity against\nperformance criteria and specifications\n5.3 While tasks are being undertaken\n6. Context for\nassessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 37 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n35\n\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\nUNIT CODE : PYR311205\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required\nin\ninspecting\nthe\nwork\ndone\nagainst\njob\nspecification and company standards, applying\nquality standards to work and protecting company\nproperty and customer interests.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect work done against\njob specification\n1.1 Inspections are conducted according to\ncompany quality systems and procedures\n\n1.2 Job specification/work order and quality\nstandards are identified\n\n1.3 Faults are identified and processed according\nto company procedures\n2. Apply quality standards to\nwork\n2.1 Monitoring of manufacturing processes is\nconducted to maintain quality standards\n\n2.2 Quality standards are applied throughout the\nmanufacturing processes\n\n2.3 Activities are coordinated throughout the\nworkplace for efficient quality work\n\n2.4 Records of work quality are maintained\naccording to the requirements of the company\n3. Protect company property\nand customer interests\n3.1 Possible damage to company property is\navoided by adhering to company quality\nprocedures\n\n3.2 Quality of work is reviewed to ensure customer\nrequirements and company standards are met\n\n--- PDF PAGE 38 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n38\n\n RANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Quality systems and\nprocedures may include\n\n1.1 ISO 9000\n1.2 Phil. Quality Standard\n1.3 Other relevant quality system standard\n1.4 Industry/workplace codes of practice\n2. Quality Standards may\nrelate to:\n\n2.1 Materials\n2.2 Component parts\n2.3 Final product\n2.4 Production processes\n3. Company quality\nprocedures\n\n3.1 Company quality system\n3.2 Company operating procedures\n3.3 Organization work procedures\n3.4 Work instructions, patterns and designs\n\n--- PDF PAGE 39 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n39\n\n EVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Inspected and applied quality standards to\nwork done\n1.2 Protected company property and customer\ninterests\n1.3 Conducted periodic inspections during the job\n1.4 Observed and assessed work against work\nspecifications at completion of the job\n1.5 Checked and completed documentation\nrequirements written/electronic\n2. Underpinning Knowledge\nand Attitudes\n2.1 Communication/feedback methods\n2.2 Company systems, processes and work\nquality requirements\n2.3 Work inspection techniques\n2.4 Quality assurance principles\n3. Underpinning Skills\n3.1 Inspection techniques\n3.2 Monitoring process\n3.3 Coordinating with co-workers for efficient\nquality work\n3.4 Applied quality standards to work done\n4. Resource Implications\nThe following resources should be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment\ncan take place\n4.2 Materials relevant to the proposed activity or\ntask\n5. Methods of Assessment\n5.1 Direct observation of work activities related to\ndrafting and cutting of casual apparel pattern\n5.2 Authenticated transcript of relevant\neducation/training\n6. Context for Assessment\n6.1 Competency assessment may occur in\nworkplace or any appropriately simulated\nenvironment\n6.2 Assessment shall be observed while tasks are\nbeing undertaken\n\n--- PDF PAGE 40 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n40\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nACQUIRE AND STORE CHEMICALS FOR\nPYROTECHNIC PRODUCTS\nUNIT CODE :\nPYR311301\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge, skills and\nattitudes\nin\nprocuring,\nhandling\nand\nstoring\nchemicals for pyrotechnic production in a safe\nmanner.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Initiate procurement of\nchemicals for pyrotechnic\nproduct\n\n1.1 Specifications and quantity of chemicals are\nprepared based on production requirements.\n1.2 Sources/suppliers of chemicals are identified for\nprocurement.\n1.3 Chemicals are procured in accordance to legal\nand other statutory requirements.\n2. Store chemicals\n\n2.1 All chemicals procured are properly identified\nand labeled in sealed container/packaging.\n2.2 Chemicals are stored in warehouse/storage\nmagazine or separate location designated for\nthis\npurpose\nand\nin\naccordance\nwith\nestablished/recommended procedures.\n2.3 Chemical materials are secured from rain or\nexcessive heat during storage.\n2.4 Storage area is cleaned up and made safe in\naccordance with OH & S requirements\n2.5 Unexpected situations are responded to in\n accordance with company rules and\n regulations.\n\n--- PDF PAGE 41 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n41\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Legal or other statutory\nrequirements\n\nMay include but not limited to:\n1.1 Permit to possess explosive ingredients\n1.2 Permit to transport\n1.3 Permit to purchase\n1.4 From other gov’t. agencies having jurisdiction\n1.5 Permit to manufacture\n2. Established/recommended\nprocedures\n\nMay include but not limited to:\n2.1 Material Safety Data Sheet (MSDS)\n2.2 Recommendation\n2.3 Explosive Regulations\n3. Unexpected situations\nMay include but not limited to:\n3.1 Fire\n3.2 Spark\n3.3 Explosion\n3.4 Smoke\n3.5 Suffocation\n\n--- PDF PAGE 42 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n42\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to compute the required chemicals\nbased on production requirements.\n1.2 Demonstrated ability to recommend specific\nsuppliers/sources\n1.3 Demonstrated understanding on the legal and other\nstatutory requirements for procuring chemical.\n1.4 Demonstrated ability to identify, mark and label chemicals\naccording to content.\n1.5 Demonstrated ability to separate and store chemicals to\nrespective warehouse/magazine.\n1.6 Following safety handling and storing procedures and\npractices.\n2. Underpinning\nKnowledge\n2.1 Basic Mathematics\n2.2 Mensuration\n2.3 Chemical dealers\n2.4 Legal\nand\nstatutory\nrequirements\nfor\npurchasing\nchemicals\n2.5 Basic test of chemicals\n2.6 Interpret product chemical manual\n3. Underpinning\nSkills\n3.1 Calculating\n3.2 Measuring\n3.3 Identifying chemical dealers\n3.4 Interpreting legal and statutory requirements\n3.5 Testing chemicals\n3.6 Interpreting product chemical manual\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Warehouse/storage magazine\n4.2 Laboratory\n4.3 Chemicals and materials relevant to the activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation of application of tasks\n5.2 Demonstration with oral questioning\n5.3 Written test\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace – to\n observe/check workmanship, correct function of work,\nlength\n of time in doing the work\n\n--- PDF PAGE 43 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n43\n\nUNIT OF COMPETENCY :\nMAKE CYLINDER CONTAINER FOR\nPYROTECHNIC PRODUCTS\nUNIT CODE :\nPYR311302\nUNIT DESCRIPTOR :\nThis unit covers the required knowledge, skills and\nattitudes\nin\nmaking\ncylinder\ncontainer\nfor\npyrotechnic products.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare paste\n\n1.1 Work instruction is secured from appropriate\npersonnel.\n1.2 Flour/starch\nis\nmixed\nwith\nwater\nand\npreservative based on desired concentration.\n1.3 Mixture is boiled to desired consistency.\n2. Roll and dry paper into\ncylinder or tubing\n\n2.1 End of chipboard paper is scraped to desired\nthickness prior to rolling.\n2.2 Appropriate thin film of paste is applied to paper.\n2.3 Paper is rolled into cylindrical container using\n former in accordance with specifications.\n2.4 Rolled paper into cylinder tube is dried to\n desired condition/quality.\n\n--- PDF PAGE 44 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n44\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Pyrotechnic products\n\nMay include but not limited to:\n1.1 Skyrockets/baby rockets\n1.2 Illuminating candle/torch\n1.3 Whistle bomb/crying cow\n1.4 Trompillo\n1.5 Roman candle\n2. Appropriate personnel\n\nMay include but not limited to:\n2.1 Pyrotechnician II\n2.2 Pyrotechnician III\n2.3 Pyrotechnician IV\n2.4 Manager/Owner\n3. Preservative\n\nMay include but not limited to:\n3.1 Alum crystal/tawas\n3.2 Vinegar\n3.3 Copper sulfate\n3.4 Lime/apog\n4. Paper\n\nMay include but not limited to:\n4.1 Chipboard\n4.2 Newsprint\n4.3 Kraft paper\n4.4 Brown or Manila paper\n4.5 Glazine paper\n5. Specifications\n\nMay include but not limited to\n5.1 Thickness\n5.2 Length\n5.3 Diameter\n5.4 Width\n6. Dried\n\nMay include but not limited to:\n6.1 Sun dry\n6.2 Air dry\n6.3 Oven dry\n6.4 Stir frying\n\n--- PDF PAGE 45 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n45\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce cylinder containers to\ndesired quality and specifications\n1.2 Demonstrated ability to produce cylinder containers at the\n right time, desired quantity and with minimal wastage on\nthe use of materials.\n1.3 Demonstrated ability to follow work instructions.\n2. Underpinning\nKnowledge\n2.1 Procedures in preparing and preserving paste\n2.2 Procedures in preparing cylinders for pyrotechnics\n2.3 Types and uses of cylinder materials\n2.4 Types and uses of preservatives\n2.5 Follow work instructions\n3. Underpinning\nSkills\n3.1 Following procedures in preparing and preserving paste\n3.2 Following procedures in preparing cylinders for\n pyrotechnics\n3.3 Using cylinder materials\n3.4 Using preservatives\n3.5 Following work instructions\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Access to workplace and materials for producing cylinder\n containers\n4.2 Materials and equipment relevant to the activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration or direct observation with oral questioning\n6. Context for\nAssessment\n6.1 Competency should be assessed while work is being\n undertaken at the work place or in a simulated venue.\n\n--- PDF PAGE 46 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n46\n\nUNIT OF COMPETENCY :\nWRAP/PACKAGE PYROTECHNIC PRODUCTS\nUNIT CODE :\nPYR311303\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge, skills and\nattitudes required in wrapping/packaging pyrotechnic\nproducts.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Wrap pyrotechnic\nproducts\n\n1.1 Pyrotechnic products are wrapped using\nspecified wrapping material.\n1.2 Wrapping is performed in accordance with\nestablished wrapping procedures and safety\nprecautions.\n1.3 Label is attached to wrapper for marketability,\nfor instruction and proper use of pyrotechnics.\n2. Pack pyrotechnic products 2.1 Wrapped loaded containers are dried based\n on product specification.\n2.2 Wrapped loaded containers are packed,\n bundled and properly labeled according to\n specification.\n2.3 Wrapped loaded containers are transported\n and stored in the warehouse.\n\n--- PDF PAGE 47 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n47\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Pyrotechnic products\n\nMay include but not limited to:\n1.1 Skyrockets/baby rockets\n1.2 Illuminating candle/torch\n1.3 Whistle bomb/crying cow\n1.4 Trompillo\n1.5 Roman candle\n2. Wrapping material\n\nMay include but not limited to:\nclassified as:\n2.1 Type e.g., Christmas wrapper, glossy paper\n2.2 Size\n2.3 Color\n3. Established wrapping\nprocedures\n\nMay include but not limited to:\n3.1 Wrapping procedures for Skyrocket\n3.2 Wrapping procedures for Whistle Bomb\n3.3 Wrapping procedures for Fountain\n3.4 Wrapping procedures for Roman Candle\n3.5 Wrapping procedures for Trompillo\n4. Label\n\nMay include but not limited to:\n4.1 Product name\n4.2 Manufacturer’s name and address\n4.3 DTI No.\n4.4 License No.\n4.5 Instructions for proper use of pyrotechnics\n4.6 Warning signages\n5. Specification\nMay include but not limited to:\n5.1 Illuminating candle (100 pieces per bundle, per\nbox)\n5.2 Sparklers (packing by 100 pieces [1st 50 pieces\nwith handle first; 2nd 50 pieces with sparklers\nfirst])\n5.3 Skyrockets (100 pieces per box)\n5.4 Whistle bomb (100 pieces per box)\n5.5 Packing by gross (144 pieces)\n6. Dried\nMay include but not limited to:\n6.1 Sun dry\n6.2 Air dry\n\n--- PDF PAGE 48 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n48\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to perform quality wrapping,\nlabeling and packaging with minimal waste of\nmaterial.\n1.2 Demonstrated ability to perform drying, wrapping and\n packaging in accordance with established procedures\nand safety precautions.\n\n2. Underpinning\nKnowledge\n2.1 Sizes, types and colors of wrapping and packaging\nmaterials\n2.2 Wrapping and packaging procedures\n2.3 Labeling requirements\n2.4 Handling and storage procedures for pyrotechnic\nproducts\n3. Underpinning Skills\n3.1 Using appropriate wrapping and packaging materials\n3.2 Following wrapping and packaging procedures\n3.3 Following labeling requirements\n3.4 Applying handling and storage procedures\n4. Resource Implications The following resources should be provided:\n4.1 Workplace locations\n4.2 Wrapping and packaging materials\n4.3 Sample of pyrotechnic products to be wrapped,\nlabeled and packaged.\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n\n5.1 Practical observation or demonstration with oral\n questioning\n6. Context for\nAssessment\n6.1 Assessment shall be undertaken while work is being\n performed in the workplace or in a simulated venue.\n\n--- PDF PAGE 49 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n49\n\nUNIT OF COMPETENCY :\nLOAD MIXED COMPOSITION INTO CONTAINER\nUNIT CODE :\nPYR311304\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin loading mixed composition into container in a safe\nmanner.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Load fireworks\n1.1 Specific type of container is selected and\n checked based on product requirement\n1.2 Chemical mixture and proportions are\n selected and checked based on fireworks\n quality requirements.\n1.3 Mixed composition is loaded in container\n following loading procedures as per\n pyrotechnic product based on recommended\n standard and safety practices.\n1.4 Loading is performed using appropriate tools\n and equipment and with minimum wastage.\n1.5 Unexpected situations are responded to in\n accordance with company rules and regulations\n2. Install safety fuse\n2.1 Safety fuse is installed according to product\nstandard.\n2.2 Initial loaded mixture is tested as to desired\nperformance\nand\nbased\non\nproduct\nrequirements.\n2.3 Deficiencies are corrected based on test\nperformance.\n2.4 Unexpected situations are responded to in\naccordance with company rules and regulations\n\n--- PDF PAGE 50 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n50\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Mixed composition\n\nMay include but not limited to:\n1.1 Pressed\n1.2 Rolled\n1.3 Wet\n1.4 Dry\n1.5 Sun dry\n1.6 Rounded\n1.7 Moulded\n2. Container\n\nMay include but not limited to:\n2.1 Paper tube\n2.2 Triangular kraft paper\n2.3 Plastic tube\n2.4 Cone\n2.5 Glazing paper\n2.6 Newsprint\n2.7 Spherical container (plastic or paper)\n2.8 Chip board\n3. Loading procedures\n\nMay include but not limited to:\n3.1 Ram\n3.2 Press\n3.3 Pour\n3.4 Mold\n4. Safe practices\n\nMay include but not limited to:\n4.1 Avoid use of metal accessories while loading\n4.2 Avoid use of electronic devices with loading\n4.3 Avoid use of fluorescent light in a nearby\n loading area\n4.4 Avoid cooking in a nearby loading area\n4.5 Use appropriate PPE e.g., dust mask\n4.6 Fingernails are newly cut\n5. Tools and equipment\n\nMay include but not limited to:\n5.1 Tools\no Paper funnel/imbudo\no Rammer\n5.2 Equipment\no Apron\no Dust mask\no\nGloves\n\n--- PDF PAGE 51 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n51\n\nVARIABLE\nRANGE\n6. Unexpected situations\n\nMay include but not limited to:\n6.1 Sparks\n6.2 Ignition/burning\n6.3 Explosion\n6.4 Chemical reactions\n6.5 Accident due to testing\n7. Product standard\n\nMay include but not limited to:\n7.1 Philippine standard\n7.2 International standard\n\n--- PDF PAGE 52 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n52\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to follow work instructions\n1.2 Demonstrated ability to identify the required materials.\n1.3 Demonstrated ability to select prescribed container\n1.4 Demonstrated ability to produce quality pyrotechnic\n products after loading operation\n1.5 Demonstrated ability to follow proper loading procedures\n2. Underpinning\nKnowledge\n2.1 Interpret work instructions\n2.2 Types and uses of containers\n2.5 Follow product specifications\n2.6 Follow proper loading procedures\n2.7 Types and uses of PPE\n3. Underpinning\nSkills\n3.1 Interpreting work instructions\n3.2 Using prescribed containers\n3.3 Following safety requirements\n3.4 Following product specifications\n3.5 Following established loading procedures\n3.6 Using PPE\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Chemicals and materials relevant to the activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation (actual) or demonstration and oral\n questioning\n6. Context for\nAssessment\n6.1 Assessment shall be done while the work is being\nperformed in the workplace or in a simulated venue.\n\n--- PDF PAGE 53 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n53\n\nUNIT OF COMPETENCY :\nPREPARE SAFETY FUSE FOR FIREWORKS\nUNIT CODE :\nPYR311305\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge, skills and\nattitudes in preparing safety fuse for fireworks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and mix fuse\ningredients\n\n1.1 Black powder is prepared from recommended\nraw material.\n1.2 Fuse ingredients are weighed and measured in\naccordance with pyrotechnic product safety\nfuse specifications.\n1.3 Chemical ingredients are pounded/sieved into\ndesired mesh size.\n1.4 Chemicals are mixed using wet process\nfollowing safety and quality requirements.\n2. Make fuse\n2.1 Cotton string or paper is dipped/soaked in\nmixture\nin\naccordance\nwith\nestablished\nprocedures.\n2.2 Soaked string is dried and wrapped and cut\ninto pieces into desired specifications.\n2.3 Sample safety fuse is tested according to job\n requirement.\n2.4 Finished safety fuse stored in designated\n location in accordance with safety procedures.\n\n--- PDF PAGE 54 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n54\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Pyrotechnic product safety\nfuse specification\n\nMay include but are not limited to:\n1.1 Initial fuse (burning time of not less than 3\nseconds and not more than 6 seconds)\n1.2 Time delayed fuse\n2. Chemical ingredients\n\n2.1 Potassium nitrate – 75% by weight\n2.2 Charcoal – 15% by weight\n2.3 Sulfur – 10% by weight\n3. Wet process\n\nMay include but not limited to:\n3.1 Quantity of water\n3.2 Cotton strand\n3.3 Binder\n4. Established procedures\n\n4.1 Manual process\n4.1.1 Cotton string fuse:\no\nCotton string is dipped in slurry black\npowder mixture\n4.1.2 Paper fuse:\no\nMixture is sprinkled on paper\no\nPaper is then rolled\n4.2 Automated\nprocess\nusing\nfusemaking\nequipment\n\n--- PDF PAGE 55 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n55\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to prepare fuse that meets safety\nfuse specifications\n1.2 Demonstrated ability to follow safety precautions in\npreparing safety fuse\n1.3 Demonstrated ability to select quality materials\n2. Underpinning\nKnowledge\n2.1 Correct selection of materials as to particle size and\nquality\n2.2 Safety precautions\n2.3 Follow work instructions\n2.4 Use of appropriate PPE\n2.5 Procedures in preparing safety fuse\n3. Underpinning\nSkills\n3.1 Selecting appropriate materials according to particle size\nand quality\n3.2 Following work instructions\n3.3 Carrying out safety precautions\n3.4 Using appropriate PPE\n3.5 Following safety procedures in preparing fuse\n3.6 Communication skills\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Tools and equipment appropriate to prepare safety fuse\n4.3 Chemical composition and materials\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation of application of tasks\n5.2 Demonstration with oral questioning\n5.3 Written test\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace – to\n observe/check workmanship, correct function of work,\nlength of time in doing the work\n\n--- PDF PAGE 56 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n56\n\nUNIT OF COMPETENCY :\nMAKE FIRECRACKERS\n\nUNIT CODE :\nPYR311306\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired for making firecrackers in a safe manner.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare container for\n firecrackers\n\n1.1 Work instruction is secured from appropriate\npersonnel.\n1.2 Container is prepared in accordance with\n product requirement.\n1.3 Paper container is folded in accordance with\nspecifications.\n2. Weigh/sieve/test\nfirecracker’s chemical\ncomposition\n\n2.1 Weighing is performed using appropriate\n weighing scale.\n2.2 Appropriate chemicals for safety fuse/firecrackers\nare identified in accordance with product and\nsafety requirements.\n2.3 Chemicals are weighed and measured in\n accordance with recommended ratio and\n proportion.\n2.4 Chemicals are sieved using appropriate mesh\n sieving screen before and after mixing\n chemicals.\n2.5 Mixed chemical is tested according to desired\n performance\n2.6 Unexpected situations are responded to in\n accordance with company rules and\n regulations.\n3. Load chemical mixture\ninto container\n\n3.1 Work instruction is secured from appropriate\n personnel\n3.2 Loading of chemical mixture is performed based\n on product requirements.\n3.3 Firecracker products are sun dried in\n accordance with established drying\n procedures.\n3.4 Unexpected situations are responded to in\n accordance to company rules and regulations\n\n--- PDF PAGE 57 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n57\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Firecrackers\n\n1.1 Triangle\n1.2 El Diablo\n1.3 Bawang\n2. Appropriate personnel\n\n2.1 Pyrotechnician III\n2.2 Pyrotechnician IV\n2.3 Manager/owner\n3. Containers\n\n3.1 Folded paper for triangle and bawang\n3.2 Paper tubing for el diablo\n4. Safety requirements\n\nMay include but not limited to:\n4.1 Working in designated mixing area\n4.2 Use of PPE e.g., mask\n4.3 Avoid wearing of metal accessories\n4.4 Avoid the use of synthetic materials\n5. Mesh seiving screen\n\nCommonly use mesh size:\n5.1 60\n5.2 40\n5.3 30\n6. Unexpected situations\nMay include but not limited to:\n6.1 Fire\n6.2 Spark\n6.3 Explosion\n6.4 Accident due to testing\n6.5 Smoke\n6.6 Suffocation\n7. Established drying\nprocedures\n\nMay include but not limited to:\n7.1 Proper sun drying in a safe area (not in metal) in\npaper or wood on a paper top\n7.2 Drying area is elevated\n\n--- PDF PAGE 58 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n58\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to follow work instructions\n1.2 Demonstrated ability to prepare quality container\n1.3 Demonstrated ability to check the accuracy of a\nweighing scale\n1.4 Demonstrated ability to follow safety requirements for\nweighing/sieving chemical composition for firecrackers\n1.5 Demonstrated ability to weigh chemical composition\naccording to correct ratio and proportion\n1.6 Demonstrated ability to follow product requirement\nspecifications.\n1.7 Demonstrated ability to follow established drying\nprocedures.\n2. Underpinning\nKnowledge\n2.1 Interpret work instructions\n2.2 Types and uses of containers\n2.3 Measuring scale\n2.4Follow\nsafety\nrequirements\nfor\nweighing/sieving\nchemical composition for fire crackers\n2.5 Follow product specifications\n2.6 Follow established drying procedures\n2.7 Types and uses of PPE\n3. Underpinning Skills\n3.1 Identifying defective weighing scale\n3.2 Interpreting work instructions\n3.3 Using appropriate containers\n3.4 Identifying defective measuring scale\n3.5 Following safety requirements\n3.6 Following product specifications\n3.7 Following established procedures\n3.8 Using appropriate PPE\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Chemicals and materials relevant to the activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation (actual) or demonstration and oral\n questioning\n6. Context for\nAssessment\n6.1 Assessment shall be done while the work is being\nperformed in the workplace or in a simulated venue.\n\n--- PDF PAGE 59 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n59"
}
