        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce cylinder containers to\ndesired quality and specifications\n1.2 Demonstrated ability to produce cylinder containers at the\n right time, desired quantity and with minimal wastage on\nthe use of materials.\n1.3 Demonstrated ability to follow work instructions.\n2. Underpinning\nKnowledge\n2.1 Procedures in preparing and preserving paste\n2.2 Procedures in preparing cylinders for pyrotechnics\n2.3 Types and uses of cylinder materials\n2.4 Types and uses of preservatives\n2.5 Follow work instructions\n3. Underpinning\nSkills\n3.1 Following procedures in preparing and preserving paste\n3.2 Following procedures in preparing cylinders for\n pyrotechnics\n3.3 Using cylinder materials\n3.4 Using preservatives\n3.5 Following work instructions\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Access to workplace and materials for producing cylinder\n containers\n4.2 Materials and equipment relevant to the activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration or direct observation with oral questioning\n6. Context for\nAssessment\n6.1 Competency should be assessed while work is being\n undertaken at the work place or in a simulated venue.\n\n--- PDF PAGE 46 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n46\n\nUNIT OF COMPETENCY :\nWRAP/PACKAGE PYROTECHNIC PRODUCTS\nUNIT CODE :"
