        "source_text": "PYR311302\nUNIT DESCRIPTOR :\nThis unit covers the required knowledge, skills and\nattitudes\nin\nmaking\ncylinder\ncontainer\nfor\npyrotechnic products.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare paste\n\n1.1 Work instruction is secured from appropriate\npersonnel.\n1.2 Flour/starch\nis\nmixed\nwith\nwater\nand\npreservative based on desired concentration.\n1.3 Mixture is boiled to desired consistency.\n2. Roll and dry paper into\ncylinder or tubing\n\n2.1 End of chipboard paper is scraped to desired\nthickness prior to rolling.\n2.2 Appropriate thin film of paste is applied to paper.\n2.3 Paper is rolled into cylindrical container using\n former in accordance with specifications.\n2.4 Rolled paper into cylinder tube is dried to\n desired condition/quality.\n\n--- PDF PAGE 44 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n44\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Pyrotechnic products\n\nMay include but not limited to:\n1.1 Skyrockets/baby rockets\n1.2 Illuminating candle/torch\n1.3 Whistle bomb/crying cow\n1.4 Trompillo\n1.5 Roman candle\n2. Appropriate personnel\n\nMay include but not limited to:\n2.1 Pyrotechnician II\n2.2 Pyrotechnician III\n2.3 Pyrotechnician IV\n2.4 Manager/Owner\n3. Preservative\n\nMay include but not limited to:\n3.1 Alum crystal/tawas\n3.2 Vinegar\n3.3 Copper sulfate\n3.4 Lime/apog\n4. Paper\n\nMay include but not limited to:\n4.1 Chipboard\n4.2 Newsprint\n4.3 Kraft paper\n4.4 Brown or Manila paper\n4.5 Glazine paper\n5. Specifications\n\nMay include but not limited to\n5.1 Thickness\n5.2 Length\n5.3 Diameter\n5.4 Width\n6. Dried\n\nMay include but not limited to:\n6.1 Sun dry\n6.2 Air dry\n6.3 Oven dry\n6.4 Stir frying\n\n--- PDF PAGE 45 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n45\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce cylinder containers to\ndesired quality and specifications\n1.2 Demonstrated ability to produce cylinder containers at the\n right time, desired quantity and with minimal wastage on\nthe use of materials.\n1.3 Demonstrated ability to follow work instructions.\n2. Underpinning\nKnowledge\n2.1 Procedures in preparing and preserving paste\n2.2 Procedures in preparing cylinders for pyrotechnics\n2.3 Types and uses of cylinder materials\n2.4 Types and uses of preservatives\n2.5 Follow work instructions\n3. Underpinning\nSkills\n3.1 Following procedures in preparing and preserving paste\n3.2 Following procedures in preparing cylinders for\n pyrotechnics\n3.3 Using cylinder materials\n3.4 Using preservatives\n3.5 Following work instructions\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Access to workplace and materials for producing cylinder\n containers\n4.2 Materials and equipment relevant to the activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration or direct observation with oral questioning\n6. Context for\nAssessment\n6.1 Competency should be assessed while work is being\n undertaken at the work place or in a simulated venue.\n\n--- PDF PAGE 46 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n46\n\nUNIT OF COMPETENCY :\nWRAP/PACKAGE PYROTECHNIC PRODUCTS\nUNIT CODE :"
