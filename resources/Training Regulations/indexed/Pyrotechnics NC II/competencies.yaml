        "source_text": "PYR311304\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin loading mixed composition into container in a safe\nmanner.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Load fireworks\n1.1 Specific type of container is selected and\n checked based on product requirement\n1.2 Chemical mixture and proportions are\n selected and checked based on fireworks\n quality requirements.\n1.3 Mixed composition is loaded in container\n following loading procedures as per\n pyrotechnic product based on recommended\n standard and safety practices.\n1.4 Loading is performed using appropriate tools\n and equipment and with minimum wastage.\n1.5 Unexpected situations are responded to in\n accordance with company rules and regulations\n2. Install safety fuse\n2.1 Safety fuse is installed according to product\nstandard.\n2.2 Initial loaded mixture is tested as to desired\nperformance\nand\nbased\non\nproduct\nrequirements.\n2.3 Deficiencies are corrected based on test\nperformance.\n2.4 Unexpected situations are responded to in\naccordance with company rules and regulations\n\n--- PDF PAGE 50 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n50\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Mixed composition\n\nMay include but not limited to:\n1.1 Pressed\n1.2 Rolled\n1.3 Wet\n1.4 Dry\n1.5 Sun dry\n1.6 Rounded\n1.7 Moulded\n2. Container\n\nMay include but not limited to:\n2.1 Paper tube\n2.2 Triangular kraft paper\n2.3 Plastic tube\n2.4 Cone\n2.5 Glazing paper\n2.6 Newsprint\n2.7 Spherical container (plastic or paper)\n2.8 Chip board\n3. Loading procedures\n\nMay include but not limited to:\n3.1 Ram\n3.2 Press\n3.3 Pour\n3.4 Mold\n4. Safe practices\n\nMay include but not limited to:\n4.1 Avoid use of metal accessories while loading\n4.2 Avoid use of electronic devices with loading\n4.3 Avoid use of fluorescent light in a nearby\n loading area\n4.4 Avoid cooking in a nearby loading area\n4.5 Use appropriate PPE e.g., dust mask\n4.6 Fingernails are newly cut\n5. Tools and equipment\n\nMay include but not limited to:\n5.1 Tools\no Paper funnel/imbudo\no Rammer\n5.2 Equipment\no Apron\no Dust mask\no\nGloves\n\n--- PDF PAGE 51 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n51\n\nVARIABLE\nRANGE\n6. Unexpected situations\n\nMay include but not limited to:\n6.1 Sparks\n6.2 Ignition/burning\n6.3 Explosion\n6.4 Chemical reactions\n6.5 Accident due to testing\n7. Product standard\n\nMay include but not limited to:\n7.1 Philippine standard\n7.2 International standard\n\n--- PDF PAGE 52 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n52\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to follow work instructions\n1.2 Demonstrated ability to identify the required materials.\n1.3 Demonstrated ability to select prescribed container\n1.4 Demonstrated ability to produce quality pyrotechnic\n products after loading operation\n1.5 Demonstrated ability to follow proper loading procedures\n2. Underpinning\nKnowledge\n2.1 Interpret work instructions\n2.2 Types and uses of containers\n2.5 Follow product specifications\n2.6 Follow proper loading procedures\n2.7 Types and uses of PPE\n3. Underpinning\nSkills\n3.1 Interpreting work instructions\n3.2 Using prescribed containers\n3.3 Following safety requirements\n3.4 Following product specifications\n3.5 Following established loading procedures\n3.6 Using PPE\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Chemicals and materials relevant to the activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation (actual) or demonstration and oral\n questioning\n6. Context for\nAssessment\n6.1 Assessment shall be done while the work is being\nperformed in the workplace or in a simulated venue.\n\n--- PDF PAGE 53 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n53\n\nUNIT OF COMPETENCY :\nPREPARE SAFETY FUSE FOR FIREWORKS\nUNIT CODE :"
