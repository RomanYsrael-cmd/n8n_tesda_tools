        "source_text": "PYR311203\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin identifying and measuring objects based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select measuring\ninstrument\n\n1.1 Object or component to be measured is\nidentified, classified and interpreted to the\nappropriate geometric shape.\n1.2 Measuring tools are selected/identified as per\nobject to be measured or job requirements\n1.3 Correct specifications are obtained from relevant\nsources.\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.5 Alternative measuring tools are used without\nsacrificing cost and quality of work.\n2. Carry out measurements\nand calculations\n\n2.1 Accurate\nmeasurements\nare\nobtained\naccording to job requirements.\n2.2 Alternative measuring tools are used without\nsacrificing cost and quality of work.\n2.3 Calculation needed to complete work tasks are\nperformed using four basic process of addition\n(+),\nsubtraction\n(-)\nmultiplication\n(x)\nand\ndivision(/) including but not limited to\ntrigonometric functions, algebraic computations\n2.4 Calculations involving fractions, percentages\nand mixed numbers are used to complete\nworkplace tasks.\n2.5 Numerical computation is self-checked and\ncorrected for accuracy.\n2.6 Instruments are read to the limit of accuracy of\nthe tool.\n2.7 Systems of measurement are identified and\nconverted according to job requirements/ISO\n2.8 Workpieces are measured according to job\nrequirements.\n\n--- PDF PAGE 23 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n21\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Geometric shape\n\nIncluding but not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring instruments\n\nIncluding but not limited to:\n2.1 tape measure\n2.2 caliper\n2.3 weighing scale\n3. Measurements and\ncalculations\n\nIncluding but not limited to:\n3.1 size\n3.2 width\n3.3 length\n3.4 weight\n3.5 area\n3.6 volume\n3.7 diameter\n3.8 thickness\n3.9 frequency\n\n--- PDF PAGE 24 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n22\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and prepared appropriate measuring\ninstruments in accordance with job requirements\n1.2 Performed measurements and calculations according to\njob requirements/ISO\n2. Underpinning\nKnowledge\n2.1 TRADE MATHEMATICS/MENSURATION\n2.1.1 Four fundamental operation\n2.1.2 Linear measurement\n2.1.3 Dimensions\n2.1.4 Unit conversion\n2.1.5 Ratio and proportion\n2.1.6 Trigonometric functions\n2.1.7 Algebraic equations\n3. Underpinning\nSkills\n3.1 Performing\ncalculation\nby\naddition,\nsubtraction,\nmultiplication and division: trigonometric functions and\nalgebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of\nplane and geometric figures\n3.4 Proper handling of measuring instruments\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions/Interview\n6. Context for\nAssessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 25 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n23\n\nUNIT OF COMPETENCY :\nPERFORM FIRE FIGHTING AND FIRE\nPREVENTION\nUNIT CODE :"
