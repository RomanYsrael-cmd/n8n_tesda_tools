        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed immediate life saving first aid\n1.2 Recognized the symptoms and sign of acute illness and\nor injury and take appropriate action\n1.3 Managed wounds and bleeding\n1.4 Managed burns\n1.5 Managed bone, joints and muscle injuries\n1.6 Adapted first aid procedures for remote situation\n1.7 Communicated effectively with others during provision of\nfirst aid\n1.8 Prepared report on first aid situations and activities in\naccordance with company and regulatory requirements\n2. Underpinning\nknowledge and\nattitude\n2.1 Duties and responsibilities of the designated first aid\nofficer in the workplace\n2.2 Knowledge on ways on how disease can spread in the\nworkplace and ways of preventing the spread\n2.3 Legal issues related to administration of drugs and\nmedicines in the workplace\n2.4 Knowledge on body structures and functions relevant to\npossible injury, illnesses and disease that may be\nencountered in the workplace\n3. Underpinning\nskills\n\n3.1 Medical first aid procedures\n3.2 Procedures for conducting an initial patient first aid\ntreatment\n3.3 Managing injuries and medical emergencies\n3.4 Managing medical resources\n3.5 Techniques for care of wounds\n3.6 Correct methods of Expired Air Resuscitation (EAR),\nExternal Cardiac Compression (ECC) and Cardio\nPulmonary Resuscitation (CPR)\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Tools\nand\nequipment\nappropriate\nto\nschedule\nhousekeeping activities and to monitor and maintain\nworking condition\n4.3 Material relevant to the activity and tasks\n\n--- PDF PAGE 36 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n34\n\n5. Method of\nassessment\n\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2 Under general guidance, checking various stages of the\nprocesses and at the completion of the activity against\nperformance criteria and specifications\n5.3 While tasks are being undertaken\n6. Context for\nassessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 37 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n35\n\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\nUNIT CODE :"
