        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to perform quality wrapping,\nlabeling and packaging with minimal waste of\nmaterial.\n1.2 Demonstrated ability to perform drying, wrapping and\n packaging in accordance with established procedures\nand safety precautions.\n\n2. Underpinning\nKnowledge\n2.1 Sizes, types and colors of wrapping and packaging\nmaterials\n2.2 Wrapping and packaging procedures\n2.3 Labeling requirements\n2.4 Handling and storage procedures for pyrotechnic\nproducts\n3. Underpinning Skills\n3.1 Using appropriate wrapping and packaging materials\n3.2 Following wrapping and packaging procedures\n3.3 Following labeling requirements\n3.4 Applying handling and storage procedures\n4. Resource Implications The following resources should be provided:\n4.1 Workplace locations\n4.2 Wrapping and packaging materials\n4.3 Sample of pyrotechnic products to be wrapped,\nlabeled and packaged.\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n\n5.1 Practical observation or demonstration with oral\n questioning\n6. Context for\nAssessment\n6.1 Assessment shall be undertaken while work is being\n performed in the workplace or in a simulated venue.\n\n--- PDF PAGE 49 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n49\n\nUNIT OF COMPETENCY :\nLOAD MIXED COMPOSITION INTO CONTAINER\nUNIT CODE :"
        },
        "source_text": "PYR311303\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge, skills and\nattitudes required in wrapping/packaging pyrotechnic\nproducts.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Wrap pyrotechnic\nproducts\n\n1.1 Pyrotechnic products are wrapped using\nspecified wrapping material.\n1.2 Wrapping is performed in accordance with\nestablished wrapping procedures and safety\nprecautions.\n1.3 Label is attached to wrapper for marketability,\nfor instruction and proper use of pyrotechnics.\n2. Pack pyrotechnic products 2.1 Wrapped loaded containers are dried based\n on product specification.\n2.2 Wrapped loaded containers are packed,\n bundled and properly labeled according to\n specification.\n2.3 Wrapped loaded containers are transported\n and stored in the warehouse.\n\n--- PDF PAGE 47 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n47\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Pyrotechnic products\n\nMay include but not limited to:\n1.1 Skyrockets/baby rockets\n1.2 Illuminating candle/torch\n1.3 Whistle bomb/crying cow\n1.4 Trompillo\n1.5 Roman candle\n2. Wrapping material\n\nMay include but not limited to:\nclassified as:\n2.1 Type e.g., Christmas wrapper, glossy paper\n2.2 Size\n2.3 Color\n3. Established wrapping\nprocedures\n\nMay include but not limited to:\n3.1 Wrapping procedures for Skyrocket\n3.2 Wrapping procedures for Whistle Bomb\n3.3 Wrapping procedures for Fountain\n3.4 Wrapping procedures for Roman Candle\n3.5 Wrapping procedures for Trompillo\n4. Label\n\nMay include but not limited to:\n4.1 Product name\n4.2 Manufacturer’s name and address\n4.3 DTI No.\n4.4 License No.\n4.5 Instructions for proper use of pyrotechnics\n4.6 Warning signages\n5. Specification\nMay include but not limited to:\n5.1 Illuminating candle (100 pieces per bundle, per\nbox)\n5.2 Sparklers (packing by 100 pieces [1st 50 pieces\nwith handle first; 2nd 50 pieces with sparklers\nfirst])\n5.3 Skyrockets (100 pieces per box)\n5.4 Whistle bomb (100 pieces per box)\n5.5 Packing by gross (144 pieces)\n6. Dried\nMay include but not limited to:\n6.1 Sun dry\n6.2 Air dry\n\n--- PDF PAGE 48 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n48\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to perform quality wrapping,\nlabeling and packaging with minimal waste of\nmaterial.\n1.2 Demonstrated ability to perform drying, wrapping and\n packaging in accordance with established procedures\nand safety precautions.\n\n2. Underpinning\nKnowledge\n2.1 Sizes, types and colors of wrapping and packaging\nmaterials\n2.2 Wrapping and packaging procedures\n2.3 Labeling requirements\n2.4 Handling and storage procedures for pyrotechnic\nproducts\n3. Underpinning Skills\n3.1 Using appropriate wrapping and packaging materials\n3.2 Following wrapping and packaging procedures\n3.3 Following labeling requirements\n3.4 Applying handling and storage procedures\n4. Resource Implications The following resources should be provided:\n4.1 Workplace locations\n4.2 Wrapping and packaging materials\n4.3 Sample of pyrotechnic products to be wrapped,\nlabeled and packaged.\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n\n5.1 Practical observation or demonstration with oral\n questioning\n6. Context for\nAssessment\n6.1 Assessment shall be undertaken while work is being\n performed in the workplace or in a simulated venue.\n\n--- PDF PAGE 49 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n49\n\nUNIT OF COMPETENCY :\nLOAD MIXED COMPOSITION INTO CONTAINER\nUNIT CODE :"
