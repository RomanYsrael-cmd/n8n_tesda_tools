        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected\nand\nused\nappropriate\nworkplace\nlanguage\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning Skills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n 4.2. Materials relevant to the proposed activity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation\nto the work activities of the group\n5.2.\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\n______________________________________________________________________\n TR- PYROTECHNICS NC II\n\n9\n UNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\n UNIT CODE :"
