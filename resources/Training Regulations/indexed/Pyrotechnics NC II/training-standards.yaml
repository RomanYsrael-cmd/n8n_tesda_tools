  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Pyrotechnics NC II.\n\nThis includes information on curriculum design, training delivery, trainee entry\nrequirements, tools and equipment, training facilities, and trainers qualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Pyrotechnics\nNC Level: NC II\nNominal Training Duration: 18 HOURS (Basic Competencies)\n 24 HOURS (Common Competencies)\n 200 HOURS (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nPyrotechnics in accordance with industry standards. It covers specialized\ncompetencies on acquiring and storing chemicals, making cylinder container for\npyrotechnic products, loading mixed composition into container, preparing safety\nfuse and making firecrackers.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1 Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nWorkplace informa-\ntion.\n\n1.2 Complete relevant\nwork related\ndocuments.\n\n1.3 Participate in work-\nplace meeting and\n discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 60 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n60\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n\n2.2 Describe work as a\nteam member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n\n3.2 Set and meet work\npriorities.\n\n3.3 Maintain professional\ngrowth and\n development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n\n4.2 Control hazards and\nrisks\n\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Observe\nprocedures,\nspecifications,\nand manuals\nof instructions\n\n1.1 Identify and accessed\nspecifications/manuals\nas per job\nrequirements.\n\n1.2 Interpret manuals in\naccordance with\nindustry practices.\n\n1.3 Identify symbols used\nin the Manuals.\n\nIdentify the units of\nmeasurements and\nunit of convertion.\n\n1.4 Store manuals in\naccordance with\ncompany\nrequirements.\n• Discussion\n• Lecture\n\n• Written\n• Questioning\n• Observation\n\n--- PDF PAGE 61 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n61\n2. Perform men-\nsurations and\ncalculations\n2.1 Select and prepare\nappropriate measuring\ninstruments in\naccordance with job\nrequirements.\n\n2.2 Perform calculation\nusing the four\nfundamental operation,\ntrigonometric functions\nand algebraic\nequations.\n\n2.3 Interpret formulas for\nvolume, areas,\nperimeters of plane and\ngeometric figures.\n\n2.4 Visualize objects and\nshapes.\n\n2.5 Perform measurements\nand calculation\naccording to job\nrequirements/ISO.\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n•\nObservation\n•\nDemonstration\n•\nPractical\n performance\n\n3. Perform fire\nfighting and\nfire prevention\n\n3.1 Identify and access\nspecififications/\n manuals.\n\n3.2 Manage and implement\nfire prevention\nmeasures and\nprocedures\n\n3.3 Check the operational\ncapability of the fire\n detection and fire\nfighting equipment and\n system. Initiate any\nrequired maintenance.\n\n3.4 Participate in simulated\n activities.\n3.5 Conduct interior search\nand rescue fire fighting\noperations.\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n•\nObservation\n•\nDemonstration\n•\nPractical\n performance\n4. Apply first aid\ntreatment\n4.1 Simulate immediate life\nsaving first aid.\n\n4.2 Simulate action on\n• Discussion\n• Lecture\n• Demonstration\n•\nSimulation\n• Observation\n• Demonstration\n• Practical\nperformance\n\n--- PDF PAGE 62 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n62\nrecognize symptoms\nand acute illness /\ninjury.\n\n4.3 Simulate action on\nwounds, bleeding,\nburns, bone, joint and\nmuscle injuries.\n5. Apply quality\nstandard\n5.1 Monitor the\nmanufacturing\nprocesses to maintain\nquality standards.\n\n5.2 Conduct random\ninspection throughout\nthe manufacturing\nprocesses.\n\n5.3 Inspect and apply\nquality standard to work\ndone against job\nspecification.\n\n5.4 Check / record\ncomplete document\nrequirements.\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\n• performance\n\n CORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Acquire and\nstore chemicals\nfor pyrotechnic\nproducts\n\n1.1 Initiate procurement of\nchemicals for\npyrotechnic product\n\nDemonstration\n\nWritten Test\nDemonstration\nOral Questioning\n\n1.2 Store chemicals\n\nDemonstration\n\nWritten Test\nDemonstration\nOral Questioning\n2. Make cylinder\ncontainer for\npyrotechnic\nproducts\n2.1 Prepare paste\n\nDemonstration\n\nDemonstration with\nQuestioning\n\n2.2 Roll and dry paper into\ncylinder or tubing\nDemonstration\n\nDemonstration with\nQuestioning\n\n--- PDF PAGE 63 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n63\n3. Wrap/package\npyrotechnic\nproduct\n3.1 Wrap pyrotechnic\nproducts\n\nDemonstration\n\nDemonstration with\nQuestioning\n\n3.2 Pack pyrotechnic\nproducts\nDemonstration\nPractical\nObservation\nDemonstration with\nQuestioning\n4. Load mixed\ncomposition\ninto container\n4.1 Load fireworks\nDemonstration\nDemonstration with\nQuestioning\n\n4.2 Install safety fuse\n\nDemonstration\nDemonstration with\nQuestioning\n5. Prepare safety\nfuse for\nfireworks\n5.1 Prepare and mix\ningredients\n\nDemonstration\nWritten Test\nDemonstration with\nQuestioning\n\n5.2 Make fuse\nDemonstration\nDemonstration with\nQuestioning\n6. Make\nfirecrackers\n\n6.1 Prepare container for\nfirecrackers\nDemonstration\nDemonstration with\nQuestioning\n\n6.2 Weigh /sieve/test\nfirecracker’s chemical\ncomposition\nDemonstration\nDemonstration with\nQuestioning\n\n6.3 Load chemical mixture\ninto container\nDemonstration\n\nDemonstration with\nQuestioning\n\n--- PDF PAGE 64 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n64\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 65 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n65\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate either oral and written\n• physically and mentally fit\n• at least 18 years old\n• with good moral character\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 TOOLS AND EQUIPMENT AND MATERIALS\n\nPYROTECHNICS – NC II