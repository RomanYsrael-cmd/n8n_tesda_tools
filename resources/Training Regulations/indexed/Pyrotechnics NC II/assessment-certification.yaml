  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Pyrotechnics NC II, the\ncandidate must demonstrate the competence in all the units listed in\nSection 1. Successful candidate shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2\nThe qualification of Pyrotechnics NC II may be attained through:\n\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all\nthe following areas:\n\n4.2.1.1 Acquire and store chemicals\n\n4.2.1.2 Make cylinder container for pyrotechnic products\n\n4.2.1.3 Wrap/package pyrotechnic products\n\n4.2.1.4 Load mixed composition into container\n\n4.2.1.5 Prepare safety fuse for fireworks\n\n4.2.1.6 Make firecrackers\n\nSuccessful candidates shall be awarded Certificates of\nCompetency (COCs) bearing the signature of the Regional\nDirector and Chair of the recognized local industry body.\n\n4.2.2\nDemonstration\nof\ncompetence\nthrough\nproject-type\nassessment covering all required units of the qualification.\n\n4.3\n Assessment shall focus on the core units of competency. The tool\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, nonformal and informal including\nenterprise-based training programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.5\n The guidelines on assessment and certification are discussed in\ndetail in the Procedures Manual on Assessment and Certification\nand Guidelines on the Implementation of the Philippine TVET\nQualification and Certification System (PTQCS).\n\n--- PDF PAGE 70 ---\n______________________________________________________________________________________\n TR- PYROTECHNICS NC II\n70\nPyrotechnics NC II\n\nAcquire and store\nchemicals\nMake cylinder\ncontainer for\npyrotechnic products\n\nWrap/package\npyrotechnic products\n\nLoad mixed\ncomposition into\ncontainer\n\nPrepare safety fuse\nfor fireworks\n\nMake firecrackers\n\nMake pyrotechnic\nproducts\n\nPlan and operate\nfirework display\n\nDevelop design for\nfireworks\nObserve procedures,\nspecifications and\nmanuals of\ninstructions\n\nApply first aid\ntreatment\n\nApply quality\nstandards\n\nPerform fire fighting\nand fire prevention\n\nPerform mensurations\nand calculations\nCOMMON COMPETENCIES\nCORE COMPETENCIES\nBASIC COMPETENCIES\nReceive and\nrespond to\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\n Practice\noccupational\nhealth and safety\nprocedures\n\nPractice career\nprofessionalism\n\nWork with others\n\n Work in team\nenvironment\n\nDemonstrate work\nvalues\nPractice basic\nHousekeeping\nProcedures\n\nLead in workplace\ncommunication\n\nUtilize specialist\ncommunication skills\n\nLead small team\nApply problem solving\nTechniques in the\nworkplace\n\nPlan and organize\nwork\n"
}
