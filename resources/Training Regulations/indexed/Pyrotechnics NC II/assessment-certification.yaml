      "text": "5 The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 70 --- ______________________________________________________________________________________ 70 Pyrotechnics NC II Acquire and store chemicals Make cylinder container for pyrotechnic products Wrap/package pyrotechnic products Load mixed composition into container Prepare safety fuse for fireworks Make firecrackers Make pyrotechnic products Plan and operate firework display Develop design for fireworks Observe procedures, specifications and manuals of instructions Apply first aid treatment Apply quality standards Perform fire fighting and fire prevention Perform mensurations and calculations Receive and respond to workplace communication Participate in workplace communication Practice occupational health and safety procedures Practice career professionalism Work with others Work in team environment Demonstrate work values Practice basic Housekeeping Procedures Lead in workplace communication Utilize specialist communication skills Lead small team Apply problem solving Techniques in the workplace Plan and organize work --- PDF PAGE 71 --- ______________________________________________________________________________________ 71 Binder This can be sugar or starch. Mixed with water, these chemicals form a slurry that can be coated on a wire (by dipping) or poured into a tube. Black Match A fuse made from string that is impregnated with Black Powder. Black Powder Material found in fireworks. This material can be used as a propellant charge, to produce sound, as a constituent of other compositions, or in the ignition fuse or timing system of fireworks. Also known as gun powder. Certification The process of verifying and validating competencies of a person through qualifications assessment. Chemical Composition All pyrotechnic and explosive composition contained in a fireworks device. Inert materials (such as clay used for plugs or organic matter used for density) are not considered to be part of chemical composition. Competency refers to the specification of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace Display Fireworks (formerly known as special fireworks) Large fireworks articles designed to produce visible or audible effects for entertainment purposes by combustion, deflagration, or detonation. Display Site The immediate area where a fireworks display is conducted, including the discharge site, the fallout area, and the required separation distance from mortars to spectator viewing areas, but not spectator viewing areas or vehicle parking areas. Dud Any device in which the fuse or igniter fails to ignite the main pyrotechnic charge. The term, dud, is reported to have originated as an acronym for dangerous unexploded device. Electrical Firing Unit A device that provides and controls the electric current used to ignite fireworks during a display. --- PDF PAGE 72 --- ______________________________________________________________________________________ 72 Electrical Firing Unit, Automatic A panel or box that operates automatically to provide the source of electric current used to ignite electric matches. Electrical Firing Unit, Handheld A small, handheld unit with manually operated switches that control the flow of electric current to electric matches attached to fireworks devices. Electrical Firing Unit, Manual A panel or box with manually operated switches that control the flow of electric current to electric matches attached to fireworks devices. Electrical Ignition A technique used to ignite fireworks using a source of electric current. Electric Match An electric device that contains a small amount of pyrotechnic material that ignites when current flows through the device. Element Are the building blocks of a unit of competency. It describe in outcome terms the functions that a person who works in a particular area of work is able to perform. Evidence Guide Guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment method. Explosive (Technical Definition) Any material that is capable of undergoing a self-contained and self-sustained exothermic chemical reaction at a rate that is sufficient to produce substantial pressures on their surroundings, thus causing physical damage. Explosives fall into 2 classes, detonating and deflagerating. Explosive Composition Any chemical compound or mixture, the primary purpose of which is to function by explosion, producing an audible effect. Fire To ignite pyrotechnics by using an electric match, electrical current, or some other means. Firecrackers Consist of either black powder (also known as gunpowder) or flash powder in a tight paper tube with a fuse to light the powder. --- PDF PAGE 73 --- ______________________________________________________________________________________ 73 Fireworks Any composition or device for the purpose of producing a visible or an audible effect by combustion, deflagration, or detonation, and that meets the definition of consumer fireworks or display fireworks. Fireworks Display A presentation of fireworks for a public or private gathering. Flash Powder Mixtures which contain powdered aluminum or a magnesium/aluminum alloy which, when ignited, can result in a violent explosion and flash. Fountain Device that projects a spray of sparks. Fuel Material (charcoal or sulfur) that can be burned or otherwise consumed to produce heat. Fuse Provides a time delay so the shell explodes at the right altitude. Gerb Small fountain sometimes used with lance-work set pieces. Girandola Special wheel which rises rapidly in the air while emitting a spray of sparks and, sometimes, a whistle. Labels All legal consumer explosives have mandatory labeling requirements. Included on these labels should be the manufacturer's name and address, cautions, and directions for use. Level Refers to the category according to the level of difficulty and complexity of skills and knowledge required to the job Low Level Fireworks (Also Ground-to-Air Fireworks) Any of a class of fireworks devices that either perform below approximately 200 feet (60 m) or begin their display at ground level and rise to complete their effect. Some examples of low level fireworks are comets, mines, roman candles, and many consumer fireworks. Mortar A tube from which certain aerial devices are fired into the air. Mortar Rack Sturdy wooden or metal frames used to support mortars in an upright position usually above ground. --- PDF PAGE 74 --- ______________________________________________________________________________________ 74 Occupational Safety and Health Center (OSHC) - A government agency that promotes and protects workers’ welfare through effective implementation of the OSH programs that will enhance productivity and subsequently contribute to national economic development efforts as well as preventive approach of reducing/eliminating occupational accidents and illnesses in the workplace. Performance Criteria Are evaluative statements that specify what is to be assessed and the required level of performance It provides a comprehensive, nationally consistent framework for qualifications in the TVET sector. It also provides the parameter for the integration of learning and assessment in the middle skills development Pyrotechnic Device Any device containing pyrotechnic materials and capable of producing a special effect. Pyrotechnic Material A chemical mixture used in the entertainment industry to produce visible or audible effects by combustion, deflagration, or detonation. Pyrotechnic Special Effect A special effect created through the use of pyrotechnic materials and devices. Pyrotechnics Controlled exothermic chemical reactions that are timed to create the effects of heat, gas, sound, dispersion of aerosols, emission of visible electromagnetic radiation, or a combination of these effects to provide the maximum effect from the least volume. Qualification Refers to the national certificate issued by the TESDA or its accredited industry organizations in recognition that a person has achieved competencies relevant to a trade or industry. Range of Variable Describes the circumstances or context in which the work is to be performed. Roman Candle A chain-fused firework that propels a series of aerial shell, comet or mine effects into the air from a single tube. Safety Cap A tube, closed at one end that is placed over the end of the fuse until intended ignition to protect it from damage and accidental ignition. --- PDF PAGE 75 --- ______________________________________________________________________________________ 75 Sparklers A very different from firecrackers. A sparkler burns over a long period of time (up to 1 minute) and produces extremely bright and showery light. Theatrical Pyrotechnics Pyrotechnic devices for professional use in the entertainment industry. Similar to consumer fireworks in chemical composition and construction but not intended for consumer use. Unit of competency Describe a work activity. --- PDF PAGE 76 --- ______________________________________________________________________________________ 76 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who devoted their time and expertise in the development and validation of this Training Regulations. Members of the Expert Committee and Secretariat who prepared the Occupational Skills Standards for Pyrotechnics together with the respondents of the Technical Verification Survey that was conducted: TRADE EXPERT COMMITTEE: VERIFICATION SURVEY:"
