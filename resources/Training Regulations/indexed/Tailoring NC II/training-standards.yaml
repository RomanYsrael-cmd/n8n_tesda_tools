  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Tailoring NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainers qualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: TAILORING\n\nNC Level: NC II\nNominal Training Duration: 18 Hrs. (Basic)\n\n 17 Hrs. (Common)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and desirable work\nattitude in Tailoring NC II. It covers the basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n44\n\nCOMMON COMPETENCIES\n\nSector: GARMENTS NC II\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Carry Out\nMeasurements\nand Calculations\n\n1.1 Read and interpret\ndrawings\n1.2 Obtain measurements\n1.3 Perform simple\ncalculation\n1.4 Estimate approximate\nquantities\n\nGroup\ndiscussion\n\nPractical\nExercises\n\nObservation\n\nWritten Exam.\n\n2. Perform Basic\nMaintenance\n\n2.1 Operate machine and\nassess its performance\n2.2 Clean and lubricate\nmachine\n2.3 Check machine\noperation\n\nGroup\ndiscussion\n\nInteraction\n\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n\n3. Set up and\noperate\nmachines\n\n3.1 Set machines\n3.2 Conduct sample run\n3.3 Test machine output\n3.4 Re- adjust machine\n setting to meet\nrequirements\n3.5 Maintain records and\nprepare report.\nGroup\ndiscussion\n\nInteraction\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n\n4. Apply Quality\nStandards\n\n4.1 Assess own work\nbase on workplace\nstandard\n4.2 Assess quality of\ncomponent parts and\ntake corrective actions\n4.3 Measure parts using\nappropriate instrument\n4.4 Record information in\naccordance to\nworkplace procedures\n4.5 Study causes of quality\ndeviations and\nrecommend\npreventive action\n\nGroup\ndiscussion\n\nInteraction\n\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n45\n\nCORE COMPETENCIES\n\nCourse Title: TAILORING\n\nNC Level: NC II\nNominal Training Duration: 240 Hrs.\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Tailor\nin accordance with industry standards. It covers specialized competencies on\ndrafting and cutting pattern, preparing and cutting materials, sewing, and applying\nfinishing touches for casual apparel.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Draft and cut\npattern for casual\napparel\n\n1.1\nPlan garment\ndesign\n\n1.2\nTake clients\nbody\nmeasurement\n\n1.3\nDraft basic/block\npattern\n\n1.4\nManipulate\npattern\n\n1.5\nCut final pattern\n\nDiscussion\n\nDemonstration\n\nDemonstration\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nSketching/Actu\nal Designing\n\nDemonstration\n\nDemonstration\nObservation\n\nDemonstration\n\nDemonstration\n\n2. Prepare and cut\nmaterials for\ncasual apparel\n\n2.1 Prepare materials\n(fabric)\n\n2.2 Layout and mark\npattern on material\n\n2.3 Cut materials\n\nDiscussion\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n\nDemonstration\n\nDemonstration\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n46\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n3. Sew casual apparel\n\n3.1 Prepare cut parts\n\n3.2 Prepare sewing\nmachine for\noperation\n\n3.3 Sew and assemble\ngarment parts\n\n3.4 Alter completed\ngarment\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n\nDemonstration\n\nDemonstration\nActual Sewing\n\nDemonstration\nActual Sewing\n\n4. Apply finishing\ntouches on casual\napparel\n\n4.1 Apply finishing\ntouches\n\n4.2 Trim excess\nthreads\n\n4.3 Press finished\ngarment\n\n4.4 Package the\nfinished garment\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n47\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based on the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his/her own pace. The trainer\njust facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n48\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate both oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school or training center delivering the TVET program.\n\n3.4 TOOLS AND EQUIPMENT AND MATERIALS\nTAILORING – NC II\n\nRecommended list of tools, equipment and materials for the training of\n25 trainees for Dressmaking - NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n25\npcs\nTape Measure\n25\nunits\nSingle Needle\nLockstich machines\n25\nRolls\nPattern paper\n25\npcs\nHip- curve\n5\npcs\n 3 Threads over lock\nmachine\n25\npcs\nTailor’s Chalk\n15\npcs\nMeter stick\n1\nunits\nBar Tack Machine\n25\npacks\ns\nTracing paper\n25\npcs\nFrench curve\n1\nunit\nFeed of the Arm\nmachine\n25\npcs\nPencil\n25\npairs\nScissors ( 6 “ )\n5\nunits\n\nFlat Iron\n25\npcs\nEraser\n25\npcs\nL- Square\n5\nunits\nIroning Board\n75\npcs\nThread\n(assorted\ncolors)\n10\npairs\nPinking Shears\n5\nunits\nSteam Press\n8\npacks\nNeedle DB1x11\n25 pairs\nCutting Shears (\n8”)\n5\nunits\nSleeve Board/ Ham\n8\npacks\nNeedle DB 1 x\n14\n25\npcs\nRuler with grid (\n24”)\n10\nunits\nModel Form\n3\npacks\nNeedle DC 1x14\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n49\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n25\npcs\nTriangle 16” ( 45°\n90°)\n2\nunits\nLife Size Mirror\n1\npack\nNeedle TV 1 x14\n25\npcs\nSeam Ripper\n25\npcs\nBobbin Case\n12.5\nyards\nFusible\nInterlining\n25\npcs\nSewing Box\n50\npcs\nBobbin Spool\n3\nRolls\nBand Roll\n25\npcs\nScrew Driver Flat\n( medium size)\n3\nunits\nHanger Rack\n37.5\nyrds\nFabric ( tetoron)\n25\npcs\nScrew Driver Flat\n( small size)\n\n75\nyards\nFabric ( Chinese\nCotton)\n\n5\npcs\nSpray Bottle\n5\npcs\nGauge Foot 1/4\n10\nyards\nFabric ( coco )\n10\nDoz.\nHanger\n5\npcs\nGauge Foot 1/16\n120\nyards\nFabric ( for\npants and\nshorts)\n25\npcs\nTracing Wheel\n25\npcs\nCalculator\n37.5\nyards\nFabric\n(\nfor\njogging pants)\n\n2\nunits\nWooden Cabinet with\nsliding door( Display\nCabinet)\n3 rolls\nGarter 1 ½”\n\n150\nZipper 6”\n\n2\nboxes\nHook and Eye\n3 gal.\nMachine Oil\n\n3\npacks\nHand Needle\n\n2\nboxes\nButtons Flat\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n50\n\n3.5 TRAINING FACILITIES\nTAILORING NC - II\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\n\nBuilding (permanent)\n\n176.25 sq. m.\n\nStudent/Trainee\nWorking Space\n\n1.5 x 1.5 m.\n\n2.25 sq. m.\n\n56.25 sq. m\n\nLecture/Demo Room\n\n1.5 x 2 m.\n\n3 sq. m.\n\n78 sq. m.\n\nLearning Resource\nCenter\n\n3 x 5 m.\n\n15 sq. m.\n\n15 sq. m.\n\nFacilities/Equipment/\nCirculation Area\n\n1.5 x 2 m.\n\n3 sq. m.\n\n27 sq. m.\n\n3.6 TRAINERS’ QUALIFICATION\nTAILORING - NC II\n\nTRAINER QUALIFICATION (TQ II)\n\nTo qualify as trainer for Tailoring NC II, the person must:\n\n• be a holder of NC III or its equivalent\n• have undergone 