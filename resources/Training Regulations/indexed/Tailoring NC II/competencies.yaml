        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked fabrics for quality, faults, width, selvedges\nand marking requirements\n1.2\nSoaked, drip dried and pressed fabrics in\naccordance with standard fabric care\n1.3\nSelected and prepared accessories and accent of\nthe garment in accordance with specified garment\ndesign or style\n1.4\nIdentified and prepared measuring, tracing/marking\nand cutting tools in accordance with job\nspecifications\n1.5\nLaid-out and pinned patterns on the fabric in\naccordance with fabric grain line\n1.6\nMarked seam allowances on the fabric in\naccordance with job requirements\n1.7\nTraced/marked darts and pocket locations on the\nfabric in accordance with specified garment style or\ndesign\n1.8\nInterpreted garment design or style in accordance\nwith customer’s specifications\n1.9\nCut fabrics in accordance with the required standard\nallowances\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of pattern\n2.2\nFabric properties such as weight, shrinkage, pile,\ngrain and pattern shapes\n2.3\nSoaking and drying procedures\n2.4\nMarket trends on garment style\n3. Underpinning skills\n3.1\nMeasuring, marking/tracing and cutting skills\n3.2\nManipulating prepared pattern\n3.3\nLaying-up and cutting operations skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials and equipment relevant to the proposed\nactivity or task\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect observation/demonstration of application of\ntasks and questioning related to underpinning\nknowledge\n5.2\nPortfolio\n6. Context for\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n34\n\nUNIT OF COMPETENCY: SEW CASUAL APPAREL\n\nUNIT CODE:"
        },
        "source_text": "GRM743314\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in preparing and cutting of materials and\naccessories of men’s casual apparel. It includes the\nrequirements for preparing materials, lay-outing and\nmarking of pattern on material and cutting of materials.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare materials\n(fabric)\n1.1\nFabrics are collected and checked in accordance with\nfabric specification\n1.2\nFabric width and quality are checked according to\ninstructions and appropriate action is taken in\naccordance with work requirements\n1.3\nFabrics are checked according to workplace\nprocedures\n1.4\nFabrics are soaked/drip dried and pressed in\naccordance with standard fabric care\n1.5\nAccessories and accents are selected and prepared\nin accordance with specified garment style/design\n1.6\nMarking tools are prepared in accordance with job\nrequirements\n1.7\nEquipment and tools are prepared as per standard\noperating procedures (SOPs)\n2. Lay-out and mark\npattern on material\n2.1\nCutting table is prepared and set-up in accordance with\ncompany procedures\n2.2\nPatterns are prepared and checked in accordance with job\nspecifications\n2.3\nPatterns are laid out and pinned on the fabric in accordance\nwith fabric grain line\n2.4\nFabric is laid-up and alignment with pattern is checked to\nensure conformance to specifications\n2.5\nPattern pieces are manipulated and positioned manually in\naccordance with company procedures\n2.6\nSeam allowances are marked on the fabric in accordance\nwith job requirements\n2.7\nDarts and pocket locations are traced/marked on the fabric\nin accordance with specified garment style or design\n2.8\nMark is placed in accordance with company procedures\n3. Cut materials\n3.1\nGarment style or design is interpreted in accordance\nwith customer’s specification\n3.2\nMaterial is cut to meet design requirements and\nmeasurements of the pattern\n3.3\nGarment parts are checked for completeness in\naccordance with specified garment design or styles\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n32\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Fabric specification\n1.1\nCotton\n1.2\nChaliz\n1.3\nPolyester\n1.4\nGabardine\n1.5\nRayon\n1.6\nOrganza\n2. Fabric checked\n2.1\nQuality\n2.2\nFaults\n2.3\nWidth\n2.4\nSelvedges\n2.5\nSoaked/drip dried\n3. Standard fabric care\n3.1\nDry cleaning\n3.2\nSoaking and drying\n3.3\nMachine washed\n3.4\nTumble dried\n4. Accessories and\naccent\n4.1\nZipper\n4.2\nButtons\n4.3\nBias tape\n4.4\nHook and eye\n4.5\nSnaps\n5. Tracing/Marking\ntools\n5.1\nTracing wheel\n5.2\nTracing paper\n5.3\nTailor’s chalk\n6. Garment parts\n6.1\nCollar\n6.2\nPocket\n6.3\nSleeves\n6.4\nWaistband\n6.5\nFigure\n6.6\nBelt loops\n7. Garment\ndesign/style\n7.1\nPolo – Short sleeves,\n7.2\nShort – boxer type, knee length\n7.3\nJogging pants\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n33\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked fabrics for quality, faults, width, selvedges\nand marking requirements\n1.2\nSoaked, drip dried and pressed fabrics in\naccordance with standard fabric care\n1.3\nSelected and prepared accessories and accent of\nthe garment in accordance with specified garment\ndesign or style\n1.4\nIdentified and prepared measuring, tracing/marking\nand cutting tools in accordance with job\nspecifications\n1.5\nLaid-out and pinned patterns on the fabric in\naccordance with fabric grain line\n1.6\nMarked seam allowances on the fabric in\naccordance with job requirements\n1.7\nTraced/marked darts and pocket locations on the\nfabric in accordance with specified garment style or\ndesign\n1.8\nInterpreted garment design or style in accordance\nwith customer’s specifications\n1.9\nCut fabrics in accordance with the required standard\nallowances\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of pattern\n2.2\nFabric properties such as weight, shrinkage, pile,\ngrain and pattern shapes\n2.3\nSoaking and drying procedures\n2.4\nMarket trends on garment style\n3. Underpinning skills\n3.1\nMeasuring, marking/tracing and cutting skills\n3.2\nManipulating prepared pattern\n3.3\nLaying-up and cutting operations skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials and equipment relevant to the proposed\nactivity or task\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect observation/demonstration of application of\ntasks and questioning related to underpinning\nknowledge\n5.2\nPortfolio\n6. Context for\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n34\n\nUNIT OF COMPETENCY: SEW CASUAL APPAREL\n\nUNIT CODE:"
