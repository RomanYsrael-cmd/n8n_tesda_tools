        "source_text": "GRM743203\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\ntaking accurate measurements of the client and\ncalculating/estimating the materials, requirements cost.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain measurements\n1.1 Measurements are obtained to job instructions\nusing measuring devices\n1.2 Type of measurement to be used is identified.\n1. Perform simple\ncalculations\n\n2.1 Simple calculations are carried out based on the\nrequirements of the situation\n\n2.2 Correctness of calculations verified based on\nproduction requirements\n3. Estimate approximate\nquantities\n3.1 Measurements or quantities are estimated on job\nrequirements\n\n3.2 Measurements are identified/recorded without\nerror\n\n3.3 Quantities of materials suitable for work\nundertaken are calculated and recorded according\nto job instructions\n\n3.4 Costs for simple project are estimated to within +\nor 10%.\n\n--- PDF PAGE 19 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n17\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Measuring device\n\n1.1 Tape measure\n1.2 Meter stick\n2. Type of measurement\n2.1 English system\n2.2 Metric system\n3. Four fundamental\noperations\n\n3.1 Addition\n3.2 Subtraction\n3.3 Multiplication\n3.4 Division\n4. Points of measurement\nfor different types of\ngarments\n\n4.1 Casual\n4.2 Formal\n4.3 High fashion\n\n--- PDF PAGE 20 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n18\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nUse of measuring devices effectively\n1.2\nTook and recorded accurate measurements\n1.3\nPerformed simple calculations according to\nspecifications\n1.4\nEstimated quantities and costs according to\nrequirement\n1.5\nCommunicate effectively to enable accurate\ncalculations and measurements\n2. Underpinning\nknowledge and attitudes\n2.1\nDrawings and specifications\n2.2\nMaterials relevant to the construction processes\n2.3\nBasic operation in measurement and calculations\n2.4\nCosting relative to the construction process\n3. Underpinning skills\n3.1\nRead and interpret drawings\n3.2\nMeasure and calculate manually\n3.3\nRecord measurement\n3.4\nOperate electronic calculating devices\n3.5\nCommunicate effectively\n4. Resource implications\nThe following resources should be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment may\ntake place\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of assessment\n5.1\nDirect observation of work activities related to\ndrafting and cutting of casual apparel pattern\n6. Context for assessment\n6.1\nCompetency assessment may occur in workplace\nor any appropriately simulated environment\n\n--- PDF PAGE 21 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n19\n\nUNIT OF COMPETENCY:\nSET UPAND OPERATE MACHINE/S\nUNIT CODE:"
