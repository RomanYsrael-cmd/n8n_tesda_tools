        "source_text": "GRM743205\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nperforming minor maintenance of the machines used\nby dressmaker/tailor.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Operate machine and\nassess its performance\n1.1 Machine is started and stopped in accordance\nwith manufacturer’s and enterprise requirements\n1.2 Machine operation is monitored to ensure that\ncorrect procedures are assessed and product\nmeets quality standards\n1.3 Problem with machine is identified and reported in\naccordance with company procedures\n\n2. Clean and lubricate\nmachine\n2.1 Machine is cleaned and lubricated in accordance\nwith workplace requirements and manufacturer’s\ncleaning and lubricating instructions\n2.2 Machine operation is monitored to ensure correct\nprocedures are carried out and work meets quality\nstandards\n\n3. Check machine\noperation\n3.1 Machine is checked to ensure correct operation\n3.2 Problems encountered and similar observations\nare documented and referred to supervisor or\nappropriate personnel\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n23\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Minor machine faults\n1.1 Loose threads\n1.2 Broken needle\n1.3 Machine control\n2. Major machine faults\n2.1 Electric motor defect\n2.2 Timing (not synchronized)\n2.3 Broken body parts\n\n--- PDF PAGE 26 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n24\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Started and stopped machine\n1.2 Monitored machine operations\n1.3 Identified and reported machine problems\n1.4 Identified and corrected minor machine and\nassociated equipment/tools faults\n1.5 Identified and documented major machine or\nproduct faults\n1.6 Recorded and documented machine maintenance\n1.7 Cleaned and lubricated machine\n2. Underpinning\nknowledge and attitude\n2.1 Procedures and guidelines for safe operation of\nmachines\n2.2 Typical fault conditions and related fault finding\nprocedures\n2.3 Basic machine maintenance and repair\ntechniques\n2.4 Safety policies and procedures\n2.5 Quality standard procedures\n2.6 Workplace recording and reporting procedures\n3. Underpinning skills\n3.1 Assess operating performance of machine\n3.2 Start and stop machine according to specifications\n3.3 Monitor machine operations\n3.4 Recognize fault conditions\n3.5 Rectify minor machine faults or problems\n4. Resource implications\nThe following resources should be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2 Materials relevant to the proposed activity or task\n5. Methods of assessment\n5.1 Direct observation of work activities related to\ndrafting and cutting of casual apparel pattern\n5.2 Authenticated transcript of relevant\neducation/training\n6. Context for assessment\n6.1 Competency assessment may occur in workplace\nor any appropriately simulated environment\n6.2 Assessment shall be done while task are being\nundertaken\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n25\n\nUNIT OF COMPETENCY:\nAPPLY QUALITY STANDARDS\nUNIT CODE:"
