        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety\nand hazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3 Recognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits\nbased on threshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and attitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n3. Resource implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n4.\nMethods of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n5. Context for assessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n16\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nCARRY OUT MEASUREMENTS & CALCULATIONS\n\nUNIT CODE:"
        },
        "source_text": "500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply\nwith regulatory and organizational requirements for\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 14 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in theRange of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace are consistently followed\n3.2 Procedures for dealing with workplace accidents,\nfire and emergencies are followed in accordance\nwith organization OHS policies\n3.3 Personal protective equipment (PPE) is\ncorrectly used in accordance with organization\nOHS procedures and practices\n3.4 Appropriate assistance is provided in the event of\na workplace emergency in accordance with\nestablished organization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and\nupdated in accordance with workplace\nrequirements\n\n--- PDF PAGE 15 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n13\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke,\n gasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n14\n\nVARIABLE\nRANGE\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n5. Emergency-related drills\nand training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 17 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n15\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety\nand hazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3 Recognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits\nbased on threshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and attitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n3. Resource implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n4.\nMethods of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n5. Context for assessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n16\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nCARRY OUT MEASUREMENTS & CALCULATIONS\n\nUNIT CODE:"
