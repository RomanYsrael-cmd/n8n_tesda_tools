  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in TAILORING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills\nare used to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage\nof information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n4\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following\nstandard format of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nknowledge and attitude\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following\nsimple written notices\n3.3. Participate in workplace meetings and\ndiscussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine\nworkplace measures\n3.6. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource implications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of assessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context of assessment\n6.1. Competency may be assessed individually in\nthe actual workplace or through accredited\ninstitution\n\n--- PDF PAGE 7 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n5\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role and\nscope\n1.1. The role and objective of the team is identified\nfrom available sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team\ndiscussions and appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members\nare identified and recognized\n2.3. Reporting relationships within team and external\nto team are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of\ncommunications used and interactions\nundertaken with team members who contribute to\nknown team activities and objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based\non individual skills and competencies and\nworkplace context\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work\nplans based on an understanding of team’s role\nand objectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n\n2. Sources of information\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 9 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n7\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace\nactivity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace\nlanguage\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning knowledge\nand attitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning skills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource implications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2.\nMaterials relevant to the proposed activity or\ntasks\n\n5. Methods of assessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in\nrelation to the work activities of the group\n5.2.\nObservation of simulation and or role play\ninvolving the participation of individual member\nto the attainment of organizational goal\n5.3.\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies in\nteamwork\n\n6. Context for assessment\n6.1.\nCompetency may be assessed in workplace or\nin a simulated workplace setting\n6.2.\nAssessment shall be observed while task are\nbeing undertaken whether individually or in\ngroup\n\n--- PDF PAGE 10 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued\ntowards improving the qualifications set for the\nprofession\n1.2 Intra- and interpersonal relationships is are\nmaintained in the course of managing oneself\nbased on performance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n1.\nSet and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n2.\nMaintain professional\ngrowth and\ndevelopment\n3.1 Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2 Recognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n9\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n10\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in\nthe course of managing oneself based on\nperformance evaluation\n1.3 Completed trainings and career opportunities which\nare based on the requirements of the industries\n1.4 Acquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n2. Underpinning\nknowledge and attitudes\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender\nsensitivity\n2.5 Personal hygiene practices\n3. Underpinning skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of assessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of assessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 13 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n11\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply\nwith regulatory and organizational requirements for\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 14 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in theRange of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace are consistently followed\n3.2 Procedures for dealing with workplace accidents,\nfire and emergencies are followed in accordance\nwith organization OHS policies\n3.3 Personal protective equipment (PPE) is\ncorrectly used in accordance with organization\nOHS procedures and practices\n3.4 Appropriate assistance is provided in the event of\na workplace emergency in accordance with\nestablished organization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and\nupdated in accordance with workplace\nrequirements\n\n--- PDF PAGE 15 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n13\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke,\n gasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n14\n\nVARIABLE\nRANGE\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n5. Emergency-related drills\nand training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 17 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n15\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety\nand hazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3 Recognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits\nbased on threshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and attitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n3. Resource implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n4.\nMethods of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n5. Context for assessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n16\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nCARRY OUT MEASUREMENTS & CALCULATIONS\n\nUNIT CODE:\nGRM743203\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\ntaking accurate measurements of the client and\ncalculating/estimating the materials, requirements cost.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain measurements\n1.1 Measurements are obtained to job instructions\nusing measuring devices\n1.2 Type of measurement to be used is identified.\n1. Perform simple\ncalculations\n\n2.1 Simple calculations are carried out based on the\nrequirements of the situation\n\n2.2 Correctness of calculations verified based on\nproduction requirements\n3. Estimate approximate\nquantities\n3.1 Measurements or quantities are estimated on job\nrequirements\n\n3.2 Measurements are identified/recorded without\nerror\n\n3.3 Quantities of materials suitable for work\nundertaken are calculated and recorded according\nto job instructions\n\n3.4 Costs for simple project are estimated to within +\nor 10%.\n\n--- PDF PAGE 19 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n17\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Measuring device\n\n1.1 Tape measure\n1.2 Meter stick\n2. Type of measurement\n2.1 English system\n2.2 Metric system\n3. Four fundamental\noperations\n\n3.1 Addition\n3.2 Subtraction\n3.3 Multiplication\n3.4 Division\n4. Points of measurement\nfor different types of\ngarments\n\n4.1 Casual\n4.2 Formal\n4.3 High fashion\n\n--- PDF PAGE 20 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n18\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nUse of measuring devices effectively\n1.2\nTook and recorded accurate measurements\n1.3\nPerformed simple calculations according to\nspecifications\n1.4\nEstimated quantities and costs according to\nrequirement\n1.5\nCommunicate effectively to enable accurate\ncalculations and measurements\n2. Underpinning\nknowledge and attitudes\n2.1\nDrawings and specifications\n2.2\nMaterials relevant to the construction processes\n2.3\nBasic operation in measurement and calculations\n2.4\nCosting relative to the construction process\n3. Underpinning skills\n3.1\nRead and interpret drawings\n3.2\nMeasure and calculate manually\n3.3\nRecord measurement\n3.4\nOperate electronic calculating devices\n3.5\nCommunicate effectively\n4. Resource implications\nThe following resources should be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment may\ntake place\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of assessment\n5.1\nDirect observation of work activities related to\ndrafting and cutting of casual apparel pattern\n6. Context for assessment\n6.1\nCompetency assessment may occur in workplace\nor any appropriately simulated environment\n\n--- PDF PAGE 21 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n19\n\nUNIT OF COMPETENCY:\nSET UPAND OPERATE MACHINE/S\nUNIT CODE:\nGRM743204\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nsetting up and operating machines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Set machines\n1.1 Product specifications are interpreted in relation to\nmachine setting requirements\n\n1.2 Type of sewing machine to be set up is identified in\naccordance with the job requirement\n\n1.3 Machine is set in accordance with product\nspecifications, machine manufacturer’s instructions\nand company procedures\n2. Conduct sample run\n2.1 Materials to be used for sampling are obtained\n\n2.2 Machine is operated in accordance with\nmanufacturer’s and company instructions to\nproduce a specified sample\n3. Test machine output\n3.1 Machine outputs are tested or organized in\naccordance with company procedures to ensure\nrequired standards of quality are met\n4. Re-adjust machine\nsetting to meet\nrequirements\n4.1 Test results are interpreted to determine\nadjustment requirements\n\n4.2 Adjustment changes are assessed in accordance\nwith product and machine specifications\n\n4.3 Appropriate production personnel are informed of\nthe availability of the newly set up machine in\naccordance with workplace procedures\n5. Maintain records\n5.1 Records are maintained and reports prepared in\naccordance with the company procedures\n\n--- PDF PAGE 22 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n20\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Type of Machines used\n1.1 Single needle lockstitch machine\n1.2 Double needle lockstitch machine\n1.3 Edging machine\n1.4 Button hole machine\n2. Machine output\n2.1 Product sample\n2.2 Service samples\n2.3 Machine operation\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n21\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted product specifications in relation to\nmachine setting requirements\n1.2 Obtained materials to be used for sampling\n1.3 Operated machines\n1.4 Tested or organized sample to ensure quality\nstandards are met\n1.5 Interpreted test results\n1.6 Assessed adjustment changes\n1.7 Maintained records and prepared reports\n2. Underpinning\nknowledge\n2.1 Setting up and adjustment requirements for the\nrange of machines and equipment used in the\ncompany\n2.2 Quality requirements\n2.3 Machine manufacturer’s specifications\n2.4 Safety and environmental aspects of relevant\ncompany activities\n2.5 Workplace procedures and reporting processes\n2.6 Relevant OH&S legislation and codes of practice\n3. Underpinning skills\n3.1 Set and operate machines\n3.2 Test and analyze samples\n3.3 Apply all relevant safety practices when working in\nthe industry\n3.4 Communicate effectively with individuals, work\ngroups and supervisors\n3.5 Maintain records and document and transfer\ninformation\n3.6 Interpret and carry out established procedures\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2 Materials relevant to the proposed activity or task\n5. Methods of assessment\n5.1 Direct observation of work activities related to\ndrafting and cutting of casual apparel pattern\n5.2 Authenticated transcript of relevant\neducation/training\n6. Context for assessment\n6.1 Competency assessment may occur in the\nworkplace or any appropriately simulated\nenvironment\n6.2 Assessment shall be done while task are being\nundertaken\n\n--- PDF PAGE 24 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n22\n\nUNIT OF COMPETENCY :\nPERFORM BASIC MAINTENANCE\nUNIT CODE:\nGRM743205\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nperforming minor maintenance of the machines used\nby dressmaker/tailor.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Operate machine and\nassess its performance\n1.1 Machine is started and stopped in accordance\nwith manufacturer’s and enterprise requirements\n1.2 Machine operation is monitored to ensure that\ncorrect procedures are assessed and product\nmeets quality standards\n1.3 Problem with machine is identified and reported in\naccordance with company procedures\n\n2. Clean and lubricate\nmachine\n2.1 Machine is cleaned and lubricated in accordance\nwith workplace requirements and manufacturer’s\ncleaning and lubricating instructions\n2.2 Machine operation is monitored to ensure correct\nprocedures are carried out and work meets quality\nstandards\n\n3. Check machine\noperation\n3.1 Machine is checked to ensure correct operation\n3.2 Problems encountered and similar observations\nare documented and referred to supervisor or\nappropriate personnel\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n23\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Minor machine faults\n1.1 Loose threads\n1.2 Broken needle\n1.3 Machine control\n2. Major machine faults\n2.1 Electric motor defect\n2.2 Timing (not synchronized)\n2.3 Broken body parts\n\n--- PDF PAGE 26 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n24\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Started and stopped machine\n1.2 Monitored machine operations\n1.3 Identified and reported machine problems\n1.4 Identified and corrected minor machine and\nassociated equipment/tools faults\n1.5 Identified and documented major machine or\nproduct faults\n1.6 Recorded and documented machine maintenance\n1.7 Cleaned and lubricated machine\n2. Underpinning\nknowledge and attitude\n2.1 Procedures and guidelines for safe operation of\nmachines\n2.2 Typical fault conditions and related fault finding\nprocedures\n2.3 Basic machine maintenance and repair\ntechniques\n2.4 Safety policies and procedures\n2.5 Quality standard procedures\n2.6 Workplace recording and reporting procedures\n3. Underpinning skills\n3.1 Assess operating performance of machine\n3.2 Start and stop machine according to specifications\n3.3 Monitor machine operations\n3.4 Recognize fault conditions\n3.5 Rectify minor machine faults or problems\n4. Resource implications\nThe following resources should be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2 Materials relevant to the proposed activity or task\n5. Methods of assessment\n5.1 Direct observation of work activities related to\ndrafting and cutting of casual apparel pattern\n5.2 Authenticated transcript of relevant\neducation/training\n6. Context for assessment\n6.1 Competency assessment may occur in workplace\nor any appropriately simulated environment\n6.2 Assessment shall be done while task are being\nundertaken\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n25\n\nUNIT OF COMPETENCY:\nAPPLY QUALITY STANDARDS\nUNIT CODE:\nGRM743206\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\napplying quality standards to work operations in the\nindustry.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess own work\n1.1 Completed work is checked against workplace\nstandards relevant to the operations being\nundertaken\n1.2 An understanding is demonstrated on how the\nwork activities and completed work relate to the\nnext production process and to the final\nappearance of the product\n1.3 Faulty pieces or final products are identified and\nisolated in accordance with company policies and\nprocedures\n1.4 Faults and any identified causes are recorded and\nreported in accordance with workplace procedures\n2. Assess quality of\nreceived component\nparts\n2.1 Received materials, component parts or final\nproduct are checked against workplace standards\nand specifications\n\n2.2 Causes of any identified faults are identified and\ncorrective actions are taken in accordance with\nworkplace procedures\n3. Measure parts\n3.1 Materials, component parts or products are\nmeasured using the appropriate measuring\ninstruments in accordance with workplace\nprocedures\n4. Record information\n4.1 Basic information on the quality performance is\nrecorded in accordance with workplace procedures\n4.2 Records of work quality are maintained according\nto the requirements of the company\n5. Study causes of quality\ndeviations\n5.1 Causes of deviations from final products are\ninvestigated and reported in accordance with\nworkplace procedures\n\n5.2 Suitable preventive action is recommended based\non workplace quality standards and identified\ncauses of deviation from specified quality\nstandards of materials or final product\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n26\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Quality check\n1.1 Visual inspection\n1.2 Physical measurements\n1.3 Check against patterns\n2. Quality standards\n2.1 Materials\n2.2 Component parts\n2.3 Final product\n2.4 Production processes\n3. Quality parameters\n3.1 Finish\n3.2 Fit\n3.3 Size\n3.4 Durability\n3.5 Product variations\n3.6 Materials\n3.7 Alignment\n3.8 Color\n3.9 Damage and imperfections\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n27\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Checked completed work continuously against\nworkplace standard\n1.2 Identified and isolated faulty pieces or final\nproduct\n1.3 Checked received materials, component parts or\nfinal product against workplace standards\n1.4 Identified and applied corrective actions on the\ncauses of identified faults\n1.5 Measured materials, component parts or products\n1.6 Recorded basic information regarding quality\nperformance\n1.7 Investigated causes of deviations of materials\nagainst standard\n1.8 Recommended suitable preventive actions\n2. Underpinning\nknowledge\n2.1 Relevant quality standards, policies and\nprocedures\n2.2 Characteristics of materials used\n2.3 Safety environment aspects of production\nprocesses\n2.4 Relevant measurement techniques and quality\nchecking procedures\n2.5 Workplace procedures\n2.6 Reporting procedures\n3. Underpinning skills\n3.1 Interpret work instructions, specifications,\nstandards and patterns appropriate to the\nassessee’s work\n3.2 Carry out relevant visual inspections of materials,\ncomponent parts and final products\n3.3 Carry out relevant physical measurements\n3.4 Maintain accurate work records in accordance\nwith procedures\n3.5 Meet work specifications\n3.6 Communicate effectively within defined workplace\nprocedures\n4. Resource implications\nThe following resources should be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2 Materials relevant to the proposed activity or task\n5. Methods of assessment\n5.1 Direct observation of work activities related to\ndrafting and cutting of casual apparel pattern\n5.2 Authenticated transcript of relevant\neducation/training\n6. Context for assessment\n6.1 Competency assessment may occur in the\nworkplace or in any appropriately simulated\nenvironment\n6.2 Assessment shall be done while task are being\nundertaken\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n28\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: DRAFT AND CUT PATTERN FOR CASUAL APPAREL\n\nUNIT CODE: GRM743313\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in drafting and cutting basic/block pattern for\nmen’s casual apparel. It includes the requirements for\nplanning garment design, taking body measurement,\ndrafting basic/block pattern and cutting final pattern.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan garment design\n1.1\nCustomer’s job requirements are determined in\naccordance with company practice\n1.2\nGarment design is prepared in accordance with the\nclient’s requirements\n1.3\nDesign and fabric are discussed and selected\naccording to client’s specifications\n1.4\nSpecial needs of the client are incorporated into the\ndesign based on procedures.\n2. Take clients body\nmeasurements\n\n2.1\nMeasuring tools are prepared in accordance with\njob requirements.\n2.2\nBody measurements are taken based on procedures\n2.3\nBody measurements of client are taken in\nsequence according to job requirements and\nstandard body measurement procedures\n2.4\nBody measurements are recorded in line with\ncompany requirements/practice\n3. Draft basic/block\npattern\n3.1\nDrafting pattern tools are selected in accordance\nwith job requirements\n3.2\nBasic/Block pattern is drafted using appropriate\nequipment and following customer’s specifications\n3.3\nDrafted basic/block pattern is checked for accuracy\nto satisfy customer’s specification\n4. Manipulate pattern\n4.1\nBlock pattern is laid out in accordance with company\nprocedures\n4.2\nBlock pattern is manipulated in accordance with\ncustomer’s specifications\n4.3\nFinal pattern is labeled, filled and secured as per\nstandard operating procedures\n5. Cut final pattern\n5.1\nPattern cutting tools are selected in accordance\nwith job requirements\n5.2\nFinal pattern cutting is performed in accordance\nwith customer’s specifications/measurements\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n29\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Job requirements\nIncludes but is not limited to:\n1.1\nPolo (Short Sleeves)\n1.2\nShort\n1.3\nJogging Pants\n2. Fabric\n2.1\nCotton\n2.2\nDenims\n2.3\nPolyster\n3. Special needs\nKinds of:\n3.1\npocket\n3.2\nstitch\n3.3\ncollar\n3.4\nsleeve\n4. Measuring tools\n4.1\nTape measure\n4.2\nHip curve rule\n4.3\nL-Square\n4.4\nMeter Stick\n5. Standard body\nmeasurement\n5.1\nShoulder\n5.2\nNeck circumference\n5.3\nChest width/circumference\n5.4\nFigure (front and back)\n5.5\nWaistline\n5.6\nHips\n5.7\nLength of sleeve, polo, short and jogging pants\n5.8\nArmhole circumference\n5.9\nSeat/hip circumference\n5.10 Thigh circumference\n5.11 Knee circumference\n5.12 Crotch rise length\n5.13 Side length/seam\n5.14\nBottom hem/height circumference\n6. Drafting tools\n6.1\nTailor’s chalk\n6.2\nPattern paper\n7. Basic/Block Pattern\n7.1\nPolo (short sleeves)\n7.2\nShort\n7.3\nJogging pants\n8. Cutting tools\n8.1\nScissors\n9. Pattern cutting\n9.1\nWith seam allowance\n9.2\nWithout seam allowance\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n30\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined job requirements in accordance with\nenterprise practice\n1.2\nPrepared design in consultation with client’s\nrequirements\n1.3\nPrepared/selected measuring, drafting and\ncutting tools in accordance with job requirements\n1.4\nFollowed correct position and sequence in taking\nbody measurements\n1.5\nDrafted basic/block pattern in accordance with\ncustomer’s specifications\n1.6\nCut final pattern with seam allowance and in\naccordance with customer’s specifications\n2. Underpinning\nknowledge and attitudes\n2.1\nTypes of measuring, drafting and cutting tools\nand their uses\n2.2\nSequence in taking body measurement\n2.3\nPatterns\n3. Underpinning skills\n3.1\nPosition in taking body measurement\n3.2\nDraft basic/block pattern\n3.3\nCut pattern with seam allowance\n3.4\nCommunicate effectively with client\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment may\nbe done\n4.2\nMaterials and equipment relevant to the proposed\nactivity or task\n5. Methods of assessment\nCompetency must be assessed through:\n5.1\nDirect observation / demonstration of candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2\nPortfolio\n6. Context for assessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n31\n\nUNIT OF COMPETENCY: PREPARE AND CUT MATERIALS FOR CASUAL\n APPAREL\n\nUNIT CODE: GRM743314\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in preparing and cutting of materials and\naccessories of men’s casual apparel. It includes the\nrequirements for preparing materials, lay-outing and\nmarking of pattern on material and cutting of materials.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare materials\n(fabric)\n1.1\nFabrics are collected and checked in accordance with\nfabric specification\n1.2\nFabric width and quality are checked according to\ninstructions and appropriate action is taken in\naccordance with work requirements\n1.3\nFabrics are checked according to workplace\nprocedures\n1.4\nFabrics are soaked/drip dried and pressed in\naccordance with standard fabric care\n1.5\nAccessories and accents are selected and prepared\nin accordance with specified garment style/design\n1.6\nMarking tools are prepared in accordance with job\nrequirements\n1.7\nEquipment and tools are prepared as per standard\noperating procedures (SOPs)\n2. Lay-out and mark\npattern on material\n2.1\nCutting table is prepared and set-up in accordance with\ncompany procedures\n2.2\nPatterns are prepared and checked in accordance with job\nspecifications\n2.3\nPatterns are laid out and pinned on the fabric in accordance\nwith fabric grain line\n2.4\nFabric is laid-up and alignment with pattern is checked to\nensure conformance to specifications\n2.5\nPattern pieces are manipulated and positioned manually in\naccordance with company procedures\n2.6\nSeam allowances are marked on the fabric in accordance\nwith job requirements\n2.7\nDarts and pocket locations are traced/marked on the fabric\nin accordance with specified garment style or design\n2.8\nMark is placed in accordance with company procedures\n3. Cut materials\n3.1\nGarment style or design is interpreted in accordance\nwith customer’s specification\n3.2\nMaterial is cut to meet design requirements and\nmeasurements of the pattern\n3.3\nGarment parts are checked for completeness in\naccordance with specified garment design or styles\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n32\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Fabric specification\n1.1\nCotton\n1.2\nChaliz\n1.3\nPolyester\n1.4\nGabardine\n1.5\nRayon\n1.6\nOrganza\n2. Fabric checked\n2.1\nQuality\n2.2\nFaults\n2.3\nWidth\n2.4\nSelvedges\n2.5\nSoaked/drip dried\n3. Standard fabric care\n3.1\nDry cleaning\n3.2\nSoaking and drying\n3.3\nMachine washed\n3.4\nTumble dried\n4. Accessories and\naccent\n4.1\nZipper\n4.2\nButtons\n4.3\nBias tape\n4.4\nHook and eye\n4.5\nSnaps\n5. Tracing/Marking\ntools\n5.1\nTracing wheel\n5.2\nTracing paper\n5.3\nTailor’s chalk\n6. Garment parts\n6.1\nCollar\n6.2\nPocket\n6.3\nSleeves\n6.4\nWaistband\n6.5\nFigure\n6.6\nBelt loops\n7. Garment\ndesign/style\n7.1\nPolo – Short sleeves,\n7.2\nShort – boxer type, knee length\n7.3\nJogging pants\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n33\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked fabrics for quality, faults, width, selvedges\nand marking requirements\n1.2\nSoaked, drip dried and pressed fabrics in\naccordance with standard fabric care\n1.3\nSelected and prepared accessories and accent of\nthe garment in accordance with specified garment\ndesign or style\n1.4\nIdentified and prepared measuring, tracing/marking\nand cutting tools in accordance with job\nspecifications\n1.5\nLaid-out and pinned patterns on the fabric in\naccordance with fabric grain line\n1.6\nMarked seam allowances on the fabric in\naccordance with job requirements\n1.7\nTraced/marked darts and pocket locations on the\nfabric in accordance with specified garment style or\ndesign\n1.8\nInterpreted garment design or style in accordance\nwith customer’s specifications\n1.9\nCut fabrics in accordance with the required standard\nallowances\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of pattern\n2.2\nFabric properties such as weight, shrinkage, pile,\ngrain and pattern shapes\n2.3\nSoaking and drying procedures\n2.4\nMarket trends on garment style\n3. Underpinning skills\n3.1\nMeasuring, marking/tracing and cutting skills\n3.2\nManipulating prepared pattern\n3.3\nLaying-up and cutting operations skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials and equipment relevant to the proposed\nactivity or task\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect observation/demonstration of application of\ntasks and questioning related to underpinning\nknowledge\n5.2\nPortfolio\n6. Context for\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n34\n\nUNIT OF COMPETENCY: SEW CASUAL APPAREL\n\nUNIT CODE: GRM743315\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes\nrequired in preparing and assembling cut parts, preparing\nsewing machine for operation, sewing garments and\ncomponents using basic sewing techniques, and altering\ncompleted men’s casual garments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare cut parts\n1.1\nCut parts are prepared in accordance with the\nspecified garment design/style\n1.2\nCut parts are pressed in accordance with fabric\nspecifications\n1.3\nCut parts are pinned together in accordance with\ngarment design or style\n1.4\nAccessories and accents are prepared in\naccordance with garment design or style\n2. Prepare sewing\nmachine for\noperation\n2.1\nMachine parts are cleaned and lubricated in\naccordance with company requirements and\nmanufacturer’s cleaning and lubricating instructions\n2.2\nMachine is started and stopped in accordance with\nmanufacturer’s operation manual\n2.3\nMachines speed and work handling are controlled in\naccordance with company procedures\n2.4\nMachine operations is monitored according to\nstandard operating procedures\n2.5\nMinor machine problem or fault is identified and\nrepaired in accordance with manufacturer’s manual\n2.6\nMachines are threaded in accordance with the\nthreading procedures\n2.7\nMachines are set-up and adjusted in accordance\nwith work specifications\n2.8\nCompany’s health and safety policies and\nprocedures are followed\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n35\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Sew and assemble\ngarment parts\n3.1\nGarment parts are assembled in accordance with\ngarment assembly instructions and pattern\nspecifications\n3.2\nGarments are assembled/sewn in accordance with\nsewing standard procedures and company’s time\nframes\n3.3\nSleeves, collars and pockets are identified and\nsewn in accordance with customer’s specification\nand quality standards\n3.4\nPocket flaps and pieces are sewn with clean\ncorners and without raw edges\n3.5\nZipper is sewn without pucker according to sewing\ninstructions\n3.6\nSeams edges are finished in accordance with the\njob requirements\n3.7\nWaistband width are evenly sewn from end to end\naccording to standard operating procedures\n3.8\nLeft and right of front and back rise are attached\nequally, following correct seam allowance\n3.9\nLeft and right bottom hem are sewn equally and\nbalanced with each other in length according to\nprocedure\n4. Alter completed\ngarment\n4.1\nAlterations/Modifications are undertaken in\naccordance with the client’s specifications\n4.2\nFinal fitting is conducted to ensure clients\nsatisfaction\n4.3\nGarment alteration is completed as per clients\nsatisfaction\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n36\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Parts of sewing\nmachine\n1.1\nFeed dog\n1.2\nBobbin case and spool\n1.3\nNeedle\n1.4\nLever\n1.5\nWheel\n2. Types of sewing\nmachines\n2.1\nLockstitch sewing machine\n2.2\nOver Lockstitch sewing machine\n2.3\nEdging machine\n2.4\nButton hole machine\n3. Machine problem or\nfaults\n3.1\nPuckering\n3.2\nUneven stitch\n3.3\nLoose threads\n3.4\nSkipping stitch\n4. Types of sleeves\n4.1\nLong sleeves\n4.2\nShort sleeves\n5. Types of collar\n5.1\nSports collar\n5.2\nChinese collar\n5.3\nContinuous collar\n6. Types of pocket\n6.1\nPatch\n6.2\nFlap\n6.3\nWelt\n6.4\nPiped\n6.5\nBellows or Pouch\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n37\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared and pinned cut parts together in\naccordance with the specified garment design/style\n1.2\nSet-up and adjusted machines in accordance with\nwork specifications\n1.3\nAssembled, sewn garments in conformance with\nsewing standard procedures and workplace\ntimeframe\n1.4\nSewn sleeves are fitted and well hung from the\nedge of the shoulder and around the arm as per\nspecification\n1.5\nSewn well seated collar at the neckline and corners\nevenly and sharply\n1.6\nSewn zipper without pucker\n1.7\nNicked and flattened seams without wrinkles\n1.8\nSewn waistband width from end to end evenly\n1.9\nDetermined modifications and alterations in\naccordance with client’s specifications\n1.10\nCompleted garment alteration\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of sewing machines\n2.2\nGarment Parts\n2.3\nCharacteristics of fabrics, threads and other\nmaterials used in basic garment assembly\n3. Underpinning skills\n3.1\nSewing machine operations\n3.2\nThreading procedures\n3.3\nApply basic sewing techniques\n3.4\nCarry out work in accordance with OH&S policies\nand procedures\n3.5\nInterpret and apply defined procedures\n3.6\nApply safety precautions relevant to the task\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials and equipment relevant to the proposed\nactivity or task\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect observations/demonstration of candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n38\n\nUNIT OF COMPETENCY : APPLY FINISHING TOUCHES ON CASUAL APPAREL\n\nUNIT CODE: GRM743316\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in applying finishing touches and detailing on\nthe requirements such as attaching the needed\naccessories and accent, trimming of excess threads,\npressing finished garment and packaging of finished\nmen’s casual garment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply finishing\ntouches\n1.1\nFinishing touches are checked in accordance with\ngarment design/style specifications\n1.2\nAccessories and accents position are marked and\nattached in accordance with garment design/style\nspecification\n1.3\nAccessories and accents are sewn by hand or by\nmachine in accordance with garment design/style\nspecifications\n1.4\nFinishing operations are performed in accordance\nwith customer’s specifications and company’s\nprocedures\n1.5\nGarment is checked for loose threads, missing\nbuttons and attachments.\n1.6\nBodice hem allowances and sleeves are folded and\npinned in accordance with customer’s\nspecifications.\n1.7\nHem line allowances are sewn in accordance with\nthe given stitch/seam specifications\n2. Trim excess threads\n2.1\nTrimming tools are prepared in accordance with\ncompany procedures\n2.2\nGarments are trimmed of excess threads in\naccordance with sewing procedures\n2.3\nGarments are reversed and hanged in accordance\nwith company’s procedures\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n39\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Press finished\ngarment\n3.1\nFabrics and pressing tools are prepared according\nto standard operating procedures\n3.2\nPressing tools temperature setting is set-up in\naccordance with company procedures\n3.3\nFaults, spots and marks are identified and\nappropriate actions are taken in accordance with\ncompany’s procedures\n3.4\nHeat/Pressure is applied in accordance with\nproduct requirements, fabric specifications and\ncompany procedures\n3.5\nPressing is sequenced in accordance with work\nspecifications and company’s procedures\n4. Package the\nfinished garment\n4.1\nFinished garments are packed in accordance with\npackaging standards/procedures\n4.2\nGarment packages are labeled in accordance with\ncompany’s requirements\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n40\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Finishing touches\n1.1\nClosures\n1.2\nHemming\n1.3\nAccessories and accent\n1.4\nStitches\n2. Pressing tools\n2.1\nFlat iron\n2.2\nIroning board\n3. Pressing tool\ntemperature Setting\n3.1\nLevel 1 - Silk\n3.2\nLevel 2\n3.3\nLevel 3\n4. Faults, spots and\nmarks\n4.1\nGrease/Oil\n\n5. Packaging\nprocedures\n5.1\nSorting of garments according to:\n5.1.1 Style\n5.1.2 Color\n5.1.3 Size\n5.2\nPutting label tags\n6. Garment packages\n6.1\nBox\n6.2\nCellophane\n6.3\nPlastic\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n41\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked finishing touches in accordance with\ngarment design/style specifications\n1.2\nMarked and attached accessories and accent\npositions in accordance with garment design/style\nspecifications\n1.3\nPerformed finishing operations in accordance with\ncustomer’s specifications and company’s\nprocedures\n1.4\nFolded and pinned bodice hem allowances and\nsleeves in accordance with customer’s design/style\nspecifications\n1.5\nSewn hem line allowances in accordance with the\ngiven stitch/seam specifications\n1.6\nTrimmed garments of excess threads in accordance\nwith sewing procedures\n1.7\nIdentified faults, spots and marked and appropriate\nactions were taken in accordance with company\nprocedures\n1.8\nPressed finished garment in accordance with\nproduct requirements, fabric specifications and\ncompany procedures\n1.9\nPacked finished garments in accordance with\npackaging standards/procedures\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of trimming and ironing tools\n2.2\nFabric and Styles\n2.3\nCharacteristics of typical fabric and other materials\nused in garment industry\n2.4\nPressing requirements procedures\n2.5\nPressing equipment functions\n2.6\nQuality standards and fabric/garment handling\nprocedures\n2.7\nTypes of hemming\n2.8\nFinishing touches procedures\n2.9\nLabeling requirements\n3. Underpinning skills\n3.1\nPressing operation/instruction\n3.2\nHand/machine sewing of accessories and accent\n3.3\nPackaging finished garments\n3.4\nMarking and attaching accessories and accents\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n42\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials and equipment relevant to the activity or\ntask\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect observations /demonstration of candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n43"
