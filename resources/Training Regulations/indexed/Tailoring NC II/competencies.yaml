        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked finishing touches in accordance with\ngarment design/style specifications\n1.2\nMarked and attached accessories and accent\npositions in accordance with garment design/style\nspecifications\n1.3\nPerformed finishing operations in accordance with\ncustomer’s specifications and company’s\nprocedures\n1.4\nFolded and pinned bodice hem allowances and\nsleeves in accordance with customer’s design/style\nspecifications\n1.5\nSewn hem line allowances in accordance with the\ngiven stitch/seam specifications\n1.6\nTrimmed garments of excess threads in accordance\nwith sewing procedures\n1.7\nIdentified faults, spots and marked and appropriate\nactions were taken in accordance with company\nprocedures\n1.8\nPressed finished garment in accordance with\nproduct requirements, fabric specifications and\ncompany procedures\n1.9\nPacked finished garments in accordance with\npackaging standards/procedures\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of trimming and ironing tools\n2.2\nFabric and Styles\n2.3\nCharacteristics of typical fabric and other materials\nused in garment industry\n2.4\nPressing requirements procedures\n2.5\nPressing equipment functions\n2.6\nQuality standards and fabric/garment handling\nprocedures\n2.7\nTypes of hemming\n2.8\nFinishing touches procedures\n2.9\nLabeling requirements\n3. Underpinning skills\n3.1\nPressing operation/instruction\n3.2\nHand/machine sewing of accessories and accent\n3.3\nPackaging finished garments\n3.4\nMarking and attaching accessories and accents\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n42\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials and equipment relevant to the activity or\ntask\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect observations /demonstration of candidate’s\napplication of knowledge to tasks and questioning\nrelated to underpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________\nTR Tailoring NC II (Garment Sector) Promulgated March 2005\n43"
