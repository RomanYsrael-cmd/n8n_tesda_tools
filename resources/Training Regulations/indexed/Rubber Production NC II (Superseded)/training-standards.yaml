  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for RUBBER PRODUCTION NCll.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: RUBBER PRODUCTION Level: NC II\n\nNominal Training Duration:\n18 hrs - Basic Competencies\n\n14 hrs - Common Competencies\n\n290 hrs- Core Competencies\n\n80 hrs. SIT/OJT\n\n322 hrs- Total training duration\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and attitudes of\nRubber Production NCll in accordance with industry standards. It covers core\ncompetencies such as: establish rubber budwood and seedlings nursery, plant rubber\ntrees/rubber seedlings, perform budding operation and harvest latex.\n\nBASIC COMPETENCIES\n(18 hrs.)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 45 ---\nTR – Rubber Production NC II\n\n43\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2. Identify hazards and\nrisks\n4.3. Control hazards and\nrisks\n4.4. Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\n(14 hrs.)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate safety\nmeasures\n1.3. Safekeep/maintain/\ndispose tools, materials\nand outfit.\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use farm\ntools\n2.2. Prepare and operate\nfarm equipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nExercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 46 ---\nTR – Rubber Production NC II\n\n44\nCORE COMPETENCIES\n(290 hrs.)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Establish\nrubber\nbudwood and\nseedlings\nnursery\n1.1. Select rubber budwood\nand seedlings nursery\nsites\n1.2. Germinate seeds\n1.3. Plant germinated seeds\n1.4. Establish budwood\nnursery\n1.5. Perform maintenance\nactivities\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Demonstration\nand\nquestioning\n• Direct\nobservation\nwith\nquestioning\n• Written\nexamination\n2. Plant rubber\ntrees/rubber\nseedlings\n2.1 Select planting site\n2.2 Conduct land preparation\n2.3 Perform lay-outing and\nstaking\n2.4 Plant polybagged,\nbudded rubber seedlings\n2.5 Perform maintenance\nactivities\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Hands on\n• SIT/OJT\n\n• Demonstration\nand\nquestioning of\nrelated\nunderpinning\nknowledge\n• Written\nexamination\n• Practical\nperformance\n3. Perform\nbudding\noperation\n3.1 Prepare for budding\noperation\n3.2 Harvest, handle and\ntransport budsticks\n3.3 Perform actual budding\nand rebudding\n3.4 Cutback the seedlings\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Hands on\n\n• Demonstration\nand\nquestioning of\nrelated\nunderpinning\nknowledge\n• Written\nexamination\n• Practical\nperformance\n4. Harvest latex\n4.1. Identify tappable trees\n4.2. Open tapping panel\n4.3. Perform tapping and\ncollecting latex,\ncuplumps/scrap\n• Discussion\n• Lecture\n• Demonstratio\nn\n• Simulation\n• Hands on\n• SIT/OJT\n• Demonstration\nand questioning\nof related\nunderpinning\nknowledge\n• Written\nexamination\n• Practical\nperformance\n\n--- PDF PAGE 47 ---\nTR – Rubber Production NC II\n\n45\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and\nthe curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real\nworld applications.\n\n--- PDF PAGE 48 ---\nTR – Rubber Production NC II\n\n46\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the\nfollowing requirements.\n\n•\nAble to read and write;\n•\nWith good moral character;\n•\nAbility to communicate, both oral and written\n•\nPhysically fit and mentally healthy as certified by a Public Health Officer\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRUBBER PRODUCTION– NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Rubber Production NC II\n\nRESOURCES:\n\nSUPPLIES AND MAT