  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Rubber Production NC II, the\ncandidate must demonstrate competence in all units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by\nthe TESDA Director General.\n\n4.2\nThe qualification of Rubber Production NC II may be attained through:\n4.2..1. Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n4.2.1.1.\nEstablish rubber budwood and seedlings nursery\n4.2.1.2.\nPerform Budding Operation\n4.2.1.3.\nPlant rubber trees/rubber seedlings\n4.2.1.4.\nHarvest Latex\n\nSuccessful\ncandidates\nshall\nbe\nawarded\nCertificates\nof\nCompetency (COCs) bearing the signature of the Regional\nDirector and Chair of the recognized local industry body.\n\n4.2..2. Demonstration of competence through project-type assessment\ncovering all required units of qualification\n\n4.2.\nAssessment shall focus on the core units of competency. The tool and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.3.\n Candidates can be assessed on individual units of competency and be\nissued Certificates of Competency if found competent. Certificates of\nCompetency shall bear the signature of the Regional Director and Chair\nof the recognized local industry body.\n\n4.4.\nThe following are qualified to apply for assessment and certification:\n4.4.1. Graduates of formal, non – formal and informal including\nenterprise – based training programs\n4.4.2. Experienced workers (wage employed or self – employed)\n\n4.9.\nThe guidelines on assessment and certification are discussed in detail in\nthe Procedures Manual on Assessment and Certification and Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 52 ---\nTR – Rubber Production NC II\n\n50\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nSupermarket of Competencies\nAGRI-FISHERY Sector\n\nEstablish rubber\nbudwood and\nseedlings nursery\n\nPlant rubber\ntrees/rubber\nseedlings\nPerform budding\noperation\nHarvest latex\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\nApply Safely\nMeasures in\nfarm\noperations\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational\nhealth and safety\nprocedures\n\n--- PDF PAGE 53 ---\nTR – Rubber Production NC II\n\n51\nDEFINITION OF TERMS\n\n•\nBudder –one that performs budding operations\n\n•\nBudding -is a form of asexual reproduction in which a new organism\ngrows on another one. The new organism remains attached as it grows,\nseparating from the parent organism only when it is mature. Since the\nreproduction is asexual, the newly created organism is a clone and is\ngenetically identical to the parent organism. A new organism grows from\nan outgrowth or bud on the parent.\n\n•\nFumigant – a chemical compound which acts in the gaseous state to\ndestroy insects and their larvae.\n\n•\nFumigation\n–\nthe\nprocess\nof\ntreating\nstored\nproducts\nwith\ninsecticides/pesticides and the like in fumes or vapor form.\n\n•\nInsect pest – a destructive or harmful insect.\n\n•\nIrrigation - any method of supplying water to sustain plant growth\n\n•\nLatex- as found in nature is a milky fluid found in 10% of all flowering\nplants (angiosperms). It is a complex emulsion consisting of proteins,\nalkaloids, starches, sugars, oils, tannins, resins, and gums that\ncoagulates on exposure to air. It is usually exuded after tissue injury. In\nmost plants, latex is white, but some have yellow, orange, or scarlet latex.\n\n•\nStandard – the set of criteria and specifications of quality determining the\ngrades, described as product characteristics such as maturity, color,\ncleanliness, shape, free from decay and blemishes and uniformity of size.\n\n•\nTappers- performs tapping job\n\n•\nTapping (Rubber) is the process by which the sap (latex) is collected\nfrom a rubber tree. An incision is made in the tree's bark, which cuts\nthrough the planting cycle to optimise the latex yield.\n\n•\nTransplants –seedlings produced for transplanting\n\n--- PDF PAGE 54 ---\nTR – Rubber Production NC II\n\n52\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation\nof these Training Regulations.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nVICTORIA L. MINDORO\nRetired General Manager\nTambanan Agrarian Reform Beneficiaries\nMulti Purpose Coop\nTambanan, Naga, Zamboanga Sibugay\n\nGAUDIOSO M. SALBURO\nProduction Head/General Tapping Inspector\nTambanan Agrarian Reform Beneficiaries\nMulti Purpose Coop\nTambanan, Naga, Zamboanga Sibugay\n\nDr. NAOMI G. TANGONAN\nUniversity Professor\nUniversity of Southern Mindanao\nKabacan, North Cotobato\nROLANDO A. PEREZ\nCAP-PBD Manager\nSulo Agrarian Reform Beneficiaries Multi\nPurpose Cooperative\nSulo, Naga, Zamboanga Sibugay\n\nERNIE T. CALUNSAG\nSulo Agrarian Refom Beneficiaries Multi\nPurpose Cooperative\nSulo, Naga, Zamboanga Sibugay\n\nCHERYL L. EUSALA\nAgricultural Technologist\nLocal Government Unit\nMakilala, North Cotobato\nROMULO L. CENA\nDirector\nPhil. Industrial Crops Research Institute\nKabacan, North Cotabato\nJOAN P. PANDOY\nResearch Assistant\nUniversity of Southern Mindanao\nKabacan, North Cotobato\n\nVLADIMIR T. EUSALA\nFarm Worker I/Rubber Technical Working\nGroup Member\nProvincial Government of Cotabato\nAmas, Kidapawan City\n\nJOSE T. CUEVA\nTapper\nUnited Worker Agrarian Reform Beneficiaries\nMulti Purpose Coop (UWARBMPC)\nMenzi, Isabela City, Basilan Province\n\nAGUSTINO P. ARANCES\nAgriculturist II Provincial Government of\nCotaba