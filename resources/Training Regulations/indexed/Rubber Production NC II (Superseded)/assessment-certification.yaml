      "text": "9. The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 52 --- TR – Rubber Production NC II 50 Supermarket of Competencies AGRI-FISHERY Sector Supermarket of Competencies AGRI-FISHERY Sector Establish rubber budwood and seedlings nursery Plant rubber trees/rubber seedlings Perform budding operation Harvest latex Apply Safely Measures in farm operations Use Farm Tools and Equipment Perform Estimation and Basic Calculation Work in team environment Participate in workplace communication Practice career professionalism Practice occupational health and safety procedures --- PDF PAGE 53 --- TR – Rubber Production NC II 51 • Budder –one that performs budding operations • Budding -is a form of asexual reproduction in which a new organism grows on another one. The new organism remains attached as it grows, separating from the parent organism only when it is mature. Since the reproduction is asexual, the newly created organism is a clone and is genetically identical to the parent organism. A new organism grows from an outgrowth or bud on the parent. • Fumigant – a chemical compound which acts in the gaseous state to destroy insects and their larvae. • Fumigation – the process of treating stored products with insecticides/pesticides and the like in fumes or vapor form. • Insect pest – a destructive or harmful insect. • Irrigation - any method of supplying water to sustain plant growth • Latex- as found in nature is a milky fluid found in 10% of all flowering plants (angiosperms). It is a complex emulsion consisting of proteins, alkaloids, starches, sugars, oils, tannins, resins, and gums that coagulates on exposure to air. It is usually exuded after tissue injury. In most plants, latex is white, but some have yellow, orange, or scarlet latex. • Standard – the set of criteria and specifications of quality determining the grades, described as product characteristics such as maturity, color, cleanliness, shape, free from decay and blemishes and uniformity of size. • Tappers- performs tapping job • Tapping (Rubber) is the process by which the sap (latex) is collected from a rubber tree. An incision is made in the tree's bark, which cuts through the planting cycle to optimise the latex yield. • Transplants –seedlings produced for transplanting --- PDF PAGE 54 --- TR – Rubber Production NC II 52 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. THE TECHNICAL EXPERT PANEL (TEP) VICTORIA L. MINDORO Retired General Manager Tambanan Agrarian Reform Beneficiaries Multi Purpose Coop Tambanan, Naga, Zamboanga Sibugay GAUDIOSO M. SALBURO Production Head/General Tapping Inspector Tambanan Agrarian Reform Beneficiaries Multi Purpose Coop Tambanan, Naga, Zamboanga Sibugay Dr. NAOMI G. TANGONAN University Professor University of Southern Mindanao Kabacan, North Cotobato ROLANDO A. PEREZ CAP-PBD Manager Sulo Agrarian Reform Beneficiaries Multi Purpose Cooperative Sulo, Naga, Zamboanga Sibugay ERNIE T. CALUNSAG Sulo Agrarian Refom Beneficiaries Multi Purpose Cooperative Sulo, Naga, Zamboanga Sibugay CHERYL L. EUSALA Agricultural Technologist Local Government Unit Makilala, North Cotobato ROMULO L. CENA Director Phil. Industrial Crops Research Institute Kabacan, North Cotabato JOAN P. PANDOY Research Assistant University of Southern Mindanao Kabacan, North Cotobato VLADIMIR T. EUSALA Farm Worker I/Rubber Technical Working Group Member Provincial Government of Cotabato Amas, Kidapawan City JOSE T. CUEVA Tapper United Worker Agrarian Reform Beneficiaries Multi Purpose Coop (UWARBMPC) Menzi, Isabela City, Basilan P