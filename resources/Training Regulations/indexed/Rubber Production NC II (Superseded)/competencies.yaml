        "source_text": "AGR612203\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required to\nprepare for budding, harvest, handle and transport\nbudsticks, perform actual budding/rebudding and\ncutback the seedlings.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for budding\noperation\n1.1 Appropriate tools and materials are identified in\naccordance with the job requirement.\n1.2 Sharpening of budding knife is perform following\nprescribed procedure.\n1.3 Budding tape is prepared in accordance to required size.\n1.4 Cleanliness is implemented during budding operation\n1.5 Conditioning of seedling stock and budstick/budwood is\ndone in accordance with the established standards.\n2. Harvest, handle and\ntransport budsticks\n2.1 Selection of budstick/budwood is conducted in\naccordance with the established standards.\n2.2 Harvesting (cutting)of budsticks/budwoods is conducted\nin accordance with the established procedures.\n2.3 Cut-ends of harvested budsticks/budwoods are treated\nwith melted paraffin wax.\n2.4\nTreated budsticks/budwoods are packed and transported\nin accordance with the standard practices.\n3. Perform actual\nbudding/rebudding\n3.1 Selection of seedling rootstocks is conducted in\naccordance with the established standards.\n3.2 Budding/rebudding operation is performed according to\nestablished procedures.\n3.3 Budded rootstock is opened 21 days after budding.\n3.4 Safety precautions are practice according to enterprise\nprocedures.\n4. Cutback the\nseedlings\n4.1 Successfully budded seedlings is cutback according\naccepted procedures.\n4.2 Cutback seedlings are segregated 7 days after cutting.\n4.3 Cutback budded seedlings are maintained according to\nestablished farm practices.\n\n--- PDF PAGE 36 ---\nTR – Rubber Production NC II\n\n34\n\nRANGE OF VARIABLES\nVARIABLE\nSCOPE\n1. Tools and materials Tools and materials include the following but is not limited to:\n1.1\nBudding knife\n1.2\nBudding tape\n1.3\nClean rag\n1.4\nDisinfectant\n\n2. Cleanliness\nThis refers to the following:\n2.1\nWashing and sanitation of tools to be used\n2.2\nCleaning and sanitation of work area\n2.3\nPractice of cleanliness and personal hygiene of the budder\n\n3. Safety precautions\nThis may include but not limited:\n3.1\nProper handling of budding knife\n3.2\nWear protective gloves\n\n4. Accepted\nprocedures\nThis may include but not limited:\n4.1\n7-14 days after opening\n4.2\nLength not less than 100 mm from the budpatch\n\n5. Established farm\npractices.\nThis may include but not limited:\n5.1\nPruning of sideshoots growing from the rootstocks\n5.2\nControl of pests and diseases\n5.3\nApplication of fertilizers\n5.4\nLifting of the polybags\n5.5\nWatering\n5.6\nWeeding\n\n--- PDF PAGE 37 ---\nTR – Rubber Production NC II\n\n35\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency:\n\nAssessment requires evidence that the candidate:\n1.1 Budded seedlings at the right leaf stages.\n1.2 Selected robust/vigorous seedlings\n1.3 Selected and harvested healthy budsticks/budwoodsand\nand at the right leaf stages\n1.4 Performed appropriate budding operations (green or\nbrown budding)\n1.5 Treated,packed and transported budsticks/budwoods\n1.6 Conducted cutback\n2. Required Knowledge\nand Attitude\n\n2.1. Knowledge, Theory, Practices and Systems Operations\n2.1.1. Proper use of budding tools and materials\n2.1.2. Kind of sharpening tools and sharpening\ntechniques\n2.1.3. Techniques in cutting budding tape\n2.1.4. Physical appearance of the conditioned seedlings\nand scion\n2.1.5. Appropriate budding operation (brown or green\nbudding\n2.1.6. Selecting and harvesting budsticks/budwoods\n2.1.7. Proper packaging of budsticks / budwood\n2.1.8. Proper handling of budding knife in doing incision\n2.1.9. Proper extraction of budpatch, ensuring the\npresence of budeye\n2.1.10. Technique in tying securely not pressing the\nbudeye\n2.1.11. Technique in knowing the length (cm) of the\nremaining stem (stock)\n2.1.12. Practice 3Rs and 5S\n2.1.13. Program of work activities are implemented as\nscheduled\n2.2. Communication\n2.2.1. Prepare and submit required reports\n2.3. Mathematics and Mensuration\n2.3.1. Basic mathematical operations\n2.4. Safety Practices\n2.4.1. Proper application use of tools, farm implements\nand equipment.\n2.4.2. Wear appropriate PPE\n2.4.3. Proper waste disposal\n2.5. Codes and Regulations\n2.5.1. Comply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.6. Materials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.6.1. Tools and Equipment\n2.6.1.1. Can understand and follow instructional\nmanuals\n2.6.1.2. Safe keeping of equipments every after use\n2.6.2. Materials\n\n--- PDF PAGE 38 ---\nTR – Rubber Production NC II\n\n36\n2.6.2.1. Where to source good quality supplies, materials\nand equipment needed in the operation of the\nfarm\n2.6.3. Maintenance\n2.6.3.1. Regular upkeep of equipments and facilities\n2.6.3.2. Preventive maintenance skills\n2.7. Values\n2.7.1. Patient\n2.7.2. Positive attitudes towards tasks assignment\n2.7.3. Efficient\n3. Required Skills\n3.1. Skills in sharpening budding knife and cutting of budding\ntape\n3.2. Able to identify conditioned seedlings and\nbudsticks/budwood for budding\n3.3. Able to identify compatibility of stock and scion.\n3.4. Able to identify leaf stages of stock and scion due for\nbudding\n3.5. Ability to make correct incision of the seedling stock and\nof the budpatch\n3.6. Can demonstrate the right procedures of budding.\n3.7. Can demonstrate cutback of seedlings\n4. Method of Assessment\nCompetency in this unit must be assessed through:\n4.1. Demonstration with questions\n4.2. Oral questioning\n5. Resource Implications\n5.1. All supplies, materials and farm implements needed\nduring farm operations should be readily available at the\nfarm site\n5.1.1 Budding knife\n5.1.2 Sharpening tool\n5.1.3 Budding tape\n5.1.4 Clean rag\n5.1.5 Disinfectant\n5.1.6 PPE\n5.1.7 Budsticks/ budwood\n5.1.8 Seedling stock and scion\n5.2. All workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3. Technical supervisors should have skills and ability in\nthe successful implementation of work program activities\n6. Context of Assessment 6.1. Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 39 ---\nTR – Rubber Production NC II\n\n37\nUNIT OF COMPETENCY :\nHARVEST LATEX\n\nUNIT CODE\n\n:"
