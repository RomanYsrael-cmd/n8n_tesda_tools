        "source_text": "AGR612204\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required to\nperform tapping and collecting which perform dotting\nand marking of rubber trees, install tapping materials,\nprepare tools and materials for tapping, perform\ntapping and collect latex and cuplumps.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1.\nIdentify tappable trees\n\n1.1 Tappable trees are identified according to standard\ncriteria.\n1.2 Dot on tappable trees are placed in accordance\nwith the standard.\n1.3 Trees are marked in accordance with the marking\nstandards.\n2. Open the tapping panel\n\n2.1 Tools and materials for tapping are prepared and\ninspected.\n2.2 Tapping panel is opened based on standard\nprocedures.\n2.3 Tapping materials are installed in accordance with\nthe standards and requirements.\n3. Perform tapping and\ncollect ion latex or\ncuplumps/scrap\n\n3.1 Tapping is performed in accordance with the\nstandards.\n3.2 Materials in collecting latex are prepared\n3.3 Coagulants/anti-coagulant are prepared in\naccordance with prescribed standards.\n3.4 Latex and cuplump/scrap is collected and stored\naccording to established farm standards.\n3.5 Coagulants are applied in latex for cuplump or\ncoagulum production.\n\n--- PDF PAGE 40 ---\nTR – Rubber Production NC II\n\n38\nRANGE OF VARIABLES\nVARIABLE\nSCOPE\n1. Standard criteria\nBudded trees have:\n1.1\n45 cm trunk in circumference\n1.2\n1.5 m from the ground or stock-scion union\nSeedling trees have:\n1.3\n45 cm trunk in circumference\n1.4\n0.75 m from the ground\n\n2. Dot\nThis includes:\n2.1\n1 dot 43 centimeter\n2.2\ndots 44 centimeter\n2.3\ndot 45 centimeter\n2.4\ndot 46 centimeter\n\n3. Marking\nstandards\nThis includes:\nBudded trees\n3.1\nHeight 1.50 m from the ground or stock-scion union\n3.2\nAngle of slope of the tapping cut for downward tapping\n30 degree\n3.3\nAngle of slope of the tapping cut for upward tapping\n45 degree\n3.4\nFront and back canals depend on the length of the\ntapping cut adopted.\nSeedling trees\n3.5\nHeight 0.75 m from the ground\n3.6\nAngle of slope of the tapping cut for downward tapping\n25 degree\n3.7\nAngle of slope of the tapping cut for upward tapping 45\ndegree\n3.8\nFront and back canals depend on the length of the\ntapping cut adopted.\n\n4. Tools and\nmaterials\nThis may include but not limited to:\n4.1\nPersonal Protective Equipment\n4.1.1 Rubber boots\n4.1.2 Head gear\n4.1.3 Googles\n4.1.4 Body protector (jacket etc.)\n4.1.5 Gloves\n4.1.6 Mask\n4.2\nBrush for upward tapping\n4.3\nCoagulants/Anti-coagulant\n4.4\nTapping knife\n\n--- PDF PAGE 41 ---\nTR – Rubber Production NC II\n\n39\n4.5\nSpout\n4.6\nCup holder\n4.7\nWire Spring\n4.8\nCollecting cup\n4.9\nTemplate\n4.10 String\n4.11 Collecting pail/bucket/container\n4.12 Balancer\n4.13 Scoop\n5. Standard\nprocedures\nThis may include:\n5.1\nHeight of the tapping cut\n5.2\nLength of the tapping cut\n5.3\nAngle of slope of the tapping cut\n6. Standards\nThis may include:\n6.1\nFor tappers:\n6.1.1 Proper handling of tapping knife\n6.1.2 Proper footwork/stepping\n For bark consumption:\n6.1.3 1.2-1.6 mm per tapping (2.2 - 2.5 cm per month\nbark consumption)S/2, d/2 downward tapping\n6.1.4 mm per tapping (2.5-3cm per month bark\nconsumption) S/2, d/2 upward tapping\n6.2\nLength of tapping cut\n6.2.1 S/2 (1/2 of the tree circumference)\n6.3\nAngle of the slope of the tapping cut\n6.3.1 Budded-30 degree\n6.3.2 Seedling -25 degree\n6.4\nTime of tapping\n6.4.1 As early as possible before sunrise and tapping\ntask should be finished within 3 hours\n6.4.2 No more tapping task should be done after 9:00\nAM\n6.5\nDepth of tapping cut\n6.5.1 1 mm away from the cambium layer\n6.6\nTapping speed\n6.6.1 20-25 seconds/tree\n7. Coagulants /anti-\ncoagulant\nThis may include:\n7.1\nFormic acid\n7.2\nAcetic acid\n7.3\nAnti-coagulant (liquid ammonia, sodium bisulfite,\nothers)\n\n--- PDF PAGE 42 ---\nTR – Rubber Production NC II\n\n40\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1. Dotted and marked tappable rubber trees\n2. Installed tapping materials\n3. Performed tapping\n2. Required\nKnowledge and\nAttitudes\n\n2.1. Knowledge, Theory, Practices and Systems Operations\n2.1.1.\nCriteria of tappability\n2.1.2.\nTechniques in opening tappable trees\n2.1.3.\nInstallation techniques of tapping materials\n2.1.4.\nTools for tapping and their functions\n2.1.5.\nSharpening technique for tapping knife\n2.1.6.\nImportance of sharp tapping knife\n2.1.7.\nImportance and maintenance of bark\nconsumption\n2.1.8.\nPurpose of coagulants\n2.1.9.\nUses and importance of the latex/cuplump\ncollecting materials.\n2.1.10. Standard coagulants solution set by enterprise\n2.1.11. Handling of latex and cuplumps\n2.1.12. Practice 3Rs and 5S\n2.1.13. Parts and functions of specific tools and farm\nimplements use in tapping\n2.1.14. Program of work activities are implemented as\nscheduled\n2.2. Communication\n2.2.1. Prepare and submit required reports\n2.2.2. Documentation of harvesting operations\n2.3. Mathematics and Mensuration\n2.3.1.\nBasic mathematical operations\n2.3.2.\nPercentage and parts per ppm\n2.3.3.\nUnit conversion\n2.4. Safety Practices\n2.4.1. Proper application use of tools, farm implements\nand equipment.\n2.4.2. Proper use of cutting tools\n2.4.3. Wear appropriate PPE\n2.4.4. Handling of chemicals\n2.4.5. Proper waste disposal\n2.5. Codes and Regulations\n2.5.1. Comply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.5.2. Within the codes and regulations set by Bureau of\nPlant Industry\n2.6. Materials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.6.1. Tools and Equipment\n2.6.1.1. Can understand and follow instructional\nmanuals\n2.6.1.2. Safe keeping of equipments every after use\n2.6.2. Materials\n\n--- PDF PAGE 43 ---\nTR – Rubber Production NC II\n\n41\n2.6.2.1. Where to source good quality supplies, materials\nand equipment needed in the operation of the\nfarm\n2.6.3. Maintenance\n2.6.3.1. Regular upkeep of equipments and facilities\n2.6.3.2. Preventive maintenance skills\n2.7. Values\n2.7.1. Safety consciousness\n2.7.2. Time consciousness and management\n2.7.3. Resourcefulness\n2.7.4. Cost consciousness\n2.7.5. Diligence\n2.7.6. Determined\n2.7.7. Observes hygiene\n3. Required Skills\n3.1. Placing marks\n3.2. Sharpening tapping knife\n3.3. Collecting tread lace, cleaning of collecting cups and\ntapping\n3.4. Performing tapping procedure such as installation of\ntapping materials\n3.5. Preparing/mixing of coagulants and applying\n3.6. Collecting/Harvesting latex/cup lump\n3.7. Basic mathematical skills\n3.8. Skills in preparation of reports\n3.9. Oral and written communication\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Direct observation and questioning of the trainee\n4.2. Demonstration\n4.3. Third Party Report,\n5. Resource\nImplications\n5.1 All supplies, materials and farm implements needed during\nfarm operations should be readily available at the farm\nsite:\n• Rubber plantation\n• Tools and equipment essential to rubber harvesting\n• Trained/tamed work animals\n• Supplies and materials in harvesting procedures\n5.2 Protective clothing equipment and materials All workers\ninvolved in different activities must be fully oriented and\ncautioned on the different specific work activities of the\nfarm\n5.3 Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities\n6. Context of\nAssessment\n\n6.1. Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 44 ---\nTR – Rubber Production NC II\n\n42"
