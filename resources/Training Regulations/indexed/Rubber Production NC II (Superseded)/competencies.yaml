nd budwoods\n3.7\nApplying appropriate weed control measures\n3.8\nHandling of fertilizers, herbicides, insecticides and other\nchemicals.\n3.9\nIdentifying of diseased/unhealthy seedlings\n3.10 Pruning and trenching\n3.11 Performing other routinary maintenance activities\n3.12 Reading technical report and communicating in the\nworkplace.\n3.13 Monitoring and data recording\n\n--- PDF PAGE 30 ---\nTR – Rubber Production NC II\n\n28\n4. Method of Assessment\nCompetency in this unit must be assessed through:\n4.1 Demonstration with questioning\n4.2 Interview\n4.3 Portfolio\n4.4 Third party report\n5. Resource Implications\n5.1 All supplies, materials and equipment needed during the\noperations should be readily available at site. These\ninclude:\n5.1.1 Tools and farm implements use in clearing and land\npreparation.\n5.1.2 PPE (Personal Protective Equipment)\n5.1.3 Soil sampler\n5.1.4 Seeds\n5.1.5 Seedlings\n5.1.6 Planting materials (recommended clones)\n5.1.7 Polybags\n5.1.8 Fertilizers\n5.1.9 Insecticides/pesticides/ herbicides/fungicides\n5.1.10 Sprayers\n5.1.11 Digging tools\n5.1.12 Plan\n5.1.13 Pruning tools and equipment\n5.2 All workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3 Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities\n6. Context of Assessment 6.1. Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 31 ---\nTR – Rubber Production NC II\n\n29\nUNIT OF COMPETENCY :\nPLANT RUBBER TREES/RUBBER SEEDLINGS\n\nUNIT CODE\n\n:\nAGR 612202\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required to\nselect planting site, conduct land preparation, perform\nsite laying-out and staking, plant poly-bagged,\nbudded rubber seedling and perform maintenance\nactivities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select planting site\n\n1.1. Ocular inspection of the site is conducted .\n1.2. Soil samples are gathered for analysis in accordance\nwith standard procedures.\n1.3. Site is selected based on results of analysis and\nsuitability of area.\n2. Conduct land\npreparation\n\n2.1. Clearing operation is carried-out in accordance with\nenterprise policy\n2.2. Drainage and canals are prepared in accordance with the\ntechnical plan.\n2.3. Safety precautions are practiced according to\nenterprise procedures.\n3. Perform site lay-\nouting and staking\n\n3.1 Site is laid out and staked according to the preference of\nthe rubber growers/farmers\n3.2 Holes are dug according to plan\n4. Plant poly-bagged,\nbudded rubber\nseedling\n\n4.1. Seedlings are distributed on the holes according to plan.\n4.2. Basal fertilizer is applied according to the result of soil\nanalysis\n4.3. Seedlings are planted based on established farm\nprocedures.\n5. Perform\nmaintenance\nactivities\n5.1 Weeding is performed according to established farm\nprocedures\n5.2 Insect/disease control and prevention is employed as\nneeded.\n5.3 Drainage is maintained according to standards.\n5.4 Branch induction is conducted in accordance with\nestablished farm practices.\n5.5 Pruning is performed in accordance with enterprise\nstandard and safety practices.\n5.6 Replanting is carried-out as needed.\n\n--- PDF PAGE 32 ---\nTR – Rubber Production NC II\n\n30\n\nRANGE OF VARIABLES\n\nVARIABLE\nSCOPE\n1. Suitability of area\nThis pertains to the following:\n1.1\nTerrain\n1.2\nSoil suitability\n1.3\nAvailability of labor force\n1.4\nAccessibility\n2. Clearing operation\nThis may include the following but is not limited to:\n2.1\nTree felling\n2.2\nHeaping and burning\n2.3\nSlashing\n2.4\nPlowing\n2.5\nHarrowing\n2.6\nTerracing\n2.7\nDrainage\n3. Safety precautions\nThese refers to the following:\n3.1\nWearing of appropriate personal protective equipment\n(PPE)\n3.2\nHandling of tools\n3.3\nFollowing instructions of manual in equipment operation\n3.4\nAwareness and control of various hazards of the operation\n4. Fertilizer\nThis includes the following:\n4.1\nOrganic/Compost\n4.2\nInorganic/chemicals/synthetics\n5. Weeding\nThis includes the following but is not limited to:\n5.1\nTree row/Strip weeding\n5.2\nInter-row/General weeding\n5.3\nRound weeding\n5.4\nRolling over tall weeds\n5.5\nApplication of herbicides\n6. Insect/disease\ncontrol and\nprevention\nThese refers to the following:\n6.1\nCover cropping\n6.2\nIntercropping\n6.3\nFogging/dusting\n\n--- PDF PAGE 33 ---\nTR – Rubber Production NC II\n\n31\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency:\nAssessment requires evidence that the candidate:\n1.1. Prepared site for planting seedlings.\n1.2. Transplanted poly-bagged, budded rubber seedlings\n1.3. Safety precautions are practiced in the conduct of land\npreparations\n2. Required Knowledge\nand Skills\n\n2.1. Knowledge, Theory, Practices and Systems Operations\n2.1.1. Soil characterizations\n2.1.2. Rubber-based farming system\n2.1.3. Uses and application of tools and farm implements\n2.1.4. Digging canals and drainage\n2.1.5. Land preparation\n2.1.6. Practice 3Rs and 5S\n2.1.7. Program of work activities are implemented as\nscheduled\n2.2. Communication\n2.2.1. Prepare and submit required reports\n2.3. Mathematics and Mensuration\n2.3.1. Basic mathematical operations\n2.3.2. Percentages and rations\n2.3.3. Measuring distances\n2.4. Safety Practices\n2.4.1. Proper application of chemicals such as fertilizer,\npesticides and insecticides.\n2.4.2. Proper application use of tools, farm implements\nand equipment.\n2.4.3. Wear appropriate PPE\n2.4.4. Proper spraying techniques\n2.4.5. Safety procedures in handling and storage of\nchemicals\n2.4.6. Disposal of chemicals and containers\n2.5. Codes and Regulations\n2.5.1. Comply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.6. Materials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.6.1. Tools and Equipment\n2.6.1.1. Can understand and follow instructional\nmanuals\n2.6.1.2. Safe keeping of equipments every after use\n2.6.2. Materials\n2.6.2.1. Where to source good quality supplies,\nmaterials and equipment needed in the\noperation of the farm\n2.6.3. Maintenance\n2.6.3.1. Regular upkeep of equipments and facilities\n2.6.3.2. Preventive maintenance skills\n2.7. Values\n\n--- PDF PAGE 34 ---\nTR – Rubber Production NC II\n\n32\n2.7.1. Honesty\n2.7.2. Patient\n2.7.3. Time conscious\n2.7.4. Sincerity\n2.7.5. Positive attitudes towards tasks assignment’\n2.7.6. Diligence and Perseverance\n3.Required Skills\n3.1. Planting rubber trees\n3.2. Using of tools and farm implements including\nmaintenance and simple repair.\n3.3. Monitoring and data recording\n3.4. Reading and following layout plan\n3.5. Skill in measurement of area and distances\n4. Method of Assessment\nCompetency in this unit must be assessed through:\n4.1. Demonstration\n4.2. Oral questioning\n4.3. Third party report\n5. Resource Implications\n5.1. All supplies, materials and equipment needed during\nfarm operations should be readily available at the farm\nsite\n• Tools and farm implements use in activities such as\nclearing and plowing sites, digging, among others.\n• PPE\n• Soil sampler\n• Fertilizers\n• Insecticides/pesticides\n• Layout plan\n• Digging tools\n• Stakes\n• Sprayer\n5.2. All workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3. Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities\n6. Context of Assessment 6.1. Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 35 ---\nTR – Rubber Production NC II\n\n33\n\nUNIT OF COMPETENCY :\nPERFORM BUDDING OPERATION\n\nUNIT CODE\n\n:\nAGR612203\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required to\nprepare for budding, harvest, handle and transport\nbudsticks, perform actual budding/rebudding and\ncutback the seedlings.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for budding\noperation\n1.1 Appropriate tools and materials are identified in\naccordance with the job requirement.\n1.2 Sharpening of budding knife is perform following\nprescribed procedure.\n1.3 Budding tape is prepared in accordance to required size.\n1.4 Cleanliness is implemented during budding operation\n1.5 Conditioning of seedling stock and budstick/budwood is\ndone in accordance with the established standards.\n2. Harvest, handle and\ntransport budsticks\n2.1 Selection of budstick/budwood is conducted in\naccordance with the established standards.\n2.2 Harvesting (cutting)of budsticks/budwoods is conducted\nin accordance with the established procedures.\n2.3 Cut-ends of harvested budsticks/budwoods are treated\nwith melted paraffin wax.\n2.4\nTreated budsticks/budwoods are packed and transported\nin accordance with the standard practices.\n3. Perform actual\nbudding/rebudding\n3.1 Selection of seedling rootstocks is conducted in\naccordance with the established standards.\n3.2 Budding/rebudding operation is performed according to\nestablished procedures.\n3.3 Budded rootstock is opened 21 days after budding.\n3.4 Safety precautions are practice according to enterprise\nprocedures.\n4. Cutback the\nseedlings\n4.1 Successfully budded seedlings is cutback according\naccepted procedures.\n4.2 Cutback seedlings are segregated 7 days after cutting.\n4.3 Cutback budded seedlings are maintained according to\nestablished farm practices.\n\n--- PDF PAGE 36 ---\nTR – Rubber Production NC II\n\n34\n\nRANGE OF VARIABLES\nVARIABLE\nSCOPE\n1. Tools and materials Tools and materials include the following but is not limited to:\n1.1\nBudding knife\n1.2\nBudding tape\n1.3\nClean rag\n1.4\nDisinfectant\n\n2. Cleanliness\nThis refers to the 