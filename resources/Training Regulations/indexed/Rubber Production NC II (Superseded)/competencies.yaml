        "source_text": "AGR 612201\nUNIT DESCRIPTOR\n: This unit covers the knowledge and skills required to\nselect rubber budwood and nursery site, germinate\nseeds, plant germinated seeds in polybags, perform\nmaintenance activities and establish budwood nursery\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select rubber\nbudwood and\nseedlings nursery\nsites\n\n1.1 Ocular inspection of the site is conducted.\n1.2 Soil samples are gathered for analysis in accordance with\nstandard procedures.\n1.3 Site is selected based on results of analysis and site\nevaluation.\n1.4 Site selected is secured from stray animals and\nunauthorized persons.\n2. Germinate seeds\n2.1 Selection of seeds for rootstocks is made according to seed\nquality standards.\n2.2 Seedbed is prepared following the required standards.\n2.3 Seeds are germinated in seedbed according to established\nfarm procedures.\n3. Plant germinated\nseeds\n\n3.1 Land preparation is performed according to established\nfarm procedures and observance of safety precautionary\nmeasures\n3.2 Germinated seeds are planted in polybags or directly on\nground.\n3.3 Unhealthy seedlings are culled and replaced in\naccordance to environmental regulations.\n4. Establish budwood\nnursery\n\n4.1 Land preparation is performed accordance to established\nfarm procedures.\n4.2 Budded rubber seedling is planted according to prescribed\nprocedures and standards\n4.3 Budded rubber seedlings are planted according to clones.\n4.4 Routinary maintenance activities for seedlings are\ncarried out according to established farm practices.\n4.5 Safety precautionary measures are practiced according\nto established procedures.\n5. Perform maintenance\nactivities\n5.1 Weeding is performed according to established farm\nprocedures\n5.2 Drainage is constructed and maintained according to\nprocedures and plan.\n5.3 Fertilizer is applied based on the results of soil analysis\nand in accordance with the prescribed procedure\n5.4 Pruning is performed in accordance with established\nstandard and safety practices.\n\n--- PDF PAGE 26 ---\nTR – Rubber Production NC II\n\n24\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nSCOPE\n1. Site evaluation\nThis may include, but is not limited to:\n1.1. Water source\n1.2. Accessibility (transport)\n1.3. Labor/ propagator\n1.4. Topography\n1.5. Distance to the proposed plantation site\n1.6. Distance to the budwood nursery\n1.7. Demand of planting materials\n1.8. Peace and order\n1.9. Potting medium\n2. Seed quality\nstandards\nThis may include, but is not limited to:\n2.1. Fresh\n2.2. Shiny\n2.3. Heavy\n3. Required\nstandards\nThis includes:\n3.1 Seedbed size\n3.2 Dimension\n3.3 Soil medium\n4. Safety\nprecautionary\nmeasures\nThis includes:\n4.1. Wearing of appropriate personal protective equipment\n(PPE)\n4.2. Handling of tools\n4.3. Following instructions of manual in equipment\noperation\n4.4. Awareness and control of various hazards of the\noperation\n5. Unhealthy\nseedlings\nThis may include, but is not limited to:\n5.1 Diseased\n5.2 Slow growing\n5.3 Damaged\n5.4 Genetically defective\n\n--- PDF PAGE 27 ---\nTR – Rubber Production NC II\n\n25\n\n6. Prescribed\nprocedures and\nstandards\nThis may include, but is not limited to:\n6.1. Distance of planting\n6.2. Depth and size of the holes\n7. Clones\nThis may include, but is not limited to:\n7.1. RRIM 600\n7.2. PB 260\n7.3. PB 330\n7.4. TJIR 1\n7.5. RRIM 712\n7.6. PB 235\n7.7. PB 350\n7.8. PR107\n7.9. NSIC (National Seed Industry Council) recommended\nclones\n8. Routinary\nmaintenance\nactivities\nThese includes the following:\n8.1. watering\n8.2. weeding\n8.3. fertilization\n8.4. spraying of insecticide and fungicide\n8.5. pruning\n9. Weeding\nThis may include, but is not limited to:\n9.1. Tree row/Strip weeding\n9.2. Inter-row/General weeding\n9.3. Round weeding\n9.4. Rolling over tall weeds\n9.5. Application of herbicides\n10. Fertilizer\nThis includes:\n10.1. Organic/Compost\n10.2. Inorganic/chemicals/synthetics\n\n--- PDF PAGE 28 ---\nTR – Rubber Production NC II\n\n26\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency:\n\nAssessment requires evidence that the candidate:\n1.1 Established nursery for rubber plant seedlings and\nbudwoods.\n1.2 Germinated rubber plant seeds.\n1.3 Planted germinated seeds\n1.4 Grew high-yielding budded clones of seedlings.\n1.5 Produced quality planting materials\n1.6 Performed routinary maintenance activities.\n2. Required Knowledge\nand Skills\n\n2.1. Knowledge, Theory, Practices and Systems Operations\n2.1.1. Nursery establishment and operations\n2.1.2. Seed selection and clonal identification.\n2.1.3. Soil analysis\n2.1.4. Germinating rubber seeds\n2.1.5. Growing rubber seedlings.\n2.1.6. Planting germinated seeds\n2.1.7. Signs and symptoms of unhealthy /diseased\nrubber seedlings, budwoods and plants\n2.1.8. Insect pest of rubber plant\n2.1.9. Types of weeds\n2.1.10. Types of chemicals\n2.1.11. Technical specifications of plan\n2.1.12. Pruning\n2.1.13. Trenching\n2.1.14. Types of fertilizer\n2.1.15. Different cover crops\n2.1.16. Compost\n2.1.17. Green and brown budding\n2.1.18. Practice of 3Rs and 5S\n2.1.19. Program of work activities are implemented as\nscheduled\n2.2. Communication\n2.2.1. Prepare and submit required reports\n2.3. Mathematics and Mensuration\n2.3.1. Basic mathematical operations\n2.3.2. Production recording\n2.3.3. Percentages and rations\n2.4. Safety Practices\n2.4.1. Proper application of chemicals such as fertilizer,\npesticides and insecticides.\n2.4.2. Proper application use of tools, farm implements\nand equipment.\n2.4.3. Wear appropriate PPE\n2.4.4. Proper spraying techniques\n\n--- PDF PAGE 29 ---\nTR – Rubber Production NC II\n\n27\n2.4.5. Safety procedures in handling and storage of\nchemicals\n2.4.6. Disposal of chemicals and containers\n2.5. Codes and Regulations\n2.5.1.\nComply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.6. Materials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.6.1. Tools and Equipment\n2.6.1.1. Can understand and follow instructional manuals\n2.6.1.2. Safe keeping of equipments every after use\n2.6.2. Materials\n2.6.2.1. Where to source good quality supplies, materials\nand equipment needed in the operation of the\nfarm\n2.6.3. Maintenance\n2.6.3.1. Regular upkeep of equipments and facilities\n2.6.3.2. Preventive maintenance skills\n2.7. Values\n2.7.1. Honesty\n2.7.2. Patient\n2.7.3. Time conscious\n2.7.4. Sincerity\n2.7.5. Positive attitudes towards tasks assignment’\n2.7.6. Safety consciousness\n2.7.7. Resourcefulness\n2.7.8. Cost consciousness\n3. Required Skills\n3.1\nUsing tools and operating simple farm\nimplements/equipment including basic maintenance,\nsimple repair and storage.\n3.2\nReading and following lay-out plan\n3.3\n Lay-outing and staking\n3.4\nMeasuring area and distances\n3.5\nSelecting seed and identifying clone\n3.6\nPlanting germinated seedlings and budwoods\n3.7\nApplying appropriate weed control measures\n3.8\nHandling of fertilizers, herbicides, insecticides and other\nchemicals.\n3.9\nIdentifying of diseased/unhealthy seedlings\n3.10 Pruning and trenching\n3.11 Performing other routinary maintenance activities\n3.12 Reading technical report and communicating in the\nworkplace.\n3.13 Monitoring and data recording\n\n--- PDF PAGE 30 ---\nTR – Rubber Production NC II\n\n28\n4. Method of Assessment\nCompetency in this unit must be assessed through:\n4.1 Demonstration with questioning\n4.2 Interview\n4.3 Portfolio\n4.4 Third party report\n5. Resource Implications\n5.1 All supplies, materials and equipment needed during the\noperations should be readily available at site. These\ninclude:\n5.1.1 Tools and farm implements use in clearing and land\npreparation.\n5.1.2 PPE (Personal Protective Equipment)\n5.1.3 Soil sampler\n5.1.4 Seeds\n5.1.5 Seedlings\n5.1.6 Planting materials (recommended clones)\n5.1.7 Polybags\n5.1.8 Fertilizers\n5.1.9 Insecticides/pesticides/ herbicides/fungicides\n5.1.10 Sprayers\n5.1.11 Digging tools\n5.1.12 Plan\n5.1.13 Pruning tools and equipment\n5.2 All workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3 Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities\n6. Context of Assessment 6.1. Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 31 ---\nTR – Rubber Production NC II\n\n29\nUNIT OF COMPETENCY :\nPLANT RUBBER TREES/RUBBER SEEDLINGS\n\nUNIT CODE\n\n:"
