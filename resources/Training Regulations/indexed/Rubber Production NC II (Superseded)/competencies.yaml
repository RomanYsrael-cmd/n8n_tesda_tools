          "source_text": "VARIABLE \nSCOPE \n1. Standard criteria \nBudded trees have: \n1.1 \n45 cm trunk in circumference \n1.2 \n1.5 m from the ground or stock-scion union \nSeedling trees have: \n1.3 \n45 cm trunk in circumference   \n1.4 \n0.75 m from the ground  \n \n2. Dot  \nThis includes: \n2.1 \n1 dot 43 centimeter \n2.2 \ndots 44 centimeter \n2.3 \ndot 45 centimeter \n2.4 \ndot 46 centimeter \n \n3. Marking \nstandards \nThis includes: \nBudded trees \n3.1 \nHeight 1.50 m from the ground or stock-scion union  \n3.2 \nAngle of slope  of the tapping cut for downward tapping \n30 degree \n3.3 \nAngle of slope  of the tapping cut  for upward tapping  \n45 degree \n3.4 \nFront and back canals depend on the length of the \ntapping cut adopted. \nSeedling trees \n3.5 \nHeight 0.75 m from the ground   \n3.6 \nAngle of slope  of the tapping cut for downward tapping \n25 degree \n3.7 \nAngle of slope  of the tapping cut  for upward tapping 45 \ndegree \n3.8 \nFront and back canals depend on the length of the \ntapping cut adopted. \n \n4. Tools and \nmaterials   \nThis may include but not limited to: \n4.1 \nPersonal Protective Equipment \n4.1.1 Rubber boots \n4.1.2 Head gear \n4.1.3 Googles \n4.1.4 Body protector (jacket etc.) \n4.1.5 Gloves  \n4.1.6 Mask  \n4.2 \nBrush for upward tapping \n4.3 \nCoagulants/Anti-coagulant  \n4.4 \nTapping knife\n\n--- PDF PAGE 41 ---\nTR – Rubber Production NC II \n \n39\n4.5 \nSpout  \n4.6 \nCup holder  \n4.7 \nWire Spring  \n4.8 \nCollecting cup  \n4.9 \nTemplate \n4.10 String \n4.11 Collecting pail/bucket/container \n4.12 Balancer  \n4.13 Scoop  \n5. Standard \nprocedures \nThis may include: \n5.1 \nHeight of the tapping cut \n5.2 \nLength of the tapping cut \n5.3 \nAngle of slope of the tapping cut  \n6. Standards   \nThis may include: \n6.1 \nFor tappers: \n6.1.1 Proper handling of tapping knife  \n6.1.2 Proper  footwork/stepping \n For bark consumption: \n6.1.3 1.2-1.6 mm per tapping (2.2 - 2.5 cm per month \nbark consumption)S/2, d/2 downward tapping \n6.1.4 mm per tapping (2.5-3cm per month bark \nconsumption) S/2, d/2 upward tapping \n6.2 \nLength of tapping cut \n6.2.1 S/2 (1/2 of the tree circumference)  \n6.3 \nAngle of the slope of the tapping cut \n6.3.1 Budded-30 degree \n6.3.2 Seedling -25 degree  \n6.4 \nTime of tapping \n6.4.1 As early as possible before sunrise and  tapping \ntask should be finished within 3 hours \n6.4.2 No more tapping task should be done after 9:00 \nAM \n6.5 \nDepth of tapping cut \n6.5.1 1 mm away from the cambium layer \n6.6 \nTapping speed \n6.6.1 20-25 seconds/tree  \n7. Coagulants /anti-\ncoagulant \nThis may include: \n7.1 \nFormic acid \n7.2 \nAcetic acid \n7.3 \nAnti-coagulant (liquid ammonia, sodium bisulfite, \nothers)\n\n--- PDF PAGE 42 ---\nTR – Rubber Production NC II \n \n40"
