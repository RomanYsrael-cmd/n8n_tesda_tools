          "source_text": "1. Select planting site \n \n1.1. Ocular inspection of the site is conducted . \n1.2. Soil samples are gathered for analysis in accordance \nwith standard procedures. \n1.3. Site is selected based on results of analysis and \nsuitability of area. \n2. Conduct land \npreparation \n \n2.1. Clearing operation is  carried-out in accordance with \nenterprise policy \n2.2. Drainage and canals are prepared in accordance with the \ntechnical plan. \n2.3. Safety precautions are practiced according to \nenterprise procedures. \n3. Perform site lay-\nouting  and staking \n \n3.1 Site is laid out and staked according to the preference of \nthe rubber growers/farmers \n3.2 Holes are dug according to plan   \n4. Plant poly-bagged,  \nbudded rubber \nseedling \n \n4.1. Seedlings are distributed on the holes according to plan. \n4.2. Basal fertilizer is applied according to the result of soil \nanalysis  \n4.3. Seedlings are planted based on established farm \nprocedures. \n5. Perform \nmaintenance \nactivities \n5.1 Weeding is performed according to established farm \nprocedures \n5.2 Insect/disease control and prevention is employed as \nneeded. \n5.3 Drainage is maintained according to standards. \n5.4 Branch induction is conducted in accordance with \nestablished farm practices. \n5.5 Pruning is performed in accordance with enterprise \nstandard and safety practices. \n5.6 Replanting is carried-out as needed.\n\n--- PDF PAGE 32 ---\nTR – Rubber Production NC II \n \n30\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Suitability of area \nThis pertains to the following: \n1.1 \nTerrain  \n1.2 \nSoil suitability \n1.3 \nAvailability of labor force \n1.4 \nAccessibility \n2. Clearing operation \nThis may include the following but is not limited to: \n2.1 \nTree felling \n2.2 \nHeaping and burning  \n2.3 \nSlashing \n2.4 \nPlowing \n2.5 \nHarrowing \n2.6 \nTerracing \n2.7 \nDrainage \n3. Safety precautions \nThese refers to the following: \n3.1 \nWear