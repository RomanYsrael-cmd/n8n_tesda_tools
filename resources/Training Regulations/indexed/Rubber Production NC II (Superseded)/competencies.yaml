pplies, materials\nand equipment needed in the operation of the\nfarm\n2.6.3. Maintenance\n2.6.3.1. Regular upkeep of equipments and facilities\n2.6.3.2. Preventive maintenance skills\n2.7. Values\n2.7.1. Patient\n2.7.2. Positive attitudes towards tasks assignment\n2.7.3. Efficient\n3. Required Skills\n3.1. Skills in sharpening budding knife and cutting of budding\ntape\n3.2. Able to identify conditioned seedlings and\nbudsticks/budwood for budding\n3.3. Able to identify compatibility of stock and scion.\n3.4. Able to identify leaf stages of stock and scion due for\nbudding\n3.5. Ability to make correct incision of the seedling stock and\nof the budpatch\n3.6. Can demonstrate the right procedures of budding.\n3.7. Can demonstrate cutback of seedlings\n4. Method of Assessment\nCompetency in this unit must be assessed through:\n4.1. Demonstration with questions\n4.2. Oral questioning\n5. Resource Implications\n5.1. All supplies, materials and farm implements needed\nduring farm operations should be readily available at the\nfarm site\n5.1.1 Budding knife\n5.1.2 Sharpening tool\n5.1.3 Budding tape\n5.1.4 Clean rag\n5.1.5 Disinfectant\n5.1.6 PPE\n5.1.7 Budsticks/ budwood\n5.1.8 Seedling stock and scion\n5.2. All workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n5.3. Technical supervisors should have skills and ability in\nthe successful implementation of work program activities\n6. Context of Assessment 6.1. Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 39 ---\nTR – Rubber Production NC II\n\n37\nUNIT OF COMPETENCY :\nHARVEST LATEX\n\nUNIT CODE\n\n:"
