arify feedback on information/concerns raised with\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nWorkplace\n2.2\nTools, materials and equipment relevant to the tasks\n2.3\nPPE\n2.4\nManuals and references\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration\n3.2\nOral questioning\n3.3\nWritten examination\n4. Context for\nAssessment\n4.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n4.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 36 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n32\n\nUNIT OF COMPETENCY\n: PRACTICE ENTREPRENEURIAL SKILLS IN THE\nWORKPLACE\n\nUNIT CODE\n: 400311218\n\nUNIT DESCRIPTOR\n: This unit covers the outcomes required to apply\nentrepreneurial workplace best practices and implement\ncost-effective operations\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Apply\n entrepreneurial\n workplace best\n practices\n\n1.1 Good practices\nrelating to\nworkplace\noperations are\nobserved and\nselected following\nworkplace policy.\n1.2 Quality procedures\nand practices are\ncomplied with\naccording to\nworkplace\nrequirements.\n1.3 Cost-conscious\nhabits in resource\nutilization are\napplied based on\nindustry standards.\n1.1 Workplace best\npractices, policies\nand criteria\n1.2 Resource\nutilization\n1.3 Ways in fostering\nentrepreneurial\nattitudes:\n•\nPatience\n•\nHonesty\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n•\nResourcefulness\n\n1.1 Communication\nskills\n1.2 Complying with\nquality procedures\n\n2. Communicate\nentrepreneurial\nworkplace best\npractices\n\n2.1 Observed good\npractices relating to\nworkplace\noperations are\ncommunicated to\nappropriate\nperson.\n2.2 Observed quality\nprocedures and\npractices are\nc