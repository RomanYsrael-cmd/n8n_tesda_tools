ent\n4.1 Competency may be assessed in the work\nplace or in a simulated work place setting\n\n--- PDF PAGE 33 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n29\n\nUNIT OF\nCOMPETENCY\n\n:\n\nEXERCISE\nEFFICIENT\nAND\nEFFECTIVE\nSUSTAINABLE\nPRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:\n400311217\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers knowledge, skills and attitude to identify the\nefficiency and effectiveness of resource utilization, determine\ncauses of inefficiency and/or ineffectiveness of resource\nutilization and Convey inefficient and ineffective environmental\npractices\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nefficiency and\neffectiveness of\nresource utilization\n\n1.1 Required resource\nutilization in the\nworkplace is\nmeasured using\nappropriate\ntechniques\n1.2 Data are recorded in\naccordance with\nworkplace protocol\n1.3 Recorded data are\ncompared to\ndetermine the\nefficiency and\neffectiveness of\nresource utilization\naccording to\nestablished\nenvironmental\nwork procedures\n\n1.1. Importance of\nEnvironmental\nLiteracy\n1.2. Environmental\nWork Procedures\n1.3. Waste\nMinimization\n1.4. Efficient Energy\nConsumptions\n1.1 Recording Skills\n1.2 Writing Skills\n1.3 Innovation Skills\n\n2. Determine causes\nof inefficiency\nand/or\nineffectiveness of\nresource utilization\n2.1 Potential causes of\ninefficiency and/or\nineffectiveness are\nlisted\n2.2 Causes of\ninefficiency and/or\nineffectiveness are\nidentified through\ndeductive reasoning\n2.3 Identified causes of\ninefficiency and/or\nineffectiveness are\nvalidated thru\nestablished\nenvironmental\nprocedures\n\n2.1 Causes of\nenvironmental\ninefficiencies and\nineffectiveness\n\n2.1 Deductive\nReasoning Skills\n2.2 Critical thinking\n2.3 Problem Solving\n2.4 Observation Skills\n\n--- PDF PAGE 34 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n30\n\nEL