      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Planned and prepared for work 1.2 Removed damaged tiles 1.3 Laid-out tiling area 1.4 Installed tiles 1.5 Cut tiles 1.6 Grouted space between tiles 1.7 Performed housekeeping 1.8 Observed safety measures applicable to worksite operation 1.9 Communicated effectively with others to ensure effective work 1.10 operation 1.11 Observed and complied with the productivity requirements 1.12 Complied with attitudinal work requirements"
    },
    {
      "source_text": "2. Resource implications"
    },
    {
      "source_text": "The following resources should be provided: 2.1 Actual or simulated workplace 2.2 Tools, materials and equipment needed to perform the required tasks 2.3 References and manuals 2.4 PPE 2.5 First Aid Kit 3. Method of assessment"
    },
    {
      "source_text": "Competency in this unit may be assessed through: 3.1 Demonstration/Observation with Oral Questioning"
    },
    {
      "source_text": "4. Context for assessment 4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center"
