    {
      "source_text": "SECTION 1 TILE SETTING"
    },
    {
      "source_text": "The TILE SETTING NC II Qualification consists of competencies that a person must achieve to enable him / her to lay tiles on plain and curved surfaces for walls, floors and other application and repair of tiles on plain and curved surfaces."
    },
    {
      "source_text": "This qualification is packaged from the competency map of Construction Sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO."
    },
    {
      "source_text": "BASIC COMPETENCIES 400311210 Participate in workplace communication 400311211 400311212 400311213 400311214 400311215 400311216"
    },
    {
      "source_text": "400311217"
    },
    {
      "source_text": "400311218 Work in a team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES CON712305 Lay tiles on plain and curved surfaces for walls, floors and other application CON712306 Repair of tiles on plain and curved surfaces"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a –"
    },
    {
      "source_text": " Tile Setter"
    },
