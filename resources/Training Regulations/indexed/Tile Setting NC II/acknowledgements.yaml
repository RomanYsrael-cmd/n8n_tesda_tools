    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Determined the root cause of a routine problem 1.2 Identified solutions to procedural problems. 1.3 Produced documentation that recommends solutions to problems. 1.4 Followed established procedures. 1.5 Referred unresolved problems to support persons."
    },
    {
      "source_text": "2. Resource Implications 2.1. Assessment will require access to a workplace over an extended period, or a suitable method of gathering evidence of operating ability over a range of situations. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Case Formulation 3.2 Life Narrative Inquiry 3.3 Standardized test The unit will be assessed in a holistic manner as is practical and may be integrated with the assessment of other relevant units of competency. Assessment will occur over a range of situations, which will include disruptions to normal, smooth operation. Simulation may be required to allow for timely assessment of parts of this unit of competency. Simulation should be based on the actual workplace and will include walk through of the relevant competency components. 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or simulation environment in TESDA accredited institutions."
