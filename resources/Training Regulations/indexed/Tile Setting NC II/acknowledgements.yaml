    {
      "source_text": "UNIT OF COMPETENCY : CONTRIBUTE TO WORKPLACE INNOVATION"
    },
    {
      "source_text": "UNIT CODE : 400311214"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to make a pro-active and positive contribution to workplace innovation."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Identify opportunities to do things better. 1.1 Opportunities for improvement are identified proactively in own area of work. 1.2 Information are gathered and reviewed which may be relevant to ideas and which might assist in gaining support for idea. 1.1 Roles of individuals in suggesting and making improvements. 1.2 Positive impacts and challenges in innovation. 1.3 Types of changes and responsibility. 1.4 Seven habits of highly effective people."
    },
    {
      "source_text": "1.1 Identifying opportunities to improve and to do things better. Involvement. 1.2 Identifying the positive impacts and the challenges of change and innovation. 1.3 Identifying examples of the types of changes that are within and outside own scope of responsibility 2. Discuss and develop ideas with others 2.1 People who could provide input to ideas for improvements are identified. 2.2 Ways of approaching people to begin sharing ideas are selected. 2.3 Meeting is set with relevant people. 2.4 Ideas for follow up are review and selected based on feedback. 2.5 Critical inquiry method is used to discuss and develop ideas with others. 2.1 Roles of individuals in suggesting and making improvements. 2.2 Positive impacts and challenges in innovation. 2.3 Types of changes and responsibility. 2.4 Seven habits of highly effective people."
    },
    {
      "source_text": "2.1 Identifying opportunities to improve and to do things better. Involvement. 2.2 Identifying the positive impacts and the challenges of change and innovation. 2.3 Providing examples of the types of changes that are within and outside own scope of responsibility 2.4 Communicating ideas for change through small group discussions and meetings."
    },
    {
      "source_text": "-- PDF PAGE 23 --- TILE-SETTING NC II Revision 01 Promulgated (10/29/2018)) 19"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Integrate ideas for change in the workplace. 3.1 Critical inquiry method is used to integrate different ideas for change of key people. 3.2 Summarizing, analyzing and generalizing skills are used to extract salient points in the pool of ideas. 3.3 Reporting skills are likewise used to communicate results. 3.4 Current Issues and concerns on the systems, processes and procedures, as well as the need for simple innovative practices are identified. 3.1 Roles of individuals in suggesting and making improvements. 3.2 Positive impacts and challenges in innovation. 3.3 Types of changes and responsibility. 3.4 Seven habits of highly effective people. 3.5 Basic research skills. 3.1 Identifying opportunities to improve and to do things better. Involvement. 3.2 Identifying the positive impacts and the challenges of change and innovation. 3.3 Providing examples of the types of changes that are within and outside own scope of responsibility. 3.4 Communicating ideas for change through small group discussions and meetings. 3.5 Demonstrating skills in analysis and interpretation of data."
    },
    {
      "source_text": "-- PDF PAGE 24 --- TILE-SETTING NC II Revision 01 Promulgated (10/29/2018)) 20"
    },
    {
