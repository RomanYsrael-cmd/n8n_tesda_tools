    {
      "source_text": "15. PRODUCTIVITY"
    },
    {
      "source_text": "The quality state on facts of being able to generate, create, enhance or bring forth goods and services. 16. 5S"
    },
    {
      "source_text": "The five in a 5S workplace organizational and housekeeping methodology refers to five steps – sort, set in order, shine, standardize and sustain. 17. 3 RS The principle of reducing waste, reusing and recycling resources and products: Reduce The waste management concept of reducing what is produced and what is consumed Re-Use The waste management concept of reusing items, or re- purposing them for a use different than what they are intended for Recycle The waste management concept of transforming again into a raw material that can be shaped into a new item"
    },
