      "source_text": "UNIT OF COMPETENCY : SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS"
    },
    {
      "source_text": "UNIT CODE : 400311212"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to apply problem-solving techniques to determine the origin of problems and plan for their resolution. It also includes addressing procedural problems through documentation, and referral."
