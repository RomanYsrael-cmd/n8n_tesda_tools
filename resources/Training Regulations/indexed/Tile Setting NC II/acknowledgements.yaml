    },
    {
      "source_text": "UNIT CODE : 400311213"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitudes in managing one’s emotions, developing reflective practice, and boosting self-confidence and developing self-regulation."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Manage one’s emotion 1.1 Self-management strategies are identified 1.2 Skills to work independently and to show initiative, to be conscientious, and persevering in the face of setbacks and frustrations are developed 1.3 Techniques for effectively handling negative emotions and unpleasant situation in the workplace are examined"
    },
    {
      "source_text": "1.1 Self- management strategies that assist in regulating behavior and achieving personal and learning goals (e.g. Nine self- management strategies according to Robert Kelley) 1.2 Enablers and barriers in achieving personal and career goals 1.3 Techniques in handling negative emotions and unpleasant situation in the workplace such as frustration, anger, worry, anxiety, etc. 1.1 Managing properly one’s emotions and recognizing situations that cannot be changed and accept them and remain professional 1.2 Developing self- discipline, working independently and showing initiative to achieve personal and career goals 1.3 Showing confidence, and resilience in the face of setbacks and frustrations and other negative emotions and unpleasant situations in the workplace"
    },
    {
      "source_text": "-- PDF PAGE 20 --- TILE-SETTING NC II Revision 01 Promulgated (10/29/2018)) 16"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Develop reflective practice 2.1 Personal strengths and achievements, based on self- assessment strategies and teacher feedback are contemplated 2.2 Progress when seeking and responding to feedback from teachers to assist them in consolidating strengths, addressing weaknesses and fulfilling their potential are monitored 2.3 Outcomes of personal and academic challenges by reflecting on previous problem solving and decision making strategies and feedback from peers and teachers are predicted 2.1 Basic SWOT analysis 2.2 Strategies to improve one’s attitude in the workplace 2.3 Gibbs’ Reflective Cycle/Model (Description, Feelings, Evaluation, Analysis, Conclusion, and Action plan) 2.1 Using the basic SWOT analysis as self- assessment strategy 2.2 Developing reflective practice through realization of limitations, likes/ dislikes; through showing of self- confidence 2.3 Demonstrating self-acceptance and being able to accept challenges"
    },
    {
      "source_text": "3. Boost self- confidence and develop self- regulation 3.1 Efforts for continuous self-improvement are demonstrated 3.2 Counter-productive tendencies at work are eliminated 3.3 Positive outlook in life are maintained. 3.1 Four components of self-regulation based on Self- Regulation Theory (SRT) 3.2 Personality development concepts 3.3 Self-help concepts (e. g., 7 Habits by Stephen Covey, transactional analysis, psycho-spiritual concepts) 3.1 Performing effective communication skills – reading, writing, conversing skills"
    },
    {
      "source_text": "3.2 Showing affective skills – flexibility, adaptability, etc."
    },
    {
      "source_text": "3.3 Self-assessment for determining one’s strengths and weaknesses"
    },
    {
      "source_text": "-- PDF PAGE 21 --- TILE-SETTING NC II Revision 01 Promulgated (10/29/2018)) 17"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Self- management strategies May include: 1.1 Seeking assistance in the form of job coaching or mentoring 1.2 Continuing dialogue to tackle workplace grievances 1.3 Collective negotiation/bargaining for better working conditions 1.4 Share your goals to improve with a trusted co-worker or supervisor 1.5 Make a negativity log of every instance when you catch yourself complaining to others 1.6 Make lists and schedules for necessary activities 2. Unpleasant situation May include: 2.1 Job burn-out 2.2 Drug dependence 2.3 Sulking"
    },
