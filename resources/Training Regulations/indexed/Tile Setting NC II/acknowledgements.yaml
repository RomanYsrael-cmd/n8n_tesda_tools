ll include walk through of the relevant competency\ncomponents.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 29 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n25\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND HEALTH\nPOLICIES AND PROCEDURES\n\nUNIT CODE\n : 400311216\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto identify OSH compliance requirements, prepare OSH\nrequirements for compliance, perform tasks in accordance\nwith relevant OSH policies and procedures\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations,\npolicies and\nprocedures are\nidentified in\naccordance with\nworkplace policies\nand procedures\n1.2 OSH activity non-\nconformities are\nconveyed to\nappropriate\npersonnel\n 1.3 OSH preventive\nand control\nrequirements are\nidentified in\naccordance with\nOSH work policies\nand procedures\n\n1.1. OSH preventive\nand control\nrequirements\n1.2. Hierarchy of\nControls\n1.3. Hazard\nPrevention and\nControl\n1.4. General OSH\nprinciples\n1.5. Work standards\nand procedures\n1.6. Safe handling\nprocedures of\ntools, equipment\nand materials\n1.7. Standard\nemergency plan\nand procedures\nin the workplace\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n\n--- PDF PAGE 30 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n26\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Prepare OSH\nrequirements for\ncompliance\n\n2.1 OSH work activity\nmaterial, tools and\nequipment\nrequirements are\nidentified in\naccordance with\nworkplace policies\nand procedures\n2.2. Required OSH\nmaterials, tools\nand equipment are\nacquired in\naccordance with\nworkplace policies\nand procedures\n2.3. Required OSH\nmaterials, tools\nand equipment are\narranged/ placed in\naccordance with\nOSH work\nstandards\n2.1. Resources\nnecessary to\nexecute hierarchy\nof controls\n2.2. General OSH\nprinciples\n2.3. Work standards\nand procedures\n2.4. Safe handling\nprocedures of\ntools, equipment\nand materials\n2.5. Different OSH\ncontrol measures\n\n2.1. Communication\nskills\n2.2. Estimation skills\n2.3. Interpersonal\nskills\n2.4. Critical thinking\nskills\n2.5. Observation\nskills\n2.6. Material, tool\nand equipment\nidentification\nskills\n\n3. Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n\n3.1 Relevant OSH\nwork procedures\nare identified in\naccordance with\nworkplace policies\nand procedures\n3.2 Work Activities are\nexecuted in\naccordance with\nOSH work\nstandards\n3.3 Non-compliance\nwork activities are\nreported to\nappropriate\npersonnel\n3.1. OSH work\nstandards\n3.2. Industry related\nwork activities\n3.3. General OSH\nprinciples\n3.4. OSH Violations\n Non-compliance\nwork activities\n\n3.1 Communication\nskills\n3.3 Interpersonal\nskills\n3.4 Troubleshooting\nskills\n3.5 Critical thinking\nskills\n3.6 Observation\nskills\n\n--- PDF PAGE 31 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n27\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies\nand Procedures\nMay include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPermit to Operate\n1.6\nPhilippine Occupational Safety and Health\nStandards\n1.7\nDepartment Order No. 13 (Construction Safety\nand Health)\n1.8\nECC regulations\n2. Appropriate Personnel May include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\