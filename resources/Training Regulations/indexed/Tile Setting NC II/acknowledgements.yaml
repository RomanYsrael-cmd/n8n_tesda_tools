      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Identified opportunities to do things better. 1.2 Discussed and developed ideas with others on how to contribute to workplace innovation. 1.3 Integrated ideas for change in the workplace. 1.4 Analyzed and reported rooms for innovation and learning in the workplace. 2. Resource Implications The following resources should be provided: 2.1 Pens, papers and writing implements. 2.2 Cartolina. 2.3 Manila papers. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Psychological and behavioral Interviews. 3.2 Performance Evaluation. 3.3 Life Narrative Inquiry. 3.4 Review of portfolios of evidence and third-party workplace reports of on-the-job performance. 3.5 Sensitivity analysis. 3.6 Organizational analysis. 3.7 Standardized assessment of character strengths and virtues applied. 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or simulation environment in TESDA accredited institutions."
