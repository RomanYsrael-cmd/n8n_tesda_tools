      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. PORTLAND CEMENT"
    },
    {
      "source_text": "is a bonding agent that reacts with water to form a hard stone like substance that is resistant to disintegrate in water. 2. TILE"
    },
    {
      "source_text": "It is a piece of fired clay, stone, concrete or other material used ornamentally to cover roofs, floor and wall. 3. CERAMIC TILE"
    },
    {
      "source_text": "A tile made from clay that has been permanently hardened by heat, are made for covering and as finishing of interior and exterior floor and wall. 4. PORCELAIN TILE"
    },
    {
      "source_text": "Are ceramic tile commonly use to cover floor and wall with a water with absorption rate of less than 0.5 percent. They can be either glazed or unglazed. 5. MOSAIC TILE"
    },
    {
      "source_text": "A picture or design made from small pieces of colored tile, glass or other material set in mortar. Mosaic have been widely use in christian churches to decorate walls and ceilings. 6. VITRIFIED TILE"
    },
    {
      "source_text": "Is a ceramic tile with very low porosity. It is an alternative to marble and granite flooring. Vitrified tiles are oftenly use in outdoors due to their water frost resistance. 7. MARBLE"
    },
    {
      "source_text": "Like many other stone tile, has very high maintenance requirements. Marble is also porous, which means it can be stained, scratched and worn easily. 8. GRANITE"
    },
    {
      "source_text": "Is a granular type of stone which by definition is an igneous rock (formed by heat) with at least 20% quartz by volume. 9. TILE GROUT"
    },
    {
      "source_text": "A powder in texture made up of different colors when mixed with water become putty. it is used as filler or gap between tiles. 10. TILE TRIM"
    },
    {
      "source_text": "Made up of plastic use for covering the edges of tile for protection and to attain acceptable finish. 11. TILE SPACER"
    },
    {
      "source_text": "A “cross” like material with a minimum thickness of 3mm made up of plastic. It is being placed at the intersection of titles to maintain uniform spacing. 12. NOSING"
    },
    {
      "source_text": "A protecting edge, as the part of the tread of a step extending beyond the riser of a stair. 13. PLANE SURFACE"
    },
    {
      "source_text": "Refers to even or flat surface of roof, floor and wall. 14. CURVED SURFACE"
    },
    {
      "source_text": "Refers to round, conical, spherical and oval surface commonly occur in corinthian motif, round columns, walkways and large entrance of buildings."
    },
    {
      "source_text": "-- PDF PAGE 100 --- TILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 96"
