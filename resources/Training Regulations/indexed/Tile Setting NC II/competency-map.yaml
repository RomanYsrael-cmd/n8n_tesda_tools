  "source_text": "COMPETENCY MAP - CONSTRUCTION SECTOR\n(Civil Works)\n TILE SETTING NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 97 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 93\n\nUtilize\nspecialize\nspecialized\ncommunicati\non skill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneu\nrial skills\nManage and\nsustain\neffective\ncommunicati\non strategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop\nand sustain\na high-\nperforming\nenterprise\n\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual\nof\ninstructions\n\nPerform\nmensurations\nand\ncalculations\n\nMaintain\ntools and\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 98 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 94\n\nPrepare masonry\nmaterials\n\nPerform masonry tools and\nequipment\n\nPerform basic masonry\nworks\n\nLay concrete hollow block\nfor structure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-finish\nfloor concreting\nRectify non-conforming\nconcrete and masonry\nsurfaces\nLay tiles on plain and\ncurved surfaces for walls,\nfloors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and\nremove wooden formworks\n\nInstall wooden door jamb,\nwindow frame and panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall and/or\ncladding frames and\nboards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\nPrepare pipefitting\nmaterials, tools and\nequipment for spool pipe\nconnection\nInstall above ground piping\nsystem\n\nInstall overhead piping\nsystem\nInstall underground\npiping system\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and\nother application\nRepair of tiles on plain\nand curved surfaces\n\nCORE COMPETENCIES\n\n--- PDF PAGE 99 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 95\n\nGLOSSARY OF TERMS\n\n1. PORTLAND CEMENT\n\nis a bonding agent that reacts with water to form a hard stone\nlike substance that is resistant to disintegrate in water.\n2. TILE\n\nIt is a piece of fired clay, stone, concrete or other material used\nornamentally to cover roofs, floor and wall.\n3. CERAMIC TILE\n\nA tile made from clay that has been permanently hardened by\nheat, are made for covering and as finishing of interior and\nexterior floor and wall.\n4. PORCELAIN TILE\n\nAre ceramic tile commonly use to cover floor and wall with a\nwater with absorption rate of less than 0.5 percent. They can be\neither glazed or unglazed.\n5. MOSAIC TILE\n\nA picture or design made from small pieces of colored tile, glass\nor other material set in mortar. Mosaic have been widely use in\nchristian churches to decorate walls and ceilings.\n6. VITRIFIED TILE\n\nIs a ceramic tile with very low porosity. It is an alternative to\nmarble and granite flooring. Vitrified tiles are oftenly use in\noutdoors due to their water frost resistance.\n7. MARBLE\n\nLike many other stone tile, has very high maintenance\nrequirements. Marble is also porous, which means it can be\nstained, scratched and worn easily.\n8. GRANITE\n\nIs a granular type of stone which by definition is an igneous\nrock (formed by heat) with at least 20% quartz by volume.\n9. TILE GROUT\n\nA powder in texture made up of different colors when mixed with\nwater become putty. it is used as filler or gap between tiles.\n10. TILE TRIM\n\nMade up of plastic use for covering the edges of tile for\nprotection and to attain acceptable finish.\n11. TILE SPACER\n\nA “cross” like material with a minimum thickness of 3mm made\nup of plastic. It is being placed at the intersection of titles to\nmaintain uniform spacing.\n12. NOSING\n\nA protecting edge, as the part of the tread of a step extending\nbeyond the riser of a stair.\n13. PLANE SURFACE\n\nRefers to even or flat surface of roof, floor and wall.\n14. CURVED SURFACE\n\nRefers to round, conical, spherical and oval surface commonly\noccur in corinthian motif, round columns, walkways and large\nentrance of buildings.\n\n--- PDF PAGE 100 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 96\n\n15. PRODUCTIVITY\n\nThe quality state on facts of being able to generate, create,\nenhance or bring forth goods and services.\n16. 5S\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain.\n17. 3 RS\nThe principle of reducing waste, reusing and recycling resources\nand products:\nReduce\nThe waste management concept of reducing what is produced\nand what is consumed\nRe-Use\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\nRecycle\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 101 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 97\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nTile Setting NC II\nQualification Code:\nCONTIL218\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nTile Setting NC II\nTile Setting NC II\n2007-21 /\n07/27/07\nN/A\n01\nDocument\nAmended\nTile Setting NC II\nTile Setting NC II\n2018-33 /\n10/29/18\nNo. 008 series\nof 2019\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 102 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 98\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMARCELO R. ABAD\nConsultant/ Industry Expert\nQuezon City\n\nRIZALDY E. ANGELES\nConstruction Manager - Industry Expert\nEEI Corporation\nQuezon City\nJOHN S. JUAN\nSTIDS\nConstruction Industry Authority of the\nPhils. (CIAP) -CMDF\nMakati City\n\nANGELITO V. ZULUETA\nConsultant/ Industry Expert\nAVZ Management & Consulting\nServices\nSingalong, Manila\n\nALIPIO M. PANGANIBAN\nDepartment Head - Industry Expert\nDatem, Inc.\nQuezon City\n\nROLANDO C. BADILLA\nTechnical Specialist – Industry Expert\nJames Hardie Philippines, Inc.\nCabuyao, Laguna\n\nJELUZ B. CORRO\nDepartment Head - Industry Expert\nDatem, Inc.\nQuezon City\n\nThe PARTICIPANTS in the Validation of this Training Regulations\n\nVISAYAS REGION\n\n• BMC Training Center\n• Cebu Contractors Association\n• Cebu Science of Welding and Skills Technology, Inc. (CSWST)\n• Filmon Hardware, Inc.\n• Frasec Ventures Corporation\n• Holcim - Galing Mason\n• Hardipro Manufacturing Corp.\n• JARC Construction & Marine Services Corporation\n• Makati Development Corporation (MDC)\n• Philippine Macro Development Corporation\n• Sagrada Familia Plumbing Services\n• School for Knowledge Industrial Labor Leadership Service (SKILLS)\n• Saint James Academy of Skills Technology, Inc. (SJASTI)\n• TESDA PO Cebu\n\n--- PDF PAGE 103 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 99\n\nMINDANAO REGION\n\n• Association of Construction Informal Workers (ACIW) - Davao\n• Assumption College of Nabunturan\n• David M. Consunji, Inc. (DMCI) - Davao\n• PTC-San Isidro Manpower Training Center (SIMTRAC)\n• RTC-Korea Phils. Vocational Training Center (KPCTC)\n• Tagum City Trade School (TCTS)\n\nLUZON REGION\n\n• Akarui Technical Training Center - CIWC\n• Association of Construction and Informal Workers (ACIW)\n• B & B Academy\n• Construction Industry Workers Council (CIWC)\n• Construction Manpower Development Foundation (CMDF)\n• Datem Construction\n• D. M. Consunji, Inc\n• DMCI Homes\n• Makati Development Corporation\n• Mercer Institute\n• Saint Peregrine Institute\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Howard Mark N. Plete\n- Evangeline A. Cosep",
