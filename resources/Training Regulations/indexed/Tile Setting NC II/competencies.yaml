  "source_section_text": "SECTION 1 TILE SETTING\n\nThe TILE SETTING NC II Qualification consists of competencies that a person\nmust achieve to enable him / her to lay tiles on plain and curved surfaces for walls, floors and\nother application and repair of tiles on plain and curved surfaces.\n\nThis qualification is packaged from the competency map of Construction Sector as\nshown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and\nprocedures\nExercise efficient and effective sustainable practices in\nthe workplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON712305\nLay tiles on plain and curved surfaces for walls, floors\nand other application\nCON712306\nRepair of tiles on plain and curved surfaces\n\nA person who has achieved this Qualification is competent to be a –\n\n Tile Setter\n\n--- PDF PAGE 6 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n2"
}
