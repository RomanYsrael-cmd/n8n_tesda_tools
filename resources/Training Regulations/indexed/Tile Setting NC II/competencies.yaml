are \nprepared and \nsubmitted following \nmanagement plans. \n \n6.1 DOLE \nDepartment \nOrder No. 13 \nseries 1998 \nGuidelines \nGoverning \nOccupational \nSafety and \nHealth in the \nConstruction \nIndustry \n6.2 Equipment and \ntools \nspecification \n6.3 DENR standards \nand regulatory \nrequirements \n6.4 Waste \nsegregation \n6.5 5S \n6.6 Material \ndescription \n6.7 Adherence to \nwork \nrequirements \n \n6.1 Following \noccupational \nhealth and \nsafety/environmen\ntal management \nplans \n6.2 Performing \nhousekeeping\n\n--- PDF PAGE 69 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n65 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Personal  \n      Protective  \n      Equipment (PPE) \n \nMay include: \n1.1 Hard hat \n1.2 Safety shoes/ rubber boots \n1.3 Proper uniform/clothing \n1.4 Gloves (cotton) \n1.5 Dust mask  \n1.6 Safety goggles \n1.7 Reflectorized vest \n1.8 Knee pads \n \n2.   Job requirements  \n \nMay include: \n \n2.1 Approved Working Drawings  \n2.2 Work instructions  \n2.3 Specifications \n2.4 Setting out procedures \n2.5 Application procedures \n2.6 Workplace operations and procedures \n3.   Work plan \n \nMay include: \n \n2.1 Work instructions  \n2.2 Specifications \n2.3 Work lay-out (work sequence lay-out and materials \nlocation lay-out) \n4.   Quality requirements \nMay include: \n \n3.1 Quality of materials  \n3.2 Quality of tiled surface (flatness, squareness, \nplumbness) \n3.3 Quality of specified finish (pattern, color, texture) \n5.   Occupational Safety and  \n      Health Standards \nMay include: \n \n4.1 Protective clothing and equipment \n4.2 Use of tools  \n4.3 Handling of materials \n4.4 hazardous materials \n4.5 Working platforms \n6.   Materials \nMay include: \n \n5.1 Ceramic tiles \n5.2 Porcelain tiles \n5.3 Tile adhesive \n5.4 Tile grout \n5.5 Tile trims \n5.6 Nosing (brass, aluminum. rubber) \n5.7 Threshold\n\n--- PDF PAGE 70 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n66 \n \n \nVARIABLE \nRANGE \n7.   Tools  \nMay include: \n \n6.1 Tile cutters  \n6.2 Measuring tape \n6.3 Trowels (notched, pointed)  \n6.4 Straight edge \n6.5 Level and plumb bob \n6.6 Rubber mallet \n6.7 Rubber float or squeegee \n6.8 Mini grinder with complete set of accessories\n\n--- PDF PAGE 71 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n67 \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nPlanned and prepared for work \n1.2 \nRemoved damaged tiles \n1.3 \nLaid-out tiling area \n1.4 \nInstalled tiles  \n1.5 \nCut tiles \n1.6 \nGrouted space between tiles \n1.7 \nPerformed housekeeping \n1.8 \nObserved safety measures applicable to worksite \noperation \n1.9 \nCommunicated effectively with others to ensure effective \nwork \n1.10  operation \n1.11 Observed and complied with the productivity requirements \n1.12 Complied with attitudinal work requirements \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 \nActual or simulated workplace \n2.2 \nTools, materials and equipment needed to perform the \nrequired tasks \n2.3 \nReferences and manuals \n2.4 \nPPE \n2.5 \nFirst Aid Kit \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration/Observation with Oral Questioning \n \n4. Context for \nassessment \n4.1 \nCompetency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
