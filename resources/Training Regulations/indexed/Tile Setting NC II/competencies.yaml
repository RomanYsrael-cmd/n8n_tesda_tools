        "source_title": "LAY TILES ON PLAIN AND CURVED SURFACES FOR WALLS, FLOORS AND OTHER APPLICATION",
        "source_text": "--- PDF PAGE 54 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n50 \n \n  \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY \n:  \nLAY TILES ON PLAIN AND CURVED SURFACES \nFOR WALLS, FLOORS AND OTHER   \nAPPLICATION \n \nUNIT CODE  \n \n \n: \nCON712305 \n \nUNIT DESCRIPTOR \n \n:  \nThis unit covers the knowledge, skills and attitude \nrequired to productively lay tiles on plain and curved \nsurfaces for walls, floors and other application. \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for work  \n \n \n \n \n \n \n1.1 Personal protective \nequipment (PPE) is \nused in accordance with \nRule 1080 of \nOccupational Safety \nand Health Standards \n1.2 Work instruction is \nsecured and interpreted \nin line with job \nrequirements \n1.3 Work plan is produced \nin accordance with work \ninstruction \n1.4 Safety and quality \nrequirements are \nidentified in line with \nOccupational Safety \nand Health Standards \n(OSHS) and company \nstandard operating \nprocedures \n1.5 Materials, tools and \nequipment are identified \nin accordance with job \nrequirements \n1.6 Tiling area is cleaned \nand prepared according \nto standard operating \nprocedures \n1.7 Surface treatment \nmethod is selected and \nused as per work \nrequirements \n1.8 Required output is \ncompleted as specified \nby the immediate \nsupervisor based on \nwork schedule \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n1.2 Materials, tools and \nequipment \nidentifications and \nclassifications \n1.3 Manufacturer’s \nproduct \nspecifications and \ninstructions \n1.4 Pattern development \n1.5 Adherence to work \nrequirements \n1.6 Surface treatment \nmethods  \n \n1.1 Communication \nskills \n1.2 Estimating of \nmaterials and \ntools  \n1.3 Handling of \nmaterials \n1.4 Making pattern  \n1.5 Mixing and \napplying of \nsurface \ntreatment \nmethods\n\n--- PDF PAGE 55 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n51 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Lay-out tiling \narea \n2.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards \n2.2 Area to be tiled is \nchecked in line with \njob requirements. \n2.3 Tiles are laid-out in     \nline with work \ninstruction. \n2.4 Work area is \ncleaned according to \nsafety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n2.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based on \nwork schedule. \n \n2.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \nApplied Mathematics \n2.2 Green Building \nConcept relative to \nConstruction (3R, 5S) \n2.3 Work drawing and \ninstructions \n2.4 Procedures in laying-\nout on plain and \ncurved surfaces \n2.5 Factors affecting \nproductivity \n2.6 Productivity work \nmeasurements \n2.7 Ways of improving \nproductivity \n2.8 Adherence to work \nrequirements \n \n2.1 Communication \nskills \n2.2 Applying \nmensuration \n2.3 Applying \nproductive \nmethods and \ntechniques in \nlay-out of tiling \narea \n2.4 Implementing 3R \nand 5S\n\n--- PDF PAGE 56 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n52 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Install tiles  \n \n3.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n3.2 Tiles are prepared and \ndry-laid in line with job \nrequirement. \n3.3 Selected bedding type \nis used as per job \nrequirements \n3.4 Adhesive is prepared \nand applied according \nto manufacturer’s \ninstructions or \nrecommendation.  \n3.5 Tiles are installed to \nthe desired level and/ \nor alignment. \n3.6 Tiles are arranged and \nfixed to the designed \npattern. \n3.7 Special cut tile is \ninstalled in accordance \nwith drawings and \nspecifications. \n3.8 Gaps of tiles are \nmaintained straight and/ \nor uniform according to \njob specifications. \n3.9 Tile trim, nosing, \nexpansion joint and \nthreshold are placed \naccording to job \nrequirement. \n3.10 Tiled surface and gaps \nare cleaned and sealed \naccording to work \nstandards and \nspecifications. \n3.11 Work area is cleaned \naccording to safety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & 42) \n3.12 Required output is \ncompleted as specified \nby the immediate \nsupervisor based on \nwork schedule. \n3.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n3.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n3.3 Applied \nmathematics \n3.4 Work drawing and \ninstructions \n3.5 Manufacturer’s \nproduct \nspecifications and \ninstructions \n3.6 Compliance with \nquality requirements\n3.7 Mortar mixing \nprocedures and \nmethods \n3.8 Sequence of \ninstalling tiles \n3.9 Factors affecting \nproductivity \n3.10 Productivity work \nmeasurements \n3.11 Ways of improving \nproductivity \n3.12 Adherence to work \nrequirements \n3.13 Bedding types \n \n \n3.1 Communication \nskills \n3.2 Applying \nproductive \nmethods of \ncutting and laying \nof tiles  \n3.3 Observing safe \nuse of tools  \n3.4 Handling of \nmaterials \n3.5 Applying \nproductive \nmethods and \ntechniques in \ninstalling of tiles \non plain and \ncurved surfaces \nfor walls, floors \nand other \napplication \n3.6 Mixing mortar \n3.7 Implementing 3R \nand 5S\n\n--- PDF PAGE 57 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n53 \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n4. Cut  tiles \n4.1 \nPersonal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n4.2 \nRegular and special \ncut tiles are prepared in \naccordance with \ndrawings and \nspecifications, where \napplicable.  \n4.3 \nMiter joints are \nprepared and cut \nuniformly according to \njob requirement.  \n4.4 \nSafety precautions \nare applied in line with \nOccupational Safety \nand Health Standards. \n4.5 \nWork area is cleaned \naccording to safety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & 42) \n4.6 \nRequired output is \ncompleted as specified \nby the immediate \nsupervisor based on \nwork schedule. \n \n4.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n4.2 Green Building \nConcept relative to \nConstruction (3R, 5S) \n4.3 Applied mathematics \n4.4 Compliance with \nquality requirements \n4.5  Waste management \n4.6  Types of tile cutters \n4.7 Cutting methods and \ntechniques  \n4.8 Factors affecting \nproductivity \n4.9 Productivity work \nmeasurements \n4.10 \nWays of \nimproving productivity \n4.11 \nAdherence to \nwork requirements \n \n4.1 Communication \nskills \n4.2 Applying \nproductive cutting \nmethods and \ntechniques  \n4.3 Application and \noperation of tools  \n4.4 Handling of \nmaterials \n4.5 Applying \nproductive \nmethods and \ntechniques in \ncutting tiles \n4.6 Implementing 3R \nand 5S\n\n--- PDF PAGE 58 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n54 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5. Grout space \nbetween tiles \n5.1 \nPersonal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n5.2 \nJoints are cleaned \nand prepared for \ngrouting following \nmanufacturer's \nspecifications \n5.3 \nGrout is mixed and \napplied according to \nmanufacturer's and job \nspecifications. \n5.4 \nTile grouts are \ncleaned and sealed \naccording to work \nstandards and \nspecifications. \n5.5 \nWork area is cleaned \naccording to safety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & 42) \n5.6 \nRequired output is \ncompleted as specified \nby the immediate \nsupervisor based on \nwork schedule. \n \n \n5.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n5.2 Green Building \nConcept relative to \nConstruction (3R, 5S) \n5.3 Materials \nidentifications and \nclassifications \n5.4 Manufacturer’s \nproduct specifications \nand instructions \n5.5 Compliance with \nquality requirements \n5.6 Methods and \ntechniques of \ngrouting tiles \n5.7 Factors affecting \nproductivity \n5.8 Productivity work \nmeasurements \n5.9 Ways of improving \nproductivity \n5.10 \nAdherence to \nwork requirements \n \n5.1 Communication \nskills \n5.2 Handling of \nmaterials \n5.3 Applying \nproductive \nmethods and \ntechniques in \ngrouting tiles \n5.4 Implementing 3R \nand 5S\n\n--- PDF PAGE 59 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n55 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n6. Perform \nhousekeeping \n \n \n \n \n6.1 Occupational health, \nsafety and \nenvironmental plans \nare complied. \n6.2  Waste materials are \nreported following \nOccupational health \nand safety/ \nenvironmental \nmanagement plans. \n6.3 Unused and excess \nmaterials are \nreturned to \nwarehouse following \ncompany standard \nand operating \nprocedures. \n6.4 Equipment and tools \nare returned to \nwarehouse after work \ncompletion. \n6.5 Environmental and \nsafety reports are \nprepared and \nsubmitted following \nmanagement plans. \n \n6.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n6.2 Equipment and tools \nspecification \n6.3 DENR standards \nand regulatory \nrequirements \n6.4 Waste segregation \n6.5 5S \n6.6 Material description \n6.7 Adherence to work \nrequirements \n \n6.1 Following \noccupational \nhealth and \nsafety/environmen\ntal management \nplans \n6.2 Performing \nhousekeeping\n\n--- PDF PAGE 60 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n56 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Personal  \n      Protective  \n      Equipment (PPE) \n \nInclude: \n1.1 Hard hat \n1.2 Safety shoes/ rubber boots \n1.3 Proper uniform/clothing \n1.4 Gloves (cotton) \n1.5 Dust mask  \n1.6 Safety goggles \n1.7 Reflectorized vest \n1.8 Knee pads \n \n2. Job requirements  \n \nMay include: \n \n2.1 Approved working drawings  \n2.2 Work instructions  \n2.3 Specifications \n2.4 Setting out procedures \n2.5 Application procedures \n2.6 Workplace operations and procedures \n3. Work plan \n \nMay include: \n \n3.1 Work instructions  \n3.2  Specifications \n3.3 Work lay-out (work sequence lay-out and materials \nlocation lay-out) \n4. Quality requirements \nMay include: \n \n4.1 Quality of materials  \n4.2 Quality of tiled surface (flatness, squareness,   \n   plumbness) \n4.3 Quality of specified finish (pattern, color, texture) \n5. Occupational Safety and  \n      Health Standards \nMay include: \n \n5.1 Protective clothing and equipment \n5.2 Use of tools  \n5.3 Handling of materials \n5.4 Hazardous materials \n5.5 Working platforms \n6. Materials \nMay include: \n \n6.1 Ceramic tiles \n6.2 Porcelain tiles \n6.3 Tile adhesive \n6.4 Tile grout \n6.5 Tile trims \n6.6 Nosing (brass, aluminum. rubber) \n6.7 Threshold \n6.8 Tile spacer\n\n--- PDF PAGE 61 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n57 \n \n \nVARIABLE \nRANGE \n \n7. Tools  \nMay include: \n \n7.1 Tile cutters  \n7.2 Measuring tape \n7.3 Trowels (notched, pointed)  \n7.4 Straight edge \n7.5 Level and plumb bob \n7.6 Rubber mallet \n7.7 Rubber float or squeegee \n7.8 Mini grinder with complete set of accessories \n7.9 Electric Mixing Paddles \n \n8. Surface treatment \nmethods \nMay include : \n8.1 Dry pack \n8.2 Levelling compound \n \n9. Bedding types \nMay include : \n9.1 Thin bed \n9.2 Thick bed\n\n--- PDF PAGE 62 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n58 \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1   Planned and prepared for work \n1.2   Laid-out tiling area \n1.3 Installed tiles  \n1.4 Cut tiles \n1.5 Grouted space between tiles \n1.6 Performed housekeeping \n1.7 Observed safety measures applicable to worksite operation \n1.8 Communicated effectively with others to ensure effective work \noperation \n1.9 Observed and complied with the productivity requirements \n1.10 Complied with attitudinal work requirements \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools materials and equipment needed to perform the \nrequired tasks \n2.3 References and manuals \n2.4 PPE \n2.5    First Aid Kit \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1  Demonstration /observation with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
