        "source_title": "MAINTAIN TOOLS AND EQUIPMENT",
        "source_text": "--- PDF PAGE 49 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n45 \n \n  UNIT OF COMPETENCY            :  \n MAINTAIN TOOLS AND EQUIPMENT  \n \nUNIT CODE  \n \n \n: \nCON311204 \n \nUNIT DESCRIPTOR \n \n:  \nThis unit covers the knowledge, skills and attitudes  \non checking condition, performing preventive  \nmaintenance and storing of construction painting  \ntools and equipment.  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Check condition of \ntools and \nequipment \n \n1.1 Materials, tools and \nequipment are \nidentified according to \nclassification and job \nrequirements \n1.2 Non-functional tools \nand equipment are \nsegregated and labeled \naccording to \nclassification \n1.3 Safety of tools and \nequipment are \nobserved in \naccordance with \nmanufacturer's \ninstructions \n1.4 Condition of Personal \nProtective Equipment \n(PPE) are checked in \naccordance with \nmanufacturer's \ninstructions \n \n1.1 Use of PPE \n1.2 Handling of tools \nand equipment \n1.3 Good \nhousekeeping \n1.4 Types and uses \nof lubricants \n1.5 Types and uses \nof cleaning \nmaterials \n \n1.1 Maintaining \ntools and \nequipment \n1.2 Handling of \ntools and \nequipment \n1.3 Identifying \ntools and \nequipment \ndefects\n\n--- PDF PAGE 50 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n46 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Perform basic \npreventive \nmaintenance \n2.1 Appropriate lubricants \nare identified according \nto types of equipment \n2.2 Tools and equipment \nare lubricated \naccording to   \npreventive \nmaintenance schedule \nor manufacturer's \nspecifications \n2.3 Measuring instruments \nare checked and \ncalibrated in \naccordance with \nmanufacturer’s \ninstructions \n2.4 Tools are cleaned and \nlubricated according to \nstandard procedures \n2.5 Defective instruments,   \nequipment and \naccessories are \ninspected and replaced \naccording to \nmanufacturer’s \nspecifications \n2.6 Tools are inspected, \nrepaired and replaced \nafter use \n2.7 Work place is cleaned \nand kept in safe state \nin line with \nOccupational Safety \nand Health (OSHS)  \n \n2.1 Use of PPE \n2.2 Handling of tools \nand equipment \n2.3 Good \nhousekeeping \n2.4 Types and uses \nof lubricants \n2.5 Types and uses \nof cleaning \nmaterials \n2.6 Basic preventive \nmaintenance \nmethods, \ntechniques and \nprocedures \n \n2.1 Handling of \ntools and \nequipment \n2.2 Performing \npreventive \nmaintenance\n\n--- PDF PAGE 51 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n47 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Store tools and \nequipment \n \n3.1 Inventory of tools, \ninstruments and \nequipment are \nconducted and \nrecorded as per \ncompany practices \n3.2 Tools and equipment \nare stored safely in \nappropriate locations in \naccordance with \nmanufacturer's \nspecifications or \ncompany procedures \n \n3.1 Use of PPE \n3.2 Handling of tools \nand equipment \n3.3 Storing \nprocedures and \ntechniques \n3.4 Storage \nconditions/ \nlocations \n \n3.1 Storing  tools \nand equipment \n3.2 Handling of \ntools and \nequipment\n\n--- PDF PAGE 52 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n48 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \nMay include: \n1.1 Lubricants \n1.2 Cleaning materials \n1.3 Rust remover \n1.4 Rugs \n1.5 Spare parts \n2. Tools and equipment \n \nMay include: \n2.1 Tools \nCutting tools - hacksaw, crosscut saw \nBoring tools - brace, hand drill \nHolding tools - vise grip, C-clamp, bench vise \nThreading tools - die and stock, taps \n2.2 Measuring instruments/equipment \n3. Personal Protective \nEquipment (PPE) \nMay include: \n3.1 Goggles \n3.2 Gloves \n3.3 Safety shoes \n3.4 Hard hat \n3.5 Reflectorized Vest\n\n--- PDF PAGE 53 ---\nTILE-SETTING NC II   Revision 01                                                  Promulgated  (10/29/2018))                         \n49 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires that the candidate: \n4.3 \nSelected and used appropriate processes, tools and   \nequipment to carry out task \n4.4 \nIdentified functional and non-functional tools and \nequipment  \n4.5 \nChecked, lubricated and calibrated tools, equipment and  \ninstruments according to manufacturer’s specifications \n4.6 \nReplaced defective tools, equipment and their accessories  \n4.7 \nObserved and applied safe handling of tools and \nequipment and safety work practices \n4.8 \nPrepared and submitted inventory report,  where \napplicable \n4.9 \nMaintained workplace in accordance with OSHA \nregulations \n4.10 Stored tools and equipment safely in appropriate locations \nand in accordance with company practices \n2. Resource  \nimplications \nThe following resources should be provided: \n2.1 \nWorkplace \n2.2 \n Maintenance schedule \n2.3 \nMaintenance materials, tools and equipment relevant to \nthe proposed activity/task \n3. Methods of \nassessment \nCompetency in this unit may be assessed through: \n3.1 \n Direct observation/Demonstration with Oral Questioning \n3.2 \n Written Examination   \n4. Context of \nassessment \n4.1    Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
