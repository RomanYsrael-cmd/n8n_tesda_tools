onal Protective Equipment\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety materials,\ntools and equipment\n• Handling of safety control resources\n\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities\nin accordance with OSH Standards\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n2 Hours\n8. Exercise Efficient\nand Effective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource utilization\n- Discussion on the process how\nEnvironmental Policies coherence is\nachieved\n•\nDiscussion on Necessary Skills in\nresponse to changing environmental\npolicies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n\n•\nLecture\n•\nGroup\nDiscussion\n•\nSimulation\n•\nDemonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 81 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n77\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.2 8Determine causes\nof inefficiency of\nresource utilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work Procedure\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)tr