ain tools and\nequipment\n4.1 Check condition\nof tools and\nequipment\n\n• Maintaining tools and equipment\n• Handling of tools and equipment\n• Identifying tools and equipment\ndefects\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n3 Hours\n\n4.2 Perform basic\npreventive\nmaintenance\n• Handling of tools and equipment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n3 Hours\n\n4.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2 Hours\n\n--- PDF PAGE 85 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n81\n\nCORE COMPETENCIES\n (56 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Lay tiles on plain\nand curved\nsurfaces for walls,\nfloors and other\napplication\n1.1 Plan and prepare\nfor work\n\n•\nInterpret drawings and\nspecifications\n•\nIdentify hazards at work\n•\nExplain procedures in laying\ntiles\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n32 hours\n1.2 Lay-out tiling area\n\n•\nInterpret drawings and\nspecifications\n•\nExplain procedures in laying\nout tiling area\n•\nDemonstrate laying-out of\ntiling area\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1.3 Install tiles\n•\nMixing and application of\ndifferent types of mortar\n•\nIdentify types of tiles\n•\nExplain procedures in\ninstalling tiles\n•\nDemonstrate ti