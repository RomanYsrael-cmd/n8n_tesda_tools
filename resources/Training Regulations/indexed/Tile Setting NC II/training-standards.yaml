cture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n24 hours\n2.2 Remove\ndamaged tiles\nand prepare\nbedding\n\n• Explain procedures in\nremoving damaged tiles\n• Demonstrate removing of\ndamaged tiles\n• Measuring work productivity\n• Utilizing most productive\npractice\n\n• Simulation\n• Self –paced\ninstructions\n• Discussion\n• Practical\nexercises\n\n2.1 Written test\n2.2 Observation\n2.3 Interview\n2.3 Install\nreplacement tiles\n•\nIdentify types of tiles\n•\nExplain procedures in\ninstalling tiles\n•\nDemonstrate tile installation\n•\n Measuring work\nproductivity\n•\nUtilizing most productive\npractice\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 88 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n84\n\n2.4 Cut tiles\n•\nIdentify and explain methods\nof cutting tiles\n•\nEnumerate procedures in\ncutting tiles\n•\nDemonstrate tile cutting\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n2.5 Grout space\nbetween tiles\n•\nExplain grouting procedures\n•\nDemonstrate grouting\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n2.6 Perform\nhousekeeping\n•\nExplain 5S\n•\nDemonstrate housekeeping\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 89 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n85\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both\non-and off-the-job as long as the learning is driven by the competency standards specified\nby the industry. The following training modalities and their variations/components may be\nadopted singly or in combination with other modalities when designing and delivering\ntraining programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 90 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n86\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such as\nbarangay hall, basketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n--- PDF PAGE 91 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n87\n\n3.1 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• At least Junior High School Level completer or an Alternative Learning System\n(ALS) Certificate of Completion with grade 10 equivalent holder or Holder of\nMasonry NC I\n• Can communicate both orally and in writing\n• Physically fit\n\n3.2\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nTile Setting NC II are as follows:\n\nTOOLS\nQTY.\nDESCRIPTION\n5 pcs.\nNotched trowel\n25 pcs.\nDiamond Tile cutter\n10 pcs.\nPush pull rule, 5m\n5 pcs.\nTile Nipper\n5 pcs.\nPlumb bob\n5 pcs.\nSpirit level, 24 inches, aluminum\n5 pcs.\nSteel square\n5 pcs.\nClaw Hammer, 1.5 lbs.\n10 pcs.\nGrout spreader (Rubber)\n5 pcs.\nRubber Mallet\n5 pcs.\nMortar Shovel\n5 pcs.\nMortar trowel, pointed\n5 pcs.\nBucket/ Pail\n5 pcs.\nMixing Board\n5 pcs.\nDouble-sided Carburandum, (smooth and rough)\n\nEQUIPMENT\nQTY.\nDESCRIPTION\n5 units\nBaby grinder, 4” dia. Diamond disc\n5 pcs.\nExtension Cord, 7 m\n5 pcs.\nWheel Barrow\n1 unit\nPaddle mixer, 1200W\n\n--- PDF PAGE 92 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n88\n\nEQUIPMENT\nQTY.\nDESCRIPTION\n60 pcs.\nGlazed wall tiles (30 cm x 30 cm)\n60 pcs.\nVitrified floor tiles (20 cm x 20 cm)\n25 pcs.\nHomogenous tiles (1.2cm x 60cm x 60cm)\n10 bags\nPortland Cement\n5 bags\nTile Adhesive\n200 pcs.\nTile plastic spacer\n5 kilos\nTile grout\n10 pcs.\nFoam\n10 pcs.\nTile trim, 3m\n5 rolls\nNylon string\n1 kg.\nRags\n1 Kg.\nConcrete Nail, 1.5”\n1.5 cubic meter\nSand\n\nPersonal Protective Equipment (PPE)\nQTY.\nDESCRIPTION\n25 pcs.\nHard hat\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\n25 pcs.\nKnee Pads\n\n3.3\nTRAINING FACILITIES\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n15 x 18\n270\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n48\nTool Room/Storage\n4 x 5\n20\nWash room/Toilet\n4 x 5\n\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n438\n\n--- PDF PAGE 93 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n89\n\n4.1 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in Tile\nSetting NC II\n• Must have completed the 40-Hour Construction Occupational Safety and\nHealth (COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted by\nOSHC and DOLE accredited Safety Training Organizations\n• Must have at least two (2) years industry experience in Civil Works and one (1)\nyear teaching experience in Tile Setting\n\n4.2 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of Competency.\n\n--- PDF PAGE 94 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n90"
