ation\n\n8.2 8Determine causes\nof inefficiency of\nresource utilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work Procedure\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group\nDiscussion\n• Role Play\n• Demonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n•\nCase Study\n•\nWritten Test\n•\nInterview\n1 Hour\n\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/Discussi\non\n•\nWritten Test\n•\nInterview\n1 Hour\n\n9.3 Implement cost-\neffective operations\n• Case studies on Preservation, optimization\nand judicious use of workplace resources\n• Case Study\n• Lecture/\nDiscussion\n•\nCase Study\n•\nWritten Test\n•\nInterview\n2 Hours\n\n--- PDF PAGE 82 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n78\n\nCOMMON COMPETENCIES\n(24 HOURS)\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Prepare\nconstruction\nmaterials and tools\n\n1. 1 Identify\nmaterials\n\n• Identifying tools according to the\njob requirements\n• Identifying materials and\naccessories according to the job\nrequirements\n• Lecture