  "source_text": "SECTION 4\n ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through competency\nassessment.\n\n4.1.4 Holders of valid National Certificate (NC) in Tile Setting NC II will have to\nundergo assessment in the amended Training Regulations for Tile Setting NC II.\n\n4.1.5 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations: It includes the following:\n\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as identified by industry\n\n--- PDF PAGE 95 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018))\n91\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 96 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 92\n\n ANNEX A\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand procedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in Team\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in\nthe\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\n\nCOMPETENCY MAP - CONSTRUCTION SECTOR\n(Civil Works)\n TILE SETTING NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 97 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 93\n\nUtilize\nspecialize\nspecialized\ncommunicati\non skill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneu\nrial skills\nManage and\nsustain\neffective\ncommunicati\non strategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop\nand sustain\na high-\nperforming\nenterprise\n\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual\nof\ninstructions\n\nPerform\nmensurations\nand\ncalculations\n\nMaintain\ntools and\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 98 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 94\n\nPrepare masonry\nmaterials\n\nPerform masonry tools and\nequipment\n\nPerform basic masonry\nworks\n\nLay concrete hollow block\nfor structure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-finish\nfloor concreting\nRectify non-conforming\nconcrete and masonry\nsurfaces\nLay tiles on plain and\ncurved surfaces for walls,\nfloors and other\napplication\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and\nremove wooden formworks\n\nInstall wooden door jamb,\nwindow frame and panels\n\nInstall ceiling and wall\nframes and panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install\nroofing system\n\nFabricate and install\nwooden cabinet\n\nInstall decorative\nmoldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall and/or\ncladding frames and\nboards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\nPrepare pipefitting\nmaterials, tools and\nequipment for spool pipe\nconnection\nInstall above ground piping\nsystem\n\nInstall overhead piping\nsystem\nInstall underground\npiping system\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and\nother application\nRepair of tiles on plain\nand curved surfaces\n\nCORE COMPETENCIES\n\n--- PDF PAGE 99 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 95\n\nGLOSSARY OF TERMS\n\n1. PORTLAND CEMENT\n\nis a bonding agent that reacts with water to form a hard stone\nlike substance that is resistant to disintegrate in water.\n2. TILE\n\nIt is a piece of fired clay, stone, concrete or other material used\nornamentally to cover roofs, floor and wall.\n3. CERAMIC TILE\n\nA tile made from clay that has been permanently hardened by\nheat, are made for covering and as finishing of interior and\nexterior floor and wall.\n4. PORCELAIN TILE\n\nAre ceramic tile commonly use to cover floor and wall with a\nwater with absorption rate of less than 0.5 percent. They can be\neither glazed or unglazed.\n5. MOSAIC TILE\n\nA picture or design made from small pieces of colored tile, glass\nor other material set in mortar. Mosaic have been widely use in\nchristian churches to decorate walls and ceilings.\n6. VITRIFIED TILE\n\nIs a ceramic tile with very low porosity. It is an alternative to\nmarble and granite flooring. Vitrified tiles are oftenly use in\noutdoors due to their water frost resistance.\n7. MARBLE\n\nLike many other stone tile, has very high maintenance\nrequirements. Marble is also porous, which means it can be\nstained, scratched and worn easily.\n8. GRANITE\n\nIs a granular type of stone which by definition is an igneous\nrock (formed by heat) with at least 20% quartz by volume.\n9. TILE GROUT\n\nA powder in texture made up of different colors when mixed with\nwater become putty. it is used as filler or gap between tiles.\n10. TILE TRIM\n\nMade up of plastic use for covering the edges of tile for\nprotection and to attain acceptable finish.\n11. TILE SPACER\n\nA “cross” like material with a minimum thickness of 3mm made\nup of plastic. It is being placed at the intersection of titles to\nmaintain uniform spacing.\n12. NOSING\n\nA protecting edge, as the part of the tread of a step extending\nbeyond the riser of a stair.\n13. PLANE SURFACE\n\nRefers to even or flat surface of roof, floor and wall.\n14. CURVED SURFACE\n\nRefers to round, conical, spherical and oval surface commonly\noccur in corinthian motif, round columns, walkways and large\nentrance of buildings.\n\n--- PDF PAGE 100 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 96\n\n15. PRODUCTIVITY\n\nThe quality state on facts of being able to generate, create,\nenhance or bring forth goods and services.\n16. 5S\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain.\n17. 3 RS\nThe principle of reducing waste, reusing and recycling resources\nand products:\nReduce\nThe waste management concept of reducing what is produced\nand what is consumed\nRe-Use\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\nRecycle\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 101 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 97\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nTile Setting NC II\nQualification Code:\nCONTIL218\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nTile Setting NC II\nTile Setting NC II\n2007-21 /\n07/27/07\nN/A\n01\nDocument\nAmended\nTile Setting NC II\nTile Setting NC II\n2018-33 /\n10/29/18\nNo. 008 series\nof 2019\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 102 ---\nTILE-SETTING NC II Revision 01 Promulgated (10/29/2018) 98\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMARCELO R. ABAD\nConsultant/ Industry Expert\nQuezon City\n\nRIZALDY E. ANGELES\nConstruction Manager - Industry Expert\nEEI Corporation\nQuezon City\nJOHN S. JUAN\nSTIDS\nConstruction Industry Authority of the\nPhils. (CIAP) -CMDF\nMakati City\n\nANGELITO V. ZULUETA\nConsultant