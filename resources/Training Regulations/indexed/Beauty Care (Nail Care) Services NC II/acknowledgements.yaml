    {
      "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT"
    },
    {
      "source_text": "Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards. The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to an employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1.1 To attain the national qualification of BEAUTY CARE (NAIL CARE) SERVICES NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in cluster of related units of competency, namely:"
    },
    {
      "source_text": "COC 1 Provide manicure and pedicure services"
    },
    {
      "source_text": "Perform manicure and pedicure"
    },
    {
      "source_text": "COC 2 Provide hand and foot spa services"
    },
    {
      "source_text": "Perform hand and foot spa"
    },
    {
      "source_text": "Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification."
    },
    {
      "source_text": "4.1.3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "source_text": "4.1.4 Any of the following are qualified to undergo assessment and certification:"
    },
    {
      "source_text": "4.1.4.1 Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to BEAUTY CARE (NAIL CARE) SERVICES NC II."
    },
    {
      "source_text": "4.1.4.2 Experienced workers (wage employed or self-employed) who gained competencies in providing nail care services for at least two (2) years within the last five (5) years."
    },
    {
      "source_text": "-- PDF PAGE 134 --- TR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 130"
    },
    {
      "source_text": "4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least three (3) years of nail care services experience within the last five (5) years may apply for recognition in this Qualification through Portfolio Assessment."
    },
    {
      "source_text": "Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System."
    },
    {
      "source_text": "4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC) in Beauty Care (Nail Care) Services NC II are required to undergo re- assessment under the amended Training Regulations (TRs), upon expiration of their Certificates."
    },
    {
      "source_text": "4.1.7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
    {
      "source_text": "4.2 COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment."
    },
    {
      "source_text": "This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment"
    },
    {
      "source_text": "4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "source_text": "4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    },
