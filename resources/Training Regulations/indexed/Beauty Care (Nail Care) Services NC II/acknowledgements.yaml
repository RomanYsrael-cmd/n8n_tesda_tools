      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional Assessment is gathering of evidences to determine the achievements of the requirements of the qualification to enable the trainer make judgment whether the trainee is competent or not competent."
    },
    {
      "source_text": "-- PDF PAGE 133 --- TR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 129"
