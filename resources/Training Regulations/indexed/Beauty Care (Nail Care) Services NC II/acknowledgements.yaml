      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Manage one’s emotion 1.1 Self-management strategies are identified 1.2 Skills to work independently and to show initiative, to be conscientious, and persevering in the face of setbacks and frustrations are developed 1.3 Techniques for effectively handling negative emotions and unpleasant situation in the workplace are examined"
    },
    {
