1.15 Applied appropriate products following spa/salon policies\nand procedures in accordance with product usage\nspecifications.\n1.16 Gave immediate first aid to accidental cuts, wounds and\nabrasions following spa/salon policies and procedures.\n1.17 Performed basic hand and foot massage techniques\nusing appropriate or client preferred product.\n1.18 Properly removed excess traces of hand and foot\nmassage products.\n1.19 Applied a moisturizing product to the hands and feet.\n1.20 Advised client on proper hand and foot care\nmaintenance following spa/salon polies and procedures\nin accordance with applicable laws and government\nprocedures.\n\n--- PDF PAGE 84 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 80\n\n1.21 Cleaned, disinfected/sterilized and stored equipment and\ntools following spa/salon procedures in accordance with\nmanufacturer’s instructions.\n1.22 Replenished and stored products, supplies and materials\nfollowing spa/salon policies and procedures in\naccordance with product usage specifications.\n1.23 Collected waste materials following proper waste\nmanagement and disposal procedures in compliance\nwith applicable laws and government regulations.\n1.24 Cleaned, disinfected and prepared workstation for the\nnext service.\n1.25 Performed proper documentation in accordance with\nspa/salon policies and procedures.\n8. Resource\nImplications\nThe following resources should be provided:\n2.1 Live Model\n2.2 Supplies and materials.\n2.3 Actual or simulated work station\n2.4 Tools and equipment\n2.5 Protective clothing and gadgets\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning.\n3.2 Observation with oral questioning\n3.3 Portfolio\n4. Context of\nAssessment\n4.2 Competency may be assessed in the workplace or\nTESDA Accredited assessment center\n\n--- PDF PAGE 85 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 81\n\nSECTION 3\nTRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for BEAUTY CARE (NAIL CARE) SERVICES NC II.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: BEAUTY CARE (NAIL CARE) SERVICES Level: NC II\n\nNominal Training Duration:\n\n37 Hours (Basic Competencies)\n\n 24 Hours (Common Competencies)\n\n280 Hours (Core Competencies)\n\n341\n\n80 Supervised Industry Learning (SIL)\n\n421 TOTAL HOURS\n\nCourse Description:\n\n This course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in performing manicure\nand pedicure; and hand and foot spa. This include classroom learning activities and\npractical work in actual work site or simulation area.\n\n Upon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 86 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 82\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizati