e viral infection/wart\n19.4 Scabies\n19.5 Severe eczema or Psoriasis\n19.6 Undiagnosed lump and swelling\n19.7 Swollen hands/feet\n19.8 Contagious diseases\n19.9 Infectious diseases\n19.10 Redness of hands/feet\n19.11 Severe wounds\n19.12 Severe nail trauma\n19.13 Rams Horn Nail (Onychogryposis)\n19.14 Severe Onycholysis\n19.15 Onychoptosis (shedding/falling of nail)\n19.16 Green Nail Syndrome (Pseudomonas)\n20. Appropriate Health Care\nProfessionals\nMay include:\n20.1 Podiatrists\n20.2 Dermatologists\n20.3 Physicians\n20.4 Orthopedic Surgeons\n20.5 Physical Therapists\n20.6 Occupational Therapists\n20.7 Nurses\n21. Basic Nail Designs\nMay include:\n21.1 Plain (single coats per color)\n21.2 Elephant tusk\n21.3 Half moon\n21.4 Half-moon with tip\n21.5 French tip\n21.6 V-shape\n22. Basic Manicure and\nPedicure Procedures\nMay include:\n22.1 Remove existing nail polish completely with nail\npolish remover following product usage\nspecifications.\n22.2 Soften the fingernails/toe nails by soaking in warm\nwater with liquid soak solution following product\nusage specifications.\n22.3 Evenly trim and file nails in accordance with client’s\npreferred length and shape.\n22.4 Apply cuticle remover/softener following product\nusage specifications.\n\n--- PDF PAGE 71 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 67\n\nVARIABLE\nRANGE\n22.5 Select the appropriate tools and gently push back\nthe cuticle and remove dry skin and\nhangnails/ragged free edges surrounding the nail\ngrooves.\n22.6 Brush nails in a downward direction or wipe with\nmoist cotton after removal of dry skin and\nhangnails/ragged free edges.\n22.7 Re-file and buff to smoothen the nail plate and\nedges according to client’s chosen shape and style.\n22.8 Clean the nail plate with alcohol for polish to adhere\nwell.\n22.9 Apply the base coat and the chosen polish (and\ncreate basic nail design/s if preferred by the client).\n22.10 Remove excess polish around the cuticles and\nnails with appropriate tools.\n22.11 Apply the top/seal coat over the entire nail plate\nand give adequate time for the nails to dry.\n22.12 Apply quick-dry product as may be necessary.\n23. Quick-Dry Product\nMay Include:\n23.1 Quick-dry serums\n23.2 Quick-dry oil\n23.3 Quick-dry sprays\n23.4 Fast-dry top coat sprays\n23.5 Non-toxic nail dryers\n24. Proper Nail Care and\nMaintenance\nMay include:\n24.1 Regular spa/salon visits\n24.2 Regular application of lotion and oils\n24.3 Wear suitable gloves when doing activities\ninvolving use of water or chemicals\n24.4 Avoid using nails as tools in performing tasks\n24.5 Avoid biting nails\n24.6 Use of emery boards to remove ragged free edges\nto the nails\n25. Waste materials\nMay include:\n25.1 Biodegradable:\n25.1.1 Disposable wipes\n25.1.2 Tissues\n25.1.3 Cling wraps\n25.1.4 Cotton\n25.1.5 Nail trimmings\n25.2 Non-biodegradable\n25.2.1 Product packaging\n25.2.2 Bottles\n25.2.3 Plastics\n25.2.4 Caps\n26. Waste Management and\nDisposal\nMay include:\n26.1 Prevention\n26.2 Reduction\n26.3 Segregation\n\n--- PDF PAGE 72 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 68\n\nVARIABLE\nRANGE\n26.4 Re-use\n26.5 Recycling\n26.6 Composting\n\n--- PDF PAGE 73 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 69\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDisinfected and sterilized equipment and tools using\nregistered sterilants/EPA and hospital grade disinfectants\nin compliance with applicable laws and government\nregulations.\n1.2\nPrepared the required supplies and materials.\n1.3\nCleaned, disinfected and organized workstation following\nspa/salon policies and procedures.\n1.4\nProvided Personal Protective Equipment (PPE) following\nhealth and safety standards set by the spa/salon industry.\n1.5\nObserved proper personal and hand hygiene.\n1.6\nImplemented proper handling of equipment, tools, supplies\nand materials to avoid cross-infections/cross-contamination\nwithin the workplace.\n1.7\nSeated the client properly, safety and comfort are ensured\nthroughout the service.\n1.8\nAdvised the client to remove jewelries and accessories for\nsafety and sanitation.\n1.9\nTook client’s vital signs using appropriate instruments.\n1.10 Assessed and identified client’s nail structure and\ncondition.\n1.11 Identified contraindicated nail conditions/disorders and\ndiseases that may restrict the manicure and pedicure\nservice and referred to appropriate health professional.\n1.12 Presented nail shapes, basic nail designs and available\nnail polish to the client.\n1.13 Cleansed and disinfected client’s nails using appropriate\nproducts.\n1.14 Performed basic manicure and pedicure procedures based\non client preference, product usage specifications and\nspa/salon policy.\n1.15 Gave immediate first aid to accidental wounds and cuts\nand referred serious cases to appropriate health care\nprofessionals.\n1.16 Created basic nail design in accordance with client chosen\ndesign and color/s.\n1.17 Evaluated finished work based on client preferred shape,\ncolor and design.\n1.18 Advised client on proper nail care and maintenance.\n1.19 Cleaned, disinfected/sterilized and stored equipment and\ntools following spa/salon procedures in accordance with\nmanufacturer’s instructions.\n1.20 Replenished and stored products, supplies and materials\nfollowing spa/salon policies and procedures in accordance\nwith product usage specifications.\n1.21 Collected waste materials following proper waste\nmanagement and disposal procedures in compliance with\napplicable laws and government regulations.\n\n--- PDF PAGE 74 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 70\n\n1.22 Cleaned, disinfected and prepared workstation for the next\nservice.\n1.23 Performed proper documentation in accordance with\nspa/salon policies and procedures.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Live Model\n2.2 Treatment Products\n2.3 Materials, supplies, Tools and Equipment\n2.4 Actual workstation or simulated workplace with complete\nfacilities\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Direct observation with oral questioning\n3.3 Portfolio\n4. Context of\nAssessment\n4.1 Competency may be assessed in the workplace or\naccredited assessment center.\n\n--- PDF PAGE 75 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 71\n\nUNIT OF COMPETENCY : PERFORM HAND AND FOOT SPA\n\nUNIT CODE\n: SOC514312\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude in\nperforming spa for hand and feet. It also involves preparing,\nconsulting the client and analyzing skin, hand and feet\nconditions and diseases, performing hand and foot spa\nprocedures and performing post service activities. It includes\npracticing proper and ethical behavior at all times in\naccordance with the code of ethics.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare\nworkstation\nand\nimplements\n1.1 Appropriate disinfection\nand sterilization of\nequipment and tools are\ncarried out using registered\nsterilants/EPA and hospital\ngrade disinfectants in\ncompliance with applicable\nlaws and government\nregulations.\n1.2 Required supplies and\nmaterials, and hand and\nfoot massage products\nare prepared.\n1.3 Workstation is cleaned,\ndisinfected and organized\nfollowing spa/salon policies\nand procedures.\n1.4 Personal Protective\nEquipment (PPE) is\nprovided following health\nand safety standards set\nby the spa/salon industry.\n1.5 Proper personal and hand\nhygiene is observed with\nknowledge of common\nmicroorganisms and\nprocess of infection.\n1.6 Proper handling of\nequipment, tools, supplies\nand 