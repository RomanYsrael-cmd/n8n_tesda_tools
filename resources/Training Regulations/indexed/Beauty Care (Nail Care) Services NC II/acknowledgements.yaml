e) Services NC II Revision 01 Promulgated (06/09/2020) 129\n\nSECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of BEAUTY CARE (NAIL CARE)\nSERVICES NC II, the candidate must demonstrate competence in all units\nlisted in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals\nwho were assessed as competent in cluster of related units of competency,\nnamely:\n\n COC 1 Provide manicure and pedicure services\n• Perform manicure and pedicure\n\n COC 2 Provide hand and foot spa services\n• Perform hand and foot spa\n\n Upon accumulation and submission of all the COCs acquired, an\nindividual shall be issued the corresponding National Certificate for the\nQualification.\n\n4.1.3 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to undergo assessment and certification:\n\n4.1.4.1\nGraduates of WTR-registered program, NTR-registered programs\nor formal/non-formal/informal including enterprise-based trainings\nrelated to BEAUTY CARE (NAIL CARE) SERVICES NC II.\n\n4.1.4.2\nExperienced workers (wage employed or self-employed) who\ngained competencies in providing nail care services for at least\ntwo (2) years within the last five (5) years.\n\n--- PDF PAGE 134 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 130\n\n4.1.5\nRecognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of nail care services experience\nwithin the last five (5) years may apply for recognition in this Qualification\nthrough Portfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must\nbe consistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System.\n\n4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC)\nin Beauty Care (Nail Care) Services NC II are required to undergo re-\nassessment under the amended Training Regulations (TRs), upon\nexpiration of their Certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in\nthe “Procedures Manual on Assessment and Certification” and “Guidelines\non the Implementation of the “Philippine TVET Competency Assessment\nand Certification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 135 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 131\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nteam\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career\nand life\ndecisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health\npolicies and\nprocedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying learning\nand innovation in\nthe organization\nUse information\nsystematically\nEvaluate occupational\nsafety and health\nwork practices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n