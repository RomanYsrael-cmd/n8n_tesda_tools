      "source_text": "1. Critical Aspects of competency Assessment requires evidence that the candidate: 1.1 Disinfected and sterilized equipment and tools using registered sterilants/EPA and hospital grade disinfectants in compliance with applicable laws and government regulations. 1.2 Prepared the required supplies and materials. 1.3 Cleaned, disinfected and organized workstation following spa/salon policies and procedures. 1.4 Provided Personal Protective Equipment (PPE) following health and safety standards set by the spa/salon industry. 1.5 Observed proper personal and hand hygiene. 1.6 Implemented proper handling of equipment, tools, supplies and materials to avoid cross-infections/cross-contamination within the workplace. 1.7 Seated the client properly, safety and comfort are ensured throughout the service. 1.8 Advised the client to remove jewelries and accessories for safety and sanitation. 1.9 Took client’s vital signs using appropriate instruments. 1.10 Assessed and identified client’s nail structure and condition. 1.11 Identified contraindicated nail conditions/disorders and diseases that may restrict the manicure and pedicure service and referred to appropriate health professional. 1.12 Presented nail shapes, basic nail designs and available nail polish to the client. 1.13 Cleansed and disinfected client’s nails using appropriate products. 1.14 Performed basic manicure and pedicure procedures based on client preference, product usage specifications and spa/salon policy. 1.15 Gave immediate first aid to accidental wounds and cuts and referred serious cases to appropriate health care professionals. 1.16 Created basic nail design in accordance with client chosen design and color/s. 1.17 Evaluated finished work based on client preferred shape, color and design. 1.18 Advised client on proper nail care and maintenance. 1.19 Cleaned, disinfected/sterilized and stored equipment and tools following spa/salon procedures in accordance with manufacturer’s instructions. 1.20 Replenished and stored products, supplies and materials following spa/salon policies and procedures in accordance with product usage specifications. 1.21 Collected waste materials following proper waste management and disposal procedures in compliance with applicable laws and government regulations."
