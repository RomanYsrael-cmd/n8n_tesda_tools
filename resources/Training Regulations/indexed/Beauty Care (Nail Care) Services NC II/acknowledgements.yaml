rocess of infection\n1.6 Proper handling of\nequipment, tools, supplies\nand materials is\nimplemented to avoid\ncross-infection/cross-\n1.1\nCode on\nSanitation of the\nPhilippines\n1.2\nCode of Ethics\n1.3\nDisinfection and\nSterilization\nProcesses\n1.4\nSpa/Salon\nPolicies and\nProcedures\n1.5\nApplicable laws\nand government\nregulations\n1.6\nSpa/Salon\nEquipment,\nTools, Supplies\nand Materials\n1.7\nProduct\nknowledge\n1.8\nBasic\nMathematics\n1.9\nPPE requirement\n1.10 Common\nMicroorganisms\n1.11 Process of\nInfection\n1.12 Infection control\npractices\n1.13 Spa/salon\ndocumentation\nand records\nmanagement\n\n1.1 Complying with\nthe legal and\nindustry\nrequirements on\nspa/salon safety\nand sanitation\n1.2 Implementing\ndisinfection and\nsterilization\nprocesses\n1.3 Identifying and\npreparing\nrequired\nequipment, tools,\nsupplies and\nmaterials\n1.4 Identifying and\npreparing nail\nproducts\n1.5 Interpreting\nmanufacturer’s\noperations\nmanual\n1.6 Organizing\nworkstation\n1.7 Observing proper\npersonal and\nhand hygiene\n1.8 Handling\nequipment, tools,\nsupplies and\nmaterial properly\n\n--- PDF PAGE 61 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 57\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncontamination within the\nworkplace\n1.7 Required documentation\ntools and materials are\nprepared in accordance\nwith spa/salon policies and\nprocedures\n1.9\nIdentifying\ncommons\nmicroorganisms\n1.10 Understanding\nthe process of\ninfection\n1.11 Identifying\ndocumentation\nrequirements,\ntools and\nmaterials\n\n2. Prepare the\nclient\n2.1 Client is properly seated\nwith safety and comfort\nensured throughout the\nentire service.\n2.2 Client is advised to remove\njewelries and\naccessories for safety and\nsanitation.\n2.3 Personal Protective\nEquipment (PPE) is\nhanded over to the client in\ncompliance with applicable\nlaws and g