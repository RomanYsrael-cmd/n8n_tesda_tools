2.8 Alcohol\n2.9 Mittens\n2.10 Disposable gloves (latex)\n2.11 Hand towel\n2.12 Callus remover\n2.13 Foot scrub\n2.14 Exfoliating gloves\n3. Hand and Foot\nMassage Products\nMay include:\n3.1 Hand and Body lotion\n3.2 Base oils\n3.2.1 Olive oil\n3.2.2 Virgin coconut oil\n3.2.3 Grape seed oil\n3.2.4 Mineral oil\n3.3 Base oils with Essential oils\n3.3.1 Lavender essential oil\n3.3.2 Peppermint essential oil\n3.3.3 Eucalyptus essential oil\n3.3.4 Lemon essential oil\n3.4 Massage gels\n3.5 Medicated lotions and oils\n4. Hand and Foot Skin\nTypes and Conditions\nMay include:\n4.1 Skin Types\n4.1.1 Normal\n4.1.2 Oily\n4.1.3 Dry\n4.1.4 Combination\n\n--- PDF PAGE 81 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 77\n\nVARIABLE\nRANGE\n4.1.5 Sensitive\n4.2 Skin Conditions\n4.2.1 Sensitive\n4.2.2 Rough\n4.2.3 Dry/dehydrated\n4.2.4 Flaky\n5. Common Hand and\nFoot Conditions\nMay include:\n5.1 Corns and calluses\n5.2 Ingrown\n5.3 Cuts/abrasions/wounds\n5.4 Warts\n5.5 Bunions\n5.6 Gout\n5.7 Blisters\n5.8 Localized/mild eczema/dermatitis\n5.9 Psoriasis\n6. Contraindicated Hand\nand Foot\nDisorders/Diseases\nMay include:\n6.1 Contagious skin diseases\n6.1.1 Impetigo\n6.1.2 Scabies,\n6.1.3 Chicken pox\n6.1.4 Severe warts\n6.2 Open skin, cuts, wounds, grazes\n6.3 Acute hematomas or bruises\n6.4 Recent fractures\n6.5 Severe psoriasis or eczema\n6.6 Untreated/undiagnosed medical conditions\n6.6.1 Acute pain\n6.6.2 Swelling\n6.6.3 Fever\n6.7 Severe varicose veins\n6.8 Active gout\n6.9 Infectious diseases\n6.9.1\nBacterial\n6.9.2\nFungal\n7. Hand and Foot Spa\nProcedures\nMay include:\n7.1 Hand Spa\n7.1.1 Soak client’s hands into the hand spa machine /\nbasin filled with warm water and appropriate\nproduct for 5 to 10 minutes or establishment\nstandard timeframe.\n7.1.2 Perform hand exfoliation using appropriate\nsupplies, materials and products.\n7.1.3 Rinse or dry hands with clean towel.\n7.1.4 Apply hand mask and wrap with plastic wrap\nfollowed by gloves/mittens. Leave it on for 10 to\n15 minutes or establishment standard timeframe.\n7.1.5 Remove wrap, rinse in warm water and dry hands\nwith clean towel.\n7.1.6 Perform basic hand massage techniques using\nappropriate product.\n\n--- PDF PAGE 82 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 78\n\nVARIABLE\nRANGE\n7.1.7 Remove product residues from hands with a clean\nand dry towel.\n7.1.8 Apply a moisturizing product.\n7.2 Foot Spa\n7.2.1 Soak client’s feet into the foot spa machine / basin\nfilled with warm water and appropriate product for\n10 to 15 minutes or establishment standard\ntimeframe.\n7.2.2 Apply an appropriate product and scrub feet using\nthe appropriate tools giving more emphasis on\nproblem areas, such as with calluses and dry skin.\n7.2.3 Rinse feet in warm water to remove product\nresidues and dry with clean towel.\n7.2.4 Apply foot mask and wrap with plastic wrap\nfollowed by gloves/mittens. Leave it on for 10 to\n15 minutes or establishment standard timeframe.\n7.2.5 Remove wraps and rinse feet with warm water.\nDry feet using a clean and dry towel.\n7.2.6 Perform basic foot massage using appropriate\nproduct.\n7.2.7 Remove all product residues from the feet with a\nclean and dry towel.\n7.2.8 Apply a moisturizing product.\n8. Basic Hand and Foot\nMassage Techniques\nMay include:\n8.1 Variations of Effleurage\n8.2 Variations of Petrissage/Kneading\n8.3 Variations of Friction technique\n8.4 Variations of Vibration technique\n8.5 Applicable variations of Tapotement\n8.6 Stretching and joint mobilization techniques\n8.7 Established hand and foot massage sequence\n9. Moisturizing Product\nMay include:\n9.1 Hand and body lotion\n9.2 Hydrating cream\n9.3 Non-mineral oil\n10. Hand and Foot Care\nMaintenance\nMay include:\n10.1 Hand Care\n10.1.1 Wearing gloves to protect hands from chemical\nexposure and accidents in performing activities\n10.1.2 Use of mild/gentle soap in washing hands\n10.1.3 Regular 