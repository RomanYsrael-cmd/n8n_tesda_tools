      "source_text": "1. Critical Aspects of Competency Assessment requires evidence that the candidate: 1.1 Disinfected and sterilized equipment and tools using registered sterilants/EPA and hospital grade disinfectants in compliance with applicable laws and government regulations. 1.2 Prepared the required supplies and materials, and hand and foot massage products. 1.3 Cleaned, disinfected and organized workstation following spa/salon policies and procedures. 1.4 Provided Personal Protective Equipment (PPE) following health and safety standards set by the spa/salon industry. 1.5 Observed proper personal and hand hygiene. 1.6 Implemented proper handling of equipment, tools, supplies and materials to avoid cross-infections/cross- contamination within the workplace. 1.7 Properly seated the client and ensured safety and comfort throughout the service. 1.8 Advised the client to remove jewelries and accessories for safety and sanitation. 1.9 Took client’s vital signs using appropriate instruments. 1.10 Assessed and identified hand and foot skin type and condition. 1.11 Identified common hand and foot conditions and contraindicated disorders/diseases that may restrict treatment and referred to appropriate health care professional. 1.12 Cleaned and disinfected client’s hand and feet following spa/salon policies and procedures in compliance with applicable laws and government policies. 1.13 Performed the established hand and foot spa procedures. 1.14 Used sanitized equipment and tools following spa/salon policies and procedures in accordance with manufacturer’s instructions. 1.15 Applied appropriate products following spa/salon policies and procedures in accordance with product usage specifications. 1.16 Gave immediate first aid to accidental cuts, wounds and abrasions following spa/salon policies and procedures. 1.17 Performed basic hand and foot massage techniques using appropriate or client preferred product. 1.18 Properly removed excess traces of hand and foot massage products. 1.19 Applied a moisturizing product to the hands and feet. 1.20 Advised client on proper hand and foot care maintenance following spa/salon polies and procedures in accordance with applicable laws and government procedures."
