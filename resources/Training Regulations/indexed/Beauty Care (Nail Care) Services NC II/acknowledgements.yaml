    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "Unit Code BASIC COMPETENCIES 400311210 Participate in workplace communication 400311211 Work in team environment 400311212 Solve/address general workplace problems 400311213 Develop career and life decisions 400311214 Contribute to workplace innovation 400311215 Present relevant information 400311216 Practice occupational safety and health policies and procedures 400311217 Exercise efficient and effective sustainable practices in the workplace 400311218 Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "Unit Code"
    },
    {
      "source_text": "COMMON COMPETENCIES SOC514201 Maintain an effective relationship with client/customer SOC514202 Manage own performance SOC514203 Apply quality standards SOC514204 Maintain a safe, clean and efficient environment"
    },
    {
      "source_text": "Unit Code"
    },
    {
      "source_text": "CORE COMPETENCIES SOC514311 Perform manicure and pedicure SOC514312 Perform hand and foot spa"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be:"
    },
