      "source_text": "nail-producing tissue at base of nail: the layer of tissue at the base of a fingernail or toenail from which new nail materials develops. NAIL FILE"
    },
    {
      "source_text": "file for fingernails: a small file used for smoothing and shaping the ends of the fingernails. NAIL POLISH"
    },
    {
      "source_text": "varnish for fingernails: a fast drying colored or transparent lacquer used to decorate fingernails or toenail. NAIL SCISSOR"
    },
    {
      "source_text": "small scissor for fingernails: small scissor, sometimes with curved blades, used for trimming fingernails or toenails. PERSONAL PROTECTIVE EQUIPMENT"
    },
    {
      "source_text": "means any clothing, device or another article that is intended to be worn or used by a worker to prevent injury or to facilitate rescue; SAFETY"
    },
    {
      "source_text": "the condition of being free from danger and hazards which may cause injuries or diseases. SAFETY DATA SHEETS (SDS)"
    },
    {
      "source_text": "is a document that provides important physical characteristics, ecological, health, safety and toxicological information on chemical substances or mixtures of ingredients used at the workplace, transported and maybe utilized by the consumer. SANITIZE"
    },
    {
      "source_text": "an effective bactericidal treatment to render surfaces of utensils, tools and equipment free pathogenic microorganisms SEGRAGATION"
    },
    {
      "source_text": "shall refer to sorting and segregation of different materials found in solid waste in order to promote recycling and re-use of resources and to reduce the volume of waste collection and disposal. SOLVENT"
    },
    {
      "source_text": "a common term of liquid substance used in dry cleaning process in place of water. STERILIZATION"
    },
    {
      "source_text": "any chemical and or physical process which kills and destroys all microorganisms. SURFACE"
    },
    {
      "source_text": "thin applied outer layer, relatively thin outer layer or coating applied to something, usually to give it smooth finish. TONSORIAL AND BEAUTY ESTABLISHMENT"
    },
    {
      "source_text": "includes barber shop, parlors and other establishments engaged in the physical make-over of an individual TOUCH UP"
    },
    {
      "source_text": "improve something: to make a slight improvement to something, e.g. with paint WORKFLOW"
    },
    {
      "source_text": "progress of work: the progress or rate of progress of work done by a business, department, or person."
