      "source_text": "VARIABLE RANGE 4.1.5 Sensitive 4.2 Skin Conditions 4.2.1 Sensitive 4.2.2 Rough 4.2.3 Dry/dehydrated 4.2.4 Flaky 5. Common Hand and Foot Conditions May include: 5.1 Corns and calluses 5.2 Ingrown 5.3 Cuts/abrasions/wounds 5.4 Warts 5.5 Bunions 5.6 Gout 5.7 Blisters 5.8 Localized/mild eczema/dermatitis 5.9 Psoriasis 6. Contraindicated Hand and Foot Disorders/Diseases May include: 6.1 Contagious skin diseases 6.1.1 Impetigo 6.1.2 Scabies, 6.1.3 Chicken pox 6.1.4 Severe warts 6.2 Open skin, cuts, wounds, grazes 6.3 Acute hematomas or bruises 6.4 Recent fractures 6.5 Severe psoriasis or eczema 6.6 Untreated/undiagnosed medical conditions 6.6.1 Acute pain 6.6.2 Swelling 6.6.3 Fever 6.7 Severe varicose veins 6.8 Active gout 6.9 Infectious diseases 6.9.1 Bacterial 6.9.2 Fungal 7. Hand and Foot Spa Procedures May include: 7.1 Hand Spa 7.1.1 Soak client’s hands into the hand spa machine / basin filled with warm water and appropriate product for 5 to 10 minutes or establishment standard timeframe. 7.1.2 Perform hand exfoliation using appropriate supplies, materials and products. 7.1.3 Rinse or dry hands with clean towel. 7.1.4 Apply hand mask and wrap with plastic wrap followed by gloves/mittens. Leave it on for 10 to 15 minutes or establishment standard timeframe. 7.1.5 Remove wrap, rinse in warm water and dry hands with clean towel. 7.1.6 Perform basic hand massage techniques using appropriate product."
