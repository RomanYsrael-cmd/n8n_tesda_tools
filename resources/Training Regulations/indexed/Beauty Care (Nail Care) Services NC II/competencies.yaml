        "source_text": "--- PDF PAGE 19 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 15 \n \nUNIT OF COMPETENCY : DEVELOP CAREER AND LIFE DECISIONS \n \n \n \nUNIT CODE \n: 400311213 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills, and attitudes in \nmanaging one’s emotions, developing reflective practice, and \nboosting self-confidence and developing self-regulation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Manage \none’s \nemotion \n1.1 Self-management \nstrategies are identified \n1.2 Skills to work independently \nand to show initiative, to be \nconscientious, and \npersevering in the face of \nsetbacks and frustrations \nare developed \n1.3 Techniques for effectively \nhandling negative emotions \nand unpleasant situation \nin the workplace are \nexamined \n \n \n \n4.1 Self-management \nstrategies that assist \nin regulating \nbehavior and \nachieving personal \nand learning goals \n(e.g. Nine self-\nmanagement \nstrategies according \nto Robert Kelley) \n4.2 Enablers and \nbarriers in achieving \npersonal and career \ngoals \n4.3 Techniques in \nhandling negative \nemotions and \nunpleasant situation \nin the workplace \nsuch as frustration, \nanger, worry, \nanxiety, etc. \n1.1 Managing properly \none’s emotions \nand recognizing \nsituations that \ncannot be changed \nand accept them \nand remain \nprofessional \n1.2 Developing self-\ndiscipline, working \nindependently and \nshowing initiative \nto achieve \npersonal and \ncareer goals \n1.3 Showing \nconfidence, and \nresilience in the \nface of setbacks \nand frustrations \nand other negative \nemotions and \nunpleasant \nsituations in the \nworkplace \n2. Develop \nreflective \npractice \n2.1 Personal strengths and \nachievements, based on \nself-assessment strategies \nand teacher feedback are \ncontemplated \n2.2 Progress when seeking and \nresponding to feedback \nfrom teachers to assist \nthem in consolidating \nstrengths, addressing \nweaknesses and fulfilling \ntheir potential are \nmonitored \n2.3 Outcomes of personal and \nacademic challenges by \nreflecting on previous \nproblem solving and \n2.1 Basic SWOT \nanalysis \n2.2 Strategies to \nimprove one’s \nattitude in the \nworkplace \n2.3 Gibbs’ Reflective \nCycle/Model \n(Description, \nFeelings, \nEvaluation, \nAnalysis, \nConclusion, and \nAction plan) \n2.1 Using the basic \nSWOT analysis as \nself-assessment \nstrategy \n2.2 Developing \nreflective practice \nthrough realization \nof limitations, likes/ \ndislikes; through \nshowing of self-\nconfidence   \n2.3 Demonstrating \nself-acceptance \nand being able to \naccept challenges\n\n--- PDF PAGE 20 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 16 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ndecision-making strategies \nand feedback from peers \nand teachers are predicted \n3. Boost self-\nconfidence \nand \ndevelop \nself-\nregulation \n3.1 Efforts for continuous self-\nimprovement are \ndemonstrated \n3.2 Counter-productive \ntendencies at work are \neliminated \n3.3 Positive outlook in life are \nmaintained.  \n \n3.1 Four components of \nself-regulation \nbased on Self-\nRegulation Theory \n(SRT) \n3.2 Personality \ndevelopment \nconcepts \n3.3 Self-help concepts \n(e. g., 7 Habits by \nStephen Covey, \ntransactional \nanalysis, psycho-\nspiritual concepts) \n3.1 Performing \neffective \ncommunication \nskills – reading, \nwriting, conversing \nskills \n3.2 Showing affective \nskills – flexibility, \nadaptability, etc. \n3.3 Self-assessment \nfor determining \none’s strengths \nand weaknesses\n\n--- PDF PAGE 21 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 17 \n \n    RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Self-management \nstrategies \nMay include: \n1.1 Seeking assistance in the form of job coaching or \nmentoring  \n1.2 Continuing dialogue to tackle workplace grievances \n1.3 Collective negotiation/bargaining for better working \nconditions \n1.4 Share your goals to improve with a trusted co-worker or \nsupervisor \n1.5 Make a negativity log of every instance when you catch \nyourself complaining to others \n1.6 Make lists and schedules for necessary activities \n2. Unpleasant situation \nMay include: \n2.1 Job burn-out \n2.2 Drug dependence \n2.3 Sulking \n \n \n \n \n  EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 \nExpress emotions appropriately \n1.2 \nWork independently and show initiative \n1.3 \nConsistently demonstrate self-confidence and self-\ndiscipline  \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to workplace and resource s \n2.2. Case studies  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration or simulation with oral questioning \n3.2. Case problems involving work improvement and \nsustainability issues \n3.3. Third-party report \n4. Context for \nAssessment \n4.1. Competency assessment may occur in workplace or \nany appropriately simulated environment\n",
