        "source_text": "--- PDF PAGE 22 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 18 \n \nUNIT OF COMPETENCY : CONTRIBUTE TO WORKPLACE INNOVATION \n \n \n \nUNIT CODE \n: 400311214 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto make a pro-active and positive contribution to workplace \ninnovation. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Identify \nopportunities \nto do things \nbetter \n1.1 Opportunities for \nimprovement are \nidentified proactively in \nown area of work \n1.2 Information are gathered \nand reviewed which may \nbe relevant to ideas and \nwhich might assist in \ngaining support for idea \n1.1 Roles of individuals \nin suggesting and \nmaking \nimprovements. \n1.2 Positive impacts \nand challenges in \ninnovation \n1.3 Types of changes \nand responsibility \n1.4 Seven habits of \nhighly effective \npeople \n \n1.1 Identifying \nopportunities to \nimprove and to do \nthings better \ninvolvement \n1.2 Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n1.3 Identifying \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n2. Discuss \nand \ndevelop \nideas with \nothers \n2.1 People who could \nprovide input to ideas for \nimprovements are \nidentified \n2.2 Ways of approaching \npeople to begin sharing \nideas are selected \n2.3 Meeting is set with \nrelevant people \n2.4 Ideas for follow up are \nreview and selected \nbased on feedback \n2.5 Critical inquiry method \nis used to discuss and \ndevelop ideas with others \n2.1 Roles of individuals \nin suggesting and \nmaking \nimprovements \n2.2 Positive impacts \nand challenges in \ninnovation \n2.3 Types of changes \nand responsibility \n2.4 Seven habits of \nhighly effective \npeople \n \n2.1 Identifying \nopportunities to \nimprove and to do \nthings better \ninvolvement \n2.2 Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n2.3 Providing \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n2.4 Communicating \nideas for change \nthrough small \ngroup discussions \nand meetings \n3. Integrate \nideas for \nchange in \n3.1 Critical inquiry method is \nused to integrate different \n3.1 Roles of individuals \nin suggesting and \n3.1 Identifying \nopportunities to\n\n--- PDF PAGE 23 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 19 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \nthe \nworkplace \nideas for change of key \npeople \n3.2 Summarizing, analysing \nand generalizing skills are \nused to extract salient \npoints in the pool of ideas \n3.3 Reporting skills are \nlikewise used to \ncommunicate results \n3.4 Current Issues and \nconcerns on the \nsystems, processes and \nprocedures, as well as the \nneed for simple innovative \npractices are identified \nmaking \nimprovements \n3.2 Positive impacts \nand challenges in \ninnovation \n3.3 Types of changes \nand responsibility \n3.4 Seven habits of \nhighly effective \npeople \n3.5 Basic research \nskills \nimprove and to do \nthings better \n3.2 Involvement \n3.3 Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n3.4 Providing \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n3.5 Communicating \nideas for change \nthrough small \ngroup discussions \nand meetings \n3.6 Demonstrating \nskills in analysis \nand interpretation \nof data\n\n--- PDF PAGE 24 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 20 \n \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Opportunities for \nimprovement \nMay include: \n1.1 Systems \n1.2 Processes \n1.3 Procedures \n1.4 Protocols \n1.5 Codes \n1.6 Practices \n2. Information  \nMay include: \n2.1 Workplace communication problems. \n2.2 Performance evaluation results. \n2.3 Team dynamics issues and concerns. \n2.4 Challenges on return of investment \n2.5 New tools, processes and procedures. \n2.6 New people in the organization. \n3. People who could \nprovide input \nMay include: \n3.1 Leaders \n3.2 Managers \n3.3 Specialists \n3.4 Associates \n3.5 Researchers \n3.6 Supervisors \n3.7 Staff \n3.8 Consultants (external) \n3.9 People outside the organization in the same field or \nsimilar expertise/industry \n3.10 Clients \n4. Critical inquiry method \nMay include: \n4.1 Preparation \n4.2 Discussion \n4.3 Clarification of goals \n4.4 Negotiate towards a Win-Win outcome \n4.5 Agreement \n4.6 Implementation of a course of action \n4.7 Effective verbal communication. See our pages: \nVerbal Communication and Effective Speaking \n4.8 Listening \n4.9 Reducing misunderstandings is a key part of effective \nnegotiation \n4.10 Rapport Building \n4.11 Problem Solving \n4.12 Decision Making \n4.13 Assertiveness \n4.14 Dealing with Difficult Situations\n\n--- PDF PAGE 25 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 21 \n \nVARIABLE \nRANGE \n5. Reporting skills \n \n \n \n \nMay include: \n5.1 Data management \n5.2 Coding \n5.3 Data analysis and interpretation \n5.4 Coherent writing \n5.5 Speaking \n5.6 Data gathering \n6. Current Issues and \nconcerns \n6.1 Miscommunication/communication problems \n6.2 Interpersonal conflicts \n6.3 Harassment or discrimination \n6.4 Performance issues \n6.5 Low motivation and job satisfaction \n6.6 Time management \n6.7 Ethical issues \n6.8 Bullying\n\n--- PDF PAGE 26 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 22 \n \n  EVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified opportunities to do things better. \n1.2 Discussed and developed ideas with others on \n       how to contribute to workplace innovation. \n1.3 Integrated ideas for change in the workplace. \n1.4 Analyzed and reported rooms for innovation and  \n       learning in the workplace. \n2.  Resource Implications \nThe following resources should be provided: \n2.1 Pens, papers and writing implements \n2.2 Cartolina \n2.3 Manila papers \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Psychological and behavioral Interviews \n3.2 Performance Evaluation \n3.3 Life Narrative Inquiry \n3.4 Review of portfolios of evidence and third-party    \nworkplace reports of on-the-job performance \n3.5 Sensitivity analysis \n3.6 Organizational analysis \n3.7 Standardized assessment of character strengths        \nand virtues applied \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the \nactual workplace or simulation environment in TESDA \naccredited institutions.\n",
