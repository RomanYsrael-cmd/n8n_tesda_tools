        "source_title": "APPLY QUALITY STANDARDS",
        "source_text": "--- PDF PAGE 50 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 46 \n \nUNIT OF COMPETENCY : APPLY QUALITY STANDARDS \n \n \n \nUNIT CODE \n: SOC514203 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes needed \nto apply quality standards in the workplace. The unit also \nincludes the application of relevant safety procedures and \nregulations, salon/organizational procedures and other \nclient requirement. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Assess \nclients \nservice \nneeds  \n2.1 Work instruction is \nobtained and work is \ncarried out in accordance \nwith standard operating \nprocedures \n2.2 Clients’ needs are \nchecked against \nworkplace standards and \nspecifications \n2.3 Faults on clients and any \nidentified causes are \nrecorded and/or reported \nto the supervisor \nconcerned in accordance \nwith workplace procedures \n1.4 Clients profile and service \nextended to them are \ndocumented in accordance \nwith workplace procedures \n1.1 Communication \nskills \n1.2 Client relation \n1.3 Salon services \n1.4 Documentation \nprocedures \n1.5 Handling of \ncomplaints \n1.1 Obtaining work \ninstruction and \ncarry out outwork \nin accordance with \nstandard operating \nprocedures \n1.2 Evaluating client \nneeds based on \nworkplace \nstandards and \nspecifications \n1.3 Analyzing salon \nservices against \nclients’ needs \n1.4 Explaining and \nconsulting salon \nservices with the \nclient \n1.5 Recording and/or \nreport faults on \nclients and any \nidentified causes \nto the supervisor \nconcerned in \naccordance with \nworkplace \nprocedures \n1.6 Documenting \nclient’s profile and \nservice extended \nto them in \naccordance with \nworkplace \nprocedures\n\n--- PDF PAGE 51 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 47 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Assess \nown work \n \n2.1 Documentation relative \nto quality within the \ncompany is identified and \nused \n2.2 Completed work is \nchecked against \nworkplace standards \nrelevant to the task \nundertaken \n2.3 Errors are identified and \nimproved on \n2.4 Information on the quality \nand other indicators of \nproduction performance is \nrecorded in accordance \nwith workplace \nprocedures \n2.5 Deviations from specified \nquality standards, \ncauses are documented \nand reported in \naccordance with the \nworkplace standards \noperating procedures \n \n2.1 Documentation \n2.2 Workplace quality \nstandards \n2.3 Feedback \n2.4 Self-assessment \nprocedures \n2.5 Job analysis \n2.1 Identifying and \nusing \ndocumentation \nrelative to quality \nwithin the \ncompany   \n2.2 Checking \ncompleted work \nagainst workplace \nstandards relevant \nto the tasks \nundertaken \n2.3 Identifying and \nimproving errors  \n2.4 Recording \ninformation on the \nquality and other \nindicators of \nindividual \nperformance in \naccordance with \nworkplace \nprocedures \n2.5 Documenting and \nreporting cases of \ndeviations from \nspecific quality \nstandards, causes \nin accordance with \nthe workplace \nstandards \noperating \nprocedures \n2.6 Collecting and \nanalyzing \nfeedback based on \nrequired quality \nstandards \n3. Engage in \nquality \nimprovement \n3.1 Process improvement \nprocedures are \nparticipated in relation to \nworkplace assignment \n3.2 Work is carried out in \naccordance with process \nimprovement procedures \n3.3 Performance of operation \nor quality of product or \nservice to ensure \ncustomer satisfaction is \nmonitored \n3.1 Service processes \nand procedures \n3.2 Client service \n3.3 Environmental \nregulations \n3.4 New trends and \