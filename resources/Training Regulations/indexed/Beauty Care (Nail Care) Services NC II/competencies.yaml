          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare \nworkstation \nand \nimplements  \n1.1 Appropriate disinfection \nand sterilization of \nequipment and tools for \nthe appointed nail service \nare carried out using \nregistered sterilant/EPA \nand hospital grade \ndisinfectants in \ncompliance with \napplicable laws and \ngovernment regulations \n1.2 Required supplies and \nmaterials are prepared  \n1.3 Workstation is cleaned, \ndisinfected and organized \nfollowing spa/salon \npolicies and procedures \n1.4 Personal Protective \nEquipment (PPE) is \nprovided following health \nand safety standards set \nby the spa/salon industry \n1.5 Proper personal and \nhand hygiene is observed \nwith knowledge of \ncommon \nmicroorganisms and \nprocess of infection \n1.6 Proper handling of \nequipment, tools, supplies \nand materials is \nimplemented to avoid \ncross-infection/cross-\n1.1 \nCode on \nSanitation of the \nPhilippines \n1.2 \nCode of Ethics \n1.3 \nDisinfection and \nSterilization \nProcesses \n1.4 \nSpa/Salon \nPolicies and \nProcedures \n1.5 \nApplicable laws \nand government \nregulations \n1.6 \nSpa/Salon \nEquipment, \nTools, Supplies \nand Materials  \n1.7 \nProduct \nknowledge \n1.8 \nBasic \nMathematics \n1.9 \nPPE requirement \n1.10 Common \nMicroorganisms \n1.11 Process of \nInfection \n1.12 Infection control \npractices \n1.13 Spa/salon \ndocumentation \nand records \nmanagement \n \n1.1 Complying with \nthe legal and \nindustry \nrequirements on \nspa/salon safety \nand sanitation \n1.2 Implementing \ndisinfection and \nsterilization \nprocesses \n1.3 Identifying and \npreparing \nrequired \nequipment, tools, \nsupplies and \nmaterials  \n1.4 Identifying and \npreparing nail \nproducts \n1.5 Interpreting \nmanufacturer’s \noperations \nmanual \n1.6 Organizing \nworkstation  \n1.7 Observing proper \npersonal and \nhand hygiene \n1.8 Handling \nequipment, tools, \nsupplies and \nmaterial properly\n\n--- PDF PAGE 61 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 57 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ncontamination within the \nworkplace \n1.7 Required documentation \ntools and materials are \nprepared in accordance \nwith spa/salon policies and \nprocedures \n1.9 \nIdentifying \ncommons \nmicroorganisms \n1.10 Understanding \nthe process of \ninfection \n1.11 Identifying \ndocumentation \nrequirements, \ntools and \nmaterials \n \n2.  Prepare the \nclient \n2.1 Client is properly seated \nwith safety and comfort \nensured throughout the \nentire service. \n2.2 Client is advised to remove \njewelries and \naccessories for safety and \nsanitation. \n2.3 Personal Protective \nEquipment (PPE) is \nhanded over to the client in \ncompliance with applicable \nlaws and government \nregulations. \n2.4 Appropriate Personal \nProtective Equipment \n(PPE) is worn following \nspa/salon policies and \nprocedures in accordance \nwith manufacturer’s \ninstructions.  \n2.5 If necessary, client’s vital \nsigns are taken using \nappropriate instruments \nto assess general health \nand capacity to receive \nspa/salon services.  \n2.6 Client’s nail structure, \nshape and condition are \nassessed and identified. \n2.7 Contraindicated nail \nconditions/disorders and \ndiseases that may restrict \nthe manicure or pedicure \nservice are identified and \nreferred to appropriate \nhealth care \nprofessionals.  \n2.1 \nCode of Ethics \n2.2 \nCustomer \nService \n2.3 \nClient Care \n2.4 \nCommunication \nand Basic Public \nRelations \n2.5 \nClient \nConsultation and \nDocumentation \nProcedures  \n2.6 \nSpa/Salon \nPolicies and \nProcedures, \n2.7 \nCode on \nSanitation of the \nPhilippines \n2.8 \nApplicable Laws \nand Government \nRegulations \n2.9 \nVital Signs and \nAppropriate \nInstruments \n2.10 Basic Nail \nAnatomy and \nPhysiology \n2.11 Common \nMicroorganisms \n2.12 Process of \nInfection \n2.13 Common Nail \nShapes \n2.14 Common Nail \nConditions \n2.15 Common Nail \nDisorders and \nDiseases \n2.1 Conversing and \nreceiving client \ncordially  \n2.2 Positioning and \nmaintaining client \nsafety and \ncomfort \n2.3 Performing client \ncare \n2.4 Wearing PPE \n2.5 Taking, \ninterpreting and \nrecording vital \nsigns \n2.6 Assessing nail \nstructure, shape \nand condition  \n2.7 Identifying \ncommon \nmicroorganisms \n2.8 Understanding \nprocess of \ninfection \n2.9 Identifying \ncommon nail \ndisorders and \ndiseases  \n2.10 Using \ndocumentation \ntools and \nmaterials \n2.11 Referring client to \nappropriate \nhealth care \nprofessionals \n2.12 Understanding \nclient needs and \npreferences\n\n--- PDF PAGE 62 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 58 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.8 Nail shapes, basic nail \ndesigns and available nail \npolish are presented for \nclient preference. \n2.16 Health Care \nProfessionals \nrelevant to \nSpa/Salon \nPractice \n2.17 Proper use of \nPersonal  \n          Protective  \n          Equipment (PPE) \n2.18 Body Positions \n2.19 Proper Posture \nand Body \nMechanics \n2.20 Basic Nail \nDesigns \n2.21 Product \nKnowledge \n2.13 Maintaining \nproper posture \nand body \nmechanics \n \n3.  Perform \nmanicure \nand \npedicure \n3.1 Client’s nails are cleansed \nand disinfected using the \nappropriate products.  \n3.2 Basic manicure and \npedicure procedures are \nperformed based on client \npreference, product usage \nspecifications and \nspa/salon policy. \n3.3 Accidental cuts/wounds are \ngiven immediate first-aid \nwhile serious cases are \nreferred to appropriate \nhealth professionals \nfollowing spa/salon policies \nand procedures. \n \n3.1 \nCode of Ethics \n3.2 \nCode on \nSanitation of the \nPhilippines \n3.3 \nApplicable Laws \nand Government \nRegulations \n3.4 \nTime \nmanagement \n3.5 \nCommunication \nand Basic Public \nRelations \n3.6 \nCustomer Service \n3.7 \nClient Care \n3.8 \nRequired \nEquipment, \nTools, Supplies \nand Materials \n3.9 \nNail Product \nKnowledge \n3.10 Basic Nail \nAnatomy and \nPhysiology \n3.11 Common \nMicroorganisms \n3.12 Process of \nInfection \n3.13 Common Nail \nShapes \n3.14 Common Nail \nConditions \n3.15 Basic \nMathematics \n3.1 \nMaintaining \neffective \ncommunication \nwith the client \n3.2 \nUnderstanding \nnon-verbal \ncommunication \n3.3 \nCleansing and \ndisinfecting \nnails \n3.4 \nMaintaining \nsafety and \nsanitation \n3.5 \nOperating and \nhandling \nequipment, \ntools supplies \nand materials \n3.6 \nApplying nail \nproducts  \n3.7 \nPerforming \nbasic manicure \nand pedicure \nprocedures \n3.8 \nInterpreting \nproduct usage \nspecifications \n3.9 \nApplying \nstandard first-\naid  \n3.10 Observing time \nmanagement\n\n--- PDF PAGE 63 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 59 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.16 Spa/Salon \nPolicies and \nProcedures \n3.17 Basic Manicure \nand Pedicure \nProcedures \n3.18 Standard First Aid \n3.19 Health Care \nProfessionals \nrelevant to \nSpa/Salon \nPractice \n3.20 Proper Posture \nand Body \nMechanics \n4. Create basic \nnail design  \n4.1 Basic nail design is created \nafter performing basic \nmanicure and pedicure \nprocedures in accordance \nwith client chosen design \nand color/s. \n4.2 Top or seal coat, and if \nnecessary, a quick-dry \nproduct is applied on each \npolished nail. \n4.3 Finished work is evaluated \nby the client based on the \npreferred shape, color and \ndesign. \n4.4 Necessary touch-ups as \nmay be required fo