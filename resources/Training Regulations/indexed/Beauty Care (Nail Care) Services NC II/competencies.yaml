          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Disinfected and sterilized equipment and tools using \nregistered sterilants/EPA and hospital grade \ndisinfectants in compliance with applicable laws and \ngovernment regulations. \n1.2 Prepared the required supplies and materials, and hand \nand foot massage products. \n1.3 Cleaned, disinfected and organized workstation following \nspa/salon policies and procedures. \n1.4 Provided Personal Protective Equipment (PPE) following \nhealth and safety standards set by the spa/salon \nindustry. \n1.5 Observed proper personal and hand hygiene. \n1.6 Implemented proper handling of equipment, tools, \nsupplies and materials to avoid cross-infections/cross-\ncontamination within the workplace. \n1.7 Properly seated the client and ensured safety and \ncomfort throughout the service. \n1.8 Advised the client to remove jewelries and accessories \nfor safety and sanitation. \n1.9 Took client’s vital signs using appropriate instruments. \n1.10 Assessed and identified hand and foot skin type and \ncondition. \n1.11 Identified common hand and foot conditions and \ncontraindicated disorders/diseases that may restrict \ntreatment and referred to appropriate health care \nprofessional. \n1.12 Cleaned and disinfected client’s hand and feet following \nspa/salon policies and procedures in compliance with \napplicable laws and government policies. \n1.13 Performed the established hand and foot spa \nprocedures.  \n1.14 Used sanitized equipment and tools following spa/salon \npolicies and procedures in accordance with \nmanufacturer’s instructions. \n1.15 Applied appropriate products following spa/salon policies \nand procedures in accordance with product usage \nspecifications. \n1.16 Gave immediate first aid to accidental cuts, wounds and \nabrasions following spa/salon policies and procedures. \n1.17 Performed basic hand and foot massage techniques \nusing appropriate or client preferred product. \n1.18 Properly removed excess traces of hand and foot \nmassage products. \n1.19 Applied a moisturizing product to the hands and feet. \n1.20 Advised client on proper hand and foot care \nmaintenance following spa/salon polies and procedures \nin accordance with applicable laws and government \nprocedures.\n\n--- PDF PAGE 84 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 80 \n \n1.21 Cleaned, disinfected/sterilized and stored equipment and \ntools following spa/salon procedures in accordance with \nmanufacturer’s instructions. \n1.22 Replenished and stored products, supplies and materials \nfollowing spa/salon policies and procedures in \naccordance with product usage specifications. \n1.23 Collected waste materials following proper waste \nmanagement and disposal procedures in compliance \nwith applicable laws and government regulations. \n1.24 Cleaned, disinfected and prepared workstation for the \nnext service. \n1.25 Performed proper documentation in accordance with \nspa/salon policies and procedures. \n8. Resource \nImplications \nThe following resources should be provided: \n2.1 Live Model \n2.2 Supplies and materials.  \n2.3 Actual or simulated work station  \n2.4 Tools and equipment \n2.5 Protective clothing and gadgets \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with oral questioning. \n3.2 Observation with oral questioning \n3.3 Portfolio  \n4. Context of \nAssessment \n4.2 Competency may be assessed in the workplace or \nTESDA    Accredited assessment center",
