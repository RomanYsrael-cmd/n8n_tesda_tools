        "source_text": "--- PDF PAGE 27 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 23 \n \nUNIT OF COMPETENCY : PRESENT RELEVANT INFORMATION \n \n \n \nUNIT CODE \n: 400311215 \n \n \n \nUNIT DESCRIPTOR \n: This unit of covers the knowledge, skills and attitudes \nrequired to present data/information appropriately. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Gather \ndata/ \ninformation \n1.1 Evidence, facts and \ninformation are collected \n1.2 Evaluation, terms of \nreference and \nconditions are reviewed \nto determine whether \ndata/information falls \nwithin project scope \n \n1.1 Organisational \nprotocols  \n1.2 Confidentiality \n1.3 Accuracy \n1.4 Business \nmathematics and \nstatistics \n1.5 Data analysis \ntechniques/procedu\nres \n1.6 Reporting \nrequirements to a \nrange of audiences \n1.7 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n1.8 Organisational \nvalues, ethics and \ncodes of conduct \n \n1.1 Describing \norganisational \nprotocols relating to \nclient liaison \n1.2 Protecting \nconfidentiality \n1.3 Describing \naccuracy \n1.4 Computing \nbusiness \nmathematics and \nstatistics \n1.5 Describing data \nanalysis \ntechniques/ \nprocedures \n1.6 Reporting \nrequirements to a \nrange of audiences \n1.7 Stating legislation, \npolicy and \nprocedures relating \nto the conduct of \nevaluations \n1.8 Stating \norganisational \nvalues, ethics and \ncodes of conduct\n\n--- PDF PAGE 28 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 24 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Assess \ngathered \ndata/ \ninformation \n2.1 Validity of data/ \ninformation is assessed \n2.2 Analysis techniques are \napplied to assess data/ \ninformation \n2.3 Trends and anomalies \nare identified \n2.4 Data analysis \ntechniques and \nprocedures are \ndocumented \n2.5 Recommendations are \nmade on areas of \npossible improvement \n \n \n2.1 Business \nmathematics and \nstatistics \n2.2 Data analysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \n2.1 Computing \nbusiness \nmathematics and \nstatistics \n2.2 Describing data \nanalysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Stating legislation, \npolicy and \nprocedures relating \nto the conduct of \nevaluations \n2.5 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n3. Record and \npresent \ninformation  \n3.1 Studied data/information \nare recorded \n3.2 Recommendations are \nanalysed for action to \nensure they are \ncompatible with the \nproject’s scope and terms \nof reference \n3.3 Interim and final reports \nare analysed and \noutcomes are compared \nto the criteria established \nat the outset \n3.4 Findings are presented to \nstakeholders \n \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n \n3.1 Describing data \nanalysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Stating legislation, \npolicy and \nprocedures relating \nto the conduct of \nevaluations \n3.4 Stating \norganisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 29 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 