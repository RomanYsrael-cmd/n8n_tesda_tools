ed to \nachieve or maintain \nagreed standards \n2.4 Standard of work clarified \nand agreed according to \nemployer policy and \nprocedures \n2.1 Monitoring personal \nperformance \n2.2 Determining \nperformance \nstandards \n2.3 Interpreting work \nstandards \n2.4 Quality of work \n2.1 Monitoring \npersonal \nperformance \ncontinually against \nagreed \nperformance \nstandards \n2.2 Seeking advice \nand guidance \nwhen necessary \nto achieve or \nmaintain agreed \nstandards \n2.3 Applying guidance \nfrom management \nto achieve or \nmaintain agreed \nstandards \n2.4 Clarifying and \nagreeing on\n\n--- PDF PAGE 47 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 43 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nstandard of work \naccording to \nemployer policy \nand procedures \n3.Build \ncredibility \nwith \ncustomers/ \nclients \n3.1 Client expectations for \nreliability, punctuality and \nappearance adhered to \n3.2 Possible causes of \nclient/customer \ndissatisfaction identified, \ndealt with recorded \naccording to employer \npolicy \n3.3 Client fully informed of all \nrelevant security matters \nin a timely manner \n \n3.1 Interpersonal skills \n3.2 Customer service \nskills \n3.3 Telephone \netiquette \n3.4 Maintaining \nrecords  \n3.1 Adhering to client \nexpectations for \nreliability, \npunctuality and \nappearance  \n3.2 Identifying, \nattending with and \nrecording possible \ncauses of \nclient/customer \ndissatisfaction \naccording to \nemployer policy \n3.3 Informing client of \nall relevant \nsecurity matters in \na timely manner \nand according to \nagreed reporting \nprocedures\n\n--- PDF PAGE 48 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 44 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tasks \n \n \n1.1