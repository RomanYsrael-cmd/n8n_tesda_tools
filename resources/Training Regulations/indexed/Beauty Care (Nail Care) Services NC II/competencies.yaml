        "source_title": "PERFORM HAND AND FOOT SPA",
        "source_text": "--- PDF PAGE 75 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 71 \n \nUNIT OF COMPETENCY : PERFORM HAND AND FOOT SPA \n \n \n \nUNIT CODE \n: SOC514312 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitude in \nperforming spa for hand and feet.  It also involves preparing, \nconsulting the client and analyzing skin, hand and feet \nconditions and diseases, performing hand and foot spa \nprocedures and performing post service activities. It includes \npracticing proper and ethical behavior at all times in \naccordance with the code of ethics. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare \nworkstation \nand \nimplements \n1.1 Appropriate disinfection \nand sterilization of \nequipment and tools are \ncarried out using registered \nsterilants/EPA and hospital \ngrade disinfectants in \ncompliance with applicable \nlaws and government \nregulations. \n1.2 Required supplies and \nmaterials, and hand and \nfoot massage products \nare prepared.  \n1.3 Workstation is cleaned, \ndisinfected and organized \nfollowing spa/salon policies \nand procedures. \n1.4 Personal Protective \nEquipment (PPE) is \nprovided following health \nand safety standards set \nby the spa/salon industry. \n1.5 Proper personal and hand \nhygiene is observed with \nknowledge of common \nmicroorganisms and \nprocess of infection. \n1.6 Proper handling of \nequipment, tools, supplies \nand materials is \nimplemented to avoid \ncross-infection/cross-\ncontamination within the \nwork place. \n1.7 Required documentation \ntools and materials are \nprepared in accordance \n1.1 \nCode on \nSanitation of the \nPhilippines \n1.2 \nCode of Ethics \n1.3 \nDisinfection and \nSterilization \nProcesses \n1.4 \nSpa/Salon \nPolicies and \nProcedures \n1.5 \nApplicable laws \nand government \nregulations \n1.6 \nSpa/Salon \nEquipment, \nTools, Supplies \nand Materials  \n1.7 \nProduct \nknowledge \n1.8 \nBasic \nMathematics \n1.9 \nPPE requirement \n1.10 Common \nMicroorganisms \n1.11 Process of \nInfection \n1.12 Infection control \npractices \n1.13 Spa/salon \ndocumentation \nand records \nmanagement \n \n1.1 Complying with \nthe legal and \nindustry \nrequirements on \nspa/salon safety \nand sanitation \n1.2 Implementing \ndisinfection \nprocess \n1.3 Identifying and \npreparing \nrequired \nequipment, \ntools, supplies \nand materials  \n1.4 Identifying and \npreparing nail \nproducts \n1.5 Interpreting \nmanufacturer’s \noperations \nmanual \n1.6 Organizing \nworkstation  \n1.7 Observing \nproper personal \nand hand \nhygiene \n1.8 Identifying \ncommon \nmicroorganisms \n1.9 Understanding \nthe process of \ninfection  \n1.10 Handling \nequipment, \ntools, supplies\n\n--- PDF PAGE 76 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 72 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nwith spa/salon policies and \nprocedures. \n \nand material \nproperly \n1.11 Identifying \ndocumentation \nrequirements, \ntools and \nmaterials \n2. Prepare the   \n    Client \n2.1 Client is properly seated \nwith safety and comfort \nensured throughout the \nentire service. \n2.2 Client is advised to \nremove jewelries and \naccessories for safety \nand sanitation. \n2.3 Personal Protective \nEquipment (PPE) is \nhanded over to the client \nin compliance with \napplicable laws and \ngovernment regulations \n2.4 Appropriate Personal \nProtective Equipment \n(PPE) is worn following \nspa/salon policies and \nprocedures in accordance \nwith manufacturer’s \ninstructions. \n2.5 If necessary, client’s vital \nsigns are taken using \nappropriate instruments \nto assess general health \nand capacity to receive \nspa/salon services.  \n2.6 Hand and foot skin type \nand conditions are \nassessed and identified \nfollowing spa/salon \npolicies and procedures \nin accordance with \napplicable laws and \ngovernment regulations. \n2.7 Common hand and foot \nconditions and \ncontraindicated \ndisorders/diseases that \nmay restrict treatment are \nidentified and referred to \nappropriate health care \nprofessionals in \n2.1 Code of Ethics \n2.2 Customer Service \n2.3 Client Care \n2.4 Communication \nand Basic Public \nRelations \n2.5 Client \nConsultation and \nDocumentation \nProcedures  \n2.6 Spa/Salon \nPolicies and \nProcedures, \n2.7 Code on \nSanitation of the \nPhilippines \n2.8 Applicable Laws \nand Government \nRegulations \n2.9 Vital Signs and \nAppropriate \nInstruments \n2.10 Hand and Foot \nSkin Types and \nConditions  \n2.11 Basic Hand and \nFoot Anatomy \nand Physiology \n2.12 Common Hand \nand Foot \nConditions, \nDisorders/ \nDiseases \n2.13 Common \nMicroorganisms \n2.14 Process of \nInfection \n2.15 Health Care \nProfessionals \nrelevant to \nSpa/Salon \nPractice \n2.1 Conversing and \nreceiving client \ncordially  \n2.2 Positioning and \nmaintaining \nclient safety and \ncomfort \n2.3 Performing client \ncare \n2.4 Wearing PPE \n2.5 Taking, \ninterpreting and \nrecording vital \nsigns \n2.6 Assessing hand \nand foot skin \ntype and \ncondition  \n2.7 Identifying \ncommon hand \nand foot \nconditions  \n2.8 Identifying \ncontraindicated \nhand and foot \ndisorders/diseas\nes \n2.9 Using \ndocumentation \ntools and \nmaterials \n2.10 Referring client \nto appropriate \nhealth care \nprofessionals \n2.11 Understanding \nclient needs and \npreferences \n2.12 Maintaining \nproper posture \nand body \nmechanics\n\n--- PDF PAGE 77 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 73 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccordance with \napplicable laws and \ngovernment regulations. \n \n2.16 Proper use of \nPersonal \nProtective \nEquipment (PPE) \n2.17 Body Positions \n2.18 Proper Posture \nand Body \nMechanics \n3.   Perform \nhand and \nfoot spa \ntreatments  \n3.1 Client’s hands and feet \nare cleaned and \ndisinfected following \nspa/salon policies and \nprocedures in compliance \nwith applicable laws and \ngovernment regulations.  \n3.2 Established hand and \nfoot spa procedures are \nperformed. \n3.3 Sanitized equipment and \ntools are used following \nspa/salon policies and \nprocedures in accordance \nwith manufacturer’s \ninstruction. \n3.4 Appropriate products are \napplied following \nspa/salon policies and \nprocedures in accordance \nwith product usage \nspecifications.  \n3.5 Accidental cuts, wounds \nor abrasions are given \nimmediate first-aid \nfollowing spa/salon \npolicies and procedures. \n \n3.1 \nCode of Ethics \n3.2 \nCode on \nSanitation of the \nPhilippines \n3.3 \nApplicable Laws \nand Government \nRegulations \n3.4 \nHand and Foot \nSpa Treatment \nProcedures \n3.5 \nTime \nmanagement \n3.6 \nCommunication \nand Basic Public \nRelations \n3.7 \nCustomer Service \n3.8 \nClient Care \n3.9 \nRequired \nEquipment, \nTools, Supplies \nand Materials \n3.10 Product \nKnowledge \n3.11 Basic Hand and \nFoot Anatomy \nand Physiology \n3.12 Common \nMicroorganisms \n3.13 Process of \nInfection \n3.14 Basic \nMathematics \n3.15 Spa/Salon \nPolicies and \nProcedures \n3.16 Standard First Aid \n3.17 Proper Posture \nand Body \nMechanics \n3.1 Maintaining \neffective \ncommunication \nwith the client \n3.2 Understanding \nnon-verbal \ncommunication \n3.3 Performing \nestablished \nhand and foot \nspa procedures \n3.4 Maintaining \nsafety and \nsanitation \n3.5 Operating and \nhandling \nequipment, \ntools, supplies \nand materials \n3.6 Applying hand \nand foot spa \nproducts  \n3.7 Interpreting \nproduct usage \nspecifications \n3.8 Applying \nstandard first-aid  \n3.9 Observing time \nmanagement  \n4. Perform \nbasic hand \nand foot \nmassage  \n4.1 Basic hand and foot \nmassage techniques \nare performed using \n4.1 Code of Ethics \n4.1 Performing basic \nhand and foot\n\n--- PDF PAGE 78 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 74 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nappropriate or client \npreferred product. \n4.2 Excess traces of hand \nand foot massage \nproducts are properly \nremoved. \n4.3 A moisturizing product \nis applied to the hands \nand feet. \n \n4.2 Code on \nSanitation of the \nPhilippines \n4.3 Applicable Laws \nand Government \nRegulations \n4.4 Time \nmanagement \n4.5 Communication \nand Basic Public \nRelations \n4.6 Customer Service \n4.7 Client Care \n4.8 Required \nEquipment, \nTools, Supplies \nand Materials \n4.9 Product \nKnowledge \n4.10 Basic Hand and \nFoot Anatomy \nand Physiology \n4.11 Common \nMicroorganisms \n4.12 Process of \nInfection \n4.13 Basic \nMathematics \n4.14 Spa/Salon \nPolicies and \nProcedures \n4.15 Basic Hand and \nFoot Massage \nTechniques \n4.16 Standard First Aid \n4.17 Proper Posture \nand Body \nMechanics \nmassage \ntechniques \n4.2 Maintaining \nsafety and \nsanitation \n4.3 Applying hand \nand foot \nmassage \nproducts  \n \n5. Perform \npost-service \nactivities \n4.1 Client is advised on \nproper hand and foot \ncare maintenance \nfollowing spa/salon \npolicies and procedures \nin accordance with \napplicable laws and \ngovernment regulations. \n4.2 Equipment and tools are \ncleaned, \ndisinfected/sterilized and \nstored following spa/salon \n5.1 \nCode of Ethics \n5.2 \nTime \nmanagement \n5.3 \nCommunication \nand Basic Public \nRelations \n5.4 \nCustomer Service \n5.5 \nHand and Foot \nCare \n5.6 \nProduct \nKnowledge \n5.1 Advising client on \nproper hand and \nfoot care  \n5.2 Cleaning, \ndisinfecting/sterili\nzing and storing \nequipment and \ntools \n5.3 Replenishing and \nstoring products, \nsupplies and \nmaterials\n\n--- PDF PAGE 79 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 75 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \npolicies and procedures \nin accordance with \nmanufacturer’s \ninstructions. \n4.3 Products, supplies and \nmaterials are replenished \nand stored following \nspa/salon policies and \nprocedures in accordance \nwith product usage \nspecifications. \n4.4 Waste materials are \ncollected following proper \nwaste management and \ndisposal in compliance \nwith applicable laws and \ngovernment regulations. \n4.5 Workstation is cleaned, \ndisinfected and prepared \nfor the next activity \nfollowing spa/salon \npolicies and procedures. \n4.6 Proper documentation is \nperformed in accordance \nwith spa/salon policies \nand procedures. \n \n5.7 \nBasic Hand and \nFoot Anatomy \nand Physiology \n5.8 \nCommon \nMicroorganisms \n5.9 \nProcess of \nInfection \n5.10 Basic \nMathematics \n5.11 Equipment, \nTools, Supplies \nand Materials \nStorage \n5.12 Disinfection and \nSterilization \nProcesses \n5.13 Code on \nSanitation of the \nPhilippines \n5.14 Applicable Laws \nand Government \nRegulations \n5.15 Spa/Salon \nPolicies and \nProcedures \n5.16 Waste \nManagement and \nDisposal \n5.17 Spa/Salon \nDocumentation \nand Records \nManagement \n5.4 Implementing \nproper waste \nmanagement and \ndisposal  \n5.5 Cleaning, \ndisinfecting and \norganizing \nworkstation \n5.6 Managing \nrecords\n\n--- PDF PAGE 80 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 76 \n \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Equipment and Tools \nMay include: \n1.1 Equipment \n1.1.1 Nail /Service table \n1.1.2 Stool \n1.1.3 Small hand basin  \n1.1.4 Foot tub or basin \n1.1.5 Hand spa machine \n1.1.6 Foot spa machine \n1.2 Tools \n1.2.1 Pumice stone \n1.2.2 Foot file \n2. Supplies and \nMaterials \nMay include:   \n2.1 Soap  \n2.2 Hand and foot scrub product \n2.3 Oil \n2.4 Liniments \n2.5 Aromatherapy \n2.6 Mask   \n2.6.1 Seaweeds \n2.6.2 Organics \n2.7 Cling wrap \n2.8 Alcohol \n2.9 Mittens  \n2.10 Disposable gloves (latex) \n2.11 Hand towel \n2.12 Callus remover \n2.13 Foot scrub \n2.14 Exfoliating gloves \n3. Hand and Foot \nMassage Products \nMay include: \n3.1 Hand and Body lotion \n3.2 Base oils  \n3.2.1 Olive oil \n3.2.2 Virgin coconut oil \n3.2.3 Grape seed oil  \n3.2.4 Mineral oil  \n3.3 Base oils with Essential oils  \n3.3.1 Lavender essential oil \n3.3.2 Peppermint essential oil \n3.3.3 Eucalyptus essential oil  \n3.3.4 Lemon essential oil \n3.4 Massage gels \n3.5 Medicated lotions and oils \n4. Hand and Foot Skin \nTypes and Conditions \nMay include: \n4.1 Skin Types \n4.1.1 Normal  \n4.1.2 Oily \n4.1.3 Dry  \n4.1.4 Combination\n\n--- PDF PAGE 81 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 77 \n \nVARIABLE \nRANGE \n4.1.5 Sensitive \n4.2 Skin Conditions \n4.2.1 Sensitive \n4.2.2 Rough  \n4.2.3 Dry/dehydrated \n4.2.4 Flaky  \n5. Common Hand and \nFoot Conditions \nMay include: \n5.1 Corns and calluses \n5.2 Ingrown \n5.3 Cuts/abrasions/wounds \n5.4 Warts \n5.5 Bunions \n5.6 Gout \n5.7 Blisters \n5.8 Localized/mild eczema/dermatitis \n5.9 Psoriasis \n6. Contraindicated Hand \nand Foot \nDisorders/Diseases \nMay include: \n6.1 Contagious skin diseases  \n6.1.1 Impetigo \n6.1.2 Scabies,  \n6.1.3 Chicken pox \n6.1.4 Severe warts \n6.2 Open skin, cuts, wounds, grazes \n6.3 Acute hematomas or bruises \n6.4 Recent fractures \n6.5 Severe psoriasis or eczema \n6.6 Untreated/undiagnosed medical conditions \n6.6.1 Acute pain \n6.6.2 Swelling \n6.6.3 Fever \n6.7 Severe varicose veins \n6.8 Active gout \n6.9 Infectious diseases \n6.9.1 \nBacterial \n6.9.2 \nFungal \n7. Hand and Foot Spa \nProcedures \nMay include: \n7.1 Hand Spa \n7.1.1 Soak client’s hands into the hand spa machine / \nbasin filled with warm water and appropriate \nproduct for 5 to 10 minutes or establishment \nstandard timeframe. \n7.1.2 Perform hand exfoliation using appropriate \nsupplies, materials and products.  \n7.1.3 Rinse or dry hands with clean towel. \n7.1.4 Apply hand mask and wrap with plastic wrap \nfollowed by gloves/mittens. Leave it on for 10 to \n15 minutes or establishment standard timeframe. \n7.1.5 Remove wrap, rinse in warm water and dry hands \nwith clean towel. \n7.1.6 Perform basic hand massage techniques using \nappropriate product.\n\n--- PDF PAGE 82 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 78 \n \nVARIABLE \nRANGE \n7.1.7 Remove product residues from hands with a clean \nand dry towel. \n7.1.8 Apply a moisturizing product. \n7.2 Foot Spa \n7.2.1 Soak client’s feet into the foot spa machine / basin \nfilled with warm water and appropriate product for \n10 to 15 minutes or establishment standard \ntimeframe. \n7.2.2 Apply an appropriate product and scrub feet using \nthe appropriate tools giving more emphasis on \nproblem areas, such as with calluses and dry skin.  \n7.2.3 Rinse feet in warm water to remove product \nresidues and dry with clean towel. \n7.2.4 Apply foot mask and wrap with plastic wrap \nfollowed by gloves/mittens. Leave it on for 10 to \n15 minutes or establishment standard timeframe. \n7.2.5 Remove wraps and rinse feet with warm water. \nDry feet using a clean and dry towel.  \n7.2.6 Perform basic foot massage using appropriate \nproduct. \n7.2.7 Remove all product residues from the feet with a \nclean and dry towel. \n7.2.8 Apply a moisturizing product. \n8. Basic Hand and Foot \nMassage Techniques \nMay include: \n8.1 Variations of Effleurage  \n8.2 Variations of Petrissage/Kneading  \n8.3 Variations of Friction technique \n8.4 Variations of Vibration technique \n8.5 Applicable variations of Tapotement \n8.6 Stretching and joint mobilization techniques \n8.7 Established hand and foot massage sequence \n9. Moisturizing Product \nMay include: \n9.1 Hand and body lotion \n9.2 Hydrating cream \n9.3 Non-mineral oil \n10. Hand and Foot Care \nMaintenance \nMay include: \n10.1 Hand Care \n10.1.1 Wearing gloves to protect hands from chemical \nexposure and accidents in performing activities \n10.1.2 Use of mild/gentle soap in washing hands \n10.1.3 Regular use of moisturizer \n10.1.4 Regular hand massage \n10.2 Foot Care \n10.2.1 Using properly fitting footwear \n10.2.2 Using appropriate footwear for the activity \n10.2.3 Avoid walking barefoot outdoors \n10.2.4 Regular use of moisturizer \n10.2.5 Regular foot massage\n\n--- PDF PAGE 83 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 79 \n \n EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Disinfected and sterilized equipment and tools using \nregistered sterilants/EPA and hospital grade \ndisinfectants in compliance with applicable laws and \ngovernment regulations. \n1.2 Prepared the required supplies and materials, and hand \nand foot massage products. \n1.3 Cleaned, disinfected and organized workstation following \nspa/salon policies and procedures. \n1.4 Provided Personal Protective Equipment (PPE) following \nhealth and safety standards set by the spa/salon \nindustry. \n1.5 Observed proper personal and hand hygiene. \n1.6 Implemented proper handling of equipment, tools, \nsupplies and materials to avoid cross-infections/cross-\ncontamination within the workplace. \n1.7 Properly seated the client and ensured safety and \ncomfort throughout the service. \n1.8 Advised the client to remove jewelries and accessories \nfor safety and sanitation. \n1.9 Took client’s vital signs using appropriate instruments. \n1.10 Assessed and identified hand and foot skin type and \ncondition. \n1.11 Identified common hand and foot conditions and \ncontraindicated disorders/diseases that may restrict \ntreatment and referred to appropriate health care \nprofessional. \n1.12 Cleaned and disinfected client’s hand and feet following \nspa/salon policies and procedures in compliance with \napplicable laws and government policies. \n1.13 Performed the established hand and foot spa \nprocedures.  \n1.14 Used sanitized equipment and tools following spa/salon \npolicies and procedures in accordance with \nmanufacturer’s instructions. \n1.15 Applied appropriate products following spa/salon policies \nand procedures in accordance with product usage \nspecifications. \n1.16 Gave immediate first aid to accidental cuts, wounds and \nabrasions following spa/salon policies and procedures. \n1.17 Performed basic hand and foot massage techniques \nusing appropriate or client preferred product. \n1.18 Properly removed excess traces of hand and foot \nmassage products. \n1.19 Applied a moisturizing product to the hands and feet. \n1.20 Advised client on proper hand and foot care \nmaintenance following spa/salon polies and procedures \nin accordance with applicable laws and government \nprocedures.\n\n--- PDF PAGE 84 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 80 \n \n1.21 Cleaned, disinfected/sterilized and stored equipment and \ntools following spa/salon procedures in accordance with \nmanufacturer’s instructions. \n1.22 Replenished and stored products, supplies and materials \nfollowing spa/salon policies and procedures in \naccordance with product usage specifications. \n1.23 Collected waste materials following proper waste \nmanagement and disposal procedures in compliance \nwith applicable laws and government regulations. \n1.24 Cleaned, disinfected and prepared workstation for the \nnext service. \n1.25 Performed proper documentation in accordance with \nspa/salon policies and procedures. \n8. Resource \nImplications \nThe following resources should be provided: \n2.1 Live Model \n2.2 Supplies and materials.  \n2.3 Actual or simulated work station  \n2.4 Tools and equipment \n2.5 Protective clothing and gadgets \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with oral questioning. \n3.2 Observation with oral questioning \n3.3 Portfolio  \n4. Context of \nAssessment \n4.2 Competency may be assessed in the workplace or \nTESDA    Accredited assessment center\n",
