        "source_title": "WORK IN A TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 11 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 7 \n \nUNIT OF COMPETENCY : WORK IN A TEAM ENVIRONMENT \n \n \n \nUNIT CODE \n: 400311211 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the skills, knowledge and attitudes to identify \none’s roles and responsibilities as a member of a team. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Describe \nteam role \nand scope \n1.1 The role and objective of \nthe team is identified from \navailable sources of \ninformation \n1.2 Team parameters, \nreporting relationships and \nresponsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources  \n1.1 Group structure \n1.2 Group \ndevelopment \n1.3 Sources of \ninformation \n1.1 Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n1.2 Developing ways \nin improving work \nstructure and \nperforming \nrespective roles in \nthe group or \norganization \n2 Identify one’s \nrole and \nresponsibility \nwithin a team \n2.1 Individual roles and \nresponsibilities within the \nteam environment are \nidentified \n2.2 Roles and objectives of the \nteam is identified from \navailable sources of \ninformation            \n2.3 Team parameters, \nreporting relationships and \nresponsibilities are \nidentified based on team \ndiscussions and \nappropriate external \nsources \n2.1 Team roles and \nobjectives  \n2.2 Team structure and \nparameters \n2.3 Team development \n2.4 Sources of \ninformation \n \n2.1 Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n2.2 Developing ways \nin improving work \nstructure and \nperforming \nrespective roles in \nthe group or \norganization \n \n3.   Work as a   \nteam \nmember \n3.1 Effective and appropriate \nforms of communications \nare used and interactions \nundertaken with team \nmembers based on \ncompany practices  \n3.2 Effective and appropriate \ncontributions made to \ncomplement team activities \nand objectives, based on \nworkplace context \n3.3 Protocols in reporting are \nobserved based on \n3.1 Communication \nProcess \n3.2 Workplace \ncommunication \nprotocol \n3.3 Team planning and \ndecision making \n3.4 Team thinking \n3.5 Team roles \n3.6 Process of team \ndevelopment \n3.7 Workplace context \n \n \n3.1 Communicating \nappropriately, \nconsistent with the \nculture of the \nworkplace \n3.2 Interacting \neffectively with \nothers \n3.3 Deciding as an \nindividual and as a \ngroup using group \nthink strategies \nand techniques\n\n--- PDF PAGE 12 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 8 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nstandard company \npractices \n3.4 Contribute to the \ndevelopment of team work \nplans based on an \nunderstanding of team’s \nrole and objectives \n \n3.4 Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 13 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 9 \n \n  RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Role and objective \nof team  \nMay include: \n1.1 \nWork activities in a team environment with enterprise \nor specific sector \n1.2 \nLimited discretion, initiative and judgment maybe \ndemonstrated on the job, either individually or in a \nteam environment \n2. Sources of \ninformation \nMay include: \n2.1 \nStandard operating and/or other workplace \nprocedures \n2.2 \nJob procedures \n2.3 \nMachine/equipment manufacturer’s specifications \nand instructions \n2.4 \nOrganizational or external personnel \n2.5 \nClient/supplier instructions \n2.6 \nQuality standards \n2.7 \nOHS and environmental standards \n3. Workplace context \nMay include: \n3.1 \nWork procedures and practices \n3.2 \nConditions of work environments \n3.3 \nLegislation and industrial agreements \n3.4 \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5 \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 14 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 10 \n \n   EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Worked in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2.   Materials relevant to the proposed activity or tasks \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nRole play involving the participation of individual member \nto the attainment of organizational goal \n3.2    Case studies and scenarios as a basis for discussion of \nissues and strategies in teamwork \n3.3    Socio-drama and socio-metric methods \n3.4    Sensitivity techniques \n3.5    Written Test \n4. Context for \nAssessment \n4.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 \nAssessment shall be observed while task is being \nundertaken whether individually or in group\n",
