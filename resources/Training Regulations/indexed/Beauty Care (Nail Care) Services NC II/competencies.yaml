quirements \nMay include: \n3.1 Assignment instructions (e.g. right products) \n3.2 Post Orders \n3.3 Scope to modify instructions/orders in light of \nchanged situations \n4. \nAssignment \nInstructions \nMay include: \n4.1  Writing \n4.2  Verbally \n4.3  Electronically \n5. Client’s Needs \nMay include: \n5.1 Review of the client brief and/or assignment \ninstructions \n5.2 Discussion with the client \n6. Appropriate Action \nTaken \n \nMay include: \n6.1  Implementing required changes \n6.2  Referral to appropriate employer personnel \n6.3  Clarification of client needs and instructions \n7. \nClients \nMay include: \n7.1    All members of the public\n\n--- PDF PAGE 45 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 41 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 Maintained a professional image. \n1.2 Interpreted client requirements from information \ncontained in the client brief and/or assignment \ninstructions. \n1.3 Dealt successfully with a variety of client interactions. \n1.4 Monitored and acted on varying client needs. \n1.5 Met client requirements. \n1.6 Built credibility with customers/clients \n2. Resource \nImplications \n \nThe following resources should be provided: \n4.1 Assessment centers/venues \n4.2 Accredited assessors \n4.3 Evaluation reports \n4.4 Access to a relevant venue, equipment and materials \n4.5 Assignment instructions \n4.6 Logbooks \n4.7 Operational manuals and customers’ instructions (if \nrelevant) \n4.8 Assessment Instruments, including personal planner \nand assessment record book \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n4.1 Written Test/Examination \n4.2 Demonstration with questioning \n4.3 Observation \n4. Context of \nAssessment \n \n4.1   Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n",
