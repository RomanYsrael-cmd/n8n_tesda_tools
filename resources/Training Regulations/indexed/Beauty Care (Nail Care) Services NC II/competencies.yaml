  "source_section_text": "Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals\nwho were assessed as competent in cluster of related units of competency,\nnamely:\n\n COC 1 Provide manicure and pedicure services\n• Perform manicure and pedicure\n\n COC 2 Provide hand and foot spa services\n• Perform hand and foot spa\n\n Upon accumulation and submission of all the COCs acquired, an\nindividual shall be issued the corresponding National Certificate for the\nQualification.\n\n4.1.3 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to undergo assessment and certification:\n\n4.1.4.1\nGraduates of WTR-registered program, NTR-registered programs\nor formal/non-formal/informal including enterprise-based trainings\nrelated to BEAUTY CARE (NAIL CARE) SERVICES NC II.\n\n4.1.4.2\nExperienced workers (wage employed or self-employed) who\ngained competencies in providing nail care services for at least\ntwo (2) years within the last five (5) years.\n\n--- PDF PAGE 134 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 130\n\n4.1.5\nRecognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of nail care services experience\nwithin the last five (5) years may apply for recognition in this Qualification\nthrough Portfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must\nbe consistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System.\n\n4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC)\nin Beauty Care (Nail Care) Services NC II are required to undergo re-\nassessment under the amended Training Regulations (TRs), upon\nexpiration of their Certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in\nthe “Procedures Manual on Assessment and Certification” and “Guidelines\non the Implementation of the “Philippine TVET Competency Assessment\nand Certification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 135 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 131\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nteam\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career\nand life\ndecisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health\npolicies and\nprocedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying learning\nand innovation in\nthe organization\nUse information\nsystematically\nEvaluate occupational\nsafety and health\nwork practices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\nUtilize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice of\nsocial justice in\nthe workplace\nManage\ninnovative work\ninstructions\nManage and\nevaluate usage\nof information\nLead in improvement\nof Occupational\nSafety and Health\nProgram, Policies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork procedures\nDevelop\nsystems in\nmanaging and\nmaintaining\ninformation\nManage\nimplementation of\noccupational safety\nand health programs\nin the workplace\nManage\nimplementation of\nenvironmental\nprograms in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nMaintain an\neffective\nrelationship with\nclients/customers\nManage own\nperformance\nApply quality\nstandards\nMaintain a safe, clean\nand efficient\nenvironment\nCOMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR\nBEAUTY CARE (NAIL CARE) SERVICES NC II\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 136 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 132\n\nPerform facial\ncleansing\nPerform temporary\nhair removal activity\nPerform body\nscrub\nPerform pre and\npost hair care\nactivities\nPerform hair and\nscalp treatment\nPerform basic\nhair coloring\nPerform basic\nhair bleaching\nPerform basic\nhair perming\nPerform hair\nstraightening\nPerform basic\nhaircutting\nPerform advanced\nand creative\nhaircutting\nPerform\nadvanced and\ncreative hair\ncoloring\nPerform advanced\nand creative hair\nperming\nPerform basic\nmen’s\nhaircutting\nPerform shave\nand style beard\nand mustache\nPerform chair\nmanipulative\nrelaxing services\nPerform\nmanicure and\npedicure\nPerform hand\nand foot spa\nPerform\npreparatory\nactivities\nPrepare appropriate\nproducts, tools and\nequipment\nPerform nail\nenhancement\ntechnology\nprocedures\nPerform post\nservice activities\nPerform\nadvanced nail\npolish\nprocedures\nApply facial\nmake-up\nPerform body\nbleach\n\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 137 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 133\n\nGLOSSARY OF TERMS\n\nCALLUS\n-\npatch of thickened skin: a hard-thickened area of skin, especially on\nthe palm of the hand or the sole of the foot caused by repeated\npressure or friction.\nCOSMETICS\n-\nmeans any substance or preparation intended to be placed in\ncontact with the various external parts of the human body.\nCUTICLE\n-\nskin at base of nails: an edge of hard skin at the base of a fingernails\nor toenails.\nECOLOGICAL\nSOLID WASTE\nMATERIALS\n-\nshall refer to the systematic administration of activities which provide\nfor segregations at source, segregated transportation, storage,\ntransfer, processing, treatment, and disposal of solid waste and all\nother waste management activities which do not harm the\nenvironment.\nETHICS\n-\nstudy of morality’s effect on conduct: the study of moral standards\nand how they affect conduct.\nEXPIRY OR\nEXPIRATION\nDATE\n-\nmeans the date stated in the label of a drug or device after which the\ndrug is not expected to retain its claimed safety, efficacy and quality\nor potency or after which it is not permissible to sell the drug or device\n(As amended by E.O. 175)\nFIRST AID -\nmeans immediate assistance given in case of injury until Medical aid\nhas been obtained\nFREE EDGE\n-\nthe part of the nail that extends beyond the fingertips\nHAZARDOUS\n-\nmeans likely to cause harm or injury in certain circumstances\nHAZARDOUS\nWASTE\n-\nshall refer to solid or combination of solid waste which because of its\nquantity, concentration, or physical, chemical or infectious\ncharacteristics may cause, or significantly contribute to an increase\nin mortality or an increase in serious irreversible, or incapacitating\nreversible, illness; or pose a substantial present or potential hazard\nto human health or the environment when improperly treated, stored,\ntransported, or disposed of, or otherwise managed.\nHYGIENE\n-\npreservation of health: the science dealing with the preservation of\nhealth.\nINFECTIOUS\n-\ncommunicable: describes a disease that is capable of being passed\nfrom one person to another\nLABEL\n-\nmeans a display of written, printed, or graphic matter on the\nimmediate container, or to other materials affixed thereto, of any\narticle, Any word, statement or other information appearing on the\nlabel required under authority of the FDA Act of 2009 or other\nrelevant laws shall be deemed and complied with if such word,\nstatement or other information also appears on the outside container\nor wrapper, if any there be, of the retail package of such article, or\neasily legible through the outside container or wrapper.\nLUNULA\n-\nsemicircular mark: a semicircular mark, specially the white Crescent-\nshaped area at the base of the fingernails.\nMANICURE\n-\nhand and nail cosmetics treatment: a cosmetic treatment for the\nhands and nails that usually involves shaping and polishing the\nfingernails, pushing back the cuticles, and treating rough skin.\nMISBRANDING\n-\nmeans, in addition to definitions provided in the Foods, Drugs and\nDevices, and Cosmetics Act and in other relevant laws, giving\n\n--- PDF PAGE 138 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 134\n\nunsubstantial claims, misinformation or misleading information on the\nlabel or other information materials, including those contained in\nbrand names or trademarks. It shall not refer to copyright, trademark,\nor other intellectual property-like instruments.\nNAIL\n-\nhard area on finger or toe; in humans and other primates, the thin\nhorny covering that grows on the upper surface of the end of each\nfinger\nNAIL BED\n-\nnail-producing tissue at base of nail: the layer of tissue at the base\nof a fingernail or toenail from which new nail materials develops.\nNAIL FILE\n-\nfile for fingernails: a small file used for smoothing and shaping the\nends of the fingernails.\nNAIL POLISH\n-\nvarnish for fingernails: a fast drying colored or transparent lacquer\nused to decorate fingernails or toenail.\nNAIL SCISSOR\n-\nsmall scissor for fingernails: small scissor, sometimes with curved\nblades, used for trimming fingernails or toenails.\nPERSONAL\nPROTECTIVE\nEQUIPMENT\n-\nmeans any clothing, device or another article that is intended to be\nworn or used by a worker to prevent injury or to facilitate rescue;\nSAFETY\n-\nthe condition of being free from danger and hazards which may cause\ninjuries or diseases.\nSAFETY DATA\nSHEETS (SDS)\n-\nis a document that provides important physical characteristics,\necological, health, safety and toxicological information on chemical\nsubstances or mixtures of ingredients used at the workplace,\ntransported and maybe utilized by the consumer.\nSANITIZE\n-\nan effective bactericidal treatment to render surfaces of utensils, tools\nand equipment free pathogenic microorganisms\nSEGRAGATION\n-\nshall refer to sorting and segregation of different materials found in\nsolid waste in order to promote recycling and re-use of resources and\nto reduce the volume of waste collection and disposal.\nSOLVENT\n-\na common term of liquid substance used in dry cleaning process in\nplace of water.\nSTERILIZATION\n-\nany chemical and or physical process which kills and destroys all\nmicroorganisms.\nSURFACE\n-\nthin applied outer layer, relatively thin outer layer or coating applied\nto something, usually to give it smooth finish.\nTONSORIAL AND\nBEAUTY\nESTABLISHMENT\n-\nincludes barber shop, parlors and other establishments engaged in\nthe physical make-over of an individual\nTOUCH UP\n-\nimprove something: to make a slight improvement to something, e.g.\nwith paint\nWORKFLOW\n-\nprogress of work: the progress or rate of progress of work done by a\nbusiness, department, or person.\n\n--- PDF PAGE 139 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01 Promulgated (06/09/2020) 135\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like\nto extend sincerest thank you and appreciation to the representatives of business,\nindustry, academe and government agencies who provided their time and expertise in\nthe development and validation of this Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERT AND REVIEW PANEL\n\nMANOLITO “Ching” D. DONDONILLA\nTechnical Exp