        "source_text": "--- PDF PAGE 6 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 2 \n \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the units of competency required in \nBEAUTY CARE (NAIL CARE) SERVICES NC II. \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION \n \n \n \nUNIT CODE \n: 400311210 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto gather, interpret and convey information in response to \nworkplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and relevant \ninformation is accessed \nfrom appropriate sources  \n1.2 Effective questioning, \nactive listening and \nspeaking skills are used to \ngather and convey \ninformation \n1.3 Appropriate medium is \nused to transfer information \nand ideas \n1.4 Appropriate non-verbal \ncommunication is used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and colleagues \nare identified and followed \n1.6 Defined workplace \nprocedures for the location \nand storage of information \nare used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n \n \n \n1.1 Effective verbal and \nnonverbal \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n1.8 Workplace etiquette \n \n \n1.1 Following simple \nspoken language \n1.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3 Participating in \nworkplace \nmeetings and \ndiscussions \n1.4 Preparing work- \nrelated documents \n1.5 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6 Relating/ \nInteracting with \npeople of various \nlevels in the \nworkplace \n1.7 Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements \n1.8 Applying basic \nbusiness writing \nskills\n\n--- PDF PAGE 7 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 3 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.9 Applying \ninterpersonal skills \nin the workplace \n1.10 Performing \nactive-listening \nskills \n2.  Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices and \ninstructions are read and   \ninterpreted in accordance \nwith organizational \nguidelines \n2.2 Routine written instruction \nis followed based on \nestablished procedures \n2.3 Feedback is given to \nworkplace supervisor \nbased on instructions/ \ninformation received \n2.4 Workplace interactions \nare conducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about routine \nworkplace procedures and \nmatters concerning \nconditions of employment \nare sought and asked from \nappropriate sources  \n2.6 Meetings outcomes are \ninterpreted and \nimplemented \n2.1 Effective verbal and \nnon-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nworkplace policies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace etiquette \n \n  \n2.1 Following simple \nspoken \ninstructions  \n2.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n2.3 Participating in \nworkplace \nmeetings and \ndiscussions \n2.4 Completing work- \nrelated documents \n2.5 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n2.6 Relating/ \nResponding to \npeople of various \nlevels in the \nworkplace \n2.7 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n2.8 Applying basic \nquestioning/ \nquerying \n2.9 Applying skills in \nreading for \ninformation  \n2.10 Applying skills in \nlocating  \n3. Complete \nrelevant \nwork-related \ndocuments \n3.1 Range of forms relating to \nconditions of employment \nare completed accurately \nand legibly \n3.2 Workplace data is recorded \non standard workplace \nforms and documents \n3.1 Effective verbal and \nnon-verbal \ncommunication \n3.2 Different modes of \ncommunication  \n3.3 Workplace forms \nand documents \n3.1 Completing work- \nrelated documents \n3.2 Applying \noperations of \naddition, \nsubtraction,\n\n--- PDF PAGE 8 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 4 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.3 Errors in recording \ninformation on forms/ \ndocuments are identified \nand acted upon \n3.4 Reporting requirements to \nsupervisor are completed \naccording to organizational \nguidelines \n3.4 Organizational/ \nWorkplace policies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n \n \ndivision and \nmultiplication \n3.3 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n3.4 Applying Effective \nrecord keeping \nskills\n\n--- PDF PAGE 9 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 5 \n \n  RANGE OF VARIABLES \n \nVARIABLES 