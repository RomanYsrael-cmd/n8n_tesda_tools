        "source_title": "PERFORM MANICURE AND PEDICURE",
        "source_text": "--- PDF PAGE 60 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 56 \n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : PERFORM MANICURE AND PEDICURE \n \n \n \nUNIT CODE \n: SOC514311 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitude in \nperforming manicure and pedicure. This involves preparing \nthe client, analyzing nails and skin, cleaning of finger nails \nand toe nails, applying nail polish, applying final touch ups \nand performing post activities. It includes practicing good \nproper and ethical behavior at all times in accordance with \nthe code of ethics. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare \nworkstation \nand \nimplements  \n1.1 Appropriate disinfection \nand sterilization of \nequipment and tools for \nthe appointed nail service \nare carried out using \nregistered sterilant/EPA \nand hospital grade \ndisinfectants in \ncompliance with \napplicable laws and \ngovernment regulations \n1.2 Required supplies and \nmaterials are prepared  \n1.3 Workstation is cleaned, \ndisinfected and organized \nfollowing spa/salon \npolicies and procedures \n1.4 Personal Protective \nEquipment (PPE) is \nprovided following health \nand safety standards set \nby the spa/salon industry \n1.5 Proper personal and \nhand hygiene is observed \nwith knowledge of \ncommon \nmicroorganisms and \nprocess of infection \n1.6 Proper handling of \nequipment, tools, supplies \nand materials is \nimplemented to avoid \ncross-infection/cross-\n1.1 \nCode on \nSanitation of the \nPhilippines \n1.2 \nCode of Ethics \n1.3 \nDisinfection and \nSterilization \nProcesses \n1.4 \nSpa/Salon \nPolicies and \nProcedures \n1.5 \nApplicable laws \nand government \nregulations \n1.6 \nSpa/Salon \nEquipment, \nTools, Supplies \nand Materials  \n1.7 \nProduct \nknowledge \n1.8 \nBasic \nMathematics \n1.9 \nPPE requirement \n1.10 Common \nMicroorganisms \n1.11 Process of \nInfection \n1.12 Infection control \npractices \n1.13 Spa/salon \ndocumentation \nand records \nmanagement \n \n1.1 Complying with \nthe legal and \nindustry \nrequirements on \nspa/salon safety \nand sanitation \n1.2 Implementing \ndisinfection and \nsterilization \nprocesses \n1.3 Identifying and \npreparing \nrequired \nequipment, tools, \nsupplies and \nmaterials  \n1.4 Identifying and \npreparing nail \nproducts \n1.5 Interpreting \nmanufacturer’s \noperations \nmanual \n1.6 Organizing \nworkstation  \n1.7 Observing proper \npersonal and \nhand hygiene \n1.8 Handling \nequipment, tools, \nsupplies and \nmaterial properly\n\n--- PDF PAGE 61 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 57 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ncontamination within the \nworkplace \n1.7 Required documentation \ntools and materials are \nprepared in accordance \nwith spa/salon policies and \nprocedures \n1.9 \nIdentifying \ncommons \nmicroorganisms \n1.10 Understanding \nthe process of \ninfection \n1.11 Identifying \ndocumentation \nrequirements, \ntools and \nmaterials \n \n2.  Prepare the \nclient \n2.1 Client is properly seated \nwith safety and comfort \nensured throughout the \nentire service. \n2.2 Client is advised to remove \njewelries and \naccessories for safety and \nsanitation. \n2.3 Personal Protective \nEquipment (PPE) is \nhanded over to the client in \ncompliance with applicable \nlaws and government \nregulations. \n2.4 Appropriate Personal \nProtective Equipment \n(PPE) is worn following \nspa/salon policies and \nprocedures in accordance \nwith manufacturer’s \ninstructions.  \n2.5 If necessary, client’s vital \nsigns are taken using \nappropriate instruments \nto assess general health \nand capacity to receive \nspa/salon services.  \n2.6 Client’s nail structure, \nshape and condition are \nassessed and identified. \n2.7 Contraindicated nail \nconditions/disorders and \ndiseases that may restrict \nthe manicure or pedicure \nservice are identified and \nreferred to appropriate \nhealth care \nprofessionals.  \n2.1 \nCode of Ethics \n2.2 \nCustomer \nService \n2.3 \nClient Care \n2.4 \nCommunication \nand Basic Public \nRelations \n2.5 \nClient \nConsultation and \nDocumentation \nProcedures  \n2.6 \nSpa/Salon \nPolicies and \nProcedures, \n2.7 \nCode on \nSanitation of the \nPhilippines \n2.8 \nApplicable Laws \nand Government \nRegulations \n2.9 \nVital Signs and \nAppropriate \nInstruments \n2.10 Basic Nail \nAnatomy and \nPhysiology \n2.11 Common \nMicroorganisms \n2.12 Process of \nInfection \n2.13 Common Nail \nShapes \n2.14 Common Nail \nConditions \n2.15 Common Nail \nDisorders and \nDiseases \n2.1 Conversing and \nreceiving client \ncordially  \n2.2 Positioning and \nmaintaining client \nsafety and \ncomfort \n2.3 Performing client \ncare \n2.4 Wearing PPE \n2.5 Taking, \ninterpreting and \nrecording vital \nsigns \n2.6 Assessing nail \nstructure, shape \nand condition  \n2.7 Identifying \ncommon \nmicroorganisms \n2.8 Understanding \nprocess of \ninfection \n2.9 Identifying \ncommon nail \ndisorders and \ndiseases  \n2.10 Using \ndocumentation \ntools and \nmaterials \n2.11 Referring client to \nappropriate \nhealth care \nprofessionals \n2.12 Understanding \nclient needs and \npreferences\n\n--- PDF PAGE 62 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 58 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.8 Nail shapes, basic nail \ndesigns and available nail \npolish are presented for \nclient preference. \n2.16 Health Care \nProfessionals \nrelevant to \nSpa/Salon \nPractice \n2.17 Proper use of \nPersonal  \n          Protective  \n          Equipment (PPE) \n2.18 Body Positions \n2.19 Proper Posture \nand Body \nMechanics \n2.20 Basic Nail \nDesigns \n2.21 Product \nKnowledge \n2.13 Maintaining \nproper posture \nand body \nmechanics \n \n3.  Perform \nmanicure \nand \npedicure \n3.1 Client’s nails are cleansed \nand disinfected using the \nappropriate products.  \n3.2 Basic manicure and \npedicure procedures are \nperformed based on client \npreference, product usage \nspecifications and \nspa/salon policy. \n3.3 Accidental cuts/wounds are \ngiven immediate first-aid \nwhile serious cases are \nreferred to appropriate \nhealth professionals \nfollowing spa/salon policies \nand procedures. \n \n3.1 \nCode of Ethics \n3.2 \nCode on \nSanitation of the \nPhilippines \n3.3 \nApplicable Laws \nand Government \nRegulations \n3.4 \nTime \nmanagement \n3.5 \nCommunication \nand Basic Public \nRelations \n3.6 \nCustomer Service \n3.7 \nClient Care \n3.8 \nRequired \nEquipment, \nTools, Supplies \nand Materials \n3.9 \nNail Product \nKnowledge \n3.10 Basic Nail \nAnatomy and \nPhysiology \n3.11 Common \nMicroorganisms \n3.12 Process of \nInfection \n3.13 Common Nail \nShapes \n3.14 Common Nail \nConditions \n3.15 Basic \nMathematics \n3.1 \nMaintaining \neffective \ncommunication \nwith the client \n3.2 \nUnderstanding \nnon-verbal \ncommunication \n3.3 \nCleansing and \ndisinfecting \nnails \n3.4 \nMaintaining \nsafety and \nsanitation \n3.5 \nOperating and \nhandling \nequipment, \ntools supplies \nand materials \n3.6 \nApplying nail \nproducts  \n3.7 \nPerforming \nbasic manicure \nand pedicure \nprocedures \n3.8 \nInterpreting \nproduct usage \nspecifications \n3.9 \nApplying \nstandard first-\naid  \n3.10 Observing time \nmanagement\n\n--- PDF PAGE 63 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 59 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.16 Spa/Salon \nPolicies and \nProcedures \n3.17 Basic Manicure \nand Pedicure \nProcedures \n3.18 Standard First Aid \n3.19 Health Care \nProfessionals \nrelevant to \nSpa/Salon \nPractice \n3.20 Proper Posture \nand Body \nMechanics \n4. Create basic \nnail design  \n4.1 Basic nail design is created \nafter performing basic \nmanicure and pedicure \nprocedures in accordance \nwith client chosen design \nand color/s. \n4.2 Top or seal coat, and if \nnecessary, a quick-dry \nproduct is applied on each \npolished nail. \n4.3 Finished work is evaluated \nby the client based on the \npreferred shape, color and \ndesign. \n4.4 Necessary touch-ups as \nmay be required following \nnail service procedures are \napplied.  \n4.1 \nCode of Ethics \n4.2 \nCode on \nSanitation of the \nPhilippines \n4.3 \nApplicable Laws \nand Government \nRegulations \n4.4 \nTime \nmanagement \n4.5 \nCommunication \nand Basic Public \nRelations \n4.6 \nCustomer Service \n4.7 \nClient Care \n4.8 \nRequired \nEquipment, \nTools, Supplies \nand Materials \n4.9 \nNail Product \nKnowledge \n4.10 Basic Nail \nAnatomy & \nPhysiology \n4.11 Common \nMicroorganisms \n4.12 Process of \nInfection \n4.13 Common Nail \nShape \n4.14 Common Nail \nConditions \n4.15 Basic \nMathematics \n4.1 \nCreating basic \nnail design \n4.2 \nApplying quick- \ndry product \n4.3 Evaluating \nfinished work \n4.4 \nApplying touch-\nups \n4.5 \nSatisfying client \nexpectations\n\n--- PDF PAGE 64 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 60 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.16 Spa/Salon \nPolicies and \nProcedures \n4.17 Basic Manicure \nand Pedicure \nProcedures \n4.18 Basic Nail Design \n4.19 Proper Posture \nand Body \nMechanics \n5. Perform \npost-\nservice \nactivities \n5.1 Client is advised on proper \nnail care and \nmaintenance. \n5.2 Equipment and tools are \ncleaned, \ndisinfected/sterilized and \nstored following spa/salon \npolicies and procedures in \naccordance with \nmanufacturer’s \ninstructions. \n5.3 Products, supplies and \nmaterials are replenished, \nand stored following \nspa/salon policies and \nprocedures in accordance \nwith product usage \nspecifications. \n5.4 Waste materials are \ncollected following proper \nwaste management and \ndisposal procedures in \ncompliance with applicable \nlaws and government \nregulations. \n5.5 Workstation is cleaned, \ndisinfected and prepared \nfor the next service. \n5.6 Proper documentation is \nperformed in accordance \nwith spa/salon policies and \nprocedures. \n \n5.1 \nCode of Ethics \n5.2 \nTime \nmanagement \n5.3 \nCommunication \nand Basic Public \nRelations \n5.4 \nCustomer Service \n5.5 \nNail Care  \n5.6 \nNail Polish \nMaintenance \n5.7 \nNail Product \nKnowledge \n5.8 \nBasic Nail \nAnatomy and \nPhysiology \n5.9 \nCommon \nMicroorganisms \n5.10 Process of \nInfection \n5.11 Common Nail \nShapes \n5.12 Common Nail \nConditions \n5.13 Common Nail \nDiseases \n5.14 Basic \nMathematics \n5.15 Equipment, \nTools, Supplies \nand Materials \nStorage \n5.16 Disinfection and \nSterilization \nProcesses \n5.17 Code on \nSanitation of the \nPhilippines \n5.18 Applicable Laws \nand Government \nRegulations \n5.1 Advising client \non proper nail \ncare and \nmaintenance \n5.2 Cleaning, \ndisinfecting/steril\nizing and storing \nequipment and \ntools \n5.3 Replenishing \nand storing \nproducts, \nsupplies and \nmaterials \n5.4 Implementing \nproper waste \nmanagement \nand disposal  \n5.5 Cleaning, \ndisinfecting and \norganizing \nworkstation \n5.6 Managing \nrecords\n\n--- PDF PAGE 65 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 61 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5.19 Spa/Salon \nPolicies and \nProcedures \n5.20 Waste \nManagement and \nDisposal \n5.21 Spa/Salon \nDocumentation \nand Records \nManagement\n\n--- PDF PAGE 66 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 62 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Disinfection and \nSterilization  \nMay include: \n1.1 Disinfection \n1.1.1 70% ethyl or isopropyl alcohol \n1.1.2 Bleach \n1.1.3 Chlorine/Hydrogen Chloride \n1.1.4 Barbicide \n1.1.5 Hydrogen Peroxide \n1.1.6 Quats (Quaternary Ammonium) \n1.1.7 Phenolics \n1.2 Sterilization \n1.2.1 Use of Ultra Violet rays (UV cabinets) \n1.2.2 Fumigation \n1.2.3 Autoclave \n1.2.4 Use of Chemical agents (Ethylene Oxide) \n2. Equipment and Tools \nMay include: \n2.1 Equipment \n2.1.1 Nail service table \n2.1.2 Adjustable lamp \n2.1.3 Clients chair \n2.1.4 Supply tray \n2.1.5 Foot rest \n2.1.6 Manicurist’s stool \n2.1.7 UV sterilizer \n2.2 Tools \n2.2.1 Reusable \n2.2.1.1 Cuticle nipper \n2.2.1.2 Toe nail clippers  \n2.2.1.3 Nail brush \n2.2.1.4 Tweezers \n2.2.1.5 Nail file \n2.2.1.6 Cuticle scissors \n2.2.1.7 Finger and toe nail separator \n2.2.2 Disposable \n2.2.2.1 Wooden cuticle pusher \n2.2.2.2 Orange wood sticks \n2.2.2.3 Emery boards \n2.2.2.4 Nail buffer \n3. Nail Service \nMay include: \n3.1 Women’s Manicure \n3.2 Women’s Pedicure \n3.3 Men’s Manicure \n3.4 Men’s Pedicure \n3.5 Nail Polish Design/Nail Art \n4. Registered Sterilants/EPA \nand Hospital Grade \nDisinfectants \nMay include: \n4.1 Bleach \n4.2 70% and above Ethyl/Isopropyl Alcohol \n4.3 Aldehydes\n\n--- PDF PAGE 67 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 63 \n \nVARIABLE \nRANGE \n4.4 Quaternary Ammonium \n4.5 Hydrogen Chloride \n4.6 Citric Acid \n4.7 Sodium Hypochlorite \n4.8 Antiseptics \n4.9 Phenolics \n4.10 Barbicide \n5. Applicable Laws and \nGovernment Regulations \nMay include: \n5.1 Code on Sanitation of the Philippines \n5.2 DTI-DOH Guidelines to Follow on Minimum Health \nProtocols for Barbershops and Salons - IATF \nResolution No. 41, series 2020 (Covid-19 pandemic \nand new normal scenario) \n5.3 Food and Drug Administration Guidelines \n5.4 Occupational Health and Safety Standards –OSHC-\nDOLE \n5.5 RA 9003 – Ecological Solid Waste Management \nProgram \n5.6 RA 11058 – Strengthening Compliance with \nOccupational Safety and Health Standards (OSHS) \nand Proving Penalties for Violations Thereof \n6. Supplies and Materials \nMay include: \n6.1 Nail Polish \n6.1.1 Enamel \n6.1.2 Lacquer \n6.1.3 Varnish \n6.2 Base coat \n6.3 Top coat \n6.4 Cuticle softener \n6.5 Cuticle oil \n6.6 Quick dry \n6.7 Finger bowl \n6.8 Disinfecting container \n6.9 Glass container for cotton     \n6.10 Hand and foot towels \n6.11 Rubber/disposable slippers \n6.12 Sanitizer \n6.13 Antiseptic solution \n6.14 Cotton (balls) \n6.15 Foot and hand lotion \n6.16 Alcohol \n6.17 Tissue paper \n7. Workstation \nMay include: \n7.1 Manicure station \n7.2 Pedicure station \n7.3 Salon station \n7.4 Sanitation station \n7.5 Foot spa/treatment station\n\n--- PDF PAGE 68 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 64 \n \nVARIABLE \nRANGE \n8. Spa/Salon Policies and \nProcedures \nMay include: \n8.1 Standard Operating Procedures (SOP) \n8.2 Service/Treatment Protocols \n8.3 Customer Service Protocols \n8.4 Employee Handbook \n8.5 Company Rules and Regulations \n9. Personal Protective \nEquipment (PPE) \nMay include: \n9.1 Facial mask \n9.2 Apron \n9.3 Medical grade and disposable hand gloves \n9.4 Hair net or hair band \n9.5 Arm rest pad/arm cushion \n9.6 Face shield \n10. Proper Personal and \nHand Hygiene \nMay include: \n10.1 Personal Hygiene \n10.1.1 Proper bathing  \n10.1.2 Using deodorants \n10.1.3 Brushing teeth every after meals \n10.2 Hand Hygiene \n10.2.1 Hand washing \n10.2.2 Hand sanitation/disinfection \n10.2.3 Use of disposable hand gloves \n11. Common Microorganisms \nMay include: \n11.1 Bacteria \n11.2 Virus \n11.3 Fungi \n11.4 Protozoans \n11.5 Parasite \n12. Process of Infection \nMay include: \n12.1 Infectious agents \n12.2 Susceptible hosts \n12.3 Portal of entry \n12.4 Mode of transmission \n12.5 Portal of exit \n12.6 Reservoir  \n13. Documentation Tools and \nMaterials \nMay include: \n13.1 Consultation forms \n13.2 Appointment forms  \n13.3 Client information form \n13.4 Treatment/service slips and forms \n13.5 Subjective/Objective/Assessment/Plan (SOAP) \nform \n13.6 Computer \n13.7 Inventory forms/books \n13.8 Pens \n14. Jewelries and \nAccessories \nMay include: \n14.1 Rings \n14.2 Watches \n14.3 Bracelets\n\n--- PDF PAGE 69 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 65 \n \nVARIABLE \nRANGE \n14.4 Wrist bands \n14.5 Arm bands \n14.6 Anklets \n15. Vital Signs and \nAppropriate Instruments \nMay include: \n15.1 Blood Pressure  \n15.1.1 Sphygmomanometer  \n15.1.2 Stethoscope \n15.2 Heart Rate  \n15.2.1 Analog Wrist Watch \n15.3 Respiratory Rate  \n15.3.1 Analog Wrist Watch \n15.4 Temperature  \n15.4.1 Digital Thermometer (oral and axillary) \n15.4.2 Handheld Infrared Digital Thermometer  \n16. Nail Structure \nMay include: \n16.1 Nail Matrix \n16.2 Nail Root \n16.3 Free Edge (Hyponychium) \n16.4 Nail Plate \n16.5 Distal Edge of Nail Plate \n16.6 Cuticle (Eponychium) \n16.7 Lunula \n16.8 Nail Walls \n16.9 Hyponychium Nail Grooves \n16.10 Lateral Nail Folds (Paronychium) \n16.11 Proximal Nail Fold \n16.12 Nail Bed \n16.13 Mantle \n17. Nail Shapes \nMay include: \n17.1 Oval \n17.2 Square \n17.3 Round \n17.4 Pointed \n17.5 Squoval \n18. Nail Condition/Disorders \n(may restrict manicure or \npedicure) \nMay include: \n18.1 Nail discoloration \n18.2 Lifted nail plate \n18.3 Thickened nail \n18.4 Ridged nail \n18.5 Splitting nail \n18.6 Pits and grooves \n18.7 Deformed or brittle nail \n18.8 Nail inflammation \n18.9 Minor nail trauma (subungual hematoma)  \n18.10 Ingrown \n18.11 Bunion \n18.12 Unusual nail shape \n18.13 Nail/Skin eczema \n18.14 Psoriasis\n\n--- PDF PAGE 70 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 66 \n \nVARIABLE \nRANGE \n18.15 Minor viral infection/wart \n18.16 Nail wasting (Onychatrophia) \n18.17 Paronychia \n19, Nail Diseases \n(contraindications to \nmanicure or pedicure \ntreatment) \nMay include: \n19.1 Fungal infections \n19.1.1 Tinea Pedis (Athlete’s Foot) \n19.1.2 Tinea Manus \n19.1.3 Tinea Unguium (Onychomycosis)  \n19.2 Active bacterial infections \n19.3 Significant/severe viral infection/wart \n19.4 Scabies \n19.5 Severe eczema or Psoriasis \n19.6 Undiagnosed lump and swelling \n19.7 Swollen hands/feet \n19.8 Contagious diseases \n19.9 Infectious diseases \n19.10 Redness of hands/feet \n19.11 Severe wounds  \n19.12 Severe nail trauma \n19.13 Rams Horn Nail (Onychogryposis) \n19.14 Severe Onycholysis  \n19.15 Onychoptosis (shedding/falling of nail) \n19.16 Green Nail Syndrome (Pseudomonas) \n20. Appropriate Health Care \nProfessionals \nMay include: \n20.1 Podiatrists \n20.2 Dermatologists \n20.3 Physicians \n20.4 Orthopedic Surgeons \n20.5 Physical Therapists \n20.6 Occupational Therapists \n20.7 Nurses \n21. Basic Nail Designs \nMay include: \n21.1 Plain (single coats per color) \n21.2 Elephant tusk \n21.3 Half moon \n21.4 Half-moon with tip \n21.5 French tip  \n21.6 V-shape \n22. Basic Manicure and \nPedicure Procedures \nMay include: \n22.1 Remove existing nail polish completely with nail \npolish remover following product usage \nspecifications.  \n22.2 Soften the fingernails/toe nails by soaking in warm \nwater with liquid soak solution following product \nusage specifications. \n22.3 Evenly trim and file nails in accordance with client’s \npreferred length and shape.  \n22.4 Apply cuticle remover/softener following product \nusage specifications.\n\n--- PDF PAGE 71 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 67 \n \nVARIABLE \nRANGE \n22.5 Select the appropriate tools and gently push back \nthe cuticle and remove dry skin and \nhangnails/ragged free edges surrounding the nail \ngrooves.  \n22.6 Brush nails in a downward direction or wipe with \nmoist cotton after removal of dry skin and \nhangnails/ragged free edges. \n22.7 Re-file and buff to smoothen the nail plate and \nedges according to client’s chosen shape and style. \n22.8 Clean the nail plate with alcohol for polish to adhere \nwell. \n22.9 Apply the base coat and the chosen polish (and \ncreate basic nail design/s if preferred by the client). \n22.10 Remove excess polish around the cuticles and \nnails with appropriate tools. \n22.11 Apply the top/seal coat over the entire nail plate \nand give adequate time for the nails to dry. \n22.12 Apply quick-dry product as may be necessary.   \n23. Quick-Dry Product \nMay Include: \n23.1 Quick-dry serums \n23.2 Quick-dry oil \n23.3 Quick-dry sprays \n23.4 Fast-dry top coat sprays \n23.5 Non-toxic nail dryers \n24. Proper Nail Care and \nMaintenance \nMay include: \n24.1 Regular spa/salon visits \n24.2 Regular application of lotion and oils \n24.3 Wear suitable gloves when doing activities \ninvolving use of water or chemicals \n24.4 Avoid using nails as tools in performing tasks \n24.5 Avoid biting nails \n24.6 Use of emery boards to remove ragged free edges \nto the nails \n25. Waste materials \nMay include: \n25.1 Biodegradable: \n25.1.1 Disposable wipes \n25.1.2 Tissues \n25.1.3 Cling wraps \n25.1.4 Cotton  \n25.1.5 Nail trimmings \n25.2 Non-biodegradable \n25.2.1 Product packaging \n25.2.2 Bottles \n25.2.3 Plastics \n25.2.4 Caps \n26. Waste Management and \nDisposal \nMay include: \n26.1 Prevention \n26.2 Reduction \n26.3 Segregation\n\n--- PDF PAGE 72 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 68 \n \nVARIABLE \nRANGE \n26.4 Re-use \n26.5 Recycling \n26.6 Composting\n\n--- PDF PAGE 73 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 69 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDisinfected and sterilized equipment and tools using \nregistered sterilants/EPA and hospital grade disinfectants \nin compliance with applicable laws and government \nregulations. \n1.2 \nPrepared the required supplies and materials. \n1.3 \nCleaned, disinfected and organized workstation following \nspa/salon policies and procedures. \n1.4 \nProvided Personal Protective Equipment (PPE) following \nhealth and safety standards set by the spa/salon industry. \n1.5 \nObserved proper personal and hand hygiene. \n1.6 \nImplemented proper handling of equipment, tools, supplies \nand materials to avoid cross-infections/cross-contamination \nwithin the workplace. \n1.7 \nSeated the client properly, safety and comfort are ensured \nthroughout the service. \n1.8 \nAdvised the client to remove jewelries and accessories for \nsafety and sanitation. \n1.9 \nTook client’s vital signs using appropriate instruments. \n1.10 Assessed and identified client’s nail structure and \ncondition. \n1.11 Identified contraindicated nail conditions/disorders and \ndiseases that may restrict the manicure and pedicure \nservice and referred to appropriate health professional. \n1.12 Presented nail shapes, basic nail designs and available \nnail polish to the client. \n1.13 Cleansed and disinfected client’s nails using appropriate \nproducts. \n1.14 Performed basic manicure and pedicure procedures based \non client preference, product usage specifications and \nspa/salon policy. \n1.15 Gave immediate first aid to accidental wounds and cuts \nand referred serious cases to appropriate health care \nprofessionals. \n1.16 Created basic nail design in accordance with client chosen \ndesign and color/s. \n1.17 Evaluated finished work based on client preferred shape, \ncolor and design. \n1.18 Advised client on proper nail care and maintenance. \n1.19 Cleaned, disinfected/sterilized and stored equipment and \ntools following spa/salon procedures in accordance with \nmanufacturer’s instructions. \n1.20 Replenished and stored products, supplies and materials \nfollowing spa/salon policies and procedures in accordance \nwith product usage specifications. \n1.21 Collected waste materials following proper waste \nmanagement and disposal procedures in compliance with \napplicable laws and government regulations.\n\n--- PDF PAGE 74 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 70 \n \n1.22 Cleaned, disinfected and prepared workstation for the next \nservice. \n1.23 Performed proper documentation in accordance with \nspa/salon policies and procedures. \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Live Model \n2.2 Treatment Products \n2.3 Materials, supplies, Tools and Equipment \n2.4 Actual workstation or simulated workplace with complete \nfacilities \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Direct observation with oral questioning \n3.3 Portfolio \n4. Context of \nAssessment \n4.1 Competency may be assessed in the workplace or \naccredited assessment center.\n",
