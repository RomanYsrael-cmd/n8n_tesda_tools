tener \n6.5 Cuticle oil \n6.6 Quick dry \n6.7 Finger bowl \n6.8 Disinfecting container \n6.9 Glass container for cotton     \n6.10 Hand and foot towels \n6.11 Rubber/disposable slippers \n6.12 Sanitizer \n6.13 Antiseptic solution \n6.14 Cotton (balls) \n6.15 Foot and hand lotion \n6.16 Alcohol \n6.17 Tissue paper \n7. Workstation \nMay include: \n7.1 Manicure station \n7.2 Pedicure station \n7.3 Salon station \n7.4 Sanitation station \n7.5 Foot spa/treatment station\n\n--- PDF PAGE 68 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 64 \n \nVARIABLE \nRANGE \n8. Spa/Salon Policies and \nProcedures \nMay include: \n8.1 Standard Operating Procedures (SOP) \n8.2 Service/Treatment Protocols \n8.3 Customer Service Protocols \n8.4 Employee Handbook \n8.5 Company Rules and Regulations \n9. Personal Protective \nEquipment (PPE) \nMay include: \n9.1 Facial mask \n9.2 Apron \n9.3 Medical grade and disposable hand gloves \n9.4 Hair net or hair band \n9.5 Arm rest pad/arm cushion \n9.6 Face shield \n10. Proper Personal and \nHand Hygiene \nMay include: \n10.1 Personal Hygiene \n10.1.1 Proper bathing  \n10.1.2 Using deodorants \n10.1.3 Brushing teeth every after meals \n10.2 Hand Hygiene \n10.2.1 Hand washing \n10.2.2 Hand sanitation/disinfection \n10.2.3 Use of disposable hand gloves \n11. Common Microorganisms \nMay include: \n11.1 Bacteria \n11.2 Virus \n11.3 Fungi \n11.4 Protozoans \n11.5 Parasite \n12. Process of Infection \nMay include: \n12.1 Infectious agents \n12.2 Susceptible hosts \n12.3 Portal of entry \n12.4 Mode of transmission \n12.5 Portal of exit \n12.6 Reservoir  \n13. Documentation Tools and \nMaterials \nMay include: \n13.1 Consultation forms \n13.2 Appointment forms  \n13.3 Client information form \n13.4 Treatment/service slips and forms \n13.5 Subjective/Objective/Assessment/Plan (SOAP) \nform \n13.6 Computer \n13.7 Inventory forms/books \n13.8 Pens \n14. Jewelries and \nAccessories \nMay include: \n14.1 Rings \n14.2 Watches \n14.3 Bracelets\n\n--- PDF PAGE 69 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 65 \n \nVARIABLE \nRANGE \n14.4 Wrist bands \n14.5 Arm bands \n14.6 Anklets \n15. Vital Signs and \nAppropriate Instruments \nMay include: \n15.1 Blood Pressure  \n15.1.1 Sphygmomanometer  \n15.1.2 Stethoscope \n15.2 Heart Rate  \n15.2.1 Analog Wrist Watch \n15.3 Respiratory Rate  \n15.3.1 Analog Wrist Watch \n15.4 Temperature  \n15.4.1 Digital Thermometer (oral and axillary) \n15.4.2 Handheld Infrared Digital Thermometer  \n16. Nail Structure \nMay include: \n16.1 Nail Matrix \n16.2 Nail Root \n16.3 Free Edge (Hyponychium) \n16.4 Nail Plate \n16.5 Distal Edge of Nail Plate \n16.6 Cuticle (Eponychium) \n16.7 Lunula \n16.8 Nail Walls \n16.9 Hyponychium Nail Grooves \n16.10 Lateral Nail Folds (Paronychium) \n16.11 Proximal Nail Fold \n16.12 Nail Bed \n16.13 Mantle \n17. Nail Shapes \nMay include: \n17.1 Oval \n17.2 Square \n17.3 Round \n17.4 Pointed \n17.5 Squoval \n18. Nail Condition/Disorders \n(may restrict manicure or \npedicure) \nMay include: \n18.1 Nail discoloration \n18.2 Lifted nail plate \n18.3 Thickened nail \n18.4 Ridged nail \n18.5 Splitting nail \n18.6 Pits and grooves \n18.7 Deformed or brittle nail \n18.8 Nail inflammation \n18.9 Minor nail trauma (subungual hematoma)  \n18.10 Ingrown \n18.11 Bunion \n18.12 Unusual nail shape \n18.13 Nail/Skin eczema \n18.14 Psoriasis\n\n--- PDF PAGE 70 ---\nTR – Beauty Care (Nail Care) Services NC II Revision 01                Promulgated (06/09/2020)                 66 \n \nVARIABLE \nRANGE \n18.15 Minor viral infection/wart \n18.16 Nail wasting (Onychatrophia) \n18.17 Paronychia \n19, Nail Diseases \n(contraindications to \nmanicure or pedicure \ntreatment) \nMay include: \n19.1 Fungal infections \n19.1.1 Tinea Pedis (Athlete’s Foot) \n19.1.2 Tinea Manus \n19.1.3 Tinea Unguium (Onychomycosis)  \n19.2 Active bacterial infections \