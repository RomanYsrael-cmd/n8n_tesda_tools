  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for PROCESS INSPECTION NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PROCESS INSPECTION NC\n\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n60 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with competency to perform inspection of process\nin various manufacturing fields such as assembly, stamping, machining, foundry and others in the\nmetal and plastic sector.\n\nIt also includes competencies on interpreting specifications, drawings, technical sketches\nand/or customer requirements. Tasks undertaken would also include utilizing appropriate\ninspection techniques; designated procedures, correct and appropriate tools and equipment for\nmeasurement of parameters; sets up and operates variety of specialized precision measuring\ninstrument in operating\n\nThis course is also designed to provide basic and common skills to equip individual with\noperational skills in process inspection.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace meeting\nand discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role and\nresponsibility in a team.\n2.2 Describe work as a team member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth and\ndevelopment.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health and\nsafety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 44 ---\nTR Process Inspection NC II\nPromulgated\n- 40 -\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read,\nInterpret and\nApply\nEngineering\nDrawings\n1.1 Identify and access engineering\ndrawings/ specification\n1.2 Interpret drawings\n1.3 Apply information in the drawings &\nspecifications\n1.4 Store drawings\n• Lecture/\nDemonstratio\nn\n• Dual training\n• Self paced\n(modular)\n• Distance\nLearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n2. Perform\nMensuration\nand\nCalculation\n2.1 Select measuring instrument and\ncarry out measurement and\ncalculations.\n2.2 Maintain measuring instruments\n• Lecture/\nDemonstratio\nn\n• Dual training\n• Self paced\n(modular)\n• Distance\nLearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n• Interview\n3. Read,\nInterpret and\nApply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals and\ninterpret data and specification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstratio\nn\n• Dual training\n• Self paced\n(modular)\n• Distance\nLearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work area\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used lubricants\n4.4 Report damaged tools/equipment\n• Lecture/\nDemonstratio\nn\n• Dual training\n• Self paced\n(modular)\n• Distance\nLearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n\n--- PDF PAGE 45 ---\nTR Process Inspection NC II\nPromulgated\n- 41 -\n\n CORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Select and\ncontrol\ninspection\nprocesses and\nprocedures\n1.1 Select and implement appropriate\nmethods of inspection\n1.2 Monitor inspection/test procedures\nControl inspection/test environment\nand equipment\n1.3 Monitor environmental conditions\nto ensure reliability of tests\n1.4 Check calibration of equipment or\ninstruments\n1.5 Calibrate equipment/ instruments\nusing appropriate standards and\nmaintain calibration records\naccording to standard operating\nprocedure.\n• Demonstration\n• Direct\nObservation\n• Questioning\n• Interview\n• Practical test\n\n2. Perform\nproduct\ninspection\n2.1 Inspect products\n2.2 Keep records\n2.3 Provide feedback\n• Demonstration\n• Discussion\n• Practical test\n\n3. Perform basic\nstatistical\nquality control\n3.1 Take samples\n3.2 Apply statistical process to monitor\nproduction\n• Demonstration\n• Discussion\n• Written\nexamination\n• Demonstratio\nn of practical\nskills\n• Practical\nTest\n\n4. Use\nimprovement\nprocesses in\nteam activities\n4.1 Identify areas for improvement\nand/or solve problems\n4.2 Implement improvement strategy\n4.3 Monitor implementation of\nimprovement\n4.4 Evaluate improvement\n• Demonstration\n• Discussion\n• Direct\nObservation\n• Questioning\n• Interview\n• Practical test\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n--- PDF PAGE 46 ---\nTR Process Inspection NC II\nPromulgated\n- 42 -\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience. Other\nrequirements like health and physical requirements are also stated. Passing written entry\nexaminations may also be indicated if necessary.\n\n• Preferably with background in basic machining\n• With good moral character;\n• Ability to communicate both orally and in writing; and\n• Physically and mentally fit\n\n--- PDF PAGE 47 ---\nTR Process Inspection NC II\nPromulgated\n- 43 -\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nPROCESS INSPECTION NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nPROCESS INSPECTION NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n10 units\nVerbier\ncaliper\n1 units\nOptical Pyrometer\n6 pcs\nBatteries (1.5v & 9 v)\n25 units\nSteel rule\n1 unit\nContact or\nimmersion\nPyrometer\n24 pcs\nThermocouple cups\n10 units\nMicrometer\n2 units\nHardness Testers\n(portable)\n\n14 units\nSampling\ntools\n2 units\nMoisture testers\n2 sets.\nHeating elements\n14 units\nMagnifying\nglass\n2 set\nSanding or\ngrinding machine\n4 belts or\nstones.\nSand paper (#120 to\n400)\n2 units\nFord cup\n#4\n2 units\nSand rammer\n2 kls.\nWhite rag (De Hilo)\n25 pcs.\nRubber\nglove\n1 set\nDesk top\ncomputer\n\n25 pcs.\nCotton\nglove\n3 units\nPrinter\n\n25 pcs.\nNylon\nglove\n\n25 pcs.\nGoggle\n25 pcs.\nGas mask\n25 pcs.\nSafety\nshoe\n\n25 pcs.\nApron\n\n--- PDF PAGE 48 ---\nTR Process Inspection NC II\nPromulgated\n- 44 -\n3.5 TRAINING FACILITIES\nPROCESS INSPECTION NC II\n\nBased on a class size of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n•\nBuilding (permanent)\n26.00 x 28.00\n728.00\n728.00\n• Trainee Working Space\n3.50 x 3.50 per\nstudent/trainee\n12.25 per\nstudent\n306.00\n•\nLecture Room\n9.00 x 10.00\n90.00\n90.00\n•\nLearning Resource Center\n5.00 x 8.00\n40.00\n40.00\n• Facilities/ Equipment/\nCirculation Area\n-\n-\n291.75\n\n3.6 TRAINER’S QUALIFICATIONS FOR AUTOMOTIVE SECTOR\n MANUFACTURING SUB-SECTOR\n\nPROCESS INSPECTION NC II\nTRAINER QUALIFICATION (TQ II)\n\n• Must be a holder of Process Inspection NC II or equivalent qualification\n• Must have undergone training on Training Methodology II (TM II)\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible or holder of appropriate professional license issued by the\nProfessional Regulatory Commission (for government position)\n\n* Optional. Only when required by the hiring institution.\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 49 ---\nTR Process Inspection NC II\nPromulgated\n- 45 -"
