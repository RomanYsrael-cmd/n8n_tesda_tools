ion in terms of average and range, random and assignable \ncauses \n2.2 Numerical operations and statistical calculations/formulae within the \nscope of this unit \n2.3 Statistical process control procedures, which may include Six Sigma \netc. and the sampling procedures to be followed \n2.4 Types of charts that can be produced to assist monitoring of products \nincluding run charts, tally charts, histograms, control charts \n2.5 Procedures for reporting sample data information \n2.6 Use and application of personal protective equipment \n2.7 Safe work practices and procedures\n \n3. Underpinning \nskills \n3.1 Reading, interpreting and following information on written job \ninstructions, standard operating procedures, charts, lists, drawings \nand other applicable reference documents \n3.2 Applying statistical process control procedures in accordance with \ninstructions to a given production process \n3.3 Obtaining data from samples including average, range and random or \nassignable causes \n3.4 Producing tally, run or control charts from sampling data \n3.5 Reporting information from sampling data \n3.6 Checking and clarifying task-related information \n3.7 Completing proformas and standard workplace forms \n3.8 Practices safety and quality in material handling, recording and \nreporting associated with performing basic statistical quality control\n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.3 Workplace area: Real or simulated  \n4.4 Access to all tools, equipment, materials and documentation required \n4.3 Any relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials.\n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct observation with oral questioning \n5.2 Demonstration with oral questioning \n5.3 Portfolio \n5.4 Third-party report\n \n6. Context of \nassessment \n \n6.1 Competency must be assessed on the job or in a simulated \nenv