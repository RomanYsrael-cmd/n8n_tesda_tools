  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in PROCESS INSPECTION NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR Process Inspection NC II\nPromulgated\n- 3 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR Process Inspection NC II\nPromulgated\n- 4 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard format of\nthe organization\n1.2.\nAccessed information using communication equipment\n1.3.\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4.\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge and\nattitudes\n\n2.1.\nEffective communication\n2.2.\nDifferent modes of communication\n2.3.\nWritten communication\n2.4.\nOrganizational policies\n2.5.\nCommunication procedures and systems\n2.6.\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1.\nFollow simple spoken language\n3.2.\nPerform routine workplace duties following simple written\nnotices\n3.3.\nParticipate in workplace meetings and discussions\n3.4.\nComplete work related documents\n3.5.\nEstimate, calculate and record routine workplace measures\n3.6.\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7.\nAbility to relate to people of social range in the workplace\n3.8.\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\n4.1.\nFax machine\n4.2.\nTelephone\n4.3.\nWriting materials\n4.4.\nInternet\n5. Method of\nassessment\n5.1.\nDirect observation\n5.2.\nOral interview and written test\n6. Context of\nassessment\n6.1.\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR Process Inspection NC II\nPromulgated\n- 5 -\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1.\nThe role and objective of the team is identified from\navailable sources of information\n1.2.\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources\n2. Identify own role and\nresponsibility within\nteam\n2.1.\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2.\nRoles and responsibility of other team members are identified\nand recognized\n2.3.\nReporting relationships within team and external to team are\nidentified\n3. Work as a team\nmember\n3.1.\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives\n3.2.\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3.\nObserved protocols in reporting using standard operating\nprocedures\n3.4.\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR Process Inspection NC II\nPromulgated\n- 6 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with enterprise or\nspecific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR Process Inspection NC II\nPromulgated\n- 7 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nknowledge and\nattitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning skills\n3.1.\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the work\nactivities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR Process Inspection NC II\nPromulgated\n- 8 -\nUNIT OF COMPETENCY : PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra and interpersonal relationships is are maintained in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated as proof\nof career advancement\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed\n\n--- PDF PAGE 13 ---\nTR Process Inspection NC II\nPromulgated\n- 9 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance appraisal\n1.2\nPsychological profile\n1.3\nAptitude tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing education\n3.2\nServing as resource persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and intangible rewards\n5. Licenses and/or\ncertifications\n5.1\nNational certificates\n5.2\nCertificate of competency\n5.3\nSupport level licenses\n5.4\nProfessional licenses\n\n--- PDF PAGE 14 ---\nTR Process Inspection NC II\nPromulgated\n- 10 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the course of\nmanaging oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (code of conduct, code of ethics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio assessment\n5.2\nInterview\n5.3\nSimulation/role-plays\n5.4\nObservation\n5.5\nThird party reports\n5.6\nExams and tests\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR Process Inspection NC II\nPromulgated\n- 11 -\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold\nlimit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\nOHS issues and/or concerns and identified safety hazards are\nreported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR Process Inspection NC II\nPromulgated\n- 12 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean air act\n1.2\nBuilding code\n1.3\nNational electrical and fire safety codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine occupational safety and health standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards – bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling designated emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR Process Inspection NC II\nPromulgated\n- 13 -\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value (TLV).\n1.5\nFollowed occupational health and safety (OHS) procedures for\ncontrolling hazards/risks in workplace\n1.6\nUsed personal protective equipment (PPE) in accordance with\ncompany OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge and\n attitudes\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning\n skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\nPortfolio assessment\n5.2\nInterview\n5.3\nCase study/situation\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR Process Inspection NC II\nPromulgated\n- 14 -\nCOMMON COMPETENCIES\n(AUTOMOTIVE MANUFACTURING-PARTS MANUFACTURING)\n\nUNIT TITLE:\nREAD, INTERPRET AND APPLY ENGINEERING DRAWINGS.\n\nUNIT CODE:\nALT742201\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying specification from\nengineering blue prints or drawings that provides the measurements of the\nproduct and pattern that is to be produced.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\ndrawings/\nspecification\n\n1.1 Appropriate engineering drawings are identified and accessed as\nper job requirements.\n1.2 Version and date of drawing is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret drawings\n\n2.1 Relevant dimensions and sections of the drawings/ specifications\nare located in relation to the work to be conducted\n2.2 Information in the manual are interpreted in accordance to industry\npractices\n\n3 Apply information\nin the drawings &\nspecifications\n\n3.1 Engineering drawing is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with the\nspecifications in the drawings.\n3.3 Dimensional data and shape are applied according to the given task\n\n4. Store drawings\n\n4.1 The drawings and specification are stored properly to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 19 ---\nTR Process Inspection NC II\nPromulgated\n- 15 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engineering drawings\nKinds of drawings:\n1.1 Casting drawing\n1.2 Machining drawing\n1.3 Project plan\n1.4 Technical drawing\n2. Data\nData includes but not limited to\n2.1 Material specifications\n2.2 Process specifications\n2.3 Special instructions\n2.4 Machining locating points\n2.5 Clamping points\n2.6 Amount of draft\n2.7 Surface finish\n\n--- PDF PAGE 20 ---\nTR Process Inspection NC II\nPromulgated\n- 16 -\n\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed drawings/specification\n1.2 Interpreted drawings\n1.3 Applied information in drawings\n1.4 Stored drawings\n\n1. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of drawings used in automotive manufacturing industry\n2.2 Identification of symbols used in the drawings\n2.3 Identification of units of measurements\n2.4 Unit conversion\n2.5 Attention to details, Perseverance, Honesty\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and\ninterpret engineering drawings and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All drawings/engineering specifications relative to automotive\nmanufacturing\n4.2 Job order, requisitions\n4.3 Product sample\n\n5 Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 21 ---\nTR Process Inspection NC II\nPromulgated\n- 17 -\nUNIT OF COMPETENCY:\n PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE:\n\nALT311202\n\nUNIT DESCRIPTOR:\nThis unit includes identifying, caring for, handling, using and\nmaintaining measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to job\nrequirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed using\nthe four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 22 ---\nTR Process Inspection NC II\nPromulgated\n- 18 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Straight Edge\nThickness gauge\n\n1.6 Try square\n1.7 Protractor\n1.8 Height gauge\n1.9 Steel rule\nShrink rule\n\n2. Calculation\n\nKinds of part mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11 Shrinkage allowance\n\n--- PDF PAGE 23 ---\nTR Process Inspection NC II\nPromulgated\n- 19 -\n\nEVIDENCE GUIDE\n\n1. Critical aspect\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric figures\n\n3. Underpinning\n skills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 24 ---\nTR Process Inspection NC II\nPromulgated\n- 20 -\n\nUNIT TITLE:\nREAD, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE:\nALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and periodic\nmaintenance manual\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3 Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 25 ---\nTR Process Inspection NC II\nPromulgated\n- 21 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manuals\n\nKinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 26 ---\nTR Process Inspection NC II\nPromulgated\n- 22 -\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Underpinning\nskills\n\n3.1.Reading and comprehension skills required to identify and interpret\nautomotive manuals and specifications\n3.2. Accessing information and data\n\n4 Resource\nImplications\n\nThe following resources must be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 27 ---\nTR Process Inspection NC II\nPromulgated\n- 23 -\n\nUNIT OF COMPETENCY\n: PERFORM SHOP MAINTENANCE\n\nUNIT CODE\n\n: ALT723205\n\nUNIT DESCRIPTOR\n: This unit deals with inspecting and cleaning of work area including\ntools, equipment and facilities. Storage and checking of tools/\nequipment and disposal of used supplies/materials are also\nincorporated in this competency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools\ncleaning requirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools and\nshop equipment\n\n2.1 Tools/equipment are checked and stored in their respective\nshelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per\nworkshop SOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 28 ---\nTR Process Inspection NC II\nPromulgated\n- 24 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health and Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 29 ---\nTR Process Inspection NC II\nPromulgated\n- 25 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 30 ---\nTR Process Inspection NC II\nPromulgated\n- 26 -\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nSELECT AND CONTROL INSPECTION PROCESSES AND\nPROCEDURES\n\nUNIT CODE\n\n:\nALT315301\n\nUNIT DESCRIPTOR\n:\nThis unit covers selecting inspection and test procedures, and\ncontrolling the inspection/test environment and equipment.\n.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select inspection/test\nprocedures\n\n1.1 Appropriate methods of inspection are selected and\nimplemented.\n1.2 Inspection/test procedures are monitored to ensure\ndesired outcomes.\n\n2. Control inspection/test\nenvironment and\nequipment\n\n2.1 Environmental conditions are monitored to ensure reliability\nof tests and results.\n2.2 Equipment/instruments are checked for correct calibration.\n2.3 Calibration of equipment/instruments is initiated or\nundertaken against appropriate standard as required.\n2.4 Calibration records are maintained to standard operating\nprocedure.\n2.5 If equipment/instruments are found to be out of calibration,\nvalidity of previous results is checked and reported\naccording to standard operating procedures.\n\n--- PDF PAGE 31 ---\nTR Process Inspection NC II\nPromulgated\n- 27 -\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Method of inspection\n1.1Variable\n1.2Attributes\n2. Inspection/test procedure\n2.1 Following sequence of inspection\n2.2 Method of inspection\n\n--- PDF PAGE 32 ---\nTR Process Inspection NC II\nPromulgated\n- 28 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected inspection or test procedures\n1.2 Controlled inspection or test environment and equipment\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Range of inspection methods and their application\n2.2 Appropriate inspection method for the process/product\n2.3 Procedures for implementing inspection methods\n2.4 Desired/target outcomes of the inspection/test procedures\n2.5 Reasons for discrepancies/trends\n2.6 Procedures for monitoring inspection/test procedures\n2.7 Effects of environmental conditions on test equipment and the results\n2.8 Procedures for monitoring environmental conditions\n2.9 Acceptable range of variations to environmental conditions\n2.10 Correct operation of the measuring equipment\n2.11 Specifications of the measuring equipment\n2.12 Procedures for checking the calibration of the measuring equipment\n2.13 Appropriate techniques, tools and equipment to measure components\n2.14 Units of measurement and numerical operations/calculations within the\nscope of this unit\n2.15 Codes, standards, legislative or regulatory requirements applicable to\nthe measuring equipment and/or calibration\n2.16 Procedures for initiating the calibration of measuring equipment\n2.17 Physical reference standard against which the measuring equipment is\nto be calibrated\n2.18 Procedures for calibrating measuring instruments\n2.19 Tools and equipment required to calibrate measuring equipment\n2.20 Procedures for recording calibration details\n2.21 Reasons for keeping calibration records\n2.22 Procedures to be followed when measuring equipment is found to be\nout of calibration\n2.23 Reasons for checking results from out of calibration measuring\nequipment\n2.24 Procedures for reporting out of calibration measuring equipment\n2.25 Hazards and control measures associated with inspection, including\nhousekeeping\n2.26 Use and application of personal protective equipment\n2.27 Safe work practices and procedures\n\n3. Underpinning\nskills\n3.1 Reading, interpreting and following information on standard operating\nprocedures and other applicable reference documents\n3.2 Checking and clarifying task-related information\n3.3 Entering and maintaining information onto proformas and standard\nworkplace forms and records\n3.4 Checking for conformance to specifications\n3.5 Using measurement equipment within the scope of this unit\n3.6 Measuring components to specified tolerances\n3.7 Implementing inspection method for the product/ process\n3.8 Monitoring inspection/test procedures to ensure desired outcomes are\nachieved\n3.9 Monitoring environmental conditions\n3.10 Checking calibration of measuring equipment\n3.11 initiating calibration of measuring equipment\n3.12 Calibrating measuring equipment against the appropriate reference\n\n--- PDF PAGE 33 ---\nTR Process Inspection NC II\nPromulgated\n- 29 -\nstandard\n3.13 Detecting and reporting out-of-calibration equipment\n3.14 Applying units of measurement and numerical operations/calculations\nwithin the scope of this unit\n3.15 Practicing safety procedures in handling materials, recording and\nreporting associated with performing inspection\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Real or simulated\n4.2 Access to all tools, equipment, materials and documentation required\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Portfolio\n5.3 Third-party report\n\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period of\nsupervised practice and repetitive experience.\n\n--- PDF PAGE 34 ---\nTR Process Inspection NC II\nPromulgated\n- 30 -\n\nUNIT OF COMPETENCY :\n PERFORM PRODUCTS INSPECTION\n\nUNIT CODE\n\n:\nALT315302\n\nUNIT DESCRIPTOR\n:\nThis unit covers inspecting products, keeping records and\nproviding feedback on the conformance of product to\nspecifications.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Inspect products\n\n1.1 Sample products are gathered as per company standard\noperating procedures for inspection\n1.2 Products are tested for conformance to specifications in\naccordance with standard operating procedures\n\n2. Keep records\n\n2.2 Test status identification is made on conforming and non-\nconforming products and records are accurately kept using\nstandard operating procedures.\n2.3 Inspection sheets are completely filled-out as per company\nstandard operating procedures\n\n3. Provide feedback\n\n3.1 Products are tested/inspected/measured after rework or\nrepair.\n3.2 Deficiencies or deviations are reported according to\nstandard operating procedures.\n\n--- PDF PAGE 35 ---\nTR Process Inspection NC II\nPromulgated\n- 31 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Standard operating\nprocedures\n1.1 When process is at control state-random sampling\n1.2 When uncontrolled state – 100% inspection\n\n2. Tested for conformance\nwith specifications\n\n2.1 Visual inspection\n2.2 Physical measurements\n2.3 Chemical tests\n2.4 Checks against patterns\n2.5 Templates and guides etc.\n3. Deficiencies\n3.1 Product faults\n3.2 Process faults\n3.2.1 Man\n3.2.2 Machine\n3.2.3 Materials\n3.2.4 Method\n\n--- PDF PAGE 36 ---\nTR Process Inspection NC II\nPromulgated\n- 32 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetencies\nAssessment requires evidence that the candidate:\nInspected products\n1.2 Kept records\n1.3 Provided feedback\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Procedures as defined by job instructions to be used to check\nconformance to specifications\n2.2 Data to be recorded and the frequency of recording required\n2.3 Consequences of not keeping accurate records\n2.4 Non-conformances of given products that can be\nremoved by rework/repair in accordance with job\ninstructions\n2.5 Hazards and control measures associated with performing basic\ninspection activities\n2.6 Use and application of personal protective equipment\n2.7Safe work practices and procedures\n\n3. Underpinning\nskills\n\n3.1 Reading, interpreting and following information on\nwritten job instructions, standard operating procedures\nand other applicable reference documents\n3.2 Testing products for conformance to specifications in\naccordance with job instructions\n3.3 Testing reworked/repaired products for conformance to\nspecification, in accordance with job instructions entering routine and\nfamiliar information onto proformas and standard workplace forms\n3.5 Practice safety and quality in materials handling, recording and\nreporting associated with performing inspection.\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace area: Real or simulated\n4.2 Access to all tools, equipment, materials and documentation required\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio\n5.4 Third-party report\n\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period of\nsupervised practice and repetitive experience.\n\n--- PDF PAGE 37 ---\nTR Process Inspection NC II\nPromulgated\n- 33 -\n\nUNIT OF COMPETENCY:\nPERFORM BASIC STATISTICAL QUALITY CONTROL\n\nUNIT CODE\n\n:\nALT315303\n\nUNIT DESCRIPTOR\n: This unit covers taking samples and applying a statistical\nprocess to monitor production.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Take samples\n\n1.1 Difference between population and sample is understood\nand various sampling schemes are applied in accordance\nwith standard operating procedures.\n1.2 Samples are taken on control-state to verify the\neffectiveness of countermeasures\n\n2. Apply statistical process\nto monitor production\n\n2.1 Concept of variation in terms of average and spread is\nunderstood. Data is used to produce relevant statistical\ninformation.\n2.2 Data is interpreted accurately and information is presented\nto appropriate authority according to standard operating\nprocedures\n\n--- PDF PAGE 38 ---\nTR Process Inspection NC II\nPromulgated\n- 34 -\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1.\nSampling schemes\n\n1.1 Agreed customer plans\n1.2 Acceptable Quality Level (AQL) and Average Outgoing\nQuality Level (AOQL) plans\n1.3 Shainin\n1.4 Six Sigma etc.\n\n2.\nRelevant statistical\ninformation\n\nAverage, range and process control data and the plotting of\ncharts such as:\n2.1 Line graphs\n2.2 Run charts\n2.3 Tally charts\n2.4 Histograms\n2.5 Control charts\n2.6 Random\n2.7 Assignable causes etc.\n\n--- PDF PAGE 39 ---\nTR Process Inspection NC II\nPromulgated\n- 35 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate:\n1.1 Took samples\n1.2 Applied statistical processes to monitor production\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Difference between population and sample, and the concept of\nvariation in terms of average and range, random and assignable\ncauses\n2.2 Numerical operations and statistical calculations/formulae within the\nscope of this unit\n2.3 Statistical process control procedures, which may include Six Sigma\netc. and the sampling procedures to be followed\n2.4 Types of charts that can be produced to assist monitoring of products\nincluding run charts, tally charts, histograms, control charts\n2.5 Procedures for reporting sample data information\n2.6 Use and application of personal protective equipment\n2.7 Safe work practices and procedures\n\n3. Underpinning\nskills\n3.1 Reading, interpreting and following information on written job\ninstructions, standard operating procedures, charts, lists, drawings\nand other applicable reference documents\n3.2 Applying statistical process control procedures in accordance with\ninstructions to a given production process\n3.3 Obtaining data from samples including average, range and random or\nassignable causes\n3.4 Producing tally, run or control charts from sampling data\n3.5 Reporting information from sampling data\n3.6 Checking and clarifying task-related information\n3.7 Completing proformas and standard workplace forms\n3.8 Practices safety and quality in material handling, recording and\nreporting associated with performing basic statistical quality control\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.3 Workplace area: Real or simulated\n4.4 Access to all tools, equipment, materials and documentation required\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio\n5.4 Third-party report\n\n6. Context of\nassessment\n\n6.1 Competency must be assessed on the job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period of\nsupervised practice and repetitive experience.\n\n--- PDF PAGE 40 ---\nTR Process Inspection NC II\nPromulgated\n- 36 -\nUNIT OF COMPETENCY :\nUSE IMPROVEMENT PROCESSES IN TEAM ACTIVITIES\n\nUNIT CODE\n\n:\nALT315304\n\nUNIT DESCRIPTOR\n:\n This unit covers identifying improvements and/or solving\nproblems, implementing/monitoring the implementation of\nan improvement strategy, and evaluating the improvement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify areas for\nimprovement and/or solve\nproblems\n\n1.1 Participation in team is used to select improvement tools\nand methods appropriate to the situation.\n1.2 Teamwork is used to process improvement tools to identify\nimprovements and/or solve problems.\n\n2. Contribute to improvement\nstrategy\n\n2.1 Teamwork is used to implement improvement strategies\nas required in accordance with standard operating\nprocedures.\n2.2 In conjunction with work team, further action is\nrecommended as required using standard operating\nprocedures.\n\n3. Monitor implementation of\nimprovement\n\n3.1 Performance is monitored for change, utilizing feedback\ndata.\n3.2 Analytical tools are used to monitor improvement as\nrequired.\n3.3 In conjunction with work team, further action is\nrecommended where required using standard operating\nprocedures.\n\n--- PDF PAGE 41 ---\nTR Process Inspection NC II\nPromulgated\n- 37 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1.\nImprovement tools and\nmethods\n\n1.1 Flow charts\n1.2 Cause and effect diagrams\n1.3 Pareto charts\n1.4 Histograms\n1.5 Run charts and graphs\n1.6 Control charts\n1.7 Scattergrams etc.\n\n2.\nImprovement strategies\n\n2.1 PDCA (Plan, Do, Check, Act) procedures\n2.2 Six Sigma techniques\n2.3 Root Cause Analysis etc.\n\n--- PDF PAGE 42 ---\nTR Process Inspection NC II\nPromulgated\n- 38 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified areas for improvement and/or solve problems\n1.2 Contributed to improvement strategy\n1.3 Monitored implementation of improvement\n\n2. Underpinning\nknowledge\n\n2.1 Roles and functions of self and team members\n2.2 Team discussion and problem solving processes\n2.3 Improvement tools and methods and their application\n2.4 Procedures for using process improvement tools in the\nteam environment\n2.5 Improvement strategies\n2.6 Procedures for implementing the improvement strategies\n2.7 Individual's role in implementing improvement strategies\n2.8 Procedures for initiating further action\n2.9 Procedures for collecting and collating improvement feedback data\n2.10 Analytical tools and processes to evaluate the improvement\nstrategy\n\n3. Underpinning skills\n\n3.1 Participating and communicating in a team setting\n3.2 Identifying improvements and/or solving problems in a team setting\n3.3 Implementing improvement strategies in a team setting\n3.4 Recommending further action in accordance with standard operating\nprocedures\n3.5 Collecting and collating feedback data\n3.6 Evaluating the improvement strategy implemented\n3.7 Reading, interpreting information on written job instructions,\nspecifications, charts, lists, drawings and other applicable reference\ndocuments\n3.8 Planning and sequencing tasks\n3.9 Checking and clarifying information\n3.10 Entering information onto workplace documents\n3.11 Following verbal instructions\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\nWorkplace area: Real or simulated\n4.1 Access to all tools, equipment, materials and documentation required\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period of\nsupervised practice and repetitive experience.\n\n--- PDF PAGE 43 ---\nTR Process Inspection NC II\nPromulgated\n- 39 -"
