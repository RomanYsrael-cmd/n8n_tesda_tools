        "source_text": "ALT315303\n\nUNIT DESCRIPTOR\n: This unit covers taking samples and applying a statistical\nprocess to monitor production.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Take samples\n\n1.1 Difference between population and sample is understood\nand various sampling schemes are applied in accordance\nwith standard operating procedures.\n1.2 Samples are taken on control-state to verify the\neffectiveness of countermeasures\n\n2. Apply statistical process\nto monitor production\n\n2.1 Concept of variation in terms of average and spread is\nunderstood. Data is used to produce relevant statistical\ninformation.\n2.2 Data is interpreted accurately and information is presented\nto appropriate authority according to standard operating\nprocedures\n\n--- PDF PAGE 38 ---\nTR Process Inspection NC II\nPromulgated\n- 34 -\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1.\nSampling schemes\n\n1.1 Agreed customer plans\n1.2 Acceptable Quality Level (AQL) and Average Outgoing\nQuality Level (AOQL) plans\n1.3 Shainin\n1.4 Six Sigma etc.\n\n2.\nRelevant statistical\ninformation\n\nAverage, range and process control data and the plotting of\ncharts such as:\n2.1 Line graphs\n2.2 Run charts\n2.3 Tally charts\n2.4 Histograms\n2.5 Control charts\n2.6 Random\n2.7 Assignable causes etc.\n\n--- PDF PAGE 39 ---\nTR Process Inspection NC II\nPromulgated\n- 35 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate:\n1.1 Took samples\n1.2 Applied statistical processes to monitor production\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Difference between population and sample, and the concept of\nvariation in terms of average and range, random and assignable\ncauses\n2.2 Numerical operations and statistical calculations/formulae within the\nscope of this unit\n2.3 Statistical process control procedures, which may include Six Sigma\netc. and the sampling procedures to be followed\n2.4 Types of charts that can be produced to assist monitoring of products\nincluding run charts, tally charts, histograms, control charts\n2.5 Procedures for reporting sample data information\n2.6 Use and application of personal protective equipment\n2.7 Safe work practices and procedures\n\n3. Underpinning\nskills\n3.1 Reading, interpreting and following information on written job\ninstructions, standard operating procedures, charts, lists, drawings\nand other applicable reference documents\n3.2 Applying statistical process control procedures in accordance with\ninstructions to a given production process\n3.3 Obtaining data from samples including average, range and random or\nassignable causes\n3.4 Producing tally, run or control charts from sampling data\n3.5 Reporting information from sampling data\n3.6 Checking and clarifying task-related information\n3.7 Completing proformas and standard workplace forms\n3.8 Practices safety and quality in material handling, recording and\nreporting associated with performing basic statistical quality control\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.3 Workplace area: Real or simulated\n4.4 Access to all tools, equipment, materials and documentation required\n4.3 Any relevant workplace procedures, product and manufacturing\nspecifications, codes, standards, manuals and reference materials.\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio\n5.4 Third-party report\n\n6. Context of\nassessment\n\n6.1 Competency must be assessed on the job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period of\nsupervised practice and repetitive experience.\n\n--- PDF PAGE 40 ---\nTR Process Inspection NC II\nPromulgated\n- 36 -\nUNIT OF COMPETENCY :\nUSE IMPROVEMENT PROCESSES IN TEAM ACTIVITIES\n\nUNIT CODE\n\n:"
