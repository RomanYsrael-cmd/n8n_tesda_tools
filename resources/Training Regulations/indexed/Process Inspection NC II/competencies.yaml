        "source_title": "PERFORM PRODUCTS INSPECTION",
        "source_text": "--- PDF PAGE 34 ---\nTR Process Inspection NC II \nPromulgated \n- 30 - \n \n \nUNIT OF COMPETENCY : \n PERFORM PRODUCTS INSPECTION  \n \nUNIT CODE  \n \n:  \nALT315302 \n \nUNIT DESCRIPTOR \n:  \nThis unit covers inspecting products, keeping records and \nproviding feedback on the conformance of product to \nspecifications. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n \n1. Inspect products  \n \n \n1.1  Sample products are gathered as per company standard \noperating procedures for inspection  \n1.2  Products are tested for conformance to specifications in \naccordance with standard operating procedures\n \n2. Keep records \n \n2.2  Test status identification is made on conforming and non-\nconforming products and records are accurately kept using \nstandard operating procedures. \n2.3  Inspection sheets are completely filled-out as per company \nstandard operating procedures \n \n3. Provide feedback \n \n3.1 Products are tested/inspected/measured after rework or \nrepair. \n3.2 Deficiencies or deviations are reported according to \nstandard operating procedures.\n\n--- PDF PAGE 35 ---\nTR Process Inspection NC II \nPromulgated \n- 31 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Standard operating \nprocedures\n1.1 When process is at control state-random sampling \n1.2 When uncontrolled state – 100% inspection\n \n2. Tested for conformance \nwith specifications \n \n \n2.1 Visual inspection \n2.2 Physical measurements \n2.3 Chemical tests \n2.4 Checks against patterns \n2.5 Templates and guides etc. \n3.  Deficiencies  \n3.1  Product faults \n3.2  Process faults \n3.2.1 Man \n3.2.2 Machine \n3.2.3 Materials \n3.2.4 Method\n\n--- PDF PAGE 36 ---\nTR Process Inspection NC II \nPromulgated \n- 32 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetencies \nAssessment requires evidence that the candidate: \nInspected products  \n1.2 Kept records \n1.3 Provided feedback\n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Procedures as defined by job instructions to be used to check \nconformance to specifications \n2.2 Data to be recorded and the frequency of recording required \n2.3 Consequences of not keeping accurate records \n2.4 Non-conformances of given products that can be \nremoved by rework/repair in accordance with job \ninstructions \n2.5 Hazards and control measures associated with performing basic \ninspection activities \n2.6 Use and application of personal protective equipment \n2.7Safe work practices and procedures\n \n3. Underpinning \nskills \n \n3.1 Reading, interpreting and following information on \nwritten job instructions, standard operating procedures \nand other applicable reference documents \n3.2 Testing products for conformance to specifications in \naccordance with job instructions \n3.3 Testing reworked/repaired products for conformance to \nspecification, in accordance with job instructions entering routine and \nfamiliar information onto proformas and standard workplace forms \n3.5 Practice safety and quality in materials handling, recording and \nreporting associated with performing inspection.\n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace area: Real or simulated  \n4.2 Access to all tools, equipment, materials and documentation required \n4.3 Any relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials.\n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct observation with oral questioning \n5.2 Demonstration with oral questioning \n5.3 Portfolio \n5.4 Third-party report \n \n6. Context of \nassessment \n6.1 \nCompetency must be assessed on the job or in a simulated \nenvironment. \n6.2 \nThe assessment of practical skills must take place after a period of \nsupervised practice and repetitive experience.\n",
