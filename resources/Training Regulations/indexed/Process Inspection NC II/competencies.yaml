          "source_text": "1. Select inspection/test \nprocedures \n \n \n1.1 Appropriate methods of inspection are selected and \nimplemented. \n1.2 Inspection/test procedures are monitored to ensure \ndesired outcomes. \n \n2. Control inspection/test \nenvironment and \nequipment \n \n \n2.1 Environmental conditions are monitored to ensure reliability \nof tests and results. \n2.2 Equipment/instruments are checked for correct calibration. \n2.3 Calibration of equipment/instruments is initiated or \nundertaken against appropriate standard as required. \n2.4 Calibration records are maintained to standard operating \nprocedure. \n2.5 If equipment/instruments are found to be out of calibration, \nvalidity of previous results is checked and reported \naccording to standard operating procedures.\n\n--- PDF PAGE 31 ---\nTR Process Inspection NC II \nPromulgated \n- 27 - \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Method of inspection \n1.1Variable \n1.2Attributes\n2. Inspection/test procedure \n2.1 Following sequence of inspection \n2.2 Method of inspection\n\n--- PDF PAGE 32 ---\nTR Process Inspection NC II \nPromulgated \n- 28 -"
        },
        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Selected inspection or test procedures \n1.2 Controlled inspection or test environment and equipment \n \n2. Underpinning \nknowledge and \nattitudes \n2.1 Range of inspection methods and their application \n2.2 Appropriate inspection method for the process/product \n2.3 Procedures for implementing inspection methods \n2.4 Desired/target outcomes of the inspection/test procedures \n2.5 Reasons for discrepancies/trends \n2.6 Procedures for monitoring inspection/test procedures \n2.7 Effects of environmental conditions on test equipment and the results \n2.8 Procedures for monitoring environmental conditions \n2.9 Acceptable range of variations to environmental conditions \n2.10 Correct operation of the measuring equipment \n2.11 Specifications of the measuring equipment \n2.12 Procedures for checking the calibration of the measuring equipment \n2.13 Appropriate techniques, tools and equipment to measure components \n2.14 Units of measurement and numerical operations/calculations within the \nscope of this unit \n2.15 Codes, standards, legislative or regulatory requirements applicable to \nthe measuring equipment and/or calibration \n2.16 Procedures for initiating the calibration of measuring equipment \n2.17 Physical reference standard against which the measuring equipment is \nto be calibrated \n2.18 Procedures for calibrating measuring instruments \n2.19 Tools and equipment required to calibrate measuring equipment \n2.20 Procedures for recording calibration details \n2.21 Reasons for keeping calibration records \n2.22 Procedures to be followed when measuring equipment is found to be \nout of calibration \n2.23 Reasons for checking results from out of calibration measuring \nequipment \n2.24 Procedures for reporting out of calibration measuring equipment \n2.25 Hazards and control measures associated with inspection, including \nhousekeeping \n2.26 Use and application of personal protective equipment \n2.27 Safe work practices and procedures\n \n3. Underpinning \nskills \n3.1 Reading, interpreting and following information on standard operating \nprocedures and other applicable reference documents \n3.2 Checking and clarifying task-related information \n3.3 Entering and maintaining information onto proformas and  standard \nworkplace forms and records \n3.4 Checking for conformance to specifications \n3.5 Using measurement equipment within the scope of this unit \n3.6 Measuring components to specified tolerances \n3.7 Implementing inspection method for the product/ process \n3.8 Monitoring inspection/test procedures to ensure desired outcomes are \nachieved \n3.9 Monitoring environmental conditions \n3.10 Checking calibration of measuring equipment \n3.11  initiating calibration of measuring equipment \n3.12 Calibrating measuring equipment against the appropriate reference\n\n--- PDF PAGE 33 ---\nTR Process Inspection NC II \nPromulgated \n- 29 - \nstandard \n3.13 Detecting and reporting out-of-calibration equipment \n3.14 Applying units of measurement and numerical operations/calculations \nwithin the scope of this unit \n3.15 Practicing safety procedures in handling materials, recording and \nreporting associated with performing inspection\n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace area: Real or simulated  \n4.2 Access to all tools, equipment, materials and documentation required \n4.3 Any relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials.\n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct observation with oral questioning \n5.2 Portfolio \n5.3 Third-party report\n \n6. Context of \nassessment \n6.1 \nCompetency must be assessed on the job or in a simulated \nenvironment. \n6.2 \nThe assessment of practical skills must take place after a period of \nsupervised practice and repetitive experience.",
