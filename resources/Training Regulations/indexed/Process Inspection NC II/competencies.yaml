        "source_text": "--- PDF PAGE 40 ---\nTR Process Inspection NC II \nPromulgated \n- 36 - \nUNIT OF COMPETENCY :  \nUSE IMPROVEMENT PROCESSES IN TEAM ACTIVITIES \n \nUNIT CODE  \n \n:  \nALT315304 \n \nUNIT DESCRIPTOR \n: \n This unit covers identifying improvements and/or solving \nproblems, implementing/monitoring the implementation of \nan improvement strategy, and evaluating the improvement. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Identify areas for \nimprovement and/or solve \nproblems \n \n \n1.1 Participation in team is used to select improvement tools \nand methods appropriate to the situation. \n1.2 Teamwork is used to process improvement tools to identify \nimprovements and/or solve problems. \n \n2. Contribute to improvement \nstrategy \n \n \n2.1 Teamwork is used to implement improvement strategies \nas required in accordance with standard operating \nprocedures. \n2.2 In conjunction with work team, further action is \nrecommended as required using standard operating \nprocedures. \n \n3. Monitor implementation of \nimprovement \n \n \n3.1 Performance is monitored for change, utilizing feedback \ndata.  \n3.2 Analytical tools are used to monitor improvement as \nrequired. \n3.3 In conjunction with work team, further action is \nrecommended where required using standard operating \nprocedures.\n\n--- PDF PAGE 41 ---\nTR Process Inspection NC II \nPromulgated \n- 37 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. \nImprovement tools and \nmethods \n \n \n \n1.1 Flow charts \n1.2 Cause and effect diagrams \n1.3 Pareto charts \n1.4 Histograms \n1.5 Run charts and graphs \n1.6 Control charts  \n1.7 Scattergrams etc. \n \n2. \nImprovement strategies \n \n2.1 PDCA (Plan, Do, Check, Act) procedures \n2.2 Six Sigma techniques \n2.3 Root Cause Analysis etc.\n\n--- PDF PAGE 42 ---\nTR Process Inspection NC II \nPromulgated \n- 38 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Identified areas for improvement and/or solve problems \n1.2 Contributed to improvement strategy \n1.3 Monitored implementation of improvement\n \n2. Underpinning \nknowledge \n \n2.1 Roles and functions of self and team members \n2.2 Team discussion and problem solving processes \n2.3 Improvement tools and methods and their application \n2.4 Procedures for using process improvement tools in the \nteam environment \n2.5 Improvement strategies \n2.6 Procedures for implementing the improvement strategies \n2.7 Individual's role in implementing improvement strategies \n2.8 Procedures for initiating further action \n2.9 Procedures for collecting and collating improvement feedback data \n2.10 Analytical tools and processes to evaluate the improvement \nstrategy\n \n3. Underpinning skills \n \n3.1 Participating and communicating in a team setting \n3.2 Identifying improvements and/or solving problems in a team setting \n3.3 Implementing improvement strategies in a team setting \n3.4 Recommending further action in accordance with standard operating \nprocedures \n3.5 Collecting and collating feedback data \n3.6 Evaluating the improvement strategy implemented \n3.7 Reading, interpreting information on written job instructions, \nspecifications, charts, lists, drawings and other applicable reference \ndocuments \n3.8 Planning and sequencing tasks \n3.9 Checking and clarifying information \n3.10 Entering information onto workplace documents \n3.11 Following verbal instructions\n \n4. Resource \nimplications \n \nThe following resources MUST be provided: \nWorkplace area: Real or simulated  \n4.1 Access to all tools, equipment, materials and documentation required\n4.3 Any relevant workplace procedures, product and manufacturing \nspecifications, codes, standards, manuals and reference materials.\n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Portfolio \n5.3 Third party report \n \n6. Context of \nassessment \n6.1 Competency must be assessed on the job or in a simulated \nenvironment. \n6.2 The assessment of practical skills must take place after a period of \nsupervised practice and repetitive experience.\n",
