  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 The National Qualification of Dental Hygiene NC IV covers the competency\nrequirements for practicing as a Registered Dental Hygienist under the\nPhilippine Dental Act of 2007 (RA 9484)\n\n4.2 In accordance with Section 13 of Republic Act 9484 examination and licensing\nof Dental Hygienists shall be administered by the Board of Dentistry of the\nProfessional Regulations Commission.\n\n4.3 In accordance with Section 14 of Republic Act 9484 and its IRR, applicants for\nadmission to the licensure examination at the time of filing his/her application\nmust:\n\n4.3.1 be a citizen of the Philippines;\n4.3.2 possess good moral character;\n4.3.3 have finished the two years certificate in dental hygiene conferred by a\nrecognized and legally constituted college, or school of dentistry\nregistered with TESDA: Transcript of Records and Certificate with\nindication of graduation date and S.O. if required shall be submitted with\nthe application;\n4.3.4 have undergone on-the-job (OJT) training in a registered/accredited\ndental laboratory for at least six months: Certificate of completion on the\nOJT shall be submitted with the application; and/or\n4.3.5 have completed the refresher course required after failing three\nconsecutive licensure examinations. A refresher course shall be taken in\nPRC accredited dental school which be posted in the PRC Application\nDivision; and a certificate thereon shall be submitted with the application.\n\n--- PDF PAGE 104 ---\nTR Dental Hygiene NC IV\n\n101\n\nCOMPETENCY MAP – HEALTH CARE SECTOR (DENTAL HYGIENE) NC IV)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in workplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop teams and\nindividuals\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high\nstandard of patient\nservices\nProcess reusable\ninstruments and\nequipment in health\nwork\nPrepare for and assist\nwith oral health care\nprocedures\nAssist with\nadministration in dental\npractice\nMaintain an effective\nrelationship with\ncustormers and clients\nManage own\nperformance\nFollow occupational\nhealth and safety\npolicies in dental\npractice\nMaintain infection\ncontrol in dental\npractice\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end\nusers location\nAssist in patient\nmobility\n\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\n\nPerform basic life support\n\nMaintain life support\nequipment and resources\nImplement safe access\nand extrication\nprocedures in an\nemergency\nManage request for\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic\nambulance\ncommunication skills\n\nSupervise on-road\noperations\nManage the scene of a\nspecial event\nManage routine scene\nDeliver pre-hospital\npatient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\n\n--- PDF PAGE 105 ---\nTR Dental Hygiene NC IV\n\n102\n\nDrive vehicles under\noperational conditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a\ncommunity\ndevelopment\nframework\nPrepare for work in the\ncommunity service industry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education\nprogram in the\ncommunity\nImplement health promotion\nand community interventions\nFabricate models\nFabricate custom\nimpression trays\nFabricate registration\nbite rims\nArticulate models and\ntransfer records\nFabricate mouthguard\nFabricate metal crown\nand bridge structures\nFabricate ceramic\nrestorations\nFabricate indirect\ncomposite/polymer fixed\nrestorations\nJoin alloy structures\nPerform oral\nexamination\nPromote oral health and\nhygiene\nOperate dental\nradiographic equipment\nApply the principle of\nradiation biology and\nprotection in dental\npractice\nPerform scaling and\npolishing\nMaintain dental records\nand resources\nProvide effective\npatient/client service\n\n--- PDF PAGE 106 ---\nTR Dental Hygiene NC IV\n\n103\n\nDEFINITION OF TERMS\n\nABUTMENT\n-\nTooth or teeth that support a fixed or removable bridge\nANTERIOR TEETH\n-\nthe six upper or six lower front teeth (canines, laterals & central\nincisors)\nAPEX\n-\nthe tip of the root of a tooth\nARCH\n-\ndescribes the alignment of the upper or lower teeth\nARTICULATE\n-\nto unite by forming a joint or joints\nARTICULATOR\n-\na mechanical device representing the temporomandibular joints and\njaw members to which casts of the mouth\nBASE\n-\ncement placed under a dental restoration to insulate the pulp (nerve\nchamber)\nBITE\n-\nrelationship of the upper and lower teeth on closure (occlusion)\nBONDING\n-\nadhesive dental restoration technique; a tooth-colored composite resin\nto repair and/or change the color or shape of a tooth\nBRACES\n-\ndevices used by orthodontists to gradually reposition teeth to a more\nfavorable alignment\nBRIDGE\n-\nstationary dental prosthesis (appliance) fixed to teeth adjacent to a\nspace; replaces one or more missing teeth, cemented or bonded to\nsupporting teeth or implants adjacent to the space\nCANTILEVER BRIDGE -\nfixed bridge that attaches to adjacent teeth only on one end\nCAP\n-\ncommon term for dental crown\nCLASP\n-\ndevice that retains a removable partial denture to stationary teeth; can\nbe metal or acrylic (matches teeth and gums)\nCROSS BITE\n-\nreverse biting relationship of upper and lower teeth; aka \"under bite,\"\nas in Class III malocclusuion (prognathic jaw)\nCROWN\n\n(1) the portion of a tooth above the gum line;\n(2) dental restoration covering all or most of the natural tooth\nCUSTOM IMPRESION\nTRAY\n-\nan impression tray made from a preliminary impression used to\nmake the final impression\nDENTAL WAXES\n-\n wax compounds used in dentistry are mixtures of individual waxes of\nmaterials or synthetic origin. As with all other dental materials, each\ncomponent n the mixture is selected to given specific properties best\nsuited for the procedure being performed\nDENTURE\n-\nremovable (partial or complete) set of artificial teeth\nDIASTEMA\n-\nopen space between teeth\nDISTAL\n-\nfarthest from any point of reference\nDUPLICATE\n-\nidentically copied from an original\nFABRICATE\n-\nto make; create; to construct by combining or assembling\nFACE-BOW FORK\n- a device used to attach the face-bow to an occlusion rim for a face-\nbow transfer\n\n--- PDF PAGE 107 ---\nTR Dental Hygiene NC IV\n\n104\n\nFACING\n-\ntooth colored overlay on the visible portion of a crown; may be acrylic,\ncomposite or porcelain\nFILLING\n-\nrestoration of lost tooth structure with metal, porcelain or resin\nmaterials\nFULL DENTURE\n-\nremovable dental prosthesis (appliance) replacing all upper or lower\nteeth\nFULL MOUTH\nRECONSTRUCTION\n-\nextensive restorations of natural teeth with crowns and or fixed bridges\nto manage restorative and bite problems.\nGYPSUM\n-\nis the common name for calcium sulfate dehydrate. Gypsum products\nare more frequently used on laboratory procedures than any other\nsingle group of compounds. Controlled variations in the manufacturing\nof gypsum products yield a group of dental materials including plaster,\nartificial stone (hydrosol), disc stone, casting investment and soldering\ninvestment\nIMPRESSION\n-\nmold made of the teeth and soft tissues\nINLAY\n-\nindirect – filling made by a dental laboratory that is cemented or\nbonded into place,\ndirect – placement of dental composite resin, or porcelain restoration\nat chairside\nINTEROCCLUSAL\n-\nspace between upper and lower teeth\nJACKET\n-\ncrown for a front tooth, usually made of porcelain\nLAMINATE\n-\nthin plastic or porcelain veneer produced in a dental laboratory and\nthen bonded to a tooth\nMALOCCLUSION\n-\n“bad bite” or misalignment of the upper and lower teeth\nMARGIN\n-\ninterface between a restoration and tooth structure\nMARYLAND BRIDGE\n-\na bridge that is bonded to the back of the adjacent teeth; requires\nminimum tooth reduction\nMODEL\n-\na material used extensively for making impressions. It contains\nshellac, talc, glycerin, wax, tallow and palm oil\nOVERBITE\n-\nvertical overlap of the front teeth; deep bite\nPARTIAL DENTURE\n-\nremovable dental prosthesis (appliance) replacing one or more natural\nteeth\nPONTIC\n-\nreplacement tooth mounted on a fixed or removal appliance\nPORCELAIN CROWN\n-\nall porcelain restoration covering the coronal portion of tooth (above\nthe gum line)\nPORCELAIN FUSED\nTO METAL (PFM)\nCROWN\n-\nrestoration with metal coping (for strength) covered by porcelain (for\nappearance)\nPORCELAIN INLAY\nOR ONLAY\n-\ntooth-colored restoration made of porcelain, cemented or bonded in\nplace\n\n--- PDF PAGE 108 ---\nTR Dental Hygiene NC IV\n\n105\n\nPORCELAIN\nVENEERS\n-\na thin layer of porcelain, fabricated by a laboratory) bonded to a\nnatural tooth to replace lost tooth structure, close spaces, straighten\nteeth or change color and/or shape\nPROSTHESIS\n\nan artificial appliance for the replacement for a body part, tooth or\nteeth\nSOLDERING\nINVESTMENT\n-\na soldering investment is similar in composition to a casting\ninvestment that has a\nSPLINT\n-\nconnection of two or more teeth so they function as a stronger single\nstructure\n\n--- PDF PAGE 109 ---\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to experts/partners from business, industry,\nacademe and government agencies, non-government organizations including\nprofessional associations who donated their time and expertise to the development\nand validation of these Training Regulations.\n\nDR. MANOLO AGUILA\n\nDean College of Dentistry\n\nDe Ocampo Memorial College\n\nRamon Magsaysay Blvd., Manila\n\nDr. HOMER J. ROMERO\n\nFaculty\n\nDe Ocampo Memorial College\n\nRamon Magsaysay Blvd., Manila\n\nDR. JOLOISE LOPEZ\n\nFaculty\n\nDe Ocampo Memorial College\n\nRamon Magsaysay Blvd., Manila\n\nDR. ENCARNACION SALES\nFaculty\n\nDe Ocampo Memorial College\n\nRamon Magsaysay Blvd., Manila\n\nDR. RANNY F. REYES\n\nDean , College of Dentistry\n\nNational University\n\n551 M.F. Jhocson, Manila\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe Management and Staff of the TESDA Secretariat\n\n--- PDF PAGE 110 ---\nList of Published Training Regulations\n❑\nAnimal Production NC II\n❑\nAquaculture NC II\n❑\nAutomotive Body Painting/Finishing NC II\n❑\nAutomotive Body Repair NC II\n❑\nAutomotive Engine Rebuilding NC II\n❑\nAutomotive Servicing NC II\n❑\nBartending NC II\n❑\nBuilding Wiring Installation NC II\n❑\nCaregiving NC II\n❑\nCarpentry NC II\n❑\nCommercial Cooking NC II\n❑\nComputer Hardware Servicing NC II\n❑\nDeck Seafaring NC II\n❑ Dental Hygiene NC IV\n❑\nDental Laboratory Technology Services NC I\n❑\nDental Laboratory Technology Services(Removable Dentures/Appliances) NC II\n❑\nDental Laboratory Technology Services(Fixed Dentures/Restorations) NC II\n❑\nDental Technology NC IV\n❑\nDressmaking NC II\n❑\nDriving NC II\n❑\nEngine Seafaring NC II\n❑\nFood and Beverage Services NC II\n❑\nFootwear Making NC II\n❑\nHeavy Equipment Operation NC II\n❑\nHorticulture NC II\n❑\nHousehold Services NC II\n❑\nHousekeeping NC II\n❑\nHealth Care Services NC II\n❑\nMachining NC II\n❑\nMasonry NC II\n❑\nMotorcycle and Small Engine Servicing NC II\n❑\nPerforming Arts (Dance) NC II\n❑\nPerforming Arts (Song) NC II\n❑\nPlumbing NC II\n❑\nPyrotechnics NC II\n❑\nRAC Servicing NC I\n❑\nRAC Servicing NC II\n❑\nSecurity Services NC II\n❑\nTailoring NC II\n❑\nTour Guiding Services NC II\n❑\nTransport RAC Servicing NC II\n❑\nTravel Services NC II\n❑\nWelding NC II\n\n--- PDF PAGE 111 ---\nThese materials are available in both printed and electronic\ncopies.\nFor more information please contact:\nTechnical Education and Skills Development Authority\n(TESDA)\nTelephone Nos.: 893-8303, 893-2139; 817-4076 to 82 loc. 615\nto 617\nor visit our website: www.tesda.gov.ph"
