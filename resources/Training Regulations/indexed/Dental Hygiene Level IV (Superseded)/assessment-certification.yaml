  "arrangements": [
    {
      "number": "4.1",
      "text": "The National Qualification of Dental Hygiene NC IV covers the competency requirements for practicing as a Registered Dental Hygienist under the Philippine Dental Act of 2007 (RA 9484)"
    },
    {
      "number": "4.2",
      "text": "In accordance with Section 13 of Republic Act 9484 examination and licensing of Dental Hygienists shall be administered by the Board of Dentistry of the Professional Regulations Commission."
    },
    {
      "number": "4.3",
      "text": "In accordance with Section 14 of Republic Act 9484 and its IRR, applicants for admission to the licensure examination at the time of filing his/her application must: 4.3.1 be a citizen of the Philippines; 4.3.2 possess good moral character; 4.3.3 have finished the two years certificate in dental hygiene conferred by a recognized and legally constituted college, or school of dentistry registered with TESDA: Transcript of Records and Certificate with indication of graduation date and S.O. if required shall be submitted with the application; 4.3.4 have undergone on-the-job (OJT) training in a registered/accredited dental laboratory for at least six months: Certificate of completion on the OJT shall be submitted with the application; and/or 4.3.5 have completed the refresher course required after failing three consecutive licensure examinations. A refresher course shall be taken in PRC accredited dental school which be posted in the PRC Application Division; and a certificate thereon shall be submitted with the application."
    }
