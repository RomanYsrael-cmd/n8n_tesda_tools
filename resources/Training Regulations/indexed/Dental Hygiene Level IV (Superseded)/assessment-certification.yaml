  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 The National Qualification of Dental Hygiene NC IV covers the competency\nrequirements for practicing as a Registered Dental Hygienist under the\nPhilippine Dental Act of 2007 (RA 9484)\n\n4.2 In accordance with Section 13 of Republic Act 9484 examination and licensing\nof Dental Hygienists shall be administered by the Board of Dentistry of the\nProfessional Regulations Commission.\n\n4.3 In accordance with Section 14 of Republic Act 9484 and its IRR, applicants for\nadmission to the licensure examination at the time of filing his/her application\nmust:\n\n4.3.1 be a citizen of the Philippines;\n4.3.2 possess good moral character;\n4.3.3 have finished the two years certificate in dental hygiene conferred by a\nrecognized and legally constituted college, or school of dentistry\nregistered with TESDA: Transcript of Records and Certificate with\nindication of graduation date and S.O. if required shall be submitted with\nthe application;\n4.3.4 have undergone on-the-job (OJT) training in a registered/accredited\ndental laboratory for at least six months: Certificate of completion on the\nOJT shall be submitted with the application; and/or\n4.3.5 have completed the refresher course required after failing three\nconsecutive licensure examinations. A refresher course shall be taken in\nPRC accredited dental school which be posted in the PRC Application\nDivision; and a certificate thereon shall be submitted with the application.\n\n--- PDF PAGE 104 ---\nTR Dental Hygiene NC IV\n\n101\n\n"
}
