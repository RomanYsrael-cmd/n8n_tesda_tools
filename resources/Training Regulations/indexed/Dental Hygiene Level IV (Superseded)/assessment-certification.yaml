ic properties best suited for the procedure being performed - removable (partial or complete) set of artificial teeth - open space between teeth - farthest from any point of reference - identically copied from an original - to make; create; to construct by combining or assembling - a device used to attach the face-bow to an occlusion rim for a face- bow transfer --- PDF PAGE 107 --- TR Dental Hygiene NC IV 104 - tooth colored overlay on the visible portion of a crown; may be acrylic, composite or porcelain - restoration of lost tooth structure with metal, porcelain or resin materials - removable dental prosthesis (appliance) replacing all upper or lower teeth - extensive restorations of natural teeth with crowns and or fixed bridges to manage restorative and bite problems. - is the common name for calcium sulfate dehydrate. Gypsum products are more frequently used on laboratory procedures than any other single group of compounds. Controlled variations in the manufacturing of gypsum products yield a group of dental materials including plaster, artificial stone (hydrosol), disc stone, casting investment and soldering investment - mold made of the teeth and soft tissues - indirect – filling made by a dental laboratory that is cemented or bonded into place, direct – placement of dental composite resin, or porcelain restoration at chairside - space between upper and lower teeth - crown for a front tooth, usually made of porcelain - thin plastic or porcelain veneer produced in a dental laboratory and then bonded to a tooth - “bad bite” or misalignment of the upper and lower teeth - interface between a restoration and tooth structure - a bridge that is bonded to the back of the adjacent teeth; requires minimum tooth reduction - a material used extensively for making impressions. It contains shellac, talc, glycerin, wax, tallow and palm oil - vertical overlap of the front teeth; deep bite - removable dental prosthesis (appliance) replacing one or more natural teeth - replacement tooth mounted on a fixed or removal appliance - all porcelain restoration covering the coronal portion of tooth (above the gum line) TO METAL (PFM) - restoration with metal coping (for strength) covered by porcelain (for appearance) - tooth-colored restoration made of porcelain, cemented or bonded in place --- PDF PAGE 108 --- TR Dental Hygiene NC IV 105 - a thin layer of porcelain, fabricated by a laboratory) bonded to a natural tooth to replace lost tooth structure, close spaces, straighten teeth or change color and/or shape an artificial appliance for the replacement for a body part, tooth or teeth - a soldering investment is similar in composition to a casting investment that has a - connection of two or more teeth so they function as a stronger single structure --- PDF PAGE 109 --- The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to experts/partners from business, industry, academe and government agencies, non-government organizations including professional associations who donated their time and expertise to the development and validation of these Training Regulations. DR. MANOLO AGUILA Dean College of Dentistry De Ocampo Memorial College Ramon Magsaysay Blvd., Manila Dr. HOMER J. ROMERO Faculty De Ocampo Memorial College Ramon Magsaysay Blvd., Manila DR. JOLOISE LOPEZ Faculty De Ocampo Memorial College Ramon Magsaysay Blvd., Manila DR. ENCARNACION SALES Faculty De Ocampo Memorial College Ramon Magsaysay Blvd., Manila DR. RANNY F. REYES Dean , College of Dentistry National University 551 M.F. Jhocson, Manila Members of the TESDA Board The Management and Staff of the TESDA Secretariat --- PDF PAGE 110 --- List of Published Training Regulations ❑ Animal Production NC II ❑ Aquaculture NC II ❑ Automotive Body Painting/Finishing NC II ❑ Automotive Body Repair NC II ❑ Automotive Engine Rebuilding NC II ❑ Automotive Servicing NC II ❑ Bartending NC II ❑ Building Wiring Installation NC II ❑ Caregiving NC II