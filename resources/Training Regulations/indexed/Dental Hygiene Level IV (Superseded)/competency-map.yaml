  "source_text": "SECTION 1 DENTAL HYGIENE NC IV\n\nThis DENTAL HYGIENE NC IV consists of competencies relating to rendering oral\nhealth promotion and preventive measures, performing oral examination and prophylaxis,\ntaking brief clinical history, taking radiographs, giving oral-health education to patients,\nmanaging dental records and resources and providing effective patient/client service.\nThe Units of Competency comprising this qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311115\nUtilize specialized communication skills\n500311116\nDevelop teams and individuals\n500311117\nApply problem solving techniques in the workplace\n500311118\nCollect, analyze and organize information\n500311119\nPlan and organize work\n500311120\nPromote environmental protection\n\nUNIT CODE\nCOMMON COMPETENCIES\nHCS516201\nMaintain an effective relationship with customers and clients\nHCS516202\nManage own performance\nHCS322201\nMaintain instruments and equipment in work area\nHCS322204\nFollow occupational health and safety policies in dental laboratory facilities\nHCS322205\nMaintain infection control in dental practice\nHCS323203\nApply basic first aid\nICT311201\nOperate a personal computer\n\nUNIT CODE\nCORE COMPETENCIES\nHCS322343\nPerform oral examination\nHCS322344\nPromote oral health and hygiene\nHCS322345\nOperate a dental radiographic equipment\nHCS322346\nApply the principle of radiology biology and protection in dental practice\nHCS322347\nPerform scaling and polishing\nHCS322348\nMaintain dental records and resources\nHCS322349\nProvide effective patient/client service\n\nOccupational/Job titles corresponding to this qualification may include:\n\n❑ Dental Hygienist\n❑ Dental Assistant\n\nThe national practice of this qualification requires a license from the Board of Dentistry –\nProfessional Regulation Commission.\n\n--- PDF PAGE 6 ---\nTR Dental Hygiene NC IV\n\n2"
