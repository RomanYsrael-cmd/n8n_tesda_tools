        "source_text": "--- PDF PAGE 83 ---\nTR Dental Hygiene  NC IV                      \n \n \n79\n \nUNIT OF COMPETENCY \nMAINTAIN DENTAL RECORDS AND RESOURCES \nUNIT CODE \nHCS322348 \nUNIT DESCRIPTOR \nThis unit covers the knowledge, skills and attitudes required \nto maintain patients/clients dental records and resources. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Maintain patient’s \nrecords \n1.1  Patient’s/client’s vital signs are measured and \nrecorded in accordance with clinic procedures. \n1.2  Patient’s/client’s chief complaint are probed and \nrecorded in accordance with clinic procedures. \n1.3  Where applicable patient/client is rescheduled for \nanother appointment to dental specialist or medical \nspecialist. \n1.4  Returning patient’s/client’s record/dental history is \nretrieved and referred to where appropriate. \n1.5  Patient’s/client’s dental history/record is updated based \non hygienist or dentist’s findings. \n2. Maintain financial \nrecords of the clinic \n2.1  Payments are received and recorded in accordance \nwith accounting procedures \n2.2  Billings and other related communications are \nprepared and sent to health insurance and other \ncompanies \n2.3  Payments of patient’s/clients are monitored \n3. Purchase dental \nproducts \n3.1  Stocks are inventoried/monitored for replenishment \n3.2  Dental equipment and materials are procured in \naccordance with established procedures \n3.3  Purchased dental equipment and materials are \ninspected /tested and returned to suppliers where \nnecessary \n3.4  Dental materials and equipment are documented and \nstored/safekept in appropriate area/location  \n4.  Monitor quality control \n4.1  Service quality standards is established according to \nlegal requirements, patient’s/client’s requirements and \ndental policy \n4.2  Quality of service is monitored and ensured during \ndelivery processes \n4.3  Client feedbacks are solicited, recorded and analyzed \nin accordance with quality requirements\n\n--- PDF PAGE 84 ---\nTR Dental Hygiene  NC IV                      \n \n \n80\n \n4.  Comply with dental \nethics and \njurisprudence \n4.1  Key elements of major legal systems affecting \nbusiness to dental clinic operations are examined to \nensure full compliance under legal and legislative \nprovisions \n4.2  Various issues affecting different forms of contract \nare compared within business operations  \n4.3 Statutory and legal requirements for the delivery of \ndental services are determined across the industry    \n4.4 Dental products are handled and stored according to \nstandards, policies and procedures, and safety \npractices \n4.5  Compliance with standards on current dental services, \nmaterials and equipments are monitored in accordance \nwith statutory and legal requirements\n\n--- PDF PAGE 85 ---\nTR Dental Hygiene  NC IV                      \n \n \n81\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1.  Vital signs \nIt includes: \n1.1 Blood Pressure \n1.2 Heart Rate \n1.3 Pulse Rate \n2.  Findings \nIt includes: \n2.1 Poor oral hygiene \n2.2 Halitosis \n2.3  Dental Caries \n2.4  Gingivitis \n2.5  Periodontitis \n2.6  Abrasion, Attrition, Erosion \n2.7  Heavy Stains \n3.  Payments \n3.1  Cash \n3.2  Installment \n3.3  Post dated cheques \n3.4  Health insurance claims \n4.  Billings and other related \ncommunications \n4.1  Client billings \n4.2  Health card billings \n4.3  Follow-up/Demand letter \n5.  Legal requirements \nMay include but are not limited to: \n5.1 Types of products and services provided \n5.2 Size, type and location of business \n5.3 Characteristics of specific products or services \n5.4 Worksite-specific context, variations and  \nenvironments \n6.  Legal systems \nMay include but are not limited to: \n6.1 Workplace relations \n6.2 Industry codes and practices \n6.3 License, patent or copyright arrangements \n \n7.  Legal and legislative \nprovisions \nMay include but are not limited to: \n7.1   Dental Law \n7.2 Occupational Health and Safety (OHS) \n7.3 Workplace relations \n7.4 Workers’ compensations \n7.5 Equal employment opportunity (EEO) \n7.6 Environmental protection legislation \n \n8.  Different forms of \ncontract \nMay include but are not limited to: \n8.1  Letters of appointments or intent \n8.2 Memorandum of agreement \n8.2.1 External contracts \n8.2.2 Written contracts \n8.3 Terms of payment agreement \n8.4 Purchase order \n8.5 Petty cash\n\n--- PDF PAGE 86 ---\nTR Dental Hygiene  NC IV                      \n \n \n82\n \n9.  Satutory and legal \nrequirements \nMay include but are not limited to: \n9.1 Equal Employment Opportunity (EEO) \n9.2  Disciplinary procedures \n9.3  Awards and agreements \n9.4  Wages and conditions \n9.5  OHS \n9.6  Anti-discrimination \n9.7  Company policies and procedures\n\n--- PDF PAGE 87 ---\nTR Dental Hygiene  NC IV                      \n \n \n83\nEvidence Guide \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Maintained patient’s records \n1.2 Maintained financial records of the clinic \n1.3 Purchased dental products \n1.4 Monitored quality control \n1.5 Complied with dental ethics and jurisprudence in \naccordance with legal and legislative provisions \n1.6 Demonstrated knowledge on dental law, and other \nrelevant legal and statutory requirements \n2. Underpinning \nknowledge  \n2.1  Dental Act of 2007 (RA No. 9484) \n2.2  Relevant standards, policy and procedures on dental \nhygiene practices \n2.3  Relevant statutory and legal requirements \n2.4  Human resource development  \n2.5  Staffing performance appraisals \n2.6  Employee relations \n2.7  Maintenance Program/Procedures for dental equipment \nand facilities \n2.8  Dental Ethics and Jurisprudence \n2.9  Occupational Health and Safety (OHS) \n3. Underpinning skills \n3.1  Interpersonal communication skills \n3.2  Monitoring staff performance \n3.3  Conducting performance appraisal \n