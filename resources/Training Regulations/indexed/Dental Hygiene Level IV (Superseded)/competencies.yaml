  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in DENTAL HYGIENE NC IV.\n\nBASIC COMPETENCIES\nUNIT OF COMPETENCY\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\nUNIT CODE\n500311115\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required\nto use specialized communication skills to meet specific\nneeds of internal and internal clients, conduct interviews,\nfacilitate group of discussions, and contribute to the\ndevelopment of communication strategies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n1.1\nSpecific communication needs of clients and colleagues are\nidentified and met\n1.2\nDifferent approaches are used to meet communication needs\nof clients and colleagues\n1.3\nConflict is addressed promptly and in a timely way and in a\nmanner which does not compromise the standing of the\norganization\n2. Contribute to\nthe\ndevelopment of\ncommunication\nstrategies\n2.1\nStrategies for internal and external dissemination of\ninformation are developed, promoted, implemented and\nreviewed as required\n2.2\nChannels of communication are established and reviewed\nregularly\n2.3\nCoaching in effective communication is provided\n2.4\nWork related network and relationship are maintained as\nnecessary\n2.5\nNegotiation and conflict resolution strategies are used where\nrequired\n2.6\nCommunication with clients and colleagues is appropriate to\nindividual needs and organizational objectives\n3. Represent the\norganization\n3.1\nWhen participating in internal or external forums, presentation\nis relevant, appropriately researched and presented in a\nmanner to promote the organization\n3.2\nPresentation is clear and sequential and delivered within a\npredetermined time\n3.3\nUtilize appropriate media to enhance presentation\n3.4\nDifferences in views are respected\n3.5\nWritten communication is consistent with organizational\nstandards\n3.6\nInquiries are responded in a manner consistent with\norganizational standard\n\n--- PDF PAGE 7 ---\nTR Dental Hygiene NC IV\n\n3\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Facilitate group\ndiscussion\n4.1\nMechanisms which enhance effective group interaction is\ndefined and implemented\n4.2\nStrategies which encourage all group members to participate\nare used routinely\n4.3\nObjectives and agenda for meetings and discussions are\nroutinely set and followed\n4.4\nRelevant information is provided to group to facilitate\noutcomes\n4.5\nEvaluation of group communication strategies is undertaken\nto promote participation of all parties\n4.6\nSpecific communication needs of individuals are identified\nand addressed\n5. Conduct\ninterview\n5.1\nA range of appropriate communication strategies are\nemployed in interview situations\n5.2\nRecords of interviews are made and maintained in\naccordance with organizational procedures\n5.3\nEffective questioning, listening and nonverbal communication\ntechniques are used to ensure that required message is\ncommunicated\n\n--- PDF PAGE 8 ---\nTR Dental Hygiene NC IV\n\n4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\n1.1\nRecognizing own limitations\n1.2\nReferral to specialists\n1.3\nUtilizing techniques and aids\n1.4\nProviding written drafts\n1.5\nVerbal and non verbal communication\n2. Effective group\ninteraction\n2.1\nIdentifying and evaluating what is occurring within an\ninteraction in a non judgmental way\n2.2\nUsing active listening\n2.3\nMaking decision about appropriate words, behavior\n2.4\nPutting together response which is culturally appropriate\n2.5\nExpressing an individual perspective\n2.6\nExpressing own philosophy, ideology and background and\nexploring impact with relevance to communication\n3. Types of Interview\n3.1\nRelated to staff issues\n3.2\nRoutine\n3.3\nConfidential\n3.4\nEvidential\n3.5\nNon disclosure\n3.6\nDisclosure\n4. Interview situations\n4.1\nEstablish rapport\n4.2\nElicit facts and information\n4.3\nFacilitate resolution of issues\n4.4\nDevelop action plans\n4.5\nDiffuse potentially difficult situation\n\n--- PDF PAGE 9 ---\nTR Dental Hygiene NC IV\n\n5\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated effective communication skills with clients\naccessing service and work colleagues\n1.2\nAdopted relevant communication techniques and strategies to\nmeet client particular needs and difficulties\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nDynamics of groups and different styles of group leadership\n2.3\nCommunication skills relevant to client groups\n\n3. Underpinning\nskills\n3.1\nFull range of communication techniques including:\n3.1.1\nFull range of communication\n3.1.2\nActive listening\n3.1.3\nFeedback\n3.1.4\nInterpretation\n3.1.5\nRole boundaries setting\n3.1.6\nNegotiation\n3.1.7\nEstablishing empathy\n3.2\nCommunication skills required to fulfill job roles as specified\nby the organization\n\n4. Resource\nimplications\n4.1\nAccess to appropriate workplace where assessment can take\nplace\n\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1\nDirect observation\n5.2\nOral Interview\n\n6. Context of\nassessment\n6.1\nThis unit should be assessed on the job through simulation\n\n--- PDF PAGE 10 ---\nTR Dental Hygiene NC IV\n\n6\n\nUNIT OF COMPETENCY\nDEVELOP TEAMS AND INDIVIDUALS\nUNIT CODE\n500311116\nUNIT DESCRIPTOR\nThis unit covers the skills, knowledge and attitudes required to\ndetermine individual and team development needs and facilitate\nthe development of the workgroup.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\n Range of Variables\n1. Provide team\nleadership\n1.1.\nLearning and development needs are systematically\nidentified and implemented in line with organizational\nrequirements\n1.2.\nLearning plan to meet individual and group training\nand developmental needs is collaboratively developed\nand implemented\n1.3.\nIndividuals are encouraged to self evaluate\nperformance and identify areas for improvement\n1.4.\nFeedback on performance of team members is collected\nfrom relevant sources and compared with established team\nlearning process\n2. Foster individual\nand organizational\ngrowth\n2.1.\nLearning and development program goals and objectives are\nidentified to match the specific knowledge and skills\nrequirements of competency standards\n2.2.\nLearning delivery methods are appropriate to the learning\ngoals, the learning style of participants and availability of\nequipment and resources\n2.3.\nWorkplace learning opportunities and coaching/ mentoring\nassistance are provided to facilitate individual and team\nachievement of competencies\n2.4.\nResources and timelines required for learning activities are\nidentified and approved in accordance with organizational\nrequirements\n3. Monitor and\nevaluate workplace\nlearning\n3.1.\nFeedback from individuals or teams is used to identify and\nimplement improvements in future learning arrangements\n3.2.\nOutcomes and performance of individuals/teams are\nassessed and recorded to determine the effectiveness of\ndevelopment programs and the extent of additional support\n3.3.\nModifications to learning plans are negotiated to improve the\nefficiency and effectiveness of learning\n3.4.\nRecords and reports of competency are maintained within\norganizational requirement\n\n--- PDF PAGE 11 ---\nTR Dental Hygiene NC IV\n\n7\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Develop team\ncommitment and\ncooperation\n4.1.\nOpen communication processes to obtain and share\ninformation is used by team\n4.2.\nDecisions are reached by the team in accordance with its\nagreed roles and responsibilities\n4.3.\nMutual concern and camaraderie are developed in the\nteam\n5. Facilitate\naccomplishment of\norganizational goals\n5.1.\nTeam members actively participated in team activities and\ncommunication processes\n5.2.\nTeams members developed individual and joint\nresponsibility for their actions\n5.3.\nCollaborative efforts are sustained to attain organizational\ngoals\n\n--- PDF PAGE 12 ---\nTR Dental Hygiene NC IV\n\n8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning and\n development needs\n\n1.1\nCoaching, mentoring and/or supervision\n1.2\nFormal/informal learning program\n1.3\nInternal/external training provision\n1.4\nWork experience/exchange/opportunities\n1.5\nPersonal study\n1.6\nCareer planning/development\n1.7\nPerformance appraisals\n1.8\nWorkplace skills assessment\n1.9\nRecognition of prior learning\n2. Organizational\n requirements\n2.1 Quality assurance and/or procedures manuals\n2.2 Goals, objectives, plans, systems and processes\n2.3 Legal and organizational policy/guidelines and\nrequirements\n2.3\nSafety policies, procedures and programs\n2.4\nConfidentiality and security requirements\n2.5\nBusiness and performance plans\n2.6\nEthical standards\n2.7\nQuality and continuous improvement processes\nand standards\n3. Feedback on\n performance\n3.1\n Formal/informal performance appraisals\n3.2\n Obtaining feedback from supervisors and\n colleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for monitoring\nservice delivery\n4. Learning delivery\n methods\n4.1\nOn the job coaching or mentoring\n4.2\nProblem solving\n4.3\nPresentation/demonstration\n4.4\nFormal course participation\n4.5\nWork experience\n4.6\nInvolvement in professional networks\n4.7\nConference and seminar attendance\n4.8\nInduction\n\n--- PDF PAGE 13 ---\nTR Dental Hygiene NC IV\n\n9\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for others\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the team\n1.4. Negotiated learning plans to improve the effectiveness of\nlearning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Underpinning\nknowledge\n2.1. Coaching and mentoring principles\n2.2. Understanding how to work effectively with team members\nwho have diverse work styles, aspirations, cultures and\nperspective\n2.3. Understanding how to facilitate team development and\nimprovement\n2.4. Understanding methods and techniques for eliciting and\ninterpreting feedback\n2.5. Understanding methods for identifying and prioritizing\npersonal development opportunities and options\n2.6. Knowledge of career paths and competency standards in the\nindustry\n3. Underpinning\nskills\n3.1. Ability to read and understand a variety of texts, prepare\ngeneral information and documents according to target\naudience; spell with accuracy; use grammar and punctuation\neffective relationships and conflict management\n3.2. Communication skills including receiving feedback and\nreporting, maintaining effective relationships and conflict\nmanagement\n3.3. Planning skills to organize required resources and equipment\nto meet learning needs\n3.4. Coaching and mentoring skills to provide support to\ncolleagues\n3.5. Reporting skills to organize information; assess information\nfor relevance and accuracy; identify and elaborate on\nlearning outcomes\n3.6. Facilitation skills to conduct small group training sessions\n3.7. Ability to relate to people from a range of social, cultural,\nphysical and mental backgrounds\n\n--- PDF PAGE 14 ---\nTR Dental Hygiene NC IV\n\n10\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Observation of work activities of the individual member in\nrelation to the work activities of the group\n5.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 15 ---\nTR Dental Hygiene NC IV\n\n11\n\nUNIT OF COMPETENCY\nAPPLY PROBLEM SOLVING TECHNIQUES IN THE\nWORKPLACE\nUNIT CODE\n500311117\nUNIT DESCRIPTOR\nThis competency covers the knowledge, skills and attitudes\nrequired to apply the process of problem solving and other\nproblems beyond those associated directly with the process\nunit. It includes the application of structured processes and\nimprovement tools. This competency is typically performed by\nan experienced technician, team leader or supervisor.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nAnalyze the problem\n1.1. Issues/concerns are evaluated based on data gathered\n1.2. Possible causes of problem are identified within the area\nof responsibility as based on experience and the use\nof problem solving tools/analytical techniques\n1.3 Possible cause statements are developed based on\nfindings\n2.\nIdentify possible\nsolutions\n2.1 All possible options are considered for resolution of the\nproblem in accordance with safety and operating\nprocedures\n2.2 Strengths and weaknesses of possible options are\nconsidered\n2.3 Corrective action is determined to resolve the problem\nand its possible future causes\n3.\nRecommend solution\nto higher\nmanagement\n3.1 Report/communication or documentation are prepared\n3.2 Recommendations are presented to appropriate\npersonnel\n3.3 Recommendations are followed-up, if required\n4.\nImplement solution\n4.1 Measurable objectives are identified\n4.2 Resource needs are identified\n4.3 Timelines are identified in accordance with plan\n5.\nEvaluate/Monitor\nresults and outcome\n5.1. Processes and improvements are identified based on\nevaluative assessment of problem\n5.2. Recommendations are prepared and submitted to\nsuperiors.\n\n--- PDF PAGE 16 ---\nTR Dental Hygiene NC IV\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Area of responsibility\nVariables may include but are limited to:\n1.1.\nWork environment\n1.2.\nProblem solution processes\n1.3.\nPreventative maintenance and diagnostic policy\n1.4.\nRoles and technical responsibilities\n\n2. Occupational Health and\nSafety\n2.1.\nAs per company, statutory and vendor\nrequirements. Ergonomic and environmental factors\nmust be considered during the demonstration of this\ncompetency.\n3. Communication\n3.1.\nVariables may include but are not limited to:\n3.2.\nWritten communication can involve both hand\nwritten and printed material, internal memos,\nelectronic mail, briefing notes and bulletin boards.\n4. Documentation\n4.1.\nAudit trails\n4.2.\nNaming standards\n4.3.\nVersion control\n\n--- PDF PAGE 17 ---\nTR Dental Hygiene NC IV\n\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Analyzed the problem\n1.2. Identified possible solutions\n1.3. Implemented solutions\n1.4. Recommended solutions to higher management\n1.5. Outcome evaluated/monitored\nEvidence of satisfactory performance in this unit can be obtained\nby observation of performance and questioning to indicate\nknowledge and understanding of the elements of the competency\nand performance criteria.\n2. Underpinning\nknowledge\n2.1. Broad understanding of systems, organizational systems\nand functions\n2.2. Broad knowledge of help desk and maintenance practices\n2.3. Current industry accepted hardware and software products\nwith broad and detailed knowledge of its general features\nand capabilities\n2.4. Broad knowledge of the operating system\n2.5. Broad knowledge of the client business domain\n2.6. Broad knowledge based incorporating current industry\npractices related to escalation procedures\n2.7. Broad knowledge based of diagnostic tools\n2.8 . General principles of OHS\n2.8. Divisional/unit responsibilities\n3. Underpinning\nskills\n3.1. Decision making within a limited range of options.\n3.2. Communication is clear, precise and varies according to the\ntype of audience\n3.3. Teamwork in reference to personal responsibility\n3.4. Time management as applied to self-management.\n3.5. Analytical skills in relation to routine malfunctions.\n3.6. General customer service skills displayed.\n3.7. Questioning and active listening is employed to clarify\ngeneral information\n\n--- PDF PAGE 18 ---\nTR Dental Hygiene NC IV\n\n14\n\n4. Resource\nimplications\n4.1. Assessment will require access to an operating plant\nover an extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios/case studies/what ifs will\nbe required as well as bank of questions which will be\nused to probe the reasoning behind the observable\nactions.\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1. Through direct observation of application to tasks and\nquestions related to underpinning knowledge\nUnder general guidance, checking various stages of operation\nand at the completion of the activity against performance\ncriteria and specifications\n\n6. Context of\nassessment\n6.1. Competency may be assessed in the work place or in a\nsimulated work place setting\n6.2. Assessment shall be carried out through TESDA’s\nAccredited Assessment Centers/Venues while tasks are\nundertaken either individually or as part of a team under\nlimited supervision\n\n--- PDF PAGE 19 ---\nTR Dental Hygiene NC IV\n\n15\n\nUNIT OF COMPETENCY\nCOLLECT, ANALYZE AND ORGANIZE INFORMATION\nUNIT CODE\n500311118\nUNIT DESCRIPTOR\nThis unit covers the outcomes required to process, analyze,\ninterpret and organize workplace information and other\nrelevant data.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study information\nrequirements\n\n1.1 Needs are identified using established research\nprocedures\n1.2 Relevant forms and recording systems are used to gather\nthe information.\n1.3 Respondents are selected to implement survey / research\nbased on established procedures.\n2. Process data\n\n2.1 Data are collected and collated based on the prescribed\nmethod.\n2.2 Relevant data are used as references in accordance with\nthe objectives of the program.\n2.3 Information is compiled according to the required form.\n3. Analyze, interpret and\norganize information\ngathered\n\n3.1 Data are analyzed using relevant methodologies\n3.2 Where applicable, statistical analysis/methods are\nemployed according to the objectives of the program\n3.3 Graphs and other visual presentations are prepared to\nfacilitate analysis / interpretation of information\n\n4. Present findings/\nrecommendations\n\n4.1 Findings/recommendations summarized and\npresented/packaged in user-friendly manner\n4.2 Relevant inputs gathered to finalize report\n4.3 Draft report prepared based on standard format.\n4.4 Technical reports are submitted and disseminated to\nconcerned offices.\n\n--- PDF PAGE 20 ---\nTR Dental Hygiene NC IV\n\n16\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n\n1. Research procedures\nMay include but are not limited to:\n1.1 TNA\n1.2 Front-end analysis\n1.3 Surveys\n1.4 Interviews\n1.5 Functional analysis\n1.6 DACUM research\n\n2. Forms\nMay include but are not limited to:\n2.1 Survey forms/Questionnaires\n2.2 Personal information/Profile\n2.3 Accident report form\n2.4 Requisition slip\n2.5 Job orders\n2.6 Purchase request form\n2.7 Incident report form\n3. Methodologies\n3.1 Qualitative methods\n3.2 Quantitative methods\n4. Statistical\nanalysis/methods\n4.1. Averages (Mean, Median, Mode)\n4.2. Percentage\n4.3. Ranks\n4.4. Frequency Distribution\n4.5 Statistical test\n5. Data\n5.1. Raw Data\n6. Information\n6.1. Processed and packaged data\n\n--- PDF PAGE 21 ---\nTR Dental Hygiene NC IV\n\n17\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Determined information requirements based on organizational goals\nand objectives.\n1.2 Used relevant forms and recording systems to gather data\n1.3 Processed data based on the objectives of the program\n1.4 Utilized relevant research methods based on the objective of the\nprogram\n1.5 Analyzed and organized information gathered\n1.6 Submitted/Disseminated technical reports to concerned offices\n2. Underpinning\nknowledge\n2.1 Data processing, Information analysis and interpretation\n2.2 Research methods\n2.2.1 Qualitative\n2.2.2 Quantitative\n2.2.3 Statistical\n2.3 Report writing\n2.4 Use of relevant software\n2.4.1 Spreadsheets\n2.4.2 Presentation graphics\n2.4.3 Work processor\n2.4.4 Statistical package\n3. Underpinning skills 3.1 Communicating effectively\n3.2 Performing research and analysis\n3.3 Reading / interpreting data and information\n3.4 Problem solving\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Access to office equipment and facilities relevant to the unit\n4.3 Case studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written/ Oral Examination\n5.2 Interviews\n5.3 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or TESDA\nAccredited Assessment Center\n\n--- PDF PAGE 22 ---\nTR Dental Hygiene NC IV\n\n18\n\nUNIT OF COMPETENCY\nPLAN AND ORGANIZE WORK\nUNIT CODE\n500311119\nUNIT DESCRIPTOR\nThis unit covers the outcomes required in planning and\norganizing work. It may be applied to a small independent\noperation or to a section of a large organization.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSet objectives\n1.1\nObjectives are consistent with and linked to work\nactivities in accordance with organizational aims\n1.2\nObjectives are stated as measurable targets with clear\ntime frames\n1.3\nSupport and commitment of team members are\nreflected in the objectives\n1.4\nRealistic and attainable objectives are identified\n2.\nPlan and schedule work\nactivities\n2.1\nTasks/work activities to be completed are identified and\nprioritized as directed\n2.2\nTasks/work activities are broken down into steps in\naccordance with set time frames achievable\ncomponents in accordance with set time frames\n2.3\nResources are allocated as per requirements of the\nactivity\n2.4\nSchedule of work activities is coordinated with\npersonnel concerned\n3.\nImplement work plans\n3.1\nWork methods and practices are identified in\nconsultation with personnel concerned\n3.2\nWork plans are implemented in accordance with set\ntime frames, resources and standards\n4.\nMonitor work activities\n4.1\nWork activities are monitored and compared with set\nobjectives\n4.2\nWork performance is monitored\n4.3\nDeviations from work activities are reported and\nrecommendations are coordinated with appropriate\npersonnel and in accordance with set standards\n4.4\nReporting requirements are complied with in accordance\nwith recommended format\n4.5\nObserve timeliness of report\n4.6\nFiles are established and maintained in accordance with\nstandard operating procedures\n\n--- PDF PAGE 23 ---\nTR Dental Hygiene NC IV\n\n19\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n5.\nReview and evaluate\nwork plans and\nactivities\n5.1\nWork plans, strategies and implementation are reviewed\nbased on accurate, relevant and curre