        "source_text": "HCS322346\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required\nto minimize the risk of radiation to the client, the operator and\nothers during the exposure of a prescribed dental\nradiographic image. It also describes the quality assurance\nmeasures necessary to ensure all radiographs are of\nconsistent diagnostic standard.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply knowledge of\nionizing radiation to\nproduce a dental\nradiograph\n\n1.1 Knowledge of X-ray properties is demonstrated in\naccordance with occupational health and safety policies\nand procedures in minimizing radiation risks.\n1.2 Technical variables of dental X-ray generating equipment\nare identified and selected in accordance with\nmanufacturer’s specifications and client requirements\n1.3 The main components of tubehead are identified\n1.4 Appropriate technique for the type of cone is identified\nand selected\n2. Apply knowledge of\nradiation biology to\nprotect client, operator\nand others from\nionizing radiation\n\n2.1 Knowledge of the biological effects and risks associated\nwith X-rays are applied in accordance with safe work\npractices in minimizing radiation risks to operator, clients\nand others.\n2.2 Immediate and long term effects of radiation are\ninterpreted in accordance with radiation policies and\nprocedures\n2.3 Units of radiation measurement are applied in\naccordance with radiation policies and procedures\n2.4 Radiation safety measures for the patient, operator\nand others are implemented in accordance with\nestablished procedures\n3. Determine image\ncharacteristics of a\ndental radiographic\nimage to minimize the\nnecessity for retake\n3.1 Visual qualities of the radiograph are ensured of a\ndiagnostic standard\n3.2 Geometric qualities of the radiograph are ensured of a\ndiagnostic standard\n\n--- PDF PAGE 74 ---\nTR Dental Hygiene NC IV\n\n70\n\n4. Minimize radiation by\nmaintaining quality in\nprocessing\n\n4.1 Contents of the film package are identified and\ndetermined in accordance to its usage\n4.2 Quality assurance for processing dental radiographic\nimages are maintained in accordance with OH&S policies\nand procedures\n4.3 Quality assurance processes for the use of radiographic\nchemicals are followed in accordance with\nmanufacturer’s specifications\n4.4 Appropriate conditions for manual and automatic\nprocessing are maintained in accordance with\nmanufacturer’s specifications\n4.5 A range of processing errors are identified and\ncorrective measures are implemented to produce a\ndiagnostic radiograph\n\n--- PDF PAGE 75 ---\nTR Dental Hygiene NC IV\n\n71\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1 X-ray properties\n\nMay include but are not limited to:\n1.1 The intensity of the diagnostic x-ray beam\n1.2 The quality of the diagnostic x-ray beam\n2 Safe work\npractices\n\nMay include:\n2.1 Current code of practice for radiation protection in dentistry\n2.2 Legislative requirements\n2.3 Dental practice/organization policies and procedures\n2.4 DOH Guidelines for Operation of Radiographic Equipment\n3 Units of radiation\nmeasurement\n\nMay include:\n3.1 Radiation absorbed dose\n3.2 Equivalent dose\n3.3 Effective dose\n3.4 Collective affective dose\n3.5 Dose rate\n4 Radiation safety\nmeasures for the\nclient, operator\nand others\n\n4.1 Radiation safety measures for client includes but are not\nlimited to:\n-\nUse of lead apron\n-\nAppropriate technique\n-\nFilm selection\n-\nTechnical features of the radiographic unit as determined\nby manufacturer specifications including kilovoltage,\nfiltration, x-ray beam collimation\n-\nUse of film locating devices\n-\nCorrect processing procedures to minimize retakes\n-\nLegislative requirements and code of practice\n4.2 Radiation safety measures for the operator and others\nincludes but is not limited to:\n-\nMaximum permissible dose (MPD) of radiation\n-\nDetermination of pregnancy\n-\nDistance from primary beam\n-\nUse of lead line barriers\n-\nMaintenance of radiographic equipment\n-\nLegislative requirements\n5 Geometric\ncharacteristics of\nthe image\nMay include:\n5.1 Blurred image due to motion of patient\n5.2 Distortion due to incorrect technique\n\n--- PDF PAGE 76 ---\nTR Dental Hygiene NC IV\n\n72\n\n6 Quality\nassurance for\nprocessing\nMay include but are not limited to:\n6.1 Image quality assessment\n6.2 X-ray equipment and appropriate maintenance\n6.3 Darkroom and image receptors including x-ray film an cassettes\n6.4 Processing\n6.5 Working procedures\n7 Processing\nerrors\nMay include:\n7.1 Film is too dark\n7.2 Film that is too light\n7.3 Film with inadequate or low contrast\n7.4 Film that is marked\n\n--- PDF PAGE 77 ---\nTR Dental Hygiene NC IV\n\n73\n\nEVIDENCE GUIDE\n1 Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Applied knowledge of ionizing radiation to produce a dental\nradiograph\n1.2 Applied knowledge of radiation biology to protect patients,\noperator and others from ionizing radiation\n1.3 Determined image characteristics of a dental radiographic\nimage to minimize re-takes\n1.4 Minimized radiation by maintaining quality in processing\n1.5 Demonstrated consistent compliance with infection control\nguidelines and legislative requirements\n1.6 Demonstrated consistent performance over the required range\nof workplace situations including:\n-\ncorrect preparation of clients for dental radiographic\nimaging procedures\n-\napplication of radiation occupational health and safety\npolicies and procedures to minimize the risk of radiation to\nthe patient, operator and others during the exposure of a\nprescribed dental radiographic image\n-\nimplementation of quality assurance measures to ensure\nproduction of radiographs to consistent diagnostic standard\n2 Underpinning\nknowledge\n\nKnowledge in:\n2.1 Code of practice for radiation protection in dentistry:\n-\nprocedures for minimizing radiation risks to patients, self,\nthe oral health care team and the public\n-\nmethods for monitoring the adequacy of radiation\nprotection\n-\nthe organization’s quality assurance policy for producing\nradiographs to a consistent diagnostic standard\n-\nthe purpose of quality assuring dental radiographs and its\nrelationship to radiation protection\n2.2 Production, properties and interaction of the x-rays including:\n-\nbasic knowledge of atomic physics\n-\nmain features and practical requirements of the x-ray tube\n-\nthe sequence of events that result in the production of x-\nrays\n-\nhazards associated with x-rays including the mechanism by\nwhich x-rays cause damage to human tissues\n2.3 Biological effects and risks associated with x-rays including:\n-\nimmediate or acute effects\n-\nlong terms or chronic effects\n2.4 Units of radiation measurements\n2.5 Radiographic appearance of anatomic landmarks, normal\ndentition and associated bony structures\n2.6 Reasons for processing and technique inaccuracies and\nmethods to minimize errors\n\n--- PDF PAGE 78 ---\nTR Dental Hygiene NC IV\n\n74\n\n3 Underpinning\nskills\n\n3.1 Using safe work practices to minimize the risk of transmission\nof infection\n3.2 Using correct accessories in dental radiographic techniques\n3.3 Minimizing technical inaccuracies in dental radiographic\nimages\n3.4 Minimizing errors and maintaining quality assurance in\nprocessing procedures\n3.5 Applying correct dental terminology\n3.6 Selecting appropriate film variables including:\n-\nfilm speed\n-\nfilm size\n-\nintensifying screens\n3.7 Selecting and using correct techniques including:\n-\nbisecting angle (intraoral)\n-\nparalleling (intraoral)\n-\nextraoral\n\n4 Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 A real or simulated dental clinic environment\n4.2 Access to dental radiographic imaging units and resources\nnormally used in the workplace\n4.3 Relevant dental practice/organization policy and procedures\nmanuals such as:\n-\nincident reporting procedures\n-\ninfection control guidelines\n-\nOH&S policies and procedures\n4.4 Relevant national/local legislation\n4.5 Manufacturer’s specifications for dental radiographic units\n4.6 Radiographic viewing equipment\n4.7 A qualified workplace assessor\n\n5 Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Oral interview\n5.3 Third party report\n5.4 Portfolio (authenticated evidence of relevant work experience\nand/or formal/informal learnings\n6 Context of\nassessment\n\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 79 ---\nTR Dental Hygiene NC IV\n\n75\n\nUNIT OF COMPETENCY:\nPERFORM SCALING AND POLISHING\nUNIT CODE:"
