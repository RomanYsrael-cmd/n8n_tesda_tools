        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety practices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with dental clinic facilities,\nproducts and services\n1.7 Applied dental clinic rules and standards\n1.8 Applied telephone ethics\n1.9 Applied correct procedure in using telephone, fax\nmachine, internet\n1.10 Handled patient/client complaints\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with\nsincerity\n2.2 Safety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3 Attitude\n 2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4 Theory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n3. Underpinning Skills\n3.1 Effective communication skills\n3.2 Non-verbal communication - body language\n3.3 Good time management\n3.4 Ability to work calmly and unobtrusively effectively\n3.5 Ability to handle telephone inquiries and\n conversations\n3.6 Correct procedure in handling telephone inquiries\n3.7 Proper way of handling complaints\n\n--- PDF PAGE 92 ---\nTR Dental Hygiene NC IV\n\n88\n\n4. Resource\nImplications\n4.1 Availability of telephone, fax machine, internet, etc.\n4.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3 Availability of office supplies\n5. Methods of\nAssessment\n5.1 Written examination\n5.2 Practical demonstration\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 93 ---\nTR Dental Hygiene NC IV\n\n89"
        },
        "source_text": "HCS322349\nUNIT DESCRIPTOR\nThis unit of competency deals with the knowledge, skills and\nattitudes in providing effective patient/client service. It\nincludes greeting patient/client, identifying patient/client\nneeds, delivering service to patient/client, handling queries\nthrough telephone, fax machine, internet and email and\nhandling complaints, evaluation and recommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Greet patient/client\n1.1 Patient’s/client’s are greeted in line with dental\nprocedure\n1.2 Verbal and non-verbal communications are\nappropriate to the given situation\n1.3 Non verbal communication of patient/client is\nobserved responding to patient/client\n1.4 Sensitivity to cultural and social differences is\ndemonstrated\n2. Identify patient/client\nneeds\n2.1 Appropriate interpersonal skills are used to ensure\nthat patient/client needs are accurately identified\n2.2 Patient/client needs are assessed for urgency so\nthat priority for dental service delivery can be\nidentified\n2.3 Patient/client are provided with information regarding\ndental procedures\n2.4 Personal limitation in addressing patient/client needs\nis identified and where appropriate, assistance is\nsought from dentist\n\n3. Deliver dental service to\npatient/client\n3.1 Patient/client needs are promptly attended to in line\nwith dental procedures\n3.2 Appropriate rapport is maintained with patient/client\nto enable high quality dental service\n3.3 Opportunity to enhance the quality of dental services\nare taken wherever possible\n\n--- PDF PAGE 89 ---\nTR Dental Hygiene NC IV\n\n85\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n4. Handle queries through\ntelephone, fax machine,\ninternet and email\n4.1 Use telephone, computer, fax machine, internet\nefficiently to determine patient/client requirements\n4.2 Queries/ information are recorded in line with\ndental procedure\n4.3 Queries are acted upon promptly and correctly in\nline with dental procedure\n5. Handle complaints,\nevaluation and\nrecommendations\n5.1 Patient/clients are greeted with a smile and eye-\nto-eye contact\n5.2 Responsibility for resolving the complaint is taken\nwithin limit of responsibility\n5.3 Nature and details of complaint are established\nand agreed with the patient/client\n5.4 Appropriate treatment is taken to resolve the\ncomplaint to the patient/client satisfaction\nwherever possible\n\n--- PDF PAGE 90 ---\nTR Dental Hygiene NC IV\n\n86\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Non-verbal\ncommunication\n1.1 body language\n1.2 dress and accessories\n1.3 gestures and mannerisms\n1.4 voice tonality and volume\n1.5 use of space\n1.6 culturally specific communication customs and\npractices\n2. Cultural and social\ndifferences\nIncludes but are not limited to :\n2.1 modes of greeting, farewelling and conversation\n2.2 body language/ use of body gestures\n2.3 formality of language\n3. Interpersonal skills\n3.1 interactive communication\n3.2 public relation\n3.3 good working attitude\n3.4 sincerity\n3.5 pleasant disposition\n3.6 effective communication skills\n4. Patient/client needs\nPatient/client with specific needs may include :\n4.1 those with a disability\n4.2 those with special cultural or language needs\n4.3 unaccompanied children\n4.4 parents with young children\n4.5 pregnant women\n4.6 single women\n5. Dental clinic procedure\nDental clinic procedures may include :\n5.1 modes of greeting and farewell\n5.2 addressing the person by name\n5.3 time-lapse before a response\n5.4 style manual requirements\n5.5 standard letters and proforma\n\n--- PDF PAGE 91 ---\nTR Dental Hygiene NC IV\n\n87\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety practices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with dental clinic facilities,\nproducts and services\n1.7 Applied dental clinic rules and standards\n1.8 Applied telephone ethics\n1.9 Applied correct procedure in using telephone, fax\nmachine, internet\n1.10 Handled patient/client complaints\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with\nsincerity\n2.2 Safety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3 Attitude\n 2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4 Theory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n3. Underpinning Skills\n3.1 Effective communication skills\n3.2 Non-verbal communication - body language\n3.3 Good time management\n3.4 Ability to work calmly and unobtrusively effectively\n3.5 Ability to handle telephone inquiries and\n conversations\n3.6 Correct procedure in handling telephone inquiries\n3.7 Proper way of handling complaints\n\n--- PDF PAGE 92 ---\nTR Dental Hygiene NC IV\n\n88\n\n4. Resource\nImplications\n4.1 Availability of telephone, fax machine, internet, etc.\n4.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3 Availability of office supplies\n5. Methods of\nAssessment\n5.1 Written examination\n5.2 Practical demonstration\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 93 ---\nTR Dental Hygiene NC IV\n\n89"
      }
