          "source_text": "1 \nMonitor and \nmaintain the \ncleanliness of the \ndental laboratory  \n \n2.1 \nAppropriate personal protective wear is used during \ncleaning of equipment and surfaces. \n2.2 \nAppropriate disinfectants and cleaning equipment are \nselected, prepared and used on surfaces in accordance with \nthe manufacturer’s specification. \n2.3 \nUsed surface covers, if applicable, are removed and \nreplaced in a manner to prevent cross contamination. \n2.4 \nCleaning equipment is correctly stored. \n2.5 \nAll surfaces including internal storage units within the \ndental laboratory are monitored and maintained for \ncleanliness. \n2 \nClean and disinfect \ndental laboratory \n/instruments and \nequipment  \n2.1 \nDental laboratory instruments and equipment are cleaned of \nbio-burden and lubricated, where appropriate, prior to \ncleaning and disinfecting. \n2.2 \nDental laboratory instruments and equipment are checked \nfor faults and disassembled where appropriate. \n2.3 \nPrior to cleaning of dental laboratory instruments and \nequipment are loaded safely and effectively. \n2.4 \nAppropriate cleaning procedures are carried out in the \ncorrect sequence and duration in accordance with \nmanufacturer specifications. \n2.5 \nRegular maintenance program including faults and \nincidences are recognized, reported and documented.\n\n--- PDF PAGE 44 ---\nTR Dental Hygiene  NC IV                      \n \n \n40\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3 \nMaintain hygiene \nand personal \nprotection  \n \n3.1 \nHand washing procedures are correctly followed. \n3.2 \nOpen cuts and abrasions are covered with a waterproof \ndressing. \n3.3 \nAppropriate personal protection wear is correctly worn. \n3.4 \nImmunization is undertaken in accordance with current \nrecommendations for dental health care worker. \n3.5 \nAll work is carried out in a manner that minimizes the risk of \ncross contamination and complies with OHS policy and \nprocedures. \n3.6 \nHazards in the dental laboratory is recognized and reported \nto operator. \n3.7 \nAppropriate procedures for dealing with accidents, including \nsharp injuries, are followed correctly. \n4 \nDispose of dental \nlaboratory waste \nsafely \n4.1 \nAppropriate protective clothing is worn or used in \naccordance with OHS policy and procedures when handling \nwaste. \n4.2 \nWaste is segregated, contained, stored and transported \ncorrectly. \n4.3 \nDamaged and/or pre-packed items are disposed of safely. \n4.4 \nWaste is disposed of safely. \n5 \nUndertake the \nnecessary \nmeasures to \nensure prevention \nof transmission of \ninfection \n5.1 \nRisks of cross contamination are identified and appropriate \nresponses implemented within dental practice. \n5.2 \nClean, contaminated and administrative zones are clearly \nidentified and maintained. \n5.3 \nInstruments, materials, medicaments and equipment are set \nup prior to commencement of treatment where appropriate. \n5.4 \nOne-way workflow from clean to dirty zone is maintained. \n5.5 \nRisk of transmission of infection is minimized in all dental \nlaboratory related and administrative procedures. \n5.6 \nSpills are removed correctly.\n\n--- PDF PAGE 45 ---\nTR Dental Hygiene  NC IV                      \n \n \n41\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nInfection \ncontrol \nguidelines and \nprocedures \nMay include but are not limited to: \n1.1 \nCurrent DOH guidelines for infection control in health care \nsettings \n1.2 \nStandard Precautions and Additional Precautions as defined \nby DOH \n1.3 \nDental laboratory practice/organizational policy procedures \nand infection control guidelines and procedures \n1.4 \nMaterial Safety Data Sheets (MSDS) \n1.5 \nLocal government ordinances \n1.6 \nLegislative requirements \n2. \nPersonal \nprotective wear \nMay include but not limited to: \n2.1 \nSterile and non sterile gloves including heavy duty \n2.2 \nMasks \n2.3 \nEye protection \n2.4 \nEnclosed footwear \n2.5 \nGowns \n2.6 \nAprons \n3. \nCleaning \nequipment \nMay include but is not limited to: \n3.1 \nUltrasonic cleaner \n3.2 \nManual cleaning with a range of brushes \n3.3 \nDrying  \n3.4 \nBuckets and mops \n4 \nWaste \nsegregation \nMay include but is not limited to: \n4.1 \nClinical and related waste \n4.2 \nInfectious waste \n4.3 \nSharps \n4.4 \nGeneral waste \n4.5 \nOther hazardous substances \n5 \nRequirements \nfor safe \ndisposal of \nwaste \nMay be determined by: \n5.1 \nMain drainage \n5.2 \nLocal government ordinances \n5.3 \nMaterial Safety Data Sheet (MSDS)\n\n--- PDF PAGE 46 ---\nTR Dental Hygiene  NC IV                      \n \n \n42"
