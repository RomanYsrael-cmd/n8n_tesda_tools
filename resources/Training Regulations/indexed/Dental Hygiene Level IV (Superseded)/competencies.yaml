        "source_title": "APPLY BASIC FIRST AID",
        "source_text": "--- PDF PAGE 48 ---\nTR Dental Hygiene  NC IV                      \n \n \n44\n \nUNIT OF COMPETENCY \nAPPLY BASIC FIRST AID \nUNIT CODE \nHCS323203 \nUNIT DESCRIPTOR \nThis unit covers the knowledge, skills and attitudes required to \nprovide an initial response where First Aid is required. In this \nunit it is assumed that the First Aider is working under \nsupervision and / or according to established workplace First-\nAid procedures and policies. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Assess the situation \n1.1 \nPhysical hazards to self and casualty’s health and \nsafety are identified. \n1.2 \nImmediate risks  to self and casualty’s occupational  \nhealth and safety (OSH )are minimized by controlling \nthe hazard in accordance with OSH requirements. \n1.3 \nCasualty’s vital signs and physical condition are \nassessed in accordance with workplace procedures. \n2.  Apply basic first aid \ntechniques \n2.1 \nFirst Aid management is provided in accordance with \nestablished First Aid procedures. \n2.2 \nCasualty is reassured in a caring and calm manner and \nmade comfortable using available resources. \n2.3 \nFirst Aid assistance is sought from others in a timely \nmanner and as appropriate. \n2.4 \nCasualty’s condition is monitored and responded to in \naccordance with effective First-Aid principles and \nworkplace procedures. \n2.5 \nDetails of casualty’s physical condition, changes in \nconditions, management and response are accurately \nrecorded in line with organizational procedures. \n2.6 \nCasualty management is finalized according to his/her \nneeds and First Aid principles. \n3.  Communicate details \nof the incident \n1.1 \nAppropriate medical assistance is requested using \nrelevant communication media and equipment. \n1.2 \nDetails of casualty’s condition and management \nactivities are accurately conveyed to emergency \nservices/relieving personnel. \n1.3 \nReports to supervisors are prepared in a timely \nmanner, presenting all relevant facts according to \nestablished company procedures.\n\n--- PDF PAGE 49 ---\nTR Dental Hygiene  NC IV                      \n \n \n45\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. First Aid Management \nThis may include but is not limited to: \n1.1 \nWorkplace policies and procedures \n1.2 \nIndustry/site specific regulations, codes \n1.3 \nOSH \n1.4 \nState and territory workplace health and safety \nrequirements \n1.5 \nAllergies the casualty may have \n2.  Physical Hazards \nPhysical hazards may include: \n2.1 \nWorkplace hazards \n2.2 \nEnvironmental hazards \n2.3 \nProximity of other people \n2.4 \nHazards associated with casualty management \nprocesses \n3.  Risks \nRisks may include: \n3.1 \nWorksite equipment, machinery and substances \n3.2 \nEnvironmental risks \n3.3 \nBodily fluids \n3.4 \nRisk of further injury to the casualty \n3.5 \nRisk associated with the proximity of the others and \nbystanders \n2. Casualty’s Condition \nCasualty’s condition may include but be not limited to the \nfollowing: \n4.1 \nAbdominal injuries \n4.2 \nAllergic reactions \n4.3 \nBleeding \n4.4 \nBurns-thermal, chemical, friction, electrical \n4.5 \nCardiac conditions \n4.6 \nChemical contamination \n4.7 \nCod injuries \n4.8 \nCrush injuries \n4.9 \nDislocations \n4.10 Drowning \n4.11 Eye injuries \n4.12 Fractures \n4.13 Head injuries \n4.14 Epilepsy \n4.15 Minor skin injuries \n4.16 Neck and spinal injuries \n4.17 Needle stick injuries \n4.18 Poisoning and toxic substances \n4.19 Shock \n4.20 Smoke inhalation\n\n--- PDF PAGE 50 ---\nTR Dental Hygiene  NC IV                      \n \n \n46\n \n5. Equipment and \nResources \nEquipment and other resources may include: \n5.1 \nDefibrillation units \n5.1 \nPressure bandages \n5.2 \nThermometers \n5.3 \nFirst Aid kit \n5.4 \nEyewash \n5.5 \nThermal blankets \n5.6 \nPocket face masks \n5.7 \nRubber gloves \n5.8 \nDressing \n5.9 \nSpace device \n5.10 Cervical collars \n6. Communication \nSystem \n6.1 \nMobile phone \n6.2 \nSatellite phones \n6.3 \nHF/VHF radio \n6.4 \nFlags \n6.5 \nFlares \n6.6 \nTwo-way radio \n6.7 \nEmail \n6.8 \nElectronic equipment \n7. Vital Signs \n7.1 \nBreathing \n7.2 \nCirculation \n7.3 \nConsciousness \n8. First Aid Principles \n8.1 \nChecking the site for danger to self, casualty and \nothers and minimizing the danger \n8.2 \nChecking and maintaining the casualty’s airways, \nbreathing and circulation\n\n--- PDF PAGE 51 ---\nTR Dental Hygiene  NC IV                      \n \n \n47\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nComplied with institutional requirements, OSH laws \ninfections control and manual handling procedures and \nrelevant health regulations \n1.2 \nIdentified physical hazards of the casualty and \nminimized immediate risks \n1.3 \nAssessed and monitored the physical condition of the \ncasualty \n1.4 \nResponded to emergency using basic life support \nmeasures \n1.5 \nProvided initial response where First Aid is required \n1.6 \nDealt with complex casualties or incidents \n1.7 \nPrepared reports to concerned personnel in a timely \nmanner \n2. Underpinning \nknowledge  \n2.1 \nBasic anatomy and physiology \n2.2 \nCompany standard operating procedures (sops) \n2.3 \nDealing with confidentiality \n2.4 \nKnowledge of the First Aiders’ skills limitations \n2.5 \nOSH legislation and regulations \n2.6 \nHow to gain access to and interpret material safety \ndata sheets \n3. Underpinning skills \n3.1 \nResuscitation \n3.2 \nSafe manual handling of casualty \n3.3 \nConsideration of the welfare of the casualty \n3.4 \nReport preparation \n3.5 \nCommunication skills \n3.6 \nInterpreting and using listed documents \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant work station \n4.2 \nRelevant institutional policies, guidelines procedure and \nprotocol \n4.3 \nEquipment and materials relevant to the proposed \nactivities \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nThird-Party report \n5.4 \nPortfolio \n6. Context of \nassessment \n6.1 \nAssessment may be done in a workplace or simulated \nwork area setting.\n",
