        "source_title": "PLAN AND ORGANIZE WORK",
        "source_text": "--- PDF PAGE 22 ---\nTR Dental Hygiene  NC IV                      \n \n \n18\n \nUNIT OF COMPETENCY \nPLAN AND ORGANIZE WORK \nUNIT CODE \n500311119 \nUNIT DESCRIPTOR \nThis unit covers the outcomes required in planning and \norganizing work.  It may be applied to a small independent \noperation or to a section of a large organization. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nSet objectives \n1.1 \nObjectives are consistent with and linked to work \nactivities in accordance with organizational aims \n1.2 \nObjectives are stated as measurable targets with clear \ntime frames \n1.3 \nSupport and commitment of team members are \nreflected in the objectives   \n1.4 \nRealistic and attainable objectives are identified  \n2. \nPlan and schedule work \nactivities \n2.1 \nTasks/work activities to be completed are identified and \nprioritized as directed \n2.2 \nTasks/work activities are broken down into steps in \naccordance with set time frames achievable \ncomponents in accordance with set time frames \n2.3 \nResources are allocated as per requirements of the \nactivity \n2.4 \nSchedule of work activities is coordinated with \npersonnel concerned \n3. \nImplement work plans \n3.1 \nWork methods and practices are identified in \nconsultation with personnel concerned \n3.2 \nWork plans are implemented in accordance with set \ntime frames, resources and standards \n4. \nMonitor work activities \n4.1 \nWork activities are monitored and compared with set \nobjectives \n4.2 \nWork performance is monitored \n4.3 \nDeviations from work activities are reported and \nrecommendations are coordinated with appropriate \npersonnel and in accordance with set standards \n4.4 \nReporting requirements are complied with in accordance \nwith recommended format \n4.5 \nObserve timeliness of report \n4.6 \nFiles are established and maintained in accordance with \nstandard operating procedures\n\n--- PDF PAGE 23 ---\nTR Dental Hygiene  NC IV                      \n \n \n19\n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n5. \nReview and evaluate \nwork plans and \nactivities \n5.1 \nWork plans, strategies and implementation are reviewed  \nbased on accurate, relevant and current information \n5.2 \nReview is based on comprehensive consultation with \nappropriate personnel on outcomes of work plans and \nreliable feedback \n5.3 \nResults of review are provided to concerned parties and \nformed as the basis for adjustments/simplifications to be \nmade to policies, processes and activities \n5.4 \nPerformance appraisal is conducted in accordance with \norganization rules and regulations \n5.5 \nPerformance appraisal report is prepared and \ndocumented regularly as per organization requirements. \n5.6 \nRecommendations are prepared and presented to \nappropriate personnel/authorities \n5.7 \nFeedback mechanisms are implemented in line with \norganization policies\n\n--- PDF PAGE 24 ---\nTR Dental Hygiene  NC IV                      \n \n \n20\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Objectives  \n1.1. Specific \n1.2. General \n2. Resources \n2.1. Personnel \n2.2. Equipment and technology \n2.3. Services \n2.4. Supplies and materials \n2.5. Sources for accessing specialist advice \n2.6. Budget \n3. Schedule of work activities \n3.1. Daily \n3.2. Work-based \n3.3. Contractual \n3.4. Regular \n3.5.    Confidential  \n3.6.     Disclosure \n3.7.     Non-disclosure \n4. Work methods and \npractices \n4.1. Work methods and practices may include but not \nlimited to: \n4.2. Legislated regulations and codes of practice \n4.3. Industry regulations and codes of practice \n4.4. Occupational health and safety practices   \n5. Work plans \n5.1. Daily work plans \n5.2. Project plans \n5.3. Program plans \n5.4. Organization strategic and restructuring plans \n5.5. Resource plans \n5.6. Skills development plans \n5.7. Management strategies and objectives\n\n--- PDF PAGE 25 ---\nTR Dental Hygiene  NC IV                      \n \n \n21\n \nVARIABLE \nRANGE \n6. Standards \n6.1. Performance targets \n6.2. Performance management and appraisal systems \n6.3. National competency standards \n6.4. Employment contracts \n6.5. Client contracts \n6.6. Discipline procedures \n6.7. Workplace assessment guidelines \n6.8. Internal quality assurance \n6.9. Internal and external accountability and auditing \nrequirements \n6.10. Training Regulation Standards \n6.11. Safety Standards \n7. Appropriate \npersonnel/authorities \n7.1. Appropriate personnel include: \n7.2. Management \n7.3. Line Staff \n8. Feedback mechanisms \n8.1. Feedback mechanisms include: \n8.2. Verbal feedback \n8.3. Informal feedback \n8.4. Formal feedback \n8.5. Questionnaire \n8.6. Survey \n8.7. Group discussion\n\n--- PDF PAGE 26 ---\nTR Dental Hygiene  NC IV                      \n \n \n22\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nSet objectives \n1.2. \nPlanned and scheduled work activities \n1.3. \nImplemented work plans \n1.4. \nMonitored work activities \n1.5. \nReviewed and evaluated work plans and activities \n2. Underpinning \nknowledge \n2.1. \nOrganization’s strategic plan, policies rules and regulations, \nlaws and objectives for work unit activities and priorities \n2.2. \nOrganizations policies, strategic plans, guidelines related to \nthe role of the work unit \n2.3. \nTeam work and consultation strategies \n3. Underpinning skills \n3.1. \nPlanning  \n3.2. \nLeading \n3.3. \nOrganizing \n3.4. \nCoordinating \n3.5. \nCommunication Skills \n3.6. \nInter-and intra-person/motivation skills \n3.7. \nPresentation skills \n4. Resource \nimplications \nThe following resources MUST be provided \n4.1. \nTools, equipment and facilities appropriate to the proposed \nactivities \n4.2. \nMaterials relevant to the proposed activities \n4.3. \nWork plan schedules \n4.4. \nDrawings, sketches or blueprint \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1. \nDirect observation/questioning \n5.2. \nPractical exercises on Planning and Scheduling Work \nActivities \n5.3. \nThird Party Report (collection of competency evidence) \n6. Context of \nassessment \n6.1. \nCompetency may be assessed in the workplace or in \nsimulated work\n",
