        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified\ntime frame\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge\n2.1\nSight and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills 3.1\nCapacity to plan and prioritize work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3 Observation with questioning\n5.4 Oral questioning/Interview\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 36 ---\nTR Dental Hygiene NC IV\n\n32\n\nUNIT OF COMPETENCY\nMAINTAIN INSTRUMENTS AND EQUIPMENT IN WORK\nAREA\nUNIT CODE"
        },
        "source_text": "HCS516202\nUNIT DESCRIPTOR\nThis unit of competency covers the knowledge, skills and\nattitudes in effectively managing own workload and quality\nwork.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever\npossible.\n1.5\nWork schedules are known and completed with agreed\ntime frames.\n1.6\nWork plans developed according to assignment\nrequirements and employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility\nfor completion passed to incoming shift or other\nappropriate persons.\n\n2. Maintain quality of\nperformance\n2.1\nPersonal performance continually monitored against\nagreed performance standards.\n2.2\nAdvice and guidance sought when necessary to\nachieve or maintain agreed standards.\n2.3\nGuidance from management applied to achieve or\nmaintain agreed standards.\n2.4\nStandard of work clarified and agreed according\nemployer policy and procedures.\n\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to.\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with, recorded and in accordance with\nemployer policy.\n3.3\nClient fully informed of all relevant matters in a timely\nmanner.\n\n--- PDF PAGE 34 ---\nTR Dental Hygiene NC IV\n\n30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n1.1\nMay be identified through:\n1.1.1 Assignment Instructions\n1.1.2 Verbal Instructions by Senior Staff\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n\n2. Performance\nStandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 35 ---\nTR Dental Hygiene NC IV\n\n31\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified\ntime frame\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge\n2.1\nSight and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills 3.1\nCapacity to plan and prioritize work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3 Observation with questioning\n5.4 Oral questioning/Interview\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 36 ---\nTR Dental Hygiene NC IV\n\n32\n\nUNIT OF COMPETENCY\nMAINTAIN INSTRUMENTS AND EQUIPMENT IN WORK\nAREA\nUNIT CODE"
