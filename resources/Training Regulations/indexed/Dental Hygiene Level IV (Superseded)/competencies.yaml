            "of Competency 1.1 Assessment must confirm the ability to utilize software, navigate the desktop, using system features to perform tasks and save results of work. 2. Underpinning Knowledge Knowledge includes: 2.1 Keyboard layout and functions 2.2 Computer functions 2.3 Basic parts of a computer and various hardware components 2.4 Storage devices and file concepts 2.5 Basic software operation and functionalities 3. Underpinning Skills Skills include: 3.1 Saving and retrieving files to and from various folders or disk storage 3.2 Mouse and keyboarding skills for running software applications 3.3 Reading and writing at a level where basic workplace documents are understood 3.4 Clear ability to communicate with peers and supervisors 3.5 Interpretation of user manuals and help functions 3.6 The ability to carry out written and verbal instructions using a personal computer whether standalone or in a networked environment 4. Resource Implications To demonstrate competence in this unit access to the following resources will be required: 4.1 A personal computer 4.2 A printer 4.3 Mouse and keyboard 4.4 Basic systems software 5. Methods of Assessment Competency may be assessed through: 5.1 Observation in a workplace or simulated environment 5.2 Third party reports 5.3 Exams and tests 5.4 Demonstration of required skills 5.5 Interviews 6. Context for Assessment 6.1 Competency may be assessed in the workplace or in a simulated work environment.",
