          "source_text": "1. \nCritical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge of infection risks in health \nenvironment and specifically in dental laboratory practice \n1.2 \nComplied with current DOH infection control guidelines and \nprocedures, OHS and legislative requirements  \n1.3 \nHandled waste safely managed procedures in accordance \nwith legislative requirements \n1.4 \nSelected and used appropriate cleaning agents for particular \nsurfaces and equipment in accordance with the \nmanufacturer’s specifications \n2. \nUnderpinning \nknowledge  \n2.1 \nKnowledge on how infection is spread, cross infection and \nprevention strategies \n2.2 \nKnowledge of relevant OHS policies and procedures \n2.3 \nLimitations, properties and precautions required of \ndisinfectants and decontaminates \n2.4 \nKnowledge of potential hazards in a health environment \n2.5 \nKnowledge of currently available vaccinations against \ntransmissible disease  \n2.6 \nKnowledge of dental laboratory waste disposal methods \n3. \nUnderpinning \nskills \n3.1 \nApplying standard and additional precautions \n3.2 \nUsing safe work practices to minimize the risk of transmission \nof infection \n3.3 \nSelecting and using appropriate chemicals in cleaning and \nsanitizing \n3.4 \nUsing correct hand washing and hand care techniques \n3.5 \nUsing correct hygiene procedures \n3.6 \nSelecting and using equipment and cleaning agents \neffectively \n3.7 \nUsing procedures appropriate to the cleaning area and \npurpose \n3.8 \nMinimizing disruption to the work environment \n3.9 \nMinimizing safety hazards for self and others \n3.10 Using time management strategies to set priorities \n3.11 Using technology to work safely and competently \n4. \nResource \nimplications \n \nThe following resources MUST be provided: \n4.1 \nRelevant dental laboratory practice/organizational policy and \nprocedures \n4.2 \nIncident reporting procedures \n4.3 