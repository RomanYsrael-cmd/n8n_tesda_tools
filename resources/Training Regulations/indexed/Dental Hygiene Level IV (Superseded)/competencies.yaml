n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with recorded according employer\npolicy.\n3.3\nClient fully informed of all relevant matters in a timely\nmanner and according to agreed reporting procedures.\n\n--- PDF PAGE 31 ---\nTR Dental Hygiene NC IV\n\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\nMay include but not limited to:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanor\n1.5\nGrooming\n\n 2. Employer Standards\nMay include but not limited to:\n2.1\nStanding Orders\n\n3. Client Requirements\nMay include but are not limited to:\n3.1\nAssignment instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n\n5. Client Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferring to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n6.4\nHazard reports\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 32 ---\nTR Dental Hygiene NC IV\n\n28\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image\n1.2\nInterpreted client/customer requirements from information\n1.3\nDealt successfully with a variety of client/customer\ninteractions\n1.4\nMonitored and acted on changing client or customer needs\n1.5\nMet client/customer requirements\n1.6\nBuilt credibility with customers/client\n\n2. Underpinning\nknowledge\n2.1\nUniform and personal grooming requirements of the\nemployer\n2.2\nOccupational health and safety requirement for the\nassignment\n2.3\nAssignment Instructions\n\n3. Underpinning\nskills\n3.1 Attention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer\nneeds\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and Negotiation\n3.8\nMaintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers/customers’ instructions\n4.9\nAssessment instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 33 ---\nTR Dental Hygiene NC IV\n\n29\nUNIT OF COMPETENCY\nMANAGE OWN PERFORMANCE\nUNIT CODE\nHCS516202\nUNIT DESCRIPTOR\nThis unit of competency covers the knowledge, skills and\nattitudes in effectively managing own workload and quality\nwork.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n1.1\nTasks accurately identified.\n1.2\nPriority allocated to each task.\n1.3\nTime lines allocated to each task or series of tasks.\n1.4\nTasks deadlines known and complied with whenever\npossible.\n1.5\nWork schedules are known and completed with agreed\ntime frames.\n1.6\nWork plans developed according to assignment\nrequirements and employer policy.\n1.7\nUncompleted work or tasks detailed and responsibility\nfor completion passed to incoming shift or other\nappropriate persons.\n\n2. Maintain quality of\nperformance\n2.1\nPersonal performance continually monitored against\nagreed performance standards.\n2.2\nAdvice and guidance sought when necessary to\nachieve or maintain agreed standards.\n2.3\nGuidance from management applied to achieve or\nmaintain agreed standards.\n2.4\nStandard of work clarified and agreed according\nemployer policy and procedures.\n\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to.\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with, recorded and in accordance with\nemployer policy.\n3.3\nClient fully informed of all relevant matters in a timely\nmanner.\n\n--- PDF PAGE 34 ---\nTR Dental Hygiene NC IV\n\n30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n1.1\nMay be identified through:\n1.1.1 Assignment Instructions\n1.1.2 Verbal Instructions by Senior Staff\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n\n2. Performance\nStandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 35 ---\nTR Dental Hygiene NC IV\n\n31\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified\ntime frame\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge\n2.1\nSight and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills 3.1\nCapacity to plan and prioritize work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3 Observation with questioning\n5.4 Oral questioning/Interview\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 36 ---\nTR Dental Hygiene NC IV\n\n32\n\nUNIT OF COMPETENCY\nMAINTAIN INSTRUMENTS AND EQUIPMENT IN WORK\nAREA\nUNIT CODE\nHCS322201\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required\nin maintaining instruments and equipment in the work area.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to clean\nused items\n\n1.1\nSafe work practices and standard precautions are\nfollowed at all times in accordance with legislative and\nworkplace guidelines.\n1.2\nSharps and sharps debris are disposed into a container\nand in accordance with workplace guidelines.\n1.3 Waste is segregated and disposed in accordance with\norganization and legislative guidelines.\n2. Clean and dry used\nitems\n2.1\nWorkflow protocols are maintained in instrument\nreprocessing area and in accordance with workplace\nguidelines.\n2.2\nInstruments are prepared for cleaning and in\naccordance with workplace guidelines.\n2.3\nAppropriate cleaning agents are selected and used in\naccordance with workplace guidelines and\nmanufacturer’s specification.\n2.4\nCleaning methods that avoid the generation of aerosols\nare used in accordance with workplace guidelines.\n2.5\nInstruments are dried and inspected for damage and\nremaining debris and in accordance with workplace\nprocedures.\n2.6\n Cleaning process is monitored in accordance with\nworkplace guidelines.\n\n3. Prepare and pack\nitems for storage\n\n3.1 Instruments with hinges or ratchets are opened and\nunlocked in accordance with standard operating\nprocedures.\n3.2\nInstrument trays are prepared in accordance with\nworkplace protocols.\n3.3\nCritical site instruments are packaged or wrapped in a\nmanner that prevents damage to delicate items.\n\n--- PDF PAGE 37 ---\nTR Dental Hygiene NC IV\n\n33\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Safe work practices\n\nMay include but are not limited to:\n1.1\nTreatment of all items as a potential source of infection\n1.2\nPersonal hygiene practices especially washing and\ndrying hands\n1.3\nWork practices for the safe handling of sharps\n1.4\nWork practices for the safe disposal of sharps and other\nclinical waste\n1.5\nThe use of personal protective equipment:\n1.5.1 heavy duty gloves\n1.5.2 mask and protective eyewear\n1.5.3 hair protection or covering\n1.5.4 protective clothing and safety footwear\n1.6 Safe handling, storage and disposal of chemicals\n1.7 Safe handling techniques especially as they relate to\nlifting and handling dangerous and contaminated items\n2. Legislative and\nworkplace\nguidelines\nMay include:\n2.1 Infection control guidelines for the transmission of\ninfectious diseases in the health care setting\n2.2\nState legislative requirements\n2.3\nOrganization infection control policies and procedures\n2.4\nOccupational Health and Safety policies and procedures\n2.5\nMaterial Safety Data Sheets for the chemicals used\n3. Waste\nMay include but is not limited to:\n3.1\nClinical waste:\n3.1.1 discarded sharps\n3.1.2 human tissues\n3.1.3 laboratory waste\n3.1.4 any other waste as specified by the workplace\n3.2\nRelated waste:\n3.2.1 radiographic waste\n3.2.2 chemical waste\n3.2.3 metal alloy waste\n3.3\nGeneral waste\n4. Disposal of waste\nrequirements\nMay include:\n4.1\nDisposal in accordance with:\n4.1.1 Environment Protection Policy (Waste\nManagement)\n4.1.2 Environment Protection Regulations (Waste\nManagement)\n4.2\nOrganization policy\n\n--- PDF PAGE 38 ---\nTR Dental Hygiene NC IV\n\n34\n5. Work flow protocols\nMay include:\n5.1\nSeparate hand washing facilities\n5.2\nSink suitable for disposal of liquid waste\n5.3\nOne direction flow of instruments from contaminated to\nclean to sterile\n5.4\nDesignated work area that is physically separate to\nprevent possible contamination of processed items\n5.5\nIdentification and reporting of disruptions to work flow\nprotocols in accordance with workplace procedures\n6. Preparation of\ninstruments for\ncleaning\n\nMay include:\n6.1\nSorting according to type of instrument and\ncorresponding cleaning method\n6.2 Written procedures for handling specialized items\n6.3\nDisassembly of instruments where possible for detergent\nto reach all surfaces\n6.4 Checking for instrument defects, damage and missing\nparts\n7. Selection and use\nof appropriate\ncleaning agents\nMay include:\n7.1 Meeting requirements of Product Data Bulletins and\nMaterials Safety Data Sheets for the chemicals used\n8. Cleaning methods\nMay include:\n8.1 Initial treatment of used instruments close to their point\nof use to decrease bio burden\n8.2 Thermal washer/disinfector in accordance with current\nstandards\n8.3\nUltrasonic cleaner in accordance with current standards\n8.4\nManual cleaning\n9. Monitoring the\ncleaning process\nMay include:\n9.1 Visual inspection of all items for cleanliness and\nabsence of detergent or rinse additive residues\n9.2 Daily cleaning and maintenance of ultrasonic cleaner\nand washer/disinfector\n9.3\nDaily performance testing of ultrasonic cleaner\n9.4\nDaily checks of washer/disinfector function and\ndetergent dispenser\n10. Critical site\ninstruments\nMay include:\n10.1 Instruments which must be cleaned and disinfected as\nneeded\n11 Routine cleaning\nand checking of\nsterilizers\nMay include but is not limited to:\n11.1 Daily checks:\n11.1.1 floor of sterilizer is free of debris\n11.1.2 chamber drain and filter are clear\n11.1.3 recording devices, gauges and timers are functioning\ncorrectly\n11.1.4 water reservoir (portable benchtop sterilizers) emptied,\ncleaned and refilled with distilled water\n11.1.5 door seals are intact\n11.2 Cleaning:\n11.2.1 loading tray and external surfaces cleaned daily\n\n--- PDF PAGE 39 ---\nTR Dental Hygiene NC IV\n\n35\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nFollowed safe handling, drying and cleaning protocols\n1.2\nFollowed correct packing, assembly and wrapping\nprocedures and storage\n1.3\nFollowed appropriate OH&S procedures\n\n2. Underpinning\nknowledge\n\n2.1\nWorkflow protocols in the instrument reprocessing area\n2.2\nWorkplace procedures for using an ultrasonic cleaner\n2.3\nWorkplace procedures for manual cleaning\n2.4\nInstrument maintenance checklists\n\n3. Underpinning skills\n\n3.1\nFollowing safe work practices and applying standard\nprecautions during cleaning and preparation of items:\n3.1.1 checking items for defects after cleaning\n3.1.2 selecting and safely using appropriate cleaning\nagents\n3.1.3 selecting and wearing appropriate personal\nprotective equipment\n3.2\nMaintaining workflow protocols in instrument\nreprocessing area from contaminated to clean and\ndisinfect\n3.3\nOperating mechanical cleaners including ultrasonic\ncleaner or steamer\n3.4\nDrying items before packaging\n3.5\nStoring packaged items in a clean place away from\nsources of moisture and contamination\n\n4. Resource\nImplications\n\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate supplies and materials\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 40 ---\nTR Dental Hygiene NC IV\n\n36\n\nUNIT OF COMPETENCY\nFOLLOW OCCUPATIONAL HEALTH AND SAFETY\nPOLICIES IN DENTAL LABORATORY FACILITIES\nUNIT CODE\nHCS322204\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required in\napplying relevant OHS legislation and codes of practice,\nincluding duties and responsibilities for all parties under\ngeneral duty of care.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nFollow workplace\nprocedures for\nhazard identification\nand risk control\n\n1.3\nHazards in the work area are recognized and reported\nto supervisor in accordance with workplace procedures.\n1.4\nWorkplace procedures and work instructions for\ncontrolling risks, including infection control, are\nfollowed accurately.\n1.5\nWorkplace procedures for dealing with accidents,\nfires and emergencies are followed where necessary.\n2\nContribute to the\nmanagement of\nOHS\n2.7\nOHS issues are raised with designated personnel and\nco-workers as appropriate.\n2.8\nContributions are made as appropriate to workplace\nOHS discussions.\n3\nUtilize and\nimplement\nstrategies as\ndirected to prevent\ninfection in the\nworkplace\n3.1\nThe environment is kept clean and tidy.\n3.2\nPersonal hygiene practices are followed.\n3.3\nAny items that may be contaminated are disposed of\nsafely.\n4\nUtilize strategies to\nprevent stress\noverload\n4.1\nNominated rest time and breaks are taken.\n4.2\nSources of stress are identified and issues raised with\nsupervisor.\n4.3\nWork roles are clarified and followed.\n5\nWork in a safe\nmanner\n5.1\nDefined procedures are followed to ensure personal\nsafety.\n5.2\nAll work is carried out in a manner which ensures\nsafety of self and others\n5.3\nOrganizational security measures are followed.\n5.4\nSafe manual handling procedures are followed.\n\n--- PDF PAGE 41 ---\nTR Dental Hygiene NC IV\n\n37\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n2.\nWorkplace\nprocedures for\ncontrolling risks\n\nMay include:\n1.5\nManual handling techniques\n1.6\nSafe handling, storage and disposal of inflammable or\npotentially dangerous substances\n1.5\nStrategies for reducing the amount of manual handling\nrequired\n2.\nStress\nMay include:\n2.1\nHealth problems\n2.2\nChanges in behavior\n2.3\nFrequent absences\n2.4\nNegative attitudes\n2.5\nUnawareness of own stress levels\n3.\nRest time and\nbreaks\nMay include:\n3.4\nMorning and afternoon tea, lunch, dinner breaks\n4.\nWorkplace\nprocedures\nMay include:\n4.3\nGrievance procedures\n4.4\nTeam meetings\n4.5\nIncident reports\n4.6\nDebriefing procedures following crisis\n4.7\nSmoke free environment\n5.\nItems that may be\ncontaminated\nMay include:\n5.6\nWork surfaces\n5.7\nClothing\n6.\nWorking in a\nmanner that\nensures personal\nsafety\nMay include:\n6.1\nCarrying communication equipment\n6.2\nUsing personal protection equipment\n6.3\nSafe work practices for handling sharps and other hazards\nin dental laboratory practice\n6.4\nCarrying alarms\n6.5\nMaintaining infection control in dental laboratory practice\n7.\nOrganizational\nsecurity measures\nMay include:\n7.1\nLocking doors\n7.2\nAlarm system\n7.3\nContracted security personnel\n\n--- PDF PAGE 42 ---\nTR Dental Hygiene NC IV\n\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.4\nWorked safely and followed OHS policies and\nprocedures in dental laboratory practice\n1.5\nComplied with DOH infection control guidelines\n1.6\nContributed to the management of OHS\n1.7\nUtilized and implemented strategies as directed to\nprevent infection in the workplace\n1.8\nUtilized strategies to prevent stress overload\n1.9\nWorked in a safe manner\n2. Underpinning\nknowledge\n2.5\nCompliance with OHS policy and procedures and\ninfection control guidelines and procedures\n2.6\nKnowledge of potential hazards in the workplace\n2.7\nKnowledge of laboratory waste disposal methods\n2.8\nKnowledge of personal hygiene and personal\nprotection including immunization\n2.9\nKnowledge of legislative requirements and best\npractice approaches to OHS\n2.10 Emergency procedures\n3. Underpinning skills\n3.6\nManual handling techniques\n3.7\nSafe handling techniques\n3.8\nCorrect use of equipment, instruments and materials in\naccordance with manufacturer specifications\n3.9\nTechnology used to work safely and competently\n3.10 Safe work practices to prevent or minimize risk\n3.11 Reading and writing skills\n3.12 Oral communication skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational\npolicies and procedures manuals such as:\n4.1.1 Incident reporting procedures\n4.1.2 OHS policy and procedures\n4.1.3 Infection control guidelines (DOH)\n4.1.4 Waste management policies\n4.1.5 Relevant state legislation\n4.1.6 Manufacturer’s instructions for the use of\nrelevant equipment, instruments and materials\n4.1.7 Material Safety Data Sheets (MSDs)\n\n5\nMethod of assessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nPortfolio\n5.4\nThird Party Report\n6\nContext of assessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 43 ---\nTR Dental Hygiene NC IV\n\n39\n\nUNIT OF COMPETENCY\nMAINTAIN INFECTION CONTROL IN DENTAL LABORATORY\nPRACTICE\nUNIT CODE\nHCS322205\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required to\ncomply with infection control procedures before, during and after\nhealth care procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nMonitor and\nmaintain the\ncleanliness of the\ndental laboratory\n\n2.1\nAppropriate personal protective wear is used during\ncleaning of equipment and surfaces.\n2.2\nAppropriate disinfectants and cleaning equipment are\nselected, prepared and used on surfaces in accordance with\nthe manufacturer’s specification.\n2.3\nUsed surface covers, if applicable, are removed and\nreplaced in a manner to prevent cross contamination.\n2.4\nCleaning equipment is correctly stored.\n2.5\nAll surfaces including internal storage units within the\ndental laboratory are monitored and maintained for\ncleanliness.\n2\nClean and disinfect\ndental laboratory\n/instruments and\nequipment\n2.1\nDental laboratory instruments and equipment are cleaned of\nbio-burden and lubricated, where appropriate, prior to\ncleaning and disinfecting.\n2.2\nDental laboratory instruments and equipment are checked\nfor faults and disassembled where appropriate.\n2.3\nPrior to cleaning of dental laboratory instruments and\nequipment are loaded safely and effectively.\n2.4\nAppropriate cleaning procedures are carried out in the\ncorrect sequence and duration in accordance with\nmanufacturer specifications.\n2.5\nRegular maintenance program including faults and\nincidences are recognized, reported and documented.\n\n--- PDF PAGE 44 ---\nTR Dental Hygiene NC IV\n\n40\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3\nMaintain hygiene\nand personal\nprotection\n\n3.1\nHand washing procedures are correctly followed.\n3.2\nOpen cuts and abrasions are covered with a waterproof\ndressing.\n3.3\nAppropriate personal protection wear is correctly worn.\n3.4\nImmunization is undertaken in accordance with current\nrecommendations for dental health care worker.\n3.5\nAll work is carried out in a manner that minimizes the risk of\ncross contamination and complies with OHS policy and\nprocedures.\n3.6\nHazards in the dental laboratory is recognized and reported\nto operator.\n3.7\nAppropriate procedures for dealing with accidents, including\nsharp injuries, are followed correctly.\n4\nDispose of dental\nlaboratory waste\nsafely\n4.1\nAppropriate protective clothing is worn or used in\naccordance with OHS policy and procedures when handling\nwaste.\n4.2\nWaste is segregated, contained, stored and transported\ncorrectly.\n4.3\nDamaged and/or pre-packed items are disposed of safely.\n4.4\nWaste is disposed of safely.\n5\nUndertake the\nnecessary\nmeasures to\nensure prevention\nof transmission of\ninfection\n5.1\nRisks of cross contamination are identified and appropriate\nresponses implemented within dental practice.\n5.2\nClean, contaminated and administrative zones are clearly\nidentified and maintained.\n5.3\nInstruments, materials, medicaments and equipment are set\nup prior to commencement of treatment where appropriate.\n5.4\nOne-way workflow from clean to dirty zone is maintained.\n5.5\nRisk of transmission of infection is minimized in all dental\nlaboratory related and administrative procedures.\n5.6\nSpills are removed correctly.\n\n--- PDF PAGE 45 ---\nTR Dental Hygiene NC IV\n\n41\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nInfection\ncontrol\nguidelines and\nprocedures\nMay include but are not limited to:\n1.1\nCurrent DOH guidelines for infection control in health care\nsettings\n1.2\nStandard Precautions and Additional Precautions as defined\nby DOH\n1.3\nDental laboratory practice/organizational policy procedures\nand infection control guidelines and procedures\n1.4\nMaterial Safety Data Sheets (MSDS)\n1.5\nLocal government ordinances\n1.6\nLegislative requirements\n2.\nPersonal\nprotective wear\nMay include but not limited to:\n2.1\nSterile and non sterile gloves including heavy duty\n2.2\nMasks\n2.3\nEye protection\n2.4\nEnclosed footwear\n2.5\nGowns\n2.6\nAprons\n3.\nCleaning\nequipment\nMay include but is not limited to:\n3.1\nUltrasonic cleaner\n3.2\nManual cleaning with a range of brushes\n3.3\nDrying\n3.4\nBuckets and mops\n4\nWaste\nsegregation\nMay include but is not limited to:\n4.1\nClinical and related waste\n4.2\nInfectious waste\n4.3\nSharps\n4.4\nGeneral waste\n4.5\nOther hazardous substances\n5\nRequirements\nfor safe\ndisposal of\nwaste\nMay be determined by:\n5.1\nMain drainage\n5.2\nLocal government ordinances\n5.3\nMaterial Safety Data Sheet (MSDS)\n\n--- PDF PAGE 46 ---\nTR Dental Hygiene NC IV\n\n42\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of infection risks in health\nenvironment and specifically in dental laboratory practice\n1.2\nComplied with current DOH infection control guidelines and\nprocedures, OHS and legislative requirements\n1.3\nHandled waste safely managed procedures in accordance\nwith legislative requirements\n1.4\nSelected and used appropriate cleaning agents for particular\nsurfaces and equipment in accordance with the\nmanufacturer’s specifications\n2.\nUnderpinning\nknowledge\n2.1\nKnowledge on how infection is spread, cross infection and\nprevention strategies\n2.2\nKnowledge of relevant OHS policies and procedures\n2.3\nLimitations, properties and precautions required of\ndisinfectants and decontaminates\n2.4\nKnowledge of potential hazards in a health environment\n2.5\nKnowledge of currently available vaccinations against\ntransmissible disease\n2.6\nKnowledge of dental laboratory waste disposal methods\n3.\nUnderpinning\nskills\n3.1\nApplying standard and additional precautions\n3.2\nUsing safe work practices to minimize the risk of transmission\nof infection\n3.3\nSelecting and using appropriate chemicals in cleaning and\nsanitizing\n3.4\nUsing correct hand washing and hand care techniques\n3.5\nUsing correct hygiene procedures\n3.6\nSelecting and using equipment and cleaning agents\neffectively\n3.7\nUsing procedures appropriate to the cleaning area and\npurpose\n3.8\nMinimizing disruption to the work environment\n3.9\nMinimizing safety hazards for self and others\n3.10 Using time management strategies to set priorities\n3.11 Using technology to work safely and competently\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational policy and\nprocedures\n4.2\nIncident reporting procedures\n4.3\nOccupational health and safety policy and procedures\n4.4\nInfection control guidelines\n4.5\nWaste management policies\n4.6\nRelevant state legislations\n4.7\nManufacturer’s instructions for the use of relevant equipment,\ninstruments, medicaments, materials and Material Safety\nData Sheets (MSDS)\n4.8\nCleaning agents currently used in the workplace\n\n--- PDF PAGE 47 ---\nTR Dental Hygiene NC IV\n\n43\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nPortfolio\n5.5\nThird Party Report\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 48 ---\nTR Dental Hygiene NC IV\n\n44\n\nUNIT OF COMPETENCY\nAPPLY BASIC FIRST AID\nUNIT CODE\nHCS323203\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this\nunit it is assumed that the First Aider is working under\nsupervision and / or according to established workplace First-\nAid procedures and policies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\nPhysical hazards to self and casualty’s health and\nsafety are identified.\n1.2\nImmediate risks to self and casualty’s occupational\nhealth and safety (OSH )are minimized by controlling\nthe hazard in accordance with OSH requirements.\n1.3\nCasualty’s vital signs and physical condition are\nassessed in accordance with workplace procedures.\n2. Apply basic first aid\ntechniques\n2.1\nFirst Aid management is provided in accordance with\nestablished First Aid procedures.\n2.2\nCasualty is reassured in a caring and calm manner and\nmade comfortable using available resources.\n2.3\nFirst Aid assistance is sought from others in a timely\nmanner and as appropriate.\n2.4\nCasualty’s condition is monitored and responded to in\naccordance with effective First-Aid principles and\nworkplace procedures.\n2.5\nDetails of casualty’s physical condition, changes in\nconditions, management and response are accurately\nrecorded in line with organizational procedures.\n2.6\nCasualty management is finalized according to his/her\nneeds and First Aid principles.\n3. Communicate details\nof the incident\n1.1\nAppropriate medical assistance is requested using\nrelevant communication media and equipment.\n1.2\nDetails of casualty’s condition and management\nactivities are accurately conveyed to emergency\nservices/relieving personnel.\n1.3\nReports to supervisors are prepared in a timely\nmanner, presenting all relevant facts according to\nestablished company procedures.\n\n--- PDF PAGE 49 ---\nTR Dental Hygiene NC IV\n\n45\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. First Aid Management\nThis may include but is not limited to:\n1.1\nWorkplace policies and procedures\n1.2\nIndustry/site specific regulations, codes\n1.3\nOSH\n1.4\nState and territory workplace health and safety\nrequirements\n1.5\nAllergies the casualty may have\n2. Physical Hazards\nPhysical hazards may include:\n2.1\nWorkplace hazards\n2.2\nEnvironmental hazards\n2.3\nProximity of other people\n2.4\nHazards associated with casualty management\nprocesses\n3. Risks\nRisks may include:\n3.1\nWorksite equipment, machinery and substances\n3.2\nEnvironmental risks\n3.3\nBodily fluids\n3.4\nRisk of further injury to the casualty\n3.5\nRisk associated with the proximity of the others and\nbystanders\n2. Casualty’s Condition\nCasualty’s condition may include but be not limited to the\nfollowing:\n4.1\nAbdominal injuries\n4.2\nAllergic reactions\n4.3\nBleeding\n4.4\nBurns-thermal, chemical, friction, electrical\n4.5\nCardiac conditions\n4.6\nChemical contamination\n4.7\nCod injuries\n4.8\nCrush injuries\n4.9\nDislocations\n4.10 Drowning\n4.11 Eye injuries\n4.12 Fractures\n4.13 Head injuries\n4.14 Epilepsy\n4.15 Minor skin injuries\n4.16 Neck and spinal injuries\n4.17 Needle stick injuries\n4.18 Poisoning and toxic substances\n4.19 Shock\n4.20 Smoke inhalation\n\n--- PDF PAGE 50 ---\nTR Dental Hygiene NC IV\n\n46\n\n5. Equipment and\nResources\nEquipment and other resources may include:\n5.1\nDefibrillation units\n5.1\nPressure bandages\n5.2\nThermometers\n5.3\nFirst Aid kit\n5.4\nEyewash\n5.5\nThermal blankets\n5.6\nPocket face masks\n5.7\nRubber gloves\n5.8\nDressing\n5.9\nSpace device\n5.10 Cervical collars\n6. Communication\nSystem\n6.1\nMobile phone\n6.2\nSatellite phones\n6.3\nHF/VHF radio\n6.4\nFlags\n6.5\nFlares\n6.6\nTwo-way radio\n6.7\nEmail\n6.8\nElectronic equipment\n7. Vital Signs\n7.1\nBreathing\n7.2\nCirculation\n7.3\nConsciousness\n8. First Aid Principles\n8.1\nChecking the site for danger to self, casualty and\nothers and minimizing the danger\n8.2\nChecking and maintaining the casualty’s airways,\nbreathing and circulation\n\n--- PDF PAGE 51 ---\nTR Dental Hygiene NC IV\n\n47\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nComplied with institutional requirements, OSH laws\ninfections control and manual handling procedures and\nrelevant health regulations\n1.2\nIdentified physical hazards of the casualty and\nminimized immediate risks\n1.3\nAssessed and monitored the physical condition of the\ncasualty\n1.4\nResponded to emergency using basic life support\nmeasures\n1.5\nProvided initial response where First Aid is required\n1.6\nDealt with complex casualties or incidents\n1.7\nPrepared reports to concerned personnel in a timely\nmanner\n2. Underpinning\nknowledge\n2.1\nBasic anatomy and physiology\n2.2\nCompany standard operating procedures (sops)\n2.3\nDealing with confidentiality\n2.4\nKnowledge of the First Aiders’ skills limitations\n2.5\nOSH legislation and regulations\n2.6\nHow to gain access to and interpret material safety\ndata sheets\n3. Underpinning skills\n3.1\nResuscitation\n3.2\nSafe manual handling of casualty\n3.3\nConsideration of the welfare of the casualty\n3.4\nReport preparation\n3.5\nCommunication skills\n3.6\nInterpreting and using listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant work station\n4.2\nRelevant institutional policies, guidelines procedure and\nprotocol\n4.3\nEquipment and materials relevant to the proposed\nactivities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nInterview\n5.3\nThird-Party report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be done in a workplace or simulated\nwork area setting.\n\n--- PDF PAGE 52 ---\nTR Dental Hygiene NC IV\n\n48\n\nUNIT OF COMPETENCY OPERATE A PERSONAL COMPUTER\nUNIT CODE\nICT311201\nUNIT DESCRIPTOR\nThis unit defines the competency required to operate a personal\ncomputer by: starting the PC, logging in, using and working with\nfiles, folders and programs, saving work, and closing down the\nPC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1\nThe peripheral devices are properly connected\n1.2\nPower is checked and the computer and peripheral devices\nare switched on\n1.3\nProper logging in and logging off is successfully done\n1.4\nThe operating system features and functions are accessed\nand navigated\n1.5\nHardware configuration and other system features are\nchecked\n2. Arrange and\ncustomize\ndesktop\ndisplay/\nWindows\nsettings\n\n2.1\nThe desktop screen or Windows elements are changed as\nneeded\n2.2\nDesktop icons are added, renamed, moved, copied or deleted\n2.3\nThe online help functions are accessed or used as needed\n2.4\nDesktop icons of application programs are selected, opened\nand closed\n2.5\nProperties of icons are displayed\n2.6\nComputer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1\nA file or folder is created, opened, moved, renamed or copied\n3.2\nFiles are located, deleted and restored\n3.3\nDetails and properties of files and folders are displayed or\nviewed\n3.4\nVarious files are organized for easy lookup and use\n3.5\nFiles and information are searched\n3.6\nDisks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1\nApplication programs are added, changed, removed or ran\n4.2\nUser software or application program are installed, updated\nand upgraded\n4.3\nInformation/data are moved between documents or files\n5. Print\ninformation\n5.1\nPrinter is added or installed and correct printer settings is\nensured\n5.2\nDefault printer is assigned accordingly\n5.3\nInformation or document is printed on the installed printer\n5.4\nProgress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1\nAll open application programs are closed\n6.2\nComputer and peripheral devices are properly shut down\n\n--- PDF PAGE 53 ---\nTR Dental Hygiene NC IV\n\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Peripheral device\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n\n2. Computer\nMay include:\n2.1 Laptops/notebooks\n2.2 Workstations\n2.3 Servers\n2.4 other personal computer devices\n\n3. Application\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n\n4. Operating system\nMay include but is not limited to the various versions and\nvariants of:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n5. System features\nMay include but is not limited to the operating system features\nand hardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n\n--- PDF PAGE 54 ---\nTR Dental Hygiene NC IV\n\n50\nVARIABLE\nRANGE\n6. Online help\nfunctions\n6.1 An instruction manual, or a portion of the manual,\nintegrated and accessible from within the program or\nsoftware being used.\n7. Properties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n\n8. Various files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n\n9. Disks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation.\n\n--- PDF PAGE 55 ---\nTR Dental Hygiene NC IV\n\n51\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof Competency\n1.1 Assessment must confirm the ability to utilize software,\nnavigate the desktop, using system features to perform\ntasks and save results of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware\ncomponents\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or\ndisk storage\n3.2 Mouse and keyboarding skills for running software\napplications\n3.3 Reading and writing at a level where basic workplace\ndocuments are understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions using\na personal computer whether standalone or in a networked\nenvironment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment.\n\n--- PDF PAGE 56 ---\nTR Dental Hygiene NC IV\n\n52\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPERFORM ORAL EXAMINATION\nUNIT CODE:\nHCS322343\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required\nto take medical and dental history, examine teeth, gums and\ntissue of the mouth and educate patient on oral hygiene.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Take medical/dental\nhistory of the patient\n\n1.1 Information are collected from the patient in accordance\nwith dental standard operating procedures.\n1.2 Special conditions of the patient are determined and\ndocumented following established procedures.\n1.3 Special precautionary measures are taken prior to\ndental examination based on patient’s medical condition.\n1.4 Treatment appointments are allocated in accordance to\npriority\n2. Examine teeth,\ngums and tissues of\nthe mouth\n\n2.1 Equipment/instruments to be used during examinations\nare prepared and sterilized in accordance with OH&S\nstandard operating procedures.\n2.2 The oral cavity is checked/examined in accordance with\nOH&S standard operating procedures.\n2.3 Teeth conditions are determined following established\nprocedures.\n2.4 Patient’s observations are recorded using tooth chart and\nother documentation methods\n3. Educate patient on\noral hygiene\n\n3.1 Findings, concerns and issues are discussed with the\npatient\n3.2 Professional advice/recommendations on proper oral\nhygiene is given to the patient in accordance with the\ndentist instructions\n3.3 A complete oral hygiene program is scheduled and\nmaintained in accordance with the dentist instructions.\n\n--- PDF PAGE 57 ---\nTR Dental Hygiene NC IV\n\n53\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Information\nMay include but are not limited to:\n1.1 Personal information\n1.1.1\nName\n1.1.2\nAddress\n1.1.3\nAge\n1.1.4\nStatus\n1.1.5\nOccupation\n1.2 List of medications currently taking\n1.3 List of vitamins and natural healing remedies currently\ntaking\n1.4 Smoking and alcohol consumption\n1.5 Allergy list\n1.6 Previous experience or adverse reaction with anesthesia,\nanesthesias, anti-biotics and analgesics\n1.7 Family member reactions to anesthesia\n1.8 Any medical conditions currently being treated for\n1.9 Previous surgeries or hospitalizations and other severe\ndental and medical conditions\n2. Equipment /\ninstruments\nMay include but are not limited to:\n2.1 Mouth mirror\n2.2 Dental Explorer\n2.3 Cotton pliers\n2.4 Periodontal probe\n\n3. Special\nprecautionary\nmeasures\n3.1 Patients with heart-valve disease must take antibiotics to\nprevent bacteria to spread into the blood stream that\ncould cause endocarditis\n3.2 Patients with history or possibility of hypertension should\nhave their blood pressure monitored.\n3.3 Patients with relevant allergies\n3.4 Patients with medication such as blood thinners\n3.5 Patients with HIV or other contagious diseases\n3.6 Patients with mental disorders\n3.7 Patients with artificial prosthetic devices and transplants\n3.8 Patients who have a history of taking biphosponates\n4. Oral cavity\nMay include but are not limited to:\n4.1 Hard and soft palates\n4.2 Tongue\n4.3 Cheeks\n4.4 Lips\n4.5 Floor of the mouth\n4.6 Measurement of salivary flow\n4.7 Examination of neck area specifically the lymph nodes\n\n--- PDF PAGE 58 ---\nTR Dental Hygiene NC IV\n\n54\n\n5. Condition of teeth,\ngums and tissue of the\nmouth\n\nMay include but are not limited to:\n5.1 Condition of teeth:\n5.1.1 Erupted or un-erupted\n5.1.2 Carious or non-carious\n5.1.3 Damages to abrasion, erosion and attrition\n5.1.4 Previous treatments\n5.1.4.1 Restorations\n5.1.4.2 Crowns\n5.1.4.3 Others\n\n5.2 Condition of the gums\n5.2.1 Color and texture\n5.2.2 Bleeding\n5.2.3 Gingival recession\n5.2.4 Periodontal pockets\n5.2.5 Furcation involvement\n5.2.6 Tooth mobility\n\n6. Advice /\n recommendations\nMay include but are not limited to:\n6.1 Proper brushing of teeth\n6.2 Proper flossing of teeth\n6.3 Use of fluoride toothpaste\n6.4 Regular scaling and polishing\n\n--- PDF PAGE 59 ---\nTR Dental Hygiene NC IV\n\n55\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nTook medical and dental history of client/patient\n1.2\nInspected teeth, gums and tissues of the mouth\n1.3\nEducated patient on oral hygiene\n1.4\nDemonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n2. Underpinning\nknowledge\n\nKnowledge in\n2.1\nAnatomy and physiology\n2.2\nHead and neck anatomy\n2.3\nHistology and embryology\n2.4\nMicrobiology\n2.5\nOral anatomy\n2.6\nOral physiology\n2.7\nDental materials\n2.8\nPeriodontology\n2.9\nRoentgenology\n2.10 Restorative dentistry\n2.11 Pedodontics\n2.12 Pharmacology\n2.13 Pathology\n2.14 Dental jurisprudence and ethics\n2.15 Nutrition\n2.16 Basic computer\n3. Underpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nMaintaining personal hygiene\n3.4\nLanguage, literacy and numeracy skills appropriate to\nthe role and workplace requirements\n3.5\nOperational skills to consistently use time effectively\nand provide quality customer service in the dental\nenvironment\n3.6\nComputer skills\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental clinic environment\n4.2\nRelevant documentation such as:\n4.2.1\nIndustry codes of practice\n4.2.2\nLocal legislation as appropriate\n4.3\nA qualified workplace assessor\n5. Method of assessment\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2\nInterview\n5.3\nPortfolio\n5.4\nWritten Examination\n6. Context of assessment\n6.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 60 ---\nTR Dental Hygiene NC IV\n\n56\n\nUNIT OF COMPETENCY:\nPROMOTE ORAL HEALTH AND HYGIENE\nUNIT CODE:\nHCS322344\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude required\nto provide an oral health promotion program in both dental\nclinic and community setting. It acknowledges that dental\ndiseases are the most prevalent chronic diseases worldwide\nand that oral diseases impacts on a person’s everyday life\ncausing pain and disability and influencing eating, sleeping\nand social roles.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop oral health\npromotion strategies\nfor the target group\n\n1.1 Information on the causes and prevention of oral\ndiseases is provided to the target group using language\nthat can be easily understood.\n1.2 Information on acids and fermentable carbohydrates\nare developed and given in a manner that can be easily\nunderstood\n1.3 Target group are involved in the review of current dietary\nhabits and the development of an approach to healthy\neating which improves general and oral health\n1.4 Information is provided on dentally healthy lifestyle and\nbehavioral change\n1.5 Appropriate environment is provided for the target group to\nask questions and become involved in oral health\n2. Implement an oral\nhealth promotion\nprogram\n\n2.1 Target group and appropriate teaching and learning\nstyles are identified to effectively communicate an oral\nhealth promotion program\n2.2 Oral health issues are prioritized for the target group and\nthe potential for interventions\n2.3 Suitable oral health promotion materials are prepared\nfor use across age groups\n2.4 Flexibility of delivery of oral health promotions are ensured\nby taking into account the target group’s location,\neconomic and physical circumstances, language, culture\nand communication needs\n2.5 Community groups are actively involved in health\ndecisions making and setting of oral health promotion\npriorities\n\n--- PDF PAGE 61 ---\nTR Dental Hygiene NC IV\n\n57\n\n2.6 A review strategy is implemented to determine the\neffectiveness of the oral health promotion program\n2.7 Work collaboratively with other health care workers in a\nculturally sensitive and competent manner to address risk\nfactors that oral diseases have in common with other\ndiseases\n2.8 The delivery of health information is personalized so that it\nis immediately relevant to the individual and the\nconsequences of behavior\n\n--- PDF PAGE 62 ---\nTR Dental Hygiene NC IV\n\n58\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGES\n1. Teaching and\nlearning styles\n\nMay include but are not limited to:\n1.1 Auditory learning\n1.2 Visual learning\n2. Oral health issues\ntargeted in an oral\nhealth promotion\nprogram\n\n2.1 Dental caries\n2.2 Periodontal diseases\n2.3 Non carious tooth wear\n-\nerosion\n-\nabrasion\n-\nattrition\n2.4 Damage to dentition due to trauma\n2.5 Damage to oral diseases due to cigarette smoking\n2.6 Harmful effects of low salivary flow\n2.7 Interrelationship between oral health and individual\nmedical conditions\n2.8 Poor nutrition and poor oral health\n3. Oral health\npromotion materials\n\n3.1 Power point presentations\n3.2 Videos\n3.3 Brochures and information sheets\n3.4 Models\n4. Age group\nMay include but are not limited to:\n4.1 Children and adolescents\n4.2 Older people\n4.3 Low income and socially disadvantaged\n4.4 People with special needs\n5. Causes and\nprevention of oral\ndiseases\n\nMay include but are not limited to:\n5.1 Causes of oral diseases\n5.1.1 Bacteria in dental plaque\n5.1.2 Diet\n-\nconsumption of foods with high sugar content\n-\nfrequently consumption foods with high sugar\ncontent\n-\nconsumption of highly acidic food and drinks\n5.1.3\nSusceptible tooth surfaces\n5.1.4\nAlterations to the quantity and composition of saliva\n5.1.5\nSmoking\n\n--- PDF PAGE 63 ---\nTR Dental Hygiene NC IV\n\n59\n5.1.6\nLifestyle\n\n5.2 Prevention of oral diseases\n5.2.1\nIncreasing salivary flow and optimizing its\ncomposition\n5.2.2\nPromoting the use of fluorides\n5.2.3\nPlaque control\n5.2.3.1 Encourage regular dental care\n5.2.4\nDietary change\n5.2.5\nDiscouraging tobacco use\n5.2.6\nDiscouraging alcohol, drug and substance abuse\n5.2.7\nPreventing oral trauma e.g. sports injuries\n\n6. Information on acids\nand fermentable\ncarbohydrates\nMay include but are not limited to:\n6.1 The development of dental caries and its relation to:\n-\nthe frequency of eating foods containing added sugars\n-\nthe consistency of food containing added sugars\n-\nthe consumption of highly acidic drinks that may also\nhave a high sugar content\n\n7. Dentally healthy\nlifestyle and\nbehavioural change\nMay include but are not limited to:\n7.1 Adequate oral hygiene measures\n7.2 Decreased intake of alcohol and caffeine\n7.3 Decreased intake of fermentable carbohydrates\n7.4 Cessation of smoking\n\n8. Common risk factors May include but are not limited to:\n8.1 Poor oral hygiene\n8.2 Poor diet and nutrition\n8.3 Smoking\n8.4 Alcohol consumption\n8.5 Exposure to ultraviolet radiation\n8.6 Lifestyle factors\n8.7 Defective dental restorations\n\n--- PDF PAGE 64 ---\nTR Dental Hygiene NC IV\n\n60\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Delivers an oral health promotion program\n1.2\nDevelops an oral health promotion strategies for target\ngroup\n1.3\nIntegrates oral health promotions with targeted National\nhealth priorities\n1.4\nDemonstrates consistent compliance with legislative\nrequirements, infection control guidelines and\noccupational health and safety procedures\n1.5\nDemonstrates consistent performance over the required\nrange of workplace situations including\n-\nthe ability to communicate effectively across population\ngroups\n-\nthe development of oral health program strategies for\nspecific target groups within the community\n-\nintegration of oral health promotion with targeted\nNational health priorities\n\n2. Underpinning\nknowledge\n\nKnowledge in\n2.1 Applied head and neck anatomy\n-\nstructures of the oral cavity – hard and soft palate,\nlateral and posterior borders of the oral cavity, tongue\nand floor of the mouth\n-\nteeth – form and function\n-\ndentition – arrangement of the teeth, naming and\ncoding of teeth\n2.2 Nutritional requirements for children, adolescents and\nadults including elderly\n-\nDOH dietary guidelines\n2.3 Dental biofilm and its differing roles in the development of\ndental caries, periodontal disease and general health\n2.4 Saliva and its role in the maintenance of oral health\n-\nprotecting teeth by neutralizing acid\n-\nacting as a lubricant\n-\ndelivering calcium, phosphate and fluoride to the tooth\nsurface\n2.5 The interaction of factors that lead to the development of\ndental caries including:\n-\nbacteria in dental biofilm\n-\ndiet\n-\nsusceptible tooth surfaces and other risk factors\n2.6 The interaction of factors that prevent and control dental\ncaries:\n-\nincreasing salivary flow and optimizing its composition\n-\nfluorides\n-\ndental biofilm control and calculus removal\n-\ndietary change\n\n--- PDF PAGE 65 ---\nTR Dental Hygiene NC IV\n\n61\n2.7 The interaction of factors that lead to the development of\nperiodontal disease including:\n-\nbacteria in dental biofilm\n-\naccumulation of dental biofilm and calculus\n-\nsmoking\n2.8 The interaction of factors that prevent and control\nperiodontal disease including:\n-\nclient education\n-\ndental biofilm control\n2.9 Causes, and prevention, of non caries tooth wear:\n-\nerosion\n-\nabrasion\n-\nattrition\n2.10 The role of properly constructed and fitted mouthguards\nin preventing dental injuries\n2.11 Fundamental knowledge of the impact of smoking on\noral soft tissues\n2.12 Fundamental knowledge of systemic conditions which\ninfluence the development of oral disease\n2.13 Local oral factors which influence the development of\noral disease\n2.14 Modifications to oral health education programs related\nto special needs due to disability, aged care and child\nneeds\n\n3. Underpinning skills\n3.1 Using evaluation skills to review the effectiveness of an\noral health promotion program\n3.2 Using communication skills to effectively inform and\nmotivate behavior change\n3.3 Demonstrating interpersonal skills when relating to people\nfrom a range of social, cultural and religious backgrounds\nand physical and mental abilities\n3.4 Dealing with conflict\n3.5 Working with others and emphatizing with client and\nrelatives\n3.6 Applying problem solving skills\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 A real or simulated dental clinic environment\n4.2 Relevant documentation such as:\n4.2.1 Case problems on community-based oral health\npromotion\n4.2.2 Industry codes of practice\n4.2.3 National and local legislation as appropriate\n4.3 A qualified workplace assessor\n\n--- PDF PAGE 66 ---\nTR Dental Hygiene NC IV\n\n62\n\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Interview\n5.3 Third party report\n\n6. Context of\nassessment\n\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 67 ---\nTR Dental Hygiene NC IV\n\n63\n\nUNIT OF COMPETENCY:\nOPERATE DENTAL RADIOGRAPHIC EQUIPMENT\nUNIT CODE:\nHCS322345\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required\nto operate dental radiographic equipment and position the\npatient and radiographic film in order to produce an\ninterpretable diagnostic image\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Position patient to\nobtain radiographic\nimage\n\n1.1 Radiation safety measures for patient, operator and\nothers are implemented and maintained throughout the\nprocedures.\n1.2 Patient is positioned in accordance with radiographic\nprocedures\n2. Position dental\nradiographic receptor\n(film)\n\n2.1 Appropriate receptor (film) is selected and positioned in\naccordance with the radiographic requirements\n2.2 Appropriate technical variables on the dental\nradiographic\nunit\nare\nselected\naccording\nto\nmanufacturer’s specifications, procedures and patient\nrequirements\n2.3 Appropriate radiographic technique is selected in\naccordance with the tooth under investigation and\nanatomy of the oral cavity.\n2.4 Receptor (Film) locating devices are selected and used\nin accordance with correct positioning of the receptor\n(film).\n2.5 Accessories are selected according to manufacturer’s\nspecifications.\n3. Operate radiographic\nimaging equipment\nsafely to produce an\ninterpretable image\n\n3.1 Equipment\nis\noperated\nin\naccordance\nwith\nmanufacturer’s\nspecifications\nand\nlegislative\nrequirements for the safe use of radiation in dentistry\n3.2 Patient is advised not to move throughout the\nprocedures\n3.3 The exposed dental radiographic receptor (film)\npackage is carefully removed from the mouth\n3.4 The exposed radiographic receptor (film) package is\ncorrectly labeled prior to processing\n\n--- PDF PAGE 68 ---\nTR Dental Hygiene NC IV\n\n64\n\n4. Process and provide\nquality assurance for\nthe exposed dental\nradiographic film\n4.1 Radiographic receptor (film) are correctly processed in\naccordance with the procedure\n4.2 Processed receptor (film) are assessed for visual\nqualities based on established criteria\n4.3 Processing errors and errors in technique are\nidentified and corrected in accordance with established\nprocedures\n4.4 Radiographic images are mounted and stored in\naccordance with manufacturer’s specifications\n5. Monitor equipment\n5.1 Basic machine operation is monitored in accordance\nwith machine operating manuals\n5.2 Machine is referred to qualified personnel for regular\ncheck-up\nand\nmaintenance\nfollowing\nenterprise\nprocedures\n5.3 Breakdowns are reported to qualified personnel in\naccordance with organization and legislative guidelines\n\n--- PDF PAGE 69 ---\nTR Dental Hygiene NC IV\n\n65\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGES\n1. Radiation safety\nmeasures for patient,\noperator and others\n\n1.1 Radiation safety measures for the client may include:\n1.1.1\nUse of lead aprons\n1.1.2\nAppropriate technique\n1.1.3\nReceptor (film) selection\n1.1.4\nTechnical features of the radiographic unit as\ndetermined by manufacturer specifications\nincluding:\n1.1.4.1 Kilovoltage\n1.1.4.2 Filtration\n1.1.4.3 X-ray beam collimation\n1.2 Radiation safety measures for the operator and others\nincludes but is not limited to:\n1.2.1 Maximum permissible dose (MDP) of radiation\n1.2.2 Determination of pregnancy\n1.2.3 Distance from primary beam\n1.2.4 Use of lead lined barriers\n1.2.5 Legislative requirements\n2. Appropriate technical\nvariables\n\nMay include:\n2.1 Technical variables, milliamperage, kilovoltage and\ntube length are pre-determined by manufacturer\nspecifications for radiographic unit or selected by the\ndentist or dental specialist prior to the procedure:\n-\nselection\nof\ntechnical\nvariables\nof\ndental\nradiographic units by the dental assistant in\naccordance with manufacturers specifications and\npatient requirements may include but is not limited\nto exposure times.\n\n3. Appropriate\nradiographic technique\n\nAppropriate radiographic technique may include:\n3.1 The bisected angle technique\n3.2 The paralleling technique\n3.3 Extra oral techniques:\n-\nhorizontal and vertical angulation\n-\nreceptor (film) selection and placement\n-\ncorrect assembly of film locating device\n-\npositioning of client\n-\nuse of intensifying screens\n\n--- PDF PAGE 70 ---\nTR Dental Hygiene NC IV\n\n66\n\n4. Patient requirements\nMay include but are not limited to:\n4.1 Age\n4.2 Size\n4.3 Weight\n4.4 Physical capabilities\n4.5 Pregnancy\n4.6 Ability to comply with instructions\n4.7 Radiographic view/position\n4.7.1\nIntraoral radiographic views\n4.7.1.1 Occlusal\n4.7.1.2 Periapical\n4.7.1.3 Bitewing view\n4.7.1.4 Full mouth series\n4.7.2\nExtraoral radiographic views\n4.7.2.1 Panoramic films\n4.7.2.2 Cephalometric\n\n5. Accessories\n\nMay include but are not limited to:\n5.1 Film locating devices\n5.2 Film holders\n5.3 Immobilization equipment\n5.4 Intensifying screens\n5.5 Modifications for the use of film locating devices\n\n6. Processing errors\nMay include but are not limited to:\n6.1 Film that is marked\n6.2 Film with inadequate or low contrast\n6.3 Film that is too dark\n6.4 Film that is too light\n\n7. Errors in techniques\nMay include but are not limited to:\n7.1 Incorrect horizontal and vertical angulation\n7.2 Incorrect film placement\n7.3 Incorrect assembly and use of film locating device\n7.4 Incorrect tubehead placement\n7.5 Failure to remove oral appliances and jewellery\n7.6 Over/under exposure\n7.7 Movement of patient or film\n\n8. Organization and\nlegislative guidelines\n\n8.1 Radiation safety act 1999\n8.2 Radiation safety and protection plan\n8.3 X-ray machine operating manuals\n8.4 DOH\nGuidelines\nfor\nOperation\nof\nRadiographic\nEquipment\n\n--- PDF PAGE 71 ---\nTR Dental Hygiene NC IV\n\n67\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Positioned patient and dental radiographic film to obtain\nradiographic image\n1.2 Operated radiographic imaging safely\n1.3 Processed and provided quality assured exposed dental\nradiographic film\n1.4 Demonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n1.5 Applied code of practice for safe use of radiation in\ndentistry\n1.6 Documented/recorded all radiographs taken in the\nlogbook in accordance with the licensing requirements of\nRadiation Health\n2. Underpinning\nknowledge and\nattitudes\n\nKnowledge in\n2.1 Legislative and ethical responsibilities for the safe use of\nradiation in dentistry\n2.2 Relevant legislation and statutory requirements of\nconsent\n2.3 Fundamental knowledge of the radiographic appearance\nof anatomic landmarks, normal dentition and associated\nbony structures for intraoral radiographs\n2.4 Fundamental knowledge of the radiographic appearance\nof dental anomalies and common oral pathological\nconditions\n2.5 Range of dental radiographic imaging techniques and the\nreasons for selection of each technique\n2.6 Features\nand\ncharacteristics\nincluding\nrange\nof\nmovements of a range of dental radiographic equipment\n2.7 Reasons for processing and technique inaccuracies and\nmethods to minimize errors\n3. Underpinning skills\n3.1 Operating radiographic unit\n3.2 Observing safety and health precautions in dental\nradiography\n3.3 Minimizing technical inaccuracies in dental radiographic\nimages\n3.4 Using terms for technical inaccuracies in dental\nradiographic images\n3.5 Processing and maintaining quality and safety in using\nand processing exposed dental radiographic film\n3.6 Using literacy skills to read and follow directions, policies\nand procedures including:\n- occupational\nhealth\nand\nsafety\npolicies\nand\nprocedures\n- infection control policies and procedures\n- practice policies and procedures\n3.7 Using oral communication skills required to fulfill the job\nrole as specified by the dental practice\n\n--- PDF PAGE 72 ---\nTR Dental Hygiene NC IV\n\n68\n4. Resource implications\nThe following resources MUST be provided:\n4.1 A real or simulated dental clinic environment\n4.2 Access to dental radiographic imaging units, radiographic\nviewing equipment and resources normally used in the\nworkplace\n4.3 Relevant documentation such as:\n4.3.1\nIndustry codes of practice\n4.3.2\nNational and local legislation as appropriate\n4.4 A qualified workplace assessor\n\n5. Method of assessment Competency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Oral interview\n5.3 Third party report\n5.4 Portfolio (authenticated evidence of relevant work\nexperience and/or formal/informal learning)\n\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 73 ---\nTR Dental Hygiene NC IV\n\n69\n\nUNIT OF COMPETENCY\nAPPLY THE PRINCIPLE OF RADIATION BIOLOGY AND\nPROTECTION IN DENTAL PRACTICE\nUNIT CODE\nHCS322346\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required\nto minimize the risk of radiation to the client, the operator and\nothers during the exposure of a prescribed dental\nradiographic image. It also describes the quality assurance\nmeasures necessary to ensure all radiographs are of\nconsistent diagnostic standard.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply knowledge of\nionizing radiation to\nproduce a dental\nradiograph\n\n1.1 Knowledge of X-ray properties is demonstrated in\naccordance with occupational health and safety policies\nand procedures in minimizing radiation risks.\n1.2 Technical variables of dental X-ray generating equipment\nare identified and selected in accordance with\nmanufacturer’s specifications and client requirements\n1.3 The main components of tubehead are identified\n1.4 Appropriate technique for the type of cone is identified\nand selected\n2. Apply knowledge of\nradiation biology to\nprotect client, operator\nand others from\nionizing radiation\n\n2.1 Knowledge of the biological effects and risks associated\nwith X-rays are applied in accordance with safe work\npractices in minimizing radiation risks to operator, clients\nand others.\n2.2 Immediate and long term effects of radiation are\ninterpreted in accordance with radiation policies and\nprocedures\n2.3 Units of radiation measurement are applied in\naccordance with radiation policies and procedures\n2.4 Radiation safety measures for the patient, operator\nand others are implemented in accordance with\nestablished procedures\n3. Determine image\ncharacteristics of a\ndental radiographic\nimage to minimize the\nnecessity for retake\n3.1 Visual qualities of the radiograph are ensured of a\ndiagnostic standard\n3.2 Geometric qualities of the radiograph are ensured of a\ndiagnostic standard\n\n--- PDF PAGE 74 ---\nTR Dental Hygiene NC IV\n\n70\n\n4. Minimize radiation by\nmaintaining quality in\nprocessing\n\n4.1 Contents of the film package are identified and\ndetermined in accordance to its usage\n4.2 Quality assurance for processing dental radiographic\nimages are maintained in accordance with OH&S policies\nand procedures\n4.3 Quality assurance processes for the use of radiographic\nchemicals are followed in accordance with\nmanufacturer’s specifications\n4.4 Appropriate conditions for manual and automatic\nprocessing are maintained in accordance with\nmanufacturer’s specifications\n4.5 A range of processing errors are identified and\ncorrective measures are implemented to produce a\ndiagnostic radiograph\n\n--- PDF PAGE 75 ---\nTR Dental Hygiene NC IV\n\n71\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1 X-ray properties\n\nMay include but are not limited to:\n1.1 The intensity of the diagnostic x-ray beam\n1.2 The quality of the diagnostic x-ray beam\n2 Safe work\npractices\n\nMay include:\n2.1 Current code of practice for radiation protection in dentistry\n2.2 Legislative requirements\n2.3 Dental practice/organization policies and procedures\n2.4 DOH Guidelines for Operation of Radiographic Equipment\n3 Units of radiation\nmeasurement\n\nMay include:\n3.1 Radiation absorbed dose\n3.2 Equivalent dose\n3.3 Effective dose\n3.4 Collective affective dose\n3.5 Dose rate\n4 Radiation safety\nmeasures for the\nclient, operator\nand others\n\n4.1 Radiation safety measures for client includes but are not\nlimited to:\n-\nUse of lead apron\n-\nAppropriate technique\n-\nFilm selection\n-\nTechnical features of the radiographic unit as determined\nby manufacturer specifications including kilovoltage,\nfiltration, x-ray beam collimation\n-\nUse of film locating devices\n-\nCorrect processing procedures to minimize retakes\n-\nLegislative requirements and code of practice\n4.2 Radiation safety measures for the operator and others\nincludes but is not limited to:\n-\nMaximum permissible dose (MPD) of radiation\n-\nDetermination of pregnancy\n-\nDistance from primary beam\n-\nUse of lead line barriers\n-\nMaintenance of radiographic equipment\n-\nLegislative requirements\n5 Geometric\ncharacteristics of\nthe image\nMay include:\n5.1 Blurred image due to motion of patient\n5.2 Distortion due to incorrect technique\n\n--- PDF PAGE 76 ---\nTR Dental Hygiene NC IV\n\n72\n\n6 Quality\nassurance for\nprocessing\nMay include but are not limited to:\n6.1 Image quality assessment\n6.2 X-ray equipment and appropriate maintenance\n6.3 Darkroom and image receptors including x-ray film an cassettes\n6.4 Processing\n6.5 Working procedures\n7 Processing\nerrors\nMay include:\n7.1 Film is too dark\n7.2 Film that is too light\n7.3 Film with inadequate or low contrast\n7.4 Film that is marked\n\n--- PDF PAGE 77 ---\nTR Dental Hygiene NC IV\n\n73\n\nEVIDENCE GUIDE\n1 Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Applied knowledge of ionizing radiation to produce a dental\nradiograph\n1.2 Applied knowledge of radiation biology to protect patients,\noperator and others from ionizing radiation\n1.3 Determined image characteristics of a dental radiographic\nimage to minimize re-takes\n1.4 Minimized radiation by maintaining quality in processing\n1.5 Demonstrated consistent compliance with infection control\nguidelines and legislative requirements\n1.6 Demonstrated consistent performance over the required range\nof workplace situations including:\n-\ncorrect preparation of clients for dental radiographic\nimaging procedures\n-\napplication of radiation occupational health and safety\npolicies and procedures to minimize the risk of radiation to\nthe patient, operator and others during the exposure of a\nprescribed dental radiographic image\n-\nimplementation of quality assurance measures to ensure\nproduction of radiographs to consistent diagnostic standard\n2 Underpinning\nknowledge\n\nKnowledge in:\n2.1 Code of practice for radiation protection in dentistry:\n-\nprocedures for minimizing radiation risks to patients, self,\nthe oral health care team and the public\n-\nmethods for monitoring the adequacy of radiation\nprotection\n-\nthe organization’s quality assurance policy for producing\nradiographs to a consistent diagnostic standard\n-\nthe purpose of quality assuring dental radiographs and its\nrelationship to radiation protection\n2.2 Production, properties and interaction of the x-rays including:\n-\nbasic knowledge of atomic physics\n-\nmain features and practical requirements of the x-ray tube\n-\nthe sequence of events that result in the production of x-\nrays\n-\nhazards associated with x-rays including the mechanism by\nwhich x-rays cause damage to human tissues\n2.3 Biological effects and risks associated with x-rays including:\n-\nimmediate or acute effects\n-\nlong terms or chronic effects\n2.4 Units of radiation measurements\n2.5 Radiographic appearance of anatomic landmarks, normal\ndentition and associated bony structures\n2.6 Reasons for processing and technique inaccuracies and\nmethods to minimize errors\n\n--- PDF PAGE 78 ---\nTR Dental Hygiene NC IV\n\n74\n\n3 Underpinning\nskills\n\n3.1 Using safe work practices to minimize the risk of transmission\nof infection\n3.2 Using correct accessories in dental radiographic techniques\n3.3 Minimizing technical inaccuracies in dental radiographic\nimages\n3.4 Minimizing errors and maintaining quality assurance in\nprocessing procedures\n3.5 Applying correct dental terminology\n3.6 Selecting appropriate film variables including:\n-\nfilm speed\n-\nfilm size\n-\nintensifying screens\n3.7 Selecting and using correct techniques including:\n-\nbisecting angle (intraoral)\n-\nparalleling (intraoral)\n-\nextraoral\n\n4 Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 A real or simulated dental clinic environment\n4.2 Access to dental radiographic imaging units and resources\nnormally used in the workplace\n4.3 Relevant dental practice/organization policy and procedures\nmanuals such as:\n-\nincident reporting procedures\n-\ninfection control guidelines\n-\nOH&S policies and procedures\n4.4 Relevant national/local legislation\n4.5 Manufacturer’s specifications for dental radiographic units\n4.6 Radiographic viewing equipment\n4.7 A qualified workplace assessor\n\n5 Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Oral interview\n5.3 Third party report\n5.4 Portfolio (authenticated evidence of relevant work experience\nand/or formal/informal learnings\n6 Context of\nassessment\n\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 79 ---\nTR Dental Hygiene NC IV\n\n75\n\nUNIT OF COMPETENCY:\nPERFORM SCALING AND POLISHING\nUNIT CODE:\nHCS322347\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes require\nto perform dental cleaning of teeth through scaling,\npolishing, and fluoride application.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform dental charting\non patient\n\n1.1 Dental charting is performed on patient to determine the\ntype of treatment to be done.\n1.2 Precautions are undertaken based on patient’s oral and\nmedical condition.\n1.3 Patient and operator are positioned in accordance with\nthe dental cleaning procedures.\n2. Scale and polish teeth\n\n2.1 Dental cleaning instrument and devices are identified\nand prepared in accordance with patient requirements\n2.2 Dental cleaning instrument is set, operated and adjusted\nin accordance with manufacturer’s specifications and\npatient’s convenience/comfort.\n2.3 Deposits are removed from the surface of the tooth in\naccordance with dental established procedures\n2.4 Devices or finer hand tools are used to remove smaller\ndeposits and smoothen the tooth surface\n2.5 Moderate amount of pressure is applied in removing\nsupra and subgingival calcular deposits.\n2.6 Scaled teeth are polished.\n2.7 Appropriate\ndental\nmaterial\nmay\nbe\napplied\naccordingly.\n2.8 Unexpected events are responded to in accordance\nwith existing medical practices\n3. Motivate the patient\n3.1 Findings are discussed with patient in layman’s terms\n3.2 Where necessary, follow-up appointment is scheduled in\nthe next 2 weeks to check on the improvement\n3.3 Routine examination of the teeth is recommended for at\nleast every six months or depending on the needs of the\npatient\n3.4 Patient is advised on proper home-care and dental\nrecall based on results of oral examination and dental\ndiagnosis\n3.5 Where necessary, patient is referred to dentist or other\nmedical professionals for appropriate/further treatment\n\n--- PDF PAGE 80 ---\nTR Dental Hygiene NC IV\n\n76\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Precautions\n1.1 Patients with heart-valve disease must take antibiotics\nto prevent bacteria to spread into the blood stream that\ncould cause endocarditis\n1.2 Patients with history or possibility of hypertension\nshould have their blood pressure monitored.\n1.3 Patients with relevant allergies\n1.4 Patients with medication such as blood thinners\n1.5 Patients with HIV or other contagious diseases\n1.6 Patients with mental disorders\n1.7 Patients\nwith\nartificial\nprosthetic\ndevices\nand\ntransplants\n1.8 Patients who have a history of taking biphosponates\n2. Dental cleaning\ninstrument and devices\n\nMay include but are not limited to:\n2.1 Ultrasonic machine\n2.2 Scalers and curettes\n2.3 Micromotor\n2.4 Prophylactic Brush\n2.5 Rubber Cup\n2.6 Mouth Mirror\n2.7 Cotton Pliers\n2.8 Explorer\n2.9 Periodontal probe\n3. Deposits\nMay include but are not limited to:\n3.1 Plaque\n3.2 Calculus\n3.3 Stains\n\n4. Dental material\n\nIt includes:\n4.1 Prophylaxis paste\n4.2 Sealant\n4.3 Fluoride gel\n4.4 Fluoride tray\n4.5 Topical anesthesia\n4.6 Composite material\n\n5. Unexpected events\nMay include:\n5.1 Fainting/Syncope\n5.2 Hemorrhage or bleeding\n5.3 Hypertension/stroke\n5.4 Dislocation of TMJ (Temporo-Mandibular Joint)\n5.5 Accidental blocking of air passage\n\n--- PDF PAGE 81 ---\nTR Dental Hygiene NC IV\n\n77\n\n6. Response\n6.1 Stop procedures\n6.2 First aid e.g. mouth to mouth resuscitation\n6.3 Removal of air way blockage\n6.4 Apply pressure on the affected area\n6.5 Referral or transport of the patient to the appropriate\nmedical specialist\n\n7. Proper home-care and\ndental recall\n7.1 Proper instructions/advices on food intake, drug\nprescription and lifestyles\n7.2 Proper tooth brushing techniques\n7.3 Proper using of dental floss and mouth wash\n7.4 Proper care of dentures/teeth, gums and tongue\n\n--- PDF PAGE 82 ---\nTR Dental Hygiene NC IV\n\n78\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Positioned patient for dental diagnosis\n1.2 Performed tooth scaling and polishing\n1.3 Provided oral-health advice to patient\n1.4 Demonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n\n2. Underpinning\nknowledge\n\nKnowledge in:\n2.1 Oral anatomy\n2.2 Oral physiology\n2.3 Anatomy and Physiology\n2.4 Infection-control procedures\n2.5 Dental materials\n2.6 Periodontology\n2.7 Restorative dentistry\n2.8 Pathology\n2.9 Dental anesthesia\n2.10 Pharmacology\n2.11 Dental jurisprudence and ethics\n2.12 Basic computer\n2.13 Nutrition\n\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Maintaining personal hygiene\n3.4 Language, literacy and numeracy skills appropriate to\nthe role and workplace requirements\n3.5 Operational skills to consistently use time effectively\nand provide quality customer service in the dental\nenvironment\n3.7 Computer skills\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 A real or simulated dental clinic environment\n4.2 Relevant documentation such as:\n4.2.1\nIndustry codes of practice\n4.2.2\nNational and local legislation as appropriate\n4.3 A qualified workplace assessor\n5. Method of assessment\n\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Written test\n5.3 Interview\n5.4 Portfolio\n\n6. Context of assessment\n\n6.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 83 ---\nTR Dental Hygiene NC IV\n\n79\n\nUNIT OF COMPETENCY\nMAINTAIN DENTAL RECORDS AND RESOURCES\nUNIT CODE\nHCS322348\nUNIT DESCRIPTOR\nThis unit covers the knowledge, skills and attitudes required\nto maintain patients/clients dental records and resources.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain patient’s\nrecords\n1.1 Patient’s/client’s vital signs are measured and\nrecorded in accordance with clinic procedures.\n1.2 Patient’s/client’s chief complaint are probed and\nrecorded in accordance with clinic procedures.\n1.3 Where applicable patient/client is rescheduled for\nanother appointment to dental specialist or medical\nspecialist.\n1.4 Returning patient’s/client’s record/dental history is\nretrieved and referred to where appropriate.\n1.5 Patient’s/client’s dental history/record is updated based\non hygienist or dentist’s findings.\n2. Maintain financial\nrecords of the clinic\n2.1 Payments are received and recorded in accordance\nwith accounting procedures\n2.2 Billings and other related communications are\nprepared and sent to health insurance and other\ncompanies\n2.3 Payments of patient’s/clients are monitored\n3. Purchase dental\nproducts\n3.1 Stocks are inventoried/monitored for replenishment\n3.2 Dental equipment and materials are procured in\naccordance with established procedures\n3.3 Purchased dental equipment and materials are\ninspected /tested and returned to suppliers where\nnecessary\n3.4 Dental materials and equipment are documented and\nstored/safekept in appropriate area/location\n4. Monitor quality control\n4.1 Service quality standards is established according to\nlegal requirements, patient’s/client’s requirements and\ndental policy\n4.2 Quality of service is monitored and ensured during\ndelivery processes\n4.3 Client feedbacks are solicited, recorded and analyzed\nin accordance with quality requirements\n\n--- PDF PAGE 84 ---\nTR Dental Hygiene NC IV\n\n80\n\n4. Comply with dental\nethics and\njurisprudence\n4.1 Key elements of major legal systems affecting\nbusiness to dental clinic operations are examined to\nensure full compliance under legal and legislative\nprovisions\n4.2 Various issues affecting different forms of contract\nare compared within business operations\n4.3 Statutory and legal requirements for the delivery of\ndental services are determined across the industry\n4.4 Dental products are handled and stored according to\nstandards, policies and procedures, and safety\npractices\n4.5 Compliance with standards on current dental services,\nmaterials and equipments are monitored in accordance\nwith statutory and legal requirements\n\n--- PDF PAGE 85 ---\nTR Dental Hygiene NC IV\n\n81\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Vital signs\nIt includes:\n1.1 Blood Pressure\n1.2 Heart Rate\n1.3 Pulse Rate\n2. Findings\nIt includes:\n2.1 Poor oral hygiene\n2.2 Halitosis\n2.3 Dental Caries\n2.4 Gingivitis\n2.5 Periodontitis\n2.6 Abrasion, Attrition, Erosion\n2.7 Heavy Stains\n3. Payments\n3.1 Cash\n3.2 Installment\n3.3 Post dated cheques\n3.4 Health insurance claims\n4. Billings and other related\ncommunications\n4.1 Client billings\n4.2 Health card billings\n4.3 Follow-up/Demand letter\n5. Legal requirements\nMay include but are not limited to:\n5.1 Types of products and services provided\n5.2 Size, type and location of business\n5.3 Characteristics of specific products or services\n5.4 Worksite-specific context, variations and\nenvironments\n6. Legal systems\nMay include but are not limited to:\n6.1 Workplace relations\n6.2 Industry codes and practices\n6.3 License, patent or copyright arrangements\n\n7. Legal and legislative\nprovisions\nMay include but are not limited to:\n7.1 Dental Law\n7.2 Occupational Health and Safety (OHS)\n7.3 Workplace relations\n7.4 Workers’ compensations\n7.5 Equal employment opportunity (EEO)\n7.6 Environmental protection legislation\n\n8. Different forms of\ncontract\nMay include but are not limited to:\n8.1 Letters of appointments or intent\n8.2 Memorandum of agreement\n8.2.1 External contracts\n8.2.2 Written contracts\n8.3 Terms of payment agreement\n8.4 Purchase order\n8.5 Petty cash\n\n--- PDF PAGE 86 ---\nTR Dental Hygiene NC IV\n\n82\n\n9. Satutory and legal\nrequirements\nMay include but are not limited to:\n9.1 Equal Employment Opportunity (EEO)\n9.2 Disciplinary procedures\n9.3 Awards and agreements\n9.4 Wages and conditions\n9.5 OHS\n9.6 Anti-discrimination\n9.7 Company policies and procedures\n\n--- PDF PAGE 87 ---\nTR Dental Hygiene NC IV\n\n83\nEvidence Guide\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained patient’s records\n1.2 Maintained financial records of the clinic\n1.3 Purchased dental products\n1.4 Monitored quality control\n1.5 Complied with dental ethics and jurisprudence in\naccordance with legal and legislative provisions\n1.6 Demonstrated knowledge on dental law, and other\nrelevant legal and statutory requirements\n2. Underpinning\nknowledge\n2.1 Dental Act of 2007 (RA No. 9484)\n2.2 Relevant standards, policy and procedures on dental\nhygiene practices\n2.3 Relevant statutory and legal requirements\n2.4 Human resource development\n2.5 Staffing performance appraisals\n2.6 Employee relations\n2.7 Maintenance Program/Procedures for dental equipment\nand facilities\n2.8 Dental Ethics and Jurisprudence\n2.9 Occupational Health and Safety (OHS)\n3. Underpinning skills\n3.1 Interpersonal communication skills\n3.2 Monitoring staff performance\n3.3 Conducting performance appraisal\n3.4 Applying relevant legal principles\n3.5 Dental clinic maintenance and procurement program\n3.6 Following safe work practices and applying standard\nprecautions during maintenance of equipment:\n3.6.1 checking items for defects after cleaning\n3.6.2 selecting and safely using appropriate cleaning\n agents\n3.6.3 selecting and wearing appropriate personal\nprotective equipment\n3.7 Recording and reporting\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Appropriate personnel, supplies and materials\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting or environment.\n\n--- PDF PAGE 88 ---\nTR Dental Hygiene NC IV\n\n84\n\nUNIT OF COMPETENCY\nPROVIDE EFFECTIVE PATIENT/CLIENT SERVI CE\nUNIT CODE\nHCS322349\nUNIT DESCRIPTOR\nThis unit of competency deals with the knowledge, skills and\nattitudes in providing effective patient/client service. It\nincludes greeting patient/client, identifying patient/client\nneeds, delivering service to patient/client, handling queries\nthrough telephone, fax machine, internet and email and\nhandling complaints, evaluation and recommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Greet patient/client\n1.1 Patient’s/client’s are greeted in line with dental\nprocedure\n1.2 Verbal and non-verbal communications are\nappropriate to the given situation\n1.3 Non verbal communication of patient/client is\nobserved responding to patient/client\n1.4 Sensitivity to cultural and social differences is\ndemonstrated\n2. Identify patient/client\nneeds\n2.1 Appropriate interpersonal skills are used to ensure\nthat patient/client needs are accurately identified\n2.2 Patient/client needs are assessed for urgency so\nthat priority for dental service delivery can be\nidentified\n2.3 Patient/client are provided with information regarding\ndental procedures\n2.4 Personal limitation in addressing patient/client needs\nis identified and where appropriate, assistance is\nsought from dentist\n\n3. Deliver dental service to\npatient/client\n3.1 Patient/client needs are promptly attended to in line\nwith dental procedures\n3.2 Appropriate rapport is maintained with patient/client\nto enable high quality dental service\n3.3 Opportunity to enhance the quality of dental services\nare taken wherever possible\n\n--- PDF PAGE 89 ---\nTR Dental Hygiene NC IV\n\n85\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n4. Handle queries through\ntelephone, fax machine,\ninternet and email\n4.1 Use telephone, computer, fax machine, internet\nefficiently to determine patient/client requirements\n4.2 Queries/ information are recorded in line with\ndental procedure\n4.3 Queries are acted upon promptly and correctly in\nline with dental procedure\n5. Handle complaints,\nevaluation and\nrecommendations\n5.1 Patient/clients are greeted with a smile and eye-\nto-eye contact\n5.2 Responsibility for resolving the complaint is taken\nwithin limit of responsibility\n5.3 Nature and details of complaint are established\nand agreed with the patient/client\n5.4 Appropriate treatment is taken to resolve the\ncomplaint to the patient/client satisfaction\nwherever possible\n\n--- PDF PAGE 90 ---\nTR Dental Hygiene NC IV\n\n86\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Non-verbal\ncommunication\n1.1 body language\n1.2 dress and accessories\n1.3 gestures and mannerisms\n1.4 voice tonality and volume\n1.5 use of space\n1.6 culturally specific communication customs and\npractices\n2. Cultural and social\ndifferences\nIncludes but are not limited to :\n2.1 modes of greeting, farewelling and conversation\n2.2 body language/ use of body gestures\n2.3 formality of language\n3. Interpersonal skills\n3.1 interactive communication\n3.2 public relation\n3.3 good working attitude\n3.4 sincerity\n3.5 pleasant disposition\n3.6 effective communication skills\n4. Patient/client needs\nPatient/client with specific needs may include :\n4.1 those with a disability\n4.2 those with special cultural or language needs\n4.3 unaccompanied children\n4.4 parents with young children\n4.5 pregnant women\n4.6 single women\n5. Dental clinic procedure\nDental clinic procedures may include :\n5.1 modes of greeting and farewell\n5.2 addressing the person by name\n5.3 time-lapse before a response\n5.4 style manual requirements\n5.5 standard letters and proforma\n\n--- PDF PAGE 91 ---\nTR Dental Hygiene NC IV\n\n87\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety practices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with dental clinic facilities,\nproducts and services\n1.7 Applied dental clinic rules and standards\n1.8 Applied telephone ethics\n1.9 Applied correct procedure in using telephone, fax\nmachine, internet\n1.10 Handled patient/client complaints\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with\nsincerity\n2.2 Safety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3 Attitude\n 2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4 Theory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n3. Underpinning Skills\n3.1 Effective communication skills\n3.2 Non-verbal communication - body language\n3.3 Good time management\n3.4 Ability to work calmly and unobtrusively effectively\n3.5 Ability to handle telephone inquiries and\n conversations\n3.6 Correct procedure in handling telephone inquiries\n3.7 Proper way of handling complaints\n\n--- PDF PAGE 92 ---\nTR Dental Hygiene NC IV\n\n88\n\n4. Resource\nImplications\n4.1 Availability of telephone, fax machine, internet, etc.\n4.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3 Availability of office supplies\n5. Methods of\nAssessment\n5.1 Written examination\n5.2 Practical demonstration\n\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 93 ---\nTR Dental Hygiene NC IV\n\n89"
