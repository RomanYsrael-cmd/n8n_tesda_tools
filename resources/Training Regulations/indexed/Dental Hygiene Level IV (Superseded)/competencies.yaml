        "source_title": "PROMOTE ORAL HEALTH AND HYGIENE",
        "source_text": "--- PDF PAGE 60 ---\nTR Dental Hygiene  NC IV                      \n \n \n56\n \n \n \nUNIT OF COMPETENCY: \nPROMOTE ORAL HEALTH AND HYGIENE \nUNIT CODE: \nHCS322344 \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitude required \nto provide an oral health promotion program in both dental \nclinic and community setting. It acknowledges that dental \ndiseases are the most prevalent chronic diseases worldwide \nand that oral diseases impacts on a person’s everyday life \ncausing pain and disability and influencing eating, sleeping \nand social roles. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Develop oral health \npromotion strategies \nfor the target group \n \n1.1 Information on the causes and prevention of oral \ndiseases is provided to the target group using language \nthat can be easily understood. \n1.2 Information on acids and fermentable carbohydrates \nare developed and given in a manner that can be easily \nunderstood \n1.3 Target group are involved in the review of current dietary \nhabits and the development of an approach to healthy \neating which improves general and oral health \n1.4 Information is provided on dentally healthy lifestyle and \nbehavioral change \n1.5 Appropriate environment is provided for the target group to \nask questions and become involved in oral health \n2. Implement an oral \nhealth promotion \nprogram \n \n2.1 Target group and appropriate teaching and learning \nstyles are identified to effectively communicate an oral \nhealth promotion program \n2.2 Oral health issues are prioritized for the target group and \nthe potential for interventions \n2.3 Suitable oral health promotion materials are prepared \nfor use across age groups \n2.4 Flexibility of delivery of oral health promotions are ensured \nby taking into account the target group’s location, \neconomic and physical circumstances, language, culture \nand communication needs \n2.5 Community groups are actively involved in health \ndecisions making and setting of oral health promotion \npriorities\n\n--- PDF PAGE 61 ---\nTR Dental Hygiene  NC IV                      \n \n \n57\n \n \n2.6 A review strategy is implemented to determine the \neffectiveness of the oral health promotion program \n2.7 Work collaboratively with other health care workers in a \nculturally sensitive and competent manner to address risk \nfactors that oral diseases have in common with other \ndiseases \n2.8 The delivery of health information is personalized so that it \nis immediately relevant to the individual and the \nconsequences of behavior\n\n--- PDF PAGE 62 ---\nTR Dental Hygiene  NC IV                      \n \n \n58\nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGES \n1. Teaching and \nlearning styles \n \nMay include but are not limited to: \n1.1 Auditory learning \n1.2 Visual learning \n2. Oral health issues \ntargeted in an oral \nhealth promotion \nprogram \n \n2.1 Dental caries \n2.2 Periodontal diseases \n2.3 Non carious tooth wear \n- \nerosion \n- \nabrasion \n- \nattrition \n2.4 Damage to dentition due to trauma \n2.5 Damage to oral diseases due to cigarette smoking \n2.6 Harmful effects of low salivary flow \n2.7 Interrelationship between oral health and individual \nmedical conditions \n2.8 Poor nutrition and poor oral health \n3. Oral health \npromotion materials \n \n3.1 Power point presentations \n3.2 Videos \n3.3 Brochures and information sheets \n3.4 Models \n4.  Age group \nMay include but are not limited to: \n4.1 Children and adolescents \n4.2 Older people \n4.3 Low income and socially disadvantaged \n4.4 People with special needs \n5. Causes and \nprevention of oral \ndiseases \n \nMay include but are not limited to: \n5.1 Causes of oral diseases \n5.1.1 Bacteria in dental plaque \n5.1.2 Diet \n- \nconsumption of foods with high sugar content \n- \nfrequently consumption foods with high sugar \ncontent \n- \nconsumption of highly acidic food and drinks \n5.1.3 \nSusceptible tooth surfaces \n5.1.4 \nAlterations to the quantity and composition of saliva \n5.1.5 \nSmoking\n\n--- PDF PAGE 63 ---\nTR Dental Hygiene  NC IV                      \n \n \n59\n5.1.6 \nLifestyle \n \n5.2 Prevention of oral diseases \n5.2.1 \nIncreasing salivary flow and optimizing its \ncomposition \n5.2.2 \nPromoting the use of fluorides \n5.2.3 \nPlaque control  \n5.2.3.1 Encourage regular dental care \n5.2.4 \nDietary change \n5.2.5 \nDiscouraging tobacco use \n5.2.6 \nDiscouraging alcohol, drug and substance abuse \n5.2.7 \nPreventing oral trauma e.g. sports injuries \n \n6. Information on acids \nand fermentable \ncarbohydrates \nMay include but are not limited to: \n6.1 The development of dental caries and its relation to: \n- \nthe frequency of eating foods containing added sugars \n- \nthe consistency of food containing added sugars \n- \nthe consumption of highly acidic drinks that may also \nhave a high sugar content \n \n7. Dentally healthy \nlifestyle and \nbehavioural change  \nMay include but are not limited to: \n7.1 Adequate oral hygiene measures \n7.2 Decreased intake of alcohol and caffeine \n7.3 Decreased intake of fermentable carbohydrates \n7.4 Cessation of smoking \n \n8. Common risk factors May include but are not limited to: \n8.1 Poor oral hygiene \n8.2 Poor diet and nutrition \n8.3 Smoking \n8.4 Alcohol consumption \n8.5 Exposure to ultraviolet radiation \n8.6 Lifestyle factors \n8.7 Defective dental restorations\n\n--- PDF PAGE 64 ---\nTR Dental Hygiene  NC IV                      \n \n \n60\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1     Delivers an oral health promotion program \n1.2 \nDevelops an oral health promotion strategies for target \ngroup \n1.3 \nIntegrates oral health promotions with targeted National \nhealth priorities \n1.4 \nDemonstrates consistent compliance with legislative \nrequirements, infection control guidelines and \noccupational health and safety procedures \n1.5 \nDemonstrates consistent performance over the required \nrange of workplace situations including \n- \nthe ability to communicate effectively across population \ngroups \n- \nthe development of oral health program strategies for \nspecific target groups within the community \n- \nintegration of oral health promotion with targeted \nNational health priorities \n \n2. Underpinning \nknowledge  \n \nKnowledge in \n2.1 Applied head and neck anatomy \n- \nstructures of the oral cavity – hard and soft palate, \nlateral and posterior borders of the oral cavity, tongue \nand floor of the mouth \n- \nteeth – form and function \n- \ndentition – arrangement of the teeth, naming and \ncoding of teeth \n2.2 Nutritional requirements for children, adolescents and \nadults including elderly \n- \nDOH dietary guidelines \n2.3 Dental biofilm and its differing roles in the development of \ndental caries, periodontal disease and general health \n2.4 Saliva and its role in the maintenance of oral health \n- \nprotecting teeth by neutralizing acid \n- \nacting as a lubricant \n- \ndelivering calcium, phosphate and fluoride to the tooth \nsurface \n2.5 The interaction of factors that lead to the development of \ndental caries including: \n- \nbacteria in dental biofilm \n- \ndiet \n- \nsusceptible tooth surfaces and other risk factors \n2.6 The interaction of factors that prevent and control dental \ncaries: \n- \nincreasing salivary flow and optimizing its composition \n- \nfluorides \n- \ndental biofilm control and calculus removal \n- \ndietary change\n\n--- PDF PAGE 65 ---\nTR Dental Hygiene  NC IV                      \n \n \n61\n2.7 The interaction of factors that lead to the development of \nperiodontal disease including: \n- \nbacteria in dental biofilm \n- \naccumulation of dental biofilm and calculus \n- \nsmoking \n2.8 The interaction of factors that prevent and control \nperiodontal disease including: \n- \nclient education \n- \ndental biofilm control \n2.9 Causes, and prevention, of non caries tooth wear: \n- \nerosion \n- \nabrasion \n- \nattrition \n2.10 The role of properly constructed and fitted mouthguards \nin preventing dental injuries \n2.11 Fundamental knowledge of the impact of smoking on \noral soft  tissues \n2.12 Fundamental knowledge of systemic conditions which \ninfluence the development of oral disease \n2.13 Local oral factors which influence the development of \noral disease \n2.14 Modifications to oral health education programs related \nto special needs due to disability, aged care and child \nneeds \n \n3.  Underpinning skills \n3.1 Using evaluation skills to review the effectiveness of an \noral health promotion program \n3.2 Using communication skills to effectively inform and \nmotivate behavior change \n3.3 Demonstrating interpersonal skills when relating to people \nfrom a range of social, cultural and religious backgrounds \nand physical and mental abilities \n3.4 Dealing with conflict \n3.5 Working with others and emphatizing with client and \nrelatives \n3.6 Applying problem solving skills \n \n4. Resource \nimplications \n \nThe following resources MUST be provided: \n4.1 A real or simulated dental clinic environment \n4.2 Relevant documentation such as: \n4.2.1 Case problems on community-based oral health \npromotion \n4.2.2 Industry codes of practice \n4.2.3 National and local legislation as appropriate \n4.3 A qualified workplace assessor\n\n--- PDF PAGE 66 ---\nTR Dental Hygiene  NC IV                      \n \n \n62\n \n5. Method of \nassessment \n \nCompetency may be assessed through: \n5.1    Demonstration with oral questioning \n5.2 Interview \n5.3 Third party report \n \n6. Context of \nassessment \n \n6.1 Assessment may be conducted in the workplace or in a \nsimulated environment\n",
