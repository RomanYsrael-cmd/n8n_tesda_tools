        "source_text": "--- PDF PAGE 10 ---\nTR Dental Hygiene  NC IV                      \n \n \n6\n \nUNIT OF COMPETENCY \nDEVELOP TEAMS AND INDIVIDUALS \nUNIT CODE \n500311116 \nUNIT DESCRIPTOR \nThis unit covers the skills, knowledge and attitudes required to \ndetermine individual and team development needs and facilitate \nthe development of the workgroup. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated in the \n Range of Variables \n1. Provide team \nleadership \n1.1. \nLearning and development needs are systematically \nidentified and implemented in line with organizational \nrequirements \n1.2. \nLearning plan to meet individual and group training \nand developmental needs is collaboratively developed \nand implemented \n1.3. \nIndividuals are encouraged to self evaluate \nperformance and identify areas for improvement \n1.4. \nFeedback on performance of team members is collected \nfrom relevant sources and compared with established team \nlearning process \n2. Foster individual \nand organizational \ngrowth \n2.1. \nLearning and development program goals and objectives are \nidentified to match the specific knowledge and skills \nrequirements of competency standards \n2.2. \nLearning delivery methods are appropriate to the learning \ngoals, the learning style of participants and availability of \nequipment and resources \n2.3. \nWorkplace learning opportunities and coaching/ mentoring \nassistance are provided to facilitate individual and team \nachievement of competencies \n2.4. \nResources and timelines required for learning activities are \nidentified and approved in accordance with organizational \nrequirements \n3. Monitor and \nevaluate workplace \nlearning \n3.1. \nFeedback from individuals or teams is used to identify and \nimplement improvements in future learning arrangements \n3.2. \nOutcomes and performance of individuals/teams are \nassessed and recorded to determine the effectiveness of \ndevelopment programs and the extent of additional support \n3.3. \nModifications to learning plans are negotiated to improve the \nefficiency and effectiveness of learning \n3.4. \nRecords and reports of competency are maintained within \norganizational requirement\n\n--- PDF PAGE 11 ---\nTR Dental Hygiene  NC IV                      \n \n \n7\n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated in the Range of Variables \n4. Develop team \ncommitment and \ncooperation \n4.1. \nOpen communication processes to obtain and share \ninformation is used by team \n4.2. \nDecisions are reached by the team in accordance with its \nagreed roles and responsibilities \n4.3. \nMutual concern and camaraderie are developed in the \nteam \n5. Facilitate \naccomplishment of \norganizational goals \n5.1. \nTeam members actively participated in team activities and \ncommunication processes \n5.2. \nTeams members developed individual and joint \nresponsibility for their actions \n5.3. \nCollaborative efforts are sustained to attain organizational \ngoals\n\n--- PDF PAGE 12 ---\nTR Dental Hygiene  NC IV                      \n \n \n8\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.    Learning and  \n      development needs \n \n1.1 \nCoaching, mentoring and/or supervision \n1.2 \nFormal/informal learning program \n1.3 \nInternal/external training provision \n1.4 \nWork experience/exchange/opportunities \n1.5 \nPersonal study \n1.6 \nCareer planning/development \n1.7 \nPerformance appraisals \n1.8 \nWorkplace skills assessment \n1.9 \nRecognition of prior learning \n2.   Organizational      \n      requirements \n2.1       Quality assurance and/or procedures manuals \n2.2       Goals, objectives, plans, systems and processes \n2.3       Legal and organizational policy/guidelines and \nrequirements \n2.3 \nSafety policies, procedures and programs \n2.4 \nConfidentiality and security requirements \n2.5 \nBusiness and performance plans \n2.6 \nEthical standards \n2.7 \nQuality and continuous improvement processes  \nand standards \n3.   Feedback on    \n      performance \n3.1 \n   Formal/informal performance appraisals \n3.2 \n   Obtaining feedback from supervisors and    \n            colleagues \n3.3       Obtaining feedback from clients \n3.4       Personal and reflective behavior strategies \n3.5       Routine and organizational methods for monitoring  \nservice delivery \n4.   Learning delivery   \n     methods \n4.1 \nOn the job coaching or mentoring \n4.2 \nProblem solving \n4.3 \nPresentation/demonstration \n4.4 \nFormal course participation \n4.5 \nWork experience \n4.6 \nInvolvement in professional networks \n4.7 \nConference and seminar attendance \n4.8 \nInduction\n\n--- PDF PAGE 13 ---\nTR Dental Hygiene  NC IV                      \n \n \n9\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Identified and implemented learning opportunities for others \n1.2. Gave and received feedback constructively \n1.3. Facilitated participation of individuals in the work of the team \n1.4. Negotiated learning plans to improve the effectiveness of \nlearning \n1.5. Prepared learning plans to match skill needs \n1.6. Accessed and designated learning opportunities \n2. Underpinning \nknowledge  \n2.1. Coaching and mentoring principles \n2.2. Understanding how to work effectively with team members \nwho have  diverse work styles, aspirations, cultures and \nperspective \n2.3. Understanding how to facilitate team development and \nimprovement \n2.4. Understanding methods and techniques for eliciting and \ninterpreting feedback \n2.5. Understanding methods for identifying and prioritizing \npersonal development opportunities and options \n2.6. Knowledge of career paths and competency standards in the \nindustry \n3. Underpinning \nskills \n3.1. Ability to read and understand a variety of texts, prepare \ngeneral information and documents according to target \naudience; spell with accuracy; use grammar