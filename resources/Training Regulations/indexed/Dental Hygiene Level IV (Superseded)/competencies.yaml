          "source_text": "1.  Prepare to clean \nused items \n \n1.1 \nSafe work practices and standard precautions are \nfollowed at all times in accordance with legislative and \nworkplace guidelines. \n1.2 \nSharps and sharps debris are disposed into a container \nand in accordance with workplace guidelines. \n1.3      Waste is segregated and disposed in accordance with \norganization and legislative guidelines. \n2.  Clean and dry used \nitems \n2.1 \nWorkflow protocols are maintained in instrument \nreprocessing area and in accordance with workplace \nguidelines. \n2.2 \nInstruments are prepared for cleaning and in \naccordance with workplace guidelines. \n2.3 \nAppropriate cleaning agents are selected and used in \naccordance with workplace guidelines and \nmanufacturer’s specification. \n2.4 \nCleaning methods that avoid the generation of aerosols \nare used in accordance with workplace guidelines. \n2.5 \nInstruments are dried and inspected for damage and \nremaining debris and in accordance with workplace \nprocedures. \n2.6 \n Cleaning process is monitored in accordance with \nworkplace guidelines. \n \n3.  Prepare and pack \nitems for storage \n \n3.1      Instruments with hinges or ratchets are opened and \nunlocked in accordance with standard operating \nprocedures. \n3.2 \nInstrument trays are prepared in accordance with \nworkplace protocols. \n3.3 \nCritical site instruments are packaged or wrapped in a \nmanner that prevents damage to delicate items.\n\n--- PDF PAGE 37 ---\nTR Dental Hygiene  NC IV                      \n \n \n33\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1. Safe work practices \n            \n \nMay include but are not limited to: \n1.1 \nTreatment of all items as a potential source of infection \n1.2 \nPersonal hygiene practices especially washing and \ndrying hands \n1.3 \nWork practices for the safe handling of sharps \n1.4 \nWork practices for the safe disposal of sharps and other \nclinical waste \n1.5 \nThe use of personal protective equipment: \n1.5.1 heavy duty gloves \n1.5.2 mask and protective eyewear \n1.5.3 hair protection or covering \n1.5.4 protective clothing and safety footwear \n1.6      Safe handling, storage and disposal of chemicals \n1.7      Safe handling techniques especially as they relate to \nlifting and handling dangerous and contaminated items \n2.   Legislative and \nworkplace \nguidelines \nMay include: \n2.1      Infection control guidelines for the transmission of \ninfectious diseases in the health care setting \n2.2 \nState legislative requirements \n2.3 \nOrganization infection control policies and procedures \n2.4 \nOccupational Health and Safety policies and procedures \n2.5 \nMaterial Safety Data Sheets for the chemicals used \n3.  Waste  \nMay include but is not limited to: \n3.1 \nClinical waste: \n3.1.1 discarded sharps \n3.1.2 human tissues \n3.1.3 laboratory waste \n3.1.4 any other waste as specified by the workplace \n3.2 \nRelated waste: \n3.2.1 radiographic waste \n3.2.2 chemical waste \n3.2.3 metal alloy waste \n3.3 \nGeneral waste \n4.  Disposal of waste \nrequirements  \nMay include: \n4.1 \nDisposal in accordance with: \n4.1.1 Environment Protection Policy (Waste \nManagement) \n4.1.2 Environment Protection Regulations (Waste \nManagement) \n4.2 \nOrganization policy\n\n--- PDF PAGE 38 ---\nTR Dental Hygiene  NC IV                      \n \n \n34\n5.  Work flow protocols \nMay include: \n5.1 \nSeparate hand washing facilities \n5.2 \nSink suitable for disposal of liquid waste \n5.3 \nOne direction flow of instruments from contaminated to \nclean to sterile \n5.4 \nDesignated work area that is physically separate to \nprevent possible contamination of processed items \n5.5 \nIdentification and reporting of disruptions to work flow \nprotocols in accordance with workplace procedures \n6.  Preparation of \ninstruments for \ncleaning \n            \n \nMay include: \n6.1 \nSorting according to type of instrument and \ncorresponding cleaning method \n6.2       Written procedures for handling specialized items \n6.3 \nDisassembly of instruments where possible for detergent \nto reach all surfaces \n6.4      Checking for instrument defects, damage and missing \nparts \n7.  Selection and use \nof appropriate \ncleaning agents \nMay include: \n7.1      Meeting requirements of Product Data Bulletins and \nMaterials Safety Data Sheets for the chemicals used \n8.  Cleaning methods \nMay include: \n8.1      Initial treatment of used instruments close to their point \nof use to decrease bio burden \n8.2      Thermal washer/disinfector in accordance with current \nstandards \n8.3 \nUltrasonic cleaner in accordance with current standards \n8.4 \nManual cleaning \n9.  Monitoring the \ncleaning process \nMay include: \n9.1      Visual inspection of all items for cleanliness and \nabsence of detergent or rinse additive residues \n9.2      Daily cleaning and maintenance of ultrasonic cleaner \nand washer/disinfector \n9.3 \nDaily performance testing of ultrasonic cleaner \n9.4 \nDaily checks of washer/disinfector function and \ndetergent dispenser \n10.  Critical site \ninstruments \nMay include: \n10.1    Instruments which must be cleaned and disinfected as \nneeded \n11 Routine cleaning \nand checking of \nsterilizers \nMay include  but is not limited to: \n11.1 Daily checks: \n11.1.1 floor of sterilizer is free of debris \n11.1.2 chamber drain and filter are clear \n11.1.3 recording devices, gauges and timers are functioning \ncorrectly \n11.1.4 water reservoir (portable benchtop sterilizers) emptied, \ncleaned and refilled with distilled water \n11.1.5 door seals are intact \n11.2 Cleaning: \n11.2.1 loading tray and external surfaces cleaned daily\n\n--- PDF PAGE 39 ---\nTR Dental Hygiene  NC IV                      \n \n \n35"
