        "source_title": "FOLLOW OCCUPATIONAL HEALTH AND SAFETY POLICIES IN DENTAL LABORATORY FACILITIES",
        "source_text": "--- PDF PAGE 40 ---\nTR Dental Hygiene  NC IV                      \n \n \n36\n \nUNIT OF COMPETENCY \nFOLLOW OCCUPATIONAL HEALTH AND SAFETY \nPOLICIES IN DENTAL LABORATORY FACILITIES \nUNIT CODE \nHCS322204 \nUNIT DESCRIPTOR \nThis unit covers the knowledge, skills and attitudes required in \napplying relevant OHS legislation and codes of practice, \nincluding duties and responsibilities for all parties under \ngeneral duty of care. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1 \nFollow workplace \nprocedures for \nhazard identification \nand risk control  \n \n1.3 \nHazards in the work area are recognized and reported \nto supervisor in accordance with workplace procedures. \n1.4 \nWorkplace procedures and work instructions for \ncontrolling risks, including infection control, are \nfollowed accurately. \n1.5 \nWorkplace procedures for dealing with accidents, \nfires and emergencies are followed where necessary. \n2 \nContribute to the \nmanagement of \nOHS \n2.7 \nOHS issues are raised with designated personnel and \nco-workers as appropriate. \n2.8 \nContributions are made as appropriate to workplace \nOHS discussions. \n3 \nUtilize and \nimplement \nstrategies as \ndirected to prevent \ninfection in the \nworkplace \n3.1 \nThe environment is kept clean and tidy. \n3.2 \nPersonal hygiene practices are followed. \n3.3 \nAny items that may be contaminated are disposed of \nsafely. \n4 \nUtilize strategies to \nprevent stress \noverload \n4.1 \nNominated rest time and breaks are taken. \n4.2 \nSources of stress are identified and issues raised with \nsupervisor. \n4.3 \nWork roles are clarified and followed. \n5 \nWork in a safe \nmanner \n5.1 \nDefined procedures are followed to ensure personal \nsafety. \n5.2 \nAll work is carried out in a manner which ensures \nsafety of self and others \n5.3 \nOrganizational security measures are followed. \n5.4 \nSafe manual handling procedures are followed.\n\n--- PDF PAGE 41 ---\nTR Dental Hygiene  NC IV                      \n \n \n37\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n2. \nWorkplace \nprocedures for \ncontrolling risks \n \nMay include: \n1.5 \nManual handling techniques \n1.6 \nSafe handling, storage and disposal of inflammable or \npotentially dangerous substances \n1.5 \nStrategies for reducing the amount of manual handling \nrequired \n2. \nStress \nMay include: \n2.1 \nHealth problems \n2.2 \nChanges in behavior \n2.3 \nFrequent absences \n2.4 \nNegative attitudes \n2.5 \nUnawareness of own stress levels \n3. \nRest time and \nbreaks \nMay include: \n3.4  \nMorning and afternoon tea, lunch, dinner breaks \n4. \nWorkplace \nprocedures \nMay include: \n4.3 \nGrievance procedures \n4.4 \nTeam meetings \n4.5 \nIncident reports \n4.6 \nDebriefing procedures following crisis \n4.7 \nSmoke free environment \n5. \nItems that may be \ncontaminated \nMay include: \n5.6 \nWork surfaces \n5.7 \nClothing \n6. \nWorking in a \nmanner that \nensures personal \nsafety \nMay include: \n6.1 \nCarrying communication equipment \n6.2 \nUsing personal protection equipment \n6.3 \nSafe work practices for handling sharps and other hazards \nin dental laboratory practice \n6.4 \nCarrying alarms \n6.5 \nMaintaining infection control in dental laboratory practice \n7. \nOrganizational \nsecurity measures \nMay include: \n7.1 \nLocking doors \n7.2 \nAlarm system \n7.3 \nContracted security personnel\n\n--- PDF PAGE 42 ---\nTR Dental Hygiene  NC IV                      \n \n \n38\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.4 \nWorked safely and followed OHS policies and \nprocedures in dental laboratory practice \n1.5 \nComplied with DOH infection control guidelines \n1.6 \nContributed to the management of OHS \n1.7 \nUtilized and implemented strategies as directed to \nprevent infection in the workplace \n1.8 \nUtilized strategies to prevent stress overload \n1.9 \nWorked in a safe manner \n2. Underpinning \nknowledge  \n2.5 \nCompliance with OHS policy and procedures and \ninfection control guidelines and procedures  \n2.6 \nKnowledge of potential hazards in the workplace \n2.7 \nKnowledge of laboratory waste disposal methods \n2.8 \nKnowledge of personal hygiene and personal \nprotection including immunization \n2.9 \nKnowledge of legislative requirements and best \npractice approaches to OHS \n2.10 Emergency procedures \n3. Underpinning skills \n3.6 \nManual handling techniques \n3.7 \nSafe handling techniques \n3.8 \nCorrect use of equipment, instruments and materials in \naccordance with manufacturer specifications \n3.9 \nTechnology used to work safely and competently \n3.10 Safe work practices to prevent or minimize risk \n3.11 Reading and writing skills \n3.12 Oral communication skills \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nRelevant dental laboratory practice/organizational \npolicies and procedures manuals such as: \n4.1.1 Incident reporting procedures \n4.1.2 OHS policy and procedures \n4.1.3 Infection control guidelines (DOH) \n4.1.4 Waste management policies \n4.1.5 Relevant state legislation \n4.1.6 Manufacturer’s instructions for the use of \nrelevant equipment, instruments and materials \n4.1.7 Material Safety Data Sheets (MSDs) \n \n5 \nMethod of assessment \nCompetency may be assessed through: \n5.1 \nObservation with questioning \n5.2 \nOral questioning/Interview \n5.3 \nPortfolio \n5.4 \nThird Party Report \n6 \nContext of assessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated work setting.\n",
