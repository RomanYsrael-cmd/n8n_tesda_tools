        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Positioned patient for dental diagnosis\n1.2 Performed tooth scaling and polishing\n1.3 Provided oral-health advice to patient\n1.4 Demonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n\n2. Underpinning\nknowledge\n\nKnowledge in:\n2.1 Oral anatomy\n2.2 Oral physiology\n2.3 Anatomy and Physiology\n2.4 Infection-control procedures\n2.5 Dental materials\n2.6 Periodontology\n2.7 Restorative dentistry\n2.8 Pathology\n2.9 Dental anesthesia\n2.10 Pharmacology\n2.11 Dental jurisprudence and ethics\n2.12 Basic computer\n2.13 Nutrition\n\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Maintaining personal hygiene\n3.4 Language, literacy and numeracy skills appropriate to\nthe role and workplace requirements\n3.5 Operational skills to consistently use time effectively\nand provide quality customer service in the dental\nenvironment\n3.7 Computer skills\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 A real or simulated dental clinic environment\n4.2 Relevant documentation such as:\n4.2.1\nIndustry codes of practice\n4.2.2\nNational and local legislation as appropriate\n4.3 A qualified workplace assessor\n5. Method of assessment\n\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Written test\n5.3 Interview\n5.4 Portfolio\n\n6. Context of assessment\n\n6.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 83 ---\nTR Dental Hygiene NC IV\n\n79\n\nUNIT OF COMPETENCY\nMAINTAIN DENTAL RECORDS AND RESOURCES\nUNIT CODE"
        },
        "source_text": "HCS322347\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes require\nto perform dental cleaning of teeth through scaling,\npolishing, and fluoride application.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform dental charting\non patient\n\n1.1 Dental charting is performed on patient to determine the\ntype of treatment to be done.\n1.2 Precautions are undertaken based on patient’s oral and\nmedical condition.\n1.3 Patient and operator are positioned in accordance with\nthe dental cleaning procedures.\n2. Scale and polish teeth\n\n2.1 Dental cleaning instrument and devices are identified\nand prepared in accordance with patient requirements\n2.2 Dental cleaning instrument is set, operated and adjusted\nin accordance with manufacturer’s specifications and\npatient’s convenience/comfort.\n2.3 Deposits are removed from the surface of the tooth in\naccordance with dental established procedures\n2.4 Devices or finer hand tools are used to remove smaller\ndeposits and smoothen the tooth surface\n2.5 Moderate amount of pressure is applied in removing\nsupra and subgingival calcular deposits.\n2.6 Scaled teeth are polished.\n2.7 Appropriate\ndental\nmaterial\nmay\nbe\napplied\naccordingly.\n2.8 Unexpected events are responded to in accordance\nwith existing medical practices\n3. Motivate the patient\n3.1 Findings are discussed with patient in layman’s terms\n3.2 Where necessary, follow-up appointment is scheduled in\nthe next 2 weeks to check on the improvement\n3.3 Routine examination of the teeth is recommended for at\nleast every six months or depending on the needs of the\npatient\n3.4 Patient is advised on proper home-care and dental\nrecall based on results of oral examination and dental\ndiagnosis\n3.5 Where necessary, patient is referred to dentist or other\nmedical professionals for appropriate/further treatment\n\n--- PDF PAGE 80 ---\nTR Dental Hygiene NC IV\n\n76\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Precautions\n1.1 Patients with heart-valve disease must take antibiotics\nto prevent bacteria to spread into the blood stream that\ncould cause endocarditis\n1.2 Patients with history or possibility of hypertension\nshould have their blood pressure monitored.\n1.3 Patients with relevant allergies\n1.4 Patients with medication such as blood thinners\n1.5 Patients with HIV or other contagious diseases\n1.6 Patients with mental disorders\n1.7 Patients\nwith\nartificial\nprosthetic\ndevices\nand\ntransplants\n1.8 Patients who have a history of taking biphosponates\n2. Dental cleaning\ninstrument and devices\n\nMay include but are not limited to:\n2.1 Ultrasonic machine\n2.2 Scalers and curettes\n2.3 Micromotor\n2.4 Prophylactic Brush\n2.5 Rubber Cup\n2.6 Mouth Mirror\n2.7 Cotton Pliers\n2.8 Explorer\n2.9 Periodontal probe\n3. Deposits\nMay include but are not limited to:\n3.1 Plaque\n3.2 Calculus\n3.3 Stains\n\n4. Dental material\n\nIt includes:\n4.1 Prophylaxis paste\n4.2 Sealant\n4.3 Fluoride gel\n4.4 Fluoride tray\n4.5 Topical anesthesia\n4.6 Composite material\n\n5. Unexpected events\nMay include:\n5.1 Fainting/Syncope\n5.2 Hemorrhage or bleeding\n5.3 Hypertension/stroke\n5.4 Dislocation of TMJ (Temporo-Mandibular Joint)\n5.5 Accidental blocking of air passage\n\n--- PDF PAGE 81 ---\nTR Dental Hygiene NC IV\n\n77\n\n6. Response\n6.1 Stop procedures\n6.2 First aid e.g. mouth to mouth resuscitation\n6.3 Removal of air way blockage\n6.4 Apply pressure on the affected area\n6.5 Referral or transport of the patient to the appropriate\nmedical specialist\n\n7. Proper home-care and\ndental recall\n7.1 Proper instructions/advices on food intake, drug\nprescription and lifestyles\n7.2 Proper tooth brushing techniques\n7.3 Proper using of dental floss and mouth wash\n7.4 Proper care of dentures/teeth, gums and tongue\n\n--- PDF PAGE 82 ---\nTR Dental Hygiene NC IV\n\n78\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Positioned patient for dental diagnosis\n1.2 Performed tooth scaling and polishing\n1.3 Provided oral-health advice to patient\n1.4 Demonstrated consistent compliance with infection\ncontrol guidelines and legislative requirements\n\n2. Underpinning\nknowledge\n\nKnowledge in:\n2.1 Oral anatomy\n2.2 Oral physiology\n2.3 Anatomy and Physiology\n2.4 Infection-control procedures\n2.5 Dental materials\n2.6 Periodontology\n2.7 Restorative dentistry\n2.8 Pathology\n2.9 Dental anesthesia\n2.10 Pharmacology\n2.11 Dental jurisprudence and ethics\n2.12 Basic computer\n2.13 Nutrition\n\n3. Underpinning skills\n3.1 Manual dexterity\n3.2 Maintaining a healthy and safe working environment\n3.3 Maintaining personal hygiene\n3.4 Language, literacy and numeracy skills appropriate to\nthe role and workplace requirements\n3.5 Operational skills to consistently use time effectively\nand provide quality customer service in the dental\nenvironment\n3.7 Computer skills\n4. Resource implications\n\nThe following resources MUST be provided:\n4.1 A real or simulated dental clinic environment\n4.2 Relevant documentation such as:\n4.2.1\nIndustry codes of practice\n4.2.2\nNational and local legislation as appropriate\n4.3 A qualified workplace assessor\n5. Method of assessment\n\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Written test\n5.3 Interview\n5.4 Portfolio\n\n6. Context of assessment\n\n6.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 83 ---\nTR Dental Hygiene NC IV\n\n79\n\nUNIT OF COMPETENCY\nMAINTAIN DENTAL RECORDS AND RESOURCES\nUNIT CODE"
