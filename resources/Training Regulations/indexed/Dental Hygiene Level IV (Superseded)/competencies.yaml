        "source_title": "PERFORM ORAL EXAMINATION",
        "source_text": "--- PDF PAGE 56 ---\nTR Dental Hygiene  NC IV                      \n \n \n52\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY: \nPERFORM ORAL EXAMINATION \nUNIT CODE: \nHCS322343 \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitudes required \nto take medical and dental history, examine teeth, gums and \ntissue of the mouth and educate patient on oral hygiene. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Take medical/dental \nhistory of the patient \n \n1.1 Information are collected from the patient in accordance \nwith dental standard operating procedures. \n1.2 Special conditions of the patient are determined and \ndocumented following established procedures. \n1.3 Special precautionary measures are taken prior to \ndental examination based on patient’s medical condition.  \n1.4 Treatment appointments are allocated in accordance to \npriority \n2. Examine  teeth, \ngums and tissues of \nthe mouth \n \n2.1 Equipment/instruments to be used during examinations \nare prepared and sterilized in accordance with OH&S \nstandard operating procedures. \n2.2 The oral cavity is checked/examined in accordance with \nOH&S standard operating procedures. \n2.3 Teeth conditions are determined following established \nprocedures. \n2.4 Patient’s observations are recorded using tooth chart and \nother documentation methods \n3. Educate patient on \noral hygiene \n \n3.1 Findings, concerns and issues are discussed with the \npatient \n3.2 Professional advice/recommendations on proper oral \nhygiene is given to the patient in accordance with the \ndentist instructions \n3.3 A complete oral hygiene program is scheduled and \nmaintained in accordance with the dentist instructions.\n\n--- PDF PAGE 57 ---\nTR Dental Hygiene  NC IV                      \n \n \n53\nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n1.  Information \nMay include but are not limited to: \n1.1 Personal information \n1.1.1 \nName \n1.1.2 \nAddress \n1.1.3 \nAge \n1.1.4 \nStatus \n1.1.5 \nOccupation \n1.2 List of medications currently taking \n1.3 List of vitamins and natural healing remedies currently \ntaking \n1.4 Smoking and alcohol consumption \n1.5 Allergy list \n1.6 Previous experience or adverse reaction with anesthesia, \nanesthesias, anti-biotics and analgesics \n1.7 Family member reactions to anesthesia \n1.8 Any medical conditions currently being treated for \n1.9 Previous surgeries or hospitalizations and other severe \ndental and medical conditions \n2.  Equipment / \ninstruments  \nMay  include but are not limited to: \n2.1 Mouth mirror \n2.2    Dental Explorer \n2.3    Cotton pliers \n2.4     Periodontal probe \n \n3.  Special \nprecautionary \nmeasures \n3.1 Patients with heart-valve disease must take antibiotics to \nprevent bacteria to spread into the blood stream that \ncould cause endocarditis \n3.2 Patients with history or possibility of hypertension should \nhave their blood pressure monitored. \n3.3 Patients with relevant allergies \n3.4 Patients with medication such as blood thinners \n3.5 Patients with HIV or other contagious diseases \n3.6 Patients with mental disorders \n3.7 Patients with artificial prosthetic devices and transplants \n3.8 Patients who have a history of taking biphosponates \n4.  Oral cavity \nMay  include but are not limited to: \n4.1 Hard and soft palates \n4.2 Tongue \n4.3 Cheeks \n4.4 Lips  \n4.5 Floor of the mouth \n4.6 Measurement of salivary flow \n4.7 Examination of neck area specifically the lymph nodes\n\n--- PDF PAGE 58 ---\nTR Dental Hygiene  NC IV                      \n \n \n54\n \n5. Condition of teeth, \ngums and tissue of the \nmouth \n \nMay include but are not limited to: \n5.1 Condition of teeth: \n5.1.1 Erupted or un-erupted \n5.1.2 Carious or non-carious \n5.1.3 Damages to abrasion, erosion and attrition \n5.1.4 Previous treatments \n5.1.4.1 Restorations \n5.1.4.2 Crowns \n5.1.4.3 Others \n \n5.2    Condition of the gums \n5.2.1 Color and texture \n5.2.2 Bleeding \n5.2.3 Gingival recession \n5.2.4 Periodontal pockets \n5.2.5 Furcation involvement \n5.2.6 Tooth mobility \n \n6. Advice / \n      recommendations \nMay include but are not limited to: \n6.1    Proper brushing of teeth \n6.2    Proper flossing of teeth \n6.3    Use of fluoride toothpaste \n6.4    Regular scaling and polishing\n\n--- PDF PAGE 59 ---\nTR Dental Hygiene  NC IV                      \n \n \n55\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nTook medical and dental history of client/patient \n1.2 \nInspected teeth, gums and tissues of the mouth \n1.3 \nEducated patient on oral hygiene \n1.4 \nDemonstrated consistent compliance with infection \ncontrol guidelines and legislative requirements \n2. Underpinning \nknowledge  \n \nKnowledge in \n2.1 \nAnatomy and physiology \n2.2 \nHead and neck anatomy \n2.3 \nHistology and embryology \n2.4 \nMicrobiology \n2.5 \nOral anatomy  \n2.6 \nOral physiology \n2.7 \nDental materials \n2.8 \nPeriodontology \n2.9 \nRoentgenology \n2.10 Restorative dentistry \n2.11 Pedodontics \n2.12 Pharmacology \n2.13 Pathology \n2.14 Dental jurisprudence and ethics \n2.15 Nutrition \n2.16 Basic computer \n3.  Underpinning skills \n3.1 \nManual dexterity \n3.2 \nMaintaining a healthy and safe working environment \n3.3 \nMaintaining personal hygiene \n3.4 \nLanguage, literacy and numeracy skills appropriate to \nthe role and workplace requirements \n3.5 \nOperational skills to consistently use time effectively \nand provide quality customer service in the dental \nenvironment \n3.6 \nComputer skills \n4.  Resource implications \nThe following resources MUST be provided: \n4.1 \nA real or simulated dental clinic environment \n4.2 \nRelevant documentation such as: \n4.2.1 \nIndustry codes of practice \n4.2.2 \nLocal legislation as appropriate \n4.3 \nA qualified workplace assessor \n5.  Method of assessment \nCompetency may be assessed through: \n5.1    Demonstration with oral questioning \n5.2 \nInterview \n5.3 \nPortfolio \n5.4 \nWritten Examination \n6.  Context of assessment \n6.1 Assessment may be conducted in the workplace or in \na simulated environment\n",
