        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of environmental legislations and local\nordinances according to the different environmental\nissues/concerns.\n1.2 Described industrial standard environmental practices according\nto the different environmental issues/concerns.\n1.3 Resolved problems/ constraints encountered based on\nmanagement standard procedures\n1.4 Implemented and monitored environmental practices on a periodic\nbasis as per company guidelines\n1.5 Recommended solutions for the improvement of the program\n1.6 Monitored and reported to proper authorities any environmental\nincidents\n2. Underpinning\nknowledge\n2.1 Features of an environmental management strategy\n2.2 Environmental issues/concerns\n2.3 International Environmental Protocols (Montreal, Kyoto)\n2.4 Waste minimization hierarchy\n2.5 Environmental planning/management\n2.6 Community needs and expectations\n2.7 Resource availability\n2.8 Environment-friendly/environmental advocates\n2.9 5S of Good Housekeeping\n2.10 3Rs – Reduce, Reuse & Recycle\n 2.11 Sanitary Code\n 2.12 Environmental Code of practice\n3. Underpinning\n skills\n3.1 Communicating effectively\n3.2 Performing research and analysis\n3.3 Reading / interpreting data and information\n3.4 Problem solving\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace/Assessment location\n4.2 Legislation, policies, procedures, protocols and local ordinances\nrelating to environmental protection\n4.3 Case studies/scenarios relating to environmental protection\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written/ Oral Examination\n5.2 Interview/Third Party Reports\n5.3 Portfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n 5.4 Simulations and role-plays\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 30 ---\nTR Dental Hygiene NC IV\n\n26\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\nMAINTAIN\nAN\nEFFECTIVE\nRELATIONSHIP\nWITH\nCLIENTS AND CUSTOMERS\nUNIT CODE"
        },
        "source_text": "CODE 500311120\nUNIT DESCRIPTOR This unit covers the knowledge, skills and attitudes required in\nadhering to environmental protection principles, strategies and\nguidelines\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n 1. Study guidelines for\nenvironmental\nconcerns.\n 1.1 Environmental legislations/conventions and local\nordinances are identified according to the different\nenvironmental aspects/impact.\n1.2 Industrial standard/environmental practices are\ndescribed according to the different environmental concerns.\n 2. Implement specific\nenvironmental\nprograms.\n2.1 Programs/Activities are identified according to organizations\npolicies and guidelines.\n2.2 Individual roles/responsibilities are determined and performed\nbased on the activities identified.\n2.4 Problems/ constraints encountered are resolved in\naccordance with organizations’ policies and guidelines\n2.5 Stakeholders are consulted based on company guidelines.\n\n 3. Monitor activities on\nenvironmental\nprotection /programs\n3.1 Activities are periodically monitored and evaluated\naccording to the objectives of the environmental program\n3.2 Feedback from stakeholders are gathered and considered in\nproposing enhancements to the program based on\nconsultations\n3.3 Data gathered are analyzed based on evaluation\nrequirements\n3.4 Recommendations are submitted based on the findings.\n3.5 Management support systems are\n set/established to sustain and enhance the program\n3.6 Environmental incidents are monitored and reported to\nconcerned/proper authorities.\n\n--- PDF PAGE 28 ---\nTR Dental Hygiene NC IV\n\n24\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n\n1. Legislations/Conventions\nMay include but are not limited to:\n1.1 Clean Air act\n1.2 Clean Water Act\n1.3 Solid Waste Management\n1.4 Montreal Protocol\n1.5 Kyoto Protocol\n\n2. Environmental\naspects/impacts\n\n2.1 Air pollution\n2.2 Water pollution\n2.3 Noise pollution\n2.4 Solid waste\n2.5 Flood control\n2.6 Deforestation/Denudation\n2.7 Radiation/Nuclear /Radio Frequency/ Microwaves\n2.8 Situation\n2.9 Soil erosion (e.g. Quarrying, Mining, etc.)\n2.10 Coral reef/marine life protection\n\n3. Industrial standards/\nEnvironmental practices\n3.1 ECC standards\n3.2 ISO standards\n3.3 company environmental management systems (EMS)\n4. Periodic\n\n4.1 hourly\n4.2 daily\n4.3 weekly\n4.4 monthly\n4.5 quarterly\n4.6 yearly\n\n5. Programs/Activities\n5.1 Waste disposal (on-site and off-site)\n5.2 Repair and maintenance of equipment\n5.3 Treatment and disposal operations\n5.4 Clean-up activities\n5.5 Laboratory and analytical test\n5.6 Monitoring and evaluation\n 5.7 Environmental advocacy programs\n\n--- PDF PAGE 29 ---\nTR Dental Hygiene NC IV\n\n25\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of environmental legislations and local\nordinances according to the different environmental\nissues/concerns.\n1.2 Described industrial standard environmental practices according\nto the different environmental issues/concerns.\n1.3 Resolved problems/ constraints encountered based on\nmanagement standard procedures\n1.4 Implemented and monitored environmental practices on a periodic\nbasis as per company guidelines\n1.5 Recommended solutions for the improvement of the program\n1.6 Monitored and reported to proper authorities any environmental\nincidents\n2. Underpinning\nknowledge\n2.1 Features of an environmental management strategy\n2.2 Environmental issues/concerns\n2.3 International Environmental Protocols (Montreal, Kyoto)\n2.4 Waste minimization hierarchy\n2.5 Environmental planning/management\n2.6 Community needs and expectations\n2.7 Resource availability\n2.8 Environment-friendly/environmental advocates\n2.9 5S of Good Housekeeping\n2.10 3Rs – Reduce, Reuse & Recycle\n 2.11 Sanitary Code\n 2.12 Environmental Code of practice\n3. Underpinning\n skills\n3.1 Communicating effectively\n3.2 Performing research and analysis\n3.3 Reading / interpreting data and information\n3.4 Problem solving\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace/Assessment location\n4.2 Legislation, policies, procedures, protocols and local ordinances\nrelating to environmental protection\n4.3 Case studies/scenarios relating to environmental protection\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written/ Oral Examination\n5.2 Interview/Third Party Reports\n5.3 Portfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n 5.4 Simulations and role-plays\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 30 ---\nTR Dental Hygiene NC IV\n\n26\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\nMAINTAIN\nAN\nEFFECTIVE\nRELATIONSHIP\nWITH\nCLIENTS AND CUSTOMERS\nUNIT CODE"
