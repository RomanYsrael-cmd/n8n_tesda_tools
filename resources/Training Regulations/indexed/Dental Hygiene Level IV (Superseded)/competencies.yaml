        "source_text": "--- PDF PAGE 67 ---\nTR Dental Hygiene  NC IV                      \n \n \n63\n \n \nUNIT OF COMPETENCY: \nOPERATE DENTAL RADIOGRAPHIC EQUIPMENT \nUNIT CODE: \nHCS322345 \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitudes required \nto operate dental radiographic equipment and position the \npatient and radiographic film in order to produce an \ninterpretable diagnostic image \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Position patient to \nobtain radiographic \nimage \n \n1.1 Radiation safety measures for patient, operator and \nothers are implemented and maintained throughout the \nprocedures. \n1.2 Patient is positioned in accordance with radiographic \nprocedures  \n2. Position dental \nradiographic receptor \n(film) \n \n2.1 Appropriate receptor (film) is selected and positioned in \naccordance with the radiographic requirements \n2.2 Appropriate technical variables on the dental \nradiographic \nunit \nare \nselected \naccording \nto \nmanufacturer’s specifications, procedures and patient \nrequirements \n2.3 Appropriate radiographic technique is selected in \naccordance with the tooth under investigation and \nanatomy of the oral cavity. \n2.4 Receptor (Film) locating devices are selected and used \nin accordance with correct positioning of the receptor \n(film). \n2.5 Accessories are selected according to manufacturer’s \nspecifications. \n3. Operate radiographic \nimaging equipment \nsafely to produce an \ninterpretable image \n \n3.1 Equipment \nis \noperated \nin \naccordance \nwith \nmanufacturer’s \nspecifications \nand \nlegislative \nrequirements for the safe use of radiation in dentistry \n3.2 Patient is advised not to move throughout the \nprocedures \n3.3 The exposed dental radiographic receptor (film) \npackage is carefully removed from the mouth \n3.4 The exposed radiographic receptor (film) package is \ncorrectly labeled prior to processing\n\n--- PDF PAGE 68 ---\nTR Dental Hygiene  NC IV                      \n \n \n64\n \n4. Process and provide \nquality assurance for \nthe exposed dental \nradiographic film \n4.1 Radiographic receptor (film) are correctly processed in \naccordance with the procedure \n4.2 Processed receptor (film) are assessed for visual \nqualities based on established criteria \n4.3 Processing errors and errors in technique are \nidentified and corrected in accordance with established \nprocedures \n4.4 Radiographic images are mounted and stored in \naccordance with manufacturer’s specifications \n5. Monitor equipment \n5.1 Basic machine operation is monitored in accordance \nwith machine operating manuals \n5.2 Machine is referred to qualified personnel for regular \ncheck-up \nand \nmaintenance \nfollowing \nenterprise \nprocedures \n5.3 Breakdowns are reported to qualified personnel in \naccordance with organization and legislative guidelines\n\n--- PDF PAGE 69 ---\nTR Dental Hygiene  NC IV                      \n \n \n65\nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGES \n1. Radiation safety \nmeasures for patient, \noperator and others \n \n1.1 Radiation safety measures for the client may include: \n1.1.1 \nUse of lead aprons \n1.1.2 \nAppropriate technique \n1.1.3 \nReceptor (film) selection \n1.1.4 \nTechnical features of the radiographic unit as \ndetermined by manufacturer specifications \nincluding: \n1.1.4.1 Kilovoltage \n1.1.4.2 Filtration \n1.1.4.3 X-ray beam collimation \n1.2 Radiation safety measures for the operator and others \nincludes but is not limited to: \n1.2.1 Maximum permissible dose (MDP) of radiation \n1.2.2 Determination of pregnancy \n1.2.3 Distance from primary beam \n1.2.4 Use of lead lined barriers \n1.2.5 Legislative requirements \n2. Appropriate technical \nvariables \n \nMay  include: \n2.1 Technical variables, milliamperage, kilovoltage and \ntube length are pre-determined by manufacturer \nspecifications for radiographic unit or selected by the \ndentist or dental specialist prior to the procedure: \n- \nselection \nof \ntechnical \nvariables \nof \ndental \nradiographic units by the dental assistant in \naccordance with manufacturers specifications and \npatient requirements may include but is not limited \nto exposure times. \n \n3. Appropriate \nradiographic technique  \n \nAppropriate radiographic technique may include: \n3.1 The bisected angle technique \n3.2 The paralleling technique \n3.3 Extra oral techniques: \n- \nhorizontal and vertical angulation \n- \nreceptor (film) selection and placement \n- \ncorrect assembly of film locating device \n- \npositioning of client \n- \nuse of intensifying screens\n\n--- PDF PAGE 70 ---\nTR Dental Hygiene  NC IV                      \n \n \n66\n \n4.  Patient requirements \nMay  include but are not limited to: \n4.1 Age \n4.2 Size \n4.3 Weight \n4.4 Physical capabilities \n4.5 Pregnancy \n4.6 Ability to comply with instructions \n4.7 Radiographic view/position \n4.7.1 \nIntraoral radiographic views \n4.7.1.1 Occlusal \n4.7.1.2 Periapical \n4.7.1.3 Bitewing view \n4.7.1.4 Full mouth series \n4.7.2 \nExtraoral radiographic views \n4.7.2.1 Panoramic films \n4.7.2.2 Cephalometric \n \n5. Accessories \n \nMay include but are not limited to: \n5.1 Film locating devices \n5.2 Film holders \n5.3 Immobilization equipment \n5.4 Intensifying screens \n5.5 Modifications for the use of film locating devices \n \n6. Processing errors \nMay include but are not limited to: \n6.1   Film that is marked \n6.2 Film with inadequate or low contrast \n6.3 Film that is too dark \n6.4 Film that is too light \n \n7.  Errors in techniques \nMay include but are not limited to: \n7.1    Incorrect horizontal and vertical angulation \n7.2    Incorrect film placement \n7.3 Incorrect assembly and use of film locating device \n7.4 Incorrect tubehead placement \n7.5 Failure to remove oral appliances and jewellery \n7.6 Over/under exposure \n7.7 Movement of patient or film \n \n8. Organization and \nlegislative guidelines \n \n8.1 Radiation safety act 1999 \n8.2 Radiation safety and protection plan \n8.3 X-ray machine operating manuals \n8.4 DOH \nGuidelines \nfor \nOperation \nof \nRadiographic \nEquipment\n\n--- PDF PAGE 71 ---\nTR Dental Hygiene  NC IV                      \n \n \n67\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Positioned patient  and dental radiographic film to obtain \nradiographic image \n1.2 Operated radiographic imaging safely \n1.3 Processed and provided quality assured exposed dental \nradiographic film \n1.4 Demonstrated consistent compliance with infection \ncontrol guidelines and legislative requirements  \n1.5 Applied code of practice for safe use of radiation in \ndentistry \n1.6 Documented/recorded all radiographs taken in the \nlogbook in accordance with the licensing requirements of \nRadiation Health \n2. Underpinning \nknowledge and \nattitudes \n \nKnowledge in \n2.1 Legislative and ethical responsibilities for the safe use of \nradiation in dentistry \n2.2 Relevant legislation and statutory requirements of \nconsent \n2.3 Fundamental knowledge of the radiographic appearance \nof anatomic landmarks, normal dentition and associated \nbony structures for intraoral radiographs \n2.4 Fundamental knowledge of the radiographic appearance \nof dental anomalies and common oral pathological \nconditions \n2.5 Range of dental radiographic imaging techniques and the \nreasons for selection of each technique \n2.6 Features \nand \ncharacteristics \nincluding \nrange \nof \nmovements of a range of dental radiographic equipment \n2.7 Reasons for processing and technique inaccuracies and \nmethods to minimize errors \n3.  Underpinning skills \n3.1 Operating radiographic unit  \n3.2 Observing safety and health precautions in dental \nradiography \n3.3 Minimizing technical inaccuracies in dental radiographic \nimages \n3.4 Using terms for technical inaccuracies in dental \nradiographic images \n3.5 Processing and maintaining quality and safety in using \nand processing exposed dental radiographic film \n3.6 Using literacy skills to read and follow directions, policies \nand procedures including: \n- occupational \nhealth \nand \nsafety \npolicies \nand \nprocedures \n- infection control policies and procedures \n- practice policies and procedures \n3.7 Using oral communication skills required to fulfill the job \nrole as specified by the dental practice\n\n--- PDF PAGE 72 ---\nTR Dental Hygiene  NC IV                      \n \n \n68\n4.  Resource implications \nThe following resources MUST be provided: \n4.1 A real or simulated dental clinic environment \n4.2 Access to dental radiographic imaging units, radiographic \nviewing equipment and resources normally used in the \nworkplace \n4.3 Relevant documentation such as: \n4.3.1 \nIndustry codes of practice \n4.3.2 \nNational and local legislation as appropriate \n4.4 A qualified workplace assessor \n \n5.  Method of assessment Competency may be assessed through: \n5.1  Demonstration with oral questioning \n5.2 Oral interview  \n5.3 Third party  report \n5.4 Portfolio (authenticated evidence of relevant work \nexperience and/or formal/informal learning) \n \n6.  Context of \nassessment \n6.1 Assessment may be conducted in the workplace or in a \nsimulated environment\n",
