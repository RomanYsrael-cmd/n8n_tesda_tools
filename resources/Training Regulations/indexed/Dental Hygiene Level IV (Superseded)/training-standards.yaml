  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for DENTAL HYGIENE NC IV.\n\nThis includes information on curriculum design, training delivery, trainee entry requirements,\ntools, materials and equipment, training facilities and trainers qualification and national assessment\nand certification arrangements.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL HYGIENE NC Level: NC IV\n\nNominal Training Hours: 3499 Hours (Includes 1056 Hours OJT*)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in the\nfield of DENTAL HYGIENE in accordance with industry standards. It covers core competencies such\nas: performing oral examination, promoting oral health and hygiene, operating a dental radiographic\nequipment, applying the principle of radiology, biology and protection in dental practice, performing\nscaling and polishing, maintaining dental records and resources, and providing effective\npatient’s/clients service.\nThis includes the common competencies: Maintain an effective relationship with customers\nand clients, maintain instruments and equipment in the work area, manage own performance, follow\noccupational health and safety policies in dental facilities, maintain infection control in dental practice,\napply basic first aid and operate a personal computer.\nIt also includes competencies such as: Utilize specialized communication skills, develop teams\nand individuals, apply problem solving techniques in the workplace, collect, analyse and organize\ninformation, plan and organize work and promote environmental protection.\nThis list does not include specific institutional requirements such as educational attainment,\nappropriate work experience, and others that may be required of the trainees by the school of training\ncenter delivering this TVET program.\nThe above requirements will satisfy the prescribed 2 years certificate in dental hygiene with at\nleast 6 months OJT in the IRR of Republic Act 9484 (PRC Board of Dentistry Resolution No. 12 s.\n2007).\nCompletion of the two-year course and the six- month on-the-job training is required for those\napplying for the PRC licensure exam.\nPursuant to the provision of the IRR of Republic Act 9484, the Dental Hygiene NC IV program\nshall be registered in UTPRAS to a recognized and legally constituted college, or school of dentistry.\n*Note: The OJT should be at least six months and may be integrated/embedded in the two-year\nprogram.\n\n--- PDF PAGE 94 ---\nTR Dental Hygiene NC IV\n\n91\n\nBASIC COMPETENCIES\n92 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY ASSESSMENT\nAPPROACH\n1. Utilize\nspecialized\ncommunication\nskills\n1.1 Apply communication strategies\nto meet specific needs of\ninternal and external client.\n1.2 Represent the organization in\ninternal and external forums\n1.3 Facilitate group discussion\n1.4 Conduct interview\n• Discussion\nmethod\n• Role Play\n• Brainstorm- ing\n• Lecture\n\n• Written test\n• Performance\ntest\n• Interview\n2. Develop team\nand individual\nneeds\n2.1 Determine development needs.\n2.2 Foster individual and\norganization growth\n2.3 Monitor and evaluate workplace\nlearning\n2.4 Develop team commitment and\ncooperation\n2.5 Facilitate accomplishment of\norganizational goals\n•\nDiscussion\n•\nRole playing\n•\nObservation\n•\nWritten test\n•\nDirect\nobservation\n•\nRole playing\n3. Apply problem\nsolving\ntechniques in\nthe workplace\n3.1 Analyze the problem\n3.2 Identify fundamental cause of\nthe problem\n3.3 Determine possible solution\n3.4 Prepare communication or\ndocumentation report\n3.5 Present recommendation to\nappropriate personnel\n3.6 Implement solution\n•\nBrainstorming\n•\nDiscussion\n•\nCase studies\n•\nRole playing\n• Small\ngroup\nwork\n\n•\nWritten test\n•\nDirect\nobservation\n•\nInterview\n4. Collect,\nanalyze and\norganize\ninformation\n4.1 Study information requirements.\n4.2 Process data.\n4.3 Analyze, interpret and organize\ninformation gathered.\n4.4 Present findings/\nrecommendations\n• Group\ndiscussion\n•\nCase study\n•\nInteraction\n•\nWritten test\n•\nPractical/\nperformance\ntest\n5. Plan and\norganize work\n5.1 Set work objectives\n5.2 Plan and schedule work\nactivities\n5.3 Implement and monitor\nplans/activities\n5.4 Review and evaluate work\nplans and activities\n•\nBrainstorming\n•\nDiscussion\n•\nCase studies\n•\nRole playing\n•\nSmall group\nwork\n•\nWritten test\n•\nDirect\nobservation\n•\nInterview\n6. Promote\nenvironmental\nprotection\n6.1 Study guidelines for\nenvironmental concerns.\n6.2 Implement specific\nenvironmental programs\n6.3 Monitor activities on\nenvironmental\nprotection/programs\n• Group\ndiscussion\n•\nCase study\n•\nInteraction\n•\nWritten test\n•\nPractical/\nperformance\ntest\n\n--- PDF PAGE 95 ---\nTR Dental Hygiene NC IV\n\n92\nCOMMON COMPETENCIES\n56Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Maintain an\neffective\nrelationship with\npatients, clients,\nand customers\n1.1\nMaintain a clean and\nhygienic environment.\n1.2\nMeet\npatient/client/customer\nrequirements\n1.3\nBuild credibility with\ncustomers/clients\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n2. Maintain\ninstruments and\nequipment in\nwork area\n2.1 Prepare to clean\ndental instruments\nand work area\n2.2 Clean and dry dental\ninstruments\n\n• Group\nDiscussion\n• Interaction\n\n• Written test\n• Practical/Perfor\nmance Test\n• Interview\n3 Manage own\nperformance\n3.1\nPlan for completion of\nown workload.\n3.2\nMaintain quality\nperformance.\n3.3\nBuild credibility with\ncustomers/clients\n\n• Lecturette\n• Brainstorming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Prac