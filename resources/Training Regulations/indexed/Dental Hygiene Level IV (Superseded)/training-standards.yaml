    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for DENTAL HYGIENE NC IV.\n\nThis includes information on curriculum design, training delivery, trainee entry requirements,\ntools, materials and equipment, training facilities and trainers qualification and national assessment\nand certification arrangements.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DENTAL HYGIENE NC Level: NC IV\n\nNominal Training Hours: 3499 Hours (Includes 1056 Hours OJT*)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual in the\nfield of DENTAL HYGIENE in accordance with industry standards. It covers core competencies such\nas: performing oral examination, promoting oral health and hygiene, operating a dental radiographic\nequipment, applying the principle of radiology, biology and protection in dental practice, performing\nscaling and polishing, maintaining dental records and resources, and providing effective\npatient’s/clients service.\nThis includes the common competencies: Maintain an effective relationship with customers\nand clients, maintain instruments and equipment in the work area, manage own performance, follow\noccupational health and safety policies in dental facilities, maintain infection control in dental practice,\napply basic first aid and operate a personal computer.\nIt also includes competencies such as: Utilize specialized communication skills, develop teams\nand individuals, apply problem solving techniques in the workplace, collect, analyse and organize\ninformation, plan and organize work and promote environmental protection.\nThis list does not include specific institutional requirements such as educational attainment,\nappropriate work experience, and others that may be required of the trainees by the school of training\ncenter delivering this TVET program.\nThe above requirements will satisfy the prescribed 2 years certificate in dental hygiene with at\nleast 6 months OJT in the IRR of Republic Act 9484 (PRC Board of Dentistry Resolution No. 12 s.\n2007).\nCompletion of the two-year course and the six- month on-the-job training is required for those\napplying for the PRC licensure exam.\nPursuant to the provision of the IRR of Republic Act 9484, the Dental Hygiene NC IV program\nshall be registered in UTPRAS to a recognized and legally constituted college, or school of dentistry.\n*Note: The OJT should be at least six months and may be integrated/embedded in the two-year\nprogram.\n\n--- PDF PAGE 94 ---\nTR Dental Hygiene NC IV\n\n91\n\nBASIC COMPETENCIES\n92 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY ASSESSMENT\nAPPROACH\n1. Utilize\nspecialized\ncommunication\nskills\n1.1 Apply communication strategies\nto meet specific needs of\ninternal and external client.\n1.2 Represent the organization in\ninternal and external forums\n1.3 Facilitate group discussion\n1.4 Conduct interview\n• Discussion\nmethod\n• Role Play\n• Brainstorm- ing\n• Lecture\n\n• Written test\n• Performance\ntest\n• Interview\n2. Develop team\nand individual\nneeds\n2.1 Determine development needs.\n2.2 Foster individual and\norganization growth\n2.3 Monitor and evaluate workplace\nlearning\n2.4 Develop team commitment and\ncooperation\n2.5 Facilitate accomplishment of\norganizational goals\n•\nDiscussion\n•\nRole playing\n•\nObservation\n•\nWritten test\n•\nDirect\nobservation\n•\nRole playing\n3. Apply problem\nsolving\ntechniques in\nthe workplace\n3.1 Analyze the problem\n3.2 Identify fundamental cause of\nthe problem\n3.3 Determine possible solution\n3.4 Prepare communication or\ndocumentation report\n3.5 Present recommendation to\nappropriate personnel\n3.6 Implement solution\n•\nBrainstorming\n•\nDiscussion\n•\nCase studies\n•\nRole playing\n• Small\ngroup\nwork\n\n•\nWritten test\n•\nDirect\nobservation\n•\nInterview\n4. Collect,\nanalyze and\norganize\ninformation\n4.1 Study information requirements.\n4.2 Process data.\n4.3 Analyze, interpret and organize\ninformation gathered.\n4.4 Present findings/\nrecommendations\n• Group\ndiscussion\n•\nCase study\n•\nInteraction\n•\nWritten test\n•\nPractical/\nperformance\ntest\n5. Plan and\norganize work\n5.1 Set work objectives\n5.2 Plan and schedule work\nactivities\n5.3 Implement and monitor\nplans/activities\n5.4 Review and evaluate work\nplans and activities\n•\nBrainstorming\n•\nDiscussion\n•\nCase studies\n•\nRole playing\n•\nSmall group\nwork\n•\nWritten test\n•\nDirect\nobservation\n•\nInterview\n6. Promote\nenvironmental\nprotection\n6.1 Study guidelines for\nenvironmental concerns.\n6.2 Implement specific\nenvironmental programs\n6.3 Monitor activities on\nenvironmental\nprotection/programs\n• Group\ndiscussion\n•\nCase study\n•\nInteraction\n•\nWritten test\n•\nPractical/\nperformance\ntest\n\n--- PDF PAGE 95 ---\nTR Dental Hygiene NC IV\n\n92\nCOMMON COMPETENCIES\n56Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Maintain an\neffective\nrelationship with\npatients, clients,\nand customers\n1.1\nMaintain a clean and\nhygienic environment.\n1.2\nMeet\npatient/client/customer\nrequirements\n1.3\nBuild credibility with\ncustomers/clients\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n2. Maintain\ninstruments and\nequipment in\nwork area\n2.1 Prepare to clean\ndental instruments\nand work area\n2.2 Clean and dry dental\ninstruments\n\n• Group\nDiscussion\n• Interaction\n\n• Written test\n• Practical/Perfor\nmance Test\n• Interview\n3 Manage own\nperformance\n3.1\nPlan for completion of\nown workload.\n3.2\nMaintain quality\nperformance.\n3.3\nBuild credibility with\ncustomers/clients\n\n• Lecturette\n• Brainstorming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n4 Follow\noccupational\nhealth and\nsafety policies in\ndental facilities\n\n4.1 Apply workplace\nprocedures for hazard\nidentification and risk\ncontrol\n4.2 Utilize and implement\nstrategies as directed to\nprevent infection in the\nworkplace\n4.3 Work in a safe manner\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n5 Maintain\ninfection control\nin dental\npractice\n5.1 Monitor and maintain\nthe cleanliness of the\ndental laboratory\nrooms, dental clinics\nand community\n5.2 Clean and maintain\ndental instruments and\nequipment\n5.3 Maintain hygiene and\npersonal protection\n5.4 Dispose of dental\nlaboratory waste safely\n5.5 Disinfect and clean\nimpressions\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n--- PDF PAGE 96 ---\nTR Dental Hygiene NC IV\n\n93\n6 Apply basic first\naid\n6.1 Assess the situation\n6.2 Apply basic first aid\ntechniques\n6.3 Communicate details\nof the incident\n\n▪ Lecturette\n▪ Brainstorming\n▪ Observation and\noral questioning\n▪ Grid question\n▪ Practical\nexercise\n7. Operate a\npersonal\ncomputer\n7.1 Start and shut down the\ncomputer\n7.2 Arrange and customize\ndesktop display/window\nsetting\n7.3 Work with files and\nfolders (or directories)\n7.4 Work with user\napplication programs\n7.5 Print information\n\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n• Written Exam\n\nCORE COMPETENCIES\n3351 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1 Perform oral\nexamination\n1.1 Take medical/dental\nhistory of patient\n1.2 Examine teeth, gums\nand tissues of the\nmouth\n1.3 Educate patient on oral\nhygiene\n• Lecture\n• Demo\n• OJT\n\n• Written\nexamination\n• Interview\n• Demonstration\n\n2. Promote oral\nhealth and\nhygiene\n2.1 Develop oral health\npromotion strategies\nfor the target group\n2.2 Implement an oral\nhealth promotion\nprogram\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n\n--- PDF PAGE 97 ---\nTR Dental Hygiene NC IV\n\n94\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n3 Operate dental\nradiographic\nequipment\n3.1 Position of patient to\nobtain radiographic\nimage\n3.2 Position dental\nradiographic film\n3.3 Operate radiographic\nimaging equipment\nsafely to produce\nimage\n3.4 Process and provide\nquality assurance for\nthe exposed dental\nradiographic film\n3.5 Monitor and maintain\nequipment\n• Lecture\n• Demonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n4\nApply the\nprinciple of\nradiation\nbiology and\nprotection in\ndental practice\n4.1 Apply knowledge of\nionizing radiation to\nproduce a dental\nradiograph\n4.2 Apply knowledge of\nradiation biology to\nprotect patient,\noperator and others\nfrom ionizing radiation\n4.3 Determine image\ncharacteristics of a\ndental radiographic\nimage to minimize the\nnecessity for retake\n4.4 Minimize radiation by\nmaintaining quality in\nprocessing\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n5\nPerform scaling\nand polishing\n5.1 Perform dental\ndiagnosis on patient\n5.2 Scale and polish teeth\n5.3 Provide advice to\npatient\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 98 ---\nTR Dental Hygiene NC IV\n\n95\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n6\nMaintain dental\nrecords and\nresources\n6.1 Maintain patient’s\nrecords\n6.2 Maintain financial\nrecords of the clinic\n6.3 Purchase dental\nproducts\n6.4 Monitor quality control\n6.5 Comply with dental\nethics and\njurisprudence\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n7\nProvide\neffective\npatients/clients\nservice\n7.1 Greet patient/client\n7.2 Identify patient/client\nneeds\n7.3 Deliver dental services\nto patient/client\n7.4 Handle queries through\ntelephone, fax\nmachine, internet and\ne-mail\n7.5 Handle complaints,\nevaluation and\nrecommendations\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 99 ---\nTR Dental Hygiene NC IV\n\n96\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n▪ The training is based on curriculum developed from the competency\nstandards;\n▪ Learning is modular in its structure;\n▪ Training delivery is individualized and self-paced;\n▪ Training is based on work that must be performed;\n▪ Training materials are directly related to the competency standards and the\ncurriculum modules;\n▪ Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n▪ Training is based both on and off-the-job components;\n▪ Allows for recognition of prior learning (RPL) or current competencies;\n▪ Training allows for multiple entry and exit; and\n▪ Approved training programs are nationally accredited.\n\nIn accordance with RA 9484 and its implementing rules, the Dental Hygiene\nprogram shall have a two-year in-school component with an embedded a six-\nmonth OJT component. On-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students wishing to gain entry into these qualifications should\npossess the following requirements:\n\n➢ Must be physically and mentally fit;\n➢ Must have good moral character; and\n➢ Must be able to communicate both orally and in writing\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering this TVET\nprogram.\n\n--- PDF PAGE 100 ---\nTR Dental Hygiene NC IV\n\n97\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT:\nDENTAL HYGIENE NC IV\n\nRecommended list of instruments, equipment and dental materials for the\ntraining of 25 trainees for DENTAL HYGIENE NC IV are as follows:\n\nINSTRUMENTS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n4 sets /\nstudent\nMouth mirror\n10\npcs.\nDental Chair\n\nProphy paste\n4 sets /\nstudent\nCotton plier\n1 pc. Sterilizer (Boiling\ntype)\n1bottle\n(350ml\n)\nX-ray developer\n4 sets /\nstudent\nExplorer\n1 pc. Sterilizer (Dry\nheat)\n1bottle\n(350ml\n)\nX-ray fixer\n4 sets /\nstudent\nPeriodontal probe\n1 pc. Autoclave\n25\nkilos\nPlaster of paris\n4 sets /\nstudent\nScaler 1, 2, 3\n1pc.\nDental X-ray\nmachine\n25\nkilos\nCast stone\n4 sets /\nstudent\nInterproximal scaler\n1pc.\nPanoramic X-ray\n25\nkilos\nDie stone\n4 sets /\nstudent\nCoronal scaler\n1pc.\nCompressor\n250\nsachet\nAlginate\n25 pcs\nTackle box\n1 pc. Blood pressure\napparatus\n75 pcs\nModelling\nimpression\n25 pcs\nEnamel tray\n10\npcs.\nWorking tables\n25\nboxes\nRubber base\nimpression with\nputty\n\n1 pc. Amalgamator\n1\nbottle\n(100\nml)\nSealant\n25\nboxes\nProphy brush and\nrubber cup\n2 pcs Light cure machine\n1\nbottle\n(350\nml)\nFluoride gel\n25 pcs\nCotton holder\n2 pcs Ultrasonic scaler\n100pcs\nX-ray film\n(periapical)\n25 pcs\ncotton waste\nreceiver\n1 pc\nX-ray viewer\n100pcs\nOcclusal\n25 pcs\nSpatula\n1 pc\ntrimmer\n100pcs\nBitewing\n75\nsets(S,\nM, L)\nPerforated tray\n25\npcs\nMicromotor\n100pcs\nPanoramic film\n\n--- PDF PAGE 101 ---\nTR Dental Hygiene NC IV\n\n98\n75 sets\n(S,M, L)\nStocks tray\n5 pcs Suction machine\n25\nbottles\nHydrogen peroxide\n100 pcs Fluoride tray\n\n100\npcs.\nDisclosing tablets\n25 pcs\nMixing bowl\n\n25\nbottles\nAlcohol\n25 pcs\nDaphen dish\n\n25\nbottles\nMouth wash\n50 pcs\nAlligator clip\n\n25\nbottles\nBetadine solution\n25 pcs\nX-ray holder\n\n1 box\nCotton balls\n25 pcs\nGlass lab\n\n25 pcs\nGloves\n25 pcs\nCement spatula\n\n25 pcs\nmask\n25 pcs\nPlastic spatula\n\n25 pcs\nScrub suit\n25 pcs\nMortar and pestle\n\n25 pcs\nHead cap\n25\nboxes\nSqueeze cloth\n\n1 box\nTopical anesthesia\n75 pcs\nSterilizing bags\n\n1 pack\nCotton pellets\n25 pcs\nAmalgam carrier\n\n25 pcs.\n(2ml)\nLight cure\ncomposite\n25 pcs\nAmalgam plugger\n\n50 pcs\nAmalgam\npellet/powder/\ncapsule\n25 pcs\nAmalgam burnisher\n\n25\nbottles\n(350\nml)\nLiquid soap\n25 pcs\nRubber dam holder\n\n1 box\nDental floss\n25\nboxes\nRubber dam sheet\n\n1 box\nDental wedge\n25 pcs\nRubber dam\npuncher\n\n25\nboxes\nArticulating paper\n25 pcs\nRubber dam\nforceps\n\n25\nboxes\nCelluloid strip\nComple\nte set\nRubber dam clamp\n\n25\nboxes\nSandpaper strip\n25 pcs\nMatrix band and\nholder\n\n25\nboxes\nSaliva suction tip\n25 pcs\nMouth retractor\n\nNote: *Instruments should be provided by the students\n\n--- PDF PAGE 102 ---\nTR Dental Hygiene NC IV\n\n99\n3.5 TRAINING FACILITIES\nDENTAL HYGIENE NC IV\n\nThe Dental Hygiene Learning Facility must be of concrete structure. Based\non class size of 25 students / trainees the space requirements for the teaching /\nlearning and curriculum areas are as follows.\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN\nS.\nMETERS\nTOTAL AREA IN SQ.\nMETERS\nStudent/Trainee Performance\nSpace (S/TPS)\n6X 6\n36\n36\nLearning Resource Center (LRC)\n3 X 5\n15\n15\nCirculation Area\n\n21\n21\nSeparate Restrooms for Male and\nFemale Trainees/Students\n2 X 5\n10\n10\nTotal Workshop Area\n\n82 sq. m.\n\n3.6 TRAINER QUALIFICATION (TQ IV)\n\n➢ Must have completed Trainer’s Training Methodology Course (TTMC) or its\nequivalent\n➢ Must be a Licensed Dentist or Dental Hygienist\n➢ Must have completed at least 18 units in education\n➢ Must be able to communicate effectively both orally and in written form\n➢ Must be physically, emotionally, psychologically and mentally fit\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 103 ---\nTR Dental Hygiene NC IV\n\n100"
