n3.5 Monitor and maintain\nequipment\n• Lecture\n• Demonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n4\nApply the\nprinciple of\nradiation\nbiology and\nprotection in\ndental practice\n4.1 Apply knowledge of\nionizing radiation to\nproduce a dental\nradiograph\n4.2 Apply knowledge of\nradiation biology to\nprotect patient,\noperator and others\nfrom ionizing radiation\n4.3 Determine image\ncharacteristics of a\ndental radiographic\nimage to minimize the\nnecessity for retake\n4.4 Minimize radiation by\nmaintaining quality in\nprocessing\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n5\nPerform scaling\nand polishing\n5.1 Perform dental\ndiagnosis on patient\n5.2 Scale and polish teeth\n5.3 Provide advice to\npatient\n• Lecture/\nDemonstration\n• OJT\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 98 ---\nTR Dental Hygiene NC IV\n\n95\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n6\nMaintain dental\nrecords and\nresources\n6.1 Maintain patient’s\nrecords\n6.2 Maintain financial\nrecords of the clinic\n6.3 Purchase dental\nproducts\n6.4 Monitor quality control\n6.5 Comply with dental\nethics and\njurisprudence\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n7\nProvide\neffective\npatients/clients\nservice\n7.1 Greet patient/client\n7.2 Identify patient/client\nneeds\n7.3 Deliver dental services\nto patient/client\n7.4 Handle queries through\ntelephone, fax\nmachine, internet and\ne-mail\n7.5 Handle complaints,\nevaluation and\nrecommendations\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 99 ---\nTR Dental Hygiene NC IV\n\n96",
