        "source_title": "PERFORM POLISHING",
        "source_text": "--- PDF PAGE 45 ---\nTR-Automotive Body Painting/Finishing NC I \n- 41 - \nUNIT OF COMPETENCY : \nPERFORM POLISHING \n \nUNIT CODE \n: \nALT714304 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competency in performing polishing for \nautomotive body painting. It also involves skills in applying masking \nmaterials and handling of polishing equipment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Assess painted \nsurface \n \n \n1.1 \nAdequate lighting system is used in assessing painted surface \n1.2 \nAppropriate repair procedure is accurately determined \n1.3 \nAppropriate polishing procedure are selected as per selected \nrepair procedure \n2. Prepare surface for \npolishing \n \n \n \n2.1  \nWorkplace is properly cleaned as per polishing compound  \nmanufacturer specification \n2.2  \nMasking materials are applied on necessary areas as per \nappropriate masking procedure \n2.3 \nPanel/surface to polished is positioned as per company \npolishing requirements \n3. Polish painted \nsurface \n \n3.1 \nManual hand polishing is applied on surface as per job \nrequirements  \n3.2 \nSanding is applied on surface as per job requirements \n3.3 \nHandling of polishing equipment, tools and materials is done \nas per procedures \n3.4 \nPolishing is performed as per procedure \n3.5 \nPolishing compound are applied as per polishing compound \nmanufacturer standard \n3.6\nNo over-polish or thin paint results\n4. Clean the polished \nsurface \n4.1  \nAdequate tap water for washing and cleaning is used \n4.2  \nSoft fine cloth or flannel cloth is used for wiping. \n4.3 \nSurface is wiped-dried and cleaned \n5. Install body \naccessories \n \n5.1  \nSafety requirements are observed in installing automotive body \nparts and accessories \n5.2  \nAll body accessories are installed and are free from dirt \n5.3  \nFinal polished area is assessed before and after installation of \nbody parts and accessories.\n\n--- PDF PAGE 46 ---\nTR-Automotive Body Painting/Finishing NC I \n- 42 - \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Lighting system \n \nLighting sources include illumination of  \n1.1 800-1000 lux \n1.2 Natural sunlight \n2. Repair procedure \n \nDifferent types of repair procedures include: \n1.3 Sanding and repainting \n1.4 A) Sanding \nB) Coarse Polishing \nC) Fine Polishing \n1.5 A) Coarse Polishing \nB) Fine Polishing \n2.4 Fine Polishing\n3. Polishing pads \n \nPolishing pads include: \n3.1  Wool \n3.2 Foam\n4. Polishing \ncompounds \n \n \nPolishing compounds can be liquid or paste and include: \n4.1  Fine \n4.2  Medium \n4.3 Coarse\n5. Masking materials \n \nMasking materials may include but not limited to; \n5.1  Masking paper/plastics \n5.2  Masking tapes for auto use \n5.3  Mouldings tapes \n5.4  Fine line tapes \n5.5 Spray-type masking\n6. Masking \nprocedures \n \nMasking procedures may include the following: \n6.1  Reverse masking \n6.2  Masking non-removable parts \n6.3  Masking curved or complex areas or surfaces \n6.4  Masking for block painting \n6.5 Masking for spot repairs\n7. Handling of polisher\nHandling of polisher must consider the following: \n7.1 Angle of polishing \n7.2  Direction of rotation \n7.3 Strokes in polishing\n\n--- PDF PAGE 47 ---\nTR-Automotive Body Painting/Finishing NC I \n- 43 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nAssessed painted surface \n1.2 \nPrepared surface for polishing \n1.3 \nPolished painted surface \n1.4 \nCleaned the polished surface \n1.5\nInstalled body accessories\n2. Underpinning \nknowledge and \nattitudes \n \n2.1 \nTypes of polishing compounds \n2.2 \nProcedure in using polisher \n2.3 \nProcedure in polishing \n2.4 \nProcedure in masking \n2.5 \nTypes of masking materials \n2.6 \nTypes of lighting sources \n2.7 \nKinds of Paint Repair procedures \n2.8 \nProcedure in cleaning polished surface \n2.9 \nProcedure in removing and installing automotive body parts and \naccessories \n2.10 Kinds of polishing defects \n2.11 Patience, Honesty, Sense of Quality in Work, Thoroughness, \nDedication to Work, Attentive to details\n3. Underpinning skills \n3.1  \nPerforming polishing \n3.2  \nApplying different masking materials and techniques \n3.3  \nCleaning the polished surface. \n3.4  \nInstalling body parts and accessories \n3.5 \n Using and Handling Polishing equipment and tools facilities   \n3.6 \nUsing Polishing materials  \n3.6  \nCommunication skills in dealing with customers, superiors and \npeers\n4. Resource  \nimplications \n \nThe following resources MUST be provided: \n4.1  \nMaterials relevant to the activity \n4.2  \nAppropriate tools, supplies and materials \n4.3 \nReal or simulated workplace\n5. Method of \nassessment \n \nCompetency may be assessed through: \n5.1  \nObservation in the workplace with questioning \n5.2  \nDemonstration with questioning \n5.3  \nPortfolio assessment \n5.4 \nWritten examination\n6. Context of \nassessment \n6.1  \nCompetency must be assessed in a safe working environment \n6.2 \nAssessment must be undertaken in accordance with the \napproved industry OH & S regulations\n",
