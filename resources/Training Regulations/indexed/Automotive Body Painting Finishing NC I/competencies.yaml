          "source_text": "1. Assess painted \nsurface \n \n \n1.1 \nAdequate lighting system is used in assessing painted surface \n1.2 \nAppropriate repair procedure is accurately determined \n1.3 \nAppropriate polishing procedure are selected as per selected \nrepair procedure \n2. Prepare surface for \npolishing \n \n \n \n2.1  \nWorkplace is properly cleaned as per polishing compound  \nmanufacturer specification \n2.2  \nMasking materials are applied on necessary areas as per \nappropriate masking procedure \n2.3 \nPanel/surface to polished is positioned as per company \npolishing requirements \n3. Polish painted \nsurface \n \n3.1 \nManual hand polishing is applied on surface as per job \nrequirements  \n3.2 \nSanding is applied on surface as per job requirements \n3.3 \nHandling of polishing equipment, tools and materials is done \nas per procedures \n3.4 \nPolishing is performed as per procedure \n3.5 \nPolishing compound are applied as per polishing compound \nmanufacturer standard \n3.6\nNo over-polish or thin paint results\n4. Clean the polished \nsurface \n4.1  \nAdequate tap water for washing and cleaning is used \n4.2  \nSoft fine cloth or flannel cloth is used for wiping. \n4.3 \nSurface is wiped-dried and cleaned \n5. Install body \naccessories \n \n5.1  \nSafety requirements are observed in installing automotive body \nparts and accessories \n5.2  \nAll body accessories are installed and are free from dirt \n5.3  \nFinal polished area is assessed before and after installation of \nbody parts and accessories.\n\n--- PDF PAGE 46 ---\nTR-Automotive Body Painting/Finishing NC I \n- 42 - \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Lighting system \n \nLighting sources include illumination of  \n1.1 800-1000 lux \n1.2 Natural sunlight \n2. Repair procedure \n \nDifferent types of repair procedures include: \n1.3 Sanding and repainting \n1.4 A) Sanding \nB) Coarse Polishing \nC) Fine Polishing \n1.5 A) Coarse Polishing \nB) Fine Polishing \n2.4 Fine Polishing\n3. Polishing pads \n \nPolishing pads include: \n3.1  Wool \n3.2 Foam\n4. Polishing \ncompounds \n \n \nPolishing compounds can be liquid or paste and include: \n4.1  Fine \n4.2  Medium \n4.3 Coarse\n5. Masking materials \n \nMasking materials may include but not limited to; \n5.1  Masking paper/plastics \n5.2  Masking tapes for auto use \n5.3  Mouldings tapes \n5.4  Fine line tapes \n5.5 Spray-type masking\n6. Masking \nprocedures \n \nMasking procedures may include the following: \n6.1  Reverse masking \n6.2  Masking non-removable parts \n6.3  Masking curved or complex areas or surfaces \n6.4  Masking for block painting \n6.5 Masking for spot repairs\n7. Handling of polisher\nHandling of polisher must consider the following: \n7.1 Angle of polishing \n7.2  Direction of rotation \n7.3 Strokes in polishing\n\n--- PDF PAGE 47 ---\nTR-Automotive Body Painting/Finishing NC I \n- 43 -"
        },
