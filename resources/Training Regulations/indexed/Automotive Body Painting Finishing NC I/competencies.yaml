ications are\nlocated in relations to the work to be conducted\n2.2\nInformation and procedure in the manual are interpreted in\naccordance to industry practices\n3. Apply information in\nmanual\n\n3.1\nManual is interpreted according to job requirements\n3.2\nWork steps are correctly identified in accordance with\nmanufacturer specification\n3.3\nManual data is applied according to the given task\n3.4\nAll correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n4. Store manuals\n4.1 Manual or specification are stored appropriately to ensure\nprevention of damage, ready access and updating of\ninformation when required in accordance with company\nrequirements\n\n--- PDF PAGE 28 ---\nTR-Automotive Body Painting/Finishing NC I\n- 24 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manuals\n\n Kinds of manuals:\n1.1\nManufacturer’s specification manual\n1.2\nRepair manual\n1.3\nMaintenance Procedure Manual\n1.4\nPeriodic Maintenance Manual\n\n--- PDF PAGE 29 ---\nTR-Automotive Body Painting/Finishing NC I\n- 25 -\n\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified and accessed manual/specification\n1.2\nInterpreted manuals\n1.3\nApplied information in manuals\n1.4\nStored manuals\n2. Underpinning\nknowledge\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning skills\n\n3.1\nReading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2\nAccessing information and data\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1\nAll manuals/catalogues relative to Automotive\n4.2\nJob order, requisitions\n4.3\nActual vehicle or simulator\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nInt