        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned the work area before and after use.\n1.2\nCleaned and degreased panel or vehicle to be repainted\n1.3\nPrepared paint mixture and spray gun\n1.4\nApplied solid color paint by spraying\n1.5\nUsed tack cloth to wipe off remaining particles\n1.6\nAvoided touching surfaces after degreasing and after wiping of\ntack cloth\n1.7\nDisposed off left over paint as per company standard operating\nprocedure.\n1.8\nCleaned the spray gun before and after use\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nRelevant technical information\n2.3\nWorkplace safety procedures\n2.4\nVehicle safety requirements\n2.5\nEquipment safety requirements\n2.6\nProcedure in spraying solid color paint\n2.7\nPersonal safety requirements\n2.8\nColor mixing and matching\n2.9\nMasking Procedures\n2.10 Polishing procedures\n2.11 Procedure in removing detachable auto body parts and\naccessories\n2.12 Honesty, Sense of Quality in Work, Patience, Thoroughness,\nDedication to Work and Trainable to New Procedures.\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUse of relevant tools and equipment\n3.3\nClean bare metal, plastic and fiberglass surfaces\n3.4\nPreparing surfaces for application of primers\n3.5\nCommunication skills specifically in dealing with customers,\nsuperior or peers\n3.6\nReading and writing\n3.7\nComputation skills for volume, area, length, ratio and proportion\n3.8\nPreparing paint mixtures\n3.9\nDisposal of wastes and other residue materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2\nWritten examination\n5.3\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 45 ---\nTR-Automotive Body Painting/Finishing NC I\n- 41 -\nUNIT OF COMPETENCY :\nPERFORM POLISHING\n\nUNIT CODE\n:"
        },
        "source_text": "ALT714303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competency required in spraying solid color\npaint to metal, plastic and direct gloss fiberglass surfaces. It also\ninvolves single stage paint spraying.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Clean and\ndegrease\npanel/vehicle to be\nrepainted\n1.1\nWork area is properly cleaned as per recommended paint\nmanufacturer and company standard.\n1.2\nPanel/Vehicle to be painted is positioned as per painting\nrequirements\n1.3\nCleaning of panel/vehicle is performed using pressurized air\nwith air dryer to remove sanded particles\n1.4\nDegreasing of panel/vehicle is performed as per company\nstandard operating procedure\n1.5\nTack cloth is used to wipe off remaining particles\n2. Prepare paint\nmixture and spray\ngun\n\n2.1\nSpray gun is set-up as per paint manufacturer specifications\n2.2\nPaint mixture is strained using fine paint strainer while\ntransferring mixture to spray gun without spillage\n2.3\n Paint mixture is transferred to spray gun at least 70% of paint\ncup capacity and without spillage.\n2.4\nSpray pattern is checked by spray testing on separate test\npanel\n2.5\nPattern, discharge, volume, air pressure of spray gun is\nadjusted as per job requirements.\n3. Apply solid color\npaint by spraying\n3.1\nSolid color is applied using spray gun following and observing\nthe factors in paint application:\n3.4\nAppropriate personal protective devices are used during\npainting\n3.5\nFlash-off time is observed as per paint manufacturer’s\nspecification\n3.6\nDrying time is observed as per manufacturer’s specification.\n4. Clean the spray\ngun\n\n4.1\nPaint cup is cleaned with thinner before and after use\n4.2\nPaint passage is cleaned with back-flush technique\n4.3\nNozzle cap is removed and fluid tip is cleaned\n4.4\nThinner is ensured clear after repetitive back-flush cleaning\nmethod\n\n--- PDF PAGE 43 ---\nTR-Automotive Body Painting/Finishing NC I\n- 39 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Spray gun\nTypes of spray gun :\n According to performance\n1.1 Conventional type\n1.2 HVLP (Hi volume low pressure) type\n According to construction\n1.3 Gravity fed type\n1.4\nSuction type\n2. Protective clothing\nand equipment\nPersonal Protective clothing and safety devices may include:\n2.1\nGloves -cotton and solvent resistant\n2.1\nSafety shoes or boots\n2.2\nDust mask, gas mask or respirator, particle mask\n2.4\nShop uniform\n2.3\nApron\n2.4\nSeparate clothing for actual painting application\n2.5\nEye spectacles or goggles\n3. Factors in paint\napplication\nFactors in paint application/handling techniques\n3.1\nDistance, normally 100-200 mm\n3.2\nAngle – Spray gun perpendicular to the panel 90 degrees\n3.3\nSpeed – normally 800-1000 mm/sec.\n3.4\nSpray pattern overlap\n4. Paint mixture\nPaint mixture includes substance such as:\n4.1\nPaint\n4.1\nThinner\n4.2\nHardener\n4.3\nAdditives\n5. Solid color paint\nTypes of solid color paint are:\n5.1\nSingle stage or direct gloss\n5.2\nTwo stage base over clear\n\n--- PDF PAGE 44 ---\nTR-Automotive Body Painting/Finishing NC I\n- 40 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned the work area before and after use.\n1.2\nCleaned and degreased panel or vehicle to be repainted\n1.3\nPrepared paint mixture and spray gun\n1.4\nApplied solid color paint by spraying\n1.5\nUsed tack cloth to wipe off remaining particles\n1.6\nAvoided touching surfaces after degreasing and after wiping of\ntack cloth\n1.7\nDisposed off left over paint as per company standard operating\nprocedure.\n1.8\nCleaned the spray gun before and after use\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nRelevant technical information\n2.3\nWorkplace safety procedures\n2.4\nVehicle safety requirements\n2.5\nEquipment safety requirements\n2.6\nProcedure in spraying solid color paint\n2.7\nPersonal safety requirements\n2.8\nColor mixing and matching\n2.9\nMasking Procedures\n2.10 Polishing procedures\n2.11 Procedure in removing detachable auto body parts and\naccessories\n2.12 Honesty, Sense of Quality in Work, Patience, Thoroughness,\nDedication to Work and Trainable to New Procedures.\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUse of relevant tools and equipment\n3.3\nClean bare metal, plastic and fiberglass surfaces\n3.4\nPreparing surfaces for application of primers\n3.5\nCommunication skills specifically in dealing with customers,\nsuperior or peers\n3.6\nReading and writing\n3.7\nComputation skills for volume, area, length, ratio and proportion\n3.8\nPreparing paint mixtures\n3.9\nDisposal of wastes and other residue materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2\nWritten examination\n5.3\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 45 ---\nTR-Automotive Body Painting/Finishing NC I\n- 41 -\nUNIT OF COMPETENCY :\nPERFORM POLISHING\n\nUNIT CODE\n:"
