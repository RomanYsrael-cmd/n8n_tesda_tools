er Steering Fluid\n•\nHydraulic Fluid\n2.7\nRadiator Coolant\n•\nLong last coolant\n2.8\nA/C Compressor Oil\n•\nPAG oil\n3. Lubricant\n schedule\nSchedule for changing oil:\n3.1 Kilometers traveled used\n3.2 No. of Hours used\n3.3\nMonthly\n4. Tool and\n equipment\nTools used includes:\n4.1\nHand tools\n4.2\nOiler\n4.3\nOil Dispenser\n4.4\nGrease gun\n5. Personal protective\nequipment (PPE)\n\nPPE include:\n5.1\nApron\n5.2\nGloves\n5.3\nGoggles\n5.4\nSafety shoes\n\n--- PDF PAGE 32 ---\nTR-Automotive Body Painting/Finishing NC I\n- 28 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nIdentified types of lubricants and lubrication schedule.\n1.2\nUsed and applied lubricants.\n1.3\nPerformed housekeeping\n2. Underpinning\nknowledge\n\n2.1\nTypes/Classification of Lubricants\n2.2\nIdentifying lubrication schedule\n2.3\nCause and Effects of Gear Oil Dilution\n2.4\nPurpose of Lubrication (Problem and effects)\n2.5\nHazard associated with lubrication\n3. Underpinning skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3\nLubrication Procedure\n4. Resource implication\n\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate tools and equipment\n4.3\nMaterials relevant to activity\n5. Method of\nassessment\n\nCompetency MUST be assessed through\n5.1\nDemonstration with questioning\n5.2\nWritten/Oral examination\n6. Context of\nassessment\n\n6.1\nCompetency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment must be undertaken in accordance with the\nendorsed industry assessment guidelines\n6.3\nAssessment of underpinning knowledge and skills may be\nassessed on or off the job\n\n--- PDF PAGE 33 ---\nTR-Automotive Body Painting/Finishing NC I\n- 29 -\n UNIT OF COMPETENCY :\nPERFORM SHOP MAINTENANCE\n\nUNIT CODE\n:"
