        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSelected measuring instruments\n1.2\nCarried-out measurements and calculations.\n1.3\nMaintained measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes of Measuring instruments and its uses\n2.2\nSafe handling procedures in using measuring instruments\n2.3\nFour fundamental operation of mathematics\n2.4\nFormula for Volume, Area, Perimeter and other geometric\nfigures\n3. Underpinning\n skills\n3.1\nCaring and Handling measuring instruments\n3.2\nCalibrating and using measuring instruments\n3.1\nPerforming calculation by Addition, Subtraction, Multiplication\nand Division\n3.2\nVisualizing objects and shapes\n3.3\nInterpreting formula for volume, area, perimeter and other\ngeometric figures\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3\nInstructional materials relevant to the propose activity\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4\nDemonstration with questioning\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe working\nenvironment\n6.2 Assessment may be conducted in a workplace or simulated\nenvironment\n\n--- PDF PAGE 27 ---\nTR-Automotive Body Painting/Finishing NC I\n- 23 -\n\nUNIT OF COMPETENCY : READ, INTERPRET AND APPLY SPECIFICATION AND\n MANUAL\n\nUNIT CODE\n:"
        },
        "source_text": "ALT311202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in measuring\nand calculating using tools and measuring instruments. It also\ncovers care and handling of measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select measuring\ninstruments\n1.1\nObject or component to be measured is identified\n1.2\nCorrect specifications are obtained from relevant source\n1.3\nAppropriate measuring instrument is selected according to\njob requirements\n2. Carry out\nmeasurements and\ncalculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\nusing the four fundamental operation of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks.\n2.5\nNumerical computation is self-checked and corrected for\naccuracy\n2.6\nInstruments are read to the limit of accuracy of the tool.\n3. Maintain measuring\ninstruments\n\n3.3\nMeasuring instruments are kept free from corrosion\n3.4\nMeasuring instruments are not dropped to avoid damage\n3.5\nMeasuring instruments are cleaned before and after using.\n\n--- PDF PAGE 25 ---\nTR-Automotive Body Painting/Finishing NC I\n- 21 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1\nMultitester\n1.2\nMicrometer (In-out, depth)\n1.3\nVernier caliper (Out, inside)\n1.4\nDial Gauge with Mag. Std.\n1.5\nPlastigauge\n1.6\nStraight Edge\n1.7\nThickness gauge\n1.8\nTorque Gauge\n1.9\nSmall Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nIncludes calculation of the following:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2.10 Out of roundness\n2.11 Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 26 ---\nTR-Automotive Body Painting/Finishing NC I\n- 22 -\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSelected measuring instruments\n1.2\nCarried-out measurements and calculations.\n1.3\nMaintained measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes of Measuring instruments and its uses\n2.2\nSafe handling procedures in using measuring instruments\n2.3\nFour fundamental operation of mathematics\n2.4\nFormula for Volume, Area, Perimeter and other geometric\nfigures\n3. Underpinning\n skills\n3.1\nCaring and Handling measuring instruments\n3.2\nCalibrating and using measuring instruments\n3.1\nPerforming calculation by Addition, Subtraction, Multiplication\nand Division\n3.2\nVisualizing objects and shapes\n3.3\nInterpreting formula for volume, area, perimeter and other\ngeometric figures\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3\nInstructional materials relevant to the propose activity\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4\nDemonstration with questioning\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe working\nenvironment\n6.2 Assessment may be conducted in a workplace or simulated\nenvironment\n\n--- PDF PAGE 27 ---\nTR-Automotive Body Painting/Finishing NC I\n- 23 -\n\nUNIT OF COMPETENCY : READ, INTERPRET AND APPLY SPECIFICATION AND\n MANUAL\n\nUNIT CODE\n:"
