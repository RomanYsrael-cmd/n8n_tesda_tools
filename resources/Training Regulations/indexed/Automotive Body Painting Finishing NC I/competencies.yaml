programs \n5.4 \nEthical standards \n5.5 \nDefined resources parameters \n5.6 \nQuality and continuous improvement processes and \nstandards\n\n--- PDF PAGE 11 ---\nTR-Automotive Body Painting/Finishing NC I \n- 7 -"
