        "source_text": "--- PDF PAGE 30 ---\nTR-Automotive Body Painting/Finishing NC I \n- 26 - \nUNIT OF COMPETENCY : \nUSE AND APPLY LUBRICANTS/COOLANTS \n \nUNIT CODE \n: \nALT723204 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to select and apply different \ntypes of lubricants and coolants in using and maintaining tools, \nequipment and vehicles. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Identify types of \nlubricants/ coolant \n1.1 \nCorrect information on lubrication schedule is accessed and \ninterpreted from appropriate manufacturers specifications \nmanuals \n1.2 \nType and quantity of lubricants/coolant is identified as per job \nrequirements\n2. Use and apply   \n      lubricants/coolants \n2.1  Correct procedure for change of lubricant is identified following \nmanufacturer’s specification or manual \n2.1 \nCorrect tools and equipment are selected and used in line with \njob requirements \n2.3 \nExisting lubricants is removed and replaced with specified \ntypes and quantity of new materials in line with manufacturer’s \nspecification \n2.4 \nSafe procedure and use of PPE is observed when removing or \nreplacing lubricant \n2.5 \nUsed lubricants are disposed in accordance with environmental \nguidelines \n2. 6\nWork is checked in line with company SOP.\n3.  Perform \nhousekeeping \nactivities \n3.1 \nTools, equipment and materials  are properly stored as per \ncompany SOP \n3.2 \nWorkplace is free from waste materials\n\n--- PDF PAGE 31 ---\nTR-Automotive Body Painting/Finishing NC I \n- 27 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Manuals \n1.1 \nManufacturer’s  specification manual \n1.2 \nPeriodic Maintenance manual \n1.3\nService Manual\n2. Lubricants/ Coolants \n \nKinds of lubricants include: \n2.1 \nEngine oil: \n \nDiesel engine oil \n \nGasoline engine oil \n2.2 \nAutomatic Transmission \nFluid \n \nDestro II \n \nT4 \n2.3 \nGear oil lubricants: \n \nOil #90 \n \nOil #140 \n \nOil #30 \n \nOil #40 \n2.4 \nGrease \n Special (velocity joint)   \nMolybdenum disulfate) \n Ordinary \n Multi-purpose oil \n Contact point lubricant  \n(grease)\n2.5 \nBrake/Clutch System \n \nBrake fluid \n \nDOT3 \n2.6 \nPower Steering Fluid \n \nHydraulic Fluid \n2.7 \nRadiator Coolant \n \nLong last coolant \n2.8 \nA/C Compressor Oil \n \nPAG oil \n3. Lubricant  \n     schedule \nSchedule for changing oil: \n3.1  Kilometers traveled used \n3.2  No. of Hours used \n3.3 \nMonthly\n4.  Tool and  \n      equipment \nTools used includes: \n4.1 \nHand tools \n4.2 \nOiler \n4.3 \nOil Dispenser \n4.4\nGrease gun\n5. Personal protective \nequipment (PPE) \n \nPPE include: \n5.1 \nApron \n5.2 \nGloves \n5.3 \nGoggles \n5.4\nSafety shoes\n\n--- PDF PAGE 32 ---\nTR-Automotive Body Painting/Finishing NC I \n- 28 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nIdentified types of lubricants and lubrication schedule. \n1.2 \nUsed and applied lubricants. \n1.3\nPerformed housekeeping\n2. Underpinning \nknowledge  \n \n2.1 \nTypes/Classification of Lubricants \n2.2 \nIdentifying lubrication schedule \n2.3 \nCause and Effects of Gear Oil Dilution \n2.4 \nPurpose of Lubrication (Problem and effects) \n2.5\nHazard associated with lubrication\n3. Underpinning skills \n3.1  Handling of oils (Gear, oil, engine oil) \n3.2  Familiarization/Classification of Lubricants \n3.3 \nLubrication Procedure\n4. Resource implication \n \nThe following resources MUST be provided: \n4.1 \nWorkplace: Real or simulated work area \n4.2 \nAppropriate tools and equipment \n4.3\nMaterials relevant to activity\n5. Method of \nassessment \n \nCompetency MUST be assessed through \n5.1 \nDemonstration with questioning \n5.2\nWritten/Oral examination\n6. Context of \nassessment \n \n6.1 \nCompetency elements must be assessed in a safe working \nenvironment \n6.2 \nAssessment must be undertaken in accordance with the \nendorsed industry assessment guidelines \n6.3 \nAssessment of underpinning knowledge and skills may be \nassessed on or off the job\n",
