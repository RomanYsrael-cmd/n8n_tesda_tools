        "source_title": "PREPARE UNDAMAGED SURFACE FOR PAINTING",
        "source_text": "--- PDF PAGE 36 ---\nTR-Automotive Body Painting/Finishing NC I \n- 32 - \nCORE COMPETENCIES \n \nThis section gives the details of the contents of the core units of competency required in \nAUTOMOTIVE BODY PAINTING/FINISHING NC I.  \n \nUNIT OF COMPETENCY: PREPARE UNDAMAGED SURFACE FOR PAINTING                                      \n \nUNIT CODE: ALT714301 \n \nUNIT DESCRIPTOR:  This unit identifies the competence required to remove surface rust/scale \nand prepare application of primers, sealers and sealant for painting and \nrefinishing. \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Remove body \naccessories \n \n1.1 All detachable parts from panel/surface to be repainted are \nremoved as per procedure and without damage using required \ntools, equipment, supplies and materials \n1.2 All detachable parts are placed on secured containers with \ncomplete label and identification.\n2. Sand Surface \n2.1\nAdjacent panels or areas not to be sanded are applied with \nmasking materials. \n2.2 \nSanding is performed as per procedure. \n2.3 \nSanded area is assessed using visual, touch, gauges \nassessment methods \n2.4 \nDual action or orbital sander is used as per manufacturer \noperation instruction\n3. Clean the spray \ngun \n \n3.1\nPaint cup is cleaned with thinner before and after use\n3.2 \nPaint passage is cleaned with back-flush technique \n3.3 \nNozzle cap is removed and fluid tip is cleaned \n3.4 \nThinner is ensured clear after repetitive back-flush cleaning \nmethod \n4. Apply primers for \nstrip to metal \npainting job \n  \n4.1\nCleaning of panel is performed using pressurized air with air \ndryer to remove sanded particles \n4.2 \nDegreasing performed as per standard operating procedure \n4.3 \n Tack cloth is used to wipe off remaining particles \n4.4 \nPrimers mixed according to paint manufacturer specifications \n4.5 \nSpraying air pressure is maintained as per paint manufacturer \nspecification \n4.6 \nSpraying distance maintained as per manufacturer specification \n4.7 \nFlash off time is observed as per paint manufacturer \nspecifications \n4.8 \nDrying time is observed as per paint manufacturer \nspecifications. \n4.9 \nPersonal protective equipment and devices appropriate to the \napplication processes are worn and used as per specification \n5. Apply sealant when \nreplacing with new \npanel \n5.1\nCleaning and degreasing is performed on the area to be applied \nwith sealant \n5.2 \nSealant applicator nozzle is trimmed/cut according to \napplication necessity/requirements \n5.3 \nSealant is applied as per procedure \n5.4 \nApplied sealant is checked and excess sealant is removed and \ncleaned properly\n\n--- PDF PAGE 37 ---\nTR-Automotive Body Painting/Finishing NC I \n- 33 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Equipment, tools, \nsupplies and \nmaterials \nEquipment used includes: \nFor removing paints/Feather edging \n1.1 \nSander single action with dust extractor \n1.2 \nSander Dual action or Orbital with dust extractor \nFor applying surfacer \n1.3 \nAir compressor \n1.4 \nSpray gun \n1.5 \nAir lines and accessories \n1.6 \nAir dryer/filter \nTools include: \n1.7 \nScraper \n1.8 \nBasic handtools \nSupplies and Materials \n1.9 \nSand paper \n1.10 Paint remover \n1.11 Degreaser \n1.12 Primer \n1.13 Thinner \n1.14 Surfacer \n1.15 Sealant \n1.16\nMasking materials\n2.  Surfaces \nTypes of surfaces include: \n2.1  \nMetal \n2.2  \nPlastic \n2.3 \nFiberglass\n3.  Protective clothing \nand equipment \n \nPersonal protective clothing and safety devices may include: \n3.1  \nGloves – cotton and solvent resistant \n3.2  \nSafety shoes or boots \n3.3  \nDust mask, gas mask or respirator or particle mask \n3.4  \nShop uniform \n3.5  \nApron \n3.6 \nEye spectacle or goggles\n4.  Primer \nKinds of primers may include: \n4.1  Wash primer \n4.2  Epoxy primer \n4.3  Urethane primer \n4.4 \nAcrylic primer\n\n--- PDF PAGE 38 ---\nTR-Automotive Body Painting/Finishing NC I \n- 34 - \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nRemoved body accessories \n1.2 \nSanded surfaces \n1.3 \nMixed primer according to manufacturer’s specifications \n1.4\nApplied sealant when replacing with new panel\n2. Underpinning \nknowledge and \nattitudes \n2.1 \nNecessary cleaning and degreasing agents \n2.2 \nSurface preparation procedures for primers/sealers (including \nminor dents/surface blemish repair) \n2.3 \nRelevant technical information \n2.4 \nWorkplace safety procedures \n2.5 \nVehicle safety requirements \n2.6 \nEquipment safety requirements \n2.7 \nWet sanding procedure preparation for refinishing \n2.8 \nPrimer/sealed surface preparation for refinishing \n2.9 \nCorrect operating procedures of relevant equipment for surface \npreparation \n2.10 Personal safety requirements \n2.10 Dedication to work \n2.11\nPatience and perseverance\n3. Underpinning skills \n3.1 \nAccessing, interpreting and applying technical information \n3.2 \nUse relevant tools and equipment \n3.3 \nCleaning bare metal, plastic, fiberglass surfaces for primer \napplication \n3.4 \nPerforming surfaces for surfacer application \n3.5\nApplying primers/sealers and surfacer\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1  \nWorkplace: Real or simulated work area \n4.2  \nAppropriate Tools & equipment \n4.3 \nMaterials relevant to the activity \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDemonstration and Questioning \n5.2 \nWritten examination \n5.3\nPortfolio \n6. Context of \nassessment \n6.1  \nCompetency elements must be assessed on the job or in a \nsimulated environment \n6.2    The assessment of practical skills must take place after a period \nof supervised practice and repetitive experience \n6.3  \nThe required outcome must be able to be achieved without \ndirect supervision\n",
