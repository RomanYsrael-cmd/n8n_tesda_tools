        "source_text": "ALT714302\n\nUNIT DESCRIPTOR\n: This unit covers the competency required in applying and removing\nmaterials in preparation for spray painting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Remove\ndetachable parts for\npanel to be painted\n1.1\nAll detachable parts from panel to be repainted are removed\nas per procedure and without damage.\n1.2\nAll detachable parts are placed on secured containers with\ncomplete label and identification.\n2. Clean and\ndegrease panel for\nmasking\n\n2.1\nCleaning is performed using pressurized air with air dryer to\nremove dust particles.\n2.2\nPanel is washed with car shampoo and water\n2.3\nDegreasing is performed as per company standard operating\nprocedure\n3. Apply masking\nmaterials\n3.1\nType of masking materials to be used is accurately determined\nbased on the panel to be repainted\n3.2\nMasking materials is applied as per masking procedures\ndepending on the panel to be repainted\n3.3\nImproperly applied or loose ends masking materials are re-\nchecked and corrected upon applying pressurized air as per\ncompany standard operating procedure.\n4. Remove masking\nmaterials\n\n4.1\nRemove masking materials as per paint job requirements\n4.2\nMasking materials removed as per sequence of layers\n4.3\nMasking materials are disposed as per company standard\noperating procedures.\n\n--- PDF PAGE 40 ---\nTR-Automotive Body Painting/Finishing NC I\n- 36 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Detachable parts\nExample of detachable parts of automotive body include but not\nlimited to:\n1.1\nMouldings\n1.2\nDoor handles\n1.3\nClearance lights\n1.4\nLogo, emblem or stickers\n2. Masking materials\nMasking materials may include but not limited to;\n4.4\nMasking paper/plastics\n4.5\nMasking tapes for auto use\n4.6\nMouldings tapes\n4.7\nFine line tapes\n4.8\nSpray –type masking\n3. Masking\nprocedures\nMasking procedures may include the following:\n3.1\nReverse masking\n3.2\nMasking non-removable parts\n3.3\nMasking curved or complex areas or surfaces\n3.4\nMasking for block or whole panel painting\n3.5\nMasking for spot repairs\n\n--- PDF PAGE 41 ---\nTR-Automotive Body Painting/Finishing NC I\n- 37 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nRemoved detachable parts for panel to be painted\n1.2\nCleaned and degreased panel for masking\n1.3\nApplied masking materials\n1.4\nRemoved masking materials\n1.5\nEnsured proper masking to prevent over spray.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nRelevant technical information\n2.3\nWorkplace safety procedures\n2.4\nVehicle safety requirements\n2.5\nEquipment safety requirements\n2.6\nPersonal safety requirements\n2.6\nMasking Procedures\n2.7\nKinds of Masking materials\n2.8\nDetachable Parts of automotive vehicle body\n2.9\nProper use of masking materials\n2.10 Procedure in removing detachable auto body parts and\naccessories\n2.11 Open-mindedness, Trainable to new procedures, Dedication to\nwork, Patience, Initiative, Orderliness and Cleanliness\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUse of relevant tools and equipment\n3.3\nClean bare metal surfaces, plastic and fiberglass\n3.4\nDegreasing panel to be repainted\n3.5\nApplying and removing masking materials\n3.6\nRemoving and Replacing auto body parts and accessories\n3.7\nSecuring/storing of auto body parts and accessories\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 42 ---\nTR-Automotive Body Painting/Finishing NC I\n- 38 -\nUNIT OF COMPETENCY :\nSPRAY SOLID COLOR PAINT\n\nUNIT CODE\n:"
