kills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 36 ---\nTR-Automotive Body Painting/Finishing NC I\n- 32 -\nCORE COMPETENCIES\n\nThis section gives the details of the contents of the core units of competency required in\nAUTOMOTIVE BODY PAINTING/FINISHING NC I.\n\nUNIT OF COMPETENCY: PREPARE UNDAMAGED SURFACE FOR PAINTING\n\nUNIT CODE: ALT714301\n\nUNIT DESCRIPTOR: This unit identifies the competence required to remove surface rust/scale\nand prepare application of primers, sealers and sealant for painting and\nrefinishing.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Remove body\naccessories\n\n1.1 All detachable parts from panel/surface to be repainted are\nremoved as per procedure and without damage using required\ntools, equipment, supplies and materials\n1.2 All detachable parts are placed on secured containers with\ncomplete label and identification.\n2. Sand Surface\n2.1\nAdjacent panels or areas not to be sanded are applied with\nmasking materials.\n2.2\nSanding is performed as per procedure.\n2.3\nSanded area is assessed using visual, touch, gauges\nassessment methods\n2.4\nDual action or orbital sander is used as per manufacturer\noperation instruction\n3. Clean the spray\ngun\n\n3.1\nPaint cup is cleaned with thinner before and after use\n3.2\nPaint passage is cleaned with back-flush technique\n3.3\nNozzle cap is removed and fluid tip is cleaned\n3.4\nThinner is ensured clear after repetitive back-flush cleaning\nmethod\n4. Apply primers for\nstrip to metal\npainting job\n\n4.1\nCleaning of panel is performed using pressurized air with air\ndryer to remove sanded particles\n4.2\nDegreasing performed as per standard operating procedure\n4.3\n Tack cloth is used to wipe off remaining particles\n4.4\nPrimers mixed according to paint manufacturer specifications\n4.5\nSpraying air pressure is maintained as per paint manufacturer\nspecification\n4.6\nSpraying distance maintained as per manufacturer specification\n4.7\nFlash off time is observed as per paint manufacturer\nspecifications\n4.8\nDrying time is observed as per paint manufacturer\nspecifications.\n4.9\nPersonal protective equipment and devices appropriate to the\napplication processes are worn and used as per specification\n5. Apply sealant when\nreplacing with new\npanel\n5.1\nCleaning and degreasing is performed on the area to be applied\nwith sealant\n5.2\nSealant applicator nozzle is trimmed/cut according to\napplication necessity/requirements\n5.3\nSealant is applied as per procedure\n5.4\nApplied sealant is checked and excess sealant is removed and\ncleaned properly\n\n--- PDF PAGE 37 ---\nTR-Automotive Body Painting/Finishing NC I\n- 33 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment, tools,\nsupplies and\nmaterials\nEquipment used includes:\nFor removing paints/Feather edging\n1.1\nSander single action with dust extractor\n1.2\nSander Dual action or Orbital with dust extractor\nFor applying surfacer\n1.3\nAir compressor\n1.4\nSpray gun\n1.5\nAir lines and accessories\n1.6\nAir dryer/filter\nTools include:\n1.7\nScraper\n1.8\nBasic handtools\nSupplies and Materials\n1.9\nSand paper\n1.10 Paint remover\n1.11 Degreaser\n1.12 Primer\n1.13 Thinner\n1.14 Surfacer\n1.15 Sealant\n1.16\nMasking materials\n2. Surfaces\nTypes of surfaces include:\n2.1\nMetal\n2.2\nPlastic\n2.3\nFiberglass\n3. Protective clothing\nand equipment\n\nPersonal protective clothing and safety devices may include:\n3.1\nGloves – cotton and solvent resistant\n3.2\nSafety shoes or boots\n3.3\nDust mask, gas mask or respirator or particle mask\n3.4\nShop uniform\n3.5\nApron\n3.6\nEye spectacle or goggles\n4. Primer\nKinds of primers may include:\n4.1 Wash primer\n4.2 Epoxy primer\n4.3 Urethane primer\n4.4\nAcrylic primer\n\n--- PDF PAGE 38 ---\nTR-Automotive Body Painting/Finishing NC I\n- 34 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nRemoved body accessories\n1.2\nSanded surfaces\n1.3\nMixed primer according to manufacturer’s specifications\n1.4\nApplied sealant when replacing with new panel\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nSurface preparation procedures for primers/sealers (including\nminor dents/surface blemish repair)\n2.3\nRelevant technical information\n2.4\nWorkplace safety procedures\n2.5\nVehicle safety requirements\n2.6\nEquipment safety requirements\n2.7\nWet sanding procedure preparation for refinishing\n2.8\nPrimer/sealed surface preparation for refinishing\n2.9\nCorrect operating procedures of relevant equipment for surface\npreparation\n2.10 Personal safety requirements\n2.10 Dedication to work\n2.11\nPatience and perseverance\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUse relevant tools and equipment\n3.3\nCleaning bare metal, plastic, fiberglass surfaces for primer\napplication\n3.4\nPerforming surfaces for surfacer application\n3.5\nApplying primers/sealers and surfacer\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration and Questioning\n5.2\nWritten examination\n5.3\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency elements must be assessed on the job or in a\nsimulated environment\n6.2 The assessment of practical skills must take place after a period\nof supervised practice and repetitive experience\n6.3\nThe required outcome must be able to be achieved without\ndirect supervision\n\n--- PDF PAGE 39 ---\nTR-Automotive Body Painting/Finishing NC I\n- 35 -\n UNIT OF COMPETENCY :\nAPPLY AND REMOVE MASKING\n\nUNIT CODE\n:\nALT714302\n\nUNIT DESCRIPTOR\n: This unit covers the competency required in applying and removing\nmaterials in preparation for spray painting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Remove\ndetachable parts for\npanel to be painted\n1.1\nAll detachable parts from panel to be repainted are removed\nas per procedure and without damage.\n1.2\nAll detachable parts are placed on secured containers with\ncomplete label and identification.\n2. Clean and\ndegrease panel for\nmasking\n\n2.1\nCleaning is performed using pressurized air with air dryer to\nremove dust particles.\n2.2\nPanel is washed with car shampoo and water\n2.3\nDegreasing is performed as per company standard operating\nprocedure\n3. Apply masking\nmaterials\n3.1\nType of masking materials to be used is accurately determined\nbased on the panel to be repainted\n3.2\nMasking materials is applied as per masking procedures\ndepending on the panel to be repainted\n3.3\nImproperly applied or loose ends masking materials are re-\nchecked and corrected upon applying pressurized air as per\ncompany standard operating procedure.\n4. Remove masking\nmaterials\n\n4.1\nRemove masking materials as per paint job requirements\n4.2\nMasking materials removed as per sequence of layers\n4.3\nMasking materials are disposed as per company standard\noperating procedures.\n\n--- PDF PAGE 40 ---\nTR-Automotive Body Painting/Finishing NC I\n- 36 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Detachable parts\nExample of detachable parts of automotive body include but not\nlimited to:\n1.1\nMouldings\n1.2\nDoor handles\n1.3\nClearance lights\n1.4\nLogo, emblem or stickers\n2. Masking materials\nMasking materials may include but not limited to;\n4.4\nMasking paper/plastics\n4.5\nMasking tapes for auto use\n4.6\nMouldings tapes\n4.7\nFine line tapes\n4.8\nSpray –type masking\n3. Masking\nprocedures\nMasking procedures may include the following:\n3.1\nReverse masking\n3.2\nMasking non-removable parts\n3.3\nMasking curved or complex areas or surfaces\n3.4\nMasking for block or whole panel painting\n3.5\nMasking for spot repairs\n\n--- PDF PAGE 41 ---\nTR-Automotive Body Painting/Finishing NC I\n- 37 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nRemoved detachable parts for panel to be painted\n1.2\nCleaned and degreased panel for masking\n1.3\nApplied masking materials\n1.4\nRemoved masking materials\n1.5\nEnsured proper masking to prevent over spray.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nRelevant technical information\n2.3\nWorkplace safety procedures\n2.4\nVehicle safety requirements\n2.5\nEquipment safety requirements\n2.6\nPersonal safety requirements\n2.6\nMasking Procedures\n2.7\nKinds of Masking materials\n2.8\nDetachable Parts of automotive vehicle body\n2.9\nProper use of masking materials\n2.10 Procedure in removing detachable auto body parts and\naccessories\n2.11 Open-mindedness, Trainable to new procedures, Dedication to\nwork, Patience, Initiative, Orderliness and Cleanliness\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUse of relevant tools and equipment\n3.3\nClean bare metal surfaces, plastic and fiberglass\n3.4\nDegreasing panel to be repainted\n3.5\nApplying and removing masking materials\n3.6\nRemoving and Replacing auto body parts and accessories\n3.7\nSecuring/storing of auto body parts and accessories\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 42 ---\nTR-Automotive Body Painting/Finishing NC I\n- 38 -\nUNIT OF COMPETENCY :\nSPRAY SOLID COLOR PAINT\n\nUNIT CODE\n:\nALT714303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competency required in spraying solid color\npaint to metal, plastic and direct gloss fiberglass surfaces. It also\ninvolves single stage paint spraying.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Clean and\ndegrease\npanel/vehicle to be\nrepainted\n1.1\nWork area is properly cleaned as per recommended paint\nmanufacturer and company standard.\n1.2\nPanel/Vehicle to be painted is positioned as per painting\nrequirements\n1.3\nCleaning of panel/vehicle is performed using pressurized air\nwith air dryer to remove sanded particles\n1.4\nDegreasing of panel/vehicle is performed as per company\nstandard operating procedure\n1.5\nTack cloth is used to wipe off remaining particles\n2. Prepare paint\nmixture and spray\ngun\n\n2.1\nSpray gun is set-up as per paint manufacturer specifications\n2.2\nPaint mixture is strained using fine paint strainer while\ntransferring mixture to spray gun without spillage\n2.3\n Paint mixture is transferred to spray gun at least 70% of paint\ncup capacity and without spillage.\n2.4\nSpray pattern is checked by spray testing on separate test\npanel\n2.5\nPattern, discharge, volume, air pressure of spray gun is\nadjusted as per job requirements.\n3. Apply solid color\npaint by spraying\n3.1\nSolid color is applied using spray gun following and observing\nthe factors in paint application:\n3.4\nAppropriate personal protective devices are used during\npainting\n3.5\nFlash-off time is observed as per paint manufacturer’s\nspecification\n3.6\nDrying time is observed as per manufacturer’s specification.\n4. Clean the spray\ngun\n\n4.1\nPaint cup is cleaned with thinner before and after use\n4.2\nPaint passage is cleaned with back-flush technique\n4.3\nNozzle cap is removed and fluid tip is cleaned\n4.4\nThinner is ensured clear after repetitive back-flush cleaning\nmethod\n\n--- PDF PAGE 43 ---\nTR-Automotive Body Painting/Finishing NC I\n- 39 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Spray gun\nTypes of spray gun :\n According to performance\n1.1 Conventional type\n1.2 HVLP (Hi volume low pressure) type\n According to construction\n1.3 Gravity fed type\n1.4\nSuction type\n2. Protective clothing\nand equipment\nPersonal Protective clothing and safety devices may include:\n2.1\nGloves -cotton and solvent resistant\n2.1\nSafety shoes or boots\n2.2\nDust mask, gas mask or respirator, particle mask\n2.4\nShop uniform\n2.3\nApron\n2.4\nSeparate clothing for actual painting application\n2.5\nEye spectacles or goggles\n3. Factors in paint\napplication\nFactors in paint application/handling techniques\n3.1\nDistance, normally 100-200 mm\n3.2\nAngle – Spray gun perpendicular to the panel 90 degrees\n3.3\nSpeed – normally 800-1000 mm/sec.\n3.4\nSpray pattern overlap\n4. Paint mixture\nPaint mixture includes substance such as:\n4.1\nPaint\n4.1\nThinner\n4.2\nHardener\n4.3\nAdditives\n5. Solid color paint\nTypes of solid color paint are:\n5.1\nSingle stage or direct gloss\n5.2\nTwo stage base over clear\n\n--- PDF PAGE 44 ---\nTR-Automotive Body Painting/Finishing NC I\n- 40 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned the work area before and after use.\n1.2\nCleaned and degreased panel or vehicle to be repainted\n1.3\nPrepared paint mixture and spray gun\n1.4\nApplied solid color paint by spraying\n1.5\nUsed tack cloth to wipe off remaining particles\n1.6\nAvoided touching surfaces after degreasing and after wiping of\ntack cloth\n1.7\nDisposed off left over paint as per company standard operating\nprocedure.\n1.8\nCleaned the spray gun before and after use\n2. Underpinning\nknowledge and\nattitudes\n2.1\nNecessary cleaning and degreasing agents\n2.2\nRelevant technical information\n2.3\nWorkplace safety procedures\n2.4\nVehicle safety requirements\n2.5\nEquipment safety requirements\n2.6\nProcedure in spraying solid color paint\n2.7\nPersonal safety requirements\n2.8\nColor mixing and matching\n2.9\nMasking Procedures\n2.10 Polishing procedures\n2.11 Procedure in removing detachable auto body parts and\naccessories\n2.12 Honesty, Sense of Quality in Work, Patience, Thoroughness,\nDedication to Work and Trainable to New Procedures.\n3. Underpinning skills\n3.1\nAccessing, interpreting and applying technical information\n3.2\nUse of relevant tools and equipment\n3.3\nClean bare metal, plastic and fiberglass surfaces\n3.4\nPreparing surfaces for application of primers\n3.5\nCommunication skills specifically in dealing with customers,\nsuperior or peers\n3.6\nReading and writing\n3.7\nComputation skills for volume, area, length, ratio and proportion\n3.8\nPreparing paint mixtures\n3.9\nDisposal of wastes and other residue materials\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDemonstration with Questioning\n5.2\nWritten examination\n5.3\nPortfolio\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 45 ---\nTR-Automotive Body Painting/Finishing NC I\n- 41 -\nUNIT OF COMPETENCY :\nPERFORM POLISHING\n\nUNIT CODE\n:\nALT714304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competency in performing polishing for\nautomotive body painting. It also involves skills in applying masking\nmaterials and handling of polishing equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess painted\nsurface\n\n1.1\nAdequate lighting system is used in assessing painted surface\n1.2\nAppropriate repair procedure is accurately determined\n1.3\nAppropriate polishing procedure are selected as per selected\nrepair procedure\n2. Prepare surface for\npolishing\n\n2.1\nWorkplace is properly cleaned as per polishing compound\nmanufacturer specification\n2.2\nMasking materials are applied on necessary areas as per\nappropriate masking procedure\n2.3\nPanel/surface to polished is positioned as per company\npolishing requirements\n3. Polish painted\nsurface\n\n3.1\nManual hand polishing is applied on surface as per job\nrequirements\n3.2\nSanding is applied on surface as per job requirements\n3.3\nHandling of polishing equipment, tools and materials is done\nas per procedures\n3.4\nPolishing is performed as per procedure\n3.5\nPolishing compound are applied as per polishing compound\nmanufacturer standard\n3.6\nNo over-polish or thin paint results\n4. Clean the polished\nsurface\n4.1\nAdequate tap water for washing and cleaning is used\n4.2\nSoft fine cloth or flannel cloth is used for wiping.\n4.3\nSurface is wiped-dried and cleaned\n5. Install body\naccessories\n\n5.1\nSafety requirements are observed in installing automotive body\nparts and accessories\n5.2\nAll body accessories are installed and are free from dirt\n5.3\nFinal polished area is assessed before and after installation of\nbody parts and accessories.\n\n--- PDF PAGE 46 ---\nTR-Automotive Body Painting/Finishing NC I\n- 42 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Lighting system\n\nLighting sources include illumination of\n1.1 800-1000 lux\n1.2 Natural sunlight\n2. Repair procedure\n\nDifferent types of repair procedures include:\n1.3 Sanding and repainting\n1.4 A) Sanding\nB) Coarse Polishing\nC) Fine Polishing\n1.5 A) Coarse Polishing\nB) Fine Polishing\n2.4 Fine Polishing\n3. Polishing pads\n\nPolishing pads include:\n3.1 Wool\n3.2 Foam\n4. Polishing\ncompounds\n\nPolishing compounds can be liquid or paste and include:\n4.1 Fine\n4.2 Medium\n4.3 Coarse\n5. Masking materials\n\nMasking materials may include but not limited to;\n5.1 Masking paper/plastics\n5.2 Masking tapes for auto use\n5.3 Mouldings tapes\n5.4 Fine line tapes\n5.5 Spray-type masking\n6. Masking\nprocedures\n\nMasking procedures may include the following:\n6.1 Reverse masking\n6.2 Masking non-removable parts\n6.3 Masking curved or complex areas or surfaces\n6.4 Masking for block painting\n6.5 Masking for spot repairs\n7. Handling of polisher\nHandling of polisher must consider the following:\n7.1 Angle of polishing\n7.2 Direction of rotation\n7.3 Strokes in polishing\n\n--- PDF PAGE 47 ---\nTR-Automotive Body Painting/Finishing NC I\n- 43 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nAssessed painted surface\n1.2\nPrepared surface for polishing\n1.3\nPolished painted surface\n1.4\nCleaned the polished surface\n1.5\nInstalled body accessories\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nTypes of polishing compounds\n2.2\nProcedure in using polisher\n2.3\nProcedure in polishing\n2.4\nProcedure in masking\n2.5\nTypes of masking materials\n2.6\nTypes of lighting sources\n2.7\nKinds of Paint Repair procedures\n2.8\nProcedure in cleaning polished surface\n2.9\nProcedure in removing and installing automotive body parts and\naccessories\n2.10 Kinds of polishing defects\n2.11 Patience, Honesty, Sense of Quality in Work, Thoroughness,\nDedication to Work, Attentive to details\n3. Underpinning skills\n3.1\nPerforming polishing\n3.2\nApplying different masking materials and techniques\n3.3\nCleaning the polished surface.\n3.4\nInstalling body parts and accessories\n3.5\n Using and Handling Polishing equipment and tools facilities\n3.6\nUsing Polishing materials\n3.6\nCommunication skills in dealing with customers, superiors and\npeers\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1\nMaterials relevant to the activity\n4.2\nAppropriate tools, supplies and materials\n4.3\nReal or simulated workplace\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1\nObservation in the workplace with questioning\n5.2\nDemonstration with questioning\n5.3\nPortfolio assessment\n5.4\nWritten examination\n6. Context of\nassessment\n6.1\nCompetency must be assessed in a safe working environment\n6.2\nAssessment must be undertaken in accordance with the\napproved industry OH & S regulations\n\n--- PDF PAGE 48 ---\nTR-Automotive Body Painting/Finishing NC I\n- 44 -"
