        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nIdentified appropriate sealant/adhesives\n1.2\nPrepared surface for sealant/adhesive\n1.3\nApplied sealant/adhesive\n1.4\nStored unused or dispose of used sealant/adhesive\n2. Underpinning\nknowledge\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.2\nProcedures in sealant/adhesive application\n2.3\nProcedures in interpreting manuals\n3. Underpinning skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3\nSanding the surface\n3.4 Use of tools, equipment\n3.5\nMixing of body filler and epoxy base and hardener\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3\nReal or simulated workplace\n5. Method of\nassessment\n\nCompetency MUST be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n•Application of adhesive/sealant\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment may be done in a workplace or simulated\nenvironment\n\n--- PDF PAGE 21 ---\nTR-Automotive Body Painting/Finishing NC I\n- 17 -\nUNIT OF COMPETENCY :\nMOVE AND POSITION VEHICLE\n\nUNIT CODE\n:"
        },
        "source_text": "ALT723201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required in the selection, use and\napplication of sealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nsealant/adhesive\n\n1.1\nSealant/adhesive selected in line with job requirements and\nmanufacturer’s specification\n1.1\nSealant/adhesive checking is performed to ensure that\nproduct is fit for use.\n2. Prepare surface for\nsealant/adhesive\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other foreign\nmatters to ensure maximum adhesion or seal.\n3. Apply\nsealant/adhesive\n evenly\n3.1\nSealant/adhesive is applied evenly on the surface in line with\nmanufacturer’s specification\n3.2\nExcess sealant/adhesive is removed by sanding or scrapping\n3.3\nTools and equipment used to apply sealant/adhesive are\nappropriate to job requirements\n3.1\nSafety are observed and PPE are worn in accordance with\nindustry SOP\n3.2\nHazards associated with the use of sealant and adhesives are\nidentified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed procedure\n4.2\nWaste are disposed as per workshop SOP\n\n--- PDF PAGE 19 ---\nTR-Automotive Body Painting/Finishing NC I\n- 15 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1\nForm in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3\nHametite\n1.4\nSilicon Body sealer\n1.5\nPrestite for Auto and Auto Aircon\n2. Tools and equipment\nTools and equipment include:\n2.1 Putty knife\n2.2 Scraper\n2.3 Compressor\n2.4 Steel brush\n2.5 Paint brush\n2.6 Rubber hammer\n2.7 Hand tools\nPersonal protective equipment include:\n2.8 Gloves\n2.9 Apron\n2.10 Safety shoes\n2.11 Goggles\n2.12 Gas mask\n3. Safety\nSafety includes:\n3.1 Ventilation\n3.2 Handling of Flammable/Irritating substances\n3.3\nUse of Personal Protective Equipment\n4. Hazards\n Hazard includes:\n4.1 Fumes\n4.2 Skin irritation\n4.3\nBurns\n5. Adhesive/Sealant\nchecking\n\nAdhesive/Sealant checking includes:\n5.1 Expiry date\n5.2 Free of contamination\n5.1 Cap/Covers\n5.2 Tightly closed\n5.3\nConcentration\n\n--- PDF PAGE 20 ---\nTR-Automotive Body Painting/Finishing NC I\n- 16 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nIdentified appropriate sealant/adhesives\n1.2\nPrepared surface for sealant/adhesive\n1.3\nApplied sealant/adhesive\n1.4\nStored unused or dispose of used sealant/adhesive\n2. Underpinning\nknowledge\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.2\nProcedures in sealant/adhesive application\n2.3\nProcedures in interpreting manuals\n3. Underpinning skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3\nSanding the surface\n3.4 Use of tools, equipment\n3.5\nMixing of body filler and epoxy base and hardener\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3\nReal or simulated workplace\n5. Method of\nassessment\n\nCompetency MUST be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n•Application of adhesive/sealant\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment may be done in a workplace or simulated\nenvironment\n\n--- PDF PAGE 21 ---\nTR-Automotive Body Painting/Finishing NC I\n- 17 -\nUNIT OF COMPETENCY :\nMOVE AND POSITION VEHICLE\n\nUNIT CODE\n:"
      }
