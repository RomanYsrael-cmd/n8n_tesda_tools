  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for Automotive Body Painting/Finishing NCI.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE BODY PAINTING/ FINISHING\nNC Level NC I\n\nNominal Training Duration: 120 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of automotive body paint refinishing in accordance with industry standards. It\ncovers specialized competencies such as: prepare undamaged surface for painting, apply\nand remove masking, spray solid color paints, and perform polishing.\n\nBASIC COMPETENCIES\n(28 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary speaking and\nmessages in a workplace.\n1.2 Follow routinary speaking and\nmessage\n1.3 Perform work duties following\nwritten notices.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective workplace\nrelationship.\n2.2 Contribute to work group\nactivities.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct in\nthe workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove unnecessary\nitems\n4.2 Arrange items\n4.3 Maintain work areas, tools and\nequipment\n4.4 Follow standardize work process\nand procedures\n4.5\nPerform work spontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 49 ---\nTR-Automotive Body Painting/Finishing NC I\n- 45 -\nCOMMON COMPETENCIES\n(32 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nappropriate\nsealant/\nadhesive\n1.1 Identify appropriate sealant/\nadhesive\n1.2 Prepare surface for sealant /\nadhesive application\n1.3 Store unused and dispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n2. Move and\nposition vehicle\n2.3 Prepare vehicle for driving\n2.4 Move and position vehicle\n2.5 Check the vehicle\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n3. Perform\nmensuration\nand calculation\n3.5 Select measuring instrument\nand carry out measurement and\ncalculations\n3.6 Maintain measuring instruments\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n• Interview\n4. Read, interpret\nand apply\nspecifications\nand manual\n3.1 Identify/access manuals and\ninterpret data and specification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n5. Use and apply\nlubricants/\ncoolants\n5.1 Identify type of lubricants/\ncoolants\n5.2 Use and apply lubricants\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n6. Perform shop\nmaintenance\n6.1 Inspect/clean tools and work\narea\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose waste/used lubricants\n6.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n• Interview\n\n--- PDF PAGE 50 ---\nTR-Automotive Body Painting/Finishing NC I\n- 46 -\nCORE COMPETENCIES\n(60 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nundamaged\nsurface for\npainting\n1.1 Remove body accessories\n1.2 Sand surface to be painted\n1.3 Identify kinds of primers and\ntheir applications\n1.4 Apply epoxy primers to metal\nsurface\n1.5 Apply primer surfacer for\ncoating\n1.6 Apply sealant when replacing\nwith new panel\n1.7\nObserve safety and cleanliness\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n2. Apply and\nremove\nmasking\n2.1 Remove detachable parts for\npanel to be painted\n2.2 Clean and degrease panel for\nmasking\n2.3 Identify masking materials and\ntheir applications\n2.4 Identify techniques in masking\n2.5 Apply Masking materials\n2.6 Remove masking materials\n2.7\nObserve safety and cleanliness\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n3. Spray solid\ncolor paint\n3.1 Clean and degrease\npanel/vehicle to be repainted\n3.2 Identify substances of paint\nmixture\n3.3 Identify types of solid color\npaints\n3.4 Identify types of spray gun and\ntheir application\n3.5 Prepare paint mixture and spray\ngun\n3.6 Explain factors to be considered\nin paint application\n3.7 Apply solid color paint by\nspraying\n3.8 Clean the spray gun\n3.9\nObserve safety and cleanliness\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n4. Perform\npolishing\n4.1\nAssess painted surface\n4.2\nPrepare surface for polishing\n4.3\nPolish painted surface\n4.4\nClean the polished surface\n4.5\nInstall body accessories\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n•Interview\n\n--- PDF PAGE 51 ---\nTR-Automotive Body Painting/Finishing NC I\n- 47 -\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum\nmodules;\n•\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Practical application System (DTS) Implementing Rules and\nRegulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n\n--- PDF PAGE 52 ---\nTR-Automotive Body Painting/Finishing NC I\n- 48 -\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n•\ncan communicate both oral and written;\n•\nwith good moral character; and\n•\ncan perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nAUTOMOTIVE BODY PAINTING/FINISHING – NC I\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nAutomotive Body Painting/ Finishing – NC I\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n6 pairs\n• Putty knife\n1 unit\n• Sander (single\naction) w/ vacuum\npump\n25 pcs.\n• Sandpaper\n#120\n4 pcs.\n• Scraper\n25 pcs.\n• Sandpaper\n#360\n2 pcs.\n• Spatula\n1 unit\n• Sander (dual\naction) or orbital\nsander\n25 pcs.\n• Sandpaper\n#600\n2 sets\n• Screw driver\n25 pcs.\n• Sandpaper\n#1,200\n2 sets\n• Wrench\n(socket)\n1 unit\n• Air compressor\n25 ltrs.\n•Paint remover\n5 ltrs.\n•Degreaser\n2 sets\n• Wrench\n(combination)\n1 unit\n• Spray gun\n(complete\naccessories)\n10 ltrs.\n• Thinner\n5 ltrs.\n•Epoxy reducer\n1 pc.\n•Impact wrench\n10 ltrs.\n•Surfacer\n2 sets\n• Mechanic’s\nhammer\n10 ltrs.\n•Sealant\n5 ltrs.\n•Flo / Retarder\n25 pcs.\n• Goggle\n\n10 sets\n• Masking\nmaterials\n25 pairs\n• Gloves\n\n10 ltrs.\n• Wash primer\n25 pcs.\n•Dust mask\n\n10 ltrs.\n•Epoxy primer\n2 pcs.\n• Gas mask\n\n10 ltrs.\n• Urethane\nprimer\n25 pairs\n• Safety shoes\n\n10 ltrs.\n• Acrylic primer\n25 pcs.\n• Shop uniform\n\n1 liter\n• Penetrating oil\n2 sets\n•S.S.T.\n\n5 ltrs.\n•Color paint\n\n5 ltrs.\n•Top coat clear\n\n2 kgs.\n•Rags\n\n--- PDF PAGE 53 ---\nTR-Automotive Body Painting/Finishing NC I\n- 49 -\n3.5 TRAINING FACILITIES\nAUTOMOTIVE BODY PAINTING/FINISHING – NC I\n\nThe workshop must be made of reinforced concrete or steel structure. The size must be\nsuited on the requirements of the competencies. The facility should accommodate a minimum\nof 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop Component Areas\n• Laboratory/Workshop\nArea\n-\n-\n100.00\n•\nLecture Room\n5.00 x 5.00\n25.00\n25.00\n• Tool, Supply & Storage\nRoom\n3.00 X 3.00\n9.00\n9.00\n• Learning Resource\nCenter\n2.00 x 5.00\n10.00\n10.00\n• Wash Room and Toilet\n2.00 X 5.00\n10.00\n10.00\nTotal (Workshop Component)\n154.00\n•\nCirculation Area (30% of Workshop Component Space)\n40.00\nGrand Total (Building Space)\n194.00\nNote: The entries in the size in meters column are recommendations only. The grand total\n(building space) is the minimum space requirement for registration.\n\n3.6 TRAINERS’ QUALIFICATION\nAUTOMOTIVE/LAND TRANSPORT SECTOR\n\nAUTOMOTIVE BODY PAINTING/FINISHING – NC I\nTRAINER QUALIFICATION (TQ I)\n• Must be a holder of Automotive Body Painting/ Finishing NC II or equivalent qualification\n• Must have undergone training on Training Methodology I (TM I) or equivalent in\ntraining/experience\n• Must be computer literate\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position) or holder of appropriate\nprofessional license issued by the Professional Regulatory Commission\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 54 ---\nTR-Automotive Body Painting/Finishing NC I\n- 50 -"
