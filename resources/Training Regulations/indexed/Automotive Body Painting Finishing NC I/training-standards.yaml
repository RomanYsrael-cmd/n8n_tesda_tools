    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE BODY PAINTING/ FINISHING\nNC Level NC I\n\nNominal Training Duration: 120 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of automotive body paint refinishing in accordance with industry standards. It\ncovers specialized competencies such as: prepare undamaged surface for painting, apply\nand remove masking, spray solid color paints, and perform polishing.\n\nBASIC COMPETENCIES\n(28 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary speaking and\nmessages in a workplace.\n1.2 Follow routinary speaking and\nmessage\n1.3 Perform work duties following\nwritten notices.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective workplace\nrelationship.\n2.2 Contribute to work group\nactivities.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct in\nthe workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove unnecessary\nitems\n4.2 Arrange items\n4.3 Maintain work areas, tools and\nequipment\n4.4 Follow standardize work process\nand procedures\n4.5\nPerform work spontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 49 ---\nTR-Automotive Body Painting/Finishing NC I\n- 45 -\nCOMMON COMPETENCIES\n(32 Hours)\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nappropriate\nsealant/\nadhesive\n1.1 Identify appropriate sealant/\nadhesive\n1.2 Prepare surface for sealant /\nadhesive application\n1.3 Store unused and dispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n2. Move and\nposition vehicle\n2.3 Prepare vehicle for driving\n2.4 Move and position vehicle\n2.5 Check the vehicle\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n3. Perform\nmensuration\nand calculation\n3.5 Select measuring instrument\nand carry out measurement and\ncalculations\n3.6 Maintain measuring instruments\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n• Interview\n4. Read, interpret\nand apply\nspecifications\nand manual\n3.1 Identify/access manuals and\ninterpret data and specification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n5. Use and apply\nlubricants/\ncoolants\n5.1 Identify type of lubricants/\ncoolants\n5.2 Use and apply lubricants\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n6. Perform shop\nmaintenance\n6.1 Inspect/clean tools and work\narea\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose waste/used lubricants\n6.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n• Interview\n\n--- PDF PAGE 50 ---\nTR-Automotive Body Painting/Finishing NC I\n- 46 -\nCORE COMPETENCIES\n(60 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nundamaged\nsurface for\npainting\n1.1 Remove body accessories\n1.2 Sand surface to be painted\n1.3 Identify kinds of primers and\ntheir applications\n1.4 Apply epoxy primers to metal\nsurface\n1.5 Apply primer surfacer for\ncoating\n1.6 Apply sealant when replacing\nwith new panel\n1.7\nObserve safety and cleanliness\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n2. Apply and\nremove\nmasking\n2.1 Remove detachable parts for\npanel to be painted\n2.2 Clean and degrease panel for\nmasking\n2.3 Identify masking materials and\ntheir applications\n2.4 Identify techniques in masking\n2.5 Apply Masking materials\n2.6 Remove masking materials\n2.7\nObserve safety and cleanliness\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n3. Spray solid\ncolor paint\n3.1 Clean and degrease\npanel/vehicle to be repainted\n3.2 Identify substances of paint\nmixture\n3.3 Identify types of solid color\npaints\n3.4 Identify types of spray gun and\ntheir application\n3.5 Prepare paint mixture and spray\ngun\n3.6 Explain factors to be considered\nin paint application\n3.7 Apply solid color paint by\nspraying\n3.8 Clean the spray gun\n3.9\nObserve safety and cleanliness\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n• Interview\n4. Perform\npolishing\n4.1\nAssess painted surface\n4.2\nPrepare surface for polishing\n4.3\nPolish painted surface\n4.4\nClean the polished surface\n4.5\nInstall body accessories\n• Discussion\n• Demonstration\n• Practical\napplication\n\n• Demonstration\nof practical\nskills\n• Written\nexamination\n•Interview\n\n--- PDF PAGE 51 ---\nTR-Automotive Body Painting/Finishing NC I\n- 47 -"
  },
