      "term": "The foundation paint layer of the basecoat / clearcoat automotive",
      "definition": "finish. Specifically the layer of densely pigmented paint (color) applied over the primer coat. 2. D.A. Polisher/ Sander Dual Action rotates with a double elliptical movement 3. Degreasing The removal from the substrate of contaminants which would otherwise give rise to surface defects and performance failures. e.g. poor adhesion 4. Drying The process of change of a coating from the liquid to the solid state by evaporation of solvent, chemical reaction of the binding medium, or a combination of these processes. When drying takes place during exposure to air at normal temperatures, it is called 'air-drying'; if it can be accelerated by the application of a moderate degree of heat it is called 'Force-drying' (or Low-bake), as distinct from High-bake. Alternate Term(s): Binder, Air-drying, Force-drying, Stoving, Low- bake, High-bake 5. Fish Eye Complications which occur during repainting when paint is repelled from a spot due to the presence of grease, oil or silicone on the paint surface 6. Flash-off Time Dwell time for solvent to evaporate from the paint surface 7. Masking Temporary covering of areas not to be painted 8. Metallic Paint A type of automotive finish which contains metallic flakes that produce a glittery appearance A term used for finishes incorporating fine metallic particles, usually aluminum, in the paint. 9. Mica A naturally occurring mineral, based on silica, which after treatment, is used as an effect pigment in coatings. Their special property is that light falling on a mica particle, depending on the angle of illumination, reflects the light with a change in colour. Because of this they are sometimes referred to as pearls."
