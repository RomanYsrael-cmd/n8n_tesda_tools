      "definition": "10. Mottling Paint color appears streaked, with light and dark areas. Cause, heavier film thickness in some areas that in others. Excessive wetting of some areas when painted. Uneven disbursement of the metallic in the paint. 11. Orange Peel The nubby rough appearance of paint; looks much like the texture of an orange skin, surface lacks clarity or reflected image. Caused by paint applied too dry, resulting in poor flow-out. 12. Overspray Substance such as paint mist that settles out of the air onto automobile surface appearing as tiny specks. 13. Paint Film Thickness Measure of the amount of paint on the vehicle. Also known as film builds, and is measured in millimeters or thousandths of an inch. 14. Polishing Term is often used to describe the action of using a machine to buffer wheel a vehicle. - 53 - 15. Primers Material applied to the surface to seal, fill scratches and improve adhesion of paint. 16. Putty"
