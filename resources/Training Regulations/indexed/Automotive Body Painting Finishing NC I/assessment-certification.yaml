  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Automotive Body Painting/Finishing NC I, the\ncandidate must demonstrate competence in all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n4.2\nIndividual aspiring to be awarded the qualification of Automotive Body Painting/Finishing\nNC I must acquire Certificate of Competency in all the following core units of the\nqualification. Candidates may apply for assessment in any accredited assessment center.\n\nAPPLY SOLID COLOR PAINT\n4.2.1 Prepare Undamaged Surface for Painting\n4.2.2 Apply and Remove Masking\n4.2.3 Spray Solid Color Paints\n4.2.4 Perform Polishing\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COC acquired for the relevant units of competency\ncomprising a qualification, an individual shall be issued the corresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units shall\nbe integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures\nManual on Assessment and Certification” and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTOQCS)”.\n\n--- PDF PAGE 55 ---\nTR-Automotive Body Painting/Finishing NC I\n- 51 -\n"
}
