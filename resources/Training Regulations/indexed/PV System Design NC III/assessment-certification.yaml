  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of PV System Design NC III, the candidate\nmust demonstrate in all the units listed in Section 1. Successful candidates\nshall be awarded a National Certificate III signed by the TESDA Director\nGeneral.\n4.2\nThe qualification of PV Systems Design NC III may be attained through\ndemonstration of competence through a single comprehensive project-type\nassessment covering all required units of competency of the qualification.\n\n4.2.1. Prepare PV System Design\n• Determine Customer Requirements\n• Calculate System Component Requirements (System Sizing)\n• Specify Components in Bill of Materials\n• Prepare Installation Drawing\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.4.2.\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 56\n\nLead workplace\ncommunication\nWork with\nothers\nWork in team\nenvironment\nLead small\nteams\nSolve problems\nrelated to work\nReceive and\nrespond to\nworkplace\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\ntools\nObserve\nprocedures,\nspecifications\nInterpret\ntechnical\ndrawings and\nPerform\nmensuration\nand calculations\nMaintain tools\nand equipment\nCORE\n COMPETENCIES\nPerform Site\nAssessment\nCheck PV\nComponents\n/Materials\nCompliance\nSpecify\nComponents\nin Bill of\nMaterials\nInstall PV\nsystem\n\nPerform PV\nSystem Testing\nand\nCommissioning\nDetermine\nCustomer\nRequirements\n\nDesign\nCustomer\nRequirements\nCalculate\nSystem\nComponent\nRequirements\nPerform PV\nSystem\nDiagnosis\nPrepare\nInstallation\nDrawings\n\nApply problem\nsolving\ntechniques to\nPlan and organize\nk\nRepair of PV\nSystem\nMonitor PV\nSystem\nOperation\nPractice career\nprofessionalism\nDemonstrate\nwork values\nPractice occupational\nhealth and safety\nprocedures\nDevelop and\npractice\nnegotiation skills\nUse\nmathematical\nmethod\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nkill\nDevelop team and\nindividual\nCollect, analyze\nand organize\ninformation\nPromote\nenvironmental\nPractice basic\nhousekeeping\n\n"
