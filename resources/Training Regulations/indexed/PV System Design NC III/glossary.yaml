      "definition": "33. National Certificate (NC) – is a certification issued to individuals who achieve all the required units of competency for a national qualification defined under the Training Regulations. NCs are aligned to specific levels within the PTQF 34. Performance Criteria - are evaluative statements that specify what is to be assessed and the required level of performance 35. Qualification - is a cluster of units of competencies that meet job roles and are significant in the workplace. It is also a certification awarded to a person on successful completion of a course in recognition of having demonstrated competencies in an industry sector 36. Range of Variables - describes the circumstances or context in which the work is to be performed 37. Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s skills, knowledge and attitudes gained from life and work experiences outside registered training programs 38. Resource implications - refers to the resources needed for the successful performance of the work activity described in the unit of competency. It includes work environment and conditions, materials, tools and equipment 39. Basic Competencies - are the skills and knowledge that everyone needs for work 40. Training Regulations (TR) – refers to the document promulgated and issued by TESDA consisting of competency standards, national qualifications and training guidelines for specific sectors/occupations. The TR serve as basis for establishment of qualification and certification under the PTQF. It also serves as guide for development of competency-based curricula and instructional materials including registration of TVET programs offered by TVET providers 41. Underpinning knowledge and attitude- refers to the competency that involves in applying knowledge to perform work activities. It includes specific knowledge that is essential to the performance of the competency 42. Underpinning skills - refers to the list of the skills needed to achieve the elements and performance criteria in the unit of competency. It includes generic and industry specific skills 43. Depth of Discharge (DoD) - is a an alternate method to indicate a battery's State of charge (SOC). The DOD is the inverse of SOC: as one increases, the other decreases. While the SOC units are percent points (0% = empty; 100% = full), the units for DOD can be Ah (e.g.: 0 = full, 50 Ah = empty) or percent points (100% = empty; 0% = full) 44. Solar insolation - is a measure of solar radiation energy received on a given surface area in a given time. It is commonly expressed as average irradiance in watts per square meter (W/m²) or kilowatt-hours per square meter per day (kW·h/(m²·day))."
