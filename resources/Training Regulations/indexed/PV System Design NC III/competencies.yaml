        "source_title": "SPECIFY COMPONENTS IN BILL OF MATERIALS",
        "source_text": "--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV SYSTEM DESIGN NC III \n \n \n \n                                         Page 42  \n \n \n       \n \n \n \n \n \n \nUNIT OF COMPETENCY : \nSPECIFY COMPONENTS IN BILL OF MATERIALS \n \nUNIT CODE  \n \n: \nCON311303 \n \nUNIT DESCRIPTOR  \n: \nThis unit covers the skills, knowledge, and attitude in  \nspecifying components in the bill of materials for simple  \nsolar home systems up to 1kWp. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Select components \n1.1 PV system components are select based on the \nsystem sizing requirements. \n1.2 Components are select based on existing safety and \nquality standards. \n2. Prepare bill of materials \n2.1 Quantities are determined based on the system sizing \nrequirements. \n2.2 Bill of materials is prepared based on a prescribed \nformat.\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV SYSTEM DESIGN NC III \n \n \n \n                                         Page 43  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. PV Systems \nComponents \n \n \n \n \n \n \n1.1 Photovoltaic module \n1.2 Support structures \n1.3 Battery/battery banks \n1.4 Charge controller/regulator \n1.5 Inverter \n1.6 Loads \n1.7 Metal structures \n1.8  Wire/cables \n1.9 Lighting accessories/fixtures \n2. Safety and Quality  \nStandards \n \n \n2.1 PV Gap \n2.2 IEC certification \n2.3 Philippine Electrical Code \n2.4 Philippine National Standards for Battery \n3. Prescribed format \nPrescribed format may include data such as: \n3.1 Type of materials and specification \n3.2 Quantity of materials to be used \n3.3 Estimated cost\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV SYSTEM DESIGN NC III \n \n \n \n                                         Page 44  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared the bill of materials for the designed \nPhotovoltaic system. \n1.2 Specified the bill of materials for the designed \nPhotovoltaic system. \n2. Underpinning knowledge \nand attitude \n2.1 Photovoltaic technology \n2.2 Available commercial sizes \n2.3 System design \n2.4 Availability of components \n2.5 Safety standards \n2.6 Quality standards \n2.7 Patient \n2.8 Honest \n2.9 Observant \n2.10 Active \n2.11 Sort, Straighten, Shine, Systemize and Sustain  (5S) \n3 Underpinning skills \n3.1 Mathematical skills \n3.2 Data Analysis skills \n3.3 Research skills \n3.4 Computation skills \n3.5 Sorting skills \n4 Resource implications \nThe following resources must be provided: \n4.1 Components Specification \n4.2 Philippine Electrical Code \n4.3 Forms \n4.4 Job Order \n4.5 Internet \n4.6 Computer/Calculator \n5 Method of assessment \nCompetency must be assessed through: \n5.1 Demonstration with Questioning  \n5.2 Observation with questioning  \n5.3 Written Exam \n5.4 Third party assessment \n5.5 Portfolio \n6 Context of assessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace \n6.2 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n",
