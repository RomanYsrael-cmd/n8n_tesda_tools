essed current and future electrical needs of customer\n1.2 Recommended options for simple solar home system\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Photovoltaic technology and systems\n2.2 Principles of electricity (Ohm’s Law, AC/DC systems)\n2.3 Electrical loads characteristics (wattage, current, voltage)\n2.4 Basic mathematical operations\n2.5 Patient\n2.6 Observant/attentive to details\n2.7 Honest\n3.\nUnderpinning skills\n3.1 Communication skills\n3.2 Using basic electrical measuring instruments\n3.3 Interpersonal skills\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Data gathering forms\n4.2 Electrical measuring instruments\n4.3 Pen and paper\n4.4 Calculator\n4.5 Compass\n\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Observation and demonstration with questioning\n5.2 Demonstration with questioning\n5.3 Written/oral examination\n5.4 Portfolio\n5.5 Third party report\n\n6.\nContext of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency\nassessment\nmust\nbe\nundertaken\nin\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 39\n\nUNIT OF COMPETENCY :\nCALCULATE SYSTEM COMPONENTS\nREQUIREMENTS (SYSTEM SIZING)\n\nUNIT CODE\n\n:\nCON311302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes in\ncalculating components of simple solar home systems\nup to 1 kWp.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Calculate energy demand\n1.1 Load demand is listed in a tabulated form based on\ncostumer requirements.\n\n1.2 Energy demand is summed up for each load.\n2. Determine battery capacity\n2.1 Maximum Depth of Discharge is determined based on\nmanufacturer’s specification\n\n2.2 Battery capacity is calculated based on the days of\nautonomy and daily load demand\n3. Calculate array size\n\n3.1 Minimum solar insolation is determined from data by\nthe weather bureau.\n\n3.2 Array size is calculated in accordance to the insolation\ndata\n\n3.3 Array size, including the mounting structure, is\nadjusted based on the environmental factors\n4. Determine peak AC load\nand inverter size (if\napplicable)\n4.1 Peak AC load demand is determined based on\ncostumer’s requirements.\n\n4.2 Inverter size is calculated based on the manufacturers’\nspecifications.\n5. Calculate the size of the\ncharge controller/regulator\n5.1 Size of the charge controller/regulator is determined\nbased on the calculated array size.\n\n5.2 Task is done according to standard calculations,\nincluding system losses, wiring, and site assessment\ndata.\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 40\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Load\nLoad may include:\n1.1. Lights\n1.2. TV/ radio\n1.3. Electric fans\n1.4. Electric tools (small electrical hand tools)\n2. Calculations\n\n2.1 Module heating\n2.2 Wire voltage drop\n2.3 Dirt accumulation\n2.4 Array degradation\n2.5 Inverter efficiency\n2.6 Battery efficiency\n2.7 Charge controller/regulator efficiency\n2.8 Battery-module voltage mismatched\n2.9 Grounding protection\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 41\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate calculated\nthe system components requirements (system sizing).\n2. Und