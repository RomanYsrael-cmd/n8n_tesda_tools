        "source_text": "CON311301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitude in\ndetermining customer requirements for simple solar\nhome systems less than 1 kW.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nAssess current and future\nelectrical needs of customer\nand site characteristics\n1.1 Forms for site assessment are accomplished\naccording to company standards.\n1.2 Forms for load assessment are accomplished\naccording to company standards.\n1.3 Interviews are conducted in accordance with company\nprocedures.\n1.4 Assessment is conducted within the prescribed time.\n2.\nRecommend options for\nsimple solar home system\n\n2.1 System recommendation takes into account data\ngathered information\n\n2.2 Recommendation is appropriate to the customer\nrequirement.\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Site\n1.1 Space\n1.2 Shading\n1.3 Geographic condition, i.e., island, mountainous, plain\n2. Company standard\n2.1 Job orders\n2.2 Load computation sheet\n2.3Available components specification\n3. Load\n3.1 Lights\n3.2 TV/ radio\n3.3 Electric fans\n3.4 Electric tools (small electrical hand tools)\n4. System\n4.1 DC only\n4.2 AC/DC\n4.3 AC only\n5. Customer requirement\n5.1 Application\n5.1.1\nLighting\n5.1.2\nEntertainment\n5.1.3\nLivelihood\n5.2 Size\n5.2.1\nSmall (1-2 modules)\n5.2.2\nLess than 1 kW\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 38\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Assessed current and future electrical needs of customer\n1.2 Recommended options for simple solar home system\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Photovoltaic technology and systems\n2.2 Principles of electricity (Ohm’s Law, AC/DC systems)\n2.3 Electrical loads characteristics (wattage, current, voltage)\n2.4 Basic mathematical operations\n2.5 Patient\n2.6 Observant/attentive to details\n2.7 Honest\n3.\nUnderpinning skills\n3.1 Communication skills\n3.2 Using basic electrical measuring instruments\n3.3 Interpersonal skills\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Data gathering forms\n4.2 Electrical measuring instruments\n4.3 Pen and paper\n4.4 Calculator\n4.5 Compass\n\n5.\nMethod of\nassessment\nCompetency must be assessed through:\n5.1 Observation and demonstration with questioning\n5.2 Demonstration with questioning\n5.3 Written/oral examination\n5.4 Portfolio\n5.5 Third party report\n\n6.\nContext of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency\nassessment\nmust\nbe\nundertaken\nin\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 39\n\nUNIT OF COMPETENCY :\nCALCULATE SYSTEM COMPONENTS\nREQUIREMENTS (SYSTEM SIZING)\n\nUNIT CODE\n\n:"
