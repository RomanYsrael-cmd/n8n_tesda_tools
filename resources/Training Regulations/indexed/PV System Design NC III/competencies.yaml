  "source_section_text": "Section 1. Successful candidates\nshall be awarded a National Certificate III signed by the TESDA Director\nGeneral.\n4.2\nThe qualification of PV Systems Design NC III may be attained through\ndemonstration of competence through a single comprehensive project-type\nassessment covering all required units of competency of the qualification.\n\n4.2.1. Prepare PV System Design\n• Determine Customer Requirements\n• Calculate System Component Requirements (System Sizing)\n• Specify Components in Bill of Materials\n• Prepare Installation Drawing\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.4.2.\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 56\n\nLead workplace\ncommunication\nWork with\nothers\nWork in team\nenvironment\nLead small\nteams\nSolve problems\nrelated to work\nReceive and\nrespond to\nworkplace\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\ntools\nObserve\nprocedures,\nspecifications\nInterpret\ntechnical\ndrawings and\nPerform\nmensuration\nand calculations\nMaintain tools\nand equipment\nCORE\n COMPETENCIES\nPerform Site\nAssessment\nCheck PV\nComponents\n/Materials\nCompliance\nSpecify\nComponents\nin Bill of\nMaterials\nInstall PV\nsystem\n\nPerform PV\nSystem Testing\nand\nCommissioning\nDetermine\nCustomer\nRequirements\n\nDesign\nCustomer\nRequirements\nCalculate\nSystem\nComponent\nRequirements\nPerform PV\nSystem\nDiagnosis\nPrepare\nInstallation\nDrawings\n\nApply problem\nsolving\ntechniques to\nPlan and organize\nk\nRepair of PV\nSystem\nMonitor PV\nSystem\nOperation\nPractice career\nprofessionalism\nDemonstrate\nwork values\nPractice occupational\nhealth and safety\nprocedures\nDevelop and\npractice\nnegotiation skills\nUse\nmathematical\nmethod\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nkill\nDevelop team and\nindividual\nCollect, analyze\nand organize\ninformation\nPromote\nenvironmental\nPractice basic\nhousekeeping\n\nCOMPETENCY MAP\n(CONSTRUCTION SECTOR-ELECTRICAL SUB-SECTOR)\nPV SYSTEMS DESIGN NC III\nANNEX A\nPV System Design NC III\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 57\n\nDEFINITION OF TERMS\n\n1.\nPhotovoltaic (PV) – a technology that uses a solar module in order to convert light\nor energy from the sun to electricity\n\n2.\nPV Module – a device composed of solar cells that convert light or energy from the\nsun to electricity.\n\n3.\nPV Panel – a group of PV modules connected in series and/or parallel in a single\nsupport structure\n\n4.\nPV Array – a group of PV modules connected in series and/or parallel in different\nsupport structures\n\n5.\nLoad – are devices such as lighting fixtures, appliances, or the likes that requires\nelectricity\n\n6.\nBattery – a device that stores electricity typically rated in Ampere-hours. For PV\nsystems in the Philippines, car batteries are commonly used.\n\n7.\nController – an electronic device used to cut off charging to the battery when the\nbattery is full and to disconnect the battery from the load when the battery charge is\ngetting low\n\n8.\nDirect current – unidirectional flow of electricity, usually type of power being stored\nin batteries\n\n9.\nAlternating current – current that periodically changes its magnitude and direction,\ncommonly derived directly from the grid-connected power sources\n\n10. Functional Test – test procedures being done on the different PV components\nbased on their rated operating ranges such as controller set-points, battery voltage,\nVoc and Isc of PV modules.\n\n11. Controller Set-points – the maximum and minimum settings that corresponds to the\npredetermined depth of discharge and maximum charge of a battery\n\n12. Maximum depth of discharge – is the state of charge of a battery that will provide\nmaximum life cycles before it needs replacement\n\n13. Commissioning – the process in which a machine or system is put in operation\n\n14. Installation data sheet – record or document of information containing the final\ninstallation lay-out and system specification\n\n15. Power – the delivery of energy typically measured in Watts\n\n16. Energy – actual work done by the electricity, typically measured in Watt-hours\n\n--- PDF PAGE 60 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 58\n\n17. Parallel connection – connecting the positives together and separately to connect\nthe negatives together\n\n18. Series connection – connecting the positives of one source to the negative of\nanother\n\n19. Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n20. Certificate of Competency (COC) – is a certification issued to individuals who pass\nthe assessment for a single unit or cluster of units of competency\n\n21. Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n22. Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n23. Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n24. Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n25. Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n26. Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n27. Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n28. Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n29. Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n30. Evidence Guide - is a component of the unit of competency that defines or identifies\nthe evidences required to determine the competency of the individual. It provides\ninformation\non\nCritical\naspects\nof\ncompetency,\nunderpinning\nknowledge,\nUnderpinning skills, Resource implications, assessment method and context of\nassessment\n\n31. Level - refers to the category of skills and knowledge required to do a job\n\n32. Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 61 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 59\n\n33. National Certificate (NC) – is a certification issued to individuals who achieve all the\nrequired units of competency for a national qualification defined under the Training\nRegulations. NCs are aligned to specific levels within the PTQF\n\n34. Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n35. Qualification - is a cluster of units of competencies that meet job roles and are\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n36. Range of Variables - describes the circumstances or context in which the work is to\nbe performed\n\n37. Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n38. Resource implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n39. Basic Competencies - are the skills and knowledge that everyone needs for work\n\n40. Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serve as basis for establishment\nof qualification and certification under the PTQF. It also serves as guide for\ndevelopment of competency-based curricula and instructional materials including\nregistration of TVET programs offered by TVET providers\n\n41. Underpinning knowledge and attitude- refers to the competency that involves in\napplying knowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n42. Underpinning skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and industry\nspecific skills\n\n43. Depth of Discharge (DoD) - is a an alternate method to indicate a battery's State of\ncharge (SOC). The DOD is the inverse of SOC: as one increases, the other\ndecreases. While the SOC units are percent points (0% = empty; 100% = full), the\nunits for DOD can be Ah (e.g.: 0 = full, 50 Ah = empty) or percent points (100% =\nempty; 0% = full)\n\n44. Solar insolation - is a measure of solar radiation energy received on a given surface\narea in a given time. It is commonly expressed as average irradiance in watts per\nsquare meter (W/m²) or kilowatt-hours per square meter per day (kW·h/(m²·day)).\n\n--- PDF PAGE 62 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 60\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and\nvalidation of this Training Regulations.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nGermilino Abito PhD.\nAteneo de Manila University\nLoyola Heights, Quezon City\nMs. Cirila B. Alvaran\nFormer Technical Coordinator\nWinrock International - SERED\nEngr. Nestor Alcon\nAffiliated Non Conventional Energy Center\nSultan Kudarat State Polytechnic College\nSolano, Sultan Kudarat\nJoselito Angeles PhD\nAffiliated Non Conventional Energy Center\nCentral Luzon State University\nMunoz, Nueva Ecija\nEngr. David P. Balleza\nSenior Renewable Energy Engineer\nHalcrow\nEngr. Domingo Samuel G. Baybay\nTechnical Manager\nWinrock International-AMORE 2 Program\nMr. Joseph Calip\nScience Research Specialist II\nRenewable Energy Management Division\nDepartment of Energy\nMr. Charlie Gay\nFormer 