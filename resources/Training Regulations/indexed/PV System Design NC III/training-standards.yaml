  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: PV System Design\n\nNC Level: NC III\n\nNominal Training Duration:\n148 hours\n\n20 hrs – Basic Competencies\n\n72 hrs – Common Competencies\n\n56 hrs – Core Competencies\n\nCourse Description:\n\nThe course is designed to enhance the knowledge, skills and desirable attitudes of\na PV System Design Technician in accordance with industry standards. It covers core\ncompetencies such as: Determine customer requirement; Calculate PV system\ncomponents (system sizing) of small solar home systems up to 1kWp. It also include\ncompetency to prepare and specify components in Bill of Materials and prepare\nInstallation drawing.\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\nIt also include common competencies such as; Prepare construction materials and\ntools; Perform mensuration and calculation; Maintain tools and equipment; Observe\nprocedures, specifications and manuals of instructions and Interpret technical drawings\nand plans.\n\nBASIC COMPETENCIES\n20 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance expectation\nfor team members.\n\n2.4Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Case studies\n• Demonstration\n• Written exam\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 49\n\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Lecturette\n• Role playing\n• Practical\nexercises\n• Written test\n• Demonstration\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Lecturette\n• Self-pace\n• Group discussion\n• Practical Work\nApproach\n•Research study\n• Written test\n• Demonstration\n• Oral Interview\n6. Use relevant\ntechnologies\n6.1 Study/ select appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Lecturette\n• Self-pace\n• Group discussion\n• Film showing\n• Written test\n• Interview\n\nCOMMON COMPETENCIES\n72 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials and\ntools applicable to a\nspecific construction\njob\n1.2 Request appropriate\nmaterials and tools\n1.3 Receive and inspect\nmaterials\n Lecture-\nDemonstration\n Self-paced\ninstruction\n Group discussion\n Power Point\npresentation\n Oral questioning\n Direct observation\n Written / Oral Test\n\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify, access, and\ninterpret\nspecification/manual\ns.\n2.2 Apply information in\nmanual.\n2.3 Store manuals.\n\n Classroom\ndiscussion\n Lecture\n Self-paced\ninstruction\n Demonstration\n Practical exam\n Oral exam\n Written\ntest/questioning\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 50\n\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\n Demonstration\n Classroom\ndiscussions\n Self-paced\n Practical exam\n Direct observation\n Written\ntest/questioning\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\nInstruments\n4.2 Carry out\nmeasurements and\ncalculations\n Lecture-\nDemonstration\n Self-paced\ninstruction\n Group discussion\n Classroom\ndiscussion\n Actual\ndemonstration\n Direct observation\n Oral questioning\n Written test or\nexamination\n Actual demonstration\n\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and equipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\n Lecture-\nDemonstration\n Self-paced\ninstruction\n Group discussion\n Classroom\ndiscussion\n Direct observation of\napplication of tasks.\n Oral questioning\n Written test or\nexamination\n Practical exam\n\nCORE COMPETENCIES\n56 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Determine\ncustomer\nrequirements\n1.1 Assess current and future\nelectrical needs of\ncustomer and site\ncharacteristics\n1.2 Recommend options\n\n Lecture-\ndemonstration\n Self-paced\ninstruction\n Group discussion\n\n Observation with\nquestioning\n Demonstration\nwith questioning\n Written/oral\nexamination\n2. Calculate\nSystem\nComponents\nRequirements\n(System Sizing)\n2.1 Calculate Energy Demand\n2.2 Determine Battery\nCapacity\n2.3 Calculate Array Size\n2.4 Determine Peak AC load\nand inverter size (if\napplicable)\n2.5 Calculate the minimum\npower specification (size)\nof the controller\n Lecture-\ndemonstration\n Self-paced\ninstruction\n Group discussion\n\n Written exam\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 51\n\n3. Specify\nComponents in\nBill of Materials\n3.1 Select Components\n3.2 Prepare Bill of Materials\n Lecture-\ndemonstration\n Self-paced\ninstruction\n Group discussion\n Written exam\n\n4. Prepare\ninstallation\ndrawing\n4.1 Prepare Electrical Diagram\n4.2 Prepare Mechanical\nDrawing\n Lecture-\ndemonstration\n Self-paced\ninstruction\n Group discussion\n Written exam\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 52\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nonly facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire a specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 53\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nHave undergone training on PV Systems Installation National\nCertificate Level II\n•\nCan communicate both orally and in writing\n•\nMust be physically and mentally fit to undergo training\n•\nAt least 18 yrs old\n\n3.4 LIST OF TOOLS, EQUIPMENT, AND MATERIALS\n\nRecommended list of tools, equipment, and materials for the training of\n\n25 trainees for PV System Design NC III:\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25\nunits\nMagnetic\nCompass\n25 pcs\nCalculator\n5 vol.\nPhilippine\nElectrical Code\n\n25 units\nDrawing table\n25 each\nDrawing\nsupplies and\naccessories\n\n10 units\nComputers with\nappropriate\napplication\nsoftware\n25 each\nDrawing\ninstrument\n\n5 vol.\nReference books\n(weather data)\n25 each\nPen & paper\n\n5\ncatalogs\nManufacturer’s\nspecification and\nmanuals\n\n5 lot\nForms (job\norder, system\nsizing forms, site\nassessment\nforms)\n\n25 each\nSystem sizing\nforms\n\n--- PDF PAGE 56 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 54\n\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nLecture/Demo Area\n6 x 5\n30\n30\nLaboratory Area\n8 x 8\n64\n64\nLearning Resource Area\n3 x 5\n15\n15\nWash, Toilet, & Locker Room\n3 x 5\n15\n15\nCirculation**\n\n33\n Total Area\n\n157\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINER QUALIFICATIONS (TQ)\n\nPV System Design NC III\n•\nMust be a holder of PV System Design NC III\n•\nMust have undergone Training Methodology (TM II) 1\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\nHave at least 2 years job/ industry experience2\n•\nMust be a civil-service eligible or holder of appropriate professional license issued\nby the Professional Regulatory Commission (for government positions only)\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or\nequivalent” upon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional\nassessment\nis\nundertaken\nby\ntrainees\nto\ndetermine\ntheir\n\nachievement of units of competency. A certificate of achievement is issued for\n\neach unit of competency.\n\n--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV SYSTEM DESIGN NC III\n\n Page 55"
