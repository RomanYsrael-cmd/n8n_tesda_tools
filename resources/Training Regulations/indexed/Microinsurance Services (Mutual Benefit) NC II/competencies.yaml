              {
                "number": "4.2",
                "text": "Claims forms’ validity and authenticity are checked based on supporting documents and existing member’s records"
              },
              {
                "number": "4.3",
                "text": "Field validation is conducted based on Insurance Commission requirements"
              },
              {
                "number": "4.4",
                "text": "Approval for recommended actions are secured based on the results of field validation"
              }
            ],
