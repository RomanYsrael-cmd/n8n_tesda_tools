e with\norganization’s guidelines\n3.2 Patience in handling\nchallenging/difficult\ntasks\n3.3 Quality\nconsciousness\n3.4 Safety\nconsciousness\n\n3.1 Computer\nkeyboarding skills\n3.2 Internet\nbrowsing/networking\nskills\n3.3 Skill in English\ngrammar\n3.4 Basic computer\nsoftware and\nhardware\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n46\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nmaintenance/troubles\nhooting skills\n3.5 Analytical skills\n4. Produce\ndata\n4.1 Processed data using\nappropriate\napplications by\nauthorized personnel\n4.2 Data are printed\naccording to standard\noperating procedures\n4.3 Data are analyzed\n4.4 Files and data are\ntransferred according\nto standard operating\nprocedures\n4.5 Files and data are\nsecurely stored\n4.1 Concern for details\nin accordance with\norganization’s guidelines\n4.2 Patience in handling\nchallenging/difficult\ntasks\n4.3 Quality\nconsciousness\n4.4 Safety\nconsciousness\n4.5 Procedure in\nAnalyzing Data\n4.6 Procedure in\nStorage of Files and\ndata\n4.1 Computer\nkeyboarding skills\n4.2 Internet\nbrowsing/networking\nskills\n4.3 Skill in English\ngrammar\n4.4 Basic computer\nsoftware and\nhardware\nmaintenance/troubles\nhooting skills\n4.5 Analytical skills\n5. Use the\ninternet to\naccess\ninformation\n5.1 Required information is\nidentified\n5.2 Appropriate browser\nand search engine are\nused in accordance\nwith the organization’s\nstandards and\nprocedures\n5.3 Relevant links are\nutilized to access\ninformation\n5.1 Concern for details\nin accordance with\norganization’s guidelines\n5.2 Patience in handling\nchallenging/difficult\ntasks\n5.3 Quality\nconsciousness\n5.4 Safety\nconsciousness\n5.5 Using Internet in\naccessing information\n5.6 Intellectual property\nrights\n5.1 Computer\nkeyboarding skills\n5.2 Internet\nbrowsing/networking\nskills\n5.3 Skill in English\ngrammar\n5.4 Basic computer\nsoftware and\nhardware\nmaintenance/troubles\nhooting skills\n5.5 Analytical skills\n6. Maintain\ncomputer\nequipment\nand\nsystems\n6.1 Procedures for system\nsecurity such as virus\ncheck, data back-up,\nand system\ndefragmentation are\nimplemented\n6.2 Appropriate basic\nequipment\nmaintenance\nprocedures and MIS\nrequirements are\nimplemented\n6.1 Concern for details\nin accordance with\norganization’s guidelines\n6.2 Patience in handling\nchallenging/difficult\ntasks\n6.3 Quality\nconsciousness\n6.4 Safety\nconsciousness\n6.5 Using Internet in\naccessing information\n6.6 Intellectual property\nrights\n6.1 Computer\nkeyboarding skills\n6.2 Internet\nbrowsing/networking\nskills\n6.3 Skill in English\ngrammar\n6.4 Basic computer\nsoftware and\nhardware\nmaintenance/troubles\nhooting skills\n6.5 Analytical skills\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n47\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n6.7 Virus information,\ndetection and\nelimination\n6.8 MIS Maintenance\n Requirements\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nPeripheral Devices\nMay include:\n1.1 Computer set-up\n1.2 Network systems\n1.3 Communication equipment\n1.4 Printer and scanner\n1.5 Built-in cameras\n1.6 Multimedia projector\n2. Software\nMay include:\n2.1 Microsoft Office applications\n2.2 Database applications\n2.3 Web browser\n2.4 Client specific software\n3. OSH Guidelines\nMay include:\n3.1 Ergonomic furniture\n3.2 Radiation barrier for monitors\n3.3 Sitting posture\n3.4 Lifting posture\n3.5 Organization’s policies and procedures\n4. Storage Devices\nMay include:\n4.1 Diskettes\n4.2 Zip disks\n4.3 Local and remote hard disk driv