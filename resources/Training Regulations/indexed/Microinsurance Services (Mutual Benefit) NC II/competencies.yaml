ures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Legislation, policy and\nprocedures relating to\nthe conduct of\nevaluations\n\n2.5 Organisational values,\nethics and codes of\nconduct\n2.1 Computing\nbusiness\nmathematics\nand statistics\n2.2 Describing data\nanalysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to\na range of\naudiences\n\n2.4 Stating\nlegislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n2.5 Stating\norganisational\nvalues, ethics\nand codes of\nconduct\n3. Record and\npresent\ninformation\n3.1 Studied\ndata/information are\nrecorded.\n3.2 Recommendations\nare analysed for\naction to ensure they\nare compatible with\nthe project’s scope\nand terms of\nreference.\n3.3 Interim and final\nreports are analysed\nand outcomes are\ncompared to the\ncriteria established at\nthe outset.\n3.4 Findings are\npresented to\nstakeholders.\n\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Legislation, policy and\nprocedures relating to\nthe conduct of\nevaluations\n3.4 Organisational values,\nethics and codes of\nconduct\n\n3.1 Describing data\nanalysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to\na range of\naudiences\n3.3 Stating\nlegislation,\npolicy and\nprocedures\nrelating to the\nconduct of\nevaluations\n3.4 Stating\norganisational\nvalues, ethics\nand codes of\nconduct\npractices\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n22\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Data analysis techniques\nMay include:\n1.1. Domain analysis\n1.2. Content analysis\n1.3. Comparison technique\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studied data/information\n\nThese aspects may be best assessed using a r