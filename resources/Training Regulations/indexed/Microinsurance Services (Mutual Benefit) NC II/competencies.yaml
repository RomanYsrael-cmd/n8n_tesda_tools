  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required in\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n400311210\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is\naccessed from\nappropriate sources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\n procedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/ Interacting\nwith people of\nvarious levels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n19 Interpersonal skills\nin the workplace\n2.0 Active-listening skills\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n3\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform\nduties\nfollowing\nworkplace\ninstructions.\n2.1 Written notices and\ninstructions are read\nand interpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are followed\nbased on established\nprocedures\n2.3 Feedback is given to\nworkplace supervisor\nbased instructions/\ninformation received\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters concerning\nconditions of\nemployment are sought\nand asked from\nappropriate\n sources\n2.6 Meetings outcomes\nare interpreted and\nimplemented\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace meetings\nand discussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Basic\nquestioning/querying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n3. Complete\nrelevant\nwork-\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Errors in recording\ninformation on forms/\ndocuments are\nidentified and acted\nupon\n3.4 Reporting requirements\nto supervisor are\ncompleted according to\norganizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n\n3.1 Completing work-\nrelated documents\n3.2 Applying operations\nof addition,\nsubtraction, division\nand multiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1\nTeam members\n1.2\nSupervisor/Department Head\n1.3\nSuppliers\n1.4\nTrade personnel\n1.5\nLocal government\n1.6\nIndustry bodies\n2. Medium\nMay include:\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation dissemination\n2.5\nFollow-up or verbal instructions\n2.6\nFace-to-face communication\n2.7\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Workplace\ninteractions\nMay include:\n4.1\nFace-to-face\n4.2\nTelephone\n4.3\nElectronic and two-way radio\n4.4\nWritten including electronic means, memos,\ninstruction and forms\n4.5\nNon-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n5\nEVIDENCE GUIDE\n\nVARIABLE\nRANGE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard\nformat of the organization\n1.2 Accessed information using workplace communication\nequipment/systems\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting formal or\ninformal communication\n2. Resource Implications The following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Notebook\n2.4 Writing materials\n2.5 Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Written test\n3.4 Third-party report\n\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited institution\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n6\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\n\nUNIT CODE\n: 400311211\n\nUNIT DESCRIPTOR\n: This unit covers the skills, knowledge and attitudes to\nidentify one’s roles and responsibilities as a member of\na team.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and objective\nof the team is identified\nfrom available sources\nof information\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n1.1 Group structure\n1.2 Group development\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways\nin improving wo