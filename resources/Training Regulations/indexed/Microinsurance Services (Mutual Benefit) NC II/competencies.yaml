            "source_number": 1
          },
          {
            "number": 2,
            "title": "Prepare notice of lapses, retirement, and cancellation",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Member’s policy status is generated and printed based on systems and procedures"
              },
              {
                "number": "2.2",
                "text": "Printed policy status is endorsed to appropriate personnel based on systems and procedures"
              },
              {
                "number": "2.3",
                "text": "Notice of lapses and cancellation are prepared and forwarded to appropriate personnel based on systems and procedures"
              }
            ],
            "required_knowledge": [
              "2.1 Qualification criteria of members, legal dependents, and beneficiaries",
              "2.2 Microinsurance information Requirements",
              "2.2 1 Personal Data",
              "2.2 2 Health Disclosure",
              "2.2 3 Financial Data",
              "2.3 Types of supporting documents",
              "2.3 1 Marriage contract",
