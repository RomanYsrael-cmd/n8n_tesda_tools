s.\n2.6 Determining the root\ncause of a routine\nmalfunction\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n10\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are\nplanned\n3.2 Evaluation of\nimplemented\nsolutions are\nplanned\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to\nappropriate person\nfor confirmation\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation that\nrecommends solutions\nto problems\n3.2 Following established\nprocedures\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n11\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and\nincidents\n1.5\n Work-related problems outside of own work\narea\n\n2. Appropriate person\nMay include:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n12\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that 