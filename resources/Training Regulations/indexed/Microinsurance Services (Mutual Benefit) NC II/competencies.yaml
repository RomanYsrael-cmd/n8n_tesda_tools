          {
            "number": 5,
            "title": "Prepare underwriting reports",
            "performance_criteria": [
              {
                "number": "5.1",
                "text": "Payment of benefits are disbursed based on Microinsurance policy coverage",
                "source_number": "4.5"
              },
              {
                "number": "5.2",
                "text": "Microinsurance coverage and other services are turned over to claimant based on systems and procedures",
                "source_number": "4.6"
              },
              {
                "number": "5.3",
                "text": "Microinsurance data from the system are generated based on Insurance Commission and management reportorial requirements",
                "source_number": "5.1"
              },
              {
                "number": "5.4",
                "text": "Generated data are organized into underwriting reports based on Insurance Commission and management reportorial requirements",
                "source_number": "5.2"
              },
              {
                "number": "5.5",
                "text": "Microinsurance underwriting reports are endorsed to management based on systems and procedures",
                "source_number": "5.3"
              },
              {
                "number": "5.6",
                "text": "Approved and signed Microinsurance underwriting reports are filed based on systems and procedures",
                "source_number": "5.4"
              }
