            "number": 3,
            "title": "Process remittance and payments",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Members remittance are encoded based on summary of contribution report"
              },
              {
                "number": "3.2",
                "text": "Member’s record of remittance is checked for accuracy based on general ledger"
              },
              {
                "number": "3.3",
                "text": "Microinsurance remittance reports are generated and printed based on systems and procedure"
              }
            ],
