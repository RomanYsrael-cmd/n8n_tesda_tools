        "descriptor": "This unit covers the knowledge, skills and attitudes required in updating member’s records (payment of contributions and personal information), updating policy status (active and inactive), and cancellation of the policy.",
        "elements": [
          {
            "number": 1,
            "title": "Update existing members records",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Existing member’s records are gathered and checked based on updated supporting documents"
              },
              {
                "number": "1.2",
                "text": "Changes in existing member’s records are encoded in the system based on eligibility criteria"
              },
              {
                "number": "1.3",
                "text": "Updated forms are filed with existing member’s records based on eligibility criteria"
              }
            ],
            "required_knowledge": [
              "1.1 Qualification criteria of members, legal dependents, and beneficiaries",
              "1.2 Microinsurance Information Requirements",
              "1.2 1 Personal Data",
              "1.2 2 Health Disclosure",
              "1.2 3 Financial Data",
              "1.3 Types of supporting documents",
              "1.3 1 Marriage contract",
              "1.3 2 Cenomar",
              "1.3 3 Birth certificate/ Baptismal Certificate / other legal documents containing birth date",
              "1.3 4 Legal adoption paper",
              "1.3 5 Any government or company issued I.D.",
              "1.4 Records management"
            ],
            "required_skills": [
              "1.1 Communications skills",
              "1.2 Mathematical skills",
              "1.3 Computer skills",
              "1.4 Data gathering skills",
              "1.5 Reporting skills",
              "1.6 Communications skills",
