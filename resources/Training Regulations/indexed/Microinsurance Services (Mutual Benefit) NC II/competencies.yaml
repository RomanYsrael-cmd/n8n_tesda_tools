        "source_text": "--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II    Promulgated (12/17/2019) \n \n13 \nUNIT OF COMPETENCY : \nDEVELOP CAREER AND LIFE DECISIONS \n \nUNIT CODE  \n           :     400311213 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and attitudes in \nmanaging one’s emotions, developing reflective practice, \nand boosting self-confidence and developing self-regulation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Manage one’s \nemotion \n1.1  Self-management \nstrategies are \nidentified \n1.2  Skills to work \nindependently and to \nshow initiative, to be \nconscientious, and \npersevering in the \nface of setbacks and \nfrustrations are \ndeveloped \n1.3  Techniques for \neffectively handling \nnegative emotions \nand unpleasant \nsituation in the \nworkplace are \nexamined \n \n \n \n1.1  Self-management \nstrategies that \nassist in regulating \nbehavior and \nachieving personal \nand learning goals \n(e.g. Nine self-\nmanagement \nstrategies \naccording to Robert \nKelley) \n1.2  Enablers and \nbarriers in \nachieving personal \nand career goals \n1.3 Techniques in \nhandling negative \nemotions and \nunpleasant situation \nin the workplace \nsuch as frustration, \nanger, worry, \nanxiety, etc. \n1.1  Managing properly \none’s emotions \nand recognizing \nsituations that \ncannot be changed \nand accept them \nand remain \nprofessional \n1.2  Developing self-\ndiscipline, working \nindependently and \nshowing initiative \nto achieve \npersonal and \ncareer goals \n1.3  Showing \nconfidence, and \nresilience in the \nface of setbacks \nand frustrations \nand other negative \nemotions and \nunpleasant \nsituations in the \nworkplace\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II    Promulgated (12/17/2019) \n \n14 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Develop \nreflective \npractice \n2.1 Personal strengths and \nachievements, based \non self-assessment \nstrategies and teacher \nfeedback are \ncontemplated \n2.2 Progress when seeking \nand responding to \nfeedback from teachers \nto assist them in \nconsolidating strengths, \naddressing weaknesses\nand fulfilling their \npotential are monitored \n2.3 Outcomes of personal \nand academic \nchallenges by \nreflecting on previous \nproblem solving and \ndecision making \nstrategies and \nfeedback from peers \nand teachers are \npredicted \n2.1 Basic SWOT \nanalysis \n2.2 Strategies to \nimprove one’s \nattitude in the \nworkplace \n2.3 Gibbs’ Reflective \nCycle/Model \n(Description, \nFeelings, \nEvaluation, \nAnalysis, \nConclusion, and \nAction plan) \n2.1 Using the basic \nSWOT analysis \nas self-\nassessment \nstrategy \n2.2 Developing \nreflective practice \nthrough \nrealization of  \nlimitations,  likes/ \ndislikes;  through \nshowing of self-\nconfidence   \n2.3 Demonstrating \nself-acceptance \nand being able to \naccept \nchallenges \n \n3. Boost self-\nconfidence and \ndevelop self-\nregulation \n3.1 Efforts for continuous \nself-improvement are \ndemonstrated \n3.2 Counter-productive \ntendencies at work are \neliminated \n3.3 Positive outlook in life \nare maintained.   \n3.1 Four components \nof self-regulation \nbased on Self-\nRegulation \nTheory (SRT) \n3.2 Personality \ndevelopment \nconcepts \n3.3  Self-help \nconcepts (e. g., 7 \nHabits by \nStephen Covey, \ntransactional \nanalysis, psycho-\nspiritual concepts) \n3.1 Performing \neffective \ncommunication \nskills – reading, \nwriting, conversing \nskills \n3.2 Showing affective \nskills – flexibility, \nadaptability, etc. \n3.3 Self-assessment \nfor determining \none’s strengths \nand weaknesses\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II    Promulgated (12/17/2019) \n \n15 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Self-\nmanagement \nstrategies \nMay include: \n1.1 \nSeeking assistance in the form of job coaching or mentoring  \n1.2 \nContinuing dialogue to tackle workplace grievances \n1.3 \nCollective negotiation/bargaining for better working \nconditions \n1.4 \nShare your goals to improve with a trusted co-worker or \nsupervisor \n1.5 \nMake a negativity log of every instance when you catch \nyourself complaining to others \n1.6 \nMake lists and schedules for necessary activities \n2. Unpleasant \nsituation \nMay include: \n2.1 \nJob burn-out \n2.2 \nDrug dependence \n2.3 \nSulking \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Express emotions appropriately \n1.2 Work independently and show initiative \n1.3 Consistently demonstrate self-confidence and self-\ndiscipline  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Access to workplace and resource s \n2.2. Case studies  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration or simulation with oral questioning \n3.2. Case problems involving work improvement and \nsustainability issues \n3.3. Third-party report \n4. Context for \nAssessment \n4.1. Competency assessment may occur in workplace or \nany appropriately simulated environment\n",
