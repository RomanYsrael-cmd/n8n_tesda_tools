        "source_text": "SOC332301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in the\npromotion and marketing of microinsurance products and\nservices.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Introduce\nmicroinsurance\nconcepts,\nprinciples, and\nlegal\nframework\n\n 1.1 Concepts and\nprinciples of\nMicroinsurance are\nexplained based on\ncurrent industry\nstandards\n1.2 Legal Framework\nof Microinsurance are\nintroduced based on\nthe insurance code and\nregulatory circulars and\nissuances\n1.3 Rights and\nobligations of policy\nholders are explained\nin line with existing\nMicroinsurance\nconsumer protection\nframework\n1.4 Microinsurance’s\nstandards, policies and\nprocedures are\nexplained to\nprospective clients in\nsimple and methodical\nmanner\n\n1.1 Microinsurance\nstandards\n1.2 Microinsurance\npolicies\n1.3 Microinsurance\nprocedures\n1.4 Microinsurance\nfeatures\n1.5 Rights and\nobligations of policy\nholders\n1.6 Legal framework\n\n1.1 Communications\nskills\n1.2 Presentation\nskills\n1.3 Computer skills\n1.4 People relations\nskills\n1.5 Interviewing\nskills\n\n2. Conduct\norientation and\nbriefings on\nmicroinsurance\nproducts and\nservices\n2.1 Marketing/\npromotional kits\nare made ready\nwithin budget and\ntimelines\n2.2 Orientation/\nbriefing materials\nare prepared based\nwithin budget and\ntimelines\n2.3 Features of\nmicroinsurance\nproducts and\n2.1 Marketing principles\n2.2 Marketing/promotional\nmaterials\n2.3 Marketing methods\n2.4 Types of\nMicroinsurance\nproducts/ services\n2.5 Microinsurance\nbenefits\n2.6 Microinsurance\nrequirements\n\n2.1 Communications\nskills\n2.2 Negotiation\nskills\n2.3 Presentation\nskills\n2.4 Mathematical\nskills (premium\ncomputations,\nstatistical)\n2.5 Computer skills\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n51\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nservices are\npresented based\non the client’s\nneeds\n2.4 Benefits and\nrequirements of\nmicroinsurance\nproducts and other\nservices are\nexplained based on\nthe client’s needs\n2.6 People relations\nskills\n2.7 Interviewing\nskills\n2.8 Data gathering\nskills\n2.9 Records\nmanagement\nskills\n\n3. Gather data\nand feedback\non evaluation\nof\nmicroinsurance\nproducts and\nservices\n3.1 Data and\nfeedback forms\nare made ready\nbased on the\nexpected number\nof respondents\n3.2 Data gathering and\nfeedbacking are\nconducted within\ncompany budget\nand timeline\n3.3 Data indicating key\nmarket information\nare collated and\ntabulated based on\ncompany systems\nand procedures\n3.4 Product and\nservice evaluation\nresults are\nsubmitted to\nimmediate\nsupervisor based\non timelines\n3.1 Products and services\nevaluation systems\nand procedures of the\ninstitution\n3.2 Products and services\nevaluation forms\n\n3.1 Communications\nskills\n3.2 Data\npresentation\nskills\n3.3 Mathematical\nskills\n3.4 Computer skills\n3.5 People relations\nskills\n3.6 Interviewing\nskills\n3.7 Data gathering\nskills\n3.8 Records\nmanagement\nskills\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Marketing and\nPromotional Kits\nMay include:\n1.1\nProduct brochures\n1.2\nPamphlets\n1.3\nFlyers\n1.4\nFlip charts\n1.5\nPowerpoint presentation\n1.6\nVideo clips\n2. Orientation and Briefing\nMaterials\nMay include:\n2.1 Product brochures\n2.2 pamphlets\n2.3 flyers\n2.4 flip charts\n2.5 Powerpoint presentation\n2.6 Video clips\n3. Microinsurance Products\nand Services\nMay include:\n3.1 Life microinsurance\n3.2 Non – life microinsurance\n3.3 Health MI\n3.4 Agri MI\n4. Data and Feedback\nForms\nMay include:\n4.1 Survey forms\n4.1