        },
        "source_text": "400311217\n\nUNIT DESCRIPTOR\n:\nThis unit covers knowledge, skills and attitude to identify\nthe efficiency and effectiveness of resource utilization,\ndetermine causes of inefficiency and/or ineffectiveness\nof resource utilization and Convey inefficient and\nineffective environmental practices\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nefficiency and\neffectiveness of\nresource utilization\n\n1.1 Required resource\nutilization in the\nworkplace is\nmeasured using\nappropriate\ntechniques\n1.2 Data are recorded\nin accordance with\nworkplace protocol\n1.3 Recorded data are\ncompared to\ndetermine the\nefficiency and\neffectiveness of\nresource utilization\naccording to\nestablished\nenvironmental\nwork procedures\n\n1.1. Importance of\nEnvironmental\nLiteracy\n1.2. Environmental\nWork\nProcedures\n1.3. Waste\nMinimization\n1.4. Efficient Energy\nConsumptions\n1.1 Recording Skills\n1.2 Writing Skills\n1.3 Innovation Skills\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n28\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Determine causes\nof inefficiency\nand/or\nineffectiveness of\nresource utilization\n2.1 Potential causes\nof inefficiency\nand/or\nineffectiveness\nare listed\n2.2 Causes of\ninefficiency and/or\nineffectiveness\nare identified\nthrough deductive\nreasoning\n2.3 Identified causes\nof inefficiency\nand/or\nineffectiveness\nare validated thru\nestablished\nenvironmental\nprocedures\n2.1 Causes of\nenvironmental\ninefficiencies and\nineffectiveness\n\n2.1 Deductive\nReasoning Skills\n2.2 Critical thinking\n2.3 Problem Solving\n2.4 Observation Skills\n\n3. Convey inefficient\nand ineffective\nenvironmental\npractices\n\n3.1 Efficiency and\neffectiveness of\nresource\nutilization are\nreported to\nappropriate\npersonnel\n3.2 Concerns related\nresource\nutilization are\ndiscussed with\nappropriate\npersonnel\n3.3 Feedback on\ninformation/\nconcerns raised\nare clarified with\nappropriate\npersonnel\n3.1 Appropriate\nPersonnel to\naddress the\nenvironmental\nhazards\n3.2 Environmental\ncorrective actions\n3.1 Written and Oral\nCommunication\nSkills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n3.5 Practice\nEnvironmental\nAwareness\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n29\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1 Utilization of Energy, Water, Fuel Procedures\n1.2 Waster Segregation Procedures\n1.3 Waste Disposal and Reuse Procedures\n1.4 Waste Collection Procedures\n1.5 Usage of Hazardous Materials Procedures\n1.6 Chemical Application Procedures\n1.7 Labeling Procedures\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n30\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Measured required resource utilization in the workplace\nusing appropriate techniques\n1.2. Recorded data in accordance with workplace protocol\n1.3. Identified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4. Validate the identified causes of inefficiency and/or\nineffectiveness thru established environmental\nprocedures\n1.5. Report efficiency and effectives of resource utilization to\nappropriate personnel\n1.6. Clarify feedback on information/concerns raised with\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nWorkplace\n2.2\nTools, materials and equipment relevant to the tasks\n2.3\nPPE\n2.4\nManuals and references\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration\n3.2\nOral questioning\n3.3\nWritten examination\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n31\n\nUNIT OF COMPETENCY\n: PRACTICE ENTREPRENEURIAL SKILLS IN THE\nWORKPLACE\n\nUNIT CODE\n:"
