        "source_text": "--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08 \nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II    Promulgated (12/17/2019) \n \n9 \nUNIT OF COMPETENCY   : \nSOLVE/ ADDRESS GENERAL WORKPLACE     \n                                                      PROBLEMS \n \n UNIT CODE \n :        400311212 \n  \n \nUNIT DESCRIPTOR \n : \nThis unit of covers the knowledge, skills and attitudes \nrequired to apply problem-solving techniques to \ndetermine the origin of a malfunction and plan for its \nresolution. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify routine  \nproblems  \n \n1.1 Identify routine \nproblems or \nprocedural problem \nareas  \n1.2 Define and determine \nproblem to be \ninvestigated  \n1.3 Identify and \ndocument current \nconditions of the \nproblem  \n1.1 Current industry \nhardware and \nsoftware products \nand services  \n1.2 Industry \nmaintenance, \nservice and \nhelpdesk \npractices, \nprocesses and \nprocedures  \n1.3 Industry standard \ndiagnostic tools  \n1.4 Malfunctions and \nresolutions.  \n \n1.1 Identifying current \nindustry hardware and \nsoftware products and \nservices \n1.2 Identifying current \nindustry maintenance, \nservices and helpdesk \npractices, processes \nand procedures.  \n1.3 Identifying current \nindustry standard \ndiagnostic tools  \n1.4 Describing common \nmalfunctions and \nresolutions.  \n1.5 Determining the root \ncause of a routine \nmalfunction  \n1. Look for \nsolutions to \nroutine \nproblems \n2.1 Potential solutions \nto problem are \nidentified \n2.2 Recommendations \nabout possible \nsolutions are \ndeveloped, \ndocumented, \nranked and \npresented to \nappropriate person \nfor decision \n2.1 Current industry \nhardware and \nsoftware products \nand services \n2.2 Industry service \nand helpdesk \npractices, \nprocesses and \nprocedures \n2.3 Operating \nsystems \n2.4 Industry standard \ndiagnostic tools \n2.5 Malfunctions and \nresolutions. \n2.6 Root cause \nanalysis \n2.1 Identifying current \nindustry hardware and \nsoftware products and \nservices \n2.2 Identifying services \nand helpdesk \npractices, processes \nand procedures. \n2.3 Identifying operating \nsystem \n2.4 Identifying current \nindustry standard \ndiagnostic tools \n2.5 Describing common \nmalfunctions and \nresolutions. \n2.6 Determining the root \ncause of a routine \nmalfunction\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08 \nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II    Promulgated (12/17/2019) \n \n10 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Recommend \nsolutions to \nproblems \n3.1 Implementation of \nsolutions are \nplanned \n3.2 Evaluation of \nimplemented \nsolutions are \nplanned \n3.3 Recommended \nsolutions are \ndocumented and \nsubmit to \nappropriate person \nfor confirmation \n3.1 Standard \nprocedures \n3.2 Documentation \nproduce  \n3.1 Producing \ndocumentation that \nrecommends solutions \nto problems \n3.2 Following established \nprocedures\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08 \nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II    Promulgated (12/17/2019) \n \n11 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Problems/Procedural \nProblem \n \nMay include: \n1.1 \nRoutine/non – routine processes and quality \nproblems \n1.2 \nEquipment selection, availability and failure \n1.3 \nTeamwork and work allocation problem \n1.4 \nSafety and emergency situations and \nincidents \n1.5 \n Work-related problems outside of own work \narea \n \n2. Appropriate person \nMay include: \n2.1 \nSupervisor or manager \n2.2 \nPeers/work colleagues \n2.3 \nOther members of the organization \n3. \nDocument \n \nMay include: \n3.1 \nElectronic mail \n3.2 \nBriefing notes \n3.3 \nWritten report \n3.4 \nEvaluation report \n4. \nPlan  \n \nMay include: \n4.1 \nPriority requirements \n4.2 \nCo-ordination and feedback requirements \n4.3 \nSafety requirements \n4.4 \nRisk assessment \n4.5 \nEnvironmental requirements\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II    Promulgated (12/17/2019) \n \n12 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined the root cause of a routine problem \n1.2 Identified solutions to procedural problems. \n1.3 Produced documentation that recommends solutions \nto problems. \n1.4 Followed established procedures. \n1.5 Referred unresolved problems to support persons. \n \n2. Resource \nImplications \n2.1. Assessment will require access to a workplace over an \nextended period, or a suitable method of gathering \nevidence of operating ability over a range of situations. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nCase Formulation \n3.2 \nLife Narrative Inquiry \n3.3 \nStandardized test \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include \nwalk through of the relevant competency components.  \n4. Context for \nAssessment \n4.1 Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA \naccredited institutions.\n",
