ervation\nskills\n2.6. Material, tool\nand equipment\nidentification\nskills\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n24\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Perform tasks\nin accordance\nwith relevant\nOSH policies\nand procedures\n\n3.1 Relevant OSH work\nprocedures are\nidentified in accordance\nwith workplace policies\nand procedures\n3.2 Work Activities are\nexecuted in accordance\nwith OSH work\nstandards\n3.3 Non-compliance work\nactivities are reported\nto appropriate\npersonnel\n3.1. OSH work\nstandards\n3.2. Industry related\nwork activities\n3.3. General OSH\nprinciples\n3.4. OSH Violations\n Non-compliance\nwork activities\n\n3.1 Communication\nskills\n3.3 Interpersonal\nskills\n3.4 Troubleshooting\nskills\n3.5 Critical thinking\nskills\n3.6 Observation\nskills\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies and\nProcedures\nMay include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPermit to Operate\n1.6\nPhilippine Occupational Safety and Health\nStandards\n1.7\nDepartment Order No. 13 (Construction Safety\nand Health)\n1.8\nECC regulations\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n3. OSH Preventive and\nControl Requirements\nMay include:\n3.1 Resources needed for removing hazard\neffectively\n3.2 Resources needed for substitution or\nreplacement\n3.3 Resources needed to establishing engineering\ncontrols\n3.4 Resources needed 