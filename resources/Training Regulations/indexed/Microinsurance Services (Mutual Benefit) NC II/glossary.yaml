      "term": "TESDA",
      "definition": "SOP-QSO-01-F08 MICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019) 18. Microinsurance - is an activity providing specific insurance, insurance‐like and other similar products and services that meet the needs of the low income sector for risk protection and relief against distress, misfortune and other contingent events. This shall include all forms of insurance, insurance–like and other similar activities, as may be defined by concerned regulatory bodies, with the following features: a. Premiums, contributions, fees or charges are collected/deducted prior to the occurrence of a contingent event; and b. Guaranteed benefits are provided upon occurrence of a contingent event 19. Mutual Benefit – a social organization which provides insurance to its members on an assessment basis. 20. Non-life Insurance – also called General insurance. It is typically defined as any insurance that is not determined to be life insurance. (Ex. Property & Casualty insurance) 21. Period of Cover – the term of the microinsurance contract shall be determined by the provider and shall depend on type of coverage 22. Premium – The sum paid by a policyholder to keep an insurance policy in force. 23. Proximate Cause - active efficient cause that sets in motion a train of events which brings about a result. 24. RIMANSI – a microinsurance technical resource center established by leading microfinance institutions in the Philippines to promote universal risk protection for the socio-economically disadvantaged in the Asia and the Pacific. 25. Suicide clause - The provider shall be liable if the insured commits suicide after one (1) year from the effective date or date of last reinstatement of the contract. Suicide committed in the state of insanity will be compensable regardless of the date of commission. Where suicide is not compensable, the liability of the provider will be limited to the return of premiums. 26. Underwriting – Process of selecting risks for insurance and determining in what amounts and on what terms the insurance company will accept the risk. 27. Utmost Good Faith – the insurance contract being a promise to pay in the case of loss is based on utmost good faith between the Assured and the Insurer"
