      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of MICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II the candidate must demonstrate competence in all unit/s of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units 4.1.3 Recognition of Prior Learning (RPL)/Recognition of Current Competencies (RCC). Candidates who have gained competencies through education informal training, and work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.4 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements as by industry."
