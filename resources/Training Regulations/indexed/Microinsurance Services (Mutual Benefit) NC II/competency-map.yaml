  "source_text": "COMPETENCY MAP\n MICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II\n\n--- PDF PAGE 110 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n106\nGLOSSARY OF TERMS\n\n1. Beneficiary of Insurance – the person who receives a life insurance benefit in the event\nof the policyholder’s death\n2. Claim - A request for payment under the terms of an insurance contract when an insured\nevent occurs.\n3. Commercial Insurance – Coverage for businesses for protection against potential losses\nthrough unforeseen circumstances like theft, liability, property damage, and for coverage\nin the event of an interruption of business or injured employees.\n4. Contestability - the contestability period for a microinsurance contract shall be one(1)\nyear.\n5. Coverage – a microinsurance contract shall cover the insured, and at his/her option, may\ninclude his/her immediate family (i.e. his/her spouse, children , and in the case of single\npersons, his/her parents and siblings ); and his/her assets.\n6. Effectivity – a microinsurance contract becomes immediately effective only upon full\npayment of the first premium, contribution, fees or charges.\n7. Grace Period - during the effectivity of the contract, the insured is entitled to a maximum\ngrace period of 45 calendar days from due date of premium/contribution payment.\n8. Indemnity - principle by which the assured is compensated for losses sustained and is\nplaced as much as possible in the same pecuniary (financial / economic) position as\nshe/he occupied immediately before the misfortune.\n9. Insurable Interest – means that the person who wants to be insured must be legally entitle\nto get an insurance policy and the occurrence of loss will cause the policy holder financial\nloss.\n10. Insurance Commission – a government agency under the Department of Finance. The\nCommission supervises and regulates the operations of life and non-life companies,\nmutual benefit, and trusts for charitable uses.\n11. Insurance Policy – The legal document issued by the company to the policyholder that\noutlines the conditions and terms of the insurance; also called the policy contract or the\ncontract.\n12. Insurance Processor – are commonly the first people to review new policy applications\nsubmitted\nby insurance agents\nor\nindividuals.\nIn\nreviewing\nthe\napplication,\nthe processor confirms the completeness and accuracy of all information provided\n13. Insured – The policyholder, the person or entity protected in case of a loss or claim.\n14. Insurer – The party to the insurance contract who promises to pay losses or benefits.\n15. Lapsed Policy – A policy terminated for non-payment of premiums.\n16. Life Insurance - a contract between an insurance policy holder and an insurer or assurer,\nwhere the insurer promises to pay a designated beneficiary a sum of money in exchange\nfor a premium, upon the death or disability of an insured person\n17. Microfinance – The provision of the broad range of financial services such as – loans,\nsavings and other non-financial services such as micro-insurance and capacity building\nprograms for the poor and low-income households to assist their micro-enterprises so as\nto enable them to raise their income levels and improve their living standard.\n\n--- PDF PAGE 111 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n107\n18. Microinsurance - is an activity providing specific insurance, insurance‐like and other\nsimilar products and services that meet the needs of the low income sector for risk\nprotection and relief against distress, misfortune and other contingent events. This shall\ninclude all forms of insurance, insurance–like and other similar activities, as may be\ndefined by concerned regulatory bodies, with the following features:\na. Premiums, contributions, fees or charges are collected/deducted prior to the\noccurrence of a contingent event; and\nb. Guaranteed benefits are provided upon occurrence of a contingent event\n19. Mutual Benefit – a social organization which provides insurance to its members on an\nassessment basis.\n20. Non-life Insurance – also called General insurance. It is typically defined as any\ninsurance that is not determined to be life insurance. (Ex. Property & Casualty insurance)\n21. Period of Cover – the term of the microinsurance contract shall be determined by the\nprovider and shall depend on type of coverage\n22. Premium – The sum paid by a policyholder to keep an insurance policy in force.\n23. Proximate Cause - active efficient cause that sets in motion a train of events which brings\nabout a result.\n24. RIMANSI – a microinsurance technical resource center established by leading\nmicrofinance institutions in the Philippines to promote universal risk protection for the\nsocio-economically disadvantaged in the Asia and the Pacific.\n25. Suicide clause - The provider shall be liable if the insured commits suicide after one (1)\nyear from the effective date or date of last reinstatement of the contract. Suicide\ncommitted in the state of insanity will be compensable regardless of the date of\ncommission. Where suicide is not compensable, the liability of the provider will be limited\nto the return of premiums.\n26. Underwriting – Process of selecting risks for insurance and determining in what amounts\nand on what terms the insurance company will accept the risk.\n27. Utmost Good Faith – the insurance contract being a promise to pay in the case of loss is\nbased on utmost good faith between the Assured and the Insurer\n\n--- PDF PAGE 112 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n108\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMicroinsurance Services (Mutual Benefit) NC II\nQualification Code:\nSOCMIS219\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nMicroinsurance Services\n(Mutual Benefit) NC II\n\n2019-72/\nDec 17, 2019\n\n01\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 113 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n109",
