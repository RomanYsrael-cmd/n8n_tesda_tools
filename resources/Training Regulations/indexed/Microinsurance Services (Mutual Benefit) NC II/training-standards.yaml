  "source_section_text": "SECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for MICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to include green\ntechnology, issues on health and drugs and catering to persons with disabilities (PWD’s).\n\nCourse Title: MICROINSURANCE SERVICES NC Level NC II\n (MUTUAL BENEFIT)\n\nNominal Training Duration:\n\n 37 hrs\nBasic Competencies\n\n 20 hrs\nCommon Competencies\n\n200 hrs\n200 hrs\nCore Competencies\nSIL\n Total 457 hrs\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II in accordance with industry\nstandards. This covers competencies that a person must achieve in performing the duties and\nresponsibilities of insurance processors and insurance policy clerks efficiently render the\ncoverage of microinsurance policies.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n67\nBASIC COMPETENCIES\n37 HRS\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to\nthe enterprise and the individual’s\nwork responsibilities\n•\nPrepare different Types of question\n•\nGather different sources of\ninformation\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n1.3. Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication procedures\nand systems\n•\nRead:\no Meeting protocols\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n68\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record\nroutine workplace measures\no Basic mathematical processes of\naddition, subtraction, division and\