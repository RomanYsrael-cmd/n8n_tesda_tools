plication\n•\nDemonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people\nof social range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work related documents\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and\ngroup\no Objectives and goals of team\n•\nLocate needed information from the\ndifferent sources of information\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n69\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play :\no individual role and responsibility\n•\nRole Play\no Understanding Individual\ndifferences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Participate in the discussion of\nstandard work procedures and\npractices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry\nhardware and software products and\nservices\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Analyze routine/procedural problems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n3.2 Look for\nsolutions to\nroutine problems\n• Review of the current industry\nhardware and software products and\nservices\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n70\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Formulate possible solutions to\nproblems and document procedures for\nreporting\n\n3.3 Look for\nsolutions to\nroutine problems\n• Review of the current industry\nhardware and software products and\nservices\n• Identify correctly the industry\nmaintenance, service and helpdesk\npractices, processes and procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining\nbasic malfunctions and resolutions to\ngeneral problems in the workplace\n• Formulate possible solutions to\nproblems and document procedures for\nreporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n4. Develop Career and\nLife Decisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management\nstrategies that assist in regulating\nbehavior and achieving personal and\nlearning goals\n• Explain enablers and barriers in\nachieving personal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in\nthe workplace such as frustration,\nanger, worry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\nprofessional\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n71\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal\nand career goals\n• Share experiences that show\nconfidence, and resilience in the face of\nsetbacks and frustrations and other\nnegative emotions and unpleasant\nsituations in the workplace\n\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/\ndislikes; through showing of self-\nconfidence\n• Demonstrate self-acceptance and\nbeing able to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-\nregulation based on Self-Regulation\nTheory (SRT)\n• Explain personality development\nconcepts\n• Cite self-help concepts (e. g., 7 Habits\nby Stephen Covey, transactional\nanalysis, psycho-spiritual concepts)\n• Perform effective communication skills\n– reading, writing, conversing skills\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n72\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Show affective skills – flexibility,\nadaptability, etc.\n• Determine strengths and weaknesses\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to\ndo things better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n5.2 Discuss and\ndevelop ideas\nwith others\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Communicate ideas through small\ngroup discussions and meetings\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\n1 Hour\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n73\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.3 Integrate ideas\nfor change in the\nworkplace\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and\nchallenges in innovation\n• Show mastery of the different types of\nchanges and levels of participation in\nthe workplace\n• Discuss 7 habits of highly effective\npeople\n• Communicate ideas through small\ngroup discussions and meetings\n• Demonstrate basic skills in data\nanalysis\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\n- Organisational protocols\n- Confidentiality and accuracy\n- Business mathematics and\nstatistics\n- Legislation, policy and\nprocedures relating to the\nconduct of evaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n74\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.2 Assess gathered\ndata/ information\n• Lecture and discussion on:\n- Data analysis techniques/\nprocedures\n- Organisational values, ethics and\ncodes of conduct\n- Trends and anomalies\n• Computing business mathematics and\nstatistics\n• Application of data analysis techniques\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\n- Reporting requirements to a\nrange of audiences\n- Recommendations for possible\nimprovements\n• Analysis and comparison of interim and\nfinal reports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n7. Practice\nOccupational Safety\nand Health Policies\nAnd Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety\nmaterials, tools and equipment\n• Handling of safety control resources\n\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH Standards\nand Principles\n• Performing industry related work\nactivities in accordance with OSH\nStandards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES 