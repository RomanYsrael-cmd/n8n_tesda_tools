es (Mutual Benefit) NCII or holder of Bachelor’s Degree in\nAccountancy, Finance, Economics and other Business-Related Courses with\nNational Certificate on Trainer’s Methodology I (TMI)\n• At least two (2) years industry experience for the last five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each unit\nof competency.\n\n--- PDF PAGE 107 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n103"
