embers, legal dependents,\nand beneficiaries\no Microinsurance information\nrequirements\no Types of supporting\ndocuments\no Records Management\n\n• Perform the following skills:\no Communications skills\n• Individual\nstudy\n• Lecture-\ndiscussion\n• Demonstration\n• Field work\n• Role playing\n• Project\nmethod\n\n• Written test\n• Portfolio\n• Interview\n• Demonstration\nof work related\nproject\n\n8 hrs\n\n--- PDF PAGE 99 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n95\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Mathematical skills\no Computer skills\no Data gathering skills\no Reporting skills\no Managing Records\n\n3.3 Process\nremittance and\npayments\n• Read and apply the following\ntopics:\n\no Legislature applicable to\nmicroinsurance\no Procedure in preparing\nremittance reports\no Encoding procedures\no Member’s record of\nremittance\no General Ledger\no Microinsurance remittance\nreports\n\n• Perform the following skills:\no Communications skills\no Negotiation skills\no Presentation skills\no Mathematical skills\no Computer skills\no People relations skills\no Interviewing skills\no Data gathering skills\no Records Management Skills\n\n• Individual\nstudy\n• Lecture-\ndiscussion\n• Demonstration\n• Field work\n• Role playing\n• Project\nmethod\n\n• Written test\n• Portfolio\n• Interview\n• Demonstration\nof work related\nproject\n\n32 hrs\n\n--- PDF PAGE 100 ---\nTESDA-SOP-QSO-01-F08\nMICROINSURANCE SERVICES (MUTUAL BENEFIT) NC II Promulgated (12/17/2019)\n\n96\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Process claims\n• Read and apply the following\ntopics:\no Procedure in processing\nclaims\no Means of validating\nauthenticity of documents/\nrequirements\no Procedure in disbursement of\nclaims\no Notice of claims\no Supporting documents for\