  "source_text": "COMPETENCY MAP - CONSTRUCTION Sector\n(HEAVY EQUIPMENT OPERATION)\n HEAVY EQUIPMENT OPERATION (OVERHEAD AND GANTRY CRANE) NC III\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 112 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III Revision 01 Promulgated (11/07/2019)\n 107\n\nUtilize specialize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice\nof social\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate usage\nof information\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth\nProgram,\nPolicies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and\nadjust problem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementatio\nn of OSH\nprograms in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 113 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III Revision 01 Promulgated (11/07/2019)\n 108\n\nPerform pre and post\noperation procedures for\ntruck mounted crane\n\nPerform basic preventive\nmaintenance servicing\nfor truck mounted crane\n\nPerform productive\noperation for truck\nmounted crane\n\nPerform pre and post\noperation procedures for\nrough terrain crane\n\nPerform basic preventive\nmaintenance servicing\nfor rough terrain crane\n\nPerform productive\noperation for rough\nterrain crane\n\nPerform pre and post\noperation procedures for\ncrawler crane\n\nPerform basic preventive\nmaintenance servicing\nfor crawler crane\n\nPerform productive\noperation for crawler\ncrane\n\nPerform pre and post\noperation procedures for\nforklift\n\nPerform basic preventive\nmaintenance servicing\nfor forklift\n\nPerform productive\noperation for forklift\n\nPerform pre and post\noperation procedures for\ntower crane\n\nPerform basic preventive\nmaintenance servicing\nfor tower crane\nPerform productive\noperation for tower care\n\nPerform pre and post\noperation procedures for\noverhead and gantry\ncrane\nPerform basic preventive\nmaintenance servicing\noverhead and gantry\ncrane\n\nPerform productive\noperation for overhead\nand gantry crane\n\nPerform pre and post\noperation procedures for\nhydraulic excavator\n\nPerform basic preventive\nmaintenance servicing\nfor hydraulic excavator\nPerform productive\noperation for hydraulic\nexcavator\n\nPerform pre and post\noperation procedures for\non-highway dump truck\n(rigid)\nPerform basic preventive\nmaintenance servicing\nfor on-highway dump\ntruck (rigid)\nPerform productive\noperation for on-highway\ndump truck (rigid)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 114 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III Revision 01 Promulgated (11/07/2019)\n 109\n\nGLOSSARY OF TERMS\n\nFor the purpose of this Competency Standard, the words\n\n1. Reeving\nRefers to a rope system in which the rope travels around the\ndrums and sheaves.\n\n2. Overhead crane\n\n3. Gantry crane\nRefers to a type of crane found in industrial environments.\nAn overhead\ncrane consists\nof\nparallel\nrunways\nwith\na\ntraveling bridge spanning the gap.\n\nRefers to load handling equipment powered by electric/\nhydrostatic motor and used to lift and transfer cargoes. This\nequipment is commonly found in port operation.\n\n4. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n\n5. Work area\nRefers to any place inside the swing circle of the crane. It must\nbe barricaded off and only those directly involve in the lift shall\nbe allowed to entry.\n\n6. Derated capacity\nof equipment\n\n7. Load Moment\n Indicator (LMI)\n\n8. Rigging gears\n\n9. Hazards\n\n10. Rigger\n\n11. Working Load\nLimit (WLL)\n\n12. Computer Literate\n\nRefers to the reduction of lifting capacity of equipment as\ncertified by a third party.\n\nRefers to electronic device that indicates crane configuration\nsuch as boom angle, boom length, load weight and working\nradius.\n\nRefers to equipment such as wire rope, turnbuckles, clevis,\njacks, shackles, slings used with cranes and other lifting\nequipment in material handling and structure relocation.\n\nRefers to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to signalman that directs the schedule of lifts for the\ncrane, and is responsible for the safety of the loads.\n\nRefers to the maximum working load designed by the\nmanufacturer. This load represents a force that is much less than\nthat required to make the lifting equipment fail or yield, also\nknown as the Minimum Breaking Load (MBL).\n\nIs defined as the knowledge and ability to utilize computers and\nrelated technology efficiently, with a range of skills covering\nlevels from elementary use to computer programming and\nadvanced problem solving.\n\n--- PDF PAGE 115 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III Revision 01 Promulgated (11/07/2019)\n 110\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHeavy Equipment Operation (Overhead and Gantry Crane)\nNC III\nQualification Code:\nCONTMC319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHEO (Gantry Crane)\nNC II\n2007-57 /\nN/A\n01\nDocument Amended\n\nHEO (Overhead and\nGantry Crane) NC III\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 116 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III Revision 01 Promulgated (11/07/2019)\n 111\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nENGR. SEBASTIAN Q. ALAMPAYAN, JR.\nSafety & Training Manager-\nIndustry Expert\nFirst Balfour, Inc.\nParañaque City\nEDUARDO C. EMAS\nTrainer/ Assessor\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\nMARY LOU C. URLANDA\nTrainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\n\nENGR. CORNELIO D. PADUA\nDepartment Head - Industry Expert\nManila’s Finest Construction, Inc.\nParañaque City\n\nJESUS C. SALVACION\nLifting Superintendent\nRoyal Cargo Inc.\nBatangas City /\nRigging Gears Specialist\nAssessment Center Inc.\nChairman/ AC Manager\nROBENSON S. LIM\nManpower Head/ Trainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\n\n--- PDF PAGE 117 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III Revision 01 Promulgated (11/07/2019)\n 112\n The PARTICIPANTS in the Validation of this Training Regulations\n\n• C.M. Pancho Const. Inc.\n Quezon City\n• EEI Corporation\n Calamba City\n\n• J. E. Manalo and Company, Inc.\n Makati City\n\n• Occupational Safety and Health\n Center (OSHC)\n Quezon City\n\n• Bureau of Working Condition - DOLE\n Intramuros, Manila\n\n• Monark Equipment\nQuezon City\n\n• Sta. Clara Int’l. Corp.\n Mandaluyong City\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Howard Mark N. Plete\n- Evangeline A. Cosep",
