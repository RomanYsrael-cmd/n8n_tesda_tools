ith \nchecklist and \nmanufacturer’s \nprocedures \n2.2 Abnormal conditions \nare noted in checklist \nand reported to \nauthorized person \n2.3 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n2.4 Required output is \ncompleted based on \naccomplished checklist \n \n2.1 Procedures in \nvisual check for \nOverhead and \nGantry crane \ncomponents \n2.2 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n2.3 Functions of \nOverhead and \nGantry crane \ncomponents \n2.4 Factors affecting \nproductivity \n2.5 Productivity work \nmeasurement \n2.6 Ways of improving \nproductivity \n \n2.1 Accomplishing \nchecklist \n2.2 Following visual \nchecking for \noverhead and \ngantry crane \ncomponents \n2.3  Identifying parts \nand functions \n2.4 Using PPE \n2.5 Applying \nproductive \nmethods and \ntechniques \n \n \n3. Perform operation \ncheck \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n3.1 Operation check is \nperformed while the \npower is switched-on in \naccordance with \nmanufacturer’s \nrecommendations. \n3.2 Mechanical \ncomponents are \nchecked for normal \nfunctioning based on \nmanufacturer's \nspecifications.  \n3.3 Function check is \nperformed with \nequipment checklist \nand while power supply \nis on. \n3.4 Safety devices are \nchecked for proper \nfunctions in accordance \nwith safe operating \nprocedures.  \n \n \n \n \n \n3.1 Start-up \nprocedures \n3.2 Procedures in   \nwalk-around check \nwhile the power \nsupply is on \n3.3 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n3.4 Warning signs and \nsymbols \n3.5 Functions of all \ncomponents and \nsafety devices \n3.6 Factors affecting \nproductivity \n3.7 Productivity work \nmeasurement \n \n \n \n \n3.1 Accomplishing \nchecklist \