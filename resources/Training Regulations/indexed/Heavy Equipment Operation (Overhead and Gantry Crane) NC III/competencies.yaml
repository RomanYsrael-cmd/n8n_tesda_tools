        "source_title": "PERFORM PRE AND POST-OPERATION PROCEDURES FOR OVERHEAD AND GANTRY CRANE",
        "source_text": "--- PDF PAGE 65 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III        Revision 01        Promulgated (11/07/2019)                60 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n:  \nPERFORM PRE AND POST-OPERATION   \nPROCEDURES FOR OVERHEAD AND GANTRY \nCRANE \n \nUNIT CODE  \n \n \n: \nCON834313 \n \nUNIT DESCRIPTOR \n \n:  \nThis unit covers the knowledge, skills and attitudes in  \nperforming visual and operation check before and after  \nproductive operation of Overhead and Gantry crane.  \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are elaborated \nin the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Perform visual check \nof Overhead and \nGantry crane \n \n \n \n \n \n \n1.1 Capacity of Overhead \nand Gantry crane is \nselected based on job \nrequirements. \n1.2 Operator-serviceable \n(OS) parts are \nchecked in accordance \nwith equipment \nchecklist and \nmanufacturer’s \nprocedures. \n1.3 Walk-around check is \nperformed with \nequipment checklist \nwhile power is switched \noff. \n1.4 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n1.5 Work area is cleaned \naccording to safety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 and \n42) \n1.6 Required output is \ncompleted based on \naccomplished checklist \n1.1 DOLE \nDepartment \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and \nHealth in the \nConstruction \nIndustry \n1.2 Procedures in \nconducting visual \nand walk-around \ncheck \n1.3 Computation of \nload versus \ncapacity of \noverhead and \ngantry crane \n1.4 Functions of \nparts and \ncomponents of \nOverhead and \nGantry crane \n1.5 Factors affecting \nproductivity \n1.6 Productivity work \nmeasurement \n1.7 Ways of \nimproving \nproductivity \n \n1.1 Following visual \nand walk-around \nchecking \nprocedures  \n1.2 Calculating load \nand capacity of \noverhead and \ngantry crane \n1.3 Identifying parts \nand functions \n1.4 Accomplishing \nchecklist \n1.5 Using PPE \n1.6 Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 66 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III        Revision 01        Promulgated (11/07/2019)                61 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are elaborated \nin the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Perform visual \ncheck of Overhead \nand Gantry crane \ncomponents  \n2.1 Overhead and Gantry \ncrane components \nare checked in \naccordance with \nchecklist and \nmanufacturer’s \nprocedures \n2.2 Abnormal conditions \nare noted in checklist \nand reported to \nauthorized person \n2.3 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n2.4 Required output is \ncompleted based on \naccomplished checklist \n \n2.1 Procedures in \nvisual check for \nOverhead and \nGantry crane \ncomponents \n2.2 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n2.3 Functions of \nOverhead and \nGantry crane \ncomponents \n2.4 Factors affecting \nproductivity \n2.5 Productivity work \nmeasurement \n2.6 Ways of improving \nproductivity \n \n2.1 Accomplishing \nchecklist \n2.2 Following visual \nchecking for \noverhead and \ngantry crane \ncomponents \n2.3  Identifying parts \nand functions \n2.4 Using PPE \n2.5 Applying \nproductive \nmethods and \ntechniques \n \n \n3. Perform operation \ncheck \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n3.1 Operation check is \nperformed while the \npower is switched-on in \naccordance with \nmanufacturer’s \nrecommendations. \n3.2 Mechanical \ncomponents are \nchecked for normal \nfunctioning based on \nmanufacturer's \nspecifications.  \n3.3 Function check is \nperformed with \nequipment checklist \nand while power supply \nis on. \n3.4 Safety devices are \nchecked for proper \nfunctions in accordance \nwith safe operating \nprocedures.  \n \n \n \n \n \n3.1 Start-up \nprocedures \n3.2 Procedures in   \nwalk-around check \nwhile the power \nsupply is on \n3.3 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n3.4 Warning signs and \nsymbols \n3.5 Functions of all \ncomponents and \nsafety devices \n3.6 Factors affecting \nproductivity \n3.7 Productivity work \nmeasurement \n \n \n \n \n3.1 Accomplishing \nchecklist \n3.2 Following walk-\naround checking \nprocedures while \nthe power supply \nis on \n3.3 Testing of \nOverhead and \nGantry crane \naccording to \nmanufacturer’s \nspecification \n3.4 Using PPE \n3.5 Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 67 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III        Revision 01        Promulgated (11/07/2019)                62 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are elaborated \nin the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \n \n3.5 Personal Protective \nEquipment (PPE) is \nused in accordance with \nRule 1080 of \nOccupational Safety and \nHealth Standards \n3.6 Required output is \ncompleted based on \naccomplished checklist \n3.8 Ways of improving \nproductivity \n \n \n4. Perform post-\noperation \nprocedures  \n4.1 Overhead and Gantry \ncrane is secured and \nturned off after \nproductive operation in \naccordance to \nmanufacturer’s manual. \n4.2 Controls are set into \nneutral position in \naccordance to \nmanufacturer’s \nmanual. \n4.3 Safety locks and \nbrakes are all \nengaged in \naccordance \nmanufacturer’s \nmanual. \n4.4 Walk-around \ninspection check is re-\nconducted after \noperation \n4.5 Daily equipment time \nreport (DETR) is \naccomplished/submitt\ned according to \ncompany rules and \nregulations \n4.6 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n \n4.1 Company rules \nand regulations  \n4.2 Securing and \nshutting down \nprocedures  \n4.3 DOLE \nDepartment Order \nNo. 13 s. 1998 \nGuidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n4.4 Factors affecting \nproductivity \n4.5 Productivity work \nmeasurement \n4.6 Ways of \nimproving \nproductivity \n \n4.1 Accomplishing \nDETR \n4.2 Following rules \nand regulations in \nsecuring and \nshutting down \nOverhead and \nGantry crane \n4.3 Using PPE \n4.4 Applying \nproductive \nmethods and \nprocedures\n\n--- PDF PAGE 68 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III        Revision 01        Promulgated (11/07/2019)                63 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Capacity of \nOverhead and \nGantry crane \nMay include: \n1.1    1.0 – 3.0 tons \n1.2    4.0 - 10 tons \n1.3    11 - 20 tons  \n1.4    21 tons and above \n2. Operator \nserviceable parts \n(OS) \nMay include: \n2.1 Grease/lube points  \n2.2 Lights \n3. Walk-around \ncheck  \n \n \n \n \n \nMay include: \n3.1 Power supply off \n             3.1.1 Worn out/damaged parts  \n             3.1.2 Loose parts and accessories (nuts and bolts) \n             3.1.3 Missing parts and accessories \n             3.1.4 Hook block assembly \n                          3.1.4.1 Sheaves \n                          3.1.4.2 Hook and latch \n             3.1.5 Wire rope and cable clamp \n             3.1.6 Levers and controls  \n                            3.1.6.1 Hoist \n                            3.1.6.2 Brake \n                            3.1.6.3 Traverse \n                            3.1.6.3 Travel \n                            3.1.6.4 Trolley \n              3.1.7 Rail \n              3.1.8 Drive motor \n              3.1.9 Hand rail \n              3.1.10 Ladder \n              3.1.11 Grounding system  \n3.2 Warning and safety labels \n3.3 Power supply on \n3.3.1 Gauges and controls  \n3.3.2 Safety devices \n3.3.3 Oil leaks \n3.3.4 Working equipment function \n▪ \nHoist \n▪ \nBrake \n▪ \nTraverse \n▪ \nTravel \n▪ \nTrolley \n      3.3.5 Electrical system\n\n--- PDF PAGE 69 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III        Revision 01        Promulgated (11/07/2019)                64 \n \nVARIABLE \nRANGE \n4. Personal \nProtective \nEquipment \n(PPE) \nMay include: \n4.1 Hard hat \n4.2 Goggles \n4.3 Gloves \n4.4 Safety shoes \n4.5 Reflectorized vest  \n5. Overhead and \nGantry crane \ncomponents \n \n \n \n \nMay include: \n5.1 Rail \n5.2 Bridge \n5.3 Trolley \n5.4 Cabin \n5.5 Hoist unit \n5.6 Hook \n6. Authorized \nperson \nMay include: \n6.1 Equipment Supervisor \n6.2 Equipment Dispatcher/Foreman  \n6.3 Equipment Maintenance personnel  \n7. Operation check \n \nMay include: \n7.1 Controls  \n           7.1.1 Travel  \n           7.1.2 Hoist  \n           7.1.3 Traverse \n           7.1.4 Trolley (in / out) \n7.2 Gauges  \n           7.2.1 Hour meter \n           7.2.2 Load Moment Indicator \n7.3 Oil leaks \n            7.3.1 Gear box \n                      7.3.1.1 Hoist \n                      7.3.1.2 Trolley \n                      7.3.1.3 Travel \n                      7.3.1.4 Traverse \n7.4 Electrical/switches \n           7.4.1 Lights \n           7.4.2 Horns \n           7.4.3 Wiper \n           7.4.4 Power supply\n\n--- PDF PAGE 70 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III        Revision 01        Promulgated (11/07/2019)                65 \nVARIABLE \nRANGE \n8. Safety devices \nMay include: \n8.1 Load Moment Indicator (LMI) \n8.2 Limit switch \n        8.2.1 Hoisting \n        8.2.2 Traverse \n        8.2.3 Traveling \n        8.2.4 Trolleying \n8.3 Bumpers/Endstops \n8.4 Warning horn \n8.5 Lights \n8.6 Blinkers \n8.7 Brakes  \n8.8 Boom stopper \n8.9 Anti-collision \n9. Safety locks \nMay include: \n9.1 Hoist lock \n9.2 Control lever lock \n9.3 Door lock \n9.4 Traveling lock \n9.5 Emergency stop\n\n--- PDF PAGE 71 ---\nHEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III        Revision 01        Promulgated (11/07/2019)                66 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \n \nAssessment requires evidence that the candidate: \n1.1 Performed visual check of Overhead and Gantry crane  \n1.2 Performed visual check of Overhead and Gantry crane \ncomponents \n1.3 Performed operation check while the power is switched-on \n1.4 Demonstrated ability to perform post-operation procedures  \n1.5 Observed safety measures applicable to worksite operation \n1.6 Communicated effectively with others to ensure effective work \noperation \n2. Resource \nImplications \n \nThe following resources should be provided: \n2.1 Work area for Overhead and Gantry crane operation \n2.2 Access to Overhead and Gantry crane and manuals \n2.3 PPE \n2.4 Safety signage/barricades \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Direct observation / Demonstration with oral questioning \n4. Context for \nAssessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n",
