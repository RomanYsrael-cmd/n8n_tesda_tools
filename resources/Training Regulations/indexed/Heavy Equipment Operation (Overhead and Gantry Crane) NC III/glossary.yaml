    {
      "term": "Limit (WLL)",
      "definition": "12. Computer Literate Refers to the reduction of lifting capacity of equipment as certified by a third party. Refers to electronic device that indicates crane configuration such as boom angle, boom length, load weight and working radius. Refers to equipment such as wire rope, turnbuckles, clevis, jacks, shackles, slings used with cranes and other lifting equipment in material handling and structure relocation. Refers to situation that poses threat to life, health, property, or environment. Refers to signalman that directs the schedule of lifts for the crane, and is responsible for the safety of the loads. Refers to the maximum working load designed by the manufacturer. This load represents a force that is much less than that required to make the lifting equipment fail or yield, also known as the Minimum Breaking Load (MBL). Is defined as the knowledge and ability to utilize computers and related technology efficiently, with a range of skills covering levels from elementary use to computer programming and advanced problem solving. HEAVY EQUIPMENT OPERATION (Overhead and Gantry Crane) NC III Revision 01 Promulgated (11/07/2019)"
