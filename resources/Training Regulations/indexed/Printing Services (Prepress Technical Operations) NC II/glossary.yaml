  "source_text": "Color Bars\nRows of different colored patches printed in the trim area of\nthe press sheet. They are used by proofers and press\noperators to control the trapping, ink density, dot gain, and\nprint contrast of the proof or the printed sheet.\nColor Theory\nIs both the science and art of using color. It explains how\nhumans perceive color; and the visual effects of how colors\nmix, match or contrast with each other.\nComputer-to-Plate\nAn imaging technology which helps to transfer a digital\nimage generated in a computer directly to a printing plate.\nContract Proof\nServes as an agreement between customer and printer and\nas a color reference guide for adjusting the press before the\nfinal press run.\nCreasing\nA ridge or groove produced in anything by folding, heat,\npressure, etc.\nDie-Cutting\nThe process of cutting a piece of paper or material to a\ncustom shape and size.\nDigitization\nThe process of converting information into a digital format.\nFolding Dummy\nSheet or sheets which has been folded into pages and\nmarked with page numbers to indicate the proper page\nimposition. It also indicates where the gripper margin is.\nGradation\nA visual technique of gradually transitioning from one color\nhue to another, or from one shade to another, or one texture\nto another.\nGripper\nA space on a sheet of paper that allows for the press to\nphysically grip the paper. This is where the machine pulls\nthe paper and guides it along the path to print.\nHalftone Frequency\nRefers to how many rows, or lines, of dots fit in a linear inch.\nThe number of LPI in a halftone screen is called the screen\nfrequency.\nImposition\nThe positioning of pages on a press sheet in such a manner\nthat when the sheet is folded into a signature and cut, the\npages will be in the correct sequence.\nMake-Ready\nThe act or process of making something ready for use.\nNesting\nThe layout strategy that allows printers to organize the\nshapes of products to be cut out by nesting them in one\nanother so as to optimize the use of space on the sheet.\nPerfect Binding\nA form of bookbinding in which the leaves are bound by\ngluing, after the back folds have been cut off, rather than by\nsewing.\nPerforation\nA small hole or row of small holes punched in a sheet of\npaper\nPlate Control Wedge\nProvides a means of optimizing the exposure of direct digital\nplatemakers by visual inspection.\n\n--- PDF PAGE 113 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n\n109\n\nPrinting Signature\nA group of pages that are printed, most likely on both sides\nof a single sheet of paper that once folded, trimmed, bound\nand cut, become a specific number of pages.\nPrototype\nAn early sample, model, or release of a product built to test\na concept or process. A prototype is generally used to\nevaluate a new design to enhance precision by system\nanalysts and users.\nRaster Image Processing\nA component used in a printing system which produces a\nraster image also known as a bitmap. Such a bitmap is used\nby a later stage of the printing system to produce the printed\noutput.\nSaddle Stitching\nA very popular book binding method in which folded sheets\nare gathered together one inside the other and then stapled\nthrough the fold line with wire staples.\nSmyth Sewn Binding\nMethod of book binding where groups of folded pages\n(referred to as signatures) are stitched together using binder\nthread. Each folded signature is sewn together individually\nwith multiple stiches and then joined with other signatures\nto create the complete book block.\nStep and Repeat\nThe process of creating a layout where an image, logo or\nsponsor name is repeated multiple times, creating a uniform\npattern.\nSubstrate\nTerm for any surface to be printed to which ink will adhere.\nThe substrate, also called stock, is typically a paper, but can\nalso refer to plastics, foil, metal, cloth, or any other surface\nto which printing ink will be applied.\nTonal Correction\nThe adjustments and changes you make to the brightness\nand contrast of your image.\nWeb-Press\nA modern offset printing press attached to a massive roll of\npaper.\n\n--- PDF PAGE 114 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n\n110\n\nACRONYMS\n\nAI\nAdobe Illustrator file extension\nCDR\nCorelDRAW file extension\nCMS\nColor Management System\nCMYK\nCyan, Magenta, Yellow, Black\nCtP\nComputer-to-Plate\nDVI\nDigital Visual Interface\nEPS\nEncapsulated PostScript file extension\nGCR\nGray Component Replacement\nHDMI\nHigh-Definition Multimedia Interface\nINDD\nAdobe InDesign file extension\nJO\nJob Order\nJPEG\nJoint Photographic Experts Group\nLED\nLight-Emitting Diode\nOCR\nOptical Character Recognition\nOHS\nOccupational Health and Safety\nPDF\nPortable Document Format\nPS\nPostscript\nPSD\nPhotoshop Document file extension\nRAM\nRandom-Access Memory\nRGB\nRed, Green, and Blue\nRIP\nRaster Image Processor\nTIFF/TIF\nTagged Image File Format file extension\nUCR\nUnder Color Removal\nUSB\nUniversal Serial Bus\nVGA\nVideo Graphics Array\n\n--- PDF PAGE 115 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n\n111",
