        "source_text": "SOC532310\n\nUNIT DESCRIPTOR\n: This unit deals with the knowledge, skills and discipline\nneeded to monitor the actual condition of prepress\nmachines/equipment and recommend what maintenance\nneeded to be done.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform\ninspection on\nmajor parts of\nequipment/m\nachines\nbased on the\nagreement\nwith the\nsupplier\n1.1 Inspection is performed\nregarding the wear and\ntear of major parts of\nequipment/machines.\n1.2 Inspections are\nperformed on\nink/water/air flow\nsystems of\nequipment/machines for\npossible clogging and\ndamage.\n1.3 Inspections are\nperformed on the output\nquality of various digital\noutputting machines.\nTECHNOLOGY\n1.1\nParts of\nequipment/\nmachines\n1.2\nEquipment/machi\nnes consumables\n1.3\nInk/water/air flow\nsystems\n1.4\nOutput quality\nstandards\n1.5\nVarious digital\nprepress\nmachines\nCOMMUNICATION\n1.6\nSupplier-client\nmaintenance\nagreement\n1.1 Inspecting parts of\nprepress\nmachines/\nequipment\n1.2 Inspecting output\nquality\n1.3 Inspecting\nink/water/air flow\nsystems\n2. Perform fault\nfinding check\non the\ninspected\nparts of\nequipment/m\nachines\n2.1 Fault finding check is\nperformed on machine\nparts in accordance with\nestablished procedures.\n2.2 Fault finding check is\nrecorded in accordance\nwith established\nprocedures.\n2.3 Fault finding check\nreports are submitted to\nrelevant person for further\nactions.\nCOMMUNICATION\n2.1\nFault finding\ncheck on various\nprepress\nmachines/\nequipment\n2.1 Communication\nskills\n2.2 Analytical skills\n2.3 Critical thinking\nskills\n\n--- PDF PAGE 74 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n70\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Major parts\nMay include:\n1.1\nPrinthead\n1.2\nRollers\n1.3\nCutting plotter blade\n1.4\nMachine power cords and other external cords\n1.5\nDiode