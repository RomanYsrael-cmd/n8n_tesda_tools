        "source_text": "400311210\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources.\n1.2 Effective questioning,\nactive listening and\nspeaking skills are used\nto gather and convey\ninformation.\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas.\n1.4 Appropriate non- verbal\ncommunication is used.\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed.\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used.\n1.7 Personal interaction is\ncarried out clearly and\nconcisely.\n\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing\nroutine workplace\nduties following\nsimple written\nnotices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated\ndocuments\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n\n--- PDF PAGE 7 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRE