        "source_text": "SOC732307\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes needed\nto prepare and perform basic color separation process as\nwell as saving of an image. It includes manual coloring of\na drawing, text fill/outline or background and the\napplication of commonly used tools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check\nrequirements\nfor basic color\nseparation\nprocess\n1.1 Basic color separation\nrequirements are\ndetermined according to\nwork instructions.\n1.2 Drawing source is\ndetermined according to\nwork instructions.\n1.3 Requirements for basic\ncolor separation of a\ndrawing is checked\naccording to work\ninstructions.\nTECHNOLOGY\n1.1\nColor Theory\n1.2\nCalibration of\npaper-ink-press\nsystem\n1.3\nTypes of basic\ncolor separation\n1.4\nTypes of images\n1.5\nTypes of screen\ntint\n1.1 Checking work\ninstructions\n1.2 Drawing skills\n2. Prepare\nhardware and\nsoftware\nnecessary for\nbasic color\nseparation\n2.1 Digitization of artwork\nmaterials is performed\nusing image capturing\ndevice in accordance\nwith established\nprocedures.\n2.2 Software is set in\npreparation for basic\ncolor separation process.\n\n2.3 Necessary colors\nneeded for basic color\nseparation are prepared\nin accordance with work\ninstructions.\nTECHNOLOGY\n2.1\nVarious color\nseparation\nsoftware\napplication\n2.2\nVarious image\ncapturing device\noperation\n2.3\nColor/spot color\npreparation\n2.1 Digitizing artwork\nmaterials\n2.2 Applying color\nseparation\nsoftware\n2.3 Computer skills\n3. Perform basic\ncolor\nseparation of\nan image\n3.1 Layers are created\naccording to established\nprocedures.\n3.2 Areas to be applied with\ncolors are selected using\nthe selection tools.\n3.3 Color screen tint,\ngradation and pattern are\napplied into the selected\nTECHNOLOGY\n3.1\nLayer creation\n3.2\nArchiving\nprocedures\n3.3\nSelection and\ncoloring tools\nCOMMUNICATION\n3.1 Layering of digital\nfile\n3.2 Applying\nselection and\ncoloring tools\n3.3 Archiving a copy\n3.4 Drawing/tracing\ntechniques\n\n--- PDF PAGE 57 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n53\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nareas using coloring\ntools.\n3.4 Copy for archiving\npurposes is saved in\naccordance with\nestablished procedures.\n3.4\nConcept of color\nseparation\n4. Print a copy\nfor checking\n4.1 A colored proof is\nprinted for checking in\naccordance with\nestablished procedures.\n4.2 Printed copy is checked\nbased on the original\ncopy and work\ninstructions.\n4.3 Printed copy is\nforwarded to relevant\nperson for approval.\n4.4 Correction and revision\nare applied to the proof\nsubmitted by relevant\nperson.\nCOMMUNICATION\n4.1\nChecking of\nprinted copy\nagainst work\ninstruction\n4.2\nApplication of\ncorrection and\nrevision\n\n4.1 Printing of proof\n4.2 Checking printed\ncopy\n4.3 Correcting and\nrevising skills\n4.4 Communication\nskills\n\n--- PDF PAGE 58 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n54\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Requirements\nMay include:\n1.1 Number of color combination\n1.2 Types of screen application\n1.3 Types of copy to be separated\n2. Drawing Source\nMay include:\n2.1\nArtwork Material\n2.2\nDigital Artwork\n2.3\nInternet Downloaded Artwork\n3. Checked\nMay include:\n3.1\nImage Quality\n3.2\nNumber of Colors\n3.3\nSoftware Applications to be Used\n3.4\nTypes of Color Application\n3.5\nTypes of Screen\n3.6\nTypes of Copy to be Separated\n4. Digitization\nMay include:\n4.1 Through Scanning\n4.2 Through Digital Camera\n5. Software\nMay include:\n5.1 Vector Graphic Editor\n5.2 Image Manipulation and Editing\n5.3 Design and Lay-out\n6. Prepared\nMay include:\n6.1 Create color in the color swatches\n6.2 Create additional channels for spot color\n6.3 Substitute spot color with any of the Cyan, Magenta,\nYellow, Black colors\n7. Selection Tools\nMay include:\n7.1 Magic Wand\n7.2 Pen Tool\n7.3 Selection Tools\n8. Coloring Tools\nMay include:\n8.1 Brush Tool\n8.2 Pencil Tool\n8.3 Paint Bucket Tool\n8.4 Gradient Tool\n8.5 Blend Tool\n8.6 Mesh Tool\n8.7 Mixer Brush Tool\n8.8 Color Replacement Tool\n9. Archiving\nMay include:\n\n--- PDF PAGE 59 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n55\nVARIABLE\nRANGE\n9.1 Vectored Graphic\n9.2 Rastered Graphic File\n9.3 Tagged Image Format File\n9.4 Design and Lay-out File\n9.5 Portable Document Format file\n9.6 Encapsulated Postscript file\n10. Colored Proof\nMay include:\n10.1 Inkjet Printed\n10.2 Colored Laser Printed\n11. Checked\nMay include:\n11.1 Correct Size\n11.2 Correct Color\n11.3 Sharpness\n\n--- PDF PAGE 60 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n56\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Checked requirements for basic color separation of\na drawing according to work instructions\n1.2 Performed digitization of artwork materials using\nimage capturing device\n1.3 Prepared necessary colors needed for basic color\nseparation in accordance with work instructions\n1.4 Applied color screen tint, gradation and pattern into\nthe selected areas using coloring tools\n1.5 Evaluated printed copy based on the original copy\nand work instructions\n1.6 Applied correction and revision to the proof\nsubmitted by relevant person\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workshop appropriate for the unit of competency\n2.2 Tools, materials and equipment, appropriate for the\nunit of competency\n2.3 Video Clips\n2.4 Case Work\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n