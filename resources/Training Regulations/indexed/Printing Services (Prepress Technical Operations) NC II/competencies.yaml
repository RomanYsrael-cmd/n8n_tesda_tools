        "source_title": "CONTRIBUTE TO WORKPLACE INNOVATION",
        "source_text": "--- PDF PAGE 22 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n18 \nUNIT OF COMPETENCY \n: CONTRIBUTE TO WORKPLACE INNOVATION \n \n \n \nUNIT CODE \n: 400311214 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto make a pro-active and positive contribution to workplace \ninnovation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nopportunities \nto do things \nbetter \n1.1 Opportunities for \nimprovement are \nidentified proactively in \nown area of work. \n1.2 Information are \ngathered and reviewed \nwhich may be relevant to \nideas and which might \nassist in gaining support \nfor idea. \n1.1 Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n1.2 Positive impacts \nand challenges in \ninnovation \n1.3 Types of changes \nand responsibility \n1.4 Seven habits of \nhighly effective \npeople \n \n1.1 Identifying \nopportunities to \nimprove and to do \nthings better \ninvolvement \n1.2 Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n1.3 Identifying \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n2. Discuss and \ndevelop \nideas with \nothers \n2.1 People who could \nprovide input to ideas \nfor improvements are \nidentified. \n2.2 Ways of approaching \npeople to begin sharing \nideas are selected. \n2.3 Meeting is set with \nrelevant people. \n2.4 Ideas for follow up are \nreview and selected \nbased on feedback. \n2.5 Critical inquiry method \nis used to discuss and \ndevelop ideas with \nothers. \n2.1 Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n2.2 Positive impacts \nand challenges in \ninnovation \n2.3 Types of changes \nand responsibility \n2.4 Seven habits of \nhighly effective \npeople \n \n2.1 Identifying \nopportunities to \nimprove and to do \nthings better. \nInvolvement \n2.2 Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n2.3 Providing \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n2.4 Communicating \nideas for change \nthrough small \ngroup discussions \nand meetings\n\n--- PDF PAGE 23 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n19 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Integrate \nideas for \nchange in \nthe \nworkplace \n3.1 Critical inquiry method is \nused to integrate \ndifferent ideas for \nchange of key people. \n3.2 Summarizing, analyzing \nand generalizing skills \nare used to extract \nsalient points in the pool \nof ideas. \n3.3 Reporting skills are \nlikewise used to \ncommunicate results. \n3.4 Current Issues and \nconcerns on the \nsystems, processes and \nprocedures, as well as \nthe need for simple \ninnovative practices are \nidentified. \n3.1 Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n3.2 Positive impacts \nand challenges in \ninnovation \n3.3 Types of changes \nand responsibility \n3.4 Seven habits of \nhighly effective \npeople \n3.5 Basic research \nskills \n3.1 Identifying \nopportunities to \nimprove and to do \nthings better \ninvolvement \n3.2 Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n3.3 Providing \nexamples of the \ntypes of changes \nthat are within and \noutside own scope \nof responsibility \n3.4 Communicating \nideas for change \nthrough small \ngroup discussions \nand meetings \n3.5 Demonstrating \nskills in analysis \nand interpretation \nof data\n\n--- PDF PAGE 24 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n20 \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Opportunities for \nimprovement \nMay include: \n1.1 Systems \n1.2 Processes \n1.3 Procedures \n1.4 Protocols \n1.5 Codes \n1.6 Practices \n2. Information  \nMay include: \n2.1 Workplace communication problems \n2.2 Performance evaluation results \n2.3 Team dynamics issues and concerns \n2.4 Challenges on return of investment \n2.5 New tools, processes and procedures \n2.6 New people in the organization \n3. People who could \nprovide input \nMay include: \n3.1 Leaders \n3.2 Managers \n3.3 Specialists \n3.4 Associates \n3.5 Researchers \n3.6 Supervisors \n3.7 Staff \n3.8 Consultants (external) \n3.9 People outside the organization in the same field or \nsimilar expertise/industry \n3.10 Clients \n4. Critical inquiry method \nMay include: \n4.1 \nPreparation \n4.2 \nDiscussion \n4.3 \nClarification of goals \n4.4 \nNegotiate towards a Win-Win outcome \n4.5 \nAgreement \n4.6 \nImplementation of a course of action \n4.7 \nEffective verbal communication. See our pages \nVerbal Communication and Effective Speaking \n4.8 \nListening \n4.9 \nReducing misunderstandings is a key part of effective \nnegotiation \n4.10 Rapport Building \n4.11 Problem Solving \n4.12 Decision Making \n4.13 Assertiveness \n4.14 Dealing with Difficult Situations\n\n--- PDF PAGE 25 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n21 \nVARIABLE \nRANGE \n5. Reporting skills \nMay include: \n5.1 \nData management \n5.2 \nCoding \n5.3 \nData analysis and interpretation \n5.4 \nCoherent writing \n5.5 \nSpeaking\n\n--- PDF PAGE 26 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n22 \n \n EVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified opportunities to do things better \n1.2 \nDiscussed and developed ideas with others on how \nto contribute to workplace innovation \n1.3 \nIntegrated ideas for change in the workplace \n1.4 \nAnalyzed and reported rooms for innovation and \nlearning in the workplace \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nPens, papers and writing implements \n2.2 \nWhite board \n2.3 \nManila papers \n3.  Methods of Assessment Competency in this unit may be assessed through: \n3.1 \nPsychological and behavioral Interviews \n3.2 \nPerformance Evaluation \n3.3 \nLife Narrative Inquiry \n3.4 \nReview of portfolios of evidence and third-party \nworkplace reports of on-the-job performance. \n3.5 \nSensitivity analysis \n3.6 \nOrganizational analysis \n3.7 \nStandardized assessment of character strengths and \nvirtues applied \n4.  Context for Assessment \n4.1    Competency may be assessed individually in the \nactual workplace or simulation environment in TESDA \naccredited institutions\n",
