          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Conveyed OSH work non-conformities to appropriate\npersonnel\n1.2 Identified OSH preventive and control requirements\n1.3 Identified OSH work activity material, tools and\nequipment requirements\n1.4 Arranged/Placed required OSH materials, tools and\nequipment\n1.5 Executed work activities\n1.6 Reported OSH activity non-compliance work activities\nto appropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary for\nthe activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 34 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n30\n\nUNIT OF COMPETENCY\n: EXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE\nPRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:"
        },
        "source_text": "400311216\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto identify OSH compliance requirements, prepare OSH\nrequirements for compliance, perform tasks in accordance\nwith relevant OSH policies and procedures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations, policies\nand procedures are\nidentified in accordance\nwith workplace policies\nand procedures.\n1.2 OSH activity non-\nconformities are\nconveyed to appropriate\npersonnel.\n1.3 OSH preventive and\ncontrol requirements\nare identified in\naccordance with OSH\nwork policies and\nprocedures.\n1.1 OSH preventive\nand control\nrequirements\n1.2 Hierarchy of\nControls\n1.3 Hazard Prevention\nand Control\n1.4 General OSH\nprinciples\n1.5 Work standards\nand procedures\n1.6 Safe handling\nprocedures of\ntools, equipment\nand materials\n1.7 Standard\nemergency plan\nand procedures in\nthe workplace\n1.1 Applying\ncommunication\nskills\n1.2 Applying\ninterpersonal\nskills\n1.3 Applying critical\nthinking skills\n1.4 Applying\nobservation skills\n\n2. Prepare OSH\nrequirements\nfor\ncompliance\n\n2.1 OSH work activity\nmaterial, tools and\nequipment requirements\nare identified in\naccordance with\nworkplace policies and\nprocedures.\n2.2 Required OSH materials,\ntools and equipment are\nacquired in accordance\nwith workplace policies\nand procedures.\n2.3 Required OSH materials,\ntools and equipment are\narranged/ placed in\naccordance with OSH\nwork standards.\n2.1 Resources\nnecessary to\nexecute hierarchy\nof controls\n2.2 General OSH\nprinciples\n2.3 Work standards\nand procedures\n2.4 Safe handling\nprocedures of\ntools, equipment\nand materials\n2.5 Different OSH\ncontrol measures\n2.1 Applying\nCommunication\nskills\n2.2 Applying\nestimation skills\n2.3 Applying\ninterpersonal\nskills\n2.4 Applying critical\nthinking skills\n2.5 Applying\nobservation skills\n2.6 Identifying\nmaterial, tool and\nequipment\n\n--- PDF PAGE 31 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n27\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Perform tasks\nin\naccordance\nwith relevant\nOSH policies\nand\nprocedures\n\n3.1 Relevant OSH work\nprocedures are identified\nin accordance with\nworkplace policies and\nprocedures.\n3.2 Work Activities are\nexecuted in accordance\nwith OSH work\nstandards.\n3.3 Non-compliance work\nactivities are reported to\nappropriate personnel.\n3.1 OSH work\nstandards\n3.2 Industry related\nwork activities\n3.3 General OSH\nprinciples\n3.4 OSH Violations\n3.5 Non-compliance\nwork activities\n\n3.1 Applying\ncommunication\nskills\n3.2 Applying\ninterpersonal\nskills\n3.3 Applying\ntroubleshooting\nskills\n3.4 Applying critical\nthinking skills\n3.5 Applying\nobservation skills\n\n--- PDF PAGE 32 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies and\nProcedures\nMay include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPermit to Operate\n1.6\nPhilippine Occupational Safety and Health\nStandards\n1.7\nDepartment Order No. 13 (Construction Safety\nand Health)\n1.8\nECC regulations\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n3. OSH Preventive and\nControl Requirements\nMay include:\n3.1 Resources needed for removing hazard effectively\n3.2 Resources needed for substitution or replacement\n3.3 Resources needed to establishing engineering\ncontrols\n3.4 Resources needed for enforcing administrative\ncontrols\n3.5 Personal Protective equipment\n4. Non OSH-Compliance\nWork Activities\nMay include non-compliance or observance of the\nfollowing safety measures:\n4.1 Violations that may lead to serious physical harm\nor death\n4.2 Fall Protection\n4.3 Hazard Communication\n4.4 Respiratory Protection\n4.5 Power Industrial Trucks\n4.6 Lockout/Tag-out\n4.7 Working at heights (use of ladder, scaffolding)\n4.8 Electrical Wiring Methods\n\n--- PDF PAGE 33 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n29\n4.9 Machine Guarding\n4.10 Electrical General Requirements\n4.11 Asbestos work requirements\n4.12 Excavations work requirements\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Conveyed OSH work non-conformities to appropriate\npersonnel\n1.2 Identified OSH preventive and control requirements\n1.3 Identified OSH work activity material, tools and\nequipment requirements\n1.4 Arranged/Placed required OSH materials, tools and\nequipment\n1.5 Executed work activities\n1.6 Reported OSH activity non-compliance work activities\nto appropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary for\nthe activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 34 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n30\n\nUNIT OF COMPETENCY\n: EXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE\nPRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:"
