ange\nthrough small\ngroup discussions\nand meetings\n\n--- PDF PAGE 23 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n19\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Integrate\nideas for\nchange in\nthe\nworkplace\n3.1 Critical inquiry method is\nused to integrate\ndifferent ideas for\nchange of key people.\n3.2 Summarizing, analyzing\nand generalizing skills\nare used to extract\nsalient points in the pool\nof ideas.\n3.3 Reporting skills are\nlikewise used to\ncommunicate results.\n3.4 Current Issues and\nconcerns on the\nsystems, processes and\nprocedures, as well as\nthe need for simple\ninnovative practices are\nidentified.\n3.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements\n3.2 Positive impacts\nand challenges in\ninnovation\n3.3 Types of changes\nand responsibility\n3.4 Seven habits of\nhighly effective\npeople\n3.5 Basic research\nskills\n3.1 Identifying\nopportunities to\nimprove and to do\nthings better\ninvolvement\n3.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation\n3.3 Providing\nexamples of the\ntypes of changes\nthat are within and\noutside own scope\nof responsibility\n3.4 Communicating\nideas for change\nthrough small\ngroup discussions\nand meetings\n3.5 Demonstrating\nskills in analysis\nand interpretation\nof data\n\n--- PDF PAGE 24 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n20\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Opportunities for\nimprovement\nMay include:\n1.1 Systems\n1.2 Processes\n1.3 Procedures\n1.4 Protocols\n1.5 Codes\n1.6 Practices\n2. Information\nMay include:\n2.1 Workplace communication problems\n2.2 Performance evaluation results\n2.3 Team dynamics issues and concerns\n2.4 Challenges on return of investment\n2.5 New tools, processes and procedures\n2.6 New people in the organization\n3. People who could\nprovide input\nMay 