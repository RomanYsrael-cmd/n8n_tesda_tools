        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared printing requirements of a job\n1.2 Performed quality check of printed proof\n1.3 Reviewed ready-file before sending to Raster Image\nProcessor (RIP)\n1.4 Performed plate making make-ready\n1.5 Examined ripped file against the contract proof\n1.6 Inspected plate and submitted to relevant persons\nfor the next printing process\n1.7 Performed die-cutting guide making using vector\ngraphic editor software\n1.8 Set line assignments\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workshop appropriate for the unit of competency\n2.2 Tools, materials and equipment, appropriate for the\nunit of competency\n2.3 Video clips\n2.4 Case work\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n3.3 Written Examination\n3.4 Interview\n4. Context for Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 67 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n63\nUNIT OF COMPETENCY\n: PERFORM IMPOSITION PROCEDURES\n\nUNIT CODE\n:"
        },
        "source_text": "SOC732308\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge skills and attitudes required\nto perform digital output process which includes proofing,\nplate recording, die-knife guide making operations, and the\napplication of commonly used tools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform\ndigital\ncontract\nproofing\noperations\n1.1 Digital printer is checked\nif ready and in\naccordance with\nestablished procedures.\n1.2 Printing requirements\nof a job is prepared\naccording to work\ninstructions.\n1.3 Data file is printed\naccording to established\nprocedures.\n1.4 Printed proof is quality\nchecked according to\nestablished procedures.\n1.5 Checked proof is\nforwarded to relevant\npersonnel in accordance\nwith established\nprocedures.\nTECHNOLOGY\n1.1\nFunctions of\nvarious proofing\nmachines\n1.2\nVarious types of\nproof\n1.3\nFile handling\n1.4\nPreflight\nprocedures\nCOMMUNICATION\n1.5\nQuality control\nprocedures\n1.1 Understanding\nwork instructions\n1.2 Preparing printing\nrequirements\n1.3 Checking of files\n1.4 Checking of\nprinting quality\n1.5 Oral and written\ncommunications\n2. Perform plate\nrecording and\nprocessing\nmethods\n2.1 Computer-to-Plate (CtP)\nsystem is selected and\naccording to work\ninstructions.\n2.2 Computer-to-Plate\nsystem is prepared\naccording to established\nprocedure.\n2.3 Ready-file is reviewed\nbefore sending to Raster\nImage Processor (RIP).\n2.4 Plate making make-\nready is performed\naccording to established\nprocedures.\n2.5 Ripped file is examined\nagainst the contract\nTECHNOLOGY\n2.1\nParts and\nfunctions of\nComputer-to-\nPlate equipment\n2.2\nMake-ready of\nplate making\n2.3\nRaster Image\nProcessor\nfunctions\n2.4\nImage Recording\nSystem\nCOMMUNICATION\n2.5\nPlate quality\ninspections\nENVIRONMENT\n2.1 Preparing\ncomputer to plate\nsystem\n2.2 Ripping of data\nfiles\n2.3 Checking of proof\n2.4 6’s principles\n\n--- PDF PAGE 62 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n58\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nproof according to\nestablished procedures.\n2.6 Imaging procedures\nare performed according\nto established\nprocedures.\n2.7 Plate is inspected and\nforwarded to relevant\npersons for the next\nprinting process.\n2.6\nProper handling\nof consumables\n3. Perform die-\ncutting guide\nfor die-knife\nmaking\noutput\noperations\n3.1 Source of die-cutting\nguide dimensions are\ndetermined based on\nwork instructions.\n3.2. Die-cutting guide making\nis performed using\nvector graphic editor\nsoftware according to\nestablished procedures.\n3.2 Line assignments are\nset according to work\ninstructions.\n3.3 Finished die-cutting\nguide layout is saved in\nthe file extension\nformat/s.\n3.4 Finished die-cutting\nguide layout is printed\nfor inspections.\n3.5 Mocked-up process is\nperformed according to\nwork instructions.\n3.6 Mock-up sample is\npresented to relevant\nperson for approval.\nTECHNOLOGY\n3.1\nVector graphic\neditor software\nMATHEMATICS\n3.2\nMensuration\nENVIRONMENT\n3.3\nMock-process\nprocedures\n\n3.1 Measuring skills\n3.2 Drawing skills\n3.3 Managing data\n3.4 Printing of layout\n3.5 Forming skills\n3.6 Communication\nskills\n\n--- PDF PAGE 63 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n59\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Ready\nMay include:\n1.1 Power on\n1.2 Printer is online\n1.3 Nozzle tested and cleaned\n1.4 Enough ink contents\n1.5 Enough media\n1.6 Raster Image Processor (RIP) is ready\n2. Printing Requirements\nMay include:\n2.1 Correct media\n2.2 Color profile assignment\n3. Data File\nMay include:\n3.1 Latest approved in-house produced data file\n3.2 Archived file for repeat orders\n3.3 Client’s supplied ready-to-print file\n4. Quality Checked\nMay include:\n4.1 No banding\n4.2 Actual size\n4.3 No font errors\n4.4 Standard image quality\n4.5 All elements are present\n4.6 No unwanted images\n4.7 Correct color profile assignment\n5. Prepared\nMay include:\n5.1 Recording unit is ready\n5.2 Developing and stacking units are ready\n5.3 Raster image processing computer is ready\n5.4 Raster image processing software is on-line\n5.5 Plate calibration is set according to standards\n5.6 Required room lights are ready\n6. Reviewed\nMay include:\n6.1 All required marks are present\n6.2 All required marks are in the correct placement\n6.3 All elements of a ready-file are present compared to\napproved contract proof\n6.4 Ready-file layout size is correct based on computer-\nto-plate output instructions\n7. Make-ready\nMay include:\n7.1 Converting of data file into Portable Document File\n(.pdf) or Postscript file (.ps)\n7.2 Setting of halftone frequency\n7.3 Setting of dot shapes\n7.4 Setting of plate gripper margin\n\n--- PDF PAGE 64 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n60\nVARIABLE\nRANGE\n7.5 Importing converted data into the Raster Image\nProcessor for 1-bit processing\n7.6 Checking of Raster Image Processor logs for errors\n8. Examined\nMay include:\n8.1 All fonts are present and correct\n8.2 All layout elements are present\n8.3 Image trapping and overprint are well performed\n8.4 Correct special color and process color assignments\n8.5 Single color text and lines are properly performed\n8.6 Correct dot shapes\n8.7 No unwanted images\n9. Imaging Procedures\nMay include:\n9.1 Plate recording\n9.2 Plate developing/washing\n9.3 Plate gumming\n9.4 Plate drying\n9.5 Plate stacking\n10. Inspected\nMay include:\n10.1 Plate dent\n10.2 Plate scratches\n10.3 Skewed image\n10.4 Wrong gripper margins\n10.5 Unwanted images\n10.6 All elements are present according to contract proof\n10.7 Plate identifications are properly labelled\n10.8 No broken text or images\n10.9 Plate control wedge did not meet established\nstandards\n11. Source\nMay include:\n11.1 Client’s supplied dimensions\n11.2 Sample copy dimensions\n11.3 Dimensions based on work instructions for\ndevelopment stage\n12. Performed\nMay include:\n12.1 Drawing of straight lines and corners\n12.2 Drawing of curves lines\n12.3 Setting the offset of lines and angles\n13. Line assignments\nMay include:\n13.1 Assigning lines for through/kiss blades\n13.2 Assigning lines for scoring/creasing blades\n13.3 Assigning lines for perforating blades\n14. File Extention Format/s May include:\n14.1 Vectored Graphic Format\n14.2 Portable Document Format\n\n--- PDF PAGE 65 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n61\nVARIABLE\nRANGE\n14.3 Encapsulated Postscript\n15. Inspections\nMay include:\n15.1 Correct layout size\n15.2 Correct line assignments\n16. Mocked-up process\nMay include:\n16.1 Cutting\n16.2 Folding\n16.3 Gluing\n17. Relevant Person\nMay include:\n17.1 Client\n17.2 Account Executive\n17.3 Customer Service Representative\n17.4 Production Manager\n17.5 Prepress Supervisor\n17.6 Team Leader\n17.7 Designer\n\n--- PDF PAGE 66 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n62\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared printing requirements of a job\n1.2 Performed quality check of printed proof\n1.3 Reviewed ready-file before sending to Raster Image\nProcessor (RIP)\n1.4 Performed plate making make-ready\n1.5 Examined ripped file against the contract proof\n1.6 Inspected plate and submitted to relevant persons\nfor the next printing process\n1.7 Performed die-cutting guide making using vector\ngraphic editor software\n1.8 Set line assignments\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workshop appropriate for the unit of competency\n2.2 Tools, materials and equipment, appropriate for the\nunit of competency\n2.3 Video clips\n2.4 Case work\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n3.3 Written Examination\n3.4 Interview\n4. Context for Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 67 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n63\nUNIT OF COMPETENCY\n: PERFORM IMPOSITION PROCEDURES\n\nUNIT CODE\n:"
