        "source_text": "--- PDF PAGE 52 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n48 \n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY \n: PERFORM HALFTONE REPRODUCTION AND ITS \nREQUIREMENTS  \n \n \n \nUNIT CODE \n: SOC732306 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge skills and attitudes required \nto perform halftone reproduction and its requirements and \nthe application of commonly used tools and equipment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nhalftone \nreproduction \nand its \nrequirements \n1.1 File copy is identified for \nhalftone reproduction. \n1.2 Image capturing \ndevices are identified & \nprepared according to \nthe task to be \nundertaken. \n1.3 Appropriate software is \nselected in accordance \nto specified reproduction \nrequirements. \nTECHNOLOGY \n1.1 \nImage capturing \ndevices \npreparation \n1.2 \nSelection of \nappropriate \nsoftware \n1.3 \nComputer \noperation  \nCOMMUNICATION \n1.4 \nIdentification of \nhalftone \nreproduction \n1.5 \nVerbal and \nwritten \ncommunication \n1.1 Effective \ncommunication \nskills \n1.2 Determining \ndifferences \nbetween hard \nand soft copy  \n1.3 Operating \ndifferent image \ncapturing devices \n1.4 Applying scanner \nsoftware \n1.5 6S principles \n2. Convert a \ncontinuous \ntone copy into \na printable \nimage \n2.1 Materials to be \nreproduced are checked \nif complete, fully \nidentified & had \ncomplied according to \nwork instructions. \n2.2 Checking is conducted \non original copy to be \nreproduced. \n2.3 Image capturing device \nsettings are set \naccording to established \nprocedures. \n2.4 Hard copy is captured in \naccordance to specified \nreproduction \nrequirements. \nCOMMUNICATION \n2.1 \nJob specification  \n2.2 \nClient \nrequirements \n2.3 \nFlow of \ncommunication \n2.4 \nTask planning \nand preparation \n2.5 \nInformation on \ncharacteristic of \nmaterials \n2.1 Gathering client’s \nspecifications \n2.2 Checking client’s \nrequirements \n2.3 Handling / keeping \nsupplied materials \nwith care \n2.4 Planning and \npreparing task\n\n--- PDF PAGE 53 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n49 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Recommend \nappropriate \nhalftone dot \nfrequency \nand dot \nshapes  \n3.1 Paper-ink-press \ncharacteristics is \ndetermined according to \nwork instructions. \n3.2 Appropriate halftone \nspecifications are \nrecommended in \naccordance with \nestablished procedures. \n3.3 Copy of reproduced \nimage is saved in an \nappropriate format for the \nnext printing process. \nTECHNOLOGY \n3.1 \nComputer \nfunctions \n3.2 \nVarious software \napplications and \ntheir usage \n3.3 \nInstallation of \nidentified various \ntypes of fonts \n3.1 Computer skills \n3.2 Using different \nsoftware \napplications \nrelated to printing \n3.3 Identifying and \ninstalling various \nfonts\n\n--- PDF PAGE 54 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n50 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Copy \nMay include: \n1.1 Hard Copy \n1.2 Soft Copy \n2. Image Capturing Devices \nMay include: \n2.1 Scanner \n2.2 Digital Camera \n2.3 Video Camera \n2.4 Mobile Camera \n2.5 3D Camera \n2.6 Print Screen \n3. Appropriate Software \nApplication \nMay include: \n3.1 Scanning Software \n3.2 Image Manipulation and Editing Software \n4. Materials \nMay include: \n4.1 Reflection Copy \n4.2 Transparencies \n4.3 Artwork Materials  \n5. Check on original copy \nMay include: \n5.1 Color Quality \n5.2 Sharpness \n5.3 Contrast \n6. Device Settings \nMay include: \n6.1 Image resolution \n6.2 Magnification \n6.3 Color Mode \n6.4 Sharpness Settings \n7. Specified Reproduction \nRequirements \nMay include: \n7.1 Tonal Correction \n7.2 Color Correction \n7.3 Detail Enhancement \n8. Paper-ink-press \nCharacteristics \nMay include: \n8.1 Substrate \n8.2 Ink \n8.3 Press \n9. Halftone Specifications \nMay include: \n9.1 Frequency (AM, FM, Hybrid) \n9.2 Dot Shapes\n\n--- PDF PAGE 55 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n51 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified file copy for halftone reproduction. \n1.2 Identified and prepared image capturing devices. \n1.3 Selected appropriate software. \n1.4 Checked completeness, fully identified and \ncomplied materials to be reproduced. \n1.5 Conducted checking on original copy to be \nreproduced. \n1.6 Set image capturing device settings. \n1.7 Captured hard copy according to specified \nreproduction requirements. \n1.8 Determined paper-ink-press characteristics. \n1.9 Recommended appropriate halftone \nspecifications. \n2. Resource Implications \nThe following resources should be provided: \n2.1 \nWorkshop appropriate for the unit of competency \n2.2 \nTools, materials and equipment, appropriate for \nthe unit of competency \n2.3 \nVideo clips \n2.4 \nCase work \n3. Methods of Assessment \nCompetency in this unit may be assessed through:     \n3.1 \nDemonstration with questioning \n3.2 \nObservation with questioning \n3.3 \nWritten Examination \n3.4 \nInterview \n4. Context for Assessment \n4.1 \nCompetency may be assessed in the actual \nworkplace or at the designated TESDA \nAccredited Assessment Center.\n",
