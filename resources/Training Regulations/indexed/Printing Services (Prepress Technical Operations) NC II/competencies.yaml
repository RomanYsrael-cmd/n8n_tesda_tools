ucts\n2.2\nConcept of job\nnesting\n2.3\nDie-cutting knife\nfunction\n2.4\nDie-line\ninterpretation\nENVIRONMENT\n2.5\nQuality control\nmethods\n2.1 Performing\nquality inspection\n2.2 Nesting of jobs\n2.3 Interpreting work\ninstructions\n2.4 Applying line\nreproduction\nrequirements\n\n--- PDF PAGE 68 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n64\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nnested in accordance\nwith work instructions.\n2.5 Nested jobs are checked\nto avoid printing errors\naccording to established\nquality control\nprocedures.\n3. Insert\nrequired\nmarks for\npress and\npost-press\n3.1 Required marks for\npress are inserted\naccording to press\nestablished procedures.\n3.2 Required marks for\npost-press are inserted\naccording to post-press\nestablished procedures.\n3.3 Other information\nmarks are inserted\naccording to established\nprocedures.\nCOMMUNICATION\n3.1\nFunctions of\nmarks\n3.2\nMarks for press\nrequirements\n3.3\nMarks of post-\npress\nrequirements\n3.4\nInformation\nmarks needed for\narchiving\n3.1 Inserting various\ntypes of marks\n3.2 Positioning of\nmarks\n4. Perform\nmanual /\nautomatic\nimposition\n4.1 Individual pages are\nimposed either manually\nor electronically.\n4.2 Imposition is reviewed\naccording to established\ncompany standards.\n4.3 Final imposed job is\nsaved in preparation for\nthe next process.\nCOMMUNICATION\n4.1\nConcept of\nmanual\nimposition\n4.2\nConcept of\nelectronic\nimposition\n4.3\nArchiving\nprocedures\n4.1 Imposing\nmanually\n4.2 Imposing\nelectronically\n4.3 Reviewing\nimposed jobs\n5. Print a small\nscale sample\nfor checking\n5.1 Small scale sample\n(25%) of the imposed job\nis printed for final\nimposition check.\n5.2 Folding sequence is\nchecked in accordance\nwith the binding\nrequirements.\n5.3 Folded pages are\narranged in order in\naccordance with work\ninstruction.\nTECHNO