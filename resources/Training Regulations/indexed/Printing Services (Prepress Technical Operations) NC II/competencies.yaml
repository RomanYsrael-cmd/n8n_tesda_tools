ly effective\npeople\n\n1.1 Identifying\nopportunities to\nimprove and to do\nthings better\ninvolvement\n1.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation\n1.3 Identifying\nexamples of the\ntypes of changes\nthat are within and\noutside own scope\nof responsibility\n2. Discuss and\ndevelop\nideas with\nothers\n2.1 People who could\nprovide input to ideas\nfor improvements are\nidentified.\n2.2 Ways of approaching\npeople to begin sharing\nideas are selected.\n2.3 Meeting is set with\nrelevant people.\n2.4 Ideas for follow up are\nreview and selected\nbased on feedback.\n2.5 Critical inquiry method\nis used to discuss and\ndevelop ideas with\nothers.\n2.1 Roles of\nindividuals in\nsuggesting and\nmaking\nimprovements\n2.2 Positive impacts\nand challenges in\ninnovation\n2.3 Types of changes\nand responsibility\n2.4 Seven habits of\nhighly effective\npeople\n\n2.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement\n2.2 Identifying the\npositive impacts\nand the\nchallenges of\nchange and\ninnovation\n2.3 Providing\nexamples of the\ntypes of changes\nthat are within and\noutside own scope\nof responsibility\n2.4 Communicating\nideas for change\nthrough small\ngroup discussions\nand meetings\n\n--- PDF PAGE 23 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n19\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Integrate\nideas for\nchange in\nthe\nworkplace\n3.1 Critical inquiry method is\nused to integrate\ndifferent ideas for\nchange of key people.\n3.2 Summarizing, analyzing\nand generalizing skills\nare used to extract\nsalient points in the pool\nof ideas.\n3.3 Reporting skills are\nlikewise used to\ncommunicate results.\n3.4 Current Issues and\nconcerns on the\nsystems, processes and\nprocedures, as well as\nthe need for simple\ninnovative practices are\nidentified.\n3.1 Roles of\nindividua