        "source_text": "SOC732309\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, attitudes, and values\nrequired to perform imposition procedures which include\ncreating, nesting, inserting, imposing, and reviewing data\nusing the appropriate materials and software. It also\nincludes the application of commonly used tools and\nequipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Create a\nmaster layout\nfor publication\n1.1 Pagination of folding\ndummy is checked\nagainst soft copy\npagination.\n1.2 Master layout is created\nusing the appropriate\nsoftware in accordance\nwith work instructions.\n1.3 Imposition\nmeasurements are set\nin accordance with\nestablished procedures.\nTECHNOLOGY\n1.1\nComputer\napplication\nMATHEMATICS\n1.2\nBasic\nmeasurement\nCOMMUNICATION\n1.3\nVerbal and\nwritten\ncommunication\n1.4\nVarious types of\nfolding dummy\n1.5\nPress and post-\npress\nrequirements\n1.6\nConcept of\nimposition\n1.1 Communication\nSkills\n1.2 Interpersonal\nskills\n1.3 Operating\ncomputer\n1.1 Performing\nimposition\napplication\n2. Perform\nnesting of\njobs\n2.1 Design layout and die-\ncutting layout are\nchecked if all elements\nare complete according\nto work instructions.\n2.2 Die-cutting layout is\nchecked if it conforms\nwith the size of the\ndesign layout.\n2.3 Layout with die-cutting\nguide is compared\nagainst the mock-up\nsample provided by the\nclient.\n2.4 Layout with or without\ndie-cutting guide is\nCOMMUNICATION\n2.1\nProcedures on\nproducing\npackaging\nproducts\n2.2\nConcept of job\nnesting\n2.3\nDie-cutting knife\nfunction\n2.4\nDie-line\ninterpretation\nENVIRONMENT\n2.5\nQuality control\nmethods\n2.1 Performing\nquality inspection\n2.2 Nesting of jobs\n2.3 Interpreting work\ninstructions\n2.4 Applying line\nreproduction\nrequirements\n\n--- PDF PAGE 68 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n64\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nnested in accordance\nwith work instructions.\n2.5 Nested jobs are checked\nto avoid printing errors\naccording to established\nquality control\nprocedures.\n3. Insert\nrequired\nmarks for\npress and\npost-press\n3.1 Required marks for\npress are inserted\naccording to press\nestablished procedures.\n3.2 Required marks for\npost-press are inserted\naccording to post-press\nestablished procedures.\n3.3 Other information\nmarks are inserted\naccording to established\nprocedures.\nCOMMUNICATION\n3.1\nFunctions of\nmarks\n3.2\nMarks for press\nrequirements\n3.3\nMarks of post-\npress\nrequirements\n3.4\nInformation\nmarks needed for\narchiving\n3.1 Inserting various\ntypes of marks\n3.2 Positioning of\nmarks\n4. Perform\nmanual /\nautomatic\nimposition\n4.1 Individual pages are\nimposed either manually\nor electronically.\n4.2 Imposition is reviewed\naccording to established\ncompany standards.\n4.3 Final imposed job is\nsaved in preparation for\nthe next process.\nCOMMUNICATION\n4.1\nConcept of\nmanual\nimposition\n4.2\nConcept of\nelectronic\nimposition\n4.3\nArchiving\nprocedures\n4.1 Imposing\nmanually\n4.2 Imposing\nelectronically\n4.3 Reviewing\nimposed jobs\n5. Print a small\nscale sample\nfor checking\n5.1 Small scale sample\n(25%) of the imposed job\nis printed for final\nimposition check.\n5.2 Folding sequence is\nchecked in accordance\nwith the binding\nrequirements.\n5.3 Folded pages are\narranged in order in\naccordance with work\ninstruction.\nTECHNOLOGY\n5.1\nAdvance printer’s\npreference\nCOMMUNICATION\n5.2\nRequirements for\nbinding\n5.3\nRequirements for\nnesting\n5.1 Collating\nsignatures\n5.2 Insertions of\nsignatures\n5.3 Checking of\nprinted copies\n\n--- PDF PAGE 69 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n65\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Folding Dummy\nMay include:\n1.1\nFor Web-press folding\n1.2\nFor stand-alone folding machine\n1.3\nFor saddle stitching\n1.4\nFor smyth sewn binding\n1.5\nFor special type of folding\n2. Soft Copy\nMay include:\n2.1\nDesign and Lay-out\n2.2\nVectored Graphic\n2.3\nEncapsulated Postscript\n2.4\nPortable Document Format\n2.5\nRastered Graphic\n3. Master Layout\nMay include:\n3.1\nBooks master layout\n3.2\nMagazine master layout\n3.3\nJournal master layout\n3.4\nBrochure master layout\n4. Imposition Measurement\nMay include:\n4.1\nHead distance\n4.2\nCreep\n4.3\nFolding allowance\n4.4\nSpine allowance\n4.5\nTrimming allowance\n4.6\nFinal trim size\n4.7\nGripper allowance\n5. Layout\nMay include:\n5.1\nApproved design\n5.2\nClient supplied file\n5.3\nRepeat order job\n6. Die-cutting\nMay include:\n6.1\nCreasing blade\n6.2\nPerforation blade\n6.3\nCutting blade\n7. Mock-up sample\nMay include:\n7.1\nSample product\n7.2\nPrototype\n7.3\nContract proof\n8. Nested\nMay include:\n8.1\nSingle job step and repeat\n8.2\nMultiple design step and repeat\n9. Printing Errors\nMay include:\n9.1\nUnwanted image cropping\n\n--- PDF PAGE 70 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n66\nVARIABLE\nRANGE\n9.2\nWrong orientation of image against media grain\ndirection\n9.3\nMeasurement errors\n9.4\nFolding errors\n10. Marks for Press\nMay include:\n10.1 Registration marks\n10.2 Print control bars\n10.3 Drop guide marks\n10.4 Side guide marks\n10.5 Print color indicator\n10.6 Plate marks\n10.7 Plate control wedge\n11. Marks for post press\nMay include:\n11.1 Folding guide marks\n11.2 Trimming marks\n11.3 Bleed marks\n11.4 Collating index marks\n11.5 Quality inspection marks\n11.6 Gluing Marks\n12. Information Marks\nMay include:\n12.1 Security marks\n12.2 Job information box\n13. Reviewed\nMay include:\n13.1 Duplication of pages\n13.2 Missing pages\n13.3 Alignment of imposed pages\n13.4 Overlapped pages\n13.5 Inadequate/excess bleeds\n13.6 Total number of flats\n13.7 Cropped pages\n13.8 Page rotation\n13.9 Presence of marks\n13.10 Margins\n14. Final imposition check\nMay include:\n14.1 Correct order of pages\n14.2 Correct rotation of pages\n14.3 Correct order of signatures\n14.4 Required marks\n15. Binding requirements\nMay include:\n15.1 Single perfect bind\n15.2 Double roll perfect bind\n15.3 Saddle bind\n15.4 Smyth bind\n15.5 Side stitch bind\n\n--- PDF PAGE 71 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n67\nVARIABLE\nRANGE\n15.6 Other type of binding\n16. Order\nMay include:\n16.1 Insertion gathering\n16.2 Collating gathering\n\n--- PDF PAGE 72 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n68\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Created master layout using the appropriate software\n1.2 Set imposition measurements\n1.3 Checked design layout and die-cutting layout if all\nelements are complete\n1.4 Checked die-cutting layout if it conforms with the size\nof the design layout\n1.5 Nested layout with or without die-cutting guide\n1.6 Checked nested jobs to avoid printing errors\n1.7 Inserted required marks for press\n1.8 Inserted required marks for post-press\n1.9 Imposed individual pages either manually or\nelectronically\n1.10 Reviewed imposition according to established\ncompany standards\n1.11 Checked folding sequence in accordance with the\nbinding requirements\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workshop appropriate for the unit of competency\n2.2 Tools, materials and equipment, appropriate for the\nunit of competency\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n3.3 Written Examination\n3.4 Interview\n4. Context for\nAssessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 73 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n69\n\nUNIT OF COMPETENCY\n: PERFORM REGULAR MAINTENANCE OF\nCONDITION-BASED PREPRESS\nMACHINES/EQUIPMENT\n\nUNIT CODE\n:"
