r the\nunit of competency\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n3.3 Written Examination\n3.4 Interview\n4. Context for\nAssessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 73 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n69\n\nUNIT OF COMPETENCY\n: PERFORM REGULAR MAINTENANCE OF\nCONDITION-BASED PREPRESS\nMACHINES/EQUIPMENT\n\nUNIT CODE\n: SOC532310\n\nUNIT DESCRIPTOR\n: This unit deals with the knowledge, skills and discipline\nneeded to monitor the actual condition of prepress\nmachines/equipment and recommend what maintenance\nneeded to be done.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform\ninspection on\nmajor parts of\nequipment/m\nachines\nbased on the\nagreement\nwith the\nsupplier\n1.1 Inspection is performed\nregarding the wear and\ntear of major parts of\nequipment/machines.\n1.2 Inspections are\nperformed on\nink/water/air flow\nsystems of\nequipment/machines for\npossible clogging and\ndamage.\n1.3 Inspections are\nperformed on the output\nquality of various digital\noutputting machines.\nTECHNOLOGY\n1.1\nParts of\nequipment/\nmachines\n1.2\nEquipment/machi\nnes consumables\n1.3\nInk/water/air flow\nsystems\n1.4\nOutput quality\nstandards\n1.5\nVarious digital\nprepress\nmachines\nCOMMUNICATION\n1.6\nSupplier-client\nmaintenance\nagreement\n1.1 Inspecting parts of\nprepress\nmachines/\nequipment\n1.2 Inspecting output\nquality\n1.3 Inspecting\nink/water/air flow\nsystems\n2. Perform fault\nfinding check\non the\ninspected\nparts of\nequipment/m\nachines\n2.1 Fault finding check is\nperformed on machine\nparts in accordance with\nestablished procedures.\n2.2 Fault finding check is\nrecorded in accordance\nwith established\nprocedu