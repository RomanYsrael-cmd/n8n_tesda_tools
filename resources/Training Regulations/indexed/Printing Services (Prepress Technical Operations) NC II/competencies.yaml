        "source_text": "--- PDF PAGE 73 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n69 \n \nUNIT OF COMPETENCY \n: PERFORM REGULAR MAINTENANCE OF \nCONDITION-BASED PREPRESS \nMACHINES/EQUIPMENT \n \n \n \nUNIT CODE \n: SOC532310 \n \n \n \nUNIT DESCRIPTOR \n: This unit deals with the knowledge, skills and discipline \nneeded to monitor the actual condition of prepress \nmachines/equipment and recommend what maintenance \nneeded to be done. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Perform \ninspection on \nmajor parts of \nequipment/m\nachines \nbased on the \nagreement \nwith the \nsupplier \n1.1 Inspection is performed \nregarding the wear and \ntear of major parts of \nequipment/machines. \n1.2 Inspections are \nperformed on \nink/water/air flow \nsystems of \nequipment/machines for \npossible clogging and \ndamage. \n1.3 Inspections are \nperformed on the output \nquality of various digital \noutputting machines. \nTECHNOLOGY \n1.1 \nParts of \nequipment/ \nmachines \n1.2 \nEquipment/machi\nnes consumables \n1.3 \nInk/water/air flow \nsystems \n1.4 \nOutput quality \nstandards \n1.5 \nVarious digital \nprepress \nmachines \nCOMMUNICATION \n1.6 \nSupplier-client \nmaintenance \nagreement \n1.1 Inspecting parts of \nprepress \nmachines/ \nequipment \n1.2 Inspecting output \nquality \n1.3 Inspecting \nink/water/air flow \nsystems \n2. Perform fault \nfinding  check \non the \ninspected \nparts of \nequipment/m\nachines \n2.1 Fault finding check is \nperformed on machine \nparts in accordance with \nestablished procedures. \n2.2 Fault finding check is \nrecorded in accordance \nwith established \nprocedures. \n2.3 Fault finding check \nreports are submitted to \nrelevant person for further \nactions. \nCOMMUNICATION \n2.1 \nFault finding \ncheck on various \nprepress \nmachines/ \nequipment \n2.1 Communication \nskills \n2.2 Analytical skills \n2.3 Critical thinking \nskills\n\n--- PDF PAGE 74 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n70 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Major parts \nMay include: \n1.1 \nPrinthead \n1.2 \nRollers \n1.3 \nCutting plotter blade \n1.4 \nMachine power cords and other external cords \n1.5 \nDiode \n2. Ink/water/air flow \nsystems \nMay include: \n2.1 \nPrinter’s ink tubing system \n2.2 \nPlate processor’s hose \n2.3 \nPlate processor’s water filter \n2.4 \nAir-conditioning unit filter, evaporator and condenser \n3. Output quality \nMay include: \n3.1 \nPlate calibrations \n3.2 \nPlate control wedge standards \n3.3 \nProofing machine print quality \n3.4 \nCutting plotter blade sharpness \n4 Fault Finding Check \nMay include: \n4.1 \nMachine  \n4.2 \nProcess  \n4.3 \nHuman\n\n--- PDF PAGE 75 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n71 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed inspection regarding the wear and tear \nof major parts of equipment/machines. \n1.2 Performed inspection on the output quality of \nvarious digital outputting machines. \n1.3 Performed fault finding check on machine parts. \n1.4 Recorded fault finding check. \n1.5 Submitted fault finding check reports to relevant \nperson for further actions. \n2. Resource Implications \nThe following resources should be provided: \n2.1 Workshop appropriate for the unit of competency \n2.2 Tools, materials and equipment, appropriate for \nthe unit of competency \n2.3 Video clips \n2.4 Case work \n3. Methods of Assessment \nCompetency in this unit may be assessed through:     \n3.1 Demonstration with questioning \n3.2 Observation with questioning \n3.3 Written Examination \n3.4 Interview \n4. Context for Assessment \n4.1 Competency may be assessed in the actual \nworkplace or at the designated TESDA Accredited \nAssessment Center.\n",
