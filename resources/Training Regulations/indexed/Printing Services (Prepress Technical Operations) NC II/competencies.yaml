        "source_title": "PRESENT RELEVANT INFORMATION",
        "source_text": "--- PDF PAGE 27 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n23 \nUNIT OF COMPETENCY \n: PRESENT RELEVANT INFORMATION \n \n \n \nUNIT CODE \n: 400311215 \n \n \n \nUNIT DESCRIPTOR \n: This unit of covers the knowledge, skills and attitudes \nrequired to present data/information appropriately. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Gather data/ \ninformation \n1.1 Evidence, facts and \ninformation are \ncollected. \n1.2 Evaluation, terms of \nreference and \nconditions are reviewed \nto determine whether \ndata/information falls \nwithin project scope. \n \n1.1 Organisational \nprotocols  \n1.2 Confidentiality \n1.3 Accuracy \n1.4 Business \nmathematics and \nstatistics \n1.5 Data analysis \ntechniques/ \nprocedures \n1.6 Reporting \nrequirements to a \nrange of audiences \n1.7 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n1.8 Organisational \nvalues, ethics and \ncodes of conduct \n1.1 Describing \norganisational \nprotocols relating \nto client liaison \n1.2 Protecting \nconfidentiality \n1.3 Describing \naccuracy \n1.4 Computing \nbusiness \nmathematics and \nstatistics \n1.5 Describing data \nanalysis \ntechniques/ \nprocedures \n1.6 Reporting \nrequirements to a \nrange of \naudiences \n1.7 Stating legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n1.8 Stating \norganisational \nvalues, ethics and \ncodes of conduct\n\n--- PDF PAGE 28 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n24 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Assess \ngathered \ndata/ \ninformation \n2.1 Validity of data/ \ninformation is assessed. \n2.2 Analysis techniques are \napplied to assess data/ \ninformation. \n2.3 Trends and anomalies \nare identified. \n2.4 Data analysis \ntechniques and \nprocedures are \ndocumented. \n2.5 Recommendations are \nmade on areas of \npossible improvement. \n \n \n2.1 Business \nmathematics and \nstatistics \n2.2 Data analysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of audiences \n2.4 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n2.5 Organisational \nvalues, ethics and \ncodes of conduct \n2.1 Computing \nbusiness \nmathematics and \nstatistics \n2.2 Describing data \nanalysis \ntechniques/ \nprocedures \n2.3 Reporting \nrequirements to a \nrange of \naudiences \n2.4 Stating \nlegislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n2.5 Stating \norganisational \nvalues, ethics and \ncodes of conduct \n3. Record and \npresent \ninformation  \n3.1 Studied data/information \nare recorded. \n3.2 Recommendations are \nanalysed for action to \nensure they are \ncompatible with the \nproject’s scope and \nterms of reference. \n3.3 Interim and final reports \nare analysed and \noutcomes are compared \nto the criteria established \nat the outset. \n3.4 Findings are presented to \nstakeholders. \n3.1 Data analysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of audiences \n3.3 Legislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Organisational \nvalues, ethics and \ncodes of conduct \n3.1 Describing data \nanalysis \ntechniques/ \nprocedures \n3.2 Reporting \nrequirements to a \nrange of \naudiences \n3.3 Stating \nlegislation, policy \nand procedures \nrelating to the \nconduct of \nevaluations \n3.4 Stating \norganisational \nvalues, ethics and \ncodes of conduct \npractices\n\n--- PDF PAGE 29 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n25 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Data analysis techniques \nMay include but not limited to: \n1.1. Domain analysis \n1.2. Content analysis \n1.3. Comparison technique \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determine data / information \n1.2 Studied and applied gathered data/information \n1.3 Recorded and studied data/information \n \nThese aspects may be best assessed using a range of \nscenarios what ifs as a stimulus with a walk through forming \npart of the response. These assessment activities should \ninclude a range of problems, including new, unusual and \nimprobable situations that may have happened. \n2. Resource Implications \nSpecific resources for assessment \n2.1 Evidence of competent performance should be \nobtained by observing an individual in an information \nmanagement role within the workplace or operational \nor simulated environment. \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Interview \n3.3 Portfolio   \n \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other \nrelevant units of competency. Assessment will occur over a \nrange of situations, which will include disruptions to normal, \nsmooth operation. Simulation may be required to allow for \ntimely assessment of parts of this unit of competency. \nSimulation should be based on the actual workplace and \nwill include walk through of the relevant competency \ncomponents.  \n4. Context for Assessment \n4.1 In all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.\n",
