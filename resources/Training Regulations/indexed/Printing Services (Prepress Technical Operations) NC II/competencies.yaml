  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required in\nPRINTING SERVICES (PREPRESS TECHNICAL OPERATIONS) NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n: PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n: 400311210\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources.\n1.2 Effective questioning,\nactive listening and\nspeaking skills are used\nto gather and convey\ninformation.\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas.\n1.4 Appropriate non- verbal\ncommunication is used.\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed.\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used.\n1.7 Personal interaction is\ncarried out clearly and\nconcisely.\n\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing\nroutine workplace\nduties following\nsimple written\nnotices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated\ndocuments\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n\n--- PDF PAGE 7 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.8 Applying basic\nbusiness writing\nskills\n1.9 Applying\ninterpersonal\nskills in the\nworkplace\n1.10 Performing\nactive-listening\nskills\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are read and\ninterpreted in\naccordance with\norganizational\nguidelines.\n2.2 Routine written\ninstruction is followed\nbased on established\nprocedures.\n2.3 Feedback is given to\nworkplace supervisor-\nbased instructions/\ninformation received.\n2.4 Workplace interactions\nare conducted in a\ncourteous manner.\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and matters\nconcerning conditions of\nemployment are sought\nand asked from\nappropriate sources.\n2.6 Meeting outcomes are\ninterpreted and\nimplemented.\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nworkplace policies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n2.1 Following simple\nspoken\ninstructions\n2.2 Performing\nroutine workplace\nduties following\nsimple written\nnotices\n2.3 Participating in\nworkplace\nmeetings and\ndiscussions\n2.4 Completing work-\nrelated\ndocuments\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Applying basic\nquestioning/\nquerying\n2.9 Applying skills in\nreading for\ninformation\n2.10 Applying skills in\nlocating\n\n--- PDF PAGE 8 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating\nto conditions of\nemployment are\ncompleted accurately\nand legibly.\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments.\n3.3 Errors in recording\ninformation on forms/\ndocuments are identified\nand acted upon.\n3.4 Reporting requirements\nto supervisor are\ncompleted according to\norganizational guidelines.\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace policies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n3.1 Completing work-\nrelated\ndocuments\n3.2 Applying\noperations of\naddition,\nsubtraction,\ndivision and\nmultiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Applying effective\nrecord keeping\nskills\n\n--- PDF PAGE 9 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n5\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1.\nTeam members\n1.2.\nSupervisor/Department Head\n1.3.\nSuppliers\n1.4.\nTrade personnel\n1.5.\nLocal government\n1.6.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation dissemination\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace-to-face communication\n2.7.\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace interactions\nMay include:\n4.1.\nFace-to-face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic means, memos,\ninstruction and forms\n4.5.\nNon-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 10 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n6\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard\nformat of the organization\n1.2 Accessed information using workplace\ncommunication equipment/systems\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting formal or\ninformal communication\n2. Resource Implications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Notebook\n2.4 Writing materials\n2.5 Computer with Internet connection\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Written test\n3.4 Third-party report\n4. Context for Assessment\n4.1 Competency may be assessed individually in the\nactual workplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n7\n\nUNIT OF COMPETENCY\n: WORK IN A TEAM ENVIRONMENT\n\nUNIT CODE\n: 400311211\n\nUNIT DESCRIPTOR\n: This unit covers the skills, knowledge and attitudes to\nidentify one’s roles and responsibilities as a member of a\nteam.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe\nteam role and\nscope\n1.1 The role and objective\nof the team is identified\nfrom available sources\nof information.\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources.\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles\nin the group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles and\nresponsibilities within the\nteam environment are\nidentified.\n2.2 Roles and objectives of\nthe team is identified\nfrom available sources\nof information.\n2.3 Team parameters,\nreporting relationships\nand responsibilities are\nidentified based on team\ndiscussions and\nappropriate external\nsources.\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles\nin the group or\norganization\n\n3. Work as a\nteam\nmember\n3.1 Effective and appropriate\nforms of communications\nare used and interactions\nundertaken with team\nmembers based on\ncompany practices.\n3.2 Effective and appropriate\ncontributions made to\ncomplement team\nactivities and objectives,\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning\nand decision\nmaking\n3.4 Team thinking\n3.1 Communicating\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as\n\n--- PDF PAGE 12 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n8\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nbased on workplace\ncontext.\n3.3 Protocols in reporting are\nobserved based on\nstandard company\npractices.\n3.4 Contribute to the\ndevelopment of team\nwork plans based on an\nunderstanding of team’s\nrole and objectives.\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace context\n\na group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\nMay include but not limited to:\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\nMay include but not limited to:\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\nMay include but not limited to:\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 14 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n10\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Worked in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.2 Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.3 Socio-drama and socio-metric methods\n3.4 Sensitivity techniques\n3.5 Written test\n4. Context for Assessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n11\nUNIT OF COMPETENCY\n: SOLVE/ADDRESS GENERAL WORKPLACE\nPROBLEMS\n\nUNIT CODE\n: 400311212\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to apply problem-solving techniques to determine\nthe origin of problems and plan for their resolution. It also\nincludes\naddressing\nprocedural\nproblems\nthrough\ndocumentation, and referral.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems or\nprocedural problem\nareas are identified.\n1.2 Problems to be\ninvestigated are defined\nand determined.\n1.3 Current conditions of the\nproblem are identified\nand documented.\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk\npractices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying current\nindustry hardware\nand software\nproducts and\nservices\n1.2 Identifying current\nindustry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying current\nindustry standard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n\n--- PDF PAGE 16 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n12\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential solutions to\nproblem are identified.\n2.2 Recommendations about\npossible solutions are\ndeveloped,\ndocumented, ranked\nand presented to\nappropriate person for\ndecision.\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating systems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying current\nindustry hardware\nand software\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating system\n2.4 Identifying current\nindustry standard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are planned.\n3.2 Evaluation of\nimplemented solutions\nare planned.\n3.3 Recommended solutions\nare documented and\nsubmit to appropriate\nperson for confirmation.\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat recommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 17 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include but not limited to:\n1.1\nRoutine/non – routine processes and quality problems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and incidents\n1.5\nWork-related problems outside of own work area\n2. Appropriate person\nMay include but not limited to:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include but not limited to:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include but not limited to:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 18 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n14\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends\nsolutions to problems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n\n2. Resource Implications\n2.1. Assessment will require access to a workplace over\nan extended period, or a suitable method of gathering\nevidence of operating ability over a range of\nsituations.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nCase Formulation\n3.2\nLife Narrative Inquiry\n3.3\nStandardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over a\nrange of situations, which will include disruptions to normal,\nsmooth operation. Simulation may be required to allow for\ntimely assessment of parts of this unit of competency.\nSimulation should be based on the actual workplace and\nwill include walk through of the relevant competency\ncomponents.\n4. Context for Assessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 19 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n15\n\nUNIT OF COMPETENCY\n: DEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n: 400311213\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice,\nand boosting self-confidence and developing self-regulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage\none’s\nemotion\n1.1 Self-management\nstrategies are identified.\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the face of\nsetbacks and frustrations\nare developed.\n1.3 Techniques for\neffectively handling\nnegative emotions and\nunpleasant situation in\nthe workplace are\nexamined.\n\n1.1 Self-management\nstrategies that\nassist in regulating\nbehavior and\nachieving personal\nand learning goals\n(e.g. Nine self-\nmanagement\nstrategies according\nto Robert Kelley)\n1.2 Enablers and\nbarriers in achieving\npersonal and career\ngoals\n1.3 Techniques in\nhandling negative\nemotions and\nunpleasant situation\nin the workplace\nsuch as frustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing properly,\none’s emotions\nand recognizing\nsituations that\ncannot be changed\nand accept them\nand remain\nprofessional\n1.2 Developing self-\ndiscipline, working\nindependently and\nshowing initiative\nto achieve\npersonal and\ncareer goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setback\nand frustrations\nand other negative\nemotions and\nunpleasant\nsituations in the\nworkplace\n2. Develop\nreflective\npractice\n2.1 Personal strengths and\nachievements, based on\nself-assessment\nstrategies and teacher\nfeedback are\ncontemplated.\n2.2 Progress when seeking\nand responding to\nfeedback from teachers\nto assist them in\nconsolidating strengths,\naddressing weaknesses\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\n2.1 Using the basic\nSWOT analysis\nas self-\nassessment\nstrategy\n2.2 Developing\nreflective practice\nthrough\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n\n--- PDF PAGE 20 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nand fulfilling their\npotential are monitored.\n2.3 Outcomes of personal\nand academic\nchallenges by reflecting\non previous problem\nsolving and decision-\nmaking strategies and\nfeedback from peers\nand teachers are\npredicted.\nConclusion, and\nAction plan)\n2.3 Demonstrating\nself-acceptance\nand being able to\naccept\nchallenges\n\n3. Boost self-\nconfidence\nand develop\nself-\nregulation\n3.1 Efforts for continuous\nself-improvement are\ndemonstrated.\n3.2 Counter-productive\ntendencies at work are\neliminated.\n3.3 Positive outlook in life\nare maintained.\n3.1 Four components of\nself-regulation\nbased on Self-\nRegulation Theory\n(SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help concepts\n(e. g., 7 Habits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting,\nconversing skills\n3.2 Showing affective\nskills – flexibility,\nadaptability, etc.\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 21 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n17\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include but not limited to:\n1.1\nSeeking assistance in the form of job coaching or\nmentoring\n1.2\nContinuing dialogue to tackle workplace grievances\n1.3\nCollective negotiation/bargaining for better working\nconditions\n1.4\nShare 