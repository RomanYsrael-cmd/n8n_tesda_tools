        "source_text": "--- PDF PAGE 6 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n2 \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the units of competency required in \nPRINTING SERVICES (PREPRESS TECHNICAL OPERATIONS) NC II. \n \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY \n: PARTICIPATE IN WORKPLACE COMMUNICATION \n \n \n \nUNIT CODE \n: 400311210 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes  \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and relevant \ninformation is accessed \nfrom appropriate \nsources. \n1.2 Effective questioning, \nactive listening and \nspeaking skills are used \nto gather and convey \ninformation. \n1.3 Appropriate medium is \nused to transfer \ninformation and ideas. \n1.4 Appropriate non- verbal \ncommunication is used. \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are identified \nand followed. \n1.6 Defined workplace \nprocedures for the \nlocation and storage of \ninformation are used. \n1.7 Personal interaction is \ncarried out clearly and \nconcisely. \n \n \n \n1.1 Effective verbal \nand nonverbal \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n1.8 Workplace \netiquette \n \n \n1.1 Following simple \nspoken language \n1.2 Performing \nroutine workplace \nduties following \nsimple written \nnotices \n1.3 Participating in \nworkplace \nmeetings and \ndiscussions \n1.4 Preparing work- \nrelated \ndocuments \n1.5 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6 Relating/ \nInteracting with \npeople of various \nlevels in the \nworkplace \n1.7 Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements\n\n--- PDF PAGE 7 ---\nPrinting Services (Prepress Technical Operations) NC II              December 2023 \n3 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.8 Applying basic \nbusiness writing \nskills \n1.9 Applying \ninterpersonal \nskills in the \nworkplace \n1.10 Performing \nactive-listening \nskills \n2. Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices and \ninstructions are read and \ninterpreted in \naccordance with \norganizational \nguidelines. \n2.2 Routine written \ninstruction is followed \nbased on established \nprocedures. \n2.3 Feedback is given to \nworkplace supervisor-\nbased instructions/ \ninformation received. \n2.4 Workplace interactions \nare conducted in a \ncourteous manner. \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and matters \nconcerning conditions of \nemployment are sought \nand asked from \nappropriate sources. \n2.6 Meeting outcomes are \ninterpreted and \nimplemented. \n2.1 Effective verbal \nand non-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nworkplace policies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace \netiquette  \n2.1 Following simple \nspoken \ninstructions  \n2.2 Performing \nroutine workplace \nduties following \nsimple written \nnotices \n2.3 