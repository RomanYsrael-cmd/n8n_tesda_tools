  "source_section_text": "SECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for PRINTING SERVICES (PREPRESS TECHNICAL\nOPERATIONS) NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: PRINTING SERVICES\n\nNC Level: NC II\n (PREPRESS TECHNICAL OPERATIONS)\n\nNominal Training Duration:\n\n37 hours\nBasic Competencies\n\n45 hours\nCommon Competencies\n\n200 hours\nCore Competencies\n\n282 hours TOTAL\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitude, applicable in performing work activities involve in performing halftone\nreproduction and its requirements, performing basic color separation process,\nperforming digital output processing operations, performing imposition procedures and\nperforming regular maintenance of condition-based prepress machines/equipment\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 77 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n73\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and systems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different types of question\n•\nGather different sources of information\n•\nApply storage system in establishing workplace\ninformation\n•\nDemonstrate Telephone courtesy\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and procedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario following\nworkplace instructions\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.3. Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 78 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n74\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of addition,\nsubtraction, division and multiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions scenario\n•\nPerform workplace duties scenario following\nsimple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal communication\n•\nDemonstrate ability to relate to people of social\nrange in the workplace\n•\nGather and provide information in response to\nworkplace requirements\n•\nComplete work-related documents\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the different\nsources of information\n• Lecture/\nDiscussion\n• Group Work\n• Individual\nWork\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n\n--- PDF PAGE 79 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n75\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Participate in the discussion of standard work\nprocedures and practices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 hour\n3. Solve/address\nroutine\nproblems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance, service\nand helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general problems\nin the workplace\n• Analyze routine/procedural problems\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n3.2 Look for\nsolutions to\nroutine\nproblems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance, service\nand helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general problems\nin the workplace\n• Formulate possible solutions to problems and\ndocument procedures for reporting\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n3.3 Look for\nsolutions to\nroutine\nproblems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance, service\nand helpdesk practices, processes and procedures\n• Make use of the industry standard diagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general problems\nin the workplace\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n--- PDF PAGE 80 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n76\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Formulate possible solutions to problems and\ndocument procedures for reporting\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management strategies that\nassist in regulating behavior and achieving\npersonal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative emotions\nand unpleasant situation in the workplace such as\nfrustration, anger, worry, anxiety, etc.\n• Manage properly one’s emotions and recognize\nsituations that cannot be changed and accept\nthem and remain professional\n• Recall instances that demonstrate self- discipline,\nworking independently and showing initiative to\nachieve personal and career goals\n• Share experiences that show confidence, and\nresilience in the face of setbacks and frustrations\nand other negative emotions and unpleasant\nsituations in the workplace\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve one’s attitude in\nthe workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as self-assessment\nstrategy\n• Develop reflective practice through realization of\nlimitations, likes/ dislikes; through showing of self-\nconfidence\n• Demonstrate self-acceptance and being able to\naccept challenges\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n\n--- PDF PAGE 81 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n77\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-regulation based\non Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by Stephen\nCovey, transactional analysis, psycho-spiritual\nconcepts)\n• Perform effective communication skills – reading,\nwriting, conversing skills\n• Show affective skills – flexibility, adaptability, etc.\n• Determine strengths and weaknesses\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 hour\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to\ndo things better\n• Identify different roles of individuals in contributing\nto doing things better in the workplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7 habits of highly effective people\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n5.2 Discuss and\ndevelop ideas\nwith others\n\n• Identify different roles of individuals in contributing\nto doing things better in the workplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n1 hour\n\n--- PDF PAGE 82 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n78\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Group work\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\