nstration\n• Role Play\n• Practical\nexercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 hours\n7. Practice\nOccupational\nSafety and\nHealth Policies\nand Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n•\nLecture\n•\nGroup\nDiscussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n7.2 Prepare OSH\nrequirements\nfor compliance\n• Identification of required safety materials, tools\nand equipment\n• Handling of safety control resources\n\n• Lecture\n• Group\nDiscussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n\n--- PDF PAGE 84 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n80\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.3 Perform tasks\nin accordance\nwith relevant\nOSH policies\nand procedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities in\naccordance with OSH Standards\n• Lecture\n• Group\nDiscussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n2 hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n• Identify the processes on environmental policies\n• Relate the necessary skills in response to\nchanging environmental policies needs\n-\nWaste Management Skills\n-\nConservation of Energy in workplace\n• Lecture\n• Group\nDiscussion\n• Simulation\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n• Discussion of environmental protection and\nresource efficien