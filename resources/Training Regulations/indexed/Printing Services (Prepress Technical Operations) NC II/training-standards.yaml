innovation\n5.1 Identify\nopportunities to\ndo things better\n• Identify different roles of individuals in contributing\nto doing things better in the workplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7 habits of highly effective people\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n5.2 Discuss and\ndevelop ideas\nwith others\n\n• Identify different roles of individuals in contributing\nto doing things better in the workplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n1 hour\n\n--- PDF PAGE 82 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n78\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Group work\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n5.3 Integrate ideas\nfor change in\nthe workplace\n\n• Identify different roles of individuals in contributing\nto doing things better in the workplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of 