ired standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe\nDTS\nLaw\nand\nthe\nTESDA\nGuidelines\non\nthe\nDTP.\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies; or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of\nthe trainee through actual experience in the workplace to acquire\n\n--- PDF PAGE 102 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023 98\n\nspecific competencies as prescribed in the training regulations. It is\nimperative that the deployment of trainees in the workplace is adhered\nto training programs agreed by the institution and enterprise and status\nand progress of trainees are closely monitored by the training institutions\nto prevent opportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production process\nand apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the following\nrequirements:\n\n• Completed at least grade 10 of basic education or holder of Alternative\nLearning Systems (ALS) certificate of completion with grade 10 equivalent;\nand\n• Must possess good communication skills\n\n--- PDF PAGE 103 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023 99\n\n3.4\nLIST OF TOOLS, MATERIALS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Printing Services (Prepress Technical Operations) NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices and\ntheir availability in the local market.\n\nTOOLS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n26\npcs\nUSB Flash Drives, 8G\n26\npcs\nMagnifying Lens (10x)\n26\npcs\nSteel Rule, 24”\n1\npcs\nWhiteboard (8’ x 4’)\n1\nunit\nRoom Temperature and Humidity Meter (Digital)\n\nEQUIPMENT\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n26\nunits\nWork station computer unit with accessories and\ninstalled desktop publishing software\nComputer Specifications:\n• Processor: at least i5 or higher (at least 10th\ngeneration or higher)\n• RAM: minimum of 8gb 16gb\n• Video Card: minimum of 4gb\n• Storage: minimum of 256gb (SSD)\n• Monitor: minimum of 24” LED\n• Compatible Platform\n• UPS – 650 VA\nSoftware Specifications:\n• Lay –out Designing Software\n• Vector-Based Software\n• Image Manipulation and Editing Software\n• Productivity Software Tools or Word\nProcessing Software\n5\nunits\nFlatbed Scanner with OCR Software DPI 1200, A3 size\n21\nunits\nLCD Projector\n21\nunits\n72” LED Monitor Calibrated\n1\nunit\nMonitor Calibrator\n1\nunit\nComputer set as file server\n• Processor: at least i5 or higher (at least 10th\ngeneration or higher)\n• RAM: minimum of 8gb\n\n--- PDF PAGE 104 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023 100\n\n• Storage:\no 1tb as Operating System\no 1tb 2tb as Main Storage\no 1tb as Mirrored Disk\n• UPS – 650 VA\nMonitor: 24”\n1\nunit\nAudio System with Lapel Microphone\n1\nunit\nQR Code Scanner\n1\nunit\nLaser Desktop Printer, Standard\n1\nunit\nInkjet Desk