  "source_text": "Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to undergo assessment and certification:\n\n4.1.3.1\nGraduates of WTR-registered, NTR-registered programs or\nformal/non-formal/informal including enterprise-based trainings\nrelated to Printing Services (Prepress Technical Operations) NC II;\nor\n\n4.1.3.2\nExperienced workers (wage employed or self-employed) who\ngained competencies in providing prepress technical operations\nservices for at least two (2) years within the last five (5) years.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences in prepress technical operations for at least three (3) years within\nthe last five (5) years may apply for recognition in this Qualification through\nPortfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must be\nconsistent with TESDA Circular No. 025, Series of 2023 entitled “Amended\nOperating Procedure on the Conduct of Portfolio Assessment”.\n\n4.1.5 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n--- PDF PAGE 108 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023 104\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment.\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n--- PDF PAGE 109 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023 105\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement skills\nSupport Innovation\nAccess and\nmaintain information\nFollow occupational safety\nand health policies and\nprocedures\nApply environmental\nwork standards\nAdopt entrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nSolve/address\ngeneral workplace\nproblems\nDevelop career\nand life decisions\nContribute to\nworkplace innovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health policies\nand procedures\nExercise efficient and\neffective sustainable\npractices in the\nworkplace\nPractice\nentrepreneurial skills\nin the workplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in the\nworkplace\nWork in a diverse\nenvironment\nPropose methods of\napplying learning and\ninnovation in the\norganization\nUse information\nsystematically\nEvaluate occupational\nsafety and health work\npractices\nEvaluate\nenvironmental work\npractices\nFacilitate\nentrepreneurial skills\nfor micro-small-\nmedium enterprises\n(MSMEs)\n