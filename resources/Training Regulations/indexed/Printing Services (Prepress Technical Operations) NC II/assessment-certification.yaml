form preparatory activities for data collection Gather data Perform post-data collection activities Perform pre-flighting procedures Perform file handling Perform input processing procedures Perform line reproduction and its requirements Perform preventive maintenance of prepress equipment/machines Perform halftone reproduction and its requirements Perform basic color separation process Perform digital output processing operations Perform imposition procedures Perform regular maintenance of condition-based prepress machines/equipment --- PDF PAGE 112 --- Printing Services (Prepress Technical Operations) NC II December 2023 108 Color Bars Rows of different colored patches printed in the trim area of the press sheet. They are used by proofers and press operators to control the trapping, ink density, dot gain, and print contrast of the proof or the printed sheet. Color Theory Is both the science and art of using color. It explains how humans perceive color; and the visual effects of how colors mix, match or contrast with each other. Computer-to-Plate An imaging technology which helps to transfer a digital image generated in a computer directly to a printing plate. Contract Proof Serves as an agreement between customer and printer and as a color reference guide for adjusting the press before the final press run. Creasing A ridge or groove produced in anything by folding, heat, pressure, etc. Die-Cutting The process of cutting a piece of paper or material to a custom shape and size. Digitization The process of converting information into a digital format. Folding Dummy Sheet or sheets which has been folded into pages and marked with page numbers to indicate the proper page imposition. It also indicates where the gripper margin is. Gradation A visual technique of gradually transitioning from one color hue to another, or from one shade to another, or one texture to another. Gripper A space on a sheet of paper that allows for the press to physically grip the paper. This is where the machine pulls the paper and guides it along the path to print. Halftone Frequency Refers to how many rows, or lines, of dots fit in a linear inch. The number of LPI in a halftone screen is called the screen frequency. Imposition The positioning of pages on a press sheet in such a manner that when the sheet is folded into a signature and cut, the pages will be in the correct sequence. Make-Ready The act or process of making something ready for use. Nesting The layout strategy that allows printers to organize the shapes of products to be cut out by nesting them in one another so as to optimize the use of space on the sheet. Perfect Binding A form of bookbinding in which the leaves are bound by gluing, after the back folds have been cut off, rather than by sewing. Perforation A small hole or row of small holes punched in a sheet of paper Plate Control Wedge Provides a means of optimizing the exposure of direct digital platemakers by visual inspection. --- PDF PAGE 113 --- Printing Services (Prepress Technical Operations) NC II December 2023 109 Printing Signature A group of pages that are printed, most likely on both sides of a single sheet of paper that once folded, trimmed, bound and cut, become a specific number of pages. Prototype An early sample, model, or release of a product built to test a concept or process. A prototype is generally used to evaluate a new design to enhance precision by system analysts and users. Raster Image Processing A component used in a printing system which produces a raster image also known as a bitmap. Such a bitmap is used by a later stage of the printing system to produce the printed output. Saddle Stitching A very popular book binding method in which folded sheets are gathered together one inside the other and then stapled through the fold line with wire staples. Smyth Sewn Binding Method of book binding where groups of folded pages (referred to as signatures) are stitched together using binder thread. Each folded signature is sewn together individually with multiple stiches and then joined with other signatures to create the complete book block. Step and Repeat The process of creating a layout where an image, logo or sponsor name is repeated multiple times, creating a uniform pattern. Substrate Term for any surface to be printed to which ink will adhere. The substrate, also called stock, is typically a paper, but can also refer to plastics, foil, metal, cloth, or any other surface to which printing ink will be applied. Tonal Correction The adjustments and changes you make to the brightness and contrast of your image. Web-Press A modern offset printing press attached to a massive roll of paper. --- PDF PAGE 114 --- Printing Services (Prepress Technical Operations) NC II December 2023 110 AI Adobe Illustrator file extension CDR CorelDRAW file extension CMS Color Management System Cyan, Magenta, Yellow, Black CtP Computer-to-Plate DVI Digital Visual Interface EPS Encapsulated PostScript file extension GCR Gray Component Replacement High-Definition Multimedia Interface Adobe InDesign file extension JO Job Order Joint Photographic Experts Group LED Light-Emitting Diode OCR Optical Character Recognition OHS Occupational Health and Safety PDF Portable Document Format PS Postscript PSD Photoshop Document file extension RAM Random-Access Memory RGB Red, Green, and Blue RIP Raster Image Processor Tagged Image File Format file extension UCR Under Color Removal USB Universal Serial Bus VGA Video Graphics Array --- PDF PAGE 115 --- Printing Services (Prepress Technical Operations) NC II December 2023 111 The Technical Education and Skills Development Authority (TESDA) would like to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who provided their time and expertise to the development and validation of this Training Regulations. SPECIAL THANKS TO: ATTY. DOMINADOR D. BUHAIN President Printing Industry Board Foundation, Inc. (PIBFI, 