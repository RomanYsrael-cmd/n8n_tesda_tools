m advanced and\ncreative haircutting\nPerform advanced\nand creative hair\ncoloring\nPerform advanced\nand creative hair\nperming\nPerform basic men’s\nhaircutting\nPerform shave and\nstyle beard and\nmustache\nPerform chair\nmanipulative\nrelaxing services\nPerform manicure\nand pedicure\nPerform hand and\nfoot spa\nPerform preparatory\nactivities\nPrepare appropriate\nproducts, tools and\nequipment\nPerform nail\nenhancement\ntechnology\nprocedures\nPerform post service\nactivities\nPerform advanced\nnail polish\nprocedures\nApply facial make-\nup\nPerform body\nbleach\nNetwork with\nstakeholders\nProcess labor\nmarket information\nMarket and promote\nservices of public\nemployment\nservices office\nPerform job matching\nservices\nPerform referral and\nplacement services\nPerform monitoring of\njobseekers\nPerform\nlivelihood/training\nreferral and\nfacilitation services\nPerform monitoring\nof referred livelihood\nand training\napplicants\nAssist in the\nconduct of career\ncoaching and\nemployment\norientation seminar\nto school-based\nclients\nProvide\nemployment\norientation and\ncoaching to walk-in\nclients\nProvide\nemployment\norientation and\ncoaching to other\nclients\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 111 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023 107\n\nParticipate in the\nconduct of research\nand development of\nnew programs\nImplement employment\nfacilitation services and\nspecial programs\nOrganize\nrecruitment\nactivities\nClean living room,\ndining room,\nbedroom, bathroom\nand kitchen\nWash and iron\nclothes, linen and\nfabric\nPrepare hot and\ncold meals\nProvide food and\nbeverage service\nPerform preparatory\nactivities for data\ncollection\nGather data\nPerform post-data\ncollection activities\nPerform pre-flighting\nprocedures\nPerform file\nhandling\nPerform input\nprocessing\nprocedures\nPerform line\nreproduction and its\nrequirements\nPerform preventive\nmaintenance of\nprepress\nequipment/machines\nPerform halftone\nreproduction and its\nrequirements\nPerform basic color\nseparation process\nPerform digital\noutput processing\noperations\nPerform imposition\nprocedures\nPerform regular\nmaintenance of\ncondition-based\nprepress\nmachines/equipment\n\n--- PDF PAGE 112 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n\n108\n\nGLOSSARY OF TERMS\n\nColor Bars\nRows of different colored patches printed in the trim area of\nthe press sheet. They are used by proofers and press\noperators to control the trapping, ink density, dot gain, and\nprint contrast of the proof or the printed sheet.\nColor Theory\nIs both the science and art of using color. It explains how\nhumans perceive color; and the visual effects of how colors\nmix, match or contrast with each other.\nComputer-to-Plate\nAn imaging technology which helps to transfer a digital\nimage generated in a computer directly to a printing plate.\nContract Proof\nServes as an agreement between customer and printer and\nas a color reference guide for adjusting the press before the\nfinal press run.\nCreasing\nA ridge or groove produced in anything by folding, heat,\npressure, etc.\nDie-Cutting\nThe process of cutting a piece of paper or material to a\ncustom shape and size.\nDigitization\nThe process of converting information into a digital format.\nFolding Dummy\nSheet or sheets which has been folded into pages and\nmarked with page numbers to indicate the proper page\nimposition. It also indicates where the gripper margin is.\nGradation\nA visual technique of gradually transitioning from one color\nhue to another, or from one shade to another, or one texture\nto another.\nGripper\nA space on a sheet of paper that allows for the press to\nphysically grip the paper. This is where the machine pulls\nthe paper and guides it along the path to print.\nHalftone Frequency\nRefers to how many rows, or lines, of dots fit in a linear inch.\nThe number of LPI in a halftone screen is called the screen\nfrequency.\nImposition\nThe positioning of pages on a press sheet in such a manner\nthat when the sheet is folded into a signature and cut, the\npages will be in the correct sequence.\nMake-Ready\nThe act or process of making something ready for use.\nNesting\nThe layout strategy that allows printers to organize the\nshapes of products to be cut out by nesting them in one\nanother so as to optimize the use of space on the sheet.\nPerfect Binding\nA form of bookbinding in which the leaves are bound by\ngluing, after the back folds have been cut off, rather than by\nsewing.\nPerforation\nA small hole or row of small holes punched in a sheet of\npaper\nPlate Control Wedge\nProvides a means of optimizing the exposure of direct digital\nplatemakers by visual inspection.\n\n--- PDF PAGE 113 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n\n109\n\nPrinting Signature\nA group of pages that are printed, most likely on both sides\nof a single sheet of paper that once folded, trimmed, bound\nand cut, become a specific number of pages.\nPrototype\nAn early sample, model, or release of a product built to test\na concept or process. A prototype is generally used to\nevaluate a new design to enhance precision by system\nanalysts and users.\nRaster Image Processing\nA component used in a printing system which produces a\nraster image also known as a bitmap. Such a bitmap is used\nby a later stage of the printing system to produce the printed\noutput.\nSaddle Stitching\nA very popular book binding method in which folded sheets\nare gathered together one inside the other and then stapled\nthrough the fold line with wire staples.\nSmyth Sewn Binding\nMethod of book binding where groups of folded pages\n(referred to as signatures) are stitched together using binder\nthread. Each folded signature is sewn together individually\nwith multiple stiches and then joined with other signatures\nto create the complete book block.\nStep and Repeat\nThe process of creating a layout where an image, logo or\nsponsor name is repeated multiple times, creating a uniform\npattern.\nSubstrate\nTerm for any surface to be printed to which ink will adhere.\nThe substrate, also called stock, is typically a paper, but can\nalso refer to plastics, foil, metal, cloth, or any other surface\nto which printing ink will be applied.\nTonal Correction\nThe adjustments and changes you make to the brightness\nand contrast of your image.\nWeb-Press\nA modern offset printing press attached to a massive roll of\npaper.\n\n--- PDF PAGE 114 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n\n110\n\nACRONYMS\n\nAI\nAdobe Illustrator file extension\nCDR\nCorelDRAW file extension\nCMS\nColor Management System\nCMYK\nCyan, Magenta, Yellow, Black\nCtP\nComputer-to-Plate\nDVI\nDigital Visual Interface\nEPS\nEncapsulated PostScript file extension\nGCR\nGray Component Replacement\nHDMI\nHigh-Definition Multimedia Interface\nINDD\nAdobe InDesign file extension\nJO\nJob Order\nJPEG\nJoint Photographic Experts Group\nLED\nLight-Emitting Diode\nOCR\nOptical Character Recognition\nOHS\nOccupational Health and Safety\nPDF\nPortable Document Format\nPS\nPostscript\nPSD\nPhotoshop Document file extension\nRAM\nRandom-Access Memory\nRGB\nRed, Green, and Blue\nRIP\nRaster Image Processor\nTIFF/TIF\nTagged Image File Format file extension\nUCR\nUnder Color Removal\nUSB\nUniversal Serial Bus\nVGA\nVideo Graphics Array\n\n--- PDF PAGE 115 ---\nPrinting Services (Prepress Technical Operations) NC II December 2023\n\n111\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who provided their time and expertise to the development and\nvalidation of this Training Regulations.\n\nSPECIAL THANKS TO:\n\nATTY. DOMINADOR D. BUHAIN\nPresident\nPrinting Industry Board Foundation, Inc. (PIBFI, Inc.)\n\nTHE T