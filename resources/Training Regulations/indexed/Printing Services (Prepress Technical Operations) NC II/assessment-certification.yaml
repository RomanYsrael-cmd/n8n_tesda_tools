      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of PRINTING SERVICES (PREPRESS TECHNICAL OPERATIONS) NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 Any of the following are qualified to undergo assessment and certification: 4.1.3.1 Graduates of WTR-registered, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to Printing Services (Prepress Technical Operations) NC II; or 4.1.3.2 Experienced workers (wage employed or self-employed) who gained competencies in providing prepress technical operations services for at least two (2) years within the last five (5) years. 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences in prepress technical operations for at least three (3) years within the last five (5) years may apply for recognition in this Qualification through Portfolio Assessment. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 025, Series of 2023 entitled “Amended Operating Procedure on the Conduct of Portfolio Assessment”. 4.1.5 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”. Printing Services (Prepress Technical Operations) NC II December 2023 104"
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment. 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. Printing Services (Prepress Technical Operations) NC II December 2023 105 Receive and respond to workplace communication Work with others Solve/address routine problems Enhance self- management skills Support Innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace Participate in workplace communication Work in team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace Lead workplace communication Lead small teams Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro-small- medium enterprises (MSMEs) Utilize specialized communication skill Develop and lead teams Perform higher order thinking processes and apply techniques in the workplace Contribute to the practice of social justice in the workplace Manage innovative work instructions Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health Program, Policies and Procedures Lead towards improvement of environmental work programs, policies and procedures Sustain entrepreneurial skills Manage and sustain effective communication strategies Manage and sustain high performing teams Evaluate higher order thinking skills and adjust problem solving techniques Advocate strategic thinking for global citizenship Incorporate innovation into work procedures Develop systems in managing and maintaining information Manage implementation of occupational safety and health programs in the workplace Manage implementation of environmental programs in the workplace Develop and sustain a high-performing enterprise BASIC COMPETENCIES"
