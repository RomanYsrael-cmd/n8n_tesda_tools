cooning the body in warm sheets that usually have been\nsteeped in an herbal mixture; or wrapping the body in plastic,\nMylar, or woolen blankets after a body treatment such as a\nmud bath or mask.\n\nChiropractic\na physical therapy that realigns the spine to correct nerve\nmalfunctions; uses manual manipulations to help the body\nregain optimal function.\n\nDasal, Bulong, Oracion\nprayers and chants asking for spiritual blessings and\nguidance.\n\nEssential Oils\ndistilled and purified extracts of flowers, plants, grasses, fruit,\nleaves, bark, herbs and seeds; said to have healing,\noxygenating, purifying and relaxing properties.\n\nExfoliation\nremoval of dead cells from the skin’s surface, using a variety\nof lotions, muds, oils and scrubs with a variety of tools (e.g.\nloofah sponges and brushes).\n\n--- PDF PAGE 69 ---\nTR Hilot Wellness Massage NCII\n\n- 65 -\n\nFacial\ndeep cleansing and/or massage for the face, neck and upper\nchest using various muds, oils, lotions and/or masks to\nremove dead skin and impurities, close pores, and enhance\ncirculation; can be manual and/or involve equipment to\nsteam, tone and tighten the skin.\n\nHerbal Bath\na hydrotherapy treatment with the addition of herbal\npreparations for relaxation and healing.\n\nHerbal Wrap\na body treatment that uses linen sheets steeped in an herbal\npreparation. The sheets are wrapped around the client like a\ncocoon for detoxification, relaxation and increased circulation.\n\nHilot\nThe art and science of the ancient Filipino Healing.\n\nHilot (Wellness)\ncan use/apply massage, herbal treatments, oil and essences,\nmineral treatments and water treatment.\n\nPaligo\nbathing practices using decoctions of aromatic herbs\nperformed after an illness, a childbirth or an exhausting work.\n\nPalpation\na method used in locating energy blockages in the body. This\nis done by palpating the parts of the body where the patient\nfeels pain, discomfort, numbness or tingling sensations. Then\nthe other body areas to determine other areas of energy\nblockages.\n\nPulse Diagnosis\nthe use of fingers to palpate the pulses that determine the\nblockage in the body in relation to the signs and symptoms\nmanifestations based on the philosophical concepts of hilot.\n\nRaw Egg Method\na whole raw egg is run throughout the different body areas.\nAfter which the egg is broken over a plate and the hilot is able\nto diagnose the location of the energy blockage or where the\nexcess wind or cold permeates by the shape and character of\nthe egg white and the yolk. There have been no investigative\nstudies to find out the science behind the raw egg as a\ndiagnostic tool for hot-cold imbalances.\n\nReflexology\nbased on an ancient Oriental system, a pressure point\nmassage applied to specific places on the feet that\ncorrespond, or “reflex”, to all parts of the body. Usually\nperformed on the feet, but also on ears and hands; also\ncalled zone therapy.\n\nSauna\nbased on a Finnish tradition tank; a dry treatment in a very\nhot, wooden chamber, which cleanses and detoxifies through\nthe body’s perspiration. Traditional saunas include birch twigs\nused to beat the body to further stimulate circulation and are\nfollowed by a dip into a cold pool or stream to cool down.\n\n--- PDF PAGE 70 ---\nTR Hilot Wellness Massage NCII\n\n- 66 -\n\nScalp Treatment\na massage therapy and application of oils, lotions and tonics\nto the scalp, used for relaxation and hair stimulation and\nconditioning.\n\nSpa\na facility dedicated to relaxation, beauty, pampering and\nwellness. Or, a hot tub.\n\nSuob\nusing medicinal herbs and/or mineral medicine, steam or\nsmoke induced heat expelled through perspiration.\n\nUse of Cellophane and Empty Bottles - cellophane sheets, two inches by four inches in size\nand empty round bottles, six inches tall and four\ninches diameter, to detect energy blockages in the\nbody. In the same manner as the banana leaf strips,\nthe cellophane sheets or empty bottles are run\nthrough body areas like the back, upper and lower\narm, chest and abdomen, upper and lower legs.\nWhere ever the cellophane sheet gets stuck in a\nbody area or where the empty bottle stops are the\nareas that have energy blockages or excess wind.\n\nWellness\na healthy balance of the mind of mind, body and\nspirit that results in an overall feeling of well-being.\n\n--- PDF PAGE 71 ---\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and\nappreciation to the many representatives of business, industry, academe and government agencies,\nnon-government organizations including professional associations who rendered their time and expertise\nto the development and validation of these Training Regulations.\n\nMS. MARJORIE P. LOPINGCO\nMR. JASON T. LAO\nPresident\nDirector\nSpa Association of the Philippines, Inc.\nBureau of Export Trade Promotion\nC/o Office of Product Research and Development\nDepartment of Trade and Industry\nRm. 412 Department of Tourism\n2nd Flr. DTI International Building\nT.M. Kalaw, Manila\n#375 Sen. Gil Puyat Avenue\n\nMakati City\nDR. JAIME GALVEZ-TAN\nChairman of the Board\nMS. TESS LORING\nCreative Concoctions Inc.\nBureau of Export Trade Promotion\n11/F Agustin 1 Bldg., F. Ortigas Jr.\nDepartment of Trade and Industry\n(formerly Emerald Ave.)\n2nd Flr. DTI International Building\nOrtigas Center, Pasig City\n#375 Sen. Gil Puyat Avenue\n\nMakati City\nMS. MA. REBECCA M. GALVEZ-TAN\n\nDirector\nHealth Futures Foundation, Inc.\nMS. CHERYL M. PELO\n1086 Del Monte Avenue\nInternational Services Division\nQuezon City\nBureau of Export Trade Promotion\n\nDepartment of Trade and Industry\nMR. BIBIANO S. FAJARDO\n2nd Flr. DTI International Building\nPresident\n#375 Sen. Gil Puyat Avenue\nAssociation of Traditional Health Aid Givers, Inc.\nMakati City\n2nd Flr. Jacinto Building 2\nEDSA Guadalupe Nuevo\nDR. FRANCIS VICENTE S. RAS\nMakati City\nChief, Education & Training Division\n\nPhilippine Inst