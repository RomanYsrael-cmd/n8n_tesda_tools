  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Hilot (Wellness Massage) NC II the candidate\nmust demonstrate competence through project-type assessment covering all the\nunits listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2 Experienced Workers (wage employed or self – employed)\n\n4.4\nReassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.5 A candidate who fails the assessment for two (2) consecutive times will be\nrequired to go through a refresher course before taking another assessment.\n\n4.6 Only certified individuals in this Qualification may be nominated by the industry\nsector for accreditation as competency assessor.\n\n4.7 Only accredited competency assessors are allowed to conduct competency\nassessment, however, trainees who are accredited competency assessors are not\nallowed to assess their trainees.\n\n4.8 Assessment of competence must be undertaken only in the TESDA accredited\nassessment center. The performance assessment (demonstration of competence),\nhowever, may be done in any venue or workplace duly designated by an\naccredited assessment center.\n\n4.9 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 66 ---\nTR Hilot Wellness Massage NCII\n\n- 62 -\n\n"
}
