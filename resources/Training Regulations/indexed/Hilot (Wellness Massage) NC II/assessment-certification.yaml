      "text": "9 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”. --- PDF PAGE 66 --- TR Hilot Wellness Massage NCII - 62 - COMPETENCY MAP – HEALTH CARE SECTOR (HILOT (WELLNESS MASSAGE) NC II) Receive and respond to workplace communication Work with others Demonstrate work values Practice basic housekeeping procedures Participate in workplace communication Work in team environment Practice career professionalism Practice occupational health and safety procedures Lead workplace communication Lead small team Develop and practice negotiation skills Solve problems related to work activities Use mathematical concepts and techniques Use relevant technologies Utilize specialized communication skills Develop teams and individuals Apply problem solving techniques in the workplace Collect, analyze and organize information Plan and organize work Promote environmental protection Implement and monitor infection control policies and procedures Respond effectively to difficult/challenging behavior Apply basic first aid Maintain high standard of patient services Maintain an effective relationship with clients/customers Manage own performance Establish professionalism in the security service Process reusable instruments and equipment in health work Prepare for and assist with oral health care procedures Assist with administration in dental practice Follow occupational health and safety policies in dental practice Maintain infection control in dental practice Provide care and support to infants and toddlers Provide care and support to children Foster social, intellectual, creative and emotional development of children Foster the physical development of children Provide care and support to elderly Provide care and support to people with special needs Maintain a healthy and safe environment Respond to emergency Clean living room, dining room, bedrooms, toilet and bathroom Wash and iron clothes, linen and fabric Prepare hot and cold meals Prepare and maintain beds Collect and maintain linen stocks at end users location Assist in patient mobility Assist in transporting patients Assist in bio-psychosocial support care of patients Handle waste in a health care environment Install biomedical equipment Perform corrective maintenance on biomedical equipment Perform preventive maintenance on biomedical equipment Repair biomedical equipment Perform basic life support Maintain life support equipment and resources Implement safe access and extrication procedures in an emergency Manage request for ambulance service Allocate ambulance service resources Coordinate emergency resources Deliver basic ambulance communication skills Supervise on-road operations Manage the scene of a special event Manage routine scene Deliver pre-hospital patient care Manage ambulance operations Transport emergency patients Transport non- emergency patients Drive vehicles under operational conditions Work within a holistic therapeutic massage framework Perform therapeutic massage assessment Plan the therapeutic massage treatment Implement therapeutic massage treatment Perform remedial therapeutic massage treatment Work within a community development framework --- PDF PAGE 67 --- TR Hilot Wellness Massage NCII - 63 - Prepare for work in the community service industry Support community resources Provide primary/residential care Support community participation Recruit and coordinate volunteers Respond holistically to client issues Develop and provide health education program in the community Fabricate models Fabricate custom impression trays Fabricate registration bite rims Articulate models and transfer records Fabricate mouthgard Arrange artificial teeth for complete dentures Set-up and wax removable partial dentures Wax, process and finish acrylic dentures and appliances Cast metal alloy removable partial denture work Fabricate oral splints Fabricate orthodontic appliances Fabricate thermo formed bases and appliances Fabricate metal crown and bridge structures Fabricate ceramic restorations Fabricate indirect composite/polymer fixed restorations Join alloy structures Plan the hilot wellness program of client Provide pre- service of client Apply hilot wellness massage techniques Provide post-dvice on post-services to hilot clients --- PDF PAGE 68 --- TR Hilot Wellness Massage NCII - 64 - For the purpose of this standard, the word Alternative Medicine Non-Western healing therapies. Also called complementary or integrative medicine. Anatomy the science of the shape and structure of organisms and their parts. Banana Leaf Method the banana leaf is utilized in hilot to assist in determining where the energy block is. The leaf of the banana, the saba variety is preferred over other species of bananas. The leaf is cut into lengths of one foot to one and a half feet and width of two to three inches. The banana leaf strips are then laced with coconut oil, warmed over candle fire and run through the different body areas. If the banana leaf strip stops at a particular body area or if the hilot practitioner senses a tug of the banana leaf against the skin of the patient, such body area is considered to have energy block. Massage in then focused on these areas where the banana lead strip stops or tugs. Beauty Treatment cosmetic applications and services that enhance one’s appearance; e.g. facials, hair treatments, manicures, pedicures, waxing and makeup. Bentosa cupping of heated glasses applied on the body surface mainly for cold and wind diseases. Body Scrub a therapy for exfoliating the skin using applications applied with a brush or loofah sponge. Body Treatment any therapy applied to the body, including massages, wraps, scrubs, masks and baths. Body Wrap cocooning the body in warm sheets that usually have been steeped in an herbal mixture; or wrapping the body in plastic, Mylar, or woolen blankets after a body treatment such as a mud bath or mask. Chiropractic a physical therapy that realigns the spine to correct nerve malfunctions; uses manual manipulations to help the body regain optimal function. Dasal, Bulong, Oracion prayers and chants asking for spiritual blessings and guidance. Essential Oils distilled and purified extracts of flowers, plants, grasses, fruit, leaves, bark, herbs and seeds; said to have healing, oxygenating, purifying and relaxing properties. Exfoliation removal of dead cells from the skin’s surface, using a variety of lotions, muds, oils and scrubs with a variety of tools (e.g. loofah sponges and brushes). --- PDF PAGE 69 --- TR Hilot Wellness Massage NCII - 65 - Facial deep cleansing and/or massage for the face, neck and upper chest using various muds, oils, lotions and/or masks to remove dead skin and impurities, close pores, and enhance circulation; can be manual and/or involve equipment to steam, tone and tighten the skin. Herbal Bath a hydrotherapy treatment with the addition of herbal preparations for relaxation and healing. Herbal Wrap a body treatment that uses linen sheets steeped in an herbal preparation. The sheets are wrapped around the client like a cocoon for detoxification, relaxation and increased circulation. Hilot The art and science of the ancient Filipino Healing. Hilot (Wellness) can use/apply massage, herbal treatments, oil and essences, mineral treatments and water treatment. Paligo bathing practices using decoctions of aromatic herbs performed after an illness, a childbirth or an exhausting work. Palpation a method used in locating energy blockages in the body. This is done by palpating the parts of the body where the patient feels pain, discomfort, numbness or tingling sensations. Then the other body areas to determine other areas of energy blockages. Pulse Diagnosis the use of fingers to palpate the pulses that determine the blockage in the body in relation to the signs and symptoms manifestations based on the philosophical concepts of hilot. Raw Egg Method a whole raw egg is run throughout the different body areas. After which the egg is broken over a plate and the hilot is able to diagnose the location of the energy blockage or where the excess wind or cold permeates by the shape and character of the egg white and the yolk. There have been no investigative studies to find out the science behind the raw egg as a diagnostic tool for hot-cold imbalances. Reflexology based on an ancient Oriental system, a pressure point massage applied to specific places on the feet that correspond, or “reflex”, to all parts of the body. Usually performed on the feet, but also on ears and hands; also called zone therapy. Sauna based on a Finnish tradition tank; a dry treatment in a very hot, wooden chamber, which cleanses and detoxifies through the body’s perspiration. Traditional saunas include birch twigs used to beat the body to further stimulate circulation and are followed by a dip into a cold pool or stream to cool down. --- PDF PAGE 70 --- TR Hilot Wellness Massage NCII - 66 - Scalp Treatment a massage therapy and application of oils, lotions and tonics to the scalp, used for relaxation and hair stimulation and conditioning. Spa a facility dedicated to relaxation, beauty, pampering and wellness. Or, a hot tub. Suob using medicinal herbs and/or mineral medicine, steam or smoke induced heat expelled through perspiration. Use of Cellophane and Empty Bottles - cellophane sheets, two inches by four inches in size and empty round bottles, six inches tall and four inches diameter, to detect energy blockages in the body. In the same manner as the banana leaf strips, the cellophane sheets or empty bottles are run through body areas like the back, upper and lower arm, chest and abdomen, upper and lower legs. Where ever the cellophane sheet gets stuck in a body area or where the empty bottle stops are the areas that have energy blockages or excess wind. Wellne