    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: HILOT (WELLNESS MASSAGE)\nNC Level: NC II\n\nNominal Training Hours: 120 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and attitudes of HILOT\n(WELLNESS MASSAGE) in accordance with industry standards. It covers basic, common and\ncore competencies in NC II.\nBASIC COMPETENCIES\n(18 Hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information.\n1.2\nComplete relevant work\nrelated documents.\n1.3\nParticipate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstratio\nn\n Observation\n• Interviews/\n• Questioning\n2. Work in a team\nenvironment\n2.1\nDescribe team role and\nscope\n2.2\nIdentify own role and\nresponsibility within\nteam\n2.3\nWork as a team\nmember.\n• Discussion\n• Interaction\n• Demonstratio\nn\n• Observation\n• Interviews/\n• Questioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal\nobjectives with\norganizational goals.\n3.2\nSet and meet work\npriorities.\n3.3\nMaintain professional\ngrowth and\ndevelopment.\n• Group\ndiscussion\n• Interaction\n\n• Demonstratio\nn\n Observation\n• Interviews/\n• Questioning\n4. Practice\noccupational health\nand safety\n4.1\nIdentify hazards and\nrisks\n4.2\nEvaluate hazards and\nrisks.\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n4.3\nControl hazards and\nrisks.\n4.3\nMaintain occupational\nhealth and safety\n(OHS) awareness.\n\n--- PDF PAGE 60 ---\nTR Hilot Wellness Massage NCII\n\n- 56 -\nCOMMON COMPETENCIES\n(22 Hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Implement and\nmonitor infection\ncontrol policies and\nprocedures\n1.1\nProvide information to\nthe work group about\nthe organization’s\ninfection control policies\nand procedures.\n1.2\nIntegrate the\norganization’s infection\ncontrol policy and\nprocedure into work\npractices.\n1.3\nMonitor infection control\nperformance and\nimplement\nimprovements in\npractices\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n2. Respond\neffectively to\ndifficult /\nchallenging\nbehavior\n\n2.1\nPlan and respond to\nemergencies\n2.2\nReport and review\nincidents\n\n• Lecturette\n• Brainstroming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n3. Apply basic first aid\n\n3.1\nAssess the situation.\n3.2\nApply basic first aid\ntechniques.\n3.3\nCommunicate details of\nthe incident.\n\n• Lecturrette\n• Brainstorming\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n4. Maintain high\nstandard of\npatient/client\nservices\n\n4.1.1 Communicate\nappropriately with\npatients/clients\n4.1.2 Establish and maintain\ngood interpersonal\nrelationship with\npatients/clients\n4.1.3 Act in a respectful\nmanner at all times\n4.1.4 Evaluate own work to\nmaintain high standard\nof patient/client\nservices\n\n• Lecturrette\n• Brainstorming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n--- PDF PAGE 61 ---\nTR Hilot Wellness Massage NCII\n\n- 57 -\nCORE COMPETENCIES\n(80 Hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMEN\nT\nAPPROACH\n\n1. Plan the hilot\nwellness program of\nclients\n\n1.1\nIdentify vital information\nto client\n1.2\nExplain hilot\n1.3\nExplain the hilot\nwellness services and\nproducts\n1.4\nConfirm hilot wellness\nprogram\n\n• Lecture\n• Discussion\n• Demo\n• Role Play\n\n• Written\nexaminatio\nn\n• Interview\n• Return\nDemo\n• Practical\nTest\n\n2. Provide pre-service\nto clients\n\n2.1\nSchedule clients’\n2.2\nConduct preliminary\nservices to clients’\n\n• Lecture\n• Discussion\n• Demo\n• Role Play\n\n• Written\nexaminatio\nn\n• Interview\n• Return\nDemo\n• Practical\nTest\n\n3. Apply hilot wellness\ntechniques\n\n3.1\nPrepare client and work\narea for hilot wellness\nmassage\n3.2\nPerform self assessment\nfor hilot wellness\nsession\n3.3\nPerform hilot wellness\ntechniques\n\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n\n• Written\nexaminatio\nn\n• Observatio\nn\n• Questionin\ng\n\n4. Provide advice on\npost hilot wellness\nservices\n\n4.1 Perform aftercare\nservice\n4.2 Identify and explain the\nproducts\n4.3 Enumerate and explain\nother services\n\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexaminatio\nn\n• Observatio\nn\n• Questionin\ng\n\n--- PDF PAGE 62 ---\nTR Hilot Wellness Massage NCII\n\n- 58 -"
