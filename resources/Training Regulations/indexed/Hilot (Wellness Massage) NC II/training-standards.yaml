  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for HILOT (WELLNESS MASSAGE) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HILOT (WELLNESS MASSAGE)\nNC Level: NC II\n\nNominal Training Hours: 120 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and attitudes of HILOT\n(WELLNESS MASSAGE) in accordance with industry standards. It covers basic, common and\ncore competencies in NC II.\nBASIC COMPETENCIES\n(18 Hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1\nObtain and convey\nworkplace information.\n1.2\nComplete relevant work\nrelated documents.\n1.3\nParticipate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstratio\nn\n Observation\n• Interviews/\n• Questioning\n2. Work in a team\nenvironment\n2.1\nDescribe team role and\nscope\n2.2\nIdentify own role and\nresponsibility within\nteam\n2.3\nWork as a team\nmember.\n• Discussion\n• Interaction\n• Demonstratio\nn\n• Observation\n• Interviews/\n• Questioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate personal\nobjectives with\norganizational goals.\n3.2\nSet and meet work\npriorities.\n3.3\nMaintain professional\ngrowth and\ndevelopment.\n• Group\ndiscussion\n• Interaction\n\n• Demonstratio\nn\n Observation\n• Interviews/\n• Questioning\n4. Practice\noccupational health\nand safety\n4.1\nIdentify hazards and\nrisks\n4.2\nEvaluate hazards and\nrisks.\n• Discussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n4.3\nControl hazards and\nrisks.\n4.3\nMaintain occupational\nhealth and safety\n(OHS) awareness.\n\n--- PDF PAGE 60 ---\nTR Hilot Wellness Massage NCII\n\n- 56 -\nCOMMON COMPETENCIES\n(22 Hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Implement and\nmonitor infection\ncontrol policies and\nprocedures\n1.1\nProvide information to\nthe work group about\nthe organization’s\ninfection control policies\nand procedures.\n1.2\nIntegrate the\norganization’s infection\ncontrol policy and\nprocedure into work\npractices.\n1.3\nMonitor infection control\nperformance and\nimplement\nimprovements in\npractices\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n2. Respond\neffectively to\ndifficult /\nchallenging\nbehavior\n\n2.1\nPlan and respond to\nemergencies\n2.2\nReport and review\nincidents\n\n• Lecturette\n• Brainstroming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n3. Apply basic first aid\n\n3.1\nAssess the situation.\n3.2\nApply basic first aid\ntechniques.\n3.3\nCommunicate details of\nthe incident.\n\n• Lecturrette\n• Brainstorming\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n4. Maintain high\nstandard of\npatient/client\nservices\n\n4.1.1 Communicate\nappropriately with\npatients/clients\n4.1.2 Establish and maintain\ngood interpersonal\nrelationship with\npatients/clients\n4.1.3 Act in a respectful\nmanner at all times\n4.1.4 Evaluate own work to\nmaintain high standard\nof patient/client\nservices\n\n• Lecturrette\n• Brainstorming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n\n--- PDF PAGE 61 ---\nTR Hilot Wellness Massage NCII\n\n- 57 -\nCORE COMPETENCIES\n(80 Hours)\n\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMEN\nT\nAPPROACH\n\n1. Plan the hilot\nwellness program of\nclients\n\n1.1\nIdentify vital information\nto client\n1.2\nExplain hilot\n1.3\nExplain the hilot\nwellness services and\nproducts\n1.4\nConfirm hilot wellness\nprogram\n\n• Lecture\n• Discussion\n• Demo\n• Role Play\n\n• Written\nexaminatio\nn\n• Interview\n• Return\nDemo\n• Practical\nTest\n\n2. Provide pre-service\nto clients\n\n2.1\nSchedule clients’\n2.2\nConduct preliminary\nservices to clients’\n\n• Lecture\n• Discussion\n• Demo\n• Role Play\n\n• Written\nexaminatio\nn\n• Interview\n• Return\nDemo\n• Practical\nTest\n\n3. Apply hilot wellness\ntechniques\n\n3.1\nPrepare client and work\narea for hilot wellness\nmassage\n3.2\nPerform self assessment\nfor hilot wellness\nsession\n3.3\nPerform hilot wellness\ntechniques\n\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n\n• Written\nexaminatio\nn\n• Observatio\nn\n• Questionin\ng\n\n4. Provide advice on\npost hilot wellness\nservices\n\n4.1 Perform aftercare\nservice\n4.2 Identify and explain the\nproducts\n4.3 Enumerate and explain\nother services\n\n• Demonstration/\nPractical Hands-\non Exercises\n• Competency-\nBased Learning\nMaterials\nMethod\n• Written\nexaminatio\nn\n• Observatio\nn\n• Questionin\ng\n\n--- PDF PAGE 62 ---\nTR Hilot Wellness Massage NCII\n\n- 58 -\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is individualized and self-paced;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the curriculum\nmodules;\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n Training is based both on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency – based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when\ndesigning training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in – industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer facilitates the training delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners\n Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge an skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n Distance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 63 ---\nTR Hilot Wellness Massage NCII\n\n- 59 -\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n 18 years old and above\n Must pass the personality / aptitude test\n Can communicate effectively both oral and written form\n Physically, emotionally and mentally fit\n Good moral character\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees\nby the school or training center delivering this TVET program.\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT:\nHILOT (WELLNESS MASSAGE) NC II\n\nRecommended list of tools, equipment and materials for the training of 20 trainees for\nHILOT (WELLNESS MASSAGE) NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10\nThermometer\n1\nCD/DVD Player\n(CD/DVD)\n5\nbtls.\nCoconut Oil\n5\nSphygmomanometer\n1\nTV\n10\nBanana Leaf Strips\nand Other Leaves\n5\nStethoscope\n1\nOHP\n10\nBath towels\n\n1\nWhiteboard\n30\nFace towel/hand\ntowel\n10\nStool\n10\nBed sheets\n2\nTrolley\n10\nBowls\n\n3\nMassage Table:\nL = 1.8M\nW = 0.8M\nH = 0.7 M\n10\nShorts\n6\nPillows\n\n10\nSmock gowns/bath\nrobes/Malongs\n10\nGauze masks\n10\nPillow cases\n\n5\nAlcohol (Ethyl)/Hand\nSanitizer\n\n5\nBasins\n\n5\nCouch Roll\n(Disposable Paper)\n\nReferences:\nAnatomy,\nPhysiology and First\nAid\n\n--- PDF PAGE 64 ---\nTR Hilot Wellness Massage NCII\n\n- 60 -\n3.5 TRAINING FACILITIES\nHILOT (WELLNESS MASSAGE) NC II\n\nThe Hilot (Wellness Massage) Therapy Learning Facility must be of concrete structure.\nBased on class size of 20 students / trainees the space requirements for the teaching /\nlearning and curriculum areas are as follows.\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN S.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nLaboratory Area\n4 X 5\n20\n20\nLearning Resources Area\n3 X 2\n 6\n 6\nWash Area/Comfort Room (male &\nfemale)\n2.5 X 4\n10\n10\nAdmin and Staff Room\n4 X 5\n20\n20\nCirculation Area\n4 X 4\n16\n16\nTotal Workshop Area\n\n114 sq. meters\n\n3.6 TRAINER QUALIFICATION (TQ II)\n\n Must be a certified Hilot\n Must have undergone training on Training Methodology II (TM II) or holder of NTTC\nCertificate for Healthcare Professionals\n Must be physically, emotionally and mentally fit\n Must possess good moral character\n With at least 2 years experience in the health service industry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 65 ---\nTR Hilot Wellness Massage NCII\n\n- 61 -"
