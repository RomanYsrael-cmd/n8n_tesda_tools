          "source_text": "1. Plan responses \n \n1.1 Responses are planned to instances of difficult or \nchallenging behavior to maximize the availability of other \nappropriate staff and resources. \n1.2 Specific \nmanifestations \nof \ndifficult \nor \nchallenging \nbehavior are identified and strategies appropriate to \nthese behaviors are planned as required. \n1.3 Safety of self and others is given priority in responding to \ndifficult or challenging behavior according to institutional \npolicies and procedures. \n2. Apply response \n \n2.1 Difficult or challenging behavior is dealt with promptly, firmly \nand diplomatically in accordance with institutional policy \nand procedures. \n2.2 Communication is used effectively to achieve the desired \noutcomes in responding to difficult or challenging behavior. \n2.3 Appropriate strategies are selected to suit particular \ninstances of difficult or challenging behavior. \n3. Report \nand \nreview incidents \n \n3.1 Incidents are reported according to institutional policies and \nprocedures. \n3.2 Incidents \nare \nreviewed \nwith \nappropriate \nstaff \nand \nsuggestions appropriate to area of responsibility are made. \n3.3 Debriefing mechanisms and other activities are used and \nparticipated in. \n3.4 Advice and assistance is sought from legitimate sources \nwhen appropriate.\n\n--- PDF PAGE 24 ---\nTR Hilot  Wellness Massage NCII \n \n- 20 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Planned \nresponses \n \n1.1 Own ability and experience \n1.2 Established institutional procedures \n1.3 Knowledge of individual persons and underlying causes \n2. Difficult or \nchallenging \nbehavior \n \n2.1 Aggression / Assaultive behavior \n2.2 Confusion or other cognitive impairment \n2.3 Noisiness \n2.4 Manipulative \n2.5 Wandering \n2.6 Self-destructive \n2.7 Intoxication \n2.8 Withdrawn / depressed \n2.9 Negativistic \n2.10 \nIntrusive behavior \n2.11 \nVerbal offensiveness \n3. Strategies for \ndealing with \nchallenging \nbehaviors \n3.1 Diversional activities \n3.2 Referring to appropriate personnel  e.g.  supervisor, \nsecurity officer \n3.3 Following established emergency response procedures \n4. Selection of \nstrategies for \ndealing with \nchallenging  \nbehaviors \n4.1 The nature of the incident \n4.2 Potential effect on different parties, patient, staff and others \n4.3 Established procedures and guidelines \n \n5. Institutional \npolices and \nprocedures \n \n5.1 Incident reporting and documentation \n5.2 Operational guidelines for handling incidents and/or cases \ninvolving difficult and challenging behavior \n5.3 Debriefing of staff involved in the incident\n\n--- PDF PAGE 25 ---\nTR Hilot  Wellness Massage NCII \n \n- 21 -"
