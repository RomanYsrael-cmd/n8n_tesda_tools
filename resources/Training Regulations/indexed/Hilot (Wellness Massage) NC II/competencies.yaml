        "source_title": "APPLY HILOT WELLNESS MASSAGE TECHNIQUES",
        "source_text": "--- PDF PAGE 44 ---\nTR Hilot  Wellness Massage NCII \n \n- 40 - \nUNIT OF COMPETENCY : \nAPPLY HILOT WELLNESS MASSAGE TECHNIQUES \nUNIT CODE \n \n :  HCS222303 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nperform a range of hilot wellness massage techniques.                             \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare client and \nwork area for hilot \nwellness massage \ntechniques \n1.1      Work area/s and work area environment are prepared \nsequentially according to hilot wellness massage techniques \nand client needs, relevant laws and workplace policies \nand procedures. \n1.2      Client preparation is conducted according to the hilot \nwellness program, relevant laws and workplace policies \nand procedures. \n1.3       Hilot area/s is/are prepared according to the hilot wellness \nprogram, relevant laws and workplace policies and \nprocedures. \n1.4       Wellness products, furnishings and paraphernalia are \nprepared and sequenced according to the hilot wellness \nprogram, manufacturer instructions, relevant laws and \nworkplace policies and procedures. \n2.  Prepare self for hilot \nwellness session \n2.1 \nPersonal hygiene practices are performed in accordance \nwith standard operating procedures. \n2.2 \nPre-hilot procedure is performed based on standard \noperating procedures. \n3.  Perform hilot \nwellness massage \ntechniques \n3.1      Imbalances in the body are located in accordance with \nmethods of scanning used by hilot. \n3.2      Hilot pressure areas are determined in accordance with its \ncharacteristics, location and indications. \n3.3      Hilot wellness massage techniques are applied in \naccordance with workplace policies and procedures. \n3.4      Length of hilot wellness massage techniques is varied to \nsuit client requirements. \n3.5 \nClient response is monitored throughout the hilot wellness \nsession and hilot wellness massage techniques are \nevaluated and adapted as required.\n\n--- PDF PAGE 45 ---\nTR Hilot  Wellness Massage NCII \n \n- 41 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Hilot wellness program \nMay include but is not limited to: \n1.1 Types of services  \n1.1.1 suob \n1.1.2 banyos \n1.1.3 paligo \n1.1.4 dagdagay \n1.1.5 bentosa \n1.1.6 hilod \n1.2 Hilot wellness massage techniques \n1.3 Duration of hilot wellness program \n1.4 Products \n1.5 Furnishings and paraphernalia \n2.  Work area/s \nMay include but are not limited to: \n2.1      Changing area \n2.2      Wellness lounge \n2.3      Wellness rooms \n3.  Relevant laws \nMust include but is not limited to: \n3.1      National and Local Health and Hygiene Regulations \n3.2      Occupational Health and Safety Regulations \n3.3      Industry Codes of Practice \n4.  Workplace policies and \nprocedures \nMay include but are not limited to: \n 4.1     Personal hygiene \n 4.2     Selection of products \n 4.3     Selection of hilot wellness massage techniques \n 4.4     Duration of wellness service \n 4.5     Work ethics \n 4.6     Cleaning and maintenance of equipment and facilities  \n 4.7     Response procedure to client behavior \n 4.8     Waste disposal  \n5.  Work area environment\nMay include but is not limited to: \n5.1   Privacy \n5.2   Temperature Control \n5.3    Lighting \n5.4    Sounds and Scents \n6.  Client preparation \n \nMay include but is not limited to: \n6.1   Disrobing \n6.2   Showering \n6.3   Appropriate Wardrobe\n\n--- PDF PAGE 46 ---\nTR Hilot  Wellness Massage NCII \n \n- 42 - \nVARIABLE \nRANGE \n7.  Wellness products \nMay include but are not limited to: \n7.1   Oils and Essences \n7.2   Exfoliants \n7.3   Salt/Minerals \n7.4   Muds/Clays/Algae\n8.  Furnishings and \nparaphernalia \nMay include but is not limited to: \n8.1    Bed \n8.2    Dipping tub \n8.3    Table \n8.4    Sauna/Steam \n8.5    Vaporizers \n8.6  Towels \n9.  Personal hygiene \npractices \nMay include but is not limited to: \n9.1   Hand washing \n9.2   Wearing appropriate attire\n10.  Pre-hilot procedure \nMay include but are not limited to: \n10.1  Silent prayer \n10.2  Gather positive energy with conscious breathing \n10.3  Apply coconut-based oil to hands \n10.4  Warm hands by rubbing them together or hold over a \nscented candle light\n11.  Hilot  methods of \nscanning \nMay include but is not limited to: \n11.1  Hand Scanning/Palpation \n11.2  Hilot Pulse Reading \n11.3  Hilot Thermal Reading (Init-Lamig) \n11.4  Procedures using banana and other leaves\n12.  Hilot wellness \nmassage techniques \nMust include but are not limited to: \n12.1   Locating the imbalances in the body  \n12.2   Hilot Pressure Areas \n12.3  Strokes  \n- Hagod (long deep stroke) \n- Haplos (short light stroke) \n- Pindot (one finger press)  \n- Pisil (two or more finger press)  \n- Piga (grasping) – optional \n12.4  Customized Amount of Pressure Applied \n12.5  Duration of Application of Pressure \n12.6  Direction of Massage \n- generally towards the heart \n- hot part of the body to cold (thermal flow) \n- towards the lesser lumps \n12.7  Pre-Hilot Procedure \n12.8  Use of hands and fingers as medium based on hilot \narea/body part, duration, frequency, rhythm, and amount of \npressure \n \n* *      Refer to the Matrix guide for more detailed guidelines / \ndescription of the above techniques\n\n--- PDF PAGE 47 ---\nTR Hilot  Wellness Massage NCII \n \n- 43 - \n \nMATRIX GUIDE \nHilot Area / Body Part \nS t r o k e ([a] from the hot area to the \ncold area; or [b] from the multiple \nnodule to the single nodule) \nFrequency \nRhythm  \n(Mabagal) \nAmount  \nof  \nPressure \n(Masakit \nngunit kayang \ntiisin) The \nfigures below \nare indicative \nnos.to start \nwith \nDuration  \n(hanggang \nmakita/madama ang \npagbabago; the figures \nbelow are indicative nos. \nto start with) \nHagod \nPindot \nPisil \nPiga \nlong  \ndeep \nstroke \nshort \nlight  \nstroke \none 