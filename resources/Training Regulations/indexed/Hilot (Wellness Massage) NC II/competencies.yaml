        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified specific manifestations of difficult or challenging\nbehavior and strategies are planned, selected and applied\nas required\n1.2 Maintained personal safety and the safety of others\n1.3 Reported incidents, reviewed and responded quickly and\neffectively to contingencies\n1.4 Debriefing mechanisms are used\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 OSH and issues relating to difficult and challenging\nbehavior\n2.2 Patient issues which need to be referred to an appropriate\nhealth professional\n2.3 Ability to interpret and follow the instructions and guidance\nof health professionals involved with the care of patient /\nclient\n3. Underpinning\nskills\n\n3.1 Effectively using techniques for monitoring own service\narea including client satisfaction\n3.2 Speaking in a firm, diplomatic and culturally appropriate\nmanner\n3.3 Remaining calm and positive in adversity\n3.4 Thinking and responding quickly and strategically\n3.5 Remaining alert to potential incidents of difficult or\nchallenging behavior\n3.6 Monitoring and/or maintaining security equipment\n3.7 Working with others and displaying empathy with patient\nand relatives\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2 Relevant institutional policy, guidelines, procedures and\nprotocols\n4.3 Emergency response procedures and employee support\narrangements\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2\nDemonstration with questioning\n\n6. Context of\nassessment\n\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 26 ---\nTR Hilot Wellness Massage NCII\n\n- 22 -\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\nUNIT CODE\n\n :"
        },
        "source_text": "HCS323202\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills and attitudes\nrequired to effectively respond to difficult or challenging behavior\nof patients.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan responses\n\n1.1 Responses are planned to instances of difficult or\nchallenging behavior to maximize the availability of other\nappropriate staff and resources.\n1.2 Specific\nmanifestations\nof\ndifficult\nor\nchallenging\nbehavior are identified and strategies appropriate to\nthese behaviors are planned as required.\n1.3 Safety of self and others is given priority in responding to\ndifficult or challenging behavior according to institutional\npolicies and procedures.\n2. Apply response\n\n2.1 Difficult or challenging behavior is dealt with promptly, firmly\nand diplomatically in accordance with institutional policy\nand procedures.\n2.2 Communication is used effectively to achieve the desired\noutcomes in responding to difficult or challenging behavior.\n2.3 Appropriate strategies are selected to suit particular\ninstances of difficult or challenging behavior.\n3. Report\nand\nreview incidents\n\n3.1 Incidents are reported according to institutional policies and\nprocedures.\n3.2 Incidents\nare\nreviewed\nwith\nappropriate\nstaff\nand\nsuggestions appropriate to area of responsibility are made.\n3.3 Debriefing mechanisms and other activities are used and\nparticipated in.\n3.4 Advice and assistance is sought from legitimate sources\nwhen appropriate.\n\n--- PDF PAGE 24 ---\nTR Hilot Wellness Massage NCII\n\n- 20 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Planned\nresponses\n\n1.1 Own ability and experience\n1.2 Established institutional procedures\n1.3 Knowledge of individual persons and underlying causes\n2. Difficult or\nchallenging\nbehavior\n\n2.1 Aggression / Assaultive behavior\n2.2 Confusion or other cognitive impairment\n2.3 Noisiness\n2.4 Manipulative\n2.5 Wandering\n2.6 Self-destructive\n2.7 Intoxication\n2.8 Withdrawn / depressed\n2.9 Negativistic\n2.10\nIntrusive behavior\n2.11\nVerbal offensiveness\n3. Strategies for\ndealing with\nchallenging\nbehaviors\n3.1 Diversional activities\n3.2 Referring to appropriate personnel e.g. supervisor,\nsecurity officer\n3.3 Following established emergency response procedures\n4. Selection of\nstrategies for\ndealing with\nchallenging\nbehaviors\n4.1 The nature of the incident\n4.2 Potential effect on different parties, patient, staff and others\n4.3 Established procedures and guidelines\n\n5. Institutional\npolices and\nprocedures\n\n5.1 Incident reporting and documentation\n5.2 Operational guidelines for handling incidents and/or cases\ninvolving difficult and challenging behavior\n5.3 Debriefing of staff involved in the incident\n\n--- PDF PAGE 25 ---\nTR Hilot Wellness Massage NCII\n\n- 21 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified specific manifestations of difficult or challenging\nbehavior and strategies are planned, selected and applied\nas required\n1.2 Maintained personal safety and the safety of others\n1.3 Reported incidents, reviewed and responded quickly and\neffectively to contingencies\n1.4 Debriefing mechanisms are used\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 OSH and issues relating to difficult and challenging\nbehavior\n2.2 Patient issues which need to be referred to an appropriate\nhealth professional\n2.3 Ability to interpret and follow the instructions and guidance\nof health professionals involved with the care of patient /\nclient\n3. Underpinning\nskills\n\n3.1 Effectively using techniques for monitoring own service\narea including client satisfaction\n3.2 Speaking in a firm, diplomatic and culturally appropriate\nmanner\n3.3 Remaining calm and positive in adversity\n3.4 Thinking and responding quickly and strategically\n3.5 Remaining alert to potential incidents of difficult or\nchallenging behavior\n3.6 Monitoring and/or maintaining security equipment\n3.7 Working with others and displaying empathy with patient\nand relatives\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2 Relevant institutional policy, guidelines, procedures and\nprotocols\n4.3 Emergency response procedures and employee support\narrangements\n\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2\nDemonstration with questioning\n\n6. Context of\nassessment\n\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 26 ---\nTR Hilot Wellness Massage NCII\n\n- 22 -\nUNIT OF COMPETENCY :\nAPPLY BASIC FIRST AID\nUNIT CODE\n\n :"
