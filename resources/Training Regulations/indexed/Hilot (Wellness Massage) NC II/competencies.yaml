        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained hilot history and development\n1.2\nExplained hilot framework\n1.3\nDetermined the hilot wellness massage techniques\n1.4\nApplied knowledge of hilot principles in the selection\nand sequencing of hilot wellness services\n1.5\nApplied knowledge of personal hygiene, including the\nprevention of cross infection\n1.6\nFollowed safety work practices\n1.7\nRecognized and managed contra-indications\n1.8\nUsed available furnishings and paraphernalia\n1.9\nUsed effective questioning and active listening\ntechniques to consult, reassure and negotiate with\nclients while maintaining discretion, tact and\nconfidentiality\n2. Underpinning knowledge\n2.1\nHilot History and Development, Framework\n2.2\nPersonal Hygiene and Prevention of Cross Infections\n2.3\nThe provisions relevant to Occupational Health and\nSafety Regulations\n2.4\nWorkplace policies and procedures in regard to the\nselection and sequencing of hilot wellness massage\nservices\n2.5\nAppearance and management of contra-indications\nand adverse effects\n2.6\nPre- and post requirements for recommended hilot\nwellness massage services\n2.7\nAnatomy, physiology and pathology of the skin and\nskin structures and biomechanics as it relates to hilot\nwellness services, including:\n2.7.1 a simplified cross-section of skin\n2.7.2 glands as they relate to basic skin function\n2.7.3 phases of growth, cell renewal, healing of skin\nand factors affecting epidermal mitosis\n2.7.4 normal process of skin ageing and structural\nchange\n2.7.5 percutaneous absorption and factors affecting\npenetration of cosmetics\n2.8\nBasic nutrition and the relationship between nutrition\n\n--- PDF PAGE 38 ---\nTR Hilot Wellness Massage NCII\n\n- 34 -\nand skin, particularly foods which may have an effect\non the skin or which may be contra-indicated in\ncombination with relevant skin conditions or products\nused in a hilot wellness service\n3. Underpinning skills\n3.1\nApplying hilot principles to the selection and\nsequencing of hilot wellness services\n3.2\nResponding to contra-indications and adverse effects\n3.3\nSequencing hilot wellness service to meet the needs\nof the client and make efficient use of furnishings and\nparaphernalia\n3.4\nCommunications skills to consult with client to select\nhilot wellness massage service and make\nrecommendations\n3.5\nLanguage, literacy and numeracy skills relevant to the\nrole and workplace requirements\n4. Method of assessment\nCompetency MUST be assessed through any two of the\nfollowing:\n4.1\nDemonstration with questioning\n4.2\nOral questioning/Interview\n4.3\nThird Party Report\n4.4\nWritten Report\n5. Resource implications\nThe following resources MUST be provided:\n5.1\nRelevant documentation, such as: workplace policy\nand procedures manuals\n5.2\nAccess to a range of clients with different\nrequirements\n5.3\nA range of furnishings and paraphernalia\n5.4\nProduct labels and sources of product information\n5.5\nA qualified workplace assessor\n6. Context of assessment\n6.1\nAssessment should be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 39 ---\nTR Hilot Wellness Massage NCII\n\n- 35 -\nUNIT OF COMPETENCY :\nPROVIDE PRE-SERVICE TO CLIENTS\nUNIT CODE\n:"
        },
        "source_text": "HCS222301\n\nUNIT DESCRIPTOR\n:\nThis unit describes the knowledge, skills and attitudes required\nto consult with client/s and select and sequence a range of hilot\nwellness techniques as a program.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess/Interview\nclient\n1.1 When necessary, hilot is explained to client in simple\nterms\n1.2\nRelevant information is obtained from the client to\ndetermine their expectations/requirements.\n1.3 Hilot wellness services and products are explained to\nthe client.\n1.4 Contra-indications are identified, discussed with the\nclient and referred to an appropriate professional where\nrequired.\n1.5 Special needs of the client are identified.\n2. Determine the hilot\nwellness program\n2.1\nHilot wellness service recommendations are discussed\nwith client.\n2.2\nTreatment/s are agreed and scheduled with client.\n2.3\nPre-hilot wellness advice and post-hilot wellness\nadvice is provided to client according to the hilot wellness\nprogram.\n2.4\nHilot wellness program is recorded according to\nworkplace policies and procedures.\n2.5\nClient is booked for hilot wellness program.\n3. Confirm hilot\nwellness program\n3.1\nClient hilot wellness program is assessed.\n3.2\nAny variations in the hilot wellness program are\nidentified and noted.\n3.3\nThe hilot wellness program is confirmed with the client.\n3.4\nWritten consent is obtained from client.\n\n--- PDF PAGE 35 ---\nTR Hilot Wellness Massage NCII\n\n- 31 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hilot\n\nMust include but are not limited to:\n1.1 Hilot history and development\n1.1.1\nHistory of Filipino traditional medicine\n1.1.2\nHealth Concepts in Filipino Traditional Medicine\n1.1.3\nThe Filipino Traditional Healers\n1.1.4\nPractices of Filipino Traditional Healers\n1.2 Hilot Framework (Philosophy and Science)\n1.2.1\nPhilosophy of hilot\n1.2.1.1 Universal Laws and Natural Laws\n1.2.2\nHealth concepts\n1.2.2.1 Harmony of the three faculties (mind, body,\nemotion)\n1.2.2.2 Balance of Four Elements\n1.3 Healing concepts\n1.3.1\nValuing process “pagpapahalaga”\n1.3.2\nBalancing of the four elements thru the following\nHealing modalities\n• Hilot Herbal\n• Hilot Massage\n• Hilot Oracion\n1.4 Hilot wellness massage techniques\n1.4.1\nPre-hilot Procedure\n1.4.2\nMethods in scanning imbalances in the body\n1.4.3\nHilot Areas\n1.4.4\nHilot Massage Strokes\n1.4.5\nApplication of pressure\n1.4.6\nDuration of Application of Pressure\n2 Relevant\ninformation\nMay include but is not limited to:\n2.1 Vital signs\n2.2 Previous treatments\n2.3 Physical attributes\n2.4 Lifestyle\n2.5 Time constraints\n2.6\nBudgetary constraints\n3 Client/s\nMay include but are not limited to:\n3.1 New or regular guests with routine or special needs\n4 Expectations\nrequirements\nMay include but are not limited to:\n4.1 Improved relaxation\n4.2 Improved sense of well-being\n4.3 Improved skin condition\n4.4 Stress reduction\n5 Hilot wellness\nservices\n5.1 Must include:\n5.1.1 Hilot wellness massage\n5.1.2 Use of coconut-based oils\n5.2 May include but are not limited to:\n5.2.1 Herbal Treatments\n5.2.2 Oils and Essences\n5.2.3 Mineral Treatments\n5.2.4 Water Treatments\n\n--- PDF PAGE 36 ---\nTR Hilot Wellness Massage NCII\n\n- 32 -\n\nVARIABLE\nRANGE\n6 Hilot products\nMust include:\n6.1 Coconut-based oils\n6.1.1\nPre-blended aromatic plant oils\n6.1.2\nExfoliants\n6.1.3\nMuds/Clays/Algae\n6.1.4\nBanana Leaves\n7 Contra-indications\nMay include but are not limited to:\n7.1 Bacterial, viral or fungal infections\n7.2 Scabies\n7.3 Boils/Carbuncles\n7.4 Ringworm\n7.5 Allergies\n7.6 All Kinds of Burns\n7.7 Skin Lesions\n7.8 Skin Trauma\n7.9 Metal Implants/Pacemakers\n7.10 Hypertension\n7.11 Intoxication form alcohol and dangerous drugs\n7.12 Conditions requiring consent from a medical practitioner\n8 Appropriate professional\n\nMay include but is not limited to:\n8.1 Medical Practitioner\n8.2 Complementary Therapist (Albularyo)\n9 Special needs\nMay include but is not limited to:\n9.1 Mobility assistance\n9.2 Cultural requirements\n10 Hilot wellness services\nand products\nrecommendations\nMay include but are not limited to:\n10.1 Types of hilot wellness services and products\n10.2 Hilot wellness massage techniques\n10.3 Duration and intensity of hilot wellness massage\ntechniques\n10.4\nPost hilot wellness advice\n11 Pre-hilot wellness advice\nMay include but is not limited to:\n11.1 Abstaining from alcohol and dangerous drugs\n11.2 Avoiding over-eating or having a full stomach\n11.3\nTaking a bath or shower\n12 Post-hilot wellness advice\nMay include but is not limited to:\n12.1 Room Temperature or Warm Hydration\n12.2 Avoiding exposure to extreme temperatures\n12.3 Avoiding taking a bath until body temperature\nnormalizes (at least 6 hrs)\n13 Hilot wellness program\nMay include but is not limited to:\n13.1 Quieting and/or prayer/invocation\n13.2 Diagnosis of energy blockages\n13.3 Hilot wellness massage techniques\n13.4 Duration of hilot wellness massage techniques\n13.5 Products\n13.6 Equipment\n13.7 Contra-indications\n13.8 Special Needs\n13.9\nPost-hilot wellness service/care\n\n--- PDF PAGE 37 ---\nTR Hilot Wellness Massage NCII\n\n- 33 -\nVARIABLE\nRANGE\n14 Workplace policies and\nprocedures\nMay include but are not limited to:\n14.1 Health and hygiene legislation/regulations\n14.2 Sequencing hilot wellness program\n14.3 Privacy of client information\n14.4 Occupational Health and Safety\n14.5\nWorkplace/Organizational Guidelines\n15 Variations in hilot\nwellness program\nMay include but are not limited to:\n15.1 Changes in client’s physical condition\n15.2 Changes in client’s requirements\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained hilot history and development\n1.2\nExplained hilot framework\n1.3\nDetermined the hilot wellness massage techniques\n1.4\nApplied knowledge of hilot principles in the selection\nand sequencing of hilot wellness services\n1.5\nApplied knowledge of personal hygiene, including the\nprevention of cross infection\n1.6\nFollowed safety work practices\n1.7\nRecognized and managed contra-indications\n1.8\nUsed available furnishings and paraphernalia\n1.9\nUsed effective questioning and active listening\ntechniques to consult, reassure and negotiate with\nclients while maintaining discretion, tact and\nconfidentiality\n2. Underpinning knowledge\n2.1\nHilot History and Development, Framework\n2.2\nPersonal Hygiene and Prevention of Cross Infections\n2.3\nThe provisions relevant to Occupational Health and\nSafety Regulations\n2.4\nWorkplace policies and procedures in regard to the\nselection and sequencing of hilot wellness massage\nservices\n2.5\nAppearance and management of contra-indications\nand adverse effects\n2.6\nPre- and post requirements for recommended hilot\nwellness massage services\n2.7\nAnatomy, physiology and pathology of the skin and\nskin structures and biomechanics as it relates to hilot\nwellness services, including:\n2.7.1 a simplified cross-section of skin\n2.7.2 glands as they relate to basic skin function\n2.7.3 phases of growth, cell renewal, healing of skin\nand factors affecting epidermal mitosis\n2.7.4 normal process of skin ageing and structural\nchange\n2.7.5 percutaneous absorption and factors affecting\npenetration of cosmetics\n2.8\nBasic nutrition and the relationship between nutrition\n\n--- PDF PAGE 38 ---\nTR Hilot Wellness Massage NCII\n\n- 34 -\nand skin, particularly foods which may have an effect\non the skin or which may be contra-indicated in\ncombination with relevant skin conditions or products\nused in a hilot wellness service\n3. Underpinning skills\n3.1\nApplying hilot principles to the selection and\nsequencing of hilot wellness services\n3.2\nResponding to contra-indications and adverse effects\n3.3\nSequencing hilot wellness service to meet the needs\nof the client and make efficient use of furnishings and\nparaphernalia\n3.4\nCommunications skills to consult with client to select\nhilot wellness massage service and make\nrecommendations\n3.5\nLanguage, literacy and numeracy skills relevant to the\nrole and workplace requirements\n4. Method of assessment\nCompetency MUST be assessed through any two of the\nfollowing:\n4.1\nDemonstration with questioning\n4.2\nOral questioning/Interview\n4.3\nThird Party Report\n4.4\nWritten Report\n5. Resource implications\nThe following resources MUST be provided:\n5.1\nRelevant documentation, such as: workplace policy\nand procedures manuals\n5.2\nAccess to a range of clients with different\nrequirements\n5.3\nA range of furnishings and paraphernalia\n5.4\nProduct labels and sources of product information\n5.5\nA qualified workplace assessor\n6. Context of assessment\n6.1\nAssessment should be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 39 ---\nTR Hilot Wellness Massage NCII\n\n- 35 -\nUNIT OF COMPETENCY :\nPROVIDE PRE-SERVICE TO CLIENTS\nUNIT CODE\n:"
