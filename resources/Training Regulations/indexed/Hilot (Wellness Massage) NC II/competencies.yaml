        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted a hilot wellness program and made any\nadjustments required by variations in the client’s condition\n1.2 Applied consistently knowledge on personal hygiene,\nincluding the prevention of cross infection\n1.3 Applied consistently knowledge on relevant national and\nlocal laws/requirements and industry Codes of Practice\n1.4 Recognized and managed all aspects of area safety\n1.5 Recognized and managed contra-indications and adverse\neffects\n1.6 Monitored and applied appropriate service, technique and\nfurnishings and paraphernalia according to client’s needs\n1.7 Used consistently effective questioning and active listening\ntechniques to consult, reassure and negotiate with clients\nwhile maintaining discretion, tact and confidentiality\n1.8 Applied knowledge of a variety of hilot products\n1.9 Used time consistently, effectively and controlled product\nwaste\n1.10 Evaluated a hilot wellness program and advised the client\non future treatments, homecare and complementary\nproducts\n1.1 Read, interpreted accurately and applied consistently\nmanufacturer’s instruction for products and equipment\n2. Underpinning\nknowledge\n\n2.1 Provisions of relevant health and hygiene regulations/\nrequirements\n2.2 Provisions of relevant Occupational Health and Safety\nRegulations/Requirements\n2.3 Personal hygiene and the transmission of microbes and\ninfections\n2.4 Workplace policies and procedures in regard to the\nperformance of hilot wellness massage techniques\n2.5 The effects and benefits of a defined range of hilot products\nand paraphernalia\n2.6 Factors likely to affect the suitability of each hilot wellness\n massage technique to client needs and the effects and\n benefits.\n2.7 Anatomy, physiology and pathology of the skin and skin\n structures as it relates to hilot wellness techniques,\nincluding:\n - a simplified cross-section of skin\n- glands as they relate to basic skin function\n- skin chemicals, including sebum and sweat production,\nnormal and abnormal, collagen, elastin and lipids\n- phases of growth, cell renewal, healing of skin and factors\naffecting epidermal mitosis\n- normal process of skin and ageing and structural change\n- percutaneous absorption and factors affecting penetration\nof cosmetics\n\n--- PDF PAGE 53 ---\nTR Hilot Wellness Massage NCII\n\n- 49 -\n\n2.8 The following body systems as listed below, in regard to\ntheir interdependence and purpose:\n- skeletal and muscular system, including muscle\nmovements and motor points, position and action of\nsuperficial muscles of the face, throat and chest\n- nervous system and its relationship to skin sensations\n- lymphatic, digestive, respiratory and circulatory systems\nand their relationship to skin function, including\nthermoregulation and homeostasis\n- endocrine and reproductive systems in relationship to\nhormonal control of the skin\n- integumentary system\n2.9\nBasic nutrition and its relationship to body wellness\n2.10 Herbs, oils, minerals and other ingredients in relevant hilot\nproducts and their effects on the skin\n3. Underpinning skills\n3.1 Applying appropriate hilot wellness massage techniques\nand products based on client needs and condition\n3.2 Applying personal hygiene\n3.3 Applying area safety\n3.4 Taking appropriate action against adverse effects\n3.5 Answering questions of clients and providing information as\nneeded\n3.6\nApplying language, literacy and numeracy skills relevant to\nthe role and workplace requirements\n4. Method of\nassessment\nCompetency MUST be assessed through any two of the following:\n4.1 Demonstration with oral questioning\n4.2 Observation with oral questioning\n4.3 Interview\n4.4 Third Party Report\n5. Resource implication\nThe following resources MUST be provided:\n5.1 Relevant documentation, such as:\n - workplace policy and procedures manuals\n5.2 Access to a range of clients with different requirements\n5.3 A range of services, products and paraphernalia\nappropriate to the workplace\n5.1\nProduct labels and sources of product information\n5.2\nA qualified workplace assessor\n\n6. Context of\nassessment\n6.1\nAssessment should be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 54 ---\nTR Hilot Wellness Massage NCII\n\n- 50 -\nUNIT OF COMPETENCY :\nPROVIDE POST-ADVICE AND POST-SERVICES TO\nCLIENTS\nUNIT CODE\n\n :"
        },
        "source_text": "HCS222303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nperform a range of hilot wellness massage techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client and\nwork area for hilot\nwellness massage\ntechniques\n1.1 Work area/s and work area environment are prepared\nsequentially according to hilot wellness massage techniques\nand client needs, relevant laws and workplace policies\nand procedures.\n1.2 Client preparation is conducted according to the hilot\nwellness program, relevant laws and workplace policies\nand procedures.\n1.3 Hilot area/s is/are prepared according to the hilot wellness\nprogram, relevant laws and workplace policies and\nprocedures.\n1.4 Wellness products, furnishings and paraphernalia are\nprepared and sequenced according to the hilot wellness\nprogram, manufacturer instructions, relevant laws and\nworkplace policies and procedures.\n2. Prepare self for hilot\nwellness session\n2.1\nPersonal hygiene practices are performed in accordance\nwith standard operating procedures.\n2.2\nPre-hilot procedure is performed based on standard\noperating procedures.\n3. Perform hilot\nwellness massage\ntechniques\n3.1 Imbalances in the body are located in accordance with\nmethods of scanning used by hilot.\n3.2 Hilot pressure areas are determined in accordance with its\ncharacteristics, location and indications.\n3.3 Hilot wellness massage techniques are applied in\naccordance with workplace policies and procedures.\n3.4 Length of hilot wellness massage techniques is varied to\nsuit client requirements.\n3.5\nClient response is monitored throughout the hilot wellness\nsession and hilot wellness massage techniques are\nevaluated and adapted as required.\n\n--- PDF PAGE 45 ---\nTR Hilot Wellness Massage NCII\n\n- 41 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hilot wellness program\nMay include but is not limited to:\n1.1 Types of services\n1.1.1 suob\n1.1.2 banyos\n1.1.3 paligo\n1.1.4 dagdagay\n1.1.5 bentosa\n1.1.6 hilod\n1.2 Hilot wellness massage techniques\n1.3 Duration of hilot wellness program\n1.4 Products\n1.5 Furnishings and paraphernalia\n2. Work area/s\nMay include but are not limited to:\n2.1 Changing area\n2.2 Wellness lounge\n2.3 Wellness rooms\n3. Relevant laws\nMust include but is not limited to:\n3.1 National and Local Health and Hygiene Regulations\n3.2 Occupational Health and Safety Regulations\n3.3 Industry Codes of Practice\n4. Workplace policies and\nprocedures\nMay include but are not limited to:\n 4.1 Personal hygiene\n 4.2 Selection of products\n 4.3 Selection of hilot wellness massage techniques\n 4.4 Duration of wellness service\n 4.5 Work ethics\n 4.6 Cleaning and maintenance of equipment and facilities\n 4.7 Response procedure to client behavior\n 4.8 Waste disposal\n5. Work area environment\nMay include but is not limited to:\n5.1 Privacy\n5.2 Temperature Control\n5.3 Lighting\n5.4 Sounds and Scents\n6. Client preparation\n\nMay include but is not limited to:\n6.1 Disrobing\n6.2 Showering\n6.3 Appropriate Wardrobe\n\n--- PDF PAGE 46 ---\nTR Hilot Wellness Massage NCII\n\n- 42 -\nVARIABLE\nRANGE\n7. Wellness products\nMay include but are not limited to:\n7.1 Oils and Essences\n7.2 Exfoliants\n7.3 Salt/Minerals\n7.4 Muds/Clays/Algae\n8. Furnishings and\nparaphernalia\nMay include but is not limited to:\n8.1 Bed\n8.2 Dipping tub\n8.3 Table\n8.4 Sauna/Steam\n8.5 Vaporizers\n8.6 Towels\n9. Personal hygiene\npractices\nMay include but is not limited to:\n9.1 Hand washing\n9.2 Wearing appropriate attire\n10. Pre-hilot procedure\nMay include but are not limited to:\n10.1 Silent prayer\n10.2 Gather positive energy with conscious breathing\n10.3 Apply coconut-based oil to hands\n10.4 Warm hands by rubbing them together or hold over a\nscented candle light\n11. Hilot methods of\nscanning\nMay include but is not limited to:\n11.1 Hand Scanning/Palpation\n11.2 Hilot Pulse Reading\n11.3 Hilot Thermal Reading (Init-Lamig)\n11.4 Procedures using banana and other leaves\n12. Hilot wellness\nmassage techniques\nMust include but are not limited to:\n12.1 Locating the imbalances in the body\n12.2 Hilot Pressure Areas\n12.3 Strokes\n- Hagod (long deep stroke)\n- Haplos (short light stroke)\n- Pindot (one finger press)\n- Pisil (two or more finger press)\n- Piga (grasping) – optional\n12.4 Customized Amount of Pressure Applied\n12.5 Duration of Application of Pressure\n12.6 Direction of Massage\n- generally towards the heart\n- hot part of the body to cold (thermal flow)\n- towards the lesser lumps\n12.7 Pre-Hilot Procedure\n12.8 Use of hands and fingers as medium based on hilot\narea/body part, duration, frequency, rhythm, and amount of\npressure\n\n* * Refer to the Matrix guide for more detailed guidelines /\ndescription of the above techniques\n\n--- PDF PAGE 47 ---\nTR Hilot Wellness Massage NCII\n\n- 43 -\n\nMATRIX GUIDE\nHilot Area / Body Part\nS t r o k e ([a] from the hot area to the\ncold area; or [b] from the multiple\nnodule to the single nodule)\nFrequency\nRhythm\n(Mabagal)\nAmount\nof\nPressure\n(Masakit\nngunit kayang\ntiisin) The\nfigures below\nare indicative\nnos.to start\nwith\nDuration\n(hanggang\nmakita/madama ang\npagbabago; the figures\nbelow are indicative nos.\nto start with)\nHagod\nPindot\nPisil\nPiga\nlong\ndeep\nstroke\nshort\nlight\nstroke\none\nfinger\npress\ntwo\nfinger\npress\ngrasping\n\n ankle\n\nX\nX\nX\n1x\n1-2-3 rhythm\n3 lbs\n7 sec\nbukong bukong\n\nx\n\nMabagal\nMasakit ngunit\nkayang tiisin\n2\n\n temple\n\nX\nX\n\n1x\n1-2-3 rhythm\n1 to 3 lbs\n\n thigh\nX\nX\n\n12x\n1-2-3 rhythm &\n1-2-3-4-5-6-7 rhythm\n3-5 lbs\n3 sec\nIbabaw ng Hita\n(labas, loob, gitna)\nX\n\nMabagal\nMasakit ngunit\nkayang tiisin\n4\nLoob ng Hita\n(labas, loob, gitna)\nX\n\nMabagal\nMasakit ngunit\nkayang tiisin\n4\n\nabdomen around the navel\n\nX\n\n3x\n1-2-3 rhythm\n1 lb\n3 min\n\nback of knee\n\nX\n\n1x\n1-2-3 rhythm\n1-3 lbs\n3