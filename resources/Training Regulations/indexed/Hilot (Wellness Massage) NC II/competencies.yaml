        "source_title": "MAINTAIN HIGH STANDARDS OF PATIENT/CLIENT SERVICES",
        "source_text": "--- PDF PAGE 30 ---\nTR Hilot  Wellness Massage NCII \n \n- 26 - \nUNIT OF COMPETENCY : MAINTAIN HIGH STANDARDS OF PATIENT/CLIENT SERVICES \nUNIT CODE \n:  HCS323204 \nUNIT DESCRIPTOR \n : This unit covers the knowledge, skills and attitudes required in \nthe maintenance of high standards of patient/client services. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Communicate  \n     appropriately with  \n     patients/clients \n \n1.1 \nEffective communication strategies and techniques are \nidentified and used to achieve best patient/client service \noutcomes. \n1.2 \nComplaints \nare \nresponded \nto \nin \naccordance \nwith \norganizational \npolicy \nto \nensure \nbest \nservice \nto \npatient/clients. \n1.3 \nComplaints are dealt with in accordance with established \nprocedures. \n1.4 \nInterpreter services are accessed as required. \n1.5 \nAction is taken to resolve conflicts either directly, where a \npositive outcome can be immediately achieved, or by \nreferral to the appropriate personnel. \n1.6 \nParticipation in work team is constructive and collaborative \nand demonstrates an understanding of own role.\n2. Establish and  \n      maintain good  \n      interpersonal  \n      relationship with  \n      patient/clients \n \n1.7 \nRapport is established to ensure the service is appropriate \nto and in the best interests of patient/clients. \n2.1 \nEffective listening skills are used to ensure a high level of \neffective communication and quality of service. \n2.2 \nPatient/client concerns and needs are correctly identified \nand responded to responsibly and according to established \nprocedures and guidelines. \n2.3 \nEffectiveness of interpersonal interaction is consistently \nmonitored and evaluated to ensure best patient/client \nservice outcomes.\n3. Act in a  \n     respectful  \n     manner at all  \n     times \n \n3.1 \nRespect for differences is positively, actively and \nconsistently demonstrated in all work. \n3.2 \nConfidentiality \nand \nprivacy \nof \npatient/client \nis \nmaintained. \n3.3 \nCourtesy \nis \ndemonstrated \nin \nall \ninteractions \nwith \npatient/client. \n3.4 \nAssistance with the care of patient/client with challenging \nbehaviors is provided in accordance with established \nprocedures. \n3.5\nTechniques are used to manage and minimize aggression.\n4. Evaluate own work to \nmaintain a high \nstandard of \npatient/client service \n4.1 \nAdvice and assistance is received or sought from \nappropriate sources on own performance. \n4.2 \nOwn work is adjusted, incorporating recommendations that \naddress performance issues, to maintain the agreed \nstandard of patient support.\n\n--- PDF PAGE 31 ---\nTR Hilot  Wellness Massage NCII \n \n- 27 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Patients/client \n \nThis may include but not limited to: \n1.1 Patients/clients \n1.2 Prospective patients/clients to the service or services \n1.3 Patients/clients may be in contact with the institution through \nappropriate health care personnel and professionals or other \nadvocates or agencies \n2. Others with whom \ninteraction \nis \nrequired in regard \nto \npatient/client \nservices \n \n2.1 Other staff and team members \n2.2 Service units or departments \n2.3 Family members and friends of patients/clients \n2.4 Professional representatives or agents of patient/clients such \nas: \n- \nMedical specialist \n- \nNurses \n- \nSocial workers \n- \nDietitians \n- \nTherapists \n- \nAllied health professionals \n- \nVolunteers \n- \nTeachers and/or spiritual \n- \nCommunity \n2.5 General public \n3. Communication \n \n3.1 English / Tagalog / Vernacular \n3.2 Sign language \n3.3 Through an interpreter \n3.4 Community language as required by the service / \norganization \n4. Modes of \ncommunication: \n \n4.1 Continuing interaction with patients and clients \n4.2 Verbal conversations either in person or via telephone \n4.3 Written notes by post or electronic media  \n4.4 Worker, family member friend or professional interpreter who \nhas relevant languages\n\n--- PDF PAGE 32 ---\nTR Hilot  Wellness Massage NCII \n \n- 28 - \n \nVARIABLE \nRANGE \n5. Respect for \ndifference \n5.1 Physical \n5.2 Cognitive / mental or intellectual issues that may impact on \ncommunication \n5.3 Cultural and ethnic \n5.4 Religious / spiritual \n5.5 Social \n5.6 Age \n5.7 Language literacy and numeracy abilities \n5.8 Sexuality and sexual preference \n6. Confidentiality \nand privacy of \npatients/clients \n \n6.1 Fees \n6.2 Health fund entitlements \n6.3 Welfare entitlements \n6.4 Payment methods and records \n6.5 Public environments \n6.6 Legal and ethical requirements \n6.7 Writing details i.e. medical and consent forms \n6.8 Conversations on the telephone \n6.9 Secure location for written records \n6.10 \nOffering a private location for discussions \n6.11 \nInformation disclosed to \nan appropriate person \nconsistent with one’s level of responsibility \n7. Performance \nmonitoring \n \n7.1 Self-monitoring \n7.2 Supervisor assessment \n7.3 Patient/client feedback\n\n--- PDF PAGE 33 ---\nTR Hilot  Wellness Massage NCII \n \n- 29 - \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidences that the candidate: \n1.1 Communicated appropriately with patients \n1.2 Handled complaints and resolved conflict, or referred \nmatters to supervisors when required \n1.3 Complied with relevant policies, protocols, guidelines and \nprocedures of the organization \n1.4 Establish and maintained good interpersonal relationship \nwith patients \n1.5 Demonstrated courtesy in all  interactions with patients, \ntheir visitors, and family \n2. Underpinning \nknowledge and \nattitudes \n \n2.1 Roles and responsibilities of self and other workers within \nthe organization \n2.2 When client / patient issues need to be referred to an \nappropriate health professional \n2.3 Organizational policies and procedures for privacy and \nconfidentiality of information provided by patients and \nothers \n2.4 Knowledge of cultures relevant to the particular service \n2.5 Institutional policy on patient rights and responsibilities \n3. Underpinning \nskills \n \n3.1 Establishing and maintaining relationships, taking into \naccount individual differences \n3.2 Using effective listening techniques \n3.3 Using appropriate verbal and non verbal communication \nstyles \n3.4 Interpreting and following the instructions and guidance of \nhealth professionals involved with the care of patients / \nclients \n3.5 Oral and written communication \n3.6 Problem solving skills required include the ability to use \navailable resources and prioritize workload \n3.7 Dealing with conflict \n3.8 Working with others and displaying empathy with patient \nand relatives\n4. Resource \nimplications \n \nThe following resources MUST be provided: \n4.1 Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place. \n \n4.2 Relevant government and organizational policy guidelines, \nprocedures and protocols \n4.3 Any relevant legislation in relation to service delivery \n5. Method of \nassessment \n \nCompetency may be assessed through: \n5.1 Demonstration with questioning \n5.2 Interview \n5.3 Third party report\n6. Context of \nassessment \n6.1 Assessment may be done in a simulated workplace setting\n",
        "required_knowledge": null,
        "required_skills": null
      }
