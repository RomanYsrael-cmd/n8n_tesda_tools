        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Complied with institutional, OSH laws infections control and\nmanual handling procedures and relevant health regulations\n1.2 Identified physical hazards of the casualty and minimized\nimmediate risks\n1.3 Assessed and monitored the physical condition of the casualty\n1.4 Responded to emergency using basic life support measures\n1.5 Provided initial response where First Aid is required\n1.6 Dealt with complex casualties or incident\n1.7 Prepared reports to concerned personnel in a timely manner\n2. Underpinning\nknowledge\n2.1 Basic anatomy and physiology\n2.2 Company standard operating procedures (SOPs)\n2.3 Dealing with confidentiality\n2.4 Knowledge of the First Aiders’ skills limitations\n2.5 OSH legislation and regulations\n2.6 How to gain access to and interpret material safety data sheets\n3. Underpinning skills\n3.1 Resuscitation\n3.2 Safe manual handling of casualty\n3.3 Consideration of the welfare of the casualty\n3.4 Report preparation\n3.5 Communication skills\n3.6 Interpreting and using listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Access to relevant work station\n4.2 Relevant institutional policies, guidelines, procedures and\nprotocol\n4.3 Equipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Interview\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Assessment may be done in a workplace or simulated work\narea setting.\n\n--- PDF PAGE 30 ---\nTR Hilot Wellness Massage NCII\n\n- 26 -\nUNIT OF COMPETENCY : MAINTAIN HIGH STANDARDS OF PATIENT/CLIENT SERVICES\nUNIT CODE\n:"
        },
        "source_text": "HCS323203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this\nunit it is assumed that the First Aider is working under the\nsupervision and/or according to established workplace First Aid\nprocedures and policies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess the situation\n1.1\nPhysical hazards to self and casualty’s health and safety are\nidentified.\n1.2\nImmediate risks to self and casualty’s occupational health and\nsafety (OSH) are minimized by controlling the hazard in\naccordance with OSH requirements.\n1.3 Casualty’s vital signs and physical condition are assessed in\naccordance with workplace procedures.\n2 Apply basic first aid\ntechniques\n2.1 First Aid management is provided in accordance with\nestablished First Aid procedures.\n2.2 Casualty is reassured in a caring and clam manner and made\ncomfortable using available resources.\n2.3 First Aid assistance is sought from others in a timely manner\nand as appropriate.\n2.4 Casualty’s condition is monitored and responded to in\naccordance with effective First Aid principles workplace\nprocedures.\n2.5 Details of casualty’s physical condition, changes in conditions,\nmanagement and response are accurately recorded in line\nwith organizational procedures.\n2.6 Casualty management is finalized according to his/her needs\nand First Aid principles.\n3. Communicate details\nof the incident\n3.1\n Appropriate medical assistance is requested using relevant\ncommunication media and equipment.\n3.2\nDetails of casualty’s condition and management activities are\naccurately conveyed to emergency services/relieving\npersonnel.\n3.3 Reports to supervisors are prepared in a timely manner,\npresenting all relevant facts according to established company\nprocedures.\n\n--- PDF PAGE 27 ---\nTR Hilot Wellness Massage NCII\n\n- 23 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. First Aid\nManagement\nThis may include but not limited to:\n1.1 Workplace policies and procedures\n1.2 Industry/site specific regulations, codes\n1.3 OSH\n1.4 National workplace health and safety requirements\n1.5 Allergies the casualty may have\n2. Physical Hazards\nMay include:\n2.1 Workplace hazards\n2.2 Environmental hazards\n2.3 Proximity of other people\n2.4 Hazards associated with casualty management processes\n3. Risks\nMay include:\n3.1 Worksite equipment, machinery and substances\n3.2 Environmental risks\n3.3 Bodily fluids\n3.4 Risk of further injury to the casualty\n3.5 Risk associated with the proximity of the others and bystanders\n4. Casualty’s Condition\nMay include but are not limited to:\n4.1 CPR\n4.2 Allergic reactions (anaphylaxis)\n4.3 hypothermia\n4.4 Burns-thermal, chemical, friction, electrical\n4.5 Blisters\n4.6 Chemical contamination\n4.7 Cold injuries\n4.8 Dislocations\n4.9 Drowning\n4.10 Sprain\n4.11 Minor skin injuries (bruise, cuts and scrapes)\n4.12 Shock\n4.13 Smoke inhalation\n5. Equipment and\nResources\nThis may include but not limited to:\n5.1 Defibrillation units\n5.2 Pressure bandages\n5.3 Thermometers\n5.4 First Aid kit\n5.5 Eyewash\n5.6 Thermal blankets\n5.7 Pocket face masks\n\n--- PDF PAGE 28 ---\nTR Hilot Wellness Massage NCII\n\n- 24 -\nVARIABLE\nRANGE\n5.8 Rubber gloves\n5.9 Dressing\n5.10 Space device\n5.11 Cervical collars\n6. Communication\nSystem\nMay include but are not limited to:\n6.1 Mobile phones\n6.2 Satellite phones\n6.3 HF/VHF radio\n6.4 Flags\n6.5 Flares\n6.6 Two-way radio\n6.7 E-mail\n6.8 Electronic equipment\n7. Vital signs\n7.1 Airway\n7.2 Breathing\n7.3 Circulation\n7.4 Consciousness\n8. First Aid Principles\n8.1 Checking the site for danger to self, casualty and others and\nminimizing the danger\n8.2 Checking and maintaining the casualty’s airways, breathing and\ncirculation\n\n--- PDF PAGE 29 ---\nTR Hilot Wellness Massage NCII\n\n- 25 -\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Complied with institutional, OSH laws infections control and\nmanual handling procedures and relevant health regulations\n1.2 Identified physical hazards of the casualty and minimized\nimmediate risks\n1.3 Assessed and monitored the physical condition of the casualty\n1.4 Responded to emergency using basic life support measures\n1.5 Provided initial response where First Aid is required\n1.6 Dealt with complex casualties or incident\n1.7 Prepared reports to concerned personnel in a timely manner\n2. Underpinning\nknowledge\n2.1 Basic anatomy and physiology\n2.2 Company standard operating procedures (SOPs)\n2.3 Dealing with confidentiality\n2.4 Knowledge of the First Aiders’ skills limitations\n2.5 OSH legislation and regulations\n2.6 How to gain access to and interpret material safety data sheets\n3. Underpinning skills\n3.1 Resuscitation\n3.2 Safe manual handling of casualty\n3.3 Consideration of the welfare of the casualty\n3.4 Report preparation\n3.5 Communication skills\n3.6 Interpreting and using listed documents\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Access to relevant work station\n4.2 Relevant institutional policies, guidelines, procedures and\nprotocol\n4.3 Equipment and materials relevant to the proposed activities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Interview\n5.3 Third Party Report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Assessment may be done in a workplace or simulated work\narea setting.\n\n--- PDF PAGE 30 ---\nTR Hilot Wellness Massage NCII\n\n- 26 -\nUNIT OF COMPETENCY : MAINTAIN HIGH STANDARDS OF PATIENT/CLIENT SERVICES\nUNIT CODE\n:"
