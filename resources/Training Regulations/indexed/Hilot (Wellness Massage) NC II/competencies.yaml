          "source_text": "1. Schedule clients \n1.1 \nAppointments are scheduled according to length of time required \nfor service/s, availability of staff and rooms and workplace \npolicies and procedures. \n1.2     Appointments are confirmed with client and details recorded. \n2. Receive clients \n2.1 \nCommunication with clients is conducted according to \nworkplace policies and procedures. \n2.2 \nClient customer service needs and reasonable requests are met \nor referred to supervisor according to workplace policies. \n2.3 \nClient wellness form is sourced from file or new wellness form \nestablished. \n2.4 \nClient information is noted in record system according to \nworkplace policies and procedures and relevant laws. \n2.5     Client is directed to designated area for specific hilot wellness \nservice.\n3. Identify clients’ \nspecial customer \nservice \nneeds/requirements\n3.1 \nClients’ with special needs or requirements are identified \npromptly by observation and questioning. \n3.2 \nA willingness to assist is conveyed verbally and non-verbally. \n3.3      Client needs are promptly serviced, referred or redirected as \nrequired.\n4.   Deliver hilot \nwellness service to \nclient/s \n \n4.1 \nPossible problems are identified, anticipated and action is taken \nto minimize client dissatisfaction \n4.2 \nOpportunities to deliver additional levels of hilot wellness \nservices beyond the client’s immediate request are recognized \nand acted upon. \n4.3      Client is bidden farewell according to workplace policies and \nprocedures. \n4.4      Verbal and non-verbal communication is used to develop rapport \nand maintain contact with client during customer service delivery. \n4.5       Regular customer is encouraged by promotion of appropriate \nhilot wellness services and products according to workplace \npolicies and procedures. \n4.6      Sales, returns or refunds are processed according to workplace \npolicies and procedures.\n5.  Respond to client/s \ncomp