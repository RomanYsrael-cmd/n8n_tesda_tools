estioning and active listening\ntechniques to consult, reassure and negotiate with clients\nwhile maintaining discretion, tact and confidentiality\n1.8 Applied knowledge of a variety of hilot products\n1.9 Used time consistently, effectively and controlled product\nwaste\n1.10 Evaluated a hilot wellness program and advised the client\non future treatments, homecare and complementary\nproducts\n1.1 Read, interpreted accurately and applied consistently\nmanufacturer’s instruction for products and equipment\n2. Underpinning\nknowledge\n\n2.1 Provisions of relevant health and hygiene regulations/\nrequirements\n2.2 Provisions of relevant Occupational Health and Safety\nRegulations/Requirements\n2.3 Personal hygiene and the transmission of microbes and\ninfections\n2.4 Workplace policies and procedures in regard to the\nperformance of hilot wellness massage techniques\n2.5 The effects and benefits of a defined range of hilot products\nand paraphernalia\n2.6 Factors likely to affect the suitability of each hilot wellness\n massage technique to client needs and the effects and\n benefits.\n2.7 Anatomy, physiology and pathology of the skin and skin\n structures as it relates to hilot wellness techniques,\nincluding:\n - a simplified cross-section of skin\n- glands as they relate to basic skin function\n- skin chemicals, including sebum and sweat production,\nnormal and abnormal, collagen, elastin and lipids\n- phases of growth, cell renewal, healing of skin and factors\naffecting epidermal mitosis\n- normal process of skin and ageing and structural change\n- percutaneous absorption and factors affecting penetration\nof cosmetics\n\n--- PDF PAGE 53 ---\nTR Hilot Wellness Massage NCII\n\n- 49 -\n\n2.8 The following body systems as listed below, in regard to\ntheir interdependence and purpose:\n- skeletal and muscular system, including muscle\nmovements and motor points, position and action of\nsuperficial muscles of the face, throat and chest\n- nervous system and its relationship to skin sensations\n- lymphatic, digestive, respiratory and circulatory systems\nand their relationship to skin function, including\nthermoregulation and homeostasis\n- endocrine and reproductive systems in relationship to\nhormonal control of the skin\n- integumentary system\n2.9\nBasic nutrition and its relationship to body wellness\n2.10 Herbs, oils, minerals and other ingredients in relevant hilot\nproducts and their effects on the skin\n3. Underpinning skills\n3.1 Applying appropriate hilot wellness massage techniques\nand products based on client needs and condition\n3.2 Applying personal hygiene\n3.3 Applying area safety\n3.4 Taking appropriate action against adverse effects\n3.5 Answering questions of clients and providing information as\nneeded\n3.6\nApplying language, literacy and numeracy skills relevant to\nthe role and workplace requirements\n4. Method of\nassessment\nCompetency MUST be assessed through any two of the following:\n4.1 Demonstration with oral questioning\n4.2 Observation with oral questioning\n4.3 Interview\n4.4 Third Party Report\n5. Resource implication\nThe following resources MUST be provided:\n5.1 Relevant documentation, such as:\n - workplace policy and procedures manuals\n5.2 Access to a range of clients with different requirements\n5.3 A range of services, products and paraphernalia\nappropriate to the workplace\n5.1\nProduct labels and sources of product information\n5.2\nA qualified workplace assessor\n\n6. Context of\nassessment\n6.1\nAssessment should be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 54 ---\nTR Hilot Wellness Massage NCII\n\n- 50 -\nUNIT OF COMPETENCY :\nPROVIDE POST-ADVICE AND POST-SERVICES TO\nCLIENTS\nUNIT CODE\n\n : HCS311304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nadvise on post hilot wellness services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify products and\nservices\n1.1\nProducts used in hilot wellness massage are identified and\nexplained in accordance with workplace procedures\n1.2\nProducts and range of services are identified and their\nbenefits and comparative advantage.\n\n2. Explain product and\nservices knowledge\n2.1 Knowledge of products and services is explained,\nmaintained and conveyed to other staff members as\nrequired.\n2.2 Comparisons between products and services are applied.\n2.3\nKnowledge of competitors’ product and range of service and\npricing structure is explained.\n\n3. Recommend\nspecialized products\nand services\n3.1\nClients needs and condition are identified.\n3.2\nFeatures and benefits of products and services are\nexplained to encourage clients to avail them.\n\n4. Perform aftercare\nservice\n4.1\nClient is monitored according to workplace policies and\nprocedures.\n4.2\nAdverse effects are identified and responded to as\nrequired.\n4.3\nAftercare products are applied as required.\n4.4\nAftercare services are provided according to the hilot\nwellness program, workplace policies and procedures and\nclient needs.\n\n5. Administer service\n5.1\nOutcomes of the hilot wellness program are evaluated and\nnoted. Recommendations for further advice/service are\nmade.\n5.2\nClients are advised of suitable wellness products and\nappropriate lifestyle changes.\n5.3\nProduct use is explained and the application is demonstrated\nas required.\n5.4\nClient is advised of expected outcomes of future treatments.\n5.5 Client is rebooked according to agreed hilot wellness\nprogram.\n\n--- PDF PAGE 55 ---\nTR Hilot Wellness Massage NCII\n\n- 51 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Products\nMay include but are not limited to:\n1.1\nPre-blended aromatic plant oils\n1.2\nExfoliants\n1.3\nHerbal teas and beverages\n1.4\nMud/clays\n1.5\nHerbal baths and poultices\n1.6\nMinerals (alum, incense, etc.)\n\n2. Services\nMay include but are not limited to:\n2.1\nHerbal baths and scrubs\n2.2\nBody Services\n2.3\nWellness and relaxation techniques\n2.4\nExercise programs\n2.5\nDiet and nutrition programs\n2.6\nDetoxification programs\n\n3. Comparisons\nMay include but are not limited to:\n3.1\nProducts and service options\n3.2\nTypes, Procedures, Techniques\n3.3\nBrand Options\n3.4\nBenefits and effects of products and services\n3.5\nTargeted results and outcomes\n3.6\nPrice\n3.7\nIngredients and formulations\n\n4. Clients\nMay include but are not limited to:\n4.1\nNew or regular clients with routine or special needs\n4.2\nClients who experienced adverse effects\n\n5. Adverse effects\nMay include but are not limited to:\n5.1 Allergic reaction to products\n5.2 Skin reactions due to hilot wellness massage techniques\n5.3\nReactions to changes\n\n6. Aftercare products\nMay include but is not limited to:\n6.1 Herbal products\n6.2\nBody oils\n\n--- PDF PAGE 56 ---\nTR Hilot Wellness Massage NCII\n\n- 52 -\nVARIABLE\nRANGE\n7. Aftercare services\nMust include but are not limited to:\n7.1 Rest period after service\n7.2\nImmediate bathing should be avoided (at least 6 hrs. after\nthe service)\n7.3 Offering warm tea\n\n8. Outcomes\nMay include but are not limited to:\n8.1 Effects of service rendered\n8.2 Client’s condition\n\n9. Further\nadvice/service\nMay include but are not limited to:\n9.1 Maintenance products/services\n9.2 Other complementary products/services\n\n10. Lifestyle change\nMay include but are not limited to:\n10.1 Proper diet and good nutrition\n10.2 Reduction of alcohol/tobacco consumption\n10.3 Optimum exercise\n\n--- PDF PAGE 57 ---\nTR Hilot Wellness Massage NCII\n\n- 53 -\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Applied consistently knowledge of workplace policies and\nprocedures and safe work practices in relation to advising\non wellness program\n1.2 Applied consistently knowledge of relevant national and\nlocal health and hygiene regulations\n1.3 Recognized and managed contra-indications\n1.4 Read, accurately interpreted and consistently applied and\nadvised on manufacturer’s instructions for products\n1.5 Used effective questioning and active listening techniques\nto consult, reassure and negotiate with clients while\nmaintaining discretion, tact and confidentiality\n1.6 Applied product knowledge including comparisons between\nproducts and offered advice to clients\n1.7 Identified client requirements/needs\n1.8 Recommended products and services to clients, including\nthe incorporation of detailed specialized product knowledge\nand demonstrated products and services to provide advice\nto guests.\n1.9\nUsed time effectively\n2. Underpinning\nknowledge\n2.1 The provisions of relevant Occupational health and Safety\nregulations/requirements\n2.2 Workplace policies and procedures in regard to the\nperformance of services and selling products\n2.3 Factors likely to affect the suitability of each workplace\ntreatment to clients’ needs and the effects and benefits of\nvarious treatments\n2.4\nThe causes of skin reactions/allergies in regard to\ntreatments\n3. Underpinning skills\n3.1\nIdentifying client requirements/needs\n3.2\nSkills needed in promoting products and services, including:\n- listening and questioning techniques\n- verbal and non-verbal communication skills\n- dealing with client in a culturally appropriate manner\n- negotiation techniques\n- conflict resolution skills\n - problem solving techniques\n3.3 Gathering and organizing information to develop and\nmaintain product and service knowledge\n3.3\nLanguage, literacy and numeracy skills relevant to the role\nand workplace requirements\n\n--- PDF PAGE 58 ---\nTR Hilot Wellness Massage NCII\n\n- 54 -\n\n4. Method of\nassessment\nCompetency MUST be assessed through any two of the following:\n4.1 Demonstration with oral questioning\n4.2 Observation with oral questioning\n4.3 Interview\n4.4\nThird Party Report\n5. Resource implication\nThe following resources MUST be provided:\n5.1 Relevant documentation, such as:\n - workplace policy and procedures manuals\n5.2 Access to a range of clients with different requirements\n5.3 A range of services and products appropriate to workplace\n5.4\n A qualified workplace assessor\n6. Context of\nassessment\n6.1\nAssessment should be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 59 ---\nTR Hilot Wellness Massage NCII\n\n- 55 -"
