        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFollowed workplace policies and procedures and safe work\npractices in regard to the provision of service to clients\n1.2 Followed relevant laws\n1.3 Scheduled clients and made appointments\n1.4\nProvided a consistently welcoming client environment by\ntreating clients in a courteous, professional manner using\nculturally appropriate greetings and farewells\n1.5\nInterpreted accurately the nature of client complaints and\ntook appropriate action to resolve complaints\n1.6\nFollowed workplace policies and procedures in regard to\npersonal dress and presentation\n1.7\nUsed consistently effective questioning and active listening\ntechniques to consult, reassure and negotiate with clients\nwhile maintaining discretion, tact and confidentiality\n1.8 Used time effectively\n2 Underpinning\nknowledge\n2.1\nThe provision of relevant legislation including consumer\nlaw, privacy law, Occupational Health and Safety\nrequirements and Industry Codes of Practice\n2.2\nWorkplace policies and procedures in regard to personal\npresentation, record keeping, sales, returns and refunds,\nreceiving and scheduling clients and making appointments\n2.3 Workplace features, including:\n 2.3.1 workplace product and service range\n2.3.2 location of workplace areas/sections\n2.3.3 function and use of workplace telephone system\n2.3.4 message taken in person or by telephone\n2.3.5 client record system\n2.3.6 written record of complaints\n3 Underpinning skills\n3.1\nCustomer service required for selling products and\nservices, receiving and scheduling clients and making\nappointments and resolving complaints including:\n3.1.1 listening and questioning techniques\n3.1.2 verbal and non-verbal communication skills\n3.1.3 negotiation techniques\n3.1.4 conflict resolution skills\n3.1.5 techniques for dealing with difficult or abusive clients\n3.1.6 greeting and bidding farewell techniques\n3.1.7 knowledge of clients’ special needs\n3.1.8 dealing with clients in a culturally appropriate manner\n3.1.9 telephone techniques\n3.1.10 Language, literacy and numeracy relevant to the role\nand workplace requirements\n\n--- PDF PAGE 43 ---\nTR Hilot Wellness Massage NCII\n\n- 39 -\n\n4. Method of\nassessment\nCompetency MUST be assessed through any two of the following:\n4.1 Demonstration with questioning\n4.2 Oral questioning/Interview\n4.3 Third Party Report\n4.4 Written Report\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1 Relevant documentation, such as: workplace policy and\nprocedures manuals\n5.2 Access to a range of clients with different requirements\n5.3 A range of furnishings and paraphernalia\n5.4 Product labels and sources of product information\n5.5 A qualified workplace assessor\n6. Context of\nassessment\n6.1 Assessment should be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 44 ---\nTR Hilot Wellness Massage NCII\n\n- 40 -\nUNIT OF COMPETENCY :\nAPPLY HILOT WELLNESS MASSAGE TECHNIQUES\nUNIT CODE\n\n :"
        },
        "source_text": "HCS222302\n\nUNIT DESCRIPTOR\n:\nThis unit describes the knowledge, skills and attitudes required to\ndeliver preparatory services to hilot wellness clients, including\nreceiving clients, making appointments and responding to client\ncomplaints.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Schedule clients\n1.1\nAppointments are scheduled according to length of time required\nfor service/s, availability of staff and rooms and workplace\npolicies and procedures.\n1.2 Appointments are confirmed with client and details recorded.\n2. Receive clients\n2.1\nCommunication with clients is conducted according to\nworkplace policies and procedures.\n2.2\nClient customer service needs and reasonable requests are met\nor referred to supervisor according to workplace policies.\n2.3\nClient wellness form is sourced from file or new wellness form\nestablished.\n2.4\nClient information is noted in record system according to\nworkplace policies and procedures and relevant laws.\n2.5 Client is directed to designated area for specific hilot wellness\nservice.\n3. Identify clients’\nspecial customer\nservice\nneeds/requirements\n3.1\nClients’ with special needs or requirements are identified\npromptly by observation and questioning.\n3.2\nA willingness to assist is conveyed verbally and non-verbally.\n3.3 Client needs are promptly serviced, referred or redirected as\nrequired.\n4. Deliver hilot\nwellness service to\nclient/s\n\n4.1\nPossible problems are identified, anticipated and action is taken\nto minimize client dissatisfaction\n4.2\nOpportunities to deliver additional levels of hilot wellness\nservices beyond the client’s immediate request are recognized\nand acted upon.\n4.3 Client is bidden farewell according to workplace policies and\nprocedures.\n4.4 Verbal and non-verbal communication is used to develop rapport\nand maintain contact with client during customer service delivery.\n4.5 Regular customer is encouraged by promotion of appropriate\nhilot wellness services and products according to workplace\npolicies and procedures.\n4.6 Sales, returns or refunds are processed according to workplace\npolicies and procedures.\n5. Respond to client/s\ncomplaint/s\n5.1 Nature of complaint is established by active listening and\nquestioning and confirmed with the client.\n5.2 Complaint resolution procedures are implemented.\n5.3 Unresolved complaints are promptly referred to supervisor.\n5.4 Opportunities are taken to turn incidents of guest dissatisfaction\ninto a demonstration of high quality customer service in line with\nworkplace policies and procedures.\n5.5 Documentation regarding client dissatisfaction or complaints is\ncompleted.\n5.5 Follow-up action is taken as necessary to ensure client satisfaction.\n\n--- PDF PAGE 40 ---\nTR Hilot Wellness Massage NCII\n\n- 36 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Communication\n\nMay include but is not limited to:\n1.1 Personal\n1.2 Telephone\n1.3 Verbal and Non-Verbal\n2. Clients\nMay include but is not limited to:\n2.1 New or regular guest/s with routine or special needs\n3. Workplace policies\nand procedures\n\nMay include but are not limited to:\n3.1 Customer service techniques\n3.2 Personal presentation\n3.3 Record keeping\n3.4 Communication\n3.5 Scheduling clients\n3.6 Sales, returns and refunds\n3.7 Complaint resolution\n4. Client information\nMay include but is not limited to:\n4.1 Type of treatment/s\n4.2 Special needs or requirements of client\n4.3 Products\n4.4 Duration of hilot wellness service\n4.5 Date and time of wellness service\n4.6 Charges and method of payment\n4.7 Name of staff providing hilot wellness service\n5. Record system\nMay include but is not limited to:\n5.1 Electronic\n5.2 Manual\n6. Relevant laws\nMay include but is not limited to:\n6.1 Consumer Law\n6.2 Privacy Law\n6.3 Occupational Health and Safety regulations\n6.4 Anti-Discrimination Legislation\n6.5 Industry Codes of Practice\n7 Special needs\nMay include but are not limited to:\n7.1 Contra-indications to products or services\n7.2 Mobility or other disability assistance\n7.3 Language needs and cultural understandings\n7.4 Payment arrangements\n\n--- PDF PAGE 41 ---\nTR Hilot Wellness Massage NCII\n\n- 37 -\n\nVARIABLE\nRANGE\n8 Problems\nMay include but are not limited to:\n8.1 Delays\n8.2 Unavailability of products\n9 Additional levels of\nhilot wellness service\nMay include but are not limited to:\n9.1 Extending the hilot wellness service period\n9.2 Offering complementary hilot wellness products\n9.3 Offering home products\n10 Promotion of\nappropriate wellness\nservices and\nproducts\nMay include but is not limited to:\n10.1 Complimentary wellness services/products\n10.2 Discounted wellness services/products\n10.3 Special packages of wellness services/products\n11 Nature of complaint\n\nMay include but is not limited to:\n11.1 Price\n11.2 Quality of Service\n11.3 Timeliness of Service\n11.4 Range of Services\n12 Complaint resolution\nprocedures\n\nMay include but are not limited to:\n12.1 Referral to manager\n12.2 Provide a fuller explanation of service/product\n12.3 Refund of charges\n12.4 Replacement of product\n13 Documentation\nMay include but is not limited to:\n13.1 Paper based\n13.2 Electronic\n\n--- PDF PAGE 42 ---\nTR Hilot Wellness Massage NCII\n\n- 38 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nFollowed workplace policies and procedures and safe work\npractices in regard to the provision of service to clients\n1.2 Followed relevant laws\n1.3 Scheduled clients and made appointments\n1.4\nProvided a consistently welcoming client environment by\ntreating clients in a courteous, professional manner using\nculturally appropriate greetings and farewells\n1.5\nInterpreted accurately the nature of client complaints and\ntook appropriate action to resolve complaints\n1.6\nFollowed workplace policies and procedures in regard to\npersonal dress and presentation\n1.7\nUsed consistently effective questioning and active listening\ntechniques to consult, reassure and negotiate with clients\nwhile maintaining discretion, tact and confidentiality\n1.8 Used time effectively\n2 Underpinning\nknowledge\n2.1\nThe provision of relevant legislation including consumer\nlaw, privacy law, Occupational Health and Safety\nrequirements and Industry Codes of Practice\n2.2\nWorkplace policies and procedures in regard to personal\npresentation, record keeping, sales, returns and refunds,\nreceiving and scheduling clients and making appointments\n2.3 Workplace features, including:\n 2.3.1 workplace product and service range\n2.3.2 location of workplace areas/sections\n2.3.3 function and use of workplace telephone system\n2.3.4 message taken in person or by telephone\n2.3.5 client record system\n2.3.6 written record of complaints\n3 Underpinning skills\n3.1\nCustomer service required for selling products and\nservices, receiving and scheduling clients and making\nappointments and resolving complaints including:\n3.1.1 listening and questioning techniques\n3.1.2 verbal and non-verbal communication skills\n3.1.3 negotiation techniques\n3.1.4 conflict resolution skills\n3.1.5 techniques for dealing with difficult or abusive clients\n3.1.6 greeting and bidding farewell techniques\n3.1.7 knowledge of clients’ special needs\n3.1.8 dealing with clients in a culturally appropriate manner\n3.1.9 telephone techniques\n3.1.10 Language, literacy and numeracy relevant to the role\nand workplace requirements\n\n--- PDF PAGE 43 ---\nTR Hilot Wellness Massage NCII\n\n- 39 -\n\n4. Method of\nassessment\nCompetency MUST be assessed through any two of the following:\n4.1 Demonstration with questioning\n4.2 Oral questioning/Interview\n4.3 Third Party Report\n4.4 Written Report\n5. Resource\nimplications\nThe following resources MUST be provided:\n5.1 Relevant documentation, such as: workplace policy and\nprocedures manuals\n5.2 Access to a range of clients with different requirements\n5.3 A range of furnishings and paraphernalia\n5.4 Product labels and sources of product information\n5.5 A qualified workplace assessor\n6. Context of\nassessment\n6.1 Assessment should be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 44 ---\nTR Hilot Wellness Massage NCII\n\n- 40 -\nUNIT OF COMPETENCY :\nAPPLY HILOT WELLNESS MASSAGE TECHNIQUES\nUNIT CODE\n\n :"
