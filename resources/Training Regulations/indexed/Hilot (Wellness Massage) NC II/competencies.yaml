  "source_section_text": "Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.3.2 Experienced Workers (wage employed or self – employed)\n\n4.4\nReassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.5 A candidate who fails the assessment for two (2) consecutive times will be\nrequired to go through a refresher course before taking another assessment.\n\n4.6 Only certified individuals in this Qualification may be nominated by the industry\nsector for accreditation as competency assessor.\n\n4.7 Only accredited competency assessors are allowed to conduct competency\nassessment, however, trainees who are accredited competency assessors are not\nallowed to assess their trainees.\n\n4.8 Assessment of competence must be undertaken only in the TESDA accredited\nassessment center. The performance assessment (demonstration of competence),\nhowever, may be done in any venue or workplace duly designated by an\naccredited assessment center.\n\n4.9 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 66 ---\nTR Hilot Wellness Massage NCII\n\n- 62 -\n\nCOMPETENCY MAP – HEALTH CARE SECTOR (HILOT (WELLNESS MASSAGE) NC II)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in workplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop teams and\nindividuals\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high\nstandard of patient\nservices\nMaintain an effective\nrelationship with\nclients/customers\nManage own\nperformance\n\nEstablish professionalism\nin the security service\nProcess reusable\ninstruments and\nequipment in health work\nPrepare for and assist\nwith oral health care\nprocedures\nAssist with\nadministration in\ndental practice\nFollow occupational\nhealth and safety\npolicies in dental\npractice\nMaintain infection\ncontrol in dental\npractice\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end\nusers location\nAssist in patient\nmobility\n\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\n\nPerform basic life support\n\nMaintain life support\nequipment and resources\nImplement safe access\nand extrication\nprocedures in an\nemergency\nManage request for\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic\nambulance\ncommunication skills\n\nSupervise on-road\noperations\nManage the scene of a\nspecial event\nManage routine scene\nDeliver pre-hospital\npatient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\nDrive vehicles under\noperational conditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a\ncommunity\ndevelopment\nframework\n\n--- PDF PAGE 67 ---\nTR Hilot Wellness Massage NCII\n\n- 63 -\nPrepare for work in the\ncommunity service industry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education\nprogram in the\ncommunity\nFabricate models\nFabricate custom\nimpression trays\nFabricate registration bite\nrims\nArticulate models and\ntransfer records\nFabricate mouthgard\nArrange artificial teeth\nfor complete dentures\nSet-up and wax\nremovable partial\ndentures\nWax, process and finish\nacrylic dentures and\nappliances\nCast metal alloy\nremovable partial denture\nwork\nFabricate oral splints\nFabricate orthodontic\nappliances\nFabricate thermo\nformed bases and\nappliances\nFabricate metal crown\nand bridge structures\nFabricate ceramic\nrestorations\nFabricate indirect\ncomposite/polymer fixed\nrestorations\nJoin alloy structures\nPlan the hilot wellness\nprogram of client\nProvide pre- service of\nclient\nApply hilot wellness\nmassage techniques\nProvide post-dvice on\npost-services to hilot\nclients\n\n--- PDF PAGE 68 ---\nTR Hilot Wellness Massage NCII\n\n- 64 -\nFor the purpose of this standard, the word\n\nAlternative Medicine\nNon-Western healing therapies. Also called complementary\nor integrative medicine.\n\nAnatomy\nthe science of the shape and structure of organisms and their\nparts.\n\nBanana Leaf Method\nthe banana leaf is utilized in hilot to assist in determining\nwhere the energy block is. The leaf of the banana, the saba\nvariety is preferred over other species of bananas. The leaf is\ncut into lengths of one foot to one and a half feet and width of\ntwo to three inches. The banana leaf strips are then laced\nwith coconut oil, warmed over candle fire and run through the\ndifferent body areas. If the banana leaf strip stops at a\nparticular body area or if the hilot practitioner senses a tug of\nthe banana leaf against the skin of the patient, such body\narea is considered to have energy block. Massage in then\nfocused on these areas where the banana lead strip stops or\ntugs.\n\nBeauty Treatment\ncosmetic applications and services that enhance one’s\nappearance; e.g. facials, hair treatments, manicures,\npedicures, waxing and makeup.\n\nBentosa\ncupping of heated glasses applied on the body surface mainly\nfor cold and wind diseases.\n\nBody Scrub\na therapy for exfoliating the skin using applications applied\nwith a brush or loofah sponge.\n\nBody Treatment\nany therapy applied to the body, including massages, wraps,\nscrubs, masks and baths.\n\nBody Wrap\ncocooning the body in warm sheets that usually have been\nsteeped in an herbal mixture; or wrapping the body in plastic,\nMylar, or woolen blankets after a body treatment such as a\nmud bath or mask.\n\nChiropractic\na physical therapy that realigns the spine to correct nerve\nmalfunctions; uses manual manipulations to help the body\nregain optimal function.\n\nDasal, Bulong, Oracion\nprayers and chants asking for spiritual blessings and\nguidance.\n\nEssential Oils\ndistilled and purified extracts of flowers, plants, grasses, fruit,\nleaves, bark, herbs and seeds; said to have healing,\noxygenating, purifying and relaxing properties.\n\nExfoliation\nremoval of dead cells from the skin’s surface, using a variety\nof lotions, muds, oils and scrubs with a variety of tools (e.g.\nloofah sponges and brushes).\n\n--- PDF PAGE 69 ---\nTR Hilot Wellness Massage NCII\n\n- 65 -\n\nFacial\ndeep cleansing and/or massage for the face, neck and upper\nchest using various muds, oils, lotions and/or masks to\nremove dead skin and impurities, close pores, and enhance\ncirculation; can be manual and/or involve equipment to\nsteam, tone and tighten the skin.\n\nHerbal Bath\na hydrotherapy treatment with the addition of herbal\npreparations for relaxation and healing.\n\nHerbal Wrap\na body treatment that uses linen sheets steeped in an herbal\npreparation. The sheets are wrapped around the client like a\ncocoon for detoxification, relaxation and increased circulation.\n\nHilot\nThe art and science of the ancient Filipino Healing.\n\nHilot (Wellness)\ncan use/apply massage, herbal treatments, oil and essences,\nmineral treatments and water treatment.\n\nPaligo\nbathing practices using decoctions of aromatic herbs\nperformed after an illness, a childbirth or an exhausting work.\n\nPalpation\na method used in locating energy blockages in the body. This\nis done by palpating the parts of the body where the patient\nfeels pain, discomfort, numbness or tingling sensations. Then\nthe other body areas to determine other areas of energy\nblockages.\n\nPulse Diagnosis\nthe use of fingers to palpate the pulses that determine the\nblockage in the body in relation to the signs and symptoms\nmanifestations based on the philosophical concepts of hilot.\n\nRaw Egg Method\na whole raw egg is run throughout the different body areas.\nAfter which the egg is broken over a plate and the hilot is able\nto diagnose the location of the energy blockage or where the\nexcess wind or cold permeates by the shape and character of\nthe egg white and the yolk. There have been no investigative\nstudies to find out the science behind the raw egg as a\ndiagnostic tool for hot-cold imbalances.\n\nReflexology\nbased on an ancient Oriental system, a pressure point\nmassage applied to specific places on the feet that\ncorrespond, or “reflex”, to all parts of the body. Usually\nperformed on the feet, but also on ears and hands; also\ncalled zone therapy.\n\nSauna\nbased on a Finnish tradition tank; a dry treatment in a very\nhot, wooden chamber, which cleanses and detoxifies through\nthe body’s perspiration. Traditional saunas include birch twigs\nused to beat the body to further stimulate circulation and are\nfollowed by a dip into a cold pool or stream to cool down.\n\n--- PDF PAGE 70 ---\nTR Hilot Wellness Massage NCII\n\n- 66 -\n\nScalp Treatment\na massage therapy and application of oils, lotions and tonics\nto the scalp, used for relaxation and hair stimulation and\nconditioning.\n\nSpa\na facility dedicated to relaxation, beauty, pampering and\nwellness. Or, a hot tub.\n\nSuob\nusing medicinal herbs and/or mineral medicine, steam or\nsmoke induced heat expelled through perspiration.\n\nUse of Cellophane and Empty Bottles - cellophane sheets, two inches by four inches in size\nand empty round bottles, six inches tall and four\ninches diameter, to detect energy blockages in the\nbody. In the same manner as the banana leaf strips,\nthe cellophane sheets or empty bottles are run\nthrough body areas like the back, upper and lower\narm, chest and abdomen, upper and lower legs.\nWhere ever the cellophane sheet gets stuck in a\nbody area or where the empty bottle stops are the\nareas that have energy blockages or excess wind.\n\nWellness\na healthy balance of the mind of mind, body and\nspirit that results in an overall feeling of well-being.\n\n--- PDF PAGE 71 ---\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and\nappreciation to the many representatives of business, industry, academe and government agencies,\nnon-government organizations including professional associations who rendered their time and expertise\nto the development and validation of these Training Regulations.\n\nMS. MARJORIE P. LOPINGCO\nMR. JASON T. LAO\nPresident\nDirector\nSpa Association of the Philippines, Inc.\nBureau of Export Trade Promotion\nC/o Office of Product Research and Development\nDepartment of Trade and Industry\nRm. 412 Department of Tourism\n2nd Flr. DTI International Building\nT.M. Kalaw, Manila\n#375 Sen. Gil Puyat Avenue\n\nMakati City\nDR. JAIME GALVEZ-TAN\nChairman of the Board\nMS. TESS LORING\nCreative Concoctions Inc.\nBureau of Export Trade Promotion\n11/F Agustin 1 Bldg., F. Ortigas Jr.\nDepartment of Trade and Industry\n(formerly Emerald Ave.)\n2nd Flr. DTI International Building\nOrtigas Center, Pasig City\n#375 Sen. Gil Puyat Avenue\n\nMakati City\nMS. MA. REBECCA M. GALVEZ-TAN\n\nDirector\nHealth Futures Foundation, Inc.\nMS. CHERYL M. PELO\n1086 Del Monte Avenue\nInternational Services Division\nQuezon City\nBureau of Export Trade Promotion\n\nDepartment of Trade and Industry\nMR. BIBIANO S. FAJARDO\n2nd Flr. DTI International Building\nPresident\n#375 Sen. Gil Puyat Avenue\nAssociation of Traditional Health Aid Givers, Inc.\nMakati City\n2nd Flr. Jacinto Building 2\nEDSA Guadalupe Nuevo\nDR. FRANCIS VICENTE S. RAS\nMakati City\nChief, Education & Training Division\n\nPhilippine Institute of Traditional and Alternative\nMR. MAR GUTIERREZ\nHealth Care\nAssociation of Traditional Health Aid Givers, Inc.\nUnit 2402, Atlanta Centre No.31 Annapolis St.\n2nd Flr. Jacinto Building 2\nGreenhills San Juan, Metro Manila\nEDSA Gu