          "source_text": "1.  Identify products and \nservices \n1.1 \nProducts used in hilot wellness massage are identified and \nexplained  in accordance with workplace procedures \n1.2 \nProducts and range of services are identified and their \nbenefits and comparative advantage. \n \n2.  Explain product and \nservices knowledge \n2.1      Knowledge of products and services is explained, \nmaintained and conveyed to other staff members as \nrequired. \n2.2      Comparisons between products and services are applied. \n2.3 \nKnowledge of competitors’ product and range of service and \npricing structure is explained. \n \n3.  Recommend \nspecialized products \nand services \n3.1 \nClients needs and condition are identified. \n3.2 \nFeatures and benefits of products and services are \nexplained to encourage clients to avail them. \n \n4.  Perform aftercare \nservice \n4.1 \nClient is monitored according to workplace policies and \nprocedures. \n4.2 \nAdverse effects are identified and responded to as \nrequired. \n4.3 \nAftercare products are applied as required. \n4.4 \nAftercare services are provided according to the hilot \nwellness program, workplace policies and procedures and \nclient needs. \n \n5.  Administer service \n5.1 \nOutcomes of the hilot wellness program are evaluated and \nnoted. Recommendations for further advice/service are \nmade. \n5.2 \nClients are advised of suitable wellness products and \nappropriate lifestyle changes. \n5.3 \nProduct use is explained and the application is demonstrated \nas required. \n5.4 \nClient is advised of expected outcomes of future treatments. \n5.5     Client is rebooked according to agreed hilot wellness \nprogram.\n\n--- PDF PAGE 55 ---\nTR Hilot  Wellness Massage NCII \n \n- 51 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n 1.  Products \nMay include but are not limited to: \n1.1 \nPre-blended aromatic plant oils \n1.2 \nExfoliants \n1.3 \nHerbal teas and beverages \n1.4 \nMud/clays \n1.5 \nHerbal baths and poultices \n1.6 \nMinerals (alum, incense, etc.)  \n \n2.  Services \nMay include but are not limited to: \n2.1 \nHerbal baths and scrubs \n2.2 \nBody Services \n2.3 \nWellness and relaxation techniques \n2.4 \nExercise programs \n2.5 \nDiet and nutrition programs \n2.6 \nDetoxification programs \n \n3.  Comparisons \nMay include but are not limited to: \n3.1 \nProducts and service options \n3.2 \nTypes, Procedures, Techniques \n3.3 \nBrand Options \n3.4 \nBenefits and effects of products and services \n3.5 \nTargeted results and outcomes \n3.6 \nPrice \n3.7 \nIngredients and formulations \n \n4.  Clients \nMay include but are not limited to: \n4.1 \nNew or regular clients with routine or special needs \n4.2 \nClients who experienced adverse effects \n \n5.  Adverse effects \nMay include but are not limited to: \n5.1       Allergic reaction to products \n5.2       Skin reactions due to hilot wellness massage techniques \n5.3 \nReactions to changes \n \n6.  Aftercare products \nMay include but is not limited to: \n6.1       Herbal products \n6.2 \nBody oils\n\n--- PDF PAGE 56 ---\nTR Hilot  Wellness Massage NCII \n \n- 52 - \nVARIABLE \nRANGE \n7.  Aftercare services \nMust include but are not limited to: \n7.1      Rest period after service \n7.2 \nImmediate bathing should be avoided (at least 6 hrs. after \nthe service) \n7.3      Offering warm tea \n \n8.  Outcomes \nMay include but are not limited to: \n8.1      Effects of service rendered \n8.2      Client’s condition \n \n9.  Further \nadvice/service \nMay include but are not limited to: \n9.1       Maintenance products/services \n9.2       Other complementary products/services \n \n10.  Lifestyle change \nMay include but are not limited to: \n10.1 Proper diet and good nutrition \n10.2 Reduction of alcohol/tobacco consumption \n10.3 Optimum exercise\n\n--- PDF PAGE 57 ---\nTR Hilot  Wellness Massage NCII \n \n- 53 -"
