 rhythm  \n& 1-2-3-4-5-6-7 rhythm \n1-3 lbs \none second per toe \ntaas na likod \nX \n  \n  \n  \n  \n  \nMabagal \nMasakit ngunit \nkayang tiisin\n3min \n  \n  \n  \n  \n  \n  \n  \n  \n  \n  \nventral side of arm \nX \nX \nX \n  \nX \n7x \n1-2-3-4-5-6-7 rhythm  \nand 1-2-3 rhythm \n1 to 3 lbs \n3 min \nbisig nakatihaya \n(labas, loob, gitna) \nX \n  \n  \n  \n  \n  \nMabagal \nMasakit ngunit \nkayang tiisin\n4min \nbraso nakatihaya \n(labas, loob, gitna) \nX \n  \n  \n  \n  \n  \nMabagal \nMasakit ngunit \nkayang tiisin\n4min \n  \n  \n  \n  \n  \n  \n  \n  \n  \n  \nweb between thumb & forefinger \n  \n  \nX \n  \n  \n3x \n1-2-3 rhythm \n1 to 3 lbs \n3 sec \nibabaw ng kamay \n  \nX \n  \n  \n  \n  \nMabagal \nMasakit ngunit \nkayang tiisin\n3min \ndaliri ng kamay\nX\nMabagal \nMasakit ngunit \nkayang tiisin\n3min\n\n--- PDF PAGE 52 ---\nTR Hilot  Wellness Massage NCII \n \n- 48 -"
