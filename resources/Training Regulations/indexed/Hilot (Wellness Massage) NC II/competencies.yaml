e needs and cultural understandings \n7.4 Payment arrangements\n\n--- PDF PAGE 41 ---\nTR Hilot  Wellness Massage NCII \n \n- 37 - \n \nVARIABLE \nRANGE \n8 Problems \nMay include but are not limited to: \n8.1 Delays \n8.2 Unavailability of products \n9 Additional levels of \nhilot wellness service\nMay include but are not limited to: \n9.1 Extending the hilot wellness service period \n9.2 Offering complementary hilot wellness products \n9.3 Offering home products \n10 Promotion of \nappropriate wellness \nservices and \nproducts \nMay include but is not limited to: \n10.1 Complimentary wellness services/products \n10.2 Discounted wellness services/products \n10.3 Special packages of wellness services/products \n11 Nature of complaint \n \nMay include but is not limited to: \n11.1 Price \n11.2 Quality of Service \n11.3 Timeliness of Service \n11.4 Range of Services \n12 Complaint resolution \nprocedures \n \nMay include but are not limited to: \n12.1 Referral to manager \n12.2 Provide a fuller explanation of service/product \n12.3 Refund of charges \n12.4 Replacement of product \n13 Documentation \nMay include but is not limited to: \n13.1 Paper based \n13.2 Electronic\n\n--- PDF PAGE 42 ---\nTR Hilot  Wellness Massage NCII \n \n- 38 -"
