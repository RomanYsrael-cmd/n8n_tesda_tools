on to develop and \nmaintain product and service knowledge \n3.3 \nLanguage, literacy and numeracy skills relevant to the role \nand workplace requirements\n\n--- PDF PAGE 58 ---\nTR Hilot  Wellness Massage NCII \n \n- 54 - \n \n4.  Method of \nassessment \nCompetency MUST be assessed through any two of the following: \n4.1      Demonstration with oral questioning \n4.2      Observation with oral questioning \n4.3      Interview \n4.4 \nThird Party Report \n5.  Resource implication \nThe following resources MUST be provided: \n5.1      Relevant documentation, such as: \n           -  workplace policy and procedures manuals \n5.2      Access to a range of clients with different requirements \n5.3      A range of services and products appropriate to workplace \n5.4 \n A qualified workplace assessor  \n6.  Context of \nassessment \n6.1 \nAssessment should be conducted in the workplace or in a \nsimulated environment",
