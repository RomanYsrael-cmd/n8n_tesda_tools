      "term": "Banana Leaf Method",
      "definition": "the banana leaf is utilized in hilot to assist in determining where the energy block is. The leaf of the banana, the saba variety is preferred over other species of bananas. The leaf is cut into lengths of one foot to one and a half feet and width of two to three inches. The banana leaf strips are then laced with coconut oil, warmed over candle fire and run through the different body areas. If the banana leaf strip stops at a particular body area or if the hilot practitioner senses a tug of the banana leaf against the skin of the patient, such body area is considered to have energy block. Massage in then focused on these areas where the banana lead strip stops or tugs."
