      "source_text": "FOR PROCESSED FOOD AND BEVERAGES\nSECTOR\nTrainers who will deliver the training on FOOD PROCESSING NC II should have\nthe following:\n\n• Must be a holder of National TVET Trainer Certificate I (TM I and Food\nProcessing NC II)\n• College level of relevant course or 1-year job/industry experience\n• Good communication skills\n• Good moral character\n\n3.7 ASSESSMENT\nInstitutional Assessment is undertaken by trainees in a structured learning\nprogram to determine their achievement of units of competencies. It is\nadministered by the trainer/assessor at end of each learning module.\n\nThe result of the institutional assessment may be considered as evidence for the\nassessment for national certification.\n\nAs a matter of policy, graduates of programs registered with TESDA under these\ntraining regulations are required to undergo mandatory national competency\nassessment upon completion of the program.\n\n--- PDF PAGE 190 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 184",
