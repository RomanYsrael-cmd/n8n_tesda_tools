      "source_text": "3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core\nunits\nof\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology, communication/language and other academic subjects\nshall be contextualized. To this end, TVET providers shall develop a Contextual\nLearning Matrix (CLM) to green technology, issues on health and drugs and\ncater person with disabilities (PWD’s)\n\nCourse Title: FOOD PROCESSING NC Level: NC II\n\nNominal Training Duration:\n\n18 hrs\nBasic Competencies\n\n14 hrs\nCommon Competencies\n\n520 hrs\nCore Competencies\nTotal 552 Hrs\n\nCourse Description:\n\nThis course is designed to provide the students/learner with knowledge,\ndesirable attitudes and skills required to perform the following competencies in\naccordance with industry standards: Process Food by Salting, Curing and Smoking,\nProcess Food by Fermentation and Pickling, Process Food by Sugar Concentration,\nProcess Food by Drying and Dehydration and; Process Food by Thermal Application.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 122 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 117\n\nBASIC COMPETENCIES\n18 hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n\n• Effective communication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and systems\n• Technology relevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n• Sources of information\n• Types of question\n• Medium of communication\n• Flow of communication\n• Storage system\n• Telephone courtesy\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in workplace\nmeetings and\ndiscussions\n• Complete work related\ndocuments\n• Ability to relate to people\nof social range in the\nworkplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Group\ndiscussion\n• Role Play\n• Demonstration\n• Oral Interview\n• Written test\n• Demonstration\n4 hours\n\n1.2 Complete\nrelevant work\nrelated\ndocuments\n\n• Communication\nprocedures and systems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of communication\n• Workplace interactions\n• Non-verbal communication\n• Follow simple spoken\nlanguage\n• Perform routine\nworkplace duties\nfollowing simple written\nnotices\n• Participate in workplace\nmeetings and\ndiscussions\n\n• Complete work related\ndocuments\n• Role Play\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n\n--- PDF PAGE 123 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 118\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Estimate, calculate and\nrecord routine workplace\nmeasures\n• Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n• Ability to relate to people\nof social range in the\nworkplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n\n1.3\nParticipate in\nworkplace\nmeeting and\ndiscussion\n• Technology relevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace report\n• Follow simple spoken\nlanguage\n• Ability to relate to people\nof social range in the\nworkplace\n• Gather and provide\ninformation in response\nto workplace\nrequirements\n• Interaction\n• Demonstration\n• Observation\n• Oral Interview\n• Written test\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand\nresponsibility in a\nteam.\n• Definition of Team\n• Difference between team\nand group\n• Different sources of\ninformation\n• Objectives and goals of\nteam\n• Describing the team role\nand scope\n• Discussion\n\n• Demonstration\n• Observation\n\n4 hours\n2.2 Describe work as\na team member\n• Team goals and objectives\n• Fundamental rights at work\nincluding gender sensitivity\n• Identifying individual role\nand responsibility\n• Identifying external\nrelationship\n• Interaction\n\n• Interviews/\nquestioning\n\n--- PDF PAGE 124 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 119\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Understanding individual\ncompetencies relative to\nteamwork\n• Types of individuals\n• Role of leaders\n• Interacting effectively\nwith others\n• Setting team goals and\nexpectations\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives with\norganizational\ngoals\n• Work values and ethics\n(Code of Conduct, Code of\nEthics, etc.)\n• Understanding personal\nobjectives\n• Understanding\norganizational goals\n• Difference between intra\nand interpersonal\nrelationship\n• Performance evaluation\n• Demonstrate Intra and\nInterpersonal skills at\nwork\n• Demonstrate personal\ncommitment in work\n• Discussion\n\n• Demonstration\n6 hours\n3.2 Set and meet\nwork priorities\n• Company policies\n• Company operations,\nprocedures and standards\n• Time management\n• Time Management\n• Basic strategic planning\nconcepts\n• Resource utilization and\nmanagement\n• Managing goals and time\n• Practice economic use of\nresources and facilities\n• Setting work priorities\n• Practice time\nmanagement\n• Interaction\n• Observation\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\n• Career