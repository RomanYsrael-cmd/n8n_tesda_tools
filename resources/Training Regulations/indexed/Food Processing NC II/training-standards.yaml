      "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for FOOD PROCESSING NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core\nunits\nof\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology, communication/language and other academic subjects\nshall be contextualized. To this end, TVET providers shall develop a Contextual\nLearning Matrix (CLM) to green technology, issues on health and drugs and\ncater person with disabilities (PWD’s)\n\nCourse Title: FOOD PROCESSING NC Level: NC II\n\nNominal Training Duration:\n\n18 hrs\nBasic Competencies\n\n14 hrs\nCommon Competencies\n\n520 hrs\nCore Competencies\nTotal 552 Hrs\n\nCourse Description:\n\nThis course is designed to provide the students/learner with knowledge,\ndesirable attitudes and skills required to perform the following competencies in\naccordance with industry standards: Process Food by Salting, Curing and Smoking,\nProcess Food by Fermentation and Pickling, Process Food by Sugar Concentration,\nProcess Food by Drying and Dehydration and; Process Food by Thermal Application.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 122 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 117\n\nBASIC COMPETENCIES\n18 hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMeth