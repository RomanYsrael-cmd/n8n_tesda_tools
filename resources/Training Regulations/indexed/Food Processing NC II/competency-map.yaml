  "source_text": "SECTION 1 QUALIFICATION DESCRIPTION\n\nFOOD PROCESSING NC II QUALIFICATION\n\nThe FOOD PROCESSING NC II Qualification consists of competencies that\na person must have in order to process foods by salting, curing and smoking;\nprocess food by fermentation and pickling; process food by sugar concentration;\nprocess food by drying and dehydration and process food by thermal application.\nInclusive to each of the above competencies, is the task of packing the processed\nfood and operating simple packing equipment such as sealer. The person must\nalso have competencies in practicing Food Safety Act 2013, cGMP, HACCP,\nOSHS and 7S of Good Housekeeping, including following relevant environmental\nrules and regulations.\n\n It also includes competencies of a person in the production line of\nmanufacturing processed food who is responsible for routinary works such as\ninspection of simple defects of packing materials, seal integrity and correct product\nlabel. It also comprises the calibrating and operating of basic food processing tools\nand equipment such as salinometer, refractometer, food processor and weighing\nscale. This qualification does not include dairy products and baking/pastry making.\n\nThis Qualification is packaged from the competency map of the Agriculture and\nFishery, Processed Food and Beverage Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\nPFB751210\nApply Food Safety and Sanitation\nPFB751211\nUse Standard Measuring Devices / Instruments\nPFB751212\nUse Food Processing Tools, Equipment and Utensils\nPFB751213\nPerform Mathematical Computation\nPFB751214\nImplement Good Manufacturing Practice Procedure\nPFB751215\nImplement Environmental Policies and Procedures\n\nUNIT CODE\nCORE COMPETENCIES\nPFB751330\nProcess Food by Salting, Curing and Smoking\nPFB751331\nProcess Food by Fermentation and Pickling\nPFB751332\nProcess Food by Sugar Concentration\nPFB751333\nProcess Food by Drying and Dehydration\nPFB751334\nProcess Food by Thermal Application\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\n\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 2\n\nA person who has achieved this Qualification is competent to be:\n\n❑ Food Processing Worker\n❑ Food Production Worker/Staff\n❑ Packing Staff /Packer\n❑ Quality Control Staff\nMay also be known by specific products:\n❑ Tocino Maker\n❑ Tinapa Maker\n❑ Dried-fish Processor\n❑ Cured-meat Processor\n❑ Fruit-candy Maker\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 2"
