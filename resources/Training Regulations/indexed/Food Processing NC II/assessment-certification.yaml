      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence through project-type full qualification assessment sequentially covering all the units of competency that comprise the Training Regulations for FOOD PROCESSING NC II as follows: Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The qualification of FOOD PROCESSING NC II may be attained through - 4.1.2.1 Accumulation of Certificates of Competency (COCs) in the following areas: 4.1.2.2 Process Food by Salting, Curing and Smoking 4.1.2.3 Process Food by Fermentation and Pickling 4.1.2.4 Process Food by Sugar Concentration 4.1.2.5 Process Food by Drying and Dehydration 4.1.2.6 Process Food by Thermal Application BASIC COMPETENCIES Participate in workplace communication Work in team environment Practice career professionalism Practice occupational health and safety procedures COMMON COMPETENCIES Apply Food Safety and Sanitation Use Standard Measuring Devices / Instruments Use Food Processing Tools, Equipment and Utensils Perform Mathematical Computation Implement Good Manufacturing Practice Procedure Implement Environmental Policies and Procedures CORE COMPETENCIES Process Food by Salting, Curing and Smoking Process Food by Fermentation and Pickling Process Food by Sugar Concentration Process Food by Drying and Dehydration Process Food by Thermal Application TR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015 Page 185 4.1.3 Assessment shall focus on the units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 The following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of formal, non-formal and informal including enterprise-based training programs 4.1.4.2 Experienced Workers (Wage employed or self-employed) 4.1.5 Reassessment is allowed only after one month from the