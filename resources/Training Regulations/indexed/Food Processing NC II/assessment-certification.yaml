  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence through project-type full qualification assessment sequentially\ncovering all the units of competency that comprise the Training Regulations for\nFOOD PROCESSING NC II as follows:\n\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.2 The qualification of FOOD PROCESSING NC II may be attained through -\n4.1.2.1 Accumulation of Certificates of Competency (COCs) in the following\nareas:\n4.1.2.2\nProcess Food by Salting, Curing and Smoking\n4.1.2.3\nProcess Food by Fermentation and Pickling\n4.1.2.4\nProcess Food by Sugar Concentration\n4.1.2.5\nProcess Food by Drying and Dehydration\n4.1.2.6\nProcess Food by Thermal Application\nBASIC COMPETENCIES\nParticipate in workplace communication\nWork in team environment\nPractice career professionalism\nPractice occupational health and safety procedures\n\nCOMMON COMPETENCIES\nApply Food Safety and Sanitation\nUse Standard Measuring Devices / Instruments\nUse Food Processing Tools, Equipment and Utensils\nPerform Mathematical Computation\nImplement Good Manufacturing Practice Procedure\nImplement Environmental Policies and Procedures\n\nCORE COMPETENCIES\nProcess Food by Salting, Curing and Smoking\nProcess Food by Fermentation and Pickling\nProcess Food by Sugar Concentration\nProcess Food by Drying and Dehydration\nProcess Food by Thermal Application\n\n--- PDF PAGE 191 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 185\n\n4.1.3 Assessment shall focus on the units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n4.1.4 The following are qualified to apply for assessment and certification:\n4.1.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs\n4.1.4.2 Experienced Workers (Wage employed or self-employed)\n\n4.1.5 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n\n4.1.6 A candidate who fails the assessment for two (2) consecutive times will be required\nto go through a refresher course before taking another assessment.\n\n4.1.7 Only certified individuals in this Qualification may be nominated by the industry sector\nfor accreditation as competency assessor.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool\nto help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\nThis document can:\n\na)\nIdentify the candidate’s skills and knowledge\nb)\nHighlight gaps in candidate’s skills and knowledge\nc)\nProvide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd)\nAssist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is\nauthorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 192 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 186\n\nCORE UNITS OF COMPETENCY\n\nImplement sampling\nprocedures\n\nLoad and unload raw\nmaterials, products\nand/or supplies\n\nProcess Food by\nDrying and\nDehydration\n\nOperate a packaging\nprocess\n\nParticipate in sensory\nanalysis\n\nInspect and sort\nmaterials and product\n\nProcess Food by\nSalting, Curing and\nSmoking\n\nApply product\nknowledge to\ncomplete work\noperations\n\nWork in a freezer\nstorage area\n\nSet up and operate\nprocesses in a production /\npackaging system\n\nDispense non bulk\ningredients\n\nProcess Food by\nFermentation and\nPickling\n\nPerform basic tests in\nraw materials, in\nprocess and finished\nproducts\n\nWork with temperature\ncontrolled stock\n\nParticipate in an audit\nprocess\n\nPrepare raw/packaging\nmaterials for\nprocessing\n\nProcess food by sugar\nconcentration\n\nOperate a boiler\n\nHandle dangerous\ngoods/hazardous\nsubstances\n\nParticipate in a HACCP\nteam\n\nOperate basic\nequipment\n\nProcess food by thermal\napplication\n\nOperate pumping\nequipment\n\nApply raw materials /\ningredients and\nprocess knowledge\n\nMonitor workplace\nperformance and participate\nin improvement processes\n\nClean and sanitize\nequipment and\nprocessing/packaging\narea\n\nReceive and store stock\n\nOperate and monitor\nfood processes and\nequipment\n\nMaintain food safety\nwhen loading,\nunloading and\ntransporting food\n\nCOMMON UNITS OF COMPETENCY\n\nApply Food Safety and\nSanitation\n\nUse Standard\nMeasuring Devices /\nInstruments\n\nUse Food Processing\nTools, Equipment and\nUtensils\n\nFollow work\nprocedures to maintain\nGood Manufacturing\nPractice\n\nPerform Mathematical\nComputation\n\nImplement Good\nManufacturing Practice\nProcedures\n\nImplement\nEnvironmental Policies\nand Procedures\n\nMonitor the\nImplementation of\nGood Manufacturing\nPractice Procedures\n\nMonitor the\nImplementation of\nEnvironmental Policies\nand Procedures\n\nBASIC UNITS OF COMPETENCY\nReceive and Respond to\nWorkplace\nCommunication\n\nParticipate in Workplace\nCommunication\n\nLead Workplace\nCommunication\n\nUse relevant\ntechnologies\n\nCollect, analyze and\norganize information\n\nWork with Others\n\nWork in a Team\nEnvironment\n\nLead Small Team\n\nUtilize specialized\ncommunication skills\n\nPlan and Organize Work\n\nDemonstrate Work\nValues\n\nPractice Career\nProfessionalism\n\nDevelop and practice\nnegotiation skills\n\nDevelop Team and\nIndividual\n\nPractice Housekeeping\nProcedures\n\nPractice Occupational\nHealth and Safety\nProcedures\n\nSolve Workplace\nProblems Related to\nWork Activities\n\nApply Problem Solving\nTechniques in the\nWorkplace\n\nCOMPETENCY MAP FOR PROCESSED FOOD AND\nBEVERAGES SECTOR\nFOOD PROCESSING NC II\n\n--- PDF PAGE 193 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 187\n\nDEFINITION OF TERMS\n\n1.\nCompetency – is the application of knowledge, skills and attitudes to perform work activities\nto the standard expected in the workplace.\n\n2.\nUnit of Competency – describes a work activity.\n\n3.\nElements – are building blocks of a unit of competency. It describes in outcome terms the\nfunctions that a person who works in a particular area of work is able to perform.\n\n4.\nPerformance Criteria – are evaluative statements that specify what is to be assessed and\nthe required level of performance.\n\n5.\nRange of Variables – describe the circumstances or context in which the work is to be\nperformed.\n\n6.\nEvidence Guide – a guide for assessment that provides information on critical aspects of\ncompetency, underpinning knowledge, underpinning skills, resource\nimplications, context of assessment and assessment methods.\n\n7.\nBlanching – refers to a heat treatment in which the raw food material is immersed in hot\nwater or exposed to live steam.\n\n8.\nBottling/Canning – refers to a preservation of foods in hermetically sealed containers such\nas tin cans and glass jars by sterilization with heat\n\n9.\nBFAD - Bureau of Food and Drug\n\n10.\nBrine – refers to a salt solution\n\n11.\nCabinet Drying - refers to a process of dehydrating food material using a cabinet drier\nconsisting of a closed chamber which is well insulated against heat loss\n\n12.\nChilling – is subjecting meat to a temperature of 2-4°C(36-40°F) at certain period of time\n\n13.\nCuring – refers to a process by which salt, sugar and salitre and other preservatives and\nadjuncts are introduced/are used to prolong the keeping quality of the products\n\n14.\nDehydration- refers to drying by artificially produced heat under carefully controlled\nconditions of temperature, humidity and airflow within a chamber\n\n15.\nDry Curing– refers to a method of curing meat where curing mixture is rubbed on the\nsurface of the food material being cured.\n\n16.\nEbulliometer - is a key piece of wine making equipment for commercial winemakers, as it\ndetermines the alcohol content of your wine. Ebulliometers measure alcohol\ncontent in wine based on the difference in boiling points between water and\nwine.\n\n17.\nExhausting – refers to the removal of air and gases from the raw material and the container\n\n--- PDF PAGE 194 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 188\n\nbefore sealing; It refers to the heating of canned foods to a center can\ntemperature of 180°C to 205°F before sealing.\n\n18.\nFermentation – refers to the anaerobic oxidation of carbohydrates by microbial enzymes\n\n19.\nFood Additives- refer to substances intentionally added to foods to achieve or retain\ndesired characteristics\n\n20.\nFood Processing – refers to the application of heat in varying degree to the food enclosed\nin a container for a sufficient time to sterilize the product\n\n21.\nGRAS- means generally regarded as safe\n\n22.\nHermetic Sealing- refers to the closure of tin cans or glass jars tightly to prevent the\nentrance of microorganisms\n\n23.\nPacking Medium – refers to brine, syrup, broth, oil or other similar ingredients used as\ncanning medium\n\n24.\nPacking – refers to the preparation of product or commodity for proper storage and/or\ntransportation.\n\n25.\nPickling- refers to the preservation of foods by brine and vinegar with or without bacterial\nfermentation\n\n26.\npH meter – refers to an instrument used to measure the acidity of a sample\n\n27.\nPNS – Philippine National Standards (DA-BAPPS)\n\n28.\nPP – Polypropylene\n\n29.\nPE – Polyethylene\n\n30.\nPreservatives- refer to food additives that retard spoilage and preserve the natural color &\nflavor of food products\n\n31.\nPulverize – to reduce by crushing or grinding to very small particles\n\n32.\nRaw Materials – consist of the main food material to be processed including minor food\ningredients\n\n33.\nRetort Specification – refers to a steam pressure canner used in sterilizing low acid\ncanned foods\n\n34.\nSanitation - refers to the process of treating food contact and non-food contact surface with\nphysical agents and chemicals to kill the residual microorganisms present after\ncleaning\n\n35.\nSalinometer- refers to the instrument to measure strength of brine\n\n--- PDF PAGE 195 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 189\n\n36.\nStandard Measurement – refers to something set up as a rule for measuring or a model to\nbe followed\n\n37.\nSensory evaluation – is a scientific discipline that analyses and measures human\nresponses to the composition of food and drink, e.g. appearance,\ntouch, odour, texture, temperature and taste.\n\n38.\nSmoke – refers to the gas from burning wood material containing combustible and\nnoncombustible substances, the combustible substances are the main sources of\nsmoke which consist of cellulose, lignin, pentosans, tannic acid, protein\nsubstances, resins and terpenes\n\n39.\n Smoking – refers to subjecting the product to the action of smoke from burning wood\nmaterials\n\n40.\nSmoke House- refers to a closed smoke chamber where smoke is produced which may\nrange from the temporary (barrel) smoke house to the permanent frame or\nconcrete smoke house.\n\n41.\nSugar Concentrates – refer to products cooked with sugar to attain a concentration of 40-\n65% or to saturated sucrose level\n\n42.\nSyrup – refers to a sugar solution whether light, medium or heavy syrup\n\n43.\nSyruping – practice of making syrup made through boiling down or otherwise concentrating\nplant sap, juice or grain extracts.\n\n44.\nThermal Processing – refers to the method of processing food in hermetically sealed\ncontainer by applying heat with the right temperature and time,\nenough to kill microorganisms responsible in the spoilage of food\nwhich involve bottling and canning\n\n45.\nWater Bath – it is a set up used for canning consisting of a large kettle with fitting cover\ndeep enough to have an inch or two over the tops of the containers of food\nand an extra 1-2 inch space for boiling with a wooden or metal rack made for\nholding filled containers; used for processing high acid canned products.\n\n--- PDF PAGE 196 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 190\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nThis 