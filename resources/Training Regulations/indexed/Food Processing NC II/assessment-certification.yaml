      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 192 --- TR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015 Page 186 Implement sampling procedures Load and unload raw materials, products and/or supplies Process Food by Drying and Dehydration Operate a packaging process Participate in sensory analysis Inspect and sort materials and product Process Food by Salting, Curing and Smoking Apply product knowledge to complete work operations Work in a freezer storage area Set up and operate processes in a production / packaging system Dispense non bulk ingredients Process Food by Fermentation and Pickling Perform basic tests in raw materials, in process and finished products Work with temperature controlled stock Participate in an audit process Prepare raw/packaging materials for processing Process food by sugar concentration Operate a boiler Handle dangerous goods/hazardous substances Participate in a HACCP team Operate basic equipment Process food by thermal application Operate pumping equipment Apply raw materials / ingredients and process knowledge Monitor workplace performance and participate in improvement processes Clean and sanitize equipment and processing/packaging area Receive and store stock Operate and monitor food processes and equipment Maintain food safety when loading, unloading and transporting food Apply Food Safety and Sanitation Use Standard Measuring Devices / Instruments Use Food Processing Tools, Equipment and Utensils Follow work procedures to maintain Good Manufacturing Practice Perform Mathematical Computation Implement Good Manufacturing Practice Procedures Implement Environmental Policies and Procedures Monitor the Implementation of Good Manufacturing Practice Procedures Monitor the Implementation of Environmental Policies and Procedures Receive and Respond to Workplace Communication Participate in Workplace Communication Lead Workplace Communication Use relevant technologies Collect, analyze and organize information Work with Others Work in a Team Environment Lead Small Team Utilize specialized communication skills Plan and Organize Work Demonstrate Work Values Practice Career Professionalism Develop and practice negotiation skills Develop Team and Individual Practice Housekeeping Procedures Practice Occupational Health and Safety Procedures Solve Workplace Problems Related to Work Activities Apply Problem Solving Techniques in the Workplace --- PDF PAGE 193 --- TR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015 Page 187 1. Competency – is the application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace. 2. Unit of Competency – describes a work activity. 3. Elements – are building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in a particular area of work is able to perform. 4. Performance Criteria – are evaluative statements that specify what is to be assessed and the required level of performance. 5. Range of Variables – describe the circumstances or context in which the work is to be performed. 6. Evidence Guide – a guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment methods. 7. Blanching – refers to a heat treatment in which the raw food material is immersed in hot water or exposed to live steam. 8. Bottling/Canning – refers to a preservation of foods in hermetically sealed containers such as tin cans and glass jars by sterilization with heat 9. BFAD - Bureau of Food and Drug 10. Brine – refers to a salt solution 11. Cabinet Drying - refers to a process of dehydrating food material using a cabinet drier consisting of a closed chamber which is well insulated against heat loss 12. Chilling – is subjecting meat to a temperature of 2-4°C(36-40°F) at certain period of time 13. Curing – refers to a process by which salt, sugar and salitre and other preservatives and adjuncts are introduced/are used to prolong the keeping quality of the products 14. Dehydration- refers to drying by artificially produced heat under carefully controlled conditions of temperature, humidity and airflow within a chamber 15. Dry Curing– refers to a method of curing meat where curing mixture is rubbed on the surface of the food material being cured. 16. Ebulliometer - is a key piece of wine making equipment for commercial winemakers, as it determines the alcohol content of your wine. Ebulliometers measure alcohol content in wine based on the difference in boiling points between water and wine. 17. Exhausting – refers to the removal of air and gases from the raw material and the container --- PDF PAGE 194 --- TR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015 Page 188 before sealing; It refers to the heating of canned foods to a center can temperature of 180°C to 205°F before sealing. 18. Fermentation – refers to the anaerobic oxidation of carbohydrates by microbial enzymes 19. Food Additives- refer to substances intentionally added to foods to achieve or retain desired characteristics 20. Food Processing – refers to the application of heat in varying degree to the food enclosed in a container for a sufficient time to sterilize the product 21. GRAS- means generally regarded as safe 22. Hermetic Sealing- refers to the closure of tin cans or glass jars tightly to prevent the entrance of microorganisms 23. Packing Medium – refers to brine, syrup, broth, oil or other similar ingredients used as canning medium 24. Packing – refers to the preparation of product or commodity for proper storage and/or transportation. 25. Pickling- refers to the preservation of foods by brine and vinegar with or without bacterial fermentation 26. pH meter – refers to an instrument used to measure the acidity of a sample 27. PNS – Philippine National Standards (DA-BAPPS) 28. PP – Polypropylene 29. PE – Polyethylene 30. Preservatives- refer to food additives that retard spoilage and preserve the natural color & flavor of food products 31. Pulverize – to reduce by crushing or grinding to very small particles 32. Raw Materials – consist of the main food material to be processed including minor food ingredients 33. Retort Specification – refers to a steam pressure canner used in sterilizing low acid canned foods 34. Sanitation - refers to the process of treating food contact and non-food contact surface with physical agents and chemicals to kill the residual microorganisms present after cleaning 35. Salinometer- refers to the instrument to measure strength of brine --- PDF PAGE 195 --- TR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015 Page 189 36. Standard Measurement – refers to something set up as a rule for measuring or a model to be followed 37. Sensory evaluation – is a scientific discipline that analyses and measures human responses to the composition of food and drink, e.g. appearance, touch, odour, texture, temperature and taste. 38. Smoke – refers to the gas from burning wood material containing combustible and noncombustible substances, the combustible substances are the main sources of smoke which consist of cellulose, lignin, pentosans, tannic acid, protein substances, resins and terpenes 39. Smoking – refers to subjecting the product to the action of smoke from burning wood materials 40. Smoke House- refers to a closed smoke chamber where smoke is produced which may range from the temporary (barrel) smoke house to the permanent frame or concrete smoke house. 41. Sugar Concentrates – refer to products cooked with sugar to attain a concentration of 40- 65% or to saturated sucrose level 42. Syrup – refers to a sugar solution whether light, medium or heavy syrup 43. Syruping – practice of making syrup made through boiling down or otherwise concentrating plant sap, juice or grain extracts. 44. Thermal Processing – refers to the method of processing food in hermetically sealed container by applying heat with the right temperature and time, enough to kill microorganisms responsible in the spoilage of food which involve bottling and canning 45. Water Bath – it is a set up used for canning consisting of a large kettle with fitting cover deep enough to have an inch or two over the tops of the containers of food and an extra 1-2 inch space for boiling with a wooden or metal rack made for holding filled containers; used for processing high acid canned products. --- PDF PAGE 196 --- TR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015 Page 190 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. This undertaking was also made possible through the collaborative project between TESDA and DA entitled DA-TESDA National Convergence Program on Enhancing Agricultural Productivity through Skills Development which is supported by the Department of Agriculture- Agricultural Training Institute. Ms. MA. LIGAYA T. BRAGANZA Technical Expert Phil. Women’s University Taft Avenue, Manila Ms. REGGIE A. SOLANA Technical Expert Nutrinova Phils. Unit 801, Manila Luxury Cond. Pearl Drive, cor. Goldloop St Ortigas, Pasig City Ms. MILAGROS C. REYES Technical Expert Rizal Experimental Station & Pilot School of Cottage Industries Jenny’s Avenue Extn. Maybunga, Pasig City Ms. OLIVIA P. ESTIOKO Technical Expert Technology & Livelihood Resource Center 8th Flr., Citystate Bldg. 709 Shaw Blvd., Pasig City THE TECHNICAL EXPERT PANEL (TEP) MS. EMELINA A. LOPEZ Technical Exp