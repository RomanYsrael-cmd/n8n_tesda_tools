icipate in an audit process Prepare raw/packaging materials for processing Process food by sugar concentration Operate a boiler Handle dangerous goods/hazardous substances Participate in a HACCP team Operate basic equipment Process food by thermal application Operate pumping equipment Apply raw materials / ingredients and process knowledge Monitor workplace performance and participate in improvement processes Clean and sanitize equipment and processing/packaging area Receive and store stock Operate and monitor food processes and equipment Maintain food safety when loading, unloading and transporting food COMMON UNITS OF COMPETENCY Apply Food Safety and Sanitation Use Standard Measuring Devices / Instruments Use Food Processing Tools, Equipment and Utensils Follow work procedures to maintain Good Manufacturing Practice Perform Mathematical Computation Implement Good Manufacturing Practice Procedures Implement Environmental Policies and Procedures Monitor the Implementation of Good Manufacturing Practice Procedures Monitor the Implementation of Environmental Policies and Procedures BASIC UNITS OF COMPETENCY Receive and Respond to Workplace Communication Participate in Workplace Communication Lead Workplace Communication Use relevant technologies Collect, analyze and organize information Work with Others Work in a Team Environment Lead Small Team Utilize specialized communication skills Plan and Organize Work Demonstrate Work Values Practice Career Professionalism Develop and practice negotiation skills Develop Team and Individual Practice Housekeeping Procedures Practice Occupational Health and Safety Procedures Solve Workplace Problems Related to Work Activities Apply Problem Solving Techniques in the Workplace"
