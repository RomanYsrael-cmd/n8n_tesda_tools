  "source_text": "1.\nCompetency – is the application of knowledge, skills and attitudes to perform work activities\nto the standard expected in the workplace.\n\n2.\nUnit of Competency – describes a work activity.\n\n3.\nElements – are building blocks of a unit of competency. It describes in outcome terms the\nfunctions that a person who works in a particular area of work is able to perform.\n\n4.\nPerformance Criteria – are evaluative statements that specify what is to be assessed and\nthe required level of performance.\n\n5.\nRange of Variables – describe the circumstances or context in which the work is to be\nperformed.\n\n6.\nEvidence Guide – a guide for assessment that provides information on critical aspects of\ncompetency, underpinning knowledge, underpinning skills, resource\nimplications, context of assessment and assessment methods.\n\n7.\nBlanching – refers to a heat treatment in which the raw food material is immersed in hot\nwater or exposed to live steam.\n\n8.\nBottling/Canning – refers to a preservation of foods in hermetically sealed containers such\nas tin cans and glass jars by sterilization with heat\n\n9.\nBFAD - Bureau of Food and Drug\n\n10.\nBrine – refers to a salt solution\n\n11.\nCabinet Drying - refers to a process of dehydrating food material using a cabinet drier\nconsisting of a closed chamber which is well insulated against heat loss\n\n12.\nChilling – is subjecting meat to a temperature of 2-4°C(36-40°F) at certain period of time\n\n13.\nCuring – refers to a process by which salt, sugar and salitre and other preservatives and\nadjuncts are introduced/are used to prolong the keeping quality of the products\n\n14.\nDehydration- refers to drying by artificially produced heat under carefully controlled\nconditions of temperature, humidity and airflow within a chamber\n\n15.\nDry Curing– refers to a method of curing meat where curing mixture is rubbed on the\nsurface of the food material being cured.\n\n16.\nEbulliometer - is a key piece of wine making equipment for commercial winemakers, as it\ndetermines the alcohol content of your wine. Ebulliometers measure alcohol\ncontent in wine based on the difference in boiling points between water and\nwine.\n\n17.\nExhausting – refers to the removal of air and gases from the raw material and the container\n\n--- PDF PAGE 194 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 188\n\nbefore sealing; It refers to the heating of canned foods to a center can\ntemperature of 180°C to 205°F before sealing.\n\n18.\nFermentation – refers to the anaerobic oxidation of carbohydrates by microbial enzymes\n\n19.\nFood Additives- refer to substances intentionally added to foods to achieve or retain\ndesired characteristics\n\n20.\nFood Processing – refers to the application of heat in varying degree to the food enclosed\nin a container for a sufficient time to sterilize the product\n\n21.\nGRAS- means generally regarded as safe\n\n22.\nHermetic Sealing- refers to the closure of tin cans or glass jars tightly to prevent the\nentrance of microorganisms\n\n23.\nPacking Medium – refers to brine, syrup, broth, oil or other similar ingredients used as\ncanning medium\n\n24.\nPacking – refers to the preparation of product or commodity for proper storage and/or\ntransportation.\n\n25.\nPickling- refers to the preservation of foods by brine and vinegar with or without bacterial\nfermentation\n\n26.\npH meter – refers to an instrument used to measure the acidity of a sample\n\n27.\nPNS – Philippine National Standards (DA-BAPPS)\n\n28.\nPP – Polypropylene\n\n29.\nPE – Polyethylene\n\n30.\nPreservatives- refer to food additives that retard spoilage and preserve the natural color &\nflavor of food products\n\n31.\nPulverize – to reduce by crushing or grinding to very small particles\n\n32.\nRaw Materials – consist of the main food material to be processed including minor food\ningredients\n\n33.\nRetort Specification – refers to a steam pressure canner used in sterilizing low acid\ncanned foods\n\n34.\nSanitation - refers to the process of treating food contact and non-food contact surface with\nphysical agents and chemicals to kill the residual microorganisms present after\ncleaning\n\n35.\nSalinometer- refers to the instrument to measure strength of brine\n\n--- PDF PAGE 195 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 189\n\n36.\nStandard Measurement – refers to something set up as a rule for measuring or a model to\nbe followed\n\n37.\nSensory evaluation – is a scientific discipline that analyses and measures human\nresponses to the composition of food and drink, e.g. appearance,\ntouch, odour, texture, temperature and taste.\n\n38.\nSmoke – refers to the gas from burning wood material containing combustible and\nnoncombustible substances, the combustible substances are the main sources of\nsmoke which consist of cellulose, lignin, pentosans, tannic acid, protein\nsubstances, resins and terpenes\n\n39.\n Smoking – refers to subjecting the product to the action of smoke from burning wood\nmaterials\n\n40.\nSmoke House- refers to a closed smoke chamber where smoke is produced which may\nrange from the temporary (barrel) smoke house to the permanent frame or\nconcrete smoke house.\n\n41.\nSugar Concentrates – refer to products cooked with sugar to attain a concentration of 40-\n65% or to saturated sucrose level\n\n42.\nSyrup – refers to a sugar solution whether light, medium or heavy syrup\n\n43.\nSyruping – practice of making syrup made through boiling down or otherwise concentrating\nplant sap, juice or grain extracts.\n\n44.\nThermal Processing – refers to the method of processing food in hermetically sealed\ncontainer by applying heat with the right temperature and time,\nenough to kill microorganisms responsible in the spoilage of food\nwhich involve bottling and canning\n\n45.\nWater Bath – it is a set up used for canning consisting of a large kettle with fitting cover\ndeep enough to have an inch or two over the tops of the containers of food\nand an extra 1-2 inch space for boiling with a wooden or metal rack made for\nholding filled containers; used for processing high acid canned products.\n\n--- PDF PAGE 196 ---\nTR- FOOD PROCESSING NC II (AMENDED) PROMULGATED June 16, 2015\nPage 190",
