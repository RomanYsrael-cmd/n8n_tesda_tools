al\napplication\n\n• Oral\nquestioning\n• Written test\n\n6. Prepare\nWeld\nMaterials\n6.1 Identify the different cutting\n equipment and accessories\n6.2 Identify types of mild steel\n electrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective equipment\n6.5 Prepare welding consumables,\ntools and accessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n• Lecturette\n• Practical\napplication\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up\nWelding\nEquipment\n\n7.1 Explain welding principles\n and concepts.\n7.2 Identify the parts of welding\n machine\n7.3 Set up welding machine and\n accessories\n7.4 Set up welding positioners,\n jigs and fixtures\n7.5 Set up pre-heating\n equipment (as required)\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 65 ---\nWeldncii11-3\n\n64\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\n backing plate and stiffener.\n8.2 Explain the methods of striking\n an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen, backing\n plate and stiffener.\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9. Repair\n Welds\n9.1 Identify causes and\n prevention of the different\n weld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and equipment\n9.4 Remove defects\n9.5 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld Alloy\nSteel Plates\nUsing GTAW\n1.1 Perform multiple pass fillet weld\nin different positions (1F-4F)\n1.2 Perform multiple pass groove\nweld in different positions\n (1G-4G)\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n2. Weld Alloy\nSteel Pipes\nUsing GTAW\n2.1 Perform groove weld on pipe in\ndifferent positions\n (2G, 5G and/ or 6G)\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 66 ---\nWeldncii11-3\n\n65"
