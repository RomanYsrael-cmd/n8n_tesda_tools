    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: GAS TUNGSTEN ARC WELDING\n\nNC Level IV\n\n Suggested Nominal Training Hours: 56 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 182 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof trainees in Gas Tungsten Arc Welding in accordance with industry standards. It\ncovers core competencies such as Setting-up Welding Equipment, Preparing\nWeld Materials, Fitting up Weld Materials, Welding Alloy Steel Plates and Pipes\nUsing GTAW and Repairing Welds.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunic\nation skills\n1.1 Meet common and specific\ncommunication needs of clients\nand colleagues\n1.2 Contribute to the development of\ncommunication strategies\n1.3 Represent the organization\n1.4 Facilitate group discussion\n1.5 Conduct interview\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Develop\nteams and\nindividuals\n2.1 Provide team leadership\n2.2 Foster individual and\n organizational growth\n2.3 Monitor and evaluate workplace\n learning\n2.4 Develop team commitment and\n cooperation\n2.5 Facilitate accomplishment of\n organizational goals\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstrati\non\n• Case studies\n\n--- PDF PAGE 63 ---\nWeldncii11-3\n\n62\n3. Apply\nproblem\nsolving\ntechniques\nin the\nworkplace\n3.1 Analyze the problem\n3.2 Identify possible solutions\n3.3 Recommend solution to higher\nmanagement\n3.4 Implement solution\n3.5 Evaluate/Monitor results and\noutcome\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Collect,\nanalyze\nand\norganize\ninformation\n4.1 Study information requirements\n4.2 Process data\n4.3 Analyze, interpret and organize\ninformation gathered\n4.4 Present findings/\n Recommendations\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and\norganize\nwork\n5.1 Set objectives\n5.2 Plan and schedule work activities\n5.3 Implement work plans\n5.4 Monitor work activities\n5.5 Review and evaluate work plans\nand activities\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Promote\nenvironme\nntal\nprotection\n\n6.1 Study guidelines for environmental\nconcerns\n6.2 Implement specific environmental\nprograms\n6.3 Monitor activities on environmental\nprotection /programs\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nwork safely\n1.1 Identify hazardous areas and\n conditions\n1.2 Use protective clothing and\n devices\n1.3 Perform safe handling of tools,\n equipment and materials\n1.4 Explain/perform first aid\n procedure\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n2. Contribute\nto quality\nsystem\n2.1 Inspect work done\n2.2 Apply quality standards to\nwork\n2.3 Protect company/institution\n properties\n2.4 Protect customer interest\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n\n--- PDF PAGE 64 ---\nWeldncii11-3\n\n63\n3. Use hand\ntools\n3.1 Use different hand tools\n3.2 Maintain hand tools\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n•Demonstration\n4. Interpret\nBlueprints\n4.1 Interpret technical drawing.\n4.2 Interpret welding symbols\n\n• Lecturette\n\n• Practical\napplication\n• Oral\nquestioning\n• Written test\n\n5. Perform\nindustry\ncalculations\n5.1 Solve mathematical problems\n5.2 Convert systems of\n measurement\n5.3 Measure workpiece\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written test\n\n6. Prepare\nWeld\nMaterials\n6.1 Identify the different cutting\n equipment and accessories\n6.2 Identify types of mild steel\n electrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective equipment\n6.5 Prepare welding consumables,\ntools and accessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n• Lecturette\n• Practical\napplication\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up\nWelding\nEquipment\n\n7.1 Explain welding principles\n and concepts.\n7.2 Identify the parts of welding\n machine\n7.3 Set up welding machine and\n accessories\n7.4 Set up welding positioners,\n jigs and fixtures\n7.5 Set up pre-heating\n equipment (as required)\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 65 ---\nWeldncii11-3\n\n64\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\n backing plate and stiffener.\n8.2 Explain the methods of striking\n an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen, backing\n plate and stiffener.\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9. Repair\n Welds\n9.1 Identify causes and\n prevention of the different\n weld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and equipment\n9.4 Remove defects\n9.5 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld Alloy\nSteel Plates\nUsing GTAW\n1.1 Perform multiple pass fillet weld\nin different positions (1F-4F)\n1.2 Perform multiple pass groove\nweld in different positions\n (1G-4G)\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n2. Weld Alloy\nSteel Pipes\nUsing GTAW\n2.1 Perform groove weld on pipe in\ndifferent positions\n (2G, 5G and/ or 6G)\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 66 ---\nWeldncii11-3\n\n65"
