  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for GAS TUNGSTEN ARC WELDING\n(GTAW).\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: GAS TUNGSTEN ARC WELDING\n\nNC Level IV\n\n Suggested Nominal Training Hours: 56 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 182 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof trainees in Gas Tungsten Arc Welding in accordance with industry standards. It\ncovers core competencies such as Setting-up Welding Equipment, Preparing\nWeld Materials, Fitting up Weld Materials, Welding Alloy Steel Plates and Pipes\nUsing GTAW and Repairing Welds.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunic\nation skills\n1.1 Meet common and specific\ncommunication needs of clients\nand colleagues\n1.2 Contribute to the development of\ncommunication strategies\n1.3 Represent the organization\n1.4 Facilitate group discussion\n1.5 Conduct interview\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Develop\nteams and\nindividuals\n2.1 Provide team leadership\n2.2 Foster individual and\n organizational growth\n2.3 Monitor and evaluate workplace\n learning\n2.4 Develop team commitment and\n cooperation\n2.5 Facilitate accomplishment of\n organizational goals\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstrati\non\n• Case studies\n\n--- PDF PAGE 63 ---\nWeldncii11-3\n\n62\n3. Apply\nproblem\nsolving\ntechniques\nin the\nworkplace\n3.1 Analyze the problem\n3.2 Identify possible solutions\n3.3 Recommend solution to higher\nmanagement\n3.4 Implement solution\n3.5 Evaluate/Monitor results and\noutcome\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Collect,\nanalyze\nand\norganize\ninformation\n4.1 Study information requirements\n4.2 Process data\n4.3 Analyze, interpret and organize\ninformation gathered\n4.4 Present findings/\n Recommendations\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and\norganize\nwork\n5.1 Set objectives\n5.2 Plan and schedule work activities\n5.3 Implement work plans\n5.4 Monitor work activities\n5.5 Review and evaluate work plans\nand activities\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Promote\nenvironme\nntal\nprotection\n\n6.1 Study guidelines for environmental\nconcerns\n6.2 Implement specific environmental\nprograms\n6.3 Monitor activities on environmental\nprotection /programs\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nwork safely\n1.1 Identify hazardous areas and\n conditions\n1.2 Use protective clothing and\n devices\n1.3 Perform safe handling of tools,\n equipment and materials\n1.4 Explain/perform first aid\n procedure\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n2. Contribute\nto quality\nsystem\n2.1 Inspect work done\n2.2 Apply quality standards to\nwork\n2.3 Protect company/institution\n properties\n2.4 Protect customer interest\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n\n--- PDF PAGE 64 ---\nWeldncii11-3\n\n63\n3. Use hand\ntools\n3.1 Use different hand tools\n3.2 Maintain hand tools\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n•Demonstration\n4. Interpret\nBlueprints\n4.1 Interpret technical drawing.\n4.2 Interpret welding symbols\n\n• Lecturette\n\n• Practical\napplication\n• Oral\nquestioning\n• Written test\n\n5. Perform\nindustry\ncalculations\n5.1 Solve mathematical problems\n5.2 Convert systems of\n measurement\n5.3 Measure workpiece\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written test\n\n6. Prepare\nWeld\nMaterials\n6.1 Identify the different cutting\n equipment and accessories\n6.2 Identify types of mild steel\n electrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective equipment\n6.5 Prepare welding consumables,\ntools and accessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n• Lecturette\n• Practical\napplication\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up\nWelding\nEquipment\n\n7.1 Explain welding principles\n and concepts.\n7.2 Identify the parts of welding\n machine\n7.3 Set up welding machine and\n accessories\n7.4 Set up welding positioners,\n jigs and fixtures\n7.5 Set up pre-heating\n equipment (as required)\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 65 ---\nWeldncii11-3\n\n64\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\n backing plate and stiffener.\n8.2 Explain the methods of striking\n an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen, backing\n plate and stiffener.\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9. Repair\n Welds\n9.1 Identify causes and\n prevention of the different\n weld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and equipment\n9.4 Remove defects\n9.5 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld Alloy\nSteel Plates\nUsing GTAW\n1.1 Perform multiple pass fillet weld\nin different positions (1F-4F)\n1.2 Perform multiple pass groove\nweld in different positions\n (1G-4G)\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n2. Weld Alloy\nSteel Pipes\nUsing GTAW\n2.1 Perform groove weld on pipe in\ndifferent positions\n (2G, 5G and/ or 6G)\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 66 ---\nWeldncii11-3\n\n65\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-\nbased TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 67 ---\nWeldncii11-3\n\n66\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these course should possess\nthe following requirements:\n\n• completed training in GTAW NC II or a holder of GTAW NC II or\n SMAW NC IV\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools and materials per trainee for GAS TUNGSTEN ARC\nWELDING - NC IV\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25\npcs.\nChipping Hammer\n12\nunits\nGTAW Welding\nmachine and\naccessories*\n5 kls.\nFiller rod,\nER308 or 309 1.6 or\n2.4mm dia.\n50\npcs.\nSteel brush\n12\npcs.\nWelding positioners\n24\npcs.\nMild steel flat bar\n3.2mm x 50mm x\n150mm\n12\npcs.\nPlier/tongs\n12\nunits\nPortable disc\ngrinder\n24\npcs.\nMild steel flat bar\n6mm x 100mm x\n150mm\n20\npcs.\nFiles-bastard cut\n1 unit\nExhaust fan\n20\npcs.\nCarbon steel pipe,\n50mm dia. x\n150mm, schedule 40\n25\npcs.\nWelding Mask\n2\nunits\nWork bench w/\nbench vice on 4\ncorners\n5 cyl.\nArgon gas\n25\nsets\nLeather\napron/jacket\n1 unit\nPedestal /bench\ngrinding machine\n1 pc.\nDark glass\n25\nsets\nLeather gloves,\nlong\n1 unit\nIndustrial fan\n14\npcs.\nLens clear glass\n5 pcs.\nSafety goggles,\nwide vision, clear\n\n15\npcs\nCutting disc 3/32” x\n5/8” x 4” dia.\n5 pcs\nOxy-acetylene\ngoggles\n\n15\npcs.\nGrinding disc 1/4” x\n5/8” x 4” dia.\n12\npcs.\nTry square 300\nmm. long\n\n1 tube\nMetal marker\n12\npcs.\nSteel square 300\nmm. long\n\n10pcs\n.\nTungsten Electrode\n2.4 mm\n12\npcs.\nFiles-half round\n\n--- PDF PAGE 68 ---\nWeldncii11-3\n\n67\n5 pcs.\nFillet gauge\n5 pcs.\nHand Hacksaw\n\nNote: Tools and equipment for all welding process.\n* for GTAWwelding process\n\n3.5 TRAINING FACILITIES\nGAS TUNGSTEN ARC WELDING - NC IV\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area*\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n* This area can also be used by other welding courses.\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 69 ---\nWeldncii11-3\n\n68\n3.6 TRAINERS QUALIFICATIONS FOR GTAW WELDER\n\nGAS TUNGSTEN ARC WELDING - NC IV\n\nTRAINER QUALIFICATION (TQ IV)\n\n•\nMust be a holder of GTAW NC IV\n•\nMust have undergone training on Training Methodology IV (TM IV)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken trainees to determine the\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 70 ---\nWeldncii11-3\n\n69"
