ormance\nexpectation for\nteam members\n• Inform subordinates on performance\ncriteria that will be observed\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n2.5 Supervise team\nperformance\n• Establish facilitation skills\n• Small group activities\n•Lecture-Discussion\n• Observation\n• Apply presentation skills as necessary\n• Individual/Small group\nactivities\n• Lecture-Discussion\n• Demonstration with oral\nquestioning\n• Translate ideas and concepts into\nimplementable activities in pharmacy\nservices\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning`\n3. Develop and\npractice\nnegotiation skills\n6.1\nIdentify relevant\ninformation in\nplanning\nnegotiations\n• Obtain necessary information regarding\nthe issue\n• Small group activities\n• Lecture-Discussion\n\n• Observation\n4 hrs\n6.2\nParticipate in\nnegotiations\n• Apply different questioning techniques\n• Small group activities\n• Lecture-Discussion\n• Observation\n• Use appropriate language during\nnegotiation\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n\n• Address and implement problem solving\nstrategies on dealing with unexpected\nquestions and attitudes during\nnegotiation\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n\n6.3\nDocument\nareas for\nagreement\n• Document issues and processes\n• Lecture-discussion\n• Simulation/role playing\n• Demonstration with oral\nquestioning\n• Explore different solutions that may be\nused\n• Direct observation\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 108 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 104\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n• Written documents are filed and kept for\nfuture reference\n• Direct observation\n• Simulatio