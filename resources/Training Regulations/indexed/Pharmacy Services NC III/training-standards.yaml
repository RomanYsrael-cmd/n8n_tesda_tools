g\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written exam\n• Maintain and regulate temperature and\nrelative humidity\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written exam\n• Use palettes to store medicines\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written exam\n• Implement strategies to separate look\nalike drugs\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Follow storage protocols for high alert or\nregulated medications\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Use appropriate chemical/medicine\ncontainers\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Segregate products for return, returned\nproducts and quarantined products\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 118 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 114\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n3.2 Monitor\ninventory\n• Prepare stock control documents\n\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Periodically count the stocks and\ncompare against manual or automated\nrecords\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n• Written Examination\n\n• Report variance of stocks to the\npharmacist\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Monitor safety stock level, low stock\nlevel, and expiration date of medicines\n• Lecture discussion\n• Demonstration and