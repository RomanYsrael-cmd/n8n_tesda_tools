playing\n• Written Exam\n• Demonstration with oral\nquestioning\n• Understand the difference between\nprescription from over-the counter\nmedicines\n• Lecture-discussion\n• Written Exam\n\n• Complete the process of dispensing\nprescription\n• Lecture-discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Pack and label medicine according to its\nappropriate container.\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 123 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 119\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n• Provide patient health information and\nmedicines information\n• Problem-based discussion\n• Workshop\n• Role-playing\n• Written Exam\n• Demonstration with oral\nquestioning\n\n8.4 Receive payment\nand release exact\nchange\n• Implement senior citizen discounts,\ngovernment reimbursement schemes,\nand health care benefits\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n\n• Provide accurate amount of cash\nchange\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n9. Perform health\npromotion,\neducation and\nvigilance\n9.1 Participate in\nhealth promotion\nand education\ncampaigns\n\n• Describe common minor ailments and its\ntreatment\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n200 hrs\n• Describe top major ailments in the\ncountry\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Develop communication skills for\ninformation dissemination on drug\nproducts\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Access reliable information\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Perform first-aid procedure on patients\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Describe common side effects on top\nselling medicines in the country\n• Lecture discussion\n• Small group and large group\ndiscussion\n• Written Exam\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 124 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 120\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n9.2 Perform\nscreening\nprocedures for\ncommon\ndiseases\n• Ask more information about their\npatients health\n• Lecture discussion\n• Role-playing\n\n• Written Exam\n• Demonstration with oral\nquestioning\n\n• Obtain blood pressure measurement of\na patient using blood pressure monitor\n• Demonstration and return\ndemonstration\n• Small group and large group\ndiscussion\n• Demonstration with\noral questioning\n\n9.3 Refer patients to\npharmacist to\nrefer to other\nhealthcare\nprofessionals or\nfacilities\n• Identify trigger points that implies\npatient’s worsening condition\n• Lecture discussion\n• Role-playing\n• Demonstration with\noral questioning\n\n• Refer patients to a pharmacist and other\nhealth care professionals as necessary\n• Lecture discussion\n• Role-playing\n\n• Demonstration with\noral questioning\n\n9.4 Advise patients\non reporting\nunusual\nexperience with\nmedicines\n\n• Identify unusual side effects of top\nselling medicines in the country\n• Lecture discussion\n• Role-playing\n\n• Written Exam\n• Demonstration with oral\nquestioning\n• Communicate with patients effectively\n• Lecture discussion\n• Role-playing\n• Demonstration with oral\nquestioning\n8.5 Guide patients on\nhow to fill-out\nforms\n• Teach patients how to answer the\npharmacovigilance report\n• Demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 125 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page121",
