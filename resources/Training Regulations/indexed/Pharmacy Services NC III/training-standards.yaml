  "source_section_text": "SECTION 3 TRAINING ARRANGEMENT\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for PHARMACY SERVICES NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PHARMACY SERVICES\nNC Level: NC III\n\nNominal Training Duration:\n\nNo. of Hours\nCoverage\n 22\nBasic Competencies\n 24\nCommon Competencies\n802\nCore Competencies\n200\nIndustry Exposure\n1048\nTotal\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Pharmacy Services\nworkers in accordance to pharmacy practice standards. It covers the basic, common, and core\ncompetencies in PHARMACY SERVICES NCIII.\n\nTo obtain this, an individual must achieve the basic, common and core competencies, and\ncomplete the on-the-job training prescribed for this qualification.\n\nThe training center has the option can enter into a memorandum of agreement with an existing\ngovernment health units, retail pharmacy (community, hospital, institutional), or pharmaceutical\nmanufacturing facility for the enhancement of the didactic training for the facilities and equipment to\nbe used. A separate provision may be included for the industry exposure.\n\n--- PDF PAGE 106 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 102\n\nBASIC COMPETENCIES\n\n22hrs\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n\n1. Lead workplace\ncommunication\n\n1.1. Communicate\ninformation\nabout\nworkplace\nprocesses.\n• Display communications skills using\nverbal, written, wireless, non-verbal\n(standard signs and symbols of the\nindustry) media\n• Lecture-Discussion\n• Role play\n• Observation\n• Interview\n4 hrs\n• Read policies and procedures in\nstandard operating protocols\n• Lecture\n• Interview\n1.2. Lead workplace\ndiscussions.\n\n• Demonstrate interpersonal relations in\ndiscussing with superiors, colleagues,\nand/or subordinates\n• Lecture-Discussion\n• Small group activities\n\n• Observation\n\n• Demonstrate people management skills\n• Lecture-Discussion\n•Small group activities\n• Observation\n\n• Facilitate discussion among colleagues\n• Lecture-Discussion\n• Small group activities\n• Observation\n\n1.3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n\n• Apply safety procedures in handling\nequipment and machinery, waste,\nenvironment, volatile fluids and gases.\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Observation\n\n• Apply health and hygiene practices\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n2. Lead small\nteams\n2.1. Lead small\nteams\n• Learn concepts on people management\n• Lecture-Discussion\n• Small group activities’\n•Brainstorming\n• Observation\n4 hrs\n\n• Apply oral and written communication\nskills in dealing with other team\nmembers\n• Lecture-Discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n2.2. Provide team\nleadership\n• Conduct team building activities as\nnecessary\n• Lecture-Discussion\n• Small group activities\n• Observation\n2.3 Assign\nresponsibilities\n• Delegate tasks to other members of the\nteam\n• Small group activities\n• Lecture-Discussion\n\n• Observation\n\n--- PDF PAGE 107 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 103\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\namong\nmembers\n\n• Relay instructional strategies and\nmethodologies\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n2.4 Set 