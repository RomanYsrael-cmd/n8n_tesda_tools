ing\n4 hrs\n• Develop skills in four fundamental\noperations\n• Lecture\n• Exercises\n• Written Exercise\n\n--- PDF PAGE 109 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 105\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n\n• Use calculator or computer for\ncalculating cash change\n• Demonstration with\nreturn demonstration\n•Small-group activities\n• Demonstration with oral\nquestioning\n\n5.2 Apply\nmathematical\nprocedures/soluti\non\n• Use mathematical tools and standard\nformulas\n\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n•Written Exam\n• Use conversion formulas\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n•Written Exams\n• Ensure precisions and accuracy of\nresults\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n•Written Exam\n5.3 Analyze results\n• Analyze and interpret the results based\non specified requirements\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n• Communicate the results of the analysis\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n• Appropriate action is applied in case of\nerror\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n6. Use relevant\ntechnologies\n6.1 Identify\nappropriate\ntechnology\n\n• Follow protocols in the use of basic\nequipment used in the pharmacy\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n2 hrs\n• Use relevant technology to transmit\ndata\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n6.2 Apply relevant\ntechnology\n\n• Use software programs in computers,\nmachines/equipment being used\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n6.3 Maintain/enhance\nrelevant\ntechnology\n• Follow company 