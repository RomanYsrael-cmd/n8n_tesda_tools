y\n• Lecture discussion\n• Role-playing\n\n• Demonstration with\noral questioning\n\n9.4 Advise patients\non reporting\nunusual\nexperience with\nmedicines\n\n• Identify unusual side effects of top\nselling medicines in the country\n• Lecture discussion\n• Role-playing\n\n• Written Exam\n• Demonstration with oral\nquestioning\n• Communicate with patients effectively\n• Lecture discussion\n• Role-playing\n• Demonstration with oral\nquestioning\n8.5 Guide patients on\nhow to fill-out\nforms\n• Teach patients how to answer the\npharmacovigilance report\n• Demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 125 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page121\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be guided by the 10\nbasic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning may be modular or conventional in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both on and off-the-job as\nlong as the learning is driven by the competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs would contain both in-\nschool and in-industry training or fieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the trainee is allowed to\nprogress at his own pace. The trainer just facilitates the training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the opportunity to assist the slow\nlearners.\n•\nSupervised industry training or on-the-job training is an approach in training designed to enhance the\nknowledge and skills of the trainee through actual experience in the workplace to acquire specific competencies\nprescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction occurs when the students\nand instructor are not in the same place. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in which students plan, implement and\nevaluate projects that have real world applicants.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees who want to enroll in this qualification must possess the following requirements:\n\n•\nMust have completed at least ten (10) years of basic education\n•\nCan communicate effectively both orally and in writing\n•\nCan perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as educational attainment, appropriate work\nexperience and others that may be required of the trainees by the school or training center delivering this TVET\nprogram.\n\n3.4 TOOLS, EQUIPMENT ANDMATERIALS\n\n--- PDF PAGE 126 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page122\nPHARMACY SERVICES NC III\nRecommended list of tools, equipment and materials for the training of a maximum of 25 trainees for\nPharmacy Services NC III are as follows:\nQTY.\nEQUIPMENT\nQTY.\nTOOLS/MATERIALS\nQTY.\nREFERENCES\n1 unit\nExecutive Table\n1 unit\nAV Equipment\n1 copy each\nConsumer Law, Environmental Law\n\nTables and Chairs\nfor 25 students\n1 unit\nSound System\n1 copy\nPharmacy Law (RA 5921)\n1 unit\nClerical Table\n1 unit\nInternet Connection\n1 copy\nGenerics Law (RA 6675)\n1 pc.\nWhiteboard\n1 unit\nAir-conditioning Unit\n1 copy\nTraditional Medicine\n1 unit\nCD of PowerPoint\npresentation\n1 unit\nHeat seal or press seal\nequipment\n1 copy\nCounterfeit Medicines Law (RA\n8203)\n1 unit\nLCD Projector\n25 each\nFormulary drugs/ non\nformulary drugs for\ndisplay and simulation\n5 copies\nDOH and FDA circulars related to\nretail pharmacy\n1 unit\nLaptop (for lecturer)\n\nWhite board marker and\neraser\n1 copy\nMedical dosage form and its\nabbreviations\n1 unit\nComputer for\nadministrative and\nclerical work\n1 set\nCleaning materials for\nworking, swabbing,\nsweeping, disinfecting,\nsoaking, sterilizing and or\ncleaning equipment\n1 copy each\nDrug information reference (MIMS,\nMIMS Pharmacy, Better Pharmacy)\n5 units\nComputer for\ntechnology\nresource center and\nclass demonstration\n1 unit\nBio-refrigerator (or\ncabinet that looks like a\nref inside)\n1 copy\nFIP Good Pharmacy Practice\nStandards\n1 unit\nTelephone (for\ninquiries)\n1 each\nHygrothermometer\n1 copy\nGood Laboratory Practice, Good\nManufacturing Practice, Good\nClinical Practice,\n\n1 unit\nTop loading balance\n1 copy\nPhilippine Practice Standard for\nPharmacists (PhilPSP)\n\n25 each\nSteel and porcelain\nspatulas\n1 copy\nPatient Benefit Scheme information\n\n5 each\nFiltration setup (funnel,\nfilter paper, stand)\n1 copy each\nSenior Citizen and Expanded\nSenior Citizen Act\n25\nStirring rod\n1 copy\nPrice Regulation Acts (MDRP)\n2 units\nMortar and pestle*\n1 copy\nDangerous Drug Act\n\nGraduated cylinder (100\nml, 10 ml)\n1 copy\nFood Drug and Cosmetics Act (RA\n3720)\n\nBeakers (500 ml, 250ml,\n100ml, 50ml)\n1 copy\nBFAD Strengthening (RA 9711)\n1 box\nGloves\n1 copy\nCheaper Quality Medicines Act\n1000\nRe-sealable plastics\n1 copy\nGenerics Menu Card\n5\nTablet counter\n1000\nBond Papers\n500\nLabeling materials\n500\nReferral forms\n5\nBubble pack\n1\nAluminum foils\n\n*Note: For demo purposes only\n\n3.5 TRAINING FACILITIES\n\n--- PDF PAGE 127 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page123\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\n\nStudent/Trainee Performance Space (S/TPS)\n\n5 x 8 m.\n\n40 sq. m.\nPharmacy simulation room (PSR)\n2 x 3 m.\n6 sq. m.\n\nTechnology Resource Center (TRC)\n\n2 x 5 m.\n\n10 sq. m.\n\nCirculation Area\n(S/TPS+PSR+TRC+CR) X 30%\n(40+6+10+10) X 30%=19.8sq.m.)\n\n20 sq. m.\n\nSeparate Restrooms for Male and Female Trainees/\nStudents (CR)\n\n2 x 5 m.\n\n10 sq. m.\n\nTotal Workshop Area\n\n86 sq. m.\nThe training center should have a simulation room of a pharmacy set-up (see Annex 1). The simulation room should\nhave shelves (see Annex 2) for display of products and a sink area at the minimum. This simulation room may be\nintegrated within the S/TPS. In addition to that, partnership may be forged with an operating pharmacy or existing\npharmacy drug store where Candidates can visit and observe.\n\n3.6 TRAINER’S QUALIFICATIONS FOR SERVICES SECTOR\n\nPHARMACY SERVICES NC III\nTRAINER QUALIFICATION\n\n•\nMust be a holder of NTTC I in Pharmacy Services NCIII\n•\nMust be a graduate of BS Pharmacy\n•\nMust have at least 2 years job / pharmacy industry experience"
