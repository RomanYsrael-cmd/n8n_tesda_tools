    "source_text": "SECTION 3 TRAINING ARRANGEMENT\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for PHARMACY SERVICES NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PHARMACY SERVICES\nNC Level: NC III\n\nNominal Training Duration:\n\nNo. of Hours\nCoverage\n 22\nBasic Competencies\n 24\nCommon Competencies\n802\nCore Competencies\n200\nIndustry Exposure\n1048\nTotal\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Pharmacy Services\nworkers in accordance to pharmacy practice standards. It covers the basic, common, and core\ncompetencies in PHARMACY SERVICES NCIII.\n\nTo obtain this, an individual must achieve the basic, common and core competencies, and\ncomplete the on-the-job training prescribed for this qualification.\n\nThe training center has the option can enter into a memorandum of agreement with an existing\ngovernment health units, retail pharmacy (community, hospital, institutional), or pharmaceutical\nmanufacturing facility for the enhancement of the didactic training for the facilities and equipment to\nbe used. A separate provision may be included for the industry exposure.\n\n--- PDF PAGE 106 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 102\n\nBASIC COMPETENCIES\n\n22hrs\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n\n1. Lead workplace\ncommunication\n\n1.1. Communicate\ninformation\nabout\nworkplace\nprocesses.\n• Display communications skills using\nverbal, written, wireless, non-verbal\n(standard signs and symbols of the\nindustry) media\n• Lecture-Discussion\n• Role play\n• Observation\n• Interview\n4 hrs\n• Read policies and procedures in\nstandard operating protocols\n• Lecture\n• Interview\n1.2. Lead workplace\ndiscussions.\n\n• Demonstrate interpersonal relations in\ndiscussing with superiors, colleagues,\nand/or subordinates\n• Lecture-Discussion\n• Small group activities\n\n• Observation\n\n• Demonstrate people management skills\n• Lecture-Discussion\n•Small group activities\n• Observation\n\n• Facilitate discussion among colleagues\n• Lecture-Discussion\n• Small group activities\n• Observation\n\n1.3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n\n• Apply safety procedures in handling\nequipment and machinery, waste,\nenvironment, volatile fluids and gases.\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Observation\n\n• Apply health and hygiene practices\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n2. Lead small\nteams\n2.1. Lead small\nteams\n• Learn concepts on people management\n• Lecture-Discussion\n• Small group activities’\n•Brainstorming\n• Observation\n4 hrs\n\n• Apply oral and written communication\nskills in dealing with other team\nmembers\n• Lecture-Discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n2.2. Provide team\nleadership\n• Conduct team building activities as\nnecessary\n• Lecture-Discussion\n• Small group activities\n• Observation\n2.3 Assign\nresponsibilities\n• Delegate tasks to other members of the\nteam\n• Small group activities\n• Lecture-Discussion\n\n• Observation\n\n--- PDF PAGE 107 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 103\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\namong\nmembers\n\n• Relay instructional strategies and\nmethodologies\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n2.4 Set performance\nexpectation for\nteam members\n• Inform subordinates on performance\ncriteria that will be observed\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n2.5 Supervise team\nperformance\n• Establish facilitation skills\n• Small group activities\n•Lecture-Discussion\n• Observation\n• Apply presentation skills as necessary\n• Individual/Small group\nactivities\n• Lecture-Discussion\n• Demonstration with oral\nquestioning\n• Translate ideas and concepts into\nimplementable activities in pharmacy\nservices\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning`\n3. Develop and\npractice\nnegotiation skills\n6.1\nIdentify relevant\ninformation in\nplanning\nnegotiations\n• Obtain necessary information regarding\nthe issue\n• Small group activities\n• Lecture-Discussion\n\n• Observation\n4 hrs\n6.2\nParticipate in\nnegotiations\n• Apply different questioning techniques\n• Small group activities\n• Lecture-Discussion\n• Observation\n• Use appropriate language during\nnegotiation\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n\n• Address and implement problem solving\nstrategies on dealing with unexpected\nquestions and attitudes during\nnegotiation\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n\n6.3\nDocument\nareas for\nagreement\n• Document issues and processes\n• Lecture-discussion\n• Simulation/role playing\n• Demonstration with oral\nquestioning\n• Explore different solutions that may be\nused\n• Direct observation\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 108 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 104\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n• Written documents are filed and kept for\nfuture reference\n• Direct observation\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n• Follow-up on agreements based on\ndeadlines\n• Demonstration\nwith\nreturn demonstration\n• Observation\n6.4\nIdentify relevant\ninformation in\nplanning\nnegotiations\n• Search for relevant information on\ncompeting products and services\n• Lecture-discussion\n• Simulation/role playing\n• Demonstration with oral\nquestioning\n• Written Exams\n6.5\nParticipate in\nnegotiation\n• Deal with patients/clients/ service\nproviders according to agreements\ndiscussed\n• Lecture-discussion\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n4. Solve workplace\nproblem related\nto work activities\n4.1 Explain the\nanalytical\ntechniques\n• Manage and control flow of resources\n• Lecture-discussion\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n4 hrs\n• Identify cause and potential effects\n• Lecture-discussion\n• Brainstorming\n• Demonstration with oral\nquestioning\n4.2 Determine the\npossible\ncause/s of the\nproblem\n• Identify deviations from normal\noperating procedures to maintain\nproduct quality\n• Lecture-discussion\n• Case Discussion\n• Demonstration with oral\nquestioning\n• Written Output\n• Participate in root cause analysis\nsession and state problems clearly\n• Lecture-discussion\n• Case Discussion\n• Demonstration with oral\nquestioning\n• Apply problem analysis and problem\nsolving techniques\n• Lecture-discussion\n• Small-group activity\n• Demonstration with oral\nquestioning\n4.3 Prepare action\nplans\n• Corrective actions are determined\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n• Establish action plans based on\navailable options\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n• Identify mathematical techniques to be\nused in the task at hand\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n4 hrs\n• Develop skills in four fundamental\noperations\n• Lecture\n• Exercises\n• Written Exercise\n\n--- PDF PAGE 109 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 105\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n\n• Use calculator or computer for\ncalculating cash change\n• Demonstration with\nreturn demonstration\n•Small-group activities\n• Demonstration with oral\nquestioning\n\n5.2 Apply\nmathematical\nprocedures/soluti\non\n• Use mathematical tools and standard\nformulas\n\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n•Written Exam\n• Use conversion formulas\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n•Written Exams\n• Ensure precisions and accuracy of\nresults\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n•Written Exam\n5.3 Analyze results\n• Analyze and interpret the results based\non specified requirements\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n• Communicate the results of the analysis\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n• Appropriate action is applied in case of\nerror\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n6. Use relevant\ntechnologies\n6.1 Identify\nappropriate\ntechnology\n\n• Follow protocols in the use of basic\nequipment used in the pharmacy\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n2 hrs\n• Use relevant technology to transmit\ndata\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n6.2 Apply relevant\ntechnology\n\n• Use software programs in computers,\nmachines/equipment being used\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n6.3 Maintain/enhance\nrelevant\ntechnology\n• Follow company policy in relation to\nrelevant technology\n\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n• Access protocols and references on the\nuse of technology\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 110 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 106\n\nCOMMON COMPETENCIES\n(24Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n\n1. Maintain an\neffective relationship\nwith clients/\ncustomers\n\n1.1 Establish\nprofessional\nimage\n\n• Read the Philippine Pharmacist’s Code of\nEthics\n• Lecture-Discussion\n• Role play\n• Observation\n• Interview\n4 hrs\n• Read and understand the role of\npharmacy assistants in the pharmacy\n• Lecture\n• Interview\n• Read patient’s rights\n• Lecture-Discussion\n• Interview\n1.2 Build credibility\namong\ncustomers/clients\n\n• Establish confidence in interacting with\npatients\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Communicate properly with different\ntypes of patients, and of different\nnationalities\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Deliver correct information to the patient\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Provide exemplary customer service\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n1.3 Satisfy clients/\ncustomer\nrequirements\n\n• Attend to, and serve clients/patients\nbased on established SOP\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n• Solve simple problems encountered in\nserving patients\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n• Politely start, carry out, and finish\nconversation with clients\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n• Treat clients/patients with respect\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Observation\n\n--- PDF PAGE 111 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 107\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n2. Update industry\nknowledge and\npractice through\ncontinuing\neducation\n2.1 Identify sources\nof information on\nupdates related\nto practice of\npharmacy\n• Access relevant and updated references\n• Lecture-Discussion\n• Small group activities’\n\n• Demonstration with oral\nquestioning\n• Oral/Written Test\n•Observation\n4 hrs\n• Correctly operate computer hardware and\nselected software\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n•Observation\n2.2 Apply industry\nupdates to\nworkplace\n• Follow new protocols to adhere to\nindustry updates\n• Lecture-Discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n•Observation\n2.3 Update\ncontinuously\nrelevant industry\nknowledge\n\n• Attend seminars relevant and related to\nduties and responsibilities\n• Lecture-Discussion\n• Small group activities\n• Demonstration with oral\nquestioning\n\n• Identify and read references for self-\ndirected learning\n• Small group activities\n• Interview\n• Aim for continuous personal development\n• Individual assignment\n• Interview\n2.4 Access, apply and\nshare industry\ninformation\n• Prepare short presentation/report from\nthe learnings obtained in seminar\n• Lecture-Discussion\n• Individual/Group\nassignment\n• Demonstration with oral\nquestioning\n\n3. Perform\nworkplace\nsecurity and\nsafety practices\n3.1 Identify and follow\nworkplace\nprocedures\n• Follow health, safety and security\nprotocols\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n• Written Exam\n4hrs\n3.2 Handle emergency\nsituations within\nworkplace\n• Identify different types of emergency\nsituations and act accordingly\n• Lecture-Discussion\n• Emergency drills (fire,\nterrorist attack, robbery)\n• Demonstration with oral\nquestioning\n• Written Exam\n\n• Lead patients and colleagues to safety\n• Small group activities\n• Lecture-Discussion\n• Demonstration with oral\nquestioning\n\n3.3 Follow enterprise\nrequirements\n• Read and comply with enterprise goals,\ntargets and measures\n\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n• Use enterprise information systems and\ndata collation based on protocols\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 112 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 108\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n4. Perform\ncomputer\noperations\n\n4.1 Identify and\nexplain the\nfunctions, general\nfeatures and\ncapabilities of\nboth hardware\nand software\n• Identify main parts of a computer\n\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n6 hrs\n• Operate the computer from turning on to\nturning the equipment\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n4.2 Prepare and use\nappropriate\nhardware and\nsoftware\naccording to task\nrequirement\n• Use the company software to process\nordering and issuing receipt\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Encode pertinent patient information and\nprescribed medicines\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Use the internet-browser to access\ninformation\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n4.3 Use appropriate\ndevices and\nprocedures to\ntransfer files/data\n• Use new or formatted USB to transfer\ndata\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n4.4 Produce accurate\nand complete data\naccording to the\nrequirements\n• Process entered data into meaningful\ninformation using relevant software\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Print data according to SOP\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n4.5 Maintain\ncomputer system\n• Troubleshoot in case of virus infection\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Clean regularly to avoid accumulation of\ndust\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 113 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 109\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n5. Use\npharmaceutical\ncalculation\ntechniques and\nterminologies\n5.1 Use dimensional\nanalysis to\nconvert one unit\nto another\n• Read and familiarize with dimensional\nanalysis in conversion\n\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n6 hrs\n• Apply dimensional analysis in conversion\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Read and familiarize with mathematical\nconcepts\n• Apply mathematical concepts in English\nand Metric System of Measurement\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Apply mathematical concepts in English\nand Metric System of Measurement\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Read and familiarize with ratio and\nproportion\n\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Apply ratio and proportion\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n5.2 Understand\npharmaceutical\nterminologies and\nmedical terms\n• Read and familiarize with pharmaceutical\nterminologies and medical terms\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Apply pharmaceutical terminologies and\nmedical terms\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n5.3 Use equipment,\nglassware and\ntools\n• Read and familiarize with equipment,\nglassware and tools\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Operate equipment, use glassware and\ntools\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 114 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 110\n\nCORE COMPETENCIES\n802 hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n1. Practice Good\nHousekeeping\n1.1 Perform\nhousekeeping\nduties\n\n• Apply good storage practices in the\nfacility\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n24 hours\n• Apply good compounding practices in\nmaintaining compounding/sterile area\nand premises\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with\noral questioning\n• Practice good laboratory practice\nprinciples in cleaning work area and\npremises\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with\noral questioning\n• Perform daily housekeeping tasks\nusing appropriate procedures\n• Lecture discussion\n• Demonstration\n• Demonstration with\noral questioning\n•Observation\n• Clean floors to ensure its not dirty or\nslippery\n• Demonstration\n• Demonstration with\noral questioning\n•\nObservation\n• Organize and regularly clean\nhousekeeping tools\n• Demonstration\n• Observation\n• Read and follow pest control protocols\nand schedules\n• Lecture\n• Demonstration\n• Demonstration with\noral questioning\n• Prepare inventory reports on house\ncleaning tools, materials, supplies and\nequipment\n• Lecture\n• Demonstration\n• Demonstration with\noral questioning\n• Fill out different types of daily\nmaintenance records\n• Demonstration\n• Demonstration with\noral questioning\n• Compliance to hygienic practices\n\n• Lecture\n• Demonstration\n• Demonstration with\noral questioning\n• Follow patient safety and employee\nsafety protocols\n• Lecture\n• Demonstration\n• Written Exam\n• Demonstration with\noral questioning\n\n--- PDF PAGE 115 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 111\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n1.2 Follow\nappropriate health\nand safety\npractices in the\narea\n\n• Adhere to occupational Safety and\nHealth Standards\n• Lecture discussion\n\n• Written Exam\n• Demonstration with\noral questioning\n\n• Comply to DOH Sanitation Guidelines\n• Lecture discussion\n\n• Written Exam\n• Demonstration with\noral questioning\n• Follow dispensing area protocols\n\n• Lecture\n• Demonstration with return\ndemonstration\n• Written Exam\n• Demonstration with\noral questioning\n2. Monitor\nsupply/inventory of\npharmaceutical\nproducts\n2.1 Examine the\nmedicines in the\nassortment list or\nformulary\n\n• Familiarize stock keeping units in the\nformulary or assortment list\n• Lecture\n• Demonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n60 hrs\n• Identify fast-moving and slow moving\nproducts using turn-over rate\n• Lecture\n• Exercises\n• Written Exam\n• Demonstration with oral\nquestioning\n• Handle and record inquiries on unserved\nproducts\n• Lecture\n• Demonstration with return\ndemonstration\n\n• Demonstration with oral\nquestioning\n2.2 Assist in\nprocurement of\nmaterials and\nservices from\nqualified sources\n\n• Request minimum documentation\nrequirements from suppliers\n• Lecture\n• Demonstration with return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Prepare purchase request\n• Demonstration with return\ndemonstration\n• Demonstration with oral\nquestioning\n• Follow protocols when counterfeit\nproducts are received\n• Lecture discussion\n• Demonstration and return\ndemonstration\n•Problem based discussion\n• Demonstration with oral\nquestioning\n• Case discussion\n• Communicate procurement needs to\ninventory manager/analyst or pharmacist\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n• Case discussion\n\n--- PDF PAGE 116 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 112\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n2.3 Receive and\ndeliver stocks\n\n• Update and manage stock\ninventory/data\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Check delivery specifications if\ncompliant to good distribution practices\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Check delivery receipt as against to the\nactual products received\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Check product specification prior to\nreceiving\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n2.4 Pack and\ndispatch orders\n\n• Pack medicines in bulk quantities using\nappropriate container\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Follow delivery specifications and\nmaintain temperature requirements\nwhile on transport\n• Lecture discussion\n• Demonstration and return\ndemonstration\n\n• Demonstration with oral\nquestioning\n\n• Follow basic procedures in handling\ndelivery and dispatch of orders\n• Lecture discussion\n• Demonstration and return\ndemonstration\n\n• Demonstration with oral\nquestioning\n\n2.5 Handle returned\nproducts or\nproducts for\nreturn\n• Handle product returns and product for\nreturn according to protocols\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 117 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 113\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n3. Handle and\ncontrol\npharmaceutical\nproducts\n3.1 Comply with drug\nstorage\nrequirements\n• Follow good storage practices and\nmanufacturer’s specification in storing\nthe products\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n40 hrs\n\n• Arrange stocks neatly in the shelves\nfollowing first expiration first out\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Monitor and record temperature and\nrelative humidity using hygrometer\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Assist pharmacist in temperature\nmapping\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written exam\n• Maintain and regulate temperature and\nrelative humidity\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written exam\n• Use palettes to store medicines\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written exam\n• Implement strategies to separate look\nalike drugs\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Follow storage protocols for high alert or\nregulated medications\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Use appropriate chemical/medicine\ncontainers\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Segregate products for return, returned\nproducts and quarantined products\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 118 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 114\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n3.2 Monitor\ninventory\n• Prepare stock control documents\n\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Periodically count the stocks and\ncompare against manual or automated\nrecords\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n• Written Examination\n\n• Report variance of stocks to the\npharmacist\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Monitor safety stock level, low stock\nlevel, and expiration date of medicines\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n• Written Examination\n• Replenish stocks regularly\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Report to pharmacist if quantity of\nproducts are at the reorder quantity, out\nof stock level\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Exercise\n• Demonstration with oral\nquestioning\n\n3.3 Dispose of stock\nwaste\n• Segregate expired medicines for\ndisposal\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written Examination\n• Dispose medicines according to\nstandard protocols\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written Examination\n• Dispose waste according to medical\nwaste segregation process\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n•Written Examination\n\n--- PDF PAGE 119 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 115\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n4. Arrange and\ndisplay of\nproducts\n4.1 Follow\nmerchandising\nplan\n• Understand merchandising concepts\nand terms\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n•Written Examination\n44 hours\n• Use price tag and product locators\naccording to established protocols\n• Lecture-discussion\n• Observation\n• Demonstration with oral\nquestioning\n• Understand and propose product\nsynergism sample\n• Lecture-discussion\n• Case exercise\n• Demonstration with oral\nquestioning\n4.2 Follow display\nplan for\npromotional\nitems\n• Arrange products in the display shelves\nand warehouse according to planogram\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n• Follow promotional activities\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n4.3 Monitor\npromotional\nactivities\n• Respond to customer feedback\n• Problem-based discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n• Follow maximum drug retail price\n• Lecture discussion\n• Demonstration with oral\nquestioning\n\n• Comply to requirements of electronic\ndrug price monitoring system\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n5. Perform good\nlaboratory\npractices\n5.1 Observe proper\nlaboratory\nprotocols\n\n• Read good laboratory practice\nguidelines\n• Lecture discussion\n\n• Written Exam\n• Demonstration with oral\nquestioning\n24hrs\n• Describe proper behavior and attire\ninside the work area\n• Laboratory class\n• Exercise\n\n• Written Exam\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 120 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 116\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n5.2 Demonstrate\nskills in laboratory\nmeasurements\n\n• Weigh solid particles accurately\n• Lecture discussion\n• Laboratory class\n\n• Written Exam\n• Demonstration with oral\nquestioning\n\n• Measure liquid accurately using the\nappropriate glassware\n• Lecture discussion\n• Laboratory class\n• Exercise\n• Written Exam\n• Demonstration with oral\nquestioning\n• Know the use of different glassware and\ninstrument used in the facility\n• Lecture discussion\n• Laboratory class\n\n• Written Exam\n• Demonstration with oral\nquestioning\n5.3 Maintain and\nstore pharmacy\nglassware/device/\nequipment\n• Calibrate instruments according to\nschedule\n• Lecture discussion\n• Laboratory class\n\n• Written Exam\n• Demonstration with oral\nquestioning\n• Clean glassware, workspace,\ninstruments according to protocols\n• Lecture discussion\n• Laboratory class\n\n• Written Exam\n• Demonstration with oral\nquestioning\n• Timely fill documentation requirements\n• Lecture discussion\n• Laboratory class\n• Demonstration with oral\nquestioning\n• Follow chemical/medicine waste\ndisposal\n• Lecture discussion\n• Laboratory class\n• Written Exam\n• Demonstration with oral\nquestioning\n6. Adhere to good\nmanufacturing\npractice (GMP)\n6.1 Demonstrate\ncompliance to Good\nManufacturing\nPractices in own work\n• Understand Pharmaceutical Inspection\nConvention and Pharmaceutical\nInspection Co-operation Scheme\n(PIC/S) Good Manufacturing Practices\nand quality\n• Lecture discussion\n•\n• Written Exam\n• Demonstration with oral\nquestioning\n24 hrs\n• Fill production documents\n• Lecture discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n• Wear laboratory attire appropriately\n• Lecture discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 121 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 117\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n6.2 Observe\npersonal hygiene\nand conduct\n• Prevent contamination\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n\n6.3 Demonstrate\ncompliance to\nGood\nManufacturing\nPractices\nrequirements in\nwork activities\n• Adhere to good manufacturing practices\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n6.4 Complete\ndocumentation\nrequirements to\nsupport GMP\n• Control documents using good\ndocumentation practices\n• Lecture discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n7. Demonstrate\nproduct knowledge\non medicines\n\n7.1 Demonstrate\nadequate knowledge\non OTC and selected\nprescription\nmedicines\n• Describe stock keeping units\n• Lecture discussion\n\n• Written Exam\n\n200 hrs\n\n• Identify classification of (top selling)\ndrugs according to indication\n• Lecture discussion\n•\n• Written Exam\n•\n\n• Identify over-the-counter medicines vs\nprescription medicines\n• Lecture discussion\n• Demonstration\n•\n• Written Exam\n• Demonstration with oral\nquestioning\n• Differentiate generic, branded and\ninnovator medicines\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n7.2 Calculate\nquantity needed\nin prescription\n\n• Compute for the correct number of\nbottles (if liquid) based on the regimen\nprescribed\n• Lecture discussion\n• Exercise\n• Written Exam\n• Demonstration with oral\nquestioning\n• Calculate for correct quantity of tablets,\ncapsules, etc. needed to complete the\nregimen prescribed\n• Lecture discussion\n• Exercise\n• Written Exam\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 122 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 118\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n7.3 Advise proper\nuse of OTC\nmedicine under\nthe supervision of\nthe pharmacist\n• Communicate to patients on the proper\nuse of their over-the-counter medicine\n• Lecture discussion\n• Role-playing\n• Written Exam\n• Demonstration with oral\nquestioning\n\n• Inform patients on the proper storage of\nmedicines\n• Lecture discussion\n• Role-playing\n• Written Exam\n• Demonstration with oral\nquestioning\n8. Dispense\npharmaceutical\nproducts\n8.1 Acknowledge\npatient/ client\n• Greet and interact with patients\naccording to protocol\n• Lecture-discussion\n• Role playing\n• Demonstration with oral\nquestioning\n200 hrs\n8.2 Process Over-\nthe-Counter\nmedicine orders\n\n• Probe patient’s health status\n• Lecture-discussion\n• Role playing\n\n• Written Exam\n• Demonstration with oral\nquestioning\n• Refer to pharmacist if trigger points are\nidentified according to the patient\n• Role playing\n• Lecture-discussion\n• Written Exam\n• Demonstration with oral\nquestioning\n• Complete the process of dispensing\nover-the-counter medicines\n• Role playing\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n8.3 Process\nprescription\nproduct orders\n\n• Familiarize basic concepts and policies\nrelevant to dispensing\n• Lecture-discussion\n• Written Exam\n• Demonstration with oral\nquestioning\n• Recognize prescription validity and\ndispensing error\n• Lecture-discussion\n• Role playing\n• Written Exam\n• Demonstration with oral\nquestioning\n• Understand the difference between\nprescription from over-the counter\nmedicines\n• Lecture-discussion\n• Written Exam\n\n• Complete the process of dispensing\nprescription\n• Lecture-discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Pack and label medicine according to its\nappropriate container.\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 123 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 119\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n• Provide patient health information and\nmedicines information\n• Problem-based discussion\n• Workshop\n• Role-playing\n• Written Exam\n• Demonstration with oral\nquestioning\n\n8.4 Receive payment\nand release exact\nchange\n• Implement senior citizen discounts,\ngovernment reimbursement schemes,\nand health care benefits\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n\n• Provide accurate amount of cash\nchange\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n9. Perform health\npromotion,\neducation and\nvigilance\n9.1 Participate in\nhealth promotion\nand education\ncampaigns\n\n• Describe common minor ailments and its\ntreatment\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n200 hrs\n• Describe top major ailments in the\ncountry\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Develop communication skills for\ninformation dissemination on drug\nproducts\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Access reliable information\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Perform first-aid procedure on patients\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Describe common side effects on top\nselling medicines in the country\n• Lecture discussion\n• Small group and large group\ndiscussion\n• Written Exam\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 124 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 120\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n9.2 Perform\nscreening\nprocedures for\ncommon\ndiseases\n• Ask more information about their\npatients health\n• Lecture discussion\n• Role-playing\n\n• Written Exam\n• Demonstration with oral\nquestioning\n\n• Obtain blood pressure measurement of\na patient using blood pressure monitor\n• Demonstration and return\ndemonstration\n• Small group and large group\ndiscussion\n• Demonstration with\noral questioning\n\n9.3 Refer patients to\npharmacist to\nrefer to other\nhealthcare\nprofessionals or\nfacilities\n• Identify trigger points that implies\npatient’s worsening condition\n• Lecture discussion\n• Role-playing\n• Demonstration with\noral questioning\n\n• Refer patients to a pharmacist and other\nhealth care professionals as necessary\n• Lecture discussion\n• Role-playing\n\n• Demonstration with\noral questioning\n\n9.4 Advise patients\non reporting\nunusual\nexperience with\nmedicines\n\n• Identify unusual side effects of top\nselling medicines in the country\n• Lecture discussion\n• Role-playing\n\n• Written Exam\n• Demonstration with oral\nquestioning\n• Communicate with patients effectively\n• Lecture discussion\n• Role-playing\n• Demonstration with oral\nquestioning\n8.5 Guide patients on\nhow to fill-out\nforms\n• Teach patients how to answer the\npharmacovigilance report\n• Demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 125 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page121\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be guided by the 10\nbasic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning may be modular or conventional in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both on and off-the-job as\nlong as the learning is driven by the competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs would contain both in-\nschool and in-industry training or fieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the trainee is allowed to\nprogress at his own pace. The trainer just facilitates the training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the opportunity to assist the slow\nlearners.\n•\nSupervised industry training or on-the-job training is an approach in training designed to enhance the\nknowledge and skills of the trainee through actual experience in the workplace to acquire specific competencies\nprescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction occurs when the students\nand instructor are not in the same place. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in which students plan, implement and\nevaluate projects that have real world applicants.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees who want to enroll in this qualification must possess the following requirements:\n\n•\nMust have completed at least ten (10) years of basic education\n•\nCan communicate effectively both orally and in writing\n•\nCan perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as educational attainment, appropriate work\nexperience and others that may be required of the trainees by the school or training center delivering this TVET\nprogram.\n\n3.4 TOOLS, EQUIPMENT ANDMATERIALS\n\n--- PDF PAGE 126 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page122\nPHARMACY SERVICES NC III\nRecommended list of tools, equipment and materials for the training of a maximum of 25 trainees for\nPharmacy Services NC III are as follows:\nQTY.\nEQUIPMENT\nQTY.\nTOOLS/MATERIALS\nQTY.\nREFERENCES\n1 unit\nExecutive Table\n1 unit\nAV Equipment\n1 copy each\nConsumer Law, Environmental Law\n\nTables and Chairs\nfor 25 students\n1 unit\nSound System\n1 copy\nPharmacy Law (RA 5921)\n1 unit\nClerical Table\n1 unit\nInternet Connection\n1 copy\nGenerics Law (RA 6675)\n1 pc.\nWhiteboard\n1 unit\nAir-conditioning Unit\n1 copy\nTraditional Medicine\n1 unit\nCD of PowerPoint\npresentation\n1 unit\nHeat seal or press seal\nequipment\n1 copy\nCounterfeit Medicines Law (RA\n8203)\n1 unit\nLCD Projector\n25 each\nFormulary drugs/ non\nformulary drugs for\ndisplay and simulation\n5 copies\nDOH and FDA circulars related to\nretail pharmacy\n1 unit\nLaptop (for lecturer)\n\nWhite board marker and\neraser\n1 copy\nMedical dosage form and its\nabbreviations\n1 unit\nComputer for\nadministrative and\nclerical work\n1 set\nCleaning materials for\nworking, swabbing,\nsweeping, disinfecting,\nsoaking, sterilizing and or\ncleaning equipment\n1 copy each\nDrug information reference (MIMS,\nMIMS Pharmacy, Better Pharmacy)\n5 units\nComputer for\ntechnology\nresource center and\nclass demonstration\n1 unit\nBio-refrigerator (or\ncabinet that looks like a\nref inside)\n1 copy\nFIP Good Pharmacy Practice\nStandards\n1 unit\nTelephone (for\ninquiries)\n1 each\nHygrothermometer\n1 copy\nGood Laboratory Practice, Good\nManufacturing Practice, Good\nClinical Practice,\n\n1 unit\nTop loading balance\n1 copy\nPhilippine Practice Standard for\nPharmacists (PhilPSP)\n\n25 each\nSteel and porcelain\nspatulas\n1 copy\nPatient Benefit Scheme information\n\n5 each\nFiltration setup (funnel,\nfilter paper, stand)\n1 copy each\nSenior Citizen and Expanded\nSenior Citizen Act\n25\nStirring rod\n1 copy\nPrice Regulation Acts (MDRP)\n2 units\nMortar and pestle*\n1 copy\nDangerous Drug Act\n\nGraduated cylinder (100\nml, 10 ml)\n1 copy\nFood Drug and Cosmetics Act (RA\n3720)\n\nBeakers (500 ml, 250ml,\n100ml, 50ml)\n1 copy\nBFAD Strengthening (RA 9711)\n1 box\nGloves\n1 copy\nCheaper Quality Medicines Act\n1000\nRe-sealable plastics\n1 copy\nGenerics Menu Card\n5\nTablet counter\n1000\nBond Papers\n500\nLabeling materials\n500\nReferral forms\n5\nBubble pack\n1\nAluminum foils\n\n*Note: For demo purposes only\n\n3.5 TRAINING FACILITIES\n\n--- PDF PAGE 127 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page123\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\n\nStudent/Trainee Performance Space (S/TPS)\n\n5 x 8 m.\n\n40 sq. m.\nPharmacy simulation room (PSR)\n2 x 3 m.\n6 sq. m.\n\nTechnology Resource Center (TRC)\n\n2 x 5 m.\n\n10 sq. m.\n\nCirculation Area\n(S/TPS+PSR+TRC+CR) X 30%\n(40+6+10+10) X 30%=19.8sq.m.)\n\n20 sq. m.\n\nSeparate Restrooms for Male and Female Trainees/\nStudents (CR)\n\n2 x 5 m.\n\n10 sq. m.\n\nTotal Workshop Area\n\n86 sq. m.\nThe training center should have a simulation room of a pharmacy set-up (see Annex 1). The simulation room should\nhave shelves (see Annex 2) for display of products and a sink area at the minimum. This simulation room may be\nintegrated within the S/TPS. In addition to that, partnership may be forged with an operating pharmacy or existing\npharmacy drug store where Candidates can visit and observe.\n\n3.6 TRAINER’S QUALIFICATIONS FOR SERVICES SECTOR\n\nPHARMACY SERVICES NC III\nTRAINER QUALIFICATION\n\n•\nMust be a holder of NTTC I in Pharmacy Services NCIII\n•\nMust be a graduate of BS Pharmacy\n•\nMust have at least 2 years job / pharmacy industry experience"
