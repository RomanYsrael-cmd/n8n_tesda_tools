cy in relation to\nrelevant technology\n\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n• Access protocols and references on the\nuse of technology\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 110 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 106\n\nCOMMON COMPETENCIES\n(24Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n\n1. Maintain an\neffective relationship\nwith clients/\ncustomers\n\n1.1 Establish\nprofessional\nimage\n\n• Read the Philippine Pharmacist’s Code of\nEthics\n• Lecture-Discussion\n• Role play\n• Observation\n• Interview\n4 hrs\n• Read and understand the role of\npharmacy assistants in the pharmacy\n• Lecture\n• Interview\n• Read patient’s rights\n• Lecture-Discussion\n• Interview\n1.2 Build credibility\namong\ncustomers/clients\n\n• Establish confidence in interacting with\npatients\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Communicate properly with different\ntypes of patients, and of different\nnationalities\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Deliver correct information to the patient\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Provide exemplary customer service\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n1.3 Satisfy clients/\ncustomer\nrequirements\n\n• Attend to, and serve clients/patients\nbased on established SOP\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n• Solve simple problems encountered in\nserving patients\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n• Politely start