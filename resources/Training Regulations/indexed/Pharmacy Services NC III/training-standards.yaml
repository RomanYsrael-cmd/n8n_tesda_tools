    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: PHARMACY SERVICES\nNC Level: NC III\n\nNominal Training Duration:\n\nNo. of Hours\nCoverage\n 22\nBasic Competencies\n 24\nCommon Competencies\n802\nCore Competencies\n200\nIndustry Exposure\n1048\nTotal\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Pharmacy Services\nworkers in accordance to pharmacy practice standards. It covers the basic, common, and core\ncompetencies in PHARMACY SERVICES NCIII.\n\nTo obtain this, an individual must achieve the basic, common and core competencies, and\ncomplete the on-the-job training prescribed for this qualification.\n\nThe training center has the option can enter into a memorandum of agreement with an existing\ngovernment health units, retail pharmacy (community, hospital, institutional), or pharmaceutical\nmanufacturing facility for the enhancement of the didactic training for the facilities and equipment to\nbe used. A separate provision may be included for the industry exposure.\n\n--- PDF PAGE 106 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 102\n\nBASIC COMPETENCIES\n\n22hrs\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n\n1. Lead workplace\ncommunication\n\n1.1. Communicate\ninformation\nabout\nworkplace\nprocesses.\n• Display communications skills using\nverbal, written, wireless, non-verbal\n(standard signs and symbols of the\nindustry) media\n• Lecture-Discussion\n• Role play\n• Observation\n• Interview\n4 hrs\n• Read policies and procedures in\nstandard operating protocols\n• Lecture\n• Interview\n1.2. Lead workplace\ndiscussions.\n\n• Demonstrate interpersonal relations in\ndiscussing with superiors, colleagues,\nand/or subordinates\n• Lecture-Discussion\n• Small group activities\n\n• Observation\n\n• Demonstrate people management skills\n• Lecture-Discussion\n•Small group activities\n• Observation\n\n• Facilitate discussion among colleagues\n• Lecture-Discussion\n• Small group activities\n• Observation\n\n1.3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n\n• Apply safety procedures in handling\nequipment and machinery, waste,\nenvironment, volatile fluids and gases.\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Observation\n\n• Apply health and hygiene practices\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n2. Lead small\nteams\n2.1. Lead small\nteams\n• Learn concepts on people management\n• Lecture-Discussion\n• Small group activities’\n•Brainstorming\n• Observation\n4 hrs\n\n• Apply oral and written communication\nskills in dealing with other team\nmembers\n• Lecture-Discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n2.2. Provide team\nleadership\n• Conduct team building activities as\nnecessary\n• Lecture-Discussion\n• Small group activities\n• Observation\n2.3 Assign\nresponsibilities\n• Delegate tasks to other members of the\nteam\n• Small group activities\n• Lecture-Discussion\n\n• Observation\n\n--- PDF PAGE 107 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 103\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\namong\nmembers\n\n• Relay instructional strategies and\nmethodologies\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n2.4 Set performance\nexpectation for\nteam members\n• Inform subordinates on performance\ncriteria that will be observed\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n2.5 Supervise team\nperformance\n• Establish facilitation skills\n• Small group activities\n•Lecture-Discussion\n• Observation\n• Apply presentation skills as necessary\n• Individual/Small group\nactivities\n• Lecture-Discussion\n• Demonstration with oral\nquestioning\n• Translate ideas and concepts into\nimplementable activities in pharmacy\nservices\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning`\n3. Develop and\npractice\nnegotiation skills\n6.1\nIdentify relevant\ninformation in\nplanning\nnegotiations\n• Obtain necessary information regarding\nthe issue\n• Small group activities\n• Lecture-Discussion\n\n• Observation\n4 hrs\n6.2\nParticipate in\nnegotiations\n• Apply different questioning techniques\n• Small group activities\n• Lecture-Discussion\n• Observation\n• Use appropriate language during\nnegotiation\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n\n• Address and implement problem solving\nstrategies on dealing with unexpected\nquestions and attitudes during\nnegotiation\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n\n6.3\nDocument\nareas for\nagreement\n• Document issues and processes\n• Lecture-discussion\n• Simulation/role playing\n• Demonstration with oral\nquestioning\n• Explore different solutions that may be\nused\n• Direct observation\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 108 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 104\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n• Written documents are filed and kept for\nfuture reference\n• Direct observation\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n• Follow-up on agreements based on\ndeadlines\n• Demonstration\nwith\nreturn demonstration\n• Observation\n6.4\nIdentify relevant\ninformation in\nplanning\nnegotiations\n• Search for relevant information on\ncompeting products and services\n• Lecture-discussion\n• Simulation/role playing\n• Demonstration with oral\nquestioning\n• Written Exams\n6.5\nParticipate in\nnegotiation\n• Deal with patients/clients/ service\nproviders according to agreements\ndiscussed\n• Lecture-discussion\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n4. Solve workplace\nproblem related\nto work activities\n4.1 Explain the\nanalytical\ntechniques\n• Manage and control flow of resources\n• Lecture-discussion\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n4 hrs\n• Identify cause and potential effects\n• Lecture-discussion\n• Brainstorming\n• Demonstration with oral\nquestioning\n4.2 Determine the\npossible\ncause/s of the\nproblem\n• Identify deviations from normal\noperating procedures to maintain\nproduct quality\n• Lecture-discussion\n• Case Discussion\n• Demonstration with oral\nquestioning\n• Written Output\n• Participate in root cause analysis\nsession and state problems clearly\n• Lecture-discussion\n• Case Discussion\n• Demonstration with oral\nquestioning\n• Apply problem analysis and problem\nsolving techniques\n• Lecture-discussion\n• Small-group activity\n• Demonstration with oral\nquestioning\n4.3 Prepare action\nplans\n• Corrective actions are determined\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n• Establish action plans based on\navailable options\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n• Identify mathematical techniques to be\nused in the task at hand\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n4 hrs\n• Develop skills in four fundamental\noperations\n• Lecture\n• Exercises\n• Written Exercise\n\n--- PDF PAGE 109 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 105\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n\n• Use calculator or computer for\ncalculating cash change\n• Demonstration with\nreturn demonstration\n•Small-group activities\n• Demonstration with oral\nquestioning\n\n5.2 Apply\nmathematical\nprocedures/soluti\non\n• Use mathematical tools and standard\nformulas\n\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n•Written Exam\n• Use conversion formulas\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n•Written Exams\n• Ensure precisions and accuracy of\nresults\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n•Written Exam\n5.3 Analyze results\n• Analyze and interpret the results based\non specified requirements\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n• Communicate the results of the analysis\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n• Appropriate action is applied in case of\nerror\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n6. Use relevant\ntechnologies\n6.1 Identify\nappropriate\ntechnology\n\n• Follow protocols in the use of basic\nequipment used in the pharmacy\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n2 hrs\n• Use relevant technology to transmit\ndata\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n6.2 Apply relevant\ntechnology\n\n• Use software programs in computers,\nmachines/equipment being used\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n6.3 Maintain/enhance\nrelevant\ntechnology\n• Follow company policy in relation to\nrelevant technology\n\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n• Access protocols and references on the\nuse of technology\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 110 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 106\n\nCOMMON COMPETENCIES\n(24Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLea