  "source_section_text": "SECTION 3 TRAINING ARRANGEMENT\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for PHARMACY SERVICES NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PHARMACY SERVICES\nNC Level: NC III\n\nNominal Training Duration:\n\nNo. of Hours\nCoverage\n 22\nBasic Competencies\n 24\nCommon Competencies\n802\nCore Competencies\n200\nIndustry Exposure\n1048\nTotal\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Pharmacy Services\nworkers in accordance to pharmacy practice standards. It covers the basic, common, and core\ncompetencies in PHARMACY SERVICES NCIII.\n\nTo obtain this, an individual must achieve the basic, common and core competencies, and\ncomplete the on-the-job training prescribed for this qualification.\n\nThe training center has the option can enter into a memorandum of agreement with an existing\ngovernment health units, retail pharmacy (community, hospital, institutional), or pharmaceutical\nmanufacturing facility for the enhancement of the didactic training for the facilities and equipment to\nbe used. A separate provision may be included for the industry exposure.\n\n--- PDF PAGE 106 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 102\n\nBASIC COMPETENCIES\n\n22hrs\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n\n1. Lead workplace\ncommunication\n\n1.1. Communicate\ninformation\nabout\nworkplace\nprocesses.\n• Display communications skills using\nverbal, written, wireless, non-verbal\n(standard signs and symbols of the\nindustry) media\n• Lecture-Discussion\n• Role play\n• Observation\n• Interview\n4 hrs\n• Read policies and procedures in\nstandard operating protocols\n• Lecture\n• Interview\n1.2. Lead workplace\ndiscussions.\n\n• Demonstrate interpersonal relations in\ndiscussing with superiors, colleagues,\nand/or subordinates\n• Lecture-Discussion\n• Small group activities\n\n• Observation\n\n• Demonstrate people management skills\n• Lecture-Discussion\n•Small group activities\n• Observation\n\n• Facilitate discussion among colleagues\n• Lecture-Discussion\n• Small group activities\n• Observation\n\n1.3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n\n• Apply safety procedures in handling\nequipment and machinery, waste,\nenvironment, volatile fluids and gases.\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Observation\n\n• Apply health and hygiene practices\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n2. Lead small\nteams\n2.1. Lead small\nteams\n• Learn concepts on people management\n• Lecture-Discussion\n• Small group activities’\n•Brainstorming\n• Observation\n4 hrs\n\n• Apply oral and written communication\nskills in dealing with other team\nmembers\n• Lecture-Discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n2.2. Provide team\nleadership\n• Conduct team building activities as\nnecessary\n• Lecture-Discussion\n• Small group activities\n• Observation\n2.3 Assign\nresponsibilities\n• Delegate tasks to other members of the\nteam\n• Small group activities\n• Lecture-Discussion\n\n• Observation\n\n--- PDF PAGE 107 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 103\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\namong\nmembers\n\n• Relay instructional strategies and\nmethodologies\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n2.4 Set performance\nexpectation for\nteam members\n• Inform subordinates on performance\ncriteria that will be observed\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n2.5 Supervise team\nperformance\n• Establish facilitation skills\n• Small group activities\n•Lecture-Discussion\n• Observation\n• Apply presentation skills as necessary\n• Individual/Small group\nactivities\n• Lecture-Discussion\n• Demonstration with oral\nquestioning\n• Translate ideas and concepts into\nimplementable activities in pharmacy\nservices\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning`\n3. Develop and\npractice\nnegotiation skills\n6.1\nIdentify relevant\ninformation in\nplanning\nnegotiations\n• Obtain necessary information regarding\nthe issue\n• Small group activities\n• Lecture-Discussion\n\n• Observation\n4 hrs\n6.2\nParticipate in\nnegotiations\n• Apply different questioning techniques\n• Small group activities\n• Lecture-Discussion\n• Observation\n• Use appropriate language during\nnegotiation\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n\n• Address and implement problem solving\nstrategies on dealing with unexpected\nquestions and attitudes during\nnegotiation\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n\n6.3\nDocument\nareas for\nagreement\n• Document issues and processes\n• Lecture-discussion\n• Simulation/role playing\n• Demonstration with oral\nquestioning\n• Explore different solutions that may be\nused\n• Direct observation\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 108 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 104\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n• Written documents are filed and kept for\nfuture reference\n• Direct observation\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n• Follow-up on agreements based on\ndeadlines\n• Demonstration\nwith\nreturn demonstration\n• Observation\n6.4\nIdentify relevant\ninformation in\nplanning\nnegotiations\n• Search for relevant information on\ncompeting products and services\n• Lecture-discussion\n• Simulation/role playing\n• Demonstration with oral\nquestioning\n• Written Exams\n6.5\nParticipate in\nnegotiation\n• Deal with patients/clients/ service\nproviders according to agreements\ndiscussed\n• Lecture-discussion\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n4. Solve workplace\nproblem related\nto work activities\n4.1 Explain the\nanalytical\ntechniques\n• Manage and control flow of resources\n• Lecture-discussion\n• Simulation/role\nplaying\n• Demonstration with oral\nquestioning\n\n4 hrs\n• Identify cause and potential effects\n• Lecture-discussion\n• Brainstorming\n• Demonstration with oral\nquestioning\n4.2 Determine the\npossible\ncause/s of the\nproblem\n• Identify deviations from normal\noperating procedures to maintain\nproduct quality\n• Lecture-discussion\n• Case Discussion\n• Demonstration with oral\nquestioning\n• Written Output\n• Participate in root cause analysis\nsession and state problems clearly\n• Lecture-discussion\n• Case Discussion\n• Demonstration with oral\nquestioning\n• Apply problem analysis and problem\nsolving techniques\n• Lecture-discussion\n• Small-group activity\n• Demonstration with oral\nquestioning\n4.3 Prepare action\nplans\n• Corrective actions are determined\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n• Establish action plans based on\navailable options\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n• Identify mathematical techniques to be\nused in the task at hand\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n4 hrs\n• Develop skills in four fundamental\noperations\n• Lecture\n• Exercises\n• Written Exercise\n\n--- PDF PAGE 109 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 105\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\nDuration\n\n• Use calculator or computer for\ncalculating cash change\n• Demonstration with\nreturn demonstration\n•Small-group activities\n• Demonstration with oral\nquestioning\n\n5.2 Apply\nmathematical\nprocedures/soluti\non\n• Use mathematical tools and standard\nformulas\n\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n•Written Exam\n• Use conversion formulas\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n•Written Exams\n• Ensure precisions and accuracy of\nresults\n• Lecture-discussion\n• Demonstration with oral\nquestioning\n•Written Exam\n5.3 Analyze results\n• Analyze and interpret the results based\non specified requirements\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n• Communicate the results of the analysis\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n• Appropriate action is applied in case of\nerror\n• Lecture-discussion\n\n• Demonstration with oral\nquestioning\n6. Use relevant\ntechnologies\n6.1 Identify\nappropriate\ntechnology\n\n• Follow protocols in the use of basic\nequipment used in the pharmacy\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n2 hrs\n• Use relevant technology to transmit\ndata\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n6.2 Apply relevant\ntechnology\n\n• Use software programs in computers,\nmachines/equipment being used\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n6.3 Maintain/enhance\nrelevant\ntechnology\n• Follow company policy in relation to\nrelevant technology\n\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n• Access protocols and references on the\nuse of technology\n• Lecture-discussion\n• Individual/Group\nAssignments\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 110 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 106\n\nCOMMON COMPETENCIES\n(24Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n\n1. Maintain an\neffective relationship\nwith clients/\ncustomers\n\n1.1 Establish\nprofessional\nimage\n\n• Read the Philippine Pharmacist’s Code of\nEthics\n• Lecture-Discussion\n• Role play\n• Observation\n• Interview\n4 hrs\n• Read and understand the role of\npharmacy assistants in the pharmacy\n• Lecture\n• Interview\n• Read patient’s rights\n• Lecture-Discussion\n• Interview\n1.2 Build credibility\namong\ncustomers/clients\n\n• Establish confidence in interacting with\npatients\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Communicate properly with different\ntypes of patients, and of different\nnationalities\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Deliver correct information to the patient\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Observation\n\n• Provide exemplary customer service\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n1.3 Satisfy clients/\ncustomer\nrequirements\n\n• Attend to, and serve clients/patients\nbased on established SOP\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n• Solve simple problems encountered in\nserving patients\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n• Politely start, carry out, and finish\nconversation with clients\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Oral/Written Test\n• Demonstration with oral\nquestioning\n• Treat clients/patients with respect\n• Lecture-Discussion\n• Demonstration\n• Oral/Written Test\n• Observation\n\n--- PDF PAGE 111 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 107\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n2. Update industry\nknowledge and\npractice through\ncontinuing\neducation\n2.1 Identify sources\nof information on\nupdates related\nto practice of\npharmacy\n• Access relevant and updated references\n• Lecture-Discussion\n• Small group activities’\n\n• Demonstration with oral\nquestioning\n• Oral/Written Test\n•Observation\n4 hrs\n• Correctly operate computer hardware and\nselected software\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n•Observation\n2.2 Apply industry\nupdates to\nworkplace\n• Follow new protocols to adhere to\nindustry updates\n• Lecture-Discussion\n• Demonstration\n• Demonstration with oral\nquestioning\n•Observation\n2.3 Update\ncontinuously\nrelevant industry\nknowledge\n\n• Attend seminars relevant and related to\nduties and responsibilities\n• Lecture-Discussion\n• Small group activities\n• Demonstration with oral\nquestioning\n\n• Identify and read references for self-\ndirected learning\n• Small group activities\n• Interview\n• Aim for continuous personal development\n• Individual assignment\n• Interview\n2.4 Access, apply and\nshare industry\ninformation\n• Prepare short presentation/report from\nthe learnings obtained in seminar\n• Lecture-Discussion\n• Individual/Group\nassignment\n• Demonstration with oral\nquestioning\n\n3. Perform\nworkplace\nsecurity and\nsafety practices\n3.1 Identify and follow\nworkplace\nprocedures\n• Follow health, safety and security\nprotocols\n• Small group activities\n• Lecture-Discussion\n\n• Demonstration with oral\nquestioning\n• Written Exam\n4hrs\n3.2 Handle emergency\nsituations within\nworkplace\n• Identify different types of emergency\nsituations and act accordingly\n• Lecture-Discussion\n• Emergency drills (fire,\nterrorist attack, robbery)\n• Demonstration with oral\nquestioning\n• Written Exam\n\n• Lead patients and colleagues to safety\n• Small group activities\n• Lecture-Discussion\n• Demonstration with oral\nquestioning\n\n3.3 Follow enterprise\nrequirements\n• Read and comply with enterprise goals,\ntargets and measures\n\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n• Use enterprise information systems and\ndata collation based on protocols\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 112 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 108\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n4. Perform\ncomputer\noperations\n\n4.1 Identify and\nexplain the\nfunctions, general\nfeatures and\ncapabilities of\nboth hardware\nand software\n• Identify main parts of a computer\n\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n6 hrs\n• Operate the computer from turning on to\nturning the equipment\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n4.2 Prepare and use\nappropriate\nhardware and\nsoftware\naccording to task\nrequirement\n• Use the company software to process\nordering and issuing receipt\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Encode pertinent patient information and\nprescribed medicines\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Use the internet-browser to access\ninformation\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n4.3 Use appropriate\ndevices and\nprocedures to\ntransfer files/data\n• Use new or formatted USB to transfer\ndata\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n4.4 Produce accurate\nand complete data\naccording to the\nrequirements\n• Process entered data into meaningful\ninformation using relevant software\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Print data according to SOP\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n4.5 Maintain\ncomputer system\n• Troubleshoot in case of virus infection\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Clean regularly to avoid accumulation of\ndust\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 113 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 109\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\n(Proposed)\nAssessment Approach\n(Proposed)\nNominal\n Duration\n5. Use\npharmaceutical\ncalculation\ntechniques and\nterminologies\n5.1 Use dimensional\nanalysis to\nconvert one unit\nto another\n• Read and familiarize with dimensional\nanalysis in conversion\n\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n6 hrs\n• Apply dimensional analysis in conversion\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Read and familiarize with mathematical\nconcepts\n• Apply mathematical concepts in English\nand Metric System of Measurement\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Apply mathematical concepts in English\nand Metric System of Measurement\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Read and familiarize with ratio and\nproportion\n\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Apply ratio and proportion\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n5.2 Understand\npharmaceutical\nterminologies and\nmedical terms\n• Read and familiarize with pharmaceutical\nterminologies and medical terms\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Apply pharmaceutical terminologies and\nmedical terms\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n5.3 Use equipment,\nglassware and\ntools\n• Read and familiarize with equipment,\nglassware and tools\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n• Operate equipment, use glassware and\ntools\n• Lecture-Discussion\n• Demonstration with\nreturn demonstration\n• Demonstration with oral\nquestioning\n\n--- PDF PAGE 114 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 110\n\nCORE COMPETENCIES\n802 hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n1. Practice Good\nHousekeeping\n1.1 Perform\nhousekeeping\nduties\n\n• Apply good storage practices in the\nfacility\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n24 hours\n• Apply good compounding practices in\nmaintaining compounding/sterile area\nand premises\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with\noral questioning\n• Practice good laboratory practice\nprinciples in cleaning work area and\npremises\n• Lecture discussion\n• Demonstration\n• Written Exam\n• Demonstration with\noral questioning\n• Perform daily housekeeping tasks\nusing appropriate procedures\n• Lecture discussion\n• Demonstration\n• Demonstration with\noral questioning\n•Observation\n• Clean floors to ensure its not dirty or\nslippery\n• Demonstration\n• Demonstration with\noral questioning\n•\nObservation\n• Organize and regularly clean\nhousekeeping tools\n• Demonstration\n• Observation\n• Read and follow pest control protocols\nand schedules\n• Lecture\n• Demonstration\n• Demonstration with\noral questioning\n• Prepare inventory reports on house\ncleaning tools, materials, supplies and\nequipment\n• Lecture\n• Demonstration\n• Demonstration with\noral questioning\n• Fill out different types of daily\nmaintenance records\n• Demonstration\n• Demonstration with\noral questioning\n• Compliance to hygienic practices\n\n• Lecture\n• Demonstration\n• Demonstration with\noral questioning\n• Follow patient safety and employee\nsafety protocols\n• Lecture\n• Demonstration\n• Written Exam\n• Demonstration with\noral questioning\n\n--- PDF PAGE 115 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 111\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n1.2 Follow\nappropriate health\nand safety\npractices in the\narea\n\n• Adhere to occupational Safety and\nHealth Standards\n• Lecture discussion\n\n• Written Exam\n• Demonstration with\noral questioning\n\n• Comply to DOH Sanitation Guidelines\n• Lecture discussion\n\n• Written Exam\n• Demonstration with\noral questioning\n• Follow dispensing area protocols\n\n• Lecture\n• Demonstration with return\ndemonstration\n• Written Exam\n• Demonstration with\noral questioning\n2. Monitor\nsupply/inventory of\npharmaceutical\nproducts\n2.1 Examine the\nmedicines in the\nassortment list or\nformulary\n\n• Familiarize stock keeping units in the\nformulary or assortment list\n• Lecture\n• Demonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n60 hrs\n• Identify fast-moving and slow moving\nproducts using turn-over rate\n• Lecture\n• Exercises\n• Written Exam\n• Demonstration with oral\nquestioning\n• Handle and record inquiries on unserved\nproducts\n• Lecture\n• Demonstration with return\ndemonstration\n\n• Demonstration with oral\nquestioning\n2.2 Assist in\nprocurement of\nmaterials and\nservices from\nqualified sources\n\n• Request minimum documentation\nrequirements from suppliers\n• Lecture\n• Demonstration with return\ndemonstration\n• Written Exam\n• Demonstration with oral\nquestioning\n• Prepare purchase request\n• Demonstration with return\ndemonstration\n• Demonstration with oral\nquestioning\n• Follow protocols when counterfeit\nproducts are received\n• Lecture discussion\n• Demonstration and return\ndemonstration\n•Problem based discussion\n• Demonstration with oral\nquestioning\n• Case discussion\n• Communicate procurement needs to\ninventory manager/analyst or pharmacist\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n• Case discussion\n\n--- PDF PAGE 116 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 112\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology (Proposed)\nAssessment Approach\n(Proposed)\nNominal Duration\n\n2.3 Receive and\ndeliver stocks\n\n• Update and manage stock\ninventory/data\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Check delivery specifications if\ncompliant to good distribution practices\n• Lecture discussion\n• Demonstration and return\ndemonstration\n• Demonstration with oral\nquestioning\n\n• Check delivery receipt as against to the\nactual products received\n• Lecture discussion\n• Dem