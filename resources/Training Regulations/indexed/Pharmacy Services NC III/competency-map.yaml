  "source_text": "COMPETENCY MAP – HEALTH CARE SECTOR (PHARMACY SERVICE NCIII)\n\nBASIC COMPETENCIES\n\nLead Workplace\nCommunication\nLead small teams\nDevelop and\nPractice\nNegotiation Skills\nSolve Problems\nRelated to Work\nActivities\nUse Mathematical\nConcepts and\nTechniques\nUse Relevant\nTechnologies\n\nCOMMON COMPETENCIES\n\nMaintain an\neffective\nrelationship with\nclients/customers\nUpdate industry\nknowledge and\npractice through\ncontinuing\nprofessional\ndevelopment\nPerform workplace\nsecurity and safety\npractices\nPerform computer\noperations\n\nUse Pharmaceutical\nCalculation\nTechniques And\nTerminologies\n\nCORE COMPETENCIES\n\nPerform general\nhousekeeping\nMonitor\nsupply/inventory of\npharmaceutical\nproducts\nHandle and control\npharmaceutical\nproducts\nArrange and\ndisplay\npharmaceutical\nproducts\nPerform good\nlaboratory practices\nAdhere to good\nmanufacturing\npractices (GMP)\nDemonstrate\nproduct\nknowledge on\nmedicines\nDispense\npharmaceutical\nproducts\nPerform health\npromotion,\neducation and\nvigilance\n\n--- PDF PAGE 131 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page127\nDEFINITON OF TERMS\n\n1. Adverse Drug Reactions - refers to a response to a drug which is noxious, unintended, and which occurs at doses\nnormally used in man for the prophylaxis, diagnosis, or therapy of disease, or for the modification of physiological\nfunction.\n2. Adverse Event - Any untoward medical occurrence in a patient or clinical investigation subject administered with the\npharmaceutical product that does not necessarily have causal relationship with the treatment for which the product\nis used; any unfavorable and unintended sign (including an abnormal laboratory finding), symptom or disease\ntemporarily associated with the use of the medicinal (investigational) product, whether or not considered related to\nthe medicinal (investigational) product\n3. Dispensing –refers to the process of preparing and giving medicine to named person on the basis of a prescription.\nIt involves the correct interpretation of the prescription prepared by a prescriber and labeling of medicine for use\nby the patient.\n4. Distribution - The division and movement of pharmaceutical products from the premises of the manufacturer\nof such products, or another central point, to the end user thereof, or to an intermediate point\nby means of various transport methods, via various storage and/or health establishments. It is\nthe procuring, purchasing, holding, storing, selling, supplying, importing, exporting, or movement\nof pharmaceutical products, with the exception of the dispensing or providing pharmaceutical\nproducts directly to a patient or his or her agent.\n5. Housekeeping – routine maintenance of the pharmacist’s shop\n6. Stock – goods stored in a pharmacist’s shop\n7. Dose Administration Containers – receptacles of medicines for administration\n8. Drug – any chemical compound or biological substance, other than food, intended for use in the treatment, prevention\nor diagnosis of disease in a man or animals\n9. Generic Menu Card – a list of generic medicines carried by the pharmacy or in accordance with the law\n10. Label - a slip of paper, cloth, metal attached to anything to provide information about its nature, contents, ownership\n11. Medication – a drug or other substance that is used as a medicine\n12. Merchandising plan - A systematic approach aimed at maximizing return on investment, through planning sales\nand inventory in order to increase profitability\n13. Orders – arrangements, method, a request to supply something\n14. Planogram - a diagram that shows how and where specific retail products should be placed on retail shelves or\ndisplays in order to increase customer purchases.\n15. Pharmaceutical Products –medicines or drugs\n16. Pharmacy – is the professional practice of discovering, preparing, dispensing, monitoring, and educating about\ndrugs.\n17. Pharmacist – means any person who is registered and entitled under the laws of Philippines to practice the\nprofession of pharmacy.\n18. Pharmacovigilance - the process of monitoring, assessing or evaluating and improving the safety of drug products\ncarried out by pharmaceutical companies on their products and by government agencies on all drug products. It is\nalso the science and activities relating to the detection, assessment, understanding and prevention of adverse\neffects or any other drug-related problems\n19. Pharmacy Services -Service or group of services rendered to the sale of a pharmaceutical product from a drug\nretailer; provision of pharmaceutical care by a member of the pharmacy workforce as an inseparable part of\nproviding health care\n20. Post-marketing surveillance - The close observation of drug effects, whether adverse or beneficial, following the\nmarketing of a drug product; continued monitoring of safety after a pharmaceutical product or medical device has\nbeen placed on the market\n21. Prescription – is the written order and instruction of a validly-registered physician, dentist or veterinarian for the\nuse of a specific drug product for a specific patient or, the doctor’s order on the patient’s chart for the use of specific\ndrug(s)\n22. Products for return – products that were received by the distributor/retail store from the principal but were found to\nbe either expired or near-expiry, damaged, defective products from the manufacture, expiration date outside of the\nrequired period upon delivery, phased out, deleted, or recalled\n23. Returned products– products that were already dispensed to the patient and returned to the pharmacy\n24. Self-care - is what people do for themselves to establish and maintain health, prevent and deal with illness.\n25. Standard operating procedure - An authorized, written procedure giving instructions for performing operations not\nnecessarily specific to a given product but of a more general nature\n26. Stock – goods on hand\n27. Stock Control– checking / regulation of goods on hand\n28. Waste Disposal – disposing of rubbish, trash, junks\n\n--- PDF PAGE 132 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page128\n\nAnnex 1: Pharmacy Simulation Room (Top View)\n\nWritten Exam\n\nDispensing Counter\nCompounding area\nSink\n\nCabinet/Display Rack\n(Annex 2)\nChair\n18 inches\n44 inches\n16 inches\n118 inches\n\n--- PDF PAGE 133 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page129\n\nAnnex 2: Pharmacy Display Rack/Cabinet with sample pharmaceutical\nproducts and proper labeling\n\n18inches\n10inches\n72inches\n10inches\n22inches\n10inches\n10inches\n10inches\n36inches\n\n--- PDF PAGE 134 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page130",
