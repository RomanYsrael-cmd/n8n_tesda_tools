  "source_text": "SECTION 1 PHARMACY SERVICES NC III QUALIFICATION\n\nThe PHARMACY SERVICES NC III Qualification consists of competencies that a person\nmust achieve to perform general housekeeping, monitor the supply/inventory of\npharmaceutical products, Handle and control pharmaceutical products, Arrange and\ndisplay pharmaceutical products, Perform good laboratory practices, Dispense\npharmaceutical products, Demonstrate product knowledge on medicines, Perform health\npromotion education, vigilance and adhere to good manufacturing practices.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n500311109\nLead Workplace Communication\n500311110\nLead small teams\n500311111\nDevelop and Practice Negotiation Skills\n500311112\n500311113\n500311114\nSolve Problems Related to Work Activities\nUse Mathematical Concepts and Techniques\nUse Relevant Technologies\nUNIT CODE\nCOMMON COMPETENCIES\nHCS245201\nMaintain an effective relationship with clients/customers (marketing)\nHHC532201\nTRS311204\nTRS311203\nHHC532202\nUpdate industry knowledge and practice through continuing education\nPerform workplace security and safety practices\nPerform computer operations\nUse pharmaceutical calculation techniques and terminologies\n\nHHC532301\nCORE COMPETENCIES\nPractice good housekeeping\nHHC532302\nMonitor supply/inventory of pharmaceutical products\nHHC532303\nHandle and control pharmaceutical products\nHHC532304\nHHC532305\nHHC532306\nHHC532307\nHHC532308\nHHC532309\nArrange and display pharmaceutical products\nPerform good laboratory practices\nAdhere to good manufacturing practices\nDemonstrate product knowledge on medicines\nDispense pharmaceutical products\nPerform health promotion education, vigilance\n\nA person who has achieved this Qualification is competent to be:\n Pharmacy Assistant\n\n--- PDF PAGE 6 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 2"
