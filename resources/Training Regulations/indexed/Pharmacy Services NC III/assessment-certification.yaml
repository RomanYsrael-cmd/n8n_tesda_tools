  "arrangements": [
    {
      "number": "4.1",
      "text": "To attain the National Qualification of PHARMACY SERVICES NC III the candidate must demonstrate competence in all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate by the TESDA Director General."
    },
    {
      "number": "4.2",
      "text": "Assessment shall focus on the units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.3",
      "text": "The following are qualified to apply for assessment and certification (should comply to at least one): 4.3.1 Graduates of Pharmacy Services NC III program; 4.3.2 Graduates of formal, non-formal and informal including enterprise-based training programs. 4.3.3 BS Pharmacy degree program holders; 4.3.4 Pharmacy Services NC II holder with relevant experience; and 4.3.5 Experienced workers (wage employed or self-employed) of at least 3 years."
    },
    {
      "number": "4.4",
      "text": "Individuals who shall be eligible to apply for assessment without enrollment to Pharmacy Services NC III (criteria 4.3.2-4.3.5) must undergo initial assessment by submitting a portfolio. Portfolio assessment must be composed of the following requirements, as applicable to the Candidate. The documents should include the following: 4.4.1 Resume or curriculum vitae with detailed description of duties and responsibilities 4.4.2 Certificate/Diploma of formal, non-formal and informal education. 4.4.3 Certificate of employment of at least 3 years in the field where they are applying for certification – hospital, community pharmacy, manufacturing or laboratory support; 4.4.4 Certificates of Training from employers (in the past 5 years); 4.4.5 Certificate of Awards and Recognition (in the past 5 years); and"
    },
    {
      "number": "4.5",
      "text": "A candidate who passed portfolio assessment and gone through the National Assessment, and failed the examination (either written or practical), must undergo complete training of Pharmacy Services NCIII. 4.5.1 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course on the competencies failed based on the result of the assessment before taking another assessment. The candidate will retake the failed competencies (specific station/s) only."
    },
    {
      "number": "4.6",
      "text": "A candidate who took the training Pharmacy Services NCIII and failed the examination, may again retake the exam. However, if the candidate fails the second time, a refresher course will be required to be taken before they are allowed to take the exam again."
    },
    {
      "number": "4.7",
      "text": "The refresher course will be comprised of unit competencies the candidate had failed. After completing the refresher course, the candidate may take the exam of the specific competencies."
    },
    {
      "number": "4.8",
      "text": "For the renewal of National Certificate for Pharmacy Services NCIII valid for 3 years, the Pharmacy Assistant has to comply the following requirement: 4.8.1 Has attended relevant Continuing Education/ training program for a total of 18 hours in 3 years by TESDA-accredited training provider approved by National Monitoring Training Council. TR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page125"
    },
    {
      "number": "4.9",
      "text": "Only accredited competency assessors are allowed to conduct competency assessment, however trainers who are accredited competency assessors are not allowed to assess their trainees."
    },
    {
      "number": "4.10",
      "text": "Assessment of competence must be undertaken only in the TESDA accredited assessment center. The performance assessment (demonstration of competence), however, may be done in any venue or workplace duly designated by an accredited assessment center."
    },
    {
      "number": "4.11",
      "text": "The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification. TR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page126"
    }
  ],
  "source_text": "SECTION 4\n ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n--- PDF PAGE 128 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page124\n\n4.1 To attain the National Qualification of PHARMACY SERVICES NC III the candidate must\ndemonstrate competence in all the units of competency listed in Section 1. Successful\ncandidates shall be awarded a National Certificate by the TESDA Director General.\n\n4.2 Assessment shall focus on the units of competency. The basic and common units shall be\nintegrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification (should comply to at least\none):\n\n4.3.1 Graduates of Pharmacy Services NC III program;\n4.3.2 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n4.3.3 BS Pharmacy degree program holders;\n4.3.4 Pharmacy Services NC II holder with relevant experience; and\n4.3.5 Experienced workers (wage employed or self-employed) of at least 3 years.\n\n4.4 Individuals who shall be eligible to apply for assessment without enrollment to Pharmacy\nServices NC III (criteria 4.3.2-4.3.5) must undergo initial assessment by submitting a portfolio.\nPortfolio assessment must be composed of the following requirements, as applicable to the\nCandidate. The documents should include the following:\n\n4.4.1 Resume or curriculum vitae with detailed description of duties and responsibilities\n4.4.2 Certificate/Diploma of formal, non-formal and informal education.\n4.4.3 Certificate of employment of at least 3 years in the field where they are applying for\ncertification – hospital, community pharmacy, manufacturing or laboratory support;\n4.4.4 Certificates of Training from employers (in the past 5 years);\n4.4.5 Certificate of Awards and Recognition (in the past 5 years); and\n\n4.5 A candidate who passed portfolio assessment and gone through the National Assessment, and\nfailed the examination (either written or practical), must undergo complete training of Pharmacy\nServices NCIII.\n\n4.5.1 A candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course on the competencies failed based on the result of the\nassessment before taking another assessment. The candidate will retake the failed\ncompetencies (specific station/s) only.\n\n4.6 A candidate who took the training Pharmacy Services NCIII and failed the examination, may\nagain retake the exam. However, if the candidate fails the second time, a refresher course will\nbe required to be taken before they are allowed to take the exam again.\n\n4.7 The refresher course will be comprised of unit competencies the candidate had failed. After\ncompleting the refresher course, the candidate may take the exam of the specific\ncompetencies.\n\n4.8 For the renewal of National Certificate for Pharmacy Services NCIII valid for 3 years, the\nPharmacy Assistant has to comply the following requirement:\n\n4.8.1 Has attended relevant Continuing Education/ training program for a total of 18 hours\nin 3 years by TESDA-accredited training provider approved by National Monitoring\nTraining Council.\n\n--- PDF PAGE 129 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page125\n4.9 Only accredited competency assessors are allowed to conduct competency assessment,\nhowever trainers who are accredited competency assessors are not allowed to assess their\ntrainees.\n\n4.10 Assessment of competence must be undertaken only in the TESDA accredited assessment\ncenter. The performance assessment (demonstration of competence), however, may be done\nin any venue or workplace duly designated by an accredited assessment center.\n\n4.11 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification.\n\n--- PDF PAGE 130 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page126\n\n"
}
