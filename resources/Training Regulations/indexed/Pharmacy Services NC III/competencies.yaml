        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1\nSelected and used hardware components correctly and\naccording to the task requirement\n1.2 Used basic software applications to create new files and\ndocuments\n1.3 Produced accurate and complete data in accordance with the\nrequirements\n1.4 Used appropriate devices and procedures to transfer files/data\naccurately\n1.5 Used basic functions of a www-browser to locate information.\n2. Method of\nassessment\nThe assessor may select two of the following assessment methods\nto objectively assess the candidate:\n2.1 Direct Observation and Oral Questioning\n2.2 Practical demonstration\n3. Resource\nimplication\n3.1 Computer hardware with peripherals\n3.2 Appropriate software\n4. Context of\nAssessment\nAssessment may be conducted in the workplace or in a simulated\nenvironment\n\n--- PDF PAGE 50 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 46\nUNIT OF COMPETENCY :\nUSE PHARMACEUTICAL CALCULATION\nTECHNIQUES AND TERMINOLOGIES\n\nUNIT CODE\n:"
