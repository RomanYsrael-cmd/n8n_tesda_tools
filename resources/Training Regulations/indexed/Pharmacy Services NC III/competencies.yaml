        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Proper laboratory conduct is demonstrated at all times\n1.2 Substances are accurately weighed using appropriate\ntechniques and appropriate weighing balance in\naccordance with Good Laboratory Practices.\n1.3 Semi-solid, liquids, and liquid medicines are measured\nusing appropriate glassware capacity in accordance with\nGood Laboratory Practices.\n1.4 Damaged equipment and device or any laboratory\nglassware are immediately attended to and reported to\nthe pharmacist or appropriate technical personnel.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy environment\n2.2 Relevant documents such as:\n - Local references (issuance of FDA)\n- Good laboratory practices\n - Government/regulatory requirements\n- Equipment manual\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Observation with questioning\n3.2 Demonstration with oral questioning\n3.3Written exam\n4. Context of assessment\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 80 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 76\n\nUNIT OF COMPETENCY\n: ADHERETO GOOD MANUFACTURING PRACTICE (GMP)\n\nUNIT CODE\n\n :"
        },
        "source_text": "HHC532305\n\nUNIT DESCRIPTOR:\nThis unit covers knowledge and skills in the use and handling of\ngeneral pharmacy glassware, devices and equipment.\nNecessary precautions are importantly followed in the context of\nworking in a laboratory setting to avoid unnecessary accidents.\nFailure to follow such protocols can jeopardize the quality of\noutputs.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILL\n1. Observe\nlaboratory\nprotocols\n1.1 Laboratory\noutfit is worn in\naccordance with\nestablished\nprocedures.\n1.2 Proper\nlaboratory\nconduct is\ndemonstrated at\nall times within\nstore premises.\n1.3 Proper waste\ndisposal is\nfollowed in\naccordance with\ngood laboratory\npractices.\n1.4 Use of logbook is\nmaintained in\naccordance with\nestablished\nprocedures.\n1.1 Knowledge, Theory\nand Practices\n1.1.1 Good\nlaboratory\npractices\n1.1.2 Appropriate\nlaboratory outfit\n1.1.3 Appropriate\nuse of logbook\n1.2 Communication\n1.2.1 Preparation of\nReports\n1.2.2 Accomplishing\ndata sheets\nduring\nexperiments\n1.2.3 Incident reports\n1.2.4 Accomplishing\nlogbook use\n1.3 Numeracy\n1.3.1 Proper\nrecording of\nmeasurement\nor readings\n1.4 Safety Practices\n1.4.1 Handling of\nmaterials,\nsupplies, tools\nand equipment\n1.4.2 Wearing\nappropriate\nlaboratory outfit\nand gear as\nneeded\n1.5 Codes and\nRegulations\n1.5.1 Occupational\nSafety and\nHealth\n1.1 Appropriate use of\nlaboratory outfit\nand gear\n1.2 Appropriate\nconduct inside the\nlaboratory\n1.3 Applied good\nlaboratory practice\ntechniques, where\nappropriate\n1.3.1 Disposal of\nchemical wastes\n1.3.2 Proper\nhandling of spilled\nchemicals\n1.4 Proper care and\nhandling of\nglassware, devices,\nand equipment\n1.5 Use of logbook for\ndocumentation\n\n--- PDF PAGE 75 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 71\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILL\n\n1.5.2 Good\nLaboratory\nPractice\n1.6 Materials, Tools,\n& Equipment:\n1.6.1 Volumetric\nflask\n1.6.2 Erlenmeyer\nflask\n1.6.3 Weighing dish\n1.6.4 Weighing\nbottle\n1.6.5 Beaker\n1.6.6 Aspirator\n1.6.7 Camel Hair\nBrush\n1.7 Values\n1.7.1 Resourcefulne\nss\n1.7.2 Consistency\n1.7.3 Integrity\n1.7.4 Professionalis\nm\n2. Demonstrate skills\nin laboratory\nmeasurements\n2.1Substances are\naccurately\nweighed using\nappropriate\ntechniques and\nweighing balance\nin accordance with\nGood Laboratory\nPractices.\n2.2 Semi-solids,\nliquids, and liquid\nmedicines are\nmeasured using\nappropriate\nglassware\ncapacity in\naccordance with\nGood Laboratory\nPractices.\n2.3 Cross-\ncontamination\namong substances\nis prevented at all\ntimes.\n2.1 Knowledge, Theory\nand Practices\n2.1.1 Good\nlaboratory\npractices\n2.1.2 Appropriate\nweighing\nmaterials\n2.1.3 Special\nhandling of\nchemicals\naccording to\nrequirements or\nMaterial Safety\nData Sheet\n2.2 Communication\n2.2.1 Preparation of\nReports\n2.2.2 Accomplishing\ndata sheets\nduring\nexperiments\n2.2.3 Incident reports\n2.2.4 Appropriate use\nof logbook\n2.3 Safety Practices\n2.3.1 Handling of\nmaterials,\n2.1 Accurate weighing\nof solid materials\n2.2 Accurate\nmeasuring of liquid\ningredients and\nliquid preparations\n2.3 Applied good\nlaboratory practice\ntechniques, where\nappropriate\n2.4 Disposal of\nchemical wastes\n2.5 Proper handling of\nspilled chemicals\n2.6 Proper care and\nhandling of\nglassware, devices,\nand equipment\n2.7 Use of logbook for\ndocumentation\n\n--- PDF PAGE 76 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 72\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILL\nsupplies, tools\nand equipment\n2.4 Codes and\nRegulations\n2.4.1Occupational\nSafety and\nHealth\n2.4.2 Good\nlaboratory\npractice\n2.