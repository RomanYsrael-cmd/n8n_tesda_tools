        "source_text": "HCS245201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired in building and maintaining effective\n\nrelationship with clients, customers and the public.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Maintain a\nprofessional\nimage\n\n1.1 Uniform and personal\ngrooming maintained\n1.2 Personal presence\nmaintained according\nto employer\nstandards\n1.3 Visible work area kept\ntidy and uncluttered\n1.4 Equipment stored\naccording to\nassignment\nrequirements\n1.1 Knowledge, Theory\nand Practices\n1.1.1 Philippine\nPharmacist’s\nCode of Ethics\n1.1.2 Legal\nrequirements to\npractice and\noperate\n1.1.3 Role of a\npharmacy\nassistant in the\nPhilippine\nhealthcare\nservices\n1.1.4 Limitations of the\nrole as a\npharmacy\nassistant\n1.1.5 Patient’s rights\n1.2 Communication\n1.2.1 Different modes\nof\ncommunication\n1.2.2 Organizational\npolicies\n1.2.3 Communication\nprocedures and\nsystems\n1.2.4 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n1.3 Codes and\nRegulations\n1.1 Interpersonal\ncommunication\nskills required in\nclient contact\nassignments\n1.2 Customer\nservice skills\nrequired to meet\nclient/customer\nneeds\n1.3 Deliver correct\ninformation to\nthe patient in a\nprofessional\nmanner\n1.4 Treat\npatients/clients\nwith respect\n\n--- PDF PAGE 28 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 24\n1.3.1 Uniform and\npersonal grooming\nrequirements of the\nemployer\n1.3.2 Occupational\nhealth and safety\n1.4 Value\n1.4.1 Punctuality\n1.4.2 Orderliness\n1.4.3 Patience\n1.4.4 Professionalism\n\n2. Meet\nclient/customer\nrequirements\n2.1 Client requirements\nidentified and\nunderstood by referral\nto the assignment\ninstructions\n2.2 Client requirements\nmet according to the\nassignment\ninstructions\n2.3 Changes to client’s\nneeds and\nrequirements\nmonitored and\nappropriate action\ntaken\n2.4 All communication\nwith the client or\ncustomer is clear and\ncomplies with\nassignment\nrequirements\n\n2.1 Knowledge, Theory\nand Practices\n2.1.1 Customer service\n2.1.2 Telephone\nconversation\ntechniques\n2.1.3 Problem solving\nand negotiation\n2.2 Communication\n2.2.1 Different modes\nof communication\n2.2.2 Organizational\npolicies\n2.2.3 Communication\nprocedures and\nsystems\n2.2.4 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.3 Codes and\nRegulations\n2.3.1 Pharmacists'\nCode of Ethics\n2.3.2 Patient’s rights\n2.3.3 Philippine\nPractice\nStandards for\nPharmacists\n2.4 Values\n2.4.1 Patience\n2.1 Attention to\ndetail when\ncompleting\nclient/employer\ndocumentation\n2.2 Interpersonal\ncommunication\nskills required in\nclient contact\nassignments\n2.3 Customer\nservice skills\nrequired to meet\nclient/customer\nneeds\n2.4 Maintain records\n\n3. Build credibility\nwith\ncustomers/clients\n3.1 Client expectations\nfor reliability,\npunctuality and\nappearance adhered\nto\n3.2 Possible causes of\nclient/customer\ndissatisfaction\nidentified, dealt with\nand recorded\naccording to\nemployer policy\n3.1 Knowledge, Theory\nand Practices\n3.1.1 Customer\nservice principles\n3.2 Communication\n3.2.1 Different modes\nof communication\n3.2.2 Organizational\npolicies\n3.2.3 Communication\nprocedures and\nsystems\n3.2.4 Technology\nrelevant to the\n3.1 Demonstrate\ngenuine concern\nfor the welfare of\nthe patients\n3.2 Interpersonal\ncommunication\nskills required in\nclient contact\nassignments\n3.3 Customer\nservice skills\nrequired to meet\n\n--- PDF PAGE 29 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 25\n\n3.3 Client fully informed of\nall relevant security\nmatters in a timely\nmanner and\naccording to agreed\nreporting procedures\nenterprise and the\nindividual’s work\nresponsibilities\n3.3 Codes and\nRegulations\n2.4.2 Pharmacists'\nCode of Ethics\n2.4.3 Patient’s rights\n2.4.4 PhilPSP\n3.4 Values\n3.4.1 Trust\n3.4.2 Integrity\nclient/customer\nneeds\n\n--- PDF PAGE 30 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 26\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Personal Presence\n\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanor\n1.5\nGrooming\n2. Employer Standards\nMay include:\n2.1 Standing Orders\n2.2 Efficiency\n2.3 Client turn-around time\n3. Client Requirements\nMay include:\n3.1\nAssignment instructions (eg, right products)\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n7. Customers\nMay include:\nAll members of the public\n\n--- PDF PAGE 31 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 27\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image.\n1.2\nInterpreted client/customer requirements from\ninformation contained in the client brief and/or\nassignment instructions.\n1.3\nDealt successfully with a variety of client/customer\ninteractions.\n1.4\nMonitored and acted on varying client or customer\nneeds.\n1.5\nMet client/customer requirements.\n1.6\nBuilt credibility with customers/clients.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1\nAssessment centers/venues\n2.2\n Accredited assessors\n2.3\nEvaluation reports\n2.4\nAccess to a relevant venue, equipment and materials\n2.5\nAssignment instructions\n2.6\nLogbooks\n2.7\nOperational manuals and makers’/customers’\ninstructions (if relevant)\n2.8\nAssessment Instruments, including personal planner\nand assessment record book\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1\nWritten Test/Examination\n3.2\nDemonstration with questioning\n3.3\nObservation\n4. Context of\nassessment\n3.1\nCompany\n3.2\nOn-Site\n3.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment\n3.4\nContinuous assessment in the workplace, taking into\naccount the range of variables affecting performance\n\n--- PDF PAGE 32 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 28\nUNIT OF COMPETENCY:\nUPDATE INDUSTRY KNOWLEDGE AND PRACTICE\nTHROUGH CONTINUING EDUCATION\n\nUNIT CODE:"
