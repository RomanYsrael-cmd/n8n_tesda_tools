  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in PHARMACY SERVICES NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE:\n\n500311109\n\n UNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\nlead in the dissemination and discussion of ideas, information\nand issues in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1 Appropriate\ncommunication\nmethod is selected\n1.2 Multiple operations\ninvolving several\ntopics areas are\ncommunicated\naccordingly\n1.3 Questions are used to\ngain extra information\n1.4 Correct sources of\ninformation are\nidentified\n1.5 Information is selected\nand organized\ncorrectly\n1.6 Verbal and written\nreporting is\nundertaken when\nrequired\n1.7 Communication skills\nare maintained in all\nsituations\n1.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2 Effective verbal\ncommunication\nmethods\n1.3 Methods of\nCommunication\n1.4 Types of Question\n1.5 Communication\nTools\n1.6 Questioning\nTechniques\n1.1 Organizing\ninformation\n1.2 Understanding and\nconveying intended\nmeaning\n1.3 Participating in\nvariety of workplace\ndiscussions\n1.4 Complying with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n1.5 Reporting\noccupational hazards\nduring meetings\n2. Lead workplace\ndiscussions\n2.1 Response to\nworkplace issues are\nsought\n2.2 Response to\nworkplace issues are\nprovided immediately\n2.3 Constructive\ncontributions are\nmade to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.1 Leadership as a\nmanagement\nfunction\n2.2 Barriers of\ncommunication\n2.3 Effective verbal\ncommunication\nmethods\n2.4 Method/techniques\nof discussion\n2.5 How to lead\ndiscussion\n2.1 Communicating\neffectively\n2.2 Consulting other PAs\nwith housekeeping\nschedules\n\n--- PDF PAGE 7 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.6 How to solicit\nresponse\n3. Identify and\ncommunicate\nissues arising in\nthe workplace\n3.1. Issues and problems\nare identified as they\narise\n3.2. Information regarding\nproblems and issues\nare organized\ncoherently to ensure\nclear and effective\ncommunication\n3.3. Dialogue is initiated\nwith appropriate\npersonnel\n3.4. Communication\nproblems and issues\nare raised as they\narise\n3.1 Types of issues and\nproblems in the\nworkplace\n3.2 Written and\nelectronic\ncommunication\nmethods\n3.3 Communication\nbarriers affecting\nworkplace\ndiscussions\n3.1 Identifying problems\nand issues, as well\nas its cause\n3.2 Organizing\ninformation on\nproblems and issues\n\n--- PDF PAGE 8 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Communication method\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at\none time\n1.2 Made constructive contributions in workplace issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written\nform\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Variety of Information\n2.2 Communication tools\n2.3 Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n4. Context for\nAssessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 9 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 5\n\nUNIT OF COMPETENCY: LEAD SMALL TEAMS (Guide and lead others/\n Be responsible to others)\nUNIT CODE:\n\n 500311110\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements\nare identified and\npresented to team\nmembers\n1.2 Reasons for\ninstructions and\nrequirements are\ncommunicated to\nteam members\n1.3 Team members’\nqueries and\nconcerns are\nrecognized, discussed\nand dealt with\n\n1.1 Company policies\nand procedures\n1.1.1 How\nperformance\nexpectations are set\n1.1.2 Methods of\nMonitoring\nPerformance\n1.2 Client expectations\n1.3 Definition of Team\n1.4 Team member’s\nduties and\nresponsibilities\n1.5 Skills and\ntechniques in\npromoting team\nbuilding\n1.6 Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n1.7 Art of listening and\ntreating individual\nteam members\nconcern\n1.1 Communication skills\nrequired for leading\nteams\n1.2 Team building skills\n1.3 Negotiating skills\n1.4 Evaluation skills\n2. Assign\nresponsibilities\n2.1 Duties and\nresponsibilities are\nassigned in\nconsideration of skills,\nknowledge, and\naptitude required to\nproperly undertake\nthe task and\naccording to company\npolicy\n2.2 Duties are delegated\naccording to individual\npreference, domestic\nand personal\nconsiderations,\nwhenever possible\n2.1 Concept of\ndelegation\n2.2 Understanding\nindividual\ndifferences\n2.3 Methods of\nmonitoring\nperformance\n2.4 Duties and\nresponsibilities of\neach team member\n2.5 Knowledge in\nidentifying each\nteam member\nduties and\nresponsibilities\n2.1 Delegating skills\n2.2 Identifying individual\nskills, knowledge and\nattitude as basis for\nallocating\nresponsibilities\n2.3 Identifying each team\nmember duties and\nresponsibilities\n\n--- PDF PAGE 10 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 6\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance\nexpectations are\nestablished based on\nclient needs and\naccording to\nassignment\nrequirements\n3.2 Performance\nexpectations are\nbased on individual\nteam members duties\nand area of\nresponsibility\n2.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team\nmembers\n3.1 Definition of\nperformance\nindicators/ criteria\n3.2 Definition of team\ngoals and\nexpectations\n3.3 Methods of\nmonitoring\nperformance\n3.4 Client expectations\n3.5 Team members\nduties and\nresponsibilities\n3.6 Defining\nperformance\nexpectations criteria\n3.1 Identifying\nperformance\nindicators\n3.2 Evaluating\nperformance\n3.3 Setting individual\nperformance target/\nexpectation\nindicators\n4. Supervise team\nperformance\n4.1 Monitoring of\nperformance takes\nplace against defined\nperformance criteria\nand/or assignment\ninstructions and\ncorrective action taken\nif required\n4.2 Team members are\nprovided with\nfeedback, positive\nsupport and advice on\nstrategies to\novercome any\ndeficiencies\n4.3 Performance issues\nwhich cannot be\nrectified or addressed\nwithin the team are\nreferenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are\nkept informed of any\nchanges in the priority\nallocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs\nand satisfaction\n4.5 Team operations are\nmonitored to ensure\nthat employer/client\n4.1 Understanding,\nmonitoring of work\n4.2 How to undertake\ncorrective and\npreventive action\n4.3 Understanding\nfeedback and\nprocedure\n4.4 Feedback reporting\nprocedure\n4.5 Methods of\nmonitoring\nperformance\n4.6 Team member’s\nduties and\nresponsibilities\n4.7 Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n\n4.1 Monitoring skills\n4.2 Setting priorities\n4.3 Evaluating\nperformance\n4.4 Informal/ formal\ncounseling skill\n\n--- PDF PAGE 11 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 7\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nneeds and\nrequirements are met\n4.6 Follow-up\ncommunication is\nprovided on all issues\naffecting the team\n4.7 All relevant\ndocumentation is\ncompleted in\naccordance with\ncompany procedures\n\n--- PDF PAGE 12 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2.\nAssignment instructions\n2. Team member’s concerns\n2.1.\nRoster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2.\nInformal process\n4. Feedback\n4.1. Formal process\n4.2.\nInformal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6.\nCustomer service\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3.\nPortfolio\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 9\nUNIT OF COMPETENCY : DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\n UNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nnegotiations\n1.1 Information on\npreparing for\nnegotiation is\nidentified and\nincluded\n1.2 Non verbal\nenvironments is\nidentified and\nincluded\n1.3 Information on active\nlistening is identified\nand included\n1.4 Information on\ndifferent questioning\ntechniques is\nidentified and\nincluded\n1.5 Information is\nchecked to ensure it\nis correct and up-to-\ndate\n1.1 Knowledge on\nCodes of practice\nand guidelines for\nthe organization\n1.2 Knowledge of\norganizations policy\nand procedures for\nnegotiations\n1.3 Decision making\nand conflict\nresolution strategies\nprocedures\n1.4 Concept of\nnegotiation\n\n1.1 Communication skills\n(verbal and listening)\n1.2 Active listening\n1.3 Setting conflict\n1.4 Preparing conflict\nresolution\n1.5 Problem solving\nstrategies on how to\ndeal with unexpected\nquestions and\nattitudes during\nnegotiation\n1.6 Interpersonal skills to\ndevelop rapport with\nother parties\n\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed\nupon by all parties\n2.2 Desired outcome of\nall parties are\nconsidered\n2.3 Appropriate language\nis used throughout\nthe negotiation\n2.4 A variety of\nquestioning\ntechniques are used\n2.5 The issues and\nprocesses are\ndocumented and\nagreed upon by all\nparties\n2.6 Possible solutions\nare discussed and\ntheir viability\nassessed\n2.1 Outcome of\nnegotiation\n2.2 Knowledge on\nLanguage\n2.3 Different\nQuestioning\ntechniques\n2.4 Problem solving\nstrategies on how to\ndeal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n2.5 Flexibility\n2.6 Empathy\n2.7 Decision making\nand conflict\nresolution strategies\nprocedures\n2.8 Problem solving\nstrategies on how to\ndeal with\n2.1 Negotiating skill\n2.2 Communication skills\n(verbal and listening)\n2.3 Observation skills\n2.4 Interpersonal skills to\ndevelop rapport with\nother parties\n2.5 Applying effective\nquestioning\ntechniques\n2.6 Setting conflict\n\n--- PDF PAGE 14 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 10\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.7 Areas for agreement\nare confirmed and\nrecorded\n2.8 Follow-up action is\nagreed upon by all\nparties\nunexpected\nquestions and\nattitudes during\nnegotiation\n\n--- PDF PAGE 15 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 Self-awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non-verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self-disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally\nfor resolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n\n--- PDF PAGE 16 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 12\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Room with facilities necessary for the negotiation\nprocess\n2.2 Human resources (negotiators)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n3.3 Portfolio\n4. Context for\nAssessment\nCompetency to be assessed in real work environment or in\na simulated workplace setting.\n\n--- PDF PAGE 17 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 13\nUNIT OF COMPETENCY: SOLVE PROBLEMS RELATED TO WORK ACTIVITIES\n\nUNIT CODE:\n500311112\n\nUNIT DESCRIPTOR:\nThis unit of covers the knowledge, skills and attitudes required\nsolving problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the\nroot cause of problems.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Explain the\nanalytical\ntechniques\n1.1 Analytical\ntechniques are\nidentified\n1.2 Use of each\ntechnique is applied\nin real life situations\n1.1 Problem\nidentification\ntechniques\n1.2 Observation,\ninvestigation and\nanalytical\ntechniques\n1.3 Cause and effect\ndiagrams\n1.4 PARETO analysis\n1.5 SWOT analysis\n1.6GANTchart\n1.1 Conduct\ninvestigation and\nroot cause analysis\n1.2 Implement\ncorrective actions\n2. Identify the\nproblem\n2.1 Variances are\nidentified from\nnormal operating\nparameters; and\nproduct quality\n2.2 Extent, cause and\nnature of the\nproblem are defined\nthrough observation,\ninvestigation and\nanalytical\ntechniques\n2.3 Problems are\nclearly stated and\nspecified\n2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n2.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the\nidentification of\nfundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n2.3 Relevant\nequipment and\noperational\nprocesses\n2.1 Use range of formal\nproblem solving\ntechniques\n2.2 Identify and clarify\nthe nature of the\nproblem\n2.3 Evaluate the\neffectiveness of a\npresent process\n2.4 Apply analytical\ntechniques\n\n--- PDF PAGE 18 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 14\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4 Enterprise goals,\ntargets and\nmeasures\n2.5 Enterprise quality,\nOHS and\nenvironmental\nrequirement\n2.6 Enterprise\ninformation\nsystems and data\ncollation\n2.7 Industry codes and\nstandards\n2.8 Normal operating\nparameters and\nproduct quality\n3. Determine\nfundamental\ncauses of the\nproblem\n3.1 Possible causes are\nidentified based on\nexperience and the\nuse of problem\nsolving tools /\nanalytical\ntechniques\n3.2 Possible cause\nstatements are\ndeveloped based on\nfindings\n3.3 Fundamental\ncauses are\nidentified per results\nof investigation\nconducted\n3.1 Relevant\nequipment and\noperational\nprocesses\n3.2 Enterprise goals,\ntargets and\nmeasures\n3.3 Enterprise quality,\nOHS and\nenvironmental\nrequirements\n3.4 Enterprise\ninformation\nsystems and data\ncollation\n3.5 Industry codes and\nstandards\n3.1 Analysis of root\ncauses\n4. Determine\ncorrective action\n4.1 All possible options\nare considered for\nresolution of the\nproblem\n4.2 Strengths and\nweaknesses of\npossible options are\nconsidered\n4.3 Corrective actions\nare determined to\nresolve the problem\nand possible future\ncauses.\n4.1 Understand the\nprocedure in\nundertaking\ncorrective action\n4.2 Principles of\ndecision making\nstrategies and\ntechniques\n4.3 Enterprise\ninformation\nsystems and data\ncollation\n4.4 Action planning\n4.1 Identify and clarify\nthe nature of the\nproblem\n4.2 Devise the best\nsolution\n4.3 Evaluate the\nsolution\n4.4 Implement plan to\nrectify the problem\n4.5 Implementing\ncorrective and\npreventive actions\nbased on root\ncause analysis\n\n--- PDF PAGE 19 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 15\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.4 Action plans are\ndeveloped\nidentifying\nmeasurable\nobjectives, resource\nneeds and timelines\nin accordance with\nsafety and operating\nprocedures.\n\n--- PDF PAGE 20 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 16\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCoordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of\nproblems, including new, unusual and improbable\nsituations that may have happened.\n2. Resource\nImplications\nAssessment will require suitable method of gathering\nevidence of operating ability over a range of situations.\nCase studies / what ifs will be required as well as bank of\nquestions which will be used to probe the reason behind\nthe observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 17\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND TECHIQUES\n\nUNIT CODE:\n\n500311113\n\nUNIT DESCRIPTOR:\n This unit covers the knowledge, skills and attitudes required in\nthe application of mathematical concepts and techniques.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n1.1 Problem areas are\nidentified based on\ngiven condition\n1.2 Mathematical\ntechniques\nare\nselected based on\nthe given problem\n\n1.1 Fundamental\noperation (addition,\nsubtraction, division,\nmultiplication)\n1.2 Measurement\nsystems\n1.3 Units of\nmeasurement and\nits conversion\n1.4 Standard formulas\n1.5 Basic measuring\ntools/devices\n1.6 Steps in solving\nproblem\n1.1 Identifying and\nselecting different\nmeasuring tools\n1.2 Applying different\nformulas in solving\nproblems\n1.3 Describing the units\nof measurement and\nfundamental units\n1.4 Stating arithmetic\ncalculations involving\nthe following;\naddition, subtraction,\ndivision,\nmultiplication\n1.5 Applying theory into\nactual application on\ncalculation of\ntransactions\n1.6 Applying theory into\nactual application on\nappropriate net\ncontent/quantity of\nmedicine to dispense\ncomplete regimen\n\n2. Apply\nmathematical\nprocedure/\nsolution\n2.1 Mathematical\ntechniques are\napplied based on the\nproblem identified\n2.2 Mathematical\ncomputations are\nperformed to the\nlevel of accuracy\nrequired for the\nproblem\n2.3 Results of\nmathematical\ncomputation is\ndetermined and\nverified based on job\nrequirements\n\n2.1 Problem-based\nquestions\n2.2 Estimation\n2.3 Use of\nmathematical tools\nand standard\nformulas\n2.4 Mathematical\ntechniques\n\n2.1 Solving mathematical\ncomputations\n2.2 Converting Metric to\nEnglish\n2.3 Selecting and using\nappropriate and\nefficient techniques\nand strategies to\nsolve problems\n\n3. Analyze results\n3.1 Result of application\nis reviewed based on\n3.1 Techniques in\nanalyzing the results\n3.1 Analyzing the result\nbased on the\n\n--- PDF PAGE 22 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 18\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nexpected and\nrequired\nspecifications and\noutcome\n3.2 Appropriate action\nis applied in case of\nerror\n\n3.2 Process in reviewing\nthe results\n3.3 Precision and\naccuracy\n3.4 Four fundamental\noperations\n3.5 Steps in solving\nproblem\n3.6 Standard formulas\n3.7 Conversion\nmeasurement\nspecified\nrequirements\n3.2 Interpreting and\ncommunicating the\nresults of the analysis\n\n--- PDF PAGE 23 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\nIdentified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Calculator\n2.2 Basic measuring tools\n2.3 Case Problems\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 24 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 20\nUNIT OF COMPETENCY\n:\nUSE RELEVANT TECHNOLOGIES\n\n(Apply technology effectively)\n\nUNIT CODE\n:\n500311114\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills,\n\nand attitude required in selecting, sourcing and applying\n\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different\ntechnologies is\ndetermined based on\njob requirements\n1.2 Appropriate\ntechnology is\nselected as per work\nspecification\n\n1.1 Awareness on\ntechnology and its\nfunction\n1.2 Communication\ntechniques\n1.3 Health and safety\nprocedure\n1.4 Company policy in\nrelation to relevant\ntechnology\n1.5 Machineries/\nequipment and\ntheir application\n1.6 Software programs\n1.1 Identifying relevant\ntechnology on job\n\n2\nApply relevant\ntechnology\n\n2.1 Relevant technology\nis effectively used in\ncarrying out function\n2.2 Applicable software\nand hardware are\nused as per task\nrequirement\n2.3 Management\nconcepts are\nobserved and\npracticed as per\nestablished industry\npractices\n2.1 Knowledge on\noperating\ninstructions\n2.2 Understanding\nsoftware and\nhardware system\n2.3 Communication\ntechniques\n2.4 Health and safety\nprocedure\n2.5 Company policy in\nrelation to relevant\ntechnology\n2.6 Different\nmanagement\nconcepts\n2.7 Technology\nadaptability\n2.8 Office technology\n2.9 Industrial\ntechnology\n2.10 System technology\n2.11 Training\ntechnology\n2.12 Different software/\nhardware\n2.1 Applying relevant\ntechnology\n2.2 Communicating\nskills\n2.3 Using software\napplications skills\n2.4 Conducting risk\nassessment\n\n--- PDF PAGE 25 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 21\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3\nMaintain/\nenhance\nrelevant\ntechnology\n3.1 Maintenance of\ntechnology is applied\nin accordance with the\nindustry standard\noperating procedure,\nmanufacturer’s\noperating guidelines\nand occupational\nhealth and safety\nprocedure to ensure\nits operative ability.\n3.2 Updating of\ntechnology is\nmaintained through\ncontinuing education\nor training in\naccordance with job\nrequirement.\n3.3 Technology failure/\ndefect is immediately\nreported to the\nconcern/responsible\nperson or section for\nappropriate action.\n\n3.1 Awareness on\ntechnology and its\nfunction\n3.2 Repair and\nmaintenance\nprocedure\n3.3 Health and safety\nprocedure\n3.4 Company policy in\nrelation to relevant\ntechnology\n3.5 Upgrading of\ntechnology\n3.6 Organizational set-\nup/work flow\n\n3.1 Performing basic\ntroubleshooting\nskills\n3.2 Identifying failures\nor defects\n3.3 Communication\nskills\n3.4 Applying corrective\nand preventive\nmaintenance\n\n--- PDF PAGE 26 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 Total Quality Management\n2.4 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\ntechnology/equipment\n6. Appropriate action\n6.1 Implementing