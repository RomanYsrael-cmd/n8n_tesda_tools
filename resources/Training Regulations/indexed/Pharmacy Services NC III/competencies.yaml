e dosage is\ncomputed using\ndimensional\nanalysis.\n\n4.1 Ratio and\nproportion\n4.2 Conversion\nfactors\n4.3 Systems of\nmeasurement\n4.4 Dimensional\nanalysis\n\n1.1 Basic\nmathematical\noperations\n1.2 Reports\ncircumstances/situ\nations under\nwhich referral to\nthe pharmacist\nand/or other\npharmacy staff is\nindicated\n1.3 Language,\nliteracy and\nnumeracy skills\nappropriate to the\nrole and\nworkplace\nrequirements\n2 Understand\npharmaceutical\nterminologies\nand medical\nterms\n\n2.1 Pharmaceutical\nterminologies are\nunderstood.\n2.2 Common medical\nterms and\nconditions are\nfamiliarized.\n2.3 Different types of\ndosage forms are\ndistinguished.\n2.1 Dosage forms\n2.2 Pharmaceutical\nabbreviations\n2.3 Common medical\nterms\n2.4 Terminologies in\npharmaceutical\ntherapeutic\ncategory\n2.1 Language,\nliteracy and\nnumeracy skills\nappropriate to the\nrole and\nworkplace\nrequirements\n2.2 Communicating\nideas and\ninformation\neffectively\n3 Use of\nequipment,\nglassware, and\ntools\n3.1 Common\nequipment, tools\nand glassware used\nin the pharmacy\nsetting are\nfamiliarized.\n3.2 Specific parts and\nits functionality are\nknown.\n3.3 Common\nglassware used in\nreconstitution\n3.4 Common\nequipment used in\nretail pharmacy\nsetting\n3.5 Introduction to use\nof computer for\nPoint-of-sale\n3.1 Follow good\nlaboratory\npractice principles\n3.2 Maintain a\nhealthy and safe\nworking\nenvironment\n\n--- PDF PAGE 51 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Pharmaceutical\nterminologies\nMay include but not limited to:\n1.1.\nAbbreviations found in instruction to patients\nfound in prescriptions\n1.1.1. ac – before meal\n1.1.2. pc – after meal\n1.1.3. po – per orem, oral\n1.1.4. npo – non per orem\n1.1.5. aq – aqueous – water\n1.1.6. BID – twice a day\n1.1.7. TID – thrice a day\n1.2.\nAbbreviations used in dosage forms\n1.2.1. tablet – tab\n1.2.2. capsule – cap\n1.2.3. suspension - susp\n1.2.4. modified release – MR\n1.2.5. intravenous – IV\n1.2.6. intramuscular – IM\n1.3.\nAbbreviations used for medical terminologies\n1.3.1. BMI – body mass index\n1.3.2. N/V – nausea and vomiting\n1.3.3. BP – blood pressure\n1.3.4. TB – tuberculosis\n1.3.5. HIV – human immunodeficiency virus\n1.4.\nAbbreviations in medications\n1.4.1. ASA – aspirin\n1.4.2. INH – isoniazid\n1.5.\nAbbreviations used in practice\n1.5.1. DOTS – Direct observed therapy short-course\n\n--- PDF PAGE 52 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 48\nVARIABLE\nRANGE\n2. Medical terms\nMay include but not limited to:\n2.1 Condition\n2.1.1 Fever\n2.1.2 Diarrhea\n2.1.3 Nausea and vomiting\n3. Dosage forms\nMay include but not limited to:\n3.1 Solid\n3.1.1\nTablet\n3.1.2\nModified-extended release\n3.1.3\nImmediate release\n3.1.4\nCapsule\n3.2 Liquid\n3.2.1\nSyrup\n3.2.2\nSuspension\n3.2.3\nEmulsion\n3.3 Parenteral\n3.3.1\nIntravenous\n3.3.2\nIntramuscular\n3.3.3\nSubcutaneous\n3.4 Semi-solid\n3.4.1\nGel\n3.4.2\nOintment\n3.4.3\nSuppository\n3.4.4\nCream\n3.4.5\nPaste\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Dimensional analysis is used accurately to convert one unit\nto another\n1.2 Use of pharmaceutical and medical terminologies that shall\nbe encountered in daily routine\n1.3 Use of common glassware, tools and equipment to be used in\ndaily routine\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy work premises\n2.2 Relevant documents such as:\n- Good pharmacy practice\n- Good laboratory practice\n- pharmaceutical calculations\n- government policies as appropriate\n2.3 Access to a range of housekeeping/maintenance tasks and\nequipment\n2.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n3. Method of\nassessment\nCompetency may be assessed through:\nObservation with questioning\n8.1 Written exam\n8.2 Demonstration with questioning\n2. Context of\nassessment\nCompetency may be assessed in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 53 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 49\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : PRACTICE GOOD HOUSEKEEPING\n\nUNIT CODE\n:\nHHC532301\n\nUNIT DESCRIPTOR\n:This unit involves procedures for housekeeping following\nappropriate health and safety procedures and good\nhousekeeping practice.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform\nhousekeeping\nduties\n\n1.1 Housekeeping\nprocedures are\nperformed in line with\ncompany policy and\nregulations.\n1.2 Area is kept clean,\nusing appropriate\ncleaning materials\nand methods\n1.3 Tools and\nequipment are\ncleaned and used in\naccordance with\ncompany policies and\nprocedures\n1.4 Housekeeping\nprocedures are\ndocumented in line\nwith company policy\nand regulations\n\n.\n1.1 Knowledge, Theory\nand Practices\n1.1.1 Good Storage\nPractice guidelines\n1.1.2 Pest control\npolicies\n1.2 Communication\n1.2.1\nPreparation of\ninventory reports on\nhouse cleaning tools,\nmaterials, supplies and\nequipment\n1.2.2 Preparation of\nCleaning assignments\n1.3 Safety Practices\n1.3.1 Handling of\nmaterials, supplies,\ntools and equipment\n1.4 Codes and\nRegulations\n1.4.1 OSH\n1.4.2 DOH Hygiene\nand Sanitation\n1.5 Materials, Tools, &\nEquipment\n1.4.5 Brooms\n1.4.6 Mops\n1.4.7 Disinfectants\n1.5 Values\n1.5.1 Reliability\n1.5.2 Resourcefulness\n\n1.5.3 Consistency\n\n1.1 Keeping the\ndispensing/labora\ntory area and\nequipment/tools\nclean\n1.2 Adhering to\ndispensing area\naccess controls\n1.4 Maintaining\npersonal hygiene\n1.5 Following pest\ncontrol guidelines\nand schedules\n1.6Preparing and\norganizing\nrequired\nhousekeeping\ntools in regard to\nhousekeeping/\nmaintenance in\nthe area\n1.6 Maintaining\nconfidentiality and\nprivacy\n1.7 Working with\nothers\nharmoniously\n1.8 Managing routines\nand procedures\n1.9 Reports\ncircumstances/sit\nuations under\nwhich referral to\nthe pharmacist\nand/or other\npharmacy staff is\nindicated\n1.10\nOperational\nskills to\nconsistently use\ntime effectively\n\n--- PDF PAGE 54 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 50\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nand provide quality\ncustomer service\n2. Followhealth\nand safety\npractices in the\narea\n2.1 Procedures to\nachieve a safe\nworking\nenvironment in the\narea are complied\nwith in accordance\nwith DOH/FDA\nsafety standards\n2.2\nIrregularities are\nacted upon in\naccordance with\ncompany policies\nand procedures\n2.3\nDispensing area\naccess controls\nprocedures are\nfollowed in\naccordance with\nFDA policies and\nprocedures\n\n2.1 Knowledge, Theory\nand Practices\n2.1.1 Infection and\nhazard control\n2.1.2 Pest control\n2.1.3 Good storage\npractices\n2.2 Safety Practices\n2.2.1 Handling of\nmaterials,\nsupplies, tools\nand equipment\n2.3 Codes and\nRegulations\n2.3.1 OSH\n2.3.2 DOH:\nSanitation/FDA\n2.3.3 Good Storage\nPractice\n2.4 Values\n2.1.1 Initiative\n2.1.2 Reliability\n2.1.3 Resourcefulness\n2.1.4 Consistency\n2.1.5 Professionalism\n\n2.1 Complying with\nsafe working\nenvironment\nprocedures for\npharmacy\nestablishments\n2.2 Adhering to\ndispensing area\naccess controls\nprocedures\n2.3 Maintaining\npersonal hygiene\n2.4 Preparing and\norganizing\nrequired safety\ntools\n2.5 Communicating\nideas and\ninformation\neffectively\n2.6 Working with\nothers\nharmoniously\n2.7 Operational skills\nto consistently\nuse time\neffectively and\nprovide quality\ncustomer service\n2.8 Using time\neffectively\n2.9 Providing\nservice to\ncustomers\n\n--- PDF PAGE 55 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 51\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Housekeeping procedures\nMay include but are not limited to:\n1.1\nEquipment cleaning and storage\n1.2\nMaintaining pharmacy/laboratory cleanliness\n1.3\nMaintaining drug information & material safety\nhandling sheets\n1.4\nStationery supplies and refurbishing\n1.5\nHousekeeping and cleaning logbook\n2. Regulations\nSalient / relevant provisions of the following:\n2.1\nConsumer Law, Environmental Law, Occupational\nSafety, Health and Welfare Law\n2.2\nGood Storage Practices on Housekeeping\n2.3\nPharmacy Law\n2.4\nFDA and related regulations\n2.5\nPhilippine Practice Standards for Pharmacists\n3. Cleaning materials\nMay include but are not limited to:\n3.1\nDisinfectants at varying strengths\n3.2\nChemical cleaning agents\n3.3\nGloves, protective eyewear\n3.4 Mops, Brooms, Cloth\n4. Cleaning methods\nMay include but are not limited to:\n4.1\nSwabbing, washing\n4.2\nSweeping, wiping\n4.3\n Disinfecting\n4.4\n Soaking\n4.5\nDe-scaling\n5. Tools, equipment and\nconsumable materials\nMay include but are not limited to:\n5.1\nScales, balances and measures\n5.2\nMeters, gauges, beakers\n5.3\nMixers, spatula\n5.4\nFilters\n5.5\nSyringes\n5.6\nPestle and mortars\n6. Procedures to achieve a\nsafe working environment\nMay include but are not limited to:\n6.1\nIdentifying dangerous goods and substances\n6.2\nCorrect handling, storage and disposal of goods\n6.3\nApplication of Occupational Health and Safety\nguidelines\n6.4\nEnsuring shelves are not overstocked\n6.5\nEnsuring floors are not slippery or cluttered\n6.6\nEnsuring access to equipment (e.g. high shelves)\nis appropriate\n6.7\nEnsure equipment and devices used are not faulty\n\n--- PDF PAGE 56 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 52\nVARIABLE\nRANGE\n7. Area\nMay include but is not limited to:\n7.1\nWorking Surfaces\n7.2\nSinks\n7.3\nBenches-apparatus\n7.4\nShelves\n7.5\nContainers\n7.6\nDispensing containers\n7.7\nClothing or similar items\n7.8\nFloors, walls, ceilings\n8. Dispensing area access\ncontrols\nMay include but are not limited to:\nKeys, swipe cards etc. for access to remain with registered\npharmacist\nPerson other than the pharmacist or pharmacy assistant\nmust be under direct supervision of pharmacist while in\ndispensing area\n\n--- PDF PAGE 57 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 53\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1 Housekeeping procedures are performed in line with\ncompany policy and regulations.\n1.2 Area is kept clean, using appropriate cleaning\nmaterials and methods\n1.3 Tools and equipment are cleaned and used in\naccordance with company policies and procedures\n2.2 All unusual situations are identified and reported to the\npharmacist.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy work premises\n2.2 Relevant documents such as:\n- pharmacy policies and procedures\n- Good pharmacy practice\n- government policies as appropriate\n- housekeeping procedures\n2.3 Access to a range of housekeeping/maintenance\ntasks and equipment\n2.4 A qualified workplace assessor and/or a technical\nexpert working in partnership with the assessor\nMethod of assessment\nCompetency may be assessed through:\n3.1\nObservation with questioning\n3.2\nWritten exam\n4. Context of assessment\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 58 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 54\n\nUNIT OF COMPETENCY\n: MONITORSUPPLY/INVENTORY OF\n\nPHARMACEUTICAL PRODUCTS\n\nUNIT CODE\n\n: HHC532302\n\nUNIT DESCRIPTOR\n: This unit covers skills and knowledge on key areas of\ndistribution and retail specifically, selection,\nprocurement, and receiving and delivery of stocks.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Examine the\nmedicines in\nthe assortment\nlist or formulary\n\n1.1 Products in the\nassortment list or\nformulary are\nrecognized by\nname, appearance\nand shelf location.\n1.2 Products are\nclassified in\naccordance with\nmarket demand.\n1.3 Unserved/unsold\nproducts are\nrecorded, collected\nand submitted to the\nPharmacist.\n1.1 Knowledge, Theory and\nPractices\n1.1.1 Formulary list\n1.1.2 Assortment list\n1.1.3 Fast-moving items\n1.1.4 Slow-moving items\n1.1.5 Turn-over rate\ncomputations\n1.1.6 Company policies\nand procedures for SKU\ndeletion or inclusion\n1.2 Communication\n1.2.1 Record medicine\ninquiries that are not in\nthe assortment/formulary\nlist\n1.2.2 Prepare bulletin posts\non newly added or deleted\nSKUs according to\ninstructions\n1.3 Mathematics and\nMensuration\n1.3.1 Turnover rate\n1.4 Codes and Regulations\n1.4.1 OSH\n1.5 Materials, Tools, &\nEquipment\n1.5.1 Logbooks\n1.6 Values\n1.6.1 Professionalism\n1.6.2\nHonesty\n1.1 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n1.2 Basic mathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n1.3 Complete work\nrelated documents\n1.4 Identify\npharmaceutical\nproducts that are\nnot on the\nformulary/\nassortment list\n1.5 Recognize sales\nperformance of\nproducts\n\n--- PDF PAGE 59 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 55\n2. Assist in\nprocurement of\nmaterials and\nservices from\nqualified\nsources\n2.1 Procurement\ndocuments are\nprepared in\naccordance with\ncompany policies\nand procedures.\n2.2 Procurement needs\nare communicated\nto the inventory\nmanager/analyst or\npharmacist in\naccordance with\ninventory\nmanagement policy.\n2.3 Purchase requests\nto suppliers are\nprepared in\naccordance with\nprocurement policy.\n2.4 Stock data are\nmanaged by\nupdating the\ninventory system\nand in accordance\nwith established\nprocedures.\n\n2.1 Knowledge, Theory and\nPractices\n 2.1.1 Supplier\nqualification procedure\n2.1.2 Product classification\naccording to company\npolicy\n2.1.3 Basic regulatory\nguidelines on registration\nof products and licensing\n2.2 Communication\n2.2.1 Accomplishment of\npurchase order or\nrequest\n2.1.1 Announcements for\naccredited supplier\n2.1.2 Invitation to bid\n2.2 Codes and Regulation\n2.2.1 OSH\n2.2.2 Philippine Pharmacy\nPractice Standards\n2.2.3 Regulatory\nrequirements\n2.2.4 RA 3720\n2.2.5 RA 5921\n2.3 Materials, Tools, &\nEquipment\n2.3.1 Logbooks or\ncomputers\n2.3.2 Stock cards\n2.4 Values\n2.4.1 Perseverance\n2.4.2 Professionalism\n2.1 Recognize\ndocuments\nnecessary for\naccreditation\n(License to\nOperate, Certificate\nof Product\nregistration,\nCertificate of\nAnalysis, etc.)\n2.2 Communication\nskills (oral or\nwritten)\n2.3 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n2.4 Basic mathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n2.5 Gather and\nprovide\n2.6 Information in\nresponse to\nworkplace\nrequirement\n\n2.7 Complete work\nrelated\ndocuments\n\n--- PDF PAGE 60 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 56\n3. Receive and\ndeliver of\nstocks\n3.1 Delivery\nspecifications are\nchecked whether it\nis in accordance\nwith Good\nDistribution\nPractices.\n3.2 Product\nspecifications of\ndelivered stocks are\ncompared with\npurchase order in\naccordance with\nestablished\nprocedures\n3.3 Deviations from\nproduct\nspecifications are\nrecognized to detect\nwrong, damaged\nand fake medicines\n3.4 Documents are\naccomplished\nthoroughly and kept\naccording to\ncompany and\ngovernment\npolicy/ies\n\n3.1 Knowledge and Theory\n 3.1.1 Product\nspecifications of products\n3.1.2 Common packaging\nor product damage\n3.1.3 Double check\nexpiration dates\n3.1.4 Counterfeit Medicines\n3.1.5 Storage protocols in\ndelivery vans\n3.1.6 Regulatory policies\non documentation\n\n3.2 Communication\n3.2.1 Return product/ reject\nform to supplier\n3.3.\nSafety Practices\n3.3.1 Material Safety\nData Sheet\n3.3.2 Handling\nprecautions\n3.3.3 Clothing\nrequirements\n3.4 Codes and Regulations\n3.4.1\nOSH\n3.4.2\nPhilPSP\n3.4.3\nRA 3720\n3.4.4\nRA 8203\n3.4.5\nRA 5921\n3.5 Materials, Tools, &\nEquipment\n3.5.1 Delivery vehicles\n3.6.Values\n3.6.1 Honesty\n3.6.2 Perseverance\n3.6.3 Professionalism\n3.1 Comprehensively\nchecks product\nattributes during\nreceiving of stocks\n3.2 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n3.3 Basic mathematical\nprocesses of\naddition,\nsubtraction, division\nand multiplication\n3.4 Gather and provide\ninformation in\nresponse to\nworkplace\nrequirement\n3.5 Complete work\nrelated documents\n4. Pack and\ndispatch orders\n4.1 Products ordered are\nretrieved and properly\npackaged to avoid\nbreakages following\nestablished\nprocedures.\n4.2 Products requiring\nspecial delivery\nspecifications are\nmaintained in\naccordance with Good\nDistribution Practices.\n4.3 Data entry\nrequirements related\nto processing orders\nare completely filled\nand in accordance\nwith established\nprocedures.\n4.4 Labeling, product and\ndelivery\nspecifications, and\n4.1 Knowledge, Theory and\nPractices\n 4.1.1 Packaging\nprocedures\n4.1.2 Product specification\n4.1.3 Delivery specification\nof products\n4.1.4 Labeling\nrequirements\naccording to\nregulatory policies\n4.1.5 Good distribution\npractices\n4.1.6 Special handling and\npackaging\nprocedures of\nproducts\n4.1.7 Cold chain\nmanagement\n4.2 Communication\n4.2.1 Labeling\n4.1 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n4.2 Gather and provide\ninformation in\nresponse to\nworkplace\nrequirements\n4.3 Complete work\nrelated documents\n\n--- PDF PAGE 61 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 57\n\ndelivery information\nare checked in\naccordance with\nestablished\nprocedures.\n4.5 Products are\naccurately dispatched\nin a timely manner.\n4.7 Delivery information is\nsecured and security\nprocedures are\nfollowed to ensure\nintegrity of delivered\nproducts.\n\n4.2.2 Reporting damage\nproducts\n4.3 Safety Practices\n4.3.1 Material safety data\nsheet\n4.3.2 Personal protective\nrequirements\n4.4. Codes and Regulations\n4.4.1 OSH\n4.4.2 PhilPSP\n4.4.3 Administrative Order\nNo. 2013-0027\n4.4.4 RA 3720\n4.5 Materials, Tools, &\nEquipment\n4.5.1 Bubble wrap\n4.5.2 Carton boxes\n4.5.3 Thermometer\n4.5.4 Padlocks\n4.6 Values\n4.6.1 Perseverance\n4.6.2 Professionalism\n5. Handle product\nreturned\nproducts or\nproducts for\nreturn\n\n5.1 Handling of returned\nproducts or\nproducts for return is\nperformed in\naccordance with policy\nand procedure in\nplace.\n5.2 Accurate\ndocumentation\nrecords are\nmaintained and credit\nprocess is completed\nin a timely manner\n5.3 Return policies are\ncommunicated to\npatients/clients in\naccordance with\nestablished\nprocedures\n\n5.1 Knowledge, Theory and\nPractices\n5.1.1 Counterfeit\nMedicines\n5.1.2 Return policy\n5.1.3 Quarantine\n5.1.4 Company sales\npolicies\n5.1.5 Expiration of\nmedicines\n5. 2 Communication\n5.2.1 Return forms\n5.3 Safety Practices\n5.3.1 Standard\nOperating\nProcedure\n5.3.2 Clothing\nrequirements\n5.4 Codes and Regulations\n5.4.1 OSH\n5.4.2 Good Storage\nPractices\n5.4.3 RA 8203\n5.4.4 RA 3720\n5.5 Materials, Tools, &\nEquipment\n5.5.1 Computer\n5.6 Values\n5.6.1 Perseverance\n5.6.2 Passion\n5.6.3 Compassion\n5.1 Comprehensively\nchecks product\nattributes during\nreceiving of stocks\n5.2 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n5.3 Basic mathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n5.4 Gather and provide\ninformation in\nresponse to\nworkplace\nrequirements\n5.5 Complete work\nrelated documents\n\n--- PDF PAGE 62 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 58\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Assortment/\nFormulary\nMay include but are not limited to:\n1.1\nPrescription drugs\n1.2\nOver-the-counter medicines\n1.3\nMedical devices\n1.4\nHousehold remedies\n1.5\nOther healthcare products\n2. Market demand\nIt includes:\n2.1 Fast-moving products\n2.2 Slow-moving products\n2.3 Non-moving products\n3. Procurement\ndocuments\nMay include:\n3.1\nRequirements from Supplier:\n3.2\nLicense to operate (LTO)\n3.3\nPhotocopy of owner/pharmacist’s ID\n3.4\nBusiness permit\n3.5\nCertificate of Product Registration (CPR)\n3.6\nCurrent Good Manufacturing Practice Compliance\n(cGMP) certificate\n3.7\nProduct catalogue/brochure\n4. Purchase request\nMay be:\n4.1 Written\n4.2 Electronically transmitted via company computer\ngenerated system\n6 Stock data\n5.1 Inventory data\n6.1\nLot/batch number\n6.2\nExpiry date\n6.3\nStock keeping units (name, strength, dosage form and\nsize)\n6.4\nSecondary Packaging size\n7 Delivery specification\nSpecial precautions in handling the following drugs may\ninclude:\n\n6.1 According to temperature requirement:\n6.1.1 Room temperature (not more than 32 degrees\ncentigrade)\n6.1.2 Cool temperature (8-15degrees centigrade)\n6.1.3 Cold/Refrigerated (0-8degress centigrade\n6.1.4 Freezing (0degrees centigrade)\n6.2 According to packaging requirement\n6.2.1 Bubble pack\n6.2.2 Corrugated boxes\n6.2.3 Aluminum foil\n6.2.4 TempTale(temperature recorder) or Color indicator for\ntemperature\n6.3\nSpecial procedures for regulated and controlled drugs\n8 Product Specification\n7.1 Good physical condition\n7.2 Shelf life within company’s specifications\n7.3\nConformity to FDA labeling requirements\n\n--- PDF PAGE 63 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 59\nVARIABLE\nRANGE\n9 Deviation from\nspecification\nMay include the following deviations but are not limited to:\n8.1 Color of packaging materials\n8.2 Faded printing or misalignment of text\n8.3 Unusual color of tablet, capsule, etc.\n8.4 Chipping of tablets\n8.5 Empty blister\n8.6 Product does not fit well into the blisters shells\n8.7 Instability of powder for suspensions (sedimentation,\ncaking)\n8.8 Creaming of emulsions\n8.9 Broken emulsions\n8.10 Cloudiness of solution\n10 Documentation\nrecords\n9.1\nDelivery receipts/Sales Invoice\n9.2\nLogbooks\n9.3\nReturn/reject/recall forms\n11 Government\nRegulatory Policy\n11.1 FDA regulations\n11.2 PDEA regulations\n11.3 BIR regulations\n11.4\nDTI policy\n12. Returned products\n from clients/patients\nMay include:\n11.1 Damaged products\n11.2 Expired or near-expiry products bought at the time\ndispensed\n11.3\nIncorrect product dispensed\n13. Products for return\nto suppliers\nMay include but are not limited to:\n12.1 Expired or near-expiry products\n12.2 Damaged products\n12.3 Defective products from the manufacturer\n12.4 Products with expiration date outside of the required\nperiod\n12.5\nPhased out, deleted, recalled products\n\n--- PDF PAGE 64 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 60\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified products as part of the assortment/formulary\nlist.\n1.2 Explained how to classify product based turn-over rate.\n1.3 Accessed information using reliable references.\n1.4 Knew how to generate purchase order for stocks\nreplenishment.\n1.5 Received stocks according to specifications.\n1.6 Packaged products according to order.\n1.7 Dispatched orders according to order, delivery and\nproduct specifications.\n1.8 Handled returned products according to SOP.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 Computer\n2.2 Software – POS\n2.3 Record book\n2.4 Order forms\n2.5 Reject/Return forms\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Demonstration with questioning\n3.2Written examination\n4. Context of assessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 65 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 61\nUNIT OF COMPETENCY :\nHANDLE AND CONTROL PHARMACEUTICAL\nPRODUCTS\n\nUNIT CODE\n:\nHHC532303\n\nUNIT DESCRIPTOR\n:\nThis unit involves procedures for maintaining a stock control\nsystem, according to standard operating procedures in\ncompliance with statutory and regulatory requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Comply with\ndrug storage\nrequirements\n1.1 Stocks stored in\naccordance with\nmanufacturer’s\nspecifications,\nregulatory and\ncompany policy and\nprocedures\n1.2 Storage conditions\nmonitored and\nmaintained in\naccordance with\nmanufacturer’s\ninstructions,\ncompany procedures\nand regulatory\nrequirements\n1.3 Stocks are arranged\nin shelves in\naccordance with first\nexpiry, first-out\npolicy\n1.4 Expiration dates are\nmonitored in\naccordance with\ninstitutional and\nregulatory\nguidelines\n1.1 Knowledge, Theory and\nPractices\n1.1.1 Temperature\nMapping\n1.1.2 Regulatory\nrequirements on storage\nrequirements\n1.1.3 Sound- Alike-\nLook-Alike Drugs\n1.1.4 High Alert\nMedicines\n1. 2 Communication\n1.2.1 Temperature and\nhumidity recording data\nsheet\n1.3 Safety practices\n1.3.1 Material Safety\nData Sheet\n1.3.2 Personal\nProtective\nrequirements\n1.4 Codes and Regulations\n1.4.1 Good storage\npractices\n1.4.2 RA 3720\n1.4.3 FDA regulatory\nrequirements\n1.5 Materials, Tools, &\nEquipment\n1.5.1 Thermometer\n1.5.2 Pallets\n1.6 Values\n1.6.1 Professionalism\n1.6.2 Honesty\n1.1 Preparing and\norganizing\ninformation with\nregard to stock\ncontrol in the\ndispensing\n1.2 Familiarity with\npharmacy-related\nterms,\nabbreviations and\npharmaceutical\ncalculations\nappropriate to the\njob role and\nfunction\n1.3 Identification of\ncircumstances/sit\nuations under\nwhich referral to\nthe pharmacist\nand/or other\npharmacy staff is\nappropriate\n1.4 Operational skills\nto consistently\nuse time\neffectively and\nprovide quality\ncustomer service\nin the pharmacy\nenvironment\n\n--- PDF PAGE 66 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 62\n\n2. Monitor\ninventory\n2.1 Stock level\nrequirements are\nmonitored and\nreported in\naccordance with\nestablished\nprocedures\n2.2 Inventory count\nconducted regularly\nin accordance with\ncompany policy and\nprocedures\n2.3 Stock discrepancies\nidentified and\nreported to the\npharmacist for\nreconciliation and\nproper action\n2.1 Knowledge, Theory and\nPractices\n2.1.1 Inventory variance\nmonitoring\n2.1.2 Periodic\nreconciliation of stocks\n2.1.3 Initial inventory\n2.1.4 Replenishment\n2.1.5 Emergency orders\n2.1.6 Low stock levels\n2. 2 Communication\n2.2.1 Slow to no\nmovement stock report\n2.2.2 Stock inventory\nreport upon\nreconciliation\n2.3 Mathematics and\nMensuration\n2.3.1 Standard Branch\nInventory Holding\n2.3.2 Order Quantity\n2.3.3 Safety stock level\n2.3.4 Reorder point\n2.3.5 Reorder quantity\n2.4 Codes and Regulations\n2.4.1 RA 3720\n2.6 Materials, Tools, &\nEquipment\n2.6.1 Computer\n2.6.2 Stock cards or\nAutomated inventory\nmonitoring software\n2.7 Values\n2.7.1 Diligence\n2.7.2 Vigilance\n2.7.3 Honesty\n2.1 Preparing and\norganizing\ninformation in\nregard to stock\ncontrol in the\ndispensing\n2.2 Familiarity with\npharmacy-related\nterms,\nabbreviations\nand\npharmaceutical\ncalculations\nappropriate to\nthe job role and\nfunction\n2.3 Identification of\ncircumstances/\nsituations under\nwhich referral to\nthe pharmacist\nand/or\nother pharmacy\nstaff is\nappropriate\n\n2.4 Operational skills\nto consistently\nuse time\neffectively and\nprovide quality\ncustomer service\nin the pharmacy\nenvironment\n\n--- PDF PAGE 67 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 63\n\n3. Dispense of\nwaste\n3.1 Expired and\ndamaged stocks\nidentified and\ndisposed in\naccordance with\nmanufacturer’s and\ncompany’s policies,\nregulatory and\nenvironmental\npolicies.\n3.2 Expired and\ndamaged stock are\nsegregated and\nlabeled in specific\ncontainers and in\naccordance with\nestablished\nprocedures.\n3.3 Stock records\nupdated after\ndisposal and in\naccordance with\nestablished\nprocedures.\n3.1 Knowledge, Theory and\nPractices\n3.1.1 Waste disposal\nguidelines according to\ncompany policy\n3.1.2 Medicine waste\nsegregation\n3.1.3 Dosage forms\n3.1.4 Pharmacologic\ncategory according to\npackaging\n3. 2 Communication\n3.2.1 Request letters to\nmanufacturers\n3.3 Safety Practices\n3.3.1 Personal protective\nrequirements\n3.3.2 Material Safety\nData Sheet\n3.4 Codes and Regulations\n3.4.1 RA 3720\n3.4.2 Good Pharmacy\nPractice\n3.4.3 Regulatory\nguidelines on\nmedicine/chemical waste\ndisposal\n3.4.4 Infection control\nguidelines\n3.5 Safety practices\n3.5.1 Occupational\nHealth Safety\n3.5.2 Personal\nprotective requirements\n3.5.3 Proper handling\nof hazardous products\n3.6 Materials, Tools, &\nEquipment\n3.6.1 Prescriber’s\nInformation\n3.6.2 Zip lock plastics\n3.6.3 Containers for\nchemical waste\n3.6.4 Containers for\ncontaminated and\nnon-contaminated\nbroken glasses\n3.7 Values\n3.7.1 Integrity\n3.7.2 Professionalism\n\n3.1 Preparing and\norganizing\ninformation in\nregard to stock\ncontrol in the\ndispensing\n3.2 Identification of\ncircumstances/sit\nuations under\nwhich referral to\nthe pharmacist\nand/or other\npharmacy staff is\nappropriate\n3.3 Operational skills\nto consistently\nuse time\neffectively and\nprovide quality\ncustomer service\nin the pharmacy\nenvironment\n3.4 Company waste\ndisposal\nprocedure\n\n--- PDF PAGE 68 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include but not limited to:\n1.1\nFormulary drugs and non-formulary drugs\n1.2\nProducts with the required integrity as well as those\nwhose integrity have been compromised (damaged,\ncontaminated or deteriorated)\n1.3\nRoutinely handled products and products requiring special\nhandling e.g. refrigerated stock\n1.4\nRaw materials for compounding\n2. Storage conditions\nMay include but not limited to:\n2.1 Appropriate temperature and humidity\n2.2\nClean and regularly maintained area\n2.3\n Cold chain requirements\n2.4\nWell-lighted and secured\n2.5\n Proper ventilation\n2.6\nCorrect storage of hazardous substances\n2.7\nWith adequate space\n3.Stock level\nrequirements\n2.1 May include:\n2.1.1 safety stock level\n2.1.2 reorder point\n2.1.3 reorder quantity\n2.2 May be recorded:\n2.2.1 Manually\n2.2.2 Electronically (computer based)\n2.3 May be in:\n2.3.1 Print form\n2.3.2\nElectronic form\n4. Regulatory\nrequirements\nSalient / relevant provisions of the following:\nFDA, DOH, PDEA Administrative Orders and issuances\n5. Disposal\nMay include but not limited to:\n5.1 Returns to supplier\n5.2 Safe destruction according to regulatory requirements and\nenvironmental protection guidelines\n\n--- PDF PAGE 69 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 65\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsistently applied pharmacy policies, standards and\nguidelines, industry legislation and SOPs to dispensing\nstock control tasks including:\n - identified and stored products\n- maintained storage conditions\n - located and positioned dispensing products\n - applied legal disposal of waste\n - applied management procedures to minimize\nselection errors\n1.2\nIdentified and applied procedures for the return of stock\nincluding – the procedures for returning pharmacy\nproducts to supplier/manufacturer and procedures for\nreturned goods from customer to pharmacy.\n1.3\nRead accurately interpreted and consistently applied\ninstructions for performing dispensing stock control\ntasks.\n1.4 Identified and understood different types of stock\ncontrol documents.\n1.5 Sourced, recorded and disseminated stock control\ndocuments\n1.6 Consistently made effective use of time and resources\nby prioritizing tasks.\n1.7 Recognized situations requiring referral to the\npharmacist and/or other pharmacy staff according to\npharmacy policy.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy environment\n2.2 Relevant documents such as:\n - pharmacy policies and procedures for stock control\n- government/regulatory requirements\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1\nObservation with questioning\n3.2 Demonstration with oral questioning\n3.2\nWritten exam\n4. Context of\nassessment\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 70 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 66\n\nUNIT OF COMPETENCY: ARRANGE AND DISPLAY PHARMACEUTICAL\nPRODUCTS\n\nUNIT CODE: HHC532304\n\nUNIT DESCRIPTOR: This unit covers knowledge, attitude and skills on proper\nmerchandising and display as an important component of safety\nand pharmaceutical marketing.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow\nmerchandising plan\n\n1.1 Products are\ndisplayed\naccording to\nplanogram.\n1.2 Regular and\ntimely\nreplenishment\nof product\ndisplay are\nmaintained with\nminimum\ndisruption to\ncustomer or\ntraffic flow.\n1.3 Displays are\nplaced and\nmaintained in a\nsafe and secure\nmanner and in\naccordance with\nestablished\nprocedures.\n1.4 Price tags and\nproper labels\nare attached to\nthe shelves\ncorrectly, and at\nthe specified\nlocation\naccording to\ncompany policy.\n1.5 Guides and\nproduct\nlocators are