2.4 Loss of property, goods or materials\n2.5 Damaged property or fittings\n2.6 Lack of suitable signage when required\n2.7 Lack of training on health and safety issues\n2.8 Unsafe work practices\n3. Emergency\nMay include but is not limited to:\n3.1 Personal injuries\n3.2 Fire\n3.3 Electrocution\n3.4 Natural calamity i.e. earthquake/flood\n3.5 Criminal acts i.e. robbery\n3.6 Bomb\n\n--- PDF PAGE 40 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 36\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with workplace safety, security and hygiene\npractices\n1.4 Identified faults and problems and the necessary corrective\naction\n1.5 Promoted public relation among others\n1.6 Complied with quality standards\n1.7 Responded to emergency situations in line with enterprise\nguidelines\n1.8 Complied with proper dress code\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Procedures manual on safety, security, health and\nemergency\n2.2 Availability of tools, equipment, supplies and materials\n3. Methods of\nassessment\nCompetency may be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n3.3 Interview\n4. Context of\nassessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting.\n\n--- PDF PAGE 41 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 37\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\nTRS311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to perform computer operations which include\ninputting, accessing, producing and transferring data using the\nappropriate hardware and software.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n1. Plan and prepare\nfor task to be taken\nundertaken\n1.1. Requirements of\ntask are\ndetermined in\naccordance with\nthe required\noutput\n1.2. Appropriate\nhardware and\nsoftware are\nselected\naccording to task\nassigned and\nrequired outcome\n1.3. Task is planned\nto ensure that\nOH & S\nguidelines and\nprocedures are\nfollowed\n1.4. Client -specific\nguidelines and\nprocedures are\nfollowed\n1.5. Required data\nsecurity\nguidelines are\napplied in\naccordance with\nexisting\nprocedures\n1.1. Knowledge,\nTheory, Practices\nand Systems\nOperations\n1.1.1. Basic\nergonomics of\nkeyboard and\ncomputer user\n1.1.2. Main types of\ncomputers and basic\nfeatures of different\noperating systems\n1.1.3. Main parts of\na computer\n1.1.4. Storage\ndevices and basic\ncategories of\nmemory\n1.1.5. Relevant\ntypes of software\n1.1.6. Viruses\n1.1.7. Calculating\ncomputer capacity\n1.1.8. Productivity\nApplication\n1.1.9. Business\nApplication\n1.1.10. System\nSoftware\n1.2. Communications\n1.2.1. Written\ncommunication\n1.2.2. Encoding\npatient data/ profile\n1.3.\nCodes and\nRegulations\n1.3.1. General\nsecurity, privacy\n1.1 Identifying lines of\ncommunication,\nrequesting advice,\nfollowing\ninstructions and\nreceiving feedback\n1.2 Using equipment\nsafely including\nkeyboard skills\n1.3 Troubleshooting\nany hardware\nrelated problems\n1.4 Interpreting user\nmanuals and help\nfunctions\n\n--- PDF PAGE 42 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 38\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\nlegislation and\ncopyright\n1.3.2. OH & S\nprinciples and\nresponsibilities\n1.4. Values\n1.4.1. Resourceful-\nness\n1.4.2. Diligence\n1.4.3. Time and cost\nconsciousness\n1.4.4. Integrity\n1.4.5. Perseverance\n1.4.6. Ability to work\nwith others\nharmoniously\n2. Input data into\ncomputer\n2.1. Data are entered\nint