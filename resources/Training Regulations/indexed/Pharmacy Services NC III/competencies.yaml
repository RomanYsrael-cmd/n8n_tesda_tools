        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of\nproblems, including new, unusual and improbable\nsituations that may have happened.\n2. Resource\nImplications\nAssessment will require suitable method of gathering\nevidence of operating ability over a range of situations.\nCase studies / what ifs will be required as well as bank of\nquestions which will be used to probe the reason behind\nthe observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 17\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND TECHIQUES\n\nUNIT CODE:"
