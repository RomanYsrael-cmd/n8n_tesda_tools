          "2.1 Knowledge, Theory and Practices 2.1.1 Screening procedure available in the company 2.1.2 Treatment algorithm for common diseases 2.1.3 Health facilities in the community 2.1.4 Top morbidity and mortality list in the community 2.1.5 Seasonal diseases prevalent in the community 2.2 Communication 2.2.1 Patient counseling 2.2.2 Accomplishme nt of referral forms with partner institutions 2.3 Safety Practices 2.3.1 Proper handling of devise 2.3.2 Precautionary outfit, as necessary, when performing tests 2.4 Codes and Regulations 2.4.1 Occupational Safety and Health 2.4.2 Good Pharmacy Practice 2.5 Materials, Tools, & Equipment 2.5.1 Screening device or tools (BP set, glucometer) 2.6 Values 2.6.1 Compassion 2.6.2 Passion 2.6.3 Perseverance 2.1 Accessing appropriate reference 2.2 Use of screening devices 2.3 Recording of medication profiles 2.4 Filling out forms for referrals 2.5 Effective communication skills (oral and written)",
          "-- PDF PAGE 101 --- TESDA-SOPQSO-01-F08 TR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 97 3. Refer patients to appropriate health care professionals or facilities 3.1 Trigger points for referral are identified following established procedures 3.2 Patients with minor health problems are referred to the pharmacist 3.3 Patients with major health problems are referred to other health care professionals 3.1 Knowledge, Theory and Practices 3.1.1 Standard treatment guidelines and algorithm 3.1.2 Common drug side effects, precautions, and interactions 3.1.3 Signs and symptoms of common diseases 3.2 Communication 3.2.1 Referral forms 3.2.2 Patient counseling 3.3 Codes and Regulation 3.3.1 Good Pharmacy Practice 3.4 Materials, Tools, & Equipment 3.4.1 Referral forms 3.4.2 Telephone 3.4.3 Computer 3.5 Values 3.5.1 Professionalis m 3.5.2 Compassion 3.1 Recognizing patient need for referral 3.2 Communication (oral and written) skills",
          "4. Advise patients on reporting unusual experience with medicines",
          "4. 1. Objectives of reporting adverse drug events are explained to patients in accordance with established procedures. 4.2. Unusual or unexpected effects of drugs are gathered and reported to pharmacist. 4.3. Patients are encouraged to report any unusual experience in the use of the medicine. 4.1 Knowledge, Theory and Practices 4.1.1 FDA Guidelines on Pharmacovigi lance 4.1.2 Common side-effects of over-the- counter medicines 4.2 Communication 4.2.1 Accomplish ADR forms according to company policy 4.2.2 Patient counseling 4.3 Codes and Regulation 4.1 Compiling reports and forwarding them to pharmacist 4.2 Documenting process 4.3 Recognizing patient need for referral 4.4 Communication (oral and written) skills 4.6 Familiarize common side effects of fast moving medicines 4.7 Access reliable information",
          "-- PDF PAGE 102 --- TESDA-SOPQSO-01-F08 TR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 98",
