ishing\nlogbook use\n1.3 Numeracy\n1.3.1 Proper\nrecording of\nmeasurement\nor readings\n1.4 Safety Practices\n1.4.1 Handling of\nmaterials,\nsupplies, tools\nand equipment\n1.4.2 Wearing\nappropriate\nlaboratory outfit\nand gear as\nneeded\n1.5 Codes and\nRegulations\n1.5.1 Occupational\nSafety and\nHealth\n1.1 Appropriate use of\nlaboratory outfit\nand gear\n1.2 Appropriate\nconduct inside the\nlaboratory\n1.3 Applied good\nlaboratory practice\ntechniques, where\nappropriate\n1.3.1 Disposal of\nchemical wastes\n1.3.2 Proper\nhandling of spilled\nchemicals\n1.4 Proper care and\nhandling of\nglassware, devices,\nand equipment\n1.5 Use of logbook for\ndocumentation\n\n--- PDF PAGE 75 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 71\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILL\n\n1.5.2 Good\nLaboratory\nPractice\n1.6 Materials, Tools,\n& Equipment:\n1.6.1 Volumetric\nflask\n1.6.2 Erlenmeyer\nflask\n1.6.3 Weighing dish\n1.6.4 Weighing\nbottle\n1.6.5 Beaker\n1.6.6 Aspirator\n1.6.7 Camel Hair\nBrush\n1.7 Values\n1.7.1 Resourcefulne\nss\n1.7.2 Consistency\n1.7.3 Integrity\n1.7.4 Professionalis\nm\n2. Demonstrate skills\nin laboratory\nmeasurements\n2.1Substances are\naccurately\nweighed using\nappropriate\ntechniques and\nweighing balance\nin accordance with\nGood Laboratory\nPractices.\n2.2 Semi-solids,\nliquids, and liquid\nmedicines are\nmeasured using\nappropriate\nglassware\ncapacity in\naccordance with\nGood Laboratory\nPractices.\n2.3 Cross-\ncontamination\namong substances\nis prevented at all\ntimes.\n2.1 Knowledge, Theory\nand Practices\n2.1.1 Good\nlaboratory\npractices\n2.1.2 Appropriate\nweighing\nmaterials\n2.1.3 Special\nhandling of\nchemicals\naccording to\nrequirements or\nMaterial Safety\nData Sheet\n2.2 Communication\n2.2.1 Preparation of\nReports\n2.2.2 Accomplishing\ndata sheets\nduring\nexperiments\n2.2.3 Incident reports\n2.2.