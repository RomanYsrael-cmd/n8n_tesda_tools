ny\nprocedure\n3.3 Safety Practices\n3.1 Application of\nGood\nManufacturing\nPractice\ntechniques\n3.2 Reporting and\nrecording\naccurate\ninformation\n3.3 Identification of\ndeviation from\nstandard or\nunacceptable/\ninconsistent\n\n--- PDF PAGE 82 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 78\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nstandard operating\nprocedures.\n3.2\nContamination and\ncross-contamination\noccurring at the\nworkplace are identified\nand reported to\nauthorized person.\n3.3\nProcesses, practices or\nconditions that deviate\nfrom standard operating\nprocedures relevant to\ncompliance with GMP\nare identified and\nreported to authorized\nperson.\n3.4\nWork is conducted in\naccordance with duties\nand responsibilities,\nstandard operating\nprocedure, and\nworkplace\nenvironmental\nguidelines\n3.3.1 Personal\nprotective\nrequirements\n3.3.2 Health\nrequirements\n3.4 Codes and\nRegulations\n3.4.1 Occupational\nSafety and Health\n3.4.2 Regulatory\nguidelines\n3.4.3 Pharmaceutical\nInspection and\nCooperation\nScheme GMP\nGuidelines\n3.5 Materials, Tools, &\nEquipment\n3.5.1Standard\noperating\nprocedure\n3.6 Values\n3.6.1 Cleanliness\n3.6.2 Honesty\n3.6.3 Diligence\nequipment\nperformance\n3.4 Monitoring,\ninspection and\nchecking\nprocedures\nrelating to\nprocess control\nrequirements\n3.5 Self-inspection\n4. Complete\ndocumentation\nrequirements to\nsupport GMP\n4.1\nData entry requirements\nin documentation forms\nmust be identified and\ncompletely filled and in\naccordance with\nestablished procedures\n4.2\nInformation is recorded\naccording to company\npolicy reporting\nprocedures.\n4.1 Knowledge, Theory\nand Practices\n4.1.1 Good\nmanufacturing\npractices\n4.1.2 Batch\nManufacturing\nRecord\n4.1.3 All company forms\nrelated to\nproduction\n4.2 Communication\n4.2.1 Accomplish\nentries in the\nmanufacturing\nbatch 