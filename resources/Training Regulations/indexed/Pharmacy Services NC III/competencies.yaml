.3.1 Prevent possible\ncontamination or\ninteraction\n2.4 Codes and\nRegulations\n2.4.1 Company\npolicies and\nprocedures\n2.5 Materials, Tools, &\nEquipment\n2.5.1 Product locators\n2.6 Values\n 2.6.1 Honesty\n 2.6.2\nProfessionalism\n2.1 Effective and\norderly display\nof products\n2.2 Strategically\nplace product\nlocators in store\npremises\n\n3. Monitor\npromotional\nactivities\n3.1 Client is\ninterviewed\nregarding\nfeedback on\npromos in\naccordance\nwith\nestablished\nprocedures.\n3.2 Client feedback\nis documented\nin accordance\n3.1 Knowledge, Theory\nand Practices\n3.1.1 Electronic Drug\nPrice Monitoring\n3.1.2 Interpersonal\ncommunication\n3.2 Systems Operations\n3.2.1 Electronic Drug\nPrice Monitoring\nwebsite\n3.3 Communication\n3.1 Familiarity on\nprices of top\nselling products\n3.2 Accomplish\nforms for\nElectronic Drug\nPrice\nMonitoring\n3.3 Observant on\nwhat\ncommunity\nneeds that will\n\n--- PDF PAGE 72 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 68\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nwith\nestablished\nprocedures.\n3.3 Store feedback\non promos is\nreported to the\npharmacists/\nsuppliers and in\naccordance\nwith\nestablished\nprocedures.\n3.3.1 Assist in the\npreparation of\nreports for\nElectronic Drug\nPrice Monitoring\nSystem\n3.4 Codes and\nRegulations\n3.4.1 MDRP\n3.4.2 Electronic Drug\nPrice Monitoring\n3.5 Materials, Tools, &\nEquipment\n3.5.1 Computer\n3.6 Values\n3.6.1 Professionalism\n3.6.2 Honesty\n\ndrive success\nto promo\n\n--- PDF PAGE 73 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 69\n\nRANGE OF VARIABLES\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Effectively executed the merchandising and display plan.\n1.2 Arranged products for ease of navigation within the store.\n1.3 Implemented