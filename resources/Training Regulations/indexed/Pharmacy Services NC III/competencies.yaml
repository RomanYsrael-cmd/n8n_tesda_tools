les and data\nare transferred\nbetween\ncompatible\nsystems using\ncomputer\nsoftware,\nhardware/periphe\nral devices in\naccordance with\nstandard\noperating\nprocedures.\n4.1 Knowledge, Theory,\nPractices and\nSystems Operations\n4.1.1 Basic\nergonomics of\nkeyboard and\ncomputer user\n4.1.2 Main types of\ncomputers and\nbasic features\nof different\noperating\nsystems\n4.1.3 Storage devices\nand basic\ncategories of\nmemory\n4.1.4 Printing\nprocedure\n\n4.2 Communications\n4.2.1 Written\ncommunication\n4.2.2 Encoding\npatient data/\nprofile\n4.3 Codes and\nRegulations\n4.1 Reading and\ncomprehension\nskills required to\ninterpret work\ninstruction and to\ninterpret basic user\nmanuals.\n4.2 Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n4.3 Technology skills to\nuse equipment\nsafely including\nkeyboard skills.\n\n--- PDF PAGE 45 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 41\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n4.3.1 General\nsecurity, privacy\nlegislation and\ncopyright\n4.3.2 OH & S\nprinciples and\nresponsibilities\n\n4.4\nValues\n4.4.1 Resourceful-\nness\n4.4.2 Diligence\n4.4.3 Time\nconsciousness\n4.4.4 Cost\nconsciousness\n4.4.5 Perseverance in\nroutine works\n\n5. Use basic functions\nof a www-browser\nto locate\ninformation\n5.1. Information\nrequirements for\ninternet search\nare established.\n5.2. Browser is\nlaunched.\n5.3. Search engine is\nloaded.\n5.4. Appropriate\nsearch criteria/or\nURL of site is\nentered.\n5.5. Relevant links\nare followed to\nlocate required\ninformation.\n5.6. Useful pages are\nbookmarked or\nprinted as\nrequired.\n5.1 Knowledge, Theory,\nPractices and\nSystems\nOperations\n5.1.1 Basic\nergonomics of\nkeyboard and\ncomputer user\n5.1.2 Main types of\ncomputers and\nbasic features\nof different\noperating\nsystems