        "source_text": "HHC532308\n\nUNIT DESCRIPTOR\n: This unit involves procedures for accepting medication orders,\n\nrelaying prescription information to the pharmacist and the\n\npatient/client; filling of the order, and packaging and/or pre-\n\npackaging of pharmaceutical products in dose administration\n\ncontainers. This competency may apply to a range of work roles in\n\nthe pharmacy noting, however, that only a pharmacist can only give\n\ntherapeutic advice.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Acknowledge\npatient/ client\n1.1 Patient/ client is\ngreeted in accordance\nwith pharmacy\nguidelines and\nprocedures.\n1.2 Patient/client is asked\nwhat assistance can\nbe extended.\n1.3 Confidentiality, tact\nand privacy\nmaintained at all times\nwhile interacting with\nclients/patients and/or\npassing on relevant\ninformation to other\npharmacy staff.\n1.4 First-In-First-Out\n(FIFO) procedure is\nfollowed for large\nnumber of clients\n1.1 Knowledge, Theory\nand Practices\n1.1.1 Principles of Good\nCustomer Service\n1.1.2 Principles of\nInterpersonal and\nintercultural\ncommunication\n1.1.3 Principles\n1.1.4 Handling different\ntypes of clients\n1.2 Communication\n1.2.1 Prepare standard\nscript for receiving\npatients\n1.2.2 Report untoward\nincident\n1.3 Codes and\nRegulations\n1.3.1 Company policies\nand procedures\n1.4 Values\n1.4.1 Respect\n1.4.3 Professionalism\n\n1.1 Personal Relations\n1.2 Interpersonal\ncommunication\nskills\n1.3 Cultural\ncompetence\n1.4 Good customer\nservice\n1.5 Handling\npatients/clients\nwith special\nneeds, including\ndifficult\npatients/clients\n1.6 Demonstrate tact\n1.7 Following set\nroutines and\nprocedures\n\n2. Process over-the-\ncounter medicine\norder\n2.1 Upon receipt of the\norder, a guided\nrecommendation of\nOTC medicines are\nprovided for minor\nsymptoms following\nestablished\nprocedures.\n2.2 Generic OTC products\non the menu card are\noffered to identify\npreferred product of\nthe patient/client.\n2.3 Availability and\nquantity of medicines\n2.1 Knowledge, Theory\nand Practices\n2.1.1 Principles of\nGood Customer\nService\n2.1.2 Principles of\nInterpersonal and\nintercultural\ncommunication\n2.1.3 Good pharmacy\npractice\n2.1.4 Rational use of\nmedicines\n2.1.5 US & British\nPharmacopeia\n2.1 Personal Relations\n2.2 Interpersonal\ncommunication skills\n2.3 Cultural\ncompetence\n2.4 Good customer\nservice\n2.5 Handling\npatients/clients\nwith special\nneeds, including\ndifficult\npatients/clients\n2.6 Demonstrate tact\n\n--- PDF PAGE 92 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 88\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nordered are checked\nagainst inventory on\nhand.\n2.4 Any pharmaceutical\nand disease-based\nquestions beyond the\nscope of the training\nare referred to the\npharmacist.\n2.5 Product is retrieved\nfrom the shelves\nfollowing established\nprocedures.\n2.6 Labels are prepared\nin accordance with\nregulatory\nrequirements,\nensuring legibility.\n2.7 Ordered medicines\nare counted using\nappropriate devices\nand packaged into a\nsuitable container\nunder pharmacist\nsupervision\n2.7 Prepared product is\nendorsed to the\npharmacist for\nchecking following\nestablished\nprocedures.\n2.2 Communication\n2.2.1 Report untoward\nincident\n2.3 Codes and\nRegulations\n2.3.1\nRelevant\nlaws and\nregulations\n- Generic\nMedicines Act\n- FDA Issuances\n- Discounts for\nsenior citizens\nand PWDs\n2.3.2 Company\npolicies and\nprocedures\n2.3.2 Dispensing\nguidelines (DOT/FDA\nRules)\n2.3.3 Philippine\nPractice Standards for\nPharmacists\n2.4 Values\n2.4.1 Respect\n2.4.2 Accuracy\n2.4.3 Professionalism\n\n2.7 Following set\nroutines and\nprocedures\n2.8 Following disease\nalgorithms to\nrecommend\nappropriate\nmedicine\n3. Process prescription\nmedicine order\n3.1 Prescription is\nchecked for validity\nand completeness of\nprescription details in\naccordance with legal\nand regulatory\nrequirements, upon\nreceipt of the\nprescription\n3.2All available generic\nequivalents are offered\nto identify the\npreferred product of\nthe patient following\nestablished\nprocedures.\n3.3 Availability of\nmedicines ordered is\nchecked, and quantity\nof order/s is/are\nconfirmed.\n3.1 Knowledge, Theory\nand Practices\n3.1.1 Principles of\nGood Customer\nService\n3.1.2 Principles of\nInterpersonal and\nintercultural\ncommunication\n3.1.3 Good pharmacy\npractice\n3.1.4 Rational use of\nmedicines\n3.1.5 US & British\nPharmacopeia\n3.2 Communication\n3.2.1 Report untoward\nincident\n3.3 Codes and\nRegulations\n3.3.1 Company policies\nand procedures\n3.1 Personal Relations\n3.2 Interpersonal\ncommunication\nskills\n3.3 Cultural\ncompetence\n3.4 Good customer\nservice\n3.5 Handling\npatients/clients with\nspecial needs,\nincluding difficult\npatients/clients\n3.6 Demonstrate tact\n3.7 Following set\nroutines and\nprocedures\n\n--- PDF PAGE 93 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 89\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.4 Patient/client is\nquestioned regarding\nany entitlement status\nwith regard to the\nHealth Care Benefits\nScheme and\nPhilHealthinsurance\nwhen applicable or the\nmode of payment.\n3.5 Prescription is\nendorsed to the\npharmacist for\nvalidation (signature).\n3.6 Pharmacist is assisted\nto dispense the\nprescription according\nto the steps.\n3.7 For partially filled\nprescription, quantity\nof medicine dispensed\nis subtracted and\nnoted in the\nprescription pad prior\nto returning to the\nclient/patient.\n3.8 If the prescription is\ncompletely filled,\nprescription is kept\nand filed.\n3.3.2 Dispensing\nguidelines\n3.3.3 Code of ethics\n3.3.4 Philippine\nPractice Standards\nfor Pharmacists\n3.4 Values\n3.4.1 Respect\n3.4.2 Accuracy\n3.4.3 Professionalism\n\n4. Receive payment\nand release exact\nchange\n4.1 Where necessary,\nmultiple orders from 2\nor more customers\nare noted and\nendorsed to cashier\n4.2Prescription/ patient\ndata is accurately\nand confidentially\nentered into\ndispensing computer\nrecords according to\nregulatory\nrequirements\n4.3Identity of the patient\nreceiving the\nmedicines is\nconfirmed in\naccordance with\ncompany policy and\nprocedure.\n4.4 Change is accurately\ngiven and official\nreceipt is issued.\n4.1 Knowledge, Theory\nand Practices\n4.1.1 Principles of\nGood Customer\nService\n4.1.2 Principles of\nInterpersonal and\nintercultural\ncommunication\n4.1.3 Good pharmacy\npractice\n4.1.4 Rational use of\nmedicines\n4.2 Communication\n4.2.1 Report untoward\nincident\n4.3 Codes and\nRegulations\n4.3.1 Company policies\nand procedures\n4.3.2 Dispensing\nguidelines\n4.1. Personal Relation\n4.2. Interpersonal\ncommunication\nskills\n4.3. Cultural\ncompetence\n4.4. Good customer\nservice\n4.5. Handling\npatients/clients\nwith special\nneeds, including\ndifficult\npatients/clients\n4.6. Demonstrate tact\n4.7. Following set\nroutines and\nprocedures\n\n--- PDF PAGE 94 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 90\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4.3.3 Philippine\nPractice Standards for\nPharmacists\n4.4 Values\n4.4.1 Respect\n4.4.2 Accuracy\n4.4.3 Professionalism\n\n--- PDF PAGE 95 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 91\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patients/clients\nMay include but not limited to:\n1.1\nPatients, clients or their authorized\nagents/representatives\n1.2\nPatients, clients with routine or special requests\n1.3\nPatients/clients with special needs e.g. elderly, infants,\netc.\n1.4\nRegular and new clients/patients\n1.5\nPeople from a range of social, cultural or ethnic\nbackgrounds and physical and mental abilities and may\nbe unwell, drug affected, grieving or upset\n2. Prescription details\n Shall include but not limited to:\n2.4 Doctor’s full name and signature, current address, contact\ndetails, PRC license number, PTR, S2 license (for\ndangerous drugs) and date of prescription\n2.5\nGeneric name of medication, potency, dosage form,\nquantity prescribed and dosage regimen\n3. Prescription validity\nShall include but not limited to:\n3.1 Signature of medical doctor, veterinarian or dentist\n3.2\nPeriod of prescription validity according to legal\nrequirements\n3.3 Written according to Rules and Regulations to Implement\nPrescribing Requirements under the Generics Act of\n1988 (R.A. No. 6675)\n4. Legal and regulatory\nrequirements\nSalient / relevant provisions of the following:\n4.1\nConsumer Law\n4.2\nPhilippine Pharmacy Law (RA 5921)\n4.3\nPhilippine Practice Standards for Pharmacists\n4.4\nSenior Citizen’s Law/ Expanded Senior Citizen’s Act\n4.5\nCheaper Quality Medicines Act\n4.6\nCounterfeit Medicines Act\n4.7\nDangerous Drugs Act\n4.8\nGenerics Law\n4.9\nFood, Drug and Cosmetics Act (RA3720)\n4.10 Food Drug Administration Act (RA 9711)\n5. Preferred Product\nMay include but are not limited to:\n5.1 Patient’s/client’s preferred product\n5.2\nPrescribers’ preferred product\n6. Patient/Client details\nShall include but are not limited to:\n6.1\nFull name\n6.2\nCurrent address\n6.3\nGender\n6.4\nAge\n\n--- PDF PAGE 96 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 92\nVARIABLE\nRANGE\n7. Health Care\nBenefits Scheme\nShall include but are not limited to:\n7.1\nSenior citizen discount Persons with Disability discount\n7.2\nPromotional discounts\n7.3\nPrimary Care Benefits\n7.4\nCompliance Pack\n8. Prescription/patient\ndata\nMay include but are not limited to:\n8.1\nClient/patient details as required e.g. date of birth,\nweight, known allergies and/or history of adverse drug\nreaction, or any matters relating to drug dependency\n8.2\nPrescriber data (name, PRC/PDEA license number,\nand PTR\n8.3\nMedication information (name of medicine, quantity,\nstrength, dosage form)\n9. Labels\n9.1 May be:\n9.1.1\nType-written\n9.1.2\nLegibly hand written\n9.1.3\nElectronically generated\n9.2 May include but are not limited to the following\ninformation/data:\n9.2.1 the name of the patient, or in the case of an animal\nthe name of the owner of the animal and the type\nof animal\n9.2.2 the name of the drug/generic name\n9.2.3 the date of dispensing or supply and where\napplicable an identifying code/number\nthe name, address and telephone number of the pharmacy at\nwhich the prescription was dispensed\n\n--- PDF PAGE 97 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 93\nVARIABLE\nRANGE\n10. Devices\nMay include but are not limited to:\n10.1 Scales, measure\n10.2 Irons, heat sealing equipment\n10.3 Tweezers\n10.4 Gloves\n10.5 Glassine paper\n10.6 Bond paper\n10.7 Spatula\n10.8 Transparent tape\n10.9 Resealable plastic (zip loc plastic)\n11. Containers\nMay include but are not limited to:\n11.1 Boxes\n11.2 Cartons\n11.3 Packs\n11.4 Bottles\n10.9 Child resistant packaging\n12. Accuracy\nMay include but is not limited to:\n12.1 Correct product\n12.2 Quantity\n12.3 Placement of labels to expose expiry date and batch\nnumber\n13. Prescriptions\nMay be:\n13.1\nHandwritten\n13.2 Electronically generated with handwritten signature\n\n--- PDF PAGE 98 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 94\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consistently asked critical questions to patients with\nregard to verifying prescription details.\n1.2 Consistently used effective communication techniques to\nprovide information to patients while maintaining an\nawareness of the need for discretion, empathy, tact and\nconfidentiality.\n1.3 Collected, interpreted and applied prescription information\naccurately and responsibly.\n1.4 Identified and understood different types of prescriptions\nand entitlements.\n1.5 Sourced, recorded and disseminated prescription\ninformation\nRecognized situations requiring referral to the pharmacist\nand/or pharmacy staff.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy environment\n2.2 Relevant documents such as:\n 2.2.1 Local references (issuance of FDA)\n2.2.2 Good pharmacy practice\n 2.2.3 Philippine Practice Standards for Pharmacists\n2.8 Resources on health care benefits scheme including:\n2.3.1 benefits and entitlements\n2.3.2 client/patient eligibility\n2.3.3 payments for general patients (non-cardholders)\nand concessional clients/patients\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Demonstration with questioning\n3.2Written exam\n4. Context of\nassessment\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 99 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 95\n\nUNIT OF COMPETENCY :\nPERFORM HEALTH PROMOTION, EDUCATION AND\n\nVIGILANCE\n\nUNIT CODE\n\n:"
