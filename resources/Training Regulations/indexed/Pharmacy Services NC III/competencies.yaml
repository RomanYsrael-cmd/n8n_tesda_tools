pret basic user\nmanuals\n6.2 Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback\n6.3 Technology skills to\nuse equipment\nsafely including\nkeyboard skills\n\n--- PDF PAGE 47 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\n6.3.2 OH & S\nprinciples and\nresponsibilities\n\n6.4 Values\n6.4.1 Resourceful-\nness\n6.4.2 Diligence\n6.4.3 Time\nconsciousness\n6.4.4 Cost\nconsciousness\n6.4.5 Perseverance in\nroutine works\n6.4.6 Ability to work\nwith others\nharmoniously\n\n--- PDF PAGE 48 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1\nHardware and\nperipheral devices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n1.8 Voice/Data logger\n2\nSoftware\nSoftware includes the following but are not limited to:\n2.1 Word processing packages\n2.2 Database packages\n2.3 Internet\n2.4 Spreadsheets\n2.5 Client Specific Software\n3\nOH & S guidelines\n3.1 OHS guidelines\n3.2 Enterprise procedures\n4\nStorage media\nStorage media include the following but are not limited to:\n4.1 Diskettes\n4.2 CDs\n4.3 Zip disks\n4.4 hard disk drives, local and remote\n4.5 Optical drives\n5\nErgonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5 Visual display unit screen brightness\n6\nDesktop icons\n6.1 Icons include the following but not limited to:\n6.2 Directories/folders\n6.3 Files\n6.4 Network devices\n6.5 Recycle bin\n6.6 Program icons\n\n--- PDF PAGE 49 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 45\nVARIABLE\nRANGE\n7\nMaintenance\n7.1 Creating and managing more space in the