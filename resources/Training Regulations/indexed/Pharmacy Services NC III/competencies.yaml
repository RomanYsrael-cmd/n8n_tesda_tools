        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Dimensional analysis is used accurately to convert one unit\nto another\n1.2 Use of pharmaceutical and medical terminologies that shall\nbe encountered in daily routine\n1.3 Use of common glassware, tools and equipment to be used in\ndaily routine\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy work premises\n2.2 Relevant documents such as:\n- Good pharmacy practice\n- Good laboratory practice\n- pharmaceutical calculations\n- government policies as appropriate\n2.3 Access to a range of housekeeping/maintenance tasks and\nequipment\n2.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n3. Method of\nassessment\nCompetency may be assessed through:\nObservation with questioning\n8.1 Written exam\n8.2 Demonstration with questioning\n2. Context of\nassessment\nCompetency may be assessed in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 53 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 49\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : PRACTICE GOOD HOUSEKEEPING\n\nUNIT CODE\n:"
        },
        "source_text": "HHC532202\n\nUNIT DESCRIPTOR\n: The unit involves basic skills in pharmaceutical\n\ncalculation related to computing the correct quantity of\n\nmedicine for a specific prescription or regimen. This\n\nunit shall also cover knowledge on pharmaceutical\n\nterms and abbreviations commonly used in practice.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Use dimensional\nanalysis to\nconvert one unit\nto another\n1.1 Unit conversions are\nfamiliarized.\n1.2 Metric systems are\nknown.\n1.3 Appropriate\noperational equation\nis used for\ndimensional\nanalysis.\n1.4 Complete dosage is\ncomputed using\ndimensional\nanalysis.\n\n4.1 Ratio and\nproportion\n4.2 Conversion\nfactors\n4.3 Systems of\nmeasurement\n4.4 Dimensional\nanalysis\n\n1.1 Basic\nmathematical\noperations\n1.2 Reports\ncircumstances/situ\nations under\nwhich referral to\nthe pharmacist\nand/or other\npharmacy staff is\nindicated\n1.3 Language,\nliteracy and\nnumeracy skills\nappropriate to the\nrole and\nworkplace\nrequirements\n2 Understand\npharmaceutical\nterminologies\nand medical\nterms\n\n2.1 Pharmaceutical\nterminologies are\nunderstood.\n2.2 Common medical\nterms and\nconditions are\nfamiliarized.\n2.3 Different types of\ndosage forms are\ndistinguished.\n2.1 Dosage forms\n2.2 Pharmaceutical\nabbreviations\n2.3 Common medical\nterms\n2.4 Terminologies in\npharmaceutical\ntherapeutic\ncategory\n2.1 Language,\nliteracy and\nnumeracy skills\nappropriate to the\nrole and\nworkplace\nrequirements\n2.2 Communicating\nideas and\ninformation\neffectively\n3 Use of\nequipment,\nglassware, and\ntools\n3.1 Common\nequipment, tools\nand glassware used\nin the pharmacy\nsetting are\nfamiliarized.\n3.2 Specific parts and\nits functionality are\nknown.\n3.3 Common\nglassware used in\nreconstitution\n3.4 Common\nequipment used in\nretail pharmacy\nsetting\n3.5 Introduction to use\nof computer for\nPoint-of-sale\n3.1 Follow good\nlaboratory\npractice principles\n3.2 Maintain a\nhealthy and safe\nworking\nenvironment\n\n--- PDF PAGE 51 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Pharmaceutical\nterminologies\nMay include but not limited to:\n1.1.\nAbbreviations found in instruction to patients\nfound in prescriptions\n1.1.1. ac – before meal\n1.1.2. pc – after meal\n1.1.3. po – per orem, oral\n1.1.4. npo – non per orem\n1.1.5. aq – aqueous – water\n1.1.6. BID – twice a day\n1.1.7. TID – thrice a day\n1.2.\nAbbreviations used in dosage forms\n1.2.1. tablet – tab\n1.2.2. capsule – cap\n1.2.3. suspension - susp\n1.2.4. modified release – MR\n1.2.5. intravenous – IV\n1.2.6. intramuscular – IM\n1.3.\nAbbreviations used for medical terminologies\n1.3.1. BMI – body mass index\n1.3.2. N/V – nausea and vomiting\n1.3.3. BP – blood pressure\n1.3.4. TB – tuberculosis\n1.3.5. HIV – human immunodeficiency virus\n1.4.\nAbbreviations in medications\n1.4.1. ASA – aspirin\n1.4.2. INH – isoniazid\n1.5.\nAbbreviations used in practice\n1.5.1. DOTS – Direct observed therapy short-course\n\n--- PDF PAGE 52 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 48\nVARIABLE\nRANGE\n2. Medical terms\nMay include but not limited to:\n2.1 Condition\n2.1.1 Fever\n2.1.2 Diarrhea\n2.1.3 Nausea and vomiting\n3. Dosage forms\nMay include but not limited to:\n3.1 Solid\n3.1.1\nTablet\n3.1.2\nModified-extended release\n3.1.3\nImmediate release\n3.1.4\nCapsule\n3.2 Liquid\n3.2.1\nSyrup\n3.2.2\nSuspension\n3.2.3\nEmulsion\n3.3 Parenteral\n3.3.1\nIntravenous\n3.3.2\nIntramuscular\n3.3.3\nSubcutaneous\n3.4 Semi-solid\n3.4.1\nGel\n3.4.2\nOintment\n3.4.3\nSuppository\n3.4.4\nCream\n3.4.5\nPaste\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Dimensional analysis is used accurately to convert one unit\nto another\n1.2 Use of pharmaceutical and medical terminologies that shall\nbe encountered in daily routine\n1.3 Use of common glassware, tools and equipment to be used in\ndaily routine\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy work premises\n2.2 Relevant documents such as:\n- Good pharmacy practice\n- Good laboratory practice\n- pharmaceutical calculations\n- government policies as appropriate\n2.3 Access to a range of housekeeping/maintenance tasks and\nequipment\n2.4 A qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n3. Method of\nassessment\nCompetency may be assessed through:\nObservation with questioning\n8.1 Written exam\n8.2 Demonstration with questioning\n2. Context of\nassessment\nCompetency may be assessed in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 53 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 49\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : PRACTICE GOOD HOUSEKEEPING\n\nUNIT CODE\n:"
      }
