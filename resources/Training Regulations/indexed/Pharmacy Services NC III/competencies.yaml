and\nRegulation\n4.1 Compiling reports\nand forwarding\nthem to\npharmacist\n4.2 Documenting\nprocess\n4.3 Recognizing\npatient need for\nreferral\n4.4 Communication\n(oral and written)\nskills\n4.6 Familiarize\ncommon side\neffects of fast\nmoving medicines\n4.7 Access reliable\ninformation\n\n--- PDF PAGE 102 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 98\n\n4.3.1 Good\nPharmacy\nPractice\n4.3.2 FDA:\nPharmacovigilan\nce guideline\n4.4 Materials, Tools, &\nEquipment\n4.4.1 Reporting\nforms\n(electronic\nor paper)\n4.4.2 Internet\nconnection\nfor online\nreporting\n4.5 Values\n4.5.1 Vigilance\n4.5.2 Compassion\n5. Guide patients on\nhow to fill-out\nforms\n5.1. Instructions on how to\nfill-out the form are\ngiven to the patients\nin accordance with\nFDA requirements or\ncompany policy.\n5.2. Items that should be\nanswered in the\nhealth vigilance\nform are clarified to\nthe patient.\n5.3 Patient responses are\nprocessed, tabulated\nand summarized and\nreported to store\nsupervisor.\n5.1 Knowledge, Theory\nand Practices\n5.1.1 FDA\nGuidelines on\nPharmacovigil\nance\n5.1.2 Common side-\neffects of OTC\nmedicines\n5.2 Communication\n5.2.1 Accomplish\nADR forms\naccording to\ncompany\npolicy\n5.2.2 Patient\ncounseling\n5.3 Codes and\nRegulation\n5.3.1 Good\nPharmacy\nPractice\n5.3.2 FDA:\nPharmacovigilance\nguideline\n5.4 Materials, Tools, &\nEquipment\n5.4.1 Reporting\nforms\n(electronic or\npaper)\n5.5 Values\n5.5.1 Vigilance\n5.5.2 Compassion\nProfessionalism\n5.1 Compiling reports\nand forwards to\npharmacist\n5.2 Documenting\nprocess\n5.3 Recognizing\npatient need for\nreferral\n5.4 Interpersonal\ncommunication\n5.5 Communication\nskills\n\n--- PDF PAGE 103 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 99\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health information\nMay be one of the following but are not limited to:\n1.1. First aid over-the-counter (OTC) medicines\n1.2. First aid non-pharmacologic treatments\n1.3. Signs/Symptoms that will warrant consultation to appropriate\nhealthcare practitioner\n1.4.\nScreening tests that may be necessary for the condition\n2. Self-care\n2.1 Adherence to proper use of medicines\n2.2 Antimicrobial stewardship\n2.3 Awareness of precautions, common side-effects and interaction\nwith other drugs, food, health supplements, and laboratory tests.\n3. Responsible self-\nmedication\n3.1 Appropriateness of OTC drug for the condition\n3.2 Safe drug regimen for specific OTCs\n3.3 Non-pharmacologic interventions\n3.4 Lifestyle modification\n4. Screening procedures\nMay include the following, but are not limited to:\n4.1 Blood pressure\n4.2 Blood sugar testing\n4.3 Pregnancy test\n4.4 Screening for tuberculosis\n4.5 Determine presence of risk factors\n5. Common diseases\nand minor ailments\nPrevalent diseases in the community, which may include but are not\nlimited to:\n5.1 Flu\n5.2 Colds\n5.3 Diarrhea\n5.4 Skin infections\n5.5 Constipation\n5.6 Pimples\n5.7 Indigestion\n5.8 Hyperacidity\n5.9 Food poisoning\n6. Seasonal Diseases\n6.1. Leptospirosis\n6.2. Typhoid fever\n6.3. Measles\n6.4. Chicken pox\n6.5. Dengue fever\n6.6. Rabies\n6.7.\nHeat stroke\n7. Minor health problems May include the following, but are not limited to:\n7.1 Common colds\n7.2 Headache\n7.3 Low grade Fever\n8. Major health problems May include the following, but are not limited to:\n8.1 Cancer\n8.2 Diabetes Mellitus\n8.3 Hypertension\n8.4 Asthma\n8.5Tuberculosis\n\n--- PDF PAGE 104 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 100\nVARIABLE\nRANGE\n8.6 HIV/AIDS\n8.7 Malaria\n9. Trigger points\n\nMay include the following, but are not limited to:\n9.1 Any symptom lasting for 2 weeks\n9.2 Chest pain\n9.3 Hemoptysis\n9.4 Severe/Progressive Pain\n9.5 Shortness of Breath\n9.6 Tinnitus\n9.7 Progressive headache\n9.8 Odorous body secretions\n9.9 Any Recurrent symptoms\n9.10 Dark/Bloody stools\n9.11 Unexplained Weight loss\n9.12 High grade fever\n9.13 OTC medicine failure\n9.14 Rashes\n9.15\nFainting\n10. Adverse drug events\n\n10.1 Adverse reactions and interactions\n10.2 Intolerable side-effects\n10.3 Failure of treatments\n11. Health Vigilance\nMonitoring and evaluation of safety and efficacy (performance) of\nprofile of products:\n11.1 Drugs\n11.2 Cosmetics\n11.3 Food supplements\n11.4 Medical devices\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that candidate:\n1.1 Participated in health promotion and educational\ncampaigns.\n1.2 Carried out screening procedures for common diseases.\n1.3 Advised patients on prevention of diseases and their\ncomplications.\n1.4 Referred patients to health facilities as appropriate.\n1.5. Guided patients on how to fill-out forms\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy environment\n2.2 Relevant documents such as:\n - local references\n - clinical practice guidelines; FDA guidelines\n - government/regulatory requirements\n2.3 Telephone/Fax\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1 Demonstration with questioning\n3.2Written exam\n4. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or in a simulated workplace setting environment in\nTESDA accredited institutions.\n\n--- PDF PAGE 105 ---\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 101"
