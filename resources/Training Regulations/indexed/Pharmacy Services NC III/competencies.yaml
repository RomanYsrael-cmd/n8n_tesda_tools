nt:\n3.5.1 Pipette\n3.5.2 Volumetric\nflask\n3.5.3 Erlenmeyer\nflask\n3.5.4 Prescription\nbalance\n3.5.5 Weighing dish\n3.5.6 Weighing\nbottle\n3.5.7 Spatula\n3.5.8 Graduated\ncylinder\n3.6 Values\n3.6.1 Reliability\n3.6.2 Integrity\n\n--- PDF PAGE 78 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 74\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Weighing balance\nMay include the following (but are not limited to):\n1.1 Prescription balance\n1.2\nTop loading balance\n2. Weighing materials\nMay include the following but are not limited to:\n2.1 Weighing bottle\n2.2 Steel Spatula\n2.3 Porcelain spatula\n2.4 Paper boxes\n2.5 Weighing dish\n2.6\nCamels Hair Brush\n3.Semi-solids\nMay include the following but not limited to:\n3.1 Ointment bases\n3.2\nCreams\n4. Liquids\n\nMay include the following but not limited to:\n4.1 Alcohol\n4.2 Water\n4.3 Acids\n4.4 Bases\n4.5 Propylene glycol\n4.6 Glycerin\n5. Laboratory outfit\nMay include but are not limited to:\n5.1 Laboratory gown\n5.2 Scrub suit\n5.3 Bunny suit\n5.4 Head cap, mask, gloves\n5.5 Closed Shoes\n5.6\nUndershirt covering shoulders\n6. Proper Laboratory\nConduct\n\nMay include the following but are not limited to:\n6.1 Not eating in the laboratory\n6.2 Not playing inside the laboratory\n6.3 Having focus at all times\n7. Cleaning solutions\nMay include the following:\n7.1\nDetergent\n7.2\nAlcohol\n7.3\nVolumetric solutions, where appropriate\n7.4\nBleaching solutions\n8. Equipment\nMay include the following:\n8.1\nAir Conditioner\n8.2\nCash registers\n8.3\nComputers\n8.4\nAll types of weighing balance\n8.5\nAnalytic equipment, where appropriate\n9. Device\nMay include the following:\n9.1\nThermometer\n9.2\nDehumidifier\n9.3\nTablet counter\n10. Glassware\nMay include the following but are not limited to:\n10.1 Erlenmeyer flask\n10.2 Graduated cylinder\n\n--- PDF PAGE 79 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 75\nVARIABLE\nRANGE\n10.3 Volumetric flask\n10.4 Pipettes\n10.5 Evaporating dish\n10.6 Beaker\n10.7 Aspirator\n10.8 Stirring Rod\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Proper laboratory conduct is demonstrated at all times\n1.2 Substances are accurately weighed using appropriate\ntechniques and appropriate weighing balance in\naccordance with Good Laboratory Practices.\n1.3 Semi-solid, liquids, and liquid medicines are measured\nusing appropriate glassware capacity in accordance with\nGood Laboratory Practices.\n1.4 Damaged equipment and device or any laboratory\nglassware are immediately attended to and reported to\nthe pharmacist or appropriate technical personnel.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy environment\n2.2 Relevant documents such as:\n - Local references (issuance of FDA)\n- Good laboratory practices\n - Government/regulatory requirements\n- Equipment manual\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Observation with questioning\n3.2 Demonstration with oral questioning\n3.3Written exam\n4. Context of assessment\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 80 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 76\n\nUNIT OF COMPETENCY\n: ADHERETO GOOD MANUFACTURING PRACTICE (GMP)\n\nUNIT CODE\n\n :"
