          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified products as part of the assortment/formulary\nlist.\n1.2 Explained how to classify product based turn-over rate.\n1.3 Accessed information using reliable references.\n1.4 Knew how to generate purchase order for stocks\nreplenishment.\n1.5 Received stocks according to specifications.\n1.6 Packaged products according to order.\n1.7 Dispatched orders according to order, delivery and\nproduct specifications.\n1.8 Handled returned products according to SOP.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 Computer\n2.2 Software – POS\n2.3 Record book\n2.4 Order forms\n2.5 Reject/Return forms\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Demonstration with questioning\n3.2Written examination\n4. Context of assessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 65 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 61\nUNIT OF COMPETENCY :\nHANDLE AND CONTROL PHARMACEUTICAL\nPRODUCTS\n\nUNIT CODE\n:"
        },
        "source_text": "HHC532302\n\nUNIT DESCRIPTOR\n: This unit covers skills and knowledge on key areas of\ndistribution and retail specifically, selection,\nprocurement, and receiving and delivery of stocks.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Examine the\nmedicines in\nthe assortment\nlist or formulary\n\n1.1 Products in the\nassortment list or\nformulary are\nrecognized by\nname, appearance\nand shelf location.\n1.2 Products are\nclassified in\naccordance with\nmarket demand.\n1.3 Unserved/unsold\nproducts are\nrecorded, collected\nand submitted to the\nPharmacist.\n1.1 Knowledge, Theory and\nPractices\n1.1.1 Formulary list\n1.1.2 Assortment list\n1.1.3 Fast-moving items\n1.1.4 Slow-moving items\n1.1.5 Turn-over rate\ncomputations\n1.1.6 Company policies\nand procedures for SKU\ndeletion or inclusion\n1.2 Communication\n1.2.1 Record medicine\ninquiries that are not in\nthe assortment/formulary\nlist\n1.2.2 Prepare bulletin posts\non newly added or deleted\nSKUs according to\ninstructions\n1.3 Mathematics and\nMensuration\n1.3.1 Turnover rate\n1.4 Codes and Regulations\n1.4.1 OSH\n1.5 Materials, Tools, &\nEquipment\n1.5.1 Logbooks\n1.6 Values\n1.6.1 Professionalism\n1.6.2\nHonesty\n1.1 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n1.2 Basic mathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n1.3 Complete work\nrelated documents\n1.4 Identify\npharmaceutical\nproducts that are\nnot on the\nformulary/\nassortment list\n1.5 Recognize sales\nperformance of\nproducts\n\n--- PDF PAGE 59 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 55\n2. Assist in\nprocurement of\nmaterials and\nservices from\nqualified\nsources\n2.1 Procurement\ndocuments are\nprepared in\naccordance with\ncompany policies\nand procedures.\n2.2 Procurement needs\nare communicated\nto the inventory\nmanager/analyst or\npharmacist in\naccordance with\ninventory\nmanagement policy.\n2.3 Purchase requests\nto suppliers are\nprepared in\naccordance with\nprocurement policy.\n2.4 Stock data are\nmanaged by\nupdating the\ninventory system\nand in accordance\nwith established\nprocedures.\n\n2.1 Knowledge, Theory and\nPractices\n 2.1.1 Supplier\nqualification procedure\n2.1.2 Product classification\naccording to company\npolicy\n2.1.3 Basic regulatory\nguidelines on registration\nof products and licensing\n2.2 Communication\n2.2.1 Accomplishment of\npurchase order or\nrequest\n2.1.1 Announcements for\naccredited supplier\n2.1.2 Invitation to bid\n2.2 Codes and Regulation\n2.2.1 OSH\n2.2.2 Philippine Pharmacy\nPractice Standards\n2.2.3 Regulatory\nrequirements\n2.2.4 RA 3720\n2.2.5 RA 5921\n2.3 Materials, Tools, &\nEquipment\n2.3.1 Logbooks or\ncomputers\n2.3.2 Stock cards\n2.4 Values\n2.4.1 Perseverance\n2.4.2 Professionalism\n2.1 Recognize\ndocuments\nnecessary for\naccreditation\n(License to\nOperate, Certificate\nof Product\nregistration,\nCertificate of\nAnalysis, etc.)\n2.2 Communication\nskills (oral or\nwritten)\n2.3 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n2.4 Basic mathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n2.5 Gather and\nprovide\n2.6 Information in\nresponse to\nworkplace\nrequirement\n\n2.7 Complete work\nrelated\ndocuments\n\n--- PDF PAGE 60 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 56\n3. Receive and\ndeliver of\nstocks\n3.1 Delivery\nspecifications are\nchecked whether it\nis in accordance\nwith Good\nDistribution\nPractices.\n3.2 Product\nspecifications of\ndelivered stocks are\ncompared with\npurchase order in\naccordance with\nestablished\nprocedures\n3.3 Deviations from\nproduct\nspecifications are\nrecognized to detect\nwrong, damaged\nand fake medicines\n3.4 Documents are\naccomplished\nthoroughly and kept\naccording to\ncompany and\ngovernment\npolicy/ies\n\n3.1 Knowledge and Theory\n 3.1.1 Product\nspecifications of products\n3.1.2 Common packaging\nor product damage\n3.1.3 Double check\nexpiration dates\n3.1.4 Counterfeit Medicines\n3.1.5 Storage protocols in\ndelivery vans\n3.1.6 Regulatory policies\non documentation\n\n3.2 Communication\n3.2.1 Return product/ reject\nform to supplier\n3.3.\nSafety Practices\n3.3.1 Material Safety\nData Sheet\n3.3.2 Handling\nprecautions\n3.3.3 Clothing\nrequirements\n3.4 Codes and Regulations\n3.4.1\nOSH\n3.4.2\nPhilPSP\n3.4.3\nRA 3720\n3.4.4\nRA 8203\n3.4.5\nRA 5921\n3.5 Materials, Tools, &\nEquipment\n3.5.1 Delivery vehicles\n3.6.Values\n3.6.1 Honesty\n3.6.2 Perseverance\n3.6.3 Professionalism\n3.1 Comprehensively\nchecks product\nattributes during\nreceiving of stocks\n3.2 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n3.3 Basic mathematical\nprocesses of\naddition,\nsubtraction, division\nand multiplication\n3.4 Gather and provide\ninformation in\nresponse to\nworkplace\nrequirement\n3.5 Complete work\nrelated documents\n4. Pack and\ndispatch orders\n4.1 Products ordered are\nretrieved and properly\npackaged to avoid\nbreakages following\nestablished\nprocedures.\n4.2 Products requiring\nspecial delivery\nspecifications are\nmaintained in\naccordance with Good\nDistribution Practices.\n4.3 Data entry\nrequirements related\nto processing orders\nare completely filled\nand in accordance\nwith established\nprocedures.\n4.4 Labeling, product and\ndelivery\nspecifications, and\n4.1 Knowledge, Theory and\nPractices\n 4.1.1 Packaging\nprocedures\n4.1.2 Product specification\n4.1.3 Delivery specification\nof products\n4.1.4 Labeling\nrequirements\naccording to\nregulatory policies\n4.1.5 Good distribution\npractices\n4.1.6 Special handling and\npackaging\nprocedures of\nproducts\n4.1.7 Cold chain\nmanagement\n4.2 Communication\n4.2.1 Labeling\n4.1 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n4.2 Gather and provide\ninformation in\nresponse to\nworkplace\nrequirements\n4.3 Complete work\nrelated documents\n\n--- PDF PAGE 61 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 57\n\ndelivery information\nare checked in\naccordance with\nestablished\nprocedures.\n4.5 Products are\naccurately dispatched\nin a timely manner.\n4.7 Delivery information is\nsecured and security\nprocedures are\nfollowed to ensure\nintegrity of delivered\nproducts.\n\n4.2.2 Reporting damage\nproducts\n4.3 Safety Practices\n4.3.1 Material safety data\nsheet\n4.3.2 Personal protective\nrequirements\n4.4. Codes and Regulations\n4.4.1 OSH\n4.4.2 PhilPSP\n4.4.3 Administrative Order\nNo. 2013-0027\n4.4.4 RA 3720\n4.5 Materials, Tools, &\nEquipment\n4.5.1 Bubble wrap\n4.5.2 Carton boxes\n4.5.3 Thermometer\n4.5.4 Padlocks\n4.6 Values\n4.6.1 Perseverance\n4.6.2 Professionalism\n5. Handle product\nreturned\nproducts or\nproducts for\nreturn\n\n5.1 Handling of returned\nproducts or\nproducts for return is\nperformed in\naccordance with policy\nand procedure in\nplace.\n5.2 Accurate\ndocumentation\nrecords are\nmaintained and credit\nprocess is completed\nin a timely manner\n5.3 Return policies are\ncommunicated to\npatients/clients in\naccordance with\nestablished\nprocedures\n\n5.1 Knowledge, Theory and\nPractices\n5.1.1 Counterfeit\nMedicines\n5.1.2 Return policy\n5.1.3 Quarantine\n5.1.4 Company sales\npolicies\n5.1.5 Expiration of\nmedicines\n5. 2 Communication\n5.2.1 Return forms\n5.3 Safety Practices\n5.3.1 Standard\nOperating\nProcedure\n5.3.2 Clothing\nrequirements\n5.4 Codes and Regulations\n5.4.1 OSH\n5.4.2 Good Storage\nPractices\n5.4.3 RA 8203\n5.4.4 RA 3720\n5.5 Materials, Tools, &\nEquipment\n5.5.1 Computer\n5.6 Values\n5.6.1 Perseverance\n5.6.2 Passion\n5.6.3 Compassion\n5.1 Comprehensively\nchecks product\nattributes during\nreceiving of stocks\n5.2 Perform routine\nworkplace duties\nfollowing simple\nwritten or oral\ninstructions\n5.3 Basic mathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n5.4 Gather and provide\ninformation in\nresponse to\nworkplace\nrequirements\n5.5 Complete work\nrelated documents\n\n--- PDF PAGE 62 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 58\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Assortment/\nFormulary\nMay include but are not limited to:\n1.1\nPrescription drugs\n1.2\nOver-the-counter medicines\n1.3\nMedical devices\n1.4\nHousehold remedies\n1.5\nOther healthcare products\n2. Market demand\nIt includes:\n2.1 Fast-moving products\n2.2 Slow-moving products\n2.3 Non-moving products\n3. Procurement\ndocuments\nMay include:\n3.1\nRequirements from Supplier:\n3.2\nLicense to operate (LTO)\n3.3\nPhotocopy of owner/pharmacist’s ID\n3.4\nBusiness permit\n3.5\nCertificate of Product Registration (CPR)\n3.6\nCurrent Good Manufacturing Practice Compliance\n(cGMP) certificate\n3.7\nProduct catalogue/brochure\n4. Purchase request\nMay be:\n4.1 Written\n4.2 Electronically transmitted via company computer\ngenerated system\n6 Stock data\n5.1 Inventory data\n6.1\nLot/batch number\n6.2\nExpiry date\n6.3\nStock keeping units (name, strength, dosage form and\nsize)\n6.4\nSecondary Packaging size\n7 Delivery specification\nSpecial precautions in handling the following drugs may\ninclude:\n\n6.1 According to temperature requirement:\n6.1.1 Room temperature (not more than 32 degrees\ncentigrade)\n6.1.2 Cool temperature (8-15degrees centigrade)\n6.1.3 Cold/Refrigerated (0-8degress centigrade\n6.1.4 Freezing (0degrees centigrade)\n6.2 According to packaging requirement\n6.2.1 Bubble pack\n6.2.2 Corrugated boxes\n6.2.3 Aluminum foil\n6.2.4 TempTale(temperature recorder) or Color indicator for\ntemperature\n6.3\nSpecial procedures for regulated and controlled drugs\n8 Product Specification\n7.1 Good physical condition\n7.2 Shelf life within company’s specifications\n7.3\nConformity to FDA labeling requirements\n\n--- PDF PAGE 63 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 59\nVARIABLE\nRANGE\n9 Deviation from\nspecification\nMay include the following deviations but are not limited to:\n8.1 Color of packaging materials\n8.2 Faded printing or misalignment of text\n8.3 Unusual color of tablet, capsule, etc.\n8.4 Chipping of tablets\n8.5 Empty blister\n8.6 Product does not fit well into the blisters shells\n8.7 Instability of powder for suspensions (sedimentation,\ncaking)\n8.8 Creaming of emulsions\n8.9 Broken emulsions\n8.10 Cloudiness of solution\n10 Documentation\nrecords\n9.1\nDelivery receipts/Sales Invoice\n9.2\nLogbooks\n9.3\nReturn/reject/recall forms\n11 Government\nRegulatory Policy\n11.1 FDA regulations\n11.2 PDEA regulations\n11.3 BIR regulations\n11.4\nDTI policy\n12. Returned products\n from clients/patients\nMay include:\n11.1 Damaged products\n11.2 Expired or near-expiry products bought at the time\ndispensed\n11.3\nIncorrect product dispensed\n13. Products for return\nto suppliers\nMay include but are not limited to:\n12.1 Expired or near-expiry products\n12.2 Damaged products\n12.3 Defective products from the manufacturer\n12.4 Products with expiration date outside of the required\nperiod\n12.5\nPhased out, deleted, recalled products\n\n--- PDF PAGE 64 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 60\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified products as part of the assortment/formulary\nlist.\n1.2 Explained how to classify product based turn-over rate.\n1.3 Accessed information using reliable references.\n1.4 Knew how to generate purchase order for stocks\nreplenishment.\n1.5 Received stocks according to specifications.\n1.6 Packaged products according to order.\n1.7 Dispatched orders according to order, delivery and\nproduct specifications.\n1.8 Handled returned products according to SOP.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 Computer\n2.2 Software – POS\n2.3 Record book\n2.4 Order forms\n2.5 Reject/Return forms\n3. Method of assessment\nCompetency may be assessed through:\n3.1 Demonstration with questioning\n3.2Written examination\n4. Context of assessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 65 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 61\nUNIT OF COMPETENCY :\nHANDLE AND CONTROL PHARMACEUTICAL\nPRODUCTS\n\nUNIT CODE\n:"
