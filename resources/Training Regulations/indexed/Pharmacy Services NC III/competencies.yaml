        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n4. Context for\nAssessment\nCompetency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 27 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 23\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n: MAINTAIN AN EFFECTIVE RELATIONSHIP WITH\n\nCLIENTS/CUSTOMERS\n\nUNIT CODE\n:"
        },
        "source_text": "500311114\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills,\n\nand attitude required in selecting, sourcing and applying\n\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different\ntechnologies is\ndetermined based on\njob requirements\n1.2 Appropriate\ntechnology is\nselected as per work\nspecification\n\n1.1 Awareness on\ntechnology and its\nfunction\n1.2 Communication\ntechniques\n1.3 Health and safety\nprocedure\n1.4 Company policy in\nrelation to relevant\ntechnology\n1.5 Machineries/\nequipment and\ntheir application\n1.6 Software programs\n1.1 Identifying relevant\ntechnology on job\n\n2\nApply relevant\ntechnology\n\n2.1 Relevant technology\nis effectively used in\ncarrying out function\n2.2 Applicable software\nand hardware are\nused as per task\nrequirement\n2.3 Management\nconcepts are\nobserved and\npracticed as per\nestablished industry\npractices\n2.1 Knowledge on\noperating\ninstructions\n2.2 Understanding\nsoftware and\nhardware system\n2.3 Communication\ntechniques\n2.4 Health and safety\nprocedure\n2.5 Company policy in\nrelation to relevant\ntechnology\n2.6 Different\nmanagement\nconcepts\n2.7 Technology\nadaptability\n2.8 Office technology\n2.9 Industrial\ntechnology\n2.10 System technology\n2.11 Training\ntechnology\n2.12 Different software/\nhardware\n2.1 Applying relevant\ntechnology\n2.2 Communicating\nskills\n2.3 Using software\napplications skills\n2.4 Conducting risk\nassessment\n\n--- PDF PAGE 25 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 21\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3\nMaintain/\nenhance\nrelevant\ntechnology\n3.1 Maintenance of\ntechnology is applied\nin accordance with the\nindustry standard\noperating procedure,\nmanufacturer’s\noperating guidelines\nand occupational\nhealth and safety\nprocedure to ensure\nits operative ability.\n3.2 Updating of\ntechnology is\nmaintained through\ncontinuing education\nor training in\naccordance with job\nrequirement.\n3.3 Technology failure/\ndefect is immediately\nreported to the\nconcern/responsible\nperson or section for\nappropriate action.\n\n3.1 Awareness on\ntechnology and its\nfunction\n3.2 Repair and\nmaintenance\nprocedure\n3.3 Health and safety\nprocedure\n3.4 Company policy in\nrelation to relevant\ntechnology\n3.5 Upgrading of\ntechnology\n3.6 Organizational set-\nup/work flow\n\n3.1 Performing basic\ntroubleshooting\nskills\n3.2 Identifying failures\nor defects\n3.3 Communication\nskills\n3.4 Applying corrective\nand preventive\nmaintenance\n\n--- PDF PAGE 26 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 Total Quality Management\n2.4 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\ntechnology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Questioning\n4. Context for\nAssessment\nCompetency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 27 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 23\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n: MAINTAIN AN EFFECTIVE RELATIONSHIP WITH\n\nCLIENTS/CUSTOMERS\n\nUNIT CODE\n:"
