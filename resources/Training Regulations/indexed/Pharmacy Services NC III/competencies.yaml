ent can take\nplace\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3.\nPortfolio\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 9\nUNIT OF COMPETENCY : DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\n UNIT CODE :"
