        "source_text": "TRS311204\n\nUNIT DESCRIPTOR\n: This unit of competency deals with the knowledge,\n\nskills and attitudes in following health, safety and\n\nsecurity practices. It includes dealing with emergency\n\nsituations and maintaining safe personal presentation standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Follow\nworkplace\nprocedures for\nhealth, safety\nand security\npractices\n\n1.1 Correct health,\nsafety and\nsecurity\nprocedures are\nfollowed in line with\nlegislation and\nenterprise\nprocedures.\n1.2 Breaches of health,\nsafety and security\nprocedures are\nidentified and\nreported in line with\nenterprise\nprocedure.\n1.3 Suspicious\nbehavior or\nunusual\noccurrences are\nreported in line\nwith enterprise\nprocedure.\n1.1 Knowledge, Theory,\nPractices and Systems\nOperations\n1.1.1 Correct health,\nsafety and security\nprocedures\n1.1.2 Types of\nbreaches of health,\nsafety and security\nprocedures\n1.2 Communications\n1.2.1 Verbal and\nwritten\ncommunication\n1.2.1 Interaction with\nclients\n1.3 Safety\n1.3.1 Personal Safety\nEquipment\n1.3.2 Work hazards\n1.4 Codes and\nRegulations\n1.4.1 Occupational\nsafety and health\nstandards\n1.4.2 RA 9003\n1.4.3 RA 6969\n1.4.4 Local ordinances\n1.5 Values\n1.5.1 Safety and\nhealth consciousness\n1.5.2 Resourcefulness\n1.5.3 Diligence\n1.5.4 Time and cost\nconsciousness\n1.5.5 Integrity\n1.5.6 Perseverance\n1.5.7 Ability to work\nwith others\nharmoniously\n1.1 Knowing the\nsources of\ninformation on the\nindustry\n1.2 Assessing and\nupdating industry\ninformation to effect\nimproved work\nperformance\n1.3 Applying industry\ninformation to day-\nto-day work\nactivities\n1.4 Practicing\ncommunication\nskills\n\n--- PDF PAGE 37 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 33\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Deal with\nemergency\nsituations\n2.1 Emergency and\npotential\nemergency\nsituations are\nrecognized and\nappropriate actions\nare taken within\nindividual’s scope\nof responsibility.\n2.2 Emergency\nprocedures are\nfollowed in line with\nenterprise\nprocedures.\n2.3\nAssistance is\nsought from\ncolleagues to\nresolve or respond\nto emergency\nsituation.\n2.4\nDetails of\nemergency\nsituations are\nreported in line\nwith enterprise\nprocedures.\n2.1 Knowledge, Theory,\nPractices and Systems\nOperations\n2.1.1 Types of emergency\nsituations and\nprocedures\n2.2Communications\n2.2.1 Verbal and written\ncommunication\n2.2.2 Interaction with\nclients\n2.3 Safety\n2.3.1 Personal Safety\nEquipment\n2.3.2 Work hazards\n2.4 Codes and\nRegulations\n2.4.1 Occupational safety\nand health\nstandards\n2.4.2 RA 9003\n2.4.3 RA 6969\n2.4.4 Local ordinances\n2.5 Values\n2.5.1 Safety and health\nconsciousness\n2.5.2 Resourcefulness\n2.5.3 Diligence\n2.5.4 Time and cost\nconsciousness\n2.5.5 Integrity\n2.5.6 Perseverance\n2.6 Ability to work with\nothers harmoniously\n2.1 Practicing intra and\ninterpersonal skills\n2.2 Applying appropriate\nactions to\nemergencies\n2.3 Reporting\nemergency\nsituations\n3. Maintain safe\npersonal\npresentation\nstandards\n3.1 Safe personal\nstandards are\nidentified and\nfollowed in line with\nenterprise\nrequirements\n3.1 Knowledge, Theory,\nPractices and Systems\nOperations\n3.1.1 Types of\nemergency situations\nand procedures\n3.1.2 Personal safety\nstandards\n3.2Communications\n3.2.1 Verbal and\nwritten communication\n3.2.1 Interaction with\nclients\n3.3 Safety\n3.3.1 Personal Safety\nEquipment\n3.3.2 Work hazards\n\n3.1 Practicing intra and\ninterpersonal skills\n3.2 Following\nappropriate safety\npersonal standards\n\n--- PDF PAGE 38 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 34\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.4 Codes and\nRegulations\n3.4.1 Occupational\nsafety and health\nstandards\n3.4.2 RA 9003\n3.4.3 RA 6969\n3.4.4 Local ordinances\n3.5 Values\n3.5.1 Safety and health\nconsciousness\n3.5.2 Resourcefulness\n3.5.3 Diligence\n3.5.4 Time and cost\nconsciousness\n3.5.5 Integrity\n3.5.6 Perseverance\n3.5.7 Ability to work with\nothers\nharmoniously\n\n--- PDF PAGE 39 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 35\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health, Safety and Security\nProcedures\nMay include but are not limited to:\n1.1 Use of personal protective clothing and equipment\n1.2 Safe posture including sitting, standing, bending\n1.3 Manual handling including lifting, transferring\n1.4 Safe handling of chemicals, poisons and dangerous\nmaterials\n1.5 Ergonomically sound furniture and work stations\n1.6 Emergency fire and accident\n1.7 Hazard identification and control\n1.8 Security of documents, cash, equipment, people\n1.9 Key control systems\n2. Breaches of Procedure\nMay include but are not limited to:\n2.1 Loss of keys\n2.2 Strange or suspicious persons\n2.3 Broken or malfunctioning equipment\n2.4 Loss of property, goods or materials\n2.5 Damaged property or fittings\n2.6 Lack of suitable signage when required\n2.7 Lack of training on health and safety issues\n2.8 Unsafe work practices\n3. Emergency\nMay include but is not limited to:\n3.1 Personal injuries\n3.2 Fire\n3.3 Electrocution\n3.4 Natural calamity i.e. earthquake/flood\n3.5 Criminal acts i.e. robbery\n3.6 Bomb\n\n--- PDF PAGE 40 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 36\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with workplace safety, security and hygiene\npractices\n1.4 Identified faults and problems and the necessary corrective\naction\n1.5 Promoted public relation among others\n1.6 Complied with quality standards\n1.7 Responded to emergency situations in line with enterprise\nguidelines\n1.8 Complied with proper dress code\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Procedures manual on safety, security, health and\nemergency\n2.2 Availability of tools, equipment, supplies and materials\n3. Methods of\nassessment\nCompetency may be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n3.3 Interview\n4. Context of\nassessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting.\n\n--- PDF PAGE 41 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 37\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:"
