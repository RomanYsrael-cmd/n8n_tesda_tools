        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsistently applied pharmacy policies, standards and\nguidelines, industry legislation and SOPs to dispensing\nstock control tasks including:\n - identified and stored products\n- maintained storage conditions\n - located and positioned dispensing products\n - applied legal disposal of waste\n - applied management procedures to minimize\nselection errors\n1.2\nIdentified and applied procedures for the return of stock\nincluding – the procedures for returning pharmacy\nproducts to supplier/manufacturer and procedures for\nreturned goods from customer to pharmacy.\n1.3\nRead accurately interpreted and consistently applied\ninstructions for performing dispensing stock control\ntasks.\n1.4 Identified and understood different types of stock\ncontrol documents.\n1.5 Sourced, recorded and disseminated stock control\ndocuments\n1.6 Consistently made effective use of time and resources\nby prioritizing tasks.\n1.7 Recognized situations requiring referral to the\npharmacist and/or other pharmacy staff according to\npharmacy policy.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy environment\n2.2 Relevant documents such as:\n - pharmacy policies and procedures for stock control\n- government/regulatory requirements\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1\nObservation with questioning\n3.2 Demonstration with oral questioning\n3.2\nWritten exam\n4. Context of\nassessment\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 70 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 66\n\nUNIT OF COMPETENCY: ARRANGE AND DISPLAY PHARMACEUTICAL\nPRODUCTS\n\nUNIT CODE:"
        },
        "source_text": "HHC532303\n\nUNIT DESCRIPTOR\n:\nThis unit involves procedures for maintaining a stock control\nsystem, according to standard operating procedures in\ncompliance with statutory and regulatory requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Comply with\ndrug storage\nrequirements\n1.1 Stocks stored in\naccordance with\nmanufacturer’s\nspecifications,\nregulatory and\ncompany policy and\nprocedures\n1.2 Storage conditions\nmonitored and\nmaintained in\naccordance with\nmanufacturer’s\ninstructions,\ncompany procedures\nand regulatory\nrequirements\n1.3 Stocks are arranged\nin shelves in\naccordance with first\nexpiry, first-out\npolicy\n1.4 Expiration dates are\nmonitored in\naccordance with\ninstitutional and\nregulatory\nguidelines\n1.1 Knowledge, Theory and\nPractices\n1.1.1 Temperature\nMapping\n1.1.2 Regulatory\nrequirements on storage\nrequirements\n1.1.3 Sound- Alike-\nLook-Alike Drugs\n1.1.4 High Alert\nMedicines\n1. 2 Communication\n1.2.1 Temperature and\nhumidity recording data\nsheet\n1.3 Safety practices\n1.3.1 Material Safety\nData Sheet\n1.3.2 Personal\nProtective\nrequirements\n1.4 Codes and Regulations\n1.4.1 Good storage\npractices\n1.4.2 RA 3720\n1.4.3 FDA regulatory\nrequirements\n1.5 Materials, Tools, &\nEquipment\n1.5.1 Thermometer\n1.5.2 Pallets\n1.6 Values\n1.6.1 Professionalism\n1.6.2 Honesty\n1.1 Preparing and\norganizing\ninformation with\nregard to stock\ncontrol in the\ndispensing\n1.2 Familiarity with\npharmacy-related\nterms,\nabbreviations and\npharmaceutical\ncalculations\nappropriate to the\njob role and\nfunction\n1.3 Identification of\ncircumstances/sit\nuations under\nwhich referral to\nthe pharmacist\nand/or other\npharmacy staff is\nappropriate\n1.4 Operational skills\nto consistently\nuse time\neffectively and\nprovide quality\ncustomer service\nin the pharmacy\nenvironment\n\n--- PDF PAGE 66 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 62\n\n2. Monitor\ninventory\n2.1 Stock level\nrequirements are\nmonitored and\nreported in\naccordance with\nestablished\nprocedures\n2.2 Inventory count\nconducted regularly\nin accordance with\ncompany policy and\nprocedures\n2.3 Stock discrepancies\nidentified and\nreported to the\npharmacist for\nreconciliation and\nproper action\n2.1 Knowledge, Theory and\nPractices\n2.1.1 Inventory variance\nmonitoring\n2.1.2 Periodic\nreconciliation of stocks\n2.1.3 Initial inventory\n2.1.4 Replenishment\n2.1.5 Emergency orders\n2.1.6 Low stock levels\n2. 2 Communication\n2.2.1 Slow to no\nmovement stock report\n2.2.2 Stock inventory\nreport upon\nreconciliation\n2.3 Mathematics and\nMensuration\n2.3.1 Standard Branch\nInventory Holding\n2.3.2 Order Quantity\n2.3.3 Safety stock level\n2.3.4 Reorder point\n2.3.5 Reorder quantity\n2.4 Codes and Regulations\n2.4.1 RA 3720\n2.6 Materials, Tools, &\nEquipment\n2.6.1 Computer\n2.6.2 Stock cards or\nAutomated inventory\nmonitoring software\n2.7 Values\n2.7.1 Diligence\n2.7.2 Vigilance\n2.7.3 Honesty\n2.1 Preparing and\norganizing\ninformation in\nregard to stock\ncontrol in the\ndispensing\n2.2 Familiarity with\npharmacy-related\nterms,\nabbreviations\nand\npharmaceutical\ncalculations\nappropriate to\nthe job role and\nfunction\n2.3 Identification of\ncircumstances/\nsituations under\nwhich referral to\nthe pharmacist\nand/or\nother pharmacy\nstaff is\nappropriate\n\n2.4 Operational skills\nto consistently\nuse time\neffectively and\nprovide quality\ncustomer service\nin the pharmacy\nenvironment\n\n--- PDF PAGE 67 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 63\n\n3. Dispense of\nwaste\n3.1 Expired and\ndamaged stocks\nidentified and\ndisposed in\naccordance with\nmanufacturer’s and\ncompany’s policies,\nregulatory and\nenvironmental\npolicies.\n3.2 Expired and\ndamaged stock are\nsegregated and\nlabeled in specific\ncontainers and in\naccordance with\nestablished\nprocedures.\n3.3 Stock records\nupdated after\ndisposal and in\naccordance with\nestablished\nprocedures.\n3.1 Knowledge, Theory and\nPractices\n3.1.1 Waste disposal\nguidelines according to\ncompany policy\n3.1.2 Medicine waste\nsegregation\n3.1.3 Dosage forms\n3.1.4 Pharmacologic\ncategory according to\npackaging\n3. 2 Communication\n3.2.1 Request letters to\nmanufacturers\n3.3 Safety Practices\n3.3.1 Personal protective\nrequirements\n3.3.2 Material Safety\nData Sheet\n3.4 Codes and Regulations\n3.4.1 RA 3720\n3.4.2 Good Pharmacy\nPractice\n3.4.3 Regulatory\nguidelines on\nmedicine/chemical waste\ndisposal\n3.4.4 Infection control\nguidelines\n3.5 Safety practices\n3.5.1 Occupational\nHealth Safety\n3.5.2 Personal\nprotective requirements\n3.5.3 Proper handling\nof hazardous products\n3.6 Materials, Tools, &\nEquipment\n3.6.1 Prescriber’s\nInformation\n3.6.2 Zip lock plastics\n3.6.3 Containers for\nchemical waste\n3.6.4 Containers for\ncontaminated and\nnon-contaminated\nbroken glasses\n3.7 Values\n3.7.1 Integrity\n3.7.2 Professionalism\n\n3.1 Preparing and\norganizing\ninformation in\nregard to stock\ncontrol in the\ndispensing\n3.2 Identification of\ncircumstances/sit\nuations under\nwhich referral to\nthe pharmacist\nand/or other\npharmacy staff is\nappropriate\n3.3 Operational skills\nto consistently\nuse time\neffectively and\nprovide quality\ncustomer service\nin the pharmacy\nenvironment\n3.4 Company waste\ndisposal\nprocedure\n\n--- PDF PAGE 68 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock\nMay include but not limited to:\n1.1\nFormulary drugs and non-formulary drugs\n1.2\nProducts with the required integrity as well as those\nwhose integrity have been compromised (damaged,\ncontaminated or deteriorated)\n1.3\nRoutinely handled products and products requiring special\nhandling e.g. refrigerated stock\n1.4\nRaw materials for compounding\n2. Storage conditions\nMay include but not limited to:\n2.1 Appropriate temperature and humidity\n2.2\nClean and regularly maintained area\n2.3\n Cold chain requirements\n2.4\nWell-lighted and secured\n2.5\n Proper ventilation\n2.6\nCorrect storage of hazardous substances\n2.7\nWith adequate space\n3.Stock level\nrequirements\n2.1 May include:\n2.1.1 safety stock level\n2.1.2 reorder point\n2.1.3 reorder quantity\n2.2 May be recorded:\n2.2.1 Manually\n2.2.2 Electronically (computer based)\n2.3 May be in:\n2.3.1 Print form\n2.3.2\nElectronic form\n4. Regulatory\nrequirements\nSalient / relevant provisions of the following:\nFDA, DOH, PDEA Administrative Orders and issuances\n5. Disposal\nMay include but not limited to:\n5.1 Returns to supplier\n5.2 Safe destruction according to regulatory requirements and\nenvironmental protection guidelines\n\n--- PDF PAGE 69 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 65\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsistently applied pharmacy policies, standards and\nguidelines, industry legislation and SOPs to dispensing\nstock control tasks including:\n - identified and stored products\n- maintained storage conditions\n - located and positioned dispensing products\n - applied legal disposal of waste\n - applied management procedures to minimize\nselection errors\n1.2\nIdentified and applied procedures for the return of stock\nincluding – the procedures for returning pharmacy\nproducts to supplier/manufacturer and procedures for\nreturned goods from customer to pharmacy.\n1.3\nRead accurately interpreted and consistently applied\ninstructions for performing dispensing stock control\ntasks.\n1.4 Identified and understood different types of stock\ncontrol documents.\n1.5 Sourced, recorded and disseminated stock control\ndocuments\n1.6 Consistently made effective use of time and resources\nby prioritizing tasks.\n1.7 Recognized situations requiring referral to the\npharmacist and/or other pharmacy staff according to\npharmacy policy.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy environment\n2.2 Relevant documents such as:\n - pharmacy policies and procedures for stock control\n- government/regulatory requirements\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1\nObservation with questioning\n3.2 Demonstration with oral questioning\n3.2\nWritten exam\n4. Context of\nassessment\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 70 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 66\n\nUNIT OF COMPETENCY: ARRANGE AND DISPLAY PHARMACEUTICAL\nPRODUCTS\n\nUNIT CODE:"
