        "source_text": "HHC532201\n\nUNIT DESCRIPTOR:\n\nThis unit covers skills and attitude required to apply best\npractices used in the industry and share knowledge\ngained through experience with others in the industry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Seek\ninformation on\nthe industry\n1.1 Sources of\ninformation on the\nindustry are correctly\nidentified and\naccessed\n1.2 Information to assist\neffective work\nperformance is\nobtained in line with\njob requirements\n1.3 Specific information on\nsector of work is\naccessed and updated\n1.4 Industry information is\ncorrectly applied to\nday-to-day work\nactivities\n1.5 Attend to relevant\ncontinuing\nprofessional education\ntrainings\n1.1Knowledge, Theory,\nPractices and\nSystems\nOperations\n1.1.1 Sources of\ninformation for\nindustry updates\n1.1.2 Information\nto assist effective\nwork performance\n1.2 Communications\n1.2.1 Verbal and\nwritten\ncommunication\n1.2.2 Interaction\nwith clients\n1.3 Codes and\nRegulations\n1.3.1 Occupational\nsafety and health\nstandards\n1.3.2 Local\nordinances\n1.3.3 Company\npolicy\n1.4 Values\n1.4.1 Safety and\nhealth\nconsciousness\n1.4.2 Resourceful-\nness\n1.4.3 Diligence\n1.4.4 Time and cost\nconsciousness\n1.4.5 Integrity\n1.4.6 Perseverance\n1.4.7 Ability to work\nwith others\nharmoniously\n\n1.1 Accessing\nreliable\ninformation\nindustry\n1.2 Assessing\nand\nupdating industry\ninformation\nto\neffect\nimproved\nwork\nperformance\n1.3 Applying industry\ninformation\nto\nday-to-day work\nactivities\n1.4 Practicing\ncommunication\nskills\n\n--- PDF PAGE 33 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 29\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Update industry\nknowledge\n2.1 Informal and/or formal\nresearch is used to\nupdate general\nknowledge of the\nindustry.\n 2.2 Updated knowledge is\nshared with customers\nand colleagues as\nappropriate and\nincorporated into day-\nto-day working\nactivities.\n2.1 Knowledge,\nTheory, Practices\nand Systems\nOperations\n2.1.1 Updated\nresearches in\nindustry\nsector\n2.2 Communications\n2.2.1Communication\nskills\n2.2.1 Interaction with\nclients\n2.2.2 Sharing with\ncustomers and\nclients the\nupdated\nindustry\ninformation\n2.3 Codes and\nRegulations\n2.3.1 Company\npolicy\n2.4 Values\n2.4.1 Safety and\nhealth\nconsciousness\n2.4.2 Resourceful-\nness\n2.4.3 Diligence\n2.4.4 Time and cost\nconsciousness\n2.4.5 Integrity\n2.4.6 Ability to work\nwith others\nharmoniously\n2.1 Updating\nknowledge on\nindustry through\nresearch\n2.2 Sharing updated\nknowledge with\ncolleagues and\ncustomers as\nappropriate\n2.3 Practicing\ncommunication\nskills\n\n--- PDF PAGE 34 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sources of\nInformation\nInformation sources may include but are not limited to:\n1.1 Media\n1.2 Reference books\n1.3 Libraries\n1.4 Industry association\n1.5 Industry journals\n1.6 Internet\n1.7 Seminars\n1.8 Forum\n1.9 Personal observation and experience\n2. Information to assist\neffective work\nperformance\n\n2.1 Different sectors of the industry and the services available\nin each sector\n2.2 Relationship between the customer representatives and\nother personnel\n2.3 Relationship between the industry and other industries\n2.4 Industry working conditions\n2.5 Legislation that affects the industry\n2.5.1 drugs and liquor\n2.5.2 health and safety\n2.5.3 hygiene\n2.5.4 workers compensation\n2.5.5 consumer protection\n2.5.6 building regulations\n2.6 Industrial relations issues and major organizations\n2.7 Career opportunities within the industry\n2.8 Work ethic required to work in the industry and industry\nexpectations of staff quality assurance\n\n--- PDF PAGE 35 ---\n