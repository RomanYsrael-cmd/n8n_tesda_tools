          "1. Participate in health promotion and education campaigns 1.1 Health information is provided to patients in accordance with established procedures 1.2 Patients are educated on self- care and rational & responsible use of drug in accordance with established procedures 1.3 Information, education and communication materials are provided to the patients as needed 1.1 Knowledge, Theory and Practices 1.1.1 Top morbidity and mortality list in the community 1.1.2 Treatment algorithm of common diseases 1.1.3 Common drug side effects, precautions, and interactions 1.1.4 Prevailing health issues in the community 1.1.5 Rational use of medicines 1.2 Communication 1.2.1 Patient counseling 1.2.2 Output reports 1.3. Materials, Tools, & Equipment 1.3.1 Electronic references 1.3.2 Literature references 1.3.3 Teaching aids 1.4. Values 1.4.1 Perseverance 1.4.2 Compassion 1.1 Accessing appropriate reference 1.2 Using of screening devices 1.3 Recording of medication profiles 1.4 Filling out forms for referrals 1.5 Effective communication skills (oral and written)",
