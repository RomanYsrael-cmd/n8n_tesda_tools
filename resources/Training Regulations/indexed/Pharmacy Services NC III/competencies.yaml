        "source_text": "HHC532301\n\nUNIT DESCRIPTOR\n:This unit involves procedures for housekeeping following\nappropriate health and safety procedures and good\nhousekeeping practice.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform\nhousekeeping\nduties\n\n1.1 Housekeeping\nprocedures are\nperformed in line with\ncompany policy and\nregulations.\n1.2 Area is kept clean,\nusing appropriate\ncleaning materials\nand methods\n1.3 Tools and\nequipment are\ncleaned and used in\naccordance with\ncompany policies and\nprocedures\n1.4 Housekeeping\nprocedures are\ndocumented in line\nwith company policy\nand regulations\n\n.\n1.1 Knowledge, Theory\nand Practices\n1.1.1 Good Storage\nPractice guidelines\n1.1.2 Pest control\npolicies\n1.2 Communication\n1.2.1\nPreparation of\ninventory reports on\nhouse cleaning tools,\nmaterials, supplies and\nequipment\n1.2.2 Preparation of\nCleaning assignments\n1.3 Safety Practices\n1.3.1 Handling of\nmaterials, supplies,\ntools and equipment\n1.4 Codes and\nRegulations\n1.4.1 OSH\n1.4.2 DOH Hygiene\nand Sanitation\n1.5 Materials, Tools, &\nEquipment\n1.4.5 Brooms\n1.4.6 Mops\n1.4.7 Disinfectants\n1.5 Values\n1.5.1 Reliability\n1.5.2 Resourcefulness\n\n1.5.3 Consistency\n\n1.1 Keeping the\ndispensing/labora\ntory area and\nequipment/tools\nclean\n1.2 Adhering to\ndispensing area\naccess controls\n1.4 Maintaining\npersonal hygiene\n1.5 Following pest\ncontrol guidelines\nand schedules\n1.6Preparing and\norganizing\nrequired\nhousekeeping\ntools in regard to\nhousekeeping/\nmaintenance in\nthe area\n1.6 Maintaining\nconfidentiality and\nprivacy\n1.7 Working with\nothers\nharmoniously\n1.8 Managing routines\nand procedures\n1.9 Reports\ncircumstances/sit\nuations under\nwhich referral to\nthe pharmacist\nand/or other\npharmacy staff is\nindicated\n1.10\nOperational\nskills to\nconsistently use\ntime effectively\n\n--- PDF PAGE 54 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 50\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nand provide quality\ncustomer service\n2. Followhealth\nand safety\npractices in the\narea\n2.1 Procedures to\nachieve a safe\nworking\nenvironment in the\narea are complied\nwith in accordance\nwith DOH/FDA\nsafety standards\n2.2\nIrregularities are\nacted upon in\naccordance with\ncompany policies\nand procedures\n2.3\nDispensing area\naccess controls\nprocedures are\nfollowed in\naccordance with\nFDA policies and\nprocedures\n\n2.1 Knowledge, Theory\nand Practices\n2.1.1 Infection and\nhazard control\n2.1.2 Pest control\n2.1.3 Good storage\npractices\n2.2 Safety Practices\n2.2.1 Handling of\nmaterials,\nsupplies, tools\nand equipment\n2.3 Codes and\nRegulations\n2.3.1 OSH\n2.3.2 DOH:\nSanitation/FDA\n2.3.3 Good Storage\nPractice\n2.4 Values\n2.1.1 Initiative\n2.1.2 Reliability\n2.1.3 Resourcefulness\n2.1.4 Consistency\n2.1.5 Professionalism\n\n2.1 Complying with\nsafe working\nenvironment\nprocedures for\npharmacy\nestablishments\n2.2 Adhering to\ndispensing area\naccess controls\nprocedures\n2.3 Maintaining\npersonal hygiene\n2.4 Preparing and\norganizing\nrequired safety\ntools\n2.5 Communicating\nideas and\ninformation\neffectively\n2.6 Working with\nothers\nharmoniously\n2.7 Operational skills\nto consistently\nuse time\neffectively and\nprovide quality\ncustomer service\n2.8 Using time\neffectively\n2.9 Providing\nservice to\ncustomers\n\n--- PDF PAGE 55 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 51\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Housekeeping procedures\nMay include but are not limited to:\n1.1\nEquipment cleaning and storage\n1.2\nMaintaining pharmacy/laboratory cleanliness\n1.3\nMaintaining drug information & material safety\nhandling sheets\n1.4\nStationery supplies and refurbishing\n1.5\nHousekeeping and cleaning logbook\n2. Regulations\nSalient / relevant provisions of the following:\n2.1\nConsumer Law, Environmental Law, Occupational\nSafety, Health and Welfare Law\n2.2\nGood Storage Practices on Housekeeping\n2.3\nPharmacy Law\n2.4\nFDA and related regulations\n2.5\nPhilippine Practice Standards for Pharmacists\n3. Cleaning materials\nMay include but are not limited to:\n3.1\nDisinfectants at varying strengths\n3.2\nChemical cleaning agents\n3.3\nGloves, protective eyewear\n3.4 Mops, Brooms, Cloth\n4. Cleaning methods\nMay include but are not limited to:\n4.1\nSwabbing, washing\n4.2\nSweeping, wiping\n4.3\n Disinfecting\n4.4\n Soaking\n4.5\nDe-scaling\n5. Tools, equipment and\nconsumable materials\nMay include but are not limited to:\n5.1\nScales, balances and measures\n5.2\nMeters, gauges, beakers\n5.3\nMixers, spatula\n5.4\nFilters\n5.5\nSyringes\n5.6\nPestle and mortars\n6. Procedures to achieve a\nsafe working environment\nMay include but are not limited to:\n6.1\nIdentifying dangerous goods and substances\n6.2\nCorrect handling, storage and disposal of goods\n6.3\nApplication of Occupational Health and Safety\nguidelines\n6.4\nEnsuring shelves are not overstocked\n6.5\nEnsuring floors are not slippery or cluttered\n6.6\nEnsuring access to equipment (e.g. high shelves)\nis appropriate\n6.7\nEnsure equipment and devices used are not faulty\n\n--- PDF PAGE 56 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 52\nVARIABLE\nRANGE\n7. Area\nMay include but is not limited to:\n7.1\nWorking Surfaces\n7.2\nSinks\n7.3\nBenches-apparatus\n7.4\nShelves\n7.5\nContainers\n7.6\nDispensing containers\n7.7\nClothing or similar items\n7.8\nFloors, walls, ceilings\n8. Dispensing area access\ncontrols\nMay include but are not limited to:\nKeys, swipe cards etc. for access to remain with registered\npharmacist\nPerson other than the pharmacist or pharmacy assistant\nmust be under direct supervision of pharmacist while in\ndispensing area\n\n--- PDF PAGE 57 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 53\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1 Housekeeping procedures are performed in line with\ncompany policy and regulations.\n1.2 Area is kept clean, using appropriate cleaning\nmaterials and methods\n1.3 Tools and equipment are cleaned and used in\naccordance with company policies and procedures\n2.2 All unusual situations are identified and reported to the\npharmacist.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 A real or simulated pharmacy work premises\n2.2 Relevant documents such as:\n- pharmacy policies and procedures\n- Good pharmacy practice\n- government policies as appropriate\n- housekeeping procedures\n2.3 Access to a range of housekeeping/maintenance\ntasks and equipment\n2.4 A qualified workplace assessor and/or a technical\nexpert working in partnership with the assessor\nMethod of assessment\nCompetency may be assessed through:\n3.1\nObservation with questioning\n3.2\nWritten exam\n4. Context of assessment\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 58 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 54\n\nUNIT OF COMPETENCY\n: MONITORSUPPLY/INVENTORY OF\n\nPHARMACEUTICAL PRODUCTS\n\nUNIT CODE\n\n:"
