ommunication\nprocedures and\nsystems\n1.2.4 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n1.3 Codes and\nRegulations\n1.1 Interpersonal\ncommunication\nskills required in\nclient contact\nassignments\n1.2 Customer\nservice skills\nrequired to meet\nclient/customer\nneeds\n1.3 Deliver correct\ninformation to\nthe patient in a\nprofessional\nmanner\n1.4 Treat\npatients/clients\nwith respect\n\n--- PDF PAGE 28 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 24\n1.3.1 Uniform and\npersonal grooming\nrequirements of the\nemployer\n1.3.2 Occupational\nhealth and safety\n1.4 Value\n1.4.1 Punctuality\n1.4.2 Orderliness\n1.4.3 Patience\n1.4.4 Professionalism\n\n2. Meet\nclient/customer\nrequirements\n2.1 Client requirements\nidentified and\nunderstood by referral\nto the assignment\ninstructions\n2.2 Client requirements\nmet according to the\nassignment\ninstructions\n2.3 Changes to client’s\nneeds and\nrequirements\nmonitored and\nappropriate action\ntaken\n2.4 All communication\nwith the client or\ncustomer is clear and\ncomplies with\nassignment\nrequirements\n\n2.1 Knowledge, Theory\nand Practices\n2.1.1 Customer service\n2.1.2 Telephone\nconversation\ntechniques\n2.1.3 Problem solving\nand negotiation\n2.2 Communication\n2.2.1 Different modes\nof communication\n2.2.2 Organizational\npolicies\n2.2.3 Communication\nprocedures and\nsystems\n2.2.4 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.3 Codes and\nRegulations\n2.3.1 Pharmacists'\nCode of Ethics\n2.3.2 Patient’s rights\n2.3.3 Philippine\nPractice\nStandards for\nPharmacists\n2.4 Values\n2.4.1 Patience\n2.1 Attention to\ndetail when\ncompleting\nclient/employer\ndocumentation\n2.2 Interpersonal\ncommunication\nskills required in\nclient contact\nassignments\n2.3 Customer\nservice skills\nrequired to meet\nclient/customer\nneeds\n2.4 Maintain records\n\n3. Build credibility\nwith\ncustomers/clients\n3.1 Client expectations\nfor reliability,\npunctuality and\nappearance adhered\nto\n3.2 Possible causes of\nclient/customer\ndissatisfaction\nidentified, dealt with\nand recorded\naccording to\nemployer policy\n3.1 Knowledge, Theory\nand Practices\n3.1.1 Customer\nservice principles\n3.2 Communication\n3.2.1 Different modes\nof communication\n3.2.2 Organizational\npolicies\n3.2.3 Communication\nprocedures and\nsystems\n3.2.4 Technology\nrelevant to the\n3.1 Demonstrate\ngenuine concern\nfor the welfare of\nthe patients\n3.2 Interpersonal\ncommunication\nskills required in\nclient contact\nassignments\n3.3 Customer\nservice skills\nrequired to meet\n\n--- PDF PAGE 29 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 25\n\n3.3 Client fully informed of\nall relevant security\nmatters in a timely\nmanner and\naccording to agreed\nreporting procedures\nenterprise and the\nindividual’s work\nresponsibilities\n3.3 Codes and\nRegulations\n2.4.2 Pharmacists'\nCode of Ethics\n2.4.3 Patient’s rights\n2.4.4 PhilPSP\n3.4 Values\n3.4.1 Trust\n3.4.2 Integrity\nclient/customer\nneeds\n\n--- PDF PAGE 30 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 26\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Personal Presence\n\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanor\n1.5\nGrooming\n2. Employer Standards\nMay include:\n2.1 Standing Orders\n2.2 Efficiency\n2.3 Client turn-around time\n3. Client Requirements\nMay include:\n3.1\nAssignment instructions (eg, right products)\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of changed\nsituations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1\nWriting\n4.2\nVerbally\n4.3\nElectronically\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n7. Customers\nMay include:\nAll members of the public\n\n--- PDF PAGE 31 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 27\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained a professional image.\n1.2\nInterpreted client/customer requirements from\ninformation contained in the client brief and/or\nassignment instructions.\n1.3\nDealt successfully with a variety of client/customer\ninteractions.\n1.4\nMonitored and acted on varying client or customer\nneeds.\n1.5\nMet client/customer requirements.\n1.6\nBuilt credibility with customers/clients.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1\nAssessment centers/venues\n2.2\n Accredited assessors\n2.3\nEvaluation reports\n2.4\nAccess to a relevant venue, equipment and materials\n2.5\nAssignment instructions\n2.6\nLogbooks\n2.7\nOperational manuals and makers’/customers’\ninstructions (if relevant)\n2.8\nAssessment Instruments, including personal planner\nand assessment record book\n3. Method of\nassessment\nCompetency may be assessed through:\n3.1\nWritten Test/Examination\n3.2\nDemonstration with questioning\n3.3\nObservation\n4. Context of\nassessment\n3.1\nCompany\n3.2\nOn-Site\n3.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment\n3.4\nContinuous assessment in the workplace, taking into\naccount the range of variables affecting performance\n\n--- PDF PAGE 32 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 28\nUNIT OF COMPETENCY:\nUPDATE INDUSTRY KNOWLEDGE AND PRACTICE\nTHROUGH CONTINUING EDUCATION\n\nUNIT CODE:\n HHC532201\n\nUNIT DESCRIPTOR:\n\nThis unit covers skills and attitude required to apply best\npractices used in the industry and share knowledge\ngained through experience with others in the industry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Seek\ninformation on\nthe industry\n1.1 Sources of\ninformation on the\nindustry are correctly\nidentified and\naccessed\n1.2 Information to assist\neffective work\nperformance is\nobtained in line with\njob requirements\n1.3 Specific information on\nsector of work is\naccessed and updated\n1.4 Industry information is\ncorrectly applied to\nday-to-day work\nactivities\n1.5 Attend to relevant\ncontinuing\nprofessional education\ntrainings\n1.1Knowledge, Theory,\nPractices and\nSystems\nOperations\n1.1.1 Sources of\ninformation for\nindustry updates\n1.1.2 Information\nto assist effective\nwork performance\n1.2 Communications\n1.2.1 Verbal and\nwritten\ncommunication\n1.2.2 Interaction\nwith clients\n1.3 Codes and\nRegulations\n1.3.1 Occupational\nsafety and health\nstandards\n1.3.2 Local\nordinances\n1.3.3 Company\npolicy\n1.4 Values\n1.4.1 Safety and\nhealth\nconsciousness\n1.4.2 Resourceful-\nness\n1.4.3 Diligence\n1.4.4 Time and cost\nconsciousness\n1.4.5 Integrity\n1.4.6 Perseverance\n1.4.7 Ability to work\nwith others\nharmoniously\n\n1.1 Accessing\nreliable\ninformation\nindustry\n1.2 Assessing\nand\nupdating industry\ninformation\nto\neffect\nimproved\nwork\nperformance\n1.3 Applying industry\ninformation\nto\nday-to-day work\nactivities\n1.4 Practicing\ncommunication\nskills\n\n--- PDF PAGE 33 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 29\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Update industry\nknowledge\n2.1 Informal and/or formal\nresearch is used to\nupdate general\nknowledge of the\nindustry.\n 2.2 Updated knowledge is\nshared with customers\nand colleagues as\nappropriate and\nincorporated into day-\nto-day working\nactivities.\n2.1 Knowledge,\nTheory, Practices\nand Systems\nOperations\n2.1.1 Updated\nresearches in\nindustry\nsector\n2.2 Communications\n2.2.1Communication\nskills\n2.2.1 Interaction with\nclients\n2.2.2 Sharing with\ncustomers and\nclients the\nupdated\nindustry\ninformation\n2.3 Codes and\nRegulations\n2.3.1 Company\npolicy\n2.4 Values\n2.4.1 Safety and\nhealth\nconsciousness\n2.4.2 Resourceful-\nness\n2.4.3 Diligence\n2.4.4 Time and cost\nconsciousness\n2.4.5 Integrity\n2.4.6 Ability to work\nwith others\nharmoniously\n2.1 Updating\nknowledge on\nindustry through\nresearch\n2.2 Sharing updated\nknowledge with\ncolleagues and\ncustomers as\nappropriate\n2.3 Practicing\ncommunication\nskills\n\n--- PDF PAGE 34 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sources of\nInformation\nInformation sources may include but are not limited to:\n1.1 Media\n1.2 Reference books\n1.3 Libraries\n1.4 Industry association\n1.5 Industry journals\n1.6 Internet\n1.7 Seminars\n1.8 Forum\n1.9 Personal observation and experience\n2. Information to assist\neffective work\nperformance\n\n2.1 Different sectors of the industry and the services available\nin each sector\n2.2 Relationship between the customer representatives and\nother personnel\n2.3 Relationship between the industry and other industries\n2.4 Industry working conditions\n2.5 Legislation that affects the industry\n2.5.1 drugs and liquor\n2.5.2 health and safety\n2.5.3 hygiene\n2.5.4 workers compensation\n2.5.5 consumer protection\n2.5.6 building regulations\n2.6 Industrial relations issues and major organizations\n2.7 Career opportunities within the industry\n2.8 Work ethic required to work in the industry and industry\nexpectations of staff quality assurance\n\n--- PDF PAGE 35 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 31\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Knew key sources of information on the industry\n1.2 Updated industry knowledge\n1.3 Accessed and used industry information\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Sources of information on the industry\n2.2 Industry knowledge\n\n3. Methods of\nassessment\nCompetency may be assessed through:\n3.1 Interview/questions\n3.2 Practical demonstration\n3.3 Portfolio of industry information related to trainee’s work\n\n4. Context of\nassessment\nCompetency may be assessed individually in the workplace or\nin a simulated workplace setting.\n\n--- PDF PAGE 36 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 32\nUNIT OF COMPETENCY\n: PERFORM WORKPLACE SECURITY AND SAFETY\n\nPRACTICES\n\nUNIT CODE\n: TRS311204\n\nUNIT DESCRIPTOR\n: This unit of competency deals with the knowledge,\n\nskills and attitudes in following health, safety and\n\nsecurity practices. It includes dealing with emergency\n\nsituations and maintaining safe personal presentation standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Follow\nworkplace\nprocedures for\nhealth, safety\nand security\npractices\n\n1.1 Correct health,\nsafety and\nsecurity\nprocedures are\nfollowed in line with\nlegislation and\nenterprise\nprocedures.\n1.2 Breaches of health,\nsafety and security\nprocedures are\nidentified and\nreported in line with\nenterprise\nprocedure.\n1.3 Suspicious\nbehavior or\nunusual\noccurrences are\nreported in line\nwith enterprise\nprocedure.\n1.1 Knowledge, Theory,\nPractices and Systems\nOperations\n1.1.1 Correct health,\nsafety and security\nprocedures\n1.1.2 Types of\nbreaches of health,\nsafety and security\nprocedures\n1.2 Communications\n1.2.1 Verbal and\nwritten\ncommunication\n1.2.1 Interaction with\nclients\n1.3 Safety\n1.3.1 Personal Safety\nEquipment\n1.3.2 Work hazards\n1.4 Codes and\nRegulations\n1.4.1 Occupational\nsafety and health\nstandards\n1.4.2 RA 9003\n1.4.3 RA 6969\n1.4.4 Local ordinances\n1.5 Values\n1.5.1 Safety and\nhealth consciousness\n1.5.2 Resourcefulness\n1.5.3 Diligence\n1.5.4 Time and cost\nconsciousness\n1.5.5 Integrity\n1.5.6 Perseverance\n1.5.7 Ability to work\nwith others\nharmoniously\n1.1 Knowing the\nsources of\ninformation on the\nindustry\n1.2 Assessing and\nupdating industry\ninformation to effect\nimproved work\nperformance\n1.3 Applying industry\ninformation to day-\nto-day work\nactivities\n1.4 Practicing\ncommunication\nskills\n\n--- PDF PAGE 37 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 33\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Deal with\nemergency\nsituations\n2.1 Emergency and\npotential\nemergency\nsituations are\nrecognized and\nappropriate actions\nare taken within\nindividual’s scope\nof responsibility.\n2.2 Emergency\nprocedures are\nfollowed in line with\nenterprise\nprocedures.\n2.3\nAssistance is\nsought from\ncolleagues to\nresolve or respond\nto emergency\nsituation.\n2.4\nDetails of\nemergency\nsituations are\nreported in line\nwith enterprise\nprocedures.\n2.1 Knowledge, Theory,\nPractices and Systems\nOperations\n2.1.1 Types of emergency\nsituations and\nprocedures\n2.2Communications\n2.2.1 Verbal and written\ncommunication\n2.2.2 Interaction with\nclients\n2.3 Safety\n2.3.1 Personal Safety\nEquipment\n2.3.2 Work hazards\n2.4 Codes and\nRegulations\n2.4.1 Occupational safety\nand health\nstandards\n2.4.2 RA 9003\n2.4.3 RA 6969\n2.4.4 Local ordinances\n2.5 Values\n2.5.1 Safety and health\nconsciousness\n2.5.2 Resourcefulness\n2.5.3 Diligence\n2.5.4 Time and cost\nconsciousness\n2.5.5 Integrity\n2.5.6 Perseverance\n2.6 Ability to work with\nothers harmoniously\n2.1 Practicing intra and\ninterpersonal skills\n2.2 Applying appropriate\nactions to\nemergencies\n2.3 