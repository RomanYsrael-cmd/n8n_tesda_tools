        "source_text": "500311110\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements\nare identified and\npresented to team\nmembers\n1.2 Reasons for\ninstructions and\nrequirements are\ncommunicated to\nteam members\n1.3 Team members’\nqueries and\nconcerns are\nrecognized, discussed\nand dealt with\n\n1.1 Company policies\nand procedures\n1.1.1 How\nperformance\nexpectations are set\n1.1.2 Methods of\nMonitoring\nPerformance\n1.2 Client expectations\n1.3 Definition of Team\n1.4 Team member’s\nduties and\nresponsibilities\n1.5 Skills and\ntechniques in\npromoting team\nbuilding\n1.6 Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n1.7 Art of listening and\ntreating individual\nteam members\nconcern\n1.1 Communication skills\nrequired for leading\nteams\n1.2 Team building skills\n1.3 Negotiating skills\n1.4 Evaluation skills\n2. Assign\nresponsibilities\n2.1 Duties and\nresponsibilities are\nassigned in\nconsideration of skills,\nknowledge, and\naptitude required to\nproperly undertake\nthe task and\naccording to company\npolicy\n2.2 Duties are delegated\naccording to individual\npreference, domestic\nand personal\nconsiderations,\nwhenever possible\n2.1 Concept of\ndelegation\n2.2 Understanding\nindividual\ndifferences\n2.3 Methods of\nmonitoring\nperformance\n2.4 Duties and\nresponsibilities of\neach team member\n2.5 Knowledge in\nidentifying each\nteam member\nduties and\nresponsibilities\n2.1 Delegating skills\n2.2 Identifying individual\nskills, knowledge and\nattitude as basis for\nallocating\nresponsibilities\n2.3 Identifying each team\nmember duties and\nresponsibilities\n\n--- PDF PAGE 10 ---\nTESDA-SOPQSO-01-F08\nTR- PHARMACY SERVICES NC III Promulgated Dec. 16, 2015 Page 6\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance\nexpectations are\nestablished based on\nclient needs and\naccording to\nassignment\nrequirements\n3.2 Performance\nexpectations are\nbased on individual\nteam members duties\nand area of\nresponsibility\n2.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team\nmembers\n3.1 Definition of\nperformance\nindicators/ criteria\n3.2 Definition of team\ngoals and\nexpectations\n3.3 Methods of\nmonitoring\nperformance\n3.4 Client expectations\n3.5 Team members\nduties and\nresponsibilities\n3.6 Defining\nperformance\nexpectations criteria\n3.1 Identifying\nperformance\nindicators\n3.2 Evaluating\nperformance\n3.3 Setting individual\nperformance target/\nexpectation\nindicators\n4. Supervise team\nperformance\n4.1 Monitoring of\nperformance takes\nplace against defined\nperformance criteria\nand/or assignment\ninstructions and\ncorrective action taken\nif required\n4.2 Team members are\nprovided with\nfeedback, positive\nsupport and advice on\nstrategies to\novercome any\ndeficiencies\n4.3 Performance issues\nwhich cannot be\nrectified or addressed\nwithin the team are\nreferenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are\nkept informed of any\nchanges in the priority\nallocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs\nand satisfaction\n4.5 Team operations are\nmonitored to ensure\nthat employer/client\n4.1 Understanding,\nmonitoring of work\n4.2 How to undertake\ncorrective and\npreventive action\n4.3 Understanding\nfeedback and\nprocedure\n4.4 Feedback reporting\nprocedure\n4.5 Methods of\nmonitoring\nperformance\n4.6 Team member’s\nduties and\nresponsibilities\n4.7 Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n\n4