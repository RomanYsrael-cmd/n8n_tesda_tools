    },
    {
      "source_text": "Local health regulations 2.2 Appropriate technical and culinary terms for coffee shop operations 2.3 Coffee shop equipment, its functions and routine maintenance 2.4 Varieties and characteristics of menu items offered 2.5 Underlying principles of making cakes, pastries, and savoury items 2.6 Commodity knowledge, including quality indicators of ingredients 2.7 Storage conditions for menu items and optimizing shelf-life, freshness and eating qualities 3. Underpinning skills 3.1 Organizational skills and teamwork 3.2 Menu planning and menu design 3.3 Preparation of pastries, cakes and savoury products 3.4 Costing, yield testing and portion control 3.5 Handling, portioning and serving ice creams 3.6 Buffet and table set-ups 3.7 Coffee and tea preparation and beverage service 3.8 Defining and applying quality control 3.9 Time management skills 3.10 Communication skills"
    },
