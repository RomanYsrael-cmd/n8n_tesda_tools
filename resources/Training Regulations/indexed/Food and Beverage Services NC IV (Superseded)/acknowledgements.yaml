      "source_text": "CORE COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : OPERATE A FOOD OUTLET"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512368"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the preparation and service of foods in an outlet in various venues in the hospitality and tourism industry."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Prepare for service 1.1 Quantities and quality of products and food items are checked and restocking is done where necessary. 1.2 Mise-en-place in the kitchen is checked to ensure sufficient and appropriate food items are prepared in order to commence service. 1.3 Mise-en-place in the service area is checked to ensure completeness, efficiency and timeliness before service commences. 1.4 Ongoing requirements for additional food items are met at an appropriate time. 1.5 Display of service area and food items are inspected to ensure cleanliness, hygiene and attractiveness. 1.6 Personal presentation and hygiene of staff are checked to ensure requirements are met and maintained throughout service. 1.7 Mise-en-place and cooking are checked to ensure they are carried out in accordance with safety and hygiene requirements."
    },
    {
      "source_text": "-- PDF PAGE 57 --- _________________________________________________________________________________________________55 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "2. Provide quality customer service 2.1 Customer requirements in terms of speed of service, quantity, quality, additions and modifications to standard recipes and special requirements are determined and met. 2.2 Use of customer service skills is checked to ensure polite, efficient and effective service. 2.3 Assistance to customers is checked to ensure that it is provided, where required, in selection of food items. 2.4 Use of selling skills is checked to ensure that they are appropriately employed according to enterprise procedures. 2.5 Correct operation of equipment is checked to ensure safety and compliance with manufacturer’s instructions and principles of occupational health and safety. 2.6 Work is organized and, where appropriate, in consultation with other team members, to ensure that food is prepared or cooked in a timely manner and ongoing customer service is provided. 3. Ensure quality of food 3.1 Compliance with principles of food safety is ensured during the entire food production process. 3.2 Portion control is checked to ensure compliance with enterprise standards and in order to minimize waste. 3.3 Food presentation is checked to ensure attractiveness, absence of drips or spills, and use of appropriate hot or cold storage/presentation equipment 4. Manage storage of food 4.1 Storage of food items is checked to ensure compliance with principles and practices of hygiene and food safety. 4.2 Stock monitoring, accounting and reordering are checked to ensure that they are conducted according to enterprise procedures when required."
    },
    {
      "source_text": "-- PDF PAGE 58 --- _________________________________________________________________________________________________56 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "5. Ensure equipment is properly cleaned and maintained 5.1 Equipment maintenance is monitored to ensure compliance with manufacturer’s instructions. 5.2 Cleaning of equipment is checked to ensure that it is done where required before, during and after completion of service."
    },
    {
      "source_text": "-- PDF PAGE 59 --- _________________________________________________________________________________________________57 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE"
    },
    {
      "source_text": "1. Mise-en-place May include but is not limited to: 1.1 Assembling and preparing ingredients for menu items 1.2 Cleaning, peeling and slicing fruits and vegetables 1.3 Preparing simple food items such as salads, sandwiches, garnishes, coatings and batters 1.4 Selection and handling (thawing, reconstituting, regenerating, reheating) of portion controlled and convenience products 1.5 Display of goods in appropriate storage facility 2. Equipment May include but are not limited to: 2.1 Microwaves 2.2 Deep fryers 2.3 Hot plates 2.4 Rotisseries 2.5 Pans and urns 2.6 Bains marie 2.7 Food warmers"
    },
    {
      "source_text": "-- PDF PAGE 60 --- _________________________________________________________________________________________________58 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidences that the candidate: 1.1 Supervised the application of hygiene and safety principles and procedures 1.2 Organized the preparation of a range of foods efficiently and within realistic industry timeframes 1.3 Ensured the quality of customer service within the context of enterprise policies and procedures 2. Underpinning knowledge 2.1 Range of basic cooking skills appropriate to the enterprise which may include:"
    },
    {
      "source_text": "Hot plate"
    },
    {
      "source_text": "Reheating"
    },
    {
      "source_text": "Microwaving"
    },
    {
      "source_text": "Baking"
    },
    {
      "source_text": "Roasting"
    },
    {
      "source_text": "Boiling"
    },
    {
      "source_text": "Char-grilling, barbecue 2.2 Principles of personal and food hygiene 2.3 Safe work practices as required by Occupational Healtn and Safety legislation and guidelines 2.4 Product knowledge of range of food offered 3. Underpinning skills 3.1 Practices of personal and food hygiene 3.2 Customer service and communication skills 3.3 Waste minimization techniques and environmental considerations in specific relation to the operation of the outlet 4. Resource implications The following resources MUST be provided: 4.1 An environment containing sufficient and appropriate food service and cooking equipment for the preparation and service of food items, to reflect commercial operating practice 4.2 Use of real ingredients 4.3 Preparation and service of food items for customers on more than one occasion and within industry-realistic time constraints 5. Methods of assessment Competency may be assessed through: 5.1 Direct observation of the candidate preparing, cooking and serving food items. 5.2 Sampling of items prepared by the candidate. 5.3 Inspection of a food service area set up and operated by the candidate 5.4 Oral or written questions to test knowledge of hygiene and occupational health and safety issues related to the cooking and service of food in a particular outlet 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate."
    },
    {
      "source_text": "-- PDF PAGE 61 --- _________________________________________________________________________________________________59 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "6. Context for assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
    {
