    {
      "source_text": "ELECTIVE COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PLAN COFFEE SHOP LAYOUT, MENU AND STORAGE (COFFEE SHOP)"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512370"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the layout, menu and storage aspects of planning a coffee shop which serves patisserie items. It deals with the production, display and service of patisserie products and suitable beverages."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Plan coffee shop layout 1.1 Floor plan for kitchen, service, display and storage areas is developed according to anticipated customer requirements and volume. 1.2 Fixtures, furnishing, décor, and equipment are planned according to business objectives, budget, and style of coffee shop required. 2. Plan the product and service elements of coffee shop operation 2.1 Menu is planned and designed, identifying a range of appropriate menu items and beverages to meet market needs. 2.2 Workflow schedule for production and service is prepared according to expected customer volume and menu requirements, taking into consideration available facilities, staff, time, equipment and enterprise practices. 2.3 Display of items is planned considering style of coffee shop, required storage temperatures, and visual appeal."
    },
    {
      "source_text": "-- PDF PAGE 74 --- _________________________________________________________________________________________________72 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "3. Plan and organize the storage for coffee shop menu items 3.1 Proper storage for pastries, cakes, and savoury items at the correct temperatures is planned and organized according to food safety requirements and to maximize shelf life and product quality. 3.2 Packaging that is appropriate for the preservation of freshness, taste and eating characteristics is planned."
    },
    {
