      "source_text": "DEFINITION OF TERMS"
    },
    {
      "source_text": "1. APERITIF - is any drink taken before meals, to improve your appetite"
    },
    {
      "source_text": "2. BARISTA - a professional operator of an espresso machine"
    },
    {
      "source_text": "3. BREWING - a stage in making beer in which worth is boiled with hops"
    },
    {
      "source_text": "4. BUSBOY - refers to the dining room helper and runner, title given to a Food and Beverage Service Attendant, National Certificate I"
    },
    {
      "source_text": "5. BUSSED OUT - taking out soiled plates/dishes from the dining area to dishwashing area"
    },
    {
      "source_text": "6. CAFFE LATTE – a type of coffee drink made with hot milk"
    },
    {
      "source_text": "7. CAFFE MACCHIATO – (also known as espresso macchiato) an espresso with a teaspoon of milk in it, and a small “spot” of foam on top of the crema, traditionally to show the beverage has milk in it – a “marked” espresso. This drink is the traditional variation."
    },
    {
      "source_text": "8. CAPPUCCINO – an Italian beverage prepared with espresso coffee, hot milk and milk foam"
    },
    {
      "source_text": "9. CAPTAIN FOOD AND BEVERAGE SERVICE ATTENDANT - refers to the supervisor of The Food and Beverage Service Attendant, also refers to Food and Beverage Service Attendant, National Certificate Level I."
    },
    {
      "source_text": "10. COCKTAIL - is a well-mixed drink made up of base liquor, a modifying ingredient as a modifier and special flavoring of coloring agents. It is usually an aperitif taken at leisure before a meal to whet the appetite."
    },
    {
      "source_text": "11. COMMIS - refers to the category according to the extent of difficulty and complexity of skills and knowledge required for the job."
    },
    {
      "source_text": "12. COMMUNICATION - the transfer of ideas through verbal and non-verbal communication"
    },
    {
      "source_text": "13. CORDIAL/ LIQUEUR - a spirits that are sweetened and flavor with natural flavors"
    },
    {
      "source_text": "14. CUTLERY – refers to knives and other cutting implements"
    },
    {
      "source_text": "15. DEMITASSE – a small cup used to serve Turkish coffee or espresso. It is half of a full coffee cup, a tasse."
    },
    {
      "source_text": "16. DISH OUT - food taken from the kitchen to the dining area"
    },
    {
      "source_text": "17. DISTILLATION - a process involving continuous evaporation and condensation of liquid wherein higher alcohol content could be obtained"
    },
    {
      "source_text": "-- PDF PAGE 94 --- _________________________________________________________________________________________________92 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "18. ESPRESSO – a concentrated coffee beverage brewed by forcing very hot, but not boiling, water under high pressure through coffee that has been ground to a consistency between extremely fine and coarse powder."
    },
    {
      "source_text": "19. FERMENTATION - an action of yeast upon a sugar in solution, which breaks down the sugar into carbon dioxide and alcohol"
    },
    {
      "source_text": "20. FLAMBE’ - flamed with spirit or liqueur"
    },
    {
      "source_text": "21. FLATWARE - it denotes all forms of spoons and forks"
    },
    {
      "source_text": "22. FOOD AND BEVERAGE SERVICE ATTENDANT - refers to the workers assigned in the service of food and beverage to the guests, also known as waiter."
    },
    {
      "source_text": "23. GARNISH - an ingredient which decorates, accompanies or completes a dish. Many dishes are identified by the name of their garnishes"
    },
    {
      "source_text": "24. HIGHBALL DRINK - is a tall drink consisting of a shot of specified spirit with mixers such as sodas, water, etc. serve with cube ice in a highball glass"
    },
    {
      "source_text": "25. HOLLOWWARE – consists of any item made from silver e.g. teapots, milk jugs, sugar, basins, oval flats"
    },
    {
      "source_text": "26. LATTE MACCHIATO – steamed milk served in a glass with ½ shot espresso or less poured through it, leaving a “spot” of crema to indicate this is not a caffe latte, but a latte macchiato – “marked” milk."
    },
    {
      "source_text": "27. LEVEL / CLASS - refers to the category according to the extent of difficulty and complexity of skills and knowledge required of the jobs."
    },
    {
      "source_text": "28. LONG OR TALL DRINK - is a mixed drinks that are served in tall glasses"
    },
    {
      "source_text": "29. MENU - a list in specific order of the dishes to be served at a given meal"
    },
    {
      "source_text": "30. MISE EN PLACE - French term for having all ingredients in ready to use Preparation before service"
    },
    {
      "source_text": "31. PRE-DINNER - short mixed drinks that are basically dry in taste and are usually served before a meal to wet the appetite"
    },
    {
      "source_text": "32. SILVERWARE - tableware made of solid silver, silver gilt or silver metal. Silver plate made from single strip of plated metal"
    },
    {
      "source_text": "33. SPIRITS - are drinks obtained by distillation after fermentation from vegetables, grains, fruits, plants and other substance with sugar or starch-based"
    },
    {
      "source_text": "34. TABLE NAPKIN - an individual piece of linen which is used to protect the clothing or wipe the mouth during a meal"
    },
    {
      "source_text": "-- PDF PAGE 95 --- _________________________________________________________________________________________________93 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "35. TABLEWARE - is a term recognized as embracing all items of flatware, cutlery, hollowware"
    },
    {
      "source_text": "36. VIENNA – a medium to dark roast of coffee"
    },
    {
      "source_text": "Other Terms Used :"
    },
    {
      "source_text": "Captain Waiter – Chef de Etage"
    },
    {
      "source_text": "Chef – a person who prepares food as an occupation in restaurant, private house, hotel"
    },
    {
