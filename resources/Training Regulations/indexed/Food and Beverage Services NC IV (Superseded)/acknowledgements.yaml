    },
    {
      "source_text": "3.6 TRAINER’S QUALIFICATIONS FOR TOURISM SECTOR (HOTELS AND RESTAURANTS)"
    },
    {
      "source_text": "FOOD BEVERAGE SERVICE NCIV"
    },
    {
      "source_text": "TRAINER'S QUALIFICATIONS (TQ IV)"
    },
    {
      "source_text": "Must have completed a Trainers Training Methodology Course (TM IV) or its equivalent"
    },
    {
      "source_text": "Must have at least 3-5 years job/industry experience"
    },
    {
      "source_text": "Must be physically and mentally fit"
    },
    {
      "source_text": "Must be a holder of Food and Beverage Service NC level IV certificate or equivalent"
    },
    {
      "source_text": "Must be of good moral character"
    },
    {
      "source_text": "With pleasing personality"
    },
    {
      "source_text": "Must have attended relevant training and seminars"
    },
    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional assessment is undertaken by trainees to determine their achievement of units of competency. A certificate of achievement is issued for each unit of competency."
    },
    {
      "source_text": "-- PDF PAGE 91 --- _________________________________________________________________________________________________89 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 The qualification of FOOD AND BEVERAGE SERVICE NC IV may be attained through:"
    },
    {
      "source_text": "4.1.1 Demonstration of competence in all the core units of competency listed below:"
    },
    {
      "source_text": "4.1.1.1 Operate a food outlet 4.1.1.2 Prepare tenders for catering contracts 4.1.1.3 Develop a food safety program"
    },
    {
      "source_text": "Successful candidates shall be awarded a National Certificate (NC) on Food and Beverage Service NCIV (Restaurant) bearing the signature of the Director General."
    },
    {
      "source_text": "4.1.2 Candidates who demonstrate competence in all the core units plus the elective unit “Plan coffee shop layout, menu and storage (Coffee Shop)” will be awarded a National Certificate (NC) on Food and Beverage Service NCIV (Restaurant and Coffee Shop) bearing the signature of the Director General."
    },
    {
      "source_text": "4.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.3 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.3.1 Graduates of formal, non-formal and informal institutions including enterprise-based training programs"
    },
    {
      "source_text": "4.3.2 Experienced workers (wage employed or self employed)"
    },
    {
      "source_text": "4.4 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)\"."
    },
    {
      "source_text": "-- PDF PAGE 92 --- _________________________________________________________________________________________________90 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "COMPETENCY MAP - TOURISM Sector (Hotels and Restaurants) FOOD AND BEVERAGE SERVICE NC IV"
    },
    {
      "source_text": "ANNEX A Collect, analyze and organize information Plan and organize work Promote environmental protection Utilize specialized communication skills Develop teams and individuals Apply problem- solving techniques in the workplace Use mathematical concepts and techniques Use relevant technologies Lead small teams Develop and practice negotiation skills Solve problems related to work activities Practice career professionalism Practice occupational health and safety practices Lead workplace communication Participate in workplace communication Work in team environment Roster staff Control and order stock Perform computer operations Perform workplace and safety practices Provide effective customer service Develop and update industry knowledge Observe workplace hygiene procedures"
    },
    {
      "source_text": "BASIC COMPETENCIES COMMON COMPETENCIES CORE COMPETENCIES Establish and conduct business relationships Train small groups Conduct assessment Manage workplace diversity Manage finances within a budget Manage quality customer service"
    },
    {
