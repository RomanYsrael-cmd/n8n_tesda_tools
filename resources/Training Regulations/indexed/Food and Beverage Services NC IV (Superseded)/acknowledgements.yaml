      "source_text": "Course Description:"
    },
    {
      "source_text": "This course is designed to enhance the knowledge, skills and attitudes in overseeing restaurant operations in accordance with industry standards. It covers core competencies on operating a food outlet, preparing tenders for catering contracts, developing a food safety program and planning for coffee shop operations. It also includes competencies in developing teams and individuals, applying problem-solving techniques, collecting, analyzing and organizing information, planning and organizing work, conducting assessment, and managing workplace diversity, finances, and quality customer service."
