    {
      "source_text": "UNIT OF COMPETENCY : MANAGE FINANCES WITHIN A BUDGET"
    },
    {
      "source_text": "UNIT CODE : TRS311212"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes"
    },
    {
      "source_text": "required to take responsibility for budget management where others may have developed the budget."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 1. Allocate budget resources 1.1 Funds are allocated according to agreed priorities. 1.2 Changes in income and expenditure priorities are discussed with appropriate colleagues prior to implementation. 1.3 All relevant personnel are consulted and informed in relation to resource decisions. 1.4 Awareness of the importance of budget control is promoted. 1.5 Detailed records of resource allocation are maintained in accordance with enterprise control systems. 2. Monitor financial activities against budget 2.1 Actual income and expenditure are checked against budgets accurately and at regular intervals. 2.2 Financial commitments are included in all documentation to ensure accurate monitoring. 2.3 Deviations are identified and reported according to company policy and significance of deviation. 2.4 Appropriate options for more effective management of deviations are investigated. 2.5 Appropriate colleagues are advised of budget status in relation to targets within agreed timeframes."
    },
    {
      "source_text": "-- PDF PAGE 47 --- _________________________________________________________________________________________________45 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 3. Identify and evaluate options for improved budget performance 3.1 Existing costs and resources are assessed and areas for improvement are identified. 3.2 Desired outcomes are discussed with relevant colleagues. 3.3 Appropriate research is conducted to investigate new approaches. 3.4 Benefits and disadvantages of new approaches are defined and clearly communicated. 3.5 Impacts on customer service levels and colleagues are considered when developing new approaches. 3.6 Recommendations are presented clearly and logically to the appropriate person/department. 4. Complete financial reports 4.1 All required financial reports are completed accurately and within designated timelines. 4.2 Clear and concise information are produced to enable informed decision-making. 4.3 Reports are promptly forwarded to the appropriate person/department."
    },
    {
      "source_text": "-- PDF PAGE 48 --- _________________________________________________________________________________________________46 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Budgets May include but are not limited to: 1.1 Cash budgets 1.2 Departmental budgets 1.3 Wages budgets 1.4 Project budgets 1.5 Purchasing budgets 1.6 Sales budgets 1.7 Cashflow budgets 1.8 Budgets for a small business 2. Research May include but is not limited to: 2.1 Discussions with existing suppliers 2.2 Sourcing of new suppliers 2.3 Evaluation of staffing/rostering requirements 2.4 Review of operating procedures 2.5 Potential rostering changes 3. Financial reports May include but are not limited to: 3.1 Daily, weekly, monthly transactions and reports 3.2 Break-up by department 3.3 Occupancy 3.4 Sales performance 3.5 Commission earnings 3.6 Sales returns 3.7 Yield management 3.8 Commercial account activity"
    },
    {
      "source_text": "-- PDF PAGE 49 --- _________________________________________________________________________________________________47 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrated knowledge of basic budget principles and structures 1.2 Knows budgeting terminology relevant to a specific industry context 1.3 Demonstrated the ability to monitor income and expenditure in accordance with the budget, and to identify ways of improving budget performance 1.4 Demonstrated understanding of the main types of budget that apply in the specific enterprise or industry context 2. Underpinning knowledge 2.1 Budget structure 2.2 Company and legal requirements in relation to disbursement of funds and record-keeping 2.3 Budgeting terminology relevant to a specific industry context 2.4 Financial reporting procedures and cycles relevant to the enterprise or industry sector 3. Underpinning skills 3.1 Techniques related to maximizing budget performance relevant to the enterprise or industry sector 4. Resource implications The following resources MUST be provided: 4.1 Project or work activities that include the management of and reporting on a budget for a specific project or operational area over a period of time so that the monitoring and implementation aspects of the unit can be assessed 4.2 Use of figures and data that reflect the financial operating conditions of industry 4.3 The requirement to evaluate options for improved budget performance"
