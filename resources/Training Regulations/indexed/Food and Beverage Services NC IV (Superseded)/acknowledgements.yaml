    {
      "source_text": "5. Methods of assessment Competency may be assessed through: 5.1 Evaluation of financial reports detailing financial performance of projects or activities conducted by the candidate 5.2 Evaluation of reports produced by the candidate detailing the processes undertaken to manage finances within a budget 5.3 Case studies and problem solving to assess application of the principles of budget management to different situations 5.4 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate 6. Context of assessment 6.1 Competency may be assessed in workplace or in a simulated workplace setting 6.2 Assessment shall be observed while tasks are being undertaken whether individually or in-group"
