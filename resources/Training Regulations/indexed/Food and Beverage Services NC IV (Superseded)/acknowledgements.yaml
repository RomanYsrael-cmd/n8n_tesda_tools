    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrated ability to plan the layout, menu and storage aspects of a coffee shop operation 1.2 Demonstrated knowledge of key hygiene and food safety issues relating to coffee shops 2. Underpinning knowledge 2.1 Principles and requirements of relevant legislation relating to:"
