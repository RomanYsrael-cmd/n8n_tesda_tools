    },
    {
      "source_text": "3.11 Safe work practices, particularly in relation to using cutting implements, appliances, heated surfaces, ovens and mixing equipment 4. Resource implications The following resources MUST be provided: 4.1 Project or work activities that allow the candidate to demonstrate skills required to complete planning for the operation of a proposed coffee shop 4.2 Access to relevant product and equipment information 5. Methods of assessment Competency may be assessed through: 5.1 Evaluation of plans and designs produced by the candidate for a coffee shop operation within a nominated location 5.2 Evaluation of projects to propose enhancements to existing coffee shops 5.3 Case studies to assess ability to tailor plans to different market conditions 5.4 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate 6. Context for assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
