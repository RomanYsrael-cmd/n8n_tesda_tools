    },
    {
      "source_text": "UNIT OF COMPETENCY : PREPARE TENDERS FOR CATERING CONTRACTS"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": TRS512369"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the skills and knowledge required to prepare tenders for catering contracts. This role could be undertaken by senior operating personnel, marketing coordinators, supervisors or managers within catering or restaurant operations."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "Bold and Italicized terms are elaborated in the Range Statement 1. Clarify requirements for catering tenders 1.1 Contents of the tender brief are interpreted accurately and assessed in terms of the organization’s capacity to meet stated requirements. 1.2 Action required for development of tender submission is identified. 1.3 Fixed and variable costs are accurately identified within the brief. 1.4 Liaison with the customer is undertaken to clarify requirements where appropriate. 2. Develop details for inclusion in tender 2.1 Proposed products and outcomes are developed to meet requirements including menus, food and beverage specification, and styles of service, theme and decor. 2.2 Proposed operational details are developed including meeting requirements. 2.3 Accurate costings are developed for all proposed products and services. 2.4 Options are developed to meet, and where possible, exceed the expectations of the customer. 2.5 Possible competitors are evaluated and appropriate strategies are developed to address competitive issues."
    },
    {
      "source_text": "-- PDF PAGE 63 --- _________________________________________________________________________________________________61 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA"
    },
    {
      "source_text": "3. Prepare tender documents 3.1 Tender documents are prepared within the designated timelines in accordance with the requirements of the brief. 3.2 Tender documents are presented in a format that maximizes the use of presentation and promotional techniques."
    },
    {
      "source_text": "-- PDF PAGE 64 --- _________________________________________________________________________________________________62 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "This unit applies to all catering operations where event catering is provided. The following explanations identify how this unit may be applied in different workplaces, sectors and circumstances."
    },
    {
      "source_text": "Events and functions may be in a central location or across a range of smaller locations indoors or outdoors."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "SCOPE"
    },
    {
      "source_text": "1. Contents of the tender brief May include but are not limited to: 1.1 Services required 1.2 Style of service 1.3 Customers or audience 1.4 Budget requirements 1.5 Legal responsibilities of the contractor 1.6 Legal responsibilities of the principal 1.7 Operational management approaches. 2. Operational details May include but are not limited to: 2.1 Staffing 2.2 Transport 2.3 Stock control 2.4 Equipment and resources 2.5 Security/emergency plan 2.6 Facilities management approaches."
    },
    {
      "source_text": "-- PDF PAGE 65 --- _________________________________________________________________________________________________63 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidences that the candidate: 1.1 Demonstrated ability to prepare a tender document for a specific commercial catering contract including assessment of the brief, coordination of details, accurate and profitable costing and professional presentation. 1.2 Demonstrated knowledge of typical requirements and formats for catering tender documents. 2. Underpinning knowledge 2.1 Components typically required for catering tenders and detailed knowledge of the operational and cost issues associated with each of those components. 2.2 Quality assurance issues related to catering tenders. 3. Underpinning skills 3.1 Presentation techniques for tender documents. 4. Resource implications The following resources MUST be provided: 4.1 Project or work activities that allow the candidate to prepare a fully-costed tender for a specific catering contract in a competitive bidding environment. 5. Methods of assessment Competency may be assessed through: 5.1 Review of tenders prepared by candidate for a particular event or catering contract. 5.2 Case studies to assess ability to develop options to meet different tender briefs. 5.3 Review of reports prepared by the candidate detailing the major issues and factors to be considered when preparing tenders for catering contracts. 5.4 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate. 6. Context for assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
    {
      "source_text": "-- PDF PAGE 66 --- _________________________________________________________________________________________________64 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "UNIT OF COMPETENCY: DEVELOP A FOOD SAFETY PROGRAM"
    },
    {
      "source_text": "UNIT CODE : TRS512363"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the development, implementation and evaluation of a food safety program for a hospitality or catering operation where food is stored, prepared and served."
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "1. Identify needs for the food safety program 1.1 Characteristics of the establishment are evaluated, including:"
    },
    {
      "source_text": "Size and nature of organization"
    },
    {
      "source_text": "“at risk” client groups"
    },
    {
      "source_text": "layout"
    },
    {
      "source_text": "menu"
    },
    {
      "source_text": "production equipment"
    },
    {
      "source_text": "facilities"
    },
    {
      "source_text": "re-thermalization and service requirements 1.2 Food safety hazards or any particular issues or risk situations are identified. 1.3 Existing policies, procedures, practices and product specifications are evaluated and the need for change or enhancement is assessed. 2. Develop a food safety program for a specific commercial catering enterprise 2.1 Food safety program is designed to suit the characteristics and needs of the enterprise, in consultation with appropriate colleagues and stakeholders. 2.2 Food production flow charts are developed. 2.3 Critical control points in the food production system are identified. 2.4 Methods of control for critical points and hazards are established. 2.5 Standard operational policies and procedures to support the food safety program, including control procedures, corrective measures and contingency plans are developed or modified. 2.6 Product specifications are developed or modified and recorded. 2.7 Product suppliers are identified and quality"
    },
    {
      "source_text": "-- PDF PAGE 67 --- _________________________________________________________________________________________________65 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "assurance specifications are established. 2.8 Compliance of the food safety program with regulatory requirements and standards is ensured. 2.9 Training needs are identified and a training plan or program is developed based on needs. 2.10 Schedule for regular review of the food safety program is developed. 3. Implement the food safety program 3.1 Food safety programs, policies and procedures are communicated to management and colleagues in the workplace. 3.2 Compliance by all colleagues to policies and procedures is ensured. 3.3 Practical and user-friendly recording system is established to document food safety performance. 3.4 Product specifications are communicated to suppliers and employees and compliance is checked. 3.5 Appropriate training and mentoring related to the food safety program is organized. 3.6 Implementation problems are promptly identified and corrective action is taken."
    },
    {
      "source_text": "-- PDF PAGE 68 --- _________________________________________________________________________________________________66 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "4. Evaluate and revise the food safety program as required 4.1 Operation and results of the food safety program are monitored according to schedule and in consultation with colleagues and other stakeholders. 4.2 Operational policies, procedures and records are reviewed and changes or additions required are identified. 4.3 Tests and/or measures to validate required safety standards are carried out. 4.4 Food safety program is revised to incorporate amendments or additions. 4.5 Records are kept to track changes to the food safety program and changes are incorporated into the production system. 4.6 Colleagues are informed of changes and of when they commence. 4.7 Need for additional training based on evaluation of the program is identified. 4.8 Display of appropriate signage and information is ensured."
    },
    {
      "source_text": "-- PDF PAGE 69 --- _________________________________________________________________________________________________67 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "The following explanations identify how this may be applied in different workplaces, sectors and circumstances."
    },
    {
      "source_text": "The food safety program systematically identifies the food safety hazards that may be reasonably expected to occur in all food handling operations. It identifies where and how each hazard can be controlled, describes how these controls are to be monitored, the corrective action required if control conditions are not met and information to be recorded. The food safety program must comply with relevant national and local government legislation and ordinances."
    },
    {
      "source_text": "The food safety plan may be a formal plan or a less-structured program. It may be developed as a stand- alone program or may be integrated with the overall quality program in a workplace."
    },
    {
      "source_text": "This unit is based around the HACCP system but may also be customized to other systems."
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE"
    },
    {
      "source_text": "1. Establishment May include but is not limited to: 1.1 Cafeteria/kiosks/canteens/cafes/gourmet food shops/restaurants/hotels 1.2 Fast food outlets 1.3 Educational institutions 1.4 Health establishments 1.5 Mining operations 1.6 Military forces 1.7 Corrective services/final institution 1.8 Residential catering 1.9 In-flight catering 1.10 Transport catering 1.11 Events catering 1.12 Private catering 2. “At risk” client groups May include but are not limited to: 2.1 Patients, residents and clients of health care establishments. 2.2 Children or babies 2.3 Pregnant women 2.4 Aged persons 2.5 People with immune deficiencies or allergies. 3. Food safety hazards May include but are not limited to: 3.1 Foods highly susceptible to microbiological contamination 3.2 Working in temperatures that promote the rapid growt of micro-organisms 3.3 Display of food, buffets"
    },
    {
      "source_text": "-- PDF PAGE 70 --- _________________________________________________________________________________________________68 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "VARIABLE"
    },
    {
      "source_text": "RANGE"
    },
    {
      "source_text": "3.4 Processes where food is required to be touched by hand 3.5 Requirements for re-thermalization or defrosting 4. Critical control points May include but are not limited to: 4.1 Receiving 4.2 Storing 4.3 Preparing 4.4 Processing 4.5 Displaying 4.6 Packaging 4.7 Servicing 4.8 Transporting 5. Standard operational policies and procedures May include but are not limited to: 5.1 Food production procedures 5.2 Procedures for maintaining records 5.3 Contingency plans 5.4 Pest control 5.5 Cleaning and sanitation programs 5.6 Equipment maintenance 5.7 Employee training in hygiene and food handling 5.8 Maintenance of personal hygiene and suitable dress standards. 6. Contingency plans May include but are not limited to: 6.1 Food poisoning 6.2 Customer complaints 6.3 Rejected food 6.4 Equipment breakdown 6.5 Faulty equipment 6.6 Existence of pests and vermin 7. Tests May include but are not limited to: 7.1 Food quality reviews and tests 7.2 Bacterial swabs and counts 7.3 Chemical tests 7.4 Audit arrangements and programs 7.5 Analysis of and actions arising from critical incidents 8. Records May include but are not limited to: 8.1 Temperature control data 8.2 Food production records."
    },
    {
      "source_text": "-- PDF PAGE 71 --- _________________________________________________________________________________________________69 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrated ability to implement and maintain food safety standards and program to enterprise standards and in line with legislative requirements. 1.2 Demonstrated involvement and interaction with a kitchen team. 2. Underpinning knowledge 2.1 Principles and methods of food production. 2.2 HACCP based concepts that support food safety program design. 2.3 Options for the structure, development and implementation of a food safety program, including HACCP. 2.4 Hygiene and food safety legislation and regulations in relation to food safety program requirements. 2.5 Local health regulations pertaining to food production and packaging. 2.6 Conditions for development of microbiological contamination and control methods. 2.7 Potential staff training needs in relation to food safety. 3. Underpinning skills 3.1 Policies and practices of personal hygiene and food handling. 3.2 Planning and consultative processes which could be used in program development. 3.3 Food safety recording requirements and options. 4. Resource"
    },
    {
      "source_text": "implications The following resources MUST be provided: 4.1 Project or work activities conducted over a period of time and which allow the candidate to establish and monitor a food safety program for a particular cookery or catering workplace. 4.2 Involvement and interaction with a kitchen team."
    },
    {
      "source_text": "-- PDF PAGE 72 --- _________________________________________________________________________________________________70 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "5. Methods of assessment Competency may be assessed through: 5.1 Review of documentation related to food safety systems, including policies and procedures, audit summaries and reports developed by the candidate. 5.2 Case studies to assess ability to develop systems to meet differing workplace needs. 5.3 Activities conducted in conjunction with industry to allow the candidate to develop systems for a real workplace. 5.4 Written or oral questions about chosen systems and reason for selection. 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate. 6. Context for"
    },
    {
      "source_text": "assessment 6.1 Assessment may be done in the workplace or in a simulated workplace setting (assessment centers) 6.2 Assessment activities are carried out through TESDA’s accredited assessment center"
    },
    {
      "source_text": "-- PDF PAGE 73 --- _________________________________________________________________________________________________71 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
