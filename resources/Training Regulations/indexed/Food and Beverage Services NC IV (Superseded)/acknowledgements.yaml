      "source_text": "Soy-based drinks 1.4 Ice cream 2. Proper storage May include but is not limited to: 2.1 Covering menu items on display 2.2 Maintaining appropriate temperatures for different menu items 2.3 Safe food handling practices 3. Food safety requirements May include but are not limited to: 3.1 Warm or chilled service temperatures 3.2 Eating qualities such as taste, texture, moisture content"
