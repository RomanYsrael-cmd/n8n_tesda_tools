    {
      "source_text": "UNIT OF COMPETENCY : MANAGE QUALITY CUSTOMER SERVICE"
    },
    {
      "source_text": "UNIT CODE : TRS311213"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes"
    },
    {
      "source_text": "required to manage customer service quality in the workplace within a tourism or hospitality context. It focuses on the need to develop active approaches to service quality issues with some strategic focus."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 1. Develop approaches to enhance customer service quality 1.1 Information on customer needs, expectations and satisfaction levels is obtained using both informal and formal research. 1.2 Opportunities are provided for both customers and colleagues to provide feedback on products and services. 1.3 Changes in internal and external environments are reviewed and findings are integrated into planning for quality service. 1.4 Opportunities are provided for colleagues to participate in the customer service planning process. 1.5 Standards and plans are developed to address key quality service issues. 2. Manage the delivery of quality service 2.1 Customer service standards and expectations are clearly communicated to colleagues. 2.2 Access to information on service standards and delivery is provided to colleagues. 2.3 Coaching is used to assist colleagues to deal with customer service issues and to take responsibility for service outcomes. 2.4 Customer service in the workplace is monitored to ensure standards are met in accordance with enterprise policies and procedures."
    },
    {
      "source_text": "-- PDF PAGE 52 --- _________________________________________________________________________________________________50 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and italicized terms are elaborated in the Range of Variables 3. Monitor and adjust customer service 3.1 Feedback is sought from customers on an ongoing basis and this is used to improve performance where applicable. 3.2 Customer service problems are identified and adjustments to standards, systems and procedures are made to ensure continued service quality. 3.3 New approaches are communicated to all those involved in service delivery within appropriate timeframes."
    },
    {
      "source_text": "-- PDF PAGE 53 --- _________________________________________________________________________________________________51 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Informal and formal research May include but are not limited to: 1.1 Talking to customers 1.2 Qualitative or quantitative research 1.3 Seeking feedback from service delivery colleagues 1.4 Analysis of competitive environment 1.5 Analysis of industry and market trends 2. Changes in internal and external environments May include but are not limited to: 2.1 Management changes 2.2 Organizational restructuring 2.3 Introduction of new equipment 2.4 Recruitment practices 2.5 Technological changes affecting service delivery 2.6 Changes in the competitive environment 2.7 Economic climate 2.8 Trends in customer preferences 2.9 Advent of E-business 3. Customer service standards/ Customer service issues May include but are not limited to: 3.1 Response times 3.2 Service guarantees 3.3 Pricing guarantees 3.4 Product quality 3.5 Document presentation standards 3.6 Personal presentation standards 3.7 Complaint management"
    },
    {
      "source_text": "-- PDF PAGE 54 --- _________________________________________________________________________________________________52 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrated ability to develop proactive approaches to the delivery and monitoring of quality customer service within a specific tourism/hospitality context 1.2 Demonstrated knowledge of quality service principles and processes 2. Underpinning knowledge 2.1 Roles and responsibilities of management in ensuring quality service within an enterprise 2.2 The concept of total quality service and total quality management 2.3 The role of continuous improvement and benchmarking in quality assurance 2.4 Overview of the range of market research techniques used to gain information on customer preferences 2.5 Legislation that impacts on customer service standards and delivery 2.6 Industry schemes that impact on customer service standards and delivery (e.g. accreditation schemes, codes of conduct) 3. Underpinning skills 3.1 Application of total quality service and total quality management in a tourism or hospitality context 3.2 Methods of implementing quality assurance in the workplace including: 3.2.1 Establishing standards 3.2.2 Monitoring 3.2.3 Staff involvement and reward 3.2.4 Evaluation 3.3 Application of continuous improvement and/or benchmarking in a tourism or hospitality context"
    },
    {
      "source_text": "-- PDF PAGE 55 --- _________________________________________________________________________________________________53 TR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
    },
    {
      "source_text": "4. Resource implications The following resources MUST be provided: 4.1 Project or work activities conducted over a period of time to allow the candidate to establish, monitor and evaluate service delivery in a tourism or hospitality context 4.2 Involvement of a team for which the candidate is leader 5. Methods of assessment Competency may be assessed through: 5.1 Evaluation of projects managed by the candidate in conjunction with industry to enhance service delivery in a given operation 5.2 Evaluation of projects managed by the candidate to create, market and deliver a tourism or hospitality service 5.3 Case studies to assess specific service delivery issues in different workplace contexts 5.4 Oral or written questions to assess knowledge of quality assurance concepts and principles 5.5 Review of portfolios of evidence and third party workplace reports of on-the-job performance by the candidate 6. Context of assessment 6.1 Competency may be assessed in workplace or in a simulated workplace setting 6.2 Assessment shall be observed while tasks are being undertaken whether individually or in-group"
