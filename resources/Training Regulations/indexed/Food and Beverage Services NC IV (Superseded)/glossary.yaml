      "definition": "10. COCKTAIL - is a well-mixed drink made up of base liquor, a modifying ingredient as a modifier and special flavoring of coloring agents. It is usually an aperitif taken at leisure before a meal to whet the appetite. 11. COMMIS - refers to the category according to the extent of difficulty and complexity of skills and knowledge required for the job. 12. COMMUNICATION - the transfer of ideas through verbal and non-verbal communication 13. CORDIAL/ LIQUEUR - a spirits that are sweetened and flavor with natural flavors 14. CUTLERY – refers to knives and other cutting implements 15. DEMITASSE – a small cup used to serve Turkish coffee or espresso. It is half of a full coffee cup, a tasse. 16. DISH OUT - food taken from the kitchen to the dining area 17. DISTILLATION - a process involving continuous evaporation and condensation of liquid wherein higher alcohol content could be obtained 18. ESPRESSO – a concentrated coffee beverage brewed by forcing very hot, but not boiling, water under high pressure through coffee that has been ground to a consistency between extremely fine and coarse powder. 19. FERMENTATION - an action of yeast upon a sugar in solution, which breaks down the sugar into carbon dioxide and alcohol 20. FLAMBE’ - flamed with spirit or liqueur 21. FLATWARE - it denotes all forms of spoons and forks 22. FOOD AND BEVERAGE SERVICE ATTENDANT - refers to the workers assigned in the service of food and beverage to the guests, also known as waiter. 23. GARNISH - an ingredient which decorates, accompanies or completes a dish. Many dishes are identified by the name of their garnishes 24. HIGHBALL DRINK - is a tall drink consisting of a shot of specified spirit with mixers such as sodas, water, etc. serve with cube ice in a highball glass 25. HOLLOWWARE – consists of any item made from silver e.g. teapots, milk jugs, sugar, basins, oval flats 26. LATTE MACCHIATO – steamed milk served in a glass with ½ shot espresso or less poured through it, leaving a “spot” of crema to indicate this is not a caffe latte, but a latte macchiato – “marked” milk. 27. LEVEL / CLASS - refers to the category according to the extent of difficulty and complexity of skills and knowledge required of the jobs. 28. LONG OR TALL DRINK - is a mixed drinks that are served in tall glasses 29. MENU - a list in specific order of the dishes to be served at a given meal 30. MISE EN PLACE - French term for having all ingredients in ready to use"
