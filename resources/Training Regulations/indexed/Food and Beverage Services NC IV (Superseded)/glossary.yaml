  "source_text": "1. APERITIF - is any drink taken before meals, to improve your appetite\n\n2. BARISTA - a professional operator of an espresso machine\n\n3. BREWING - a stage in making beer in which worth is boiled with hops\n\n4. BUSBOY - refers to the dining room helper and runner, title given to a Food\nand Beverage Service Attendant, National Certificate I\n\n5. BUSSED OUT - taking out soiled plates/dishes from the dining area to\ndishwashing area\n\n6. CAFFE LATTE – a type of coffee drink made with hot milk\n\n7. CAFFE MACCHIATO – (also known as espresso macchiato) an espresso with a\nteaspoon of milk in it, and a small “spot” of foam on top of the crema, traditionally to\nshow the beverage has milk in it – a “marked” espresso. This drink is the traditional\nvariation.\n\n8. CAPPUCCINO – an Italian beverage prepared with espresso coffee, hot milk and\nmilk foam\n\n9. CAPTAIN FOOD AND BEVERAGE SERVICE ATTENDANT - refers to the\nsupervisor of The Food and Beverage Service Attendant, also refers to Food and\nBeverage Service Attendant, National Certificate Level I.\n\n10. COCKTAIL - is a well-mixed drink made up of base liquor, a modifying ingredient as\na modifier and special flavoring of coloring agents. It is usually an aperitif taken at\nleisure before a meal to whet the appetite.\n\n11. COMMIS - refers to the category according to the extent of difficulty and complexity\nof skills and knowledge required for the job.\n\n12. COMMUNICATION - the transfer of ideas through verbal and non-verbal\ncommunication\n\n13. CORDIAL/ LIQUEUR - a spirits that are sweetened and flavor with natural flavors\n\n14. CUTLERY – refers to knives and other cutting implements\n\n15. DEMITASSE – a small cup used to serve Turkish coffee or espresso. It is half\nof a full coffee cup, a tasse.\n\n16. DISH OUT - food taken from the kitchen to the dining area\n\n17. DISTILLATION - a process involving continuous evaporation and condensation of\nliquid wherein higher alcohol content could be obtained\n\n--- PDF PAGE 94 ---\n_________________________________________________________________________________________________92\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n18. ESPRESSO – a concentrated coffee beverage brewed by forcing very hot, but\nnot boiling, water under high pressure through coffee that has been ground to a\nconsistency between extremely fine and coarse powder.\n\n19. FERMENTATION -\nan action of yeast upon a sugar in solution, which breaks\ndown the sugar into carbon dioxide and alcohol\n\n20. FLAMBE’ - flamed with spirit or liqueur\n\n21. FLATWARE - it denotes all forms of spoons and forks\n\n22. FOOD AND BEVERAGE SERVICE ATTENDANT - refers to the workers assigned\nin the service of food and beverage to the guests, also known as waiter.\n\n23. GARNISH - an ingredient which decorates, accompanies or completes a dish. Many\ndishes are identified by the name of their garnishes\n\n24. HIGHBALL DRINK - is a tall drink consisting of a shot of specified spirit with mixers\nsuch as sodas, water, etc. serve with cube ice in a highball glass\n\n25. HOLLOWWARE – consists of any item made from silver e.g. teapots, milk jugs,\nsugar, basins, oval flats\n\n26. LATTE MACCHIATO – steamed milk served in a glass with ½ shot espresso or less\npoured through it, leaving a “spot” of crema to indicate this is not a caffe latte, but a\nlatte macchiato – “marked” milk.\n\n27. LEVEL / CLASS - refers to the category according to the extent of difficulty and\ncomplexity of skills and knowledge required of the jobs.\n\n28. LONG OR TALL DRINK - is a mixed drinks that are served in tall glasses\n\n29. MENU - a list in specific order of the dishes to be served at a given meal\n\n30. MISE EN PLACE - French term for having all ingredients in ready to use\nPreparation before service\n\n31. PRE-DINNER - short mixed drinks that are basically dry in taste and are usually\nserved before a meal to wet the appetite\n\n32. SILVERWARE - tableware made of solid silver, silver gilt or silver metal. Silver plate\nmade from single strip of plated metal\n\n33. SPIRITS - are drinks obtained by distillation after fermentation from vegetables,\ngrains, fruits, plants and other substance with sugar or starch-based\n\n34. TABLE NAPKIN - an individual piece of linen which is used to protect the clothing\nor wipe the mouth during a meal\n\n--- PDF PAGE 95 ---\n_________________________________________________________________________________________________93\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n35. TABLEWARE - is a term recognized as embracing all items of flatware, cutlery,\nhollowware\n\n36. VIENNA – a medium to dark roast of coffee\n\nOther Terms Used :\n\n• Captain Waiter – Chef de Etage\n• Chef – a person who prepares food as an occupation in restaurant,\nprivate house, hotel\n• Dining Room Attendant – Commis de Rang (busboy)\n• Director of Service – Chef de Service\n• Head Waiter – Chef de Salle\n• Waiter – Chef de Rang/Demi Chef de Rang\n• Wine Steward – Chef de Vin/Chef Sommelier\n\n--- PDF PAGE 96 ---\n_________________________________________________________________________________________________94\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n TOURISM INDUSTRY BOARD FOUNDATION, INC. (TIBFI) - EXECUTIVE\n COMMITTEE\n\nMR. DANIEL L. EDRALIN\nChairman\n\nSEC. AUGUSTO BOBOY SYJUCO\nTrustee\nDirector General, TESDA\n\nMR. HUMPHREY O’LEARY\nDeputy Chairman\n\nATTY. MA. VICTORIA V. JASMIN\nTrustee\n\nMR. PAUL LIM SO\nTreasurer\n\nDR. IGNACIO S. PABLO\nExecutive Director\n\nDR. CORAZON R. RODRIGUEZ\nSecretary\n\nINDUSTRY WORKING GROUP (IWG)\n\nMR. HUMPHREY O’LEARY\nMS. ANABELLE MORENO\nCo-Chairs\nIndustry Working Committee\n\nMR. BIENVENIDO CLARAVALL\nAssessment and Certification\nSub-Committee\n\nMS. SYLVIA SANGCO\nChair, Planning Sub-Committee\n\nAdvocacy Sub-Committee\nMS. YAEL FERNANDEZ\nMS. SUSAN EDILO\nStandards Development Sub-Committee\n\nVIC ALCUAZ\nPlacement Sub-Committee\nMR. SANTOS BUENVENIDA\nENGR. EVELYN PANTIG\nProfessional and Programs Development Sub-\nCommittee\n\nMS. MA. THERESE C. DOMINGO\nFood and Beverage Service Expert\nThe TESDA Board Members and Secretariat\n\nThe Management and Staff of the TESDA Secretariat\n• QSO",
