    {
      "number": "4.1",
      "text": "The qualification of FOOD AND BEVERAGE SERVICE NC IV may be attained through: 4.1.1 Demonstration of competence in all the core units of competency listed below: 4.1.1.1 Operate a food outlet 4.1.1.2 Prepare tenders for catering contracts 4.1.1.3 Develop a food safety program Successful candidates shall be awarded a National Certificate (NC) on Food and Beverage Service NCIV (Restaurant) bearing the signature of the Director General. 4.1.2 Candidates who demonstrate competence in all the core units plus the elective unit “Plan coffee shop layout, menu and storage (Coffee Shop)” will be awarded a National Certificate (NC) on Food and Beverage Service NCIV (Restaurant and Coffee Shop) bearing the signature of the Director General."
    },
    {
      "number": "4.2",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
