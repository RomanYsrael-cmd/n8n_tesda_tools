  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 The qualification of FOOD AND BEVERAGE SERVICE NC IV may be\nattained through:\n\n4.1.1 Demonstration of competence in all the core units of competency listed\nbelow:\n\n4.1.1.1\nOperate a food outlet\n4.1.1.2\nPrepare tenders for catering contracts\n4.1.1.3\nDevelop a food safety program\n\nSuccessful candidates shall be awarded a National Certificate (NC) on Food\nand Beverage Service NCIV (Restaurant) bearing the signature of the\nDirector General.\n\n4.1.2 Candidates who demonstrate competence in all the core units plus the\nelective unit “Plan coffee shop layout, menu and storage (Coffee\nShop)” will be awarded a National Certificate (NC) on Food and\nBeverage Service NCIV (Restaurant and Coffee Shop) bearing the\nsignature of the Director General.\n\n 4.2 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n 4.3.1 Graduates of formal, non-formal and informal institutions including\nenterprise-based training programs\n\n4.3.2 Experienced workers (wage employed or self employed)\n\n4.4 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\".\n\n--- PDF PAGE 92 ---\n_________________________________________________________________________________________________90\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n"
}
