        "evidence_guide": {
          "source_text": "1. Critical aspects of competency\nAssessment requires evidences that the\ncandidate:\n1.1 Demonstrated ability to prepare a tender\ndocument for a specific commercial\ncatering contract including assessment of\nthe brief, coordination of details, accurate\nand profitable costing and professional\npresentation.\n1.2 Demonstrated knowledge of typical\nrequirements and formats for catering\ntender documents.\n2. Underpinning knowledge\n2.1 Components typically required for catering\ntenders and detailed knowledge of the\noperational and cost issues associated\nwith each of those components.\n2.2 Quality assurance issues related to\ncatering tenders.\n3. Underpinning skills\n3.1 Presentation techniques for tender\ndocuments.\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Project or work activities that allow the\ncandidate to prepare a fully-costed tender\nfor a specific catering contract in a\ncompetitive bidding environment.\n5. Methods of assessment\nCompetency may be assessed through:\n5.1 Review of tenders prepared by candidate\nfor a particular event or catering contract.\n5.2 Case studies to assess ability to develop\noptions to meet different tender briefs.\n5.3 Review of reports prepared by the\ncandidate detailing the major issues and\nfactors to be considered when preparing\ntenders for catering contracts.\n5.4 Review of portfolios of evidence and third\nparty workplace reports of on-the-job\nperformance by the candidate.\n6. Context for assessment\n6.1 Assessment may be done in the workplace\nor in a simulated workplace setting\n(assessment centers)\n6.2 Assessment activities are carried out\nthrough TESDA’s accredited assessment\ncenter\n\n--- PDF PAGE 66 ---\n_________________________________________________________________________________________________64\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY: DEVELOP A FOOD SAFETY PROGRAM\n\nUNIT CODE\n:"
        },
        "source_text": "TRS512369\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge\nrequired to prepare tenders for catering\ncontracts. This role could be undertaken by\nsenior operating personnel, marketing\ncoordinators, supervisors or managers\nwithin catering or restaurant operations.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Clarify requirements for catering\ntenders\n1.1 Contents of the tender brief are interpreted\naccurately and assessed in terms of the\norganization’s capacity to meet stated\nrequirements.\n1.2 Action required for development of tender\nsubmission is identified.\n1.3 Fixed and variable costs are accurately\nidentified within the brief.\n1.4 Liaison with the customer is undertaken to\nclarify requirements where appropriate.\n2. Develop details for inclusion in\ntender\n2.1 Proposed products and outcomes are\ndeveloped to meet requirements including\nmenus, food and beverage specification, and\nstyles of service, theme and decor.\n2.2 Proposed operational details are developed\nincluding meeting requirements.\n2.3 Accurate costings are developed for all\nproposed products and services.\n2.4 Options are developed to meet, and where\npossible, exceed the expectations of the\ncustomer.\n2.5 Possible competitors are evaluated and\nappropriate strategies are developed to\naddress competitive issues.\n\n--- PDF PAGE 63 ---\n_________________________________________________________________________________________________61\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n3. Prepare tender documents\n3.1 Tender documents are prepared within the\ndesignated timelines in accordance with the\nrequirements of the brief.\n3.2 Tender documents are presented in a format\nthat maximizes the use of presentation and\npromotional techniques.\n\n--- PDF PAGE 64 ---\n_________________________________________________________________________________________________62\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all catering operations where event catering is provided. The\nfollowing explanations identify how this unit may be applied in different workplaces,\nsectors and circumstances.\n\nEvents and functions may be in a central location or across a range of smaller\nlocations indoors or outdoors.\n\nVARIABLE\n\nSCOPE\n\n1. Contents of the tender brief\nMay include but are not limited to:\n1.1 Services required\n1.2 Style of service\n1.3 Customers or audience\n1.4 Budget requirements\n1.5 Legal responsibilities of the contractor\n1.6 Legal responsibilities of the principal\n1.7 Operational management approaches.\n2. Operational details\nMay include but are not limited to:\n2.1 Staffing\n2.2 Transport\n2.3 Stock control\n2.4 Equipment and resources\n2.5 Security/emergency plan\n2.6 Facilities management approaches.\n\n--- PDF PAGE 65 ---\n_________________________________________________________________________________________________63\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\nAssessment requires evidences that the\ncandidate:\n1.1 Demonstrated ability to prepare a tender\ndocument for a specific commercial\ncatering contract including assessment of\nthe brief, coordination of details, accurate\nand profitable costing and professional\npresentation.\n1.2 Demonstrated knowledge of typical\nrequirements and formats for catering\ntender documents.\n2. Underpinning knowledge\n2.1 Components typically required for catering\ntenders and detailed knowledge of the\noperational and cost issues associated\nwith each of those components.\n2.2 Quality assurance issues related to\ncatering tenders.\n3. Underpinning skills\n3.1 Presentation techniques for tender\ndocuments.\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Project or work activities that allow the\ncandidate to prepare a fully-costed tender\nfor a specific catering contract in a\ncompetitive bidding environment.\n5. Methods of assessment\nCompetency may be assessed through:\n5.1 Review of tenders prepared by candidate\nfor a particular event or catering contract.\n5.2 Case studies to assess ability to develop\noptions to meet different tender briefs.\n5.3 Review of reports prepared by the\ncandidate detailing the major issues and\nfactors to be considered when preparing\ntenders for catering contracts.\n5.4 Review of portfolios of evidence and third\nparty workplace reports of on-the-job\nperformance by the candidate.\n6. Context for assessment\n6.1 Assessment may be done in the workplace\nor in a simulated workplace setting\n(assessment centers)\n6.2 Assessment activities are carried out\nthrough TESDA’s accredited assessment\ncenter\n\n--- PDF PAGE 66 ---\n_________________________________________________________________________________________________64\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY: DEVELOP A FOOD SAFETY PROGRAM\n\nUNIT CODE\n:"
