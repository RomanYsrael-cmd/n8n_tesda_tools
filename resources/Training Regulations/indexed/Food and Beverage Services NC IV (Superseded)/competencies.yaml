        "evidence_guide": {
          "source_text": "1. Critical aspects of competency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated ability to plan the layout,\nmenu and storage aspects of a coffee\nshop operation\n1.2 Demonstrated knowledge of key hygiene\nand food safety issues relating to coffee\nshops\n2. Underpinning knowledge\n2.1 Principles and requirements of relevant\nlegislation relating to:\n• Occupational health and safety\n• Hygiene\n• Nutrition\n• Licensing regulations\n• Local health regulations\n2.2 Appropriate technical and culinary terms\nfor coffee shop operations\n2.3 Coffee shop equipment, its functions and\nroutine maintenance\n2.4 Varieties and characteristics of menu\nitems offered\n2.5 Underlying principles of making cakes,\npastries, and savoury items\n2.6 Commodity knowledge, including quality\nindicators of ingredients\n2.7 Storage conditions for menu items and\noptimizing shelf-life, freshness and eating\nqualities\n3. Underpinning skills\n3.1 Organizational skills and teamwork\n3.2 Menu planning and menu design\n3.3 Preparation of pastries, cakes and savoury\nproducts\n3.4 Costing, yield testing and portion control\n3.5 Handling, portioning and serving ice\ncreams\n3.6 Buffet and table set-ups\n3.7 Coffee and tea preparation and beverage\nservice\n3.8 Defining and applying quality control\n3.9 Time management skills\n3.10 Communication skills\n\n--- PDF PAGE 77 ---\n_________________________________________________________________________________________________75\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n3.11 Safe work practices, particularly in relation\nto using cutting implements, appliances,\nheated surfaces, ovens and mixing\nequipment\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Project or work activities that allow the\ncandidate to demonstrate skills required to\ncomplete planning for the operation of a\nproposed coffee shop\n4.2 Access to relevant product and equipment\ninformation\n5. Methods of assessment\nCompetency may be assessed through:\n5.1 Evaluation of plans and designs produced\nby the candidate for a coffee shop\noperation within a nominated location\n5.2 Evaluation of projects to propose\nenhancements to existing coffee shops\n5.3 Case studies to assess ability to tailor\nplans to different market conditions\n5.4 Review of portfolios of evidence and third\nparty workplace reports of on-the-job\nperformance by the candidate\n6. Context for assessment\n6.1 Assessment may be done in the workplace\nor in a simulated workplace setting\n(assessment centers)\n6.2 Assessment activities are carried out\nthrough TESDA’s accredited assessment\ncenter\n\n--- PDF PAGE 78 ---\n_________________________________________________________________________________________________76\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
        },
        "source_text": "TRS512370\n\nUNIT DESCRIPTOR\n:\nThis unit covers the layout, menu and storage\naspects of planning a coffee shop which serves\npatisserie items. It deals with the production,\ndisplay and service of patisserie products and\nsuitable beverages.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Plan coffee shop layout\n1.1 Floor plan for kitchen, service, display and\nstorage areas is developed according to\nanticipated customer requirements and\nvolume.\n1.2 Fixtures, furnishing, décor, and equipment are\nplanned according to business objectives,\nbudget, and style of coffee shop required.\n2. Plan the product and service\nelements of coffee shop\noperation\n2.1 Menu is planned and designed, identifying a\nrange of appropriate menu items and\nbeverages to meet market needs.\n2.2 Workflow schedule for production and service\nis prepared according to expected customer\nvolume and menu requirements, taking into\nconsideration available facilities, staff, time,\nequipment and enterprise practices.\n2.3 Display of items is planned considering style of\ncoffee shop, required storage temperatures,\nand visual appeal.\n\n--- PDF PAGE 74 ---\n_________________________________________________________________________________________________72\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n3. Plan and organize the storage\nfor coffee shop menu items\n3.1 Proper storage for pastries, cakes, and\nsavoury items at the correct temperatures is\nplanned and organized according to food\nsafety requirements and to maximize shelf\nlife and product quality.\n3.2 Packaging that is appropriate for the\npreservation of freshness, taste and eating\ncharacteristics is planned.\n\n--- PDF PAGE 75 ---\n_________________________________________________________________________________________________73\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nSCOPE\n\n1. Menu items\nMay include but are not limited to:\n1.1 Pastries and cakes\n1.2 Savoury items such as quiche, ham and\ncheese croissants\n1.3 Beverages such as\n• Coffee\n• Tea\n• Cold carbonated drinks\n• Fresh juices\n• Milk\n• Soy-based drinks\n1.4 Ice cream\n2. Proper storage\nMay include but is not limited to:\n2.1 Covering menu items on display\n2.2 Maintaining appropriate temperatures for\ndifferent menu items\n2.3 Safe food handling practices\n3. Food safety requirements\nMay include but are not limited to:\n3.1 Warm or chilled service temperatures\n3.2 Eating qualities such as taste, texture,\n moisture content\n\n--- PDF PAGE 76 ---\n_________________________________________________________________________________________________74\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated ability to plan the layout,\nmenu and storage aspects of a coffee\nshop operation\n1.2 Demonstrated knowledge of key hygiene\nand food safety issues relating to coffee\nshops\n2. Underpinning knowledge\n2.1 Principles and requirements of relevant\nlegislation relating to:\n• Occupational health and safety\n• Hygiene\n• Nutrition\n• Licensing regulations\n• Local health regulations\n2.2 Appropriate technical and culinary terms\nfor coffee shop operations\n2.3 Coffee shop equipment, its functions and\nroutine maintenance\n2.4 Varieties and characteristics of menu\nitems offered\n2.5 Underlying principles of making cakes,\npastries, and savoury items\n2.6 Commodity knowledge, including quality\nindicators of ingredients\n2.7 Storage conditions for menu items and\noptimizing shelf-life, freshness and eating\nqualities\n3. Underpinning skills\n3.1 Organizational skills and teamwork\n3.2 Menu planning and menu design\n3.3 Preparation of pastries, cakes and savoury\nproducts\n3.4 Costing, yield testing and portion control\n3.5 Handling, portioning and serving ice\ncreams\n3.6 Buffet and table set-ups\n3.7 Coffee and tea preparation and beverage\nservice\n3.8 Defining and applying quality control\n3.9 Time management skills\n3.10 Communication skills\n\n--- PDF PAGE 77 ---\n_________________________________________________________________________________________________75\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n3.11 Safe work practices, particularly in relation\nto using cutting implements, appliances,\nheated surfaces, ovens and mixing\nequipment\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Project or work activities that allow the\ncandidate to demonstrate skills required to\ncomplete planning for the operation of a\nproposed coffee shop\n4.2 Access to relevant product and equipment\ninformation\n5. Methods of assessment\nCompetency may be assessed through:\n5.1 Evaluation of plans and designs produced\nby the candidate for a coffee shop\noperation within a nominated location\n5.2 Evaluation of projects to propose\nenhancements to existing coffee shops\n5.3 Case studies to assess ability to tailor\nplans to different market conditions\n5.4 Review of portfolios of evidence and third\nparty workplace reports of on-the-job\nperformance by the candidate\n6. Context for assessment\n6.1 Assessment may be done in the workplace\nor in a simulated workplace setting\n(assessment centers)\n6.2 Assessment activities are carried out\nthrough TESDA’s accredited assessment\ncenter\n\n--- PDF PAGE 78 ---\n_________________________________________________________________________________________________76\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
      }
