        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Supervised the application of hygiene and safety\nprinciples and procedures\n1.2 Organized the preparation of a range of foods efficiently\nand within realistic industry timeframes\n1.3 Ensured the quality of customer service within the\ncontext of enterprise policies and procedures\n2. Underpinning\nknowledge\n2.1 Range of basic cooking skills appropriate to the\nenterprise which may include:\n▪ Hot plate\n▪ Reheating\n▪ Microwaving\n▪ Baking\n▪ Roasting\n▪ Boiling\n▪ Char-grilling, barbecue\n2.2 Principles of personal and food hygiene\n2.3 Safe work practices as required by Occupational Healtn\nand Safety legislation and guidelines\n2.4 Product knowledge of range of food offered\n3. Underpinning\n skills\n3.1 Practices of personal and food hygiene\n3.2 Customer service and communication skills\n3.3 Waste minimization techniques and environmental\nconsiderations in specific relation to the operation of the\noutlet\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 An environment containing sufficient and appropriate\nfood service and cooking equipment for the preparation\nand service of food items, to reflect commercial operating\npractice\n4.2 Use of real ingredients\n4.3 Preparation and service of food items for customers on\nmore than one occasion and within industry-realistic time\nconstraints\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate preparing, cooking\nand serving food items.\n5.2 Sampling of items prepared by the candidate.\n5.3 Inspection of a food service area set up and operated by\nthe candidate\n5.4 Oral or written questions to test knowledge of hygiene\nand occupational health and safety issues related to the\ncooking and service of food in a particular outlet\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n\n--- PDF PAGE 61 ---\n_________________________________________________________________________________________________59\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n6. Context for\nassessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 62 ---\n_________________________________________________________________________________________________60\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nPREPARE TENDERS FOR CATERING\nCONTRACTS\n\nUNIT CODE\n\n:"
        },
        "source_text": "TRS512368\n\nUNIT DESCRIPTOR\n:\nThis unit covers the preparation and service\nof foods in an outlet in various venues in the\nhospitality and tourism industry.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Prepare for service\n1.1 Quantities and quality of products and food items\nare checked and restocking is done where\nnecessary.\n1.2 Mise-en-place in the kitchen is checked to\nensure sufficient and appropriate food items are\nprepared in order to commence service.\n1.3 Mise-en-place in the service area is checked to\nensure completeness, efficiency and timeliness\nbefore service commences.\n1.4 Ongoing requirements for additional food items\nare met at an appropriate time.\n1.5 Display of service area and food items are\ninspected to ensure cleanliness, hygiene and\nattractiveness.\n1.6 Personal presentation and hygiene of staff are\nchecked to ensure requirements are met and\nmaintained throughout service.\n1.7 Mise-en-place and cooking are checked to ensure\nthey are carried out in accordance with safety and\nhygiene requirements.\n\n--- PDF PAGE 57 ---\n_________________________________________________________________________________________________55\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n2. Provide quality customer\nservice\n2.1 Customer requirements in terms of speed of\nservice, quantity, quality, additions and\nmodifications to standard recipes and special\nrequirements are determined and met.\n2.2 Use of customer service skills is checked to\nensure polite, efficient and effective service.\n2.3 Assistance to customers is checked to ensure\nthat it is provided, where required, in selection of\nfood items.\n2.4 Use of selling skills is checked to ensure that\nthey are appropriately employed according to\nenterprise procedures.\n2.5 Correct operation of equipment is checked to\nensure safety and compliance with\nmanufacturer’s instructions and principles of\noccupational health and safety.\n2.6 Work is organized and, where appropriate, in\nconsultation with other team members, to ensure\nthat food is prepared or cooked in a timely\nmanner and ongoing customer service is\nprovided.\n3. Ensure quality of food\n3.1 Compliance with principles of food safety is\nensured during the entire food production process.\n3.2 Portion control is checked to ensure compliance\nwith enterprise standards and in order to minimize\nwaste.\n3.3 Food presentation is checked to ensure\nattractiveness, absence of drips or spills, and use\nof appropriate hot or cold storage/presentation\nequipment\n4. Manage storage of food\n4.1 Storage of food items is checked to ensure\ncompliance with principles and practices of\nhygiene and food safety.\n4.2 Stock monitoring, accounting and reordering are\nchecked to ensure that they are conducted\naccording to enterprise procedures when\nrequired.\n\n--- PDF PAGE 58 ---\n_________________________________________________________________________________________________56\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n5. Ensure equipment is properly\ncleaned and maintained\n5.1 Equipment maintenance is monitored to ensure\ncompliance with manufacturer’s instructions.\n5.2 Cleaning of equipment is checked to ensure that\nit is done where required before, during and after\ncompletion of service.\n\n--- PDF PAGE 59 ---\n_________________________________________________________________________________________________57\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Mise-en-place\nMay include but is not limited to:\n1.1 Assembling and preparing ingredients for\nmenu items\n1.2 Cleaning, peeling and slicing fruits and\nvegetables\n1.3 Preparing simple food items such as salads,\nsandwiches, garnishes, coatings and batters\n1.4 Selection and handling (thawing,\nreconstituting, regenerating, reheating) of\nportion controlled and convenience products\n1.5 Display of goods in appropriate storage\nfacility\n2. Equipment\nMay include but are not limited to:\n2.1 Microwaves\n2.2 Deep fryers\n2.3 Hot plates\n2.4 Rotisseries\n2.5 Pans and urns\n2.6 Bains marie\n2.7 Food warmers\n\n--- PDF PAGE 60 ---\n_________________________________________________________________________________________________58\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Supervised the application of hygiene and safety\nprinciples and procedures\n1.2 Organized the preparation of a range of foods efficiently\nand within realistic industry timeframes\n1.3 Ensured the quality of customer service within the\ncontext of enterprise policies and procedures\n2. Underpinning\nknowledge\n2.1 Range of basic cooking skills appropriate to the\nenterprise which may include:\n▪ Hot plate\n▪ Reheating\n▪ Microwaving\n▪ Baking\n▪ Roasting\n▪ Boiling\n▪ Char-grilling, barbecue\n2.2 Principles of personal and food hygiene\n2.3 Safe work practices as required by Occupational Healtn\nand Safety legislation and guidelines\n2.4 Product knowledge of range of food offered\n3. Underpinning\n skills\n3.1 Practices of personal and food hygiene\n3.2 Customer service and communication skills\n3.3 Waste minimization techniques and environmental\nconsiderations in specific relation to the operation of the\noutlet\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 An environment containing sufficient and appropriate\nfood service and cooking equipment for the preparation\nand service of food items, to reflect commercial operating\npractice\n4.2 Use of real ingredients\n4.3 Preparation and service of food items for customers on\nmore than one occasion and within industry-realistic time\nconstraints\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate preparing, cooking\nand serving food items.\n5.2 Sampling of items prepared by the candidate.\n5.3 Inspection of a food service area set up and operated by\nthe candidate\n5.4 Oral or written questions to test knowledge of hygiene\nand occupational health and safety issues related to the\ncooking and service of food in a particular outlet\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n\n--- PDF PAGE 61 ---\n_________________________________________________________________________________________________59\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n6. Context for\nassessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 62 ---\n_________________________________________________________________________________________________60\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nPREPARE TENDERS FOR CATERING\nCONTRACTS\n\nUNIT CODE\n\n:"
      }
