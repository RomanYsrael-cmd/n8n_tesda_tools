__________________________37\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nVARIABLE\nRANGE\n8. Characteristics of persons\nbeing assessed\nMay include but are not limited to:\n8.1 Language literacy and numeracy needs\n8.2 Cultural, language and educational\nbackground\n8.3 Gender\n8.4 Physical ability\n8.5 Level of confidence, nervousness or anxiety\n8.6 Age\n8.7 Experience in training and assessment\n8.8 Previous experience with the topic\n9. Recording procedures\nMay include but are not limited to:\n9.1 Forms designed for the specific assessment\nresult (paper or electronic)\n9.2 Checklists for recording observations/process\nused (paper or electronic)\n9.3 Combination of the above\n10. Assessment reporting\nShould include:\n10.1 The unit/s of competencies in terms of code,\ntitle and endorsement date\n10.2 Summative assessment reports, where\nissued, will indicate units of competency\nwhere additional learning is required\n\n--- PDF PAGE 40 ---\n_________________________________________________________________________________________________38\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence of the following products to\nbe collected:\n1.11\nDescription of the assessment context, including the\npurpose of assessment\n1.12\nThe relevant competency or other performance\nstandard and assessment procedure used\n1.13\nDescription of how evidence gathered is valid,\nauthentic, sufficient, fair and reliable to ensure\ncompetency\n1.14\nConduct\nof\nassessment\nin\naccordance\nwith\ncompetency requirements\n1.15\nRecording of the assessment results in accordance\nwith the specified assessment procedure and record\nkeeping requirements\n1.16\nReport on the conduct of the assessment, including\npositive and negative features and suggestions for\nimproving any aspect of the assessment process.\nAssessment requires evidence of the following processes\nto be provided:\n1.21 How agreement was sought with the person/s being\nassessed on the conduct of the assessment\n1.22 How opportunities to gather evidence were identified\nas part of workplace or training activities\n1.23 How evidence was gathered in accordance with the\nassessment procedure\n1.24 How\nevidence\ngathering\nactivity\ncovered\nthe\ndimensions of competency\n1.25 How resources were arranged according to the\nassessment procedure\n1.26 How appropriate personnel were consulted\n1.27 How evidence was gathered in accordance with\nallowable adjustments to the assessment method\nwhere applicable\n\n--- PDF PAGE 41 ---\n_________________________________________________________________________________________________39\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n1. Critical aspects of\ncompetency (cont.)\n1.28 How evidence was evaluated in terms of validity,\nauthenticity, sufficiency, currency and consistent\nachievement of specified standard\n1.29 How the assessment was conducted to ensure that:\n• The person was put at ease and the supportive\nassessment environment was created\n• The language, literacy and numeracy issues were\ntaken into consideration\n1.30 How constructive feedback was provided to the\nperson/s being assessed, including instances of not\nyet competent\n1.31 How guidance was provided to person/s being\nassessed on how to overcome gaps in competency\nrevealed\n\n2. Underpinning\nknowledge\n2.1 Workplace application of relevant standards of\nperformance including industry or company competency\nstandards and assessment guideline\n2.2 Ethical responsibilities including health, safety and\nsecurity regulations and procedures relevant to the\nspecific context\n2.3 Understanding of policies and procedures of the\nworkplace and/or job role together with any related\nlegislation or regulatory requirements\n2.4 Understanding of the assessment principles of reliability,\nvalidity, fairness, flexibility, authenticity, sufficiency and\nconsistency\n3. Underpinning\nskills\n3.1 Planning of own work including predicting\nconsequences and identifying improvements\n3.2 Skills in the application of various assessment\nmethods/tools relevant to workplace context\n3.3 Language, literacy and numeracy skills required to:\n3.4 Give clear and precise instructions and information in\nspoken or written form\n3.5 Seek confirmation of understanding from the person/s\nbeing assessed\n3.6 Adjust language to suit target audience\n3.7 Prepare required documentation using clear and\ncomprehensible language and layout\n3.8 Ask probing questions and listen actively to understand\n\n--- PDF PAGE 42 ---\n_________________________________________________________________________________________________40\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nresponses of the persons being assessed\n3.9 Seek additional information for clarification purposes\n3.10 Use verbal and nonverbal language to promote a\nsupportive assessment environment\n3.11 Use language of negotiation and conflict resolution to\nminimize conflict\n3.12 Communication skills appropriate to the culture of the\nworkplace and the individual\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment on the job or in a simulated workplace\n4.2 Use by assessors of competencies relevant to their\nareas of technical expertise\n4.3\nAccess\nto\nrelevant\ncompetencies,\nsources\nof\ninformation on assessment methods, assessment tools\nand assessment procedures\n4.4 Access to person/s wishing to be assessed, relevant\nworkplace equipment, information and appropriate\npersonnel\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Work samples and/or simulations\n5.2 Direct observation of performance, products, practical\ntasks, projects and simulation exercises\n5.3 Review of logbooks and/or portfolios\n5.4 Questioning\n5.5 Consideration of third party reports and authenticated\nprior achievements\n5.6 Written, oral or computer-managed questioning\n6. Context for\nAssessment\n1.1\nIn all workplaces, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n1.2\nAssessment shall be observed while tasks are being\nundertaken whether individually or in a group.\n\n--- PDF PAGE 43 ---\n_________________________________________________________________________________________________41\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nMANAGE WORKPLACE DIVERSITY\nUNIT CODE\n:\nTRS311211\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, behavior and\nmotivations required to provide leadership in a diverse\nworkplace where customers and staff are from a wide\nrange of backgrounds. It builds on the unit “Work in a\nsocially diverse environment,” and reflects the\nimportance of managing diversity in the hospitality\nindustry.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n1. Encourage respect for\ndiversity in the\nworkplace\n1.1. A role model is provided for others through\nindividual behavior that demonstrates respect\nfor diversity.\n1.2. Work practices are developed and planning is\nundertaken in a manner which shows respect\nfor workplace diversity.\n1.3. Colleagues are assisted and coached in ways\nof accepting diversity in relation to both\ncolleagues and guests.\n2. Use diversity as an\nasset\n2.1. The skills of a diverse workforce are recognized\nand used to enhance company performance.\n2.2. The benefits of productive diversity are\npromoted to colleagues.\n3. Deal with problems\narising from diversity\nissues\n3.1. Workplace problems that arise from diversity\nissues are recognized promptly and action is\ntaken to resolve the situation.\n3.2. Training needs are identified and appropriate\naction is taken.\n3.3. Coaching and mentoring are used to assist\ncolleagues to successfully work in a diverse\nenvironment.\n\n--- PDF PAGE 44 ---\n_________________________________________________________________________________________________42\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Diversity\n\nMay include but is not limited to:\n1.10\nRace\n1.11\nLanguage\n1.12\nReligion\n1.13\nSpecial needs\n1.14\nDisabilities\n1.15\nFamily structure\n1.16\nGender\n1.17\nAge\n1.18\nSexual preference\n2. Work practices that reflect\nrespect for diversity\nMay include but are not limited to:\n2.1\nAcknowledgement of religious and cultural\ncelebrations\n2.2\nAppropriate allocation of duties to\nparticular staff members\n2.3\nCulturally appropriate mixing of staff\n2.4\nTraining in culturally-appropriate\ncommunication\n2.5\nConsideration of customers with special\nneeds\n\n3. Benefits of productive\ndiversity\nMay include but are not limited to:\n3.3\nA multilingual workforce\n3.4\nWorkforce that reflects the diversity of the\ncustomer base\n3.5\nImproved cross-cultural communication\n3.6\nEducation of the workforce\n3.7\nRemoval of prejudice\n3.8\nDifferent perspectives on problem solving\n3.9\nIncrease trade with other countries/cultures\n3.10 More interesting work environments\n\n--- PDF PAGE 45 ---\n_________________________________________________________________________________________________43\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated understanding of the role of leaders and\nmanagers in encouraging diversity in the hospitality\nindustry\n1.2. Demonstrated knowledge of cross-cultural\ncommunication techniques as they apply to leaders\nand managers\n1.3. Demonstrated knowledge of specific cultural issues\nthat may apply in a particular industry context\n2. Underpinning\nknowledge\n2.1. Specific diversity issues which apply to the hospitality\nindustry and which contribute to the industry’s\nprogress including benefits of productive diversity\n3. Underpinning\nskills\n3.1. Cross-cultural communication skills with specific\nreference to the roles of leaders and managers\nincluding cross-cultural communication for:\n• Conflict resolution\n• Problem-solving\n• Negotiation\n• Motivation\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Project or work activities that allow the candidate to\naddress typical diversity issues found in hospitality\nworkplaces\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Case studies to develop strategies for effectively\nmanaging diversity in different industry contexts\n5.2. Oral or written questions to assess knowledge of\ncross-cultural issues and communication techniques\n5.3. Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context for\nassessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 46 ---\n_________________________________________________________________________________________________44\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nMANAGE FINANCES WITHIN A BUDGET\n\nUNIT CODE\n:\nTRS311212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to take responsibility for budget management\nwhere others may have developed the budget.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n1. Allocate budget\nresources\n1.1 Funds are allocated according to agreed priorities.\n1.2 Changes in income and expenditure priorities are\ndiscussed with appropriate colleagues prior to\nimplementation.\n1.3 All relevant personnel are consulted and informed in\nrelation to resource decisions.\n1.4 Awareness of the importance of budget control is\npromoted.\n1.5 Detailed records of resource allocation are\nmaintained in accordance with enterprise control\nsystems.\n2. Monitor financial\nactivities against\nbudget\n2.1 Actual income and expenditure are checked against\nbudgets accurately and at regular intervals.\n2.2 Financial commitments are included in all\ndocumentation to ensure accurate monitoring.\n2.3 Deviations are identified and reported according to\ncompany policy and significance of deviation.\n2.4 Appropriate options for more effective management\nof deviations are investigated.\n2.5 Appropriate colleagues are advised of budget status\nin relation to targets within agreed timeframes.\n\n--- PDF PAGE 47 ---\n_________________________________________________________________________________________________45\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n3. Identify and\nevaluate options for\nimproved budget\nperformance\n3.1 Existing costs and resources are assessed and areas\nfor improvement are identified.\n3.2 Desired outcomes are discussed with relevant\ncolleagues.\n3.3 Appropriate research is conducted to investigate\nnew approaches.\n3.4 Benefits and disadvantages of new approaches are\ndefined and clearly communicated.\n3.5 Impacts on customer service levels and colleagues\nare considered when developing new approaches.\n3.6 Recommendations are presented clearly and\nlogically to the appropriate person/department.\n4. Complete financial\nreports\n4.1 All required financial reports are completed\naccurately and within designated timelines.\n4.2 Clear and concise information are produced to\nenable informed decision-making.\n4.3 Reports are promptly forwarded to the appropriate\nperson/department.\n\n--- PDF PAGE 48 ---\n_________________________________________________________________________________________________46\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Budgets\nMay include but are not limited to:\n1.1 Cash budgets\n1.2 Departmental budgets\n1.3 Wages budgets\n1.4 Project budgets\n1.5 Purchasing budgets\n1.6 Sales budgets\n1.7 Cashflow budgets\n1.8 Budgets for a small business\n2. Research\nMay include but is not limited to:\n2.1 Discussions with existing suppliers\n2.2 Sourcing of new suppliers\n2.3 Evaluation of staffing/rostering requirements\n2.4 Review of operating procedures\n2.5 Potential rostering changes\n3. Financial reports\nMay include but are not limited to:\n3.1 Daily, weekly, monthly transactions and\nreports\n3.2 Break-up by department\n3.3 Occupancy\n3.4 Sales performance\n3.5 Commission earnings\n3.6 Sales returns\n3.7 Yield management\n3.8 Commercial account activity\n\n--- PDF PAGE 49 ---\n_________________________________________________________________________________________________47\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of basic budget principles\nand structures\n1.2 Knows budgeting terminology relevant to a specific\nindustry context\n1.3 Demonstrated the ability to monitor income and\nexpenditure in accordance with the budget, and to\nidentify ways of improving budget performance\n1.4 Demonstrated understanding of the main types of\nbudget that apply in the specific enterprise or\nindustry context\n2. Underpinning\nknowledge\n2.1 Budget structure\n2.2 Company and legal requirements in relation to\ndisbursement of funds and record-keeping\n2.3 Budgeting terminology relevant to a specific industry\ncontext\n2.4 Financial reporting procedures and cycles relevant to\nthe enterprise or industry sector\n3. Underpinning\nskills\n3.1 Techniques related to maximizing budget performance\nrelevant to the enterprise or industry sector\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Project or work activities that include the management\nof and reporting on a budget for a specific project or\noperational area over a period of time so that the\nmonitoring and implementation aspects of the unit\ncan be assessed\n4.2 Use of figures and data that reflect the financial\noperating conditions of industry\n4.3 The requirement to evaluate options for improved\nbudget performance\n\n--- PDF PAGE 50 ---\n_________________________________________________________________________________________________48\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Evaluation of financial reports detailing financial\nperformance of projects or activities conducted by\nthe candidate\n5.2 Evaluation of reports produced by the candidate\ndetailing the processes undertaken to manage\nfinances within a budget\n5.3 Case studies and problem solving to assess\napplication of the principles of budget management\nto different situations\n5.4 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context of\nassessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 51 ---\n_________________________________________________________________________________________________49\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nMANAGE QUALITY CUSTOMER SERVICE\n\nUNIT CODE\n:\nTRS311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to manage customer service quality in the\nworkplace within a tourism or hospitality context. It\nfocuses on the need to develop active approaches to\nservice quality issues with some strategic focus.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n1. Develop approaches\nto enhance\ncustomer service\nquality\n1.1 Information on customer needs, expectations and\nsatisfaction levels is obtained using both informal\nand formal research.\n1.2 Opportunities are provided for both customers and\ncolleagues to provide feedback on products and\nservices.\n1.3 Changes in internal and external environments\nare reviewed and findings are integrated into planning\nfor quality service.\n1.4 Opportunities are provided for colleagues to\nparticipate in the customer service planning process.\n1.5 Standards and plans are developed to address key\nquality service issues.\n2. Manage the delivery\nof quality service\n2.1 Customer service standards and expectations are\nclearly communicated to colleagues.\n2.2 Access to information on service standards and\ndelivery is provided to colleagues.\n2.3 Coaching is used to assist colleagues to deal with\ncustomer service issues and to take responsibility\nfor service outcomes.\n2.4 Customer service in the workplace is monitored to\nensure standards are met in accordance with\nenterprise policies and procedures.\n\n--- PDF PAGE 52 ---\n_________________________________________________________________________________________________50\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n3. Monitor and adjust\ncustomer service\n3.1 Feedback is sought from customers on an ongoing\nbasis and this is used to improve performance where\napplicable.\n3.2 Customer service problems are identified and\nadjustments to standards, systems and procedures\nare made to ensure continued service quality.\n3.3 New approaches are communicated to all those\ninvolved in service delivery within appropriate\ntimeframes.\n\n--- PDF PAGE 53 ---\n_________________________________________________________________________________________________51\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Informal and formal\nresearch\nMay include but are not limited to:\n1.1 Talking to customers\n1.2 Qualitative or quantitative research\n1.3 Seeking feedback from service delivery\ncolleagues\n1.4 Analysis of competitive environment\n1.5 Analysis of industry and market trends\n2. Changes in internal and\nexternal environments\nMay include but are not limited to:\n2.1 Management changes\n2.2 Organizational restructuring\n2.3 Introduction of new equipment\n2.4 Recruitment practices\n2.5 Technological changes affecting service\ndelivery\n2.6 Changes in the competitive environment\n2.7 Economic climate\n2.8 Trends in customer preferences\n2.9 Advent of E-business\n3. Customer service\nstandards/ Customer\nservice issues\nMay include but are not limited to:\n3.1 Response times\n3.2 Service guarantees\n3.3 Pricing guarantees\n3.4 Product quality\n3.5 Document presentation standards\n3.6 Personal presentation standards\n3.7 Complaint management\n\n--- PDF PAGE 54 ---\n_________________________________________________________________________________________________52\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to develop proactive approaches\nto the delivery and monitoring of quality customer\nservice within a specific tourism/hospitality context\n1.2 Demonstrated knowledge of quality service principles\nand processes\n2. Underpinning\nknowledge\n2.1 Roles and responsibilities of management in ensuring\nquality service within an enterprise\n2.2 The concept of total quality service and total quality\nmanagement\n2.3 The role of continuous improvement and benchmarking\nin quality assurance\n2.4 Overview of the range of market research techniques\nused to gain information on customer preferences\n2.5 Legislation that impacts on customer service standards\nand delivery\n2.6 Industry schemes that impact on customer service\nstandards and delivery (e.g. accreditation schemes,\ncodes of conduct)\n3. Underpinning\nskills\n3.1 Application of total quality service and total quality\nmanagement in a tourism or hospitality context\n3.2 Methods of implementing quality assurance in the\nworkplace including:\n3.2.1\nEstablishing standards\n3.2.2\nMonitoring\n3.2.3\nStaff involvement and reward\n3.2.4\nEvaluation\n3.3 Application of continuous improvement and/or\nbenchmarking in a tourism or hospitality context\n\n--- PDF PAGE 55 ---\n_________________________________________________________________________________________________53\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Project or work activities conducted over a period of\ntime to allow the candidate to establish, monitor and\nevaluate service delivery in a tourism or hospitality\ncontext\n4.2 Involvement of a team for which the candidate is leader\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Evaluation of projects managed by the candidate in\nconjunction with industry to enhance service delivery\nin a given operation\n5.2 Evaluation of projects managed by the candidate to\ncreate, market and deliver a tourism or hospitality\nservice\n5.3 Case studies to assess specific service delivery issues\nin different workplace contexts\n5.4 Oral or written questions to assess knowledge of\nquality assurance concepts and principles\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n6. Context of\nassessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 56 ---\n_________________________________________________________________________________________________54\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nOPERATE A FOOD OUTLET\n\nUNIT CODE\n\n:\nTRS512368\n\nUNIT DESCRIPTOR\n:\nThis unit covers the preparation and service\nof foods in an outlet in various venues in the\nhospitality and tourism industry.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Prepare for service\n1.1 Quantities and quality of products and food items\nare checked and restocking is done where\nnecessary.\n1.2 Mise-en-place in the kitchen is checked to\nensure sufficient and appropriate food items are\nprepared in order to commence service.\n1.3 Mise-en-place in the service area is checked to\nensure completeness, efficiency and timeliness\nbefore service commences.\n1.4 Ongoing requirements for additional food items\nare met at an appropriate time.\n1.5 Display of service area and food items are\ninspected to ensure cleanliness, hygiene and\nattractiveness.\n1.6 Personal presentation and hygiene of staff are\nchecked to ensure requirements are met and\nmaintained throughout service.\n1.7 Mise-en-place and cooking are checked to ensure\nthey are carried out in accordance with safety and\nhygiene requirements.\n\n--- PDF PAGE 57 ---\n_________________________________________________________________________________________________55\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n2. Provide quality customer\nservice\n2.1 Customer requirements in terms of speed of\nservice, quantity, quality, additions and\nmodifications to standard recipes and special\nrequirements are determined and met.\n2.2 Use of customer service skills is checked to\nensure polite, efficient and effective service.\n2.3 Assistance to customers is checked to ensure\nthat it is provided, where required, in selection of\nfood items.\n2.4 Use of selling skills is checked to ensure that\nthey are appropriately employed according to\nenterprise procedures.\n2.5 Correct operation of equipment is checked to\nensure safety and compliance with\nmanufacturer’s instructions and principles of\noccupational health and safety.\n2.6 Work is organized and, where appropriate, in\nconsultation with other team members, to ensure\nthat food is prepared or cooked in a timely\nmanner and ongoing customer service is\nprovided.\n3. Ensure quality of food\n3.1 Compliance with principles of food safety is\nensured during the entire food production process.\n3.2 Portion control is checked to ensure compliance\nwith enterprise standards and in order to minimize\nwaste.\n3.3 Food presentation is checked to ensure\nattractiveness, absence of drips or spills, and use\nof appropriate hot or cold storage/presentation\nequipment\n4. Manage storage of food\n4.1 Storage of food items is checked to ensure\ncompliance with principles and practices of\nhygiene and food safety.\n4.2 Stock monitoring, accounting and reordering are\nchecked to ensure that they are conducted\naccording to enterprise procedures when\nrequired.\n\n--- PDF PAGE 58 ---\n_________________________________________________________________________________________________56\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n5. Ensure equipment is properly\ncleaned and maintained\n5.1 Equipment maintenance is monitored to ensure\ncompliance with manufacturer’s instructions.\n5.2 Cleaning of equipment is checked to ensure that\nit is done where required before, during and after\ncompletion of service.\n\n--- PDF PAGE 59 ---\n_________________________________________________________________________________________________57\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Mise-en-place\nMay include but is not limited to:\n1.1 Assembling and preparing ingredients for\nmenu items\n1.2 Cleaning, peeling and slicing fruits and\nvegetables\n1.3 Preparing simple food items such as salads,\nsandwiches, garnishes, coatings and batters\n1.4 Selection and handling (thawing,\nreconstituting, regenerating, reheating) of\nportion controlled and convenience products\n1.5 Display of goods in appropriate storage\nfacility\n2. Equipment\nMay include but are not limited to:\n2.1 Microwaves\n2.2 Deep fryers\n2.3 Hot plates\n2.4 Rotisseries\n2.5 Pans and urns\n2.6 Bains marie\n2.7 Food warmers\n\n--- PDF PAGE 60 ---\n_________________________________________________________________________________________________58\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Supervised the application of hygiene and safety\nprinciples and procedures\n1.2 Organized the preparation of a range of foods efficiently\nand within realistic industry timeframes\n1.3 Ensured the quality of customer service within the\ncontext of enterprise policies and procedures\n2. Underpinning\nknowledge\n2.1 Range of basic cooking skills appropriate to the\nenterprise which may include:\n▪ Hot plate\n▪ Reheating\n▪ Microwaving\n▪ Baking\n▪ Roasting\n▪ Boiling\n▪ Char-grilling, barbecue\n2.2 Principles of personal and food hygiene\n2.3 Safe work practices as required by Occupational Healtn\nand Safety legislation and guidelines\n2.4 Product knowledge of range of food offered\n3. Underpinning\n skills\n3.1 Practices of personal and food hygiene\n3.2 Customer service and communication skills\n3.3 Waste minimization techniques and environmental\nconsiderations in specific relation to the operation of the\noutlet\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 An environment containing sufficient and appropriate\nfood service and cooking equipment for the preparation\nand service of food items, to reflect commercial operating\npractice\n4.2 Use of real ingredients\n4.3 Preparation and service of food items for customers on\nmore than one occasion and within industry-realistic time\nconstraints\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Direct observation of the candidate preparing, cooking\nand serving food items.\n5.2 Sampling of items prepared by the candidate.\n5.3 Inspection of a food service area set up and operated by\nthe candidate\n5.4 Oral or written questions to test knowledge of hygiene\nand occupational health and safety issues related to the\ncooking and service of food in a particular outlet\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n\n--- PDF PAGE 61 ---\n_________________________________________________________________________________________________59\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n6. Context for\nassessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 62 ---\n_________________________________________________________________________________________________60\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY\n:\nPREPARE TENDERS FOR CATERING\nCONTRACTS\n\nUNIT CODE\n\n:\nTRS512369\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge\nrequired to prepare tenders for catering\ncontracts. This role could be undertaken by\nsenior operating personnel, marketing\ncoordinators, supervisors or managers\nwithin catering or restaurant operations.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Clarify requirements for catering\ntenders\n1.1 Contents of the tender brief are interpreted\naccurately and assessed in terms of the\norganization’s capacity to meet stated\nrequirements.\n1.2 Action required for development of tender\nsubmission is identified.\n1.3 Fixed and variable costs are accurately\nidentified within the brief.\n1.4 Liaison with the customer is undertaken to\nclarify requirements where appropriate.\n2. Develop details for inclusion in\ntender\n2.1 Proposed products and outcomes are\ndeveloped to meet requirements including\nmenus, food and beverage specification, and\nstyles of service, theme and decor.\n2.2 Proposed operational details are developed\nincluding meeting requirements.\n2.3 Accurate costings are developed for all\nproposed products and services.\n2.4 Options are developed to meet, and where\npossible, exceed the expectations of the\ncustomer.\n2.5 Possible competitors are evaluated and\nappropriate strategies are developed to\naddress competitive issues.\n\n--- PDF PAGE 63 ---\n_________________________________________________________________________________________________61\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n3. Prepare tender documents\n3.1 Tender documents are prepared within the\ndesignated timelines in accordance with the\nrequirements of the brief.\n3.2 Tender documents are presented in a format\nthat maximizes the use of presentation and\npromotional techniques.\n\n--- PDF PAGE 64 ---\n_________________________________________________________________________________________________62\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nThis unit applies to all catering operations where event catering is provided. The\nfollowing explanations identify how this unit may be applied in different workplaces,\nsectors and circumstances.\n\nEvents and functions may be in a central location or across a range of smaller\nlocations indoors or outdoors.\n\nVARIABLE\n\nSCOPE\n\n1. Contents of the tender brief\nMay include but are not limited to:\n1.1 Services required\n1.2 Style of service\n1.3 Customers or audience\n1.4 Budget requirements\n1.5 Legal responsibilities of the contractor\n1.6 Legal responsibilities of the principal\n1.7 Operational management approaches.\n2. Operational details\nMay include but are not limited to:\n2.1 Staffing\n2.2 Transport\n2.3 Stock control\n2.4 Equipment and resources\n2.5 Security/emergency plan\n2.6 Facilities management approaches.\n\n--- PDF PAGE 65 ---\n_________________________________________________________________________________________________63\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\nAssessment requires evidences that the\ncandidate:\n1.1 Demonstrated ability to prepare a tender\ndocument for a specific commercial\ncatering contract including assessment of\nthe brief, coordination of details, accurate\nand profitable costing and professional\npresentation.\n1.2 Demonstrated knowledge of typical\nrequirements and formats for catering\ntender documents.\n2. Underpinning knowledge\n2.1 Components typically required for catering\ntenders and detailed knowledge of the\noperational and cost issues associated\nwith each of those components.\n2.2 Quality assurance issues related to\ncatering tenders.\n3. Underpinning skills\n3.1 Presentation techniques for tender\ndocuments.\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Project or work activities that allow the\ncandidate to prepare a fully-costed tender\nfor a specific catering contract in a\ncompetitive bidding environment.\n5. Methods of assessment\nCompetency may be assessed through:\n5.1 Review of tenders prepared by candidate\nfor a particular event or catering contract.\n5.2 Case studies to assess ability to develop\noptions to meet different tender briefs.\n5.3 Review of reports prepared by the\ncandidate detailing the major issues and\nfactors to be considered when preparing\ntenders for catering contracts.\n5.4 Review of portfolios of evidence and third\nparty workplace reports of on-the-job\nperformance by the candidate.\n6. Context for assessment\n6.1 Assessment may be done in the workplace\nor in a simulated workplace setting\n(assessment centers)\n6.2 Assessment activities are carried out\nthrough TESDA’s accredited assessment\ncenter\n\n--- PDF PAGE 66 ---\n_________________________________________________________________________________________________64\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY: DEVELOP A FOOD SAFETY PROGRAM\n\nUNIT CODE\n: TRS512363\n\nUNIT DESCRIPTOR : This unit covers the development, implementation and\nevaluation of a food safety program for a hospitality or\ncatering operation where food is stored, prepared and\nserved.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n\n1. Identify needs for the food\nsafety program\n1.1 Characteristics of the establishment are\nevaluated, including:\n▪ Size and nature of organization\n▪ “at risk” client groups\n▪ layout\n▪ menu\n▪ production equipment\n▪ facilities\n▪ re-thermalization and service requirements\n1.2 Food safety hazards or any particular issues\nor risk situations are identified.\n1.3 Existing policies, procedures, practices and\nproduct specifications are evaluated and the\nneed for change or enhancement is assessed.\n2. Develop a food safety\nprogram for a specific\ncommercial catering\nenterprise\n2.1 Food safety program is designed to suit the\ncharacteristics and needs of the enterprise, in\nconsultation with appropriate colleagues and\nstakeholders.\n2.2 Food production flow charts are developed.\n2.3 Critical control points in the food production\nsystem are identified.\n2.4 Methods of control for critical points and\nhazards are established.\n2.5 Standard operational policies and\nprocedures to support the food safety\nprogram, including control procedures,\ncorrective measures and contingency plans\nare developed or modified.\n2.6 Product specifications are developed or\nmodified and recorded.\n2.7 Product suppliers are identified and quality\n\n--- PDF PAGE 67 ---\n_________________________________________________________________________________________________65\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n\nassurance specifications are established.\n2.8 Compliance of the food safety program with\nregulatory requirements and standards is\nensured.\n2.9 Training needs are identified and a training\nplan or program is developed based on needs.\n2.10 Schedule for regular review of the food safety\nprogram is developed.\n3. Implement the food safety\nprogram\n3.1 Food safety programs, policies and procedures\nare communicated to management and\ncolleagues in the workplace.\n3.2 Compliance by all colleagues to policies and\nprocedures is ensured.\n3.3 Practical and user-friendly recording system is\nestablished to document food safety\nperformance.\n3.4 Product specifications are communicated to\nsuppliers and employees and compliance is\nchecked.\n3.5 Appropriate training and mentoring related to\nthe food safety program is organized.\n3.6 Implementation problems are promptly\nidentified and corrective action is taken.\n\n--- PDF PAGE 68 ---\n_________________________________________________________________________________________________66\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the Range of\nVariables\n\n4. Evaluate and revise the food\nsafety program as required\n4.1 Operation and results of the food safety\nprogram are monitored according to schedule\nand in consultation with colleagues and other\nstakeholders.\n4.2 Operational policies, procedures and records\nare reviewed and changes or additions\nrequired are identified.\n4.3 Tests and/or measures to validate required\nsafety standards are carried out.\n4.4 Food safety program is revised to incorporate\namendments or additions.\n4.5 Records are kept to track changes to the food\nsafety program and changes are incorporated\ninto the production system.\n4.6 Colleagues are informed of changes and of\nwhen they commence.\n4.7 Need for additional training based on\nevaluation of the program is identified.\n4.8 Display of appropriate signage and information\nis ensured.\n\n--- PDF PAGE 69 ---\n_________________________________________________________________________________________________67\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n RANGE OF VARIABLES\n\nThe following explanations identify how this may be applied in different workplaces, sectors and\ncircumstances.\n\nThe food safety program systematically identifies the food safety hazards that may be reasonably\nexpected to occur in all food handling operations. It identifies where and how each hazard can be\ncontrolled, describes how these controls are to be monitored, the corrective action required if control\nconditions are not met and information to be recorded. The food safety program must comply with\nrelevant national and local government legislation and ordinances.\n\nThe food safety plan may be a formal plan or a less-structured program. It may be developed as a stand-\nalone program or may be integrated with the overall quality program in a workplace.\n\nThis unit is based around the HACCP system but may also be customized to other systems.\n\nVARIABLE\n\nRANGE\n\n1. Establishment\nMay include but is not limited to:\n1.1 Cafeteria/kiosks/canteens/cafes/gourmet food\nshops/restaurants/hotels\n1.2 Fast food outlets\n1.3 Educational institutions\n1.4 Health establishments\n1.5 Mining operations\n1.6 Military forces\n1.7 Corrective services/final institution\n1.8 Residential catering\n1.9 In-flight catering\n1.10 Transport catering\n1.11 Events catering\n1.12 Private catering\n2. “At risk” client groups\nMay include but are not limited to:\n2.1 Patients, residents and clients of health care\nestablishments.\n2.2 Children or babies\n2.3 Pregnant women\n2.4 Aged persons\n2.5 People with immune deficiencies or allergies.\n3. Food safety hazards\nMay include but are not limited to:\n3.1 Foods highly susceptible to microbiological\ncontamination\n3.2 Working in temperatures that promote the rapid growt\nof micro-organisms\n3.3 Display of food, buffets\n\n--- PDF PAGE 70 ---\n_________________________________________________________________________________________________68\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nVARIABLE\n\nRANGE\n\n3.4 Processes where food is required to be touched by\nhand\n3.5 Requirements for re-thermalization or defrosting\n4. Critical control points\nMay include but are not limited to:\n4.1\nReceiving\n4.2\nStoring\n4.3\nPreparing\n4.4\nProcessing\n4.5\nDisplaying\n4.6\nPackaging\n4.7\nServicing\n4.8\nTransporting\n5. Standard operational\npolicies and\nprocedures\nMay include but are not limited to:\n5.1 Food production procedures\n5.2 Procedures for maintaining records\n5.3 Contingency plans\n5.4 Pest control\n5.5 Cleaning and sanitation programs\n5.6 Equipment maintenance\n5.7 Employee training in hygiene and food handling\n5.8 Maintenance of personal hygiene and suitable dress\nstandards.\n6. Contingency plans\nMay include but are not limited to:\n6.1 Food poisoning\n6.2 Customer complaints\n6.3 Rejected food\n6.4 Equipment breakdown\n6.5 Faulty equipment\n6.6 Existence of pests and vermin\n7. Tests\nMay include but are not limited to:\n7.1\nFood quality reviews and tests\n7.2\nBacterial swabs and counts\n7.3\nChemical tests\n7.4\nAudit arrangements and programs\n7.5\nAnalysis of and actions arising from critical incidents\n8. Records\nMay include but are not limited to:\n8.1\nTemperature control data\n8.2\nFood production records.\n\n--- PDF PAGE 71 ---\n_________________________________________________________________________________________________69\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to implement and maintain food\nsafety standards and program to enterprise standards\nand in line with legislative requirements.\n1.2 Demonstrated involvement and interaction with a\nkitchen team.\n2. Underpinning\nknowledge\n2.1 Principles and methods of food production.\n2.2 HACCP based concepts that support food safety\nprogram design.\n2.3 Options for the structure, development and\nimplementation of a food safety program, including\nHACCP.\n2.4 Hygiene and food safety legislation and regulations in\nrelation to food safety program requirements.\n2.5 Local health regulations pertaining to food production\nand packaging.\n2.6 Conditions for development of microbiological\ncontamination and control methods.\n2.7 Potential staff training needs in relation to food safety.\n3. Underpinning skills\n3.1 Policies and practices of personal hygiene and food\nhandling.\n3.2 Planning and consultative processes which could be\nused in program development.\n3.3 Food safety recording requirements and options.\n4. Resource\n\nimplications\nThe following resources MUST be provided:\n4.1 Project or work activities conducted over a period of\ntime and which allow the candidate to establish and\nmonitor a food safety program for a particular cookery or\ncatering workplace.\n4.2 Involvement and interaction with a kitchen team.\n\n--- PDF PAGE 72 ---\n_________________________________________________________________________________________________70\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n5. Methods of\n assessment\nCompetency may be assessed through:\n5.1 Review of documentation related to food safety\nsystems, including policies and procedures, audit\nsummaries and reports developed by the candidate.\n5.2 Case studies to assess ability to develop systems to\nmeet differing workplace needs.\n5.3 Activities conducted in conjunction with industry to allow\nthe candidate to develop systems for a real workplace.\n5.4 Written or oral questions about chosen systems and\nreason for selection.\n5.5 Review of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n6. Context for\n\n assessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA’s\naccredited assessment center\n\n--- PDF PAGE 73 ---\n_________________________________________________________________________________________________71\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELECTIVE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPLAN COFFEE SHOP LAYOUT, MENU AND\nSTORAGE (COFFEE SHOP)\n\nUNIT CODE\n\n:\nTRS512370\n\nUNIT DESCRIPTOR\n:\nThis unit covers the layout, menu and storage\naspects of planning a coffee shop which serves\npatisserie items. It deals with the production,\ndisplay and service of patisserie products and\nsuitable beverages.\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\nBold and Italicized terms are elaborated in the Range\nStatement\n1. Plan coffee shop layout\n1.1 Floor plan for kitchen, service, display and\nstorage areas is developed according to\nanticipated customer requirements and\nvolume.\n1.2 Fixtures, furnishing, décor, and equipment are\nplanned according to business objectives,\nbudget, and style of coffee shop required.\n2. Plan the product and service\nelements of coffee shop\noperation\n2.1 Menu is planned and designed, identifying a\nrange of appropriate menu items and\nbeverages to meet market needs.\n2.2 Workflow schedule for production and service\nis prepared according to expected customer\nvolume and menu requirements, taking into\nconsideration available facilities, staff, time,\nequipment and enterprise practices.\n2.3 Display of items is planned considering style of\ncoffee shop, required storage temperatures,\nand visual appeal.\n\n--- PDF PAGE 74 ---\n_________________________________________________________________________________________________72\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\n\nPERFORMANCE CRITERIA\n\n3. Plan and organize the storage\nfor coffee shop menu items\n3.1 Proper storage for pastries, cakes, and\nsavoury items at the correct temperatures is\nplanned and organized according to food\nsafety requirements and to maximize shelf\nlife and product quality.\n3.2 Packaging that is appropriate for the\npreservation of freshness, taste and eating\ncharacteristics is planned.\n\n--- PDF PAGE 75 ---\n_________________________________________________________________________________________________73\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nSCOPE\n\n1. Menu items\nMay include but are not limited to:\n1.1 Pastries and cakes\n1.2 Savoury items such as quiche, ham and\ncheese croissants\n1.3 Beverages such as\n• Coffee\n• Tea\n• Cold carbonated drinks\n• Fresh juices\n• Milk\n• Soy-based drinks\n1.4 Ice cream\n2. Proper storage\nMay include but is not limited to:\n2.1 Covering menu items on display\n2.2 Maintaining appropriate temperatures for\ndifferent menu items\n2.3 Safe food handling practices\n3. Food safety requirements\nMay include but are not limited to:\n3.1 Warm or chilled service temperatures\n3.2 Eating qualities such as taste, texture,\n moisture content\n\n--- PDF PAGE 76 ---\n_________________________________________________________________________________________________74\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\n1. Critical aspects of competency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated ability to plan the layout,\nmenu and storage aspects of a coffee\nshop operation\n1.2 Demonstrated knowledge of key hygiene\nand food safety issues relating to coffee\nshops\n2. Underpinning knowledge\n2.1 Principles and requirements of relevant\nlegislation relating to:\n• Occupational health and safety\n• Hygiene\n• Nutrition\n• Licensing regulations\n• Local health regulations\n2.2 Appropriate technical and culinary terms\nfor coffee shop operations\n2.3 Coffee shop equipment, its functions and\nroutine maintenance\n2.4 Varieties and characteristics of menu\nitems offered\n2.5 Underlying principles of making cakes,\npastries, and savoury items\n2.6 Commodity knowledge, including quality\nindicators of ingredients\n2.7 Storage conditions for menu items and\noptimizing shelf-life, freshness and eating\nqualities\n3. Underpinning skills\n3.1 Organizational skills and teamwork\n3.2 Menu planning and menu design\n3.3 Preparation of pastries, cakes and savoury\nproducts\n3.4 Costing, yield testing and portion control\n3.5 Handling, portioning and serving ice\ncreams\n3.6 Buffet and table set-ups\n3.7 Coffee and tea preparation and beverage\nservice\n3.8 Defining and applying quality control\n3.9 Time management skills\n3.10 Communication skills\n\n--- PDF PAGE 77 ---\n_________________________________________________________________________________________________75\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n3.11 Safe work practices, particularly in relation\nto using cutting implements, appliances,\nheated surfaces, ovens and mixing\nequipment\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Project or work activities that allow the\ncandidate to demonstrate skills required to\ncomplete planning for the operation of a\nproposed coffee shop\n4.2 Access to relevant product and equipment\ninformation\n5. Methods of assessment\nCompetency may be assessed through:\n5.1 Evaluation of plans and designs produced\nby the candidate for a coffee shop\noperation within a nominated location\n5.2 Evaluation of projects to propose\nenhancements to existing coffee shops\n5.3 Case studies to assess ability to tailor\nplans to different market conditions\n5.4 Review of portfolios of evidence and third\nparty workplace reports of on-the-job\nperformance by the candidate\n6. Context for assessment\n6.1 Assessment may be done in the workplace\nor in a simulated workplace setting\n(assessment centers)\n6.2 Assessment activities are carried out\nthrough TESDA’s accredited assessment\ncenter\n\n--- PDF PAGE 78 ---\n_________________________________________________________________________________________________76\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
