ed based on the activities identified.\n2.4 Problems/ constraints encountered are resolved in\naccordance with organizations’ policies and guidelines\n2.5 Stakeholders are consulted based on company\nguidelines.\n\n 3. Monitor activities on\nenvironmental\nprotection /programs\n3.1 Activities are periodically monitored and evaluated\naccording to the objectives of the environmental\nprogram\n3.2 Feedback from stakeholders are gathered and\nconsidered in proposing enhancements to the\nprogram based on consultations\n3.3 Data gathered are analyzed based on evaluation\nrequirements\n3.4 Recommendations are submitted based on the\nfindings.\n3.5 Management support systems are\n set/established to sustain and enhance the program\n3.6 Environmental incidents are monitored and reported to\nconcerned/proper authorities\n\n--- PDF PAGE 28 ---\n_________________________________________________________________________________________________26\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n\n1. Legislations/Conventions\nMay include but are not limited to:\n1.1 Clean Air act\n1.2 Clean Water Act\n1.3 Solid Waste Management\n1.4 Montreal Protocol\n1.5 Kyoto Protocol\n\n2. Environmental\naspects/impacts\n2.1 Air pollution\n2.2 Water pollution\n2.3 Noise pollution\n2.4 Solid waste\n2.5 Flood control\n2.6 Deforestation/Denudation\n2.7 Radiation/Nuclear /Radio Frequency/ Microwaves\n2.8 Situation\n2.9 Soil erosion (e.g. Quarrying, Mining, etc.)\n2.10 Coral reef/marine life protection\n\n3. Industrial standards/\nEnvironmental practices\n3.1 ECC standards\n3.2 ISO standards\n3.3 company environmental management systems\n(EMS)\n4. Periodic\n4.1 hourly\n4.2 daily\n4.3 weekly\n4.4 monthly\n4.5 quarterly\n4.6 yearly\n\n5. Programs/Activities\n5.1 Waste disposal (on-site and off-site)\n5.2 Repair and maintenance of equipment\n5.3 Treatment and disposal operations\n5.4 Clean-up activities\n5.5 Laboratory and analytical test\n5.6 Monitoring and evaluation\n 5.7 Environmental advocacy programs\n\n--- PDF PAGE 29 ---\n_________________________________________________________________________________________________27\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of environmental legislations\nand local ordinances according to the different\nenvironmental issues/concerns.\n1.2 Described industrial standard environmental practices\naccording to the different environmental issues/concerns.\n1.3 Resolved problems/ constraints encountered based on\nmanagement standard procedures\n1.4 Implemented and monitored environmental practices on a\nperiodic basis as per company guidelines\n1.5 Recommended solutions for the improvement of the\nprogram\n1.6 Monitored and reported to proper authorities any\nenvironmental incidents\n2. Underpinning\nknowledge\n2.1 Features of an environmental management strategy\n2.2 Environmental issues/concerns\n2.3 International Environmental Protocols (Montreal, Kyoto)\n2.4 Waste minimization hierarchy\n2.5 Environmental planning/management\n2.6 Community needs and expectations\n2.7 Resource availability\n2.8 Environment-friendly/environmental advocates\n2.9 5S of Good Housekeeping\n2.10 3Rs – Reduce, Reuse & Recycle\n 2.11 Sanitary Code\n 2.12 Environmental Code of practice\n3. Underpinning\n skills\n3.1 Communicating effectively\n3.2 Performing research and analysis\n3.3 Reading / interpreting data and information\n3.4 Problem solving\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace/Assessment location\n4.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n4.3 Case studies/scenarios relating to environmental\nprotection\n\n--- PDF PAGE 30 ---\n_________________________________________________________________________________________________28\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Written/ Oral Examination\n5.2 Interview/Third Party Reports\n5.3 Portfolio (citations/awards from GOs and NGOs,\ncertificate of training – local and abroad)\n 5.4 Simulations and role-plays\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 31 ---\n_________________________________________________________________________________________________29\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nCONDUCT ASSESSMENT\nUNIT CODE\n: TRS311210\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, behavior and\nmotivations required to conduct an assessment in\naccordance with an assessment procedure in a\nspecific context.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n1. Identify and explain\nthe context of\nassessment\n1.1. The context and purpose of assessment is\ndiscussed and confirmed with the person/s\nbeing assessed.\n1.2. The relevant performance standards to be used\nin the assessment are clearly explained to the\nperson being assessed.\n1.3. Assessment procedure is clarified and\nexpectations of both the assessor and\ncandidate are agreed upon.\n1.4. Ethical responsibilities associated with the\nassessment are explained to the person/s being\nassessed.\n1.5. Needs of the person being assessed are\ndetermined to establish any allowable\nadjustments in the assessment procedure.\n1.6. Information using language and interactive\nstrategies and techniques are conveyed to\ncommunicate effectively with the person/s being\nassessed.\n\n--- PDF PAGE 32 ---\n_________________________________________________________________________________________________30\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n2. Plan evidence-\ngathering\nopportunities\n2.1. Opportunities to gather evidence of\ncompetency, which occur as part of workplace\nor training activities, are identified.\n2.2. The need to gather additional evidence which\nmay not occur as part of the workplace or\ntraining activities is identified.\n2.3. Evidence-gathering activities are planned to\nprovide sufficient, reliable, valid and fair\nevidence of competency in accordance with the\nassessment procedure.\n3. Organize\nassessment\n3.1. The resources specified in the assessment\nprocedure are arranged and obtained within a\nsafe and accessible assessment environment.\n3.2. Appropriate personnel are informed of the\nassessment.\n3.3. Language, strategies and techniques are\nemployed to ensure that spoken interactions and\nwritten documents are understood by all persons\nbeing assessed and by appropriate personnel.\n4.\nGather evidence\n4.1. Verbal and non-verbal language are adjusted\nand strategies to promote a supportive\nassessment environment are employed to\ngather evidence\n4.2. The evidence specified in the assessment\nprocedure is gathered using the assessment\nmethods and tools.\n4.3. Evidence is gathered in accordance with\nspecified allowable adjustments where\napplicable.\n4.4. Evidence gathered is documented in accordance\nwith the assessment procedure.\n\n--- PDF PAGE 33 ---\n_________________________________________________________________________________________________31\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n5.\nMake the\nassessment decision\n5.1. Evidence is evaluated in terms of:\n•\nValidity\n•\nAuthenticity\n•\nSufficiency\n•\nCurrency\n•\nConsistent achievement of the specified\nstandard\n5.2. Evidence is evaluated according to the\ndimensions of competency:\n•\nTask skills\n•\nTask management skills\n•\nContingency management skills\n•\nJob/role environment skill\n•\nTransfer and application of knowledge and skills\nto new contexts\n5.3. When in doubt, guidance is sought from a more\nexperienced assessor/s.\n5.4. The assessment decision is made in accordance\nwith the criteria specified in the assessment\nprocedure.\n6.\nRecord assessment\nresults\n6.1. The assessment results are recorded accurately\nin accordance with the specified record keeping\nrequirements.\n6.2. Confidentiality of assessment outcome is\nmaintained and access to the assessment\nrecords is provided only to authorized personnel.\n\n--- PDF PAGE 34 ---\n_________________________________________________________________________________________________32\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n7.\nProvide feedback to\npersons being\nassessed\n7.1. Clear and constructive feedback in relation to\nperformance of the person/s being assessed is\nprovided using language and strategies to suit\nthe person/s including provision of guidance on\nfurther goals/training opportunities.\n7.2. Opportunities for overcoming any gaps in\ncompetency are explored as revealed by the\nassessment with the person/s being assessed.\n7.3. The person/s being assessed is advised of\navailable reassessment opportunities and/or\nappeal mechanisms are reviewed where the\nassessment decision is challenged.\n8.\nReport on the\nconduct of the\nassessment\n8.1. Positive and negative features experienced in\nconducting the assessment are reported to those\nresponsible for the assessment procedure.\n8.2. Any assessment decision disputed by the\nperson/s being assessed is recorded and\nreported promptly to those responsible for the\nassessment procedure.\n8.3. Suggestions for improving any aspect of\nassessment process are made to appropriate\npersonnel.\n\n--- PDF PAGE 35 ---\n______________________