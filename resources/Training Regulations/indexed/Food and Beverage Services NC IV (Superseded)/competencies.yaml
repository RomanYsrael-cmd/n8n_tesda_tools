        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence of the following products to\nbe collected:\n1.11\nDescription of the assessment context, including the\npurpose of assessment\n1.12\nThe relevant competency or other performance\nstandard and assessment procedure used\n1.13\nDescription of how evidence gathered is valid,\nauthentic, sufficient, fair and reliable to ensure\ncompetency\n1.14\nConduct\nof\nassessment\nin\naccordance\nwith\ncompetency requirements\n1.15\nRecording of the assessment results in accordance\nwith the specified assessment procedure and record\nkeeping requirements\n1.16\nReport on the conduct of the assessment, including\npositive and negative features and suggestions for\nimproving any aspect of the assessment process.\nAssessment requires evidence of the following processes\nto be provided:\n1.21 How agreement was sought with the person/s being\nassessed on the conduct of the assessment\n1.22 How opportunities to gather evidence were identified\nas part of workplace or training activities\n1.23 How evidence was gathered in accordance with the\nassessment procedure\n1.24 How\nevidence\ngathering\nactivity\ncovered\nthe\ndimensions of competency\n1.25 How resources were arranged according to the\nassessment procedure\n1.26 How appropriate personnel were consulted\n1.27 How evidence was gathered in accordance with\nallowable adjustments to the assessment method\nwhere applicable\n\n--- PDF PAGE 41 ---\n_________________________________________________________________________________________________39\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n1. Critical aspects of\ncompetency (cont.)\n1.28 How evidence was evaluated in terms of validity,\nauthenticity, sufficiency, currency and consistent\nachievement of specified standard\n1.29 How the assessment was conducted to ensure that:\n• The person was put at ease and the supportive\nassessment environment was created\n• The language, literacy and numeracy issues were\ntaken into consideration\n1.30 How constructive feedback was provided to the\nperson/s being assessed, including instances of not\nyet competent\n1.31 How guidance was provided to person/s being\nassessed on how to overcome gaps in competency\nrevealed\n\n2. Underpinning\nknowledge\n2.1 Workplace application of relevant standards of\nperformance including industry or company competency\nstandards and assessment guideline\n2.2 Ethical responsibilities including health, safety and\nsecurity regulations and procedures relevant to the\nspecific context\n2.3 Understanding of policies and procedures of the\nworkplace and/or job role together with any related\nlegislation or regulatory requirements\n2.4 Understanding of the assessment principles of reliability,\nvalidity, fairness, flexibility, authenticity, sufficiency and\nconsistency\n3. Underpinning\nskills\n3.1 Planning of own work including predicting\nconsequences and identifying improvements\n3.2 Skills in the application of various assessment\nmethods/tools relevant to workplace context\n3.3 Language, literacy and numeracy skills required to:\n3.4 Give clear and precise instructions and information in\nspoken or written form\n3.5 Seek confirmation of understanding from the person/s\nbeing assessed\n3.6 Adjust language to suit target audience\n3.7 Prepare required documentation using clear and\ncomprehensible language and layout\n3.8 Ask probing questions and listen actively to understand\n\n--- PDF PAGE 42 ---\n_________________________________________________________________________________________________40\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nresponses of the persons being assessed\n3.9 Seek additional information for clarification purposes\n3.10 Use verbal and nonverbal language to promote a\nsupportive assessment environment\n3.11 Use language of negotiation and conflict resolution to\nminimize conflict\n3.12 Communication skills appropriate to the culture of the\nworkplace and the individual\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment on the job or in a simulated workplace\n4.2 Use by assessors of competencies relevant to their\nareas of technical expertise\n4.3\nAccess\nto\nrelevant\ncompetencies,\nsources\nof\ninformation on assessment methods, assessment tools\nand assessment procedures\n4.4 Access to person/s wishing to be assessed, relevant\nworkplace equipment, information and appropriate\npersonnel\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Work samples and/or simulations\n5.2 Direct observation of performance, products, practical\ntasks, projects and simulation exercises\n5.3 Review of logbooks and/or portfolios\n5.4 Questioning\n5.5 Consideration of third party reports and authenticated\nprior achievements\n5.6 Written, oral or computer-managed questioning\n6. Context for\nAssessment\n1.1\nIn all workplaces, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n1.2\nAssessment shall be observed while tasks are being\nundertaken whether individually or in a group.\n\n--- PDF PAGE 43 ---\n_________________________________________________________________________________________________41\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUNIT OF COMPETENCY :\nMANAGE WORKPLACE DIVERSITY\nUNIT CODE\n:"
        },
        "source_text": "TRS311210\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, behavior and\nmotivations required to conduct an assessment in\naccordance with an assessment procedure in a\nspecific context.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n1. Identify and explain\nthe context of\nassessment\n1.1. The context and purpose of assessment is\ndiscussed and confirmed with the person/s\nbeing assessed.\n1.2. The relevant performance standards to be used\nin the assessment are clearly explained to the\nperson being assessed.\n1.3. Assessment procedure is clarified and\nexpectations of both the assessor and\ncandidate are agreed upon.\n1.4. Ethical responsibilities associated with the\nassessment are explained to the person/s being\nassessed.\n1.5. Needs of the person being assessed are\ndetermined to establish any allowable\nadjustments in the assessment procedure.\n1.6. Information using language and interactive\nstrategies and techniques are conveyed to\ncommunicate effectively with the person/s being\nassessed.\n\n--- PDF PAGE 32 ---\n_________________________________________________________________________________________________30\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n2. Plan evidence-\ngathering\nopportunities\n2.1. Opportunities to gather evidence of\ncompetency, which occur as part of workplace\nor training activities, are identified.\n2.2. The need to gather additional evidence which\nmay not occur as part of the workplace or\ntraining activities is identified.\n2.3. Evidence-gathering activities are planned to\nprovide sufficient, reliable, valid and fair\nevidence of competency in accordance with the\nassessment procedure.\n3. Organize\nassessment\n3.1. The resources specified in the assessment\nprocedure are arranged and obtained within a\nsafe and accessible assessment environment.\n3.2. Appropriate personnel are informed of the\nassessment.\n3.3. Language, strategies and techniques are\nemployed to ensure that spoken interactions and\nwritten documents are understood by all persons\nbeing assessed and by appropriate personnel.\n4.\nGather evidence\n4.1. Verbal and non-verbal language are adjusted\nand strategies to promote a supportive\nassessment environment are employed to\ngather evidence\n4.2. The evidence specified in the assessment\nprocedure is gathered using the assessment\nmethods and tools.\n4.3. Evidence is gathered in accordance with\nspecified allowable adjustments where\napplicable.\n4.4. Evidence gathered is documented in accordance\nwith the assessment procedure.\n\n--- PDF PAGE 33 ---\n_________________________________________________________________________________________________31\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n5.\nMake the\nassessment decision\n5.1. Evidence is evaluated in terms of:\n•\nValidity\n•\nAuthenticity\n•\nSufficiency\n•\nCurrency\n•\nConsistent achievement of the specified\nstandard\n5.2. Evidence is evaluated according to the\ndimensions of competency:\n•\nTask skills\n•\nTask management skills\n•\nContingency management skills\n•\nJob/role environment skill\n•\nTransfer and application of knowledge and skills\nto new contexts\n5.3. When in doubt, guidance is sought from a more\nexperienced assessor/s.\n5.4. The assessment decision is made in accordance\nwith the criteria specified in the assessment\nprocedure.\n6.\nRecord assessment\nresults\n6.1. The assessment results are recorded accurately\nin accordance with the specified record keeping\nrequirements.\n6.2. Confidentiality of assessment outcome is\nmaintained and access to the assessment\nrecords is provided only to authorized personnel.\n\n--- PDF PAGE 34 ---\n_________________________________________________________________________________________________32\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n7.\nProvide feedback to\npersons being\nassessed\n7.1. Clear and constructive feedback in relation to\nperformance of the person/s being assessed is\nprovided using language and strategies to suit\nthe person/s including provision of guidance on\nfurther goals/training opportunities.\n7.2. Opportunities for overcoming any gaps in\ncompetency are explored as revealed by the\nassessment with the person/s being assessed.\n7.3. The person/s being assessed is advised of\navailable reassessment opportunities and/or\nappeal mechanisms are reviewed where the\nassessment decision is challenged.\n8.\nReport on the\nconduct of the\nassessment\n8.1. Positive and negative features experienced in\nconducting the assessment are reported to those\nresponsible for the assessment procedure.\n8.2. Any assessment decision disputed by the\nperson/s being assessed is recorded and\nreported promptly to those responsible for the\nassessment procedure.\n8.3. Suggestions for improving any aspect of\nassessment process are made to appropriate\npersonnel.\n\n--- PDF PAGE 35 ---\n_________________________________________________________________________________________________33\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Purpose of assessment\nMay include but is not limited to:\n1.1.\nTo gain a particular certification or a license\n1.2.\nTo determine employee classification\n1.3.\nTo identify training needs or progress\n1.4.\nTo recognize prior learning/current\ncompetencies\n2. Assessment procedure\n\nShould specify the following:\n2.1.\nRecording procedure\n2.2.\nAppeals/review mechanism\n2.3.\nAssessment methods to be used\n2.4.\nInstructions/materials to be provided to the\nperson/s being assessed\n2.5.\nCriteria for making decisions of competent\nor not yet competent\n2.6.\nAssessment tools\n2.7.\nEvidence required\n2.8.\nLocation of assessment\n2.9.\nTiming of assessment\n2.10. Assessment group size\n2.11. Allowable adjustments to the assessment\nprocedure depending on the characteristics\nof the person/s being assessed\n\n--- PDF PAGE 36 ---\n_________________________________________________________________________________________________34\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nVARIABLE\nRANGE\n3. Assessment environment\n\nMay include but is not limited to:\n3.1.\nTime\n3.2.\nLocation\n3.3.\nPersonnel\n3.4.\nFinances/costs\n3.5.\nEquipment\n3.6.\nMaterials\n3.7.\nHealth, safety and security requirements\n3.8.\nCompany/industry standard operating\nprocedures\n4. Appropriate personnel\nMay include but are not limited to:\n4.1 Assessors\n4.2 Person/s being assessed\n4.3 Employee/union representatives\n4.4 Consultative committees\n4.5 Users of assessment information, such as:\n• Training providers\n• Employers\n• Human resource departments\n4.6 Training/recognition authorities\n4.7 Training and assessment coordinators\n4.8 Relevant managers/supervisors/team leaders\n4.9 Technical specialists\n\n--- PDF PAGE 37 ---\n_________________________________________________________________________________________________35\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nVARIABLE\nRANGE\n5. Assessment methods and\ntools\nMay include but are not limited to:\n5.1 Specific instructions to be given relating to the\nperformance of practical tasks or processes or\nsimulation exercises\n5.2 Specific instructions to be given in relation to\nprojects and exercises\n5.3 Sets of oral/written/computer based questions\nto be asked\n5.4 Performance checklists\n5.5 Log books\n5.6 Marking guides\n5.7 Descriptions of competent performance\n\n6. Allowable adjustments\nMay include but are not limited to:\n6.1 Use of adaptive technology or special\nequipment to accommodate special needs of\npersons with disabilities\n6.2 Design of shorter assessment sessions to\nallow for fatigue or medication\n6.3 Use of large print version of any papers\n\n--- PDF PAGE 38 ---\n_________________________________________________________________________________________________36\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nVARIABLE\nRANGE\n7. Assessment system\nMay be developed by:\n7.11 The industry\n7.12 The company\n 7.13 A registered training organization\n7.14 Combination of the above\nShould specify the following:\n7.21 Purpose of assessment\n7.22 Competencies required of assessors\n7.23 Record-keeping procedures and policies\n7.24 Any allowable adjustments to the assessment\nmethod which may be made\n7.25 The appeal/review mechanisms and\nprocedures\n7.26 The review and evaluation of the assessment\nprocess\n7.27 The linkages between assessment and\ntraining qualifications/awards, employee\nclassification, remuneration, progression\n7.28 Relevant policies\n7.29 Quality assurance mechanisms\n7.30 Appointment of costs/fees, if applicable\n7.31 Marketing/promotion of assessment\n7.32 Verification arrangements\n7.33 Partnership arrangements, if applicable\n\n--- PDF PAGE 39 ---\n_________________________________________________________________________________________________37\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nVARIABLE\nRANGE\n8. Characteristics of persons\nbeing assessed\nMay include but are not limited to:\n8.1 Language literacy and numeracy needs\n8.2 Cultural, language and educational\nbackground\n8.3 Gender\n8.4 Physical ability\n8.5 Level of confidence, nervousness or anxiety\n8.6 Age\n8.7 Experience in training and assessment\n8.8 Previous experience with the topic\n9. Recording procedures\nMay include but are not limited to:\n9.1 Forms designed for the specific assessment\nresult (paper or electronic)\n9.2 Checklists for recording observations/process\nused (paper or electronic)\n9.3 Combination of the above\n10. Assessment reporting\nShould include:\n10.1 The unit/s of competencies in terms of code,\ntitle and endorsement date\n10.2 Summative assessment reports, where\nissued, will indicate units of competency\nwhere additional learning is required\n\n--- PDF PAGE 40 ---\n_________________________________________________________________________________________________38\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence of the following products to\nbe collected:\n1.11\nDescription of the assessment context, including the\npurpose of assessment\n1.12\nThe relevant competency or other performance\nstandard and assessment procedure used\n1.13\nDescription of how evidence gathered is valid,\nauthentic, sufficient, fair and reliable to ensure\ncompetency\n1.14\nConduct\nof\nassessment\nin\naccordance\nwith\ncompetency requirements\n1.15\nRecording of the assessment results in accordance\nwith the specified assessment procedure and record\nkeeping requirements\n1.16\nReport on the conduct of the assessment, including\npositive and negative features and suggestions for\nimproving any aspect of the assessment process.\nAssessment requires evidence of the following processes\nto be provided:\n1.21 How agreement was sought with the person/s being\nassessed on the conduct of the assessment\n1.22 How opportunities to gather evidence were identified\nas part of workplace or training activities\n1.23 How evidence was gathered in accordance with the\nassessment procedure\n1.24 How\nevidence\ngathering\nactivity\ncovered\nthe\ndimensions of competency\n1.25 How resources were arranged according to the\nassessment procedure\n1.26 How appropriate personnel were consulted\n1.27 How evidence was gathered in accordance with\nallowable adjustments to the assessment method\nwhere applicable\n\n--- PDF PAGE 41 ---\n_____________________________________________________