  "source_text": "SECTION 1 FOOD AND BEVERAGE SERVICE NC IV QUALIFICATION\n\nThe Food and Beverage Service NC IV Qualification consists of\ncompetencies that a person must achieve to operate a restaurant and/or coffee\nshop, managing a team of food service and/or food preparation staff for guests in\nhotels, motels, restaurants, clubs, canteens, resorts, luxury liners and cruise ships\nwithin the company’s acceptable standards. Specifically, it includes competencies on\noperating a food outlet, preparing tenders for catering contracts, developing a food\nsafety program and planning for coffee shop operations. S/he is also able to\nimplement and/or execute plans and monitor expenses to generate the required\ngross profit margins.\n\nThis Qualification is packaged from the competency map of the Tourism\nSector (Hotels and Restaurants) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\n .\nCODE NO.\nBASIC COMPETENCIES\n\n500311115\nUtilize specialized communication skills\n500311116\nDevelop teams and individuals\n500311117\nApply problem solving techniques in the workplace\n500311118\nCollect, analyze and organize information\n500311119\nPlan and organize work\n500311120\nPromote environmental protection\n\nCODE NO.\nCOMMON COMPETENCIES\n\n TRS311210\nConduct assessment\n TRS311211 Manage workplace diversity\n TRS311212\nManage finances within a budget\n TRS311213\nManage quality customer service\n\n--- PDF PAGE 4 ---\n_________________________________________________________________________________________________2\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nCODE NO.\nCORE COMPETENCIES\n\nTRS512368\nOperate a food outlet\nTRS512369\nPrepare tenders for catering contracts\nTRS512363\nDevelop a food safety program\n\nCODE NO.\nELECTIVE COMPETENCIES\n\nTRS512370\nPlan coffee shop layout, menu and storage (Coffee Shop)\n\nA person who has achieved this Qualification is competent to be a/an:\n\n❑ Restaurant Manager\n❑ Outlet Manager\n❑ Restaurant Assistant Manager\n❑ Outlet Assistant Manager\n❑ Coffee Shop Manager\n\n--- PDF PAGE 5 ---\n_________________________________________________________________________________________________3\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007"
