  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for FOOD AND BEVERAGE SERVICE NC\nIV.\n\nThe guidelines include information on curriculum design, training delivery,\ntrainee entry requirements, tools and equipment, training facilities, and trainer’s\nqualifications among others.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FOOD AND BEVERAGE SERVICE\n\nNC Level: NC IV\n\nNominal Training Duration: 56 Hrs. (Basic)\n 24 Hrs. (Common)\n\n 60 Hrs. (Core)\n\n 20 Hrs. (Elective)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes in\noverseeing restaurant operations in accordance with industry standards. It covers core\ncompetencies on operating a food outlet, preparing tenders for catering contracts,\ndeveloping a food safety program and planning for coffee shop operations. It also\nincludes competencies in developing teams and individuals, applying problem-solving\ntechniques, collecting, analyzing and organizing information, planning and organizing\nwork, conducting assessment, and managing workplace diversity, finances, and quality\ncustomer service.\n\n--- PDF PAGE 79 ---\n_________________________________________________________________________________________________77\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize specialized\ncommunication\nskills\n1.1 Apply\ncommunication\nstrategies to meet\nspecific needs of\ninternal and\nexternal client.\n1.2 Represent the\norganization in\ninternal and\nexternal forums.\n1.3 Facilitate group\ndiscussion.\n1.4 Conduct\ninterview\n• Discussion\nmethod\n• Role Play\n• Brainstorming\n• Lecture\n\n• Written test\n• Performance\ntest\n• Interview\n2. Develop team and\nindividual needs\n2.1 Determine\ndevelopment\nneeds.\n2.2 Foster individual\nand organization\ngrowth\n2.3 Monitor and\nevaluate\nworkplace\nlearning\n2.4 Develop team\ncommitment and\ncooperation\n2.5 Facilitate\naccomplishment\nof organizational\ngoals\n• Discussion\n• Role playing\n• Observation\n• Written test\n• Direct\nobservation\n• Role playing\n\n--- PDF PAGE 80 ---\n_________________________________________________________________________________________________78\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Apply problem\nsolving techniques\nin the workplace\n3.1 Analyze the\nproblem\n3.2 Identify\nfundamental\ncause of the\nproblem\n3.3 Determine\npossible solution\n3.4 Prepare\ncommunication or\ndocumentation\nreport\n3.5 Present\nrecommendation\nto appropriate\npersonnel\n3.6 Implement\nsolution\n• Brainstorming\n• Discussion\n• Case studies\n• Role playing\n• Small group\nwork\n\n• Written test\n• Direct\nobservation\n• Interview\n4. Collect, analyze\nand organize\ninformation\n4.1 Study information\nrequirements.\n4.2 Process data.\n4.3 Analyze, interpret\nand organize\ninformation\ngathered.\n4.4 Present\nfindings/recomm\nendations\n• Group\ndiscussion\n• Case study\n• Interaction\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and organize\nwork\n5.1 Set work\nobjectives\n5.2 Plan and\nschedule work\nactivities\n5.3 Implement and\nmonitor\nplans/activities\n5.4 Review and\nevaluate work\nplans and\nactivities\n• Brainstorming\n• Discussion\n• Case studies\n• Role playing\n• Small group\nwork\n• Written test\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 81 ---\n_________________________________________________________________________________________________79\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Promote\nenvironmental\nprotection\n6.1 Study guidelines\nfor environmental\nconcerns.\n6.2 Implement\nspecific\nenvironmental\nprograms\n6.3 Monitor activities\non environmental\nprotection/progra\nms\n• Group\ndiscussion\n• Case study\n• Interaction\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Conduct\nassessment\n1.1 Identify and explain\nthe context of\nassessment\n1.2 Plan evidence-\ngathering\nopportunities\n1.3 Organize\nassessment\n1.4 Gather evidence\n1.5 Make the\nassessment decision\n1.6 Record assessment\nresults\n1.7 Provide feedback to\npersons being\nassessed\n1.8 Report on the\nconduct of the\nassessment\n• Lecture\n• Role-Play\n• Simulation\n• Group\nDiscussion\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 82 ---\n_________________________________________________________________________________________________80\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Manage\nworkplace\ndiversity\n2.1 Encourage respect\nfor diversity in the\nworkplace\n2.2 Use diversity as an\nasset\n2.3 Deal with problems\narising from diversity\nissues\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Interviews/\nQuestioning\n• Observation\n3. Manage\nfinances within a\nbudget\n3.1 Allocate budget\nresources\n3.2 Monitor financial\nactivities against\nbudget\n3.3 Identify and evaluate\noptions for improved\nbudget performance\n3.4 Complete financial\nreports\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Questioning\n• Observation\n4. Manage quality\ncustomer\nservice\n4.1 Develop approaches\nto enhance\ncustomer service\nquality\n4.2 Manage the delivery\nof quality service\n4.3 Monitor and adjust\ncustomer service\n• Lecture\n• Discussion\n• Case Studies\n• Problem-\nsolving\nactivities\n• Questioning\n• Observation\n\n--- PDF PAGE 83 ---\n_________________________________________________________________________________________________81\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Operate a food\noutlet\n1.1 Prepare for service\n1.2 Provide quality\ncustomer service\n1.3 Ensure quality of\nfood\n1.4 Manage storage of\nfood\n1.5 Ensure equipment\nis properly cleaned\nand maintained\n• Lecture/\nDiscussion\n• Demonstration\n• Group\ndiscussion\n• Problem-\nsolving\nactivities\n• Written Test\n• Practical Test\n• Observation\n• Oral\nQuestioning\n2. Prepare tenders\nfor catering\ncontracts\n2.1 Clarify\nrequirements for\ncatering tenders\n2.2 Develop details for\ninclusion in tender\n2.3 Prepare tender\ndocuments\n• Lecture/\nDiscussion\n• Demonstration\n• Group\ndiscussion\n• Problem-\nsolving\nactivities\n• Written Test\n• Practical Test\n• Observation\n• Oral\nQuestioning\n3. Develop a food\nsafety program\n3.1 Identify needs for\nthe food safety\nprogram\n3.2 Develop a food\nsafety program for\na specific\ncommercial\ncatering enterprise\n3.3 Implement the food\nsafety program\n3.4 Evaluate and\nrevise the food\nsafety program as\nrequired\n• Lecture/\nDiscussion\n• Demonstration\n• Hands-on\n• Video Viewing\n• Written Test\n• Practical Test\n• Observation\nin Laboratory\n• Oral\nQuestioning\n\n--- PDF PAGE 84 ---\n_________________________________________________________________________________________________82\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nELECTIVE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Plan coffee shop\nlayout, menu and\nstorage (Coffee\nShop)\n1.1 Plan coffee shop\nlayout\n1.2 Plan the product\nand service\nelements of coffee\nshop operation\n1.3 Plan and organize\nthe storage for\ncoffee shop menu\nitems\n• Lecture/\nDiscussion\n• Demonstration\n• Group\ndiscussion\n• Problem-\nsolving\nactivities\n• Written Test\n• Practical Test\n• Observation\n• Oral\nQuestioning\n\n--- PDF PAGE 85 ---\n_________________________________________________________________________________________________83\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should follow to the design of the\ncurriculum. Delivery should be guided by the 10 basic principles of\ncompetency-based TVET.\n\n• The training is based on curriculum developed from the\n competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\n standards and the curriculum modules;\n• Assessment is based on the collection of evidence of the\n performance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\n competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended, thus, programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations\n• Modular/self-paced learning is a competency-based training\nmodality where the trainee is allowed to progress at his own\npace. The trainer only facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners\n• Supervised industry training or on-the-job training is a training\napproach designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\n\n--- PDF PAGE 86 ---\n_________________________________________________________________________________________________84\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\nemploy correspondence study, audio, video or computer\ntechnologies\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate both orally and in written form;\n• physically and mentally fit;\n• with good moral character;\n• can perform basic mathematical computation;\n• must be competent in the entire Food and Beverage Services NC III\n(Restaurant) qualification either through training, experience or\ncertification\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 87 ---\n_________________________________________________________________________________________________85\nTR – FOOD AND BEVERAGE SERVICE NCIV Promulgated April 2007\n\n3.4 LIST OF TOOLS AND EQUIPMENT\n FOOD AND BEVERAGE SERVICE – NC IV\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for FOOD AND BEVERAGE SERVICE NC IV are as\nfollows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n8\nDinner plates, 10”\n8\nDining chair\n25\n50 cm X 50 cm Table\nnapkin\n8\nShow/base plates,\n12”\n2\nTray stand (optional)\n3 kilos\nCoffee beans (Fresh\nroasted whole)