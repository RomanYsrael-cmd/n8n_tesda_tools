th and well-being. 37. TODDLER - is a child 12 to 36 months old.[1][2][3] The toddler years are a time of great cognitive, emotional and social development. The word is derived from \"to toddle\", which means to walk unsteadily, like a child of this age. (1yr-3yrs. old) 38. TOILETING - is the act of assisting a dependent patient with his/her elimination needs. 39. UMBILICAL CORD - a cord arising from the navel that connects the fetus with the placenta and through which respiratory gases, nutrients, and wastes pass 40. VITAL SIGNS – clinical measurements specifically body temperature, pulse rate, respiratory rate and level of blood pressure that indicate the state of client’s essential body function"
