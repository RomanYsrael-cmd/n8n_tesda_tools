      "term": "Other",
      "definition": "aspects include surveillance, monitoring, and investigating any suspected outbreak of infection, and its management. 19. MEDICATION - a substance used for medical treatment, especially a medicine or drug. 20. NEWBORN - is, in colloquial use, an infant who is only hours, days, or up to one month old. In medical contexts, newborn or neonate (from Latin, neonatus, newborn) refers to an infant in the first 28 days after birth;[1] the term applies to premature, full term, and postmature infants; before birth, the term \"fetus\" is used. The term \"infant\" is typically applied to young children under one year of age; however, definitions may vary and may include children up to two years of age. When a human child learns to walk, the term \"toddler\" may be used instead. (0-4 weeks) 21. NEWBORN REFLEXES – involuntary movements that babies make when a part of their body is stimulated 22. NEWBORN SCREENING TEST – the analysis of a neonate’s blood for metabolic or other disorders to prevent mental retardation, disability or death. 23. NON-VERBAL CUES – communication between people that do not have a direct verbal translation. They are body movements, facial expressions, gestures, nuances of the voice 24. NURTURE – process of caring for and encouraging the growth and development of someone or something 25. ORAL CARE – is the practice of keeping the mouth clean and healthy by brushing and flossing to prevent tooth decay and gum disease. 26. PERSONAL"
