  "source_text": "1.\nBURPING - the act or an instance of belching. to help (a baby) expel gas from the\nstomach especially by patting or rubbing the baby's back\n\n2.\nCAREGIVER – a skilled individual who assumes responsibility for the physical and\nemotional needs of another who is incapable of self-care. A person who provides direct\ncare (as for children, elderly people, or the chronically ill).\n\n3.\nCARE PLAN - A care plan is a written statement of your individual assessed needs\nidentified during a Community Care Assessment. It sets out what support you should\nget, why, when, and details of who is meant to provide it. You are entitled to be given\na copy of your care plan and should not sign the care plan until you are happy with it.\n\n4.\nCARING SKILLS - feeling or showing concern for or kindness to others. The work or\npractice of looking after those unable to care for themselves, especially sick and\nelderly people.\n\n5.\nCLIENT – refers to patient; a person who engages the professional advice or services\nof another\n\n6.\nCOGNITIVE DEVELOPMENT – encompasses a child’s working memory, attention as\nwell as a child’s ability to manage and respond to the experiences and information they\nexperience on a daily basis\n\n7.\nCUDDLING - to hold close for warmth or comfort or in affection.\n\n8.\nDENTITION – the development of teeth and characteristic arrangement, kind and\nnumber of teeth in a given in an individual at a given age\n\n9.\nDEVELOPMENT – indicates an increase in ability to function or a qualitative change;\npsychological changes that occurs in an individual throughout their life span\n\n10.\nDISTRESSED NEWBORN – newborn who continuously cry due to hunger, wet diaper,\nwith pain or has fever\n\n11.\nEMOTIONAL DEVELOPMENT – ability to recognize, express and manage feelings of\ndifferent stages of life and to have empathy for the feelings of others.\n\n12.\nFINE MOTOR DEVELOPMENT – involves the coordination of small muscles usually\ninvolving synchronization of hands and fingers with the eyes. .Fine motor skills require\na high degree of control and precision in the small muscles of the hand (such as using\na fork).\n\n13.\nFOOD PYRAMID – illustrates the principle of good nutrition with fruits and vegetables\non the bottom representing the bulk of a healthy diet and fats and oils at the top. Graphic\nused to illustrate good eating habits\n\n14.\nGROSS MOTOR DEVELOPMENT - Gross motor skills use the large muscles in the\nbody and include broader movements such as cruising, walking and jumping.\n\n--- PDF PAGE 204 ---\nTR - Caregiving (Newborn to Pre-schooler) NC II Revision 00 Promulgated (06/09/2020) 200\n15.\nGROWTH – physical changes that an individual undergoes\n\n16.\nHANDWASHING - is the act of cleaning one's hands for the purpose of removing soil,\ngrease, microorganisms, or other unwanted substances.\n\n17. INFANT - is the more formal or specialized synonym for \"baby\", the very young\noffspring of a human. The term may also be used to refer to juveniles of other\norganisms. (1 mo. – 1yr.old)\n\n18. INFECTION CONTROL - is the discipline concerned with preventing healthcare-\nassociated infections; a practical rather than academic sub-discipline of epidemiology.\nInfection control addresses factors related to the spread of infections within the\nhealthcare setting, whether among patients, from patients to staff, from staff to patients,\nor among staff. This includes preventive measures such as hand washing, cleaning,\ndisinfecting, sterilizing,\nand vaccinating.\nOther\naspects\ninclude\nsurveillance,\nmonitoring, and investigating any suspected outbreak of infection, and its management.\n\n19. MEDICATION - a substance used for medical treatment, especially a medicine or drug.\n\n20. NEWBORN - is, in colloquial use, an infant who is only hours, days, or up to one month\nold. In medical contexts, newborn or neonate (from Latin, neonatus, newborn) refers\nto an infant in the first 28 days after birth;[1] the term applies to premature, full term,\nand postmature infants; before birth, the term \"fetus\" is used. The term \"infant\" is\ntypically applied to young children under one year of age; however, definitions may\nvary and may include children up to two years of age. When a human child learns to\nwalk, the term \"toddler\" may be used instead. (0-4 weeks)\n\n21. NEWBORN REFLEXES – involuntary movements that babies make when a part of\ntheir body\n is stimulated\n\n22. NEWBORN SCREENING TEST – the analysis of a neonate’s blood for metabolic or\nother disorders to prevent mental retardation, disability or death.\n\n23. NON-VERBAL CUES – communication between people that do not have a direct\nverbal translation. They are body movements, facial expressions, gestures, nuances of\nthe voice\n\n24. NURTURE – process of caring for and encouraging the growth and development of\nsomeone or something\n\n25. ORAL CARE – is the practice of keeping the mouth clean and healthy by brushing and\nflossing to prevent tooth decay and gum disease.\n\n26. PERSONAL\nPROTECTIVE\nEQUIPMENT\n(PPE)\n-\nis\nprotective clothing, helmets, goggles, or other garments or equipment designed to\nprotect the wearer's body from injury or infection.\n\n27. PHYSICAL DEVELOPMENT – involves developing control over the body particularly\nmuscle and physical coordination\n\n28. PRE-SCHOOLER – a child below the official school age, usually a child up to age five.\n(3yrs-5yrs old)\n\n--- PDF PAGE 205 ---\nTR - Caregiving (Newborn to Pre-schooler) NC II Revision 00 Promulgated (06/09/2020) 201\n\n29. PRESCRIPTION - an instruction written by a medical practitioner that authorizes a\npatient to be provided a medicine or treatment.\n\n30. SENSORY DEVELOPMENT - is the gradual process by which an infant’s senses begin\nto grow. These senses are sight, taste, touch, smell and hearing. Sensory development\nbegins during gestation. However, an infant’s senses are not entirely developed even\nafter birth. For instance, following birth, an infant’s eyesight is very limited, while sense\nof touch is well-developed.\n\n31. SKIN CARE - maintaining clean, comfortable and healthy skin through thorough\ncleansing with soap and water, and moisturizing with emollients. Basic skin care also\nincludes treating skin conditions appropriately with medicines and lotions, and avoiding\nsun exposure. Age is a factor in skin care. Special consideration should be given to\ninfants, senior adults and the infirm.\n\n32. SOCIAL DEVELOPMENT – improving the well-being of every individual in society so\nthey can reach their full potential. Involve the ability to manage feelings and impulses\nwhich are needed to grow and learn.\n\n33. SOLID FOOD – refers to baby food which are either soft, liquid paste or an easily\nchewed food used as a source of nourishment\n\n34. SUPINE POSITION – a person lying face up with the back or dorsal surface downward\n\n35. TEMPER TANTRUM – unpleasant and disruptive behaviors or emotional outbursts.\nOccur in response to unmet needs or desires.\n\n36. THERAPEUTIC COMMUNICATION – an interaction between a health care\nprofessional and a patient that aims to enhance the patient’s comfort, safety, trust, or\nhealth and well-being.\n\n37. TODDLER - is a child 12 to 36 months old.[1][2][3] The toddler years are a time of great\ncognitive, emotional and social development. The word is derived from \"to toddle\",\nwhich means to walk unsteadily, like a child of this age. (1yr-3yrs. old)\n\n38. TOILETING - is the act of assisting a dependent patient with his/her elimination needs.\n\n39. UMBILICAL CORD - a cord arising from the navel that connects the fetus with the\nplacenta and through which respiratory gases, nutrients, and wastes pass\n\n40. VITAL SIGNS – clinical measurements specifically body temperature, pulse rate,\nrespiratory rate and level of blood pressure that indicate the state of client’s essential\nbody function\n\n--- PDF PAGE 206 ---\nTR - Caregiving (Newborn to Pre-schooler) NC II Revision 00 Promulgated (06/09/2020) 202",
