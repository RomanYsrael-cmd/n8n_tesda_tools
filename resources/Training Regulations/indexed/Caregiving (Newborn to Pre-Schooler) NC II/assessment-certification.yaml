schooler Foster physiological needs and cognitive development of grade schooler Foster physical growth and development of grade schooler Respond to emergency for grade schooler Foster physical growth and development of adolescent Promote developmental tasks for adolescent Respond to emergency for adolescent Develop the ability to recognize aging process Participate in the implementation and monitoring of client’s care plan Perform caring skills Perform specialty care procedures Assist client in administering prescribed medication Participate in the implementation and monitoring of client’s care plan Provide assistance and support on environment and biopsychosocial needs of clients Develop the ability to recognize healthy body systems and apply medical terminologies Provide care and support to activities of daily living (ADL) of clients Provide assistance in administering prescribed medications to clients Provide care and support to clients with special needs Respond to emergency situations Provide immediate care and support to children with special needs Provide immediate care and support to adults and elderly with special needs --- PDF PAGE 203 --- TR - Caregiving (Newborn to Pre-schooler) NC II Revision 00 Promulgated (06/09/2020) 199 1. BURPING - the act or an instance of belching. to help (a baby) expel gas from the stomach especially by patting or rubbing the baby's back 2. CAREGIVER – a skilled individual who assumes responsibility for the physical and emotional needs of another who is incapable of self-care. A person who provides direct care (as for children, elderly people, or the chronically ill). 3. CARE PLAN - A care plan is a written statement of your individual assessed needs identified during a Community Care Assessment. It sets out what support you should get, why, when, and details of who is meant to provide it. You are entitled to be given a copy of your care plan and should not sign the care plan until you are happy with it. 4. CARING SKILLS - feeling or showing concern for or kindness to others. The work or practice of looking after those unable to care for themselves, especially sick and elderly people. 5. CLIENT – refers to patient; a person who engages the professional advice or services of another 6. COGNITIVE DEVELOPMENT – encompasses a child’s working memory, attention as well as a child’s ability to manage and respond to the experiences and information they experience on a daily basis 7. CUDDLING - to hold close for warmth or comfort or in affection. 8. DENTITION – the development of teeth and characteristic arrangement, kind and number of teeth in a given in an individual at a given age 9. DEVELOPMENT – indicates an increase in ability to function or a qualitative change; psychological changes that occurs in an individual throughout their life span 10. DISTRESSED NEWBORN – newborn who continuously cry due to hunger, wet diaper, with pain or has fever 11. EMOTIONAL DEVELOPMENT – ability to recognize, express and manage feelings of different stages of life and to have empathy for the feelings of others. 12. FINE MOTOR DEVELOPMENT – involves the coordination of small muscles usually involving synchronization of hands and fingers with the eyes. .Fine motor skills require a high degree of control and precision in the small muscles of the hand (such as using a fork). 13. FOOD PYRAMID – illustrates the principle of good nutrition with fruits and vegetables on the bottom representing the bulk of a healthy diet and fats and oils at the top. Graphic used to illustrate good eating habits 14. GROSS MOTOR DEVELOPMENT - Gross motor skills use the large muscles in the body and include broader movements such as cruising, walking and jumping. --- PDF PAGE 204 --- TR - Caregiving (Newborn to Pre-schooler) NC II Revision 00 Promulgated (06/09/2020) 200 15. GROWTH – physical changes that an individual undergoes 16. HANDWASHING - is the act of cleaning one's hands for the purpose of removing soil, grease, microorganisms, or other unwanted substances."
