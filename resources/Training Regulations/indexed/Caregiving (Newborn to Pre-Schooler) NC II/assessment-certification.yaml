    {
      "number": "4.1",
      "text": "2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in cluster of related units of competency, namely: COC1 Provide care and support to Newborn (0 to 4 weeks) • Participate in the implementation and monitoring of newborn’s care plan • Develop the ability to recognize newborn’s growth and development • Perform caring skills for newborn COC 2 Provide care and support to Infant (1 month to 1 year old) • Participate in the implementation and monitoring of infant’s care plan • Provide physical needs, care and support to infant • Foster social, intellectual and emotional development of infant COC 3 Provide care and support to Toddler (1 to 3 years old) • Participate in the implementation and monitoring of toddler’s care plan • Develop the ability to recognize toddler’s growth and development • Perform caring skills for toddler COC 4 Provide care and support to Pre-schooler (3 to 5 years old) • Participate in the implementation and monitoring of pre-schooler’s care plan • Develop the ability to recognize pre-schooler’s growth and development • Perform caring skills for pre-schooler Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification."
    },
