  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of CAREGIVING (NEWBORN TO PRE-\nSCHOOLER) NC II, the candidate must demonstrate competence in all units\nlisted in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals\nwho were assessed as competent in cluster of related units of competency,\nnamely:\n\nCOC1 Provide care and support to Newborn (0 to 4 weeks)\n• Participate in the implementation and monitoring of newborn’s care\nplan\n• Develop the ability to recognize newborn’s growth and development\n• Perform caring skills for newborn\n\nCOC 2 Provide care and support to Infant (1 month to 1 year old)\n• Participate in the implementation and monitoring of infant’s care plan\n• Provide physical needs, care and support to infant\n• Foster social, intellectual and emotional development of infant\n\nCOC 3 Provide care and support to Toddler (1 to 3 years old)\n• Participate in the implementation and monitoring of toddler’s care\nplan\n• Develop the ability to recognize toddler’s growth and development\n• Perform caring skills for toddler\n\nCOC 4 Provide care and support to Pre-schooler (3 to 5 years old)\n• Participate in the implementation and monitoring of pre-schooler’s\ncare plan\n• Develop the ability to recognize pre-schooler’s growth and\ndevelopment\n• Perform caring skills for pre-schooler\n\nUpon accumulation and submission of all the COCs acquired, an individual\nshall be issued the corresponding National Certificate for the Qualification.\n\n4.1.3 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n--- PDF PAGE 198 ---\nTR - Caregiving (Newborn to Pre-schooler) NC II Revision 00 Promulgated (06/09/2020) 194\n4.1.4 Any of the following are qualified to undergo assessment and certification:\n\n4.1.4.1\nGraduates of WTR-registered program, NTR-registered programs\nor formal/non-formal/informal including enterprise-based trainings\nrelated to Caregiving (Newborn to Pre-schooler) NC II.\n\n4.1.4.2\nExperienced workers (wage employed or self-employed) who\ngained competencies in providing caregiving services for at least\nthree (3) years within the last five (5) years.\n\n4.1.5\nRecognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of caregiving experience within the\nlast five (5) years may apply for recognition in this Qualification through\nPortfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must be\nconsistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System”.\n\n4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC) in\nCaregiving Services NC II are required to undergo re-assessment under the\namended Training Regulations (TRs), upon expiration of their Certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n--- PDF PAGE 199 ---\nTR - Caregiving (Newborn to Pre-schooler) NC II Revision 00 Promulgated (06/09/2020) 195\n4.2.3\nAccredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 200 ---\nTR - Caregiving (Newborn to Pre-schooler) NC II Revision 00 Promulgated (06/09/2020) 196\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards