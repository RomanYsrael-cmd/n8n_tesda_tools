      "text": "INFECTION CONTROL - is the discipline concerned with preventing healthcare- associated infections; a practical rather than academic sub-discipline of epidemiology. Infection control addresses factors related to the spread of infections within the healthcare setting, whether among patients, from patients to staff, from staff to patients, or among staff. This includes preventive measures such as hand washing, cleaning, disinfecting, sterilizing, and vaccinating. Other aspects include surveillance, monitoring, and investigating any suspected outbreak of infection, and its management."
