  "source_text": "DEFINITION OF TERMS\n\n1. Certification\nRefers to the process of giving recognition to the\nattainment of knowledge, skills and attitudes\n2. Competency\nIs the specification of knowledge, skills and attitudes\nrequired to perform work activity in a range of context\nor environment\n3. Customer\nSomeone who purchases products or services from\nanother. Simple enough. But when you're responsible\nfor systems that analyze and report customer data, this\ndefinition falls short. And it is not an adequate definition\nwhen you're the end-user making business decisions\nbased on reports generated by those systems.\n4. Customer Service\nCustomer service, like a brand, is what the customer\nperceives and remembers of the service they received.\nWhat a customer perceives is the service they receive\nis not necessarily the service they actually receive.\n5. Cost of Goods Available\nfor Sale and Cost of\nGoods Sold\nTo calculate the cost of goods available for sale, we\nadded the purchases made during the year to the\npreceding year's end-of- year inventories. To calculate\nthe cost of goods sold, we deducted the end of the\ncurrent year's value of inventories from the cost of\ngoods available for sale.\n6. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person\nwho works in particular area of work is able to perform\n7. Evidence Guide\nIt is a guide for assessment that provides information\non critical aspects of competency, underpinning\nknowledge, underpinning skills, resource implications,\ncontext of assessment and assessment method.\n8. Gross Margin\nThe measure of gross margin represents total sales\nless cost of goods sold.\n9. Market\nA public gathering held for buying and selling\nmerchandise.\n10. Marketing\nMarketing is the social process by which individuals\nand groups obtain what they need and want through\ncreating and exchanging products and value with\nothers\n\n--- PDF PAGE 91 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n89\n11. Philippine TVET\nQualification Framework\nRefers to a comprehensive, nationally consistent\nframework for qualifications in the TVET sector. It also\nprovides the parameter for the integration of learning\nand assessment in the middle skills development.\n12. Point of Sale\nThis is a wide-ranging definition that can include all\ndisplay and merchandising methods used to enable\ntransactions. Point of Sale products refers to both the\nhardware and software that essentially helps run a\nbusiness. The POS can refer to: cash register systems,\ncash registers, point of sale terminals, POS receipt\nprinters, POS pole displays, OEM printers, and all other\npoint of sale equipment.\n13. Purchases\nPurchases represent the total cost of merchandise that\nwas purchased for resale during the year, whether or\nnot payment for the merchandise was made during the\nyear.\n14. Qualification\nRefers to the national certificate issued by the TESDA\nor its accredited industry organizations in recognition\nthat a person has achieved competencies relevant to a\ntrade or industry.\n15. Range of Variable\nIt describes the circumstances or context in which the\nwork is to be performed.\n16. Retailing\nConsists of the sale of goods or merchandise from a\nfixed location, such as a department store or kiosk, or\nby post, in small or individual lots for direct\nconsumption by the purchaser.\n17. Sales\nAre the activities involved in selling products or\nservices in return for money or other compensation. It\nis an act of completion of a commercial activity.\n18. Tag\nA strip of leather, paper, metal, or plastic attached to\nsomething or hung from a wearer's neck to identify,\nclassify, or label\n19. Transaction\nA typical transaction is a catalog merchandise order\nphoned in by a customer and entered into a computer\nby a customer representative. The order transaction\ninvolves checking an inventory database, confirming\nthat the item is available, placing the order, and\nconfirming that the order has been placed and the\n\n--- PDF PAGE 92 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n90\nexpected time of shipment.\n20. Unit of Competency\nRefers to a discrete aspect of work, which would\nnormally be performed by only one person.\n\n--- PDF PAGE 93 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n91"
