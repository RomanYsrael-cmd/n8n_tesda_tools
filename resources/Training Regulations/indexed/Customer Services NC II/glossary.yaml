      "definition": "Refers to the process of giving recognition to the attainment of knowledge, skills and attitudes 2. Competency Is the specification of knowledge, skills and attitudes required to perform work activity in a range of context or environment 3. Customer Someone who purchases products or services from another. Simple enough. But when you're responsible for systems that analyze and report customer data, this definition falls short. And it is not an adequate definition when you're the end-user making business decisions based on reports generated by those systems. 4. Customer Service Customer service, like a brand, is what the customer perceives and remembers of the service they received. What a customer perceives is the service they receive is not necessarily the service they actually receive. 5. Cost of Goods Available for Sale and Cost of Goods Sold To calculate the cost of goods available for sale, we added the purchases made during the year to the preceding year's end-of- year inventories. To calculate the cost of goods sold, we deducted the end of the current year's value of inventories from the cost of goods available for sale. 6. Element Refers to the building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in particular area of work is able to perform 7. Evidence Guide It is a guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment method. 8. Gross Margin The measure of gross margin represents total sales less cost of goods sold. 9. Market A public gathering held for buying and selling merchandise. 10. Marketing Marketing is the social process by which individuals and groups obtain what they need and want through creating and exchanging products and value with others"
