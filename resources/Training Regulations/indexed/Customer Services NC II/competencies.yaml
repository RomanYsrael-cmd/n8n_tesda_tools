        "source_text": "--- PDF PAGE 63 ---\n___________________________________________________________________\n___TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n61\nELECTIVES \n \nUNIT OF COMPETENCY:    MERCHANDISE FOOD PRODUCTS \n \nUNIT CODE \n    :   WRT522307  \n \nUNIT DESCRIPTOR  : This unit involves the preparation, arrangement and \npresentation of food products, including convenience \nfoods within the store. It includes the setting up and \nmaintenance of displays and labeling or pricing of     \nstock.  It also includes the handling, protection and \nstorage of food products for display or sale. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1.  Prepare food stock \n1.1   Preparation and handling requirements for specific \nfood products are identified and applied according to \nlegislative requirements and store policy \nprocedures.  \n1.2   Food preparation tools and equipment used according \nto approved occupational health and safety \nprocedures. \n1.3   Food preparation tools and equipment  cleaned, \nmaintained and stored according to store procedures \nand legislative requirements. \n1.4   Food products wrapped or packaged as required \naccording to store procedures and legislative \nrequirements.     \n2.  Place and arrange \nfood stock \n2.1  Food stock unpacked in accordance with legislative \nrequirements and store procedures \n2.2  Food products checked for freshness and placed on \ndisplay units in specified locations \n2.3  Food stock rotated according to shelf life,  expiry \ndates, store procedures and legislative requirements. \n2.4  Damaged, deteriorated, spoiled or out of date stock \nidentified and corrective action taken according to \nstore procedures and legislative requirements. \n2.5  Food products displayed and stored to avoid cross \ncontamination as indicated in store procedures and \nlegislative requirements. \n3.   Prepare and \ndisplay labels and \ntickets\n3.1  Labels/tickets for window, wall or floor displays, \ndisplay units or products prepared according to store \npolicy.\n\n--- PDF PAGE 64 ---\n___________________________________________________________________\n___TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n62\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n \n3.2   Stock is date coded as required. \n3.3   Soiled, damaged, illegible or incorrect labels/tickets  \nidentified and corrective action taken. \n3.4   Late mark-downs/reductions identified and ticketed \naccording to store policy. \n3.5   Ticketing equipment maintained and stored in a \nsecure location. \n3.6   Tickets/labels are visible, correctly priced and placed \non merchandise to conform with labeling and pricing \nrequirements. \n4.  Maintain food \ndisplays \n4.1  Special promotion areas reset and dismantled as \nrequired. \n4.2  Food products are arranged/faced up as directed \nand/or according to layout specifications, load \nbearing and load limit capacity of fixtures, display \nor storage units. \n4.3  Unsuitable or out of date displays and  deteriorating \nproducts identified, reset and/or removed as \ndirected. \n4.4  Optimum stock levels identified and stock replenished \naccording to store procedures. \n4.5  Display areas maintained in a clean and tidy manner \nwith excess packaging removed. \n5. Protect food stock \n5.1  Correct handling, storage and display techniques \nidentified and used according to packaging materials \nand covering/wrapping of food products, stock \ncharacteristics and legislative requirements. \n5.2  Food handling implements used and changed \naccording to legislative requirements and store \nprocedures. \n5.3  Fragile or expensive stock identified and handled with \nextra care to prevent damage or deterioration. \n5.4  Correct temperatures for product range(s) identified \nand maintained according to legislative requirements \nand store procedures. \n5.5  Storage/display units checked, maintained and \ncleaned according to store procedures. \n5.6  Temperature irregularities reported to appropriate \npersonnel without delay.\n\n--- PDF PAGE 65 ---\n___________________________________________________________________\n___TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n63\nRANGE OF VARIABLES \n \n \nVARIABLE\n \nRANGE\n1.  Food products   \nMay include but are not limited to: \n \n1.1  seafood, chicken, meat \n1.2  delicatessen goods \n1.3  seasonal varieties, exotic and unusual lines \n1.4  bakery items \n1.5  dairy frozen foods \n1.6  products \n1.7  dried foods \n1.8  canned foods \n1.9  prepared salads and convenience foods \n 2.  Store policy and \nprocedures \nMay include but are not limited to: \n2.1  preparation, arrangement, presentation, handling \nand storage of food stock \n2.2  maintenance and cleaning of equipment and \nworking areas \n 3.  Legislative \nrequirements \nMay include but are not limited to: \n \n3.1 occupational health and safety \n3.2 pricing procedures including Goods and Services \nTax (GST) requirements \n3.3 manual handling \n3.4 consumer law \n3.5 waste disposal \n3.6 environmental protection \n3.7 industry codes of practice \n3.8 food safety regulations \n4.   Labeling and Pricing   \nProcedures \nMay include but are not limited to: \n  \n4.1  Labels may be provided or produced: \n4.1.1  electronically \n4.1.2  manually \n4.1  Store labeling and pricing procedures may include: \n        4.2.1  pricing gun \n        4.2.2  shelf tickets \n        4.2.3  shelf talkers \n       4.2.4  written or electronically produced labels\n\n--- PDF PAGE 66 ---\n___________________________________________________________________\n___TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n64\n \nVARIABLE\n \nRANGE\n         \n         4.2.5  bar coding \n         4.2.6  price boards \n         4.2.7  header boards \n5.  Load limits/load \nbearing capacity of \nstorage/display units \n \nMay include but are not limited to: \n \n5.1  weight bearing capacity \n5.2  temperature maintenance \n6.  Deteriorating  \nproducts \n \nMay include but are not limited to: \n \n6.1  contaminated products \n6.2  items nearing or exceeding product life/use-by \ndate \n6.3  products with crushed/broken containers \n6.4  dried-out products \n \n7.  Handling techniques \n \nMay include but are not limited to: \n \n71 perishable items \n7.2 cooked/uncooked items \n7.3 items requiring defrosting/freezing \n7.4 wet/dry items \n8.  Packaging materials \nand covering/ \nwrapping of food \nproducts \nMay include but are not limited to: \n \n8.1 Packaging materials: \n      8.1.1 polystyrene trays \n      8.1.2 soaker pads \n      8.1.3 clear plastic container \n      8.1.4 plastic wrap \n      8.1.5 plastic begs \n      8.1.6 butcher paper \n \n8.2 Covering /wrapping of food products \n      8.2.1 pre-packaging \n      8.2.2 separating items to prevent cross-\ncontamination \n      8.2.3 protection of items \n      8.2.4 covering to prevent deterioration of products\n\n--- PDF PAGE 67 ---\n________________________________________________________________\n______TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n65\n9.  Food handling \nimplements   \nMay include but are not limited to: \n \n9.1  glove \n9.2  tongs \n9.3  knives \n9.4  slicers \n9.5  window displays \n9.6  heaters/ovens/bain marie/rotisserie/fryers \n9.7  freezers \n9.8  refrigerated units/coolrooms \n9.9  display fixtures, bins, cabinets \n9.10 self serve\n\n--- PDF PAGE 68 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n66\nEVIDENCE GUIDE \n1.   Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1  Consistently applied store policies and procedures in \nregard to hygiene and sanitation practices.  \n1.2  Consistently applied store policies and procedures for the \npreparation, arrangement, presentation, handling and \nstorage of food products. \n1.3  Consistently applied store policies and procedures in \nregard to displaying, merchandising, ticketing, pricing and \nstorage of stock. \n1.4   Displayed merchandise on fixtures shelves/display \nareas, in determined locations, in accordance with \nspecial manual handling techniques and other safety \nrequirements. \n1.5  Prepared display labels and price tickets for merchandise \nwith regard to store policies and procedures. \n1.6  Operated, maintained and stored a range of electronic \nticketing equipment according to: \n1.1.1 store policy and procedures  \n1.6.2 industry codes of practice \n1.6.3 manufacturers' instructions and design \nspecifications. \n1.7  Arranged correct pricing and information on merchandise  \naccording to store procedures, industry codes and \nlegislative requirements. \n1.8  Identified damaged, soiled or out of date stock and took \ncorrective action as required by store procedures. \n1.9  Maintained display areas and replenishing stock as \nrequired in accordance with store procedures. \n1.10 Performed correct manual handling, storage and display \ntechniques according to: \n1.10.1 stock characteristics \n1.10.2 industry codes of practice \n1.10.3 occupational health and safety regulations \n1.10.4 hygiene and sanitation practices. \n2.  Underpinning \nknowledge  \n \nStore policies and procedures, in regard to: \n \n2.1 merchandising, ticketing and pricing \n2.2 correct storage of stock \n2.3 store promotional themes, including advertising, \ncatalogues and special offers \n2.4 location of display areas \n2.5 availability and use of display materials \n2.6 stock rotation\n\n--- PDF PAGE 69 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n67\n2.7  stock replenishment \n2.8  scheduling building and rotating displays \n2.9  correct manual handling techniques for protection of \nself and merchandise \n2.10 correct storage procedures for labeling/ticketing \nequipment and materials \n2.11 preparation of food products for display \n2.12 placing and arranging food stock and maintaining \ndisplays \n2.13 labeling and ticketing items and displays \n2.14  pricing procedures including Goods and Services Tax \n(GST) requirements \n2.15 elements and principles of design and trends in retail \ndesign \n2.16 relevant occupational health and safety \nlegislation/regulations/codes of practice \n2.17 relevant legislation and statutory requirements \n2.18 Trade Practices and Fair Trading Acts \n2.19 relevant industry codes of practice \n3.  Underpinning \nskills \n3.1 Skills in: \n3.1.1 Using and maintaining of electronic labeling/ticketing \nequipment \n3.1.2 Completing tasks in set time frame \n \n3.2  Literacy and numeracy skills in relation to: \n  3.2.1 reading and interpreting store procedures and  \nguidelines \n3.2.2 weighing and measuring of goods \n3.2.3 machine or manual preparation of labels/tickets \n4.   Resource \nimplications \nThe following resources MUST be provided: \n4.1  A retail work environment \n4.2  Ticketing equipment \n4.3  Products for preparation and display \n4.4  Display materials and props \n4.5  Cleaning equipment and materials \n4.6  Relevant documentation, such as: \n4.7  store policy and procedures manuals \n4.8  occupational health and safety \n4.9  industry codes of practice and relevant legislation \n4.10 manufacturer's \ninstructions/operation \nmanuals \non \nelectronic ticketing equipment\n\n--- PDF PAGE 70 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n68\n \n5.  Methods of \nassessment \nCompetency may be assessed through: \n5.1    Observation with questioning \n5.2    Third Party Report \n5.3    Oral questioning/Interview \n5.4    Portfolio \n6.  Context  for \nassessment \n6.1.  Competency may be assessed in the workplace or in \nsimulated workplace environment \n6.2.  Assessment shall be observed while task are being  \nundertaken whether individually or in-group\n",
