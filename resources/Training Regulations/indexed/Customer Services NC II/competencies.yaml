h \ndiscretion \n2.3    Nature of complaint established  by active listening \nand questioning and confirmed with the customer\n\n--- PDF PAGE 44 ---\n___________________________________________________________________\n___TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n42\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n \n2.4    Action taken to resolve complaint to customer’s   \nsatisfaction wherever possible \n2.5    Unresolved customer dissatisfaction or complaints \npromptly referred to supervisor \n2.6    Opportunities taken to turn incidents of customer \ndissatisfaction into a demonstration of high quality \nservice to customers in line with store policy \n2.7    Documentation regarding customer dissatisfaction or \ncomplaints completed accurately and legibly \n2.8    Follow up action taken as necessary to ensure \ncustomer satisfaction \n3.  Receive and \nprocess sales \norders \n3.1    Customers’ details and information recorded \naccurately \n3.2    Customers’ promptly referred to appropriate area as \nrequired \n3.3    Customers provided with information in clear, \nconcise manner \n3.4    Sales orders processed, recorded and acted upon \naccording to store policy \n4.   Identify customers \nspecial \nrequirements \n4.1    Customers with special needs or requirements is \nidentified promptly by observation and questioning \n4.2    A willingness to assist conveyed verbally and non-\nverbally \n4.3    Customers’ needs promptly serviced, referred or \nredirected as required\n\n--- PDF PAGE 45 ---\n________________________________________________________________\n______TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n43\nRANGE OF VARIABLES \n \n \nVARIABLE\n \nRANGE\n 1.  Store policies and \nprocedures \nMay include but are not limited to: \n  \n1.1 Customer service \n1.2  Dealing with customer complaints \n1.3  Processing sales orders \n \n 2.  Customers \nMay include but are not limited to: \n \n2.1 Regular and new customers \n2.2 People from a range of social, cultural, ethnic \nbackgrounds and physical and mental abilities \n2.3 People with routine or special requests \n 3.  Sales orders   \nMay include but are not limited to: \n \n3.1 Verbal \n3.2 Written \n3.3 Electronic form \n 4.  Legislative \nrequirements \nMay include but are not limited to: \n \n4.1 Trade Practices Act \n4.2 Tobacco Laws \n4.3 Lottery Acts \n4.4 Liquor  Licensing Regulations \n4.5 Sale of X and R Rated Products \n4.6 Sale of Second-hand Products \n4.7 Trading Hours \n5.  Transport, storage \nand handling of \ngood customer \nservice  \nMay include but are not limited to: \n \n5.1 Store activities \n5.2 Internal and external customers \n5.3 Follow-up in event of delays in service provision \n6. Customer needs \nMay include but are not limited to: \n \n6.1 Information regarding store facilities and services \n6.2 Location of specific items within the store \n6.3 Returns or refunds\n\n--- PDF PAGE 46 ---\n________________________________________________________________\n______TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n44\nEVIDENCE GUIDE \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1.    Consistently applied store policies and procedures and \nindustry codes of practice in regard to customer service \n1.2.    Provided a quality service environment by treating \ncustomers and team members in a courteous and \nprofessional manner through all stages of the \nservice/sales procedures \n1.3.    Accurately identified the nature of customer complaints, \nresolved complaints and provided service to customers \naccording to store policies \n1.4.    Used effective questioning/active listening and \nobservation skills to identify customers’ special \nrequirements \n1.5     Accessed, recorded and processed sales orders \naccurately and responsibly according to store policies \nand procedures \n1.6     Collaboratively worked within a team to meet \ncustomers’ needs \n2.  Underpinning \nknowledge  \n \nStore policies and procedures in regard to: \n2.1     Customer service \n2.2.    Dealing with difficult customers \n2.3     Handling and recording complaints \n2.4     Allocated duties and responsibilities \n2.5     Customer returns and refunds \n2.6     Lay-away/gift voucher/gift check procedures \n2.7     Merchandise and service range of store departments \n2.8     Location of store departments \n2.9  Functions and procedures for operating the store \ntelephone system and other communication equipment \n2.10   Relevant legislation and statutory requirements \n2.11   Relevant industry codes of practice \n2.12   Relevant occupational health and safety requirements \n2.13   Questioning/active listening \n2.14   Conflict resolution \n2.15   Following set routines and procedures \n2.16   Handling difficult or abusive customers \n3.  Underpinning Skills\n \n3.1     Greeting/farewelling techniques  \n3.2     Add on selling concepts \n3.3     Literacy skills in the following areas: \n          3.3.1 Written procedures for orders, in person, by \ntelephone or electric format \n        3.3.2   Messages taken in person by telephone\n\n--- PDF PAGE 47 ---\n________________________________________________________________\n______TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n45\n          3.3.3   Written record of complaints \n          3.3.4   Sales, stock and delivery documentation \n \n3.4     Numeracy skills in regard to: \n          3.4.1   Handling of tender \n          3.4.2   Weighing and measuring goods \n4.   Resource \nImplications \nThe following resources MUST be provided: \n  Relevant documentation such as: \n4.1     Sales order forms \n4.2     Complaint/return forms \n4.3     Stock/inventory/price lists \n4.4     Store policy and procedures manuals \n4.5     Access to a range of customers with different \nrequirements \n4.6     Point of sale equipment and materials \n4.7     A communication system or a range of communication \nequipment \n5.   Methods of \nAssessment \nCompetency may be assessed through: \n5.1     Observation with questioning \n5.2     Demonstration with questioning \n5.3     Third Party Report \n5.4     Oral questioning/Interview \n6.  Context  of \nAssessment \n6.1.  Competency may be assessed in the workplace or in \nsimulated workplace environment \n6.2.  Assessment shall be observed while task are being \nundertaken whether individually or in-group\n",
