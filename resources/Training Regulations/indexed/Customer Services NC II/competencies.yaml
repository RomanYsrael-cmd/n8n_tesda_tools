omputer \nsystem \n4.1. Entered data are processed using appropriate \nsoftware commands \n4.2. Data are printed out as required using computer \nhardware/peripheral devices in accordance with \nstandard operating procedures \n \n4.3. Files and data are transferred between compatible \nsystems using computer software, hardware/ \nperipheral devices in accordance with standard \noperating procedures  \n5. Maintain computer \nequipment and \nsystems \n \n \n \n \n5. 1  Systems for cleaning, minor maintenance and   \n        replacement of consumables are implemented \n5.2   Procedures for ensuring security of data, including  \n        regular back-ups and virus checks are implemented \nin accordance with standard operating procedures \n5.3   Basic file maintenance procedures are implemented \nin line with the standard operating procedures\n\n--- PDF PAGE 25 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n23\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hardware and \nPeripheral Devices \n1.1. Personal computers \n1.2. Networked systems \n1.3. Communication equipment \n1.4. Printers \n1.5. Scanners \n1.6. Keyboard \n1.7.\nMouse\n2. Software \nSoftware includes the following but not limited to: \n2.1. Word processing packages \n2.2. Data base packages \n2.3. Internet \n2.4.\nSpreadsheets\n3. OH & S Guidelines \n3.1. OHS guidelines \n3.2.\nEnterprise procedures\n4. Storage Media \nStorage media include the following but not limited to: \n4.1. diskettes \n4.2. CDs \n4.3. zip disks \n4.4.\nhard disk drives, local and remote\n5. Ergonomic \nGuidelines \n5.1. Types of equipment used \n5.2. Appropriate furniture \n5.3. Seating posture \n5.4. Lifting posture \n5.5.\nVisual display unit screen brightness\n6. Desktop Icons \nIcons include the following but not limited to: \n6.1. directories/folders \n6.2. files \n6.3. network devices \n6.4.\nrecycle bin\n7. Maintenance \n7.1. Creating more space in the hard disk \n7.2. Reviewing programs \n7.3. Deleting unwanted files \n7.4. Backing up files  \n7.5. Checking hard drive for errors \n7.6. Using up to date anti-virus programs \n7.7.\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 26 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n24\n \nEVIDENCE GUIDE \n1. Critical Aspect of \nCompetency \nAssessment must show that the candidate: \n1.1. Selected and used hardware components correctly \nand according to the task requirement \n1.2. Identified and explain the functions of both \nhardware and software used, their general features \nand capabilities \n1.3. Produced accurate and complete data in \naccordance with the requirements \n1.4. Used appropriate devices and procedures to \ntransfer  files/data accurately \n1.5. Maintained computer system \n2. Underpinning \nKnowledge \n2.1. Basic ergonomics of keyboard and computer use \n2.2. Main types of computers and basic features of \ndifferent operating systems \n2.3. Main parts of a computer \n2.4. Storage devices and basic categories of memory \n2.5. Relevant types of software \n2.6. General security \n2.7. Viruses \n2.8. OH & S principles and responsibilities \n2.9. Calculating computer capacity \n3. Underpinning Skills \n3.1. Reading skills required to interpret work instruction \n3.2. Communication skills \n4. Resource Implication \nThe following resources MUST be provided: \n4.1. Computer hardware   with peripherals \n4.2. Appropriate software \n5. Methods of \nAssessment \n5.1. The assessor may select two of the following \nassessment methods to objectively assess the \ncandidate: \n5.1.1. Observation \n5.1.2. Questioning \n5.1.3. Practical demonstration \n6. Context for \nAssessment \n6.1     Assessment may be conducted in the workplace or \nin a simulated   environment\n",
