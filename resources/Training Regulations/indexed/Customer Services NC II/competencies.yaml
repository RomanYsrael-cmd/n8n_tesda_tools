ection \n7.5 Transport, storage and handling of goods \n8.  Management \n8.1 Team leader \n8.2 Supervisor \n8.3 Store/area manager\n\n--- PDF PAGE 61 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n59"
