        "source_text": "WRT522305\n\nUNIT DESCRIPTOR : This unit encompasses the skills, knowledge and attitudes\nrequired to balance the register/terminal in a retail\nenvironment. It involves clearing the register, counting\nmoney, calculating non-cash transactions and\n reconciling takings.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Remove sales\nfrom register/\nterminal\n1.1 Register/terminal balance performed at designated\ntimes according to store policy and procedures\n1.2 Register/terminal reading or print out accurately\ndetermined\n1.3 Change fund separated from sales prior to balancing\nprocedure and secured according to store policy\n1.4 Change fund supplied to register/terminal according\nto store policy\n1.5 Cash and non-cash documents removed and\ntransported according to store security policies and\nprocedures\n2. Reconcile sales\n2.1 Cash counted accurately\n2.2 Non-cash documents calculated accurately\n2.3 Balance between register/terminal reading and sum of\ncash and non-cash transactions determined\naccurately\n2.4 Records for store and individual department takings\nrecorded accurately and according to store policy\n\n--- PDF PAGE 55 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n53\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Store policies\nand procedures\nMay include but are not limited to:\n\n1.1 Register/terminal balance\n1.2 Security\n 2. Register /\nterminals\n2.1 May include but are not limited to:\n\n 2.1.1 Manual\n 2.1.2 Electronic\n\n2.2 May be cleared by:\n\n 2.2.1 Operator\n 2.2.2 Specialist staff\n 2.2.3 At intervals during or at close of trading\n 3. Non-cash\ntransactions\nMay include but are not limited to:\n\n3.1 Credit cards\n3.2 Cheques\n3.3 Purchase\n3.4 Lay-away\n3.5 Cash on delivery (C.O.D.)\n3.6 Gift cheques/certificates\n3.7 Credit memo\n\n--- PDF PAGE 56 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n54\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Operated register/terminal equipment according to\nmanufacturers’ instructions and store policy\n1.2. Consistently applied store policies and procedures in\nregard to handling cash and removing sales from\nregister/terminal\n1.3. Consistently applied store policies and procedures in\nregard to reading registers and recording information\n1.4. Processed documentation/records responsibly and\naccording to store policies and procedures\n1.5 Reconciled sales according to store policies and\nprocedures\n2. Underpinning\nknowledge\nStore policies and procedures in regard to:\n2.1 Register/terminal balance\n2.2. Cash and non-cash transactions security\n2.3 Change fund\n2.4 Operation of equipment used at register/terminal\n2.5 Cash and non-cash handling procedures, including:\n 2.5.1 Opening and closing point of sale terminal\n 2.5.2 Clearance of terminal and transference of tender\n 2.5.3 Maintenance of change fund\n 2.5.4 Counting cash\n 2.5.5 Calculating non-cash documents\n 2.5.6 Balancing point of sale terminal\n 2.5.7 Recording sales\n 2.5.8 Security of cash and non-cash transactions\n 2.5.9 Change required and denominations of change\n 2.5.10 Credit cards\n 2.5.11 Gift cheques/ certificates/lay away\n 2.5.12 Credit memos\n3. Underpinning\nskills\n3.1 Completing tasks in a set time frame\n3.2 Literacy skills in regard to interpreting documentation\n3.3 Numeracy skills in regard to:\n 3.3.1 Counting cash\n 3.3.2 Calculating non-cash transactions\n 3.3.3 Reporting on sales\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n Relevant documentation such as:\n4.1 Financial transactions on slips/invoices/receipts\n4.2 Sample debit, credit card vouchers, charge slips\n4.3 Recording/tally sheets\n\n--- PDF PAGE 57 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n55\n4.4 Store policy and procedure manuals in regard to\nregister/terminal balance\n4.5 Register/terminal and related equipment\n\n5. Methods of\nassessment\nCompetency may be assessed through:\n\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Third Party Report\n5.4 Oral questioning/Interview\n\n6. Context for\nassessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 58 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n56\nUNIT OF COMPETENCY: PERFORM STOCK CONTROL PROCEDURES\n\nUNIT CODE\n :"
