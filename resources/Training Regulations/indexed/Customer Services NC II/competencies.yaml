 December 2008\n\n29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : PREPARE PRODUCTS FOR DISPLAY\n\nUNIT CODE : WRT522301\n\nUNIT DESCRIPTOR :This unit involves the arrangement and presentation of\nmerchandise within the store. It includes the setting up and\nmaintenance of displays and labeling or pricing stock.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n\n1. Prepare Display\nLabels/Tickets\n\n1.1 Electronic ticketing equipment and pricing\nrequirement are used and maintained according to\ndesign and specifications.\n1.2 Tickets prepared using electronic equipment or neatly\nby hand according to store procedures.\n1.3 Soiled, damaged, illegible or incorrect labels/tickets\nidentified and corrective action taken.\n1.4 Labels/tickets for window, wall or floor displays\nprepared according to store policy.\n1.5 Ticketing equipment maintained and stored in a secure\nlocation.\n2. Place, arrange and\ndisplay price tickets\nand labels.\n2.1 Tickets/labels are visible and correctly placed on\n merchandise.\n2.2 Labels/tickets replaced according to store policy.\n2.3 Correct pricing and information maintained on\nmerchandise according to store procedures, industry\ncodes of practice and legislative requirements.\n3. Place and Arrange\nMerchandise\n\n3.1 Merchandise unpacked in accordance with store\npolicy.\n3.2 Merchandise placed on floor, fixtures and shelves in\ndetermined locations.\n3.3 Merchandise displayed to achieve a balanced fully\nstocked appearance and promote sales.\n3.4 Damaged, soiled or out of date stock identified and\ncorrective action taken as required according to store\nprocedure.\n3.5 Stock rotated according to stock requirements and\nstore procedure.\n3.6 Stock range placed to conform with fixtures, ticketing,\nprices or bar codes\n\n--- PDF PAGE 32 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n30\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n\n3.7 Stock presentation conforms to special handling\ntechniques and other safety requirements.\n4. Maintain Displays\n4.1 Special promotion areas reset and maintained in\naccordance with workplace policies and procedures.\n4.2 Supervisor assisted in selection of merchandise for\ndisplay.\n4.3 Merchandise arranged/faced up as directed and/or\naccording to layout specifications and load bearing\ncapacity of fixtures.\n4.4 Unsuitable or out of date displays identified, reset\nand/or removed as directed.\n4.5 Optimum stock levels identified and stock replenished\n according to store policy.\n4.6 Display areas maintained in a clean and tidy manner.\n4.7 Excess packaging removed from display areas.\n5. Protect Merchandise\n\n5.1 Correct handling, storage and display techniques\nidentified and used according to stock characteristics\nand legislative requirements.\n\n--- PDF PAGE 33 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Store Policy and\nProcedures\n\n 1.1 Store policy and procedures in regard to:\n\n• merchandising of stock\n• preparing and displaying tickets/labels\n• maintaining displays\n\n1.2 Displays may include\n• setting new displays\n• maintaining existing ones\n2. Safety Requirements\n2.1 Safety requirements may include:\n• transport, storage and handling of goods\n• hazardous substances\n• labeling of workplace substances\n3. Ticketing and Pricing\nRequirements\n\n3.1 Store ticketing and pricing requirements may include:\n• pricing gun\n• shelf tickets\n• shelf talkers\n• written labels\n• swing ticketing\n• bar coding\n• price boards\n• header boards\n\n4. Merchandise\n4.1 Merchandise may be characterized by:\n• type\n• brand\n• size\n• customer needs\n• color\n• price\n5. Correct handling,\nstorage and display\ntechniques\n5.1 Handling techniques may vary according to:\n• stock characteristics\n• industry codes of practice.\n6. Legislative\nRequirements\n5.1 Legislative requirements may include:\n• pricing requirements including Goods and Services\n Tax (GST) requirements\n• industry codes of practice\n• discounted items\n•\nTrade Practices and Fair Trading Acts\n\n--- PDF PAGE 34 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n32\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Consistently applied store policies and procedures in\nregard to displaying, merchandising, ticketing, pricing\nand storage of stock.\n1.2 Displayed merchandise on floor, fixtures,\nshelves/display areas, in determined locations, in\naccordance with special manual handling techniques\nand other safety requirements.\n1.3 Prepared display labels and priced tickets for\nmerchandise with regard to store policies and\nprocedures.\n1.4 Operated, maintained and stored a range of ticketing\nequipment according to:\n• store policy and procedures\n• industry codes of practice\n• manufacturers' instructions and design\nspecifications.\n1.5 Arranged correct pricing and information on\nmerchandise according to store procedures, industry\ncodes and government requirements.\n1.6 Identified damaged, soiled or out of date stock and\ntakes corrective action as required by store\nprocedures and legislative requirements.\n1.7 Maintained display areas and replenished stock as\nrequired in accordance with store procedures and\nlegislative requirements.\n1.8 Performed correct manual handling, storage and\ndisplay techniques according to:\n\n• stock characteristics\n• industry codes of practice\n• occupational health and safety\n• legislation/regulations/codes of practice.\n2. Underpinning\nKnowledge\nKnowledge of: store policies and procedures, in regard to:\n2.1 merchandising, ticketing and pricing of stock\n2.2 correct storage of stock\n2.3 store promotional themes, including advertising,\n catalogues and special offers\n2.4 location of display areas\n2.5 availability and use of display materials\n2.6 stock rotation/ reshuffle\n2.7 stock replenishment\n2.8 merchandise range\n2.9 scheduling for building or rotating displays\n\n--- PDF PAGE 35 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n33\n\n2.10 correct storage procedures for labeling/ticketing\n 2.11 equipment and materials\n 2.12 Correct manual handling techniques for protection\nof self and merchandise\n2.13 Principles of display\n2.14 Elements and principles of design and trends in\nretail design\n2.15 Relevant occupational health and safety regulations\n including:\n● manual handling\n● hygiene and sanitation\n● hazardous substances\n● labeling of workplace substances\n2.16 Relevant legislation and statutory requirements\n2.17 Pricing procedures including inclusion/exclusion of\nGoods and Services Tax (GST)\n2.18 Relevant industry codes of practice\n3. Underpinning Skills\n Skills in:\n3.1 Using and maintaining of manual and electronic\n labeling/ticketing equipment\n3.2 Completing tasks in a set time frame\n3.3 Literacy and numeracy skills in relation to:\n● reading and interpreting store procedures and\n● guidelines\n● machine or manual preparation of labels/tickets\n● reading and understanding manufacturer's\ninstructions\n3.4 Use of electronic labeling/ticketing equipment.\n4. Resource Implications\nThe following resources MUST be provided:\n 4.1 A retail work environment\n 4.2 A range of ticketing and pricing equipment\n 4.3 Merchandise for display\n 4.4 Display materials and props\n 4.5 Cleaning materials\n 4.6 Relevant documentation, such as:\n store policy and procedure manuals on\n housekeeping, merchandising and occupational\nhealth and safety\n\n--- PDF PAGE 36 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n34\n\n4.7 Manufacturer's instructions/operation manuals on\n electronic ticketing equipment\n4.8 Relevant legislation and industry codes of practice\n5. Method of\nAssessment\n\nCompetency may be assessed through:\n 5.1 Observation with questioning\n 5.2 Third party reports from a supervisor\n 5.3 Oral questioning/Interview\n6. Context of\nAssessment\n6.1 Assessment may be performed in the workplace or\nsimulated workplace situation.\n6.2 Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 37 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n35\nUNIT OF COMPETENCY: SELL PRODUCTS AND SERVICES\n\nUNIT CODE : WRT522302\n\nUNIT DESCRIPTOR : This unit involves the skills, knowledge and attitudes required\nto sell products and services in a retail environment. It\ninvolves the use of sales techniques and encompasses the\nkey selling skills from approaching the customer to closing\nthe sale. It requires a basic level of product knowledge.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply product\nknowledge\n\n1.1 Product knowledge developed by accessing relevant\n sources in information.\n1.2 Knowledge of the use and application of relevant\nproducts and services demonstrated according to store\npolicy and legislative requirements.\n\n2. Approach\ncustomer\n2.1 Timing of customer approach determined and applied in\naccordance with store policies and procedures.\n\n2.2 Effective sales approach identified and applied in\naccordance with store policies and procedures.\n\n2.3 Positive impression conveyed to arouse customer interest\nand in accordance with store policies and procedures.\n\n2.4 Knowledge of customer buying behavior demonstrated\nand in accordance with store policies and procedures.\n.\n3. Gather information\n3.1 Questioning techniques applied to determine customer\nbuying movies.\n3.2 Listening skills used to determine customer requirements.\n3.3 Non-verbal communication cues interpreted and clarified.\n3.4 Customers identified by name where possible.\n4. Sell benefits\n4.1 Customer needs matched to appropriate products and\n services.\n4.2 Knowledge of products' features and benefits\n communicated clearly to customers.\n4.3 Product use and safety requirements described to\n customers.\n4.4 Customers referred to appropriate product specialist as\n required.\n4.5 Routine customer questions about merchandise are\n answered accurately and honestly or referred to more\n experienced senior sales staff.\n\n--- PDF PAGE 38 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n36\n5. Overcome\nobjections\n\n 5.1 Customer objections identified and accepted in\naccordance with store policies and procedures.\n 5.2 Objections categorized into price, time and merchandise\ncharacteristics in accordance with store policies and\nprocedures.\n 5.3 Solutions offered according to store policy.\n 5.4 Problem solving applied to overcome customer\nobjections.\n6. Close sale\n6.1 Customer buying signals monitored, identified and\n responded to appropriately.\n6.2 Customer encouraged to make purchase decisions.\n6.3 Appropriate method of closing sale selected and applied\n.\n7. Maximize sales\nopportunities\n7.1 Customer buying signals monitored, identified and\nresponded to appropriately.\n7.2 Customer encouraged to make purchase decisions.\n7.3 Appropriate method of closing sale selected and applied.\n\n--- PDF PAGE 39 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Product Knowledge\n\n1.1 Product knowledge may include:\n• warranties\n• features, advantages and benefits\n• use by dates\n• handling/storage requirements\n• stock availability\n• safety features\n• price\n• promotions/give-aways\n2. Relevant Sources of\nInformation\n\n2.1 Relevant sources of information may include:\n• Internet\n• relevant staff members\n• store or supplier product manuals\n• product profiles\n• videos\n• demonstrations/orientations\n• labels\n• store tours\n• Customer list\n• Customer surveys/mystery shopping\n\n2.2 Handling techniques may vary according to stock\ncharacteristics and industry codes of practice.\n3. Store Policies and\nProcedures\n\n3.1 Store policy and procedures in regard to:\n• selling products and services\n• returns/exchange/replacement of products\n4. Legislative\nRequirements\n\n4.1 Legislative requirements may include:\n• Trade Practices Act\n• Drugs and Medicine Law\n• tobacco laws\n• liquor laws\n• sale of second hand goods\n• occupational health and safety\n• industry codes of practice\n\n--- PDF PAGE 40 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n38\n5. Customers\n\n5.1 Customers may include:\n• people with routine or special needs\n• regular or new customers\n• people from a range of social, cultural or ethnic\n backgrounds and physical and mental abilities\n6. Sales approach\n\nMay include but are not limited to:\n• face to face\n• over the telephone\n• over the Internet\n7. Routine customer\nquestions\n\n7.1 Routine customer questions may relate to:\n• price and price reductions\n• quality\n• features, advantages and benefits\n• after-sales service\n\n--- PDF PAGE 41 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n39\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Followed store policies and procedures in regard to\nselling products and services.\n1.2 Followed relevant legislation and statutory\nrequirements including consumer law.\n2. Underpinning\nKnowledge\n2.1 Industry codes of practice including: supermarket\nscanning code and jewellery and timepiece code.\n2.2 Store merchandise and service range.\n3. Underpinning Skills\n3.1 Listening questioning techniques.\n3.2 Verbal and non-verbal communication skills:\n• negotiation techniques.\n• customer buying motives\n• customer categories/types\n• types and customer needs, e.g. functional,\npsychological\n• problem solving techniques\n• performance analysis techniques\n3.3 Basic level of product knowledge\n3.4 Selling skills to include\n• opening techniques\n• buying signals\n• strategies to focus customer on specific\nmerchandise\n• add-ons and complementary sales\n• overcoming customer objections\n• closing techniques\n4. Resource Implications The following resource MUST be provided:\n4.1 a retail work environment\n4.2 relevant documentation, such as policy and\nprocedures manuals\n4.3 a range of customers with different requirements\n4.4 a range of merchandise and products appropriate to\nthe retail workplace\n4.5 product labels and sources of product information.\n\n--- PDF PAGE 42 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n40\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 observation of the candidate in the workplace\n5.2 third-party reports from a supervisor\n5.3 Oral questioning/Interview\n5.4 Portfolio assessment\n6. Context of\nAssessment\n6.1 Assessment may be performed in the workplace or\nsimulated workplace situation\n6.2 Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 43 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n41\nUNIT OF COMPETENCY: INTERACT WITH CUSTOMERS\n\nUNIT CODE\n : WRT522303\n\nUNIT DESCRIPTOR : This unit encompasses the skills, knowledge and attitudes\nrequired to deliver service to customers. It entails being\nable to communicate effectively with customers, respond\nto their complaints, receive and process sales orders and\nidentify customers’ special requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Deliver services to\ncustomers\n\n1.1 Communication with customers conducted in a\nprofessional, courteous manner, according to store\npolicy\n1.2 Customer needs and reasonable requests met or\nreferred to supervisor according to store policy or\nlegislative requirements\n1.3 Customer details and information recorded where\nnecessary\n1.4 Possible problems identified, anticipated and action\ntaken to minimize the effect on customer satisfaction\n1.5 Opportunities to deliver additional levels of service\nbeyond the customer’s immediate request\nrecognized and acted upon\n1.6 Contact with customer maintained until sale is\ncompleted according to store policy\n1.7 Customer farewelled appropriately and courteously\naccording to store policy\n1.8 Verbal and non-verbal communication used to\ndevelop rapport with customers during service\ndelivery\n1.9 Repeat customers encouraged by promotion of\nappropriate services or products according to store\npolicy\n1.10 Customer returns or refunds processed according to\nstore policies and procedures\n2. Respond to\ncustomer\ncomplaints\n2.1 Positive helpful attitude conveyed to customers\nwhen handling complaints\n2.2 Complaints handled sensitively, courteously and with\ndiscretion\n2.3 Nature of complaint established by active listening\nand questioning and confirmed with the customer\n\n--- PDF PAGE 44 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n42\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n2.4 Action taken to resolve complaint to customer’s\nsatisfaction wherever possible\n2.5 Unresolved customer dissatisfaction or complaints\npromptly referred to supervisor\n2.6 Opportunities taken to turn incidents of customer\ndissatisfaction into a demonstration of high quality\nservice to customers in line with store policy\n2.7 Documentation regarding customer dissatisfaction or\ncomplaints completed accurately and legibly\n2.8 Follow up action taken as necessary to ensure\ncustomer satisfaction\n3. Receive and\nprocess sales\norders\n3.1 Customers’ details and information recorded\naccurately\n3.2 Customers’ promptly referred to appropriate area as\nrequired\n3.3 Customers provided with information in clear,\nconcise manner\n3.4 Sales orders processed, recorded and acted upon\naccording to store policy\n4. Identify customers\nspecial\nrequirements\n4.1 Customers with special needs or requirements is\nidentified promptly by observation and questioning\n4.2 A willingness to assist conveyed verbally and non-\nverbally\n4.3 Customers’ needs promptly serviced, referred or\nredirected as required\n\n--- PDF PAGE 45 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n43\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Store policies and\nprocedures\nMay include but are not limited to:\n\n1.1 Customer service\n1.2 Dealing with customer complaints\n1.3 Processing sales orders\n\n 2. Customers\nMay include but are not limited to:\n\n2.1 Regular and new customers\n2.2 People from a range of social, cultural, ethnic\nbackgrounds and physical and mental abilities\n2.3 People with routine or special requests\n 3. Sales orders\nMay include but are not limited to:\n\n3.1 Verbal\n3.2 Written\n3.3 Electronic form\n 4. Legislative\nrequirements\nMay include but are not limited to:\n\n4.1 Trade Practices Act\n4.2 Tobacco Laws\n4.3 Lottery Acts\n4.4 Liquor Licensing Regulations\n4.5 Sale of X and R Rated Products\n4.6 Sale of Second-hand Products\n4.7 Trading Hours\n5. Transport, storage\nand handling of\ngood customer\nservice\nMay include but are not limited to:\n\n5.1 Store activities\n5.2 Internal and external customers\n5.3 Follow-up in event of delays in service provision\n6. Customer needs\nMay include but are not limited to:\n\n6.1 Information regarding store facilities and services\n6.2 Location of specific items within the store\n6.3 Returns or refunds\n\n--- PDF PAGE 46 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n44\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consistently applied store policies and procedures and\nindustry codes of practice in regard to customer service\n1.2. Provided a quality service environment by treating\ncustomers and team members in a courteous and\nprofessional manner through all stages of the\nservice/sales procedures\n1.3. Accurately identified the nature of customer complaints,\nresolved complaints and provided service to customers\naccording to store policies\n1.4. Used effective questioning/active listening and\nobservation skills to identify customers’ special\nrequirements\n1.5 Accessed, recorded and processed sales orders\naccurately and responsibly according to store policies\nand procedures\n1.6 Collaboratively worked within a team to meet\ncustomers’ needs\n2. Underpinning\nknowledge\n\nStore policies and procedures in regard to:\n2.1 Customer service\n2.2. Dealing with difficult customers\n2.3 Handling and recording complaints\n2.4 Allocated duties and responsibilities\n2.5 Customer returns and refunds\n2.6 Lay-away/gift voucher/gift check procedures\n2.7 Merchandise and service range of store departments\n2.8 Location of store departments\n2.9 Functions and procedures for operating the store\ntelephone system and other communication equipment\n2.10 Relevant legislation and statutory requirements\n2.11 Relevant industry codes of practice\n2.12 Relevant occupational health and safety requirements\n2.13 Questioning/active listening\n2.14 Conflict resolution\n2.15 Following set routines and procedures\n2.16 Handling difficult or abusive customers\n3. Underpinning Skills\n\n3.1 Greeting/farewelling techniques\n3.2 Add on selling concepts\n3.3 Literacy skills in the following areas:\n 3.3.1 Written procedures for orders, in person, by\ntelephone or electric format\n 3.3.2 Messages taken in person by telephone\n\n--- PDF PAGE 47 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n45\n 3.3.3 Written record of complaints\n 3.3.4 Sales, stock and delivery documentation\n\n3.4 Numeracy skills in regard to:\n 3.4.1 Handling of tender\n 3.4.2 Weighing and measuring goods\n4. Resource\nImplications\nThe following resources MUST be provided:\n Relevant documentation such as:\n4.1 Sales order forms\n4.2 Complaint/return forms\n4.3 Stock/inventory/price lists\n4.4 Store policy and procedures manuals\n4.5 Access to a range of customers with different\nrequirements\n4.6 Point of sale equipment and materials\n4.7 A communication system or a range of communication\nequipment\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Third Party Report\n5.4 Oral questioning/Interview\n6. Context of\nAssessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 48 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n46\nUNIT OF COMPETENCY : OPERATE RETAIL EQUIPMENT\n\nUNIT CODE\n : WRT522304\n\nUNIT DESCRIPTOR : This unit involves the skills, knowledge and attitudes\nto operate a variety of retail equipment. It involves\nidentifying the correct equipment required for a\ngiven task, maintaining retail equipment, applying\nkeyboard skills and operating data entry equipment.\n Clerical Administration\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Apply keyboard\nskills\n1.1.\nKeyboard operated using typing techniques within\ndesignated speed and accuracy requirements\n1.2. Information entered and edited accurately\n2. Operate data entry\nrequirement\n2.1 Data entered using relevant equipment according to\nstore policy and procedures\n2.2 Price marking equipment operated according to\nmanufacturer’s instructions and store policy\n2.3 Data entered accurately and within designated time\nlimits\n3. Perform point of\nsale transactions\n3.1 Point of sale transactions completed according to\nstore policy\n3.2 Store procedures identified and applied in respect of\ncash and non-cash transactions\n3.3 Store procedures identified and applied in regard to\nexchanges and return\n3.4 Goods moved through point of sale area efficiently\nand with attention to fragility and packaging\n3.5 Information entered into point of sale equipment\naccurately\n3.6 Follow up action taken as necessary\n3.7 Correct change tendered\n4. Complete sales\n4.1 Customer order forms, invoices, receipts completed\n4.2 Customer delivery requirements identified and\nprocessed accurately without undue delay\n4.3 Sales transactions processed without undue delay or\ncustomers directed to point of sale terminals\naccording to store policy\n\n--- PDF PAGE 49 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n47\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n5. Wrap and pack\ngoods\n5.1 Adequate supplies of wrapping material or bags\nmaintained/requested\n5.2 Appropriate packaging material selected\n5.3 Merchandise wrapped neatly and effectively where\nrequired\n5.4 Items packed safely to avoid damage in transit, and\nlabels attached where required\n5.5 Transfer of merchandise for parcel pick-up or other\ndelivery methods arranged if required\n6. Maintain retail\nequipment\n6.1. Purpose of equipment used in store/department\nidentified accurately\n6.2. Equipment operated according to design\nspecifications\n6.3. Equipment faults identified and reported to\nappropriate personnel\n6.4. Maintenance program for retail equipment identified\nand applied according to store policy\n\n--- PDF PAGE 50 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n48\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Store policies and\nadministration\nMay include but are not limited to:\n\n1.1 Store administration\n1.2 Clerical systems\n\n2. Transactions\nMay include but are not limited to:\n\n2.1 POS\n2.2 Travellers cheques\n2.3 Credit cards/store cards\n2.4 Lay-away\n2.5 Returns\n2.6 Exchanges\n2.7 Gift vouchers/gift cheques\n3. Point of sale\nequipment\nMay include but are not limited to:\n\n3.1 Cash registers\n3.2 Cash drawers\n3.3 Scanners\n\n4. Packaging and\nwrapping materials\nMay include but are not limited to:\n\n4.1 Boxes\n4.2 Bags\n4.3 Paper\n4.4 Bubble wrap\n4.5 Gift wrapping\n5. Retail equipment\nMay include but are not limited to:\n\n5.1 Point of sales terminal\n5.2 Electronic bar coding equipment for price labeling\nand stocktaking\n5.3 Portable data terminal\n5.4 Printers\n5.5 Electronic ordering equipment\n5.6 Wrapping and packing equipment such as shrink\nwrapping\n5.7 Equipment for carrying or moving merchandise\n\n5.8 Equipment for storage of merchandise including\n\n--- PDF PAGE 51 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n49\n\nVARIABLE\n\nRANGE\n refrigerators\n5.9 Weighing machines\n5.10 Thermometers\n5.11 Sensor tag removers\n5.12 Trolley return equipment\n5.13 Computers\n5.14 Scanners\n5.15 Numerical keyboard equipment including\ncalculators\n\n--- PDF PAGE 52 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n50\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Operated a range of store retail equipment according\nstore policy and procedures and industry codes of\npractice\n1.2. Operated and maintained a range of store retail\nequipment according to manufacturer’s instructions and\ndesign specifications\n1.3. Applied store maintenance program and reports\nfaults/problems\n1.4. Consistently applied safe work practices in the operation\nand maintenance of store retail equipment, according to\noccupational health and safety\nlegislation/regulations/codes of practice\n1.5. Read and interpreted operation manuals to solve\nroutine faults/errors and maintain and use the\nequipment effectively\n1.6. Used keyboard skills to enter and edit data accurately\n1.7. Completed tasks in set time frame\n2. Underpinning\nknowledge\n2.1 Store policies\n2.2. Operation of store retail equipment\n2.3 Maintenance of store retail equipment\n2.4 Reporting problems and faults\n2.5 Relevant legislation and statutory requirements\n2.6 Relevant occupational health and safety regulations\n2.7 Relevant industry codes of practice\n2.8 Purpose and impact of using electronic technology\n2.9 Operation and maintenance of store retail equipment\n2.10 Licensing requirements for carrying/moving merchandize\n(if applicable)\n3. Underpinning\nskills\n3.1 Completing tasks in set time frame\n3.2 Dealing with different types of transactions\n3.3 Following common fault finding procedures\n3.4 Literacy and numeracy skills in regard to:\n 3.4.1 reading store procedures\n 3.4.2 operating equipment\n\n--- PDF PAGE 53 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n51\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n\n Relevant documentation such as:\n4.1 Store policy procedure manuals\n4.2 Manufacturer’s instructions/operation manuals\n4.3 A range of store retail equipment\n5. Methods of\nassessment\n\nCompetency may be assessed through:\n\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Third Party Report\n5.4 Oral questioning/Interview\n6. Context for\nassessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 54 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n52\nUNIT OF COMPETENCY: BALANCE REGISTER/TERMINAL\n\nUNIT CODE\n : WRT522305\n\nUNIT DESCRIPTOR : This unit encompasses the skills, knowledge and attitudes\nrequired to balance the register/terminal in a retail\nenvironment. It involves clearing the register, counting\nmoney, calculating non-cash transactions and\n reconciling takings.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Remove sales\nfrom register/\nterminal\n1.1 Register/terminal balance performed at designated\ntimes according to store policy and procedures\n1.2 Register/terminal reading or print out accurately\ndetermined\n1.3 Change fund separated from sales prior to balancing\nprocedure and secured according to store policy\n1.4 Change fund supplied to register/terminal according\nto store policy\n1.5 Cash and non-cash documents removed and\ntransported according to store security policies and\nprocedures\n2. Reconcile sales\n2.1 Cash counted accurately\n2.2 Non-cash documents calculated accurately\n2.3 Balance between register/terminal reading and sum of\ncash and non-cash transactions determined\naccurately\n2.4 Records for store and individual department takings\nrecorded accurately and according to store policy\n\n--- PDF PAGE 55 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n53\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Store policies\nand procedures\nMay include but are not limited to:\n\n1.1 Register/terminal balance\n1.2 Security\n 2. Register /\nterminals\n2.1 May include but are not limited to:\n\n 2.1.1 Manual\n 2.1.2 Electronic\n\n2.2 May be cleared by:\n\n 2.2.1 Operator\n 2.2.2 Specialist staff\n 2.2.3 At intervals during or at close of trading\n 3. Non-cash\ntransactions\nMay include but are not limited to:\n\n3.1 Credit cards\n3.2 Cheques\n3.3 Purchase\n3.4 Lay-away\n3.5 Cash on delivery (C.O.D.)\n3.6 Gift cheques/certificates\n3.7 Credit memo\n\n--- PDF PAGE 56 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n54\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Operated register/terminal equipment according to\nmanufacturers’ instructions and store policy\n1.2. Consistently applied store policies and procedures in\nregard to handling cash and removing sales from\nregister/terminal\n1.3. Consistently applied store policies and procedures in\nregard to reading registers and recording information\n1.4. Processed documentation/records responsibly and\naccording to store policies and procedures\n1.5 Reconciled sales according to store policies and\nprocedures\n2. Underpinning\nknowledge\nStore policies and procedures in regard to:\n2.1 Register/terminal balance\n2.2. Cash and non-cash transactions security\n2.3 Change fund\n2.4 Operation of equipment used at register/terminal\n2.5 Cash and non-cash handling procedures, including:\n 2.5.1 Opening and closing point of sale terminal\n 2.5.2 Clearance of terminal and transference of tender\n 2.5.3 Maintenance of change fund\n 2.5.4 Counting cash\n 2.5.5 Calculating non-cash documents\n 2.5.6 Balancing point of sale terminal\n 2.5.7 Recording sales\n 2.5.8 Security of cash and non-cash transactions\n 2.5.9 Change required and denominations of change\n 2.5.10 Credit cards\n 2.5.11 Gift cheques/ certificates/lay away\n 2.5.12 Credit memos\n3. Underpinning\nskills\n3.1 Completing tasks in a set time frame\n3.2 Literacy skills in regard to interpreting documentation\n3.3 Numeracy skills in regard to:\n 3.3.1 Counting cash\n 3.3.2 Calculating non-cash transactions\n 3.3.3 Reporting on sales\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n Relevant documentation such as:\n4.1 Financial transactions on slips/invoices/receipts\n4.2 Sample debit, credit card vouchers, charge slips\n4.3 Recording/tally sheets\n\n--- PDF PAGE 57 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n55\n4.4 Store policy and procedure manuals in regard to\nregister/terminal balance\n4.5 Register/terminal and related equipment\n\n5. Methods of\nassessment\nCompetency may be assessed through:\n\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Third Party Report\n5.4 Oral questioning/Interview\n\n6. Context for\nassessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 58 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n56\nUNIT OF COMPETENCY: PERFORM STOCK CONTROL PROCEDURES\n\nUNIT CODE\n : WRT522306\n\nUNIT DESCRIPTOR : This unit encompasses the skills, knowledge and attitudes\nrequired to handle stock in a retail environment. It\ninvolves receiving and processing incoming goods,\nrotating stock, participating in stocktakes, reordering\n stock and dispatching goods.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Receive and\nprocess\nincoming goods\n1.1 Cleanliness and orderliness in receiving bay\nmaintained according to store policy\n1.2 Goods unpacked using correct techniques and\nequipment in line with store policy\n1.3 Packing materials removed and disposed of promptly\naccording to store policy\n1.4 Incoming stock accurately checked and validated\nagainst purchase orders and delivery documentation\naccording to store policy\n1.5 Items received inspected for damage, quality,\nexpiration dates, breakage or discrepancies and\nrecorded according to store policy\n1.6 Stock levels accurately recorded on store stock\nsystems, according to store policy\n1.7 Secure storage of goods arranged according to store\npolicy and legislative requirements\n1.8 Stock dispatched to appropriate area/department\n1.9 Stock price and code labels applied when required\naccording to store policy\n2. Rotate stock\n2.1 Stock rotation procedures for merchandise and\nwrapping and packing materials carried out routinely\nand accurately according to store policy\n2.2 Excess stock placed in storage or disposed of in\naccordance with store policy and legislative\nrequirements\n2.3 Safe lifting and carrying techniques maintained in\nline with store occupational health and safety policy\nand legislative requirements\n\n--- PDF PAGE 59 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n57\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n3. Participate in\nstocktake\n3.1 Stocktaking and cyclical counts assisted with,\naccording to store policy/procedures\n3.2 Stock records documentation completed according to\nstore stock control system\n3.3 Discrepancies in stock recorded and reported to\nrelevant personnel\n3.4 Electronic recording equipment operated and\nmaintained according to manufacturer’s specifications\n4. Record stock\n4.1 Minimum stock levels identified according to store\npolicy\n4.2 Stock requisition forms or electronic orders completed\naccurately\n4.3 Undelivered stock orders identified on stock system\nand followed up without undue delay\n5. Dispatch goods\n5.1 Goods to be returned to supplier identified and labeled\nwith date, supplier and reason for return or referred to\nmanagement if required\n5.2 Credit request documentation completed according to\nstore procedure\n5.3 Goods stored securely while awaiting dispatch\n5.4 Delivery documentation completed according to store\nprocedures\n5.5 Special delivery instructions noted\n5.6 Items packed safely and securely to avoid damage in\ntransit\n\n--- PDF PAGE 60 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n58\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n 1. Store policies and\nprocedures\nMay include but are not limited to:\n\n1.1 Stock control\n1.2 Consolidation\n1.3 Dispatch\n 2. Store stock\nsystems\nMay include but are not limited to:\n\n2.1 Manual\n2.2 Electronic\n 3. Stocktakes\nMay include but are not limited to:\n\n3.1 Cyclical\n3.2 Compliance driven\n4. Store stock control\nsystem\nMay include but are not limited to:\n\n4.1 Checking incoming or existing\n4.2 Special orders\n5. Stocks maybe\nmoved:\n5.1 Manually\n5.2 Mechanically’\n6. Handling\ntechniques\nMay include but are not limited to:\n\n6.1 Stock characteristics\n6.2 Industry codes of practice\n7. Legislative\nrequirements\nMay include but are not limited to:\n\n7.1 Occupational health and safety\n7.2 Hazardous substances and dangerous goods\n7.3 Labeling of workplace substances\n7.4 Waste removal and environmental protection\n7.5 Transport, storage and handling of goods\n8. Management\n8.1 Team leader\n8.2 Supervisor\n8.3 Store/area manager\n\n--- PDF PAGE 61 ---\n__________________________________________________________________