        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Operated a range of store retail equipment according\nstore policy and procedures and industry codes of\npractice\n1.2. Operated and maintained a range of store retail\nequipment according to manufacturer’s instructions and\ndesign specifications\n1.3. Applied store maintenance program and reports\nfaults/problems\n1.4. Consistently applied safe work practices in the operation\nand maintenance of store retail equipment, according to\noccupational health and safety\nlegislation/regulations/codes of practice\n1.5. Read and interpreted operation manuals to solve\nroutine faults/errors and maintain and use the\nequipment effectively\n1.6. Used keyboard skills to enter and edit data accurately\n1.7. Completed tasks in set time frame\n2. Underpinning\nknowledge\n2.1 Store policies\n2.2. Operation of store retail equipment\n2.3 Maintenance of store retail equipment\n2.4 Reporting problems and faults\n2.5 Relevant legislation and statutory requirements\n2.6 Relevant occupational health and safety regulations\n2.7 Relevant industry codes of practice\n2.8 Purpose and impact of using electronic technology\n2.9 Operation and maintenance of store retail equipment\n2.10 Licensing requirements for carrying/moving merchandize\n(if applicable)\n3. Underpinning\nskills\n3.1 Completing tasks in set time frame\n3.2 Dealing with different types of transactions\n3.3 Following common fault finding procedures\n3.4 Literacy and numeracy skills in regard to:\n 3.4.1 reading store procedures\n 3.4.2 operating equipment\n\n--- PDF PAGE 53 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n51\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n\n Relevant documentation such as:\n4.1 Store policy procedure manuals\n4.2 Manufacturer’s instructions/operation manuals\n4.3 A range of store retail equipment\n5. Methods of\nassessment\n\nCompetency may be assessed through:\n\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Third Party Report\n5.4 Oral questioning/Interview\n6. Context for\nassessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 54 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n52\nUNIT OF COMPETENCY: BALANCE REGISTER/TERMINAL\n\nUNIT CODE\n :"
        },
        "source_text": "WRT522304\n\nUNIT DESCRIPTOR : This unit involves the skills, knowledge and attitudes\nto operate a variety of retail equipment. It involves\nidentifying the correct equipment required for a\ngiven task, maintaining retail equipment, applying\nkeyboard skills and operating data entry equipment.\n Clerical Administration\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Apply keyboard\nskills\n1.1.\nKeyboard operated using typing techniques within\ndesignated speed and accuracy requirements\n1.2. Information entered and edited accurately\n2. Operate data entry\nrequirement\n2.1 Data entered using relevant equipment according to\nstore policy and procedures\n2.2 Price marking equipment operated according to\nmanufacturer’s instructions and store policy\n2.3 Data entered accurately and within designated time\nlimits\n3. Perform point of\nsale transactions\n3.1 Point of sale transactions completed according to\nstore policy\n3.2 Store procedures identified and applied in respect of\ncash and non-cash transactions\n3.3 Store procedures identified and applied in regard to\nexchanges and return\n3.4 Goods moved through point of sale area efficiently\nand with attention to fragility and packaging\n3.5 Information entered into point of sale equipment\naccurately\n3.6 Follow up action taken as necessary\n3.7 Correct change tendered\n4. Complete sales\n4.1 Customer order forms, invoices, receipts completed\n4.2 Customer delivery requirements identified and\nprocessed accurately without undue delay\n4.3 Sales transactions processed without undue delay or\ncustomers directed to point of sale terminals\naccording to store policy\n\n--- PDF PAGE 49 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n47\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n5. Wrap and pack\ngoods\n5.1 Adequate supplies of wrapping material or bags\nmaintained/requested\n5.2 Appropriate packaging material selected\n5.3 Merchandise wrapped neatly and effectively where\nrequired\n5.4 Items packed safely to avoid damage in transit, and\nlabels attached where required\n5.5 Transfer of merchandise for parcel pick-up or other\ndelivery methods arranged if required\n6. Maintain retail\nequipment\n6.1. Purpose of equipment used in store/department\nidentified accurately\n6.2. Equipment operated according to design\nspecifications\n6.3. Equipment faults identified and reported to\nappropriate personnel\n6.4. Maintenance program for retail equipment identified\nand applied according to store policy\n\n--- PDF PAGE 50 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n48\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Store policies and\nadministration\nMay include but are not limited to:\n\n1.1 Store administration\n1.2 Clerical systems\n\n2. Transactions\nMay include but are not limited to:\n\n2.1 POS\n2.2 Travellers cheques\n2.3 Credit cards/store cards\n2.4 Lay-away\n2.5 Returns\n2.6 Exchanges\n2.7 Gift vouchers/gift cheques\n3. Point of sale\nequipment\nMay include but are not limited to:\n\n3.1 Cash registers\n3.2 Cash drawers\n3.3 Scanners\n\n4. Packaging and\nwrapping materials\nMay include but are not limited to:\n\n4.1 Boxes\n4.2 Bags\n4.3 Paper\n4.4 Bubble wrap\n4.5 Gift wrapping\n5. Retail equipment\nMay include but are not limited to:\n\n5.1 Point of sales terminal\n5.2 Electronic bar coding equipment for price labeling\nand stocktaking\n5.3 Portable data terminal\n5.4 Printers\n5.5 Electronic ordering equipment\n5.6 Wrapping and packing equipment such as shrink\nwrapping\n5.7 Equipment for carrying or moving merchandise\n\n5.8 Equipment for storage of merchandise including\n\n--- PDF PAGE 51 ---\n________________________________________________________________\n______TR-Customer Services NC II Promulgated December 2008\n\n49\n\nVARIABLE\n\nRANGE\n refrigerators\n5.9 Weighing machines\n5.10 Thermometers\n5.11 Sensor tag removers\n5.12 Trolley return equipment\n5.13 Computers\n5.14 Scanners\n5.15 Numerical keyboard equipment including\ncalculators\n\n--- PDF PAGE 52 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n50\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Operated a range of store retail equipment according\nstore policy and procedures and industry codes of\npractice\n1.2. Operated and maintained a range of store retail\nequipment according to manufacturer’s instructions and\ndesign specifications\n1.3. Applied store maintenance program and reports\nfaults/problems\n1.4. Consistently applied safe work practices in the operation\nand maintenance of store retail equipment, according to\noccupational health and safety\nlegislation/regulations/codes of practice\n1.5. Read and interpreted operation manuals to solve\nroutine faults/errors and maintain and use the\nequipment effectively\n1.6. Used keyboard skills to enter and edit data accurately\n1.7. Completed tasks in set time frame\n2. Underpinning\nknowledge\n2.1 Store policies\n2.2. Operation of store retail equipment\n2.3 Maintenance of store retail equipment\n2.4 Reporting problems and faults\n2.5 Relevant legislation and statutory requirements\n2.6 Relevant occupational health and safety regulations\n2.7 Relevant industry codes of practice\n2.8 Purpose and impact of using electronic technology\n2.9 Operation and maintenance of store retail equipment\n2.10 Licensing requirements for carrying/moving merchandize\n(if applicable)\n3. Underpinning\nskills\n3.1 Completing tasks in set time frame\n3.2 Dealing with different types of transactions\n3.3 Following common fault finding procedures\n3.4 Literacy and numeracy skills in regard to:\n 3.4.1 reading store procedures\n 3.4.2 operating equipment\n\n--- PDF PAGE 53 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n51\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n\n Relevant documentation such as:\n4.1 Store policy procedure manuals\n4.2 Manufacturer’s instructions/operation manuals\n4.3 A range of store retail equipment\n5. Methods of\nassessment\n\nCompetency may be assessed through:\n\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Third Party Report\n5.4 Oral questioning/Interview\n6. Context for\nassessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 54 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n52\nUNIT OF COMPETENCY: BALANCE REGISTER/TERMINAL\n\nUNIT CODE\n :"
