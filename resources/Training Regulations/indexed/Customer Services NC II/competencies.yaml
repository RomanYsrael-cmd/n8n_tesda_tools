        "source_title": "PERFORM WORKPLACE SECURITY AND SAFETY PRACTICES",
        "source_text": "--- PDF PAGE 27 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n25\nUNIT OF COMPETENCY  :   PERFORM WORKPLACE SECURITY AND SAFETY      \n                                                       PRACTICES \n \nUNIT CODE  \n          :   WRT311204 \n \n         UNIT DESCRIPTOR        : This unit of competency deals with the knowledge, skills and \nattitudes in following health, safety and security practices. It \nincludes dealing with emergency situations and maintaining \nsafe personal presentation standards. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized items are elaborated in the Range of Variables\n1.  Follow workplace \nprocedures for \nhealth, safety and \nsecurity practices \n1.1 Correct health, safety and security procedures are \nfollowed in line with legislation, regulations and \nenterprise procedures \n1.2 Breaches of health, safety and security procedures \nare identified and reported in line with enterprise \nprocedure \n1.3 Suspicious behavior or unusual occurrence are \nreported in line with enterprise procedure   \n2.   Deal with emergency  \n      situations \n2.1  Emergency and potential emergency situations are \nrecognized and appropriate action are taken within \nindividual’s scope of responsibility \n2.2 Emergency procedures are followed in line with    \nenterprise procedures \n2.3 Assistance is sought from colleagues to resolve or \nrespond to emergency situations \n2.4 Details of emergency situations are reported in line \nwith enterprise procedures \n3.  Maintain safe \npersonal \npresentation \nstandards\n 3.1 Safe personal standards are identified and followed in \nline with enterprise requirements\n\n--- PDF PAGE 28 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n26\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Health, Safety and \nSecurity Procedures \nMay include but are not limited  to : \n1.1 use of personal protective clothing and equipment \n1.2 safe posture including sitting, standing, bending \n1.3 manual handling including lifting, transferring \n1.4 \nsafe work techniques including knives and \nequipment, handling hot surfaces, computers and \nelectronic equipment \n1.5 \nsafe handling of chemicals, poisons and dangerous \nmaterials \n1.6 ergonomically sound furniture and work stations \n1.7 emergency fire and accident \n1.8 hazard identification and control \n1.9 security of documents, cash, equipment, people \n1.10 key control systems\n2. Breaches of \nProcedure \nMay include but are not limited  to : \n2.1 loss of keys \n2.2 strange or suspicious persons \n2.3 broken or malfunctioning equipment \n2.4 loss of property, goods or materials \n2.5 damaged property or fittings \n2.6 lack of suitable signage when required \n2.7 lack of training on health and safety issues \n2.8 unsafe work practices\n3. Emergency \nMay include but is not limited  to :  \n3.1   personal injuries                             \n3.2   fire \n3.3   electrocution \n3.4   natural calamity i.e. earthquake/flood \n3.5   criminal acts i.e. robbery \n3.6   bomb\n\n--- PDF PAGE 29 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n27\nEVIDENCE GUIDE \n1.  Critical Aspects of \nCompetency \nAssessment requires tangible evidence that the candidate : \n1.1  Complied with industry practices and procedures \n1.2  Used interactive communication with others \n1.3  Complied with workplace safety, security and hygiene \npractices \n1.4   Identified faults & problems and the necessary \ncorrective action \n1.5   Promoted public relation among others \n1.6   Complied with quality standards \n1.7  Responded to emergency situations in line with \nenterprise guidelines \n1.8  Complied with proper dress code\n2.  Underpinning \nKnowledge  \n2.1 Communication \n       2.1.1  Interactive communication with others \n       2.1.2  Interpersonal skills \n       2.1.3  Good working attitude \n       2.1.4  Ability to work quietly; with cooperation; patience, \ncarefulness, cleanliness and aesthetic values \n       2.1.5   Ability to focus on task at hand \n \n2.2 Systems, Processes and Operations \n       2.2.1   Workplace health, safety and security \nprocedures     \n       2.2.2    Emergency procedures \n       2.2.3    Personal presentation \n \n2.3 Safety Practices \n      2.3.1     Proper disposal of garbage \n      2.3.2     Practice safety measures \n     2. 3.3    5S Implementation\n3.  Underpinning Skills \n3.1    Ability to make decision \n3.2   Time management \n3.3    Ability to offer alternative steps \n3.4\nCare in handling and operating equipment\n\n--- PDF PAGE 30 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n28\n \n4.  Resource \nImplications may \nInclude \n4.1 Procedures Manual on safety, security, health and \nemergency \n4.2 Availability of tools, equipment, supplies and \nmaterials \n5.  Methods of \nAssessment \n5.1 Written examination \n5.2 Practical demonstration  \n5.3\nInterview\n6.   Context for \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through \nTESDA's accredited assessment center\n",
