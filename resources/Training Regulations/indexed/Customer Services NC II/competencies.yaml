          "source_text": "1.   Establish the \ntheme or \nconcepts/develop \ndisplay ideas \n1.1   Identify purpose and audience for the display. \n1.2   Identify products that will be displayed. \n1.3   Generate ideas for the display using creative thinking \ntechniques. \n1.4   Test ideas against display requirements and \norganisation's requirements. \n1.5   Discuss display options with relevant personnel. \n1.6   Modify display ideas and refine according to feedback  \nand confirm with relevant personnel. \n2.  Identify the \nrequirements of \nthe display \n   \n2.1  Research relevant information where required. \n2.2  Identify resources required to create the display. \n2.3  Identify and consider constraints or factors that may \naffect the creation of the display. \n3.   Plan and execute \ndisplays \n3.1  Develop perspective and detailed visual \nmerchandising plan for the concept.   \n3.2  Source resources, materials and products to meet plan \nrequirements. \n3.3  Create display following the visual merchandising plan. \n3.4  Seek assistance from relevant personnel where \nrequired.   \n3.5  Execute display and make refinements as required. \n4.   Maintain display \n4.1  Maintain display in a clean and tidy condition and \nproducts replaced as necessary according to visual \nmerchandising plan \n4.2  Make changes or alterations to the display as \nappropriate.\n\n--- PDF PAGE 72 ---\n________________________________________________________________\n______TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n70\nRANGE OF VARIABLES \n \n \nVARIABLE\n \nRANGE\n 1.  Purpose   \nMay include but are not limited to: \n  \n1.1  window display \n1.2  promotion \n1.3  sale \n1.4  new products \n1.5  new range \n 2.  Audience \nMay include but are not limited to: \n \n2.1  new or repeat customers \n2.2  external and internal foot or vehicular traffic \n2.3  people of different ages \n2.4  people from range of social, cultural and ethnic     \nbackgrounds and with varying physical and mental \nabilities \n2.5  people with varying degrees of language and literacy \n3.  Creative thinking \ntechniques  \n May include but are not limited to: \n \n3.1 brainstorming \n3.2 visualizing \n3.3 telling stories \n3.4 creative writing \n3.5 mock-up props or simulation \n3.6 mind mapping \n3.7 drawings/planograms/perspectives/floor plans \n4.  Organization’s \nrequirements \nMay include but are not limited to: \n \n4.1 organizational standards \n4.2 Occupational Health and Safety \n4.3 branding \n4.4 store policies and procedures \n4.5 aesthetics \n4.6 budget \n4.7 staff \n4.8 allocated space\n\n--- PDF PAGE 73 ---\n________________________________________________________________\n______TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n71\n 5.  Display options \nMay include but are not limited to: \n \n5.1 indoor or outdoor \n5.2 static or moving \n5.3 sound \n5.4 lighting \n 6.  Feedback \nMay include but are not limited to: \n \n6.1 verbally \n6.2 in writing \n6.3 in groups \n6.4 individually \n7.  Relevant \npersonnel \nMay include but are not limited to: \n \n7.1 manager \n7.2 team leader \n7.3 external personnel with display creation expertise \n8.  Relevant \ninformation \nMay include but are not limited to: \n \n8.1 direct observation \n8.2 written reports/surveys \n8.3 colleagues \n8.4 internet \n8.5 magazines \n8.6 technical personnel \n8.7 marketing personnel \n9.  Resources \nMay include but are not limited to: \n \n9.1 labels and tickets \n9.2 materials \n9.3 equipment and technology \n9.4 fixtures and fittings \n9.5 staff \n9.6 time \n9.7 budget \n10.  Constraints or \nfactors \nMay include but are not limited to: \n \n10.1 time \n10.2 budget \n10.3 staff \n10.4 availability of materials\n\n--- PDF PAGE 74 ---\n________________________________________________________________\n______TR-Customer Services NC II                                    Promulgated December 2008 \n \n \n72\n \n \n10.5 space \n10.6 product characteristics \n11. Visual \nmerchandising \nplan \nMay include but are not limited to: \n \n11.1 simple sketches of planned display \n11.2 floor lay-out/perspective/planogram \n11.3 checklist of materials and equipment required\n\n--- PDF PAGE 75 ---\n______________________________________________________________________\nTR-Customer Services NC II                                    Promulgated December 2008 \n \n \n73"
