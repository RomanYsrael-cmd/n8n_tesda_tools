        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Operated register/terminal equipment according to\nmanufacturers’ instructions and store policy\n1.2. Consistently applied store policies and procedures in\nregard to handling cash and removing sales from\nregister/terminal\n1.3. Consistently applied store policies and procedures in\nregard to reading registers and recording information\n1.4. Processed documentation/records responsibly and\naccording to store policies and procedures\n1.5 Reconciled sales according to store policies and\nprocedures\n2. Underpinning\nknowledge\nStore policies and procedures in regard to:\n2.1 Register/terminal balance\n2.2. Cash and non-cash transactions security\n2.3 Change fund\n2.4 Operation of equipment used at register/terminal\n2.5 Cash and non-cash handling procedures, including:\n 2.5.1 Opening and closing point of sale terminal\n 2.5.2 Clearance of terminal and transference of tender\n 2.5.3 Maintenance of change fund\n 2.5.4 Counting cash\n 2.5.5 Calculating non-cash documents\n 2.5.6 Balancing point of sale terminal\n 2.5.7 Recording sales\n 2.5.8 Security of cash and non-cash transactions\n 2.5.9 Change required and denominations of change\n 2.5.10 Credit cards\n 2.5.11 Gift cheques/ certificates/lay away\n 2.5.12 Credit memos\n3. Underpinning\nskills\n3.1 Completing tasks in a set time frame\n3.2 Literacy skills in regard to interpreting documentation\n3.3 Numeracy skills in regard to:\n 3.3.1 Counting cash\n 3.3.2 Calculating non-cash transactions\n 3.3.3 Reporting on sales\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n Relevant documentation such as:\n4.1 Financial transactions on slips/invoices/receipts\n4.2 Sample debit, credit card vouchers, charge slips\n4.3 Recording/tally sheets\n\n--- PDF PAGE 57 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n55\n4.4 Store policy and procedure manuals in regard to\nregister/terminal balance\n4.5 Register/terminal and related equipment\n\n5. Methods of\nassessment\nCompetency may be assessed through:\n\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Third Party Report\n5.4 Oral questioning/Interview\n\n6. Context for\nassessment\n6.1. Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 58 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n56\nUNIT OF COMPETENCY: PERFORM STOCK CONTROL PROCEDURES\n\nUNIT CODE\n :"
