  "source_text": "Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2 The qualification of Customer Services NC II may be attained through:\n\n 4.2.1 Accumulation of COCs in the following areas:\n\n 4.2.1.1 Provide sales and customer services to clients/customers\n• Prepare products for display\n• Interact with customers\n• Sell products and services\n• Perform stock control procedures\n 4.2.1.2 Provide cashiering services to clients/customers\n• Interact with customers\n• Operate retail equipments\n• Balance Register/terminal\n• Sell products and services\n• Perform stock control procedures\n 4.2.1.3 Provide visual merchandising and display services to\n clients/customers\n• Prepare products for display\n• Sell products and services\n• Interact with customers\n• Perform merchandise presentation skills\n 4.2.1.4 Provide food services to clients/customers\n• Prepare products for display\n• Interact with customers\n• Sell products and services\n• Perform stock control procedures\n• Merchandise food products\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COC).\n\n 4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n--- PDF PAGE 88 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n86\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs related to this qualification\n\n4.5.2 Experienced workers (wage employed or self employed) related\n to this qualification\n\n4.6 The guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS)\".\n\n--- PDF PAGE 89 ---\n______________________________________________________________________TR-Customer Services NC II\nPromulgated December 2008\n\n87\n\nBASIC\nCOMPETENCIES\nCOMPETENCY MAP – WHOLESALE AND RETAIL\nTRADING SECTOR\n\nCUSTOMER SERVICES NC II\nDevelop and\nupdate industry\nknowledge\n\nPerform computer\noperations\n\nProvide effective\ncustomer service\n\nObserve\nworkplace\n hygiene\nprocedures\nPerform\n workplace\nsafety\npractices\nCORE/ELECTIVE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\nMerchandise Food\nProducts\n\nANNEX A\n\nPrepare products\nfor display\n\nCoordinate\nhousekeeping\n\nCoordinate\nmerchandise\npresentation\nPerform\nMerchandise\nPresentation\nSkills\n\nInteract with\ncustomers\n\nCoordinate\ninteraction with\ncustomers\n\nCommunicate in\nthe workplace\n\nBuy Merchandise\n\nSell products and\nservices\n\nManage store’s\nsales performance\n\nCoordinate sales\nperformance\n\nManage and\ncontrol store safety\nand security\n\nOperate retail\nequipment\n\nBuy merchandise\n\nOrder stock\n\nMinimize theft\n\nBalance register/\nterminal\n\nMaintain store\nsecurity\n\nMaintain store\nsafety\n\nCoordinate work\nteams\n\nPerform stock\ncontrol procedures\n Implement staff\ntraining\n\n Maintain\nemployee relations\n\nManage store\npresentation and\nfacilities\n\nManage Sales and\nService Delivery\n\nManage and\ncontrol\nmerchandise mix\n\nManage store’s\nsales performance\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\n(5S)\nParticipate\nin workplace\ncommunication\nWork\n in team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\nPractice\noccupational\nhealth and\nsafety procedures\nLead workplace\ncommunication\nCollect,\nanalyze and\norganize\ninformation\nPlan\nand organize\nwork\nApply\nproblem-\nsolving\ntechniques in\nthe workplace\nLead\nsmall teams\nPromote\nenvironmental\nprotection\n\n--- PDF PAGE 90 ---\n____________________________________________________________________\n__TR-Customer Services NC II Promulgated December 2008\n\n88\nDEFINITION OF TERMS\n\n1. Certification\nRefers to the process of giving recognition to the\nattainment of knowledge, skills and attitudes\n2. Competency\nIs the specification of knowledge, skills and attitudes\nrequired to perform work activity in a range of context\nor environment\n3. Customer\nSomeone who purchases products or services from\nanother. Simple enough. But when you're responsible\nfor systems that analyze and report customer data, this\ndefinition falls short. And it is not an adequate definition\nwhen you're the end-user making business decisions\nbased on reports generated by those systems.\n4. Customer Service\nCustomer service, like a brand, is what the customer\nperceives and remembers of the service they received.\nWhat a customer perceives is the service they receive\nis not necessarily the service they actually receive.\n5. Cost of Goods Available\nfor Sale and Cost of\nGoods Sold\nTo calculate the cost of goods available for sale, we\nadded the purchases made during the year to the\npreceding year's end-of- year inventories. To calculate\nthe cost of goods sold, we deducted the end of the\ncurrent year's value of inventories from the cost of\ngoods available for sale.\n6. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person\nwho works in particular area of work is able to perform\n7. Evidence Guide\nIt is a guide for assessment that provides information\non critical aspects of competency, underpinning\nknowledge, underpinning skills, resource implications,\ncontext of assessment and assessment method.\n8. Gross Margin\nThe measure of gross margin represents total sales\nless cost of goods sold.\n9. Market\nA public gathering held for buying and selling\nmerchandise.\n10. Marketing\nMarketing is the social process by which individuals\nand groups obtain what they need and want through\ncreating and exchanging products and value with\nothers\n\n--- PDF PAGE 91 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n89\n11. Philippine TVET\nQualification Framework\nRefers to a comprehensive, nationally consistent\nframework for qualifications in the TVET sector. It also\nprovides the parameter for the integration of learning\nand assessment in the middle skills development.\n12. Point of Sale\nThis is a wide-ranging definition that can include all\ndisplay and merchandising methods used to enable\ntransactions. Point of Sale products refers to both the\nhardware and software that essentially helps run a\nbusiness. The POS can refer to: cash register systems,\ncash registers, point of sale terminals, POS receipt\nprinters, POS pole displays, OEM printers, and all other\npoint of sale equipment.\n13. Purchases\nPurchases represent the total cost of merchandise that\nwas purchased for resale during the year, whether or\nnot payment for the merchandise was made during the\nyear.\n14. Qualification\nRefers to the national certificate issued by the TESDA\nor its accredited industry organizations in recognition\nthat a person has achieved competencies relevant to a\ntrade or industry.\n15. Range of Variable\nIt describes the circumstances or context in which the\nwork is to be performed.\n16. Retailing\nConsists of the sale of goods or merchandise from a\nfixed location, such as a department store or kiosk, or\nby post, in small or individual lots for direct\nconsumption by the purchaser.\n17. Sales\nAre the activities involved in selling products or\nservices in return for money or other compensation. It\nis an act of completion of a commercial activity.\n18. Tag\nA strip of leather, paper, metal, or plastic attached to\nsomething or hung from a wearer's neck to identify,\nclassify, or label\n19. Transaction\nA typical transaction is a catalog merchandise order\nphoned in by a customer and entered into a computer\nby a customer representative. The order transaction\ninvolves checking an inventory database, confirming\nthat the item is available, placing the order, and\nconfirming that the order has been placed and the\n\n--- PDF PAGE 92 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n90\nexpected time of shipment.\n20. Unit of Competency\nRefers to a discrete aspect of work, which would\nnormally be performed by only one person.\n\n--- PDF PAGE 93 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n91\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERTS:\n\nMS. MIRIAM C. PALABRICA\nConsultant\nPhilippine Retailers Association\nUnit 2610 Jollibee Plaza\nEmerald Ave., Ortigas Center, Pasig City\nMR. STEVEN T. CUA\nPresident\nPhilippine Amalgamated Supermarkets, Inc.\n#2 N.A. Ramirez St., Rodriguez Ave.,\nQuezon City\nMS. JANETTE U. TAGUIANG\nOperations Manager\nEDGE INTERLINKS CORP.\n28th Floor East Tower Phil. Stock Exchange\nBldg, Ortigas, Pasig city\nMR. WILSON LIM\nChairman\nBenison Group of Companies\nMS. NORA MICHELLE SIGGAO