    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Customer Services\nNC Level: NC II\nNominal Training Duration: 18 HOURS (Basic Competencies)\n 18 HOURS (Common Competencies)\n 120 HOURS (Core Competencies)\n 80 HOURS (Electives)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nCustomer Services workers in accordance with industry standards. It covers the basic,\ncommon, core and elective competencies on preparing products for display, interacting\nwith customers, selling products and services, operating retail equipment, balancing\nregister/terminal, performing stock control procedures, merchandizing food products,\nand performing merchandise presentation skills.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nSuggested Nominal Training Duration: 18 Hours\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nWorkplace informa-\ntion.\n\n1.2 Complete relevant\nwork related\ndocuments.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 78 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n76\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1.3 Participate in work-\nplace meeting and\nDiscussion\n\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam\nrole\nand\nresponsibility in a\nteam.\n\n2.2 Describe work as a\nteam member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate\npersonal\nobjectives\nwith\norganizational goals.\n\n3.2 Set and meet work\npriorities.\n\n3.3 Maintain professional\ngrowth and\n development\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n\n4.2 Control hazards and\nrisks\n\n4.3 Maintain occupational\nhealth\nand\nsafety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 79 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n77\nCOMMON COMPETENCIES\n18 Hours\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n\n1.1 Understand and\nfollow procedures,\nspecifications and\nmanuals of\ninstruction.\n• Lecture\n• Group\nDiscussion\n• Assignment\n\n• Interview\n• Oral Test\n\n2. Perform computer\noperations\n2.1 Identify and explain\nthe functions,\ngeneral features and\ncapabilities of both\nhardware and\nsoftware\n2.2 Prepare and use\nappropriate\nhardware and\nsoftware according\nto task requirement\n2.3 Use appropriate\ndevices and\nprocedures to\ntransfer files/data\n2.4 Produce accurate\nand complete data\naccording to the\nrequirements\n\n• Lecture\n• Group\nDiscussion\n• Tutorial or\nself-pace\n\n● Interviews/\nQuestioning\n● Demonstration\n● Observation\n3. Perform workplace\nsecurity and safety\npractices\n3.1 Follow workplace\nprocedures for\nhealth, safety and\nsecurity practices\n3.2 Deal with emergency\nsituations\n3.3 Maintain safe\npersonal presenta-\ntion standards\n• Lecture\n• Group\nDiscussion\n• Assignment\n\n• Interview\n• Oral Test\n\n--- PDF PAGE 80 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n78\nCORE COMPETENCIES\n\n120 Hours\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare products\nfor display\n1.1 Place and arrange\nmerchandise\n1.2 Prepare display\nlabels/tickets\n1.3 Place, arrange and\ndisplay price tickets\nand labels\n1.4 Maintain displays\n1.5 Protect merchandise\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n2. Sell products and\nservices\n2.1 Apply product\nknowledge\n2.2 Approach customer\n2.3 Gather information\n2.4 Sell benefits\n2.5 Overcome objections\n2.6 Close sale\n2.7 Maximize sales\nopportunities\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n3. Interact with\ncustomers\n3.1 deliver services to\ncustomers\n3.2 Respond to\ncustomer complaints\n3.3 Receive and process\nsales orders\n3.4 Identify customers\nrequirements\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n\n--- PDF PAGE 81 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n79\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n4. Operate retail\nequipment\n\n4.1 Apply keyboard skills\n4.2 Operate data entry\nrequirement\n4.3 Perform point of sale\ntransactions\n4.4 Complete sales\n4.5 Wrap and pack\ngoods\n4.6 Maintain retail\nequipment\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n5. Balance register/\nterminal\n5.1 Remove takings\nfrom register/\nterminal\n5.2 Reconcile takings\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n6. Perform stock\ncontrol procedures\n6.1 Receive and process\nincoming goods\n6.2 Rotate stocks\n6.3 Participate in stock\nstake\n6.4 Record stock\n6.5 Dispatch goods\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n\n--- PDF PAGE 82 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n80\nELECTIVES\n\n80 HOURS\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Merchandise food\nproducts\n1.1 Prepare food stock\n1.2 Place/arrange food\nstock\n1.3 Prepare and display\nlabels and tickets\n1.4 Maintain food\ndisplays\n1.5 Protect food stock\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n2. Perform\nMerchandise\nPresentation Skills\n2.1 Establish the theme\nor concepts/develop\ndisplay ideas\n2.2 Identify the\nrequirements of the\ndisplay\n2.3 Plan and execute\ndisplays\n2.4 Maintain display\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n\n--- PDF PAGE 83 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n81"
