  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Customer Services NC II.\n\nThis includes information on curriculum design, training delivery, trainee entry\nrequirements, tools and equipment, training facilities, and trainers’ qualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Customer Services\nNC Level: NC II\nNominal Training Duration: 18 HOURS (Basic Competencies)\n 18 HOURS (Common Competencies)\n 120 HOURS (Core Competencies)\n 80 HOURS (Electives)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nCustomer Services workers in accordance with industry standards. It covers the basic,\ncommon, core and elective competencies on preparing products for display, interacting\nwith customers, selling products and services, operating retail equipment, balancing\nregister/terminal, performing stock control procedures, merchandizing food products,\nand performing merchandise presentation skills.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nSuggested Nominal Training Duration: 18 Hours\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nWorkplace informa-\ntion.\n\n1.2 Complete relevant\nwork related\ndocuments.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 78 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n76\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1.3 Participate in work-\nplace meeting and\nDiscussion\n\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam\nrole\nand\nresponsibility in a\nteam.\n\n2.2 Describe work as a\nteam member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1\nIntegrate\npersonal\nobjectives\nwith\norganizational goals.\n\n3.2 Set and meet work\npriorities.\n\n3.3 Maintain professional\ngrowth and\n development\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n\n4.2 Control hazards and\nrisks\n\n4.3 Maintain occupational\nhealth\nand\nsafety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 79 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n77\nCOMMON COMPETENCIES\n18 Hours\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n\n1.1 Understand and\nfollow procedures,\nspecifications and\nmanuals of\ninstruction.\n• Lecture\n• Group\nDiscussion\n• Assignment\n\n• Interview\n• Oral Test\n\n2. Perform computer\noperations\n2.1 Identify and explain\nthe functions,\ngeneral features and\ncapabilities of both\nhardware and\nsoftware\n2.2 Prepare and use\nappropriate\nhardware and\nsoftware according\nto task requirement\n2.3 Use appropriate\ndevices and\nprocedures to\ntransfer files/data\n2.4 Produce accurate\nand complete data\naccording to the\nrequirements\n\n• Lecture\n• Group\nDiscussion\n• Tutorial or\nself-pace\n\n● Interviews/\nQuestioning\n● Demonstration\n● Observation\n3. Perform workplace\nsecurity and safety\npractices\n3.1 Follow workplace\nprocedures for\nhealth, safety and\nsecurity practices\n3.2 Deal with emergency\nsituations\n3.3 Maintain safe\npersonal presenta-\ntion standards\n• Lecture\n• Group\nDiscussion\n• Assignment\n\n• Interview\n• Oral Test\n\n--- PDF PAGE 80 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n78\nCORE COMPETENCIES\n\n120 Hours\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare products\nfor display\n1.1 Place and arrange\nmerchandise\n1.2 Prepare display\nlabels/tickets\n1.3 Place, arrange and\ndisplay price tickets\nand labels\n1.4 Maintain displays\n1.5 Protect merchandise\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n2. Sell products and\nservices\n2.1 Apply product\nknowledge\n2.2 Approach customer\n2.3 Gather information\n2.4 Sell benefits\n2.5 Overcome objections\n2.6 Close sale\n2.7 Maximize sales\nopportunities\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n3. Interact with\ncustomers\n3.1 deliver services to\ncustomers\n3.2 Respond to\ncustomer complaints\n3.3 Receive and process\nsales orders\n3.4 Identify customers\nrequirements\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n\n--- PDF PAGE 81 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n79\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n4. Operate retail\nequipment\n\n4.1 Apply keyboard skills\n4.2 Operate data entry\nrequirement\n4.3 Perform point of sale\ntransactions\n4.4 Complete sales\n4.5 Wrap and pack\ngoods\n4.6 Maintain retail\nequipment\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n5. Balance register/\nterminal\n5.1 Remove takings\nfrom register/\nterminal\n5.2 Reconcile takings\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n6. Perform stock\ncontrol procedures\n6.1 Receive and process\nincoming goods\n6.2 Rotate stocks\n6.3 Participate in stock\nstake\n6.4 Record stock\n6.5 Dispatch goods\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n\n--- PDF PAGE 82 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n80\nELECTIVES\n\n80 HOURS\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Merchandise food\nproducts\n1.1 Prepare food stock\n1.2 Place/arrange food\nstock\n1.3 Prepare and display\nlabels and tickets\n1.4 Maintain food\ndisplays\n1.5 Protect food stock\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n2. Perform\nMerchandise\nPresentation Skills\n2.1 Establish the theme\nor concepts/develop\ndisplay ideas\n2.2 Identify the\nrequirements of the\ndisplay\n2.3 Plan and execute\ndisplays\n2.4 Maintain display\n\n• Lecture (Walk\nthrough)\n• Group\ndiscussion\n• Demonstration\nby expert\n• Role Play\n• Hands-on\napplication of\ntheory\n\n• Interview\n• Oral test\n• Role play\n• Observation\nin Training\nCenter\nWorkshop\n• Observation\nin Workshop\n(OJT)\n\n--- PDF PAGE 83 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n81\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations\n\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\njust facilitates the training delivery\n\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners\n\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\n\n--- PDF PAGE 84 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n82\nplace. Distance learning may employ correspondence study, audio,\nvideo or computer technologies\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should\npossess the following requirements:\n\n• can communicate in English both in the oral and written form\n• should be physically and mentally fit;\n• with good moral character;\n• with pleasing personality and\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4\nLIST OF TOOLS AND EQUIPMENT\n\nCUSTOMER SERVICES – NC II\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for CUSTOMER SERVICES - NC II are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1\nunit\nTagger/labeling\nmachine\n1\nunit\nLCD projector\n1 box\nWhite board markers\n(assorted)\n1\nunit\nStapler\n1\nunit\ncomputer with\ninternet connection\n1 unit\nWhite Board\n1\nbox\nStaple Wire\n1\nunit\nAudio visual\nequipment (TV,\nCD/DVD player)\n25\npcs.\nFolders\n1\nunit\nTape Dispenser\n1\nunit\nProjector screen\n1 box\nFasteners\n1\nunit\nExtension Cord\n1\nunit\nTelefax\n1\nream\nBond paper\n\n1\nunit\nPOS machine\n\n1\nunit\nCredit card\n(hypercom\n\n--- PDF PAGE 85 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n83\nequipment)\nverification machine\n\n1\nunit\nScanner\n\n25\nunits\nArm Chairs\n\n1\nunit\nInstructor’s table\n\n1\nunit\nInstructor’s chair\n\n1\nunit\nFiling Cabinets\n\n1\nunit\nSound system\n\n Display Module/Racks – (assorted merchandise, hangers, standees)\n\n*NOTE: Implementation of the training program can be made possible through a MOA\nbetween the Training school and Industry for the use of the facilities. This is in\nresponse to school limitations on the high cost of equipment.\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\n\nSize in\nMeters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nLecture\n8 x 7 m.\n56 sq. m.\n56 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n21 sq. m.\nTotal workshop area:\n92 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR WHOLESALE AND RETAIL TRADING\nSECTOR\n\nTRAINER QUALIFICATION I (TQ II)\n\n• Must be a holder of NC II\n• Must have undergone training on Training Methodology II (TM II)\n• Must be physically and mentally fit\n\n--- PDF PAGE 86 ---\n______________________________________________________________________\nTR-Customer Services NC II Promulgated December 2008\n\n84\n• *Must have at least 5 years job/industry experience\n\n*Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 87 ---\n___________________________________________________________________\n___TR-Customer Services NC II Promulgated December 2008\n\n85"
