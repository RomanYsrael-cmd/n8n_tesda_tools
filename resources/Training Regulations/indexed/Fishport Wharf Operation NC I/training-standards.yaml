    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FISHPORT/WHARF OPERATIONS Level: NC I\n\nNormal Training Duration: 18 Hours (Basic)\n\n14 Hours (Common)\n\n64 Hours (Core)\n 96 Total Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and\nattitudes of FISHPORT/WHARF OPERATIONS NC I (Fish Handler) in\naccordance with industry standards. It covers Basic, Common and Core\nCompetencies such as:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary speaking &\nmessages in a workplace.\n1.2 Follow routinary speaking &\nmessage\n1.3 Perform work duties following\nwritten notices.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective workplace\nrelationship.\n2.2 Contribute to work group\nactivities.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstrati\non\n•\nObservation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct\nin the workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstrati\non\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 40 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n38\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove unnecessary\nitems\n4.2 Arrange items\n4.3 Maintain work areas, tools\nand equipment\n4.4 Follow standardize work\nprocess and procedures\n4.5 Perform work spontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstrati\non\n• Observation\n• Interviews/\nquestioning\n\nCOMMON COMPETENCIES FOR AGRI-FISHERY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures\n1.1 Determine areas of concern\nfor safety measures\n1.2 Apply appropriate safety\nmeasures\n1.3 Safekeep and maintain\nmaterials, tools and\nequipment.\n1.4 Dispose waste materials and\noutfit\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Visit/tour\n• Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n2. Use of\nfishport/wharf\ntools and\nequipment\n2.1 Prepare and use\nfishport/wharf tools\n2.2 Prepare and operate\nfishport/wharf equipment\n2.3 Observe safety precautions\nin handling fishport/wharf\ntools and equipment.\n2.4 Carry out routine\nmaintenance and storage of\ntools and equipment\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Visit/tour\n• Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n3. Perform\nestimation\nand basic\ncalculation\n3.1 Perform estimation activities\n3.2 Perform basic workplace\ncalculation\n3.3 Apply corrective measures\nas necessary\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Interaction\n• Practical\nexercise\n•Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n• Practical\nexercise\n\n--- PDF PAGE 41 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n39\n4. Apply food\nsafety and\nsanitation\n4.1 Wear personal protective\nequipment\n4.2 Observe personal hygiene\nand good grooming\n4.3 Implement food sanitation\npractices\n4.4 Render safety measures and\nfirst aid procedures\n4.5 Implement housekeeping\nactivities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced learning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Unload and\nload fish and\nfish products\n\n1.1 Prepare for unloading and\nloading of fish and fish\nproducts\n1.2 Unload fish and fish products\n1.3 Loading and handling fish\nand fish products\n1.4 Implement housekeeping\nactivities\n\n• Demonstration\n• Discussion\n\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n2. Classify fish\nand fish\nproducts\n2.1 Prepare for fish classification\n2.2 Classify fish and fish products\n2.3 Weigh, segregate, pile and\nsecure fish loads\n2.4 Implement housekeeping\nactivities\n• Lecture/\nDiscussion\n• Demonstration\n• Direct\nobservation\n• Written test or\nexamination\n• Questioning\n• Demonstration\n/Simulation\n\n--- PDF PAGE 42 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n40\n\n3.1 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based on the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n41\n• Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.2 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements.\n\n• Able to read and write;\n• With good moral character;\n• Ability to communicate, both oral and written\n• Physically fit and mentally healthy as certified by a Public Health\nOfficer"
