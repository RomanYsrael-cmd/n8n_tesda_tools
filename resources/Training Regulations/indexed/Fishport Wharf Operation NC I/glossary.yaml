  "source_text": "DEFINITION OF TERMS/ ABBREVIATIONS\n\nBFAR -\nBureau of Fisheries and Aquatic Resources\n\nCOC -\nCertificate of Competency\n\nDENR -\nDepartment of Environment and Natural Resources\n\nDOH -\nDepartment of Health\n\nDTS -\nDual Training System\n\nFishport -\nis a fixed platform where ships can tie-up and load or unload fish\nlandings\n\nFish landing- the part of the fish catch that is put ashore. Frequently, landings\nprovide the only record of total catch; i.e. the landings plus\ndiscards\n\nFootbath -\nA long shallow tub or depression in the concrete floor where\nworkers walk through a mild solution (usually including chlorine) to\npromote hygiene. Usually located along the entrance of the fishport\n\nHACCP -\nHazard Analysis and Critical Control Point\n\nNC\n-\nNational Certificate\n\nOHS -\nOccupational Health and Safety\n\nPPE -\nPersonal Protective Equipment\n\nPFDA -\nPhilippine Fishery Development Authority\n\nPTQCS-\nPhilippine TVET Qualification and Certification System\n\nRPL -\nRecognition of Prior Learning\n\nSOP -\nStandard Operating Procedure\n\nTLC\n-\nTender Loving Care\n\nTM\n-\nTraining Methodology\n\n--- PDF PAGE 49 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n48\nTQ\n-\nTrainer Qualification\n\nTVET -\nTechnical Vocational Education and Training\n\nUTPRAS-\nUnited TVET Program Registration and Accreditation System\n\nWharf -\nis a large area with a fixed platform where ships can tie-up and\nload or unload cargoes and passengers.\n\n--- PDF PAGE 50 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n49\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE PHILIPPINE CHAMBER OF AGRICULTURE AND FOODS, INC.\n\n• THE TECHNICAL AND EXPERT PANELS\n\nDR. RODOLFO P. ESTIGOY\nMR. ALEJANDRO T. ESCANO\nChief\nPresident\nBureau of Post Harvest Research and\nExtension\nCentral Luzon State University, Science\nCity of Muñoz, Nueva Ecija\nPhilippine Chamber of Agriculture and\nFood (PCAFI)\nMFI Bldg. Otigas Avenue Extension,\nPasig City\nMR. EDWIN ANDOT\nDR. ALMA M. DELA CRUZ\nPresident\nChamber of Agriculture, Fisheries and\nFood in Northern Mindanao\n2nd floor, United Way Bldg.\nCapitol Cmpd., Cagayan de Oro City\nProfessor\nCentral Luzon State University\nMuñoz, Nueva Ecija\n\nMR. ROLANDO T. LAMPARERO\nMR. MAX RONALD CABREROS\nOperation Head\nRD Fishing Industries, Inc.\nCalumpang, General Santos City\nOperation Manager\nSan Andres Fishing Industries, Inc.\nTambler, General Santos City\nMR. HENRY V. DELICANA\nMR. REYNALDO C. GASQUE\nMarketing Head\nRugela Fishing Industries, Inc.\nCalumpang, General Santos City\nAsst. Head, Marketing Department\nDamalerio Fishing Corporation\nTambler, General Santos City\nMR. DEXTER TAN\nMS. FELY O. LIM\nMarketing Head\nSan Andres Fishing Industries, Inc.\nTambler, General Santos City\nAdministrative Officer\nSOCSKSARGEN Federation of Fishing\nand Allied Industries, Inc. (SFFAII)\nMR. CUSTODIO L. BALAOING, JR.\nChief, Market Operations Division\nPhilippine Fishery Development Authority\nNavotas Fish Port Complex\nNorth Bay Blvd., Navotas, Metro Manila\n\n--- PDF PAGE 51 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n50\n\n The Participants in the validation of this Training Regulation\n\n• Cantoja Deep Sea Fishing Inc., Corp.\n• Damalerio Fishing Corp.\n• DFC Tuna Venture Corp.\n• FOP Fishing, Inc.\n• Mommy Gina Tuna Resources\n• R.A. Fishing Industries\n• RD Fishing Industry, Inc.\n• RLGFI Corporation\n• Rugela Fishing Industries.,