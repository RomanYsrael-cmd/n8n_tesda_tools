    {
      "source_text": "UNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to perform safety measures effectively and efficiently. It includes identifying areas, tools, materials, time and place in performing safety measures."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Determine areas of concern for safety measures 1.1 Work tasks are identified in line with fishport/wharf operation 1.2 Place for safety measures are determined in line with fishport/wharf operation 1.3 Time for safety measures are determined in line with fishport/wharf operation 1.4 Appropriate tools, materials and outfits are prepared in line with job requirements 2. Apply appropriate safety measures 2.1 Tools and materials are used according to specifications and procedures 2.2 Outfits are worn according to fishport/wharf requirements 2.3 Effectivity/shelf life/expiration of materials are strictly observed 2.4 Emergency procedures are known and followed to ensure a safework requirement 2.5 Hazards in the workplace are identified and reported in line with fishport/wharf guidelines 3. Safekeep/dispose tools, materials and outfit 3.1 Used tools and outfit are cleaned after use and stored in designated areas 3.2 Unused materials are properly labeled and stored according to manufacturers recommendation and fishport/wharf requirements 3.3 Waste materials are disposed according to manufacturers, government and fishport/wharf requirements"
