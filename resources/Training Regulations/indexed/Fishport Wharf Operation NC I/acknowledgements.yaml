    {
      "source_text": "These guidelines are set to provide the Technical Vocational Education and Training (TVET) providers with information and other important requirements to consider when designing training programs for FISHPORT/WHARF OPERATIONS NC I. These units of competency are categorized into basic, common and core competencies."
    },
