    {
      "source_text": "TRAINING REGULATIONS FOR FISHPORT/WHARF OPERATIONS NC I"
    },
    {
      "source_text": "Section 1 FISHPORT/WHARF OPERATIONS NC I QUALIFICATION"
    },
    {
      "source_text": "The Fishport/Wharf Operations NC I Qualification consists of competencies that a person must achieve to perform handling of fish and fish products in fisport/wharf. Persons with this qualifications may or may not have previous experience in these skills. Work would be routine and carried out under close supervision."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of the Agriculture and Fishery Sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "Code BASIC COMPETENCIES 500311101 Receive and respond to workplace communication 500311102 Work with others 500311103 Demonstrate work values 500311104 Practice basic housekeeping procedures"
    },
    {
      "source_text": "Code COMMON COMPETENCIES AGR321201 Apply safety measures in operation AGR321202 Use tools and equipment AGR321203 Perform estimation and calculations AGR741201 Apply food safety and sanitation"
    },
    {
      "source_text": "Code CORE COMPETENCIES AGR921301 Unload and load fish and fish products AGR921302 Classify fish and fish products"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be:"
    },
    {
      "source_text": "Fish handler"
    },
