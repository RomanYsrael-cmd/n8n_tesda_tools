      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Perform estimation 1.1 Job requirements are identified from written or oral communications 1.2 Quantities of materials and resources required to complete a work task are estimated based on job requirements 1.3 The time needed to complete a work activity is estimated according to requirements 1.4 Accurate estimate for work completion are made 1.5 Estimate of materials and resources are reported to appropriate person 2. Perform basic workplace calculation 2.1 Calculations to be made are identified according to job requirements 2.2 Correct method of calculation is identified 2.3 System and units of measurement to be followed are ascertained 2.4 Calculation needed to complete work tasks are performed using the four basic process of addition, division, multiplication and subtraction 2.5 Calculate whole fraction, percentage and mixed when are used to complete the instructions 2.6 Number computed in self checked and completed for alignment"
    },
