      "source_text": "BASIC COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY: RECEIVE AND RESPOND TO WORKPLACE COMMUNICATION UNIT CODE : 500311101 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to receive, respond and act on verbal and written communication."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Follow routine spoken messages 1.1 Required information is gathered by listening attentively and correctly interpreting or understanding information/instructions 1.2 Instructions/information are properly recorded in accordance with standard procedures 1.3 Instructions are acted upon immediately in accordance with information received 1.4 Clarification is sought from workplace supervisor on all occasions when any instruction/information is not clear 2. Perform workplace duties following written notices 2.1 Written notices and instructions are read and interpreted correctly in accordance with organizational guidelines 2.2 Routine written instruction are followed in sequence 2.3 Feedback is given to workplace supervisor based on the instructions/information received"
    },
    {
