  "source_text": "ACKNOWLEDGEMENTS\n\n 49-50\n\n--- PDF PAGE 3 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n1\n\nTRAINING REGULATIONS FOR\nFISHPORT/WHARF OPERATIONS NC I\n\nSection 1\nFISHPORT/WHARF OPERATIONS NC I QUALIFICATION\n\nThe Fishport/Wharf Operations NC I Qualification consists of\ncompetencies that a person must achieve to perform handling of fish and fish\nproducts in fisport/wharf. Persons with this qualifications may or may not have\nprevious experience in these skills. Work would be routine and carried out under\nclose supervision.\n\nThis Qualification is packaged from the competency map of the Agriculture\nand Fishery Sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCode\nBASIC COMPETENCIES\n500311101\nReceive and respond to workplace communication\n500311102\nWork with others\n500311103\nDemonstrate work values\n500311104\nPractice basic housekeeping procedures\n\nCode\nCOMMON COMPETENCIES\nAGR321201\nApply safety measures in operation\nAGR321202\nUse tools and equipment\nAGR321203\nPerform estimation and calculations\nAGR741201\nApply food safety and sanitation\n\nCode\nCORE COMPETENCIES\nAGR921301\nUnload and load fish and fish products\nAGR921302\nClassify fish and fish products\n\nA person who has achieved this Qualification is competent to be:\n\n•\nFish handler\n\n--- PDF PAGE 4 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n2\n\nSECTION 2\n\nCOMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education\nand Training (TVET) providers with information and other important requirements\nto consider when designing training programs for FISHPORT/WHARF\nOPERATIONS NC I. These units of competency are categorized into basic,\ncommon and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE : 500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to receive, respond and act on verbal and\nwritten communication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine spoken\nmessages\n1.1 Required information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2 Instructions/information are properly recorded in\naccordance with standard procedures\n1.3 Instructions are acted upon immediately in\naccordance with information received\n1.4 Clarification is sought from workplace supervisor on\nall occasions when any instruction/information is not\nclear\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in sequence\n2.3 Feedback is given to workplace supervisor based on\nthe instructions/information received\n\n--- PDF PAGE 5 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n3\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1 Handwritten and printed material\n1.2 Internal memos\n1.3 External communications\n1.4 Electronic mail\n1.5 Briefing notes\n1.6 General correspondence\n1.7 Marketing materials\n1.8 Journal articles\n2. Organizational guidelines It may include:\n2.1 Information documentation procedures\n2.2 Company policies and procedures\n2.3 Organization manuals\n2.4 Service manual\n\n--- PDF PAGE 6 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n4\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2 Received and acted on verbal messages and instructions\n1.3 Demonstrated competency in recording\ninstructions/information\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Knowledge of organizational policies/guidelines in regard\nto processing internal/external information\n2.2 Ethical work practices in handling communications\n2.3 Communication process\n3. Underpinning\nSkills\n3.1 Conciseness in receiving and clarifying\nmessages/information/communication\n3.2 Accuracy in recording messages/information\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Pens\n4.2 Note pads\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 7 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n5\n\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to develop workplace relationship and\ncontribute in workplace activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good relationship\n1.2 Assistance is sought from workgroup when\ndifficulties arise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and\ntasks are made according to organizational\nrequirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 8 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n6\n\nRANGE OF VARIABLES\nVARIABLE\n RANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and\nclients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n4. Providing\nsupport to team\nmembers\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 9 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n7\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nProvided support to team members to ensure goals are\nmet\n1.2\nActed on feedback from clients and colleagues\n1.3\nAccessed learning opportunities to extend own\npersonal work competencies to enhance team goals\nand outcomes\n2. Underpinning\nKnowledge\n2.1\nThe relevant legislation that affects operations,\nespecially with regards to safety\n2.2\nReasons why cooperation and good relationships are\nimportant\n2.3\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4\nUnderstanding how to elicit and interpret feedback\n2.5\nKnowledge of workgroup member’s responsibilities and\nduties\n2.6\nImportance of demonstrating respect and empathy in\ndealings with colleagues\n2.7\nUnderstanding of how to identify and prioritize personal\ndevelopment opportunities and options\n3. Underpinning Skills\n3.1\nAbility to read and understand the organization’s\npolicies and work procedures\n3.2\nWrite simple instructions for particular routine tasks\n3.3\nInterpret information gained from correspondence\n3.4\nCommunication skills to request advice, receive\nfeedback and work with a team\n3.5\nPlanning skills to organized work priorities and\narrangement\n3.6\nTechnology skills including the ability to select and use\ntechnology appropriate to a task\n3.7\nAbility to relate to people from a range of social, cultural\nand ethnic backgrounds.\n\n--- PDF PAGE 10 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n8\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2 Materials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2 Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3 Case studies and scenarios