    },
    {
      "source_text": "TRAINER QUALIFICATION (TQ I)"
    },
    {
      "source_text": "Must be a holder of Fishport/Wharf Operations NC I or its equivalent"
    },
    {
      "source_text": "Must have undergone training on Training Methodology II (TM II)"
    },
    {
      "source_text": "Must be computer literate"
    },
    {
      "source_text": "Must be physically and mentally fit"
    },
    {
      "source_text": "Must have at least 2 years job/industry experience"
    },
    {
      "source_text": "Must be a civil service eligible (for government position or appropriate professional license issued by the Professional Regulatory Commission)"
