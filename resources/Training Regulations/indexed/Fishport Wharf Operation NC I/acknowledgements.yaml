\n2.4 Faults in fishport/wharf equipment are identified\nand reported in line with fishport/wharf\nprocedures\n2.5 Fishport/Wharf equipment used according to its\nfunction\n2.6 Followed safety procedures according to SOP\n3.\nPerform preventive\nmaintenance\n3.1 Tools and equipment are cleaned immediately\nafter use in line with fishport/wharf procedures\n3.2 Routine check-up and maintenance are\nperformed according to organization’s procedure\n3.3 Tools and equipment are stored in designated\nareas in line with fishport/wharf procedures\n\n--- PDF PAGE 23 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n21\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Fishport/Wharf\nequipment\n\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Fishport/Wharf tools\n2.1 Cutters\n2.2 Weighing scales\n2.3 Hand tools\n2.4 Measuring tools\n3. Pre-operation check-up\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\n--- PDF PAGE 24 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n22\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate fishport/wharf tools and\nequipment\n1.2 Operated fishport/wharf equipments according to manual\nspecification\n1.3 Performed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1 Ideal good work habits to demonstrate to workers\neasy and safety standards during operation of\nfishport/wharf equipment\n2.2\nCodes and Regulations\n2.2.1 Environmental Compliance Certificate (ECC)\n2.2.2 Effective work supervision in the operation of\nfishport/wharf equipment\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n