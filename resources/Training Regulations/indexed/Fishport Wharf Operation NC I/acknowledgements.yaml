      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional Assessment is to be undertaken by the learner who enrolled in a structured learning program to determine the achievement of competencies. It is administered by the trainer/assessor at end of each learning module."
