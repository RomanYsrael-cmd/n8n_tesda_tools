    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Provided support to team members to ensure goals are met 1.2 Acted on feedback from clients and colleagues 1.3 Accessed learning opportunities to extend own personal work competencies to enhance team goals and outcomes 2. Underpinning Knowledge 2.1 The relevant legislation that affects operations, especially with regards to safety 2.2 Reasons why cooperation and good relationships are important 2.3 Knowledge of the organization’s policies, plans and procedures 2.4 Understanding how to elicit and interpret feedback 2.5 Knowledge of workgroup member’s responsibilities and duties 2.6 Importance of demonstrating respect and empathy in dealings with colleagues 2.7 Understanding of how to identify and prioritize personal development opportunities and options 3. Underpinning Skills 3.1 Ability to read and understand the organization’s policies and work procedures 3.2 Write simple instructions for particular routine tasks 3.3 Interpret information gained from correspondence 3.4 Communication skills to request advice, receive feedback and work with a team 3.5 Planning skills to organized work priorities and arrangement 3.6 Technology skills including the ability to select and use technology appropriate to a task 3.7 Ability to relate to people from a range of social, cultural and ethnic backgrounds."
