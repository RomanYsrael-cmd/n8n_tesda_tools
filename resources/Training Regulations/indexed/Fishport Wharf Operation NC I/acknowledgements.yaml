ines\n2.3.3 BFAR, PFDA regulations\n2.4 Systems, Processes and Procedures\n2.4.1 Classifying procedures\n2.4.2 Knowledge of fish kinds/species\n2.4.3 Ability to classify by estimating weight and\nsize\n2.4.4 Methods of securing fish loads\n2.4.5 Housekeeping standards procedures\nrequired in the workplace\n2.5 Tools and Equipment: Uses and Specifications\n2.5.1 Conveyor\n2.5.2 Cartwheel\n2.5.3 Weighing scale\n\n--- PDF PAGE 38 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n36\n2.6 Maintenance\n2.6.1 Regular washing and check up of tools\nand equipment\n2.7 Values\n2.7.1 Safety consciousness in classifying fish\nand fish products\n2.7.2 Industriousness\n2.7.3 Trustworthiness\n2.7.4 TLC in handling fish\n2.7.5 Efficiency in classifying and weighing\n3. Underpinning Skills\n3.1 Work safety\n3.2 Skills in using tools and equipment\n3.3 Working with others and in teams\n3.4 Communicate information\n4. Resource Implication\nThe following resources MUST be provided:\n4.1 Fish port (government or private) and access to\nworkplace policies\n4.2 Materials, tools and equipment relevant to the\nproposed activity and tasks\n5. Methods of Assessment\nCompetency in this unit must be assessed through:\n5.1 Observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio\n6. Context of Assessment\n 6.1 Competency may be assessed individually in the\ngovernment fish ports or in agreement with\naccredited private ports.\n\n--- PDF PAGE 39 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n37\n\nSECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements\nto\nconsider\nwhen\ndesigning\ntraining\nprograms\nfor\nFISHPORT/WHARF OPERATIONS NC I.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FISHPORT/WHARF OPERATIONS Level: NC I\n\nNormal Training Duration: 18 Hours (Basic)\n\n14 Hours (Common)\n\n64 Hours (Core)\n 96 Total Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and\nattitudes of FISHPORT/WHARF OPERATIONS NC I (Fish Handler) in\naccordance with industry standards. It covers Basic, Common and Core\nCompetencies such as:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary speaking &\nmessages in a workplace.\n1.2 Follow routinary speaking &\nmessage\n1.3 Perform work duties following\nwritten notices.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work with\nothers\n2.1 Develop effective workplace\nrelationship.\n2.2 Contribute to work group\nactivities.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstrati\non\n•\nObservation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of work\n3.2 Apply work values/ethics\n3.3 Deal with ethical problems\n3.4 Maintain integrity of conduct\nin the workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstrati\non\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 40 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n38\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove unnecessary\nitems\n4.2 Arrange items\n4.3 Maintain work areas, tools\nand equipment\n4.4 Follow standardize work\nprocess and procedures\n4.5 Perform work spontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstrati\non\n• Observation\n• Interviews/\nquestioning\n\nCOMMON COMPETENCIES FOR AGRI-FISHERY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures\n1.1 Determine areas of concern\nfor safety measures\n1.2 Apply appropriate safety\nmeasures\n1.3 Safekeep and maintain\nmaterials, tools and\nequipment.\n1.4 Dispose waste materials and\noutfit\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Visit/tour\n• Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n2. Use of\nfishport/wharf\ntools and\nequipment\n2.1 Prepare and use\nfishport/wharf tools\n2.2 Prepare and operate\nfishport/wharf equipment\n2.3 Observe safety precautions\nin handling fishport/wharf\ntools and equipment.\n2.4 Carry out routine\nmaintenance and storage of\ntools and equipment\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Visit/tour\n• Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n3. Perform\nestimation\nand basic\ncalculation\n3.1 Perform estimation activities\n3.2 Perform basic workplace\ncalculation\n3.3 Apply corrective measures\nas necessary\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Interaction\n• Practical\nexercise\n•Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n• Practical\nexercise\n\n--- PDF PAGE 41 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n39\n4. Apply food\nsafety and\nsanitation\n4.1 Wear personal protective\nequipment\n4.2 Observe personal hygiene\nand good grooming\n4.3 Implement food sanitation\npractices\n4.4 Render safety measures and\nfirst aid procedures\n4.5 Implement housekeeping\nactivities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced learning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Unload and\nload fish and\nfish products\n\n1.1 Prepare for unloading and\nloading of fish and fish\nproducts\n1.2 Unload fish and fish products\n1.3 Loading and handling fish\nand fish products\n1.4 Implement housekeeping\nactivities\n\n• Demonstration\n• Discussion\n\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n2. Classify fish\nand fish\nproducts\n2.1 Prepare for fish classification\n2.2 Classify fish and fish products\n2.3 Weigh, segregate, pile and\nsecure fish loads\n2.4 Implement housekeeping\nactivities\n• Lecture/\nDiscussion\n• Demonstration\n• Direct\nobservation\n• Written test or\nexamination\n• Questioning\n• Demonstration\n/Simulation\n\n--- PDF PAGE 42 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n40\n\n3.1 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based on the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n41\n• Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.2 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements.\n\n• Able to read and write;\n• With good moral character;\n• Ability to communicate, both oral and written\n• Physically fit and mentally healthy as certified by a Public Health\nOfficer\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nFISHPORT/WHARF OPERATIONS NCI (Fish Handler)\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Fishport/Wharf Operations (Fish Handler).\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n5 pcs\nWooden mallet\n1 set\nConveyor\n25 pcs\nSoap\n25 pcs\nFish tray/tub\n5 units\nCartwheel\n5 liters\nChlorine\n25 pcs\nBrush\n5 units\nClassifying table\n25 pcs\nBucket or pail\n5 units\nWeighing scale\n25 pcs\nStainless hook\nor ganso\n1 unit\nFoot operated\ndrinking fountain\n\n1 pc\nPressurized or\nordinary hose\n25 sets\nPersonal\nProtective\nEquipment\n\n•Apron\n\n•Gloves\n\n• Rubber boots/\nWinter boots\n\n•Head gears\n\n•Winter jacket\n\n•Hard hat\n\n•Long pants\n\n•White shirts\n\n--- PDF PAGE 44 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n42\n\n3.5 TRAINING FACILITIES\n\nFISHPORT/WHARF OPERATIONS NC I\n\nBased on a class size of 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building (permanent)\n170.30\n• Student/Trainee\nWorking Space\n2.00 x 2.00 per\nstudent/trainee\n4.00 per student\n100.00\n• Learning Resource\nCenter\n3.00 x 5.00\n15.00\n15.00\n• Facilities/Equipment/\nCirculation Area\n\n39.30\n•Store Room\n4.00 x 4.00\n16.00\n16.00\nB. Fishport/Wharf *\n200.00 x 100.00\n20,000.00\n20,000.00\nTotal Area\n20,340.60\nNote: *Area will change according to availability of fishport/wharf for training,\nobservation and demonstration.\n\n3.6 TRAINER’S QUALIFICATIONS FOR AGRI-FISHERY SECTOR\n\nFISHPORT/WHARF OPERATIONS NC I\n\nTRAINER QUALIFICATION (TQ I)\n•\nMust be a holder of Fishport/Wharf Operations NC I or its equivalent\n•\nMust have undergone training on Training Methodology II (TM II)\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory\nCommission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by the learner who\nenrolled in a structured learning program to determine the achievement of\ncompetencies. It is administered by the trainer/assessor at end of each\nlearning module.\n\n--- PDF PAGE 45 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n43\n\nSECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo\nattain\nthe\nNational\nQualification\nof\nFISHPORT/WHARF\nOPERATIONS NC I, the candidate must demonstrate competence in\nall the units listed in Section 1. Successful candidates shall be awarded\na National Certificate signed by the TESDA Director General.\n\n4.2\nThe qualification of Fishport/Wharf Operations NC I may be attained\nthrough accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1. Unload and load fish and fish products\n4.2.2. Classify fish and fish products\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs)\n\n4.3\nAccumulation and submission of all COCs acquired for the relevant\nunits of competency comprising a qualification, an individual shall be\nissued the corresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n 4.5.1 Graduates of formal, non formal and informal including\nenterprise-based training programs.\n\n4.5.2. Experienced workers ( wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures manual on Assessment and Certification and\nGuidelines on the implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 46 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n45\n COMPETENCY MAP FOR AGRI-FISHERY SECTOR ANNEX A\n\nCORE UNITS OF COMPETENCY\nMaintain the temperature\nof seafood\n\nMaintain , prepare, deploy\nand retrieve purse seines to\nland catch\n\n Assemble and repair damaged\nnetting\n\nMaintain, prepare, deploy and\nretrieve hand operated lines to\nland catch\n\n Manage and control fishing\noperations\n\nImplement the food safety\nprogram and procedures\n\n Shift a load using manually\noperated equipment\n\nClean work area\n\nRecord information about the\ncountry\n\nConstruct nets and\ncustomize design\n\nUnload and load fish and\nfish products\n\nAdjust and position purse\nseines\n\n Maintain the temperature of\nseafood\n\nContribute to at sea processing\nof seafood\n\nLocate fishing grounds and\nstocks of fish\nClassify fish and fish\nproducts\n\n Assemble and load\nrefrigerated product\n\n Adjust & position drop lines and\nlong lines\n\n Maintain, prepare, deploy and\nretrieve mesh nets or gill nets to\nland catch\n\nMonitor the implementation\nof quality and food safety\nprograms\n\nOperate small vessel\n\n Implement the food safety\nprogram and procedures\n\nMaintain, prepare, deploy and\nretrieve drop lines and long lines\nto land catch\n\n Perform routine housekeeping\nduties on board a vessel\n\n Implement quality systems\nand procedures\n\nApply basic first aid\n\n Maintain, prepare, deploy\nand retrieve pots and traps\nto land catch\n\nPerform breath hold diving\noperations\n\nAdjust and position purse\nseines\n\nKeep records for a municipal\nfishing business\n\n Adjust and position pots\nand traps\n\nWork with temperature\ncontrolled stock\n\nAdjust and position hand\noperated lines\n\nCook on board a vessel\n\nOperate machinery in\nadverse conditions\nApply deckhand skills\naboard a fishing vessel\n\nAdjust and position beach\nseines, mesh nets or grill\nnets\n\nConduct field operations\n\n Analyze and report on board\nobservation\n\nOperate refrigerated\nstorerooms\n\n--- PDF PAGE 47 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n46\nCOMMON UNITS OF COMPETENCY\n\nApply safety measures in\noperation\n\nUse tools and equipment\n\nPerform estimation and\ncalculation\n\nApply Food Safety and\nSanitation\n\nBASIC UNITS OF COMPETENCY\nReceive and Respond to\nWorkplace\nCommunication\n\nParticipate in Workplace\nCommunication\n\nLead Workplace Communication\n\nUtilize specialist communication\n\nDevelop Team and\nIndividual\nWork With Others\n\nWork in a Team\nEnvironment\n\nLead Small Team\n\nSolve Workplace Problems\nRelated to Work Activities\n\nApply Problem Solving\nTechniques in the Workplace\n\nDemonstrate work values\n\nPractice housekeeping\nprocedures\n\nPlan and Organize Work\n\nFISHPORT/WHARF OPERATIONS NC I\n\n--- PDF PAGE 48 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n47\n\nDEFINITION OF TERMS/ ABBREVIATIONS\n\nBFAR -\nBureau of Fisheries and Aquatic Resources\n\nCOC -\nCertificate of Competency\n\nDENR -\nDepartment of Environment and Natural Resources\n\nDOH -\nDepartment of Health\n\nDTS -\nDual Training System\n\nFishport -\nis a fixed platform where ships can tie-up and load or unload fish\nlandings\n\nFish landing- the part of the fish catch that is put ashore. Frequently, landings\nprovide the only record of total catch; i.e. the landings plus\ndiscards\n\nFootbath -\nA long shallow tub or depression in the concrete floor where\nworkers walk through a mild solution (usually including chlorine) to\npromote hygiene. Usually located along the entrance of the fishport\n\nHACCP -\nHazard Analysis and Critical Control Point\n\nNC\n-\nNational Certificate\n\nOHS -\nOccupational Health and Safety\n\nPPE -\nPersonal Protective Equipment\n\nPFDA -\nPhilippine Fishery Development Authority\n\nPTQCS-\nPhilippine TVET Qualification and Certification System\n\nRPL -\nRecognition of Prior Learning\n\nSOP -\nStandard Operating Procedure\n\nTLC\n-\nTender Loving Care\n\nTM\n-\nTraining Methodology\n\n--- PDF PAGE 49 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n48\nTQ\n-\nTrainer Qualification\n\nTVET -\nTechnical Vocational Education and Training\n\nUTPRAS-\nUnited TVET Program Registration and Accreditation System\n\nWharf -\nis a large area with a fixed platform where ships can tie-up and\nload or unload cargoes and passengers.\n\n--- PDF PAGE 50 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n49\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE PHILIPPINE CHAMBER OF AGRICULTURE AND FOODS, INC.\n\n• THE TECHNICAL AND EXPERT PANELS\n\nDR. RODOLFO P. ESTIGOY\nMR. ALEJANDRO T. ESCANO\nChief\nPresident\nBureau of Post Harvest Research and\nExtension\nCentral Luzon State University, Science\nCity of Muñoz, Nueva Ecija\nPhilippine Chamber of Agriculture and\nFood (PCAFI)\nMFI Bldg. Otigas Avenue Extension,\nPasig City\nMR. EDWIN ANDOT\nDR. ALMA M. DELA CRUZ\nPresident\nChamber of Agriculture, Fisheries and\nFood in Northern Mindanao\n2nd floor, United Way Bldg.\nCapitol Cmpd., Cagayan de Oro City\nProfessor\nCentral Luzon State University\nMuñoz, Nueva Ecija\n\nMR. ROLANDO T. LAMPARERO\nMR. MAX RONALD CABREROS\nOperation Head\nRD Fishing Industries, Inc.\nCalumpang, General Santos City\nOperation Manager\nSan Andres Fishing Industries, Inc.\nTambler, General Santos City\nMR. HENRY V. DELICANA\nMR. REYNALDO C. GASQUE\nMarketing Head\