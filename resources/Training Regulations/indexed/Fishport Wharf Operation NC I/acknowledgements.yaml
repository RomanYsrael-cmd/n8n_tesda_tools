      "source_text": "UNIT OF COMPETENCY: DEMONSTRATE WORK VALUES UNIT CODE 500311103"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitude in demonstrating proper work values."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Define the purpose of work"
    },
    {
      "source_text": "1.1 One’s unique sense of purpose for working and the why’s of work are identified, reflected on and clearly defined for one’s development as a person and as a member of society. 1.2 Personal mission is in harmony with company’s values 2. Apply work values/ethics 2.1 Work values/ethics/concepts are classified and reaffirmed in accordance with the transparent company ethical standards, policies and guidelines. 2.2 Work practices are undertaken in compliance with industry work ethical standards, organizational policy and guidelines 2.3 Personal behavior and relationships with co-workers and/or clients are conducted in accordance with ethical standards, policy and guidelines. 2.4 Company resources are used in accordance with transparent company ethical standard, policies and guidelines. 3. Deal with ethical problems 3.1 Company ethical standards, organizational policy and guidelines on the prevention and reporting of unethical conduct are accessed and applied in accordance with transparent company ethical standard, policies and guidelines. 3.2 Work incidents/situations are reported and/or resolved in accordance with company protocol/guidelines. 3.3 Resolution and/or referral of ethical problems identified are used as learning opportunities. 4. Maintain integrity of conduct in the workplace 4.1 Personal work practices and values are demonstrated consistently with acceptable ethical conduct and company’s core values. 4.2 Instructions to co-workers are provided based on ethical, lawful and reasonable directives. 4.3 Company values/practices are shared with co-workers using appropriate behavior and language."
