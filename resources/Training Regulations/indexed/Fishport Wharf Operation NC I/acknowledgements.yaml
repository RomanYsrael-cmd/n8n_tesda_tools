      "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1 To attain the National Qualification of FISHPORT/WHARF OPERATIONS NC I, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 The qualification of Fishport/Wharf Operations NC I may be attained through accumulation of Certificates of Competency (COCs) in the following areas:"
    },
    {
      "source_text": "4.2.1. Unload and load fish and fish products 4.2.2. Classify fish and fish products"
    },
    {
      "source_text": "Successful candidates shall be awarded Certificates of Competency (COCs)"
    },
    {
      "source_text": "4.3 Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate."
    },
    {
      "source_text": "4.4 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.5 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.5.1 Graduates of formal, non formal and informal including enterprise-based training programs."
    },
    {
      "source_text": "4.5.2. Experienced workers ( wage employed or self-employed)"
    },
    {
      "source_text": "4.6 The guidelines on assessment and certification are discussed in detail in the Procedures manual on Assessment and Certification and Guidelines on the implementation of the Philippine TVET Qualification and Certification System (PTQCS)."
    },
