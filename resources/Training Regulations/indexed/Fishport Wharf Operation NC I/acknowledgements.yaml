    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the skills and knowledge required to load and unload fish and fish products. It includes preparation for unloading and loading, performing unloading and loading activities, securing and protecting loads and implementing housekeeping activities."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Prepare for unloading and loading of fish and fish products 1.1 Tools, equipment and materials are prepared for fish unloading and loading in accordance with standard operating procedure 1.2 Personal protective equipment (PPE) are worn according to the job requirement 1.3 Personal hygiene and good grooming is practiced in line with health and safety requirements 2. Unload and load fish and fish products 1.1 Fish catch are unloaded in accordance with organization’s procedures 1.2 Unloading activities are conducted in a safe and efficient manner taking into account suitable locations, stowage, safe use of equipment and the balance of the remaining load 1.3 Load characteristics are identified and taken into account when determining appropriate loading and unloading procedures 1.4 Fish catch are packed/unpacked or placed in fish trays in accordance with safe and effective use of available space 1.5 Fish are loaded in accordance with the appropriate transport method, safe piling, weight loading and by fish classification 3. Secure and protect fish loads 2.1 The distribution of the load is checked to ensure that it is even, legal and within safe carrying capacity for transport 2.3 Load is secured using the correct load restraint and protection equipment for different loads and storage conditions 2.4 The load is protected in accordance with load safety requirements 4. Implement housekeeping activities 3.1 Equipment used, work area and surroundings are cleaned in accordance with health and safety regulations 3.2 PPE are cleaned and stored in accordance with standard operating procedures"
