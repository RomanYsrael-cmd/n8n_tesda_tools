        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency  \n \nAssessment requires evidence that the candidate: \n1.1 \nProvided support to team members to ensure goals are \nmet \n1.2 \nActed on feedback from clients and colleagues \n1.3 \nAccessed learning opportunities to extend own \npersonal work competencies to enhance team goals \nand outcomes \n2. Underpinning \nKnowledge \n2.1 \nThe relevant legislation that affects operations, \nespecially with regards to safety  \n2.2 \nReasons why cooperation and good relationships are \nimportant \n2.3 \nKnowledge of the organization’s policies, plans and \nprocedures \n2.4 \nUnderstanding how to elicit and interpret feedback \n2.5 \nKnowledge of workgroup member’s responsibilities and \nduties \n2.6 \nImportance of demonstrating respect and empathy in \ndealings with colleagues \n2.7 \nUnderstanding of how to identify and prioritize personal \ndevelopment opportunities and options \n3. Underpinning Skills \n3.1 \nAbility to read and understand the organization’s \npolicies and work procedures \n3.2 \nWrite simple instructions for particular routine tasks \n3.3 \nInterpret information gained from correspondence \n3.4 \nCommunication skills to request advice, receive \nfeedback and work with a team \n3.5 \nPlanning skills to organized work priorities and \narrangement \n3.6 \nTechnology skills including the ability to select and use \ntechnology appropriate to a task \n3.7 \nAbility to relate to people from a range of social, cultural \nand ethnic backgrounds.\n\n--- PDF PAGE 10 ---\n____________________________________________________________________________________________        \nTR- Fishport / Wharf Operations  NC I \n  \n \n8\n \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n4.2 Materials relevant to the proposed activity or task \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Direct observations of work activities of the individual \nmember in relation to the work activities of the group \n5.2 Observation of simulation and/or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3 Case studies and scenarios as a basis for discussion \nof issues and strategies \n6. Context of \nAssessment \n6.1 Competency assessment may occur in workplace or \nany appropriately simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in group",
