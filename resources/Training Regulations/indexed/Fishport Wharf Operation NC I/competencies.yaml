        "source_title": "UNLOAD AND LOAD FISH AND FISH PRODUCTS",
        "source_text": "--- PDF PAGE 31 ---\n____________________________________________________________________________________________        \nTR- Fishport / Wharf Operations  NC I \n  \n \n29\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : UNLOAD AND LOAD FISH AND FISH PRODUCTS \n \nUNIT CODE \n \n: AGR921301 \n \nUNIT DESCRIPTOR          :  This unit covers the skills and knowledge required to \nload and unload fish and fish products.  It includes \npreparation for unloading and loading, performing \nunloading and loading activities, securing and protecting \nloads and implementing housekeeping activities. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Prepare for unloading \nand loading of fish \nand fish products \n1.1  Tools, equipment and materials are prepared for \nfish unloading and loading in accordance with \nstandard operating procedure \n1.2  Personal protective equipment (PPE) are worn \naccording to the job requirement \n1.3  Personal hygiene and good grooming is \npracticed in line with health and safety \nrequirements\n2. Unload and load fish \nand fish products \n1.1 Fish catch are unloaded in accordance with \norganization’s procedures \n1.2  Unloading activities are conducted in a safe and \nefficient manner taking into account suitable \nlocations, stowage, safe use of equipment and the \nbalance of the remaining load \n1.3  Load characteristics are identified and taken into \naccount when determining appropriate loading and \nunloading procedures \n1.4  Fish catch are packed/unpacked or placed in fish \ntrays in accordance with safe and effective use of \navailable space \n1.5 Fish are loaded  in accordance with the \nappropriate transport method, safe piling, weight \nloading and by fish classification\n3. Secure and protect \nfish loads \n2.1 The distribution of the load is checked to ensure \nthat it is even, legal and within safe carrying  \ncapacity for transport \n2.3 Load is secured using the correct load restraint \nand protection equipment for different loads and \nstorage conditions \n2.4 The load is protected in accordance with load \nsafety requirements\n4.    Implement \nhousekeeping \nactivities \n3.1  Equipment used, work area and surroundings are \ncleaned in accordance with health and safety \nregulations \n3.2  PPE are cleaned and stored in accordance with \nstandard operating procedures\n\n--- PDF PAGE 32 ---\n____________________________________________________________________________________________        \nTR- Fishport / Wharf Operations  NC I \n  \n \n30\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Equipment, tools and \nmaterials \n1.1 Conveyor \n1.2 Cartwheel \n1.3 Fish tray \n1.4 Stainless hook or “ganso” \n1.5 Wooden mallet \n1.6 Classifying table \n1.7 Weighing scale \n1.8 Pressurized hose \n1.9 Wooden pallet  \n1.10 Brush and other cleaning implements \n1.10 Handwash area \n1.11 Footbath \n1.12 Chlorine \n1.13 Foot operated drinking fountain \n2. Personal protective \nequipment (PPE) \nPersonal Protective Equipment may include but not \nlimited to: \n2.1 Apron \n2.2 Gloves/winter gloves \n2.3 Rubber boots/winter boots \n2.4 Head gears such as hair net, cap, bonnet, ski \nmask \n2.5 Winter jacket \n2.6 Hard hat \n2.7 Long pants \n2.8 White shirt \n3. Personal hygiene and \ngood grooming \n3.1 Wash hands with soap and water \n3.2 Dip boots in footbath with chlorinated water \n4. Load characteristics \n4.1 Size of fish \n4.2 Kind/Specie of fish \n4.3 Volume to be unloaded \n5. Buyers’ specifications \n5.1 Specie/variety/kind \n5.2 Size \n5.3 Volume \n5.4 No. of days stored/Fish quality\n\n--- PDF PAGE 33 ---\n____________________________________________________________________________________________        \nTR- Fishport / Wharf Operations  NC I \n  \n \n31\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidences that the candidate : \n1.1   prepared for unloading and loading of fish \n1.2   selected and used appropriate PPE \n1.3   observed personal hygiene and good grooming \n1.4   safely performed unloading and loading of fish  \n1.5   secured load for safe transport \n1.6   implemented housekeeping activities \n1.7   communicated and work effectively with others \n2. Underpinning \nKnowledge and \nAttitudes \n2.1  Communication \n2.1.1  Ability to read and comprehend simple \nstatements \n2.1.2  Ability to convey information in oral or sign \nlanguage when loading/unloading \n2.1.3  Ability to follow instructions from supervisor \n2.2  Safety Practices \n2.2.1   Occupational health and safety (OHS) \nprocedures and guidelines concerning \nloading and unloading of fish and fish \nproducts \n2.2.2   Risks when loading and unloading fish and \nfish products and related precautions to \ncontrol the risk \n2.2.3   Ability to identify and correctly use \nequipment required to load and unload fish \nand fish products \n2.3  Codes and Regulations \n2.3.1   Food safety regulations \n2.3.2   Department of Health – Code of Sanitation \nof the Philippines \n2.3.3   BFAR, PFDA regulations \n2.4  Systems, Processes and Procedures \n2.4.1   Loading/unloading procedures \n2.4.2   Ability to safely use manual handling \ntechniques and to operate manually-\noperated loading equipment \n2.4.3   Methods of securing a load \n2.4.5   Housekeeping standards procedures \nrequired in the workplace \n 2.5  Tools and Equipment: Uses and Specifications \n2.5.1  Conveyor \n2.5.2  Cartwheel\n\n--- PDF PAGE 34 ---\n____________________________________________________________________________________________        \nTR- Fishport / Wharf Operations  NC I \n  \n \n32\n2.5.3  Weighing scale \n2.6   Maintenance \n2.6.1  Regular washing and check up of tools and \nequipment \n2.7  Values \n2.7.1   Safety consciousness in unloading and \nloading of fish and fish products \n2.7.2   Industriousness \n2.7.3   Trustworthiness \n2.7.4   TLC in handling fish \n2.7.5   Efficiency in unloading and loading \n3. Underpinning Skills \n3.1    Work safety \n3.2    Skills in using tools and equipment \n3.3    Working with others and in teams \n3.4   Communicate information  \n4. Resource Implication \nThe following resources MUST be provided: \n4.1 Fish port (government or private) and access to \nworkplace policies  \n4.2 Materials, tools and equipment relevant to the \nproposed activity and tasks \n5 Methods of Assessment \nCompetency in this unit must be assessed through: \n5.1   Observation with oral questioning \n5.2   Demonstration with oral questioning \n5.3   Portfolio \n6. Context of Assessment \n6.1    Competency may be assessed individually in the \ngovernment fishports or in agreement with \naccredited private ports.\n",
