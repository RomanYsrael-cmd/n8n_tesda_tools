es\n1.3 Appropriate tools and equipment are safely used\naccording to job requirements and manufacturers\nconditions\n2.\nSelect and operate\nfishport/wharf equipment\n2.1 Identify appropriate fishport/wharf equipment\n2.2 Instructional manual of the fishport/wharf tools\nand equipment are carefully read prior to\noperation\n2.3 Pre-operation check-up is conducted in line with\nmanufacturers manual\n2.4 Faults in fishport/wharf equipment are identified\nand reported in line with fishport/wharf\nprocedures\n2.5 Fishport/Wharf equipment used according to its\nfunction\n2.6 Followed safety procedures according to SOP\n3.\nPerform preventive\nmaintenance\n3.1 Tools and equipment are cleaned immediately\nafter use in line with fishport/wharf procedures\n3.2 Routine check-up and maintenance are\nperformed according to organization’s procedure\n3.3 Tools and equipment are stored in designated\nareas in line with fishport/wharf procedures\n\n--- PDF PAGE 23 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n21\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Fishport/Wharf\nequipment\n\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Fishport/Wharf tools\n2.1 Cutters\n2.2 Weighing scales\n2.3 Hand tools\n2.4 Measuring tools\n3. Pre-operation check-up\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\n--- PDF PAGE 24 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n22\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate fishport/wharf tools and\nequipment\n1.2 Operated fishport/wharf equipments according to manual\nspecification\n1.3 Performed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1 Ideal good work habits to demonstrate to workers\neasy and safety standards during operation of\nfishport/wharf equipment\n2.2\nCodes and Regulations\n2.2.1 Environmental Compliance Certificate (ECC)\n2.2.2 Effective work supervision in the operation of\nfishport/wharf equipment\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n2.4 Maintenance\n2.4.1 Regular upkeep of equipments\n2.4.2 Preventive maintenance skills\n2.5\nValues\n2.5.1 Positive outlook towards work\n2.5.2 Possesses pre-emptive/anticipatory skills\n3.\nUnderpinning\nSkills\n3.1\nAbility to recognize defective fishport/wharf equipment\n3.2\nPerform proper management practices of safety\nmeasures\n4.\nMethod of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1 Direct observation\n4.2 Practical demonstration\n4.3 Third Party Report\n5.\nResource\nImplications\n5.1\nService/operational manual of fishport/wharf tools and\nequipment\n5.2 Tools and equipment\n5.3 Fishport/Wharf implements\n6.\nContext of\nAssessment\n6.1\nAssessment may occur in the workplace or in a\nsimulated workplace or as part of a team under limited\nsupervision\n\n--- PDF PAGE 25 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n23\n\nUNIT TITLE:\nPERFORM ESTIMATION AND BASIC\nCALCULATION\n\nUNIT CODE:\n\nAGR321203\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform basic workplace calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform estimation\n1.1 Job requirements are identified from written or\noral communications\n1.2 Quantities of materials and resources required to\ncomplete a work task are estimated based on job\nrequirements\n1.3 The time needed to complete a work activity is\nestimated according to requirements\n1.4 Accurate estimate for work