ls are disposed according to\nmanufacturers, government and fishport/wharf\nrequirements\n\n--- PDF PAGE 19 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n17\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the following\nsectors:\n1.1 Aquaculture\n1.2 Agri-marketing\n1.3 Fishport/Wharf Operations\n2. Place\n2.1 Fish ponds, cages\n2.2 Stock room/storage areas/warehouse\n2.3 Fishport/Wharf\n3. Time\n3.1 Medication period\n3.2 Feed mixing and feeding\n3.3 Harvesting and hauling\n4. Tools, materials and outfits\n4.1 Tools\n4.1.1\nWrenches\n4.1.2\nScrew driver\n4.1.3\nPliers\n4.2 Materials\n4.2.1\nBottles\n4.2.2\nPlastic\n4.2.3\nBags\n4.2.4\nSyringe\n4.3 Outfit\n4.3.1\nMasks\n4.3.2\nGloves\n4.3.3\nBoots\n4.3.4\nOverall coats\n4.3.5\nHat\n4.3.6\nEye goggles\n\n--- PDF PAGE 20 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n18\n\nVARIABLE\nRANGE\n5. Emergency procedures\n5.1 Location of first aid kit\n5.2 Evacuation\n5.3 Agencies contract\n5.4 Fishport/Wharf emergency procedures\n6. Waste materials\n6.1 Animal manure\n6.2 Waste water\n6.3 Syringes\n6.4 Unused fishport/wharf chemicals e.g. pesticides,\nchemicals, fertilizers\n6.5 Expired reagents\n6.6 Dead fish/fish by-products\n7. Hazards\n7.1 Chemical\n7.2 Electrical\n7.3 Falls\n\n--- PDF PAGE 21 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n19\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Safekeep/cleaned tools, materials 