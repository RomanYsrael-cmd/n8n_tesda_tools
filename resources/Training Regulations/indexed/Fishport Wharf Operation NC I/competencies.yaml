        "source_text": "AGR321201\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes\nrequired to perform safety measures effectively and\nefficiently. It includes identifying areas, tools, materials,\ntime and place in performing safety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine areas of\nconcern for safety\nmeasures\n1.1 Work tasks are identified in line with fishport/wharf\noperation\n1.2 Place for safety measures are determined in line\nwith fishport/wharf operation\n1.3 Time for safety measures are determined in line\nwith fishport/wharf operation\n1.4 Appropriate tools, materials and outfits are\nprepared in line with job requirements\n2. Apply appropriate safety\nmeasures\n2.1 Tools and materials are used according to\nspecifications and procedures\n2.2 Outfits are worn according to fishport/wharf\nrequirements\n2.3 Effectivity/shelf life/expiration of materials are\nstrictly observed\n2.4 Emergency procedures are known and followed\nto ensure a safework requirement\n2.5 Hazards in the workplace are identified and\nreported in line with fishport/wharf guidelines\n3. Safekeep/dispose tools,\nmaterials and outfit\n3.1 Used tools and outfit are cleaned after use and\nstored in designated areas\n3.2 Unused materials are properly labeled and stored\naccording to manufacturers recommendation and\nfishport/wharf requirements\n3.3 Waste materials are disposed according to\nmanufacturers, government and fishport/wharf\nrequirements\n\n--- PDF PAGE 19 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n17\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the following\nsectors:\n1.1 Aquaculture\n1.2 Agri-marketing\n1.3 Fishport/Wharf Operations\n2. Place\n2.1 Fish ponds, cages\n2.2 Stock room/storage areas/warehouse\n2.3 Fishport/Wharf\n3. Time\n3.1 