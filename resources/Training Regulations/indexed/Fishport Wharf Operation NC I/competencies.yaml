        "source_title": "RECEIVE AND RESPOND TO WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\n____________________________________________________________________________________________        \nTR- Fishport / Wharf Operations  NC I \n  \n \n2\n \n \nSECTION 2  \n \nCOMPETENCY STANDARDS \n \nThese guidelines are set to provide the Technical Vocational Education \nand Training (TVET) providers with information and other important requirements \nto consider when designing training programs for FISHPORT/WHARF \nOPERATIONS NC I. These units of competency are categorized into basic, \ncommon and core competencies. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY:    RECEIVE AND RESPOND TO WORKPLACE     \nCOMMUNICATION \nUNIT CODE                    :    500311101 \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes \nrequired to receive, respond and act on verbal and \nwritten communication. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated in the  Range of Variables \n1. Follow routine spoken \nmessages \n1.1 Required information is gathered by listening \nattentively and correctly interpreting or \nunderstanding  information/instructions \n1.2 Instructions/information are properly recorded in \naccordance with standard procedures \n1.3 Instructions are acted upon immediately  in \naccordance with information received  \n1.4 Clarification is sought from workplace supervisor on \nall occasions when any instruction/information is not \nclear  \n2. Perform workplace \nduties following written \nnotices \n2.1  Written notices and instructions are read and   \ninterpreted correctly in accordance with \norganizational guidelines \n2.2   Routine written instruction are followed in sequence \n2.3  Feedback is given to workplace supervisor based on \nthe instructions/information received\n\n--- PDF PAGE 5 ---\n____________________________________________________________________________________________        \nTR- Fishport / Wharf Operations  NC I \n  \n \n3\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Written notices and \ninstructions \nIt refers to : \n1.1 Handwritten and printed material \n1.2 Internal memos \n1.3 External communications \n1.4 Electronic mail \n1.5 Briefing notes \n1.6 General correspondence \n1.7 Marketing materials \n1.8 Journal articles \n2. Organizational guidelines It may include: \n2.1 Information documentation procedures \n2.2 Company  policies and  procedures \n2.3 Organization manuals \n2.4 Service manual\n\n--- PDF PAGE 6 ---\n____________________________________________________________________________________________        \nTR- Fishport / Wharf Operations  NC I \n  \n \n4\n \n \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge of organizational procedures for \nhandling verbal  and written communications \n1.2 Received and acted on verbal messages and instructions \n1.3 Demonstrated competency in recording \ninstructions/information \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 Knowledge of organizational policies/guidelines in regard \nto processing internal/external information \n2.2 Ethical work practices in handling communications \n2.3 Communication process \n3. Underpinning \nSkills \n3.1 Conciseness in receiving and clarifying \nmessages/information/communication \n3.2 Accuracy in recording messages/information \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Pens \n4.2 Note pads \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Direct Observation \n5.2 Oral interview \n5.3 Written Evaluation \n5.4 Third Party Report \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
