.3.3 Cost consciousness\n2.3.4 Precision\n3. Underpinning\nSkills\n3.1\nAbility to perform basic calculation\n3.2\nCommunicate effectively\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nWritten examination\n5. Resource\nImplications\n5.1\nRelevant tools and equipment for basic calculation\n5.2\nRecommended data\n6. Context of\nAssessment\n6.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 28 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n26\n\nUNIT OF COMPETENCY: APPLY FOOD SAFETY AND SANITATION\n\nUNIT CODE\n : AGR741201\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to apply food safety and sanitation in the\nworkplace\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n11. Wear personal\nprotective equipment\n(PPE)\n1.1 Personal protective equipment are checked\naccording to manufacturer’s specifications\n1.2 Personal protective equipment are worn\naccording to the job requirement\n2. Observe personal\nhygiene and good\ngrooming\n2.1 Personal hygiene and good grooming is practiced in\nline with workplace health and safety\nrequirements\n3. Implement food\nsanitation practices\n3.1 Sanitary food handling practices are implemented\nin line with workplace sanitation regulations\n3.2 Safety measures are observed in line with\nworkplace safety practices.\n4. Render safety\nmeasures and first aid\nprocedures\n4.1 Safety measures are applied according to\nworkplace rules and regulations\n4.2 First aid procedures are applied and coordinated\nwith concerned personnel according to workplace\nstandard operating procedures.\n5. Implement\nhousekeeping activities\n5.1 Work area and surroundings are cleaned in\naccordance with workplace health and safety\nregulations\n5.2 Waste is disposed according to organization’s\nwaste disposal system\n5.3 Hazards in the work area are recognized and\nreported to designated personnel according to\nworkplace procedures\n\n--- PDF PAGE 29 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n27\n\nRANGE OF VARIABLES\n VARIABLES\n RANGE\n1. Manufacturer’s\nspecifications\nManufacturer’s specifications may include but not\nlimited to:\n1.1 Handling\n1.2 Operating\n1.3 Discharge Label\n1.4 Reporting\n1.5 Testing\n1.6 Positioning\n1.7 Refilling\n2. Personal protective\nequipment\nPersonal Protective Equipment may include but not\nlimited to:\n2.1 Apron/laboratory gown\n2.2 Mouth masks\n2.3 Gloves\n2.4 Rubber boots/safety shoes\n2.5 Head gears such as caps, hair nets, earl plug\n3. Workplace health and\nsafety requirements\nWorkplace and Safety Requirements may include:\n3.1 Health/Medical Certificate\n3.2 DOLE requirements\n3.3 BFAD requirements\n3.4 Personal Hygiene and good grooming\n3.5 Plant Sanitation and waste management\n4. Safety measures\nSafety measures may include but not limited to:\n4.1 Labeling of chemicals and other sanitizing agents\n4.2 Installation of fire fighting equipment in the work\narea\n4.3 Installation of safety signages and symbols\n4.4 Implementation of 5S in the work area\n4.5 Removal of combustible material in the work area\n5. First aid procedures\nFirst Aid Procedures may include but not limited to:\n5.1 Mouth to mouth resuscitation\n5.2 CPR\n5.3 Application of tourniquet\n5.4 Applying pressure to bleeding wounds or cuts\n5.5 First aid treatment for burned victims\n6. Hazards\nHazards in the workplace may include but not limited\nto:\n6.1 Physical\n6.2 Biological\n6.3 Chemical\n\n--- PDF PAGE 30 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n28\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned, checked and sanitized personal\nprotective equipment\n1.2 Practiced proper personal hygiene and good\ngrooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the\nwork area\n2. Underpinning\nKnowledge\n2.1 Safety Practices\n2.1.1\nProper waste disposal\n2.1.2\nEnvironmental protection and concerns\n2.1.3\nFood safety principles and practices\n2.1.4\nGood grooming and personal hygiene\n 2.2 Codes and Regulations\n2.2.1 TQM and other food quality system\nprinciples\n2.2.2 ISO, HACCP, EMS, 5S\n2.2.3 Good Food Manufacturing Practices\n 2.3 Equipment: Uses and Specifications\n2.3 1 Parts and functions of personal protective\nequipment\n2.3.2 First Aid Kit\n2.3.3 Sanitizing equipment\n3. Underpinning Skills\n3.1 Sanitary food handling practices\n3.2 Implementing housekeeping activities\n3.3 Applying first aid treatment\n3.4 Coordination skills\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 A combination of direct observation and\nquestioning of a candidate processing foods\n5. Resource Implications\n\nThe following resources must be provided:\n5.1 Work area/station\n5.2 First Aid kit\n5.3 PPE relevant to the activities\n5.4 Fire extinguisher\n5.5 Stretcher\n5.6 Materials, tools and equipment relevant to the unit\nof competency\n6. Context of Assessment\n6.1 Assessment should occur on the job or in a\nsimulated workplace\n\n--- PDF PAGE 31 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : UNLOAD AND LOAD FISH AND FISH PRODUCTS\n\nUNIT CODE\n\n: AGR921301\n\nUNIT DESCRIPTOR : This unit covers the skills and knowledge required to\nload and unload fish and fish products. It includes\npreparation for unloading and loading, performing\nunloading and loading activities, securing and protecting\nloads and implementing housekeeping activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for unloading\nand loading of fish\nand fish products\n1.1 Tools, equipment and materials are prepared for\nfish unloading and loading in accordance with\nstandard operating procedure\n1.2 Personal protective equipment (PPE) are worn\naccording to the job requirement\n1.3 Personal hygiene and good grooming is\npracticed in line with health and safety\nrequirements\n2. Unload and load fish\nand fish products\n1.1 Fish catch are unloaded in accordance with\norganization’s procedures\n1.2 Unloading activities are conducted in a safe and\nefficient manner taking into account suitable\nlocations, stowage, safe use of equipment and the\nbalance of the remaining load\n1.3 Load characteristics are identified and taken into\naccount when determining appropriate loading and\nunloading procedures\n1.4 Fish catch are packed/unpacked or placed in fish\ntrays in accordance with safe and effective use of\navailable space\n1.5 Fish are loaded in accordance with the\nappropriate transport method, safe piling, weight\nloading and by fish classification\n3. Secure and protect\nfish loads\n2.1 The distribution of the load is checked to ensure\nthat it is even, legal and within safe carrying\ncapacity for transport\n2.3 Load is secured using the correct load restraint\nand protection equipment for different loads and\nstorage conditions\n2.4 The load is protected in accordance with load\nsafety requirements\n4. Implement\nhousekeeping\nactivities\n3.1 Equipment used, work area and surroundings are\ncleaned in accordance with health and safety\nregulations\n3.2 PPE are cleaned and stored in accordance with\nstandard operating procedures\n\n--- PDF PAGE 32 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n30\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Equipment, tools and\nmaterials\n1.1 Conveyor\n1.2 Cartwheel\n1.3 Fish tray\n1.4 Stainless hook or “ganso”\n1.5 Wooden mallet\n1.6 Classifying table\n1.7 Weighing scale\n1.8 Pressurized hose\n1.9 Wooden pallet\n1.10 Brush and other cleaning implements\n1.10 Handwash area\n1.11 Footbath\n1.12 Chlorine\n1.13 Foot operated drinking fountain\n2. Personal protective\nequipment (PPE)\nPersonal Protective Equipment may include but not\nlimited to:\n2.1 Apron\n2.2 Gloves/winter gloves\n2.3 Rubber boots/winter boots\n2.4 Head gears such as hair net, cap, bonnet, ski\nmask\n2.5 Winter jacket\n2.6 Hard hat\n2.7 Long pants\n2.8 White shirt\n3. Personal hygiene and\ngood grooming\n3.1 Wash hands with soap and water\n3.2 Dip boots in footbath with chlorinated water\n4. Load characteristics\n4.1 Size of fish\n4.2 Kind/Specie of fish\n4.3 Volume to be unloaded\n5. Buyers’ specifications\n5.1 Specie/variety/kind\n5.2 Size\n5.3 Volume\n5.4 No. of days stored/Fish quality\n\n--- PDF PAGE 33 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n31\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1 prepared for unloading and loading of fish\n1.2 selected and used appropriate PPE\n1.3 observed personal hygiene and good grooming\n1.4 safely performed unloading and loading of fish\n1.5 secured load for safe transport\n1.6 implemented housekeeping activities\n1.7 communicated and work effectively with others\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Communication\n2.1.1 Ability to read and comprehend simple\nstatements\n2.1.2 Ability to convey information in oral or sign\nlanguage when loading/unloading\n2.1.3 Ability to follow instructions from supervisor\n2.2 Safety Practices\n2.2.1 Occupational health and safety (OHS)\nprocedures and guidelines concerning\nloading and unloading of fish and fish\nproducts\n2.2.2 Risks when loading and unloading fish and\nfish products and related precautions to\ncontrol the risk\n2.2.3 Ability to identify and correctly use\nequipment required to load and unload fish\nand fish products\n2.3 Codes and Regulations\n2.3.1 Food safety regulations\n2.3.2 Department of Health – Code of Sanitation\nof the Philippines\n2.3.3 BFAR, PFDA regulations\n2.4 Systems, Processes and Procedures\n2.4.1 Loading/unloading procedures\n2.4.2 Ability to safely use manual handling\ntechniques and to operate manually-\noperated loading equipment\n2.4.3 Methods of securing a load\n2.4.5 Housekeeping standards procedures\nrequired in the workplace\n 2.5 Tools and Equipment: Uses and Specifications\n2.5.1 Conveyor\n2.5.2 Cartwheel\n\n--- PDF PAGE 34 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n32\n2.5.3 Weighing scale\n2.6 Maintenance\n2.6.1 Regular washing and check up of tools and\nequipment\n2.7 Values\n2.7.1 Safety consciousness in unloading and\nloading of fish and fish products\n2.7.2 Industriousness\n2.7.3 Trustworthiness\n2.7.4 TLC in handling fish\n2.7.5 Efficiency in unloading and loading\n3. Underpinning Skills\n3.1 Work safety\n3.2 Skills in using tools and equipment\n3.3 Working with others and in teams\n3.4 Communicate information\n4. Resource Implication\nThe following resources MUST be provided:\n4.1 Fish port (government or private) and access to\nworkplace policies\n4.2 Materials, tools and equipment relevant to the\nproposed activity and tasks\n5 Methods of Assessment\nCompetency in this unit must be assessed through:\n5.1 Observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio\n6. Context of Assessment\n6.1 Competency may be assessed individually in the\ngovernment fishports or in agreement with\naccredited private ports.\n\n--- PDF PAGE 35 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n33\n\nUNIT OF COMPETENCY : CLASSIFY FISH AND FISH PRODUCTS\n\nUNIT CODE\n\n: AGR921302\n\nUNIT DESCRIPTOR : This unit covers the skills and knowledge required to\nclassify fish and fish products. It includes preparing and\nclassifying fish and fish products, weighing fish by\nclassification, segregating, piling and securing loads\nand implementing housekeeping activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for fish\nClassification\n1.1 Equipment, tools and materials are prepared for\nclassifying fish in accordance to standard\noperation practice\n1.2 The classifying table or conveyor is cleaned and\nprepared for fish classification in accordance with\norganization’s procedure\n1.3 Personal protective equipment (PPE) are worn\naccording to HACCP requirement\n1.4 Personal hygiene and good grooming is\npracticed in line with health and safety\nrequirements\n2. Classify fish and fish\nproducts\n2.1 Fish are classified in accordance with buyers’\nspecifications\n2.2 Damaged fish are removed and placed in\nseparate containers following standard operating\npractices\n2.3 Fish are packed in trays by classification following\nbuyers’ specifications\n3. Weigh fish by\nclassification\n3.1 Tray load is checked to ensure that it is even and\nwithin safe carrying capacity\n3.3 Fish are weighed by tray load and recorded\naccording to standard operating practice or\norganization’s procedure\n4. Segregate, pile and\nsecure fish loads\n4.1 Fish trays are segregated and piled by orders\nfollowing supervisor’s instructions\n4.2 Fish loads are secured and protected using\nappropriate storage conditions and workplace\nsafety requirements\n5. Implement\nhousekeeping\nactivities\n5.1 Equipment used, work area and surroundings are\ncleaned in accordance with health and safety\nregulations\n5.2 PPE are cleaned and stored in accordance with\nstandard operating procedures\n\n--- PDF PAGE 36 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n34\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Equipment, tools and\nmaterials\n1.1 Conveyor\n1.2 Cartwheel\n1.3 Fish tray\n1.4 Classifying table\n1.5 Stainless hook or “ganso”\n1.6 Weighing scale\n1.7 Pressurized or ordinary hose\n1.8 Bucket or pail\n1.9 Brush and other cleaning implements\n1.10 Chlorine\n1.11 Handwash area\n1.12 Foothbath\n1.13 Foot operated drinking fountain\n2. Personal protective\nequipment (PPE)\nPersonal Protective Equipment may include but not\nlimited to:\n2.1 Apron\n2.2 Gloves\n2.3 Rubber boots\n2.4 Head gears such as hair net or cap\n2.5 Long pants\n2.6 White shirt\n3. Personal hygiene and\ngood grooming\n3.1 Wash hands with soap and water\n3.2 Dip boots in footbath with chlorinated water\n4. Buyers’ specifications\n4.1 Specie/variety/kind\n4.2 Size\n4.3 Volume\n4.5 No. of days stored/quality of fish\n5. Damaged fish\n5.1 Smelly or off odor\n5.2 Open belly\n5.3 High histamine or “makati”\n5.4 Soft and distorted\n\n--- PDF PAGE 37 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n35\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1 prepared tools, materials and equipment for\nclassifying fish and fish products\n1.2 selected and used appropriate PPE\n1.3 observed personal hygiene and good grooming\n1.4 classified fish and fish products following\norganizational procedures\n1.5 secured load for safe transport\n1.6 implemented housekeeping activities\n1.7 communicated and work effectively with teams\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Communication\n2.1.1 Ability to read and comprehend simple\nstatements\n2.1.2 Ability to convey information when\nclassifying and weighing fish\n2.1.3 Ability to follow instructions from supervisor\n2.2 Safety Practices\n2.2.1 Occupational health and safety (OHS)\nprocedures and guidelines concerning\nclassifying and weighing fish and fish\nproducts\n2.2.3 Ability to use equipment required in\nclassifying and weighing fish and fish\nproducts\n2.3 Codes and Regulations\n2.3.1 Food safety regulations\n2.3.2 Department of Health – Code of Sanitation\nof the Philippines\n2.3.3 BFAR, PFDA regulations\n2.4 Systems, Processes and Procedures\n2.4.1 Classifying procedures\n2.4.2 Knowledge of fish kinds/species\n2.4.3 Ability to classify by estimating weight and\nsize\n2.4.4 Methods of securing fish loads\n2.4.5 Housekeeping standards procedures\nrequired in the workplace\n2.5 Tools and Equipment: Uses and Specifications\n2.5.1 Conveyor\n2.5.2 Cartwheel\n2.5.3 Weighing scale\n\n--- PDF PAGE 38 ---\n____________________________________________________________________________________________\nTR- Fishport / Wharf Operations NC I\n\n36\n2.6 Maintenance\n2.6.1 Regular washing and check up of tools\nand equipment\n2.7 Values\n2.7.1 Safety consciousness in classifying fish\nand fish products\n2.7.2 Industriousness\n2.7.3 Trustworthiness\n2.7.4 TLC in handling fish\n2.7.5 Efficiency in classifying and weighing\n3. Underpinning Skills\n3.1 Work safety\n3.2 Skills in using tools and equipment\n3.3 Working with others and in teams\n3.4 Communicate information\n4. Resource Implication\nThe following resources MUST be provided:\n4.1 Fish port (government or private) and access to\nworkplace policies\n4.2 Materials, tools and equipment relevant to the\nproposed activity and tasks\n5. Methods of Assessment\nCompetency in this unit must be assessed through:\n5.1 Observation with oral questioning\n5.2 Demonstration with oral questioning\n5.3 Portfolio\n6. Context of Assessment\n 6.1 Competency may be assessed individually in the\ngovernment fish ports or in agreement with\naccredited private ports.\n\n--- PDF PAGE 39 ---\n_________________________________