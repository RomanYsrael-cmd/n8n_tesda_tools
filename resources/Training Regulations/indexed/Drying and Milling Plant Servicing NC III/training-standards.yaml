group\nactivities\n•Lecture-Discussion\n• Demonstration\nwith oral\nquestioning\n2.4Set performance\nexpectation for team\nmembers\n• Inform subordinates on\nperformance criteria\nthat will be observed\n• Small group\nactivities\n•Lecture-Discussion\n• Demonstration\nwith oral\nquestioning\n2.5 Supervise team\nperformance\n• Establish facilitation\nskills\n• Small group\nactivities\n• Lecture-Discussion\n• Observation\n• Apply presentation skills\nas necessary\n• Individual/Small\ngroup activities\n• Lecture-Discussion\n• Demonstration\nwith oral\nquestioning\n• Translate ideas and\nconcepts into\nimplementable activities\nin pharmacy services\n• Small group\nactivities\n• Lecture-Discussion\n• Demonstration\nwith oral\nquestioning`\n\n--- PDF PAGE 80 ---\n77 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Develop and\npractice\nnegotiation skills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n• Obtain necessary\ninformation regarding\nthe issue\n• Small group\nactivities\n•Lecture-Discussion\n• Observation\n2 hrs\n3.2 Participate in\nnegotiations\n• Apply different\nquestioning techniques\n• Small group\nactivities\n• Lecture-Discussion\n• Observation\n• Use appropriate\nlanguage during\nnegotiation\n• Small group\nactivities\n• Lecture-Discussion\n• Demonstration\nwith oral\nquestioning\n\n• Address and implement\nproblem solving\nstrategies on dealing\nwith unexpected\nquestions and attitudes\nduring negotiation\n• Small group\nactivities\n• Lecture-Discussion\n• Demonstration\nwith oral\nquestioning\n3.3 Document areas for\nagreement\n• Document issues and\nprocesses\n• Lecture-discussion\n• Simulation/role\nplaying\n• Demonstration\nwith oral\nquestioning\n• Explore different\nsolutions that may be\nused\n• Direct observation\n• Simulation/role\nplaying\n• Demonstration\nwith oral\nquestioning\n• Writ