    "source_text": "3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core\nunits\nof\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology, communication/language and other academic subjects\nshall be contextualized. To this end, TVET providers shall develop a Contextual\nLearning Matrix (CLM) to green technology, issues on health and drugs and\ncater person with disabilities (PWD’s)\n\nCourse Title: DRYING AND MILLING PLANT SERVICING NC III\n\nNominal Training Duration:\n\n 16 hrs\nBasic Competencies\n 72 hrs\nCommon Competencies\n\n168 hrs\nCore Competencies\nTotal\n256 hrs\nCourse Description:\n\nThis course is designed to provide the students/learner with knowledge, desirable\nattitudes and skills required to perform the following competencies in accordance with\nindustry standards: service grains drying plant facilities, service rice milling plant\nfacility and service corn milling plant facility.\n\n--- PDF PAGE 77 ---\n\n--- PDF PAGE 78 ---\n75 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nBASIC COMPETENCIES\n16 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace processes\n• Display communications\nskills using verbal,\nwritten, wireless, non-\nverbal (standard signs\nand symbols of the\nindustry) media\n• Lecture-Discussion\n• Role play\n• Observation\n• Interview\nTotal:\n2 hrs\n• Read policies and\nprocedures in standard\noperating protocols\n• Lecture\n• Interview\n1.2 Lead workplace\ndiscussions\n\n• Demonstrate\ninterpersonal relations\nin discussing with\nsuperiors, colleagues,\nand/or subordinates\n• Lecture-Discussion\n• Small group\nactivities\n• Observation\n• Demonstrate people\nmanagement skills\n• Lecture-Discussion\n• Small group\nactivities\n• Observation\n• Facilitate discussion\namong colleagues\n• Lecture-Discussion\n• Small group\nactivities\n• Observation\n1.3 Identify and\ncommunicate issues\narising in the workplace\n• Apply safety procedures\nin handling equipment\nand machinery, waste,\nenvironment, volatile\nfluids and gases.\n• Lecture-Discussion\n• Demonstration\n• Oral/Written\nTest\n• Observation\n• Apply health and\nhygiene practices\n• Lecture-Discussion\n• Demonstration\n• Oral/Written\nTest\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 79 ---\n76 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Lead small\nteams\n2.1Lead small teams\n• Learn concepts on\npeople management\n• Lecture-Discussion\n• Small group\nactivities’\n•Brainstorming\n• Observation\n2 hrs\n• Apply oral and written\ncommunication skills in\ndealing with other team\nmembers\n• Lecture-Discussion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n2.2Provide team leadership\n• Conduct team building\nactivities as necessary\n• Lecture-Discussion\n• Small group\nactivities\n• Observation\n2.3 Assign responsibilities\namong members\n• Delegate tasks to other\nmembers of the team\n• Small group\nactivities\n•Lecture-Discussion\n• Observation\n• Relay instructional\nstrategies and\nmethodologies\n• Small group\nactivities\n•Lecture-Discussion\n• Demonstration\nwith oral\nquestioning\n2.4Set performance\nexpectation for team\nmembers\n• Inform subordinates on\nperformance criteria\nthat will be observed\n• Small group\nactivities\n•Lecture-Discussion\n• Demonstration\nwith oral\nquestioning\n2.5 Supervise team\nperformance\n• Establish facilitation\nskills\n• Small group\nactivities\n• Lecture-Discussion\n• Observation\n• Apply presentation skills\n