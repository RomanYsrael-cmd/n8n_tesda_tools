      "source_text": "3.2\n TRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall be guided by\nthe principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace and/or\nthrough adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary source\nof evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\nThe competency-based TVET system recognizes various types of delivery modes, both on-\nand off-the-job as long as the learning is driven by the competency standards specified by the\nindustry. The following training modalities and their variations/components may be adopted singly\nor in combination with other modalities when designing and delivering training programs:\n\nSchool/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain both in-\nschool and in-industry training or fieldwork components.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual experience\nin the workplace to acquire specific competencies as prescribed in the training\nregulations. It is imperative that the deployment of trainees in the workplace is adhered\nto training programs agreed by the institution and enterprise and status and progress of\ntrainees are closely monitored by the training institutions to prevent opportunity for work\nexploitation.\n\n--- PDF PAGE 99 ---\nTR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\n 100\nEnterprise-Based:\n\nEnterprise-based training may also be taken to mean a school or training center with one\nor more partner enterprise or an enterprise or group of enterprises setting up a common training\nfacility or partnering with a school or training center.\n\n• Enterprise-based Training - where training is implemented within the company in\naccordance with the requirements of the specific company.\n\n• Apprenticeship – Training within employment involving a contract between an apprentice\nand an enterprise on an approved apprenticeable occupation."
