  "source_text": "SECTION 1 QUALIFICATION DESCRIPTION\n\nThe DRYING AND MILLING PLANT SERVICING NC III Qualification consists of\ncompetencies that a Drying and Milling Plant Service Technician must have in order to\nservice grains drying plant facilities, service rice milling plant facility and service corn milling\nplant facility.\n\nIt also includes competencies of a person to use a wide range of tools and instrument\nand take responsibility for the reliability of servicing to ensure conformance with\nspecifications. He can perform any work within a quality improvement system in a drying and\nmilling plant environment.\n\nThis Qualification is packaged from the competency map of the Agriculture, Forestry\nand Fishery Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nA person who has achieved this Qualification is competent to be:\n\n Drying and Milling Plant Service Technician\n\nUNIT CODE\nBASIC COMPETENCIES\n500311109\nLead workplace communication\n500311110\nLead small teams\n500311111\nDevelop and practice negotiation skills\n500311112\nSolve problems related to work activities\n500311113\nUse mathematical concepts and techniques\n500311114\nUse relevant technologies\n\nUNIT CODE\nCOMMON COMPETENCIES\nAGR321201\nApply safety measures in farm operations\nAGR321202 Use farm tools and equipment\nAGR741203\nPerform estimation and calculations\n\nUNIT CODE\nCORE COMPETENCIES\nAFF723301\nService grains drying plant facilities\nAFF723302\nService rice milling plant facility\nAFF723303\nService corn milling plant facility\n\n--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08\n\n2 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017"
