  "source_text": "DEFINITION OF TERMS\n\nBlower – a mechanical device that conveys air producing a stream of moving mass of drying air.\n\nDryer Machinery – machinery device powered either by electric motor or internal combustion\nengine used to lower down or remove available water from the grains through\nevaporation by the application of heated air.\n\nEngine – mechanical device that converts heat energy produced by combustion of fuel into\nmechanical energy.\n\nRice Mill Machinery – machinery device to process conversion of paddy into rice which involves\nthe removal of husk and bran to produce milled rice.\n\nBiomass Furnace – an ancillary equipment that produce heat by burning agricultural waste.\n\nCorn Mill Machine – a machinery device to process conversion of corn kernel into corn grits which\ninvolves the removal of cutaneous pericarp and germ and further reduce the\nsize to produce required grit size.\n\nGrain Elevator – an ancillary machinery equipment that conveys grains by moving a plurality of\nscoops or cups in a vertical motion.\n\nScrew Conveyor – an ancillary machinery equipment that conveys grains by rotating motion in a\nseries of plights forming an auger.\n\nDust Collection System – an ancillary machinery equipment composed of a centrifugal blower\nacting in suction whereby dust and light contaminants suspended\nnear the grains are removed and conveyed through a series of pipes\naway from the clean grain.\n\nGrain Cleaner – an ancillary machinery equipment that removes empty seed, chaffs and other\nimpurities other than the grain.\n\nDe-stoner – an ancillary machinery equipment that removes small stones, pebbles and similar\nmaterials other than grains in an oscillating motion.\n\nTemperature sensor – an ancillary equipment used in determining the temperature level of the\ndrying air in a mechanical dryer.\n\nCastables – are heat-resistant lining material made from refractory construction material suitable\nfor biomass furnace.\n\nFire Bricks – are heat-resisting material used as lining material for biomass furnace.\n\nAncillary equipment – are components that either conveys, clean, sort, classify grains. Such\nequipment is optional but in most cases, are present to produce higher\nquality output product.\n\nRefractory cement – is a binding element similar to cement but primarily used in high temperature\nmaterial such as biomass furnace.\n\nStandards refers to PNS: PAES 206 Specification for rice mill\n\n--- PDF PAGE 106 ---\n107 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017"
}
