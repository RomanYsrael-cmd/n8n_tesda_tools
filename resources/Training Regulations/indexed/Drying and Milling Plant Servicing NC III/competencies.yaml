ant legal\nrequirements\n2.3 How\nperformance\nexpectations are\nset\n2.4 Methods of\nMonitoring\nPerformance\n2.5 Team member’s\nduties and\nresponsibilities\n2.1 Communication\nskills required\nfor leading\nteams\n2.2 Team building\nskills\n2.3 Negotiating\nskills\n3. Set performance\nexpectations for\nteam members\n3.1 Performance expectations\nare established based on\nclient needs and\naccording to assignment\nrequirements\n3.2 Performance expectations\nare based on individual\nteam members duties and\narea of responsibility\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n3.1 Company\npolicies and\nprocedures\n3.2 Relevant legal\nrequirements\n3.3 How\nperformance\nexpectations are\nset\n3.4 Methods of\nMonitoring\nPerformance\n3.1 Communication\nskills required\nfor leading\nteams\n3.2 Informal\nperformance\ncounseling skills\n3.3 Team building\nskills\n3.4 Negotiating\nskills\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n\n6 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.5 Client\nexpectations\n3.6 Team member’s\nduties and\nresponsibilities\n4. Supervise\nteam\nperformance\n4.1 Monitoring of\nperformance takes place\nagainst defined\nperformance criteria\nand/or assignment\ninstructions and corrective\naction taken if required\n4.2 Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies\n4.3 Performance issues which\ncannot be rectified or\naddressed within the team\nare referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n4.7 All relevant\ndocumentation is\ncompleted in\naccordance with\ncompany procedures\n4.1 Company\npolicies and\nprocedures\n4.2 Relevant legal\nrequirements\n4.3 How\nperformance\nexpectations are\nset\n4.4 Methods of\nMonitoring\nPerformance\n4.5 Client\nexpectations\n4.6 Team member’s\nduties and\nresponsibilities\n4.1 Communication\nskills required\nfor leading\nteams\n4.2 Informal\nperformance\ncounseling\nskills\n4.3 Team building\nskills\n4.4 Negotiating\nskills\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n\n7 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n\n8 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team performance given\na variety of possible scenario\n1.2. Assessed and monitored team and individual performance against\nset criteria\n1.3. Represented concerns of a team and individual to next level of\nmanagement or appropriate specialist and to negotiate on their\nbehalf\n1.4. Allocated duties and responsibilities, having regard to individual’s\nknowledge, skills and aptitude and the needs of the tasks to be\nperformed\n1.5. Set and communicated performance expectations for a range of tasks\nand duties within the team and provided feedback to team members\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct observations of work activities of the individual member in\nrelation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues and\nstrategies in teamwork\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n\n9 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\nUNIT CODE\n:\n500311111\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome\nand participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nnegotiations\n1.1 Information on preparing\nfor negotiation is\nidentified and included in\nthe plan\n1.2 Information on creating\nnon-verbal environments\nfor positive negotiating is\nidentified and included in\nthe plan\n1.3 Information on active\nlistening is identified and\nincluded in the plan\n1.4 Information on different\nquestioning techniques\nis identified and included in\nthe plan\n1.5 Information is checked to\nensure it is correct and up-\nto- date\n1.1 Codes of\npractice and\nguidelines for\nthe organization\n1.2 Organizations\npolicy and\nprocedures for\nnegotiations\n1.3 Decision making\nand conflict\nresolution\nstrategies\nprocedures\n1.4 Flexibility\n1.1 Interpersonal\nskills to develop\nrapport with\nother parties\n1.2 Communication\nskills (verbal\nand listening)\n1.3 Observation\nskills\n1.4 Negotiation\nskills\n\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed upon\nby all parties\n2.2 Desired outcome of all\nparties are considered\n2.3 Appropriate language is\nused throughout the\nnegotiation\n2.4 A variety of questioning\ntechniques are used\n2.5 The issues and processes\nare documented and\nagreed upon by all parties\n2.6 Possible solutions are\ndiscussed and their\nviability assessed\n2.7 Areas for agreement are\nconfirmed and recorded\n2.8 Follow-up action is agreed\nupon by all parties\n2.1 Codes of\npractice and\nguidelines for\nthe organization\n2.2 Organizations\npolicy and\nprocedures for\nnegotiations\n2.3 Decision making\nand conflict\nresolution\nstrategies\nprocedures\n2.4 Problem solving\nstrategies on\nhow to deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n2.5 Flexibility\n2.6 Empathy\n2.1 Interpersonal\nskills to develop\nrapport with\nother parties\n2.2 Communication\nskills (verbal\nand listening)\n2.3 Observation\nskills\n2.4 Negotiation\nskills\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n\n10 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the negotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for resolving\nconflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\n\n11 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to achieve an\nagreed outcome\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Room with facilities necessary for the negotiation process\n2.2 Human resources (negotiators)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/demonstration and questioning\n3.2 Portfolio assessment\n3.3 Oral and written questioning\n3.4 Third party report\n4. Context for\nAssessment\n4.1 Competency to be assessed in real work environment or in a\nsimulated workplace setting.\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\n\n12 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nUNIT OF COMPETENCY\n:\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required to solve\nproblems in the workplace including the ap