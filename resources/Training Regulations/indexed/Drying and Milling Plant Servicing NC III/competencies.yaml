        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08 \n \n \n2         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details and contents of the units of competency required in DRYING \nAND MILLING PLANT SERVICING NC III. These units of competency are categorized into \nbasic, common and core competencies. \n \nBASIC COMPETENCY \n \nUNIT OF COMPETENCY \n: \nLEAD WORKPLACE COMMUNICATION \nUNIT CODE \n: \n500311109 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nlead in the dissemination and discussion of ideas, information \nand issues in the workplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout workplace \nprocesses \n1.1 Appropriate \ncommunication \nmethod  is \nselected  \n1.2 Multiple operations \ninvolving several \ntopics areas are \ncommunicated \naccordingly \n1.3 Questions are \nused to gain extra \ninformation \n1.4 Correct sources of \ninformation are \nidentified \n1.5 Information is \nselected and \norganized correctly \n1.6 Verbal and written \nreporting is \nundertaken when \nrequired \n1.7 Communication \nskills are \nmaintained in all \nsituations\n1.1 Organization \nrequirements \nfor written and \nelectronic \ncommunication \nmethods \n1.2 Effective verbal \ncommunication \nmethods \n1.1 Organize \ninformation \n1.2 Understand and \nconvey intended \nmeaning \n1.3 Participate in \nvariety of \nworkplace \ndiscussions \n1.4 Comply with \norganization  \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n2. Lead workplace \ndiscussions \n2.1 Response to \nworkplace issues \nare sought  \n2.2 Response to \nworkplace issues \n2.1 Organization \nrequirements \nfor written and \nelectronic \ncommunication \nmethods\n2.1 Organize \ninformation \n2.2 Understand and \nconvey intended \nmeaning\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \n \n \n3           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nare provided \nimmediately \n2.3 Constructive \ncontributions are \nmade to workplace \ndiscussions on \nsuch issues as \nproduction, quality \nand safety \n2.4 Goals/objectives \nand  \n        Action plan \nundertaken in the \nworkplace are \ncommunicated \n2.2 Effective verbal \ncommunication \nmethods \n2.3 Participate in \nvariety of \nworkplace \ndiscussions \n2.4 Comply with \norganization  \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n3. Identify and \ncommunicate \nissues arising in \nthe workplace \n3.1 Issues and \nproblems are \nidentified as they \narise \n3.2 Information \nregarding problems \nand issues are \norganized \ncoherently to \nensure clear and \neffective \ncommunication \n3.3 Dialogue is initiated \nwith appropriate \npersonnel \n3.4 Communication \nproblems and \nissues are raised \nas they arise\n3.1 Organization \nrequirements \nfor written and \nelectronic \ncommunication \nmethods \n3.2 Effective verbal \ncommunication \nmethods \n3.1 Organize \ninformation \n3.2 Understand and \nconvey intended \nmeaning \n3.3 Participate in \nvariety of \nworkplace   \ndiscussions \n3.4 Comply with \norganization  \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \n \n \n4         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face to face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n \n \nEVIDENCE GUIDE \n \n1. Critical \naspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Dealt with a range of communication/information at one time \n1.2   Made constructive contributions in workplace issues \n1.3   Sought workplace issues effectively \n1.4   Responded to workplace issues promptly \n1.5   Presented information clearly and effectively written form \n1.6   Used appropriate sources of information \n1.7   Asked appropriate questions \n1.8   Provided accurate information  \n \n2.   Resource \nImplications \nThe following resources should be provided: \n2.1. Variety of Information \n2.2. Communication tools \n2.3. Simulated workplace \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Competency in this unit must be assessed through \n3.2 Direct Observation \n3.3 Interview \n4. Context  for \nAssessment \n4.1. Competency may be assessed in the workplace or in simulated workplace \nenvironment\n",
