endations \n4.2.1 Relevant \nequipment and \noperational \nprocesses \n4.2.2 Enterprise \ngoals, targets \nand measures \n4.2.3 Enterprise \nquality, OHS \nand \nenvironmental \nrequirement \n4.2.4 Principles of \ndecision making \nstrategies and \ntechniques \n4.2.5 Enterprise \ninformation \nsystems and \ndata collation \n4.2.6 Industry codes \nand standards\n4.4 Evaluating the \nsolution \n4.5 Implementation \nof a developed \nplan to rectify \nthe problem\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \n \n \n16         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Analytical \ntechniques \n1.1. Brainstorming \n1.2. Intuitions/Logic \n1.3. Cause and effect diagrams \n1.4. Pareto analysis \n1.5. SWOT analysis \n1.6. Gant chart, Pert CPM and graphs \n1.7. Scattergrams \n2. Problem \n \n2.1. Non – routine process and quality problems \n2.2. Equipment selection, availability and failure \n2.3. Teamwork and work allocation problem \n2.4. Safety and emergency situations and incidents \n \n3. Action plans  \n \n3.1. Priority requirements \n3.2. Measurable objectives \n3.3. Resource requirements \n3.4. Timelines \n3.5. Co-ordination and feedback requirements \n3.6. Safety requirements \n3.7. Risk assessment \n3.8. Environmental requirements\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \n \n \n17           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nEVIDENCE GUIDE \n \n1. Critical \naspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Identified the problem \n1.2. Determined the fundamental causes of the problem \n1.3. Determined the correct / preventive action \n1.4. Provided recommendation to manager \nThese aspects may be best assessed using a range of scenarios / case \nstudies / what ifs as a stimulus with a walk through forming part of the \nresponse. These assessment activities should include a range of \nproblems, including new, unusual and improbable situations that may \nhave happened. \n2. Resource \nImplications \n2.1. Assessment will require access to an operating plant over an \nextended period of time, or a suitable method of gathering evidence \nof operating ability over a range of situations. A bank of scenarios / \ncase studies / what ifs will be required as well as bank of questions \nwhich will be used to probe the reason behind the observable \naction.  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Case studies on solving problems in the workplace \n3.2. Observation \nThe unit will be assessed in a holistic manner as is practical and may be \nintegrated with the assessment of other relevant units of competency. \nAssessment will occur over a range of situations, which will include \ndisruptions to normal, smooth operation. Simulation may be required to \nallow for timely assessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk through of \nthe relevant competency components.  \n4. Context for \nAssessment \n4.1. In all workplace, it may be appropriate to assess this unit concurrently \nwith relevant teamwork or operation units.\n",
