mulgated February 3, 2017 \n         \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work tasks \nWork task may be selected from any of the subsectors: \n1.1 Crop Production \n1.2 Post-harvest \n1.3 Agri-marketing \n1.4 Farm Equipment \n2. Place \n2.1 Stock room/storage areas/warehouse \n2.2 Field/farm/orchard \n3. Time \n3.1 Fertilizer and pesticides application \n3.2 Feed mixing and feeding \n3.3 Harvesting and hauling \n4. \nTools, materials and \noutfits \n4.1 Tools \n4.1.1 Wrenches \n4.1.2 Screw driver \n4.1.3 Pliers \n4.2 Outfit \n4.2.1 Masks \n4.2.2 Gloves \n4.2.3 Boots \n4.2.4 Overall coats \n4.2.5 Hat \n4.2.6 Eye goggles \n5. Emergency procedures \n5.1 Location of first aid kit \n5.2 Evacuation \n5.3 Agencies contract \n5.4 Farm emergency procedures \n6. Hazards \n6.1 Chemical \n6.2 Electrical \n6.3 Falls\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \n \n \n26         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nEVIDENCE GUIDE \n \n1. Critical Aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Determined areas of concern for safety measures \n1.2 Applied appropriate safety measures according to industry \nrequirements \n1.3  Prepared tools, materials and outfit needed \n1.4  Performed proper disposal of used materials \n1.5  Cleaned and stored tools, materials and outfit in \ndesignated facilities  \n2.    Resource \nImplications \n \nThe following resources should be provided: \n2.1 Farm location \n2.2 Tools, equipment and outfits appropriate in applying safety \nmeasures \n3.    Method of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 Practical demonstration  \n3.2  Third Party Report \n4.    Context of \nAssessment \n4.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
