          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in\ndesignated facilities\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Farm location\n2.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Practical demonstration\n3.2 Third Party Report\n4. Context of\nAssessment\n4.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n\n27 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nUNIT OF COMPETENCY : USE FARM TOOLS AND EQUIPMENT\nUNIT CODE\n:"
