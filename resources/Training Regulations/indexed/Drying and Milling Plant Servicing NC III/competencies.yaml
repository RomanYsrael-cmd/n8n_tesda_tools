        "source_text": "--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08 \n \n \n12         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nUNIT OF COMPETENCY \n: \nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES  \nUNIT CODE \n:    500311112 \nUNIT DESCRIPTOR \n: \nThis unit of covers the knowledge, skills and attitudes required to solve \nproblems in the workplace including the application of problem solving \ntechniques and to determine and resolve the root cause of problems. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify the \nproblem \n1.1 Variances are identified \nfrom normal operating \nparameters; and product \nquality \n1.2 Extent, cause and nature \nare of the problem are \ndefined through \nobservation, \ninvestigation and \nanalytical techniques \n1.3 Problems are clearly \nstated and specified \n1.1 Competence \nincludes a \nthorough \nknowledge and \nunderstanding of \nthe process, \nnormal operating \nparameters, and \nproduct quality to \nrecognize non-\nstandard \nsituations \n1.2 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the \nidentification of \nfundamental \ncause, \ndetermining the \ncorrective action \nand provision of \nrecommendations \n1.2.1 Relevant \nequipment and \noperational \nprocesses \n1.2.2 Enterprise goals, \ntargets and \nmeasures \n1.2.3 Enterprise \nquality, OHS and \nenvironmental \nrequirement \n1.2.4 Enterprise \ninformation \nsystems and \ndata collation \n1.2.5 Industry codes \nand standards\n1.1 Using range of \nformal problem \nsolving \ntechniques \n1.2 Identifying and \nclarifying the \nnature of the \nproblem\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \n \n \n13           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Ra