ents are \nreported according to \nworkplace procedures \n2.1 Knowledge, Theory, \nPractices and Systems \nOperations \n2.1.1 Machine troubles \n- \nDifferent symptoms \nor common \nmachine troubles \n \n2.1.2 Diagnostic tests and \nmethods \n2.1.3 Type of dryer   \n- \nDrying components  \n- \nMachinery faults \nand malfunctions \n2.1.4 Communication \n- \nWritten \ncommunication \n- \nVerbal \ncommunication \n2.1.5 Mathematics and \nMensuration \n2.1.6 Four fundamental \noperations \n2.1.7 Safety \n- \nPPE \n2.18 Code \n- \nPAES \n- \nOSHS  \n2.2 Materials, Tools and \nEquipment: Uses, \nSpecifications and \nMaintenance \n2.2.1 Tools and Equipment \nMaterials \n2.2.2 Attitude \n2.2.3 Safety and health \nconsciousness \n2.2.4 Resourcefulness \n2.2.5 Diligence \n2.2.6 Time consciousness \nCost-consciousness  \n2.2.7 Personal integrity in \ndoing routine \nmanagement \npractices \n2.2.8 Perseverance in \nexecuting routine \nworks \n2.2.9 Ability to work with \nothers harmoniously \n \n2.1 Employing \napplicable \ndiagnostic tests \nand methods \n \n2.2 Analyzing \nsymptoms \n \n2.3 Using service \nmanuals and \nparts \n \n2.4 Developing \nservice \nchecklist \n \n2.5 Practicing \nsafety \nmeasures \n \n2.6 Reporting \nfindings of \ndiagnosis, \nincluding \nrecommendatio\nn for repairs and \nadjustments\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \n \n \n35           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Repair and \nmaintain grain \ndrying facility \nand equipment \n3.1 Personal Protective \nEquipment (PPEs) are \nworn as per work \nrequirement. \n3.2 Work area is secured \naccording to workplace \nprocedures.  \n3.3 Repair and \nreplacement process is \nimplemented \naccording to enterprise \nrequirements, \nmanufacturer's \nspecifications and \nOSHS. \n3.4 Clearing of \nobstructions from \nducting, chutes and \nconveyors are done in \naccordance with \nmanufacturer’s \nmanual. \n3.5 Safety measures are \napplied in accordance \nwith Occupational \nSafety and Health \nStandards (OSHS). \n3.6 Where necessary, \nservice unit is installed \nto minimize downtime \n3.1 Work area  \n3.2 Nomenclature of \nstandard parts  \n3.3 Repair and \nreplacement process \n-Basic fabrication of \ndefective components \n-Greasing of bearing \nfittings \n-Alignment of rotating \nshafts and transmission \ndrive \n3.4 Communication \n3.4.1 Verbal \ncommunication \n3.5 Mathematics and \nMensuration \n3.6 SAFETY \n- \nPPE \n3.7 CODE \n- \nOSHS \n3.1 Using PPE \n3.2 Securing work \narea \n3.3 Implementing \nrepair and \nreplacement \n3.4 Clearing of \nobstructions \nfrom ducting, \nchutes and \nconveyors  \n3.5 Practicing \nOSHS \n3.6 Installing \nservice units \n4. Test run grains \ndrying plant \nfacility \n4.1 Personal Protective \nEquipment (PPEs) are \nworn as per work \nrequirement. \n4.2 Ocular inspection of \nserviced components \nare done according to \napproved checklist. \n4.3 Test run of dryer \ncomponents is carried \nout according to \nworkplace procedures \nand service manual. \n4.4 Zeal of dryer are  \ninspected according to \napproved checklist \n4.5 Operating conditions \nare adjusted based on \nclient’s requirements \n4.1 Functional testing of \ncomponents \n4.2 Operator’s manual \n4.3 PAES \n4.4 OSHS \n4.5 Use of Tools \n4.6 Use of PPE \n4.7 Communication \n- Verbal \n- Hand signals \n \n \n4.1 Observing \nsafety in \nworkplace \n4.2 Observing \nquality standard \nin work checklist \n4.3 Performing test \nrun of dryer \n4.4 Inspecting zeal \nof dryers \n4.5 Familiarity in \noperator’s \nmanual \n4.6 Adjusting \noptimum \noperating \ncondition of \ndryer \ncomponent \n4.7 Interpreting/ \nwriting test run \nreport\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \n \n \n36         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand machine operating \nlimits. \n4.6 Safety measures are \napplied in accordance \nwith Occupational \nSafety and Health \nStandards (OSHS).\n5. Perform post-\nservicing \nactivities \n5.1 Personal Protective \nEquipment (PPEs) are \nworn as per work \nrequirement \n5.2 Machine is shutdown \naccording to operator’s \nmanual. \n5.3 Wastes are disposed \nof in accordance with \nenvironmental \nguidelines. \n5.4 Tools and equipment \nare checked and \nstored according to \nworkplace procedures. \n5.5 Work areas are \ncleaned and \nmaintained according \nto OSHS and \nenterprise \nrequirements. \n5.6 Safety measures are \napplied in accordance \nwith Occupational \nSafety and Health \nStandards (OSHS). \n5.7 Service documentation \nis completed and \nupdated according to \nworkplace procedures. \n5.1 Procedures of shutting \ndown machine \n5.2 Wastes management \n \n5.3 Environmental rules and \nregulations \n5.4 Inspection and storage \nof tools and equipment \n5.5 Maintenance of work \nareas \n5.6 OSHS \n5.7 Service documentation \n5.1 Practicing \nOSHS  \n5.2 Shutting down \nmachines \n \n5.3 Disposing \nwastes \n5.4 Checking and \nstoring tools \nand equipment \n5.5 Cleaning and \nmaintaining \nwork area  \n5.6 Completing \nservice \ndocumentation \n5.7 Accomplishing \nreport checklist \n \n \nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n1. Servicing \nrequirements \n1.1 Repair \n1.2 Replacement \n1.3 Preventive maintenance \n1.4 Installation\n2. Tools, manuals \nand test \ninstruments\nTools, manuals and test instruments may include but not limited to: \n1.1 \nOpen-end wrench \n1.2\nBox wrench\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \n \n \n37           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nVARIABLE \nRANGE \n1.3 \nLevel  \n1.4 \nTape 