        "source_text": "--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \n \n \n42         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nUNIT OF COMPETENCY : \n SERVICE RICE MILLING PLANT FACILITY \nUNIT CODE \n: \n AFF723302 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to service rice milling plant facility.  This also \nincludes proper use of tools and equipment, maintain \nand operate the rice mill. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Prepare tools, \nmanuals and \ntest \ninstruments \n1.1. Tools, manuals and \ntest instruments are \nselected in \naccordance with \nmanufacturer’s \nspecifications \n1.2. Safety measures \nare applied in \naccordance with \nOccupational \nSafety and Health \nStandards (OSHS) \n1.3.  Inspection and \nsegregation of \ndefective tools and \ntest instruments are \ndone according to \nworkplace \nprocedures. \n1.4. Adjustment of test \ninstruments is \ncarried-out \naccording to \nmanuals. \n \n1.1 Knowledge, Theory, \nPractices and \nSystems Operations \n1.2 Inspection and \nchecking procedures \nof various tools and \ninstruments. \n1.3 Use of instruments \n1.4 \nCommunication \n1.4.1 Methods of \naccomplishing forms \nand checklists  \n1.4.2 Procedures on \nreporting of defects, \nto immediate \nhead/supervisor \n1.4.3 Recording and \nreporting  \n1.5 \nSafety Practices \n1.5.1 Occupational Health \nand Safety \nStandards \n1.6 \nCodes and \nRegulations \n1.6.1 Good Agriculture \nPractice Standards \n1.6.2 Philippine \nAgricultural \nEngineering \nStandards \n1.7 \nMathematics and \nMensuration \n1.7.1 Four fundamental \noperations (addition, \nsubtraction, \nmultiplication and \ndivision)\n2.1 Demonstrating \nproper \nhandling of \ntools and \ninstruments \n2.2 Interpreting \nservice \nmanuals \n2.3 Selecting tool, \nmanuals and \ntest \ninstruments \n2.4 Applying \nOSHS \n2.5 Inspecting and \nsegregating \ndefective tools \nand equipment\n2.6 Adjusting test \ninstruments\n\n--- PDF PAGE 46 ---\n43           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1.7.2 Conversions (metric \nand English system) \nfor weights and \nmeasures \n1.7.3 Ratio and \nproportions  \n1.8 \nMaterials, Tools \nand Equipment: \nUses, \nSpecifications and \nMaintenance \nTools and Equipment \n1.8.1 Can understand and \nfollow instructional \nmanuals \n1.8.2 Parts and functions \nof equipment, quality \ncontrol tools/ \ninstruments  \n         Materials \n1.8.3 Where to source \ngood quality \nsupplies and \nmaterials in line with \npreparation \nactivities. \n         Maintenance \n1.8.4 Regular upkeep of \nvarious tools and \nequipment \n1.8.5 Preventive \nmaintenance of \nvarious equipment \nand tools \n1.9 \nValues/attitudes \n1.9.1 Safety and health \nconsciousness \n1.9.2 Resourcefulness \n1.9.3 Diligence \n1.9.4 Time \nconsciousness \n1.9.5 Cost-\nconsciousness \n1.9.6 Personal integrity in \ndoing routine\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \n \n \n44         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \nmanagement \npractices \n1.9.7 Perseverance in \nexecuting routine \nworks  \n1.9.8 Ability to work with \nothers \nharmoniously\n2. Inspect rice mill 2.1 Personal \nProtective \nEquipment (PPEs) \nare selected and \nworn as per work \nrequirement.  \n2.2 Type of rice mill is \nidentified \naccording to \nestablished \nstandards. \n2.3 Inspections of rice \nmill components \nare conducted \nfollowing \nmanufacturer’s \nmanual.  \n2.4 Ancillary \nequipment is \nchecked following \nmanufacturer’s \nmanual. \n2.5 Power \ntransmission is \nexamined following \nmanufacturer’s \nmanual. \n2.6 Safety measures \nare applied in \naccordance with \nOccupational \nSafety and Health \nStandards (OSHS) \n \n2.1 \nKnowledge, Theory, \nPractices and \nSystems \nOperations \n2.1.1 Proper use of tools \nand instrument. \n2.1.2 Proper interpretation \nof plans and \nblueprints. \n2.1.3 Function of tools and \nmeasuring \ninstruments \n2.2 \nCommunication \n2.2.1 Methods of \naccomplishing forms \nand checklists  \n2.2.2 Procedures on \nreporting of defects, \nto immediate \nhead/supervisor \n2.2.3 Recording and \nreporting  \n2.3 \nSafety Practices \n2.3.1 Occupational Health \nand Safety \nStandards \n2.4 \nCodes and \nRegulations \n2.3.2 Philippine \nAgricultural \nEngineering \nStandards \n2.5 \nMathematics and \nMensuration \n2.5.1 Four fundamental \noperations (addition, \nsubtraction, \n2.1 Practicing \nOSHS \n2.2 Demonstrating \nfamiliarity of \nrice mill parts \nand \ncomponents \n2.3 Inspecting the \nrice mill \ncomponents \n2.4 Checking \nancillary \nequipment \n2.5 Examining \npower \ntransmission \n2.6 Demonstrating \nproper \nhandling of \ntools and \ninstruments \n2.7 Demonstrating \nInterpretation \nof service \nmanuals\n\n--- PDF PAGE 48 ---\n45           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n \nmultiplication and \ndivision)] \n2.5.2 Conversions (metric \nand English system) \nfor weights and \nmeasures \n2.5.3 Ratio and \nproportions  \n2.6 \nMaterials, Tools \nand Equipment: \nUses, \nSpecifications and \nMaintenance \nTools and \nEquipment \n2.6.1 Can understand \nand follow \ninstructional \nmanuals \n2.6.2 Parts and functions \nof equipment, \nquality control tools/ \ninstruments  \nMaterials \n2.6.3 Where to source \ngood quality \nsupplies and \nmaterials  \nMaintenance \n2.6.4 Regular upkeep of \nvarious tools and \nequipment \n2.6.5 Preventive \nmaintenance of \nvarious equipment \nand tools \n2.7 \nValues/attitudes \n2.7.1 Safety and health \nconsciousness \n2.7.2 Resourcefulness \n2.7.3 Diligence \n2.7.4 Time \nconsciousness \n2.7.5 Cost-\nconsciousness\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \n \n \n46         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n2.7.6 Personal integrity in \ndoing routine \nmanagement \npractices \n2.7.7 Perseverance in \nexecuting routine \nworks  \n2.7.8 Ability to work with \nothers \nharmoniously\n3.  Perform \nservicing of rice \nmill  \n3.1 Personal Protective \nEquipment (PPEs) \nare selected and \nworn as per work \nrequirement. \n3.2 Missing standards \nparts are replaced. \n3.3 Defective fabricated \ncomponents are \nrepaired. \n3.1. Bearing fittings are \nproperly greased. \n3.2. Rotating shafts are \naligned. \n3.3. Transmission drive \nare aligned. \n3.4. Debris are \nremoved. \n3.5. Safety measures \nare applied in \naccordance with \nOccupational \nSafety and Health \nStandards (OSHS). \n3.1 \nKnowledge, \nTheory, Practices \nand Systems \nOperations \n3.1.1 Proper use of tools \nand instrument. \n3.1.2 Proper \ninterpretation of \nplans and \nblueprints. \n3.1.3 Function of tools \nand measuring \ninstruments \n3.2 Communication \n3.2.1 Methods of \naccomplishing \nforms and \nchecklists  \n3.2.2 Procedures on \nreporting of defects, \nto immediate \nhead/supervisor \n3.2.3 Recording and \nreporting \n3.3 Safety Practices \n3.3.1 Occupational \nHealth and Safety \nStandards \n3.4 \nCodes and \nRegulations \n3.4.1 Philippine \nAgricultural \nEngineering \nStandards\n3.1 Wearing PPE \n \n3.2 Applying \nOSHS \n \n3.3 Replacing \nmissing \nstandard parts \n \n3.4 Repairing \ndefective \ncomponents \n \n3.5 Greasing \nbearing fittings \n \n3.6 Aligning shafts \n \n \n3.7 Aligning \ntransmission \ndrive \n \n3.8 Removal of \ndebris in the \nsystem \n \n3.9 Demonstrating \nproper \nhandling of \ntools and \ninstruments\n\n--- PDF PAGE 50 ---\n47           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \n3.5 \nMathematics and \nMensuration \n3.5.1 Four fundamental \noperations \n(addition, \nsubtraction, \nmultiplication and \ndivision) \n3.5.2 Conversions (metric \nand English \nsystem) for weights \nand measures \n3.5.3 Ratio and \nproportions \n3.6 \nMaterials, Tools \nand Equipment: \nUses, \nSpecifications and \nMaintenance \nTools and \nEquipment \n3.6.1 Can understand \nand follow \ninstructional \nmanuals \n3.6.2 Parts and functions \nof equipment, \nquality control tools/ \ninstruments  \nMaterials \n3.6.3 Where to source \ngood quality \nsupplies and \nmaterials  \nMaintenance \n3.6.4 Regular upkeep of \nvarious tools and \nequipment \n3.6.5  Preventive \nmaintenance of \nvarious equipment \nand tools \n3.7 Values/attitudes \n3.7.1 Safety and health \nconsciousness \n3.7.2 Resourcefulness \n3.7.3 Diligence \n3.7.4 Time \nconsciousness \n3.7.5 Cost-\nconsciousness\n3.10 Interpreting \nservice \nmanuals\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \n \n \n48         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n3.7.6 Personal integrity in \ndoing routine \nmanagement \npractices \n3.7.7 Perseverance in \nexecuting routine \nworks  \n3.7.8 Ability to work with \nothers \nharmoniously\n4.  Test run rice \nmill \n4.1 Personal \nProtective \nEquipment (PPEs) \nare selected and \nworn as per work \nrequirement. \n4.2 Ocular inspection \nof serviced \ncomponents are \ndone according to \napproved \nchecklist. \n4.3 Rice mill \ncomponents are \noperated \naccording to \noperator’s manual. \n4.4 Operating \nconditions are \nadjusted as \ndirected by client’s \nspecifications \n4.5 Zeal of rice mill are \nobserved \naccording to \napproved \nchecklist. \n4.6 Safety measures \nare applied in \naccordance with \nOccupational \nSafety and Health \nStandards \n(OSHS). \n4.1 \nKnowledge, \nTheory, Practices \nand Systems \nOperations \n4.1.1 Proper use of tools \nand instrument. \n4.1.2 Proper \ninterpretation of \nplans and \nblueprints. \n4.1.3 Function of tools \nand measuring \ninstruments \n4.2 \nCommunication \n4.2.1 Methods of \naccomplishing \nforms and \nchecklists \n4.2.2 Procedures on \nreporting of defects, \nto immediate \nhead/supervisor \n4.2.3 Recording and \nreporting \n4.3 \nSafety Practices \n4.3.1 Occupational \nHealth and Safety \nStandards \n \n4.4 \nCodes and \nRegulations \n4.4.1 Philippine \nAgricultural \nEngineering \nStandards\n4.1 Practicing \nOSHS \n4.2 Performing \nocular \ninspection of \nserviced \ncomponents \n4.3 Operate rice \nmill \ncomponent for \ntest run \npurposes \n4.4 Adjusting \noperating \nconditions of \ncomponents \n4.5 Observing zeal \nof rice mill \n4.6 Accomplishing \nmonitoring \nchecklist \n4.7 Demonstrating \nproper \nhandling of \ntools and \ninstruments \n4.8 Interpreting \nservice \nmanuals\n\n--- PDF PAGE 52 ---\n49           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \n4.5 \nMathematics and \nMensuration \n4.5.1 Four fundamental \noperations \n(addition, \nsubtraction, \nmultiplication and \ndivision) \n4.5.2 Conversions (metric \nand English \nsystem) for weights \nand measures \n4.5.3 Ratio and \nproportions \n4.6 \nMaterials, Tools \nand Equipment: \nUses, \nSpecifications and \nMaintenance \n          Tools and     \n           Equipment \n4.6.1 Can understand \nand follow \ninstructional \nmanuals \n4.6.2 Parts and functions \nof equipment, \nquality control \ntools/ instruments  \nMaterials \n4.6.3 Where to source \ngood quality \nsupplies and \nmaterials \nMaintenance \n4.6.4 Regular upkeep of \nvarious tools and \nequipment \n4.6.5 Preventive \nmaintenance of \nvarious equipment \nand tools \n4.7 Values/attitudes \n4.7.1 Safety and health \nconsciousness \n4.7.2 Resourcefulness \n4.7.3 Diligence \n4.7.4 Time \nconsciousness \n4.7.5 Cost-\nconsciousness\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \n \n \n50         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n4.7.6 Personal integrity \nin doing routine \nmanagement \npractices \n4.7.7 Perseverance in \nexecuting routine \nworks \n4.7.8 Ability to work with \nothers \nharmoniously \n5.  Perform post-\nservicing \nactivities \n5.1 Personal \nProtective \nEquipment (PPEs) \nare selected and \nworn as per work \nrequirement \n5.2 Machine is \nshutdown \naccording to \noperator’s manual. \n5.3 Waste are \ndisposed \naccording to \nenvironmental \nguidelines. \n5.4 Safety measures \nare applied in \naccordance with \nOccupational \nSafety and Health \nStandards \n(OSHS). \n5.5 Record and report \nis prepared \nfollowing \nworkplace \nprocedures \n \n5.1 \nKnowledge, \nTheory, Practices \nand Systems \nOperations \n5.1.1 Proper use of tools \nand instruments \n5.1.2 Proper \ninterpretation of \nplans and \nblueprints \n5.1.3 Function of tools \nand measuring \ninstruments \n5.2 \nCommunication \n5.2.1 Methods of \naccomplishing \nforms and \nchecklists \n5.2.2 Procedures on \nreporting of \ndefects, to \nimmediate \nhead/supervisor \n5.2.3 Recording and \nreporting \n5.3 \nSafety Practices \n5.3.1 Occupational \nHealth and Safety \nStandards \n5.4 \nCodes and \nRegulations \n5.4.1 Philippine \nAgricultural \n5.1 Applying OSHS \npractices \n5.2 Shutting down \nof machine \n5.3 Disposing of \nwastes \n5.4 Demonstrating \nproper handling \nof tools and \ninstruments \n5.5 Interpreting \nservice manuals \n5.6 Keeping records \n5.7 Preparing report\n\n--- PDF PAGE 54 ---\n51           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nEngineering \nStandards \n5.5 \nMathematics and \nMensuration \n5.5.1 Four fundamental \noperations \n(addition, \nsubtraction, \nmultiplication and \ndivision) \n5.5.2 Conversions \n(metric and \nEnglish system) for \nweights and \nmeasures \n5.5.3 Ratio and \nproportions \n5.6 \nMaterials, Tools \nand Equipment: \nUses, \nSpecifications and \nMaintenance \n          Tools and   \n          Equipment \n5.6.1 Can understand \nand follow \ninstructional \nmanuals \n5.6.2 Parts and functions \nof equipment, \nquality control tools/ \ninstruments \nMaterials \n5.6.3 Where to source \ngood quality \nsupplies and \nmaterials \nMaintenance \n5.6.4 Regular upkeep of \nvarious tools and \nequipment \n5.6.5 Preventive \nmaintenance of \nvarious equipment \nand tools \n5.7 \nValues/attitudes \n5.7.1 Safety and health \nconsciousness \n5.7.2 Resourcefulness \n5.7.3 Diligence \n5.7.4 Time \nconsciousness\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \n \n \n52         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n5.7.5 Cost-\nconsciousness \n5.7.6 Personal integrity in \ndoing routine \nmanagement \npractices \n5.7.7 Perseverance in \nexecuting routine \nworks \n5.7.8 Ability to work with \nothers \nharmoniously\n\n--- PDF PAGE 56 ---\n53           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n1. Tools, manuals and test \ninstruments \nTools, manuals and test instruments may include but not limited \nto: \n1.1 Open wrench \n1.2 Box wrench \n1.3 Level  \n1.4 Tape measure \n1.5 Adjustable wrench \n1.6 Screw driver \n1.7 Philips screw driver \n1.8 Riveter \n1.9 Allen wrench \n1.10 Clamp ammeter \n1.11 Thermometer \n1.12 Anemometer \n1.13 Manometer \n1.14 Tachometer \n1.15 Service manuals \n1.16 Checklist \n1.17 PPE\n2. \nPersonal Protective \nEquipment \nPersonal Protective Equipment may include but not limited to: \n2.1 Mask \n2.2 Gloves \n2.3 Goggles \n2.4 Ear muffs \n2.5 Eye shield \n2.6 Coverall \n3. \nType of rice mill \nType of rice mill may include: \n3.1 Single pass \n3.2 Multi-pass \n4. \nRice mill components \nRice mill components may include: \n \n4.1 Huller component may include: \n Rubber-roll \n Under-runner \n Fluted roll \n centrifugal \n \n4.2 Whitener component may include: \n friction whitener \n abrasive whitener \n \n4.3 Polisher component may include: \n mist polisher \n friction polisher \nabrasive polisher\n5. Ancillary equipment \nAncillary equipment may include:\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \n \n \n54         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nVARIABLE \nRANGE \n5.1 grain elevator \n5.2 grain conveyor \n5.3 chute \n5.4 rice hull blower \n5.5 paddy separator \n5.6 de-stoner \n5.7 magnetic separator \n5.8 pre-cleaner \n5.9 dust collection equipment \n5.10 rice grader \n5.11 auto weigher \n5.12 Electric motor \n5.13 control panel\n6. Power transmission \nPower transmission component may include: \n6.1 gear-drive \n6.2 belt-drive \n6.3 chain-drive \n6.4 shafting \n6.5 bearings \n6.6\npulleys \n7. Missing parts \nMissing parts may include: \n7.1 Grease fitting \n7.2 Bearings \n7.3 Pulleys \n7.4 Set crews \n7.5 Nuts and bolts \n7.6\nWirings\n8. Defective \nDefective refers to as a result of: \n8.1 Rusting  \n8.2\nClogging \n9. Rotating shafts \nRotating shafts may include: \n9.1 Pulley shaft \n9.2 Eccentric shaft \n9.3\nAuger shaft\n10. Debris \nDebris may include: \n10.1 Lodged grains \n10.2 Plastic twine \n10.3 Hardened dust \n10.4 Sprouted grains \n10.5 Stones and pebbles\n11. Operator’s manual \nOperator’s manual refers to the operating manual and \nsequential operation of the rice mill components.\n12. Operating conditions \nOperating conditions may include but not limited to: \n12.1 Clearance of huller \n12.2 Tension of whitener \n12.3 Tension of polisher \n12.4 Chute opening \n12.5\nSpeed of adjustable pulley\n\n--- PDF PAGE 58 ---\n55           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nVARIABLE \nRANGE \n12.6 Length of stroke of oscillator \n12.7 Tension of transmission belts \n12.8 Speed of engine \n12.9 Speed of blower \n12.10 Belt drive tension\n13. Zeal \nZeal may include: \n13.1 Less vibration \n13.2 Less noise \n13.3\nBalance of shaft\n14. Waste \nWaste may include but not limited to: \n14.1 Paint container \n14.2 Paint brush \n14.3 Sanding paper \n14.4 Grinding wheel \n14.5 Debris \n14.6 Replaced rice mill components\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08 \n \n \n56         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared tools, manuals and test instruments \n1.2 Checked rice mill \n1.3 Replaced defective components \n1.4 Replaced missing parts \n1.5 Operated rice mill \n1.6 Performed post-servicing maintenance\n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Rice mill processing plant \n2.2. Tools/ instruments/ equipment \n2.3. Writing device \n2.4. Supplies \n2.5. Logbooks \n2.6. References (service manual/ catalogue, protocols, \nOHSP and GAP manuals) \n2.7. Production guide\n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Direct Observation \n3.2 Demonstration \n3.3 Oral interview and/or written test \n3.4 Third party report\n4. Context of \nAssessment\n4.1 Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
