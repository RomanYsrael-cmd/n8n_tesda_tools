        "source_text": "AFF723303\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to service corn milling plant facility. This also\nincludes proper use of tools and equipment, maintain\nand operate the corn mill plant.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Prepare tools,\nmanuals and\ntest\ninstruments\n1.1 Tools, manuals\nand test\ninstruments are\nselected in\naccordance with\nmanufacturer’s\nspecifications\n1.2 Safety measures\nare applied in\naccordance with\nOccupational\nSafety and Health\nStandards (OSHS)\n1.3 Inspection and\nsegregation of\ndefective tools and\ntest instruments\nare done\naccording to\nworkplace\nprocedures.\n1.4 Adjustment of test\ninstruments is\ncarried-out\naccording to\nmanuals.\n1.1\nKnowledge,\nTheory, Practices\nand Systems\nOperations\n1.1.1 Inspection and\nchecking\nprocedures of\nvarious tools and\ninstruments.\n1.1.2 Use of instruments\n1.2\nCommunication\n1.2.1 Methods of\naccomplishing\nforms and\nchecklists\n1.2.2 Procedures on\nreporting of defects,\nto immediate\nhead/supervisor\n1.2.3 Recording and\nreporting\n1.3\nSafety Practices\n1.3.1 Occupational\nHealth and Safety\nStandards\n1.4\nCodes and\nRegulations\n1.4.1 Good Agriculture\nPractice Standards\n1.4.2 Philippine\nAgricultural\nEngineering\nStandards\n1.5\nMathematics and\nMensuration\n1.5.1 Four fundamental\noperations\n1.1 Demonstrating\nproper handling\nof tools and\ninstruments\n1.2 Interpreting\nservice\nmanuals\n1.3 Selecting tool,\nmanuals and\ntest\ninstruments\n1.4 Applying OSHS\n1.5 Inspecting and\nsegregating\ndefective tools\nand equipment\n1.6 Adjusting test\ninstruments\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\n\n58 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\n(addition,\nsubtraction,\nmultiplication and\ndivision)\n1.5.2 Conversions\n(metric and\nEnglish system) for\nweights and\nmeasure