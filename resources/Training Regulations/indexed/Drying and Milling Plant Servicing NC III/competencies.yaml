ompetency.\nAssessment will occur over a range of situations, which will include\ndisruptions to normal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include walk through of\nthe relevant competency components.\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this unit concurrently\nwith relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n\n18 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\nUNIT CODE\n:"
