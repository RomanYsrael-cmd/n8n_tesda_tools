        "source_title": "SERVICE CORN MILLING PLANT FACILITY",
        "source_text": "--- PDF PAGE 60 ---\n57           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nUNIT OF COMPETENCY : \n SERVICE CORN MILLING PLANT FACILITY \nUNIT CODE \n: \n AFF723303 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to service corn milling plant facility.  This also \nincludes proper use of tools and equipment, maintain \nand operate the corn mill plant. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1.  Prepare tools, \nmanuals and \ntest \ninstruments \n1.1 Tools, manuals \nand test \ninstruments are \nselected in \naccordance with \nmanufacturer’s \nspecifications \n1.2 Safety measures \nare applied in \naccordance with \nOccupational \nSafety and Health \nStandards (OSHS) \n1.3  Inspection and \nsegregation of \ndefective tools and \ntest instruments \nare done \naccording to \nworkplace \nprocedures. \n1.4 Adjustment of test \ninstruments is \ncarried-out \naccording to \nmanuals. \n1.1 \nKnowledge, \nTheory, Practices \nand Systems \nOperations \n1.1.1 Inspection and \nchecking \nprocedures of \nvarious tools and \ninstruments. \n1.1.2 Use of instruments \n1.2 \nCommunication \n1.2.1 Methods of \naccomplishing \nforms and \nchecklists  \n1.2.2 Procedures on \nreporting of defects, \nto immediate \nhead/supervisor \n1.2.3 Recording and \nreporting  \n1.3 \nSafety Practices \n1.3.1 Occupational \nHealth and Safety \nStandards \n1.4 \nCodes and \nRegulations \n1.4.1 Good Agriculture \nPractice Standards \n1.4.2 Philippine \nAgricultural \nEngineering \nStandards \n1.5 \nMathematics and \nMensuration \n1.5.1 Four fundamental \noperations \n1.1 Demonstrating \nproper handling \nof tools and \ninstruments \n1.2 Interpreting \nservice \nmanuals \n1.3 Selecting tool, \nmanuals and \ntest \ninstruments \n1.4 Applying OSHS \n1.5 Inspecting and \nsegregating \ndefective tools \nand equipment \n1.6 Adjusting test \ninstruments\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08 \n \n \n58         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \n(addition, \nsubtraction, \nmultiplication and \ndivision) \n1.5.2 Conversions \n(metric and \nEnglish system) for \nweights and \nmeasures \n1.5.3 Ratio and \nproportions  \n1.6 \nMaterials, Tools \nand Equipment: \nUses, \nSpecifications and \nMaintenance \nTools and  \nEquipment \n1.6.1 Can understand \nand follow \ninstructional \nmanuals \n1.6.2 Parts and functions \nof equipment, \nquality control \ntools/ instruments  \nMaterials \n1.6.3 Where to source \ngood quality \nsupplies and \nmaterials in line \nwith preparation \nactivities. \nMaintenance \n1.6.4 Regular upkeep of \nvarious tools and \nequipment \n1.6.5 Preventive \nmaintenance of \nvarious equipment \nand tools \n1.7 \nValues/attitudes \n1.7.1 Safety and health \nconsciousness \n1.7.2 Resourcefulness \n1.7.3 Diligence \n1.7.4 Time \nconsciousness \n1.7.5 Cost-\nconsciousness\n\n--- PDF PAGE 62 ---\n59           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1.7.6 Personal integrity in \ndoing routine \nmanagement \npractices \n1.7.7 Perseverance in \nexecuting routine \nworks  \n1.7.8 Ability to work with \nothers \nharmoniously\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08 \n \n \n60         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n2.  Inspect corn \nmill  \n2.1. Personal \nProtective \nEquipment (PPEs) \nare selected and \nworn as per work \nrequirement.  \n2.2. Type of corn mill is \nidentified \naccording to \nestablished \nstandards. \n2.3. Corn mill \ncomponent is \ninspected. \n2.4. Grit grader \ncomponent is \ninspected. \n2.5. De-germing \ncomponent is \ninspected. \n2.6. Ancillary \nequipment is \nexamined manuals \n2.7. Power \ntransmission is \ninspected following \nmanuals  \n2.8. Safety measure \nare applied in \naccordance with \nOccupational \nSafety and Health \nStandards \n(OSHS). \n \n \n2.1 \nKnowledge, \nTheory, Practices \nand Systems \nOperations \n2.1.1 Proper use of tools \nand instrument. \n2.1.2 Proper \ninterpretation of \nplans and \nblueprints. \n2.1.3 Function of tools \nand measuring \ninstruments \n2.2 \nCommunication \n2.2.1 Methods of \naccomplishing \nforms and \nchecklists  \n2.2.2 Procedures on \nreporting of defects, \nto immediate \nhead/supervisor \n2.2.3 Recording and \nreporting  \n2.3 \nSafety Practices \n2.3.1 Occupational \nHealth and Safety \nStandards \n \n \n2.4 \nCodes and \nRegulations \n2.4.1 Philippine \nAgricultural \nEngineering \nStandards \n2.5 \nMathematics and \nMensuration \n2.5.1 Four fundamental \noperations \n(addition, \nsubtraction, \nmultiplication and \ndivision)\n2.1 Demonstrating \nproper \nhandling of \ntools and \ninstruments \n2.2 Demonstrating \nInterpretation \nof service \nmanuals \n2.3 Demonstrating \nfamiliarity of \ncorn mill parts \nand \ncomponents \n2.4 Inspecting \ncorn mill \ncomponents \n2.5 Checking grit \ngrader \ncomponent \n2.6 Inspecting de-\ngerminating \ncomponent \n2.7 Examining \nancillary \nequipment \n2.8 Inspecting \npower \ntransmission\n\n--- PDF PAGE 64 ---\n61           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n2.5.2 Conversions (metric \nand English \nsystem) for weights \nand measures \n2.5.3 Ratio and \nproportions  \n2.6 \nMaterials, Tools \nand Equipment: \nUses, \nSpecifications and \nMaintenance \nTools and Equipment \n2.6.1 Can understand \nand follow \ninstructional \nmanuals \n2.6.2 Parts and functions \nof equipment, \nquality control tools/ \ninstruments  \nMaterials \n2.6.3 Where to source \ngood quality \nsupplies and \nmaterials  \nMaintenance \n2.6.4 Regular upkeep of \nvarious tools and \nequipment \n2.6.5 Preventive \nmaintenance of \nvarious equipment \nand tools \n2.7 \nValues/attitudes \n2.7.1 Safety and health \nconsciousness \n2.7.2 Resourcefulness \n2.7.3 Diligence \n2.7.4 Time \nconsciousness \n2.7.5 Cost-\nconsciousness \n2.7.6 Personal integrity in \ndoing routine \nmanagement \npractices\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08 \n \n \n62         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n2.7.7 Perseverance in \nexecuting routine \nworks  \n2.7.8 Ability to work with \nothers \nharmoniously\n3. Perform \nservicing of \ncorn mill \n3.1. Personal Protective \nEquipment(PPEs) \nare selected and \nworn as per work \nrequirement. \n3.2. Missing standard \nparts are replaced \nfollowing \ninstructional \nmanuals \n3.3. Defective fabricated \ncomponents are \nrepaired. \n3.4. Bearing fittings are \nproperly greased. \n3.5. Rotating shafts are \naligned. \n3.6. Bolts and screws is \ntightened following \nmanuals. \n3.7. Transmission drive \nare aligned. \n3.8. Debris are removed \naccording to \nestablished work \nprocedures. \n3.9. Safety measures \nare applied in \naccordance with \nOccupational \nSafety and Health \nStandards (OSHS). \n3.1 \nKnowledge, \nTheory, Practices \nand Systems \nOperations \n3.1.1 Proper use of tools \nand instrument. \n3.1.2 Proper \ninterpretation of \nplans and \nblueprints. \n3.1.3 Function of tools \nand measuring \ninstruments \n3.2 \nCommunication \n3.2.1 Methods of \naccomplishing \nforms and \nchecklists  \n3.2.2 Procedures on \nreporting of defects, \nto immediate \nhead/supervisor \n3.2.3 Recording and \nreporting \n3.3 \nSafety Practices \n3.3.1 Occupational \nHealth and Safety \nStandards \n3.4 \nCodes and \nRegulations \n3.4.1 Philippine \nAgricultural \nEngineering \nStandards \n3.4.2 Food safety \nstandards\n3.1 Applying OSHS \npractices \n3.2 Replacing \nmissing \nstandard parts \n3.3 Repairing \ndefective corn \nmill components\n3.4 Demonstrating \nproper handling \nof tools and \ninstruments \n3.5 Interpreting \nservice manuals\n3.6 Greasing \nbearing fittings \n3.7 Aligning rotating \nshafts \n3.8 Tightening of \nbolts and \nscrews \n3.9 Aligning of \ntransmission \ndrive \n3.10 Removing \ndebris found in \ncorn mill \ncomponents\n\n--- PDF PAGE 66 ---\n63           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \n3.5 \nMathematics and \nMensuration \n3.5.1 Four fundamental \noperations \n(addition, \nsubtraction, \nmultiplication and \ndivision) \n3.5.2 Conversions (metric \nand English \nsystem) for weights \nand measures \n3.5.3 Ratio and \nproportions \n3.6 \nMaterials, Tools \nand Equipment: \nUses, \nSpecifications and \nMaintenance \nTools and Equipment \n3.6.1 Can understand \nand follow \ninstructional \nmanuals \n3.6.2 Parts and functions \nof equipment, \nquality control tools/ \ninstruments  \nMaterials \n3.6.3 Where to source \ngood quality \nsupplies and \nmaterials  \nMaintenance \n3.6.4 Regular upkeep of \nvarious tools and \nequipment \n3.6.5 Preventive \nmaintenance of \nvarious equipment \nand tools \n3.7 \nValues/attitudes \n3.7.1 Safety and health \nconsciousness \n3.7.2 Resourcefulness \n3.7.3 Diligence \n3.7.4 Time \nconsciousness \n3.7.5 Cost-\nconsciousness \n3.7.6 Personal integrity in \ndoing routine\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08 \n \n \n64         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \