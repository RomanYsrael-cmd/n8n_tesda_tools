afting\n6.5 bearings\n6.6\npulleys\n7. Missing parts\nMissing parts may include:\n7.1 Grease fitting\n7.2 Bearings\n7.3 Pulleys\n7.4 Set crews\n7.5 Nuts and bolts\n7.6\nWirings\n8. Defective\nDefective refers to as a result of:\n8.1 Rusting\n8.2\nClogging\n9. Rotating shafts\nRotating shafts may include:\n9.1 Pulley shaft\n9.2 Eccentric shaft\n9.3\nAuger shaft\n10. Debris\nDebris may include:\n10.1 Lodged grains\n10.2 Plastic twine\n10.3 Hardened dust\n10.4 Sprouted grains\n10.5 Stones and pebbles\n11. Operator’s manual\nOperator’s manual refers to the operating manual and\nsequential operation of the rice mill components.\n12. Operating conditions\nOperating conditions may include but not limited to:\n12.1 Clearance of huller\n12.2 Tension of whitener\n12.3 Tension of polisher\n12.4 Chute opening\n12.5\nSpeed of adjustable pulley\n\n--- PDF PAGE 58 ---\n55 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nVARIABLE\nRANGE\n12.6 Length of stroke of oscillator\n12.7 Tension of transmission belts\n12.8 Speed of engine\n12.9 Speed of blower\n12.10 Belt drive tension\n13. Zeal\nZeal may include:\n13.1 Less vibration\n13.2 Less noise\n13.3\nBalance of shaft\n14. Waste\nWaste may include but not limited to:\n14.1 Paint container\n14.2 Paint brush\n14.3 Sanding paper\n14.4 Grinding wheel\n14.5 Debris\n14.6 Replaced rice mill components\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\n\n56 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared tools, manuals and test instruments\n1.2 Checked rice mill\n1.3 Replaced defective components\n1.4 Replaced missing parts\n1.5 Operated rice mill\n1.6 Performed post-servicing maintenance\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Rice mill processing plant\n2.2. Tools/ instruments/ equipment\n2.3. Writing device\n2.4. Supplies\n2.5. Logbooks\n2.6. References (service manual/ catalogue, protocols,\nOHSP and GAP manuals)\n2.7. Production guide\n3. Method of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Demonstration\n3.3 Oral interview and/or written test\n3.4 Third party report\n4. Context of\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 60 ---\n57 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nUNIT OF COMPETENCY :\n SERVICE CORN MILLING PLANT FACILITY\nUNIT CODE\n:"
