          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine work \nrequirements \n1.1 Servicing \nrequirements are \nidentified based on job \nrequisitions. \n1.2 Preparation of  \nmaterials, tools, \nmanuals and test \ninstruments is \noverseen in \naccordance with work \nrequirements. \n1.3 Work assigning and \nscheduling are done \nfollowing job \nrequirements and \nwork instructions. \n1.4 Personal Protective \nEquipment (PPEs) \nare prepared following \nworkplace procedures \nand Occupational \nSafety and Health \nStandards (OSHS) \n1.5 Where necessary, \nequipment history \n/documentation is \nconsulted prior to site \nvisit \n1.6 Workplace \ndocumentation is \nprepared according to \nworkplace procedures \n1.1 Knowledge, Theory, \nPractices and Systems \nOperations \n1.1 Identification of service \nrequirements \n1.2 Job requisitions \n1.3 Overseeing for \npreparation \nprocedures \n-audit tools, manual \nand test instruments \n-check integrity of tools \nand test instruments \n1.4 Calendar of activities \n1.5 Preventive \nmaintenance record \n1.5.1 Workplace \ndocumentation \n1.6    Communication \n          Written \ncommunication \n          Verbal workplace \ncommunication \n1.6.1 Safety Practices \n         PPE \n1.6.2 Codes and \nRegulations OSHS \n1.7    Mathematics and \nMensuration \n1.7.1 Basic statistics (Data \ncorrelation, \nAveraging) \n1.7.2 Basic trigonometry \n(calculations of \nangles, surface \ngenerations) \n1.8    Materials, Tools and \nEquipment: Uses, \n1.1 Identifying \nservice \nrequirements \n \n1.2 Analyzing \nscope of works \n \n1.3 Monitoring \npreparation \nprocedures \n \n1.4Interpreting \ncalendar of \nactivities \n \n1.5 Assigning    \nwork  \n \n1.6 Practicing \nworkplace \nsafety  \n \n1.7 Analyzing \nequipment \nhistory / \ndocumentation \n \n1.8 Preparing \nworkplace \ndocumentation \n \n1.9 Practicing \nbasic statistics \nand \ntrigonometry\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \n \n33     