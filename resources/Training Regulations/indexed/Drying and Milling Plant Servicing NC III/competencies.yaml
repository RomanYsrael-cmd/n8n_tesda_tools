        "source_text": "--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \n \n \n27           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nUNIT OF COMPETENCY :    USE FARM TOOLS AND EQUIPMENT \nUNIT CODE                 \n:    AFF321202 \nUNIT DESCRIPTOR          :   This unit covers the knowledge, skills and attitudes required to \nuse farm tools and equipment. It includes selection, operation \nand preventive maintenance of farm tools and equipment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Select and \nuse farm tools \n \n1.1 \nAppropriate \nfarm tools are \nidentified \naccording to \nrequirement/u\nse \n1.2 \nFarm tools are \nchecked for \nfaults and \ndefective tools \nreported in \naccordance \nwith farm \nprocedures \n1.3 \nAppropriate \ntools are \nsafely used \naccording to \njob \nrequirements \nand \nmanufacturers \nconditions\n1.1 Types and uses of \nfarm tools \n1.2 Characteristics of \nfunctional tools \n1.3 Checking tools for \ndefects/faults \n1.4 Segregation and \nreporting defective \ntools  \n1.5 Uses of tools and \nequipment  \n \n1.1Identifying farm \ntools for the work \n1.2Checking the \nconditions of tools \n1.3Reporting defective \ntools \n1.4Using tools  \n2. \nSelect and \noperate farm \nequipment \n2.1 \nIdentify \nappropriate \nfarm \nequipment \n2.2 \nInstructional \nmanual of the \nfarm tools and \nequipment are \ncarefully read \nprior to \noperation \n2.3 \nPre-\noperation \ncheck-up is \nconducted in \nline with \n2.1 Types and \noperations of farm \nequipment \n2.2 Standards \noperating \nprocedures of \nfarm equipment \n2.3 Instructional \nmanual of \nequipment \n2.4 Pre-operation \ncheck-up \n2.5 Equipment \nSpecification \n2.6 Procedures in \ncalibrating and \nuse of equipment\n2.1 Identifying \nappropriate farm \nequipment for the \nwork \n2.2 Reading \ninstructional \nmanual. \n2.3 Conducting pre-\noperation check-\nup \n2.4 Identifying \nfaults/defects of \nfarm equipment \n2.5 Reporting on \ndefective farm \nequipment\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \n \n \n28         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \nmanufacturers \nmanual \n2.4 \nFaults in farm \nequipment are \nidentified and \nreported in \nline with farm \nprocedures \n2.5 \nFarm \nequipment \nused \naccording to \nits function \n2.6 \nSafety \nprocedures \nare followed.\n2.7 \nEquipment faults \nidentification and \nreporting \n2.8 \nOperation of \nequipment \n2.9 \nCodes and \nRegulations on \nenvironmental \nprotection \n2.10 Safety and \nkeeping of \nequipment every \nafter use \n2.11 Safety measures \n2.6 Operating farm \nequipment \n2.7 Following safety \nprocedures. \n \n \n3. \nPerform \npreventive \nmaintenance \n3.1 \nTools and \nequipment are \ncleaned \nimmediately \nafter use in \nline with farm \nprocedures \n3.2 \nRoutine \ncheck-up and \nmaintenance \nare performed \n3.3 \nTools and \nequipment are \nstored in \ndesignated \nareas in line \nwith farm \nprocedures\n3.1 Cleaning \nprocedures of \ntools and \nequipment \n3.2 Maintenance \nprocedures of \nfarm equipment \n3.3 Storage of tools \nand equipment \n3.4 Designated \nstorage areas \n \n3.1 Cleaning tools and \nequipment \n3.2 Performing \nroutinary check-up \nof tools and \nequipment \n3.3 Maintaining farm \nequipment \n3.4 Storing tools and \nequipment\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \n \n \n29           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Farm equipment \n \nFarm equipment include: \n1.1 Engine \n1.2 Pumps \n1.3 Generators \n1.4 Sprayers\n2. Farm tools \nFarm tools includes: \n2.1 Sickle