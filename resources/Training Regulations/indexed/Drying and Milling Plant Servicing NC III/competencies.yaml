Precision and \naccuracy \n3.4 Basic measuring \ntools/devices \n3.1 Applying \nmathematical \ncomputations \n3.2 Using \ncalculator \n3.3 Using different \nmeasuring \ntools\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \n \n \n19           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \n \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Mathematical \ntechniques \nMay include: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n2. Appropriate \naction \n2.1  Review in the use of mathematical techniques (e.g. recalculation, re-\nmodeling) \n2.2  Report error to immediate superior for proper action \n \n \n \nEVIDENCE GUIDE \n \n1. Critical \nAspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Identified, applied and reviewed the use of mathematical concepts \nand techniques to workplace problems \n2. Resource \nImplications \nThe following resources should be provided: \n2.1  Calculator \n2.2  Basic measuring tools \n2.3  Case Problems \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Authenticated portfolio \n3.2   Written Test \n3.3   Interview/Oral Questioning \n3.4   Demonstration \n4. Context for \nAssessment \n4.1   Competency may be assessed in the work place or in a simulated \nwork place setting\n",
