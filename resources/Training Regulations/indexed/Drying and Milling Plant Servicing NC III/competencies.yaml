        "evidence_guide": {
          "source_text": "1. Critical Aspects of Competency\nAssessment requires evidence that the candidate:\n1.1 Prepared tools, manuals and test instruments\n1.2 Checked corn mill\n1.3 Replaced defective components\n1.4 Replaced missing parts\n1.5 Operated corn mill\n1.6 Performed post-servicing maintenance\n2. Resource Implications\nThe following resources should be provided:\n2.1. Corn mill processing plant\n2.2. Tools/ instruments/ equipment\n2.3. Writing device\n2.4. Supplies\n2.5. Logbooks\n2.6. References (service manual/ catalogue, protocols,\nOHSP and GAP manuals)\n2.7. Production guide\n3. Method of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Demonstration\n3.3 Oral interview and/or written test\n3.4 Third party report\n4. Context of Assessment\n4.1 Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 76 ---\n73 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017"
