e in\nexecuting routine\nworks\n4.7.8 Ability to work with\nothers\nharmoniously\n5. Perform post-\nservicing\nactivities\n5.1\nPersonal\nProtective\nEquipment\n(PPEs) are\nselected and worn\nas per work\nrequirement\n5.2\nMachine is\nshutdown\naccording to\noperator’s\nmanual.\n5.3\nWastes are\ndisposed\naccording to\nenvironmental\nguidelines.\n5.4\nSafety measures\nare applied in\naccordance with\nOccupational\nSafety and Health\nStandards\n(OSHS).\n5.5\nRecord and report\nare prepared\naccording to\nworkplace\nrequirements.\n\n5.1\nKnowledge,\nTheory, Practices\nand Systems\nOperations\n5.1.1 Proper use of tools\nand instrument.\n5.1.2 Proper\ninterpretation of\nplans and\nblueprints.\n5.1.3 Function of tools\nand measuring\ninstruments\n\n5.2 Communication\n5.2.1 Methods of\naccomplishing\nforms and\nchecklists\n5.2.2 Procedures on\nreporting of\ndefects, to\nimmediate\nhead/supervisor\n5.2.3 Recording and\nreporting\n5.3 Safety Practices\n5.3.1. Occupational\nHealth and Safety\nStandards\n5.4\nCodes and\nRegulations\n5.4.1 Philippine\nAgricultural\n5.1 Applying\nOSHS\nprocedures\n5.2 Shutting down\nof machine\n5.3 Disposing\nwastes\n5.4 Demonstrating\nproper\nhandling of\ntools and\ninstruments\n5.5 Interpreting\nservice\nmanuals\n5.6 Keeping\nrecords\n5.7 Preparing\nreport\n\n--- PDF PAGE 70 ---\n67 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nEngineering\nStandards\n5.5\nMathematics and\nMensuration\n5.5.1 Four fundamental\noperations\n(addition,\nsubtraction,\nmultiplication and\ndivision)\n5.5.2 Conversions\n(metric and\nEnglish system) for\nweights and\nmeasures\n5.5.3 Ratio and\nproportions\n5.6\nMaterials, Tools\nand Equipment:\nUses,\nSpecifications and\nMaintenance\nTools and Equipment\n5.6.1 Can understand\nand follow\ninstructional\nmanuals\n5.6.2 Parts and\nfunctions of\nequipment, quality\ncontrol tools/\ninstruments\nMaterials\n5.6.3 Where to source\ngood quality\nsupplies and\nmaterials\nMaintenance\n5.6.4 Regular upkeep of\nvarious tools and\nequipment\n5.6.5 Preventive\nmaintenance of\nvarious equipment\nand tools\n5.7 Values/attitudes\n5.7.1 Safety and health\nconsciousness\n5.7.2 Resourcefulness\n5.7.3 Diligence\n5.7.4 Time\nconsciousness\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08\n\n68 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n5.7.5 Cost-\nconsciousness\n5.7.6 Personal integrity\nin doing routine\nmanagement\npractices\n5.7.7 Perseverance in\nexecuting routine\nworks\n5.7.8 Ability to work with\nothers\nharmoniously\n\n--- PDF PAGE 72 ---\n69 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, manuals and test\ninstruments\nTools, manuals and test instruments may include but\nnot limited to:\n1.1 Open wrench\n1.2 Box wrench\n1.3 Level\n1.4 Tape measure\n1.5 Adjustable wrench\n1.6 Lever wrench plier\n1.7 Screw driver\n1.8 Philips screw driver\n1.9 Riveter\n1.10 Allen wrench\n1.11 Clamp ammeter\n1.12 Thermometer\n1.13 Anemometer\n1.14 Manometer\n1.15 Tachometer\n1.16 Service manuals\n1.17 Checklist\n1.18 PPE\n2. Personal Protective Equipment\nPersonal Protective Equipment may include but not\nlimited to:\n2.1 Mask\n2.2 Gloves\n2.3 Goggles\n2.4 Ear muffs\n2.5 Eye shield\n2.6 Coverall\n3. Type of corn mill\nType of corn mill may include:\n3.1 Hammer mill\n3.2 Roller mill\n\nStandards refers to PNS: PAES 210 Specification for\ncorn mill\n4. Corn mill component\nCorn mill component may be constructed from:\n 4.1 metal sheet\n 4.2 cast iron\n 4.3 cold-rolled steel\n\n5. Grit grader component\nGrit grader component may be include:\n5.1 Mesh screen\n5.2 Perforated screen\n\n6. De-germing component\nDe-germing component may include:\n6.1 Abrasive roll\n6.2 Fluted steel roll\n6.3 Toothed disc\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\n\n70 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nVARIABLE\nRANGE\n7. Ancillary equipment\nAncillary equipment may include:\n 7.1 grain elevator\n 7.2 grain conveyor\n 7.3 chute\n 7.4 primary air blower\n 7.5 suction air blower\n 7.6 dust collection equipment\n 7.7 de-stoner\n 7.8 control panel\n\n8. Power transmission\nPower transmission component may include:\n 8.1 gear-drive\n 8.2 belt-drive\n 8.3 chain-drive\n 8.4 shafting\n 8.5 bearings\n 8.6 pulleys\n9. Missing parts\nMissing parts may include:\n 9.1 Grease fitting\n 9.2 Bearings\n 9.3 Pulleys\n 9.4 Set crews\n 9.5 Nuts and bolts\n 9.6 Wirings\n10. Defective\nDefective refers to as a result of:\n10.1 Rusting\n10.2 Wear and tear\n10.3 Breakage\n10.4 Clogging\n11. Rotating shafts\nRotating shafts may include:\n11.1 Pulley shaft\n11.2 Eccentric shaft\n11.3 Auger shaft\n12. Debris\nDebris may include:\n12.1 Lodged grain and grain parts\n12.2 Plastic twine\n12.3 Hardened dust\n12.4 Sprouted grains\n12.5 Stones and pebbles\n13. Operating conditions\nOperating conditions may include but not limited to:\n13.1 Chute opening\n13.2 Clearance of mill component\n13.3\nSpeed of adjustable pulley\n\n--- PDF PAGE 74 ---\n71 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nVARIABLE\nRANGE\n13.4 Length of stroke of oscillator\n13.5 Speed of motor\n13.6 Speed of engine\n13.7 Speed of blower\n13.8\nBelt drive tension\n14. Zeal\nZeal may include:\n14.1 Less vibration\n14.2 Less noise\n14.3 Balance of shaft\n14.4\nSuspended particle\n15. Wastes\nWastes may include but not limited to:\n15.1 Paint container\n15.2 Paint brush\n15.3 Sanding paper\n15.4 Grinding wheel\n15.5 Debris\n15.6\nReplaced corn mill components\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\n\n72 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nEVIDENCE GUIDE\n\n1. Critical Aspects of Competency\nAssessment requires evidence that the candidate:\n1.1 Prepared tools, manuals and test instruments\n1.2 Checked corn mill\n1.3 Replaced defective components\n1.4 Replaced missing parts\n1.5 Operated corn mill\n1.6 Performed post-servicing maintenance\n2. Resource Implications\nThe following resources should be provided:\n2.1. Corn mill processing plant\n2.2. Tools/ instruments/ equipment\n2.3. Writing device\n2.4. Supplies\n2.5. Logbooks\n2.6. References (service manual/ catalogue, protocols,\nOHSP and GAP manuals)\n2.7. Production guide\n3. Method of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Demonstration\n3.3 Oral interview and/or written test\n3.4 Third party report\n4. Context of Assessment\n4.1 Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 76 ---\n73 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017"
