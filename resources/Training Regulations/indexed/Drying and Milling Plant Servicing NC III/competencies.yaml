        "source_title": "SERVICE GRAINS DRYING PLANT FACILITIES",
        "source_text": "--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n \n \n32         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nCORE COMPETENCIES \nUNIT OF COMPETENCY : \n SERVICE GRAINS DRYING PLANT FACILITIES \nUNIT CODE \n: \n AFF723301 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nservice grains (rice and corn) drying plant facilities.  This also \nincludes competencies to carry-out preparation for servicing, \ndiagnose, service and test run the dryer and perform post-\nservicing activities. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine work \nrequirements \n1.1 Servicing \nrequirements are \nidentified based on job \nrequisitions. \n1.2 Preparation of  \nmaterials, tools, \nmanuals and test \ninstruments is \noverseen in \naccordance with work \nrequirements. \n1.3 Work assigning and \nscheduling are done \nfollowing job \nrequirements and \nwork instructions. \n1.4 Personal Protective \nEquipment (PPEs) \nare prepared following \nworkplace procedures \nand Occupational \nSafety and Health \nStandards (OSHS) \n1.5 Where necessary, \nequipment history \n/documentation is \nconsulted prior to site \nvisit \n1.6 Workplace \ndocumentation is \nprepared according to \nworkplace procedures \n1.1 Knowledge, Theory, \nPractices and Systems \nOperations \n1.1 Identification of service \nrequirements \n1.2 Job requisitions \n1.3 Overseeing for \npreparation \nprocedures \n-audit tools, manual \nand test instruments \n-check integrity of tools \nand test instruments \n1.4 Calendar of activities \n1.5 Preventive \nmaintenance record \n1.5.1 Workplace \ndocumentation \n1.6    Communication \n          Written \ncommunication \n          Verbal workplace \ncommunication \n1.6.1 Safety Practices \n         PPE \n1.6.2 Codes and \nRegulations OSHS \n1.7    Mathematics and \nMensuration \n1.7.1 Basic statistics (Data \ncorrelation, \nAveraging) \n1.7.2 Basic trigonometry \n(calculations of \nangles, surface \ngenerations) \n1.8    Materials, Tools and \nEquipment: Uses, \n1.1 Identifying \nservice \nrequirements \n \n1.2 Analyzing \nscope of works \n \n1.3 Monitoring \npreparation \nprocedures \n \n1.4Interpreting \ncalendar of \nactivities \n \n1.5 Assigning    \nwork  \n \n1.6 Practicing \nworkplace \nsafety  \n \n1.7 Analyzing \nequipment \nhistory / \ndocumentation \n \n1.8 Preparing \nworkplace \ndocumentation \n \n1.9 Practicing \nbasic statistics \nand \ntrigonometry\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \n \n33           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nSpecifications and \nMaintenance \n1.8.1 Tools and \nEquipment, Materials \n Can understand and \nfollow instructional \nmanuals \n Parts and \nfunctions/specificatio\nns and uses of grains \ndryer, quality control \ntools/ instruments \n Where to source \ngood quality supplies \nand materials \n1.9 Maintenance \n1.9.1 Regular upkeep \nof various tools \nand equipment \n1.9.2 Preventive \nmaintenance of \nvarious \nequipment and \ntools \n1.10 Attitude \n1.10.1 Safety and \nhealth \nconsciousness \n1.10.2 Resourcefulness \n1.10.3 Diligence \n1.10.4 Time \nconsciousness \n1.10.5 Cost-\nconsciousness \n1.10.6 Personal \nintegrity in doing \nroutine \nmanagement \npractices \n1.10.7 Perseverance in \nexecuting routine \nworks \n1.10.8 Ability to work \nwith others \nharmoniously\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \n \n \n34         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Diagnose grains \ndrying plant  \nfacility \n2.1 Machine troubles are \nanalyzed using \napplicable diagnostic \ntests and methods. \n2.2 Machinery faults and \nmalfunctions are \nidentified based on \nresults of diagnostic \ntests. \n2.3 Service manuals and \nparts catalogue are \nreferred as necessary \nin regard to repair and \nreplacement according \nto enterprise \nrequirements. \n2.4 Personal Protective \nEquipment (PPEs) are \nworn as per work \nrequirement.  \n2.5 Safety measures are \napplied in accordance \nwith Occupational \nSafety and Health \nStandards (OSHS) \n2.6 Diagnosis findings \nincluding \nrecommendations for \nnecessary repairs or \nadjustments are \nreported according to \nworkplace procedures \n2.1 Knowledge, Theory, \nPractices and Systems \nOperations \n2.1.1 Machine troubles \n- \nDifferent symptoms \nor common \nmachine troubles \n \n2.1.2 Diagnostic tests and \nmethods \n2.1.3 Type of dryer   \n- \nDrying components  \n- \nMachinery faults \nand malfunctions \n2.1.4 Communication \n- \nWritten \ncommunication \n- \nVerbal \ncommunication \n2.1.5 Mathematics and \nMensuration \n2.1.6 Four fundamental \noperations \n2.1.7 Safety \n- \nPPE \n2.18 Code \n- \nPAES \n- \nOSHS  \n2.2 Materials, Tools and \nEquipment: Uses, \nSpecifications and \nMaintenance \n2.2.1 Tools and Equipment \nMaterials \n2.2.2 Attitude \n2.2.3 Safety and health \nconsciousness \n2.2.4 Resourcefulness \n2.2.5 Diligence \n2.2.6 Time consciousness \nCost-consciousness  \n2.2.7 Personal integrity in \ndoing routine \nmanagement \npractices \n2.2.8 Perseverance in \nexecuting routine \nworks \n2.2.9 Ability to work with \nothers harmoniously \n \n2.1 Employing \napplicable \ndiagnostic tests \nand methods \n \n2.2 Analyzing \nsymptoms \n \n2.3 Using service \nmanuals and \nparts \n \n2.4 Developing \nservice \nchecklist \n \n2.5 Practicing \nsafety \nmeasures \n \n2.6 Reporting \nfindings of \ndiagnosis, \nincluding \nrecommendatio\nn for repairs and \nadjustments\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \n \n \n35           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Repair and \nmaintain grain \ndrying facility \nand equipment \n3.1 Personal Protective \nEquipment (PPEs) are \nworn as per work \nrequirement. \n3.2 Work area is secured \naccording to workplace \nprocedures.  \n3.3 Repair and \nreplacement process is \nimplemented \naccording to enterprise \nrequirements, \nmanufacturer's \nspecifications and \nOSHS. \n3.4 Clearing of \nobstructions from \nducting, chutes and \nconveyors are done in \naccordance with \nmanufacturer’s \nmanual. \n3.5 Safety measures are \napplied in accordance \nwith Occupational \nSafety and Health \nStandards (OSHS). \n3.6 Where necessary, \nservice unit is installed \nto minimize downtime \n3.1 Work area  \n3.2 Nomenclature of \nstandard parts  \n3.3 Repair and \nreplacement process \n-Basic fabrication of \ndefective components \n-Greasing of bearing \nfittings \n-Alignment of rotating \nshafts and transmission \ndrive \n3.4 Communication \n3.4.1 Verbal \ncommunication \n3.5 Mathematics and \nMensuration \n3.6 SAFETY \n- \nPPE \n3.7 CODE \n- \nOSHS \n3.1 Using PPE \n3.2 Securing work \narea \n3.3 Implementing \nrepair and \nreplacement \n3.4 Clearing of \nobstructions \nfrom ducting, \nchutes and \nconveyors  \n3.5 Practicing \nOSHS \n3.6 Installing \nservice units \n4. Test run grains \ndrying plant \nfacility \n4.1 Personal Protective \nEquipment (PPEs) are \nworn as per work \nrequirement. \n4.2 Ocular inspection of \nserviced components \nare done according to \napproved checklist. \n4.3 Test run of dryer \ncomponents is carried \nout according to \nworkplace procedures \nand service manual. \n4.4 Zeal of dryer are  \ninspected according to \napproved checklist \n4.5 Operating conditions \nare adjusted based on \nclient’s requirements \n4.1 Functional testing of \ncomponents \n4.2 Operator’s manual \n4.3 PAES \n4.4 OSHS \n4.5 Use of Tools \n4.6 Use of PPE \n4.7 Communication \n- Verbal \n- Hand signals \n \n \n4.1 Observing \nsafety in \nworkplace \n4.2 Observing \nquality standard \nin work checklist \n4.3 Performing test \nrun of dryer \n4.4 Inspecting zeal \nof dryers \n4.5 Familiarity in \noperator’s \nmanual \n4.6 Adjusting \noptimum \noperating \ncondition of \ndryer \ncomponent \n4.7 Interpreting/ \nwriting test run \nreport\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \n \n \n36         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand machine operating \nlimits. \n4.6 Safety measures are \napplied in accordance \nwith Occupational \nSafety and Health \nStandards (OSHS).\n5. Perform post-\nservicing \nactivities \n5.1 Personal Protective \nEquipment (PPEs) are \nworn as per work \nrequirement \n5.2 Machine is shutdown \naccording to operator’s \nmanual. \n5.3 Wastes are disposed \nof in accordance with \nenvironmental \nguidelines. \n5.4 Tools and equipment \nare checked and \nstored according to \nworkplace procedures. \n5.5 Work areas are \ncleaned and \nmaintained according \nto OSHS and \nenterprise \nrequirements. \n5.6 Safety measures are \napplied in accordance \nwith Occupational \nSafety and Health \nStandards (OSHS). \n5.7 Service documentation \nis completed and \nupdated according to \nworkplace procedures. \n5.1 Procedures of shutting \ndown machine \n5.2 Wastes management \n \n5.3 Environmental rules and \nregulations \n5.4 Inspection and storage \nof tools and equipment \n5.5 Maintenance of work \nareas \n5.6 OSHS \n5.7 Service documentation \n5.1 Practicing \nOSHS  \n5.2 Shutting down \nmachines \n \n5.3 Disposing \nwastes \n5.4 Checking and \nstoring tools \nand equipment \n5.5 Cleaning and \nmaintaining \nwork area  \n5.6 Completing \nservice \ndocumentation \n5.7 Accomplishing \nreport checklist \n \n \nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n1. Servicing \nrequirements \n1.1 Repair \n1.2 Replacement \n1.3 Preventive maintenance \n1.4 Installation\n2. Tools, manuals \nand test \ninstruments\nTools, manuals and test instruments may include but not limited to: \n1.1 \nOpen-end wrench \n1.2\nBox wrench\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \n \n \n37           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nVARIABLE \nRANGE \n1.3 \nLevel  \n1.4 \nTape measure \n1.5 \nAdjustable wrench \n1.6 \nLever wrench pliers \n1.7 \nSets of screw driver \n1.8 \nRiveter \n1.9 \nAllen wrench set \n1.10 Clamp ammeter \n1.11 Multimeter \n1.12 Thermometer \n1.13 Anemometer \n1.14 Manometer \n1.15 Tachometer \n1.16 Puller \n1.17 Service manuals \n1.18 Checklist\n3. Personal \nProtective \nEquipment \nPersonal Protective Equipment may include but not limited to: \n3.1 Mask \n3.2 Gloves \n3.3 Goggles \n3.4 Ear muffs \n3.5 Eye shield \n3.6 Coverall\n4. Workplace \ndocumentation \n4.1 Checklist \n4.2 Inspection reports \n4.3 Equipment history \n4.4 PM record and schedule\n5. Diagnostic \nmethods \n5.1 Sensory methods \n- \nVisual check \n- \nSmell  \n- \nSound \n- \nTouch \n5.2 Using test instruments \n- \nTachometer \n- \nCaliper \n- \nMultimeter \n- \nThermometer \n-\nManometer\n6. Machine troubles \n6.1 Unusual noise/sounds \n6.2 Excessive heat \n6.3 Uneven airflow \n6.4 Insufficient drying \n6.5 Uneven grain flow\n7. Machinery faults \nand malfunctions \n7.1 Loose bolts and nuts \n7.2 Misaligned belts and pulleys \n7.3 Worn-out bearing \n7.4 Deformed shafting and keyways \n7.5 Worn-out ducts and spouts  \n7.6 Defective igniter \n7.7 Corroded parts \n7.8 Blown-out fuses and magnetic contactor\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \n \n \n38         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nVARIABLE \nRANGE \n8. Repair and \nreplacement \n8.1 Replacement of missing parts  \n- \nGrease fitting \n- \nBearings \n- \nPulleys \n- \nSet crews \n- \nNuts and bolts \n- \nWirings \n- \nWorn-out bearing \n8.2 Repair defective components: \n- \nLoose bolts and nuts \n- \nMisaligned belts and pulleys \n- \nDeformed shafting and keyways \n- \nWorn-out ducts and spouts  \n- \nDefective igniter \n- \nCorroded parts \n-\nBlown-out fuses and magnetic contactor\n9. Type of dryer \nType of dryer may include: \n9.1 Batch-type \n- \nFlatbed \n- \nRecirculating type \n- \ncolumnar \n9.2 Continuous-flow \n- \nNon-mixing \n- \nMixing/cross-flow  \n \nStandards refers to PNS:PAES 201 Specification for heated-air \nmechanical dryer\n10. Drying components\nDrying components: \n10.1 Bin component may be constructed from: \n- \nmetal sheet \n- \npre-cast concrete \n \n10.2 Heat source may be include: \n- \nconventional fuel-burning furnace \n- \nbiomass fuel furnace \n \n10.3 Ancillary equipment may include: \n- \ngrain elevator \n- \ngrain conveyor \n- \nchute \n- \nprimary air blower \n- \nsecondary air blower \n- \ngrain spreader \n- \nmoisture sensor \n- \ntemperature sensor \n- \ndust collection equipment \n- \npre-cleaner \n- \nfuel gage \n- \ncontrol panel\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \n \n \n39           TR Drying and Milling Plant Servicing NC III             Promulgated February 3, 2017 \n         \nVARIABLE \nRANGE \n10.4 Power transmission component may include: \n- \ngear-drive \n- \nbelt-drive \n- \nchain-drive \n- \nshafting \n- \nbearings \n-\npulleys\n11 Missing parts \nMissing parts may include: \n11.1 \nGrease fitting \n11.2 \nBearings \n11.3 \nPulleys \n11.4 \nSet crews \n11.5 \nNuts and bolts \n11.6\nWirings\n12 Defective \nDefective refers as a result of: \n12.1 \nRusting  \n12.2 \nCracking  \n12.3 \nCramping \n12.4\nTearing\n13 Rotating shafts \nRotating shafts may include: \n13.1 Pulley shaft \n13.2 Eccentric shaft \n13.3\nAuger shaft\n14 Operating \nconditions \nOperating conditions may include but not limited to: \n14.1 Chute opening \n14.2 Speed of adjustable pulley \n14.3 Length of stroke of oscillator \n14.4 Feeding of fuel \n14.5 Speed of engine \n14.6 Speed of blower \n14.7\nBelt drive tension\n15 \nZeal \nZeal may include: \n15.1 Less vibration \n15.2 Less noise \n15.3 Balance of shaft \n16 \nWaste \nWaste may include but not limited to: \n16.1 Paint container \n16.2 Paint brush \n16.3 Sanding paper \n16.4 Grinding wheel \n16.5 Debris \n16.6 Replaced dryer components\n17 \nService \ndocumentation \n17.1 After sales record \n17.2 Preventive maintenance record  \n17.3 Service report\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \n \n \n40         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared tools, manuals and test instruments \n1.2 Checked dryer \n1.3 Repaired defective fabricated components \n1.4 Replaced missing standard parts \n1.5 Test run dryer \n1.6 Performed post-servicing activities \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Dryer processing plant \n2.2. Tools/ instruments/ equipment \n2.3. Writing device \n2.4. Supplies \n2.5. Logbooks \n2.6. References (service manual/ catalogue, protocols, OHSP and \nGAP manuals) \n2.7. Production guide \n3. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1. Direct Observation \n3.2. Demonstration \n3.3. Oral interview and/or written test \n4. Context of \nAssessment\n4.1 Competency may be assessed individually in the actual workplace \nor through accredited institution\n\n--- PDF PAGE 44 ---\n",
