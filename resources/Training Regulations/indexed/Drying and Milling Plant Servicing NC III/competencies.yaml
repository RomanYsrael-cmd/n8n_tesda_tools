        "source_text": "AFF321201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto perform safety measures effectively and efficiently. It\nincludes identifying areas, tools, materials, time and place in\nperforming safety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nareas of\nconcern for\nsafety\nmeasures\n1.1\nWork tasks are\nidentified in line with\nfarm operations\n1.2\nPlace for safety\nmeasures are\ndetermined in line\nwith farm operations\n1.3\nTime for safety\nmeasures are\ndetermined in line\nwith farm operations\n1.4\nAppropriate tools,\nmaterials and\noutfits are prepared\nin line with job\nrequirements\n1.1 Different work\ntasks in farm\noperations\n1.2 Place and time\nfor\nimplementation\nof safety\nmeasures\n1.3 Different hazards\nin the workplace\n1.4 Types of tools,\nmaterials and\noutfits\n1.5 Preparation of\ntools, materials\nand outfits\n\n1.1 Identifying\nwork tasks\nin farm\noperations\n1.2 Determinin\ng place and\ntime for\nimplementa\ntion of\nsafety\nmeasures\n1.3 Reading\nlabels,\nmanuals\nand other\nbasic\nsafety\ninformation\n1.4 Identifying\neffective/fu\nnctional\ntools,\nmaterials\nand outfit\n1.5 Preparing\ntools,\nmaterials\nand outfits\n1.6 Discarding\ndefective\ntools, and\nmaterials\n2 Apply\nappropriate\nsafety\nmeasures\n2.1 Tools and materials are\nused according to\nspecifications and\nprocedures\n2.1 Uses and\nfunctions of tools\n2.2 Outfits and how\nto wear it.\n2.3 Expiration/shelf\nlife of materials\n2.1 Using\ntools and\nmaterials\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n\n24 TR Drying and Milling Plant Servicing NCIII Promulgated February 3, 2017\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.2 Outfits are worn\naccording to farm\nrequirements\n2.3 Effectivity/shelf\nlife/expiration of\nmaterials are strictly\nobserved\n2.4 Emergency\nprocedures are known\nand followed to ensure\na safe work\nrequirement\n2.5 Hazards in the\nworkplace are\nidentified and reported\nin line with farm\nguidelines\n2.4 Proper disposal\nof expired\nmaterials\n2.5 Environmental\nrules and\nregulations\n2.6 Emergency\nprocedures\n2.7 Hazards\nidentification and\nreporting\n2.8 Communication\nskills\n2.9 OSHS\n\nin the\nworkplace\n2.2 Wearing of\noutfits\n2.3 Observing\nexpiration/\nshelf life of\nmaterials\n2.4 Disposing\nof expired\nmaterials\n2.5 Following\nemergenc\ny\nprocedure\ns\n2.6 Identifying\nand\nreporting\nof hazards\nin\nworkplace\narea.\n3 Safe keep\n/dispose tools,\nmaterials and\noutfit\n3.1 Used tools and outfit\nare cleaned after use\nand stored in\ndesignated areas\n3.2 Unused materials are\nproperly labeled and\nstored according to\nmanufacturers\nrecommendation and\nfarm requirements\n3.3 Waste materials are\ndisposed according to\nmanufacturers,\ngovernment and farm\nrequirements\n3.1 Procedures of\ncleaning used\ntools and outfits\n3.2 Label and\nstorage unused\nmaterials\n3.3 Disposal of\nwastes materials\n3.4 Manufacturers\nrecommendation\non keeping\nmaterials\n3.5 Environmental\nrules and\nregulations\n3.1 Cleaning\nused tools\nand outfit\n3.2 Labelling\nand storing\nunused\nmaterials\n3.3 Disposing\nwaste\nmaterials\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\n25 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the subsectors:\n1.1 Crop Production\n1.2 Post-harvest\n1.3 Agri-marketing\n1.4 Farm Equipment\n2. Place\n2.1 Stock room/storage areas/warehouse\n2.2 Field/farm/orchard\n3. Time\n3.1 Fertilizer and pesticides application\n3.2 Feed mixing and feeding\n3.3 Harvesting and hauling\n4.\nTools, materials and\noutfits\n4.1 Tools\n4.1.1 Wrenches\n4.1.2 Screw driver\n4.1.3 Pliers\n4.2 Outfit\n4.2.1 Masks\n4.2.2 Gloves\n4.