ents may include: \n \n4.1 Huller component may include: \n Rubber-roll \n Under-runner \n Fluted roll \n centrifugal \n \n4.2 Whitener component may include: \n friction whitener \n abrasive whitener \n \n4.3 Polisher component may include: \n mist polisher \n friction polisher \nabrasive polisher\n5. Ancillary equipment \nAncillary equipment may include:\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \n \n \n54         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017 \nVARIABLE \nRANGE \n5.1 grain elevator \n5.2 grain conveyor \n5.3 chute \n5.4 rice hull blower \n5.5 paddy separator \n5.6 de-stoner \n5.7 magnetic separator \n5.8 pre-cleaner \n5.9 dust collection equipment \n5.10 rice grader \n5.11 auto weigher \n5.12 Electric motor \n5.13 control panel\n6. Power transmission \nPower transmission component may include: \n6.1 gear-drive \n6.2 belt-drive \n6.3 chain-drive \n6.4 shafting \n6.5 bearings \n6.6\npulleys \n7. Missing parts \nMissing parts may include: \n7.1 Grease fitting \n7.2 Bearings \n7.3 Pulleys \n7.4 Set crews \n7.5 Nuts and bolts \n7.6\nWirings\n8. Defective \nDefective refers to as a result of: \n8.1 Rusting  \n8.2\nClogging \n9. Rotating shafts \nRotating shafts may include: \n9.1 Pulley shaft \n9.2 Eccentric shaft \n9.3\nAuger shaft\n10. Debris \nDebris may include: \n10.1 Lodged grains \n10.2 Plastic twine \n10.3 Hardened dust \n10.4 Sprouted grains \n10.5 Stones and pebbles\n11. Operator’s manual \nOperator’s manual refers to the operating manual and \nsequential operation of the rice mill components.\n12. Operating conditions \nOperating conditions may include but not limited to: \n12.1 Clearance of huller \n12.2 Tension of whitener \n12.3 Tension of polisher \n12.4 Chute opening \n12.5\nSpeed of adjustable pulley\n\n--- PDF PAGE 58 ---\n55           TR Drying and Milling Plant Servicing NC III    Promulgated February 3, 2017 \n         \nVARIABLE \nRANGE \n12.6 Length of stroke of oscillator \n12.7 Tension of transmission belts \n12.8 Speed of engine \n12.9 Speed of blower \n12.10 Belt drive tension\n13. Zeal \nZeal may include: \n13.1 Less vibration \n13.2 Less noise \n13.3\nBalance of shaft\n14. Waste \nWaste may include but not limited to: \n14.1 Paint container \n14.2 Paint brush \n14.3 Sanding paper \n14.4 Grinding wheel \n14.5 Debris \n14.6 Replaced rice mill components\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08 \n \n \n56         TR Drying and Milling Plant Servicing NCIII          Promulgated February 3, 2017"
