  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification OF DRYING AND MILLING PLANT\nSERVICING NC III, the candidate must demonstrate competence in the\noperation of any of the two (2) groups of competencies as listed below.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\nDrying and Milling Plant Servicing NCIII\n• Service Grain Drying Plant Facilities\n• Service Rice Milling Plant Facility\n\nDrying and Milling Plant Servicing NCIII\n• Service Grain Drying Plant Facilities\n• Service Corn Milling Plant Facility\n\n4.1.2 Certificates of Competency (COCs) shall be issued to candidates who have been\nassessed as competent in any of the following COCs (COC 1, COC 2, COC3)\n\nCOC 1: Service Grain Drying Plant Facilities\nCOC2 : Service Rice Milling Plant Facility\nCOC3 : Service Corn Milling Plant Facility\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, work or life experiences may\napply for recognition in a particular qualification through competency\nassessment.\n\n4.1.5 The following are qualified to apply for assessment:\n\n4.1.5.1\nGraduating students/trainees of WTR-registered programs, graduates\nof NTR programs or graduates of formal/non-formal/informal including\nenterprise-based trainings related to drying and milling plant servicing\nindustry\n4.1.5.2\nIndustry workers in drying and milling plant servicing\n\n--- PDF PAGE 103 ---\nTR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\n 104\n4.1.6 Conduct of assessment and issuance of certificates shall follow the procedures\nmanual and implementing guidelines developed for the purpose.\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)”.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are authorized\nby TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n4.2.3.1\nQualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) in Drying and\nMilling Plant Servicing NC III\n• Have at least two (2) years relevant industry experience for the last five\n(5) years\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\nFor Industry-Assessor\n• Holder of National Certificate in Drying and Milling Plant Servicing NC III\n• Holder of Certificate of Competency (COC) in Conduct Competency\nAssessment under the Trainers Methodology Level I (TM I)\n• Have at least two (2) years relevant industry experience for the last five\n(5) years\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\n--- PDF PAGE 104 ---\n105 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\n"
