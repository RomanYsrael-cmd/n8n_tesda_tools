  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification OF DRYING AND MILLING PLANT\nSERVICING NC III, the candidate must demonstrate competence in the\noperation of any of the two (2) groups of competencies as listed below.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\nDrying and Milling Plant Servicing NCIII\n• Service Grain Drying Plant Facilities\n• Service Rice Milling Plant Facility\n\nDrying and Milling Plant Servicing NCIII\n• Service Grain Drying Plant Facilities\n• Service Corn Milling Plant Facility\n\n4.1.2 Certificates of Competency (COCs) shall be issued to candidates who have been\nassessed as competent in any of the following COCs (COC 1, COC 2, COC3)\n\nCOC 1: Service Grain Drying Plant Facilities\nCOC2 : Service Rice Milling Plant Facility\nCOC3 : Service Corn Milling Plant Facility\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, work or life experiences may\napply for recognition in a particular qualification through competency\nassessment.\n\n4.1.5 The following are qualified to apply for assessment:\n\n4.1.5.1\nGraduating students/trainees of WTR-registered programs, graduates\nof NTR programs or graduates of formal/non-formal/informal including\nenterprise-based trainings related to drying and milling plant servicing\nindustry\n4.1.5.2\nIndustry workers in drying and milling plant servicing\n\n--- PDF PAGE 103 ---\nTR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\n 104\n4.1.6 Conduct of assessment and issuance of certificates shall follow the procedures\nmanual and implementing guidelines developed for the purpose.\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)”.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are authorized\nby TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n4.2.3.1\nQualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) in Drying and\nMilling Plant Servicing NC III\n• Have at least two (2) years relevant industry experience for the last five\n(5) years\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\nFor Industry-Assessor\n• Holder of National Certificate in Drying and Milling Plant Servicing NC III\n• Holder of Certificate of Competency (COC) in Conduct Competency\nAssessment under the Trainers Methodology Level I (TM I)\n• Have at least two (2) years relevant industry experience for the last five\n(5) years\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\n--- PDF PAGE 104 ---\n105 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\nCOMPETENCY MAP FOR AGRICULTURE, FORESTY AND FISHERY SECTOR\n\nCORE UNITS OF COMPETENCY\n\nCOMMON UNITS OF COMPETENCY\n\nApply safety\nmeasures in farm\noperations\n\nUse farm tools and\nequipment\n\nPerform estimation and\ncalculations\n\nBASIC UNITS OF COMPETENCY\n\nLead workplace\ncommunication\n\nLead small teams\n\nDevelop and practice\nnegotiation skills\n\nSolve problems related\nto work activities\n\nUse mathematical\nconcepts and techniques\n\nUse relevant\ntechnologies\n\nService grains\ndrying plant\nfacilities\n\nService rice milling\nplant facility\n\n Service corn\nmilling plant facility\n\n--- PDF PAGE 105 ---\nTR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\n 106\nDEFINITION OF TERMS\n\nBlower – a mechanical device that conveys air producing a stream of moving mass of drying air.\n\nDryer Machinery – machinery device powered either by electric motor or internal combustion\nengine used to lower down or remove available water from the grains through\nevaporation by the application of heated air.\n\nEngine – mechanical device that converts heat energy produced by combustion of fuel into\nmechanical energy.\n\nRice Mill Machinery – machinery device to process conversion of paddy into rice which involves\nthe removal of husk and bran to produce milled rice.\n\nBiomass Furnace – an ancillary equipment that produce heat by burning agricultural waste.\n\nCorn Mill Machine – a machinery device to process conversion of corn kernel into corn grits which\ninvolves the removal of cutaneous pericarp and germ and further reduce the\nsize to produce required grit size.\n\nGrain Elevator – an ancillary machinery equipment that conveys grains by moving a plurality of\nscoops or cups in a vertical motion.\n\nScrew Conveyor – an ancillary machinery equipment that conveys grains by rotating motion in a\nseries of plights forming an auger.\n\nDust Collection System – an ancillary machinery equipment composed of a centrifugal blower\nacting in suction whereby dust and light contaminants suspended\nnear the grains are removed and conveyed through a series of pipes\naway from the clean grain.\n\nGrain Cleaner – an ancillary machinery equipment that removes empty seed, chaffs and other\nimpurities other than the grain.\n\nDe-stoner – an ancillary machinery equipment that removes small stones, pebbles and similar\nmaterials other than grains in an oscillating motion.\n\nTemperature sensor – an ancillary equipment used in determining the temperature level of the\ndrying air in a mechanical dryer.\n\nCastables – are heat-resistant lining material made from refractory construction material suitable\nfor biomass furnace.\n\nFire Bricks – are heat-resisting material used as lining material for biomass furnace.\n\nAncillary equipment – are components that either conveys, clean, sort, classify grains. Such\nequipment is optional but in most cases, are present to produce higher\nquality output product.\n\nRefractory cement – is a binding element similar to cement but primarily used in high temperature\nmaterial such as biomass furnace.\n\nStandards refers to PNS: PAES 206 Specification for rice mill\n\n--- PDF PAGE 106 ---\n107 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthis Training Regulation.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nENGR. REYNALDO P. GREGORIO\nTechnical Expert\nPhilippine Center for Postharvest Development\nand Mechanization\nScience City of Muñoz, Nueva Ecija\nENGR. GEORGE Q. CANAPI\nTechnical Expert\nAgricultural Machinery Manufacturers and\nDistributors Association (AMMDA), Inc.\nMakati City, Metro Manila\nENGR. EDEN GAGELONIA\nTechnical Expert\nPhilippine Rice Research Institute\nScience City of Muñoz, Nueva Ecija\nENGR. AREODEAR RICO\nTechnical Expert\nPhilippine Society of Agricultural Engineers\nMetro Manila\n\nTHE PARTICIPANTS OF NATIONAL VALIDATION\n\nMR. LOWIDEL D. SALAZAR\nMechanic II\nPhilippine Sino-Center for Agricultural\nTechnology (PHILSCAT)\nCLSU-Bakal I Talavera,\nScience City of Muñoz, Nueva Ecija\nMR. RODOLFO R. ANTONIO\nService Technician (Welder Machinist)\nPhilippine Sino-Center for Agricultural\nTechnology (PHILSCAT)\nCLSU, Science City of Muñoz, Nueva Ecija\nMR. JONATHAN N. LOMBOY\nMaintenance Technician\nPhilippine Sino-Center for Agricultural\nTechnology (PHILSCAT)\nCLSU, Science City of Muñoz, Nueva Ecija\nMR. MARIO A. MADLAO\nService Technician (Electrician)\nPhilippine Sino-Center for Agricultural\nTechnology (PHILSCAT)\nCLSU, Science City of Muñoz, Nueva Ecija\nMR. JONATHAN B. MALLARE\nMachine Operator\nPhilippine Sino-Center for Agricultural\nTechnology (PHILSCAT)\nCLSU, Science City of Muñoz, Nueva Ecija\nMR. JOSE F. ASARCOM\nMachine Operator\nPhilippine Sino-Center for Agricultural\nTechnology (PHILSCAT)\nCLSU, Science City of Muñoz, Nueva Ecija\nMR. FROILAN C. VALIENTE\nMaintenance Technician\nPhilippine Sino-Center for Agricultural\nTechnology (PHILSCAT)\nCLSU, Science City of Muñoz, Nueva Ecija\nENGR. JEANNEFER S. ATONG\nAssociate Professor V\nMindanao State University\nMaguindanao\n\nENGR. SYLVESTER A. BADUA\nInstructor II\nCentral Luzon State University\nMuñoz, Nueva Ecija\nENGR. JEFFREY M. BAGASBAS\nInstructor\nCARAGA State University\n\n--- PDF PAGE 107 ---\nTR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017\n\n 108\nENGR. JANICE P. HERMOSO\nMDDC Coordinator\nMDDC Foundation, Inc.\nOrmoc-Kananga\nENGR. PATRICIO R. MACAMOS, JR.\nScience Research Specialist\nSugar Regulatory Administration\nManila\nENGR. MARVIN J. MANALANG\nScience Research Specialist\nPhilippine Rice Research Institute\nScience City of Muñoz, Nueva Ecija\nENGR. MARK KEYLORD S. ONAL\nAssociate Professor\nUniversity of the Philippines\nLos Baños, Laguna\nENGR. SEVERINO B. SALLERA, JR.\nAssociate Professor III\nBohol Island State University\nBohol\nENGR. RAQUEL D. SANTIAGO\nAssociate Professor IV\nMindanao State University\nMaguindanao\nENGR. PEDRO A. URRIZA\nAssociate Professor\nLaguna State Polytechnic University\nSiniloan, Laguna\n\nThe Members of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQualifications and Standards Office (QSO)\n\nTESDA – QSO Technical Facilitators\n\nCompetency Standards Development Division\nMS. BERNADETTE N. SERVAZ- AUDIJE\nMS. CHERRY L. TORALDE\nMS. MELCHRIS A. ATIS\nCompetency Programs and Standards Development Division\nMS. MERCEDES E. JAVIER\nMS. FORTUNATA L. BACO\n\n• National Institute for Technical Education and Skills development (NITESD)\n\nTESDA-NITESD Technical Facilitator\n\nCurriculum and Training Aids Development Division\nMR. ROSENDO R. RAFAEL\n\n--- PDF PAGE 108 ---\n109 TR Drying and Mill