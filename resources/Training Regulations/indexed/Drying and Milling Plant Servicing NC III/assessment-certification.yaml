 --- TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017 108 ENGR. JANICE P. HERMOSO MDDC Coordinator MDDC Foundation, Inc. Ormoc-Kananga ENGR. PATRICIO R. MACAMOS, JR. Science Research Specialist Sugar Regulatory Administration Manila ENGR. MARVIN J. MANALANG Science Research Specialist Philippine Rice Research Institute Science City of Muñoz, Nueva Ecija ENGR. MARK KEYLORD S. ONAL Associate Professor University of the Philippines Los Baños, Laguna ENGR. SEVERINO B. SALLERA, JR. Associate Professor III Bohol Island State University Bohol ENGR. RAQUEL D. SANTIAGO Associate Professor IV Mindanao State University Maguindanao ENGR. PEDRO A. URRIZA Associate Professor Laguna State Polytechnic University Siniloan, Laguna The Members of the TESDA Board and Secretariat The MANAGEMENT and STAFF of the TESDA Secretariat • Qualifications and Standards Office (QSO) TESDA – QSO Technical Facilitators Competency Standards Development Division MS. BERNADETTE N. SERVAZ- AUDIJE MS. CHERRY L. TORALDE MS. MELCHRIS A. ATIS Competency Programs and Standards Development Division MS. MERCEDES E. JAVIER MS. FORTUNATA L. BACO • National Institute for Technical Education and Skills development (NITESD) TESDA-NITESD Technical Facilitator Curriculum and Training Aids Development Division MR. ROSENDO R. RAFAEL --- PDF PAGE 108 --- 109 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017 Training Regulation are available in both printed and electronic copies For more information, please contact: TECHNICAL EDUCATION AND SKILLS DEVELOPMENT AUTHORITY (TESDA) Telephone Nos.:817-4076 to 82 loc. 163 / 164 Tele Fax No.:818-7728 or visit our website: www.tesda.gov.ph"
