      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification OF DRYING AND MILLING PLANT SERVICING NC III, the candidate must demonstrate competence in the operation of any of the two (2) groups of competencies as listed below. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. Drying and Milling Plant Servicing NCIII • Service Grain Drying Plant Facilities • Service Rice Milling Plant Facility Drying and Milling Plant Servicing NCIII • Service Grain Drying Plant Facilities • Service Corn Milling Plant Facility 4.1.2 Certificates of Competency (COCs) shall be issued to candidates who have been assessed as competent in any of the following COCs (COC 1, COC 2, COC3) COC 1: Service Grain Drying Plant Facilities COC2 : Service Rice Milling Plant Facility COC3 : Service Corn Milling Plant Facility 4.1.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.5 The following are qualified to apply for assessment: 4.1.5.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non-formal/informal including enterprise-based trainings related to drying and milling plant servicing industry 4.1.5.2 Industry workers in drying and milling plant servicing"
