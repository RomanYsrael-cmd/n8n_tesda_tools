      "text": "3.1 Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level I (NTTC) in Drying and Milling Plant Servicing NC III • Have at least two (2) years relevant industry experience for the last five (5) years • Have assisted in the actual conduct of assessment to at least two (2) candidates. For Industry-Assessor • Holder of National Certificate in Drying and Milling Plant Servicing NC III • Holder of Certificate of Competency (COC) in Conduct Competency Assessment under the Trainers Methodology Level I (TM I) • Have at least two (2) years relevant industry experience for the last five (5) years • Have assisted in the actual conduct of assessment to at least two (2) candidates. --- PDF PAGE 104 --- 105 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017 COMPETENCY MAP FOR AGRICULTURE, FORESTY AND FISHERY SECTOR Apply safety measures in farm operations Use farm tools and equipment Perform estimation and calculations Lead workplace communication Lead small teams Develop and practice negotiation skills Solve problems related to work activities Use mathematical concepts and techniques Use relevant technologies Service grains drying plant facilities Service rice milling plant facility Service corn milling plant facility --- PDF PAGE 105 --- TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017 106 Blower – a mechanical device that conveys air producing a stream of moving mass of drying air. Dryer Machinery – machinery device powered either by electric motor or internal combustion engine used to lower down or remove available water from the grains through evaporation by the application of heated air. Engine – mechanical device that converts heat energy produced by combustion of fuel into mechanical energy. Rice Mill Machinery – machinery device to process conversion of paddy into rice which involves the removal of husk and bran to produce milled rice. Biomass Furnace – an ancillary equipment that produce heat by burning agricultural waste. Corn Mill Machine – a machinery device to process conversion of corn kernel into corn grits which involves the removal of cutaneous pericarp and germ and further reduce the size to produce required grit size. Grain Elevator – an ancillary machinery equipment that conveys grains by moving a plurality of scoops or cups in a vertical motion. Screw Conveyor – an ancillary machinery equipment that conveys grains by rotating motion in a series of plights forming an auger. Dust Collection System – an ancillary machinery equipment composed of a centrifugal blower acting in suction whereby dust and light contaminants suspended near the grains are removed and conveyed through a series of pipes away from the clean grain. Grain Cleaner – an ancillary machinery equipment that removes empty seed, chaffs and other impurities other than the grain. De-stoner – an ancillary machinery equipment that removes small stones, pebbles and similar materials other than grains in an oscillating motion. Temperature sensor – an ancillary equipment used in determining the temperature level of the drying air in a mechanical dryer. Castables – are heat-resistant lining material made from refractory construction material suitable for biomass furnace. Fire Bricks – are heat-resisting material used as lining material for biomass furnace. Ancillary equipment – are components that either conveys, clean, sort, classify grains. Such equipment is optional but in most cases, are present to produce higher quality output product. Refractory cement – is a binding element similar to cement but primarily used in high temperature material such as biomass furnace. Standards refers to PNS: PAES 206 Specification for rice mill --- PDF PAGE 106 --- 107 TR Drying and Milling Plant Servicing NC III Promulgated February 3, 2017 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many repre