ustrations and other negative emotions and\nunpleasant situations in the workplace\n• Discussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n4.2. Develop\nreflective\npractice\n• Enumerate strategies to improve one’s attitude\nin the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as self-assessment\nstrategy\n• Develop reflective practice through realization\nof limitations, likes/ dislikes; through showing\nof self-confidence\n• Demonstrate self-acceptance and being able to\naccept challenges\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n4.3. Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-regulation\nbased on Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Demonstration\nor simulation\nwith oral\nquestioning\n1 hour\n\n--- PDF PAGE 83 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 79\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nStephen Covey, transactional analysis, psycho-\nspiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility, adaptability,\netc.\n• Determine strengths and weaknesses\n• Brainstorming\n• Demonstration\n• Role-playing\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n5. Contribute to\nworkplace\ninnovation\n5.1. Identify\nopportunities to\ndo things be