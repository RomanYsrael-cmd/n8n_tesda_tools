    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to training providers. This will equip them with needed knowledge and skills in\ndeveloping their own curricula based on the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: LIGHTING FOR LIVE PERFORMANCES NC II\n\nNominal Training Duration: 37 Hours (Basic)\n\n88 Hours (Common)\n 70 Hours (Core)\n\n 195 Hours\n\n 80 Hours - Supervised Industry Learning (SIL)\n\n 275 HOURS - Total\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in preparing, setting-up,\noperating and dismounting lighting equipment. This includes classroom learning\nactivities and practical work in actual work site or simulation area.\n\nTo complete the course, all units prescribed for this qualification must be\nachieved.\n\n--- PDF PAGE 79 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 75\nBASIC COMPETENCIES\n(37 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n• Describe Organizational policies\n• Read:\no Effective communication\no Written communication\no Communication procedures and systems\n• Identify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n• Prepare different Types of question\n• Gather different sources of information\n• Apply storage system in establishing workplace\ninformation\n• Demonstrate Telephone courtesy\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n• Read:\no Written notices and instructions\no Workplace interactions and procedures\n• Read instructions on work related\nforms/documents\n• Perform workplace duties scenario following\nworkplace instructions\n• Group\ndiscussion\n• Lecture\n• Demonstration\n\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n1.3. Complete\nrelevant work\nrelated\ndocuments\n• Describe Communication procedures and\nsystems\n• Read\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 hours\n\n--- PDF PAGE 80 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 76\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Read instructions on work related\nforms/documents\n• Practice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of addition,\nsubtraction, division and multiplication\n• Demonstrate office activities in:\no workplace meetings and discussions\nscenario\n• Perform workplace duties scenario following\nsimple written notices\n• Follow simple spoken language\n• Identify the different Non-verbal communication\n• Demonstrate ability to relate to people of social\nrange in the workplace\n• Gather and provide information in response to\nworkplace requirements\n• Complete work related documents\n\n2. Work in a team\nenvironment\n2.1. Describe team\nrole and scope\n• Discussion on the team roles and scope\n• Participate in the discussion\