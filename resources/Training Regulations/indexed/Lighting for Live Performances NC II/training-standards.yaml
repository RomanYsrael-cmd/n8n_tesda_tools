eads\n25 units\nSafety belt / harness\n25 units\nHard Hats / helmet\n25 pairs\nSafety Gloves\n\nMATERIALS\nQTY\nDESCRIPTION\n25 pcs\n1” Masking Tape\n25 pcs\n2” Masking Tape\n\n--- PDF PAGE 101 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 97\n25 pcs\nElectrical Tape, (standard)\n2 rolls\n#12 Gauge Flat Cord (Black)\n2 rolls\n#14 Gauge Flat Cord (White)\n100 pcs\n3 pronged, Twistlock 230 V 15 amp male rubber plug\n200 pcs\n3 pronged, Twistlock 230 V 15 amp female rubber plug\n5 sheets\nColor Filters, Lee Filters 201 (C.T. Blue)\n5 sheets\nColor Filters, Lee Filters 139 (Primary Green)\n5 sheets\nColor Filters, Lee Filters 106 (Primary Red)\n5 sheets\nColor Filters, Lee Filters 118 (Primary Blue)\n2 rolls\nDMX Cable\n50 pcs\n3-pin XLR Male Plug\n50 pcs\n3-pin XLR Female Plug\n4pcs\nSchedule 20 ½“ inside diameter 20 feet pipe\n10 pcs\n½ feet swivel clamp\n1 pc\n50 Meters No. 2 Gauge Royal Cord 3 wire\n2 pc\nFemale Socapex Main Line Connector\n2 pc\nMale Socapex Main Line Connector\n1 pc\n250 amps 3 phase industrial circuit breaker\n\n--- PDF PAGE 102 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 98\n3.5 TRAINING FACILITIES\n\nThe Lighting for Live Performance Facility must be of concrete structure and designed\nfor live performances. The power requirement has to be at least 250 amp 3 phase. Based\non class size of 25 students / trainees the space requirements for the teaching / learning\nand curriculum areas are as follows.\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN S.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\nStudent/Trainee Performance Space\n(S/TPS) (with Air-condition)\n10 X 20 with\n7 M ceiling\nhigh\n200\n200\nLearning Resource Center (LRC) (Air-\ncondition)\n8 X 5\n45\n45\nStorage of equipment, tools and supplies\nWith pipes for hanging fixtures (Air-\ncondition)\n4 x 6\n24\n24\nCirculation Area\n\n21\n21\nSeparate Restrooms for Male and\nFemale Trainees/Students\n2 X 5\n10\n10\nTotal Workshop Area\n\n296 sq. m.\n\nNOTE: Training Center may enter into Memorandum of Agreement (MOA) with industry\n for use of facilities and equipment\n\n 3.6 TRAINER’S QUALIFICATION\n\n• Must be a holder of National TVET Trainers Certificate (NTTC) Level 1 in Lighting for\nLive Performances NC II\n• Must possess good communication skills\n• Must be a current lighting industry practitioner for the last three (3) years\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 103 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 99"
