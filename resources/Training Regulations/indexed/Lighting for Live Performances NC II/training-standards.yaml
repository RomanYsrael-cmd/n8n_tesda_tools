    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for LIGHTING FOR LIVE PERFORMANCES NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to training providers. This will equip them with needed knowledge and skills in\ndeveloping their own curricula based on the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: LIGHTING FOR LIVE PERFORMANCES NC II\n\nNominal Training Duration: 37 Hours (Basic)\n\n88 Hours (Common)\n 70 Hours (Core)\n\n 195 Hours\n\n 80 Hours - Supervised Industry Learning (SIL)\n\n 275 HOURS - Total\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in preparing, setting-up,\noperating and dismounting lighting equipment. This includes classroom learning\nactivities and practical work in actual work site or simulation area.\n\nTo complete the course, all units prescribed for this qualification must be\nachieved.\n\n--- PDF PAGE 79 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 75\nBASIC COMPETENCIES\n(37 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participa