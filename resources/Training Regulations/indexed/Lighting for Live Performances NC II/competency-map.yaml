  "source_text": "SECTION 1 LIGHTING FOR LIVE PERFORMANCES NC II QUALIFICATION\n\nThe LIGHTING FOR LIVE PERFORMANCES NC II qualification consists of\ncompetencies that a person must achieve to prepare, set up, operate and dismount lighting\nequipment.\n\nThis Qualification is packaged from the competency map of CREATIVE Sector as\nshown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the\nworkplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCRE265201\nDevelop and update industry knowledge\nCRE265202\nDevelop creative thinking, artistic skills and cultural awareness\nCRE265203\nObserve procedures, specifications and manuals of instructions\nCRE265204\nOperate equipment\nCRE265205\nManage own performance\nCRE265206\nMaintain safe, clean and efficient work environment\nCRE265207\nProvide and maintain effective client relations\n\nCODE NO.\nCORE COMPETENCIES\nCRE343301\nPrepare lighting equipment, tools and supplies\nCRE343302\nSet-up lighting equipment according to the lighting plan\nCRE343303\nOperate and monitor the lighting system\nCRE343304\nDismount, maintain and store lighting equipment\n\n--- PDF PAGE 6 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 2\n\nA person who has achieved this Qualification is competent to be a/an:\n\n❑ Lighting Technician\n❑ Lighting Operator\n❑ Lights Crew\n❑ Lighting Electrician\n\n--- PDF PAGE 7 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 3"
