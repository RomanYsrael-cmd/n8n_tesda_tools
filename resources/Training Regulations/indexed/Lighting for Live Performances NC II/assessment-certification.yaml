  "source_text": "SECTION 4\n ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through competency\nassessment.\n\n4.1.4 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations: It includes the following:\n\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as identified by industry\n\n--- PDF PAGE 104 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 100\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 105 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 101\nCOMPETENCY MAP\nCREATIVE SECTOR – LIGHTING FOR LIVE PERFORMANCES NC II\n\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with others\nSolve/address routine\nproblems\nEnhance self-\nmanagement\nskills\nSupport\ninnovation\nAccess and maintain\ninformation\nFollow occupational\nsafety and health\npolicies and procedures\nApply\nenvironmental work\nstandards\nAdopt entrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career and life\ndecisions\nContribute to\nworkplace innovation\nPresent relevant\ninformation\nPractice\noccupational safety\nand health policies\nand procedures\nExercise efficient and\neffective sustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small teams\nApply critical thinking\nand problem-solving\ntechniques in the\nworkplace\nWork in a diverse\nenvironment\nPropose methods of\napplying learning and\ninnovation in the\norganization\nUse information\nsystematically\nEvaluate\noccupational\nsafety and health\nwork practices\nEvaluate\nenvironmental\nwork practices\nFacilitate entrepreneurial\nskills for micro-small-\nmedium enterprises\n(MSMEs)\nUtilize specialized\ncommunication skills\nDevelop and lead\nteams\nPerform higher order\nthinking processes\nand apply techniques\nin the workplace\nContribute to the\npractice of social justice\nin the workplace\nManage\ninnovative work\ninstructions\nManage and\nevaluate usage\nof information\nLead in improvement of\nOccupational Safety and\nHealth (OSH) programs,\npolicies and procedures\nLead towards\nimprovement of\nenvironment work\nprograms, policies and\nprocedures\nSustain\nentrepreneurial\nskills\n\n--- PDF PAGE 106 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 102\nCOMMON COMPETENCIES\n\nDevelop and\nupdate industry\nknowledge\nDevelop creative\nthinking, artistic\nskills and cultural\nawareness\nObserve procedures,\nspecifications and\nmanuals of\ninstructions\nOperate\nequipment\nManage own\nperformance\nMaintain clean, safe\nand efficient work\nenvironment\nProvide and maintain\neffective client\nrelations\n\nCORE COMPETENCIES\n\nPrepare lighting\nequipment, tools\nand supplies\nSet-up lighting\nequipment\naccording to the\nlighting plan\nOperate and monitor\nthe lighting system\nDismount,\nmaintain and\nstore lighting\nequipment\n\n--- PDF PAGE 107 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 103\nGLOSSARY OF TERMS\n\n1. Areas\n\nSub-divisions of the total acting area into the sections\nover which independent selective control of light is\nrequired\n\n2. Backlight\n\nLight coming from behind actors or pieces of scenery to\nseparate them from their background\n\n3. Barn Doors\n\nA four-shutter rotatable device used on fresnels to shape\nthe light and reduce scattered light\n\n4. Beam Angle\n\nA term used in photometrics that describes where the\nlight output falls to 50% of the center output\n\n5. Booth (Control Booth) The room in the back of the theatre which contains the\nlighting board and sound system. Control of both sound and light\nduring a show is done from this room.\n\n6. CAD\n\nComputer Aided Design. In lighting design CAD is used\nby a Lighting Designer to create their plot\n\n7. C-clamp\n\nPart of a lighting instrument that allows the instrument to\nbe hung from the grid\n\n8. Channel\n\nA complete control path from the lighting board, through\nthe processing system, to the dimmer rack\n\n9. Cools\n\nA category of gel colors, often used to light an actor‘s\nface. Cool colors are violets, blues, cyans, and greens\n\n10. Computer literate\nIs defined as the knowledge and ability to utilize\ncomputers and related technology efficiently, with a range of skills\ncovering levels from elementary use to computer programming and\nadvanced problem solving.\n\n11. Cue\n\nThe signal that indicates a change of any kind.‖ 31 In the\ncase of lighting cues contain information on how the light from the\nlighting instruments should change\n\n12. Cue Number\n\nThe number assigned to a particular cue\n\n13. Cue Sheet\n\nA plot which details timing and actions against each cue\nnumber.32\n\n14. Cue Stack\n\nA numerical listing of cues from lowest number to highest\nnumber\n\n15. Dead Hang\n\nRefers to hanging a lighting instrument straight down\nfrom the grid. It may or may not be connected to a plug\n16. Diagonal Cutters\nA tool used for cutting zip-ties\n\n--- PDF PAGE 108 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 104\n17. Dimmer\n\nA device which controls the amount of electricity passed\nto a light and therefore the intensity of that light‘s\nbrightness\n\n18. Dimmer Card\n\nIn the Little Theatre, a piece of equipment composed of\ntwo dimmers in the dimmer rack\n\n19. Dimmer Rack\n\nAn assembly of individual electronic dimmers mounted in\na Cabinet\n\n20. Down light\n\nA light focused vertically down\n\n21. Dry Ice\n\nSolid carbon dioxide which sublimates below room\ntemperature to create low lying fog effects\n\n22. Electricians\n\nA Master Electrician‘s lighting crew\n\n23. Ellipsoidal\n A type of lighting instrument that provides a sharp\ndefined area of light\n\n24. Field Angle\n A term used in photometrics that describes the distance\nin degrees to where the beam of light is 10% of the\nintensity of the light at the center of the beam.\n\n25. Fresnel\n\nA type of lighting instrument used to provide general\nwash light\n\n26. Fog\n\nA liquid that when used in a fog machine creates a type\nof smoke that is dence\n\n27. Gel\n\nA color polymer that is placed in front of a light to change\nthe color of the light\n\n28. Gel Frame\n\nA metal rectangular frame used to hold a gel\n\n29. Gobos\n\nA pattern for lights used to project images onto a flat\nsurface\n\n30. Gobo Holders\nA metal frame designed to hold a gobo\n\n31. Haze\n\nThin fog that lingers in the air evenly for light to bounce\noff of and creates visible light beams\n\n32. Houselights\n\nLights that illuminate the theatre so the audience can get\nto their seats. Often will set the mood or tone for a show\n\n33. Iris\n\nAn adjustable circular shutter for an ellipsoidal\n\n--- PDF PAGE 109 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 105\n\n34. Lighting Board The piece of equipment which contains all the tools needed to\ncontrol the lights in the theatre\n\n35. Lighting Designer\nThe person in a production who creates the lighting\ndesign\n\n36. LT Squad Lighting\nThe Little Theatre Squad member who manages lighting\nequipment in the Little Theatre\n\n37. Master Electrician\nThe person in a production who takes the Lighting\nDesigner‘s design and directs the hanging, gelling,\nfocusing, and cabling of instruments needed\n\n38. Output Level\n\nA term used in photometrics that refers to how bright a\nbeam of light is. Photometrics - A method for describing\nthe output of an instrument\n\n39. Plug Box\n\nA box hung in the grid where the cable from a light is\nplugged into\n\n40. Safeties\n\nA cable that is attached to a lighting instrument and the\ngrid to prevent a light from falling\n\n41. Stage Pin\n\nThe type of power cable used in fresnels and ellipsoidals\n\n42. Submaster\n\nA group of channels recorded at proportional levels and\ncontrolled by a slider and a bump button\n\n43. Warms\n\nA category of gel colors, often used to light an actor‘s\nface. Warm colors are purples, magentas, reds, oranges, ambers\nand yellows\n\n44. Wash\n\nLight focused to cover a wide area.35\n\n45. 5-pin XLR cable\nA type of cable that has five pins, often called DMX\ncable\n\n46. 3-pin XLR cable\nA type of cable that has three pins\n\n47. Yoke\n\nThe main support for a light. It connects the light to the\nc-clamp\n\n--- PDF PAGE 110 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 106\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nLIGHTING FOR LIVE PERFORMANCES NC II\nQualification Code: CRELLP219\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nLighting for Live\nPerformances NC II\n2019-68/\nDec 17, 2019\nN/A\n Legend: *Description Types\n-\nDocument Created\n\n--- PDF PAGE 111 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 107\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to thanks\nthe following persons from the industry, academe and government agencies for sacrificing\ntheir time and sharing expertise in the development and validation of these Training\nRegulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMR. ANTONIO C. ESTEBAN JR.\nTechnical Director/Trainer\nAcademy of Production Technology / HESED Training Services\n216 M.H. Del Pilar Street cor. San Agustin Avenue\nPalatiw, Pasig City\n\nMR. ARNELIO B. MANZANO\nSenior Culture and Arts Officer\nExchange Department, Cultural Center of the Philippines\nRoxas Blvd. Pasay City\n\nMR. JOSEPH G. MATHEU\nAssociate Artistic Director, Twin Bill Theater\nProject Manager, HUES N CUES LIGHTS AND SOUNDS\nLighting Director, Eat Bulaga\n31 Hyacinth St., Roxas District\nQuezon City\n\nMR. ROMAN R. CRUZ\nPhilippine Educational Theater Association (PETA)\nCulture and Arts Office\nDe La Salle University\n\nMS. BLANCA I. BUCAO\nDe La Salle University, Asst Prof\nPolytechnic University of the Phil, Asst Prof\nLux Aeterna Events Solutions and Production Inc., Managing Director\n\n--- PDF PAGE 112 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 108\nThe PARTICIPANTS in the Validation of this Training Regulations\n\nNoizden Audio & Lights/DULAANG ELYU\nLouisian Theatre Ensemble/DULAANG ELYU\nKPUB Cebu/Community Theatre\nTechnical Director/Bacolod\nNCDA/UJA Little Theater\nLa Salle University Ozamiz\nMAGIC/Lights & Sounds Provider\nForeRunner Technologies\nLuso Acterna\nKrizauolio\nBLASTER Pro. Audio\nPETA\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Howard Mark N. Plete\n- Evangeline A. Cosep"
