ily accessible\n4.2 Information is updated\nwhen required in\naccordance with company\nrequirements\n4.1 Types of\nmanuals\n4.2 Manual storing\nand maintaining\nprocedures\n4.1 Storing and\nmaintaining\nmanuals\n\n--- PDF PAGE 48 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\n\nMay include:\n1.1\nPrinted References (e.g. Books, Handbooks)\n1.2\nManufacturer's Specification Manual\n1.3\nMaintenance Procedure Manual\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires that the candidate:\n1.1\nIdentified and accessed specification/manuals as per job\nrequirements\n1.2\nInterpreted manuals in accordance with industry\npractices\n1.3\nApplied information in manuals according to the given\ntask\n1.4\nStored manuals in accordance with company\nrequirements\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1\nAll manuals/catalogues relative to creative sector\n\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/observation with oral questioning\n\n4. Context of\nassessment\n\n4.1\nCompetency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 45\nUNIT OF COMPETENCY : OPERATE EQUIPMENT\n\nUNIT CODE\n : CRE265204\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes and values\nneeded to operate related equipment in connection to\nfilm/television/theatre/live performances.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Plan and\nprepare for task\nto be undertaken\n1.1. Requirements of task are\ndetermined\n1.2. Equipment is selected\naccording to task\nassigned and required\noutcome\n1.3. Task is planned to ensure\nOccupational Safety and\nHealth Standards (OSHS)\npractices\n1.1. Pre-production\nplanning\n1.2. Duties and\nresponsibilities\n1.3. Work schedules\n1.4. OSHS principles\nand\nresponsibilities\n\n1.1. Reading skills\nrequired to\ninterpret work\ninstruction\n1.2. Communication\nskills\n\n2. Use equipment\n2.1. Equipment is checked in\naccordance with\nmanufacturer’s\nspecification\n2.2. Test result of desired\ncreative output is\nperformed in accordance\nwith aesthetic vision or job\nrequirements\n2.3. Work is performed\naccording to OSHS\npractices\n2.1. Types and Uses\nof Equipment\n2.2. Computer\nliteracy\n2.3. Related software\n2.4. OSHS principles\nand responsibilities\n\n2.1. Reading skills\nrequired to\ninterpret work\ninstruction\n2.2. Interpreting\nManufacturer’s\nspecifications\n2.3. Checking of\nequipment\nfunctionality\n2.4. Communication\nskills\n3. Maintain\nequipment\n3.1. Systems for cleaning,\nminor maintenance and\nreplacement of\nconsumables are\nimplemented\n3.2. Equipment is checked for\ndamages and reported to\nauthorized personnel for\nrepair\n3.3. Equipment is stored in\naccordance with\nmanufacturer’s\nspecifications and\nstandard procedures\n\n3.1. Maintenance\nprocedures\n3.2. OSHS principles\nand\nresponsibilities\n3.3. Safe & secure\nstorage\nprocedures\n\n3.1. Applying\nmaintenance\nprocedures\n3.2. Storing\nequipment\n\n--- PDF PAGE 50 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 46\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\nMay include:\n1.1. Computers\n1.2. Communication equipment\n1.3. Printers\n1.4. Display devices\n1.5. Imaging devices\n1.6. Data storage devices\n\n2. Desired creative\noutput\nMay include:\n2.1. Director’s treatment\n2.2. Visual output (e.g. Test shots, sample edited scenes,\nlights experimentation and color combination)\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned and prepared for task to be undertaken\n1.2\nUsed equipment\n