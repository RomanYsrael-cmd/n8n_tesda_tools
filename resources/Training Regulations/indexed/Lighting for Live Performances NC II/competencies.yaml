        "source_text": "CRE265202\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nexhibit professional practice covering the development of\nconceptual, creative and artistic capabilities and the broadening of\ncultural awareness.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Acquire and\ndevelop\ncreative\nthinking\n\n1.1. Concepts and ideas are\nidentified and explored to\nensure the development of\nthe creative process\n1.2. Sources of creative thinking\nare explored and scanned\nfrom the environment\n1.3. Relevant printed reading\nmaterials and other media\nare used to stimulate\ncreative ideation\n1.4. Feedback, interaction,\ndiscussion and evaluation\nopportunities to\ncontinuously improve\ncreative thinking are used.\n\n1.1. Exposure to\ncreative thinking\ntheories, exercises\nand techniques\n1.2. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n1.3. Awareness of\ncopyright, moral\nrights and\nintellectual property\nissues related to\nthe development of\nself as artist\n1.1. Communication\nskills\n1.2. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n1.3. Convergent\nthinking\n1.4. Divergent\nthinking\n1.5. Collaboration\nand brain\nstorming\n1.6. Integrated\nthinking\n1.7. Critical thinking\n2. Develop\nartistic skills\n2.1. Strategies, methods and\napproaches are identified\nand explored in developing\nthe artistic work.\n2.2. Artistic work is reviewed,\nevaluated and finalized\nbased on applicable and\naccepted standards of the\nfield\n2.3. Relevant printed reading\nmaterials and other media\nare used to stimulate artistic\nand professional\ndevelopment\n2.4. Capabilities of materials,\ntools and equipment are\nexplored to enable artistic\noutputs.\n\n2.5. Feedback, critique,\ndiscussion and evaluation\nmechanisms are\ncontinuously applied to\n2.1. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n2.2. Elements of arts\n2.3. Principles of\ncomposition\n2.4. Physical properties\nand capabilities of\nmaterial, tools and\nequipment and\ntheir application\n2.5. Awareness of\nsocio-cultural and\nintellectual\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n2.6. Creative thinking\ntheories, exercises\nand techniques\n2.1. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n2.2. Communication\nskills\n2.3. Basic artistic/\nvisual\n2.3.1. Drawing/\nIllustration\n2.3.2. Coloring\n2.3.3. Body\nmovements\n2.3.4. Words/text/\n2.3.5. Graphics\n2.3.6. Sound\n\n--- PDF PAGE 44 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 40\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nimprove artistic skills.\n2.6. Work experiences and\nideas are discussed to\nimprove own practice.\n2.7. Other artistic works are\nstudied to stimulate the\ndevelopment of conceptual\nand artistic skills.\n\n3. Broaden\nexposure to\nculture and\narts\n3.1. Studies on arts and\nculture are generated\nbased on required learning\nobjectives.\n3.2. Cultural immersion\nopportunities that may be\nhelpful in developing career\nopportunities are\nexperienced.\n3.3. Insights and experiences on\narts and culture are shared,\ndiscussed and reflected\nupon.\n3.1. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n3.2. Elements of arts\n3.3. Principles of\ncomposition\n3.4. Physical properties\nand capabilities of\nmaterial, tools and\nequipment and\ntheir application\n3.5. Awareness of\nsocio-cultural and\nintellectual\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n3.6. Creative thinking\ntheories, exercises\nand techniques\n\n3.1. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n3.2. Basic\nartistic/visual\ncommunication\nskills\n3.2.1. Drawing/\nillustration\n3.2.2. Coloring\n3.2.3. Body\nmovements\n3.2.4. Words/text/\ngraphics\n3.2.5. Sound\n\n--- PDF PAGE 45 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\n\nMay include:\n1.1. Working effectively with Assessor / Trainor\n1.2. Participating in professional development activities\n1.3. Participating in relevant groups or associations\n1.4. Experimenting\n1.5. Communicating with peers\n\n2. Artistic Skills\nMay include:\n2.1. Painting and drawing\n2.2. Photography/videography/cinematography\n2.3. Dance, body movements and body sculpture\n2.4. Arts and crafts\n2.5. Information technology, including relevant hardware and\nsoftware\n2.6. Creative interpretation/drama\n2.7. Sound and music\n\n3. Studies on arts\nand culture\nMay include:\n3.1. Philippine arts and culture\n3.2. Asian arts and culture\n3.3. Western arts and culture\n3.4. Philippine theater\n3.5. Film history\n3.6. Contemporary art and media\n3.7. Other artistic and cultural fields\n\n4. Learning\nobjectives\nMay include:\n4.1. Study guide\n4.2. Discussion topic\n4.3. Project brief\n4.4. Research topic/agenda\n\n5. Cultural\nimmersion\nopportunities\nMay include:\n5.1. Arts and cultural festivals\n5.2. Exhibitions/screening/staging\n5.3. Community events\n5.4. Membership of specialization-specific organization\n5.5. Cultural exchange programs\n5.6. Workshop/Studio visitations\n\n--- PDF PAGE 46 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 42\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Applied strategies to develop creative skills in art\npractice\n1.2. Developed artistic skills and ideas\n1.3. Generated studies on arts and culture\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1. Specialized materials, tools and equipment required for\neach area of specialization and used to develop\ntechnical and conceptual skills relevant to art making\npractice\n2.2. Information about relevant artist, their work, ideas and\ntechniques\n3. Method of\nassessment\n\nCompetency must be assessed through:\n3.1. Demonstration / Observation with oral questioning\n3.2. Portfolio with interview\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 47 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 43\nUNIT TITLE\n:\nOBSERVE PROCEDURES, SPECIFICATIONS AND MANUALS\nOF INSTRUCTIONS\n\nUNIT CODE\n:"
