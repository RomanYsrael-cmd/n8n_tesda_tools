rd\nemergency plan\nand procedures\nin the workplace\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n\n--- PDF PAGE 31 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 27\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Prepare OSH\nrequirements for\ncompliance\n\n2.1 OSH work activity\nmaterial, tools and\nequipment\nrequirements are\nidentified in\naccordance with\nworkplace policies\nand procedures\n2.2. Required OSH\nmaterials, tools\nand equipment are\nacquired in\naccordance with\nworkplace policies\nand procedures\n2.3. Required OSH\nmaterials, tools\nand equipment are\narranged/ placed in\naccordance with\nOSH work\nstandards\n2.1. Resources\nnecessary to\nexecute hierarchy\nof controls\n2.2. General OSH\nprinciples\n2.3. Work standards\nand procedures\n2.4. Safe handling\nprocedures of\ntools, equipment\nand materials\n2.5. Different OSH\ncontrol measures\n\n2.1. Communication\nskills\n2.2. Estimation skills\n2.3. Interpersonal\nskills\n2.4. Critical thinking\nskills\n2.5. Observation\nskills\n2.6. Material, tool\nand equipment\nidentification\nskills\n\n3. Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n\n3.1 Relevant OSH\nwork procedures\nare identified in\naccordance with\nworkplace policies\nand procedures\n3.2 Work Activities are\nexecuted in\naccordance with\nOSH work\nstandards\n3.3 Non-compliance\nwork activities are\nreported to\nappropriate\npersonnel\n3.1. OSH work\nstandards\n3.2. Industry related\nwork activities\n3.3. General OSH\nprinciples\n3.4. OSH Violations\n Non-compliance\nwork activities\n\n3.1 Communication\nskills\n3.3 Interpersonal\nskills\n3.4 Troubleshooting\nskills\n3.5 Critical thinking\nskills\n3.6 Observation\nskills\n\n--- PDF PAGE 32 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019)