        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified lighting equipment, tools and supplies\n1.2 Requested lighting equipment, tools and supplies based on\nchecklist and requisition form\n1.3 Received and inspected lighting equipment, tools and supplies\n are tested and secured\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource implications The following resources should be provided:\n2.1 Lighting plan, drawings and specifications relevant to the project\n2.2 Workplace location\n2.3 Materials relevant to the unit of competency\n3. Methods of\nassessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation\n3.2 Demonstration with oral questioning\n3.3 Written and practical examination\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at the\n designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 64 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 60\n\nUNIT OF COMPETENCY:\nSET-UP LIGHTING EQUIPMENT ACCORDING TO THE\nLIGHTING PLAN\n\nUNIT CODE :\nCRE265202\n\nUNIT DESCRIPTOR :\n\nThis unit covers the knowledge, skills and attitudes required in\nsetting up lighting equipment for live performances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n1.1 Instructions for the\npreparation of the work\nactivity are communicated\nand confirmed with the\nsupervisor\n1.2 Supplies, tools and lighting\nequipment are prepared in\naccordance with the required\nlighting plan\n1.3 Safety procedures are\nobserved according to the\nworkplace standards\n1.1 Standard operating\nprocedures\n1.2 Standard Safety\nProcedures\n• Philippine Electrical\nCode\n1.3 Basic electricity\n1.4 Basic mathematical\nprocess of addition,\nsubtraction, division and\nmultiplication\n1.5 Unit Conversion\n1.6 Types, characteristics\nand uses of lighting\nequipment, tools and\nsupplies\n1.7 Computer Aided\nDrawing\n\n1.1 Communication\n• Verbal\n• Written\n• Visual\n• Online\n\n1.2 Positioning of\nequipment and\nsupplies\n1.3 Preparing work\nschedule for\nrigging wiring\nand patching\n\n--- PDF PAGE 65 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 61\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Set up\nlighting\nequipment\n2.1 Lighting is set up in\naccordance with the\ntechnical plan and allotted\nschedule\n2.2 Lighting fixtures and\nequipment are installed and\nsecured in accordance to\nsafety practices\n2.3 Focusing of lights is done in\naccordance with the plan,\nfocus notes and allotted\nschedule\n2.4 Safety procedures are\nfollowed in accordance to\nindustry standards\n2.5 Work area is clean and\nsecured in accordance to\nindustry standards\n\n2.1 Basic mathematical\nprocess of addition,\nsubtraction, division and\nmultiplication\n2.2 Unit Conversion\n2.3 Lighting Design/Plan\n(Technical\nDrawing/Scale\n Measurement\n2.4 Basic electricity\n2.5 Types, characteristics\nand uses of lighting\nequipment, tools and\nsupplies\n2.6 Identifying electrical\ncircuits, dimmers,\nchannel assignment,\nsignal and network\nprotocol (DMX and\nARTNET) and control\nconsoles\n2.7 OSH Law\n2.8 DOLE DO 198 s 2018\n2.9 Work environment\nmeasure\n\n2.1 Setting up\nlighting fixtures\nand equipment\nfollowing\nlighting plans\nand details\n2.2 Using hand\ntools during set\nup\n2.3 Applying\nstandard\nprocedures\nduring rigging,\nwiring and\npatching\n2.4 Observing\nOSH Law\n2.5 Observing\nDOLE 198 s\n2018\n2.6 Work\nenvironment\nskills\n\n--- PDF PAGE 66 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 62\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Supervisor\nMay include:\n1.1\nTechnical Director\n1.2\nLighting Director/Designer\n1.3\nLights Crew Chief/Leadman\n2. Equipment\nMay include:\n2.1 Floodlights/Spotlights/Effects/Intelligent Lights\n2.2 Lighting Console and Dimmer Pack\n2.3 Worklights\n2.4 Color filters/gels\n2.5 Gobo patterns\n3. Technical Plan\nMay include:\n3.1 Lighting plan\n3.2 Lighting Layout\n3.3 Hookup chart\n3.4 Focus notes\n3.5 Technical script\n3.6 Computer Aided Drawing\n4. Lighting Fixtures\nMay include:\n4.1 Floodlights\n• Strip lights/cyclorama lights\n• Scoop lights\n• House lights\n• Halogen / Tungsten\n4.2 Spotlights\n• Fresnel lanterns\n• Plano-convex lanterns\n• Ellipsoidal reflector spotlight\n• Beam projector\n• Followspot\n• PAR lights (PAR 64, 56, 38)\n4.3 Effects\n• Strobe lights\n• Laser\n• Black lights\n• Fluorescent lamps\n• Mirror Ball\n• Moon Box\n• Effects Projector\n• Smoke Machines\n• Haze Machine\n4.4 Intelligent Lighting\n- Moving Heads\n- Moving Mirrors\n- LEDs\n4.5 Color/gel frames\n4.6 Gobo pattern holders\n\n--- PDF PAGE 67 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 63\n5. Safety procedures\n\nMay include:\n5.1 Proper handling of tools and lighting equipment\n5.2 wiring gauge and electrical capacity\n5.3 Wearing of personal protective equipment\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned work activity in coordination with supervisor\n1.2 Prepared supplies, tools and lighting equipment\n1.3 Set up lighting fixtures and equipment according to technical\nplan following safety procedures\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Tools and equipment relevant to the project\n2.2 Specifications or work instruction\n2.3 Workplace or simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation\n3.2 Demonstration with oral questioning\n3.3 Written examination\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\n designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 68 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 64\n\nUNIT OF COMPETENCY:\nOPERATE AND MONITOR THE LIGHTING SYSTEM\n\nUNIT CODE :"
        },
        "source_text": "CRE343301\n\nUNIT DESCRIPTOR :\n\nThis unit covers the knowledge, skills and attitudes required\non identifying, requesting and receiving lighting equipment,\nsupplies and tools, based on the required performance\nstandards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nlighting\nequipment,\ntools and\nsupplies\n\n1.1 Lighting equipment, tools\nand supplies are identified\nand listed in accordance\nwith project requirement\n1.2 Lighting equipment and\nsupplies, its quantity and\ndescription must be in\naccordance with the project\nrequirement\n1.3 Lighting equipment, tools\nand supplies are identified\nin accordance with the\nchecklist prepared.\n\n1.1 Standard Safety\nProcedures\n• Philippine Electrical\nCode\n1.2 Basic electricity\n1.3 Basic mathematical\nprocess of addition,\nsubtraction, division\nand multiplication\n1.4 Unit Conversion\n1.5 Lighting\n Design/Plan\n (Technical\n Drawing/Scaled\n Measurement)\n1.6 Types, characteristics\nand uses of lighting\nequipment, tools and\nsupplies\n1.7 Reading of Computer\nAided Drawings\n1.8 OSH Law\n1.9 DOLE DO 198 s 2018\n1.10 Work environment\nmeasure\n\n1.1 Communication\n• Verbal\n• Written\n• Visual\n• Online\n1.2 Interpreting\nLighting\nDesign / Plan\n1.3 Preparing the\nchecklist of\nlighting\nequipment,\ntools and\nsupplies\n1.4 Handling of\nlighting\nequipment,\ntools and\nsupplies\n1.5 Familiarization\non various\ntypes of\nlighting fixtures\n1.6 Observing OSH\nLaw\n1.7 Observing\nDOLE 198 s\n2018\n1.8 Work\nenvironment\nskills\n\n--- PDF PAGE 61 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 57\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Request\nlighting\nequipment,\ntools and\nsupplies\n\n2.1 Lighting equipment, tools\nand supplies needed are\nrequested using requisition\nform\n2.2 Checklist are reviewed and\napproved by a supervisor\n2.3 Request is done as per\nstandard operating\nprocedures (SOPs)\n\n2.1 Standard operating\nprocedures for\nrequisitions\n2.2 Standard Safety\nProcedures\n2.3 Basic mathematical\nprocess of addition,\nsubtraction, division\nand multiplication\n2.4 Unit Conversion\n2.5 Types, characteristics\nand uses of lighting\nequipment, tools and\nsupplies\n\n2.1 Communication\n• Verbal\n• Written\n• Visual\n• Online\n2.2 Following\nstandard\noperating\nprocedures\n2.3 Using different\nrequest forms\n3. Receive and\ninspect\nlighting\nequipment,\ntools and\nsupplies\n\n3.1 Lighting Equipment, tools\nand supplies issued are\nreceived and inspected in\naccordance with quantity\nand specification of the\nproject requirement\n3.2 Lighting Equipment, tools\nand supplies are tested and\nshould be in good working\ncondition based on\nmanufacturer’s\nspecification.\n3.3 Lighting Equipment, tools\nand supplies are secured to\na specified location in\naccordance to safety\npractices.\n\n3.1 Standard Safety\nProcedures\n3.2 Basic electricity\n3.3 Basic mathematical\nprocess of addition,\nsubtraction, division\nand multiplication\n3.3 Types, characteristics\nand uses of lighting\nequipment, tools and\nsupplies\n3.4 OSH Law\n3.5 DOLE DO 198 s 2018\n3.6 Work environment\nmeasure\n\n3.1 Communication\n• Verbal\n• Written\n• Visual\n• Online\n3.2 Visual\ninspection\nof lighting\nequipment\nand tools\n3.3 Testing and\ncalibration of\nlighting\nequipment and\ntools\n3.4 Observing\nOSH Law\n3.5 Observing\nDOLE 198 s\n2018\n3.6 Work\nenvironment\nskills\n\n--- PDF PAGE 62 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 58\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Lighting equipment, tools and\nsupplies\nMay include:\n1.1 Lighting equipment\n- cables\n- ladder\n- elevator tower\n- lighting stand\n- light truss\n- stage truss\n- scaffoldings\n- lighting fixtures\n- control/dimmer board\n- fog/smoke machine\n- projector\n1.2 Tools and supplies\n- color filters (gels) and color frames\n- gobo patterns and holders\n- shutters (black/aluminum foil)\n- electrical tape\n- male/female plugs and outlets\n- bolts and knots\n- screws\n- steel cable\n- carabiners\n- pulleys\n- rope\n- black backings\n- penetrating oil / spray lubricant (e.g. WD40)\n- safety chains\n- duct tape\n- gaffing tape\n- masking tape\n- plastic tie straps\n\n--- PDF PAGE 63 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 59\n\nVARIABLE\nRANGE\n 2. Project\n May include:\n 2.1 Theater Performance\n 2.2 Dance Performance\n 2.3 Musical Concert\n 2.4 Corporate Events\n 2.5 Festivals\n2.5.1\nFormal Occasions, Wedding, Birthday,\n Christening, Reception Architectural\n2.6 Systems Integration and Installation\n3. Standard Operating Procedures\nMay include:\n3.1 Lighting plan\n3.2 Requisition slip\n3.3 Borrower slip\n3.4 Memorandum of Agreement\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified lighting equipment, tools and supplies\n1.2 Requested lighting equipment, tools and supplies based on\nchecklist and requisition form\n1.3 Received and inspected lighting equipment, tools and supplies\n are tested and secured\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource implications The following resources should be provided:\n2.1 Lighting plan, drawings and specifications relevant to the project\n2.2 Workplace location\n2.3 Materials relevant to the unit of competency\n3. Methods of\nassessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation\n3.2 Demonstration with oral questioning\n3.3 Written and practical examination\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at the\n designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 64 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 60\n\nUNIT OF COMPETENCY:\nSET-UP LIGHTING EQUIPMENT ACCORDING TO THE\nLIGHTING PLAN\n\nUNIT CODE :\nCRE265202\n\nUNIT DESCRIPTOR :\n\nThis unit covers the knowledge, skills and attitudes required in\nsetting up lighting equipment for live performances.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n1.1 Instructions for the\npreparation of the work\nactivity are communicated\nand confirmed with the\nsupervisor\n1.2 Supplies, tools and lighting\nequipment are prepared in\naccordance with the required\nlighting plan\n1.3 Safety procedures are\nobserved according to the\nworkplace standards\n1.1 Standard operating\nprocedures\n1.2 Standard Safety\nProcedures\n• Philippine Electrical\nCode\n1.3 Basic electricity\n1.4 Basic mathematical\nprocess of addition,\nsubtraction, division and\nmultiplication\n1.5 Unit Conversion\n1.6 Types, characteristics\nand uses of lighting\nequipment, tools and\nsupplies\n1.7 Computer Aided\nDrawing\n\n1.1 Communication\n• Verbal\n• Written\n• Visual\n• Online\n\n1.2 Positioning of\nequipment and\nsupplies\n1.3 Preparing work\nschedule for\nrigging wiring\nand patching\n\n--- PDF PAGE 65 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 61\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Set up\nlighting\nequipment\n2.1 Lighting is set up in\naccordance with the\ntechnical plan and allotted\nschedule\n2.2 Lighting fixtures and\nequipment are installed and\nsecured in accordance to\nsafety practices\n2.3 Focusing of lights is done in\naccordance with the plan,\nfocus notes and allotted\nschedule\n2.4 Safety procedures are\nfollowed in accordance to\nindustry standards\n2.5 Work area is clean and\nsecured in accordance to\nindustry standards\n\n2.1 Basic mathematical\nprocess of addition,\nsubtraction, division and\nmultiplication\n2.2 Unit Conversion\n2.3 Lighting Design/Plan\n(Technical\nDrawing/Scale\n Measurement\n2.4 Basic electricity\n2.5 Types, characteristics\nand uses of lighting\nequipment, tools and\nsupplies\n2.6 Identifying electrical\ncircuits, dimmers,\nchannel assignment,\nsignal and network\nprotocol (DMX and\nARTNET) and control\nconsoles\n2.7 OSH Law\n2.8 DOLE DO 198 s 2018\n2.9 Work environment\nmeasure\n\n2.1 Setting up\nlighting fixtures\nand equipment\nfollowing\nlighting plans\nand details\n2.2 Using hand\ntools during set\nup\n2.3 Applying\nstandard\nprocedures\nduring rigging,\nwiring and\npatching\n2.4 Observing\nOSH Law\n2.5 Observing\nDOLE 198 s\n2018\n2.6 Work\nenvironment\nskills\n\n--- PDF PAGE 66 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 62\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Supervisor\nMay include:\n1.1\nTechnical Director\n1.2\nLighting Director/Designer\n1.3\nLights Crew Chief/Leadman\n2. Equipment\nMay include:\n2.1 Floodlights/Spotlights/Effects/Intelligent Lights\n2.2 Lighting Console and Dimmer Pack\n2.3 Worklights\n2.4 Color filters/gels\n2.5 Gobo patterns\n3. Technical Plan\nMay include:\n3.1 Lighting plan\n3.2 Lighting Layout\n3.3 Hookup chart\n3.4 Focus notes\n3.5 Technical script\n3.6 Computer Aided Drawing\n4. Lighting Fixtures\nMay include:\n4.1 Floodlights\n• Strip lights/cyclorama lights\n• Scoop lights\n• House lights\n• Halogen / Tungsten\n4.2 Spotlights\n• Fresnel lanterns\n• Plano-convex lanterns\n• Ellipsoidal reflector spotlight\n• Beam projector\n• Followspot\n• PAR lights (PAR 64, 56, 38)\n4.3 Effects\n• Strobe lights\n• Laser\n• Black lights\n• Fluorescent lamps\n• Mirror Ball\n• Moon Box\n• Effects Projector\n• Smoke Machines\n• Haze Machine\n4.4 Intelligent Lighting\n- Moving Heads\n- Moving Mirrors\n- LEDs\n4.5 Color/gel frames\n4.6 Gobo pattern holders\n\n--- PDF PAGE 67 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 63\n5. Safety procedures\n\nMay include:\n5.1 Proper handling of tools and lighting equipment\n5.2 wiring gauge and electrical capacity\n5.3 Wearing of personal protective equipment\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned work activity in coordination with supervisor\n1.2 Prepared supplies, tools and lighting equipment\n1.3 Set up lighting fixtures and equipment according to technical\nplan following safety procedures\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Tools and equipment relevant to the project\n2.2 Specifications or work instruction\n2.3 Workplace or simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation\n3.2 Demonstration with oral questioning\n3.3 Written examination\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\n designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 68 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 64\n\nUNIT OF COMPETENCY:\nOPERATE AND MONITOR THE LIGHTING SYSTEM\n\nUNIT CODE :"
