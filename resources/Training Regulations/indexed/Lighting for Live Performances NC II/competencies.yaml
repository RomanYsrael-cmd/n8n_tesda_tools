        "source_text": "CRE265206\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills and\nattitudes needed to maintain clean, safe and efficient working\nenvironment. The unit incorporates the work safety guidelines.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Comply with\nsafety and\nhealth\nregulations\n1.1 Safety and health\nregulations are identified\nand complied with.\n1.2 Policies and procedures\nare adapted and applied.\n1.1. OSHS policies\nand standards\n1.2. Fire code\n1.1. Complying with\nhealth and safety\nregulations\n1.2 Reading and\ncomprehension\n\n2. Assess work\narea\n2.1 Work areas and walkways\nare maintained in a safe\nand hazard free\nenvironment.\n2.2 All routines are carried out\nin accordance with\nOccupational Safety and\nHealth Standards (OSHS)\n2.3 Waste is stored and\ndisposed of according to\nOSHS\n\n2.1. Work Hazards\nPolicies and\nProcedures\n2.2. OSHS policies\nand procedures\n2.3. Waste\nmanagement\n\n2.1. Complying with\nhealth and safety\nregulations\n\n3. Check and\nmaintain tools,\nequipment\nand resources\n3.1 Tools, equipment and\nresources are stored\naccording to safety\nregulations\n3.2 Tools, equipment and\nresources are checked for\nmaintenance\nrequirements\n3.3 Tools and equipment are\nreferred for repair as\nrequired\n\n3.1. Maintenance of\ntools and\nequipment\n3.2. Tools, equipment\nand resource\nmaintenance\nrequirements\n\n3.1. Checking for\nmaintenance\nrequirements\n3.2. Storing tools and\nequipment\n\n--- PDF PAGE 54 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 50\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety and\nHealth\nRegulations\n\nMay include:\n1.1\nClean Air Act\n1.2\nNational Building Code\n1.3\nPhilippine Electrical Code\n1.4\nFire Code of the Philippines\n1.5\nWaste management statutes and rules\n1.6\nPhilippine Occupational Safety and Health Standards\n1.7\nDOLE OSH related issuances\n1.8\nECC regulations\n\n2. Policies and\nprocedures\nMay include:\n2.1\nHazard Policies and Procedures\n2.2\nEmergency, Fire and Accident Procedures\n2.3\nPersonal Safety Procedures\n2.4\nProcedures for the use of Personal protective Clothing\nand Equipment\n2.5\nHazard Identification\n2.6\nJob Procedures\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nComplied with health and safety requirements\n1.2\nAssessed work area\n1.3\nChecked and maintained tools, equipment and\nresources\n2. Resource\nimplications\nThe following resources should be provided:\n2.1\nAccess to relevant venue, tools, equipment and\nresources to perform the tasks\n2.2\nRequired operating manual/s\n2.3\nSafety regulations\n2.4\nRelevant policies and procedures\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n\n4. Context of\nassessment\n4.1\nCompetency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 51\nUNIT OF COMPETENCY : PROVIDE AND MAINTAIN EFFECTIVE CLIENT RELATIONS\nUNIT CODE :"
