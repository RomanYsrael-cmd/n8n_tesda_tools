aste management statutes and rules\n1.6\nPhilippine Occupational Safety and Health Standards\n1.7\nDOLE OSH related issuances\n1.8\nECC regulations\n\n2. Policies and\nprocedures\nMay include:\n2.1\nHazard Policies and Procedures\n2.2\nEmergency, Fire and Accident Procedures\n2.3\nPersonal Safety Procedures\n2.4\nProcedures for the use of Personal protective Clothing\nand Equipment\n2.5\nHazard Identification\n2.6\nJob Procedures\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nComplied with health and safety requirements\n1.2\nAssessed work area\n1.3\nChecked and maintained tools, equipment and\nresources\n2. Resource\nimplications\nThe following resources should be provided:\n2.1\nAccess to relevant venue, tools, equipment and\nresources to perform the tasks\n2.2\nRequired operating manual/s\n2.3\nSafety regulations\n2.4\nRelevant policies and procedures\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n\n4. Context of\nassessment\n4.1\nCompetency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nLIGHTING FOR LIVE PERFORMANCES NC II Revision 00 Promulgated (12/17/2019) 51\nUNIT OF COMPETENCY : PROVIDE AND MAINTAIN EFFECTIVE CLIENT RELATIONS\nUNIT CODE : CRE265207\nUNIT DESCRIPTOR :\nThis unit of competency deals with the knowledge, skills and\nattitudes in providing effective client service. It includes personal\npresentation, addressing client’s needs and strengthening\nclient’s relations.\nELEMENTS\nPERFORMANCE CRITERIA\nitalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Maintain a\nprofessional\nimage\n1.1. Personal presence is\nmaintained according to\nemployer standards or\nvenue requirements\n1.2. Interpersonal skills are\nused to ensure that\ncustomer needs are\naccurately identified\n1.3. Presen