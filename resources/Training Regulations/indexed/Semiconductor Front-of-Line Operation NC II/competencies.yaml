          "source_text": "REQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n1. Gather tools \nand materials \nfor \nsemiconductor \nFOL process \n \n1.1. Process requirements \nare determined according \nto production \nspecifications  \n1.2. Appropriate hand tools, \nPPE and materials are \nselected and completed \naccording to process \nrequirements and \nrequired time \n1.3. Quantity and quality of \nmaterials are checked in \naccordance to \nproduction \nspecifications \n1.4. Completeness and \naccuracy of documents \nare checked in \naccordance to production \nspecifications \n \n Awareness of \nsemiconductor production \nline systems and \nprocesses \n Familiarity with \nsemiconductor production \nline FOL materials  \n Understanding bill of \nmaterials, travelers, check \nlist and other applicable \nsemiconductor production \nline FOL documents/ \nspecifications. \n Awareness of safe \nhandling of tools and \nmaterials i.e. 5S, Material \nSafety Data Sheet \n(MSDS), Personal \nProtective Equipment \n(PPE), Electro Static \nDischarge (ESD), \nEnvironmental Health \nSystems (EHS), \nOccupational Health and \nSafety (OHS). \n Understanding of IPC \nstandards \n Awareness of international \nquality standards \no Quality Management \nSystem \no Environmental \nManagement System \n Awareness of visual criteria\n Familiarity with \nsemiconductor production \nline FOL tools \n Time consciousness on set \nup time \n Reading skills \n Basic \nmathematical \nskills \n Communication \nskills \n Computer skills \n Detecting \nabnormality or \nnon-\nconformance \n Writing skills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n29\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n1 Set-up \nsemiconductor \nFOL machine \nparameters \nand \nperipherals \n  \n \n \n2.1 Walk-around check or \nvisual 