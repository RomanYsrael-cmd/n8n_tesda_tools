          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nhazards and \nrisks \n1.1 Safety regulations and \nworkplace safety and hazard \ncontrol practices and \nprocedures are clarified and \nexplained based on \norganization procedures \n1.2 Hazards/risks in the \nworkplace and their \ncorresponding indicators are \nidentified to minimize or \neliminate risk to co-workers, \nworkplace and environment \nin accordance with \norganization procedures \n1.3 Contingency measures \nduring workplace accidents, \nfire and other emergencies \nare recognized and \nestablished in accordance \nwith organization procedures \n OHS procedures and \npractices and \nregulations \n Hazards/risks \nidentification and \ncontrol \n OHS indicators \n Organizational \ncontingency practices \n \n Hazards/risks \nidentification and \ncontrol skills \n Practice of  \nsafety and health \nprocedures and \npersonal hygiene \n \n2. Evaluate \nhazards and \nrisks \n2.1 Terms of maximum tolerable \nlimits which  when exceeded \nwill result in harm or damage \nare identified based on \nthreshold limit values (TLV) \n2.2 Effects of the hazards are \ndetermined \n2.3 OHS issues and/or concerns \nand identified  safety \nhazards are reported to \ndesignated personnel in \naccordance with workplace \nrequirements and relevant \nworkplace OHS legislation \n Threshold Limit Value \n-TLV \n Effects of safety \nhazards \n \n Communication \nskills \n Reporting safety \nhazards \n3. Control \nhazards and \nrisks  \n3.1 Occupational Health and \nSafety (OHS) procedures \nfor controlling hazards/risks \nin workplace are \nconsistently followed \n3.2 Procedures for dealing with \nworkplace accidents, fire \nand emergencies are \n Personal hygiene \npractices \n Organization safety \nand health protocol \n Company emergency \nprocedure practices \n \n Practice of \npersonal hygiene \n Respond to \nemergency\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n14\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nfollowed in accordance with \norganization OHS policies \n3.3 Personal protective \nequipment (PPE) is \ncorrectly used in \naccordance with \norganization OHS \nprocedures and practices  \n3.4 Appropriate assistance is \nprovided in the event of a \nworkplace emergency in \naccordance with established \norganization protocol \n \n4. Maintain OHS \nawareness \n4.1   Emergency-related drills \nand trainings are \nparticipated in as per \nestablished organization \nguidelines and procedures \n4.2   OHS personal records are \ncompleted and updated in \naccordance with workplace \nrequirements  \n \n Workplace OHS \npersonal records \n Information on \nemergency-related \ndrills \n Practice \nemergency-\nrelated drill skills \nin the workplace\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n15\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nSafety regulations \nMay include but are not limited to: \n1.1 Clean Air Act \n1.2 Building code \n1.3 National Electrical and Fire Safety Codes \n1.4 Waste management statutes and rules \n1.5 Philippine Occupational Safety and Health Standards \n1.6 DOLE regulations on safety legal requirements \n1.7 ECC regulations\n2. \nHazards/Risks \nMay include but are not limited to: \n2.1 Physical hazards – impact, illumination, pressure, noise, \nvibration, temperature, radiation  \n2.2 Biological hazards- bacteria, viruses, plants, parasites, \nmites, molds, fungi, insects \n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, \ngasses, vapors \n2.4 Ergonomics \n2.4.1 Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n2.4.2 Physiological factors – monotony, personal \nrelationship, work out cycle\n3. \nContingency \nmeasures \nMay include but are not limited to: \n3.1 Evacuation \n3.2 Isolation \n3.3 Decontamination \n3.4 (Calling designed) emergency personnel\n4. \nPPE \nMay include but are not limited to: \n4.1   Mask \n4.2   Gloves \n4.3   Goggles \n4.4   Hair Net/cap/bonnet \n4.5   Face mask/shield \n4.6   Ear muffs \n4.7   Apron/Gown/coverall/jump suit \n4.8   Anti-static suits\n5. \nEmergency-related \ndrills and training \n5.1   Fire drill \n5.2   Earthquake drill  \n5.3   Basic life support/CPR \n5.4   First aid \n5.5   Spillage control  \n5.6   Decontamination of chemical and toxic \n5.7   Disaster preparedness/management\n6. \nOHS personal \nrecords \n6.1    Medical/Health records \n6.2    Incident reports \n6.3    Accident reports \n6.4  OHS-related training completed\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n16"
        },
