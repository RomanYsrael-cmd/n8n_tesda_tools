ion units are \nloaded to the  equipment \nin accordance to product \norientation and \nspecifications \n3.3 If applicable, manual \nsemiconductor FOL \nprocess is performed in \naccordance with work \ninstructions and company \nprocedures \n3.4 Out of control action plan \n(OCAP) is followed in \ncase of any non-\nconformance or deviation \nto the process \n3.5 Semiconductors FOL \nproduction forms are \naccomplished based on \nproduction procedures \n \n Semiconductors production \nline FOL operation process \ncontrols \n Understanding of OCAP on \nsemiconductors production \nline FOL operation \n Completeness and accuracy \nof information on production \nline FOL form for production \nunits \n Work values and ethics \no Attentiveness  \no Time consciousness \no Cost-consciousness \no Quality-consciousness \n Reading skills \n Communication \nskills \n Computer skills \n Observation \nSkills \n FOL machine \noperation skills \n Detecting \nabnormality or \nnon-\nconformance \n Writing skills\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n35\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. PPE \nPersonal protective equipment may include: \n1.1 Safety shoes \n1.2 Gloves \n1.3 Safety goggles \n2. ESD apparels \nESD apparels may include: \n2.1 Shoes \n2.2 Smock and Head cap \n2.3 Jacket \n2.4 Bunny suit \n2.5 Face mask \n2.6 Wrist/Foot ground strap \n3. Tools and materials \nAppropriate tools and materials may include: \n3.1 Tools  \n3.1.1 Tweezers  \n3.1.2 Vacuum Pen \n3.1.3 Allen Keys \n3.1.4 Calculator \n3.1.5 Torque driver \n3.2 Materials \n3.2.1 Appropriate production components \n3.2.2 ESD apparels \n4 Semiconductor FOL \nmachines \nSemiconductor FOL  Machines may include: \n4.1 Wafer Saw Machine \n4.2 Die Bond Machine \n4.3 Wire Bond Machine \n4.4 Molding Machines \n4.5 DTFS machines \n5 Semiconductor FOL \nprocesses \nSemiconductor FOL  processes may include: 