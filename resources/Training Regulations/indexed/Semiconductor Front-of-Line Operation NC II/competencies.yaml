        "source_text": "--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n33\n \nUNIT OF COMPETENCY:    ANALYZE, CARRY-OUT AND MONITOR FRONT-OF-LINE \n(FOL) OPERATIONS FOR SEMICONDUCTOR PRODUCTION \nLINE  \n \nUNIT CODE                     :    ELC313311 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes needed in \nperforming any process, either automated or manual, in front-of-\nline (FOL) operation for semiconductor production line. This \nincludes initializing/operating semiconductor FOL equipment, \nrunning sample units and loading production units. It also includes \nperforming FOL manual processes, if applicable. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED KNOWLEDGE \nREQUIRED \nSKILLS \n1. Initialize/ \nOperate \nsemiconductor \nFOL machine/ \nequipment  \n \n1.1 Safety requirements are \ncomplied with using the \noperation manual \n1.2 Appropriate PPE and ESD \napparels are used in the \nperformance of the job \n1.3 Appropriate tools and \nmaterials are used \naccording to process \nrequirements \n1.4 Semiconductors FOL \nmachine settings are \nchecked according to \nproduct specifications \n1.5 Semiconductor FOL \nmachine is initialized/ \noperated in accordance to \nassigned line by \nsupervisor \n1.6 Semiconductor FOL \nmachine’s  troubles/ \nproblems are immediately \nrecorded and reported to \nthe appropriate personnel \n Awareness on safe working \nconditions \n Awareness on \nsemiconductors machine \nsafety features and \nguidelines \n Semiconductors production \nsystems \no Batch \no Continuous  \n Awareness on the following; \n5S, Material Safety Data \nSheet (MSDS), Personal \nProtective Equipment (PPE), \nElectro Static Discharge \n(ESD), Environmental Health \nSystems (EHS), \nOccupational Health and \nSafety (OHS) \n Understanding \nsemiconductors production