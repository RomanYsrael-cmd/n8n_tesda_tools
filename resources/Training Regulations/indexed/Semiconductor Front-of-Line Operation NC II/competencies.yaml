        "source_text": "--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n28\nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY:   SET UP FRONT-OF-LINE (FOL) OPERATIONS WORKPLACE \nFOR SEMICONDUCTOR PRODUCTION LINE \n \n \nUNIT CODE                     :    ELC313310 \n \n \nUNIT DESCRIPTOR        :    This unit covers the knowledge, skills and attitudes needed in setting up \nthe front-of-line (FOL) operation workplace for semiconductor production \nline.  This includes gathering production tools and materials, setting up \nsemiconductor FOL machine parameters and peripherals, \naccomplishing production line checklist and performing daily \nmaintenance activity. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n1. Gather tools \nand materials \nfor \nsemiconductor \nFOL process \n \n1.1. Process requirements \nare determined according \nto production \nspecifications  \n1.2. Appropriate hand tools, \nPPE and materials are \nselected and completed \naccording to process \nrequirements and \nrequired time \n1.3. Quantity and quality of \nmaterials are checked in \naccordance to \nproduction \nspecifications \n1.4. Completeness and \naccuracy of documents \nare checked in \naccordance to production \nspecifications \n \n Awareness of \nsemiconductor production \nline systems and \nprocesses \n Familiarity with \nsemiconductor production \nline FOL materials  \n Understanding bill of \nmaterials, travelers, check \nlist and other applicable \nsemiconductor production \nline FOL documents/ \nspecifications. \n Awareness of safe \nhandling of tools and \nmaterials i.e. 5S, Material \nSafety Data Sheet \n(MSDS), Personal \nProtective Equipment \n(PPE), Electro Static \nDischarge (ESD), \nEnvironmental Health \nSystems (EHS), \nOccupational Health and \nSafety (OHS). \n Understanding of IPC \nstandards \n Awareness of international \nquality standards \no Quality Management \nSystem \no Environmental \nManagement System \n Awareness of visual criteria\n Familiarity with \nsemiconductor production \nline FOL tools \n Time consciousness on set \nup time \n Reading skills \n Basic \nmathematical \nskills \n Communication \nskills \n Computer skills \n Detecting \nabnormality or \nnon-\nconformance \n Writing skills\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n29\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n1 Set-up \nsemiconductor \nFOL machine \nparameters \nand \nperipherals \n  \n \n \n2.1 Walk-around check or \nvisual inspection of FOL \nmachine is done prior to \nproduction operations \n2.2 Semiconductor FOL \nmachine parameters are \nset correctly according to \nproduction specifications \n2.3 Semiconductor FOL \nmachine parameters and \nperipherals are checked \naccording to production \nspecifications \n2.4 Any non-conformance to \nspecifications are \nreported to appropriate \npersonnel\n Semiconductor production \nline FOL machine set up \nparameters  \n Awareness of safety \noperation of FOL machines \n Reading of different \ngauges \n Awareness of set up \ncriteria \n Awareness of applicable \nOut of Control Action Plan \n(OCAP) \n Skills in basic \nmachine \noperation and \nset-up \n Detecting \nabnormality or \nnon-\nconformance \n Communication \nskills \no Written \no Oral \n2 Accomplish \nsemiconductor \nproduction line \nchecklist \n \n \n3.1 All check items are \nperformed according to \nspecifications \n3.2 Semiconductor production \nline checklist are correctly \nfilled-out according to \nspecifications \n3.3 Semiconductor production \nline checklist is completed \nbased on required time \n3.4 Work turnover procedure \nis performed for next work \nshift \n \n Completeness and \naccuracy of information on \nproduction line checklist \n Work values and ethics \no Attentiveness  \no Time consciousness \no Cost-consciousness \no Quality-consciousness\n \n \n \n Filling up \nappropriate \ninformation on \nchecklist/ lot \ntravelers \n \n3 Perform daily \npreventive \nmaintenance \n(PM) \n \n \n \n4.1 Semiconductor machine \nbasic physical condition \nare checked according to \nspecifications \n4.2 If necessary, daily PM is \nperformed based on \nrequired time \n4.3 Any non-conformance to \nspecifications are \nreported to appropriate \npersonnel \n4.4 Housekeeping \nprocedures are observed \nin accordance with 5S \ndiscipline and established \nprocedures\n Workplace organization \n(layout/arrangement of \nworkplace) \n Understanding the \napplicable PM checklist \n Time consciousness \n Awareness on applicable \nout of control action plan \n(OCAP)  \n 5S principles \n \n Checking of \nmachine basic \nphysical \ncondition \n Detecting \nabnormality or \nnon-\nconformance \n Writing skills \n Skills in \nhousekeeping\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n30\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \nSemiconductor materials may include: \n1.1 \nwafer \n1.2 \nCassette \n1.3 \nLaminating Tape \n1.4 \nEpoxy \n1.5 \nLead frame \n1.6 \nWire (wire bond) \n1.7 \nCapillary \n1.8 \nDie bonded units \n1.9 \nWire bonded units \n1.10 Molded Units \n1.11 Molding compounds \n1.12  Trays/ tube \n1.13 Applicable Chemicals \n \n \n2. Production \nspecifications \n2.1 \nMachine specifications \n2.2 \nSet-up checklist \n2.3 \nWork Instructions (WI) \n2.4 \nProduction procedures \n2.5 \nOut of Control Plan (OCAP) procedures \n2.6 \nControl Plan procedures \n2.7 \nStatistical Process Control (SPC) procedures \n2.8 \nWork Manual \n2.9 \nProduction Process and Flow Diagrams \n2.10 Job Hazards Analysis (JHA) \n \n \n3. Hand tools \n3.1 \nTweezers \n3.2 \nVacuum Pen \n3.3 \nAllen Keys  \n3.4 \nCalculator \n3.5 \nTorque driver \n \n \n4. PPE \n4.1 \nESD apparel \n4.1.1 Shoes \n4.1.2 Smock and Head cap \n4.1.3 Jacket \n4.1.4 Bunny suit \n4.1.5 Face mask \n4.1.6 Wrist ground strap \n4.1.7 Gloves \n4.2 \nSafety shoes \n4.3 \nGloves \n4.4 \nSafety goggles \n4.5 \nEar plugs \n4.6 \nGas Mask\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n31\nVARIABLE \nRANGE \n5. Processes  \nSemiconductor front-of-line  processes may include \nbut not be limited to: \n5.1 \nWafer back grinding \n5.2 \nWafer testing \n5.3 \nDie Cutting \n5.4 \nDie Attached \n5.5 \nWire bonding \n5.6 \nMolding \n6. Required time \n6.1 \nSet up/ Change over  time \n6.2 \nProduction cycle time \n6.3 \nProcess cycle time \n6.4 \nMachine Uptime \n7. Documents \n7.1 \nProduction form \n7.1.1 Lot summary \n \n7.1.2 PM checklist \n7.1.3 Monitoring checklist \n7.1.4  SPC checklist \n7.1.5 Production log sheet \n7.2 \nMaterial / Lot traveler \n7.3 \nWork Instruction (WI) \n7.4 \nSet up sheet \n7.5 \nOutbound check list \n8. Machine parameters \n8.1 \nMachine type \n8.2 \nMachine model \n8.3 \nMachine settings \n8.4 \nMaterial/ Product type \n8.5 \nMaterial/ Product model  \n9. Appropriate personnel \n9.1 \nImmediate supervisor \n9.2 \nMaintenance personnel \n9.3 \nEngineer \n9.4 \nQuality Control personnel \n10. Machine  basic \nphysical  \n     conditions \nMay include:  \n10.1 Complete screws (for accessible parts only) \n10.2 Fan is working  \n10.3 No oil leakage  \n10.4 No broken wire \n10.5 Free from foreign materials \n10.6 Industrial PC in good condition \n10.7 Dust free\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n32\n \nEVIDENCE GUIDE \n       \n1.  Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nGathered production tools and materials semiconductor front-\nof-line operation according to approved production \nspecifications \n1.2 \nChecked and set up semiconductor front-of-line machine \nparameters and peripherals for production startup and usage \n1.3 \nAccomplished semiconductor front-of-line production quality \nchecklist according to quality manuals and procedures \n1.4 \nChecked machine basic physical condition in accordance to \nproduction line standards and performed daily maintenance \nactivity based on required time \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1 \nAppropriate semiconductor FOL machine and equipment \n2.2 \nTools (as indicated in the Range Of Variables) \n2.3 \nMaterials  \n2.4 \nWork Instructions Assessment rating sheet \n2.5 \nSample production checklist \n2.6 \nApplicable forms for specific equipment or machines \n2.7 \nProcedure and quality manuals \n2.8 \nPersonal Computer \n2.1 \nPrinter \n2.9 \nReporting forms \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1 \nDemonstration with oral questioning \n3.2 \nDirect Observation with oral questioning \n3.3 \nExams and Tests \n \n4.  Context for \nAssessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting\n",
