  "source_section_text": "Section\n1. Successful candidates shall be awarded a National Certificate II signed by the\nTESDA Director General.\n\n4.1.2. The qualification of Semiconductor Front-of-Line (FOL) Operations NC II can\nbe attained through demonstration of competence through project-type\nassessment covering all the units required in the qualification.\n\n4.1.3. Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.1.4. The following are qualified to apply for assessment and certification:\n\na. Graduate of formal, non-formal, and informal including enterprise-based\neducation/training programs/courses.\nb. Experienced workers (wage employed or self-employed)\n\n4.1.5. The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)”.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is\navailable, where gaps exist, including readiness for assessment.\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\n\n--- PDF PAGE 64 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n60\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo\na quality assured procedure for accreditation before they are authorized by\nTESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 65 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n61\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a person\nthrough assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who pass\nthe assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people working\nin a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes to\nperform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted or\ncarried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in outcome\nterms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or identifies\nthe evidences required to determine the competence of the individual. It provides\ninformation on critical aspects of competency, underpinning knowledge, underpinning\nskills, resource implications, assessment method and context of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all the\nrequired units of competency for a national qualification defined under the Training\nRegulations. NCs are aligned to specific levels within the PTQF\n\n--- PDF PAGE 66 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n62\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on successful\ncompletion of a course in recognition of having demonstrated competencies in an\nindustry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is to\nbe performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n19) Resource Implication - refer to the resources needed for the successful performance\nof the work activity described in the unit of competency. It includes work environment\nand conditions, materials, tools and equipment\n\n20) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n21) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for establishment\nof qualification and certification under the PTQF. It also serves as guide for\ndevelopment of competency-based curricula and instructional materials including\nregistration of TVET programs offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is essential to\nthe performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and industry\nspecific skills\n\n24) Unit of Competency – is a component of the competency standards stating a specific\nkey function or role in a particular job or occupation; it is the smallest component of\nachievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 67 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n63\nSECTOR SPECIFIC\n\n1) Cleanroom or clean room is an environment, typically used in manufacturing or\nscientific research, with a low level of environmental pollutants such as dust,\nairborne microbes, aerosol particles, and chemical vapors. More accurately, a\ncleanroom has a controlled level of contamination that is specified by the number of\nparticles per cubic meter at a specified particle size.\n\n2) Electronic manufacturing services (EMS) is a term used for companies that design,\ntest, manufacture, distribute, and provide return/repair services for electronic\ncomponents and assemblies for original equipment manufacturers (OEMs). The\nconcept is also referred to as electronic contract manufacturing (ECM).\n\n3) Electrostatic discharge (ESD) is a swift discharge of electric current between two\nobjects with different charges and different numbers of electrons. This exchange of\nelectrons creates a large electromagnetic field buildup, resulting in ESD. Certain\nelectronic devices are vulnerable to low-voltage ESD. For example, a hard drive is\nsusceptible to just 10 volts. Integrated circuits (IC) are also prone to ESD and may be\npermanently damaged by high-voltage currents.\n\n4) Front-end-of-line (FEOL) is the first portion of IC fabrication where the individual\ndevices (transistors, capacitors, resistors, etc.) are patterned in the semiconductor.\nFEOL generally covers everything up to (but not including) the depositions of metal\ninterconnect layers.\n\n5) Hard disk drive (HDD) is a data storage device used for storing and retrieving digital\ninformation using rapidly rotating disks (platters) coated with magnetic material. An\nHDD retains its data even when powered off. Data is read in a random-access\nmanner, meaning individual blocks of data can be stored or retrieved in any order\nrather than sequentially. An HDD consists of one or more rigid (\"hard\") rapidly rotating\ndisks (platters) with magnetic heads arranged on a moving actuator arm to read and\nwrite data to the surfaces.\n\n6) A head-gimbal assembly of a hard disk drive includes a load beam connected to a\npivot arm, a slider on which a magnetic head is mounted, an elastic support member\nhaving one end coupled to the load beam and the other free end portion at which the\nslider is supported, and a damper provided between the load beam and the slider to\nattenuate vibration transferred between the load beam and the slider.\n\n7) IPC, the Association Connecting Electronics Industries, is a trade association\nwhose aim is to standardize the assembly and production requirements of\nelectronic equipment and assemblies. IPC is accredited by the American National\nStandards Institute (ANSI) as a standards developing organization and is known\nglobally for its standards. It publishes the most widely used acceptability standards in\nthe electronics industry.\n\n8) In manufacturing, lot traceability is readily-available access to the complete history of\nall manufactured lots, batches and serialized units, spanning production in multiple\nplants.\n\n--- PDF PAGE 68 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n64\n9) MSDS (an acronym for Material Safety Data Sheet) - is an important component\nof product stewardship and occupational safety and health. It is intended to provide\nworkers and emergency personnel with procedures for handling or working with that\nsubstance in a safe manner, and includes information such as physical data (melting\npoint, point, flash, etc.), toxicity, health effects, first aid, reactivity, storage, disposal,\nprotective equipment, and spill-handling procedures. It is a written document that\noutlines information and procedures for handling and working with chemicals. Current\nMSDS documents contain physical and chemical property information, potential\nhazard information, emergency procedures, and manufacturer contact information.\nMSDS formats can vary from source to source within a country depending on national\nrequirements.\n\n10) Out-of-control action plan (OCAP) - is a flowchart that guides employees' reactions to\nout-of-control situations. It consists of activators (which define out-of-control\nconditions); checkpoints (which are likely causes for the conditions); and terminators\n(which contain the action that should resolve the conditions). OCAPs are dynamic. For\nexample, Pareto analyses of OCAPs can identify commonly used terminators and\nsuggests methods to eliminate frequent causes of problems or to modify the OCAPs\nthat react to common out-of-control situations. Benefits of OCAPs include the\nempowerment given to the operators to troubleshoot problems. Other benefits are\nincreased process efficiency and standardization of problem solving techniques.\n\n11) Personal Protective Equipment (PPE) - specialized clothing or equipment worn by\nemployees for protection against health and safety hazards. Personal protective\nequipment is designed to protect many parts of the body, i.e., eyes, head, face, hands,\nfeet, and ears.\n\n12) Production line - is a set of sequential operations established in a manufacturing\nestablishment whereby materials are put through a process to produce an end-\nproduct. The machines and peripheral equipment are in the order they are used. The\nprocess is not stopped and restarted for each new product as the line is dedicated to\nproducing a single or small group of products.\n\n13) Quality management system (QMS) - is a collection of business processes focused\non achieving your quality policy and quality objectives — i.e. what your customer\nwants and needs. It is expressed as the organizational structure, policies, procedures,\nprocesses and resources needed to implement quality management.\n\n14) Statistical\nprocess\ncontrol (SPC)\n-\nis\na\nmethod\nof\nquality control which\nuses statistical methods. SPC is applied in order to monitor and control a process.\nMonitoring and controlling the process ensures that it operates at its full potential.\n\n--- PDF PAGE 69 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n65\n\nANNEX A - COMPETENCY MAP\nSemiconductor Front-of-Line Operation NC II\n\nBASIC COMPETENCIES\n\nReceive and Respond\nto Workplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems Related\nto Work Activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelo