r scratch \n5.5 Presence of foreign materials \n5.6 lead defects  \n5.7 mold defects\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n39\n \nEVIDENCE GUIDE \n       \n1.  Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nMonitored semiconductor front-of-line operation based on \nproduct requirements \n1.2 \nCompleted semiconductor front-of-line lot traceability in \naccordance with production procedures \n1.3 \nPerformed visual inspection in accordance to semiconductor \nproduction line standards \n \n \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1 \nAppropriate Semiconductor FOL machine and equipment \n2.2 \nTools (as indicated in the Range Of Variables) \n2.3 \nAppropriate production units and materials  \n2.4 \nWork Instructions Assessment rating sheet \n2.5 \nSample production checklist \n2.6 \nApplicable forms for specific equipment or machines \n2.7 \nProcedure and quality manuals \n2.8 \nPersonal Computer \n2.9 \nPrinter \n2.10 Reporting forms \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1 \nDemonstration with oral questioning \n3.2 \nDirect Observation with oral questioning \n3.3 \nExamination \n \n \n4.  Context for \nAssessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting\n",
