ills \n Reporting safety \nhazards \n3. Control \nhazards and \nrisks  \n3.1 Occupational Health and \nSafety (OHS) procedures \nfor controlling hazards/risks \nin workplace are \nconsistently followed \n3.2 Procedures for dealing with \nworkplace accidents, fire \nand emergencies are \n Personal hygiene \npractices \n Organization safety \nand health protocol \n Company emergency \nprocedure practices \n \n Practice of \npersonal hygiene \n Respond to \nemergency\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n14\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nfollowed in accordance with \norganization OHS policies \n3.3 Personal protective \nequipment (PPE) is \ncorrectly used in \naccordance with \norganization OHS \nprocedures and practices  \n3.4 Appropriate assistance is \nprovided in the event of a \nworkplace emergency in \naccordance with established \norganization protocol \n \n4. Maintain OHS \nawareness \n4.1   Emergency-related drills \nand trainings are \nparticipated in as per \nestablished organization \nguidelines and procedures \n4.2   OHS personal records are \ncompleted and updated in \naccordance with workplace \nrequirements  \n \n Workplace OHS \npersonal records \n Information on \nemergency-related \ndrills \n Practice \nemergency-\nrelated drill skills \nin the workplace\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n15\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nSafety regulations \nMay include but are not limited to: \n1.1 Clean Air Act \n1.2 Building code \n1.3 National Electrical and Fire Safety Codes \n1.4 Waste management statutes and rules \n1.5 Philippine Occupational Safety and Health Standards \n1.6 DOLE regulations on safety legal requirements