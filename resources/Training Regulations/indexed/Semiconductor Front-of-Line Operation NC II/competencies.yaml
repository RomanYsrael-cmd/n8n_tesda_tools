        "source_text": "--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \n \nTR-Semiconductor Front-of-Line Operations NC II (NEW)         Promulgated Dec. 16, 2015 \n37\nUNIT OF COMPETENCY:    CHECK QUALITY COMPLIANCE OF FRONT-OF-LINE (FOL)  \n                                              OPERATIONS FOR SEMICONDUCTOR PRODUCTION LINE  \n \nUNIT CODE                     :    ELC313312 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes needed in \nperforming front-of-line (FOL) operation for semiconductor \nproduction line. This includes monitoring front-end \nmachine/equipment operation, completing lot traceability and \nperforming visual machine inspection. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Monitor \nsemiconductor \nFOL operation \n \n1.1. Output and yield are \nchecked in accordance with \nproduction requirements \n1.2. Out of control action plan \n(OCAP) is followed in case \nof any non-conformance or \ndeviation to the process  \n1.3. Semiconductor FOL \nproduction forms are \naccomplished in \naccordance with process \nrequirements \n Yield requirement \n Machine capacity \n Understanding of OCAP \non FOL machine/ \nequipment operation \n Basic Statistical Process \nControl (SPC) \n Completeness and \naccuracy of information \non semiconductor \nproduction line FOL \nform for unusual \nmachine operation \n Reading skills \n Communication \nskills \n Monitoring skills \n Detecting \nabnormality or \nnon-conformance \n Writing skills \n \n2. Perform visual \ninspection \n \n2.1 Finished products are \nchecked/ inspected using \nappropriate \ninstruments/tools  \n2.2 Physical defects are \nidentified based on product \nspecifications \n2.3 Conforming and non-\nconforming products are \nidentified and segregated in \naccordance with production \nprocedures \n2.4 Housekeeping procedures \nare observed in accordance \n