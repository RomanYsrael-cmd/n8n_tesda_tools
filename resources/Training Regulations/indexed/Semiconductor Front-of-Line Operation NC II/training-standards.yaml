s\nAssessment\nApproach\nNominal\nDuration\n2. Apply Quality\nStandards\n4.1 Assess quality\nof received\nmaterials\n\n Identify relevant production processes, materials\nand products\n Study and interpret characteristics of materials,\nsoftware and hardware used in production\nprocesses\n Perform quality checking procedures\n Apply quality Workplace procedures\n Identify faulty materials\n Check quality of materials or component parts as per\nmanufacturer’s standards\nInterpret specifications or symbols\n Field trip\n Symposium\n Video clips\n Simulation/ Role\nplaying\n\n Written test\n Demonstration &\nquestioning\n Observation &\nquestioning\n\n4 hours\n4.2 Assess own\nwork\n\n Perform workplace procedure in documenting\ncompleted work\n Perform fault identification and reporting\n Observe safety and environmental aspects of\nproduction processes\n Utilize workplace quality indicators\n Document and report deviations from specified\nquality standards\n Field trip\n Symposium\n Film showing\n Simulation\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party report\n4 hours\n4.3 Engage in\nquality\nimprovement\n Participate in quality improvement processes\na. IEC/ISO standards\nb. Environmental and safety standards\n Carry out work as per process improvement\nprocedures\n Monitor operation performance\nImplement continuous improvement\n Field trip\n Symposium\n Film showing\n Simulation\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party report\n4 hours\n3. Perform\nComputer\nOperation\n5.1 Plan and\nprepare for\ntask to be\nundertaken\n Plan and prepare computer operation activity\n Determine task requirements based on required\noutput\n Determine appropriate hardware and software\n Identify/Select types of computers and basic\nfeatures of different operating systems\n Interpret and follow client -specific guidelines and\nprocedures\n Modular\n Film showing\n Computer\nbase