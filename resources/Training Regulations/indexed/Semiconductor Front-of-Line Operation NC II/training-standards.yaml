ion plan(OCAP)\n•\nApply 5S principles/ housekeeping procedures\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Observation in\nworkplace\n• Written exam\n• Practical exam\n2 hrs\n\n2. Analyze, carry-\nout and monitor\nFOL operations\nfor\nsemiconductor\nproduction line\n\n24 hrs\n\n2.1 Initialize/\nOperate\nsemiconductor\nFOL machine/\nequipment\n•\nLearn and apply safety requirements in the operation\nmanual\n•\nLearn and interpret overview of semiconductor FOL\nprocesses\n•\nIdentify types of semiconductor FOL sample units\n•\nLearn and determine product orientation\n•\nPerform procedure in processing electronics FOL\nsample units\n•\nPerform manual semiconductor FOL processes\n• Lecture\n• Discussion\n• Hands-on\n• Demonstration\n• Viewing\nmultimedia\n\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n16 hrs\n\n--- PDF PAGE 57 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n53\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n•\nIdentify semiconductor FOL equipment troubles/\nproblems\n•\nDetermine machines alarms/errors\n•\nIdentify appropriate PPE and ESD apparels\n•\nStudy and determine applicable out-of-control action\nplan(OCAP)\n•\nObserve and determine visual/mechanical criteria\n•\nUse appropriate tools\n•\nAccomplish production line documents\n2.2 Run\nsemiconductors\nFOL sample\nunits\n•\nIdentify usage and types of semiconductor FOL\nsample units according to product criteria\n•\nStudy and learn product orientation\n•\nLearn usage of appropriate PPE and ESD apparels\n•\nUse appropriate tools\n•\nPerform/Practice procedure in loading and processing\nsemiconductor FOL sample units\n•\nPractice manual semiconductor FOL process based\non instruction and company procedures\n•\nLearn and identify machines alarms/errors\n•\nDetermine applicable out-of-control action\nplan(OCAP) for semiconductor FOL\n• Perform visual/