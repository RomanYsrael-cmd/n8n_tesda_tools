aluate hazard\nand risks\n• Describe effects of safety hazards\n• Group\ndiscussion\n• Oral evaluation\n\n•Read\n• Lecture\n• Written\nexamination\n\no Threshold Limit Value –TLV\n\n• Practice reporting safety hazards\n• Role play\n• Observation\n\n--- PDF PAGE 50 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n46\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Demonstrate evaluating hazards and risks\nusing communication equipment\n• Demonstration\n• Observation\n\n4.3 Control hazards\nand risks\n• Describe :\no Organization safety and health protocol\n• Group\ndiscussion\n• Oral evaluation\n\no Company emergency procedure practices\n\n• Practice personal hygiene\n• Demonstration\n• Observation\n\n• Practice drills on responding to emergency\n• Demonstration\n• Simulation\n• Observation\n\n4.4 Maintain\noccupational\nhealth and safety\nawareness\n• Identify emergency-related drills information\n• Lecture\n• Written\nexamination\n\n• Practice occupational safety and health\nstandards on personal records in the\nworkplace\n• Role play\n• Observation\n\n• Practice emergency related drills in the\nworkplace\n• Demonstration\n• Simulation\n\n• Observation\n\n--- PDF PAGE 51 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n47\n\nCOMMON COMPETENCIES\n(16 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n1. Use Hand\nTools\n1.1 Plan and\nprepare for\ntasks to be\nundertaken\n Plan and prepare for task/activity\n Identify different types and functions of hand tools\n Identify electronics hand tools and their uses\n Identify function, operation and common faults in\nelectronics hand tools\n Lecture /\nDemonstration\n Distance\neducation\nFilm Showing\n Written/Oral\nexamination\n Practical\ndemonstration\n½ hour\n1.2 Prepare hand\ntools\n Practic