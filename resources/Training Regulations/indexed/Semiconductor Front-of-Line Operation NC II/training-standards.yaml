itten\nexamination\n\n• Determine personal career development\nneeds\n• Group\ndiscussion\n• Oral evaluation\n\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazard\nand risks\n• Describe OHS procedures, practices and\nregulations\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n\n•Read\n• Lecture\n• Written\nexamination\n\no OHS indicators\n\no Organizational contingency practices\n\n• Practice hazards/risks identification and\ncontrol\n\n4.2 Evaluate hazard\nand risks\n• Describe effects of safety hazards\n• Group\ndiscussion\n• Oral evaluation\n\n•Read\n• Lecture\n• Written\nexamination\n\no Threshold Limit Value –TLV\n\n• Practice reporting safety hazards\n• Role play\n• Observation\n\n--- PDF PAGE 50 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n46\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Demonstrate evaluating hazards and risks\nusing communication equipment\n• Demonstration\n• Observation\n\n4.3 Control hazards\nand risks\n• Describe :\no Organization safety and health protocol\n• Group\ndiscussion\n• Oral evaluation\n\no Company emergency procedure practices\n\n• Practice personal hygiene\n• Demonstration\n• Observation\n\n• Practice drills on responding to emergency\n• Demonstration\n• Simulation\n• Observation\n\n4.4 Maintain\noccupational\nhealth and safety\nawareness\n• Identify emergency-related drills information\n• Lecture\n• Written\nexamination\n\n• Practice occupational safety and health\nstandards on personal records in the\nworkplace\n• Role play\n• Observation\n\n• Practice emergency related drills in the\nworkplace\n• Demonstration\n• Simulation\n\n• Observation\n\n--- PDF PAGE 51 ---\nTR-SEMICONDACTOR FRONT-OF-LINE OPERATIONS NC II (NEW) PROMULGATED DEC. 16, 2015\n47\n\nCOMMON COMPETENCIES\n(16 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDur