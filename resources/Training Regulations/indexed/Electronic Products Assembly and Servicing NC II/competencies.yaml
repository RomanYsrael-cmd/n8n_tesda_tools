        "source_text": "--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 33  \n \n \n       \n \n \n \n \n \n \nUNIT OF COMPETENCY:   TEST ELECTRONIC COMPONENTS   \nUNIT CODE                     :   ELC724xxx  \nDESCRIPTON                 :   This unit covers the knowledge, skills and attitudes required to \ntest electronic components. It includes competencies in \ndetermining the criteria for testing electronics components, \nplanning an approach for component testing, testing the \ncomponents and evaluating the testing process. \n \nELEMENTS \nPERFORMANCE CRITERIA \n(Italicized bold terms are elaborated in the range of variables) \n1. Determine criteria \nfor testing \nelectronics \ncomponents \n1.1 \nWork instructions are obtained and clarified based on job \norder or client requirements \n1.2 \nResponsible person is consulted for effective and proper \nwork coordination \n1.3 Data sheets/Application notes are obtained and interpreted \nbased on manufacturer’s specifications \n1.4 Testing criteria are defined to ensure that components \nmeet technical and quality requirements \n1.5 Document and communicate testing criteria to relevant \npersonnel \n2. Plan an approach \nfor component \ntesting \n2.1 \nVarious testing methods are Identified based on types of \nelectronic components \n2.2 \nCharacteristics and appropriateness of testing methods to be \nused during development and on completion is determined \n2.3 \nTesting methods are considered/selected in relation to \nappropriate testing strategy \n2.4 \nPlan for testing components is developed at specified points \nduring development and on completion \n2.5 \nRequired test & measuring instruments and tools are \nprepared and checked in accordance with established \nprocedures \n2.6 \nRecords system is established to document testing results, \nincluding problems and faults\n3. Test components  \n3.1 \nTesting methods are applied to ensure that products meet \ncreative, production and technical requirements \n3.2 \nProblems and faults detected by testing are recorded and \nremedial steps taken in records system is documented \n3.3 \nProblems and faults detected during testing are resolved in \naccordance with agreed project or industry practice \n3.4 \nEvaluate final products against the previously determined \ncriteria \n3.5 \nTesting process is documented and summarized evaluation \nreport is submitted to relevant personnel\n4. Evaluate the testing \nprocess \n4.1 \nTesting methods that were successful and those that led to \ndifficulties are identified based on industry standards \n4.2 \nTesting process and records system are evaluated based on \nstandard procedures \n4.3 \nTest results/findings are documented for subsequent \ncomponents testing.\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 34  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Responsible person \nRelevant personnel may include: \n1.1. Immediate supervisor \n1.2. Manager \n2. Testing criteria  \nTesting criteria may include: \n2.1. controls \n2.2. effectiveness \n2.3. efficiency \n2.4. bug detection \n2.5. functionality, including flow \n2.6. interoperability \n2.7. performance \n2.8. reliability \n2.9. operating parameters \n3. Testing methods  \nTesting methods may include: \n3.1. automated \n3.2. debugging \n3.3. inspection \n3.4. platform testing \n3.5. prototyping \n4. Types of electronic components \n4.1. Passive components \n4.2. Active components \n4.3. Dynamic components \n4.4. Hybrid components \n5. Testing strategy  \nTesting strategy may be determined by: \n5.1. Passive testing \n5.2. Dynamic testing \n5.3. In-circuit testing \n6. Test and measuring instruments\nTest and measuring instruments may include: \n6.1. Variable DC power supply \n6.2. Digital VOM \n6.3. analog VOM \n6.4. dual trace triggered oscilloscope \n6.5. function generator \n7. Tools  \nTools may include: \n7.1. set of pliers \n7.2.  set of screw drivers \n7.3. set of wrenches \n7.4.  Hand drills, \n7.5.  Hack saw \n7.6.  set of files \n7.7.  tin snip \n7.8. hammer\n\n--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 35  \n \n \n       \n \n \n \n \n \n \n8. Records system \nRecords system may include: \n8.1. metadata that includes: \n8.1.1. description of fault \n8.1.2. identification of code \n8.1.3. user responses \n8.1.4. written or verbal comments \n8.1.5. quantitative data \n8.1.6. remedial action taken \n8.1.7. retest result \n8.1.8. date \n8.1.9. tester's details \n8.2. questionnaire \n8.3. survey\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 36  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1 Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nDetermined criteria for testing electronics components \n1.2 \nPlanned an approach for component testing \n1.3 \nTested components \n1.4 \nEvaluated the testing process \n \n2 Required knowledge \nand attitude \n \n2.1 \n