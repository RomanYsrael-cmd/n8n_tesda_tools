          "source_text": ") \n1. Prepare unit, tools and \nworkplace for \ninstallation / servicing \n \n1.1 Complete check-up of industrial electronic components, \nproducts and systems is conducted and defects are identified, \nverified and documented against customer description. \n1.2 Repair/maintenance history is verified in line with the company \nprocedures. \n1.3 Service manuals and service information required for \nrepair/maintenance are acquired as per standard procedure. \n1.4 Workplace is set/prepared for repair job in line with the company \nrequirements. \n1.5 Necessary tools, test instruments and personal protective \nequipment are prepared in line with job requirements \n2. Install industrial \nelectronic modules/ \nproducts/ systems \n2.1 \nMaterials necessary to complete the work are obtained in \naccordance with job requirements. \n2.2 \nIndustrial electronic modules/ products/systems are installed in \naccordance with manufacturer’s instructions, requirements, and \nwithout damage to the surrounding place or environment \n2.3 \nDevices are tested in accordance with standard procedures. \n2.4 \nFinal inspections are undertaken to ensure that the installed \ndevices conforms to technical requirements. \n2.5 \nUnplanned events or conditions are responded to in accordance \nwith established procedures \n2.6 \nWork site is cleaned and cleared of all debris and left safe in \naccordance with the company requirements \n2.7 \nReport on installation and testing of equipment is prepared \naccording to company’s procedures/policies.\n3. Diagnose faults and \ndefects of industrial \nelectronic modules/ \nproducts/systems \n \n3.1 Systematic pre-testing procedure is observed in accordance \nwith manufacturer’s instructions. \n3.2 System defects/Fault symptoms are identified using appropriate \ntools and equipment and troubleshooting techniques and in \naccordance with safety procedures \n3.3 Test instruments required for the job are used in accordance \nwith user manuals. \n3.4 Circuits are checked and isolated using specified testing \nprocedures  \n3.5 Identified defects and faults are explained to the responsible \nperson in accordance with enterprise or company policy and \nprocedures \n3.6 Control settings/adjustments are checked in conformity with \nservice-manual specifications.  \n3.7 Results of diagnosis and testing are documented accurately and \ncompletely within the specified time. \n3.8 Customers are advised/informed regarding the status and \nserviceability of the unit according to procedures.\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 50  \n \n \n       \n \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized bold terms are elaborated in the range of variables) \n4. Maintain/Repair \nindustrial electronic \nproducts \n \n4.1 Personal protective equipment is used in accordance with \nOccupational Health and Safety practices. \n4.2 Electro-static discharge (ESD) protection procedure is followed in \naccordance with current industry standards.  \n4.3 Defective parts/components are replaced with identical or \nrecommended appropriate equivalent ratings \n4.4 Repaired or replaced parts/components are soldered/mounted in \naccordance with the current industry standards. \n4.5 Control settings/adjustments are performed in conformity with \nservice-manual specifications \n4.6 Repair activity is performed within the required timeframe \n4.7 Care and extreme precaution in handling the unit/product is \nobserved as per OHS procedures \n4.8 Cleaning of unit is performed in accordance with standard \nprocedures  \n4.9 Excess components and materials are disposed of based on \nWEEE directives and 3Rs waste management program.\n5. Reassemble and test \nrepaired industrial \nelectronic products \n \n5.1 Repaired units are reassembled according to procedures  \n5.2 Reassembled units are subjected to final testing and cleaning in \nconformity with manufacturer’s specifications \n5.3 Service completion procedures and documentations are \ncomplied with based on manual. \n5.4 Waste materials are disposed of in accordance with \nenvironmental requirements.\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 51  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Industrial \nelectronics \nproducts and \nsystems \nIndustrial electronics products and systems include -- \n1.1 \nIndustrial Electronic Components  \n1.2 \nIndustrial Electronic Product* \n1.2.1 Control boards and modules \n1.2.2 Motor controllers and drives  \n1.2.3 Sensors and input devices \n1.2.4 Actuators and output devices \n1.2.5 Opto-electronics equipment and devices  \n \n* NOTE: Only the electronics portion of the products and/or systems \nis covered in this unit of competency. \n \n2. Service manuals \n2.1 Service manual/schematic diagram/parts list \n2.2 Operating instructions/User’s/Owner’s manual \n \n3. Service Information \n3.1 Job Report Sheets \n3.2 Job Order \n3.3 Bill of materials \n3.4 Customer index \n3.5 Service flowchart \n3.6 Stock and inventory record \n3.7 Requisition slips (for acquisition of parts) \n3.8 Supplier Index \n4. Tools, Materials \nand Test \nInstruments \nMay include but not limited to: \n4.1 Variable power supply \n4.2 Step-down transformer \n4.3 Soldering iron/gun \n4.4 Desoldering tools \n4.5 Screwdriver (assorted) \n4.6 Wrenches (assorted) \n4.7 Allen wrench/key \n4.8 Signal generator - AF/RF \n4.9 Multi-testers (analog/digital) \n4.10 Utility knife/stripper \n4.11  Pliers (assorted) \n4.12 Test jig \n \n \n4.13 ESD-free work bench with \nmirror \n4.14 Oscilloscope \n4.15 High-grade magnifying glass \nwith lamp \n4.16 Flashlight \n4.17 Cleaning brush \n4.18 High voltage probe \n4.19 Ball peen hammer \n4.20 Soldering lead \n4.21 Wires \n4.22 Assorted industrial electronic \ncomponents \n \n5. Personal protective \nequipment  \nMay include but not limited to: \n5.1 Working clothes/Apron \n5.2 Hand gloves \n5.3 Face/Dust Mask \n5.4 Goggles\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 52  \n \n \n       \n \n \n \n \n \n \nVARIABLE \nRANGE \n6. Pre-testing \nprocedures \n6.1 Visual inspection of the unit with power off \n6.2 Interview of customer re history of unit \n6.3 Operate the unit according to manual to confirm defects \n7. Troubleshooting \ntechniques \nMay include: \n7.1  Sensory methods \n Visual checks \n Listening for telltale sounds \n Lookout for unusual smells \n Touching or feeling \n7.2 Component substitution \n7.3 Signal injection and tracing \n7.4 Voltage and current measurement \n7.5 Continuity/resistance testing \n7.6 Waveform analysis \n7.7 Display analysis (for video displays) \n7.8 Circuit analysis \n8. Responsible \npersons \n8.1 Immediate supervisor \n8.2 Service supervisor/manager \n9. OHS requirements \nin accordance with \nlegislation & \nregulations  \n9.1 Use of proper tools and equipment \n9.2 Observe workplace environment and safety \n9.3 Adherence to safety requirements in handling the unit \n9.4 Use of protective device/shields \n9.5 Philippine Electronics Code \n10. Environmental \nRequirements \n10.1 Proper disposal of chemicals and components shall be based on \nexisting requirements of the law and chemical waste management  \n10.2 Non-biodegradable parts or materials shall be packed and labeled \nproperly for disposal.\n\n--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 53"
