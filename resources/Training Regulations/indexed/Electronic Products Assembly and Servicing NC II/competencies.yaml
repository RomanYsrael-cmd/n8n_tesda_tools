        "source_text": "--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 43  \n \n \n       \n \n \n \n \n \n \nUNIT OF COMPETENCY:    SERVICE CONSUMER ELECTRONIC PRODUCTS AND \nSYSTEMS \nUNIT CODE                     :    ELC724336 \n \nDESCRIPTON                 :    This unit covers the knowledge, skills and attitudes required \nto install and service consumer electronic products and \nsystems. It includes competencies in installing, maintenance \nand repairing audio-video products/ systems and domestic \nelectronic appliances and home security system.  \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized bold terms are elaborated in the range of variables) \n1. Prepare unit, tools \nand workplace for \ninstallation and \nservice \n1.1 Complete check-up of consumer electronic products and \nsystems is conducted and defects are identified, verified and \ndocumented against customer description. \n1.2 Manuals and service information required for installation are \nacquired as per standard procedure. \n1.3 Repair/maintenance history is verified in line with the company \nprocedures. \n1.4 Workplace is set/prepared for installation job in line with the \nclient’s requirements. \n1.5 Necessary tools, test instruments and personal protective \nequipment are prepared in line with job requirements\n2. Install consumer \nelectronic products \nand systems \n2.1 Materials necessary to complete the work are obtained in \naccordance with job requirements. \n2.2 Consumer electronic products and systems are installed in \naccordance with manufacturer’s instructions, requirements, and \nwithout damage to the surrounding place or environment \n2.3 Devices are tested in accordance with standard procedures. \n2.4 Final inspections are undertaken to ensure that the installed \ndevices conforms to technical requirements. \n2.5 Unplanned events or conditions are responded to in accordance \nwith established procedures \n2.6 Work site is cleaned and cleared of all debris and left safe in \naccordance with the company requirements \n2.7 Report on installation and testing of equipment is prepared \naccording to company’s procedures/policies. \n3. Diagnose faults and \ndefects of consumer \nelectronic products \nand systems \n \n3.1 Systematic pre-testing procedure is observed in accordance \nwith manufacturer’s instructions. \n3.2 System defects/Fault symptoms are identified using appropriate \ntools and equipment and troubleshooting techniques and in \naccordance with safety procedures \n3.3 Test instruments required for the job are used in accordance with \nuser manuals. \n3.4 Circuits are checked and isolated using specified testing \nprocedures  \n3.5 Identified defects and faults are explained to the responsible \nperson in accordance with enterprise or company policy and \nprocedures \n3.6 Control settings/adjustments are checked in conformity with \nservice-manual specifications.  \n3.7 Results of diagnosis and testing are documented accurately and \ncompletely within the specified time. \n3.8 Customers are advised/informed regarding the status and \nserviceability of the unit according to procedures.\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 44  \n \n \n       \n \n \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized bold terms are elaborated in the range of variables) \n4. Maintain/Repair \nconsumer electronic \nproducts \n \n4.1 Personal protective equipment is used in accordance with \nOccupational Health and Safety practices. \n4.2 Electro-static discharge (ESD) protection procedure is followed in \naccordance with current industry standards.  \n4.3 Defective parts/components are replaced with identical or \nrecommended appropriate equivalent ratings \n4.4 Repaired or replaced parts/components are soldered/mounted in \naccordance with the current industry standards. \n4.5 Control settings/adjustments are performed in conformity with \nservice-manual specifications \n4.6 Repair activity is performed within the required timeframe \n4.7 Care and extreme precaution in handling the unit/product is \nobserved as per procedures \n4.8 Cleaning of unit is performed in accordance with standard \nprocedures  \n4.9 Excess components and materials are disposed of based on \nWEEE directives and 3Rs waste management program \n \n5. Re-assemble and test \nrepaired consumer \nelectronic product \n \n5.1 Repaired units are reassembled according to procedures  \n5.2 Reassembled units are subjected to final testing and cleaning in \nconformity with manufacturer’s specifications \n5.3 Service completion procedures and documentations are complied \nwith based on manual. \n5.4 Waste materials are disposed of in accordance with \nenvironmental requirements.\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 45  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Consumer \nelectronic products \nand systems \n1. Audio-Video products and systems include -- \n1.1 Radio receivers \n1.2 Audio recorders \n1.3 Videoke systems \n1.4 Electronic musical instruments/keyboards \n1.5 DVD/VCD Player  \n1.6 Professional audio/Public-address (PA) systems  \n1.7 Television \n1.7.1 \nHome \n1.7.2 \nPortable \n1.8 Home theater system \n1.9 PC Monitors \n \n2. Domestic Electronic Appliances  include -- \n2.1 Electronic-controlled Washing Machines  \n2.2 Home Food Processing equipment \n2.3 Microwave Oven \n2.4 Electronic Clock \n2.5 Rechargeable Light \n2.6 Electronic-controlled Light  \n2.7 Home security equipment \n2.8 Induction stove \n2.9 Solar-powered management system \n2. Service manuals \n2.1. Service manual/schematic diagram/parts list \n2.2. Operating instructions/User’s/Owner’s manual \n3. Service Information \n3.1. Job Report Sheets \n3.2. Job Order \n3.3. Bill of materials \n3.4. Customer index \n3.5. Service flowchart \n3.6. Stock and inventory record \n3.7. Requisition slips (for acquisition of parts) \n3.8. Supplier Index \n4. Tools, Materials \nand Test \nInstruments \nMay include: \n4.1 \nVariable power supply \n4.2 \nVariable transformer \n4.3 \nSoldering iron \n4.4 \nHot air soldering station \n4.5 \nTable top reflow oven \n4.6 \nDesoldering tools \n4.7 \nScrewdriver (assorted) \n4.8 \nWrenches (assorted) \n4.9 \nAllen wrench/key \n4.10 \nFunction generator  \n4.11 \nMulti-testers \n(analog/digital) \n4.12 \nUtility knife/stripper \n4.13 \nPliers (assorted) \n \n4.14 \nESD-free work bench with \nmirror \n4.15 \nTest jigs \n4.16 \nOscilloscope, digital \n4.17 \nHigh-grade magnifying \nglass with lamp \n4.18 \nFlashlight/headlamp \n4.19 \nCleaning brush \n4.20 \nSoldering wire \n4.21 \nSMD soldering paste \n4.22 \nStranded/solid/hook-up \nwires \n4.23 \nAssorted electronic \ncomponents\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 46  \n \n \n       \n \n \n \n \n \n \nVARIABLE \nRANGE \n5. Pre-testing \nprocedures \n5.1. \nVisual inspection of the unit with power off \n5.2. \nInterview of customer re history of unit \n5.3. \nOperate the unit according to manual to confirm defects \n6. Troubleshooting \ntechniques \nMay include: \n6.1 sensory methods \nVisual checks \nListening for telltale sounds \nLookout for unusual smells \nTouching or feeling \n6.2 Component substitution \n6.3 Signal injection and tracing \n6.4 Voltage and current measurement \n6.5 Continuity/resistance testing \n6.6 Waveform analysis \n6.7 Display analysis (for video displays) \n6.8 Circuit analysis \n7. Responsible \npersons \n7.1. \nImmediate supervisor \n7.2. \nService supervisor/manager \n8. Environmental \nRequirements \n8.1. \nProper disposal of chemicals and components shall be based \non existing requirements of the law and chemical waste \nmanagement  \n8.2. \nNon-biodegradable parts or materials shall be packed and \nlabeled properly for disposal. \n8.3. \nWEEE requirements\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 47  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1 Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Prepared the unit and required materials, tools equipment and \nworkplace properly for installation and service. \n1.2 Installed consumer electronic products and systems \n1.3 Diagnosed faults and defects  \n1.4 Maintained/Repaired consumer electronic products \n1.5 Re-assembled and tested repaired consumer electronic product \n1.6 Applied safety rules and procedures \n2 Required knowledge \nand attitude \n \n2.1 Mensuration/Mathematics \n2.1.1 Conversion of units \n2.1.2 Applied mathematics \n2.2 Drawing and Schematic Diagram  \n2.2.1 Reading and interpreting orthographic projections and \nisometric  views \n2.2.2 Reading and interpreting electronic schematic symbols \nand diagram  \n2.3 Environmental Safety  \n2.3.1 Work Safety requirements and economy of materials \nwith durability \n2.3.2 Knowledge in 5S application and observation of \nrequired procedure  \n2.3.3 Practicing 3Rs – reduce, re-use, recycle/recover \n2.3.4 Managing waste from electrical and electronic \nequipment (WEEE) \n2.4 Materials, tools/instruments & equipment uses and \nspecifications \n2.4.1 Identification of hand and power tools \n2.4.2 Proper care and use of tools \n2.4.3 Identification of test and measuring instruments \n2.4.4 Proper care and use of test and measuring instruments \n2.5 System and Processes \n2.5.1 Principles of electrical circuits \n2.5.2 Fundamentals of direct current circuits \n2.5.3 Fundamentals of alternating current circuits \n2.5.4 Fundamentals of electronic components and circuits \n2.5.5 Fundamentals of digital logics, components & circuits \n2.5.6 Fundamentals of microprocessor circuits and \nprogramming \n2.5.7 Analysis of troubles and isolation techniques \n2.5.8 Principles of sound and acoustics \n2.5.9 Fundamentals of audio amplifiers \n2.5.10 \nFundamentals of audio source & noise reduction \nsystem \n2.5.11 \nFundamentals of AM & FM Receivers \n2.5.12 \nPrinciples of vision and  color \n2.5.13 \nFundamentals of color television \n2.5.14 \nFundamentals of video sources & noise reduction \nsystem \n2.6 Theories and Principles \n2.6.1 \nAM transmission and reception \n2.6.2 \nFM transmission and reception \n2.6.3 \nAnalog TV transmission and reception\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 48  \n \n \n       \n \n \n \n \n \n \n2.6.4 \nDigital HDTV transmission and reception \n2.6.5 \nAudio Video sources and formats \n2.6.6 \nPulse Code Modulation  \n2.6.7 \nHome theater system   \n2.6.8 \nDigital noise reduction system \n2.6.9 \nCCTV system \n2.6.10 \nInfrared remote control system \n2.6.11 \nMotor and motor control system \n2.6.12 \nLED and  lighting system \n2.6.13 \nHeat and heating control system \n2.6.14 \nSolar cell and battery management system \n2.6.15 \nMicrocontroller \n2.6.16 \nMicrocontroller interfacing \n2.7 Consumer electronic products and systems installation \nprocedures \n2.8 Systematic pre-testing procedures  \n2.9 System defects/Fault symptoms \n2.10 Mechanical and electrical/electronic testing \n2.11 Commissioning procedures \n2.12 3Rs waste management programs \n2.13 Rules and conventions \n2.13.1 Philippine Electronics Code \n2.13.2 RoHS/WEEE Directives \n2.13.3 RA 9292 – ECE Law commissioning procedures \n \n3 Required skills \n \n3.1 Application of troubleshooting technique \n3.2 Using and maintaining test instruments, tools, & equipment \n3.3 Application of work safety practices and time management \n3.4 Application of substitution technique \n3.5 Soldering/desoldering and wiring/cabling techniques \n3.6 Schematic diagram reading skills \n4 Method of assessment \n \nCompetency may be assessed through: \n4.1 Practical Demonstration w/ oral questioning \n4.2 Interview \n4.3 Portfolio \n \n \n5 Resource implications \n \nThe following resources must be provided: \n5.1 Tools, equipment and test instruments \n5.2 Needed audio-video products and systems \n5.3 Needed consumer appliances \n5.4 Service manuals/schematics  \n5.5 ESD free working area/bench \n5.6 Needed electronic spare parts/supplies \n6 Context of \nassessment \n \n6.1 Assessment maybe conducted in the workplace or in a \nsimulated workplace setting\n",
