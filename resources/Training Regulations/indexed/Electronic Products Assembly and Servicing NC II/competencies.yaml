 limited to:\n5.1.1 Brackets\n5.1.2 Clamps\n\n--- PDF PAGE 34 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 32\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Undertook work safely and according to workplace\nand standard procedures\n1.2. Used appropriate termination/ connection methods\n1.3. followed correct sequence in termination /\nconnection process\n1.4. Conducted testing of terminated connected\nelectrical wiring/electronic circuits using appropriate\nprocedures and standards\n2. Underpinning knowledge\n2.1. Use of tools\n2.2. Use of test instruments/equipment\n2.3. Electrical theory\n2.4. Single phase AC principles\n2.5. Wiring techniques\n2.6. DC power supplies\n2.7. Soldering\n3. Underpinning skills\n3.1. Reading skills required to interpret work instruction\n3.2. Communication skills\n3.3. Soldering techniques\n4. Method of assessment\n4.1. The assessor may select at least two (2) of the\nfollowing assessment methods to objectively\nassess the candidate:\n4.1.1. Observation\n4.1.2. Oral Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n5.1. Tools for measuring, cutting, drilling,\nassembling/disassembling, connecting. Tool set\nincludes the following but not limited to:\n5.1.1. Screw drivers\n5.1.2. Pliers\n5.1.3. Cutters\n6. Context of Assessment\n6.1. Assessment may be conducted in the workplace or\nin a simulated work environment\n\n--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 33\n\nUNIT OF COMPETENCY: TEST ELECTRONIC COMPONENTS\nUNIT CODE : ELC724xxx\nDESCRIPTON : This unit covers the knowledge, skills and attitudes required to\ntest electronic components. It includes competencies in\ndetermining the criteria for testing electronics components,\nplanning an approach for component testing, testing the\ncomponents and evaluating the testing process.\n\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized bold terms are elaborated in the range of variables)\n1. Determine criteria\nfor testing\nelectronics\ncomponents\n1.1\nWork instructions are obtained and clarified based on job\norder or client requirements\n1.2\nResponsible person is consulted for effective and proper\nwork coordination\n1.3 Data sheets/Application notes are obtained and interpreted\nbased on manufacturer’s specifications\n1.4 Testing criteria are defined to ensure that components\nmeet technical and quality requirements\n1.5 Document and communicate testing criteria to relevant\npersonnel\n2. Plan an approach\nfor component\ntesting\n2.1\nVarious testing methods are Identified based on types of\nelectronic components\n2.2\nCharacteristics and appropriateness of testing methods to be\nused during development and on completion is determined\n2.3\nTesting methods are considered/selected in relation to\nappropriate testing strategy\n2.4\nPlan for testing components is developed at specified points\nduring development and on completion\n2.5\nRequired test & measuring instruments and tools are\nprepared and checked in accordance with established\nprocedures\n2.6\nRecords system is established to document testing results,\nincluding problems and faults\n3. Test components\n3.1\nTesting methods are applied to ensure that products meet\ncreative, production and technical requirements\n3.2\nProblems and faults detected by testing are recorded and\nremedial steps taken in records system is documented\n3.3\nProblems and faults detected during testing are resolved in\naccordance with agreed project or industry practice\n3.4\nEvaluate final products against the previously determined\ncriteria\n3.5\nTesting process is documented and summarized evaluation\nreport is submitted to relevant personnel\n4. Evaluate the testing\nprocess\n4.1\nTesting methods that were successful and those that led to\ndifficulties are identified based on industry standards\n4.2\nTesting process and records system are evaluated based on\nstandard procedures\n4.3\nTest results/findings are documented for subsequent\ncomponents testing.\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 34\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Responsible person\nRelevant personnel may include:\n1.1. Immediate supervisor\n1.2. Manager\n2. Testing criteria\nTesting criteria may include:\n2.1. controls\n2.2. effectiveness\n2.3. efficiency\n2.4. bug detection\n2.5. functionality, including flow\n2.6. interoperability\n2.7. performance\n2.8. reliability\n2.9. operating parameters\n3. Testing methods\nTesting methods may include:\n3.1. automated\n3.2. debugging\n3.3. inspection\n3.4. platform testing\n3.5. prototyping\n4. Types of electronic components\n4.1. Passive components\n4.2. Active components\n4.3. Dynamic components\n4.4. Hybrid components\n5. Testing strategy\nTesting strategy may be determined by:\n5.1. Passive testing\n5.2. Dynamic testing\n5.3. In-circuit testing\n6. Test and measuring instruments\nTest and measuring instruments may include:\n6.1. Variable DC power supply\n6.2. Digital VOM\n6.3. analog VOM\n6.4. dual trace triggered oscilloscope\n6.5. function generator\n7. Tools\nTools may include:\n7.1. set of pliers\n7.2. set of screw drivers\n7.3. set of wrenches\n7.4. Hand drills,\n7.5. Hack saw\n7.6. set of files\n7.7. tin snip\n7.8. hammer\n\n--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 35\n\n8. Records system\nRecords system may include:\n8.1. metadata that includes:\n8.1.1. description of fault\n8.1.2. identification of code\n8.1.3. user responses\n8.1.4. written or verbal comments\n8.1.5. quantitative data\n8.1.6. remedial action taken\n8.1.7. retest result\n8.1.8. date\n8.1.9. tester's details\n8.2. questionnaire\n8.3. survey\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 36\n\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDetermined criteria for testing electronics components\n1.2\nPlanned an approach for component testing\n1.3\nTested components\n1.4\nEvaluated the testing process\n\n2 Required knowledge\nand attitude\n\n2.1\nMensuration/Mathematics\n2.1.1 Conversion of Units\n2.1.2 Applied Mathematics\n2.2\nSafety\n2.2.1 Work Safety requirements and economy of\nmaterials with durability\n2.2.2 Knowledge in 5S application and observation of\nrequired timeframe\n2.2.3 Knowledge of proper handling and disposal of\nchemicals\n2.3\nMaterials, tools and equipment uses and specifications\n2.3.1 Identification of hand and power tools\n2.3.2 Proper care and use of tools\n2.4\nSystems and Processes\n2.4.1\nPrinciples of electrical/electronic circuits\n2.4.2\nIdentifying sources of electricity\n2.4.3\nIdentifying conductors and insulators\n2.4.4\nDescribing resistance and identify resistors\n2.4.5\nSupplying different voltage using variable power\nsupply\n2.4.6\nMeasuring resistance using VOM\n2.4.7\nTesting resistors\n2.4.8\nMeasuring current and voltage using VOM\n2.4.9\nAnalyzing simple circuit using ohms and power\nlaw\n2.4.10 Analyzing series/parallel circuits using ohms and\npower law\n2.4.11 Describing alternating current circuits\n2.4.12 Observing waveform using oscilloscope\n2.4.13 generating waveform in various frequency using\nfunction generator\n2.4.14 Measuring frequency using oscilloscope\n2.4.15 Measuring capacitance using VOM\n2.4.16 Describing capacitance and identifying\ncapacitors\n2.4.17 Testing capacitors\n2.4.18 Analyzing series/parallel capacitances\n2.4.19 Describing inductance and identifying inductors\n2.4.20 Testing inductors\n2.4.21 analyzing series parallel inductors\n2.4.22 describing the characteristic of transformers\n2.4.23 describing and identifying semiconductor diode\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 37\n\n2.4.24 testing semiconductor diode\n2.4.25 analyzing rectifier circuits\n2.4.26 describing and identifying bipolar transistor\n2.4.27 testing bipolar transistor\n2.4.28 analyzing amplifier circuit\n2.4.29 analyzing multi-vibrator circuit\n2.4.30 describing and analyzing digital gate\n2.4.31 testing logic gates\n2.4.32 analyzing logic networks\n2.4.33 analyzing sequence circuits\n3 Required skills\n\n3.1\nWork efficiently & systematically\n3.2\nCommunication skills\n3.3\nUse and maintenance of tools and equipment\n3.4\nSkills in testing electronic components\n3.5\nWork safety practices and time management\n3.6\nProblem solving skills\n3.7\nReading skills\n4 Method of\nassessment\n\nCompetency may be assessed through two or more of the\nfollowing methods:\n4.1\nDirect observation of application to tasks and questions\nrelated to required knowledge\n4.2\nDemonstration with oral questioning\n4.3\nThird party report\n4.4\nWritten test\n4.5\nPortfolio\n5 Resource\nimplications\n\nThe following resources must be provided:\n5.1\nTools and equipment (see range of variables)\n5.2\nWorking area/bench\n5.3\nElectronic components\n5.4\nTesting instruments and equipment\n5.5\nAssessment rating sheet\n5.6\nReporting forms\n6 Context of\nassessment\n6.1\nAssessment maybe conducted in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 38\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: ASSEMBLE ELECTRONIC PRODUCTS\nUNIT CODE : ELC724335\n\nDESCRIPTON : This unit covers the knowledge, skills and attitudes required to\nassemble electronic products and systems for consumer/\nindustrial uses/applications. It consist of competencies in\nidentifying and preparing electronic components and circuits,\npreparing/making printed circuit board (PCB) modules, mounting\nand soldering of components, assembling electronic products\nand performing mechanical and electrical/electronic tests.\n\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized bold terms are elaborated in the range of variables)\n1. Prepare to\nassemble\nelectronic\nproducts\n1.1 Assembly workplace is prepared in accordance with OH&S policies\nand procedures\n1.2 Established risk control measures for work preparation are followed.\n1.3 Work instructions are obtained and clarified based on job order or\nclient requirements\n1.4 Responsible person is consulted for effective and proper work\ncoordination\n1.5 Required materials, tools and equipment are prepared and\nchecked in accordance with established procedures\n1.6 Parts and components needed to complete the work are identified,\nprepared and obtained according to requirements\n2. Prepare/\nMake PCB\nmodules\n2.1 PCB layout is verified for conformity with the schematic diagram in\naccordance with the layout rules\n2.2 PCB layout is transferred to copper-cladded board following\nacceptable methods and standards\n2.3 Visual inspection is performed based on standards procedures.\n2.4 Thru-hole is drilled based on standards procedures\n2.5 PCB is cleaned based on standards procedures\n2.6 Functionality of PCB is tested and visual inspection is performed\nbased on standards procedures\n3. Mount and\nsolder\nelectronic\ncomponents\n\n3.1 Knowledge of lead and lead-free soldering characteristics and\nrequirements are applied to mounting and soldering process in\naccordance with OH&S standards\n3.2 Components are mounted and soldered in accordance with\nsoldering principles.\n3.3 Soldering/Desoldering techniques and procedures are applied in\naccordance with established standards and requirements.\n3.4 Soldered products are checked and complied with international\nstandards and task specifications\n4. Perform\nelectronic\nproducts\nassembly\n4.1 Work instructions is followed based on job order or client\nrequirements\n4.2 Assembly procedures are performed in accordance with OH&S\npolicies and work instructions\n4.3 Modules and accessories are connected/integrated into the final\nproduct based on the client specifications\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 39\n\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized bold terms are elaborated in the range of variables)\n\n4.4 Excess components and materials are disposed of based on WEEE\ndirectives and 3Rs waste management program.\n\n5. Test and\ninspect\nassembled\nelectronic\nproducts\n5.1 Finished products are subjected to final visual/sensory inspection\nand testing in accordance with quality standards, procedures and\nrequirements\n5.2 Mechanical and electrical/electronic testing is performed in\naccordance with quality standards, procedures and requirements\n5.3 Work completion is documented and responsible person is informed\nin accordance with established procedures\n5.4 Housekeeping procedures are observed in accordance with 5S\ndiscipline and established procedures\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 40\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. OH&S policies and\nprocedures\nArrangements of enterprise to meet their legal and ethical obligations in\nensuring the workplace is safe and without risk to health. This may include:\n1.1\nHazard and risk assessment mechanisms\n1.2\nImplementation of safety regulations\n1.3\nSafety training\n1.4\nSafety systems incorporating:\n1.4.1\nWork clearance procedures\n1.4.2\nIsolation procedures\n1.4.3\nGas and vapor\n1.4.4\nMonitoring/testing procedures\n1.4.5\nUse of protective equipment and clothing\n1.5\nUse of codes of practice\n1.5.1\nPhilippine Electronics Code\n2. Responsible person\n2.1 Immediate supervisor\n2.2 Manager\n3. Materials, tools and\nequipment\nMay include:\n3.1\nVariable power supply\n3.2\nVariable transformer\n3.3\nSoldering iron\n3.4\nHot air soldering station\n3.5\nTable top reflow oven\n3.6\nDesoldering tools\n3.7\nScrewdriver (assorted)\n3.8\nWrenches (assorted)\n3.9\nAllen wrench/key\n3.10 Function/Signal generator\n3.11 Multi-testers (analog/digital)\n3.12 Utility knife/stripper\n3.13 Pliers (assorted)\n\n3.14 ESD-free work bench with\nmirror\n3.15 Oscilloscope, digital\n3.16 High-grade magnifying glass\nwith lamp\n3.17 Flashlight/headlamp\n3.18 Cleaning brush\n3.19 Soldering wire\n3.20 SMD soldering paste\n3.21 Stranded/solid/hook-up wires\n3.22 Assorted electronic components\n3.23 Assorted electronic sensors\n4. Layout rules\n4.1\nEMI\n4.2\nEMC\n\n5. Acceptable\nmethods\n5.1\nsilk screen\n5.2\nphoto transfer\n\n6. Mounting of\ncomponents\n6.1\nSurface mount\n6.2\nThru-hole mount\n6.3\nSocket mount\n\n7. Soldering principles\nThe four key principles to producing a good joint are:\n7.1\nEnsure the joint surfaces are clean and free from grease.\n7.2\nEnsure the temperature of the solder when making the joint is correct.\n7.3\nEnsure the heat is applied to the joint for the correct amount of time\n7.4\nEnsure the correct amount of solder is used.\n8. Soldering/\nDesoldering\nprocedures\n8.1\nHot iron soldering procedures\n8.2\nHot air soldering procedures\n9. Assembly\nprocedures\n9.1\nPrepare supplies, materials and equipment\n9.2\nFamiliarize with the diagram and the product\n9.3\nPerform assembly\n9.4\nCheck the assembled product\n10. Testing\n10.1 Aging test\n10.2 Substitution test\n10.3 Mechanical testing\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 41\n\nEVIDENCE GUIDE\n1 Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared electronics components for assembly\n1.2\nPrepared/Made printed circuit board modules\n1.3\nMounted and soldered electronic components\n1.4\nAssembled electronic components\n1.5\nTested and inspected assembled electronic products\n1.6\nApplied safety rules and procedures\n2 Required knowledge\nand attitude\n\n2.1\nMensuration/Mathematics\n2.1.1 Conversion of Units\n2.1.2 Applied Mathematics\n2.2\nEnvironmental Safety\n2.2.1 Work Safety requirements and economy of materials with\ndurability\n2.2.2 Knowledge in 5S application and observation of required\ntimeframe\n2.2.3 Knowledge of proper