ivers \n2.5.12 \nPrinciples of vision and  color \n2.5.13 \nFundamentals of color television \n2.5.14 \nFundamentals of video sources & noise reduction \nsystem \n2.6 Theories and Principles \n2.6.1 \nAM transmission and reception \n2.6.2 \nFM transmission and reception \n2.6.3 \nAnalog TV transmission and reception\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 48  \n \n \n       \n \n \n \n \n \n \n2.6.4 \nDigital HDTV transmission and reception \n2.6.5 \nAudio Video sources and formats \n2.6.6 \nPulse Code Modulation  \n2.6.7 \nHome theater system   \n2.6.8 \nDigital noise reduction system \n2.6.9 \nCCTV system \n2.6.10 \nInfrared remote control system \n2.6.11 \nMotor and motor control system \n2.6.12 \nLED and  lighting system \n2.6.13 \nHeat and heating control system \n2.6.14 \nSolar cell and battery management system \n2.6.15 \nMicrocontroller \n2.6.16 \nMicrocontroller interfacing \n2.7 Consumer electronic products and systems installation \nprocedures \n2.8 Systematic pre-testing procedures  \n2.9 System defects/Fault symptoms \n2.10 Mechanical and electrical/electronic testing \n2.11 Commissioning procedures \n2.12 3Rs waste management programs \n2.13 Rules and conventions \n2.13.1 Philippine Electronics Code \n2.13.2 RoHS/WEEE Directives \n2.13.3 RA 9292 – ECE Law commissioning procedures \n \n3 Required skills \n \n3.1 Application of troubleshooting technique \n3.2 Using and maintaining test instruments, tools, & equipment \n3.3 Application of work safety practices and time management \n3.4 Application of substitution technique \n3.5 Soldering/desoldering and wiring/cabling techniques \n3.6 Schematic diagram reading skills \n4 Method of assessment \n \nCompetency may be assessed through: \n4.1 Practical Demonstration w/ oral questioning \n4.2 Interview \n4.3 Portfolio \n \n \n5 Resource implications \n \nThe following resources must be provided: \n5.1 Tools, equipment and test instruments \n5.2 Needed audio-video products and systems \n5.3 Needed consumer appliances \n5.4 Service manuals/schematics  \n5.5 ESD free working area/bench \n5.6 Needed electronic spare parts/supplies \n6 Context of \nassessment \n \n6.1 Assessment maybe conducted in the workplace or in a \nsimulated workplace setting",
