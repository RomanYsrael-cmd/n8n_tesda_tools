        "evidence_guide": {
          "source_text": "1 Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nPrepared electronics components for assembly \n1.2 \nPrepared/Made printed circuit board modules \n1.3 \nMounted and soldered electronic components \n1.4 \nAssembled electronic components \n1.5 \nTested and inspected assembled electronic products \n1.6 \nApplied safety rules and procedures \n2 Required knowledge \nand attitude \n \n2.1 \nMensuration/Mathematics \n2.1.1 Conversion of Units \n2.1.2 Applied Mathematics \n2.2 \nEnvironmental Safety  \n2.2.1 Work Safety requirements and economy of materials with \ndurability \n2.2.2 Knowledge in 5S application and observation of required \ntimeframe \n2.2.3 Knowledge of proper handling and disposal of chemicals \n2.2.4 Safety handling of hand tools \n2.2.5 Practicing 3Rs – reduce, re-use, recycle/recover \n2.2.6 Managing waste from electrical and electronic \nequipment (WEEE) \n2.3 \nMaterials, tools and equipment uses and specifications \n2.3.1 Identification of hand and power tools \n2.3.2 Proper care and use of tools \n2.4 \nTheories and Principles \n2.4.1 \nPCB problems and solutions \n2.4.2 \nSurface mount components and devices \n2.4.3 \nThrough-hole mount components and devices \n2.4.4 \nPCB characteristics \n2.4.5 \nMethods of soldering \n2.4.6 \nDesign compliance with EMI / EMC \n2.4.7 \nComponent layout and grounding \n2.4.8 \nThermal and vibration theories  \n2.4.9 \nEnvironmental control \n2.4.10 \nManufacturing \n- \nPCB Manufacturing Information \n- \nPCB Layout and Artwork \n2.4.11 \nFabrication \n- \nBlanking, Cutting, Punching, Drilling \n- \nLaminating Techniques \n- \nPlating, Etching, Surface Finishing \n- \nCoatings \n2.4.12 \n Assembly \n- \nProper care and use of tools \n- \nComponent  \n- \nSoldering Technology  \ni. Reflow soldering \nii. Wave soldering \niii. Hand soldering \niv. RoHS and lead-free soldering \n- \nNonsolder Connections (terminal block\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 42  \n \n \n       \n \n \n \n \n \n \n- \nCleaning \n- \nRepair and Rework \n- \nSafety  \n- \nESD protection \n2.4.13 \n Testing of electronic products \n2.5 3Rs waste management programs \n2.6 Rules and conventions \n2.6.1 Philippine Electronics Code \n2.6.2 RoHS/WEEE Directives \n2.6.3 \nRA 9292 – ECE Law  \n3 Required skills \n \n3.1 assembling electronic products \n3.2 Using and maintaining test instruments, tools, & equipment \n3.3 splicing/joining wires \n3.4 PCB preparation skills  \n3.5 Proper soldering/desoldering skills \n3.6 Component testing \n3.7 mounting various types of electronic components \n3.8 Work safety practices and time management \n3.9 interpreting schematic/block diagrams \n4 Method of assessment \n \nCompetency may be assessed through two or more of the following \nmethods: \n4.1 Practical Demonstration w/ oral questioning \n4.2 Interview \n4.3 Portfolio\n5 Resource implications \n \nThe following resources must be provided: \n5.1 Tools and equipment (see range of variables) \n5.2 Working area/bench \n5.3 PC with computer-aided design (CAD) software and printer PCBs \n5.4 electronic components/supplies \n5.5 diagrams and other references \n5.6 Assessment rating sheet \n5.7 Reporting forms \n6 Context of assessment \n \n6.1 Assessment maybe conducted in the workplace or in a simulated \nworkplace setting",
