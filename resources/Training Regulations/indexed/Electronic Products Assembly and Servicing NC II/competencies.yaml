ions may include but not limited to: \n \n2.1. Length \n2.2. Width \n2.3. Height \n2.4. Diameter \n2.5. Angles \n3. Symbols \nMay include but not limited to: \n \n3.1. NEC- National Electric Code \n3.2. IEC -International Electrotechnical \nCommission \n3.3. ASME - American Society of Mechanical \nEngineers \n3.4. IEEE - Institute of Electrical and \nElectronics Engineers \n3.5. ISA - Instrumentation System and \nAutomation Society \n4. Instruments/Equipment \n4.1. Components/dividers \n4.2. Drawing boards \n4.3. Rulers \n4.4. T-square \n4.5. Calculator\n\n--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 26"
