        "source_text": "--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 38  \n \n \n       \n \n \n \n \n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:    ASSEMBLE ELECTRONIC PRODUCTS  \nUNIT CODE                     :    ELC724335 \n \nDESCRIPTON                 :    This unit covers the knowledge, skills and attitudes required to \nassemble electronic products and systems for consumer/ \nindustrial uses/applications. It consist of competencies in \nidentifying and preparing electronic components and circuits, \npreparing/making printed circuit board (PCB) modules, mounting \nand soldering of components, assembling electronic products \nand performing mechanical and electrical/electronic tests. \n \nELEMENTS \nPERFORMANCE CRITERIA \n(Italicized bold terms are elaborated in the range of variables) \n1. Prepare to \nassemble \nelectronic \nproducts \n1.1 Assembly workplace is prepared in accordance with OH&S policies \nand procedures  \n1.2 Established risk control measures for work preparation are followed. \n1.3 Work instructions are obtained and clarified based on job order or \nclient requirements \n1.4 Responsible person is consulted for effective and proper work \ncoordination \n1.5 Required materials, tools and equipment are prepared and \nchecked in accordance with established procedures \n1.6 Parts and components needed to complete the work are identified, \nprepared and obtained according to requirements \n2. Prepare/ \nMake PCB \nmodules \n2.1 PCB layout is verified for conformity with the schematic diagram in \naccordance with the layout rules  \n2.2 PCB layout is transferred to copper-cladded board following \nacceptable methods and standards  \n2.3 Visual inspection is performed based on standards procedures. \n2.4 Thru-hole is drilled based on standards procedures \n2.5 PCB is cleaned based on standards procedures  \n2.6 Functionality of PCB is tested and visual inspection is performed \nbased on standards procedures\n3. Mount and \nsolder \nelectronic \ncomponents  \n \n3.1 Knowledge of lead and lead-free soldering characteristics and \nrequirements are applied to mounting and soldering process in \naccordance with OH&S standards  \n3.2 Components are mounted and soldered in accordance with \nsoldering principles. \n3.3 Soldering/Desoldering techniques and procedures are applied in \naccordance with established standards and requirements. \n3.4 Soldered products are checked and complied with international \nstandards and task specifications \n4. Perform \nelectronic \nproducts \nassembly \n4.1 Work instructions is followed based on job order or client \nrequirements \n4.2 Assembly procedures are performed in accordance with OH&S \npolicies and work instructions  \n4.3 Modules and accessories are connected/integrated into the final \nproduct based on the client specifications\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 39  \n \n \n       \n \n \n \n \n \n \nELEMENTS \nPERFORMANCE CRITERIA \n(Italicized bold terms are elaborated in the range of variables) \n \n4.4 Excess components and materials are disposed of based on WEEE \ndirectives and 3Rs waste management program. \n \n5. Test and \ninspect \nassembled \nelectronic \nproducts  \n5.1 Finished products are subjected to final visual/sensory inspection \nand testing in accordance with quality standards, procedures and \nrequirements \n5.2 Mechanical and electrical/electronic testing is performed in \naccordance with quality standards, procedures and requirements \n5.3 Work completion is documented and responsible person is informed \nin accordance with established procedures \n5.4 Housekeeping procedures are observed in accordance with 5S \ndiscipline and established procedures\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 40  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. OH&S policies and \nprocedures \nArrangements of enterprise to meet their legal and ethical obligations in \nensuring the workplace is safe and without risk to health. This may include: \n1.1 \nHazard and risk assessment mechanisms \n1.2 \nImplementation of safety regulations \n1.3 \nSafety training \n1.4 \nSafety systems incorporating: \n1.4.1 \nWork clearance procedures \n1.4.2 \nIsolation procedures \n1.4.3 \nGas and vapor \n1.4.4 \nMonitoring/testing procedures \n1.4.5 \nUse of protective equipment and clothing \n1.5 \nUse of codes of practice \n1.5.1 \nPhilippine Electronics Code \n2. Responsible person \n2.1  Immediate supervisor \n2.2  Manager \n3. Materials, tools and \nequipment \nMay include: \n3.1 \nVariable power supply \n3.2 \nVariable transformer \n3.3 \nSoldering iron \n3.4 \nHot air soldering station \n3.5 \nTable top reflow oven  \n3.6 \nDesoldering tools \n3.7 \nScrewdriver (assorted) \n3.8 \nWrenches (assorted) \n3.9 \nAllen wrench/key \n3.10 Function/Signal generator  \n3.11 Multi-testers (analog/digital) \n3.12 Utility knife/stripper \n3.13 Pliers (assorted) \n \n3.14 ESD-free work bench with \nmirror \n3.15 Oscilloscope, digital \n3.16 High-grade magnifying glass \nwith lamp \n3.17 Flashlight/headlamp \n3.18 Cleaning brush \n3.19 Soldering wire \n3.20 SMD soldering paste \n3.21 Stranded/solid/hook-up wires \n3.22 Assorted electronic components \n3.23 Assorted electronic sensors \n4. Layout rules \n4.1 \nEMI \n4.2 \nEMC \n \n5. Acceptable \nmethods \n5.1 \nsilk screen \n5.2 \nphoto transfer \n \n6. Mounting of \ncomponents \n6.1 \nSurface mount \n6.2 \nThru-hole mount \n6.3 \nSocket mount \n \n7. Soldering principles \nThe four key principles to producing a good joint are: \n7.1 \nEnsure the joint surfaces are clean and free from grease. \n7.2 \nEnsure the temperature of the solder when making the joint is correct. \n7.3 \nEnsure the heat is applied to the joint for the correct amount of time \n7.4 \nEnsure the correct amount of solder is used. \n8. Soldering/ \nDesoldering  \nprocedures \n8.1 \nHot iron soldering procedures \n8.2 \nHot air soldering procedures \n9. Assembly \nprocedures \n9.1 \nPrepare supplies, materials and equipment  \n9.2 \nFamiliarize with the diagram and the product \n9.3 \nPerform assembly  \n9.4 \nCheck the assembled product \n10. Testing  \n10.1 Aging test \n10.2 Substitution test \n10.3 Mechanical testing\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 41  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n1 Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nPrepared electronics components for assembly \n1.2 \nPrepared/Made printed circuit board modules \n1.3 \nMounted and soldered electronic components \n1.4 \nAssembled electronic components \n1.5 \nTested and inspected assembled electronic products \n1.6 \nApplied safety rules and procedures \n2 Required knowledge \nand attitude \n \n2.1 \nMensuration/Mathematics \n2.1.1 Conversion of Units \n2.1.2 Applied Mathematics \n2.2 \nEnvironmental Safety  \n2.2.1 Work Safety requirements and economy of materials with \ndurability \n2.2.2 Knowledge in 5S application and observation of required \ntimeframe \n2.2.3 Knowledge of proper handling and disposal of chemicals \n2.2.4 Safety handling of hand tools \n2.2.5 Practicing 3Rs – reduce, re-use, recycle/recover \n2.2.6 Managing waste from electrical and electronic \nequipment (WEEE) \n2.3 \nMaterials, tools and equipment uses and specifications \n2.3.1 Identification of hand and power tools \n2.3.2 Proper care and use of tools \n2.4 \nTheories and Principles \n2.4.1 \nPCB problems and solutions \n2.4.2 \nSurface mount components and devices \n2.4.3 \nThrough-hole mount components and devices \n2.4.4 \nPCB characteristics \n2.4.5 \nMethods of soldering \n2.4.6 \nDesign compliance with EMI / EMC \n2.4.7 \nComponent layout and grounding \n2.4.8 \nThermal and vibration theories  \n2.4.9 \nEnvironmental control \n2.4.10 \nManufacturing \n- \nPCB Manufacturing Information \n- \nPCB Layout and Artwork \n2.4.11 \nFabrication \n- \nBlanking, Cutting, Punching, Drilling \n- \nLaminating Techniques \n- \nPlating, Etching, Surface Finishing \n- \nCoatings \n2.4.12 \n Assembly \n- \nProper care and use of tools \n- \nComponent  \n- \nSoldering Technology  \ni. Reflow soldering \nii. Wave soldering \niii. Hand soldering \niv. RoHS and lead-free soldering \n- \nNonsolder Connections (terminal block\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II \n \n                         Page 42  \n \n \n       \n \n \n \n \n \n \n- \nCleaning \n- \nRepair and Rework \n- \nSafety  \n- \nESD protection \n2.4.13 \n Testing of electronic products \n2.5 3Rs waste management programs \n2.6 Rules and conventions \n2.6.1 Philippine Electronics Code \n2.6.2 RoHS/WEEE Directives \n2.6.3 \nRA 9292 – ECE Law  \n3 Required skills \n \n3.1 assembling electronic products \n3.2 Using and maintaining test instruments, tools, & equipment \n3.3 splicing/joining wires \n3.4 PCB preparation skills  \n3.5 Proper soldering/desoldering skills \n3.6 Component testing \n3.7 mounting various types of electronic components \n3.8 Work safety practices and time management \n3.9 interpreting schematic/block diagrams \n4 Method of assessment \n \nCompetency may be assessed through two or more of the following \nmethods: \n4.1 Practical Demonstration w/ oral questioning \n4.2 Interview \n4.3 Portfolio\n5 Resource implications \n \nThe following resources must be provided: \n5.1 Tools and equipment (see range of variables) \n5.2 Working area/bench \n5.3 PC with computer-aided design (CAD) software and printer PCBs \n5.4 electronic components/supplies \n5.5 diagrams and other references \n5.6 Assessment rating sheet \n5.7 Reporting forms \n6 Context of assessment \n \n6.1 Assessment maybe conducted in the workplace or in a simulated \nworkplace setting\n",
