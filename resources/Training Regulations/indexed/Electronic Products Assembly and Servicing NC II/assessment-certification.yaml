      "number": "1",
      "text": "Equipment - A component part of an installation used for a particular purpose. Equipment includes, but is not limited to, that contained in the following divisions. It will necessarily include new and emerging technologies: • Audio/visual equipment including televisions, radios, monitors, cameras, closed circuit television, mono and stereo sound systems, gaming machines, electronic display panels, cassette recorders, video cassette recorders, CDROM players, tape recorders, sound and video duplication equipment, digital versatile discs, digital audio tapes, professional and domestic speaker systems, mixer desks. • Appliances including portable electric tools, motor driven pumps, vacuum cleaners, food preparation equipment, hair dryers, refrigerators, washing machines, dish washers, paper shredders, water coolers, clothes dryers, pest exterminators, electric motor driven industrial tools and equipment, sanitary disposal units, radial and tangential fans and blowers."
    },
    {
