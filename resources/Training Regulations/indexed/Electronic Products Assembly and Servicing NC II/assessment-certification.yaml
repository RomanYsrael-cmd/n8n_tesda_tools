  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Electronic Products Assembly and\nServicing NC II, the candidate must demonstrate competency in all the units\nlisted in Section 1. Successful candidates shall be awarded a National\nCertificate II signed by the TESDA Director General.\n\n4.2\nThe qualification of Electronic Products Assembly and Servicing NC II may\nbe attained through:\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the\nfollowing units of competencies:\n\n4.2.1.1\nAssemble electronic products\n4.2.1.2\nService consumer electronic products and systems\n4.2.1.3\nService industrial electronic modules, products and systems\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\n4.3\nFor individuals, who already possess National Certificate (NC) or Certificate of\nCompetency (COC) along Consumer Electronics Servicing NC II –\n\n4.3.1. Portfolio assessment is applicable for COC #1 and COC #2, provided\nthe candidate is already employed and has related experience for the\npast three (3) years or more along the qualification. However, if the\nassessor finds the evidences presented inadequate, he may still\nrequire the candidate to undergo the practical demonstration or\npresent other evidences in the form of Third Party Report, etc.\ndepending on the need for supplementary evidences.\n\n4.3.2. Candidates are required to take assessment for COC #3 – “Service\nindustrial electronic modules, products and systems”.\n\n4.4\nUpon accumulation and submission of all COCs acquired for the relevant units\nof competency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.5\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.6\nThe following are qualified to apply for assessment and certification:\n\n4.6.1.\nGraduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n4.6.2.\nExperienced workers (wage employed or self employed)\n\n4.7\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 66 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 64\n\n"
}
