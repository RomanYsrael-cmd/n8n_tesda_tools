    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: Electronic Products Assembly and Servicing NC Level: NC II\n\nNominal Training Duration:\n 40 hrs – Basic Competencies\n\n 80 hrs – Common Competencies\n\n140 hrs – Core Competencies\n\n-------------------------------------------------\n\n260 hrs – TOTAL\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan Electronic Products Technician, in accordance with industry standards. It covers the\nbasic and common competencies in addition to the core competencies such as\nassembling electronic products, fabricating PCB modules and installing and servicing\nconsumer and industrial electronic products and systems.\n\nBASIC COMPETENCIES\n40 hrs\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth & safety\n4.1 Identify hazards and risks.\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational health\nand safety awareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 56\n\nCOMMON COMPETENCIES\n80 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Quality\nStandards\n1.1 Assess quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n\n Field trip\n Symposium\n Film showing\n Simulation\n On-the-job\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n2. Perform\nComputer\nOperation\n2.1 Plan and prepare for task to\nbe undertaken\n2.2 Input data into computer\n2.3 Access information using\ncomputer\n2.4 Produce output/data using\ncomputer system\n2.5 Use basic functions of a web\nbrowser to locate information\n2.6 Maintain computer\nequipment and systems\n Modular\n Film showing\n Computer-\nbased training\n(e-learning)\n Project\nmethod\n On the job\ntraining\n\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer-\nbased\nassessment\n3.\nUse Hand\nTools\n3.1 Plan and prepare for task to\nbe undertaken\n3.2 Prepare hand tools\n3.3 Use appropriate hand tools\nand equipment\n3.4 Maintain hand tools\n\n Lecture /\nDemonstration\n Distance\nlearning\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n Observation\nand\nquestioning\n4.\nPerform\nMensuration\nand\nCalculation\n4.1 Select measuring instruments\n4.2 Carry out measurement and\ncalculation\n4.3 Maintain measuring\ninstruments\n Self- paced/\nmodular\n Demonstration\n Small group\ndiscussion\n Distance\nlearning\n Written/Oral\nexamination\n Practical\ndemonstration\n\n5.\nPrepare and\nInterpret\nTechnical\nDrawings\n5.1 Identify different kinds of\ntechnical drawings\n5.2 Interpret technical drawing\n5.3 Prepare/make changes on\nelectrical/electronic\nschematic and drawings\n5.4 Store technical drawings and\nequipment/ instruments\n Lecture/\ndemonstration\n Dualized\ntraining\n Distance\nlearning\n Written /oral\n examinations\n Direct\n observation\n Project\nmethod\n interview\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 57\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6.\nTerminate\nand Connect\nElectrical\nwiring and\nElectronic\nCircuits\n6.1 Plan and prepare for\ntermination/connection of\nelectrical wiring/electronic\ncircuits\n6.2 Terminate/connect electrical\nwiring/electronic circuits\n6.3 Test termination/ connection\nof electrical wiring\n/electronics circuits\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On-the-Job\nTraining\n Project\nMethod\n\n Demonstration\nand\nQuestioning\n Assessment of\nOutput\nProduct\n7. Test electronic\ncomponents\n\n7.1 Determine criteria for testing\nelectronics components\n7.2 Plan an approach for\ncomponent testing\n7.3 Test components\n7.4 Evaluate the testing process\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On-the-Job\nTraining\n Project\nMethod\n Demonstration\nand\nQuestioning\n Assessment of\nOutput\nProduct\n\n--- PDF PAGE 60 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 58\n\nCORE COMPETENCIES\n140 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Assemble\nElectronic\nProducts\n\n1.1 Prepare to assemble\nelectronics products\n1.2 Prepare/ Make PCB\nmodules\n1.3 Mount and solder electronic\ncomponents\n1.4 Assemble electronic\nproducts\n1.5 Test and inspect assembled\nelectronic products\n\n Lecture/ Discussion\n Demonstration\n Viewing multimedia\n Hands on practice\n Project making/\nlaboratory\nexercises\n Dual training\n Supervised-\nindustry training\n eLearning/ Blended\nlearning program\n Written exam\n Practical exam\n Observation in\nworkplace\n Demonstration\n Portfolio\n\n2. Service\nconsumer\nelectronic\nproducts and\nsystems\n\n2.1 Prepare unit, tools and\nworkplace for installation\nand service\n2.2 Install consumer electronic\nproducts and systems\n2.3 Diagnose faults and defects\nconsumer electronic\nproducts and systems\n2.4 Maintain/Repair consumer\nelectronic products\n2.5 Re-assemble and test\nrepaired consumer\nelectronic products\n Lecture/Discussion\n Demonstration\n Viewing multimedia\n Hands on practice\n Simulation\n Dual training\n Supervised-\nindustry training\n eLearning/ Blended\nlearning program\n\n Written exam\n Practical exam\n Observation in\nworkplace\n Demonstration\n Portfolio\n\n3. Service\nindustrial\nelectronic\nmodules,\nproducts and\nsystems\n\n3.1 Prepare unit, tools and\nworkplace for installation\nand service\n3.2 Install industrial electronic\nmodules/products/systems\n3.3 Diagnose faults and defects\nof industrial electronic\nmodules/systems/products\n3.4 Maintain/Repair industrial\nelectronic products\n3.5 Re-assemble and test\nrepaired industrial\nelectronics products\n\n Lecture\n Discussion\n Demonstration\n Viewing multimedia\n Hands on practice\n Simulation\n Dual training\n Supervised-\nindustry training\n eLearning/ Blended\nlearning program\n\n Written exam\n Practical exam\n Observation in\nworkplace\n Demonstration\n Portfolio\n\n--- PDF PAGE 61 ---\n-----------------------------------------------------------------------------------------------------------------------------------------------------------------