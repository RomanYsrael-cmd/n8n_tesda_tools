    "source_text": "SECTION 3 TRAINING STANDARDS\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Electronic Products Assembly and Servicing NC Level: NC II\n\nNominal Training Duration:\n 40 hrs – Basic Competencies\n\n 80 hrs – Common Competencies\n\n140 hrs – Core Competencies\n\n-------------------------------------------------\n\n260 hrs – TOTAL\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan Electronic Products Technician, in accordance with industry standards. It covers the\nbasic and common competencies in addition to the core competencies such as\nassembling electronic products, fabricating PCB modules and installing and servicing\nconsumer and industrial electronic products and systems.\n\nBASIC COMPETENCIES\n40 hrs\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth & safety\n4.1 Identify hazards and risks.\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational health\nand safety awareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 56\n\nCOMMON COMPETENCIES\n80 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Quality\nStandards\n1.1 Assess quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n\n Field trip\n Symposium\n Film showing\n Simulation\n On-the-job\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n2. Perform\nComputer\nOperation\n2.1 Plan and prepare for task to\nbe undertaken\n2.2 Input data into computer\n2.3 Access information using\ncomputer\n2.4 Produce output/data using\ncomputer system\n2.5 Use basic functions of a web\nbrowser to locate information\n2.6 Maintain computer\nequipment and systems\n Modular\n Film showing\n Computer-\nbased training\n(e-learning)\n Project\nmethod\n On the job\ntraining\n\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer-\nbased\nassessment\n3.\nUse Hand\nTools\n3.1 Plan and prepare for task to\nbe undertaken\n3.2 Prepare hand tools\n3.3 Use appropriate hand tools\nand equipment\n3.4 Maintain hand tools\n\n Lecture /\nDemonstration\n Distance\nlearning\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n Observation\nand\nquestioning\n4.\nPerform\nMensuration\nand\nCalculation\n4.1 Select measuring instruments\n4.2 Carry out measurement and\ncalculation\n4.3 Maintain measuring\ninstruments\n Self- paced/\nmodular\n Demonstration\n Small group\ndiscussion\n Distance\nlearning\n Written/Oral\nexamination\n Practical\ndemonstration\n\n5.\nPrepare and\nInterpret\nTechnical\nDrawings\n5.1 Identify different kinds of\ntechnical drawings\n5.2 Interpret technical drawing\n5.3 Prepare/make changes on\nelectrical/electronic\nschematic and drawings\n5.4 Store technical drawings and\nequipment/ instruments\n Lecture/\ndemonstration\n Dualized\ntraining\n Distance\nlearning\n Written /oral\n examinations\n Direct\n observation\n Project\nmethod\n interview\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 57\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6.\nTerminate\nand Connect\nElectrical\nwiring and\nElectronic\nCircuits\n6.1 Plan and prepare for\ntermination/connection of\nelectrical wiring/electronic\ncircuits\n6.2 Terminate/connect electrical\nwiring/electronic circuits\n6.3 Test termination/ connection\nof electrical wiring\n/electronics circuits\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On-the-Job\nTraining\n Project\nMethod\n\n Demonstration\nand\nQuestioning\n Assessment of\nOutput\nProduct\n7. Test electronic\ncomponents\n\n7.1 Determine criteria for testing\nelectronics components\n7.2 Plan an approach for\ncomponent testing\n7.3 Test components\n7.4 Evaluate the testing process\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On-the-Job\nTraining\n Project\nMethod\n Demonstration\nand\nQuestioning\n Assessment of\nOutput\nProduct\n\n--- PDF PAGE 60 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 58\n\nCORE COMPETENCIES\n140 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Assemble\nElectronic\nProducts\n\n1.1 Prepare to assemble\nelectronics products\n1.2 Prepare/ Make PCB\nmodules\n1.3 Mount and solder electronic\ncomponents\n1.4 Assemble electronic\nproducts\n1.5 Test and inspect assembled\nelectronic products\n\n Lecture/ Discussion\n Demonstration\n Viewing multimedia\n Hands on practice\n Project making/\nlaboratory\nexercises\n Dual training\n Supervised-\nindustry training\n eLearning/ Blended\nlearning program\n Written exam\n Practical exam\n Observation in\nworkplace\n Demonstration\n Portfolio\n\n2. Service\nconsumer\nelectronic\nproducts and\nsystems\n\n2.1 Prepare unit, tools and\nworkplace for installation\nand service\n2.2 Install consumer electronic\nproducts and systems\n2.3 Diagnose faults and defects\nconsumer electronic\nproducts and systems\n2.4 Maintain/Repair consumer\nelectronic products\n2.5 Re-assemble and test\nrepaired consumer\nelectronic products\n Lecture/Discussion\n Demonstration\n Viewing multimedia\n Hands on practice\n Simulation\n Dual training\n Supervised-\nindustry training\n eLearning/ Blended\nlearning program\n\n Written exam\n Practical exam\n Observation in\nworkplace\n Demonstration\n Portfolio\n\n3. Service\nindustrial\nelectronic\nmodules,\nproducts and\nsystems\n\n3.1 Prepare unit, tools and\nworkplace for installation\nand service\n3.2 Install industrial electronic\nmodules/products/systems\n3.3 Diagnose faults and defects\nof industrial electronic\nmodules/systems/products\n3.4 Maintain/Repair industrial\nelectronic products\n3.5 Re-assemble and test\nrepaired industrial\nelectronics products\n\n Lecture\n Discussion\n Demonstration\n Viewing multimedia\n Hands on practice\n Simulation\n Dual training\n Supervised-\nindustry training\n eLearning/ Blended\nlearning program\n\n Written exam\n Practical exam\n Observation in\nworkplace\n Demonstration\n Portfolio\n\n--- PDF PAGE 61 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 59\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nonly facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire a specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 62 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 60\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed at least 10 yrs. basic education or an ALS\ngrade 10 certificate of rating holder\n•\nCan communicate in oral and written language\n•\nCan perform basic mathematical computations\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be\nrequired from the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS (Institution-based)\n\nRecommended list of tools, equipment and materials required in every workstation\nfor Electronic Products Assembly and Servicing NC II:\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n1 set\nPliers assorted, Long\nnose, Side cutter\n1\nunit\nMultimeter\n(analog/digital)\n1\nspool\nSoldering wire\n1 set\nScrew driver assorted,\nPhillips, slotted\n1 set\nWorkshop table\n50 ml\nSMD soldering paste\n1 set\nDesoldering tools\n1 set\nHigh grade magnifying\nglass with lamp\n500\nml\nSMD soldering flux\n1 set\nWrenches assorted\n1 unit\nVariable power supply\n1 pc.\nCleaning brush\n1 set\nAllen wrench/key\n1 unit\nVariable transformer\n1 bottle Thinner/alcohol\n1 pc\nUtility knife/stripper\n\n5ml\nThermal paste\n1 set\nTest jigs\n1 unit\nHot air soldering station\n1 bottle Ferric chloride\n1 pc\nWire stripper\n1 unit\nOscilloscope, digital\n5 units\nPale or water bucket\n1 pc\nDigital micrometer\n1 unit\nSignal generator\n5m\nStranded/solid/ hook-up wires\n1 pc\nAnti-static strap\n1 unit\nFunction generator\n10m\nwire stranded, #22, red\n1 pc\nAnti-static brush\n1 unit\nElectronically-controlled\nsoldering station\n10m\nwire stranded, #22, black\n1pc\nAnti-static mat\n10m\nwire stranded, #22, white\n1 set\nBread boards\nRecommended equipment\n(Optional):\n10m\nwire stranded, #22, blue\n\n1 unit\nTable top reflow oven\n10m\nwire stranded, #22, yellow\n\n1 unit\nLead-free soldering\nsystem\n10m\nwire stranded, #22, green\n\n1 set\nESD free work bench\nwith mirror back-to-\nback/one-sided\n10m\nSolid wires, assorted color\n1 set\nAssorted electronic\ncomponents\n\n50 pcs\nresistors (different values)\n\n50 pcs\ncapacitors (different values)\nNote: Tools, Equipment & Materials are on a per-workstation basis\n\n--- PDF PAGE 63 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 61\n\nEquipment for consumer-electronics shop/laboratory -\n\nEQUIPMENT\nQty.\nDescription\n1 lot\nAudio-video product/appliance and component parts\n•\nRadio receivers\n•\nAudio recorders\n•\nElectronic musical instruments/keyboards\n•\nDVD/VCD player\n•\nPublic-address (PA) systems\n•\nTelevision (Home/Portable)\n•\nPC monitors\n\nNote: The training provider registering the full qualification shall provide access to at least\none (1) unit each of the above appliances/equipment for training purposes [i.e.\ndemonstration, assembly, disassembly, trouble simulation].\n1 lot\nDomestic electronic-controlled appliances consisting of –\n•\nElectronic-controlled Washing Machines\n•\nMicrowave Oven\n•\nInduction stove\n•\nRechargeable light\n•\nElectronic-controlled air-conditioner/fan\n\nNote: The training provider registering the full qualification shall provide access to at least\none (1) unit each of the above appliances/equipment for training purposes [i.e.\ndemonstration, assembly, disassembly, trouble simulation].\nNote: As an alternative to the above arrangement where the training provider provides access to\nequipment (in-center or through partner-facility) the provider shall make available the following\ntrainers/simulators within its premises -\n\n1 lot\ntrainer/simulator for radio-TV receivers\n\n1 lot\ntrainer/simulator for home security/CCTV system\n\n1 lot\ntrainer/simulator for domestic electronic appliance\n•\nMicrowave oven/ induction cooker\n•\nElectronics controlled washing machine\n•\nRef and aircon control system(optional)\n\nEquipment for industrial electronics products and systems shop/laboratory -\n\nEQUIPMENT\nQty.\nDescription\n1 lot\nIndustrial-electronics components\n1 lot\nIndustrial-electronic product/device and component parts\n•\nControl boards and modules\n•\nMotor controllers and drives\n•\nSensors and input devices\n•\nActuators and output devices\n•\nOpto-electronics equipment and devices\n\nNote: The training provider may choose a specific industrial-electronics product/system with\ncomponent/spare parts or a trainer/simulator for a specific industrial-electronics product/system\n(e.g., electronic motor controls system or an electronic surveillance system)\n\n--- PDF PAGE 64 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 62\n\n3.5 TRAINING FACILITIES\n\nRecommended space requirements for the various teaching/learning areas are as\nfollows:\n\nTEACHING/LEARNING/\nFACILITIES AREAS\nSIZE IN\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area*\n5 x 5\n1\n25\nWorkshop Area**\n(2trainees per Workstations)\n1.5m x 2m\n 5 x 5 /\n9 x 5\n5 workstations /\n10 workstations\n 25 /\n45\nLearning Resource Area\n4 x 5\n1\n20\nTool Room/Storage Area\n4 x 4\n1\n16\nWash ,Toilet & Locker Room\n2 x 3\n2\n12\n Sub- Total\n\n98 /\n118\nFacilities / Equipment /\nCirculation***\n\n30 /\n36\n Total Area\n\n5 workstations /\n10 workstations\n128 /\n154\n\n* Optional (good for minimum of 10 trainees)\n** For the workshop area (maximum of 20 trainees)\n***Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS\n\nElectronic Products Assembly and Servicing NC II\n\nTrainer’s Qualification TQ I\n\n•\nHolder of National TVET Trainer’s Certificate (NTTC) Level 1\n•\n* Must have at least 2-years relevant industry experience.\n\n* Optional:\nOnly when required by the hiring institution.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for\n\neach unit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA under\nthese training regulations are required to undergo mandatory national competency\nassessment upon completion of the program.\n\n--- PDF PAGE 65 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 63"
