  "source_text": "DEFINITION OF TERMS\n\nGENERAL\n\n1) ALS (Alternative Learning System) - It is a free education program implemented\nby the Department of Education (DepEd) under the Bureau of Alternative Learning\nSystem which benefits those who cannot afford formal schooling and follows\nwhatever is their available schedule.\n\n2) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n3) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n4) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n5) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n6) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n7) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n8) Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n9) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n10) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n11) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n12) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n13) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n14) Level - refers to the category of skills and knowledge required to do a job\n\n--- PDF PAGE 68 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 66\n\n15) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n16) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n17) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n18) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n19) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n20) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n21) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n22) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n23) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n24) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n25) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n26) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 69 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 67\n\nSECTOR SPECIFIC\n\n1. Equipment - A component part of an installation used for a particular purpose.\nEquipment includes, but is not limited to, that contained in the following divisions. It\nwill necessarily include new and emerging technologies:\n\n• Audio/visual equipment including televisions, radios, monitors, cameras,\nclosed circuit television, mono and stereo sound systems, gaming\nmachines, electronic display panels, cassette recorders, video cassette\nrecorders, CDROM players, tape recorders, sound and video duplication\nequipment, digital versatile discs, digital audio tapes, professional and\ndomestic speaker systems, mixer desks.\n\n• Appliances including portable electric tools, motor driven pumps, vacuum\ncleaners, food preparation equipment, hair dryers, refrigerators, washing\nmachines, dish washers, paper shredders, water coolers, clothes dryers,\npest exterminators, electric motor driven industrial tools and equipment,\nsanitary disposal units, radial and tangential fans and blowers.\n\n2. Appliances - A fixed (for support only), hand-held (held in hand during normal\nuse), portable (moved whilst in operation or easily moved from one place to another\nwhile connected to the supply) or stationary (can be moved, but not easily)\nconsuming device, other than a lamp.\n\n3. Competent person - A person who has the relevant competencies described in\nthis competency\n\n4. Component - That portion of a unit of equipment, which has been designed as a\ndiscrete unit and that can be identified as such.\n\n5. Consumer electronics - (abbreviated CE) are electronic equipment intended for\neveryday use, most often in entertainment, communications and office productivity.\nConsumer products include the broadcast receiver, personal computers, telephones,\nMP3 players, audio equipment, televisions, calculators, GPS automotive electronics,\ndigital cameras and players and recorders using video media such as DVDs, VCRs\nor camcorders including large and small household appliances.\n\n6. Electronic components - are generally intended to be connected together, usually\nby being soldered to a printed circuit board (PCB), to create an electronic circuit\nwith a particular function (for example an amplifier, radio receiver, or oscillator).\nComponents may be packaged singly, or in more complex groups as integrated\ncircuits. Some common electronic components are capacitors, inductors, resistors,\ndiodes, transistors, etc. Components are often categorized as active (e.g.\ntransistors and thyristors) or passive (e.g. resistors and capacitors).\n\n--- PDF PAGE 70 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 68\n\n7. Electronic products – are generally referred as electronic consumer products\nsuch as large and small household appliances, televisions, audio/video machines\nincluding its accessories, digital receivers, phones, lightings, health care, and soon\ncameras, and video surveillance equipments.\n\n8. Environment - The area surrounding the work site which can be directly or\nindirectly affected by occurrences at the work site. It includes the atmosphere, soils,\ndrains, underground water tables, and the ecosystem. Protection of the\nenvironment would require the proper disposal of waste materials, restriction of\nburning off, the correct handling of toxic substances, the containment of CFCs and\nthe like.\n\n9. Established procedures - Formal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done.\n\n10. Hazardous materials - Flammable gases and vapors and combustible dusts.\n\n11. Industrial Electronics - the industry of making electronic products for industrial\npurposes\n\n12. Modifications - To make changes to the physical parameters or operational\nfunction of a device, component or piece of equipment or apparatus.\n\n13. Notification (notified) - Can include verbal, written, electronic or recorded\ninformation at completion of work which may be required to be completed in\naccordance with established procedures.\n\n14. OH&S policies and procedures - Arrangements of an organization or enterprise\nto meet their legal and ethical obligations of ensuring the workplace is safe and\nwithout risk to health.\n\n15. Printed circuit boards (PCBs) - is used to mechanically support and electrically\nconnect electronic components using conductive pathways, tracks or signal traces\netched from copper sheets laminated onto a non-conductive substrate. It is also\nreferred to as printed wiring board (PWB) or etched wiring board. Printed\ncircuit boards are used in virtually all but the simplest commercially produced\nelectronic devices.\n\n16. Requirements - That to which equipment and procedures and their outcomes\nmust conform and includes statutory obligations and regulations and standards\ncalled-up by legislation or regulations.\n\n17. Servicing - Undertaking routine inspection, repair and maintenance of circuits,\nsystems or apparatus. Maintaining, fault finding and repair of equipment, plant and\nmachinery.\n\n18. Standards - Technical documents, which set out specifications and other criteria\nfor equipment, materials, and methods to ensure they consistently, perform as\nintended.\n\n--- PDF PAGE 71 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 69\n\n19. System - A group or combination of inter-related, inter-dependent or interlocking\nelements forming a collective entity. Includes circuits, apparatus, equipment and\nthe like.\n\n20. Termination - The act by means of which an electrical connection to an apparatus\nis established; specifically a prepared joint or connection between a cable, cord or\nconductor and a point in an electrical circuit such as a terminal or connection point.\nSuch terminations include soldering, crimping, clamping, wire wrapping, insulation\npiercing/compression.\n\n21. Testing devices - Devices and instruments used to ensure safety requirements\nand operational functions are met, and to diagnose faults in apparatus, circuits or\nsystems.\n\n22. WEEE Directives - the prevention of waste electrical and electronic equipment\n(WEEE), and in addition, the reuse, recycling and other forms of recovery of such\nwastes so as to reduce the disposal of waste. It also seeks to improve the\nenvironmental performance of all operators involved in the life cycle of electrical\nand electronic equipment, e.g. producers, distributors and consumers and in\nparticular those operators directly involved in the treatment of waste electrical and\nelectronic equipment.\n\n23. Wiring systems - Permitted cables, enclosures, supports and accessories for\npower, measurement, control or communications purposes.\n\n--- PDF PAGE 72 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS –ELECTRONIC PRODUCTS ASSEMBLY AND SERVICING NC II\n\n Page 70"
