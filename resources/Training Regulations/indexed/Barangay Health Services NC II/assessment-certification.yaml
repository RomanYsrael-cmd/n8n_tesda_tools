      "text": "Autoclave - is a pressure chamber used to carry out industrial processes requiring elevated temperature and pressure different from ambient air pressure. Autoclaves are used in medical applications to perform sterilization and in the chemical industry to cure coatings and vulcanize rubber and for hydrothermal synthesis. They are also used in industrial applications, especially regarding composites."
    },
