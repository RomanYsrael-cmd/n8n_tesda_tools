    },
    {
      "number": "4.2",
      "text": "1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment"
    },
    {
      "number": "4.2",
      "text": "2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "number": "4.2",
      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 121 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 117 COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR (BARANGAY HEALTH SERVICES NC II) Participate in workplace communication Work in a team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace Implement and monitor infection control policies and procedures Respond effectively to difficult/challenging behavior Apply basic first aid Maintain high standard of patient / client services Assist the household to identify health problems and develop health plans to provide health and well- being Share knowledge and skills among members to provide information, education and communication (IEC) and/or household teaching in disease prevention and control Ensure the proper maintenance of health station and safe custody and its medical supplies, materials, and health records Monitor health status of household members under his/her area of service coverage Maintain updated list/records of health activities --- PDF PAGE 122 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 118"
    },
    {
      "number": "1",
      "text": "Anthropometric Measurements - are systematic measurements of the size, shape and composition of the human body. For example, body mass index, or BMI, is a measurement of a person's weight-to-height ratio, and waist-to-hip ratio is a measure of the waist circumference divided by the hip circumference."
    },
    {
