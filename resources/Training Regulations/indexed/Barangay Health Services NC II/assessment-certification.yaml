      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s of competency of a qualification with a promulgated Training Regulations."
    },
    {
      "number": "4.1",
      "text": "2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency."
    },
    {
      "number": "4.1",
      "text": "3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences may apply for recognition in a particular qualification through competency assessment."
    },
    {
      "number": "4.1",
      "text": "4 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "4.1 Graduates of WTR-registered program BARANGAY HEALTH SERVICES NC II."
    },
    {
      "number": "4.1",
      "text": "4.2 Graduates of NTR programs or graduates of formal/non-formal/informal including NGOs/industry-based training programs related to Barangay Health Services."
    },
    {
