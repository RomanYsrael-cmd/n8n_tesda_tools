  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated Training\nRegulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences may apply for\nrecognition in a particular qualification through competency assessment.\n\n4.1.4 Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduates of WTR-registered program BARANGAY HEALTH SERVICES\nNC II.\n\n4.1.4.2 Graduates of NTR programs or graduates of formal/non-formal/informal\nincluding NGOs/industry-based training programs related to Barangay\nHealth Services.\n\n4.1.4.3 Barangay health worker registered by local government’s health board. A\ndocument or proof issued from LGU must be shown.\n\n4.1.5 Current holders of National Certificate (NC) in Barangay Health Services NC II are\nrequired to undergo re-assessment under the amended Training Regulations (TR)\nupon expiration of their NC.\n4.1.6 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations. It includes the following:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough informal training, previous work or life experiences may apply for recognition\nin a particular qualification through a recognition/assessment process.\n\n--- PDF PAGE 120 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n116\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool to\nhelp the candidate and the assessor determine what evidence is available, where\ngaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors undergo\na quality assured system of accreditation procedure before they are authorized by\nTESDA to assess the competencies of candidates for National Certification.\n\n--- PDF PAGE 121 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n117\nCOMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR\n\n(BARANGAY HEALTH SERVICES NC II)\n\nBASIC COMPETENCIES\n\nParticipate in workplace\ncommunication\nWork in a team environment\n\nSolve/address general workplace\nproblems\nDevelop career and life decisions\n\nContribute to workplace\ninnovation\nPresent relevant information\n\nPractice occupational safety and\nhealth policies and procedures\nExercise efficient and effective\nsustainable practices in the\nworkplace\nPractice entrepreneurial skills in\nthe workplace\n\nCOMMON COMPETENCIES\n\nCORE COMPETENCIES\n\nImplement and monitor infection\ncontrol policies and procedures\nRespond effectively to\ndifficult/challenging behavior\nApply basic first aid\nMaintain high standard of patient\n/ client services\nAssist the household to identify\nhealth problems and develop health\nplans to provide health and well-\nbeing\nShare knowledge and skills among\nmembers to provide information,\neducation and communication (IEC)\nand/or household teaching in\ndisease prevention and control\nEnsure the proper maintenance of\nhealth station and safe custody and\nits medical supplies, materials, and\nhealth records\nMonitor health status of household\nmembers under his/her area of\nservice coverage\nMaintain updated list/records of\nhealth activities\n\n--- PDF PAGE 122 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n118\nDEFINITION OF TERMS\n\n1. Anthropometric Measurements - are systematic measurements of the size, shape\nand composition of the human body. For example, body mass index, or BMI, is a\nmeasurement of a person's weight-to-height ratio, and waist-to-hip ratio is a\nmeasure of the waist circumference divided by the hip circumference.\n\n2. Autoclave - is a pressure chamber used to carry out industrial processes\nrequiring elevated temperature and pressure different from ambient air pressure.\nAutoclaves are used in medical applications to perform sterilization and in the\nchemical industry to cure coatings and vulcanize rubber and for hydrothermal\nsynthesis. They are also used in industrial applications, especially regarding\ncomposites.\n\n3. Barangay Health Station\n\n4. Barangay Health Worker - is a category of health care providers in the\nPhilippines. They provide services such as first aid, maternal, neonatal, and child\nhealth, and community-based interventions including immunization clinics for\nbarangays (local neighborhoods).\n\n5. BP Apparatus - A sphygmomanometer, also known as a blood pressure meter,\nblood pressure monitor, or blood pressure gauge, is a device used to measure\nblood pressure, composed of an inflatable cuff to collapse and then release the\nartery under the cuff in a controlled manner, and a mercury or mechanical\nmanometer to measure the pressure. It is always used in conjunction with a\nmeans to determine at what pressure blood flow is just starting, and at what\npressure it is unimpeded. Manual sphygmomanometers are used in conjunction\nwith a stethoscope.\n\nA sphygmomanometer consists of an inflatable cuff, a measuring unit (the\nmercury manometer, or aneroid gauge), and a mechanism for inflation which may\nbe a manually operated bulb and valve or a pump operated electrically.\n\n6. Cervical Inspection Set – is an apparatus in detecting abnormal tissue or cells\nin the cervix before cervical cancer develops.\n\n7. Digital Thermometer - are temperature-sensing instruments that are easily\nportable, have permanent probes, and a convenient digital display. The way a\ndigital thermometer works depends upon its type of sensor. Sensor types include\nresistance temperature detector (RTD), thermocouple and thermistor.\n\n8. Fetal Doppler - is a hand-held ultrasound transducer used to detect the fetal\nheartbeat for prenatal care. It uses the Doppler effect to provide an audible\nsimulation of the heartbeat.\n\n9. Glucometer - also known as a glucose meter or blood glucose monitoring device,\nis a home measurement system you can use to test the amount of glucose (sugar)\nin your blood.\n\n10. Health Service Providers - organizations providing a health service include:\ntraditional health service providers, such as private hospitals, day surgeries,\nmedical\npractitioners,\npharmacists\nand\nallied\nhealth\nprofessionals.\ncomplementary therapists, such as naturopaths and chiropractors.\n\n--- PDF PAGE 123 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n119\n\n11. Machine - an apparatus using or applying mechanical power and having several\nparts, each with a definite function and together performing a particular task.\n\n12. Manpower - is the total number of people who can work to get something done.\nHow quickly you clean your house after a big party will depend on how much\nmanpower you've got.\n\n13. Maternal Care - is the health of women during pregnancy, childbirth, and the\npostpartum period. It encompasses the health care dimensions of family\nplanning, preconception, prenatal, and postnatal care in order to ensure a\npositive and fulfilling experience in most cases and reduce maternal morbidity\nand mortality in other cases.\n\n14. Materials - a type of physical thing, such as wood, stone, or plastic, having\nqualities that allow it to be used to make other things.\n\n15. Methods - a particular form of procedure for accomplishing or approaching\nsomething, especially a systematic or established one.\n\n16. Money - a current medium of exchange in the form of coins and banknotes; coins\nand banknotes collectively.\n\n17. Mucous Suction Bulb - device is a round, rubbery object with a short tube that is\nused to remove mucus. When this happens, it helps to clear mucus from your\nchild's nose, back of the throat, and/or mouth so your child can breathe more\neasily.\n\n18. Municipality Health Officer - is a title and commonly used for the senior\ngovernment official of a health department or agency, usually at a municipal,\ncounty/district, state/province, or regional level.\n\n19. Nebulizer - a device for producing a fine spray of liquid, used for example for\ninhaling a medicinal drug.\n\n20. Resuscitator - is a device using positive pressure to inflate the lungs of an\nunconscious person who is not breathing, in order to keep them oxygenated and\nalive. There are three basic types: a manual version (also known as a bag valve\nmask) consisting of a mask and a large hand-squeezed plastic bulb using\nambient air, or with supplemental oxygen from a high-pressure tank. The second\ntype is the Expired Air or breath powered resuscitator. The first appearance of\nthe second type was the Brooke Airway introduced in 1957. The third type is an\noxygen powered resuscitator. These are driven by pressurized gas delivered by\na regulator, and can either be automatic or manually controlled. The most popular\ntype of gas powered resuscitator are Time Cycled, Volume Constant Ventilators.\nIn the early days of pre-hospital emergency services, pressure cycled devices\nlike the Pulmotor were popular but yielded less than satisfactory results. One of\nthe first modern resuscitation ventilators was the HARV, later called the PneuPac\n2R or Yellow Box. Most modern resuscitators are designed to allow the patient\nto breathe on his own should he recover the ability to do so. All resuscitation\ndevices should be able to deliver >85% oxygen when a gas source is available.\n\n--- PDF PAGE 124 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n120\n21. Rural Health Midwives - are considered as the frontline health workers in the\nrural areas and have progressed to become multi-task personnel in the delivery\nof healthcare services, amidst migration of other healthcare professionals.\n\n22. Rural Health Unit - located in a rural, medically under-served area that has a\nseparate reimbursement structure from the standard medical office under the\nDOH programs.\n\n23. Salter Scale – is a medical instrument used in measuring your body's impedance\n(i.e. its resistance to the current), the quantity of muscle can be determined.\nFrom this, the quantity of fat and water can then be estimated.\n\n24. Stethoscope - a medical instrument for listening to the action of someone's heart\nor breathing, typically having a small disk-shaped resonator that is placed\nagainst the chest, and two tubes connected to earpieces.\n\n25. Thermal Bag - is a type of thermally insulated shipping container in the form of\na bag which can be carried, usually made of thermally insulating materials and\nsometimes a refrigerant gel. It is used to help maintain the temperature of its\ncontents, keeping cold items cold, and hot items hot.\n\n26. Vaginal Speculum Set - A vaginal speculum is a device, usually made of metal,\nwhich your gynecologist utilizes to open your vaginal walls. This use of the\nvaginal speculum allows your gynecologist a visual inspection of your vagina and\ncervix, as well as a way to collect the cervical cells necessary for a Pap smear\ntest.\n\n27. Vital Signs - clinical measurements, specifically pulse rate, temperature,\nrespiration rate, and blood pressure, that indicate the state of a patient's\nessential body functions.\n\n--- PDF PAGE 125 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n121\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBarangay Health Services NC II\nQualification Code:\nHHCBHS219\n\nRevision\nNo.\nDocument\nDescription\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nBarangay Health Services NC II\n2006-28 /\n12/14/06\nN/A\n01\nDocument\nAmended\n\nBarangay Health Services NC II\n2019-08 /\n1/11/19\n029\n3/1/2019\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 126 ---\nTR B