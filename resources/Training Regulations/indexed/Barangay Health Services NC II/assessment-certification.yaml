      "text": "Glucometer - also known as a glucose meter or blood glucose monitoring device, is a home measurement system you can use to test the amount of glucose (sugar) in your blood."
    },
    {
      "number": "10",
      "text": "Health Service Providers - organizations providing a health service include: traditional health service providers, such as private hospitals, day surgeries, medical practitioners, pharmacists and allied health professionals. complementary therapists, such as naturopaths and chiropractors. --- PDF PAGE 123 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 119"
    },
    {
      "number": "11",
      "text": "Machine - an apparatus using or applying mechanical power and having several parts, each with a definite function and together performing a particular task."
    },
    {
      "number": "12",
      "text": "Manpower - is the total number of people who can work to get something done. How quickly you clean your house after a big party will depend on how much manpower you've got."
    },
    {
      "number": "13",
      "text": "Maternal Care - is the health of women during pregnancy, childbirth, and the postpartum period. It encompasses the health care dimensions of family planning, preconception, prenatal, and postnatal care in order to ensure a positive and fulfilling experience in most cases and reduce maternal morbidity and mortality in other cases."
    },
