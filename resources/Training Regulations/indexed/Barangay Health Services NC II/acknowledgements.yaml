racy\n3.14 Monitoring of\nincidence of\ninfection in the\nworkplace\n3.15 Communication\nskills practiced\nwith eased\n\n--- PDF PAGE 42 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Industry Codes of\nPractice\nMay include:\n1.1 National Health and Medical Research Council Guidelines for\ninfection control\n1.2 Local & National Government Guidelines and Standards\n1.3 Manufacturer's recommendations and operating manuals\n2. Hazards and the\noutcomes of infection\nrisk assessments\nMay include:\n2.1 Sharps\n2.2 Glass\n2.3 Waste\n2.4 Human waste and human tissues\n2.5 Personal contact with infectious patients / clients\n2.6 Animals, insects and vermin\n2.7 Stock, including food, which has passed \"used-by\" dates.\n2.8 Incorrect concentration of disinfectants and chemicals\n2.9 Cleaning procedures\n2.10 Linen handling procedures\n2.11 Work flows\n2.12 Use of personal protective clothing\n2.13 Food safety\n2.14 Personal hygiene\n3. Infection Control Policy\nand Procedures\nMay include:\n3.1 Cleaning procedures and schedules\n3.2 Cleaning agents\n3.3 Cleaning equipment\n3.4 Handling, storage and disposal of all types of waste\n3.5 Food handling and food safety\n3.6 Hygiene procedures\n3.7 Infection control risk management\n3.8 Infection control incident and hazard reporting\n3.9 Sterilizing\n3.10 Linen production and handling\n3.11 Maintenance procedures\n3.12 Storage requirements\n3.13 Personal protective clothing\n3.14 Work flows\n3.15 Management of blood and body fluid spills\n3.16 Single use of disposable\n3.17 Aseptic techniques\n3.18 Skin preparation procedures\n3.19 Immunization\n3.20 Needle stick injuries\n3.21 Personal contact with infectious patients / clients\n3.2 2 Standard and additional precautions\n3.23 Confidentiality\n3.24 Employee training\n3.25 Contractors\n4. Infection Control\nStandards\nMay include:\n4.1\nObservations\n4.2\nInterviews\n4.3\nSurveys and inspections\n4.4\nQ