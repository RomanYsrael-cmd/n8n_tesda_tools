roup Discussion\n\n• Oral\nEvaluation\n• Interview\n• Observation\n\n24 hours\n\n--- PDF PAGE 113 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n109\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace and/or\nthrough adoption of modern technology;\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n1.\nThe competency – based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified\nby the industry. The following training modalities and their variations/components may be\nadopted singly or combination with other modalities when designing and delivering\ntraining programs:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which contain both\nin-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and the\nTESDA Guidelines on the DTP;\n•\nDistance learning is formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance\nlearning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this mode shall be\nissued by the TESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n 2.2 Enterprise-Based:\n\n•\nFormal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n--- PDF PAGE 114 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n110\n\n•\nInformal Apprenticeship – is based on training (and working) agreement between\nan apprentice and a master craftsperson wherein the agreement may be written\nor oral and the master craftsperson commits to training the apprentice in all the\nskills relevant to his or her trade over a significant period of time, usually between\none and four years, while the apprentice commits to contributing productively to\nthe work of the business. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n•\nEnterprise-based Training – where training is implemented within the company\nin accordance with the requirements of the specific company. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – short term programs conducted by Non-Government\nOrganizations (NGOs), LGUs, training centers and other TVET providers which\nare intended to address the specific needs of a community. Such programs can\nbe conducted in informal settings such as barangay hall, basketball courts, etc.\nThese programs can also be Mobile Training Programs (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students who wants to enroll in this qualification should possess the following\nrequirements:\n\n Must be have completed at least ten (10) years of basic education or Alternative Learning\nSystem (ALS) certificate of completion with grade ten (10) equivalent holder\n Must be at least 18 years old\n Must have good communication skills\n Must be able to perform basic computation\n Must be physically fit\n\n3.4\nTOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nBarangay Health Services NC II are as follows:\n\nEQUIPMENT\nQty\nUnit\nSpecification/Description\n1\nunit\nPC desktop\n1\nunit\nPrinter\n1\nunit\nExternal hard drive\n1\nunit\nTablet\n1\nunit\nTypewriter\n1\nunit\nSteel filing cabinet (4-6 Drawer Type)\n1\nunit\nWood filing cabinet/Open shelf cabinet\n1\nunit\nComputer table\n\n--- PDF PAGE 115 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n111\nEQUIPMENT\nQty\nUnit\nSpecification/Description\n1\nunit\nComputer chair\n1\nunit\nOffice table\n1\nunit\nOffice chair\n25\npcs\nArmed chair\n1\npc\nPuncher\n1\npc\nStapler\n1\npc\nSharpener\n2\nunits\nMulti-Media equipment (TV-flat 32” with USB port, Disc\nPlayer)\n1\nset\nFirst aid kit\n2\nunits\nBP Apparatus (digital), non-mercurial with adult and pedia\ncuff, desk type\n2\nsets\nDressing Set\n- surgical scissors (straight)\n- surgical scissors (curved)\n- bandage scissors\n- pick-up (ovum) forceps\n- mosquito forceps\n- tissue forceps with tip\n- tissue forceps without tip\n- suture removal scissors\n10\nunits\nThermometer (heavy duty)\n3\nunits\nExamining light\n2\nunits\nExamining table with stirrups\n1\nunit\nGlucometer (with 1,000 needles and 1,000 strips) with\nexpiration of at least 1 year\n2\nunits\nInstrument cabinet\n2\nunits\nInstrument table\n2\npcs\nInstrument tray with cover, 18/8, stainless steel (410 ml. x 254\nx 64 ml)\n1\nset\nIUD Insertion Set:\n- Uterine sound\n- Tenaculum forceps\n- Ovum forceps\n2\nunits\nNebulizer (adult/pedia)\n2\nunits\nSalter weighing scale\n1\nunit\nStethoscope (adult)\n1\nunit\nWeighing scale with measuring stick (adult)\n1\nunit\nWeighing scale digital, infant (dual power)\n1\nunit\nWeighing scale (neonate)\n1\nunit\nWeighing scale (pedia)\n1\nunit\nStretcher\n1\nunit\nBed, mechanical 2-cranks with IV pull and mattress 4 inches\n1\nunit\nBedside table\n1\nset\nCord Dressing Set:\n- Forceps, straight, 6”\n- Bandage scissors, 6”\n- Kidney basin, stainless steel, small\n\n--- PDF PAGE 116 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n112\n\nEQUIPMENT\nQty\nUnit\nSpecification/Description\n1\nunit\nCervical inspection set\n1\nunit\nFetal Doppler\n1\nunit\nFoot stool\n1\nset\nMaternal Care Instrument Set:\n- Hemostatic forceps, straight 5”\n- Needle holder, 6” #1\n- Pick-up forceps\n- Surgical scissors\n- Tissue forceps\n1\nunit\nMucous suction bulb\n1\nunit\nOxygen therapy set\n1\nunit\nOxygen tank\n1\nunit\nResuscitator, manual (for adult)\n1\nunit\nResuscitator, manual (for neonate)\n1\nunit\nRevolving stool\n1\nunit\nStethoscope pedia/neonate\n2\nunits\nHeight board (height and width)\n2\nunits\nThermal bag\n\nMATERIALS\nQty\nUnit\nSpecification/Description\n15\npcs\nBallpen (black)\n15\npcs\nBallpen (blue)\n15\npcs\nLong white folder\n15\npcs\nLong brown envelope\n15\npcs\nShort brown envelope\n15\npcs\nFastener\n5\npcs\nFiling box for short envelope\n5\npcs\nFiling box for long envelope\n1\npack\nIndex card (1/2 inch)\n1\npack\nIndex pack (1/4 inch)\n1\nbox\nPaper clips (big)\n1\npc\nStapler (size #12 with puller)\n1\nbox\nStaple wire (size #12)\n1\nbox\nCorrection tape\n1\nunit\nPaper puncher\n5\npcs\nStaple wire remover\n5\npcs\nRuler (12”)\n5\npcs\nPencil\n2\npcs\nPermanent marker (black)\n2\npcs\nPermanent marker (blue)\n2\npcs\nPermanent marker (red)\n2\nrolls\nAdhesive tape (1/2”)\n2\nrolls\nAdhesive tape (1”)\n\n--- PDF PAGE 117 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n113\nMATERIALS\nQty\nUnit\nSpecification/Description\n1\nroll\nTypewriter ribbon (black)\n2\npcs\nClipboard holder\n15\npcs\nName tags\n1\nream\nBond paper (long)\n1\nream\nBond paper (short)\n1\nbottle\nPrinter ink (black)\n1\nbottle\nPrinter ink (yellow)\n1\nbottle\nPrinter ink (red)\n1\nbottle\nPrinter ink (blue)\n10\npcs\nUSB\n10\npcs\nClipboard\n1\npc\nLedger/Notebook\n25\npcs\nIEC materials\n1\npc\nBHW manual and handbook\n12\npcs\nOffice forms (e.g. client, registration, referral)\n15\npcs\nSuggestion forms\n10\npcs\nPencil\n5\npcs\nWhiteboard eraser\n2\npcs\nPencil eraser\n1\npc\nCalculator\n 15\npcs\nProfiling form\n15\npcs\nFlyers\n1\nunit\nClip chart\n1\npc\nRecord book (100 leaves)\n1\nunit\nWhiteboard with stand\n2\npcs\nHighlighter pen\n2\npcs\nBasin\n2\npcs\nPail\n3\npcs\nDipper\n3\npcs\nHand towels\n5\npcs\nArm sling\n1\npc\nWall clock\n1\nroll\nTissue paper\n1\nbox\nGloves (size 6, 7, 8)\n1\nbox\nFacial mask\n1\nbox\nSurgical mask\n1\nream\nIndividual treatment record\n1\npack\nCotton buds\n5\npads\nYellow pad\n2\npcs\nTongue depressor (standard size)\n1\npack\nCotton balls\n2\npcs\nTape measure (dressmaker)\n2\nrolls\nBandage cloth\n1\nbottle\nCholesterol with strip\n1\npc\nSafety box\n\n--- PDF PAGE 118 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n114\nMATERIALS\nQty\nUnit\nSpecification/Description\n2\npcs\nPick-up forceps\n2\npcs\nScissors\n1\nbox\nCotton rolls (big)\n1\nbottle\n70% isopropyl alcohol\n1\nbottle\nBetadine (250ml)\n1\nbottle\nBottle Cidex\n1\nroll\nSterile gauze\n1\nroll\nAdhesive plaster\n1\nbox\nStrips\n1\nbox\nLacet\n1\nroll\nCotton\n10\npcs\nCartolina\n10\npcs\nManila paper\n10\npcs\nColumnar book\n1\nbox\nPaper clip (small)\n1\nbox\nPaper clip (big)\n\n3.5 TRAINING FACILITIES\n\nThe Barangay Health Services Learning Facility must be of concrete structure. Based\non class size of 25 students / trainees, the space requirements for the teaching / learning\nand curriculum areas are as follows:\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nLaboratory Area\n4 X 5\n20\n20\nTool Room and S/M storage Area\n3 X 5\n15\n15\nLearning Resources Area*\n5 X 7\n35\n35\nWash Area/Comfort Room (male &\nfemale)*\n2.5 X 4\n10\n10\nAdmin and Staff Room\n4 X 5\n20\n20\nCirculation Area**\n\n30\nTotal\n\n130\nTotal Workshop Area\n\n130 sq.m.\n\n3.6\nTRAINER’S QUALIFICATION\n\n Must be a holder of National TVET Trainer’s Certificate (NTTC) Level I in Barangay\nHealth Services NC II;\n Must be a Licensed Doctor, Licensed Midwife, Registered Nurse or Graduate of any\nAllied Healthcare Course with background/orientation on health care service delivery\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 119 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n115\nSECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated Training\nRegulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences may apply for\nrecognition in a particular qualification through competency assessment.\n\n4.1.4 Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduates of WTR-registered program BARANGAY HEALTH SERVICES\nNC II.\n\n4.1.4.2 Graduates of NTR programs or graduates of formal/non-formal/informal\nincluding NGOs/industry-based training programs related to Barangay\nHealth Services.\n\n4.1.4.3 Barangay health worker registered by local government’s health board. A\ndocument or proof issued from LGU must be shown.\n\n4.1.5 Current holders of National Certificate (NC) in Barangay Health Services NC II are\nrequired to undergo re-assessment under the amended Training Regulations (TR)\nupon expiration of their NC.\n4.1.6 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations. It includes the following:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough informal training, previous work or life experiences may apply for recognition\nin a particular qualification through a recognition/assessment process.\n\n--- PDF PAGE 120 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n116\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool to\nhelp the candidate and the assessor determine what evidence is available, where\ngaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors undergo\na quality assured system of accreditation procedure before they are authorized by\nTESDA to assess the competencies of candidates for National Certification.\n\n--- PDF PAGE 121 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n117\nCOMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR\n\n(BARANGAY HEALTH SERVICES NC II)\n\nBASIC COMPETENCIES\n\nParticipate in workplace\ncommunication\nWork in a team environment\n\nSolve/address general workplace\nproblems\nDevelop career and life decisions\n\nContribute to workplace\ninnovation\nPresent relevant information\n\nPractice occupational safety and\nhealth policies and procedures\nExercise efficient and effective\nsustainable practices in the\nworkplace\nPractice entrepreneurial skills in\nthe workplace\n\nCOMMON COMPETENCIES\n\nCORE COMPETENCIES\n\nImplement and monitor infection\ncontrol policies and procedures\nRespond effectively to\ndifficult/challenging behavior\nApply basic first aid\nMaintain high standard of patient\n/ client services\nAssist the household to identify\nhealth problems and develop health\nplans to provide health and well-\nbeing\nShare knowledge and skills among\nmembers to provide information,\neducation and communication (IEC)\nand/or household teaching in\ndisease prevention and control\nEnsure the proper maintenance of\nhealth station and safe custody and\nits medical supplies, materials, and\nhealth records\nMonitor health status of household\nmembers under his/her area of\nservice coverage\nMaintain updated list/records of\nhealth activities\n\n--- PDF PAGE 122 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n118\nDEFINITION OF TERMS\n\n1. Anthropometric Measurements - are systematic measurements of the size, shape\nand composition of the human body. For example, body mass index, or BMI, is a\nmeasurement of a person's weight-to-height ratio, and waist-to-hip ratio is a\nmeasure of the waist circumference divided by the hip circumference.\n\n2. Autoclave - is a pressure chamber used to carry out industrial processes\nrequiring elevated temperature and pressure different from ambient air pressure.\nAutoclaves are used in medical applications to perform sterilization and in the\nchemical industry to cure coatings and vulcanize rubber and for hydrothermal\nsynthesis. They are also used in industrial applications, especially regarding\ncomposites.\n\n3. Barangay Health Station\n\n4. Barangay Health Worker - is a category of health care providers in the\nPhilippines. They provide services such as first aid, maternal, neonatal, and child\nhealth, and community-based interventions including immunization clinics for\nbarangays (local neighborhoods).\n\n5. BP Apparatus - A sphygmomanometer, also known as a blood pressure meter,\nblood pressure monitor, or blood pressure gauge, is a device used to measure\nblood pressure, composed of an inflatable cuff to collapse and then release the\nartery under the cuff in a controlled manner, and a mercury or mechanical\nmanometer to measure the pressure. It is always used in conjunction with a\nmeans to determine at what pressure blood flow is just starting, and at what\npressure it is unimpeded. Manual sphygmomanometers are used in conjunction\nwith a stethoscope.\n\nA sphygmomanometer consists of an inflatable cuff, a measuring unit (the\nmercury manometer, or aneroid gauge), and a mechanism for inflation which may\nbe a manually operated bulb and valve or a pump operated electrically.\n\n6. Cervical Inspection Set – is an apparatus in detecting abnormal tissue or cells\nin the cervix before cervical cancer develops.\n\n7. Digital Thermometer - are temperature-sensing instruments that are easily\nportable, have permanent probes, and a convenient digital display. The way a\ndigital thermometer works depends upon its type of sensor. Sensor types include\nresistance temperature detector (RTD), thermocouple and thermistor.\n\n8. Fetal Doppler - is a hand-held ultrasound transducer used to detect the fetal\nheartbeat for prenatal care. It uses the Doppler effect to provide an audible\nsimulation of the heartbeat.\n\n9. Glucometer - also known as a glucose meter or blood glucose monitoring device,\nis a home measurement system you can use to test the amount of glucose (sugar)\nin your blood.\n\n10. Health Service Providers - organizations providing a health service include:\ntraditional health service providers, such as private hospitals, day surgeries,\nmedical\npractitioners,\npharmacists\nand\nallied\nhealth\nprofessionals.\ncomplementary therapists, such as naturopaths and chiropractors.\n\n--- PDF PAGE 123 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n119\n\n11. Machine - an apparatus using or applying mechanical power and having several\nparts, each with a definite function and together performing a particular task.\n\n12. Manpower - is the total number of people who can work to get something done.\nHow quickly you clean your house after a big party will depend on how much\nmanpower you've got.\n\n13. Maternal Care - is the health of women during pregnancy, childbirth, and the\npostpartum period. It encompasses the health care dimensions of family\nplanning, preconception, prenatal, and postnatal care in order to ensure a\npositive and fulfilling experience in most cases and reduce maternal morbidity\nand mortality in other cases.\n\n14. Materials - a type of physical thing, such as wood, stone, or plastic, having\nqualities that allow it to be used to make other things.\n\n15. Methods - a particular form of procedure for accomplishing or approaching\nsomething, especially a systematic or established one.\n\n16. Money - a current medium of exchange in the form of coins and banknotes; coins\nand banknotes collectively.\n\n17. Mucous Suction Bulb - device is a round, rubbery object with a short tube that is\nused to remove mucus. When this happens, it helps to clear mucus from your\nchild's nose, back of the throat, and/or mouth so your child can breathe more\neasily.\n\n18. Municipality Health Officer - is a title and commonly used for the senior\ngovernment official of a health department or agency, usually at a municipal,\ncounty/district, state/province, or regional level.\n\n19. Nebulizer - a device for producing a fine spray of liquid, used for example for\ninhaling a medicinal drug.\n\n20. Resuscitator - is a device using positive pressure to inflate the lungs of an\nunconscious person who is not breathing, in order to keep them oxygenated and\nalive. There are three basic types: a manual version (also known as a bag valve\nmask) consisting of a mask and a large hand-squeezed plastic bulb using\nambient air, or with supplemental oxygen from a high-pressure tank. The second\ntype is the Expired Air or breath powered resuscitator. The first appearance of\nthe second type was the Brooke Airway introduced in 1957. The third type is an\noxygen powered resuscitator. These are driven by pressurized gas delivered by\na regulator, and can either be automatic or manually controlled. The most popular\ntype of gas powered resuscitator are Time Cycled, Volume Constant Ventilators.\nIn the early days of pre-hospital emergency services, pressure cycled devices\nlike the Pulmotor were popular but yielded less than satisfactory results. One of\nthe first modern resuscitation ventilators was the HARV, later called the PneuPac\n2R or Yellow Box. Most modern resuscitators are designed to allow the patient\nto breathe on his own should he recover the ability to do so. All resuscitation\ndevices should be able to deliver >85% oxygen when a gas source is available.\n\n--- PDF PAGE 124 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n120\n21. Rural Health Midwives - are considered as the frontline health workers in the\nrural areas and have progressed to become multi-task personnel in the delivery\nof healthcare services, amidst migration of other healthcare professionals.\n\n22. Rural Health Unit - located in a rural, medically under-served area that has a\nseparate reimbursement structure from the standard medical office under the\nDOH programs.\n\n23. Salter Scale – is a medical instrument used in measuring your body's impedance\n(i.e. its resistance to the current), the quantity of muscle can be determined.\nFrom this, the quantity of fat and water can then be estimated.\n\n24. Stethoscope - a medical instrument for listening to the action of someone's heart\nor breathing, typically having a small disk-shaped resonator that is placed\nagainst the chest, and two tubes connected to earpieces.\n\n25. Thermal Bag - is a type of thermally insulated shipping container in the form of\na bag which can be carried, usually made of thermally insulating materials and\nsometimes a refrigerant gel. It is used to help maintain the temperature of its\ncontents, keeping cold items cold, and hot items hot.\n\n26. Vaginal Speculum Set - A vaginal speculum is a device, usually made of metal,\nwhich your gynecologist utilizes to open your vaginal walls. This use of the\nvaginal speculum allows your gynecologist a visual inspection of your vagina and\ncervix, as well as a way to collect the cervical cells necessary for a Pap smear\ntest.\n\n27. Vital Signs - clinical measurements, specifically pulse rate, temperature,\nrespiration rate, and blood pressure, that indicate the state of a patient's\nessential body functions.\n\n--- PDF PAGE 125 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n121\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBarangay Health Services NC II\nQualification Code:\nHHCBHS219\n\nRevision\nNo.\nDocument\nDescription\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nBarangay Health Services NC II\n2006-28 /\n12/14/06\nN/A\n01\nDocument\nAmended\n\nBarangay Health Services NC II\n2019-08 /\n1/11/19\n029\n3/1/2019\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 126 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n122\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies who donated their time and expertise to the development and validation of these Training\nRegulations.\n\nTECHNICAL PANEL\n\nMS. ZENAIDA P. PULIDO\nMS. MA. TERESA C. SANTIAGO\nNational Confederation of Barangay Health\nWorkers for Health Dev’t of the Phils., Inc.\n(NCBHWHDP)\nProvincial Library Building\nTechnical Expert\nBureau of Local Health System and Development\nDepartment of Health\nBldg. 3/2F San Lazaro Compound\nQuezon Avenue, Vigan City\nIlocos Sur\n\nMS. ELENA B. HILARIO\nNational Confederation of Barangay Health\nWorkers for Health Dev’t of the Phils., Inc.\n(NCBHWHDP)\nDepartment of Health (Region III)\n\nMS. OLCA L. MADRIAGA\nNational Confederation of Barangay Heal