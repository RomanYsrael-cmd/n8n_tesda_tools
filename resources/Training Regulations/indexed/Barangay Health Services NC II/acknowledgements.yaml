      "source_text": "3.6 TRAINER’S QUALIFICATION"
    },
    {
      "source_text": " Must be a holder of National TVET Trainer’s Certificate (NTTC) Level I in Barangay Health Services NC II;  Must be a Licensed Doctor, Licensed Midwife, Registered Nurse or Graduate of any Allied Healthcare Course with background/orientation on health care service delivery"
    },
    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional assessment is undertaken by trainees to determine their achievement of units of competency. A certificate of achievement is issued for each unit of competency."
    },
    {
      "source_text": "-- PDF PAGE 119 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 115 SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards."
    },
    {
      "source_text": "The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to an employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s of competency of a qualification with a promulgated Training Regulations."
    },
    {
      "source_text": "4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency."
    },
    {
      "source_text": "4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences may apply for recognition in a particular qualification through competency assessment."
    },
    {
      "source_text": "4.1.4 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.1.4.1 Graduates of WTR-registered program BARANGAY HEALTH SERVICES NC II."
    },
    {
      "source_text": "4.1.4.2 Graduates of NTR programs or graduates of formal/non-formal/informal including NGOs/industry-based training programs related to Barangay Health Services."
    },
    {
      "source_text": "4.1.4.3 Barangay health worker registered by local government’s health board. A document or proof issued from LGU must be shown."
    },
    {
      "source_text": "4.1.5 Current holders of National Certificate (NC) in Barangay Health Services NC II are required to undergo re-assessment under the amended Training Regulations (TR) upon expiration of their NC. 4.1.6 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry 4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/assessment process."
    },
    {
      "source_text": "-- PDF PAGE 120 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 116"
    },
    {
      "source_text": "4.2. COMPETENCY ASSESSMENT REQUISITE"
    },
    {
      "source_text": "4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment."
    },
    {
      "source_text": "This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment"
    },
    {
      "source_text": "4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "source_text": "4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    },
    {
      "source_text": "-- PDF PAGE 121 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 117 COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR"
    },
    {
      "source_text": "(BARANGAY HEALTH SERVICES NC II)"
    },
    {
      "source_text": "BASIC COMPETENCIES"
    },
    {
      "source_text": "Participate in workplace communication Work in a team environment"
    },
    {
      "source_text": "Solve/address general workplace problems Develop career and life decisions"
    },
    {
      "source_text": "Contribute to workplace innovation Present relevant information"
    },
    {
      "source_text": "Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "COMMON COMPETENCIES"
    },
    {
      "source_text": "CORE COMPETENCIES"
    },
    {
      "source_text": "Implement and monitor infection control policies and procedures Respond effectively to difficult/challenging behavior Apply basic first aid Maintain high standard of patient / client services Assist the household to identify health problems and develop health plans to provide health and well- being Share knowledge and skills among members to provide information, education and communication (IEC) and/or household teaching in disease prevention and control Ensure the proper maintenance of health station and safe custody and its medical supplies, materials, and health records Monitor health status of household members under his/her area of service coverage Maintain updated list/records of health activities"
    },
    {
      "source_text": "-- PDF PAGE 122 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 118 DEFINITION OF TERMS"
    },
    {
      "source_text": "1. Anthropometric Measurements - are systematic measurements of the size, shape and composition of the human body. For example, body mass index, or BMI, is a measurement of a person's weight-to-height ratio, and waist-to-hip ratio is a measure of the waist circumference divided by the hip circumference."
    },
    {
      "source_text": "2. Autoclave - is a pressure chamber used to carry out industrial processes requiring elevated temperature and pressure different from ambient air pressure. Autoclaves are used in medical applications to perform sterilization and in the chemical industry to cure coatings and vulcanize rubber and for hydrothermal synthesis. They are also used in industrial applications, especially regarding composites."
    },
    {
      "source_text": "3. Barangay Health Station"
    },
    {
      "source_text": "4. Barangay Health Worker - is a category of health care providers in the Philippines. They provide services such as first aid, maternal, neonatal, and child health, and community-based interventions including immunization clinics for barangays (local neighborhoods)."
    },
    {
      "source_text": "5. BP Apparatus - A sphygmomanometer, also known as a blood pressure meter, blood pressure monitor, or blood pressure gauge, is a device used to measure blood pressure, composed of an inflatable cuff to collapse and then release the artery under the cuff in a controlled manner, and a mercury or mechanical manometer to measure the pressure. It is always used in conjunction with a means to determine at what pressure blood flow is just starting, and at what pressure it is unimpeded. Manual sphygmomanometers are used in conjunction with a stethoscope."
    },
    {
      "source_text": "A sphygmomanometer consists of an inflatable cuff, a measuring unit (the mercury manometer, or aneroid gauge), and a mechanism for inflation which may be a manually operated bulb and valve or a pump operated electrically."
    },
    {
      "source_text": "6. Cervical Inspection Set – is an apparatus in detecting abnormal tissue or cells in the cervix before cervical cancer develops."
    },
    {
      "source_text": "7. Digital Thermometer - are temperature-sensing instruments that are easily portable, have permanent probes, and a convenient digital display. The way a digital thermometer works depends upon its type of sensor. Sensor types include resistance temperature detector (RTD), thermocouple and thermistor."
    },
    {
      "source_text": "8. Fetal Doppler - is a hand-held ultrasound transducer used to detect the fetal heartbeat for prenatal care. It uses the Doppler effect to provide an audible simulation of the heartbeat."
    },
    {
      "source_text": "9. Glucometer - also known as a glucose meter or blood glucose monitoring device, is a home measurement system you can use to test the amount of glucose (sugar) in your blood."
    },
    {
      "source_text": "10. Health Service Providers - organizations providing a health service include: traditional health service providers, such as private hospitals, day surgeries, medical practitioners, pharmacists and allied health professionals. complementary therapists, such as naturopaths and chiropractors."
    },
    {
      "source_text": "-- PDF PAGE 123 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 119"
    },
    {
      "source_text": "11. Machine - an apparatus using or applying mechanical power and having several parts, each with a definite function and together performing a particular task."
    },
    {
      "source_text": "12. Manpower - is the total number of people who can work to get something done. How quickly you clean your house after a big party will depend on how much manpower you've got."
    },
    {
      "source_text": "13. Maternal Care - is the health of women during pregnancy, childbirth, and the postpartum period. It encompasses the health care dimensions of family planning, preconception, prenatal, and postnatal care in order to ensure a positive and fulfilling experience in most cases and reduce maternal morbidity and mortality in other cases."
    },
    {
      "source_text": "14. Materials - a type of physical thing, such as wood, stone, or plastic, having qualities that allow it to be used to make other things."
    },
    {
      "source_text": "15. Methods - a particular form of procedure for accomplishing or approaching something, especially a systematic or established one."
    },
    {
      "source_text": "16. Money - a current medium of exchange in the form of coins and banknotes; coins and banknotes collectively."
    },
    {
      "source_text": "17. Mucous Suction Bulb - device is a round, rubbery object with a short tube that is used to remove mucus. When this happens, it helps to clear mucus from your child's nose, back of the throat, and/or mouth so your child can breathe more easily."
    },
    {
      "source_text": "18. Municipality Health Officer - is a title and commonly used for the senior government official of a health department or agency, usually at a municipal, county/district, state/province, or regional level."
    },
    {
      "source_text": "19. Nebulizer - a device for producing a fine spray of liquid, used for example for inhaling a medicinal drug."
    },
    {
      "source_text": "20. Resuscitator - is a device using positive pressure to inflate the lungs of an unconscious person who is not breathing, in order to keep them oxygenated and alive. There are three basic types: a manual version (also known as a bag valve mask) consisting of a mask and a large hand-squeezed plastic bulb using ambient air, or with supplemental oxygen from a high-pressure tank. The second type is the Expired Air or breath powered resuscitator. The first appearance of the second type was the Brooke Airway introduced in 1957. The third type is an oxygen powered resuscitator. These are driven by pressurized gas delivered by a regulator, and can either be automatic or manually controlled. The most popular type of gas powered resuscitator are Time Cycled, Volume Constant Ventilators. In the early days of pre-hospital emergency services, pressure cycled devices like the Pulmotor were popular but yielded less than satisfactory results. One of the first modern resuscitation ventilators was the HARV, later called the PneuPac 2R or Yellow Box. Most modern resuscitators are designed to allow the patient to breathe on his own should he recover the ability to do so. All resuscitation devices should be able to deliver >85% oxygen when a gas source is available."
    },
    {
      "source_text": "-- PDF PAGE 124 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 120 21. Rural Health Midwives - are considered as the frontline health workers in the rural areas and have progressed to become multi-task personnel in the delivery of healthcare services, amidst migration of other healthcare professionals."
    },
    {
      "source_text": "22. Rural Health Unit - located in a rural, medically under-served area that has a separate reimbursement structure from the standard medical office under the DOH programs."
    },
    {
      "source_text": "23. Salter Scale – is a medical instrument used in measuring your body's impedance (i.e. its resistance to the current), the quantity of muscle can be determined. From this, the quantity of fat and water can then be estimated."
    },
    {
      "source_text": "24. Stethoscope - a medical instrument for listening to the action of someone's heart or breathing, typically having a small disk-shaped resonator that is placed against the chest, and two tubes connected to earpieces."
    },
    {
      "source_text": "25. Thermal Bag - is a type of thermally insulated shipping container in the form of a bag which can be carried, usually made of thermally insulating materials and sometimes a refrigerant gel. It is used to help maintain the temperature of its contents, keeping cold items cold, and hot items hot."
    },
    {
      "source_text": "26. Vaginal Speculum Set - A vaginal speculum is a device, usually made of metal, which your gynecologist utilizes to open your vaginal walls. This use of the vaginal speculum allows your gynecologist a visual inspection of your vagina and cervix, as well as a way to collect the cervical cells necessary for a Pap smear test."
    },
    {
      "source_text": "27. Vital Signs - clinical measurements, specifically pulse rate, temperature, respiration rate, and blood pressure, that indicate the state of a patient's essential body functions."
    },
    {
      "source_text": "-- PDF PAGE 125 --- TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 121"
    },
