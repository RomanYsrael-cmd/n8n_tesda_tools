  "source_text": "ACKNOWLEDGEMENTS\n122\n\n--- PDF PAGE 5 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n1\nTRAINING REGULATIONS FOR\nBARANGAY HEALTH SERVICES NC II\n\nSECTION 1 BARANGAY HEALTH SERVICES NC II QUALIFICATION\n\nThe BARANGAY HEALTH SERVICES NC II Qualification consists of competencies that a\nperson assist the household to identify health problems to promote health and well-being, share\nknowledge and skills among members to provide information, education and communication (IEC)\nand/or household teaching in disease promotion and control, ensure the proper maintenance of\nhealth station and safe custody and its medical supplies, materials and health records, monitor\nhealth status of household members under his/her area of service coverage, maintain updated\nlist/records of health activities.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the workplace\nPractice entrepreneurial skills in the workplace\n\nUNIT CODE\nCOMMON COMPETENCIES\nHHC323201\nImplement and monitor infection control policies and procedures\nHHC323202\nRespond effectively to difficult/challenging behavior\nHHC323203\nApply basic first aid\nHHC323204\nMaintain high standard of patient / client services\n\nUNIT CODE\nCORE COMPETENCIES\nHHC532301\nAssist the household to identify health problems to promote health and\nwell-being\nHHC532302\nShare knowledge and skills among members to provide information,\neducation and communication (IEC) and/or household teaching in\ndisease prevention and control\nHHC532303\nEnsure safekeeping of equipment, medical supplies, materials, and\nhealth records in health station\nHHC532304\nMonitor health status of household members under his/her area of\nservice coverage\nHHC532305\nMaintain updated list/records of health activities\n\nA person who has achieved this Qualification is competent to be:\n\n Barangay Health Worker\n\n--- PDF PAGE 6 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n2\nSECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in BARANGAY HEALTH SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311210\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are used\nto gather and convey\ninformation\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6 Defined workplace\n procedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n\n1.1 Effective verbal and\nnonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in the\nworkplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n1.8 Workplace etiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/ Interacting\nwith people of\nvarious levels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n1.9 Interpersonal skills\nin the workplace\n1.10 Active-listening\nskills\n\n--- PDF PAGE 7 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Perform duties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are read and\ninterpreted in accordance\nwith organizational\nguidelines\n2.2 Routine written\ninstruction are followed\nbased on established\nprocedures\n2.3 Feedback is given to\nworkplace supervisor\nbased instructions/\ninformation received\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and matters\nconcerning conditions of\nemployment are sought\nand asked from\nappropriate\n sources\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n2.1 Effective verbal and\nnon-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in the\nworkplace\n2.4 Organizational/\nWorkplace policies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n2.8 Effective questioning\ntechniques (clarifying\nand probing)\n2.9 Workplace etiquette\n\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace\nmeetings and\ndiscussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Basic\nquestioning/querying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n\n--- PDF PAGE 8 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating\nto conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Errors in recording\ninformation on forms/\ndocuments are identified\nand acted upon\n3.4 Reporting requirements\nto supervisor are\ncompleted according to\norganizational guidelines\n3.1 Effective verbal and\nnon-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace policies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n\n3.1 Completing work-\nrelated documents\n3.2 Applying\noperations of\naddition,\nsubtraction,\ndivision and\nmultiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 9 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n5\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Appropriate\nsources\nMay include:\n1.1\nTeam members\n1.2\nSupervisor/Department Head\n1.3\nSuppliers\n1.4\nTrade personnel\n1.5\nLocal government\n1.6\nIndustry bodies\n2. Medium\nMay include:\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation dissemination\n2.5\nFollow-up or verbal instructions\n2.6\nFace-to-face communication\n2.7\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Workplace\ninteractions\nMay include:\n4.1\nFace-to-face\n4.2\nTelephone\n4.3\nElectronic and two-way radio\n4.4\nWritten including electronic means, memos,\ninstruction and forms\n4.5\nNon-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 10 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard\nformat of the organization\n1.2 Accessed information using workplace communication\nequipment/systems\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Notebook\n2.4 Writing materials\n2.5 Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Written test\n3.4 Third-party report\n\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the\nactual workplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n7\nUNIT OF COMPETENCY :\nWORK IN A TEAM ENVIRONMENT\n\nUNIT CODE\n\n : 400311211\n\nUNIT DESCRIPTOR\n :\nThis unit covers the skills, knowledge and attitudes to\n\nidentify one’s roles and responsibilities as a member\n\nof a team.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe team\nrole and scope\n1.1 The role and objective\nof the team is identified\nfrom available sources\nof information\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways in\nimproving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles and\nresponsibilities within\nthe team environment\nare identified\n2.2 Roles and objectives of\nthe team is identified\nfrom available sources\nof information\n2.3 Team parameters,\nreporting relationships\nand responsibilities are\nidentified based on\nteam discussions and\nappropriate external\nsources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2 Developing ways in\nimproving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n--- PDF PAGE 12 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n8\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Work as a\nteam member\n3.1 Effective and\nappropriate forms of\ncommunications are\nused and interactions\nundertaken with team\nmembers based on\ncompany practices.\n3.2 Effective and\nappropriate\ncontributions made to\ncomplement team\nactivities and\nobjectives, based on\nworkplace context\n3.3 Protocols in reporting\nare observed based on\nstandard company\npractices.\n3.4 Contribute to the\ndevelopment of team\nwork plans based on\nan understanding of\nteam’s role and\nobjectives\n\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning and\ndecision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace context\n\n3.1 Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as a\ngroup using group\nthink strategies\nand techniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\nMay include but not limited to:\n1.1\nWork activities in a team environment with\nenterprise or specific sector\n1.2\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include but not limited to:\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\nMay include but not limited to:\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 14 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.4 Socio-drama and socio-metric methods\n3.5 Sensitivity techniques\n3.6 Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n11\n UNIT OF COMPETENCY\n:\nSOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS\n UNIT CODE\n : 400311212\n\n UNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes required to\napply problem-solving techniques to determine the origin of\nproblems and plan for their resolution. It also includes\naddressing procedural problems through documentation, and\nreferral.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems or\nprocedural problem\nareas are identified\n1.2 Problems to be\ninvestigated are\ndefined and\ndetermined\n1.3 Current conditions of\nthe problem are\nidentified and\ndocumented\n1.1 Current industry\nhardware and software\nproducts and services\n1.2 Industry maintenance,\nservice and helpdesk\npractices, processes\nand procedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying current\nindustry hardware\nand software\nproducts and\nservices\n1.2 Identifying current\nindustry\nmaintenance,\nservices and\nhelpdesk practices,\nprocesses and\nprocedures.\n1.3 Identifying current\nindustry standard\ndiagnostic tools\n1.4 Describing common\nmalfunctions and\nresolutions.\n1.5 Determining the root\ncause of a routine\nmalfunction\n\n--- PDF PAGE 16 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential solutions to\nproblem are identified\n2.2 Recommendations\nabout possible solutions\nare developed,\ndocumented, ranked\nand presented to\nappropriate person for\ndecision\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service and\nhelpdesk practices,\nprocesses and\nprocedures\n2.3 Operating systems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause analysis\n2.1 Identifying current\nindustry hardware\nand software\nproducts and\nservices\n2.2 Identifying services\nand helpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating system\n2.4 Identifying current\nindustry standard\ndiagnostic tools\n2.5 Describing common\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine malfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are planned\n3.2 Evaluation of\nimplemented solutions\nare planned\n3.3 Recommended\nsolutions are\ndocumented and submit\nto appropriate person for\nconfirmation\n\n3.1 Standard procedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation that\nrecommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 17 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include but not limited to:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and\nincidents\n1.5\n Work-related problems outside of own work\narea\n2. Appropriate person\nMay include but not limited to:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include but not limited to:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include but not limited to:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 18 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n14\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends solutions\nto problems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n2. Resource\nImplications\n2.1. Assessment will require access to a workplace over an\nextended period, or a suitable method of gathering\nevidence of operating ability over a range of situations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nCase Formulation\n3.2\nLife Narrative Inquiry\n3.3\nStandardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 19 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n15\nUNIT OF COMPETENCY\n:\nDEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n\n :\n400311213\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills, and attitudes\n\nin managing one’s emotions, developing reflective\n\npractice, and boosting self-confidence and\n\ndeveloping self-regulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are identified\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the face of\nsetbacks and frustrations\nare developed\n1.3 Techniques for effectively\nhandling negative\nemotions and unpleasant\nsituation in the workplace\nare examined\n\n1.1 Self-management\nstrategies that assist\nin regulating\nbehavior and\nachieving personal\nand learning goals\n(e.g. Nine self-\nmanagement\nstrategies according\nto Robert Kelley)\n1.2 Enablers and\nbarriers in achieving\npersonal and career\ngoals\n1.3 Techniques in\nhandling negative\nemotions and\nunpleasant situation\nin the workplace\nsuch as frustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n--- PDF PAGE 20 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Develop\nreflective\npractice\n2.1 Personal strengths and\nachievements, based on\nself-assessment\nstrategies and teacher\nfeedback are\ncontemplated\n2.2 Progress when seeking\nand responding to\nfeedback from teachers\nto assist them in\nconsolidating strengths,\naddressing weaknesses\nand fulfilling their\npotential are monitored\n2.3 Outcomes of personal\nand academic\nchallenges by reflecting\non previous problem\nsolving and decision\nmaking strategies and\nfeedback from peers and\nteachers are predicted\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to improve\none’s attitude in the\nworkplace\n2.3 Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings, Evaluation,\nAnalysis,\nConclusion, and\nAction plan)\n2.1 Using the basic\nSWOT analysis as\nself-assessment\nstrategy\n2.2 Developing\nreflective practice\nthrough realization\nof limitations,\nlikes/ dislikes;\nthrough showing of\nself-confidence\n2.3 Demonstrating self-\nacceptance and\nbeing able to\naccept challenges\n\n3. Boost self-\nconfidence\nand develop\nself-regulation\n3.1 Efforts for continuous\nself-improvement are\ndemonstrated\n3.2 Counter-productive\ntendencies at work are\neliminated\n3.3 Positive outlook in life are\nmaintained.\n\n3.1 Four components of\nself-regulation based\non Self-Regulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help concepts\n(e. g., 7 Habits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n3.1 Performing effective\ncommunication\nskills – reading,\nwriting, conversing\nskills\n3.2 Showing affective\nskills – flexibility,\nadaptability, etc.\n3.3 Self-assessment for\ndetermining one’s\nstrengths and\nweaknesses\n\n--- PDF 