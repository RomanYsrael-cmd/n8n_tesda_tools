      "source_text": "37 Hours Basic Competencies 42 Hours Common Competencies 384 Hours Core Competencies Total 463 Hours"
    },
    {
      "source_text": "Course Description:"
    },
    {
      "source_text": "This course is designed to enhance the knowledge, skills and attitudes of BARANGAY HEALTH SERVICES NC II in accordance with industry standards. This covers competencies that a person must achieve in assisting the household to identify health problems to promote health and well-being, sharing knowledge and skills among members to provide information, education and communication(IEC) and/or household teaching in disease prevention and control, ensuring the proper maintenance of health station and safe custody and its equipment, medical supplies, materials and health records, monitoring health status of household members under his/her area of service coverage and maintaining updated list/records of health activities."
    },
