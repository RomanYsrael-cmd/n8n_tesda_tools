de Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for BARANGAY HEALTH SERVICES NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities, trainer’s qualification and institutional assessment.\n\n3.1 CURRICULUM DESIGN\n\n TESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\n Delivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language and\nother academic subjects shall be contextualized. To this end, TVET providers shall develop a\nContextual Learning Matrix (CLM) to include green technology, issues on health and drugs and\ncatering to persons with disabilities (PWDs).\n\nCourse Title: BARANGAY HEALTH SERVICES\nNC Level: NC II\n\n Nominal Training Duration:\n\n 37 Hours Basic Competencies\n42 Hours Common Competencies\n 384 Hours Core Competencies\n Total 463 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of BARANGAY\nHEALTH SERVICES NC II in accordance with industry standards. This covers competencies that\na person must achieve in assisting the household to identify health problems to promote health and\nwell-being, sharing knowledge and skills among members to provide information, education and\ncommunication(IEC) and/or household teaching in disease prevention and control, ensuring the\nproper maintenance of health station and safe custody and its equipment, medical supplies,\nmaterials and health records, monitoring health status of household members under his/her area of\nservice coverage and maintaining updated list/records of health activities.\n\nTo obtain this, all uni