better.\n1.1 Opportunities for\nimprovement are\nidentified proactively in\nown area of work.\n1.2 Information are\ngathered and reviewed\nwhich may be relevant to\nideas and which might\nassist in gaining support\nfor idea.\n1.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n1.2 Positive impacts and\nchallenges in\ninnovation.\n1.3 Types of changes\nand responsibility.\n1.4 Seven habits of\nhighly effective\npeople.\n\n1.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n1.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n1.3 Identifying\nexamples of the\ntypes of changes\nthat are within and\noutside own scope\nof responsibility\n2. Discuss and\ndevelop\nideas with\nothers\n2.1 People who could\nprovide input to ideas\nfor improvements are\nidentified.\n2.2 Ways of approaching\npeople to begin sharing\nideas are selected.\n2.3 Meeting is set with\nrelevant people.\n2.4 Ideas for follow up are\nreview and selected\nbased on feedback.\n2.5 Critical inquiry method\nis used to discuss and\ndevelop ideas with\nothers.\n2.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n2.2 Positive impacts and\nchallenges in\ninnovation.\n2.3 Types of changes\nand responsibility.\n2.4 Seven habits of\nhighly effective\npeople.\n\n2.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n2.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n2.3 Providing examples\nof the types of\nchanges that are\nwithin and outside\nown scope of\nresponsibility\n2.4 Communicating\nideas for change\nthrough small group\ndiscussions and\nmeetings.\n\n--- PDF PAGE 23 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n19\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Integrate\nideas for\nchange in\nthe\nworkplace.\n3.1 Critical 