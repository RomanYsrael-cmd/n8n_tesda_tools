nces\n2.4 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\nvalues, ethics and\ncodes of conduct\n2.1 Computing\nbusiness\nmathematics and\nstatistics\n2.2 Describing data\nanalysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of\naudiences\n2.4 Stating\nlegislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n2.5 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n\n3. Record and\npresent\ninformation\n3.1 Studied data/information\nare recorded.\n3.2 Recommendations are\nanalysed for action to\nensure they are\ncompatible with the\nproject’s scope and terms\nof reference.\n3.3 Interim and final reports\nare analysed and\noutcomes are compared to\nthe criteria established at\nthe outset.\n3.4 Findings are presented to\nstakeholders.\n\n3.1 Data analysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of audiences\n3.3 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n3.4 Organisational\nvalues, ethics and\ncodes of conduct\n\n3.1 Describing data\nanalysis\ntechniques/\nprocedures\n3.2 Reporting\nrequirements to a\nrange of\naudiences\n3.3 Stating\nlegislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n3.4 Stating\norganisational\nvalues, ethics and\ncodes of conduct\npractices\n\n--- PDF PAGE 28 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n24\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Data analysis\ntechniques\nMay include but not limited to:\n1.1. Domain analysis\n1.2. Content analysis\n1.3. Comparison technique\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine data / information\n1.2 Studied and applied gathered data/information\n1.3 Recorded and studied studied data/information\n\nThese aspects may be best assessed using a range of scenarios\nwhat ifs as a stimulus with a walk through forming part of the\nresponse. These assessment activities should include a range of\nproblems, including new, unusual and improbable situations that\nmay have happened.\n2. Resource\nImplications\nSpecific resources for assessment\n2.1. Evidence of competent performance should be obtained by\nobserving an individual in an information management role\nwithin the workplace or operational or simulated\nenvironment.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Test\n3.2. Interview\n3.3. Portfolio\n\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the relevant\ncompetency components.\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 29 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n25\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND HEALTH\nPOLICIES AND PROCEDURES\nUNIT CODE\n\n : 400311216\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\n\nto identify OSH compliance requirements, prepare OSH\nrequirements for compliance, perform tasks in accordance with\nrelevant OSH policies and procedures\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations, policies\nand procedures are\nidentified in accordance\nwith workplace policies\nand procedures\n1.2 OSH activity non-\nconformities are\nconveyed to