    {
      "source_text": "SECTION 1 BARANGAY HEALTH SERVICES NC II QUALIFICATION"
    },
    {
      "source_text": "The BARANGAY HEALTH SERVICES NC II Qualification consists of competencies that a person assist the household to identify health problems to promote health and well-being, share knowledge and skills among members to provide information, education and communication (IEC) and/or household teaching in disease promotion and control, ensure the proper maintenance of health station and safe custody and its medical supplies, materials and health records, monitor health status of household members under his/her area of service coverage, maintain updated list/records of health activities."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "UNIT CODE BASIC COMPETENCIES 400311210 Participate in workplace communication 400311211 400311212 400311213 400311214 400311215 400311216 400311217 400311218 Work in a team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "UNIT CODE COMMON COMPETENCIES HHC323201 Implement and monitor infection control policies and procedures HHC323202 Respond effectively to difficult/challenging behavior HHC323203 Apply basic first aid HHC323204 Maintain high standard of patient / client services"
    },
    {
      "source_text": "UNIT CODE CORE COMPETENCIES HHC532301 Assist the household to identify health problems to promote health and well-being HHC532302 Share knowledge and skills among members to provide information, education and communication (IEC) and/or household teaching in disease prevention and control HHC532303 Ensure safekeeping of equipment, medical supplies, materials, and health records in health station HHC532304 Monitor health status of household members under his/her area of service coverage HHC532305 Maintain updated list/records of health activities"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be:"
    },
    {
      "source_text": " Barangay Health Worker"
    },
