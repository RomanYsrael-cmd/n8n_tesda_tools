    {
      "source_text": "TESDA shall provide the training on the development of competency-based curricula to enable training providers develop their own curricula with the components mentioned below."
    },
    {
      "source_text": "Delivery of knowledge requirements for the basic, common and core units of competency specifically in the areas of mathematics, science/technology, communication/language and other academic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to include green technology, issues on health and drugs and catering to persons with disabilities (PWDs)."
    },
