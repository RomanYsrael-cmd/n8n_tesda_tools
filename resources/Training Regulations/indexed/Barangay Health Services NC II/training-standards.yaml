 size of 25 students / trainees, the space requirements for the teaching / learning\nand curriculum areas are as follows:\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nLaboratory Area\n4 X 5\n20\n20\nTool Room and S/M storage Area\n3 X 5\n15\n15\nLearning Resources Area*\n5 X 7\n35\n35\nWash Area/Comfort Room (male &\nfemale)*\n2.5 X 4\n10\n10\nAdmin and Staff Room\n4 X 5\n20\n20\nCirculation Area**\n\n30\nTotal\n\n130\nTotal Workshop Area\n\n130 sq.m.\n\n3.6\nTRAINER’S QUALIFICATION\n\n Must be a holder of National TVET Trainer’s Certificate (NTTC) Level I in Barangay\nHealth Services NC II;\n Must be a Licensed Doctor, Licensed Midwife, Registered Nurse or Graduate of any\nAllied Healthcare Course with background/orientation on health care service delivery\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 119 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n115"
