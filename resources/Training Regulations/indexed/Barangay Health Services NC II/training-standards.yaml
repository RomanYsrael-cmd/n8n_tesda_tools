gotiate\no Relate to people\no Monitor and evaluate\n• Lecture\n• Demonstration\n• Group Discussion\n\n• Oral\nEvaluation\n• Interview\n• Observation\n\n24 hours\n\n--- PDF PAGE 113 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n109\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace and/or\nthrough adoption of modern technology;\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n1.\nThe competency – based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified\nby the industry. The following training modalities and their variations/components may be\nadopted singly or combination with other modalities when designing and delivering\ntraining programs:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which contain both\nin-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and the\nTESDA Guidelines on the DTP;\n•\nDistance learning is formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance\nlearning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate learning\nand formal and non-formal training. Specific guidelines on this mode shall be\nissued by the TESDA Secretariat.\n•\nThe traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n 2.2 Enterprise-Based:\n\n•\nFormal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n--- PDF PAGE 114 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n110\n\n•\nInformal Apprenticeship – is based on training (and working) agreement between\nan apprentice and a master craftsperson wherein the agreement may be written\nor oral and the master craftsperson commits to training the apprentice in all the\nskills relevant to his or her trade over a significant period of time, usually between\none and four years, while the apprentice commits to contributing productively to\nthe work of the business. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n•\nEnterprise-based Training – where training is implemented within the company\nin accordance with the requirements of the specific company. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – short term programs conducted by Non-Government\nOrganizations (NGOs), LGUs, training centers and other TVET providers which\nare intended to address the specific needs of a community. Such programs can\nbe conducted in informal settings such as barangay hall, basketball courts, etc.\nThese programs can also be Mobile Training Programs (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students who wants to enroll in this qualification should possess the following\nrequirements:\n\n Must be have completed at least ten (10) years of basic education or Alternative Learning\nSystem (ALS) certificate of completion with grade ten (10) equivalent holder\n Must be at least 18 years old\n Must have good communication skills\n Must be able to perform basic computation\n Must be physically fit\n\n3.4\nTOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nBarangay Health Services NC II are as follows:\n\nEQUIPMENT\nQty\nUnit\nSpecification/Description\n1\nunit\nPC desktop\n1\nunit\nPrinter\n1\nunit\nExternal hard drive\n1\nunit\nTablet\n1\nunit\nTypewriter\n1\nunit\nSteel filing cabinet (4-6 Drawer Type)\n1\nunit\nWood filing cabinet/Open shelf cabinet\n1\nunit\nComputer table\n\n--- PDF PAGE 115 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n111\nEQUIPMENT\nQty\nUnit\nSpecification/Description\n1\nunit\nComputer chair\n1\nunit\nOffice table\n1\nunit\nOffice chair\n25\npcs\nArmed chair\n1\npc\nPuncher\n1\npc\nStapler\n1\npc\nSharpener\n2\nunits\nMulti-Media equipment (TV-flat 32” with USB port, Disc\nPlayer)\n1\nset\nFirst aid kit\n2\nunits\nBP Apparatus (digital), non-mercurial with adult and pedia\ncuff, desk type\n2\nsets\nDressing Set\n- surgical scissors (straight)\n- surgical scissors (curved)\n- bandage scissors\n- pick-up (ovum) forceps\n- mosquito forceps\n- tissue forceps with tip\n- tissue forceps without tip\n- suture removal scissors\n10\nunits\nThermometer (heavy duty)\n3\nunits\nExamining light\n2\nunits\nExamining table with stirrups\n1\nunit\nGlucometer (with 1,000 needles and 1,000 strips) with\nexpiration of at least 1 year\n2\nunits\nInstrument cabinet\n2\nunits\nInstrument table\n2\npcs\nInstrument tray with cover, 18/8, stainles