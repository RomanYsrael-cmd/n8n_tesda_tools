      "definition": "23. Salter Scale – is a medical instrument used in measuring your body's impedance (i.e. its resistance to the current), the quantity of muscle can be determined. From this, the quantity of fat and water can then be estimated. 24. Stethoscope - a medical instrument for listening to the action of someone's heart or breathing, typically having a small disk-shaped resonator that is placed against the chest, and two tubes connected to earpieces. 25. Thermal Bag - is a type of thermally insulated shipping container in the form of a bag which can be carried, usually made of thermally insulating materials and sometimes a refrigerant gel. It is used to help maintain the temperature of its contents, keeping cold items cold, and hot items hot. 26. Vaginal Speculum Set - A vaginal speculum is a device, usually made of metal, which your gynecologist utilizes to open your vaginal walls. This use of the vaginal speculum allows your gynecologist a visual inspection of your vagina and cervix, as well as a way to collect the cervical cells necessary for a Pap smear test. 27. Vital Signs - clinical measurements, specifically pulse rate, temperature, respiration rate, and blood pressure, that indicate the state of a patient's essential body functions. TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)"
