      "term": "1. Anthropometric Measurements - are systematic measurements of the size, shape",
      "definition": "and composition of the human body. For example, body mass index, or BMI, is a measurement of a person's weight-to-height ratio, and waist-to-hip ratio is a measure of the waist circumference divided by the hip circumference."
    },
    {
      "term": "2. Autoclave - is a pressure chamber used to carry out industrial processes",
      "definition": "requiring elevated temperature and pressure different from ambient air pressure. Autoclaves are used in medical applications to perform sterilization and in the chemical industry to cure coatings and vulcanize rubber and for hydrothermal synthesis. They are also used in industrial applications, especially regarding composites."
    },
    {
      "term": "4. Barangay Health Worker - is a category of health care providers in the",
      "definition": "Philippines. They provide services such as first aid, maternal, neonatal, and child health, and community-based interventions including immunization clinics for barangays (local neighborhoods)."
    },
    {
      "term": "5. BP Apparatus - A sphygmomanometer, also known as a blood pressure meter,",
      "definition": "blood pressure monitor, or blood pressure gauge, is a device used to measure blood pressure, composed of an inflatable cuff to collapse and then release the artery under the cuff in a controlled manner, and a mercury or mechanical manometer to measure the pressure. It is always used in conjunction with a means to determine at what pressure blood flow is just starting, and at what pressure it is unimpeded. Manual sphygmomanometers are used in conjunction with a stethoscope."
    },
    {
      "term": "A sphygmomanometer consists of an inflatable cuff, a measuring unit (the",
      "definition": "mercury manometer, or aneroid gauge), and a mechanism for inflation which may be a manually operated bulb and valve or a pump operated electrically."
    },
    {
      "term": "6. Cervical Inspection Set – is an apparatus in detecting abnormal tissue or cells",
      "definition": "in the cervix before cervical cancer develops."
    },
    {
      "term": "7. Digital Thermometer - are temperature-sensing instruments that are easily",
      "definition": "portable, have permanent probes, and a convenient digital display. The way a digital thermometer works depends upon its type of sensor. Sensor types include resistance temperature detector (RTD), thermocouple and thermistor."
    },
    {
      "term": "8. Fetal Doppler - is a hand-held ultrasound transducer used to detect the fetal",
      "definition": "heartbeat for prenatal care. It uses the Doppler effect to provide an audible simulation of the heartbeat."
    },
    {
      "term": "9. Glucometer - also known as a glucose meter or blood glucose monitoring device,",
      "definition": "is a home measurement system you can use to test the amount of glucose (sugar) in your blood."
    },
    {
      "term": "10. Health Service Providers - organizations providing a health service include:",
      "definition": "traditional health service providers, such as private hospitals, day surgeries, medical practitioners, pharmacists and allied health professionals. complementary therapists, such as naturopaths and chiropractors."
    },
    {
      "term": "--- PDF PAGE 123 ---",
      "definition": "TR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019) 119"
    },
    {
      "term": "11. Machine - an apparatus using or applying mechanical power and having several",
      "definition": "parts, each with a definite function and together performing a particular task."
    },
    {
      "term": "12. Manpower - is the total number of people who can work to get something done.",
      "definition": "How quickly you clean your house after a big party will depend on how much manpower you've got."
    },
    {
      "term": "13. Maternal Care - is the health of women during pregnancy, childbirth, and the",
      "definition": "postpartum period. It encompasses the health care dimensions of family planning, preconception, prenatal, and postnatal care in order to ensure a positive and fulfilling experience in most cases and reduce maternal morbidity and mortality in other cases."
    },
    {
      "term": "14. Materials - a type of physical thing, such as wood, stone, or plastic, having",
      "definition": "qualities that allow it to be used to make other things."
    },
    {
      "term": "15. Methods - a particular form of procedure for accomplishing or approaching",
      "definition": "something, especially a systematic or established one."
    },
    {
      "term": "16. Money - a current medium of exchange in the form of coins and banknotes; coins",
      "definition": "and banknotes collectively."
    },
    {
      "term": "17. Mucous Suction Bulb - device is a round, rubbery object with a short tube that is",
      "definition": "used to remove mucus. When this happens, it helps to clear mucus from your child's nose, back of the throat, and/or mouth so your child can breathe more easily."
    },
    {
      "term": "18. Municipality Health Officer - is a title and commonly used for the senior",
      "definition": "government official of a health department or agency, usually at a municipal, county/district, state/province, or regional level."
    },
    {
      "term": "19. Nebulizer - a device for producing a fine spray of liquid, used for example for",
      "definition": "inhaling a medicinal drug."
    },
    {
      "term": "20. Resuscitator - is a device using positive pressure to inflate the lungs of an",
      "definition": "unconscious person who is not breathing, in order to keep them oxygenated and alive. There are three basic types: a manual version (also known as a bag valve mask) consisting of a mask and a large hand-squeezed plastic bulb using ambient air, or with supplemental oxygen from a high-pressure tank. The second type is the Expired Air or breath powered resuscitator. The first appearance of the second type was the Brooke Airway introduced in 1957. The third type is an oxygen powered resuscitator. These are driven by pressurized gas delivered by a regulator, and can either be automatic or manually controlled. The most popular type of gas powered resuscitator are Time Cycled, Volume Constant Ventilators. In the early days of pre-hospital emergency services, pressure cycled devices like the Pulmotor were popular but yielded less than satisfactory results. One of the first modern resuscitation ventilators was the HARV, later called the PneuPac 2R or Yellow Box. Most modern resuscitators are designed to allow the patient to breathe on his own should he recover the ability to do so. All resuscitation devices should be able to deliver >85% oxygen when a gas source is available."
