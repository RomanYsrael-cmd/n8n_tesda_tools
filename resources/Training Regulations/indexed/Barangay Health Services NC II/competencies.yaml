tional Tuberculosis Program Record\n5.4 Hypertension Record\n5.5 Diabetes Mellitus Record\n5.6 Family Planning\n6. Client’s Health Status\nMay include:\n6.1 Underweight/Obese/Stunted/Tall\n6.2 Controlled/Uncontrolled Diabetes Mellitus or Hypertension\n6.3 Undergoing Treatment/Cured/Completed Treatment/Lost to\nfollow-up TB Patient\n7. Referral Health\nFacilities\nMay include:\n7.1 Barangay Health Station\n7.2 Rural Health Unit\n7.3 District Hospital\n7.4 Provincial Hospital\n7.5 Medical Centers\n7.6 Private Clinics and Hospitals\n7.7Lying-In Clinics\n8. Transport of Clients\nMay include:\n8.1 Ambulance\n8.2 Sea Ambulance\n8.3 Air Ambulance\n8.4 Horse-drawn\n8.5 Hammock\n8.6 Multicab\n8.7 Tricyle\n\n--- PDF PAGE 76 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n72\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Assisted in the consultation\n1.2 Updated clients’ record\n1.3 Referred symptomatic/asymptomatic patients for appropriate\n medical services\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Assessment Manual\n2.2 Office Supplies\n2.3 Transportation Expenses\n2.4 Facilities appropriate for the activity\n2.5 Tools and materials appropriate for the activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nInterview\n3.2\nObservation with Questioning\n3.3\nCase Analysis\n3.4\nDemonstration with questioning\n3.5\nWritten Examination\n4. Context of\nAssessment\n4.1\nCompetency may be assessed in the actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 77 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n73\nUNIT OF COMPETENCY : MAINTAIN UPDATED LIST/RECORDS OF HEALTH\nACTIVITIES\n\nUNIT CODE\n: HHC532301\n\nUNIT DESCRIPTOR\n: This unit covers developing relationship with the households\nand liaising effectively with individuals and the family to\npromote health. This also covers the required skills,\nknowledge and attitudes to promote, monitor and assist in\nplanning and delivery to address identified needs.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Collate records\n1.1 Client’s information is\nupdated in accordance with\nworkplace records system\nrequirements and criteria.\n1.2 Records are sorted in\naccordance with workplace\nrequirements.\n1.3 Client’s information is\nsummarized based on the\nworkplace records system.\n1.1 Records\n1.2 Documentation\n1.3 Workplace\nRecords System\nRequirements\n1.4 Report Writing\n1.5 Standard Forms\n1.6 Basic Mathematics\n1.7 Health\nInterventions\n(Knowledge on “All\nLife Stages and\nTBD)\n\n1.1 Information\ngathering\n1.2 Report writing\n1.3 Communicating\nskills\n1.4 Relating to\npeople with\ndifferent social,\ncultural and\nethnic\nbackgrounds\n\n2. Prepare\nreports based\non workplace\nrecord system\n\n2.1 Reports are prepared in\naccordance with standard\nforms.\n2.2 Specific cases are\n discussed with the\n supervisor.\n2.3 Reports are submitted to\nRural Health Midwife\n(RHM) and concerned\nofficial in the barangay.\n2.1 Reports\n2.2 Documentation\n2.3 Workplace\nRecords System\nRequirements\n2.4 Report Writing\n2.5 Standard Forms\n2.6 Basic Mathematics\n\n2.1 Information\ngathering\n2.2 Report writing\n2.3 Communicating\nSkills\n2.4 Relating to\npeople with\ndifferent social,\ncultural and\nethnic\nbackgrounds\n\n--- PDF PAGE 78 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n74\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Client Information\nMay include:\n1.1 Name\n1.2 Age\n1.3 Sex/Gender\n1.4 Birthdate\n1.5 Address\n1.6 Status\n1.7 Spouse and Children\n1.8 Parents Name\n1.9 Religion\n1.10 Complaints\n2. Records\nMay include:\n2.1 Family Profile\n2.2 Household Health Profile\n3. Reports\nMay include:\n3.1 BHW Accomplishment Report\n3.2 Fa