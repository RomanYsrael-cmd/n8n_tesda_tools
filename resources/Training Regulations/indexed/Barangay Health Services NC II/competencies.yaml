        "source_text": "HHC532305\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude required in\nprimary health care to record health activities. The unit involves\nthe documentation of information about health activities. This unit\napplies to health worker providing support to the delivery of\nprimary health care. It also includes facilitating communication of\nclients to service providers.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Assist client to\ncommunicate\nwith service\nproviders\n1.1 Services offered are\nexplained by specific\nhealth service\nproviders to patients in\naccordance with\nestablished standard\npolicies and procedures\n1.2 Clients are supported in\nthe use of their preferred\nlanguage when\ncommunicating with\nservice providers\n1.3 Appropriate visual aids\nand other resources are\nused to support patient’s\nunderstanding in\naccordance with\nestablished procedures\n1.4 Appropriate respect,\nbehavior and\ncommunication are\nshown to the patient\n1.1 Office Forms\n1.2 Office Records\n1.3 Office Guidelines\nand Protocol\n1.4 Referral System\n1.5 Survey\n1.6 Profiling Forms\n1.7 Basic Mathematics\n1.8 Policies, protocols\nand guidelines on\nrecords\nmanagement\n1.9 Institutional\npolicies, guidelines\nand procedures\n1.10 Systems of Control\n1.11 Records Updating\n1.12 Services\n1.13 Health Service\nProvider\n1.14 Patient\n1.15 Visual Aids\n1.16 Resources\n\n1.1 Information\nGathering\n1.2 Report Writing\n1.3 Typing Skills\n1.4 Retrieving\ncopies/records\n(e.g. action plans,\nresolutions etc) as\nneeded\n1.5 Maintaining and\nupdating master\nlists or records of\nclients\n1.6 Ensuring\ncompleteness and\naccuracy of clients’\ndata/information\n1.7 Conducting house\nto house visit to\nvalidate data being\ngathered\n1.8 Sorting of\ndata/records\n1.9 Applying policies,\nprotocol and\nguidelines on\nrecords\nmanagement\n1.10 Applying\ntechniques for\nsystematic filing\nand collating of\nfiles/records\n1.11 Observing of 5S\n(sort, standardize,\nself-discipline and\nsustain)\n\n--- PDF PAGE 61 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n57\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Explain health\nconcerns to\nservice\nproviders for\nbetter\nunderstanding\nof client and\ncommunity\nneeds\n2.1 Client needs and\nconcerns are\ncommunicated to service\nproviders to facilitate\naccess to services\n2.2 Local community\nvalues, beliefs and\ngender roles are\ncommunicated to service\nproviders as required\n2.3 Role of traditional\nhealers are explained in\nthe community to service\nproviders as required\n2.1 Information\n2.2 History Taking\n2.3 Records/Data\n2.4 Documentation\n2.5 Records\nManagement\nSystem\n2.6 Policies, protocols\nand guidelines on\nrecords\nmanagement\n2.7 Institutional policies,\nguidelines and\nprocedures\n2.8 Systems of Control\n2.9 Record\nManagement\n2.10 Service\n2.11 Health service\nprovider\n2.12 Client\n2.13 Community values,\nbeliefs and gender\nroles\n2.14 Role of traditional\nhealers\n2.1 Gathering\ninformation\n2.2 Writing reports\n2.3 Documenting\nupdates\n2.4 Encoding data\n2.5 Updating records\n\n3. Give support to\nclients when\naccessing\nhealth services\n3.1 Clients are accompanied\nto BHS/RHU as required\n3.2 Clients are informed of\nthe schedule of services\n3.3 Transportation is\nfacilitated to enable\nclient to travel to and\nfrom health service\nproviders\n3.4 Clients are reminded to\nensure schedules are\nkept\n3.5 Clients are followed- up\nafter schedule as\nrequired\n3.1\nInformation\n3.2\nHistory taking\n3.3\nRecords\n3.4\nDocumentation\n3.5\nPolicies, protocols\nand guidelines on\nrecords\nmanagement\n3.6\nInstitutional\npolicies, guidelines\nand procedures\n3.7\nSystems of control\n\n3.1 Information\ngathering\n3.2 Report writing\n3.3 Typing skills\n3.4 Retrieving records\n(e.g. action plans,\nresolutions etc) as\nneeded\n3.5 Maintaining and\nupdating master\nlists or records of\nclients\n3.6 Ensuring\ncompleteness and\naccuracy of client’s\ndata/information\n3.7 Conducting house\nto house visit to\nmonitor client\n3.8 Sorting of\ndata/records\n4. Assist the\nindividual in\nhealth\nplanning to\naddress\nidentified\nneeds\n4.1 Important information is\nrelayed to concerned\nindividual in accordance\nwith standard operating\nprocedures.\n4.2 Relevant health\ninterventions responsive\n4.1 Information sharing\n4.2 Mentoring/ Coaching\nValues and beliefs\n4.3 Culture\n4.4 Basic Mathematics\n4.5 Health Planning\n4.6 Monitoring Process\n4.1 Communicating\nSkills\n4.2 Planning\n4.3 Negotiation\n4.4 Relating to people\nwith different\nsocial, cultural and\n\n--- PDF PAGE 62 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n58\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\nto individuals’ values and\nbeliefs are suggested in\naccordance with standard\noperating procedures.\n4.3 Monitoring process is\nregularly done\n4.7 Health Interventions\n\nethnic\nbackgrounds\n4.5 Monitoring\n\n5. Update\nlist/records of\nhealth activities\n\n5.1 Make required checks of\npatient records\n5.2 Carry out archiving of\npatient records as\nrequired\n5.3 Transfer patient records to\nanother health facility\nupon appropriate request\nfor patient information\n\n5.1 Information\n5.2 History taking\n5.3 Records\n5.4 Documentation\n5.5 Policies, protocols\nand guidelines on\nrecords\nmanagement\n5.6 Institutional\npolicies, guidelines\nand procedures\n5.7 Systems of control\n\n5.1 Information\ngathering\n5.2 Report writing\n5.3 Typing skills\n5.4 Retrieving records\n(e.g. action plans,\nresolutions etc) as\nneeded\n5.5 Maintaining and\nupdating master\nlists or records of\nclients\n5.6 Ensuring\ncompleteness and\naccuracy of client’s\ndata/information\n5.7 Conducting house\nto house visit to\nmonitor client\n5.8 Sorting of\ndata/records\n\n--- PDF PAGE 63 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n59\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Services\nMay include:\n1.1.\nExpanded Program on Immunization (EPI)\n1.2.\nPrenatal\n1.3.\nPost-Partum\n1.4.\nNational Tuberculosis Program (NTP)\n1.5.\nFamily Planning Program\n1.6.\nBreastfeeding Program\n2. Health Service Providers\nMay include:\n2.1\nBarangay Health Workers (BHW)\n2.2\nRural Health Midwives (RHM)\n2.3\nNurse Deployment Program (NDP)\n2.4\nPublic Health Nurses (PHN)\n2.5\nMunicipal/City Health Officers (M/CHO)\n2.6\nBarangay Health Station (BHS)\n2.7\nRural Health Unit (RHU)\n2.8\nDistrict Hospital\n2.9\nProvincial Hospital\n2.10 Medical Centers\n2.11 Private Clinics and Hospitals\n3. Clients\n\nMay include:\n3.1\nNewborns\n3.2\nInfants\n3.3\nPre-school\n3.4\nAdolescents\n3.5\nWomen with Reproductive Age (WRA)\n3.6\nPregnant Women\n3.7\nAdult\n3.8\nPersons with Special Needs\n3.9\nElderly\n4. Visual aids\nMay include:\n4.1\nFlip charts\n4.2\nTarpaulin\n4.3\nPowerpoint Presentation\n4.4\nVideo Presentation\n4.5\nFlyers\n5. Resources\nMay include:\n5.1\nMoney\n5.2\nMachine\n5.3\nManpower\n5.4\nMaterials\n5.5\nMethods\n6. Client needs and concerns May include:\n6.1\nAvailability of health services\n6.2\nAvailability of medicine and drugs\n6.3\nOut-of-pocket concerns\n7. Community Values,\nBeliefs and Gender Roles\nMay include:\n7.1\nCommunity Values and Beliefs\n7.1.1 Traditional Birth (eg. home delivery, presence of\nhusband during delivery)\n7.1.2\nRefusal on vaccination/immunization (e.g. side\neffect of vaccine)\n\n--- PDF PAGE 64 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n60\nVARIABLE\nRANGE\n7.1.3\nReligion based (e.g. cult)\n7.1.4\nRefusal in the use of different Family Planning\nMethods\n7.2\nGender Roles\n7.2.1\nCases were BHW women should perform\n7.2.2\nCases were BHW men should perform\n8. Traditional Healers\nMay include:\n8.1\nHilot\n8.2\nKumadrona\n8.3\nAlbularyo\n8.4\nBabaylan\n8.5\nMumbaki\n8.6\nEspiritista\n9. Transportation\nMay include:\n9.1\nAmbulance\n9.2\nSea Ambulance\n9.3\nAir Ambulance\n9.4\nHorse-drawn\n9.5\nHammock\n9.6\nMulti-cab\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nSupported patient to communicate with service providers\n1.2\nAssisted service providers to understand patient and\ncommunity needs\n1.3\nGave support to patients when accessing health services\n2. Resource Implications The following resources should be provided:\n1.1\nOffice supplies and materials\n1.2\nFiling cabinets\n1.3\nDrawers\n1.4\nOrganizing box\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with questioning\n3.2\nInterview\n3.3\nWritten Examination\n3.4\nObservation\n4. Context of Assessment 4.1\nCompetency may be assessed in the actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 65 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n61\nUNIT OF COMPETENCY : SHARE KNOWLEDGE & SKILLS AMONG MEMBERS TO\nPROVIDE INFORMATION AND EDUCATION\nCOMMUNICATION (IEC) AND/OR HOUSEHOLD TEACHING\nIN DISEASE PREVENTION AND CONTROL\n\nUNIT CODE\n:"
