lgated (01/11/2019)\n61\nUNIT OF COMPETENCY : SHARE KNOWLEDGE & SKILLS AMONG MEMBERS TO\nPROVIDE INFORMATION AND EDUCATION\nCOMMUNICATION (IEC) AND/OR HOUSEHOLD TEACHING\nIN DISEASE PREVENTION AND CONTROL\n\nUNIT CODE\n: HHC532302\n\nUNIT DESCRIPTOR\n: This unit of competency specifies the knowledge, skills and\nattitudes required to promote health programs, projects and\nactivities to improve the quality of health services in the\ncommunity.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Maintain\ncommunity\nnetworks\n\n1.1 Community contacts\nare identified and\nfollowed up to maximize\nits range\n1.2 New networking/\nlinkages is formed to\nthe clients of potential\nbenefits to the\norganization\n1.3 Community relationships\nare established and\nmaintained in\naccordance with DOH\nHealth objectives\n(provide supporting\ndocuments e.g. NOH)\n1.4 Regular meetings\nconducted among BHW\nfor updating health\nprograms/projects\n1.1 Organization's\npolicies, plans and\nprocedures\n1.2 Office Protocol\n1.3 Office\nForms/Matrix\n1.4 Networking\nProcess\n1.5 IEC Materials\n1.6 Basic Mathematics\n1.7 Priority Programs\nand Projects\n\n1.1 Initiative\n1.2 Communication\nSkills\n1.3 Negotiation skills\n1.4 Leadership skills\n1.5 Time/\nOrganizational\n1.6 Management skills\n1.7 Relating to people\nfrom a range of\nsocial, cultural and\nethnic\nbackgrounds and\nwith a range of\nphysical and\nmental abilities\n1.8 Applying\norganization's\npolicies, plans and\nprocedures\n2. Promote basic\nprimary health\ncare services to\nthe community\n2.1 Issuances, policies and\npractices of the DOH,\nRHUs and BHS are\neffectively\ncommunicated to clients\nand community groups\nthrough the guidance of\nrural health midwife\nand/or nurse\n2.2 Implementation of health\nstrategies are promoted\nin accordance with\norganization's interests\nand requirements.\n2.3 Presentation skills are\nused to commu