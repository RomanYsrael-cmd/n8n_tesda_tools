          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained community networks\n1.2\nPromoted basic primary health care services to the\ncommunity\n1.3\nProvided regular and updated basic health education and/or\nhousehold teaching to the community\n2. Resource Implications\nThe following resources should be provided:\n2.1\nManpower\n2.1\nMachine\n2.2\nMoney\n2.3\nMaterials\n2.4\nMethods\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with questioning\n3.2\nInterview\n3.3\nObservation with questioning\n3.4\nWritten Exam\n\n4. Context of Assessment\n4.1\nCompetency may be assessed in the actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 69 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n65\nUNIT OF COMPETENCY : ENSURE SAFE KEEPING OF EQUIPMENT, MEDICAL\nSUPPLIES, MATERIALS AND HEALTH RECORDS IN\nHEALTH STATION\n\nUNIT CODE\n:"
        },
        "source_text": "HHC532302\n\nUNIT DESCRIPTOR\n: This unit of competency specifies the knowledge, skills and\nattitudes required to promote health programs, projects and\nactivities to improve the quality of health services in the\ncommunity.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Maintain\ncommunity\nnetworks\n\n1.1 Community contacts\nare identified and\nfollowed up to maximize\nits range\n1.2 New networking/\nlinkages is formed to\nthe clients of potential\nbenefits to the\norganization\n1.3 Community relationships\nare established and\nmaintained in\naccordance with DOH\nHealth objectives\n(provide supporting\ndocuments e.g. NOH)\n1.4 Regular meetings\nconducted among BHW\nfor updating health\nprograms/projects\n1.1 Organization's\npolicies, plans and\nprocedures\n1.2 Office Protocol\n1.3 Office\nForms/Matrix\n1.4 Networking\nProcess\n1.5 IEC Materials\n1.6 Basic Mathematics\n1.7 Priority Programs\nand Projects\n\n1.1 Initiative\n1.2 Communication\nSkills\n1.3 Negotiation skills\n1.4 Leadership skills\n1.5 Time/\nOrganizational\n1.6 Management skills\n1.7 Relating to people\nfrom a range of\nsocial, cultural and\nethnic\nbackgrounds and\nwith a range of\nphysical and\nmental abilities\n1.8 Applying\norganization's\npolicies, plans and\nprocedures\n2. Promote basic\nprimary health\ncare services to\nthe community\n2.1 Issuances, policies and\npractices of the DOH,\nRHUs and BHS are\neffectively\ncommunicated to clients\nand community groups\nthrough the guidance of\nrural health midwife\nand/or nurse\n2.2 Implementation of health\nstrategies are promoted\nin accordance with\norganization's interests\nand requirements.\n2.3 Presentation skills are\nused to communicate\nthe goals and objectives\nof the organization\n2.4 Feedback is obtained to\nidentify and develop\n2.1 Types of advocacy\nmaterials\n2.2 Feedback\n2.3 Office Protocol\n2.4 Goals and\nobjectives of the\norganization\n2.5 Health services\navailable in the\nBHS\n2.6 Recipients\n(e.g.local/barangay\nofficials, health\nproviders, parents,\nhealth/and non-\nhealth\norganizations\n2.7 Importance of\nhealth policy and\n2.1 Presentation skills\n2.2 Disseminate key\nmessages for\nspecific target\ngroups\n2.3 Using written and\nvisual\naids/supports\nmaterials\n2.4 Convincing/\ninfluencing target\ngroups\n2.5 Interpersonal Skills\n2.6 Communication\nskills\n\n--- PDF PAGE 66 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n62\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nways to improve\npromotional activities\nwithin available\nopportunities\n2.5 Health status of clients\nare assessed and\nencouraged to seek\nconsultation/check-up to\nthe BHS, if necessary\nprograms being\npromoted\n\n3. Provide\nregular and\nupdated basic\nhealth\neducation\nand/or\nhousehold\nteaching to\nthe\ncommunity\n3.1 Strategies are\nimplemented according\nto the needs of the\nclients/household and\ncommunity\n3.2 Basic information on\nhealth programs are\nprovided to\nclients/households and\ncommunity\n3.3 Values and beliefs are\nconsidered in providing\nhealth care and\ncommunity development\nprogram\n\n3.1 Health Program\nPolicies,\nGuidelines and\nSOPs\n3.2 Planning\n3.3 Information\n3.4 Documentation\n3.5 Profiling\n3.6 Updated\ninformation on\nclients\n3.7 Monitoring and\nEvaluation\n3.8 Basic Mathematics\n3.9 Values and Beliefs\n\n3.1 Interpersonal Skills\n3.2 Communication\nskills\n3.3 Presenting key\ninformation about\nthe health policies,\nprograms and\nevents\n3.4 Responding to\nclients/audience\nqueries/questions\n3.5 Organizing Skills\n\n--- PDF PAGE 67 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n63\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Contacts\nMay include:\n1.1 Senior Citizen\n1.2 Individuals\n1.3 Household\n1.4 Pantawid Pampamilyang Pilipino Program (4Ps) members\n1.5 Person with special needs\n1.6 Pregnant women\n2. Network/Linkages\nMay include:\n2.1 Senior Citizen\n2.2 Individuals\n2.3 Household\n2.4 4 Ps members\n2.5 Person with special needs\n2.6 Pregnant women\n2.7 DepEd\n2.8 NGO/LGU\n3. Issuances, Policies and\nPractices\nMay include:\n3.1 DOH Policies and Guidelines (AO, DM, DO)\n3.2 Local Policies and Guidelines (e.g. Ordinances, Resolutions,\nMemo)\n3.3 Traditional Beliefs and Practices\n4. Health Programs\nMay include:\n4.1 Basic Family Planning\n4.2 Immunization\n4.3 Prenatal and Post-Natal\n4.4 Child Care\n4.5 Environmental Sanitation\n4.6 Healthy Lifestyle\n4.7 Health Insurance (PhilHealth)\n4.8 Facility Based Delivery\n5. Values and Beliefs\nMay include:\n5.1 Traditional Birth (e.g home delivery, presence of husband\nduring delivery)\n5.2 Refusal on vaccination/immunization (e.g. side effect of\nvaccine)\n5.3 Religion-based (e.g.cult)\n6. Regular Meetings\nMay include:\n6.1 Monthly Meetings\n6.2 Quarterly Meetings\n7. Strategies\nMay include:\n7.1 Organizing participation to conventions/congress (e.g. Buntis\nCongress)\n7.2 Active participation to health summit as participant and reactors\n7.3 Advocate programs on wellness (e.g. Zumba, Diabetis-\nHypertension\n7.4 Identify clients (Health Caravan/Immunization)\n\n--- PDF PAGE 68 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n64\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained community networks\n1.2\nPromoted basic primary health care services to the\ncommunity\n1.3\nProvided regular and updated basic health education and/or\nhousehold teaching to the community\n2. Resource Implications\nThe following resources should be provided:\n2.1\nManpower\n2.1\nMachine\n2.2\nMoney\n2.3\nMaterials\n2.4\nMethods\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with questioning\n3.2\nInterview\n3.3\nObservation with questioning\n3.4\nWritten Exam\n\n4. Context of Assessment\n4.1\nCompetency may be assessed in the actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 69 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n65\nUNIT OF COMPETENCY : ENSURE SAFE KEEPING OF EQUIPMENT, MEDICAL\nSUPPLIES, MATERIALS AND HEALTH RECORDS IN\nHEALTH STATION\n\nUNIT CODE\n:"
