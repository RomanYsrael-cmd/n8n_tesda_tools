        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\n1.1. Communicated with team and individuals on organizational\npolicy and procedures for infection control\n1.2. Applied infection control policies and procedures which impact\non work processes of the specific work unit\n1.3. Applied procedures for adopting appropriate infection\npractices within work unit\n1.4. Provided appropriate supervision of work group\n2. Resource Implications\nThe following resources should be provided:\n2.1. Workplace infection control and health and safety policies and\nprocedures\n2.2. Waste management procedures\n2.3. Food safety procedures\n2.4. Other organizational policies and procedures\n2.5. Duties statements and/or job descriptions\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Interview\n3.3. Portfolio\n3.4. Demonstration with questioning\n4. Context of Assessment\n4.1. Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 44 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n40\nUNIT OF COMPETENCY :\nRESPOND EFFECTIVELY TO DIFFICULT/ CHALLENGING\nBEHAVIOR\n\nUNIT CODE\n:"
        },
        "source_text": "HHC323201\n\nUNIT DESCRIPTOR\n:\nThis unit is concerned with infection control responsibilities of\nemployees with supervisory accountability to implement and\nmonitor infection control policy and procedures in a specific work\nunit or team within an organization. This unit does not apply to a role\nwith organization-wide responsibilities for infection control policy\nand procedure development, implementation or monitoring\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\n REQUIRED SKILLS\n1. Provide\ninformation to\nthe work\ngroup about\nthe\norganization's\ninfection\ncontrol\npolicies and\nprocedures.\n1.1 Relevant information\nabout the organization's\ninfection control policy\nand procedures, and\napplicable industry\ncodes of practice are\naccurately and clearly\nexplained to the work\ngroup\n1.2 Information about\nidentified hazards and\nthe outcomes of\ninfection risk\nassessments is\nregularly provided to the\nwork group\n1.3 Opportunity is provided\nfor the work group to\nseek further information\non workplace infection\ncontrol issues and\npractices\n1.1 Literacy levels and\ncommunication skills\nof work group\nmembers and\nconsequent suitable\ncommunication\ntechniques\n1.2 Reporting,\ndocumentation and\nuse of non - verbal\nand verbal\ncommunication\n1.3 Knowledge on OSH,\ninfection control,\nenvironmental and\ninstitutional, rules,\nguidelines, policies\nand procedures\n1.4 Respect for patient /\nclient rights\n1.5 Knowledge on the\nuse of personal\nprotective equipment\n1.6 Basic knowledge on\ninfectious diseases\ntransmission\n1.7 Concepts on modes\nof communication\n1.8 Knowledge on\nequipment for\ncommunication to be\nused (computer,\ntelephone, cell\nphone etc.)\n\n1.1 Using personal\nprotective\nequipment\n1.2 Identify\ntransmission of\ninfectious diseases\n1.3 Identify mode of\ncommunication\n1.4 Apply modes of\ncommunication\n1.5 Operate equipment\nfor c