        "source_text": "HHC323203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nprovide an initial response where First Aid is required. In this unit it\nis assumed that the First Aider is working under supervision and /\nor according to established workplace First Aid procedures and\npolicies\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Assess the\nsituation\n1.1 Physical hazards to self\nand casualty’s health and\nsafety are identified\n1.2 Immediate risks to self\nand casualty’s\noccupational health and\nsafety (OSH) are\nminimized by controlling\nthe hazard in accordance\nwith OSH requirements\n1.3 Casualty’s vital signs\nand physical condition\nare assessed in\naccordance with\nworkplace procedures\n1.1 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n1.2 Knowledge on\nOSH, infection\ncontrol,\nenvironmental and\ninstitutional, rules,\nguidelines, policies\nand procedures\n1.3 Knowledge on\nbasic anatomy and\nphysiology (parts\nof the human body)\n1.4 Concepts on\nmodes of\ncommunication\n1.5 Knowledge on first\naid principles\n1.6 Knowledge on the\nuse of equipment\n(BP apparatus,\npulse oxymeter,\ndigital thermometer\netc.)\n\n1.1 Identify parts of the\nhuman body\n1.2 Identify abnormal\nvital signs of patient\n/ client\n1.3 Identify mode of\ncommunication\n1.4 Apply\nmodes\nof\ncommunication\n1.5 Resuscitation Skills\n1.6 Operate equipment\nas required for the\nassessment of\npatient / client\n1.7 Safe manual\nhandling of casualty\n1.8 Implement OSH,\ninfection control,\nenvironmental and\ninstitutional, rules,\nguidelines, policies\nand procedures\n1.9 Report preparation\n1.10 Communication\nskills\n1.11 Intra and\nInterpersonal skills\n1.12 Reporting and\ndocumentation\nwith accuracy\n2. Apply basic\nfirst aid\ntechniques\n2.1 First Aid management\nis provided in accordance\nwith established First Aid\nprocedures\n2.2 Casualty is reassured in\na caring and calm\nmanner and made\ncomfortable using\navailable resources\n2.3 First Aid assistance is\nsought from others in a\n2.1 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n2.2 Knowledge on\nOSH, infection\ncontrol,\nenvironmental and\ninstitutional, rules,\n2.1 Identify abnormal\nvital signs of\npatient / client\n2.2 Identify mode of\ncommunication\n2.3 Apply modes of\ncommunication\n2.4 Identify need for\nfirst aid\n2.5 Apply first aid\n\n--- PDF PAGE 50 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n46\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\ntimely manner and as\nappropriate\n2.4 Casualty’s condition is\nmonitored and responded\nto in accordance with\neffective First Aid\nprinciples and\nworkplace procedures\n2.5 Details of casualty’s\nphysical condition,\nchanges in conditions,\nmanagement and\nresponse are accurately\nrecorded in line with\norganizational\nprocedures\n2.6 Casualty management is\nfinalized according to\nhis/her needs and First\nAid principles\nguidelines, policies\nand procedures\n2.3 knowledge and\ntraining on\napplication of first\naid\n2.4 Concepts on\nmodes of\ncommunication\n2.5 Knowledge on first\naid principles\n2.6 Knowledge on the\nuse of equipment\nfor first aid\nresponse\n(ambubag, oxygen\netc.)\n\n2.6 Operate\nequipment as\nrequired for the\nassessment of\npatient / client\n2.7 Safe manual\nhandling of\ncasualty\n2.8 Implement OSH,\ninfection control,\nenvironmental and\ninstitutional, rules,\nguidelines,\npolicies and\nprocedures\n2.9 Intra and\nInterpersonal skills\n2.10 Reporting,\nmonitoring and\ndocumentation\nwith accuracy\n3. Communicate\ndetails of the\nincident\n3.1 Appropriate medical\nassistance is requested\nusing relevant\ncommunication system,\nequipment and\nresources\n3.2 Details of casualty’s\ncondition and\nmanagement activities\nare accurately conveyed\nto emergency\nservices/relieving\npersonnel\n3.3 Reports to supervisors\nare prepared in a timely\nmanner, presenting all\nrelevant facts according\nto established company\nprocedures\n3.1 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n3.2 Concepts on modes\nof communication\n3.3 Knowledge on the\nuse of equipment\nfor first aid\nresponse\n(ambubag, oxygen\netc.)\n3.4 Knowledge on the\nuse of equipment\nfor communication\n(computer, cell\nphone, radio,\nnetwork etc.)\n\n3.1 Identify mode of\ncommunication\n3.2 Apply modes of\ncommunication\n3.3 Identify equipment\nto be use\n3.4 Operate equipment\nfor communication\n3.5 Communication\nskills\n3.6 Intra and\nInterpersonal skills\n3.7 Reporting and\ndocumentation with\naccuracy\n\n--- PDF PAGE 51 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Physical Hazards\nMay include:\n1.1 Workplace hazards\n1.2 Environmental hazards\n1.3 Proximity of other people\n1.4 Hazards associated with casualty management processes\n2. Risks\nMay include:\n2.1 Worksite equipment, machinery and substances\n2.2 Environmental risks\n2.3 Bodily fluids\n2.4 Risk of further injury to the casualty\n2.5 Risk associated with the proximity of the others and bystanders\n3. Vital signs\nMay include:\n3.1 Breathing\n3.2 Circulation\n3.3 Consciousness\n4. First Aid Management\nMay include:\n4.1 Workplace policies and procedures\n4.2 Industry/site specific regulations, codes\n4.3 OSH\n4.4 State and territory workplace health and safety requirements\n4.5 Allergies the casualty may have\n5. Casualty’s Condition\nMay include:\n5.1 Abdominal injuries\n5.2 Allergic reactions\n5.3 Bleeding\n5.4 Burns-thermal, chemical, friction, electrical\n5.5 Cardiac conditions\n5.6 Chemical contamination\n5.7 Cod injuries\n5.8 Crush injuries\n5.9 Dislocations\n5.10 Drowning\n5.11 Eye injuries\n5.12 Fractures\n5.