raction is required in\nregard to patient / client\nservices\nMay include:\n5.1\nOther staff and team members\n5.2\nService units or departments\n5.3\nFamily members, careers and friends of patients / clients\n5.4\nProfessional representatives or agents of patients / clients\nsuch as:\n5.4.1 Medical specialists\n5.4.2 Nurses\n5.4.3 Social workers\n5.4.4 Dietitians\n5.4.5 Therapists\n5.4.6 Allied health professionals\n5.4.7 Volunteers\n5.4.8 Teachers and/or spiritual\n\n--- PDF PAGE 58 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n54\nVARIABLE\nRANGE\n5.4.9 Community\n5.5 General public\n6. Modes of\ncommunication:\nMay include:\n6.1 Continuing interaction with patients / clients and clients\n6.2 Verbal conversations either in person or via telephone\n6.3 Written notes by post or electronic media\n6.4 Worker, family member friend or professional interpreter who\nhas relevant languages\n7. Performance monitoring May include:\n7.1 Self-monitoring\n7.2 Supervisor assessment\n7.3 Patient / client feedback\n\n--- PDF PAGE 59 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n55\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Communicated appropriately with patients / clients\n1.2. Handled complaints and resolved conflict, or referred matters\nto supervisors when required\n1.3. Complied with relevant policies, protocols, guidelines and\nprocedures of the organization\n1.4. Established and maintained good interpersonal relationship\nwith patients / clients\n1.5. Demonstrated courtesy in all interactions with patients /\nclients, their visitors, and family\n2. Resource Implications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Relevant government and organizational policy, guidelines,\nprocedures and protocols\n2.3. Any relevant legislation in relation to service delivery\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1. Demonstration with questioning\n3.2. Interview\n3.3. Third party report\n4. Context of Assessment\n4.1. Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 60 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n56\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : ASSIST THE HOUSEHOLD TO IDENTIFY HEALTH\nPROBLEMS TO PROMOTE HEALTH AND WELL-BEING\n\nUNIT CODE\n:"
