essed in the actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 73 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n69\nUNIT OF COMPETENCY : MONITOR HEALTH STATUS OF HOUSEHOLD MEMBERS\nUNDER HIS/HER AREA OF SERVICE COVERAGE\n\nUNIT CODE\n: HHC532304\n\nUNIT DESCRIPTOR\n: This unit covers knowledge, skills and attitudes in coordinating\ncommunity consultations and referring clients if applicable.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Assist in the\n consultation\n\n1.1 Clients are prioritized for\nconsultation in\naccordance with\nestablished procedures\n1.2 Clients are interviewed in\naccordance with\nworkplace requirements\n1.3 Vital signs and\nanthropometric\nmeasurements are\nverified in compliance\nwith WHO standards\n1.1 Types of client\n1.2 Communication\nProcess\n1.3 Consultation\nProcess\n1.4 Basic Mathematics\n1.5 Vital signs\n1.6 Vital signs taking\n1.7 Anthropometric\nMeasurement and\nMonitoring\n2.1 Information\ngathering\n2.2 Report writing\n2.3 Communicating\nskills\n2.4 Negotiating skills\n2.5 Relating to people\nwith different social,\ncultural and ethnic\nbackgrounds\n\n2. Update\nclient’s record\n\n2.1 Health data\n information is updated\n in accordance with\n office protocol\n2.2 Records are maintained\nin accordance with\ndocumentation process\n2.3. Client’s health status is\nmonitored in accordance\nwith workplace\nrequirements\n\n2.1 Interview Process\n2.2 Documentation\nProcess\n2.3 Office Protocol\n2.4 Basic Mathematics\n2.5 Health Data\nInformation\n2.6 Records\n2.7 Records\nManagement\n2.8 Clients Health\nStatus\n2.9 Use of medical\nequipment in vital\nsigns taking\n2.10 Apply\nanthropometric\nmeasurement\nmonitoring\n\n3.1 Information\ngathering\n3.2 Report writing\n3.3 Communicating\nSkills\n3.4 Relating to people\nwith different social,\ncultural and ethnic\nbackgrou