lines, policies\nand procedures\n1.7 Respect patient /\nclient rights\n1.8 Effective\ncommunicating and\ninterpersonal skills\nincluding:\n1.8.1 language\ncompetence\nliteracy and\nreading\ncompetence\n1.8.2 Negotiating\nSkills\n1.8.3 Intra and\nInterpersonal\nskills\n1.8.4 Reporting and\ndocumentation\nwith accuracy\n\n--- PDF PAGE 40 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n36\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\n REQUIRED SKILLS\n1.8.5 Communication\nskills practiced\nwith eased\n2. Integrate the\norganization's\ninfection\ncontrol policy\nand procedure\ninto work\npractices\n2.1 Infection control policy\nand procedures are\nimplemented by\nsupervisor and members\nof the work group.\n2.2 Liaison is maintained\nwith person responsible\nfor organization-wide\ninfection control.\n2.3 The Supervisor's\ncoaching support\nensures that\nindividuals/teams are\nable to implement\ninfection control\npractices\n2.4 Work procedures are\nadopted to reflect\nappropriate infection\ncontrol practice\n2.5 Issues raised through\nconsultation are dealt\nwith and resolved\npromptly or referred to\nthe appropriate\npersonnel for resolution\n2.6 Workplace procedures\nfor dealing with infection\ncontrol risks and\nhazardous events are\nimplemented whenever\nnecessary\n2.7 Employees are\nencouraged to report\ninfection risks and to\nimprove infection control\nprocedures\n2.1 Literacy levels and\ncommunication\nskills of work group\nmembers and\nconsequent suitable\ncommunication\ntechniques\n2.2 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n2.3 Knowledge on OSH,\ninfection control,\nenvironmental and\ninstitutional, rules,\nguidelines, policies\nand procedures\n2.4 Respect for patient /\nclient rights\n2.5 The significance of\nother management\nsystems and\nprocedures for\ninfection control\n2.6 Knowledge on the\nuse of personal\nprotective\neq