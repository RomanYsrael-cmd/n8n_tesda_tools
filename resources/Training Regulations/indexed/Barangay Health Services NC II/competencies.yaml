        "source_text": "HHC532303\n\nUNIT DESCRIPTOR\n: This unit covers providing knowledge, skills and attitudes to\nensure proper use, storage of equipment and other medical\nsupplies. It also covers updating, recording, and storage of\nmedical records.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Conduct\nphysical\ninventory of\nequipment and\nmedical\nsupplies\n\n1.1 All equipment and\nmedical supplies are\ncounted and recorded\nin accordance with\ninventory policies and\nprocedures\n1.2 All equipment and\nmedical supplies are\nproperly kept in\ndesignated places in\naccordance with\ninventory policies and\nprocedures\n1.3 Equipment and\nmedical supplies are\nmanaged in\naccordance with\nestablished\nprocedures\n1.1 Policies and\nGuidelines\n1.2 Proper storage of\nmedical supplies\n1.3 Basic Mathematics\n1.4 Equipment and\nMedical Supplies\n1.5 Record of\nequipment and\nmedical supplies\n1.6 Designated places\n1.7 Storage\nProcedures\n1.8 Guidelines and\nprotocols\n\n1.1 Implementing the\npolicies, guidelines\nand protocols\n1.2 Recording of\nequipment and\nmedical supplies\n1.3 Applying methods\nand techniques in\nstorage of\nequipment\n1.4 Ensuring access to\nmedical equipment\n\n2. Maintain\ncommunity\nfacilities and\nequipment\n\n2.1 Barangay Health Station\nis properly maintained in\naccordance with\nestablished procedures\n2.2 Appropriate work is\nundertaken to ensure\nthat maintenance of\nequipment and prudent\nuse of community\nresources, materials\nand medical supplies\nare carried out\naccording to DOH\nprotocols\n2.3 Inventory of equipment,\ncommunity resources,\nmaterials and medical\nsupplies regularly done\nto ensure availability\nand easy access to the\ncommunity and in\naccordance with\n2.1 Guidelines and\nProtocols\n2.2 Proper Storage\n2.3 Basic Mathematics\n2.4 Barangay Health\nStation\n2.5 List of available\nequipment,\ncommunity\nresources,\nmaterials and\nmedical supplies\n2.6 Inventory\nprocedures on\nmedicines and\nmedical equipment\nis regularly done\n2.7 Guidelines and\nprotocols\n\n2.1 Records Keeping\n2.2 Implementing\npolicies and\nguidelines\n2.3 Regular updating of\nrecords and data.\n2.4 Implementing the\npolicies, guidelines\nand protocols\n2.5 Recording of\nequipment and\nmedical supplies\n2.6 Applying methods\nand techniques in\nstorage of\nequipment\n2.7 Ensuring access to\nmedical equipment\n\n--- PDF PAGE 70 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n66\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\ninventory policies and\nprocedures\n2.4 All health workers are\nregularly oriented on the\nproper use and storage\nof equipment\n3. Organize\nhealth records\n\n3.1 All relevant records are\nmaintained, updated\nand made available in\naccordance with\nworkplace requirements\n3.2 Maintain record system\nin accordance with\nworkplace requirements\n3.3 Damaged records are\nproperly disposed\naccording to guidelines\nand protocol of record\nmanagement systems\n\n3.1 Office Protocols\n3.2 Records\nManagement\n3.3 Basic\nMathematics\n3.4 Records\n3.5 Records\n3.6 Maintenance\n3.7 Records\nSystem\n3.8 Workplace\n3.9 Policies and\nGuidelines\n3.10 Proper Disposal\n3.11 of Damaged\nRecords\n3.1 Records Keeping\n3.2 Implementing\npolicies and\nguidelines\n3.3 Regular updating\nof records and\ndata.\n3.4 Implementing the\npolicies,\nguidelines and\nprotocols\n3.5 Recording of\nequipment and\nmedical supplies\n3.6 Applying methods\nand techniques in\nstorage of\nequipment\n3.7 Ensuring access\nto medical\nequipment\n\n--- PDF PAGE 71 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n67\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment\nMay include:\n1.1 BP Apparatus\n1.2 Oxygen Tank and Valve\n1.3 Thermometer\n1.4 Weighing Scale\n1.5 Nebulizer\n1.6 G