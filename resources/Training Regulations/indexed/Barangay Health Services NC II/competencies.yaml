          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Complied with institutional requirements, OSH laws infections\ncontrol and manual handling procedures and relevant health\nregulations\n1.2 Identified physical hazards of the casualty and minimized\nimmediate risks\n1.3 Assessed and monitored the physical condition of the casualty\n1.4 Responded to emergency using basic life support measures.\n1.5 Provided initial response where First Aid is required\n1.6 Dealt with complex casualties or incident\n1.7 Prepared reports to concerned personnel in a timely manner\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to relevant work station\n2.2 Relevant institutional policies, guidelines procedure and\nprotocol\n2.3 Equipment and materials relevant to the proposed activities\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Interview\n3.3 Third Party report\n3.4 Portfolio\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Assessment Center.\n\n--- PDF PAGE 53 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n49\nUNIT OF COMPETENCY : MAINTAIN HIGH STANDARDS OF PATIENT / CLIENT SERVICES\n\nUNIT CODE\n :"
