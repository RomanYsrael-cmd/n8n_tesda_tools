        "source_text": "HHC532301\n\nUNIT DESCRIPTOR\n: This unit covers developing relationship with the households\nand liaising effectively with individuals and the family to\npromote health. This also covers the required skills,\nknowledge and attitudes to promote, monitor and assist in\nplanning and delivery to address identified needs.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Collate records\n1.1 Client’s information is\nupdated in accordance with\nworkplace records system\nrequirements and criteria.\n1.2 Records are sorted in\naccordance with workplace\nrequirements.\n1.3 Client’s information is\nsummarized based on the\nworkplace records system.\n1.1 Records\n1.2 Documentation\n1.3 Workplace\nRecords System\nRequirements\n1.4 Report Writing\n1.5 Standard Forms\n1.6 Basic Mathematics\n1.7 Health\nInterventions\n(Knowledge on “All\nLife Stages and\nTBD)\n\n1.1 Information\ngathering\n1.2 Report writing\n1.3 Communicating\nskills\n1.4 Relating to\npeople with\ndifferent social,\ncultural and\nethnic\nbackgrounds\n\n2. Prepare\nreports based\non workplace\nrecord system\n\n2.1 Reports are prepared in\naccordance with standard\nforms.\n2.2 Specific cases are\n discussed with the\n supervisor.\n2.3 Reports are submitted to\nRural Health Midwife\n(RHM) and concerned\nofficial in the barangay.\n2.1 Reports\n2.2 Documentation\n2.3 Workplace\nRecords System\nRequirements\n2.4 Report Writing\n2.5 Standard Forms\n2.6 Basic Mathematics\n\n2.1 Information\ngathering\n2.2 Report writing\n2.3 Communicating\nSkills\n2.4 Relating to\npeople with\ndifferent social,\ncultural and\nethnic\nbackgrounds\n\n--- PDF PAGE 78 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n74\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Client Information\nMay include:\n1.1 Name\n1.2 Age\n1.3 Sex/Gender\n1.4 Birthdate\n1.5 Address\n1.6 Status\n1.7 Spouse and Children\n1.8 Parents Name\n1.9 Religion\n1.10 Complaints\n2. Records\nMay include:\n2.1 Family Profile\n2.2 Household Health Profile\n3. Reports\nMay include:\n3.1 BHW Accomplishment Report\n3.2 Family Profiling Report\n3.3 Family Planning Report\n3.4 Health and Sanitation Report\n4. Standard Forms\nMay include:\n4.1 BHW Accomplishment\n4.2 Family Profiling\n4.3 Family Planning, Health and Sanitation\n5. Specific Cases\nMay include:\n5.1 Referral to nearest health facility\n6. Health Interventions\nMay include:\n6.1 First Aid (if applicable)\n6.2 Referral to nearest health facility\n7. Monitoring Processes\nMay include:\n7.1 Record of Vital Signs (e.g. BP readings, temperature, pulse\nrate)\n7.2 Record of client’s weight and height\n\n--- PDF PAGE 79 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n75\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCollated records\n1.2\nPrepared reports from the record system\n1.3\nAssisted the individual in health planning to address\nspecific needs\n2. Resource Implications\nThe following resources should be provided:\n2.1\nMoney\n2.2\nMachine\n2.3\nManpower\n2.4\nMaterials\n2.5\nMethods\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Interview\n3.2 Observation with Questioning\n3.3 Demonstration with Questioning\n3.4 Written Examination\n4. Context of\nAssessment\n4.1 Competency may be assessed in the actual workplace or at\n the designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 80 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n76"
      }
