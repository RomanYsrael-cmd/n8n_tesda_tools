        "source_text": "HHC532304\n\nUNIT DESCRIPTOR\n: This unit covers knowledge, skills and attitudes in coordinating\ncommunity consultations and referring clients if applicable.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Assist in the\n consultation\n\n1.1 Clients are prioritized for\nconsultation in\naccordance with\nestablished procedures\n1.2 Clients are interviewed in\naccordance with\nworkplace requirements\n1.3 Vital signs and\nanthropometric\nmeasurements are\nverified in compliance\nwith WHO standards\n1.1 Types of client\n1.2 Communication\nProcess\n1.3 Consultation\nProcess\n1.4 Basic Mathematics\n1.5 Vital signs\n1.6 Vital signs taking\n1.7 Anthropometric\nMeasurement and\nMonitoring\n2.1 Information\ngathering\n2.2 Report writing\n2.3 Communicating\nskills\n2.4 Negotiating skills\n2.5 Relating to people\nwith different social,\ncultural and ethnic\nbackgrounds\n\n2. Update\nclient’s record\n\n2.1 Health data\n information is updated\n in accordance with\n office protocol\n2.2 Records are maintained\nin accordance with\ndocumentation process\n2.3. Client’s health status is\nmonitored in accordance\nwith workplace\nrequirements\n\n2.1 Interview Process\n2.2 Documentation\nProcess\n2.3 Office Protocol\n2.4 Basic Mathematics\n2.5 Health Data\nInformation\n2.6 Records\n2.7 Records\nManagement\n2.8 Clients Health\nStatus\n2.9 Use of medical\nequipment in vital\nsigns taking\n2.10 Apply\nanthropometric\nmeasurement\nmonitoring\n\n3.1 Information\ngathering\n3.2 Report writing\n3.3 Communicating\nSkills\n3.4 Relating to people\nwith different social,\ncultural and ethnic\nbackgrounds\n\n3. Refer\nsymptomatic\nclients to\nappropriate\nhealth\nfacilities\n\n3.1 Referral health\nfacilities are identified in\naccordance with\nestablished procedures\n3.2 Clients are advised to\nbring necessary\ndocuments/ health\nrecords\n3.3 Transport of clients are\nfacilitated, if needed\n\n3.1 Medical Services\n3.2 Referral System\n3.3 Health Facilities\n3.4 Service Delivery\nNetwork\n3.5 Client\n3.6 Basic Mathematics\n3.7 Vital Signs Taking\n3.8 Symptomatic\nClients\n3.9 Asymptomatic\nClients\n3.1 Communicating\nskills\n3.2 Gathering\ninformation\n3.3 Referral writing\n3.4 Negotiation skills\n3.5 Networking\n3.6 Relating to people\nwith different social,\ncultural and ethnic\nbackgrounds\n\n--- PDF PAGE 74 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n70\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3.10 Transport of\nClients\n3.11 Use of medical\nequipment in vital\nsigns taking\n3.12 Apply\nanthropometric\nmeasurement\nmonitoring\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Client\nMay include:\n1.1 Pregnant\n1.2 Women of Reproductive Age\n1.3 Infant\n1.4 Under-Five\n1.5 Adolescent\n1.6 Senior Citizens\n1.7 Persons with Special Needs\n2. Vital Signs\n\nMay include:\n2.1 Blood Pressure\n2.2 Temperature\n2.3 Respiration Rate\n2.4 Pulse\n3. Anthropometric\n Measurements\nMay include:\n3.1 Weight\n3.2 Height\n3.3 Body Mass Index (BMI)\n4. Health Data Information May include:\n4.1 Name\n4.2 Date of Birth/Age\n4.3 Gender\n4.4 Civil Status\n4.5 Religion\n4.6 Address\n4.7 Contact Number\n4.8 Chief Complaint\n4.9 OB Score if applicable\n4.10 Blood Type\n4.11 Philhealth Status\n4.12 History of Work Exposure\n4.13 No. of HH Members\n4.14 Health History\n5. Records\nMay include:\n5.1 Individual Treatment Record\n\n--- PDF PAGE 75 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n71\n5.2 Mother and Child Record\n5.3 National Tuberculosis Program Record\n5.4 Hypertension Record\n5.5 Diabetes Mellitus Record\n5.6 Family Planning\n6. Client’s Health Status\nMay include:\n6.1 Underweight/Obese/Stunted/Tall\n6.2 Controlled/Uncontrolled Diabetes Mellitus or Hypertension\n6.3 Undergoing Treatment/Cured/Completed Treatment/Lost to\nfollow-up TB Patient\n7. Referral Health\nFacilities\nMay include:\n7.1 Barangay Health Station\n7.2 Rural Health Unit\n7.3 District Hospital\n7.4 Provincial Hospital\n7.5 Medical Centers\n7.6 Private Clinics and Hospitals\n7.7Lying-In Clinics\n8. Transport of Clients\nMay include:\n8.1 Ambulance\n8.2 Sea Ambulance\n8.3 Air Ambulance\n8.4 Horse-drawn\n8.5 Hammock\n8.6 Multicab\n8.7 Tricyle\n\n--- PDF PAGE 76 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n72\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Assisted in the consultation\n1.2 Updated clients’ record\n1.3 Referred symptomatic/asymptomatic patients for appropriate\n medical services\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Assessment Manual\n2.2 Office Supplies\n2.3 Transportation Expenses\n2.4 Facilities appropriate for the activity\n2.5 Tools and materials appropriate for the activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nInterview\n3.2\nObservation with Questioning\n3.3\nCase Analysis\n3.4\nDemonstration with questioning\n3.5\nWritten Examination\n4. Context of\nAssessment\n4.1\nCompetency may be assessed in the actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 77 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n73\nUNIT OF COMPETENCY : MAINTAIN UPDATED LIST/RECORDS OF HEALTH\nACTIVITIES\n\nUNIT CODE\n:"
