          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Measured required resource utilization in the workplace\nusing appropriate techniques\n1.2. Recorded data in accordance with workplace protocol\n1.3. Identified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4. Validate the identified causes of inefficiency and/or\nineffectiveness thru established environmental\nprocedures\n1.5. Report efficiency and effectives of resource utilization\nto appropriate personnel\n1.6. Clarify feedback on information/concerns raised with\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nWorkplace\n2.2\nTools, materials and equipment relevant to the tasks\n2.3\nPPE\n2.4\nManuals and references\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration\n3.2\nOral questioning\n3.3\nWritten examination\n4. Context for\nAssessment\n•\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n•\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 36 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n32\nUNIT OF COMPETENCY : PRACTICE\nENTREPRENEURIAL\nSKILLS\nIN\nTHE\nWORKPLACE\n\nUNIT CODE\n:"
