ication\n1.4 Operating\nequipment of\ncommunication\nneeded\n1.5 Establishing and\nmaintaining\nrelationships,\ntaking into account\nindividual\ndifferences\n1.6 following the\ninstructions and\nguidance of health\nprofessionals\ninvolved with the\ncare of patient /\nclient\n1.7 respect for patient /\nclient rights\n1.8 Using effective\nlistening techniques\n1.9 Using appropriate\nverbal and non-\nverbal\ncommunication\nstyles\n1.10 Oral and written\ncommunication\n1.11 Problem solving\nskills that includes\nusing available\nresources while\n\n--- PDF PAGE 54 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n50\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1.9 Concepts on\nmodes of\ncommunication\n1.10 Knowledge on the\nuse of equipment\n1.11 Knowledge on\noperating of\nequipment needed\nfor communication\n(computer, cell\nphone, and other\nforms of media)\n\nprioritizing\nworkload\n1.12 Dealing with\nconflict\n1.13 Working with others\nand displaying\nempathy with\npatient / client and\nrelatives\n1.14 Intra and\nInterpersonal skills\n1.15 Reporting and\ndocumentation with\naccuracy\n2. Establish and\nmaintain good\ninterpersonal\nrelationship\nwith patients /\nclients\n2.1 Rapport is established to\nensure the service is\nappropriate to and in the\nbest interests of patients\n/ clients\n2.2 Effective listening skills\nare used to ensure a\nhigh level of effective\ncommunication and\nquality of service\n2.3 Patient / client concerns\nand needs are correctly\nidentified and responded\nto responsibly and\naccordingly established\nprocedures and\nguidelines\n2.4 Effectiveness of\ninterpersonal interaction\nis consistently monitored\nand evaluated to ensure\nbest patient / client\nservice outcomes\n2.1 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n2.2 Management of\nconflict\n2.3 Knowledge on\ncultural differences\nof p