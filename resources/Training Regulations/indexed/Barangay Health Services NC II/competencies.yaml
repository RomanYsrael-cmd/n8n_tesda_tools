 Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n63\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Contacts\nMay include:\n1.1 Senior Citizen\n1.2 Individuals\n1.3 Household\n1.4 Pantawid Pampamilyang Pilipino Program (4Ps) members\n1.5 Person with special needs\n1.6 Pregnant women\n2. Network/Linkages\nMay include:\n2.1 Senior Citizen\n2.2 Individuals\n2.3 Household\n2.4 4 Ps members\n2.5 Person with special needs\n2.6 Pregnant women\n2.7 DepEd\n2.8 NGO/LGU\n3. Issuances, Policies and\nPractices\nMay include:\n3.1 DOH Policies and Guidelines (AO, DM, DO)\n3.2 Local Policies and Guidelines (e.g. Ordinances, Resolutions,\nMemo)\n3.3 Traditional Beliefs and Practices\n4. Health Programs\nMay include:\n4.1 Basic Family Planning\n4.2 Immunization\n4.3 Prenatal and Post-Natal\n4.4 Child Care\n4.5 Environmental Sanitation\n4.6 Healthy Lifestyle\n4.7 Health Insurance (PhilHealth)\n4.8 Facility Based Delivery\n5. Values and Beliefs\nMay include:\n5.1 Traditional Birth (e.g home delivery, presence of husband\nduring delivery)\n5.2 Refusal on vaccination/immunization (e.g. side effect of\nvaccine)\n5.3 Religion-based (e.g.cult)\n6. Regular Meetings\nMay include:\n6.1 Monthly Meetings\n6.2 Quarterly Meetings\n7. Strategies\nMay include:\n7.1 Organizing participation to conventions/congress (e.g. Buntis\nCongress)\n7.2 Active participation to health summit as participant and reactors\n7.3 Advocate programs on wellness (e.g. Zumba, Diabetis-\nHypertension\n7.4 Identify clients (Health Caravan/Immunization)\n\n--- PDF PAGE 68 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n64\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained community networks\n1.2\nPromoted basic primary health care services to the\ncommunity\n1.3\nProvided regular and updated basic health education and/or\nhousehold teaching to the community\n2. Resource Implications\nThe following resources should be provided:\n2.1\nManpower\n2.1\nMachine\n2.2\nMoney\n2.3\nMaterials\n2.4\nMethods\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with questioning\n3.2\nInterview\n3.3\nObservation with questioning\n3.4\nWritten Exam\n\n4. Context of Assessment\n4.1\nCompetency may be assessed in the actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 69 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n65\nUNIT OF COMPETENCY : ENSURE SAFE KEEPING OF EQUIPMENT, MEDICAL\nSUPPLIES, MATERIALS AND HEALTH RECORDS IN\nHEALTH STATION\n\nUNIT CODE\n: HHC532303\n\nUNIT DESCRIPTOR\n: This unit covers providing knowledge, skills and attitudes to\nensure proper use, storage of equipment and other medical\nsupplies. It also covers updating, recording, and storage of\nmedical records.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Conduct\nphysical\ninventory of\nequipment and\nmedical\nsupplies\n\n1.1 All equipment and\nmedical supplies are\ncounted and recorded\nin accordance with\ninventory policies and\nprocedures\n1.2 All equipment and\nmedical supplies are\nproperly kept in\ndesignated places in\naccordance with\ninventory policies and\nprocedures\n1.3 Equipment and\nmedical supplies are\nmanaged in\naccordance with\nestablished\nprocedures\n1.1 Policies and\nGuidelines\n1.2 Proper storage of\nmedical supplies\n1.3 Basic Mathematics\n1.4 Equipment and\nMedical Supplies\n1.5 Record of\nequipment and\nmedical supplies\n1.6 Designated places\n1.7 Storage\nProcedures\n1.8 Guidelines and\nprotocols\n\n1.1 Implementing the\npolicies, guidelines\nand protocols\n1.2 Recording of\nequipment and\nmedical supplies\n1.3 Applying methods\nand techniques in\nstorage of\nequipment\n1.4 Ensuring access to\nmedical equipment\n\n2. Maintain\ncommunity\nfacilities and\nequipment\n\n2.1 Barangay Hea