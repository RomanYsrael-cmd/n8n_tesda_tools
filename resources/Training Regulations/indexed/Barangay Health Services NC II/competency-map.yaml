  "source_text": "SECTION 1 BARANGAY HEALTH SERVICES NC II QUALIFICATION\n\nThe BARANGAY HEALTH SERVICES NC II Qualification consists of competencies that a\nperson assist the household to identify health problems to promote health and well-being, share\nknowledge and skills among members to provide information, education and communication (IEC)\nand/or household teaching in disease promotion and control, ensure the proper maintenance of\nhealth station and safe custody and its medical supplies, materials and health records, monitor\nhealth status of household members under his/her area of service coverage, maintain updated\nlist/records of health activities.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and procedures\nExercise efficient and effective sustainable practices in the workplace\nPractice entrepreneurial skills in the workplace\n\nUNIT CODE\nCOMMON COMPETENCIES\nHHC323201\nImplement and monitor infection control policies and procedures\nHHC323202\nRespond effectively to difficult/challenging behavior\nHHC323203\nApply basic first aid\nHHC323204\nMaintain high standard of patient / client services\n\nUNIT CODE\nCORE COMPETENCIES\nHHC532301\nAssist the household to identify health problems to promote health and\nwell-being\nHHC532302\nShare knowledge and skills among members to provide information,\neducation and communication (IEC) and/or household teaching in\ndisease prevention and control\nHHC532303\nEnsure safekeeping of equipment, medical supplies, materials, and\nhealth records in health station\nHHC532304\nMonitor health status of household members under his/her area of\nservice coverage\nHHC532305\nMaintain updated list/records of health activities\n\nA person who has achieved this Qualification is competent to be:\n\n Barangay Health Worker\n\n--- PDF PAGE 6 ---\nTR Barangay Health Services NC II Revision 01 Promulgated (01/11/2019)\n2"
