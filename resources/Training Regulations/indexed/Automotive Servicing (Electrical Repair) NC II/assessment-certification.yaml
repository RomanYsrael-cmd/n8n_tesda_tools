      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all units of competency in a qualification with a promulgated Training Regulations. 4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in a single unit or cluster of related units of competency. COC 1 – SERVICE AUTOMOTIVE MANUAL AIR-CONDITIONING SYSTEM • Service manual air-conditioner system • Diagnose and repair manual air-conditioner system • Repair manual air-conditioner compressor magnetic clutch COC 2 - SERVICE AUTOMOTIVE ELECTRICAL SYSTEM • Diagnose and repair ignition system • Diagnose and repair starting system • Diagnose and repair charging system • Diagnose and repair body electrical system 4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification. 4.1.4 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency. 4.1.5 Current holders of National Certificate (NC) in AUTOMOTIVE SERVICING NC II shall have their certificates renewed and converted to the amended TR provided he/she has accumulated at least 2 years (for the last five years) work experience, practicing the competencies prescribed in his/her certificate. A Certificate of Employment and Job Description must be provided as proof. TR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 169 He/she must be a holder of National Certificate in the amended Automotive Servicing NC I. 4.1.6 Current holders of Certificate of Competency (COC) in AUTOMOTIVE SERVICING NC II, shall have to undergo assessment in the amended Training Regulations upon expiration of their Certificates. He or she must be a holder of National Certificate in the amended Automotive Servicing NC I. 4.1.7 Current holders of NTTC Level I in AUTOMOTIVE SERVICING NCII shall have their NCII converted to the amended TR provided that they have forty-eight (48) hours industry immersion within the last two (2) years. He or she must be a holder of National Certificate in the amended Automotive Servicing NC I. 4.1.8 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry 4.1.9 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/assessment process. 4.1.10 A candidate who fails the assessment for two (2) consecutive times shall be advised to go through a refresher course before taking another assessment."
