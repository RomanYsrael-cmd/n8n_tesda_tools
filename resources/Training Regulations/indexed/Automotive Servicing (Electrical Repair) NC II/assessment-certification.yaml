  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence on all units of competency in a\nqualification with a promulgated Training Regulations.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to\nindividuals who were assessed as competent in a single unit or\ncluster of related units of competency.\n\nCOC 1 – SERVICE AUTOMOTIVE MANUAL AIR-CONDITIONING SYSTEM\n• Service manual air-conditioner system\n• Diagnose and repair manual air-conditioner system\n• Repair manual air-conditioner compressor magnetic clutch\n\nCOC 2 - SERVICE AUTOMOTIVE ELECTRICAL SYSTEM\n• Diagnose and repair ignition system\n• Diagnose and repair starting system\n• Diagnose and repair charging system\n• Diagnose and repair body electrical system\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be\nissued the corresponding National Certificate for the Qualification.\n\n4.1.4 Individuals wanting to be certified will have to be assessed in\naccordance with the requirements identified in the relevant unit/s of\ncompetency.\n\n4.1.5 Current holders of National Certificate (NC) in AUTOMOTIVE\nSERVICING NC II shall have their certificates renewed and\nconverted to the amended TR provided he/she has accumulated at\nleast 2 years (for the last five years) work experience, practicing the\ncompetencies prescribed in his/her certificate. A Certificate of\nEmployment and Job Description must be provided as proof.\n\n--- PDF PAGE 170 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 169\nHe/she must be a holder of National Certificate in the amended\nAutomotive Servicing NC I.\n\n4.1.6 Current\nholders\nof\nCertificate\nof\nCompetency\n(COC)\nin\nAUTOMOTIVE SERVICING NC II, shall have to undergo\nassessment in the amended Training Regulations upon expiration of\ntheir Certificates. He or she must be a holder of National Certificate\nin the amended Automotive Servicing NC I.\n\n4.1.7 Current holders of NTTC Level I in AUTOMOTIVE SERVICING NCII\nshall have their NCII converted to the amended TR provided that\nthey have forty-eight (48) hours industry immersion within the last\ntwo (2) years. He or she must be a holder of National Certificate in\nthe amended Automotive Servicing NC I.\n\n4.1.8 The industry shall determine assessment and certification\nrequirements for each qualification with promulgated Training\nRegulations. It includes the following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified\nby industry\n\n4.1.9 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life\nexperiences may apply for recognition in a particular qualification\nthrough a recognition/assessment process.\n\n4.1.10 A candidate who fails the assessment for two (2) consecutive times\nshall be advised to go through a refresher course before taking\nanother assessment.\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\n\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\n\n--- PDF PAGE 171 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 170\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n\n4.2.3 Accredited\nCompetency\nAssessor.\nOnly\naccredited\ncompetency assessor is authorized to conduct assessment of\ncompetence. Competency assessors undergo a quality assured\nsystem of accreditation procedure before they are authorized by\nTESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 172 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 171\n\n"
