  "source_text": "SECTION 1 AUTOMOTIVE SERVICING (ELECTRICAL REPAIR) NC II\nQUALIFICATION\n\nThe AUTOMOTIVE SERVICING (ELECTRICAL REPAIR) NC II Qualification\nconsists of competencies that a person must achieve to service manual air-\nconditioner system, diagnose and repair manual air- conditioner system, repair manual\nair-conditioner compressor magnetic clutch, diagnose and repair ignition system,\ndiagnose and repair starting system, diagnose and repair charging system and\ndiagnose and repair body electrical system.\n\nThis Qualification is packaged from the competency map of the Automotive and\nLand Transport Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nALT723211\nValidate vehicle specification\nALT723212\nMove and position vehicle\nALT723214\nUtilize automotive tools\nALT723215\nPerform mensuration and calculation\nALT723216\nUtilize workshop facilities and equipment\nALT723217\nPrepare servicing parts and consumables\nALT723218\nPrepare vehicle for servicing and releasing\n\nCODE NO.\nCORE COMPETENCIES\nALT723392\nService manual air-conditioner system\nALT723393\nDiagnose and repair manual air-conditioner system\nALT723394\nRepair manual air-conditioner compressor magnetic clutch\nALT723395\nDiagnose and repair ignition system\nALT723396\nDiagnose and repair starting system\nALT723397\nDiagnose and repair charging system\nALT723398\nDiagnose and repair body electrical system\n\n--- PDF PAGE 6 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 5\nA person who has achieved this Qualification is competent to be:\n\n❑ Electrical Technician (Automotive)\n❑ Aircon Technician (Automotive)\n\n--- PDF PAGE 7 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 6"
