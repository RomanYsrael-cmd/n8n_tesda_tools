ir\nsuspension system\nDiagnose and repair engine\ncooling and lubrication system\nDiagnose and repair intake\nand exhaust system\nDiagnose and overhaul engine\nmechanical system\n\n--- PDF PAGE 177 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 176\nGLOSSARY OF TERMS\n\nBASIC HAND TOOLS\nAre tools that is powered by hand (manual labour)\nrather than by any other force (ex. Electric, Air,\nHydrualics, etc,). Hand tools are generally less\ndangerous than power tools.\n\nDIAGNOSE\nTo identify the nature of condition\n\nREPAIR\nReplace and adjust manual conditioner compressor\nmagnetic clutch\n\nSPECIAL TOOLS\nAre tools used to enable the safe, accurate, and\nefficient performance of service operations that are\ndifficult or impossible to perform using basic hand\ntools alone.\n\nTROUBLESHOOTING\nTrace and correct faults\n\n--- PDF PAGE 178 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 177\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAutomotive Servicing (Electrical Repair) NC II\nQualification Code:\nALTASL220\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\nCircular (TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nAutomotive Servicing NC II\nTBR No. 2013-11/\n12/17/2013\n\nDocument\nSuperseded\nAutomotive Servicing NC II\nTBR No. 2013-11/\n12/17/2013\n\n01\nDocument\nAmended\nAutomotive Servicing\n(Chassis Repair) NC II\nTBR No. 2020-33/\n08/11/2020\n\n01\nDocument\nCreated\nAutomotive Servicing\n(Electrical Repair) NC II\nTBR No. 2020-34/\n08/11/2020\nTESDA Circular No.\n129 series of 2020\n01\nDocument\nAmended\nAutomotive Servicing\n(Engine Repair) NC II\nTBR No. 2020-35/\n08/11/2020\n\nLegend: *Description Types\n-Document Created\n\n-Document Amended\n-Document Superseded\n\n--- PDF PAGE 179 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promu