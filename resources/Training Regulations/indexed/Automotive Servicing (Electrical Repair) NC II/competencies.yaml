ions from \nmanufacturer \nspecifications. \n2.4  Visual checking \nof system \n2.5  Conducting \nsystem \nperformance \ntests \n2.6  Servicing manual \nair-conditioning \nsystem \n2.7  Performing post-\nservice testing \n2.8  Reporting \nfindings \n2.9  Applying safety \npractices \n2.10 Operating tools \nand materials \n2.11 Operating \nrecovery \nmachine\n\n--- PDF PAGE 75 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     74 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n2.17 Attitude: \n▪ Patient \n▪ Attention to \ndetails \n▪ Time \nconscious \n▪ Honest \n3.  Complete work \nprocesses \n3.1  Final inspection is \nmade based on \nworkplace \nprocedure. \n3.2  Vehicle is turned-\nover to immediate \nsuperior for quality \ncontrol following \nworkplace \nprocedure. \n3.3  Work area is \nrestored following \n5S of good \nhousekeeping. \n3.4  Wastes are \nmanaged following \nenvironmental rules \nand regulations. \n3.5  Tools and \nequipment are \nchecked and stored \naccording to \nworkplace \nprocedures. \n3.6  Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures. \n3.1  Final inspection \nprocedure \n3.2  Turn-over of \nvehicle \n3.3  Accomplishment \nof repair order \nand other forms \n▪ Job done \n3.5  OSHS \n3.6  Wearing of PPEs \n3.8   Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n \n3.8  3Rs \n3.9  5S \n3.10  Waste \nmanagement \n3.11 Checking and \nstorage of tools \nand equipment \n3.12 Workplace \ndocuments \n3.13 Final inspection \nprocedures \n3.1  Filling-out \nworkplace \ndocumentation \nparts and \nmaterial used. \n3.2  Reporting \ninspection \nfindings and \nmake repair \nrecommendation\ns \n3.3  Conducting final \ninspection \n3.4  Performing \nvehicle turn-over \n3.5  Restoring work \narea \n3.6  Managing \nwastes \n3.7  Checking and \nstoring tools and \nequipment \n3.8  Wearing of PPEs \n3.9  Applying safety \npractices\n\n--- PDF PAGE 76 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     75 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Job requirements \nMay include: \n1.1   Cleaning or replacement A/C filter  \n1.2   Cleaning of evaporator \n1.3   Cleaning of condenser \n1.4   Changing of compressor oil \n1.5   Replacement of expansion valve \n1.6   Replacement of receiver-dryer \n1.7   Replacement O-rings \n1.8   Replacement of flexible hoses \n1.9   Removal and installation of dashboard panel \n2.  Industry criteria \nMay include: \n2.1   Manufacturer specifications \n2.2   Repair manual \n2.3   Workplace procedures \n2.4   Safety and environmental requirements \n2.5   Service history \n3.  Tools and equipment \nMay include: \n3.1   Tools \n3.1.1   Basic hand tools \n3.1.2  Straight hexagon wrench \n3.1.3   Torque wrench (Required torque 100kg cm) \n3.1.4   Feeler gauge \n3.1.5   Service type thermometer \n \n3.2   Equipment \n3.2.1   Recovery and recycling machine \n3.2.2   Manifold charging gauge with hose \n3.2.3   Halogen leak detector \n3.2.4   Refrigerant identifier \n3.2.5   Hygrometer \n3.2.6  Pressure washer  \n3.2.7   Vacuum pump \n3.2.8  Service lamp \n3.3  Materials  \n3.3.1 O- ring \n3.3.2 Rags \n3.3.3 Refrigerant \n3.3.4 Compressor oil \n3.3.5 Shaft seal \n3.3.6 Nitrogen gas \n3.3.7 Desiccant materials \n3.3.8 Butil tape \n3.3.9 PPEs \n▪ Face mask \n▪ Face shield \n▪ Goggles \n▪ Gloves\n\n--- PDF PAGE 77 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     76 \nVARIABLE \nRANGE \n▪ Coverall suit \n▪ Safety shoes \n3.3.10 Cleaning agent \n▪ Brush \n▪ Cleaning solutions \n3.3.11 Car protective equipment (CPE) \n3.3.12 Insulation tape \n4.  System performance \ntests \nMay include: \n4.1   Checking of cooling performance \n4.2   Checking of refrigerant pressure \n4.3   Checking of refrigerant leak \n4.4   Checking of blower operation \n4.5   Checking of air-con panel control \n4.6   Checking of auxiliary fan operation \n4.7   Inspection of magnetic clutch \n5.  Servicing of manual air-\nconditioning system \nMay include: \n5.1   Cleaning of evaporator \n5.2   Cleaning of condenser \n5.3   Replacement of AC filter \n5.4   Recovery, recycling and charging of refrigerant  \n5.5   Replacement of receiver-dryer \n5.6   Pressure leak testing \n6.  Post-service testing \nIncludes: \n6.1   Inspect refrigerant with manifold gauge \n6.2   Check for refrigerant leakage \n6.3   Check blower operation \n6.4   Check condenser fan operation \n6.5   Check temperature control switch operation \n6.6   Check cooling performance \n6.7   Check for unusual noise and vibration \n7.  Workplace documents \nMay include: \n7.1   Job order \n7.2   Repair order \n7.3   Inspection form \n7.4   Diagnostic sheet\n\n--- PDF PAGE 78 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     77 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared to inspect and service manual air-conditioner \nsystem. \n1.1.1   Determined job requirements. \n1.1.2   Sourced and interpreted servicing information. \n1.1.3   Identified hazards associated with the work are and \nmanaged risks. \n1.1.4   Selected and checked tools, equipment, and \nmaterials. \n1.1.5   Reported defective and damaged tools and \nequipment. \n1.1.6   Checked and reported availability of materials. \n1.1.7   Applied safety practices. \n1.2   Serviced manual air-conditioner system and components. \n1.2.1   Visually checked system. \n1.2.2   Carried out system performance tests. \n1.2.3   Serviced manual air-conditioning system. \n1.2.4   Carried out post-service testing. \n1.2.5   Reported findings. \n1.2.6   Applied safety practices. \n1.3   Completed work processes. \n1.3.1   Made final inspection. \n1.3.2   Turned-over vehicle. \n1.3.3   Restored work area. \n1.3.4   Managed wastes. \n1.3.5   Checked and stored tools and equipment. \n1.3.6   Accomplished workplace documents. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Workplace: Real or simulated work area \n2.2   Tools, materials, and equipment relevant to perform \nrequired tasks \n2.3   Manufacturer’s repair manual \n2.4   PPEs \n2.5   Training vehicle \n2.6   First aid kit \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
