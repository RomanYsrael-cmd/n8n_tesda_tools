          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare to \ndiagnose and \nrepair charging \nsystem  \n \n \n1.1 Job requirements \nare determined from \nworkplace \ninstructions  \n1.2 Diagnostic \ninformation is \nsourced and \ninterpreted using \nindustry criteria \n1.3 Diagnostic \nsymptoms are \nanalyzed using \ntroubleshooting table \nguide and those \nmost appropriate to \nthe circumstances \nare selected  \n1.4 Hazards associated \nwith the work are \nidentified and risks \nare managed.  \n1.5 Tools, equipment, \nand materials are \nselected and \nchecked for \nserviceability  \n1.6 Defective and \ndamaged tools and \nequipment are \nreported following \nworkplace \nprocedures. \n1.7 Availability of \nmaterials are \nchecked and \n1.1 Different job \nrequirements \n1.2 Diagnostic \ninformation \n1.3 Troubleshooting \nguide \n1.4 Industry criteria \n1.5 Tools, equipment, \nand materials in \ndiagnosing and \nrepairing charging \nsystem \n1.6 Procedure in \naccomplishing \nforms \n1.7 Types of \nAlternator Pulley \n1.8 Identifying \nhazards \nassociated with \nthe operation \n1.9 Risk management \n1.10 OSHS \n1.11 Waste \nmanagement \n1.12 Tools and \nmeasuring \nequipment \n \n1.1 Interpreting job \nrequirements from \nworkplace \ninstructions \n1.2 Selecting best \ntooling option for \nthe work and \nsequence \nprocedure to \nreduce time and \nmaterial wastage \n1.3 Sourcing and \ninterpreting \ndiagnostic \ninformation \n1.4 Analyzing \ndiagnostic options \n1.5 Using \ntroubleshooting \nguide \n1.6 Identifying \nhazards \n1.7 Managing risks \n1.8 Selecting and \nchecking tools, \nequipment and \nmaterials \n1.9 Reporting non-\nserviceable tools \nand equipment \n1.10 Checking and \nreporting the \navailability of \nmaterials\n\n--- PDF PAGE 108 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     107 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nreported following \nworkplace \nprocedures \n2. Diagnose \ncharging system  \n \n2.1 Diagnostic tests \nare performed \naccording to industry \ncriteria. \n2.2 Inspection is carried \nout according to \nindustry criteria. \n2.3 Inspection results \nare compared with \nmanufacturer \nspecifications \n2.4 Faults are identified \nfrom diagnostic test \nresults following \nindustry criteria \n2.5 Causes of faults are \ndetermined following \nindustry criteria \n2.5 Findings are \nreported according \nto workplace \nprocedures, \nincluding \nrecommendations \nfor required repairs \nor adjustments \n2.6 Safety practices are \napplied following \nOccupational Health \nand Safety (OSH) \nprocedure. \n \n2.1 Industry criteria \n2.2 Component faults \nof charging \nsystem \n2.3 Mensuration \n2.4 Inspection \nprocedure \n2.5 Arithmetic \noperation \n2.6 Battery tester \n2.7 Fundamentals of \nElectromagnetism \n2.8 Fundamental of \nelectricity \n2.9 Procedure in \naccomplishing \nchecklists \n2.10 OSHS \n2.11 Wearing of \nPPEs \n2.12 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n2.13 3Rs \n2.14 5S \n2.15 Attitude: \n▪ Patience \n▪ Attention to \ndetails \n▪ Time \nconscious \n▪ Honest \n2.1 Locating \nappropriate \nsources of \ninformation  \n2.2 Interpreting text, \nsymbols, and \nwiring diagrams in \ndiagnostic and \nrepair information \n2.3 Interpreting \nnumerical \ninformation in \nmanufacturer \nrepair manual. \n2.4 Performing \ndiagnostic tests \n2.5 Carrying out \ninspection \n2.6 Comparing \ninspection results \n2.7 Identifying faults \nand its causes \n2.8 Reporting findings \n2.9 Applying safety \npractices\n\n--- PDF PAGE 109 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     108 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Repair charging \nsystem \n \n3.1 Repair information is \nsourced and \ninterpreted  \n3.3 Repair options are \nanalyzed and \nselected following \nindustry criteria \n3.3 Repair tools, \nequipment and \nmaterials are \nselected and \nchecked according \nto manufacturer \nspecifications and \nworkplace \nprocedures  \n3.4 Repairs and \ncomponent \nreplacements and \nadjustments are \ncarried out \naccording to industry \ncriteria \n3.5 Post-repair testing \nis carried out \naccording to \nworkplace \nprocedures  \n3.6 Safety practices are \napplied following \nOccupational Health \nand Safety (OSH) \nprocedure \n \n3.1 Sourcing and \ninterpretation of \nrepair information \n3.2 Repair options \n3.3 Repair tools, \nequipment, and \nmaterials \n3.4 Replacements \nand adjustments \nof components \n3.5 Post-repair testing \n3.6 Fundamentals of \nelectricity and \nmagnetism \n3.7 Hazards \nassociated with \nthe operations \n3.8 Risk Management  \n3.9 Mensuration on \nalternator \ncharging \n3.10 Resistance \nchecking  \n3.11 Diodes Test \n3.12 Procedure in \naccomplishing \nchecklists \n3.13 OSHS \n3.14 Wearing of \nPPEs \n3.15 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n3.16  \n3.17 3Rs \n3.18 5S \n3.19 Attitude: \n▪ \nPatience \n▪ \nAttention to \ndetails \n▪ \nTime \nconscious \n▪ \nHonest \n3.1 Locating \nappropriate \nsources of \ninformation \nefficiently. \n3.2 Interpreting text, \nsymbols, and \nwiring diagrams \nin diagnostic and \nrepair \ninformation \n3.3 Interpreting \nnumerical \ninformation in \nmanufacturer \nrepair manual. \n3.4 Using multi-\ntesters. \n3.5 Sourcing and \ninterpreting \nrepair \ninformation \n3.6 Analyzing and \nselecting repair \nsymptoms \n3.7 Selecting and \nchecking \nrepairing tools, \nequipment, and \nmaterials \n3.8 Carrying out \nrepairs and \ncomponent \nreplacements \nand adjustments \n3.9 Carrying out \npost-repair \ntesting \n3.10 Applying safety \npractices \n3.11 Identifying \nhazards \n3.12 Managing risk\n\n--- PDF PAGE 110 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     109 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Complete work \nprocesses \n4.1 Final inspection is \nmade based on \nworkplace procedure \n4.2 Vehicle is turned-\nover to immediate \nsuperior for quality \ncontrol following \nworkplace procedure \n4.3 Work area is \nrestored following \n5S of good \nhousekeeping. \n4.4 Wastes are \nmanaged following \nenvironmental rules \nand regulations. \n4.5 Tools and \nequipment are \nchecked and stored \naccording to \nworkplace \nprocedures \n4.6 Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures \n4.1 OSHS \n4.2 Wearing of PPEs \n4.3 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious disease \nin the workplace \n4.4 Waste \nmanagement \n4.5 5S of good \nhousekeeping \n4.6 3Rs \n4.7 Final inspection \nprocedure \n4.8 Vehicle turn-over \nprocedure \n4.9 Accomplishment \nof workplace \ndocuments \n4.10 Attitude: \n▪ \nPatience \n▪ \nAttention to \ndetails \n▪ \nTime \nconscious \n▪ \nHonest \n4.1 Filling-out \nworkplace \ndocumentation \nConducting final \ninspection \n4.2 Performing \nvehicle turn-over \n4.3 Restoring work \narea \n4.4 Managing \nwastes \n4.5 Checking and \nstoring tools and \nequipment \n4.6 Accomplishing \nworkplace \ndocuments\n\n--- PDF PAGE 111 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     110 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Job requirements \nJob requirements may include: \n1.1 Inspection and Replacement of bulbs, fuses, relays \nand switches \n1.2 Inspection and Repair wiring harness and \nconnectors \n1.3 Inspection and Replacement of power regulator, \nmotor, power door lock, wiper and washer motor, \nhorn, air-conditioner and electrical accessories \n2. Industry criteria \nIndustry criteria may include: \n2.1 Manufacturer specifications \n2.2 Repair manual \n2.3 Workplace procedures \n2.4 Safety and environmental requirements \n2.5 Electric Wiring Diagram (EWD)   \n3. Tools, equipment and \nmaterials  \nTools, equipment and materials may include: \nTools: \n3.1 Basic hand tools (wire stripper, side \ncutter/diagonal plier and long nose plier) \n3.2 Torque wrench \n3.3 multi-tester (analog and digital) \n3.4 Soldering iron \n3.5 Clamp Type Ammeter \n3.6  Bench vice \n3.7 Harness and terminal repair kit \n3.8 Soldering stand \n3.9 Desoldering tools \n3.10 Extension Power cable \nEquipment: \n3.11 Battery charger \n3.12 Battery load tester \nMaterials \n3.13 PPEs \n- \nFace mask \n- \nFace shield* \n- \nGoggles \n- \nGloves \n- \nCoverall suit \n- \nSafety shoes \n3.14 Rags \n3.15 Contact cleaner \n3.16 Penetrating oil \n3.17 Sand paper \n3.18 Electrical tape \n3.19 Shrinkable tube Fuse for bulbs \n3.20 Fusible link for battery  \n3.21 Soldering lead \n3.22 Soldering paste\n\n--- PDF PAGE 112 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     111 \nVARIABLE \nRANGE \n3.23 Bulbs – (12 volts)  \n- Double contact  \n- Single contact  \n- Headlight bulb \n- Peanut bulb \n3.24 Fuses  \n- 7.5 amph  \n- 10 amph \n- 15 amph  \n- 20 amph  \n- 30 amph \n3.25 Relays (30-60 Amp) 12 volts \n3.26 Switches   \n- Toggle switch (6 terminal) \n- Push pull switch  \n- Push button switch  \n3.27 Electrical tape \n3.28 Eye terminal \n3.29 Female terminal \n3.30 Male Terminal \n4. Diagnostic tests \nDiagnostic tests may include: \n4.1 Checking of voltage and power supply \n4.2 Continuity checking of bulb, relays, wiring, \ngrounds \n5. Repair option \nRepair option may include: \n5.1 Soldering of wires \n5.2 Replace fuse, relays, switches and bulbs \n5.3 Replace assembly components \n6. Post-repair testing \nPost-repair testing may include: \n6.1 Check and secure wiring connections \n6.2 Secure fuses, relay, switches and connectors \n6.3 Check operation such as power window, power \ndoor lock, windshield wiper, radio, sun roof, \ninstrument panel and gauges and lighting system \n7. Workplace documents May include: \n7.1 Repair order \n7.2 Inspection form\n\n--- PDF PAGE 113 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     112"
