nd \nprotection from \ninfectious disease \nin the workplace \n3.4 3Rs \n3.5 5S of Good \nHousekeeping \n3.6 Types, \ncharacteristics \nand operating \nprinciples of \nmagnetic clutch \ncomponents \n3.7 Tolerances, \nresistances and \nclearances of \nmagnetic clutch \ncomponents \n3.8 Industry criteria \n3.1 Installing \nmagnetic clutch \ncomponents \n3.2 Measuring \ntolerances, \nresistances and \nclearances of \ncomponents \n3.3 Completing \ninstallation of \nmagnetic clutch \ncomponents \n3.4 Carrying out post-\ninstallation \ntesting \n3.5 Applying safety \npractices\n\n--- PDF PAGE 89 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     88 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.9 Installation \nprocedures of \nmagnetic clutch \ncomponents \n3.10 Post-installation \ntesting \n3.11 Attitude: \n3.10.1 Patient \n3.10.2 Attention \nto details \n3.10.3 Time \nconscious \n3.10.4 Honest \n4.  Complete work \nprocesses \n4.1 Final inspection is \nmade based on \nworkplace \nprocedure. \n4.2 Vehicle is turned-\nover to immediate \nsuperior for quality \ncontrol following \nworkplace \nprocedure. \n4.3 Work area is \nrestored following \n5S of good \nhousekeeping. \n4.4 Wastes are \nmanaged following \nenvironmental rules \nand regulations. \n4.5 Tools are checked \nand stored \naccording to \nworkplace \nprocedures. \n4.6  Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures. \n4.1 Final inspection \nprocedure \n4.2 Turn-over of \nvehicle \n4.3 Accomplishment \nof repair order \nand other forms \n4.3.1 Job done \n4.4 OSHS \n4.5 Wearing of PPEs \n4.6 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious disease \nin the workplace \n4.7 5S \n4.8 Waste \nmanagement \n4.9 Checking and \nstorage of tools  \n4.10 Workplace \ndocuments \n4.11 Attitude: \n4.11.1 Patience \n4.11.2 Attention \nto details \n4.11.3 Time \nconscious \n4.11.4 Honest \n4.1 Filling-out \nworkplace \ndocumentation \n4.2 Reporting \ndiagnostic \nfindings and \nmake repair \nrecommendations \n4.3 Conducting final \ninspection \n4.4 Performing \nvehicle turn-over \n4.5 Restoring work \narea \n4.6 Managing wastes \n4.7 Checking and \nstoring tools and \nequipment \n4.8 Wearing of PPEs \n4.9 Applying safety \npractices \n4.10 Accomplishing \nworkplace \ndocuments\n\n--- PDF PAGE 90 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     89 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Job requirements \nMay include: \n1.1   Inspect magnetic clutch \n1.2   Replace magnetic clutch \n1.3   Adjust magnetic clutch \n2.  Industry criteria \nMay include: \n2.1   Manufacturer specifications \n2.2   Repair/Service manual/Workplace procedures \n2.3   Safety and environmental requirements \n2.4   Service history \n3.  Dismantling tools \nMay include: \n3.1   Special service tools (SST) for holding the magnetic \nclutch hub. \n3.2   Snap ring expander \n4.  Materials \nMay include: \n4.1   Refrigerant \n4.2   Penetrating oil \n4.3   PPEs \n- \nFace mask \n- \nFace shield* \n- \nGoggles \n- \nGloves \n- \nCoverall suit \n- \nSafety shoes \n5.  Completion of magnetic \nclutch installation \nMay include: \n5.1   Assembling of magnetic clutch \n5.2   Installing of belt \n6.  Post-installation testing \nMay include: \n6.1   Checking of noise  \n6.2   Monitoring of temperature  \n6.3   Monitoring of pressure \n6.4   Final inspection belt tension \n7.  Workplace documents \nMay include: \n7.1   Job order \n7.2   Repair order \n7.3   Inspection form \n7.4   Diagnostic sheet\n\n--- PDF PAGE 91 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     90 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared to repair manual air conditioner compressor \nmagnetic clutch. \n1.1.1   Determined job requirements. \n1.1.2   Sourced and interpreted information. \n1.1.3   Identified hazards associated with the work are and \nmanaged risks. \n1.1.4   Selected and checked tools. \n1.1.5   Reported defective and damaged tools. \n1.1.6   Checked and reported availability. \n1.1.7   Applied safety practices. \n1.2 Removed magnetic clutch components. \n1.2.1   Removed magnetic clutch. \n1.2.2   Inspected clutch components. \n1.2.3   Sourced out of specification parts. \n1.2.4   Used tools. \n1.2.5   Applied safety practices. \n1.3 Installed magnetic clutch components. \n1.3.1   Installed magnetic clutch components. \n1.3.2   Measured tolerances, resistances and clearances. \n1.3.3   Completed installation of magnetic clutch \ncomponents. \n1.3.4   Carried out post-installation testing. \n1.3.5   Applied safety practices. \n1.4 Completed work processes. \n1.4.1   Made final inspection. \n1.4.2   Turned-over vehicle. \n1.4.3   Restored work area. \n1.4.4   Managed wastes. \n1.4.5   Checked and stored tools. \n1.4.6   Accomplished workplace documents. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1 Workplace: Real or simulated work area \n2.2 Tools, materials, and equipment relevant to perform \nrequired tasks \n2.3 Manufacturer’s repair manual \n2.4 PPEs \n2.5 Training vehicle \n2.6 First aid kit \n2.7 CPE \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
