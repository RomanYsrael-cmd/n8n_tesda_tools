ing \n4.2   Rags \n4.3   Refrigerant \n4.4   Compressor oil \n4.5   Nitrogen gas \n4.6   Insulators  \n4.7   Cleaning agents \n4.7.1   Cleaning solution \n4.7.2   Water \n4.7.3   Brush \n4.7.4   Soap suds \n4.8   CPE \n5.  Diagnostic tests \nMay include: \n5.1   Checking of temperature \n5.2   Checking of initial pressure \n5.3   Conducting leak test \n6.  Component parts \nMay include: \n6.1   Magnetic clutch \n6.2   Field coil \n6.3   Evaporator \n6.4   Compressor \n6.5   Condenser \n6.6   Condenser fan and motor \n6.7   Blower fan and motor \n6.8   Expansion valve \n6.9   Filter dryer \n6.10 Pressure switch \n6.11 Pipes and hose \n6.12 Drive belt \n6.13 Compressor pulley \n6.14 A/C control panel \n6.15 Thermostat \n6.16 A/C amplifier \n6.17 Resistor block \n6.18 Fuse and relay \n6.19 Wires and connectors \n7.  Post repair testing \nMay include: \n7.1   Inspect refrigerant with manifold gauge \n7.2   Check for refrigerant leakage \n7.3   Check blower operation \n7.4   Check condenser fan operation \n7.5   Check temperature control switch operation \n7.6   Check cooling performance \n7.7   Check bubbles on sight glass \n8.  Workplace documents \nMay include: \n8.1   Job order \n8.2   Repair order \n8.3   Inspection form \n8.4   Diagnostic sheet\n\n--- PDF PAGE 85 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     84 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared to diagnose and repair manual air conditioning \nsystem. \n1.1.1   Determined job requirements. \n1.1.2   Sourced and interpreted diagnostic information. \n1.1.3   Identified hazards associated with the work and \nmanaged risks. \n1.1.4   Selected and checked diagnostic and repair tools \nand equipment. \n1.1.5   Reported defective and damaged tools and \nequipment. \n1.1.6   Checked and reported availability of materials. \n1.1.7   Applied safety practices. \n1.2   Diagnosed manual air conditioning system. \n1.2.1   Performed troubleshooting. \n1.2.2   Carried out diagnostic tests. \n1.2.3   Identified faults and its causes. \n1.2.4   Reported findings. \n1.2.5   Accomplished checklist. \n1.2.6   Applied safety practices. \n1.3   Repaired manual air conditioning system. \n1.3.1   Sourced and interpreted repair information. \n1.3.2   Carried out repairs and component replacements \nand adjustments. \n1.3.3   Filled system with compressor oil and charged with \nthe appropriate refrigerant. \n1.3.4   Carried out post- repair testing. \n1.3.5   Applied safety practices. \n1.4   Completed work processes. \n1.4.1   Made final inspection. \n1.4.2   Turned-over vehicle. \n1.4.3   Restored work area. \n1.4.4   Managed wastes. \n1.4.5   Checked and stored tools and equipment. \n1.4.6   Accomplished workplace documents. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Workplace: Real or simulated work area \n2.2   Tools, materials, and equipment relevant to perform \nrequired tasks \n2.3   Manufacturer’s repair manual \n2.4   PPEs \n2.5   Training vehicle \n2.6   First aid kit \n2.7   CPE \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation\n\n--- PDF PAGE 86 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     85 \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
