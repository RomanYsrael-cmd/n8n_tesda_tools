epair) NC II Revision 01     Promulgated     (08/11/2020)     104 \nVARIABLE \nRANGE \n3.31 CPE  \n3.32 PPEs \n- \nFace mask  \n- \nFace shield * \n- \nGoggles \n- \nGloves \n- \nCoverall suit \n- \nSafety shoes \n4. Repair option \nRepair option may include: \n4.1 Replace armature coil \n4.2 Replace field coil \n4.3 Replace bearings  \n4.4 Replace carbon brush \n4.5 Replace magnetic switch \n4.6 Replace starter motor assembly \n5. Post-repair testing \nMay include: \n5.1 Check and secure wiring connections \n5.2 Secure tightening of starter motor  \n5.3 Check and test starting system performance \n6. Workplace documents \nWorkplace documents may include: \n6.1 Job order \n6.2 Repair order \n6.3 Inspection form \n6.4 Diagnostic sheet\n\n--- PDF PAGE 106 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     105 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared to diagnose and repair starting system \n1.2 Diagnosed starting system \n1.3 Repaired starting system \n1.4 Completed work processes \n1.5 Replaced pre-heating system components \n1.6 Applied safety practices \n2.  Resource \nimplications \nThe following resources must be provided: \n2.1 Workplace: Real or simulated work area \n2.2 Appropriate Tools & equipment \n2.3 Materials relevant to the activity  \n2.4 Manufacturer’s repair manual \n2.5 PPEs \n2.6 Training Vehicle \n2.7 First-Aid Kit \n3.  Method of \nassessment \nCompetency should be assessed through:  \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
