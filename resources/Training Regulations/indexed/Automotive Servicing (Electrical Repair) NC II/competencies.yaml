        "source_title": "DIAGNOSE AND REPAIR IGNITION SYSTEM",
        "source_text": "--- PDF PAGE 92 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     91 \n \nUNIT OF COMPETENCY \n: \nDIAGNOSE AND REPAIR IGNITION SYSTEM \n \n \n \nUNIT CODE \n: \nALT723395 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to basic diagnosing and repair the ignition \nsystem such as ignition switch, spark plug, high \ntension \nwires/cables \ncables/ignition \ncoil, \nand \ndistributor. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare to \ndiagnose and \nrepair ignition \nsystem \n1.1  Job requirements \nare determined \nfrom workplace \ninstructions. \n1.2  Diagnostic \ninformation is \nsourced and \ninterpreted using \nindustry criteria. \n1.3  Diagnostic \nsymptoms are \nanalyzed using \ntroubleshooting \nguide and those \nmost appropriate to \nthe circumstances \nare selected. \n1.4  Hazards associated \nwith the work are \nidentified and risks \nare managed. \n1.5  Tools are selected \nand checked for \nserviceability. \n1.6  Defective and \ndamaged tools and \nequipment are \nreported following \nworkplace \nprocedures. \n1.7  Availability of \nmaterials are \nchecked and \nreported following \nworkplace \nprocedures. \n1.1  Different job \nrequirements \n1.2  Diagnostic \ninformation \n1.3  Troubleshooting \nguide \n1.4  Industry criteria \n1.5  Tools, and \nequipment in \ndiagnosing and \nrepairing ignition \nsystem \n1.6  Inspection of \ntools, materials \nand equipment for \nserviceability and \navailability \n1.7  Procedure in \naccomplishing \nforms \n1.8  Electrical \nFundamentals \n1.9  Hazards \nassociated with \nthe operation \n1.10 Management of \nrisk \n1.11 Planning and \norganizing \nactivities \n1.12 Chemistry \n(battery solutions \nand chemical \nreactions) \n1.13 Tools and scan \ntools \n1.14 OSHS \n1.1  Interpreting text, \nsymbols and \nwiring diagrams \nin information \nrelating to \nignition system \ntesting and \nrepair equipment \nfrom \nmanufacturer \nspecifications \nand workplace \ninstructions and \nprocedures \n1.2  Planning own \nwork \nrequirements \nand prioritize \nactions to \nachieve required \noutcomes and \nensure tasks are \ncompleted within \nworkplace \ntimeframes \n1.3  Determining job \nrequirements \n1.4  Sourcing and \ninterpreting \ndiagnostic \ninformation \n1.5  Analyzing and \nselecting \ndiagnostic \nsymptoms \n1.6  Identifying \nhazards\n\n--- PDF PAGE 93 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     92 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.15 Waste \nmanagement \n1.16 3Rs \n1.17 5S \n1.7  Managing risks \n1.8  Selecting and \nchecking \ndiagnostic tools \nand equipment \n1.9  Reporting \ndefective and \ndamaged tools \nand equipment \n1.10 Checking and \nreporting \navailability of \nmaterials \n2.  Diagnose ignition \nsystem \n2.1  Ignition system \ninspection is \nperformed \naccording to \nindustry criteria. \n2.2  Inspection results \nare compared with \nmanufacturer \nspecifications. \n2.3  Faults are identified \nfrom diagnostic test \nresults. \n2.4  Causes of faults are \ndetermined \nfollowing industry \ncriteria. \n2.5  Findings and \nrecommendations \nfor necessary \nrepairs or \nadjustments are \nreported according \nto workplace \nprocedures. \n2.6  Safety practices are \napplied following \nOccupational \nHealth and Safety \n(OSH) procedure. \n2.1  Industry criteria \n2.2  Faults of ignition \nsystem \n2.3  Mensuration \n2.4  Arithmetic \noperation \n2.5  Test of spark plug \ncable resistance/ \ncontinuity \n2.6  Test of ignition \nswitch \n2.7  Test of ignition \nwirings \n2.8  Procedures for \nremoving Ignition \ncomponents \n2.9  Visual inspections \nof ignition \ncomponents \n2.10 Procedure in \naccomplishing \nchecklists \n2.11 OSHS \n2.12 Wearing of PPEs \n2.13. Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n2.14 3Rs \n2.15 5S \n2.16 Attitude \n2.1  Locating \nappropriate \nsources of \ninformation \nefficiently \n2.2  Read and \nCompare ignition \ntiming checking \nprocedure from \nrepair manuals \n2.3  Interpreting \nnumerical \ninformation in the \nmanufacturer’s \nrepair manual \n2.4  Measure voltage, \ncurrent and \nresistance and \nuse basic \nmathematical \noperations, \nincluding \naddition and \nsubtraction, to \ncalculate \ndeviations from \nmanufacturer \nspecifications \n2.5  Performing \ndiagnostic tests \n2.6  Carrying out \ninspection \n2.7  Comparing \ninspection \nresults\n\n--- PDF PAGE 94 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     93 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.15.1 Patience \n2.15.2 Attention \nto details \n2.15.3 Time \nconscious \n2.15.4 Honest \n2.8  Identifying faults \nand its causes \n2.9  Reporting \nfindings \n2.10 Applying safety \npractices \n3.  Repair ignition \nsystem \n3.1  Repair information \nis sourced and \ninterpreted. \n3.2  Repair options are \nanalyzed and \nselected following \nindustry criteria. \n3.3  Repair tools and \nmaterials are \nselected and \nchecked. \n3.4  Repairs and \ncomponent \nreplacements and \nadjustments are \ncarried out \naccording to \nindustry criteria. \n3.5  Post-repair testing \nis carried out \naccording to \nworkplace \nprocedures. \n3.6  Safety practices are \napplied following \nOccupational \nHealth and Safety \n(OSH) procedure. \n3.1  Sourcing and \ninterpretation of \nrepair information \n3.2  Repair options \n3.3  Repair tools and \nmaterials \n3.4  Replacements \nand adjustments \nof components \n3.5  Post-repair testing \n3.6  Oscilloscope \n3.7  Use of tools and \nequipment \n3.8  Procedure in \naccomplishing \nchecklists \n3.9  Numerical \ninformation \n3.10 Measurement of \nvoltage, \nresistance and \ncurrent \n3.11 OSHS \n3.12 Wearing of PPEs \n3.13 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n3.14 Attitude: \n3.13.1 Patient \n3.13.2 Attention \nto details \n3.13.3 Time \nconscious \n3.13.4 Honest \n3.1  Identifying and \nlocating various \nsources of \ninformation \n3.2  Interpreting text, \nsymbols and \nwiring diagrams \nin information \nrelating to \nignition system \ntesting from \nmanufacturer \nspecifications \nand workplace \ninstructions and \nprocedures \n3.3  Technology \nskills: Using tools \nand operating \nequipment \n3.4  Sourcing and \ninterpreting \nrepair \ninformation \n3.5  Analyzing and \nselecting repair \noptions \n3.6  Selecting and \nchecking \nrepairing tools, \nand materials \n3.7  Carrying out \nrepairs and \ncomponent \nreplacements \nand adjustments \n3.8  Carrying out \npost-repair \ntesting \n3.9  Applying safety \npractices\n\n--- PDF PAGE 95 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     94 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.  Complete work \nprocesses \n4.1  Final inspection is \nmade based on \nworkplace \nprocedure. \n4.2  Vehicle is turned-\nover to immediate \nsuperior for quality \ncontrol following \nworkplace \nprocedure. \n4.3  Work area is \nrestored following \n5S of good \nhousekeeping. \n4.4  Wastes are \nmanaged following \nenvironmental rules \nand regulations. \n4.5  Tools are checked \nand stored and any \nfaulty equipment is \nidentified, tagged \nand isolated \naccording to \nworkplace \nprocedures. \n4.6  Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures. \n4.1  Procedure in \naccomplishing \nchecklists \n4.2  OSHS \n4.3  Wearing of PPEs \n4.4  Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n4.5  Waste \nmanagement \n4.6  5S of good \nhousekeeping \n4.7  3Rs \n4.8  Final inspection \nprocedure \n4.9  Vehicle turn-over \nprocedure \n4.10  Accomplishment \nof workplace \ndocuments \n4.11 Attitude: \n4.10.1 Patience \n4.10.2 Attention \nto details \n4.10.3 Time \nconscious \n4.10.4 Honest \n4.1  Conducting final \ninspection  \n4.2  Performing \nvehicle turn-over \n4.3  Restoring work \narea \n4.4  Managing \nwastes \n4.5  Checking and \nstoring tools and \nequipment \n4.6  Accomplishing \nworkplace \ndocuments\n\n--- PDF PAGE 96 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     95 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Job requirements \nJob requirements may include: \n1.1   Check and replace the ignition switch \n1.2   Check and replace contact points and condenser.  \n1.3   Check and adjust dwell angles \n1.4   Check and replace the spark plug and high-tension \nwires \n1.5   check and replace ignition coil \n1.6   Check and replace distributor \n1.7   Check and adjust spark plug air gap clearance \n1.8   Check and replace igniter \n1.9   Troubleshoot of ignition system circuit \n2.  Industry criteria \nIndustry criteria may include: \n2.1   Manufacturer specifications \n2.2   Repair/Service manual \n2.3   Workplace procedures \n2.4   Safety and environmental requirements \n3.  Tools and equipment \nTools and equipment may include: \n3.1   Tools: \n3.1.1   Basic hand tools  \n3.1.2   Feeler or thickness gauge \n3.1.3   Multi – tester (analog and digital) \n3.1.4   Spark plug wrench \n \n3.2   Equipment: \n3.2.1   Timing light \n3.2.2   Service Trouble Light \n4.  Materials \nMaterials may include: \n4.1   Cotton Rags \n4.2   Grease \n4.3   Penetrating oil \n4.4   Electrical tape \n4.5   Contact cleaner \n4.6   PPEs \n- \nFace mask \n- \nFace shield* \n- \nGoggles \n- \nGloves \n- \nCoverall suit \n- \nSafety shoes \n5.  Repair options \nRepair options may include: \n5.1   Replacement \n5.2   Soldering \n5.3   Adjusting \n5.4   Insulating \n6.  Post-repair testing \nMay include: \n6.1   Check and secure wiring/harness connections \n6.2   Check ignition switch connections\n\n--- PDF PAGE 97 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     96 \nVARIABLE \nRANGE \n6.3   Check engine idling and revving condition \n6.4   Check high tension wirings/cables \n6.5   Check spark plugs condition and performance \n6.6   Check ignition timing \n7.  Workplace documents \nWorkplace documents may include: \n7.1   Job order \n7.2   Repair order \n7.3   Inspection form \n7.4   Diagnostic sheet\n\n--- PDF PAGE 98 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     97 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepare to diagnose differential assembly. \n1.1.1   Determined job requirements. \n \n1.2   Prepared to diagnose and repair ignition system. \n1.2.1   Determined job requirements. \n1.2.2   Sourced and interpreted diagnostic information. \n1.2.3   Analyzed diagnostic symptoms. \n1.2.4   Identified hazards associated with the work and \nmanaged risks. \n1.2.5   Selected and checked tools. \n1.2.6   Reported defective and damaged tools and \nequipment. \n1.1.7   Checked and reported availability of materials. \n1.3   Diagnosed ignition system. \n1.3.1   Performed ignition system inspection. \n1.3.2   Compared inspection results. \n1.3.3   Identified faults. \n1.3.4   Determined causes of faults. \n1.3.5   Reported findings and recommendations for \nnecessary repairs or adjustments. \n1.3.6   Applied safety practices. \n1.4   Repaired ignition system. \n1.4.1   Sourced and interpreted repair information. \n1.4.2   Analyzed and selected repair options. \n1.4.3   Selected and checked repair tools and materials. \n1.4.4   Carried out repairs and component replacements \nand adjustments. \n1.4.5   Carried out post-repair testing. \n1.4.6   Applied safety practices. \n1.5   Completed work processes. \n1.5.1   Made final inspection. \n1.5.2   Turned-over vehicle. \n1.5.3   Restored work area. \n1.5.4   Managed wastes. \n1.5.5   Checked and stored tools and identified, tagged \nand isolated any faulty equipment. \n1.5.6   Accomplished workplace documents. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Workplace: Real or simulated work area \n2.2   Tools, materials, and equipment relevant to perform \nrequired tasks \n2.3   Manufacturer’s repair manual \n2.4   PPEs \n2.5   Training vehicle \n2.6   CPE\n\n--- PDF PAGE 99 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     98 \n3.  Method of \nassessment \nCompetency should be assessed through:  \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
