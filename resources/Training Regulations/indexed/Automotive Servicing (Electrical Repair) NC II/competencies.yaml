es and \nteacher feedback \nare contemplated. \n2.2  Progress when \nseeking and \n2.1  Basic SWOT \nanalysis \n2.2  Strategies to \nimprove one’s \nattitude in the \nworkplace \n2.3  Gibbs’ Reflective \nCycle/Model \n(Description, \n2.1  Using the basic \nSWOT analysis \nas self-\nassessment \nstrategy \n2.2  Developing \nreflective \npractice through \nrealization of\n\n--- PDF PAGE 21 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     20 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nresponding to \nfeedback from \nteachers to assist \nthem in \nconsolidating \nstrengths, \naddressing \nweaknesses and \nfulfilling their \npotential are \nmonitored. \n2.3  Outcomes of \npersonal and \nacademic \nchallenges by \nreflecting on \nprevious problem \nsolving and \ndecision making \nstrategies and \nfeedback from \npeers and teachers \nare predicted. \nFeelings, \nEvaluation, \nAnalysis, \nConclusion, and \nAction plan) \nlimitations,  likes/ \ndislikes; through \nshowing of self-\nconfidence \n2.3  Demonstrating \nself-acceptance \nand being able \nto accept \nchallenges \n3.  Boost self-\nconfidence and \ndevelop self-\nregulation \n3.1  Efforts for \ncontinuous self-\nimprovement are \ndemonstrated. \n3.2  Counter-productive \ntendencies at work \nare eliminated. \n3.3  Positive outlook in \nlife are maintained. \n3.1  Four components \nof self-regulation \nbased on Self-\nRegulation \nTheory (SRT) \n3.2  Personality \ndevelopment \nconcepts \n3.3  Self-help \nconcepts (e. g., 7 \nHabits by \nStephen Covey, \ntransactional \nanalysis, psycho-\nspiritual concepts) \n3.1  Performing \neffective \ncommunication \nskills – reading, \nwriting, \nconversing skills \n3.2  Showing \naffective skills – \nflexibility, \nadaptability, etc. \n3.3  Self-assessment \nfor determining \none’s strengths \nand weaknesses\n\n--- PDF PAGE 