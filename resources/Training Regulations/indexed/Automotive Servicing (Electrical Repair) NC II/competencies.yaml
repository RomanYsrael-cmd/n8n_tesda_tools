IRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.18 Materials in \ndiagnosing air-\nconditioner \n2.  Diagnose manual \nair conditioning \nsystem \n2.1  Troubleshooting is \nperformed using \ntroubleshooting \nguide in the repair \nmanual. \n2.2  Diagnostic tests \nare carried out \naccording to \nindustry criteria. \n2.3  Faults and its \ncauses are \nidentified based on \ntroubleshooting \nguide. \n2.4  Findings are \nreported according \nto industry criteria. \n2.5  Checklist is \naccomplished \nfollowing industry \ncriteria. \n2.6  Safety practices are \napplied following \nOccupational \nHealth and Safety \n(OSH) procedure. \n2.1  Heat transfer \nprinciples, \nincluding \nconvection, \nconduction and \nradiation \n2.2  Theory on \nPressure \n2.3  Refrigerants \n2.4  Compressor oils \n2.5  Mensuration  \n2.6  Functions of the \nfollowing air \nconditioning \ncomponents: \n2.6.1 Compressor \n2.6.2 Condenser \n2.6.3 Receiver-\ndrier \n2.6.4 Evaporator \n2.6.5 Blower fan \n2.6.6 Refrigerant \n2.7  Diagnostic tests \n2.8  Faults and its \ncauses \n2.9  Troubleshooting \nguide \n2.10 Industry criteria \n2.11 Troubleshooting \nprocedures of \nmanual air-\ncondition \n2.12 Procedure in \naccomplishing \nchecklists \n2.13 OSHS \n2.14 Wearing of PPEs \n2.15 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n2.1  Interpreting \ninformation from \nmanufacturer \nand workshop \nliterature. \n2.2  Measuring \ntemperatures \nand pressures, \nand using basic \nmathematical \noperations, \nincluding \naddition and \nsubtraction, to \ncalculate \ndeviations from \nmanufacturer \nspecifications \n2.3  Troubleshooting \nmanual air-\nconditioning \nsystem \n2.4  Conducting \ndiagnostic tests \n2.5  Identifying faults \nand its causes \n2.6  Reporting \nfindings \n2.7  Accomplishing \nchecklist \n2.8  Applying safety \npractices\n\n--- PDF PAGE 81 ---\nTR-Automotive Servicing (Electrical Repair) NC II Re