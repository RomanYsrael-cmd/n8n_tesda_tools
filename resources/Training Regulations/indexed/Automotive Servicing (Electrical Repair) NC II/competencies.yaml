        "source_title": "DIAGNOSE AND REPAIR BODY ELECTRICAL SYSTEM",
        "source_text": "--- PDF PAGE 114 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     113 \nUNIT OF COMPETENCY: DIAGNOSE AND REPAIR BODY ELECTRICAL   \n                                           SYSTEM \n \nUNIT CODE:  \n \nALT723398 \n \nUNIT DESCRIPTOR:  \n \nThis unit covers the knowledge, skills and attitudes \nrequired to diagnose and repair body electrical system \nsuch as lighting, wiper, door locks, power window, horn, \naccessories and other electrical system \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \n \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILLS \n1. Prepare to \ndiagnose and \nrepair body \nelectrical \nsystem  \n \n \n1.1 Job requirements are \ndetermined from \nworkplace instructions  \n1.2 Diagnostic information is \nsourced and interpreted \nusing industry criteria \n1.3 Diagnostic symptoms \nare analyzed using \ntroubleshooting guide \nand those most \nappropriate to the \ncircumstances are \nselected  \n1.4 Hazards associated with \nthe work are identified \nand risks are managed  \n1.5 Tools, equipment, and \nmaterials are selected \nand checked for \nserviceability  \n1.6 Defective and damaged \ntools and equipment are \nreported following \nworkplace procedures. \n1.7 Availability of materials \nare checked and \nreported following \nworkplace procedures \n1.1 Different job \nrequirements \n1.2 Diagnostic \ninformation \n1.3 Troubleshooting \nguide \n1.4 Industry criteria \n1.5 Tools, equipment, \nand materials in \ndiagnosing and \nrepairing body \nelectrical system \n1.6 Procedure in \naccomplishing \nforms \n1.7 Identifying hazards \nassociated with the \noperation \n1.8 Risk management \n1.9 Fundamentals of \nelectricity and \nelectronics \n1.10 OSHS \n1.11 Waste \nmanagement \n1.12 Tools and \nmeasuring \nequipment \n \n1.1 Interpreting job \nrequirements \nfrom workplace \ninstructions \n1.2 Selecting best \ntooling option \nfor the work and \nsequence \nprocedure to \nreduce time and \nmaterial \nwastage \n1.3 Sourcing and \ninterpreting \ndiagnostic \ninformation \n1.4 Analyzing \ndiagnostic \noptions \n1.5 Using \ntroubleshooting \nguide \n1.6 Identifying \nhazards \n1.7 Managing risks \n1.8 Selecting and \nchecking tools, \nequipment and \nmaterials \n1.9 Reporting non-\nserviceable \ntools and \nequipment \n1.10 Checking and \nreporting the \navailability of \nmaterials\n\n--- PDF PAGE 115 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     114 \n2. Diagnose body \nelectrical \nsystem  \n \n2.1 Diagnostic tests are \nperformed according to \nindustry criteria. \n2.2 Inspection is carried out \naccording to industry \ncriteria. \n2.3 Inspection results are \ncompared with \nmanufacturer \nspecifications  \n2.4 Faults are identified \nfrom diagnostic test \nresults following industry \ncriteria \n2.5 Causes of faults are \ndetermined following \nindustry criteria \n2.6 Findings are reported \naccording to workplace \nprocedures, including \nrecommendations for \nrequired repairs or \nadjustments \n2.7 Safety practices are \napplied following \nOccupational Health and \nSafety (OSH) procedure. \n \n2.1 Electrical \nprinciples  \n2.1.1 Current, voltage, \nresistance and \npower \n2.2 Series circuits \n2.3 Parallel circuits \n2.4 Series parallel \ncircuits \n2.5 Ohm’s law \n2.6 Diagnostic tests \n2.7 Faults and its \ncauses \n2.8 Electrical \ntroubleshooting \nguide \n2.9 Industry criteria \n2.10 Faults of body \nelectrical system \n2.11 Manual air-\nconditioner \nsystem \n2.12 Lighting \n2.13 Wiper operation \n2.14 Door locks \n2.15 Window regulator \n2.16 Horn \n2.17 Accessories \n2.18 Mensuration \n2.19 Inspection \nprocedure \n2.20 Arithmetic \noperation \n2.21 Battery tester \n2.22 Fundamentals of \nelectromagnetism \n2.23 Fundamental of \nelectricity \n2.24 Techniques for \nreading and \ninterpreting \ntechnical \ninformation, \nincluding circuit \ntypes, diagrams \nand symbols \n2.25 Procedures for \nusing and \noperating \nelectrical test \nequipment \n2.26 Procedure in \naccomplishing \nchecklists \n2.27 OSHS \n2.1 Locating \nappropriate \nsources of \ninformation \n2.2 Interpreting text, \nsymbols, and \nwiring diagrams \nin diagnostic \nand repair \ninformation \n2.3 Interpreting \nnumerical \ninformation in \nmanufacturer \nrepair manual. \n2.4 Performing \ndiagnostic tests \n2.5 Carrying out \ninspection \n2.6 Comparing \ninspection \nresults \n2.7 Identifying faults \nand its causes \n2.8 Reporting \nfindings \n2.9 Applying safety \npractices\n\n--- PDF PAGE 116 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     115 \n2.28 Wearing of PPEs \n2.29 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n2.30 3Rs \n2.31 5S \n2.32 Attitude: \n▪ Patience \n▪ Attention to \ndetails \n▪ Time conscious \n▪ Honest\n\n--- PDF PAGE 117 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     116 \n3. Repair body \nelectrical \nsystem \n \n3.1 Repair information is \nsourced and interpreted  \n3.2 Repair options are \nanalyzed and selected \nfollowing industry criteria \n3.3 Repair tools, equipment \nand materials are \nselected and checked \naccording to \nmanufacturer \nspecifications and \nworkplace procedures  \n3.4 Repairs and component \nreplacements and \nadjustments are carried \nout according to industry \ncriteria \n3.5 Post-repair testing is \ncarried out according to \nworkplace procedures  \n3.6 Safety practices are \napplied following \nOccupational Health and \nSafety (OSH) procedure \n \n3.1 Sourcing and \ninterpretation of \nrepair information \n3.2 Repair options \n3.3 Repair tools, \nequipment, and \nmaterials \n3.4 Replacements and \nadjustments of \ncomponents \n3.5 Soldering \ntechnique \n3.6 Post-repair testing \n3.7 Fundamentals of \nelectronics and \nelectricity \n3.8 Hazards \nassociated with the \noperations \n3.9 Risk Management \n3.10 Resistance \nchecking \n3.11 Procedure in \naccomplishing \nchecklists \n3.12 OSHS \n3.13 Wearing of PPEs \n3.14 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n3.15 3Rs \n3.16 5S \n3.17 Attitude: \n▪ \nPatience \n▪ \nAttention to \ndetails \n▪ \nTime conscious \n▪ \nHonest \n3.1 Locating \nappropriate \nsources of \ninformation \nefficiently. \n3.2 Interpreting text, \nsymbols, and \nwiring diagrams \nin diagnostic and \nrepair \ninformation \n3.3 Interpreting \nnumerical \ninformation in \nmanufacturer \nrepair manual. \n3.4 Using multi-\ntesters \n3.5 Sourcing and \ninterpreting \nrepair \ninformation \n3.6 Analyzing and \nselecting repair \nsymptoms \n3.7 Selecting and \nchecking \nrepairing tools, \nequipment, and \nmaterials \n3.8 Carrying out \nrepairs and \ncomponent \nreplacements \nand adjustments \n3.9 Carrying out \npost-repair \ntesting \n3.10 Applying \nsafety \npractices \n3.11 Identifying \nhazards \n3.12 Managing risk \n4. Complete work \nprocesses \n4.1 Final inspection is made \nbased on workplace \nprocedure \n4.2 Vehicle is turned-over to \nimmediate superior for \nquality control following \nworkplace procedure \n4.1 OSHS \n4.2 Wearing of PPEs \n4.3 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious disease \nin the workplace \n4.1 Filling-out \nworkplace \ndocumentation \nConducting final \ninspection \n4.2 Performing \nvehicle turn-over \n4.3 Restoring work \narea \n4.4 Managing \nwastes\n\n--- PDF PAGE 118 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     117 \n4.3 Work area is restored \nfollowing 5S of good \nhousekeeping. \n4.4 Wastes are managed \nfollowing environmental \nrules and regulations. \n4.5 Tools and equipment \nare checked and stored \naccording to workplace \nprocedures \n4.6 Workplace documents \nare accomplished \naccording to workplace \nprocedures \n4.4 Waste \nmanagement \n4.5 5S of good \nhousekeeping \n4.6 3Rs \n4.7 Final inspection \nprocedure \n4.8 Vehicle turn-over \nprocedure \n4.9 Accomplishment of \nworkplace \ndocuments \n4.10 \nAttitude: \n▪ Patience \n▪ Attention to \ndetails \n▪ Time conscious \n▪ Honest \n4.5 Checking and \nstoring tools and \nequipment \n4.6 Accomplishing \nworkplace \ndocuments\n\n--- PDF PAGE 119 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     118 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Job \nrequirements \nJob requirements may include: \n1.1 Inspection and Replacement of bulbs, fuses, relays and \nswitches \n1.2 Inspection and Repair wiring harness and connectors \n1.3 Inspection and Replacement of power regulator, motor, \npower door lock, wiper and washer motor, horn, air-\nconditioner and electrical accessories \n2. Industry \ncriteria \nIndustry criteria may include: \n2.1 Manufacturer specifications \n2.2 Repair manual \n2.3 Workplace procedures \n2.4 Safety and environmental requirements \n2.5 Electric Wiring Diagram (EWD)   \n3. Tools, \nequipment and \nmaterials \nTools, equipment and materials may include: \nTools: \n3.1 Basic hand tools (wire stripper, side cutter/diagonal plier \nand long nose plier) \n3.2 Torque wrench \n3.3 multi-tester (analog and digital) \n3.4 Soldering iron \n3.5 Clamp Type Ammeter \n3.6 Bench vice \n3.7 Harness and terminal repair kit \n3.8 Soldering stand \n3.9 Desoldering tools \n3.10 Extension Power cable \nEquipment: \n3.11 Battery charger \n3.12 Battery load tester \nMaterials \n3.13 PPEs \n- \nFace mask \n- \nFace shield* \n- \nGoggles \n- \nGloves \n- \nCoverall suits \n- \nSafety shoes \n3.14 Rags \n3.15 Contact cleaner \n3.16 Penetrating oil \n3.17 Sand paper \n3.18 Electrical tape \n3.19 Shrinkable tube Fuse for bulbs \n3.20 Fusible link for battery  \n3.21 Soldering lead \n3.22 Soldering paste \n3.23 Bulbs – (12 volts)  \n- Double contact\n\n--- PDF PAGE 120 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     119 \n- Single contact  \n- Headlight bulb \n- Peanut bulb \n3.24 Fuses  \n- 7.5 amph  \n- 10 amph \n- 15 amph  \n- 20 amph  \n- 30 amph \n3.25 Relays (30-60 Amp) 12 volts \n3.26 Switches   \n- Toggle switch (6 terminal) \n- Push pull switch  \n- Push button switch  \n3.27 Electrical tape \n3.28 Eye terminal \n3.29 Female terminal \n3.30 Male Terminal \n4. Diagnostic \ntests \nDiagnostic tests may include: \n4.1 Checking of voltage and power supply \n4.2 Continuity checking of bulb, relays, wiring, grounds \n5. Repair options \nRepair option may include: \n5.1 Soldering of wires \n5.2 Replace fuse, relays, switches and bulbs \n5.3 Replace assembly components \n6. Post-repair \ntesting \nPost-repair testing may include: \n6.5 Check and secure wiring connections \n6.6 Secure fuses, relay, switches and connectors \n6.7 Check operation such as power window, power door lock, \nwindshield wiper, radio, sun roof, instrument panel and \ngauges and lighting system \n7. Workplace \ndocuments \nWorkplace documents may include: \n7.1 Repair order \n7.2 Inspection form\n\n--- PDF PAGE 121 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     120 \n \n  EVIDENCE GUIDE \n1. Critical \naspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared to diagnose and repair body electrical system \n1.2 Diagnosed body electrical system \n1.3 Repaired body electrical system \n1.4 Completed work processes \n1.5 Applied safety practices \n2. Resource \nimplications \nThe following resources must be provided: \n2.1 Workplace: Real or simulated work area \n2.2 Appropriate Tools & equipment \n2.3 Materials relevant to the activity  \n2.4 Manufacturer’s repair manual \n2.5 PPEs \n2.6 Training vehicle \n2.7 First aid kit \n2.8 CPE \n3. Method of \nassessment \nCompetency should be assessed through:  \n3.1 Demonstration with Oral questioning \n3.3 Written exam \n3.4 Direct Observation \n4. Context for \nassessment \n4.1 Competency must be assessed on the job or  \n      simulated environment.\n",
