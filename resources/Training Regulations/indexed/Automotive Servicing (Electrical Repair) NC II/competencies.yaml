        "source_text": "--- PDF PAGE 79 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     78 \n \nUNIT OF COMPETENCY \n: \nDIAGNOSE AND REPAIR MANUAL AIR-\nCONDITIONER SYSTEM \n \n \n \nUNIT CODE \n: \nALT723393 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to diagnose and repair the manual air-\nconditioner system. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare to \ndiagnose and \nrepair manual air \nconditioning \nsystem \n1.1  Job requirements \nare determined \nfrom workplace \ninstructions. \n1.2  Diagnostic \ninformation is \nsourced and \ninterpreted \nfollowing industry \ncriteria. \n1.3  Hazards associated \nwith the work are \nidentified and risks \nare managed. \n1.4  Diagnostic and \nrepair tools and \nequipment are \nselected and \nchecked for \nserviceability. \n1.5  Defective and \ndamaged tools and \nequipment are \nreported following \nworkplace \nprocedures. \n1.6  Availability of \nmaterials are \nchecked and \nreported following \nworkplace \nprocedures. \n1.7  Safety practices are \napplied following \nOSHS. \n1.1  OSHS \n1.2  Sourcing out and \ninterpretation of \ndiagnostic \ninformation \n1.3  Electrical \nprinciples  \n1.3.1 Current, \nvoltage, \nresistance \nand power \n1.4  Series circuits \n1.5  Parallel circuits \n1.6  Series parallel \ncircuits \n1.7  Ohm’s law \n1.8  Diagnostic tests \n1.9  Faults and its \ncauses \n1.10 Electrical \ntroubleshooting \nguide \n1.11 Service/Repair \nmanual \n1.12 Tools in \ndiagnosing air-\nconditioning \nsystem \n1.13 Interpretation of \njob requirements \n1.14 Different job \nrequirements \n1.15 Serviceability of \ntools \n1.16 Repair manual \n1.17 Work hazards \n1.1  Interpreting job \nrequirements \nfrom workplace \ninstructions \n1.2  Clarifying \ninstructions \n1.3  Locating \nappropriate \nsources of \ninformation \n1.4  Selecting and \nchecking \ndiagnostic and \nrepair tools and \ngauges \n1.5  Reporting \ndefective and \ndamaged tools \nand equipment \n1.6  Checking and \nreporting \navailability of \nmaterials \n1.7  Applying safety \npractices\n\n--- PDF PAGE 80 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     79 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.18 Materials in \ndiagnosing air-\nconditioner \n2.  Diagnose manual \nair conditioning \nsystem \n2.1  Troubleshooting is \nperformed using \ntroubleshooting \nguide in the repair \nmanual. \n2.2  Diagnostic tests \nare carried out \naccording to \nindustry criteria. \n2.3  Faults and its \ncauses are \nidentified based on \ntroubleshooting \nguide. \n2.4  Findings are \nreported according \nto industry criteria. \n2.5  Checklist is \naccomplished \nfollowing industry \ncriteria. \n2.6  Safety practices are \napplied following \nOccupational \nHealth and Safety \n(OSH) procedure. \n2.1  Heat transfer \nprinciples, \nincluding \nconvection, \nconduction and \nradiation \n2.2  Theory on \nPressure \n2.3  Refrigerants \n2.4  Compressor oils \n2.5  Mensuration  \n2.6  Functions of the \nfollowing air \nconditioning \ncomponents: \n2.6.1 Compressor \n2.6.2 Condenser \n2.6.3 Receiver-\ndrier \n2.6.4 Evaporator \n2.6.5 Blower fan \n2.6.6 Refrigerant \n2.7  Diagnostic tests \n2.8  Faults and its \ncauses \n2.9  Troubleshooting \nguide \n2.10 Industry criteria \n2.11 Troubleshooting \nprocedures of \nmanual air-\ncondition \n2.12 Procedure in \naccomplishing \nchecklists \n2.13 OSHS \n2.14 Wearing of PPEs \n2.15 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n2.1  Interpreting \ninformation from \nmanufacturer \nand workshop \nliterature. \n2.2  Measuri