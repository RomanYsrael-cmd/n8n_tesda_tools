          "source_text": "VARIABLE \nRANGE \n1. Job \nrequirements \nJob requirements may include: \n1.1 Inspection and Replacement of bulbs, fuses, relays and \nswitches \n1.2 Inspection and Repair wiring harness and connectors \n1.3 Inspection and Replacement of power regulator, motor, \npower door lock, wiper and washer motor, horn, air-\nconditioner and electrical accessories \n2. Industry \ncriteria \nIndustry criteria may include: \n2.1 Manufacturer specifications \n2.2 Repair manual \n2.3 Workplace procedures \n2.4 Safety and environmental requirements \n2.5 Electric Wiring Diagram (EWD)   \n3. Tools, \nequipment and \nmaterials \nTools, equipment and materials may include: \nTools: \n3.1 Basic hand tools (wire stripper, side cutter/diagonal plier \nand long nose plier) \n3.2 Torque wrench \n3.3 multi-tester (analog and digital) \n3.4 Soldering iron \n3.5 Clamp Type Ammeter \n3.6 Bench vice \n3.7 Harness and terminal repair kit \n3.8 Soldering stand \n3.9 Desoldering tools \n3.10 Extension Power cable \nEquipment: \n3.11 Battery charger \n3.12 Battery load tester \nMaterials \n3.13 PPEs \n- \nFace mask \n- \nFace shield* \n- \nGoggles \n- \nGloves \n- \nCoverall suits \n- \nSafety shoes \n3.14 Rags \n3.15 Contact cleaner \n3.16 Penetrating oil \n3.17 Sand paper \n3.18 Electrical tape \n3.19 Shrinkable tube Fuse for bulbs \n3.20 Fusible link for battery  \n3.21 Soldering lead \n3.22 Soldering paste \n3.23 Bulbs – (12 volts)  \n- Double contact\n\n--- PDF PAGE 120 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     119 \n- Single contact  \n- Headlight bulb \n- Peanut bulb \n3.24 Fuses  \n- 7.5 amph  \n- 10 amph \n- 15 amph  \n- 20 amph  \n- 30 amph \n3.25 Relays (30-60 Amp) 12 volts \n3.26 Switches   \n- Toggle switch (6 terminal) \n- Push pull switch  \n- Push button switch  \n3.27 Electrical tape \n3.28 Eye terminal \n3.29 Female terminal \n3.30 Male Terminal \n4. Diagnostic \ntests \nDiagnostic tests may include: \n4.1 Checking of voltage and power supply \n4.2 Continuity checking of bulb, relays, wiring, grounds \n5. Repair options \nRepair option may include: \n5.1 Soldering of wires \n5.2 Replace fuse, relays, switches and bulbs \n5.3 Replace assembly components \n6. Post-repair \ntesting \nPost-repair testing may include: \n6.5 Check and secure wiring connections \n6.6 Secure fuses, relay, switches and connectors \n6.7 Check operation such as power window, power door lock, \nwindshield wiper, radio, sun roof, instrument panel and \ngauges and lighting system \n7. Workplace \ndocuments \nWorkplace documents may include: \n7.1 Repair order \n7.2 Inspection form\n\n--- PDF PAGE 121 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     120"
