.5 Using \ntroubleshooting \nguide \n1.6 Identifying \nhazards \n1.7 Managing risks \n1.8 Selecting and \nchecking tools, \nequipment and \nmaterials \n1.9 Reporting non-\nserviceable tools \nand equipment \n1.10 Checking and \nreporting the \navailability of \nmaterials\n\n--- PDF PAGE 108 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     107 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nreported following \nworkplace \nprocedures \n2. Diagnose \ncharging system  \n \n2.1 Diagnostic tests \nare performed \naccording to industry \ncriteria. \n2.2 Inspection is carried \nout according to \nindustry criteria. \n2.3 Inspection results \nare compared with \nmanufacturer \nspecifications \n2.4 Faults are identified \nfrom diagnostic test \nresults following \nindustry criteria \n2.5 Causes of faults are \ndetermined following \nindustry criteria \n2.5 Findings are \nreported according \nto workplace \nprocedures, \nincluding \nrecommendations \nfor required repairs \nor adjustments \n2.6 Safety practices are \napplied following \nOccupational Health \nand Safety (OSH) \nprocedure. \n \n2.1 Industry criteria \n2.2 Component faults \nof charging \nsystem \n2.3 Mensuration \n2.4 Inspection \nprocedure \n2.5 Arithmetic \noperation \n2.6 Battery tester \n2.7 Fundamentals of \nElectromagnetism \n2.8 Fundamental of \nelectricity \n2.9 Procedure in \naccomplishing \nchecklists \n2.10 OSHS \n2.11 Wearing of \nPPEs \n2.12 Health protocols \nissued by \ngovernment on \nprevention on \nspread of and \nprotection from \ninfectious \ndisease in the \nworkplace \n2.13 3Rs \n2.14 5S \n2.15 Attitude: \n▪ Patience \n▪ Attention to \ndetails \n▪ Time \nconscious \n▪ Honest \n2.1 Locating \nappropriate \nsources of \ninformation  \n2.2 Interpreting text, \nsymbols, and \nwiring diagrams in \ndiagnostic and \nrepair information \n2.3 Interpre