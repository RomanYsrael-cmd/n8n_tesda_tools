        "source_text": "--- PDF PAGE 51 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     50 \n \nUNIT OF COMPETENCY \n: \nUTILIZE AUTOMOTIVE TOOLS \n \n \n \nUNIT CODE \n: \nALT723214 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills in  \nselecting and using automotive power tools, hand  \ntools and tool keeping. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare \nautomotive tools \n1.1  Automotive tools \nare identified \naccording to their \nclassification and \nspecification. \n1.2  Automotive tools \nand attachments \nare selected \naccording to job \nrequirements. \n1.3  Automotive tools \nand attachments \nare inspected for \ndefects and \ndamages \naccording to \nmanufacturers and \nwork place \nprocedures. \n1.4  Safety practices are \napplied following \nOSHS. \n1.1  Understanding \npower to size \nratio \n1.2  Leverage \n1.3  Types of power \ntools and hand \ntools \n1.4  Uses of \nautomotive power \ntools and hand \ntools \n1.5  Defects and \ndamages of \nautomotive tools \nand attachments \n1.6  Handling of tools \n1.7  Interpretation of \ncontents of users \nmanuals \n1.8  Safety procedures \n1.9  Wearing of PPE \n1.1  Identifying \ndefects or \ndamages of tools \nbefore use \n1.2  Knowledgeable \nin proper \nhandling of tools \n1.3  Identifying tools \nrequired for the \njob \n1.4  Inspecting the \narea were power \ntools will be use \n2.  Use automotive \ntools \n2.1  Attachments are \nmounted to \nautomotive tools \naccording to job \nrequirements. \n2.2  Power tools are \nconnected to \npower sources \naccording to \noperation’s manual. \n2.3  Power tools are \noperated according \nto operation’s \nmanual. \n2.4  Hand tools are \nutilized according to \noperation’s manual. \n2.1  Use of automotive \ntools \n2.2  Application of \nTorque and \npressure \n2.3  Unit conversion of \ntorque \n2.4  English and \nmetric system \n2.5  Types of hand \ntools \n2.6  Types of power \ntools \n2.7  Fundamentals of \nautomotive hand \ntools and power \ntools \n2.1  Analytical skills \n2.2  Technical \nliteracy \n2.3  Mounting \nattachments to \nautomotive tools \n2.4  Connecting \npower tools to \npower sources \n2.5  Operating power \ntools \n2.6  Utilizing hand \ntools \n2.7  Wearing PPEs \n2.8  Applying safety \npractices\n\n--- PDF PAGE 52 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     51 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n \n2.5  PPEs are worn in \naccordance to \nOSHS. \n \n \n2.8  Interpretation of \ncontents of users \nmanuals \n2.9  OSHS \n2.10 Resources \ninformation \n2.10.1 Bulletin \n2.10.2 Shop \nmanual \n2.9  Following \nmanuals \n3.  Maintain \nautomotive tools \n3.1  Automotive tools \nand attachments \nare cleaned \naccording to user’s \nmanual. \n3.2  Automotive tools \nand attachments \nare checked for \nserviceability \naccording to \nworkplace and \nmanufacturers \nprocedures. \n3.3  Defects and \ndamages are \nreported to \nimmediate superior \nfollowing industry \nstandards. \n3.4  Automotive tools \nand attachments \nare stored \naccording to \nworkplace \nprocedures. \n3.5  Safety practices are \napplied following \nOSHS. \n3.6  Wastes are \ndisposed following \nenvironmental law \nand regulations. \n3.1  Different types of \npower tools and \nhand tools \n3.2  Techniques in tool \nArrangement \n3.3  Fundamentals of \nautomotive tools \n3.4  Cleaning of \nautomotive tools \n3.5  Labeling and \narranging of \npower tools and \nhand tools \n3.6  Safety practices \n3.7  Procedures in \nmaintaining of \npower tools and \nhand tools \n3.8  Tagging of \ndamaged/ worn \npower tools and \nhand tools \n3.9  Reporting \ndamage power \ntools and hand \ntools \n3.10 Proper disposal \nof damaged tools \n3.11 Proper disposal \nof chemicals used \nfor cleaning \n3.12 OSHS \n3.13 Environmental \nlaw and \nregulations \n3.14 5S of good \nhousekeeping \n3.15 3Rs \n3.1  Sorting of tools \n3.2  Skills in creating \nreports \n3.3  Cleaning of tools \n3.4  Checking, \ncleaning and \nstoring \nautomotive tools \nand attachments \n3.5  Reporting \ndefects and \ndamages \n3.6  Disposing \nwastes \n3.7  Practicing safety \nprocedures\n\n--- PDF PAGE 53 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     52 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Automotive tools \nMay include: \n1.1   Power tools \n1.1.1   Electric power tools \n1.1.1.1   Electric drill \n1.1.2   Pneumatic tools \n1.2   Basic tools \n1.3   Special service tools (SST) \n2.  Power sources \nMay include: \n2.1   Electric source \n2.2   Pneumatic or air \n2.3   Hydraulic \n3.  Basic tools \nMay include: \n3.1   Wrenches \n3.2   Pliers \n3.3   Screw drivers \n3.4   Power handle \n3.5   Ratchet \n3.6   Multitester \n3.7   Flash light \n3.8   Rubber mallet \n3.9   Hammer \n3.10 Jack \n3.11 Jack stand \n3.12 Choke \n4.  Attachments \nMay include: \n4.1   Bits \n4.2   Sockets \n4.3   Extension \n5.  Defects and damages \nMay include: \n5.1   Tools \n5.1.1   Cracks \n5.1.2   Breakage \n5.1.3   Deformity \n5.1.4   Looseness \n5.1.5   Corrosions \n5.1.6   Leaks \n5.2   Attachments \n5.2.1   Cracks \n5.2.2   Breakage \n5.2.3   Deformity \n5.2.4   Looseness \n5.2.5   Corrosions \n6.  Personal protective \nequipment (PPEs) \nMay include: \n6.1   Goggles \n6.2   Gloves \n6.3   Hard hat\n\n--- PDF PAGE 54 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     53 \nVARIABLE \nRANGE \n6.4   Safety shoes \n6.5   Dust mask \n7.  Wastes \nMay include: \n7.1   Dead batteries \n7.2   Deformed, cracked, broken bits/sockets/extensions \n7.3   Used cleaning chemicals \n7.4   Used oil \n7.5   Contaminated cleaning materials\n\n--- PDF PAGE 55 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01     Promulgated     (08/11/2020)     54 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment require evidence that the candidate understands \nthe applications and guidelines specified by the manufacturer. \n1.1   Prepared automotive tools \n1.2   Used Power tools  \n1.3   Used Hand tools \n1.4   Maintained and stored automotive tools \n1.5   Disposed wastes \n1.6   Applied safety measures \n2.  Resource \nimplication \nThe following resource MUST be provided: \n2.1   Appropriate power tools and hand tools \n2.2   Tools and materials relevant for training \n2.3   Proper place for storage and disposal \n2.4   Work shop manuals \n3.  Method of \nassessment \nCompetency MUST be assessed through: \n3.1   Written examination \n3.2   Demonstrations with oral questioning \n3.3   Direct observation \n3.4   Third party report \n3.5   Interview \n4.  Context of \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
