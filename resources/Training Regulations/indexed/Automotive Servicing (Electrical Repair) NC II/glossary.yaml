      "term": "BASIC HAND TOOLS",
      "definition": "Are tools that is powered by hand (manual labour) rather than by any other force (ex. Electric, Air, Hydrualics, etc,). Hand tools are generally less dangerous than power tools."
    },
    {
      "term": "DIAGNOSE",
      "definition": "To identify the nature of condition"
    },
    {
      "term": "REPAIR",
      "definition": "Replace and adjust manual conditioner compressor magnetic clutch"
    },
    {
      "term": "SPECIAL TOOLS",
      "definition": "Are tools used to enable the safe, accurate, and efficient performance of service operations that are difficult or impossible to perform using basic hand tools alone."
    },
    {
      "term": "TROUBLESHOOTING",
      "definition": "Trace and correct faults"
    }
  ],
