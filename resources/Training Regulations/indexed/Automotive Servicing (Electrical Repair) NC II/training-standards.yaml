      "source_text": "3.5\nTRAINING FACILITIES\n\nAUTOMOTIVE SERVICING (ELECTRICAL REPAIR) NC II\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The class\nsize of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out servicing of minor automotive parts. Most of the\nlearning activities such as on-vehicle servicing is performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nGRAND TOTAL\nAREA IN SQ.\nMETERS\nA. Building (permanent)\n\n130.00\nLecture Room\n5x6\n30\n30.00\nLaboratory/Workshop\nArea\n\n2 per student\n50.00\nTool room & S/M storage\narea\n\n20\n20.00\nLearning resource area\n5x4\n20\n20.00\nWash area/comfort room\n(male & female)\n\n10\n10.00\n\nTOTAL\n\n130.00\nNOTE: Access to and use of equipment /facilities can be provided through cooperative arrangements\nor MOA with other partner- companies/institutions."
