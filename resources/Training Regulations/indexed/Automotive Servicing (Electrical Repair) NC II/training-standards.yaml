      "source_text": "3.6\nTRAINER’S QUALIFICATIONS FOR AUTOMOTIVE SERVICING\n(ELECTRICAL REPAIR) NC II\n\nNEW TRAINERS\n• Holder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive\nServicing (Electrical Repair) NC II\n• Must have at least 1-year industry experience in automotive servicing for\nthe last 3 years\n\nEXISTING TRAINERS\n• Holder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive\nServicing (Electrical Repair) NC II\n• Must have industry immersion of 40 hours annually (industry training which\nincludes structured training program inclusive of hands-on activities and\nobservation in a workshop, and training certificates with number of hours)"
