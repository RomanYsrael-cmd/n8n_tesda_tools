required during the pandemic as mandated by the existing\nguidelines issued by the government in line with protection against virus and other infectious diseases for trainees\nand trainers\n\n--- PDF PAGE 168 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 167\n\n3.5\nTRAINING FACILITIES\n\nAUTOMOTIVE SERVICING (ELECTRICAL REPAIR) NC II\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The class\nsize of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out servicing of minor automotive parts. Most of the\nlearning activities such as on-vehicle servicing is performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nGRAND TOTAL\nAREA IN SQ.\nMETERS\nA. Building (permanent)\n\n130.00\nLecture Room\n5x6\n30\n30.00\nLaboratory/Workshop\nArea\n\n2 per student\n50.00\nTool room & S/M storage\narea\n\n20\n20.00\nLearning resource area\n5x4\n20\n20.00\nWash area/comfort room\n(male & female)\n\n10\n10.00\n\nTOTAL\n\n130.00\nNOTE: Access to and use of equipment /facilities can be provided through cooperative arrangements\nor MOA with other partner- companies/institutions.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR AUTOMOTIVE SERVICING\n(ELECTRICAL REPAIR) NC II\n\nNEW TRAINERS\n• Holder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive\nServicing (Electrical Repair) NC II\n• Must have at least 1-year industry experience in automotive servicing for\nthe last 3 years\n\nEXISTING TRAINERS\n• Holder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive\nServicing (Electrical Repair) NC II\n• Must have industry immersion of 40 hours annually (industry training which\nincludes structured training program inclusive of hands-on activities and\nobservation in a workshop, and training certificates with number of hours)\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 169 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 168"
