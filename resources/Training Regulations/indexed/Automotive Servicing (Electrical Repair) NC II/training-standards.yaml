    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nAUTOMOTIVE SERVICING\n(ELECTRICAL REPAIR)\nNC Level\nNC II\n\nNominal Training Duration:\n37 Hours (Basic Competencies)\n\n162 Hours (Common Competencies)\n\n213 Hours (Core Competencies)\n\n412\n\n176 SIL\n\n588 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry standards. It\ncovers specialized competencies such as servicing manual air- conditioner system,\ndiagnosing and repairing manual air- conditioner system, repairing manual air-\nconditioner compressor magnetic clutch, diagnosing and repairing ignition system,\nstarting system, charging system and body electrical system.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 123 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 122\n\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures\nand systems\n•\nIdentify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n•\nPrepare different Types of\nquestion\n•\nGather different sources of\ninformation\n•\nApply storage system in\nestablishing workplace\ninformation\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n1.2 Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and\ninstructions\no Workplace interactions and\nprocedures\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 124 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 123\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties\nscenario following workplace\nnstructions\n\n1.3 Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication\nprocedures and systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and\nrecord routine workplace\nmeasures\no Basic mathematical\nprocesses of addition,\nsubtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nPerform workplace duties\nscenario following simple written\nnotices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 125 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 124\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nGather and provide information in\nresponse to workplace\nrequirements\n•\nComplete work related\ndocuments\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and\nscope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team\nand group\no\nObjectives and goals of team\n•\nLocate needed information from\nthe different sources of\ninformation\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and\nresponsibility\n•\nRole Play\no Understanding Individual\ndifferences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a team\nmember\n• Participate in group planning\nactivities\n• Role play: Communication\nprotocols\n• Participate in the discussion of\nstandard work procedures and\npractices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n--- PDF PAGE 126 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 125\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry\nhardware and software products\nand services\n• Identify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\nprocedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n• Analyze routine/procedural\nproblems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.2 Look for\nsolutions to\nroutine\nproblems\n• Review of the current industry\nhardware and software products\nand services\n• Identify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\nprocedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n• Formulate possible solutions to\nproblems and document\nprocedures for reporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 127 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 126\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Recommend\nsolutions to\nproblems\n• Discuss standard operating\nprocedures and documentation\nprocesses\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management\nstrategies that assist in regulating\nbehavior and achieving personal\nand learning goals\n• Explain enablers and barriers in\nachieving personal and career\ngoals\n• Identify techniques in handling\nnegative emotions and unpleasant\nsituation in the workplace such as\nfrustration, anger, worry, anxiety,\netc.\n• Manage properly one’s emotions\nand recognize situations that\ncannot be changed and accept\nthem and remain professional\n• Recall instances that demonstrate\nself- discipline, working\nindependently and showing\ninitiative to achieve personal and\ncareer goals\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 128 ---\nTR-Automotive Servicing (Electrical Repair) NC II Revision 01 Promulgated (08/11/2020) 127\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Share experiences that show\nconfidence, and resilience in the\nface of setbacks and frustrations\nand other negative emotions and\nunpleasant situations in the\nworkplace\n\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve\none’s attitude in the workplace\n• Explain Gibbs’ Reflective\nCycle/Model (Description,\nFeelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/\ndislikes; through showing of self-\nconfidence\n• Demonstrate self-acceptance and\nbeing able to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-\nregulation based on Self-\nRegulation Theory (SRT)\n• Explain personality development\nconcepts\n• Cite self-help concepts (e. g., 7\nHabits by Stephen Covey,\ntransactional analysis, psycho-\nspiritual concepts)\n• Perform effective communication\nskills – reading, writing, conversing\nskills\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 129 ---\nTR-Automotive Servic