          "source_text": "1.  Prepare materials for \nfabricating/ installing \ndoor/window jambs and \npanels \n1.1 Appropriate PPE is selected and used according \nto job requirements and OSHA specifications. \n1.2 Related plans and details are correctly \nidentified and interpreted according to job \nrequirements. \n1.3 Materials, power and hand tools and \nequipment are selected and prepared \nconsistent with job requirements. \n1.4  Materials are re-checked for correct  \n        specifications and to ensure that it is free from \ndefects otherwise defects are reported to \nimmediate supervisor for appropriate action. \n1.5  Unexpected situations are responded to in \naccordance with company rules and \nregulations. \n1.6  Housekeeping is performed according to  \n       safety regulations. \n2.  Fabricate door/window \njambs and panels \n2.1 Materials are cut according to size and to \nrequired specifications with tolerance of +5 cm \nfor length and  +3mm for squareness and \nevenness. \n2.2  Stock is planed, smoothed and squared to the \nrequired specifications of the door/window \njamb and panels.  \n2.3 Stocks are cut and shaped according to \nspecifications.    \n2.4  Parts are assembled according to dimensions \nand specifications.  \n2.5  Fabricated materials are correctly positioned for \ninstallation/assembly. \n2.6   Unexpected situations are responded to in  \n        accordance with company rules and  \n        regulations. \n2.7   Housekeeping is performed according to  \n        safety regulations.\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              48\n \n3.   Assemble/install doors/ \nwindow jambs and panels \n3.1 Pre-fabricated mouldings on door, window \njambs and panels are installed according to \nspecifications. \n3.2   Doors/jambs/panels and windows are installed \nto specified measurements with  3 mm for \nsquareness, levelness, and plumbness. \n3.3 Temporary bracings are removed without \ncausing damage to frame 24 hours after \npouring mortar or concrete.  \n3.4  Finishing hardware materials and accessories \nare attached to installed door, window jambs \nand panels and packed based on \nspecifications. \n3.5 Unexpected situations are responded to in \naccordance with company rules and \nregulations. \n3.6   Work area is cleaned and made safe  \n        according to OHSA regulations. \n \n4.  Complete work \n4.1  Final checks are made to ensure that work       \n       conforms with instructions and to requirements \n4.2  Completion report is prepared and submitted  \n       to appropriate officer. \n4.3  Power and hand tools, equipment and any  \n       surplus resources and materials are checked  \n       and monitored in accordance with established  \n       procedures \n4.4  Work area is monitored as to cleanliness and    \n       safety\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              49\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. PPE \nMay include but not limited to: \n1.1  Safety shoes \n1.2  Dust mask \n1.3  Working clothes \n1.4  Gloves \n1.5  Goggles \n1.6  Hard hat  \n \n2. Plans and details \n 2.1 Exact location \n2.2  Dimensions \n2.3  Symbols and abbreviations \n2.4  Sections and details \n2.5  Quality and quantity of materials \n \n3.  Materials \nMay include but not limited to: \n3.1 Surfaced and seasoned lumber \n3.2 Surface sheath finishes \n  3.2.1 Plyboard \n  3.2.2 Plywood \n  3.2.3 Laminated veneer \n  3.2.4 Fornica \n3.3 Finishing nails \n3.4 Adhesives \n3.5 Wood filler \n3.6 Packing materials \n  3.6.1 Tape \n  3.6.2 Polyurethane/polyvinyl \n3.7 Hardware finishes \n  3.7.1 Door knobs \n  3.7.2 Locks \n  3.7.3 Hinges and screws \n  3.7.4 Barrel bolts \n  3.7.5 Catches \n  3.7.6 Foot bolt \n  3.7.7 Door/eye viewer \n  3.7.8 Door stopper\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              50\n4. Power and hand tools and \n    equipment \nMay include but not limited to: \n4.1 Portable circular saw \n4.2 Router \n4.3 Portable groove cutter \n4.4 Portable planer \n4.5 Electric drill \n4.6 Hand saw \n4.7 Hammer \n4.8 Try square \n4.9 Wood chisel \n4.10  Spirit level \n4.11  Leveling hose \n4.12  Pencil \n4.13  Plumb bob \n4.14  Push–pull tape / zigzag rule \n4.15  Plane \n4.16  Steel square \n4.17  Screw driver (Philips or standard) \n4.18  Hole saw \n4.19  Drill bits \n4.20  Miter box  \n \n5. Defects \n5.1 Natural \n5.2 Manufacturer \n \n6. Unexpected situations \nMay include but not limited to: \n5.1 Injury to personnel \n5.2 Damage to materials \n \n7. Cut \nMay include but not limited to: \n7.1 Dovetail  \n7.2 Finger joints \n \n8. Shaped \nMay include but not limited to: \n8.1 Mouldings \n8.2 Rabbet cut \n8.3 Groove\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              51\n        E VIDENCE GUIDE \n1. Critical aspects \nof competency \nCompetency assessment requires evidence that the \ncandidate: \n1.1  Identified and interpreted related plans and details  \n       according to job requirements \n1.2 Selected, and prepared materials, power and hand tools \nand equipment and PPE are consistent with job \nrequirements. \n1.3 Fabricated/installed doors / window jambs and panels \nfollowing standard procedures and job requirements. \n1.4 Complied with safety regulations for worksite operations \n1.5 Used power and hand tools safely and effectively  \n1.6 Communicated interactively with others to ensure safe \nand effective workplace operations \n1.7 Completed work without injury to personnel or damage \nto materials. \n \n2. Underpinning \nknowledge  \n2.1 Types and uses of PPE  \n2.2 Mensuration \n2.3 Interpretation of related plans and details  \n2.4 Materials, power and hand tools, and equipment uses \nand specifications. \n2.5 5-S  \n2.6 Knowledge of installing door / jambs / window panels \nprocesses \n2.7 Principles of squareness, eveness and smoothness for \nstock and panel preparation and plumbness and \nlevelness for installation of doors / jambs and window \npanels. \n2.8 Finished and installed doors / window / jambs packing \nprocedures \n2.9 Safe and effective use of hand and power tools  \n2.10  Understand economic use of material \n2.11  Knowledge of mounting finishing hardwares \n2.12  Company rules and regulations\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              52\n3. Underpinning  \nskills \n3.1 Using PPE \n3.2 Applying mensuration \n3.3 Interpreting related plans and details \n3.4 Selecting, preparing and using materials, power and \nhand tools and equipment  \n3.5 Following fabricating and installing procedures for door / \njambs and panels \n3.6 Following packing procedures for jambs / windows and \ndoors \n3.7 Following safe and effective use of hand and power tools \n3.8 Performing procedures for mounting finishing hardwares \n3.9 Following company rules and regulations \n \n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Well-ventilated and lighted work place location \n4.2 Power and hand tools and equipment appropriate to \nfabrication and installation processes \n4.3 Materials relevant to the proposed activity \n4.4 Plans and details relevant to the task \n4.5 Appropriate PPE \n \n5. Methods of \nassessment \nCompetency should be assessed through: \n5.1 Direct observation of application to tasks \n5.2 Questions related to underpinning knowledge \n5.3 Third party report \n5.4 Portfolio \n \n6. Context for \nassessment \n6.1   Competency may be assessed in the work place or in a \nsimulated work place setting"
