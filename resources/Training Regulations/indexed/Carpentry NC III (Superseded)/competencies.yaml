ower tools and equipment use\nand specification\n2.5 5-S\n2.6 Procedures for installing architectural / ceilings / walls /\npanels and floor finishes\n2.7 Safe and effective use of power and hand tools, and\nequipment\n2.8 Economic use of material\n2.9 Material handling and storing\n2.10 Company rules and regulations\n\n3. Underpinning\nskills\n3.1 Using PPE\n3.2 Applying mensuration\n3.3 Interpreting plans and details\n3.4 Following safe and effective operational use of power\nand hand tools and equipment\n3.5 Selecting, preparing and using materials economically\n3.6 Following procedures for installing architectural /\nceilings / walls / panels and floor finishes\n3.7 Applying 5S\n3.8 Following company rules and regulations\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 46\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Well ventilated and lighted work place location\n4.2 Power and hand tools and equipment appropriate to\ninstalling architectural ceiling / walls\nsheats/panels/boards and floor finishes\n4.3 Materials relevant to the proposed activity\n4.4 Plans and details relevant to the task\n4.5 Appropriate PPE\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Portfolio\n\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n6.2 Assessment shall be done while tasks are undertaken\nindividually under limited supervision.\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 47\n\nUNIT OF COMPETENCY:\nFABRICATE / INSTALL DOOR / WINDOW\nJAMBS AND PANELS\nUNIT CODE\nCON712323\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nfor fabricating / installing door / window jambs and\npanels.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare materials for\nfabricating/ installing\ndoor/window jambs and\npanels\n1.1 Appropriate PPE is selected and used according\nto job requirements and OSHA specifications.\n1.2 Related plans and details are correctly\nidentified and interpreted according to job\nrequirements.\n1.3 Materials, power and hand tools and\nequipment are selected and prepared\nconsistent with job requirements.\n1.4 Materials are re-checked for correct\n specifications and to ensure that it is free from\ndefects otherwise defects are reported to\nimmediate supervisor for appropriate action.\n1.5 Unexpected situations are responded to in\naccordance with company rules and\nregulations.\n1.6 Housekeeping is performed according to\n safety regulations.\n2. Fabricate door/window\njambs and panels\n2.1 Materials are cut according to size and to\nrequired specifications with tolerance of +5 cm\nfor length and +3mm for squareness and\nevenness.\n2.2 Stock is planed, smoothed and squared to the\nrequired specifications of the door/window\njamb and panels.\n2.3 Stocks are cut and shaped according to\nspecifications.\n2.4 Parts are assembled according to dimensions\nand specifications.\n2.5 Fabricated materials are correctly positioned for\ninstallation/assembly.\n2.6 Unexpected situations are responded to in\n accordance with company rules and\n regulations.\n2.7 Housekeeping is performed according to\n safety regulations.\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 48\n\n3. Assemble/install doors/\nwindow jambs and panels\n3.1 Pre-fabricated mouldings on door, window\njambs and panels are installed according to\nspecifications.\n3.2 Doors/jambs/panels and windows are installed\nto specified measurements with  3 mm for\nsquareness, levelness, and plumbness.\n3.3 Temporary bracings are removed without\ncausing damage to frame 24 hours after\npouring mortar or concrete.\n3.4 Finishing hardware materials and accessories\nare attached to installed door, window jambs\nand panels and packed based on\nspecifications.\n3.5 Unexpected situations are responded to in\naccordance with company rules and\nregulations.\n3.6 Work area is cleaned and made safe\n according to OHSA regulations.\n\n4. Complete work\n4.1 Final checks are made to ensure that work\n conforms with instructions and to requirements\n4.2 Completion report is prepared and submitted\n to appropriate officer.\n4.3 Power and hand tools, equipment and any\n surplus resources and materials are checked\n and monitored in accordance with established\n procedures\n4.4 Work area is monitored as to cleanliness and\n safety\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 49\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nMay include but not limited to:\n1.1 Safety shoes\n1.2 Dust mask\n1.3 Working clothes\n1.4 Gloves\n1.5 Goggles\n1.6 Hard hat\n\n2. Plans and details\n 2.1 Exact location\n2.2 Dimensions\n2.3 Symbols and abbreviations\n2.4 Sections and details\n2.5 Quality and quantity of materials\n\n3. Materials\nMay include but not limited to:\n3.1 Surfaced and seasoned lumber\n3.2 Surface sheath finishes\n 3.2.1 Plyboard\n 3.2.2 Plywood\n 3.2.3 Laminated veneer\n 3.2.4 Fornica\n3.3 Finishing nails\n3.4 Adhesives\n3.5 Wood filler\n3.6 Packing materials\n 3.6.1 Tape\n 3.6.2 Polyurethane/polyvinyl\n3.7 Hardware finishes\n 3.7.1 Door knobs\n 3.7.2 Locks\n 3.7.3 Hinges and screws\n 3.7.4 Barrel bolts\n 3.7.5 Catches\n 3.7.6 Foot bolt\n 3.7.7 Door/eye viewer\n 3.7.8 Door stopper\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 50\n4. Power and hand tools and\n equipment\nMay include but not limited to:\n4.1 Portable circular saw\n4.2 Router\n4.3 Portable groove cutter\n4.4 Portable planer\n4.5 Electric drill\n4.6 Hand saw\n4.7 Hammer\n4.8 Try square\n4.9 Wood chisel\n4.10 Spirit level\n4.11 Leveling hose\n4.12 Pencil\n4.13 Plumb bob\n4.14 Push–pull tape / zigzag rule\n4.15 Plane\n4.16 Steel square\n4.17 Screw driver (Philips or standard)\n4.18 Hole saw\n4.19 Drill bits\n4.20 Miter box\n\n5. Defects\n5.1 Natural\n5.2 Manufacturer\n\n6. Unexpected situations\nMay include but not limited to:\n5.1 Injury to personnel\n5.2 Damage to materials\n\n7. Cut\nMay include but not limited to:\n7.1 Dovetail\n7.2 Finger joints\n\n8. Shaped\nMay include but not limited to:\n8.1 Mouldings\n8.2 Rabbet cut\n8.3 Groove\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 51\n E VIDENCE GUIDE\n1. Critical aspects\nof competency\nCompetency assessment requires evidence that the\ncandidate:\n1.1 Identified and interpreted related plans and details\n according to job requirements\n1.2 Selected, and prepared materials, power and hand tools\nand equipment and PPE are consistent with job\nrequirements.\n1.3 Fabricated/installed doors / window jambs and panels\nfollowing standard procedures and job requirements.\n1.4 Complied with safety regulations for worksite operations\n1.5 Used power and hand tools safely and effectively\n1.6 Communicated interactively with others to ensure safe\nand effective workplace operations\n1.7 Completed work without injury to personnel or damage\nto materials.\n\n2. Underpinning\nknowledge\n2.1 Types and uses of PPE\n2.2 Mensuration\n2.3 Interpretation of related plans and details\n2.4 Materials, power and hand tools, and equipment uses\nand specifications.\n2.5 5-S\n2.6 Knowledge of installing door / jambs / window panels\nprocesses\n2.7 Principles of squareness, eveness and smoothness for\nstock and panel preparation and plumbness and\nlevelness for installation of doors / jambs and window\npanels.\n2.8 Finished and installed doors / window / jambs packing\nprocedures\n2.9 Safe and effective use of hand and power tools\n2.10 Understand economic use of material\n2.11 Knowledge of mounting finishing hardwares\n2.12 Company rules and regulations\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 52\n3. Underpinning\nskills\n3.1 Using PPE\n3.2 Applying mensuration\n3.3 Interpreting related plans and details\n3.4 Selecting, preparing and using materials, power and\nhand tools and equipment\n3.5 Following fabricating and installing procedures for door /\njambs and panels\n3.6 Following packing procedures for jambs / windows and\ndoors\n3.7 Following safe and effective use of hand and power tools\n3.8 Performing procedures for mounting finishing hardwares\n3.9 Following company rules and regulations\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Well-ventilated and lighted work place location\n4.2 Power and hand tools and equipment appropriate to\nfabrication and installation processes\n4.3 Materials relevant to the proposed activity\n4.4 Plans and details relevant to the task\n4.5 Appropriate PPE\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Portfolio\n\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 53\n\nUNIT OF COMPETENCY:\nINSTALL STAIR COMPONENTS AND/OR PRE-\nFABRICATED STAIRS ASSEMBLY\nUNIT CODE\nCON712324\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin installing stair components and/or pre-fabricated\nstairs assembly.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare materials for\ninstalling stairs,\nbalusters and railings\n1.1 Appropriate PPE is selected and used according\nto job requirements and OSHA specifications.\n1.2 Related plans and details are correctly identified\nand interpreted according to job requirements.\n1.3 Materials, power and hand tools and\nequipment are selected and prepared consistent\nwith job requirements.\n1.4 Materials are re-checked based on\n specifications and defects and reported to\n immediate supervisor for appropriate action, if\n necessary.\n1.5 Unexpected situations are responded to in\naccordance with company rules and regulations.\n1.6 Housekeeping is performed according to\n safety regulations.\n2. Fabricate stair\ncomponents and/or\nstairs assembly\n2.1 Appropriate PPE is used according to job\nrequirements and safety regulations.\n2.2 Stair case requirements are identified from\nworking drawings and specifications.\n2.3 Height and number of risers and width of tread\nare determined according to working drawings\nand specifications.\n2.4 Stringer or stair horse is constructed in\naccordance with the height and number of risers\nand width of tread.\n2.5 Steps/baluster/railings are prepared and cut using\npattern with  1mm tolerance for squareness,\nevenness and smoothness and other\ndimensions.\n2.6 Unexpected situations are dealt with in\n accordance with company rules and\n regulations.\n2.7 Housekeeping is performed according to\n safety regulations.\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 54\n\n3. Install wooden stairs,\nbalusters and railings\nand/or pre-fabricated\nstairs assembly\n3.1 Appropriate PPE is used according to job\n requirements and safety regulations.\n3.2 Stair components are assembled and/or pre-\n fabricated stairs assembly are set out in\n accordance with working drawings and\n specifications.\n3.3 Stair components and/or pre-fabricated stairs\n assembly are installed in accordance with\n working drawings and specifications.\n3.4 Work area is cleaned and made safe\n according to OSHA regulations.\n3.5 Unexpected situations are dealt with in\n accordance with company rules and\n regulations.\n\n4. Complete work\n4.1 Final checks are made to ensure that work\n conforms with instructions and to requirements\n4.2 Completion report is prepared and submitted\n to appropriate officer.\n4.3 Power and hand tools, equipment and any\n surplus resources and materials are checked\n and monitored in accordance with established\n procedures\n4.4 Work area is monitored as to cleanliness and\n safety\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 55\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nMay include but not limited to:\n1.1 Safety shoes\n1.2 Working clothes\n1.3 Hard hat\n1.4 Gloves\n1.5 Safety belt/body harness\n\n2. Plans and details\n2.1 Exact location\n2.2 Dimensions\n2.3 Symbols and abbreviations\n2.4 Elevations\n2.5 Sections and details\n2.6 Quality and quantity of materials\n\n3. Materials\nMay include but not limited to:\n3.1 Surfaced and seasoned lumber\n3.2 Other than wood\n 3.2.1 Balusters\n 3.2.2 Nosing\n 3.2.3 Railings\n3.3 Finishing nails\n3.4 Screw bolts\n3.5 Angular plate or bracket\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 56\n4. Power and hand tools and\nequipment\nMay include but not limited to:\n4.1 Saw\n4.2 Hammer\n4.3 Try square\n4.4 Plane\n4.5 Steel square\n4.6 Portable planer\n4.7 Electric drill\n4.8 Table saw\n4.9 Surfacer\n4.10 Router\n4.11 Jointer planer\n4.12 Chisel\n4.13 Spirit level\n4.14 Leveling hose\n4.15 Pencil\n4.16 Plumb bob\n4.17 Push-pull / zigzag rule\n4.18 Ladder\n4.19 Scaffold\n4.20 Approved lifeline\n\n5. Defects\n5.1 Natural\n5.2 Manufacturer\n\n6. Stair components\n6.1 Balusters\n6.2 Railings\n6.3 Stringers\n6.4 Tread/unit run\n6.5 Nosing\n6.6 Riser cover\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 57\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nCompetency assessment requires evidence that the\ncandidate:\n1.1 Identified and interpreted related plans and details\naccording to job requirements.\n1.2 Selected and prepared materials, power and hand tools,\nequipment and PPE are consistent with job\nrequirements.\n1.3 Installed stair components and/or pre-fabricated\nassembled stair according to standard procedures, job\nrequirements and specifications.\n1.4 Complied with safety regulations for worksite operations\n1.5 Demonstrated safe and effective operational use of tools\nand equipment.\n1.6 Completed work operations without injury and damage to\nmaterials.\n1.7 Communicated interactively with others to ensure safe\nand effective workplace operations.\n\n2. Underpinning\nknowledge\n2.1 Types and uses of PPE\n2.2 Mensuration\n2.3 Shop/Trade Mathematics\n2.4 Interpretation of related plans and details\n2.5 Materials, power and hand tools uses and specifications\n2.6 5-S\n2.7 Principles for installing stairs and/or pre-fabricated stairs\nassembly.\n2.8 Procedures for installing stair components and/or pre-\nfabricated stairs assembly\n2.9 Safe and effective operational use of power and hand\ntools\n2.10 Understand economic use of material\n2.11 Company rules and regulations\n2.12 Safety rules and regulations\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 58\n3. Underpinning\nskills\n\n3.1 Using PPE\n3.2 Applying mensuration and shop/trade Mathematics\n3.3 Interpreting related plans and details\n3.4 Preparing and selecting materials, power and hand tools\nand equipment\n3.5 Following 5S\n3.6 Following procedures for installing stair components\nand/or pre-fabricated stairs assembly\n3.7 Following safe and effective operational use of power\nand hand tools\n3.8 Using materials economically\n3.9 Following company rules and regulations\n3.10 Applying safety rules and regulations\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Work place location\n4.2 Power and hand tools and equipment appropriate for\ninstalling stair components and/or pre-fabricated stairs\nassembly.\n4.3 Materials relevant to the proposed activity\n4.4 Working drawings and specifications relevant to the task\n4.5 Appropriate PPE\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks\n5.2 Questions related to underpinning knowledge\n\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 61 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 59\n\nUNIT OF COMPETENCY:\nINSTALL BUILT-IN AND/OR PRE-FABRICATED\nCABINETS\nUNIT CODE\nCON712325\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin installing built-in and/or pre-fabricated cabinets.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare materials for\ninstalling built-in and or\npre-fabricated cabinets\n\n1.1 Appropriate PPE is selected and used\n according to job requirements and OSHA\n specifications.\n1.2 Related plans and details are correctly\n identified and interpreted according to job\n requirements.\n1.3 Materials, power and hand tools and\n equipment are selected and prepared\n consistent with job requirements\n1.4 Materials are re-checked based on\n specifications and defects and reported to\nimmediate supervisor for appropriate action, if\nnecessary.\n1.5 Unexpected situations are responded to in\naccordance with company rules and\nregulations.\n1.6 Housekeeping is performed according to\n safety regulations.\n\n2. Fabricate built-in cabinet\ncomponents and/or pre-\nfabricated cabinet\n2.1 Appropriate PPE is used according to job\n requirements and safety regulations.\n2.2 Cabinet location is identified from working\n drawings and specifications.\n2.3 Cabinet components are fabricated and/or\n pre-fabricated cabinets are\n prepared/assembled according to working\n drawings and specifications.\n2.4 Unexpected situations are dealt with in\n accordance with company rules and\nregulations.\n2.5 Housekeeping is performed according to\n safety regulations.\n\n--- PDF PAGE 62 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 60\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n3. Install built-in cabinet\ncomponents and/or pre-\nfabricated cabinet\nassembly\n3.1 Appropriate PPE is used according to job\n requirements and safety regulations.\n3.2 Built-in cabinet components and/or pre-\n fabricated cabinet assembly are set-out in\naccordance with working drawings and\nspecifications.\n3.3 Built-in cabinet components and/or pre-\n fabricated cabinet assembly are installed in\naccordance with working drawings and\nspecifications.\n3.4 Finishing hardwares are installed as per\n working drawings.\n3.5 Work area is cleaned and made safe\n according to OSHA regulations.\n3.6 Unexpected situations are dealt with in\naccordance with company rules and\nregulations.\n\n4. Complete work\n4.1 Final checks are made to ensure that work\n conforms with instructions and to requirements\n4.2 Completion report is prepared and submitted\n to appropriate officer.\n4.3 Power and hand tools, equipment and any\n surplus resources and materials are checked\n and monitored in accordance with established\n procedures\n4.4 Work area is monitored as to cleanliness and\n safety\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 61\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nMay include but not limited to:\n1.1 Safety shoes\n1.2 Hard hat\n1.3 Gloves\n1.4 Working clothes\n1.5 Goggles\n1.6 Dust mask\n\n2. Plans and details\n2.1 Exact location\n2.2 Dimensions\n2.3 Elevations\n2.4 Sections and details\n2.5 Quality and quantity of materials\n\n3. Materials\nMay include but not limited to:\n3.1 Surfaced and seasoned lumber\n3.2 Finishing nails\n3.3 Cabinet accessories as specified\n3.4 Laminated veneer\n3.5 Adhesives\n3.6 Plywood\n3.7 Plyboard\n\n--- PDF PAGE 64 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 62\n4. Power and hand tools and\n equipment\nMay include but not limited to:\n4.1 Measuring tools\n4.2 Portable planer\n4.3 Circular saw\n4.4 Electric drill\n4.5 Planer\n4.6 Portable router\n4.7 Portable jigsaw\n4.8 Marking gauge\n4.9 Screw driver\n4.10 Hammer\n4.11 Philip screw\n4.12 Pencil\n4.13 Plumb bob\n4.14 Spirit level\n4.15 Wood chisel\n4.16 Try-square\n4.17 Scaffolding\n4.18 Levelling hose\n4.19 Steel square\n\n5. Defects\n5.1 Natural\n5.2 Manufacturer\n\n6. Unexpected situations\n6.1 Damage to material\n6.2 Injury to personnel\n\n7. Cabinet components\nMay include but not limited to:\n7.1 Door panel\n7.2 Shelves\n7.3 Drawers\n7.4 Roller\n7.5 Catches\n7.6 Drawer locks\n7.7 Hinges\n7.7.1 Piano hinge\n7.7.2 Butt\n7.7.3 Concealed hinge\n7.7.4 Double-action hinge\n7.8 Pullers and knobs\n\n8. Working drawings\nMay include but not limited to:\n8.1 Manufacturer's instructions manual\n8.2 Mounting details\n8.3 Cabinet detailed drawings\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 63\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nCompetency assessment requires evidence that the candidate:\n1.1 Identified and interpreted related plans and details according to\njob requirements.\n1.2 Selected and prepared materials, power and hand tools,\nequipment and PPE are consistent with job requirements.\n1.3 Installed built-in and/or pre-fabricated cabinets according to\nstandard procedures, job requirements and specifications.\n1.4 Complied with safety regulations for worksite operations\n1.5 Demonstrated safe and effective operational use of tools and\nequipment.\n1.6 Completed work operations without injury and damage to\nmaterials.\n1.7 Communicated interactively with others to ensure safe and\neffective workplace operations.\n\n2. Underpinning\nknowledge\n2.1 Types and uses of PPE\n2.2 Mensuration\n2.3 Shop/Trade Mathematics\n2.4 Interpretation of related plans and details\n2.5 Materials, power and hand tools uses and specifications\n2.6 5-S\n2.7 Principles for installing built-in and/or pre-fabricated cabinets.\n2.8 Procedures for installing built-in and/or pre-fabricated cabinets\n2.9 Safe and effective operational use of power and hand tools\n2.10 Understand economic use of material\n2.11 Company rules and regulations\n2.12 Safety rules and regulations\n\n3. Underpinning\nskills\n\n3.1 Using PPE\n3.2 Applying mensuration and shop/trade Mathematics\n3.3 Interpreting related plans and details\n3.4 Preparing and selecting materials, power and hand tools and\n equipment\n3.5 Following 5S\n3.6 Following procedures for installing built-in and/or pre-fabricated\n cabinets\n3.7 Following safe and effective operational use of power and hand\ntools\n3.8 Using materials economically\n3.9 Following company rules and regulations\n3.10 Applying safety rules and regulations\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 64\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Power and hand tools and equipment appropriate to installing\n built-in and/or pre-fabricated cabinet\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n4.5 Appropriate PPE\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks\n5.2 Questions related to underpinning knowledge\n\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 65"
