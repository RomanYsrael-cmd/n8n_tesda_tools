        "source_title": "INSTALL STAIR COMPONENTS AND/OR PRE- FABRICATED STAIRS ASSEMBLY",
        "source_text": "--- PDF PAGE 55 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              53\n \nUNIT OF COMPETENCY: \nINSTALL STAIR COMPONENTS AND/OR PRE-\nFABRICATED STAIRS ASSEMBLY  \nUNIT CODE \nCON712324 \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes \nin installing stair components and/or pre-fabricated \nstairs assembly. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare materials for \ninstalling stairs, \nbalusters and railings \n1.1 Appropriate PPE is selected and used according \nto job requirements and OSHA specifications.  \n1.2 Related plans and details are correctly identified \nand interpreted according to job requirements. \n1.3 Materials, power and hand tools and \nequipment are selected and prepared consistent \nwith job requirements. \n1.4  Materials are re-checked based on  \n       specifications and defects and reported to   \n       immediate supervisor for appropriate action, if  \n       necessary. \n1.5  Unexpected situations are responded to in \naccordance with company rules and regulations. \n1.6   Housekeeping is performed according to  \n        safety regulations. \n2.  Fabricate stair \ncomponents and/or \nstairs assembly \n2.1 Appropriate PPE is used according to job \nrequirements and safety regulations. \n2.2 Stair case requirements are identified from \nworking drawings and specifications. \n2.3  Height and number of risers and width of tread \nare determined according to working drawings \nand specifications.  \n2.4 Stringer or stair horse is constructed in \naccordance with the height and number of risers \nand width of tread.  \n2.5 Steps/baluster/railings are prepared and cut using \npattern with  1mm tolerance for squareness, \nevenness and smoothness and other \ndimensions. \n2.6  Unexpected situations are dealt with in  \n    accordance with company rules and    \n    regulations. \n2.7  Housekeeping is performed according to  \n       safety regulations.\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              54\n \n \n3.   Install wooden stairs, \nbalusters and railings \nand/or pre-fabricated \nstairs assembly \n3.1  Appropriate PPE is used according to job  \n       requirements and safety regulations. \n3.2  Stair components are assembled and/or pre- \n       fabricated stairs assembly are set out in  \n       accordance with working drawings and  \n       specifications. \n3.3  Stair components and/or pre-fabricated stairs  \n       assembly are installed in accordance with  \n       working drawings and specifications. \n3.4  Work area is cleaned and made safe  \n       according to OSHA regulations. \n3.5  Unexpected situations are dealt with in  \n       accordance with company rules and  \n       regulations. \n \n4.  Complete work \n4.1  Final checks are made to ensure that work       \n       conforms with instructions and to requirements \n4.2  Completion report is prepared and submitted  \n       to appropriate officer. \n4.3  Power and hand tools, equipment and any  \n       surplus resources and materials are checked  \n       and monitored in accordance with established  \n       procedures \n4.4  Work area is monitored as to cleanliness and    \n       safety\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              55\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. PPE \nMay include but not limited to: \n1.1 Safety shoes \n1.2 Working clothes \n1.3 Hard hat  \n1.4 Gloves  \n1.5 Safety belt/body harness \n \n2. Plans and details \n2.1 Exact location \n2.2 Dimensions \n2.3 Symbols and abbreviations \n2.4 Elevations \n2.5 Sections and details \n2.6 Quality and quantity of materials \n \n3. Materials \nMay include but not limited to: \n3.1 Surfaced and seasoned lumber  \n3.2 Other than wood \n     3.2.1 Balusters  \n     3.2.2 Nosing \n     3.2.3 Railings  \n3.3 Finishing nails  \n3.4 Screw bolts \n3.5 Angular plate or bracket\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              56\n4. Power and hand tools and \nequipment \nMay include but not limited to: \n4.1 Saw \n4.2 Hammer \n4.3 Try square \n4.4 Plane  \n4.5 Steel square \n4.6 Portable planer \n4.7 Electric drill \n4.8 Table saw \n4.9 Surfacer \n4.10  Router \n4.11  Jointer planer \n4.12  Chisel  \n4.13  Spirit level \n4.14  Leveling hose  \n4.15  Pencil \n4.16  Plumb bob \n4.17  Push-pull / zigzag rule \n4.18  Ladder \n4.19  Scaffold \n4.20  Approved lifeline \n \n5. Defects \n5.1 Natural  \n5.2 Manufacturer \n \n6. Stair components \n6.1 Balusters \n6.2 Railings  \n6.3 Stringers \n6.4 Tread/unit run \n6.5 Nosing  \n6.6 Riser cover\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              57\n \nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \nCompetency assessment requires evidence that the \ncandidate: \n1.1 Identified and interpreted related plans and details \naccording to job requirements. \n1.2 Selected and prepared materials, power and hand tools, \nequipment and PPE are consistent with job \nrequirements. \n1.3 Installed stair components and/or pre-fabricated \nassembled stair according to standard procedures, job \nrequirements and specifications.  \n1.4 Complied with safety regulations for worksite operations \n1.5 Demonstrated safe and effective operational use of tools \nand equipment. \n1.6 Completed work operations without injury and damage to \nmaterials. \n1.7 Communicated interactively with others to ensure safe \nand effective workplace operations. \n \n2.  Underpinning \nknowledge \n2.1 Types and uses of PPE \n2.2 Mensuration \n2.3 Shop/Trade Mathematics \n2.4 Interpretation of related plans and details  \n2.5 Materials, power and hand tools uses and specifications \n2.6 5-S  \n2.7 Principles for installing stairs and/or pre-fabricated stairs  \nassembly. \n2.8  Procedures for installing stair components and/or pre- \nfabricated stairs assembly  \n2.9 Safe and effective operational use of power and hand \ntools  \n2.10  Understand economic use of material \n2.11  Company rules and regulations \n2.12  Safety rules and regulations\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              58\n3.  Underpinning \nskills \n \n3.1 Using PPE \n3.2 Applying mensuration and shop/trade Mathematics  \n3.3 Interpreting related plans and details \n3.4 Preparing and selecting materials, power and hand tools \nand equipment \n3.5 Following 5S \n3.6 Following procedures for installing stair components \nand/or pre-fabricated stairs assembly \n3.7 Following safe and effective operational use of power \nand hand tools \n3.8 Using materials economically \n3.9 Following company rules and regulations \n3.10  Applying safety rules and regulations \n \n4.   Resource \nimplications \nThe following resources should be provided: \n4.1 Work place location \n4.2 Power and hand tools and equipment appropriate for \ninstalling stair components and/or pre-fabricated stairs \nassembly. \n4.3 Materials relevant to the proposed activity \n4.4 Working drawings and specifications relevant to the task \n4.5 Appropriate PPE \n \n5.   Methods of \nassessment \nCompetency should be assessed through: \n5.1 Direct observation of application to tasks \n5.2 Questions related to underpinning knowledge \n \n6.   Context for \nassessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting.\n",
