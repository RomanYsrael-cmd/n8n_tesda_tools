        "evidence_guide": {
          "source_text": "1.  Critical aspects \nof competency \nCompetency assessment requires evidence that the \ncandidate: \n1.1 Identified and interpreted related plans and details \naccording to job requirements. \n1.2 Selected and prepared materials, power and hand tools, \nequipment and PPE are consistent with job \nrequirements. \n1.3 Installed stair components and/or pre-fabricated \nassembled stair according to standard procedures, job \nrequirements and specifications.  \n1.4 Complied with safety regulations for worksite operations \n1.5 Demonstrated safe and effective operational use of tools \nand equipment. \n1.6 Completed work operations without injury and damage to \nmaterials. \n1.7 Communicated interactively with others to ensure safe \nand effective workplace operations. \n \n2.  Underpinning \nknowledge \n2.1 Types and uses of PPE \n2.2 Mensuration \n2.3 Shop/Trade Mathematics \n2.4 Interpretation of related plans and details  \n2.5 Materials, power and hand tools uses and specifications \n2.6 5-S  \n2.7 Principles for installing stairs and/or pre-fabricated stairs  \nassembly. \n2.8  Procedures for installing stair components and/or pre- \nfabricated stairs assembly  \n2.9 Safe and effective operational use of power and hand \ntools  \n2.10  Understand economic use of material \n2.11  Company rules and regulations \n2.12  Safety rules and regulations\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              58\n3.  Underpinning \nskills \n \n3.1 Using PPE \n3.2 Applying mensuration and shop/trade Mathematics  \n3.3 Interpreting related plans and details \n3.4 Preparing and selecting materials, power and hand tools \nand equipment \n3.5 Following 5S \n3.6 Following procedures for installing stair components \nand/or pre-fabricated stairs assembly \n3.7 Following safe and effective operational use of power \nand hand tools \n3.8 Using materials economically \n3.9 Following company rules and regulations \n3.10  Applying safety rules and regulations \n \n4.   Resource \nimplications \nThe following resources should be provided: \n4.1 Work place location \n4.2 Power and hand tools and equipment appropriate for \ninstalling stair components and/or pre-fabricated stairs \nassembly. \n4.3 Materials relevant to the proposed activity \n4.4 Working drawings and specifications relevant to the task \n4.5 Appropriate PPE \n \n5.   Methods of \nassessment \nCompetency should be assessed through: \n5.1 Direct observation of application to tasks \n5.2 Questions related to underpinning knowledge \n \n6.   Context for \nassessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting.",
