        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nCompetency assessment requires evidence that the\ncandidate:\n1.1 Interpreted related plans and details according to job\nrequirements.\n1.2 Selected, and prepared materials, hand tools and\n power tools, equipment and PPE are consistent with\n job requirements.\n1.3 Installed ceilings, wall sheats/ panels/boards and floor\nfinishes in accordance with established procedures, job\nrequirements and specifications.\n1.4 Complied with safety regulations for worksite\n operations.\n1.5 Followed safe and effective operational use of tools\n and equipment.\n1.6 Completed work operations without injury to personnel\nand damage to materials.\n1.7 Communicated interactively with others to ensure safe\nand effective workplace operations.\n\n2. Underpinning\nknowledge\n2.1 Types and uses of PPE\n2.2 Mensuration\n2.3 Interpretation of plans and details\n2.4 Materials, hand tools, power tools and equipment use\nand specification\n2.5 5-S\n2.6 Procedures for installing architectural / ceilings / walls /\npanels and floor finishes\n2.7 Safe and effective use of power and hand tools, and\nequipment\n2.8 Economic use of material\n2.9 Material handling and storing\n2.10 Company rules and regulations\n\n3. Underpinning\nskills\n3.1 Using PPE\n3.2 Applying mensuration\n3.3 Interpreting plans and details\n3.4 Following safe and effective operational use of power\nand hand tools and equipment\n3.5 Selecting, preparing and using materials economically\n3.6 Following procedures for installing architectural /\nceilings / walls / panels and floor finishes\n3.7 Applying 5S\n3.8 Following company rules and regulations\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 46\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Well ventilated and lighted work place location\n4.2 Power and hand tools and equipment appropriate to\ninstalling architectural ceiling / walls\nsheats/panels/boards and floor finishes\n4.3 Materials relevant to the proposed activity\n4.4 Plans and details relevant to the task\n4.5 Appropriate PPE\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Portfolio\n\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n6.2 Assessment shall be done while tasks are undertaken\nindividually under limited supervision.\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 47\n\nUNIT OF COMPETENCY:\nFABRICATE / INSTALL DOOR / WINDOW\nJAMBS AND PANELS\nUNIT CODE"
        },
        "source_text": "CON712322\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin installing architectural ceiling, wall sheats/\npanels/boards and floor finishes.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare materials for\ninstalling architectural\nceilings, wall\nsheats/panels/boards and\nfloor finishes\n1.1 Appropriate PPE is selected and used\naccording to job requirements and OSHA\nspecifications.\n1.2 Related plans and details are and interpreted\naccording to job requirements.\n1.3 Materials, power and hand tools and\nequipment are selected and prepared\nconsistent with job requirements\n1.4 Materials are re-checked according to\n specifications.\n1.5 Unexpected situations are dealt with\n according to company rules and regulations.\n1.6 Housekeeping is performed according to\n safety regulations.\n\n2. Establish lay-out of\nwall/floor and ceiling\npattern\n2.1 Appropriate PPE is used according to job\nrequirements and safety regulations\n2.2 Lay-out is located according to job\n specifications.\n2.3 Materials are cut and fitted according to\nrequired size with 3 mm for squareness,\nplumbness, levelness and dimension.\n2.4 Finished materials are in correct lay-out\nposition.\n2.5 Unexpected situations are dealt with according\nto company rules and regulations.\n2.6 Housekeeping is performed according to\n safety regulations.\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 42\n\n3. Install architectural\nceiling, wall\nsheats/panels/boards and\nfloor finishes\n3.1 Finished materials are aligned, tacked and\nnailed according to lay-out.\n3.2 Installed finished materials’ connections,\n levelness, smoothness are checked according\nto job requirements.\n3.3 Work area is cleaned and made safe\n according to OSHA regulation.\n3.4 Unexpected situations are dealt with according\n to company rules and regulations.\n\n4. Complete work\n4.1 Final checks are made to ensure that work\n conforms with instructions and to requirements\n4.2 Completion report is prepared and submitted\n to appropriate officer.\n4.3 Power and hand tools, equipment and any\n surplus resources and materials are checked\n and monitored in accordance with established\n procedures\n4.4 Work area is monitored as to cleanliness and\n safety\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 43\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nMay include but not limited to:\n1.1 Safety Shoes\n1.2 Hard Hat\n1.3 Goggles\n1.4 Dust mask\n1.5 Safety belts\n1.6 Working clothes\n1.7 Rope (lifeline)\n1.8 Gloves\n\n2. Plans and details\n2.1 Reflected ceiling plan\n2.2 Exact location\n2.3 Dimensions\n2.4 Symbols and abbreviations\n2.5 Sections and details\n2.6 Quality and quantity of materials\n\n3. Materials\nMay include but not limited to:\n3.1 Shop lumber\n3.2 Finish sheathings, panels and boards\n3.3 Finish and common wire nails\n3.4 Metal screw\n3.5 Adhesives\n3.6 Decorative mouldings\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 44\n\n4. Power, hand tools and\nequipment\nMay include but not limited to:\n4.1 Saw\n4.2 Hammer\n4.3 Chalk lines\n4.4 Pencil\n4.5 Push-pull/zigzag rule\n4.6 Chisel\n4.7 Try square\n4.8 Plane\n4.9 Electric drill\n4.10 Screw gun\n4.11 Drill bits\n4.12 Screw driver (Philips and standard)\n4.13 Riveter\n4.14 Ramset\n4.15 Staple gun\n\n5. Unexpected situations\n5.1 Damage to materials, power or hand tools,\nequipment\n5.2 Injury to personnel\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 45\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nCompetency assessment requires evidence that the\ncandidate:\n1.1 Interpreted related plans and details according to job\nrequirements.\n1.2 Selected, and prepared materials, hand tools and\n power tools, equipment and PPE are consistent with\n job requirements.\n1.3 Installed ceilings, wall sheats/ panels/boards and floor\nfinishes in accordance with established procedures, job\nrequirements and specifications.\n1.4 Complied with safety regulations for worksite\n operations.\n1.5 Followed safe and effective operational use of tools\n and equipment.\n1.6 Completed work operations without injury to personnel\nand damage to materials.\n1.7 Communicated interactively with others to ensure safe\nand effective workplace operations.\n\n2. Underpinning\nknowledge\n2.1 Types and uses of PPE\n2.2 Mensuration\n2.3 Interpretation of plans and details\n2.4 Materials, hand tools, power tools and equipment use\nand specification\n2.5 5-S\n2.6 Procedures for installing architectural / ceilings / walls /\npanels and floor finishes\n2.7 Safe and effective use of power and hand tools, and\nequipment\n2.8 Economic use of material\n2.9 Material handling and storing\n2.10 Company rules and regulations\n\n3. Underpinning\nskills\n3.1 Using PPE\n3.2 Applying mensuration\n3.3 Interpreting plans and details\n3.4 Following safe and effective operational use of power\nand hand tools and equipment\n3.5 Selecting, preparing and using materials economically\n3.6 Following procedures for installing architectural /\nceilings / walls / panels and floor finishes\n3.7 Applying 5S\n3.8 Following company rules and regulations\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 46\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Well ventilated and lighted work place location\n4.2 Power and hand tools and equipment appropriate to\ninstalling architectural ceiling / walls\nsheats/panels/boards and floor finishes\n4.3 Materials relevant to the proposed activity\n4.4 Plans and details relevant to the task\n4.5 Appropriate PPE\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Portfolio\n\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n6.2 Assessment shall be done while tasks are undertaken\nindividually under limited supervision.\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 47\n\nUNIT OF COMPETENCY:\nFABRICATE / INSTALL DOOR / WINDOW\nJAMBS AND PANELS\nUNIT CODE"
