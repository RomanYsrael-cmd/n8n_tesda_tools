        "source_text": "CON712325\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin installing built-in and/or pre-fabricated cabinets.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare materials for\ninstalling built-in and or\npre-fabricated cabinets\n\n1.1 Appropriate PPE is selected and used\n according to job requirements and OSHA\n specifications.\n1.2 Related plans and details are correctly\n identified and interpreted according to job\n requirements.\n1.3 Materials, power and hand tools and\n equipment are selected and prepared\n consistent with job requirements\n1.4 Materials are re-checked based on\n specifications and defects and reported to\nimmediate supervisor for appropriate action, if\nnecessary.\n1.5 Unexpected situations are responded to in\naccordance with company rules and\nregulations.\n1.6 Housekeeping is performed according to\n safety regulations.\n\n2. Fabricate built-in cabinet\ncomponents and/or pre-\nfabricated cabinet\n2.1 Appropriate PPE is used according to job\n requirements and safety regulations.\n2.2 Cabinet location is identified from working\n drawings and specifications.\n2.3 Cabinet components are fabricated and/or\n pre-fabricated cabinets are\n prepared/assembled according to working\n drawings and specifications.\n2.4 Unexpected situations are dealt with in\n accordance with company rules and\nregulations.\n2.5 Housekeeping is performed according to\n safety regulations.\n\n--- PDF PAGE 62 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 60\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n3. Install built-in cabinet\ncomponents and/or pre-\nfabricated cabinet\nassembly\n3.1 Appropriate PPE is used according to job\n requirements and safety regulations.\n3.2 Built-in cabinet components and/or pre-\n fabricated cabinet assembly are set-out in\naccordance with working drawings and\nspecifications.\n3.3 Built-in cabinet components and/or pre-\n fabricated cabinet assembly are installed in\naccordance with working drawings and\nspecifications.\n3.4 Finishing hardwares are installed as per\n working drawings.\n3.5 Work area is cleaned and made safe\n according to OSHA regulations.\n3.6 Unexpected situations are dealt with in\naccordance with company rules and\nregulations.\n\n4. Complete work\n4.1 Final checks are made to ensure that work\n conforms with instructions and to requirements\n4.2 Completion report is prepared and submitted\n to appropriate officer.\n4.3 Power and hand tools, equipment and any\n surplus resources and materials are checked\n and monitored in accordance with established\n procedures\n4.4 Work area is monitored as to cleanliness and\n safety\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 61\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nMay include but not limited to:\n1.1 Safety shoes\n1.2 Hard hat\n1.3 Gloves\n1.4 Working clothes\n1.5 Goggles\n1.6 Dust mask\n\n2. Plans and details\n2.1 Exact location\n2.2 Dimensions\n2.3 Elevations\n2.4 Sections and details\n2.5 Quality and quantity of materials\n\n3. Materials\nMay include but not limited to:\n3.1 Surfaced and seasoned lumber\n3.2 Finishing nails\n3.3 Cabinet accessories as specified\n3.4 Laminated veneer\n3.5 Adhesives\n3.6 Plywood\n3.7 Plyboard\n\n--- PDF PAGE 64 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 62\n4. Power and hand tools and\n equipment\nMay include but not limited to:\n4.1 Measuring tools\n4.2 Portable planer\n4.3 Circular saw\n4.4 Electric drill\n4.5 Planer\n4.6 Portable router\n4.7 Portable jigsaw\n4.8 Marking gauge\n4.9 Screw driver\n4.10 Hammer\n4.11 Philip screw\n4.12 Pencil\n4.13 Plumb bob\n4.14 Spirit level\n4.15 Wood chisel\n4.16 Try-square\n4.17 Scaffolding\n4.18 Levelling hose\n4.19 Steel square\n\n5. Defects\n5.1 Natural\n5.2 Manufacturer\n\n6. Unexpected situations\n6.1 Damage to material\n6.2 Injury to personnel\n\n7. Cabinet components\nMay include but not limited to:\n7.1 Door panel\n7.2 Shelves\n7.3 Drawers\n7.4 Roller\n7.5 Catches\n7.6 Drawer locks\n7.7 Hinges\n7.7.1 Piano hinge\n7.7.2 Butt\n7.7.3 Concealed hinge\n7.7.4 Double-action hinge\n7.8 Pullers and knobs\n\n8. Working drawings\nMay include but not limited to:\n8.1 Manufacturer's instructions manual\n8.2 Mounting details\n8.3 Cabinet detailed drawings\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 63\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nCompetency assessment requires evidence that the candidate:\n1.1 Identified and interpreted related plans and details according to\njob requirements.\n1.2 Selected and prepared materials, power and hand tools,\nequipment and PPE are consistent with job requirements.\n1.3 Installed built-in and/or pre-fabricated cabinets according to\nstandard procedures, job requirements and specifications.\n1.4 Complied with safety regulations for worksite operations\n1.5 Demonstrated safe and effective operational use of tools and\nequipment.\n1.6 Completed work operations without injury and damage to\nmaterials.\n1.7 Communicated interactively with others to ensure safe and\neffective workplace operations.\n\n2. Underpinning\nknowledge\n2.1 Types and uses of PPE\n2.2 Mensuration\n2.3 Shop/Trade Mathematics\n2.4 Interpretation of related plans and details\n2.5 Materials, power and hand tools uses and specifications\n2.6 5-S\n2.7 Principles for installing built-in and/or pre-fabricated cabinets.\n2.8 Procedures for installing built-in and/or pre-fabricated cabinets\n2.9 Safe and effective operational use of power and hand tools\n2.10 Understand economic use of material\n2.11 Company rules and regulations\n2.12 Safety rules and regulations\n\n3. Underpinning\nskills\n\n3.1 Using PPE\n3.2 Applying mensuration and shop/trade Mathematics\n3.3 Interpreting related plans and details\n3.4 Preparing and selecting materials, power and hand tools and\n equipment\n3.5 Following 5S\n3.6 Following procedures for installing built-in and/or pre-fabricated\n cabinets\n3.7 Following safe and effective operational use of power and hand\ntools\n3.8 Using materials economically\n3.9 Following company rules and regulations\n3.10 Applying safety rules and regulations\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 64\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Power and hand tools and equipment appropriate to installing\n built-in and/or pre-fabricated cabinet\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n4.5 Appropriate PPE\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation of application to tasks\n5.2 Questions related to underpinning knowledge\n\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 65"
