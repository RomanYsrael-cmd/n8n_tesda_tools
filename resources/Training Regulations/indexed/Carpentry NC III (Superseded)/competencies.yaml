          "source_text": "1.  Prepare materials for \ninstalling architectural \nceilings, wall \nsheats/panels/boards and \nfloor finishes \n1.1 Appropriate PPE is selected and used \naccording to job requirements and OSHA \nspecifications. \n1.2   Related plans and details are and interpreted \naccording to job requirements. \n1.3 Materials, power and hand tools and \nequipment are selected and prepared \nconsistent with job requirements \n1.4   Materials are re-checked according to  \n        specifications. \n1.5   Unexpected situations are dealt with  \n        according to company rules and regulations. \n1.6   Housekeeping is performed according to  \n        safety regulations. \n \n2.  Establish lay-out of \nwall/floor and ceiling \npattern \n2.1 Appropriate PPE is used according to job \nrequirements and safety regulations \n2.2   Lay-out is located according to job  \n        specifications. \n2.3 Materials are cut and fitted according to \nrequired size with 3 mm for squareness, \nplumbness, levelness and dimension. \n2.4 Finished materials are in correct lay-out \nposition. \n2.5   Unexpected situations are dealt with according \nto company rules and regulations. \n2.6   Housekeeping is performed according to  \n        safety regulations.\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              42\n \n3.  Install architectural \nceiling, wall \nsheats/panels/boards and \nfloor finishes \n3.1 Finished materials are aligned, tacked and \nnailed according to lay-out. \n3.2   Installed finished materials’ connections,  \n        levelness, smoothness are checked according \nto job requirements. \n3.3   Work area is cleaned and made safe  \n        according to OSHA regulation. \n3.4   Unexpected situations are dealt with according  \n        to company rules and regulations. \n \n4.  Complete work \n4.1  Final checks are made to ensure that work       \n       conforms with instructions and to requirements \n4.2  Completion report is prepared and submitted  \n       to appropriate officer. \n4.3  Power and hand tools, equipment and any  \n       surplus resources and materials are checked  \n       and monitored in accordance with established  \n       procedures \n4.4  Work area is monitored as to cleanliness and    \n       safety\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              43\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. PPE \nMay include but not limited to: \n1.1 Safety Shoes \n1.2 Hard Hat \n1.3 Goggles \n1.4 Dust mask \n1.5 Safety belts \n1.6 Working clothes \n1.7 Rope (lifeline) \n1.8 Gloves \n \n2. Plans and details \n2.1 Reflected ceiling plan \n2.2 Exact location \n2.3 Dimensions \n2.4 Symbols and abbreviations \n2.5 Sections and details \n2.6 Quality and quantity of materials \n \n3. Materials \nMay include but not limited to: \n3.1 Shop lumber  \n3.2 Finish sheathings, panels and boards \n3.3 Finish and common wire nails \n3.4 Metal screw \n3.5 Adhesives \n3.6 Decorative mouldings\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              44\n \n4. Power, hand tools and \nequipment \nMay include but not limited to: \n4.1 Saw \n4.2 Hammer \n4.3 Chalk lines \n4.4 Pencil  \n4.5 Push-pull/zigzag rule \n4.6 Chisel  \n4.7 Try square \n4.8 Plane  \n4.9 Electric drill \n4.10 Screw gun \n4.11 Drill bits \n4.12 Screw driver (Philips and standard) \n4.13 Riveter \n4.14 Ramset  \n4.15 Staple gun \n \n5. Unexpected situations \n5.1 Damage to materials, power or hand tools, \nequipment \n5.2 Injury to personnel\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________________ \nTR CARPENTRY NC III                                                                                                                                                              45"
