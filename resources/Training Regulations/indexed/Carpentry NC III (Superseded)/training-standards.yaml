    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for certain occupations.\n\nThey include information on curriculum design, training delivery, trainee\nentry requirements, tools and equipment, training facilities and trainer’s\nqualification among others.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: CARPENTRY\n\n NC Level: III\n\nSuggested Nominal Training Duration: 20 hours (Basic)\n 24 hours (Common)\n 320 hours (Core)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable work\nattitude in Carpentry NC III. It covers core competencies to install architectural\nceiling/wall sheats / panels and floor finishes; fabricate / install door / window jambs\nand panels; install stair components and / or pre-fabricated; and stairs assembly.\nInstall built-in / pre-fabricated cabinet.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\n communication\n1.1 Communicate information\n about workplace\n processes\n1.2 Lead workplace\n discussions\n1.3 Identify and communicate\n issues arising in the\n workplace\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n2. Lead small team\n2.1 Provide team leadership\n2.2 Assign responsibilities\n2.3 Set performance\n expectations for team\n members\n2.4 Supervised team\nperformance\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n\n--- PDF PAGE 68 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 66\n\n3. Solve\n workplace\n problems\n related to work\n activities\n3.1 Identify the problem\n3.2 Determine fundamental\n cause problem\n3.3 Determine correct /\n preventive action\n3.4 Provide recommendation\n to manager\n\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n4. Develop and\npractice\nnegotiation skills\n4.1 Identify relevant\n information in planning\n negotiations\n4.2 Participate in\nnegotiations\n4.2 Document areas for\nagreement\n\nDirect\nobservation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\n tools and techniques to\n solve problem\n5.2 Apply mathematical\n procedures / solution\n5.3 Analyze results\n\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\n technology\n6.2 Apply relevant\ntechnology\n6.3 Maintenance / enhance\n relevant technology\n\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical\nperformance test\n\n--- PDF PAGE 69 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 67\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n\n1.2 Requisition Materials\n\n1.3 Receive and inspect\nmaterials\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical\nExercise\n\nDemonstration\nDirect\nobservation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten / Oral\nTest\n\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/ manuals\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 70 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 68\n\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring\ninstruments\n\n3.2 Carry out measurements\nand calculations\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\nand equipment\n\n4.2 Perform basic preventive\nmaintenance\n\n4.3 Sharpen edge and tooth\ncutting tools\n\n4.4 Store tools and\nequipment\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation of\napplication of\ntasks\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Read / Interpret blueprints\n and plans\n\n5.2 Perform freehand\n sketching\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration\nand oral\nquestioning\n\nWritten test\n\n--- PDF PAGE 71 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 69\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Install architectural\nceiling, wall sheats\n/ panels and floor\nfinishes\n1.1 Select, check and\n prepare materials and\n tools in installing\n architectural ceiling, wall\n frames ,panels and floor\n finishes\n\n1.2 Established lay-out of\n wall / floor and ceiling\n pattern\n\n1.3 Install architectural\n ceiling wall/sheet /\n panels and floor\n finishes according to job\n requirements\n\nAudio Visual\n\nSimulation\n\nDiscussion\npractical lab\n\nDemonstration\nDirect observation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten Test\n(about symbols)\n\nDemonstration\n\n2. Fabricate / install\ndoor\n/\nwindow\njambs and panels\n2.1 Select and prepare\n power/hand tools and\n materials required in\n fabricating door/widow\n jambs/panels\n\n2.2 Fabricate jambs/ panels\n of doors/windows\n according to plans\n\n2.3 Install fabricated\n door / window jambs /\n panels and pre-\n fabricated moldings\n\nAudio Visual\n\nSimulation\n\nDiscussion\npractical lab\n\nDemonstration\nDirect observation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten Test\n(about symbols)\n\nDemonstration\n\n--- PDF PAGE 72 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 70\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n 3. Install stair\n components and /\n or pre-fabricated\n stairs assembly\n3.1 Interpret plans, working\n drawings, specifications\n and identify construction\n materials according to\n job requirements\n\n3.2 Prepare materials for\n installing of stair\n components , stair\n balusters and railings\n\n3.3 Fabricate stair\n component and /or stair\n assembly\n\n3.4 Install wooden stairs,\n balusters and railings\nand / or pre-fabricated\nstairs assembly\n\nAudio Visual\n\nSimulation\n\nDiscussion\npractical lab\n\nDemonstration\nAudio Visual\n\nSimulation\n\nDiscussion\npractical lab\n\nDemonstration\n4. Install built-in /\n pre-fabricated\ncabinet\n4.1 Prepare materials, tools\n and equipment for\n installing built-in and /or\n pre-fabricated cabinets\n\n4.2 Fabricate/assemble\n built-in cabinet\n components and/or pre-\n fabricated cabinet\n\n4.3 Assemble and install\n built-in and pre-\n fabricated cabinet\n components\n\nAudio Visual\n\nSimulation\n\nDiscussion\npractical lab\n\nDemonstration\nDirect observation\n\nWritten test or\nexamination\n\nQuestioning\n\nThird party report\n(to include report\non work attitude)\n\nDemonstration /\nSimulation\n\n--- PDF PAGE 73 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 71\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n--- PDF PAGE 74 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 72\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees. Other requirements like\nhealth and physical are also stated. Passing entry written examinations may also\nbe indicated if necessary.\n\n•\ncan communicate both oral and written\n•\nphysically and mentally fit\n•\nWith good moral character\n•\ncan perform basic mathematical computation and mensuration\n•\nAbility to communicate ideas\n\n--- PDF PAGE 75 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 73\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR CARPENTRY NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Carpentry – NC III\n\n TOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n25 pcs\nCross cut saw\n5 sets H-frame\nscaffolds,\n25 pcs Lumber, 2”x6”x8’, kiln\ndried, tangile\n25 pcs\nClaw hammer 8 oz\n2 unit\nPortable electric\ndrill\n25 pcs Lumber, 2”x6”x12’, kiln\ndried, tangile\n25 pcs\nClaw hammer 16 oz\n2 unit\nPortable planer\n50 pcs Lumber, 2”x2”x12’, kiln\ndried, tangile\n25 pcs\nChalk line reel\n2 unit\nPortable cirular\nsaw\n25 pcs Wood moulding, 1”x4”x8’,\nogee\n25 pcs\nPencil\n\n25 pcs Wood moulding, 1”x1”x8’,\nquarter round\n25 sets\nNylon string\n\n25 pcs Wood moulding, 1”x1”x8’,\ncove\n25 pcs\nPull-push rule, 15\nmeters\n\n50 pcs rough lumber 2”x2”x12’\n5 pcs\nCrow bar\n\n50 pcs Loose pin hinges, 4”\n25 pcs\nFraming square\n\n2 kg\nFinishing wire nail, 1”\n25 pcs\nTry square\n\n2 kg\nFinishing wire nail, 1½\ninches\n5 pcs\nSpirit level, 36 in.\n\n2 kg\nFinishing wire nail, 2\ninches\n1 pcs\nAutomatic level\n\n2 kg\nFinishing wire nail, 3\ninches\n25 pcs\nNail pouch\n\n2 kg\nCommon wire nail, 1”\n25 set\nNail set\n\n2 kg\nCommon wire nail, 1½\ninches\n12 pcs\nChisel, ¼”\n\n4 kg\nCommon wire nail, 2\ninches\n12 pcs\nChisel, ½ ”\n\n4 kg\nCommon wire nail, 3\ninches\n12 pcs\nChisel, ¾ ”\n\n25 pcs Plywood,1/4”x4’x8’\n12 pcs\nChisel, 2”\n\n5 liters White glue\n6 pcs\nAdjustable wrench, 8\ninches\n\nLEARNING MATERIALS\n6 pcs\nAdjustable wrench,\n12 inches\n\nInteractive instructional\nmodules\n\n--- PDF PAGE 76 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 74\n\n TOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set\nCombination\nspanner, 8mm to\n24mm\n\nBooks in carpentry\n12 m\nTransparent hose,\nwhite, 3/8 in diameter\n\n12 m\nTransparent hose,\nwhite, ¼ in.\n\n1 pcs\nHard hat, white, (for\ntrainer)\n\n25 pcs\nHard hat, yellow (for\ntrainees)\n\n25 pairs Gloves, knitted\n\n25 pairs Safety shoes\n\n25 pcs\nGoggle\n\n--- PDF PAGE 77 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 75\n3.5 TRAINING FACILITIES\n\nBased on a class size of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nStudent/Trainee Working\nSpace\n\n6\n150\nContextual Learning\nLaboratory / Lecture Room\n\n20\n20\nLearning Resource\nCenter\n\n20\n20\nTool Room/Storage\n\n10\n10\nWash room\n\n10\n10\nCirculation area\n\n60\n60\nTOTAL AREA\n\n270\n\n3.6 TRAINER’S QUALIFICATION CONSTRUCTION SECTOR\n\nCARPENTRY – NC III\n\nMust have undergone training on Training Methodology II (TM II)\nHe must be a holder of at least National Certificate Level III\nGood moral character\nMust be physically and mentally fit\n*Must have 1 year industry experience and/or teaching experience\n\n*Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 78 ---\n_____________________________________________________________________________________________\nTR CARPENTRY NC III 76"
