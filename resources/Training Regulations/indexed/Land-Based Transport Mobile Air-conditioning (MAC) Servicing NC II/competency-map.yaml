  "source_text": "COMPETENCY MAP - HVAC/R Sector\nLand-based Transport Mobile Air-Conditioning (MAC) Servicing NC II\n\nCORE COMPETENCIES\n\nInstall window- type AC/\ndomestic refrigeration units\nService & maintain window-type\nAC/ domestic refrigeration units\nTroubleshoot window-type\nAC/domestic refrigeration\nsystems\nRecover & recycle refrigerant\nin window-type AC/domestic\nrefrigeration systems\nRepair & retrofit window-type\nAC/ domestic refrigeration\nsystems\nPerform Testing and\ncommissioning for window-\ntype AC/domestic refrigeration\nInstall package-type air-conditioning\nunit (PACU) / commercial\nrefrigeration equipment (CRE)\nInstall PACU/CRE electrical\nsystems\nInstall PACU/CRE piping\nsystems\nService & maintain PACU/CRE\nunits\nSurvey site for installation\nTroubleshoot PACU/CRE n systems\nRecover / recycle refrigerant\nin PACU/ CRE systems\nRepair & retrofit PACU/CRE\nsystems & its accessories\nPerform start-up, testing and\ncommissioning for PACU/CRE\nInstall transport air-\nconditioning\n& refrigeration units\nService & maintain transport AC\n& refrigeration units\nRecover & recycle\nrefrigerant in transport AC &\nrefrigeration systems\nTroubleshoot transport air-\nconditioning & refrigeration\nsystems\nPerform testing &\ncommissioning for transport AC\n& refrigeration\nInstall package-type air-\nconditioning unit (PACU)\nService & maintain PACU\nTroubleshoot and repair\nPACU\nPerform start-up, test and\ncommissioning for PACU\nService & maintain mobile\nair-conditioning (MAC) units\nInstall commercial refrigeration\nequipment (CRE)\nService & maintain CRE\nTroubleshoot and repair\nCRE\nPerform start-up, test and\ncommissioning for CRE\nTroubleshoot & repair mobile\nair-conditioning systems\nInstall commercial air-\nconditioning unit (CACU)\nService & maintain CACU\nTroubleshoot and repair\nCACU\nPerform start-up, testing and\ncommissioning for CACU\nPerform start-up, test and\ncommissioning for mobile\nair-conditioning systems\nRepair & retrofit transport ac &\nrefrigeration systems & its\naccessories\nInstall domestic refrigeration and\nair-conditioning units\nService & maintain domestic\nrefrigeration and air-\nconditioning units\nTroubleshoot & repair\ndomestic refrigeration and\nair-conditioning units\n\nCOMMON COMPETENCIES\n\nPrepare materials and\ntools\nObserve procedures,\nspecifications & manuals of instructions\nPerform mensurations &\ncalculations\nPerform basic benchwork\nPerform basic electrical\nworks\nMaintain tools and\nequipment\nPerform housekeeping and safety\npractices\nDocument work\naccomplished\nInterpret technical\ndrawings and plans\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace communication\nUtilize specialized communication\nskill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher order thinking\nprocesses and apply techniques\nin the workplace\nEvaluate higher order thinking\nskills and adjust problem solving\ntechniques\nEnhance self-management\nskills\nDevelop career and life\ndecisions\nWork in a diverse environment\nContribute to the practice of social\njustice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport Innovation\nContribute to workplace\ninnovation\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into work\nprocedures\nAccess and maintain\ninformation\nPresent relevant\ninformation\nUse information systematically\nManage and evaluate usage of\ninformation\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety\nand health policies and\nprocedures\nPractice occupational safety\nand health policies and\nprocedures\nEvaluate occupational safety and\nhealth work practices\nLead in improvement of\nOccupational Safety and Health\nProgram, Policies and Procedures\nManage implementation of\noccupational safety and health\nprograms in the workplace\nApply environmental work\nstandards\nExercise efficient and\neffective sustainable\npractices in the workplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial\nmindset in the workplace\nPractice entrepreneurial\nskills in the workplace\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\nDevelop and sustain a high-\nperforming enterprise\n\nANNEX A\n\n--- PDF PAGE 109 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n105\nGLOSSARY OF TERMS\n\n1) Accumulator – is used on systems that accommodate an orifice tube to meter\nrefrigerants into the evaporator. It is connected directly to the evaporator outlet and\nstores excess liquid refrigerant. The chief role of the accumulator is to isolate the\ncompressor from any damaging liquid refrigerant. Accumulators, like receiver-\ndriers, also remove debris and moisture from a system.\n\n2) Air-conditioning - is the cooling, heating, dehumidification, and filtration of the air\nlocated within the passenger compartment of a vehicle.\n\n3) Air-cooled Condenser – an equipment that condenses refrigerant vapor using air\nas the condensing medium\n\n4) Air Distribution – the process of distributing conditioned air into a confined space\n\n5) Charge - A specific amount of refrigerant or compressor oil by weight. The vehicle\nmanufacturer for individual A/C system applications specifies this.\n\n6) Charging - The process of placing a specified amount of refrigerant and\ncompressor oil into an A/C system.\n\n7) Check – to verify, inspect, or test an HVAC/R component for satisfactory condition\nwith the use of an instrument or a device\n\n8) Compressor - commonly referred to as the heart of the system, the compressor is\na belt driven pump that is fastened to the engine. It is responsible for compressing\nand transferring refrigerant gas.\n\n9) Condenser - is the area in which heat dissipation occurs. The condenser is\ndesigned to radiate heat. As hot compressed gasses are introduced into the top of\nthe condenser, they are cooled off. As the gas cools, it condenses and exits the\nbottom of the condenser as a high-pressure liquid.\n\n10) Dehydration – the process of removing moisture from a refrigeration system\n\n11) Electric Heat Defrost – use of electric resistance heating coils to melt ice or frost\nfrom evaporators\n\n12) Evacuation – removal of air/any gas and moisture from a refrigeration system\n\n13) Evaporator – is located in the interior of the vehicle. Its primary function is to\ntransfer heat contained in the passenger compartment air, into the refrigerant,\nwhich is circulated by the compressor, through the evaporator coil. During this\nprocess, the air is also filtered and dehumidified.\n\n14) Fan – a mechanical device for moving air\n\n15) Fan Coil Unit (FCU) – an air-conditioning component that consists of a fan\nmotor and an evaporator coil\n\n--- PDF PAGE 110 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n106\n16) Filter Drier – the component part used in air-conditioning or refrigeration\nsystem to filter and dehydrates refrigerant in the system\n\n17) Idler Pulley – a pulley used to maintain proper belt tension\n\n18) Inspect – determine the actual condition of HVAC/R component without the use of\ninstrument\n\n19) Interlocking – it is the action of interconnecting electric control wires to achieve a\nsequential action\n\n20) Leak Test – the procedure of determining/pin pointing leaks in a pressurized\nsystem\n\n21) Liquid Line Solenoid Valve – electrically operated valve that shuts-off the flow of\nthe refrigerant to the evaporator.\n\n22) Manifold Gauge Set – provides access to and monitors pressures within the\nsystem. Manifold gauge sets are available in different configurations and styles. 3-\nway or 4-way, liquid filled gauges, with or without a sight glass, 3 hoses or 4 hoses,\n1/4 inch or 3/8 inch manifold connections, etc.\n\n23) Metering Device – it is one of the major components in a refrigeration system\nused to regulate the flow of refrigerant into the evaporator\n\n24) Mobile Air-conditioning (MAC) unit – see Transport Air-conditioning unit.\n\n25) Pull-out – to remove from a place of installation\n\n26) Pressure Switches -- the systems use high- and low-pressure switches wired in\nseries to control the power circuit of the compressor clutch relay. If either pressure\nswitch opens, interrupting the circuit to the clutch relay, the operation of the\ncompressor will stop. When conditions return to normal, the switch will\nautomatically reset and the compressor will resume operating. The switches are\nnon--adjustable.\n\n27) Pressure Test – a procedure whereby pressure is applied to the piping system,\nthe purpose of which is to determine its soundness and stability\n\n28) Pump down – a process of using the compressor to pump and contain all the\nrefrigerant charge into the condenser and/or receiver\n\n29) Recovery/Recycle Machine (R134a) - Recovers and recycles R134a refrigerant\nthat is present within the air conditioning system.\n\n30) Refrigerant -- is a material that is used to move heat from the passenger\ncompartment to the outside air. It is a substance that gives up heat by condensing\nat high temperature and pressures and absorbs heat by evaporating at low\ntemperatures and pressures. The heat transfer properties exhibited when\nrefrigerant changes state is the foundation of the refrigerant cycle. Most Transport\nMAC systems use R134a.\n\n--- PDF PAGE 111 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n107\n\n31) Refrigerant Charging – the process of introducing into the system the proper\namount of refrigerant\n\n32) Refrigerant Cylinder -- Storage tank for R134a.\n\n33) Refrigerant Scale -- Accurately weighs the transfer of refrigerant into the air--\nconditioning system.\n\n34) Service Mechanic – worker who possess basic skills related to HVAC/R system\n\n35) Sight Glass/Liquid Line Moisture Indicator – indicates refrigerant quality and\ncharge\n\n36) Split-Type Air-conditioning unit – an air-conditioning unit that contains the\ncompressor, air or water-cooled condenser, metering device in one casing as\noutdoor unit and evaporator in another casing as indoor unit.\n\n37) Supervised Industry Learning – similar to on-the-job training – an approach in\ntraining designed to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations. Likewise, the term Supervised Industry Learning or SIL in\nreplacement of the term Supervised Industry Training (SIT) or On-the-Job Training\n(OJT) to provide more focus on the process of absorbing and retaining learner's\nenhanced competencies in a workplace and thus enable the learner to practice\nthose competencies in a variety of workplace situation.\n\n38) Thermostat Expansion Valve (TXV) – a refrigerant control valve connected\nbefore an evaporator that regulates flow of refrigerant. Operated by temperature\nand pressure, and reacts to the degree of gas superheat at the evaporator outlet\nthrough a feeler bulb\n\n39) Transport Air-conditioning Unit – refers to an air-conditioning unit driven directly\nfrom the turning axle of the vehicle when they are in motion, or by the vehicle\nengine itself, or by a separate gasoline/diesel engine and/or electric motor\nmounted on the same vehicle. It covers the land and marine/sea transports.\n\n40) Troubleshoot – the process of analyzing system defect or malfunction\n\n41) Vacuum – pressure lower than atmospheric pressure measured in inches of\nmercury. Complete vacuum is 29.92 in. mercury or at least 500 microns\n\n42) Vacuum Pump – Removes moisture and air from the air conditioning system in\norder to obtain required micron level.\n\n43) Water Treatment – the use of chemicals in water to prevent corrosion, formation\nof scales, algae growth and formation of slime\n\n44) Workmanlike-manner – quality of work within the accepted industry standard\n\n--- PDF PAGE 112 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n108",
