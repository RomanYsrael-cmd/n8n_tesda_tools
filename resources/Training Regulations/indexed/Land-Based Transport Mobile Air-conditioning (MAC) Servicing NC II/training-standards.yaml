 discussion on:\no Testing points & procedures\n(electrical/mechanical)\no Interlocking control sequence\no operation sequence\no Commissioning forms\n• Perform:\no compressor test procedures\no power supply test procedures\no evaporator assembly test procedures\no condenser assembly test procedures\no thermostatic expansion valve test\nprocedures\no electrical control test procedures\no leak testing procedure\no pressure testing procedure\n• Fill up commissioning report forms\n• Lecture\n• Demonstration\n• Trainee Hands-\non\n• SIL\n• Interview\n• Written test/\nexamination\n• Direct\nObservation\nwith questioning\n• Demonstration\nwith questioning\n24 hours\n\n• Supervised Industry Learning (SIL)\n\n40 hours\n\n*Note: SIL – supervised-industry learning/exposure in actual work environment is included in the nominal training duration. SIL of trainees may be conducted in\ndifferent companies or service areas, e.g. car and van aircon service, buses, trucks service company and train company.\n\n--- PDF PAGE 101 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n97",
