  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Land-Based Transport Mobile Air-Conditioning\n(MAC) NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude green technology, issues on health and drugs and catering to persons\nwith disabilities (PWD’s) to accompany their curricula.\n\nCourse Title: LAND-BASED TRANSPORT MAC SERVICING\n\nPQF Level: NC II\n\nNominal Training Duration: 37 Hours (Basic)\n\n 35 Hours (Common)\n 240 Hours (Core)\n------------------------\n\n312 Hours\n\n400 Hours - Supervised Industry Learning (SIL)*\n\n---------------------------------------------------------\n\n712 Hours - TOTAL\n\n______\n* SIL can be delivered thru Dual Training System (DTS)/Dualized Training Program (DTP) or\nEnterprise-based Training\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in mobile\nair-conditioning (MAC) servicing which covers competencies that services and\nmaintains, troubleshoots and repairs MAC units as well as competencies in\nstarting-up, testing and commissioning. This includes classroom learning activities\nand practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed f