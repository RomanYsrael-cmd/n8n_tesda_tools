  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Land-Based Transport Mobile Air-Conditioning\n(MAC) NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude green technology, issues on health and drugs and catering to persons\nwith disabilities (PWD’s) to accompany their curricula.\n\nCourse Title: LAND-BASED TRANSPORT MAC SERVICING\n\nPQF Level: NC II\n\nNominal Training Duration: 37 Hours (Basic)\n\n 35 Hours (Common)\n 240 Hours (Core)\n------------------------\n\n312 Hours\n\n400 Hours - Supervised Industry Learning (SIL)*\n\n---------------------------------------------------------\n\n712 Hours - TOTAL\n\n______\n* SIL can be delivered thru Dual Training System (DTS)/Dualized Training Program (DTP) or\nEnterprise-based Training\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in mobile\nair-conditioning (MAC) servicing which covers competencies that services and\nmaintains, troubleshoots and repairs MAC units as well as competencies in\nstarting-up, testing and commissioning. This includes classroom learning activities\nand practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieved:\n\n--- PDF PAGE 77 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n73\nBASIC COMPETENCIES\n(37 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n• Describe Organizational policies\n• Read:\no Effective communication\no Written communication\no Communication procedures and systems\n• Identify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n• Prepare different Types of question\n• Gather different sources of information\n• Apply storage system in establishing workplace\ninformation\n• Demonstrate Telephone courtesy\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing workplace\ninstructions\n• Read:\no Written notices and instructions\no Workplace interactions and procedures\n• Read instructions on work related\nforms/documents\n• Perform workplace duties scenario following\nworkplace instructions\n• Group\ndiscussion\n• Lecture\n• Demonstration\n\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n--- PDF PAGE 78 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n74\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork-related\ndocuments\n• Describe Communication procedures and\nsystems\n• Read\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n• Read instructions o