 and weaknesses\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 hour\n5. Contribute to\nworkplace\ninnovation\n5.1. Identify\nopportunities to do\nthings better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges in\ninnovation\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7-habits of highly effective people\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\n1 hour\n\n--- PDF PAGE 82 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n78\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n5.2. Discuss and\ndevelop ideas with\nothers\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges in\ninnovation\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7-habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n\