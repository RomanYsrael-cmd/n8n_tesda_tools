t and repair Perform start-up, testing and commissioning for CACU Perform start-up, test and commissioning for mobile air-conditioning systems Repair & retrofit transport ac & refrigeration systems & its accessories Install domestic refrigeration and air-conditioning units Service & maintain domestic refrigeration and air- conditioning units Troubleshoot & repair domestic refrigeration and air-conditioning units Prepare materials and tools Observe procedures, specifications & manuals of instructions Perform mensurations & calculations Perform basic benchwork Perform basic electrical works Maintain tools and equipment Perform housekeeping and safety practices Document work accomplished Interpret technical drawings and plans Receive and respond to workplace communication Participate in workplace communication Lead workplace communication Utilize specialized communication skill Manage and sustain effective communication strategies Work with others Work in team environment Lead small teams Develop and lead teams Manage and sustain high performing teams Solve/address routine problems Solve/address general workplace problems Apply critical thinking and problem solving techniques in the workplace Perform higher order thinking processes and apply techniques in the workplace Evaluate higher order thinking skills and adjust problem solving techniques Enhance self-management skills Develop career and life decisions Work in a diverse environment Contribute to the practice of social justice in the workplace Advocate strategic thinking for global citizenship Support Innovation Contribute to workplace innovation Propose methods of applying learning and innovation in the organization Manage innovative work instructions Incorporate innovation into work procedures Access and maintain information Present relevant information Use information systematically Manage and evaluate usage of information Develop systems in managing, and maintaining information Follow occupational safety and he