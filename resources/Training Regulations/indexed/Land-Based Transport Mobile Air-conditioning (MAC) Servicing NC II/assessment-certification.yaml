    {
      "number": "1",
      "text": "Accumulator – is used on systems that accommodate an orifice tube to meter refrigerants into the evaporator. It is connected directly to the evaporator outlet and stores excess liquid refrigerant. The chief role of the accumulator is to isolate the compressor from any damaging liquid refrigerant. Accumulators, like receiver- driers, also remove debris and moisture from a system."
    },
    {
      "number": "2",
      "text": "Air-conditioning - is the cooling, heating, dehumidification, and filtration of the air located within the passenger compartment of a vehicle."
    },
    {
      "number": "3",
      "text": "Air-cooled Condenser – an equipment that condenses refrigerant vapor using air as the condensing medium"
    },
    {
      "number": "4",
      "text": "Air Distribution – the process of distributing conditioned air into a confined space"
    },
    {
      "number": "5",
      "text": "Charge - A specific amount of refrigerant or compressor oil by weight. The vehicle manufacturer for individual A/C system applications specifies this."
    },
    {
      "number": "6",
      "text": "Charging - The process of placing a specified amount of refrigerant and compressor oil into an A/C system."
    },
    {
      "number": "7",
      "text": "Check – to verify, inspect, or test an HVAC/R component for satisfactory condition with the use of an instrument or a device"
    },
    {
      "number": "8",
      "text": "Compressor - commonly referred to as the heart of the system, the compressor is a belt driven pump that is fastened to the engine. It is responsible for compressing and transferring refrigerant gas."
    },
    {
      "number": "9",
      "text": "Condenser - is the area in which heat dissipation occurs. The condenser is designed to radiate heat. As hot compressed gasses are introduced into the top of the condenser, they are cooled off. As the gas cools, it condenses and exits the bottom of the condenser as a high-pressure liquid."
    },
    {
      "number": "10",
      "text": "Dehydration – the process of removing moisture from a refrigeration system"
    },
    {
      "number": "11",
      "text": "Electric Heat Defrost – use of electric resistance heating coils to melt ice or frost from evaporators"
    },
    {
      "number": "12",
      "text": "Evacuation – removal of air/any gas and moisture from a refrigeration system"
    },
    {
      "number": "13",
      "text": "Evaporator – is located in the interior of the vehicle. Its primary function is to transfer heat contained in the passenger compartment air, into the refrigerant, which is circulated by the compressor, through the evaporator coil. During this process, the air is also filtered and dehumidified."
    },
    {
      "number": "14",
      "text": "Fan – a mechanical device for moving air"
    },
    {
      "number": "15",
      "text": "Fan Coil Unit (FCU) – an air-conditioning component that consists of a fan motor and an evaporator coil --- PDF PAGE 110 --- TR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021 106"
    },
    {
      "number": "16",
      "text": "Filter Drier – the component part used in air-conditioning or refrigeration system to filter and dehydrates refrigerant in the system"
    },
    {
      "number": "17",
      "text": "Idler Pulley – a pulley used to maintain proper belt tension"
    },
    {
      "number": "18",
      "text": "Inspect – determine the actual condition of HVAC/R component without the use of instrument"
    },
    {
      "number": "19",
      "text": "Interlocking – it is the action of interconnecting electric control wires to achieve a sequential action"
    },
    {
      "number": "20",
      "text": "Leak Test – the procedure of determining/pin pointing leaks in a pressurized system"
    },
    {
      "number": "21",
      "text": "Liquid Line Solenoid Valve – electrically operated valve that shuts-off the flow of the refrigerant to the evaporator."
    },
    {
      "number": "22",
      "text": "Manifold Gauge Set – provides access to and monitors pressures within the system. Manifold gauge sets are available in different configurations and styles. 3- way or 4-way, liquid filled gauges, with or without a sight glass, 3 hoses or 4 hoses, 1/4 inch or 3/8 inch manifold connections, etc."
    },
    {
      "number": "23",
      "text": "Metering Device – it is one of the major components in a refrigeration system used to regulate the flow of refrigerant into the evaporator"
    },
    {
      "number": "24",
      "text": "Mobile Air-conditioning (MAC) unit – see Transport Air-conditioning unit."
    },
    {
      "number": "25",
      "text": "Pull-out – to remove from a place of installation"
    },
    {
      "number": "26",
      "text": "Pressure Switches -- the systems use high- and low-pressure switches wired in series to control the power circuit of the compressor clutch relay. If either pressure switch opens, interrupting the circuit to the clutch relay, the operation of the compressor will stop. When conditions return to normal, the switch will automatically reset and the compressor will resume operating. The switches are non--adjustable."
    },
    {
      "number": "27",
      "text": "Pressure Test – a procedure whereby pressure is applied to the piping system, the purpose of which is to determine its soundness and stability"
    },
    {
      "number": "28",
      "text": "Pump down – a process of using the compressor to pump and contain all the refrigerant charge into the condenser and/or receiver"
    },
    {
      "number": "29",
      "text": "Recovery/Recycle Machine (R134a) - Recovers and recycles R134a refrigerant that is present within the air conditioning system."
    },
    {
      "number": "30",
      "text": "Refrigerant -- is a material that is used to move heat from the passenger compartment to the outside air. It is a substance that gives up heat by condensing at high temperature and pressures and absorbs heat by evaporating at low temperatures and pressures. The heat transfer properties exhibited when refrigerant changes state is the foundation of the refrigerant cycle. Most Transport MAC systems use R134a. --- PDF PAGE 111 --- TR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021 107"
    },
    {
      "number": "31",
      "text": "Refrigerant Charging – the process of introducing into the system the proper amount of refrigerant"
    },
    {
      "number": "32",
      "text": "Refrigerant Cylinder -- Storage tank for R134a."
    },
    {
      "number": "33",
      "text": "Refrigerant Scale -- Accurately weighs the transfer of refrigerant into the air-- conditioning system."
    },
    {
      "number": "34",
      "text": "Service Mechanic – worker who possess basic skills related to HVAC/R system"
    },
    {
      "number": "35",
      "text": "Sight Glass/Liquid Line Moisture Indicator – indicates refrigerant quality and charge"
    },
    {
      "number": "36",
      "text": "Split-Type Air-conditioning unit – an air-conditioning unit that contains the compressor, air or water-cooled condenser, metering device in one casing as outdoor unit and evaporator in another casing as indoor unit."
    },
    {
      "number": "37",
      "text": "Supervised Industry Learning – similar to on-the-job training – an approach in training designed to enhance the knowledge and skills of the trainee through actual experience in the workplace to acquire specific competencies prescribed in the training regulations. Likewise, the term Supervised Industry Learning or SIL in replacement of the term Supervised Industry Training (SIT) or On-the-Job Training (OJT) to provide more focus on the process of absorbing and retaining learner's enhanced competencies in a workplace and thus enable the learner to practice those competencies in a variety of workplace situation."
    },
    {
      "number": "38",
      "text": "Thermostat Expansion Valve (TXV) – a refrigerant control valve connected before an evaporator that regulates flow of refrigerant. Operated by temperature and pressure, and reacts to the degree of gas superheat at the evaporator outlet through a feeler bulb"
    },
    {
      "number": "39",
      "text": "Transport Air-conditioning Unit – refers to an air-conditioning unit driven directly from the turning axle of the vehicle when they are in motion, or by the vehicle engine itself, or by a separate gasoline/diesel engine and/or electric motor mounted on the same vehicle. It covers the land and marine/sea transports."
    },
    {
      "number": "40",
      "text": "Troubleshoot – the process of analyzing system defect or malfunction"
    },
    {
      "number": "41",
      "text": "Vacuum – pressure lower than atmospheric pressure measured in inches of mercury. Complete vacuum is 29.92 in. mercury or at least 500 microns"
    },
    {
      "number": "42",
      "text": "Vacuum Pump – Removes moisture and air from the air conditioning system in order to obtain required micron level."
    },
    {
      "number": "43",
      "text": "Water Treatment – the use of chemicals in water to prevent corrosion, formation of scales, algae growth and formation of slime"
    },
