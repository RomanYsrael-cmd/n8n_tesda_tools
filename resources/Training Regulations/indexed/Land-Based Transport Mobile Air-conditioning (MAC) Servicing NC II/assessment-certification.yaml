  "source_text": "SECTION 4. ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of Land-Based Transport Mobile Air-\nConditioning (MAC) Servicing NC II, the candidate must demonstrate\ncompetence in all the units listed in Section 1. Successful candidates shall\nbe awarded a National Certificate signed by the TESDA Director General.\n\n4.1.2 The qualification of Land-Based Transport Mobile Air-Conditioning\n(MAC) Servicing NC II may be attained through demonstration of\ncompetence through project-type assessment covering all required units of\nthe qualification.\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.1.4 The following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n\n4.1.4.2 Experienced Workers in MAC and RAC servicing for at least 2\nyears (wage employed or self-employed)\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through previous work or life experiences, education, and\ninformal training related to all the core competencies may apply for\nrecognition in the qualification through Portfolio Assessment in accordance\nwith the provision of TESDA Circular No. 59, Series of 2020.\n\n4.1.6 The existing National Certificate (NC) and Certificate of Competency\n(COC) of individuals in Transport RAC Servicing NC II will still be in effect\nuntil the said NC and COC will have expired. Individuals are advised to\ntake the assessment for this amended/updated TR on or before the\nexpiration of such certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in\nthe \"Operating Procedures on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n--- PDF PAGE 107 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n103\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment.\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment activities of candidates\nfor national certification.\n\n4.2.3 Accredited\nCompetency\nAssessor.\nOnly\ncompetency\nassessor\naccredited by TESDA is authorized to assess the competencies of\ncandidates for national certification.\n\n--- PDF PAGE 108 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n104\n"
