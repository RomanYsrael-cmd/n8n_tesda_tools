ON Lauron Refrigeration and Aircon MR. PEDRO A. CARZANO TESDA Region 7- RTC, Cebu City MR. ROY G. CANENCIA JKAE Ref and Aircon Allied Services MR. RENATO S. GARCIA GAB Appliance Service Center MR. PHILIP M. LIGAN MR. PETER JOHN T. ROSARIO College of Technological Sciences MR. VICTOR B. VILLAMOR, JR. TESDA Region 7- RTC, Cebu City • THE REFRIGERATION AND AIR-CONDITIONING TECHNICIANS FOR DEVELOPMENT OF THE PHILIPPINES (RACTAP) • • THE MEMBERS OF THE TESDA BOARD AND SECRETARIAT • THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT • Qualifications and Standards Office (QSO) • Imelda B. Taganas - • Ma. Isabel G. Gamurot - • Samuel E. Calado, Jr. - • Raymundo C. Vergara - • Adrian Brian C. Sabanal - --- PDF PAGE 114 --- TR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021 110 TRAINING REGULATIONS (TR) Qualification Title : Land-based Mobile Air-conditioning (MAC) Servicing NC II Qualification Code: HVCMAC221 Revision No. Document Description Types* Replaces Version (TESDA Board Resolution No./ Date) New Version (TESDA Board Resolution No./ Date) Deployment Circular 00 Document Created – Transport RAC Servicing Not Applicable TB No. 2005-04/ March 18, 2005 Not Applicable 01 Document Amended – Land-based Mobile Air- conditioning (MAC) Servicing NC II TB No. 2005-04/ March 18, 2005 TB No. 2021-24/ June 8, 2021 TESDA Circular No. 084 s. 2021 Legend: *Description Types - Document Created - Document Amended --- PDF PAGE 115 --- TR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021 111 Training Regulation are available in both printed and electronic copies for more information, please contact: Technical Education and Skills Development Authority (TESDA) Tele Fax No.: 8818-7728 or visit our website: www.tesda.gov.ph"
