      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of Land-Based Transport Mobile Air- Conditioning (MAC) Servicing NC II, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The qualification of Land-Based Transport Mobile Air-Conditioning (MAC) Servicing NC II may be attained through demonstration of competence through project-type assessment covering all required units of the qualification. 4.1.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 The following are qualified to apply for assessment and certification: 4.1.4.1 Graduates of formal, non-formal and informal including enterprise- based training programs 4.1.4.2 Experienced Workers in MAC and RAC servicing for at least 2 years (wage employed or self-employed) 4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through previous work or life experiences, education, and informal training related to all the core competencies may apply for recognition in the qualification through Portfolio Assessment in accordance with the provision of TESDA Circular No. 59, Series of 2020. 4.1.6 The existing National Certificate (NC) and Certificate of Competency (COC) of individuals in Transport RAC Servicing NC II will still be in effect until the said NC and COC will have expired. Individuals are advised to take the assessment for this amended/updated TR on or before the expiration of such certificates. 4.1.7 The guidelines on assessment and certification are discussed in detail in the \"Operating Procedures on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\". TR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021"
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment. 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to manage the assessment activities of candidates for national certification. 4.2.3 Accredited Competency Assessor. Only competency assessor accredited by TESDA is authorized to assess the competencies of candidates for national certification. TR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021"
    }
