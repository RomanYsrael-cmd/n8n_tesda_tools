        "source_text": "HVC723350\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes of a\ntechnician to perform start-up, testing and commissioning of\ninstalled or newly installed MAC unit for cars and vans as\nwell as buses, trucks and trains.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated\nin the Range of Variables\n\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare for start-\nup, test and\ncommissioning\nof MAC unit\n1.1. Work instructions are\nread and interpreted to\ndetermine job\nrequirements\n1.2. Tools and equipment are\nselected in accordance\nwith job requirements\n1.3. Pre-start-up, testing and\ncommissioning checks\nare completed and\ncomplied with\nmanufacturer’s manuals.\n1.4. Commissioning method\nand program are\nproduced and recording\nsheets are prepared in\naccordance with\nmanufacturer’s manuals.\n1.5. PPEs are selected in line\nwith job requirements\n\n1.1. Safety signs and\nsymbols\n1.2. Manufacturer’s manual\n1.3. Forms:\n1.3.1. work instruction\nsheet\n1.3.2. job order sheet\n1.3.3. data sheet\n1.3.4. commissioning\nreport form\n1.4. Tools and testing\ninstruments/ train\ndiagnostic system\n1.5. Personal protective\nequipment\n\n1.1. Interpret work\ninstructions\n1.2. Selection of\nforms for\ncommissioning\n1.3. Selection and\nsafe handling\nof tools and\ntesting\ninstruments\n1.4. selection of\nproper\npersonal\nprotective\nequipment\n1.5. train diagnostic\nskills\n\n2. Conduct start-up,\ntest and\ncommissioning\nof MAC unit\n2.1. Electrical related\nchecks are performed\nbased on manufacturer’s\nmanuals.\n2.2. Refrigerant piping and\nfitting connection\nrelated checks are\nperformed based on\nmanufacturer’s manuals\n2.3. Compressor assembly\nrelated checks are\nperformed based on\nmanufacturer’s manuals.\n2.4. Temperature and airflow\ncheck is performed\nbased on manufacturer’s\nmanual\n2.5. Control panel related\nchecks are performed\nbased on manufacturer’s\nmanuals and site\n2.1. Basic electricity\n2.2. Operation of generator\n2.3. Electrical control test\nprocedures\n2.4. Interlocking control\nsequence\n2.5. Refrigerant piping\n2.6. Compressor test\nprocedures\n2.7. Power supply test\nprocedures\n2.8. Condenser/ evaporator\nassembly test\nprocedures\n2.9. Leak testing procedure\n2.10. Refrigerant type test\nprocedure\n2.11. Temperature and\nairflow check\nprocedure\n2.12. System operating\n2.1. Performing\nelectrical\nrelated testing\n2.2. Performing\npipe and tubing\nleak testing\n2.3. Performing\ncompressor\nassembly tests\n2.4. Performing\nevaporator/\ncondenser\nassembly test\n2.5. Performing\nidentification of\nrefrigerants\n2.6. Filling-up of\nstart-up and\ncommissioning\nreports\n\n--- PDF PAGE 74 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n70\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated\nin the Range of Variables\n\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\nconditions\n2.6. System operating\npressure and\ntemperature are checked\nin accordance with\nmanufacturer's manual\n2.7. Start-up, testing and\ncommissioning reports\nare accomplished in line\nwith enterprise policies\nand procedures\npressure and\ntemperature check\nprocedure\n2.13. Start-up and\ncommissioning forms\n\n--- PDF PAGE 75 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n71\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Electrical related checks\nThis includes:\n1.1 Power supply source checks\n1.2 Safety and circuit protection checks\n1.3 Electrical wiring and harness checks\n1.4 Grounding systems checks\n2. Refrigerant piping and fitting\nconnection related checks\nMay include:\n2.1 Leak testing\n2.2 Pipe insulation inspection\n2.3 Pipe and fittings inspection\n3. Compressor assembly\nrelated checks\nMay include:\n3.1 Belt tension and pulley alignment\n3.2 Terminal connection inspection\n3.3 Compressor and magnetic clutch assembly\nalignment and clearance\n4. Control panel related checks\nMay include:\n4.1 Air flow selector\n4.2 Air inlet selector\n4.3 Temperature selector\n4.4 Blower speed selector\n4.5 AC switch\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared for start-up, testing and commissioning of MAC\n1.2\nConducted start-up, testing and commissioning of MAC\n\n2. Resource\nImplications\n\nThe following resources MUST be provided:\n2.1 Work place location\n2.2 Tools and equipment appropriate in performing start-up,\ntesting and commissioning refrigeration and air-\nconditioning systems\n2.3 Materials relevant to the proposed activity\n2.4 Drawings and specifications relevant to the task\n\n3. Methods of\nAssessment\nCompetency must be assessed through:\n3.1 Written test\n3.2 Direct observation/Demonstration with oral questioning\n3.3 Portfolio\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 76 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n72"
