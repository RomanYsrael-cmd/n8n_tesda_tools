        "source_text": "--- PDF PAGE 38 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n34\nUNIT OF COMPETENCY:  OBSERVE PROCEDURES, SPECIFICATIONS   \n                                             AND MANUALS OF INSTRUCTION \n \n \nUNIT CODE \n \n    :   HVC311201 \n  \n \n \n \n \n \n \n UNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes in \nidentifying, interpreting, applying services to specifications and \nmanuals, and storing manuals. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Identify and \naccess \nspecification/\nmanuals \n \n1.1 Appropriate manuals are \nidentified and accessed as \nper job requirements \n1.2 Version and date of manual is \nchecked to ensure correct \nspecification and procedure \nare identified \n  \n1.1 Types of \nmanuals used in \nHVAC/R sector \n1.2 Identification of \nsymbols used in \nthe manuals \n1.1 Reading and \ncomprehension \nskills required to \nidentify and interpret \nconstruction \nmanuals and \nspecifications \n1.2 Identifying manuals \nand specifications \n1.3 Accessing \ninformation and data \n2. Interpret \nmanuals \n2.1 Relevant sections, chapters \nof specifications/ manuals are \nlocated in relations to the \nwork to be conducted \n2.2 Information and procedure in \nthe manual are interpreted in \naccordance to industry \npractices \n \n2.1 Types of \nmanuals used \nin HVAC/R \nsector \n2.2 Types of \nsymbols used in \nthe manuals \n2.3 System of \nmeasurements \n2.4 Unit conversion \n2.1 Interpreting symbols \nand specifications \n2.2 Accessing \ninformation and data \n2.3 Applying conversion \nof units of \nmeasurements \n3. Apply \ninformation in \nmanual \n3.1 Manual is interpreted \naccording to job requirements \n3.2 Work steps are correctly \nidentified in accordance with \nmanufacturer's specification \n3.3 Manual data is applied \naccording to the given task \n3.4 All correct sequencing and \nadjustments are interpreted in \naccordance with information \ncontained on the manual or \nspecifications \n3.1 Types of \nmanuals used \nin HVAC/R \nsector \n3.2 Types and \napplication of \nsymbols in \nmanuals \n3.3 Unit conversion \n3.1 Applying \ninformation from \nmanuals \n4. Store \nmanuals \n4.1 Manual or specification are \nstored appropriately to ensure \nprevention of damage, ready \naccess and updating of \ninformation when required in \naccordance with company \nrequirements \n \n4.1 Types of \nmanuals used \nin HVAC/R \nsector \n4.2 Manual storing \nand \nmaintaining \nprocedures \n4.1 Storing and \nmaintaining manuals\n\n--- PDF PAGE 39 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n35\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Manual \n \n \nKinds of Manuals: \n1.1 Installation Manual \n1.1.1 Manufacturer's Specification Manual \n1.2 Owner’s Manual \n1.2.1 Maintenance Procedure Manual \n1.2.2 Periodic Maintenance Manual \n \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \n     of Competency \nAssessment requires that the candidate: \n1.1 Identified and accessed specification/manuals as per \njob requirements \n1.2 Interpreted manuals in accordance to industry \npractices \n1.3 Applied information in manuals according to the given \ntask \n1.4 Stored manuals in accordance with company \nrequirements \n \n2. Resource Implications \nThe following resources should be provided: \n2.1 All manuals/catalogues relative to HVAC/R sector \n \n3. Methods of Assessment \nCompetency should be assessed through: \n3.1 Direct Observation  \n3.2 Questions/Interview \n \nAssessment of required knowledge and practical skills \nmay be combined \n \n4. Context for Assessment \n4.1 \nCompetency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines \n4.2 \nAssessment may be conducted in the workplace or \na simulated environment\n",
