          "source_text": "1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per\njob requirements\n1.2 Interpreted manuals in accordance to industry\npractices\n1.3 Applied information in manuals according to the given\ntask\n1.4 Stored manuals in accordance with company\nrequirements\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 All manuals/catalogues relative to HVAC/R sector\n\n3. Methods of Assessment\nCompetency should be assessed through:\n3.1 Direct Observation\n3.2 Questions/Interview\n\nAssessment of required knowledge and practical skills\nmay be combined\n\n4. Context for Assessment\n4.1\nCompetency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n4.2\nAssessment may be conducted in the workplace or\na simulated environment\n\n--- PDF PAGE 40 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n36\n\nUNIT OF COMPETENCY: PERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n :"
