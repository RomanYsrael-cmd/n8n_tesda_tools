egies\nand feedback from peers\nand teachers are predicted\n\n2.1. Basic SWOT analysis\n2.2. Strategies to improve\none’s attitude in the\nworkplace\n2.3. Gibbs’ Reflective\nCycle/Model\n(Description,\nFeelings, Evaluation,\nAnalysis, Conclusion,\nand Action plan)\n2.1. Using the basic\nSWOT analysis as\nself-assessment\nstrategy\n2.2. Developing\nreflective practice\nthrough realization\nof limitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3. Demonstrating self-\nacceptance and\nbeing able to\naccept challenges\n\n--- PDF PAGE 17 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n13\n3. Boost self-\nconfidence\nand\ndevelop\nself-\nregulation\n3.1. Efforts for continuous self-\nimprovement are\ndemonstrated\n3.2. Counter-productive\ntendencies at work are\neliminated\n3.3. Positive outlook in life are\nmaintained.\n\n3.1. Four components of\nself-regulation based\non Self-Regulation\nTheory (SRT)\n3.2. Personality\ndevelopment\nconcepts\n3.3. Self-help concepts\n(e. g., 7 Habits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n3.1. Performing\neffective\ncommunication\nskills – reading,\nwriting, conversing\nskills\n3.2. Showing affective\nskills – flexibility,\nadaptability, etc.\n3.3. Self-assessment\nfor determining\none’s strengths and\nweaknesses\n\n--- PDF PAGE 18 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n14\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include but not limited to:\n1.1\nSeeking assistance in the form of job coaching or\nmentoring\n1.2\nContinuing dialogue to tackle workplace\ngrievances\n1.3\nCollective negotiation/bargaining for better\nworking conditions\n1.4\nShare your goals to improve with a trusted co-\nworker or supervisor\n1.5\nMake a negativity log of every instance when you\ncatch yourself complaining to others\n1.6\nMake lists and schedules for necessary activities\n2