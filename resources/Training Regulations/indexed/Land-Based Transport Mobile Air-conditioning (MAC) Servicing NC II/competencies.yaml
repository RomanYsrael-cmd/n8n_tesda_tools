  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in Land-Based Transport Mobile Air-Conditioning (MAC) Servicing\nNC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 400311210\nUNIT DESCRIPTOR\n :\nThis unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are used\nto gather and convey\ninformation\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n1.1 Effective\ncommunication\n1.2 Different modes\nof communication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\ncommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace measures\n1.6 Relating/ Interacting\nwith people of\nvarious levels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n1.9 Interpersonal skills in\nthe workplace\n1.10 Active-listening skills\n\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are read\nand interpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are followed\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes\nof communication\n2.3 Medium of\ncommunication in\nthe workplace\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace meetings\n\n--- PDF PAGE 7 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nbased on established\nprocedures\n2.3 Feedback is given to\nworkplace supervisor-\nbased instructions/\ninformation received\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and matters\nconcerning conditions of\nemployment are sought\nand asked from\nappropriate sources\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\nand discussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace measures\n2.6 Relating/ Responding\nto people of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding information\nin response to\nworkplace\nrequirements\n2.8 Basic questioning/\nquerying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n\n3. Complete\nrelevant\nwork-related\ndocuments\n3.1 Range of forms relating\nto conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.4 Reporting requirements\nto supervisor are\ncompleted according to\norganizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes\nof communication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n3.1 Completing work-\nrelated documents\n3.2 Applying operations\nof addition,\nsubtraction, division\nand multiplication\n3.3 Gathering and\nproviding information\nin response to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace interactions\nMay include:\n4.1.\nFace to face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic, memos, instruction\nand forms,\n4.5.\nNon-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 9 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021 5\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format\nof the organization\n1.2. Accessed information using workplace communication\nequipment/systems\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Notebook / Writing materials\n2.4. Computer with internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Interview\n3.3. Written test\n3.4. Third-party report\n4. Context for\nAssessment\n4.1. Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 10 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021 6\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 400311211\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify\none’s roles and responsibilities as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Describe\nteam role and\nscope\n1.1. The role and objective of\nthe team is identified from\navailable sources of\ninformation\n1.2. Team parameters, reporting\nrelationships and\nresponsibilities are\nidentified from team\ndiscussions and appropriate\nexternal sources\n\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating with\nothers, appropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways in\nimproving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin team\n2.1. Individual role and\nresponsibilities within the\nteam environment are\nidentified\n2.2. Roles and objectives of the\nteam is identified from\navailable source of\ninformation\n2.3. Team parameters, reporting\nrelationships and\nresponsibilities are identified\nbased on team discussions\nand appropriate external\nsources\n2.1.\nTeam roles\nand objectives\n2.2.\nTeam\nstructure and\nparameters\n2.3.\nTeam\ndevelopment\n2.4.\nSources of\ninformation\n2.1. Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2. Developing ways in\nimproving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n3. Work as a\nteam member\n3.1. Effective and appropriate\nforms of communications\nare used and interactions\nundertaken with team\nmembers based on\ncompany practices\n3.2. Effective and appropriate\ncontributions is made to\ncomplement team activities\nand objectives based on\nworkplace context\n3.3. Protocols in reporting are\nobserved based on\nstandard company practices\n3.4. Contribute to the\ndevelopment of team work\nplans based on an\nunderstanding of team’s\nrole and objectives\n3.1. Communication\nprocess\n3.2. Workplace\ncommunication\nprotocol\n3.3. Team planning\nand decision\nmaking\n3.4. Team thinking\n3.5. Team roles\n3.6. Process of team\ndevelopment\n3.7. Workplace\ncontext\n3.1. Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n3.2. Interacting\neffectively with\nothers\n3.3. Deciding as an\nindividual and as a\ngroup using group\nthink strategies and\ntechniques\n3.4. Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 11 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n7\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\nMay include but not limited to:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include but not limited to:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include but not limited to:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 12 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n8\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.2. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n3.3. Socio-drama and socio-metric methods\n3.4. Sensitivity techniques\n3.5. Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 13 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n9\nUNIT OF COMPETENCY: SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS\n\nUNIT CODE : 400311212\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply problem-solving techniques to determine the origin\nof problems and plan for their resolution. It also includes\naddressing procedural problems through documentation,\nand referral.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems or\nprocedural problem areas\nare identified\n1.2 Problems to be investigated\nare defined and determined\n1.3 Current conditions of the\nproblem are identified and\ndocumented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk\npractices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying current\nindustry hardware and\nsoftware products and\nservices\n1.2 Identifying current\nindustry maintenance,\nservices and helpdesk\npractices, processes and\nprocedures.\n1.3 Identifying current\nindustry standard\ndiagnostic tools\n1.4 Describing common\nmalfunctions and\nresolutions.\n1.5 Determining the root\ncause of a routine\nmalfunction\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential solutions to\nproblem are identified\n2.2 Recommendations about\npossible solutions are\ndeveloped, documented,\nranked and presented to\nappropriate person for\ndecision\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating\nsystems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying current\nindustry hardware and\nsoftware products and\nservices\n2.2 Identifying services and\nhelpdesk practices,\nprocesses and\nprocedures.\n2.3 Identifying operating\nsystem\n2.4 Identifying current\nindustry standard\ndiagnostic tools\n2.5 Describing common\nmalfunctions and\nresolutions.\n2.6 Determining the root\ncause of a routine\nmalfunction\n3. Recommen\nd solutions\nto problems\n3.1 Implementation of solutions\nare planned\n3.2 Evaluation of implemented\nsolutions are planned\n3.3 Recommended solutions\nare documented and submit\nto appropriate person for\nconfirmation\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation that\nrecommends solutions\nto problems\n3.2 Following established\nprocedures\n\n--- PDF PAGE 14 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n10\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include but not limited to:\n1.1\nRoutine/non – routine processes and quality problems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and incidents\n1.5\n Work-related problems outside of own work area\n\n2. Appropriate person\nMay include but not limited to:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n\n3.\nDocument\n\nMay include but not limited to:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n\n4.\nPlan\n\nMay include but not limited to:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n11\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends solutions to\nproblems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n\n2. Resource\nImplications\n2.1 Assessment will require access to a workplace over an\nextended period, or a suitable method of gathering\nevidence of operating ability over a range of situations.\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nCase Formulation\n3.2\nLife Narrative Inquiry\n3.3\nStandardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include walk\nthrough of the relevant competency components.\n\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 16 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n12\n\nUNIT OF COMPETENCY : DEVELOP CAREER AND LIFE DECISIONS\nUNIT CODE : 400311213\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitudes in\nmanaging one’s emotions, developing reflective practice, and\nboosting self-confidence and developing self-regulation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Manage\none’s\nemotion\n1.1. Self-management\nstrategies are identified\n1.2. Skills to work\nindependently and to show\ninitiative, to be\nconscientious, and\npersevering in the face of\nsetbacks and frustrations\nare developed\n1.3. Techniques for effectively\nhandling negative\nemotions and unpleasant\nsituation in the workplace\nare examined\n\n1.1. Self-management\nstrategies that assist\nin regulating behavior\nand achieving\npersonal and learning\ngoals (e.g. Nine self-\nmanagement\nstrategies according\nto Robert Kelley)\n1.2. Enablers and barriers\nin achieving personal\nand career goals\n1.3. Techniques in\nhandling negative\nemotions and\nunpleasant situation\nin the workplace such\nas frustration, anger,\nworry, anxiety, etc.\n1.1. Managing properly,\none’s emotions and\nrecognizing\nsituations that\ncannot be changed\nand accept them\nand remain\nprofessional\n1.2. Developing self-\ndiscipline, working\nindependently and\nshowing initiative to\nachieve personal\nand career goals\n1.3. 1Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other negative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n2. Develop\nreflective\npractice\n2.1. Personal strengths and\nachievements, based on\nself-assessment strategies\nand teacher feedback are\ncontemplated\n2.2. Progress when seeking\nand responding to\nfeedback from teachers to\nassist them in\nconsolidating strengths,\naddressing weaknesses\nand fulfilling their potential\nare monit