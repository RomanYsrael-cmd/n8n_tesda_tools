        "source_text": "HVC311205\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in checking\ncondition, performing preventive maintenance and storing of tools\nand equipment based on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check\ncondition of\ntools and\nequipment\n\n1.1. Materials, tools and\nequipment are identified\naccording to classification and\njob requirements\n1.2. Non-functional tools and\nequipment are segregated\nand labeled according to\nclassification\n1.3. Safety of tools and equipment\nare observed in accordance\nwith manufacturer's instructions\n1.4. Condition of PPE are checked\nin accordance with\nmanufacturer's instructions\n1.1. Safety Practices\no Use of PPE\no Handling of tools\nand equipment\no Good housekeeping\n1.2. Materials, Tools and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\no Types and uses of\nHVAC/R tools\no Types and uses of\nHVAC/R equipment\n1.3. Operational conditions\nof HVAC/R tools and\nequipment\n1.4. HVAC/R tools and\nequipment defects\n1.1. Maintaining\ntools and\nequipment\n1.2. Handling of\ntools and\nequipment\n1.3. Identifying\ntools and\nequipment\ndefects\n2. Perform basic\npreventive\nmaintenance\n2.1. Appropriate lubricants are\nidentified according to types of\nequipment\n2.2. Tools and equipment are\nlubricated according to\npreventive maintenance\nschedule or manufacturer's\nspecifications\n2.3. Measuring instruments are\nchecked and calibrated in\naccordance with manufacturer’s\ninstructions\n2.4. Tools are cleaned and\nlubricated according to\nstandard procedures\n2.5. Defective instruments,\nequipment and accessories are\ninspected and replaced\naccording to manufacturer’s\nspecifications\n2.6. Tools are inspected, repaired\nand replaced every after use\n2.7. Work place are cleaned and in\nsafe state in line with OHSA\nregulations\n\n2.1. Safety Practices\no Use of PPE\no Handling of tools\nand equipment\no Good housekeeping\n2.2. Materials, Tools and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\n2.3. Preventive\nMaintenance\no Methods and\ntechniques\no Procedures\n\n2.1. Handling of\ntools and\nequipment\n2.2. Performing\npreventive\nmaintenance\n\n--- PDF PAGE 52 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n48\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Store tools\nand\nequipment\n\n3.1. Inventory of tools, instruments\nand equipment are conducted\nand recorded as per company\npractices\n3.2. Tools and equipment are stored\nsafely in appropriate locations\nin accordance with\nmanufacturer's specifications or\ncompany procedures\n\n3.1. Safety Practices\no Use of PPE\no Handling of tools\nand equipment\no Storing procedures\nand techniques\no Storage conditions/\nlocations\n\n3.1. Storing tools\nand\nequipment\n3.2. Handling of\ntools and\nequipment\n\n--- PDF PAGE 53 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n49\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n\n2. Tools and equipment\nIncluding but not limited to:\n2.1 Tools\n- Cutting tools - hacksaw, crosscut saw, rip saw\n- Boring tools - auger, brace, grinlet, hand drill\n- Holding tools - vise grip, C-clamp, bench vise\n- Threading tools - die and stock, taps\n\n2.2 Measuring instruments/Equipment\n\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n\n4. Forms\n4.1 Maintenance schedule forms\n4.2 Requisition Slip\n4.3 Inventory Form Slip\n4.4 Inspection Form Slip\n4.5 Procedures\n\n--- PDF PAGE 54 ---\nTR–Land-based Tra