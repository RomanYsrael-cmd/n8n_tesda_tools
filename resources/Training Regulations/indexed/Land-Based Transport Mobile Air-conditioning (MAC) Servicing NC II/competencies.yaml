        "source_title": "PREPARE MATERIALS AND TOOLS",
        "source_text": "--- PDF PAGE 32 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n28\n \nCOMMON COMPETENCIES \n \n \nUNIT OF COMPETENCY:  PREPARE MATERIALS AND TOOLS \n \nUNIT CODE  \n        :   HVC713201 \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes in \nidentifying, requesting and receiving   construction materials \nand tools based on the required performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nmaterials \n \n \n1.1. Materials are listed as per job \nrequirements \n1.2. Quantity and description of \nmaterials conformed to the \njob requirements \n1.3. Tools and accessories are \nidentified according to job \nrequirements \n1.1. Types and uses of \nHVAC/R materials \nand tools \n1.2. Different forms for \npreparation of \nmaterials, tools \nand accessories \n1.3. Requisition \nprocedures \n \n1.1. Preparing \nmaterials and \ntools \n1.2. Proper handling \nof tools and \nequipment \n1.3. Following \nInstructions \n2. Request \nmaterials \nand tools \n2.1.  Materials and tools needed \nare requested according to \nthe list prepared \n2.2. Request is done as per \ncompany standard operating \nprocedures \n2.3. Substitute materials and tools \nare provided without \nsacrificing cost and quality of \nthe work \n2.1. Standard \nprocedures in \nrequisition of \nmaterials and tools \n2.2. Listing of different \nHVAC/R materials \nand tools \n2.3. Probable \nsubstitute \nmaterials \n2.1. Preparing \nrequisition slip \n2.2. Communication \nskills \n2.3. Identifying \nHVAC/R \nmaterials and \ntools \n3. Receive and \ninspect      \nmaterials \nand tools \n3.1. Materials and tools issued are \ninspected as per quantity and \nspecification \n3.2. Tools, accessories and \nmaterials checked for \ndamages according to \nenterprise procedures \n3.3. Materials and tools are set \naside to appropriate location \nnearest to the workplace \n \n3.1. Safety \nrequirements in \ninspection of \nmaterials and tools  \n3.2. Standard \nprocedures in \nchecking materials \nand tools \n3.3. 5S principles \n3.1. Applying safety \nprocedures in \nthe workplace \n3.2. Preparing \nmaterials and \ntools \n3.3. Proper handling \nof tools and \nequipment \n3.4. Following \nInstructions\n\n--- PDF PAGE 33 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n29\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials and tools \n \n \n1.1 Air-conditioning \n1.2 Refrigeration \n \n2.  Description of materials and \ntools \n \n2.1 Brand name \n2.2 Size \n2.3 Capacity \n2.4 Kind of application \n \n3.  Company standard   \nprocedures \n3.1 Job Order \n3.2 Requisition Slip \n3.3 Borrower Slip \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \n \n \n \nAssessment requires evidence that the candidate: \n1.1 Listed materials and tools according to quantity and job \nrequirements  \n1.2 Requested materials and tools according to the list \nprepared and as per company standard operating \nprocedures \n1.3 Inspected issued materials and tools as per quantity and \njob specifications \n1.4 Tools provided with appropriate safety devices \n \n2. Resource \nImplications \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications     relevant \nto the activities \n3. Methods of \nAssessment \n \nCompetency in this unit must be assessed through: \n3.1  Direct observation and oral questioning \n4. Context for \nAssessment \n \n \n \n4.1  Competency may be assessed in the workplace or in a \nsimulated workplace \n4.2  Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n",
