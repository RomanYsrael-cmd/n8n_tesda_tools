        "source_title": "SERVICE AND MAINTAIN MOBILE AIR-CONDITIONING (MAC) UNITS",
        "source_text": "--- PDF PAGE 62 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n58\nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY:  SERVICE AND MAINTAIN MOBILE AIR-CONDITIONING \n(MAC) UNITS \n \nUNIT CODE                     :  HVC723348 \n \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes required \nto service and maintain MAC units for cars and vans as well \nas buses, trucks and trains.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated \nin the Range of Variables \n \nREQUIRED KNOWLEDGE \nREQUIRED \nSKILLS \n1. Clean and \nreplace air \nfilter \n1.1. Air filter is identified and \nremoved following \nstandard operating \nprocedures (SOPs) \n1.2. Air filter is checked for \ndamage and replaced if \nrequired in line with \nSOPs \n1.3. Air filter is cleaned using \nthe correct tools and \ncleaning procedures  \n1.4. Air filter is replaced in \naccordance with filter \nspecifications \n1.1 Protective personal \nequipment/safety gears \n1.2 Proper handling of tools, \nequipment and accessories \n1.3 Safety signs and symbols \n1.4 Good housekeeping \n1.5 Types of air filters \n1.6 Cleaning agents \n1.7 Pressure washer operation \n1.8 Compressed air operation \n1.9 Servicing and maintenance \nprocedures \n1.10 Procedures in cleaning \nand/or replacing air filter  \n1.11 Manufacturer’s service \nmanual \n1.12 RAC Code of Practice \n1.13 RA 11058 provisions \n1.1 Interpreting \ndiagrams \n1.2 Preparing \nmaterials \n1.3 Proper handling \nof tools and \nequipment \n1.4 Assembling and \ndisassembling  \n1.5 Cleaning skills \n1.6 Interpersonal \nskills \n2. Recover/ \nrecycle \nrefrigerants \n2.1. Unit is assessed for \nrecovery/recycling \nactivities following SOP \n2.2. Equipment for recovery/ \nrecycling is set-up based \non manufacturer’s \ninstruction \n2.3. Optimum \nrecovery/recycling of \nrefrigerant is performed \nin line with RAC Code of \nPractice  \n2.4. Flammable refrigerants \nare handled properly \naccording to international \nstandards \n \n2.1 Protective personal \nequipment/safety gears \n2.2 Proper handling of tools, \nequipment and accessories \n2.3 Safety signs and symbols \n2.4 Good housekeeping \n2.5 RA 11058 provisions \n2.6 Identification of types of \nrefrigerants \n2.7 Cleaning agents \n2.8 Flushing solution \n2.9 System analyzer/Gauge \nmanifold \n2.10 Refrigerant identifier \n2.11 Recovery/recycling \nmachine \n2.12 Refrigerant cylinder \n2.13 Fundamentals of \nrefrigeration  \n2.14 Refrigeration system \n2.15 Proper storage of \nrefrigerants \n2.16 Recovery and recycling \n2.1 Interpreting \ndiagrams \n2.2 Preparing \nmaterials \n2.3 Proper handling \nof tools and \nequipment \n2.4 Identification of \nrefrigerants \n2.5 Setting up \nrecovery/ \nrecycling \nmachine \n2.6 Interpersonal \nskills\n\n--- PDF PAGE 63 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n59\nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated \nin the Range of Variables \n \nREQUIRED KNOWLEDGE \nREQUIRED \nSKILLS \nprocess \n2.17 RAC Code of Practice \n2.18 RA 11058 provisions \n3. Service \nevaporator/ \ncondenser \nassembly \n3.1. Tools are selected in \ndismantling the \nevaporator/ condenser as \nper standard operating \nprocedures (SOPs) \n3.2. Evaporator/condenser \nare pulled out and \ndisassembled as per \nmanufacturer’s service \nmanual \n3.3. High pressure washer \nand compressed air are \nused in cleaning \nevaporator/condensing \ncoil based on established \nenterprise procedures \n3.4. Evaporator/condenser \ncoil fins are straightened \nin accordance with \nservice procedure \n3.5. Cleaning agent or non-\ncorrosive chemical is \nused in cleaning and \nmaintaining evaporator/ \ncondensing coil, fins and \nother body accessories \nas per standard \noperating procedures \n(SOPs) \n3.6. Condenser fan motor and \nevaporator blower \nassembly are maintained