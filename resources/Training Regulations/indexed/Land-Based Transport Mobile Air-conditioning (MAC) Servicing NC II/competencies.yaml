        "source_title": "PERFORM MENSURATIONS AND CALCULATIONS",
        "source_text": "--- PDF PAGE 40 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n36\n \nUNIT OF COMPETENCY:  PERFORM MENSURATIONS AND CALCULATIONS                           \n \nUNIT CODE  \n        :   HVC311203 \n \nUNIT DESCRIPTOR       :  This unit covers the knowledge, skills and attitudes in \nidentifying and measuring objects based on the required \nperformance standards.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select \nmeasuring \ninstruments \n \n \n1.1. Object or component to be \nmeasured is identified, classified \nand interpreted to the appropriate \nregular geometric shape  \n1.2. Measuring tools are selected/ \nidentified as per object to be \nmeasured or job requirements \n1.3. Correct specifications are \nobtained from relevant sources \n1.4. Appropriate measuring \ninstruments are selected \naccording to job requirements   \n1.5. Alternative measuring tools are \nused without sacrificing cost and \nquality of work \n \n1.1. Category of \nmeasuring \ninstruments \n1.2. Types and uses \nof measuring \ninstruments \n1.3. Shapes and \nDimensions \n1.4. Formulas for \nvolume, areas, \nperimeters of \nplane and \ngeometric figures \n1.1. Identifying \nand selecting \nmeasuring \ninstruments \n1.2. Visualizing \nobjects and \nshapes \n2. Carry out \nmeasurements \nand \ncalculations \n \n \n2.1. Accurate measurements and \ncalculations are obtained to job \nrequirements \n2.2. Alternative measuring tools are \nused without sacrificing cost and \nquality of work \n2.3. Calculation needed to complete \nwork tasks are performed using \nthe four basic process of addition \n(+), subtraction (-), multiplication \n(x) and division (/) including but \nnot limited to: trigonometric \nfunctions, algebraic computations \n2.4. Calculations involving fractions, \npercentages and mixed numbers \nare used to complete workplace \ntasks \n2.5. Numerical computation is self-\nchecked and corrected for \naccuracy \n2.6. Instruments are read to the limit \nof accuracy of the tool \n2.7. Systems of measurement \nidentified and converted \naccording to job \nrequirements/ISO \n2.8. Work pieces are measured \naccording to job requirements \n \n2.1. Calculation & \nmeasurement \n2.2. Four fundamental \noperations \n2.3. Linear \nmeasurement \n2.4. Dimensions \n2.5. Unit conversion \n2.6. Ratio and        \nproportion \n2.1. Performing \ncalculation by \naddition, \nsubtraction, \nmultiplication \nand division;  \n2.2. Interpreting \nformulas for \nvolume, \nareas, \nperimeters of \nplane and \ngeometric \nfigures \n2.3. Handling of \nmeasuring \ninstruments\n\n--- PDF PAGE 41 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n37\nELEMENT \nPERFORMANCE CRITERIA \nItalicized fonts are elaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n3. Maintain \nmeasuring \ninstruments \n3.1. Measuring instruments are not \ndropped to avoid damage \n3.2. Measuring instruments are \ncleaned before and after using. \n3.3. Proper storage of instruments \nundertaken according to \nmanufacturer’s specifications and \nstandard operating procedures. \n \n3.1. Types of \nmeasuring \ninstruments and \ntheir uses \n3.2. Safe handling \nprocedures in \nusing measuring \ninstruments \n3.3. Four \nfundamental \noperation of \nmathematics \n3.4. Formula for \nvolume, area, \nperimeter and \nother geometric \nfigures \n3.1. Handling \nand \nmaintaining \nmeasuring \ninstruments\n\n--- PDF PAGE 42 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n38\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Geometric Shape \n \n \n \n \n \n Including but I not limited to: \n1.1 Round \n1.2 Square \n1.3 Rectangular \n1.4 Triangle \n1.5 Sphere \n1.6 Conical \n \n2.  Measuring \ninstruments \nIncluding but not limited to: \n2.1 Micrometer (In-out, depth) \n2.2 Vernier caliper (out, inside) \n2.3 Dial gauge with mag, std. \n2.4 Straight edge \n2.5 Thickness gauge \n2.6 Torque gauge \n2.7 Small hole gauge \n2.8 Telescopic gauge \n2.9 Try-square \n \n \n2.10 Protractor \n2.11 Combination gauge \n2.12 Steel rule \n2.13 Voltmeter \n2.14 Ammeter \n2.15 Mega-ohmmeter \n2.16 KWH meter \n2.17 Gauges \n2.18 Thermometers \n \n3.  Measurements \nand calculations \n \n3.1 Linear \n3.2 Volume \n3.3 Area \n3.4 Wattage \n3.5 Voltage \n3.6 Resistance \n3.7 Amperage \n3.8 Frequency \n3.9 Impedance \n3.10 Conductance \n3.11 Capacitance \n3.12 Displacement \n3.13 Inside diameter \n3.14 Circumference \n3.15 Length \n3.16 Thickness \n3.17 Outside diameter \n3.18 Taper \n3.19 Out of roundness \n3.20 Oil clearance \n3.21 End play/thrust \nclearance\n\n--- PDF PAGE 43 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n39\n \nEVIDENCE GUIDE \n \n1. Critical aspects \n     of Competency \nAssessment requires that the candidate: \n1.1 Selected and prepared appropriate measuring instruments \nin accordance with job requirements \n1.2 Performed measurements and calculations according to job \nrequirements/ ISO \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Problems to solve \n2.3 Measuring instrument appropriate to carry out tasks \n2.4 Instructional materials relevant to the propose activity \n \nAssessment of required knowledge and practical skills may be \ncombined \n3. Methods of \nAssessment \nCompetency should be assessed through: \n3.1 Actual demonstration \n3.2 Direct observation \n3.3 Written test/questioning related to required knowledge \n \n4. Context for \nAssessment \n4.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n4.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n4.3 Competency assessment must be undertaken in accordance \nwith the TESDA assessment guidelines\n",
