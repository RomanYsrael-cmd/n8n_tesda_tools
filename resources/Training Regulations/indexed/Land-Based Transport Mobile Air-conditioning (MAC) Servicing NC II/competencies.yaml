  "source_section_text": "Section 1. Successful candidates shall\nbe awarded a National Certificate signed by the TESDA Director General.\n\n4.1.2 The qualification of Land-Based Transport Mobile Air-Conditioning\n(MAC) Servicing NC II may be attained through demonstration of\ncompetence through project-type assessment covering all required units of\nthe qualification.\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.1.4 The following are qualified to apply for assessment and certification:\n\n4.1.4.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n\n4.1.4.2 Experienced Workers in MAC and RAC servicing for at least 2\nyears (wage employed or self-employed)\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through previous work or life experiences, education, and\ninformal training related to all the core competencies may apply for\nrecognition in the qualification through Portfolio Assessment in accordance\nwith the provision of TESDA Circular No. 59, Series of 2020.\n\n4.1.6 The existing National Certificate (NC) and Certificate of Competency\n(COC) of individuals in Transport RAC Servicing NC II will still be in effect\nuntil the said NC and COC will have expired. Individuals are advised to\ntake the assessment for this amended/updated TR on or before the\nexpiration of such certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in\nthe \"Operating Procedures on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n--- PDF PAGE 107 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n103\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment.\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment activities of candidates\nfor national certification.\n\n4.2.3 Accredited\nCompetency\nAssessor.\nOnly\ncompetency\nassessor\naccredited by TESDA is authorized to assess the competencies of\ncandidates for national certification.\n\n--- PDF PAGE 108 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n104\nCOMPETENCY MAP - HVAC/R Sector\nLand-based Transport Mobile Air-Conditioning (MAC) Servicing NC II\n\nCORE COMPETENCIES\n\nInstall window- type AC/\ndomestic refrigeration units\nService & maintain window-type\nAC/ domestic refrigeration units\nTroubleshoot window-type\nAC/domestic refrigeration\nsystems\nRecover & recycle refrigerant\nin window-type AC/domestic\nrefrigeration systems\nRepair & retrofit window-type\nAC/ domestic refrigeration\nsystems\nPerform Testing and\ncommissioning for window-\ntype AC/domestic refrigeration\nInstall package-type air-conditioning\nunit (PACU) / commercial\nrefrigeration equipment (CRE)\nInstall PACU/CRE electrical\nsystems\nInstall PACU/CRE piping\nsystems\nService & maintain PACU/CRE\nunits\nSurvey site for installation\nTroubleshoot PACU/CRE n systems\nRecover / recycle refrigerant\nin PACU/ CRE systems\nRepair & retrofit PACU/CRE\nsystems & its accessories\nPerform start-up, testing and\ncommissioning for PACU/CRE\nInstall transport air-\nconditioning\n& refrigeration units\nService & maintain transport AC\n& refrigeration units\nRecover & recycle\nrefrigerant in transport AC &\nrefrigeration systems\nTroubleshoot transport air-\nconditioning & refrigeration\nsystems\nPerform testing &\ncommissioning for transport AC\n& refrigeration\nInstall package-type air-\nconditioning unit (PACU)\nService & maintain PACU\nTroubleshoot and repair\nPACU\nPerform start-up, test and\ncommissioning for PACU\nService & maintain mobile\nair-conditioning (MAC) units\nInstall commercial refrigeration\nequipment (CRE)\nService & maintain CRE\nTroubleshoot and repair\nCRE\nPerform start-up, test and\ncommissioning for CRE\nTroubleshoot & repair mobile\nair-conditioning systems\nInstall commercial air-\nconditioning unit (CACU)\nService & maintain CACU\nTroubleshoot and repair\nCACU\nPerform start-up, testing and\ncommissioning for CACU\nPerform start-up, test and\ncommissioning for mobile\nair-conditioning systems\nRepair & retrofit transport ac &\nrefrigeration systems & its\naccessories\nInstall domestic refrigeration and\nair-conditioning units\nService & maintain domestic\nrefrigeration and air-\nconditioning units\nTroubleshoot & repair\ndomestic refrigeration and\nair-conditioning units\n\nCOMMON COMPETENCIES\n\nPrepare materials and\ntools\nObserve procedures,\nspecifications & manuals of instructions\nPerform mensurations &\ncalculations\nPerform basic benchwork\nPerform basic electrical\nworks\nMaintain tools and\nequipment\nPerform housekeeping and safety\npractices\nDocument work\naccomplished\nInterpret technical\ndrawings and plans\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace communication\nUtilize specialized communication\nskill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher order thinking\nprocesses and apply techniques\nin the workplace\nEvaluate higher order thinking\nskills and adjust problem solving\ntechniques\nEnhance self-management\nskills\nDevelop career and life\ndecisions\nWork in a diverse environment\nContribute to the practice of social\njustice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport Innovation\nContribute to workplace\ninnovation\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into work\nprocedures\nAccess and maintain\ninformation\nPresent relevant\ninformation\nUse information systematically\nManage and evaluate usage of\ninformation\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety\nand health policies and\nprocedures\nPractice occupational safety\nand health policies and\nprocedures\nEvaluate occupational safety and\nhealth work practices\nLead in improvement of\nOccupational Safety and Health\nProgram, Policies and Procedures\nManage implementation of\noccupational safety and health\nprograms in the workplace\nApply environmental work\nstandards\nExercise efficient and\neffective sustainable\npractices in the workplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial\nmindset in the workplace\nPractice entrepreneurial\nskills in the workplace\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\nDevelop and sustain a high-\nperforming enterprise\n\nANNEX A\n\n--- PDF PAGE 109 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n105\nGLOSSARY OF TERMS\n\n1) Accumulator – is used on systems that accommodate an orifice tube to meter\nrefrigerants into the evaporator. It is connected directly to the evaporator outlet and\nstores excess liquid refrigerant. The chief role of the accumulator is to isolate the\ncompressor from any damaging liquid refrigerant. Accumulators, like receiver-\ndriers, also remove debris and moisture from a system.\n\n2) Air-conditioning - is the cooling, heating, dehumidification, and filtration of the air\nlocated within the passenger compartment of a vehicle.\n\n3) Air-cooled Condenser – an equipment that condenses refrigerant vapor using air\nas the condensing medium\n\n4) Air Distribution – the process of distributing conditioned air into a confined space\n\n5) Charge - A specific amount of refrigerant or compressor oil by weight. The vehicle\nmanufacturer for individual A/C system applications specifies this.\n\n6) Charging - The process of placing a specified amount of refrigerant and\ncompressor oil into an A/C system.\n\n7) Check – to verify, inspect, or test an HVAC/R component for satisfactory condition\nwith the use of an instrument or a device\n\n8) Compressor - commonly referred to as the heart of the system, the compressor is\na belt driven pump that is fastened to the engine. It is responsible for compressing\nand transferring refrigerant gas.\n\n9) Condenser - is the area in which heat dissipation occurs. The condenser is\ndesigned to radiate heat. As hot compressed gasses are introduced into the top of\nthe condenser, they are cooled off. As the gas cools, it condenses and exits the\nbottom of the condenser as a high-pressure liquid.\n\n10) Dehydration – the process of removing moisture from a refrigeration system\n\n11) Electric Heat Defrost – use of electric resistance heating coils to melt ice or frost\nfrom evaporators\n\n12) Evacuation – removal of air/any gas and moisture from a refrigeration system\n\n13) Evaporator – is located in the interior of the vehicle. Its primary function is to\ntransfer heat contained in the passenger compartment air, into the refrigerant,\nwhich is circulated by the compressor, through the evaporator coil. During this\nprocess, the air is also filtered and dehumidified.\n\n14) Fan – a mechanical device for moving air\n\n15) Fan Coil Unit (FCU) – an air-conditioning component that consists of a fan\nmotor and an evaporator coil\n\n--- PDF PAGE 110 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n106\n16) Filter Drier – the component part used in air-conditioning or refrigeration\nsystem to filter and dehydrates refrigerant in the system\n\n17) Idler Pulley – a pulley used to maintain proper belt tension\n\n18) Inspect – determine the actual condition of HVAC/R component without the use of\ninstrument\n\n19) Interlocking – it is the action of interconnecting electric control wires to achieve a\nsequential action\n\n20) Leak Test – the procedure of determining/pin pointing leaks in a pressurized\nsystem\n\n21) Liquid Line Solenoid Valve – electrically operated valve that shuts-off the flow of\nthe refrigerant to the evaporator.\n\n22) Manifold Gauge Set – provides access to and monitors pressures within the\nsystem. Manifold gauge sets are available in different configurations and styles. 3-\nway or 4-way, liquid filled gauges, with or without a sight glass, 3 hoses or 4 hoses,\n1/4 inch or 3/8 inch manifold connections, etc.\n\n23) Metering Device – it is one of the major components in a refrigeration system\nused to regulate the flow of refrigerant into the evaporator\n\n24) Mobile Air-conditioning (MAC) unit – see Transport Air-conditioning unit.\n\n25) Pull-out – to remove from a place of installation\n\n26) Pressure Switches -- the systems use high- and low-pressure switches wired in\nseries to control the power circuit of the compressor clutch relay. If either pressure\nswitch opens, interrupting the circuit to the clutch relay, the operation of the\ncompressor will stop. When conditions return to normal, the switch will\nautomatically reset and the compressor will resume operating. The switches are\nnon--adjustable.\n\n27) Pressure Test – a procedure whereby pressure is applied to the piping system,\nthe purpose of which is to determine its soundness and stability\n\n28) Pump down – a process of using the compressor to pump and contain all the\nrefrigerant charge into the condenser and/or receiver\n\n29) Recovery/Recycle Machine (R134a) - Recovers and recycles R134a refrigerant\nthat is present within the air conditioning system.\n\n30) Refrigerant -- is a material that is used to move heat from the passenger\ncompartment to the outside air. It is a substance that gives up heat by condensing\nat high temperature and pressures and absorbs heat by evaporating at low\ntemperatures and pressures. The heat transfer properties exhibited when\nrefrigerant changes state is the foundation of the refrigerant cycle. Most Transport\nMAC systems use R134a.\n\n--- PDF PAGE 111 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n107\n\n31) Refrigerant Charging – the process of introducing into the system the proper\namount of refrigerant\n\n32) Refrigerant Cylinder -- Storage tank for R134a.\n\n33) Refrigerant Scale -- Accurately weighs the transfer of refrigerant into the air--\nconditioning system.\n\n34) Service Mechanic – worker who possess basic skills related to HVAC/R system\n\n35) Sight Glass/Liquid Line Moisture Indicator – indicates refrigerant quality and\ncharge\n\n36) Split-Type Air-conditioning unit – an air-conditioning unit that contains the\ncompressor, air or water-cooled condenser, metering device in one casing as\noutdoor unit and evaporator in another casing as indoor unit.\n\n37) Supervised Industry Learning – similar to on-the-job training – an approach in\ntraining designed to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations. Likewise, the term Supervised Industry Learning or SIL in\nreplacement of the term Supervised Industry Training (SIT) or On-the-Job Training\n(OJT) to provide more focus on the process of absorbing and retaining learner's\nenhanced competencies in a workplace and thus enable the learner to practice\nthose competencies in a variety of workplace situation.\n\n38) Thermostat Expansion Valve (TXV) – a refrigerant control valve connected\nbefore an evaporator that regulates flow of refrigerant. Operated by temperature\nand pressure, and reacts to the degree of gas superheat at the evaporator outlet\nthrough a feeler bulb\n\n39) Transport Air-conditioning Unit – refers to an air-conditioning unit driven directly\nfrom the turning axle of the vehicle when they are in motion, or by the vehicle\nengine itself, or by a separate gasoline/diesel engine and/or electric motor\nmounted on the same vehicle. It covers the land and marine/sea transports.\n\n40) Troubleshoot – the process of analyzing system defect or malfunction\n\n41) Vacuum – pressure lower than atmospheric pressure measured in inches of\nmercury. Complete vacuum is 29.92 in. mercury or at least 500 microns\n\n42) Vacuum Pump – Removes moisture and air from the air conditioning system in\norder to obtain required micron level.\n\n43) Water Treatment – the use of chemicals in water to prevent corrosion, formation\nof scales, algae growth and formation of slime\n\n44) Workmanlike-manner – quality of work within the accepted industry standard\n\n--- PDF PAGE 112 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n108\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n•\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL – FY 2019\n\nMR. MANUEL P. AZUCENA\nRACTAP\nMR. EDUARDO M. FERNANDEZ\nTUP – Manila / PSVARE/RACTAP\n\nMR. RAMON ELIAS F. ORTIZ\nRACTAP\n\nMR. AUGUSTO T. QUITCO\nKoppel Inc. - Philippines\n\nMR. KRIZ S. BERNARDINO\nKSB HVAC-R Services/RACTAP/PSVARE\nMR. LAMBERTO B. BALDOVINO\nILAC HVAC-R Services\n\n• THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING\nREGULATION\n\nLUZON\n\nMR. JOVYLON B. CANENCIA\nTechnological University of the Phils.-Manila\nMS. ANNE R. DELOS REYES\nFrigid Zone Auto Aircon Specialist Co.\n\nMR. SAMSON A. DEFEO\nSam Refrigeration\nMR. ANECENCIO “BOY” D. GASCON\nFrigid Zone Auto Aircon Specialist Co.\n\nMR. ELWILFREDO P. MONZON\nFrenzy Cool Car Aircon\nMR. LEONILO C. ROBLEDO\nFrigid Zone Auto Aircon Specialist Co.\n\nMR. EARL JOHN C. RONQUILLO\nFrigid Zone Auto Aircon Specialist Co.\nMR. BERNABE M. PEREZ, JR.\nCAN AIRE\n\nMR. REYNALDO Q. DALAG\nFrigid Zone Auto Aircon Specialist Co.\nMR. VALENTINO J. ANGELES\nTechnological University of the Phils.-Manila\nVISAYAS\n\nMR. CLIFFORD V. QUEVEDO\nHaiyanaire Marketing & Air-conditioning\nServices\nMR. GILBERTO ORTEGA\nGEF Incorporated\n\nMR. JAY RALD E. DINOLAN\nMoredone Ventures Inc.\nMR. FIEL B. PEREZ\nGEF Incorporated\n\nMR. ROSELL PEDRO JR.\nMoredone Ventures Inc.\nMS. ARLENE R. LANGBID\nComfort Aire\n\n--- PDF PAGE 113 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n109\nMR. DARWIN A. ASUFRA\nReal Air-conditioning Services\nMR. REMIGIO L. BUSTAMANTE\nCollege of Technological Sciences\n\nMR. ENRIQUE P. LOBIANO\nDaikin Air-conditioning Phils.\nMS. AMY T. LAURON\nLauron Refrigeration and Aircon\n\nMR. PEDRO A. CARZANO\nTESDA Region 7- RTC, Cebu City\nMR. ROY G. CANENCIA\nJKAE Ref and Aircon Allied Services\n\nMR. RENATO S. GARCIA\nGAB Appliance Service Center\nMR. PHILIP M. LIGAN\nCARESYSTEM\n\nMR. PETER JOHN T. ROSARIO\nCollege of Technological Sciences\nMR. VICTOR B. VILLAMOR, JR.\nTESDA Region 7- RTC, Cebu City\n\n• THE REFRIGERATION AND AIR-CONDITIONING TECHNICIANS FOR\nDEVELOPMENT OF THE PHILIPPINES (RACTAP)\n\n•\n• THE MEMBERS OF THE TESDA BOARD AND SECRETARIAT\n\n• THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT\n\n•\nQualifications and Standards Office (QSO)\n\n• Imelda B. Taganas\n-\nTESDA-QSO\n• Ma. Isabel G. Gamurot\n-\nTESDA-QSO-CSDD\n• Samuel E. Calado, Jr.\n-\nTESDA-QSO-CSDD\n• Raymundo C. Vergara\n-\nTESDA-QSO-CPSDD\n• Adrian Brian C. Sabanal\n-\nTESDA-QSO-CPSDD\n\n--- PDF PAGE 114 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n110\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Land-based Mobile Air-conditioning (MAC) Servicing NC II\nQualification Code: HVCMAC221\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nTransport RAC Servicing\nNC II\n\nNot Applicable\nTB No. 2005-04/\nMarch 18, 2005\nNot Applicable\n01\nDocument Amended –\nLand-based Mobile Air-\nconditioning (MAC)\nServicing NC II\n\nTB No. 2005-04/\nMarch 18, 2005\nTB No. 2021-24/\nJune 8, 2021\nTESDA Circular\nNo. 084 s. 2021\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 115 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n111\n\nTraining Regulation are available in both printed and electronic copies\nfor more information, please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTele Fax No.: 8818-7728\nor visit our website: www.tesda.gov.ph"
