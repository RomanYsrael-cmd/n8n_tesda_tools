ndevelopment of team work\nplans based on an\nunderstanding of team’s\nrole and objectives\n3.1. Communication\nprocess\n3.2. Workplace\ncommunication\nprotocol\n3.3. Team planning\nand decision\nmaking\n3.4. Team thinking\n3.5. Team roles\n3.6. Process of team\ndevelopment\n3.7. Workplace\ncontext\n3.1. Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n3.2. Interacting\neffectively with\nothers\n3.3. Deciding as an\nindividual and as a\ngroup using group\nthink strategies and\ntechniques\n3.4. Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 11 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n7\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\nMay include but not limited to:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include but not limited to:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include but not limited to:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 12 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n8\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.2. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n3.3. Socio-drama and socio-metric methods\n3.4. Sensitivity techniques\n3.5. Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 13 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n9\nUNIT OF COMPETENCY: SOLVE/ADDRESS GENERAL WORKPLACE PROBLEMS\n\nUNIT CODE :"
