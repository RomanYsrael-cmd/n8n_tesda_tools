owing \nworkplace \ncommunication \nprotocol  \n3. Implement \ncost-effective \noperations \n3.1. Preservation and \noptimization of workplace \nresources is implemented \nin accordance with \nenterprise policy \n3.2. Judicious use of \nworkplace tools, \nequipment and materials \nare observed according to \nmanual and work \nrequirements. \n3.3. Constructive contributions \nto office operations are \nmade according to \nenterprise requirements. \n3.4. Ability to work within one’s \nallotted time and finances \nis sustained. \n3.1. Optimization of workplace \nresources \n3.2. 5S procedures and \nconcepts \n3.3. Criteria for cost-\neffectiveness \n3.4. Workplace productivity \n3.5. Impact of entrepreneurial \nmindset to workplace \nproductivity \n3.6. Ways in fostering \nentrepreneurial attitudes: \n3.6.1. Quality-\nconsciousness \n3.6.2. Safety-\nconsciousness \n3.1. Implementing \npreservation and \noptimizing \nworkplace \nresources \n3.2. Observing \njudicious use of \nworkplace tools, \nequipment and \nmaterials \n3.3. Making \nconstructive \ncontributions to \noffice operations \n3.4. Sustaining ability \nto work within \nallotted time and \nfinances\n\n--- PDF PAGE 31 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221)       Promulgated: June 8, 2021 \n \n27\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Good practices \nMay include: \n1.1  Economy in use of resources \n1.2  Documentation of quality practices  \n \n2. Resources utilization \nMay include: \n2.1  Consumption/ use of consumables \n2.2  Use/Maintenance of assigned equipment and \nfurniture \n2.3  Optimum use of allotted /available time \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency  \nAssessment requires evidence that the candidate: \n1.1. Demonstrated ability to identify and sustain cost-effective \nactivities in the workplace  \n1.2. Demonstrated ability to practice entrepreneurial \nknowledge, skills and attitudes in the workplace. \n \n2. Resource \nImplications \nThe