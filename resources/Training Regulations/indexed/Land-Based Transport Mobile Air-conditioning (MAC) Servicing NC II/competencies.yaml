        "source_text": "HVC7315201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed to\nwork safely in the workplace including sorting, cleaning and\ndispensing materials, tools and equipment, identifying and\nminimizing hazards, responding and recording accidents and\nfollowing basic security.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Sort\nmaterials,\ntools and\nequipment\n\n1.1. Materials, tools and equipment\nare classified according to its\nkinds\n1.2. Appropriate areas for materials,\ntools and equipment are\ndesignated\n\n1.1. Classification of tools,\nequipment and\nmaterials\n1.2. Selection of\nappropriate areas for\nstoring materials, tools\nand equipment\n1.3. Sorting procedures\nand considerations\n1.4. 5S principles\n1.1. Applying 5S\n(sorting)\n1.2. Identifying tools\nand materials\n\n2. Clean\nworkplace\narea,\nmaterials,\ntools and\nequipment\n\n2.1. Cleaning materials are\nidentified and used as per\nprocedure\n2.2. Workplace areas, materials,\ntools and equipment are\ncleaned as per company\npractices\n2.3. Workplace are in safe state in\naccordance with safety\nregulations/company practices\n2.1. Cleaning materials,\ntypes and\napplications.\n2.2. Procedures in\ncleaning workplace\narea, tools and\nequipment.\n2.3. Consideration of a\nsafe workplace area,\ntools and equipment\n2.1. Applying 5S\n(cleaning)\n3. Systematize\ndispensing\nand\nretrieval of\nmaterials,\ntools and\nequipment\n3.1. Systems for requesting,\nborrowing and returning of\nmaterials, tools and equipment\nis in-place and implemented\n3.2. Forms used are completely\nfilled-up and filed\n3.3. Borrowed tools, and equipment\nare returned to designated area\n3.4. Consumable materials are\nrequested in exact quantity\n3.1. Procedures in\ndispensing and\nretrieval of materials;\ntools, and equipment\n3.2. Things to be\nconsidered in\nreturning the\nborrowed tools and\nequipment.\n3.1. Applying 5S\n(systematize)\n3.2. documentation\nskills\n4. Identify and\nminimize/\neliminate\nhazards\n\n4.1. Hazards in the work area are\nrecognized and reported to\ndesignated personnel and\nappropriate control actions are\ntaken\n4.2. Workplace policies and\nprocedures for controlling risks\nare established and followed\naccurately\n4.3. Workplace procedures for\ndealing with emergencies are\nfollowed whenever necessary\n4.1. Composition of safety\ncommittee\n4.2. Policies and\nprocedures in\ncontrolling risk\n4.3. Safety signs and first\naid\n4.4. Safety signs and\nhazards warning\npreparation\n4.5. Equipment and safety\ndevices\n4.1. Hazard\nidentification\nskills\n4.2. Practice safety\nskills\n\n--- PDF PAGE 56 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n52\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nwithin the scope of\nresponsibilities and\ncompetencies\n4.4. Safety signs and hazard\nwarnings are displayed and\nobserved at all times in line with\nworkplace health and safety\nregulations\n4.5. Equipment and safety\ndevices/PPE are used/handled\naccording to company or\nmanufacturer's procedures and\nguidelines\n4.6. Work areas are kept clean, free\nfrom obstacles and emergency\nexits are know and kept clear at\nall times\n4.7. Safe manual handling/fighting\ntechniques and safe equipment\noperation techniques are\nemployed at all times\n4.6. Safe handling\ntechnique in using\nequipment and safe\ndevices.\n4.7. Identification of\nSafety Signs and\nSymbols\n\n5. Respond\nand record\naccidents\n5.1. Workplace accidents are\nidentified\n5.2. Workplace emergency first-aid\nprocedures/ treatment are\nfollowed/carried out correctly in\naccordance with\nstandards/regulations and\nenterprise procedures/policies\n5.3. Medical assistance/rescue is\ncoordinated with concerned\npersonnel in line with\norganizational policies\n5.4. Accident/incident records\nmaintained in accordance with\nstandard operating procedures\n5.1. Types of accidents\n5.2. Procedures in\napplying first aid/\ntreatment\n5.3. First aid supplies\n5.4. Steps in responding\nto and recording\naccidents\n5.1. First aid\napplication skills\n5.2. Coordination\nskills\n5.3. Documentation\nskills\n6. Follow basic\nsecurity\n6.1. Security policies/ procedures\nare followed according to\nenterprise practices and\nappropriate legislation\n6.2. Security related events are\nrecorded/reported on the\nrelevant forms\n6.3. Staff are advised of enterprise\nsecurity procedures and correct\nmethods of implementation\n\n6.1. Basic security\nprocedures\n6.2. Security signs and\nsymbols\n6.3. Loss control\nmanagement\n6.3.1. Hazards\n6.3.2. Safety signs\n\n6.1. Coordination\nskills\n6.2. Reporting skills\n6.3. Documentation\nskills\n6.4. Practice safety\nskills\n\n--- PDF PAGE 57 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n53\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nHazards that may be present in the workplace include\nbut not limited to:\n1.1. Flammable materials\n1.2. Running machinery/equipment\n1.3. Toxic substances\n1.4. Debris\n1.5. Open flames\n1.6. Loose objects/fixtures\n1.7. Chemicals\n1.8. Electrical faults\n1.9. Hot metals\n2. Emergencies\nEmergencies may include but not limited to:\n2.1. Fire\n2.2. Explosion\n2.3. Spills\n2.4. Falls\n2.5. Electrocution\n2.6. Injuries caused by falling objects\n2.7. Injuries caused by sharp objects\n2.8. Injuries caused by wrong usage of tools\n3. Safety signs, symbols and\nhazard warnings\nSafety signs and symbols include but not limited to:\n3.1. 3.1 Industry recognized hazard warning signs and\nsafety symbols\n-\nDanger-High Voltage\n-\nUnauthorized Persons Keep Out\n-\nNo Smoking\n-\nPoisonous Gases\n-\nCaution - Men working on line wires\n3.2. Internationally recognized hazard warning signs and\nsafety symbols\n4. Personal 