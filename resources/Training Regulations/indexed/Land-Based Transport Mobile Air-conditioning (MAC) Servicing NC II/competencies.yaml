        "source_text": "HVC713202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in preparing\nmaterials, tools and equipment, lay-outing dimensions and\nperforming basic benchwork based on the required performance\nstandards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Prepare\nmaterials,\ntools and\nequipment\n\n1.1. Work plan is interpreted to\ndetermine job requirements\n1.2. Materials, tools and\nequipment are identified and\nprepared according to job\nrequirements\n1.3. Materials are checked\naccording to the required\nspecifications\n1.4. Tools and equipment\nconditions are checked\nfollowing the standard\noperating procedures (SOPs)\n1.1. Communication\nskills\n1.2. Materials, tools\nand equipment;\nuses and\nspecifications\n1.3. Material\nestimation\n1.4. Mensuration\n1.1. Interpretation\nskills\n1.2. Handling of tools\nand materials\n2. Lay-out and\nmark\ndimensions/f\neatures on\nworkplace\n2.1. Metallic and non-metallic\nmaterials are selected\naccording to the requirements\nspecified in the blueprint\n2.2. Dimensions/features are laid-\nout/marked according to job\nspecifications/blueprint and\nwithin the required tolerance\n2.3. Dimensions are checked\nagainst the actual work plan\n2.1. Metallic and non-\nmetallic materials\n2.2. Measuring tools;\nfunctions and use\n2.3. Trade\nmathematics\n2.4. Mensuration\n2.5. Calculation\n2.6. Conversion\n2.7. Plan\nspecifications\n2.8. Quality assurance\n2.1. Measuring and\nlay-outing\n2.2. Blueprint reading\n2.3. Communication\nskills\n3. Perform\nrequired\nbasic metal\nworks\n3.1. Work instructions are\nfollowed to ensure work\nsafety\n3.2. Basic metal works are\nperformed applying knowledge\non safety procedures and\naccording to job requirements\n3.3. Workpieces are clamped in\nworkholding device to avoid\ndamage and accidents\n3.4. Work pieces are cut, chipped\nor filed according to required\nmeasurements, tolerance\nspecified in the blueprint and\nfree from burrs and sharp\nedges\n3.5. Drilling is performed according\nto recommended sequence\n3.1. Tools and\nequipment: use\nand specifications\n3.2. Grinding, cutting,\ndrilling, filing\ntechniques\n3.3. Basic welding\nprinciples and\napplication\n3.4. Applied\noccupational\nhealth and safety\n(OH&S)\n3.1. Using tools and\nequipment\n3.2. Basic metal\nworks skills\no Grinding\no Cutting\no Drilling\no Filing\no Threading\no Reaming\no Welding\n3.3. Practice safety\nskills\n\n--- PDF PAGE 45 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n41\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nand specifications\n3.6. Proper usage of materials,\ntools and equipment is\nobserved\n3.7. Appropriate PPE and safety\nprocedures are applied\n3.8. Worksite is cleaned and\ncleared of all debris and left in\nsafe state in accordance with\nOHS regulations\n\n--- PDF PAGE 46 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work plan\n1.1 Job requirements\n1.2 Schedule of work\n\n2. Materials\n\n2.1 Steel brackets\n2.2 Grinding disc\n2.3 Drill bit\n2.4 Flat/angle bars\n2.5 Fastening screws\n2.6 Masonry\n\n3. Tools and equipment\n\n3.1 Portable grinder\n3.2 Hacksaw\n3.3 File\n3.4 Markers\n3.5 Screw drivers\n3.6 Ballpein hammer\n3.7 L-square/steel square\n3.8 Steel rule\n3.9 Measuring tools\n3.10 PPE\n3.11 Portable electric drill\n3.12 Bench wire\n3.13 Tri-square\n3.14 Flaring tool\n3.15 Swaging tool\n3.16 Reamer\n4. Metallic materials\n4.1 Mild steel plate\n4.2 Flat bar\n4.3 Square bar\n4.4 Angle bar\n4.5 Round bar\n4.6 G.I. sheet\n4.7 B.I. sheet\n4.8 Beam\n\n5. Non-metallic\nmaterials\n5.1 PVC\n5.2 Rubber\n5.3 Wood\n5.4 Fiber glass\n5.5 Plastic\n5.6 Ceramics\n\n6. Dimensions\n\n6.1 Measurements\n6.2 Tolerances\n7. Work instructions\n\n7.1 Work plan\n7.2 Blueprint\n7.3 Manufacturer’s specifications\n8. Personal Protective\nEquipment (PPE)\n\n8.1 Safety shoes\n8.2 Gloves\n8.3 Appropriate Goggles\n8.4 Working clothes/coverall/apron\n8.5 Respiratory mask\n8.6 Face mask\n 9. Basic metal works\n9.1 Sheet metal\n9.2 Cutting\n9.3 Filing\n9.4 Drilling\n9.5 Arc welding\n9.6 Gas welding\n9.7 Flaring\n9.8 Swaging\n10. Workholding device 10.1 Machine vise\n10.2 Pliers\n10.3 Vise grip\n11. Manual\n11.1 Procedure’s manual\n11.2 Instructional manual\n\n--- PDF PAGE 47 ---\nTR–Land-based Transport MAC Servicing NC II (HVCMAC221) Promulgated: June 8, 2021\n\n43\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Interpreted work plan to determine job requirements\n1.2 Identified and prepared supplies, materials, tools and\nequipment in accordance with job requirements\n1.3 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.4 Laid-out and checked dimensions in accordance with job\nrequirements and within the tolerances\n1.5 Followed work instructions to ensure safety\n1.6 Performed benchworks in accordance with job\nrequirements\n1.7 Cleaned worksite and left in safe state in accordance with\nOHSA regulations\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Work plan\n2.3 Materials, tools and equipment relevant to the proposed\nactivity/task\n3. Methods of\nassessment\nCompetency should be assessed through:\n3.1 Actual demonstration\n3.2 Direct observation\n3.3 Written/questioning related to required knowledge\n4. Context of\nassessment\n4.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n4.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 48 ---\nTR–Land-based Transp