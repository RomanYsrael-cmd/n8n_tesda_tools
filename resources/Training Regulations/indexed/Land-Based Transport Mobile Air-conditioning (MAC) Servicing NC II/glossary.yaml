    {
      "term": "Accumulator",
      "definition": "is used on systems that accommodate an orifice tube to meter refrigerants into the evaporator. It is connected directly to the evaporator outlet and stores excess liquid refrigerant. The chief role of the accumulator is to isolate the compressor from any damaging liquid refrigerant. Accumulators, like receiver- driers, also remove debris and moisture from a system."
    },
    {
      "term": "Air-conditioning",
      "definition": "is the cooling, heating, dehumidification, and filtration of the air located within the passenger compartment of a vehicle."
    },
    {
      "term": "Air-cooled Condenser",
      "definition": "an equipment that condenses refrigerant vapor using air as the condensing medium"
    },
    {
      "term": "Air Distribution",
      "definition": "the process of distributing conditioned air into a confined space"
    },
    {
      "term": "Charge",
      "definition": "A specific amount of refrigerant or compressor oil by weight. The vehicle manufacturer for individual A/C system applications specifies this."
    },
    {
