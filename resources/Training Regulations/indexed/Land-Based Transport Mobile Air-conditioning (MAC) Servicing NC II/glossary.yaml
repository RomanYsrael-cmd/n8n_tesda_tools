    {
      "term": "Check",
      "definition": "to verify, inspect, or test an HVAC/R component for satisfactory condition with the use of an instrument or a device"
    },
    {
      "term": "Compressor",
      "definition": "commonly referred to as the heart of the system, the compressor is a belt driven pump that is fastened to the engine. It is responsible for compressing and transferring refrigerant gas."
    },
    {
      "term": "Condenser",
      "definition": "is the area in which heat dissipation occurs. The condenser is designed to radiate heat. As hot compressed gasses are introduced into the top of the condenser, they are cooled off. As the gas cools, it condenses and exits the bottom of the condenser as a high-pressure liquid."
    },
    {
      "term": "Dehydration",
      "definition": "the process of removing moisture from a refrigeration system"
    },
    {
