  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY-\nEQUIPMENT OPERATION (Wheel Loader) NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION\nNC Level: II\n\n WHEEL LOADER\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individuals with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation (Wheel Loader).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 70 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n69 / 85\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 71 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n70 / 85\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 72 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n71 / 85\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 73 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n72 / 85\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC II\n\n WHEEL LOADER\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of wheel loader in accordance with industry standards. It\ncovers the core competencies of: perform pre- and post operation procedure,\nperform productive operation, and perform basic preventive-maintenance\nservicing on a given wheel loader.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost- operation\nprocedure for wheel\nLoader\n1.1 Familiarizes wheel\n loader operation\n manual, job site and\n work condition, and\n pre- and post-\n operation checklist.\n1.2 Explain the usage of\n wheel loader\n controls, instruments,\n and indicators.\n1.3 Perform wheel loader\n walk-around and\n “BLOWAF” inspection,\n engine not running.\n1.4 Perform walk-around\n check while engine is\n running.\n1.5 Demonstrate risk\n control/safety\n procedure.\n1.6 Perform wheel loader\n post operation\nDiscussion\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\n• Written test\n\n--- PDF PAGE 74 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n73 / 85\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for Wheel\nLoader\n2.1 Follow wheel loader\n operating procedure,\n techniques, safety,\n and operation\n regulations and rules\n and signals.\n2.2 Identify types of\n materials, site/terrain\n layout and obstacle.\n2.3 Identify wheel loader\n basis components,\n system and function.\n2.4 Interpret gauges,\n controls and alert\n indicator reading per\n manual instruction.\n2.5 Perform the following\n wheel loader\n operation:\n 2.5.1 Loading to\n trailer\n (low and high)\n 2.5.2 Unloading\n from trailer\n 2.5.3 Travel wheel\n loader\n 2.5.4 Loading and\n carrying of\n materials\n 2.5.5 Loading to\n dump truck\n 2.5.6 Stockpiling\n 2.5.7 Secondary\n operation\n\n2.6 Apply safety, eye and\n Hand coordination.\nDiscussion\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\n• Written test\n\n--- PDF PAGE 75 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n74 / 85\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n3. Perform preventive\nmaintenance\nservicing for Wheel\nLoader\n3.1 Pinpoint wheel loader\n components and parts\n that needs\n maintenance\n3.2 Test, adjust,\n recondition, and\n replace parts that\n requires maintenance\n3.3 Fill up and submit a\n well-filled up\n maintenance\n worksheet to person\n in authority.\n3.4 Identify lubricants,\n fluids, and solvent to\n used per\n manufacturer\n standards\nDiscussion\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\n\n--- PDF PAGE 76 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n75 / 85\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\n\n--- PDF PAGE 77 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n76 / 85\n\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computations.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n--- PDF PAGE 78 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n77 / 85\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of the wheel loader.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\nOpen end wrench 18\npcs. per set metric size\n1 unit\nWheel Loader\n5 pcs.\nWheel Loader\nair cleaner\n2 sets\nBox wrench, 18 pcs.\nPre set, metric size\n1 unit\nDump truck\n4 gals. Diesel engine oil\n2 sets\nSocket wrench, 18 pcs.\nPer set, metric size\n1 unit\nLow- or high-bed\nTrailer\n10 pcs Battery\nlug/terminal\n2 unit\nTire pressure gauge\n1 gal.\nBrake fluid\n2 unit\nBelt tension gauge\n\n10 ltrs. Distilled water\n2 unit\nCooling system\nanalyzer\n\n5 gals. Gear oil\n2 pcs.\nBall pen hammer\n3 gals.\nHydraulic fluid\n2 sets\nStandard screw driver\nAssorted size, six pcs,\nper set.\n\n1 gal.\nMulti purpose\ngrease\n2 sets\nPhilip screw driver,\nAssorted size, six pcs.\nPer set.\n\n10 btls.\nCoolant\nadditives -\n350ml.\n2 pcs.\nVice grip\n\n40 pcs.\nWheel loader\nfuse, assorted\namperes rating\n2 pcs.\nLong nose pliers\n3 can\nPenetrating oil\n2 pcs.\nElectrician Pliers\n2 pcs.\nSide cutting pliers\n2 unit\nGrease gun\nNOTE: Implementation of the training program can be made possible through a MOA between\nthe training school and industry. It is so because of the high cost of equipment that the\nschool can’t afford to attain.\n\n3.5\nTRAINING FACILITIES\n\n--- PDF PAGE 79 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n78 / 85\n\nThe wheel loader operation workshop must be made of reinforced concrete\nor steel structure. The size must be suited on the requirements of the\ncompetencies. The class size of 25 students/trainees is reserved for the lecture\nroom and the practical demonstration area for carrying out minor wheel loader\nparts maintenance. Most of the learning activities are performed individually in\nthe students/trainees work area.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL\nAREA IN\nSQ.\nMETERS\n• Student/Trainee’s\nWorking Space\n 2.0 x 2.0 m.\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n• Learning Resource\nCenter\n4.00 x 6.00\n24.00\n24.0\n•\n\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n500 sq. m. (MOA/Rental)\n\n*This area can also be used in other Heavy equipment operation courses.\n **Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 80 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n79 / 85\n\n 3.6 TRAINERS’ QUALIFICATION\nHEAVY-EQUIPMENT OPERATION (Wheel Loader)\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Heavy-Equipment Operation (Wheel Loader)\nNC-II or equivalent qualification\n• Must have undergone training on Training Methodology II (TM II)\nor equivalent in training/experience\n• Must be computer-literate\n• Must be physically and mentally fit\n• Must have at least 5 years job/industry experience*\n• Must be a civil-service eligible or holder of appropriate\nprofessional license issued by the Professional Regulatory\nCommission (for government positions)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 81 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n80 / 85"
