    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION\nNC Level: II\n\n WHEEL LOADER\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individuals with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation (Wheel Loader).\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 70 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n69 / 85\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 71 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n70 / 85\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 72 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n71 / 85\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 73 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n72 / 85\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC II\n\n WHEEL LOADER\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of wheel loader in accordance with industry standards. It\ncovers the core competencies of: perform pre- and post operation procedure,\nperform productive operation, and perform basic preventive-maintenance\nservicing on a given wheel loader.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost- operation\nprocedure for wheel\nLoader\n1.1 Familiarizes wheel\n loader operation\n manual, job site and\n work condition, and\n pre- and post-\n operation checklist.\n1.2 Explain the usage of\n wheel loader\n controls, instruments,\n and indicators.\n1.3 Perform wheel loader\n walk-around and\n “BLOWAF” inspection,\n engine not running.\n1.4 Perform walk-around\n check while engine is\n running.\n1.5 Demonstrate risk\n control/safety\n procedure.\n1.6 Perform wheel loader\n post operation\nDiscussion\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\n• Written test\n\n--- PDF PAGE 74 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n73 / 85\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for Wheel\nLoader\n2.1 Follow wheel loader\n operating procedure,\n techniques, safety,\n and operation\n regulations and rules\n and signals.\n2.2 Identify types of\n materials, site/terrain\n layout and obstacle.\n2.3 Identify wheel loader\n basis components,\n system and function.\n2.4 Interpret gauges,\n controls and alert\n indicator reading per\n manual instruction.\n2.5 Perform the following\n wheel loader\n operation:\n 2.5.1 Loading to\n trailer\n (low and high)\n 2.5.2 Unloading\n from trailer\n 2.5.3 Travel wheel\n loader\n 2.5.4 Loading and\n carrying of\n materials\n 2.5.5 Loading to\n dump truck\n 2.5.6 Stockpiling\n 2.5.7 Secondary\n operation\n\n2.6 Apply safety, eye and\n Hand coordination.\nDiscussion\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\n• Written test\n\n--- PDF PAGE 75 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n74 / 85\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n3. Perform preventive\nmaintenance\nservicing for Wheel\nLoader\n3.1 Pinpoint wheel loader\n components and parts\n that needs\n maintenance\n3.2 Test, adjust,\n recondition, and\n replace parts that\n requires maintenance\n3.3 Fill up and submit a\n well-filled up\n maintenance\n worksheet to person\n in authority.\n3.4 Identify lubricants,\n fluids, and solvent to\n used per\n manufacturer\n standards\nDiscussion\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\n\n--- PDF PAGE 76 ---\nTR HEAVY-EQUIPMENT OPERATION (Wheel Loader) NC II Promulgated December 2004/July 2007\n75 / 85"
