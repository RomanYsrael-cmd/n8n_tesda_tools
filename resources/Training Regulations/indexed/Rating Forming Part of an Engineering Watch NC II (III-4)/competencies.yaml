          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. identified and prioritized the need for medical first aid in\nlife-threatening medical emergencies\n1.2. administered first aid on board a vessel\n1.3. communicated effectively with others during medical\nemergencies and health care\n\n2. Required Knowledge\n2.1. Relevant sections of maritime regulations\n2.2. Emergencies, injuries and medical problems that may\noccur on board a vessel and appropriate action,\ntreatments and solutions\n2.3. Relevant OH&S and health legislation and policies\n2.4. Duties and responsibilities of the designated first aid\nofficer on board a vessel\n2.5. First aid procedures\n2.6. Shipboard procedures for:\n2.6.1. conducting an initial patient first aid assessment\n2.6.2. managing injuries\n2.6.3. managing medical emergencies\n2.6.4. carrying out resuscitation techniques\n2.7. Techniques for care of wounds\n2.8. Ways in which disease can spread on board a vessel\nand ways of preventing the spread\n2.9. Legal issues related to the administration of drugs and\nmedicines on board a vessel\n2.10. Knowledge of body structures and functions relevant to\npossible injury, illnesses and disease that may be\nencountered on board a vessel\n2.11. Maritime communication techniques related to health\ncare and receiving radio medical advice from shore-\nbased advisers\n2.12. Marine publications containing information on first aid\nand medical treatment on board a vessel\n\n3. Required Skills\n3.1. Providing first-aid on board a vessel\n3.2. Identifying and problems and emergencies and taking\nappropriate courses of action\n3.3. Applying aseptic and other precautionary techniques\nwhen carrying out first-aid procedures on board a\nvessel\n\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1. Demonstration and questioning of related\nunderpinning knowledge\n5.2. Written examination\n5.3. Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n27\nUNIT OF COMPETENCY\n:\nCOMPLY WITH EMERGENCY PROCEDURES\n\nUNIT CODE\n:",
