        "source_text": "MTM816313\n\nUNIT DESCRIPTOR\n:\nThis unit involves the knowledge, skills and attitude to\napply emergency procedure and operate emergency\nrelated to the engine-room watchkeeping.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1. Respond to\nemergencies\n1.1\nEmergencies are correctly recognized and\nidentified.\n1.2\nResponse to an emergency situation is established\nfollowing the vessel’s emergency response\nprocedures.\n1.3\nInitial action is undertaken on discovery of an actual\nor potential emergency in accordance with\nestablished vessel procedures.\n1.4\nInformation given on raising alarm is prompt,\naccurate, complete and clear.\n\n2. Follow established\nemergency procedures\n2.1\nVessel’s contingency plans for emergency\nresponse are known and are implemented in real\nand simulated emergency situations.\n2.2\nEscape routes and internal/external communication\nand alarm systems are correctly used in real and\nsimulated emergency situations in accordance with\nregulatory requirements and established procedures.\n2.3\nEmergency communications and alarm signals and\nsystems are understood and required action\nimplemented in accordance with emergency\nprocedures and regulatory requirements.\n\n3. Follow procedures for\nthe operation of\nemergency equipment\n3.1\nLocation of emergency equipment is identified.\n3.2\nLocation of the posted operating procedures for the\nspecific emergency equipment is identified.\n3.3\nProcedures for the use of various emergency\nequipment are followed in accordance with\nregulatory requirements, manufacturer’s instruction\nand company procedures.\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergencies\nMay include:\n1.1\nCollision with another vessel\n1.2\nExplosion on board vessel\n1.3\nImpairment of integrity of hull and ingress of water\n1.4\nLoss of steering control\n1.5\nLoss of motive power\n1.6\nFoundering\n1.7\nGrounding\n1.8\nBeaching a vessel\n1.9\nPerson overboard\n1.10 Rescue and evacuation of injured personnel\n1.11 Oil pollution\n1.12 Piracy/armed robbery/stowaways\n\n2. Contingency plans\nMay include:\n2.1\nContingency plan in controlling fire or explosion\nemergency\n2.2\nUse of appropriate firefighting equipment and\ntechniques such as various types of fire\nextinguishers, fire blankets, fire hoses and nozzles\nand foam applicators\n2.3\nActivation of fixed fire fighting sprinklers and\nsystems\n2.4\nRemoval of fuel or heat source\n2.5\nBoundary cooling techniques\n2.6\nContingency Plan in controlling flooding emergency\n2.7\nUse of softwood wedges and plugs to reduce water\ningress\n2.8\nErection and application of vertical shoring\n2.9\nConstruction and fitting of a leak-stopping mat\n2.10 Temporary repair of a ruptured pressurized pipe\n2.11 Operation of a portable salvage pump\n2.12 SOPEP and its equipment\n\n3. Emergency equipment\nin the engine room\nwatchkeeping\nMay include:\n3.1\nEmergency generator\n3.2\nEmergency fire pump\n3.3\nEmergency bilge suction\n3.4\nEmergency steering\n3.5\nEmergency compressor\n3.6\nQuick closing valves\n3.7\nGeneral service pump (Diesel driven)\n3.8\nFire dampers\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n49\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nundertook appropriate action in the event of\ndiscovering a shipboard emergency\n1.2\nfollowed vessel’s contingency plans for emergency\nresponse\n1.3\nfollowed procedures for the use of various emergency\nequipment in the engine room watchkeeping\n1.4\nidentified typical problems that may occur during a\nshipboard emergency and take appropriate action\n1.5\ncommunicated clearly and effectively with others\nduring shipboard emergencies\n2. Required Knowledge 2.1\nRelevant maritime regulations dealing with emergency\nequipment and procedures\n2.2\nNavigational emergencies for vessels and appropriate\naction and solutions\n2.3\nIndications of various types of emergency situations\nand the action to be followed when various types of\nactual or potential emergency situations are identified\n2.4\nEmergency alarm signals and systems in use on\nvessels and procedures to be followed when an\nemergency alarm is raised\n2.5\nEscape routes and internal and external\ncommunications systems and alarms on board a\nvessel\n2.6\nGeneral principles of damage and control and the\nmanner in which watertight integrity of hull is\nmaintained on a vessel, including the importance of\npreparation, control and repair\n2.7\nWays of controlling damage during a flooding\nemergency, including the use of various shipboard\nitems that can be used for damage control purposes\nsuch as mattresses, canvas and clothing\n2.8\nMaritime communication techniques used during\nnavigational emergencies\n3. Required Skills\n3.1\nTaking initial action during real and simulated\nemergency situation\n3.2\nImplementing emergency during a real and simulated\nemergency situations\n3.3\nIdentifying and evaluating problems that may occur\nduring an engine room emergency and determining\nappropriate course of action\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nwork place location\n4.2\ntools and equipment required to respond to\nemergencies in engine room watchkeeping\n4.3\nmaterial relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through :\n5.1\nPractical demonstration and questioning of related\nunderpinning knowledge\n5.2\nWritten examination\n5.3\nPortfolio (e.g. approved in-service and training ship\nexperiences, etc.)\n6. Context of\nAssessment\n6.1 Competency may be assessed a simulated workplace\nsetting or accredited assessment center\n\n--- PDF PAGE 54 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n50"
      }
    ]
