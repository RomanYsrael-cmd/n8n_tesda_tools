  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required of Rating Forming Part of an Engineering Watch NC II (STCW\nRegulation III/4).\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace information\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information\nand ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and\nconcisely\n\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting\npurpose and established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n\n3. Complete relevant work\nrelated documents\n3.1\nRange of forms relating to conditions of employment\nare completed accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents\nare identified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n4\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the formal\nor informal communication\n\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n\n3. Underpinning Skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace Requirements\n\n4. Resource Implications\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n\n5. Methods of\nAssessment\n5.1\nDirect Observation\n5.2\nOral interview and written test\n\n6. Context of Assessment 6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 9 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n5\nUNIT OF COMPETENCY\n:\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role and\nscope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to\nteam are identified\n\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and objectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3\nObserved protocols in reporting using standard\noperating procedures\n3.4\nContribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 10 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise\nor specific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of information\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n\n3. Underpinning Skills\n3.1\nCommunicate appropriately, consistent with the\nculture of the workplace\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or tasks\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to\nthe work activities of the group\n5.2\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3\nCase studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships are maintained in\nthe course of managing oneself based on\nperformance evaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated\nas proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 13 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and\nworkshops\n\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n10\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in\nthe course of managing oneself based on\nperformance evaluation\n1.3\nCompleted trainings and career opportunities which\nare based on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n\n2. Underpinning\nKnowledge\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender\nsensitivity\n2.5\nPersonal hygiene practices\n\n3. Underpinning Skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n\n6. Context of Assessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 15 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n11\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE : 500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2\nHazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3\nContingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization\nprocedures\n\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\nOHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3\nPersonal protective equipment (PPE) is correctly\nused in accordance with organization OHS procedures\nand practices\n3.4\nAppropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4\nErgonomics\n•\nPsychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n•\nPhysiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal records\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n13\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3. Underpinning Skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n\n4. Resource Implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nSURVIVE AT SEA IN THE EVENT OF SHIP\nABANDONMENT\n\nUNIT CODE\n:\nMTM834208\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nsurviving at sea in the event of ship abandonment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Respond to the\nindicated emergency\n\n1.1\nMuster signal is identified and appropriate action to\nrespond to the identified emergency is taken based\non established procedures.\n1.2\nTiming and sequence of individual actions are\npracticed based on prevailing circumstances and\nconditions and potential dangers and threats to\nsurvival are minimized.\n1.3\nLife-saving appliances are used in accordance with\nstandards operating procedures.\n1.4\nRecommended swimming techniques are practiced\nwith or without wearing a lifejacket.\n\n2. Board a survival craft\n2.1\nSurvival craft is boarded and dangers to other\nsurvivors are avoided based on recommended\nmethod.\n2.2\nInitial actions after leaving the ship are taken to\nminimize threats to survival.\n2.3\nSurvival craft equipment and location devices,\nincluding radio equipment, are operated based on\nestablished procedures and manufacturer’s\ninstruction.\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Identified emergency\nMay include:\n1.1\nCollision\n1.2\nFire\n1.3\nFoundering\n1.4\nPerson falling overboard (man overboard)\n\n2. Dangers and threats to\nsurvival\nMay include:\n2.1\nCold water shock\n2.2\nHypothermia\n2.3\nPsychological response to disaster\n2.4\nLoss of will to live\n2.5\nSea sickness\n2.6\nDehydration\n2.7\nInjuries\n2.8\nStarvation\n\n3. Life-saving appliances\nMay include:\n3.1\nLife jackets\n3.2\nLife buoys\n3.3\nHard hats\n3.4\nImmersion suits and other thermal protective\naid\n3.5\nRocket line throwing appliances\n3.6\nPyrotechnic distress signals\n3.7\nGMDSS survival craft VHF radios\n3.8\nSatellite emergency position indicating radio\nbeacons EPIRBs\n3.9\nSARTs\n3.10 Whistles\n\n4. Survival Craft\nMay include:\n4.1\nFree fall life boats\n4.2\nDavit launched life boats\n4.3\nLife rafts\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n16\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nresponded to indicated emergency\n1.2\nboarded survival craft\n\n2. Required Knowledge\n2.1\nTypes of emergency situations and actions to be\ntaken when-\n2.1.1 called to survival craft stations\n2.1.2 required to abandon ship\n2.1.3 in the water\n2.1.4 aboard a survival craft\n2.1.5 a person falls overboard (man\noverboard)\n2.2\nTypes, uses and location of life-saving appliances\n2.3\nSurvival craft equipment and how to operate them\n2.4\nValue of training and drills\n2.5\nTypes and uses of personal protective clothing and\nequipment\n\n3. Required Skills\n3.1\nDonning lifejacket\n3.2\nDonning and using an immersion suit\n3.3\nJumping from a height into the water\n3.4\nRighting an inverted life raft while wearing a lifejacket\n3.5\nKeeping afloat without a lifejacket\n3.6\nTaking initial action on boarding survival craft\n3.7\nStreaming a drogue or sea-anchor\n3.8\nOperating survival craft equipment\n3.9\nOperating location devices including radio equipment\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nwork place with recommended facilities\n4.2\ntools and equipment appropriate to the activity\n4.3\nmaterials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related\nunderpinning knowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n17\nUNIT OF COMPETENCY\n:\nMINIMIZE THE RISK OF FIRE AND MAINTAIN A STATE\nOF READINESS TO RESPOND TO EMERGENCY\nSITUATIONS INVOLVING FIRE\n\nUNIT CODE\n:\nMTM 834209\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming fire prevention and firefighting activities\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Carry out fire\nminimization\nprocedures\n\n1.1\nFire hazards on board vessel are identified and action\nis taken to eliminate or minimize them.\n1.2\nResponsibilities for checking fire prevention\nequipment and systems are fulfilled and appropriate\naction is taken to ensure that they are operational.\n1.3\nAn awareness and understanding of the causes of fire\nand its minimization is maintained through\nparticipation in fire drills and related instructional\nprograms.\n1.4\nA state of readiness to respond to fire emergencies\nis maintained at all times.\n\n2. Respond to\nemergencies involving\nfire\n2.1.\nEmergency situations involving fire are correctly\nidentified in accordance with established nautical\npractice.\n2.2.\nType of fire is identified in accordance with the\nestablished classification system for fires.\n2.3.\nInitial action on becoming aware of fire emergency is\nin conformity with established practices and\nprocedures.\n2.4.\nAction taken is timely and appropriate for seriousness\nof the fire emergency.\n2.5.\nAction taken on identifying muster signals for a fire\nemergency is appropriate and complies with\nestablished procedures.\n2.6.\nAppropriate precautions and procedures are\nimplemented when responding to electrical fires.\n2.7.\nAppropriate precautions and procedures are\nimplemented when responding to uptake and\nhydrogen fires.\n2.8.\nCommunications are clear and concise at all times\nand orders are acknowledged in a timely and\nseamanlike manner.\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Fire and its\nminimization\nFire hazard minimization procedures may include:\n1.1. Housekeeping in work areas\n1.2. Following of fire safety procedures\n1.3. Checking and maintaining shipboard fire prevention\nsystems\n1.4. Identification and elimination or minimization of fire\nhazards\n1.5. Precautions when using and storing flammable\nmaterials\n1.6. Precautions that need to be taken when responding to\nan electrical fire\n1.7. Precautions that need to be taken when responding to\nuptake and hydrogen fires\n1.8. Precautions when using naked flames or welding\nequipment\n\n2. Fire emergencies\nFire emergencies on board vessel may occur:\n2.1. By day or night in both normal and emergency\nsituations\n2.2. Under any possible conditions of weather and loading\n2.3. While underway\n2.4. During berthing and un-berthing operations\n2.5. While anchoring or mooring\n2.6. While in port\n2.7. While moored or at anchor\n\n3. Type of fire\nStandard types of fires may include:\n3.1\nClass A\n3.2\nClass B\n3.3\nClass C\n3.4\nClass F\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n19\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1 implemented fire prevention and minimization measures\nand procedures on board vessel\n1.2 recognized fire hazards onboard vessel and take\nappropriate action to eliminate or minimize them\n1.3 assessed the operational capability of fire-detection and\nfire- fighting equipment and systems and initiate any\nrequired maintenance or replenishment action\n1.4 responded to emergency situations involving fire\n1.5 implemented OHS principles and policies when carrying\nout fire prevention and fire–fighting duties\n1.6 communicate effectively with others as required during fire\nprevention activities and fire emergencies\n\n2. Required\nKnowledge\n2.1 Relevant maritime regulations concerning minimization of\nthe risk of fire on board vessel\n2.2 The chemistry of fire and its relationship to materials\ntypically carried on vessels\n2.3 Principles underlying the spread of fire and its\nextinguishment, including the elements of fire and\nexplosion (the fire triangle)\n2.4 Types and sources of ignition\n2.5 Flammable materials and fire hazards\n2.6 Factors that influence the spread of fire\n2.7 The importance of constant vigilance in fire prevention\nand minimization\n2.8 The different classes of fire, their characteristics and\nstrategies and equipment needed for their extinguishment\n2.9 A basic understanding of the types of fire-detection, fire-\nfighting equipment and systems used on board vessels,\ntheir features, principles of operation and the procedures\nfor their use and maintenance\n2.10 Relevant regulations and policies related to the\nmaintenance of fire equipment and systems\n2.11 Precautions and procedures that must be followed when\nresponding to electrical fires\n2.12 Precautions and procedures that must be followed when\nresponding to uptake and hydrogen fires\n2.13 Maritime communication techniques applicable to fire\nprevention and fire-minimization activities on board vessel\n2.14 Problems that can occur with shipboard fire-detection and\nfire hazards on board a vessel and appropriate action that\nshould be taken\n2.15 Sources of information on shipboard fire prevention and\nminimization\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n20\n\n3. Required Skills\n3.1 Implementing of fire prevention and minimization\nmeasures and procedures\n3.2 Identifying and evaluating fire hazards and taking\nappropriate courses of action\n3.3 Responding to simulated and real emergency situations\ninvolving fire\n3.4 Assessing the operational capability of fire-detection\nequipment and systems and taking any required\nmaintenance or replenishment action\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 work place with recommended facilities\n4.2 tools and equipment appropriate to the activity\n4.3 materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration and questioning of related underpinning\nknowledge\n5.2 Written examination\n5.3 Portfolio\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n21\nUNIT OF COMPETENCY\n:\nFIGHT AND EXTINGUISH FIRES\n\nUNIT CODE\n:\nMTM834210\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nfighting and extinguishing fires\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Operate portable fire-\nfighting equipment\n\n1.1\nType of fires is correctly identified in accordance with\naccepted fire-fighting practice.\n1.2\nCorrect portable fire-fighting equipment is selected\nand used to fight specific classes of fires.\n1.3\nClass F fires are correctly extinguished with a fire\nblanket in accordance with accepted fire-fighting\npractice.\n1.4\nCorrect techniques are applied for the use of hose lines\nto extinguish fires on board a vessel.\n1.5\nWhere applicable, correct techniques are applied for\nthe setting up of foam making equipment to extinguish\nB Class fires on board a vessel.\n\n2. Carry out fire-fighting\noperations\n2.1\nFire is extinguished using appropriate procedures,\ntechniques, equipment and fire-fighting agents.\n2.2\nCorrect portable fire-extinguisher(s) are selected and\nused for the class of fire involved in a fire emergency.\n2.3\nAppropriate safety clothing, appliances and\nequipment is used and safety precautions and\nprocedures are applied when fighting fires in\naccordance with regulatory requirements, vessel’s\nprocedures and established fire-fighting practice.\n2.4\nThe timing and sequence of individual actions when\nfighting fires onboard a vessel are appropriate to the\nprevailing circumstances and conditions.\n2.5\nSearch and rescue operations in a smoke filled\nenvironment are correctly conducted as a member of a\nfire-fighting team in accordance with accepted fire-\nfighting practice.\n2.6\nInterior fires are extinguished using appropriate fire-\nfighting equipment and procedures as a member of a\nfire-fighting team in accordance with accepted fire-\nfighting practice.\n2.7\nLifeline signals are correctly used during interior fire-\nfighting operations.\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Type of fire\nStandard types of fires may include:\n1.1 Class A\n1.2 Class B\n1.3 Class C\n1.4 Class F\n\n2. Fire-fighting equipment Fire-fighting equipment, appliances and systems may\ninclude:\n2.1 Portable fire extinguishers including foam, water, CO 2\n, dry chemical and wet foam\n2.2 Fire blankets\n2.3 CO2 fixed systems\n2.4 Foam installations including semi-portable and fixed\nsystems\n2.5 Sprinkler systems\n2.6 Fire pumps (main and emergency fire pump)\n2.7 Fire hoses, hydrants, branches and international shore\nconnection\n\n3. Fire on board a vessel\n\nFire emergencies on board vessel may occur:\n3.1 By day or night in both normal and emergency\nsituations\n3.2 Under any possible conditions of weather and loading\n3.3 While underway\n3.4 During berthing and un-berthing operations\n3.5 While anchoring or mooring\n3.6 While in port\n3.7 While moored or at anchor\n\n4. Safety clothing,\nappliances and\nequipment\nSafety clothing and equipment may include:\n4.1 Fire-resistant clothing\n4.2 Self-contained breathing apparatus (SCBA)\n4.3 Masks\n4.4 Eye and ear protection\n4.5 Gloves\n4.6 Boots\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n23\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nparticipated in simulated on-boar d fire-fighting activities\n1.2\nparticipated in search and rescue and fire-fighting teams\n1.3\napplied OHS principles and policies when carrying out\nfire-fighting duties\n1.4\ncommunicated effectively with others as required during\nfire emergencies\n\n2. Required Knowledge\n2.1\nKnowledge of relevant maritime regulations\n2.2\nThe chemistry of fire and its relationship to materials\ntypically carried on vessels\n2.3\nPrinciples underlying the spread of fire and how it is\nextinguished\n2.4\nThe different types of fire, their characteristics and\nstrategies and equipment needed to extinguish them\n2.5\nPrinciples and procedures for the use of self-contained\nbreathing apparatus (SCBA) when fighting fires\n2.6\nFire-fighting clothing, outfits and personal safety\nequipment used when fighting a fire onboard a vessel\n2.7\nTypes fire-fighting appliances, equipment and systems\nused on board vessels, their features, principles of\noperation and the procedures for their use and\nmaintenance\n2.8\nFixed fire prevention and extinguishing installations\nused on vessels and their principles of operation\n2.9\nFire-fighting techniques, agents and precautions\napplicable to different types of fire on board a vessel\n2.10\nMaritime communication techniques applicable to fire-\nfighting activities onboard a vessel\n2.11\nTypical problems that can occur with shipboard fire-\nfighting equipment and operations and appropriate\nremedial action and solutions\n2.12\nSources of information on shipboard fire prevention and\nextinguishment\n\n3. Required Skills\n3.1\nApplying fire prevention measures and procedures\n3.2\nIdentifying fire fighting problems and determining\nappropriate courses of action\n3.3\nParticipating as a member of an interior search and\nrescue and fire-fighting team on board a vessel\n3.4\nDetermining the operational capability of fire-fighting\nappliances, equipment and systems\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nwork place with recommended facilities\n4.2\ntools and equipment appropriate to the activity\n4.3\nmaterials relevant to the proposed activity and tasks\n\n5. Methods of Assessment Competency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related underpinning\nknowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of Assessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n24\nUNIT OF COMPETENCY\n:\nTAKE IMMEDIATE ACTION UPON ENCOUNTERING AN\nACCIDENT OR OTHER MEDICAL EMERGENCY\n\nUNIT CODE\n:\nMTM 834211\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ntaking immediate action upon encountering an accident or\nother medical emergency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine the need of\ncasualty\n\n1.1\nPatient condition is determined in accordance with\nestablished first aid procedures and the nature of injury\nor illness is established.\n1.2\nProbable cause, nature and extent of injuries is\nidentified and appropriate action is taken to prevent\nfurther harm to the victim and to self.\n1.3\nThe position of the patient is adjusted to optimize\npersonal comfort for the medical condition or injury\nconcerned.\n1.4\nWhere there are doubts over the seriousness of the\ninjury or illness and how to treat the patient, assistance\nis sought from senior officers or shore-based medical\nadvisers.\n\n2. Administer first-aid to\nthe victim\n\n2.1. Appropriate first aid procedures are used to treat the\nidentified injury or illness in accordance with the first-\naider’s limits of responsibility.\n2.2. Aseptic techniques are applied during any wound\ndressing.\n2.3. Hygiene measures are used that are appropriate for\nthe degree of illness or injury.\n2.4. Cardio-pulmonary resuscitation techniques are\ncorrectly applied where required.\n2.5. Condition of the patient is regularly monitored both\nvisually and through appropriate measures of bodily\nsigns.\n2.6. Health precautions and disease prevention measures\nare implemented in accordance with regulatory\nrequirements and company procedures.\n2.7. Appropriate action is taken if there are signs of a\ndeterioration in the condition of the patient.\n2.8. Where necessary, assistance is provided in the\npreparation and transporting of the victim.\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patient\nMay include patient having:\n1.1\nHeart attack\n1.2\nStroke\n1.3\nAsthma attack\n1.4\nDiabetes\n1.5\nEpilepsy seizures\n\n2. Injuries\nInjuries on board a vessel may include:\n2.1\nExternal bleeding\n2.2\nAn amputation\n2.3\nA foreign body in the eye\n2.4\nA penetrating chest wound\n2.5\nA nose bleed\n2.6\nInternal bleeding\n2.7\nFractures, sprains, strains and dislocations\n2.8\nElectric shock\n2.9\nAsphyxia\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n26\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. identified and prioritized the need for medical first aid in\nlife-threatening medical emergencies\n1.2. administered first aid on board a vessel\n1.3. communicated effectively with others during medical\nemergencies and health care\n\n2. Required Knowledge\n2.1. Relevant sections of maritime regulations\n2.2. Emergencies, injuries and medical problems that may\noccur on board a vessel and appropriate action,\ntreatments and solutions\n2.3. Relevant OH&S and health legislation and policies\n2.4. Duties and responsibilities of the designated first aid\nofficer on board a vessel\n2.5. First aid procedures\n2.6. Shipboard procedures for:\n2.6.1. conducting an initial patient first aid assessment\n2.6.2. managing injuries\n2.6.3. managing medical emergencies\n2.6.4. carrying out resuscitation techniques\n2.7. Techniques for care of wounds\n2.8. Ways in which disease can spread on board a vessel\nand ways of preventing the spread\n2.9. Legal issues related to the administration of drugs and\nmedicines on board a vessel\n2.10. Knowledge of body structures and functions relevant to\npossible injury, illnesses and disease that may be\nencountered on board a vessel\n2.11. Maritime communication techniques related to health\ncare and receiving radio medical advice from shore-\nbased advisers\n2.12. Marine publications containing information on first aid\nand medical treatment on board a vessel\n\n3. Required Skills\n3.1. Providing first-aid on board a vessel\n3.2. Identifying and problems and emergencies and taking\nappropriate courses of action\n3.3. Applying aseptic and other precautionary techniques\nwhen carrying out first-aid procedures on board a\nvessel\n\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1. Demonstration and questioning of related\nunderpinning knowledge\n5.2. Written examination\n5.3. Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n27\nUNIT OF COMPETENCY\n:\nCOMPLY WITH EMERGENCY PROCEDURES\n\nUNIT CODE\n:\nMTM834212\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required to\ntake appropriate initial action on becoming aware of an\nemergency on board a commercial vessel in conformance\nwith the established emergency response procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Take action on becoming\naware of an emergency\n1.1 Emergency situations are recognized and identified.\n1.2 Responses to an emergency situation followed the\nestablished vessel’s emergency response procedures.\n1.3 Correct actions are taken on discovery of an actual or\npotential emergencies/emergency situation in\naccordance with established vessel’s emergency\nresponse procedures.\n1.4 Information given on raising alarm is prompt, accurate,\ncomplete and clear.\n\n2. Follow established\nemergency procedures\n2.1 Vessel’s contingency plans for emergency response\nare known and are implemented in real and simulated\nemergency situations.\n2.2 Escape routes and internal and external\ncommunications and alarm systems are used in real\nand simulated emergency situations in accordance\nwith regulatory requirements and established\nprocedures.\n2.3 Emergency communications and alarm signals and\nsystems are understood and required action\nimplemented in accordance with emergency\nprocedures and regulatory requirements.\n2.4 Planned damage control procedures for dealing with\ndamage to the vessel and its hull are implemented in\naccordance with company procedures and regulatory\nrequirements.\n\n3. Follow procedures for the\nuse of various life-saving\nequipment\n3.1 Participation in life saving drills confirms readiness to\ncorrectly carry out life-saving procedures and use life-\nsaving equipment.\n3.2 Procedures for the use of various shipboard life-saving\nappliances are followed in accordance with regulatory\nrequirements, manufacturer’s instructions and\ncompany procedures.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergency situations\nMay include:\n1.1 Collision with another vessel\n1.2 Explosion on board vessel\n1.3 Fire on board vessel\n1.4 Impairment of integrity of hull and ingress of water\n1.5 Loss of steering control\n1.6 Lost of motive power\n1.7 Foundering\n1.8 Grounding\n1.9 Beaching a Vessel\n1.10 Person overboard\n1.11 Rescue and evacuation of injured personnel\n\n2. Potential emergencies\nMay occur:\n2.1 By day or night\n2.2 Under any possible conditions of weather and\nloading\n2.3 While underway\n2.4 During berthing and unberthing operations\n2.5 While anchoring or mooring\n2.6 When bunkering\n2.7 During cargo handling operations\n\n3. Regulatory requirements\nMay include:\n3.1 SOLAS convention\n3.2 IMO STCW Codes and Convention\n3.3 Relevant domestic and international OH&S\nlegislation\n\n4. Life-saving equipment\nMay include:\n4.1 Life jackets\n4.2 Exposure and immersion suits\n4.3 Survival craft\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n29\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nundertook appropriate action in the event of emergency\nsituations\n1.2\nfollowed established procedures and regulatory\nrequirements during emergency responses’ procedures\n1.3\nfollowed procedures for the use of various life-saving\nequipment\n1.4\nparticipated in drills in preparation for the implementation\nof emergency responses\n1.5\ncommunicated effectively with others during emergency\nresponses’ procedures\n\n2. Required\nKnowledge\n2.1\nTypes of emergencies\n2.2\nShipboard contingency plans\n2.3\nKnowledge of relevant maritime regulations\n2.4\nRelevant OH&S legislation and policies\n2.5\nNavigational emergencies for vessels and appropriate\naction and solutions\n2.6\nIndications of various types of emergency situations and\nthe action to be followed when various types of actual or\npotential emergency situations are identified\n2.7\nEmergency alarm signals and systems in use on vessels\nand procedures to be followed when an emergency alarm\nis raised\n2.8\nEscape routes and internal and external communications\nsystems and alarms on board a vessel\n2.9\nGeneral principles of damage control and the manner in\nwhich watertight integrity of hull is maintained on a\nvessel, including the importance of preparation, control\nand repair\n2.10 Ways of controlling damage during a flooding emergency,\nincluding the use of various shipboard items that can be\nused for damage control purposes such as mattresses,\ncanvas and clothing\n2.11 Maritime communication techniques used during\nnavigational emergencies of actual or potential\nemergency situations are identified\n2.12 Emergency alarm signals and systems in use on vessels\nand procedures to be followed when an emergency alarm\nis raised\n2.13 Escape routes and internal and external communications\nsystems and alarms on board a vessel\n2.14 General principles of damage control and the manner in\nwhich watertight integrity of hull is maintained on a\nvessel, including the importance of preparation, control\nand repair\n2.15 Ways of controlling damage during a flooding emergency,\nincluding the use of various shipboard items that can be\nused for damage control purposes such as mattresses,\ncanvas and clothing\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n30\n\n3. Required Skills\n3.1 Applying navigational emergencies for vessels and\nappropriate action and solutions\n3.2 Applying appropriate action in various types of actual or\npotential emergency situations\n3.3 Using emergency alarm signals and systems\n3.4 Using various shipboard items to be used for damage\ncontrol purposes such as mattresses, canvas and\nclothing\n3.5 Using personal safety equipment\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 simulated workplace environment\n4.2 workplace standards, procedures, policies, guidelines\n4.3 tools and equipment relevant to work activities\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation/simulated practical demonstration in\nresponding to emergency situations onboard a\ncommercial vessel, and/or\n5.2 Simulation/role plays to test the candidate’s knowledge\nand skills in complying with emergency procedures\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n31\nUNIT OF COMPETENCY :\nTAKE PRECAUTIONS TO PREVENT POLLUTION OF\nTHE MARINE ENVIRONMENT\n\nUNIT CODE\n:\nMTM834213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ntaking precautions towards protection of the marine\nenvironment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Practice compliance\nwith legislative\nrequirements for\nprotection of the\nmarine environment\n1.1. Relevant regulations and procedures for the protection\nof the marine environment are identified.\n1.2. Appropriate action is taken in day-to-day work to ensure\ncompliance with relevant regulations and procedures for\nthe protection of the marine environment as required.\n1.3. Appropriate action is taken where incidences of non-\ncompliance or potential non-compliance are identified in\naccordance with regulations and procedures.\n1.4. Any breach of regulations and procedures concerning\nprotection of the marine environment is rectified and/or\nreported as required within the limits of the crew’s/\nofficer’s responsibility.\n\n2. Practice anti-pollution\nprocedures\n\n2.1. Anti-pollution procedures applicable to vessel\noperations are followed in the course of day-to-day\nwork.\n2.2. Appropriate preventive measures are undertaken to\nprevent pollution of the marine environment in\naccordance with regulations and procedures.\n2.3. Inputs are provided in the preparation of reports and\nother documentation related to the protection of marine\nenvironment in accordance with regulations and\nprocedures.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Protection of the\nmarine environment\nProtection of the marine environment may be observed:\n1.1. By day or night in both normal and emergency situations\n1.2. Under any possible conditions of sea and weather\n1.3. While underway\n1.4. During berthing and unberthing operations\n1.5. While anchoring or mooring\n1.6. While moored or at anchor\n1.7. During loading and unloading operations\n1.8. During maintenance operations\n\n2. Anti-pollution\nprocedures\nAnti-pollution procedures include checking of items and\nequipment such as:\n2.1. Pumps\n2.2. Valves\n2.3. Emission control equipment\n2.4. Water management equipment including: cooling water,\nballast water and bilge systems\n2.5. Waste storage and recycling equipment\n2.6. Ballast management equipment\n\n3. Preventive measures\nPreventative measures to protect the marine environment\nmay include:\n3.1. Prevention of spillages of cargo\n3.2. Prevention of spillage s of fuel and oil\n3.3. Control of polluting emissions of gas and smoke\n3.4. Effective management of waste, pollution and recycling\nprocesses\n3.5. Effective management of ballast operations\n3.6. Shipboard housekeeping\n3.7. Pollution control instructions\n\n4. Regulations\nApplicable regulations includes:\n4.1. MARPOL Convention\n4.2. IMO STCW Code and Convention related to the\nprotection of marine environment\n4.3. Relevant international and/or local legislation related to\nthe protection of the marine environment\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n33\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. practiced compliance with legislative requirements for\nprotection of the marine environment\n1.2. practiced preventative and remedial anti-pollution\nprocedures as per relevant regulations and procedures\n1.3. identified typical pollution control problems and take\nappropriate action\n1.4. communicate effectively with others concerning measures\nto protect the marine environment\n\n2. Required Knowledge\n2.1. Relevant legislation, codes of practice, policies and\nprocedures to protect the marine environment\n2.2. Impact of shipping on the marine environment and the\neffects of operational or accidental pollution on it\n2.3. Basic environmental protection procedures\n2.4. Pollution control problems and related measures to\nprotect the marine environment\n2.5. Complexity and diversity of the marine environment\n2.6. Requirements under local and/or international legislation\nand conventions for reporting incidents related to\nbreaches of the statutory codes and measures for the\nprotection of the marine environment\n\n3. Required Skills\n3.1. Completing activities aimed at compliance with relevant\nregulatory requirements for protection of the marine\nenvironment\n3.2. Identifying and evaluating problems related to compliance\nwith relevant regulations for environmental protection and\ndetermining an appropriate courses of action\n3.3. Following anti-pollution procedures\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1. Demonstration and questioning of related underpinning\nknowledge\n5.2. Written examination\n5.3. Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n34\nUNIT OF COMPETENCY\n:\nOBSERVE SAFE WORKING PRACTICES\n\nUNIT CODE\n:\nMTM834214\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required to\nobserve established maritime safe working practices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Identify and follow\nworkplace procedures\nfor hazard\nidentification and risk\ncontrol\n1.1 Safety regulations and established vessel’s safety and\nhazard control practices and procedures are obtained,\ninterpreted and applied to day-to-day work activities.\n1.2 Workplace procedures for Occupational Health and Safety\nand related work instructions for controlling risks onboard a\nvessel are followed.\n1.3 Workplace procedures for dealing with shipboard accidents,\nfire and emergencies are known and followed.\n1.4 Hazards in the workplace are identified and appropriate\naction is taken to report them and to minimize or eliminate\nrisk to personnel, vessel and the environment.\n1.5 Where relevant, procedures and precautions necessary for\nentry into a pump room, fuel tanks or other confined spaces\non a vessel are followed.\n1.6 Personal protection clothing and equipment is used in\naccordance with established shipboard safety practices and\nprocedures.\n1.7 Appropriate assistance is provided in the event of a\nshipboard emergency to secure the vessel and its\nmachinery and equipment and to maintain the safety of the\nvessel and persons involved.\n1.8 Established emergency and contingency plans are followed\nin the event of a shipboard emergency.\n2. Contribute to\narrangements for the\nmanagement of\noccupational health\nand safety\n2.1 Occupational Health and Safety issues and identified safety\nhazards are raised with designated personnel in\naccordance with workplace procedures and relevant\noccupational health and safety legislation.\n2.2 Contributions to occupational health and safety\nmanagement in the workplace are made within workplace\nprocedures and provisions of relevant legislation.\n2.3 Occupational health and safety issues are raised with\ndesignated personnel in accordance with workplace\nprocedures and relevant occupational health and safety\nlegislation.\n2.4 Contribute to participative arrangements for occupational\nhealth and safety management in the workplace within\nvessel’s procedures and scope of responsibilities and\ncompetencies.\n3. Take necessary\nactions to control\nfatigue\n3.1 Fatigue symptoms are recognized and identified.\n3.2 Corrective actions are taken on discovery of fatigue in\naccordance with established company procedures.\n3.3 Fatigue management practices are observed at all times.\n3.4 Reports related to incidence of fatigue are communicated to\nappropriate authority in accordance with established\ncompany procedures.\n4. Complete occupational\nhealth and safety\nrecords\n4.1 Occupational health and safety records for self are\ncompleted in accordance with workplace requirements.\n4.2 Legal requirements for the maintenance of records of\noccupational injury and diseases are followed.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergencies\nMay include:\n1.1\nLoss of propulsion\n1.2\nLoss of electrical power\n1.3\nLoss of steerage\n1.4\nFlooding of vessel\n1.5\nFire or explosion\n1.6\nLoss of refrigeration\n1.7\nLoss of water making ability\n1.8\nFuel oil, lubrication oil, steam and gas leaks\n1.9\nOverheating and over speed of machinery, governors,\nemergency trips\n\n2. Hazards in the workplace\nMay include:\n2.1\nMoving heavy loads in an unsafe work environment\n2.2\nUnsecure machinery, components or repair\nequipment\n2.3\nSlippery deck\n2.4\nWelding equipment\n2.5\nSharp tools and implements\n2.6\nPower tools\n2.7\nMoving and rotating machinery\n2.8\nFlammable liquids, vapors and fuel\n2.9\nUsing equipment beyond safe working limits\n2.10 Poor housekeeping procedures\n2.11 Electrical wiring and systems\n2.12 Hot pipes and valves (steam, fuel oil, lubricating oil)\n2.13 Cold pipes and valves (refrigeration and liquefied\ngas cargoes)\n2.14 Working at heights\n2.15 Exposed electrical circuits\n2.16 Toxic gases and substances\n2.17 Chemicals and other harmful substances\n2.18 Damaged cargo and containers\n\n3. Participative\narrangements\nMay include:\n3.1\nFormal and informal meetings which include\noccupational health and safety\n3.2\nOccupational health and safety committees\n3.3\nOther committees, for example, consultative,\nplanning and purchasing\n3.4\nHealth and safety representatives\n3.5\nSuggestions, requests, reports and concerns put\nforward by vessel’s crew to senior officers\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n36\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nidentified and followed workplace procedures for hazard\nidentification and risk control\n1.2\ncontributed to arrangements for the management of OHS\nonboard a vessel\n1.3\nunderstood and taken necessary actions to control\nfatigue\n1.4\ncompleted OHS records as required\n1.5\ncommunicated effectively with others on workplace safety\nmatters\n2. Required\nKnowledge\n2.1\nKnowledge of relevant maritime and OHS regulations\n2.2\nISM Code Safety Management System procedures (where\napplicable)\n2.3\nThe provisions of OHS Acts, regulations and codes of practice\nrelevant to the workplace, including the rights and\nresponsibilities of the workplace parties under OHS Acts,\nregulations and codes of practice;\n2.4\nThe ways in which OHS is managed in the workplace, and\nactivities required under OHS legislation, for example:\n2.4.1 policies\n2.4.2 procedures\n2.4.3 plant and equipment maintenance\n2.4.4 hazard identification\n2.4.5 risk assessment and control\n2.4.6 OHS instruction\n2.4.7 training and provision of OHS information\n2.5\nHazards that exist in the workplace\n2.6\nThe preferred order of ways to control risks (known as the\nhierarchy of control);\n2.7\nWorkplace OHS procedures relevant to the work being\nundertaken, including procedures for:\n2.7.1 recognizing and reporting on hazards, for example, work\narea inspections\n2.7.2 work operations to control risks, for example, permit to\nwork systems and isolation procedures\n2.7.3 responding to accidents, fires and emergencies\n2.7.4 raising OHS issues\n2.7.5 employee participation in OHS management, for\nexample, consultative or OHS committees and\n2.7.6 joint employer/employee inspections\n2.8\nThe meaning of OHS symbols found on signs and labels in the\nworkplace\n2.9\nDesignated personnel responsible for OHS onboard a vessel\n2.10 Effects of sleep, schedules, and the circadian rhythm on\nfatigue\n2.11 Effects of physical stressors on seafarers\n2.12 Effects of environmental stressors in and outside the ship and\ntheir impact\n2.13 Effects of schedule changes on seafarer fatigue\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n37\n\n3. Required Skills\n3.1 Applying OHS in the workplace, and activities required\nunder OHS legislation,\n3.2 Applying order of ways to control risks (known as the\nhierarchy of control)\n3.3 Designating personnel responsible for OHS onboard a\nvessel\n3.4 Communication skills\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 simulated workplace environment\n4.2 workplace standards, procedures, policies, guidelines\n4.3 tools and equipment relevant to work activities\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation/simulated practical demonstration in the\napplication of safe working practices and safety hazard\ncontrol onboard a vessel\n5.2 Simulation/role plays to test the candidate’s knowledge\nand skills in the application of safe working practices and\nhazard control and safety hazard control on a\ncommercial/or training vessel\n\n6. Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in\nsimulated work environment\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n38\nUNIT OF COMPETENCY\n:\nDEMONSTRATE SECURITY AWARENESS PRACTICES\n\nUNIT CODE\n:\nMTM 834215\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ndemonstrating security awareness practices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Contribute to the\nenhancement of\nmaritime security\nthrough heightened\nawareness\n1.1. Requirements relating to enhanced maritime security\nare identified.\n1.2. All critical factors relevant to the security and safety\nof a maritime workplace are monitored continuously\nduring work operations.\n1.3. Relevant information concerning the security and\nsafety of a maritime workplace is recognized and\ninterpreted and timely action is taken in accordance\nwith workplace procedures.\n1.4. Changes to work environment and related risks are\nmonitored and managed to ensure a safe outcome to\nworkplace operations.\n1.5. A security-related contingency plan action is studied and\ninterpreted and where necessary appropriate action is\ntaken.\n1.6. Reports on matters related to vessel security are\nprepared and submitted to designated personnel in\naccordance with the ship security plan and company\nand maritime regulatory requirements.\n\n2. Recognize security\nthreats\n\n2.1. Factors that may adversely affect the security and\nsafety of a maritime workplace are identified.\n2.2. Risks to vessel or port security and safety are\nrecognized and reported to relevant security\npersonnel and appropriate action is taken to control the\nrisk in accordance with workplace procedures and\nsecurity requirements.\n2.3. Persons posing potential security risks are\nrecognized and reported to relevant security personnel\nand appropriate action is taken to control the risk in\naccordance with workplace procedures and security\nrequirements.\n2.4. All relevant indications of a security situation are\nrecognized and appropriate action is taken to alert\nrelevant personnel and/or take appropriate action in\naccordance with workplace procedures and regulatory\nrequirements.\n\n3. Understand the need\nfor and maintaining\nsecurity awareness\nand vigilance\n3.1. Security instruction programs are participated in as per\ncompany and regulatory requirements.\n3.2. Requirements and processes for security awareness\nand vigilance are identified.\n3.3. Security and emergency drills are participated in\naccordance with the ship security plan and company\nand maritime regulatory requirements.\n3.4. Inputs to improve/enhance security training programs\nand drills are provided, where necessary.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Maritime workplace\nWorkplace may include:\n1.1.\nVessels\n1.2.\nPort facilities\n2. Relevant security\npersonnel\nMay include:\n2.1.\nShip security officer\n2.2.\nPort security officer\n2.3.\nCompany security officer\n2.4.\nMaster or skipper of the vessel\n2.5.\nOther personnel on vessel (in terms of their security awareness,\npreparedness and vigilance)\n3. Persons posing\npotential security\nrisks\nMay include:\n3.1.\nUnknown persons photographing vessels or facilities\n3.2.\nUnknown persons attempting to gain access to vessels or\nfacilities\n3.3.\nUnknown persons loitering in the vicinity of vessels or port\nfacilities\n3.4.\nUnknown persons telephoning to ascertain security, personnel or\nstandard operating procedures on a vessel or at a port facility\n3.5.\nVehicles or small vessels with personnel in them loitering and\nperhaps taking photographs or drawing diagrams of vessels or\nfacilities\n3.6.\nGeneral aviation aircraft operating in proximity of vessels or\nfacilities\n3.7.\nUnauthorized vendors attempting to sell merchandise\n3.8.\nPersons carrying suspicious parcels which could be bombs\n3.9.\nUnknown persons acting suspiciously\n3.10. Unknown persons seeking information from vessel personnel or\ntheir families about vessels or port facilities via either face-to-\nface discussion or email\n3.11. Unauthorized workers attempting to gain access to a vessel or\nport facilities to repair, replace, service or install equipment\n4. Security situation\nMay include:\n4.1.\nPiracy/hijacking\n4.2.\nArmed robbery\n4.3.\nBomb threat\n4.4.\nUnidentified objects/explosives on vessel\n4.5.\nDamage to or destruction of port facility\n4.6.\nDamage to or destruction of vessel\n4.7.\nPiracy and other depredations\n4.8.\nStowaways\n5. Security and\nemergency drills\nSecurity and emergency drills may relate to incidents such as:\n5.1.\nDamage to or destruction of the vessel or port facility (e.g. by\nexplosive devices, arson, sabotage or vandalism)\n5.2.\nHijacking or seizure of a vessel or of persons on board\n5.3.\nTampering with cargo or essential vessel equipment or\nsystems or vessel's stores\n5.4.\nUnauthorized access to or use of the vessel (including presence\nof stowaways)\n5.5.\nSmuggling of weapons or equipment (including weapons of\nmass destruction)\n5.6.\nUse of the vessel to carry persons intending to cause a security\nincident (or their equipment)\n5.7.\nUse of the vessel itself as a weapon or as a means to cause\ndamage or destruction\n5.8.\nAttacks from seaward while at berth or at anchor\n5.9.\nAttacks while at sea\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n40\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. contributed to the enhancement of maritime security\nthrough heightened awareness\n1.2. recognized security threats\n1.3. understood the need for and methods of maintaining\nsecurity awareness and vigilance\n\n2. Required Knowledge\n2.1. IMO ISPS Code applicable to vessels and ports\n2.2. Procedures for maintaining security awareness\n2.3. Relevant security and safety regulations, rules, policies\nand procedures\n2.4. Relevant security personnel on a vessel or at a port facility\n2.5. Communication procedures and protocols on matters\nrelated to vessel and port security\n2.6. Security and safety problems that may be identified when\nmaintaining and managing situation awareness and action\nthat can be taken to overcome them\n2.7. Security and safety hazards and risks that may be\nidentified in the maritime workplace and ways of\ncontrolling those hazards and associated risks\n\n3. Required Skills\n3.1. Applying the above knowledge to the management of\nsituation awareness during workplace operations\n3.2. Reading and interpreting instructions, procedures and\nother information relevant to the maintenance of vessel\nand port security\n3.3. Working as a team with others on matters relevant to the\nmaintenance of vessel and port security\n3.4. Selecting and using appropriate communications\nequipment\n3.5. Taking appropriate initiatives related to vessel and port\nsecurity within limits of role and responsibility\n3.6. Interpreting and applying security and safety practices\nand regulations\n3.7. Communicating with others on matters related to vessel\nand port security\n3.8. Modifying activities dependent on differing workplace\ncontingencies, risk situations and environments\n3.9. Identifying and solving problems associated with the\nmaintenance of vessel and port security and to report\nsecurity issues and take appropriate action based on\navailable information\n3.10. Monitoring and anticipating security problems and risks\nand taking appropriate action\n\n4. Resource Implications The following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related underpinning\nknowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n41\nCORE COMPETENCIES\n\n UNIT OF COMPETENCY\n:\nCARRY OUT A WATCH ROUTINE APPROPRIATE TO THE\nDUTIES OF A RATING FORMING PART OF ENGINE\nROOM- WATCH\n\nUNIT CODE\n:\nMTM816311\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\ncarry out a watch routine appropriate to the duties of a rating\nforming part of engine room watch. This includes handling\nover and relief of the engineering watch, correct internal\ncommunications and the monitoring of the operation of the\nperformance of the main propulsion, auxiliary system and\nassociated controls.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform engine room\nwatchkeeping\nprocedures\n1.1 Machineries and equipment are identified and used\naccording to their functions.\n1.2 The conduct of handover and relief of the engine room watch\nis carried out/provided in conformity with accepted principles\nand vessel’s procedures.\n1.3 Watchkeeping principles and procedures are applied in\naccordance with established marine engineering practice and\nregulatory requirements.\n1.4 A safe engineering watch is achieved based on the accepted\nbridge and engine room resource management principles and\nprocedures.\n1.5 Engine room watch keeping is carried out in accordance with\nsafe working practice.\n1.6 Clear and concise communication is acknowledged in a\nseaman like manner.\n1.7 Internal communication and engine room various alarm\nsystems are identified and responded in real and simulated\nemergency situations in accordance with regulatory\nrequirements and established procedures.\n1.8 Emergency communications and alarm signals and systems\nare understood and required action implemented is in\naccordance with emergency procedures and regulatory\nrequirements.\n2. Respond to\nmalfunction and\nemergency situations\n2.1 Emergency duties performed are in accordance to shipboard\nprocedures.\n2.2 Escape routes from machinery spaces are correctly used in\nreal and simulated emergency situation in accordance with\nregulatory requirements and established procedures.\n2.3 The location of firefighting equipment is identified and the\nequipment is used according to the manufacturer’s instruction.\n2.4 Emergency and abnormal situations are identified, reported\nand appropriate action is undertaken in accordance with\ninstructions and regulatory requirements.\n2.5 Malfunctions of the main propulsion and auxiliary systems are\nidentified, reported and appropriate action is undertaken in\naccordance with operating manual instructions.\n2.6 Clear and concise communication is acknowledged in a\nseamanlike manner.\n2.7 Engine room emergency is reported immediately and\nappropriate action is undertaken.\n3. Record operating\nparameters\n3.1 Appropriate entries pertaining to the engineering watch are\nrecorded in the engine room book as per standard operating\nprocedures.\n3.2 Any deviation from the normal parameters is reported\nimmediately to the engineer on watch.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Machineries and\nequipment\nMay include:\n1.1 Machineries\n1.1.1 Main propulsion plant\n1.1.2 Auxiliary machineries\n1.1.3 Auxiliary engines\n1.2\nEquipment\n1.2.1 Safety equipment\n1.2.2 Workshop equipment\n1.2.3 Lifting equipment\n\n2. Watchkeeping\nprinciples\nMay include:\n2.1\nMaintenance of safe engineering watch\n2.2\nAvoidance of pollution of the marine environment\n2.3\nAppropriate assistance must be available to be\nsummoned to the engine room if required by a\nchange in the vessel’s operational situation\n\n3. Alarm signals and\nsystems\nMay include:\n3.1\nAlarm signals\n3.1.1 General alarm\n3.1.2 Fire alarm\n3.2\nAlarm systems\n3.2.1 Engine room alarm\n3.2.2 Fire extinguishing gas alarm\n\n4. Emergencies\nMay include:\n4.1\nLoss of propulsion or / and steerage\n4.2\nFlooding of engine room\n4.3\nFire or explosion in engine room\n4.4\nBreakdown and failure of refrigeration system\n4.5\nMalfunction of fresh water generator\n4.6\nFuel oil, lubrication oil, steam and gas leaks\n4.7\nBreakdown of generating set\n4.8\nPump failure\n4.9\nOverheating and overspeeding of machinery\nwhich result in emergency trips\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n43\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nperformed engine room watchkeeping arrangements\nprocedures\n1.2\nundertook appropriate action in the event of engine\nmalfunction and emergency\n1.3\nfulfilled engineering watchkeeping responsibilities\n1.4\ncommunicated clearly and effectively with others in the\ncourse of watchkeeping duties\n1.5\nrecorded operating parameters in the engine room\nlogbook\n\n2. Required Knowledge 2.1\nKnowledge of sections of IMO STCW Code on Safe\nEngineering Watch\n2.2\nDuties and responsibilities of an engine rating forming\npart of the engineering watch on both manned and\nUMS vessels with respect to safety of personnel and\nvessel, when taking over, keeping and handling over a\nwatch\n2.3\nBoiler plant systems\n2.4\nMain engine systems\n2.5\nDiesel alternator systems\n2.6\nTurbo alternator system\n2.7\nAuxiliary systems of the engine\n2.8\nTerms used in machinery spaces and names of\nmachinery and equipment\n2.9\nEngine room watchkeeping procedures\n2.10 Basic environmental protection procedures\n2.11 Engine room alarm systems\n\n3. Required Skills\n\n3.1\nOperation and maintaining vessel’s main and auxiliary\nsystems including start up, normal running, shut down\nand emergency situations\n3.2\nOperating main and auxiliary machinery monitoring\ndevices\n3.3\nPerforming safe working practices for machinery and\nenclosed spaces\n3.4\nIsolating main and auxiliary engine safely prior to work\ncommencing\n3.5\nWorking principles of fire prevention, detection and\nextinguishing\n3.6\nUsing internal communication system\n3.7\nRecording operating parameters\n\n4. Resource\nImplications\nThe following resources should be provided :\n4.1\nworkplace\n4.2\ntools and equipment appropriate in engine room\nwatchkeeping activities\n4.3\nmaterials relevant to the activity and tasks\n\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through :\n5.1\nPractical demonstration and questioning of related\nunderpinning knowledge\n5.2\nWritten examination\n5.3\nPortfolio (e.g. approved in-service and training ship\nexperiences, etc.)\n\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in simulated workplace\nsetting or accredited assessment center\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n44\nUNIT OF COMPETENCY\n:\nMAINTAIN THE CORRECT BOILER WATER LEVELS\nAND STEAM PRESSURES\n(For keeping a boiler watch)\n\nUNIT CODE\n:\nMTM816312\n\nUNIT DESCRIPTOR\n:\nThe unit covers the knowledge, skills and attitude required\nof a rating forming part of an engine-room watch in\nmaintaining the water level and steam pressure of a boiler\nin a vessel. Vessel may include any commercial vessel up\nto 750 kW propulsion power.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain boiler water\nlevel\n\n1.1\nBoiler water level is monitored and recorded in\naccordance with established procedures and\nmanufacturer’s instruction.\n1.2\nAny abnormality in the water level is reported\nimmediately to the engineer on watch.\n\n2. Maintain boiler steam\npressure\n2.1\nBoiler steam pressure is monitored and recorded in\naccordance with established procedures and\nmanufacturer’s instruction.\n2.2\n Any abnormality in the steam pressure is reported\nimmediately to the engineer on watch.\n\n3. Follow safety and\nhazard control\nprocedures\n3.1\nSafety, hazard minimization and pollution control\nprocedures and regulations are followed at all times\nwhen monitoring operation of boiler.\n3.2\nOperational and maintenance hazards are identified\nand action is taken to minimize or eliminate risk to\npersonnel, vessel and the environment.\n3.3\nWhere relevant, procedures and precautions\nnecessary for entry into confined spaces on a vessel\nare correctly followed.\n3.4\nAction is taken in the event of failure or emergency to\nisolate and secure the boiler systems and maintain\nthe safety of the vessel and persons involved.\n3.5\nVessel’s emergency and contingency plans are\nfollowed in the event of a failure or emergency\ninvolving boiler.\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n45\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Monitor\nMonitoring and maintaining water level and steam pressure of\nboiler may be conducted:\n1.1\nby day or night in both normal and emergency\nsituations\n1.2\nunder any permissible conditions of weather\n1.3\nwhile underway\n1.4\nduring berthing and unberthing operations\n1.5\nwhile anchored or moored\n1.6\nin dry dock\n1.7\nwhen bunkering\n1.8\nduring cargo operations\n\n2. Regulations\nMay include:\n2.1\nrelevant IMO Conventions and Codes\n2.2\nrelevant international OH&S and pollution control\nlegislation\n2.3\nrelevant international and engineering standards\n\n3. Maintenance\nMay include:\n3.1\nPreventative and remedial maintenance and basic\nrepairs of boiler and related equipment and\ncomponents\n3.2\nRoutine servicing in accordance with established\nprocedures\n3.3\nRoutine visual checks\n3.4\nIdentification of poor performance or faults in the\noperation of boiler systems\n3.5\nIdentification of faulty equipment or fittings and\narranging for repair or replacement\n3.6\nAssisting contractors in repair operations\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n46\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nmaintained the water level and steam pressure of a\nboiler on a vessel\n1.2\nfollowed safety and hazard control procedures\n1.3\ncommunicated effectively with others when monitoring\nand maintaining the water level and steam pressure of\na boiler in a vessel\n\n2. Required Knowledge 2.1\nKnowledge of relevant maritime regulations\n2.2\nRelevant OH&S and pollution control legislation and\ncodes of practice\n2.3\nStatutory requirements for the operation and\nmaintenance of boiler in a vessel\n2.4\nTypes of boiler used on vessels up to 750 kW\npropulsion power, including their principle features and\noperating characteristics\n2.5\nBasic construction of boilers, including fittings that\ncomplies with safety and statutory requirements\n2.6\nBasic principles of operation and safety of boilers and\nfeed systems, steam engines and turbines, including\nthe care of boilers and their fittings and basic feed\nwater systems, testing and treatment\n2.7\nProcedures for the operation and routine maintenance\nboiler on vessels\n2.8\nBasic properties of steam\n2.9\nProcedures for the use of gauges and meters to\nmonitor and measure performance\n2.10 The causes, effects of, and methods of detection of\nboiler water contamination\n2.11 Hazard control precautions and procedures relevant to\nthe operation and routine maintenance of boiler\n2.12 Typical problems related to the operation and\nmaintenance of boiler systems on vessels and\nappropriate diagnostic action and related solutions\n2.13 Precautions that must be taken to minimize danger of\nfire or explosion.\n\n3. Required Skills\n3.1\nCommunication skills\n3.2\nObserving safety precautions\n3.3\nUsing personal protective equipment\n\n4. Resource\nImplications\nThe following resources should be provided :\n4.1\nappropriately illuminated and ventilated\nworkplace/area\n4.2\ntools and equipment appropriate in the operating\nand maintaining the water level and steam pressure\nof a boiler\n4.3\nmaterials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nPractical demonstration with oral questioning\n5.2\nPortfolio (e.g. approved in-service and training ship\nexperiences, etc.)\n5.3\nWritten examination\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in simulated\nworkplace setting or accredited assessment center\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n47\nUNIT OF COMPETENCY\n:\nOPERATE EMERGENCY EQUIPMENT AND APPLY\nEMERGENCY PROCEDURES\n\nUNIT CODE\n:\nMTM816313\n\nUNIT DESCRIPTOR\n:\nThis unit involves the knowledge, skills and attitude to\napply emergency procedure and operate emergency\nrelated to the engine-room watchkeeping.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1. Respond to\nemergencies\n1.1\nEmergencies are correctly recognized and\nidentified.\n1.2\nResponse to an emergency situation is established\nfollowing the vessel’s emergency response\nprocedures.\n1.3\nInitial action is undertaken on discovery of an actual\nor potential emergency in accordance with\nestablished vessel procedures.\n1.4\nInformation given on raising alarm is prompt,\naccurate, complete and clear.\n\n2. Follow established\nemergency procedures\n2.1\nVessel’s contingency plans for emergency\nresponse are known and are implemented in real\nand simulated emergency situations.\n2.2\nEscape routes and internal/external communication\nand alarm systems are correctly used in real and\nsimulated emergency situations in accordance with\nregulatory requirements and established procedures.\n2.3\nEmergency communications and alarm signals and\nsystems are understood and required action\nimplemented in accordance with emergency\nprocedures and regulatory requirements.\n\n3. Follow procedures for\nthe operation of\nemergency equipment\n3.1\nLocation of emergency equipment is identified.\n3.2\nLocation of the posted operating procedures for the\nspecific emergency equipment is identified.\n3.3\nProcedures for the use of various emergency\nequipment are followed in accordance with\nregulatory requirements, manufacturer’s instruction\nand company procedures.\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergencies\nMay include:\n1.1\nCollision with another vessel\n1.2\nExplosion on board vessel\n1.3\nImpairment of integrity of hull and ingress of water\n1.4\nLoss of steering control\n1.5\nLoss of motive power\n1.6\nFoundering\n1.7\nGrounding\n1.8\nBeaching a vessel\n1.9\nPerson overboard\n1.10 Rescue and evacuation of injured personnel\n1.11 Oil pollution\n1.12 Piracy/armed robbery/stowaways\n\n2. Contingency plans\nMay include:\n2.1\nContingency plan in controlling fire or explosion\nemergency\n2.2\nUse of appropriate firefighting equipment and\ntechniques such as various types of fire\nextinguishers, fire blankets, fire hoses and nozzles\nand foam applicators\n2.3\nActivation of fixed fire fighting sprinklers and\nsystems\n2.4\nRemoval of fuel or heat source\n2.5\nBoundary cooling techniques\n2.6\nContingency Plan in controlling flooding emergency\n2.7\nUse of softwood wedges and plugs to reduce water\ningress\n2.8\nErection and application of vertical shoring\n2.9\nConstruction and fitting of a leak-stopping mat\n2.10 Temporary repair of a ruptured pressurized pipe\n2.11 Operation of a portable salvage pump\n2.12 SOPEP and its equipment\n\n3. Emergency equipment\nin the engine room\nwatchkeeping\nMay include:\n3.1\nEmergency generator\n3.2\nEmergency fire pump\n3.3\nEmergency bilge suction\n3.4\nEmergency steering\n3.5\nEmergency compressor\n3.6\nQuick closing valves\n3.7\nGeneral service pump (Diesel driven)\n3.8\nFire dampers\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n49\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nundertook appropriate action in the event of\ndiscovering a shipboard emergency\n1.2\nfollowed vessel’s contingency plans for emergency\nresponse\n1.3\nfollowed procedures for the use of various emergency\nequipment in the engine room watchkeeping\n1.4\nidentified typical problems that may occur during a\nshipboard emergency and take appropriate action\n1.5\ncommunicated clearly and effectively with others\nduring shipboard emergencies\n2. Required Knowledge 2.1\nRelevant maritime regulations dealing with emergency\nequipment and procedures\n2.2\nNavigational emergencies for vessels and appropriate\naction and solutions\n2.3\nIndications of various types of emergency situations\nand the action to be followed when various types of\nactual or potential emergency situations are identified\n2.4\nEmergency alarm signals and systems in use on\nvessels and procedures to be followed when an\nemergency alarm is raised\n2.5\nEscape routes and internal and external\ncommunications systems and alarms on board a\nvessel\n2.6\nGeneral principles of damage and control and the\nmanner in which watertight integrity of hull is\nmaintained on a vessel, including the importance of\npreparation, control and repair\n2.7\nWays of controlling damage during a flooding\nemergency, including the use of various shipboard\nitems that can be used for damage control purposes\nsuch as mattresses, canvas and clothing\n2.8\nMaritime communication techniques used during\nnavigational emergencies\n3. Required Skills\n3.1\nTaking initial action during real and simulated\nemergency situation\n3.2\nImplementing emergency during a real and simulated\nemergency situations\n3.3\nIdentifying and evaluating problems that may occur\nduring an engine room emergency and determining\nappropriate course of action\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nwork place location\n4.2\ntools and equipment required to respond to\nemergencies in engine room watchkeeping\n4.3\nmaterial relevant to the proposed activity and tasks\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through :\n5.1\nPractical demonstration and questioning of related\nunderpinning knowledge\n5.2\nWritten examination\n5.3\nPortfolio (e.g. approved in-service and training ship\nexperiences, etc.)\n6. Context of\nAssessment\n6.1 Competency may be assessed a simulated workplace\nsetting or accredited assessment center\n\n--- PDF PAGE 54 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n50"
}
