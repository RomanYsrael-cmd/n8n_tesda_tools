        "source_title": "MAINTAIN THE CORRECT BOILER WATER LEVELS AND STEAM PRESSURES (For keeping a boiler watch)",
        "source_text": "--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4) \nRevised  June 26, 2013 \n44 \nUNIT OF COMPETENCY \n: \nMAINTAIN THE CORRECT BOILER WATER LEVELS \nAND STEAM PRESSURES  \n(For keeping a boiler watch) \n \nUNIT CODE \n: \nMTM816312 \n \nUNIT DESCRIPTOR \n: \nThe unit covers the knowledge, skills and attitude required \nof a rating forming part of an engine-room watch in \nmaintaining the water level and steam pressure of a boiler \nin a vessel. Vessel may include any commercial vessel up \nto 750 kW propulsion power.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Maintain boiler water \nlevel \n \n1.1 \nBoiler water level is monitored and recorded in \naccordance with established procedures and \nmanufacturer’s instruction. \n1.2 \nAny abnormality in the water level is reported \nimmediately to the engineer on watch.  \n \n2.  Maintain boiler steam \npressure  \n2.1 \nBoiler steam pressure is monitored and recorded in \naccordance with established procedures and \nmanufacturer’s instruction. \n2.2 \n Any abnormality in the steam pressure is reported \nimmediately to the engineer on watch. \n \n3.  Follow safety and \nhazard control \nprocedures \n3.1 \nSafety, hazard minimization and pollution control \nprocedures and regulations are followed at all times \nwhen monitoring operation of boiler.  \n3.2 \nOperational and maintenance hazards are identified \nand action is taken to minimize or eliminate risk to \npersonnel, vessel and the environment. \n3.3 \nWhere relevant, procedures and precautions \nnecessary for entry into confined spaces on a vessel \nare correctly followed. \n3.4 \nAction is taken in the event of failure or emergency to \nisolate and secure the boiler systems and maintain \nthe safety of the vessel and persons involved. \n3.5 \nVessel’s emergency and contingency plans are \nfollowed in the event of a failure or emergency \ninvolving boiler.\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4) \nRevised  June 26, 2013 \n45 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Monitor \nMonitoring and maintaining water level and steam pressure of \nboiler may be conducted: \n1.1 \nby day or night in both normal and emergency \nsituations \n1.2 \nunder any permissible conditions of weather \n1.3 \nwhile underway \n1.4 \nduring berthing and unberthing operations \n1.5 \nwhile anchored or moored \n1.6 \nin dry dock \n1.7 \nwhen bunkering \n1.8 \nduring cargo operations  \n \n2. Regulations \nMay include: \n2.1 \nrelevant IMO Conventions and Codes \n2.2 \nrelevant international OH&S and pollution control \nlegislation \n2.3 \nrelevant international and engineering standards  \n \n3.  Maintenance \nMay include: \n3.1 \nPreventative and remedial maintenance and basic \nrepairs of boiler and related equipment and \ncomponents \n3.2 \nRoutine servicing in accordance with established \nprocedures \n3.3 \nRoutine visual checks \n3.4 \nIdentification of poor performance or faults in the \noperation of boiler systems \n3.5 \nIdentification of faulty equipment or fittings and \narranging for repair or replacement \n3.6 \nAssisting contractors in repair operations\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4) \nRevised  June 26, 2013 \n46 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nmaintained the water level and steam pressure of a \nboiler on a vessel \n1.2 \nfollowed safety and hazard control procedures \n1.3 \ncommunicated effectively with others when monitoring \nand maintaining the water level and steam pressure of \na boiler in a vessel \n \n2.  Required Knowledge  2.1 \nKnowledge of relevant maritime regulations \n2.2 \nRelevant OH&S and pollution control legislation and \ncodes of practice \n2.3 \nStatutory requirements for the operation and \nmaintenance of boiler in a vessel  \n2.4 \nTypes of boiler used on vessels up to 750 kW \npropulsion power, including their principle features and \noperating characteristics \n2.5 \nBasic construction of boilers, including fittings that \ncomplies with safety and statutory requirements \n2.6 \nBasic principles of operation and safety of boilers and \nfeed systems, steam engines and turbines, including \nthe care of boilers and their fittings and basic feed \nwater systems, testing and treatment \n2.7 \nProcedures for the operation and routine maintenance \nboiler on vessels \n2.8 \nBasic properties of steam \n2.9 \nProcedures for the use of gauges and meters to \nmonitor and measure performance \n2.10 The causes, effects of, and methods of detection of \nboiler water contamination \n2.11 Hazard control precautions and procedures relevant to \nthe operation and routine maintenance of boiler \n2.12 Typical problems related to the operation and \nmaintenance of boiler systems on vessels and \nappropriate diagnostic action and related solutions \n2.13 Precautions that must be taken to minimize danger of \nfire or explosion. \n \n3.  Required Skills \n3.1 \nCommunication skills \n3.2 \nObserving safety precautions \n3.3 \nUsing personal protective equipment \n \n4.  Resource \nImplications \nThe following resources should be provided : \n4.1 \nappropriately illuminated and ventilated \nworkplace/area \n4.2 \ntools and equipment appropriate in the operating \nand maintaining the water level and steam pressure \nof a boiler \n4.3 \nmaterials relevant to the proposed activity and tasks \n \n5.  Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nPractical demonstration with oral questioning \n5.2 \nPortfolio (e.g. approved in-service and training ship \nexperiences, etc.) \n5.3 \nWritten examination \n \n6.  Context of \nAssessment \n6.1     Competency may be assessed in simulated \nworkplace setting or accredited assessment center\n",
