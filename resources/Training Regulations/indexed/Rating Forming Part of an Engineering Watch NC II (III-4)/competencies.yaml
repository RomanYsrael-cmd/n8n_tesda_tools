ipated in search and rescue and fire-fighting teams  \n1.3 \napplied OHS principles and policies  when carrying out \nfire-fighting duties  \n1.4 \ncommunicated effectively with others as required during \nfire emergencies \n \n2. Required Knowledge  \n2.1 \nKnowledge of relevant maritime regulations  \n2.2 \nThe chemistry of fire and its relationship  to materials \ntypically carried on vessels  \n2.3 \nPrinciples underlying the spread of fire and how it is \nextinguished  \n2.4 \nThe different types of fire, their characteristics and \nstrategies and equipment needed to extinguish them  \n2.5 \nPrinciples and procedures for the use of self-contained \nbreathing apparatus  (SCBA) when fighting fires  \n2.6 \nFire-fighting clothing, outfits and personal safety \nequipment used when fighting a fire onboard a vessel  \n2.7 \nTypes fire-fighting appliances, equipment and  systems \nused on board vessels, their features, principles of \noperation and the procedures for their use and \nmaintenance  \n2.8 \nFixed fire prevention and extinguishing installations  \nused on vessels and their principles of operation  \n2.9 \nFire-fighting techniques, agents and precautions \napplicable to different types of fire on board a vessel  \n2.10 \nMaritime communication techniques applicable to  fire-\nfighting activities onboard a vessel  \n2.11 \nTypical problems that can occur with shipboard fire-\nfighting equipment and operations and appropriate \nremedial action and solutions  \n2.12 \nSources of information on shipboard fire prevention and \nextinguishment \n \n3. Required Skills \n3.1 \nApplying fire prevention measures and procedures  \n3.2 \nIdentifying fire fighting problems and determining \nappropriate courses of action  \n3.3 \nParticipating as a member of an interior search and \nrescue and fire-fighting team on board a vessel  \n3.4 \nDetermining the operational capability of fire-fighting \nappliances, equipment and systems \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nwork place with recommended facilities \n4.2 \ntools and equipment appropriate to the activity \n4.3 \nmaterials relevant to the proposed activity and tasks \n \n5. Methods of Assessment Competency in this unit must be assessed through: \n5.1 \nDemonstration  and questioning of  related underpinning \nknowledge \n5.2 \nWritten examination \n5.3 \nPortfolio \n \n6. Context of Assessment \n6.1      Competency may be assessed in workplace or in a \nsimulated workplace setting\n",
