          "source_text": "1. Operate portable fire-\nfighting equipment \n \n1.1 \nType of fires is correctly identified in accordance with \naccepted fire-fighting practice.  \n1.2 \nCorrect portable fire-fighting equipment is selected \nand used to fight specific classes of fires.  \n1.3 \nClass F fires are correctly extinguished with a fire \nblanket in accordance with accepted fire-fighting \npractice.  \n1.4 \nCorrect techniques are applied for the use of hose lines \nto extinguish fires on board a vessel. \n1.5 \nWhere applicable, correct techniques are applied for \nthe setting up of foam making equipment to extinguish \nB Class fires on board a vessel.  \n \n2. Carry out fire-fighting \noperations \n2.1 \nFire is extinguished using appropriate procedures, \ntechniques, equipment and fire-fighting agents.  \n2.2 \nCorrect portable fire-extinguisher(s) are selected and \nused for the class of fire involved in a fire emergency.  \n2.3 \nAppropriate safety clothing, appliances and \nequipment is used and safety precautions and \nprocedures are applied when fighting fires in \naccordance with regulatory requirements, vessel’s \nprocedures and established fire-fighting practice.  \n2.4 \nThe timing and sequence of individual actions when \nfighting fires onboard a vessel are appropriate to the \nprevailing circumstances and conditions. \n2.5 \nSearch and rescue operations in a smoke filled \nenvironment are correctly conducted as a member of a \nfire-fighting team in accordance with accepted fire-\nfighting practice.  \n2.6 \nInterior fires are extinguished using appropriate fire-\nfighting equipment and procedures as a member of a \nfire-fighting team in accordance with accepted fire-\nfighting practice.  \n2.7 \nLifeline signals are correctly used during interior fire-\nfighting operations.\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4) \nRevised  June 26, 2013 \n22 \nRANGE OF VARIABLES \n