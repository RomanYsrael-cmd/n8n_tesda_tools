        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency  \nAssessment requires evidences that the candidate: \n1.1 \nidentified and followed workplace procedures for hazard \nidentification and risk control  \n1.2 \ncontributed to arrangements for the management of OHS \nonboard a vessel \n1.3 \nunderstood and taken necessary actions to control \nfatigue \n1.4 \ncompleted OHS records as required \n1.5 \ncommunicated effectively with others on workplace safety \nmatters \n2. Required \nKnowledge  \n2.1 \nKnowledge of relevant maritime and OHS regulations \n2.2 \nISM Code Safety Management System procedures (where \napplicable) \n2.3 \nThe provisions of OHS Acts, regulations and codes of practice \nrelevant to the workplace, including the rights and \nresponsibilities of the workplace parties under OHS Acts, \nregulations and codes of practice; \n2.4 \nThe ways in which OHS is managed in the workplace, and \nactivities required under OHS legislation, for example: \n2.4.1  policies \n2.4.2  procedures \n2.4.3  plant and equipment maintenance \n2.4.4  hazard identification \n2.4.5  risk assessment and control \n2.4.6  OHS instruction \n2.4.7  training and provision of OHS information \n2.5 \nHazards that exist in the workplace \n2.6 \nThe preferred order of ways to control risks (known as the \nhierarchy of control); \n2.7 \nWorkplace OHS procedures relevant to the work being \nundertaken, including procedures for: \n2.7.1  recognizing and reporting on hazards, for example, work \narea inspections \n2.7.2  work operations to control risks, for example, permit to \nwork systems and isolation procedures \n2.7.3  responding to accidents, fires and emergencies \n2.7.4  raising OHS issues \n2.7.5  employee participation in OHS management, for \nexample, consultative or OHS committees and \n2.7.6  joint employer/employee inspections \n2.8 \nThe meaning of OHS symbols found on signs and labels in the \nworkplace \n2.9 \nDesignated personnel responsible for OHS onboard a vessel \n2.10 Effects of sleep, schedules, and the circadian rhythm on \nfatigue \n2.11 Effects of physical stressors on seafarers \n2.12 Effects of environmental stressors in and outside the ship and \ntheir impact \n2.13 Effects of schedule changes on seafarer fatigue\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4) \nRevised  June 26, 2013 \n37 \n \n3. Required Skills \n3.1 Applying OHS in the workplace, and activities required  \nunder OHS legislation, \n3.2 Applying order of ways to control risks (known as the \nhierarchy of control) \n3.3 Designating personnel responsible for OHS onboard a \nvessel \n3.4 Communication skills \n \n4. Resource  \nImplications  \nThe following resources should be provided: \n4.1 simulated workplace environment \n4.2 workplace standards, procedures, policies, guidelines \n4.3 tools and equipment relevant to work activities \n \n5. Methods of \nAssessment     \n \nCompetency in this unit may be assessed through: \n5.1 Observation/simulated practical demonstration in the \napplication of safe working practices and safety hazard \ncontrol onboard a vessel \n5.2 Simulation/role plays to test the candidate’s knowledge \nand skills in the application of safe working practices and \nhazard control and safety hazard control on a \ncommercial/or training vessel \n \n6. Context of \nAssessment \n6.1   Assessment may be conducted in the workplace or in \nsimulated work environment",
