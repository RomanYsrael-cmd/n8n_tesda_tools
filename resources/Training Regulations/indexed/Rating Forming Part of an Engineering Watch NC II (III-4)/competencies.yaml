        "source_title": "CARRY OUT A WATCH ROUTINE APPROPRIATE TO THE DUTIES OF A RATING FORMING PART OF ENGINE ROOM- WATCH",
        "source_text": "--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4) \nRevised  June 26, 2013 \n41 \nCORE COMPETENCIES \n \n UNIT OF COMPETENCY \n: \nCARRY OUT A WATCH ROUTINE APPROPRIATE TO THE \nDUTIES OF A RATING FORMING PART OF ENGINE \nROOM- WATCH \n \nUNIT CODE \n: \nMTM816311 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \ncarry out a watch routine appropriate to the duties of a rating \nforming part of engine room watch. This includes handling \nover and relief of the engineering watch, correct internal \ncommunications and the monitoring of the operation of the \nperformance of the main propulsion, auxiliary system and \nassociated controls. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Perform engine room \nwatchkeeping \nprocedures \n1.1 Machineries and equipment are identified and used \naccording to their functions. \n1.2 The conduct of handover and relief of the engine room watch \nis carried out/provided in conformity with accepted principles \nand vessel’s procedures. \n1.3 Watchkeeping principles and procedures are applied in \naccordance with established marine engineering practice and \nregulatory requirements. \n1.4 A safe engineering watch is achieved based on the accepted \nbridge and engine room resource management principles and \nprocedures. \n1.5 Engine room watch keeping is carried out in accordance with \nsafe working practice.  \n1.6 Clear and concise communication is acknowledged in a \nseaman like manner. \n1.7 Internal communication and engine room various alarm \nsystems are identified and responded in real and simulated \nemergency situations in accordance with regulatory \nrequirements and established procedures. \n1.8 Emergency communications and alarm signals and systems \nare understood and required action implemented is in \naccordance with emergency procedures and regulatory \nrequirements.             \n2. Respond to \nmalfunction and \nemergency situations \n2.1 Emergency duties performed are in accordance to shipboard \nprocedures. \n2.2 Escape routes from machinery spaces are correctly used in \nreal and simulated emergency situation in accordance with \nregulatory requirements and established procedures. \n2.3 The location of firefighting equipment is identified and the \nequipment is used according to the manufacturer’s instruction. \n2.4 Emergency and abnormal situations are identified, reported \nand appropriate action is undertaken in accordance with \ninstructions and regulatory requirements.  \n2.5 Malfunctions of the main propulsion and auxiliary systems are \nidentified, reported and appropriate action is undertaken in \naccordance with operating manual instructions.  \n2.6 Clear and concise communication is acknowledged in a \nseamanlike manner. \n2.7 Engine room emergency is reported immediately and \nappropriate action is undertaken.   \n3. Record operating \nparameters \n3.1 Appropriate entries pertaining to the engineering watch are \nrecorded in the engine room book as per standard operating \nprocedures. \n3.2 Any deviation from the normal parameters is reported \nimmediately to the engineer on watch.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4) \nRevised  June 26, 2013 \n42 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Machineries and \nequipment \nMay include: \n1.1     Machineries  \n1.1.1 Main propulsion plant \n1.1.2 Auxiliary machineries \n1.1.3 Auxiliary engines \n1.2 \nEquipment \n1.2.1 Safety equipment \n1.2.2 Workshop equipment \n1.2.3 Lifting equipment  \n \n2. Watchkeeping \nprinciples \nMay include: \n2.1 \nMaintenance of safe engineering watch   \n2.2 \nAvoidance of pollution of the marine environment \n2.3 \nAppropriate assistance must be available to be \nsummoned to the engine room if required by a \nchange in the vessel’s operational situation \n \n3. Alarm signals and \nsystems \nMay include: \n3.1 \nAlarm signals  \n3.1.1 General alarm \n3.1.2 Fire alarm \n3.2 \nAlarm systems  \n3.2.1 Engine room alarm \n3.2.2 Fire extinguishing gas alarm \n \n4. Emergencies  \nMay include: \n4.1 \nLoss of propulsion or / and steerage \n4.2 \nFlooding of engine room \n4.3 \nFire or explosion in engine room \n4.4 \nBreakdown and failure of refrigeration system \n4.5 \nMalfunction of fresh water generator \n4.6 \nFuel oil, lubrication oil, steam and gas leaks \n4.7 \nBreakdown of generating set \n4.8 \nPump failure  \n4.9 \nOverheating and overspeeding of machinery \nwhich result in  emergency trips\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4) \nRevised  June 26, 2013 \n43 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate:  \n1.1 \nperformed engine room watchkeeping arrangements \nprocedures \n1.2 \nundertook appropriate action in the event of engine \nmalfunction and emergency \n1.3 \nfulfilled engineering watchkeeping responsibilities \n1.4 \ncommunicated clearly and effectively with others in the \ncourse of watchkeeping duties \n1.5 \nrecorded operating parameters in the engine room \nlogbook     \n \n2. Required Knowledge  2.1 \nKnowledge of sections of IMO STCW Code on Safe \nEngineering Watch \n2.2 \nDuties and responsibilities of an engine rating forming \npart of the engineering watch on both manned and \nUMS vessels with respect to safety of personnel and \nvessel, when taking over, keeping and handling over a \nwatch \n2.3 \nBoiler plant systems \n2.4 \nMain engine systems \n2.5 \nDiesel alternator systems \n2.6 \nTurbo alternator system  \n2.7 \nAuxiliary systems of the engine \n2.8 \nTerms used in machinery spaces and names of \nmachinery and equipment \n2.9 \nEngine room watchkeeping procedures \n2.10 Basic environmental protection procedures \n2.11 Engine room alarm systems \n \n3. Required Skills \n \n3.1 \nOperation and maintaining vessel’s main and auxiliary \nsystems including start up, normal running, shut down \nand emergency situations \n3.2 \nOperating main and auxiliary machinery monitoring \ndevices \n3.3 \nPerforming safe working practices for machinery and \nenclosed spaces \n3.4 \nIsolating main and auxiliary engine safely prior to work \ncommencing  \n3.5 \nWorking principles of fire prevention, detection and \nextinguishing \n3.6 \nUsing internal communication system \n3.7 \nRecording operating parameters \n \n4. Resource \nImplications \nThe following resources should be provided : \n4.1 \nworkplace \n4.2 \ntools and equipment appropriate in engine room \nwatchkeeping activities \n4.3 \nmaterials relevant to the activity and tasks  \n \n5. Methods of \nAssessment \n \nCompetency in this unit must be assessed through : \n5.1 \nPractical demonstration and questioning of related  \nunderpinning  knowledge \n5.2 \nWritten examination \n5.3 \nPortfolio (e.g. approved in-service and training ship \nexperiences, etc.) \n \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed in simulated workplace \nsetting or accredited assessment center\n",
