  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\nAssessment of an individual’s competence leads to the issuance of a Certificate of\nProficiency (COP) in the relevant units of competency.\n\nA Certificate of Proficiency (COP) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the relevant endorsed\nqualification.\n\n1.\nCandidate wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\nAs a rule, the unit/s of competency shall be the benchmark for all assessment under\nthe Training Regulations for Maritime Sector.\n\n2.\nCandidate must have completed the prescribed course of instruction in all the units\nof competency contained in the maritime program and with equivalent sea service\nexperience on a seagoing ship of 750 kW propulsion power or more, before\napplying for assessment and certification for Certificate of Proficiency (COP).\n\n2.1 Every candidate for certification shall:\n\n2.1.1. Be not less than 18 years of age\n2.1.2. Those who have:\n\n2.1.2.1 Completed TESDA-registered program on Rating Forming\nPart Of An Engineering Watch (RFPEW) inclusive of an\napproved seagoing service of not less than two (2) months\nwhere candidate has performed watchkeeping duties under\nthe supervision of the master or officer-in-charge of an\nengineering watch or a qualified rating on board a merchant\nvessel of 750 kW propulsion power or more; OR\n\n2.1.2.2 Graduate of Bachelor of Science in Marine Engineering\n(BSMarE) or undergraduate who completed watchkeeping\nsubjects with an approved sea going service of not less than\nsix (6) months on board seagoing vessel of 750 kW propulsion\npower or more, evidenced by a certificate from the manning\nagency/shipping company with an attestation that the\ncandidate performed engineering watchkeeping functions and\ninvolved in the performance of duties carried out under the\ndirect supervision of the master, the officer-in-charge of the\nengineering watch or a qualified rating.\n\n2.1.3\nMeet the standard of competence specified in this Training\nRegulations.\n\n3.\nCandidates for a COP on RFPEW shall be required to undergo assessment using\nthe assessment methodologies identified in the unit of competency.\n\n4.\nConduct of assessment and issuance of certificates shall follow the procedure\nmanuals and implementing guidelines developed for the assessment and\ncertification of RFPEW as institutionalized by and between TESDA and MARINA\nthrough a Memorandum of Agreement (MOA).\n\n5.\nCandidates who are found to be competent under the qualification for RFPEW as\ncontained in Section 1 shall be awarded with the corresponding Certificate of\nProficiency (COP).\n\n--- PDF PAGE 65 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n61\n\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\n\nBASIC\nCOMPETENCIES\n"
}
