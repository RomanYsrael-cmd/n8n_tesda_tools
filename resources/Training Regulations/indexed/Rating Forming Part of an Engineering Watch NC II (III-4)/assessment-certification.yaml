  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\nAssessment of an individual’s competence leads to the issuance of a Certificate of\nProficiency (COP) in the relevant units of competency.\n\nA Certificate of Proficiency (COP) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the relevant endorsed\nqualification.\n\n1.\nCandidate wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\nAs a rule, the unit/s of competency shall be the benchmark for all assessment under\nthe Training Regulations for Maritime Sector.\n\n2.\nCandidate must have completed the prescribed course of instruction in all the units\nof competency contained in the maritime program and with equivalent sea service\nexperience on a seagoing ship of 750 kW propulsion power or more, before\napplying for assessment and certification for Certificate of Proficiency (COP).\n\n2.1 Every candidate for certification shall:\n\n2.1.1. Be not less than 18 years of age\n2.1.2. Those who have:\n\n2.1.2.1 Completed TESDA-registered program on Rating Forming\nPart Of An Engineering Watch (RFPEW) inclusive of an\napproved seagoing service of not less than two (2) months\nwhere candidate has performed watchkeeping duties under\nthe supervision of the master or officer-in-charge of an\nengineering watch or a qualified rating on board a merchant\nvessel of 750 kW propulsion power or more; OR\n\n2.1.2.2 Graduate of Bachelor of Science in Marine Engineering\n(BSMarE) or undergraduate who completed watchkeeping\nsubjects with an approved sea going service of not less than\nsix (6) months on board seagoing vessel of 750 kW propulsion\npower or more, evidenced by a certificate from the manning\nagency/shipping company with an attestation that the\ncandidate performed engineering watchkeeping functions and\ninvolved in the performance of duties carried out under the\ndirect supervision of the master, the officer-in-charge of the\nengineering watch or a qualified rating.\n\n2.1.3\nMeet the standard of competence specified in this Training\nRegulations.\n\n3.\nCandidates for a COP on RFPEW shall be required to undergo assessment using\nthe assessment methodologies identified in the unit of competency.\n\n4.\nConduct of assessment and issuance of certificates shall follow the procedure\nmanuals and implementing guidelines developed for the assessment and\ncertification of RFPEW as institutionalized by and between TESDA and MARINA\nthrough a Memorandum of Agreement (MOA).\n\n5.\nCandidates who are found to be competent under the qualification for RFPEW as\ncontained in Section 1 shall be awarded with the corresponding Certificate of\nProficiency (COP).\n\n--- PDF PAGE 65 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n61\n\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\n\nBASIC\nCOMPETENCIES\nCOMPETENCY MAP\nFor Maritime Sector\nPerform\nmaintenance and\nsanitation of galley\nequipment and\nPerform cargo\nhandling and\nstowage at the\nsupport level\nPerform marine\nengineering at\nthe support level\nCarry out a watch\nroutine appropriate\nto the duties of\nrating forming part\nof an engine room\nt h\nSteer the ship and\nalso comply with\nhelm orders in the\nEnglish language\nPerform\nvictualing\nservices\nPerform\nhousekeeping\nservices\nPerform safe usage\nof electrical\nequipment at the\nsupport level\nMaintain the\ncorrect boiler\nwater levels and\nsteam pressure\nKeep a proper\nlook-out by sight\nand hearing\nSupervise the\nmaintenance and\nsanitation of galley\nequipment and\nutensils and related\nareas\nPerform mess hall\nservice\nPerform\nmaintenance and\nrepair at the\nsupport level\nOperate emergency\nequipment and\napply emergency\nprocedures\nContribute to\nmonitoring and\ncontrolling a safe\nwatch\nProvide assistance\nin receiving and\nstoring provisions\nAssist engineer\nin the\nmaintenance of\nmain engine\nOperate emergency\nequipment and apply\nemergency\nprocedures\nPrepare and\ncook meat dishes\nPrepare stocks,\nsauces and soups\nEstablish and\nmaintain catering\nstandards\nControl the operation\nof the ship and care\nfor persons on board\nat the support level\nPerform\nnavigation at the\nsupport level\nSupervise\npreparation of\nmeals\nPrepare bread\nproducts and hot\nand cold desserts\nPrepare and\ncook seafood\nPrepare and\ncook poultry\nproducts\nPrepare side\ndishes and\nbreakfast meal\nPrepare\nappetizers, salads\nand sandwiches\n(hot and cold and\nopen)\nTake precautions to\nprevent pollution of\nthe marine\nenvironment\nComply with\nemergency\nprocedures\nTake immediate\naction upon\nencountering an\naccident or other\nmedical emergency\nFight and\nextinguish fire\nMinimize the risk of\nfire and maintain a\nstate of readiness to\nrespond emergency\nsituations involving\nfi\nSurvive at sea in\nthe event of ship\nabandonment\nPerform stock\ncontrol\nWork within\nmulti-cultural and\nreligious\nenvironment\nProtect marine\nenvironment/ waste\nsegregation mgmt.\nObserve catering\nhealth and safety\npractices\nPractice food\nsafety, sanitation\nand hygiene\nObserve\npersonal hygiene\nObserve safe\nworking\npractices\nLead small teams\nLead in workplace\ncommunication\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nWork with others\nReceive and\nrespond to\nworkplace\ncommunication\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\noccupational\nhealth and\nsafety\nd\nPractice career\nprofessionalism\nPractice basic\nhousekeeping\nprocedures\nDemonstrate\nwork values\nUse relevant\ntechnologies\nUse mathematical\nconcepts and\ntechniques\nDemonstrate\nsecurity\nawareness\npractices\nPerform\nmaintenance and\nrepair at the\nsupport level\n\n--- PDF PAGE 66 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n62\nDEFINITION OF TERMS\n\n1.\nAuxiliary\nmachinery\nis a diesel engine that acts as prime mover from a ship\ngenerator. The other machineries found inside the engine\nroom other than the auxiliary engine and main engine.\n\n2.\nBallasting/\nDeballasting\ntransferring, taking in or discharging water ballast. It is\nusually arranged to work the bilges, fire system, or sanitary\ncirculation as required.\n\n3.\nBilge\nthe lowest part of hull next to the keelson\n\n4.\nBlueprints\na contact print, with white line on blue background of a\ndrawing; made on linen or a ferro-prusiate paper and\ndeveloped in water or special solution.\n\n5.\nBoat Falls\nthe rope over in one or more blocks as a hoisting rig or\ntackle, the permanently secured end of which is called the\nstanding part, it’s working end the hauling part.\n\n6.\nBunkering\nthe process of loading, storage of solid or liquid fuel oil in\ncontainers, tanks from which the fuel can be continuously or\nintermittently withdrawn the ship fuel oil storage tank.\n\n7.\nCondenser\na heat transfer device that reduces a thermodynamic fluid\nfrom its vapor phase to its liquid phase.\n.\n8.\nCrankcase\nthe housing from a crankshaft of an engine\n\n9.\nCylinder head\nthe cap that serves to close the end of the piston chamber or\nreciprocating engine, pump or compressor\n\n10. Economizer\na force flow, once-throw, conviction-heat –transfer tube bank\nin which boiler feed water is raised to boiling temperature to\nproduce steam by using the heat generated from internal\ncombustion\n\n11. Engine Room\nspace in which a vessel’s main propulsion and auxiliary\nengines\n\n12. Governor\na device, especially one acquitted by centrifugal force of\nwhirling weight oppose by gravity or by spring used to\nprovide automatic control of speed or power of a prime\nmover.\n\n13. Heat exchanger\nany device that transfer heat from one fluid to another or to\nthe environment.\n\n14. Jacob’s Ladder\na handy rope-sided ladder having wood rungs which are set\nbetween strands of, and seized to the rope used for passage\nto or from an over side stage, boat boom\n\n--- PDF PAGE 67 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n63\n\n15. Lashing\na fastening made by a piece of cordage, chain, or wire in\nsecuring a movable object or uniting two or more parts or\nobjects together.\n\n16. Liferaft\na passenger ship equipment covering deficiency if any, in\nlifeboat capacity for all persons on board.\n\n17. Major maintenance\nany maintenance job, which requires the shut down of the\nequipment to be maintained and requires big or large\nresources\n\n18. Man over board\nalarm cry when a person falls into the water.\n\n19. Manipulate\nto work, operate, or when a person falls into the water.\n\n20. Minor maintenance\nany maintenance job, which can be performed by a single\nperson with ease and few resources.\n\n21. Monitor\nto watch, to check on or regulate the performance of a\nmachine.\n\n22. Motorman\nis a rating forming part of an engineering watch and provides\nsupport in all engineering tasks in tanker ships.\n\n23. Nozzle\na tube like device, usually streamlined, accelerating and\ndirecting fluid, whose pressure decreases as it leaves the\nnozzle.\n\n24. Oiler\nIs a rating forming part of an engineering watch and provides\nsupport in all engineering tasks in ships except tanker\n\n25. Parameter\nis a quantity, which is constant in a given set of conditions,\nbut may be different under other condition.\n\n26. Preventive\nmaintenance\nto feed furnish internal combustion engine or may be\ndifferent under other condition.\n\n27. Sea chest\na pipe between s hip’s side and a valve in the hull from\ndraining water.\n\n28. Sounding\nmeasurement used to ascertain the depth of water by a lead\nline sounder and pathometers.\n\n29. Tank sounding\nthe level of the cargo inside the tank.\n\n30. Valve\na gate or a variable orifice that is used to regulate the flow of\nliquid sludge a precipitate/residue from oil.\n\n31. Wash Paint\nthe process of cleaning, washing and drying inside the\nengine rooms.\n\n--- PDF PAGE 68 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\n\nDECK DEPARTMENT\n\nCAPT. RODOLFO A. ASPILLAGA\nTechnical Consultant\nMARINA-STCW Office\n6th Floor Parkview Plaza, 984 Taft Ave. cor.\n T. M. Kalaw, Ermta, Manila\nCAPT. EDWIN M. ITABLE\nVice-President\nMaster and Mates Association of the Philippines\n(MMAP)\nRm. 503/504, 5th Floor, CTC Commercial Bldg.\nPedro Gil cor. Taft Ave., Malate, Manila\nThe PARTICIPANTS in the Validation of these Training Regulations\nCAPT. JONATHAN V. TABINO\nUFS\nCAPT. FERNANDO J. ALANO\n FAME\nCAPT. SIMEON E. FLORES\nPHILSAFE/MMAP\nCAPT. PEDRO U. BERIÑA, JR.\nNEWSIM\nCAPT. FIDEL V. OJERA\nPHILCAMSAT\nCAPT. VICTOR DEL PRADO\nFAME-FILSCAPT\nCAPT. DANNY S TAMPUS\nUFS\n\nENGINEERING DEPARTMENT\n\nC/E DIOSDADO G. RAMOS\nGeneral Manager\nMonsoon Maritime Services Phils., Inc.\nUnit 103, G/F Marbella Manila Bldg. 2071\nRoxas Blvd., Malate, Manila\n\nC/E FERDINAND R. PASCUA\nMember,\nBoard of Marine Engineer Officers\nProfessional Regulation Commission (PRC) P.\nParedes St. cor. Morayta St.\nSampaloc, Manila\nC/E JANVIER PATRICK ROSETE\nTraining Manager for STCW\nAJ Center for Excellence\n2/F Delgado Bldg., 637 Bonifacio Drive\nSouth Harbor, Port Area, Manila\n\nThe PARTICIPANTS in the Validation of these Training Regulations\nC/E ANTONINO R. GASCON\nPROTECT MARINE\nC/E SOLIMAN V. DILAG\nEXACT\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\n\nQSO"
