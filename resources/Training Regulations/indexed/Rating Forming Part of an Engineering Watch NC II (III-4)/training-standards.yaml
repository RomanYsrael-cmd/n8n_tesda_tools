sment\nApproach\n6. Take\nprecautions to\nprevent\npollution of\nthe marine\nenvironment\n6.1 Practice compliance with\nlegislative requirements for\nprotection of the marine\nenvironment\n6.2 Practice anti-pollution\nprocedures\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n7. Observe safe\nworking\npractices\n7.1 Identify and follow\nworkplace procedures for\nhazard identification and\nrisk control\n7.2 Contribute to arrangements\nfor the management of\noccupational health and\nsafety\n7.3 Understand and take\nnecessary actions to\ncontrol fatigue\n7.4 Complete occupational\nhealth and safety records\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n8. Demonstrate\nsecurity\nawareness\npractices\n8.1 Contribute to the\nenhancement of maritime\nsecurity through\nheightened awareness\n8.2 Recognize security threats\n8.3 Understand the need for\nand maintaining security\nawareness and vigilance\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\nNOTE: *Trainee-applicant who already possesses the relevant certificate of training and/or\ncertificate of competency on Basic Safety Training (BST) and Security Awareness\nTraining shall not be required to undergo training or certification on Common\nCompetencies.\n\n--- PDF PAGE 57 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n53\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Carry out a\nwatch routine\nappropriate to\nthe duties of\nrating forming\npart of an\nengine-room\nwatch\n\n1.1 Perform engine room\nwatch keeping\nprocedures\n1.2 Respond to malfunction\nand emergency\nsituations\n1.3 Record operating\nparameters\n• Lecture\n• Demonstrations\n• Discussions\n• Hands-on/\nSimulation\n• Observation\n• Practi