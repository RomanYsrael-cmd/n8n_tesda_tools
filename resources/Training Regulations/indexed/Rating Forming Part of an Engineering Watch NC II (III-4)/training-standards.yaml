    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for RATING FORMING PART OF AN ENGINEERING\nWATCH NC II (STCW Regulation III/4).\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: RATING FORMING PART OF AN ENGINEERING WATCH NC II (STCW\nRegulation III/4)\n\nSuggested Nominal Training Duration: 18 Hours (Basic Competencies)\n60 Hours (Common Competencies)*\n30 Hours (Core Competencies)\n(Plus 2 months approved period of seagoing\nservice)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills, knowledge and\nattitudes of Ratings Forming Part of an Engineering Watch in accordance with STCW\nCodes and Regulations. It covers core competencies such as perform functions of a rating\nforming part of an engine room watch, maintaining the water level and steam pressure (For\nkeeping boiler watch), operating emergency equipment, and applying emergency\nprocedures.\nThis course is also designed to enhance the basic and common knowledge, skills\nand attitudes of an individual in the field of engine seafaring.\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Demonstrati\non\n• Observation\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Group\ndiscussion\n• Interaction\n\n• Demonstrati\non\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Group\ndiscussion\n• Interaction\n\n• Demonstrati\non\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 55 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n51\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Survive at sea\nin the event of\nship\nabandonment\n1.1 Respond to the indicated\nemergency\n1.2 Board a survival craft\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Written\n• Questioning\n• Observation\n• Practical\nperformance\n\n2. Minimize the\nrisk of fire and\nmaintain a\nstate of\nreadiness to\nrespond to\nemergency\nsituations\ninvolving fire\n\n2.1 Carry out fire minimization\nprocedures\n2.2 Respond to emergencies\ninvolving fire\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\n performance\n\n3. Fight and\nextinguish\nfires\n3.1 Operate portable fire-\nfighting equipment\n3.2 Carry out fire-fighting\noperations\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n4. Take\nimmediate\naction upon\nencountering\nan accident or\nother medical\nemergency\n\n4.1 Determine the need of\ncasualty\n4.2 Administer first-aid to the\nvictim\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n5. Comply with\nemergency\nprocedures\n5.1 Take action on becoming\naware of an emergency\n5.2 Follow established\nemergency procedures\n5.3 Follow procedures for the\nuse of various life-saving\nequipment\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n\n--- PDF PAGE 56 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n52\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Take\nprecautions to\nprevent\npollution of\nthe marine\nenvironment\n6.1 Practice compliance with\nlegislative requirements for\nprotection of the marine\nenvironment\n6.2 Practice anti-pollution\nprocedures\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n7. Observe safe\nworking\npractices\n7.1 Identify and follow\nworkplace procedures for\nhazard identification and\nrisk control\n7.2 Contribute to arrangements\nfor the management of\noccupational health and\nsafety\n7.3 Understand and take\nnecessary actions to\ncontrol fatigue\n7.4 Complete occupational\nhealth and safety records\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n8. Demonstrate\nsecurity\nawareness\npractices\n8.1 Contribute to the\nenhancement of maritime\nsecurity through\nheightened awareness\n8.2 Recognize security threats\n8.3 Understand the need for\nand maintaining security\nawareness and vigilance\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\nNOTE: *Trainee-applicant who already possesses the relevant certificate of training and/or\ncertificate of competency on Basic Safety Training (BST) and Security Awareness\nTraining shall not be required to undergo training or certification on Common\nCompetencies.\n\n--- PDF PAGE 57 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n53\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Carry out a\nwatch routine\nappropriate to\nthe duties of\nrating forming\npart of an\nengine-room\nwatch\n\n1.1 Perform engine room\nwatch keeping\nprocedures\n1.2 Respond to malfunction\nand emergency\nsituations\n1.3 Record operating\nparameters\n• Lecture\n• Demonstrations\n• Discussions\n• Hands-on/\nSimulation\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n2. Maintain the\ncorrect boiler\nwater levels\nand steam\npressures\n(For keeping\na boiler\nwatch)\n\n2.1 Maintain boiler water\nlevel\n2.2 Maintain boiler steam\npressure\n2.3 Follow safety and\nhazard control\nprocedures\n• Lecture\n• Demonstrations\n• Discussions\n• Hands-on/\nSimulation\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n3. Operate\nemergency\nequipment\nand apply\nemergency\nprocedures\n\n3.1 Respond to emergencies\n3.2 Follow established\nemergency procedures\n3.3 Follow procedures for\nthe operation of\nemergency equipment\n\n• Lecture\n• Demonstrations\n• Discussions\n• Hands-on/\nSimulation\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n--- PDF PAGE 58 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n54\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining program is based both on and off the job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when designing\ntraining programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 59 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n55\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience.\nOther requirements like health and physical requirements are also stated. Passing entry\nwritten examinations may also be indicated if necessary.\n\n•\nMust be 18 years old and above\n•\nMust have completed 10 years Basic Education\n•\nMust have passed the medical examination for eyesight and hearing as per\nDOH Administrative Order No. 2013-0006\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR RATING FORMING PART\nOF AN ENGINEERING WATCH NC II (STCW Regulation III/4)\n\nRecommended list of tools, equipment and materials for a batch of 24 trainees for\nRATING FORMING PART OF AN ENGINEERING WATCH.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n25\npcs.\n• Spanner wrench\n1 unit\n• *Operational marine diesel\nengine, minimum of three\n(3) -cylinder\n25\npairs\n• PPE (Gloves,\ngoggles, ear muff,\nair mask, cover\nall/boiler suit, hard\nhat)\n5 pcs.\n• Vice grip\n5 pcs.\n• Pliers (assorted\nsizes)\n1 unit\n• *Air compressor\n2 sets\n• Adjustable wrench\n(assorted sizes)\n1 set\n• *Oil Separator (open and\ncomplete for demo – non-\noperational )\n10 kls\n• Rags\n(paper/cotton)\n1 set\n• Wrench, combination\nopen/box (assorted\nsizes)\n1 kit\n• First aid kit\n2 pc.\n@\ntype\n• *Thermometer, mercury\n(various ranges)\n2 pails\n• Cleaning solvent\n1 set\n• Wrench, socket\n(assorted sizes)\n2 pcs.\n• Pressostat\n1 sack\n• Saw dust\n2 sets\n@\ntype/\nsize\n• Flat cold chisel\n2 pcs.\n• Thermostat\n1 sack\n• Powder Detergent\nSoap\n1 assy • *Centrifugal pump (non-\noperational)\n2 pcs\n• Hacksaw\n1 pc\n• *Freshwater tank (1 m3)\n\n1 set\n• Ballpeen hammer (3\nsizes)\n1 assy • *Duplex oil filter\nTraining Materials/ Reference\nbooks:\n5 sets\n• Screw drivers (Philips\n& negative, size 5\nmm to 15 mm)\n1 assy\n• *Duplex fuel filter\n\n• Read’s Marine\nEngineering Series\nVol. 12\n2 pcs.\n• Sounding tape\n1 unit.\n• *Marine boiler\n\n• Manuals\n2 sets\n• Pressure Gauges(SI,\nEnglish)\n1\ncu.m.\n• *Fuel-oil tank overhead or\nengine supply\n\n• Catalogs/\nBrochures\n10 pcs\n• Wire brush\n\n• Modules/LEs\n5 pcs.\n• Mop\n\n• CDs/Video tapes\n4 pcs.\n• Shovel\n\n2 pcs\n• Trash bin\n\n5 pcs.\n• Broomstick\n\n5 pcs.\n• Dust pan\n\nNOTE: *The use of simulator (description is listed in the next table) may be used in lieu of actual\nequipment\n\n--- PDF PAGE 60 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n56\n\nSIMULATOR/S\nQTY\nDescription\n1 set\nENGINE ROOM SIMULATORS (ERS) EQUIPMENT\n\n1. The simulated engine room shall as a minimum reflect a typical machinery found\non merchant ships. The following main components shall be simulated and all\nnecessary sub-systems, and all necessary sub-systems included for a low speed\nengine:\n\n— main engine including turbocharger system\n— 2 auxiliary diesel generators\n— lubrication oil separator\n— steering gear system\n— fire pump\n— shaft generator\n— cooling water system including freshwater generation system\n— turbo generator\n— fuel oil Bunkering system\n— fuel oil Settling and Service systems\n— 2 heavy fuel oil separators\n— 1 diesel oil separator\n— steam generation plant including exhaust and oil-fired boilers\n— 2 starting air compressors\n— diesel oil and heavy fuel oil supply to main and auxiliary engines\n— main engine operation from engine room, engine control room and bridge\n— turbocharger system\n— air ventilation system for engine and control room\n— bilge water system including oily water treatment systems\n— stern tube system\n— deck machinery applicable to the ship model\n— ballast system\n— Sewage treatment system.\n\nMedium and High Speed Engines\n\n2. The simulated engine room shall consist of typical machinery found on merchant\nships. The following main components shall be simulated and all necessary sub-\nsystems included for a medium and high speed engine:\n— one or more main engines\n— main SW system\n— 2 auxiliary engines\n— fuel oil tanks\n— fuel oil separator\n— lubrication oil separator\n— main engine(s), including:\n— fresh water system\n— lubrication system\n\n--- PDF PAGE 61 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n57\n— turbocharger system\n— ME SW system.\n— reduction gear system\n— controllable propeller pitch where applicable\n— steam generation system as applicable\n— freshwater generator\n— bilge wells and bilge separation system\n— 2 air compressors\n— steering gear system\n— fire pump\n— electrical power plant\n— deck machinery applicable to the ship model\n— ballast system\n— sewage treatment system\n\nSteam Propulsion\n\n3. The simulation model should reflect main steam related subsystems of an\nactual ship:\n\n— HFO supply system\n— DO supply system\n— boil-off gas supply system if LNG ship is simulated\n— 1 ½ boiler system or twin boiler systems each including:\n— local and remote control systems\n— safety systems\n— burner management system\n— burner system, incl. minimum 3 burners\n— air/flue gas system\n— heating surfaces\n— water/ steam system.\n— main turbine, including:\n — local and remote control systems\n— safety systems\n— throttle control\n— draining and heating system\n— gland sealing system.\n — main reduction gear system including:\n — lubrication system incl. purifier\n— governor sensor system.\n — condenser and condensate feed systems\n— SW circ system\n— aux SW system\n— vacuum pumps\n— condenser condensate level control.\n — atmospheric drain system\n— atmospheric drain tank\n— drain pumps\n— level control.\n\n--- PDF PAGE 62 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n58\n— feed water pre-heaters (one or more)\n— de-aerator system\n— boiler feed water pumps\n— back pressure steam system and auxiliary\n— ballast system\n— deck machinery applicable to the ship model.\n\nElectric Propulsion Motors (Diesel and/or Gas)\n\n4. The simulated engine room shall reflect typical machinery found on merchant\nor passenger ships. The following main components shall, as a minimum be\nsimulated and all necessary sub-systems included for a diesel and/or gas\nturbine electric propulsion plant:\n\n— propulsion electric motor(s)\n— 2 or more high voltage generators\n— 2 or more prime movers (diesel engines or gas-turbines)\n— cooling water system including freshwater generation system\n— fuel oil Bunkering system\n— fuel oil Settling and Service systems\n— fuel oil separator system\n— lubrication oil separator system\n— steam generation plant as applicable\n— starting air and service air system\n— main engine operation from engine room, engine control room and bridge\n— bilge water system including oily water treatment systems.\n— ballast system\n— stern tube system\n— steering gear system\n— deck machinery applicable to the ship model\n-- fire pump\n\nREMARKS:\n\nAbove tools, equipment and materials are applicable for the training delivery of the CORE\nCOMPETENCIES.\n\nThe tools, equipment and materials for the delivery of the COMMON COMPETENCIES shall\ncomply with the standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in\ntheir prescribed and regulated training program in BASIC SAFETY TRAINING (BST) and\nSECURITY AWARENESS TRAINING courses.\n\n--- PDF PAGE 63 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n59\n\n3.5\nTRAINING FACILITIES\n\nBased on a class size of 24 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop/Laboratory area\n\n156\n• Trainee working space\n(Engine Room/ Equipment\nArea\n\n(50 m2 minimum)\n• Trainee Working Space\n(Marine Boiler room)\n\n(50 m2 minimum)\nLecture Room\n 4.00 x 7.00\n28.00\n28.00\nLearning Resource Center\n 4.00 x 5.00\n20.00\n 20.00\nWash/Comfort room\n\n10\n10\nStorage/Tool room\n\n20\n20\nCirculation Area\n\n60\nTotal Area\n\n294\n\nCirculation area = 30% of workshop area + lecture room + LRC\n\n3.6\nTRAINER’S QUALIFICATIONS FOR MARITIME SECTOR\n\nRATING FORMING PART OF AN ENGINEERING WATCH NC II (STCW\nRegulation III/4)\n\nTRAINER QUALIFICATION\n\n•\nMust be licensed Officer-In-Charge of an Engineering Watch and at least with\ntwelve (12) months seagoing service in that position\n•\nMust be proficient in English communication\n•\nMust be a holder of National TVET Trainer Certificate (NTTC) I – Rating\nForming Part of an Engineering Watch NC II (STCW Regulation III/4)\n\nREMARKS:\n\nAbove trainer’s qualifications are applicable for the delivery of the CORE COMPETENCIES.\n\nThe trainer’s qualifications for the delivery of the common competencies shall comply with\nthe standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in their\nprescribed and regulated training in Basic Safety Training (BST) and SECURITY\nAWARENESS TRAINING courses.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 64 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n60"
