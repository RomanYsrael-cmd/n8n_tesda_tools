      "source_text": ", EQUIPMENT AND MATERIALS FOR RATING FORMING PART\nOF AN ENGINEERING WATCH NC II (STCW Regulation III/4)\n\nRecommended list of tools, equipment and materials for a batch of 24 trainees for\nRATING FORMING PART OF AN ENGINEERING WATCH.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n25\npcs.\n• Spanner wrench\n1 unit\n• *Operational marine diesel\nengine, minimum of three\n(3) -cylinder\n25\npairs\n• PPE (Gloves,\ngoggles, ear muff,\nair mask, cover\nall/boiler suit, hard\nhat)\n5 pcs.\n• Vice grip\n5 pcs.\n• Pliers (assorted\nsizes)\n1 unit\n• *Air compressor\n2 sets\n• Adjustable wrench\n(assorted sizes)\n1 set\n• *Oil Separator (open and\ncomplete for demo – non-\noperational )\n10 kls\n• Rags\n(paper/cotton)\n1 set\n• Wrench, combination\nopen/box (assorted\nsizes)\n1 kit\n• First aid kit\n2 pc.\n@\ntype\n• *Thermometer, mercury\n(various ranges)\n2 pails\n• Cleaning solvent\n1 set\n• Wrench, socket\n(assorted sizes)\n2 pcs.\n• Pressostat\n1 sack\n• Saw dust\n2 sets\n@\ntype/\nsize\n• Flat cold chisel\n2 pcs.\n• Thermostat\n1 sack\n• Powder Detergent\nSoap\n1 assy • *Centrifugal pump (non-\noperational)\n2 pcs\n• Hacksaw\n1 pc\n• *Freshwater tank (1 m3)\n\n1 set\n• Ballpeen hammer (3\nsizes)\n1 assy • *Duplex oil filter\nTraining Materials/ Reference\nbooks:\n5 sets\n• Screw drivers (Philips\n& negative, size 5\nmm to 15 mm)\n1 assy\n• *Duplex fuel filter\n\n• Read’s Marine\nEngineering Series\nVol. 12\n2 pcs.\n• Sounding tape\n1 unit.\n• *Marine boiler\n\n• Manuals\n2 sets\n• Pressure Gauges(SI,\nEnglish)\n1\ncu.m.\n• *Fuel-oil tank overhead or\nengine supply\n\n• Catalogs/\nBrochures\n10 pcs\n• Wire brush\n\n• Modules/LEs\n5 pcs.\n• Mop\n\n• CDs/Video tapes\n4 pcs.\n• Shovel\n\n2 pcs\n• Trash bin\n\n5 pcs.\n• Broomstick\n\n5 pcs.\n• Dust pan\n\nNOTE: *The use of simulator (description is listed in the next table) may be used in lieu of actual\nequipment\n\n--- PDF PAGE 60 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n56\n\nSIMULATOR/S\nQTY\nDescription\n1 set\nENGINE ROOM SIMULATORS (ERS) EQUIPMENT\n\n1. The simulated engine room shall as a minimum reflect a typical machinery found\non merchant ships. The following main components shall be simulated and all\nnecessary sub-systems, and all necessary sub-systems included for a low speed\nengine:\n\n— main engine including turbocharger system\n— 2 auxiliary diesel generators\n— lubrication oil separator\n— steering gear system\n— fire pump\n— shaft generator\n— cooling water system including freshwater generation system\n— turbo generator\n— fuel oil Bunkering system\n— fuel oil Settling and Service systems\n— 2 heavy fuel oil separators\n— 1 diesel oil separator\n— steam generation plant including exhaust and oil-fired boilers\n— 2 starting air compressors\n— diesel oil and heavy fuel oil supply to main and auxiliary engines\n— main engine operation from engine room, engine control room and bridge\n— turbocharger system\n— air ventilation system for engine and control room\n— bilge water system including oily water treatment systems\n— stern tube system\n— deck machinery applicable to the ship model\n— ballast system\n— Sewage treatment system.\n\nMedium and High Speed Engines\n\n2. The simulated engine room shall consist of typical machinery found on merchant\nships. The following main components shall be simulated and all necessary sub-\nsystems included for a medium and high speed engine:\n— one or more main engines\n— main SW system\n— 2 auxiliary engines\n— fuel oil tanks\n— fuel oil separator\n— lubrication oil separator\n— main engine(s), including:\n— fresh water system\n— lubrication system\n\n--- PDF PAGE 61 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n57\n— turbocharger system\n— ME SW system.\n— reduction gear system\n— controllable propeller pitch where applicable\n— steam generation system as applicable\n— freshwater generator\n— bilge wells and bilge separation system\n— 2 air compressors\n— steering gear system\n— fire pump\n— electrical power plant\n— deck machinery applicable to the ship model\n— ballast system\n— sewage treatment system\n\nSteam Propulsion\n\n3. The simulation model should reflect main steam related subsystems of an\nactual ship:\n\n— HFO supply system\n— DO supply system\n— boil-off gas supply system if LNG ship is simulated\n— 1 ½ boiler system or twin boiler systems each including:\n— local and remote control systems\n— safety systems\n— burner management system\n— burner system, incl. minimum 3 burners\n— air/flue gas system\n— heating surfaces\n— water/ steam system.\n— main turbine, including:\n — local and remote control systems\n— safety systems\n— throttle control\n— draining and heating system\n— gland sealing system.\n — main reduction gear system including:\n — lubrication system incl. purifier\n— governor sensor system.\n — condenser and condensate feed systems\n— SW circ system\n— aux SW system\n— vacuum pumps\n— condenser condensate level control.\n — atmospheric drain system\n— atmospheric drain tank\n— drain pumps\n— level control.\n\n--- PDF PAGE 62 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n58\n— feed water pre-heaters (one or more)\n— de-aerator system\n— boiler feed water pumps\n— back pressure steam system and auxiliary\n— ballast system\n— deck machinery applicable to the ship model.\n\nElectric Propulsion Motors (Diesel and/or Gas)\n\n4. The simulated engine room shall reflect typical machinery found on merchant\nor passenger ships. The following main components shall, as a minimum be\nsimulated and all necessary sub-systems included for a diesel and/or gas\nturbine electric propulsion plant:\n\n— propulsion electric motor(s)\n— 2 or more high voltage generators\n— 2 or more prime movers (diesel engines or gas-turbines)\n— cooling water system including freshwater generation system\n— fuel oil Bunkering system\n— fuel oil Settling and Service systems\n— fuel oil separator system\n— lubrication oil separator system\n— steam generation plant as applicable\n— starting air and service air system\n— main engine operation from engine room, engine control room and bridge\n— bilge water system including oily water treatment systems.\n— ballast system\n— stern tube system\n— steering gear system\n— deck machinery applicable to the ship model\n-- fire pump\n\nREMARKS:\n\nAbove tools, equipment and materials are applicable for the training delivery of the CORE\nCOMPETENCIES.\n\nThe tools, equipment and materials for the delivery of the COMMON COMPETENCIES shall\ncomply with the standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in\ntheir prescribed and regulated training program in BASIC SAFETY TRAINING (BST) and\nSECURITY AWARENESS TRAINING courses.\n\n--- PDF PAGE 63 ---\nRating Forming Part of an Engineering Watch NC II (STCW Regulation III/4)\nRevised June 26, 2013\n59",
