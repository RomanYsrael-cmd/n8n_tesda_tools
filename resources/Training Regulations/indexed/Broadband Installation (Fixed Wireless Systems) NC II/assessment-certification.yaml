  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Broadband Installation (Fixed\nWireless Systems) NC II, the candidate must demonstrate competency in\nall the units listed in Section 1. Successful candidates shall be awarded a\nNational Certificate II signed by the TESDA Director General.\n\n4.2\nThe qualification of Fixed Wireless Broadband Installation NC II may be\nattained through demonstration of competence through project-type\nassessment covering all the units required in the qualification.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.4.2.\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in\nthe “Procedures Manual on Assessment and Certification” and “Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS)”.\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – BROADBAND INSTALLATION (FIXED WIRELESS SYSTEM) NC II\n\n Page 40\n\n"
