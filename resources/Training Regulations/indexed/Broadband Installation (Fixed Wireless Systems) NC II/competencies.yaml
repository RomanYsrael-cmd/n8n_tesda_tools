        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n.1.\nComplied with standard installation practices and safety\nprocedures at all times during installation\n.2.\nLaid out and installed data cables following job and quality\nrequirements and within agreed time frame\n.3.\nCommunicated and worked with authorities and personnel\nconcerned\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Safety Practices\n1.1.3 Work safety requirements\n1.1.4 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.3.1 Identification of appropriate tools, equipment; and\ndevices and proper usage\n2.3 Theory and Practices\n2.3.1 Wireless Broadband systems overview\n2.3.2 Map reading and identification of network symbols\nand diagrams\n2.3.3 Lay out and installation of CAT5e\n2.3.4 Installation pole hardware and accessories\n2.4 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling, use and maintenance of tools and\nequipment.\n3.4.\nProper handling of CAT5e cables\n3.5.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of\nvariables)\n4.2.\nService vehicle and traffic safety devices\n5. Method of\nassessment\n5.1.\nDirect observation with oral questioning\n5.2.\nPortfolio\n5.3.\nThird Party Report\n5.4.\nDemonstration with oral questioning\n5.5.\nWritten test\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – BROADBAND INSTALLATION (FIXED WIRELESS SYSTEM) NC II\n\n Page 26\n\nUNIT OF COMPETENCY : INSTALL AND CONFIGURE CPE\nUNIT CODE\n:"
