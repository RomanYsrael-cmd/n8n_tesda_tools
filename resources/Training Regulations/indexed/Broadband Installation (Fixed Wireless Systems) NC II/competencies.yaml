        "source_text": "ICT724601\nDESCRIPTOR\n:\nThis unit covers the outcomes required for installing\nmast and accessories. This involves working with a\nteam.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Prepare for mast\ninstallation\n\n1.1 Necessary tools, materials and personal protective\nequipment (PPE) are prepared in line with job\nrequirements.\n1.2 Information on proposed locations and necessary\napprovals from relevant authorities is obtained.\n1.3 Site is cleared and prepared to provide unrestricted\naccess for installation works in accordance with joint pole\nagreement\n1.4 Installation constraints and safety hazards are identified\nand suitable action determined\n2. Install mast,\naccessories\n2.1\nTools, equipment, clothing and safety requirements are\nidentified and obtained for the installation.\n2.2\nTools and equipment are checked to be in good working\norder and adjusted to manufacturers' specifications\n2.3\nFixing structures and devices on mast are installed\nsecurely in accordance with company’s specifications\n2.4\nIdentifier marks are placed on installed mast for\nidentification\n2.5\nGuy-wire assembly is installed and tensioned to required\nspecifications\n2.6\nProblems encountered are referred to appropriate\npersonnel as per standard operating procedures (SOP).\n2.7\nInstallation and design amendments are reported/\ndocumented in accordance with job requirements\n\n--- PDF PAGE 23 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – BROADBAND INSTALLATION (FIXED WIRELESS SYSTEM) NC II\n\n Page 21\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and\nequipment,\nmaterials and\nPPE\nMay include but not limited to:\nTools and equipment:\n1.1\nset of wrenches\n1.2\nset of pliers\n1.3\nextension ladder\n1.4\nset of hammer\n1.5\nset of ropes\n1.6\nelectric drill with different bits\nof various sizes\nMaterials:\n1.7\nset of guy grips/clips\n1.8\nset of guy anchors/ribbons\n1.9\nturnbuckle\n1.10 tie wrap\n1.11 sets of washer, bolts and nuts\n1.12 guy wire\n1.13 rubber cap\n\n1.14 machine bolts\n1.15 wall-mount brackets\n1.16 roof-mount bracket\n\nPPE:\n1.17 body belt & strap\n1.18 hard hat/ helmet\n1.19 set gloves\n1.20 goggles\n1.21 safety shoes\n1.22 tool pouch\n\n2. Relevant\nauthorities\n2.1 homeowner’s association\n2.2 house owners\n2.3 building administrators\n2.4 apartment lessor\n\n3. Fixing\nstructures and\ndevices\n3.1 Fixing structures\n3.1.1. Guy wire\n3.1.2. Guy ribbon\n3.1.3. Guy anchor\n3.1.4. Turnbuckle\n3.2 Fixing devices\n3.2.1. screw hooks\n3.2.2. set of bolts, nuts and washers\n3.2.3. machine bolts – straight\n3.2.4. tex screws\n3.2.5. wallmount / roofmount brackets\n3.2.6. Color coded tapes (Serves as an identifier of\n Company/Installer\n\n4. Types of\ninstallation\n4.1 Roof-mounted\n4.2 Wall-mounted\n4.3 Special or customized installation\n5. Appropriate\npersonnel\n5.1\nleadman/team leader\n5.2\nsupervisor\n6. Installation and\ndesign\namendments\n6.1\ncable re-routing\n6.2\nas-built plan\n\n--- PDF PAGE 24 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – BROADBAND INSTALLATION (FIXED WIRELESS SYSTEM) NC II\n\n Page 22\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Complied with job requirements and safety procedures at\nall times during installation\n1.2.\nInstalled mast, accessories and cables following job\nrequirements and within agreed time frame\n1.3.\nCommunicated and worked with authorities and personnel\nconcerned\n2. Underpinning\nknowledge and\nattitude\n\n2.1\nSafety Practices\n1.1.1 Work safety requirements\n1.1.2 Proper use of tools and equipment\n2.2\nMaterials, Tools and Equipment: Uses and Specifications\n2.2.1 Identification of appropriate tools, equipment; and\ndevices\n2.3 Theory and Practices\n2.2.1 Installation of mast and accessories\n2.2.2 Proper guy installation and tensioning\n2.2.3 Type and size of mast per given height\n2.3\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling and positioning of extension ladder\n3.4.\nProper handling, use and maintenance of tools and\nequipment\n3.5.\nCommunicate effectively\n3.6.\nInterpretation of plans and symbols\n3.7.\nDocumentation skills\n4. Resource\nimplications\n The following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of\nvariables)\n4.2.\nWork area\n4.3.\nService vehicle and traffic safety equipment\n5. Method of\nassessment\n5.1.\nDirect observation with oral questioning\n5.2.\nPortfolio\n5.3.\nThird Party Report\n5.4.\nDemonstration with oral questioning\n5.5.\nWritten test\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 25 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – BROADBAND INSTALLATION (FIXED WIRELESS SYSTEM) NC II\n\n Page 23\n\nUNIT OF COMPETENCY :\nINSTALL AND LAY OUT CABLES\nUNIT CODE\n:"
