        "source_text": "ICT724602\nDESCRIPTOR\n:\nThis unit covers the outcomes required for installing and\nlaying out cables. Cable types are UTP, FTP and\ngrounding cable. This involves working with a team.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Prepare for cable\nlay out and\ninstallation\n\n1.1. Necessary tools, equipment, materials and personal\nprotective equipment (PPE) are prepared in line with\njob requirements.\n1.2. Cable lay out and installation requirements and\nconstraints from plan and site inspection are identified as\nper job requirements\n1.3. Cable lay out and installation equipment is set up in\naccordance with company and job requirements\n1.4. Site is made safe and secure for cable installation\n1.5. Suitable protective clothing is selected and required\nsafety devices used\n1.6. Support structure is assessed as safe for normal\nworking conditions\n1.7. Support structure is assessed to be sound for cable\nsupport as per job requirements\n1.8. Cable route is checked for obstructions and are made\nclear using suitable methods and in coordination with\nauthorities concerned.\n1.9. Where necessary, obstructing cables, lines and pole\nattachments of other carriers are requested to be fixed or\ncorrected to facilitate work of laying out and installing\nnew cables\n2. Lay out and Install\ncable\n2.1\nTools, equipment, clothing and safety requirements are\nidentified and obtained for the lay out and installation.\n2.2\nCable is laid out and installed to required specifications\n2.3\nCable is secured permanently to support structure in\naccordance with standard installation procedures\n2.4\nBending radius tolerance is observed for cable materials\nat all times\n2.5\nProblems encountered are referred to appropriate\npersonnel as per standard operating procedures\n(SOP).\n\n--- PDF PAGE 26 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – BROADBAND INSTALLATION (FIXED WIRELESS SYSTEM) NC II\n\n Page 24\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, equipment\nand materials\nand PPE\n\nMay include but not limited to:\nTools and Equipment:\n1.1\nhammers\n1.2\nextension ladders (12 ft.\nlength)\n1.3\nadjustable wrench\n1.4\nfixing brackets/clamps\n1.5\ndrill/electric drill\n1.6\ntape linen/steel tape\n1.7\nRJ45 crimper\n\nMaterials:\n1.8\ngrounding wire\n1.9\ncable support\n1.10 grounding rod\n1.11 tie wrap\n1.12 terminal lug\n\nMaterials for STP/UTP:\n1.13 RJ45 connectors\n(shielded)\n1.14 RJ45 connectors\n (non-shielded)\n\nPPE:\n1.15 body belt & strap\n1.16 hard hat/ helmet\n1.17 set gloves\n1.18 goggles\n1.19 safety shoes\n1.20 tool pouch\n1.21 safety cones/traffic\nsafety devices\n2. Support structure\n2.1\nRoof\n2.2\nCeiling\n2.3\nPole\n3. Suitable\nmethods of cable\nrouting\n3.1\nDrilling of holes for cable entry/exit\n3.2\nRerouting of cables to nearest possible cable entry/exit\npoints\n4. Appropriate\npersonnel\n4.1\nLeadman/team leader\n4.2\nSupervisor\n\n--- PDF PAGE 27 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – BROADBAND INSTALLATION (FIXED WIRELESS SYSTEM) NC II\n\n Page 25\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n.1.\nComplied with standard installation practices and safety\nprocedures at all times during installation\n.2.\nLaid out and installed data cables following job and quality\nrequirements and within agreed time frame\n.3.\nCommunicated and worked with authorities and personnel\nconcerned\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Safety Practices\n1.1.3 Work safety requirements\n1.1.4 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment: Uses and Specifications\n2.3.1 Identification of appropriate tools, equipment; and\ndevices and proper usage\n2.3 Theory and Practices\n2.3.1 Wireless Broadband systems overview\n2.3.2 Map reading and identification of network symbols\nand diagrams\n2.3.3 Lay out and installation of CAT5e\n2.3.4 Installation pole hardware and accessories\n2.4 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1.\nWork efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling, use and maintenance of tools and\nequipment.\n3.4.\nProper handling of CAT5e cables\n3.5.\nInterpreting plans and symbols\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, equipment, materials and PPE (see range of\nvariables)\n4.2.\nService vehicle and traffic safety devices\n5. Method of\nassessment\n5.1.\nDirect observation with oral questioning\n5.2.\nPortfolio\n5.3.\nThird Party Report\n5.4.\nDemonstration with oral questioning\n5.5.\nWritten test\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – BROADBAND INSTALLATION (FIXED WIRELESS SYSTEM) NC II\n\n Page 26\n\nUNIT OF COMPETENCY : INSTALL AND CONFIGURE CPE\nUNIT CODE\n:"
