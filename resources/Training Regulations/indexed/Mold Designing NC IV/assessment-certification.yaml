      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s of competency of a qualification with a promulgated Training Regulations. 4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.4 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following: a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements as identified by industry 4.1.5 The following are qualified to apply for assessment and certification: a. Graduating students/trainees of NTR programs or graduates of formal, non-formal and informal institutions including enterprise-based training programs related to Mold Designing NC IV b. Industry workers (employed, self-employed or owners/proprietors). Mold Designing NC IV Revision 00 Promulgated 05/21/2019"
