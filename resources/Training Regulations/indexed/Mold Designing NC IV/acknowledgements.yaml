    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Organized and cleaned work area according shop policies and environmental requirements. 2. Resource implications The following resources should be provided: 2.1 Tools, equipment and facilities appropriate to processes or activity 2.2 Materials and documentation relevant to the proposed activity 2.3 Shop policy and/or procedures manual on housekeeping, cleaning and occupational health and safety 3. Method of assessment Competency in this unit may be assessed through: 3.1 Direct observation 3.2 Demonstration or role play 3.3 Written or oral short answer questions 3.4 Identify colleagues/clients who can be approached for the collection of competency evidence, where appropriate 4. Context for assessment 4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center"
    },
