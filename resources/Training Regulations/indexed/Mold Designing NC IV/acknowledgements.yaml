    {
      "source_text": "SECTION 1 MOLD DESIGNING NC IV"
    },
    {
      "source_text": "The MOLD DESIGNING NC IV qualification consists of competencies that the designer must achieve to enable them to perform tasks such as capability of reviewing tools and design, determine the methods to assemble, test and debug complete mold sets."
    },
    {
      "source_text": "This qualification is packaged from the competency map of Mold designing – Metals and engineering sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES MEE722201 MEE722202 MEE722203 MEE722204 MEE722205 MEE722206 MEE722207 MEE722208 MEE722210 MEE722211 ICT311201 Apply safety practices Interpret working drawings and sketches Select/ cut workshop materials Perform shop computations (Basic) Measure workpiece (Basic) Perform routine housekeeping Perform shop computations (Intermediate) Measure workpiece using angular measuring instruments Measure workpiece using gages and surface texture comparator Perform preventive and corrective maintenance Operate a personal computer"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a"
    },
    {
      "source_text": "Mold Designer"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES 500311401 Utilized specialized communication skills 500311402 Develop and lead teams 500311403 Perform higher-order thinking processes and apply techniques in the workplace 500311404 Contribute to the practice of social justice in the workplace 500311405 Manage innovative work instructions 500311406 500311407"
    },
    {
      "source_text": "500311408"
    },
    {
      "source_text": "500311409"
    },
    {
      "source_text": "Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health(OSH) programs, policies and procedures Lead towards improvement of environment work programs, policies and procedures Sustain entrepreneurial skills CODE NO. CORE COMPETENCIES MEE722326 MEE722327 MEE722328 MEE722329 MEE722330"
    },
