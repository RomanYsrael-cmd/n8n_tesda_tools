    {
      "source_text": "UNIT OF COMPETENCY: DEVELOP AND LEAD TEAMS"
    },
    {
      "source_text": "UNIT CODE : 500311402"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to determine individual and team development needs and facilitate the development of the workgroup."
