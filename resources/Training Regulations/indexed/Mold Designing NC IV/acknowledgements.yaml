utting tools\nand equipment\n\n--- PDF PAGE 56 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n52\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Plan/drawings\nMay include:\n1.1 Dimensions\n1.2 Tolerance\n2. Materials\nMay include:\n2.1 Ferrous\n2.2 Non-ferrous\n3. Measuring tools\nMay include:\n3.1 Steel rule\n3.2 Pull-push rule\n4. Cutting\ntools/equipment\nMay include:\n4.1 Hacksaw\n4.2 Power hacksaw\n5. Safety procedure\nSafety involves the handling of:\n5.1 Equipment\n5.2 Tools\n5.3 Materials\n\n--- PDF PAGE 57 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n53\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted plans/drawings\n1.2 Selected natural according to the requirement\n1.3 Performed cutting operation\n1.4 Cutting tools/equipment used safely\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate processes of\nan activity\n2.2 Materials relevant to the proposal activity\n2.3 Drawings/plans\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Oral short answer question\n3.3 Practical exercises\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 58 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n54\n\nUNIT OF COMPETENCY\n:\nPERFORM SHOP COMPUTATIONS (BASIC)\n\nUNIT CODE\n\n:\nMEE722204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to perform basic\ncalculations using the four fundamental operation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform four\nfundamental\noperations.\n1.1 Simple calculations\nperformed using four\nfundamental\noperations.\n1.2 Simple calculations\nperformed involving\nfractions and mixed\nnumbers using four\nfundamental\noperations\n1.1 English and metric\nsystem of\nmeasurement\n\n1.2 Performing\ncalculation using\nfour fundamental\noperation\n\n2. Perform\nbasic\ncalculations\ninvolving\nfractions and\ndecimals\n2.1 Simple calculations\nare performed\ninvolving fractions and\ndecimals using the\nfour fundamental\noperations.\n2.2 Decimal are converted\ninto fraction (and vice\nversa) accurately\n2.1 English and metric\nsystem of\nmeasurement\n\n2.1 Identifying die\nmaterial\nrequirements\n2.2 Determining\nproduction\nvolume\n2.3 Identifying\ndesign\nparameters\n3. Perform\nbasic\ncalculations\ninvolving\npercentages.\n3.1 Simple calculations\nare performed to\nobtain percentages\nfrom information\nexpressed in either\nfractional or decimal\nformat\n3.1 English and metric\nsystem of\nmeasurement\n\n3.1 Performing\ncalculation\n\n4. Perform\nbasic\ncalculation\ninvolving\nration and\nproportion\n4.1 Simple calculations\nare performed\ninvolving ratios and\nproportion using\nwhole numbers,\nfractions and decimal\nfractions.\n4.1 English and metric\nsystem of\nmeasurement\n\n4.1 Performing\ncalculation\n5. Perform\ncalculations\non algebraic\nexpressions\n5.1 Simple calculations\nare performed on\nalgebraic\nexpressions using\nthe four fundamental\noperations.\n5.2 Simple transposition\nof formulae is carried\nout to isolate the\nvariable required,\ninvolving the four\nfundamental\noperations.\n5.1 English and metric\nsystem of\nmeasurement\n\n5.1 Performing\ncalculation\n\n--- PDF PAGE 59 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n55\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Four fundamental\noperations\nMay include:\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n\n2. Algebraic expressions Calculation using formula for determining:\n2.1 tap drill size\n2.2 feed\n2.3 speed\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Using four fundamental operations\n1.2 Involving fractions and mixed numbers\n1.3 Involving fractions and decimals\n1.4 Involving percentages\n1.5 Involving ratio and proportion\n1.6 On algebraic expressions\n1.7 of simple formulae\n\n2. Resource implications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to processes\nor activity\n2.2 Materials relevant to the proposed activity\n\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Written or oral short answer questions\n3.2 Practical exercises\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 60 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n56\n\nUNIT OF COMPETENCY\n:\nMEASURE WORKPIECE (BASIC)\n\nUNIT CODE\n\n:\nMEE722205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to measure\nworkpieces using measuring instruments such as steel\nrules, Vernier calipers, micrometers, etc.….\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and\nuse\nmeasuring\ntools\n1.1 Measuring tools\nare selected and\nused according to\nthe level of\naccuracy required.\n1.2 Measurements\ntaken are accurate\nto the finest\ngraduation of the\nselected measuring\ninstrument.\n1.3 Measuring\ntechnique used is\ncorrect and\nappropriate to the\ndevice used.\n1.1 Types, purposes\nand accuracy of\nmeasuring\ninstruments\n1.2 Capability of\nmeasuring\ninstruments\n1.3 Part dimensions\nand tolerances\n1.4 Techniques for\nmeasuring\ndimensions\n1.5 Care and storage\nprocedure of\nmeasuring tools\n\n1.1 Selecting measuring\ntools\n1.2 Obtaining accurate\nmeasurements\n1.3 Determining\nmeasuring technique\n\n2. Clean and\nstore\nmeasuring\ntools\n2.1 Cleaning of devices\nundertaken\naccording to\nstandard operating\nprocedures.\n2.2 Care of devices\nundertaken\naccording to\nmanufacturer’s\nspecifications.\n2.3 Storage of devices\nundertaken\naccording to\nstandard operating\nprocedures.\n2.1 Types, purposes\nand accuracy of\nmeasuring\ninstruments\n2.2 Capability of\nmeasuring\ninstruments\n2.3 Part dimensions\nand tolerances\n2.4 Techniques for\nmeasuring\ndimensions\n2.5 Care and storage\nprocedure of\nmeasuring tools\n\n2.1 Determining proper\ncare and storage of\nmeasuring tools.\n\n--- PDF PAGE 61 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n57\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring tools\nMay include\n1.1 Steel tape\n1.2 Steel rule\n1.3 Straight edge\n1.4 Combination square\n1.5 Steel square\n1.6 Divider or trammel\n1.7 Caliper\n1.8 Protractor\n1.9 Vernier caliper\n1.10 Micrometer\n\n2. Measurements\nMay include:\n2.1 Length\n2.2 Diameter\n2.3 Depth\n2.4 Flatness\n2.5 Straightness\n2.6 Squareness\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used measuring instruments\n1.2 Cleaned and stored measuring instruments\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to the activity\n2.2 Specimen component or part to the proposed activity\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Demonstration\n3.3 Written or oral short answer questions\n3.4 Portfolio\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 62 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n58\n\nUNIT OF COMPETENCY\n:\nPERFORM ROUTINE HOUSEKEEPING\n\nUNIT CODE\n\n:\nMEE722206\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to maintain an\norganized and clean work area.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nrequirement\n1.1 Work area maintained in a\nsafe, uncluttered and\norganized manner according\nto workshop policy\n1.2 All tasks carried out safely,\neffectively and efficiently with\nminimum inconvenience\naccording to workshop policy\n1.3 Workshop policies and\nprocedures for tidying work\nareas and placing items in\ndesignated areas applied\n1.1 Shop safety\npractices\n1.2 Machine\nshop\nequipment\n1.3 Shop policies\nregulations\n1.4 5-S\n1.5 Shop\ncleaning\nequipment\n\n1.1 Maintaining\nwork area, safe\nuncluttered and\norganized\n1.2 Carrying out all\ntask safely,\neffectively and\nefficiently\n1.3 Designating\nworkshop\npolicies and\nprocedures for\nwork area\n2 Clean work\narea\n2.1 Shop policies and procedures\napplied for cleaning work\narea\n2.2 Wastes promptly removed and\ndisposed of according to shop\npolicies and environmental\nrequirements\n2.3 Spills, wastes and other\npotential hazards reported to\nappropriate personnel and\nremoved according to shop\npolicies and environmental\nrequirements\n2.4 Signage promptly displayed in\nregard to unsafe areas\n2.5 Consumable materials\nmaintained and stored\ncorrectly after use\n2.6 Tools and equipment\n(including guards) cleaned\nand used in accordance with\nmanufacturer’s instructions\n\n2.1 Shop safety\npractices\n2.2 Machine\nshop\nequipment\n2.3 Shop policies\nregulations\n2.4 5-S\n2.5 Shop\ncleaning\nequipment\n\n2.1 Applying shop\npolicies and\nprocedures\n2.2 Disposing of\nwaste\naccording to\nshop policy and\nenvironmental\nrequirements\n2.3 Cleaning of\ntools and\nequipment\n\n--- PDF PAGE 63 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n59\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Workshop policy\nShop policy and procedure in regard to:\n1.1 Housekeeping practices\n1.2 Maintenance and storage of cleaning equipment\n1.3 Use and storage of cleaning chemicals\n2. Work area\nMay include:\n2.1 Work benches\n2.2 Walkways and aisles\n2.3 Fixtures and other working surfaces\n3. Tools and\n Equipment\nMay include:\n3.1 Drill Press\n3.2 Pedestal Grinder\n3.3 Surface plate\n3.4 Layout and marking tools\n3.5 Cutting tools (hacksaw, chisel, files)\n3.6 Inspection and measuring tools (templates, vernier\ncaliper, micrometer, straight edge, gages, etc…)\n\n--- PDF PAGE 64 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n60\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Organized and cleaned work area according shop\n policies and environmental requirements.\n2. Resource implications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to\nprocesses or activity\n2.2 Materials and documentation relevant to the\nproposed activity\n2.3 Shop policy and/or procedures manual on\nhousekeeping, cleaning and occupational health and\nsafety\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Demonstration or role play\n3.3 Written or oral short answer questions\n3.4 Identify colleagues/clients who can be approached\nfor the collection of competency evidence, where\nappropriate\n4. Context for assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 65 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n61\n\nUNIT OF COMPETENCY\n:\nPERFORM SHOP COMPUTATIONS (INTERMEDIATE)\n\nUNIT CODE\n\n:\nMEE722207\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to perform\ncalculation involving triangles and tapers.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform\ncalculations\ninvolving\ntriangles\n1.1 Problems involving\nright triangles are\nperformed using the\ntrigonometric\nfunctions.\n1.2 Problems involving\nnon-right triangles\nare performed using\nsine and cosine\nrules.\n1.1 English and\nmetric system of\nmeasurements\n1.2 Geometrical\nshapes\n1.1 Performing\ntrigonometric\nfunction\n\n2. Calculate taper\n2.1 Convert the units of\nthe conical taper so\nthat all units are the\nsame.\n2.2 Visualize a cross\nsection of the cone\nwith the length being\nthe height and the\ndiameter being the\nbase.\n2.3 Taper of work\ncalculated correctly\nusing appropriate\nformula.\n2.1 English and\nmetric system of\nmeasurements\n2.2 Geometrical\nshapes\n2.1 Calculating taper\nof work\n\n--- PDF PAGE 66 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n62\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Trigonometric\nfunctions\nMay include:\n1.1 Sine\n1.2 Cosine\n1.3 Tangent\n1.4 Cotangent\n1.5 Secant\n1.6 Cosecant\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed calculations involving right triangles, non-\nright triangles and involving tapers\n\n2. Resource implications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to\nprocesses or activity\n2.2 Materials relevant to the proposed activity\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written or oral short answer questions\n3.2 Practical exercises\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 67 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n63\n\nUNIT OF COMPETENCY :\nMEASURE WORKPIECE USING ANGULAR\nMEASURING INSTRUMENTS\n\nUNIT CODE\n\n:\nMEE722208\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to measure\nworkpieces using angular measuring instruments.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and\nuse angular\nmeasuring\ntools\n1.1 Angular measuring\ntools are selected\nand used according to\nthe level of accuracy\nrequired.\n1.2 Measurements taken\nare accurate to the\nfinest graduation of\nthe selected\nmeasuring instrument.\n1.3 Measuring technique\nused is correct and\nappropriate to the\ndevice used.\n\n1.1 Types, purposes and\naccuracy of angular\nmeasuring instruments\n1.2 Capability of measuring\ntools\n1.3 Techniques for\nmeasuring angles and\ntapers\n1.1 Selecting angular\nmeasuring tools\n1.2 Obtaining\naccurate\nmeasurements\n1.3 Determining\nmeasuring\ntechniques\n\n2. Maintain\nangular\nmeasuring\ntools\n2.1 Measuring tools are\nadjusted and\nmaintained to the\nrequired accuracy\nutilizing\nmanufacturer’s or\nworksite procedures.\n\n2.1 Types, purposes and\n accuracy of angular\n measuring instruments\n2.2 Capability of measuring\ntools\n2.3 Techniques for\nmeasuring angles and\ntapers\n\n2.1 Maintaining and\nadjusting\nmeasuring tool\naccuracy\n3. Clean and\nstore\nmeasuring\ntools\n3.1 Care and storage of\ndevices undertaken\nto manufacturer’s\nspecifications or\nstandard operating\nprocedures.\n\n3.1 Types, purposes and\naccuracy of angular\nmeasuring instruments\n3.2 Capability of measuring\ntools\n3.3 Techniques for\nmeasuring angles and\ntapers\n3.4 Care and storage\nprocedure of measuring\ntools\n\n3.1 Storing and\ncleaning of\nmeasuring tools\n\n--- PDF PAGE 68 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n64\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Angular measuring\n tools\nMay include:\n1.1 Bevel protractor\n1.2 Gage blocks\n1.3 Sine bar\n\n2. Measurements\nMay include:\n2.1 Angle\n2.2 Taper\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Selected and used angular measuring instruments\n1.2 Maintained/adjusted instruments\n1.3 Cleaned and stored measuring instruments\n\n2. Resource implications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to the activity\n2.2 Specimen component or part to the proposed activity\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.2 Direct observation\n3.3 Demonstration\n3.4 Written or oral short answer questions\n3.5 Portfolio\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 69 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n65\n\nUNIT OF COMPETENCY\n:\nMEASURE WORKPIECE USING GAGES AND\nSURFACE TEXTURE COMPARATOR\n\nUNIT CODE\n\n:\nMEE722210\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to measure\nworkpieces using fixed and adjustable gages.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and use\nfixed and\nadjustable gages\n1.1 Appropriate gages\nare selected and\nused to undertake\nthe required\ncomparison or\nmeasurement using\nstandard operating\nprocedures.\n1.2 Consistent and\naccurate\nmeasurements\nobtained conforms\nto drawing\nspecification\n1.3 Measuring\ntechnique used is\ncorrect and\nappropriate to the\ndevice used.\n1.1 Types and\napplication of\nfixed and\nadjustable gages\n1.2 Gage limits and\naccuracy\n1.3 Techniques for\nmeasuring\ncomponents\n1.1 Selecting\nappropriate gages\nand measuring\ninstrument\n1.2 Obtaining accurate\nmeasurements\n1.3 Determining\nmeasuring\ntechniques\n2. Perform surface\ntexture\nmeasurements\n2.1 Surface texture are\nmeasured according\nworksite procedures.\n2.2 Measurements\ntaken are within the\nlevel of accuracy\nrequired.\n\n2.1 Types and\napplication of\nfixed and\nadjustable gages\n2.2 Gage limits and\naccuracy\n2.3 Techniques for\nmeasuring\ncomponents\n2.1 Identifying die\nmaterial\nrequirements\n2.2 Determining\nproduction volume\n2.3 Identifying design\nparameters\n3. Clean and store\nmeasuring tools\n3.1 Care and storage of\ndevices undertaken\nto manufacturer’s\nspecifications or\nstandard operating\nprocedures.\n3