      "source_text": "135 GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. Assembly Drawing"
    },
    {
      "source_text": "Are used to show the position and functional relationship of parts in an assembly"
    },
    {
      "source_text": "2. Blow Molding Method of fabrication in which a warm plastic hollow tube is placed between the two halves of a mold cavity and forced to assume the shape of that mold cavity by use of internal pressure. This process forms hollow articles such as bottles, tanks, etc."
    },
    {
      "source_text": "3. CAD (computer- aided design)"
    },
    {
      "source_text": "Refers to the software used to create precision drawings or technical illustrations and can be used to create two-dimensional (2-D) drawings or three-dimensional (3-D) models."
    },
    {
      "source_text": "4. Cavity A depression, or a set of matching depressions, in a plastics- forming mold which forms the outer surfaces of the molded articles"
    },
    {
      "source_text": "5. Cycle Time The time required by an injection molding system to mold a part and return to its original position/state."
    },
    {
      "source_text": "6. Core A protrusion, or set of matching protrusions, in a plastics forming mold which forms the inner surfaces of the molded articles 7. Gate"
    },
    {
      "source_text": "The channel through which the molten resin flows from the runner into the cavity 8. Machine Refers to an equipment used for the manufacturing of molded products."
    },
    {
      "source_text": "9. Material"
    },
    {
      "source_text": "Refers to the substance or substances of which a product is made or composed."
    },
    {
      "source_text": "10. Mold A hollow form or matrix into which a plastic material is placed and which imparts to the material its final shape."
    },
    {
      "source_text": "11. Part Drawing Detail drawing completely described a single parts with multiple orthographic projections"
    },
    {
      "source_text": "12. Plastic A material that contains as an essential ingredient one or more organic polymeric substances of large molecular weight, is solid in its finished state, and, at some stage in its manufacture or processing into finished articles, can be shaped by flow."
    },
    {
      "source_text": "13. Process Refers to a continuous action or operation taking place in a definite manner"
    },
    {
      "source_text": "14. Product"
    },
    {
      "source_text": "Refers to the outcome produced during molding process."
    },
    {
      "source_text": "-- PDF PAGE 140 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019"
    },
    {
      "source_text": "136 15. Runner"
    },
    {
      "source_text": "In an injection mold, the feed channel, usually of circular cross section, which connects the sprue with the cavity gate. The term is also used for the plastic piece formed in this channel."
    },
    {
      "source_text": "16. Simulation Refers to the representation of the behavior or characteristics of the product through the use of software."
    },
    {
      "source_text": "17. Specification"
    },
    {
      "source_text": "Refers to a detailed description or assessment of requirements 18. Tolerance Refers to the range of permissible size"
    },
    {
      "source_text": "19. Toolbars Refers to a horizontal or vertical column of selectable buttons display on a computer screen, allowing the user to select a variety of functions."
    },
    {
