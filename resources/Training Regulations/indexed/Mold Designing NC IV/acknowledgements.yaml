l\nQuestioning\n• Demonstration\n• Evaluation\n4 hrs\n4.3 Save modified\n3D CAD\ndrawings\n•\nSave modified 3D CAD drawings in\naccordance with standard operating\nprocedures.\n•\nClose CAD program and shutdown\ncomputer.\n• Lecture-\nDiscussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral\nQuestioning\n2 hrs\n\n--- PDF PAGE 128 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n124\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Create\nfabrication\ndrawing\n\n5.1 Prepare\nassembly\ndrawings\n\n•\nKnow and explain the steps in preparing\nand modifying assembly drawings.\n•\nPerform step-by-step process to create\nassembly drawings.\n•\nSave assembly drawing files in\naccordance with standard operating\nprocedures.\n• Lecture-\nDiscussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Tutorial\n• Observation\n• Oral\nQuestioning\n• Demonstration\n• Evaluation\n16 hrs\n5.2 Prepare parts\ndrawing\n\n•\nKnow and explain the steps in preparing\nand modifying parts drawings.\n•\nPerform step-by-step process to create\nparts drawings.\n•\nSave parts drawings files in accordance\nwith standard operating procedures.\n• Lecture-\nDiscussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Tutorial\n• Observation\n• Oral\nQuestioning\n• Demonstration\n• Evaluation\n14 hrs\n5.3 Print drawings\n\n•\nPrint assembly and parts drawings in\naccordance with standard operating\nprocedures.\n•\nClose CAD program and shutdown\ncomputer.\n• Lecture-\nDiscussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral\nQuestioning\n2 hrs\n\n--- PDF PAGE 129 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n125\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2.\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\n\n--- PDF PAGE 130 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n126\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such as\nbarangay hall, basketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n--- PDF PAGE 131 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n127\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\n Trainees or students wishing to enroll in this course should possess the\nfollowing requirements:\n\n• Technology graduate or have completed basic engineering course\n• Computer literate with CAD background\n• Industrial experience in mold making with CNC background\n• Can perform shop mathematical computation (including the application of\nstrength of materials)\n• Can communicate orally or in writing\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 10 trainees for MOLD\nDESIGNING NC IV are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY Description\nQTY\nDescription\nQTY\nDescription\n10 unit\n3D CAD\nsoftware\nlicense\n10 unit\nWorkstation\n(As per minimum\nrequirement of design\nand manufacturing\nsoftware)\n2 rim\nBond paper (A4 &\nA3 size)\n10 unit\nCAD\nSimulation\nsoftware\nlicense\n1 unit\nPrinter (A4/A3 size)\n\n5 units\nPrinter ink (black/\ncolored)\n 10 unit\nCaliper\n(300mm)\n1 unit\nCopier machines (A3/A4\nsize)\n1 lot\nToner\n10 unit\nMicrometer\n1 unit\nPlotter (Optional)\n1 spool Support\n10 unit\nScientific\nCalculator\n1 unit\n3D Printer/ Rapid\nprototyping, 6” x 6” x 8”\n(Optional)\n1 spool ABS Plastic\nmaterial\n10 pcs.\nSteel Rule\n1 unit\nDigital light projector\n1 lot\nWhit board markers\n& Eraser\n10 Unit\nChairs\n1 lot\nAudio system\n10 pcs\nMechanical Pencil\n10 Unit\nTable\n\n10 pcs. Eraser\n5 unit\nLocker\ncabinet\n\n1 lot\npresentation\nmaterials\n\n1 unit\nWhite board\n\n1 lot\nReferences\n\n--- PDF PAGE 132 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n128\n\n3.5\nTRAINING FACILITIES\n\nBased on class intake of 10 students/trainees.\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nLaboratory Area\n5 x 8\n40\n1\n40\nTool Room / Storage\nArea\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker\nRoom\n1 x 2\n2\n1\n2\n Total Area\n102\n\nNote:\n\nTraining center may enter into a Memorandum of Understanding (MOU) with an\ninstitution/company with appropriate equipment and facilities.\n\n3.6\nTRAINERS QUALIFICATION FOR MOLD DESIGNING NC IV\n\n•\nHolder of National TVET Trainer Certificate Level I (NTTC Level I) in MOLD\nDESIGNING NC IV\n•\nAt least technology graduate related to Mechanical Engineering\n•\nMust be computer literate\n•\nMust have at least 3 years industry experience in Mold Making with working\nknowledge in CNC programming and operations or at least 5 years teaching\nexperience and 240 hours relevant training in Mold Design and Fabrication.\n•\nMust have at least 2 years experience using CAD software.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 133 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n129\nSECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through competency\nassessment.\n\n4.1.4 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations: It includes the following:\n\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as identified by industry\n\n4.1.5 The following are qualified to apply for assessment and certification:\n\na. Graduating students/trainees of NTR programs or graduates of formal,\nnon-formal and informal institutions including enterprise-based training\nprograms related to Mold Designing NC IV\n\nb. Industry workers (employed, self-employed or owners/proprietors).\n\n--- PDF PAGE 134 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n130\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n.\n\n--- PDF PAGE 135 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n131\n\nANNEX A\n\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nCOMPETENCY MAP\nMETALS AND ENGINEERING SECTOR\n MOLD DESIGNING NC IV\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 136 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n132\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in\nthe\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nImplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nApply safety practices\nInterpret working drawings\nand sketches\nSelect/ cut workshop\nmaterials\nPerform shop computations\n(Basic)\nMeasure workpiece (Basic)\nPerform routine housekeeping\n\nPerform shop computations\n(Intermediate)\nMeasure workpiece using\nangular measuring\ninstruments\nPerform shop computations\n(Advanced)\nMeasure workpiece using\ngages and surface texture\ncomparator\nPerform preventive and\ncorrective maintenance\nOperate a personal computer\nSelect and cut workshop\nmaterials\nPrepare cost estimates\nApply Safety Practices\nInterpret Drawings and Sketches\nPerform Industry Calculations\nContribute to Quality System\nUse Hand Tools\nPrepare Weld Materials\nSetup Welding Equipment\nFit up Weld Materials\nRepair Welds\nPerform shop computations\n(Intermediate)\nMeasure workpiece\n(Intermediate)\nPerform preventive and\ncorrective Maintenance\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 137 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n133\nCreate drawing using CAD\nsoftware\nApply CAD/CAM program\nWrite basic CNC lathe machine\nprogram\nSet-up CNC lathe machine,\nworkpiece and cutting tools\nPerform basic CNC lathe\nmachine operations\nWrite advanced CNC lathe\nmachine program\nSet-up multiple-axis CNC lathe\nmachine, workpiece and cutting\ntools\nPerform advanced CNC lathe\nmachine operations\nWrite basic CNC milling\nmachine program\nSet-up CNC milling machine,\nworkpiece and cutting tools\nPerform basic CNC milling\nmachine operations\nWrite advanced CNC milling\nmachine program\nSet-up multiple-axis CNC\nmilling machine, workpiece\nand cutting tools\nPerform advanced CNC milling\nmachine operations\nWeld Carbon Steel Plates Using\nFCAW\nWeld Carbon Steel Pipes Using\nFCAW\nWeld Alloy Steel Plates\nUsing FCAW\nWeld Alloy Steel Pipes Using\nFCAW\nPerform Gas Welding in Carbon\nSteel Plates and Tubes\nPerform Gas Welding in Alloy\nSteel Plates and Tubes\nWeld Carbon Steel Plates\nUsing GMAW\n\nWeld Carbon Steel Pipes Using\nGMAW\nWeld Alloy Steel Plates Using\nGMAW\nWeld Alloy Steel Pipes Using\nGMAW\nWeld Carbon Steel Plates\nUsing GTAW\nWeld Carbon Steel Pipes Using\nGTAW\nWeld Alloy Steel Plates Using\nGTAW\nWeld Alloy Steel Pipes Using\nGTAW\nPerform bench work (Basic)\nTurn workpiece\nMill workpiece\nGrind workpiece\nShape workpiece\nRepair workpiece\nPerform bench work (Basic)\nPerform bench work (Complex)\nTurn workpiece (Basic)\nTurn workpiece (Intermediate)\nMill workpiece (Basic)\nMill workpiece (Intermediate)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 138 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n134\nGrind workpiece (Basic)\nGrind workpiece (Complex)\nTurn workpiece (Advanced)\nMill workpiece (Advanced)\nPrepare basic engineering\ndrafting\nPerform basic engineering detail\ndrafting\nPerform Preventive\nMaintenance\nPerform Planned and\nUnplanned (Emergency)\nMaintenance\nFabricate Simple Items\nInstall Machinery\n Perform press machine setting\n Perform mechanical press\noperation\nWeld Plates Using SAW\nWeld Pipes Using SAW\nWeld Carbon Steel Plates Using\nSMAW\nWeld Carbon Steel Plates and\nPipes Using SMAW\nWeld Alloy Steel Plates\nUsing SMAW\nWeld Alloy Steel Pipes Using\nSMAW\nMachine Die Components\nFit and Assemble Dies\nTest and Try Die\nMachine mold components\n\nImplement surface finishing\n\nFit and assemble mold\n\nRectify mold flaws\nDetermine mold design\nparameters\nPerform CAD operation\nSimulate and verify mold\ndesign\nModify and finalize mold\ndesign\nCreate fabrication drawing\n\nCORE COMPETENCIES\n\n--- PDF PAGE 139 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n135\nGLOSSARY OF TERMS\n\n1. Assembly\nDrawing\n\nAre used to show the position and functional relationship of parts\nin an assembly\n\n2. Blow Molding\nMethod of fabrication in which a warm plastic hollow tube is placed\nbetween the two halves of a mold cavity and forced to assume the\nshape of that mold cavity by use of internal pressure. This process\nforms hollow articles such as bottles, tanks, etc.\n\n3. CAD (computer-\naided design)\n\nRefers to the software used to create precision drawings or\ntechnical illustrations and can be used to create two-dimensional\n(2-D) drawings or three-dimensional (3-D) models.\n\n4. Cavity\nA depression, or a set of matching depressions, in a plastics-\nforming mold which forms the outer surfaces of the molded articles\n\n5. Cycle Time\nThe time required by an injection molding system to mold a part\nand return to its original position/state.\n\n6. Core\nA protrusion, or set of matching protrusions, in a plastics forming\nmold which forms the inner surfaces of the molded articles\n7. Gate\n\nThe channel through which the molten resin flows from the runner\ninto the cavity\n8. Machine\nRefers to an equipment used for the manufacturing of molded\nproducts.\n\n9. Material\n\nRefers to the substance or substances of which a product is made\nor composed.\n\n10. Mold\nA hollow form or matrix into which a plastic material is placed and\nwhich imparts to the material its final shape.\n\n11. Part Drawing\nDetail drawing completely described a single parts with multiple\northographic projections\n\n12. Plastic\nA material that contains as an essential ingredient one or more\norganic polymeric substances of large molecular weight, is solid\nin its finished state, and, at some stage in its manufacture or\nprocessing into finished articles, can be shaped by flow.\n\n13. Process\nRefers to a continuous action or operation taking place in a\ndefinite manner\n\n14. Product\n\nRefers to the outcome produced during molding process.\n\n--- PDF PAGE 140 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n136\n15. Runner\n\nIn an injection mold, the feed channel, usually of circular cross\nsection, which connects the sprue with the cavity gate. The term\nis also used for the plastic piece formed in this channel.\n\n16. Simulation\nRefers to\nthe representation of the behavior or characteristics of the\nproduct through the use of software.\n\n17. Specification\n\nRefers to a detailed description or assessment of requirements\n18. Tolerance\nRefers to the range of permissible size\n\n19. Toolbars\nRefers to a horizontal or vertical column of selectable buttons\ndisplay on a computer screen, allowing the user to select a\nvariety of functions.\n\n--- PDF PAGE 141 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n137\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMold Designing NC IV\n\nQualification Code:\nMEEMOD419\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nMold Designing\nNC IV\n2019-033/\n05-21-2019\n\nLegend: *Description Types\n- Document Created\n\n--- PDF PAGE 142 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n138\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTECHNICAL EXPERTS / TESDA EXPERTS PANEL\n\nFred P. Liza\nIndustry Expert\nChief, Prototyping Division\nDOST-MIRDC\nBicutan, Taguig City\nDanilo N. Pilar\nIndustry Expert\nChief,\nDOST-MIRDC\nBicutan, Taguig City\nRomanico F. Salido\nIndustry Expert\nProject Consultant\nDOST-MIRDC\nBicutan, Taguig City\nReynaldo Dela Cruz\nIndustry Expert\nSupervising SRS,\nDOST-MIRDC\nBicutan, Taguig City\nGHARRY M. BATHAN\nIndustry Expert\nSr. SRS\nDOST-MIRDC\nBicutan, Taguig City\nVirgilio Lanzuela\nIndustry Expert\nBoard of Trustee-Secretary\nPDMA, Inc.\nChairman\nRollmaster Machinery and Industrial\nServices, Corporation.\nThe Management and Staff of the Philippine Die and Mold Association Inc. (PDMA)\n\n--- PDF PAGE 143 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n139\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n•\nAichi Forging Co. of Asia, Inc.\n Sta. Rosa, Laguna\n\n•\nMFI Technological Institute Inc.\n Pasig City\n\n•\nSMC Yamamura Fuso Molds Corp.\n Cavite City\n\n•\nTop Choice Training Inst. & Assessment Center, Inc. Parañaque City\n\n•\nTUP Manila\n\n•\n3MI Graphics and Software Design Corp.\n Pasig City\n\n--- PDF PAGE 144 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n140\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Howard Mark N. Plete\n- Evangeline A. Cosep",
