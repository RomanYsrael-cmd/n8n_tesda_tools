n2.4 Observation Skills\n2.5 Training Delivery\nSkills\n2.6 Cost-Benefit\nAnalysis\n\n3. Implement\nrecommended\nimprovements\non\nenvironmental\nprograms,\npolicies and\nprocedures\n3.1. Approved\nimprovements on\nenvironmental work\nprogram initiatives\nare promoted based\non workplace policies\nand procedures\n3.2 Implementation of the\napproved\nenvironmental\ninitiatives are\nmonitored in\naccordance with\nworkplace policies and\nprocedures\n3.3. Implementation of\napproved\nenvironmental\ninitiatives are\nevaluated based on\nworkplace policies and\nprocedures\n3.1. Environmental\nWork Initiatives\n3.2. Communication\nStrategies\n3.3. Environmental\ninspection and\nMonitoring\nTechniques\n3.4. Notification\nRequirements\n3.1. Inspection Skills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n\n--- PDF PAGE 41 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n37\n\n RANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Environmental\nPractices and\nPrograms\nMay include:\n1.1\nUtilization of Energy, Water, Fuel\n1.2\nSegregation Practices\n1.3\nWaste Disposal and Reuse\n1.4\nSaving Resources\n1.5\nWaste Collection\n1.6\nUsage of Hazardous Materials\n1.7\nChemical Application\n1.8\nEquipment Operation\n1.9\nDewatering and Discharging\n1.10 Surface Disturbance\n1.11 Periodic Inspection\n1.12 Resource Storage and Handling\n2. Environmental\nReference Guides\nMay include:\n2.1\nAir Emission and Ambient Air Quality Guidelines\n2.2\nEnergy Conservation Guidelines\n2.3\nWastewater and Ambient Water Quality Guidelines\n2.4\nWater Conservation Guidelines\n2.5\nHazardous Materials Management\n2.6\nWaste Management\n2.7\nNoise\n2.8\nContaminated Land\n2.9\nCultural Conservation Guides\n3. Environmental Work\nProgram Initiatives\nMay include:\n3.1 Low Energy Lighting\n3.2 Water Reduction initiatives\n3.3 Holding Employee Awareness event\n3.4 Recycling Waste Materials\n3.5 Unplugging power converters overnight\n3.6 Tree-Planting\n3.7 Wild-life conservation\n\n--- PDF PAGE 42 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n38\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consulted appropriate personnel or environmental reference\nguides for proper guidance based on workplace policies*\n1.2. Evaluated current practices and standards based acceptable\nlevel of environmental work standards\n1.3. Organized environmental standard improvement plans based on\nworkplace policies and procedures\n1.4. Presented environmental standard improvement plans based on\nworkplace policies and procedures*\n1.5. Promoted approved environmental work initiatives based on\nworkplace policies and procedures\n1.6. Evaluated the implementation of approved environmental\nimprovements based on workplace policies and procedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local ordinances\nrelating to environmental protection\n2.3 Case studies/scenarios relating to environmental protection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n 3.4 Simulations and role-plays\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 43 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n39\n\nUNIT OF COMPETENCY\n:\nSUSTAIN ENTREPRENEURIAL SKILLS\n\n UNIT CODE\n:\n500311409\n\n UNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to update and continue\none’s professional development along entrepreneurship,\nincluding applying such growth in skills toward expanding the\nenterprise and developing its work force.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Enhance\none’s\nbusiness\nskills\n1.1 Entrepreneurial skills\ndevelopment needs are\nidentified and\nresponded to promptly.\n1.2 Market trends are\nmonitored, anticipated\nand taken advantage of\nwhere feasible.\n1.3 New technologies,\nproducts and processes\nare included/utilized\nwhere advantageous to\nthe enterprise.\n1.4 Constant\ndialog/linkages with\nother\nentrepreneurs/peers\nand stakeholders are\nmaintained\n1.5 Circulation and\nparticipation in\nbusiness fora,\nmeetings, conventions\nand exhibits are\nmaintained.\n1.1 Business models\nand strategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business internal\ncontrols\n1.4 Market Trends\n1.5 Relevant national\nand local\nlegislation and\nregulations\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n\n1.1 Basic bookkeeping/\naccounting skills\n1.2 Communication skills\n1.3 Building relations with\ncustomer and\nemployees\n1.4 Building competitive\nadvantage of the\nenterprise\n1.5 Networking and\nLinkaging skills\n\n--- PDF PAGE 44 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n40\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Manage\nentrepreneurial\npractices\n2.1 Ideas and comments\nfor improvements are\nsought from workers\nand clients.\n2.2 Staff/workers are\nencouraged and\nsupported in their skills\ndevelopment and\nenhancement.\n2.3 A culture of\ncontinuous\nimprovement is\nfostered within the\nenterprise.\n2.4 Innovations on the\nexisting lines of\nproducts and services\nare encouraged\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market and\nfeasibility studies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/\ntarpaulins, flyers,\nsocial media, etc.)\n3. Expand\nmarkets and\nclientele\n3.1 Enterprise is built up\nand sustained through\njudicious control of\ncash flows.\n3.2 Profitability of\nenterprise is ensured\nthough appropriate\ninternal controls.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are\navoided.\n3.4 New markets and\nclients are identified\nbased on current\nmarket trends\n\n3.1 Basic cost-\nbenefit analysis\n3.2 Basic financial\nmanagement\n3.3 Basic financial\naccounting\n3.4 Business internal\ncontrols\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting basic\nfinancial\nstatements\n3.3 Preparing business\nplans\n\n--- PDF PAGE 45 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n41\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Entrepreneurial skills\nMay include:\n1.1. Financial management skills\n1.2. People management skills\n1.3. Operations management skills\n1.4. Business acumen\n\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n3.4 Managing property, plant and equipment\n4. Continuous\nimprovement\nMay include:\n4.1 Quality management systems (PDCA, ISO 9001,TQM,\nSix-Sigma, etc.)\n4.2 Client feedback systems\n4.3 Quality assurance/Quality control systems\n\n--- PDF PAGE 46 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n42\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated enhancement of one’s entrepreneurial\nskills through performance of business, supervisor\nevaluation, worker and client testimony\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Interview guide for entrepreneurs, enterprise workers and\nthird parties\n2.2 Materials and location relevant to the proposed activity\nand tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written report\n3.2 Written examination\n3.3 Demonstration/observation with oral questioning\n3.4 Portfolio assessment with interview\n3.5 Third-party report\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 47 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n43\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY PRACTICES\n\nUNIT CODE\n\n:\nMEE722201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to apply safety\npractices in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify hazards\n\n1.1 Hazards are identified\ncorrectly in\naccordance with OHS\nprinciples\n1.2 Safety signs and\nsymbols are identified\nand adhered to\n1.1 Shop safety signs,\nsymbols and\nalarms\n1.2 Safety\nprecautionary\nmeasures\n1.1 Identifying hazard\n1.2 Identifying safety\nsign and symbol\n\n2. Use protective\nclothing and\ndevices\n2.1 Appropriate\nprotective clothing\nand devices correctly\nselected and used in\naccordance with OHS\nrequirements or\nindustry/company\npolicy\n\n2.1 Shop safety signs,\nsymbols and\nalarms\n2.2 Safety\nprecautionary\nmeasures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.1 Selecting\nappropriate\nprotective clothing\nand devices\n\n3. Perform safe\nhandling of tools,\nequipment and\nmaterials\n3.1 Safety procedures for\npre-use check and\noperation of tools and\nequipment followed in\naccordance with\nindustry/ company\npolicies\n3.2 Tools, equipment and\nmaterials handled\nsafely in accordance\nwith OHS\nrequirements and\nindustry/ company\npolicies\n3.1 Shop safety\nsigns, symbols\nand alarms\n3.2 Safety\nprecautionary\nmeasures\n3.3 Housekeeping\n3.4 Machine tools\n3.5 Engineering\nmaterials\n\n3.1 Checking tools\nand equipment\n3.2 Operating tools\nand equipment\n3.3 Handling tools\nand equipment\n\n--- PDF PAGE 48 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n44\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Perform first\naid\n4.1 Surroundings are\nchecked for any\npossible risk or harm\n4.2 Call for help someone\nif seriously injured.\n4.3 First aid treatment of\ninjuries are carried\nout according to\nrecommended\nprocedures\n4.1 Shop safety\nsigns, symbols\nand alarms\n4.2 Safety\nprecautionary\nmeasures\n4.3 Housekeeping\n4.4 Machine tools\n4.5 First aid\n4.6 Engineering\nmaterials\n4.1 Determining first\naid treatment\naccording to\nrecommended\nprocedures\n4.2 Performing first\naid according to\nrecommended\nprocedures\n5. Use fire\nextinguisher\n5.1 Check for your own\nsafety before starting\nto extinguish a fire.\n5.2 Fire extinguisher is\nselected correctly\naccording to the type\nof fire.\n5.3 Fire extinguisher are\noperated correctly\naccording\nrecommended\nprocedures\n5.1 Shop safety signs,\nsymbols and\nalarms\n5.2 Safety\nprecautionary\nmeasures\n5.3 Housekeeping\n5.4 Machine tools\n5.5 First aid\n5.6 Engineering\nmaterials\n5.7 Fire extinguishers\n5.1 Selecting fire\nextinguisher\naccording to the\ntype of fire\n5.2 Operating fire\nextinguisher\naccording to the\ntype of fire\n\n--- PDF PAGE 49 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n45\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nMay include:\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving parts\n1.6 Uncollected chips or other wastes\netc.\n2. Protective clothing and\ndevices\n May include:\n2.1 Safety glasses/goggles\n2.2 Safety shoes\n2.3 Overalls\n2.4 Cap\n3. Injuries\nMay include:\n3.1 Burns/scalds\n3.2 Fractures\n3.3 Cuts and abrasions\n3.4 Poisoning\n3.5 Foreign bodies in the eye\n3.6 Concussion\n3.7 Shock\n4. Type of fires\nMay include:\n4.1 common combustibles (wood, cloth, paper, rubber and\nplastic)\n4.2 Flammable liquids (gasoline, oil, solvents, paints, etc.)\n4.3 Energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4.4 Combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 50 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n46\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\nAssessment requires evidence that the candidate:\n1.1 identified hazardous area\n1.2 used protective clothing and devices\n1.3 handled tools, equipment and materials properly\n1.4 performed first aid\n1.5 used fire extinguisher\n\n2. Resource implications\n\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to\nprocesses or activity\n2.2 Materials relevant to the proposed activity\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Written or oral short answer questions\n3.3 Practical exercises\n\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 51 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n47\n\nUNIT OF COMPETENCY :\nINTERPRET WORKING DRAWINGS AND SKETCHES\n\nUNIT CODE\n\n:\nMEE722202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to read and\ninterpret drawings and sketches.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\ntechnical\ndrawing\n1.1 Components,\nassemblies or objects\nrecognized as\nrequired.\n1.2 Dimensions identified\nas appropriate.\n1.3 Instructions identified\nand followed as\nrequired.\n1.4 Material requirements\nidentified as required.\n1.5 Symbo