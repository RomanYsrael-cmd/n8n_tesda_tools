    },
    {
      "source_text": "1.1 Recognizing components, assemblies and objects. 1.2 Identifying dimension 1.3 Identifying instruction 1.4 Identifying material 1.5 Recognizing symbols in the drawing 1.6 Identifying tolerance, limits and fits 2. Prepare freehand sketch of parts 2.1 Sketch drawn correctly and appropriately. 2.2 Sketch depicted objects or part appropriately. 2.3 Dimensions indicated in sketch are clear and correct. 2.4 Instructions included in sketch are clear and correct. 2.5 Base line or datum points indicated as required. 2.1 Alphabet of lines 2.2 Projections 2.3 Drawing symbols 2.4 Dimensioning techniques 2.5 Tolerance, limits and fits 2.6 Engineering materials 2.7 Drawing tools and supplies"
    },
    {
      "source_text": "2.1 Depicting sketch 2.2 Dimensioning sketch 2.3 Including instruction in the sketch 2.4 Indicating base line/ datum"
    },
    {
      "source_text": "-- PDF PAGE 52 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 48"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 3. Interpret details from freehand sketch 3.1 Components, assemblies or objects recognized as required. 3.2 Dimensions identified as appropriate. 3.3 Instructions identified and followed as required. 3.4 Material requirements identified as required. 3.5 Symbols recognized as appropriate in the drawing. 3.1 Alphabet of lines 3.2 Projections 3.3 Drawing symbols 3.4 Dimensioning techniques 3.5 Tolerance, limits and fits 3.6 Engineering materials 3.7 Drawing tools and supplies"
    },
    {
      "source_text": "3.1 Recognizing components, assemblies and objects. 3.2 Identifying dimensions 3.3 Identifying instruction 3.4 Identifying material requirements 3.5 Recognizing symbols"
    },
    {
      "source_text": "-- PDF PAGE 53 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 49"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Drawing 1.1 Drawing technique may include 1.1.1 Perspective 1.1.2 Exploded view 1.1.3 Hidden view technique 1.2 Projections 1.2.1 First angle projections 1.2.2 Third angle projections 2. Tolerance May include: 2.1 General tolerance 2.2 Angular tolerance 2.3 Geometric tolerance"
