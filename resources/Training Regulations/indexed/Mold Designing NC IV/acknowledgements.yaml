    },
    {
      "source_text": "The following resources should be provided: 2.1 Drafting room/facilities and drafting instruments and supplies appropriate to the activity 2.2 Measuring tools 2.3 Drawings, sketches or blueprint 2.4 Specimen parts/components 3. Method of assessment Competency in this unit may be assessed through: 3.1 Direct observation 3.2 Written or oral short answer questions 3.3 Demonstration 3.4 Project/work sample 3.5 Portfolio 4. Context for assessment"
