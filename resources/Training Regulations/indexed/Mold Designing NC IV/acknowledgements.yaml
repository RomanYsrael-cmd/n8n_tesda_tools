    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Foster Individual growth 1.1 Learning and development needs of team members are systematically identified in line with organizational requirements 1.2 Development plan to meet individual needs is collaboratively developed and implemented 1.3 Individuals are encouraged to self -evaluate performance and identify areas for improvement 1.4 Feedback on performance of team members is collected from relevant sources and compared with established team learning process 1.1 Effective workplace communication, coaching and mentoring principles 1.2 Feedback principles and procedures 1.3 Working interdependently: strategies and techniques 1.4 Leadership Concepts:"
    },
    {
      "source_text": "Types of Decisions Teams Make"
    },
    {
      "source_text": "Team Responsibilities"
    },
    {
      "source_text": "Problems That Affect Teams"
    },
    {
      "source_text": "Building Strong Team Communication"
    },
    {
      "source_text": "Expressing Yourself on a Team"
    },
    {
      "source_text": "Team Problem Solving"
    },
    {
      "source_text": "1.1 Ability to read and understand a variety of texts, prepare general information and documents according to target audience; spell with accuracy; use grammar and punctuation effective relationships and conflict management 1.2 Coaching and mentoring skills to provide support to colleagues 1.3 Communication skills including receiving feedback and reporting, maintaining effective relationships and conflict management 1.4 Ability to relate to people from a range of social, cultural, physical and mental backgrounds 1.5 Planning skills to organize required resources and equipment to meet learning needs 1.6 Reporting skills to organize information; assess information for relevance and accuracy; identify and elaborate on learning outcomes 1.7 Facilitation skills to conduct small group training sessions"
    },
