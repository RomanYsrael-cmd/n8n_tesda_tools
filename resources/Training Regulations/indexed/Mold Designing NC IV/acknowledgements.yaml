      "source_text": "SECTION 3 TRAINING ARRANGEMENTS"
    },
    {
      "source_text": "These standards are set to provide technical and vocational education and training (TVET) providers with information and other important requirements to consider when designing training programs for MOLD DESIGNING NC IV."
    },
    {
      "source_text": "They include information on curriculum design; training delivery; trainee entry requirements; tools and equipment; training facilities; and trainer’s qualification."
    },
    {
      "source_text": "3.1 CURRICULUM DESIGN"
    },
    {
      "source_text": "TESDA shall provide the training on the development of competency-based curricula to enable training providers develop their own curricula with the components mentioned below."
    },
    {
      "source_text": "Delivery of knowledge requirements for the basic, common and core units of competency specifically in the areas of mathematics, science/technology, communication/language and other academic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their curricula."
    },
    {
      "source_text": "Course Title: MOLD DESIGNING NC IV"
    },
    {
      "source_text": "Nominal Training Duration 47 Hours Basic Competencies"
    },
    {
      "source_text": "120 Hours Common Competencies"
    },
    {
      "source_text": "232 Hours Core Competencies Total - 399 Hours"
    },
    {
      "source_text": "Course Description:"
    },
    {
      "source_text": "This course is designed to enhance the knowledge, skill and attitudes of MOLD DESIGNING NC IV in accordance with industry standards. This covers competencies that a person must achieve in performing tasks such as determining mold design parameters, perform CAD operation, simulation and verification of mold design, modifying and finalizing of mold design and creating fabrication drawing."
    },
    {
      "source_text": "Upon completion of the course, the learners are expected to demonstrate the above-mentioned competencies to be employed. To obtain this, all units prescribed for this qualification must be achieve."
    },
