  "source_text": "ACKNOWLEDGEMENTS\n138- 140\n\n--- PDF PAGE 5 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n1\n\nTRAINING REGULATIONS FOR\nMOLD DESIGNING NC IV\n\nSECTION 1 MOLD DESIGNING NC IV\n\nThe MOLD DESIGNING NC IV qualification consists of competencies that the\ndesigner must achieve to enable them to perform tasks such as capability of reviewing tools\nand design, determine the methods to assemble, test and debug complete mold sets.\n\nThis qualification is packaged from the competency map of Mold designing – Metals\nand engineering sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE722201\nMEE722202\nMEE722203\nMEE722204\nMEE722205\nMEE722206\nMEE722207\nMEE722208\nMEE722210\nMEE722211\nICT311201\nApply safety practices\nInterpret working drawings and sketches\nSelect/ cut workshop materials\nPerform shop computations (Basic)\nMeasure workpiece (Basic)\nPerform routine housekeeping\nPerform shop computations (Intermediate)\nMeasure workpiece using angular measuring instruments\nMeasure workpiece using gages and surface texture comparator\nPerform preventive and corrective maintenance\nOperate a personal computer\n\nA person who has achieved this Qualification is competent to be a\n▪ Mold Designer\n\nCODE NO.\nBASIC COMPETENCIES\n500311401\nUtilized specialized communication skills\n500311402\nDevelop and lead teams\n500311403\nPerform higher-order thinking processes and apply techniques in the\nworkplace\n500311404\nContribute to the practice of social justice in the workplace\n500311405\nManage innovative work instructions\n500311406\n500311407\n\n500311408\n\n500311409\n\nManage and evaluate usage of information\nLead in improvement of Occupational Safety and Health(OSH) programs,\npolicies and procedures\nLead towards improvement of environment work programs, policies and\nprocedures\nSustain entrepreneurial skills\nCODE NO.\nCORE COMPETENCIES\nMEE722326\nMEE722327\nMEE722328\nMEE722329\nMEE722330\n\nDetermine mold design parameters\nPerform CAD operation\nSimulate and verify mold design\nModify and finalize mold design\nCreate fabrication drawing\n\n--- PDF PAGE 6 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n2\n\nSECTION 2. COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in MOLD\nDESIGNING NC IV. These units of competency are categorized into basic, common and core\ncompetencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\n\nUNIT CODE\n:\n500311401\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nuse specialized communication skills to meet specific needs of\ninternal and internal clients, conduct interviews, facilitate\ndiscussion with groups, and contribute to the development of\ncommunication strategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n1.1 Specific\ncommunication needs\nof clients and\ncolleagues are\nidentified and met\n1.2 Different approaches\nare used to meet\ncommunication needs\nof clients and\ncolleagues\n1.3 Conflict is addressed\npromptly in a manner\nwhich does not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n1.3 Communication\nskills relevant to\nclient groups\n1.4 Flexibility in\ncommunication\n\n1.1 Full range of\ncommunication\ntechniques including:\n1.1.1 Effective\ncommunication\nprocess\n1.1.2 Active listening\n1.1.3 Giving/ receiving\nfeedback\n1.1.4 Interpretation of\ninformation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.1.8 Conduct seminars\n1.1.9 Public speaking\n1.2 Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n--- PDF PAGE 7 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for internal\nand external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work related network\nand relationship are\nmaintained\n2.5 Negotiation and\nconflict resolution\nstrategies are used\nwhere required\n2.5 Communication with\nclients and colleagues is\nperformed appropriate to\nindividual needs and\norganizational objectives\n2.1 Communication\nprocess\n2.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n2.3 Openness and\nflexibility in\ncommunication\n2.4 Communication\nskills relevant to\nclient groups\n\n2.1 Full range of\ncommunication\ntechniques\nincluding:\n2.1.1 Effective\ncommunication\nprocess\n2.1.2 Active listening\n2.1.3 Giving/ receiving\nFeedback\n2.1.4 Interpretation of\ninformation\n2.1.5 Role boundaries\nsetting\n2.1.6 Negotiation\n2.1.7 Establishing\nempathy\n2.1.8 Openness and\nflexibility in\ncommunication\n2.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n3. Deliver a\ntechnical\npresentation\n3.1 Presentation is\ndelivered clearly,\nsequential and\ndelivered within\nallotted time\n3.2 Utilize appropriate\nmedia to enhance\npresentation\n3.3 Differences in\nviews/opinions are\nrespected\n3.4 Questions during fora\nare responded in a\nmanner consistent\nwith organizational\nstandard\n3.1 Communication\nprocess\n3.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n3.3 Openness and\nflexibility in\ncommunication\n3.4 Communication\nskills relevant to\nclient groups\n\n3.1 Full range of\ncommunication\ntechniques\nincluding:\n3.1.1 Effective\ncommunication\nprocess\n3.1.2 Active listening\n3.1.3 Giving/receiving\nfeedback\n3.1.4 Interpretation of\ninformation\n3.1.5 Role boundaries\nsetting\n3.1.6 Negotiation\n3.1.7 Establishing\nempathy\n3.1.8 Openness and\n\n--- PDF PAGE 8 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n flexibility in\ncommunication\n3.19 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n4. Represent the\norganization\n4.1 When participating in\ninternal or external\nforums, presentation\nis relevant,\nappropriately\nresearched and\npresented in a manner\nto promote the\norganization\n4.2 Presentation is clear\nand sequential and\ndelivered within a\npredetermined time\n4.3 Utilize appropriate\nmedia to enhance\npresentation\n4.4 Differences in views\nare respected\n4.5 Written\ncommunication is\nconsistent with\norganizational\nstandards\n4.6 Inquiries are\nresponded in a\nmanner consistent\nwith organizational\nstandard\n4.7 Consolidate ideas\nand suggestions\n4.8 Generalize and\nsummarize all ideas\nand suggestions\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n4.3 Openness and\nflexibility in\ncommunication\n4.4 Communication\nskills relevant to\nclient groups\n\n4.1 Full range of\ncommunication\ntechniques\nincluding:\n4.1.1 Effective\ncommunication\nprocess\n4.1.2 Active listening\n4.1.3 Giving/ receiving\nfeedback\n4.1.4 Interpretation of\ninformation\n4.1.5 Role boundaries\nsetting\n4.1.6 Negotiation\n4.1.7 Establishing\nempathy\n4.1.8 Openness and\nflexibility in\ncommunication\n4.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 9 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n5\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Facilitate group\ndiscussion\n5.1 Mechanisms which\nenhance effective\ngroup interaction is\ndefined and implemented\n5.2 Strategies which\nencourage all group\nmembers to participate\nare used routinely\n5.3 Objectives and agenda\nfor meetings and\ndiscussions are routinely\nset and followed\n5.4 Relevant information is\nprovided to group to\nfacilitate outcomes\n5.5 Evaluation of group\ncommunication\nstrategies is undertaken\nto promote participation\nof all parties\n5.6 Specific communication\nneeds of individuals are\nidentified and addressed\n5.1 Communication\nprocess\n5.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n5.3 Openness and\nflexibility in\ncommunication\n5.4 Communication\nskills relevant to\nclient groups\n\n5.1 Full range of\ncommunication\ntechniques including:\n5.1.1 Effective communication\nprocess\n5.1.2 Active listening\n5.1.3 Giving/receiving\nfeedback\n5.1.4 Interpretation of\ninformation\n5.1.5 Role boundaries setting\n5.1.6 Negotiation\n5.1.7 Establishing empathy\n5.1.8 Openness and flexibility\nin communication\n5.2 Communication skills\nrequired to fulfill job roles\nas specified by the\norganization\n\n6. Conduct\ninterview\n6.1 A range of appropriate\ncommunication strategies\nare employed in\ninterview situations\n6.2 Records of interviews are\nmade and maintained in\naccordance with\norganizational\nprocedures\n6.3 Effective questioning,\nlistening and nonverbal\ncommunication\ntechniques are used to\nensure that required\nmessage is\ncommunicated\n6.1 Communication\nprocess\n6.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n6.3 Effective\nquestioning\ntechniques\n6.3 Communication\nskills relevant to\nclient groups\n\n6.1 Full range of\ncommunication\ntechniques including:\n6.1.1 Effective communication\nprocess\n6.1.2 Active listening\n6.1.3 Giving/ receiving\nfeedback\n6.1.4 Interpretation of\ninformation\n6.1.5 Role boundaries setting\n6.1.6 Negotiation\n6.1.7 Establishing empathy\n6.2 Effective clarifying and\nprobing techniques\n(questioning skills)\n6.3 Communication skills\nrequired to fulfill job roles\nas specified by the\norganization\n\n--- PDF PAGE 10 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\nMay include:\n1.1 Recognizing own limitations\n1.2 Referral to specialists\n1.3 Utilizing techniques and aids\n1.4 Providing written drafts\n1.5 Verbal and non verbal communication\n2. Effective group\ninteraction\nMay include:\n2.1 Identifying and evaluating what is occurring within an\ninteraction in a non judgmental way\n2.2 Using active listening\n2.3 Making decision about appropriate words, behavior\n2.4 Putting together response which is culturally appropriate\n2.5 Expressing an individual perspective\n2.6 Expressing own philosophy, ideology and background\nand exploring impact with relevance to\ncommunication\n2.7 Openness and flexibility in communication\n3. Types of Interview\nMay include:\n3.1 Related to staff issues\n3.2 Routine\n3.3 Confidential\n3.4 Evidential\n3.5 Non disclosure\n3.6 Disclosure\n4. Interview situations\nMay include:\n4.1 Establish rapport\n4.2 Elicit facts and information\n4.3 Facilitate resolution of issues\n4.4 Develop action plans\n4.5 Diffuse potentially difficult situation\n\n--- PDF PAGE 11 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n7\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated effective communication skills with\nclients accessing service and work colleagues\n1.2 Adopted relevant communication techniques and\nstrategies to meet client particular needs and difficulties\n2. Resource Implications\n2.1 Access to appropriate workplace where assessment can\ntake place\n\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case Study\n3.2 Interview\n3.3 Portfolio\n3.4 Written Test\n3.5 Role Play\n\n4. Context for Assessment\n4.1 This unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 12 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n8\n\nUNIT OF COMPETENCY:\nDEVELOP AND LEAD TEAMS\n\nUNIT CODE\n:\n500311402\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ndetermine individual and team development needs and facilitate\nthe development of the workgroup.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Foster\nIndividual\ngrowth\n1.1 Learning and\ndevelopment\nneeds of team\nmembers are\nsystematically\nidentified in line\nwith\norganizational\nrequirements\n1.2 Development plan\nto meet individual\nneeds is\ncollaboratively\ndeveloped and\nimplemented\n1.3 Individuals are\nencouraged to\nself -evaluate\nperformance and\nidentify areas for\nimprovement\n1.4 Feedback on\nperformance of\nteam members is\ncollected from\nrelevant sources\nand compared\nwith established\nteam learning\nprocess\n1.1 Effective\nworkplace\ncommunication,\ncoaching and\nmentoring\nprinciples\n1.2 Feedback\nprinciples and\nprocedures\n1.3 Working\ninterdependently:\nstrategies and\ntechniques\n1.4 Leadership\nConcepts:\n• Types of\nDecisions\nTeams Make\n• Team\nResponsibilities\n• Problems That\nAffect Teams\n• Building Strong\nTeam\nCommunication\n• Expressing\nYourself on a\nTeam\n• Team Problem\nSolving\n\n1.1 Ability to read and\nunderstand a variety of\ntexts, prepare general\ninformation and\ndocuments according to\ntarget audience; spell\nwith accuracy; use\ngrammar and\npunctuation effective\nrelationships and\nconflict management\n1.2 Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n1.3 Communication skills\nincluding receiving\nfeedback and reporting,\nmaintaining effective\nrelationships and\nconflict management\n1.4 Ability to relate to\npeople from a range of\nsocial, cultural, physical\nand mental\nbackgrounds\n1.5 Planning skills to\norganize required\nresources and\nequipment to meet\nlearning needs\n1.6 Reporting skills to\norganize information;\nassess information for\nrelevance and accuracy;\nidentify and elaborate\non learning outcomes\n1.7 Facilitation skills to\nconduct small group\ntraining sessions\n\n--- PDF PAGE 13 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n9\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster\nindividual and\nteam growth\n2.1. Learning and\ndevelopment program\ngoals and objectives\nare identified to match\nthe specific\nknowledge and skills\nrequirements of\ncompetency\nstandards\n2.2. Learning delivery\nmethods are\nappropriate to the\nlearning goals, the\nlearning style of\nparticipants and\navailability of\nequipment and\nresources\n2.3. Workplace learning\nopportunities and\ncoaching/ mentoring\nassistance are\nprovided to facilitate\nindividual and team\nachievement of\ncompetencies\n2.4. Resources and\ntimelines required for\nlearning activities are\nidentified and\napproved in\naccordance with\norganizational\nrequirements\n2.1 Advanced\ncoaching and\nmentoring\ntechniques\n2.2 Performance\nevaluation\nconcepts\n2.3 Training and\ndevelopment\ntechniques\n\n2.1 Instructional\nplanning and\ndelivery skills\n2.2 Monitoring and\nevaluation skills\n2.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 14 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n10\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from\nindividuals or teams is\nused to identify and\nimplement\nimprovements in\nfuture learning\narrangements\n3.2 Outcomes and\nperformance of\nindividuals/teams are\nassessed and\nrecorded to determine\nthe effectiveness of\ndevelopment\nprograms and the\nextent of additional\nsupport\n3.3 Modifications to\nlearning plans are\nnegotiated to improve\nthe efficiency and\neffectiveness of\nlearning\n3.4 Records and reports of\ncompetency are\nmaintained within\norganizational\nrequirement\n3.1 Types and levels\nof learning\nevaluation\n3.2 Learning styles\nand strategies\n3.3 Training and\ndevelopment\napproaches\n\n3.1\n Instructional\nplanning and\ndelivery skills\n3.2\nMonitoring and\nevaluation skills\n3.3\nMentoring and\ncoaching skills\n\n--- PDF PAGE 15 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n11\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Develop team\ncommitment\nand\ncooperation\n4.1 Open communication\nprocesses to obtain\nand share information\nis used by team\n4.2 Decisions are reached\nby the team in\naccordance with its\nagreed roles and\nresponsibilities\n4.3 Mutual concern and\ncamaraderie are\ndeveloped in the team\n4.4 Career planning for\neach member are\nmonitored\n4.1 Career\ndevelopment for\ngroup members\n4.2 Principles of\nteam commitment\nand cooperation\n4.3 Team dynamics\nand performance\n4.1 Instructional\nplanning and\ndelivery skills\n4.2 Monitoring and\nevaluation skills\n4.3 Mentoring and\ncoaching skills\n5. Facilitate\naccomplishment\nof team goals\n5.1 Team members\nactively participated in\nteam activities and\ncommunication\nprocesses\n5.2 Teams members\ndeveloped individual\nand joint responsibility\nfor their actions\n5.3 Collaborative efforts\nare sustained to attain\norganizational goals\n5.1 Group\nDevelopment\nProcess and\nPrinciples as\napplied in the\nworkplace\n5.2 Principles of\norganizational\ndevelopment\n5.3 Collaboration\nprinciples and\nprocedures\n\n5.1\nInstructional\nplanning and\ndelivery skills\n5.2\nMonitoring and\nevaluation skills\n5.3\nMentoring and\ncoaching skills\n5.4\nOrganizational\nleadership\n\n--- PDF PAGE 16 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning and\n development needs\n\nMay include:\n1.1 Coaching, mentoring and/or supervision\n1.2 Formal/informal learning program\n1.3 Internal/external training provision\n1.4 Work experience/exchange/opportunities\n1.5 Personal study\n1.6 Career planning/development\n1.7 Performance appraisals\n1.8 Workplace skills assessment\n1.9 Recognition of prior learning\n1.10 Job design and enrichment\n2. Organizational\n requirements\nMay include:\n2.1 Quality assurance and/or procedures manuals\n2.2 Goals, objectives, plans, systems and processes\n2.3 Legal and organizational policy/guidelines and\n requirements\n2.4 Safety policies, procedures and programs\n2.5 Confidentiality and security requirements\n2.6 Business and performance plans\n2.7 Ethical standards\n2.8 Quality and continuous improvement processes and\nstandards\n3. Feedback on\n performance\nMay include:\n3.1 Formal/informal performance appraisals\n3.2 Obtaining feedback from supervisors and\ncolleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for monitoring\nservice delivery\n4. Learning delivery\n methods\nMay include:\n4.1 On the job coaching or mentoring\n4.2 Problem solving\n4.3 Presentation/demonstration\n4.4 Formal course participation\n4.5 Work experience\n4.6 Involvement in professional networks\n4.7 Conference and seminar attendance\n4.8 Induction\n\n--- PDF PAGE 17 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n13\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for others\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the team\n1.4. Negotiated learning plans to improve the effectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation of work activities of the individual member in relation\nto the work activities of the group\n3.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues\nand strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be observed while tasks are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 18 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n14\n\nUNIT OF COMPETENCY\n:\nPERFORM HIGHER-ORDER THINKING PROCESSES AND\nAPPLY TECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n: 500311403\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required\n\nto use fundamental critical thinking skills in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Evaluate\neffectiveness\nand efficiency\nof the\nworkplace\nsystems,\nprocesses and\nprocedures.\n1.1 Effectiveness and\nefficiency of\nworkplace standards\nand procedures are\nexamined.\n1.2. Usage of inquiry and\ndialogue to\ncommunicate\nevaluation measures\nand results are\nimplemented.\n1.3 Evaluation reports are\nprepared and\ncommunicated to team\nmembers.\n\n1.1 Systems,\nstandards,\nprocedures and\nprotocols in the\nworkplace.\n1.2 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations\n1.3 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n1.4 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n1.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n1.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n1.3 Using critical thinking\npathway to formulate\nand ask relevant\nquestions and come\nup with appropriate\nanswers.\n1.4 Performing\nassimilation and\naccommodation skills\nto interpret and distil\nkey information of\nrelevance to a given\nsituation.\n1.5 Assessing and\nmeasuring the extent\nof effectiveness and\nefficiency of the\nsystems, processes\nand procedures in the\nworkplace.\n\n--- PDF PAGE 19 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n15\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster the\nhabit of critical\ninquiry and\ncuriosity in the\nworkplace.\n2.1 Issues and situations\nare reflected on and\nwondered about.\n2.2 Issues and problems\nin the workplace\nparticularly in the\npolicies, procedures\nand protocols are\ndiscussed and\nevaluated between\nand among teams.\n2.3 Evaluation of\nefficiency and\neffectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated and\nagreed upon between\nand among teams.\n2.4 Growth mindset and\npositive relationship\nand communication is\napplied in the context\nof curiosity and\ncritical inquiry in the\nworkplace.\n2.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n2.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n2.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n2.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n2.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n2.3 Using critical\nthinking pathway to\nformulate and ask\nrelevant questions\nand come up with\nappropriate\nanswers.\n2.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n2.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n2.6 Communicating\ninsights on\nworkplace\neffectiveness and\nefficiency.\n\n--- PDF PAGE 20 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n16\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Develop\npractical\naction plans\nfor improving\nworkplace\nconditions.\n3.1 Evaluation of efficiency\nand effectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated to\nstakeholders.\n3.2 Practical action plans\nin improving workplace\nconditions are\nformulated, presented\nand negotiated with\nstakeholders.\n3.3 Proposed changes and\ndirections are inquired,\nprocessed and\nnegotiated between\nand among teams, and\nstakeholders as well of\nthe organization.\n3.4 Commitment to\ncontinuous\nimprovement and\nchange is highlighted.\n3.5 Passion and dedication\nfor changing and\nadapting to the\ndemands of the 21st\ncentury workplace are\nconsidered.\n3.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n3.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n3.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n3.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n3.5 Creative\nnegotiation skills.\n3.6 Change\nmanagement and\ncontinuous\nimprovement\nconcepts.\n3.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n3.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n3.3 Using critical thinking\npathway to formulate\nand ask relevant\nquestions and come\nup with appropriate\nanswers.\n3.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n3.5 Assessing and\nmeasuring the extent\nof effectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n3.6 Communicating\npractical insights on\nimproving workplace\nconditions.\n\n--- PDF PAGE 21 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n17\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Effectiveness and\nefficiency\nMay include;\n1.1 Developing a more efficient way of doing something\n1.2 Developing a new idea\n1.3 Developing and improving products and services\n1.4 Enhancing skills and career opportunities\n1.5 Enhancing the physical environment\n1.6 Financial benefit\n1.7 Greater personal satisfaction\n1.8 Improving interpersonal relationships\n1.9 Evaluating overall workplace conditions\n2. Curiosity and critical\ninquiry\nMay include:\n2.1\nAccuracy\n2.2\nBreadth\n2.3\nClarity\n2.4\nDepth\n2.5\nEmotion\n2.6\nFairness\n2.7\nLogic\n2.8\nMeaning\n2.9\nPlanning\n2.10 Attention\n2.11 Precision\n2.12 Relevance\n2.13 Significance\n2.14 Social engagement\n2.15 Society\n2.16 Style\n2.17 Growth mindset\n2.18 Positive communication\n2.19 Positive negotiation\n2.20 Workplace conditions\n2.21 Appreciative inquiry methods\n\n--- PDF PAGE 22 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n18\n\nVARIABLE\nRANGE\n3. Practical action plans\nMay include:\n3.1 Insights on continuous improvement\n3.2 Creative strategies and techniques for becoming better\nat work and real life\n3.3 Career plans\n3.4 Challenging workplace policies, procedures and\nprotocols\n3.5 Specifying plans for change and adapting to the\ndemands of the contemporary workforce\n3.6 Challenges in negotiating with stakeholders and teams\n3.7 Change management, innovation and knowledge\ncreation\n3.8 Contractual agreements\n3.9 Extreme time pressure or non-negotiable deadlines\n3.10 Financial limitations\n3.11 Procedures determined by laws or other regulations\n3.12 Safety issues\n3.13 When others are totally closed to new ideas\n3.14 acknowledging shared responsibility\n3.15 adopting a positive 'can do' attitude\n3.16 following up on practical details\n3.17 pro-actively seeking information\n3.18 suggesting a new approach\n3.19 talking to others about possible answers\n3.20 constraints of the broader context and environment\n3.21 overall goal - what needs to be achieved\n3.22 personal hopes and expectations\n\n--- PDF PAGE 23 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n19\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated the effectiveness and efficiency of workplace\nsystems, processes and procedures.\n1.2\nModelled the conscious process of critical inquiry to get new\ninsights that s/he can get in formulating action plans on\ncontinuous improvement in the workplace and real-life\n1.3\nPracticed the habit of critical inquiry and curiosity in the\nworkplace\n1.4\nShown a thorough knowledge and understanding of how\ncritical thinking impacts on individual lives, the broader\ncommunity and work situations.\n1.5\nDeveloped practical action plans for improving workplace\nconditions.\n2. Resource\nImplications\n2.1.\nInteractions with specific challenges and situations to\ndemonstrate the application of critical thinking (this would\nusually involve interactions with others).\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDirect questioning combined with review of portfolios of\nevidence and third-party workplace reports of on-the-job\nperformance by the candidate\n3.2\nEvaluation of a candidate blog exploring different ideas and\nquestions\n3.3\nReview of candidate response to scenarios that allow the\ncandidate to apply critical thinking techniques to a life or work\nsituation, and to demonstrate ability to portray curiosity and\nexploration of new concepts\n3.4\nEvaluation of candidate response to the challenge of\nadopting different perspectives on a situation, and ability to\nboth develop and respond to questions from those\nperspectives\n3.5\nObservation of the candidate participating in a group\nproblem-solving session\n3.6\nOral or written questioning to assess knowledge of typical\nblockers to the critical thinking process.\n3.7\nLife Narrative Inquiry to reflect life stories that reflect how\ncritical thinking and problem solving is applied in the lives.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 24 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n20\n\nUNIT OF COMPETENCY : CONTRIBUTE TO THE PRACTICE OF SOCIAL JUSTICE\nIN THE WORKPLACE\n\nUNIT CODE\n: 500311404\n\nUNIT DESCRIPTOR\n: This unit covers ways and means to assume active roles in\nresolving local and global challenges and to become proactive\ncontributors to a more peaceful and sustainable world.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Update self\non local,\nnational and\nglobal\ntrends/\nissues in the\nworkplace\n1.1 Media are regularly\nscanned/ monitored\nfor trends and issues\nrelevant to human\nrights, gender equality,\npromotion of culture of\npeace and non-\nviolence, global\ncitizenship and\nappreciation of cultural\ndiversity.\n1.2 Knowledge and\nunderstanding of local,\nnational and global\nissues and their\ninterconnectedness and\ninterdependency are\nacquired.\n1.3 Notable issues and\ntrends are critically\nexamined and\ndiscussed with peers,\ncolleagues, or family\nmembers.\n1.1 Local, national\nand global\nsystems and\nstructures\n1.2 Issues affecting\ninteraction and\nconnectedness of\ncommunities at\nlocal, national\nand global levels\n1.3 Underlying\nassumptions and\npower dynamics\n(politics,\nunderstanding\npolitical system,\nsocial structures,\nlabor laws, labor\nrelations, human\nright)\n\n1.1 Monitoring trends\nand issues\nrelevant to human\nrights, gender\nequality, culture of\npeace, global\ncitizenship, and\ncultural diversity\nusing different\nmedia platforms\n1.2 Analyzing trends\nand issues\nrelevant to human\nrights, gender\nequality, culture of\npeace, global\ncitizenship, and\ncultural diversity\n1.3 Engaging in\ndiscourse about\nthe local, national\nand global issues\n\n--- PDF PAGE 25 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n21\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Relate local\nand global\ntrends to\nworkplace\ncontext\n2.1 Local events are\nreflected on for\nimplications in one’s\nown situation and in the\nexternal global\nenvironment.\n2.2 Sense of belonging to a\ncommon humanity,\nsharing values and\nresponsibilities are\ndeveloped.\n2.3 Attitudes of empathy,\nsolidarity and respect\nfor differences and\ndiversity are\nstrengthened.\n2.1 Different levels of\nhuman identity\naccording to\nAmber Mayer\n(2015)\n2.2 Different\ncommunities\npeople belong to\nand how these\nare connected\n2.3 Difference and\nrespect for\ncultural diversity\n2.1 Recognizing\ndifferences and\ncommonalities\namong people\n2.2 Strengthening\nattitudes of\nempathy, solidarity\nand respect for\ndiversity\n2.3 Connecting local\nissues to global\ntrends, and vice\nversa.\n3. Engage and\ntake actions\non workplace\nissues and\nconcerns\n3.1 Effective and\nresponsible actions at\nlocal, national and\nglobal levels are\nidentified.\n3.2 Motivation and\nwillingness to take\nnecessary actions are\ndeveloped.\n3.3 Attitude of “thinking\nglobally and acting\nlocally” is practiced.\n3.1 Actions that can\nbe taken\nindividually and\ncollectively\n3.2 Ethically\nresponsible\nbehaviour\n3.3 Importance and\nbenefits of civic\nengagement\n3.4 Strategies and\ntechniques of\n“thinking globally\nand acting\nlocally\n3.1 Employing\nappropriate actions\nto address\nworkplace issues\ninvolving national\nand global trends\n3.2 Showing concern\nand willingness to\ntake part in the\ndevelopment\nefforts to discuss\nworkplace issues\nand concerns\n3.3 Applying the\nattitude of “thinking\nglobally and acting\nlocally” in the\nworkplace\n\n--- PDF PAGE 26 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n22\n\n RANGE OF VARIABLES\n\n EVIDENCE GUIDE\n\nVARIABLE\nRANGE\n1. Media\nMay include:\n1.1\nPrint media\n1.2\nBroadcast media\n1.3\nInternet and social media\n2. Scanning/Monitoring\nMay include:\n2.1\nSourcing from key informants\n2.2\nConversation with clients\n2.3\nMan-on-the-street conversation\n2.4\nScanning print and broadcast media\n3. Local, national and\nglobal issues\n\nMay include:\n3.1\nPoverty\n3.2\nUnemployment\n3.3\nGlobal warming\n3.4\nSafety, security, and well-being\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability and attitude to keep oneself\nupdated of relevant issues/trends\n1.2 Demonstrated ability to think and act based on\none’s principles and values\n1.3 Demonstrated a holistic/global outlook on internal\nand external events in the workplace\n2. Resource Implications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Case studies\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning\n3.2\nCase problems involving global and local issues\n3.3\nThird-party report\n4. Context for Assessment\n4.1\nCompetency assessment may occur in workplace\nor any appropriately simulated environment\n\n--- PDF PAGE 27 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n23\n\nUNIT OF COMPETENCY : MANAGE INNOVATIVE WORK INSTRUCTIONS\n\nUNIT CODE\n: 500311405\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\n\n to sustain and develop a workplace environment in which\n\nimprovement, innovation and learning are promoted and\n\nreinforced.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Review and\nanalyze existing\nworkplace\npractices\n1.1 Current instructions\nand strategies to\nperform tasks in the\nworkplace are\nreviewed\n1.2 Climate for\ninnovation at the\norganizational level\nis defined\n1.3 Innovation drivers in\nthe workplace are\nidentified\n1.1. Four drivers of\ninnovation\naccording to\nGallup\nManagement\nJournal (2007)\n1.2. Contextual\nvariables\nrelated to\ninnovative\npractices in the\norganization\n1.3. The nine\ndimensions of\ninnovation\nclimate (Isaksen\n& Isaksen,\n2018)\n1.4. Types of\nInnovation\nidentified by\nGopalakrishnan\nand Damanpour\n(1997)\n1.1 Investigating the\norganizational\nneeds in the\ninnovation process\n1.2 Defining current\norganizational\ninnovative\npractices\n1.3 Linking innovation\nto contextual\nvariables in the\norganization\n\n--- PDF PAGE 28 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n24\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Examine\nopportunities\nfor continuous\nimprovement\nand innovation\nof practices in\nthe workplace\n2.1. Effectiveness of\ninnovative practices in\nthe workplace is\ndetermined\n2.2. Innovative behaviors\nof leaders or managers\nin the organization are\nassessed\n2.3. Driving principles of\ninnovation are\ndiscussed\n2.1 Determinants of\ninnovative\nbehavior by\nScott and Bruce\n(1992)\n2.2 Four principles of\ninnovation\naccording to\nGallup\nManagement\nJournal (2007)\n\n2.1 Evaluating\norganizational\ninnovative\npractices\n2.2 Gauging innovative\nbehaviors of the\nleaders and\nmanagers in the\norganization\n2.3 Deliberating\nopportunities and\nchallenges in\nimplementing\ninnovation\n3. Implement\ninnovative\nways in the\nconduct of\nusual\nworkplace\npractices\n3.1. Innovative behaviors in\nthe workplace are\nperformed\n3.2. Innovative climate in the\nworkplace is maintained\n3.3. Adoption or modification\nof new ideas relevant to\nthe organizational needs\nis achieved\n3.1 Determinants of\ninnovative\nbehavior by\nScott and Bruce\n(1992)\n3.2 The nine\ndimensions of\ninnovation\nclimate (Isaksen\n& Isaksen, 2018)\n3.3 Techniques in\nimplementing\ninnovative\nchange in the\nworkplace\n\n3.1 Developing risk\nmanagement\ntechniques and\ncontrol systems\n3.2 Evaluating impact\nof changes and\ndeveloping action\nplans\n3.3 Demonstrating\nstrategies and\ntechniques in\nmanaging changes\nin the workplace\n\n--- PDF PAGE 29 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n25\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Innovation\nMay include:\n1.1 Products versus processes\n1.2 Radical versus incremental\n1.3. Technical versus administrative\n2. Innovative behaviors\nMay include:\n2.1 Always generate creative ideas or new solutions\n2.2 Exploring and secure funds or resources required for\nimplementing new ideas\n2.3 Establishing adequate plans and schedules for\nimplementing new ideas\n2.4 Contributing suggestions or approaches for others’\ncreative ideas\n\n--- PDF PAGE 30 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n26\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAnalyzed and evaluated systems and performance in\nkey areas of the organization and identify opportunities\nfor improvement, seeking advice from experts as\nappropriate\n1.2\nPromoted the value of creativity, innovation and\nsustainability and recognize successes\n1.3\nSupported the testing and trialing of new ideas and\nundertake risk management and cost-benefit analysis\nfor options\n1.4\nPlanned for and implemented improvements using\norganization’s processes for approvals, project\nmanagement and change management\n1.5\nFacilitated effective contributions to and\ncommunications about continuous improvement and\ninnovation\n1.6\nCaptured insights, experiences and ideas for\nimprovements and incorporate them into the\norganization’s knowledge management systems and\nfuture planning.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Impact evaluation materials (guide and form)\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Interview\n3.2 Written Evaluation\n3.3 Case analysis\n4. Context for Assessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 31 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n27\n\nUNIT OF COMPETENCY :\nMANAGE AND EVALUATE USAGE OF INFORMATION\n\nUNIT CODE\n: 500311406\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills and\n\nattitudes required to support\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Review\ninformation\nneeds and\nsources\n1.1. The information needs\nof individuals/teams are\ndetermined and the\nsources are identified.\n1.2. Information held by the\norganisation is\nreviewed to determine\nsuitability and\naccessibility.\n1.3. Plans are prepared to\nobtain information that\nis not available or\naccessible within the\norganization.\n1.1. Analysis and\ndisplay\ntechniques\n1.2. Information\nevaluation issues\n1.3. Information\nstorage\nrequirements and\nmethods\n1.4. Reporting\nprocedures of the\norganisation\n1.1. Analysing record\ninformation\n1.2. Communicating\neffectively\n1.3. Disseminating\ninformation\n1.4. Presenting\ninformation\n\n2. Collect and\nanalyze\ninformation\n2.1. Collection of\ninformation is\ninterpreted timely and\nrelevant to the needs of\nindividuals/teams.\n2.2. Information is collected\nin formal suitable for\nanalysis, interpretation\nand dissemination.\n2.3. Information is analyzed\nto identify relevant\ntrends and\ndevelopments in terms\nof the needs for which\nis acquired.\n2.1. Information\ncollection,\ncollation\n2.2. Analysis and\ndisplay\ntechniques\n2.3. Information\nevaluation issues\n2.4. Information\nstorage\nrequirements and\nmethods\n2.5. Reporting\nprocedures of the\norganisation\n2.1. Collecting and\ncollating information\n2.2. Analysing record\ninformation\n2.3. Communicating\neffectively\n2.4. Disseminating\ninformation\n2.5. Presenting\ninformation\n\n3. Use\nmanagement\ninformation\nsystems\n3.1. Management\ninformation systems\nare used to store and\nretrieve data for\ndecision making.\n3.2. Technology available in\nthe work area/\norganisation is used to\nmanage information.\n3.3. Recommendations for\nimproving the\ninformation system are\nsubmitted to\ndesignated persons/\ngroups.\n\n3.1. Analysis and\ndisplay\ntechniques\n3.2. Information\ncollection,\ncollation\n3.3. Information\nevaluation issues\n3.4. Information\nstorage\nrequirements and\nmethods\n3.5. Reporting\nprocedures of the\norganisation\n3.1. Analysing record\ninformation\n3.2. Collecting and\ncollating information\n3.3. Communicating\neffectively\n3.4. Disseminating\ninformation\n3.5. Presenting\ninformation\n3.6. Using management\ninformation systems\nto store and retrieve\ndata\n\n--- PDF PAGE 32 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n28\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Report and\ndisseminate\nanalyzed\ninformation\n\n4.1. The results of\ninformation gathering,\nanalysis and synthesis\nare reported within\nspecified time frames\nand to the standard\ndefined by the\norganisation.\n4.2. The results of\ninformation gathering,\nanalysis and synthesis\nare reported so they\ncan be inputs to policy\ndevelopment and\norganisation decision\nmaking.\n4.3. Information which is\ngathered is\ndisseminated to\nappropriate personnel\nwithin the specified\ntimeframe\n4.1. Analysis and\ndisplay\ntechniques\n4.2. Information\ncollection,\ncollation\n4.3. Information\nevaluation issues\n4.4. Information\nstorage\nrequirements and\nmethods\n4.5. Reporting\nprocedures of the\norganisation\n\n4.1. Analysing record\ninformation\n4.2. Collecting and\ncollating information\n4.3. Communicating\neffectively\n4.4. Disseminating\ninformation\n4.5. Presenting\ninformation\n4.6. Using management\ninformation systems\nto store and retrieve\ndata\n\n--- PDF PAGE 33 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n29\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nMay include:\n1.1 Routine and complex reports and submissions\n1.2 Briefing notes\n1.3 Ministerial\n1.4 Proposals\n1.5 Project plans\n1.6 Articles and promotional material\n\n2. Collection\ntechniques or\nmethods\n2.1 Collection techniques may include:\n2.1.1 Research\n2.1.2 Surveys\n2.1.3 Literature search\n2.1.4 Interviews\n2.1.5 Data bases\n2.1.6 Observation\n2.2 Collection methods may include:\n2.2.1 Indexing\n2.2.2 linking\n2.2.3 Sorting\n2.2.4 Comparing\n2.2.5 Categorizing\n2.2.6 Integrating\n\n3. Analysis\nMay include:\n3.1.\napplication of statistical methods\n3.2.\nmathematical calculations\n3.3.\ncritical analysis\n3.4.\nproblem solving\n4. Management\ninformation\nsystems\nMay include:\n4.1.\nComputers\n4.2.\nCommunication channels\n4.3.\nRecords management\n4.4.\nProcedures\n4.5.\nManuals\n4.6.\nProtocol\n4.7.\nLegislation\n4.8.\nGuidelines and awards\n4.9.\nOrganizational\n4.10. Legal and policy materials\n\n--- PDF PAGE 34 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n30\n\nEVIDENCE GUIDE\n\n1 Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified information needs and sources\n1.2\nCollected and analyzed information\n1.3\nDetermined the correct / preventive action\n1.4\nUsed management information systems\n1.5\nRecord and support information\n\nThese aspects may be best assessed using a range of scenarios\nwhat ifs as a stimulus with a walk through forming part of the\nresponse. These assessment activities should include a range of\nproblems, including new, unusual and improbable situations that\nmay have happened.\n2 Resource\nImplications\nSpecific resources for assessment\n2.1\nEvidence of competent performance should be obtained by\nobserving an individual in an information management role\nwithin the workplace or operational or simulated environment.\n3 Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nWritten Test\n3.2\nInterview\n\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n4 Context for\nAssessment\n4.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 35 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n31\n\nUNIT OF COMPETENCY : LEAD IN IMPROVEMENT OF OCCUPATIONAL SAFETY AND\nHEALTH (OSH) PROGRAMS, POLICIES AND PROCEDURES\n\nUNIT CODE\n: 500311407\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required to\nassess Occupational Safety and Health (OSH) practices and\nprograms, recommend OSH program improvement initiatives,\nand implement recommended improvements on Occupational\nSafety and Health (OSH) Programs, Procedures and Policies\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1.\nAssess\nOccupational\nSafety and\nHealth (OSH)\npractices and\nprograms\n1.1 OSH practices and\nprograms are reviewed\nbased on workplace\npolicies and procedures\n1.2 Appropriate personnel\nor OSH reference\nguides are consulted\nfor proper guidance\nbased on workplace\npolicies and procedures\n1.3 Current practices and\nprograms are evaluated\nbased on acceptable\nlevel of OSH work\nstandards\n1.1. OSH practices\nand programs\nworkplace\npolicies and\nprocedures\n1.2. OSH reference\nguides\n1.3. OSH work\nstandards\n1.1. Critical thinking\nskills\n1.2. Evaluating skills\n2. Recommend\nOSH program\nimprovement\ninitiatives\n2.1 OSH work improvement\ninitiatives are identified\nthat are relevant with\nthe workplace scenario\n2.2 OSH program\nimprovement plans are\norganized based on\nworkplace policies and\nprocedures\n2.3 OSH program\nimprovement plans are\npresented based on\nworkplace policies and\nprocedures\n2.1. OSH Programs\n2.2. OSH work\nimprovement\ninitiatives\n2.1. Presentation Skills\n2.2. Communication\nskills\n2.3. Collaborating skills\n2.4. Critical thinking\nskills\n2.5. Observation skills\n\n--- PDF PAGE 36 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n32\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Implement\nrecommended\nimprovements\non\nOccupational\nSafety and\nHealth (OSH)\nPrograms,\nProcedures\nand Policies\n3.1 Approved\nimprovements on OSH\nwork improvement\ninitiatives are\ncommunicated based\non workplace policies\nand procedures\n3.2 Concern personnel\nare guided in\naccordance with\nworkplace policies and\nprocedures\n3.3 Implementation of the\napproved OSH\ninitiatives are\nmonitored in\naccordance with\nworkplace policies and\nprocedures\n3.4 Implementation of\napproved OSH\ninitiatives are\nevaluated based on\nworkplace policies and\nprocedures\n3.1. Coaching\nConcepts\n3.2. OSH work\nimprovement\ninitiatives\n3.3. Supervisory\nConcepts\n3.1. Monitoring Skills\n3.2. Evaluation Skills\n3.3. Auditing Skills\n3.4. Coaching Skills\n3.5. Supervisory Skills\n\n--- PDF PAGE 37 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n33\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Practices and\nPrograms\nMay include:\n1.1\nPlanning, implementation and maintenance of\nmanufacturing plants\n1.2\nWork-physiological, psychological, ergonomic and\nhygienic practices and programs\n1.3\nFirst aid within the workplace\n1.4\nSafety inspection practices\n\n2. OSH Reference Guides\nMay include:\n2.1\nOccupational Safety and Health Standards Book\n2.2\nOSHA Safety Bulletins and Magazines\n2.3\nEquipment Safety Operating Instructions\n2.4\nEstablished National Safety Management Books\n2.5\nCredible OSH Web-sites\n2.6\nSafety Solution Guide Books and Handbooks\n3. OSH Work Improvement\nInitiatives\nMay include:\n3.1\nEliminate the hazard altogether (i.e., get rid of the\ndangerous machine)\n3.2\nIsolate the hazard from anyone who could be harmed\n(i.e., keep the machine in a closed room and operate it\nremotely; barricade an unsafe area off)\n3.3\nSubstitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n3.4\nUse administrative controls to reduce the risk (i.e.,\ntrain workers how to use equipment safely; train\nworkers about the risks of harassment; issue signage)\n3.5\nUse engineering controls to reduce the risk (i.e.,\nattach guards to the machine to protect users)\n3.6\nUse personal protective equipment (i.e., wear gloves\nand goggles when using the machine)\n\n--- PDF PAGE 38 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n34\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consult appropriate personnel or OSH reference guides for\nproper guidance based on workplace policies and procedures\n1.2. Evaluate current practices and programs based on acceptable\nlevel of OSH work standards\n1.3. Identify OSH work improvement initiatives that are relevant with\nthe workplace scenario\n1.4. Present OSH program improvement plans based on workplace\npolicies and procedures\n1.5. Communicate approved improvements on OSH work program\ninitiatives based on workplace policies and procedures\n1.6. Monitor implementation of the approved OSH initiatives in\naccordance with workplace policies and procedures\n1.7. Evaluate implementation of approved OSH initiatives based on\nworkplace policies and procedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n3.4 Observation/Demonstration and oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 39 ---\nMold Designing NC IV Revision 00 P