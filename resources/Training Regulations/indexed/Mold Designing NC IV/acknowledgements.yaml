    {
      "source_text": "UNIT OF COMPETENCY : PERFORM HIGHER-ORDER THINKING PROCESSES AND APPLY TECHNIQUES IN THE WORKPLACE"
    },
    {
      "source_text": "UNIT CODE : 500311403"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit of covers the knowledge, skills and attitudes required"
    },
    {
      "source_text": "to use fundamental critical thinking skills in the workplace."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Evaluate effectiveness and efficiency of the workplace systems, processes and procedures. 1.1 Effectiveness and efficiency of workplace standards and procedures are examined. 1.2. Usage of inquiry and dialogue to communicate evaluation measures and results are implemented. 1.3 Evaluation reports are prepared and communicated to team members."
    },
    {
      "source_text": "1.1 Systems, standards, procedures and protocols in the workplace. 1.2 Different methods of critical and appreciative inquiry and their relevance to different situations 1.3 Techniques to assist in forming the habit of asking questions and taking responsibility for answers. 1.4 Why questions are important and the benefits of asking good questions for individuals, businesses and communities (the importance of critical thinking). 1.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information). 1.2 Communicating to actively listen and to ask questions of others in a constructive way. 1.3 Using critical thinking pathway to formulate and ask relevant questions and come up with appropriate answers. 1.4 Performing assimilation and accommodation skills to interpret and distil key information of relevance to a given situation. 1.5 Assessing and measuring the extent of effectiveness and efficiency of the systems, processes and procedures in the workplace."
    },
    {
      "source_text": "-- PDF PAGE 19 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 15"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Foster the habit of critical inquiry and curiosity in the workplace. 2.1 Issues and situations are reflected on and wondered about. 2.2 Issues and problems in the workplace particularly in the policies, procedures and protocols are discussed and evaluated between and among teams. 2.3 Evaluation of efficiency and effectiveness of workplace policies, procedures and protocols are documented, communicated and agreed upon between and among teams. 2.4 Growth mindset and positive relationship and communication is applied in the context of curiosity and critical inquiry in the workplace. 2.1 Different methods of critical and appreciative inquiry and their relevance to different situations. 2.2 Techniques to assist in forming the habit of asking questions and taking responsibility for answers. 2.3 Why questions are important and the benefits of asking good questions for individuals, businesses and communities (the importance of critical thinking). 2.4 Growth mindset and positive communication and relationship strategies and techniques. 2.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information). 2.2 Communicating to actively listen and to ask questions of others in a constructive way. 2.3 Using critical thinking pathway to formulate and ask relevant questions and come up with appropriate answers. 2.4 Performing assimilation and accommodation skills to interpret and distil key information of relevance to a given situation. 2.5 Assessing and measuring the extent of effectiveness and efficiency of the systems, processes and procedures in the workplace. 2.6 Communicating insights on workplace effectiveness and efficiency."
    },
    {
      "source_text": "-- PDF PAGE 20 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 16"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Develop practical action plans for improving workplace conditions. 3.1 Evaluation of efficiency and effectiveness of workplace policies, procedures and protocols are documented, communicated to stakeholders. 3.2 Practical action plans in improving workplace conditions are formulated, presented and negotiated with stakeholders. 3.3 Proposed changes and directions are inquired, processed and negotiated between and among teams, and stakeholders as well of the organization. 3.4 Commitment to continuous improvement and change is highlighted. 3.5 Passion and dedication for changing and adapting to the demands of the 21st century workplace are considered. 3.1 Different methods of critical and appreciative inquiry and their relevance to different situations. 3.2 Techniques to assist in forming the habit of asking questions and taking responsibility for answers. 3.3 Why questions are important and the benefits of asking good questions for individuals, businesses and communities (the importance of critical thinking). 3.4 Growth mindset and positive communication and relationship strategies and techniques. 3.5 Creative negotiation skills. 3.6 Change management and continuous improvement concepts. 3.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information). 3.2 Communicating to actively listen and to ask questions of others in a constructive way. 3.3 Using critical thinking pathway to formulate and ask relevant questions and come up with appropriate answers. 3.4 Performing assimilation and accommodation skills to interpret and distil key information of relevance to a given situation. 3.5 Assessing and measuring the extent of effectiveness and efficiency of the systems, processes and procedures in the workplace. 3.6 Communicating practical insights on improving workplace conditions."
    },
    {
      "source_text": "-- PDF PAGE 21 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 17"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Effectiveness and efficiency May include; 1.1 Developing a more efficient way of doing something 1.2 Developing a new idea 1.3 Developing and improving products and services 1.4 Enhancing skills and career opportunities 1.5 Enhancing the physical environment 1.6 Financial benefit 1.7 Greater personal satisfaction 1.8 Improving interpersonal relationships 1.9 Evaluating overall workplace conditions 2. Curiosity and critical inquiry May include: 2.1 Accuracy 2.2 Breadth 2.3 Clarity 2.4 Depth 2.5 Emotion 2.6 Fairness 2.7 Logic 2.8 Meaning 2.9 Planning 2.10 Attention 2.11 Precision 2.12 Relevance 2.13 Significance 2.14 Social engagement 2.15 Society 2.16 Style 2.17 Growth mindset 2.18 Positive communication 2.19 Positive negotiation 2.20 Workplace conditions 2.21 Appreciative inquiry methods"
    },
    {
      "source_text": "-- PDF PAGE 22 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 18"
    },
    {
      "source_text": "VARIABLE RANGE 3. Practical action plans May include: 3.1 Insights on continuous improvement 3.2 Creative strategies and techniques for becoming better at work and real life 3.3 Career plans 3.4 Challenging workplace policies, procedures and protocols 3.5 Specifying plans for change and adapting to the demands of the contemporary workforce 3.6 Challenges in negotiating with stakeholders and teams 3.7 Change management, innovation and knowledge creation 3.8 Contractual agreements 3.9 Extreme time pressure or non-negotiable deadlines 3.10 Financial limitations 3.11 Procedures determined by laws or other regulations 3.12 Safety issues 3.13 When others are totally closed to new ideas 3.14 acknowledging shared responsibility 3.15 adopting a positive 'can do' attitude 3.16 following up on practical details 3.17 pro-actively seeking information 3.18 suggesting a new approach 3.19 talking to others about possible answers 3.20 constraints of the broader context and environment 3.21 overall goal - what needs to be achieved 3.22 personal hopes and expectations"
    },
    {
      "source_text": "-- PDF PAGE 23 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 19"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Evaluated the effectiveness and efficiency of workplace systems, processes and procedures. 1.2 Modelled the conscious process of critical inquiry to get new insights that s/he can get in formulating action plans on continuous improvement in the workplace and real-life 1.3 Practiced the habit of critical inquiry and curiosity in the workplace 1.4 Shown a thorough knowledge and understanding of how critical thinking impacts on individual lives, the broader community and work situations. 1.5 Developed practical action plans for improving workplace conditions. 2. Resource Implications 2.1. Interactions with specific challenges and situations to demonstrate the application of critical thinking (this would usually involve interactions with others). 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Direct questioning combined with review of portfolios of evidence and third-party workplace reports of on-the-job performance by the candidate 3.2 Evaluation of a candidate blog exploring different ideas and questions 3.3 Review of candidate response to scenarios that allow the candidate to apply critical thinking techniques to a life or work situation, and to demonstrate ability to portray curiosity and exploration of new concepts 3.4 Evaluation of candidate response to the challenge of adopting different perspectives on a situation, and ability to both develop and respond to questions from those perspectives 3.5 Observation of the candidate participating in a group problem-solving session 3.6 Oral or written questioning to assess knowledge of typical blockers to the critical thinking process. 3.7 Life Narrative Inquiry to reflect life stories that reflect how critical thinking and problem solving is applied in the lives. 4. Context for Assessment 4.1. In all workplace, it may be appropriate to assess this unit concurrently with relevant teamwork or operation units."
    },
    {
      "source_text": "-- PDF PAGE 24 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 20"
    },
    {
      "source_text": "UNIT OF COMPETENCY : CONTRIBUTE TO THE PRACTICE OF SOCIAL JUSTICE IN THE WORKPLACE"
    },
    {
      "source_text": "UNIT CODE : 500311404"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers ways and means to assume active roles in resolving local and global challenges and to become proactive contributors to a more peaceful and sustainable world."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Update self on local, national and global trends/ issues in the workplace 1.1 Media are regularly scanned/ monitored for trends and issues relevant to human rights, gender equality, promotion of culture of peace and non- violence, global citizenship and appreciation of cultural diversity. 1.2 Knowledge and understanding of local, national and global issues and their interconnectedness and interdependency are acquired. 1.3 Notable issues and trends are critically examined and discussed with peers, colleagues, or family members. 1.1 Local, national and global systems and structures 1.2 Issues affecting interaction and connectedness of communities at local, national and global levels 1.3 Underlying assumptions and power dynamics (politics, understanding political system, social structures, labor laws, labor relations, human right)"
    },
    {
      "source_text": "1.1 Monitoring trends and issues relevant to human rights, gender equality, culture of peace, global citizenship, and cultural diversity using different media platforms 1.2 Analyzing trends and issues relevant to human rights, gender equality, culture of peace, global citizenship, and cultural diversity 1.3 Engaging in discourse about the local, national and global issues"
    },
    {
      "source_text": "-- PDF PAGE 25 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 21"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Relate local and global trends to workplace context 2.1 Local events are reflected on for implications in one’s own situation and in the external global environment. 2.2 Sense of belonging to a common humanity, sharing values and responsibilities are developed. 2.3 Attitudes of empathy, solidarity and respect for differences and diversity are strengthened. 2.1 Different levels of human identity according to Amber Mayer (2015) 2.2 Different communities people belong to and how these are connected 2.3 Difference and respect for cultural diversity 2.1 Recognizing differences and commonalities among people 2.2 Strengthening attitudes of empathy, solidarity and respect for diversity 2.3 Connecting local issues to global trends, and vice versa. 3. Engage and take actions on workplace issues and concerns 3.1 Effective and responsible actions at local, national and global levels are identified. 3.2 Motivation and willingness to take necessary actions are developed. 3.3 Attitude of “thinking globally and acting locally” is practiced. 3.1 Actions that can be taken individually and collectively 3.2 Ethically responsible behaviour 3.3 Importance and benefits of civic engagement 3.4 Strategies and techniques of “thinking globally and acting locally 3.1 Employing appropriate actions to address workplace issues involving national and global trends 3.2 Showing concern and willingness to take part in the development efforts to discuss workplace issues and concerns 3.3 Applying the attitude of “thinking globally and acting locally” in the workplace"
    },
    {
      "source_text": "-- PDF PAGE 26 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 22"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "VARIABLE RANGE 1. Media May include: 1.1 Print media 1.2 Broadcast media 1.3 Internet and social media 2. Scanning/Monitoring May include: 2.1 Sourcing from key informants 2.2 Conversation with clients 2.3 Man-on-the-street conversation 2.4 Scanning print and broadcast media 3. Local, national and global issues"
    },
    {
      "source_text": "May include: 3.1 Poverty 3.2 Unemployment 3.3 Global warming 3.4 Safety, security, and well-being 1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Demonstrated ability and attitude to keep oneself updated of relevant issues/trends 1.2 Demonstrated ability to think and act based on one’s principles and values 1.3 Demonstrated a holistic/global outlook on internal and external events in the workplace 2. Resource Implications The following resources should be provided: 2.1 Access to workplace and resources 2.2 Case studies 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Demonstration or simulation with oral questioning 3.2 Case problems involving global and local issues 3.3 Third-party report 4. Context for Assessment 4.1 Competency assessment may occur in workplace or any appropriately simulated environment"
    },
    {
      "source_text": "-- PDF PAGE 27 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 23"
    },
    {
      "source_text": "UNIT OF COMPETENCY : MANAGE INNOVATIVE WORK INSTRUCTIONS"
    },
    {
      "source_text": "UNIT CODE : 500311405"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required"
    },
    {
      "source_text": "to sustain and develop a workplace environment in which"
    },
    {
      "source_text": "improvement, innovation and learning are promoted and"
    },
    {
      "source_text": "reinforced."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Review and analyze existing workplace practices 1.1 Current instructions and strategies to perform tasks in the workplace are reviewed 1.2 Climate for innovation at the organizational level is defined 1.3 Innovation drivers in the workplace are identified 1.1. Four drivers of innovation according to Gallup Management Journal (2007) 1.2. Contextual variables related to innovative practices in the organization 1.3. The nine dimensions of innovation climate (Isaksen & Isaksen, 2018) 1.4. Types of Innovation identified by Gopalakrishnan and Damanpour (1997) 1.1 Investigating the organizational needs in the innovation process 1.2 Defining current organizational innovative practices 1.3 Linking innovation to contextual variables in the organization"
    },
    {
      "source_text": "-- PDF PAGE 28 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 24"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Examine opportunities for continuous improvement and innovation of practices in the workplace 2.1. Effectiveness of innovative practices in the workplace is determined 2.2. Innovative behaviors of leaders or managers in the organization are assessed 2.3. Driving principles of innovation are discussed 2.1 Determinants of innovative behavior by Scott and Bruce (1992) 2.2 Four principles of innovation according to Gallup Management Journal (2007)"
    },
    {
      "source_text": "2.1 Evaluating organizational innovative practices 2.2 Gauging innovative behaviors of the leaders and managers in the organization 2.3 Deliberating opportunities and challenges in implementing innovation 3. Implement innovative ways in the conduct of usual workplace practices 3.1. Innovative behaviors in the workplace are performed 3.2. Innovative climate in the workplace is maintained 3.3. Adoption or modification of new ideas relevant to the organizational needs is achieved 3.1 Determinants of innovative behavior by Scott and Bruce (1992) 3.2 The nine dimensions of innovation climate (Isaksen & Isaksen, 2018) 3.3 Techniques in implementing innovative change in the workplace"
    },
    {
      "source_text": "3.1 Developing risk management techniques and control systems 3.2 Evaluating impact of changes and developing action plans 3.3 Demonstrating strategies and techniques in managing changes in the workplace"
    },
    {
      "source_text": "-- PDF PAGE 29 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 25"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Innovation May include: 1.1 Products versus processes 1.2 Radical versus incremental 1.3. Technical versus administrative 2. Innovative behaviors May include: 2.1 Always generate creative ideas or new solutions 2.2 Exploring and secure funds or resources required for implementing new ideas 2.3 Establishing adequate plans and schedules for implementing new ideas 2.4 Contributing suggestions or approaches for others’ creative ideas"
    },
    {
      "source_text": "-- PDF PAGE 30 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 26"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Analyzed and evaluated systems and performance in key areas of the organization and identify opportunities for improvement, seeking advice from experts as appropriate 1.2 Promoted the value of creativity, innovation and sustainability and recognize successes 1.3 Supported the testing and trialing of new ideas and undertake risk management and cost-benefit analysis for options 1.4 Planned for and implemented improvements using organization’s processes for approvals, project management and change management 1.5 Facilitated effective contributions to and communications about continuous improvement and innovation 1.6 Captured insights, experiences and ideas for improvements and incorporate them into the organization’s knowledge management systems and future planning. 2. Resource Implications The following resources should be provided: 2.1 Impact evaluation materials (guide and form) 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Interview 3.2 Written Evaluation 3.3 Case analysis 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or simulation environment in TESDA accredited institutions"
    },
    {
      "source_text": "-- PDF PAGE 31 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 27"
    },
    {
      "source_text": "UNIT OF COMPETENCY : MANAGE AND EVALUATE USAGE OF INFORMATION"
    },
    {
      "source_text": "UNIT CODE : 500311406"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit of competency covers the knowledge, skills and"
    },
    {
      "source_text": "attitudes required to support"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Review information needs and sources 1.1. The information needs of individuals/teams are determined and the sources are identified. 1.2. Information held by the organisation is reviewed to determine suitability and accessibility. 1.3. Plans are prepared to obtain information that is not available or accessible within the organization. 1.1. Analysis and display techniques 1.2. Information evaluation issues 1.3. Information storage requirements and methods 1.4. Reporting procedures of the organisation 1.1. Analysing record information 1.2. Communicating effectively 1.3. Disseminating information 1.4. Presenting information"
    },
    {
      "source_text": "2. Collect and analyze information 2.1. Collection of information is interpreted timely and relevant to the needs of individuals/teams. 2.2. Information is collected in formal suitable for analysis, interpretation and dissemination. 2.3. Information is analyzed to identify relevant trends and developments in terms of the needs for which is acquired. 2.1. Information collection, collation 2.2. Analysis and display techniques 2.3. Information evaluation issues 2.4. Information storage requirements and methods 2.5. Reporting procedures of the organisation 2.1. Collecting and collating information 2.2. Analysing record information 2.3. Communicating effectively 2.4. Disseminating information 2.5. Presenting information"
    },
    {
      "source_text": "3. Use management information systems 3.1. Management information systems are used to store and retrieve data for decision making. 3.2. Technology available in the work area/ organisation is used to manage information. 3.3. Recommendations for improving the information system are submitted to designated persons/ groups."
    },
    {
      "source_text": "3.1. Analysis and display techniques 3.2. Information collection, collation 3.3. Information evaluation issues 3.4. Information storage requirements and methods 3.5. Reporting procedures of the organisation 3.1. Analysing record information 3.2. Collecting and collating information 3.3. Communicating effectively 3.4. Disseminating information 3.5. Presenting information 3.6. Using management information systems to store and retrieve data"
    },
    {
      "source_text": "-- PDF PAGE 32 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 28"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 4. Report and disseminate analyzed information"
    },
    {
      "source_text": "4.1. The results of information gathering, analysis and synthesis are reported within specified time frames and to the standard defined by the organisation. 4.2. The results of information gathering, analysis and synthesis are reported so they can be inputs to policy development and organisation decision making. 4.3. Information which is gathered is disseminated to appropriate personnel within the specified timeframe 4.1. Analysis and display techniques 4.2. Information collection, collation 4.3. Information evaluation issues 4.4. Information storage requirements and methods 4.5. Reporting procedures of the organisation"
    },
    {
      "source_text": "4.1. Analysing record information 4.2. Collecting and collating information 4.3. Communicating effectively 4.4. Disseminating information 4.5. Presenting information 4.6. Using management information systems to store and retrieve data"
    },
    {
      "source_text": "-- PDF PAGE 33 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 29"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Information May include: 1.1 Routine and complex reports and submissions 1.2 Briefing notes 1.3 Ministerial 1.4 Proposals 1.5 Project plans 1.6 Articles and promotional material"
    },
    {
      "source_text": "2. Collection techniques or methods 2.1 Collection techniques may include: 2.1.1 Research 2.1.2 Surveys 2.1.3 Literature search 2.1.4 Interviews 2.1.5 Data bases 2.1.6 Observation 2.2 Collection methods may include: 2.2.1 Indexing 2.2.2 linking 2.2.3 Sorting 2.2.4 Comparing 2.2.5 Categorizing 2.2.6 Integrating"
    },
    {
      "source_text": "3. Analysis May include: 3.1. application of statistical methods 3.2. mathematical calculations 3.3. critical analysis 3.4. problem solving 4. Management information systems May include: 4.1. Computers 4.2. Communication channels 4.3. Records management 4.4. Procedures 4.5. Manuals 4.6. Protocol 4.7. Legislation 4.8. Guidelines and awards 4.9. Organizational 4.10. Legal and policy materials"
    },
    {
      "source_text": "-- PDF PAGE 34 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 30"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1 Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Identified information needs and sources 1.2 Collected and analyzed information 1.3 Determined the correct / preventive action 1.4 Used management information systems 1.5 Record and support information"
    },
    {
      "source_text": "These aspects may be best assessed using a range of scenarios what ifs as a stimulus with a walk through forming part of the response. These assessment activities should include a range of problems, including new, unusual and improbable situations that may have happened. 2 Resource Implications Specific resources for assessment 2.1 Evidence of competent performance should be obtained by observing an individual in an information management role within the workplace or operational or simulated environment. 3 Methods of Assessment Competency in this unit may be assessed through: 3.1 Written Test 3.2 Interview"
    },
    {
      "source_text": "The unit will be assessed in a holistic manner as is practical and may be integrated with the assessment of other relevant units of competency. Assessment will occur over a range of situations, which will include disruptions to normal, smooth operation. Simulation may be required to allow for timely assessment of parts of this unit of competency. Simulation should be based on the actual workplace and will include walk through of the relevant competency components. 4 Context for Assessment 4.1 In all workplace, it may be appropriate to assess this unit concurrently with relevant teamwork or operation units."
    },
    {
      "source_text": "-- PDF PAGE 35 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 31"
    },
    {
      "source_text": "UNIT OF COMPETENCY : LEAD IN IMPROVEMENT OF OCCUPATIONAL SAFETY AND HEALTH (OSH) PROGRAMS, POLICIES AND PROCEDURES"
    },
    {
      "source_text": "UNIT CODE : 500311407"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to assess Occupational Safety and Health (OSH) practices and programs, recommend OSH program improvement initiatives, and implement recommended improvements on Occupational Safety and Health (OSH) Programs, Procedures and Policies"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Assess Occupational Safety and Health (OSH) practices and programs 1.1 OSH practices and programs are reviewed based on workplace policies and procedures 1.2 Appropriate personnel or OSH reference guides are consulted for proper guidance based on workplace policies and procedures 1.3 Current practices and programs are evaluated based on acceptable level of OSH work standards 1.1. OSH practices and programs workplace policies and procedures 1.2. OSH reference guides 1.3. OSH work standards 1.1. Critical thinking skills 1.2. Evaluating skills 2. Recommend OSH program improvement initiatives 2.1 OSH work improvement initiatives are identified that are relevant with the workplace scenario 2.2 OSH program improvement plans are organized based on workplace policies and procedures 2.3 OSH program improvement plans are presented based on workplace policies and procedures 2.1. OSH Programs 2.2. OSH work improvement initiatives 2.1. Presentation Skills 2.2. Communication skills 2.3. Collaborating skills 2.4. Critical thinking skills 2.5. Observation skills"
    },
    {
      "source_text": "-- PDF PAGE 36 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 32"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Implement recommended improvements on Occupational Safety and Health (OSH) Programs, Procedures and Policies 3.1 Approved improvements on OSH work improvement initiatives are communicated based on workplace policies and procedures 3.2 Concern personnel are guided in accordance with workplace policies and procedures 3.3 Implementation of the approved OSH initiatives are monitored in accordance with workplace policies and procedures 3.4 Implementation of approved OSH initiatives are evaluated based on workplace policies and procedures 3.1. Coaching Concepts 3.2. OSH work improvement initiatives 3.3. Supervisory Concepts 3.1. Monitoring Skills 3.2. Evaluation Skills 3.3. Auditing Skills 3.4. Coaching Skills 3.5. Supervisory Skills"
    },
    {
      "source_text": "-- PDF PAGE 37 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 33"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. OSH Practices and Programs May include: 1.1 Planning, implementation and maintenance of manufacturing plants 1.2 Work-physiological, psychological, ergonomic and hygienic practices and programs 1.3 First aid within the workplace 1.4 Safety inspection practices"
    },
    {
      "source_text": "2. OSH Reference Guides May include: 2.1 Occupational Safety and Health Standards Book 2.2 OSHA Safety Bulletins and Magazines 2.3 Equipment Safety Operating Instructions 2.4 Established National Safety Management Books 2.5 Credible OSH Web-sites 2.6 Safety Solution Guide Books and Handbooks 3. OSH Work Improvement Initiatives May include: 3.1 Eliminate the hazard altogether (i.e., get rid of the dangerous machine) 3.2 Isolate the hazard from anyone who could be harmed (i.e., keep the machine in a closed room and operate it remotely; barricade an unsafe area off) 3.3 Substitute the hazard with a safer alternative (i.e., replace the machine with a safer one) 3.4 Use administrative controls to reduce the risk (i.e., train workers how to use equipment safely; train workers about the risks of harassment; issue signage) 3.5 Use engineering controls to reduce the risk (i.e., attach guards to the machine to protect users) 3.6 Use personal protective equipment (i.e., wear gloves and goggles when using the machine)"
    },
    {
      "source_text": "-- PDF PAGE 38 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 34"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1. Consult appropriate personnel or OSH reference guides for proper guidance based on workplace policies and procedures 1.2. Evaluate current practices and programs based on acceptable level of OSH work standards 1.3. Identify OSH work improvement initiatives that are relevant with the workplace scenario 1.4. Present OSH program improvement plans based on workplace policies and procedures 1.5. Communicate approved improvements on OSH work program initiatives based on workplace policies and procedures 1.6. Monitor implementation of the approved OSH initiatives in accordance with workplace policies and procedures 1.7. Evaluate implementation of approved OSH initiatives based on workplace policies and procedures 2. Resource Implications The following resources should be provided: 2.1 Workplace or assessment location 2.2 OSH personal records 2.3 PPE 2.4 Health records"
    },
    {
      "source_text": "3. Methods of Assessment Competency may be assessed through: 3.1 Portfolio Assessment 3.2 Interview 3.3 Case Study/Situation 3.4 Observation/Demonstration and oral questioning 4. Context for Assessment 4.1 Competency may be assessed in the work place or in a simulated work place setting"
    },
    {
      "source_text": "-- PDF PAGE 39 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 35"
    },
    {
      "source_text": "UNIT OF COMPETENCY : LEAD TOWARDS IMPROVEMENT OF ENVIRONMENTAL WORK PROGRAMS, POLICIES AND PROCEDURES"
    },
    {
      "source_text": "UNIT CODE : 500311408"
    },
    {
      "source_text": "UNIT DESCRIPTOR"
    },
    {
      "source_text": ":"
    },
    {
      "source_text": "This unit covers the knowledge, skills and attitudes required in assessing environmental work practices and standards, recommending environmental work improvement initiatives and implementing recommended environmental improvements"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Assess environmental work practices and programs 1.1. Environmental practices and programs are reviewed based on workplace policies 1.2 Appropriate personnel or environmental reference guides are consulted for proper guidance based on workplace policies* 1.3 Current practices and programs are evaluated based on acceptable level of environmental work standards* 1.1 Environmental Practices 1.2 Environmental Reference Guides 1.3 Corrective Action and Follow-up 1.4 Relevant environmental experts 1.5 Re-Training Needs 1.6 Energy and Healthy Habits 1.1 Critical thinking 1.2 Problem solving 1.3 Observation Skills 1.4 Training Delivery Skills"
    },
    {
      "source_text": "-- PDF PAGE 40 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 36"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Recommend environmental program improvements initiatives 2.1 Environment practices opportunities are Identified that are relevant with the workplace scenario 2.2 Environmental program improvement plans are organized based on workplace policies and procedures* 2.3 Environmental program improvement plans are presented based on workplace policies and procedures* 2.1 Environmental Practices and Standards 2.2. Mitigation Requirements 2.1. Presentation Skills 2.2 Critical thinking 2.3. Problem Solving 2.4 Observation Skills 2.5 Training Delivery Skills 2.6 Cost-Benefit Analysis"
    },
    {
      "source_text": "3. Implement recommended improvements on environmental programs, policies and procedures 3.1. Approved improvements on environmental work program initiatives are promoted based on workplace policies and procedures 3.2 Implementation of the approved environmental initiatives are monitored in accordance with workplace policies and procedures 3.3. Implementation of approved environmental initiatives are evaluated based on workplace policies and procedures 3.1. Environmental Work Initiatives 3.2. Communication Strategies 3.3. Environmental inspection and Monitoring Techniques 3.4. Notification Requirements 3.1. Inspection Skills 3.2 Critical thinking 3.3 Problem Solving 3.4 Observation Skills"
    },
    {
      "source_text": "-- PDF PAGE 41 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 37"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE R A N G E 1. Environmental Practices and Programs May include: 1.1 Utilization of Energy, Water, Fuel 1.2 Segregation Practices 1.3 Waste Disposal and Reuse 1.4 Saving Resources 1.5 Waste Collection 1.6 Usage of Hazardous Materials 1.7 Chemical Application 1.8 Equipment Operation 1.9 Dewatering and Discharging 1.10 Surface Disturbance 1.11 Periodic Inspection 1.12 Resource Storage and Handling 2. Environmental Reference Guides May include: 2.1 Air Emission and Ambient Air Quality Guidelines 2.2 Energy Conservation Guidelines 2.3 Wastewater and Ambient Water Quality Guidelines 2.4 Water Conservation Guidelines 2.5 Hazardous Materials Management 2.6 Waste Management 2.7 Noise 2.8 Contaminated Land 2.9 Cultural Conservation Guides 3. Environmental Work Program Initiatives May include: 3.1 Low Energy Lighting 3.2 Water Reduction initiatives 3.3 Holding Employee Awareness event 3.4 Recycling Waste Materials 3.5 Unplugging power converters overnight 3.6 Tree-Planting 3.7 Wild-life conservation"
    },
    {
      "source_text": "-- PDF PAGE 42 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 38"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1. Consulted appropriate personnel or environmental reference guides for proper guidance based on workplace policies* 1.2. Evaluated current practices and standards based acceptable level of environmental work standards 1.3. Organized environmental standard improvement plans based on workplace policies and procedures 1.4. Presented environmental standard improvement plans based on workplace policies and procedures* 1.5. Promoted approved environmental work initiatives based on workplace policies and procedures 1.6. Evaluated the implementation of approved environmental improvements based on workplace policies and procedures 2. Resource Implications The following resources should be provided: 2.1 Workplace/Assessment location 2.2 Legislation, policies, procedures, protocols and local ordinances relating to environmental protection 2.3 Case studies/scenarios relating to environmental protection 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Written/ Oral Examination 3.2 Interview/Third Party Reports 3.3 Portfolio (citations/awards from GOs and NGOs, certificate of training – local and abroad) 3.4 Simulations and role-plays 4. Context for Assessment 4.1 Competency may be assessed in actual workplace or at the designated TESDA center."
    },
    {
      "source_text": "-- PDF PAGE 43 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 39"
    },
    {
      "source_text": "UNIT OF COMPETENCY : SUSTAIN ENTREPRENEURIAL SKILLS"
    },
    {
      "source_text": "UNIT CODE : 500311409"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the outcomes required to update and continue one’s professional development along entrepreneurship, including applying such growth in skills toward expanding the enterprise and developing its work force."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Enhance one’s business skills 1.1 Entrepreneurial skills development needs are identified and responded to promptly. 1.2 Market trends are monitored, anticipated and taken advantage of where feasible. 1.3 New technologies, products and processes are included/utilized where advantageous to the enterprise. 1.4 Constant dialog/linkages with other entrepreneurs/peers and stakeholders are maintained 1.5 Circulation and participation in business fora, meetings, conventions and exhibits are maintained. 1.1 Business models and strategies 1.2 Types and categories of businesses 1.3 Business internal controls 1.4 Market Trends 1.5 Relevant national and local legislation and regulations 1.6 Basic quality control and assurance concepts"
    },
    {
      "source_text": "1.1 Basic bookkeeping/ accounting skills 1.2 Communication skills 1.3 Building relations with customer and employees 1.4 Building competitive advantage of the enterprise 1.5 Networking and Linkaging skills"
    },
    {
      "source_text": "-- PDF PAGE 44 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 40"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Manage entrepreneurial practices 2.1 Ideas and comments for improvements are sought from workers and clients. 2.2 Staff/workers are encouraged and supported in their skills development and enhancement. 2.3 A culture of continuous improvement is fostered within the enterprise. 2.4 Innovations on the existing lines of products and services are encouraged"
    },
    {
      "source_text": "2.1 Public relations concepts 2.2 Basic product promotion strategies 2.3 Basic market and feasibility studies 2.4 Basic business ethics 2.1 Building customer relations 2.2 Individual marketing skills 2.3 Using basic advertising (posters/ tarpaulins, flyers, social media, etc.) 3. Expand markets and clientele 3.1 Enterprise is built up and sustained through judicious control of cash flows. 3.2 Profitability of enterprise is ensured though appropriate internal controls. 3.3 Unnecessary or lower- priority expenses and purchases are avoided. 3.4 New markets and clients are identified based on current market trends"
    },
    {
      "source_text": "3.1 Basic cost- benefit analysis 3.2 Basic financial management 3.3 Basic financial accounting 3.4 Business internal controls"
    },
    {
      "source_text": "3.1 Setting business priorities and strategies 3.2 Interpreting basic financial statements 3.3 Preparing business plans"
    },
    {
      "source_text": "-- PDF PAGE 45 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 41"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Entrepreneurial skills May include: 1.1. Financial management skills 1.2. People management skills 1.3. Operations management skills 1.4. Business acumen"
    },
    {
      "source_text": "2. Business operations May include: 2.1 Purchasing 2.2 Accounting/Administrative work 2.3 Production/Operations/Sales"
    },
    {
      "source_text": "3. Internal controls May include: 3.1 Accounting systems 3.2 Financial statements/reports 3.3 Cash management 3.4 Managing property, plant and equipment 4. Continuous improvement May include: 4.1 Quality management systems (PDCA, ISO 9001,TQM, Six-Sigma, etc.) 4.2 Client feedback systems 4.3 Quality assurance/Quality control systems"
    },
    {
      "source_text": "-- PDF PAGE 46 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 42"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrated enhancement of one’s entrepreneurial skills through performance of business, supervisor evaluation, worker and client testimony"
    },
    {
      "source_text": "2. Resource Implications The following resources should be provided: 2.1 Interview guide for entrepreneurs, enterprise workers and third parties 2.2 Materials and location relevant to the proposed activity and tasks 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Written report 3.2 Written examination 3.3 Demonstration/observation with oral questioning 3.4 Portfolio assessment with interview 3.5 Third-party report"
    },
    {
      "source_text": "4. Context of Assessment 4.1 Competency may be assessed in workplace or in a simulated workplace setting 4.2 Assessment shall be observed while tasks are being undertaken whether individually or in-group"
    },
