l and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for MOLD DESIGNING NC IV.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: MOLD DESIGNING NC IV\n\nNominal Training Duration\n47 Hours\nBasic Competencies\n\n120 Hours\nCommon Competencies\n\n232 Hours\nCore Competencies\nTotal -\n399 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skill and attitudes of MOLD DESIGNING\nNC IV in accordance with industry standards. This covers competencies that a person must\nachieve in performing tasks such as determining mold design parameters, perform CAD\noperation, simulation and verification of mold design, modifying and finalizing of mold design\nand creating fabrication drawing.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 103 ---\nMold Designing NC IV Revision 00 Promulgated 05/21/2019\n99\n\nBASIC COMPETENCIES\n(47 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet