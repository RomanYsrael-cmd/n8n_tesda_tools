    },
    {
      "source_text": "2. Select and measure materials 2.1 Materials are selected according to the requirement of the operation 2.2 Materials are measured to required level of accuracy using measuring tool 2.3 Measuring tools are used according to manufacturer’s specification 2.1 Shop safety practices 2.1.1 Safe working habits 2.1.2 Safe handling of tools, equipment and materials 2.2 Blueprint reading 2.2.1 Standard drawing scales, symbols and abbreviations 2.2.2 Assembly and details of drawing 2.1 Selecting materials 2.1 Measuring materials 2.2 Using measuring tools"
