    {
      "source_text": ": MEE722204"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the competencies required to perform basic calculations using the four fundamental operation."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Perform four fundamental operations. 1.1 Simple calculations performed using four fundamental operations. 1.2 Simple calculations performed involving fractions and mixed numbers using four fundamental operations 1.1 English and metric system of measurement"
    },
    {
      "source_text": "1.2 Performing calculation using four fundamental operation"
    },
    {
      "source_text": "2. Perform basic calculations involving fractions and decimals 2.1 Simple calculations are performed involving fractions and decimals using the four fundamental operations. 2.2 Decimal are converted into fraction (and vice versa) accurately 2.1 English and metric system of measurement"
    },
    {
      "source_text": "2.1 Identifying die material requirements 2.2 Determining production volume 2.3 Identifying design parameters 3. Perform basic calculations involving percentages. 3.1 Simple calculations are performed to obtain percentages from information expressed in either fractional or decimal format 3.1 English and metric system of measurement"
    },
    {
      "source_text": "3.1 Performing calculation"
    },
    {
      "source_text": "4. Perform basic calculation involving ration and proportion 4.1 Simple calculations are performed involving ratios and proportion using whole numbers, fractions and decimal fractions. 4.1 English and metric system of measurement"
    },
    {
      "source_text": "4.1 Performing calculation 5. Perform calculations on algebraic expressions 5.1 Simple calculations are performed on algebraic expressions using the four fundamental operations. 5.2 Simple transposition of formulae is carried out to isolate the variable required, involving the four fundamental operations. 5.1 English and metric system of measurement"
    },
    {
      "source_text": "5.1 Performing calculation"
    },
    {
      "source_text": "-- PDF PAGE 59 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 55"
    },
    {
      "source_text": "RANGE OF VARIABLES"
