      "source_text": ": MEE722205"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the competencies required to measure workpieces using measuring instruments such as steel rules, Vernier calipers, micrometers, etc.…."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Select and use measuring tools 1.1 Measuring tools are selected and used according to the level of accuracy required. 1.2 Measurements taken are accurate to the finest graduation of the selected measuring instrument. 1.3 Measuring technique used is correct and appropriate to the device used. 1.1 Types, purposes and accuracy of measuring instruments 1.2 Capability of measuring instruments 1.3 Part dimensions and tolerances 1.4 Techniques for measuring dimensions 1.5 Care and storage procedure of measuring tools"
    },
    {
      "source_text": "1.1 Selecting measuring tools 1.2 Obtaining accurate measurements 1.3 Determining measuring technique"
    },
    {
      "source_text": "2. Clean and store measuring tools 2.1 Cleaning of devices undertaken according to standard operating procedures. 2.2 Care of devices undertaken according to manufacturer’s specifications. 2.3 Storage of devices undertaken according to standard operating procedures. 2.1 Types, purposes and accuracy of measuring instruments 2.2 Capability of measuring instruments 2.3 Part dimensions and tolerances 2.4 Techniques for measuring dimensions 2.5 Care and storage procedure of measuring tools"
    },
