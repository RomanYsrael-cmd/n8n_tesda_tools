    },
    {
      "source_text": "COMMON COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : APPLY SAFETY PRACTICES"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": MEE722201"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the competencies required to apply safety practices in the workplace."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Identify hazards"
    },
    {
      "source_text": "1.1 Hazards are identified correctly in accordance with OHS principles 1.2 Safety signs and symbols are identified and adhered to 1.1 Shop safety signs, symbols and alarms 1.2 Safety precautionary measures 1.1 Identifying hazard 1.2 Identifying safety sign and symbol"
    },
    {
      "source_text": "2. Use protective clothing and devices 2.1 Appropriate protective clothing and devices correctly selected and used in accordance with OHS requirements or industry/company policy"
    },
    {
      "source_text": "2.1 Shop safety signs, symbols and alarms 2.2 Safety precautionary measures 2.3 Housekeeping 2.4 Machine tools 2.5 First aid 2.1 Selecting appropriate protective clothing and devices"
    },
    {
      "source_text": "3. Perform safe handling of tools, equipment and materials 3.1 Safety procedures for pre-use check and operation of tools and equipment followed in accordance with industry/ company policies 3.2 Tools, equipment and materials handled safely in accordance with OHS requirements and industry/ company policies 3.1 Shop safety signs, symbols and alarms 3.2 Safety precautionary measures 3.3 Housekeeping 3.4 Machine tools 3.5 Engineering materials"
    },
    {
      "source_text": "3.1 Checking tools and equipment 3.2 Operating tools and equipment 3.3 Handling tools and equipment"
    },
    {
      "source_text": "-- PDF PAGE 48 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 44"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 4. Perform first aid 4.1 Surroundings are checked for any possible risk or harm 4.2 Call for help someone if seriously injured. 4.3 First aid treatment of injuries are carried out according to recommended procedures 4.1 Shop safety signs, symbols and alarms 4.2 Safety precautionary measures 4.3 Housekeeping 4.4 Machine tools 4.5 First aid 4.6 Engineering materials 4.1 Determining first aid treatment according to recommended procedures 4.2 Performing first aid according to recommended procedures 5. Use fire extinguisher 5.1 Check for your own safety before starting to extinguish a fire. 5.2 Fire extinguisher is selected correctly according to the type of fire. 5.3 Fire extinguisher are operated correctly according recommended procedures 5.1 Shop safety signs, symbols and alarms 5.2 Safety precautionary measures 5.3 Housekeeping 5.4 Machine tools 5.5 First aid 5.6 Engineering materials 5.7 Fire extinguishers 5.1 Selecting fire extinguisher according to the type of fire 5.2 Operating fire extinguisher according to the type of fire"
    },
    {
      "source_text": "-- PDF PAGE 49 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 45"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Hazards May include: 1.1 Cluttered tools and materials 1.2 Slippery floors (caused by oil, grease or any liquid) 1.3 Exposed electrical wires 1.4 Sharp edges 1.5 Machine without guards or with exposed moving parts 1.6 Uncollected chips or other wastes etc. 2. Protective clothing and devices May include: 2.1 Safety glasses/goggles 2.2 Safety shoes 2.3 Overalls 2.4 Cap 3. Injuries May include: 3.1 Burns/scalds 3.2 Fractures 3.3 Cuts and abrasions 3.4 Poisoning 3.5 Foreign bodies in the eye 3.6 Concussion 3.7 Shock 4. Type of fires May include: 4.1 common combustibles (wood, cloth, paper, rubber and plastic) 4.2 Flammable liquids (gasoline, oil, solvents, paints, etc.) 4.3 Energized electrical equipment (wiring, fuse boxes, circuit breakers, appliances, etc. 4.4 Combustible metals (magnesium, sodium, etc.)"
    },
    {
      "source_text": "-- PDF PAGE 50 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 46"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of competency Assessment requires evidence that the candidate: Assessment requires evidence that the candidate: 1.1 identified hazardous area 1.2 used protective clothing and devices 1.3 handled tools, equipment and materials properly 1.4 performed first aid 1.5 used fire extinguisher"
    },
    {
      "source_text": "2. Resource implications"
    },
    {
      "source_text": "The following resources should be provided: 2.1 Tools, equipment and facilities appropriate to processes or activity 2.2 Materials relevant to the proposed activity"
    },
    {
      "source_text": "3. Method of assessment Competency in this unit may be assessed through: 3.1 Demonstration 3.2 Written or oral short answer questions 3.3 Practical exercises"
    },
    {
      "source_text": "4. Context for assessment"
    },
    {
      "source_text": "4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center"
    },
    {
      "source_text": "-- PDF PAGE 51 --- Mold Designing NC IV Revision 00 Promulgated 05/21/2019 47"
    },
    {
