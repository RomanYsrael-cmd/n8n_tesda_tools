    {
      "source_text": "VARIABLE RANGE 1. Four fundamental operations May include: 1.1 Addition 1.2 Subtraction 1.3 Multiplication 1.4 Division"
    },
    {
      "source_text": "2. Algebraic expressions Calculation using formula for determining: 2.1 tap drill size 2.2 feed 2.3 speed"
    },
    {
      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Using four fundamental operations 1.2 Involving fractions and mixed numbers 1.3 Involving fractions and decimals 1.4 Involving percentages 1.5 Involving ratio and proportion 1.6 On algebraic expressions 1.7 of simple formulae"
    },
    {
      "source_text": "2. Resource implications The following resources should be provided: 2.1 Tools, equipment and facilities appropriate to processes or activity 2.2 Materials relevant to the proposed activity"
