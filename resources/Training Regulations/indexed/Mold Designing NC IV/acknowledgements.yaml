    },
    {
      "source_text": "3.1 3D CAD drawings are created and guidance is sought as required. 3.2 Drawings are prepared in accordance with existing standard. 3.3 3D CAD drawings are reviewed by concerned person 3.1 CAD Manuals 3.2 3D tutorial 3.3 Work instructions 3.4 Verbal communication 3.5 Drafting 3.6 Fundamental operation 3.7 Geometry 3.8 Trigonometry 3.9 Conversion of units 3.1 Creating 3D CAD drawings 3.2 Preparing drawings 3.3 Applying safety procedures"
