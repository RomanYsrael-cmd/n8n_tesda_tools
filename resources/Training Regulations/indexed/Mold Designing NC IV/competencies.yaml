        "source_text": "--- PDF PAGE 75 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n71 \n \nUNIT OF COMPETENCY \n: \nOPERATE A PERSONAL COMPUTER \n \nUNIT CODE \n \n: \nICT311201 \n \nUNIT DESCRIPTOR   \n: \nThis unit defines the competency required to operate a \npersonal computer by: starting the PC, logging in, using and \nworking with files, folders and programs, saving work, and \nclosing down the PC. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Start the \ncomputer \n \n1.1 The peripheral \ndevices are \nproperly connected  \n1.2 Power is checked \nand the computer \nand peripheral \ndevices are \nswitched on \n1.3 Proper logging in \nand logging off is \nsuccessfully done \n1.4 The operating \nsystem features \nand functions are \naccessed and \n1.5 Navigated \nHardware \nconfiguration and \nother system \nfeatures are \nchecked \n1.1 Computer functions \n1.2 Basic parts of a \ncomputer and various \nhardware components \n1.3 Keyboard layout and \nfunctions \n \n \n1.1 Connecting \nperipheral devices \n1.2 Logging in and \nlogging off properly \n \n2. Arrange and \ncustomize \ndesktop \ndisplay/ \nWindows \nsettings \n2.1 The desktop screen \nor Windows \nelements are \nchanged as needed \n2.2 Desktop icons are \nadded, renamed, \nmoved, copied or \ndeleted \n2.3 The online help \nfunctions are \naccessed or used as \nneeded \n2.4 Desktop icons of \napplication \nprograms are \nselected, opened \nand closed \n2.5 Properties of icons \nare displayed \n2.6 Computer or \ndesktop settings are \nsaved and restored \n2.1 Keyboard layout and \nfunctions \n2.2 Computer functions \n2.3 Basic parts of a \ncomputer and various \nhardware components \n2.4 Storage devices and \nfile concepts \n2.5 Basic software \noperation and \nfunctionalities \n2.1 Changing desktop \nscreen or windows \nelement \n2.2 Adding, renaming, \nmoving, copying \nand deleting desk \ntop icon \n2.3 Accessing online \nhelp function \n2.4 Opening and \nclosing desk top \nicons \n2.5 Displaying \nproperties of icons\n\n--- PDF PAGE 76 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n72 \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Work with \nfiles and \nfolders (or \ndirectories \n3.1 A file or folder is created, \nopened, moved, renamed \nor copied \n3.2 Files are located, deleted \nand restored \n3.3 Details and properties of \nfiles and folders are \ndisplayed or viewed \n3.4 Various files are organized \nfor easy lookup and use \n3.5 Files and information are \nsearched \n3.6 Disks are checked, erased \nor formatted as necessary \n3.1 Keyboard \nlayout and \nfunctions \n3.2 Computer \nfunctions \n3.3 Basic parts of a \ncomputer and \nvarious \nhardware \ncomponents \n3.4 Storage devices \nand file \nconcepts \n3.5 Basic software \noperation and \nfunctionalities \n3.1 Creating, opening, \nmoving, renaming \nand copying a file \nand folder \n3.2 Locating, deleting \nand restoring files \n3.3 Displaying details \nand properties of \nfiles and folders \n3.4 Organizing files \n3.5 Searching file and \ninformation \n4. Work with \nuser \napplication \nprograms \n4.1 Application programs are \nadded, changed, removed \nor ran \n4.2 User software or \napplication program are \ninstalled, updated and \nupgraded \n4.3 Information/data are \nmoved between \ndocuments or files \n4.1 Keyboard \nlayout and \nfunctions \n4.2 Computer \nfunctions \n4.3 Basic parts of a \ncomputer and \nvarious \nhardware \ncomponents \n4.4 Storage devices \nand file \nconcepts \n4.5 Basic software \noperation and \nfunctionalities \n4.1 Checking \nhardware \nconfiguration and \nother system \nfeatured \n4.2 Installing, updating \nand upgrading \nuser software or \napplication \nprogram \n \n5. Print \ninformation \n5.1 Printer is added or \ninstalled and correct printer \nsettings is ensured \n5.2 Default printer is assigned \naccordingly \n5.3 Information or document is \nprinted on the installed \nprinter \n5.4 Progress of print jobs are \nviewed and deleted as \nrequired \n5.1 Keyboard \nlayout and \nfunctions \n5.2 Computer \nfunctions \n5.3 Basic parts of a \ncomputer and \nvarious \nhardware \ncomponents \n5.4 Storage devices \nand file \nconcepts \n5.5 Basic software \noperation and \nfunctionalities \n5.1 Installing printer \nsettings \n5.2 Printing \ninformation or \ndocument\n\n--- PDF PAGE 77 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n73 \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6. Shut down \ncomputer \n6.1 All open application \nprograms are closed \n6.2 Computer and peripheral \ndevices are properly shut \ndown \n6.1 Keyboard layout \nand functions \n6.2 Computer \nfunctions \n6.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n6.4 Storage devices \nand file concepts \n6.5 Basic software \noperation and \nfunctionalities \n \n6.1 Shutting down \ncomputer and  \nperipheral \ndevices\n\n--- PDF PAGE 78 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n74 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Peripheral device \nMay include:  \n1.1 \nMouse \n1.2 \nKeyboard \n1.3 \nMonitor or visual display unit \n1.4 \nPrinter \n1.5 \nScanner \n2. Computer \nMay include: \n2.1 \nLaptops/notebooks \n2.2 \nWorkstations \n2.3 \nServers \n2.4 \nother personal computer devices \n3. Application programs \nMay include: \n3.1 \nUser programs \n3.2 \nDatabase programs \n3.3 \nWord processors \n3.4 \nEmail programs \n3.5 \nInternet browsers \n3.6 \nSystem browsers  \n3.7 \nSpreadsheets \n4. Operating system \nMay include: \n4.1 \nWindows \n4.2 \nNT \n4.3 \nMac OS \n4.4 \nLinux \n4.5 \nSolaris \n4.6 \nUnix  \n5. System features \nMay include:  \n5.1 \nMemory size \n5.2 \nDisk capacities \n5.3 \nVideo cards \n5.4 \nUsbs \n5.5 \nModems \n5.6 \n1394 and lan connectors \n5.7 \nSd and pc cards \n5.8 \nWireless and infrared connections. \n6. Online help functions \nMay include: \n6.1 \nAn instruction manual, or a portion of the manual, \nintegrated and accessible from within the program or \nsoftware being used\n\n--- PDF PAGE 79 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n75 \n \nVARIABLE \nRANGE \n7. Properties \nMay include :  \n7.1 \nFile name \n7.2 \nType of file \n7.3 \nFile size \n7.4 \nDate created and modified \n7.5 \nAttributes (hidden, read-only). \n8. Various files \nMay include: \n8.1 \nDocuments \n8.2 \nRecords \n8.3 \nPictures \n8.4 \nMusic \n8.5 \nVideo \n9. Disks \nMay include:  \n9.1 \nFloppy disks \n9.2 \nCDs \n9.3 \nCD-RW (Compact discs-Read/Write) \n9.4 \nDVD RW \n9.5 \nzip disks \n9.6 \nflash drives \n9.7 \nmemory sticks \n9.8 \nhard drives \n10. Printer settings \nMay include:  \n10.1 Page layout \n10.2 Paper size \n10.3 ink/cartridge type \n10.4 Number of copies \n10.5 Page orientation.\n\n--- PDF PAGE 80 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n76 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate:   \n1.1 Ability to utilize software, navigate the desktop, using \nsystem features to perform tasks and save results of \nwork. \n2. Resource Implications \nThe following resources should be provided: \n2.1 A personal computer \n2.2 A printer \n2.3 Mouse and keyboard \n2.4 Basic systems software \n3. Methods of Assessment \nCompetency in this unit