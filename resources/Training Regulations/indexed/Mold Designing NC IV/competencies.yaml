ion and \nfunctionalities \n5.1 Installing printer \nsettings \n5.2 Printing \ninformation or \ndocument\n\n--- PDF PAGE 77 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n73 \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6. Shut down \ncomputer \n6.1 All open application \nprograms are closed \n6.2 Computer and peripheral \ndevices are properly shut \ndown \n6.1 Keyboard layout \nand functions \n6.2 Computer \nfunctions \n6.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n6.4 Storage devices \nand file concepts \n6.5 Basic software \noperation and \nfunctionalities \n \n6.1 Shutting down \ncomputer and  \nperipheral \ndevices\n\n--- PDF PAGE 78 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n74 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Peripheral device \nMay include:  \n1.1 \nMouse \n1.2 \nKeyboard \n1.3 \nMonitor or visual display unit \n1.4 \nPrinter \n1.5 \nScanner \n2. Computer \nMay include: \n2.1 \nLaptops/notebooks \n2.2 \nWorkstations \n2.3 \nServers \n2.4 \nother personal computer devices \n3. Application programs \nMay include: \n3.1 \nUser programs \n3.2 \nDatabase programs \n3.3 \nWord processors \n3.4 \nEmail programs \n3.5 \nInternet browsers \n3.6 \nSystem browsers  \n3.7 \nSpreadsheets \n4. Operating system \nMay include: \n4.1 \nWindows \n4.2 \nNT \n4.3 \nMac OS \n4.4 \nLinux \n4.5 \nSolaris \n4.6 \nUnix  \n5. System features \nMay include:  \n5.1 \nMemory size \n5.2 \nDisk capacities \n5.3 \nVideo cards \n5.4 \nUsbs \n5.5 \nModems \n5.6 \n1394 and lan connectors \n5.7 \nSd and pc cards \n5.8 \nWireless and infrared connections. \n6. Online help functions \nMay include: \n6.1 \nAn instruction manual, or a portion of the manual, \nintegrated and accessible from within the p