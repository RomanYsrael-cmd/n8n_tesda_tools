          "source_text": "REQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Evaluate \neffectiveness \nand efficiency \nof the \nworkplace \nsystems, \nprocesses and \nprocedures. \n1.1 Effectiveness and \nefficiency of \nworkplace standards \nand procedures are \nexamined. \n1.2. Usage of inquiry and \ndialogue to \ncommunicate \nevaluation measures \nand results are \nimplemented. \n1.3   Evaluation reports are \nprepared and \ncommunicated to team \nmembers. \n \n1.1 Systems, \nstandards, \nprocedures and \nprotocols in the \nworkplace. \n1.2 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations \n1.3 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n1.4 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n1.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n1.2 Communicating to \nactively listen and to \nask questions of \nothers in a \nconstructive way. \n1.3 Using critical thinking \npathway to formulate \nand ask relevant \nquestions and come \nup with appropriate \nanswers. \n1.4 Performing \nassimilation and \naccommodation skills \nto interpret and distil \nkey information of \nrelevance to a given \nsituation. \n1.5 Assessing and \nmeasuring the extent \nof effectiveness and \nefficiency of the \nsystems, processes \nand procedures in the \nworkplace.\n\n--- PDF PAGE 19 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n15 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Foster the \nhabit of critical \ninquiry and \ncuriosity in the \nworkplace. \n2.