        "source_title": "SIMULATE AND VERIFY MOLD DESIGN",
        "source_text": "--- PDF PAGE 89 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n85 \n \nUNIT OF COMPETENCY   :       SIMULATE AND VERIFY MOLD DESIGN \n \nUNIT CODE                        :       MEE722328 \n \nUNIT DESCRIPTOR           :       This unit covers the skills and knowledge required for \nsimulating and verifying mold design with the use of \nSimulation software. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine job \nrequirements \n \n1.1 Simulation \nrequirements are \nidentified as required. \n1.2 3D CAD drawings for \nsimulations are \nprepared. \n1.3 3D CAD drawings \nare converted to \nappropriate extension \nfile.  \n \n1.1 Work instructions \n1.2 Verbal \ncommunication \n1.3 Material \ncharacteristics \n1.4 CAD simulation \nsoftware \n1.5 OSH Rule No. 1060 \n– Premises of \nEstablishments \n1.6 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n1.1 Identifying \nsimulation \nrequirements \n1.2 Preparing 3D \nCAD drawing  \n1.3 Converting 3D \nCAD drawing  \n2. Prepare the \nCAD \nenvironment \n \n \n2.1 All relevant manuals, \ninstructions and \noperating procedures \nfor simulation are \nobtained in \naccordance with \nworkplace \nprocedures. \n2.2 The CAD package is \nbooted up in \naccordance with \nworkplace \nprocedures. \n2.3 Simulation toolbars \nand environment \nare set in accordance \nwith instructions. \n2.1 CAD simulation \nmanuals \n2.2 CAD Simulation \ntutorial \n2.3 Work instructions \n2.4 CAD simulation \nsoftware \n2.5 Workstation  \n2.6 OSH Rule No. 1060 \n– Premises of \nEstablishments \n2.7 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n \n2.1 Obtaining \nrelevant manuals, \ninstructions and \noperating \nprocedures for \nsimulation  \n2.2 Booting up the \nCAD package \n2.3 Setting the \nsimulation \ntoolbars and \nenvironment \n2.4 Applying safety \nprocedures \n3. Simulate and \nverify 3D CAD \ndrawings \n3.1 3D CAD drawings \nare simulated and \nverified in \naccordance with the \nexisting standard and \nguidance is sought \nas required. \n3.2 Simulated results are \nverified if saved to \nthe designated folder. \n3.3 Simulation results are \nreviewed by \n3.1 CAD simulation \nmanuals \n3.2 CAD simulation \ntutorial \n3.3 Work instructions \n3.4 Verbal \ncommunication \n3.5 Meshing principles \n3.6 Simulation analysis  \n3.7 CAD simulation \nsoftware \n3.8 Workstation \n3.1 Simulating and \nverifying 3D CAD \ndrawings  \n3.2 Printing out \nsimulation results \n3.3 Applying safety \nprocedures\n\n--- PDF PAGE 90 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n86 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nconcerned person \nin accordance with \ncompany procedures. \n3.4 Simulation results are \nprinted out in \naccordance with \nstandard operating \nprocedures, if \nrequired. \n3.9 OSH Rule No. 1060 \n– Premises of \nEstablishments \n3.10 \nOSH Rule No. \n1070 – Occupational \nHealth & \nEnvironmental \nControl \n4. Save simulation \nresults \n4.1 Simulation results are \nsaved in the \ndesignated folder in \naccordance with \nstandard operating \nprocedures. \n4.2 Simulation results are \nverified if saved to \nthe designated folder. \n4.3 Programs are closed \nin accordance with \nstandard operating \nprocedures. \n4.4 Computer is shut-\ndown in accordance \nwith standard \noperating \nprocedures. \n4.1 CAD simulation \nmanuals \n4.2 Work instructions \n4.3 CAD simulation \nsoftware \n4.4 Workstation  \n4.5 OSH Rule No. 1060 \n– Premises of \nEstablishments \n4.6 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n \n4.1 Saving simulation \nresults  \n4.2 Verifying \nsimulation results  \n4.3 Closing and \nshutting down of \nprograms and \ncomputer \n4.4 Applying safety \nprocedures\n\n--- PDF PAGE 91 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n87 \n \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Simulation \nrequirements  \n \nMay include: \n1.1   Mold flow \n1.2   Cooling \n1.3   Gate  \n1.4   Runner \n \n2. Simulation toolbars \n \nMay include: \n2.1   Model preparing \n2.2   Analysis set-up \n2.3   Post processing \n2.4   System set-up \n \n3. Simulation Environme May include: \n3.1 Mesh \n3.2 Analysis \n3.3 Results \n \n4. 3D CAD Drawings \nMay include: \n4.1 Product drawing \n4.2 Parts drawing \n4.3 Assembly drawing \n \n5. Concerned person \n \nMay include: \n5.1 Design Supervisor \n5.2 Designer \n5.3 Production supervisor\n\n--- PDF PAGE 92 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n88 \n \n EVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Determined job requirements \n1.2 Prepared simulation CAD environment \n1.3 Simulated and verified 3D CAD drawings  \n1.4 Saved simulation results \n1.5 Observed safety practices in accordance with OHS \nstandards \n1.6 Communicated effectively with others to ensure effective \nwork operation \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Product drawing \n2.2 Reference books \n2.3 Work instruction \n2.4 Manuals \n2.5 3D CAD software \n2.6 Tutorials \n2.7 Workstation \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Direct observation/ demonstration with oral questioning \n4. Context for \nassessment \n \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
