        "source_text": "--- PDF PAGE 85 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n81 \n \nUNIT OF COMPETENCY \n: \nPERFORM CAD OPERATION \n \nUNIT CODE \n     :     MEE722327 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required to create \ndrawings with the use of Computer Aided Design (CAD) \nsoftware. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine job \nrequirements \n \n1.1 Instructions and \nrelevant materials \nare obtained as \nrequired. \n1.2 Product samples \nand drawings are \nverified for design \nconsistency. \n1.3 Missing dimensions \nare determined \nusing measuring \ninstruments. \n1.1 \nWork instructions \n1.2 \nSketches and \ndrawings \n1.3 \nProduct sample \n1.4 \nMetrology \n1.5 \nFundamental \noperation \n1.6 \nGeometry \n1.7 \nCAD Software \n \n \n1.1 Obtaining \ninstructions and \nrelevant materials \n1.2 Verifying product \ndrawing \ndimensions  \n1.3 Determining \nmissing \ndimensions  \n2. Prepare the \nCAD \nenvironment \n \n \n2.1 All relevant \nmanuals, \ninstructions and \noperating \nprocedures for the \nCAD software are \nobtained in \naccordance with \nworkplace \nprocedures. \n2.2 The CAD package is \nbooted up in \naccordance with \nworkplace \nprocedures. \n2.3 Screen display area \nis set to required \nCAD environment \nand design \ntoolbars are set in \naccordance with \ninstructions. \n2.1 CAD Manuals \n2.2 3D tutorial \n2.3 Work instructions \n2.4 CAD software \n2.5 Workstation \n2.6 OSH Rule No. \n1060 – Premises of \nEstablishments \n2.7 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n \n2.1 Obtaining all \nrelevant manuals, \ninstructions and \noperating \nprocedures for the \nCAD software  \n2.2 Booting up the \nCAD package \n2.3 Setting the screen \ndisplay area and \ndesign toolbars \n2.4 Applying safety \nprocedures \n3. Create 3D CAD \ndrawings \n \n3.1 3D CAD drawings \nare created and \nguidance is sought \nas required. \n3.2 Drawings are \nprepared in \naccordance with \nexisting standard. \n3.3 3D CAD drawings \nare reviewed by \nconcerned person \n3.1 CAD Manuals \n3.2 3D tutorial \n3.3 Work instructions \n3.4 Verbal \ncommunication \n3.5 Drafting \n3.6 Fundamental \noperation \n3.7 Geometry \n3.8 Trigonometry \n3.9 Conversion of units \n3.1 Creating 3D CAD \ndrawings  \n3.2 Preparing drawings \n3.3 Applying safety \nprocedures\n\n--- PDF PAGE 86 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n82 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nin accordance with \nworkplace \nprocedures. \n3.10 CAD software \n3.11 Workstation \n3.12 OSH Rule No. \n1060 – Premises of \nEstablishments \n3.13 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n4. Save 3D CAD \ndrawing \n4.1 Drawing files are \nsaved in the \ndesignated folder in \naccordance with \nstandard operating \nprocedures. \n4.2 3D CAD drawings \nare verified if saved \nto the designated \nfolder. \n4.3 Programs are \nclosed in \naccordance with \nstandard operating \nprocedures. \n4.4 Computer is shut-\ndown in accordance \nwith standard \noperating \nprocedures. \n \n \n4.1 CAD Manuals \n4.2 Work instructions \n4.3 CAD software \n4.4 Workstation \n4.5 OSH Rule No. \n1060 – Premises of \nEstablishments \n4.6 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n \n4.1 Saving drawing files  \n4.2 closing and shutting \ndown programs and \ncomputer \n4.3 Verifying 3D CAD \ndrawings. \n4.4 Applying safety \nprocedures\n\n--- PDF PAGE 87 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n83 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Instructions and \nrelevant materials \n \nMay include: \n1.1 Instructions \n1.2 Sample product \n1.3 Drawings \n1.4 Sketches \n1.5 Concept \n \n2. CAD environment  \n \nMay include: \n2.1 Modeling \n2.2 Drafting \n \n3. Design toolbars \nMay include: \n3.1 Standard \n3.2 Sketch \n3.3 Feature \n3.4 View \n3.5 Selection bar \n3.6 Utility \n3.7 Modelling Tool \n3.8 Edit \n3.9 Surface \n \n4. 3D CAD Drawings \nMay include: \n4.1 Product drawing \n4.2 Parts drawing \n4.3 Assembly drawing \n \n5. Concerned person \n \nMay include: \n5.1 Design Supervisor \n5.2 Designer \n5.3 Production supervisor\n\n--- PDF PAGE 88 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n84 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined job requirements \n1.2 \nPrepared CAD environment \n1.3 \nCreated 3D CAD drawings \n1.4 \nObserved safety practices in accordance with OHS  \n          standards \n1.5 \nCommunicated effectively with others to ensure \neffective work operation \n \n2. Resource implications \n \nThe following resources should be provided: \n2.1 \nProduct sample \n2.2 \nProduct drawing \n2.3 \nReference books \n2.4 \nWork instruction \n2.5 \nManuals \n2.6 \n3D CAD software \n2.7 \nTutorials \n2.8 \nWorkstation \n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1 \nWritten examination \n3.2 \nDirect observation/ demonstration with oral \nquestioning \n4. Context for \nassessment \n \n4.1 \nCompetency may be assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center\n",
