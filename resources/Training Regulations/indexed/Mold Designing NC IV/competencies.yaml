        "source_title": "MODIFY AND FINALIZE MOLD DESIGN",
        "source_text": "--- PDF PAGE 93 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n89 \n \nUNIT OF COMPETENCY : \nMODIFY AND FINALIZE MOLD DESIGN \n \nUNIT CODE                         :     MEE722329 \n \nUNIT DESCRIPTOR           : \nThis unit covers the skills and knowledge required for modifying \nand finalizing drawings with the use of Computer Aided Design \n(CAD) software. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare the \nCAD \nenvironment \n \n1.1 All relevant \nmanuals, \ninstructions and \noperating \nprocedures for the \nCAD software are \nobtained in \naccordance with \nworkplace \nprocedures. \n1.2 The CAD package \nis booted up in \naccordance with \nworkplace \nprocedures. \n1.3 Screen display area \nis set to required \nCAD environment \nand design \ntoolbars are set in \naccordance with \ninstructions. \n \n1.1 CAD Manuals \n1.2 3D tutorial \n1.3 Work instructions \n1.4 CAD software \n1.5 Workstation \n1.6 OSH Rule No. 1060 \n– Premises of \nEstablishments \n1.7 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n \n1.1 Obtaining all \nrelevant manuals, \ninstructions and \noperating \nprocedures for the \nCAD software \n1.2 Booting up the CAD \npackage \n1.3 Setting the screen \ndisplay area and \ndesign toolbars \n1.4 Applying safety \nprocedures \n2. Modify 3D CAD \ndrawings \n \n2.1 3D CAD drawings \nare modified based \non simulation \nresults. \n2.2 Modified CAD \ndrawings are \nprepared in \naccordance with the \nexisting standard. \n2.3 Modified CAD \ndrawings are \nreviewed by \nconcerned \npersons in \naccordance with \nworkplace \nprocedures. \n2.1 CAD Manuals \n2.2 3D tutorial \n2.3 Work instructions \n2.4 Verbal \ncommunication \n2.5 Drafting \n2.6 CAD software \n2.7 Workstation  \n2.8 OSH Rule No. 1060 \n– Premises of \nEstablishments \n2.9 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n2.1 Modifying 3D CAD \ndrawings  \n2.2 Preparing modified \nCAD drawings \n2.3 Applying safety \nprocedures \n \n3. Save modified \n3D CAD \ndrawings \n \n3.1 Modified 3D CAD \ndrawing files are \nsaved in the \ndesignated folder in \n3.1 CAD Manuals \n3.2 Work instructions \n3.3 CAD software \n3.4 Workstation \n3.1 Saving modified 3D \nCAD drawing files\n\n--- PDF PAGE 94 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n90 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccordance with \nstandard operating \nprocedures. \n3.2 Modified 3D CAD \ndrawings are \nverified if saved to \nthe designated \nfolder. \n3.3 Programs are \nclosed in \naccordance with \nstandard operating \nprocedures. \n3.4 Computer is shut-\ndown in accordance \nwith standard \noperating \nprocedures. \n \n3.5 OSH Rule No. 1060 \n– Premises of \nEstablishments \n3.6 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n \n3.2 Closing and shutting \ndown programs and \ncomputer \n3.3 Verifying 3D CAD \ndrawings  \n3.4 Applying safety \nprocedures\n\n--- PDF PAGE 95 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n91 \n \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. CAD environment  \n \nMay include: \n1.1 Modelling \n1.2 Drafting \n2. Design toolbars \n \nMay include: \n2.1 Standard \n2.2 Sketch \n2.3 Feature \n2.4 View \n2.5 Selection bar \n2.6 Utility \n2.7 Modelling tool \n2.8 Edit \n2.9 Surface \n3. 3D CAD drawings \nMay include: \n3.1 Product drawing \n3.2 Parts drawing \n3.3 Assembly drawing \n4. Concerned person \n \nMay include: \n4.1 Design Supervisor \n4.2 Designer \n4.3 Production supervisor\n\n--- PDF PAGE 96 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n92 \n \n  EVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared CAD environment \n1.2 Modified 3D CAD drawings \n1.3 Saved modified 3D CAD drawings \n1.4 Observed safety practices in accordance with OHS \n        standards \n1.5 Communicated effectively with others to ensure \neffective work operation \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Work instruction \n2.2 Manuals \n2.3 3D CAD software \n2.4 Tutorials \n2.5 Workstation \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Direct observation/ demonstration with oral questioning \n4. Context for \nassessment \n \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n",
