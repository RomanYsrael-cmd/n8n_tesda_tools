E \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Develop \npractical \naction plans \nfor improving \nworkplace \nconditions. \n3.1 Evaluation of efficiency \nand effectiveness of \nworkplace policies, \nprocedures and \nprotocols are \ndocumented, \ncommunicated to \nstakeholders. \n3.2 Practical action plans \nin improving workplace \nconditions are \nformulated, presented \nand negotiated with \nstakeholders. \n3.3 Proposed changes and \ndirections are inquired, \nprocessed and \nnegotiated between \nand among teams, and \nstakeholders as well of \nthe organization. \n3.4 Commitment to \ncontinuous \nimprovement and \nchange is highlighted. \n3.5 Passion and dedication \nfor changing and \nadapting to the \ndemands of the 21st \ncentury workplace are \nconsidered. \n3.1 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations. \n3.2 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n3.3 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n3.4 Growth mindset \nand positive \ncommunication \nand relationship \nstrategies and \ntechniques. \n3.5 Creative \nnegotiation skills. \n3.6 Change \nmanagement and \ncontinuous \nimprovement \nconcepts. \n3.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n3.2 Communicating to \nactively listen and to \nask questions of \nothers in a \nconstructive way. \n3.3 Using critical thinking \npathway to formulate \nand ask relevant \nquestions and come \nup with appropriate \nanswers. \n3.4 Performing \nassimilation and \naccommodation \nskills to interpret and \ndistil key information \nof relevance to a \ngiven situation. \n3.5 As