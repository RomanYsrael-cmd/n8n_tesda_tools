        "source_title": "LEAD IN IMPROVEMENT OF OCCUPATIONAL SAFETY AND HEALTH (OSH) PROGRAMS, POLICIES AND PROCEDURES",
        "source_text": "--- PDF PAGE 35 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n31 \n \nUNIT OF COMPETENCY :  LEAD IN IMPROVEMENT OF OCCUPATIONAL SAFETY AND \nHEALTH (OSH) PROGRAMS, POLICIES AND PROCEDURES \n \nUNIT CODE \n:    500311407 \n \nUNIT DESCRIPTOR \n:   This unit covers the knowledge, skills and attitudes required to \nassess Occupational Safety and Health (OSH) practices and \nprograms, recommend OSH program improvement initiatives, \nand implement recommended improvements on Occupational \nSafety and Health (OSH) Programs, Procedures and Policies \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. \nAssess \nOccupational \nSafety and \nHealth (OSH) \npractices and \nprograms  \n1.1 OSH practices and \nprograms are reviewed \nbased on workplace \npolicies and procedures \n1.2 Appropriate personnel \nor OSH reference \nguides are consulted \nfor proper guidance \nbased on workplace \npolicies and procedures  \n1.3 Current practices and \nprograms are evaluated \nbased on acceptable \nlevel of OSH work \nstandards  \n1.1. OSH practices \nand programs \nworkplace \npolicies and \nprocedures \n1.2. OSH reference \nguides \n1.3. OSH work \nstandards \n1.1. Critical thinking \nskills \n1.2. Evaluating skills \n2. Recommend \nOSH program  \nimprovement \ninitiatives \n2.1 OSH work improvement \ninitiatives are identified \nthat are relevant with \nthe workplace scenario  \n2.2 OSH program \nimprovement plans are \norganized based on \nworkplace policies and \nprocedures \n2.3 OSH program \nimprovement plans are \npresented based on \nworkplace policies and \nprocedures  \n2.1. OSH Programs \n2.2. OSH work \nimprovement \ninitiatives \n2.1. Presentation Skills \n2.2. Communication \nskills \n2.3. Collaborating skills \n2.4. Critical thinking \nskills \n2.5. Observation skills\n\n--- PDF PAGE 36 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n32 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Implement \nrecommended \nimprovements \non \nOccupational \nSafety and \nHealth (OSH) \nPrograms, \nProcedures \nand Policies \n3.1 Approved \nimprovements on OSH \nwork improvement \ninitiatives are \ncommunicated based \non workplace policies \nand procedures  \n3.2 Concern personnel \nare guided in \naccordance with \nworkplace policies and \nprocedures \n3.3 Implementation of the \napproved OSH \ninitiatives are \nmonitored in \naccordance with \nworkplace policies and \nprocedures   \n3.4 Implementation of \napproved OSH \ninitiatives are \nevaluated based on \nworkplace policies and \nprocedures  \n3.1. Coaching \nConcepts \n3.2. OSH work \nimprovement \ninitiatives \n3.3. Supervisory \nConcepts \n3.1. Monitoring Skills \n3.2. Evaluation Skills \n3.3. Auditing Skills \n3.4. Coaching Skills \n3.5. Supervisory Skills\n\n--- PDF PAGE 37 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n33 \n \n      RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OSH Practices and \nPrograms \nMay include: \n1.1 \nPlanning, implementation and maintenance of \nmanufacturing plants \n1.2 \nWork-physiological, psychological, ergonomic and \nhygienic practices and programs \n1.3 \nFirst aid within the workplace \n1.4 \nSafety inspection practices \n \n2. OSH Reference Guides \nMay include: \n2.1 \nOccupational Safety and Health Standards Book \n2.2 \nOSHA Safety Bulletins and Magazines \n2.3 \nEquipment Safety Operating Instructions \n2.4 \nEstablished National Safety Management Books \n2.5 \nCredible OSH Web-sites \n2.6 \nSafety Solution Guide Books and Handbooks \n3. OSH Work Improvement \nInitiatives \nMay include: \n3.1 \nEliminate the hazard altogether (i.e., get rid of the \ndangerous machine) \n3.2 \nIsolate the hazard from anyone who could be harmed \n(i.e., keep the machine in a closed room and operate it \nremotely; barricade an unsafe area off) \n3.3 \nSubstitute the hazard with a safer alternative (i.e.,  \nreplace the machine with a safer one) \n3.4 \nUse administrative controls to reduce the risk (i.e.,  \ntrain workers how to use  equipment safely; train \nworkers about the risks of harassment; issue signage) \n3.5 \nUse engineering controls to reduce the risk (i.e., \nattach guards to the machine to protect users) \n3.6 \nUse personal protective equipment (i.e.,  wear gloves \nand goggles when using the machine)\n\n--- PDF PAGE 38 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n34 \n \nEVIDENCE GUIDE \n \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1.  Consult appropriate personnel or OSH reference guides for \nproper guidance based on workplace policies and procedures \n1.2. Evaluate current practices and programs based on acceptable \nlevel of OSH work standards \n1.3. Identify OSH work improvement initiatives that are relevant with \nthe workplace scenario \n1.4. Present OSH program improvement plans based on workplace \npolicies and procedures \n1.5. Communicate approved improvements on OSH work program \ninitiatives based on workplace policies and procedures \n1.6. Monitor implementation of the approved OSH initiatives in \naccordance with workplace policies and procedures \n1.7. Evaluate implementation of approved OSH initiatives based on \nworkplace policies and procedures \n2.   Resource   \nImplications \nThe following resources should be provided: \n2.1   Workplace or assessment location \n2.2   OSH personal records \n2.3   PPE \n2.4   Health records \n \n3.   Methods of \nAssessment \nCompetency may be assessed through: \n3.1   Portfolio Assessment  \n3.2   Interview \n3.3   Case Study/Situation \n3.4   Observation/Demonstration and oral questioning \n4.   Context for \nAssessment \n4.1   Competency may be assessed in the work place or in a \nsimulated work place setting\n",
