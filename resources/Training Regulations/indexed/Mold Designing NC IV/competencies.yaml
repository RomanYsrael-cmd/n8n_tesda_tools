d \ncontinuous \nimprovement \nconcepts. \n3.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n3.2 Communicating to \nactively listen and to \nask questions of \nothers in a \nconstructive way. \n3.3 Using critical thinking \npathway to formulate \nand ask relevant \nquestions and come \nup with appropriate \nanswers. \n3.4 Performing \nassimilation and \naccommodation \nskills to interpret and \ndistil key information \nof relevance to a \ngiven situation. \n3.5 Assessing and \nmeasuring the extent \nof effectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace. \n3.6 Communicating \npractical insights on \nimproving workplace \nconditions.\n\n--- PDF PAGE 21 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n17 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Effectiveness and \nefficiency  \nMay include; \n1.1 Developing a more efficient way of doing something \n1.2 Developing a new idea \n1.3 Developing and improving products and services  \n1.4 Enhancing skills and career opportunities \n1.5 Enhancing the physical environment \n1.6 Financial benefit \n1.7 Greater personal satisfaction \n1.8 Improving interpersonal relationships \n1.9 Evaluating overall workplace conditions \n2. Curiosity and critical \ninquiry \nMay include: \n2.1 \nAccuracy \n2.2 \nBreadth \n2.3 \nClarity \n2.4 \nDepth \n2.5 \nEmotion \n2.6 \nFairness \n2.7 \nLogic \n2.8 \nMeaning \n2.9 \nPlanning \n2.10 Attention \n2.11 Precision \n2.12 Relevance  \n2.13 Significance \n2.14 Social engagement \n2.15 Society  \n2.16 Style \n2.17 Growth mindset \n2.18 Positive communication \n2.19 Positive negotiation \n2.20 Workplace conditions \n2.21 Appreciative inquiry methods\n\n--- PDF PAGE 22 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n18 \n \nVARIABLE \nRANGE \n3. Practical action plans \nMay include: \n3.1 Insights on continuous improvement \n3.2 Creative strategies and techniques for becoming better \nat work and real life \n3.3 Career plans \n3.4 Challenging workplace policies, procedures and \nprotocols \n3.5 Specifying plans for change and adapting to the \ndemands of the contemporary workforce \n3.6 Challenges in negotiating with stakeholders and teams \n3.7 Change management, innovation and knowledge \ncreation \n3.8 Contractual agreements \n3.9 Extreme time pressure or non-negotiable deadlines \n3.10 Financial limitations \n3.11 Procedures determined by laws or other regulations \n3.12 Safety issues \n3.13 When others are totally closed to new ideas \n3.14 acknowledging shared responsibility  \n3.15 adopting a positive 'can do' attitude \n3.16 following up on practical details \n3.17 pro-actively seeking information  \n3.18 suggesting a new approach \n3.19 talking to others about possible answers \n3.20 constraints of the broader context and environment \n3.21 overall goal - what needs to be achieved \n3.22 personal hopes and expectations\n\n--- PDF PAGE 23 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n19 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nEvaluated the effectiveness and efficiency of workplace \nsystems, processes and procedures. \n1.2 \nModelled the conscious process of critical inquiry to get new \ninsights that s/he can get in formulating action plans on \ncontinuous improvement in the workplace and real-life \n1.3 \nPracticed the habit of critical inquiry and curiosity in the \nworkplace \n1.4 \nShown a thorough knowledge and understanding of how \ncritical thinking impacts on individual lives, the broader \ncommunity and work situations. \n1.5 \nDeveloped practical action plans for improving workplace \nconditions. \n2. Resource \nImplications \n2.1. \nInteractions with specific challenges and situations to \ndemonstrate the application of critical thinking (this would \nusually involve interactions with others). \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDirect questioning combined with review of portfolios of \nevidence and third-party workplace reports of on-the-job \nperformance by the candidate  \n3.2 \nEvaluation of a candidate blog exploring different ideas and \nquestions  \n3.3 \nReview of candidate response to scenarios that allow the \ncandidate to apply critical thinking techniques to a life or work \nsituation, and to demonstrate ability to portray curiosity and \nexploration of new concepts \n3.4 \nEvaluation of candidate response to the challenge of \nadopting different perspectives on a situation, and ability to \nboth develop and respond to questions from those \nperspectives \n3.5 \nObservation of the candidate participating in a group \nproblem-solving session \n3.6 \nOral or written questioning to assess knowledge of typical \nblockers to the critical thinking process. \n3.7 \nLife Narrative Inquiry to reflect life stories that reflect how \ncritical thinking and problem solving is applied in the lives.  \n4. Context for \nAssessment \n4.1. \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n",
