orage \nprocedure of measuring \ntools \n \n3.1 Storing and \ncleaning of \nmeasuring tools\n\n--- PDF PAGE 68 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n64 \n \n      RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Angular measuring \n      tools \nMay include: \n1.1 Bevel protractor \n1.2 Gage blocks \n1.3 Sine bar \n \n2.   Measurements \nMay include: \n2.1 Angle \n2.2 Taper \n \n \n \n \n \n \n      EVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate:   \n1.1 Selected and used angular measuring instruments \n1.2 Maintained/adjusted instruments \n1.3 Cleaned and stored measuring instruments \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to the activity \n2.2 Specimen component or part to the proposed activity \n \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.2 Direct observation \n3.3 Demonstration \n3.4 Written or oral short answer questions \n3.5 Portfolio \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
