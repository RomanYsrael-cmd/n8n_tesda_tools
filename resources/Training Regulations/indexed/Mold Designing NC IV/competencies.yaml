s \n3.2. Information \ncollection, \ncollation \n3.3. Information \nevaluation issues \n3.4. Information \nstorage \nrequirements and \nmethods \n3.5. Reporting \nprocedures of the \norganisation \n3.1. Analysing record \ninformation \n3.2. Collecting and \ncollating information \n3.3. Communicating \neffectively \n3.4. Disseminating \ninformation \n3.5. Presenting \ninformation \n3.6. Using management \ninformation systems \nto store and retrieve \ndata\n\n--- PDF PAGE 32 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n28 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4. Report and \ndisseminate \nanalyzed \ninformation \n \n4.1. The results of \ninformation gathering, \nanalysis and synthesis \nare reported within \nspecified time frames \nand to the standard \ndefined by the \norganisation. \n4.2. The results of \ninformation gathering, \nanalysis and synthesis \nare reported so they \ncan be inputs to policy \ndevelopment and \norganisation decision \nmaking. \n4.3. Information which is \ngathered is \ndisseminated to \nappropriate personnel \nwithin the specified \ntimeframe \n4.1. Analysis and \ndisplay \ntechniques \n4.2. Information \ncollection, \ncollation \n4.3. Information \nevaluation issues \n4.4. Information \nstorage \nrequirements and \nmethods \n4.5. Reporting \nprocedures of the \norganisation \n \n4.1. Analysing record \ninformation \n4.2. Collecting and \ncollating information \n4.3. Communicating \neffectively \n4.4. Disseminating \ninformation \n4.5. Presenting \ninformation \n4.6. Using management \ninformation systems \nto store and retrieve \ndata\n\n--- PDF PAGE 33 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n29 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay 