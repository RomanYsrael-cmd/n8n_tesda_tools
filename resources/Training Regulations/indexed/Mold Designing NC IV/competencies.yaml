        "source_title": "PERFORM ROUTINE HOUSEKEEPING",
        "source_text": "--- PDF PAGE 62 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n58 \n \nUNIT OF COMPETENCY \n: \nPERFORM ROUTINE HOUSEKEEPING \n \nUNIT CODE \n \n: \nMEE722206 \n \nUNIT DESCRIPTOR   \n: \nThis unit covers the competencies required to maintain an \norganized and clean work area. \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nrequirement \n1.1 Work area maintained in a \nsafe, uncluttered and \norganized manner according \nto workshop policy \n1.2 All tasks carried out safely, \neffectively and efficiently with \nminimum inconvenience \naccording to workshop policy \n1.3 Workshop policies and \nprocedures for tidying work \nareas and placing items in \ndesignated areas applied \n1.1 Shop safety \npractices \n1.2 Machine \nshop \nequipment \n1.3 Shop policies \nregulations \n1.4 5-S \n1.5 Shop \ncleaning \nequipment \n \n1.1 Maintaining \nwork area, safe \nuncluttered and \norganized \n1.2 Carrying out all \ntask safely, \neffectively and \nefficiently \n1.3 Designating \nworkshop \npolicies and \nprocedures for \nwork area \n2 Clean work \narea \n2.1 Shop policies and procedures \napplied for cleaning work \narea \n2.2 Wastes promptly removed and \ndisposed of according to shop \npolicies and environmental \nrequirements \n2.3 Spills, wastes and other \npotential hazards reported to \nappropriate personnel and \nremoved according to shop \npolicies and environmental \nrequirements \n2.4 Signage promptly displayed in \nregard to unsafe areas \n2.5 Consumable materials \nmaintained and stored \ncorrectly after use \n2.6 Tools and equipment \n(including guards) cleaned \nand used in accordance with \nmanufacturer’s instructions \n \n2.1 Shop safety \npractices \n2.2 Machine \nshop \nequipment \n2.3 Shop policies \nregulations \n2.4 5-S \n2.5 Shop \ncleaning \nequipment \n \n2.1 Applying shop \npolicies and \nprocedures \n2.2 Disposing of \nwaste \naccording to \nshop policy and \nenvironmental \nrequirements \n2.3 Cleaning of \ntools and \nequipment\n\n--- PDF PAGE 63 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n59 \n \n    RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Workshop policy \nShop policy and procedure in regard to: \n1.1 Housekeeping practices \n1.2 Maintenance and storage of cleaning equipment \n1.3 Use and storage of cleaning chemicals \n2.   Work area \nMay include: \n2.1 Work benches \n2.2 Walkways and aisles  \n2.3 Fixtures and other working surfaces  \n3.  Tools and  \n     Equipment \nMay include: \n3.1 Drill Press \n3.2 Pedestal Grinder \n3.3 Surface plate \n3.4 Layout and marking tools \n3.5 Cutting tools (hacksaw, chisel, files) \n3.6 Inspection and measuring tools (templates, vernier \ncaliper, micrometer, straight edge, gages, etc…)\n\n--- PDF PAGE 64 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n60 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate:   \n1.1 Organized and cleaned work area according shop  \n        policies and environmental requirements. \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to \nprocesses or activity \n2.2 Materials and documentation relevant to the \nproposed activity \n2.3 Shop policy and/or procedures manual on \nhousekeeping, cleaning and occupational health and \nsafety \n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation  \n3.2 Demonstration or role play \n3.3 Written or oral short answer questions \n3.4 Identify colleagues/clients who can be approached \nfor the collection of competency evidence, where \nappropriate \n4. Context for assessment \n4.1 Competency may be assessed in actual workplace \nor at the designated TESDA Accredited Assessment \nCenter\n",
