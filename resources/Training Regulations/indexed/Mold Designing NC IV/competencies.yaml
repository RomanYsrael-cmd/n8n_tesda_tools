        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nEvaluated the effectiveness and efficiency of workplace \nsystems, processes and procedures. \n1.2 \nModelled the conscious process of critical inquiry to get new \ninsights that s/he can get in formulating action plans on \ncontinuous improvement in the workplace and real-life \n1.3 \nPracticed the habit of critical inquiry and curiosity in the \nworkplace \n1.4 \nShown a thorough knowledge and understanding of how \ncritical thinking impacts on individual lives, the broader \ncommunity and work situations. \n1.5 \nDeveloped practical action plans for improving workplace \nconditions. \n2. Resource \nImplications \n2.1. \nInteractions with specific challenges and situations to \ndemonstrate the application of critical thinking (this would \nusually involve interactions with others). \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDirect questioning combined with review of portfolios of \nevidence and third-party workplace reports of on-the-job \nperformance by the candidate  \n3.2 \nEvaluation of a candidate blog exploring different ideas and \nquestions  \n3.3 \nReview of candidate response to scenarios that allow the \ncandidate to apply critical thinking techniques to a life or work \nsituation, and to demonstrate ability to portray curiosity and \nexploration of new concepts \n3.4 \nEvaluation of candidate response to the challenge of \nadopting different perspectives on a situation, and ability to \nboth develop and respond to questions from those \nperspectives \n3.5 \nObservation of the candidate participating in a group \nproblem-solving session \n3.6 \nOral or written questioning to assess knowledge of typical \nblockers to the critical thinking process. \n3.7 \nLife Narrative Inquiry to reflect life stories that reflect how \ncritical thinking and problem solving is applied in the lives.  \n4. Context for \nAssessment \n4.1. \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.",
