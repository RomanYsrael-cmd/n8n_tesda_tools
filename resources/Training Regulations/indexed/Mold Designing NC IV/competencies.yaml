 \nethics   \n2.1 Building customer \nrelations \n2.2 Individual \nmarketing skills  \n2.3 Using basic \nadvertising \n(posters/ \ntarpaulins, flyers, \nsocial media, etc.)  \n3. Expand \nmarkets and \nclientele \n3.1 Enterprise is built up \nand sustained through \njudicious control of \ncash flows.  \n3.2 Profitability of \nenterprise is ensured \nthough appropriate \ninternal controls. \n3.3 Unnecessary or lower-\npriority expenses and \npurchases are \navoided.  \n3.4 New markets and \nclients are identified \nbased on current \nmarket trends \n \n3.1 Basic cost-\nbenefit analysis \n3.2 Basic financial \nmanagement \n3.3 Basic financial \naccounting    \n3.4 Business internal \ncontrols  \n \n3.1 Setting business \npriorities and \nstrategies \n3.2 Interpreting basic \nfinancial \nstatements \n3.3 Preparing business \nplans\n\n--- PDF PAGE 45 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n41 \n \n   RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Entrepreneurial skills \nMay include: \n1.1. Financial management skills \n1.2. People management skills  \n1.3. Operations management skills  \n1.4. Business acumen \n \n2. Business operations  \nMay include: \n2.1 Purchasing  \n2.2 Accounting/Administrative work \n2.3 Production/Operations/Sales \n \n3. Internal controls \nMay include: \n3.1 Accounting systems \n3.2 Financial statements/reports \n3.3 Cash management \n3.4 Managing property, plant and equipment \n4. Continuous \nimprovement \nMay include: \n4.1 Quality management systems (PDCA, ISO 9001,TQM, \nSix-Sigma, etc.) \n4.2 Client feedback systems \n4.3 Quality assurance/Quality control systems\n\n--- PDF PAGE 46 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n42"
