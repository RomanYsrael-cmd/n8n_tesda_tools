          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Start the \ncomputer \n \n1.1 The peripheral \ndevices are \nproperly connected  \n1.2 Power is checked \nand the computer \nand peripheral \ndevices are \nswitched on \n1.3 Proper logging in \nand logging off is \nsuccessfully done \n1.4 The operating \nsystem features \nand functions are \naccessed and \n1.5 Navigated \nHardware \nconfiguration and \nother system \nfeatures are \nchecked \n1.1 Computer functions \n1.2 Basic parts of a \ncomputer and various \nhardware components \n1.3 Keyboard layout and \nfunctions \n \n \n1.1 Connecting \nperipheral devices \n1.2 Logging in and \nlogging off properly \n \n2. Arrange and \ncustomize \ndesktop \ndisplay/ \nWindows \nsettings \n2.1 The desktop screen \nor Windows \nelements are \nchanged as needed \n2.2 Desktop icons are \nadded, renamed, \nmoved, copied or \ndeleted \n2.3 The online help \nfunctions are \naccessed or used as \nneeded \n2.4 Desktop icons of \napplication \nprograms are \nselected, opened \nand closed \n2.5 Properties of icons \nare displayed \n2.6 Computer or \ndesktop settings are \nsaved and restored \n2.1 Keyboard layout and \nfunctions \n2.2 Computer functions \n2.3 Basic parts of a \ncomputer and various \nhardware components \n2.4 Storage devices and \nfile concepts \n2.5 Basic software \noperation and \nfunctionalities \n2.1 Changing desktop \nscreen or windows \nelement \n2.2 Adding, renaming, \nmoving, copying \nand deleting desk \ntop icon \n2.3 Accessing online \nhelp function \n2.4 Opening and \nclosing desk top \nicons \n2.5 Displaying \nproperties of icons\n\n--- PDF PAGE 76 ---\nMold Designing NC IV                    Revision 00              Promulgated                 05/21/2019            \n72 \n \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Work with \nfiles and \nfolders (or \ndirectories \n3.1 A file or