  "source_text": "COMPETENCY MAP\nMETALS AND ENGINEERING SECTOR\n MOLD DESIGNING NC IV\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 136 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n132\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in\nthe\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nImplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nApply safety practices\nInterpret working drawings\nand sketches\nSelect/ cut workshop\nmaterials\nPerform shop computations\n(Basic)\nMeasure workpiece (Basic)\nPerform routine housekeeping\n\nPerform shop computations\n(Intermediate)\nMeasure workpiece using\nangular measuring\ninstruments\nPerform shop computations\n(Advanced)\nMeasure workpiece using\ngages and surface texture\ncomparator\nPerform preventive and\ncorrective maintenance\nOperate a personal computer\nSelect and cut workshop\nmaterials\nPrepare cost estimates\nApply Safety Practices\nInterpret Drawings and Sketches\nPerform Industry Calculations\nContribute to Quality System\nUse Hand Tools\nPrepare Weld Materials\nSetup Welding Equipment\nFit up Weld Materials\nRepair Welds\nPerform shop computations\n(Intermediate)\nMeasure workpiece\n(Intermediate)\nPerform preventive and\ncorrective Maintenance\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 137 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n133\nCreate drawing using CAD\nsoftware\nApply CAD/CAM program\nWrite basic CNC lathe machine\nprogram\nSet-up CNC lathe machine,\nworkpiece and cutting tools\nPerform basic CNC lathe\nmachine operations\nWrite advanced CNC lathe\nmachine program\nSet-up multiple-axis CNC lathe\nmachine, workpiece and cutting\ntools\nPerform advanced CNC lathe\nmachine operations\nWrite basic CNC milling\nmachine program\nSet-up CNC milling machine,\nworkpiece and cutting tools\nPerform basic CNC milling\nmachine operations\nWrite advanced CNC milling\nmachine program\nSet-up multiple-axis CNC\nmilling machine, workpiece\nand cutting tools\nPerform advanced CNC milling\nmachine operations\nWeld Carbon Steel Plates Using\nFCAW\nWeld Carbon Steel Pipes Using\nFCAW\nWeld Alloy Steel Plates\nUsing FCAW\nWeld Alloy Steel Pipes Using\nFCAW\nPerform Gas Welding in Carbon\nSteel Plates and Tubes\nPerform Gas Welding in Alloy\nSteel Plates and Tubes\nWeld Carbon Steel Plates\nUsing GMAW\n\nWeld Carbon Steel Pipes Using\nGMAW\nWeld Alloy Steel Plates Using\nGMAW\nWeld Alloy Steel Pipes Using\nGMAW\nWeld Carbon Steel Plates\nUsing GTAW\nWeld Carbon Steel Pipes Using\nGTAW\nWeld Alloy Steel Plates Using\nGTAW\nWeld Alloy Steel Pipes Using\nGTAW\nPerform bench work (Basic)\nTurn workpiece\nMill workpiece\nGrind workpiece\nShape workpiece\nRepair workpiece\nPerform bench work (Basic)\nPerform bench work (Complex)\nTurn workpiece (Basic)\nTurn workpiece (Intermediate)\nMill workpiece (Basic)\nMill workpiece (Intermediate)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 138 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n134\nGrind workpiece (Basic)\nGrind workpiece (Complex)\nTurn workpiece (Advanced)\nMill workpiece (Advanced)\nPrepare basic engineering\ndrafting\nPerform basic engineering detail\ndrafting\nPerform Preventive\nMaintenance\nPerform Planned and\nUnplanned (Emergency)\nMaintenance\nFabricate Simple Items\nInstall Machinery\n Perform press machine setting\n Perform mechanical press\noperation\nWeld Plates Using SAW\nWeld Pipes Using SAW\nWeld Carbon Steel Plates Using\nSMAW\nWeld Carbon Steel Plates and\nPipes Using SMAW\nWeld Alloy Steel Plates\nUsing SMAW\nWeld Alloy Steel Pipes Using\nSMAW\nMachine Die Components\nFit and Assemble Dies\nTest and Try Die\nMachine mold components\n\nImplement surface finishing\n\nFit and assemble mold\n\nRectify mold flaws\nDetermine mold design\nparameters\nPerform CAD operation\nSimulate and verify mold\ndesign\nModify and finalize mold\ndesign\nCreate fabrication drawing\n\nCORE COMPETENCIES\n\n--- PDF PAGE 139 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n135\nGLOSSARY OF TERMS\n\n1. Assembly\nDrawing\n\nAre used to show the position and functional relationship of parts\nin an assembly\n\n2. Blow Molding\nMethod of fabrication in which a warm plastic hollow tube is placed\nbetween the two halves of a mold cavity and forced to assume the\nshape of that mold cavity by use of internal pressure. This process\nforms hollow articles such as bottles, tanks, etc.\n\n3. CAD (computer-\naided design)\n\nRefers to the software used to create precision drawings or\ntechnical illustrations and can be used to create two-dimensional\n(2-D) drawings or three-dimensional (3-D) models.\n\n4. Cavity\nA depression, or a set of matching depressions, in a plastics-\nforming mold which forms the outer surfaces of the molded articles\n\n5. Cycle Time\nThe time required by an injection molding system to mold a part\nand return to its original position/state.\n\n6. Core\nA protrusion, or set of matching protrusions, in a plastics forming\nmold which forms the inner surfaces of the molded articles\n7. Gate\n\nThe channel through which the molten resin flows from the runner\ninto the cavity\n8. Machine\nRefers to an equipment used for the manufacturing of molded\nproducts.\n\n9. Material\n\nRefers to the substance or substances of which a product is made\nor composed.\n\n10. Mold\nA hollow form or matrix into which a plastic material is placed and\nwhich imparts to the material its final shape.\n\n11. Part Drawing\nDetail drawing completely described a single parts with multiple\northographic projections\n\n12. Plastic\nA material that contains as an essential ingredient one or more\norganic polymeric substances of large molecular weight, is solid\nin its finished state, and, at some stage in its manufacture or\nprocessing into finished articles, can be shaped by flow.\n\n13. Process\nRefers to a continuous action or operation taking place in a\ndefinite manner\n\n14. Product\n\nRefers to the outcome produced during molding process.\n\n--- PDF PAGE 140 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n136\n15. Runner\n\nIn an injection mold, the feed channel, usually of circular cross\nsection, which connects the sprue with the cavity gate. The term\nis also used for the plastic piece formed in this channel.\n\n16. Simulation\nRefers to\nthe representation of the behavior or characteristics of the\nproduct through the use of software.\n\n17. Specification\n\nRefers to a detailed description or assessment of requirements\n18. Tolerance\nRefers to the range of permissible size\n\n19. Toolbars\nRefers to a horizontal or vertical column of selectable buttons\ndisplay on a computer screen, allowing the user to select a\nvariety of functions.\n\n--- PDF PAGE 141 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n137\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMold Designing NC IV\n\nQualification Code:\nMEEMOD419\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nMold Designing\nNC IV\n2019-033/\n05-21-2019\n\nLegend: *Description Types\n- Document Created\n\n--- PDF PAGE 142 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n138\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTECHNICAL EXPERTS / TESDA EXPERTS PANEL\n\nFred P. Liza\nIndustry Expert\nChief, Prototyping Division\nDOST-MIRDC\nBicutan, Taguig City\nDanilo N. Pilar\nIndustry Expert\nChief,\nDOST-MIRDC\nBicutan, Taguig City\nRomanico F. Salido\nIndustry Expert\nProject Consultant\nDOST-MIRDC\nBicutan, Taguig City\nReynaldo Dela Cruz\nIndustry Expert\nSupervising SRS,\nDOST-MIRDC\nBicutan, Taguig City\nGHARRY M. BATHAN\nIndustry Expert\nSr. SRS\nDOST-MIRDC\nBicutan, Taguig City\nVirgilio Lanzuela\nIndustry Expert\nBoard of Trustee-Secretary\nPDMA, Inc.\nChairman\nRollmaster Machinery and Industrial\nServices, Corporation.\nThe Management and Staff of the Philippine Die and Mold Association Inc. (PDMA)\n\n--- PDF PAGE 143 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n139\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n•\nAichi Forging Co. of Asia, Inc.\n Sta. Rosa, Laguna\n\n•\nMFI Technological Institute Inc.\n Pasig City\n\n•\nSMC Yamamura Fuso Molds Corp.\n Cavite City\n\n•\nTop Choice Training Inst. & Assessment Center, Inc. Parañaque City\n\n•\nTUP Manila\n\n•\n3MI Graphics and Software Design Corp.\n Pasig City\n\n--- PDF PAGE 144 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n140\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Facilitators\n- Ma. Isabel G. Gamurot\n- Howard Mark N. Plete\n- Evangeline A. Cosep",
