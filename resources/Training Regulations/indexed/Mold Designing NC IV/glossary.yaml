  "source_text": "1. Assembly\nDrawing\n\nAre used to show the position and functional relationship of parts\nin an assembly\n\n2. Blow Molding\nMethod of fabrication in which a warm plastic hollow tube is placed\nbetween the two halves of a mold cavity and forced to assume the\nshape of that mold cavity by use of internal pressure. This process\nforms hollow articles such as bottles, tanks, etc.\n\n3. CAD (computer-\naided design)\n\nRefers to the software used to create precision drawings or\ntechnical illustrations and can be used to create two-dimensional\n(2-D) drawings or three-dimensional (3-D) models.\n\n4. Cavity\nA depression, or a set of matching depressions, in a plastics-\nforming mold which forms the outer surfaces of the molded articles\n\n5. Cycle Time\nThe time required by an injection molding system to mold a part\nand return to its original position/state.\n\n6. Core\nA protrusion, or set of matching protrusions, in a plastics forming\nmold which forms the inner surfaces of the molded articles\n7. Gate\n\nThe channel through which the molten resin flows from the runner\ninto the cavity\n8. Machine\nRefers to an equipment used for the manufacturing of molded\nproducts.\n\n9. Material\n\nRefers to the substance or substances of which a product is made\nor composed.\n\n10. Mold\nA hollow form or matrix into which a plastic material is placed and\nwhich imparts to the material its final shape.\n\n11. Part Drawing\nDetail drawing completely described a single parts with multiple\northographic projections\n\n12. Plastic\nA material that contains as an essential ingredient one or more\norganic polymeric substances of large molecular weight, is solid\nin its finished state, and, at some stage in its manufacture or\nprocessing into finished articles, can be shaped by flow.\n\n13. Process\nRefers to a continuous action or operation taking place in a\ndefinite manner\n\n14. Product\n\nRefers to the outcome produced during molding process.\n\n--- PDF PAGE 140 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n136\n15. Runner\n\nIn an injection mold, the feed channel, usually of circular cross\nsection, which connects the sprue with the cavity gate. The term\nis also used for the plastic piece formed in this channel.\n\n16. Simulation\nRefers to\nthe representation of the behavior or characteristics of the\nproduct through the use of software.\n\n17. Specification\n\nRefers to a detailed description or assessment of requirements\n18. Tolerance\nRefers to the range of permissible size\n\n19. Toolbars\nRefers to a horizontal or vertical column of selectable buttons\ndisplay on a computer screen, allowing the user to select a\nvariety of functions.\n\n--- PDF PAGE 141 ---\nMold Designing NC IV Revision 00 Promulgated\n05/21/2019\n\n137",
