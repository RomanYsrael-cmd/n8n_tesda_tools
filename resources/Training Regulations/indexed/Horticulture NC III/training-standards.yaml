    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for Horticulture NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HORTICULTURE\nNC Level: NC III\n\nNominal Training Duration: 445 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of an individual in the\nfield of horticulture in accordance with industry standards. In general, it covers core competencies\non undertaking preparation of land for agricultural crop production, implementing a post-harvest\nprogram, implementing a plant nutrition program, controlling weeds and preparing and applying\nchemicals. In horticulture, it covers core competencies on establishing horticultural crops,\ncoordinating a horticultural maintenance program, coordinating horticultural crop harvesting,\nundertaking field budding and grafting and undertaking propagation activities.\n\n To obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCY\n18 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication.\n1.1. Communicate information\nabout workplace processes\n1.2. Lead workplace discussions\n1.3. Identify and communicate\nissues arising in the\nworkplace\n Group\ndiscussion\n Role play\n Brainstorming\n\n Observation\n Interviews\n2. Lead small\nteams.\n\n2.1. Provide team leadership\n2.2. Assign responsibilities among\nmembers\n2.3. Set performance expectation\nfor team members\n2.4. Supervise team performance\n Lecture\n Demonstration\n Self-paced\n(modular)\n Demonstration\n Case studies\n3. Develop and\npractice\nnegotiation skills\n\n3.1. Identify relevant information in\nplanning negotiations\n3.2. Participate in negotiations\n3.3. Document areas for\nagreement\n Direct\nobservation\n Simulation/\n role playing\nCase studies\n Written test\n Practical/\nperformance\ntest\n4. Solve problems\nrelated to work\nactivities\n\n4.1. Explain the analytical\ntechniques\n4.2. Identify the problem\n4.3. Determine the possible\ncause/s of the problem\n Direct\nobservation\n Simulation/Rol\ne playing\nCase studies\n Written test\n Practical/\nperformance\ntest\n\n--- PDF PAGE 129 ---\nTR - Horticulture NC III\n\n- 125 -\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1. Identify mathematical tools\nand techniques to solve\nproblem\n5.2. Apply mathematical\nprocedures/solution\n5.3. Analyze results\n Direct\nobservation\n Simulation/\nrole playing\n Case studies\n Written test\n Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1. Identify appropriate\ntechnology\n6.2. Apply relevant technology\n6.3. Maintain/enhance relevant\ntechnology\n Direct\nobservation\n Simulation/\nrole playing\nCase Studies\n Written test\n Practical/\nperformance\ntest\n\nCOMMON COMPETENCY\n14 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of concern\nfor safety measures\n1.2. Apply appropriate safety\nmeasures\n1.3. Safekeep/maintain/ dispose\ntools, materials and outfit.\n Self-\npaced/modular\n Lecture/Discus\nsion\n Interaction\n Practical\nDemonstration\n Visit/tour\n Oral/Written\nInterviews\n Direct\nObservation\n Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use farm tools\n2.2. Prepare and operate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\n Self-\npaced/modular\n Lecture/Discus\nsion\n Interaction\n Practical\nDemonstration\n Visit/tour\n Oral/Written\nInterviews\n Direct\nObservation\n Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n3.3. Apply corrective measures as\nnecessary\n Self-\npaced/modular\n Lecture/Discus\nsion\n Interaction\n Practical\nExercise\n Oral/Written\nexamination\n Practical\nexercise\n\n--- PDF PAGE 130 ---\nTR - Horticulture NC III\n\n- 126 -\nCORE COMPETENCY\n413 Hours\nGeneral\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Undertake\npreparation of\nland for\nagricultural crop\nproduction\n1.1 Prepare for cultivation\n Discussion\n Written exam\n Actual\nDesigning\n1.2 Prepare the cultivating\nequipment\n Discussion\n Demonstration\n Written exam\n Actual\nDemonstration\n Observation\n1.3 Cultivate soil\n Discussion\n Demonstration\n Written exam\n Actual\nDemonstration\n Observation\n1.4 Prepare site for planting\n Demonstration\n\n Actual\nDemonstration\nQuestioning\n1.5 Complete land preparation\noperations\n Demonstration\n\n Actual\nDemonstration\nQuestioning\n2. Implement a\npost-harvest\nprogram\n2.1 Prepare for implementation of\npost-harvest operations\n Discussion\n Written exam\n\n2.2 Coordinate post-harvest\nwork\n Demonstration\n\n Actual\n Demonstration\nQuestioning\n2.3 Implement post-harvest\ntreatments\n Demonstration\n Actual\nDemonstration\nQuestioning\n2.4 Implement hazardous waste\ndisposal guidelines\n Demonstration\n Actual\nDemonstration\nQuestioning\n2.5 Implement packaging\nrequirements of produce\n Demonstration\n Actual\nDemonstration\nQuestioning\n2.6 Implement storage\nrequirements of produce\n Demonstration\n Demonstration\nwith\nQuestioning\n3. Implement a\nplant nutrition\nprogram\n3.1 Prepare for implementation of\nthe plant nutrition program\n Demonstration\n Field visit\n Direct\nObservation\nand Interview\n3.2 Monitor soil pH\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n3.3 Determine nutritional\nproblems in plants\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n3.4 Prepare to use fertilizers\n\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n\n--- PDF PAGE 131 ---\nTR - Horticulture NC III\n\n- 127 -\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3.5 Prepare application\nequipment\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n3.6 Apply specific products at\nappropriate rates\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n4. Control weeds\n4.1 Assess weed infestation\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n4.2 Plan the implementation of\ncontrol measures\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n4.3 Implement control measures\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n4.4 Monitor control weeds\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5. Prepare and\napply chemicals\n5.1 Determine the need for\nchemical use\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.2 Prepare appropriate chemical\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.3 Prepare to use chemicals\naccording to the label and\nMSDS\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.4 Apply chemicals\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.5 Clean up following chemical\napplication\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.6 Record application details\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n\nHorticulture\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Establish\nhorticultural\ncrops\n1.1 Prepare machinery and\nequipment for use\n1.2 Prepare for horticultural crop\nestablishment\n1.3 Sow the crop\n1.4 Complete seeding operations\n1.5 Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures.\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n\n--- PDF PAGE 132 ---\nTR - Horticulture NC III\n\n- 128 -\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Coordinate a\nhorticultural crop\nmaintenance\nprogram\n2.1 Prepare for the crop\nmaintenance program\n2.2 Prepare crop maintenance\nmaterials, tools and\nequipment\n2.3 Implement the crop\nmaintenance program\n2.4 Complete crop maintenance\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n3. Coordinate\nhorticultural crop\nharvesting\n3.1 Prepare for crop harvesting\n3.2 Coordinate harvesting\nactivities\n3.3 Maintain harvest\nrequirements\n3.4 Monitor crop quality\nthroughout harvest\n3.5 Deliver crop to specified\ndestination\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n4. Undertake field\nbudding and\ngrafting\n4.1 Prepare parent material for\nbudding and grafting\n4.2 Prepare budding and grafting\nmaterials\n4.3 Bud/graft scion\n4.4 Complete budding/ grafting\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n5. Undertake\npropagation\nactivities\n5.1 Prepare for plant propagation\n5.2 Propagate plants\n5.3 Complete propagation\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n--- PDF PAGE 133 ---\nTR - Horticulture NC III\n\n- 129 -\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the following\nrequirements:\n\n• can communicate either oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering the TVET program.\n\n3.4 TOOLS AND EQUIPMENT AND MATERIALS\n HORTICULTURE NC III\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nHorticulture NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n25 pcs\n• Bolos\n2\n• Booth/temporary\nshed\n250\npcs.\n• Agri bags, plastic\n10 pcs\n• Broomstick\n5\n• Cart (Kariton &\nparagus)\n500\npcs.\n• Bamboo stick\n5 pcs\n• Calculator\n1\n• Coolroom\n5 pcs.\n• Basket\n5 pcs\n• Container\n1\n• Comb-tooth harrow\n5 rims\n• Bond paper\n5 sets\n• Cutting tools\n5\n• Computer with\nrecord keeping\nsoftware\n5 pcs.\n• Catching nets\n\n--- PDF PAGE 134 ---\nTR - Horticulture NC III\n\n- 130 -\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\napplications\n5 sets\n• Digging tools\n1\n• Crates\n3\ndozen\n• Clips\n2 pcs\n• Drying meter\n1\n• Drying oven\n5\nsacks\n• Coconut dust\n10 pcs\n• Dulos\n1\n• Farm/ field\n5\nsacks\n• Compost\n5 pcs\n• Fruit crate\n1\n• Greenhouse/nurser\ny\n1 sack\nof\neach\n• Fertilizers-various\n5 sets\n• Harvesting tools\n1\n• Harvesting\nequipment\n1 kit\n• First aide\nsupplies/medicine\n25 pcs\n• Hat\n1\n• Irrigation system\n(sprinkler, mist/drip\nirrigation)\n5\nbottles\n• Flower inducer\n5 pcs\n• Knapsack\nsprayer\n1\n• Mower (grass\ncutter)\n5\nbottles\n• Fungicides\n5 sets\n• Knife\n1\n• Over head projector\n(OHP)\n25\npairs\n• Gloves\n5 pcs\n• Light hoe\n1\n• Portable chain saw\n5\nsacks\n• Growing media\n(garden soil, sewed\nsand, compost, soil,\nmanure and\nsawdust/rice\n5\n• Personal\nprotection\neq