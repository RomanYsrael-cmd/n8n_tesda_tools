 NC III\n\n- 126 -\nCORE COMPETENCY\n413 Hours\nGeneral\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Undertake\npreparation of\nland for\nagricultural crop\nproduction\n1.1 Prepare for cultivation\n Discussion\n Written exam\n Actual\nDesigning\n1.2 Prepare the cultivating\nequipment\n Discussion\n Demonstration\n Written exam\n Actual\nDemonstration\n Observation\n1.3 Cultivate soil\n Discussion\n Demonstration\n Written exam\n Actual\nDemonstration\n Observation\n1.4 Prepare site for planting\n Demonstration\n\n Actual\nDemonstration\nQuestioning\n1.5 Complete land preparation\noperations\n Demonstration\n\n Actual\nDemonstration\nQuestioning\n2. Implement a\npost-harvest\nprogram\n2.1 Prepare for implementation of\npost-harvest operations\n Discussion\n Written exam\n\n2.2 Coordinate post-harvest\nwork\n Demonstration\n\n Actual\n Demonstration\nQuestioning\n2.3 Implement post-harvest\ntreatments\n Demonstration\n Actual\nDemonstration\nQuestioning\n2.4 Implement hazardous waste\ndisposal guidelines\n Demonstration\n Actual\nDemonstration\nQuestioning\n2.5 Implement packaging\nrequirements of produce\n Demonstration\n Actual\nDemonstration\nQuestioning\n2.6 Implement storage\nrequirements of produce\n Demonstration\n Demonstration\nwith\nQuestioning\n3. Implement a\nplant nutrition\nprogram\n3.1 Prepare for implementation of\nthe plant nutrition program\n Demonstration\n Field visit\n Direct\nObservation\nand Interview\n3.2 Monitor soil pH\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n3.3 Determine nutritional\nproblems in plants\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n3.4 Prepare to use fertilizers\n\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n\n--- PDF PAGE 131 ---\nTR - Horticulture NC III\n\n- 127 -\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3.5 Prepare application\nequipment\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n3.6 Apply specific products at\nappropriate rates\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n4. Control weeds\n4.1 Assess weed infestation\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n4.2 Plan the implementation of\ncontrol measures\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n4.3 Implement control measures\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n4.4 Monitor control weeds\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5. Prepare and\napply chemicals\n5.1 Determine the need for\nchemical use\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.2 Prepare appropriate chemical\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.3 Prepare to use chemicals\naccording to the label and\nMSDS\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.4 Apply chemicals\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.5 Clean up following chemical\napplication\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n5.6 Record application details\n Demonstration\n Simulation\n Direct\nObservation\nand Interview\n\nHorticulture\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Establish\nhorticultural\ncrops\n1.1 Prepare machinery and\nequipment for use\n1.2 Prepare for horticultural crop\nestablishment\n1.3 Sow the crop\n1.4 Complete seeding operations\n1.5 Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures.\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n\n--- PDF PAGE 132 ---\nTR - Horticulture NC III\n\n- 128 -\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Coordinate a\nhorticultural crop\nmaintenance\nprogram\n2.1 Prepare for the crop\nmaintenance program\n2.2 Prepare crop maintenance\nmaterials, tools and\nequipment\n2.3 Implement the crop\nmaintenance program\n2.4 Complete crop maintenance\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n3. Coordinate\nhorticultural crop\nharvesting\n3.1 Prepare for crop harvesting\n3.2 Coordinate harvesting\nactivities\n3.3 Maintain harvest\nrequirements\n3.4 Monitor crop quality\nthroughout harvest\n3.5 Deliver crop to specified\ndestination\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n4. Undertake field\nbudding and\ngrafting\n4.1 Prepare parent material for\nbudding and grafting\n4.2 Prepare budding and grafting\nmaterials\n4.3 Bud/graft scion\n4.4 Complete budding/ grafting\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n5. Undertake\npropagation\nactivities\n5.1 Prepare for plant propagation\n5.2 Propagate plants\n5.3 Complete propagation\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment",
