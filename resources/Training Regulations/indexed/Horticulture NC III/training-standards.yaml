am\n2.1 Prepare for the crop\nmaintenance program\n2.2 Prepare crop maintenance\nmaterials, tools and\nequipment\n2.3 Implement the crop\nmaintenance program\n2.4 Complete crop maintenance\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n3. Coordinate\nhorticultural crop\nharvesting\n3.1 Prepare for crop harvesting\n3.2 Coordinate harvesting\nactivities\n3.3 Maintain harvest\nrequirements\n3.4 Monitor crop quality\nthroughout harvest\n3.5 Deliver crop to specified\ndestination\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n4. Undertake field\nbudding and\ngrafting\n4.1 Prepare parent material for\nbudding and grafting\n4.2 Prepare budding and grafting\nmaterials\n4.3 Bud/graft scion\n4.4 Complete budding/ grafting\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment\n5. Undertake\npropagation\nactivities\n5.1 Prepare for plant propagation\n5.2 Propagate plants\n5.3 Complete propagation\nactivities\n Demonstration\n Simulation\n Direct\nobservation\n Oral interview\n Portfolio\nassessment"
