    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: HORTICULTURE\nNC Level: NC III\n\nNominal Training Duration: 445 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of an individual in the\nfield of horticulture in accordance with industry standards. In general, it covers core competencies\non undertaking preparation of land for agricultural crop production, implementing a post-harvest\nprogram, implementing a plant nutrition program, controlling weeds and preparing and applying\nchemicals. In horticulture, it covers core competencies on establishing horticultural crops,\ncoordinating a horticultural maintenance program, coordinating horticultural crop harvesting,\nundertaking field budding and grafting and undertaking propagation activities.\n\n To obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCY\n18 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication.\n1.1. Communicate information\nabout workplace processes\n1.2. Lead workplace discussions\n1.3. Identify and communicate\nissues arising in the\nworkplace\n Group\ndiscussion\n Role play\n Brainstorming\n\n Observation\n Interviews\n2. Lead small\nteams.\n\n2.1. Provide team leadership\n2.2. Assign responsibilities among\nmembers\n2.3. Set performance expectation\nfor team members\n2.4. Supervise team performance\n Lecture\n Demonstration\n Self-paced\n(modular)\n Demonstration\n Case studies\n3. Develop and\npractice\nnegotiation skills\n\n3.1. Identify relevant information in\nplanning negotiations\n3.2. Participate in negotiations\n3.3. Document areas for\nagreement\n Direct\nobservation\n Simulation/\n role playing\nCase studies\n Written test\n Practical/\nperformance\ntest\n4. Solve problems\nrelated to work\nactivities\n\n4.1. Explain the analytical\ntechniques\n4.2. Identify the problem\n4.3. Determine the possible\ncause/s 