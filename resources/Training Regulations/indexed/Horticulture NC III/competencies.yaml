        "source_text": "AGR611317\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required for co-ordinating\nharvesting activities for horticultural crops including preparing for\nharvest, maintaining harvest requirements, monitoring crop quality\nand delivering the crop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for crop\nharvesting\n1.1\nThe crop to be harvested and the requirements and\nprocedures to assure crop quality are identified according to\nfarm work procedures.\n1.2\nCrop maturity is determined by experience, specification\ncharts, aids or devices and according to client, farm and\nindustry quality assurance specifications.\n1.3\nSuitable weather conditions for picking are established\naccording to farm work procedures.\n1.4\nTools, equipment and machinery are selected according to\nharvest requirements and farm work procedures.\n1.5\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and farm work procedures prior to harvesting.\n1.6\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.7\nSuitable safety and personal protective equipment (PPE)\nare selected, used and maintained.\n2. Coordinate\nharvesting activities\n2.1\nFarm work team, contractors and clients are identified and\nwork tasks are co-ordinated in a sequential, timely and\neffective manner in consultation with the supervisor.\n2.2\nHarvesting of the crop is undertaken according to OHS\nrequirements and with due consideration of the\nenvironmental implications.\n2.3\nHarvest records are maintained according to farm work\nprocedures.\n2.4\nA clean and safe work area is maintained throughout and on\ncompletion of work.\n3. Maintain harvest\nrequirements\n3.1\nFarm tools, equipment and machinery are maintained in\neffective working order throughout the harvest to enable\nsmooth operations and minimize downtime.\n3.2\nHarvest workers are provided with sufficient tools, equipment\nand machinery to match harvest output and to prevent\nunnecessary interruptions.\n3.3\nFull containers are removed, emptied into or loaded onto\ntransport vehicles as soon as possible after harvesting to\nminimize deterioration of the crop.\n\n--- PDF PAGE 73 ---\nTR - Horticulture NC III\n\n- 69 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Monitor crop quality\nthroughout harvest\n4.1\nPPE is selected, maintained and used according to OHS\nprocedures.\n4.2\nThe crop is handled carefully to prevent damage according to\nfarm work procedures.\n4.4\nSorting and grading of the crop complies with client, farm\nand industry quality assurance specifications.\n4.5\nCrop storage minimizes postharvest deterioration according\nto farm work procedures.\n4.6\nThe crop is transported with minimum damage according to\nfarm work procedures.\n5. Deliver crop to\nspecified destination\n5.1\nDelivery details including quantity, timing and destination are\nconfirmed according to farm work procedures.\n5.2\nCrop is delivered with damage levels that are within client,\nfarm and industry quality assurance specifications.\n5.3\nDelivered crop complies with client, farm and industry quality\nassurance specifications.\n5.4\nDelivery documentation is completed accurately according to\nfarm work procedures.\n\n--- PDF PAGE 74 ---\nTR - Horticulture NC III\n\n- 70 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. crops\n\n1.1.\nCrops may include fruit, vegetables, herbs, flowers, foliage,\nbulbs, tubers, nuts, mushrooms, wild harvest plants and oils.\n1.2.\nThe crop may be harvested manually or mechanically.\n2. farm work\nprocedures\n2.1.\nWork procedures will be based on sound horticultural\nprinciples and practices and may include supervisors oral or\nwritten instructions, the harvest plan, program and schedule,\nquality assurance policy and plan, farm standard operating\nprocedures (SOPs), specifications, routine maintenance\nschedules, work notes; product labels and Material Safety\nData Sheets (MSDS); manufacturers service specifications\nand operators manuals; waste disposal, recycling and re-use\nguidelines; and OHS procedures.\n3. crop maturity\ndetermined\n3.1.\nMaturity parameters may include size, weight, length, shape,\ncolour (external and/or internal), texture, skin condition, ease\nof removal, moisture content, ripeness, percentage juice,\nspecific gravity, acidity and sugar content.\n3.2.\nThese characteristics may be measured by observation and\nmaturity testing tools and equipment such as knives, sizing\nrings, callipers, colour charts, refractometers, penetrometers\nand produce firmness testers.\n3.3.\nThe results are interpreted and analyzed by comparison with\nspecification charts and client, farm and industry maturity\nstandards.\n4. clients\n4.1.\nClients may include the farm, packers, wholesalers, retailers,\nprocessors and exporters.\n5. weather\nconditions\n5.1.\nWeather conditions may include temperature, humidity, rain,\nand wind and sun intensity.\n6. tools, equipment\nand machinery\n6.1.\nTools, equipment and machinery may include secateurs,\nknives, maturity testing equipment, specification charts,\ngloves, bags, ladders, tractors, trailers, forklifts, powered\nladders, mechanical harvesters, pallets, containers, cartons,\ntrays, net bags, buckets, dip tins, bulk bins, gondolas, trucks\nand trailers for transport of bulk produce, grading machinery,\ncutting machines, coolrooms, gassing chambers and labelling\ndevices.\n7. OHS hazards\n7.1.\nHazards may include solar radiation, dust, noise, soil and air-\nborne micro-organisms, chemicals and hazardous\nsubstances, sharp hand tools and equipment, manual\nhandling, ladders, moving vehicles, machinery and machinery\nparts, slippery or uneven surfaces, potholes and flying objects.\n8. safety equipment\n8.1.\nSafety equipment may include signage and barriers.\n9. PPE\n9.1.\nPPE may include hat, boots, overalls, gloves, goggles,\nrespirator or face mask, face guard, hearing protection,\nsunscreen lotion and hard hat.\n\n--- PDF PAGE 75 ---\nTR - Horticulture NC III\n\n- 71 -\nVARIABLE\nRANGE\n10. OHS requirements\n10.1. OHS requirements may include identifying hazards, assessing\nrisks and implementing controls, cleaning, maintaining and\nstoring tools, equipment and machinery, appropriate use of\npersonal protective equipment including sun protection, safe\noperation of tools, equipment and machinery; safe handling,\nuse and storage of chemicals and hazardous substances,\ncorrect manual handling, basic first aid, personal hygiene and\nreporting problems to supervisors.\n11. environmental\nimplications\n11.1. Detrimental environmental impacts may arise where harvest-\ning activities produce excess noise, dust or water run-off.\n12. harvest records\n12.1. Harvest records may include harvest workers tallies or\nworking hours, written harvest instructions, dates of harvest,\nwithholding periods (time since last chemical spray), crop yield\nfrom each section, weather conditions during harvest,\npercentage crop deterioration, maturity measurements taken,\nstorage conditions, machinery settings or adjustments,\nmachinery repairs and maintenance, dispatch details and\ndelivery dockets.\n13. clean and safe\nwork area\n13.1. Tasks may include disabling unused tools, equipment and\nmachinery and storing neatly out of the way of harvest\nactivities, safely storing harvest materials on site, using\nsignage and safety barriers during and removing after\nmechanical harvesting activities are completed, and swiftly\nand efficiently removing and processing debris and waste\nfrom the work area.\n14. damage to the\ncrop\n14.1. Damage may occur during mechanical harvesting by rods,\nbeaters, shakers, blades, belts, chains, wheels and other\nmoving machinery parts, during manual harvesting by long\nfingernails, tearing or cutting the crop when picking, bruising\nor squashing the crop when dropping or tipping it into\ncontainers, and overfilling containers. Protruding nails,\nsplinters or rotting, unemptied crop in containers may damage\nthe crop, as may driving too fast or roughly, leaving filled\ncontainers in the sun too long, frost damage when full\ncontainers are left out overnight and not separating varieties.\n15. sorting and grading\nrequirements\n15.1. Sorting and grading may include removing out of type plants,\nor physically damaged, unhealthy, rotten or immature\nproduce. The crop may be graded according to variety, size,\nlength, colour, maturity, blemishes, bud count and quality,\nwhich are subject to seasonal and market forces. Crop in\ndoubt is checked with supervisors. Any out-of-standard\nproduce should be disposed of according to farm policy.\n16. storage conditions\n16.1. Storage requirements may include high humidity, cold\ntemperature and controlled atmosphere storage, supplying\nproduce with water after harvest e.g., asparagus and roses,\ncontrolling gases and temperature in storage to speed up\nmaturity e.g., ethylene gas to ripen bananas and improve the\ncolour of citrus, and coating with wax or wrapping in plastic.\n17. Crop to be\ntransported\n17.1. The crop may be transported by trailer, forklift, truck or other\nspecialised methods of transport.\n18. destinations\n18.1. Destinations for harvested crop may include points of sale or\nsites for further treatment.\n\n--- PDF PAGE 76 ---\nTR - Horticulture NC III\n\n- 72 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nprepared for crop harvesting activities\n1.2.\nmaintained harvest requirements\n1.3.\nmonitored crop quality throughout harvest\n1.4.\ndelivered the crop according to quality specifications.\nThe skills and knowledge required to co-ordinate crop harvesting\nmust be transferable to a different work environment. For example,\na person who can co-ordinate crop harvesting on a property\nproducing citrus should be able to transfer that knowledge and skill\nto another workplace although different crops, such as tomatoes,\nmay be present.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nrecognition of the maturity parameters of a range of crops\n2.2.\nfarm quality procedures and characteristics of a crop relative\nto varying market requirements\n2.3.\ngrading characteristics of each crop\n2.4.\nthe importance of maintaining quality of produce including\ncooling requirements and quick transport from field to\nprocessing areas\n2.5.\nindustry wage rates and conditions, contractors services,\nconditions and rates\n2.6.\nlicensing requirements for use of forklifts, trucks and\nmachinery\n2.7.\nthe effect of adverse climatic conditions (e.g., rain, hail,\nextreme wind, or very high ultraviolet radiation), which may\nprevent or impede crop harvesting operations, or severly\ninfluence the time taken to complete the tasks necessary to\nfulfill the operation.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate ideas and information to work team members,\nsupervisors, contractors and clients\n3.2.\nutilise proforma reporting, analysis and work procedure\ndocuments, and interpret quality specifications\n3.3.\nmeasure materials, interpret harvest specifications and\nschedules, interpret and apply test results, calculate tallies,\nworking hours, yields and quality results\n3.4.\ncoordinate work group, contractors and own activities to\nsequentially and effectively complete harvest in a timely and\ncost effective manner.\n\n--- PDF PAGE 77 ---\nTR - Horticulture NC III\n\n- 73 -\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with vegetables or fruits that require harvesting\n4.2.\nworkplace information relating to crop harvesting\n4.3.\nfarm procedures relating to crop harvesting\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 78 ---\nTR - Horticulture NC III\n\n- 74 -\nUNIT OF COMPETENCY :\nUNDERTAKE FIELD BUDDING AND GRAFTING\nUNIT CODE\n:"
