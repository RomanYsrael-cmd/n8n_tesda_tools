        "source_text": "AGR611327\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required This competency\nstandard covers the process of receiving, moving and sampling bulk\nmaterials in a storage area. It includes the use of safety equipment\nand procedures, and the repair of the facility and equipment used to\nstore the bulk materials. Bulk materials are handled to industry\nstandards in relation to segregation and storage conditions ensuring\nminimum loss or damage and optimum returns. The handling of\nbulk materials in storage areas is likely to be carried out under\nlimited supervision. Overall progress may be checked periodically.\nThe handling of bulk materials in storage areas will usually follow\nset routines, methods and procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to work in\nbulk materials\nstorage area\n1.1\nWork undertaken is interpreted from the work program where\nnecessary, and confirmed with the management.\n1.2\nOHS hazards are identified, risks assessed and suitable\ncontrols implemented.\n1.3\nSuitable personal protective clothing and equipment is\nselected, used and maintained.\n1.4\nTools and equipment suitable for the work to be undertaken\nare selected, checked, and maintained if necessary.\n1.5\nEnvironmental implications of undertaking work in the bulk\nmaterials storage area are identified, likely outcomes\nassessed and if necessary responsible action taken.\n1.6 Worker be informed what to do in case this type of emergency\nor things happen.\n2. Sample bulk\nmaterials for testing\n2.1\nRepresentative samples of bulk materials are taken for\ntesting in line with the requirements of the bulk materials\nstorage program.\n2.2\nSampling is undertaken safely, following the prescribed\nguidelines for the activity.\n2.3\nRepresentative bulk materials samples are prepared for\ndispatch, accurately and clearly labelled, and packaged\naccording to the guidelines of the organization and the\nanalysing body.\n2.4\nSamples are dispatched to the analysing body, according to\nthe requirements of the bulk materials storage program.\n\n--- PDF PAGE 94 ---\nTR - Horticulture NC III\n\n- 90 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Move bulk materials\ninto and out of\nstorage\n3.1 Bulk materials for handling and storage are correctly identified\nfrom the written or verbal instructions.\n3.2\nBulk materials are segregated according to type, variety and\nquality characteristics according to the requirements of the\norganization as stated in the bulk materials storage program.\n3.3\nMeasures are taken to minimize insect and weed infestation\nand contamination during the movement of the bulk\nmaterials. Fumigation.\n3.4\nBulk materials are regularly checked for insect infestation and\ncontamination during movement according to enterprise\nrequirements.\n3.5\nAny storage and handling equipment that is used is\nthoroughly cleaned after emptying, and dismantled if\nnecessary, according to the procedures of the organization\nand the nature of the equipment.\n3.6\nBulk materials are moved into and out of storage according to\nthe procedures of the organization, and following the\nprescribed OHS procedures.\n3.7\nSilo types and handling equipment are selected for each bulk\nmaterial type in relation to their storage characteristics and\nflow properties and according to the requirements of the bulk\nmaterials storage program.\n3.8\nSuitable measures are implemented to minimize the affect of\ndesiccant dusts on the flow properties of bulk materials. If\nhave dust collector, the better.\n3.9\nRecords are clearly and accurately updated and stored as\nand when required by the bulk materials storage program.\n4. Repair and maintain\nstorage facility\n4.1\nThe need for repairs to the facility is identified through\nobservation or instruction.\n4.2\nMaintenance and repairs are conducted according to the\nrequirements of the organization and following the prescribed\nOHS procedures and taking into account environmental\nconsiderations.\n4.3\nCompleted maintenance records and other appropriate\ninformation are documented in accordance with enterprise\nrequirements.\n4.4\nWorkshop and work areas are cleaned and maintained to\nOHS and enterprise requirements.\n4.5\nMaintenance and repairs, damage, malfunctions or irregular\nperformance in machinery, tools and equipment are reported\nin line with organizational requirements.\n4.6\nTools and equipment are cleaned, secured and stored in line\nwith OHS and organizational requirements\n\n--- PDF PAGE 95 ---\nTR - Horticulture NC III\n\n- 91 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. bulk materials\n1.1.\nThese might be any crop harvested in the organization (e.g.,\ncereals, legumes, pulse crops, oilseeds and pasture seeds),\nanimal feed or fertilizers.\n2. OHS hazards\n2.1.\nAmongst the risks are operating and maintaining machinery\nand equipment, including hydraulics and exposed moving\nparts, noise, organic and other dusts, working with,\ntransporting and storing hazardous substances (such as\npesticides), using fumigants, working at heights, and working\non the bulk materials mass.\n2.2.\nPotential emergency situations may include:\n2.3.\ninclement weather during operations, machinery breakdowns,\nstorm damage to equipment and site.\n3. OHS risk\nThe range of actions are both systemic and at an operational level.\nThese are listed below.\n3.1.\nSystems should be in place to ensure the safe operation and\nmaintenance of machinery and equipment. Precautions\nshould also be in place to minimize exposure to noise and\norganic and other dusts. Systems and procedures for\nhandling and storing bulk materials, as well as working with\nand around electricity should also be in place.\n3.2.\nFixtures should be in place in all silos and storage sheds,\nincluding appropriate access ladders, handrails and ladder\ncages.\n3.3.\nPersonal protective equipment should be selected, used and\nmaintained.\n3.4.\nEnvironmental conditions should be controlled e.g., , keeping\nmoisture levels as low as possible will reduce the likelihood of\nfire and silo collapse.\n3.5.\nProcedures should be in place and used for working on top of\nstored bulk materials, working with bulk materials mass\nmovement and stability, working within confined working\nspaces, moving vehicles, working at height.\n3.6.\nRecord keeping practices should ensure that requirements are\nmet in relation to properly observing and using product labels\nand MSDS sheets, instruction manuals and written\norganizational procedures.\n4. personal\nprotective clothing\nand equipment\n4.1.\nBoots, hat/hard hat, overalls, gloves, protective eyewear,\nhearing protection, respirator or face mask, and sun protection\n(sun hat, sun screen).\n5. Samples to be taken\nfor testing\n5.1.\nBulk materials sampling occurs at receipt of bulk materials,\nregularly throughout the storage process, and immediately\nbefore dispatch.\n\n--- PDF PAGE 96 ---\nTR - Horticulture NC III\n\n- 92 -\nVARIABLE\nRANGE\n6. bulk materials\nstorage program\n6.1.\nThe program will provide details of the bulk materials to be\nstored, the timeframes involved, the locations for storage, the\nrecording and documentation requirements, the scheduling of\nthe operation, the responsibility of the various operators to be\ninvolved, the method of pest control and the method of\nsampling and where samples should be sent. Details of the\nrequirements to minimize or eliminate OHS risks, the\nlegislative requirements in relation to all activities undertaken\nduring bulk materials quality maintenance activities, and\nchemical handling procedures and guidelines would also be\ncovered in the program.\n6.2.\nThe bulk materials storage program would also ensure that\nequipment and personnel arranged for operations are\nappropriate to the requirements of various legislation and may\ninclude equipment for detection of fumigant in atmosphere,\nconfined spaces equipment, pressure testing equipment,\nfumigant/inert atmosphere pressure bottles, fumigant\ngeneration equipment, personal protection.\n7. equipment to be\nrequired for sampling\n7.1.\nEquipment such as testing apparatus, sampling, measuring\nand sieving equipment, operational charts, calibration and\nidentification samples, and enterprise/ client instructions.\n8. testing and analysis\n8.1.\nThe bulk materials may be tested for purity, germination,\nvigour, seed weight, and/or disease identification, it may also\nbe analyzed for moisture, insects (live and dead), weed and\nother commodity seeds, other foreign matter, cracked bulk\nmaterials, weather affected bulk materials, and bulk materials\nsize.\n9. contamination\n9.1.\nThese may include moulds, moisture, mites, weeds, foreign\nseeds, insects, fungal diseases, soil and other foreign\nmaterial.\n10. storage and\nhandling\nequipment\n10.1. Handling equipment used includes silo conveyors, elevators,\nchutes, and augers. Other equipment used may include\ntractors, front-end loaders, computing equipment used by\nenterprise, two-way radio/ telephone, wall charts and other\nvisual recording methods, warning devices, and\nventilation/aeration equipment. Handling equipment may also\nbe manual.\n11. movement\n11.1. Bulk materials movements may be for the purposes of receipt,\ndispatch, aeration, treatment and/or blending of bulk materials\ngrades.\n12. vehicles to be\nused to move the\nbulk materials\n12.1. Vehicles may be trucks, articulated road vehicles, trailers and\nappropriate unloading methods applied to each type of\nvehicle. Vehicles may also be pulled by animal power.\n13. records\n13.1. Records kept may include those relating to quantities and\ngrade(s) of materials stored, bulk materials movements and\ncartage documentation, weigh tally sheets, equipment and\noperations log sheets, and stock checks.\n14. storage facility\n14.1. The storage facility covers all types of temporary and\npermanent storage.\n\n--- PDF PAGE 97 ---\nTR - Horticulture NC III\n\n- 93 -\nVARIABLE\nRANGE\n15. equipment that\nrequire checking\nand maintenance\n15.1. Equipment which includes mechanical units integral to bulk\nmaterials handling equipment, e.g., gear boxes, bearings and\noil levels.\n16. environmental\nimplications\n16.1. Negative environmental impacts may result from excessive\nnoise and exhaust emissions, the incorrect use and disposal\nof maintenance debris (oils containers, chemical residues),\ndust, and hazardous substances (e.g., fuel). Impacts may\nalso include run-off flows of water and cleaning agents from\nservicing, maintenance and cleaning activities.\n17. appropriate\ninformation\n17.1. Tools, spares and equipment usage, and maintenance and\nservicing details.\n18. documented\ninformation\n18.1. Record keeping systems used may be either paper-based or\ndigital, and information will be recorded into logbooks or other\nrecords.\n\n--- PDF PAGE 98 ---\nTR - Horticulture NC III\n\n- 94 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nhandled bulk materials in the storage area\n1.2.\nminimized contaminants and pests\n1.3.\nmoved bulk materials efficiently\nThe skills and knowledge required to handle bulk materials in a\nstorage area must be transferable to a different work environment.\nFor example, across a range of pest and contaminant types that may\noccur in differing geographic locations or with different bulk\nmaterials.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nthe client’s sampling and classification requirements\n2.2.\nbulk materials types and characteristics\n2.3.\ncommon bulk materials pests sand problems\n2.4.\nappropriate legislative requirements, manufacturers\ninstructions and enterprise procedures/instructions\n2.5.\nappropriate action in contingency situations\n2.6.\nsilo operations and configuration, machinery and operating\npractices\n2.7.\norganization requirements for protective equipment and safe\npractices in relation to OHS\n2.8.\norganization and industry guidelines for segregation of bulk\nmaterials quality assurance principles\n2.9.\npre-operational and safety checks, servicing and maintenance\nprocedures for tools and equipment\n2.10. potential hazards associated with the operation of basic tools\nand equipment\n2.11. general machine maintenance procedures\n2.12. machinery operating principles and operating methods\n2.13. machinery storage and protection methods\n2.14. relevant Provincial/municipal legislation, regulations and\ncodes of practice with regard to workplace OHS, and the use\nand control of machinery and equipment\n2.15. environmental impacts associated with the operation of\nmachinery and equipment\n2.16. personal protective clothing and equipment and when and\nhow it should be used\n2.17. cleaning and storage of machinery, equipment and materials\n2.18. enterprise recording and reporting procedures.\n\n--- PDF PAGE 99 ---\nTR - Horticulture NC III\n\n- 95 -\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\nrecord bulk materials stocks and movements\n3.2.\nconduct silo readings\n3.3.\nidentify bulk materials pests and damage\n3.4.\nuse communication systems\n3.5.\nsample and conduct a simple analysis of bulk materials\n3.6.\ncheck equipment and storage facilities and identify current or\nimpending faults\n3.7.\nhandle and manoeuvre equipment\n3.8.\ntest bulk materials for moisture, contamination and quality\n3.9.\ncomplete pre-operational checks on basic tools and\nequipment\n3.10. perform routine safety, service and maintenance procedures\non tools, equipment and machinery\n3.11. operate hand and independently powered tools and cleaning\nequipment to industry standards\n3.12. clean, secure and store machinery and equipment\n3.13. handle hazardous substances (fuels) safely\n3.14. read and interpret manufacturers specifications, work and\nmaintenance plans, and Material Safety Data Sheets\n3.15. interpret and apply task instructions, communicate with work\nteam and supervisor, and record and report faults, workplace\nhazards and accidents\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with bulk handling facilities for example for storing\nfeeds, harvested crop or fertilizers\n4.2.\nworkplace information relating to quality assurance, bulk\nhandling and storage.\n4.3.\nenterprise procedures relating to load shifting, and storage.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nchecking supporting workplace records.\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 100 ---\nTR - Horticulture NC III\n\n- 96 -\nUNIT OF COMPETENCY :\nPREPARE GRAIN STORAGES\nUNIT CODE\n:"
