        "source_text": "AGR611314\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to prepare and\napply chemicals for the control of weeds, pests and diseases. It\nrequires knowledge of the chemicals related to the workplace, the\nhazards and risks involved in their use, and the specific safety\nprocedures prescribed for working unsupervised within\norganizational guidelines. It requires the ability to handle and apply\nchemicals ensuring minimum risk to self, others and environment\nand accurately record their use.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Determine the need\nfor chemical use\n1.1 Nature and level of the pest, weed infestation or disease is\nidentified.\n1.2 Need for action is assessed.\n1.3 Assess the requirement for chemical use as an option within\nan integrated pest management strategy.\n1.4 Hazard and risk analysis of different chemical options is\nundertaken.\n1.5\nRequirement for chemical application including coverage by\nappropriate insurance is identified and confirmed.\n2 Prepare appropriate\nchemical\n2.1\nChemical label and Material Safety Data Sheets (MSDS) are\nread and understood.\n2.2\nLabels are checked to ensure chemicals meet user\nrequirements and specifications.\n2.3\nChemicals are prepared from those registered for the intended\npurpose, and to suit the organization’s chemical use strategy.\n2.4\nLegislation and regulations concerning chemical use are\nidentified and followed.\n2.5\nOccupational Health and Safety (OHS) hazards and risks\nand risk control requirements associated with use of the\nchemical are identified.\n3 Prepare to use\nchemicals according\nto the label and\nMSDS\n3.1\nPersonal protective equipment is selected and checked for\nuse according to the product label and MSDS.\n3.2\nRequirements for pre and post-operative checks on\nequipment are followed.\n3.3\nDamage, wear or malfunctions of any equipment is identified\nand reported or repaired.\n3.4\nRequirements for the selection, preparation and adjustment of\napplication equipment and tools for the appropriate\nchemicals are followed.\n3.5\nMixing rates are defined and calculated.\n3.6\nDirections, standards and legislative requirements for mixing\nchemicals are followed.\n\n--- PDF PAGE 57 ---\nTR - Horticulture NC III\n\n- 53 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4 Apply chemicals\n4.1\nMeteorological conditions and forecasts are assessed prior\nto and during application.\n4.2\nHazards of particular chemicals are identified.\n4.3\nRisks to others and the environment are assessed and\ncontrolled.\n4.4\nApplication equipment calibration procedures are followed.\n4.5\nProcedures and precautions for the use of the chemicals are\ninterpreted from labels and accreditation requirements.\n4.6\nRequirements for chemical handling and application are\ndetermined from directions, standards and legislative\nrequirements.\n4.7\nChemicals are applied safely and effectively according to\ndirections.\n4.8\nChemical spills or accident procedures are followed.\n4.9\nFirst aid equipment is made available on site.\n5 Clean up following\nchemical application\n5.1\nTools or equipment required to clean up chemicals are\nselected.\n5.2\nRequirements for cleaning equipment and sites are defined\nand followed according to directions and standards.\n5.3\nRequirements for disposing of unused chemicals, empty\ncontainers or spilled material are defined from directions and\nstandards.\n5.4\nProcedures for reporting chemical spills are followed.\n6 Record application\ndetails\n6.1\nApplication of chemicals is recorded according to\norganization procedures, label directions and legislation.\n6.2\nDetails of the specific chemical concerned are recorded\ncorrectly in the chemical inventory according to regulations.\n6.3\nInventory of personal protective equipment and application\nequipment is recorded.\n6.4\nProcedures and requirements for reporting application details\nto senior management or client are followed.\n6.5\nRecords of injury or poisoning associated with application of\nchemical are made and provided to the appropriate person.\n\n--- PDF PAGE 58 ---\nTR - Horticulture NC III\n\n- 54 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. chemicals\n\n1.1.\nChemicals may include insecticides, fungicides, herbicides,\nbactericides, algaecides, bio-agents, nematacides,\nrodenticides, antimicrobial agents, anthelmintics, hormone\ngrowth promotants or a range of veterinary chemicals used to\ntreat animals for disease.\n2. legislation and\nregulations\n2.1.\nLegislation may include Pesticides Acts, Occupational Health\nand Safety Acts and associated Hazardous Substances\nRegulations/ Codes of Practice, Dangerous Goods Acts,\nPoisons Act or Protection of the Environment Acts.\n3. OHS hazards and\nrisks\n3.1.\nOHS hazards include exposure of the operators and others in\nthe workplace to the absorption of chemicals through the skin\nand by inhalation and ingestion. Risks may include acute\npoisoning, chronic or long-term health effects, and lack of\nappropriate insurance coverage.\n4. OHS risk control\nrequirements\n4.1.\nOHS risk control measures may include safe application\ntechniques, use and maintenance of personal protective\nequipment, safe wash down procedures, safe procedures for\ncontainer rinsing and management.\n5. personal\nprotective\nequipment\n5.1.\nPersonal equipment may include boots, chemical resistant\ngloves, aprons, face shields, respirators or hats and protective\nclothing.\n6. pre and post\noperational\nchecks\n6.1.\nChecks may be made to weather conditions (e.g., wind),\nnozzles, hoses, regulators/gauges, respirator cartridges,\ndrench and protective clothing and equipment.\n7. application\nequipment\n7.1.\nInclude knapsacks or hand held pneumatic sprayers, drench\nguns, spot on applicators, CDA and air assisted units, self-\npropelled sprayers, controllers or power operated equipment\nlike boomsprays, pressure wands, jetting race, shower/plunge\ndips, hand jetting or air blast sprayer.\n8. directions and\nstandards\n8.1.\nMay include the instructions on the chemicals label, in an\noperator’s manual, on a MSDS, in an industry standard, or\nfrom Codes of Practice and advisory material explaining\nlegislation relevant to chemical use.\n9. hazards\n9.1.\nHazards will be listed on labels and the MSDS for the\nchemical concerned and may include flammability, toxicity,\nhealth hazards, damage to non-target organisms, uneven\nsurfaces, trip points, solar radiation, manual handling, faulty\nequipment, environmental damage or residues in foods.\n10. risks\n10.1. Risks that may be assessed include spillage, contact of\nchemical with skin or eyes, accidental ingestion, incorrect\nconcentrations in mixtures, faulty or inappropriate storage\ncontainers, incorrectly calibrated equipment, spray drift,\ncontamination of waterways, incorrect disposal of unused\nchemicals or faulty equipment\n11. meteorological\nconditions\n11.1. Rain, wind, temperature, relative humidity, inversion or stable\nair conditions.\n\n--- PDF PAGE 59 ---\nTR - Horticulture NC III\n\n- 55 -\nVARIABLE\nRANGE\n12. tools and\nequipment\n12.1. Include washing soda, chlorine, containers for disposal of\nchemicals, non-flammable absorbent materials and shovels,\nbooms, sausages and sandbags.\n13. organizational\nprocedures\n13.1. Written journal or computer record may be used for recording.\n14. appropriate\nperson\n14.1. Include relevant authorities, supervisor, manager, business\nowner or colleague.\n\n--- PDF PAGE 60 ---\nTR - Horticulture NC III\n\n- 56 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nPrepared the correct chemical for the problem unsupervised\n1.2.\nApplied the chemical according to safe work practice and\nlegislation and ensure minimal effects on the environment and\nothers\nThe skills and knowledge required to prepare and apply chemicals\nmust be transferable to a different work environment. For example,\nthis could include different chemicals, application methods and\nworkplaces.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below.\n2.1.\nChemical free options for pest control.\n2.2.\nUse, maintenance and storage of equipment to prepare and\napply chemicals.\n2.3.\nOHS issues, legislative requirements and Codes of Practice\nrelevant to chemical use and hazardous substances.\n2.4.\nUse, maintenance and storage of personal protective\nequipment, including how, when and why it should be used.\n2.5.\nLicensing requirements (e.g licensed Pesticide Applicator,\nlicensed Fumigator) and relevant government authorities.\n2.6.\nModes of chemical absorption and paths of entry associated\nwith risks to bystanders/public and applicators.\n2.7.\nEnvironmental effects of chemicals.\n2.8.\nDrift management.\n2.9.\nCalibration and adjustments.\n2.10. Integrated Pest Management and Integrated Resistance\nManagement principles.\n2.11. Cost effective use of chemicals.\n2.12. Hazard identification, assessment and control, and emergency\nresponse.\n2.13. Correct wearing/fit of personal protective equipment.\n2.14. Read and follow the label instructions.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate orally and in writing.\n3.2.\nread and interpret labels.\n3.3.\nmeasure quantities, application rates and calibrate equipment.\n3.4.\nreport on and record activities.\n3.5.\nuse safe and environmentally responsible work practices.\n\n--- PDF PAGE 61 ---\nTR - Horticulture NC III\n\n- 57 -\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace\n4.2.\nworkplace equipment and storage facilities for chemical\nmixing and application\n4.3.\nenterprise procedures relating to chemical use.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 62 ---\nTR - Horticulture NC III\n\n- 58 -\nUNIT OF COMPETENCY :\nESTABLISH HORTICULTURAL CROPS\nUNIT CODE\n:"
