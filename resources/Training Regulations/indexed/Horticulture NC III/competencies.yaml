        "descriptor": "This unit covers the skills and knowledge required This competency\nstandard covers the process of receiving, moving and sampling bulk\nmaterials in a storage area. It includes the use of safety equipment\nand procedures, and the repair of the facility and equipment used to\nstore the bulk materials. Bulk materials are handled to industry\nstandards in relation to segregation and storage conditions ensuring\nminimum loss or damage and optimum returns. The handling of\nbulk materials in storage areas is likely to be carried out under\nlimited supervision. Overall progress may be checked periodically.\nThe handling of bulk materials in storage areas will usually follow\nset routines, methods and procedures.",
