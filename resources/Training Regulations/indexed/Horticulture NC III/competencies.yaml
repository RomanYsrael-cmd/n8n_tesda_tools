        "source_text": "AGR611333\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to install\npressurised irrigation systems. It requires the ability to organize\nresources for installation work, set out and prepare site, install\nirrigation components, complete installation work, commission\nirrigation systems and communicate with work team members,\nsupervisors, contractors and consultants. Installing irrigation\nsystems requires knowledge of methods and techniques of\nirrigation, components of an irrigation system, behaviour of water on\nvarying terrain and soil types, soil water retention testing techniques\nand soil characteristics, and enterprise OHS procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Organize resources\nfor installation work\n1.1\nMaterials, tools, equipment and machinery are selected\naccording to the irrigation system design requirements and\nenterprise work procedures.\n1.2\nThe construction site for the irrigation system and\nconstruction method is identified according to the site and\nirrigation system plans and enterprise work procedures.\n1.3\nParts and equipment delivered to site are checked according\nto system drawings and specifications.\n1.4\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and enterprise work procedures.\n1.5\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.6\nSuitable safety and personal protective equipment (PPE)\nare selected, used and maintained.\n1.7\nWater supply is checked to ensure that it is compatible with\nsystem specifications.\n2. Set out and prepare\nsite\n2.1\nMeasurement and marking out of irrigation lines are consistent\nwith the plan.\n2.2\nTrenches where constructed are at the specified depth without\ndamage to services, facilities, features and established plants.\n2.3\nEquipment operation and work practices conform to enterprise\nand legislative OHS requirements.\n2.4\nRegulations and legislation relevant to the situation are\nobserved.\n2.5\nWork practices reflect sustainable horticulture principles and\nrespond to local community requirements.\n\n--- PDF PAGE 124 ---\nTR - Horticulture NC III\n\n- 120 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Install irrigation\ncomponents\n3.1\nPlan is interpreted and where applicable, contractors are\nsupervised and work is monitored to conform to the plan.\n3.2\nComponents are assembled and connected according to the\nplan, joints are completed and tested according to\nmanufacturers specifications.\n3.3\nFittings and valves are fitted and adjusted to the requirements\nof the installation plan, and all joints are secured according to\nenterprise guidelines.\n3.4\nA clean and safe work area is maintained while installation\nwork is carried out.\n3.5\nTools appropriate to the task being undertaken are chosen\nand used according to guidelines and safe working practices\nare employed.\n4. Complete installation\nwork\n4.1\nEarthworks are finished off to plan specifications and\nenterprise work procedures.\n4.2\nThe system configuration and capacity matches the\ninstallation plan.\n4.3\nThe site is restored and waste material is removed from the\nsite and disposed of in an environmentally aware and safe\nmanner according to enterprise work procedures.\n4.4\nTools, equipment and machinery are cleaned, maintained and\nstored according to enterprise work procedures\n5. Commission\nirrigation system\n5.1\nStart-up sequence is in accordance with operations manual.\n5.2\nSystem is flushed as required.\n5.3\nOperating faults are identified and corrective actions taken\naccording to the operations manual.\n5.4\nTesting and monitoring equipment are calibrated to\nmanufacturers specifications.\n5.5\nWork outcomes are recorded or reported to the supervisor\naccording to enterprise work procedures.\n\n--- PDF PAGE 125 ---\nTR - Horticulture NC III\n\n- 121 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. materials\n1.1.\nMaterials may include irrigation system components, glues,\nwelds, and construction and backfill materials.\n2. tools, equipment\nand machinery\n2.1.\nTools, equipment and machinery may include surveying and\nlevelling equipment such as automatic level, laser level,\ndumpy level, Cowley level, staff, boning rods, pegs, notebook,\npencil and calculator; hand tools such as rakes, shovels,\nspades, rollers, wheelbarrows, hoses and hose fittings;\nmachinery such as bobcats, ditch witches, backhoes, front-\nend loaders, graders, mechanical rollers, trucks, hydraulic\ntrailers, and tractors and 3-point linkage equipment, pumps\nand pump fittings, and fitting and welding tools appropriate to\nthe irrigation system.\n3. irrigation systems\n3.1.\nIrrigation systems may include mains pressure, low pressure,\nbelow ground, above ground, spray systems, dripper, and\ncapillary systems.\n4. enterprise work\nprocedures\n4.1.\nWork procedures may include supervisors oral or written\ninstructions, installation program, enterprise standard\noperating procedures (SOPs), specifications, routine\nmaintenance schedules, work notes, product labels and\nMaterial Safety Data Sheets (MSDS), manufacturers service\nspecifications and operators manuals, waste disposal,\nrecycling and re-use guidelines, and OHS procedures.\n5. irrigation\nequipment\n5.1.\nIrrigation equipment may include pumps, motors, delivery\nequipment, sprays, system controllers, injectors, tensiometers,\nprobe tubes, flow meter, pressure gauge, computer and/or\nother scheduling devices, recycling equipment, and spray\nequipment.\n6. OHS hazards\n6.1.\nHazards may include disturbance or interruption of services,\nsolar radiation, dust, noise, soil and waterborne micro-\norganisms, chemicals and hazardous substances, manual\nhandling, moving vehicles, machinery and machinery parts,\nuneven surfaces and flying and falling objects.\n7. safety equipment\n7.1.\nSafety equipment may include signage and barriers.\n8. PPE\n8.1.\nPPE may include hat, boots, overalls, gloves, goggles,\nrespirator or face mask, face guard, hearing protection,\nsunscreen lotion and hard hat.\n9. water supplies\n9.1.\nWater supplies may be underground, mains or surface\nstorage including fixtures such as dams, bores, windmills,\ntanks, and channels.\n\n--- PDF PAGE 126 ---\nTR - Horticulture NC III\n\n- 122 -\nVARIABLE\nRANGE\n10. OHS requirements\n10.1. OHS requirements may include identifying hazards, assessing\nrisks and implementing controls, cleaning, maintaining and\nstoring tools, equipment and machinery; appropriate use of\nPPE including sun protection, safe operation of tools,\nequipment and machinery, safe handling, use and storage of\nchemicals and hazardous substances, correct manual\nhandling, basic first aid, personal hygiene and reporting\nproblems to supervisors.\n11. clean and safe\nwork area\n11.1. Tasks may include disabling unused tools, equipment and\nmachinery and storing neatly out of the way of installation\nactivities, safely storing materials on site, using signage and\nsafety barriers during and removing after construction\nactivities are completed, and swiftly and efficiently removing\nand processing debris and waste from the work area.\n12. waste material\n12.1. Waste material may include unused construction and\nexcavated materials, and plant debris, litter and broken\ncomponents.\n12.2. Plant-based material may be mulched or composted, plastic,\nmetal, paper-based materials may be recycled, re-used,\nreturned to the manufacturer or disposed of according to\nenterprise work procedures.\n12.3. Waste may be removed to designated areas for recycling,\nreuse, return to the manufacturer or disposal.\n13. testing equipment\n13.1. Testing equipment may include pressure gauges and flow\nmeters.\n\n--- PDF PAGE 127 ---\nTR - Horticulture NC III\n\n- 123 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nPrepared for installation, set out the installation works,\ninstalled and tested the irrigation system and cleaned- up the\nsite\nThe skills and knowledge required to install an irrigation system must\nbe transferable to a different work environment. For example, this\ncould include different types of irrigation systems and components,\nwater supplies, soil types and enterprises.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nmethods and techniques of irrigation\n2.2.\ncomponents of an irrigation system\n2.3.\ncharacteristics and operation of joints, valves and sprinkler\ncomponents\n2.4.\noperation of pumps and water flow rates\n2.5.\nbehaviour of water on varying terrain and soil types\n2.6.\nsoil water retention testing techniques\n2.7.\nwater quality and water filtration techniques\n2.8.\ncalculations for installing irrigation systems\n2.9.\nsoil characteristics\n2.10. enterprise OHS procedures.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\norganize resources for installation work\n3.2.\nset-out and prepare site\n3.3.\ninstall irrigation components\n3.4.\ncomplete installation work\n3.5.\ncommission irrigation system\n3.6.\ncommunicate with work team members, supervisors,\ncontractors and consultants\n3.7.\nimplement and follow relevant enterprise OHS and\nenvironmental policies and procedures.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace site onto which to install irrigation system\n4.2.\ntools, equipment and materials used in installing irrigation\n4.3.\nirrigation design plan\n4.4.\nenterprise procedures relating to irrigation installations and\nsite work.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nchecking workplace records and production plans (portfolio)\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 128 ---\nTR - Horticulture NC III\n\n- 124 -"
