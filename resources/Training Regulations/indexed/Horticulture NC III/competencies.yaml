        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nPrepared for installation, set out the installation works,\ninstalled and tested the irrigation system and cleaned- up the\nsite\nThe skills and knowledge required to install an irrigation system must\nbe transferable to a different work environment. For example, this\ncould include different types of irrigation systems and components,\nwater supplies, soil types and enterprises.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nmethods and techniques of irrigation\n2.2.\ncomponents of an irrigation system\n2.3.\ncharacteristics and operation of joints, valves and sprinkler\ncomponents\n2.4.\noperation of pumps and water flow rates\n2.5.\nbehaviour of water on varying terrain and soil types\n2.6.\nsoil water retention testing techniques\n2.7.\nwater quality and water filtration techniques\n2.8.\ncalculations for installing irrigation systems\n2.9.\nsoil characteristics\n2.10. enterprise OHS procedures.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\norganize resources for installation work\n3.2.\nset-out and prepare site\n3.3.\ninstall irrigation components\n3.4.\ncomplete installation work\n3.5.\ncommission irrigation system\n3.6.\ncommunicate with work team members, supervisors,\ncontractors and consultants\n3.7.\nimplement and follow relevant enterprise OHS and\nenvironmental policies and procedures.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace site onto which to install irrigation system\n4.2.\ntools, equipment and materials used in installing irrigation\n4.3.\nirrigation design plan\n4.4.\nenterprise procedures relating to irrigation installations and\nsite work.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nchecking workplace records and production plans (portfolio)\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 128 ---\nTR - Horticulture NC III\n\n- 124 -"
