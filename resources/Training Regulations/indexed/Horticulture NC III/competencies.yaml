  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in HORTICULTURE NC III\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\n\\UNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to lead\nin the dissemination and discussion of ideas, information and issues\nin the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1\nAppropriate communication method is selected\n1.2\nMultiple operations involving several topics areas are\ncommunicated accordingly\n1.3\nQuestions are used to gain extra information\n1.4\nCorrect sources of information are identified\n1.5\nInformation is selected and organized correctly\n1.6\nVerbal and written reporting is undertaken when required\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1\nResponse to workplace issues are sought\n2.2\nResponse to workplace issues are provided immediately\n2.3\nConstructive contributions are made to workplace discussions\non such issues as production, quality and safety\n2.4\nGoals/objectives and action plan undertaken in the workplace\nare communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1\nIssues and problems are identified as they arise\n3.2\nInformation regarding problems and issues are organized\ncoherently to ensure clear and effective communication\n3.3\nDialogue is initiated with appropriate personnel\n3.4\nCommunication problems and issues are raised as they arise\n\n--- PDF PAGE 7 ---\nTR - Horticulture NC III\n\n- 3 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3\nFace to face\n1.4\nTwo-way radio\n1.5\nSpeaking to groups\n1.6\nUsing telephone\n1.7\nWritten\n1.8\nInternet\n\n--- PDF PAGE 8 ---\nTR - Horticulture NC III\n\n- 4 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning Skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of written\nand electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 9 ---\nTR - Horticulture NC III\n\n- 5 -\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\nUNIT CODE\n:\n500311110\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead small\nteams including setting and maintaining team and individual\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to team\nmembers\n1.2\nReasons for instructions and requirements are communicated\nto team members\n1.3\nTeam members’ queries and concerns are recognized,\ndiscussed and dealt with\n2. Assign\nresponsibilities\n2.1\nDuties, and responsibilities are allocated having regard to the\nskills, knowledge and aptitude required to properly undertake\nthe assigned task and according to company policy\n2.2\nDuties are allocated having regard to individual preference,\ndomestic and personal considerations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on client\nneeds and according to assignment requirements\n3.2\nPerformance expectations are based on individual team\nmembers duties and area of responsibility\n3.3\nPerformance expectations are discussed and disseminated to\nindividual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against defined\nperformance criteria and/or assignment instructions and\ncorrective action taken if required\n4.2\nTeam members are provided with feedback, positive support\nand advice on strategies to overcome any deficiencies\n4.3\nPerformance issues which cannot be rectified or addressed\nwithin the team are referenced to appropriate personnel\naccording to employer policy\n4.4\nTeam members are kept informed of any changes in the\npriority allocated to assignments or tasks which might impact\non client/customer needs and satisfaction\n4.5\nTeam operations are monitored to ensure that employer/client\nneeds and requirements are met\n4.6\nFollow-up communication is provided on all issues affecting\nthe team\n4.7\nAll relevant documentation is completed in accordance with\ncompany procedures\n\n--- PDF PAGE 10 ---\nTR - Horticulture NC III\n\n- 6 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s\nconcerns\n2.1\nRoster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 11 ---\nTR - Horticulture NC III\n\n- 7 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2\nAssessed and monitored team and individual performance\nagainst set criteria\n1.3\nRepresented concerns of a team and individual to next level of\nmanagement or appropriate specialist and to negotiate on\ntheir behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5\nSet and communicated performance expectations for a range\nof tasks and duties within the team and provided feedback to\nteam members\n2. Underpinning\nKnowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning Skills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counselling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual member\nin relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nAssessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 12 ---\nTR - Horticulture NC III\n\n- 8 -\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\nUNIT CODE\n:\n500311111\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome and\nparticipate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\nInformation on preparing for negotiation is identified and\nincluded in the plan\n1.2\nInformation on creating non verbal environments for positive\nnegotiating is identified and included in the plan\n1.3\nInformation on active listening is identified and included in\nthe plan\n1.4\nInformation on different questioning techniques is identified\nand included in the plan\n1.5\nInformation is checked to ensure it is correct and up-to- date\n2. Participate in\nnegotiations\n2.1\nCriteria for successful outcome are agreed upon by all parties\n2.2\nDesired outcome of all parties are considered\n2.3\nAppropriate language is used throughout the negotiation\n2.4\nA variety of questioning techniques are used\n2.5\nThe issues and processes are documented and agreed upon\nby all parties\n2.6\nPossible solutions are discussed and their viability assessed\n2.7\nAreas for agreement are confirmed and recorded\n2.8\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 13 ---\nTR - Horticulture NC III\n\n- 9 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\nBackground information on other parties to the negotiation\n1.2\nGood understanding of topic to be negotiated\n1.3\nClear understanding of desired outcome/s\n1.4\nPersonal attributes\n1.4.1. self awareness\n1.4.2. self esteem\n1.4.3. objectivity\n1.4.4. empathy\n1.4.5. respect for others\n1.5\nInterpersonal skills\n1.5.1. listening/reflecting\n1.5.2. non verbal communication\n1.5.3. assertiveness\n1.5.4. behavior labeling\n1.5.5. testing understanding\n1.5.6. seeking information\n1.5.7. self disclosing\n1.6\nAnalytic skills\n1.6.1. observing differences between content and process\n1.6.2. identifying bargaining information\n1.6.3. applying strategies to manage process\n1.6.4. applying steps in negotiating process\n1.6.5. strategies to manage conflict\n1.6.6. steps in negotiating process\n1.6.7. options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\nFriendly reception\n2.2\nWarm and welcoming room\n2.3\nRefreshments offered\n2.4\nLead in conversation before negotiation begins\n3. Active listening\n3.1\nAttentive\n3.2\nDon’t interrupt\n3.3\nGood posture\n3.4\nMaintain eye contact\n3.5\nReflective listening\n4. Questioning\ntechniques\n4.1\nDirect\n4.2\nIndirect\n4.3\nOpen-ended\n\n--- PDF PAGE 14 ---\nTR - Horticulture NC III\n\n- 10 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2\nParticipated in negotiation with at least one person to achieve\nan agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCodes of practice and guidelines for the organization\n2.2\nOrganizations policy and procedures for negotiations\n2.3\nDecision making and conflict resolution strategies procedures\n2.4\nProblem solving strategies on how to deal with unexpected\nquestions and attitudes during negotiation\n2.5\nFlexibility\n2.6\nEmpathy\n3. Underpinning Skills\n3.1\nInterpersonal skills to develop rapport with other parties\n3.2\nCommunication skills (verbal and listening)\n3.3\nObservation skills\n3.4\nNegotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nRoom with facilities necessary for the negotiation process\n4.2\nHuman resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation/demonstration and questioning\n5.2\nPortfolio assessment\n5.3\nOral and written questioning\n5.4\nThird party report\n6. Context of\nAssessment\n6.1\nCompetency to be assessed in real work environment or in a\nsimulated workplace setting.\n\n--- PDF PAGE 15 ---\nTR - Horticulture NC III\n\n- 11 -\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required to\nsolve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the root\ncause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1\nVariances are identified from normal operating parameters;\nand product quality\n1.2\nExtent, cause and nature are of the problem are defined\nthrough observation, investigation and analytical techniques\n1.3\nProblems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1\nPossible causes are identified based on experience and the\nuse of problem solving tools / analytical techniques.\n2.2\nPossible cause statements are developed based on findings\n2.3\nFundamental causes are identified per results of investigation\nconducted\n3. Determine corrective\naction\n3.1\nAll possible options are considered for resolution of the\nproblem\n3.2\nStrengths and weaknesses of possible options are considered\n3.3\nCorrective actions are determined to resolve the problem and\npossible future causes\n3.4\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in accordance with\nsafety and operating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations are prepared\n4.2\nRecommendations are presented to appropriate personnel.\n4.3\nRecommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\nTR - Horticulture NC III\n\n- 12 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGANNT chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n\n2.1\nNon-routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCoordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8. Environmental requirements\n\n--- PDF PAGE 17 ---\nTR - Horticulture NC III\n\n- 13 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios /\ncase studies / what ifs as a stimulus with a walk through forming part\nof the response. These assessment activities should include a range\nof problems, including new, unusual and improbable situations that\nmay have happened.\n2. Underpinning\nKnowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating parameters,\nand product quality to recognize non-standard situations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1. Relevant equipment and operational processes\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental requirement\n2.2.4. Principles of decision making strategies and techniques\n2.2.5. Enterprise information systems and data collation\n2.2.6. Industry codes and standards\n3. Underpinning Skills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n4. Resource\nImplications\n4.1\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well\nas bank of questions which will be used to probe the reason\nbehind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nCase studies on solving problems in the workplace\n5.2\nObservation\nThe unit will be assessed in a holistic manner as is practical and may\nbe integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations, which\nwill include disruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual workplace\nand will include walk through of the relevant competency\ncomponents.\n6. Context of\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 18 ---\nTR - Horticulture NC III\n\n- 14 -\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\nUNIT CODE\n:\n500311113\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required in the\napplication of mathematical concepts and techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nmathematical tools\nand techniques to\nsolve problem\n1.1\nProblem areas are identified based on given condition\n1.2\nMathematical techniques are selected based on the given\nproblem\n2. Apply mathematical\nprocedure/solution\n2.1\nMathematical techniques are applied based on the problem\nidentified\n2.2\nMathematical computations are performed to the level of\naccuracy required for the problem\n2.3\nResults of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1\nResult of application is reviewed based on expected and\nrequired specifications and outcome\n3.2\nAppropriate action is applied in case of error\n\n--- PDF PAGE 19 ---\nTR - Horticulture NC III\n\n- 15 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1\nFour fundamental operations\n Measurements\n1.2\nUse/Conversion of units of measurements\n1.3\nUse of standard formulas\n2. Appropriate action\n2.1\nReview in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2\nReport error to immediate superior for proper action\n\n--- PDF PAGE 20 ---\nTR - Horticulture NC III\n\n- 16 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Underpinning\nKnowledge\n2.1\nFundamental operation (addition, subtraction, division,\nmultiplication)\n2.2\nMeasurement system\n2.3\nPrecision and accuracy\n2.4\nBasic measuring tools/devices\n3. Underpinning Skills\n3.1\nApplying mathematical computations\n3.2\nUsing calculator\n3.3\nUsing different measuring tools\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nCalculator\n4.2\nBasic measuring tools\n4.3\nCase Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nAuthenticated portfolio\n5.2\nWritten Test\n5.3\nInterview/Oral Questioning\n5.4\nDemonstration\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 21 ---\nTR - Horticulture NC III\n\n- 17 -\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\nUNIT CODE\n:\n500311114\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills, and attitude\nrequired in selecting, sourcing and applying appropriate and\naffordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study/select\nappropriate\ntechnology\n 1.1\nUsage of different technologies is determined based on job\nrequirements\n1.2.\nAppropriate technology is selected as per work specification\n2. Apply relevant\ntechnology\n\n 2.1\nRelevant technology is effectively used in carrying out\nfunction\n 2.2\nApplicable software and hardware are used as per task\nrequirement\n 2.3\nManagement concepts are observed and practiced as per\nestablished industry practices\n3. Maintain/enhance of\nrelevant technology\n3.1\nMaintenance of technology is applied in accordance with the\nindustry standard operating procedure, manufacturer’s\noperating guidelines and occupational health and safety\nprocedure to ensure its operative ability\n3.2\nUpdating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3\nTechnology failure/ defect is immediately reported to the\nconcern/responsible person or section for appropriate action\n\n--- PDF PAGE 22 ---\nTR - Horticulture NC III\n\n- 18 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1\nOffice technology\n1.2\nIndustrial technology\n1.3\nSystem technology\n1.4\nInformation technology\n1.5\nTraining technology\n2. Management\nconcepts\nMay include but not limited to:\n2.1\nReal Time Management\n2.2\nKAIZEN or continuous improvement\n2.3\n5S\n2.4\nTotal Quality Management\n2.5\nOther management/productivity tools\n3. Industry standard\noperating procedure\n3.1\nWritten guidelines relative to the usage of office\ntechnology/equipment\n3.2\nVerbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1\nWritten instruction/manuals of specific technology/ equipment\n4.2\nGeneral instruction manual\n4.3\nVerbal advise from manufacturer relative to the operation of\nequipment\n5. Occupational health\nand safety procedure\n5.1\nRelevant statutes on OHS\n5.2\nCompany guidelines in using technology/equipment\n6. Appropriate action\n6.1\nImplementing preventive maintenance schedule\n6.2\nCoordinating with manufacturer’s technician\n\n--- PDF PAGE 23 ---\nTR - Horticulture NC III\n\n- 19 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nStudied and selected appropriate technology consistent with\nwork requirements\n1.2\nApplied relevant technology\n1.3\nMaintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nKnowledge\n2.1\nAwareness on technology and its function\n2.2\nRepair and maintenance procedure\n2.3\nOperating instructions\n2.4\nApplicable software\n2.5\nCommunication techniques\n2.6\nHealth and safety procedure\n2.7\nCompany policy in relation to relevant technology\n2.8\nDifferent management concepts\n2.9\nTechnology adaptability\n3. Underpinning Skills\n3.1\nRelevant technology application/implementation\n3.2\nBasic communication skills\n3.3\nSoftware applications skills\n3.4\nBasic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\nRelevant technology\n4.2\nInterview and demonstration questionnaires\n4.3\nAssessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1\nInterview\n5.2\nActual demonstration\n5.3\nAuthenticated portfolio (related certificates of training/seminar)\n6. Context of\nAssessment\n6.1\nCompetency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 24 ---\nTR - Horticulture NC III\n\n- 20 -\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY MEASURES IN FARM OPERATIONS\nUNIT CODE\n:\nAGR321201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nperform safety measures effectively and efficiently. It includes\nidentifying areas, tools, materials, time and place in performing\nsafety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine areas of\nconcern for safety\nmeasures\n1.1\nWork tasks are identified in line with farm operations\n1.2\nPlace for safety measures are determined in line with farm\noperations\n1.3\nTime for safety measures are determined in line with farm\noperations\n1.4\nAppropriate tools, materials and outfits are prepared in line\nwith job requirements\n2. Apply appropriate\nsafety measures\n2.1\nTools and materials are used according to specifications and\nprocedures\n2.2\nOutfits are worn according to farm requirements\n2.3\nEffectivity/shelf life/expiration of materials are strictly observed\n2.4\nEmergency procedures are known and followed to ensure a\nsafework requirement\n2.5\nHazards in the workplace are identified and reported in line\nwith farm guidelines\n3. Safekeep/dispose\ntools, materials and\noutfit\n3.1\nUsed tools and outfit are cleaned after use and stored in\ndesignated areas\n3.2\nUnused materials are properly labeled and stored according\nto manufacturers recommendation and farm requirements\n3.3\nWaste materials are disposed according to manufacturers,\ngovernment and farm requirements\n\n--- PDF PAGE 25 ---\nTR - Horticulture NC III\n\n- 21 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nWork tasks\nWork task may be selected from any of the following sectors:\n1.1\nAquaculture\n1.2\nAnimal Production\n1.3\nCrop Production\n1.4\nPost-harvest\n1.5\nAgri-marketing\n1.6\nFarm Equipment\n2.\nPlace\n2.1\nAnimal pens, cages, barns\n2.2\nFish ponds, cages\n2.3\nStock room/storage areas/warehouse\n2.4\nField/farm/orchard\n3.\nTime\n3.1\nVaccination and medication period\n3.2\nFertilizer and pesticides application\n3.3\nFeed mixing and feeding\n3.4\nHarvesting and hauling\n3.5\nCleaning, sanitizing and disinfecting\n3.6\nDressing, butchering and castration\n4.\nTools, materials\nand outfits\n4.1\nTools\n4.1.1 Wrenches\n4.1.2 Screw driver\n4.1.3 Pliers\n4.2\nMaterials\n4.2.1 Bottles\n4.2.2 Plastic\n4.2.3 Bags\n4.2.4 Syringe\n4.3\nOutfit\n4.3.1 Masks\n4.3.2 Gloves\n4.3.3 Boots\n4.3.4 Overall coats\n4.3.5 Hat\n4.3.6\nEye goggles\n5. Emergency\nprocedures\n5.1\nLocation of first aid kit\n5.2\nEvacuation\n5.3\nAgencies contract\n5.4\nFarm emergency procedures\n6. Waste materials\n6.1\nAnimal manure\n6.2\nWaste water\n6.3\nSyringes\n6.4\nUnused farm chemicals e.g. pesticides, chemicals, fertilizers\n6.5\nExpired reagents\n6.6\nDead animals\n7. Hazards\n7.1\nChemical\n7.2\nElectrical\n7.3\nFalls\n\n--- PDF PAGE 26 ---\nTR - Horticulture NC III\n\n- 22 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined areas of concern for safety measures\n1.2\nApplied appropriate safety measures according to industry\nrequirements\n1.3\nPrepared tools, materials and outfit needed\n1.4\nPerformed proper disposal of used materials\n1.5\nSafekeep/cleaned tools, materials and outfit in designated\nfacilities\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1 Implementation of regulatory controls and policies\nrelative to treatment of area and application of\nchemicals\n2.1.2 Proper disposal of waste materials\n2.2\nCodes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health protection\n2.4\nMaintenance\n2.4.1 Regular check-up and repair of tools, materials and\noutfit before and after use\n3. Underpinning Skills\n3.1\nAbility to recognize effective tools, materials and outfit\n3.2\nReady skills required to read labels, manuals and other basic\nsafety information\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nThird Party Report\n5. Resource\nImplications\n5.1\nFarm location\n5.2\nTools, equipment and outfits appropriate in applying safety\nmeasures\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 27 ---\nTR - Horticulture NC III\n\n- 23 -\nUNIT OF COMPETENCY :\nUSE FARM TOOLS AND EQUIPMENT\nUNIT CODE\n:\nAGR321202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to use\nfarm tools and equipment. It includes selection, operation and\npreventive maintenance of farm tools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and use farm\ntools\n\n1.1\nIdentified appropriate farm tools according to requirement/use\n1.2\nFarm tools are checked for faults and defective tools reported\nin accordance with farm procedures\n1.3\nAppropriate tools and equipment are safely used according to\njob requirements and manufacturers conditions\n2. Select and operate\nfarm equipment\n2.1\nIdentify appropriate farm equipment\n2.2\nInstructional manual of the farm tools and equipment are\ncarefully read prior to operation\n2.3\nPre-operation check-up is conducted in line with\nmanufacturers manual\n2.4\nFaults in farm equipment are identified and reported in line\nwith farm procedures\n2.5\nFarm equipment used according to its function\n2.6\nFollowed safety procedures\n3. Perform preventive\nmaintenance\n3.1\nTools and equipment are cleaned immediately after use in line\nwith farm procedures\n3.2\nRoutine check-up and maintenance are performed\n3.3\nTools and equipment are stored in designated areas in line\nwith farm procedures\n\n--- PDF PAGE 28 ---\nTR - Horticulture NC III\n\n- 24 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\n\n1.1\nEngine\n1.2\nPumps\n1.3\nGenerators\n1.4\nSprayers\n2. Farm tools\n2.1\nSickle\n2.2\nCutters\n2.3\nWeighing scales\n2.4\nHand tools\n2.5\nMeasuring tools\n2.6\nGarden tools\n3. Pre-operation check-\nup\n3.1\nTires\n3.2\nBrake fluid\n3.3\nFuel\n3.4\nWater\n3.5\nOil\n3.6\nLubricants\n3.7\nBattery\n\n--- PDF PAGE 29 ---\nTR - Horticulture NC III\n\n- 25 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipment according to manual specification\n1.3\nPerformed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1 Ideal good work habits to demonstrate to workers easy\nand safety standards during operation of farm\nequipment\n2.2\nCodes and Regulations\n2.2.1 Environmental Compliance Certificate (ECG)\n2.2.2 Effective work supervision in the operations of farm\nequipment\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n2.4\nMaintenance\n2.4.1 Regular upkeep of equipments\n2.4.2 Preventive maintenance skills\n2.5\nValues\n2.5.1 Positive outlook towards work\n2.5.2 Possesses pre-emptive/anticipatory skills\n3. Underpinning Skills\n3.1\nAbility to recognized defective farm equipment\n3.2\nPerform proper management practices of safety measures\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nDirect observation\n4.2\nPractical demonstration\n4.3\nThird Party Report\n5. Resource\nImplications\n5.1\nService/operational manual of farm tools and equipment\n5.2\nTools and equipment\n5.3\nFarm implements\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 30 ---\nTR - Horticulture NC III\n\n- 26 -\nUNIT OF COMPETENCY :\nPERFORM ESTIMATION AND BASIC CALCULATION\nUNIT CODE\n:\nAGR321203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nperform basic workplace calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform estimation\n1.1\nJob requirements are identified from written or oral\ncommunications\n1.2\nQuantities of materials and resources required to complete a\nwork task are estimated\n1.3\nThe time needed to complete a work activity is estimated\n1.4\nAccurate estimate for work completion are made\n1.5\nEstimate of materials and resources are reported to\nappropriate person\n2. Perform basic\nworkplace calculation\n2.1\nCalculations to be made are identified according to job\nrequirements\n2.2\nCorrect method of calculation identified\n2.3\nSystem and units of measurement to be followed are\nascertained\n2.4\nCalculation needed to complete work tasks are performed\nusing the four basic process of addition, division, multiplication\nand subtraction\n2.5\nCalculate whole fraction, percentage and mixed when are\nused to complete the instructions\n2.6\nNumber computed in self checked and completed for\nalignment\n\n--- PDF PAGE 31 ---\nTR - Horticulture NC III\n\n- 27 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Calculation\n1.1\nQuantity of feeds\n1.2\nAmount of fertilizer\n1.3\nAmount of medicines\n2. Method of calculation\n\n2.1\nAddition\n2.2\nSubtraction\n2.3\nMultiplication\n2.4\nDivision\n2.5\nRatio and proportion\n3. System of\nmeasurement\n3.1\nEnglish\n3.2\nMetric\n4. Units of\nmeasurement\n4.1\nArea\n4.2\nVolume\n4.3\nWeight\n\n--- PDF PAGE 32 ---\nTR - Horticulture NC III\n\n- 28 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nMathematics\n2.1.1 Basic mathematical operations\n2.1.2 Percentage and ratios\n2.1.3 Unit Conversion\n2.1.4 Basic accounting principles and procedures\n2.1.4.1 Production cost\n2.1.4.2 Sales\n2.1.4.3 Accounts receivables/payables\n2.2\nSystems, Processes and Operations\n2.2.1 Knowledge in different management practices and\noperational procedures\n2.3\nValues\n2.3.1 Safety consciousness\n2.3.2 Time consciousness and management\n2.3.3 Cost consciousness\n2.3.4 Precision\n3. Underpinning Skills\n3.1\nAbility to perform basic calculation\n3.2\nCommunicate effectively\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nWritten examination\n5. Resource\nImplications\n5.1\nRelevant tools and equipment for basic calculation\n5.2\nRecommended data\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 33 ---\nTR - Horticulture NC III\n\n- 29 -\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPREPARE LAND FOR AGRICULTURAL CROP PRODUCTION\nUNIT CODE\n:\nAGR611310\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to prepare\nequipment, cultivate the site, apply any pre-planting treatments, and\ncare for the vehicles and equipment on completing the activity.\nEquipment and machinery may be animal-powered. It includes the\ncompletion of documentation and logbooks for the operation.\n\nPreparing land for crop production is likely to be carried out under\nlimited supervision from others with checking only related to overall\nprogress. Preparing land for crop production is usually done within\nestablished routines, methods and procedures. Some discretion\nand judgement is required in the selection of equipment and\nmaterials, organization of work and services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Prepare for\ncultivation\n1.1\nRequirements for the work to be undertaken are interpreted\nfrom the planting plan and confirmed with the manager.\n1.2\nThe method and order of cultivation is identified and\ninterpreted from the planting plan.\n1.3\nOHS hazards are identified, risks assessed and suitable\ncontrols are implemented.\n1.4\nSuitable personal protective equipment is selected, used\nand maintained.\n1.5\nThe environmental implications of cultivating the site are\nidentified, likely outcomes assessed and, if necessary,\nresponsible action is taken.\n2 Prepare the\ncultivating equipment\n2.1\nThe vehicles and equipment required for site cultivation are\nselected according to the planting plan and organization\nguidelines.\n2.2\nThe vehicles and equipment are serviced, adjusted for the\nconditions and worn parts are replaced to ensure reliability\nduring cultivation.\n2.3\nAll containers, leftover fluids, waste and debris from the\nmaintenance and servicing work are disposed of safely and\nappropriately.\n2.4\nAll maintenance and servicing is documented according to\nthe requirements of the organization’s record keeping system.\n\n--- PDF PAGE 34 ---\nTR - Horticulture NC III\n\n- 30 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3 Cultivate soil\n3.1\nPrevious crop or land clearance debris is removed,\nincorporated or burnt according to the organizations\nguidelines.\n3.2\nThe cultivation plan is followed and completed for each site.\n3.3\nOHS hazards are identified, risks assessed and suitable\ncontrols are implemented.\n3.4\nSuitable personal protective equipment is selected, used and\nmaintained.\n3.5\nVehicles and equipment are operated in a safe, effective and\nefficient manner and at speeds to suit the conditions.\n3.6\nThe quality of cultivation is maximized by continually checking\nand adjusting the vehicles and equipment as necessary.\n3.7\nAll time, resource and quality requirements of the planting\nplan are met.\n4 Prepare site for\nplanting\n4.1\nThe planting layout and soil profiles are completed as\nrequired by the planting plan.\n4.2\nWeed and pest control measures are taken as required by\nthe planting plan.\n4.3\nFertilizers, ameliorants, and/or other pre-planting treatments\nare applied as required by the planting plan\n4.4\nThe environmental implications of site preparation are\nidentified, likely outcomes assessed and, if necessary,\nresponsible action is taken.\n5 Complete land\npreparation\noperations\n5.1\nEquipment is cleaned in accordance with manufacturers\nspecifications, organizational procedures and regulations.\n5.2\nVehicles and equipment are cleaned and stored to minimize\ndamage according to manufacturers specifications,\norganizational procedures and regulations.\n5.3\nAll containers, leftover fluids, waste and debris from the\ncleaning and maintenance work are disposed of safely and\nappropriately.\n5.4\nAll required records and documentation are completed\naccurately and promptly according to organizational\nrequirements.\n\n--- PDF PAGE 35 ---\nTR - Horticulture NC III\n\n- 31 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. planting plan\nAny crop grown by the organization for production or pasture.\n1.1.\nCereals\n1.2.\nLegumes\n1.3.\nPulses\n1.4.\nOilseeds\n1.5.\npasture seeds\n1.6.\ncotton\n1.7.\nsugar cane.\n2. Occupational\nHealth and Safety\n(OHS)\nThe range of actions are both systemic and at an operational level.\nThese are listed below:\n2.1.\nSystems should be in place to ensure the safe operation and\nmaintenance of machinery and equipment. Precautions\nshould also be in place to minimize exposure to noise and\norganic and other dusts, and to external elements, including\nsolar radiation. Systems and procedures for preparing sites\nfor planting, as well as working with and around electricity,\nshould also be in place. Safe systems should be in place for\nstubble and grass burning, and for storing, handling and\ntransporting hazardous substances.\n2.2.\nFixtures should be in place in all storage sheds, including\nappropriate access ladders, hand rails and ladder cages.\n2.3.\nPersonal protective equipment should be selected, used and\nmaintained.\n2.4.\nEnvironmental conditions should be controlled e.g., keeping\nmoisture levels as low as possible will reduce the likelihood of\nfire.\n2.5.\nProcedures should be in place and used for working with\nmoving vehicles and equipment.\n2.6.\nRecord keeping should ensure that requirements in relation to\nproperly observing and using product labels and MSDS\nsheets, instruction manuals and written organizational\nprocedures.\n3. personal\nprotective\nequipment\n3.1.\nBoots\n3.2.\nhat/hard hat\n3.3.\noveralls, gloves\n3.4.\nprotective eyewear\n3.5.\nhearing protection\n3.6.\nrespirator or face mask\n3.7.\nsun protection (sun hat, sun screen).\n4. environmental\nimplications\n4.1.\nDetrimental environmental impacts may result from excessive\nnoise and exhaust emissions, the incorrect use and disposal\nof maintenance debris (oils, containers, chemical residues),\ndust, and hazardous substances (fuel). Impacts may also\ninclude run-off flows of water and cleaning agents from\nservicing, maintenance and cleaning activities.\n5. site conditions\n5.1.\nIt might be the site of a previous years crop or have been\nused for grazing or laid fallow for a period prior to cultivation.\nIt may also be land cleared of virgin forest, low lying land\nverging on mangroves, sloping high land, existing cleared\nland, and may have soil or surface water.\n\n--- PDF PAGE 36 ---\nTR - Horticulture NC III\n\n- 32 -\nVARIABLE\nRANGE\n6. vehicles and\nequipment\n6.1.\nVehicles might include tractors, trucks and four-wheel drive\nvehicles. Alternatively animal power may be used to pull or\ntow equipment.\n6.2.\nEquipment might be mounted or trailing and may include\nploughs, cultivators, scarifiers, fertilizer spreaders, spraying\nequipment, crop/stick puller, cultivators, buster, disc, lister,\nripper, mulcher, tandem or offset discs, or rakes.\n7. Documented\ninformation\n7.1.\nRecord keeping systems used may be either paper-based or\ndigital, and information will be recorded into logbooks or other\nrecords.\n8. previous crop or\nland clearance\ndebris\n8.1.\nThe planting plan might require that such debris is removed\n(or sprayed), incorporated (smashing, cultivating, mulching,\nslashing), burnt or used for grazing for a period.\n9. equipment is\noperated safely\n9.1.\nThe speeds used should be appropriate for the equipment,\nground and the crop conditions, and all pre- and post-start up\nchecks should be undertaken.\n10. soil profile\n10.1. Where laser levelling is required, assistance may be required\nfor contractors in surveying and pegging. Also soil testing and\nanalysis may be required.\n11. weed and pest\ncontrol measures\n11.1. Weeds may be controlled by using an integrated pest\nmanagement program including the application of herbicides\nand biological control agents, grazing, slashing, burning or\nhay cutting. . Weeds may be controlled at various times, in\nthe preceding year, pre-sowing, post-sowing, pre-emergent, at\nvarious stages of crop and weed growth, as recommended.\n11.2. Insect pests may be controlled by using an integrated pest\nmanagement program including cultural means – cultivation,\netc., insecticides, biological control agents, or removal of food\nsupply using weed control techniques.\n12. treatments\n12.1. Use of insecticides, fertilizers and physical agents should\nmeet legislative, manufacturers and organization\nrequirements.\n13. environmental\nimpacts\n13.1. Detrimental effects such as erosion, loss of moisture,\ndebilitating germination rates, elimination of beneficial and\nindigenous microbes and polluting water bodies.\n14. Documentation\n14.1. All chemical usage should be recorded as well as any\nnecessary recording of site size, and vehicle and equipment\nuse. Additionally, any assessment of pests and weeds, OHS\nhazards, or other observations should be recorded\nappropriately.\n\n--- PDF PAGE 37 ---\nTR - Horticulture NC III\n\n- 33 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nPrepared safely land for crop production to the requirements\nof the organization, and to the needs of the crop.\nThe skills and knowledge required to prepare land for crop\nproduction must be transferable to a different work environment.\nFor example, this could include different crop types, machinery and\nequipment, and farm procedures.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nmethods of cultivating a range of soil types\n2.2.\nenvironmental issues of cultivating soil for planting, such as\ndrainage and irrigation systems, soil amelioration and waste\ndisposal procedures\n2.3.\na range of pre-planting treatments, their purpose and method\nof application\n2.4.\nOHS guidelines, procedures, and principles including manual\nhandling.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ninterpret production/planting plans, produce standards, quality\nspecifications, work procedure documents\n3.2.\nimplement cropping pattern\n3.3.\nmeasure materials and site plan specifications\n3.4.\noperate, adjust and calibrate cultivation equipment safely\n3.5.\ncomplete pre- and post-operational checks on tools, vehicles\nand equipment\n3.6.\nperform routine safety, service and maintenance procedures\non tools, harvester and equipment\n3.7.\nread and interpret manufacturers specifications, work and\nmaintenance plans, and Material Safety Data Sheets\n3.8.\ninterpret and apply task instructions, communicate with work\nteam and supervisor, and record and report faults, workplace\nhazards and accidents.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with vegetables or fruits that require regulating\nplant growth, crop yield and/or quality\n4.2.\nworkplace information relating to crop regulation\n4.3.\nfarm procedures relating to crop regulation\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment.\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 38 ---\nTR - Horticulture NC III\n\n- 34 -\nUNIT OF COMPETENCY :\nIMPLEMENT A POST-HARVEST PROGRAM\nUNIT CODE\n:\nAGR611311\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required for the process of\nimplementing a post-harvest program for horticultural crops\nincluding grading, treating, packing and storing harvested produce.\n\nImplementing a post-harvest program is likely to be carried out\nunder limited supervision from others with checking only related to\noverall progress. The work requires the application of extensive\nhorticultural knowledge and a broad range of horticultural skills.\nThe post-harvest program usually follows established routines,\nmethods and procedures where some discretion and judgment is\nrequired.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for\nimplementation of\npost-harvest\noperations\n1.1\nPost-harvest operations to be performed are identified\naccording to farm work procedures, the marketing plan and\nindustry guidelines and confirmed with the supervisor.\n1.2\nMaterials, tools, equipment and machinery are selected\naccording to farm work procedures.\n1.3\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and farm work procedures.\n1.4\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.5\nSuitable safety and personal protective equipment (PPE)\nare selected, used and maintained.\n2. Co-ordinate post-\nharvest work\n2.1\nFarm work team is identified and tasks are co-ordinated in a\nsequential, timely and effective manner in consultation with\nthe supervisor.\n2.2\nPost-harvest operations are undertaken according to OHS\nrequirements and with due consideration of the\nenvironmental implications.\n2.3\nA clean, safe and hygienic work area is maintained\nthroughout and on completion of work.\n\n--- PDF PAGE 39 ---\nTR - Horticulture NC III\n\n- 35 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Implement post-\nharvest treatments\n3.1\nHarvested produce is graded and labelled according to the\nmarketing plan and farm work procedures.\n3.2\nProduce that does not meet specifications and farm standards\nis identified and disposed of according to farm environmental\nprocedures.\n3.3\nPost-harvest treatments are selected according to harvested\nproduce requirements, the farm integrated pest management\nstrategy and the marketing plan.\n3.4\nTiming, rate, application method, environmental requirements\nand handling techniques conform to the requirements of the\nharvested produce, farm work procedures and industry best\npractice.\n3.5\nPost-harvest practices are economical, methodical, meet\nestablished work schedules and with minimum damage to\nproduce.\n3.6\nTools, equipment and machinery are cleaned and maintained\naccording to farm work procedures.\n4. Implement\nhazardous waste\ndisposal guidelines\n4.1\nWaste disposal requirements of the farm are reviewed and\noperational tasks determined.\n4.2\nCollection and disposal of waste are monitored according to\nfarm environmental procedures.\n4.3\nConditions likely to impact on business viability are reported\npromptly to the supervisor.\n5. Implement packaging\nrequirements of\nproduce\n5.1\nPackaging requirements specified in the marketing plan and\nfarm work procedures are reviewed and operational tasks\ndetermined.\n5.2\nPackaging of produce conform to the requirements of the\nharvested produce, the marketing plan and industry best\npractice.\n5.3\nPackaging materials are selected based on environmentally\nsound principles.\n5.4\nPackaging processes are recorded according to farm work\nprocedures.\n6. Implement storage\nrequirements of\nproduce\n6.1\nStorage requirements specified in the marketing plan and\nfarm work procedures are reviewed and operational tasks\ndetermined.\n6.2\nStorage and handling of produce conform to the requirements\nof the harvested produce, the marketing plan and industry\nbest practice.\n6.3\nStorage processes and facilities are monitored and remedial\naction taken where necessary.\n6.4\nStorage processes and conditions are recorded according to\nfarm work procedures.\n\n--- PDF PAGE 40 ---\nTR - Horticulture NC III\n\n- 36 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. post-harvest\noperations\n1.1.\nPost-harvest operations may include handling and transport of\nharvested produce from the field to processing or storage\nfacilities, grading, applying treatments, and packing, labelling\nand storing harvested produce, handling and transport from\nstorage facility to market.\n2. marketing plan\n2.1.\nThe marketing plan will address client specifications that may\ninclude quality of plant produce (and various grades) such as\nvariety, shape, size, weight, length, colour, maturity, moisture\ncontent, ripeness, texture, skin condition, and blemishes\nwhich are subject to seasonal and market forces. Client\npreferences may also specify packaging materials, containers,\nfilling techniques, labelling and storage requirements from\nfield to client such as the cold chain concept.\n3. farm work\nprocedures\n3.1.\nWork procedures will be based on sound horticultural\nprinciples and practices and may include supervisors oral or\nwritten instructions, post-harvest program or production\nschedule, marketing plan, farm standard operating procedures\n(SOPs), specifications, routine maintenance schedules, work\nnotes; industry best practice guidelines on quality, food safety\nand hygiene; product labels and Material Safety Data Sheets\n(MSDS), manufacturers service specifications and operators\nmanuals, waste disposal, recycling and re-use guidelines, and\nOHS procedures.\n4. materials, tools,\nequipment and\nmachinery\n4.1.\nMaterials may include preservatives, chemicals, gases,\ncleaning agents, packaging materials and containers, labels,\nadhesives and proformas.\n4.2.\nTools, equipment and machinery may include tractors, trailers,\nlight trucks, forklifts, snips, knives, gloves, containers, grading\nmachinery, washers, brushes, dryers, chemical applicators,\ngassing chambers, labelling devices, packing tools, scales,\npallets, hand trolleys and lifting aids, cold storage rooms and\ndedicated storage facilities. Machinery and equipment may be\nanimal-powered, modified atmosphere equipments, sealing\nmachine, reefer vans/trucks.\n5. OHS hazards\n5.1.\nHazards may include a wet working environment including\nelectricity, solar radiation, dust, pollen, soil-borne micro-\norganisms, noise, chemicals and hazardous substances,\nconfined spaces, sharp hand tools and equipment, manual\nhandling, slippery or uneven surfaces, and moving equipment,\nmachinery and vehicles.\n6. safety equipment\n6.1.\nSafety equipment may include signage and barriers, and\noperational safety exits from cold storage rooms and gassing\nchambers.\n7. PPE\n7.1.\nPPE may include hat, boots, overalls, gloves, apron,\nwaterproof clothing, spray clothing, goggles, respirator or face\nmask, face guard, self-contained breathing apparatus, hearing\nprotection, sunscreen lotion and hard hat.\n\n--- PDF PAGE 41 ---\nTR - Horticulture NC III\n\n- 37 -\nVARIABLE\nRANGE\n8. OHS requirements\n8.1.\nOHS requirements may include identifying hazards, assessing\nand reporting risks, cleaning, maintaining and storing tools,\nequipment and machinery; appropriate use of PPE, safe\noperation of tools, equipment and machinery, ensuring\noperational safety exits from cold storage rooms and gassing\nchambers, confined spaces policy and procedures, safe\nhandling, use and storage of chemicals and hazardous\nsubstances, correct manual handling, basic first aid, personal\nhygiene and reporting problems to supervisors.\n9. environmental\nimplications\n9.1.\nDetrimental environmental impacts may arise where post-\nharvest activities produce excess noise, dust or water run-off,\ndisposal of unwanted or waste plant material that produces\nodour and attracts pests, and risks infecting healthy crops, or\non- and off-site ground water or soils that are contaminated\nfrom solids, debris, nutrients, chemicals and water run-off, use\nof CFCs for cooling and propellant and improper disposal of\ncleansing and toxic agents.\n10. clean, safe and\nhygienic work\narea\n10.1. Tasks may include disabling unused tools, equipment and\nmachinery and storing neatly out of the way of post-harvest\nactivities, safely storing materials including chemicals on-site,\nusing signage and safety barriers during and removing after\npost-harvest activities are completed, cleaning, fumigating or\nsterilising post-harvest equipment and storage facilities, and\nswiftly and efficiently removing and processing debris and\nwaste from the work area.\n11. farm\nenvironmental\nprocedures\n11.1. Farm environmental procedures may include procedures for\nthe disposal of out-of-standard produce, waste material such\nas chemicals and hazardous substances used in post-harvest\ntreatments, their containers, plant debris, litter, processing and\ncleaning water run-off, and broken components and\npackaging.\n11.2. Waste may be removed to designated areas for recycling,\nreuse, return to the manufacturer or disposal.\n12. post-harvest\ntreatments\n12.1. Post-harvest treatments may include removal of dirt and\nforeign material, stripping excess leaves and/or trimming,\nbrushing, washing/hydration, drying, applying preservatives,\napplying fungicides and insecticides by spraying or dipping,\nwaxing and polishing, ripening or de-greening with ethylene\ngas, observing quarantine requirements and storing in a\ncontrolled environment.\n13. minimize damage\nto produce\n13.1. Field handling practices may include observing the fill level of\ncontainers, lifting rather than dragging containers to avoid\ncontact with dirt, correctly stacking containers on transport to\nreduce the risk of bruising, squashing or damaging the\nproduce, and smoothly transporting the harvested produce to\nthe post-harvest processing or storage facility.\n13.2. Harvested crops may need to be stored in the shade, in water-\nfilled or covered containers in the field. In the shed storage\nmay occur in a temperature-controlled environment such as a\ncold storage room. These may include forced air cold storage\n\n--- PDF PAGE 42 ---\nTR - Horticulture NC III\n\n- 38 -\nVARIABLE\nRANGE\nrooms for table grapes, hydro cold storage rooms for stone\nfruit and vacuum cold storage rooms for mushrooms.\n13.3. Produce damage may be minimized by wearing gloves,\nmaintaining sharp tools, placing rather than dropping produce\ninto containers, cutting fingernails, observing fill heights,\narrangement of produce and packing instructions for\ncontainers, and correctly stacking containers on transport.\n14. packaging\nrequirements\n14.1. Packaging requirements for specific produce and clients may\ninclude specifications for packaging materials and containers,\nfilling techniques and arrangement of produce within the\ncontainer, and for labelling.\n15. storage\nrequirements\n15.1. Storage requirements for specific produce and clients may\ninclude specifications for storage facilities, environmental\nconditions such as temperature, humidity and light, length of\nstorage, position in the storage facility and cleaning processes\nto ensure a level of hygiene that protects the quality and\nhealth status of the stored produce.\n\n--- PDF PAGE 43 ---\nTR - Horticulture NC III\n\n- 39 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nCoordinated post-harvest operations\n1.2.\nimplemented post-harvest treatments\n1.3.\ndisposed hazardous wastes according to guidelines\nThe skills and knowledge required to implement a post-harvest\nprogram must be transferable to a different work environment. For\nexample, this could include different crops, harvesting methods and\nfarms.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nthe attributes of produce in relation to the desired quality of\nproduce to be presented to the client\n2.2.\nIntegrated Pest Management principles and farm policy\n2.3.\nthe importance of maintaining the quality of produce including\nhandling and cooling requirements\n2.4.\nthe relationship between the quality attributes of produce and\npacking techniques and packaging\n2.5.\ncool chain principles and practices\n2.6.\ncharacteristics and procedures for the use of cold storage\nrooms\n2.7.\nthe correct storage temperatures for a range of produce\n2.8.\nhumidity levels and their effect on the quality of produce\n2.9.\nhygiene issues in the handling and storage of plant produce\n2.10. environmental effects of post-harvest treatments and\nhazardous waste disposal methodologies, application and\npurpose\n2.11. farm confined spaces policy and safety procedures.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate orally and in writing with team members and\nsupervisors\n3.2.\ninterpret and confirm chemical labels, MSDS, work\ninstructions and farm work procedures\n3.3.\nrecord information about work activities on proformas\n3.4.\nparticipate in teams and contribute to team objectives\n3.5.\ncount and calculate quantities, treatment application rates and\nstorage requirements\n3.6.\ncorrectly dispose of chemical substances, their containers and\nother waste materials to minimize environmental impact\n3.7.\nimplement farm OHS policy and procedures.\n\n--- PDF PAGE 44 ---\nTR - Horticulture NC III\n\n- 40 -\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with vegetables or fruits that require regulating\nplant growth, crop yield and/or quality\n4.2.\nworkplace information relating to crop regulation\n4.3.\nfarm procedures relating to crop regulation\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 45 ---\nTR - Horticulture NC III\n\n- 41 -\nUNIT OF COMPETENCY :\nIMPLEMENT A PLANT NUTRITION PROGRAM\nUNIT CODE\n:\nAGR611312\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to implement a\nplant nutrition program in the horticultural or agricultural industry.\n\nImplementing a plant nutrition program is likely to be under limited\nsupervision from others, with checking only related to overall\nprogress. The work is usually done within a program, routines,\nmethods and procedures where some discretion and judgement is\nrequired in the selection of equipment and materials, organization of\nwork, services, actions, and the achievement of outcomes within\ntime and budgetary constraints.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Prepare for\nimplementation of the\nplant nutrition\nprogram\n1.1\nGoals and target site for implementation of the plant nutrition\nprogram including soils, plant species and varieties are\nidentified according to farm work procedures.\n1.2 Area and adjacent lands are analysed for soil\ncomposition/nutrients.\n1.3\nMaterials for soil and plant treatments available to the farm\nare identified and the storage site or supplier details located.\n1.4\nServices are located using site plans and in consultation with\nthe supervisor.\n1.5\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.6\nSuitable personal protective equipment (PPE) is selected,\nused and maintained.\n2 Monitor soil pH\n2.1\nSoil pH in the implementation site is monitored in relation to\nplant nutrition and according to farm work procedures.\n2.2\nProducts useful in changing soil pH are identified,\ncompared, selected and sourced according to farm work\nprocedures.\n2.3\nProduct application methods are assessed according to\nproduct type, soils, farm work procedures, and in due\nconsideration of the environmental implications.\n3 Determine nutritional\nproblems in plants\n3.1\nCommon nutrient deficiency and toxicity problems in plants\nare identified using visual inspection.\n3.2\nThe supervisor and/or nutritional specialist are consulted, as\nrequired, to determine causes of nutritional or toxicity\nproblems.\n3.3\nSoil ameliorants to improve soil fertility are identified,\ncompared, selected and sourced according to farm work\nprocedures.\n\n--- PDF PAGE 46 ---\nTR - Horticulture NC III\n\n- 42 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4 Prepare to use\nfertilizers\n4.1\nThe fertilizer to be used is selected according to fertilizer\ntype, soils, farm work procedures, in consultation with the\nsupervisor and/or nutritional specialist and in due\nconsideration of the environmental implications.\n4.2\nFertilizer application methods are assessed according to\nfertilizer type, soils, farm work procedures, and in due\nconsideration of the environmental implications.\n4.3\nFertilizers are applied according to the plant growing cycle\nand the farm fertilizer calendar.\n4.4\nFertilizers are handled and stored according to farm work\nprocedures and to minimize detrimental environmental impact.\n5 Prepare application\nequipment\n5.1\nTools, equipment and machinery are selected according to\nfarm work procedures.\n5.2\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and farm work procedures.\n5.3\nTools, equipment and machinery are calibrated and adjusted\naccording to manufacturers guidelines and farm work\nprocedures.\n6 Apply specific\nproducts at\nappropriate rates\n6.1\nSpecific products are selected based on their analysis to meet\nplant needs according to farm work procedures.\n6.2\nProduct application rates are calculated to optimise plant\nbenefit and minimize environmental impact according to\nmanufacturers specifications and farm work procedures.\n6.3\nSpecific products are applied at the correct rate, timing and\nmethod according to the product type and analysis,\nmanufacturers specifications, farm work procedures, and in\ndue consideration of the environmental implications.\n6.4\nProduct applications are recorded according to farm work\nprocedures.\n6.5\nTarget plant response to the plant nutrition program, as well\nas any non-target effects such as environmental impact or\npest responses are monitored, documented and reported to\nthe supervisor according to farm work procedures.\n\n--- PDF PAGE 47 ---\nTR - Horticulture NC III\n\n- 43 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. soils\n1.1.\nSoils may include field soil sites and specialist growing media.\n2. farm work\nprocedures\n2.1.\nWork procedures may include supervisors oral or written\ninstructions, plant nutrition program, farm standard operating\nprocedures (SOP), specifications, routine maintenance\nschedules, work notes; product labels and Material Safety\nData Sheets (MSDS); manufacturers service specifications\nand operators manuals; waste disposal, recycling and re-use\nguidelines; and OHS procedures.\n3. materials\n3.1.\nMaterials may include those to modify soil pH, soil ameliorants\nto improve soil fertility, and fertilizers to meet the nutritional\nrequirements of plants.\n4. services\n4.1.\nServices may include water supply, gas, power (electricity),\ntelecommunications, irrigation, and drainage.\n5. OHS hazards\n5.1.\nHazards may include disturbance or interruption of services,\nsolar radiation, dust, noise, soil-, air- and water-borne micro-\norganisms, chemicals and hazardous substances, sharp hand\ntools and equipment, manual handling, moving vehicles,\nmachinery and machinery parts, flying objects and uneven\nsurfaces.\n6. PPE\n6.1.\nPPE may include hat, boots, overalls, gloves, goggles,\nrespirator or face mask, face guard, spray clothing, hearing\nprotection, sunscreen lotion and hard hat.\n7. products useful in\nchanging soil pH?\n7.1.\nProducts may include lime such as ground limestone,\ndolomite, and a range of fertilizers.\n8. application\nmethods\n8.1.\nApplication methods may include banding, broadcasting,\nripping, spraying and fertigation.\n9. environmental\nimplications\n9.1.\nOver-spraying or run-off into the external environment may\nresult in nutrient overload or excess water to native plants,\nnatural waterways, watertables and ecosystems, water\nerosion, water logging and salinisation.\n9.2.\nResponsible fertilisation and watering practices may, however,\nhelp to reverse previous environmental degradation by\nallowing natural recovery and regeneration of native\necosystems.\n10. soil ameliorants\n10.1. Soil ameliorants may include cover crops, animal manures,\ngypsum and lime.\n11. fertilizers\n11.1. Fertilizers may include solids, liquids or gases, which are\nartificial, organic, applied directly to the soil or to the plant via\nfoliar sprays.\n12. fertilizer\napplication\nmethods\n12.1. Fertilizer application methods may include banding,\nbroadcasting, ripping, spraying and fertigation.\n\n--- PDF PAGE 48 ---\nTR - Horticulture NC III\n\n- 44 -\nVARIABLE\nRANGE\n13. tools, equipment\nand machinery\n13.1. Monitoring equipment may include a pH test kit, electronic pH\ntesting device, hand held salinity or EC meter, tape measure,\nsample bags, plastic overlays, aerial photographs, charts and\ntables of soil characteristics and plant soil parameters, as well\nas charts and illustrations of the symptoms of plant nutrient\ndeficiencies and toxicities.\n13.2. Application equipment and machinery may include backpack\nspray equipment, tractors and trailed or 3 point linkage\nspreaders, seeders, rippers and spray equipment, pumps and\npump fittings, and irrigation systems set up for fertigation.\n\n--- PDF PAGE 49 ---\nTR - Horticulture NC III\n\n- 45 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nAssessed the nutritional health of plants grown by the farm\n1.2.\nAccessed and applied appropriate products to plants and soils\nto meet the goals and objectives of the plant nutrition\nprogram.\nThe skills and knowledge required to implement a plant nutrition\nprogram must be transferable to a different work environment. For\nexample, this could include different plant species, nutrition\nprograms and farm situations.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nthe relationship between soil characteristics and the\navailability of nutrients, including macro and micro elements,\nto plants\n2.2.\nnutrient cycling and its practical relevance to the specific\nplants and soils used in the farm.\n2.3.\nmethods of nutrient uptake by plants\n2.4.\nnutrients required by plants grown within the farm and the\naffects of nutrient deficiency and toxicity on individual plant\nspecies and varieties, including visual symptoms\n2.5.\nsoil ameliorants commonly required to treat the soil problems\nexperienced by the farm\n2.6.\nthe main simple and compound fertilizer products available to\nthe farm including analysis, solubility, salt index, application\nrates and costs\n2.7.\nthe environmental implications for the external environment of\nsoil ameliorant and fertilizer use, which may include over-\nspraying, run-off, nutrient overload, erosion, toxicity, noise and\ndust.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate with work team members, supervisors,\ncontractors and suppliers, interpret manufacturers and plant\nnutrition program specifications, utilise proforma reporting,\nanalysis and work procedure documents, and understand\nlabels and symbols\n3.2.\nestimate treatment and product requirements, material sizes\nand quantities, interpret specifications, and calculate areas,\nratios, proportions and application rates\n3.3.\nco-ordinate own activities with the requirements and\nschedules of the work group and contractors to sequentially\nand effectively implement the plant nutrition program in a\ntimely and cost effective manner\n\n--- PDF PAGE 50 ---\nTR - Horticulture NC III\n\n- 46 -\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with commercial cropping or horticulture\n4.2.\nfarm production plan\n4.3.\nworkplace production data and records\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time.\n\n--- PDF PAGE 51 ---\nTR - Horticulture NC III\n\n- 47 -\nUNIT OF COMPETENCY :\nCONTROL WEEDS\nUNIT CODE\n: AGR611313\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to control weeds,\ntaking into consideration integrated pest management options.\nImplementation is likely to be under limited supervision from others\nwith checking only related to overall progress. Responsibility for\nand limited organization of the work of others may be involved.\nImplementation requires the application of knowledge in areas such\nas weed recognition, biology and control, and the lifecycles of weed\npredators and hosts.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Assess weed\ninfestation\n1.1\nScope, density and size of the infestation is assessed.\n1.2\nWeeds and beneficial organisms are identified and reported\nor recorded in field notes.\n1.3\nLevels of weed infestations tolerated by the client, market or\nenvironment are identified from the integrated pest\nmanagement (IPM) strategy.\n1.4\nInfestation levels, above which plant health or growth\nobjectives are compromised are identified.\n1.5\nProfessional advice is obtained as required according to\nenterprise guidelines.\n2 Plan the\nimplementation of\ncontrol measures\n2.1\nControl measures suitable for the infestation are selected\nfrom IPM strategy.\n2.2\nTools, equipment and implements are selected for each\nwork activity according to enterprise work procedures.\n2.3\nOHS hazards are identified, risks. assessed, controls\nimplemented and reported to the supervisor.\n2.4\nSuitable safety equipment and personal protective\nequipment (PPE) are selected, used, maintained and stored.\n2.5\nControl measures selected need to be in full consideration of\nenvironmental implications\n2.6 Control of harmful weeds with the use of cover crops\n3\nImplement control\nmeasures\n3.1\nEnterprise work team, contractors and IPM product suppliers\nare coordinated in a sequential, timely and effective manner in\nconsultation with the supervisor.\n3.2\nControl measures are implemented according to the IPM\nprinciples (e.g water management for rice).\n3.3\nImplementation of IPM activities is undertaken according to\nOHS requirements.\n3.4\nA clean and safe work area is maintained throughout and on\ncompletion of each work activity.\n3.5 Land is prepared to ensure weed elimination.\n3.6\nRecords are maintained as required by legislation and\nenterprise guidelines.\n4\nMonitor control\nmethods\n4.1\nControl methods are monitored to identify side effects to other\nplants, animals or external environment.\n4.2\nEffectiveness of control methods are assessed in reference to\nspecified industry and enterprise standards.\n4.3\nAdjustments to IPM control methods are implemented where\nnecessary to meet enterprise specifications.\n\n--- PDF PAGE 52 ---\nTR - Horticulture NC III\n\n- 48 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. weeds\n1.1.\nThese may include weeds which present a potential risk for\nthe enterprise, industry or environment.\n2. beneficial\norganisms\n2.1.\nThese may include volunteer or cultivated plants that out-\ncompete the weed, insects and other non-vertebrates, and\nmicro organisms that attack the weed.\n3. control measures\n3.1.\nThese may include targeted chemical application, the\napplication of non-chemical controls including organically or\nnaturally ingredient based sprays, controlled release of\npredatory organisms, or the application of cultural control\nmethods including removal and disposal of weeds.\n4. tools, equipment\nand implements\n4.1.\nStandard horticultural tools such as gardening implements,\nmechanised and manually operated spray applicators and\ncultivators, tractors and trailed equipment may be required.\nMonitoring equipment for the implementation of an IPM\nprogram may include insect traps, soil, fertilizer and plant\ntissue test kits and sampling equipment.\n5. OHS hazards\n5.1.\nHazards may include chemicals and hazardous substances,\nmanual handling, operating machinery tools and equipment,\nnoise, dust, solar radiation, falls and tripping.\n6. PPE\n6.1.\nPPE may include hat, boots, overalls, gloves, goggles,\nrespirator or face mask, hearing protection, sunscreen lotion.\n7. environmental\nimplications\n7.1.\nBeneficial environmental impacts may occur where reduced\nand informed targeting of chemicals, fertilizers and water to\nthe site and recycling within the system, result in minimal\nescape of contaminants to the external environment.\nBeneficial impacts may also result from improved production,\nhealthier ecosystems, more efficient water and nutrient\nutilization and reduced weed numbers.\n7.2.\nDetrimental environmental impacts may arise where IPM\nactivities produce excess noise, dust or water, or the systems\ndo not function effectively because of inadequate\nimplementation techniques.\n8. IPM principles\n8.1.\nStandards may include those established by registered\nindustry associations, clients or markets of the enterprise, land\nmanagement agencies or quality assurance program.\n9. OHS requirements\n9.1.\nOHS requirements may include identifying hazards, assessing\nrisks and implementing controls, cleaning, maintaining and\nstoring tools, equipment and machinery, appropriate use,\nmaintenance and storage of PPE including sun protection,\nsafe operation of tools, equipment and machinery, safe\nhandling, use and storage of chemicals, organically based\nmaterials and hazardous substances, correct manual\nhandling, basic first aid, safety procedures for protection of\nothers, personal hygiene, and reporting problems to\nsupervisors.\n\n--- PDF PAGE 53 ---\nTR - Horticulture NC III\n\n- 49 -\nVARIABLE\nRANGE\n10. clean and safe\nwork area\n10.1. Tasks may include disabling unused tools, equipment and\nmachinery and storing neatly out of the way of IPM activities,\ncorrect storage of personal protective equipment, safely\nstoring materials on site, and swiftly and efficiently removing\nand processing debris and waste from the work area.\n11. records\n11.1. Records may include types of weeds and beneficial organisms\npresent, numbers of weeds and beneficials present,\ntreatments applied, date of application, application rates,\nsuccess of treatments, economic thresholds.\n\n--- PDF PAGE 54 ---\nTR - Horticulture NC III\n\n- 50 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nplanned, implemented and monitored weed control\nsuccessfully according to enterprise guidelines and industry\nbest practice\nThe skills and knowledge required to control weeds must be\ntransferable to a different work environment. For example, this\ncould include different weed species, enterprise situations and\ncontrol methods.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below.\n2.1.\nWeed recognition.\n2.2.\nEconomic, aesthetic or environmental thresholds for a range\nof weeds.\n2.3.\nChemical, biological and cultural control methods and\ntreatments available to the enterprise within the parameters of\nan IPM program.\n2.4.\nRange and use of tools, equipment and machinery available\nto the enterprise for implementing the control measures.\n2.5.\nRange of site monitoring and analysis techniques that may be\nused to implement an IPM program.\n2.6.\nAssociation of IPM methods with site limitations,\nenvironmental implications, end market and horticultural\nobjectives for the site.\n2.7.\nOHS issues and legislative requirements associated wth\nhazardous sunbstances. regulations and Codes of Practice.\n2.8.\nOHS responsibilities of employers and employees.\n2.9.\nCorrect wearing/fit of personal protective equipment.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\nrecognise of a range of weeds and beneficial organisms within\na particular enterprise.\n3.2.\ncommunicate with work team members, supervisors,\ncontractors and consultants.\n3.3.\nutilise proforma reporting, analysis and work procedure\ndocuments.\n3.4.\nunderstand IPM symbols and information.\n3.5.\ninterpret and apply IPM program spatial and logistical\nspecifications.\n3.6.\ncorrect fitting, cleaning and storage of personal protective\nequipment.\n3.7.\ninterpret and apply test results and calculate the quantities\nand applications rates of control materials.\n3.8.\ncoordinate work group, contractors and own activities to\n\n--- PDF PAGE 55 ---\nTR - Horticulture NC III\n\n- 51 -\nsequentially and effectively complete IPM activities in a timely\nand cost effective manner.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with a range of weeds\n4.2.\ntools, equipment and materials for controlling weeds\n4.3.\nenterprise procedures, work plans relevant to weed control\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace. or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 56 ---\nTR - Horticulture NC III\n\n- 52 -\nUNIT OF COMPETENCY :\nPREPARE AND APPLY CHEMICALS\nUNIT CODE\n:\nAGR611314\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to prepare and\napply chemicals for the control of weeds, pests and diseases. It\nrequires knowledge of the chemicals related to the workplace, the\nhazards and risks involved in their use, and the specific safety\nprocedures prescribed for working unsupervised within\norganizational guidelines. It requires the ability to handle and apply\nchemicals ensuring minimum risk to self, others and environment\nand accurately record their use.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Determine the need\nfor chemical use\n1.1 Nature and level of the pest, weed infestation or disease is\nidentified.\n1.2 Need for action is assessed.\n1.3 Assess the requirement for chemical use as an option within\nan integrated pest management strategy.\n1.4 Hazard and risk analysis of different chemical options is\nundertaken.\n1.5\nRequirement for chemical application including coverage by\nappropriate insurance is identified and confirmed.\n2 Prepare appropriate\nchemical\n2.1\nChemical label and Material Safety Data Sheets (MSDS) are\nread and understood.\n2.2\nLabels are checked to ensure chemicals meet user\nrequirements and specifications.\n2.3\nChemicals are prepared from those registered for the intended\npurpose, and to suit the organization’s chemical use strategy.\n2.4\nLegislation and regulations concerning chemical use are\nidentified and followed.\n2.5\nOccupational Health and Safety (OHS) hazards and risks\nand risk control requirements associated with use of the\nchemical are identified.\n3 Prepare to use\nchemicals according\nto the label and\nMSDS\n3.1\nPersonal protective equipment is selected and checked for\nuse according to the product label and MSDS.\n3.2\nRequirements for pre and post-operative checks on\nequipment are followed.\n3.3\nDamage, wear or malfunctions of any equipment is identified\nand reported or repaired.\n3.4\nRequirements for the selection, preparation and adjustment of\napplication equipment and tools for the appropriate\nchemicals are followed.\n3.5\nMixing rates are defined and calculated.\n3.6\nDirections, standards and legislative requirements for mixing\nchemicals are followed.\n\n--- PDF PAGE 57 ---\nTR - Horticulture NC III\n\n- 53 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4 Apply chemicals\n4.1\nMeteorological conditions and forecasts are assessed prior\nto and during application.\n4.2\nHazards of particular chemicals are identified.\n4.3\nRisks to others and the environment are assessed and\ncontrolled.\n4.4\nApplication equipment calibration procedures are followed.\n4.5\nProcedures and precautions for the use of the chemicals are\ninterpreted from labels and accreditation requirements.\n4.6\nRequirements for chemical handling and application are\ndetermined from directions, standards and legislative\nrequirements.\n4.7\nChemicals are applied safely and effectively according to\ndirections.\n4.8\nChemical spills or accident procedures are followed.\n4.9\nFirst aid equipment is made available on site.\n5 Clean up following\nchemical application\n5.1\nTools or equipment required to clean up chemicals are\nselected.\n5.2\nRequirements for cleaning equipment and sites are defined\nand followed according to directions and standards.\n5.3\nRequirements for disposing of unused chemicals, empty\ncontainers or spilled material are defined from directions and\nstandards.\n5.4\nProcedures for reporting chemical spills are followed.\n6 Record application\ndetails\n6.1\nApplication of chemicals is recorded according to\norganization procedures, label directions and legislation.\n6.2\nDetails of the specific chemical concerned are recorded\ncorrectly in the chemical inventory according to regulations.\n6.3\nInventory of personal protective equipment and application\nequipment is recorded.\n6.4\nProcedures and requirements for reporting application details\nto senior management or client are followed.\n6.5\nRecords of injury or poisoning associated with application of\nchemical are made and provided to the appropriate person.\n\n--- PDF PAGE 58 ---\nTR - Horticulture NC III\n\n- 54 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. chemicals\n\n1.1.\nChemicals may include insecticides, fungicides, herbicides,\nbactericides, algaecides, bio-agents, nematacides,\nrodenticides, antimicrobial agents, anthelmintics, hormone\ngrowth promotants or a range of veterinary chemicals used to\ntreat animals for disease.\n2. legislation and\nregulations\n2.1.\nLegislation may include Pesticides Acts, Occupational Health\nand Safety Acts and associated Hazardous Substances\nRegulations/ Codes of Practice, Dangerous Goods Acts,\nPoisons Act or Protection of the Environment Acts.\n3. OHS hazards and\nrisks\n3.1.\nOHS hazards include exposure of the operators and others in\nthe workplace to the absorption of chemicals through the skin\nand by inhalation and ingestion. Risks may include acute\npoisoning, chronic or long-term health effects, and lack of\nappropriate insurance coverage.\n4. OHS risk control\nrequirements\n4.1.\nOHS risk control measures may include safe application\ntechniques, use and maintenance of personal protective\nequipment, safe wash down procedures, safe procedures for\ncontainer rinsing and management.\n5. personal\nprotective\nequipment\n5.1.\nPersonal equipment may include boots, chemical resistant\ngloves, aprons, face shields, respirators or hats and protective\nclothing.\n6. pre and post\noperational\nchecks\n6.1.\nChecks may be made to weather conditions (e.g., wind),\nnozzles, hoses, regulators/gauges, respirator cartridges,\ndrench and protective clothing and equipment.\n7. application\nequipment\n7.1.\nInclude knapsacks or hand held pneumatic sprayers, drench\nguns, spot on applicators, CDA and air assisted units, self-\npropelled sprayers, controllers or power operated equipment\nlike boomsprays, pressure wands, jetting race, shower/plunge\ndips, hand jetting or air blast sprayer.\n8. directions and\nstandards\n8.1.\nMay include the instructions on the chemicals label, in an\noperator’s manual, on a MSDS, in an industry standard, or\nfrom Codes of Practice and advisory material explaining\nlegislation relevant to chemical use.\n9. hazards\n9.1.\nHazards will be listed on labels and the MSDS for the\nchemical concerned and may include flammability, toxicity,\nhealth hazards, damage to non-target organisms, uneven\nsurfaces, trip points, solar radiation, manual handling, faulty\nequipment, environmental damage or residues in foods.\n10. risks\n10.1. Risks that may be assessed include spillage, contact of\nchemical with skin or eyes, accidental ingestion, incorrect\nconcentrations in mixtures, faulty or inappropriate storage\ncontainers, incorrectly calibrated equipment, spray drift,\ncontamination of waterways, incorrect disposal of unused\nchemicals or faulty equipment\n11. meteorological\nconditions\n11.1. Rain, wind, temperature, relative humidity, inversion or stable\nair conditions.\n\n--- PDF PAGE 59 ---\nTR - Horticulture NC III\n\n- 55 -\nVARIABLE\nRANGE\n12. tools and\nequipment\n12.1. Include washing soda, chlorine, containers for disposal of\nchemicals, non-flammable absorbent materials and shovels,\nbooms, sausages and sandbags.\n13. organizational\nprocedures\n13.1. Written journal or computer record may be used for recording.\n14. appropriate\nperson\n14.1. Include relevant authorities, supervisor, manager, business\nowner or colleague.\n\n--- PDF PAGE 60 ---\nTR - Horticulture NC III\n\n- 56 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nPrepared the correct chemical for the problem unsupervised\n1.2.\nApplied the chemical according to safe work practice and\nlegislation and ensure minimal effects on the environment and\nothers\nThe skills and knowledge required to prepare and apply chemicals\nmust be transferable to a different work environment. For example,\nthis could include different chemicals, application methods and\nworkplaces.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below.\n2.1.\nChemical free options for pest control.\n2.2.\nUse, maintenance and storage of equipment to prepare and\napply chemicals.\n2.3.\nOHS issues, legislative requirements and Codes of Practice\nrelevant to chemical use and hazardous substances.\n2.4.\nUse, maintenance and storage of personal protective\nequipment, including how, when and why it should be used.\n2.5.\nLicensing requirements (e.g licensed Pesticide Applicator,\nlicensed Fumigator) and relevant government authorities.\n2.6.\nModes of chemical absorption and paths of entry associated\nwith risks to bystanders/public and applicators.\n2.7.\nEnvironmental effects of chemicals.\n2.8.\nDrift management.\n2.9.\nCalibration and adjustments.\n2.10. Integrated Pest Management and Integrated Resistance\nManagement principles.\n2.11. Cost effective use of chemicals.\n2.12. Hazard identification, assessment and control, and emergency\nresponse.\n2.13. Correct wearing/fit of personal protective equipment.\n2.14. Read and follow the label instructions.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate orally and in writing.\n3.2.\nread and interpret labels.\n3.3.\nmeasure quantities, application rates and calibrate equipment.\n3.4.\nreport on and record activities.\n3.5.\nuse safe and environmentally responsible work practices.\n\n--- PDF PAGE 61 ---\nTR - Horticulture NC III\n\n- 57 -\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace\n4.2.\nworkplace equipment and storage facilities for chemical\nmixing and application\n4.3.\nenterprise procedures relating to chemical use.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 62 ---\nTR - Horticulture NC III\n\n- 58 -\nUNIT OF COMPETENCY :\nESTABLISH HORTICULTURAL CROPS\nUNIT CODE\n:\nAGR611315\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required for establishing\nhorticultural crops. It includes preparing machinery and equipment,\nploughing/cultivating, seeding, applying any pre-planting\ntreatments, maintaining machinery and equipment, relevant record\nkeeping, and it requires the application of skills and knowledge to\nuse specialised equipment to carry out seeding and fertilizer\noperations appropriate to soil and weather conditions. Equipment\nand machinery may be animal-powered. In addition, it requires an\nawareness of licensing requirements, safe workplace and positive\nenvironmental practices associated with seeding operations\nincluding sustainable land management. The work functions in this\nstandard involve the application of some judgement and discretion\nand are likely to be carried out under minimal supervision within\nfarm guidelines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare machinery\nand equipment for\nuse\n1.1\nMachinery and equipment is selected and confirmed against\nthe work plan and prepared to manufacturers specifications.\n1.2\nEquipment is securely attached and calibrated for operation to\nmanufacturer’s specifications.\n1.3\nExisting and potential OHS hazards in the workplace are\nidentified, risks assessed and controlled in line with farm\nrequirements.\n2. Prepare for\nhorticultural crop\nestablishment\n2.1\nSoil and weather conditions are monitored for optimal\nseeding conditions.\n2.2\nSoil conservation and sustainable land management practices\nand procedures are recognized and confirmed in accordance\nwith farm requirements and environmental concerns.\n2.3\nSeeding, fertilizer, and pest and weed control requirements\nare confirmed against the work plan and prepared to\nmanufacturers specifications using safe handling procedures.\n2.4\nContingency plans are prepared for unusual seasonal\nconditions and pest/disease outbreaks.\n3. Sow the crop\n3.1\nSuitable personal protective clothing and equipment is\nselected, used and maintained in accordance with OHS\nrequirements.\n3.2\nSeeding and fertilizer applications are carried out in line with\nthe work plan.\n3.3\nPest and weed control treatment is coordinated with seeding\nand fertilizer applications as required.\n3.4\nEnvironmental implications associated with sowing\noperations are identified, assessed and controlled in line with\nfarm requirements.\n4. Complete seeding\noperations\n4.1\nSeeding, machinery and equipment operation records are\nmaintained in accordance with farm requirements.\n4.2\nMachinery and equipment damage, malfunctions or irregular\nperformance are reported in line with farm requirements.\n4.3\nMachinery and equipment is cleaned, secured and stored in\nline with manufacturer’s specifications and farm requirements.\n\n--- PDF PAGE 63 ---\nTR - Horticulture NC III\n\n- 59 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. machinery and\nequipment\n1.1.\nTractors, seed drills, air seeders, plough, harrows, cultivators,\nscarifiers, trucks, augers and bins. Equipment and machinery\nmay be animal-powered.\n1.2.\nManual sowing is likely to be used in a number of situations\nand there would be basic equipment associated with this\nmethod of crop establishment.\n2. work plan\n2.1.\nLocation, crop type (cereals, legumes, cotton,) and seeding\nmethod, soil condition (structure, moisture), seeding practices\n(sowing time, sowing rate, optimal depth of sowing, seed\ndressing, tilth to match seed size), fertilizer type and\napplication, pest and weed control type and application,\nmachinery, equipment, resources and materials requirements,\nsupervisors instructions, timeframe for work completion, crop\nlay-out and crop design and reporting requirements.\n3. preparation of\nmachinery and\nequipment\n3.1.\nPreparation may include safe transporting, inspection, pre-\nstart and safety checks, routine servicing and maintenance,\ncalibration, checking and monitoring machinery settings.\n4. OHS\nrequirements\n\nSystems and procedures for:\n4.1.\nthe safe operation and maintenance of machinery and\nequipment including hydraulics and guarding of exposed\nmoving parts.\n4.2.\nidentify hazards, assessing and reporting risks.\n4.3.\nemergency operating procedures.\n4.4.\nsafe lifting, carrying and handling techniques.\n4.5.\nmanual handling systems and procedures, handling and\nstorage of hazardous substances and grain, and the\nappropriate use of personal protective clothing and\nequipment.\n4.6.\nSafe systems and procedures for outdoor work including\nprotection from solar radiation, protection of people in the\nworkplace, protection from hazardous noise, mechanical\nvibration, organic and other dusts, and protection from fire\nrisk.\n5. OHS hazards\n5.1.\nExposure to loud noise and fumes, solar radiation, dust,\nergonomic hazards associated with posture and vibration,\nhazardous substances, the presence of bystanders, slippery\nor uneven terrain, potholes, stumps, ditches, gullies,\nembankments, obstacles (rocks, logs, fences, debris),\nadverse weather conditions, mechanical malfunctions and\nexposed moving parts, and other machinery including\nhydraulics.\n\n--- PDF PAGE 64 ---\nTR - Horticulture NC III\n\n- 60 -\nVARIABLE\nRANGE\n6. farm requirements\n6.1.\nStandard operating procedures (SOPs), industry standards,\nproduction schedules, Material Safety Data Sheets (MSDS),\nwork notes, product labels, manufacturers specifications,\noperators manuals, farm policies and procedures (including\nwaste disposal, recycling and re-use guidelines), OHS\nprocedures, supervisors oral or written instructions, and work\nplans.\n7. horticultural crops\n7.1.\nCrops may include fruit, vegetables, herbs, flowers, foliage,\nbulbs, tubers, nuts, mushrooms, wild harvest plants and oils.\n8. optimal seeding\nconditions\n\n8.1.\nThis may be based on the history of seasonal weather\nproviding a reasonable risk for dry seeding, and soil moisture\nconditions appropriate for grains crop germination.\n9. personal\nprotective clothing\nand equipment\n9.1.\nBoots, hat/hard hat, overalls, gloves, protective eyewear,\nhearing protection, respirator or face mask, and sun protection\n(sun hat, sunscreen).\n10. environmental\nimplications\n10.1. Positive environmental impacts may result from the conduct of\nsustainable land use practices including stubble retention,\nminimum tillage, and contour sowing to reduce erosion risks.\nIt may also include the use of non-chemical alternatives for\npesticides and cleaning agents, effective water re-use\nsystems, and the reduction of noise and exhaust emissions.\n10.2. Negative environmental impacts may result from high activity\nvehicle traffic and over-cultivation practices causing erosion,\nincreased water run-off speeds, soil compaction, soil\ndisturbance and loss, soil degradation, dust, contamination of\nsoil and water through the use of fertilizer and chemicals,\nspray drift, incorrect use and disposal of chemicals and\nresidues, oils and containers, greases, and detergents used in\ncleaning and maintenance procedures.\n\n--- PDF PAGE 65 ---\nTR - Horticulture NC III\n\n- 61 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nselected and utilised various features and controls of a range\nof specialised application equipment to seed and fertilise a\ngrains crop\n1.2.\nprepared and serviced machinery and equipment\n1.3.\nassessed soil and weather conditions and determined\nappropriate seeding methods\n1.4.\nprepared seeds for planting, seed to plan ensuring optimum\nrange of depth and density\n1.5.\nrecognized and controlled hazards, evaluated seeding\noperations and maintained records\nThe skills and knowledge required to establish horticultural crops\nmust be transferable to a different work environment. For example\nthis may include different crops, planting techniques, machinery and\nfarms.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\ncrop types, preparation of seeds, seeding methods and\napplication techniques\n2.2.\nfertilizer types, rates of application and crop nutrient\nrequirements\n2.3.\ntypes of herbicides, insecticides and other pesticides, and\nalternative pest control methods (non-chemical)\n2.4.\neffects of weather conditions (normal and adverse) on seeding\nand fertilising applications\n2.5.\noperating principles and operating methods for machinery and\nequipment\n2.6.\npre-operational and safety checks, servicing and maintenance\nprocedures for seeding machinery and equipment\n2.7.\nprinciples of weight distribution with regard to load shifting and\nvehicle movement\n2.8.\nsustainable land management and soil conservation\ntechniques\n2.9.\npositive environmental practices, negative environmental\nimpacts and minimisation measures associated with seeding\noperations\n2.10. relevant provincial/municipal legislation, regulations and codes\nof practice with regard to workplace OHS and the use and\ncontrol of hazardous substances\n2.11. relevant provincial/municipal legislation and regulations with\nregard to licensing requirements and the use and control of\nmachinery and equipment\n2.12. personal protective clothing and equipment and when and\nhow it should be used\n\n--- PDF PAGE 66 ---\nTR - Horticulture NC III\n\n- 62 -\n2.13. procedures for cleaning, securing and storing machinery,\nequipment and materials\n2.14. farm policies with regard to seeding operations, and recording\nand reporting routines.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These include the ability to:\n3.1.\napply fertilizer, herbicides, insecticides, other pesticides and\nhazardous substances safely\n3.2.\nidentify types of weeds and insects harmful to crops\n3.3.\nidentify beneficial insects\n3.4.\nperform pre-operational and safety checks, servicing and\nmaintenance on machinery and equipment\n3.5.\ncalibrate, operate machinery and attach/detach equipment\n3.6.\ndemonstrate emergency operating procedures in normal and\nadverse conditions\n3.7.\nrecognize and report machinery damage, faults or\nmalfunctions and perform minor repairs\n3.8.\ndemonstrate safe, environmentally responsible and\nsustainable land management practices\n3.9.\nmonitor and minimize impacts to the environment associated\nwith sowing operations\n3.10. read and interpret manufacturers specifications, work and\nmaintenance plans, and MSDS\n3.11. obtain relevant licences and permits\n3.12. clean, secure and store machinery and equipment\n3.13. interpret and apply task instructions, communicate with work\nteam and supervisor, and record and report equipment faults,\nworkplace hazards and accidents\n3.14. assess and calculate the application of fertilizer/pesticide\nrequirements and application rates, calibrate equipment and\ncalculate volumes, consumption and servicing requirements.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace where horticultural crops are to be established\n4.2.\nworkplace information relating to crop establishment\n4.3.\nfarm procedures relating to crop establishment\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 67 ---\nTR - Horticulture NC III\n\n- 63 -\nUNIT OF COMPETENCY :\nCOORDINATE A HORTICULTURAL CROP MAINTENANCE\nPROGRAM\nUNIT CODE\n:\nAGR611316\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required for coordinating a\ncrop maintenance program in which thinning and pruning of flower,\nfruit or vegetable crops is undertaken to control yield and quality.\nCrop maintenance methods may include manual thinning, chemical\nthinning, selective harvesting, training, topping and trimming.\nIrrigation and plant nutrition programs are covered in other units of\ncompetency.\n\nCoordinating a horticultural crop maintenance program is likely to\nbe carried out under limited supervision from others with checking\nonly related to overall progress. The work requires the application\nof horticultural knowledge and a broad range of horticultural skills.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for the crop\nmaintenance\nprogram\n1.1\nThe site and operational requirements of the crop\nmaintenance program are identified according to the site\nplan and farm work procedures.\n1.2\nCrop maintenance materials are selected according to farm\nwork procedures.\n1.3\nServices are located using site plans and in consultation with\nthe supervisor and workers.\n1.4\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.5\nSuitable safety and personal protective equipment (PPE)\nare selected, used and maintained.\n2. Prepare crop\nmaintenance\nequipment\n2.1\nTools, equipment and machinery are selected according to\nfarm work procedures.\n2.2\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and farm work procedures.\n2.3\nTools, equipment and machinery are calibrated and adjusted\naccording to manufacturer’s guidelines and farm work\nprocedures.\n3. Implement the crop\nmaintenance\nprogram\n3.1\nFarm work team and contractors are identified and work tasks\nare co-ordinated in a sequential, timely and effective manner\nin consultation with the supervisor.\n3.2\nWork pattern is planned to cover the site in an efficient,\nsequential and co-ordinated manner according to farm work\nprocedures and do maintenance work regularly.\n3.3\nCrop maintenance tasks are undertaken according to OHS\nrequirements and with due consideration of the\nenvironmental implications.\n3.4\nCrop maintenance tasks are monitored and remedial action is\nundertaken where necessary to achieve program objectives.\n3.5\nA clean and safe work area is maintained throughout and on\ncompletion of work.\n\n--- PDF PAGE 68 ---\nTR - Horticulture NC III\n\n- 64 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Complete crop\nmaintenance\nactivities\n4.1\nWaste material is removed from the site and disposed of in\nan environmentally aware and safe manner according to farm\nwork procedures.\n4.2\nTools, equipment and machinery are cleaned, maintained and\nstored according to farm work procedures.\n4.3\nWork outcomes are recorded or reported to the supervisor\naccording to farm work procedures.\n\n--- PDF PAGE 69 ---\nTR - Horticulture NC III\n\n- 65 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. crop maintenance\nprogram?\n1.1.\nThe program may include manual thinning, chemical thinning,\nselective harvesting, training, topping and trimming.\n2. farm work\nprocedures\n\n2.1.\nWork procedures will be based on sound horticultural\nprinciples and practices and may include supervisors oral or\nwritten instructions, crop maintenance program, farm standard\noperating procedures (SOPs), specifications, routine\nmaintenance schedules, work notes, product labels and\nMaterial Safety Data Sheets (MSDS), manufacturers service\nspecifications and operators manuals, waste disposal,\nrecycling and re-use guidelines, and OHS procedures.\n2.2.\nMaterials may include thinning agents, growth hormones and\nretardants, and trellising and training materials.\n2.3.\nServices may include water supply, gas, power (electricity),\ntelecommunications, irrigation and drainage.\n3. OHS hazards\n3.1.\nHazards may include disturbance or interruption of services,\nsolar radiation, dust, noise, soil and air-borne micro-\norganisms, chemicals and hazardous substances, sharp hand\ntools and equipment, manual handling, moving vehicles,\nmachinery and machinery parts, uneven surfaces and flying\nobjects.\n4. safety equipment\n4.1.\nSafety equipment may include signage and barriers.\n5. PPE\n5.1.\nPPE may include hat, boots, overalls, gloves, spray clothing,\ngoggles, respirator or face mask, face guard, hearing\nprotection, sunscreen lotion and hardhat.\n6. tools, equipment\nand machinery\n6.1.\nApplication equipment and machinery may include backpack\nspray equipment; tractors and trailed or 3-point linkage spray\nequipment, pumps and pump fittings.\n6.2.\nPruning tools, equipment and machinery may include knives,\nhandsaws, hand scissors, small chainsaws, ladders and\npicking platforms.\n6.3.\nPlant training equipment may include trellising and specialised\ntraining systems.\n7. OHS requirements\n7.1.\nOHS requirements may include identifying hazards, assessing\nrisks and implementing controls, cleaning, maintaining and\nstoring tools, equipment and machinery, appropriate use of\nPPE including sun protection, safe operation of tools,\nequipment and machinery, safe handling, use and storage of\nchemicals and hazardous substances, correct manual\nhandling, basic first aid, personal hygiene and reporting\nproblems to supervisors.\n8. environmental\nimplications\n8.1.\nDetrimental environmental impacts may arise where crop\nmaintenance activities produce excess noise, dust or water\nrun-off, or off-site ground water or soils are contaminated from\nsolids, debris, nutrients, chemicals and water run-off.\n\n--- PDF PAGE 70 ---\nTR - Horticulture NC III\n\n- 66 -\nVARIABLE\nRANGE\n9. clean and safe\nwork area\n9.1.\nTasks may include disabling unused tools, equipment and\nmachinery and storing neatly out of the way of crop\nmaintenance activities, safely storing materials on site, using\nsignage and safety barriers during and removing after crop\nmaintenance activities are completed, and swiftly and\nefficiently removing and processing debris and waste from the\nwork area.\n10. waste material\n10.1. Waste material may include plant debris, litter and broken\ncomponents.\n10.2. Plant-based material may be mulched or composted, plastic,\nmetal, paper-based materials may be recycled, re-used,\nreturned to the manufacturer or disposed of according to farm\nwork procedures.\n\n--- PDF PAGE 71 ---\nTR - Horticulture NC III\n\n- 67 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nprepared for crop maintenance activities\n1.2.\ncoordinated work groups and implemented crop maintenance\nactivities to achieve farm crop production targets in terms of\nyield and quality\nThe skills and knowledge required to coordinate a crop maintenance\nprogram must be transferable to a different work environment. For\nexample, this could include different crops, canopy management\nrequirements and workplaces.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nprinciples of thinning and pruning and the methods used to\nachieve crop maintenance goals\n2.2.\neffects on plant growth, habit and production levels of thinning\nand pruning operations in relation to the market goals of the\nfarm\n2.3.\nfarm quality procedures and characteristics of a crop relative\nto varying market requirements.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate orally and in writing with work team members,\nsupervisors and contractors\n3.2.\nutilise proforma recording, reporting and work procedure\ndocuments\n3.3.\ninterpret site plans and crop maintenance specifications\n3.4.\nmeasure quantities, calculate material requirements, area,\nvolume, ratios and application rates, and calibrate machinery\n3.5.\nco-ordinate work group, contractors and own activities\n3.6.\nmonitor farm plants for quality\n3.7.\nminimize noise, dust, high activity vehicle traffic and water\nrun-off to prevent nuisance-level environmental disturbance.\n4. Resource Implication\n\nThe following resources should be provided:\n4.1.\nworkplace with commercial plants of horticulture crops, vines\nor trees\n4.2.\nquality specifications\n4.3.\nproduction plan and schedule\n4.4.\nfarm procedures relating to crop maintenance\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment.\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time.\n\n--- PDF PAGE 72 ---\nTR - Horticulture NC III\n\n- 68 -\nUNIT OF COMPETENCY :\nCOORDINATE HORTICULTURAL CROP HARVESTING\nUNIT CODE\n:\nAGR611317\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required for co-ordinating\nharvesting activities for horticultural crops including preparing for\nharvest, maintaining harvest requirements, monitoring crop quality\nand delivering the crop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for crop\nharvesting\n1.1\nThe crop to be harvested and the requirements and\nprocedures to assure crop quality are identified according to\nfarm work procedures.\n1.2\nCrop maturity is determined by experience, specification\ncharts, aids or devices and according to client, farm and\nindustry quality assurance specifications.\n1.3\nSuitable weather conditions for picking are established\naccording to farm work procedures.\n1.4\nTools, equipment and machinery are selected according to\nharvest requirements and farm work procedures.\n1.5\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and farm work procedures prior to harvesting.\n1.6\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.7\nSuitable safety and personal protective equipment (PPE)\nare selected, used and maintained.\n2. Coordinate\nharvesting activities\n2.1\nFarm work team, contractors and clients are identified and\nwork tasks are co-ordinated in a sequential, timely and\neffective manner in consultation with the supervisor.\n2.2\nHarvesting of the crop is undertaken according to OHS\nrequirements and with due consideration of the\nenvironmental implications.\n2.3\nHarvest records are maintained according to farm work\nprocedures.\n2.4\nA clean and safe work area is maintained throughout and on\ncompletion of work.\n3. Maintain harvest\nrequirements\n3.1\nFarm tools, equipment and machinery are maintained in\neffective working order throughout the harvest to enable\nsmooth operations and minimize downtime.\n3.2\nHarvest workers are provided with sufficient tools, equipment\nand machinery to match harvest output and to prevent\nunnecessary interruptions.\n3.3\nFull containers are removed, emptied into or loaded onto\ntransport vehicles as soon as possible after harvesting to\nminimize deterioration of the crop.\n\n--- PDF PAGE 73 ---\nTR - Horticulture NC III\n\n- 69 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Monitor crop quality\nthroughout harvest\n4.1\nPPE is selected, maintained and used according to OHS\nprocedures.\n4.2\nThe crop is handled carefully to prevent damage according to\nfarm work procedures.\n4.4\nSorting and grading of the crop complies with client, farm\nand industry quality assurance specifications.\n4.5\nCrop storage minimizes postharvest deterioration according\nto farm work procedures.\n4.6\nThe crop is transported with minimum damage according to\nfarm work procedures.\n5. Deliver crop to\nspecified destination\n5.1\nDelivery details including quantity, timing and destination are\nconfirmed according to farm work procedures.\n5.2\nCrop is delivered with damage levels that are within client,\nfarm and industry quality assurance specifications.\n5.3\nDelivered crop complies with client, farm and industry quality\nassurance specifications.\n5.4\nDelivery documentation is completed accurately according to\nfarm work procedures.\n\n--- PDF PAGE 74 ---\nTR - Horticulture NC III\n\n- 70 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. crops\n\n1.1.\nCrops may include fruit, vegetables, herbs, flowers, foliage,\nbulbs, tubers, nuts, mushrooms, wild harvest plants and oils.\n1.2.\nThe crop may be harvested manually or mechanically.\n2. farm work\nprocedures\n2.1.\nWork procedures will be based on sound horticultural\nprinciples and practices and may include supervisors oral or\nwritten instructions, the harvest plan, program and schedule,\nquality assurance policy and plan, farm standard operating\nprocedures (SOPs), specifications, routine maintenance\nschedules, work notes; product labels and Material Safety\nData Sheets (MSDS); manufacturers service specifications\nand operators manuals; waste disposal, recycling and re-use\nguidelines; and OHS procedures.\n3. crop maturity\ndetermined\n3.1.\nMaturity parameters may include size, weight, length, shape,\ncolour (external and/or internal), texture, skin condition, ease\nof removal, moisture content, ripeness, percentage juice,\nspecific gravity, acidity and sugar content.\n3.2.\nThese characteristics may be measured by observation and\nmaturity testing tools and equipment such as knives, sizing\nrings, callipers, colour charts, refractometers, penetrometers\nand produce firmness testers.\n3.3.\nThe results are interpreted and analyzed by comparison with\nspecification charts and client, farm and industry maturity\nstandards.\n4. clients\n4.1.\nClients may include the farm, packers, wholesalers, retailers,\nprocessors and exporters.\n5. weather\nconditions\n5.1.\nWeather conditions may include temperature, humidity, rain,\nand wind and sun intensity.\n6. tools, equipment\nand machinery\n6.1.\nTools, equipment and machinery may include secateurs,\nknives, maturity testing equipment, specification charts,\ngloves, bags, ladders, tractors, trailers, forklifts, powered\nladders, mechanical harvesters, pallets, containers, cartons,\ntrays, net bags, buckets, dip tins, bulk bins, gondolas, trucks\nand trailers for transport of bulk produce, grading machinery,\ncutting machines, coolrooms, gassing chambers and labelling\ndevices.\n7. OHS hazards\n7.1.\nHazards may include solar radiation, dust, noise, soil and air-\nborne micro-organisms, chemicals and hazardous\nsubstances, sharp hand tools and equipment, manual\nhandling, ladders, moving vehicles, machinery and machinery\nparts, slippery or uneven surfaces, potholes and flying objects.\n8. safety equipment\n8.1.\nSafety equipment may include signage and barriers.\n9. PPE\n9.1.\nPPE may include hat, boots, overalls, gloves, goggles,\nrespirator or face mask, face guard, hearing protection,\nsunscreen lotion and hard hat.\n\n--- PDF PAGE 75 ---\nTR - Horticulture NC III\n\n- 71 -\nVARIABLE\nRANGE\n10. OHS requirements\n10.1. OHS requirements may include identifying hazards, assessing\nrisks and implementing controls, cleaning, maintaining and\nstoring tools, equipment and machinery, appropriate use of\npersonal protective equipment including sun protection, safe\noperation of tools, equipment and machinery; safe handling,\nuse and storage of chemicals and hazardous substances,\ncorrect manual handling, basic first aid, personal hygiene and\nreporting problems to supervisors.\n11. environmental\nimplications\n11.1. Detrimental environmental impacts may arise where harvest-\ning activities produce excess noise, dust or water run-off.\n12. harvest records\n12.1. Harvest records may include harvest workers tallies or\nworking hours, written harvest instructions, dates of harvest,\nwithholding periods (time since last chemical spray), crop yield\nfrom each section, weather conditions during harvest,\npercentage crop deterioration, maturity measurements taken,\nstorage conditions, machinery settings or adjustments,\nmachinery repairs and maintenance, dispatch details and\ndelivery dockets.\n13. clean and safe\nwork area\n13.1. Tasks may include disabling unused tools, equipment and\nmachinery and storing neatly out of the way of harvest\nactivities, safely storing harvest materials on site, using\nsignage and safety barriers during and removing after\nmechanical harvesting activities are completed, and swiftly\nand efficiently removing and processing debris and waste\nfrom the work area.\n14. damage to the\ncrop\n14.1. Damage may occur during mechanical harvesting by rods,\nbeaters, shakers, blades, belts, chains, wheels and other\nmoving machinery parts, during manual harvesting by long\nfingernails, tearing or cutting the crop when picking, bruising\nor squashing the crop when dropping or tipping it into\ncontainers, and overfilling containers. Protruding nails,\nsplinters or rotting, unemptied crop in containers may damage\nthe crop, as may driving too fast or roughly, leaving filled\ncontainers in the sun too long, frost damage when full\ncontainers are left out overnight and not separating varieties.\n15. sorting and grading\nrequirements\n15.1. Sorting and grading may include removing out of type plants,\nor physically damaged, unhealthy, rotten or immature\nproduce. The crop may be graded according to variety, size,\nlength, colour, maturity, blemishes, bud count and quality,\nwhich are subject to seasonal and market forces. Crop in\ndoubt is checked with supervisors. Any out-of-standard\nproduce should be disposed of according to farm policy.\n16. storage conditions\n16.1. Storage requirements may include high humidity, cold\ntemperature and controlled atmosphere storage, supplying\nproduce with water after harvest e.g., asparagus and roses,\ncontrolling gases and temperature in storage to speed up\nmaturity e.g., ethylene gas to ripen bananas and improve the\ncolour of citrus, and coating with wax or wrapping in plastic.\n17. Crop to be\ntransported\n17.1. The crop may be transported by trailer, forklift, truck or other\nspecialised methods of transport.\n18. destinations\n18.1. Destinations for harvested crop may include points of sale or\nsites for further treatment.\n\n--- PDF PAGE 76 ---\nTR - Horticulture NC III\n\n- 72 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nprepared for crop harvesting activities\n1.2.\nmaintained harvest requirements\n1.3.\nmonitored crop quality throughout harvest\n1.4.\ndelivered the crop according to quality specifications.\nThe skills and knowledge required to co-ordinate crop harvesting\nmust be transferable to a different work environment. For example,\na person who can co-ordinate crop harvesting on a property\nproducing citrus should be able to transfer that knowledge and skill\nto another workplace although different crops, such as tomatoes,\nmay be present.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nrecognition of the maturity parameters of a range of crops\n2.2.\nfarm quality procedures and characteristics of a crop relative\nto varying market requirements\n2.3.\ngrading characteristics of each crop\n2.4.\nthe importance of maintaining quality of produce including\ncooling requirements and quick transport from field to\nprocessing areas\n2.5.\nindustry wage rates and conditions, contractors services,\nconditions and rates\n2.6.\nlicensing requirements for use of forklifts, trucks and\nmachinery\n2.7.\nthe effect of adverse climatic conditions (e.g., rain, hail,\nextreme wind, or very high ultraviolet radiation), which may\nprevent or impede crop harvesting operations, or severly\ninfluence the time taken to complete the tasks necessary to\nfulfill the operation.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate ideas and information to work team members,\nsupervisors, contractors and clients\n3.2.\nutilise proforma reporting, analysis and work procedure\ndocuments, and interpret quality specifications\n3.3.\nmeasure materials, interpret harvest specifications and\nschedules, interpret and apply test results, calculate tallies,\nworking hours, yields and quality results\n3.4.\ncoordinate work group, contractors and own activities to\nsequentially and effectively complete harvest in a timely and\ncost effective manner.\n\n--- PDF PAGE 77 ---\nTR - Horticulture NC III\n\n- 73 -\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with vegetables or fruits that require harvesting\n4.2.\nworkplace information relating to crop harvesting\n4.3.\nfarm procedures relating to crop harvesting\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 78 ---\nTR - Horticulture NC III\n\n- 74 -\nUNIT OF COMPETENCY :\nUNDERTAKE FIELD BUDDING AND GRAFTING\nUNIT CODE\n:\nAGR611318\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to bud and graft\ntrees, shrubs, vines and other plant types in nurseries or in field\nsituations. It requires the ability to perform workplace information to\nidentify grafting requirements, select appropriate material for\nbudding/grafting and prepare materials for budding/grafting plants\naccording to instructions. Budding and grafting requires knowledge\nof basic plant physiology, parts of the plant, rootstocks and scion\nstock, stages of the budding/grafting procedure and their purpose.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare parent\nmaterial for budding\nand grafting\n1.1 Parent plant is prepared and the method of taking budding or\ngrafting material is employed suitable to the species and in\naccordance with organizational procedures.\n1.2 Tools and equipment are free from contamination, and hygiene\npractices are followed in accordance with organizational\nguidelines.\n1.3 Tools appropriate to the task being undertaken are chosen,\nused in accordance with organization guidelines, and safe\nworking practices are employed.\n2. Prepare budding and\ngrafting materials\n2.1 Budding/grafting material is selected for propagation.\n2.2 Viability of materials is maintained by appropriate storage in\naccordance with the proper storage requirements of the\nspecies.\n2.3 Discarded material is disposed of in accordance with\norganizational waste disposal guidelines and/or procedures.\n2.4 Stock is prepared in accordance with species and\norganizational guidelines.\n2.5 Budding/grafting materials and stock are handled in an\nappropriate way to maintain maximum viability.\n3. Bud/graft scion\n3.1 Budding/grafting method is in accordance with species.\n3.2 Bud/graft is sealed.\n3.3 Labels and identification are correct and applied in accordance\nwith organizational guidelines.\n3.4 Records are completed accurately and at the required time in\naccordance with organizational guidelines.\n3.5 Out-of-specification process and equipment performance is\nidentified, rectified and/or reported.\n4. Complete budding/\ngrafting activities\n4.1 Equipment is cleaned as required.\n4.2 Unused grafting material is disposed of/stored according to\ncompany procedures.\n4.3 Waste generated by both the grafting and cleaning procedures\nis collected, treated, disposed of or recycled according to\ncompany procedures.\n4.4 Workplace information is recorded in the appropriate format.\n\n--- PDF PAGE 79 ---\nTR - Horticulture NC III\n\n- 75 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. budding or grafting\nmaterials\n1.1.\nMaterials may include cuttings, buds, dormant or green\nmaterial, nursery rootstock, rootlings, and mature plants.\n2. equipment\n2.1.\nEquipment may include secateurs and grafting knife.\n3. budding/grafting\nmethods\n3.1.\nBudding/grafting methods may include T buds, chip, wedge,\nand side bark.\n4. seals\n4.1.\nSeals may include tape, fungicides, paint, and wax.\n5. workplace\ninformation\n5.1.\nWorkplace information can include standard operating\nprocedures (SOPs), specifications, production\nschedules/instructions, routine maintenance schedules, work\nnotes, Material Safety Data Sheets (MSDS), manufacturers\ninstructions or verbal direction from the manager, supervisor\nor senior operator.\n\n--- PDF PAGE 80 ---\nTR - Horticulture NC III\n\n- 76 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate:\n1.1.\nbudded and grafted plants according to enterprise standards\nThe skills and knowledge required to bud and graft in filed situations\nmust be transferable to a range of work environments and contexts.\nFor example, this could include different budding and grafting\ntechniques, plant materials and enterprise requirements.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below:\n2.1.\nbasic plant physiology including the principles of transpiration,\nwater intake, nutrient uptake, photosynthesis, respiration and\ntranslocation\n2.2.\nparts of the root, trunk, shoot and fruit systems of the plant,\ntheir role in how the plant works and their contribution to\nflower/fruit/foliage quality\n2.3.\nroot stocks and scion stock\n2.4.\nimportance of selection and use of rootstock\n2.5.\nstages of the budding/grafting procedure and their purpose\n2.6.\ncommon problems and corrective action required\n2.7.\noperation, components and purpose of budding/grafting and\nequipment\n2.8.\nprocedures and responsibilities for reporting problem\n2.9.\nenvironmental issues and controls\n2.10. cleaning requirements of work area and equipment\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\naccess workplace information to identify grafting requirements\n3.2.\nselect, fit and use appropriate personal protection clothing\nand/or equipment\n3.3.\nselect appropriate material for budding/grafting\n3.4.\nprepare material for grafting\n3.5.\nselect and prepare equipment as required\n3.6.\nbud/graft plants according to instructions\n3.7.\noperate equipment safely\n3.8.\ntreat plants after budding/grafting\n3.9.\nstore unused grafting material\n3.10. take corrective action in response to out-of-specification\nresults or non-compliance\n3.11. sort, collect, treat, recycle or dispose of waste as required\n3.12. clean equipment after use.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with plant material for budding and grafting\n4.2.\ntools and materials used for budding and grafting\n4.3.\nenterprise procedures.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nThrough direct observation /demonstration\n5.2.\nPortfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 81 ---\nTR - Horticulture NC III\n\n- 77 -\nUNIT OF COMPETENCY :\nUNDERTAKE PROPAGATION ACTIVITIES\nUNIT CODE\n:\nAGR611319\nUNIT DESCRIPTOR :\nThis unit covers the skills and knowledge required for plant\npropagation in enterprises involved in nursery operations and crop\nproduction. Competency is demonstrated by the application of\nknowledge and skills to a range of propagation tasks, such as\npreparing parent plant stock, collecting propagation materials, pre-\nplanting treatments and basic plant propagation techniques. This\nunit does not include budding and grafting. The work is carried out\nwithin routine methods and procedures under supervision with\nintermittent checking. Responsibility for some roles and\ncoordination within a team may be required.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for plant\npropagation\n1.1\nWorkplace information is interpreted and clarified according\nto instructions.\n1.2\nOHS hazard in the work area are identified, rectified and/or\nreported.\n1.3\nSuitable personal protective equipment (PPE) is selected,\nused, maintained and stored.\n1.4\nTools and equipment appropriate to the task being\nundertaken are selected and prepared according to enterprise\nguidelines.\n1.5\nPropagation material is collected using the appropriate\nmethod for the species and according to enterprise guidelines.\n1.6\nPropagation material is maintained and stored to ensure\nmaximum viability.\n2. Propagate plants\n2.1\nPre-treatment is applied and/or carried out appropriate to the\npropagation method and species.\n2.2. Propagation techniques are carried out according to the\nrequirements of the species.\n2.3\nPropagation material is handled in a way that minimises\ndamage and maximises viability.\n2.4\nWater and nutrients are applied to suit the media conditions,\nplant requirements and propagation techniques employed.\n2.5\nLabels are applied according to enterprise guidelines.\n2.6\nPlant health is monitored and remedial action is taken\naccording to enterprise guidelines.\n2.7\nPropagation activities are carried out according to OHS\nrequirements.\n3. Complete\npropagation activities\n3.1\nRecords are completed accurately and at the required time\naccording to enterprise guidelines.\n3.2\nTools and equipment are cleaned and stored according to\nmanufacturer specifications and enterprise guidelines.\n3.3\nWaste is removed and hygiene practices are followed\naccording to enterprise and OHS requirements.\n\n--- PDF PAGE 82 ---\nTR - Horticulture NC III\n\n- 78 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. workplace\ninformation\n\n1.1.\nPlanting program, production statistics, Standard Operating\nProcedures (SOPs), specifications, work notes, Material\nSafety Data Sheets (MSDSs), industry guidelines,\nmanufacturer’s instructions, product labels, or verbal\ndirections from manager, snupervisor, or senior operator.\n2. OHS hazards\n2.1.\nHazards may include manual handling, hazardous\nsubstances, moving equipment and vehicles, sharp hand\ntools, solar radiation, slippery or uneven surfaces, and insect\nand spider bites.\n3. personal protective\nequipment (PPE)\n3.1.\nPersonal protective clothing and equipment may include\nrespirators, overalls, boots, gloves, sun hat and sunscreen\nlotion.\n4. tools and\nequipment\n4.1.\nTools and equipment may include secateurs, knives and other\ncutting instruments, plastic containers and trays, wheelbarrow,\ntrolley, mechanical trolley, shovel, water spray container,\ndibblers and rubbish bins.\n5. propagation\nmaterials to be\ncollected\n5.1.\nCollection procedures for propagation materials may include\ntaking leaf or stem or root cuttings, gathering seeds, lifting\nbulbs, and dividing clumps.\n6. maintenance and\nstorage\n6.1.\nMaintenance and storage procedures may include controlling\nenvironmental parameters such as moisture, air, humidity and\ntemperature by methods such as refrigeration, wrapping in\nwet, drenching, placing in water and burying in sawdust or\nother media.\n7. pre-treatments\n7.1.\nPre-treatments may include hormones, fungicides, cold/moist\nstratification, rehydration, heat or chemical \u0001 isinfestations,\nbreaking seed coat, cleaning, division and sterilisation.\n8. propagation\ntechniques\n8.1.\nPropagation techniques may include seed – (small seed sown\nin modules and pricked out or sown in seedbeds by hand),\ncuttings – (hardwood stem, semi-ripe stem, leaf, root), simple\nlayering, growing on tissue-cultured plants, division or\nsplitting, spores.\n9. label information\n9.1.\nLabel information may include date of propagation, species,\nvariety, batch number and cultivar, treatments applied, strike\nrate.\n10. remedial action\n10.1. Remedial action may include applying preventative fungicides,\nfertilisers, removing and disposing of damaged plant material,\nirrigation.\n\n--- PDF PAGE 83 ---\nTR - Horticulture NC III\n\n- 79 -\nVARIABLE\nRANGE\n11. OHS\nrequirements\n11.1. OHS requirements may include identifying hazards, assessing\nand reporting risks, cleaning, maintaining and storing tools\nand equipment, appropriate use of personal protective\nequipment including sun protection, safe operation of tools\nand equipment, safe handling, use and storage of chemicals\nand hazardous substances, correct manual handling; basic\nfirst aid, personal hygiene and reporting problems to\nsupervisors.\n12. records\n12.1. Records may include date of propagation, type of propagation\ncarried out, number of plants carried out, source of\npropagation material, treatments carried out, spray records\n13. waste\n13.1. Waste may include unused propagation material, potting\nmedia wastage, damaged plants, and damaged pots.\n14. hygiene practices\n14.1. Hygiene practices may include removing all dirt and organic\nmatter from production surfaces, tools and equipment,\ndisinfecting production surfaces, tools and equipment,\ndisinfestations and removal of plant and media waste, hand\nwashing, footbaths, access restrictions and handling practices\nwhich minimise cross contamination.\n\n--- PDF PAGE 84 ---\nTR - Horticulture NC III\n\n- 80 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate :\n1.1.\nperformed propagation activities in such a manner as to\nsatisfy the workplace or client requirements.\nThe skills and knowledge required to undertake propagation\nactivities must be transferable to a different work environment. For\nexample, this could include different species, plant types,\nenvironments and propagation techniques.\n2. Underpinning\nKnowledge and\nAttitudes\n\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below.\n2.1.\nMaintenance requirements of tools and equipment used for\npropagation.\n2.2.\nOHS requirements of employees.\n2.3.\nQuality specifications/characteristics of a range of parent\nplants and propagation materials.\n2.4.\nBasic plant nutrition.\n2.5.\nRecord keeping relevant to the work function.\n2.6.\nEnterprise requirements for handling and disposal of nursery\nwastes.\n2.7.\nEnterprise hygiene requirements.\n2.8.\nCommon problems that may occur while performing\npropagation activities in a controlled environment.\n2.9.\nPropagation methods required for a range of plants.\n2.10. OHS legislative requirements.\n2.11. OHS procedures.\n3. Underpinning\nSkills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\nread and interpret instructions.\n3.2.\nparticipate in teams and contribute to team objectives.\n3.3.\ncommunicate effectively with fellow team members.\n3.4.\ncarry out a variety of propagation techniques.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with commercial propagation facilities\n4.2.\ntools, equipment and materials required for propagation\nactivities\n4.3.\nenterprise procedures.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\nAssessment should be in a workplace or in a simulated workplace.\n6.1.\nThe assessment condition requires using at least two\npropagation techniques\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 85 ---\nTR - Horticulture NC III\n\n- 81 -\nELECTIVE COMPETENCIES\n\nUNIT OF COMPETENCY :\nFOLLOW SITE QUARANTINE PROCEDURES\nUNIT CODE\n:\nAGR611325\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to follow\nenterprise site quarantine procedures that are designed to reduce\nthe likelihood of pathogenic organisms entering the site. Site\nquarantine procedures are followed as a routine part of one’s own\nwork and are applied to visitors to the site. Work is performed under\nsupervision and according to established procedures and policies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to work in\nquarantine site\n1.1\nEnsure personal and/or work vehicles are decontaminated\nbefore entering the quarantine site.\n1.2\nContact with potential contaminants is reported according to\nenterprise requirements\n1.3\nHands are washed before livestock, feed, plant stock or other\nproducts are handled\n1.4\nAppropriate clothing and footwear is put on before\ncommencing work and ‘street clothing’ is securely stored away\nfrom livestock, feed or other agricultural produce.\n2. Work in quarantine\nsite\n2.1\nChemicals for disinfestation and/or medications administered\nto livestock are handled and stored according to workplace\nrequirements.\n2.2\nDifferent feed mixes, soils and/or growing media and/or other\nproducts are kept separately and appropriately marked\naccording to quarantine procedures.\n2.3\nAny cases of pest and disease incidence are identified and\nreported to supervisor.\n2.4\nAny breaches of quarantine procedures are identified and\nreported to supervisor.\n2.5\nAny OHS hazards are identified and appropriate action is\ntaken according to enterprise policy and OHS legislation and\ncodes.\n2.6\nAll waste product is disposed of according to SOP.\n2.7\nAll deceased livestock, unwanted biological material or\ndamaged/infected plant stock are disposed of according to\nSOP.\n2.8\nInformation relating to work in quarantine site is recorded as\nrequired in the SOP.\n\n--- PDF PAGE 86 ---\nTR - Horticulture NC III\n\n- 82 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Assist in maintaining\nsite quarantine\nprocedures\n3.1\nAll visitors are informed of the quarantine procedures and are\nprovided with appropriate clothing and footwear, if required by\nSOP.\n3.2\nAny observed breaches of quarantine procedures by visitors\nare noted and reported to supervisor\n3.3\nGates and doors are kept locked where required by SOP and\nsupervisor instructions\n3.4\nWhere installed, security fencing is maintained according to\nsupervisors instructions\n3.5\nDeliveries to site are checked to ensure that established\nprocedures for vehicle decontamination, unloading and receipt\nand holding or storage of stock and/or supplies are followed\n4. Respond to site\nquarantine breach or\nproblem\n4.1\nThe specific problem and its location is identified and reported\nto supervisor\n4.2\nQuarantine site and location of breach is cleaned and\ndisinfected as required according to the specific nature of the\nproblem and SOP\n4.4\nLivestock, plant stock suspected of being exposed to\ncontaminants are isolated and monitored for evidence of\ncontamination according to SOP.\n4.5\nInformation about the breach or problem is recorded\naccording to SOP\n\n--- PDF PAGE 87 ---\nTR - Horticulture NC III\n\n- 83 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. quarantine site\n1.1.\nThe quarantine site may be the whole farm or enterprise\npremises or part of the premises, such as an isolation area or\nsick bay. In some cases, the quarantine area may extend\nbeyond the enterprise boundaries.\n2. decontamination\n2.1.\nVehicle decontamination may require that all vehicles are\ndriven through a dip of treated solution before entering the\nsite.\n3. potential\ncontaminants\n3.1.\nPotential contaminants may include pathogens entering on\nclothing/footwear, equipment, vehicles or items being\ndelivered to the enterprise. Potential contaminants may also\nenter in foodstuffs, including food for animal or human\nconsumption, vaccines, water or soil, or be brought on to the\nsite by new livestock or pests.\n4. standard operating\nprocedures (SOP)\n4.1.\nThese may include, enterprise quality assurance manual,\nindustry standards and quality assurance programs specific to\nbiosecurity, production schedules, Material Safety Data\nSheets, work notes, product labels, manufacturers\nspecifications, operators manuals, enterprise policies and\nprocedures (including waste disposal, recycling and re-use\nguidelines), OHS procedures, supervisors oral or written\ninstructions, work and routine maintenance plans.\n5. pest\n\n5.1.\nPests can include vertebrate and invertebrate pests, wild birds\nin sheds or housing, dogs, and cats.\n6. diseases\n6.1.\nDiseases can be categorized as fungal, bacterial, viral and\nparasitical.\n7. waste products\n\n7.1.\nWaste products might include feed spills, unused/expired\nvaccine, and biological matter, such as semen, embryos,\ntissue samples, plant cuttings, infected plants, dead birds and\nmanures.\n\n--- PDF PAGE 88 ---\nTR - Horticulture NC III\n\n- 84 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate :\n1.1.\nApplied specific quarantine procedures in place in an\nenterprise and to report any breaches of quarantine to\nsupervisors.\nThe skills and knowledge required to follow site quarantine\nprocedures must be transferable to a different work environment.\nFor example, following site quarantine procedures in different types\nof enterprises or where quarantine is imposed in response to\ndifferent circumstances on different occasions.\n2. Underpinning\nKnowledge and\nAttitudes\n\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nEnterprise site quarantine policy and procedures\n2.2.\nindustry quality assurance requirements (where applicable)\nand documentation required to be kept\n2.3.\nReporting procedures for alleged breaches of site quarantine\nprocedures\n2.4.\nConsequences of breaching site quarantine procedures\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills are:\n3.1.\nRead and/or interpret site quarantine procedures\n3.2.\nFollow procedures\n3.3.\nCommunicate with visitors to the enterprise about site\nquarantine procedures.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace used for commercial livestock or cropping\nproduction, including egg production and milk harvesting, for\nfood purposes\n4.2.\nHACCP plan\n4.3.\nSOP.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nThrough direct observation / demonstration\n5.2.\nPortfolio assessment\n6. Context of\nAssessment\nAssessment should be in a workplace and carried out in conjunction\nwith assessment of other workplace competencies.\n6.1.\nThe assessment condition requires following quality\nassurance procedures as part of workplace tasks.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 89 ---\nTR - Horticulture NC III\n\n- 85 -\nUNIT OF COMPETENCY :\nCOLLECT SAMPLES FOR A RURAL PRODUCTION OR\nHORTICULTURE MONITORING PROGRAM\nUNIT CODE\n:\nAGR611326\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to collect\nsamples as part of a rural production or horticulture monitoring\nprogram or while conducting post-mortem examination of livestock or\nother animals. It requires the ability to plan for collecting, prepare\nequipment and resources, carry out collecting, and complete\ncollecting activities. Collecting samples requires knowledge of\nindustry sampling and preserving guidelines and protocols, types of\ntissue that might be collected, environmental legislation, and\nsampling and preserving methods.\n\nSamples collected will usually be analyzed by laboratory staff,\nalthough collection staff may undertake some tests.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nPlan for collection\nof samples\n1.1\nPurpose and scope of sample collection activity is confirmed\nfrom discussion with supervisor or work instructions.\n1.2\nSample collection schedule is read/heard and confirmed with\nsupervisor.\n1.3\nSampling site location is confirmed and, where required,\napproval obtained for site access following enterprise\nguidelines.\n1.4\nSamples to be collected and preserved are identified in\nconjunction with supervisor or by reference to enterprise\nguidelines.\n1.5\nRange of likely operating conditions, hazards and\ndifficult/sensitive environments are assessed for impact on\nsampling and testing.\n2\nPrepare equipment\nand resources\n2.1\nEquipment required for sampling and preserving is sourced\naccording to sampling procedures.\n2.2\nEquipment is checked for availability and serviceability in\naccordance with enterprise procedures.\n2.3\nData or record sheets/books are collected for use.\n2.4\nEquipment, data sheets and personnel are moved to sampling\nsites without injury or damage and readied for use.\n3\nCarry out sampling\nand preserving\nprocedures\n3.1\nSamples are collected in accordance with sampling plan and\nenterprise procedures and industry protocols/guidelines.\n3.2\nSamples are preserved and recorded in accordance with\nsampling standards and guidelines.\n3.3\nSamples for external analysis are prepared, packaged and\nsent to laboratory in accordance with sampling schedule and\nlaboratory standards.\n3.4\nHazardous materials are packaged and transported in\naccordance with legislative requirements.\n3.5\nObservations including information on the surrounding area\nand environmental conditions are made in accordance with\nmonitoring schedule.\n3.6\nEquipment operation and work practices conform to OHS\nrequirements.\n3.7\nCollection outcomes including presentation of samples are\nreported and delivered in accordance to enterprise guidelines.\n\n--- PDF PAGE 90 ---\nTR - Horticulture NC III\n\n- 86 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4\nComplete sample\ncollection activities\n4.1\nEquipment and clothing is cleaned, sanitised, repaired and\nstored in accordance with enterprise procedures.\n4.2\nDamaged or malfunctioning equipment is repaired on site or\nsent to manufacturer or specialist.\n4.3\nSampling results and observations are accurately recorded on\ndata sheets and forwarded in accordance with enterprise\nprocedures.\n4.4\nChanges in field conditions and equipment are conveyed to\nsupervisor according to enterprise procedures.\n\n--- PDF PAGE 91 ---\nTR - Horticulture NC III\n\n- 87 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. locations\n1.1.\nRural production or horticultural sites, such as paddocks, farm\nbuildings, worksites, nurseries, playing fields, dams, etc.\n2. samples\n2.1.\nA very wide variety of items may be sampled for testing,\nincluding animal tissue or fluids, plants, moulds, pests, water,\nsoil, effluent, and emissions. Samples will generally be taken\nas part of an on-going monitoring program, such as an animal\nhealth program or as part of a post-mortem examination of\nlivestock.\n3. environmental\nlegislation\n3.1.\nActs and regulations pertaining to environment, including\nthreatened species.\n4. equipment\n4.1.\nElectronic machines, probes, grabs, nets, dredges, plankton\nnets, water sample bottles, bailer, still and video cameras,\nspecialised machinery, identification keys and preserving\nequipment, kick seines, containers for holding and sorting\nsamples, plastic buckets, blood/saliva sampling equipment,\nhand-held magnifying glasses, tweezers or forceps, small\nvegetable brushes, wading boots, rubber gloves,\nthermometer, yardstick, sample record and assessment form,\npencils, and clipboard, and relevant field guides.\n5. OHS requirements\n\n5.1.\nCodes of practice, regulations and/or guidance notes, which\nmay apply in a jurisdiction, and enterprise-specific OHS\nprocedures, policies or standards.\n\n--- PDF PAGE 92 ---\nTR - Horticulture NC III\n\n- 88 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\ncollected and preserved biological samples for a given site\naccording to prescribed enterprise procedures, standards and\nprinciples, collecting schedules and industry best practice\nThe skills and knowledge required to collect and preserve samples\nmust be transferable to a range of work environments and contexts.\nFor example, this could include different locations, environments,\nsamples and collecting techniques or sample collection for different\npurposes.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below:\n2.1.\nhydrological cycle\n2.2.\nfield procedures for sampling and preservation\n2.3.\ncollecting equipment and methods\n2.4.\npreservation equipment and processes\n2.5.\nbasic habitat assessment\n2.6.\nwater quality issues\n2.7.\nfauna and flora recognition relevant to sampling activities\n2.8.\nrelevant legislation.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\nunderstand and carry out instructions\n3.2.\nuse and operate relevant tools and equipment\n3.3.\nprepare and package samples for transport to laboratory\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with livestock or cropping production\n4.2.\nequipment and materials used collecting and storing samples\n4.3.\nsampling plan\n4.4.\nenterprise procedures relating to sampling procedures.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time\n\n--- PDF PAGE 93 ---\nTR - Horticulture NC III\n\n- 89 -\nUNIT OF COMPETENCY :\nHANDLE BULK MATERIALS IN STORAGE AREA\nUNIT CODE\n:\nAGR611327\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required This competency\nstandard covers the process of receiving, moving and sampling bulk\nmaterials in a storage area. It includes the use of safety equipment\nand procedures, and the repair of the facility and equipment used to\nstore the bulk materials. Bulk materials are handled to industry\nstandards in relation to segregation and storage conditions ensuring\nminimum loss or damage and optimum returns. The handling of\nbulk materials in storage areas is likely to be carried out under\nlimited supervision. Overall progress may be checked periodically.\nThe handling of bulk materials in storage areas will usually follow\nset routines, methods and procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to work in\nbulk materials\nstorage area\n1.1\nWork undertaken is interpreted from the work program where\nnecessary, and confirmed with the management.\n1.2\nOHS hazards are identified, risks assessed and suitable\ncontrols implemented.\n1.3\nSuitable personal protective clothing and equipment is\nselected, used and maintained.\n1.4\nTools and equipment suitable for the work to be undertaken\nare selected, checked, and maintained if necessary.\n1.5\nEnvironmental implications of undertaking work in the bulk\nmaterials storage area are identified, likely outcomes\nassessed and if necessary responsible action taken.\n1.6 Worker be informed what to do in case this type of emergency\nor things happen.\n2. Sample bulk\nmaterials for testing\n2.1\nRepresentative samples of bulk materials are taken for\ntesting in line with the requirements of the bulk materials\nstorage program.\n2.2\nSampling is undertaken safely, following the prescribed\nguidelines for the activity.\n2.3\nRepresentative bulk materials samples are prepared for\ndispatch, accurately and clearly labelled, and packaged\naccording to the guidelines of the organization and the\nanalysing body.\n2.4\nSamples are dispatched to the analysing body, according to\nthe requirements of the bulk materials storage program.\n\n--- PDF PAGE 94 ---\nTR - Horticulture NC III\n\n- 90 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Move bulk materials\ninto and out of\nstorage\n3.1 Bulk materials for handling and storage are correctly identified\nfrom the written or verbal instructions.\n3.2\nBulk materials are segregated according to type, variety and\nquality characteristics according to the requirements of the\norganization as stated in the bulk materials storage program.\n3.3\nMeasures are taken to minimize insect and weed infestation\nand contamination during the movement of the bulk\nmaterials. Fumigation.\n3.4\nBulk materials are regularly checked for insect infestation and\ncontamination during movement according to enterprise\nrequirements.\n3.5\nAny storage and handling equipment that is used is\nthoroughly cleaned after emptying, and dismantled if\nnecessary, according to the procedures of the organization\nand the nature of the equipment.\n3.6\nBulk materials are moved into and out of storage according to\nthe procedures of the organization, and following the\nprescribed OHS procedures.\n3.7\nSilo types and handling equipment are selected for each bulk\nmaterial type in relation to their storage characteristics and\nflow properties and according to the requirements of the bulk\nmaterials storage program.\n3.8\nSuitable measures are implemented to minimize the affect of\ndesiccant dusts on the flow properties of bulk materials. If\nhave dust collector, the better.\n3.9\nRecords are clearly and accurately updated and stored as\nand when required by the bulk materials storage program.\n4. Repair and maintain\nstorage facility\n4.1\nThe need for repairs to the facility is identified through\nobservation or instruction.\n4.2\nMaintenance and repairs are conducted according to the\nrequirements of the organization and following the prescribed\nOHS procedures and taking into account environmental\nconsiderations.\n4.3\nCompleted maintenance records and other appropriate\ninformation are documented in accordance with enterprise\nrequirements.\n4.4\nWorkshop and work areas are cleaned and maintained to\nOHS and enterprise requirements.\n4.5\nMaintenance and repairs, damage, malfunctions or irregular\nperformance in machinery, tools and equipment are reported\nin line with organizational requirements.\n4.6\nTools and equipment are cleaned, secured and stored in line\nwith OHS and organizational requirements\n\n--- PDF PAGE 95 ---\nTR - Horticulture NC III\n\n- 91 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. bulk materials\n1.1.\nThese might be any crop harvested in the organization (e.g.,\ncereals, legumes, pulse crops, oilseeds and pasture seeds),\nanimal feed or fertilizers.\n2. OHS hazards\n2.1.\nAmongst the risks are operating and maintaining machinery\nand equipment, including hydraulics and exposed moving\nparts, noise, organic and other dusts, working with,\ntransporting and storing hazardous substances (such as\npesticides), using fumigants, working at heights, and working\non the bulk materials mass.\n2.2.\nPotential emergency situations may include:\n2.3.\ninclement weather during operations, machinery breakdowns,\nstorm damage to equipment and site.\n3. OHS risk\nThe range of actions are both systemic and at an operational level.\nThese are listed below.\n3.1.\nSystems should be in place to ensure the safe operation and\nmaintenance of machinery and equipment. Precautions\nshould also be in place to minimize exposure to noise and\norganic and other dusts. Systems and procedures for\nhandling and storing bulk materials, as well as working with\nand around electricity should also be in place.\n3.2.\nFixtures should be in place in all silos and storage sheds,\nincluding appropriate access ladders, handrails and ladder\ncages.\n3.3.\nPersonal protective equipment should be selected, used and\nmaintained.\n3.4.\nEnvironmental conditions should be controlled e.g., , keeping\nmoisture levels as low as possible will reduce the likelihood of\nfire and silo collapse.\n3.5.\nProcedures should be in place and used for working on top of\nstored bulk materials, working with bulk materials mass\nmovement and stability, working within confined working\nspaces, moving vehicles, working at height.\n3.6.\nRecord keeping practices should ensure that requirements are\nmet in relation to properly observing and using product labels\nand MSDS sheets, instruction manuals and written\norganizational procedures.\n4. personal\nprotective clothing\nand equipment\n4.1.\nBoots, hat/hard hat, overalls, gloves, protective eyewear,\nhearing protection, respirator or face mask, and sun protection\n(sun hat, sun screen).\n5. Samples to be taken\nfor testing\n5.1.\nBulk materials sampling occurs at receipt of bulk materials,\nregularly throughout the storage process, and immediately\nbefore dispatch.\n\n--- PDF PAGE 96 ---\nTR - Horticulture NC III\n\n- 92 -\nVARIABLE\nRANGE\n6. bulk materials\nstorage program\n6.1.\nThe program will provide details of the bulk materials to be\nstored, the timeframes involved, the locations for storage, the\nrecording and documentation requirements, the scheduling of\nthe operation, the responsibility of the various operators to be\ninvolved, the method of pest control and the method of\nsampling and where samples should be sent. Details of the\nrequirements to minimize or eliminate OHS risks, the\nlegislative requirements in relation to all activities undertaken\nduring bulk materials quality maintenance activities, and\nchemical handling procedures and guidelines would also be\ncovered in the program.\n6.2.\nThe bulk materials storage program would also ensure that\nequipment and personnel arranged for operations are\nappropriate to the requirements of various legislation and may\ninclude equipment for detection of fumigant in atmosphere,\nconfined spaces equipment, pressure testing equipment,\nfumigant/inert atmosphere pressure bottles, fumigant\ngeneration equipment, personal protection.\n7. equipment to be\nrequired for sampling\n7.1.\nEquipment such as testing apparatus, sampling, measuring\nand sieving equipment, operational charts, calibration and\nidentification samples, and enterprise/ client instructions.\n8. testing and analysis\n8.1.\nThe bulk materials may be tested for purity, germination,\nvigour, seed weight, and/or disease identification, it may also\nbe analyzed for moisture, insects (live and dead), weed and\nother commodity seeds, other foreign matter, cracked bulk\nmaterials, weather affected bulk materials, and bulk materials\nsize.\n9. contamination\n9.1.\nThese may include moulds, moisture, mites, weeds, foreign\nseeds, insects, fungal diseases, soil and other foreign\nmaterial.\n10. storage and\nhandling\nequipment\n10.1. Handling equipment used includes silo conveyors, elevators,\nchutes, and augers. Other equipment used may include\ntractors, front-end loaders, computing equipment used by\nenterprise, two-way radio/ telephone, wall charts and other\nvisual recording methods, warning devices, and\nventilation/aeration equipment. Handling equipment may also\nbe manual.\n11. movement\n11.1. Bulk materials movements may be for the purposes of receipt,\ndispatch, aeration, treatment and/or blending of bulk materials\ngrades.\n12. vehicles to be\nused to move the\nbulk materials\n12.1. Vehicles may be trucks, articulated road vehicles, trailers and\nappropriate unloading methods applied to each type of\nvehicle. Vehicles may also be pulled by animal power.\n13. records\n13.1. Records kept may include those relating to quantities and\ngrade(s) of materials stored, bulk materials movements and\ncartage documentation, weigh tally sheets, equipment and\noperations log sheets, and stock checks.\n14. storage facility\n14.1. The storage facility covers all types of temporary and\npermanent storage.\n\n--- PDF PAGE 97 ---\nTR - Horticulture NC III\n\n- 93 -\nVARIABLE\nRANGE\n15. equipment that\nrequire checking\nand maintenance\n15.1. Equipment which includes mechanical units integral to bulk\nmaterials handling equipment, e.g., gear boxes, bearings and\noil levels.\n16. environmental\nimplications\n16.1. Negative environmental impacts may result from excessive\nnoise and exhaust emissions, the incorrect use and disposal\nof maintenance debris (oils containers, chemical residues),\ndust, and hazardous substances (e.g., fuel). Impacts may\nalso include run-off flows of water and cleaning agents from\nservicing, maintenance and cleaning activities.\n17. appropriate\ninformation\n17.1. Tools, spares and equipment usage, and maintenance and\nservicing details.\n18. documented\ninformation\n18.1. Record keeping systems used may be either paper-based or\ndigital, and information will be recorded into logbooks or other\nrecords.\n\n--- PDF PAGE 98 ---\nTR - Horticulture NC III\n\n- 94 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nhandled bulk materials in the storage area\n1.2.\nminimized contaminants and pests\n1.3.\nmoved bulk materials efficiently\nThe skills and knowledge required to handle bulk materials in a\nstorage area must be transferable to a different work environment.\nFor example, across a range of pest and contaminant types that may\noccur in differing geographic locations or with different bulk\nmaterials.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nthe client’s sampling and classification requirements\n2.2.\nbulk materials types and characteristics\n2.3.\ncommon bulk materials pests sand problems\n2.4.\nappropriate legislative requirements, manufacturers\ninstructions and enterprise procedures/instructions\n2.5.\nappropriate action in contingency situations\n2.6.\nsilo operations and configuration, machinery and operating\npractices\n2.7.\norganization requirements for protective equipment and safe\npractices in relation to OHS\n2.8.\norganization and industry guidelines for segregation of bulk\nmaterials quality assurance principles\n2.9.\npre-operational and safety checks, servicing and maintenance\nprocedures for tools and equipment\n2.10. potential hazards associated with the operation of basic tools\nand equipment\n2.11. general machine maintenance procedures\n2.12. machinery operating principles and operating methods\n2.13. machinery storage and protection methods\n2.14. relevant Provincial/municipal legislation, regulations and\ncodes of practice with regard to workplace OHS, and the use\nand control of machinery and equipment\n2.15. environmental impacts associated with the operation of\nmachinery and equipment\n2.16. personal protective clothing and equipment and when and\nhow it should be used\n2.17. cleaning and storage of machinery, equipment and materials\n2.18. enterprise recording and reporting procedures.\n\n--- PDF PAGE 99 ---\nTR - Horticulture NC III\n\n- 95 -\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\nrecord bulk materials stocks and movements\n3.2.\nconduct silo readings\n3.3.\nidentify bulk materials pests and damage\n3.4.\nuse communication systems\n3.5.\nsample and conduct a simple analysis of bulk materials\n3.6.\ncheck equipment and storage facilities and identify current or\nimpending faults\n3.7.\nhandle and manoeuvre equipment\n3.8.\ntest bulk materials for moisture, contamination and quality\n3.9.\ncomplete pre-operational checks on basic tools and\nequipment\n3.10. perform routine safety, service and maintenance procedures\non tools, equipment and machinery\n3.11. operate hand and independently powered tools and cleaning\nequipment to industry standards\n3.12. clean, secure and store machinery and equipment\n3.13. handle hazardous substances (fuels) safely\n3.14. read and interpret manufacturers specifications, work and\nmaintenance plans, and Material Safety Data Sheets\n3.15. interpret and apply task instructions, communicate with work\nteam and supervisor, and record and report faults, workplace\nhazards and accidents\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with bulk handling facilities for example for storing\nfeeds, harvested crop or fertilizers\n4.2.\nworkplace information relating to quality assurance, bulk\nhandling and storage.\n4.3.\nenterprise procedures relating to load shifting, and storage.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nchecking supporting workplace records.\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 100 ---\nTR - Horticulture NC III\n\n- 96 -\nUNIT OF COMPETENCY :\nPREPARE GRAIN STORAGES\nUNIT CODE\n:\nAGRA611328\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to safely\nmaintain the site, the storage and equipment for handling, and\nstorage of bulk materials. At the completion of the work described\nin this standard, storages, surrounding areas and equipment are\nprepared in readiness for receiving grain at an acceptable level of\nhygiene.\n\nWork is likely to be under routine supervision with intermittent\nchecking. Responsibility for some roles and co-ordination within a\nteam may be required. Preparing bulk material storages is usually\nwithin established routines, methods and procedures. Competency\nat this level involves the application of knowledge and skills in the\nmaintenance of facilities, tools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to work in\nbulk material storage\narea\n1.1\nWork to be undertaken is understood from work program where\nnecessary, and confirmed with supervisor.\n1.2\nOHS hazards are identified, risk assessed and suitable\ncontrols implemented.\n1.3\nSuitable personal protective equipment is selected, used\nand maintained.\n1.4\nTools and equipment suitable for the work to be undertaken\nare selected, checked and maintained, if necessary.\n1.5\nEnvironmental implications of undertaking work in the bulk\nmaterial storage area are identified, likely outcomes assessed\nand, if necessary, responsible action taken.\n2. Prepare storage area 2.1\nStorage site is cleaned of weeds, dust and spillage to\norganization requirements.\n2.2\nRefuse is disposed of according to regulatory requirements.\n2.3\nSite is maintained in a clean and tidy condition according to\norganization requirements.\n2.4\nStorage site is prepared according to OHS standards.\n3. Prepare storages\n3.1\nStorages are prepared according to OHS standards.\n3.2\nBulk material storages are cleaned of all residues according to\norganization requirements.\n3.3\nBulk material storages are checked for structural safety,\ndamage or deterioration, and repaired or reported as required\naccording to organization requirements.\n3.4\nTemporary storages are prepared and erected to meet the\nneeds of the organization according to OHS standards.\n\n--- PDF PAGE 101 ---\nTR - Horticulture NC III\n\n- 97 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Prepare bulk material\nhandling machinery\n4.1\nBulk material handling machinery is cleaned free of\ncontamination and residues according to organization\nrequirements.\n4.2\nBulk material handling equipment is adjusted and set according\nto organization requirements.\n4.3\nBulk material handling equipment is prepared ready for use\naccording to manufacturers instructions and OHS standards.\n5. Complete\nmaintenance\noperations\n5.1\nWorkplace information is recorded clearly and accurately in\nthe format and at the time required by the organization.\n5.2\nWaste is collected and disposed of or recycled to minimise\ndamage to the external environment.\n5.3\nTools and equipment are cleaned and stored according to\norganization work procedures.\n\n--- PDF PAGE 102 ---\nTR - Horticulture NC III\n\n- 98 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OHS hazards\n1.1.\nAmong the risks are operating and maintaining machinery and\nequipment, including hydraulics and exposed moving parts,\nnoise, organic and other dusts, working with, transporting and\nstoring hazardous substances (such as pesticides), using\nfumigants, working at heights, and working on the bulk\nmaterial mass.\n2. OHS risk\nThe range of actions are both systemic and at an operational level.\nThese are listed below.\n2.1.\nSystems should be in place to ensure the safe operation and\nmaintenance of machinery and equipment. Precautions\nshould also be in place to minimise exposure to noise and\norganic and other dusts. Systems and procedures for\nhandling and storing bulk material, as well as working with and\naround electricity, should also be in place.\n2.2.\nFixtures should be in place in all silos and storage sheds,\nincluding appropriate access ladders, hand rails and ladder\ncages and fine control equipment.\n2.3.\nEnvironmental conditions should be controlled. For example,\nkeeping moisture levels as low as possible will reduce the\nlikelihood of fire and silo collapse.\n2.4.\nProcedures should be in place and used for working on top of\nstored bulk material, working with bulk material mass\nmovement and stability, working within confined working\nspaces, moving vehicles, and working at height.\n2.5.\nRecord keeping should ensure that requirements in relation to\nproperly observing and using product labels and MSDS\nsheets, instruction manuals and written organizational\nprocedures.\n3. personal protective\nclothing and\nequipment\n3.1.\nBoots, hat/hard hat, overalls, gloves, protective eyewear,\nhearing protection, respirator or face mask, and sun protection\n(sun hat, sun screen).\n4. equipment\n4.1.\nCleaning equipment for hand use, air compressors, vacuum\ncleaners, mobile load handling plant, mowers/slashers,\nloading and unloading equipment, tractors, and portable\naugers, fire suits and hydrants should be in place.\n5. Preparation for\ncleaning and mobile\nequipment?\n5.1.\nSite cleaning and mobile equipment use includes pre-\noperational checks, start-up, shutdown, and minor servicing to\norganization requirements.\n6. bulk materials\n6.1.\nBulk materials stored may include the entire range produced\nor used by the organization and may include grains (cereals,\nlegumes, pulses, oilseeds, or pasture seeds), animal feed\n(e.g. meal), flour and fertilizers.\n7. storage\n7.1.\nThey may be permanent and/or temporary storages, fixed\nand/or portable commodity handling equipment, the\nsurrounding areas, entry, exit and site roads.\n8. cleaning activities\n8.1.\nThey are the handling of equipment, storage facilities,\nbuildings and surrounding grounds.\n\n--- PDF PAGE 103 ---\nTR - Horticulture NC III\n\n- 99 -\nVARIABLE\nRANGE\n9. cleaning and\nmaintenance\n9.1.\nOn the storage site, it will be aspects of site tidiness and\ncleanliness, weed control, and cleaning of spilled materials\nand rubbish.\n10. Maintained\n10.1. The presence of water or water damage, presence and\nactivity of pests including insects, moulds, birds and rodents,\ndead vertebrate pest in storage, breakdown of storage\nsecurity and integrity, e.g. holes, cracks, poor sealing or\ngeneral physical deterioration, storm damage, and/or level of\nhygiene will need to be seen to.\n11. workplace\ninformation\n11.1. Records may include environmental parameters, date of\nmaintenance work, and what has been checked/maintained.\n12. waste\n12.1. Waste may include left over treatments, unused containers,\ngeneral debris, or discarded components.\n13. external environment 13.1. Environmental implications may include the contamination of\noff-site ground water or soils from solids, debris, nutrients or\nchemicals, foul smell should be reduced, air pollution.\n14. organizations and\nstatutory instructions\n14.1. They might be those relating to health and safety, quality\ncontrol, administrative reporting, commodity storage and\nmovement control, residual fumigants and confined space\nentry.\n15. Potential emergency\nsituations\n15.1. Inclement weather during operations, machinery breakdowns,\nand storm damage to equipment and site & workers not in\ngood condition to work.\n\n--- PDF PAGE 104 ---\nTR - Horticulture NC III\n\n- 100 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate\n1.1.\nprepared bulk material storages - that the storage facility, the\nsurrounding area, and the bulk material handling equipment\nare cleaned, operable, and within the hygiene standards\nrequired by the organization.\nThe skills and knowledge required to prepare bulk material storages\nmust be transferable to a different work environment. For example,\nacross a range of storage facility types, materials and enterprise\nguidelines.\n2. Underpinning\nKnowledge and\nAttitudes\n\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nrange of construction methods, potential hazards, safety and\nstructural requirements for storage\n2.2.\nerection/dismantling for types of temporary storage used by\norganization\n2.3.\norganization and commodity quality requirements\n2.4.\n.organization hygiene requirements\n2.5.\ntypical signs of damage to be documented and reported\n2.6.\nappropriate legislative requirements, manufacturers\ninstructions and organization procedures/ instructions\n2.7.\nappropriate action in contingency situations\n2.8.\norganization requirements for protective equipment and safe\npractices in relation to OHS\n2.9.\npre-operational and safety checks, servicing and maintenance\nprocedures for tools and equipment\n2.10. potential hazards associated with the operation of basic tools\nand equipment\n2.11. general machine maintenance procedures\n2.12. machinery operating principles and operating methods/manual\nof operational procedures.\n2.13. machinery storage and protection methods\n2.14. relevant Provincial/municipal legislation, regulations and\ncodes of practice with regard to workplace OHS, and the use\nand control of machinery and equipment\n2.15. environmental impacts associated with the operation of\nmachinery and equipment\n2.16. personal protective clothing and equipment and when and\nhow it should be used\n2.17. cleaning and storage of machinery, equipment and materials\n2.18. organization recording and reporting procedures.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese skills are:\n3.1.\nerect simple temporary bulk material storages\n3.2.\nuse communication systems\n3.3.\ncheck equipment and storage facilities, and identify current or\nimpending faults\n3.4.\nhandle and manoeuvre equipment\n3.5.\ncomplete pre-operational checks on basic tools and\n\n--- PDF PAGE 105 ---\nTR - Horticulture NC III\n\n- 101 -\nequipment\n3.6.\nperform routine safety, service and maintenance procedures\non tools, equipment and machinery\n3.7.\noperate hand and independently powered tools and cleaning\nequipment to industry standards\n3.8.\nclean, secure and store machinery and equipment\n3.9.\nperform basic trouble shooting\n3.10. recognize and rectify minor operational faults\n3.11. handle hazardous substances (fuels) safely\n3.12. read and interpret manufacturers specifications, work and\nmaintenance plans, and Material Safety Data Sheets\n3.13. interpret and apply task instructions, communicate with work\nteam and supervisor, and record and report faults, workplace\nhazards and accidents.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with grain storage facilities\n4.2.\nmechanical or manual aids for load shifting\n4.3.\nenterprise procedures.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nThrough direct observation / demonstration\n5.2.\nPortfolio assessment\n6. Context of\nassessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 106 ---\nTR - Horticulture NC III\n\n- 102 -\nUNIT OF COMPETENCY :\nCOMPLY WITH INDUSTRY QUALITY ASSURANCE\nREQUIREMENTS\nUNIT CODE\n:\nAGR611329\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to comply with\nindustry quality assurance requirements in the production of meat,\nmilk or eggs. It requires the ability to implement quality assurance\npractices on food safety, quality, and animal welfare, biosecurity,\nimplement standard operating procedures, and report problems that\naffect quality. Complying with industry quality assurance\nrequirements requires knowledge of industry quality assurance\nrequirements, animal production processes, Hazard Analysis\nCritical Control Point (HACCP) approach to quality assurance, and\nenterprise policies, guidelines and standard operating procedures\nrelating to food safety, quality and animal welfare.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Implement quality\nassurance practices\non food safety and\nquality, biosecurity\nand animal welfare\n1.1 Elements of the industry quality assurance requirements are\ndetermined.\n1.2 Hazards to food safety and quality are identified for work area\naccording to enterprise guidelines and standard operating\nprocedures.\n1.3 Critical control points for work area are determined according to\nworkplace procedures.\n1.4 Record keeping is completed according to industry QA\nrequirements.\n2. Implement standard\noperating procedures\n2.1 Standard operating procedures are implemented in accordance\nwith enterprise requirements.\n2.2 Non-conforming or defective product reported to supervisor\naccording to enterprise/industry requirements.\n2.3 Corrective action taken in accordance with enterprise policy and\nprocedures.\n3. Report problems that\naffect quality\n3.1 Recognize potential or existing quality problems.\n3.2 Identify instances of variation in quality from specifications or\nwork instructions.\n3.3 Report variation and potential problems to supervisor/manager\naccording to enterprise guidelines.\n\n--- PDF PAGE 107 ---\nTR - Horticulture NC III\n\n- 103 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. food\n1.1.\nMeat, milk and eggs.\n2. elements of the QA\nsystem\n2.1.\nThese include Hazard Analysis Critical Control Point (HACCP)\ncharts, mission statement, work instructions, corrective action\nand monitoring procedures, standard operating procedures,\nenterprise and industry policies and codes of practice.\n3. hazards\nThese may include:\n3.1.\nPhysical hazards where foreign objects such as retained,\nbroken needles, welding rods, nails or wire are present in\nanimals.\n3.2.\nChemical hazards resulting from residues such as antibiotics,\npesticides, alkaloids and other substances used in animal\nproduction.\n3.3.\nBiological hazards where contamination from other animals\n(e.g. mice, rats, cats), poor housing/transport conditions, and\ndirty water affects animal health and food quality.\n3.4.\nFood quality hazards resulting from poor handling of animals,\nunhealthy or diseased animals, inappropriate use of dogs,\nextreme weather conditions, poor loading and transport\nconditions, and time off feed.\n\n--- PDF PAGE 108 ---\nTR - Horticulture NC III\n\n- 104 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\ncomplied with industry quality assurance requirements in an\nanimal production enterprise.\nThe skills and knowledge required to comply with industry quality\nassurance requirements must be transferable to a range of work\nenvironments and contexts. For example, this could include different\nanimals, production systems, and industry QA requirements.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below:\n2.1.\nindustry QA requirements, such as the Philippine Pig Industry\nQuality Program (APIQ)\n2.2.\nanimal production processes\n2.3.\nHACCP (Hazard Analysis Critical Control Point) approach to\nquality assurance\n2.4.\nenterprise policies, guidelines and standard operating\nprocedures (SOP’s) relating to food safety quality, biosecurity,\nand animal welfare.\n2.5.\nenterprise OHS requirements\n2.6.\nanimal health and welfare.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\nimplement quality assurance practices on food safety and\nquality, biosecurity and animal welfare\n3.2.\nimplement standard operating procedures\n3.3.\nreport problems that affect quality.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace that produces meat, eggs or milk (requiring a\nHACCP food safety plan)\n4.2.\nHACCP plan\n4.3.\nenterprise procedures HACCP and food safety\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time\n\n--- PDF PAGE 109 ---\nTR - Horticulture NC III\n\n- 105 -\nUNIT OF COMPETENCY :\nMAINTAIN AND MONITOR ENVIRONMENTAL WORK\nPRACTICES\nUNIT CODE\n:\nAGR611330\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to maintain and\nmonitor positive environmental work practices. It requires the ability\nto recognize basic environmental hazards and threats. It includes\nthe ability to follow and give workplace directions and instructions\nby communicating accurately with supervisors and workplace\ncolleagues, and to keep records. Maintaining and monitoring\nenvironmental work practices requires awareness of, and an ability\nto implement relevant environmental legislation, policies and\nworkplace/industry practices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain workplace\nenvironmental\nprocedures\n1.1\n Workplace procedures and work instructions for integrated\nenvironmental work practices for own work area are\nrecognized, followed and conveyed to team members.\n1.2\nRelevant legislation, codes and national standards that\nimpact on workplace environmental practices are recognized,\nconveyed to team members and followed.\n2. Recognize and\nreport on potential\nenvironmental threats\n2.1\nExisting and potential environmental risks and hazards are\nidentified, reported to designated personnel and dealt with.\n2.2\nLocation and extent of the potential environmental threat are\naccurately recorded.\n2.3\nReports on the potential environmental threat are completed\naccording to enterprise guidelines.\n3. Support continuous\nimprovement of\nenvironmental work\npractices\n3.1\nInformation is gathered and improvements are suggested to\nsupport the development of improved environmental workplace\npractices.\n3.2\nEnvironmental issues and their relationship to workplace\npractices are discussed in the workplace.\n3.3\nChanges to workplace approaches to environmental\npractices are responded to positively and promptly in\naccordance with enterprise requirements.\n3.4\nIndividuals/teams are informed of the results of environmental\nimprovements in the workplace.\n3.5\nEnvironmental training needs of the work team are identified,\nand training is sought where required.\n4. Maintain\nenvironmental\nrecords\n4.1 Environmental records are accurately and legibly maintained\nand stored securely in a form accessible for reporting purposes.\n4.2 Internal and external reporting procedures are identified and\nmaintained.\n\n--- PDF PAGE 110 ---\nTR - Horticulture NC III\n\n- 106 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. workplace\nprocedures\n1.1.\nThese could include written procedures or work instructions\nfor environmental hazard and risk identification, avoiding or\nminimising environmental risks, improving environmental\nperformance, waste minimisation and segregation, environ-\nmental monitoring, signs and labels (e.g. chemical labels),\nemergency procedures, hazard and incident recording and\nreporting procedures, and environmental data recording and\nreporting procedures where applicable. Verbal instructions\nfrom persons with responsibility related to environmental work\npractices are also included in this definition.\n2. environmental\npolicies\n2.1.\nWaste minimisation and management, sustainability, local,\nregional, State and National strategies on weed and pest\nmanagement, protection of land and habitat and the\nconservation of resources, energy use, greenhouse gas\nemissions, use of chemicals, and plant and equipment.\n3. recognize and follow\nmean\n3.1.\nThat a person will acknowledge that environmental impacts,\nhazards and risks exist, and that they have a responsibility to\nwork in a manner which will minimize the impact on the\nenvironment within the guidelines established by the\nworkplace.\n4. legislation, codes\nand national\nstandards\n4.1.\nAward and enterprise agreements, relevant environmental\nlegislation from all levels of government, Philippine standards,\ninternational agreements and relevant industry codes of\npractice.\n5. report\n5.1.\nVerbally (face-to-face or through communication equipment)\nand in writing (notes, faxes, email or electronic messages).\n6. environmental risks\nand hazards\n6.1.\nThese could include spills, leaks, pollution, planned and\nunplanned emissions, soil compaction, disturbance and\nerosion, accidents and disposal of waste, and damage or\ndisruption to ecosystems resulting from work practices. Also\nincludes plants, animals or diseases that are classified as an\nenvironmental threat or problem in an area, unauthorised\nchanges in land use, fire risks and threats, and inappropriate\nhuman interaction on the environment. This may include\ndamage to habitat resources, disruption of animal behaviour\nand territorial use, illegal vegetation clearance, seed\ncollection, firewood gathering, nest disturbance and egg\ncollecting.\n7. designated personnel\nin a workplace?\n7.1.\nManager, supervisor, and people who are responsible for\nwork area or who may be assigned to act as a mentor/trainer\nto a person under instruction.\n8. suggestions\n8.1.\nIdeas to minimize hazards and risks, reduce waste, make\nmore efficient use of resources and improve environmental\nperformance, reduce soil disturbance and improve habitat\nresources.\n9. environmental issues 9.1.\nSustainability, reduction and disposal of waste, water quality,\nenergy efficiency, biodiversity and habitat protection,\nconservation of natural resources, air quality, land\ncontamination, noise, soil and salinity management, and fire\nmanagement.\n\n--- PDF PAGE 111 ---\nTR - Horticulture NC III\n\n- 107 -\nVARIABLE\nRANGE\n10. workplace\napproaches to\nenvironmental\npractices\n10.1. Preventing and minimising the production of pollution (e.g.\ndischarges to air, land and water, hazardous waste, reducing\n‘burning off’, composting, recycling materials, conservation\npractices), and improving workplace maintenance practices\n(e.g. using a broom instead of a hose, using environment-\nfriendly cleaning agents).\n11. environmental\nrecords\n11.1. Environmental data, maintenance and inspection reports,\nincident or accident reports, and complaints from the public.\n\n--- PDF PAGE 112 ---\nTR - Horticulture NC III\n\n- 108 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nmonitored and maintained environmental work practices - that\nskills and knowledge have been successfully and\nappropriately applied and demonstrated in a work place or\nequivalent situation\nThe skills and knowledge required to monitor and maintain\nenvironmental work practices must be transferable to a range of\nwork environments and contexts. For example, this could include\ndifferent workplaces, environmental hazards and risks, and\nworkplace practices and procedures.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below:\n2.1.\nrelevant legislation from all levels of government on\nenvironmental issues\n2.2.\nrelevant environmental policies and workplace/industry\npractices and procedures\n2.3.\ngood practice approaches relevant to work area particularly in\nregard to minimising environment hazards and risks, and\nimproving environmental performance\n2.4.\nenvironmental issues, especially in regard to water\ncatchments, air, noise, ecosystems, habitat, efficient use of\nresources, sustainability and waste minimisation\n2.5.\npotential environmental threats and problems relevant to a\ngiven region and occupation\n2.6.\ngeneral work place practices and their potential impact on the\nenvironment.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\ncommunicate with supervisors and workplace colleagues\n3.2.\nrecognize environmental hazards and threats\n3.3.\nact upon environmental hazards and threats by following\nenterprise procedures legislative requirements\n3.4.\ninstruct/advise others to follow enterprise procedures and\nlegislative requirements\n3.5.\nfollow workplace directions and instructions\n3.6.\nkeep environmental records.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace\n4.2.\nenterprise policies and environment related procedures\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nchecking workplace records and production plans\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time\n\n--- PDF PAGE 113 ---\nTR - Horticulture NC III\n\n- 109 -\nUNIT OF COMPETENCY :\nKEEP RECORDS FOR A FARM BUSINESS\nUNIT CODE\n:\nAGR611331\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required. This\ncompetency standard covers the process of creating and\nmaintaining physical records, preparing and processing basic\nfinancial transactions, establishing and maintaining a cashbook,\nand reconciling and preparing invoices within primary production\nbusinesses. Both the physical and financial records of the business\nare vital for use by management for planning purposes, meeting\nlegislative requirements, and the efficient operation of the business\non a daily basis.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and store\nphysical records\n1.1\nPhysical records and inventories required for the\norganization are determined in consultation with the\nmanagement team.\n1.2\nMethods for collecting information are reliable, and time\nand resources are used efficiently.\n1.3\nAppropriate interpersonal skills are used to access relevant\ninformation from individuals and teams.\n1.4\nInformation is organized into a format suitable for analysis,\ninterpretation and dissemination in accordance with\norganizational requirements.\n1.5\nBusiness equipment/technology is used to maintain\ninformation in accordance with organizational and OHS\nrequirements.\n1.6\nRecords are updated and stored in accordance with\norganizational requirements.\n2. Process petty cash\ntransactions\n2.1\nPetty cash claims and vouchers are checked for accuracy\nand authenticity prior to processing.\n2.2\nPetty cash transactions are processed and recorded in\naccordance with organizational requirements.\n2.2\nPetty cash book balanced in accordance with organizational\nrequirements.\n3. Establish and\nmaintain a cash book\nin accordance with\norganizational\nrequirements\n3.1\nCash receipts and payments book created, and\ndocumentation relating to financial transactions checked\nfor validity prior to processing.\n3.2\nCashbook balances reconciled with bank and creditor\nstatements.\n3.3\nCashbook balances are used to complete legislative\nreporting requirements.\n3.4\nCash flow statements are prepared on the basis of\nsummarised cashbook entries.\n\n--- PDF PAGE 114 ---\nTR - Horticulture NC III\n\n- 110 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Reconcile invoices\nfor payment to\ncreditors\n4.1\nAdjustments and errors are identified, reported and rectified in\naccordance with organizational requirements.\n4.2\nInvoices processed and payment made in accordance with\norganizational requirements.\n5. Prepare invoices for\ndebtors\n5.1\nInvoices are prepared accurately and, if required, distributed\nto nominated person for verification prior to despatch.\n5.2\nAdjustments are made as required in accordance with\norganizational requirements.\n5.3\nInvoices and other related documents copied and filed in\naccordance with organizational requirements for taxation and\nauditing purposes.\n\n--- PDF PAGE 115 ---\nTR - Horticulture NC III\n\n- 111 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. physical records\n\n1.1.\nRecords may include a property plan, livestock, paddock\ntreatments including spraying, paddocks, rainfall, production,\nsales data, supplies, machinery and equipment, and stock.\n2. management\nteam\n2.1.\nThey may be oneself, family members, fellow managers,\nemployees, professional advisors, partners, and mentors.\n3. methods for\ncollecting\ninformation\n\n3.1.\nMethods for collecting information may include observation\nand listening, previous file records, individual research,\nstatistics and reports from other organizations, producing\nreports from data collected on the farm, translating data from\ndiaries and note-books, or professional data collection\nagency.\n4. interpersonal skills\n\n4.1.\nInterpersonal skills may include effective listening, open\nquestioning techniques, verbal and non verbal communication\nskills, appropriate body language, and the ability to relate to\npeople from a range of social, cultural and ethnic backgrounds\nand physical and mental abilities.\n5. format\n5.1.\nFormat for records and inventories could include maps,\ngraphs, charts, cards, electronic, databases, diaries, or\nnotebooks.\n6. business\nequipment/\ntechnology\n6.1.\nBusiness equipment and technology that might be used\ninclude computer, software, Internet, email, calculator, fax or\nphone.\n7. checking for\naccuracy and\nauthenticity\n7.1.\nChecking may include correct information on voucher, receipt\nof purchase, and ensuring items are business related.\n8. cashbook\n8.1.\nA cashbook documents the daily receipts and payments of the\nbusiness. It may be created and maintained manually and/or\nelectronically.\n9. documentation\nrequires checking\nfor validity\n9.1.\nDocumentation may include cheques, taxation invoices,\naccounts, and credit card vouchers.\n9.2.\nValidity may include checking date, signature, details on\ncheque are correct, expiry date of credit cards, information on\ntaxation invoice, and accounts are accurate.\n10. legislative\nreporting\nrequirements\n10.1. Legislative reporting requirements may include recording\nPhilippine Business Number (ABN), business activity\nstatements (BAS), instalment activity statements (AIS), PAYG\nwithholding, superannuation, taxation, or work cover.\n11. cash flow\nstatements\n11.1. Cash flow statements summarise the organizations actual and\nexpected cash flow over designated periods of time. Budgets\nallocate income against expenses. Both types of statements\ncan be created manually or electronically.\n12. creditors and\ndebtors\n12.1. Creditors and debtors may include financial institutions, goods\nand service suppliers, rural merchants, contractors,\nprofessional advisors, and co-operatives.\n\n--- PDF PAGE 116 ---\nTR - Horticulture NC III\n\n- 112 -\nVARIABLE\nRANGE\n13. taxation and\nauditing\nrequirements\n13.1. Taxation and auditing requirements would include accurate\nrecords of all business assets, liabilities, income, expenses\nand entitlements to be analyzed by an accountant for\ncompliance purposes.\n14. transactions\n14.1. Financial transactions may include purchasing and selling\nproducts, machinery and equipment, vehicles and supplies,\nbanking cheques, paying invoices and bills, or transferring\nfunds electronically.\n\n--- PDF PAGE 117 ---\nTR - Horticulture NC III\n\n- 113 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\ncreated, maintained and stored financial records in\naccordance with legislative and organizational requirements.\n1.2.\nprocessed and recorded financial transactions involving cash,\nelectronic funds transfer, cheques and invoices accurately in\naccordance with legislative and organizational requirements\nThe skills and knowledge required to keep records in a rural\nbusiness must be transferable to a different work environment. For\nexample, across a wide range of small, medium and large\nagricultural and horticultural businesses.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nnature of the business and its legal and organizational\nstructure\n2.2.\nrelevant national, provincial and municipal government\nlegislative requirements, especially in regard to OHS and\nenvironmental requirements\n2.3.\norganizational policies and procedures relating to the\ndistribution of workplace information, legal and ethical\nobligations\n2.4.\nmethods to identify sources of information\n2.5.\nprocedures to analyze information to identify patterns and\ntrends\n2.6.\nthe organizations record keeping/filing systems, security of\ninformation and safe record keeping procedures\n2.7.\nprinciples of effective interpersonal communication\n2.8.\nprinciples and procedures for cash and non cash handling\n2.9.\nprinciples of single entry accounting, and cash flow\nstatements.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\nrelate to people from a range of social, cultural and ethnic\nbackgrounds, and of varying physical and mental abilities\n3.2.\ncollect and record accurate and reliable information\n3.3.\npresent data in a format suitable for the organizations\nrequirements\n3.4.\nuse business equipment and technology correctly and safely\n3.5.\nfile records accurately in accordance with organizational\nrequirements\n3.6.\nperform calculations and balance accounts\n3.7.\nprepare cash flow statements and budgets\n3.8.\nreconcile creditors invoices and prepare debtors invoices\n3.9.\nprocess forms and other documentation.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace\n4.2.\nsource records for farm\n4.3.\nfarm procedures processing income and expenses, and\nreporting\n\n--- PDF PAGE 118 ---\nTR - Horticulture NC III\n\n- 114 -\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time\n\n--- PDF PAGE 119 ---\nTR - Horticulture NC III\n\n- 115 -\nUNIT OF COMPETENCY :\nPERFORM SPECIALISED MACHINERY AND EQUIPMENT\nMAINTENANCE\nUNIT CODE\n:\nAGR611332\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to maintain\nspecialised machinery and equipment. Specialised machinery and\nequipment refers to machinery and equipment used principally in\nagriculture and horticulture, work where there is high wear and tear\non components. It requires the ability to carry out engine and\nequipment checks, undertake transmission checks, maintain high\nwear components and attachments, and record maintenance work.\nPerforming specialized machinery maintenance requires knowledge\nof general machine function principles and maintenance, and\noperational replacement wear component requirements and\nprocedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Carry out\nprimemover checks\n1.1\nRegular primemover checks are carried out on specialised\nmachinery and equipment as specified in operator’s\nmanual. After use check-up.\n1.2\nAll relevant grease or lubricant points are lubricated according\nto manufacturers’ specifications. Regular periodic check-up.\n1.3\nOils and filters are changed at intervals prescribed in\noperator’s manual.\n1.4\nSystems (i.e. cooling, electrical, lubrication, etc.) checked for\ndeterioration and defects acted upon in line with supervisor’s\ninstructions.\n1.5\nOHS hazards in the workplace are identified, risk assessed\nand reported according to enterprise requirements.\n2. Carry out\ntransmission checks\n2.1\nDrive and steering clutches are checked for operation and\nadjustment in line with operator’s manual.\n2.2\nTransmission oil levels are checked in line with operator\nmanual.\n2.3\nTracks/wheels and undercarriage are checked for oil leaks,\nwear and alignment.\n2.4\nFaulty seals or leaks are identified and corrective actions\ntaken according to operator’s instructions.\n2.5\nTransmission is regularly checked for: alignment in case of\nbelt transmission oil levels in case of enclosed transmission.\n\n--- PDF PAGE 120 ---\nTR - Horticulture NC III\n\n- 116 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Maintain components\nand attachments\n3.1\nSuitable personal protective equipment is selected, used,\nmaintained and stored according to OHS requirements.\n3.2\nMachine operational replacement wear components are\nchecked for wear and condition.\n3.3\nWorn or unserviceable replacement components are replaced\nas part of daily routines.\n3.4\nComponent inspection and replacement activities are\ncompleted safely following enterprise and industry guidelines.\n3.5\nMoving operational components are checked for wear and\ncondition and adjusted to the tolerances specified in the\noperator’s manual where applicable.\n3.6\nWork areas are cleaned, returned to operating condition and\nmaintained according to enterprise and OHS requirements.\n4. Record maintenance\n4.1\nIdentified faults and defects are recorded in machine record.\n4.2\nMaintenance procedures including duplicates usage are\nrecorded in workshop record.\n4.3\nService or repair requirements are reported and acted upon\naccording to prescribed procedures.\n\n--- PDF PAGE 121 ---\nTR - Horticulture NC III\n\n- 117 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. specialised\nmachinery and\nequipment\n1.1.\nSelf-propelled machinery and equipment for crop production\n(i.e. land levellers, front end loaders); harvesting (i.e. cane\nharvester, rice combine, corn harvester, etc.) and post-harvest\nmachinery (i.e. rice mill plant, drying plant, etc.)\n2. primemovers\n2.1.\nThis may include the internal combustion engines or electric\nmotors.\n3. hazards\n3.1.\nWorkplace hazards may include exposure to loud noise and\nfumes, solar radiation, dust, and hazardous substances. It\nmay also include oil and grease spills, electricity, mechanical\nmalfunctions and entanglement with machinery and\nequipment from exposed moving parts including hydraulics.\n4. personal\nprotective\nequipment\n4.1.\nThis may include boots, hat/hard hat, overalls, gloves,\nprotective eyewear, safety harness, hearing protection,\nrespirator or dust mask, and sun protection (sun hat,\nsunscreen).\n5. OHS\n\nSafe systems and procedures for:\n5.1.\noperating and maintaining machinery and equipment including\nhydraulics and guarding of exposed moving parts.\n5.2.\nhazard and risk control.\n5.3.\nmanual handling including lifting and carrying.\n5.4.\nthe provision of safety decals and signage.\n5.5.\nhandling, application and storage of hazardous substances.\n5.6.\noutdoor work including protection from solar radiation, dust\nand noise.\n5.7.\nlock out or danger tag procedures.\n5.8.\nprotection of people in the workplace.\n5.9.\nthe appropriate use, maintenance and storage of personal\nprotective clothing and equipment.\n6. regular\nmaintenance\nchecks\n\n6.1.\nGauges, fan, engine oil, air cleaners (wet and dry), visible\ngaskets, exhaust colour, tyres, tracks, track rollers and\ncarriers, fuel and oil filters, crankcase ventilation, cooling\nsystems, belts and chains, transmission, gearbox, hydraulic\nhoses, hydraulic systems, final drives, oilers, batteries and\nelectrical systems, level linkage wear, oil and fuel leaks,\nbrakes, Rollover Protection Systems/safety guards, guards\nover exposed parts, sources of hazardous noise.\n7. machinery and\nequipment\nmaintenance\n7.1.\nOperating checks, daily checks, programmed maintenance,\nbreakdown maintenance, prescribed lubrication.\n8. transmission\n8.1.\nClutches, gearbox, direct drive and power shaft transmission,\ntorque converter, final drives, includes universal Joints, drive\nlinks.\n9. tracks/wheels and\nundercarriage\n9.1.\nSprockets, idler wheels, track roller frames, track rollers,\ncarrier rollers, track chains, track shoes and grousers, tyre\npressure, power transfer links and abnormal wear patterns.\n10.engine equipment\n10.1. Oil/coolant levels, filters, oil, air, fuel, and air conditioner.\n11.machine\noperational\nreplacement wear\ncomponents\n11.1. Ground engaging components, buckets, blades, cutter teeth\nand forks and other components specified in the operator’s\nmanual.\n12.moving\noperational\ncomponents\n12.1. Elevator and loading chains, cutters/knives, belts and other\ncomponents specified in the operator’s manual.\n\n--- PDF PAGE 122 ---\nTR - Horticulture NC III\n\n- 118 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nMaintained specialised machinery and equipment according to\nenterprise guidelines and industry best practice\nThe skills and knowledge required to maintain specialised machinery\nand equipment must be transferable (normal and adverse work\nconditions) to a range of work environments and contexts. For\nexample, this could include different machinery and equipment,\noperational systems, maintenance procedures and working\nenvironments\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below.\n2.1.\nEngine function principles.\n2.2.\nTurbo charging and after cooling.\n2.3.\nAssessing engine specifications in line with power\nrequirements.\n2.4.\nAll engine electric and hydraulic indicators and gauges.\n2.5.\nTransmission and drive systems.\n2.6.\nSafety including relevant OHS issues, OHS legislative\nrequirements and Codes of Practice.\n2.7.\nMachinery and equipment operation principles.\n2.8.\nOHS responsibilities of employees and employers.\n2.9.\nHazard identification and control.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\nread and comprehend operator’s manuals\n3.2.\ncarry out engine/equipment checks\n3.3.\ncarry out transmission checks.\n3.4.\nmaintain machinery and equipment components.\n3.5.\nrecord maintenance.\n4. Resource Implication\n\n4.1.\nSpecialised equipment\n4.2.\nManufacturer specifications\n4.3.\nOperator guidelines/manuals\n4.4.\nTools and equipment used for maintenance\n4.5.\nSpare parts and materials used in maintaining specialised\nmachinery\n4.6.\nMaintenance procedures\n4.7.\nWorkplace documentation\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nThrough portfolio evidence\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions. It should address a range of equipment that is\nreflective of the workplace.\n\n--- PDF PAGE 123 ---\nTR - Horticulture NC III\n\n- 119 -\nUNIT OF COMPETENCY :\nINSTALL IRRIGATION SYSTEMS\nUNIT CODE\n:\nAGR611333\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to install\npressurised irrigation systems. It requires the ability to organize\nresources for installation work, set out and prepare site, install\nirrigation components, complete installation work, commission\nirrigation systems and communicate with work team members,\nsupervisors, contractors and consultants. Installing irrigation\nsystems requires knowledge of methods and techniques of\nirrigation, components of an irrigation system, behaviour of water on\nvarying terrain and soil types, soil water retention testing techniques\nand soil characteristics, and enterprise OHS procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Organize resources\nfor installation work\n1.1\nMaterials, tools, equipment and machinery are selected\naccording to the irrigation system design requirements and\nenterprise work procedures.\n1.2\nThe construction site for the irrigation system and\nconstruction method is identified according to the site and\nirrigation system plans and enterprise work procedures.\n1.3\nParts and equipment delivered to site are checked according\nto system drawings and specifications.\n1.4\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and enterprise work procedures.\n1.5\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.6\nSuitable safety and personal protective equipment (PPE)\nare selected, used and maintained.\n1.7\nWater supply is checked to ensure that it is compatible with\nsystem specifications.\n2. Set out and prepare\nsite\n2.1\nMeasurement and marking out of irrigation lines are consistent\nwith the plan.\n2.2\nTrenches where constructed are at the specified depth without\ndamage to services, facilities, features and established plants.\n2.3\nEquipment operation and work practices conform to enterprise\nand legislative OHS requirements.\n2.4\nRegulations and legislation relevant to the situation are\nobserved.\n2.5\nWork practices reflect sustainable horticulture principles and\nrespond to local community requirements.\n\n--- PDF PAGE 124 ---\nTR - Horticulture NC III\n\n- 120 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Install irrigation\ncomponents\n3.1\nPlan is interpreted and where applicable, contractors are\nsupervised and work is monitored to conform to the plan.\n3.2\nComponents are assembled and connected according to the\nplan, joints are completed and tested according to\nmanufacturers specifications.\n3.3\nFittings and valves are fitted and adjusted to the requirements\nof the installation plan, and all joints are secured according to\nenterprise guidelines.\n3.4\nA clean and safe work area is maintained while installation\nwork is carried out.\n3.5\nTools appropriate to the task being undertaken are chosen\nand used according to guidelines and safe working practices\nare employed.\n4. Complete installation\nwork\n4.1\nEarthworks are finished off to plan specifications and\nenterprise work procedures.\n4.2\nThe system configuration and capacity matches the\ninstallation plan.\n4.3\nThe site is restored and waste material is removed from the\nsite and disposed of in an environmentally aware and safe\nmanner according to enterprise work procedures.\n4.4\nTools, equipment and machinery are cleaned, maintained and\nstored according to enterprise work procedures\n5. Commission\nirrigation system\n5.1\nStart-up sequence is in accordance with operations manual.\n5.2\nSystem is flushed as required.\n5.3\nOperating faults are identified and corrective actions taken\naccording to the operations manual.\n5.4\nTesting and monitoring equipment are calibrated to\nmanufacturers specifications.\n5.5\nWork outcomes are recorded or reported to the supervisor\naccording to enterprise work procedures.\n\n--- PDF PAGE 125 ---\nTR - Horticulture NC III\n\n- 121 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. materials\n1.1.\nMaterials may include irrigation system components, glues,\nwelds, and construction and backfill materials.\n2. tools, equipment\nand machinery\n2.1.\nTools, equipment and machinery may include surveying and\nlevelling equipment such as automatic level, laser level,\ndumpy level, Cowley level, staff, boning rods, pegs, notebook,\npencil and calculator; hand tools such as rakes, shovels,\nspades, rollers, wheelbarrows, hoses and hose fittings;\nmachinery such as bobcats, ditch witches, backhoes, front-\nend loaders, graders, mechanical rollers, trucks, hydraulic\ntrailers, and tractors and 3-point linkage equipment, pumps\nand pump fittings, and fitting and welding tools appropriate to\nthe irrigation system.\n3. irrigation systems\n3.1.\nIrrigation systems may include mains pressure, low pressure,\nbelow ground, above ground, spray systems, dripper, and\ncapillary systems.\n4. enterprise work\nprocedures\n4.1.\nWork procedures may include supervisors oral or written\ninstructions, installation program, enterprise standard\noperating procedures (SOPs), specifications, routine\nmaintenance schedules, work notes, product labels and\nMaterial Safety Data Sheets (MSDS), manufacturers service\nspecifications and operators manuals, waste disposal,\nrecycling and re-use guidelines, and OHS procedures.\n5. irrigation\nequipment\n5.1.\nIrrigation equipment may include pumps, motors, delivery\nequipment, sprays, system controllers, injectors, tensiometers,\nprobe tubes, flow meter, pressure gauge, computer and/or\nother scheduling devices, recycling equipment, and spray\nequipment.\n6. OHS hazards\n6.1.\nHazards may include disturbance or interruption of services,\nsolar radiation, dust, noise, soil and waterborne micro-\norganisms, chemicals and hazardous substances, manual\nhandling, moving vehicles, machinery and machinery parts,\nuneven surfaces and flying and falling objects.\n7. safety equipment\n7.1.\nSafety equipment may include signage and barriers.\n8. PPE\n8.1.\nPPE may include hat, boots, overalls, gloves, goggles,\nrespirator or face mask, face guard, hearing protection,\nsunscreen lotion and hard hat.\n9. water supplies\n9.1.\nWater supplies may be underground, mains or surface\nstorage including fixtures such as dams, bores, windmills,\ntanks, and channels.\n\n--- PDF PAGE 126 ---\nTR - Horticulture NC III\n\n- 122 -\nVARIABLE\nRANGE\n10. OHS requirements\n10.1. OHS requirements may include identifying hazards, assessing\nrisks and implementing controls, cleaning, maintaining and\nstoring tools, equipment and machinery; appropriate use of\nPPE including sun protection, safe operation of tools,\nequipment and machinery, safe handling, use and storage of\nchemicals and hazardous substances, correct manual\nhandling, basic first aid, personal hygiene and reporting\nproblems to supervisors.\n11. clean and safe\nwork area\n11.1. Tasks may include disabling unused tools, equipment and\nmachinery and storing neatly out of the way of installation\nactivities, safely storing materials on site, using signage and\nsafety barriers during and removing after construction\nactivities are completed, and swiftly and efficiently removing\nand processing debris and waste from the work area.\n12. waste material\n12.1. Waste material may include unused construction and\nexcavated materials, and plant debris, litter and broken\ncomponents.\n12.2. Plant-based material may be mulched or composted, plastic,\nmetal, paper-based materials may be recycled, re-used,\nreturned to the manufacturer or disposed of according to\nenterprise work procedures.\n12.3. Waste may be removed to designated areas for recycling,\nreuse, return to the manufacturer or disposal.\n13. testing equipment\n13.1. Testing equipment may include pressure gauges and flow\nmeters.\n\n--- PDF PAGE 127 ---\nTR - Horticulture NC III\n\n- 123 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nPrepared for installation, set out the installation works,\ninstalled and tested the irrigation system and cleaned- up the\nsite\nThe skills and knowledge required to install an irrigation system must\nbe transferable to a different work environment. For example, this\ncould include different types of irrigation systems and components,\nwater supplies, soil types and enterprises.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nmethods and techniques of irrigation\n2.2.\ncomponents of an irrigation system\n2.3.\ncharacteristics and operation of joints, valves and sprinkler\ncomponents\n2.4.\noperation of pumps and water flow rates\n2.5.\nbehaviour of water on varying terrain and soil types\n2.6.\nsoil water retention testing techniques\n2.7.\nwater quality and water filtration techniques\n2.8.\ncalculations for installing irrigation systems\n2.9.\nsoil characteristics\n2.10. enterprise OHS procedures.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\norganize resources for installation work\n3.2.\nset-out and prepare site\n3.3.\ninstall irrigation components\n3.4.\ncomplete installation work\n3.5.\ncommission irrigation system\n3.6.\ncommunicate with work team members, supervisors,\ncontractors and consultants\n3.7.\nimplement and follow relevant enterprise OHS and\nenvironmental policies and procedures.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace site onto which to install irrigation system\n4.2.\ntools, equipment and materials used in installing irrigation\n4.3.\nirrigation design plan\n4.4.\nenterprise procedures relating to irrigation installations and\nsite work.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nchecking workplace records and production plans (portfolio)\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 128 ---\nTR - Horticulture NC III\n\n- 124 -"
