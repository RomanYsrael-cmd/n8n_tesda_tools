        "source_text": "AGR611318\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to bud and graft\ntrees, shrubs, vines and other plant types in nurseries or in field\nsituations. It requires the ability to perform workplace information to\nidentify grafting requirements, select appropriate material for\nbudding/grafting and prepare materials for budding/grafting plants\naccording to instructions. Budding and grafting requires knowledge\nof basic plant physiology, parts of the plant, rootstocks and scion\nstock, stages of the budding/grafting procedure and their purpose.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare parent\nmaterial for budding\nand grafting\n1.1 Parent plant is prepared and the method of taking budding or\ngrafting material is employed suitable to the species and in\naccordance with organizational procedures.\n1.2 Tools and equipment are free from contamination, and hygiene\npractices are followed in accordance with organizational\nguidelines.\n1.3 Tools appropriate to the task being undertaken are chosen,\nused in accordance with organization guidelines, and safe\nworking practices are employed.\n2. Prepare budding and\ngrafting materials\n2.1 Budding/grafting material is selected for propagation.\n2.2 Viability of materials is maintained by appropriate storage in\naccordance with the proper storage requirements of the\nspecies.\n2.3 Discarded material is disposed of in accordance with\norganizational waste disposal guidelines and/or procedures.\n2.4 Stock is prepared in accordance with species and\norganizational guidelines.\n2.5 Budding/grafting materials and stock are handled in an\nappropriate way to maintain maximum viability.\n3. Bud/graft scion\n3.1 Budding/grafting method is in accordance with species.\n3.2 Bud/graft is sealed.\n3.3 Labels and identification are correct and applied in accordance\nwith organizational guidelines.\n3.4 Records are completed accurately and at the required time in\naccordance with organizational guidelines.\n3.5 Out-of-specification process and equipment performance is\nidentified, rectified and/or reported.\n4. Complete budding/\ngrafting activities\n4.1 Equipment is cleaned as required.\n4.2 Unused grafting material is disposed of/stored according to\ncompany procedures.\n4.3 Waste generated by both the grafting and cleaning procedures\nis collected, treated, disposed of or recycled according to\ncompany procedures.\n4.4 Workplace information is recorded in the appropriate format.\n\n--- PDF PAGE 79 ---\nTR - Horticulture NC III\n\n- 75 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. budding or grafting\nmaterials\n1.1.\nMaterials may include cuttings, buds, dormant or green\nmaterial, nursery rootstock, rootlings, and mature plants.\n2. equipment\n2.1.\nEquipment may include secateurs and grafting knife.\n3. budding/grafting\nmethods\n3.1.\nBudding/grafting methods may include T buds, chip, wedge,\nand side bark.\n4. seals\n4.1.\nSeals may include tape, fungicides, paint, and wax.\n5. workplace\ninformation\n5.1.\nWorkplace information can include standard operating\nprocedures (SOPs), specifications, production\nschedules/instructions, routine maintenance schedules, work\nnotes, Material Safety Data Sheets (MSDS), manufacturers\ninstructions or verbal direction from the manager, supervisor\nor senior operator.\n\n--- PDF PAGE 80 ---\nTR - Horticulture NC III\n\n- 76 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate:\n1.1.\nbudded and grafted plants according to enterprise standards\nThe skills and knowledge required to bud and graft in filed situations\nmust be transferable to a range of work environments and contexts.\nFor example, this could include different budding and grafting\ntechniques, plant materials and enterprise requirements.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below:\n2.1.\nbasic plant physiology including the principles of transpiration,\nwater intake, nutrient uptake, photosynthesis, respiration and\ntranslocation\n2.2.\nparts of the root, trunk, shoot and fruit systems of the plant,\ntheir role in how the plant works and their contribution to\nflower/fruit/foliage quality\n2.3.\nroot stocks and scion stock\n2.4.\nimportance of selection and use of rootstock\n2.5.\nstages of the budding/grafting procedure and their purpose\n2.6.\ncommon problems and corrective action required\n2.7.\noperation, components and purpose of budding/grafting and\nequipment\n2.8.\nprocedures and responsibilities for reporting problem\n2.9.\nenvironmental issues and controls\n2.10. cleaning requirements of work area and equipment\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\naccess workplace information to identify grafting requirements\n3.2.\nselect, fit and use appropriate personal protection clothing\nand/or equipment\n3.3.\nselect appropriate material for budding/grafting\n3.4.\nprepare material for grafting\n3.5.\nselect and prepare equipment as required\n3.6.\nbud/graft plants according to instructions\n3.7.\noperate equipment safely\n3.8.\ntreat plants after budding/grafting\n3.9.\nstore unused grafting material\n3.10. take corrective action in response to out-of-specification\nresults or non-compliance\n3.11. sort, collect, treat, recycle or dispose of waste as required\n3.12. clean equipment after use.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with plant material for budding and grafting\n4.2.\ntools and materials used for budding and grafting\n4.3.\nenterprise procedures.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nThrough direct observation /demonstration\n5.2.\nPortfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 81 ---\nTR - Horticulture NC III\n\n- 77 -\nUNIT OF COMPETENCY :\nUNDERTAKE PROPAGATION ACTIVITIES\nUNIT CODE\n:"
