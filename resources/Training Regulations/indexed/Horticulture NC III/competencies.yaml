        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidences that the candidate :\n1.1.\nApplied specific quarantine procedures in place in an\nenterprise and to report any breaches of quarantine to\nsupervisors.\nThe skills and knowledge required to follow site quarantine\nprocedures must be transferable to a different work environment.\nFor example, following site quarantine procedures in different types\nof enterprises or where quarantine is imposed in response to\ndifferent circumstances on different occasions.\n2. Underpinning\nKnowledge and\nAttitudes\n\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nEnterprise site quarantine policy and procedures\n2.2.\nindustry quality assurance requirements (where applicable)\nand documentation required to be kept\n2.3.\nReporting procedures for alleged breaches of site quarantine\nprocedures\n2.4.\nConsequences of breaching site quarantine procedures\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills are:\n3.1.\nRead and/or interpret site quarantine procedures\n3.2.\nFollow procedures\n3.3.\nCommunicate with visitors to the enterprise about site\nquarantine procedures.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace used for commercial livestock or cropping\nproduction, including egg production and milk harvesting, for\nfood purposes\n4.2.\nHACCP plan\n4.3.\nSOP.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nThrough direct observation / demonstration\n5.2.\nPortfolio assessment\n6. Context of\nAssessment\nAssessment should be in a workplace and carried out in conjunction\nwith assessment of other workplace competencies.\n6.1.\nThe assessment condition requires following quality\nassurance procedures as part of workplace tasks.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 89 ---\nTR - Horticulture NC III\n\n- 85 -\nUNIT OF COMPETENCY :\nCOLLECT SAMPLES FOR A RURAL PRODUCTION OR\nHORTICULTURE MONITORING PROGRAM\nUNIT CODE\n:"
        },
        "source_text": "AGR611325\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to follow\nenterprise site quarantine procedures that are designed to reduce\nthe likelihood of pathogenic organisms entering the site. Site\nquarantine procedures are followed as a routine part of one’s own\nwork and are applied to visitors to the site. Work is performed under\nsupervision and according to established procedures and policies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare to work in\nquarantine site\n1.1\nEnsure personal and/or work vehicles are decontaminated\nbefore entering the quarantine site.\n1.2\nContact with potential contaminants is reported according to\nenterprise requirements\n1.3\nHands are washed before livestock, feed, plant stock or other\nproducts are handled\n1.4\nAppropriate clothing and footwear is put on before\ncommencing work and ‘street clothing’ is securely stored away\nfrom livestock, feed or other agricultural produce.\n2. Work in quarantine\nsite\n2.1\nChemicals for disinfestation and/or medications administered\nto livestock are handled and stored according to workplace\nrequirements.\n2.2\nDifferent feed mixes, soils and/or growing media and/or other\nproducts are kept separately and appropriately marked\naccording to quarantine procedures.\n2.3\nAny cases of pest and disease incidence are identified and\nreported to supervisor.\n2.4\nAny breaches of quarantine procedures are identified and\nreported to supervisor.\n2.5\nAny OHS hazards are identified and appropriate action is\ntaken according to enterprise policy and OHS legislation and\ncodes.\n2.6\nAll waste product is disposed of according to SOP.\n2.7\nAll deceased livestock, unwanted biological material or\ndamaged/infected plant stock are disposed of according to\nSOP.\n2.8\nInformation relating to work in quarantine site is recorded as\nrequired in the SOP.\n\n--- PDF PAGE 86 ---\nTR - Horticulture NC III\n\n- 82 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Assist in maintaining\nsite quarantine\nprocedures\n3.1\nAll visitors are informed of the quarantine procedures and are\nprovided with appropriate clothing and footwear, if required by\nSOP.\n3.2\nAny observed breaches of quarantine procedures by visitors\nare noted and reported to supervisor\n3.3\nGates and doors are kept locked where required by SOP and\nsupervisor instructions\n3.4\nWhere installed, security fencing is maintained according to\nsupervisors instructions\n3.5\nDeliveries to site are checked to ensure that established\nprocedures for vehicle decontamination, unloading and receipt\nand holding or storage of stock and/or supplies are followed\n4. Respond to site\nquarantine breach or\nproblem\n4.1\nThe specific problem and its location is identified and reported\nto supervisor\n4.2\nQuarantine site and location of breach is cleaned and\ndisinfected as required according to the specific nature of the\nproblem and SOP\n4.4\nLivestock, plant stock suspected of being exposed to\ncontaminants are isolated and monitored for evidence of\ncontamination according to SOP.\n4.5\nInformation about the breach or problem is recorded\naccording to SOP\n\n--- PDF PAGE 87 ---\nTR - Horticulture NC III\n\n- 83 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. quarantine site\n1.1.\nThe quarantine site may be the whole farm or enterprise\npremises or part of the premises, such as an isolation area or\nsick bay. In some cases, the quarantine area may extend\nbeyond the enterprise boundaries.\n2. decontamination\n2.1.\nVehicle decontamination may require that all vehicles are\ndriven through a dip of treated solution before entering the\nsite.\n3. potential\ncontaminants\n3.1.\nPotential contaminants may include pathogens entering on\nclothing/footwear, equipment, vehicles or items being\ndelivered to the enterprise. Potential contaminants may also\nenter in foodstuffs, including food for animal or human\nconsumption, vaccines, water or soil, or be brought on to the\nsite by new livestock or pests.\n4. standard operating\nprocedures (SOP)\n4.1.\nThese may include, enterprise quality assurance manual,\nindustry standards and quality assurance programs specific to\nbiosecurity, production schedules, Material Safety Data\nSheets, work notes, product labels, manufacturers\nspecifications, operators manuals, enterprise policies and\nprocedures (including waste disposal, recycling and re-use\nguidelines), OHS procedures, supervisors oral or written\ninstructions, work and routine maintenance plans.\n5. pest\n\n5.1.\nPests can include vertebrate and invertebrate pests, wild birds\nin sheds or housing, dogs, and cats.\n6. diseases\n6.1.\nDiseases can be categorized as fungal, bacterial, viral and\nparasitical.\n7. waste products\n\n7.1.\nWaste products might include feed spills, unused/expired\nvaccine, and biological matter, such as semen, embryos,\ntissue samples, plant cuttings, infected plants, dead birds and\nmanures.\n\n--- PDF PAGE 88 ---\nTR - Horticulture NC III\n\n- 84 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate :\n1.1.\nApplied specific quarantine procedures in place in an\nenterprise and to report any breaches of quarantine to\nsupervisors.\nThe skills and knowledge required to follow site quarantine\nprocedures must be transferable to a different work environment.\nFor example, following site quarantine procedures in different types\nof enterprises or where quarantine is imposed in response to\ndifferent circumstances on different occasions.\n2. Underpinning\nKnowledge and\nAttitudes\n\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nEnterprise site quarantine policy and procedures\n2.2.\nindustry quality assurance requirements (where applicable)\nand documentation required to be kept\n2.3.\nReporting procedures for alleged breaches of site quarantine\nprocedures\n2.4.\nConsequences of breaching site quarantine procedures\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills are:\n3.1.\nRead and/or interpret site quarantine procedures\n3.2.\nFollow procedures\n3.3.\nCommunicate with visitors to the enterprise about site\nquarantine procedures.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace used for commercial livestock or cropping\nproduction, including egg production and milk harvesting, for\nfood purposes\n4.2.\nHACCP plan\n4.3.\nSOP.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nThrough direct observation / demonstration\n5.2.\nPortfolio assessment\n6. Context of\nAssessment\nAssessment should be in a workplace and carried out in conjunction\nwith assessment of other workplace competencies.\n6.1.\nThe assessment condition requires following quality\nassurance procedures as part of workplace tasks.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 89 ---\nTR - Horticulture NC III\n\n- 85 -\nUNIT OF COMPETENCY :\nCOLLECT SAMPLES FOR A RURAL PRODUCTION OR\nHORTICULTURE MONITORING PROGRAM\nUNIT CODE\n:"
