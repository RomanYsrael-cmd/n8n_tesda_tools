        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nplanned, implemented and monitored weed control\nsuccessfully according to enterprise guidelines and industry\nbest practice\nThe skills and knowledge required to control weeds must be\ntransferable to a different work environment. For example, this\ncould include different weed species, enterprise situations and\ncontrol methods.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below.\n2.1.\nWeed recognition.\n2.2.\nEconomic, aesthetic or environmental thresholds for a range\nof weeds.\n2.3.\nChemical, biological and cultural control methods and\ntreatments available to the enterprise within the parameters of\nan IPM program.\n2.4.\nRange and use of tools, equipment and machinery available\nto the enterprise for implementing the control measures.\n2.5.\nRange of site monitoring and analysis techniques that may be\nused to implement an IPM program.\n2.6.\nAssociation of IPM methods with site limitations,\nenvironmental implications, end market and horticultural\nobjectives for the site.\n2.7.\nOHS issues and legislative requirements associated wth\nhazardous sunbstances. regulations and Codes of Practice.\n2.8.\nOHS responsibilities of employers and employees.\n2.9.\nCorrect wearing/fit of personal protective equipment.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\nrecognise of a range of weeds and beneficial organisms within\na particular enterprise.\n3.2.\ncommunicate with work team members, supervisors,\ncontractors and consultants.\n3.3.\nutilise proforma reporting, analysis and work procedure\ndocuments.\n3.4.\nunderstand IPM symbols and information.\n3.5.\ninterpret and apply IPM program spatial and logistical\nspecifications.\n3.6.\ncorrect fitting, cleaning and storage of personal protective\nequipment.\n3.7.\ninterpret and apply test results and calculate the quantities\nand applications rates of control materials.\n3.8.\ncoordinate work group, contractors and own activities to\n\n--- PDF PAGE 55 ---\nTR - Horticulture NC III\n\n- 51 -\nsequentially and effectively complete IPM activities in a timely\nand cost effective manner.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with a range of weeds\n4.2.\ntools, equipment and materials for controlling weeds\n4.3.\nenterprise procedures, work plans relevant to weed control\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace. or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 56 ---\nTR - Horticulture NC III\n\n- 52 -\nUNIT OF COMPETENCY :\nPREPARE AND APPLY CHEMICALS\nUNIT CODE\n:"
