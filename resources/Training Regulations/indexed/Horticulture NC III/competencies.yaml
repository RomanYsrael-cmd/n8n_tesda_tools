        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nAssessed the nutritional health of plants grown by the farm\n1.2.\nAccessed and applied appropriate products to plants and soils\nto meet the goals and objectives of the plant nutrition\nprogram.\nThe skills and knowledge required to implement a plant nutrition\nprogram must be transferable to a different work environment. For\nexample, this could include different plant species, nutrition\nprograms and farm situations.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nthe relationship between soil characteristics and the\navailability of nutrients, including macro and micro elements,\nto plants\n2.2.\nnutrient cycling and its practical relevance to the specific\nplants and soils used in the farm.\n2.3.\nmethods of nutrient uptake by plants\n2.4.\nnutrients required by plants grown within the farm and the\naffects of nutrient deficiency and toxicity on individual plant\nspecies and varieties, including visual symptoms\n2.5.\nsoil ameliorants commonly required to treat the soil problems\nexperienced by the farm\n2.6.\nthe main simple and compound fertilizer products available to\nthe farm including analysis, solubility, salt index, application\nrates and costs\n2.7.\nthe environmental implications for the external environment of\nsoil ameliorant and fertilizer use, which may include over-\nspraying, run-off, nutrient overload, erosion, toxicity, noise and\ndust.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate with work team members, supervisors,\ncontractors and suppliers, interpret manufacturers and plant\nnutrition program specifications, utilise proforma reporting,\nanalysis and work procedure documents, and understand\nlabels and symbols\n3.2.\nestimate treatment and product requirements, material sizes\nand quantities, interpret specifications, and calculate areas,\nratios, proportions and application rates\n3.3.\nco-ordinate own activities with the requirements and\nschedules of the work group and contractors to sequentially\nand effectively implement the plant nutrition program in a\ntimely and cost effective manner\n\n--- PDF PAGE 50 ---\nTR - Horticulture NC III\n\n- 46 -\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with commercial cropping or horticulture\n4.2.\nfarm production plan\n4.3.\nworkplace production data and records\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time.\n\n--- PDF PAGE 51 ---\nTR - Horticulture NC III\n\n- 47 -\nUNIT OF COMPETENCY :\nCONTROL WEEDS\nUNIT CODE\n:"
        },
        "source_text": "AGR611312\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to implement a\nplant nutrition program in the horticultural or agricultural industry.\n\nImplementing a plant nutrition program is likely to be under limited\nsupervision from others, with checking only related to overall\nprogress. The work is usually done within a program, routines,\nmethods and procedures where some discretion and judgement is\nrequired in the selection of equipment and materials, organization of\nwork, services, actions, and the achievement of outcomes within\ntime and budgetary constraints.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Prepare for\nimplementation of the\nplant nutrition\nprogram\n1.1\nGoals and target site for implementation of the plant nutrition\nprogram including soils, plant species and varieties are\nidentified according to farm work procedures.\n1.2 Area and adjacent lands are analysed for soil\ncomposition/nutrients.\n1.3\nMaterials for soil and plant treatments available to the farm\nare identified and the storage site or supplier details located.\n1.4\nServices are located using site plans and in consultation with\nthe supervisor.\n1.5\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.6\nSuitable personal protective equipment (PPE) is selected,\nused and maintained.\n2 Monitor soil pH\n2.1\nSoil pH in the implementation site is monitored in relation to\nplant nutrition and according to farm work procedures.\n2.2\nProducts useful in changing soil pH are identified,\ncompared, selected and sourced according to farm work\nprocedures.\n2.3\nProduct application methods are assessed according to\nproduct type, soils, farm work procedures, and in due\nconsideration of the environmental implications.\n3 Determine nutritional\nproblems in plants\n3.1\nCommon nutrient deficiency and toxicity problems in plants\nare identified using visual inspection.\n3.2\nThe supervisor and/or nutritional specialist are consulted, as\nrequired, to determine causes of nutritional or toxicity\nproblems.\n3.3\nSoil ameliorants to improve soil fertility are identified,\ncompared, selected and sourced according to farm work\nprocedures.\n\n--- PDF PAGE 46 ---\nTR - Horticulture NC III\n\n- 42 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4 Prepare to use\nfertilizers\n4.1\nThe fertilizer to be used is selected according to fertilizer\ntype, soils, farm work procedures, in consultation with the\nsupervisor and/or nutritional specialist and in due\nconsideration of the environmental implications.\n4.2\nFertilizer application methods are assessed according to\nfertilizer type, soils, farm work procedures, and in due\nconsideration of the environmental implications.\n4.3\nFertilizers are applied according to the plant growing cycle\nand the farm fertilizer calendar.\n4.4\nFertilizers are handled and stored according to farm work\nprocedures and to minimize detrimental environmental impact.\n5 Prepare application\nequipment\n5.1\nTools, equipment and machinery are selected according to\nfarm work procedures.\n5.2\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and farm work procedures.\n5.3\nTools, equipment and machinery are calibrated and adjusted\naccording to manufacturers guidelines and farm work\nprocedures.\n6 Apply specific\nproducts at\nappropriate rates\n6.1\nSpecific products are selected based on their analysis to meet\nplant needs according to farm work procedures.\n6.2\nProduct application rates are calculated to optimise plant\nbenefit and minimize environmental impact according to\nmanufacturers specifications and farm work procedures.\n6.3\nSpecific products are applied at the correct rate, timing and\nmethod according to the product type and analysis,\nmanufacturers specifications, farm work procedures, and in\ndue consideration of the environmental implications.\n6.4\nProduct applications are recorded according to farm work\nprocedures.\n6.5\nTarget plant response to the plant nutrition program, as well\nas any non-target effects such as environmental impact or\npest responses are monitored, documented and reported to\nthe supervisor according to farm work procedures.\n\n--- PDF PAGE 47 ---\nTR - Horticulture NC III\n\n- 43 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. soils\n1.1.\nSoils may include field soil sites and specialist growing media.\n2. farm work\nprocedures\n2.1.\nWork procedures may include supervisors oral or written\ninstructions, plant nutrition program, farm standard operating\nprocedures (SOP), specifications, routine maintenance\nschedules, work notes; product labels and Material Safety\nData Sheets (MSDS); manufacturers service specifications\nand operators manuals; waste disposal, recycling and re-use\nguidelines; and OHS procedures.\n3. materials\n3.1.\nMaterials may include those to modify soil pH, soil ameliorants\nto improve soil fertility, and fertilizers to meet the nutritional\nrequirements of plants.\n4. services\n4.1.\nServices may include water supply, gas, power (electricity),\ntelecommunications, irrigation, and drainage.\n5. OHS hazards\n5.1.\nHazards may include disturbance or interruption of services,\nsolar radiation, dust, noise, soil-, air- and water-borne micro-\norganisms, chemicals and hazardous substances, sharp hand\ntools and equipment, manual handling, moving vehicles,\nmachinery and machinery parts, flying objects and uneven\nsurfaces.\n6. PPE\n6.1.\nPPE may include hat, boots, overalls, gloves, goggles,\nrespirator or face mask, face guard, spray clothing, hearing\nprotection, sunscreen lotion and hard hat.\n7. products useful in\nchanging soil pH?\n7.1.\nProducts may include lime such as ground limestone,\ndolomite, and a range of fertilizers.\n8. application\nmethods\n8.1.\nApplication methods may include banding, broadcasting,\nripping, spraying and fertigation.\n9. environmental\nimplications\n9.1.\nOver-spraying or run-off into the external environment may\nresult in nutrient overload or excess water to native plants,\nnatural waterways, watertables and ecosystems, water\nerosion, water logging and salinisation.\n9.2.\nResponsible fertilisation and watering practices may, however,\nhelp to reverse previous environmental degradation by\nallowing natural recovery and regeneration of native\necosystems.\n10. soil ameliorants\n10.1. Soil ameliorants may include cover crops, animal manures,\ngypsum and lime.\n11. fertilizers\n11.1. Fertilizers may include solids, liquids or gases, which are\nartificial, organic, applied directly to the soil or to the plant via\nfoliar sprays.\n12. fertilizer\napplication\nmethods\n12.1. Fertilizer application methods may include banding,\nbroadcasting, ripping, spraying and fertigation.\n\n--- PDF PAGE 48 ---\nTR - Horticulture NC III\n\n- 44 -\nVARIABLE\nRANGE\n13. tools, equipment\nand machinery\n13.1. Monitoring equipment may include a pH test kit, electronic pH\ntesting device, hand held salinity or EC meter, tape measure,\nsample bags, plastic overlays, aerial photographs, charts and\ntables of soil characteristics and plant soil parameters, as well\nas charts and illustrations of the symptoms of plant nutrient\ndeficiencies and toxicities.\n13.2. Application equipment and machinery may include backpack\nspray equipment, tractors and trailed or 3 point linkage\nspreaders, seeders, rippers and spray equipment, pumps and\npump fittings, and irrigation systems set up for fertigation.\n\n--- PDF PAGE 49 ---\nTR - Horticulture NC III\n\n- 45 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nAssessed the nutritional health of plants grown by the farm\n1.2.\nAccessed and applied appropriate products to plants and soils\nto meet the goals and objectives of the plant nutrition\nprogram.\nThe skills and knowledge required to implement a plant nutrition\nprogram must be transferable to a different work environment. For\nexample, this could include different plant species, nutrition\nprograms and farm situations.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nthe relationship between soil characteristics and the\navailability of nutrients, including macro and micro elements,\nto plants\n2.2.\nnutrient cycling and its practical relevance to the specific\nplants and soils used in the farm.\n2.3.\nmethods of nutrient uptake by plants\n2.4.\nnutrients required by plants grown within the farm and the\naffects of nutrient deficiency and toxicity on individual plant\nspecies and varieties, including visual symptoms\n2.5.\nsoil ameliorants commonly required to treat the soil problems\nexperienced by the farm\n2.6.\nthe main simple and compound fertilizer products available to\nthe farm including analysis, solubility, salt index, application\nrates and costs\n2.7.\nthe environmental implications for the external environment of\nsoil ameliorant and fertilizer use, which may include over-\nspraying, run-off, nutrient overload, erosion, toxicity, noise and\ndust.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate with work team members, supervisors,\ncontractors and suppliers, interpret manufacturers and plant\nnutrition program specifications, utilise proforma reporting,\nanalysis and work procedure documents, and understand\nlabels and symbols\n3.2.\nestimate treatment and product requirements, material sizes\nand quantities, interpret specifications, and calculate areas,\nratios, proportions and application rates\n3.3.\nco-ordinate own activities with the requirements and\nschedules of the work group and contractors to sequentially\nand effectively implement the plant nutrition program in a\ntimely and cost effective manner\n\n--- PDF PAGE 50 ---\nTR - Horticulture NC III\n\n- 46 -\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with commercial cropping or horticulture\n4.2.\nfarm production plan\n4.3.\nworkplace production data and records\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time.\n\n--- PDF PAGE 51 ---\nTR - Horticulture NC III\n\n- 47 -\nUNIT OF COMPETENCY :\nCONTROL WEEDS\nUNIT CODE\n:"
