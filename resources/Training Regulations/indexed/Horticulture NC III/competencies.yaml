        "source_text": "AGR321202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to use\nfarm tools and equipment. It includes selection, operation and\npreventive maintenance of farm tools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and use farm\ntools\n\n1.1\nIdentified appropriate farm tools according to requirement/use\n1.2\nFarm tools are checked for faults and defective tools reported\nin accordance with farm procedures\n1.3\nAppropriate tools and equipment are safely used according to\njob requirements and manufacturers conditions\n2. Select and operate\nfarm equipment\n2.1\nIdentify appropriate farm equipment\n2.2\nInstructional manual of the farm tools and equipment are\ncarefully read prior to operation\n2.3\nPre-operation check-up is conducted in line with\nmanufacturers manual\n2.4\nFaults in farm equipment are identified and reported in line\nwith farm procedures\n2.5\nFarm equipment used according to its function\n2.6\nFollowed safety procedures\n3. Perform preventive\nmaintenance\n3.1\nTools and equipment are cleaned immediately after use in line\nwith farm procedures\n3.2\nRoutine check-up and maintenance are performed\n3.3\nTools and equipment are stored in designated areas in line\nwith farm procedures\n\n--- PDF PAGE 28 ---\nTR - Horticulture NC III\n\n- 24 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\n\n1.1\nEngine\n1.2\nPumps\n1.3\nGenerators\n1.4\nSprayers\n2. Farm tools\n2.1\nSickle\n2.2\nCutters\n2.3\nWeighing scales\n2.4\nHand tools\n2.5\nMeasuring tools\n2.6\nGarden tools\n3. Pre-operation check-\nup\n3.1\nTires\n3.2\nBrake fluid\n3.3\nFuel\n3.4\nWater\n3.5\nOil\n3.6\nLubricants\n3.7\nBattery\n\n--- PDF PAGE 29 ---\nTR - Horticulture NC III\n\n- 25 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipment according to manual specification\n1.3\nPerformed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1 Ideal good work habits to demonstrate to workers easy\nand safety standards during operation of farm\nequipment\n2.2\nCodes and Regulations\n2.2.1 Environmental Compliance Certificate (ECG)\n2.2.2 Effective work supervision in the operations of farm\nequipment\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n2.4\nMaintenance\n2.4.1 Regular upkeep of equipments\n2.4.2 Preventive maintenance skills\n2.5\nValues\n2.5.1 Positive outlook towards work\n2.5.2 Possesses pre-emptive/anticipatory skills\n3. Underpinning Skills\n3.1\nAbility to recognized defective farm equipment\n3.2\nPerform proper management practices of safety measures\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nDirect observation\n4.2\nPractical demonstration\n4.3\nThird Party Report\n5. Resource\nImplications\n5.1\nService/operational manual of farm tools and equipment\n5.2\nTools and equipment\n5.3\nFarm implements\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 30 ---\nTR - Horticulture NC III\n\n- 26 -\nUNIT OF COMPETENCY :\nPERFORM ESTIMATION AND BASIC CALCULATION\nUNIT CODE\n:"
