          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\ncomplied with industry quality assurance requirements in an\nanimal production enterprise.\nThe skills and knowledge required to comply with industry quality\nassurance requirements must be transferable to a range of work\nenvironments and contexts. For example, this could include different\nanimals, production systems, and industry QA requirements.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below:\n2.1.\nindustry QA requirements, such as the Philippine Pig Industry\nQuality Program (APIQ)\n2.2.\nanimal production processes\n2.3.\nHACCP (Hazard Analysis Critical Control Point) approach to\nquality assurance\n2.4.\nenterprise policies, guidelines and standard operating\nprocedures (SOP’s) relating to food safety quality, biosecurity,\nand animal welfare.\n2.5.\nenterprise OHS requirements\n2.6.\nanimal health and welfare.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\nimplement quality assurance practices on food safety and\nquality, biosecurity and animal welfare\n3.2.\nimplement standard operating procedures\n3.3.\nreport problems that affect quality.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace that produces meat, eggs or milk (requiring a\nHACCP food safety plan)\n4.2.\nHACCP plan\n4.3.\nenterprise procedures HACCP and food safety\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time\n\n--- PDF PAGE 109 ---\nTR - Horticulture NC III\n\n- 105 -\nUNIT OF COMPETENCY :\nMAINTAIN AND MONITOR ENVIRONMENTAL WORK\nPRACTICES\nUNIT CODE\n:"
        },
        "source_text": "AGR611329\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to comply with\nindustry quality assurance requirements in the production of meat,\nmilk or eggs. It requires the ability to implement quality assurance\npractices on food safety, quality, and animal welfare, biosecurity,\nimplement standard operating procedures, and report problems that\naffect quality. Complying with industry quality assurance\nrequirements requires knowledge of industry quality assurance\nrequirements, animal production processes, Hazard Analysis\nCritical Control Point (HACCP) approach to quality assurance, and\nenterprise policies, guidelines and standard operating procedures\nrelating to food safety, quality and animal welfare.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Implement quality\nassurance practices\non food safety and\nquality, biosecurity\nand animal welfare\n1.1 Elements of the industry quality assurance requirements are\ndetermined.\n1.2 Hazards to food safety and quality are identified for work area\naccording to enterprise guidelines and standard operating\nprocedures.\n1.3 Critical control points for work area are determined according to\nworkplace procedures.\n1.4 Record keeping is completed according to industry QA\nrequirements.\n2. Implement standard\noperating procedures\n2.1 Standard operating procedures are implemented in accordance\nwith enterprise requirements.\n2.2 Non-conforming or defective product reported to supervisor\naccording to enterprise/industry requirements.\n2.3 Corrective action taken in accordance with enterprise policy and\nprocedures.\n3. Report problems that\naffect quality\n3.1 Recognize potential or existing quality problems.\n3.2 Identify instances of variation in quality from specifications or\nwork instructions.\n3.3 Report variation and potential problems to supervisor/manager\naccording to enterprise guidelines.\n\n--- PDF PAGE 107 ---\nTR - Horticulture NC III\n\n- 103 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. food\n1.1.\nMeat, milk and eggs.\n2. elements of the QA\nsystem\n2.1.\nThese include Hazard Analysis Critical Control Point (HACCP)\ncharts, mission statement, work instructions, corrective action\nand monitoring procedures, standard operating procedures,\nenterprise and industry policies and codes of practice.\n3. hazards\nThese may include:\n3.1.\nPhysical hazards where foreign objects such as retained,\nbroken needles, welding rods, nails or wire are present in\nanimals.\n3.2.\nChemical hazards resulting from residues such as antibiotics,\npesticides, alkaloids and other substances used in animal\nproduction.\n3.3.\nBiological hazards where contamination from other animals\n(e.g. mice, rats, cats), poor housing/transport conditions, and\ndirty water affects animal health and food quality.\n3.4.\nFood quality hazards resulting from poor handling of animals,\nunhealthy or diseased animals, inappropriate use of dogs,\nextreme weather conditions, poor loading and transport\nconditions, and time off feed.\n\n--- PDF PAGE 108 ---\nTR - Horticulture NC III\n\n- 104 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\ncomplied with industry quality assurance requirements in an\nanimal production enterprise.\nThe skills and knowledge required to comply with industry quality\nassurance requirements must be transferable to a range of work\nenvironments and contexts. For example, this could include different\nanimals, production systems, and industry QA requirements.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below:\n2.1.\nindustry QA requirements, such as the Philippine Pig Industry\nQuality Program (APIQ)\n2.2.\nanimal production processes\n2.3.\nHACCP (Hazard Analysis Critical Control Point) approach to\nquality assurance\n2.4.\nenterprise policies, guidelines and standard operating\nprocedures (SOP’s) relating to food safety quality, biosecurity,\nand animal welfare.\n2.5.\nenterprise OHS requirements\n2.6.\nanimal health and welfare.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\nimplement quality assurance practices on food safety and\nquality, biosecurity and animal welfare\n3.2.\nimplement standard operating procedures\n3.3.\nreport problems that affect quality.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace that produces meat, eggs or milk (requiring a\nHACCP food safety plan)\n4.2.\nHACCP plan\n4.3.\nenterprise procedures HACCP and food safety\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time\n\n--- PDF PAGE 109 ---\nTR - Horticulture NC III\n\n- 105 -\nUNIT OF COMPETENCY :\nMAINTAIN AND MONITOR ENVIRONMENTAL WORK\nPRACTICES\nUNIT CODE\n:"
