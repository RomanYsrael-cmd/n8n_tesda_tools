        "source_text": "AGR611331\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required. This\ncompetency standard covers the process of creating and\nmaintaining physical records, preparing and processing basic\nfinancial transactions, establishing and maintaining a cashbook,\nand reconciling and preparing invoices within primary production\nbusinesses. Both the physical and financial records of the business\nare vital for use by management for planning purposes, meeting\nlegislative requirements, and the efficient operation of the business\non a daily basis.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and store\nphysical records\n1.1\nPhysical records and inventories required for the\norganization are determined in consultation with the\nmanagement team.\n1.2\nMethods for collecting information are reliable, and time\nand resources are used efficiently.\n1.3\nAppropriate interpersonal skills are used to access relevant\ninformation from individuals and teams.\n1.4\nInformation is organized into a format suitable for analysis,\ninterpretation and dissemination in accordance with\norganizational requirements.\n1.5\nBusiness equipment/technology is used to maintain\ninformation in accordance with organizational and OHS\nrequirements.\n1.6\nRecords are updated and stored in accordance with\norganizational requirements.\n2. Process petty cash\ntransactions\n2.1\nPetty cash claims and vouchers are checked for accuracy\nand authenticity prior to processing.\n2.2\nPetty cash transactions are processed and recorded in\naccordance with organizational requirements.\n2.2\nPetty cash book balanced in accordance with organizational\nrequirements.\n3. Establish and\nmaintain a cash book\nin accordance with\norganizational\nrequirements\n3.1\nCash receipts and payments book created, and\ndocumentation relating to financial transactions checked\nfor validity prior to processing.\n3.2\nCashbook balances reconciled with bank and creditor\nstatements.\n3.3\nCashbook balances are used to complete legislative\nreporting requirements.\n3.4\nCash flow statements are prepared on the basis of\nsummarised cashbook entries.\n\n--- PDF PAGE 114 ---\nTR - Horticulture NC III\n\n- 110 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Reconcile invoices\nfor payment to\ncreditors\n4.1\nAdjustments and errors are identified, reported and rectified in\naccordance with organizational requirements.\n4.2\nInvoices processed and payment made in accordance with\norganizational requirements.\n5. Prepare invoices for\ndebtors\n5.1\nInvoices are prepared accurately and, if required, distributed\nto nominated person for verification prior to despatch.\n5.2\nAdjustments are made as required in accordance with\norganizational requirements.\n5.3\nInvoices and other related documents copied and filed in\naccordance with organizational requirements for taxation and\nauditing purposes.\n\n--- PDF PAGE 115 ---\nTR - Horticulture NC III\n\n- 111 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. physical records\n\n1.1.\nRecords may include a property plan, livestock, paddock\ntreatments including spraying, paddocks, rainfall, production,\nsales data, supplies, machinery and equipment, and stock.\n2. management\nteam\n2.1.\nThey may be oneself, family members, fellow managers,\nemployees, professional advisors, partners, and mentors.\n3. methods for\ncollecting\ninformation\n\n3.1.\nMethods for collecting information may include observation\nand listening, previous file records, individual research,\nstatistics and reports from other organizations, producing\nreports from data collected on the farm, translating data from\ndiaries and note-books, or professional data collection\nagency.\n4. interpersonal skills\n\n4.1.\nInterpersonal skills may include effective listening, open\nquestioning techniques, verbal and non verbal communication\nskills, appropriate body language, and the ability to relate to\npeople from a range of social, cultural and ethnic backgrounds\nand physical and mental abilities.\n5. format\n5.1.\nFormat for records and inventories could include maps,\ngraphs, charts, cards, electronic, databases, diaries, or\nnotebooks.\n6. business\nequipment/\ntechnology\n6.1.\nBusiness equipment and technology that might be used\ninclude computer, software, Internet, email, calculator, fax or\nphone.\n7. checking for\naccuracy and\nauthenticity\n7.1.\nChecking may include correct information on voucher, receipt\nof purchase, and ensuring items are business related.\n8. cashbook\n8.1.\nA cashbook documents the daily receipts and payments of the\nbusiness. It may be created and maintained manually and/or\nelectronically.\n9. documentation\nrequires checking\nfor validity\n9.1.\nDocumentation may include cheques, taxation invoices,\naccounts, and credit card vouchers.\n9.2.\nValidity may include checking date, signature, details on\ncheque are correct, expiry date of credit cards, information on\ntaxation invoice, and accounts are accurate.\n10. legislative\nreporting\nrequirements\n10.1. Legislative reporting requirements may include recording\nPhilippine Business Number (ABN), business activity\nstatements (BAS), instalment activity statements (AIS), PAYG\nwithholding, superannuation, taxation, or work cover.\n11. cash flow\nstatements\n11.1. Cash flow statements summarise the organizations actual and\nexpected cash flow over designated periods of time. Budgets\nallocate income against expenses. Both types of statements\ncan be created manually or electronically.\n12. creditors and\ndebtors\n12.1. Creditors and debtors may include financial institutions, goods\nand service suppliers, rural merchants, contractors,\nprofessional advisors, and co-operatives.\n\n--- PDF PAGE 116 ---\nTR - Horticulture NC III\n\n- 112 -\nVARIABLE\nRANGE\n13. taxation and\nauditing\nrequirements\n13.1. Taxation and auditing requirements would include accurate\nrecords of all business assets, liabilities, income, expenses\nand entitlements to be analyzed by an accountant for\ncompliance purposes.\n14. transactions\n14.1. Financial transactions may include purchasing and selling\nproducts, machinery and equipment, vehicles and supplies,\nbanking cheques, paying invoices and bills, or transferring\nfunds electronically.\n\n--- PDF PAGE 117 ---\nTR - Horticulture NC III\n\n- 113 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\ncreated, maintained and stored financial records in\naccordance with legislative and organizational requirements.\n1.2.\nprocessed and recorded financial transactions involving cash,\nelectronic funds transfer, cheques and invoices accurately in\naccordance with legislative and organizational requirements\nThe skills and knowledge required to keep records in a rural\nbusiness must be transferable to a different work environment. For\nexample, across a wide range of small, medium and large\nagricultural and horticultural businesses.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nnature of the business and its legal and organizational\nstructure\n2.2.\nrelevant national, provincial and municipal government\nlegislative requirements, especially in regard to OHS and\nenvironmental requirements\n2.3.\norganizational policies and procedures relating to the\ndistribution of workplace information, legal and ethical\nobligations\n2.4.\nmethods to identify sources of information\n2.5.\nprocedures to analyze information to identify patterns and\ntrends\n2.6.\nthe organizations record keeping/filing systems, security of\ninformation and safe record keeping procedures\n2.7.\nprinciples of effective interpersonal communication\n2.8.\nprinciples and procedures for cash and non cash handling\n2.9.\nprinciples of single entry accounting, and cash flow\nstatements.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\nrelate to people from a range of social, cultural and ethnic\nbackgrounds, and of varying physical and mental abilities\n3.2.\ncollect and record accurate and reliable information\n3.3.\npresent data in a format suitable for the organizations\nrequirements\n3.4.\nuse business equipment and technology correctly and safely\n3.5.\nfile records accurately in accordance with organizational\nrequirements\n3.6.\nperform calculations and balance accounts\n3.7.\nprepare cash flow statements and budgets\n3.8.\nreconcile creditors invoices and prepare debtors invoices\n3.9.\nprocess forms and other documentation.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace\n4.2.\nsource records for farm\n4.3.\nfarm procedures processing income and expenses, and\nreporting\n\n--- PDF PAGE 118 ---\nTR - Horticulture NC III\n\n- 114 -\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time\n\n--- PDF PAGE 119 ---\nTR - Horticulture NC III\n\n- 115 -\nUNIT OF COMPETENCY :\nPERFORM SPECIALISED MACHINERY AND EQUIPMENT\nMAINTENANCE\nUNIT CODE\n:"
