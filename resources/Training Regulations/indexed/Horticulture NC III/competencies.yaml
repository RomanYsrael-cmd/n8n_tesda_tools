        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nprepared for crop maintenance activities\n1.2.\ncoordinated work groups and implemented crop maintenance\nactivities to achieve farm crop production targets in terms of\nyield and quality\nThe skills and knowledge required to coordinate a crop maintenance\nprogram must be transferable to a different work environment. For\nexample, this could include different crops, canopy management\nrequirements and workplaces.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nprinciples of thinning and pruning and the methods used to\nachieve crop maintenance goals\n2.2.\neffects on plant growth, habit and production levels of thinning\nand pruning operations in relation to the market goals of the\nfarm\n2.3.\nfarm quality procedures and characteristics of a crop relative\nto varying market requirements.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate orally and in writing with work team members,\nsupervisors and contractors\n3.2.\nutilise proforma recording, reporting and work procedure\ndocuments\n3.3.\ninterpret site plans and crop maintenance specifications\n3.4.\nmeasure quantities, calculate material requirements, area,\nvolume, ratios and application rates, and calibrate machinery\n3.5.\nco-ordinate work group, contractors and own activities\n3.6.\nmonitor farm plants for quality\n3.7.\nminimize noise, dust, high activity vehicle traffic and water\nrun-off to prevent nuisance-level environmental disturbance.\n4. Resource Implication\n\nThe following resources should be provided:\n4.1.\nworkplace with commercial plants of horticulture crops, vines\nor trees\n4.2.\nquality specifications\n4.3.\nproduction plan and schedule\n4.4.\nfarm procedures relating to crop maintenance\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment.\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time.\n\n--- PDF PAGE 72 ---\nTR - Horticulture NC III\n\n- 68 -\nUNIT OF COMPETENCY :\nCOORDINATE HORTICULTURAL CROP HARVESTING\nUNIT CODE\n:"
        },
        "source_text": "AGR611316\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required for coordinating a\ncrop maintenance program in which thinning and pruning of flower,\nfruit or vegetable crops is undertaken to control yield and quality.\nCrop maintenance methods may include manual thinning, chemical\nthinning, selective harvesting, training, topping and trimming.\nIrrigation and plant nutrition programs are covered in other units of\ncompetency.\n\nCoordinating a horticultural crop maintenance program is likely to\nbe carried out under limited supervision from others with checking\nonly related to overall progress. The work requires the application\nof horticultural knowledge and a broad range of horticultural skills.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for the crop\nmaintenance\nprogram\n1.1\nThe site and operational requirements of the crop\nmaintenance program are identified according to the site\nplan and farm work procedures.\n1.2\nCrop maintenance materials are selected according to farm\nwork procedures.\n1.3\nServices are located using site plans and in consultation with\nthe supervisor and workers.\n1.4\nOHS hazards are identified, risks assessed, controls\nimplemented and reported to the supervisor.\n1.5\nSuitable safety and personal protective equipment (PPE)\nare selected, used and maintained.\n2. Prepare crop\nmaintenance\nequipment\n2.1\nTools, equipment and machinery are selected according to\nfarm work procedures.\n2.2\nPre-operational and safety checks are carried out on tools,\nequipment and machinery according to manufacturers\nspecifications and farm work procedures.\n2.3\nTools, equipment and machinery are calibrated and adjusted\naccording to manufacturer’s guidelines and farm work\nprocedures.\n3. Implement the crop\nmaintenance\nprogram\n3.1\nFarm work team and contractors are identified and work tasks\nare co-ordinated in a sequential, timely and effective manner\nin consultation with the supervisor.\n3.2\nWork pattern is planned to cover the site in an efficient,\nsequential and co-ordinated manner according to farm work\nprocedures and do maintenance work regularly.\n3.3\nCrop maintenance tasks are undertaken according to OHS\nrequirements and with due consideration of the\nenvironmental implications.\n3.4\nCrop maintenance tasks are monitored and remedial action is\nundertaken where necessary to achieve program objectives.\n3.5\nA clean and safe work area is maintained throughout and on\ncompletion of work.\n\n--- PDF PAGE 68 ---\nTR - Horticulture NC III\n\n- 64 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Complete crop\nmaintenance\nactivities\n4.1\nWaste material is removed from the site and disposed of in\nan environmentally aware and safe manner according to farm\nwork procedures.\n4.2\nTools, equipment and machinery are cleaned, maintained and\nstored according to farm work procedures.\n4.3\nWork outcomes are recorded or reported to the supervisor\naccording to farm work procedures.\n\n--- PDF PAGE 69 ---\nTR - Horticulture NC III\n\n- 65 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. crop maintenance\nprogram?\n1.1.\nThe program may include manual thinning, chemical thinning,\nselective harvesting, training, topping and trimming.\n2. farm work\nprocedures\n\n2.1.\nWork procedures will be based on sound horticultural\nprinciples and practices and may include supervisors oral or\nwritten instructions, crop maintenance program, farm standard\noperating procedures (SOPs), specifications, routine\nmaintenance schedules, work notes, product labels and\nMaterial Safety Data Sheets (MSDS), manufacturers service\nspecifications and operators manuals, waste disposal,\nrecycling and re-use guidelines, and OHS procedures.\n2.2.\nMaterials may include thinning agents, growth hormones and\nretardants, and trellising and training materials.\n2.3.\nServices may include water supply, gas, power (electricity),\ntelecommunications, irrigation and drainage.\n3. OHS hazards\n3.1.\nHazards may include disturbance or interruption of services,\nsolar radiation, dust, noise, soil and air-borne micro-\norganisms, chemicals and hazardous substances, sharp hand\ntools and equipment, manual handling, moving vehicles,\nmachinery and machinery parts, uneven surfaces and flying\nobjects.\n4. safety equipment\n4.1.\nSafety equipment may include signage and barriers.\n5. PPE\n5.1.\nPPE may include hat, boots, overalls, gloves, spray clothing,\ngoggles, respirator or face mask, face guard, hearing\nprotection, sunscreen lotion and hardhat.\n6. tools, equipment\nand machinery\n6.1.\nApplication equipment and machinery may include backpack\nspray equipment; tractors and trailed or 3-point linkage spray\nequipment, pumps and pump fittings.\n6.2.\nPruning tools, equipment and machinery may include knives,\nhandsaws, hand scissors, small chainsaws, ladders and\npicking platforms.\n6.3.\nPlant training equipment may include trellising and specialised\ntraining systems.\n7. OHS requirements\n7.1.\nOHS requirements may include identifying hazards, assessing\nrisks and implementing controls, cleaning, maintaining and\nstoring tools, equipment and machinery, appropriate use of\nPPE including sun protection, safe operation of tools,\nequipment and machinery, safe handling, use and storage of\nchemicals and hazardous substances, correct manual\nhandling, basic first aid, personal hygiene and reporting\nproblems to supervisors.\n8. environmental\nimplications\n8.1.\nDetrimental environmental impacts may arise where crop\nmaintenance activities produce excess noise, dust or water\nrun-off, or off-site ground water or soils are contaminated from\nsolids, debris, nutrients, chemicals and water run-off.\n\n--- PDF PAGE 70 ---\nTR - Horticulture NC III\n\n- 66 -\nVARIABLE\nRANGE\n9. clean and safe\nwork area\n9.1.\nTasks may include disabling unused tools, equipment and\nmachinery and storing neatly out of the way of crop\nmaintenance activities, safely storing materials on site, using\nsignage and safety barriers during and removing after crop\nmaintenance activities are completed, and swiftly and\nefficiently removing and processing debris and waste from the\nwork area.\n10. waste material\n10.1. Waste material may include plant debris, litter and broken\ncomponents.\n10.2. Plant-based material may be mulched or composted, plastic,\nmetal, paper-based materials may be recycled, re-used,\nreturned to the manufacturer or disposed of according to farm\nwork procedures.\n\n--- PDF PAGE 71 ---\nTR - Horticulture NC III\n\n- 67 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nprepared for crop maintenance activities\n1.2.\ncoordinated work groups and implemented crop maintenance\nactivities to achieve farm crop production targets in terms of\nyield and quality\nThe skills and knowledge required to coordinate a crop maintenance\nprogram must be transferable to a different work environment. For\nexample, this could include different crops, canopy management\nrequirements and workplaces.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts, and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below:\n2.1.\nprinciples of thinning and pruning and the methods used to\nachieve crop maintenance goals\n2.2.\neffects on plant growth, habit and production levels of thinning\nand pruning operations in relation to the market goals of the\nfarm\n2.3.\nfarm quality procedures and characteristics of a crop relative\nto varying market requirements.\n3. Underpinning Skills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\ncommunicate orally and in writing with work team members,\nsupervisors and contractors\n3.2.\nutilise proforma recording, reporting and work procedure\ndocuments\n3.3.\ninterpret site plans and crop maintenance specifications\n3.4.\nmeasure quantities, calculate material requirements, area,\nvolume, ratios and application rates, and calibrate machinery\n3.5.\nco-ordinate work group, contractors and own activities\n3.6.\nmonitor farm plants for quality\n3.7.\nminimize noise, dust, high activity vehicle traffic and water\nrun-off to prevent nuisance-level environmental disturbance.\n4. Resource Implication\n\nThe following resources should be provided:\n4.1.\nworkplace with commercial plants of horticulture crops, vines\nor trees\n4.2.\nquality specifications\n4.3.\nproduction plan and schedule\n4.4.\nfarm procedures relating to crop maintenance\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment.\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace or in a simulated\nworkplace.\n6.2.\nDemonstration of competency over time.\n\n--- PDF PAGE 72 ---\nTR - Horticulture NC III\n\n- 68 -\nUNIT OF COMPETENCY :\nCOORDINATE HORTICULTURAL CROP HARVESTING\nUNIT CODE\n:"
