        "source_text": "AGR611319\nUNIT DESCRIPTOR :\nThis unit covers the skills and knowledge required for plant\npropagation in enterprises involved in nursery operations and crop\nproduction. Competency is demonstrated by the application of\nknowledge and skills to a range of propagation tasks, such as\npreparing parent plant stock, collecting propagation materials, pre-\nplanting treatments and basic plant propagation techniques. This\nunit does not include budding and grafting. The work is carried out\nwithin routine methods and procedures under supervision with\nintermittent checking. Responsibility for some roles and\ncoordination within a team may be required.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for plant\npropagation\n1.1\nWorkplace information is interpreted and clarified according\nto instructions.\n1.2\nOHS hazard in the work area are identified, rectified and/or\nreported.\n1.3\nSuitable personal protective equipment (PPE) is selected,\nused, maintained and stored.\n1.4\nTools and equipment appropriate to the task being\nundertaken are selected and prepared according to enterprise\nguidelines.\n1.5\nPropagation material is collected using the appropriate\nmethod for the species and according to enterprise guidelines.\n1.6\nPropagation material is maintained and stored to ensure\nmaximum viability.\n2. Propagate plants\n2.1\nPre-treatment is applied and/or carried out appropriate to the\npropagation method and species.\n2.2. Propagation techniques are carried out according to the\nrequirements of the species.\n2.3\nPropagation material is handled in a way that minimises\ndamage and maximises viability.\n2.4\nWater and nutrients are applied to suit the media conditions,\nplant requirements and propagation techniques employed.\n2.5\nLabels are applied according to enterprise guidelines.\n2.6\nPlant health is monitored and remedial action is taken\naccording to enterprise guidelines.\n2.7\nPropagation activities are carried out according to OHS\nrequirements.\n3. Complete\npropagation activities\n3.1\nRecords are completed accurately and at the required time\naccording to enterprise guidelines.\n3.2\nTools and equipment are cleaned and stored according to\nmanufacturer specifications and enterprise guidelines.\n3.3\nWaste is removed and hygiene practices are followed\naccording to enterprise and OHS requirements.\n\n--- PDF PAGE 82 ---\nTR - Horticulture NC III\n\n- 78 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. workplace\ninformation\n\n1.1.\nPlanting program, production statistics, Standard Operating\nProcedures (SOPs), specifications, work notes, Material\nSafety Data Sheets (MSDSs), industry guidelines,\nmanufacturer’s instructions, product labels, or verbal\ndirections from manager, snupervisor, or senior operator.\n2. OHS hazards\n2.1.\nHazards may include manual handling, hazardous\nsubstances, moving equipment and vehicles, sharp hand\ntools, solar radiation, slippery or uneven surfaces, and insect\nand spider bites.\n3. personal protective\nequipment (PPE)\n3.1.\nPersonal protective clothing and equipment may include\nrespirators, overalls, boots, gloves, sun hat and sunscreen\nlotion.\n4. tools and\nequipment\n4.1.\nTools and equipment may include secateurs, knives and other\ncutting instruments, plastic containers and trays, wheelbarrow,\ntrolley, mechanical trolley, shovel, water spray container,\ndibblers and rubbish bins.\n5. propagation\nmaterials to be\ncollected\n5.1.\nCollection procedures for propagation materials may include\ntaking leaf or stem or root cuttings, gathering seeds, lifting\nbulbs, and dividing clumps.\n6. maintenance and\nstorage\n6.1.\nMaintenance and storage procedures may include controlling\nenvironmental parameters such as moisture, air, humidity and\ntemperature by methods such as refrigeration, wrapping in\nwet, drenching, placing in water and burying in sawdust or\nother media.\n7. pre-treatments\n7.1.\nPre-treatments may include hormones, fungicides, cold/moist\nstratification, rehydration, heat or chemical \u0001 isinfestations,\nbreaking seed coat, cleaning, division and sterilisation.\n8. propagation\ntechniques\n8.1.\nPropagation techniques may include seed – (small seed sown\nin modules and pricked out or sown in seedbeds by hand),\ncuttings – (hardwood stem, semi-ripe stem, leaf, root), simple\nlayering, growing on tissue-cultured plants, division or\nsplitting, spores.\n9. label information\n9.1.\nLabel information may include date of propagation, species,\nvariety, batch number and cultivar, treatments applied, strike\nrate.\n10. remedial action\n10.1. Remedial action may include applying preventative fungicides,\nfertilisers, removing and disposing of damaged plant material,\nirrigation.\n\n--- PDF PAGE 83 ---\nTR - Horticulture NC III\n\n- 79 -\nVARIABLE\nRANGE\n11. OHS\nrequirements\n11.1. OHS requirements may include identifying hazards, assessing\nand reporting risks, cleaning, maintaining and storing tools\nand equipment, appropriate use of personal protective\nequipment including sun protection, safe operation of tools\nand equipment, safe handling, use and storage of chemicals\nand hazardous substances, correct manual handling; basic\nfirst aid, personal hygiene and reporting problems to\nsupervisors.\n12. records\n12.1. Records may include date of propagation, type of propagation\ncarried out, number of plants carried out, source of\npropagation material, treatments carried out, spray records\n13. waste\n13.1. Waste may include unused propagation material, potting\nmedia wastage, damaged plants, and damaged pots.\n14. hygiene practices\n14.1. Hygiene practices may include removing all dirt and organic\nmatter from production surfaces, tools and equipment,\ndisinfecting production surfaces, tools and equipment,\ndisinfestations and removal of plant and media waste, hand\nwashing, footbaths, access restrictions and handling practices\nwhich minimise cross contamination.\n\n--- PDF PAGE 84 ---\nTR - Horticulture NC III\n\n- 80 -\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidences that the candidate :\n1.1.\nperformed propagation activities in such a manner as to\nsatisfy the workplace or client requirements.\nThe skills and knowledge required to undertake propagation\nactivities must be transferable to a different work environment. For\nexample, this could include different species, plant types,\nenvironments and propagation techniques.\n2. Underpinning\nKnowledge and\nAttitudes\n\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this competency\nstandard are listed below.\n2.1.\nMaintenance requirements of tools and equipment used for\npropagation.\n2.2.\nOHS requirements of employees.\n2.3.\nQuality specifications/characteristics of a range of parent\nplants and propagation materials.\n2.4.\nBasic plant nutrition.\n2.5.\nRecord keeping relevant to the work function.\n2.6.\nEnterprise requirements for handling and disposal of nursery\nwastes.\n2.7.\nEnterprise hygiene requirements.\n2.8.\nCommon problems that may occur while performing\npropagation activities in a controlled environment.\n2.9.\nPropagation methods required for a range of plants.\n2.10. OHS legislative requirements.\n2.11. OHS procedures.\n3. Underpinning\nSkills\nTo achieve the performance criteria, appropriate literacy and\nnumeracy levels as well as some complementary skills are required.\nThese include the ability to:\n3.1.\nread and interpret instructions.\n3.2.\nparticipate in teams and contribute to team objectives.\n3.3.\ncommunicate effectively with fellow team members.\n3.4.\ncarry out a variety of propagation techniques.\n4. Resource Implication\n\nThe following resources must be provided:\n4.1.\nworkplace with commercial propagation facilities\n4.2.\ntools, equipment and materials required for propagation\nactivities\n4.3.\nenterprise procedures.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio assessment\n6. Context of\nAssessment\nAssessment should be in a workplace or in a simulated workplace.\n6.1.\nThe assessment condition requires using at least two\npropagation techniques\n6.2.\nDemonstration of competency over time and on a number of\noccasions.\n\n--- PDF PAGE 85 ---\nTR - Horticulture NC III\n\n- 81 -\nELECTIVE COMPETENCIES\n\nUNIT OF COMPETENCY :\nFOLLOW SITE QUARANTINE PROCEDURES\nUNIT CODE\n:"
