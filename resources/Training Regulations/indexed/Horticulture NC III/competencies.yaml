        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nMaintained specialised machinery and equipment according to\nenterprise guidelines and industry best practice\nThe skills and knowledge required to maintain specialised machinery\nand equipment must be transferable (normal and adverse work\nconditions) to a range of work environments and contexts. For\nexample, this could include different machinery and equipment,\noperational systems, maintenance procedures and working\nenvironments\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below.\n2.1.\nEngine function principles.\n2.2.\nTurbo charging and after cooling.\n2.3.\nAssessing engine specifications in line with power\nrequirements.\n2.4.\nAll engine electric and hydraulic indicators and gauges.\n2.5.\nTransmission and drive systems.\n2.6.\nSafety including relevant OHS issues, OHS legislative\nrequirements and Codes of Practice.\n2.7.\nMachinery and equipment operation principles.\n2.8.\nOHS responsibilities of employees and employers.\n2.9.\nHazard identification and control.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\nread and comprehend operator’s manuals\n3.2.\ncarry out engine/equipment checks\n3.3.\ncarry out transmission checks.\n3.4.\nmaintain machinery and equipment components.\n3.5.\nrecord maintenance.\n4. Resource Implication\n\n4.1.\nSpecialised equipment\n4.2.\nManufacturer specifications\n4.3.\nOperator guidelines/manuals\n4.4.\nTools and equipment used for maintenance\n4.5.\nSpare parts and materials used in maintaining specialised\nmachinery\n4.6.\nMaintenance procedures\n4.7.\nWorkplace documentation\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nThrough portfolio evidence\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions. It should address a range of equipment that is\nreflective of the workplace.\n\n--- PDF PAGE 123 ---\nTR - Horticulture NC III\n\n- 119 -\nUNIT OF COMPETENCY :\nINSTALL IRRIGATION SYSTEMS\nUNIT CODE\n:"
        },
        "source_text": "AGR611332\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to maintain\nspecialised machinery and equipment. Specialised machinery and\nequipment refers to machinery and equipment used principally in\nagriculture and horticulture, work where there is high wear and tear\non components. It requires the ability to carry out engine and\nequipment checks, undertake transmission checks, maintain high\nwear components and attachments, and record maintenance work.\nPerforming specialized machinery maintenance requires knowledge\nof general machine function principles and maintenance, and\noperational replacement wear component requirements and\nprocedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Carry out\nprimemover checks\n1.1\nRegular primemover checks are carried out on specialised\nmachinery and equipment as specified in operator’s\nmanual. After use check-up.\n1.2\nAll relevant grease or lubricant points are lubricated according\nto manufacturers’ specifications. Regular periodic check-up.\n1.3\nOils and filters are changed at intervals prescribed in\noperator’s manual.\n1.4\nSystems (i.e. cooling, electrical, lubrication, etc.) checked for\ndeterioration and defects acted upon in line with supervisor’s\ninstructions.\n1.5\nOHS hazards in the workplace are identified, risk assessed\nand reported according to enterprise requirements.\n2. Carry out\ntransmission checks\n2.1\nDrive and steering clutches are checked for operation and\nadjustment in line with operator’s manual.\n2.2\nTransmission oil levels are checked in line with operator\nmanual.\n2.3\nTracks/wheels and undercarriage are checked for oil leaks,\nwear and alignment.\n2.4\nFaulty seals or leaks are identified and corrective actions\ntaken according to operator’s instructions.\n2.5\nTransmission is regularly checked for: alignment in case of\nbelt transmission oil levels in case of enclosed transmission.\n\n--- PDF PAGE 120 ---\nTR - Horticulture NC III\n\n- 116 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Maintain components\nand attachments\n3.1\nSuitable personal protective equipment is selected, used,\nmaintained and stored according to OHS requirements.\n3.2\nMachine operational replacement wear components are\nchecked for wear and condition.\n3.3\nWorn or unserviceable replacement components are replaced\nas part of daily routines.\n3.4\nComponent inspection and replacement activities are\ncompleted safely following enterprise and industry guidelines.\n3.5\nMoving operational components are checked for wear and\ncondition and adjusted to the tolerances specified in the\noperator’s manual where applicable.\n3.6\nWork areas are cleaned, returned to operating condition and\nmaintained according to enterprise and OHS requirements.\n4. Record maintenance\n4.1\nIdentified faults and defects are recorded in machine record.\n4.2\nMaintenance procedures including duplicates usage are\nrecorded in workshop record.\n4.3\nService or repair requirements are reported and acted upon\naccording to prescribed procedures.\n\n--- PDF PAGE 121 ---\nTR - Horticulture NC III\n\n- 117 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. specialised\nmachinery and\nequipment\n1.1.\nSelf-propelled machinery and equipment for crop production\n(i.e. land levellers, front end loaders); harvesting (i.e. cane\nharvester, rice combine, corn harvester, etc.) and post-harvest\nmachinery (i.e. rice mill plant, drying plant, etc.)\n2. primemovers\n2.1.\nThis may include the internal combustion engines or electric\nmotors.\n3. hazards\n3.1.\nWorkplace hazards may include exposure to loud noise and\nfumes, solar radiation, dust, and hazardous substances. It\nmay also include oil and grease spills, electricity, mechanical\nmalfunctions and entanglement with machinery and\nequipment from exposed moving parts including hydraulics.\n4. personal\nprotective\nequipment\n4.1.\nThis may include boots, hat/hard hat, overalls, gloves,\nprotective eyewear, safety harness, hearing protection,\nrespirator or dust mask, and sun protection (sun hat,\nsunscreen).\n5. OHS\n\nSafe systems and procedures for:\n5.1.\noperating and maintaining machinery and equipment including\nhydraulics and guarding of exposed moving parts.\n5.2.\nhazard and risk control.\n5.3.\nmanual handling including lifting and carrying.\n5.4.\nthe provision of safety decals and signage.\n5.5.\nhandling, application and storage of hazardous substances.\n5.6.\noutdoor work including protection from solar radiation, dust\nand noise.\n5.7.\nlock out or danger tag procedures.\n5.8.\nprotection of people in the workplace.\n5.9.\nthe appropriate use, maintenance and storage of personal\nprotective clothing and equipment.\n6. regular\nmaintenance\nchecks\n\n6.1.\nGauges, fan, engine oil, air cleaners (wet and dry), visible\ngaskets, exhaust colour, tyres, tracks, track rollers and\ncarriers, fuel and oil filters, crankcase ventilation, cooling\nsystems, belts and chains, transmission, gearbox, hydraulic\nhoses, hydraulic systems, final drives, oilers, batteries and\nelectrical systems, level linkage wear, oil and fuel leaks,\nbrakes, Rollover Protection Systems/safety guards, guards\nover exposed parts, sources of hazardous noise.\n7. machinery and\nequipment\nmaintenance\n7.1.\nOperating checks, daily checks, programmed maintenance,\nbreakdown maintenance, prescribed lubrication.\n8. transmission\n8.1.\nClutches, gearbox, direct drive and power shaft transmission,\ntorque converter, final drives, includes universal Joints, drive\nlinks.\n9. tracks/wheels and\nundercarriage\n9.1.\nSprockets, idler wheels, track roller frames, track rollers,\ncarrier rollers, track chains, track shoes and grousers, tyre\npressure, power transfer links and abnormal wear patterns.\n10.engine equipment\n10.1. Oil/coolant levels, filters, oil, air, fuel, and air conditioner.\n11.machine\noperational\nreplacement wear\ncomponents\n11.1. Ground engaging components, buckets, blades, cutter teeth\nand forks and other components specified in the operator’s\nmanual.\n12.moving\noperational\ncomponents\n12.1. Elevator and loading chains, cutters/knives, belts and other\ncomponents specified in the operator’s manual.\n\n--- PDF PAGE 122 ---\nTR - Horticulture NC III\n\n- 118 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate :\n1.1.\nMaintained specialised machinery and equipment according to\nenterprise guidelines and industry best practice\nThe skills and knowledge required to maintain specialised machinery\nand equipment must be transferable (normal and adverse work\nconditions) to a range of work environments and contexts. For\nexample, this could include different machinery and equipment,\noperational systems, maintenance procedures and working\nenvironments\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this standard in\nthe workplace, to transfer the skills to other contexts and to deal with\nunplanned events. The knowledge requirements for this unit are\nlisted below.\n2.1.\nEngine function principles.\n2.2.\nTurbo charging and after cooling.\n2.3.\nAssessing engine specifications in line with power\nrequirements.\n2.4.\nAll engine electric and hydraulic indicators and gauges.\n2.5.\nTransmission and drive systems.\n2.6.\nSafety including relevant OHS issues, OHS legislative\nrequirements and Codes of Practice.\n2.7.\nMachinery and equipment operation principles.\n2.8.\nOHS responsibilities of employees and employers.\n2.9.\nHazard identification and control.\n3. Underpinning Skills\nTo achieve the performance criteria, some complementary skills are\nrequired. These skills include the ability to:\n3.1.\nread and comprehend operator’s manuals\n3.2.\ncarry out engine/equipment checks\n3.3.\ncarry out transmission checks.\n3.4.\nmaintain machinery and equipment components.\n3.5.\nrecord maintenance.\n4. Resource Implication\n\n4.1.\nSpecialised equipment\n4.2.\nManufacturer specifications\n4.3.\nOperator guidelines/manuals\n4.4.\nTools and equipment used for maintenance\n4.5.\nSpare parts and materials used in maintaining specialised\nmachinery\n4.6.\nMaintenance procedures\n4.7.\nWorkplace documentation\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nThrough portfolio evidence\n6. Context of\nAssessment\n6.1.\nAssessment should be in a workplace.\n6.2.\nDemonstration of competency over time and on a number of\noccasions. It should address a range of equipment that is\nreflective of the workplace.\n\n--- PDF PAGE 123 ---\nTR - Horticulture NC III\n\n- 119 -\nUNIT OF COMPETENCY :\nINSTALL IRRIGATION SYSTEMS\nUNIT CODE\n:"
