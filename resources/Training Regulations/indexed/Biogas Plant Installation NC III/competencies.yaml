        "source_title": "PERFORM MENSURATIONS AND CALCULATIONS",
        "source_text": "--- PDF PAGE 59 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 55 \n \nUNIT OF COMPETENCY: \nPERFORM MENSURATIONS AND CALCULATIONS  \nUNIT CODE                     : \nCON311203 \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes on \nidentifying and measuring objects based on the required \nperformance standards.  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select measuring \ninstruments \n \n1.1 Object or component \nto be measured is  \nidentified, classified \nand interpreted \naccording to the \nappropriate regular \ngeometric shape  \n1.2 Measuring tools are \nselected/identified \nas per object to be \nmeasured or job \nrequirements \n1.3 Correct \nspecifications are \nobtained from \nrelevant sources \n1.4 Appropriate \nmeasuring \ninstruments are \nselected according \nto job requirements  \n1.5 Alternative \nmeasuring tools are \nused without \nsacrificing cost and \nquality of work \n \n1.1 Types of \nmeasuring tools \nand its uses \n \n1.1 Selecting \nmeasuring \ninstruments\n\n--- PDF PAGE 60 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 56 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Carry out \nmeasurements \nand calculations \n2.1 Accurate \nmeasurements are \nobtained according \nto job requirements \n2.2 Alternative \nmeasuring tools are \nused without \nsacrificing cost and \nquality of work \n2.3 Calculation needed \nto complete work \ntasks are performed \nusing the four basic \nprocess of addition \n(+), subtraction (-), \nmultiplication (x) and \ndivision (/)  \n2.4 Calculations \ninvolving fractions, \npercentages and \nmixed numbers are \nused to complete \nworkplace tasks \n2.5 Numerical \ncomputation is self-\nchecked and \ncorrected for \naccuracy \n2.6 Instruments are read \nto the limit of \naccuracy of the tool \n2.7 Systems of \nmeasurement \nidentified and \nconverted according \nto job \nrequirements/ISO \n2.8 Workpieces are \nmeasured according \nto job requirements \n \n2.1 Measurements \n Linear \nmeasurement \n Geometrical \nmeasurement \n2.2 Trade \nMathematics \n Unit conversion \n Ratio and \nproportion \n Area \n \n \n2.1 Interpreting \nformulas for \nvolume, areas, \nperimeters of \nplane and \ngeometric \nfigures \n2.2 Handling of \nmeasuring \ninstruments\n\n--- PDF PAGE 61 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 57 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Geometric shape \n \n \n May include: \n1.1 Round \n1.2 Square \n1.3 Rectangular \n1.4 Triangle \n1.5 Sphere \n1.6 Conical \n2. Measuring instruments \nMay include: \n2.1 Micrometer (In-out, depth) \n2.2 Vernier caliper (out, inside) \n2.3 Dial gauge with mag, std. \n2.4 Straight edge \n2.5 Thickness gauge \n2.6 Torque gauge \n2.7 Small hole gauge \n2.8 Telescopic gauge \n2.9 Try-square \n2.10 Protractor \n2.11 Combination gauge \n2.12 Steel rule \n2.13 Voltmeter \n2.14 Ammeter \n2.15 Mega ohmeter \n2.16 Kilowatt hour meter \n2.17 Gauges \n2.18 Thermometers \n3. Measurements and \ncalculations \n \nMay include: \n3.1 Linear \n3.2 Volume \n3.3 Area \n3.4 Wattage \n3.5 Voltage \n3.6 Resistance \n3.7 Amperage \n3.8 Frequency \n3.9 Impedance \n3.10 Conductance \n3.11 Capacitance \n3.12 Displacement \n3.13 Inside diameter \n3.14 Circumference \n3.15 Length \n3.16 Thickness \n3.17 Outside diameter  \n3.18 Taper \n3.19 Out of roundness \n3.20 Oil clearance \n3.21 End play/Thrust clearance\n\n--- PDF PAGE 62 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 58 \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires that the candidate: \n1.1 Selected and prepared appropriate measuring instruments in \naccordance with job requirements \n1.2 Performed measurements and calculations according to job \nrequirements/ ISO \n2. Resource implications \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Problems to solve \n2.3 Measuring instrument appropriate to carry out tasks \n2.4 Instructional materials relevant to the propose activity \n \nAssessment of underpinning knowledge and practical skills may \nbe combined \n3. Methods of \nassessment \nCompetency should be assessed through: \n3.1 Actual demonstration \n3.2 Direct observation \n3.3 Written test/questioning related to underpinning knowledge \n4. Context of assessment \n4.1 Competency assessment may occur in workplace or any    \nappropriate simulated environment \n4.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n4.3 Competency assessment must be undertaken in accordance \nwith the TESDA assessment guidelines\n",
