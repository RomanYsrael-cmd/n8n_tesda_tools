        "source_title": "PREPARE CONSTRUCTION MATERIALS AND TOOLS",
        "source_text": "--- PDF PAGE 49 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 45 \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY: \nPREPARE CONSTRUCTION MATERIALS AND TOOLS  \n \nUNIT CODE                     : \n \nCON931201 \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes on \nidentifying, \nrequesting \nand \nreceiving \nconstruction \n(plumbing) materials and tools in various workplace \nsettings.  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. \nIdentify \nmaterials \n \n1.1 Materials are \nidentified as per job \nrequirements \n1.2 Quantity and \ndescription of \nmaterials    conform \nwith the job \nrequirements \n1.3 Tools and \naccessories are \nidentified according \nto job requirements \n \n1.1 Different work \nspecifications \n1.2 Types and \nuses of \nplumbing \nmaterials and \naccessories \n1.3 Types and \nuses of \nplumbing tools  \n \n1.1 Identifying tools \naccording to the \njob requirements \n1.2 Identifying \nmaterials and \naccessories \naccording to the \njob requirements \n \n2 \nPrepare \nrequisition of \nmaterials \n \n2.1 Materials and tools \nneeded are \nrequested according \nto the identified \nrequirements \n2.2 Request is done as \nper company  \nstandard  operating \nprocedures (SOP) \n2.3 Substitute materials \nand tools are \nprovided  without \nsacrificing cost and \nquality of work \n2.1 Work \nrequirements \n2.2 Types and \nuses of \nplumbing \nmaterials and \ntools \n2.3 Material take-\noff \n2.4 Requisition \nprocedures \n \n2.1 Preparing material \ntake-off  \n2.2 Requesting \nmaterials and tools\n\n--- PDF PAGE 50 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 46 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3 \nReceive and \ninspect \nmaterials  \n3.1 Materials and tools \nissued are inspected \nas per quantity and \nspecification \n3.2 Tools, accessories \nand materials are \nchecked  \n3.3 Materials and tools \nare set aside to \nappropriate location  \n \n3.1 Policy on receiving \nmaterial deliveries \n3.2 Material and tools \nquality and defects \n3.3 Material handling \n \n \n3.1 Checking and \ninspecting \nmaterials and \ntools \n3.2 Storing/ stacking \nof tool and \nmaterials\n\n--- PDF PAGE 51 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 47 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Materials and Tools \n \nMay include: \n1.1 Electrical supplies \n1.2 Structural \n1.3 Plumbing \n1.4 Welding/pipefitting \n1.5 Carpentry \n1.6 Masonry \n \n2. Description of Materials and \nTools \n \nMay include: \n2.1 Brand name \n2.2 Size \n2.3 Capacity \n2.4 Kind of application \n \n3. Company standard   \nprocedures \nMay include: \n3.1 Job order \n3.2 Requisition slip \n3.3 Borrower slip \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1  Listed materials and tools according to quantity and job \nrequirements  \n1.2 Requested materials and tools according to the list \nprepared   and as per company SOP \n1.3  Inspected issued materials and tools  as per quantity \nand job specifications \n1.4 Tools provided with appropriate safety devices \n2. Resource implications \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications relevant to \nthe activities \n \n3. Methods of assessment \n \nCompetency in this unit must be assessed through: \n4.1 Direct observation and oral questioning \n \n4. Context of assessment \n \n4.1 Competency may be assessed in the workplace or in a \nsimulated workplace \n4.2  Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n",
