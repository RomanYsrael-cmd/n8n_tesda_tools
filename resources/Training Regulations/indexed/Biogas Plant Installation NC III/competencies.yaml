aste \nManagement Act of \n2000 \n4.10 Factors affecting \nproductivity \n4.11 Productivity work \nmeasurement \n4.12 Ways of \nimproving \nproductivity \n4.13 Attitude: \n Trustworthy \ndocumentation \n4.7 Applying safety \npractices following \nOSHS rule 1150, \n1080,1945 and \nPNS PAES 413 \n4.8 Practicing \noccupational \nhealth, safety and \nhazards \nelimination \n4.9 Completed \nrequired output\n\n--- PDF PAGE 85 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 81 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools, materials and supplies \nTools, materials and supplies may include: \nTools \n1.1 Wrench  \n1.1.1 Pipe wrench \n1.1.2 Combination wrench \n1.1.3 Adjustable wrench \n1.1.4 Allen wrench \n1.2 Hacksaw \n1.3 Screw driver \n1.4 Steel tape \n1.5 Pail \n1.6 Pipe cutter \n1.7 Pipe fitter tool kit \n1.8 Pipe fitter clamp \nMaterials and supplies \n1.9 Pipes and fittings, (PVC, PE, GI) \n1.10 Valves (PVC, PE, brass) \n1.11 Screw \n1.12 Teflon tape \n1.13 Sealant  \n1.14 Sand paper  \n1.15 Detergent soap \n1.16 Solvent cement \n1.17 Pipe support \nEquipment \n1.18 Compressor  \n1.19 Grinder cutter \n2.  Fittings \n \nFittings may include but not limited to: \n2.1 Tee elbow \n2.2 Coupling \n2.3 Lock \n2.4 Valve \n2.5 Elbow \n2.6 Endcap \n2.7 Flow meter \n2.8 Check valve \n2.8.1 Pressure gauge \n2.8.2 Pressure relief valve \n2.8.3 Gate valve \n2.9 Flame arrester \n3. Installation activities \nInstallation activities may include but not limited to: \n3.1 Installation of pipes \n3.2 Installation of fittings \n3.3 Installation of water trap \n3.4 Installation of gas valves \n4. Precautionary measures \nPrecautionary measures may include: \n4.1 Pipes must be away from: \n4.1.1 Passage \n4.1.2 Humans Traffic \n4.1.3 Animals Traffic\n\n--- PDF PAGE 86 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 82 \n4.1.4 Flame source \n4.2 Installed pipes must be accessible and visible, and properly\nsupported \n4.3 Installing safety signs and warnings \n5. Gas leak test result \nGas leak test result may include: \n5.1 Unfitted pipe \n5.2 Cracked pipe \n5.3 Valve installation problem \n6. Environmental laws \nMay include: \n6.1 PD 1586 – Environmental Impact Assessment System \n6.2 RA 9003-Ecological Solid Waste Management Act of \n2000 \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Managed preparation activities \n1.2 Installed PVC pipes, gas conduits and fittings \n1.3 Performed quality control \n1.4 Supervised post-installation activities \n1.5 Applied safety practices \n1.6 Observed and complied with the productivity \nrequirements \n2.  Resource implications  \nThe following resources should be provided: \n2.1 Simulated or actual biogas construction workplace \n2.2 Tools, materials, supplies and equipment required to \ndemonstrate required tasks on pipefitting works \n2.3 Biogas System Operation Manual \n2.4 Approved plan \n2.5 PPEs \n3.  Methods of assessment \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Demonstration/Direct observation Oral questioning \n3.3 Third party report (should be supported with other \nassessment method) \n3.4 Portfolio \n3.5 Case study \n4.  Context for assessment \n4.1 Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2 Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
