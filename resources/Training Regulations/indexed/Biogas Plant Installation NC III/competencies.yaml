  "source_section_text": "SECTION 1\nBIOGAS PLANT INSTALLATION NC III QUALIFICATION\nThe BIOGAS PLANT INSTALLATION NC III Qualification consists of\ncompetencies that a person must achieve to lead in the installation of biogas system. It\nconsists of performing preparatory activities, overseeing and participating in the\nconstruction activities of biogas digester, leading in the installation of gas conveyance,\nconducting biogas quality assessment tasks and managing construction of secondary\nstorage. This covered small (below 150 cubic meter), medium scale (150-499 cubic\nmeter) up to large scale (500 cubic meters and above) production of biogas. In large\nscale, the individual is required to report to a site/project engineer.\nThis Qualification is packaged from the competency map of the Agriculture,\nForestry and Fishery Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\nApply critical thinking and problem solving techniques in the\nworkplace\n400311322\nWork in a diverse environment\n400311323\nPropose methods of applying learning and innovation in the\norganization\n400311324\nUse information systematically\n400311325\nEvaluate occupational safety and health work practices\n400311326\nEvaluate environmental work practices\n400311327\nFacilitate entrepreneurial skills for micro-small-medium enterprises\n(MSMES)\nUNIT CODE\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311202\nInterpret technical drawings and plans\nCON311203\nPerform mensuration and calculations\nCON311204\nMaintain tools and equipment\nUNIT CODE\nCORE COMPETENCIES\nAFF312301\nLead biogas plant site preparation\nAFF312302\nSupervise biogas plant construction\nAFF312303\nLead installation of biogas conveyance system\n\n--- PDF PAGE 6 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 2\nA person who has achieved this Qualification is competent to be:\n\n• Biogas Project Supervisor/ Foreman\n• Biogas Plant Construction Lead Man/ Foreman\n• Biogas Piping Specialist\n\n--- PDF PAGE 7 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 3"
}
