        "source_text": "--- PDF PAGE 68 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 64 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nLEAD BIOGAS PLANT SITE PREPARATION \n \nUNIT CODE \n: \nAFF312301 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to lead in the preparation and acquisition of \ntools, materials and equipment, source out labor and \nmachineries, perform ocular survey, set-up boundaries \nand elevation, comply with legal requirements on \nclearing activities, oversee removal of obstructions, \nand monitor clearing activities.  This may be performed \nwith one or more assistants working with the lead \ntechnical personnel. \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILLS \n1. Perform \npreparatory \nactivities \n \n \n1.1 Approved project plan \nand required permits \nare secured and \nconfirmed with \nagricultural engineer. \n1.2 Program of activities is \nprepared based on \napproved project plan \n1.3 1.3 Preparation and \nacquisition of tools, \nmaterials and \nequipment is led \nfollowing program of \nactivities  \n1.4 1.4 Manpower and \nequipment \nrequirement are \nsourced out following \nprogram of activities   \n1.5 1.5 Safety practices \nare applied following \nOSHS Rule 1080 and \nRule 1150 \n1.6 1.6 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule \n1.1 Approved Project \nPlans \n1.2 Preparation and \nacquisition of tools \nmaterials and \nequipment \n1.3 Schedule of works \n- PERT CPM \n- Gantt Chart \n1.4 Sourcing of labor \nand machineries \n1.5 Communication \nskills \n1.6 OSHS \n1.6.1 Rule 1410 and \nDO 13: \nConstruction \nSafety \n 1082-Eye and \nFace Protection \n 1083 – \nRespiratory \nProtection \n 1084 – Head \nprotection \n 1085 – Head \nand Arm \nProtection \n Use of Safety \n1.1 Securing and \nconfirming \nproject plans \n1.2 Leading \npreparation and \nacquisition of \ntools, materials \nand equipment \n1.3 Sourcing out  \nmanpower and  \nequipment \n1.4 Applied safety \npractices \n1.5 Using PERT \nCPM/Gantt Chart \n1.6 Interpreting \nproject plans \n1.7 Practicing \noccupational \nhealth, safety \nand hazards \nelimination \n1.8 Completed \nrequired output\n\n--- PDF PAGE 69 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 65 \nShoes \n1.6.2 Rule 1150: \nMaterials \nHandling and \nStorage \n Use of \nMechanical \nEquipment \n Secure Storage \n Clearance Limit \n1.7 Environmental \nLaws: \n1.8 PD 1586 – \nEnvironmental \nImpact \nAssessment \nSystem \n1.9 RA 8749 - Clean \nAir Act of 1999 \n1.10 RA 9275 – Clean \nWater Act of 2004 \n1.11 RA 6969-Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of \n1990 \n1.12 RA 9003-\nEcological Solid \nWaste \nManagement Act \nof 2000 \n1.13 Factors affecting    \nproductivity \n1.14 Productivity work  \nmeasurement \n1.15 Ways of improving  \nproductivity \n1.16 Attitude: \n Focus to details \n Polite \n Diligent \n Time conscious \n Resourceful \n2. Confirm site \nlocation \n2.1 Ocular survey is \nperformed based on \napproved project plan \nspecifications  \n2.2 Inspection checklist is \naccomplished based \non project plan \nspecification. \n2.3 Problems encountered \n2.1 Ocular survey \n2.2 Inspection checklist \n2.3 Project plan \nspecification \n2.4 OSHS \n2.4.1 Rule 1410 and \nDO 13: \nConstruction \nSafety \n2.1 Performing ocular \nsurvey \n2.2 Accomplishing \ninspection \nchecklist  \n2.3 Consulting \nproblems \n2.4 Setting up \nboundaries and\n\n--- PDF PAGE 70 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 66 \nare consulted with the \nappropriate person  \n2.4 Setting up boundaries \nand elevation on \nselected site are \nconducted based on \nindustry practices \n2.5 Safety practices are \napplied following \nOSHS Rule 1410 and \nDO 13 – Construction \nSafety, Rule 1080 \n2.6 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule \n 1412- General \nProvision \n 1413- Excavation \n2.4.2 Rule 1080 – \nPersonal \nProtective \nEquipment and \nDevices \n 1082-Eye and \nFace Protection \n 1083 – \nRespiratory \nProtection \n 1084 – Head \nprotection \n 1085 – Head and \nArm Protection \n Use of Safety \nShoes \n2.5 Problems \nencountered \n2.6 Consultation with \nimmediate head \n2.7 Communication \nskills \n2.8 Setting up \nboundaries and \nelevation \n2.9 Site selection \n2.10 Factors affecting \nproductivity \n2.11 Productivity work \nmeasurement \n2.12 Ways of \nimproving \nproductivity \n2.13 Attitude: \n \nFocus to \ndetails \n \nPolite \n \nDiligent \n \nResourceful  \nelevation \n2.5 Practicing \noccupational \nhealth, safety and \nhazards \nelimination \n2.7 Completed \nrequired output \n \n3. Supervise \nland clearing \nactivities \n3.1 Removal of \nobstructions are \noverseen following \nwork requirements \nand environmental \nlaws. \n3.2 Clearing activities are \nmonitored following \nprogram of activities \nand environmental \nlaws. \n3.3 Accomplishment \n3.1 Related permits in \nclearing activities \n3.2 Removal of \nobstructions \n3.3 Clearing activities \nprocedures \n3.4 Accomplishment \nreports \n3.5 OSHS \n3.5.1 Rule 1410 and \nDO 13: \nConstruction \n3.1 Securing related \npermits \n3.2 Overseeing \nremoval of \nobstructions \n3.3 Monitoring \nclearing activities \n3.4 Accomplishing \nreports \n3.5 Monitoring \npractice of safety \nmeasures\n\n--- PDF PAGE 71 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 67 \nreports are prepared \nbased on clearing \nactivities. \n3.4 Practice of safety \nmeasures is monitored \naccording to OSHS \nRule 1410 and DO 13 \n– Construction Safety, \nRule 1080 \n3.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule \nSafety \n 1412- General \nProvision \n 1413- Excavation \n3.5.2 Rule 1080: \nPersonal \nProtective \nServices \n 1082-Eye and Face \nProtection \n 1083 – Respiratory \nProtection \n 1084 – Head \nprotection \n 1085 – Head and \nArm Protection \n Use of Safety \nShoes \n3.6 PD 1586 – \nEnvironmental \nImpact Assessment \nSystem \n3.7 RA 9003-\nEcological Solid \nWaste \nManagement Act of \n2000 \n3.8 Factors affecting \nproductivity \n3.9 Productivity work  \nmeasurement \n3.10Ways of improving \nproductivity \n3.6 Practicing \noccupational \nhealth, safety and \nhazards \nelimination \n3.7 Completed \nrequired output\n\n--- PDF PAGE 72 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 68 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Required permits \nRelated permits may include: \n1.2 Environmental Impact Assessment Survey  \n1.1 Environmental Compliance Certificate  \n1.3 Permit to operate air pollution source installation \n1.4Waste water discharge permit \n1.5 Hazardous waste generator ID \n1.6 Municipal Land use zoning certificate \n1.7 Building permit \n1.5 Excavation permit \n2. Tools \n \n \nTools may include but not limited to: \n2.1 Rake \n2.2 Machete (Bolo) \n2.3 Pick Mattock (Piko) \n2.4 Spade \n2.5 Wheel barrow/construction cart \n2.6 Pail \n2.7 Digging bars \n2.8 Prunning cutter \n2.9 Measuring tape \n2.10 Weststone \n3. Equipment \nEquipment may include: \n3.1 Compactor \n3.2 Demolition hammer \n3.3 Chipping gun \n3.4 Grass cutter \n3.5 Pump \nEquipment rental: \n3.6 Backhoe \n3.7 Dump truck \n3.8 Bulldozer \n3.9 Boom truck \n4. Materials \nMaterials may include: \n4.1 Sack \n4.2 Staking and lay outing materials (lumber, common nail \nand tying materials-nylon) \n4.3 Reinforce concrete pipe (RCP) \n4.4 Fuel \n \n4.5 PPEs (hard hat, safety vest, gloves, masks, safety shoes) \n5.Program of activities \nMay include: \n5.1 PERT CPM \n5.2 Gantt chart \n5.3 Schedule of works \n6.Project plan specifications \nMay include: \n6.1 Lot title  \n6.2 Lot plan \n6.3 Site development plan \n6.4 Land area \n6.5 Size of digester \n6.6 Type of digester \n6.7 Topography\n\n--- PDF PAGE 73 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 69 \n6.8 Module/design \n6.9 Resources \n \n7.Problems  \nProblems may include: \n7.1 Inundated area \n7.2 Topography \n7.3 Resources \n7.4 Ownership of sites \n7.5 Soil type \n7.6 Water saturation \n8.Appropriate person \nMay include: \n8.1 Immediate head \n8.2 Owner/client \n \n9. Environmental laws \nMay include: \n9.1 PD 1586 – Environmental Impact Assessment System \n9.2 RA 9003-Ecological Solid Waste Management Act of \n2000 \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Performed preparatory activities \n1.2 Confirmed site location \n1.3 Supervised land clearing activities \n1.4 Applied safety practices \n1.5 Observed and complied with the productivity  \n      requirements \n2.  Resource implications  \nThe following resources should be provided: \n2.1 Simulated or actual site \n2.2 Tools, materials and equipment required to demonstrate \nthe task on site preparation \n2.3 PPEs \n2.4 References and manual \n2.5 Approved project plan \n3.  Methods of assessment \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Demonstration/Direct observation with oral questioning \n3.3 Oral questioning \n3.4 Third party report (should be supported with other \nassessment method) \n3.5 Portfolio \n3.6 Case study \n4.  Context for assessment \n4.1 Competency assessment may occur in workplace or any \nappropriately simulated environment. \n4.2 Assessment may be performed on multiple occasions \ninvolving a combination of direct, indirect and \nsupplementary forms of evidence.\n",
