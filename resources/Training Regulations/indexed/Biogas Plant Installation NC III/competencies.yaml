        "source_text": "--- PDF PAGE 12 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 8 \nUNIT OF COMPETENCY : \n LEAD SMALL TEAMS  \nUNIT CODE  \n \n:  \n400311320 \nUNIT DESCRIPTOR \n:  \nThis unit covers the knowledge, skills and attitudes to  \nlead small teams including setting, maintaining and \nmonitoring \nteam \nand \nindividual \nperformance \nstandards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Provide team \nleadership \n1.1   Work \nrequirements are \nidentified and \npresented to team \nmembers based \non company \npolicies and \nprocedures \n1.2   Reasons for \ninstructions and \nrequirements are \ncommunicated to \nteam members \nbased on \ncompany policies \nand procedures \n1.3  Team members’ \nand leaders’ \nconcerns are \nrecognized, \ndiscussed and \ndealt with based \non company \npractices \n1.1  Facilitation of \nTeam work \n1.2  Company policies \nand procedures \nrelating to work \nperformance \n1.3  Performance \nstandards and \nexpectations \n1.4  Monitoring \nindividual’s and \nteam’s \nperformance vis \na vis client’s and \ngroup’s \nexpectations \n1.1 Communication   \n      skills required   \n      for leading  \n      teams \n1.2  Group facilitation \nskills \n1.3  Negotiating skills \n1.4  Setting \nperformance \nexpectation \n2. Assign \nresponsibilities \n2.1. Responsibilities \nare allocated \nhaving regard to \nthe skills, \nknowledge and \naptitude required \nto undertake the \nassigned  task \nbased on \ncompany policies. \n2.2. Duties are \n2.1  Work plan and \nprocedures \n2.2  Work \nrequirements and \ntargets \n2.2  Individual and \ngroup \nexpectations and \nassignments \n2.1 Communication \nskills \n2.2  Management \nskills \n2.3  Negotiating skills \n2.4  Evaluation skills \n2.5   Identifying team \nmember’s\n\n--- PDF PAGE 13 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 9 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nallocated having \nregard to \nindividual \npreference, \ndomestic and \npersonal \nconsiderations, \nwhenever possible \n2.3  Ways to improve \ngroup leadership \nand membership \nstrengths and \nrooms for \nimprovement \n \n3. Set \nperformance \nexpectations for \nteam members \n3.1  Performance \nexpectations are \nestablished based \non client needs  \n3.2  Performance \nexpectations are \nbased on individual \nteam members \nknowledge, skills \nand aptitude  \n3.3  Performance \nexpectations are \ndiscussed and \ndisseminated to \nindividual team \nmembers \n3.1  One’s roles and \nresponsibilities in \nthe team \n3.2  Feedback giving \nand receiving \n3.3  Performance \nexpectation \n \n \n3.1Communication \nskills \n3.2  Accurate empathy \n3.3  Congruence \n3.4  Unconditional \npositive regard \n3.5  Handling of \nFeedback \n \n4.  Supervise team \nperformance \n4.1 Performance is \nmonitored based \non defined \nperformance \ncriteria and/or \nassignment \ninstruction \n 4.2  Team members \nare provided with \nfeedback, positive \nsupport and advice \non strategies to \novercome any \ndeficiencies based \non company \npractices \n4.3  Performance \nissues which \ncannot be rectified \n4.1  Performance \nCoaching  \n4.2  Performance \nmanagement \n4.3  Performance \nIssues \n \n \n4.1  Communication \nskills required for \nleading teams \n4.2  Coaching skill\n\n--- PDF PAGE 14 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 10 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nor addressed \nwithin the team are \nreferred to \nappropriate \npersonnel \naccording to \nemployer policy \n4.4  Team members \nare kept informed \nof any changes in \nthe priority \nallocated to \nassignments or \ntasks which might \nimpact on \nclient/customer \nneeds and \nsatisfaction \n4.5  Team operations \nare monitored to \nensure that \nemployer/client \nneeds and \nrequirements are \nmet \n4.6  Follow-up \ncommunication is \nprovided on all \nissues affecting the \nteam \n 4.7 All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany \nprocedures\n\n--- PDF PAGE 15 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 11 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Work requirements \nMay include: \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s concerns \nMay include: \n2.1 Roster/shift details \n3. Monitor performance \nMay include: \n3.1 Formal process \n3.2 Informal process \n4. Feedback \nMay include: \n4.1 Formal process \n4.2 Informal process \n5. Performance issues \nMay include: \n5.1 Work output \n5.2 Work quality \n5.3 Team participation \n5.4 Compliance with workplace protocols \n5.5 Safety \n5.6 Customer service\n\n--- PDF PAGE 16 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 12 \nEVIDENCE GUIDE \n1. \nCritical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 \nMaintained or improved individuals and/or team performance \ngiven a variety of possible scenario \n1.2 \nAssessed and monitored team and individual performance \nagainst set criteria \n1.3 \nRepresented concerns of a team and individual to next level of \nmanagement or appropriate specialist and to negotiate on their \nbehalf \n1.4 \nAllocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the needs of the \ntasks to be performed \n1.5 \nSet and communicated performance expectations for a range \nof tasks and duties within the team and provided feedback to \nteam members \n2. \nResource \nThe following resources should be provided: \n2.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2 \nMaterials relevant to the proposed activity or task \n3. \nMethods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nWritten Examination \n3.2 \nOral Questioning  \n3.3 \nPortfolio \n4. \nContext for \nAssessment \n4.1     Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
