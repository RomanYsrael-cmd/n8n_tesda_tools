d \nleverage of cultural \ndiversity \n3.2 Inclusivity and \nconflict resolution \n3.3 Workplace \nharassment \n3.4 Change \nmanagement and \nways to overcome \nresistance to \nchange \n3.5 Advanced \nstrategies for \ncustomer service \nexcellence \n3.1 Addressing \ndiversity-related \nconflicts in the \nworkplace \n3.2 Eliminating \ndiscriminatory \nbehavior towards \ncustomers and co-\nworkers \n3.3 Utilizing change \nmanagement \npolicies in the \nworkplace\n\n--- PDF PAGE 26 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 22 \n RANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nDiversity \nThis refers to diversity in both the workplace and the \ncommunity and may include divergence in: \n1.1 \nReligion \n1.2 \nEthnicity, race or nationality \n1.3 \nCulture \n1.4 \nGender, age or personality \n1.5 \nEducational background \n2. Diversity-related conflicts \nMay include conflicts that result from: \n2.1 \nDiscriminatory behaviors  \n2.2 \nDifferences of cultural practices \n2.3 \nDifferences of belief and value systems \n2.4 \nGender-based violence  \n2.5 \nWorkplace bullying \n2.6 \nCorporate jealousy \n2.7 \nLanguage barriers \n2.8 \nIndividuals being differently-abled persons \n2.9 \nAgeism (negative attitude and behavior towards \nold people) \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 \nAdjusted language and behavior as required by interactions with \ndiversity \n1.2 \nIdentified and respected individual differences in colleagues, \nclients and customers \n1.3 \nApplied relevant regulations, standards and codes of practice \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to workplace and resources \n2.2 Manuals and policies on Workplace Diversity \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning \n3.2 \nGroup discussions and interactive activities \n3.3 \nCase studies/problems involving workplace diversity issues \n3.4 \nThird-party report \n3.5 \nWritten examination \n3.6 \nRole Plays \n4. Context for \nAssessment \nCompetency assessment may occur in workplace or any appropriately \nsimulated environment\n",
