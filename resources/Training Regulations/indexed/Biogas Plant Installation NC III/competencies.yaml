          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nExamined specific workplace challenges. \n1.2. \nAnalyzed the causes of specific workplace challenges. \n1.3. \nFormulated \nresolutions \nto \nspecific \nworkplace \nchallenges. \n1.4. \nImplemented action plans and communicated results \non specific workplace challenges. \n \n2. Resource \nImplications \n2.1. \nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a range \nof situations. A bank of scenarios / case studies / what \nifs will be required as well as bank of questions which \nwill be used to probe the reason behind the observable \naction.  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation \n3.2. \nCase Formulation \n3.3. \nLife Narrative Inquiry \n3.4. \nStandardized test \n \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other relevant \nunits of competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk \nthrough of the relevant competency components.  \nThese assessment activities should include a range of \nproblems, including new, unusual and improbable situations \nthat may have happened. \n4. Context for \nAssessment \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.",
