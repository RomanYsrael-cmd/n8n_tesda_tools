nication \nproblems and \nissues \n3.5 Barriers in \ncommunication   \n \n3.1 Organizing \ninformation \n3.2 Conveying \nintended meaning \n3.3 Participating in a \nvariety \nof \nworkplace   \ndiscussions \n3.4 Complying with \norganization \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n3.5 Effective clarifying \nand probing skills \n3.6 Identifying issues \n3.7 Negotiation and\n\n--- PDF PAGE 9 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 5 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.5 Identify barriers in \ncommunication to be \naddressed \nappropriately \ncommunication \nskills\n\n--- PDF PAGE 10 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 6 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Methods of communication \nMay include: \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face-to-face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n2. Workplace discussions \nMay include: \n2.1. Coordination meetings \n2.2. Toolbox discussion \n2.3. Peer-to-peer discussion\n\n--- PDF PAGE 11 ---\nTR-Biogas Plant Installation NC III Revision 00                                     Promulgated   (2/18/2020) \n 7 \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at one time \n1.2 Demonstrated leadership skills in workplace communication   \n1.3   Made constructive contributions in workplace issues \n1.4   Sought workplace issues effectively \n1.5   Responded to workplace issues promptly \n1.6   Presented information clearly and effectively written form \n1.7   Used appropriate sources of information \n1.8   Asked appropriate questions \n1.9   Provided accurate information  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1    Variety of Information \n2.2   Communication tools \n2.3    Simulated workplace \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through:     \nCase problem \n3.1. Third-party report \n3.2. Portfolio \n3.3. Interview \n3.4. Demonstration/Role-playing \n4. Context  for \nAssessment \n4.1. Competency may be assessed in the workplace or in a \nsimulated workplace environment\n",
