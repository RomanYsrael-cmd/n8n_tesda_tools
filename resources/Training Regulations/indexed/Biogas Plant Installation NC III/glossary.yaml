      "term": "Reduce, Reuse and Recycle AIR TIGHTNESS TEST",
      "definition": "Test to show the gas chamber is air leak proof. This process has to be done right after water tightness test. In fixed-dome model the outlet tank is filled with water until the pressure reach 0.4m water column while the gas valve is closed. Water and air pressure develops inside the digester and water level at the outlet tank rises and measured. Leave for 24 hours. Allowable decrease in level must not exceed 5 mm after 24 hours otherwise the system is not air leak proof. (Reference: Philippine Agricultural Engineering Standards)."
    },
    {
