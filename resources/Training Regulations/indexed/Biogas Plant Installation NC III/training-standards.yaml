  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for BIOGAS PLANT INSTALLATION NC III.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: BIOGAS PLANT INSTALLATION Level NC III\n\nNominal Training Duration:\n\n 40 Hours\nBasic Competencies\n\n 24 Hours\nCommon Competencies\n\n120 Hours\nCore Competencies\n\n164 Hours\n\n120 Hours\nSupervised Industry Learning (SIL)\n 304 Hours\nTotal Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in leading biogas plant\nsite preparation, supervising biogas plant construction and leading installation of\nbiogas conveyance system.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 88 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 84\nBASIC COMPETENCIES\n(40 HOURS)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan\nsetting\n• Read\no Effective verbal communication\nmethods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Read\n• Effective verbal communication\nmethods\n• Group discussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 Hours\n\n--- PDF PAGE 89 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 85\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Lead small\nteams\n2.1 Provide team\nleadership\n\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational\nleadership\n• Role play on situational leadership\n•\nGroup work\n•\nRole Play\n•\nLecture/\nDiscussion\n•\nIndividual Work\n• Role Play\n• Written Test\n\n1 Hour\n\n2.2 Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies\nof current staff\n\n• Individual Work\n• Case Study