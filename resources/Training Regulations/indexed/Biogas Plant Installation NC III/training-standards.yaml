RY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology;\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainees knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence;\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\n2.1 School/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and\nTESDA Guidelines on the DTP;\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technologies that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 110 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 106\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an approach\nin training designed to enhance the knowledge and skills of the trainee through\nactual experience in the workplace to acquire specific competencies as\nprescribed in the training regulations. It is imperative that the deployment of\ntrainees in the workplace is adhered to training programs agreed by the\ninstitution and enterprise and status and progress of trainees are closely\nmonitored by the training institutions to prevent opportunity for work\nexploitation.\n• The classroom- based or in – center instruction uses of learner –centered\nmethods as well as laboratory or field- work components\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may\nbe written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated into\nthe production process and apprentices learn by working alongside the\nexperienced craftsperson.\n• Enterprise-based Training- where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based\n• Short term programs conducted by non- government organizations NGOs,\nLGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be\nconducted in informal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training program (MTP)\n\n--- PDF PAGE 111 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 107\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wants to enroll in this program must possess the\nfollowing requirements:\n\n• Good communication skills\n• At least Senior High School level or 2 years industry experience within the\nlast 5 years, preferably with experience relevant to Construction and\nPlumbing\n\n3.4\nLIST OF TOOLS, EQUIPMENT, AND MATERIALS\n\nBIOGAS PLANT INSTALLATION NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for BIOGAS PLANT INSTALLATION NC III.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices\nand their availability in the local market.\n\nA. FULL QUALIFICATION\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n6 pcs\nRake\n1 unit\nAir compressor\n5L\nGasoline fuel\n6 pcs\nBolo (scythe)\n3units\nGrass cutter\n5 sets\nStaking and lay\nouting materials\n6pcs\nWetstone (hasaan)\n1unit\nBackhoe*\n50pcs\n2”x2”x10’ lumber\n6 pcs\nMattock (Piko)\n1unit\nDozer*\n5kg\nCommon nail 2”\n6 pcs\nSpade\n1unit\nDump truck*\n5kg\nCommon nail 3”\n6 pcs\nDigging bars\n3 units\nGrinder cutter\n5kg\nCommon nail 4”\n12 pcs\nPail (2gal capacity)\n3 units\nHand drill\n200 m\nNylon string\n3pcs\nConstruction Cart\n1 unit\nChipping gun\n25 pcs\nSack\n6pcs\nMeasuring tape (50m)\n1 unit\nMixer( capacity\none-bagger)\n6 cans\nSpray paint\n6pcs\nPruning cutter\n1 unit\nConcrete vibrator\n4 pcs\nReinforce concrete\npipe (RCP)\n25 pcs\nSteel tape (5m)\n\n1 galon\nWater proofing\nSealant\n6 pcs\nHammer\n\n25 pcs\nConst