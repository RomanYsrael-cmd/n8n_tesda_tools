    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: BIOGAS PLANT INSTALLATION Level NC III\n\nNominal Training Duration:\n\n 40 Hours\nBasic Competencies\n\n 24 Hours\nCommon Competencies\n\n120 Hours\nCore Competencies\n\n164 Hours\n\n120 Hours\nSupervised Industry Learning (SIL)\n 304 Hours\nTotal Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in leading biogas plant\nsite preparation, supervising biogas plant construction and leading installation of\nbiogas conveyance system.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 88 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 84\nBASIC COMPETENCIES\n(40 HOURS)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exe