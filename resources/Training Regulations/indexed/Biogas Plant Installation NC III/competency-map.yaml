  "source_text": "COMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR\nBIOGAS PLANT INSTALLATION NC III\n\nParticipate in workplace\ncommunication\nWork in team\nenvironment\nSolve/address general\nworkplace problems\nDevelop career and life\ndecisions\nContribute to workplace\ninnovation\nPresent relevant\ninformation\nPractice occupational safety\nand health policies and\nprocedures\nExercise efficient and\neffective sustainable\npractices in the workplace\n\nPrepare construction\nmaterials and tools\nObserve procedures,\nspecifications and\nmanuals of\ninstruction\nInterpret technical\ndrawings and\nplans\nPerform mensuration\nand calculations\nMaintain tools and\nequipment\n\nLead Biogas Plant Site\nPreparation\nSupervise Biogas\nPlant Construction\nLead Installation of\nBiogas Conveyance\nSystem\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 123 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 119\nGLOSSARY OF TERMS\n\n3 R’S\nReduce, Reuse and Recycle\n\nAIR TIGHTNESS TEST\nTest to show the gas chamber is air leak proof. This process\nhas to be done right after water tightness test. In fixed-dome\nmodel the outlet tank is filled with water until the pressure\nreach 0.4m water column while the gas valve is closed. Water\nand air pressure develops inside the digester and water level\nat the outlet tank rises and measured. Leave for 24 hours.\nAllowable decrease in level must not exceed 5 mm after 24\nhours otherwise the system is not air leak proof. (Reference:\nPhilippine Agricultural Engineering Standards).\n\nBIOGAS\nThe gas produced when organic wastes decompose in the\nabsence of oxygen. The biogas is composed of 57 to 70%\nmethane, 27 to 43% carbon-dioxide and traces of hydrogen,\ncarbon monoxide, nitrogen, hydrogen sulfide and water vapor.\nIt has a heating value of 540 to 700 BTU per cu. ft.\n\nSMALL BIOGAS\nSYSTEMS\n\nBiogas system that accommodates 10 to 50 heads swine. Up\nto 12 cu m sized digester\nMEDIUM BIOGAS\nSYSTEMS\n\nBiogas system that accommodates 51 to 100 heads swine.\nMore than 12 cu m\nLARGE BIOGAS\nSYSTEM\n\nBiogas system that accommodates more than 100 heads\nswine\nCONFIRMATION OF\nAPPROVED PROJECT\nPLANS\n\nrefers to the confirmation of project details\nDIGESTER\nThe part of the biogas system where the slurry of organic\nwaste is retained to digest or be converted into biogas. Most\nof the time, the digester also contains the biogas chamber.\n\nHYDRAULIC\nRETENTION TIME\nThe number of days that organic waste slurry is supposed to\nremain inside the digester or in an anaerobic condition. The\nday the slurry enters the digester until the day it comes out.\nRecommended time is 35 days - This is the ideal time where\nmethanogenic bacteria produce the most biogas. After HRT,\nthe rate of biogas production decreases.\n\nINFLUENT\nThe mixture of liquid and organic waste which is fed into the\ndigester\n\n--- PDF PAGE 124 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 120\nINOCULANT OR\nSTARTER MIX\nA substrate with high concentration of active methanogenic\nbacteria used to hasten anaerobic digestion of organic waste;\nthe best source is the digested slurry of an active biogas\nplant.\n\nAPPROVED\nMETHODOLOGIES\n\nrefers to documented remedial actions, troubleshooting guide\n\nLEGAL REQUIREMENT\nIN CLEARING\n\nLaws and regulations in removing/uprooting trees.\nMETHANE\nA compound of carbon and hydrogen (CH4). It is a colorless,\nodorless and flammable gas. It is the main components of\nnatural gas, coal gas and biogas.\n\nMETHANOGENIC\nBACTERIA OR\nMETHANOGENS\nBacteria that converts organic materials into biogas under\nanaerobic condition. These bacteria produce more biogas in\nhigher temperature. Countries near the equator.\n\nOSHS\nAcronym for “Occupational Safety and Health Standards”\n\nPAES\nAcronym for “Philippine Agricultural Engineering Standards”.\n\nPARAFFIN WAX\nWax used in making candle. In biogas, paraffin wax is used to\nseal minor leaks inside the digester\n\nPERT CPM\nAcronym for “Program Evaluation and Review Technique –\nCritical Path Method” – tool used to assist the project\nmanager in scheduling the activities (i.e., when should each\nactivity start). It includes flow of materials, labor and\nequipment. It assumes that activity durations are known with\ncertainty.\n\nPPE\nAcronym for “Personal Protective Equipment”\n\nQUALITY CONTROL\nOverall assurance of quality of work. Mostly used in ensuring\nwater proofing and air proofing of the digester chamber and\nperipherals. This includes piping works and appliance.\n\nSCUM\nThe entrained solids caught up by the gas bubbles rising to\nthe water surface. Cumulative formation of scum inhibits\nbiogas production and to extreme extent scum may block the\ndigester gas outlet pipe\n\nSEDIMENT\nSolid particles that separates from the slurry and sinks to the\nbottom of the digester i.e. stones, sand, soil, etc.\n\n--- PDF PAGE 125 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 121\nSLURRY\nMixture of manure and water usually coming from livestock\npens.\n\nROUTINARY\nMAINTENANCE\nExpected maintenance activities of a completed biogas\nsystem. i.e. a) formation of water vapor on gas conveyance\npipes, b) removal of scum and sediments inside the digester\n\nTOOLBOX MEETING\n\nrefers to orientation on construction jobs\nWATER (LIQUID)\nTIGHTNESS TEST\nThe digester should be filled with water up to the inlet and\noutlet pipes level. Allow it to set for 3 to 5 hours until the walls\nare saturated with water and mark the water level. Set it\novernight, if there is significant drop in water level leaks must\nbe remedied. Reference “Philippine Agricultural Engineering\nStandards”.\n\n--- PDF PAGE 126 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 122\n\nTRAINING REGULATIONS (TRs)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBiogas Plant Installation NCIII\nQualification Code:\nAFFBPI320\n\nRevision\nNo.\nDocument\nDescription Types*\nQualification Title\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nBiogas Plant Installation NC III\nTB No. 2020-03 /\n 02/18/2020\nTESDA Circular No.\n072 series of 2020\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 127 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 123",
