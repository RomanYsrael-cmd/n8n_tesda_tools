      "text": "5 For Industry Assessor • Holder of National Certificate on • Holder of Certificate of Competency (COC) in Conduct Competency Assessment under the Trainers Methodology Level I (TM I) • Have at least two (2) years relevant industry experience • Have assisted in the actual conduct of assessment to at least two (2) candidates. --- PDF PAGE 122 --- TR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020) 118 Annex A COMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR Participate in workplace communication Work in team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Prepare construction materials and tools Observe procedures, specifications and manuals of instruction Interpret technical drawings and plans Perform mensuration and calculations Maintain tools and equipment Lead Biogas Plant Site Preparation Supervise Biogas Plant Construction Lead Installation of Biogas Conveyance System --- PDF PAGE 123 --- TR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020) 119 3 R’S Reduce, Reuse and Recycle Test to show the gas chamber is air leak proof. This process has to be done right after water tightness test. In fixed-dome model the outlet tank is filled with water until the pressure reach 0.4m water column while the gas valve is closed. Water and air pressure develops inside the digester and water level at the outlet tank rises and measured. Leave for 24 hours. Allowable decrease in level must not exceed 5 mm after 24 hours otherwise the system is not air leak proof. (Reference: Philippine Agricultural Engineering Standards). The gas produced when organic wastes decompose in the absence of oxygen. The biogas is composed of 57 to 70% methane, 27 to 43% carbon-dioxide and traces of hydrogen, carbon monoxide, nitrogen, hydrogen sulfide and water vapor. It has a heating value of 540 to 700 BTU per cu. ft. Biogas system that accommodates 10 to 50 heads swine. Up to 12 cu m sized digester Biogas system that accommodates 51 to 100 heads swine. More than 12 cu m Biogas system that accommodates more than 100 heads swine refers to the confirmation of project details The part of the biogas system where the slurry of organic waste is retained to digest or be converted into biogas. Most of the time, the digester also contains the biogas chamber. The number of days that organic waste slurry is supposed to remain inside the digester or in an anaerobic condition. The day the slurry enters the digester until the day it comes out. Recommended time is 35 days - This is the ideal time where methanogenic bacteria produce the most biogas. After HRT, the rate of biogas production decreases. The mixture of liquid and organic waste which is fed into the digester --- PDF PAGE 124 --- TR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020) 120 A substrate with high concentration of active methanogenic bacteria used to hasten anaerobic digestion of organic waste; the best source is the digested slurry of an active biogas plant. refers to documented remedial actions, troubleshooting guide Laws and regulations in removing/uprooting trees. A compound of carbon and hydrogen (CH4). It is a colorless, odorless and flammable gas. It is the main components of natural gas, coal gas and biogas. Bacteria that converts organic materials into biogas under anaerobic condition. These bacteria produce more biogas in higher temperature. Countries near the equator. Acronym for “Occupational Safety and Health Standards” Acronym for “Philippine Agricultural Engineering Standards”. Wax used in making candle. In biogas, paraffin wax is used to seal minor leaks inside the digester Acronym for “Program Evaluation and Review Technique – Critical Path Method” – tool used to assist the project manager in scheduling the activities (i.e., when should each activity start). It includes flow of materials, labor and equipment. It assumes that activity durations are known with certainty. PPE Acronym for “Personal Protective Equipment” Overall assurance of quality of work. Mostly used in ensuring water proofing and air proofing of the digester chamber and peripherals. This includes piping works and appliance. The entrained solids caught up by the gas bubbles rising to the water surface. Cumulative formation of scum inhibits biogas production and to extreme extent scum may block the digester gas outlet pipe Solid particles that separates from the slurry and sinks to the bottom of the digester i.e. stones, sand, soil, etc. --- PDF PAGE 125 --- TR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020) 121 Mixture of manure and water usually coming from livestock pens. Expected maintenance activities of a completed biogas system. i.e. a) formation of water vapor on gas conveyance pipes, b) removal of scum and sediments inside the digester refers to orientation on construction jobs WATER (LIQUID) The digester should be filled with water up to the inlet and outlet pipes level. Allow it to set for 3 to 5 hours until the walls are saturated with water and mark the water level. Set it overnight, if there is significant drop in water level leaks must be remedied. Reference “Philippine Agricultural Engineering Standards”. --- PDF PAGE 126 --- TR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020) 122 TRAINING REGULATIONS (TRs) Qualification Title: Biogas Plant Installation NCIII Qualification Code: AFFBPI320 Revision No. Document Description Types* Qualification Title New Version (TESDA Board Resolution No./ Date) Deployment Circular (TESDA Circular/ Implementing Guidelines) 00 Document Created Biogas Plant Installation NC III TB No. 2020-03 / 02/18/2020 TESDA Circular No. 072 series of 2020 Legend: *Description Types - Document Created - Document Amended --- PDF PAGE 127 --- TR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020) 123 The Technical Education and Skills Development Authority (TESDA) would like to recognize the commitment of industry stakeholders who shared their time and expertise for the development of this Training Regulations. This TR is also dedicated in memory of Engr. George Q. Canapi, a member of technical experts panel. THE TECHNICAL EXPERT PANEL (TEP) ENGR. GEORGE Q. CANAPI (+) Technical Expert Agricultural Machinery Manufacturers and Distributors Association (AMMDA), Inc. Makati City, Metro Manila ENGR. RONNIE MERCADO Technical Expert Department of Agriculture-Agricultural Training Institute Quezon City ENGR. JAIME DILIDILI Technical Expert Cavite State University Indang, Cavite ENGR. ANTHONY C. NICDAO Technical Expert Pampanga State Agricultural University Magalang, Pampanga ENGR. RODOLFO FERNANDEZ Technical Expert Bureau of Agricultural Research Qeuzon City ENGR. CAMILO POLINGA Technical Expert Cavite State University Indang, Cavite ENGR. JAYKIE HERNANDEZ Technical Expert Alterna Verde Corporation San Fernando, Pampanga ENGR. AREODEAR RICO Technical Expert Philippine Society of Agricultural Engineers Metro Manila ENGR. REYMER MARTINEZ Technical Expert Bureau of Animal Industry Quezon City (+)Deceased MS. ERLINA G. JOSECO Validator Agricultural Machinery Manufacturers and Distributors Association (AMMDA), Inc. Makati City, Metro Manila MR. RODOLFO FERNANDEZ Validator Department of Agriculture-Bureau of Agricultural Research Quezon City --- PDF PAGE 128 --- TR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020) 124 MR. CHRISTOPHER C. RAMOS Validator Agricultural Machinery Manufacturers and Distributors Association (AMMDA), Inc. Makati City, Metro Manila MR. EMMANUEL FERNAN Validator Philippine Council Agricultural and Fisheries Council Quezon City MR. CHARLIE T. BAUTISTA Validator Agri Component Corp. San Fernando, Pampanga MR. ROSSANO DODAL Validator Philippine Council Agricultural and Fisheries Council Quezon City MR. ROBERTO BAJENTING Validator The Members of the TESDA Board and Secretariat The MANAGEMENT and STAFF of the TESDA Secretariat Qualifications and Standards Office (QSO) TESDA – QSO Technical Facilitators Competency Standards Development Division MS. BERNADETTE N. SERVAZ- AUDIJE MS. CHERRY L. TORALDE MS. MELCHRIS A. ATIS Competency Programs and Standards Development Division MS. MERCEDES E. JAVIER MS. FORTUNATA L. BACO --- PDF PAGE 129 --- Training Regulation are available in both printed and electronic copies For more information please contact: TECHNICAL EDUCATION AND SKILLS DEVELOPMENT AUTHORITY (TESDA) Telephone Nos.:817-4076 to 82 loc. 163 / 164 Tele Fax No.:818-7728 or visit our website: www.tesda.gov.ph"
