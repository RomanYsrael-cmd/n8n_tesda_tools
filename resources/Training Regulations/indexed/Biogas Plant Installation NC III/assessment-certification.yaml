  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to a full\nqualification or employable unit(s) of competency in partial fulfillment of the\nrequirements of the national qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 The Full National Qualification of BIOGAS PLANT INSTALLATION\nNC III shall be acquired through the accumulation of Certificates of\nCompetency in the following units of competencies:\n\nCOC 1:\nLead Biogas Plant Site Preparation\n\nCOC 2:\nSupervise Biogas Plant Construction\n\nCOC 3:\n Lead Installation of Biogas Conveyance System\n\n4.1.2 Upon accumulation of the COCs acquired, an individual shall be\nissued the corresponding National Certificate for the Qualification.\n\n4.1.3 The\nindustry\nshall\ndetermine\nassessment\nand\ncertification\nrequirements for each qualification with promulgated Training\nRegulations. It includes the following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, and work or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment.\n\n--- PDF PAGE 120 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 116\n4.1.5 The following are qualified to apply for assessment:\n\n4.1.5.1\nGraduating students/trainees of WTR-registered programs,\ngraduates of NTR programs or graduates of formal/non-\nformal/informal including enterprise-based training programs\nrelated to BIOGAS PLANT INSTALLATION\n\n4.1.5.2\nIndustry workers in BIOGAS PLANT INSTALLATION\n\n4.1.6 Re-assessment shall focus only on the specific area/s where the\ncandidate has not satisfactorily achieved the required level of\ncompetence AND must be undertaken within two (2) years during the\nperiod of validity of the Training Regulations.\n\n4.1.7 A candidate who fails the assessment for two (2) consecutive times\nshall be advised to go through a refresher course before taking\nanother assessment.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 121 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 117\n\n4.2.4 For Trainer-Assessor\n\n• Holder of National TVET Trainer Certificate Level I (NTTC) on\nBIOGAS PLANT INSTALLATION NC III\n• Have at least 2 years relevant industry experience\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\n4.2.5 For Industry Assessor\n\n• Holder\nof\nNational\nCertificate\non\nBIOGAS\nPLANT\nINSTALLATION NC III\n• Holder of Certificate of Competency (COC) in Conduct\nCompetency Assessment under the Trainers Methodology\nLevel I (TM I)\n• Have at least two (2) years relevant industry experience\n• Have assisted in the actual conduct of assessment to at least\ntwo (2) candidates.\n\n--- PDF PAGE 122 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 118\nAnnex A\n\nCOMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR\nBIOGAS PLANT INSTALLATION NC III\n\nParticipate in workplace\ncommunication\nWork in team\nenvironment\nSolve/address general\nworkplace problems\nDevelop career and life\ndecisions\nContribute to workplace\ninnovation\nPresent relevant\ninformation\nPractice occupational safety\nand health policies and\nprocedures\nExercise efficient and\neffective sustainable\npractices in the workplace\n\nPrepare construction\nmaterials and tools\nObserve procedures,\nspecifications and\nmanuals of\ninstruction\nInterpret technical\ndrawings and\nplans\nPerform mensuration\nand calculations\nMaintain tools and\nequipment\n\nLead Biogas Plant Site\nPreparation\nSupervise Biogas\nPlant Construction\nLead Installation of\nBiogas Conveyance\nSystem\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 123 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 119\nGLOSSARY OF TERMS\n\n3 R’S\nReduce, Reuse and Recycle\n\nAIR TIGHTNESS TEST\nTest to show the gas chamber is air leak proof. This process\nhas to be done right after water tightness test. In fixed-dome\nmodel the outlet tank is filled with water until the pressure\nreach 0.4m water column while the gas valve is closed. Water\nand air pressure develops inside the digester and water level\nat the outlet tank rises and measured. Leave for 24 hours.\nAllowable decrease in level must not exceed 5 mm after 24\nhours otherwise the system is not air leak proof. (Reference:\nPhilippine Agricultural Engineering Standards).\n\nBIOGAS\nThe gas produced when organic wastes decompose in the\nabsence of oxygen. The biogas is composed of 57 to 70%\nmethane, 27 to 43% carbon-dioxide and traces of hydrogen,\ncarbon monoxide, nitrogen, hydrogen sulfide and water vapor.\nIt has a heating value of 540 to 700 BTU per cu. ft.\n\nSMALL BIOGAS\nSYSTEMS\n\nBiogas system that accommodates 10 to 50 heads swine. Up\nto 12 cu m sized digester\nMEDIUM BIOGAS\nSYSTEMS\n\nBiogas system that accommodates 51 to 100 heads swine.\nMore than 12 cu m\nLARGE BIOGAS\nSYSTEM\n\nBiogas system that accommodates more than 100 heads\nswine\nCONFIRMATION OF\nAPPROVED PROJECT\nPLANS\n\nrefers to the confirmation of project details\nDIGESTER\nThe part of the biogas system where the slurry of organic\nwaste is retained to digest or be converted into biogas. Most\nof the time, the digester also contains the biogas chamber.\n\nHYDRAULIC\nRETENTION TIME\nThe number of days that organic waste slurry is supposed to\nremain inside the digester or in an anaerobic condition. The\nday the slurry enters the digester until the day it comes out.\nRecommended time is 35 days - This is the ideal time where\nmethanogenic bacteria produce the most biogas. After HRT,\nthe rate of biogas production decreases.\n\nINFLUENT\nThe mixture of liquid and organic waste which is fed into the\ndigester\n\n--- PDF PAGE 124 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 120\nINOCULANT OR\nSTARTER MIX\nA substrate with high concentration of active methanogenic\nbacteria used to hasten anaerobic digestion of organic waste;\nthe best source is the digested slurry of an active biogas\nplant.\n\nAPPROVED\nMETHODOLOGIES\n\nrefers to documented remedial actions, troubleshooting guide\n\nLEGAL REQUIREMENT\nIN CLEARING\n\nLaws and regulations in removing/uprooting trees.\nMETHANE\nA compound of carbon and hydrogen (CH4). It is a colorless,\nodorless and flammable gas. It is the main components of\nnatural gas, coal gas and biogas.\n\nMETHANOGENIC\nBACTERIA OR\nMETHANOGENS\nBacteria that converts organic materials into biogas under\nanaerobic condition. These bacteria produce more biogas in\nhigher temperature. Countries near the equator.\n\nOSHS\nAcronym for “Occupational Safety and Health Standards”\n\nPAES\nAcronym for “Philippine Agricultural Engineering Standards”.\n\nPARAFFIN WAX\nWax used in making candle. In biogas, paraffin wax is used to\nseal minor leaks inside the digester\n\nPERT CPM\nAcronym for “Program Evaluation and Review Technique –\nCritical Path Method” – tool used to assist the project\nmanager in scheduling the activities (i.e., when should each\nactivity start). It includes flow of materials, labor and\nequipment. It assumes that activity durations are known with\ncertainty.\n\nPPE\nAcronym for “Personal Protective Equipment”\n\nQUALITY CONTROL\nOverall assurance of quality of work. Mostly used in ensuring\nwater proofing and air proofing of the digester chamber and\nperipherals. This includes piping works and appliance.\n\nSCUM\nThe entrained solids caught up by the gas bubbles rising to\nthe water surface. Cumulative formation of scum inhibits\nbiogas production and to extreme extent scum may block the\ndigester gas outlet pipe\n\nSEDIMENT\nSolid particles that separates from the slurry and sinks to the\nbottom of the digester i.e. stones, sand, soil, etc.\n\n--- PDF PAGE 125 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 121\nSLURRY\nMixture of manure and water usually coming from livestock\npens.\n\nROUTINARY\nMAINTENANCE\nExpected maintenance activities of a completed biogas\nsystem. i.e. a) formation of water vapor on gas conveyance\npipes, b) removal of scum and sediments inside the digester\n\nTOOLBOX MEETING\n\nrefers to orientation on construction jobs\nWATER (LIQUID)\nTIGHTNESS TEST\nThe digester should be filled with water up to the inlet and\noutlet pipes level. Allow it to set for 3 to 5 hours until the walls\nare saturated with water and mark the water level. Set it\novernight, if there is significant drop in water level leaks must\nbe remedied. Reference “Philippine Agricultural Engineering\nStandards”.\n\n--- PDF PAGE 126 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 122\n\nTRAINING REGULATIONS (TRs)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBiogas Plant Installation NCIII\nQualification Code:\nAFFBPI320\n\nRevision\nNo.\nDocument\nDescription Types*\nQualification Title\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nBiogas Plant Installation NC III\nTB No. 2020-03 /\n 02/18/2020\nTESDA Circular No.\n072 series of 2020\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 127 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 123\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) would like\nto recognize the commitment of industry stakeholders who shared their time and\nexpertise for the development of this Training Regulations. This TR is also dedicated in\nmemory of Engr. George Q. Canapi, a member of technical experts panel.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nENGR. GEORGE Q. CANAPI (+)\nTechnical Expert\nAgricultural Machinery Manufacturers and\nDistributors Association (AMMDA), Inc.\nMakati City, Metro Manila\n\nENGR. RONNIE MERCADO\nTechnical Expert\nDepartment of Agriculture-Agricultural\nTraining Institute\nQuezon City\nENGR. JAIME DILIDILI\nTechnical Expert\nCavite State University\nIndang, Cavite\n\nENGR. ANTHONY C. NICDAO\nTechnical Expert\nPampanga State Agricultural University\nMagalang, Pampanga\n\nENGR. RODOLFO FERNANDEZ\nTechnical Expert\nBureau of Agricultural Research\nQeuzon City\n\nENGR. CAMILO POLINGA\nTechnical Expert\nCavite State University\nIndang, Cavite\n\nENGR. JAYKIE HERNANDEZ\nTechnical Expert\nAlterna Verde Corporation\nSan Fernando, Pampanga\n\nENGR. AREODEAR RICO\nTechnical Expert\nPhilippine Society of Agricultural Engineers\nMetro Manila\nENGR. REYMER MARTINEZ\nTechnical Expert\nBureau of Animal Industry\nQuezon City\n\n(+)Deceased\n\nTHE PARTICIPANTS OF NATIONAL VALIDATION\n\nMS. ERLINA G. JOSECO\nValidator\nAgricultural Machinery Manufacturers and\nDistributors Association (AMMDA), Inc.\nMakati City, Metro Manila\n\nMR. RODOLFO FERNANDEZ\nValidator\nDepartment of Agriculture-Bureau of\nAgricultural Research\nQuezon City\n\n--- PDF PAGE 128 ---\nTR-Biogas Plant Installation NC III Revision 00 Promulgated (2/18/2020)\n 124\nMR. CHRISTOPHER C. RAMOS\nValidator\nAgricultural Machinery Manufacturers and\nDistributors Association (AMMDA), Inc.\nMakati City, Metro Manila\n\nMR. EMMANUEL FERNAN\nValidator\nPhilippine Council Agricultural and\nFisheries Council\nQuezon City\n\nMR. CHARLIE T. BAUTISTA\nValidator\nAgri Component Corp.\nSan Fernando, Pampanga\n\nMR. ROSSANO DODAL\nValidator\nPhilippine Council Agricultural and\nFisheries Council\nQuezon City\n\nMR. ROBERTO BAJENTING\nValidator\nCCFS\n\nThe Members of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\nQualifications and Standards Office (QSO)\n\nTESDA – QSO Technical Facilitators\n\nCompetency Standards Development Division\n\nMS. BERNADETTE N. SERVAZ- AUDIJE\nMS. CHERRY L. TORALDE\nMS. MELCHRIS A. ATIS\n\nCompetency Programs and Standards Development Division\n\nMS. MERCEDES E. JAVIER\nMS. FORTUNATA L. BACO\n\n--- PDF PAGE 1