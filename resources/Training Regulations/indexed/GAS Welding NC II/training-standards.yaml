    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for GAS WELDING.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: GAS WELDING\n\nNC Level II\n\n Suggested Nominal Training Hours: 18 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 238 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof trainees in Gas Welding in accordance with industry standards. It covers core\ncompetencies such as Setting-up Welding Equipment, Preparing Weld Materials,\nFitting up Weld Materials, Performing Gas Welding in Alloy Steel Plates and\nPipes and Repairing Welds.\n\nBASIC COMPETENCIES\n\n1. Participate in\nworkplace\ncommunicati\non\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice\ncareer\nprofessionali\nsm\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n\n4.2 Control hazards and risks\n\n4.3 Maintain occupational health\n and safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 50 ---\nWeldncii11-3\n\n48\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nwork safely\n1.1 Identify hazardous areas and\nconditions\n1.2 Use protective clothing and\ndevices\n1.3 Perform safe handling of\ntools, equipment and\nmaterials\n1.4 Explain/perform first aid\nprocedure\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\nquestioning\n• Written\n• Demonstration\n2. Contribute to\nquality\nsystem\n2.1 Inspect work done\n2.2 Apply quality standards to\nwork\n2.3 Protect company/ institution\nproperties\n2.4 Protect customer interest\n• Lecturette\n• Practical\n application\n\n• Oral\nquestioning\n• Written\n• Demonstration\n3. Use hand\ntools\n3.1 Use different handtools\n3.2 Maintain handtools\n• Lecturette\n• Practical\n application\n\n• Oral\nquestioning\n• Written\n•Demonstration\n4. Interpret\nBlueprints\n4.1 Interpret technical drawing.\n4.2 Interpret welding symbols\n\n• Lecturette\n• Practical\n application\n• Oral\nquestioning\n• Written test\n5. Perform\nindustry\ncalculations\n5.1 Solve mathematical problems\n5.2 Convert systems of\nmeasurement\n5.3 Measure workpiece\n• Lecturette\n• Practical\n application\n\n• Oral\nquestioning\n\n• Written test\n6. Prepare\nWeld\nMaterials\n6.1 Identify the different cutting\nequipment and accessories\n6.2 Identify types of mild steel\nelectrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective equipment\n6.5 Prepare welding\nconsumables, tools and\naccessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nWeldncii11-3\n\n49\n7. Set-up\nWelding\nEquipment\n7.1 Explain welding principles\nand concepts.\n7.2 Identify the parts of welding\nmachine\n7.3 Set up welding machine and\naccessories\n7.4 Set up welding positioners,\njigs and fixtures\n7.5 Set up pre-heating equipment\n(as required)\n• Lecturette\n• Demonstratio\nn\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\nbacking plate and stiffener.\n8.2 Explain the methods of\nstriking an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen, backing\nplate and stiffener.\n• Lecturette\n• Demonstratio\nn\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9. Repair\n Welds\n9.1 Identify causes and\nprevention of the different\nweld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and equipment\n9.4 Remove defects\n9.5 Perform re-welding\n\n• Lecturette\n• Demonstratio\nn\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nGas\nwelding in\nAlloy\nPlates and\nTubes\n1.1 Perform gas welding in\nalloy steel plates and\ntubes in all positions.\n\nLecturette\nDemonstration\n\n• Observation\nand oral\nquestioning\n• Demonstratio\nn and oral\nquestioning\n• Written test\n\n--- PDF PAGE 52 ---\nWeldncii11-3\n\n50\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-\nbased TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\n The competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 53 ---\nWeldncii11-3\n\n51\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• completed training in GAS NC I or a holder of GAS NC I\n• can communicate either oral and written\n• physically and mentally fit\n• can perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nGAS WELDING II\n\nRecommended list of tools and materials per trainee for GAS WELDING - NC II\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12 units\nGAS\nWelding/cutting\noutfit *\n5 kgs\nFiller (alloy)\nrod 1.6/2.4\nmm dia.\n75 pcs.\nSteel brush\n12 pcs.\nWelding\npositioners\n12 pcs.\n(equiv to\n20 jts)\nMild steel\nsheet\n3.2mm X\n150mm x\n200mm\n12 pcs.\nPlier/tongs\n12 units\nPortable disc\ngrinder\n12 pcs.\n(equiv to\n20 jts)\nMild steel\nsheet\n2.4mm X\n150mm X\n200mm\n20 pcs.\nFiles-bastard\ncut\n1 unit\nExhaust fan\n22 pcs.\n(equiv to\n45 jts)\nCarbon\nsteel pipe,\nschedule 40\n75 mm dia.\nX 150mm\n5 pcs.\nWelding\ngoggles\n(swivel)\n2 units\nWork bench w/\nbench vice on 4\ncorners\n3 pcs.\nDark glass\n25 sets\nLeather\napron/jacket\n1 unit\nIndustrial fan\n46 pcs.\nLens clear\nglass\n5 pcs.\nSafety\ngoggles,\nwide vision,\nclear\n1 cyl.\nLPG / acetylene 38 pcs\nCut off disc\n3/32” x 5/8\"\nx4\" dia.\n\n--- PDF PAGE 54 ---\nWeldncii11-3\n\n52\n5 pcs.\nOxy-\nacetylene\ngoggles\n1 cyl.\nOxygen\n1 tube\nMetal\nmarker\n12 pcs.\nTry square\n300 mm.\nlong\n\n12 pcs.\nSteel square\n300 mm.\nlong\n\n1 pc.\nFiles-half\nround\n\n1 pc.\nFillet gauge\n\n1 pc.\nWire Cutter\n\n1 pc.\nHand\nHacksaw\n\nNote: Tools and equipment for all welding process.\n* for GAS WELDING process\n\n--- PDF PAGE 55 ---\nWeldncii11-3\n\n53\n3.5 TRAINING FACILITIES\n\nGAS WELDING - NC II\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area*\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 56 ---\nWeldncii11-3\n\n54\n3.6 TRAINERS QUALIFICATIONS FOR GAS WELDING II\n\nTRAINER QUALIFICATION (TQ II)\n\n•\nMust be a holder of GAS WELDING II\n•\nMust have undergone training on Training Methodology II (TM II)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine their\nachievement of units of competency. A certificate is issued for each unit of\ncompetency.\n\n--- PDF PAGE 57 ---\nWeldncii11-3\n\n55"
