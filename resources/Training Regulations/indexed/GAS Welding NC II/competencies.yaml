        "source_title": "FIT UP WELD MATERIALS",
        "source_text": "--- PDF PAGE 39 ---\nWeldncii11-3 \n  \n37\nUNIT TITLE  \n:    FIT UP WELD MATERIALS  \n \nUNIT CODE  \n:    MEE721208  \n \nDESCRIPTOR \n:    This unit covers the skills, knowledge and attitudes in fitting \n      up welding materials.  \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform tack welding \n \n1.1  Tack welding is performed in accordance with the \nrequirements of WPS and client’s specifications.  \n1.2   Tack welding is performed  visually and dimensionally \n        acceptable.  \n1.3 Backing plate, stiffener, running plate installed as    \nrequired. \n1.4 Joints are free from rust, paints, grease and other \n       foreign materials prior to fit up or tacking. \n \n2. Check gap and \n      alignment  \n2.1  Root gap is performed in accordance with the \nrequirements of WPS.  \n2.2  Alignment within the range of acceptability of code and \nstandard.  \n2.3  Fitted materials visually free from stresses \n3. Set up welding \n      positioner  \n3.1  Weld specimen positioned and secured according to the  \nrequirements.\n\n--- PDF PAGE 40 ---\nWeldncii11-3 \n  \n38\n \nRANGE OF VARIABLE \nVARIABLE \nRANGE \n1. Tack welding \n \nKinds of tacking \n1.1    Bridge tacking \n1.2    Permanent tacking \n1.3    Temporary tacking  \n2. Visually and  \n      dimensionally    \n      acceptable \n2.1    Acceptable tack welds \n2.2   Fully fused to the base metal  \n2.3   Free from defects and discontinuities  \n2.4   Evenly distributed  \n3.  Root gap \n3.1   WPS requirements  \n3.2   Client requirements  \n4.  Backing materials \n4.1    Stiffeners  \n4.2    Backing plate \n4.3    Strong back  \n5.  Alignment  \n5.1    Codes and specifications \n5.2    Client requirements\n\n--- PDF PAGE 41 ---\nWeldncii11-3 \n  \n39\nEVIDENCE GUIDE \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate  \n1.1 performed tack welding \n1.2 checked gap and alignment \n1.3 set up welding positioners \n2.  Underpinning knowledge \n2.1  Fit up tolerances  \n2.2  Mensuration \n2.3  WPS  \n2.4  Welding materials and consumables \n2.5  Drawing and plan interpretation \n2.6  Welding codes (symbols) \n2.7  Identification of weld defects  \n2.8  Fit up \n3.  Underpinning skills \n3.1  Applying weld techniques  \n3.2  Handling welding materials and consumables \n3.3  Rectifying weld defects \n3.4  Measuring skills  \n3.5  Communication skills \n3.6  Pre-heating technique \n3.7  Observance of safety procedures \n4.  Resource implications \nThe following resources must be provided: \n4.1  Drawing and plans \n4.2  Appropriately ventilated work area/shop with \nwelding facilities, machines and accessories   \n4.3  PPE \n5.  Method of assessment \nCompetency must be assessed through: \n5.1  Observation/evaluation \n5.2  Oral questioning \n6.  Context of assessment \nCompetency to be assessed while a task is being \nundertaken in the workplace or in a simulated \nworkplace setting.\n",
