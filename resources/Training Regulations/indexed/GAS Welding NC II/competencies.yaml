        "source_text": "--- PDF PAGE 21 ---\nWeldncii11-3 \n  \n19\nUNIT OF COMPETENCY :   INTERPRET DRAWINGS AND SKETCHES \n \nUNIT CODE  \n \n:   MEE721202 \n \nUNIT DESCRIPTOR \n :   This unit covers the competencies required to read and \n     interpret drawings and sketches. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nIdentify standard \nalphabet of lines \n1.1 \n1.2 \nAlphabet of lines are identified \nUses of the alphabet of lines are explained \n2. \nIdentify orthographic/ \nisometric views \n2.1 \n2.2 \nOrthographic and isometric drawing are identified \nOrthographic and isometric views are explained \n3. \nInterpret standard \ndrawing symbols, \ndimensional tolerances \nand notations \n3.1 \n \n3.2 \n \nDrawing symbols are interpreted according to \ndrawing standards \nDimensional tolerances, notations are interpreted \naccording to specifications\n\n--- PDF PAGE 22 ---\nWeldncii11-3 \n  \n20\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.   Drawing \nDrawing technique include \n1.1 Perspective \n1.2 Exploded view \n1.3 Hidden view technique \n \nProjections \n1.4 First angle projections \n1.5 Third angle projections \n2.   Tolerance \n2.1 General tolerance \n2.2 Angular tolerance \n2.3 Geometric tolerance\n\n--- PDF PAGE 23 ---\nWeldncii11-3 \n  \n21\nEVIDENCE GUIDE \n1. \nCritical aspects \nof competency \nAssessment requires evidence that the candidate interpreted \ntechnical drawings and sketches. \n2. \nUnderpinning \nknowledge    \n2.1 Alphabet of lines \n2.2 Projections \n2.3 Drawing symbols \n2.4 Dimensioning techniques \n2.5 Tolerances \n3. \nUnderpinning \nskills \n3.1  Communication skills (reading and comprehension)  \n3.2  Computation skills  \n  \n4. \nResource \nimplications \nThe following resources must be provided \n4.1  Working drawing or plans or sketches \n4.2  Measuring tools \n4.3  Drawings, sketches or blueprint \n4.4  Specimen parts/components \n5. \nMethod of \nassessment \nCompetency must be assessed through: \n5.1  direct observation  \n5.2  written or oral short answer questions \n5.3  demonstration \n5.4  project/work sample \n5.5  portfolio \n6. \nContext for \nassessment \n  Competency may be assessed in the workplace or in \n       simulated workplace environment.\n",
