        "source_text": "--- PDF PAGE 13 ---\nWeldncii11-3 \n  \n11\nUNIT OF COMPETENCY :       PRACTICE OCCUPATIONAL HEALTH AND \nSAFETY   PROCEDURES  \nUNIT CODE                      :       500311108 \n \nUNIT DESCRIPTOR        :    \nThis unit covers the outcomes required to comply with \nregulatory and organizational requirements for \noccupational health and safety.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify hazards and \nrisks \n1.1 Safety regulations and workplace safety and \nhazard control practices and procedures are \nclarified and explained based on organization \nprocedures \n1.2 Hazards/risks in the workplace and their \ncorresponding indicators are identified to minimize \nor eliminate risk to co-workers, workplace and \nenvironment in accordance with organization \nprocedures \n1.3 Contingency measures during workplace \naccidents, fire and other emergencies are \nrecognized and established in accordance with \norganization procedures \n2. Evaluate hazards and \nrisks \n2.1 Terms of maximum tolerable limits which when \nexceeded will result in harm or damage are \nidentified based on threshold limit values (TLV) \n2.2 Effects of the hazards are determined \n2.3  OHS issues and/or concerns and identified safety \nhazards are reported to designated personnel in \naccordance with workplace requirements and \nrelevant workplace OHS legislation\n\n--- PDF PAGE 14 ---\nWeldncii11-3 \n  \n12\n \n \n           \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n3. Control hazards and \nrisks  \n3.1 Occupational Health and Safety (OHS) procedures for \ncontrolling hazards/risks in workplace are consistently \nfollowed \n3.2 Procedures for dealing with workplace accidents, fire and \nemergencies are followed in accordance with \norganization OHS policies \n3.3 Personal protective equipment (PPE) is correctly used \nin accordance with organization OHS procedures and \npractices  \n3.4 Appropriate assistance is provided in the event of a \nworkplace emergency in accordance with established \norganization protocol \n \n4. Maintain OHS \nawareness \n \n4.1 Emergency-related drills and trainings are \nparticipated in as per established organization guidelines \nand procedures \n4.2 OHS personal records are completed and updated in \naccordance with workplace requirements\n\n--- PDF PAGE 15 ---\nWeldncii11-3 \n  \n13\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nSafety regulations \nMay include but are not limited to: \n1.1 Clean Air Act \n1.2 Building code \n1.3 National Electrical and Fire Safety Codes \n1.4 Waste management statutes and rules \n1.5 Philippine Occupational Safety and Health Standards \n1.6 DOLE regulations on safety legal requirements \n1.7 ECC regulations \n \n2. \nHazards/Risks \nMay include but are not limited to: \n2.1 Physical hazards – impact, illumination, pressure, noise, \n                                      vibration, temperature, radiation  \n2.2 Biological hazards- bacteria, viruses, plants, parasites, \n                                      mites, molds, fungi, insects \n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, \n                                       gasses, vapors \n2.4 Ergonomics \n Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n Physiological factors – monotony, personal \nrelationship, work out cycle\n\n--- PDF PAGE 16 ---\nWeldncii11-3 \n  \n14\nVARIABLE \nRANGE \n3. \nContingency \nmeasures \nMay include but are not limited to: \n3.1 Evacuation \n3.2 Isolation \n3.3 Decontamination \n3.4 (Calling designed) emergency personnel \n4. \nPPE \nMay include but are not limited to: \n4.1 Mask \n4.2 Gloves \n4.3 Goggles \n4.4 Hair Net/cap/bonnet \n4.5 Face mask/shield \n4.6 Ear muffs \n4.7 Apron/Gown/coverall/jump suit \n4.8 Anti-static suits \n \n5. \nEmergency-\nrelated drills and \ntraining \n \n5.1 Fire drill \n5.2 Earthquake drill  \n5.3 Basic life support/CPR \n5.4 First aid \n5.5 Spillage control  \n5.6 Decontamination of chemical and toxic \n5.7 Disaster preparedness/management \n \n6. \nOHS personal \nrecords \n \n6.1  Medical/Health records \n6.2  Incident reports \n6.3  Accident reports \n6.4  OHS-related training completed\n\n--- PDF PAGE 17 ---\nWeldncii11-3 \n  \n15\n     EVIDENCE GUIDE \n1.     Critical Aspects of \n        Competency \nAssessment requires evidence that the candidate: \n1.1 \nExplained clearly established workplace safety and \nhazard control practices and procedures \n1.2 \nIdentified hazards/risks in the workplace and its \ncorresponding indicators in accordance with  \ncompany  procedures \n1.3 \nRecognized contingency measures during workplace \naccidents, fire and other emergencies \n1.4 \nIdentified terms of maximum tolerable limits based on \nthreshold limit value- TLV. \n1.5 \nFollowed Occupational Health and Safety (OHS) \nprocedures for controlling hazards/risks in workplace \n1.6 \nUsed Personal Protective Equipment (PPE) in \naccordance with company OHS procedures and \npractices  \n1.7 \nCompleted and updated OHS personal records in \naccordance with workplace requirements   \n2. \nUnderpinning \n        Knowledge and  \n        Attitude \n2.1.1   OHS procedures and practices and regulations \n2.1.2 PPE types and uses \n2.1.3 Personal hygiene practices \n2.1.4 Hazards/risks identification and control \n2.1.5 Threshold Limit Value -TLV \n2.1.6 OHS indicators  \n2.1.7 Organization safety and health protocol \n2.1.8 Safety consciousness \n2.1.9 Health consciousness \n3.     Underpinning  \n        Skills \n3.1 \n Practice of personal hygiene  \n3.2       Hazards/risks identification and control skills \n3.3       Interpersonal skills \n3.4       Communication skills\n3 \nResource   \nImplications \nThe following resources must be provided: \n4.1 \nWorkplace or assessment location \n4.2 \nOHS personal records \n4.3      PPE \n4.4      Health records \n4 \nMethods of \nAssessment \nCompetency may be assessed through: \n5.1       Portfolio Assessment  \n5.2       Interview \n5.3      Case Study/Situation\n5 \nContext for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n",
