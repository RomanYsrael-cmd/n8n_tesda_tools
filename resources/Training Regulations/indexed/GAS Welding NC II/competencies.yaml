        "source_text": "--- PDF PAGE 27 ---\nWeldncii11-3 \n  \n25\nUNIT OF COMPETENCY :   CONTRIBUTE TO QUALITY SYSTEM  \n \nUNIT CODE  \n \n:   MEE721204 \n \nUNIT DESCRIPTOR \n \n:   This unit involves competence required to inspect work \n    against specification and standards and apply quality \n    standards to work. \n \n \n    ELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nInspect work done  \n1.1 \n \n \n1.2 \n \n1.3 \nAppropriate inspections are conducted to ensure \ncompany quality systems and procedures are \nmaintained/ followed. \nJob specifications/work order and quality \nstandards are identified. \nFaults/Defects are identified and rectified \naccording to company procedures.   \n2. \nApply quality standards \nto work \n2.1 \n \n \n2.2 \n \n2.3 \n \n2.4 \nInspections are conducted throughout the \nmanufacturing processes to ensure quality \nstandards are maintained. \nAppropriate quality standards are applied \nthroughout the production/fabrication process. \nAll activities are coordinated throughout the \nworkplace to ensure efficient quality work \noutcomes. \nRecords of work quality are maintained according \nto the company requirements. \n3 \nProtect company \nproperty and customer \ninterests \n3.1 \n \n3.2 \nPossible damage to company property is \navoided by adherence to company quality \nprocedures. \nQuality of work is reviewed to ensure customer \nrequirements and company standards are met.\n\n--- PDF PAGE 28 ---\nWeldncii11-3 \n  \n26\nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1.   Quality system and \n      procedures \nQuality system and procedures may be contained in: \n1.1 work instructions \n1.2 safe work procedures \n1.3 product specifications \n1.4 equipment maintenance schedules \n1.5 technical procedures adopted or specifically \nprepared standards \n1.6 company/industry rules \n \n2.   Company property \nCompany properties includes : \n2.1 production and/or fabrication equipment \n2.2 hand and power tools \n2.3 OH&S paraphernalia \n2.4 facilities\n\n--- PDF PAGE 29 ---\nWeldncii11-3 \n  \n27\nEVIDENCE GUIDE \n1. \nCritical aspects \nof competency  \nAssessment requires evidence that the candidate:   \n1.1   inspected work done against specification \n1.2   applied quality standards to work \n1.3   protected company property and customer interests \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1    Communication/feedback methods-written and verbal \n2.2    Company systems, processes and work quality \n        requirements \n2.3    Work inspection techniques \n2.4    Quality assurance principles \n2.5    Safety precautionary measures \n2.6    Handling materials, tools and equipment  \n3. \nUnderpinning \nskills \n3.1   Problem solving skills \n3.2   Communicating with superiors and co-workers \n3.3    Interpreting job specification and work order \n4. \nResource \nimplications \nThe following resources must be provided \n4.1   Tools, equipment and facilities appropriate to processes or \n        activity \n4.2   Materials relevant to the proposed activity \n5. \nMethod of \nassessment \nCompetency must be assessed through: \n5.1   Demonstration \n5.2   Written or oral short answer questions \n5.3   Practical exercises \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
