        "source_title": "Perform gas welding in alloy steel plates and tubes",
        "source_text": "--- PDF PAGE 45 ---\nWeldncii11-3 \n  \n43\n \nCORE COMPETENCIES \n \n \n \nUNIT OF COMPETENCY: \nPerform gas welding in alloy steel plates and \ntubes  \n \nUNIT CODE: \nMEE721307 \n \nDESCRIPTOR: \nThis unit covers the skills, knowledge and attitudes required in \ngas welding alloy steel and pure copper plates and tubes. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform surface \npreparation  \n1.1 Surface preparation is performed in accordance with \nacceptable cleaning procedure and standards \n2. Set up gas welding \noutfit/equipment and \naccessories \n2.1 Gas welding outfit/equipment and accessories are \ninstalled in accordance with OH&S rules \n2.2  PPE is used and is appropriate for the activity \n2.3 Tanks or cylinders is secured in a proper place \n \n3. Perform gas welding \n3.1 Weld pass is performed in accordance with WPS and/or \nclient’s specifications. \n3.2 Weld is visually checked for defects and repaired, as \nrequired \n3.3  Weld is visually acceptable in accordance with \n     applicable codes and standards\n4. Clean weld pass \n4.1 Weld pass is cleaned and free from defects and \n      discontinuities \n4.2 Task is performed in accordance with company or \n       industry requirements and safety procedure\n\n--- PDF PAGE 46 ---\nWeldncii11-3 \n  \n44\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.  Cleaning procedure \n1.1  Mechanical (grinding, brushing, etc.) \n1.2  Chemical (solvent, thinners, acids, etc.) \n1.3  Manual (hand filing, sanding, chipping, etc.) \n2.  Standards \n2.1 Client standards and applicable codes \n3.  Gas welding outfit/ \nequipment and \naccessories \n3.1  gas welding outfit (hoses, regulators/flow meters, \nlighter and cylinder gas tanks, flash back arrestor) \n3.2  heating torches \n3.3  welding tips as required size \n3.4  wrenches and chipping hammer \n3.5  portable grinder \n3.6  steel brush \n3.7 filler wire/consumable insert \n3.8  PPE (goggles, lenses, mask, apron, gloves, etc.)  \n4.  Tanks or cylinders \n4.1 oxygen/acetylene \n4.2 liquefied petroleum gas \n4.3 liquefied natural gas \n5. WPS \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n5.1   welding position \n5.1.1 flat, horizontal, vertical and overhead \n5.2  Material type \n5.2.1 pure copper \n5.2.2 copper nickel \n5.2.3 stainless steel \n5.2.4 silver-based material \n5.3  Type and size of consumables \n5.3.1 pure copper filler wire (diameter 0.8 – 2.4mm) \n5.3.2 copper nickel filler wire (diameter 0.8 – 2.4mm) \n5.3.3 stainless filler wire (diameter 0.8 – 2.4 mm) \n5.3.4 silver-based filler wire (0.8 – 2.4mm) \n5.3.5 brazing fluxes \n5.4  Type of pre-heating \n5.4.1 blow torch \n5.5  Type of gas \n5.5.1  Oxygen/acetylene \n5.5.2 Liquefied petroleum gas  \n5.5.3 Liquefied natural gas \n5.6  Flow rate as recommended \n 5.7  Type of insert \n5.7.1   metallic\n\n--- PDF PAGE 47 ---\nWeldncii11-3 \n  \n45\n \n6. Defects \n 6.1  porosity \n 6.2  undercut \n 6.3  concavity/convexity \n 6.4  degree of reinforcement  \n 6.5  burn through \n 6.6  crater cracks \n 6.7  cracks \n 6.8  lack of fusion \n 6.9  overlap \n6.10  pinholes/blowholes \n6.11  underfill \n6.12  misalignment \n6.13  distortion\n\n--- PDF PAGE 48 ---\nWeldncii11-3 \n  \n46\nEVIDENCE GUIDE \n1.  Critical Aspects of \n     Competency \nAssessment requires evidence that the candidate \nperformed gas welding of alloy and copper plates \nand tubes to acceptable standard following the \napproved WPS. \n2.  Underpinning Knowledge \n2.1  Drawing/Plan/WPS interpretation \n2.2  Materials and consumables (filler wire, oxy- \n      acetylene and LPG, base metal, etc.) \n2.3  Gas Welding Outfit/Equipment and Tools \n2.4  Basic Mathematics (MDAS) \n2.5  Mensuration \n2.6  Welding Codes (symbols) \n2.7  Identification of weld defects \n2.8  Gas welding outfit/equipment and accessories  \n      maintenance  \n2.9  OH&S requirements  \n3.  Underpinning Skills \n3.1  Measuring skills \n3.2  Communication skills \n3.3  Rectifying weld defects \n3.4  Applying weld techniques \n3.5  Handling gas welding outfit/equipment  \n      and tools  \n3.6  Handling gas welding materials and  \n      consumables \n4.  Resource Implications \nThe following resources must be provided: \n4.1  Gas welding outfit/equipment and  \n      facilities  \n4.2  Supplies and materials \n4.3  PPE \n4.4  Relevant documentation such as WPS and  \n      working drawing \n4.5  Stand-by fire fighting equipment \n5.  Method of Assessment \nCompetency must be assessed through: \n5.1  Observation and interview \n5.2  Demonstration and interview \n5.3  Written test \n5.4  Portfolio (awards, certification, commendation,  \nendorsement, etc.)  \n6.  Context of Assessment \nCompetency to be assessed while a task is being \nundertaken in the workplace or in a simulated \nworkplace setting.\n",
