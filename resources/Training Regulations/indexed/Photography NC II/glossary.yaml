      "term": "The size of the aperture is expressed as an '",
      "definition": "number, like '/8 or '/11. • ARTIFICIAL LIGHT - Illumination that comes from a man-made source, such as electronic flash. • AUTOEXPOSURE - Shutter speed and aperture are set automatically by the camera based on its interpretation of the camera's exposure meter readings. Some high-end cameras employ highly-sophisticated, computerized autoexposure systems that seem to be almost foolproof, whereas most consumer cameras' autoexposure systems work best in average lighting situations. • AUTOFOCUS - Ability of a lens to focus automatically on an object within its focusing sensors. • BALANCE - Compositional harmony of a scene based on the placement of elements of different sizes, shapes and colors. • BUILT-IN LIGHT METER - A reflective exposure meter that is a built-in component of a camera. • CABLE RELEASE - A flexible cable with a push-button on one end that, when depressed, forces a wire through the cable to depress a camera’s shutter release button. The cable release attaches to the camera directly over the shutter release button. A cable release has minimal effect on camera movement, and is therefore especially handy for the photographer who wishes to avoid blur in time exposures. • CHARGE-COUPLED DEVICE - Also known as a CCD, it is the light-sensitive device in many digital cameras (and scanners) that captures the image - i.e converts light entering the camera into digital data that can be recorded as a picture. • CLOSE-UP - Generally, a picture of a subject that fills the frame, usually with the subject looking particularly close to the camera. • COLOR BALANCE - (1) The manner in which color film reproduces a scene's colors under different types of lighting (daylight or tungsten). (2) The adjustment of colors in making color prints. • COMPOSITION - The arrangement of the elements (subject and other objects) in a scene or photograph. • CONTRAST - (1) the range of difference between highlights and shadow areas in an image. Many factors affect an image’s contrast, including the degree of development and the contrast grade of the paper on which an image is printed. (2) The range of brightness in a scene or in the light striking a subject. (Sometimes contrast is also referred to as \"Density.\") • DENSITY - The relative opacity (blackness) of an area of a negative, a transparency or a print. The greater the density, the less light can be transmitted through it. (Sometimes density is also referred to as \"Contrast.\") • DEPTH OF FIELD - The range of distance in a scene that appears to be in focus and will be reproduced as being acceptably sharp in an image. Depth of field is controlled by the lens aperture, and extends for a distance in front of and behind the point on which the lens is focused. • DEPTH OF FOCUS - A zone of focus in the camera. If an image is focused on a ground glass screen in a camera, depth of focus makes it possible to move the screen slightly backward or forward and still have the image in acceptable focus. • DIFFUSED LIGHT or DIFFUSE LIGHTING - Light that is scattered and spread out as opposed to specular light. Diffused light is softer than direct light, with shadows that are less sharply-defined (lower contrast). • DIGITAL CAMERA - A camera that takes pictures without film, but instead records the image on an image sensor chip in a format that is readable by a computer. • DIGITAL ZOOM - Zoom effect in some digital cameras that is not true (optical) zoom, but is instead an enlargement of the information from the center of the CCD or CMOS (image sensor). • ELECTRONIC FLASH - Artificial light source produced by an electrical discharge traveling between two electrodes through a gas-filled tube. The light from electronic flash is approximately the same color as daylight. • ELEMENT - A single lens that is a component of a compound lens. • EXPOSURE - (1) Exposure occurs when light is permitted to strike film - i.e. when the film is exposed to light. (2) Exposure is the total amount of light striking the film or other photographic material. (3) Also refers to a combination of shutter speed and aperture used in exposing the film in a camera, as in “My light meter shows an exposure of 1/125 second at ƒ/11.” A particular aperture and shutter speed combinations are often referred to as “exposure settings.” “Proper exposure” refers to exposure that produces an image satisfactory to the photographer. • EXPOSURE METER - An instrument containing a light-sensitive cell used to measure the amount of light reflected from or falling on a subject. The measurement is usually expressed in shutter speed and aperture combinations that will render an acceptable exposure. (Also known as a light meter.) • EXPOSURE SETTING - The aperture and shutter speed combination used to expose the film in a camera. • f-NUMBER - (ƒ-number) A number that expresses a lens’ light-transmitting ability - i.e. the size of the lens opening. Usually found on the barrel of a lens, f-numbers indicate the size of the aperture in relation to the focal length of the lens. A smaller number indicates a larger lens diameter. ƒ/1.4 signifies that the focal length of the lens is 1.4 times as great as the diameter. All lenses set at the same f-number transmit the same amount of light. • ƒ-stop - (f-stop) A lens aperture setting calibrated to an f-number. • FIELD CAMERA - A type of camera known as the\"field\" or \"baseboard\" camera is essentially a portable view camera, because it functions in much the same way and with similar controls and features. • FILTER - Tinted glass, gelatin or plastic discs, squares or rectangles that modify the light passing through them. Filters are used in photography to change the appearance of a scene by emphasizing, eliminating or changing color or density, generally so that the scene can be recorded with a more natural look, on a particular film. • FISHEYE - Describes an extreme wide-angle lens that has an angle of view exceeding 100° - sometimes more than 180° - and that renders a scene as highly distorted. • FIXED FOCAL LENGTH - Descriptive of the lens in a camera that has one lens only that cannot be interchanged for another lens and that cannot be zoomed. • FLASH - (1) A brief, sudden burst of bright light from a flashbulb or an electronic flash unit; (2) An artificial light source that provides brief, bright illumination of a subject in order to properly expose photographic film; (3) Often used in reference to the actual unit that produces the flash, as in \"My flash is built into my camera.\" • FLASH METER - Exposure meter designed to measure the light from electronic flash. • FOCAL LENGTH - Focal length is the distance between the focal point of a lens and the film plane when the lens is focused at infinity. It is used to designate the relative size and angle of view of a lens, expressed in millimeters (mm). A particular lens' focal length can generally be found engraved or printed on the front of the lens. • FOCUS - (1) A point at which rays of light meet after being refracted or reflected. (2) Focal point of a lens. (3) The clear and sharply-defined condition of an image, as in “This image is in focus,” meaning it is sharp and well-defined. (4) Adjustment of the distance setting on a lens to obtain a sharply-defined image. • GELATIN - A nearly transparent substance, obtained by boiling animal tissue in water, used as (1) the medium for suspending light-sensitive silver halide crystals on photographic film, and (2) in the manufacture of gelatin filters. • GOBO - A light-blocking device that falls under the general category of \"Grip equipment.\" Generally used in a studio to prevent illumination from a studio light striking a portion of a scene. A \"gobo\" can be a simple piece of opaque cardboard or a sophisticated material in a specific shape, often a rectangle or square. \"Barn doors\" are gobos. • LATITUDE - Commonly “Exposure latitude” - The range of brightness, including shadow detail, that a film can record in a single image before the highlights wash out or the shadows become muddy. Fast films generally have greater exposure latitude than slow films. Knowing a film’s latitude lets you know how much exposure can be varied and still produce an acceptable image. • LENS - A true “lens” is a single piece of glass (or other transparent substance) having one or more curved surfaces used in changing the convergence of light rays. What we commonly call a photographic lens is more accurately and technically called an “objective,” an optical device containing a combination of lenses that receive light rays from an object and form an image on the focal plane. However, dictionaries have come to accept the usage of the term “lens” to mean the entire photographic objective itself. A photographic lens will always be called a lens, even though it is not a lens, but has a lot of lenses in it. A camera lens collects and focuses rays of light to form an image on film. • LENS SPEED - The widest aperture at which a lens can be set. A lens with a fast speed has a very wide maximum aperture, such as ƒ/1.4, for example, and transmits more light than a lens with a slow lens speed, such as ƒ/8. • LIGHT METER - An instrument used to measure the amount of light reflected from or falling on a subject. The measurement is usually expressed in shutter speed and aperture combinations that will render an acceptable exposure. (Also known as an \"Exposure meter.\") • LOCATION - A photography site that is outside of the studio. The often-heard term \"shooting on location\" refers to taking pictures at such a site. • MEMORY CARD - A removable device for storing images taken by a digital camera. • OBJECTIVE - An objective (or object lens, object glass, objective lens or photographic objective) is an optical system or device containing a combination of lenses that receive light rays from an object and form an image on the focal plane. A photographic lens is an objective. • OVER-EXPOSE - Expose a photographic emulsion to more than light than is necessary for proper exposure. • PANNING - Technique that involves taking a picture while moving the camera at a relatively slow shutter speed. It is almost always used when tracking a moving object, such as a race car, as it travels across the film plane. When properly carried out, the object is rendered relatively sharply while its surroundings are blurred. • PERSPECTIVE - Technique of depicting volumes and spacial relationships (a scene in three-dimensions) on a flat surface (an image having two dimensions). • PHOTOGRAPHERS - are frequently categorized based on the subjects they photograph. There are photographers of the subjects typical of paintings (landscape, still life, portrait, etc.) as well as documentary photographers, fashion photographers, and commercial photographers, etc. Some photographers specialize in a certain type of image, while others are generalists. The distinction between artistic photography and photojournalism or other types of photography and the associated techniques does not remove this personal aspect from the work of the great photographers. • PHOTOGRAPHY- is both an artistic and technical job with which one can present his or her technical proficiency as well as beautifully composed images. A photographer uses his camera much the way an artist uses his brush, as a tool to capture his unique perspective of the world around him. • PORTRAIT - A picture of a person or persons that captures their likeness, especially their face. (See Portrait photography.) • PORTFOLIO - A collection of selected photographs intended to illustrate a photographer's style and range of photography, or in the case of a model's portfolio, a collection of photographs and/or tearsheets that demonstrate his or her modeling abilities and experience. • POSE - The position assumed by a subject in relation to the camera, including the angling and placement of head, hands, feet, etc. • PRINT - A photographic image printed on paper, generally a positive image made from a negative. (Also refers to a photograph of a model that appears in print - in a newspaper or magazine, for example.) • RED EYE - An image in which a subject’s irises are red instead of black. The red eye effect is caused by light from a flash traveling through the iris and illuminating the retina at the interior back of the eye–– which is red in color due to its blood vessels –– and the camera capturing that redness on film. • TIFF - Tagged Image File Format - A standard digital image format for bitmapped graphics in an uncompressed state. The image files are much larger than compressed files, but can be opened in all image-processing programs. • TIME EXPOSURE - An exposure with a duration of several seconds or longer, the timing of which is measured by the photographer. • TRIPOD - A pole on a base of three legs to which a camera can be attached, providing support that eliminates or reduces camera movement, useful for sharp images when using slow shutter speeds or to show blur from a moving subject. The height of the pole and of the individual legs can usually be adjusted. Various models have different characteristics. • VIEWFINDER - A viewing device on a camera used by the photographer to see the field of view taken in by the camera’s lens and the portion of the view that will be recorded on film. (Also known as \"Finder\" or \"Projected frame.\") • ZOOM - The action of varying the focal length of a zoom lens to enlarge (zoom in) or reduce (zoom out) the image. • ZOOM LENS - A lens in which focal length is variable. Elements inside a zoom lens shift their positions, enabling the lens to change its focal length - in effect, providing one lens that has many focal lengths. (Also called a \"Variable focus lens.\")"
