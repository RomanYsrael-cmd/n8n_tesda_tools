    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: PHOTOGRAPHY\n\nNC Level: NC II\n\nNominal Duration:\n 18-hours (Basic)\n 18-hours (Common)\n 96-hours (Core)\n 132-hours\n\nCourse Description:\n\n This course is designed to enhance the knowledge, desirable attitudes and\nskills in operating camera and composing a subject, setting up studio lights,\nequipment and accessories, performing post-production stages, and presenting\nfinished products in accordance with industry standards.\n\n To obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify team\n role and responsibility in a\n team\n2.2 Describe work as a team\n member\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal objectives\n with organizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional growth\n and development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\n and safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 53 ---\n________________________________________________\nTR – Photography NC II\n\n49\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop self\nas an Artist\n1.1 Identify and apply strategies\nto develop appropriate skills\nin art practice\n1.2 Use discussion and\nevaluation opportunities to\ndevelop technical and\nconceptual skills\n1.3 Develop own style through\nexploring and experimenting\nwith new ideas in making and/\nor interpreting work\n• Lecture\n• Group\ndiscussion\n• Individual/\nGroup\nassignment\n• Interviews/\nQuestioning\n• Individual/\nGroup project or\nreport\n2. Develop and\nupdate industry\nknowledge\n2.1 Identify and access key\nsources of information on the\nindustry\n2.2 Access, apply and share\nindustry information\n2.3 Update continuously relevant\nindustry knowledge\n• Lecture\n• Group\ndiscussion\n• Individual/\nGroup\nassignment\n• Interviews/\nQuestioning\n• Individual/\nGroup project or\nreport\n3. Perform\ncomputer\noperation\n3.1 Identify and explain the\nfunctions, general features\nand capabilities of both\nhardware and software\n3.2 Prepare and use appropriate\nhardware and software\naccording to task\nrequirements\n3.3 Use appropriate devices and\nprocedures to transfer files/\ndata\n3.4 Produce accurate and\ncomplete data according to\nthe requirements\n3.5 Maintain computer system\n• Lecture\n• Group\ndiscussion\n• Tutorial or\nSelf pace\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Provide\neffective\ncustomer\nservice\n5.1 Apply effective verbal and\nnon-verbal communication\nskills to respond to customer\nneeds\n5.2 Provide prompt and quality\nservice to customer\n5.3 Handle queries promptly and\ncorrectly in line with\nenterprise procedures\n5.4 Handle customer complaints,\nevaluation and\nrecommendations\n• Lecture\n• Role play\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 54 ---\n________________________________________________\nTR – Photography NC II\n\n50\n\n5. Select and\nprepare work\nfor exhibition\n5.1 Identify the organizer and its\ncriteria for selection of work\nfor exhibition\n5.2 Select and organize work to\nsubmit for exhibition\n• Lecture\n• Group\nDiscussion\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Operate\ncamera and\ncompose a\nsubject\n1.1 Operate the camera\n1.2 Select and use lenses\n1.3 Identify and explain\ntechniques in composing a\nsubject / image\n1.4 Apply lighting techniques\n1.5 Review images\n1.6 Maintain and store equipment\nand materials\n• Lecture/\ndiscussion\n• Modular/Self\npaced\n• Peer teaching/\nMentoring\n• Project Based\nInstruction\n• Distance\nLearning\n• Fieldwork\n• Observation of\nlearner\nperforming\nactivity\n• Written test\n• Oral\nAssessment of\nindividual\npresentation\n• Portfolio\n(sample of\npictures taken)\n2. Set up studio\nlights,\nequipment and\naccessories\n2.1. Identify and check lighting\nequipment\n2.2. Prepare and set up studio\nlights and accessories\n2.3. Apply appropriate lighting\ntechniques and ratios\n2.4. Maintain and store lighting\nequipment\n• Lecture/\ndiscussion/\nDemonstration\n• Modular/Self\npaced\n• Peer teaching/\nMentoring\n• Project Based\nInstruction\n• Distance\nLearning\n• Laboratory\n• Observation of\nlearner\nperforming\nactivity\n• Written test\n• Oral\nAssessment of\nindividual\npresentation\n• Demonstration\n\n3. Perform post\ncapture\nprocessing\n3.1. Prepare work environment\nfor film or digital processing\n3.2. Identify and use image\nediting software for post\nproduction\n3.3. Apply retouching and\nenhancement techniques\n3.4. Print photos\n• Lecture/\ndiscussion/\nDemonstration\n• Modular/Self\npaced\n• Peer teaching/\nMentoring\n• Project Based\nInstruction\n• Distance\nLearning\n• Laboratory\n• Observation of\nlearner\nperforming\nactivity\n• Written test\n• Oral\nAssessment of\nindividual\npresentation\n• Demonstration\n\n--- PDF PAGE 55 ---\n________________________________________________\nTR – Photography NC II\n\n51\n\n4. Present\nfinished\nproducts\n4.1. Identify and use appropriate\nmaterials and equipment\nfor packaging and delivery\n4.2. Perform quality check of\nfinished product\n• Lecture/\ndiscussion/\nDemonstration\n• Modular/Self\npaced\n• Peer teaching/\nMentoring\n• Project Based\nInstruction\n• Distance\nLearning\n• Observation of\nlearner\nperforming\nactivity\n• Written test\n• Oral\nAssessment of\nindividual\npresentation\n• Demonstration"
