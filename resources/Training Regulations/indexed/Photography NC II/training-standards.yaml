  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n These guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training program for PHOTOGRAPHY NC II\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PHOTOGRAPHY\n\nNC Level: NC II\n\nNominal Duration:\n 18-hours (Basic)\n 18-hours (Common)\n 96-hours (Core)\n 132-hours\n\nCourse Description:\n\n This course is designed to enhance the knowledge, desirable attitudes and\nskills in operating camera and composing a subject, setting up studio lights,\nequipment and accessories, performing post-production stages, and presenting\nfinished products in accordance with industry standards.\n\n To obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify team\n role and responsibility in a\n team\n2.2 Describe work as a team\n member\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal objectives\n with organizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional growth\n and development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\n and safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 53 ---\n________________________________________________\nTR – Photography NC II\n\n49\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop self\nas an Artist\n1.1 Identify and apply strategies\nto develop appropriate skills\nin art practice\n1.2 Use discussion and\nevaluation opportunities to\ndevelop technical and\nconceptual skills\n1.3 Develop own style through\nexploring and experimenting\nwith new ideas in making and/\nor interpreting work\n• Lecture\n• Group\ndiscussion\n• Individual/\nGroup\nassignment\n• Interviews/\nQuestioning\n• Individual/\nGroup project or\nreport\n2. Develop and\nupdate industry\nknowledge\n2.1 Identify and access key\nsources of information on the\nindustry\n2.2 Access, apply and share\nindustry information\n2.3 Update continuously relevant\nindustry knowledge\n• Lecture\n• Group\ndiscussion\n• Individual/\nGroup\nassignment\n• Interviews/\nQuestioning\n• Individual/\nGroup project or\nreport\n3. Perform\ncomputer\noperation\n3.1 Identify and explain the\nfunctions, general features\nand capabilities of both\nhardware and software\n3.2 Prepare and use appropriate\nhardware and software\naccording to task\nrequirements\n3.3 Use appropriate devices and\nprocedures to transfer files/\ndata\n3.4 Produce accurate and\ncomplete data according to\nthe requirements\n3.5 Maintain computer system\n• Lecture\n• Group\ndiscussion\n• Tutorial or\nSelf pace\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Provide\neffective\ncustomer\nservice\n5.1 Apply effective verbal and\nnon-verbal communication\nskills to respond to customer\nneeds\n5.2 Provide prompt and quality\nservice to customer\n5.3 Handle queries promptly and\ncorrectly in line with\nenterprise procedures\n5.4 Handle customer complaints,\nevaluation and\nrecommendations\n• Lecture\n• Role play\n• Simulation\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 54 ---\n________________________________________________\nTR – Photography NC II\n\n50\n\n5. Select and\nprepare work\nfor exhibition\n5.1 Identify the organizer and its\ncriteria for selection of work\nfor exhibition\n5.2 Select and organize work to\nsubmit for exhibition\n• Lecture\n• Group\nDiscussion\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Operate\ncamera and\ncompose a\nsubject\n1.1 Operate the camera\n1.2 Select and use lenses\n1.3 Identify and explain\ntechniques in composing a\nsubject / image\n1.4 Apply lighting techniques\n1.5 Review images\n1.6 Maintain and store equipment\nand materials\n• Lecture/\ndiscussion\n• Modular/Self\npaced\n• Peer teaching/\nMentoring\n• Project Based\nInstruction\n• Distance\nLearning\n• Fieldwork\n• Observation of\nlearner\nperforming\nactivity\n• Written test\n• Oral\nAssessment of\nindividual\npresentation\n• Portfolio\n(sample of\npictures taken)\n2. Set up studio\nlights,\nequipment and\naccessories\n2.1. Identify and check lighting\nequipment\n2.2. Prepare and set up studio\nlights and accessories\n2.3. Apply appropriate lighting\ntechniques and ratios\n2.4. Maintain and store lighting\nequipment\n• Lecture/\ndiscussion/\nDemonstration\n• Modular/Self\npaced\n• Peer teaching/\nMentoring\n• Project Based\nInstruction\n• Distance\nLearning\n• Laboratory\n• Observation of\nlearner\nperforming\nactivity\n• Written test\n• Oral\nAssessment of\nindividual\npresentation\n• Demonstration\n\n3. Perform post\ncapture\nprocessing\n3.1. Prepare work environment\nfor film or digital processing\n3.2. Identify and use image\nediting software for post\nproduction\n3.3. Apply retouching and\nenhancement techniques\n3.4. Print photos\n• Lecture/\ndiscussion/\nDemonstration\n• Modular/Self\npaced\n• Peer teaching/\nMentoring\n• Project Based\nInstruction\n• Distance\nLearning\n• Laboratory\n• Observation of\nlearner\nperforming\nactivity\n• Written test\n• Oral\nAssessment of\nindividual\npresentation\n• Demonstration\n\n--- PDF PAGE 55 ---\n________________________________________________\nTR – Photography NC II\n\n51\n\n4. Present\nfinished\nproducts\n4.1. Identify and use appropriate\nmaterials and equipment\nfor packaging and delivery\n4.2. Perform quality check of\nfinished product\n• Lecture/\ndiscussion/\nDemonstration\n• Modular/Self\npaced\n• Peer teaching/\nMentoring\n• Project Based\nInstruction\n• Distance\nLearning\n• Observation of\nlearner\nperforming\nactivity\n• Written test\n• Oral\nAssessment of\nindividual\npresentation\n• Demonstration\n\n3.2 TRAINING DELIVERY\n\n The delivery of training should adhere to the design of the curriculum.\nDelivery shall be guided by the 10 basic principles of competency-based TVET:\n\n•\nThe training is based on curriculum developed from the competency standards\n•\nLearning is modular in its structure\n•\nTraining delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies\\\n•\nTraining is based on work that must be performed\n•\nTraining materials are directly related to the competency standards and the curriculum\nmodules\n•\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard\n•\nTraining is based both on and off-the-job components\n•\nTraining program allows for recognition of prior learning (RPL) or current\ncompetencies\n•\nTraining allows for multiple entry and exit; and\n•\nTraining programs are registered with the UTPRAS.\n\n--- PDF PAGE 56 ---\n________________________________________________\nTR – Photography NC II\n\n52\n The competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) implementing Rules and Regulations\n\n• Modular/self-paced is a competency-based training modality wherein the trainee is\nallowed to progress at his own pace. The trainer facilitates the training delivery\n\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners\n\n• Supervised Industry Training or On-the-Job Training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations\n\n• Distance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video, or computer technologies\n\n• Project-based instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n3.3 TRAINING ENTRY REQUIREMENTS\n\n Trainees or students wishing to enroll in this course should satisfy the\nfollowing requirements:\n\n• Be able to read, comprehend, and discuss printed information in English\n• Be able to write simple statements, recognize numbers, and perform basic\nnumeric calculations\n• Must bring a film or digital SLR camera\n\n--- PDF PAGE 57 ---\n________________________________________________\nTR – Photography NC II\n\n53\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n PHOTOGRAPHY NC II\n\n Recommended list of tools, equipment and materials for the training of 25 trainees\nfor Photography NC II.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n\n1 set\nof\neach\n\nHand tools\n(Screw\ndrivers, pliers,\nhammer,\ncutters,\nscissors,\nwrench)\n\n6\nunits\n\