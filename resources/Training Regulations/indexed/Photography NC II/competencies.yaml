        "source_text": "--- PDF PAGE 49 ---\n________________________________________________ \nTR – Photography NC II \n \n \n45\nUNIT COMPETENCY \n: \nPRESENT FINISHED PRODUCTS \n \nUNIT CODE \n: \n VSA313304 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to prepare finished images / prints based \non specifications. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare photo \nimages and material \nfor final packaging \n \n1.1 \nPhoto images and materials are prepared \naccording to customers’ requirements and \nspecifications \n1.2 \nEditing software is used to convert images for print \nand other requirements \n2. Select appropriate \nprinting equipment \n2.1. \nPrinting equipment is selected in accordance with \nwork requirements \n2.2. \nPrinting equipment is maintained as per \nmanufacturer’s instruction \n3.  Apply finishing  \ntouches \n3.1. \nFinished products are assessed for imperfections \nand applied finishing touches as per established \npractice. \n3.2. \nImperfections are corrected using retouching \nmaterials or appropriate editing software \n4.  Package finished \nproducts \n4.1. \nFinished products are properly labeled and \npackaged as per established practice \n4.2. \nFinished products are delivered to customers on \ntime\n\n--- PDF PAGE 50 ---\n________________________________________________ \nTR – Photography NC II \n \n \n46\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Photo images and \nmaterials \n1.1 \nPhoto images \n1.1.1 digital files \n1.1.2 Print / slides \n1.2 \nMaterials \n1.2.1 Folder \n1.2.2 Album \n1.2.3 Tarpaulin/Billboards \n1.2.4 Duratrans \n1.2.5 T-Shirts \n1.2.6 Porcelains \n1.2.7 Posters \n1.2.8 Publications and print ads \n1.2.9 Disc \n1.2.10 Website \n2. Printing Equipment \n2.1. \nInk jet \n2.2. \nLaser \n2.3. \nPhotolab \n2.4.\nOffset Printing\n3. Customer’s \nrequirements and \nspecifications \n3.1. \nGlass mount \n3.2. \nResizing and optimizing images \n3.3. \nCanvas \n3.4. \nMatting  \n3.5. \nArchival mounting  \n3.6. \nVacuum pressed \n3.7. \nLaminations \n3.7.1. chemical \n3.7.2. photo tac \n3.7.3. plastic\n4. Imperfections \n4.1. \nGlare and unwanted spots \n4.2. \nScratches \n4.3. \nSkin blemishes \n4.4. \nDust specks \n4.5. \nColor discrepancies \n4.6. \nRed eyes \n4.7. \nUnwanted distortions\n\n--- PDF PAGE 51 ---\n________________________________________________ \nTR – Photography NC II \n \n \n47\n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \n \nAssessment requires evidence that the candidate: \n1.1 \nPrepared photo images and needed materials for \nfinal packaging \n1.2 \nApplied finishing touches and packaged finished \nproducts \n1.3 \nHandled properly finished products \n2. Underpinning \nknowledge and \nattitudes \n \n \n \n2.1. \nKnowledge on different packaging materials and their \ncharacteristics    \n2.2. \nSources of these packaging materials \n2.3. \nProcess of documentation, e.g. pricing and deadlines \n2.4. \nCustomer service \n2.5. \nKnowledge on available software and other \nmultimedia tools\n3. Underpinning skills \n3.1. \n  Communication  and negotiation skills \n3.2.\n Interpersonal skills\n4. Resource \nimplications \nThe following resources MUST be provided \n4.1. \nFinished Product \n4.2. \nSoftware \n4.3.\nPackaging Materials \n5. Method of \nassessment \n \nCompetency  must be assessed through: \n5.1. \nDemonstration with oral questioning \n5.2. \nInterview \n5.3.\nPortfolio  \n6. Context for \nassessment \n6.1. \nThe assessment must provide for practical \ndemonstration of skills in presenting finished products \nusing available software and packaging materials\n",
