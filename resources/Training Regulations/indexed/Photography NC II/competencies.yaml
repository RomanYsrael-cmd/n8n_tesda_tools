        "source_text": "TRS311201\n\n UNIT DESCRIPTOR : This unit of competency deals with the knowledge,\nskills and attitude required to access, increase\nand update industry knowledge. It includes seek\ninformation on the industry and update industry\nknowledge\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Seek information on\nthe industry\n1.1 Sources of information on the industry are correctly\nidentified and accessed\n1.2 Information to assist effective work performance is\nobtained in line with job requirements\n1.3 Specific information on sector of work is accessed and\nupdated\n1.4 Industry information is correctly applied to day-to-day\nwork activities\n2. Update industry\nknowledge\n2.1 Informal and/or formal research is used to update\ngeneral knowledge of the industry\n2.2 Updated knowledge is shared with customers and\ncolleagues as appropriate and incorporated into day-to-\nday working activities\n\n--- PDF PAGE 19 ---\n________________________________________________\nTR – Photography NC II\n\n15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nInformation sources may include but are not limited to :\n1.1 media\n1.2 reference books\n1.3 libraries\n1.4 unions\n1.5 industry associations\n1.6 industry journals\n1.7 internet\n1.8 personal observation and experience\n2. Information to assist\neffective work\nperformance\n2.1 different sectors of the industry and the services\navailable in each sector\n2.2 relationship between the industry and other\nindustries\n2.3 industry working conditions\n2.4 legislation that affects the industry\n2.4.1 health and safety\n2.4.2 hygiene\n2.4.3 workers compensation\n2.4.4 consumer protection\n2.4.5 welfare and benefits\n2.5 trade unions, environmental issues and\nrequirements\n2.6 industrial relations issues and major\norganizations\n2.7 career opportunities within the industry\n2.8 work ethic required to work in the industry and\nindustry expectations of staff\n2.9 quality assurance\n\n--- PDF PAGE 20 ---\n________________________________________________\nTR – Photography NC II\n\n16\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate/ trainee :\n1.1 Knew key sources of information on the industry\n1.2 Updated industry knowledge\n1.3 Accessed and used industry information\n2. Underpinning Skills\n2.1 Time management\n2.2 Ready skills needed to access industry information\n2.3 Basic competency skills needed to access the internet\n3. Underpinning\nKnowledge and\n3.1 Overview of quality assurance in the industry\n3.2 Role of individual staff members\n3.1 Industry information sources\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Sources of information on the industry\n4.2 Industry knowledge\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview/questions\n5.2 Practical demonstration\n5.3 Portfolio of industry information related to trainee’s work\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 21 ---\n________________________________________________\nTR – Photography NC II\n\n17\n\nUNIT OF COMPETENCY: PERFORM COMPUTER OPERATIONS\n\nUNIT CODE :"
