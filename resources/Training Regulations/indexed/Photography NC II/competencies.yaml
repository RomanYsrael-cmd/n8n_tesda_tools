 job, either individually or in a \nteam environment \n2. Sources of \ninformation \n2.1 \nStandard operating and/or other workplace \nprocedures \n2.2 \nJob procedures \n2.3 \nMachine/equipment manufacturer’s specifications \nand instructions \n2.4 \nOrganizational or external personnel \n2.5 \nClient/supplier instructions \n2.6 \nQuality standards \n2.7 \nOHS and environmental standards \n3. Workplace context \n3.1 \nWork procedures and practices \n3.2 \nConditions of  work environments \n3.3 \nLegislation and industrial agreements \n3.4 \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5 \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 11 ---\n________________________________________________ \nTR – Photography NC II \n \n \n7\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nOperated in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n1.6 \nReported outcomes  \n2. Underpinning \nknowledge \n2.1 \nCommunication process \n2.2 \nTeam structure \n2.3 \nTeam roles \n2.4 \nGroup planning and decision making \n3. Underpinning skills \n3.1 \nCommunicate appropriately, consistent with the \nculture of the workplace \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 \n Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n4.2 \nMaterials relevant to the proposed activity or tasks \n5. Method of \nassessment \nCompetency must be assessed through: \n5.1 \n Observation of the individual member in relation to \nthe work activities of the group \n5.2 \n Observation of simulation and or role play involving \nthe participation of individual member to the \nattainment of organizational goal \n5.3.     Case studies and scenarios as a basis for discussion \nof    issues and strategies in teamwork \n6. Context for \nassessment \n6.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
