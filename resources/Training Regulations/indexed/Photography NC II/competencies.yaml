  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for PHOTOGRAPHY NC II.\nBASIC COMPETENCIES\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE\nCOMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information\nin response to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information\nand ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and\nconcisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting\npurpose and established protocols\n2.4\nWorkplace interactions are conducted in a\ncourteous manner\n2.5\nQuestions about simple routine workplace\nprocedures and matters concerning working\nconditions of employment are tasked and responded\nto\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment\nare completed accurately and legibly\n3.2\nWorkplace data are recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents\nare identified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\n________________________________________________\nTR – Photography NC II\n\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace-to-face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n5. Workplace\ninteractions\n5.1\nFace-to-face interactions\n5.2\nTelephone conversations\n5.3\nElectronic and two-way radio communication\n5.4\nWritten communication including electronic mail,\nmemos, instruction and forms\n5.5\nNon-verbal communication including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\n________________________________________________\nTR – Photography NC II\n\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication\nequipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the formal\nor informal communication\n2. Underpinning\nknowledge\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace Requirements\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview and written test\n6. Context for\nassessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 9 ---\n________________________________________________\nTR – Photography NC II\n\n5\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nto identify role and responsibility as a member of a\nteam.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and\nobjectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3\nObserved protocols in reporting using standard\noperating procedures\n3.4\nContribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 10 ---\n________________________________________________\nTR – Photography NC II\n\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise\nor specific sector\n1.2\nLimited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of\ninformation\n2.1\nStandard operating and/or other workplace\nprocedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\n________________________________________________\nTR – Photography NC II\n\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Underpinning\nknowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n3. Underpinning skills\n3.1\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1\n Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\n Observation of the individual member in relation to\nthe work activities of the group\n5.2\n Observation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nassessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\n________________________________________________\nTR – Photography NC II\n\n8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nin promoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra and interpersonal relationships are maintained\nin the course of managing oneself based on\nperformance evaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated\nas proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 13 ---\n________________________________________________\nTR – Photography NC II\n\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\n________________________________________________\nTR – Photography NC II\n\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCompleted trainings and career opportunities which\nare based on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n2. Underpinning\nknowledge and\nattitude\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender\nsensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context for\nassessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 15 ---\n________________________________________________\nTR – Photography NC II\n\n11\n\nUNIT OF COMPETENCY:\nPRACTICE\nOCCUPATIONAL\nHEALTH\nAND\nSAFETY PROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply\nwith regulatory and organizational requirements for\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2\nHazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3\nContingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization\nprocedure\n2. Evaluate hazards\nand risks\n2.1\nTerms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\n OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2\nProcedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3\nPersonal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4\nAppropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2\nOHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 16 ---\n________________________________________________\nTR – Photography NC II\n\n12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gases, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\n________________________________________________\nTR – Photography NC II\n\n13\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3\nRecognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based\non threshold limit value (TLV).\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nknowledge and\nattitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value (TLV)\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context for\nassessment\n6.1\nCompetency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 18 ---\n________________________________________________\nTR – Photography NC II\n\n14\n\nCOMMON COMPETENCIES\nFor Tourism Sector\n\nUNIT OF COMPETENCY : DEVELOP AND UPDATE INDUSTRY\nKNOWLEDGE\n\n UNIT CODE : TRS311201\n\n UNIT DESCRIPTOR : This unit of competency deals with the knowledge,\nskills and attitude required to access, increase\nand update industry knowledge. It includes seek\ninformation on the industry and update industry\nknowledge\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Seek information on\nthe industry\n1.1 Sources of information on the industry are correctly\nidentified and accessed\n1.2 Information to assist effective work performance is\nobtained in line with job requirements\n1.3 Specific information on sector of work is accessed and\nupdated\n1.4 Industry information is correctly applied to day-to-day\nwork activities\n2. Update industry\nknowledge\n2.1 Informal and/or formal research is used to update\ngeneral knowledge of the industry\n2.2 Updated knowledge is shared with customers and\ncolleagues as appropriate and incorporated into day-to-\nday working activities\n\n--- PDF PAGE 19 ---\n________________________________________________\nTR – Photography NC II\n\n15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nInformation sources may include but are not limited to :\n1.1 media\n1.2 reference books\n1.3 libraries\n1.4 unions\n1.5 industry associations\n1.6 industry journals\n1.7 internet\n1.8 personal observation and experience\n2. Information to assist\neffective work\nperformance\n2.1 different sectors of the industry and the services\navailable in each sector\n2.2 relationship between the industry and other\nindustries\n2.3 industry working conditions\n2.4 legislation that affects the industry\n2.4.1 health and safety\n2.4.2 hygiene\n2.4.3 workers compensation\n2.4.4 consumer protection\n2.4.5 welfare and benefits\n2.5 trade unions, environmental issues and\nrequirements\n2.6 industrial relations issues and major\norganizations\n2.7 career opportunities within the industry\n2.8 work ethic required to work in the industry and\nindustry expectations of staff\n2.9 quality assurance\n\n--- PDF PAGE 20 ---\n________________________________________________\nTR – Photography NC II\n\n16\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate/ trainee :\n1.1 Knew key sources of information on the industry\n1.2 Updated industry knowledge\n1.3 Accessed and used industry information\n2. Underpinning Skills\n2.1 Time management\n2.2 Ready skills needed to access industry information\n2.3 Basic competency skills needed to access the internet\n3. Underpinning\nKnowledge and\n3.1 Overview of quality assurance in the industry\n3.2 Role of individual staff members\n3.1 Industry information sources\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Sources of information on the industry\n4.2 Industry knowledge\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview/questions\n5.2 Practical demonstration\n5.3 Portfolio of industry information related to trainee’s work\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 21 ---\n________________________________________________\nTR – Photography NC II\n\n17\n\nUNIT OF COMPETENCY: PERFORM COMPUTER OPERATIONS\n\nUNIT CODE : TRS311203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nand values needed to perform computer operations\nwhich includes inputting, accessing, producing and\ntransferring data using the appropriate hardware\nand software\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be\nundertaken\n1.1 Requirements of task are determined as per standard\noperating procedures\n1.2 Appropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3 Task is planned to ensure OH & S guidelines and\nprocedures are followed\n2. Input data into\ncomputer\n2.1 Data are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2 Accuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3 Inputted data are stored in storage media according to\nrequirements\n2.4 Work is performed within ergonomic guidelines\n3. Access information\nusing computer\n3.1 Correct program/application is selected based on job\nrequirements\n3.2 Program/application containing the information required\nis accessed according to company procedures\n3.3 Desktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4 Keyboard techniques are carried out in line with OH & S\nrequirements for safe use of keyboards\n\n--- PDF PAGE 22 ---\n________________________________________________\nTR – Photography NC II\n\n18\n\n4. Produce/output data\nusing computer\nsystem\n4.1 Entered data are processed using appropriate software\ncommands\n4.2 Data are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3 Files and data are transferred between compatible\nsystems using computer software, hardware/ peripheral\ndevices in accordance with standard operating\nprocedures\n5. Maintain computer\nequipment and\nsystems\n5.1 Systems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2 Procedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3 Basic file maintenance procedures are implemented in\nline with the standard operating procedures\n\n--- PDF PAGE 23 ---\n________________________________________________\nTR – Photography NC II\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n2. Software\nSoftware includes the following but not limited to:\n2.1 Word processing packages\n2.2 Data base packages\n2.3 Internet\n2.4 Spreadsheets\n3. OH & S guidelines\n3.1 OHS guidelines\n3.2 Enterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1 diskettes\n4.2 CDs\n4.3 zip disks\n4.4 hard disk drives, local and remote\n5. Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5 Visual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1 directories/folders\n6.2 files\n6.3 network devices\n6.4 recycle bin\n7. Maintenance\n7.1 Creating more space in the hard disk\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7 Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 24 ---\n________________________________________________\nTR – Photography NC II\n\n20\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Selected and used hardware components correctly\nand according to the task requirement\n1.2 Identified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3 Produced accurate and complete data in\naccordance with the requirements\n1.4 Used appropriate devices and procedures to\ntransfer files/data accurately\n1.5 Maintained computer system\n2. Underpinning\nKnowledge\n2.1 Basic ergonomics of keyboard and computer use\n2.2 Main types of computers and basic features of\ndifferent operating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n3. Underpinning Skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Computer hardware with peripherals\n4.2 Appropriate software\n5. Methods of\nAssessment\nCompetency must be assessed through:\n4.1 Observation\n4.2 Questioning\n4.3 Practical demonstration\n6. Context for\nAssessment\n6.1 Assessment may be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 25 ---\n________________________________________________\nTR – Photography NC II\n\n21\n\nUNIT OF COMPETENCY: PROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n\n: TRS311205\n\nUNIT DESCRIPTOR :\nThis unit of competency deals with the knowledge,\nskills and attitudes in providing effective customer\nservice. It includes greeting customer, identifying\ncustomer needs, delivering service to customer,\nhandling queries through telephone, fax machine,\ninternet and email and handling complaints,\nevaluation and recommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Greet customer\n1.1 Guests are greeted in line with enterprise procedure\n1.2 Verbal and non-verbal communications are appropriate\nto the given situation\n1.3 Non verbal communication of customer is observed\nresponding to customer\n1.4 Sensitivity to cultural and social differences is\ndemonstrated\n2. Identify customer\nneeds\n2.1 Appropriate interpersonal skills are used to ensure\nthat customer needs are accurately identified\n2.2 Customer needs are assessed for urgency so that\npriority for service delivery can be identified\n2.3 Customers are provided with information\n2.4 Personal limitation in addressing customer needs is\nidentified and where appropriate, assistance is sought\nfrom supervisor\n3. Deliver service to\ncustomer\n3.1 Customer needs are promptly attended to in line with\nenterprise procedure\n3.2 Appropriate rapport is maintained with customer to\nenable high quality service delivery\n3.3 Opportunity to enhance the quality of service and\nproducts are taken wherever possible\n\n--- PDF PAGE 26 ---\n________________________________________________\nTR – Photography NC II\n\n22\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Handle queries\nthrough telephone,\nfax machine, internet\nand email\n4.1 Use telephone, computer, fax machine, internet\nefficiently to determine customer requirements\n4.2 Queries/ information are recorded in line with enterprise\nprocedure\n4.3 Queries are acted upon promptly and correctly in line\nwith enterprise procedure\n5. Handle complaints,\nevaluation and\nrecommendations\n5.1 Guests are greeted with a smile and eye-to-eye contact\n5.2 Responsibility for resolving the complaint is taken\nwithin limit of responsibility\n5.3 Nature and details of complaint are established and\nagreed with the customer\n5.4 Appropriate action is taken to resolve the complaint to\nthe customers satisfaction wherever possible\n\n--- PDF PAGE 27 ---\n________________________________________________\nTR – Photography NC II\n\n23\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Non-verbal\ncommunication\n1.1 body language\n1.2 dress and accessories\n1.3 gestures and mannerisms\n1.4 voice tonality and volume\n1.5 use of space\n1.6 culturally specific communication customs and\npractices\n2. Cultural and social\ndifferences\nIncludes but are not limited to :\n2.1 modes of greeting, farewelling and conversation\n2.2 body language/ use of body gestures\n2.3 formality of language\n3. Interpersonal skills\n3.1 interactive communication\n3.2 public relation\n3.3 good working attitude\n3.4 sincerity\n3.5 pleasant disposition\n3.6 effective communication skills\n4. Customer needs\nCustomer with specific needs may include :\n4.1 those with a disability\n4.2 those with special cultural or language needs\n4.3 unaccompanied children\n4.4 parents with young children\n4.5 pregnant women\n4.6 single women\n5. Enterprise procedure\nProtocol and enterprise procedures may include :\n5.1 modes of greeting and farewell\n5.2 addressing the person by name\n5.3 time-lapse before a response\n5.4 style manual requirements\n5.5 standard letters and proforma\n\n--- PDF PAGE 28 ---\n________________________________________________\nTR – Photography NC II\n\n24\n\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety\npractices\n1.4 Promoted public relation among others\n1.5 Demonstrated familiarity with company facilities,\nproducts and services\n1.6 Applied company rules and standards\n1.7 Applied telephone ethics\n1.8 Applied correct procedure in using telephone, fax\nmachine, internet\n1.9 Handled customer complaints\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with sincerity\n2.2 Safety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3 Attitude\n 2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4 Theory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process and barriers\n3. Underpinning Skills\n3.1 Effective communication skills\n3.2 Non-verbal communication - body language\n3.3 Ability to work calmly and unobtrusively effectively\n3.4 Ability to handle telephone inquiries and\n conversations\n3.5 Correct procedure in handling telephone inquiries\n3.6 Proper way of handling complaints\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 telephone, fax machine, internet, etc.\n4.3\ndata on projects and services; tariff and rates,\npromotional activities in place etc.\n4.3 office supplies\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Written examination\n5.2 Practical demonstration\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2. Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 29 ---\n________________________________________________\nTR – Photography NC II\n\n25\n\nCOMMON COMPETENCIES\n For Visual Arts Sector\n\nUNIT TITLE\n:\nDEVELOP SELF AS AN ARTIST\n\nUNIT CODE\n:\nVSA313201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to exhibit professional practice that\ndescribes development of technical and conceptual\nskills required to work as a practicing artist. It also\ndeals with communicating effectively and working\nstrategically to achieve planned outcomes as an\nartist.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Acquire and develop\ntechnical skills\n1.1\nStrategies for developing self are identified and\nplanned to ensure the development of appropriate\ntechnical skills\n1.2\nRelevant journals, magazines, catalogues and other\nmedia are used to stimulate technical and\nprofessional development\n1.3\nCapabilities of materials, tools and equipment are\ntested to develop technical skills\n1.4\nFeedback, discussion and evaluation opportunities to\ncontinuously improve technical skills are identified\nand used.\n2. Develop conceptual\nskills and ideas\n2.1\nWork experiences and ideas are discussed with\nothers to improve own practice.\n2.2\nWork of others are studied to stimulate conceptual\nand technical skills development\n2.3\nOpportunities to develop skills are identified and\nhave participated.\n3. Develop own style\n3.1\nNew ideas in making and / or interpreting work are\nexplored and experimented.\n3.2\nTechnology, where appropriate to expand own\npractice is explored and used.\n4. Evaluate own work\n4.1\nConstructive criticism is sought and applied to\nimprove own work\n4.2\nWork is evaluated against planned strategy and in the\ncontext of work of others in order to improve own\npractice\n4.3\nWork processes and practice are adjusted as\nnecessary to improve technical, conceptual and\ncommercial outcomes.\n5. Research work\nopportunities\n5.1\nNetworks and sources of information relating to\nwork opportunities are correctly identified.\n5.2\nPromotional opportunities that may helpful in\ndeveloping career opportunities are identified.\n\n--- PDF PAGE 30 ---\n________________________________________________\nTR – Photography NC II\n\n26\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies for\ndeveloping self\n1.1\nWorking effectively with Assessor / Trainor\n1.2\nParticipating in professional development\n1.3\nUndertaking training courses\n1.4\nPracticing\n1.5\nParticipating in relevant groups or associations\n1.6\nExperimenting\n1.7\nCommunicating with peers\n1.8\nBeing involved in a range of relevant art making\nactivities\n2. Technical Skills\n2.1\nPainting and drawing\n2.2\nPhotography\n2.3\nSculpture\n2.4\nFiber / textile arts, including paper making / paper\ncasting\n2.5\nCeramics\n2.6\nJewelry\n2.7\nDesigning and making three dimensional objects\n2.8\nVideo\n2.9\nPrintmaking\n2.10 Information Technology, including relevant hardware\nand software\n3. Opportunities to\ndevelop skills\n3.1\nExhibitions\n3.2\nLectures, seminars, conferences, symposiums\n3.3\nFloor talks at galleries\n3.4\nCompetitions\n3.5\nMaster classes\n3.6\nProfessional organizations\n4. Networks and\nSources of\nInformation\n4.1\nNetworks\n4.1.1 Professional associations\n4.1.2 Alumni organizations\n4.1.3 Community organizations\n4.1.4 Colleagues and teachers\n4.2\nSources of Information\n4.2.1 Gallery listings\n4.2.2 Job advertisements\n4.2.3 Websites\n4.2.4 Word of mouth\n4.2.5 Art journals\n4.2.6 Exhibition catalogues and program\n5. Promotional\nopportunities\n5.1\nCompetitions\n5.2\nExhibitions\n5.3\nCommunity events\n5.4\nParticipation on websites\n5.5\nMembership of specialization-specific organization\n5.6\nApplications to funding bodies\n\n--- PDF PAGE 31 ---\n________________________________________________\nTR – Photography NC II\n\n27\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nApplied strategies to develop appropriate skills in art\npractice\n1.2\nUsed discussion and evaluation opportunities to\ndevelop technical and conceptual skills\n1.3\nDemonstrated work practice that develops own style\nthrough exploring and experimenting with new ideas\nin making and / or interpreing work\n2. Underpinning\nknowledge\n\n2.1\nKnowledge about theoretical and historical contexts\nrelevant to the area(s) of specialization(s)\n2.2\nElements and principles of design\n2.3\nPhysical properties and capabilities of material, tools\nand equipment and their application\n2.4\nAwareness of copyright, moral rights and intellectual\nproperty issues related to the development of self as\nartist\n2.5\nSources of information relating to work opportunities\nand career planning\n2.6\nVisual arts and contemporary craft\n3. Underpinning skills\n3.1\nLiteracy skills sufficient to interpret information and\ncommunicate ideas\n3.2\nDiscerning and listening to advice from colleagues,\nexperts and audiences\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nSpecialized materials, tools and equipment required\nfor each area of specialization and used to develop\ntechnical and conceptual skills relevant to art making\npractice\n4.2.\nInformation about relevant artist, their work, ideas\nand techniques\n5. Method of\nassessment\n\nCompetency must be assessed through:\n4.1\nObservation / Demonstration with oral questioning\n4.2\nPortfolio\n4.3\nThird party report\n6. Context for\nassessment\n6.1.\nCompetency may be assessed in the work place or in\na simulated work place setting.\n\n--- PDF PAGE 32 ---\n________________________________________________\nTR – Photography NC II\n\n28\n\nUNIT OF COMPETENCY: SELECT AND PREPARE WORK FOR\nEXHIBITION\n\n UNIT CODE\n : VSA313202\n\nUNIT DESCRIPTOR :\nThis unit describes the skills and knowledge\nrequired to select and prepare work for display or\nexhibition. The skills and knowledge are not\nrestricted to a particular specialization but apply\nacross all specialization depending on the work\ncontext.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select work to\nsubmit for exhibition\n1.1 Relevant information on the criteria is accessed which\ninforms the selection of work for exhibition\n1.2 information on criteria for display of work is interpreted\n1.3 Issues surrounding criteria with relevant\nindividuals/organizations is identified and clarified\n1.4 Work is selected in accordance with established criteria\n2 Organize selected\nwork for exhibition\n2.1 Completeness of work to be displayed is checked and\naction is taken when required\n2.2 Any specific requirements for display of selected work\nis determined and taken action in consultation with\nrelevant individuals or organizations\n2.3 Relevant steps and processes required to prepare\nselected work for display is identified\n2.4 Work is prepared using appropriate techniques or\nengage the services of others as required\n2.5 Accurate information on work is provided to relevant\nindividuals/organizations in accordance with\nrequirements\n2.6 Work is submitted to exhibition curator or display\norganizer within agreed timeframe and in accordance\nwith other agreed requirements\n2.7 Assistance for exhibition is provided with installation or\nhanging as required and in accordance with instructions\n\n--- PDF PAGE 33 ---\n________________________________________________\nTR – Photography NC II\n\n29\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Exhibition\nExhibition of work occurs in a variety of contexts,\nincluding\n1.1\nStudio spaces\n1.2\nLocal community spaces\n1.3\nWeb sites\n1.4\nArtist run spaces\n1.5\nGroup exhibition at regional venues\n1.6\nRetail display\n1.7\nContribution to an exhibition via submission to a\ncompetition\n2. Criteria\nCriteria for selection of work for exhibition may include:\n2.1 Criteria provided by organizer of exhibition\n2.2 Criteria decided by artist, designer or performer\n2.3 Size, dimension, theme, medium, number of pieces\n2.4 Quality of completed work\n2.5 Personal preferences\n2.6. Physical characteristics of display area, eg light,\nventilation and access\n3. Completeness\nCompleteness of work may involve\n3.1 Tidiness/cleanliness\n3.2 All elements present\n3.3 Touch up requirements satisfied\n3.4 Resolution requirements for web presentation\n4. Requirements for\ndisplay\nRequirements for display may include:\n4.1 Framing\n4.2 Cleaning the work\n4.3 Attaching fixtures for hanging or mounting\n4.4 Selecting and painting plinths\n4.4 The display environment, e.g. light, humidity,\ntemperature, power sources\n4.5 Accompanying documentation, e.g. consignment\nnotes, artist's statement\n4.7 Web site information\n5. Assistance for the\nexhibition\nAssistance for the exhibition may involve\n5.1 Planning the exhibition space\n5.2 Planning the location of work within the space\n5.3 Contributing to safely hanging, installing and\ndismantling work\n5.4 Labeling work\n5.5 Wrapping/storage of works at the conclusion of the\ndisplay or exhibition\n\n--- PDF PAGE 34 ---\n________________________________________________\nTR – Photography NC II\n\n30\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1 Selected work to submit for exhibition\n1.2 Organized selected work for exhibition\n2. Underpinning\nknowledge and\nattitude\n2.1 Exhibition, display or presentation contexts relevant\nto the area of work\n2.2 General knowledge about techniques for display or\nexhibition relevant to the area of work, eg hanging,\ndismantling\n2.3 General knowledge of ways in which space is\nplanned for display or exhibition purposes relevant\nto area of work\n2.4 General knowledge of the elements and principles\nof design and their specific application to the layout\nof an exhibition or display\n2.5 Awareness of copyright, moral rights and\nintellectual property issues relevant to exhibitions\nand display\n2.6 Organizational and legislative occupational health\nand safety issues relating to exhibitions and\ndisplays of work and their safe hanging/installing\nand dismantling\n2.7 Literacy skills sufficient to interpret exhibition or\ndisplay requirements\n3. Underpinning Skills\n3.1 Effective communication skills especially in dealing\nwith other artists, event organizers and staff\n3. 2 Ability to select work for submission which is\nconsistent with the criteria for the exhibition or\ndisplay\n3.3 Planning and organizing work and materials for\nexhibition\n3.3 Practice of good time management\n3.5 Ability to handle telephone or face to face inquiries\nand conversations regarding work for exhibition\n4. Resource Implications The following resources MUST be provided:\n4.1 Telephone, fax machine, internet, etc.\n4.2 Access to the materials, resources and equipment\nneeded to prepare work for exhibition and to assist\nto safely hang and/or install and dismantle an\nexhibition or display\n4.3 Work samples for exhibition\n5. Method of Assessment\nCompetency must be assessed through:\n5.1 Demonstration with questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2 Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 35 ---\n________________________________________________\nTR – Photography NC II\n\n31\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nOPERATE CAMERA AND COMPOSE A\nSUBJECT\nUNIT CODE\n:\n VSA313301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to operate camera, position the camera,\nselect appropriate lens and compose the shots to\nachieve the required image.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1. Operate the camera\n1.1.\nCamera is identified and selected appropriately for\nspecific purpose\n1.2.\nCamera is operated safely in accordance with\nmanufacturer’s instruction\n2. Select and use lens\n2.1.\nLenses are selected according to technical and\nsubject requirement.\n2.2.\nFocusing techniques of lens are applied.\n3. Address lighting\nand exposure\n3.1.\nQuality and quantity of available lights are assessed\nto determine appropriate exposure and lighting effect.\n3.2.\nCorrective actions are taken to address changing or\ninadequate lighting conditions.\n4. Compose a subject\n4.1.\nSubject is identified and visualized according to\ngraphic elements and rules of composition\n4.2.\nSubject is composed to meet aesthetic requirements\nand provided the correct visual interpretation of work\nrequirements\n\n--- PDF PAGE 36 ---\n________________________________________________\nTR – Photography NC II\n\n32\n\n5. Experiment with\ntechniques to\ncapture\nphotographic\nimages\n5.1.\nTechniques are appropriately identified and selected\nfor the photographic subject matter\n5.2.\nControls are selected and use to effect image\ncapture and to ensure correct exposure\n5.3.\nTechniques are tested to achieve changes to subject\nappearance as required\n5.4. Corrective filters are selected and used to meet the\ncreative and technical requirements of the shots\n5.5. Corrective filters are used to ensure that color\nbalance and light conditions are attained\n6. Review images\n6.1.\nImages are viewed from the camera LCD, computer\nor TV monitor.\n6.2. Results are evaluated to ensure correct exposure and\nthe desired outcome for the subject matter.\n6.3.\nImages are stored in the storage media.\n7. Restore equipment\n7.1.\nEquipment is cleaned after use as per manufacturers’\ninstruction.\n7.2.\nEquipment and materials are stored in accordance\nwith workplace procedures\n\n--- PDF PAGE 37 ---\n________________________________________________\nTR – Photography NC II\n\n33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nShots\n1.1 Extreme close up\n1.2 Close up\n1.3 Mid shot\n1.4 Long shot\n1.5 Wide shot\n1.6 High angle\n1.7 Eye level shot\n1.8 Low angle\n1.9 Establishing or master shot\n1.10 Point of view shot\n1.11 Camera Panning\n2.\nLenses\n2.1 Standard lens\n2.2 Telephoto lens\n2.3 Wide Angle lens\n2.4 Variable focal length\n2.5 Fixed focal length\n2.6 Macro / Micro lens\n2.7 Shift lens\n2.8 Fisheye lens\n\nPerformance characteristics of lenses may include :\n2.9 Resolution\n2.10 Contrast\n2.11 Image shift\n2.12 Sharpness\n2.13 Zoom\n2.14 Mechanical Operation\n2.15 Focal Length\n2.16 Maximum Aperture\n3.\nGraphic elements\n3.1 Lines\n3.2 Shapes\n3.3 Texture\n3.4 Color\n3.5 Tones\n4. Operation of camera\n4.1 Hand held operation\n4.2 Fixed / supported camera\n5. Filters\n5.1 Color correction\n5.2 Contrast filters for black and white\n5.3 Graduated, neutral density\n5.4 Ultraviolet or skylight\n5.5 Polarizing\n5.6 Special effects\n5.7 Enhancers\n5.8 Color balancing filters\n\n--- PDF PAGE 38 ---\n________________________________________________\nTR – Photography NC II\n\n34\n\nVARIABLE\nRANGE\n6.\nCameras\n6.1\n35 mm –SLR -RF\n6.2\nDigital SLR\n6.3\nMedium Format – SLR –TLR, RF\n6.4\nLarge Format\n6.4.1 Monorail\n6. Equipment and\nmaterials\n6.1.\n35 mm SLR and digital equivalent\n6.2.\nFilm suitable for the nominated techniques ( black\nand white, color or digital media)\n6.3.\nLenses covering different focal lengths\n6.4.\nTripod\n6.5.\nCable release / R Control\n6.6.\nFilters\n6.7.\nLens hoods\n6.8.\nSheet film\n7. Subject matter\n7.1.\nPeople\n7.2.\nStill life / Product\n7.3.\nEnvironment\n8. Controls\n8.1.\nAperture\n8.2.\nShutter speed\n8.3.\nFocal length of lenses\n9. Techniques to\ncapture photographic\nimage\n9.1.\nShutter speed\n9.1.1. Freeze motion\n9.1.2. Panning\n9.1.3. Time exposure\n9.1.4. Slow shutter speeds and moving subjects\n9.2.\nAperture\n9.2.1. Depth of field (maximum and minimum)\n9.2.2. Effect of different focal lengths on depth of field\n9.3.\nPerspective\n9.3.1. Stretched perspective\n9.3.2. Normal perspective\n9.3.3. Compressed perspective\n9.4.\nExposure meter techniques\n9.4.1. Reflected\n9.4.2. Incident\n10. Process and output\nmay refer to\n10.1. Photographic film developing and printing\n10.2. Digital image processing and output\n\n--- PDF PAGE 39 ---\n________________________________________________\nTR – Photography NC II\n\n35\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate :\n1.1 Interpreted creative and technical requirements and\nprovided additional ideas in order to produce the\ndesired style of captured images\n1.2 Applied knowledge of photographic principles\n1.3 Demonstrated technical knowledge in the use of range\nof cameras\n1.4\nRestored equipment and materials safely\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Interpretation of creative requirements to technical\noperation\n2.2 Range of cameras and operational functions\n2.3 Framing techniques and methods of composition\n2.4 Lens theory and application\n2.5 Shutter speeds and Aperture settings\n2.6 Handling customers relationship\n3. Underpinning skills\n3.1 Using depth of field tables and methods of calculation\ninvolved in determining correct f/stop\n3.2\nUsing different types of light measuring devices\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Range of cameras\n4.2 Studio with lighting systems\n4.3 Subject\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Interview\n5.3. Portfolio\n6. Context for\nassessment\n6.1 Competency maybe assessed on the job due to the\nspecific workplace environment requirements.\nHowever, it can be undertaken in a closely simulated\nworkplace environment that reproduces all the required\nelements.\n\n--- PDF PAGE 40 ---\n________________________________________________\nTR – Photography NC II\n\n36\n\nUNIT COMPETENCY\n:\nSET UP STUDIO LIGHTS, EQUIPMENT AND\nACCESSORIES\n\nUNIT CODE\n:\n VSA313302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to employ lighting techniques to a wide\nrange of subjects in different situations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1. Plan lighting\nrequirements\n\n1.1 Required lighting characteristics for the subject and\npurpose of image are correctly identified.\n1.2 Lighting equipment for the purpose are selected\nappropriately\n2. Prepare specific work\nenvironment\n2.1 Work Environment that meets requirements for the\nproduction of work is selected appropriately\n2.2 Relevant camera systems and accessories for the\nwork are selected and used.\n2.3 Lighting system is correctly assembled in accordance\nwith work requirements\n2.4 Required safety aspects of the lighting set up and\ncabling are implemented.\n3. Light the subject\n3.1 Lighting techniques are tested to suit the purpose of\nwork\n3.2 Qualities of light is adjusted, modified and\ncalibrated to suit subject.\n3.3 Exposure is calculated to determine subject\nconsistency with the purpose of photography\n4. Capture image\n4.1 Images are captured using film or digital\n4.2 Captured images based on work requirements are\nreviewed and appropriate actions are taken, if\nnecessary.\n5. Restore work\nenvironment and\nequipment\n5.1. Work environment is restored after use as per\nestablished practice\n5.2. Equipment is cleaned and maintained in accordance\nwith manufacturers’ instructions\n5.3. Equipment and materials are stored safely as per\nworkplace procedures.\n\n--- PDF PAGE 41 ---\n________________________________________________\nTR – Photography NC II\n\n37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work environment\n1.1.\nElectricity\n1.2.\nNatural and artificial lights\n1.3.\nVentilation\n1.4.\nDust free environment\n1.5.\nWork tables and storage areas and facilities\n1.6.\nPortable generator\n1.7.\nOther portable equipment and materials, e.g.\nbackground, tripods and reflectors\n1.8.\nChairs, stools, posing tables\n1.9.\nChanging room / Make-up room\n1.10. Running water\n1.11. Kitchen equipment set-up\n2. Subject\n2.1 Nature, e.g. landscape, seascape, flowers,\n2.2 Still life, e.g. glassware\n2.3 Scientific / medical / technical\n2.4 Photo-documentary, e.g. social and corporate\nevents\n2.5 Portraiture\n2.6\n Product and Food\n3. Camera systems\nand accessories\n3.1.\n35 mm SLR camera\n3.2.\n120 camera, view camera\n3.3.\nDigital SLR cameras and digital back\n3.4.\nFilm and media\n3.5.\nRange of lenses\n3.6.\nCable release\n3.7.\nTripods and li