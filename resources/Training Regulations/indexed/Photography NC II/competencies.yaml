ted, matrix, meter readings\n6.5. Histogram readings\n6.6.\nOff the film plane metering (TTL & OTF metering)\n\n--- PDF PAGE 43 ---\n________________________________________________\nTR – Photography NC II\n\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSelected appropriate camera and lighting\nequipment and associated accessories for specified\nsubjects\n1.2\nApplied range of lighting techniques for the\nspecified subjects\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nKnowledge of the ways in which a typical photo\nimaging studio is organized and practiced\n2.2\nKnowledge of electromagnetic spectrum, color\ntemperature and color synthesis\n2.3\nKnowledge of photo imaging, lighting, including\nterminology and identification\n2.4\nKnowledge of the ways in which light sensitive\nmaterials, including films and digital sensors,\nrespond to light\n2.5\nknowledge of the implications of light on exposure\nor light sensitive media\n2.6\nKnowledge of physical properties and capabilities of\nthe camera systems and lighting equipment used in\nthe exposure of photographic film and digital\nsensors\n2.7\nOccupational health and safety issues and\nprocedures associated with lighting\n2.8\nKnowledge of elements and principles of design\n2.9\nKnowledge of other photographers, their work,\nideas and techniques specially pertaining to lighting\n3 Underpinning skills\n3.1\nLiteracy skills sufficient to read and interpret written\ninstructions, safety labels and procedures\n3.2\nNumeracy skills sufficient to interpret technical\ncharts and diagrams pertaining to a range of lighting\nprocedures and techniques\n4 Resource\nimplications\nThe following resources MUST be provided\n4.1.\nStudio with complete lighting system\n4.2.\nMaterials, resources and equipment needed to\nselect, set up, adjust and apply camera and lighting\nsystems\n5. Method of\nassessment\n\nCompetency must be assessed through:\n5.1.\nDemonstration with oral questioning\n5.2.\nInterview\n5.3.\nPortfolio\n6.\nContext for\nassessment\n6.1\nThe assessment must provide for project or work\nactivities that would allow the candidate to select\nand apply a range of lighting techniques for\nspecified subjects\n\n--- PDF PAGE 44 ---\n________________________________________________\nTR – Photography NC II\n\n40\n\nUNIT COMPETENCY\n:\nPERFORM POST CAPTURE PROCESSING\n\nUNIT CODE\n:\n VSA313303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to use techniques for image processing\nand\nfocuses\non\ntechnical\naspects\nincluding\nchemical and electronic processes. This unit refers\nto the use of specific equipment and techniques for\nmaking photo images.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1. Prepare work\nenvironment for post\ncapture processing\n\n1.1.\nWork environment is selected in order to meet\nrequirements for specific processing tasks\n1.2.\nWork environment is cleaned and maintained to\nremain safe during the production of work\n1.3.\nEquipment and materials / software for processing\nwork are correctly set up\n1.4.\nCodes of practices are followed based on safety\nrequirements of the workplace\n2. Process images by\nanalog or digital\nmeans\n2.1.\nDigital files are downloaded in accordance with\nmanufacturers’ instructions\n2.2.\n Negatives or files are organized into appropriate\nfolders as per established practice\n2.3.\nWork progress is accurately documented in\naccordance with workplace procedures\n3. Test techniques to\nproduce proof\nsheet(s)\n3.1.\nFiles or negatives are appropriately selected\naccording to established practice\n3.2.\nAppropriate techniques are applied to produce\nanalog or digital proof sheets\n4. Test techniques to\nmake work-print(s)\nand screen images\n4.1.\nImages from the proof sheets are selected that match\nthe concept / required outcome\n4.2.\nEnhancement and printing techniques are 