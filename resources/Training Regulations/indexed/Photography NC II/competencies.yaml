        "source_title": "Perform post capture processing",
        "source_text": "--- PDF PAGE 44 ---\n________________________________________________ \nTR – Photography NC II \n \n \n40\n \n \nUNIT COMPETENCY \n: \nPERFORM POST CAPTURE PROCESSING \n \nUNIT CODE \n: \n VSA313303 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to use techniques for image processing \nand \nfocuses \non \ntechnical \naspects \nincluding \nchemical and electronic processes.  This unit refers \nto the use of specific equipment and techniques for \nmaking photo images.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare work \nenvironment for post \ncapture processing \n \n1.1. \nWork environment is selected in order to meet  \nrequirements for specific processing tasks  \n1.2. \nWork environment is cleaned and maintained to \nremain safe during the production of work \n1.3. \nEquipment and materials / software for processing \nwork are correctly set up \n1.4. \nCodes of practices are followed based on safety \nrequirements of the workplace \n2. Process images by \nanalog or digital \nmeans \n2.1. \nDigital files are downloaded in accordance with  \nmanufacturers’ instructions  \n2.2. \n Negatives or files are organized into appropriate \nfolders as per established practice \n2.3. \nWork progress is accurately documented in \naccordance with workplace procedures \n3. Test techniques to \nproduce proof \nsheet(s)  \n3.1. \nFiles or negatives are appropriately  selected \naccording to established practice  \n3.2. \nAppropriate techniques are applied to produce \nanalog or digital proof sheets \n4. Test techniques to \nmake work-print(s) \nand screen images \n4.1. \nImages from the proof sheets are selected that match \nthe concept / required outcome \n4.2. \nEnhancement and printing techniques are utilized  \nto output work-print(s) or display and save on screen\n\n--- PDF PAGE 45 ---\n________________________________________________ \nTR – Photography NC II \n \n \n41\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement\n5.  Store photo images \n5.1. \nStorage media are identified and selected based on \nwork requirements \n5.2. \n Stored photo images are catalogued, organized and \nbacked up as per established practice \n6.  Restore work \nenvironment and \nequipment \n6.1. \nWork area is safely dismantled after use based on \nstandard operating procedures \n6.2. \nWaste is minimized and disposed off in accordance \nwith safety and health requirements \n6.3. \nEquipment is cleaned and maintained in accordance \nwith manufacturer’s instructions \n6.4. \nEquipment is stored in accordance with workplace \nprocedures\n\n--- PDF PAGE 46 ---\n________________________________________________ \nTR – Photography NC II \n \n \n42\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work environment \n1.1. \nDarkroom equipped with enlarger(s), film processing \nand developing requirements, appropriate lighting \nwith managed electrical cabling and plumbing system \nsafely installed, proper disposal of chemicals  \n1.2. \nDigital workplace equipped with computers, \nscanners, printers, storage for software, electrical \ncabling safely installed and managed, legitimate \nsoftware \n2. Equipment \n2.1 \nDarkroom equipment  \n2.1.1 Enlarger(s) \n2.1.2 Timer(s) \n2.1.3 Trays \n2.1.4 Tanks \n2.1.5 Print tongs \n2.1.6 Thermometer \n2.1.7 Chemical mixing equipment \n2.1.8 Water bath \n2.1.9 Film Dryer \n \n2.2 \nDigital equipment \n2.2.1 Computer \n2.2.2 Calibrated monitor \n2.2.3 Film  and flat bed scanners \n2.2.4 Output devices \n2.2.5 Digital camera \n2.2.6 Discs and digital media storage cards \n2.2.7 Card readers \n2.2.8 Legitimate software \n2.2.9 External media drives \n2.2.10 Image recovery software \n2.2.11 Digital asset management or Database\n\n--- PDF PAGE 47 ---\n________________________________________________ \nTR – Photography NC II \n \n \n43\n \nVARIABLE \nRANGE \n3. Materials \n3.1. \nMaterials for film photography \n3.1.1. \nChemicals for  darkroom film processing and \ndeveloping \n3.1.2. \nBlack and white films  \n3.1.3. \nColor transparencies and negatives \n3.1.4. \nStorage folders \n3.1.5. \nPhotographic paper \n \n3.2. \nMaterials for digital photography \n3.2.1. \nMemory card \n3.2.2. \nInkjet paper \n3.2.3. \nInk \n3.2.4. \nCompact disc \n3.2.5. \nBatteries and other power sources   \n4. Storage Media  \n4.1 \nNegative sleeves / jackets / folders \n4.2 \nDesktop folders, electronic media transfer / storage \ndevices / CD and DVD \n5. Documenting the \nwork progress  \n5.1 \nVisual diary \n5.2 \nDiagrams \n5.3 \nRecording procedures  \n5.3.1 Incident report \n5.3.2 Job completion report \n5.3.3 Equipment report \n5.3.4 Materials report\n6. Printing \nTechniques \n6.1. Dodging \n6.2. Burning \n6.3. Density \n6.4. Contrast  \n6.5. Color correction \n6.6. Spotting and basic retouching \n6.7. Using digital tool box functions \n6.8.\nUsing photo relevant menu\n\n--- PDF PAGE 48 ---\n________________________________________________ \nTR – Photography NC II \n \n \n44\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \n \nAssessment requires evidence that the candidate: \n1.1 \nPrinted  proof sheets / work prints / digital files \n1.2 \nDemonstrated the application of selected techniques \nconsistent with concept / brief. \n2. Underpinning \nknowledge and \nattitudes \n \n \n \n1.1 \nCharacteristics of different materials (chemicals) \nunder different treatment and the potential of these \ncharacteristics to achieve different effects  \n1.2 \nKnowledge on work space requirement for photo \nimaging, including set up of work space for particular \ntypes of work \n1.3 \nKnowledge on capabilities of digital and darkroom \nequipment and their applications \n1.4 \nCopyright, moral rights and intellectual property \nissues and legislation associated with photo imaging \nwork \n1.5 \nEnvironmental issues associated with the equipment \nand materials used in photo imaging work \n1.6 \nOrganizational and legislative occupational health \nand safety procedures in relation to photo imaging \nwork \n1.7 \nElements and principles of design and how these \nmay be used, adapted for image processing \n1.8 \nTraditional or modern practices to improve one’s style \nin photography \n1.9 \nSelf improvement through reading and research \n2 Underpinning skills \n1.1 \nLiteracy skills sufficient to read and interpret written  \ninstructions, safety labels and procedures \n1.2 \nNumeracy skills sufficient to interpret technical charts \n/diagrams / graphs\n2 Resource \nimplications \nThe following resources MUST be provided \n4.1. \nDark room (Analog) \n4.2. \nComputer with software (Digital) \n4.3. \nMaterials, resources and equipment needed to \nprocess safely, enhance analog or digital photo-\nimages and to store these images \n5. Method of \nassessment \n \nCompetency in this unit must be assessed through: \n5.1. \nDemonstration with oral questioning \n5.2. \nInterview \n5.3.\nPortfolio  \n7. \nContext for \nassessment \n6.1 \nThe assessment must provide for practical \ndemonstration of skills using required equipment and \nmaterials for the production of proof sheets / work \nprints / digital files (s)\n",
