        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety\npractices\n1.4 Promoted public relation among others\n1.5 Demonstrated familiarity with company facilities,\nproducts and services\n1.6 Applied company rules and standards\n1.7 Applied telephone ethics\n1.8 Applied correct procedure in using telephone, fax\nmachine, internet\n1.9 Handled customer complaints\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with sincerity\n2.2 Safety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3 Attitude\n 2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4 Theory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process and barriers\n3. Underpinning Skills\n3.1 Effective communication skills\n3.2 Non-verbal communication - body language\n3.3 Ability to work calmly and unobtrusively effectively\n3.4 Ability to handle telephone inquiries and\n conversations\n3.5 Correct procedure in handling telephone inquiries\n3.6 Proper way of handling complaints\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 telephone, fax machine, internet, etc.\n4.3\ndata on projects and services; tariff and rates,\npromotional activities in place etc.\n4.3 office supplies\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Written examination\n5.2 Practical demonstration\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2. Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 29 ---\n________________________________________________\nTR – Photography NC II\n\n25\n\nCOMMON COMPETENCIES\n For Visual Arts Sector\n\nUNIT TITLE\n:\nDEVELOP SELF AS AN ARTIST\n\nUNIT CODE\n:"
        },
        "source_text": "TRS311205\n\nUNIT DESCRIPTOR :\nThis unit of competency deals with the knowledge,\nskills and attitudes in providing effective customer\nservice. It includes greeting customer, identifying\ncustomer needs, delivering service to customer,\nhandling queries through telephone, fax machine,\ninternet and email and handling complaints,\nevaluation and recommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Greet customer\n1.1 Guests are greeted in line with enterprise procedure\n1.2 Verbal and non-verbal communications are appropriate\nto the given situation\n1.3 Non verbal communication of customer is observed\nresponding to customer\n1.4 Sensitivity to cultural and social differences is\ndemonstrated\n2. Identify customer\nneeds\n2.1 Appropriate interpersonal skills are used to ensure\nthat customer needs are accurately identified\n2.2 Customer needs are assessed for urgency so that\npriority for service delivery can be identified\n2.3 Customers are provided with information\n2.4 Personal limitation in addressing customer needs is\nidentified and where appropriate, assistance is sought\nfrom supervisor\n3. Deliver service to\ncustomer\n3.1 Customer needs are promptly attended to in line with\nenterprise procedure\n3.2 Appropriate rapport is maintained with customer to\nenable high quality service delivery\n3.3 Opportunity to enhance the quality of service and\nproducts are taken wherever possible\n\n--- PDF PAGE 26 ---\n________________________________________________\nTR – Photography NC II\n\n22\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Handle queries\nthrough telephone,\nfax machine, internet\nand email\n4.1 Use telephone, computer, fax machine, internet\nefficiently to determine customer requirements\n4.2 Queries/ information are recorded in line with enterprise\nprocedure\n4.3 Queries are acted upon promptly and correctly in line\nwith enterprise procedure\n5. Handle complaints,\nevaluation and\nrecommendations\n5.1 Guests are greeted with a smile and eye-to-eye contact\n5.2 Responsibility for resolving the complaint is taken\nwithin limit of responsibility\n5.3 Nature and details of complaint are established and\nagreed with the customer\n5.4 Appropriate action is taken to resolve the complaint to\nthe customers satisfaction wherever possible\n\n--- PDF PAGE 27 ---\n________________________________________________\nTR – Photography NC II\n\n23\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n 1. Non-verbal\ncommunication\n1.1 body language\n1.2 dress and accessories\n1.3 gestures and mannerisms\n1.4 voice tonality and volume\n1.5 use of space\n1.6 culturally specific communication customs and\npractices\n2. Cultural and social\ndifferences\nIncludes but are not limited to :\n2.1 modes of greeting, farewelling and conversation\n2.2 body language/ use of body gestures\n2.3 formality of language\n3. Interpersonal skills\n3.1 interactive communication\n3.2 public relation\n3.3 good working attitude\n3.4 sincerity\n3.5 pleasant disposition\n3.6 effective communication skills\n4. Customer needs\nCustomer with specific needs may include :\n4.1 those with a disability\n4.2 those with special cultural or language needs\n4.3 unaccompanied children\n4.4 parents with young children\n4.5 pregnant women\n4.6 single women\n5. Enterprise procedure\nProtocol and enterprise procedures may include :\n5.1 modes of greeting and farewell\n5.2 addressing the person by name\n5.3 time-lapse before a response\n5.4 style manual requirements\n5.5 standard letters and proforma\n\n--- PDF PAGE 28 ---\n________________________________________________\nTR – Photography NC II\n\n24\n\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety\npractices\n1.4 Promoted public relation among others\n1.5 Demonstrated familiarity with company facilities,\nproducts and services\n1.6 Applied company rules and standards\n1.7 Applied telephone ethics\n1.8 Applied correct procedure in using telephone, fax\nmachine, internet\n1.9 Handled customer complaints\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with sincerity\n2.2 Safety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3 Attitude\n 2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4 Theory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process and barriers\n3. Underpinning Skills\n3.1 Effective communication skills\n3.2 Non-verbal communication - body language\n3.3 Ability to work calmly and unobtrusively effectively\n3.4 Ability to handle telephone inquiries and\n conversations\n3.5 Correct procedure in handling telephone inquiries\n3.6 Proper way of handling complaints\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 telephone, fax machine, internet, etc.\n4.3\ndata on projects and services; tariff and rates,\npromotional activities in place etc.\n4.3 office supplies\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Written examination\n5.2 Practical demonstration\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2. Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 29 ---\n________________________________________________\nTR – Photography NC II\n\n25\n\nCOMMON COMPETENCIES\n For Visual Arts Sector\n\nUNIT TITLE\n:\nDEVELOP SELF AS AN ARTIST\n\nUNIT CODE\n:"
      }
