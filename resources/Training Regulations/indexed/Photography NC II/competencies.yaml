        "source_title": "DEVELOP SELF AS AN ARTIST",
        "source_text": "--- PDF PAGE 29 ---\n________________________________________________ \nTR – Photography NC II \n \n \n25\n \nCOMMON COMPETENCIES \n                                     For Visual Arts Sector \n \nUNIT TITLE \n: \nDEVELOP SELF AS AN ARTIST \n \nUNIT CODE \n: \nVSA313201 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to exhibit professional practice that \ndescribes development of technical and conceptual \nskills required to work as a practicing artist.  It also \ndeals with communicating effectively and working \nstrategically to achieve planned outcomes as an \nartist. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Acquire and develop \ntechnical skills  \n1.1 \nStrategies for developing self are identified and \nplanned to ensure the development of appropriate \ntechnical skills \n1.2 \nRelevant journals, magazines, catalogues and other \nmedia are used to stimulate technical and \nprofessional development \n1.3 \nCapabilities of materials, tools and equipment are \ntested to develop technical skills \n1.4 \nFeedback, discussion and evaluation opportunities to \ncontinuously improve technical skills are identified \nand used.\n2. Develop conceptual \nskills and ideas \n2.1 \nWork experiences and ideas are discussed with \nothers to improve own practice. \n2.2 \nWork of others are  studied to stimulate conceptual \nand technical skills development  \n2.3 \nOpportunities to develop skills are identified and \nhave participated.\n3. Develop own style \n3.1 \nNew ideas in making and / or interpreting work are \nexplored and experimented. \n3.2 \nTechnology, where appropriate to expand own \npractice is explored and used. \n4. Evaluate own work \n4.1 \nConstructive criticism is sought and applied to \nimprove own work \n4.2 \nWork is evaluated against planned strategy and in the \ncontext of work of others in order to improve own \npractice \n4.3 \nWork processes and practice are adjusted as \nnecessary to improve technical, conceptual and \ncommercial outcomes.\n5. Research work \nopportunities \n5.1 \nNetworks and sources of information relating to \nwork opportunities are correctly identified. \n5.2 \nPromotional opportunities that may helpful in \ndeveloping career opportunities are identified.\n\n--- PDF PAGE 30 ---\n________________________________________________ \nTR – Photography NC II \n \n \n26\n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Strategies for \ndeveloping self   \n1.1 \nWorking effectively with Assessor / Trainor \n1.2 \nParticipating in professional development   \n1.3 \nUndertaking training courses \n1.4 \nPracticing \n1.5 \nParticipating in relevant groups or associations \n1.6 \nExperimenting \n1.7 \nCommunicating with peers \n1.8 \nBeing involved in a range of relevant art making \nactivities\n2. Technical Skills \n2.1 \nPainting and drawing \n2.2 \nPhotography \n2.3 \nSculpture \n2.4 \nFiber / textile arts, including paper making / paper \ncasting \n2.5 \nCeramics \n2.6 \nJewelry \n2.7 \nDesigning and making three dimensional objects \n2.8 \nVideo \n2.9 \nPrintmaking \n2.10 Information Technology, including relevant hardware \nand software\n3. Opportunities to \ndevelop skills \n3.1 \nExhibitions \n3.2 \nLectures, seminars, conferences, symposiums \n3.3 \nFloor talks at galleries \n3.4 \nCompetitions \n3.5 \nMaster classes \n3.6\nProfessional organizations\n4. Networks and \nSources of \nInformation \n4.1 \nNetworks \n4.1.1 Professional associations \n4.1.2 Alumni organizations \n4.1.3 Community organizations \n4.1.4 Colleagues and teachers \n4.2 \nSources of Information \n4.2.1 Gallery listings \n4.2.2 Job advertisements \n4.2.3 Websites \n4.2.4 Word of mouth \n4.2.5 Art journals \n4.2.6 Exhibition catalogues and program\n5. Promotional \nopportunities \n5.1 \nCompetitions \n5.2 \nExhibitions \n5.3 \nCommunity events \n5.4 \nParticipation on websites \n5.5 \nMembership of specialization-specific organization \n5.6\nApplications to funding bodies\n\n--- PDF PAGE 31 ---\n________________________________________________ \nTR – Photography NC II \n \n \n27\nEVIDENCE GUIDE \n \n1. Critical aspects of  \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nApplied strategies to develop appropriate skills in art \npractice \n1.2 \nUsed discussion and evaluation opportunities to \ndevelop technical and conceptual skills \n1.3 \nDemonstrated work practice that develops own style \nthrough exploring and experimenting with new ideas \nin making and / or interpreing work \n2. Underpinning \nknowledge \n \n2.1 \nKnowledge about theoretical and historical contexts \nrelevant to the area(s) of specialization(s) \n2.2 \nElements and principles of design \n2.3 \nPhysical properties and capabilities of material, tools \nand equipment and their application \n2.4 \nAwareness of copyright, moral rights and intellectual \nproperty issues related to the development of self as \nartist \n2.5 \nSources of information relating to work opportunities \nand career planning   \n2.6\nVisual arts and contemporary craft\n3. Underpinning skills \n3.1 \nLiteracy skills sufficient to interpret information and \ncommunicate ideas \n3.2 \nDiscerning and listening to advice from colleagues, \nexperts and audiences\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1. \nSpecialized materials, tools and equipment required \nfor each area of specialization and used to develop \ntechnical and conceptual skills relevant to art making \npractice \n4.2. \nInformation about relevant artist, their work, ideas \nand techniques\n5. Method of \nassessment \n \nCompetency must be assessed through: \n4.1 \nObservation / Demonstration with oral questioning \n4.2 \nPortfolio \n4.3\nThird party report\n6. Context for \nassessment \n6.1. \nCompetency may be assessed in the work place or in \na simulated work place setting.\n",
