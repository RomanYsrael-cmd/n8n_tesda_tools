        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared photo images and needed materials for\nfinal packaging\n1.2\nApplied finishing touches and packaged finished\nproducts\n1.3\nHandled properly finished products\n2. Underpinning\nknowledge and\nattitudes\n\n2.1.\nKnowledge on different packaging materials and their\ncharacteristics\n2.2.\nSources of these packaging materials\n2.3.\nProcess of documentation, e.g. pricing and deadlines\n2.4.\nCustomer service\n2.5.\nKnowledge on available software and other\nmultimedia tools\n3. Underpinning skills\n3.1.\n Communication and negotiation skills\n3.2.\n Interpersonal skills\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1.\nFinished Product\n4.2.\nSoftware\n4.3.\nPackaging Materials\n5. Method of\nassessment\n\nCompetency must be assessed through:\n5.1.\nDemonstration with oral questioning\n5.2.\nInterview\n5.3.\nPortfolio\n6. Context for\nassessment\n6.1.\nThe assessment must provide for practical\ndemonstration of skills in presenting finished products\nusing available software and packaging materials\n\n--- PDF PAGE 52 ---\n________________________________________________\nTR – Photography NC II\n\n48"
