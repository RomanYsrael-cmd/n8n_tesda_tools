        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCompleted trainings and career opportunities which\nare based on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n2. Underpinning\nknowledge and\nattitude\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender\nsensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context for\nassessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 15 ---\n________________________________________________\nTR – Photography NC II\n\n11\n\nUNIT OF COMPETENCY:\nPRACTICE\nOCCUPATIONAL\nHEALTH\nAND\nSAFETY PROCEDURES\n\nUNIT CODE\n:"
