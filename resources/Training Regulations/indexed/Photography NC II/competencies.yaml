          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Selected and used hardware components correctly\nand according to the task requirement\n1.2 Identified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3 Produced accurate and complete data in\naccordance with the requirements\n1.4 Used appropriate devices and procedures to\ntransfer files/data accurately\n1.5 Maintained computer system\n2. Underpinning\nKnowledge\n2.1 Basic ergonomics of keyboard and computer use\n2.2 Main types of computers and basic features of\ndifferent operating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n3. Underpinning Skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Computer hardware with peripherals\n4.2 Appropriate software\n5. Methods of\nAssessment\nCompetency must be assessed through:\n4.1 Observation\n4.2 Questioning\n4.3 Practical demonstration\n6. Context for\nAssessment\n6.1 Assessment may be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 25 ---\n________________________________________________\nTR – Photography NC II\n\n21\n\nUNIT OF COMPETENCY: PROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n\n:"
        },
        "source_text": "TRS311203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nand values needed to perform computer operations\nwhich includes inputting, accessing, producing and\ntransferring data using the appropriate hardware\nand software\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be\nundertaken\n1.1 Requirements of task are determined as per standard\noperating procedures\n1.2 Appropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3 Task is planned to ensure OH & S guidelines and\nprocedures are followed\n2. Input data into\ncomputer\n2.1 Data are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2 Accuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3 Inputted data are stored in storage media according to\nrequirements\n2.4 Work is performed within ergonomic guidelines\n3. Access information\nusing computer\n3.1 Correct program/application is selected based on job\nrequirements\n3.2 Program/application containing the information required\nis accessed according to company procedures\n3.3 Desktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4 Keyboard techniques are carried out in line with OH & S\nrequirements for safe use of keyboards\n\n--- PDF PAGE 22 ---\n________________________________________________\nTR – Photography NC II\n\n18\n\n4. Produce/output data\nusing computer\nsystem\n4.1 Entered data are processed using appropriate software\ncommands\n4.2 Data are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3 Files and data are transferred between compatible\nsystems using computer software, hardware/ peripheral\ndevices in accordance with standard operating\nprocedures\n5. Maintain computer\nequipment and\nsystems\n5.1 Systems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2 Procedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3 Basic file maintenance procedures are implemented in\nline with the standard operating procedures\n\n--- PDF PAGE 23 ---\n________________________________________________\nTR – Photography NC II\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n2. Software\nSoftware includes the following but not limited to:\n2.1 Word processing packages\n2.2 Data base packages\n2.3 Internet\n2.4 Spreadsheets\n3. OH & S guidelines\n3.1 OHS guidelines\n3.2 Enterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1 diskettes\n4.2 CDs\n4.3 zip disks\n4.4 hard disk drives, local and remote\n5. Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5 Visual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1 directories/folders\n6.2 files\n6.3 network devices\n6.4 recycle bin\n7. Maintenance\n7.1 Creating more space in the hard disk\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7 Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 24 ---\n________________________________________________\nTR – Photography NC II\n\n20\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 Selected and used hardware components correctly\nand according to the task requirement\n1.2 Identified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3 Produced accurate and complete data in\naccordance with the requirements\n1.4 Used appropriate devices and procedures to\ntransfer files/data accurately\n1.5 Maintained computer system\n2. Underpinning\nKnowledge\n2.1 Basic ergonomics of keyboard and computer use\n2.2 Main types of computers and basic features of\ndifferent operating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n3. Underpinning Skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills\n4 Resource\nimplications\nThe following resources MUST be provided:\n4.1 Computer hardware with peripherals\n4.2 Appropriate software\n5. Methods of\nAssessment\nCompetency must be assessed through:\n4.1 Observation\n4.2 Questioning\n4.3 Practical demonstration\n6. Context for\nAssessment\n6.1 Assessment may be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 25 ---\n________________________________________________\nTR – Photography NC II\n\n21\n\nUNIT OF COMPETENCY: PROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n\n:"
