        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSelected appropriate camera and lighting\nequipment and associated accessories for specified\nsubjects\n1.2\nApplied range of lighting techniques for the\nspecified subjects\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nKnowledge of the ways in which a typical photo\nimaging studio is organized and practiced\n2.2\nKnowledge of electromagnetic spectrum, color\ntemperature and color synthesis\n2.3\nKnowledge of photo imaging, lighting, including\nterminology and identification\n2.4\nKnowledge of the ways in which light sensitive\nmaterials, including films and digital sensors,\nrespond to light\n2.5\nknowledge of the implications of light on exposure\nor light sensitive media\n2.6\nKnowledge of physical properties and capabilities of\nthe camera systems and lighting equipment used in\nthe exposure of photographic film and digital\nsensors\n2.7\nOccupational health and safety issues and\nprocedures associated with lighting\n2.8\nKnowledge of elements and principles of design\n2.9\nKnowledge of other photographers, their work,\nideas and techniques specially pertaining to lighting\n3 Underpinning skills\n3.1\nLiteracy skills sufficient to read and interpret written\ninstructions, safety labels and procedures\n3.2\nNumeracy skills sufficient to interpret technical\ncharts and diagrams pertaining to a range of lighting\nprocedures and techniques\n4 Resource\nimplications\nThe following resources MUST be provided\n4.1.\nStudio with complete lighting system\n4.2.\nMaterials, resources and equipment needed to\nselect, set up, adjust and apply camera and lighting\nsystems\n5. Method of\nassessment\n\nCompetency must be assessed through:\n5.1.\nDemonstration with oral questioning\n5.2.\nInterview\n5.3.\nPortfolio\n6.\nContext for\nassessment\n6.1\nThe assessment must provide for project or work\nactivities that would allow the candidate to select\nand apply a range of lighting techniques for\nspecified subjects\n\n--- PDF PAGE 44 ---\n________________________________________________\nTR – Photography NC II\n\n40\n\nUNIT COMPETENCY\n:\nPERFORM POST CAPTURE PROCESSING\n\nUNIT CODE\n:"
        },
        "source_text": "VSA313302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to employ lighting techniques to a wide\nrange of subjects in different situations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1. Plan lighting\nrequirements\n\n1.1 Required lighting characteristics for the subject and\npurpose of image are correctly identified.\n1.2 Lighting equipment for the purpose are selected\nappropriately\n2. Prepare specific work\nenvironment\n2.1 Work Environment that meets requirements for the\nproduction of work is selected appropriately\n2.2 Relevant camera systems and accessories for the\nwork are selected and used.\n2.3 Lighting system is correctly assembled in accordance\nwith work requirements\n2.4 Required safety aspects of the lighting set up and\ncabling are implemented.\n3. Light the subject\n3.1 Lighting techniques are tested to suit the purpose of\nwork\n3.2 Qualities of light is adjusted, modified and\ncalibrated to suit subject.\n3.3 Exposure is calculated to determine subject\nconsistency with the purpose of photography\n4. Capture image\n4.1 Images are captured using film or digital\n4.2 Captured images based on work requirements are\nreviewed and appropriate actions are taken, if\nnecessary.\n5. Restore work\nenvironment and\nequipment\n5.1. Work environment is restored after use as per\nestablished practice\n5.2. Equipment is cleaned and maintained in accordance\nwith manufacturers’ instructions\n5.3. Equipment and materials are stored safely as per\nworkplace procedures.\n\n--- PDF PAGE 41 ---\n________________________________________________\nTR – Photography NC II\n\n37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work environment\n1.1.\nElectricity\n1.2.\nNatural and artificial lights\n1.3.\nVentilation\n1.4.\nDust free environment\n1.5.\nWork tables and storage areas and facilities\n1.6.\nPortable generator\n1.7.\nOther portable equipment and materials, e.g.\nbackground, tripods and reflectors\n1.8.\nChairs, stools, posing tables\n1.9.\nChanging room / Make-up room\n1.10. Running water\n1.11. Kitchen equipment set-up\n2. Subject\n2.1 Nature, e.g. landscape, seascape, flowers,\n2.2 Still life, e.g. glassware\n2.3 Scientific / medical / technical\n2.4 Photo-documentary, e.g. social and corporate\nevents\n2.5 Portraiture\n2.6\n Product and Food\n3. Camera systems\nand accessories\n3.1.\n35 mm SLR camera\n3.2.\n120 camera, view camera\n3.3.\nDigital SLR cameras and digital back\n3.4.\nFilm and media\n3.5.\nRange of lenses\n3.6.\nCable release\n3.7.\nTripods and lightstands\n3.8.\nLight meter\n3.9.\nFilters and color gels\n3.10. Batteries, chargers and flashlights\n3.11. Laptop, compact drives and card readers\n4. Lighting equipment\nand techniques\n4.1\nLight sources\n4.1.1 Natural light, e.g. sunlight, moonlight\n4.1.2 Candle light and other ambient low light\nsources\n4.1.3 Incandescent, tungsten, photoflood\n4.1.4 Fluorescent lighting\n4.1.5 Halogen and quartz\n4.1.6 Ultraviolet and infra-red\n4.1.7 Mercury vapor light\n4.1.8 Electron 16 flash\n\n4.2\nEquipment\n4.2.1 Portable photoflood and tungsten light systems\n4.2.2 Portable electronic flash\n4.2.3 Portable monobloc type system\n4.2.4 Floor pack electronic flash system\n\n--- PDF PAGE 42 ---\n________________________________________________\nTR – Photography NC II\n\n38\nVARIABLE\nRANGE\n4.2.5 Lighting modifying devices, including scrims,\numbrellas, honeycombs and grids, soft boxes,\nreflectors, light absorbers\n4.2.6 Gobo\n4.2.7 Fiber optics\n4.2.8 Portable HMI or fluorescent light\n\n4.3.\nLight sensitive materials\n4.5.1 Different types of film and electronic sensors\n4.5.2 Response of light sensitive material to\ndifferent color of light source\n\n4.6 Techniques\n4.6.1\nAmbient light and fill-in flash\n4.6.2\nPainting with light\n4.6.3\nFeathering the light\n4.6.4 Lighting glassware, metallic\nobjects,translucent and textured surfaces\n4.6.5\nBackground effects\n4.6.6 Combined lighting and the illusion of\nmovement\n4.6.7 White balance and custom color optimization\nfor electronic sensors\n4.6.8 Various lighting patterns\n4.6.9 High key and low key lighting\n5. Adjusting and / or\ncalibrating camera\nsetting for lighting\n5.1\nShutter speed\n5.2\nAperture\n5.3\nLens focal length\n5.4\nISO setting\n5.5\nWhite balance (Digital)\n5.6\nJPEG and or Raw (Digital)\n5.7\nImage Quality and other Parameter setting (Digital)\n6. Exposure\n6.1. Incident / reflective readings\n6.2. Lighting ratio and brightness range readings\n6.3. Grey card readings\n6.4. Spot, center weighted, matrix, meter readings\n6.5. Histogram readings\n6.6.\nOff the film plane metering (TTL & OTF metering)\n\n--- PDF PAGE 43 ---\n________________________________________________\nTR – Photography NC II\n\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSelected appropriate camera and lighting\nequipment and associated accessories for specified\nsubjects\n1.2\nApplied range of lighting techniques for the\nspecified subjects\n2. Underpinning\nknowledge and\nattitudes\n\n2.1\nKnowledge of the ways in which a typical photo\nimaging studio is organized and practiced\n2.2\nKnowledge of electromagnetic spectrum, color\ntemperature and color synthesis\n2.3\nKnowledge of photo imaging, lighting, including\nterminology and identification\n2.4\nKnowledge of the ways in which light sensitive\nmaterials, including films and digital sensors,\nrespond to light\n2.5\nknowledge of the implications of light on exposure\nor light sensitive media\n2.6\nKnowledge of physical properties and capabilities of\nthe camera systems and lighting equipment used in\nthe exposure of photographic film and digital\nsensors\n2.7\nOccupational health and safety issues and\nprocedures associated with lighting\n2.8\nKnowledge of elements and principles of design\n2.9\nKnowledge of other photographers, their work,\nideas and techniques specially pertaining to lighting\n3 Underpinning skills\n3.1\nLiteracy skills sufficient to read and interpret written\ninstructions, safety labels and procedures\n3.2\nNumeracy skills sufficient to interpret technical\ncharts and diagrams pertaining to a range of lighting\nprocedures and techniques\n4 Resource\nimplications\nThe following resources MUST be provided\n4.1.\nStudio with complete lighting system\n4.2.\nMaterials, resources and equipment needed to\nselect, set up, adjust and apply camera and lighting\nsystems\n5. Method of\nassessment\n\nCompetency must be assessed through:\n5.1.\nDemonstration with oral questioning\n5.2.\nInterview\n5.3.\nPortfolio\n6.\nContext for\nassessment\n6.1\nThe assessment must provide for project or work\nactivities that would allow the candidate to select\nand apply a range of lighting techniques for\nspecified subjects\n\n--- PDF PAGE 44 ---\n________________________________________________\nTR – Photography NC II\n\n40\n\nUNIT COMPETENCY\n:\nPERFORM POST CAPTURE PROCESSING\n\nUNIT CODE\n:"
