        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate :\n1.1 Interpreted creative and technical requirements and\nprovided additional ideas in order to produce the\ndesired style of captured images\n1.2 Applied knowledge of photographic principles\n1.3 Demonstrated technical knowledge in the use of range\nof cameras\n1.4\nRestored equipment and materials safely\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Interpretation of creative requirements to technical\noperation\n2.2 Range of cameras and operational functions\n2.3 Framing techniques and methods of composition\n2.4 Lens theory and application\n2.5 Shutter speeds and Aperture settings\n2.6 Handling customers relationship\n3. Underpinning skills\n3.1 Using depth of field tables and methods of calculation\ninvolved in determining correct f/stop\n3.2\nUsing different types of light measuring devices\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Range of cameras\n4.2 Studio with lighting systems\n4.3 Subject\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Interview\n5.3. Portfolio\n6. Context for\nassessment\n6.1 Competency maybe assessed on the job due to the\nspecific workplace environment requirements.\nHowever, it can be undertaken in a closely simulated\nworkplace environment that reproduces all the required\nelements.\n\n--- PDF PAGE 40 ---\n________________________________________________\nTR – Photography NC II\n\n36\n\nUNIT COMPETENCY\n:\nSET UP STUDIO LIGHTS, EQUIPMENT AND\nACCESSORIES\n\nUNIT CODE\n:"
        },
        "source_text": "VSA313301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to operate camera, position the camera,\nselect appropriate lens and compose the shots to\nachieve the required image.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1. Operate the camera\n1.1.\nCamera is identified and selected appropriately for\nspecific purpose\n1.2.\nCamera is operated safely in accordance with\nmanufacturer’s instruction\n2. Select and use lens\n2.1.\nLenses are selected according to technical and\nsubject requirement.\n2.2.\nFocusing techniques of lens are applied.\n3. Address lighting\nand exposure\n3.1.\nQuality and quantity of available lights are assessed\nto determine appropriate exposure and lighting effect.\n3.2.\nCorrective actions are taken to address changing or\ninadequate lighting conditions.\n4. Compose a subject\n4.1.\nSubject is identified and visualized according to\ngraphic elements and rules of composition\n4.2.\nSubject is composed to meet aesthetic requirements\nand provided the correct visual interpretation of work\nrequirements\n\n--- PDF PAGE 36 ---\n________________________________________________\nTR – Photography NC II\n\n32\n\n5. Experiment with\ntechniques to\ncapture\nphotographic\nimages\n5.1.\nTechniques are appropriately identified and selected\nfor the photographic subject matter\n5.2.\nControls are selected and use to effect image\ncapture and to ensure correct exposure\n5.3.\nTechniques are tested to achieve changes to subject\nappearance as required\n5.4. Corrective filters are selected and used to meet the\ncreative and technical requirements of the shots\n5.5. Corrective filters are used to ensure that color\nbalance and light conditions are attained\n6. Review images\n6.1.\nImages are viewed from the camera LCD, computer\nor TV monitor.\n6.2. Results are evaluated to ensure correct exposure and\nthe desired outcome for the subject matter.\n6.3.\nImages are stored in the storage media.\n7. Restore equipment\n7.1.\nEquipment is cleaned after use as per manufacturers’\ninstruction.\n7.2.\nEquipment and materials are stored in accordance\nwith workplace procedures\n\n--- PDF PAGE 37 ---\n________________________________________________\nTR – Photography NC II\n\n33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nShots\n1.1 Extreme close up\n1.2 Close up\n1.3 Mid shot\n1.4 Long shot\n1.5 Wide shot\n1.6 High angle\n1.7 Eye level shot\n1.8 Low angle\n1.9 Establishing or master shot\n1.10 Point of view shot\n1.11 Camera Panning\n2.\nLenses\n2.1 Standard lens\n2.2 Telephoto lens\n2.3 Wide Angle lens\n2.4 Variable focal length\n2.5 Fixed focal length\n2.6 Macro / Micro lens\n2.7 Shift lens\n2.8 Fisheye lens\n\nPerformance characteristics of lenses may include :\n2.9 Resolution\n2.10 Contrast\n2.11 Image shift\n2.12 Sharpness\n2.13 Zoom\n2.14 Mechanical Operation\n2.15 Focal Length\n2.16 Maximum Aperture\n3.\nGraphic elements\n3.1 Lines\n3.2 Shapes\n3.3 Texture\n3.4 Color\n3.5 Tones\n4. Operation of camera\n4.1 Hand held operation\n4.2 Fixed / supported camera\n5. Filters\n5.1 Color correction\n5.2 Contrast filters for black and white\n5.3 Graduated, neutral density\n5.4 Ultraviolet or skylight\n5.5 Polarizing\n5.6 Special effects\n5.7 Enhancers\n5.8 Color balancing filters\n\n--- PDF PAGE 38 ---\n________________________________________________\nTR – Photography NC II\n\n34\n\nVARIABLE\nRANGE\n6.\nCameras\n6.1\n35 mm –SLR -RF\n6.2\nDigital SLR\n6.3\nMedium Format – SLR –TLR, RF\n6.4\nLarge Format\n6.4.1 Monorail\n6. Equipment and\nmaterials\n6.1.\n35 mm SLR and digital equivalent\n6.2.\nFilm suitable for the nominated techniques ( black\nand white, color or digital media)\n6.3.\nLenses covering different focal lengths\n6.4.\nTripod\n6.5.\nCable release / R Control\n6.6.\nFilters\n6.7.\nLens hoods\n6.8.\nSheet film\n7. Subject matter\n7.1.\nPeople\n7.2.\nStill life / Product\n7.3.\nEnvironment\n8. Controls\n8.1.\nAperture\n8.2.\nShutter speed\n8.3.\nFocal length of lenses\n9. Techniques to\ncapture photographic\nimage\n9.1.\nShutter speed\n9.1.1. Freeze motion\n9.1.2. Panning\n9.1.3. Time exposure\n9.1.4. Slow shutter speeds and moving subjects\n9.2.\nAperture\n9.2.1. Depth of field (maximum and minimum)\n9.2.2. Effect of different focal lengths on depth of field\n9.3.\nPerspective\n9.3.1. Stretched perspective\n9.3.2. Normal perspective\n9.3.3. Compressed perspective\n9.4.\nExposure meter techniques\n9.4.1. Reflected\n9.4.2. Incident\n10. Process and output\nmay refer to\n10.1. Photographic film developing and printing\n10.2. Digital image processing and output\n\n--- PDF PAGE 39 ---\n________________________________________________\nTR – Photography NC II\n\n35\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate :\n1.1 Interpreted creative and technical requirements and\nprovided additional ideas in order to produce the\ndesired style of captured images\n1.2 Applied knowledge of photographic principles\n1.3 Demonstrated technical knowledge in the use of range\nof cameras\n1.4\nRestored equipment and materials safely\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Interpretation of creative requirements to technical\noperation\n2.2 Range of cameras and operational functions\n2.3 Framing techniques and methods of composition\n2.4 Lens theory and application\n2.5 Shutter speeds and Aperture settings\n2.6 Handling customers relationship\n3. Underpinning skills\n3.1 Using depth of field tables and methods of calculation\ninvolved in determining correct f/stop\n3.2\nUsing different types of light measuring devices\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Range of cameras\n4.2 Studio with lighting systems\n4.3 Subject\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Interview\n5.3. Portfolio\n6. Context for\nassessment\n6.1 Competency maybe assessed on the job due to the\nspecific workplace environment requirements.\nHowever, it can be undertaken in a closely simulated\nworkplace environment that reproduces all the required\nelements.\n\n--- PDF PAGE 40 ---\n________________________________________________\nTR – Photography NC II\n\n36\n\nUNIT COMPETENCY\n:\nSET UP STUDIO LIGHTS, EQUIPMENT AND\nACCESSORIES\n\nUNIT CODE\n:"
