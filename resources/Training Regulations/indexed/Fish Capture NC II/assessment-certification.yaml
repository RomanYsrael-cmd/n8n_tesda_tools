orm of engine. This term also applied to a larger boats built to navigate rivers and inland waters. • Capstan – a machine for moving or raising heavy weights and consist of a vertical drum that can be rotated and around which cable is turned • Deck – a platform in a ship that is structural element and forming the floor for its compartment • Deckhand– a seaman who perform manual and other duties on board a vessel • Fish capture – the taking of fishery species by passive or active gear for trade, business or profit beyond subsistence or sport fishing and classified further as follows: Small scale commercial fishing – fishing utilizing fishing vessels of 3.1 gross tons (GT) up to 20 GT Medium scale commercial fishing – fishing utilizing fishing vessels of 20.1 GT up to 150 GT; and Large scale commercial fishing – fishing utilizing fishing vessel of more than 150 GT Fishing gear – fishing equipment and paraphernalia • Fish fighting equipment – equipment use to extinguish fire as per type. • Fish trap – Locally called panggal, is a set trap or enticing device made of bamboo or rattan which is a regular. Usually rectangular, receptacle preventing escape of fishy by means of trap doors or tricky passageways. Trapped fish may be collected at regular intervals, in terms of days or week. • Gill / Mesh Net – variously sized entangling net in which capture of fish is by the gilling effected by the actual meshes of the net. With small buoys and small weights, the net is positioned either as bottom set or drifting. This is commonly referred to by loacals as pukot- doble, pukot-triple, pukot paapong (with light). • Hitch– any of various knots used to form a temporary noose in a line or to secure a line temporarily to an object • Knot – the interlacement of the parts of one or more flexible bodies forming a ump or knob • Life saving appliances – are outfits designed for life preservation • Mooring – a act of making fast a boat with lines or anchor • Municipal Fisherman – a person who is directly or indirectly engaged in fishing and other --- PDF PAGE 171 --- TR - Fish Capture NC II - 167 - related fishing activities within municipal waters using fishing vessels of three (3) gross tons or less. • Municipal Waters – include not only streams, lakes, inland bodies of water and tidal waters within the municipality which are not included within the protected areas as defined under Republic Act No. 7856 (The NIPAS Law), public forest, timber lands, forest reserves or fishery reserves, but also marine waters included between two (2) lines drawn perpendicular to the general coastline from points where the boundary lines of the municipality touch the sea at low tide and a third line parallel with the general coastline including offshore island and fifteen (15) kilometers from such coastline. Where two (2) municipalities are so situated on opposite shores that there is less than thirty (30) kilometers of marine waters between them, the third line shall be equally distant from the opposite shore of the respective municipalities ( RA 8550, Philippine Fisheries Code of 1997) • Netting – fishing gear component made of open meshed fabric • Seaworthiness – refers to the ability of a boat / ship to withstand the action of the sea, wind and weather • Single hook and line – also called simple hand line or drop line. A single vertical line carrying one or two barbed baited hooks and worked simply by dropping into the water and waiting for a fish to bite. Generic local name is pasol or subid. Also called by various names, most often after the most dominant species in the catch, such as manubid-pamarilis, pambaca, pamirit, pangaraw, palutao (ulang), pamato, pamariles ( deep-sea pangtangigue, pawin, subid, undak (with light). Hook sizes range from #06-#20 to #566-#571 while filament size varies from nylon #8 to #190. • Winch – any of various machines or instruments for pulling or hauling, with one or more drums on which to coil a rope, cable or chain. • Windlass - a steam or electric winch with horizontal or vertical shaft and two drums used to raise a ship’s anchor. --- PDF PAGE 172 --- --- PDF PAGE 173 --- --- PDF PAGE 174 --- --- PDF PAGE 175 --- The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL ADVISORY PANEL (TAP) Dr. RODOLFO P. ESTIGOY Mr. ALEJANDRO T. ESCANO Chief President Bureau of Post Harvest Research and Extension • Central Luzon State University, Science City of Muñoz, Nueva Ecija Philippine Chamber of Agriculture and Food (PCAFI) MFI Bldg. Otigas Avenue Extension, Pasig City Mr. EDWIN ANDOT Dr. ALMA M. DELA CRUZ President Chamber of Agriculture, Fisheries and Food in Northern Mindanao 2nd floor, United Way Bldg. Capitol Cmpd., Cagayan de Oro City Professor Central Luzon State University Muñoz, Nueva Ecija • THE TECHNICAL EXPERT PANEL (TEP) Ms. FELY LIM Mr. KENT A. DEQUITO. Executive Director (SOCOPA) SOCSKSARGEN Federation of Marine Biologist / Aquaculturist Office of the Porvincial Agricultural Fishing and Allied Industries, Inc. (SFFAII) / SECAFF Officer (OPAG) Alabel, Sarangani Province MR. ROGELIO NODORA Mr. ROGELIO C. GENSAVA Port Captain Damalerio Group of Companies Talisay, Tambler, Gen. Santos City Amadeo Fishing Corp. Marang St., Calumpang, Gen. Santos Engr. ROMAN CASTRO Mr. EDWIN G. FORONES Officer-In-Charge Maritime Industry Authority San Andres Fishing Industry MARINA – Region XII Mr. ELIAS RODRIGO SR. Mr. JOHNNY D. PANERIO Port Captain RD Fishing Industry, Inc. Municipal FARMC Member / Fisherman OMAG- Alabel, Sarangani Province Mr. APOLINARIO A. MOSQUEDA. Mr. ABEL ALINO Fisherman / Operator Municipal FARMC Lomuyon, Kiamba, Sarangai Province Material Coordinator RD Fishing Industry, Inc. Ms. EDNA V. AGUJA Mr. JAIME S. NAVARRO, JR. Municipal Agric