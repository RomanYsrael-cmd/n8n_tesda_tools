  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for FISH CAPTURE (Municipal Fisherman) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FISH CAPTURE (Municipal Fisherman)\nNC Level: NC II\n\nNominal Training Duration: 318 Hours\n\nCourse Description:\n\nThis course is design to enhance the knowledge, skills and attitudes in FISH CAPTURE\n(Municipal Fisherman) NC II in accordance with industry standards. It covers Basic, Common\nand Core Competencies.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n18 Hours\n\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace information\n1.2. Complete relevant work\nrelated documents\n1.3. Participate in workplace\nmeeting and discussion\n Group\ndiscussion\n Interaction\n\n Written test\n Practical/\nperformance\ntest\n Interview\n2. Work in a team\nenvironment\n2.1. Describe and identify team\nrole and responsibility in a\nteam.\n2.2. Describe work as a team\nmember.\n Group\ndiscussion\n Interaction\n\n Observation\n Simulation\n Role playing\n3. Practice career\nprofessionalism\n3.1. Integrate personal\nobjectives with\norganizational goals\n3.2. Set and meet work\nproblems\n3.3. Maintain professional\ngrowth and development\n Group\ndiscussion\n Interaction\n Demonstration\n Observation\n Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1. Evaluate hazards and risks\n4.2. Control hazards and risks\n4.3. Maintain occupational\nhealth and safety\nawareness\n Group\ndiscussion\n Plant tour\n Symposium\n Observation\n Interviews\n\n--- PDF PAGE 155 ---\nTR- Fish Capture NC II\n\n- 151 -\nCOMMON COMPETENCIES\n14 Hours\n\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Apply safety\nmeasures in\noperations\n1.1. Determine areas of concern\nfor safety measures\n1. 2. Apply appropriate safety\nmeasures\n1. 3. Safekeep/maintain/ dispose\ntools, materials and outfit.\nSelf-paced/ modular\n Lecture/ Discussion\n Interaction\n Practical\nDemonstration\nVisit/tour\nOral/Written\nInterviews\n Direct\nObservation\n Practical\nDemonstration\n2. Use farm\ntools and\nequipment\n2.1. Prepare and use farm tools\n2.2. Prepare and operate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\nSelf-paced/ modular\n Lecture/ Discussion\n Interaction\n Practical\nDemonstration\n Visit/tour\nOral/Written\nInterviews\n Direct\nObservation\n Practical\nDemonstration\n3. Perform\nestimation\nand basic\ncalculation\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n3.3. Apply corrective measures\nas necessary\nSelf-paced/ modular\n Lecture/ Discussion\n Interaction\n Practical Exercise\nOral/Written\nexamination\n Practical\nexercise\n\nMARITIME COMMON COMPETENCIES\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Prevent and\nfight fire\n1.1\nImplement fire prevention\nmeasures and procedures on\nboard a vessel.\n1.2\nCheck the capability of fire\ndetection and fire fighting\nequipment and system.\n1.3\nInitiate any required\nmaintenance\n1.4\nSimulate on board fire fighting\nand search and rescue\nactivities\n1.5\nImplement OHS principles and\npolicies when carrying out fire\nfighting duties\n1.6. Communicate effectively with\nothers during fire emergencies\nDiscussion\n Lecture\n Demonstration\n Simulation\nObservation\n Demonstration\n Practical\nperformance\n\n2. Protect\nmarine\nenvironment\n2.1\nSimulate garbage disposal\nprocedures\n2.2\nSimulate garbage segregation\n2.3. Record garbage segregation\nand disposal\nDiscussion\n Lecture\n Demonstration\n Simulation\n\nObservation\n Demonstration\n Practical\nperformance\n3. Comply with\nemergency\nprocedures\n3.1\nSimulate correct action on\nbecoming aware of an\nemergency in accordance with\nvessel procedures\n3.2\nSimulate emergency\nprocedures and contingency\nplans\n3.3. Simulate procedures for the use\nof various survival equipment\nDiscussion\n Lecture\n Demonstration\n Simulation\n\nObservation\n Demonstration\n Practical\nperformance\n\n--- PDF PAGE 156 ---\nTR- Fish Capture NC II\n\n- 152 -\nCORE COMPETENCIES\n286 Hours\n\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nVessel Operations\n1. Operate a\nvessel of up to\n3 GT\n1.1. Prepare the small vessel for\nuse.\n1.2. Apply safety precautionary\nmeasures in operating vessel\nup to 3 GT.\n1.3. Manoeuvre a small vessel\nwhile engaged in common\ntasks.\n1.4. Maintain a small vessel\n1.5\nRepair and maintain a small\nvessel, materials, tools, and\nequipment.\n1.6. Store and secure a small\nvessel, materials, tools and\nequipment\n1.7. Make report on work carried\nout.\n Lecture\n Discussion\n Practical\nDemonstration\n Field Trips\n Exercises\n Operational\nReadiness\nEvaluation\n(ORE)/drills\n Oral interview\n Written\nexamination\n2. Monitor\ncondition and\nseaworthiness\nof a vessel\n2.1. Monitor and evaluate the\ncondition and seaworthiness\nof a small vessel under\nnormal and emergency\nsituations\n2.2. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures during inspection\nand maintenance operations\n2.3. Report and take appropriate\npreventive and\nremedial(repair) action to\nmaintain the security and\nwatertight integrity of the\nvessel’s hull\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Practical\ndemonstration\n Direct\nobservation\n Oral interview\n Questioning\n3. Perform routine\nmaintenance\ntasks on a\nsmall coastal\nvessel\n\n3.1. Prepare materials, tools and\nequipment.\n3.2. Perform basic deck\nmaintenance\n3.3. Carry out cleaning activities\n3.4. Select and apply appropriate\npaint systems for areas\naboard a vessel\n3.5. Report and take appropriate\nremedial action on problems\nin paint applications.\n3.6. Check and perform basic\nmaintenance on deck fittings,\nequipment and systems\n3.7. Exercise all required safety,\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n Oral interview\n Practical\ndemonstration\n Direct\nobservation\n Practical\nassignments\n\n--- PDF PAGE 157 ---\nTR- Fish Capture NC II\n\n- 153 -\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nenvironmental and hazard\ncontrol precautions and\nprocedures\n3.8. Repair and maintain\nmaterials, tools and\nequipment\n3.9. Store and secure materials,\ntools and equipment\n3.10. Make report on work carried\nout.\n4. Operate and\ntroubleshoot low\npowered marine\ndiesel engines\n4.1. Ensure that preparations for\nthe operations are complete\n4.2. Operate, initiate start up and\nshut down operations of low\npowered diesel engines\n4.3. Maintain output of low\npowered diesel engines\n4.4. Maintain steady running of\nthe engine and comply with\nalarm acceptance\nprocedures\n4.5. Carry out adjustment and\nregulation of engine,\nincluding to achieve optimal\nfuel efficiency\n4.6. Carry out alteration of output\nas required\n4.7. Respond to irregularities\n4.8. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n4.9. Troubleshoot engine faults\nand perform minor repair\n4.10. Make report on work carried-\nout.\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n Oral interview\n Direct\nobservation\n Operational\nreadiness\nevaluation\n5. Apply weather\ninformation\nwhen\nnavigating a\nvessel\n5.1. Obtain and decipher weather\nand oceanic information\n5.2. Apply weather and\noceanographic data to safe\nnavigation\n5.3. Maintain records of weather\noceanographic information\nand forecasts\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Practical\ndemonstration\n Direct\nobservation\n Oral interview\n Questioning\n6. Contribute to\nsafe navigation\n6.1. Contribute to monitoring and\ncontrolling a navigational\nwatch\n6.2. Maneuver the vessel\n6.3. Exercise all required safety\nand hazard control\nprocedures\n6.4. Identified typical problems\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Practical\ndemonstration\n Direct\nobservation\n Oral interview\n Questioning\n\n--- PDF PAGE 158 ---\nTR- Fish Capture NC II\n\n- 154 -\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nand take appropriate action\nSeafood storage, receival, transport and distribution\n7. Apply basic food\nhandling and\nsafety practices\n7.1. Identify, assess, report and\ncontrol common hazards and\nrisks to seafood and aquatic\nproduct\n7.2. Follow enterprise hygiene\nstandards, procedures and\npractices\n7.3. Handle and store seafood\nand aquatic product\n7.4. Follow the enterprise food\nsafety program\n7.5. Take corrective actions as\nneeded.\n7.6. Make complete\nrecording/reporting\nrequirements\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\nWritten or oral\nshort-\nanswer\ntest\nPractical\nexercises/\ncase\nstudies\n Direct\nobservation\nFishing operations\nCombination 1: Beach seining, mesh or gill netting\n8. Adjust and\nposition beach\nseines, mesh\nnets or gill nets\n8.1. Organize a work area to\nadjust beach seines, mesh\nnets or gill nets\n8.2. Prepare materials, tools and\nequipment needed\n8.3. Make adjustments,\nreconditioning or\nconstructions to all aspects of\nbeach seining or gill netting\ngear to optimize performance\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n Direct\nobservation\n Oral interview\n8.4. Describe and identify the\nindicators of sub-optimal\nperformance of beach seine,\nmesh net or gill net\ncomponents\n8.5. Position beach seines, mesh\nnets or gill nets to optimize\ncatch\n8.6.\nMaintain, adjust and position\nthe vessel and gear during\ndeployment, fishing and\nretrieval of beach seines,\nmesh nets or gill nets in\norder\n8.7.\nExercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n8.8. Make report on work carried-\nout\n\n--- PDF PAGE 159 ---\nTR- Fish Capture NC II\n\n- 155 -\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n9. Maintain,\nprepare, deploy\nand retrieve\nmesh nets or\ngill nets to land\ncatch\n9.1. Maintain and prepare beach\nseines, mesh nets or gill nets\nready for deployment\n9.2. Prepare, deploy and retrieve\ncommon gear components\n9.3. Deploy beach seines, mesh\nnets or gill nets\n9.4. Retrieve the beach seine,\nmesh net or gill net\n9.5. Land, contain and sort the\ncatch\n9.6.\nLash ground gear and/or\nflotation\n9.7.\nRepair all aspects of gear\nand renew damaged netting\n9.8.\nExercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Direct\nobservation\n Oral interview\nCombination 2: Hand-line fishing\n10. Adjust and\nposition hand\noperated lines\n10.1. Organize a work area to\nadjust hand operated lines\n10.2. Prepare materials, tools and\nequipment needed\n10.3. Make adjustment,\nreconditioning or\nconstruction to all aspects of\nhand operated line fishing\ngears\n10.4. Describe and identify the\nindicators of sub-optimal\nperformance of hand\noperated line\n10.5. Monitor and alter position of\nhand operated lines\n10.6. Place a line at a\npredetermined position in the\npresence of a moderate\ncurrent\n10.7. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n10.8. Determine productive\ngrounds and water in\nresponse to information from\nvarious sources\n10.9. Make report on work carried\nout.\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Direct\nobservation\n Oral interview\n\n--- PDF PAGE 160 ---\nTR- Fish Capture NC II\n\n- 156 -\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n11. Maintain,\nprepare, deploy\nand retrieve\nhand operated\nlines to land\ncatch\n11.1. Prepare and maintain hand\noperated lines ready for\ndeployment\n11.2. Deploy hand operated lines\n11.3. Retrieve hand operated lines\n11.4. Land, contain and sort the\ncatch\n11.5. Renew and repair damaged\ngear components\n11.6. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Direct\nobservation\n Oral interview\nCombination 3: Post and traps\n12. Adjust and\nposition pots and\ntraps\n12.1. Organize a work area to\nadjust traps and pots\n12.2. Make adjustments,\nreconditioning or\nconstruction to all aspects\ntrap and pot components to\noptimize catch\n12.3. Maneuver and position traps\nand pots\n12.4. Maintain, adjust and position\nthe vessel during deployment\n12.5. Determine productive ground\n12.6. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Direct\nobservation\n Oral interview\n13. Maintain,\nprepare,\ndeploy and\nretrieve pots\nand traps to\nland catch\n\n13.1. Prepare and Maintain traps\nand pots ready for\ndeployment\n13.2. Deploy traps and pots\n13.3. Retrieve traps and pots\n13.4. Land, contain and sort the\ncatch\n13.5. Renew and repair damaged\ngear components\n13.6. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Direct\nobservation\n Oral interview\n\n--- PDF PAGE 161 ---\nTR- Fish Capture NC II\n\n- 157 -\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\nTrainees or students should possess the following requirements:\n• can communicate both in oral and written;\n• physically and mentally fit;\n• with good moral character; and\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as educational attainment,\nappropriate work experience, and others that may be required of the trainees by the school or\ntraining center delivering the TVET program.\n\nMandatory requirements for Graduation:\n\nGraduates of this course are required to undergo mandatory assessment before\ngraduation.\n\n--- PDF PAGE 162 ---\nTR- Fish Capture NC II\n\n- 158 -\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nFISH CAPTURE (MUNICIPAL FISHERMAN) NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nFish Capture NC II are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n10\ncalculator\n2\nBeach seine\nBeach/mesh/gill Net\ncomponents:\n2\nwater temperature\nmeasuring\ndevice\n2\nMesh net\n\n sweeps\n1\nPositioning device\n2\nGill net\nnetting material\n10\nthermometer\n1\nEcho-sounder\nhangings\n2 sets\nCommunications\nequipment /\nradio\n1\nFish finder\n\n flotation devices\n2 sets\nhand tools,\nincluding:\n1\nsonar\n\n ballast\nchipping hammer\n2\nrod and reel\nflags\nscraper\n2\ntrolling gear\nbuoys\n2 sets\nelectric power tools,\nsuch as:\n2\nsquid jigging machine\n\n droppers\ngrinders\n2\nhand reel\nClips\nsanders\n1\npower operated winch\nbridles\n\n drills\n1\nhand operated winch\n\n by-catch reduction\ndevice\n1 set\npneumatic power\ntools, such as:\n5\nhand lines\nHand line components:\n\n grinders\n1\nposition fixing equipment\n\n nylon\nmonofilament line\nsanders\n2\nlobster pots\nweighted hand line\ndrills\n2\nfish traps\nhooks\n2 sets\nmarine preservative\nfinish tools, such as:\n2\noctopus traps\n\nbait and burley\n\n brush\n2\nsets\ndistress signalling\ndevices,\nincluding:\n\nsinkers\n\n spray gun\n\n Water flares\n\n lures\n\n roller\n\n Flags\n\n jigs\n2 sets\nrinsing and storing\nequipment\n\n signaling mirrors\nPot and trap components:\nflashlight\nflag poles\n\n2\nunits\nMarine diesel engine\n(from 5 to 20 HP),\nwith:\n\ndan buoys\n\nfuel, such as diesel\noil/marine diesel\noil\n\nRadar reflectors\ncoolant\nfloats\nlubrication\nlines\npurification, transfer and\nbridles\n\n--- PDF PAGE 163 ---\nTR- Fish Capture NC II\n\n- 159 -\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\nstorage\ncontrol\ntoggles\nstarting and stopping\nlashings\n\n battery power\ngeneration and use.\n\nballast\n\n5\nsets\npersonal protection\nclothing, such as:\n\nbait holding device\neye and ear protection\nbait\nsafety boots\nradio transponder\ndust and fume masks\nlight\nheadgear\n\ngloves\n\n3.5 TRAINING FACILITIES\n\nFish Capture (Municipal Fisherman) NC II\n\nThe Fish Capture Learning Facility must be of concrete structure. Based on a class intake\nof 25 students/trainees, the space requirements for the teaching / learning and curriculum\nareas are as follows.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nA. Building (permanent)\n170.3\nStudent/Trainee Working Space\n2.00 x 2.00 per\nstudent/trainee\n4.00 per student\n100.00\nLearning Resource Center\n3.00 x 5.00\n15.00\n15.00\nFacilities/Equipment /Circulation\n(30% of teaching accommodation)\n\n39.30\nStore Room\n4.00 x 4.00\n16.00\n16.00\nB. Fishing Vessel (3 GT) or\nExperimental Deck Area, with:\n\n4.00\ncargo / storage areas or Fish\nchutes\n\n• Fish treatening\narea\n\nTotal Area\n344.60\n\nNote: Experimental area will change according to availability of land.\n\n--- PDF PAGE 164 ---\nTR- Fish Capture NC II\n\n- 160 -\n3.6 TRAINER’S QUALIFICATIONS FOR AGRI-FISHERY SECTOR –\nFISH CAPTURE (MUNICIPAL FISHERMAN) NC II\nTRAINER QUALIFICATION I (TQ II)\n\n• Must be a holder of NC III\n• Must have undergone training on Training Methodology II (TM II)\n• Must be physically and mentally fit\n• *Must have at least 2-3 years job/industry experience on supervisory/managerial level\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by the learner who enrolled in a structured\nlearning program to determine their achievement of competencies. It is administered by the\ntrainer/assessor at end of each learning module.\n\n--- PDF PAGE 165 ---\nTR- Fish Capture NC II\n\n- 161 -"
