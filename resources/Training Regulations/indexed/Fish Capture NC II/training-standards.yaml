tion\n Practical\nDemonstration\nVisit/tour\nOral/Written\nInterviews\n Direct\nObservation\n Practical\nDemonstration\n2. Use farm\ntools and\nequipment\n2.1. Prepare and use farm tools\n2.2. Prepare and operate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\nSelf-paced/ modular\n Lecture/ Discussion\n Interaction\n Practical\nDemonstration\n Visit/tour\nOral/Written\nInterviews\n Direct\nObservation\n Practical\nDemonstration\n3. Perform\nestimation\nand basic\ncalculation\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n3.3. Apply corrective measures\nas necessary\nSelf-paced/ modular\n Lecture/ Discussion\n Interaction\n Practical Exercise\nOral/Written\nexamination\n Practical\nexercise\n\nMARITIME COMMON COMPETENCIES\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Prevent and\nfight fire\n1.1\nImplement fire prevention\nmeasures and procedures on\nboard a vessel.\n1.2\nCheck the capability of fire\ndetection and fire fighting\nequipment and system.\n1.3\nInitiate any required\nmaintenance\n1.4\nSimulate on board fire fighting\nand search and rescue\nactivities\n1.5\nImplement OHS principles and\npolicies when carrying out fire\nfighting duties\n1.6. Communicate effectively with\nothers during fire emergencies\nDiscussion\n Lecture\n Demonstration\n Simulation\nObservation\n Demonstration\n Practical\nperformance\n\n2. Protect\nmarine\nenvironment\n2.1\nSimulate garbage disposal\nprocedures\n2.2\nSimulate garbage segregation\n2.3. Record garbage segregation\nand disposal\nDiscussion\n Lecture\n Demonstration\n Simulation\n\nObservation\n Demonstration\n Practical\nperformance\n3. Comply with\nemergency\nprocedures\n3.1\nSimulate correct action on\nbecoming aware of an\nemergency in accordance with\nvessel procedures\n3.2\nSimulate emergency\nprocedures and contingency\nplans\n3.3. Simulate procedures for the use\nof various survival equipment\nDiscussion\n Lecture\n Demonstration\n Simulation\n\nObservation\n Demonstration\n Practical\nperformance\n\n--- PDF PAGE 156 ---\nTR- Fish Capture NC II\n\n- 152 -\nCORE COMPETENCIES\n286 Hours\n\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nVessel Operations\n1. Operate a\nvessel of up to\n3 GT\n1.1. Prepare the small vessel for\nuse.\n1.2. Apply safety precautionary\nmeasures in operating vessel\nup to 3 GT.\n1.3. Manoeuvre a small vessel\nwhile engaged in common\ntasks.\n1.4. Maintain a small vessel\n1.5\nRepair and maintain a small\nvessel, materials, tools, and\nequipment.\n1.6. Store and secure a small\nvessel, materials, tools and\nequipment\n1.7. Make report on work carried\nout.\n Lecture\n Discussion\n Practical\nDemonstration\n Field Trips\n Exercises\n Operational\nReadiness\nEvaluation\n(ORE)/drills\n Oral interview\n Written\nexamination\n2. Monitor\ncondition and\nseaworthiness\nof a vessel\n2.1. Monitor and evaluate the\ncondition and seaworthiness\nof a small vessel under\nnormal and emergency\nsituations\n2.2. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures during inspection\nand maintenance operations\n2.3. Report and take appropriate\npreventive and\nremedial(repair) action to\nmaintain the security and\nwatertight integrity of the\nvessel’s hull\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Practical\ndemonstration\n Direct\nobservation\n Oral interview\n Questioning\n3. Perform routine\nmaintenance\ntasks on a\nsmall coastal\nvessel\n\n3.1. Prepare materials, tools and\nequipment.\n3.2. Perform basic deck\nmaintenance\n3.3. Carry out cleaning activities\n3.4. Select and apply appropriate\npaint systems for areas\naboard a vessel\n3.5. Report and take appropriate\nremedial action on problems\nin paint applications.\n3.6. Check and perform basic\nmaintenance on deck fittings,\nequipment and systems\n3.7. Exercise all required safety,\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n Oral interview\n Practical\ndemonstration\n Direct\nobservation\n Practical\nassignments\n\n--- PDF PAGE 157 ---\nTR- Fish Capture NC II\n\n- 153 -\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nenvironmental and hazard\ncontrol precautions and\nprocedures\n3.8. Repair and maintain\nmaterials, tools and\nequipment\n3.9. Store and secure materials,\ntools and equipment\n3.10. Make report on work carried\nout.\n4. Operate and\ntroubleshoot low\npowered marine\ndiesel engines\n4.1. Ensure that preparations for\nthe operations are complete\n4.2. Operate, initiate start up and\nshut down operations of low\npowered diesel engines\n4.3. Maintain output of low\npowered diesel engines\n4.4. Maintain steady running of\nthe engine and comply with\nalarm acceptance\nprocedures\n4.5. Carry out adjustment and\nregulation of engine,\nincluding to achieve optimal\nfuel efficiency\n4.6. Carry out alteration of output\nas required\n4.7. Respond to irregularities\n4.8. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n4.9. Troubleshoot engine faults\nand perform minor repair\n4.10. Make report on work carried-\nout.\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n Oral interview\n Direct\nobservation\n Operational\nreadiness\nevaluation\n5. Apply weather\ninformation\nwhen\nnavigating a\nvessel\n5.1. Obtain and decipher weather\nand oceanic information\n5.2. Apply weather and\noceanographic data to safe\nnavigation\n5.3. Maintain records of weather\noceanographic information\nand forecasts\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Practical\ndemonstration\n Direct\nobservation\n Oral interview\n Questioning\n6. Contribute to\nsafe navigation\n6.1. Contribute to monitoring and\ncontrolling a navigational\nwatch\n6.2. Maneuver the vessel\n6.3. Exercise all required safety\nand hazard control\nprocedures\n6.4. Identified typical problems\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Practical\ndemonstration\n Direct\nobservation\n Oral interview\n Questioning\n\n--- PDF PAGE 158 ---\nTR- Fish Capture NC II\n\n- 154 -\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nand take appropriate action\nSeafood storage, receival, transport and distribution\n7. Apply basic food\nhandling and\nsafety practices\n7.1. Identify, assess, report and\ncontrol common hazards and\nrisks to seafood and aquatic\nproduct\n7.2. Follow enterprise hygiene\nstandards, procedures and\npractices\n7.3. Handle and store seafood\nand aquatic product\n7.4. Follow the enterprise food\nsafety program\n7.5. Take corrective actions as\nneeded.\n7.6. Make complete\nrecording/reporting\nrequirements\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\nWritten or oral\nshort-\nanswer\ntest\nPractical\nexercises/\ncase\nstudies\n Direct\nobservation\nFishing operations\nCombination 1: Beach seining, mesh or gill netting\n8. Adjust and\nposition beach\nseines, mesh\nnets or gill nets\n8.1. Organize a work area to\nadjust beach seines, mesh\nnets or gill nets\n8.2. Prepare materials, tools and\nequipment needed\n8.3. Make adjustments,\nreconditioning or\nconstructions to all aspects of\nbeach seining or gill netting\ngear to optimize performance\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n Direct\nobservation\n Oral interview\n8.4. Describe and identify the\nindicators of sub-optimal\nperformance of beach seine,\nmesh net or gill net\ncomponents\n8.5. Position beach seines, mesh\nnets or gill nets to optimize\ncatch\n8.6.\nMaintain, adjust and position\nthe vessel and gear during\ndeployment, fishing and\nretrieval of beach seines,\nmesh nets or gill nets in\norder\n8.7.\nExercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n8.8. Make report on work carried-\nout\n\n--- PDF PAGE 159 ---\nTR- Fish Capture NC II\n\n- 155 -\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n9. Maintain,\nprepare, deploy\nand retrieve\nmesh nets or\ngill nets to land\ncatch\n9.1. Maintain and prepare beach\nseines, mesh nets or gill nets\nready for deployment\n9.2. Prepare, deploy and retrieve\ncommon gear components\n9.3. Deploy beach seines, mesh\nnets or gill nets\n9.4. Retrieve the beach seine,\nmesh net or gill net\n9.5. Land, contain and sort the\ncatch\n9.6.\nLash ground gear and/or\nflotation\n9.7.\nRepair all aspects of gear\nand renew damaged netting\n9.8.\nExercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Direct\nobservation\n Oral interview\nCombination 2: Hand-line fishing\n10. Adjust and\nposition hand\noperated lines\n10.1. Organize a work area to\nadjust hand operated lines\n10.2. Prepare materials, tools and\nequipment needed\n10.3. Make adjustment,\nreconditioning or\nconstruction to all aspects of\nhand operated line fishing\ngears\n10.4. Describe and identify the\nindicators of sub-optimal\nperformance of hand\noperated line\n10.5. Monitor and alter position of\nhand operated lines\n10.6. Place a line at a\npredetermined position in the\npresence of a moderate\ncurrent\n10.7. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures\n10.8. Determine productive\ngrounds and water in\nresponse to information from\nvarious sources\n10.9. Make report on work carried\nout.\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Direct\nobservation\n Oral interview\n\n--- PDF PAGE 160 ---\nTR- Fish Capture NC II\n\n- 156 -\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n11. Maintain,\nprepare, deploy\nand retrieve\nhand operated\nlines