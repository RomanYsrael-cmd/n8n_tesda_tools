    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FISH CAPTURE (Municipal Fisherman)\nNC Level: NC II\n\nNominal Training Duration: 318 Hours\n\nCourse Description:\n\nThis course is design to enhance the knowledge, skills and attitudes in FISH CAPTURE\n(Municipal Fisherman) NC II in accordance with industry standards. It covers Basic, Common\nand Core Competencies.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n18 Hours\n\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace information\n1.2. Complete relevant work\nrelated documents\n1.3. Participate in workplace\nmeeting and discussion\n Group\ndiscussion\n Interaction\n\n Written test\n Practical/\nperformance\ntest\n Interview\n2. Work in a team\nenvironment\n2.1. Describe and identify team\nrole and responsibility in a\nteam.\n2.2. Describe work as a team\nmember.\n Group\ndiscussion\n Interaction\n\n Observation\n Simulation\n Role playing\n3. Practice career\nprofessionalism\n3.1. Integrate personal\nobjectives with\norganizational goals\n3.2. Set and meet work\nproblems\n3.3. Maintain professional\ngrowth and development\n Group\ndiscussion\n Interaction\n Demonstration\n Observation\n Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1. Evaluate hazards and risks\n4.2. Control hazards and risks\n4.3. Maintain occupational\nhealth and safety\nawareness\n Group\ndiscussion\n Plant tour\n Symposium\n Observation\n Interviews\n\n--- PDF PAGE 155 ---\nTR- Fish Capture NC II\n\n- 151 -\nCOMMON COMPETENCIES\n14 Hours\n\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Apply safety\nmeasures in\noperations\n1.1. Determine areas of concern\nfor safety measures\n1. 2. Apply appropriate safety\nmeasures\n1. 3. Safekeep/maintain/ dispose\ntools, materials and outfit.\nSelf-paced/ modular\n Lecture/ Discussion\n Interaction\n Practical\nDemonstration\nVisit/tour\nOral/Written\nInterviews\n Direct\nObservation\n Practical\nDemonstration\n2. Use farm\ntools and\nequipment\n2.1. Prepare and use farm tools\n2.2. Prepare and operate farm\nequipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\nSelf-paced/ modular\n Lecture/ Discussion\n Interaction\n Practical\nDemonstration\n Visit/tour\nOral/Written\nInterviews\n Direct\nObservation\n Practical\nDemonstration\n3. Perform\nestimation\nand basic\ncalculation\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n3.3. Apply corrective measures\nas necessary\nSelf-paced/ modular\n Lecture/ Discussion\n Interaction\n Practical Exercise\nOral/Written\nexamination\n Practical\nexercise\n\nMARITIME COMMON COMPETENCIES\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1. Prevent and\nfight fire\n1.1\nImplement fire prevention\nmeasures and procedures on\nboard a vessel.\n1.2\nCheck the capability of fire\ndetection and fire fighting\nequipment and system.\n1.3\nInitiate any required\nmaintenance\n1.4\nSimulate on board fire fighting\nand search and rescue\nactivities\n1.5\nImplement OHS principles and\npolicies when carrying out fire\nfighting duties\n1.6. Communicate effectively with\nothers during fire emergencies\nDiscussion\n Lecture\n Demonstration\n Simulation\nObservation\n Demonstration\n Practical\nperformance\n\n2. Protect\nmarine\nenvironment\n2.1\nSimulate garbage disposal\nprocedures\n2.2\nSimulate garbage segregation\n2.3. Record garbage segregation\nand disposal\nDiscussion\n Lecture\n Demonstration\n Simulation\n\nObservation\n Demonstration\n Practical\nperformance\n3. Comply with\nemergency\nprocedures\n3.1\nSimulate correct action on\nbecoming aware of an\nemergency in accordance with\nvessel procedures\n3.2\nSimulate emergency\nprocedures and contingency\nplans\n3.3. Simulate procedures for the use\nof various survival equipment\nDiscussion\n Lecture\n Demonstration\n Simulation\n\nObservation\n Demonstration\n Practical\nperformance\n\n--- PDF PAGE 156 ---\nTR- Fish Capture NC II\n\n- 152 -\nCORE COMPETENCIES\n286 Hours\n\nCOMPETENCY\nLEARNING OUTCOMES\nMETHODOLOGY\nASSESSMENT\nAPPROACH\nVessel Operations\n1. Operate a\nvessel of up to\n3 GT\n1.1. Prepare the small vessel for\nuse.\n1.2. Apply safety precautionary\nmeasures in operating vessel\nup to 3 GT.\n1.3. Manoeuvre a small vessel\nwhile engaged in common\ntasks.\n1.4. Maintain a small vessel\n1.5\nRepair and maintain a small\nvessel, materials, tools, and\nequipment.\n1.6. Store and secure a small\nvessel, materials, tools and\nequipment\n1.7. Make report on work carried\nout.\n Lecture\n Discussion\n Practical\nDemonstration\n Field Trips\n Exercises\n Operational\nReadiness\nEvaluation\n(ORE)/drills\n Oral interview\n Written\nexamination\n2. Monitor\ncondition and\nseaworthiness\nof a vessel\n2.1. Monitor and evaluate the\ncondition and seaworthiness\nof a small vessel under\nnormal and emergency\nsituations\n2.2. Exercise all required safety,\nenvironmental and hazard\ncontrol precautions and\nprocedures during inspection\nand maintenance operations\n2.3. Report and take appropriate\npreventive and\nremedial(repair) action to\nmaintain the security and\nwatertight integrity of the\nvessel’s hull\n Lecture\n Discussion\n Practical\ndemonstration\n Field trips\n Exercises\n\n Practical\ndemonstration\n Direct\nobservation\n Oral interview\n Questioning\n3. Perform routine\nmaintenance\ntasks on a\nsmall coastal\nvessel\n\n3.1. Prepare materials, tools and\nequipment.\n3.2. Perform basic deck\nmaintenance\n3.3. Carry out cleaning activities\n3.4. Select and apply appropriate\npaint systems for areas\naboard a vessel\n3.5. Report and take appropriate\nremedial action on problems\nin paint applications.\n3.6. Check and perform basic\nmaintenance on deck fittings,\nequipment and systems\n3.7. Exercise al