        "source_text": "--- PDF PAGE 65 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n60 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n:  \nPERFORM PRE AND POST-OPERATION   \nPROCEDURES FOR ROUGH TERRAINCRANE \n \nUNIT CODE  \n \n \n: \nCON834304 \n \nUNIT DESCRIPTOR \n \n:  \nThis unit covers the knowledge, skills and attitudes in  \nperforming visual and operation check before and after  \nproductive operation of rough terrain crane.  \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are elaborated \nin the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Perform visual check \nof rough terrain \ncrane \n \n \n \n \n \n \n1.1 \nCapacity of rough \nterrain crane is \nselected based on job \nrequirements. \n1.2 \nOperator-\nserviceable (OS) \nparts are checked in \naccordance with \nequipment checklist \nand manufacturer’s \nprocedures. \n1.3 \nInspection is \nperformed with \nequipment checklist \nand with engine \nstopped/not running. \n1.4 \nPersonal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n1.5 \nWork area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42). \n1.6 \nRequired output is \ncompleted based on \naccomplished \nchecklist. \n \n1.1 DOLE \nDepartment Order \nNo. 13 s. 1998 \nGuidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n1.2 Procedures in   \nconducting visual \ncheck \n1.3 Computation of \nload versus \ncapacity of rough \nterrain crane \n1.4 Functions of parts \nand components \nof rough terrain \ncrane \n1.5 Factors affecting \nproductivity \n1.6 Productivity work \nmeasurements \n1.7 Ways of \nimproving \nproductivity \n \n1.1 Following visual \nand inspection  \nprocedures  \n1.2 Calculating load \nand capacity of \nrough terrain \ncrane \n1.3 Identifying parts \nand functions