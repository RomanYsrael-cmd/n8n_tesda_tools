          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Perform visual check \nof rough terrain \ncrane \n \n \n \n \n \n \n1.1 \nCapacity of rough \nterrain crane is \nselected based on job \nrequirements. \n1.2 \nOperator-\nserviceable (OS) \nparts are checked in \naccordance with \nequipment checklist \nand manufacturer’s \nprocedures. \n1.3 \nInspection is \nperformed with \nequipment checklist \nand with engine \nstopped/not running. \n1.4 \nPersonal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n1.5 \nWork area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42). \n1.6 \nRequired output is \ncompleted based on \naccomplished \nchecklist. \n \n1.1 DOLE \nDepartment Order \nNo. 13 s. 1998 \nGuidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n1.2 Procedures in   \nconducting visual \ncheck \n1.3 Computation of \nload versus \ncapacity of rough \nterrain crane \n1.4 Functions of parts \nand components \nof rough terrain \ncrane \n1.5 Factors affecting \nproductivity \n1.6 Productivity work \nmeasurements \n1.7 Ways of \nimproving \nproductivity \n \n1.1 Following visual \nand inspection  \nprocedures  \n1.2 Calculating load \nand capacity of \nrough terrain \ncrane \n1.3 Identifying parts \nand functions \n1.4 Accomplishing \nchecklist \n1.5 Using PPE \n1.6 Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 66 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n61 \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are elaborated \nin the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Perform       \n     “B L O W A F”   \n     check \n \n \n \n \n \n \n2.1 “BLOWAF” check is \nperformed using \nchecklist with engine \nstopped/not running. \n2.2 Fluid levels are \nmaintained in \naccordance with \nequipment \nmaintenance manual. \n2.3 Abnormal conditions \nnoted in checklist and \nreported to authorized \nperson \n2.4 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n2.5 Required output is \ncompleted based on \naccomplished checklist. \n2.1 Procedures in \nperforming \n“BLOWAF” check \n2.2 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n2.3 Waste disposal \nprocedures \n2.4 Fluid’s level and \ncontamination \n2.5 Factors affecting \nproductivity \n2.6 Productivity work \nmeasurements \n2.7 Ways of improving \nproductivity \n \n2.1 Accomplishing \nchecklist \n2.2 Applying waste \ndisposal \nprocedures \n2.3 Following \n“BLOWAF” \nchecking \nprocedures  \n2.4 Determining fluid \nlevel and \ncontamination \n2.5 Using PPE \n2.6 Applying \nproductive \nmethods and \ntechniques  \n \n3. Perform visual \ncheck for super \nstructure, lower \nstructure and \npower train \ncomponents \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n3.1 Super structure, \nlower structure and \npower train \ncomponents are \nchecked in accordance \nwith checklist and \nmanufacturer’s \nprocedures \n3.2 Super structure, lower \nstructure and power \ntrain components are \nsecured for safety \nlifting operation  \n3.3 Abnormal conditions \nare noted in checklist \nand reported to \nauthorized person \n3.4 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \nRequirements \n3.5.   Required output is \ncompleted based on \naccomplished \nchecklist. \n3.1 Procedures in \nvisual check for \nsuper structure, \nlower structure and \npower train \ncomponents \n3.2 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n3.3 Functions of super \nstructure, lower \nstructure and power \ntrain components \n3.4 Factors affecting \nproductivity \n3.5 Productivity work \nmeasurements \n3.6.Ways of improving   \n      productivity \n \n \n \n \n3.1 Accomplishing \nchecklist \n3.2 Following visual \nchecking for \nsuper structure, \nlower structure \nand power train \ncomponents \n3.3  Identifying parts \nand functions \n3.4 Using PPE \n3.5 Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 67 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n62 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \n3. Perform operation \ncheck \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n4.1. Starting/running \ncheck/operation \ncheck is performed \nwith checklist and in \naccordance with \nmanufacturer’s \nrecommendations. \n4.2. Mechanical \ncomponents are \nchecked for normal \nfunctioning based on \nmanufacturer's \nspecifications.  \n4.3. Function check is \nperformed with \nequipment checklist \nand while engine is \nrunning. \n4.4. Safety devices are \nchecked for proper \nfunctions in accordance \nwith safe operating \nprocedures \n4.5. Personal Protective \nEquipment (PPE) is \nused in accordance with \nRule 1080 of \nOccupational Safety and \nHealth Standards \n4.6. Required output is \ncompleted based on \naccomplished checklist. \n \n \n \n \n \n \n \n \n \n \n \n \n4.1 Start-up and \nwarming \nprocedures \n4.2 Procedures in   \ninspection while \nthe engine is \nrunning \n4.3 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n4.4  Warning signs and \nsymbols \n4.5 Functions of all \ncomponents and \nsafety devices \n4.6 Factors affecting \nproductivity \n4.7 Productivity work \nmeasurements \n4.8 Ways of improving \nproductivity \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n4.1. Accomplishing \nchecklist \n4.2. Following \ninspection \nprocedures while \nthe engine is \nrunning \n4.3. Testing of rough \nterrain crane \n4.4. Using PPE \n4.5. Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 68 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n63 \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \n5. Perform post-\noperation \nprocedures  \n5.1. Rough terrain crane is \nparked and turned off \nafter productive \noperation in \naccordance to \nmanufacturer’s manual. \n \n \n5.2. Controls are set into \nneutral position and \nparking brakes are \nengaged in \naccordance to \nmanufacturer’s \nmanual. \n5.3. Safety locks and \nbrakes are all engaged \nin accordance with \nmanufacturer’s manual. \n5.4. Inspection is re-\nconducted while doing \nengine cool down \n5.5. Daily equipment time \nrecord/report (DETR) is \naccomplished/submitte\nd according to \ncompany rules and \nregulations \n5.6. Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n \n5.1 Company rules and \nregulations  \n5.2 Parking and shut-\ndown procedures  \n5.3 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n5.4 Factors affecting \nproductivity \n5.5 Productivity work \nmeasurements \n5.6 Ways of improving \nproductivity \n \n5.1 Accomplishing \nDETR \n5.2 Following rules \nand regulations in \nparking and \nshutting down \nrough terrain \ncrane \n5.3 Using PPE \n5.4 Applying \nproductive \nmethods and \ntechniques \n5.5 Preforming post \noperation \nprocedures\n\n--- PDF PAGE 69 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n64 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Capacity of \nrough terrain \ncrane \nMay include: \n1.1  10 - 25 tons \n1.2  25 - 50 tons \n1.3  50  tons and above \n2. Operator \nserviceable parts \n(OS) \n \n \n \n \n \nMay include: \n2.1 Air cleaner \n2.2 Battery terminals/connection/clamp/case \n2.2 Fan belt \n2.3 Grease/lube points  \n2.4 Fuel water separator/radiator \n2.5 Tire inflation \n2.6 Fuel tank \n2.7 Hydraulic and brake master cylinder \n2.8 Engine oil fan \n2.9 Lights \n2.10 Steering/suspension  \n3. Inspection \n \n \n \n \n \nMay include: \n3.1 Engine off \n3.1.1 Leaks  \n3.1.2 Worn out/damaged parts  \n3.1.3 Fluid levels \n        3.1.4 Loose parts and accessories (nuts/bolts/belts) \n        3.1.5 Missing parts and accessories \n        3.1.6 Pulleys (gantry and boom end) \n        3.1.7 Hook block assembly \n                 3.1.7.1 Sheaves \n                 3.1.7.2 Hook and latch \n        3.1.8 Wire rope cable/clip \n        3.1.9  Levers and controls  \n                 3.1.9.1 Hoist \n                  3.19.2 Steering wheels \n                 3.1.9.3 Pedals \n                 3.1.9.4 Hand brake \n                 3.1.9.5 Swing \n      3.1.10 Counter weight \n      3.1.11 Outrigger\n\n--- PDF PAGE 70 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n65 \nVARIABLE \nRANGE \n \n3.2 Engine on \n3.2.1   Gauges and controls  \n3.2.2   Safety devices \n3.2.3   Oil and air leaks  \n3.2.4 Working equipment function \n                  3.2.4.1   Outriggers \n3.2.4.2 Boom \n3.2.4.3    Hoist \n3.2.4.4    Steering wheels \n3.2.4.5 Pedals \n3.2.4.6 Hand brake \n3.2.4.7 Swing \n      3.2.5   Electrical lighting system \n4. Personal \nProtective \nEquipment \n(PPE) \nMay include: \n4.1 Hard hat \n4.2 Goggles \n4.3 Gloves \n4.4 Safety shoes \n4.5 Safety vest  \n5. B L O W A F \ncheck \n \n \n \n \n \nMay include: \n5.1   Battery (starting and charging system) \n5.2   Light (lighting system) \n5.3   Oil (lubricating system) \n5.4   Water (cooling system) \n5.5   Air (intake and exhaust system) \n5.6   Fuel (fuel system) \n6. Fluid \nMay include: \n6.1   Engine oil \n6.2   Hydraulic oil \n6.3   Radiator coolant/radiator  \n6.4   Battery electrolyte/distilled water \n6.5   Brake/clutch fluid \n6.6   Transmission/Gear oil \n6.7   Steering oil \n6.8   Fuel \n6.9   Torque converter oil \n6.10 Automatic transmission fluid \n7. Authorized \nperson \nMay include: \n7.1  Equipment Supervisor \n7.2  Equipment Dispatcher/Foreman  \n7.3  Equipment Maintenance personnel\n\n--- PDF PAGE 71 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n66 \nVARIABLE \nRANGE \n8. Super structure, \nlower structure \nand power train \ncomponents  \nMay include: \nSuper structure components \n8.1  Boom \n8.2  Extension Boom and Jibs \n8.3  Hook \n8.4  Hoist (Main and Auxiliary) \n8.5  Counterweight \n8.6  Turntable \n8.7  Hydraulic motor (Main and Auxiliary) \n8.8  Slewing hydraulic motor \n8.9  Hydraulic cylinder (Boom, Telescopic) \n8.10 Hoist drum (Main and Auxiliary) \n8.11 Boom sheaves \n8.12 Anti-two block \nLower Structure \n8.13 Outriggers  \n        8.13.1 Outrigger pads \n        8.13.2 Outrigger beams \n        8.13.3 Hydraulic cylinders \nPower train \n8.14 Clutch and torque converter \n8.15 Transmission \n8.16 Differential \n8.17 Tires/ Stud and Bolts \n \nVARIABLE \nRANGE \n9. Starting/running \ncheck/operation \ncheck \n \nMay include: \n9.1 Controls  \n9.1.1 Travel  \n9.1.2 Hoist  \n9.1.3  Swing  \n9.1.4 Outrigger \n9.1.5 Boom \n9.2 Gauges  \n      9.2.1 Hour meter \n      9.2.2 Battery charging  \n      9.2.3 Pressure (oil and air) \n      9.2.4 Temperature (oil and water)  \n      9.2.5 RPM (Tachometer)  \n      9.2.6 Boom angle indicator  \n      9.2.7 Fuel indicator  \n      9.2.8 Speedometer  \n      9.2.9 Hydraulic pressure \n9.3 Leaks in   \n      9.3.1 Fuel \n      9.3.2 Oil \n9.4 Electrical/switches \n       9.4.1 Lights \n       9.4.2 Horns \n       9.4.3 Wiper \n9.5 Steering and brake\n\n--- PDF PAGE 72 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n67 \n10. Safety devices \nMay include: \n10.1 Load moment indicator (LMI) \n10.2 Anti two block (Limit switch) \n10.3 Automatic crane stopper (ACS) \n10.5 Back horn/warning horn \n10.6 Signal/stop light \n10.7 Blinkers \n10.8 Safety belt \n10.9 Parking brake  \n10.10 Anemometer \n10.11 Ground connection near high tension wires \n11. Safety locks \nMay include: \n11.1 Swing lock \n11.2 Hoist lock \n11.3 Control lever lock \n11.4 Door lock\n\n--- PDF PAGE 73 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n68"
