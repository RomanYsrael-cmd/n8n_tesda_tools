rs and \nclients are \nmaintained to show \nthat diversity is \nvalued by the \nbusiness.  \n \n2.1 Value of diversity \nin the economy \nand society in \nterms of \nWorkforce \ndevelopment \n2.2  Importance of \ninclusiveness in a \ndiverse \nenvironment \n2.3 Shared vision and \nunderstanding of \nand commitment \nto team, \ndepartmental, and \norganizational \ngoals and \nobjectives \n2.4 Strategies for \ncustomer service \nexcellence \n2.1 Demonstrating cross-\ncultural \ncommunication skills \nand active listening \n2.2 Recognizing diverse \ngroups in the \nworkplace and \ncommunity as \ndefined by divergent \nculture, religion, \ntraditions and \npractices  \n2.3 Demonstrating \ncollaboration skills \n2.4 Exhibiting customer \nservice excellence\n\n--- PDF PAGE 23 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n18 \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Identify common \nissues in a \nmulticultural and \ndiverse \nenvironment \n3.1 Diversity-related \nconflicts within the \nworkplace are \neffectively \naddressed and \nresolved. \n3.2 Discriminatory \nbehaviors towards \ncustomers/stakehol\nders are minimized \nand addressed \naccordingly. \n3.3 Change \nmanagement \npolicies are in place \nwithin the \norganization. \n \n3.1 Value, and \nleverage of cultural \ndiversity \n3.2 Inclusivity and \nconflict resolution \n3.3 Workplace \nharassment \n3.4 Change \nmanagement and \nways to overcome \nresistance to \nchange \n3.5 Advanced \nstrategies for \ncustomer service \nexcellence \n3.1 Addressing \ndiversity-related \nconflicts in the \nworkplace \n3.2 Eliminating \ndiscriminatory \nbehavior towards \ncustomers and co-\nworkers \n3.3 Utilizing change \nmanagement \npolicies in the \nworkplace\n\n--- PDF PAGE 24 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revisio