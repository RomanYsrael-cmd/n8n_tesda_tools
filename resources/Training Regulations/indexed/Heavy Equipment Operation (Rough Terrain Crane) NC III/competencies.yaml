        "source_text": "--- PDF PAGE 7 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n2 \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details and contents of the units of competency required in HEAVY \nEQUIPMENT OPERATION (ROUGH TERRAIN CRANE) NC III. These units of competency are \ncategorized into basic, common and core competencies. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY   :  LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n       :  400311319 \n \nUNIT DESCRIPTOR          :  This unit covers the knowledge, skills and attitudes     required to \nlead in the effective dissemination and discussion of ideas, \ninformation, and issues in the workplace. This includes preparation \nof written communication materials. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1  Relevant  \ncommunication \nmethod  is selected \nbased on workplace \nprocedures   \n1.2  Multiple operations \ninvolving several \ntopics/areas are \ncommunicated following \nenterprise requirements  \n1.3  Questioning is applied  \nto gain extra information \n1.4  Relevant sources of \ninformation are \nidentified in accordance \nwith workplace/ client \nrequirements \n1.5  Information is selected \nand organized following \nenterprise procedures \n1.6  Verbal and written \nreporting is undertaken \nwhen required \n1.7  Communication and \nnegotiation skills are \napplied and maintained \nin all relevant situations \n1.1.  Organization \nrequirements \nfor written and \nelectronic \ncommunication \nmethods \n1.2. Effective verbal \ncommunication \nmethods \n1.3. Business \nwriting \n1.4. Workplace \netiquette \n1.1  Organizing \ninformation \n1.2  Conveying \nintended meaning \n1.3 Participating in a \nvariety of workplace \ndiscussions \n1.4 Complyin