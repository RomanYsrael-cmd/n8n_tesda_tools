          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Travel the rough \nterrain crane \n \n \n \n \n \n \n1.1 Road conditions are \nconsidered before \ntravelling the crane \n1.2 Work area is surveyed for \npotential hazards in \naccordance with safe \noperating procedures. \n1.3 Outrigger assembly is \nsecured during travel in \naccordance with \nmanufacturers manual.  \n1.4 Telescopic boom is \nsecured and in place \nduring travel in accordance \nwith manufacturers \nmanual. \n1.5 Travel speed is observed in\naccordance with  \n      traffic rules and regulations \n1.6 Hook block on front frame \nis secured in accordance \nwith manufacturers \nmanual. \n1.7 Aid of a rigger is required \non the entire operation in \naccordance with standard \noperating procedures. \n1.8 Unexpected situations \nare responded in  \n       line with company rules \nand regulations  \n1.9 Personal Protective    \nEquipment (PPE) is used \nin accordance with Rule \n1080 of Occupational \nSafety and Health \nStandards  \n \n \n \n1.1 DOLE \nDepartment \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n1.2 Traffic rules and \nregulations   \n1.3 Site and weather \nconditions \n1.4 Road worthiness \n1.5 Clearance and \ndistances \n1.6 Speed limit \n1.7 Procedures in \noperating, \ntravelling of rough \nterrain crane \n1.8 Factors affecting \nproductivity \n1.9 Productivity work \nmeasurements \n1.10 \nWays of \nimproving \nproductivity \n \n1.1 Interpreting and \nfollowing traffic \nrules and \nregulations \n1.2 Driving skills \n1.3 Travelling the \ncrane \n1.4 Using PPE \n1.5 Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 82 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n77 \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Load and unload \nrough terrain crane \nto low-bed trailer \n2.1 Low-bed trailer for \ntransporting the rough \nterrain crane is selected \naccording to job \nrequirements.  \n2.2 Boom position is followed \nduring loading and \nunloading in accordance \nwith manufacturer’s \nrecommendations  \n2.3 Rough terrain crane \ncomponents and \nattachments are \npositioned and secured \nbased on manufacturer’s \nrecommendations. \n2.4 Verbal instructions and \nhand signals are \nconveyed with authorized \nrigger during loading and \nunloading as per standard \noperating procedures. \n2.5 All safety locks and \ncontrol levers are secured \nat neutral position before \nand after loading based \non manufacturer's \nspecifications \n2.6 Personal Protective \nEquipment (PPE) is used \nin accordance with Rule \n1080 of Occupational \nSafety and Health \nStandards  \n \n \n \n2.1 DOLE \nDepartment \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and \nHealth in the \nConstruction \nIndustry \n2.2 Hand signals \n2.3 Site and weather \nconditions \n2.4 Clearance and \ndistances \n2.5 Procedures in \nloading and \nunloading  \n2.7. Factors affecting \nproductivity \n2.8. Productivity work \nmeasurement \n2.9. Ways of \nimproving \nproductivity \n \n \n2.1 Interpreting verbal \ninstructions and \nhand signals \n2.2 Operating skills in \nloading and \nunloading crawler \ncrane to low-bed \ntrailer \n2.3 Using PPE \n2.4 Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 83 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n78 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Set-up the rough \nterrain crane \n \n3.1 Site conditions are \nconsidered before  \nsetting up the crane  \n3.2 Crane is set-up and \npositioned in \naccordance with \nmanufacturer’s manual \n3.3 Unexpected situations \nare responded in line  \nwith company rules and \nregulations  \n3.4 Personal Protective  \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards  \n \n \n3.1 DOLE \nDepartment \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n3.2 Hand signals  \n3.3 Site and weather \nconditions \n3.4 Clearance and \ndistances \n3.5 Procedures in \nsetting up the \ncrane \n3.6 Factors affecting \nproductivity \n3.7 Productivity work \nmeasurement \n3.8 Ways of \nimproving \nproductivity \n \n3.1 Setting up the \ncrane \n3.2 Interpreting and \nfollowing hand \nsignals \n3.3 Using PPE \n3.4 Applying \nproductive \nmethods and \ntechniques \n \n4. Interpret load chart \nand /or load \nmoment indicator \nand construct lifting \nplan \n \n \n \n \n \n \n4.1 Weight of the load is \ndetermined according to \nload information. \n4.2 Lifting capacity is \ndetermined according to \nworking radius, boom \nlength and boom angle \nby manufacturer’s \nspecifications \n4.3 Rigging gears are \ndetermined and \nconsidered as part of \nthe load based on \nmanufacturer’s \nspecifications \n4.4 Lifting capacity in the \nload chart and /or load \nmoment indicator is \nfollowed according to \nmanufacturer’s \nspecifications  \n4.5 Personal Protective \nEquipment (PPE) is \nused in accordance with \nRule 1080 of \n4.1DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n4.2 Conversion of \nunits \n4.3 Procedures in \ninterpreting \nmanual load chart \nand range \ndiagram/ or load \nmoment indicator \nto determine \ncrane capacity \n \n \n4.4 Capacity and \nuses of rigging \ngear \n4.5 Factors affecting \n4.1 Interpreting \nmanual load chart \nand range \ndiagram/or load \nmoment indicator  \n4.2 Identifying rigging \ngears \n4.3 Using PPE \n4.4 Applying \nproductive \nmethods and \ntechniques \n4.5 Constructing lifting \nplan\n\n--- PDF PAGE 84 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n79 \nOccupational Safety \nand Health Standards \n4.6 Lifting plan is \nconstructed based on \njob description \n \nproductivity \n4.6 Productivity work \nmeasurement \n4.7 Ways of \nimproving \nproductivity \n4.8 Procedures in \nconstructing lifting \nplan \n4.9 Crane capacity \nbased on load \nchart and/or load \nmoment indicator\n\n--- PDF PAGE 85 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n80 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5. Perform lifting and \ntransferring of load \n \n \n \n \n \n \n5.1 Site and weather \nconditions are \nconsidered before lifting \nand transferring the load \n5.2 Safe work procedures \nand practices are  \nobserved during lifting \noperation based on \nOSH standards and \nmanufacturer’s manual  \n5.3 Optimum engine speed \nduring hoisting or swing \noperation is controlled \nbased on \nmanufacturer’s manual \n5.4 Communication with \nrigger is established and \nmaintained during lifting \nand transferring of loads \nbased on standard \noperating procedures  \n5.5 Unexpected situations \nare responded in line  \nwith company rules and  \nregulations \n5.6 Personal Protective    \nEquipment (PPE) is \nused in accordance with \nRule 1080 of \nOccupational Safety \nand Health Standards  \n \n \n5.1DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the \nConstruction \nIndustry \n5.2 Standard hand    \n      Signals \n5.3 Site and weather   \nconditions \n5.4 Conversion of \nunits \n5.5 Crane capacity \nbased on manual \nload chart and \nrange diagram/ or \nload moment \nindicator \n5.6 Clearance and \ndistances \n5.7 Capacity and \nuses of rigging \ngears  \n5.8 Safety devices \n5.9 Procedures in \nlifting and \ntransferring of \nload  \n5.10 Factors \naffecting \nproductivity \n5.11 Productivity \nwork \nmeasurements \n5.12 Ways of \nimproving \nproductivity \n \n5.1 Performing lifting \nand transferring of \nload \n5.2 Interpreting and \nfollowing standard \nhand signals \n5.3 Using PPE \n5.4 Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 86 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n81 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Potential hazards \n \n \n \n \n \nMay include: \n1.1 Other equipment \n1.2 Building \n1.3 Deep excavation \n1.4 Sloping ground \n1.5 Uneven terrain \n1.6 Overhead “live” electrical wires  \n1.7 Underground utilities \n1.8 Unstable ground \n2. Unexpected \nsituations \nMay include: \n2.1 Sudden engine breakdown  \n2.2 Busted hydraulic hose and oil leakages \n2.3 Broken wire rope \n2.4 Sudden loss of brake  \n2.5 Hitting high tension wire \n2.6 Loss control of steering \n2.7 Sudden ground failure \n2.8 Force majeure e.g., earthquake, tornado \n2.9 Operator fatigue or sickness/condition \n2.10 Accidents/incidents \n3. Components and \nattachments \nMay include: \n3.1 Wheels \n3.2 Body frame \n3.3 Main hook block \n3.4 Auxiliary hook block \n4. Load information \nMay include: \n3.1 Bill of ladings \n3.2 Packing and shipping list  \n3.3 Delivery receipt \n5. Rigging gears \n  May include: \n4.1 Shackle \n4.2 Web sling \n4.3 Chain sling \n4.4 Wire rope sling \n4.5 Turn buckle \n4.6 Eye bolt \n4.7 Hoist hook\n\n--- PDF PAGE 87 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n82 \n \nVARIABLE \nRANGE \n6. Safe work \nprocedures and \npractices \nMay include: \n5.1 Lifting Plan  \n5.2 Load chart  \n5.3 Mattings \n5.4 Work area \n5.5 Storage \n5.6 number of partlines \n5.7 Trial lift  \n5.10 Communication \n5.11