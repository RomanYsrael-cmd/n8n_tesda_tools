nce with \nRule 1080 of \nOccupational Safety and \nHealth Standards \n4.6. Required output is \ncompleted based on \naccomplished checklist. \n \n \n \n \n \n \n \n \n \n \n \n \n4.1 Start-up and \nwarming \nprocedures \n4.2 Procedures in   \ninspection while \nthe engine is \nrunning \n4.3 DOLE Department \nOrder No. 13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n4.4  Warning signs and \nsymbols \n4.5 Functions of all \ncomponents and \nsafety devices \n4.6 Factors affecting \nproductivity \n4.7 Productivity work \nmeasurements \n4.8 Ways of improving \nproductivity \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n4.1. Accomplishing \nchecklist \n4.2. Following \ninspection \nprocedures while \nthe engine is \nrunning \n4.3. Testing of rough \nterrain crane \n4.4. Using PPE \n4.5. Applying \nproductive \nmethods and \ntechniques\n\n--- PDF PAGE 68 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III        Revision 01        Promulgated (11/07/2019) \n \n63 \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \n \nREQUIRED SKILLS \n5. Perform post-\noperation \nprocedures  \n5.1. Rough terrain crane is \nparked and turned off \nafter productive \noperation in \naccordance to \nmanufacturer’s manual. \n \n \n5.2. Controls are set into \nneutral position and \nparking brakes are \nengaged in \naccordance to \nmanufacturer’s \nmanual. \n5.3. Safety locks and \nbrakes are all engaged \nin accordance with \nmanufacturer’s manual. \n5.4. Inspection is re-\nconducted while doing \nengine cool down \n5.5. Daily equipment time \nrecord/report (DETR) is \naccomplished/submitte\nd according to \ncompany rules and \nregulations \n5.6. Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n \n5.1 Company rules and \nregulations  \n5.2 