ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n5.2 Perform basic\npreventive\nmaintenance\n• Handling of tools and equipment\n• Performing preventive maintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 104 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n99\nCORE COMPETENCIES\n (160 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform pre- and\npost-operation\n procedures for\n rough terrain\ncrane\n1.1 Perform visual check\n of equipment\n\n• Select personal protective\nequipment\n• Select rough terrain crane capacity\n• Identify and explain operator\nserviceable parts\n• Perform inspection\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n\n16 hours\n1.2 Perform “B L O W A F”\n check\n\n• Explain procedures in performing\nBLOWAF check\n• Perform BLOWAF check\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n1.3 Perform visual check for\nsuper structure, lower\nstructure and power\ntrain components\n• Explain procedures in visual check\nfor super & lower structure and\npower train components\n• Identify abnormal conditions\n• Perform visual check for super &\nlower structure and power train\ncomponents\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n\n1.4 Perform operation\n check\n\n• Explain start-up and warming\nprocedures\n• Explain procedures in conducting\nfunction check while the engine is\nrunning\n• Perform operation of rough terrain\ncrane components and safety\ndevices\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n\n--- PDF PAGE 105 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n100\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n1.5 Perform post-\n operation procedure\n•\nExplain inspection procedures\nwhile engine is cooling down\n•\nExplain parking and shut-down\nprocedures\n•\nPerform parking and shut-down\noperation\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstratio\nn and\ninterview\n\n2. Perform basic\npreventive\nmaintenance\nservicing for rough\nterrain crane\n\n2.1 Perform adjustment or\n replacement for noted\n defects\n\n• Explain procedures in performing\nadjustments or replacements for\nnoted defects\n• Explain usage of basic hand tools\nand portable powered tools\n• Perform adjustments or\nreplacements for minor defects\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstratio\nn and\ninterview\n\n24 hours\n2.2 Perform basic\n preventive\n maintenance servicing\n (PMS)\n\n•\nExplain procedures in basic\npreventive maintenance servicing\n•\nEnumerate Operator’s Serviceable\nparts\n•\nExecute Basic preventive\nmaintenance servicing (PMS)\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstratio\nn and\ninterview\n\n2.3 Prepare equipment\n reports\n\n•\nExplain procedures in\naccomplishing equipment reports\n•\nAccomplish equipment reports\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstratio\nn and\ninterview\n\n--- PDF PAGE 106 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n101\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n3. Perform productive\n operation for rough\nterrain crane\n\n3.1 Travel the rough terrain\ncrane\n•\nEnumerate different road and\nweather conditions\n•\nIdentify potential hazards in work\narea\n•\nExplain procedures in responding\nto unexpected situations\n•\nPerform travel operation\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n\n120 hours\n3.2 Load and unload rough\nterrain crane to low-\nbed trailer\n•\nPerform loading and unloading of\nrough terrain crane to low-bed\ntrailer\n•\n Identify the components and\nattachments of rough terrain\ncrane\n•\nExplain and demonstrate verbal\ninstructions and hand signals\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n\n3.3 Set-up rough terrain\ncrane\n•\nIdentify potential hazards in work\narea\n•\nExplain procedures in setting-up\nrough terrain crane\n•\nExplain procedures in responding\nto unexpected situations\n•\nPerform rough terrain crane set-\nup\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n\n3.4 Interpret load chart\n and /or load moment\n indicator and construct\nlifting plan\n\n•\nRead and interpret load chart\nand/or load moment indicator\n•\nPerform load computations based\non load chart and /or load\nmoment indicator\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n\n--- PDF PAGE 107 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n102\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n3.5 Perform lifting and\n transferring of load\n\n•\nUnderstand site and weather\nconditions\n•\nExplain procedures and practices in\nlifting operation\n•\nUnderstand hand signals\n•\nExplain procedures in responding to\nunexpected situations\n•\nDemonstrate lifting and transferring\nof load\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written test\n• Observation /\nDemonstration\nand interview\n\n--- PDF PAGE 108 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n103\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 109 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n104\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction may be enhanced through\nuse of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such as\nbarangay hall, basketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n--- PDF PAGE 110 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n105\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the following\nrequirements:\n\n• At least Junior High School Level Completer or an Alternative Learning System\n(ALS) Certificate of Completion with grade 10 equivalent holder\n• Must possess good communication skills\n• Can perform basic mathematical computation\n• Driver’s License (Restriction 2 or 3)\n• Physically fit\n\n--- PDF PAGE 111 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n106\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nHEAVY EQUIPMENT OPERATION (ROUGH TERRAIN CRANE) NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set\nWrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit\nRough terrain crane\nwith camera/ monitor\nfor reverse mode\n(optional)\ncertified by Third\nParty accredited by\nDOLE-OSHC\n(Memorandum of\nAgreement (MOA)/\nrental)\n5 kgs. Multi- purpose\ngrease\n5 pcs.\nHammer ballpeen\n(3-4 lbs.)\n2\nunits\nTwo-way radio\n20\nliters\nEngine oil ( SAE\n15w40)\n5 pcs.\nPliers\n ( mechanical 10 “)\n1 unit\n Vacuum cleaner\n(heavy duty)\n20\nliters\nHydraulic / steering\nfluid (TELLUS\n68/10W)\n5 pcs.\n\nAdjustable wrench\n(8”,10”, 12”,18 “)\n1 piece for each\nsize\n1 unit\nPortable electric air\ncompressor, 180 cfm\n20\nliters\nPTO / differential\nand transfer case\ndrive (gear oil GP90/\n140)\n2 pcs.\nGrease gun (portable)\n1 unit\nHigh pressure\nwasher, 150-250 psi\n20\nliters\nAutomatic Trans-\nmission oil (ATF)\n5 pcs.\nScrew driver\n( 10”, flat )\n1 unit\nLow-bed trailer\n(MOA / rental)\n20\nliters\nManual transmission\noil GP 90/140\n5 pcs.\nScrew driver\n( 10”, Philips)\n1 unit Rough Terrain Crane\nSimulator (Optional)\nDisplay (Screen,\nMonitor),Controls,\nSoftware and\nHardware\nComponents, Seat\nwith Seatbelt, Power\nSupply (110-230 V\n50-60Hz)\n4\nliters\n Water coolant\n5 pcs.\nPutty knife\n25\npcs\nSafety\nEquipment/PPE\n(Safety vest, Gloves,\nGoggles, Dust mask,\nHard Hat)\n200\nliters\nDiesel fuel\n5 pcs.\nPry bar\n(heavy duty)\n5\npairs\nSafety\nEquipment/PPE\n(Safety Shoes)\n20\nliters\nBattery distilled\n water\n5 pcs.\nTire gauge (0-150 psi)\n\n1 set\nPrimary &\nsecondary air filter\n5 pcs.\nNylon Taglines\n(16mm x 6m)\n\n1 unit\nFire extinguisher\n\n--- PDF PAGE 112 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n107\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2 pcs\nShackle\n(2 tons capacity)\n\n1 unit\nTest weights\n- 2 tons\n2 pcs.\nShackle\n(6.5 tons capacity)\n\n1 unit\nTest weights\n - 4 tons\n2 pcs. Shackle\n(8.5 tons capacity)\n\n1 pc.\nRough terrain crane\nminiature, (1:50\nscale)\n2 pcs.\nWeb sling\n( 2 tons capacity)\n\n1 pc\nOperator’s manual\nwith load chart\n2 pcs.\nWeb sling\n( 4 tons capacity)\n\n2 pcs.\nChain sling\n( 2 tons capacity)\n\n2 pcs.\nChain sling\n( 4 tons capacity)\n\n2 pcs.\nWire rope sling\n( 2 tons capacity)\n\n2 pcs.\nWire rope sling\n( 4 tons capacity)\n\n2 pcs.\nEye bolt (4 tons)\n\n2 pcs.\nTurn buckle (4 tons)\n\n--- PDF PAGE 113 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n108\n\n3.5 TRAINING FACILITIES\n\nBased on class intake of 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nStudent/Trainee’s Working\nSpace (Maintenance Workshop)\n 2 x 2 meters\n4 sq.m per\nstudent\n100\nLecture Room\n8 x 6\n48\n48\nLearning Resource Center\n4 x 6\n24\n24\nFacilities/Equipment/ Circulation\nArea\n6.5 x 8\n52\n52\nWorking field\n20 x 75\n1,500\n1,500\nTOTAL AREA\n\n1,724\n\nNOTE: Training Center may enter into Memorandum of Agreement (MOA) with industry\n for use of facilities and heavy equipment\n\n3.6\nTRAINERS’ QUALIFICATION FOR HEAVY EQUIPMENT OPERATION (ROUGH\nTERRAIN CRANE) NC III\n\n•\nHolder of National TVET Trainer Certificate Level I (NTTC Level I) in Heavy\nEquipment Operation (Rough Terrain Crane) NC III\n•\nMust have completed the 40-Hour Construction Occupational Safety and Health\n(COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted by\nOSHC and DOLE accredited Safety Training Organizations\n•\nMust be computer-literate\n•\nMust have at least 5 years work/industry experience.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of Competency.\n\n--- PDF PAGE 114 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n109"
