ION FOR ROUGH\nTERRAIN CRANE\n\nUNIT CODE\n\n:\nCON834306\n\nUNIT DESCRIPTOR\n\n:\nThis unit involves the knowledge, skills and attitudes\nin traveling, loading and unloading to low-bed trailer,\nsetting-up, interpreting load chart and lifting operation\nfor rough terrain crane.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Travel the rough\nterrain crane\n\n1.1 Road conditions are\nconsidered before\ntravelling the crane\n1.2 Work area is surveyed for\npotential hazards in\naccordance with safe\noperating procedures.\n1.3 Outrigger assembly is\nsecured during travel in\naccordance with\nmanufacturers manual.\n1.4 Telescopic boom is\nsecured and in place\nduring travel in accordance\nwith manufacturers\nmanual.\n1.5 Travel speed is observed in\naccordance with\n traffic rules and regulations\n1.6 Hook block on front frame\nis secured in accordance\nwith manufacturers\nmanual.\n1.7 Aid of a rigger is required\non the entire operation in\naccordance with standard\noperating procedures.\n1.8 Unexpected situations\nare responded in\n line with company rules\nand regulations\n1.9 Personal Protective\nEquipment (PPE) is used\nin accordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n\n1.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Traffic rules and\nregulations\n1.3 Site and weather\nconditions\n1.4 Road worthiness\n1.5 Clearance and\ndistances\n1.6 Speed limit\n1.7 Procedures in\noperating,\ntravelling of rough\nterrain crane\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10\nWays of\nimproving\nproductivity\n\n1.1 Interpreting and\nfollowing traffic\nrules and\nregulations\n1.2 Driving skills\n1.3 Travelling the\ncrane\n1.4 Using PPE\n1.5 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 82 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n77\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Load and unload\nrough terrain crane\nto low-bed trailer\n2.1 Low-bed trailer for\ntransporting the rough\nterrain crane is selected\naccording to job\nrequirements.\n2.2 Boom position is followed\nduring loading and\nunloading in accordance\nwith manufacturer’s\nrecommendations\n2.3 Rough terrain crane\ncomponents and\nattachments are\npositioned and secured\nbased on manufacturer’s\nrecommendations.\n2.4 Verbal instructions and\nhand signals are\nconveyed with authorized\nrigger during loading and\nunloading as per standard\noperating procedures.\n2.5 All safety locks and\ncontrol levers are secured\nat neutral position before\nand after loading based\non manufacturer's\nspecifications\n2.6 Personal Protective\nEquipment (PPE) is used\nin accordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n\n2.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n2.2 Hand signals\n2.3 Site and weather\nconditions\n2.4 Clearance and\ndistances\n2.5 Procedures in\nloading and\nunloading\n2.7. Factors affecting\nproductivity\n2.8. Productivity work\nmeasurement\n2.9. Ways of\nimproving\nproductivity\n\n2.1 Interpreting verbal\ninstructions and\nhand signals\n2.2 Operating skills in\nloading and\nunloading crawler\ncrane to low-bed\ntrailer\n2.3 Using PPE\n2.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 83 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n78\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Set-up the rough\nterrain crane\n\n3.1 Site conditions are\nconsidered before\nsetting up the crane\n3.2 Crane is