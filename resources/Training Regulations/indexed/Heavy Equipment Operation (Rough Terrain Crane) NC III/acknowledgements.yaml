    {
      "source_text": "84 SECTION 3 TRAINING ARRANGEMENTS"
    },
    {
      "source_text": "These standards are set to provide technical and vocational education and training (TVET) providers with information and other important requirements to consider when designing training programs for HEAVY EQUIPMENT OPERATION (ROUGH TERRAINCRANE) NC III."
    },
    {
      "source_text": "They include information on curriculum design; training delivery; trainee entry requirements; tools and equipment; training facilities; and trainer’s qualification."
    },
    {
      "source_text": "3.1 CURRICULUM DESIGN"
    },
    {
      "source_text": "TESDA shall provide the training on the development of competency-based curricula to enable training providers develop their own curricula with the components mentioned below."
    },
    {
      "source_text": "Delivery of knowledge requirements for the basic, common and core units of competency specifically in the areas of mathematics, science/technology, communication/language and other academic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their curricula."
    },
    {
      "source_text": "Course Title: HEAVY EQUIPMENT OPERATION (ROUGH TERRAIN CRANE) NC III"
    },
    {
      "source_text": "Nominal Training Duration: 40 Hours Basic Competencies 24 Hours Common Competencies 160 Hours Core Competencies"
    },
    {
      "source_text": "40 Hours - Supervised Industry Learning (SIL)"
    },
    {
      "source_text": "Total - 264 Hours"
    },
    {
      "source_text": "Course Description:"
    },
    {
      "source_text": "This course is designed to provide the learner with knowledge, practical skills and attitude, applicable in performing work activities involve in performing pre and post-operation procedures, performing basic preventive maintenance servicing and performing productive operation for rough terrain crane. This includes classroom learning activities and practical work in actual work site or simulation area."
    },
    {
      "source_text": "Upon completion of the course, the learners are expected to demonstrate the above- mentioned competencies to be employed. To obtain this, all units prescribed for this qualification must be achieved."
    },
