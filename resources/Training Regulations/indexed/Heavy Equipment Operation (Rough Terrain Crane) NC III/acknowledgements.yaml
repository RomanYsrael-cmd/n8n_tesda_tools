    {
      "source_text": "109 SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT"
    },
    {
      "source_text": "Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards. The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to an employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all units of competency in a qualification with a promulgated Training Regulations."
    },
    {
      "source_text": "4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency."
    },
    {
      "source_text": "4.1.3 Assessment shall cover all the competencies of the qualification with the basic and common units integrated or assessed concurrently with the core units of competency."
    },
    {
      "source_text": "4.1.4 The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "Graduates of formal, non-formal and informal institutions and enterprise-based training programs"
    },
    {
      "source_text": "Experienced Workers (wage employed or self-employed)"
    },
    {
      "source_text": "4.1.5 For the renewal of valid or expired National Certificate (NC) in Heavy Equipment Operation (Rough Terrain Crane) NC II, the individual/holder will have to undergo assessment in the amended TR for Heavy Equipment Operation (Rough Terrain Crane) NC II."
    },
    {
      "source_text": "4.1.6 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry"
    },
    {
      "source_text": "-- PDF PAGE 115 --- HEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "110 4.2 COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment."
    },
    {
      "source_text": "This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    },
