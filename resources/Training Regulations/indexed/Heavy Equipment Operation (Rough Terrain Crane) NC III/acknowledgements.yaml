    {
      "source_text": "60 CORE COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : PERFORM PRE AND POST-OPERATION PROCEDURES FOR ROUGH TERRAINCRANE"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": CON834304"
    },
    {
      "source_text": "UNIT DESCRIPTOR"
    },
    {
      "source_text": ": This unit covers the knowledge, skills and attitudes in performing visual and operation check before and after productive operation of rough terrain crane."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Perform visual check of rough terrain crane"
    },
    {
      "source_text": "1.1 Capacity of rough terrain crane is selected based on job requirements. 1.2 Operator- serviceable (OS) parts are checked in accordance with equipment checklist and manufacturer’s procedures. 1.3 Inspection is performed with equipment checklist and with engine stopped/not running. 1.4 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 1.5 Work area is cleaned according to safety and environmental regulations (e.g. PD 1152 Section 6, 8 & 42). 1.6 Required output is completed based on accomplished checklist."
    },
    {
      "source_text": "1.1 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 1.2 Procedures in conducting visual check 1.3 Computation of load versus capacity of rough terrain crane 1.4 Functions of parts and components of rough terrain crane 1.5 Factors affecting productivity 1.6 Productivity work measurements 1.7 Ways of improving productivity"
    },
    {
      "source_text": "1.1 Following visual and inspection procedures 1.2 Calculating load and capacity of rough terrain crane 1.3 Identifying parts and functions 1.4 Accomplishing checklist 1.5 Using PPE 1.6 Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 66 --- HEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "61 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Perform “B L O W A F” check"
    },
    {
      "source_text": "2.1 “BLOWAF” check is performed using checklist with engine stopped/not running. 2.2 Fluid levels are maintained in accordance with equipment maintenance manual. 2.3 Abnormal conditions noted in checklist and reported to authorized person 2.4 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 2.5 Required output is completed based on accomplished checklist. 2.1 Procedures in performing “BLOWAF” check 2.2 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 2.3 Waste disposal procedures 2.4 Fluid’s level and contamination 2.5 Factors affecting productivity 2.6 Productivity work measurements 2.7 Ways of improving productivity"
    },
    {
      "source_text": "2.1 Accomplishing checklist 2.2 Applying waste disposal procedures 2.3 Following “BLOWAF” checking procedures 2.4 Determining fluid level and contamination 2.5 Using PPE 2.6 Applying productive methods and techniques"
    },
    {
      "source_text": "3. Perform visual check for super structure, lower structure and power train components"
    },
    {
      "source_text": "3.1 Super structure, lower structure and power train components are checked in accordance with checklist and manufacturer’s procedures 3.2 Super structure, lower structure and power train components are secured for safety lifting operation 3.3 Abnormal conditions are noted in checklist and reported to authorized person 3.4 Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards Requirements 3.5. Required output is completed based on accomplished checklist. 3.1 Procedures in visual check for super structure, lower structure and power train components 3.2 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 3.3 Functions of super structure, lower structure and power train components 3.4 Factors affecting productivity 3.5 Productivity work measurements 3.6.Ways of improving productivity"
    },
    {
      "source_text": "3.1 Accomplishing checklist 3.2 Following visual checking for super structure, lower structure and power train components 3.3 Identifying parts and functions 3.4 Using PPE 3.5 Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 67 --- HEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "62 ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Perform operation check"
    },
    {
      "source_text": "4.1. Starting/running check/operation check is performed with checklist and in accordance with manufacturer’s recommendations. 4.2. Mechanical components are checked for normal functioning based on manufacturer's specifications. 4.3. Function check is performed with equipment checklist and while engine is running. 4.4. Safety devices are checked for proper functions in accordance with safe operating procedures 4.5. Personal Protective Equipment (PPE) is used in accordance with Rule 1080 of Occupational Safety and Health Standards 4.6. Required output is completed based on accomplished checklist."
    },
    {
      "source_text": "4.1 Start-up and warming procedures 4.2 Procedures in inspection while the engine is running 4.3 DOLE Department Order No. 13 s. 1998 Guidelines Governing Occupational Safety and Health in the Construction Industry 4.4 Warning signs and symbols 4.5 Functions of all components and safety devices 4.6 Factors affecting productivity 4.7 Productivity work measurements 4.8 Ways of improving productivity"
    },
    {
      "source_text": "4.1. Accomplishing checklist 4.2. Following inspection procedures while the engine is running 4.3. Testing of rough terrain crane 4.4. Using PPE 4.5. Applying productive methods and techniques"
    },
    {
      "source_text": "-- PDF PAGE 68 --- HEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)"
