      "source_text": "114 GLOSARRY OF TERMS"
    },
    {
      "source_text": "1. Attachment Refers to anything like fly jib used instead of the conventional lift block to perform different types of lifting jobs."
    },
    {
      "source_text": "2. Boom (crane) Refers to telescopic boom used for supporting the hoisting tackle."
    },
    {
      "source_text": "3. Boom Length Refers to the measurement from the boom foot pins to the center of the boom point sheaves."
    },
    {
      "source_text": "4. Reeving Refers to a rope system in which the rope travels around the drums and sheaves."
    },
    {
      "source_text": "5. Telescopic Boom Refers to a component of crane attached to the superstructure and is used to support hoisting tackle. Its extended and retracted movement is controlled by hydraulic cylinder."
    },
    {
      "source_text": "6. Rough Terrain Crane Refers to equipment, which has four-wheel crab and counter steering as well as the normal two-wheel front steering capabilities. This equipment also both two-wheel and four-wheel drive capabilities to enhance its usability."
    },
    {
      "source_text": "7. Standard Refers to a degree or level of requirement set by the manufacturer."
    },
    {
      "source_text": "8. Stability Refers to the machine resistance to overturning (Rough-terrain and Truck-mounted Cranes - lifting on outriggers are based on 85 percent of their tipping capacity)."
    },
    {
      "source_text": "9. Safety Devices Refer to boom angle indicators, load moment indicators, anti-two blocking devices (where applicable), boom kick out lever, etc."
    },
    {
      "source_text": "10. Work Area Refers to any place inside the swing circle of the crane. It must be barricaded off and only those directly involve in the lift shall be allowed to entry."
    },
    {
      "source_text": "11. Derated capacity of equipment"
    },
    {
      "source_text": "12 Load Moment Indicator (LMI)"
    },
    {
      "source_text": "12. Rigging Gears"
    },
    {
      "source_text": "13. Super Structure"
    },
    {
      "source_text": "14. Lower Structure Refers to the reduction of lifting capacity of equipment as certified by a third party."
    },
    {
      "source_text": "Refers to electronic device that indicates crane configuration such as boom angle, boom length, load weight and working radius."
    },
    {
      "source_text": "Refers to equipment such as wire rope, turnbuckles, clevis, jacks, shackles, slings used with cranes and other lifting equipment in material handling and structure relocation."
    },
    {
      "source_text": "Refers to upper or lifting component of the crane which includes the boom."
    },
    {
      "source_text": "Refers to the carrier of the crane."
    },
    {
      "source_text": "-- PDF PAGE 120 --- HEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "115"
    },
    {
      "source_text": "15. Power train"
    },
    {
      "source_text": "16. Hazards"
    },
    {
      "source_text": "17. Rigger"
    },
    {
      "source_text": "18. Computer Literate"
    },
    {
      "source_text": "Refers to mechanism that transmits the drive from the engine of a vehicle to its axle."
    },
    {
      "source_text": "Refers to situation that poses threat to life, health, property, or environment."
    },
    {
      "source_text": "Refers to signalman that directs the schedule of lifts for the crane, and is responsible for the safety of the loads."
    },
    {
      "source_text": "Is defined as the knowledge and ability to utilize computers and related technology efficiently, with a range of skills covering levels from elementary use to computer programming and advanced problem solving."
