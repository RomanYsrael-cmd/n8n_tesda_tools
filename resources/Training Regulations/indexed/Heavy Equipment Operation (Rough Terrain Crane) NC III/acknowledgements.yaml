      "source_text": "2. Resource Implications 2.1. Assessment will require access to an operating plant over an extended period of time, or a suitable method of gathering evidence of operating ability over a range of situations. A bank of scenarios / case studies / what ifs will be required as well as bank of questions which will be used to probe the reason behind the observable action. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1. Observation 3.2. Case Formulation 3.3. Life Narrative Inquiry 3.4. Standardized test The unit will be assessed in a holistic manner as is practical and may be integrated with the assessment of other relevant units of competency. Assessment will occur over a range of situations, which will include disruptions to normal, smooth operation. Simulation may be required to allow for timely assessment of parts of this unit of competency. Simulation should be based on the actual workplace and will include walk through of the relevant competency components."
