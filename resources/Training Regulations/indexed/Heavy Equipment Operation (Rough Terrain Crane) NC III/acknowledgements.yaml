    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1. Examined specific workplace challenges. 1.2. Analyzed the causes of specific workplace challenges. 1.3. Formulated resolutions to specific workplace challenges. 1.4. Implemented action plans and communicated results on specific workplace challenges."
