    {
      "source_text": "10 UNIT OF COMPETENCY : APPLY CRITICAL THINKING AND PROBLEM-SOLVING"
    },
    {
      "source_text": "TECHNIQUES IN THE WORKPLACE"
    },
    {
      "source_text": "UNIT CODE : 400311321"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to solve problems in the workplace including the application of problem solving techniques and to determine and resolve the root cause/s of specific problems in the workplace."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Examine specific workplace challenges 1.1 Variances are examined from normal operating parameters; and product quality. 1.2 Extent, cause and nature of the specific problem are defined through observation, investigation and analytical techniques. 1.3 Problems are clearly stated and specified. 1.1 Competence includes a thorough knowledge and understanding of the process, normal operating parameters, and product quality to recognize non- standard situations. 1.2 Competence to include the ability to apply and explain, enough for the identification of fundamental causes of specific workplace challenges. 1.3 Relevant equipment and operational processes. 1.4 Enterprise goals, targets and measures. 1.5 Enterprise quality OHS and environmental requirement. 1.6 Enterprise information systems and data collation 1.7 Industry codes and standards. 1.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information) in examining specific challenges in the workplace. 1.2 Identifying extent and causes of specific challenges in the workplace."
    },
    {
      "source_text": "-- PDF PAGE 16 --- HEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "11"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Analyze the causes of specific workplace challenges. 2.1 Possible causes of specific problems are identified based on experience and the use of problem solving tools / analytical techniques. 2.2 Possible cause statements are developed based on findings. 2.3 Fundamental causes are identified per results of investigation conducted. 2.1 Competence includes a thorough knowledge and understanding of the process, normal operating parameters, and product quality to recognize non- standard situations. 2.2 Competence to include the ability to apply and explain, sufficient for the identification of fundamental cause, determining the corrective action and provision of recommendations. 2.3 Relevant equipment and operational processes. 2.4 Enterprise goals, targets and measures. 2.5 Enterprise quality OSH and environmental requirement. 2.6 Enterprise information systems and data collation. 2.7 Industry codes and standards. 2.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information) in examining specific challenges in the workplace. 2.2 Identifying extent and causes of specific challenges in the workplace. 2.3 Providing clear- cut findings on the nature of each identified workplace challenges."
    },
    {
      "source_text": "-- PDF PAGE 17 --- HEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)"
    },
    {
      "source_text": "12"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Formulate resolutions to specific workplace challenges 3.1 All possible options are considered for resolution of the problem. 3.2 Strengths and weaknesses of possible options are considered. 3.3 Corrective actions are determined to resolve the problem and possible future causes. 3.4 Action plans are developed identifying measurable objectives, resource needs and timelines in accordance with safety and operating procedures 3.1 Competence to include the ability to apply and explain, sufficient for the identification of fundamental cause, determining the corrective action and provision of recommendations 3.2 Relevant equipment and operational processes 3.3 Enterprise goals, targets and measures 3.4 Enterprise quality OSH and environmental requirement 3.5 Principles of decision making strategies and techniques 3.6 Enterprise information systems and data collation 3.7 Industry codes and standards 3.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information) in examining specific challenges in the workplace. 3.2 Identifying extent and causes of specific challenges in the workplace. 3.3 Providing clear- cut findings on the nature of each identified workplace challenges. 3.4 Devising, communicating, implementing and evaluating strategies and techniques in addressing specific workplace challenges."
    },
