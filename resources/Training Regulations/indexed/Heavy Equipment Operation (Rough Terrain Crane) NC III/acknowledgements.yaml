ation\n3.3 Manual data are\napplied according to\nthe given task\n3.4 All correct sequencing\nand adjustments are\ninterpreted in\naccordance with\ninformation contained\non the manual or\nspecifications\n3.1 Types of\nmanuals used in\nMasonry\n3.2 Types and\napplication of\nsymbols in\nmanuals\n3.3 Unit conversion\n3.1 Applying\ninformation from\nmanuals\n\n4. Store manuals\n4.1 Manual or specification\nis stored appropriately\nto prevent damage,\nready access and\nupdating of information\nwhen required in\naccordance with\ncompany requirements\n\n4.1 Types of\nmanuals used in\nMasonry\n4.2 Manual storing\nand maintaining\nprocedures\n\n1.1 Storing and\nmaintaining\nmanuals\n\n--- PDF PAGE 52 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n47\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\n\nMay include:\n1.1 Manufacturer's Specification Manual\n1.2 Maintenance Procedure Manual\n1.3 Periodic Maintenance Manual\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 All manuals/catalogues relative to construction sector\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 53 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n48\nUNIT OF COMPETENCY\n:\nINTERPRET DRAWINGS AND PLANS\n\nUNIT CODE\n\n:\nCON311202\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the k