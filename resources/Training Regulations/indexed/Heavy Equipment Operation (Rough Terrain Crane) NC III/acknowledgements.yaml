nskills and\nadjust problem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementatio\nn of OSH\nprograms in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 118 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n113\n\nPerform pre and post\noperation procedures for\ntruck mounted crane\n\nPerform basic preventive\nmaintenance servicing\nfor truck mounted crane\n\nPerform productive\noperation for truck\nmounted crane\n\nPerform pre and post\noperation procedures for\nrough terrain crane\n\nPerform basic preventive\nmaintenance servicing\nfor rough terrain crane\n\nPerform productive\noperation for rough\nterrain crane\n\nPerform pre and post\noperation procedures for\ncrawler crane\n\nPerform basic preventive\nmaintenance servicing\nfor crawler crane\n\nPerform productive\noperation for crawler\ncrane\n\nPerform pre and post\noperation procedures for\nforklift\n\nPerform basic preventive\nmaintenance servicing\nfor forklift\n\nPerform productive\noperation for forklift\n\nPerform pre and post\noperation procedures for\ntower crane\n\nPerform basic preventive\nmaintenance servicing\nfor tower crane\nPerform productive\noperation for tower care\n\nPerform pre and post\noperation procedures for\noverhead and gantry\ncrane\nPerform basic preventive\nmaintenance servicing\noverhead and gantry\ncrane\n\nPerform productive\noperation for overhead\nand gantry crane\n\nPerform pre and post\noperation procedures for\nhydraulic excavator\n\nPerform basic preventive\nmaintenance servicing\nfor hydraulic excavator\nPerform productive\noperation for hydraulic\nexcavator\n\nPerform pre and post\noperation procedures for\non-highway dump truck\n(rigid)\nPerform basic preventive\nmaintenance servicing\nfor on-highway dump\ntruck (rigid)\nPerform productive\noperation for on-highway\ndump truck (rigid)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 119 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n114\nGLOSARRY OF TERMS\n\n1. Attachment\nRefers to anything like fly jib used instead of the conventional lift\nblock to perform different types of lifting jobs.\n\n2. Boom (crane)\nRefers to telescopic boom used for supporting the hoisting\ntackle.\n\n3. Boom Length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n\n4. Reeving\nRefers to a rope system in which the rope travels around the\ndrums and sheaves.\n\n5. Telescopic Boom\nRefers to a component of crane attached to the superstructure\nand is used to support hoisting tackle. Its extended and retracted\nmovement is controlled by hydraulic cylinder.\n\n6. Rough Terrain\nCrane\nRefers to equipment, which has four-wheel crab and counter\nsteering as well as the normal two-wheel front steering\ncapabilities. This equipment also both two-wheel and four-wheel\ndrive capabilities to enhance its usability.\n\n7. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n\n8. Stability\nRefers to the machine resistance to overturning (Rough-terrain\nand Truck-mounted Cranes - lifting on outriggers are based on\n85 percent of their tipping capacity).\n\n9. Safety Devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n\n10. Work Area\nRefers to any place inside the swing circle of the crane. It must\nbe barricaded off and only those directly involve in the lift shall\nbe allowed to entry.\n\n11. Derated capacity\nof equipment\n\n12 Load Moment\n Indicator (LMI)\n\n12. Rigging Gears\n\n13. Super Structure\n\n14. Lower Structure\nRefers to the reduction of lifting capacity of equipment as\ncertified by a third party.\n\nRefers to electronic device that indicates crane configuration\nsuch as boom angle, boom length, load weight and working\nradius.\n\nRefers to equipment such as wire rope, turnbuckles, clevis,\njacks, shackles, slings used with cranes and other lifting\nequipment in material handling and structure relocation.\n\nRefers to upper or lifting component of the crane which includes\nthe boom.\n\nRefers to the carrier of the crane.\n\n--- PDF PAGE 120 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n115\n\n15. Power train\n\n16. Hazards\n\n17. Rigger\n\n18. Computer Literate\n\nRefers to mechanism that transmits the drive from the engine of\na vehicle to its axle.\n\nRefers to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to signalman that directs the schedule of lifts for the\ncrane, and is responsible for the safety of the loads.\n\nIs defined as the knowledge and ability to utilize computers and\nrelated technology efficiently, with a range of skills covering\nlevels from elementary use to computer programming and\nadvanced problem solving.\n\n--- PDF PAGE 121 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n116\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHeavy Equipment Operation (Rough Terrain Crane) NC III\nQualification Code:\nCONRTC319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHEO (Rough Terrain\nCrane) NC II\n2007-20 /\nN/A\n01\nDocument Amended\n\nHEO (Rough Terrain\nCrane) NC III\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 122 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n117\nACKNOWLEDGMENTS\n\nThe Technical Educati