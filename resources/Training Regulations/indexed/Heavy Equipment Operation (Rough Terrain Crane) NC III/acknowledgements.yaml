      "source_text": "2.1 Measurements are obtained according to job requirements 2.2 Alternative measuring tools are used without sacrificing cost and quality of work 2.3 Calculations needed to complete work tasks are performed using the four basic process of addition (+), subtraction (-), multiplication (x) and division (/) 2.4 Calculations involving fractions, percentages and mixed numbers are used to complete workplace tasks 2.5 Numerical computation is self- checked and corrected for accuracy 2.6 Instruments are read to the limit of accuracy of the tool 2.7 Systems of measurement identified and converted according to job requirements/ISO 2.8 Workpieces are measured according to job requirements"
    },
    {
      "source_text": "2.1 Linear measurement 2.2 Unit conversion 2.3 Ratio and proportion 2.4 Area"
    },
    {
      "source_text": "2.1 Interpreting formulas for volume, areas, perimeters of plane and geometric figures 2.2 Handling of measuring instruments"
