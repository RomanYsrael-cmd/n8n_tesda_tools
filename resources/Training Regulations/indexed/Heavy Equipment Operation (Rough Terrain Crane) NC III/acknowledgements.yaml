    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1. Maintained or improved individuals and/or team performance given a variety of possible scenario 1.2. Assessed and monitored team and individual performance against set criteria 1.3. Represented concerns of a team and individual to next level of management or appropriate specialist and to negotiate on their behalf 1.4. Allocated duties and responsibilities, having regard to individual’s knowledge, skills and aptitude and the needs of the tasks to be performed 1.5. Set and communicated performance expectations for a range of tasks and duties within the team and provided feedback to team members 2. Resource Implications The following resources should be provided: 2.1. Access to relevant workplace or appropriately simulated environment where assessment can take place 2.2. Materials relevant to the proposed activity or task 3. Methods of Assessment Competency in this unit may be assessed through: 3.1. Written Examination 3.2. Oral Questioning 3.3. Portfolio 4. Context for Assessment 4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center."
