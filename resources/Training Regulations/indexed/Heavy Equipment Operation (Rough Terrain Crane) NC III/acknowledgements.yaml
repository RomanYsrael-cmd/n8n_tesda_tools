      "source_text": "SECTION 1 HEAVY EQUIPMENT OPERATION (ROUGH TERRAIN CRANE)"
    },
    {
      "source_text": "The HEAVY EQUIPMENT OPERATION (ROUGH TERRAIN CRANE) NC III qualification consists of competencies that workers must achieve to enable them to perform tasks such as inspection, basic preventive maintenance, interpreting load chart, constructing lifting plan and, lifting and transferring of heavy loads in construction sites or other locations with the use of a rough terrain crane."
    },
    {
      "source_text": "This qualification is packaged from the competency map of Construction - Heavy Equipment sub-sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311202 Interpret drawings and plans CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES CON834304 Perform pre and post-operation procedures for rough terrain crane CON834305 Perform basic preventive maintenance servicing for rough terrain crane CON834306 Perform productive operation for rough terrain crane"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a –"
    },
    {
      "source_text": "❑ Rough terrain crane operator CODE NO. BASIC COMPETENCIES 400311319 Lead workplace communication 400311320 Lead small teams 400311321"
    },
    {
      "source_text": "400311322 Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment 400311323"
