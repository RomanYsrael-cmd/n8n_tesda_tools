  "source_text": "SECTION 1 HEAVY EQUIPMENT OPERATION (ROUGH TERRAIN CRANE)\n\nThe HEAVY EQUIPMENT OPERATION (ROUGH TERRAIN CRANE) NC III qualification\nconsists of competencies that workers must achieve to enable them to perform tasks such as\ninspection, basic preventive maintenance, interpreting load chart, constructing lifting plan and,\nlifting and transferring of heavy loads in construction sites or other locations with the use of a\nrough terrain crane.\n\nThis qualification is packaged from the competency map of Construction - Heavy\nEquipment sub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311202\nInterpret drawings and plans\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON834304\nPerform pre and post-operation procedures for rough terrain crane\nCON834305\nPerform basic preventive maintenance servicing for rough terrain crane\nCON834306\nPerform productive operation for rough terrain crane\n\nA person who has achieved this Qualification is competent to be a –\n\n❑ Rough terrain crane operator\nCODE NO.\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n\n400311322\nApply critical thinking and problem-solving techniques in\nthe workplace\nWork in a diverse environment\n400311323\n\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in\nthe organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium\nenterprises (MSMEs)\n\n--- PDF PAGE 7 ---\nHEAVY EQUIPMENT OPERATION (Rough Terrain Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n2"
