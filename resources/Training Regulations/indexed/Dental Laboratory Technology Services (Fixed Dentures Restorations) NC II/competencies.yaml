\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation and\ndiscussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified time\nframe\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge\n2.1\nSight and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning skills\n3.1\nCapacity to plan and prioritize work loads and requirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test\n5.2\nDemonstration with questioning\n5.3 Observation with questioning\n5.4 Oral questioning/Interview\n6. Context of\nassessment:\n6.1\nAssessment may be done in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 24 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n20\nUNIT OF COMPETENCY :\nFOLLOW OCCUPATIONAL HEALTH AND SAFETY POLICIES\nIN DENTAL LABORATORY FACILITIES\n\nUNIT CODE\n:\nHCS346204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\napplying relevant OHS legislation and codes of practice, including\nduties and responsibilities for all parties under general duty of care.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nFollow workplace\nprocedures for\nhazard identification\nand risk control\n\n1.1\nHazards in the work area are recognized and reported to\nsupervisor in accordance with workplace procedures.\n1.2\nWorkplace procedures and work instructions for\ncontrolling risks, including infection control, are followed\naccurately.\n1.3\nWorkplace procedures for dealing with accidents, fires and\nemergencies are followed where necessary.\n2\nContribute to the\nmanagement of\nOHS\n2.1\nOHS issues are raised with designated personnel and co-\nworkers as appropriate.\n2.2\nContributions are made as appropriate to workplace OHS\ndiscussions.\n3\nUtilize and\nimplement\nstrategies as\ndirected to prevent\ninfection in the\nworkplace\n3.1\nThe environment is kept clean and tidy.\n3.2\nPersonal hygiene practices are followed.\n3.3\nAny items that may be contaminated are disposed of safely.\n4\nUtilize strategies to\nprevent stress\noverload\n4.1\nNominated rest time and breaks are taken.\n4.2\nSources of stress are identified and issues raised with\nsupervisor.\n4.3\nWork roles are clarified and followed.\n5\nWork in a safe\nmanner\n5.1\nDefined procedures are followed to ensure personal safety.\n5.2\nAll work is carried out in a manner which ensures safety\nof self and others\n5.3\nOrganizational security measures are followed.\n5.4\nSafe manual handling procedures are followed.\n\n--- PDF PAGE 25 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nWorkplace\nprocedures for\ncontrolling risks\n\nMay include:\n1.1\nManual handling techniques\n1.2\nSafe handling, storage and disposal of inflammable or\npotentially dangerous substances\n1.5\nStrategies for reducing the amount of manual handling\nrequired\n2.\nStress\nMay include:\n2.1\nHealth problems\n2.2\nChanges in behavior\n2.3\nFrequent absences\n2.4\nNegative attitudes\n2.5\nUnawareness of own stress levels\n3.\nRest time and\nbreaks\nMay include:\n3.1\nMorning and afternoon tea, lunch, dinner breaks\n4.\nWorkplace\nprocedures\nMay include:\n4.1\nGrievance procedures\n4.2\nTeam meetings\n4.3\nIncident reports\n4.4\nDebriefing procedures following crisis\n4.5\nSmoke free environment\n5.\nItems that may be\ncontaminated\nMay include:\n5.1\nWork surfaces\n5.2\nClothing\n6.\nWorking in a\nmanner that\nensures personal\nsafety\nMay include:\n6.1\nCarrying communication equipment\n6.2\nUsing personal protection equipment\n6.3\nSafe work practices for handling sharps and other hazards in\ndental laboratory practice\n6.4\nCarrying alarms\n6.5\nMaintaining infection control in dental laboratory practice\n7.\nOrganizational\nsecurity measures\nMay include:\n7.1\nLocking doors\n7.2\nAlarm system\n7.3\nContracted security personnel\n\n--- PDF PAGE 26 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n22\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nWorked safely and followed OHS policies and procedures in\ndental laboratory practice\n1.2\nComplied with DOH infection control guidelines\n1.3\nContributed to the management of OHS\n1.4\nUtilized and implemented strategies as directed to prevent\ninfection in the workplace\n1.5\nUtilized strategies to prevent stress overload\n1.6\nWorked in a safe manner\n2. Underpinning\nknowledge\n2.1\nCompliance with OHS policy and procedures and infection\ncontrol guidelines and procedures\n2.2\nKnowledge of potential hazards in the workplace\n2.3\nKnowledge of laboratory waste disposal methods\n2.4\nKnowledge of personal hygiene and personal protection\nincluding immunization\n2.5\nKnowledge of legislative requirements and best practice\napproaches to OHS\n2.6\nEmergency procedures\n3. Underpinning skills\n3.1\nManual handling techniques\n3.2\nSafe handling techniques\n3.3\nCorrect use of equipment, instruments and materials in\naccordance with manufacturer specifications\n3.4\nTechnology used to work safely and competently\n3.5\nSafe work practices to prevent or minimize risk\n3.6\nReading and writing skills\n3.7\nOral communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational policies and\nprocedures manuals such as:\n4.1.1 Incident reporting procedures\n4.1.2 OHS policy and procedures\n4.1.3 Infection control guidelines (DOH)\n4.1.4 Waste management policies\n4.1.5 Relevant state legislation\n4.1.6 Manufacturer’s instructions for the use of relevant\nequipment, instruments and materials\n4.1.7 Material Safety Data Sheets (MSDs)\n5\nMethod of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nOral questioning/Interview\n5.3\nPortfolio\n5.4\nThird Party Report\n6\nContext of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 27 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n23\nUNIT OF COMPETENCY :\nMAINTAIN INFECTION CONTROL IN DENTAL LABORATORY\nPRACTICE\n\nUNIT CODE\n:\nHCS346205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ncomply with infection control procedures before, during and after\nhealth care procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nMonitor and\nmaintain the\ncleanliness of the\ndental laboratory\n\n1.1\nAppropriate personal protective wear is used during cleaning\nof equipment and surfaces.\n1.2\nAppropriate disinfectants and cleaning equipment are\nselected, prepared and used on surfaces in accordance with\nthe manufacturer’s specification.\n1.3\nUsed surface covers, if applicable, are removed and replaced\nin a manner to prevent cross contamination.\n1.4\nCleaning equipment is correctly stored.\n1.5\nAll surfaces including internal storage units within the dental\nlaboratory are monitored and maintained for cleanliness.\n2\nClean and disinfect\ndental laboratory\n/instruments and\nequipment\n2.1\nDental laboratory instruments and equipment are cleaned of\nbio-burden and lubricated, where appropriate, prior to cleaning\nand disinfecting.\n2.2\nDental laboratory instruments and equipment are checked for\nfaults and disassembled where appropriate.\n2.3\nPrior to cleaning of dental laboratory instruments and\nequipment are loaded safely and effectively.\n2.4\nAppropriate cleaning procedures are carried out in the correct\nsequence and duration in accordance with manufacturer\nspecifications.\n2.5\nRegular maintenance program including faults and incidences\nare recognized, reported and documented.\n\n--- PDF PAGE 28 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n24\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3\nMaintain hygiene\nand personal\nprotection\n\n3.1\nHand washing procedures are correctly followed.\n3.2\nOpen cuts and abrasions are covered with a waterproof\ndressing.\n3.3\nAppropriate personal protection wear is correctly worn.\n3.4\nImmunization is undertaken in accordance with current\nrecommendations for dental health care worker.\n3.5\nAll work is carried out in a manner that minimizes the risk of\ncross contamination and complies with OHS policy and\nprocedures.\n3.6\nHazards in the dental laboratory is recognized and reported to\noperator.\n3.7\nAppropriate procedures for dealing with accidents, including\nsharp injuries, are followed correctly.\n4\nDispose of dental\nlaboratory waste\nsafely\n4.1\nAppropriate protective clothing is worn or used in accordance\nwith OHS policy and procedures when handling waste.\n4.2\nWaste is segregated, contained, stored and transported\ncorrectly.\n4.3\nDamaged and/or pre-packed items are disposed of safely.\n4.4\nWaste is disposed of safely.\n5\nUndertake the\nnecessary\nmeasures to ensure\nprevention of\ntransmission of\ninfection\n5.1\nRisks of cross contamination are identified and appropriate\nresponses implemented within dental practice.\n5.2\nClean, contaminated and administrative zones are clearly\nidentified and maintained.\n5.3\nInstruments, materials, medicaments and equipment are set\nup prior to commencement of treatment where appropriate.\n5.4\nOne-way workflow from clean to dirty zone is maintained.\n5.5\nRisk of transmission of infection is minimized in all dental\nlaboratory related and administrative procedures.\n5.6\nSpills are removed correctly.\n\n--- PDF PAGE 29 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nInfection control\nguidelines and\nprocedures\nMay include but are not limited to:\n1.1\nCurrent DOH guidelines for infection control in health care\nsettings\n1.2\nStandard Precautions and Additional Precautions as defined\nby DOH\n1.3\nDental laboratory practice/organizational policy procedures\nand infection control guidelines and procedures\n1.4\nMaterial Safety Data Sheets (MSDS)\n1.5\nLocal government ordinances\n1.6\nLegislative requirements\n2.\nPersonal protective\nwear\nMay include but not limited to:\n2.1\nSterile and non sterile gloves including heavy duty\n2.2\nMasks\n2.3\nEye protection\n2.4\nEnclosed footwear\n2.5\nGowns\n2.6\nAprons\n3.\nCleaning equipment\nMay include but is not limited to:\n3.1\nUltrasonic cleaner\n3.2\nManual cleaning with a range of brushes\n3.3\nDrying\n3.4\nBuckets and mops\n4\nWaste segregation\nMay include but is not limited to:\n4.1\nClinical and related waste\n4.2\nInfectious waste\n4.3\nSharps\n4.4\nGeneral waste\n4.5\nOther hazardous substances\n5\nRequirements for\nsafe disposal of\nwaste\nMay be determined by:\n5.1\nMain drainage\n5.2\nLocal government ordinances\n5.3\nMaterial Safety Data Sheet (MSDS)\n\n--- PDF PAGE 30 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n26\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of infection risks in health\nenvironment and specifically in dental laboratory practice\n1.2\nComplied with current DOH infection control guidelines and\nprocedures, OHS and legislative requirements\n1.3\nHandled waste safely managed procedures in accordance\nwith legislative requirements\n1.4\nSelected and used appropriate cleaning agents for particular\nsurfaces and equipment in accordance with the\nmanufacturer’s specifications\n2.\nUnderpinning\nknowledge\n2.1\nKnowledge on how infection is spread, cross infection and\nprevention strategies\n2.2\nKnowledge of relevant OHS policies and procedures\n2.3\nLimitations, properties and precautions required of\ndisinfectants and decontaminates\n2.4\nKnowledge of potential hazards in a health environment\n2.5\nKnowledge of currently available vaccinations against\ntransmissible disease\n2.6\nKnowledge of dental laboratory waste disposal methods\n3.\nUnderpinning skills\n3.1\nApplying standard and additional precautions\n3.2\nUsing safe work practices to minimize the risk of transmission\nof infection\n3.3\nSelecting and using appropriate chemicals in cleaning and\nsanitizing\n3.4\nUsing correct hand washing and hand care techniques\n3.5\nUsing correct hygiene procedures\n3.6\nSelecting and using equipment and cleaning agents effectively\n3.7\nUsing procedures appropriate to the cleaning area and\npurpose\n3.8\nMinimizing disruption to the work environment\n3.9\nMinimizing safety hazards for self and others\n3.10 Using time management strategies to set priorities\n3.11\nUsing technology to work safely and competently\n4.\nResource\nimplications\n\nThe following resources MUST be provided:\n4.1\nRelevant dental laboratory practice/organizational policy and\nprocedures\n4.2\nIncident reporting procedures\n4.3\nOccupational health and safety policy and procedures\n4.4\nInfection control guidelines\n4.5\nWaste management policies\n4.6\nRelevant state legislations\n4.7\nManufacturer’s instructions for the use of relevant equipment,\ninstruments, medicaments, materials and Material Safety Data\nSheets (MSDS)\n4.8\nCleaning agents currently used in the workplace\n\n--- PDF PAGE 31 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n27\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n5.4\nPortfolio\n5.5\nThird Party Report\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated work setting.\n\n--- PDF PAGE 32 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n28\n\nUNIT TITLE\n:\nOPERATE A PERSONAL COMPUTER\nUNIT CODE\n:\nICT311201\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a personal\ncomputer by: starting the PC, logging in, using and working with\nfiles, folders and programs, saving work, and closing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Start the\ncomputer\n\n1.1\nThe peripheral devices are properly connected\n1.2\nPower is checked and the computer and peripheral devices are\nswitched on\n1.3\nProper logging in and logging off is successfully done\n1.4\nThe operating system features and functions are accessed and\nnavigated\n1.5\nHardware configuration and other system features are checked\n2. Arrange and\ncustomize\ndesktop display/\nWindows\nsettings\n\n2.1\nThe desktop screen or Windows elements are changed as needed\n2.2\nDesktop icons are added, renamed, moved, copied or deleted\n2.3\nThe online help functions are accessed or used as needed\n2.4\nDesktop icons of application programs are selected, opened and\nclosed\n2.5\nProperties of icons are displayed\n2.6\nComputer or desktop settings are saved and restored\n3. Work with files\nand folders (or\ndirectories)\n\n3.1\nA file or folder is created, opened, moved, renamed or copied\n3.2\nFiles are located, deleted and restored\n3.3\nDetails and properties of files and folders are displayed or viewed\n3.4\nVarious files are organized for easy lookup and use\n3.5\nFiles and information are searched\n3.6\nDisks are checked, erased or formatted as necessary\n4. Work with user\napplication\nprograms\n4.1\nApplication programs are added, changed, removed or ran\n4.2\nUser software or application program are installed, updated and\nupgraded\n4.3\nInformation/data are moved between documents or files\n5. Print\ninformation\n5.1\nPrinter is added or installed and correct printer settings is ensured\n5.2\nDefault printer is assigned accordingly\n5.3\nInformation or document is printed on the installed printer\n5.4\nProgress of print jobs are viewed and deleted as required\n6. Shut down\ncomputer\n6.1\nAll open application programs are closed\n6.2\nComputer and peripheral devices are properly shut down\n\n--- PDF PAGE 33 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n29\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Peripheral device\nThis may include but is not limited to:\n1.1 mouse\n1.2 keyboard\n1.3 monitor or visual display unit\n1.4 printer\n1.5 scanner\n2. Computer\nMay include:\n2.1 Laptops/notebooks\n2.2 Workstations\n2.3 Servers\n2.4 other personal computer devices\n3. Application\nprograms\nCan include:\n3.1 user programs\n3.2 database programs\n3.3 word processors\n3.4 email programs\n3.5 Internet browsers\n3.6 system browsers\n3.7 spreadsheets\n4. Operating system\nMay include but is not limited to the various versions and variants of:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n\n5. System features\nMay include but is not limited to the operating system features and\nhardware features like:\n5.1 memory size\n5.2 disk capacities\n5.3 video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 wireless and infrared connections.\n\n--- PDF PAGE 34 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n30\n\nVARIABLE\nRANGE\n6. Online help\nfunctions\n6.1 An instruction manual, or a portion of the manual, integrated and\naccessible from within the program or software being used.\n7. Properties\nIndicates the description of the file or folder to include the:\n7.1 file name\n7.2 type of file\n7.3 file size\n7.4 date created and modified\n7.5 attributes (hidden, read-only).\n8. Various files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n9. Disks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 zip disks\n9.6 flash drives\n9.7 memory sticks\n9.8 hard drives\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 page layout\n10.2 paper size\n10.3 ink/cartridge type\n10.4 number of copies\n10.5 page orientation\n\n--- PDF PAGE 35 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n31\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof Competency\n1.1 Assessment must confirm the ability to utilize software, navigate\nthe desktop, using system features to perform tasks and save\nresults of work.\n2.\nUnderpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware components\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n3.\nUnderpinning\nSkills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or disk\nstorage\n3.2 Mouse and keyboarding skills for running software applications\n3.3 Reading and writing at a level where basic workplace documents\nare understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions using a\npersonal computer whether standalone or in a networked\nenvironment\n4.\nResource\nImplications\nTo demonstrate competence in this unit access to the following\nresources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n5.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the workplace or in a simulated\nwork environment.\n\n--- PDF PAGE 36 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n32\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nFABRICATE METAL CROWN AND BRIDGE STRUCTURES\nUNIT CODE\n:\nHCS322335\n\nUNIT DESCRIPTOR\n:\nThis unit involves fabrication of metal alloy, crown and bridge\nstructures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nsectionalized\nmodels\n1.1\nModels are sectioned.\n1.2\nMargins are identified and models are trimmed.\n1.3\nMargins are hardened if required.\n2.\nWax and invest\nfixed partial\ndentures and\nstructures\n2.1\nCrown and bridge restorations are waxed up.\n2.2\nCrown and bridge wax pattern is sprued and prepared for\ninvesting.\n2.3\nAppropriate investment material is selected and wax patterns\nare selected.\n2.4\nWax patterns are invested.\n3.\nBurn-out cast and\nfinish alloy fixed\npartial dentures and\nstructures\n3.1\nBurnout techniques are selected appropriate to the technique.\n3.2\nMetal restorations are cast in appropriate alloy.\n3.3\nMetal restoration is devested without damaging casting.\n3.4\nMetal restoration is trimmed and polished while maintaining all\ncontact areas and margin.\n\n--- PDF PAGE 37 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Construction of crown and\nbridges structures\n\nMay include but are not limited to:\n1.1\nA range of designs\n1.2\nAnterior and posterior teeth\n1.3\nMetal inlays, crowns and bridges\n1.4\nCeramic fused to metal sub structures\n2. Alloy\nMay include but are not limited to:\n2.1\nCobalt chromium based alloys\n2.2\nGold alloys\n2.3\nMetal/ceramic alloys\n3. Restoration\nMay include but are not limited to:\n3.1\nComplete and partial dentures\n3.2\nCrown and bridge\n3.3\nImplant\n3.4\nSplints\n\n--- PDF PAGE 38 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n34\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared and sectionalized models\n1.2\nWaxed and invested fixed partial dentures and structures\n1.3\nBurned-out cast and finished alloy fixed partial dentures and\nstructures\n1.4\nApplied the different principles, policies and techniques on\ncasting, spruing, soldering, waxing, investing and finishing\n1.5\nFollowed OH&S and Department of Health infection control\nguidelines\n2. Underpinning\nknowledge\nKnowledge and principles on:\n2.1\nCasting techniques\n2.2\nSpruing techniques\n2.3\nTooth morphology\n2.4\nArticulation and occlusion\n2.5\nRelevant material science for carrying out procedures\n2.6\nSoldering techniques\n2.7\nWax and plastic pattern techniques\n2.8\nInvesting techniques\n2.9\nOccupation Health and Safety\n2.10 Finishing techniques\n2.11 Current DOH infection control guidelines\n2.12 Dental Policies and Procedures\n2.13\nRegulatory and Legislation Requirements\n3. Underpinning skills\n3.1\nCasting techniques\n3.2\nSpruing techniques\n3.3\nSoldering techniques\n3.4\nWax and plastic pattern techniques\n3.5\nInvesting techniques\n3.6\nFinishing technique\n3.7\nManual dexterity\n3.8\nAbility to work as part of the team\n3.9\nPlanning of work\n3.10 Language, literacy and numeracy skills appropriate to the role\nand workplace requirements\n3.11 Operational skills to consistently use time effectively and\nprovide quality customer service in the dental environment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nA real simulated dental environment\n4.2\nRelevant documentation such as:\n4.2.1 dental policies and procedures\n4.2.2 regulatory and legislation requirements as appropriate\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird party Report\n5.4\nPortfolio\n6. Context of\nassessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 39 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n35\n\nUNIT OF COMPETENCY :\nFABRICATE CERAMIC RESTORATIONS\n\nUNIT CODE\n:\nHCS322336\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in fabricating\nceramic restorations and fixed partial dentures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nPrepare sub-\nstructures\n1.1\nSub-structure is assessed for accuracy and appropriateness.\n1.2\nSub-structure conformed to standard guidelines.\n1.3\nStructure is prepared for porcelain build-up.\n1.4\nSub-structure is treated according to manufacturer’s\nguidelines.\n2\nSelect and apply\nceramics\n2.1\nPorcelains appropriate to the procedure is selected and\napplied.\n2.2\nOperator requirements are selected and applied.\n3\nTrim, shape and\nfinish restorations\n3.1\nCeramic restoration is trimmed to required anatomical shape.\n3.2\nCeramic restoration is completed to meet the clinically\naccepted standards.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedures\nProcedures to include crowns and bridges of the following types:\n1.1\nCeramic fused to precious, semi-precious and non-precious\nmetal/alloy\n1.2\nAll ceramic restorations\n1.3\nCeramic veneers, inlays and onlays\n1.4\nCastable ceramic\n2. Restoration\nMay include but not limited to:\n2.1\nComplete and partial\n2.2\nCrown and bridge\n2.3\nImplant\n2.4\nSplint\n\n--- PDF PAGE 40 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n36\nEVIDENCE GUIDE\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared sub-structures\n1.2\nSelected and applied ceramics\n1.3\nTrimmed, shaped and finished restorations\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies\n2.\nUnderpinning\nknowledge\n2.1\nCeramics\n2.2\nMetallurgy\n2.3\nColor\n2.4\nScience\n2.5\nCurrent DOH infection control guidelines\n2.6\nOral Anatomy\n2.7\nCause of faults during fabrication\n2.8\nRationale for processes and procedures\n2.9\nPrinciples of occlusion\n2.10 Industry Codes of Practice\n2.11 Relevant Laws as appropriate\n2.12 Housekeeping and Maintenance Procedures\n3.\nUnderpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nCarving teeth\n3.4\nAccuracy\n3.5\nEfficient use of materials\n3.6\nAnalyzing faults\n3.7\nMaintaining personal hygiene\n3.8\nFollowing correct measurements\n3.9\nPlanning and organizing work activities\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRelevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3\nA qualified workplace assessor and/or a technical expert\nworking in partnership with assessor\n\n--- PDF PAGE 41 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n37\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nWritten Test/Examination\n5.3\nThird Party Report\n5.4\nPortfolio\n6.\nContext of\nassessment\n6.1 Competency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 42 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n38\n\nUNIT OF COMPETENCY :\nFABRICATE INDIRECT COMPOSITE/POLYMER FIXED\nRESTORATIONS\n\nUNIT CODE\n:\nHCS322337\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in fabricating\nindirect composite/polymer fixed restorations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPrepare model\n1.1\nWork order is interpreted.\n1.2\nModel is treated as required.\n1.3\nSub-structure (if used) is treated for application of material.\n2.\nFabricate\nrestoration\n2.1\nAppropriate system is selected.\n2.2\nMargin is indicated as required.\n2.3\nMaterials are selected.\n2.4\nMaterials are mixed or manipulated.\n2.5\nMaterials are applied and adapted.\n2.6\nSurface of the restoration is treated if required.\n2.7\nMaterial is processed to industry standard.\n3.\nTrim, shape and\nfinish restoration\n3.1\nRotary trimmers are selected.\n3.2\nShape is refined.\n3.3\nRestoration is finished according to work order requirements.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nRestorations\nMay include but are not limited to:\n1.1\nSingle full crowns\n1.2\nBridges\n1.3\nMaryland bridges\n1.4\nImplant supported restorations\n1.5\nVeneers\n1.6\nInlays\n1.7\nHalf and three-quarter crowns\n1.8\nOn-lays\n\n--- PDF PAGE 43 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n39\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared model\n1.2\nFabricated restoration\n1.3\nTrimmed, shaped and finished restoration\n1.4\nComplied with infection control policies and procedures\n1.5\nFollowed OH&S policies\n2.\nUnderpinning\nknowledge\n2.1\nRelevant material science for carrying out procedures\n2.2\nArticulation and occlusion\n2.3\nTooth morphology\n2.4\nOral anatomy\n2.5\nColor\n2.6\nCurrent DOH infection control guidelines\n2.7\nMetallurgy\n2.8\nPolymer science\n2.9\nIndustry Codes of Practice\n2.10 Relevant Laws as appropriate\n2.11 Housekeeping and Maintenance Procedures\n3\nUnderpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nCarving restorations\n3.4\nMatching of color and shades\n3.5\nAnalyzing of faults\n3.6\nMaintaining personal hygiene\n3.7\nUse of materials\n3.8\nPlanning and organizing work activities\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRelevant documentation such as:\n4.2.1 industry codes of practice\n4.2.2 state legislation as appropriate\n4.2.3 housekeeping/maintenance procedures\n4.3\nColor and shades of teeth\n4.4\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n\n--- PDF PAGE 44 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n40\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written Test/Examination\n5.3 Third Party Report\n5.4 Portfolio\n6.\nContext of\nassessment\n6.1\nCompetency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 45 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n41\nUNIT OF COMPETENCY :\nJOIN ALLOY STRUCTURES\n\nUNIT CODE\n:\nHCS322338\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in joining alloy\nstructures through thermal processes.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSolder components\n1.1\nComponent materials are identified.\n1.2\nAppropriate solder and flux are selected.\n1.3\nAppropriate heating methods are selected.\n1.4\nComponents are selected and soldered.\n1.5\nComponents are cleaned, trimmed, shaped and finished.\n1.6\nComponents are disinfected according to DOH guidelines.\n2.\nWeld components\n2.1\nComponent materials are identified.\n2.2\nAppropriate welding techniques are selected.\n2.3\nComponents are welded.\n2.4\nComponents are cleaned, trimmed, shaped and finished.\n2.5\nComponents are disinfected according to DOH guidelines.\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Component materials May include but are not limited to:\n1.1\nSolder and flux\n1.2\nSoldering investment\n2. Heating methods\nMay include but are not limited to:\n2.1\nOpen flame\n2.2\nLaser\n\n--- PDF PAGE 46 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n42\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSoldered components\n1.2\nWelded components\n1.3\nComplied with infection control policies and procedures\n1.4\nFollowed OH&S policies\n2.\nUnderpinning\nknowledge\n2.1\nDental alloys\n2.2\nOrthodontic wires\n2.3\nSolder and Fluxes\n2.4\nSoldering and welding techniques\n2.5\nFinishing methods\n2.6\nOH&S and materials safety data sheets\n2.7\nIndustry Codes of Practice\n2.8\nRelevant Laws as appropriate\n2.9\nHousekeeping and Maintenance Procedures\n3\nUnderpinning skills\n3.1\nManual dexterity\n3.2\nMaintaining a healthy and safe working environment\n3.3\nSoldering and welding techniques\n3.4\nFinishing methods\n3.5\nPlanning and organizing work activities\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1\nA real or simulated dental laboratory environment\n4.2\nRelevant documentation such as:\n4.2.1\nindustry codes of practice\n4.2.2\nstate legislation as appropriate\n4.2.3\nhousekeeping/maintenance procedures\n4.3\nSolder and fluxes\n4.4\nDental alloys\n4.5\nOrthodontic wires\n4.6\nA qualified workplace assessor and/or a technical expert\nworking in partnership with the assessor\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with questioning\n5.2\nObservation with questioning\n5.3\nOral questioning/Interview\n5.4\nWritten Test/Examination\n6.\nContext of\nassessment\n6.1\nCompetency may be assessed in the workplace or accredited\nassessment center.\n\n--- PDF PAGE 47 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n43"
