        "source_title": "JOIN ALLOY STRUCTURES",
        "source_text": "--- PDF PAGE 45 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n41\nUNIT OF COMPETENCY : \nJOIN ALLOY STRUCTURES \n \nUNIT CODE \n: \nHCS322338 \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitudes in joining alloy \nstructures through thermal processes. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nSolder components \n1.1 \nComponent materials are identified. \n1.2 \nAppropriate solder and flux are selected. \n1.3 \nAppropriate heating methods are selected. \n1.4 \nComponents are selected and soldered. \n1.5 \nComponents are cleaned, trimmed, shaped and finished. \n1.6 \nComponents are disinfected according to DOH guidelines. \n2. \nWeld components \n2.1 \nComponent materials are identified. \n2.2 \nAppropriate welding techniques are selected. \n2.3 \nComponents are welded. \n2.4 \nComponents are cleaned, trimmed, shaped and finished. \n2.5 \nComponents are disinfected according to DOH guidelines. \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \n \nRANGE \n1. Component materials May include but are not limited to: \n1.1 \nSolder and flux \n1.2 \nSoldering investment \n2. Heating methods \nMay include but are not limited to: \n2.1 \nOpen flame \n2.2 \nLaser\n\n--- PDF PAGE 46 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n42\n \nEVIDENCE GUIDE \n \n1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nSoldered components \n1.2 \nWelded components \n1.3 \nComplied with infection control policies and procedures \n1.4 \nFollowed OH&S policies \n2. \nUnderpinning \nknowledge  \n2.1 \nDental alloys \n2.2 \nOrthodontic wires \n2.3 \nSolder and Fluxes \n2.4 \nSoldering and welding techniques \n2.5 \nFinishing methods \n2.6 \nOH&S and materials safety data sheets \n2.7 \nIndustry Codes of Practice \n2.8 \nRelevant Laws as appropriate \n2.9 \nHousekeeping and Maintenance Procedures \n3 \nUnderpinning skills \n3.1 \nManual dexterity \n3.2 \nMaintaining a healthy and safe working environment \n3.3 \nSoldering and welding techniques \n3.4 \nFinishing methods \n3.5\nPlanning and organizing work activities\n4. \nResource \nimplications \nThe following resources MUST be provided: \n4.1 \nA real or simulated dental laboratory environment \n4.2 \nRelevant documentation such as: \n4.2.1 \nindustry codes of practice \n4.2.2 \nstate legislation as appropriate \n4.2.3 \nhousekeeping/maintenance procedures \n4.3 \nSolder and fluxes \n4.4 \nDental alloys \n4.5 \nOrthodontic wires \n4.6 \nA qualified workplace assessor and/or a technical expert \nworking in partnership with the assessor \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nObservation with questioning \n5.3 \nOral questioning/Interview \n5.4 \nWritten Test/Examination \n6. \nContext of \nassessment \n6.1 \nCompetency may be assessed in the workplace or accredited \nassessment center.\n",
