        "source_text": "--- PDF PAGE 39 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n35\n \n \nUNIT OF COMPETENCY : \nFABRICATE CERAMIC RESTORATIONS \n \nUNIT CODE \n: \nHCS322336 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude in fabricating \nceramic restorations and fixed partial dentures.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1 \nPrepare sub-\nstructures \n1.1 \nSub-structure is assessed for accuracy and appropriateness. \n1.2 \nSub-structure conformed to standard guidelines. \n1.3 \nStructure is prepared for porcelain build-up. \n1.4 \nSub-structure is treated according to manufacturer’s \nguidelines. \n2 \nSelect and apply \nceramics \n2.1 \nPorcelains appropriate to the procedure is selected and \napplied. \n2.2 \nOperator requirements are selected and applied. \n3 \nTrim, shape and \nfinish restorations \n3.1 \nCeramic restoration is trimmed to required anatomical shape. \n3.2 \nCeramic restoration is completed to meet the clinically \naccepted standards. \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Procedures \nProcedures to include crowns and bridges of the following types: \n1.1 \nCeramic fused to precious, semi-precious and non-precious \nmetal/alloy \n1.2 \nAll ceramic restorations \n1.3 \nCeramic veneers, inlays and onlays \n1.4 \nCastable ceramic \n2. Restoration \nMay include but not limited to: \n2.1 \nComplete and partial \n2.2 \nCrown and bridge \n2.3 \nImplant \n2.4 \nSplint\n\n--- PDF PAGE 40 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n36\nEVIDENCE GUIDE \n1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared sub-structures  \n1.2 \nSelected and applied ceramics \n1.3 \nTrimmed, shaped and finished restorations \n1.4 \nComplied with infection control policies and procedures \n1.5 \nFollowed OH&S policies \n2. \nUnderpinning \nknowledge  \n2.1 \nCeramics \n2.2 \nMetallurgy \n2.3 \nColor \n2.4 \nScience \n2.5 \nCurrent DOH infection control guidelines \n2.6 \nOral Anatomy \n2.7 \nCause of faults during fabrication \n2.8 \nRationale for processes and procedures \n2.9 \nPrinciples of occlusion \n2.10 Industry Codes of Practice \n2.11 Relevant Laws as appropriate \n2.12 Housekeeping and Maintenance Procedures \n3. \nUnderpinning skills \n3.1 \nManual dexterity \n3.2 \nMaintaining a healthy and safe working environment \n3.3 \nCarving teeth \n3.4 \nAccuracy \n3.5 \nEfficient use of materials \n3.6 \nAnalyzing faults \n3.7 \nMaintaining personal hygiene \n3.8 \nFollowing correct measurements \n3.9 \nPlanning and organizing work activities \n4. \nResource \nimplications \nThe following resources MUST be provided: \n4.1 \nA real or simulated dental laboratory environment \n4.2 \nRelevant documentation such as: \n4.2.1 industry codes of practice \n4.2.2 state legislation as appropriate \n4.2.3 housekeeping/maintenance procedures \n4.3 \nA qualified workplace assessor and/or a technical expert \nworking in partnership with assessor\n\n--- PDF PAGE 41 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n37\n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nWritten Test/Examination \n5.3 \nThird Party Report \n5.4 \nPortfolio \n6. \nContext of \nassessment \n6.1     Competency may be assessed in the workplace or accredited \nassessment center.\n",
