        "source_title": "OPERATE A PERSONAL COMPUTER",
        "source_text": "--- PDF PAGE 32 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n28\n \nUNIT TITLE \n: \nOPERATE A PERSONAL COMPUTER \nUNIT CODE \n: \nICT311201 \nUNIT DESCRIPTOR \n: \nThis unit defines the competency required to operate a personal \ncomputer by: starting the PC, logging in, using and working with \nfiles, folders and programs, saving work, and closing down the PC.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated in the Range of Variables \n1.    Start the \ncomputer \n \n1.1 \nThe peripheral devices are properly connected  \n1.2 \nPower is checked and the computer and peripheral devices are \nswitched on \n1.3 \nProper logging in and logging off is successfully done \n1.4 \nThe operating system features and functions are accessed and \nnavigated \n1.5\nHardware configuration and other system features are checked\n2. Arrange and \ncustomize \ndesktop display/ \nWindows \nsettings \n \n2.1 \nThe desktop screen or Windows elements are changed as needed \n2.2 \nDesktop icons are added, renamed, moved, copied or deleted \n2.3 \nThe online help functions are accessed or used as needed \n2.4 \nDesktop icons of application programs are selected, opened and \nclosed \n2.5 \nProperties of icons are displayed \n2.6 \nComputer or desktop settings are saved and restored \n3. Work with files \nand folders (or \ndirectories)  \n \n3.1 \nA file or folder is created, opened, moved, renamed or copied \n3.2 \nFiles are located, deleted and restored \n3.3 \nDetails and properties of files and folders are displayed or viewed  \n3.4 \nVarious files are organized for easy lookup and use \n3.5 \nFiles and information are searched \n3.6\nDisks are checked, erased or formatted as necessary\n4. Work with user \napplication \nprograms \n4.1 \nApplication programs are added, changed, removed or ran  \n4.2 \nUser software or application program are installed, updated and \nupgraded \n4.3\nInformation/data are moved between documents or files\n5. Print \ninformation \n5.1 \nPrinter is added or installed and correct printer settings is ensured\n5.2 \nDefault printer is assigned accordingly \n5.3 \nInformation or document is printed on the installed printer \n5.4\nProgress of print jobs are viewed and deleted as required\n6. Shut down \ncomputer \n6.1 \nAll open application programs are closed \n6.2 \nComputer and peripheral devices are properly shut down\n\n--- PDF PAGE 33 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n29\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Peripheral device \nThis may include but is not limited to:  \n1.1 mouse \n1.2 keyboard \n1.3 monitor or visual display unit \n1.4 printer \n1.5 scanner \n2. Computer \nMay include: \n2.1 Laptops/notebooks \n2.2 Workstations \n2.3 Servers \n2.4 other personal computer devices \n3. Application \nprograms \nCan include: \n3.1 user programs \n3.2 database programs \n3.3 word processors \n3.4 email programs \n3.5 Internet browsers \n3.6 system browsers  \n3.7 spreadsheets \n4. Operating system \nMay include but is not limited to the various versions and variants of: \n4.1 Windows \n4.2 NT \n4.3 Mac OS \n4.4 Linux \n4.5 Solaris \n4.6 Unix  \n \n5. System features \nMay include but is not limited to the operating system features and \nhardware features like:  \n5.1 memory size \n5.2 disk capacities \n5.3 video cards \n5.4 USBs \n5.5 Modems \n5.6 1394 and LAN connectors \n5.7 SD and PC cards \n5.8 wireless and infrared connections.\n\n--- PDF PAGE 34 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n30\n \n \n \nVARIABLE \nRANGE \n6. Online help \nfunctions \n6.1 An instruction manual, or a portion of the manual, integrated and \naccessible from within the program or software being used. \n7. Properties \nIndicates the description of the file or folder to include the:  \n7.1 file name \n7.2 type of file \n7.3 file size \n7.4 date created and modified \n7.5 attributes (hidden, read-only). \n8. Various files \n8.1 Documents \n8.2 Records \n8.3 Pictures \n8.4 Music \n8.5 Video \n9. Disks \nMay include but is not limited to:  \n9.1 Floppy disks \n9.2 CDs \n9.3 CD-RW (Compact discs-Read/Write) \n9.4 DVD RW \n9.5 zip disks \n9.6 flash drives \n9.7 memory sticks \n9.8 hard drives \n10. Printer settings \nThe properties of the printer that enables it to work  includes:  \n10.1 page layout \n10.2 paper size \n10.3 ink/cartridge type \n10.4 number of copies \n10.5 page orientation\n\n--- PDF PAGE 35 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations)  NC II                    Amended April 8, 2010  \n \n \n31\nEVIDENCE GUIDE \n \n1. \nCritical aspects \nof Competency \n1.1 Assessment must confirm the ability to utilize software, navigate \nthe desktop, using system features to perform tasks and save \nresults of work. \n2. \nUnderpinning \nKnowledge \nKnowledge includes: \n2.1 Keyboard layout and functions \n2.2 Computer functions \n2.3 Basic parts of a computer and various hardware components \n2.4 Storage devices and file concepts \n2.5 Basic software operation and functionalities \n3. \nUnderpinning \nSkills \nSkills include:  \n3.1 Saving and retrieving files to and from various folders or disk \nstorage \n3.2 Mouse and keyboarding skills for running software applications \n3.3 Reading and writing at a level where basic workplace documents \nare understood \n3.4 Clear ability to communicate with peers and supervisors \n3.5 Interpretation of user manuals and help functions \n3.6 The ability to carry out written and verbal instructions using a \npersonal computer whether standalone or in a networked \nenvironment \n4. \nResource \nImplications \nTo demonstrate competence in this unit access to the following \nresources will be required: \n4.1 A personal computer \n4.2 A printer \n4.3 Mouse and keyboard \n4.4 Basic systems software \n5. \nMethods of \nAssessment \nCompetency may be assessed through: \n5.1 Observation in a workplace or simulated environment \n5.2 Third party reports \n5.3 Exams and tests \n5.4 Demonstration of required skills \n5.5 Interviews \n6. \nContext for \nAssessment \n6.1 Competency may be assessed in the workplace or in a simulated \nwork environment.\n",
