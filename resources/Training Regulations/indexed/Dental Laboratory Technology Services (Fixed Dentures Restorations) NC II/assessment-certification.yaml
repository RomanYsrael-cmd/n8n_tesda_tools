  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Dental Laboratory Technology Services (Fixed\nDentures/Restorations) NC II, the candidate must demonstrate competence in all the\nunits of competency listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2\n The\nqualification\nof\nDental\nLaboratory\nTechnology\nServices\n(Fixed\nDentures/Restorations) NC II may be attained through –\n\n4.2.1\nAccumulation of Certificates of Competency (COCs) in the following areas –\n\n4.2.1.1 Dental Laboratory Technology Services (Fixed Dentures/\n Restorations) NC II\n\n• Perform fabrication of crown and bridge\n\n - Fabricate metal crown and bridge structures\n - Join alloy structures\n• Fabricate ceramic restorations\n• Fabricate indirect composite/polymer fixed restorations\n\n4.2.2 Demonstration of competence through project-type assessment covering all\nrequired units of qualification\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced Workers (wage employed or self – employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 56 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II\n\nAmended April 8, 2010\n\n51\n\n"
}
