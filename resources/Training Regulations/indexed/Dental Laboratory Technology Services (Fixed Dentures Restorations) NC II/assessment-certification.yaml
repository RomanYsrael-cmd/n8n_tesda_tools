  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Dental Laboratory Technology Services (Fixed\nDentures/Restorations) NC II, the candidate must demonstrate competence in all the\nunits of competency listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2\n The\nqualification\nof\nDental\nLaboratory\nTechnology\nServices\n(Fixed\nDentures/Restorations) NC II may be attained through –\n\n4.2.1\nAccumulation of Certificates of Competency (COCs) in the following areas –\n\n4.2.1.1 Dental Laboratory Technology Services (Fixed Dentures/\n Restorations) NC II\n\n• Perform fabrication of crown and bridge\n\n - Fabricate metal crown and bridge structures\n - Join alloy structures\n• Fabricate ceramic restorations\n• Fabricate indirect composite/polymer fixed restorations\n\n4.2.2 Demonstration of competence through project-type assessment covering all\nrequired units of qualification\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced Workers (wage employed or self – employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 56 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II\n\nAmended April 8, 2010\n\n51\n\nCOMPETENCY MAP – HEALTH CARE SECTOR (DENTAL LABORATORYTECHNOLOGY SERVICES (Fixed Dentures/Restorations) NC II)\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in workplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop teams and\nindividuals\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nImplement and monitor\ninfection control policies\nand procedures\nRespond effectively to\ndifficult/challenging\nbehavior\nApply basic first aid\nMaintain high\nstandard of patient\nservices\nProcess reusable\ninstruments and\nequipment in health\nwork\nPrepare for and assist\nwith oral health care\nprocedures\nAssist with\nadministration in dental\npractice\nMaintain an effective\nrelationship with\ncustormers and clients\nManage own\nperformance\nFollow occupational\nhealth and safety\npolicies in dental\npractice\nMaintain infection\ncontrol in dental\npractice\n\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and support\nto children\nFoster social, intellectual,\ncreative and emotional\ndevelopment of children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room, dining\nroom, bedrooms, toilet\nand bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end\nusers location\nAssist in patient\nmobility\n\nAssist in transporting\npatients\nAssist in bio-psychosocial\nsupport care of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\n\nPerform basic life support\n\nMaintain life support\nequipment and resources\nImplement safe access\nand extrication\nprocedures in an\nemergency\nManage request for\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic\nambulance\ncommunication skills\n\nSupervise on-road\noperations\n\nManage the scene of a\nspecial event\nManage routine scene\nDeliver pre-hospital\npatient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\n\n--- PDF PAGE 57 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II\n\nAmended April 8, 2010\n\n52\nDrive vehicles under\noperational conditions\nWork within a holistic\ntherapeutic massage\nframework\nPerform therapeutic\nmassage assessment\nPlan the therapeutic\nmassage treatment\nImplement therapeutic\nmassage treatment\nPerform remedial\ntherapeutic massage\ntreatment\nWork within a\ncommunity\ndevelopment\nframework\nPrepare for work in the\ncommunity service industry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education\nprogram in the\ncommunity\nImplement health promotion\nand community interventions\nFabricate models\nFabricate custom\nimpression trays\nFabricate registration\nbite rims\nArticulate models and\ntransfer records\nFabricate mouthguard\nFabricate metal crown\nand bridge structures\nFabricate ceramic\nrestorations\nFabricate indirect\ncomposite/polymer fixed\nrestorations\nJoin alloy structures\n\n--- PDF PAGE 58 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n53\nDEFINITION OF TERMS\n\nABUTMENT\n-\nTooth or teeth that support a fixed or removable bridge\nANTERIOR TEETH\n-\nthe six upper or six lower front teeth (canines, laterals & central\nincisors)\nAPEX\n-\nthe tip of the root of a tooth\nARCH\n-\ndescribes the alignment of the upper or lower teeth\nARTICULATE\n-\nto unite by forming a joint or joints\nARTICULATOR\n-\na mechanical device representing the temporomandibular joints and\njaw members to which casts of the mouth\nBASE\n-\ncement placed under a dental restoration to insulate the pulp (nerve\nchamber)\nBITE\n-\nrelationship of the upper and lower teeth on closure (occlusion)\nBONDING\n-\nadhesive dental restoration technique; a tooth-colored composite\nresin to repair and/or change the color or shape of a tooth\nBRACES\n-\ndevices used by orthodontists to gradually reposition teeth to a more\nfavorable alignment\nBRIDGE\n-\nstationary dental prosthesis (appliance) fixed to teeth adjacent to a\nspace; replaces one or more missing teeth, cemented or bonded to\nsupporting teeth or implants adjacent to the space\nCANTILEVER\nBRIDGE\n-\nfixed bridge that attaches to adjacent teeth only on one end\nCAP\n-\ncommon term for dental crown\nCLASP\n-\ndevice that retains a removable partial denture to stationary teeth;\ncan be metal or acrylic (matches teeth and gums)\nCROSS BITE\n-\nreverse biting relationship of upper and lower teeth; aka \"under bite,\"\nas in Class III malocclusuion (prognathic jaw)\nCROWN\n\n(1) the portion of a tooth above the gum line;\n(2) dental restoration covering all or most of the natural tooth\nCUSTOM IMPRESION\nTRAY\n-\nan impression tray made from a preliminary impression used to make\nthe final impression\nDENTAL WAXES\n-\n wax compounds used in dentistry are mixtures of individual waxes of\nmaterials or synthetic origin. As with all other dental materials, each\ncomponent n the mixture is selected to given specific properties best\nsuited for the procedure being performed\nDENTURE\n-\nremovable (partial or complete) set of artificial teeth\n\n--- PDF PAGE 59 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n54\n\nDIASTEMA\n-\nopen space between teeth\nDISTAL\n-\nfarthest from any point of reference\nDUPLICATE\n-\nidentically copied from an original\nFABRICATE\n-\nto make; create; to construct by combining or assembling\nFACE-BOW FORK\n-\na device used to attach the face-bow to an occlusion rim for a face-\nbow transfer\nFACING\n-\ntooth colored overlay on the visible portion of a crown; may be\nacrylic, composite or porcelain\nFILLING\n-\nrestoration of lost tooth structure with metal, porcelain or resin\nmaterials\nFULL DENTURE\n-\nremovable dental prosthesis (appliance) replacing all upper or lower\nteeth\nFULL MOUTH\nRECONSTRUCTION\n-\nextensive restorations of natural teeth with crowns and or fixed\nbridges to manage restorative and bite problems.\nGYPSUM\n-\nis the common name for calcium sulfate dehydrate. Gypsum products\nare more frequently used on laboratory procedures than any other\nsingle group of compounds. Controlled variations in the\nmanufacturing of gypsum products yield a group of dental materials\nincluding plaster, artificial stone (hydrosol), disc stone, casting\ninvestment and soldering investment\nIMPRESSION\n-\nmold made of the teeth and soft tissues\nINLAY\n-\nindirect – filling made by a dental laboratory that is cemented or\nbonded into place,\ndirect – placement of dental composite resin, or porcelain restoration\nat chairside\nINTEROCCLUSAL\n-\nspace between upper and lower teeth\nJACKET\n-\ncrown for a front tooth, usually made of porcelain\nLAMINATE\n-\nthin plastic or porcelain veneer produced in a dental laboratory and\nthen bonded to a tooth\nMALOCCLUSION\n-\n“bad bite” or misalignment of the upper and lower teeth\nMARGIN\n-\ninterface between a restoration and tooth structure\nMARYLAND BRIDGE\n-\na bridge that is bonded to the back of the adjacent teeth; requires\nminimum tooth reduction\nMODEL\n-\na material used extensively for making impressions. It contains\nshellac, talc, glycerin, wax, tallow and palm oil\nOVERBITE\n-\nvertical overlap of the front teeth; deep bite\nPARTIAL DENTURE\n-\nremovable dental prosthesis (appliance) replacing one or more\nnatural teeth\nPONTIC\n-\nreplacement tooth mounted on a fixed or removal appliance\nPORCELAIN CROWN\n-\nall porcelain restoration covering the coronal portion of tooth (above\nthe gum line)\n\n--- PDF PAGE 60 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n55\n\nPORCELAIN FUSED\nTO METAL (PFM)\nCROWN\n-\nrestoration with metal coping (for strength) covered by porcelain (for\nappearance)\nPORCELAIN INLAY\nOR ONLAY\n-\ntooth-colored restoration made of porcelain, cemented or bonded in\nplace\nPORCELAIN\nVENEERS\n-\na thin layer of porcelain, fabricated by a laboratory) bonded to a\nnatural tooth to replace lost tooth structure, close spaces, straighten\nteeth or change color and/or shape\nPROSTHESIS\n\nan artificial appliance for the replacement for a body part, tooth or\nteeth\nSOLDERING\nINVESTMENT\n-\na soldering investment is similar in composition to a casting\ninvestment that has a\nSPLINT\n-\nconnection of two or more teeth so they function as a stronger single\nstructure\n\n--- PDF PAGE 61 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies, non-government organizations including professional associations who donated their\ntime and expertise to the development and validation of this Training Regulations.\n\nDR. ARNON L. RIVERA\n\nPresident\n\nNational Association of Dental/Prosthesis Laboratory Inc.\n\n#96 Hoover Street, San Juan, Metro Manila\n\nMS. WILMA E. REDLER, C.D.T.\n\nVP Technical and Lecturer\n\nSkytech International Dental Laboratory\n\nRamon Magsaysay, Sta. Mesa, Manila\n\nMR. KOJI MIYATA, C.D.T.\n\nLecturer/Teacher/Maxillo Facial Technician\n\nEmilio Aguinaldo College\n\n1112-1117 San Marcelino St., Ermita, Manila\n\nMR. CHRISTOPHER P. LOZANO\n\nOperations Manager\n\nPearl of the Orient Dental Studio, Inc.\n\n#770 Aurora Blvd., Cubao, Quezon City\n\nMR. ROMEO G. GAJO, JR.\nVice President for Administration/Marketing Manager\nPearl of the Orient Dental Studio, Inc.\n\n#770 Aurora Blvd., Cubao, Quezon City\n\nMR. RUVENSTEIN M. LADERA\nMarketing Director for Dental Laboratory\nInternational Dental Inc. (INTERDENT, Inc.)\n#5307 Gilbarco Bldg., South Superhighway, Makati City\n\nMS. BUENA V. LADERA\nBranch Manager\nInternational Dental Inc. (INTERDENT, Inc.)\n#5307 Gilbarco Bldg., South Superhighway, Makati City\n\nMR. GIL CAMPANA\nOwner\nGC Dental Laboratory\n96 Hoover St., cor. Araullo St., San Juan, Metro Manila\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe Management and Staff of the TESDA Secretariat\n\n--- PDF PAGE 62 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\nList of Published Training Regulations\n\n\nAnimal Production NC II\n\nAquaculture NC II\n\nAutomotive Body Painting/Finishing NC II\n\nAutomotive Body Repair NC II\n\nAutomotive Engine Rebuilding NC II\n\nAutomotive Servicing NC II\n\nBartending NC II\n\nBuilding Wiring Installation NC II\n\nCaregiving NC II\n\nCarpentry NC II\n\nCommercial Cooking NC II\n\nComputer Hardware Servicing NC II\n\nDeck Seafaring NC II\n\nDental Laboratory Technology Services NC I\n\nDental Laboratory Technology Services (Removable Dentures/Appliances) NC II\n\nDental Laboratory Technology Services (Fixed Dentures/Restorations) NC II\n\nDressmaking NC II\n\nDriving NC II\n\nEngine Seafaring NC II\n\nFood and Beverage Services NC II\n\n