e and customize\ndesktop display/window\nsetting\n5.3\nWork with files and\nfolders (or directories)\n5.4\nWork with user\napplication programs\n5.5\nPrint information\n\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n• Written Exam\n\nCORE COMPETENCIES\n744 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1 Fabricate metal\ncrown and\nbridge\nstructures\n1.1\nPrepare sectionalized\nmodels\n1.2 Wax and invest fixed\npartial dentures and\nstructures\n1.3 Burn-out cast and finish\nalloy fixed partial\ndentures and structures\n• Lecture\n• Discussion\n• Demo\n\n• Written\nexamination\n• Interview\n\n2. Fabricate ceramic\nrestorations\n2.1 Prepare sub-structures\n2.2 Select and apply\nceramics\n2.3 Trim, shape and finish\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n3 Fabricate indirect\ncomposite/polymer\nfixed restorations\n3.1 Prepare model\n3.2 Fabricate restoration\n3.3 Trim, shape and finish\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n4\nJoin alloy\nstructures\n4.1 Solder components\n4.2 Weld components\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 50 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n46\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is individualized and self-paced;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the curriculum\nmodules;\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n Training is based both on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency – based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in – industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein the trainee is\nallowed to progress at his own pace. The trainer facilitates the training delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners\n Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge an skills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training regulations.\n Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may employ\ncorrespondence study, or audio, video or computer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 51 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n47\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students wishing to gain entry into these qualifications should possess the\nfollowing requirements:\n\n Must be 18 years old\n Must be a holder of a Dental Laboratory Technology Services NCI or its equivalent\n Must be physically fit and mentally fit (specifically on eye and hand coordination)\n Must be able to communicate either oral or written\n Must be at least a high school graduate or its equivalent\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees by\nthe school or training center delivering this TVET program.\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT:\nDENTAL LABORATORY TECHNOLOGY SERVICES (Fixed Dentures/Restorations) NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nDENTAL LABORATORY TECHNOLOGY SERVICES (Fixed Dentures/Restorations) NC II\nare as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n5 pcs.\nDie Saw\n5\npcs.\nMicro Motor\n1\nbtl.\nDie\nHardener/Conditioner\n(120 ml.)\n25 pcs. Die Opening Burs\n2\npcs.\nHigh Speed Grinder\n1\nbtl.\nDie Spacer\n25 pcs. Lead Free Pencil\n1 pc. Casting Machine and\naccessories\n1\nbtl.\nDie Separator\n25 pcs. Scalpel\n2\npcs.\nLathe Machine\n1\nbox\nWax (assorted)\n25 pcs. Bunsen Burner\n2\npcs.\nAlloy High Speed\nGrinder\n2\ntank\ns\nLPG\n25 sets Wax Instruments\n(assorted)\n2\npcs.\nCast Trimmer\n1\ntank\nOxygen\n25 pcs. Alcohol Torch\n5\npcs.\nWax Pot\n1\nkilo\nMetal Alloy (non-\nprecious/precious)\n25 pcs. Caliper\n1 pc. Vacuum Mixer\n25\nkilos\nInvestment\n25 pcs. Brushes (assorted)\n1 pc. Steamer\n25\nkilos\nGypsum Products\n(type 1,2,3,4)\n25 pcs. Glass Slab\n1 pc. Burn-Out Oven and\nAccessories\n25\npcs.\nCutting Discs\n\n--- PDF PAGE 52 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n48\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription