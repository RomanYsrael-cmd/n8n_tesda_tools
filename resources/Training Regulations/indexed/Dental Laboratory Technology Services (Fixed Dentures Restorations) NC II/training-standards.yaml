torations) NC II Amended April 8, 2010\n\n50\n\n3.6 TRAINER QUALIFICATION (TQ II)\n\n Must have completed Trainer’s Training Methodology Course (TTMC) or its equivalent\n Must be a holder of a Dental Laboratory Technology Services (Fixed\nDentures/Restorations) NC II or its equivalent\n Must be able to communicate effectively both orally and in written form\n Must be physically, emotionally, psychologically and mentally fit\n Must have a minimum of five (5) years experience as a dental technician\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 55 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n51"
