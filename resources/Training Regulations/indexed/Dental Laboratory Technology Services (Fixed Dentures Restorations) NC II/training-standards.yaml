er\nrequirements\n1.3\nBuild credibility with\ncustomers/clients\n• Lecturette\n• Interaction\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n2. Manage own\nperformance\n2.1\nPlan for completion of\nown workload.\n2.2\nMaintain quality\nperformance.\n2.3\nBuild credibility with\ncustomers/clients\n\n• Lecturette\n• Brainstroming\n\n• Observation\nand oral\nquestioning\n• Grid\nquestioning\n• Practical\nexercise\n3 Follow\noccupational health\nand safety policies\nin dental facilities\n\n3.1 Apply workplace\nprocedures for hazard\nidentification and risk\ncontrol\n3.2 Utilize and implement\nstrategies as directed to\nprevent infection in the\nworkplace\n3.3 Work in a safe manner\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n4 Maintain infection\ncontrol in dental\npractice\n4.1 Monitor and maintain the\ncleanliness of the dental\nlaboratory rooms\n4.2 Clean and maintain\ndental instruments and\nequipment\n4.3 Maintain hygiene and\npersonal protection\n4.4 Dispose of dental\nlaboratory waste safely\n4.5 Disinfect and clean\nimpressions\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n--- PDF PAGE 49 ---\nTR Dental Laboratory Technology Services (Fixed Dentures/Restorations) NC II Amended April 8, 2010\n\n45\n5 Operate a personal\ncomputer\n5.1\nStart and shut down\nthe computer\n5.2\nArrange and customize\ndesktop display/window\nsetting\n5.3\nWork with files and\nfolders (or directories)\n5.4\nWork with user\napplication programs\n5.5\nPrint information\n\n• Group\nDiscussion\n• Interaction\n• Lecture\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n• Written Exam\n\nCORE COMPETENCIES\n744 Hours\nUNIT OF\nCOMPETENCY\nLEARNING OUTCOME\nMETHODOLOGY\nASSESSMENT\nAPPROACH\n1 Fabricate metal\ncrown and\nbridge\nstructures\n1.1\nPrepare sectionalized\nmodels\n1.2 Wax and invest fixed\npartial dentures and\nstructures\n1.3 