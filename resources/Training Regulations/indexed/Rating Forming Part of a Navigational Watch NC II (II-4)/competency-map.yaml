  "source_text": "SECTION 1 RATING FORMING PART OF A NAVIGATIONAL WATCH NC II (STCW\nRegulation II/4) QUALIFICATION\n\nThe RATING FORMING PART OF A NAVIGATIONAL WATCH NC II (SCTW\nRegulation II/4) Qualification consists of competencies that a person must achieve to steer\nthe ship and also comply with helm orders in the English language, keep a proper look-out by\nsight and hearing, contribute to monitoring and controlling a safe watch and operate\nemergency equipment and apply emergency procedures.\n\nThis Qualification is packaged from the competency map of the Maritime Sector as\nshown in Annex A and complies with the requirements of STCW Regulation II/4.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCode No.\nBASIC COMPETENCIES\n500311105\nParticipate in Workplace Communication\n500311106\nWork in a Team Environment\n500311107\nPractice Career Professionalism\n500311108\nPractice Occupational Health and Safety Procedures\n\nCode No.\nCOMMON COMPETENCIES\n\nMTM834208\nSurvive at sea in the event of ship abandonment\nMTM834209\nMinimize the risk of fire and maintain a state of readiness to\nrespond to emergency situations involving fire\nMTM834210\nFight and extinguish fire\nMTM834211\nTake immediate action upon encountering an accident or\nother medical emergency\nMTM834212\nComply with emergency procedures\nMTM834213\nTake precautions to prevent pollution of the marine\nenvironment\nMTM834214\nObserve safe working practices\nMTM834215\nDemonstrate security awareness practices\n\nCode No.\nCORE COMPETENCIES\n\nMTM834313\nSteer the ship and also comply with helm orders in the\nEnglish language\nMTM834314\nKeep a proper look-out by sight and hearing\nMTM834315\nContribute to monitoring and controlling a safe watch\nMTM834316\nOperate emergency equipment and apply emergency\nprocedures\n\nA person who has achieved this Qualification is competent to be:\n\n\nRating forming part of a navigational watch\n\n--- PDF PAGE 6 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n2"
}
