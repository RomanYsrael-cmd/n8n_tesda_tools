      "term": "DEFINITION OF TERMS",
      "definition": "For the purpose of this training regulations, the words:"
    },
    {
      "term": "1. Abandon ship",
      "definition": "an imperative to leave the vessel immediately, usually in the face of some imminent danger. It is an order issued by the Master or a delegated person in command. It is usually the last resort after all other mitigating actions have failed."
    },
    {
      "term": "2. Aground",
      "definition": "resting on or touching the ground or bottom (usually involuntarily). 3. Azimuth of an object is its bearing from the observer measured as an angle clockwise from true north."
    },
    {
      "term": "4. Bearing",
      "definition": "the horizontal direction of a line of sight between two objects on the surface of the earth."
    },
    {
      "term": "5. Bridge",
      "definition": "a structure above the weather deck, extending the full width of the vessel, which houses a command center, itself called by association, the bridge."
    },
    {
      "term": "6. Bridge wing",
      "definition": "an open-air extension of the bridge to port or starboard, intended for use in signaling."
    },
    {
      "term": "7. Boxing the compass",
      "definition": "to state all 32 points of the compass, starting at north, proceeding clockwise. Sometimes applied to a wind that is constantly shifting."
    },
    {
      "term": "8. Cardinal",
      "definition": "referring to the four main points of the compass: north, south, east and west."
    },
    {
      "term": "9. Compass",
      "definition": "navigational instrument showing the direction of the vessel in relation to the Earth's geographical poles or magnetic poles. Commonly consists of a magnet aligned with the Earth's magnetic field, but other technologies have also been developed, such as the gyro compass. 10. Conn to direct a ship or submarine from a position of command 11. Constant bearing, Decreasing range (CBDR) when two ship’s are approaching each other from any angle and this angle remains the same over time (constant bearing) they are on a collision course."
    },
    {
      "term": "12. Distress Signal",
      "definition": "an international signal used by a distressed ship or aircraft to request help, as by radio broadcasts, flags, or flares"
    },
    {
      "term": "13. EPIRB",
      "definition": "emergency position-indicating radio beacon 14. Gyro compass a mechanical indicator of the direction of the true (geographic) meridian, designed for determining the course of an object, as well as the azimuth (bearing) of the direction of orientation."
    },
