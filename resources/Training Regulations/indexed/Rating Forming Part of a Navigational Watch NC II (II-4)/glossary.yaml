  "source_text": "DEFINITION OF TERMS\nFor the purpose of this training regulations, the words:\n\n1. Abandon ship\nan imperative to leave the vessel immediately, usually in the\nface of some imminent danger. It is an order issued by the\nMaster or a delegated person in command. It is usually the\nlast resort after all other mitigating actions have failed.\n\n2. Aground\nresting on or touching the ground or bottom (usually\ninvoluntarily).\n3. Azimuth of an object\nis its bearing from the observer measured as an angle\nclockwise from true north.\n\n4. Bearing\nthe horizontal direction of a line of sight between two objects\non the surface of the earth.\n\n5. Bridge\na structure above the weather deck, extending the full width\nof the vessel, which houses a command center, itself called\nby association, the bridge.\n\n6. Bridge wing\nan open-air extension of the bridge to port or starboard,\nintended for use in signaling.\n\n7. Boxing the compass\nto state all 32 points of the compass, starting at north,\nproceeding clockwise. Sometimes applied to a wind that is\nconstantly shifting.\n\n8. Cardinal\nreferring to the four main points of the compass: north, south,\neast and west.\n\n9. Compass\nnavigational instrument showing the direction of the vessel in\nrelation to the Earth's geographical poles or magnetic poles.\nCommonly consists of a magnet aligned with the Earth's\nmagnetic field, but other technologies have also been\ndeveloped, such as\nthe gyro compass.\n10. Conn\nto direct a ship or submarine from a position of command\n11. Constant bearing,\nDecreasing range\n(CBDR) when two ship’s are approaching each other from\nany angle and this angle remains the same over time\n(constant bearing) they are on a collision course.\n\n12. Distress Signal\nan international signal used by a distressed ship or aircraft to\nrequest help, as by radio broadcasts, flags, or flares\n\n13. EPIRB\nemergency position-indicating radio beacon\n14. Gyro compass\na mechanical indicator of the direction of the true (geographic)\nmeridian, designed for determining the course of an object, as well\nas the azimuth (bearing) of the direction of orientation.\n\n--- PDF PAGE 71 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n67\n\n15. Helm Order\ncommand ordered by the pilot or officers in charge top\nhelmsman in steering the ship.\n\n16. Look out\na seaman stationed in the forecastle, crow’s nest or bridge\nwings for the purpose of maintaining watchful eye for any\nlights, land or floating objects that may have in sight or\nreporting such to officer of the watch\n\n17. Lubber's line\na vertical line inside a compass case indicating the direction\nof the ship's head.\n\n18. Magnetic bearing\nan absolute bearing using magnetic north.\n\n19. Point\na unit of bearing equal to one thirty-second of a circle, i.e.,\n11.25°. A turn of 32 points is a complete turn through 360°\n\n20. Radar\nacronym for Radio Detection And Ranging. An electronic\nsystem designed to transmit radio signals and receive\nreflected images of those signals from a \"target\" in order to\ndetermine the bearing and distance to the \"target\".\n\n21. Relative bearing\nbearing relative to the direction of the ship: the clockwise\nangle between the ship's direction and an object.\n\n22. SART\nsearch and rescue transponder\n23. Steerageway\nthe minimum speed at which a vessel will answer the helm,\nbelow which she cannot be steered.\n\n--- PDF PAGE 72 ---"
