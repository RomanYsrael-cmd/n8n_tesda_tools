        "source_text": "MTM834313\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin steering the ship and comply with helm orders in the\nEnglish language\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Steer the ship using\nmagnetic and gyro\ncompass\n1.1\nVessel is steered under the direction of the Officer of\nthe Watch in response to helm orders and set course.\n1.2\nVessel’s heading is maintained within acceptable limits\nwith respect to the directions of the Officer of the Watch,\ngiven helm orders, the area of navigation and taking into\naccount environmental effects.\n1.3\nVessel’s steady course is maintained for ten minutes\nwithin 2 degrees.\n1.4\nAlterations of heading are smooth and controlled at all\ntimes.\n1.5\nCommunication is clear, concise and acknowledged at\nall times according to good seamanship.\n1.6\nSteering is changed from automatic pilot to manual\nsteering and vice versa in accordance with to the\ndirections of the Officer of the Watch, helm orders,\nvessel’s procedures and manufacturer’s instructions.\n1.7\nSafe operating limits of vessel’s steering systems are\nnot exceeded.\n1.8\nSteering techniques are consistent with the prevailing\nweather and sea conditions or possible states of\nemergency.\n\n2. Respond to helm\norders\n\n2.1\nThe directions of the Officer of the Watch and helm\norders are correctly understood, acknowledged and\npromptly acted upon.\n2.2\nConfirmation or clarification of directions and helm\norders is sought where they are not clearly understood.\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Under the direction of\nthe Officer of the\nWatch\nMay include:\n1.1 Work must be carried out in compliance with the relevant\nsections of the IMO STCW Conventions and Codes.\n1.2 Work is performed under the directions of the Officer in\nCharge of the Watch using a prescribed range of\nprocedures/methods either individually or in a team\nenvironment with some accountability for the quality of\noutcomes.\n1.3 Work involves the use of known and defined steering\ntechniques across a variety of navigational contexts in\nresponse to the directions of the Officer of the Watch\n2. Safe operating limits\nMay include:\n2.1 Commercial vessel of 500 GT and above\n2.2 Hand steering or automatic pilot\n2.3 Steering of the vessel may be carried out\n2.3.1. by day or night in both normal and emergency\nsituations\n2.3.2. under any possible conditions of weather and\nloading\n2.3.3. while underway\n2.3.4. during berthing and unberthing operations\n2.3.5. while anchoring or mooring\n2.3.6. when navigating in and near ‘traffic separation\nschemes’ and ‘vessel traffic service areas’\n2.3.7. in shallow water, rivers, estuaries and restricted\nwaters\n2.3.8. when towing and being towed\n2.3.9. when dragging an anchor and clearing a foul\nanchor\n2.4 Helm orders will be given in the English language and\nrequire sufficient proficiency in speaking and\nunderstanding in English to communicate effectively with\nthe master and others on the bridge of the vessel.\n2.5 Emergencies:\n2.5.1. man overboard\n2.5.2. collision\n2.5.3. grounding\n2.5.4. when hove to\n2.5.5. fire or flooding on board vessel.\n2.6 Special steering techniques required in adverse weather:\n2.6.1. steering in the face of strong winds, high sea\nstate, heavy swell and surf\n2.6.2. steering an unmanageable vessel out of the\ntrough of the sea in response to helm orders\n2.6.3. steering to assist a vessel in distress\n2.6.4. steering during towing operations\n2.6.5. steering during the launching of rescue boats and\nsurvival craft\n2.6.6. steering when taking on board survivors from\nrescue boats and survival craft\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n44\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. steered a vessel under the directions of the Officer in\nCharge of the Watch and in response to helm orders:\n1.1.1. in normal and emergency situations and adverse\nweather conditions\n1.1.2. when underway\n1.1.3. when anchoring or mooring\n1.1.4. during berthing and unberthing operations\n1.1.5. while anchoring or mooring\n1.1.6. during emergencies\n1.2. exercised all required safety and hazard control\nprocedures when steering a vessel\n1.3. identified typical steering problems and take appropriate\naction\n1.4. communicated effectively with others in the bridge team\nwhen steering a vessel\n\n2. Required Knowledge\n\n2.1 Knowledge of relevant sections of IMO STCW\nConvention and Codes and applicable to the steering of\nvessels\n2.2 Limits of responsibility of a rating on a vessel carrying out\nsteering duties\n2.3 Typical helm orders and steering action required\n2.4 Effects on steering of wind, currents and bottom\ntopography\n2.5 Steering problems for various sizes of vessels and\nappropriate action and solutions\n2.6 Procedures for changing over from automatic pilot to\nhand steering and vice versa\n2.7 Principles and procedures for steering a vessel\n2.8 Steering techniques in and near ‘traffic separation\nschemes’ and ‘vessel traffic service areas’\n\n3. Required Skills\n\n3.1 Changing over from automatic pilot to hand steering and\nvice versa\n3.2 Steering a vessel\n3.3 Steering in and near ‘traffic separation schemes’ and\n‘vessel traffic service areas’\n3.4 Ability to communicate effectively in the English\nlanguage with the Master and others in the bridge team\n3.5 Maritime communication techniques, including\nresponding to helm orders\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n45\n\n4. Resource Implication\n\nAccess is required to opportunities to either:\n4.1 steer a vessel using a simulator, meeting the\nrequirements of Section A I/12 of the IMO STCW Code,\nover an appropriate range of simulated maneuvering\nsituations, weather and loading conditions; and/or\n4.2 steer a working or training vessel under the direction of\nthe Officer in Charge of the Watch over an appropriate\nrange of situations, weather and loading conditions\n\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1 practical test using a suitably simulated watchkeeping\nsituation; or\n5.2 approved in-service experience, or\n5.3 approved training ship experience, or\n5.4 written examinations\n\n6. Context of Assessment\n\n6.1 Assessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations\n6.2 Assessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.2.1\nAppropriate practical assessment must occur:\n6.2.1.1 at the registered training organization,\nand/or\n6.2.1.2 on an appropriate working or training\nvessel\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n46\nUNIT OF COMPETENCY\n:\nKEEP A PROPER LOOK-OUT BY SIGHT AND\nHEARING\n\nUNIT CODE\n:"
