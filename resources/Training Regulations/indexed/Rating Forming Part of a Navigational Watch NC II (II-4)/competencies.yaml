          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. recognized emergency or abnormal situations\n1.2. took appropriate initial action on becoming aware of an\nemergency or abnormal situation\n1.3. operated emergency equipment\n1.4. maintained the integrity of emergency and distress\nalerting systems\n1.5. communicated clearly, concisely and effectively with\nothers during an emergency on board vessel\n\n2. Required Knowledge\n2.1\nKnowledge of relevant maritime regulations dealing with\nemergency equipment and procedures\n2.2\nISM Code and associated ship’s Safety Management\nSystem and procedures (where applicable)\n2.3\nRelevant OH&S legislation and policies applicable to the\nuse of emergency equipment\n2.4\nSOLAS Convention and related regulations\n2.5\nDuties and responsibilities of shipboard personnel\nduring emergencies\n2.6\nIncidents that may result in an emergency on board\nvessel and the appropriate response in each case\n2.7\nPrecautions to maintain the integrity of emergency and\ndistress alerting systems\n2.8\nThe meaning of various maritime emergency alarms,\nthe guidelines and procedures for their activation and\nsignals and the action to be taken when they are\nactivated\n2.9\nProcedures for emergency response on board a\ncommercial vessel\n2.10 Functions and purpose of pyrotechnic distress signals,\nsatellite emergency position indicating radio beacons\n(EPIRBs), and search and rescue transponders\n(SARTs)\n2.11 Techniques for avoiding false distress alerts and the\naction that must be taken in the event of accidental\nactivation\n2.12 Maritime communication techniques\n2.13 Familiarization with Ship Security Alert System (SSAS)\n\n3. Required Skills\n\n3.1\nApplying procedures for emergency response on board\na commercial vessel\n3.2\nHandling of pyrotechnic distress signals, satellite\nemergency position indicating radio beacons (EPIRBs),\nand search and rescue transponders (SARTs)\n3.3\nApplying techniques for avoiding false distress alerts\nand the action that must be taken in the event of\naccidental activation\n3.4\nPracticing maritime communication techniques\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n57\n\n4. Resource Implications\n\nAccess is required to opportunities to either:\n4.1. carry out a range of suitably simulated practical and\nknowledge assessments that demonstrate the skills and\nknowledge to respond to emergencies on board a vessel,\nand/or\n4.2. participate in emergency response drills on board an\noperational commercial or training vessel\n\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1. practical test using a suitably simulated watchkeeping\nsituation; or\n5.2. approved in-service experience; or\n5.3. approved training ship experience, or\n5.4. assessment of knowledge must be conducted through\nappropriate written examinations\n\n6. Context of\nAssessment\n\n6.1 Assessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations.\n6.2 Assessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.2.1 Appropriate practical assessment must occur:\n6.2.1.1 at the registered training/assessment\ninstitution, and/or\n6.2.1.2 on an appropriate working or training\nvessel\n\n--- PDF PAGE 62 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n58"
