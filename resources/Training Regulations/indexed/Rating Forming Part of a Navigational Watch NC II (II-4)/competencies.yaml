        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. contributed to the enhancement of maritime security\nthrough heightened awareness\n1.2. recognized security threats\n1.3. understood the need for and methods of maintaining\nsecurity awareness and vigilance\n\n2. Required Knowledge\n2.1. IMO ISPS Code applicable to vessels and ports\n2.2. Procedures for maintaining security awareness\n2.3. Relevant security and safety regulations, rules, policies\nand procedures\n2.4. Relevant security personnel on a vessel or at a port\nfacility\n2.5. Communication procedures and protocols on matters\nrelated to vessel and port security\n2.6. Security and safety problems that may be identified\nwhen maintaining and managing situation awareness\nand action that can be taken to overcome them\n2.7. Security and safety hazards and risks that may be\nidentified in the maritime workplace and ways of\ncontrolling those hazards and associated risks\n\n3. Required Skills\n3.1. Applying the above knowledge to the management of\nsituation awareness during workplace operations\n3.2. Reading and interpreting instructions, procedures and\nother information relevant to the maintenance of vessel\nand port security\n3.3. Working as a team with others on matters relevant to the\nmaintenance of vessel and port security\n3.4. Selecting and using appropriate communications\nequipment\n3.5. Taking appropriate initiatives related to vessel and port\nsecurity within limits of role and responsibility\n3.6. Interpreting and applying security and safety practices\nand regulations\n3.7. Communicating with others on matters related to vessel\nand port security\n3.8. Modifying activities dependent on differing workplace\ncontingencies, risk situations and environments\n3.9. Identifying and solving problems associated with the\nmaintenance of vessel and port security and to report\nsecurity issues and take appropriate action based on\navailable information\n3.10. Monitoring and anticipating security problems and risks\nand taking appropriate action\n\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of Assessment Competency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related underpinning\nknowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of Assessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n42\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nSTEER THE SHIP AND COMPLY WITH HELM ORDERS\n\nUNIT CODE\n:"
        },
        "source_text": "MTM834215\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ndemonstrating security awareness practices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Contribute to the\nenhancement of\nmaritime security\nthrough heightened\nawareness\n1.1. Requirements relating to enhanced maritime security are\nidentified.\n1.2. All critical factors relevant to the security and safety\nof a maritime workplace are monitored continuously\nduring work operations.\n1.3. Relevant information concerning the security and\nsafety of a maritime workplace is recognized and\ninterpreted and timely action is taken in accordance\nwith workplace procedures.\n1.4. Changes to work environment and related risks are\nmonitored and managed to ensure a safe outcome to\nworkplace operations.\n1.5. A security-related contingency plan of action is studied\nand interpreted and where necessary appropriate action\nis taken.\n1.6. Reports on matters related to vessel security are\nprepared and submitted to designated personnel in\naccordance with the ship security plan and company\nand maritime regulatory requirements.\n\n2. Recognize security\nthreats\n\n2.1. Factors that may adversely affect the security and\nsafety of a maritime workplace are identified.\n2.2. Risks to vessel or port security and safety are\nrecognized and reported to relevant security\npersonnel and appropriate action is taken to control\nthe risk in accordance with workplace procedures\nand security requirements.\n2.3. Persons posing potential security risks are\nrecognized and reported to relevant security personnel\nand appropriate action is taken to control the risk in\naccordance with workplace procedures and security\nrequirements.\n2.4. All relevant indications of a security situation are\nrecognized and appropriate action is taken to alert\nrelevant personnel and/or take appropriate action in\naccordance with workplace procedures and regulatory\nrequirements.\n\n3. Understand the need\nfor and maintaining\nsecurity awareness\nand vigilance\n3.1. Security instruction programs are participated in as per\ncompany and regulatory requirements.\n3.2. Requirements and processes for security awareness and\nvigilance are identified.\n3.3. Security and emergency drills are participated in\naccordance with the ship security plan and company\nand maritime regulatory requirements.\n3.4. Inputs to improve/enhance security training programs\nand drills are provided, where necessary.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Maritime workplace\nWorkplace may include:\n1.1. Vessels\n1.2. Port facilities\n\n2. Relevant security\npersonnel\nMay include:\n2.1. Ship security officer\n2.2. Port security officer\n2.3. Company security officer\n2.4. Master or skipper of the vessel\n2.5. Other personnel on vessel (in terms of their security\nawareness, preparedness and vigilance)\n\n3. Persons posing\npotential security risks\nMay include:\n3.1. Unknown persons photographing vessels or facilities\n3.2. Unknown persons attempting to gain access to\nvessels or facilities\n3.3. Unknown persons loitering in the vicinity of vessels\nor port facilities\n3.4. Unknown persons telephoning to ascertain security,\npersonnel or standard operating procedures on a\nvessel or at a port facility\n3.5. Vehicles or small vessels with personnel in them\nloitering and perhaps taking photographs or drawing\ndiagrams of vessels or facilities\n3.6. General aviation aircraft operating in proximity of\nvessels or facilities\n3.7. Unauthorized vendors attempting to sell merchandise\n3.8. Persons carrying suspicious parcels which could be\nbombs\n3.9. Unknown persons acting suspiciously\n3.10. Unknown persons seeking information from vessel\npersonnel or their families about vessels or port\nfacilities via either face-to-face discussion or email\n3.11. Unauthorized workers attempting to gain access to a\nvessel or port facilities to repair, replace, service or\ninstall equipment\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n40\n\nVARIABLE\nRANGE\n4. Security situation\nMay include::\n4.1. Piracy/hijacking\n4.2. Armed robbery\n4.3. Bomb threat\n4.4. Unidentified objects/explosives on vessel\n4.5. Damage to or destruction of port facility\n4.6. Damage to or destruction of vessel\n4.7. Piracy and other depredations\n4.8. Stowaways\n\n5. Security and\nemergency drills\nSecurity and emergency drills may relate to incidents such as:\n5.1. Damage to or destruction of the vessel or port facility\n(e.g. by explosive devices, arson, sabotage or\nvandalism)\n5.2. Hijacking or seizure of a vessel or of persons on\nboard\n5.3. Tampering with cargo or essential vessel equipment\nor systems or vessel's stores\n5.4. Unauthorized access to or use of the vessel\n(including presence of stowaways)\n5.5. Smuggling of weapons or equipment (including\nweapons of mass destruction)\n5.6. Use of the vessel to carry persons intending to cause\na security incident (or their equipment)\n5.7. Use of the vessel itself as a weapon or as a means\nto cause damage or destruction\n5.8. Attacks from seaward while at berth or at anchor\n5.9. Attacks while at sea\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n41\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. contributed to the enhancement of maritime security\nthrough heightened awareness\n1.2. recognized security threats\n1.3. understood the need for and methods of maintaining\nsecurity awareness and vigilance\n\n2. Required Knowledge\n2.1. IMO ISPS Code applicable to vessels and ports\n2.2. Procedures for maintaining security awareness\n2.3. Relevant security and safety regulations, rules, policies\nand procedures\n2.4. Relevant security personnel on a vessel or at a port\nfacility\n2.5. Communication procedures and protocols on matters\nrelated to vessel and port security\n2.6. Security and safety problems that may be identified\nwhen maintaining and managing situation awareness\nand action that can be taken to overcome them\n2.7. Security and safety hazards and risks that may be\nidentified in the maritime workplace and ways of\ncontrolling those hazards and associated risks\n\n3. Required Skills\n3.1. Applying the above knowledge to the management of\nsituation awareness during workplace operations\n3.2. Reading and interpreting instructions, procedures and\nother information relevant to the maintenance of vessel\nand port security\n3.3. Working as a team with others on matters relevant to the\nmaintenance of vessel and port security\n3.4. Selecting and using appropriate communications\nequipment\n3.5. Taking appropriate initiatives related to vessel and port\nsecurity within limits of role and responsibility\n3.6. Interpreting and applying security and safety practices\nand regulations\n3.7. Communicating with others on matters related to vessel\nand port security\n3.8. Modifying activities dependent on differing workplace\ncontingencies, risk situations and environments\n3.9. Identifying and solving problems associated with the\nmaintenance of vessel and port security and to report\nsecurity issues and take appropriate action based on\navailable information\n3.10. Monitoring and anticipating security problems and risks\nand taking appropriate action\n\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of Assessment Competency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related underpinning\nknowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of Assessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n42\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nSTEER THE SHIP AND COMPLY WITH HELM ORDERS\n\nUNIT CODE\n:"
