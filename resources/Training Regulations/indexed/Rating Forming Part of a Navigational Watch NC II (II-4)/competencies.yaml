        "source_text": "MTM834213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ntaking precautions towards protection of the marine\nenvironment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Practice compliance\nwith legislative\nrequirements for\nprotection of the\nmarine environment\n1.1. Relevant regulations and procedures for the protection\nof the marine environment are identified.\n1.2. Appropriate action is taken in day-to-day work to ensure\ncompliance with relevant regulations and procedures for\nthe protection of the marine environment as required.\n1.3. Appropriate action is taken where incidences of non-\ncompliance or potential non-compliance are identified in\naccordance with regulations and procedures.\n1.4. Any breach of regulations and procedures concerning\nprotection of the marine environment is rectified and/or\nreported as required within the limits of the crew’s/\nofficer’s responsibility.\n\n2. Practice anti-pollution\nprocedures\n\n2.1. Anti-pollution procedures applicable to vessel\noperations are followed in the course of day-to-day work.\n2.2. Appropriate preventive measures are undertaken to\nprevent pollution of the marine environment in\naccordance with regulations and procedures.\n2.3. Inputs are provided in the preparation of reports and\nother documentation related to the protection of marine\nenvironment in accordance with regulations and\nprocedures.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Protection of the\nmarine environment\nProtection of the marine environment may be observed:\n1.1. By day or night in both normal and emergency situations\n1.2. Under any possible conditions of sea and weather\n1.3. While underway\n1.4. During berthing and unberthing operations\n1.5. While anchoring or mooring\n1.6. 