        "source_text": "MTM834211\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ntaking immediate action upon encountering an accident or\nother medical emergency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine the need of\ncasualty\n\n1.1\nPatient condition is determined in accordance with\nestablished first aid procedures and the nature of injury\nor illness is established.\n1.2\nProbable cause, nature and extent of injuries are\nidentified and appropriate action is taken to prevent\nfurther harm to the victim and to self.\n1.3\nThe position of the patient is adjusted to optimize\npersonal comfort for the medical condition or injury\nconcerned.\n1.4\nWhere there are doubts over the seriousness of the\ninjury or illness and how to treat the patient, assistance\nis sought from senior officers or shore-based medical\nadvisers.\n\n2. Administer first-aid to\nthe victim\n\n2.1\nAppropriate first aid procedures are used to treat the\nidentified injury or illness in accordance with the first-\naider’s limits of responsibility.\n2.2\nAseptic techniques are applied during any wound\ndressing.\n2.3\nHygiene measures are used that are appropriate for the\ndegree of illness or injury.\n2.4\nCardio-pulmonary resuscitation techniques are correctly\napplied where required.\n2.5\nCondition of the patient is regularly monitored both\nvisually and through appropriate measures of bodily\nsigns.\n2.6\nHealth precautions and disease prevention measures\nare implemented in accordance with regulatory\nrequirements and company procedures.\n2.7\nAppropriate action is taken if there are signs of a\ndeterioration in the condition of the patient.\n2.8\nWhere necessary, assistance is provided in the\npreparation and transporting of the victim.\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patient\nMay include patient having:\n1.1\nHeart attack\n1.2\nStroke\n1.3\nAsthma attack\n1.4\nDiabetes\n1.5\nEpilepsy seizures\n\n2. Injuries\nInjuries on board a vessel may include:\n2.1\nExternal bleeding\n2.2\nAn amputation\n2.3\nA foreign body in the eye\n2.4\nA penetrating chest wound\n2.5\nA nose bleed\n2.6\nInternal bleeding\n2.7\nFractures, sprains, strains and dislocations\n2.8\nElectric shock\n2.9\nAsphyxia\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n26\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. identified and prioritized the need for medical first aid in\nlife-threatening medical emergencies\n1.2. administered first aid on board a vessel\n1.3. communicated effectively with others during medical\nemergencies and health care\n\n2. Required Knowledge\n2.1. Relevant sections of maritime regulations\n2.2. Emergencies, injuries and medical problems that may\noccur on board a vessel and appropriate action,\ntreatments and solutions\n2.3. Relevant OH&S and health legislation and policies\n2.4. Duties and responsibilities of the designated first aid\nofficer on board a vessel\n2.5. First aid procedures\n2.6. Shipboard procedures for:\n2.6.1. conducting an initial patient first aid assessment\n2.6.2. managing injuries\n2.6.3. managing medical emergencies\n2.6.4. carrying out resuscitation techniques\n2.7. Techniques for care of wounds\n2.8. Ways in which disease can spread on board a vessel\nand ways of preventing the spread\n2.9. Legal issues related to the administration of drugs and\nmedicines on board a vessel\n2.10. Knowledge of body structures and functions relevant to\npossible injury, illnesses and disease that may be\nencountered on board a vessel\n2.11. Maritime communication techniques related to health\ncare and receiving radio medical advice from shore-\nbased advisers\n2.12. Marine publications containing information on first aid\nand medical treatment on board a vessel\n\n3. Required Skills\n3.1. Providing first-aid on board a vessel\n3.2. Identifying and problems and emergencies and taking\nappropriate courses of action\n3.3. Applying aseptic and other precautionary techniques\nwhen carrying out first-aid procedures on board a vessel\n\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1. Demonstration and questioning of related underpinning\nknowledge\n5.2. Written examination\n5.3. Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n27\nUNIT OF COMPETENCY\n:\nCOMPLY WITH EMERGENCY PROCEDURES\n\nUNIT CODE\n:"
