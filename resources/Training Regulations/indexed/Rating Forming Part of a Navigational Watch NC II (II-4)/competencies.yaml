        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1 implemented fire prevention and minimization measures\nand procedures on board vessel\n1.2 recognized fire hazards onboard vessel and take\nappropriate action to eliminate or minimize them\n1.3 assessed the operational capability of fire-detection and\nfire- fighting equipment and systems and initiate any\nrequired maintenance or replenishment action\n1.4 responded to emergency situations involving fire\n1.5 implemented OHS principles and policies when carrying\nout fire prevention and fire–fighting duties\n1.6 communicate effectively with others as required during\nfire prevention activities and fire emergencies\n\n2. Required Knowledge\n2.1 Relevant maritime regulations concerning minimization of\nthe risk of fire on board vessel\n2.2 The chemistry of fire and its relationship to materials\ntypically carried on vessels\n2.3 Principles underlying the spread of fire and its\nextinguishment, including the elements of fire and\nexplosion (the fire triangle)\n2.4 Types and sources of ignition\n2.5 Flammable materials and fire hazards\n2.6 Factors that influence the spread of fire\n2.7 The importance of constant vigilance in fire prevention\nand minimization\n2.8 The different classes of fire, their characteristics and\nstrategies and equipment needed for their\nextinguishment\n2.9 A basic understanding of the types of fire-detection, fire-\nfighting equipment and systems used on board vessels,\ntheir features, principles of operation and the procedures\nfor their use and maintenance\n2.10 Relevant regulations and policies related to the\nmaintenance of fire equipment and systems\n2.11 Precautions and procedures that must be followed when\nresponding to electrical fires\n2.12 Precautions and procedures that must be followed when\nresponding to uptake and hydrogen fires\n2.13 Maritime communication techniques applicable to fire\nprevention and fire-minimization activities on board\nvessel\n2.14 Problems that can occur with shipboard fire-detection\nand fire hazards on board a vessel and appropriate\naction that should be taken\n2.15 Sources of information on shipboard fire prevention and\nminimization\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n20\n\n3. Required Skills\n3.1 Implementing fire prevention and minimization measures\nand procedures\n3.2 Identifying and evaluating fire hazards and taking\nappropriate courses of action\n3.3 Responding to simulated and real emergency situations\ninvolving fire\n3.4 Assessing the operational capability of fire-detection\nequipment and systems and taking any required\nmaintenance or replenishment action\n\n4. Resource Implications\nThe following resources should be provided:\n4.1 work place with recommended facilities\n4.2 tools and equipment appropriate to the activity\n4.3 materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration and questioning of related underpinning\nknowledge\n5.2 Written examination\n5.3 Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n21\nUNIT OF COMPETENCY\n:\nFIGHT AND EXTINGUISH FIRES\n\nUNIT CODE\n:"
        },
        "source_text": "MTM 834209\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming fire prevention and firefighting activities\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Carry out fire\nminimization\nprocedures\n\n1.1\nFire hazards on board vessel are identified and action\nis taken to eliminate or minimize them.\n1.2\nResponsibilities for checking fire prevention equipment\nand systems are fulfilled and appropriate action is\ntaken to ensure that they are operational.\n1.3\nAn awareness and understanding of the causes of fire\nand its minimization is maintained through\nparticipation in fire drills and related instructional\nprograms.\n1.4\nA state of readiness to respond to fire emergencies is\nmaintained at all times.\n2. Respond to\nemergencies involving\nfire\n2.1.\nEmergency situations involving fire are correctly\nidentified in accordance with established nautical\npractice.\n2.2.\nType of fire is identified in accordance with the\nestablished classification system for fires.\n2.3.\nInitial action on becoming aware of fire emergency is in\nconformity with established practices and procedures.\n2.4.\nAction taken is timely and appropriate for seriousness\nof the fire emergency.\n2.5.\nAction taken on identifying muster signals for a fire\nemergency is appropriate and complies with\nestablished procedures.\n2.6.\nAppropriate precautions and procedures are\nimplemented when responding to electrical fires.\n2.7.\nAppropriate precautions and procedures are\nimplemented when responding to uptake and hydrogen\nfires.\n2.8.\nCommunications are clear and concise at all times and\norders are acknowledged in a timely and seamanlike\nmanner.\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Fire and its\nminimization\nFire hazard minimization procedures may include:\n1.1. Housekeeping in work areas\n1.2. Following of fire safety procedures\n1.3. Checking and maintaining shipboard fire prevention\nsystems\n1.4. Identification and elimination or minimization of fire\nhazards\n1.5. Precautions when using and storing flammable\nmaterials\n1.6. Precautions that need to be taken when responding to\nan electrical fire\n1.7. Precautions that need to be taken when responding to\nuptake and hydrogen fires\n1.8. Precautions when using naked flames or welding\nequipment\n\n2. Fire emergencies\nFire emergencies on board vessel may occur:\n2.1. By day or night in both normal and emergency\nsituations\n2.2. Under any possible conditions of weather and loading\n2.3. While underway\n2.4. During berthing and un-berthing operations\n2.5. While anchoring or mooring\n2.6. While in port\n2.7. While moored or at anchor\n\n3. Type of fire\nStandard types of fires may include:\n3.1\nClass A\n3.2\nClass B\n3.3\nClass C\n3.4\nClass F\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n19\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1 implemented fire prevention and minimization measures\nand procedures on board vessel\n1.2 recognized fire hazards onboard vessel and take\nappropriate action to eliminate or minimize them\n1.3 assessed the operational capability of fire-detection and\nfire- fighting equipment and systems and initiate any\nrequired maintenance or replenishment action\n1.4 responded to emergency situations involving fire\n1.5 implemented OHS principles and policies when carrying\nout fire prevention and fire–fighting duties\n1.6 communicate effectively with others as required during\nfire prevention activities and fire emergencies\n\n2. Required Knowledge\n2.1 Relevant maritime regulations concerning minimization of\nthe risk of fire on board vessel\n2.2 The chemistry of fire and its relationship to materials\ntypically carried on vessels\n2.3 Principles underlying the spread of fire and its\nextinguishment, including the elements of fire and\nexplosion (the fire triangle)\n2.4 Types and sources of ignition\n2.5 Flammable materials and fire hazards\n2.6 Factors that influence the spread of fire\n2.7 The importance of constant vigilance in fire prevention\nand minimization\n2.8 The different classes of fire, their characteristics and\nstrategies and equipment needed for their\nextinguishment\n2.9 A basic understanding of the types of fire-detection, fire-\nfighting equipment and systems used on board vessels,\ntheir features, principles of operation and the procedures\nfor their use and maintenance\n2.10 Relevant regulations and policies related to the\nmaintenance of fire equipment and systems\n2.11 Precautions and procedures that must be followed when\nresponding to electrical fires\n2.12 Precautions and procedures that must be followed when\nresponding to uptake and hydrogen fires\n2.13 Maritime communication techniques applicable to fire\nprevention and fire-minimization activities on board\nvessel\n2.14 Problems that can occur with shipboard fire-detection\nand fire hazards on board a vessel and appropriate\naction that should be taken\n2.15 Sources of information on shipboard fire prevention and\nminimization\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n20\n\n3. Required Skills\n3.1 Implementing fire prevention and minimization measures\nand procedures\n3.2 Identifying and evaluating fire hazards and taking\nappropriate courses of action\n3.3 Responding to simulated and real emergency situations\ninvolving fire\n3.4 Assessing the operational capability of fire-detection\nequipment and systems and taking any required\nmaintenance or replenishment action\n\n4. Resource Implications\nThe following resources should be provided:\n4.1 work place with recommended facilities\n4.2 tools and equipment appropriate to the activity\n4.3 materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration and questioning of related underpinning\nknowledge\n5.2 Written examination\n5.3 Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n21\nUNIT OF COMPETENCY\n:\nFIGHT AND EXTINGUISH FIRES\n\nUNIT CODE\n:"
