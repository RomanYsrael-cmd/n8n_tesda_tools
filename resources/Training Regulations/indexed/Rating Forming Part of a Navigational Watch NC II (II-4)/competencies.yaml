  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in RATING FORMING PART OF A NAVIGATIONAL WATCH NC II\n(STCW Regulation II/4).\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills\nare used to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage\nof information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms\nand documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs and\ndiagrams\n\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n4\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n\n3. Underpinning Skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple written\nnotices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the workplace\n3.8\nGather and provide information in response to workplace\nRequirements\n\n4. Resource Implications\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n\n5. Methods of\nAssessment\n5.1\nDirect Observation\n5.2\nOral interview and written test\n\n6. Context of Assessment 6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n5\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role and\nscope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions and\nappropriate external sources\n\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to team\nare identified\n\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used\nand interactions undertaken with team members who\ncontribute to known team activities and objectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3\nObserved protocols in reporting using standard operating\nprocedures\n3.4\nContribute to the development of team work plans based\non an understanding of team’s role and objectives and\nindividual competencies of the members.\n\n--- PDF PAGE 10 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n\n2. Sources of information\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n7\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n\n3. Underpinning Skills\n3.1\nCommunicate appropriately, consistent with the culture of\nthe workplace\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the\nwork activities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships is are maintained in\nthe course of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal,\nteam and organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per established\nprocedures\n\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated as\nproof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 13 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and\nworkshops\n\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n10\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCompleted trainings and career opportunities which are\nbased on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n\n2. Underpinning\nKnowledge\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n\n3. Underpinning Skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n\n6. Context of Assessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n11\n\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE :\n500311108\n\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory and organizational requirements for occupational\nhealth and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to\nco-workers, workplace and environment in accordance\nwith organization procedures\n1.3\nContingency measures during workplace accidents, fire\nand other emergencies are recognized and established\nin accordance with organization procedures\n\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded\nwill result in harm or damage are identified based on\nthreshold limit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\n OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with\norganization OHS policies\n3.3\nPersonal protective equipment (PPE) is correctly used\nin accordance with organization OHS procedures and\npractices\n3.4\nAppropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated\nin as per established organization guidelines and\nprocedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n\n2. Hazards/Risks\nMay include:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure,\nvarying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n\n3. Contingency measures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n\n6. OHS personal records\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n13\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3. Underpinning Skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n\n4. Resource Implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nSURVIVE AT SEA IN THE EVENT OF SHIP\nABANDONMENT\n\nUNIT CODE\n:\nMTM834208\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nsurviving at sea in the event of ship abandonment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Respond to the\nindicated emergency\n\n1.1\nMuster signal is identified and appropriate action to\nrespond to the identified emergency is taken based\non established procedures.\n1.2\nTiming and sequence of individual actions are\npracticed based on prevailing circumstances and\nconditions and potential dangers and threats to\nsurvival are minimized.\n1.3\nLife-saving appliances are used in accordance with\nstandards operating procedures.\n1.4\nRecommended swimming techniques are practiced\nwith or without wearing a lifejacket.\n\n2. Board a survival craft\n2.1\nSurvival craft is boarded and dangers to other\nsurvivors are avoided based on recommended method.\n2.2\nInitial actions after leaving the ship are taken to\nminimize threats to survival.\n2.3\nSurvival craft equipment and location devices,\nincluding radio equipment, are operated based on\nestablished procedures and manufacturer’s instruction.\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Identified emergency\nMay include:\n1.1\nCollision\n1.2\nFire\n1.3\nFoundering\n1.4\nPerson falling overboard (man overboard)\n\n2. Dangers and threats to\nsurvival\nMay include:\n2.1\nCold water shock\n2.2\nHypothermia\n2.3\nPsychological response to disaster\n2.4\nLoss of will to live\n2.5\nSea sickness\n2.6\nDehydration\n2.7\nInjuries\n2.8\nStarvation\n\n3. Life-saving appliances\nMay include:\n3.1\nLife jackets\n3.2\nLife buoys\n3.3\nHard hats\n3.4\nImmersion suits and other thermal protective\naid\n3.5\nRocket line throwing appliances\n3.6\nPyrotechnic distress signals\n3.7\nGMDSS survival craft VHF radios\n3.8\nSatellite emergency position indicating radio\nbeacons EPIRBs\n3.9\nSARTs\n3.10 Whistles\n\n4. Survival Craft\nMay include:\n4.1\nFree fall life boats\n4.2\nDavit launched life boats\n4.3\nLife rafts\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n16\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nresponded to indicated emergency\n1.2\nboarded survival craft\n\n2. Required Knowledge\n2.1\nTypes of emergency situations and actions to be taken\nwhen-\n2.1.1 called to survival craft stations\n2.1.2 required to abandon ship\n2.1.3 in the water\n2.1.4 aboard a survival craft\n2.1.5 a person falls overboard (man overboard)\n2.2\nTypes, uses and location of life-saving appliances\n2.3\nSurvival craft equipment and how to operate them\n2.4\nValue of training and drills\n2.5\nTypes and uses of personal protective clothing and\nequipment\n\n3. Required Skills\n3.1\nDonning lifejacket\n3.2\nDonning and using an immersion suit\n3.3\nJumping from a height into the water\n3.4\nRighting an inverted life raft while wearing a lifejacket\n3.5\nKeeping afloat without a lifejacket\n3.6\nTaking initial action on boarding survival craft\n3.7\nStreaming a drogue or sea-anchor\n3.8\nOperating survival craft equipment\n3.9\nOperating location devices including radio equipment\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nwork place with recommended facilities\n4.2\ntools and equipment appropriate to the activity\n4.3\nmaterials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related\nunderpinning knowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n17\nUNIT OF COMPETENCY\n:\nMINIMIZE THE RISK OF FIRE AND MAINTAIN A STATE\nOF READINESS TO RESPOND TO EMERGENCY\nSITUATIONS INVOLVING FIRE\n\nUNIT CODE\n:\nMTM 834209\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming fire prevention and firefighting activities\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Carry out fire\nminimization\nprocedures\n\n1.1\nFire hazards on board vessel are identified and action\nis taken to eliminate or minimize them.\n1.2\nResponsibilities for checking fire prevention equipment\nand systems are fulfilled and appropriate action is\ntaken to ensure that they are operational.\n1.3\nAn awareness and understanding of the causes of fire\nand its minimization is maintained through\nparticipation in fire drills and related instructional\nprograms.\n1.4\nA state of readiness to respond to fire emergencies is\nmaintained at all times.\n2. Respond to\nemergencies involving\nfire\n2.1.\nEmergency situations involving fire are correctly\nidentified in accordance with established nautical\npractice.\n2.2.\nType of fire is identified in accordance with the\nestablished classification system for fires.\n2.3.\nInitial action on becoming aware of fire emergency is in\nconformity with established practices and procedures.\n2.4.\nAction taken is timely and appropriate for seriousness\nof the fire emergency.\n2.5.\nAction taken on identifying muster signals for a fire\nemergency is appropriate and complies with\nestablished procedures.\n2.6.\nAppropriate precautions and procedures are\nimplemented when responding to electrical fires.\n2.7.\nAppropriate precautions and procedures are\nimplemented when responding to uptake and hydrogen\nfires.\n2.8.\nCommunications are clear and concise at all times and\norders are acknowledged in a timely and seamanlike\nmanner.\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Fire and its\nminimization\nFire hazard minimization procedures may include:\n1.1. Housekeeping in work areas\n1.2. Following of fire safety procedures\n1.3. Checking and maintaining shipboard fire prevention\nsystems\n1.4. Identification and elimination or minimization of fire\nhazards\n1.5. Precautions when using and storing flammable\nmaterials\n1.6. Precautions that need to be taken when responding to\nan electrical fire\n1.7. Precautions that need to be taken when responding to\nuptake and hydrogen fires\n1.8. Precautions when using naked flames or welding\nequipment\n\n2. Fire emergencies\nFire emergencies on board vessel may occur:\n2.1. By day or night in both normal and emergency\nsituations\n2.2. Under any possible conditions of weather and loading\n2.3. While underway\n2.4. During berthing and un-berthing operations\n2.5. While anchoring or mooring\n2.6. While in port\n2.7. While moored or at anchor\n\n3. Type of fire\nStandard types of fires may include:\n3.1\nClass A\n3.2\nClass B\n3.3\nClass C\n3.4\nClass F\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n19\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1 implemented fire prevention and minimization measures\nand procedures on board vessel\n1.2 recognized fire hazards onboard vessel and take\nappropriate action to eliminate or minimize them\n1.3 assessed the operational capability of fire-detection and\nfire- fighting equipment and systems and initiate any\nrequired maintenance or replenishment action\n1.4 responded to emergency situations involving fire\n1.5 implemented OHS principles and policies when carrying\nout fire prevention and fire–fighting duties\n1.6 communicate effectively with others as required during\nfire prevention activities and fire emergencies\n\n2. Required Knowledge\n2.1 Relevant maritime regulations concerning minimization of\nthe risk of fire on board vessel\n2.2 The chemistry of fire and its relationship to materials\ntypically carried on vessels\n2.3 Principles underlying the spread of fire and its\nextinguishment, including the elements of fire and\nexplosion (the fire triangle)\n2.4 Types and sources of ignition\n2.5 Flammable materials and fire hazards\n2.6 Factors that influence the spread of fire\n2.7 The importance of constant vigilance in fire prevention\nand minimization\n2.8 The different classes of fire, their characteristics and\nstrategies and equipment needed for their\nextinguishment\n2.9 A basic understanding of the types of fire-detection, fire-\nfighting equipment and systems used on board vessels,\ntheir features, principles of operation and the procedures\nfor their use and maintenance\n2.10 Relevant regulations and policies related to the\nmaintenance of fire equipment and systems\n2.11 Precautions and procedures that must be followed when\nresponding to electrical fires\n2.12 Precautions and procedures that must be followed when\nresponding to uptake and hydrogen fires\n2.13 Maritime communication techniques applicable to fire\nprevention and fire-minimization activities on board\nvessel\n2.14 Problems that can occur with shipboard fire-detection\nand fire hazards on board a vessel and appropriate\naction that should be taken\n2.15 Sources of information on shipboard fire prevention and\nminimization\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n20\n\n3. Required Skills\n3.1 Implementing fire prevention and minimization measures\nand procedures\n3.2 Identifying and evaluating fire hazards and taking\nappropriate courses of action\n3.3 Responding to simulated and real emergency situations\ninvolving fire\n3.4 Assessing the operational capability of fire-detection\nequipment and systems and taking any required\nmaintenance or replenishment action\n\n4. Resource Implications\nThe following resources should be provided:\n4.1 work place with recommended facilities\n4.2 tools and equipment appropriate to the activity\n4.3 materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Demonstration and questioning of related underpinning\nknowledge\n5.2 Written examination\n5.3 Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n21\nUNIT OF COMPETENCY\n:\nFIGHT AND EXTINGUISH FIRES\n\nUNIT CODE\n:\nMTM 834210\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nfighting and extinguishing fires\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Operate portable fire-\nfighting equipment\n\n1.1\nType of fires is correctly identified in accordance with\naccepted fire-fighting practice.\n1.2\nCorrect portable fire-fighting equipment is selected\nand used to fight specific classes of fires.\n1.3\nClass F fires are correctly extinguished with a fire\nblanket in accordance with accepted fire-fighting\npractice.\n1.4\nCorrect techniques are applied for the use of hose lines\nto extinguish fires on board a vessel.\n1.5\nWhere applicable, correct techniques are applied for the\nsetting up of foam making equipment to extinguish B\nClass fires on board a vessel.\n\n2. Carry out fire-fighting\noperations\n2.1\nFire is extinguished using appropriate procedures,\ntechniques, equipment and fire-fighting agents.\n2.2\nCorrect portable fire-extinguisher(s) are selected and\nused for the class of fire involved in a fire emergency.\n2.3\nAppropriate safety clothing, appliances and\nequipment is used and safety precautions and\nprocedures are applied when fighting fires in\naccordance with regulatory requirements, vessel’s\nprocedures and established fire-fighting practice.\n2.4\nThe timing and sequence of individual actions when\nfighting fires onboard a vessel are appropriate to the\nprevailing circumstances and conditions.\n2.5\nSearch and rescue operations in a smoke filled\nenvironment are correctly conducted as a member of a\nfire-fighting team in accordance with accepted fire-\nfighting practice.\n2.6\nInterior fires are extinguished using appropriate fire-\nfighting equipment and procedures as a member of a\nfire-fighting team in accordance with accepted fire-\nfighting practice.\n2.7\nLifeline signals are correctly used during interior fire-\nfighting operations.\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Type of fire\nStandard types of fires may include:\n1.1 Class A\n1.2 Class B\n1.3 Class C\n1.4 Class F\n\n2. Fire-fighting equipment Fire-fighting equipment, appliances and systems may include:\n2.1 Portable fire extinguishers including foam, water, CO 2 ,\ndry chemical and wet foam\n2.2 Fire blankets\n2.3 CO2 fixed systems\n2.4 Foam installations including semi-portable and fixed\nsystems\n2.5 Sprinkler systems\n2.6 Fire pumps (main and emergency fire pump)\n2.7 Fire hoses, hydrants, branches and international shore\nconnection\n\n3. Fire on board a vessel\n\nFire emergencies on board vessel may occur:\n3.1 By day or night in both normal and emergency situations\n3.2 Under any possible conditions of weather and loading\n3.3 While underway\n3.4 During berthing and un-berthing operations\n3.5 While anchoring or mooring\n3.6 While in port\n3.7 While moored or at anchor\n\n4. Safety clothing,\nappliances and\nequipment\nSafety clothing and equipment may include:\n4.1 Fire-resistant clothing\n4.2 Self-contained breathing apparatus (SCBA)\n4.3 Masks\n4.4 Eye and ear protection\n4.5 Gloves\n4.6 Boots\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n23\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nparticipated in simulated on-boar d fire-fighting\nactivities\n1.2\nparticipated in search and rescue and fire-fighting\nteams\n1.3\napplied OHS principles and policies when carrying out\nfire-fighting duties\n1.4\ncommunicated effectively with others as required\nduring fire emergencies\n\n2. Required Knowledge\n2.1\nKnowledge of relevant maritime regulations\n2.2\nThe chemistry of fire and its relationship to materials\ntypically carried on vessels\n2.3\nPrinciples underlying the spread of fire and how it is\nextinguished\n2.4\nThe different types of fire, their characteristics and\nstrategies and equipment needed to extinguish them\n2.5\nPrinciples and procedures for the use of self-contained\nbreathing apparatus (SCBA) when fighting fires\n2.6\nFire-fighting clothing, outfits and personal safety\nequipment used when fighting a fire onboard a vessel\n2.7\nTypes fire-fighting appliances, equipment and systems\nused on board vessels, their features, principles of\noperation and the procedures for their use and\nmaintenance\n2.8\nFixed fire prevention and extinguishing installations\nused on vessels and their principles of operation\n2.9\nFire-fighting techniques, agents and precautions\napplicable to different types of fire on board a vessel\n2.10 Maritime communication techniques applicable to fire-\nfighting activities onboard a vessel\n2.11 Typical problems that can occur with shipboard fire-\nfighting equipment and operations and appropriate\nremedial action and solutions\n2.12 Sources of information on shipboard fire prevention and\nextinguishment\n\n3. Required Skills\n3.1\nApplying fire prevention measures and procedures\n3.2\nIdentifying fire fighting problems and determining\nappropriate courses of action\n3.3\nParticipating as a member of an interior search and\nrescue and fire-fighting team on board a vessel\n3.4\nDetermining the operational capability of fire-fighting\nappliances, equipment and systems\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nwork place with recommended facilities\n4.2\ntools and equipment appropriate to the activity\n4.3\nmaterials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related\nunderpinning knowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n24\nUNIT OF COMPETENCY\n:\nTAKE IMMEDIATE ACTION UPON ENCOUNTERING\nAN ACCIDENT OR OTHER MEDICAL EMERGENCY\n\nUNIT CODE\n:\nMTM834211\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ntaking immediate action upon encountering an accident or\nother medical emergency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine the need of\ncasualty\n\n1.1\nPatient condition is determined in accordance with\nestablished first aid procedures and the nature of injury\nor illness is established.\n1.2\nProbable cause, nature and extent of injuries are\nidentified and appropriate action is taken to prevent\nfurther harm to the victim and to self.\n1.3\nThe position of the patient is adjusted to optimize\npersonal comfort for the medical condition or injury\nconcerned.\n1.4\nWhere there are doubts over the seriousness of the\ninjury or illness and how to treat the patient, assistance\nis sought from senior officers or shore-based medical\nadvisers.\n\n2. Administer first-aid to\nthe victim\n\n2.1\nAppropriate first aid procedures are used to treat the\nidentified injury or illness in accordance with the first-\naider’s limits of responsibility.\n2.2\nAseptic techniques are applied during any wound\ndressing.\n2.3\nHygiene measures are used that are appropriate for the\ndegree of illness or injury.\n2.4\nCardio-pulmonary resuscitation techniques are correctly\napplied where required.\n2.5\nCondition of the patient is regularly monitored both\nvisually and through appropriate measures of bodily\nsigns.\n2.6\nHealth precautions and disease prevention measures\nare implemented in accordance with regulatory\nrequirements and company procedures.\n2.7\nAppropriate action is taken if there are signs of a\ndeterioration in the condition of the patient.\n2.8\nWhere necessary, assistance is provided in the\npreparation and transporting of the victim.\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Patient\nMay include patient having:\n1.1\nHeart attack\n1.2\nStroke\n1.3\nAsthma attack\n1.4\nDiabetes\n1.5\nEpilepsy seizures\n\n2. Injuries\nInjuries on board a vessel may include:\n2.1\nExternal bleeding\n2.2\nAn amputation\n2.3\nA foreign body in the eye\n2.4\nA penetrating chest wound\n2.5\nA nose bleed\n2.6\nInternal bleeding\n2.7\nFractures, sprains, strains and dislocations\n2.8\nElectric shock\n2.9\nAsphyxia\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n26\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. identified and prioritized the need for medical first aid in\nlife-threatening medical emergencies\n1.2. administered first aid on board a vessel\n1.3. communicated effectively with others during medical\nemergencies and health care\n\n2. Required Knowledge\n2.1. Relevant sections of maritime regulations\n2.2. Emergencies, injuries and medical problems that may\noccur on board a vessel and appropriate action,\ntreatments and solutions\n2.3. Relevant OH&S and health legislation and policies\n2.4. Duties and responsibilities of the designated first aid\nofficer on board a vessel\n2.5. First aid procedures\n2.6. Shipboard procedures for:\n2.6.1. conducting an initial patient first aid assessment\n2.6.2. managing injuries\n2.6.3. managing medical emergencies\n2.6.4. carrying out resuscitation techniques\n2.7. Techniques for care of wounds\n2.8. Ways in which disease can spread on board a vessel\nand ways of preventing the spread\n2.9. Legal issues related to the administration of drugs and\nmedicines on board a vessel\n2.10. Knowledge of body structures and functions relevant to\npossible injury, illnesses and disease that may be\nencountered on board a vessel\n2.11. Maritime communication techniques related to health\ncare and receiving radio medical advice from shore-\nbased advisers\n2.12. Marine publications containing information on first aid\nand medical treatment on board a vessel\n\n3. Required Skills\n3.1. Providing first-aid on board a vessel\n3.2. Identifying and problems and emergencies and taking\nappropriate courses of action\n3.3. Applying aseptic and other precautionary techniques\nwhen carrying out first-aid procedures on board a vessel\n\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1. Demonstration and questioning of related underpinning\nknowledge\n5.2. Written examination\n5.3. Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n27\nUNIT OF COMPETENCY\n:\nCOMPLY WITH EMERGENCY PROCEDURES\n\nUNIT CODE\n:\nMTM834212\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required to\ntake appropriate initial action on becoming aware of an\nemergency on board a commercial vessel in conformance\nwith the established emergency response procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Take action on becoming\naware of an emergency\n1.1 Emergency situations are recognized and identified.\n1.2 Responses to an emergency situation followed the\nestablished vessel’s emergency response procedures.\n1.3 Correct actions are taken on discovery of an actual or\npotential emergencies/emergency situation in\naccordance with established vessel’s emergency\nresponse procedures.\n1.4 Information given on raising alarm is prompt, accurate,\ncomplete and clear.\n\n2. Follow established\nemergency procedures\n2.1 Vessel’s contingency plans for emergency response\nare known and are implemented in real and simulated\nemergency situations.\n2.2 Escape routes and internal and external\ncommunications and alarm systems are used in real\nand simulated emergency situations in accordance\nwith regulatory requirements and established\nprocedures.\n2.3 Emergency communications and alarm signals and\nsystems are understood and required action\nimplemented in accordance with emergency\nprocedures and regulatory requirements.\n2.4 Planned damage control procedures for dealing with\ndamage to the vessel and its hull are implemented in\naccordance with company procedures and regulatory\nrequirements.\n\n3. Follow procedures for the\nuse of various life-saving\nequipment\n3.1 Participation in life saving drills confirms readiness to\ncorrectly carry out life-saving procedures and use life-\nsaving equipment.\n3.2 Procedures for the use of various shipboard life-saving\nappliances are followed in accordance with regulatory\nrequirements, manufacturer’s instructions and\ncompany procedures.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergency situations\nMay include:\n1.1 Collision with another vessel\n1.2 Explosion on board vessel\n1.3 Fire on board vessel\n1.4 Impairment of integrity of hull and ingress of water\n1.5 Loss of steering control\n1.6 Lost of motive power\n1.7 Foundering\n1.8 Grounding\n1.9 Beaching a vessel\n1.10 Person overboard\n1.11 Rescue and evacuation of injured personnel\n\n2. Potential emergencies\nMay occur:\n2.1 By day or night\n2.2 Under any possible conditions of weather and\nloading\n2.3 While underway\n2.4 During berthing and unberthing operations\n2.5 While anchoring or mooring\n2.6 When bunkering\n2.7 During cargo handling operations\n\n3. Regulatory requirements\nMay include:\n3.1 SOLAS convention\n3.2 IMO STCW Codes and Convention\n3.3 Relevant domestic and international OH&S\nlegislation\n\n4. Life-saving equipment\nMay include:\n4.1 Life jackets\n4.2 Exposure and immersion suits\n4.3 Survival craft\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n29\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nundertook appropriate action in the event of emergency\nsituations\n1.2\nfollowed established procedures and regulatory\nrequirements during emergency responses’ procedures\n1.3\nfollowed procedures for the use of various life-saving\nequipment\n1.4\nparticipated in drills in preparation for the implementation of\nemergency responses\n1.5\ncommunicated effectively with others during emergency\nresponses’ procedures\n\n2. Required\nKnowledge\n2.1\nTypes of emergencies\n2.2\nShipboard contingency plans\n2.3\nKnowledge of relevant maritime regulations\n2.4\nRelevant OH&S legislation and policies\n2.5\nNavigational emergencies for vessels and appropriate\naction and solutions\n2.6\nIndications of various types of emergency situations and\nthe action to be followed when various types of actual or\npotential emergency situations are identified\n2.7\nEmergency alarm signals and systems in use on vessels\nand procedures to be followed when an emergency alarm\nis raised\n2.8\nEscape routes and internal and external communications\nsystems and alarms on board a vessel\n2.9\nGeneral principles of damage control and the manner in\nwhich watertight integrity of hull is maintained on a vessel,\nincluding the importance of preparation, control and repair\n2.10 Ways of controlling damage during a flooding emergency,\nincluding the use of various shipboard items that can be\nused for damage control purposes such as mattresses,\ncanvas and clothing\n2.11 Maritime communication techniques used during\nnavigational emergencies of actual or potential emergency\nsituations are identified\n2.12 Emergency alarm signals and systems in use on vessels\nand procedures to be followed when an emergency alarm\nis raised\n2.13 Escape routes and internal and external communications\nsystems and alarms on board a vessel\n2.14 General principles of damage control and the manner in\nwhich watertight integrity of hull is maintained on a vessel,\nincluding the importance of preparation, control and repair\n2.15 Ways of controlling damage during a flooding emergency,\nincluding the use of various shipboard items that can be\nused for damage control purposes such as mattresses,\ncanvas and clothing\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n30\n\n3. Required Skills\n3.1 Applying navigational emergencies for vessels and\nappropriate action and solutions\n3.2 Applying appropriate action in various types of actual or\npotential emergency situations\n3.3 Using emergency alarm signals and systems\n3.4 Using various shipboard items to be used for damage\ncontrol purposes such as mattresses, canvas and clothing\n3.5 Using personal safety equipment\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1\nsimulated workplace environment\n4.2\nworkplace standards, procedures, policies, guidelines\n4.3\ntools and equipment relevant to work activities\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n5.1\nObservation/simulated practical demonstration in\nresponding to emergency situations onboard a commercial\nvessel, and/or\n5.2\nSimulation/role plays to test the candidate’s knowledge and\nskills in complying with emergency procedures\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n31\nUNIT OF COMPETENCY\n:\nTAKE PRECAUTIONS TO PREVENT POLLUTION OF\nTHE MARINE ENVIRONMENT\n\nUNIT CODE\n:\nMTM834213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ntaking precautions towards protection of the marine\nenvironment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Practice compliance\nwith legislative\nrequirements for\nprotection of the\nmarine environment\n1.1. Relevant regulations and procedures for the protection\nof the marine environment are identified.\n1.2. Appropriate action is taken in day-to-day work to ensure\ncompliance with relevant regulations and procedures for\nthe protection of the marine environment as required.\n1.3. Appropriate action is taken where incidences of non-\ncompliance or potential non-compliance are identified in\naccordance with regulations and procedures.\n1.4. Any breach of regulations and procedures concerning\nprotection of the marine environment is rectified and/or\nreported as required within the limits of the crew’s/\nofficer’s responsibility.\n\n2. Practice anti-pollution\nprocedures\n\n2.1. Anti-pollution procedures applicable to vessel\noperations are followed in the course of day-to-day work.\n2.2. Appropriate preventive measures are undertaken to\nprevent pollution of the marine environment in\naccordance with regulations and procedures.\n2.3. Inputs are provided in the preparation of reports and\nother documentation related to the protection of marine\nenvironment in accordance with regulations and\nprocedures.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Protection of the\nmarine environment\nProtection of the marine environment may be observed:\n1.1. By day or night in both normal and emergency situations\n1.2. Under any possible conditions of sea and weather\n1.3. While underway\n1.4. During berthing and unberthing operations\n1.5. While anchoring or mooring\n1.6. While moored or at anchor\n1.7. During loading and unloading operations\n1.8. During maintenance operations\n\n2. Anti-pollution\nprocedures\nAnti-pollution procedures include checking of items and\nequipment such as:\n2.1. Pumps\n2.2. Valves\n2.3. Emission control equipment\n2.4. Water management equipment including: cooling water,\nballast water and bilge systems\n2.5. Waste storage and recycling equipment\n2.6. Ballast management equipment\n\n3. Preventive measures\nPreventative measures to protect the marine environment\nmay include:\n3.1. Prevention of spillages of cargo\n3.2. Prevention of spillage s of fuel and oil\n3.3. Control of polluting emissions of gas and smoke\n3.4. Effective management of waste, pollution and recycling\nprocesses\n3.5. Effective management of ballast operations\n3.6. Shipboard housekeeping\n3.7. Pollution control instructions\n\n4. Regulations\nApplicable regulations may include:\n4.1. MARPOL Convention\n4.2. IMO STCW Code and Convention related to the\nprotection of marine environment\n4.3. Relevant international and/or local legislation related to\nthe protection of the marine environment\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n33\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. practiced compliance with legislative requirements for\nprotection of the marine environment\n1.2. practiced preventative and remedial anti-pollution\nprocedures as per relevant regulations and procedures\n1.3. identified typical pollution control problems and take\nappropriate action\n1.4. communicate effectively with others concerning\nmeasures to protect the marine environment\n\n2. Required Knowledge\n2.1. Relevant legislation, codes of practice, policies and\nprocedures to protect the marine environment\n2.2. Impact of shipping on the marine environment and the\neffects of operational or accidental pollution on it\n2.3. Basic environmental protection procedures\n2.4. Pollution control problems and related measures to\nprotect the marine environment\n2.5. Complexity and diversity of the marine environment\n2.6. Requirements under local and/or international legislation\nand conventions for reporting incidents related to\nbreaches of the statutory codes and measures for the\nprotection of the marine environment\n\n3. Required Skills\n3.1. Completing activities aimed at compliance with relevant\nregulatory requirements for protection of the marine\nenvironment\n3.2. Identifying and evaluating problems related to\ncompliance with relevant regulations for environmental\nprotection and determining an appropriate courses of\naction\n3.3. Following anti-pollution procedures\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1. Demonstration and questioning of related underpinning\nknowledge\n5.2. Written examination\n5.3. Portfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n34\nUNIT OF COMPETENCY\n:\nOBSERVE SAFE WORKING PRACTICES\n\nUNIT CODE\n:\nMTM834214\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required to\nobserve established maritime safe working practices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Identify and follow\nworkplace procedures\nfor hazard\nidentification and risk\ncontrol\n1.1 Safety regulations and established vessel’s safety and\nhazard control practices and procedures are obtained,\ninterpreted and applied to day-to-day work activities.\n1.2 Workplace procedures for Occupational Health and\nSafety and related work instructions for controlling risks\nonboard a vessel are followed.\n1.3 Workplace procedures for dealing with shipboard\naccidents, fire and emergencies are known and followed.\n1.4 Hazards in the workplace are identified and appropriate\naction is taken to report them and to minimize or eliminate\nrisk to personnel, vessel and the environment.\n1.5 Where relevant, procedures and precautions necessary\nfor entry into a pump room, fuel tanks or other confined\nspaces on a vessel are followed.\n1.6 Personal protection clothing and equipment is used in\naccordance with established shipboard safety practices\nand procedures.\n1.7 Appropriate assistance is provided in the event of a\nshipboard emergency to secure the vessel and its\nmachinery and equipment and to maintain the safety of\nthe vessel and persons involved.\n1.8 Established emergency and contingency plans are\nfollowed in the event of a shipboard emergency.\n2. Contribute to\narrangements for the\nmanagement of\noccupational health\nand safety\n2.1 Occupational Health and Safety issues and identified\nsafety hazards are raised with designated personnel in\naccordance with workplace procedures and relevant\noccupational health and safety legislation.\n2.2 Contributions to occupational health and safety\nmanagement in the workplace are made within workplace\nprocedures and provisions of relevant legislation.\n2.3 Occupational health and safety issues are raised with\ndesignated personnel in accordance with workplace\nprocedures and relevant occupational health and safety\nlegislation.\n2.4 Contribute to participative arrangements for\noccupational health and safety management in the\nworkplace within vessel’s procedures and scope of\nresponsibilities and competencies.\n3. Take necessary\nactions to control\nfatigue\n3.1 Fatigue symptoms are recognized and identified.\n3.2 Corrective actions are taken on discovery of fatigue in\naccordance with established company procedures.\n3.3 Fatigue management practices are observed at all times.\n3.4 Reports related to incidence of fatigue are communicated\nto appropriate authority in accordance with established\ncompany procedures.\n4. Complete occupational\nhealth and safety\nrecords\n4.1 Occupational health and safety records for self are\ncompleted in accordance with workplace requirements.\n4.2 Legal requirements for the maintenance of records of\noccupational injury and diseases are followed.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergencies\nMay include:\n1.1\nLoss of propulsion\n1.2\nLoss of electrical power\n1.3\nLoss of steerage\n1.4\nFlooding of vessel\n1.5\nFire or explosion\n1.6\nLoss of refrigeration\n1.7\nLoss of water making ability\n1.8\nFuel oil, lubrication oil, steam and gas leaks\n1.9\nOverheating and over speed of machinery,\ngovernors, emergency trips\n\n2. Hazards in the workplace\nMay include:\n2.1\nMoving heavy loads in an unsafe work\nenvironment\n2.2\nUnsecure machinery, components or repair\nequipment\n2.3\nSlippery deck\n2.4\nWelding equipment\n2.5\nSharp tools and implements\n2.6\nPower tools\n2.7\nMoving and rotating machinery\n2.8\nFlammable liquids, vapors and fuel\n2.9\nUsing equipment beyond safe working limits\n2.10 Poor housekeeping procedures\n2.11 Electrical wiring and systems\n2.12 Hot pipes and valves (steam, fuel oil, lubricating\noil)\n2.13 Cold pipes and valves (refrigeration and liquefied\ngas cargoes)\n2.14 Working at heights\n2.15 Exposed electrical circuits\n2.16 Toxic gases and substances\n2.17 Chemicals and other harmful substances\n2.18 Damaged cargo and containers\n\n3. Participative\narrangements\nMay include:\n3.1\nFormal and informal meetings which include\noccupational health and safety\n3.2\nOccupational health and safety committees\n3.3\nOther committees, for example, consultative,\nplanning and purchasing\n3.4\nHealth and safety representatives\n3.5\nSuggestions, requests, reports and concerns put\nforward by vessel’s crew to senior officers\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n36\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1\nidentified and followed workplace procedures for hazard\nidentification and risk control\n1.2\ncontributed to arrangements for the management of OHS\nonboard a vessel\n1.3\nunderstood and taken necessary actions to control fatigue\n1.4\ncompleted OHS records as required\n1.5\ncommunicated effectively with others on workplace safety\nmatters\n\n2. Required\nKnowledge\n2.1\nKnowledge of relevant maritime and OHS regulations\n2.2\nISM Code Safety Management System procedures (where\napplicable)\n2.3\nThe provisions of OHS Acts, regulations and codes of\npractice relevant to the workplace, including the rights and\nresponsibilities of the workplace parties under OHS Acts,\nregulations and codes of practice;\n2.4\nThe ways in which OHS is managed in the workplace, and\nactivities required under OHS legislation, for example:\n2.4.1 policies\n2.4.2 procedures\n2.4.3 plant and equipment maintenance\n2.4.4 hazard identification\n2.4.5 risk assessment and control\n2.4.6 OHS instruction\n2.4.7 training and provision of OHS information\n2.5\nHazards that exist in the workplace\n2.6\nThe preferred order of ways to control risks (known as the\nhierarchy of control);\n2.7\nWorkplace OHS procedures relevant to the work being\nundertaken, including procedures for:\n2.7.1 recognizing and reporting on hazards, for example,\nwork area inspections\n2.7.2 work operations to control risks, for example, permit\nto work systems and isolation procedures\n2.7.3 responding to accidents, fires and emergencies\n2.7.4 raising OHS issues\n2.7.5 employee participation in OHS management, for\nexample, consultative or OHS committees and\n2.7.6 joint employer/employee inspections\n2.8\nThe meaning of OHS symbols found on signs and labels in\nthe workplace\n2.9\nDesignated personnel responsible for OHS onboard a\nvessel\n2.10 Effects of sleep, schedules, and the circadian rhythm on\nfatigue\n2.11 Effects of physical stressors on seafarers\n2.12 Effects of environmental stressors in and outside the ship\nand their impact\n2.13 Effects of schedule changes on seafarer fatigue\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n37\n\n3. Required Skills\n3.1 Applying OHS in the workplace, and activities required\nunder OHS legislation,\n3.2 Applying order of ways to control risks (known as the\nhierarchy of control)\n3.3 Designating personnel responsible for OHS onboard a\nvessel\n3.4 Communication skills\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 simulated workplace environment\n4.2 workplace standards, procedures, policies, guidelines\n4.3 tools and equipment relevant to work activities\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation/simulated practical demonstration in the\napplication of safe working practices and safety hazard\ncontrol onboard a vessel\n5.2 Simulation/role plays to test the candidate’s knowledge and\nskills in the application of safe working practices and hazard\ncontrol and safety hazard control on a commercial/or\ntraining vessel\n\n6. Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in\nsimulated work environment\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n38\nUNIT OF COMPETENCY\n:\nDEMONSTRATE SECURITY AWARENESS\nPRACTICES\n\nUNIT CODE\n:\nMTM834215\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\ndemonstrating security awareness practices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Contribute to the\nenhancement of\nmaritime security\nthrough heightened\nawareness\n1.1. Requirements relating to enhanced maritime security are\nidentified.\n1.2. All critical factors relevant to the security and safety\nof a maritime workplace are monitored continuously\nduring work operations.\n1.3. Relevant information concerning the security and\nsafety of a maritime workplace is recognized and\ninterpreted and timely action is taken in accordance\nwith workplace procedures.\n1.4. Changes to work environment and related risks are\nmonitored and managed to ensure a safe outcome to\nworkplace operations.\n1.5. A security-related contingency plan of action is studied\nand interpreted and where necessary appropriate action\nis taken.\n1.6. Reports on matters related to vessel security are\nprepared and submitted to designated personnel in\naccordance with the ship security plan and company\nand maritime regulatory requirements.\n\n2. Recognize security\nthreats\n\n2.1. Factors that may adversely affect the security and\nsafety of a maritime workplace are identified.\n2.2. Risks to vessel or port security and safety are\nrecognized and reported to relevant security\npersonnel and appropriate action is taken to control\nthe risk in accordance with workplace procedures\nand security requirements.\n2.3. Persons posing potential security risks are\nrecognized and reported to relevant security personnel\nand appropriate action is taken to control the risk in\naccordance with workplace procedures and security\nrequirements.\n2.4. All relevant indications of a security situation are\nrecognized and appropriate action is taken to alert\nrelevant personnel and/or take appropriate action in\naccordance with workplace procedures and regulatory\nrequirements.\n\n3. Understand the need\nfor and maintaining\nsecurity awareness\nand vigilance\n3.1. Security instruction programs are participated in as per\ncompany and regulatory requirements.\n3.2. Requirements and processes for security awareness and\nvigilance are identified.\n3.3. Security and emergency drills are participated in\naccordance with the ship security plan and company\nand maritime regulatory requirements.\n3.4. Inputs to improve/enhance security training programs\nand drills are provided, where necessary.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Maritime workplace\nWorkplace may include:\n1.1. Vessels\n1.2. Port facilities\n\n2. Relevant security\npersonnel\nMay include:\n2.1. Ship security officer\n2.2. Port security officer\n2.3. Company security officer\n2.4. Master or skipper of the vessel\n2.5. Other personnel on vessel (in terms of their security\nawareness, preparedness and vigilance)\n\n3. Persons posing\npotential security risks\nMay include:\n3.1. Unknown persons photographing vessels or facilities\n3.2. Unknown persons attempting to gain access to\nvessels or facilities\n3.3. Unknown persons loitering in the vicinity of vessels\nor port facilities\n3.4. Unknown persons telephoning to ascertain security,\npersonnel or standard operating procedures on a\nvessel or at a port facility\n3.5. Vehicles or small vessels with personnel in them\nloitering and perhaps taking photographs or drawing\ndiagrams of vessels or facilities\n3.6. General aviation aircraft operating in proximity of\nvessels or facilities\n3.7. Unauthorized vendors attempting to sell merchandise\n3.8. Persons carrying suspicious parcels which could be\nbombs\n3.9. Unknown persons acting suspiciously\n3.10. Unknown persons seeking information from vessel\npersonnel or their families about vessels or port\nfacilities via either face-to-face discussion or email\n3.11. Unauthorized workers attempting to gain access to a\nvessel or port facilities to repair, replace, service or\ninstall equipment\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n40\n\nVARIABLE\nRANGE\n4. Security situation\nMay include::\n4.1. Piracy/hijacking\n4.2. Armed robbery\n4.3. Bomb threat\n4.4. Unidentified objects/explosives on vessel\n4.5. Damage to or destruction of port facility\n4.6. Damage to or destruction of vessel\n4.7. Piracy and other depredations\n4.8. Stowaways\n\n5. Security and\nemergency drills\nSecurity and emergency drills may relate to incidents such as:\n5.1. Damage to or destruction of the vessel or port facility\n(e.g. by explosive devices, arson, sabotage or\nvandalism)\n5.2. Hijacking or seizure of a vessel or of persons on\nboard\n5.3. Tampering with cargo or essential vessel equipment\nor systems or vessel's stores\n5.4. Unauthorized access to or use of the vessel\n(including presence of stowaways)\n5.5. Smuggling of weapons or equipment (including\nweapons of mass destruction)\n5.6. Use of the vessel to carry persons intending to cause\na security incident (or their equipment)\n5.7. Use of the vessel itself as a weapon or as a means\nto cause damage or destruction\n5.8. Attacks from seaward while at berth or at anchor\n5.9. Attacks while at sea\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n41\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. contributed to the enhancement of maritime security\nthrough heightened awareness\n1.2. recognized security threats\n1.3. understood the need for and methods of maintaining\nsecurity awareness and vigilance\n\n2. Required Knowledge\n2.1. IMO ISPS Code applicable to vessels and ports\n2.2. Procedures for maintaining security awareness\n2.3. Relevant security and safety regulations, rules, policies\nand procedures\n2.4. Relevant security personnel on a vessel or at a port\nfacility\n2.5. Communication procedures and protocols on matters\nrelated to vessel and port security\n2.6. Security and safety problems that may be identified\nwhen maintaining and managing situation awareness\nand action that can be taken to overcome them\n2.7. Security and safety hazards and risks that may be\nidentified in the maritime workplace and ways of\ncontrolling those hazards and associated risks\n\n3. Required Skills\n3.1. Applying the above knowledge to the management of\nsituation awareness during workplace operations\n3.2. Reading and interpreting instructions, procedures and\nother information relevant to the maintenance of vessel\nand port security\n3.3. Working as a team with others on matters relevant to the\nmaintenance of vessel and port security\n3.4. Selecting and using appropriate communications\nequipment\n3.5. Taking appropriate initiatives related to vessel and port\nsecurity within limits of role and responsibility\n3.6. Interpreting and applying security and safety practices\nand regulations\n3.7. Communicating with others on matters related to vessel\nand port security\n3.8. Modifying activities dependent on differing workplace\ncontingencies, risk situations and environments\n3.9. Identifying and solving problems associated with the\nmaintenance of vessel and port security and to report\nsecurity issues and take appropriate action based on\navailable information\n3.10. Monitoring and anticipating security problems and risks\nand taking appropriate action\n\n4. Resource Implications\nThe following resources should be provided:\n4.1. work place with recommended facilities\n4.2. tools and equipment appropriate to the activity\n4.3. materials relevant to the proposed activity and tasks\n\n5. Methods of Assessment Competency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related underpinning\nknowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of Assessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n42\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nSTEER THE SHIP AND COMPLY WITH HELM ORDERS\n\nUNIT CODE\n:\nMTM834313\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin steering the ship and comply with helm orders in the\nEnglish language\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Steer the ship using\nmagnetic and gyro\ncompass\n1.1\nVessel is steered under the direction of the Officer of\nthe Watch in response to helm orders and set course.\n1.2\nVessel’s heading is maintained within acceptable limits\nwith respect to the directions of the Officer of the Watch,\ngiven helm orders, the area of navigation and taking into\naccount environmental effects.\n1.3\nVessel’s steady course is maintained for ten minutes\nwithin 2 degrees.\n1.4\nAlterations of heading are smooth and controlled at all\ntimes.\n1.5\nCommunication is clear, concise and acknowledged at\nall times according to good seamanship.\n1.6\nSteering is changed from automatic pilot to manual\nsteering and vice versa in accordance with to the\ndirections of the Officer of the Watch, helm orders,\nvessel’s procedures and manufacturer’s instructions.\n1.7\nSafe operating limits of vessel’s steering systems are\nnot exceeded.\n1.8\nSteering techniques are consistent with the prevailing\nweather and sea conditions or possible states of\nemergency.\n\n2. Respond to helm\norders\n\n2.1\nThe directions of the Officer of the Watch and helm\norders are correctly understood, acknowledged and\npromptly acted upon.\n2.2\nConfirmation or clarification of directions and helm\norders is sought where they are not clearly understood.\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Under the direction of\nthe Officer of the\nWatch\nMay include:\n1.1 Work must be carried out in compliance with the relevant\nsections of the IMO STCW Conventions and Codes.\n1.2 Work is performed under the directions of the Officer in\nCharge of the Watch using a prescribed range of\nprocedures/methods either individually or in a team\nenvironment with some accountability for the quality of\noutcomes.\n1.3 Work involves the use of known and defined steering\ntechniques across a variety of navigational contexts in\nresponse to the directions of the Officer of the Watch\n2. Safe operating limits\nMay include:\n2.1 Commercial vessel of 500 GT and above\n2.2 Hand steering or automatic pilot\n2.3 Steering of the vessel may be carried out\n2.3.1. by day or night in both normal and emergency\nsituations\n2.3.2. under any possible conditions of weather and\nloading\n2.3.3. while underway\n2.3.4. during berthing and unberthing operations\n2.3.5. while anchoring or mooring\n2.3.6. when navigating in and near ‘traffic separation\nschemes’ and ‘vessel traffic service areas’\n2.3.7. in shallow water, rivers, estuaries and restricted\nwaters\n2.3.8. when towing and being towed\n2.3.9. when dragging an anchor and clearing a foul\nanchor\n2.4 Helm orders will be given in the English language and\nrequire sufficient proficiency in speaking and\nunderstanding in English to communicate effectively with\nthe master and others on the bridge of the vessel.\n2.5 Emergencies:\n2.5.1. man overboard\n2.5.2. collision\n2.5.3. grounding\n2.5.4. when hove to\n2.5.5. fire or flooding on board vessel.\n2.6 Special steering techniques required in adverse weather:\n2.6.1. steering in the face of strong winds, high sea\nstate, heavy swell and surf\n2.6.2. steering an unmanageable vessel out of the\ntrough of the sea in response to helm orders\n2.6.3. steering to assist a vessel in distress\n2.6.4. steering during towing operations\n2.6.5. steering during the launching of rescue boats and\nsurvival craft\n2.6.6. steering when taking on board survivors from\nrescue boats and survival craft\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n44\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. steered a vessel under the directions of the Officer in\nCharge of the Watch and in response to helm orders:\n1.1.1. in normal and emergency situations and adverse\nweather conditions\n1.1.2. when underway\n1.1.3. when anchoring or mooring\n1.1.4. during berthing and unberthing operations\n1.1.5. while anchoring or mooring\n1.1.6. during emergencies\n1.2. exercised all required safety and hazard control\nprocedures when steering a vessel\n1.3. identified typical steering problems and take appropriate\naction\n1.4. communicated effectively with others in the bridge team\nwhen steering a vessel\n\n2. Required Knowledge\n\n2.1 Knowledge of relevant sections of IMO STCW\nConvention and Codes and applicable to the steering of\nvessels\n2.2 Limits of responsibility of a rating on a vessel carrying out\nsteering duties\n2.3 Typical helm orders and steering action required\n2.4 Effects on steering of wind, currents and bottom\ntopography\n2.5 Steering problems for various sizes of vessels and\nappropriate action and solutions\n2.6 Procedures for changing over from automatic pilot to\nhand steering and vice versa\n2.7 Principles and procedures for steering a vessel\n2.8 Steering techniques in and near ‘traffic separation\nschemes’ and ‘vessel traffic service areas’\n\n3. Required Skills\n\n3.1 Changing over from automatic pilot to hand steering and\nvice versa\n3.2 Steering a vessel\n3.3 Steering in and near ‘traffic separation schemes’ and\n‘vessel traffic service areas’\n3.4 Ability to communicate effectively in the English\nlanguage with the Master and others in the bridge team\n3.5 Maritime communication techniques, including\nresponding to helm orders\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n45\n\n4. Resource Implication\n\nAccess is required to opportunities to either:\n4.1 steer a vessel using a simulator, meeting the\nrequirements of Section A I/12 of the IMO STCW Code,\nover an appropriate range of simulated maneuvering\nsituations, weather and loading conditions; and/or\n4.2 steer a working or training vessel under the direction of\nthe Officer in Charge of the Watch over an appropriate\nrange of situations, weather and loading conditions\n\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1 practical test using a suitably simulated watchkeeping\nsituation; or\n5.2 approved in-service experience, or\n5.3 approved training ship experience, or\n5.4 written examinations\n\n6. Context of Assessment\n\n6.1 Assessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations\n6.2 Assessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.2.1\nAppropriate practical assessment must occur:\n6.2.1.1 at the registered training organization,\nand/or\n6.2.1.2 on an appropriate working or training\nvessel\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n46\nUNIT OF COMPETENCY\n:\nKEEP A PROPER LOOK-OUT BY SIGHT AND\nHEARING\n\nUNIT CODE\n:\nMTM 834314\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired in keeping a proper look-out by sight and hearing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Detect sounds, lights\nand other objects\n1.1 Use and care of binoculars as an aid to a look-out is\ndemonstrated.\n1.2 Lookout techniques are demonstrated in sighting\nfloating objects in any state of weather, day light and\ndarkness.\n1.3 Lookout techniques are demonstrated in identifying\nsounds and lights.\n\n2. Report the\napproximate bearing of\na sound, light or other\nobject in degrees or\npoints\n\n2.1 Detected sounds are promptly reported in degrees or\npoints to the officer of the watch.\n2.2 Sighted lights, ships or floating objects are promptly\nreported in degrees or points to the officer of the watch.\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Lookout techniques\nMay include:\n1.1\nWork must be carried out in compliance with the\nrelevant sections of the COLREGS 72, IMO STCW\nConventions and Codes.\n1.2\nWork is performed under the directions of the Officer in\nCharge of the Watch using a prescribed range of\nprocedures/methods either individually or in a team\nenvironment with some accountability for the quality of\noutcomes.\n1.3\nWork involves the use of known and defined lookout\ntechniques across a variety of navigational contexts in\nresponse to the directions of the Officer of the Watch\n\n2. Degrees or points\nMay include:\n2.1\nVessel may include all commercial vessel of 500 GT\nand above\n2.2\nIdentify lookout station and safe passages onboard\n2.3\nReporting of direction of detected sounds and sighted\nlights and objects to the Officer in charge can be:\n2.3.1. Reporting by points or degrees\n2.3.2. Reporting by bearing relative to own ship, ship’s\nbow, ship’s beam, or ship’s quarter.\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n48\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. reported the direction of detected sounds and sighted\nlights and objects to the Officer in charge by:\n1.1.1. points\n1.1.2. degrees\n1.1.3. bearings relative to own ship\n\n2. Required Knowledge\n2.1\nInternational distress signals\n2.2\nLook out watch relief procedures\n2.3\nProper use of lookout equipment\n2.4\nDuties and responsibilities of a lookout\n2.5\nSix sightings that should be reported when detected by\nthe lookout\n2.6\nThirty (32) point system for reporting sightings.\n2.7\nProcedure for reporting sightings (points, degrees\nrelative, or degrees true)\n2.8\nThree (3) characteristics or features of a target that\nshould be included in the report\n2.9\nThe three (3) common lookout stations on board a\ncommercial vessel\n2.10 Personal equipment for lookout\n2.11 Location of personal and vessel safety equipment in the\nvicinity of lookout station\n\n3. Required Skills\n3.1\nApplying lookout watch relief procedure.\n3.2\nApplying night time lookout watch relief procedures.\n3.3\nApplying lookout technique and reporting in clear\nvisibility during daylight.\n3.4\nApplying lookout techniques and reporting in clear\nvisibility at night.\n3.5\nApplying lookout techniques and reporting in restricted\nvisibility during daylight or at night.\n3.6\nIdentifying and reporting sightings (points, degrees\nrelative, or degrees true) promptly and accurately\n3.7\nPassing on all relevant information to the lookout relief\nin changing over the watch.\n3.8\nTaking positive action in the event of not being properly\nrelieved\n3.9\nUsing and care of binoculars.\n3.10 Using and care of internal communication device.\n3.11 Exercising closed-loop communication skill\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n49\n\n4. Resource Implications\n\nAccess is required to opportunities to either:\n4.1 Demonstrate look-out duties in a bridge simulator,\nmeeting the requirements of Section A I/12 of the IMO\nSTCW Code, over an appropriate range of simulated\nnavigational conditions; and/or\n4.2 Acting as a look-out at a working or training vessel under\nthe direction of the Officer in Charge of the Watch over\nan appropriate range of navigational situations\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 practical test using a suitably simulated watchkeeping\nsituation; or\n5.2 approved in-service experience, or\n5.3 approved training ship experience, or\n5.4 assessment of knowledge must be conducted through\nappropriate written examinations\n\n6. Context of assessment\n\n6.1 Assessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations\n6.2 Assessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.3 Appropriate practical assessment must occur:\n6.2.2 at the registered training organization, and/or\n6.2.3 on an appropriate working or training vessel\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n50\nUNIT OF COMPETENCY\n:\nCONTRIBUTE TO MONITORING AND CONTROLLING\nA SAFE WATCH\n\nUNIT CODE\n:\nMTM834315\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nin monitoring and controlling a safe watch\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Contribute to\nwatchkeeping\nprocedures\n\n1.1\nEffective communication with the officer of the watch is\ncorrectly maintained at all times on matters relevant to\nthe role of an integrated rating during watchkeeping\nduties.\n1.2\nBridge communications are clear and concise and\nadvice or clarification is sought from the officer on watch\nwhen watch information or instructions are not clearly\nunderstood.\n1.3\nA proper look-out is maintained at all times and in such\na way as to conform to accepted principles and\nprocedures and regulatory requirements.\n1.4\nLights, shapes and sound signals conform with the\nrequirements contained in the International Regulations\nfor Preventing Collisions at Sea and are correctly\nrecognized.\n1.5\nThe frequency and extent of monitoring of traffic, the\nvessel and the environment conform to established\nprinciples and procedures.\n1.6\nInternal and external communications systems are used\nin accordance with bridge procedures and\nmanufacturer’s instructions.\n1.7\nPrecautions and procedures are followed to implement\nenvironmental protection measures.\n1.8\n“Challenge and response” are practiced within the\nbridge team.\n\n2. Respond to potential\nemergency situations\n2.1\nObservations and emergency situations are promptly\nreported to the officer on watch in accordance with\nbridge procedures.\n2.2\nDistress signals are recognized and reported in\naccordance with bridge procedures.\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role of an\nintegrated rating\nduring\nwatchkeeping\nduties\nMay include:\n1.1 Work must be carried out in compliance with the relevant\nsections of the IMO STCW Code and Convention, as\namended.\n1.2 Work is performed under the direction of the Officer of the\nWatch as a member of a bridge team in accordance with\ndefined operational requirements, with some accountability\nand responsibility for self and others in achieving the\nprescribed outcomes. It involves the application of look out\nand observational techniques across a variety of operational\ncontexts. Following of orders and instructions of the officer on\nwatch is required.\n\n2. The vessel and the\nenvironment\n2.1 Vessel may include any commercial vessel of 500 GT and\nabove\n2.2 Watchkeeping arrangements and procedures may be\nimplemented:\n2.2.1. by day or night in both normal and emergency\nsituations\n2.2.2. under any possible conditions of weather and loading\n2.2.3. while underway\n2.2.4. during berthing and unberthing operations\n2.2.5. while anchoring or mooring\n2.2.6. while in port\n2.2.7. while moored or at anchor\n2.3 Watchkeeping principles for a rating include:\n2.3.1. proper lookout must be maintained at all times\n2.3.2. duties of look out and helmsman must be kept separate\n2.3.3. look-out must give full attention to keeping a proper\nlook out and must not carry out other duties which\ncould interfere with the task\n2.3.4. all necessary precautions must be taken to avoid\npollution of the marine environment\n2.3.5. appropriate assistance must be available to be\nsummoned to the bridge if required by a change in the\nvessel’s situation\n3. Emergency\nEmergencies may include:\n3.1 fire\n3.2 stranding\n3.3 possible collision\n3.4 heavy weather\n3.5 synchronous rolling\n3.6 distress signal\n3.7 failure of bridge equipment, steering equipment, navigational\nlights\n3.8 loss of main engines\n3.9 man overboard\n3.10 cargo shift\n3.11 ice formation on hull and superstructure\n3.12 floating ice\n3.13 retrieval of survivors from the water\n3.14 loss of watertight integrity\n3.15 dragging anchor\n3.16 fouled hawse\n3.17 loss of mooring lines or winches when berthing\n3.18 sudden list or loll\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n52\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. contributed\nto\nwatch\nkeeping\narrangements\nand\nprocedures\n1.2. fulfilled the responsibilities of an integrated rating during a\nwatch\n1.3. reported observations and other emergency situations\narising during a watch\n1.4. communicated effectively with others in the course of\nwatchkeeping duties\n\n2. Required Knowledge\n\n2.1\nRelevant OH&S legislation, codes of practice, policies and\nprocedures\n2.2\nBridge procedures on board a vessel\n2.3\nProcedures for the use of internal communications and\nalarm systems\n2.4\nFactors that can affect watchkeeping functions\n2.5\nNavigational hazards and implications for watchkeeping\n2.6\nTypical watchkeeping problems and emergency situations\nand appropriate action and solutions\n2.7\nBridge instrumentation, controls and alarms relevant to the\nfunctions of an integrated rating\n2.8\nFunctions of unmanned machinery space (UMS) controls,\nalarms and indicators\n2.9\nRudder and propeller control and vessel maneuvering\ncharacteristics\n2.10 Signs of fatigue\n2.11 Basic environmental protection measures\n2.12 Functions and responsibilities of the members of a bridge\nteam on board a vessel\n2.13 Procedures for the relief, maintenance and handover of a\nwatch\n2.14 Maritime communication techniques used within a bridge\nteam onboard a vessel\n2.15 States different categories of pollutants on board and\nimportance of segregation of garbage and waste\nmaterials as per management plan.\n2.16 States purpose of providing garbage receptacles, in\naccommodation, and on deck and how it helps in\nprevention of pollution.\n2.17 States garbage management system on board.\n\n3. Required Skills\n\n3.1. Identifying the members of a bridge team on board a\nvessel\n3.2. Applying the procedures for the relief, maintenance and\nhandover of a watch\n3.3. Applying maritime communication techniques used within\na bridge team onboard a vessel\n3.4. Describe methods of disposing different categories of\npollutants as per MARPOL regulation and company\npolicy towards it\n3.5. Identifies location of SOPEP equipment & material\nstorage locker.\n3.6. Familiarize with garbage segregation, storage onboard\nand disposal shore.\n3.7. Preparedness for prevention of pollution during\nbunkering operation on board.\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n53\n\n4. Resource Implications\n\nAccess is required to opportunities to either:\n4.1. demonstrate the ability to contribute to a safe watch in\nrange of suitably-simulated of watchkeeping situations\nrelevant to the role of an integrated rating; and/or\n4.2. contribute to maintaining a safe watch as an integrated\nrating on a commercial vessel in an appropriate range of\nsituations under various weather and sea conditions\n\n5. Methods of Assessment\n\nCompetency in this unit must be assessed through:\n5.1. practical test using a suitably simulated watchkeeping\nsituation; or\n5.2. approved in-service experience, or\n5.3. approved training ship experience, or\n5.4. assessment of knowledge must be conducted through\nappropriate written examinations.\n\n6. Context for Assessment\n\n6.1\nAssessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations\n6.2\nAssessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.2.1 Appropriate practical assessment must occur:\n6.2.1.1 at the registered training organization,\nand/or\n6.2.1.2 on an appropriate working or training\nvessel\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n54\nUNIT OF COMPETENCY\n:\nOPERATE EMERGENCY EQUIPMENT AND APPLY\nEMERGENCY PROCEDURES\n\nUNIT CODE\n:\nMTM834316\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired in operating emergency equipment and applying\nemergency procedures\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply emergency\nprocedures\n\n1.1\nEmergency situations are correctly identified in\naccordance with established nautical practice.\n1.2\nInitial action on becoming aware of an emergency or\nabnormal situation is in conformity with established\npractices and procedures.\n1.3\nAction taken is timely and appropriate for seriousness of\nthe emergency and the prevailing weather and sea\nconditions.\n1.4\nCommunications are clear and concise at all times and\norders are acknowledged in a timely and seamanlike\nmanner.\n1.5\nFalse distress alerts are avoided through the application\nof established nautical practice.\n1.6\nAppropriate action is taken in the event of accidental\nactivation of a distress alert in accordance with\nregulatory requirements and vessel’s procedures.\n\n2. Maintain the integrity of\nemergency distress\nand alerting systems\n2.1\nEmergency and distress alerting systems are used in\naccordance with manufacturer’s instructions and\nvessel’s procedures.\n2.2\nThe integrity of emergency and distress alerting\nsystems is maintained in accordance with vessel and\ncompany procedures, manufacturer’s instructions and\nregulatory requirements.\n2.3\nFaulty or non-operational emergency and distress\nalerting equipment is identified, reported and/or\nreplaced as per manufacturer’s instructions and vessel’s\nprocedures.\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n55\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Established nautical\npractice\nMay include:\n1.1 Work must be carried out in compliance with the maritime\nregulations.\n1.2 Work is performed within defined emergency procedures\nwith limited accountability and responsibility for self and\nothers in achieving the prescribed outcomes.\n1.3 Work involves the application of basic emergency\nprocedures and the use of emergency equipment on\nboard a vessel\n1.4 Familiarization of various alarms and location of controls\n1.5 Taking of immediate action in accordance with company\nprocedures and limits of responsibility is required.\n1.6 Work requires some judgement in recognising and\nconfirming the nature and extent of the emergency and\ntaking appropriate initial action within the established\nlimits of responsibility\n\n2. Emergency and\ndistress alerting\nsystems\nEmergency and distress alerting systems may include:\n2.1. pyrotechnic distress signals\n2.2. GMDSS survival craft VHF radios\n2.3. satellite emergency position indicating radio beacons\n(EPIRBs)\n2.4. search and rescue transponders (SARTs)\n2.5. ship security alert system (SSAS)\n2.6. whistles\n\n3. Emergencies\n3.1. Emergency may include:\n3.1.1. collision with another vessel\n3.1.2. explosion on board vessel\n3.1.3. fire on board vessel\n3.1.4. impairment of integrity of hull and ingress of water\n3.1.5. loss of steering control\n3.1.6. loss of motive power\n3.1.7. foundering\n3.1.8. grounding\n3.1.9. person overboard\n3.1.10. rescue and evacuation of injured personnel\n3.2. Potential emergencies may occur:\n3.2.1. by day or night\n3.2.2. under any possible conditions of weather and\nloading\n3.2.3. while underway\n3.2.4. during berthing and unberthing operations\n3.2.5. while anchoring and mooring\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n56\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. recognized emergency or abnormal situations\n1.2. took appropriate initial action on becoming aware of an\nemergency or abnormal situation\n1.3. operated emergency equipment\n1.4. maintained the integrity of emergency and distress\nalerting systems\n1.5. communicated clearly, concisely and effectively with\nothers during an emergency on board vessel\n\n2. Required Knowledge\n2.1\nKnowledge of relevant maritime regulations dealing with\nemergency equipment and procedures\n2.2\nISM Code and associated ship’s Safety Management\nSystem and procedures (where applicable)\n2.3\nRelevant OH&S legislation and policies applicable to the\nuse of emergency equipment\n2.4\nSOLAS Convention and related regulations\n2.5\nDuties and responsibilities of shipboard personnel\nduring emergencies\n2.6\nIncidents that may result in an emergency on board\nvessel and the appropriate response in each case\n2.7\nPrecautions to maintain the integrity of emergency and\ndistress alerting systems\n2.8\nThe meaning of various maritime emergency alarms,\nthe guidelines and procedures for their activation and\nsignals and the action to be taken when they are\nactivated\n2.9\nProcedures for emergency response on board a\ncommercial vessel\n2.10 Functions and purpose of pyrotechnic distress signals,\nsatellite emergency position indicating radio beacons\n(EPIRBs), and search and rescue transponders\n(SARTs)\n2.11 Techniques for avoiding false distress alerts and the\naction that must be taken in the event of accidental\nactivation\n2.12 Maritime communication techniques\n2.13 Familiarization with Ship Security Alert System (SSAS)\n\n3. Required Skills\n\n3.1\nApplying procedures for emergency response on board\na commercial vessel\n3.2\nHandling of pyrotechnic distress signals, satellite\nemergency position indicating radio beacons (EPIRBs),\nand search and rescue transponders (SARTs)\n3.3\nApplying techniques for avoiding false distress alerts\nand the action that must be taken in the event of\naccidental activation\n3.4\nPracticing maritime communication techniques\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n57\n\n4. Resource Implications\n\nAccess is required to opportunities to either:\n4.1. carry out a range of suitably simulated practical and\nknowledge assessments that demonstrate the skills and\nknowledge to respond to emergencies on board a vessel,\nand/or\n4.2. participate in emergency response drills on board an\noperational commercial or training vessel\n\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1. practical test using a suitably simulated watchkeeping\nsituation; or\n5.2. approved in-service experience; or\n5.3. approved training ship experience, or\n5.4. assessment of knowledge must be conducted through\nappropriate written examinations\n\n6. Context of\nAssessment\n\n6.1 Assessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations.\n6.2 Assessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.2.1 Appropriate practical assessment must occur:\n6.2.1.1 at the registered training/assessment\ninstitution, and/or\n6.2.1.2 on an appropriate working or training\nvessel\n\n--- PDF PAGE 62 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n58"
}
