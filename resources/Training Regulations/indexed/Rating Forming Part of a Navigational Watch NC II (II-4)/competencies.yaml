        "source_text": "MTM834208\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nsurviving at sea in the event of ship abandonment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Respond to the\nindicated emergency\n\n1.1\nMuster signal is identified and appropriate action to\nrespond to the identified emergency is taken based\non established procedures.\n1.2\nTiming and sequence of individual actions are\npracticed based on prevailing circumstances and\nconditions and potential dangers and threats to\nsurvival are minimized.\n1.3\nLife-saving appliances are used in accordance with\nstandards operating procedures.\n1.4\nRecommended swimming techniques are practiced\nwith or without wearing a lifejacket.\n\n2. Board a survival craft\n2.1\nSurvival craft is boarded and dangers to other\nsurvivors are avoided based on recommended method.\n2.2\nInitial actions after leaving the ship are taken to\nminimize threats to survival.\n2.3\nSurvival craft equipment and location devices,\nincluding radio equipment, are operated based on\nestablished procedures and manufacturer’s instruction.\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Identified emergency\nMay include:\n1.1\nCollision\n1.2\nFire\n1.3\nFoundering\n1.4\nPerson falling overboard (man overboard)\n\n2. Dangers and threats to\nsurvival\nMay include:\n2.1\nCold water shock\n2.2\nHypothermia\n2.3\nPsychological response to disaster\n2.4\nLoss of will to live\n2.5\nSea sickness\n2.6\nDehydration\n2.7\nInjuries\n2.8\nStarvation\n\n3. Life-saving appliances\nMay include:\n3.1\nLife jackets\n3.2\nLife buoys\n3.3\nHard hats\n3.4\nImmersion suits and other thermal protective\naid\n3.5\nRocket line throwing appliances\n3.6\nPyrotechnic distress signals\n3.7\nGMDSS survival craft VHF radios\n3.8\nSatellite emergency position indicating radio\nbeacons EPIRBs\n3.9\nSARTs\n3.10 Whistles\n\n4. Survival Craft\nMay include:\n4.1\nFree fall life boats\n4.2\nDavit launched life boats\n4.3\nLife rafts\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n16\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nresponded to indicated emergency\n1.2\nboarded survival craft\n\n2. Required Knowledge\n2.1\nTypes of emergency situations and actions to be taken\nwhen-\n2.1.1 called to survival craft stations\n2.1.2 required to abandon ship\n2.1.3 in the water\n2.1.4 aboard a survival craft\n2.1.5 a person falls overboard (man overboard)\n2.2\nTypes, uses and location of life-saving appliances\n2.3\nSurvival craft equipment and how to operate them\n2.4\nValue of training and drills\n2.5\nTypes and uses of personal protective clothing and\nequipment\n\n3. Required Skills\n3.1\nDonning lifejacket\n3.2\nDonning and using an immersion suit\n3.3\nJumping from a height into the water\n3.4\nRighting an inverted life raft while wearing a lifejacket\n3.5\nKeeping afloat without a lifejacket\n3.6\nTaking initial action on boarding survival craft\n3.7\nStreaming a drogue or sea-anchor\n3.8\nOperating survival craft equipment\n3.9\nOperating location devices including radio equipment\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nwork place with recommended facilities\n4.2\ntools and equipment appropriate to the activity\n4.3\nmaterials relevant to the proposed activity and tasks\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nDemonstration and questioning of related\nunderpinning knowledge\n5.2\nWritten examination\n5.3\nPortfolio\n\n6. Context of Assessment 6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n17\nUNIT OF COMPETENCY\n:\nMINIMIZE THE RISK OF FIRE AND MAINTAIN A STATE\nOF READINESS TO RESPOND TO EMERGENCY\nSITUATIONS INVOLVING FIRE\n\nUNIT CODE\n:"
