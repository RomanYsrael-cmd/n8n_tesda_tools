        "source_text": "MTM 834314\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired in keeping a proper look-out by sight and hearing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Detect sounds, lights\nand other objects\n1.1 Use and care of binoculars as an aid to a look-out is\ndemonstrated.\n1.2 Lookout techniques are demonstrated in sighting\nfloating objects in any state of weather, day light and\ndarkness.\n1.3 Lookout techniques are demonstrated in identifying\nsounds and lights.\n\n2. Report the\napproximate bearing of\na sound, light or other\nobject in degrees or\npoints\n\n2.1 Detected sounds are promptly reported in degrees or\npoints to the officer of the watch.\n2.2 Sighted lights, ships or floating objects are promptly\nreported in degrees or points to the officer of the watch.\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Lookout techniques\nMay include:\n1.1\nWork must be carried out in compliance with the\nrelevant sections of the COLREGS 72, IMO STCW\nConventions and Codes.\n1.2\nWork is performed under the directions of the Officer in\nCharge of the Watch using a prescribed range of\nprocedures/methods either individually or in a team\nenvironment with some accountability for the quality of\noutcomes.\n1.3\nWork involves the use of known and defined lookout\ntechniques across a variety of navigational contexts in\nresponse to the directions of the Officer of the Watch\n\n2. Degrees or points\nMay include:\n2.1\nVessel may include all commercial vessel of 500 GT\nand above\n2.2\nIdentify lookout station and safe passages onboard\n2.3\nReporting of direction of detected sounds and sighted\nlights and objects to the Officer in charge can be:\n2.3.1. Reporting by points or degrees\n2.3.2. Reporting by bearing relative to own ship, ship’s\nbow, ship’s beam, or ship’s quarter.\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n48\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. reported the direction of detected sounds and sighted\nlights and objects to the Officer in charge by:\n1.1.1. points\n1.1.2. degrees\n1.1.3. bearings relative to own ship\n\n2. Required Knowledge\n2.1\nInternational distress signals\n2.2\nLook out watch relief procedures\n2.3\nProper use of lookout equipment\n2.4\nDuties and responsibilities of a lookout\n2.5\nSix sightings that should be reported when detected by\nthe lookout\n2.6\nThirty (32) point system for reporting sightings.\n2.7\nProcedure for reporting sightings (points, degrees\nrelative, or degrees true)\n2.8\nThree (3) characteristics or features of a target that\nshould be included in the report\n2.9\nThe three (3) common lookout stations on board a\ncommercial vessel\n2.10 Personal equipment for lookout\n2.11 Location of personal and vessel safety equipment in the\nvicinity of lookout station\n\n3. Required Skills\n3.1\nApplying lookout watch relief procedure.\n3.2\nApplying night time lookout watch relief procedures.\n3.3\nApplying lookout technique and reporting in clear\nvisibility during daylight.\n3.4\nApplying lookout techniques and reporting in clear\nvisibility at night.\n3.5\nApplying lookout techniques and reporting in restricted\nvisibility during daylight or at night.\n3.6\nIdentifying and reporting sightings (points, degrees\nrelative, or degrees true) promptly and accurately\n3.7\nPassing on all relevant information to the lookout relief\nin changing over the watch.\n3.8\nTaking positive action in the event of not being properly\nrelieved\n3.9\nUsing and care of binoculars.\n3.10 Using and care of internal communication device.\n3.11 Exercising closed-loop communication skill\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n49\n\n4. Resource Implications\n\nAccess is required to opportunities to either:\n4.1 Demonstrate look-out duties in a bridge simulator,\nmeeting the requirements of Section A I/12 of the IMO\nSTCW Code, over an appropriate range of simulated\nnavigational conditions; and/or\n4.2 Acting as a look-out at a working or training vessel under\nthe direction of the Officer in Charge of the Watch over\nan appropriate range of navigational situations\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 practical test using a suitably simulated watchkeeping\nsituation; or\n5.2 approved in-service experience, or\n5.3 approved training ship experience, or\n5.4 assessment of knowledge must be conducted through\nappropriate written examinations\n\n6. Context of assessment\n\n6.1 Assessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations\n6.2 Assessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.3 Appropriate practical assessment must occur:\n6.2.2 at the registered training organization, and/or\n6.2.3 on an appropriate working or training vessel\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n50\nUNIT OF COMPETENCY\n:\nCONTRIBUTE TO MONITORING AND CONTROLLING\nA SAFE WATCH\n\nUNIT CODE\n:"
