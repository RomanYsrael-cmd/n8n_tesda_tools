        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. contributed\nto\nwatch\nkeeping\narrangements\nand\nprocedures\n1.2. fulfilled the responsibilities of an integrated rating during a\nwatch\n1.3. reported observations and other emergency situations\narising during a watch\n1.4. communicated effectively with others in the course of\nwatchkeeping duties\n\n2. Required Knowledge\n\n2.1\nRelevant OH&S legislation, codes of practice, policies and\nprocedures\n2.2\nBridge procedures on board a vessel\n2.3\nProcedures for the use of internal communications and\nalarm systems\n2.4\nFactors that can affect watchkeeping functions\n2.5\nNavigational hazards and implications for watchkeeping\n2.6\nTypical watchkeeping problems and emergency situations\nand appropriate action and solutions\n2.7\nBridge instrumentation, controls and alarms relevant to the\nfunctions of an integrated rating\n2.8\nFunctions of unmanned machinery space (UMS) controls,\nalarms and indicators\n2.9\nRudder and propeller control and vessel maneuvering\ncharacteristics\n2.10 Signs of fatigue\n2.11 Basic environmental protection measures\n2.12 Functions and responsibilities of the members of a bridge\nteam on board a vessel\n2.13 Procedures for the relief, maintenance and handover of a\nwatch\n2.14 Maritime communication techniques used within a bridge\nteam onboard a vessel\n2.15 States different categories of pollutants on board and\nimportance of segregation of garbage and waste\nmaterials as per management plan.\n2.16 States purpose of providing garbage receptacles, in\naccommodation, and on deck and how it helps in\nprevention of pollution.\n2.17 States garbage management system on board.\n\n3. Required Skills\n\n3.1. Identifying the members of a bridge team on board a\nvessel\n3.2. Applying the procedures for the relief, maintenance and\nhandover of a watch\n3.3. Applying maritime communication techniques used within\na bridge team onboard a vessel\n3.4. Describe methods of disposing different categories of\npollutants as per MARPOL regulation and company\npolicy towards it\n3.5. Identifies location of SOPEP equipment & material\nstorage locker.\n3.6. Familiarize with garbage segregation, storage onboard\nand disposal shore.\n3.7. Preparedness for prevention of pollution during\nbunkering operation on board.\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n53\n\n4. Resource Implications\n\nAccess is required to opportunities to either:\n4.1. demonstrate the ability to contribute to a safe watch in\nrange of suitably-simulated of watchkeeping situations\nrelevant to the role of an integrated rating; and/or\n4.2. contribute to maintaining a safe watch as an integrated\nrating on a commercial vessel in an appropriate range of\nsituations under various weather and sea conditions\n\n5. Methods of Assessment\n\nCompetency in this unit must be assessed through:\n5.1. practical test using a suitably simulated watchkeeping\nsituation; or\n5.2. approved in-service experience, or\n5.3. approved training ship experience, or\n5.4. assessment of knowledge must be conducted through\nappropriate written examinations.\n\n6. Context for Assessment\n\n6.1\nAssessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations\n6.2\nAssessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.2.1 Appropriate practical assessment must occur:\n6.2.1.1 at the registered training organization,\nand/or\n6.2.1.2 on an appropriate working or training\nvessel\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n54\nUNIT OF COMPETENCY\n:\nOPERATE EMERGENCY EQUIPMENT AND APPLY\nEMERGENCY PROCEDURES\n\nUNIT CODE\n:"
        },
        "source_text": "MTM834315\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nin monitoring and controlling a safe watch\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Contribute to\nwatchkeeping\nprocedures\n\n1.1\nEffective communication with the officer of the watch is\ncorrectly maintained at all times on matters relevant to\nthe role of an integrated rating during watchkeeping\nduties.\n1.2\nBridge communications are clear and concise and\nadvice or clarification is sought from the officer on watch\nwhen watch information or instructions are not clearly\nunderstood.\n1.3\nA proper look-out is maintained at all times and in such\na way as to conform to accepted principles and\nprocedures and regulatory requirements.\n1.4\nLights, shapes and sound signals conform with the\nrequirements contained in the International Regulations\nfor Preventing Collisions at Sea and are correctly\nrecognized.\n1.5\nThe frequency and extent of monitoring of traffic, the\nvessel and the environment conform to established\nprinciples and procedures.\n1.6\nInternal and external communications systems are used\nin accordance with bridge procedures and\nmanufacturer’s instructions.\n1.7\nPrecautions and procedures are followed to implement\nenvironmental protection measures.\n1.8\n“Challenge and response” are practiced within the\nbridge team.\n\n2. Respond to potential\nemergency situations\n2.1\nObservations and emergency situations are promptly\nreported to the officer on watch in accordance with\nbridge procedures.\n2.2\nDistress signals are recognized and reported in\naccordance with bridge procedures.\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role of an\nintegrated rating\nduring\nwatchkeeping\nduties\nMay include:\n1.1 Work must be carried out in compliance with the relevant\nsections of the IMO STCW Code and Convention, as\namended.\n1.2 Work is performed under the direction of the Officer of the\nWatch as a member of a bridge team in accordance with\ndefined operational requirements, with some accountability\nand responsibility for self and others in achieving the\nprescribed outcomes. It involves the application of look out\nand observational techniques across a variety of operational\ncontexts. Following of orders and instructions of the officer on\nwatch is required.\n\n2. The vessel and the\nenvironment\n2.1 Vessel may include any commercial vessel of 500 GT and\nabove\n2.2 Watchkeeping arrangements and procedures may be\nimplemented:\n2.2.1. by day or night in both normal and emergency\nsituations\n2.2.2. under any possible conditions of weather and loading\n2.2.3. while underway\n2.2.4. during berthing and unberthing operations\n2.2.5. while anchoring or mooring\n2.2.6. while in port\n2.2.7. while moored or at anchor\n2.3 Watchkeeping principles for a rating include:\n2.3.1. proper lookout must be maintained at all times\n2.3.2. duties of look out and helmsman must be kept separate\n2.3.3. look-out must give full attention to keeping a proper\nlook out and must not carry out other duties which\ncould interfere with the task\n2.3.4. all necessary precautions must be taken to avoid\npollution of the marine environment\n2.3.5. appropriate assistance must be available to be\nsummoned to the bridge if required by a change in the\nvessel’s situation\n3. Emergency\nEmergencies may include:\n3.1 fire\n3.2 stranding\n3.3 possible collision\n3.4 heavy weather\n3.5 synchronous rolling\n3.6 distress signal\n3.7 failure of bridge equipment, steering equipment, navigational\nlights\n3.8 loss of main engines\n3.9 man overboard\n3.10 cargo shift\n3.11 ice formation on hull and superstructure\n3.12 floating ice\n3.13 retrieval of survivors from the water\n3.14 loss of watertight integrity\n3.15 dragging anchor\n3.16 fouled hawse\n3.17 loss of mooring lines or winches when berthing\n3.18 sudden list or loll\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n52\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. contributed\nto\nwatch\nkeeping\narrangements\nand\nprocedures\n1.2. fulfilled the responsibilities of an integrated rating during a\nwatch\n1.3. reported observations and other emergency situations\narising during a watch\n1.4. communicated effectively with others in the course of\nwatchkeeping duties\n\n2. Required Knowledge\n\n2.1\nRelevant OH&S legislation, codes of practice, policies and\nprocedures\n2.2\nBridge procedures on board a vessel\n2.3\nProcedures for the use of internal communications and\nalarm systems\n2.4\nFactors that can affect watchkeeping functions\n2.5\nNavigational hazards and implications for watchkeeping\n2.6\nTypical watchkeeping problems and emergency situations\nand appropriate action and solutions\n2.7\nBridge instrumentation, controls and alarms relevant to the\nfunctions of an integrated rating\n2.8\nFunctions of unmanned machinery space (UMS) controls,\nalarms and indicators\n2.9\nRudder and propeller control and vessel maneuvering\ncharacteristics\n2.10 Signs of fatigue\n2.11 Basic environmental protection measures\n2.12 Functions and responsibilities of the members of a bridge\nteam on board a vessel\n2.13 Procedures for the relief, maintenance and handover of a\nwatch\n2.14 Maritime communication techniques used within a bridge\nteam onboard a vessel\n2.15 States different categories of pollutants on board and\nimportance of segregation of garbage and waste\nmaterials as per management plan.\n2.16 States purpose of providing garbage receptacles, in\naccommodation, and on deck and how it helps in\nprevention of pollution.\n2.17 States garbage management system on board.\n\n3. Required Skills\n\n3.1. Identifying the members of a bridge team on board a\nvessel\n3.2. Applying the procedures for the relief, maintenance and\nhandover of a watch\n3.3. Applying maritime communication techniques used within\na bridge team onboard a vessel\n3.4. Describe methods of disposing different categories of\npollutants as per MARPOL regulation and company\npolicy towards it\n3.5. Identifies location of SOPEP equipment & material\nstorage locker.\n3.6. Familiarize with garbage segregation, storage onboard\nand disposal shore.\n3.7. Preparedness for prevention of pollution during\nbunkering operation on board.\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n53\n\n4. Resource Implications\n\nAccess is required to opportunities to either:\n4.1. demonstrate the ability to contribute to a safe watch in\nrange of suitably-simulated of watchkeeping situations\nrelevant to the role of an integrated rating; and/or\n4.2. contribute to maintaining a safe watch as an integrated\nrating on a commercial vessel in an appropriate range of\nsituations under various weather and sea conditions\n\n5. Methods of Assessment\n\nCompetency in this unit must be assessed through:\n5.1. practical test using a suitably simulated watchkeeping\nsituation; or\n5.2. approved in-service experience, or\n5.3. approved training ship experience, or\n5.4. assessment of knowledge must be conducted through\nappropriate written examinations.\n\n6. Context for Assessment\n\n6.1\nAssessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations\n6.2\nAssessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.2.1 Appropriate practical assessment must occur:\n6.2.1.1 at the registered training organization,\nand/or\n6.2.1.2 on an appropriate working or training\nvessel\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n54\nUNIT OF COMPETENCY\n:\nOPERATE EMERGENCY EQUIPMENT AND APPLY\nEMERGENCY PROCEDURES\n\nUNIT CODE\n:"
