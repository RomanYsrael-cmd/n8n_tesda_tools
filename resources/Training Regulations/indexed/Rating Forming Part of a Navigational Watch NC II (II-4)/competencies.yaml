          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. steered a vessel under the directions of the Officer in\nCharge of the Watch and in response to helm orders:\n1.1.1. in normal and emergency situations and adverse\nweather conditions\n1.1.2. when underway\n1.1.3. when anchoring or mooring\n1.1.4. during berthing and unberthing operations\n1.1.5. while anchoring or mooring\n1.1.6. during emergencies\n1.2. exercised all required safety and hazard control\nprocedures when steering a vessel\n1.3. identified typical steering problems and take appropriate\naction\n1.4. communicated effectively with others in the bridge team\nwhen steering a vessel\n\n2. Required Knowledge\n\n2.1 Knowledge of relevant sections of IMO STCW\nConvention and Codes and applicable to the steering of\nvessels\n2.2 Limits of responsibility of a rating on a vessel carrying out\nsteering duties\n2.3 Typical helm orders and steering action required\n2.4 Effects on steering of wind, currents and bottom\ntopography\n2.5 Steering problems for various sizes of vessels and\nappropriate action and solutions\n2.6 Procedures for changing over from automatic pilot to\nhand steering and vice versa\n2.7 Principles and procedures for steering a vessel\n2.8 Steering techniques in and near ‘traffic separation\nschemes’ and ‘vessel traffic service areas’\n\n3. Required Skills\n\n3.1 Changing over from automatic pilot to hand steering and\nvice versa\n3.2 Steering a vessel\n3.3 Steering in and near ‘traffic separation schemes’ and\n‘vessel traffic service areas’\n3.4 Ability to communicate effectively in the English\nlanguage with the Master and others in the bridge team\n3.5 Maritime communication techniques, including\nresponding to helm orders\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n45\n\n4. Resource Implication\n\nAccess is required to opportunities to either:\n4.1 steer a vessel using a simulator, meeting the\nrequirements of Section A I/12 of the IMO STCW Code,\nover an appropriate range of simulated maneuvering\nsituations, weather and loading conditions; and/or\n4.2 steer a working or training vessel under the direction of\nthe Officer in Charge of the Watch over an appropriate\nrange of situations, weather and loading conditions\n\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1 practical test using a suitably simulated watchkeeping\nsituation; or\n5.2 approved in-service experience, or\n5.3 approved training ship experience, or\n5.4 written examinations\n\n6. Context of Assessment\n\n6.1 Assessment of competence must comply with the\nassessment requirements of the relevant maritime\nregulations\n6.2 Assessment of this unit must be undertaken within\nrelevant marine authority approved and audited\narrangements by a registered training and/or assessment\ninstitution:\n6.2.1\nAppropriate practical assessment must occur:\n6.2.1.1 at the registered training organization,\nand/or\n6.2.1.2 on an appropriate working or training\nvessel\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n46\nUNIT OF COMPETENCY\n:\nKEEP A PROPER LOOK-OUT BY SIGHT AND\nHEARING\n\nUNIT CODE\n:"
