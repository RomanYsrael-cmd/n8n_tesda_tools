  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\nAssessment of an individual’s competence leads to the issuance of a Certificate of\nProficiency (COP) in the relevant units of competency.\n\nA Certificate of Proficiency (COP) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the relevant endorsed\nqualification.\n\n1.\nCandidate wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\nAs a rule, the unit/s of competency shall be the benchmark for all assessment\nunder the Training Regulations for Maritime Sector.\n\n2.\nCandidate must have completed the prescribed course of instruction in all the units\nof competency contained in the maritime program and with equivalent sea service\nexperience on a seagoing ship of 500 GRT or more, before applying for\nassessment and certification for Certificate of Proficiency (COP).\n\n2.1.\nEvery candidate for certification shall:\n\n2.1.1\nBe not less than 18 years of age\n2.1.2\nThose who have:\n\n2.1.2.1\nCompleted TESDA-registered program on Rating Forming\nPart Of A Navigational Watch (RFPNW) inclusive of an\napproved seagoing service of not less than two (2) months\nwhere candidate has performed watchkeeping duties under\nthe supervision of the master or officer-in-charge of a\nnavigational watch or a qualified rating on board a merchant\nvessel of 500 GT or more; OR\n\n2.1.2.2\nGraduate of Bachelor of Science in Marine Transportation\n(BSMT) or undergraduate who completed watchkeeping\nsubjects with an approved sea going service of not less\nthan six (6) months on board seagoing vessel of 500 GRT\nor more, evidenced by a certificate from the manning\nagency/shipping company with an attestation that the\ncandidate performed navigational watchkeeping functions\nand has been involved in the performance of duties carried\nout under the direct supervision of the master, the officer-in-\ncharge of the navigational watch or a qualified rating.\n\n2.1.3\nMeet the standard of competence specified in this Training\nRegulations.\n\n3.\nCandidates for a COP on RFPNW shall be required to undergo assessment using\nthe assessment methodologies identified in the unit of competency.\n\n4.\nConduct of assessment and issuance of certificates shall follow the procedures\nmanuals and implementing guidelines developed for the assessment and\ncertification of RFPNW as institutionalized by and between TESDA and MARINA\nthrough a Memorandum of Agreement (MOA).\n\n5.\nCandidates who are found to be competent under the qualification for RFPNW as\ncontained in Section 1 shall be awarded with the corresponding Certificate of\nProficiency (COP).\n\n--- PDF PAGE 69 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n65\n\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\n\nBASIC\nCOMPETENCIES\nCOMPETENCY MAP\nFor Maritime Sector\nPerform\nmaintenance and\nsanitation of galley\nequipment and\nPerform cargo\nhandling and\nstowage at the\nsupport level\nPerform marine\nengineering at\nthe support level\nCarry out a watch\nroutine appropriate to\nthe duties of rating\nforming part of an\nengine room watch\nSteer the ship and\nalso comply with\nhelm orders in the\nEnglish language\nPerform\nvictualing\nservices\nPerform\nhousekeeping\nservices\nPerform safe usage\nof electrical\nequipment at the\nsupport level\nMaintain the\ncorrect boiler\nwater levels and\nsteam pressure\nKeep a proper\nlook-out by sight\nand hearing\nSupervise the\nmaintenance and\nsanitation of galley\nequipment and\nutensils and related\nareas\nPerform mess hall\nservice\nPerform\nmaintenance and\nrepair at the\nsupport level\nOperate emergency\nequipment and apply\nemergency\nprocedures\nContribute to\nmonitoring and\ncontrolling a\nsafe watch\nProvide assistance\nin receiving and\nstoring provisions\nAssist engineer\nin the\nmaintenance of\nmain engine\nOperate emergency\nequipment and\napply emergency\nprocedures\nPrepare and\ncook meat dishes\nPrepare stocks,\nsauces and soups\nEstablish and\nmaintain catering\nstandards\nControl the operation\nof the ship and care\nfor persons on board\nat the support level\nPerform\nnavigation at the\nsupport level\nSupervise\npreparation of\nmeals\nPrepare bread\nproducts and hot\nand cold desserts\nPrepare and\ncook seafood\nPrepare and\ncook poultry\nproducts\nPrepare side\ndishes and\nbreakfast meal\nPrepare\nappetizers, salads\nand sandwiches\n(hot and cold and\nopen)\nTake precautions to\nprevent pollution of\nthe marine\nenvironment\nComply with\nemergency\nprocedures\nTake immediate\naction upon\nencountering an\naccident or other\nmedical emergency\nFight and\nextinguish fire\nMinimize the risk of\nfire and maintain a\nstate of readiness to\nrespond emergency\nsituations involving\nfi\nSurvive at sea in\nthe event of ship\nabandonment\nPerform stock\ncontrol\nWork within\nmulti-cultural and\nreligious\nenvironment\nProtect marine\nenvironment/ waste\nsegregation mgmt.\nObserve catering\nhealth and safety\npractices\nPractice food\nsafety, sanitation\nand hygiene\nObserve\npersonal hygiene\nObserve safe\nworking\npractices\nLead small teams\nLead in workplace\ncommunication\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nWork with others\nReceive and\nrespond to\nworkplace\ncommunication\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\noccupational\nhealth and\nsafety\nd\nPractice career\nprofessionalism\nPractice basic\nhousekeeping\nprocedures\nDemonstrate\nwork values\nUse relevant\ntechnologies\nUse mathematical\nconcepts and\ntechniques\nDemonstrate\nsecurity\nawareness\npractices\nPerform\nmaintenance and\nrepair at the\nsupport level\n\n--- PDF PAGE 70 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n66\nDEFINITION OF TERMS\nFor the purpose of this training regulations, the words:\n\n1. Abandon ship\nan imperative to leave the vessel immediately, usually in the\nface of some imminent danger. It is an order issued by the\nMaster or a delegated person in command. It is usually the\nlast resort after all other mitigating actions have failed.\n\n2. Aground\nresting on or touching the ground or bottom (usually\ninvoluntarily).\n3. Azimuth of an object\nis its bearing from the observer measured as an angle\nclockwise from true north.\n\n4. Bearing\nthe horizontal direction of a line of sight between two objects\non the surface of the earth.\n\n5. Bridge\na structure above the weather deck, extending the full width\nof the vessel, which houses a command center, itself called\nby association, the bridge.\n\n6. Bridge wing\nan open-air extension of the bridge to port or starboard,\nintended for use in signaling.\n\n7. Boxing the compass\nto state all 32 points of the compass, starting at north,\nproceeding clockwise. Sometimes applied to a wind that is\nconstantly shifting.\n\n8. Cardinal\nreferring to the four main points of the compass: north, south,\neast and west.\n\n9. Compass\nnavigational instrument showing the direction of the vessel in\nrelation to the Earth's geographical poles or magnetic poles.\nCommonly consists of a magnet aligned with the Earth's\nmagnetic field, but other technologies have also been\ndeveloped, such as\nthe gyro compass.\n10. Conn\nto direct a ship or submarine from a position of command\n11. Constant bearing,\nDecreasing range\n(CBDR) when two ship’s are approaching each other from\nany angle and this angle remains the same over time\n(constant bearing) they are on a collision course.\n\n12. Distress Signal\nan international signal used by a distressed ship or aircraft to\nrequest help, as by radio broadcasts, flags, or flares\n\n13. EPIRB\nemergency position-indicating radio beacon\n14. Gyro compass\na mechanical indicator of the direction of the true (geographic)\nmeridian, designed for determining the course of an object, as well\nas the azimuth (bearing) of the direction of orientation.\n\n--- PDF PAGE 71 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n67\n\n15. Helm Order\ncommand ordered by the pilot or officers in charge top\nhelmsman in steering the ship.\n\n16. Look out\na seaman stationed in the forecastle, crow’s nest or bridge\nwings for the purpose of maintaining watchful eye for any\nlights, land or floating objects that may have in sight or\nreporting such to officer of the watch\n\n17. Lubber's line\na vertical line inside a compass case indicating the direction\nof the ship's head.\n\n18. Magnetic bearing\nan absolute bearing using magnetic north.\n\n19. Point\na unit of bearing equal to one thirty-second of a circle, i.e.,\n11.25°. A turn of 32 points is a complete turn through 360°\n\n20. Radar\nacronym for Radio Detection And Ranging. An electronic\nsystem designed to transmit radio signals and receive\nreflected images of those signals from a \"target\" in order to\ndetermine the bearing and distance to the \"target\".\n\n21. Relative bearing\nbearing relative to the direction of the ship: the clockwise\nangle between the ship's direction and an object.\n\n22. SART\nsearch and rescue transponder\n23. Steerageway\nthe minimum speed at which a vessel will answer the helm,\nbelow which she cannot be steered.\n\n--- PDF PAGE 72 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\n\nDECK DEPARTMENT\n\nCAPT. RODOLFO A. ASPILLAGA\nTechnical Consultant\nMARINA-STCW Office\n6th Floor Parkview Plaza, 984 Taft Ave. cor.\n T. M. Kalaw, Ermta, Manila\nCAPT. EDWIN M. ITABLE\nVice-President\nMaster and Mates Association of the Philippines\n(MMAP)\nRm. 503/504, 5th Floor, CTC Commercial Bldg.\nPedro Gil cor. Taft Ave., Malate, Manila\nThe PARTICIPANTS in the Validation of these Training Regulations\nCAPT. JONATHAN V. TABINO\nUFS\nCAPT. FERNANDO J. ALANO\n FAME\nCAPT. SIMEON E. FLORES\nPHILSAFE/MMAP\nCAPT. PEDRO U. BERIÑA, JR.\nNEWSIM\nCAPT. FIDEL V. OJERA\nPHILCAMSAT\nCAPT. VICTOR DEL PRADO\nFAME-FILSCAPT\nCAPT. DANNY S TAMPUS\nUFS\n\nENGINEERING DEPARTMENT\n\nC/E DIOSDADO G. RAMOS\nGeneral Manager\nMonsoon Maritime Services Phils., Inc.\nUnit 103, G/F Marbella Manila Bldg. 2071\nRoxas Blvd., Malate, Manila\n\nC/E FERDINAND R. PASCUA\nMember,\nBoard of Marine Engineer Officers\nProfessional Regulation Commission (PRC) P.\nParedes St. cor. Morayta St.\nSampaloc, Manila\nC/E JANVIER PATRICK ROSETE\nTraining Manager for STCW\nAJ Center for Excellence\n2/F Delgado Bldg., 637 Bonifacio Drive\nSouth Harbor, Port Area, Manila\n\nThe PARTICIPANTS in the Validation of these Training Regulations\nC/E ANTONINO R. GASCON\nPROTECT MARINE\nC/E SOLIMAN V. DILAG\nEXACT\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\n\nQSO"
