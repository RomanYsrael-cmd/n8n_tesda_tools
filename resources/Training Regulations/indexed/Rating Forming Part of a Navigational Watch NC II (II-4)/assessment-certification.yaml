  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\nAssessment of an individual’s competence leads to the issuance of a Certificate of\nProficiency (COP) in the relevant units of competency.\n\nA Certificate of Proficiency (COP) is issued when a candidate has demonstrated\ncompetence in all the units of competency that comprise the relevant endorsed\nqualification.\n\n1.\nCandidate wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\nAs a rule, the unit/s of competency shall be the benchmark for all assessment\nunder the Training Regulations for Maritime Sector.\n\n2.\nCandidate must have completed the prescribed course of instruction in all the units\nof competency contained in the maritime program and with equivalent sea service\nexperience on a seagoing ship of 500 GRT or more, before applying for\nassessment and certification for Certificate of Proficiency (COP).\n\n2.1.\nEvery candidate for certification shall:\n\n2.1.1\nBe not less than 18 years of age\n2.1.2\nThose who have:\n\n2.1.2.1\nCompleted TESDA-registered program on Rating Forming\nPart Of A Navigational Watch (RFPNW) inclusive of an\napproved seagoing service of not less than two (2) months\nwhere candidate has performed watchkeeping duties under\nthe supervision of the master or officer-in-charge of a\nnavigational watch or a qualified rating on board a merchant\nvessel of 500 GT or more; OR\n\n2.1.2.2\nGraduate of Bachelor of Science in Marine Transportation\n(BSMT) or undergraduate who completed watchkeeping\nsubjects with an approved sea going service of not less\nthan six (6) months on board seagoing vessel of 500 GRT\nor more, evidenced by a certificate from the manning\nagency/shipping company with an attestation that the\ncandidate performed navigational watchkeeping functions\nand has been involved in the performance of duties carried\nout under the direct supervision of the master, the officer-in-\ncharge of the navigational watch or a qualified rating.\n\n2.1.3\nMeet the standard of competence specified in this Training\nRegulations.\n\n3.\nCandidates for a COP on RFPNW shall be required to undergo assessment using\nthe assessment methodologies identified in the unit of competency.\n\n4.\nConduct of assessment and issuance of certificates shall follow the procedures\nmanuals and implementing guidelines developed for the assessment and\ncertification of RFPNW as institutionalized by and between TESDA and MARINA\nthrough a Memorandum of Agreement (MOA).\n\n5.\nCandidates who are found to be competent under the qualification for RFPNW as\ncontained in Section 1 shall be awarded with the corresponding Certificate of\nProficiency (COP).\n\n--- PDF PAGE 69 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n65\n\nCORE\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\n\nBASIC\nCOMPETENCIES\n"
}
