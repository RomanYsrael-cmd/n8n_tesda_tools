    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for RATING FORMING PART OF A NAVIGATIONAL\nWATCH NC II (STCW Regulation II/4).\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: RATING FORMING PART OF A NAVIGATIONAL WATCH NC II\n(STCW Regulation II/4)\n\nSuggested Nominal Training Duration:\n18 Hours (Basic Competencies)\n60 Hours (Common Competencies\n30 Hours (Core Competencies)\n(Plus 2 months approved period of seagoing\nservice)\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills, knowledge and\nattitudes of Rating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nin accordance with industry standards. It covers core competencies such as steer the ship\nand complies with helm orders; keep a proper look-out by sight and hearing; contribute to\nmonitoring and controlling a safe watch and operate emergency equipment and apply\nemergency procedures.\n\nThis course is also designed to enhance the basic and common knowledge, skills\nand attitudes of an individual in the field of Rating Forming Part of a Navigational Watch.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 63 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n59\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Survive at sea\nin the event of\nship\nabandonment\n1.1 Respond to the indicated\nemergency\n1.2 Board a survival craft\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Written\n• Questioning\n• Observation\n• Practical\nperformance\n2. Minimize the\nrisk of fire and\nmaintain a\nstate of\nreadiness to\nrespond to\nemergency\nsituations\ninvolving fire\n2.1 Carry out fire minimization\nprocedures\n2.2 Respond to emergencies\ninvolving fire\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\nperformance\n\n3. Fight and\nextinguish fires\n3.1 Operate portable fire fighting\nequipment\n3.2 Carry out fire fighting\noperations\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\nperformance\n4. Take\nimmediate\naction upon\nencountering\nan accident or\nother medical\nemergency\n4.1 Determine need of casualty\n4.2 Administer first aid to the victim\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n5. Comply with\nemergency\nprocedures\n5.1. Take action on becoming\naware of an emergency\n5.2. Follow established emergency\nprocedures\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\nperformance\n6. Take\nprecautions to\nprevent\npollution of the\nmarine\nenvironment\n6.1. Practice compliance with\nlegislative requirements for\nprotection of the marine\nenvironment\n6.2. Practice anti-pollution\nprocedures\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n7. Observe safe\nworking\npractices\n7.1. Identify and follow workplace\nprocedures for hazard\nidentification and risk control\n7.2. Contribute to arrangements for\nthe management of\noccupational health and safety\n7.3. Understand and take\nnecessary actions to control\nfatigue\n7.4. Complete occupational health\nand safety records\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n8. Demonstrate\nsecurity\nawareness\npractices\n8.1 Contribute to the enhancement\nof maritime security through\nheightened awareness\n8.2 Recognize security threats\n8.3 Understand the need for and\nmaintaining security awareness\nand vigilance\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\nNote*: Applicant trainee who already possesses relevant certificate of training and/or certificate of\ncompetency in Basic Safety Training (BST) and Security Awareness Training shall not be\nrequired to undergo training/ certification on Common Competencies\n\n--- PDF PAGE 64 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n60\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Steer the ship\nand comply\nwith helm\norders\n1.1. Steer the ship using magnetic\nand gyro compass\n1.2. Respond to helm orders\n• Lectures\n• Demonstrations\n• Simulation\n• Discussions\n• Hands-on\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n2. Keep a proper\nlook-out by\nsight and\nhearing\n2.1 Detect sounds, lights and\nother objects\n2.2 Report the approximate\nbearing of a sound, light or\nother object in degrees or\npoints\n• Lectures\n• Demonstrations\n• Simulation\n• Discussions\n• Hands-on\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n3. Contribute to\nmonitoring and\ncontrolling a\nsafe watch\n3.1 Contribute to watchkeeping\nprocedures\n3.2 Respond to potential\nemergency situations\n• Lectures\n• Demonstrations\n• Simulation\n• Role play\n• Discussions\n• Hands-on\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n4. Operate\nemergency\nequipment and\napply\nemergency\nprocedures\n4.1 Apply emergency procedures\n4.2 Maintain the integrity of\nemergency distress and\nalerting systems\n• Lectures\n• Demonstrations\n• Simulation\n• Discussions\n• Hands-on\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n--- PDF PAGE 65 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n61\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off the job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when\ndesigning training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n•\nProject-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience.\nOther requirements like health and physical requirements are also stated. Passing entry\nwritten examinations may also be indicated if necessary.\n\n•\nMust be 18 years old and above\n•\nMust have completed 10 years Basic Education\n•\nMust have passed the medical examination for eyesight and hearing as per\nDOH Administrative Order No. 2013-0006\n\n--- PDF PAGE 66 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n62\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR RATING FORMING\nPART OF A NAVIGATIONAL WATCH (STCW Regulation II/4)\n\nRecommended list of tools, equipment and materials per batch of 24 trainees for\nRATING FORMING PART OF A NAVIGATIONAL WATCH NC II (STCW Regulation II/4)\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nIntegral\n\n1 per\nclass\n• Tools for the\ndelivery of training\nare integrated in\nthe required\nequipment (Full\nmission bridge\nsimulator)\n• AVR equipment\nthat can handle\nvideo or\nPowerPoint\npresentation\nmaterials\n1 set\n• Bridge simulator\n• 2 Mini Stations\n• 1 Instructor Station\n• 4 Mathematical\nModels (Own Ship)\nwith following\nDirectional Stability\n1. Stable\n2. Stable with\nsteering bias\nto port\n3. Stable with\nsteering bias to\nstarboard\n4. Unstable\n\nNote:\nSimulator must have\nvisualization of not\nless than 225\ndegrees arc of\nhorizontal visibility\ncapable to simulate\nship’s standard\nsteering system\n(hand and auto-\npilot), multiple\nprogrammed ships’\nand targets’\nnavigational lights,\nsound signals, and\nvarious state of\nweather and sea\nconditions.\n\n1 set\nVideo or PowerPoint\npresentation for:\n\n• Steering techniques\n• Sound and light\nsignals\n• Compass bearings\nand directions\n• Applying Rules of\nthe Road\n• Various\nemergencies on\nboard\n• Bridge team\ncommunication\n• Pyrotechnic\ndistress signals;\nEPIRBS and SART\n• Protection of\nenvironment\n• Shipboard\ncommunication\n\nREMARKS:\n\nAbove tools, equipment and materials are applicable for the training delivery of the CORE\nCOMPETENCIES.\n\nThe tools, equipment and materials for the delivery of the COMMON COMPETENCIES shall\ncomply with the standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in\ntheir prescribed and regulated training program in BASIC SAFETY TRAINING (BST) and\nSECURITY AWARENESS TRAINING courses.\n\n--- PDF PAGE 67 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n63\n3.5\nTRAINING FACILITIES\n\nFOR RATING FORMING PART OF A NAVIGATIONAL WATCH NC II (STCW\nRegulation II/4)\n\nBased on a class size of 24 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop/Laboratory area:\n\n100\n\nBridge simulator with two (2) mini-\nstations and one (1) instructor\nstation\nLecture Room\n\n42\n42\nLearning Resource Center\n\n20\n20\nWash/Comfort room\n\n10\n10\nStorage/Tool room\n\n20\n20\nCirculation Area\n\n50\nTotal Area\n\n242 sq. m.\n\nCirculation area = 30% of workshop area + lecture room + LRC\n\n3.6\nTRAINER’S QUALIFICATIONS FOR MARITIME SECTOR\n\nRATING FORMING PART OF A NAVIGATIONAL WATCH NC II (STCW\nRegulation II/4)\n\nTRAINER QUALIFICATION\n\n•\nMust be licensed Officer-In-Charge of a Navigational Watch and at least with\ntwelve (12) months seagoing service in that position\n•\nMust be proficient in English communication\n•\nMust be a holder of National TVET Trainer Certificate (NTTC) I – Rating\nForming Part of a Navigational Watch NC II (STCW Regulation II/4)\n\nREMARKS:\n\nAbove trainer’s qualifications are applicable for the delivery of the CORE\nCOMPETENCIES.\n\nThe trainer’s qualifications for the delivery of the common competencies shall comply with\nthe standards prescribed by the MARITIME INDUSTRY AUTHORITY (MARINA) in their\nprescribed and regulated training in Basic Safety Training (BST) and SECURITY\nAWARENESS TRAINING courses.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 68 ---\nRating Forming Part of a Navigational Watch NC II (STCW Regulation II/4)\nRevised June 26, 2013\n64"
