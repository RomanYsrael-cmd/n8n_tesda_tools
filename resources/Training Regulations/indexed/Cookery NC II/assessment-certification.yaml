  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of COOKERY NC II, the candidate must\ndemonstrate competence in all the units of competency listed in Section l.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of COOKERY NC II must\nacquire Certificates of Competency in all the following groups or clusters of\ncore units of the Qualification. Candidates may apply for assessment in any\naccredited assessment center.\n\n4.2.1 Prepare and cook hot meals\n4.2.1.1 Clean and maintain kitchen premises\n4.2.1.2 Prepare stocks, sauces and soups\n4.2.1.3 Prepare poultry and game dishes\n4.2.1.4 Prepare seafood dishes\n4.2.1.5 Prepare eggs dishes\n4.2.1.6 Prepare starch dishes\n4.2.1.7 Prepare vegetable dishes\n4.2.1.8 Package prepared food\n4.2.1.9 Prepare meat dishes\n\n4.2.2 Prepare Cold Meals\n4.2.2.1 Clean and maintain kitchen premises\n4.2.2.2 Prepare appetizers\n4.2.2.3 Prepare salads and dressings\n4.2.2.4 Package prepared food\n4.2.2.5 Prepare sandwiches\n\n4.2.3 Prepare Sweets\n\n4.2.3.1 Clean and maintain kitchen premises\n4.2.3.2 Prepare desserts\n4.2.3.3 Package prepared food\n\n Successful candidates shall be awarded Certificates of Competency\n(COC).\n\n4.3 Upon accumulation and submission of all the above COCs acquired for the\nrelevant units of competency comprising this qualification, an individual shall\nbe issued the corresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs.\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\".\n\n--- PDF PAGE 92 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 90\n\nClean and maintain\nkitchen premises\nPrepare poultry and\ngame dishes\nSelect, prepare and\nserve specialty\ncuisine’s\nManage facilities\nassociated with\ncommercial catering\ncontracts\nDirect and lead\nservice team in the\ndining\narea/restaurant\nPrepare and present\ngateaux, tortes and\ncakes\nProvide\naccommodation\nreception services\nPlan and schedule\nroutine\nmaintenance, repairs\nand modifications\nPrepare stocks,\nsauces and soups\nPrepare seafood\ndishes\nMonitor catering\nrevenue and costs\nPlan the catering for\nan event or function\nOversee dining\narea operations\nPrepare and display\npetits fours\nConduct night\naudit\nContribute to the\nimplementation of\nemergency\nprocedures\nPrepare appetizers\nPrepare desserts\nEstablish and\nmaintain quality\ncontrol\nDesign menus to\nmeet market needs\nOversee banquet\nand/or catering\nfunction\nPresent desserts\nProvide club\nreception services\nObserve and\nmonitor people\nPrepare salads and\ndressings\nPackage prepared\nfood\nApply cook-chill-\nfreeze production\nprocess\nDevelop a food\nsafety program\nOperate a food\noutlet\nClean bar areas\nProvide porter\nservices\nEscort, carry and\nstore valuable items\nPrepare\nsandwiches\nPlan and prepare\nfood for ala carte\nand buffets\nPrepare foods\naccording to\ndietary and cultural\nneeds\nPrepare the dining\nroom/restaurant area\nfor service\nPrepare tenders for\ncatering contracts\nOperate bar\nProvide\nhousekeeping\nservices to guests\nManage physical\nassets\nPrepare meat\ndishes\nPlan and control\nmenu-based\ncatering\nTransport and store\nfood in a safe and\nhygienic manner\nProvide preliminary\ndining\nroom/restaurant\nservice procedures\nDevelop a food