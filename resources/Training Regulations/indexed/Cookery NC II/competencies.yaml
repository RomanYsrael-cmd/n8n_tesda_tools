orage of meat requirements\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                53 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools, utensils and \nequipment \nMay include but are not limited to:  \n1.1. \nVarious kitchen knives \n1.2. \nMeat mallet \n1.3. \nMeat hooks \n1.4. \nLarding needles \n1.5. \nKnife sharpening and honing equipments \n1.6. \nFood slicers and processors \n1.7. \nMeat thermometer \n1.8. \nWeighing scales \n1.9. \nKitchen twines \n2. Cooking method \nMay include but are not limited to: \n2.1. \nDry method  \n2.1.1. Roasting \n2.1.2. Grilling \n2.1.3. Broiling  \n2.1.4. Baking \n2.1.5. Pan frying \n2.1.6. Deep fat Frying \n \n2.2. \nCombination Method \n2.2.1. Braising \n2.2.2. Stewing  \n \n2.3. \nMoist method \n2.3.1. Boiling \n2.3.2. Steaming \n2.3.3. Poaching \n2.3.4. Simmering \n3. Dishes \n3.1 \nOffal \n3.2 \nMeat\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                54"
