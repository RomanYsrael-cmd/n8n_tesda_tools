        "source_text": "--- PDF PAGE 4 ---\nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                2 \nSECTION 2   COMPETENCY STANDARDS  \n \n \nThis section gives the details of the contents of the basic, common and core \nunits of competency required in COOKERY NC II.  \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :    PARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n     :    500311105 \nUNIT DESCRIPTOR      : This unit covers the knowledge, skills and attitudes   \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of \nVariables\n1. Obtain and convey workplace \ninformation \n1.1 Specific and  relevant information is accessed \nfrom appropriate sources  \n1.2 Effective questioning , active listening and \nspeaking skills are used to gather and convey \ninformation \n1.3 Appropriate medium is used to transfer \ninformation and ideas \n1.4 Appropriate non- verbal communication is \nused \n1.5 Appropriate lines of communication with \nsupervisors and colleagues are identified and \nfollowed \n1.6 Defined workplace procedures for the location \nand storage of information are used \n1.7 Personal interaction is carried out clearly and \nconcisely\n2. Speak English at a \nbasic operational level \n2.1 Simple conversations on familiar topics with \nwork colleagues is participated \n2.2 Simple verbal instructions or requests are \nresponded to \n2.3 Simple requests are made \n2.4 Routine procedures are described \n2.5 Likes, dislikes and preferences are expressed \n2.6 Different forms of expression in English is \nidentified\n3. Participate in workplace \nmeetings and discussions \n3.1 Team meetings are attended on time \n3.2 Own opinions are clearly expressed and those \nof others are listened to without interruption \n3.3 Meeting inputs are consistent with the meeting \npurpose and established protocols \n3.4 Workplace interactions are conducted in a \ncourteous manner  \n3.5 Questions about simple routine workplace \nprocedures and maters concerning working \nconditions of employment are asked and \nresponded to \n3.6 Meetings outcomes are interpreted and \nimplemented\n\n--- PDF PAGE 5 ---\nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                3 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of \nVariables\n4. Complete relevant work \nrelated documents \n4.1 Range of forms relating to conditions of \nemployment are completed accurately and \nlegibly \n4.2 Workplace data is recorded on standard \nworkplace forms and documents \n4.3 Basic mathematical processes are used for \nroutine calculations \n4.4 Errors in recording information on forms/ \ndocuments are identified and properly acted \nupon \n4.5 Reporting requirements to supervisor are \ncompleted according to organizational \nguidelines\n\n--- PDF PAGE 6 ---\nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                4 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6. \nFace to face communication \n3. Storage \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Forms \n4.1. \nPersonnel forms, telephone message \nforms, safety reports \n5. Workplace interactions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, \ninstruction and forms, non-verbal including \ngestures, signals, signs and diagrams \n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions\n\n--- PDF PAGE 7 ---\nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                5 \n \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard \nformat of the organization \n1.2. Accessed information using communication equipment \n1.3. Spoken English at a basic operational level \n1.4. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.5. Conveyed information effectively adopting the formal or \ninformal communication \n2. Underpinning \nKnowledge  \n \n2.1. Effective communication \n2.2. Different modes of communication  \n2.3. Written communication \n2.4. Organizational policies \n2.5. Communication procedures and systems \n2.6. Technology relevant to the enterprise and the \nindividual’s work responsibilities \n3. Underpinning \nSkills \n3.1. Follow simple spoken language \n3.2. Perform routine workplace duties following simple \nwritten notices \n3.3. Participate in workplace meetings and discussions \n3.4. Complete work related documents \n3.5. Estimate, calculate and record routine workplace \nmeasures \n3.6. Basic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.7. Ability to relate to people of social range in the \nworkplace \n3.8. Gather and provide information in response to \nworkplace requirements \n4. Resource \nImplications \n4.1. Fax machine \n4.2. Telephone \n4.3. Writing materials \n4.4. Internet \n \n5. Methods of \nAssessment \n5.1. Direct Observation \n5.2. Oral interview and written test \n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
