        "source_text": "--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                18 \nCOMMON COMPETENCIES \n \n \n UNIT OF COMPETENCY :   DEVELOP AND UPDATE INDUSTRY KNOWLEDGE \n \n UNIT CODE                      :  TRS311201 \n \n UNIT DESCRIPTOR      :  This unit of competency deals with the knowledge, skills \nrequired to access, increase and update industry \nknowledge.  It includes seek information on the \nindustry and update industry knowledge. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of \nVariable \n1.  Seek information on the \nindustry \n1.1 Sources of information on the industry are \ncorrectly identified and accessed \n1.2 Information to assist effective work \nperformance is obtained in line with job \nrequirements \n1.3 Specific information on sector of work is \naccessed and updated \n1.4 Industry information is correctly applied to day-\nto-day work activities\n2.  Update industry \nknowledge \n \n \n \n2.1 Informal  and/or formal research is used to \nupdate general knowledge of the industry \n2.2 Updated knowledge is shared with customers \nand colleagues as appropriate and incorporated \ninto day-to-day working activities  \n3.  Develop and update \nlocal knowledge \n3.1    Local knowledge is developed  to assist queries \non local/national tourism industry \n3.2    Local knowledge is updated using informal \nand/or formal research  \n3.3    Contact with local communities is maintained \n4.  Promote  products and \nservices to customers \n \n4.1    Promotional initiatives are described that may \nbe used to promote products and services \n4.2    Selling skills are applied according to customer  \nneeds\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                19 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information sources \nInformation sources may include but are not limited \nto : \n1.1 media \n1.2 reference books \n1.3 libraries \n1.4 unions \n1.5 industry associations \n1.6 industry journals \n1.7 internet \n1.8 personal observation and experience\n2.  Information to assist \neffective work performance \n2.1 different sectors of the industry and the \nservices available in each sector \n2.2 relationship between tourism and \nhospitality \n2.3 relationship between the industry and \nother industries \n2.4  industry working conditions \n2.5 legislation that affects the industry \n liquor \n health and safety \n hygiene \n gaming \n workers compensation \n consumer protection  \n duty of care \n building regulations \n2.6 trade unions \n      environmental issues and requirements \n2.7 industrial relations issues and major \norganizations \n2.8 career opportunities within the industry \n2.9 work ethic required to work in the \nindustry and industry expectations of \nstaff \n2.10 quality assurance \n3.  Informal and formal \nresearch \nMay include: \n3.1 Discussions with colleagues, management and \ncustomers \n3.2 Reading internal enterprise material about \nproducts and services \n3.3  Familiarity with customer comments including \ncomplaints \n3.4 Reading and researching product data and \ninformation\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                20 \n \nVARIABLE \nRANGE \n \n3.5    Conducting internal testing to determine \nquality and differentials \n3.6    General media research \n3.7    Developing and analyzing responses to \nquestionnaires \n3.8    Reading surveys and ratings \n4.  Promotional initiatives \nMay include: \n4.1    Media campaigns \n4.2    Internal promotions, including static displays, \ndemonstrations, tastings, videos, \ncompetitions, packages, events\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                21 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate/ trainee: \n1.1 Knew key sources of information on the industry \n1.2 Updated industry knowledge \n1.3 Accessed and used industry information \n1.4 Developed and updated local knowledge \n1.5 Promoted products and services \n2.  Underpinning \nSkills \n2.1 Time management \n2.2 Ready skills needed to access industry information \n2.3 Basic competency skills needed to access the internet \n3.  Underpinning \nKnowledge  \n3.1 Overview of quality assurance in the industry \n3.2 Role of individual staff members \n3.3 Industry information sources \n4.  Resource \nImplications  \n4.1 Sources of information on the industry \n4.2 Industry knowledge \n5.  Methods of \nAssessment \n5.1 Interview/questions \n5.2 Practical demonstration \n5.3 Portfolio of industry information related to trainee’s work \n6.  Context for \nAssessment \n6.1  Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through TESDA's \naccredited assessment center\n",
