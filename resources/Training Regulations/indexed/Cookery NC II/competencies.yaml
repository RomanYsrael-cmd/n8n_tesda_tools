        "source_title": "PREPARE POULTRY AND GAME DISHES",
        "source_text": "--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                64 \n \nUNIT OF COMPETENCY : \nPREPARE POULTRY AND GAME DISHES \n \nUNIT CODE \n : \nTRS512333 \n \nUNIT DESCRIPTOR        : \nThis unit deals with the knowledge, skills and \nattitude required in selecting, preparing, cooking, \nplating/presenting and storing poultry and game. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Perform mise en\nplace \n1.1 Tools, utensils and equipment are cleaned, \nsanitized and prepared based on the required tasks \n1.2 Ingredients are identified according to standard \nrecipes, recipe card or enterprise requirements \n1.3 Ingredients are assembled according to quantity, \ntype, and quality required \n1.4 Ingredients are prepared based on the required form \nand time frame \n1.5 Poultry and game  are prepared based on its \nenterprise poultry and game preparation \ntechniques  \n1.6 Frozen poultry and game are thawed in accordance \nwith enterprise thawing procedures \n1.7 Frozen ingredients are thawed following enterprise \nprocedures. \n1.8 Where necessary, raw ingredients are washed with \nclean potable water. \n2. Cook poultry and  \ngame dishes \n2.1 Poultry and game are handled efficiently and \nhygienically to minimize risk of food spoilage and \ncross-contamination \n2.2 Poultry and game dishes are cooked according to \nenterprise standard recipes and appropriate \nCooking methods  \n2.3 Cooked dishes are tasted and seasoned in \naccordance with the required taste of the dishes \n3. Plate/present \npoultry and game \ndishes \n3.1 Service wares are selected in accordance with type \nof poultry and game dishes \n3.2 Poultry and game is plated/presented using suitable \nsauces, garnishes and accompaniments \n3.3 Poultry dishes are presented hygienically, logically \nand sequentially within the required timeframe \n3.4 Factors in plating dishes are observed in \npresenting poultry and game dishes.. \n4. Store poultry and \ngame  \n4.1 Poultry and game are stored ensuring storage \nconditions and optimal temperature are maintained \n4.2 Quality trimmings  and other leftovers are utilized \nwhere and when appropriate\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                65 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Poultry or game \nMay include but are not limited to : \n1.1 Chicken, turkey, duck, goose \n1.2 Pheasant, quail, pigeon, guinea fowl, wild duck \n1.3 Rabbit, hare \n1.4 Boar, goat \n2. Poultry preparation \ntechniques \nMay include but are not limited to: \n2.1 De-boning \n2.2 Stuffing \n2.3 Filleting \n2.4 Rolling and trussing \n2.5 Larding \n2.6 Marinating \n3. Cooking methods for \npoultry and game \nMay include but are not limited to: \n3.1 Dry method  \n3.1.1 Roasting \n3.1.2 Grilling \n3.1.3 Broiling  \n3.1.4 Baking \n3.1.5 Pan frying \n3.1.6 Deep fat Frying \n \n3.2 Combination Method \n3.2.1 Braising \n3.2.2 Stewing  \n \n3.3 Moist method \n3.3.1 Boiling \n3.3.2 Steaming \n3.3.3 Poaching \n3.3.4 Simmering \n4. Factors to consider \nin plating dishes \n4.1 appeal \n4.2 color and contrast \n4.3 temperature of food and service     \n4.4 equipment \n4.5 classical and innovative arrangement styles \n5. Ways of presenting \npoultry and game \ndishes \n5.1 Carve \n5.2 Portions \n5.3 Whole\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                66 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate:\n1.1 Understood the different classifications of poultry \nand game \n1.2 Demonstrated particular storage and handling \npractices related to poultry and game \n1.3 Prepared a variety of poultry and game dishes \naccording to enterprise standards \n1.4 Cooked and presented or plated poultry and game \ndishes according to enterprise standards \n1.5 Followed safety practices in handling tools and \nequipment\n2. Required Knowledge 2.1 Classification of varieties of poultry and game items\n2.2 Quality criteria for poultry and game \n2.3 Appropriate cookery methods for poultry and game \ndishes \n2.4 Past and current trends in poultry and game dishes \n2.5 Nutrition related to poultry and game, including food \nvalues and any specific issues like salmonella \ncontaminations, etc. \n2.6 Common cooking terms related to poultry and game \nwhich are used in the industry \n2.7 Safe work practices, particularly in relation to cutting \n2.8 Logical and time efficient work flow\n3.  Required Skills\n3.1 Organizational skills and teamwork\n3.2 Principles and practices of sanitary specifically \ncross-contamination \n3.3 Techniques on minimizing wastes and environment-\nfriendly practices on handling and preparation of \npoultry and game\n4.  Resource\n     Implications \nThe following resources MUST be provided:\n4.1 Access to a fully-equipped operational \ncommercial/institutional kitchen (including industry- \nmodern equipment) \n4.2 Real/Required ingredients \n4.3 Poultry and game  \n4.4 Service wares\n5.  Methods of \nAssessment \nCompetency may be assessed through :\n5.1 Direct observation of the candidate while handling \nand cooking game and poultry \n5.2 Sampling of dishes cooked by the candidate \n5.3 Written or oral questions to test candidate’s \nknowledge on  issues involved in cooking game, \nfood safety and appropriate cookery methods for \npoultry and game \n5.4 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate\n6.  Context for  \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2  Assessment activities are carried out through an  \naccredited assessment center\n",
