MENT\nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n4.  Handle queries through use \nof common business tools \nand technolgoy \n4.1   Common business tools and technology are \nused efficiently to determine customer \nrequirements \n4.2   Queries/ information are recorded in line with \nenterprise procedure \n4.3   Queries are acted upon promptly and correctly in \nline with enterprise procedure \n5.  Handle complaints/conflict \nsituations, evaluation and \nrecommendations \n5.1  Guests are greeted with a smile and eye-to-eye \ncontact \n5.2   Responsibility for resolving the complaint is \ntaken within limit of responsibility and according \nto enterprise policy \n5.3   Nature and details of complaint are established \nand agreed with the customer  \n5.4   Threats to personal safety are identified and \nmanaged to personal safety of customers or \ncolleagues and appropriate assistance is \norganized \n5.5   Appropriate action is taken to resolve the \ncomplaint to the customers satisfaction wherever \npossible   \n5.6   Conflict situations are resolved within scope of \nindividual responsibility by applying effective \ncommunication skills and according to enterprise \npolicy\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                34 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Customer \nMay include: \n1.1    internal \n1.2    external \n2. Non-verbal \ncommunication \nMay include: \n2.1 \nbody language \n2.2 \ndress and accessories \n2.3 \ngestures and mannerisms \n2.4 \nvoice tonality and volume \n2.5 \nuse of space \n2.6 \nculturally specific communication customs and \npractices\n3. Cultural and social \ndifferences \nMay include: \n3.1 \nmodes of greeting, farewell and conversation \n3.2 \nbody language/  use of body gestures \n3.3 \nformality of language \n4. Interpersonal skills \nMay include: \n4.1 \ninteractiv