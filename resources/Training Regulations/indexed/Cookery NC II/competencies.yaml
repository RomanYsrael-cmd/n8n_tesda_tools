        "source_text": "--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                46 \nUNIT OF COMPETENCY :     PREPARE SALADS AND DRESSINGS \n \nUNIT CODE \n: \nTRS512329 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the skills and knowledge required \nin preparing and presenting salads and dressings  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform Mise en \nplace  \n1.1 Tools, utensils  and equipment  are cleaned, \nsanitized and prepared based on the required tasks \n1.2 Ingredients are identified correctly, according to \nstandard recipes, recipe cards or enterprise \nrequirements \n1.3 Ingredients are assembled according to correct \nquantity, type and quality required \n1.4 Ingredients are prepared based on the required form \nand time frame \n1.5 Frozen ingredients are thawed following enterprise \nprocedures. \n1.6 Where necessary, raw ingredients are washed with \nclean potable water. \n2. Prepare a variety \nsalads and \ndressings \n2.1. Variety of salads are prepared using fresh \n(seasonal) ingredients according to acceptable \nenterprise standards to maximize eating qualities, \ncharacteristics and taste \n2.2. Dressings are prepared suitable to either \nincorporate into, or accompany salads \n2.3. Prepared salads ad dressings  are tasted and \nseasoned in accordance with the required taste \n2.4. Workplace safety and hygienic procedures are \nfollowed according to enterprise and legal \nrequirements \n3. Present a variety of \nsalads and \ndressings \n3.1. Suitable plate are selected according to enterprise \nstandards  \n3.2. Salads are presented attractively according to \nenterprise standards \n3.3. Salads and dressing are accompanied based on \nclients requirements \n3.4. Salads and dressings  are presented hygienically, \nlogically and sequentially within the required \ntimeframe \n4. Store salads and \ndressings \n4.1. Salads are kept in appropriate conditions based on \nenterprise procedures \n4.2. Required containers are used and stored in proper \ntemperature to maintain freshness, quality and taste\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                47 \nRANGE OF VARIABLES  \n \n1. Variety of Salads \nMay include but are not limited to: \n1.1. Leafy \n1.2. Non-leafy \n1.3. Protein \n1.4. Combination \n1.5. Congealed \n1.6. Fruit \n1.7. Cooked \n2. Dressings  \nMay include but are not limited to: \n2.1 \nTemporary emulsions \n2.2 \nPermanent emulsions\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                48 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidences that the candidate:\n1.1. \nPrepared a variety of salads from different \nrecipes and cultural backgrounds \n1.2. \nPrepared variety of salads and dressing \nhygienically and within industry-realistic \ntimeframes \n1.3. \nPresented salads and dressing attractively and \ncreatively \n1.4. \nStored salads and dressings in accordance with \nenterprise standard procedures\n2. Required Knowledge \nand \nAttitude \n2.1\nHistorical development and current trends in \nsalads and dressings \n2.2 \nSuitable commodities and food combinations for \nuse in salads and dressings  \n2.3 \nCompatible dressings for incorporating into or \naccompanying salads \n2.4 \nNutritional values of salads ingredients and the \neffects of cooking on nutrients \n2.5 \nCommon cooking terms on salads and dressings \nwhich are used in the industry \n2.6 \nSafe work practices on using kitchen tools and \nequipment \n2.7 \nPrinciples and practices of sanitary including \nappropriate dress or attire \n2.8\nLogical and time efficient work flow\n3. Required \nSkills \n3.1\nAttractive presentation techniques for salads and \ndressings \n3.2 \nWaste minimization techniques and \nenvironmental considerations in specific relation \nto salads and dressings \n3.3 \nPreparation of dishes for customers within typical \nworkplace time constraints\n4. Resource Implications The following resources MUST be provided:\n4.1. \nAccess to a fully-equipped and commercially-\nrealistic food  preparation area with appropriate \nand industry-current equipment \n4.2. \nA variety of suitable ingredients for salads and \ndressings \n4.3.\nService wares\n5. Methods for \nAssessment \nCompetency may be assessed through\n5.1 \nDirect observation of the candidate while \npreparing salads and dressings \n5.2 \nWritten or oral questions to test knowledge on \ncommodity and food safety issues  \n5.3 \nReview of portfolios of evidence and third party \nworkplace reports of on-the-job performance by \nthe candidate\n6. Context for \nAssessment \n6.1\nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through an  \naccredited assessment center\n",
