        "source_text": "--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                74 \nUNIT OF COMPETENCY  : \nPACKAGE PREPARED FOOD \n \nUNIT CODE \n: \nTRS512340 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge, skills, and \nattitudes in packaging of prepared foodstuffs for \ntransportation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Select packaging \nmaterials  \n1.1. \nFood requirements of client and user are met  \nprior to packaging in accordance with the \nenterprise standard following the criteria for \npackaging \n1.2. \nQualities of packaging materials are selected in \naccordance enterprise standards  \n2. Package food  \n2.1 \nFood is packaged in compliance with sanitary, \noccupational health and safety and local health \nregulations requirements \n2.2 \nEnvironmental requirements for food \npackaging area is observed \n2.3 \nAppropriate packaging procedures are adopted \naccording to enterprise specifications \n2.4 \nFood labeled according to industry standards\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                75 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Criteria for \npackaging \nMust include the: \n1.1. \nQuality  \n1.2. \nShelf-life \n1.3. \nPortion control \n2. Types of packaging \nmaterials \nMay include but are not limited to: \n2.1. \nCartons \n2.2. \nPlastic cling wrap \n2.3. \nPlastic or foil containers \n3. Qualities of \nPackaging materials \n3.1. \nNon-contaminating \n3.2. \nAppropriate dimensions for selected food \n3.3. \nVisually appropriate to functional need \n3.4. \nCapable of protecting food from damage and \ncontamination \n3.5. \nEnvironment-friendly \n3.6. \nStackable and transportable    \n \n4. Environmental \nrequirements for \nfood packaging \n \n4.1 \nTemperature control \n4.2 \nHumidity\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                76 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 Performed safe packaging of food within food \nsafety requirements and regulations \n1.2 Selected and used suitable packaging materials \nand methods for a different food item types \n1.3 Demonstrated hygienic  practices and food safety \nregulations in storing and transporting package \nfoods\n2.  Required Knowledge \nand Attitude \n2.1 Safe work practices on packaging, dealing with hot \nsurfaces, lifting and bending. \n2.2 The characteristics and uses of different packaging \nmaterials \n2.3 Portion control practices and principles \n2.4 Functional design requirements for food packaging \nareas \n2.5 Hygienic practices and food safety regulations, \nparticularly on storage and transporting of food, \nincluding: \n2.5.1 HACCP Principles applied to off-site catering \n2.5.2 Local health regulations pertaining on food \nproduction and packaging \n2.5.3 Current Philippine regulations\n3.  Required Skills \n3.1   Storing and transporting of food \n3.2   Packaging techniques \n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1 Access to a range of appropriate packaging \nmaterials, catering equipment  \n4.2\nReal food items\n5.  Methods of Assessme Competency may be assessed through: \n5.1 Direct observation of the candidate while packaging \nfoods \n5.2 Written or oral questions to test candidate’s \nknowledge on packaging types and methods for \ndifferent types of food, hygienic practices in \npackaging, maintaining food quality and nutritional \nvalue \n5.3 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate\n6.  Context for \nAssessment \n6.1 Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 Assessment activities are carried out through an \naccredited assessment center\n",
