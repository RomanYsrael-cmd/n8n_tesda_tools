        "source_title": "PREPARE SEAFOOD DISHES",
        "source_text": "--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                67 \nUNIT OF COMPETENCY:   PREPARE SEAFOOD DISHES \n \nUNIT CODE  \n         :   TRS512334 \n \nUNIT DESCRIPTOR       :  This unit deals with the knowledge, skills and attitude \nrequired in selecting, preparing, presenting and storing \nseafood in a commercial kitchen or catering operation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Perform mise en \nplace \n1.1 Tools, utensils and equipment are cleaned, \nsanitized and prepared based on the required tasks \n1.2 Ingredients are identified according to standard \nrecipes, recipe card or enterprise requirements \n1.3 Ingredients are assembled according to quantity, \ntype, and quality required \n1.4 Ingredients are prepared based on the required \nform and time frame \n1.5 Frozen ingredients are thawed following enterprise \nprocedures. \n1.6 Where necessary, raw ingredients are washed with \nclean potable water. \n2. Handle fish and  \nseafood \n2.1 Seafood is selected according to quality,  \n2.2 Seafood are handled hygienically in accordance \nwith enterprise handling and storing techniques \n2.3 Frozen seafood are thawed correctly to ensure \nmaximum quality,  and to retain their nutrients \n3. Cook fish and \nshellfish \n3.1 Fish is cleaned, gutted and filleted correctly and \nefficiently according to enterprise standards \n3.2 Shellfish and other types of seafood are cleaned \nand prepared correctly and in accordance with \nenterprise standards \n3.3 Seafood dishes is cooked according to enterprise \nstandards using a variety of cooking methods  \n3.4 Fish and shellfish by-products are used \nappropriately for a variety of dishes and menu items \n3.5 Cooked dishes are tasted and seasoned in \naccordance with the required taste of the dishes \n3.6 Workplace safety and hygienic procedures are \nfollowed according to enterprise and legislated \nrequirements\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                68 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n4. Plate/Present fish \nand seafood \n4.1 \nSeafood  dishes are presented hygienically, \nlogically and sequentially within the required \ntimeframe \n4.2 \nFish and seafood is prepared and presented for \nservice in accordance to enterprise standards \n4.3 \nSuitable sauces and dips are prepared according \nto standard recipes and as required to accompany \nseafood menu items \n4.4 \nPresentations and garnishing techniques are \nselected and used according to recipes and \nenterprise standards \n4.5 \nServices are carried out according to enterprise \nmethods and standards \n4.6 \nFactors in plating dishes are observed in \npresenting seafood dishes \n5. Store fish and \nseafood \n5.1    Quality trimmings and other leftovers are utilized \nwhere and when appropriate Seafood are stored \nhygienically in accordance with enterprise handling \nand storing techniques \n5.2    Where applicable, date stamps and codes are \nchecked to ensure quality control \n5.3    Seafood is stored in accordance with FIFO \noperating procedures and storage of seafood \nrequirements.\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                69 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Seafood\nMay include but are not limited to:\n1.1. Shellfish \n1.1.1. Mollusks \n1.1.2. Crustaceans  \n1.1.3. Cephalopods \n1.2. Fish \n1.2.1 Flat fish \n1.2.2 Round fish  \n1.2.3 flat fish \n2. Fish \nMay include but are not limited to :\n2.1  Structure \na. Fish \nb. Shellfish \n2.2 Body shape  \na.   Flat fish \n        b.   Round fish \n2.3 Market forms \na. Fillets \nb.   Drawn \nc. Whole \nd. Butterfly fillet \ne. Steak \n2.4 Fat content \na.   Lean Fish \n        b.   Fat Fish \n2.5 Water source \na. Salt water \nb. Freshwater \n2.6 Processed fish \na.   Dried \nb.   Smoked \nc. Bottled \n3. Variety of cooking \nmethod \nMay include but are not limited to:\n3.1 \nDry method  \n3.1.1 Roasting \n3.1.2 Grilling \n3.1.3 Broiling  \n3.1.4 Baking \n3.1.5 Pan frying \n3.1.6 Deep fat Frying \n \n3.2 \nCombination Method \n3.2.1 Braising \n3.2.2 Stewing  \n \n3.3 \nMoist method \n3.3.1 Boiling \n3.3.2 Steaming \n3.3.3 Poaching \n3.3.4 Simmering\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                70 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate:\n1.1 Explained the different classifications of seafood \n1.2 Demonstrated storing and handling issues related to \nseafood \n1.3 Cooked and plated/presented a range of seafood \ndishes according to enterprise standards \n1.4 Stored seafood hygienically and in accordance with \nenterprise standard procedures \n1.5 Demonstrated safety practices in handling tools and \nequipment\n2. Required Knowledge 2.1 Historical development and current trends in the \npreparation and presentation of seafood \n2.2 Classification and varieties of fish and shellfish \n2.3 Criteria for judging the quality of fresh seafood \n2.4 Storage requirements for seafood \n2.5 Nutrition related to seafood, particularly the \nnutritional value of seafood  \n2.6 Specific dietary issues including allergies and \nintolerances \n2.7 Common cooking terms related to seafood that are \nused in the industry \n2.8 Principles and practices of sanitary specifically on \nhandling and storage of seafood \n2.9 Safe work practices, particularly on using sharp \nknives\n3.  Required Skills\n3.1 Appropriate cookery methods for fish and shellfish\n3.2 Cutting and presentation techniques, particularly on \nfish and crustaceans \n3.3 Costing, yield testing and portion control for seafood \n3.4 Waste minimization techniques and environmental \nconsiderations in relation to seafood\n4. Resource\nImplications \nThe following resources MUST be provided:\n4.1 Access to a fully-equipped operational \ncommercial/institutional kitchen (including industry-\ncurrent equipment) \n4.2 Real/Relevant ingredients \n4.3 Seafood  \n4.4 Service wares\n5.  Methods of  \nAssessment \nCompetency may be assessed through :\n5.1 Direct observation of the candidate while preparing \nand cooking fish and seafood \n5.2 Written or oral questions to test candidate’s \nknowledge on storage issues related to fish and \nseafood \n5.3 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate\n6.  Context for  \nAssessment \n6.1  Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2  Assessment activities are carried out through  an \naccredited assessment center\n",
