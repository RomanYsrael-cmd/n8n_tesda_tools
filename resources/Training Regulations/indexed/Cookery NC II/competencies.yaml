        "source_title": "PREPARE STOCKS, SAUCES AND SOUPS",
        "source_text": "--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                40 \nUNIT OF COMPETENCY :     PREPARE STOCKS, SAUCES AND SOUPS \n \nUNIT CODE  \n \n:     TRS512331 \n \nUNIT DESCRIPTOR \n:    This unit deals with the skills, knowledge, and attitude \nrequired to prepare various stocks, sauces and \nsoups in a commercial/institutional kitchen  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare stocks, \nglazes and \nessences required \nfor menu items \n1.1 Ingredients and flavoring agents are used according \nto standard recipes defined by the enterprise  \n1.2 Variety of stocks, glazes, flavorings, seasonings are \nproduced according to enterprise standards \n2.  Prepare soups \nrequired for  \n     menu items \n2.1 Correct ingredients are selected and assembled to \nprepare soups, including stocks and prepared \ngarnishes \n2.2 Variety of soups are prepared according to enterprise \nstandards \n2.3 Clarifying, thickening agents and convenience \nproducts are used where appropriate \n2.4 Soups are evaluated for flavor, color, consistency \nand temperature related problems are identified and \naddressed \n2.5 Soups are presented at the right flavor, color, \nconsistency and temperature, in clean  service ware \nwithout drips and using suitable garnishes and \naccompaniments \n3.  Prepare sauces \nrequired for   \n     menu items \n3.1 Variety of hot and cold sauces are prepared from   \nclassical and contemporary recipes based on the \nrequired menu items \n3.2 Derivatives are made from mother sauces \n3.3 Variety of thickening agents, seasonings and \nflavorings are used  appropriately \n3.4 Sauces are evaluated for flavor, color and \nconsistency and related problems are identified and \naddressed  \n4.  Store and \nreconstitute stocks, \nsauces and soups \n4.1 Stocks, sauces and soups are stored correctly  at the \nright temperature to maintain optimum freshness and \nquality \n4.2 Stocks, sauces and soups are re-\nheated/reconstituted to appropriate standards of \nconsistency\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                41 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Stocks \nMay include but are not limited to: \n1.1 \nBeef stock- Brown/ White  \n1.2 \nChicken stock -Brown/ White \n1.3 \nFish/seafood stock \n1.4 \nVegetable stock \n2. Soups \nMay include but are not limited to: \n2.1 Clear \n2.1.1. Consommé \n2.1.2. Bouillon \n2.2 \nThick \n2.2.1. Cream \n2.2.2. Puree \n2.2.3. Chowder \n2.2.4. Bisque \n2.3 \nSpecialty soups  \n2.3.1. National/regional soups \n3. Sauces \nMay include but are not limited to: \n3.1 \nBéchamel \n3.2 \nVeloute \n3.3 \nEspagnole \n3.4 \nHollandaise  \n3.5 \nTomato \n4. Thickening agents \nMay include but are not limited to: \n4.1 \nFat and flour   \n4.1.1. Roux \n4.1.2. Beurre manie \n4.2 \nStarch - water  \n4.2.1. Slurry/white wash \n4.2.2. Starch - water \n4.3 \nLiaison \n5. Seasonings and \nflavorings \nMay include but are not limited to: \n5.1 \nBases \n5.2 \nBouillon cubes or powders \n5.3 \nFlavor enhancers \n5.4 \nInstant sauces\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                42 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate:\n1.1 Prepared a variety of stocks, soups and sauces \nfrom different recipes Identified different \nclassifications of stock, soups and sauces \n1.2 Stored and re-heated/reconstituted stocks, sauces \nand soups \n1.3 Followed safety and hygienic  practices in handling \nfood, tools and equipment\n2.  Required Knowledge 2.1 Common problems on stocks, sauces and soups \nand how to identify and rectify them \n2.2 Common cooking terms on stocks, soups and \nsauces which are used in the industry \n2.3 Appropriate substitute ingredients and food \ncomponents  \n2.4 Use of various stocks, bases, flavoring and \nseasoning agents  for a variety of soups and \nsauces \n2.5 Hygienic and sanitary principles and practices \n2.6 Logical and time efficient work flow\n3.  Required Skills\n3.1\nPrinciples and techniques of producing stocks, \nsoups and sauces according to industry standards \n3.2 Organizational skills and teamwork \n3.3 Safe work practices \n3.4 Waste minimization techniques and environment-\nfriendly practices on handling, preparation and \ndisposal of soups, stocks and sauces \n3.5 Preparation of stocks, sauces and soups within \ntypical workplace conditions including working \nwithin time constraints\n4. Resource\n   Implications \nThe following resources MUST be provided\n4.1 Access to a fully-equipped operational commercial/ \ninstitutional kitchen  \n4.2 Access to industry-realistic ratios of kitchen staff to \ncustomers \n4.3 Variety of real, suitable ingredients for stocks, \nsauces and soups\n5.  Methods of Assessme Competency may be assessed through: \n5.1 Direct observation of the candidate while making \nstocks, sauces and soups \n5.2 Demonstration of sample dishes prepared by the \ncandidate \n5.3 Written or oral questions to test candidate’s \nknowledge on sauces, soups and stocks \n5.4 Review of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate, e.g. menus\n6.  Context for  \nAssessment \n6.1   Assessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2   Assessment activities are carried out through  an  \naccredited assessment center\n",
