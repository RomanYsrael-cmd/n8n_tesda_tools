        "source_title": "PREPARE APPETIZERS",
        "source_text": "--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                43 \nUNIT OF COMPETENCY: \nPREPARE APPETIZERS  \n \nUNIT CODE \n:   TRS512329 \n \nUNIT DESCRIPTOR        : This unit deals with the skills and knowledge required in \npreparing and presenting hot and cold appetizers  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform Mise’ en \nplace  \n1.1 Tools, utensils  and equipment  are cleaned, \nsanitized and prepared based on the required tasks \n1.2 Ingredients are identified correctly, according to \nstandard recipes, or enterprise requirements \n1.3 Ingredients are assembled according to correct \nsequence, quality and specifications required \n1.4 Ingredients are prepared based on the required form \nand time frame \n1.5 Frozen ingredients are thawed following enterprise \nprocedures. \n1.6 Where necessary, raw ingredients are washed with \nclean potable water.\n2. Prepare  a range of \nappetizers \n2.1 Correct equipment are selected and used in the \nproduction of appetizers \n2.2 Appetizers are produced in accordance with \nenterprise standards \n2.3 Glazes are correctly selected and prepared, where \nrequired \n2.4 Quality trimmings and other leftovers are utilized \nwhere and when appropriate \n2.5 Appetizers are prepared, using sanitary practices  \n2.6 Appetizers are tasted and seasoned in accordance \nwith the required taste of the dishes \n2.7 Workplace safety and hygienic procedures are \nfollowed according to enterprise and legal \nrequirements \n2.8 Variety of cheese are presented and stored \naccording to enterprise standard \n \n3. Present a range of \nappetizers \n3.1 Appetizers are presented attractively according to \nenterprise standards \n3.2 Appetizers are presented using sanitary practices \n3.3 Suitable plate are selected according to enterprise \nstandards  \n3.4 Factors in plating dishes are observed in \npresenting appetizers\n4. Store appetizers  \n4.1 Quality trimmings and other leftovers are utilized \nwhere and when appropriate  \n4.2 Appetizers are kept in appropriate conditions based \non enterprise procedures \n4.3 Required food storage containers are used and \nstored in proper temperatures to maintain freshness, \nquality and taste\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                44 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Appetizers \nMay include but are not limited to: \n1.1 Hot \n1.1.1. Tapas  \n1.1.2. Hors d’ oeuvres’ \n \n1.2 Cold  \n1.2.1. Canapés \n1.2.2. Antipasto \n1.2.3. Relish \n1.2.4. Pates \n1.2.5. Terrines \n1.2.6. Cocktails \n1.2.7. Hors d’ oeuvres’ \n1.2.8. Cheeses \n \n2. Factors in plating \ndishes \n2.1 appeal \n2.2 color and contrast \n2.3 temperature of food and service     \n2.4 equipment \n2.5 classical and innovative arrangement styles\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                45 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidences that the candidate: \n1.1 \nPrepared a variety of appetizers from different \nrecipes and \n1.2 \nPrepared a variety of appetizers within a specific \ntimeframes  \n1.3 \nPresented appetizers attractively and creatively \n1.4 \nStored appetizers in accordance with enterprise \nstandards \n1.5 \nFollowed safety and hygienic practices in handling \nfood, tools and equipment\n2. Required Knowledge  \nand \nAttitude \n2.1 \nHistorical development and current trends in the \npreparation and presentation of  appetizers \n2.2 \nCommon cooking terms on appetizers which are \nused in the industry \n2.3 \nSafe work practices on using kitchen equipments \nand tools  \n2.4 \nPrinciples and practices of hygiene and sanitary \npractices \n2.5 \nLogical and time efficient work flow \n2.6 \nCheese variety, storing and handling \n \n3. Required  \nSkills \n3.1 \nAttractive presentation techniques for appetizers \n3.2 \nWaste utilization minimization techniques and \nenvironmental considerations in specific relation to \nappetizers \n3.3 \nPreparation of dishes for customers within typical \nworkplace time constraints\n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 \nAccess to a fully-equipped and commercially-\nrealistic food  preparation area with appropriate \nand industry-current equipment \n4.2 \nA variety of suitable ingredients for appetizers \n4.3\nService wares\n5. Methods for \nAssessment \nCompetency may be assessed through \n5.1 \nDirect observation of the candidate while \npreparing appetizers \n5.2 \nWritten or oral questions to test knowledge on \nappetizers and food safety issues  \n5.3 \nReview of portfolios of evidence and third party \nworkplace reports of on-the-job performance by \nthe candidate\n6. Context for \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through an  \naccredited assessment center\n",
