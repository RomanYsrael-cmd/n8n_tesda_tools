 is communicated clearly and in \nconcise   manner using appropriate \ncommunication techniques \n4.2   Relationships are established and maintained \neffectively  with colleagues \n4.3   Work activities are performed within the team to \nensure achievement of team goals\n5.   Work in socially diverse \nenvironment \n5.1    Customers and colleagues from diverse \nbackgrounds are communicated with, in all \nverbal and non-verbal forms \n5.2    Cross cultural misunderstandings are dealt with, \ntaking account of cultural consideration\n\n--- PDF PAGE 10 ---\nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                8 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Role and objective of \nteam  \n1.1. \nWork  activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement \nmaybe demonstrated on the job, either \nindividually or in a team environment \n2. Sources of information \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s \nspecifications and instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \n3.1. \nWork procedures and practices \n3.2. \nConditions of  work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, \nsafe handling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and \nquality guidelines \n4.  Appropriate \ncommunication \ntechniques  \nMay include: \n4.1    Use of active listening \n4.2    Use of both open and closed questions \n4.3    Speaking clearly and concisely \n4.4    Using appropriate language and tone of voice \n4.6    Being attentive\n\n--- PDF PAGE 11 ---\nTR – COOKERY NC II (Amended)                                           Promulgated October 2014                9 \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nOperated in a team to complete workplace activity \n1.2. \nWorked effectively with others \n1.3. \nWorked in socially diverse environment \n1.4. \nConveyed information in written or oral form \n1.5. \nSelected and used appropriate workplace language \n1.6. \nFollowed designated work plan for the job \n1.7. \nReported outcomes  \n2. Underpinning \nKnowledge  \n2.1. \nCommunication process \n2.2. \nTeam structure \n2.3. \nTeam roles \n2.4. \nGroup planning and decision making \n2.5. \nSpecific diversity issues  \n3. Underpinning \nSkills \n3.1. \nCommunicate appropriately, consistent with the culture \nof the workplace \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1. \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n4.2.     Materials relevant to the proposed activity or tasks\n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. \nObservation   of the individual member in relation to the \nwork activities of the group \n5.2. \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3.    Case studies and scenarios as a basis for discussion of   \nissues and strategies in teamwork \n6. Context for \nAssessment \n6.1. \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
