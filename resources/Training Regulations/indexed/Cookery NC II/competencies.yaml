  "source_section_text": "SECTION 1 COOKERY NC II QUALIFICATION\nThe COOKERY NC II Qualification consists of competencies that a person\nmust achieve to clean kitchen areas, prepare hot, cold meals and desserts for guests\nin various food and beverage service facilities\n\nThis Qualification is packaged from the competency map of the Tourism\nSector (Hotel and Restaurant) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\n CODE NO.\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\n CODE NO.\nCOMMON COMPETENCIES\nTRS311201\nDevelop and update industry knowledge\nTRS311202\nObserve workplace hygiene procedures\nTRS311203\nPerform computer operations\nTRS311204\nPerform workplace and safety practices\nTRS311205\nProvide effective customer service\n\nA person who has achieved this Qualification is competent to be\nemployed in any of the following positions in the Garde Manger, Pastry or in\nthe Hot Kitchen Section as:\n\n Cook or Commis\n Assistant Cook\n\nCODE NO.\nCORE COMPETENCIES\nTRS512328\nClean and maintain kitchen premises\nTRS512331\nPrepare stocks, sauces and soups\nTRS512381\nPrepare appetizers\nTRS512382\nPrepare salads and dressing\nTRS512330\nPrepare sandwiches\nTRS512383\nPrepare meat dishes\nTRS512384\nPrepare vegetables dishes\nTRS512385\nPrepare egg dishes\nTRS512386\nPrepare starch dishes\nTRS512333\nPrepare poultry and game dish(es\nTRS512334\nPrepare seafood dishes\nTRS512335\nPrepare desserts\nTRS512340\nPackage prepared food\n\n--- PDF PAGE 4 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 2"
}
