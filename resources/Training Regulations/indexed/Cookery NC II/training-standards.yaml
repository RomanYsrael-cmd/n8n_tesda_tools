Demonstration\n• Interviews/\nQuestioning\n• Observation\n\n--- PDF PAGE 82 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 80\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Clean and\nmaintain\nkitchen\npremises\n1.1\nClean, sanitize and\nstore equipment\n1.2\nClean and sanitize\npremises\n1.3\nDispose of waste\nDiscussion/\nDemonstration\nVideo viewing\n• Written\nExamination\n• Demonstration\n• Observation in\nworkplace OJT\n2. Prepare stocks,\nsauces and\nsoups\n2.1 Prepare stocks,\nglazes and\nessences required\nfor menu items\n2.2 Prepare soups\nrequired for menu\nitems\n2.3 Prepare sauces\nrequired for menu\nitems\n2.4 Store and\nreconstitute\nstocks, sauces and\nsoups\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n3. Prepare\nappetizers\n3.1 Perform Mise’ en\nplace\n3.2 Prepare a range\nof appetizers\n3.3 Present a range of\nappetizers\n3.4 Store appetizers\nDiscussion/\nDemonstration\nVideo viewing\n\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n4. Prepare salads\nand dressings\n4.1 Perform Mise en\nplace\n4.2 Prepare a variety\nsalads and\ndressings\n4.3 Present a variety\nof salads and\ndressings\n4.4 Store salads and\ndressings\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n5. Prepare\nsandwiches\n5.1 Perform Mise en\nplace\n5.2 Prepare a variety\nof sandwiches\n5.3 Present a variety\nof sandwiches\n5.4 Store sandwiches\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n\n--- PDF PAGE 83 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 81\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Prepare meat\ndishes\n6.1 Perform Mise en\nplace\n6.2 Cook meat cuts for\nservice\n6.3 Present meat cuts\nfor service\n6.4\nStore meat\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n7. Prepare\nvegetables\ndishes\n7.1\nPerform Mise en\nplace\n7.2\nPrepare vegetable\ndishes\n7.3\nPresent vegetable\ndishes\n7.4\nStore vegetables\ndishes\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n8. Prepare egg\ndishes\n8.1\nPerform Mise en\nplace\n8.2\nPrepare and cook\negg dishes\n8.3\nPresent egg\ndishes\n8.4\nStore egg dishes\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n9. Prepare starch\ndishes\n9.1\nPerform Mise en\nplace\n9.2\nPrepare starch\ndishes\n9.3\nPresent Starch\ndishes\n9.4\nStore Starch\ndishes\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n10. Prepare poultry\nand game\ndishes\n10.1 Perform mise en\nplace\n10.2 Cook poultry and\ngame dishes\n10.3 Plate/present\npoultry and game\ndishes\n10.4 Store poultry and\ngame\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n11. Prepare\nseafood dishes\n11.1 Perform mise en\nplace\n11.2 Handle fish and\nseafood\n11.3 Cook fish and\nshellfish\n11.4 Plate/Present fish\nand seafood\n11.5 Store fish and\nseafood\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n\n--- PDF PAGE 84 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 82\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n12. Prepare\ndesserts\n12.1 Perform mise en\nplace\n12.2 Prepare desserts\nand sweet sauces\n12.3 Plate/Present\ndesserts\n12.4 Store desserts\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n13. Package\nprepared food\n13.1 Select packaging\nmaterials\n13.2 Package food\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT",
