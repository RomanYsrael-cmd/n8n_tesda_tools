s\nGlass rack\n\n12\npcs\nSoup cup rack\n\n12\npcs\nPlate rack\n\n8\npcs\nBaking tray, small\n\n12\npcs\nUtility\ntray,stainless\n\n4\npcs\nRoasting pan\n\nNOTE: Implementation of the training program can be made possible through a\nMOA between the Training school and Industry for the use of the facilities.\nThis is in response to the school limitation on the high cost of equipment.\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq.\nMeters\n\nTotal Area in Sq.\nMeters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n(8 x 5 m.)x2\n(40sq.m.)x2\n\n(40 sq. m).x2\nLaboratory\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n36 sq. m.\nTotal workshop area:\n156 sq. m. +40sq.m.\n\n--- PDF PAGE 90 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 88\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM (HOTEL AND\nRESTAURANT) SECTOR\n\nCOOKERY NC II\n\nTRAINER QUALIFICATION I (TQ II)\n\n• Must be a holder of Cookery NC II or Commercial Cooking NC III\n• Must be a holder of National TVET Trainer’s Certificate (NTTC) I in\nCookery NC II\n• Must be physically, mentally fit and holder of a Health Certificate\n(hepatitis-free or free of any communicable disease)\n• Must have at least 3 years job/industry experience. (Preferably on\nsupervisory/managerial level in cookery or commercial cooking)\n\n 3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine\ntheir achievement of units of competency. A certificate of achievement\nis issued for each unit of competency.\n\n--- PDF PAGE 91 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 89"
