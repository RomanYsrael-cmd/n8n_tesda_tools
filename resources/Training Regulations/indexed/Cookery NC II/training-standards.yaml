      "source_text": "3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course\nshould possess the following requirements:\n\n• can communicate both in oral and written;\n• physically and mentally fit;\n• with good moral character; and\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such\nas educational attainment, appropriate work experience, and\nothers that may be required of the trainees by the school or training\ncenter delivering the TVET program."
