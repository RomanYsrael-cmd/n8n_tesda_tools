    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: COOKERY\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n 18 Hrs. (Common)\n\n 280 Hrs. (Core)\n\n 316 Hrs.\nCourse Description:\n\nThe COOKERY NC II Qualification consists of competencies that a person\nmust achieve to clean kitchen areas, cook/prepare hot, cold meals and desserts for\nguests in various food and beverage service facilities\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and\nconvey workplace\ninformation\n1.2 Speak English at\na basic\noperational level\n1.3 Complete\nrelevant work\nrelated\ndocuments\n1.4 Participate in\nworkplace\nmeeting and\ndiscussion\nGroup\nDiscussion\nInteraction\nPractice session\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility\nin a team\n2.2 Describe work as\na team member\n2.3 Work effectively\nwith colleagues\n2.4 Work in socially\ndiverse\nenvironment\nDiscussion\nInteraction\nSimulation\nGames\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 80 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 78\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives with\norganizational\ngoals\n3.2 Set and meet\nwork priorities\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\nDiscussion\nInteraction\nRole play\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational health\nand safety\n4.1 Evaluate hazard\nand risks\n4.2 Control hazards\nand risks\n4.3 Maintain\noccupational\nhealth and\nsafety\nawareness\n4.4 Perform basic\nfirst-aid\nprocedures\nLecture-\nDiscussion\nCase study\nPlant tour\nSymposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning