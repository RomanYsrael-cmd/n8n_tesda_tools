  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs COOKERY NC II.\n\nThey include information on curriculum design, training delivery, trainee entry\nrequirements, tools and equipment, training facilities, and trainers qualifications,\namong others.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: COOKERY\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n 18 Hrs. (Common)\n\n 280 Hrs. (Core)\n\n 316 Hrs.\nCourse Description:\n\nThe COOKERY NC II Qualification consists of competencies that a person\nmust achieve to clean kitchen areas, cook/prepare hot, cold meals and desserts for\nguests in various food and beverage service facilities\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and\nconvey workplace\ninformation\n1.2 Speak English at\na basic\noperational level\n1.3 Complete\nrelevant work\nrelated\ndocuments\n1.4 Participate in\nworkplace\nmeeting and\ndiscussion\nGroup\nDiscussion\nInteraction\nPractice session\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility\nin a team\n2.2 Describe work as\na team member\n2.3 Work effectively\nwith colleagues\n2.4 Work in socially\ndiverse\nenvironment\nDiscussion\nInteraction\nSimulation\nGames\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 80 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 78\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate\npersonal\nobjectives with\norganizational\ngoals\n3.2 Set and meet\nwork priorities\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment\nDiscussion\nInteraction\nRole play\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational health\nand safety\n4.1 Evaluate hazard\nand risks\n4.2 Control hazards\nand risks\n4.3 Maintain\noccupational\nhealth and\nsafety\nawareness\n4.4 Perform basic\nfirst-aid\nprocedures\nLecture-\nDiscussion\nCase study\nPlant tour\nSymposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and update\nindustry knowledge\n1.1 Seek\ninformation on\nthe industry\n1.2 Update\ncontinuously\nrelevant industry\nknowledge\n1.3 Develop and\nupdate local\nknowledge\n1.4 Promote\nproducts and\nservices to\ncustomers\nLecture\nGroup\nDiscussion\nIndividual/Group\nAssignment\n\nField visit\nVideo\npresentation\n•Interviews/\nQuestioning\n• Individual/Group\nProject or Report\n2. Observe workplace\nhygiene procedures\n2.1 Follow hygiene\nprocedures\n2.2 Identify and\nprevent hygiene\nrisk\nLecture\nDemonstration\nRole-play\n\nCase study\n•Demonstration\n• Written\nExamination\n• Interviews/\nQuestioning\n\n--- PDF PAGE 81 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 79\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Perform computer\noperations\n3.1 Plan and prepare\ntask to be\nundertaken\n3.2 Input data into a\ncomputer\n3.3 Assess\ninformation using\ncomputer\n3.4 Produce/ output\ndata using\ncomputer system\n3.5 Maintain\ncomputer system\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\nDemonstration\n\nPractice session\n•Interviews/\nQuestioning\n• Practical\nDemonstration\n• Observation\n4. Perform workplace\nand safety practices\n4.1 Practice\nworkplace\nprocedures for\nhealth, safety and\nsecurity practices\n4.2 Perform child\nprotection duties\nrelevant to the\ntourism industry\n4.3 Observe and\nmonitor people\n4.4 Deal with\nemergency\nsituations\n4.5 Maintain safe\npersonal\npresentation\nstandards\n4.6 Maintain a safe\nand secure\nworkplace\nLecture\nDemonstration\nRole-play\nSimulation\n•Demonstration\n• Interviews/\nQuestioning\n• Written\nExamination\n5. Provide effective\ncustomer service\n5.1 Greet customers\n5.2 Identify customer\n5.3 Deliver service to\ncustomer\n5.6 Handle queries\nthrough use of\ncommon business\ntools and\ntechnology\n5.5 Handle\ncomplaints/\nconflict situations,\nevaluation and\nrecommendations\nLecture\nDemonstration\nRole-play\nSimulation\n•Demonstration\n• Interviews/\nQuestioning\n• Observation\n\n--- PDF PAGE 82 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 80\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Clean and\nmaintain\nkitchen\npremises\n1.1\nClean, sanitize and\nstore equipment\n1.2\nClean and sanitize\npremises\n1.3\nDispose of waste\nDiscussion/\nDemonstration\nVideo viewing\n• Written\nExamination\n• Demonstration\n• Observation in\nworkplace OJT\n2. Prepare stocks,\nsauces and\nsoups\n2.1 Prepare stocks,\nglazes and\nessences required\nfor menu items\n2.2 Prepare soups\nrequired for menu\nitems\n2.3 Prepare sauces\nrequired for menu\nitems\n2.4 Store and\nreconstitute\nstocks, sauces and\nsoups\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n3. Prepare\nappetizers\n3.1 Perform Mise’ en\nplace\n3.2 Prepare a range\nof appetizers\n3.3 Present a range of\nappetizers\n3.4 Store appetizers\nDiscussion/\nDemonstration\nVideo viewing\n\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n4. Prepare salads\nand dressings\n4.1 Perform Mise en\nplace\n4.2 Prepare a variety\nsalads and\ndressings\n4.3 Present a variety\nof salads and\ndressings\n4.4 Store salads and\ndressings\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n5. Prepare\nsandwiches\n5.1 Perform Mise en\nplace\n5.2 Prepare a variety\nof sandwiches\n5.3 Present a variety\nof sandwiches\n5.4 Store sandwiches\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n\n--- PDF PAGE 83 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 81\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Prepare meat\ndishes\n6.1 Perform Mise en\nplace\n6.2 Cook meat cuts for\nservice\n6.3 Present meat cuts\nfor service\n6.4\nStore meat\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n7. Prepare\nvegetables\ndishes\n7.1\nPerform Mise en\nplace\n7.2\nPrepare vegetable\ndishes\n7.3\nPresent vegetable\ndishes\n7.4\nStore vegetables\ndishes\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n8. Prepare egg\ndishes\n8.1\nPerform Mise en\nplace\n8.2\nPrepare and cook\negg dishes\n8.3\nPresent egg\ndishes\n8.4\nStore egg dishes\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n9. Prepare starch\ndishes\n9.1\nPerform Mise en\nplace\n9.2\nPrepare starch\ndishes\n9.3\nPresent Starch\ndishes\n9.4\nStore Starch\ndishes\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n10. Prepare poultry\nand game\ndishes\n10.1 Perform mise en\nplace\n10.2 Cook poultry and\ngame dishes\n10.3 Plate/present\npoultry and game\ndishes\n10.4 Store poultry and\ngame\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n11. Prepare\nseafood dishes\n11.1 Perform mise en\nplace\n11.2 Handle fish and\nseafood\n11.3 Cook fish and\nshellfish\n11.4 Plate/Present fish\nand seafood\n11.5 Store fish and\nseafood\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n\n--- PDF PAGE 84 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 82\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n12. Prepare\ndesserts\n12.1 Perform mise en\nplace\n12.2 Prepare desserts\nand sweet sauces\n12.3 Plate/Present\ndesserts\n12.4 Store desserts\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n13. Package\nprepared food\n13.1 Select packaging\nmaterials\n13.2 Package food\nDiscussion/\nDemonstration\nVideo viewing\n•\nWritten\nexamination\n•\nDemonstration\n•\nObservation in\nworkplace OJT\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the\ncurriculum. Delivery should be guided by the 10 basic principles of\ncompetency-based TVET.\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing\nRules and Regulations\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer just facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners\n\n--- PDF PAGE 85 ---\nTR – COOKERY NC II (Amended) Promulgated October 2014 83\n\n• Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer\ntechnologies\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course\nshould possess the following requirements:\n\n• can communicate both in oral and written;\n• physically and mentally fit;\n• with good moral character; and\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such\nas educational attainment, appropriate work experience, and\nothers that may be required of the trainees by the school or training\ncenter delivering the TVET program.\n\n 3.4\nLIST OF TOOLS AND EQUIPMENT\n\nCOOKERY – NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum\nof 25 trainees for COOKERY NC II are as follows:\nTOOLS\nOFFICE EQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\nMEAT\n10\npcs\nChef’s knife\n1unit Electric fan\n\nBeef\n8\npcs\nBoning knife\n3 unit\nFirst aid cabinet\n\nPork\n4\npcs\nOysters knife\n1 unit\nFiling cabinet 3\nLayers compartment\n\nLamb/mutton\n2\npcs\nCleaver knife\n1 unit\nTV\n\nVeal\n8\npcs\nTenderizer,\nmediu