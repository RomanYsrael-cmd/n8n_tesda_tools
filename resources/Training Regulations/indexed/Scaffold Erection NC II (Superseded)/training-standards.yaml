      "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Scaffold Erection Level: NC II\n\nNominal Training Duration: 162 Hours\n\nCourse Description:\nThis course is designed to develop knowledge, skills and desirable work\nattitude along scaffold erection. It covers the basic, common and core\ncompetencies, e. g., erecting and dismantling scaffolding and handling scaffolding\nequipment and tools.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 53 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 51\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 54 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 52\n\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and tools\n1.1 Identify Materials\n1.2 Requisition Materials\n1