    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Scaffold Erection NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Scaffold Erection Level: NC II\n\nNominal Training Duration: 162 Hours\n\nCourse Description:\nThis course is designed to develop knowledge, skills and desirable work\nattitude along scaffold erection. It covers the basic, common and core\ncompetencies, e. g., erecting and dismantling scaffolding and handling scaffolding\nequipment and tools.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 53 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 51\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 54 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 52\n\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and tools\n1.1 Identify Materials\n1.2 Requisition Materials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n2. Observe\nprocedures,\nspecifications and\nmanuals of\ninstructions\n2.1 Identify and access\nspecification/\nmanuals\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n3. Perform\nmensuration and\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 55 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 53\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Maintain tools and\nequipment\n4.1 Check condition of\ntools and equipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Sharpen edge and\ntooth cutting tools\n4.4 Store tools and\nequipment\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation of\napplication of\ntasks\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Read / Interpret\nblueprints and plans\n5.2 Perform freehand\n sketching\nLecture\nDemonstration\nPractical\nexercises\nDemonstration and\noral questioning\nWritten test\n\n--- PDF PAGE 56 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 54\n\nCORE COMPETENCIES\n(120 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Handle\nscaffolding\ntools and\nequipment\n1.1 Plan and prepare for\noperation\n1.2 Handle, sort and\nstack scaffolding\nequipment and\nassociated tools\n1.3 Prepare for\nmechanical handling\nof equipment\n1.4 Clean up\n\n• Lecture /\ndiscussion\n• Demonstration\n\n• Observation of\npractical skills\n• Written test\n• Oral questioning\n2. Erect and\ndismantle\nscaffolding\n2.1 Plan and prepare for\noperation\n2.2 Erect scaffolding\ninspect, repair and /\nor alter scaffolding\n2.3 Dismantle\nscaffolding and\nclean up\n\n• Lecture /\ndiscussion\n• Demonstration\n\n• Observation of\npractical skills\n• Written test\n• Oral questioning\n\n--- PDF PAGE 57 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 55\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET:\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach\nin training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\n--- PDF PAGE 58 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 56\n\n• Distance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin the same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• Good moral character\n• Ability to communicate\n• Physically fit and mentally healthy\n• Can perform basic mathematical computation and mensuration.\n\n--- PDF PAGE 59 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 57\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR SCAFFOLD ERECTION\nNC II\n\n TOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25 pcs.\nHammer (claw)\n1 set Scaffolding frame\ntype\n25 pcs. Hard hat\n25 pcs.\nCombination wrench\n1 set\nScaffolding tubular\ntype\n25\npairs\nSafety shoes\n5 pcs.\nPull push rule\n1 set\nScaffolding tube\nand fittings type\n25 pcs. Safety belt\n5 pcs.\nLevel bar\n4 pcs. Pulley with hook\n25\npairs\nGloves (leather)\n5 pcs.\nPlumb bob\n\n1 roll\nRope\n\n3.5 TRAINING FACILITIES\n\nThe training facility is based on the size of class of 25 students / trainees.\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nContextual Learning\nLaboratory / Lecture Room\n\n20\n20\nLearning Resource\nCenter\n\n20\n20\nTool Room/Storage\n\n10\n10\nWash room\n\n10\n10\nCirculation area\n\n60\n60\nTraining ground\n\n200\n200\n\nTOTAL AREA\n\n320\n\n--- PDF PAGE 60 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 58\n\n3.6 TRAINER’S QUALIFICATION FOR SCAFFOLD ERECTION NC II\n\n• Must have undergone training on Training Methodology II (TM II) or\nequivalent in training/experience\n• Must be a holder of National Certificate Level II or its equivalent\n• Good moral character\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have 1 year industry experience and/or teaching experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 61 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 59"
