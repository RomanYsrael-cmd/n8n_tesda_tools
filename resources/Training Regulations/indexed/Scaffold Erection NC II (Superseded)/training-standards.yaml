    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Scaffold Erection Level: NC II\n\nNominal Training Duration: 162 Hours\n\nCourse Description:\nThis course is designed to develop knowledge, skills and desirable work\nattitude along scaffold erection. It covers the basic, common and core\ncompetencies, e. g., erecting and dismantling scaffolding and handling scaffolding\nequipment and tools.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 53 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 51\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 54 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 52\n\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and tools\n1.1 Identify Materials\n1.2 Requisition Materials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n2. Observe\nprocedures,\nspecifications and\nmanuals of\ninstructions\n2.1 Identify and access\nspecification/\nmanuals\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n3. Perform\nmensuration and\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 55 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 53\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Maintain tools and\nequipment\n4.1 Check condition of\ntools and equipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Sharpen edge and\ntooth cutting tools\n4.4 Store tools and\nequipment\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation of\napplication of\ntasks\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Read / Interpret\nblueprints and plans\n5.2 Perform freehand\n sketching\nLecture\nDemonstration\nPractical\nexercises\nDemonstration and\noral questioning\nWritten test\n\n--- PDF PAGE 56 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 54\n\nCORE COMPETENCIES\n(120 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Handle\nscaffolding\ntools and\nequipment\n1.1 Plan and prepare for\noperation\n1.2 Handle, sort and\nstack scaffolding\nequipment and\nassociated tools\n1.3 Prepare for\nmechanical handling\nof equipment\n1.4 Clean up\n\n• Lecture /\ndiscussion\n• Demonstration\n\n• Observation of\npractical skills\n• Written test\n• Oral questioning\n2. Erect and\ndismantle\nscaffolding\n2.1 Plan and prepare for\noperation\n2.2 Erect scaffolding\ninspect, repair and /\nor alter scaffolding\n2.3 Dismantle\nscaffolding and\nclean up\n\n• Lecture /\ndiscussion\n• Demonstration\n\n• Observation of\npractical skills\n• Written test\n• Oral questioning\n\n--- PDF PAGE 57 ---\nSCAFFOLD ERECTION NC II Promulgated July 2007 55"
  },
