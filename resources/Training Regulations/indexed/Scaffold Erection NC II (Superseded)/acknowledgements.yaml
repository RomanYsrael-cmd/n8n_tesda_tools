    },
    {
      "source_text": "UNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT UNIT CODE : 500311106 UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to identify role and responsibility as a member of a team."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "1. Describe team role and scope 1.1 The role and objective of the team is identified from available sources of information 1.2 Team parameters, reporting relationships and responsibilities are identified from team discussions and appropriate external sources"
    },
    {
      "source_text": "2. Identify own role and responsibility within team 2.1 Individual role and responsibilities within the team environment are identified 2.2 Roles and responsibility of other team members are identified and recognized 2.3 Reporting relationships within team and external to team are identified"
    },
    {
      "source_text": "3. Work as a team member 3.1 Effective and appropriate forms of communications used and interactions undertaken with team members who contribute to known team activities and objectives 3.2 Effective and appropriate contributions made to complement team activities and objectives, based on individual skills and competencies and workplace context 3.3 Observed protocols in reporting using standard operating procedures 3.4 Contribute to the development of teamwork plans based on an understanding of team’s role and objectives and individual competencies of the members."
    },
    {
      "source_text": "-- PDF PAGE 9 --- SCAFFOLD ERECTION NC II Promulgated July 2007 7"
    },
    {
      "source_text": "RANGE OF VARIABLES VARIABLE RANGE 1. Role and objective of team 1.1 Work activities in a team environment with enterprise or specific sector 1.2 Limited discretion, initiative and judgement maybe demonstrated on the job, either individually or in a team environment"
    },
    {
      "source_text": "2. Sources of information 2.1 Standard operating and/or other workplace procedures 2.2 Job procedures 2.3 Machine/equipment manufacturer’s specifications and instructions 2.4 Organizational or external personnel 2.5 Client/supplier instructions 2.6 Quality standards 2.7 OHS and environmental standards"
    },
    {
      "source_text": "3. Workplace context 3.1 Work procedures and practices 3.2 Conditions of work environments 3.3 Legislation and industrial agreements 3.4 Standard work practice including the storage, safe handling and disposal of chemicals 3.5 Safety, environmental, housekeeping and quality guidelines"
    },
    {
      "source_text": "-- PDF PAGE 10 --- SCAFFOLD ERECTION NC II Promulgated July 2007 8"
    },
    {
      "source_text": "EVIDENCE GUIDE 1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Demonstrates ability to operate in a team to complete workplace activity 1.2 Demonstrates ability to work effectively with others 1.3 Demonstrates ability to convey information in written or oral form 1.4 Demonstrates ability to select and use appropriate workplace language 1.5 Demonstrates ability to follow designated work plan for the job 1.6 Demonstrates ability to report outcomes"
