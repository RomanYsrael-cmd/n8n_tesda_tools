    },
    {
      "source_text": "2. Requisition materials"
    },
    {
      "source_text": "2.1 Materials and tools needed are requested according to the list prepared 2.2 Request is done as per company standard operating procedures (SOP) 2.3 Substitute materials and tools are provided without sacrificing cost and quality of work"
