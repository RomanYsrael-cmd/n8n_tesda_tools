      "source_text": "3.6 TRAINER’S QUALIFICATION FOR SCAFFOLD ERECTION NC II"
    },
    {
      "source_text": "Must have undergone training on Training Methodology II (TM II) or equivalent in training/experience"
    },
    {
      "source_text": "Must be a holder of National Certificate Level II or its equivalent"
    },
    {
      "source_text": "Good moral character"
    },
    {
      "source_text": "Must be computer literate"
    },
    {
      "source_text": "Must be physically and mentally fit"
    },
    {
      "source_text": "*Must have 1 year industry experience and/or teaching experience"
    },
    {
      "source_text": "Optional. Only when required by the hiring institution Reference: TESDA Board Resolution No. 2004-03"
    },
    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional assessment is undertaken by trainees to determine their achievement of units of competency. A certificate of achievement is issued for each unit of competency."
    },
    {
      "source_text": "-- PDF PAGE 61 --- SCAFFOLD ERECTION NC II Promulgated July 2007 59"
    },
    {
      "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1. To attain the National Qualification of Scaffolding Erection NC II, the candidate must demonstrate competence through project-type assessment covering all the units listed in Section 1. Successful candidates shall be awarded National Certificates signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 The qualification of SCAFFOLD ERECTION NC II can be attained through demonstration of competence in a project-type assessment covering the following core units."
    },
    {
      "source_text": "4.1.1 Erect and dismantle scaffolding 4.1.2 Handle scaffolding equipment and tools"
    },
    {
      "source_text": "4.3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.4. The following are qualified to apply for assessment and certification:"
    },
    {
      "source_text": "4.3.1 Graduates of formal, non-formal and informal including enterprise-based training programs"
    },
    {
      "source_text": "4.4.2. Experienced Workers (wage employed or self-employed)"
    },
    {
      "source_text": "4.5. The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and the Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)."
    },
