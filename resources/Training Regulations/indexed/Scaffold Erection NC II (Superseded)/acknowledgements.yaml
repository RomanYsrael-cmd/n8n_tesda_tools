    {
      "source_text": "TRAINING REGULATIONS FOR SCAFFOLD ERECTION NC II"
    },
    {
      "source_text": "SECTION 1 SCAFFOLD ERECTION NC II QUALIFICATION"
    },
    {
      "source_text": "The Scaffold Erection NC II Qualification consists of competencies that individuals must achieve to enable them to erect and dismantle scaffolding and safely handle scaffolding tools and equipment."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of the Construction sector as shown in Annex A."
    },
    {
      "source_text": "The Units of Competency comprising this Qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES"
    },
    {
      "source_text": "Units of Competency 500311105 Participate in workplace communication 500311106 Work in a team environment 500311107 Practice career professionalism 500311108 Practice occupational health and safety procedures"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES"
    },
    {
      "source_text": "Units of Competency CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311202 Interpret technical drawings and plans CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES"
    },
    {
      "source_text": "Units of Competency CON713339 Erect and dismantle scaffolding CON713340 Handle scaffolding equipment and tools"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a:"
    },
    {
      "source_text": "❑ Scaffold Erector"
    },
    {
      "source_text": "-- PDF PAGE 4 --- SCAFFOLD ERECTION NC II Promulgated July 2007 2"
    },
    {
      "source_text": "SECTION 2 COMPETENCY STANDARDS"
    },
    {
      "source_text": "This section gives the details of the contents of the basic, common and core units of competency required in SCAFFOLD ERECTION NC II."
    },
    {
      "source_text": "BASIC COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY: PARTICIPATE IN WORKPLACE COMMUNICATION UNIT CODE : 500311105 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to gather, interpret and convey information in response to workplace requirements."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "1. Obtain and convey workplace information 1.1 Specific and relevant information is accessed from appropriate sources 1.2 Effective questioning , active listening and speaking skills are used to gather and convey information 1.3 Appropriate medium is used to transfer information and ideas 1.4 Appropriate non- verbal communication is used 1.5 Appropriate lines of communication with supervisors and colleagues are identified and followed 1.6 Defined workplace procedures for the location and storage of information are used 1.7 Personal interaction is carried out clearly and concisely"
    },
    {
      "source_text": "2. Participate in workplace meetings and discussions 2.1 Team meetings are attended on time 2.2 Own opinions are clearly expressed and those of others are listened to without interruption 2.3 Meeting inputs are consistent with the meeting purpose and established protocols 2.4 Workplace interactions are conducted in a courteous manner 2.5 Questions about simple routine workplace procedures and maters concerning working conditions of employment are asked and responded to 2.6 Meetings outcomes are interpreted and implemented"
    },
    {
      "source_text": "-- PDF PAGE 5 --- SCAFFOLD ERECTION NC II Promulgated July 2007 3"
    },
    {
      "source_text": "3. Complete relevant work related documents 3.1 Range of forms relating to conditions of employment are completed accurately and legibly 3.2 Workplace data is recorded on standard workplace forms and documents 3.3 Basic mathematical processes are used for routine calculations 3.4 Errors in recording information on forms/ documents are identified and properly acted upon 3.5 Reporting requirements to supervisor are completed according to organizational guidelines"
    },
    {
      "source_text": "-- PDF PAGE 6 --- SCAFFOLD ERECTION NC II Promulgated July 2007 4"
    },
    {
      "source_text": "RANGE OF VARIABLES VARIABLE RANGE 1. Appropriate sources 1.1 Team members 1.2 Suppliers 1.3 Trade personnel 1.4 Local government 1.5 Industry bodies"
    },
    {
      "source_text": "2. Medium 2.1 Memorandum 2.2 Circular 2.3 Notice 2.4 Information discussion 2.5 Follow-up or verbal instructions 2.6 Face to face communication"
    },
    {
      "source_text": "3. Storage 3.1 Manual filing system 3.2 Computer-based filing system"
    },
    {
      "source_text": "4. Forms 4.1 Personnel forms, telephone message forms, safety reports"
    },
    {
      "source_text": "5. Workplace interactions 5.1 Face to face 5.2 Telephone 5.3 Electronic and two way radio 5.4 Written including electronic, memos, instruction and forms, non-verbal including gestures, signals, signs and diagrams"
    },
    {
      "source_text": "6. Protocols 6.1 Observing meeting 6.2 Compliance with meeting decisions 6.3 Obeying meeting instructions"
    },
    {
      "source_text": "-- PDF PAGE 7 --- SCAFFOLD ERECTION NC II Promulgated July 2007 5"
    },
    {
      "source_text": "EVIDENCE GUIDE 1. Critical Aspects of Competency Assessment requires evidence that the candidate: 1.1 Demonstrates ability to prepare written communication following standard format of the organization 1.2 Demonstrates ability to access information using communication equipment 1.3 Made use of relevant terms as an aid to transfer information effectively 1.4 Conveyed information effectively adopting the formal or informal communication"
    },
    {
      "source_text": "2. Underpinning Knowledge and Attitudes"
    },
    {
      "source_text": "2.1 Effective communication 2.2 Different modes of communication 2.3 Written communication 2.4 Organizational policies 2.5 Communication procedures and systems 2.6 Technology relevant to the enterprise and the individual’s work responsibilities 3. Underpinning Skills 3.1 Follow simple spoken language 3.2 Perform routine workplace duties following simple written notices 3.3 Participate in workplace meetings and discussions 3.4 Complete work related documents 3.5 Estimate, calculate and record routine workplace measures 3.6 Basic mathematical processes of addition, subtraction, division and multiplication 3.7 Ability to relate to people of social range in the workplace 3.8 Gather and provide information in response to workplace requirements"
    },
    {
      "source_text": "4. Resource Implications 4.1 Fax machine 4.2 Telephone 4.3 Writing materials 4.4 Internet"
    },
    {
      "source_text": "5. Methods of Assessment 5.1 Direct Observation 5.3 Oral interview and written test 6. Context of Assessment 6.1 Competency may be assessed individually in the actual workplace or through accredited institution"
    },
