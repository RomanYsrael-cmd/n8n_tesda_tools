    {
      "source_text": "3. Receive and inspect materials 3.1 Materials and tools issued are inspected as per quantity and specification 3.2 Tools, accessories and materials are checked for damages according to enterprise procedures 3.3 Materials and tools are set aside to appropriate location nearest to the workplace"
