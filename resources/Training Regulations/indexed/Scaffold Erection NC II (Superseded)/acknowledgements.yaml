    {
      "source_text": "UNIT OF COMPETENCY: PREPARE CONSTRUCTION MATERIALS AND TOOLS UNIT CODE : CON931201 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on identifying, requesting and receiving construction materials and tools based on the required performance standards."
