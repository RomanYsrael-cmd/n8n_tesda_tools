      "source_text": "DEFINITION OF TERMS"
    },
    {
      "source_text": "1. Competency Is the application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace."
    },
    {
      "source_text": "2. Certification Refers to the process of verifying and validating competencies of a person through assessment."
    },
    {
      "source_text": "3. Element Refers to the building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in a particular area of work is able to perform."
    },
    {
      "source_text": "4. Evidence Guide It is a guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment method."
    },
    {
      "source_text": "5. Footing Refers to the widened base or substructure forming the foundation for a wall or a column"
    },
    {
      "source_text": "6. Philippine TVET Qualification Framework Refers to a comprehensive, nationally consistent framework for qualifications in the TVET sector. It also provides the parameter for the integration of learning and assessment in the middle skills development."
    },
    {
      "source_text": "7. Qualification Refers to the national certificate issued by the TESDA or its accredited industry organizations in recognition that a person has achieved competencies relevant to a trade or industry."
    },
    {
      "source_text": "8. Range of Variable It describes the circumstances or context in which the work is to be performed."
    },
    {
      "source_text": "9. Scaffolding It is a temporary or movable platform supported on the ground or suspended; used for working at considerable heights above ground. 10. Static line It is a line attached to parachute pack and to a strap or anchor cable in an aircraft so that when the load is dropped the parachute is deployed automatically."
    },
    {
      "source_text": "11. Transom Is a window above door that is flat, vertical aft end of a ship or boat as distinguished from a candle-shaped or cruiser stern"
    },
    {
      "source_text": "12. Unit of Competency Refers to a discrete aspect of work, which would normally be performed by only one person."
    },
