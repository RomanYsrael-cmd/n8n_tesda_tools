      "source_text": "CORE COMPETENCIES"
    },
    {
      "source_text": "UNIT OF COMPETENCY : ERECT AND DISMANTLE SCAFFOLDING UNIT CODE : CON 713 339 UNIT DESCRIPTOR : This unit describes the knowledge, skills and attitudes for scaffold erection and dismantling, particularly planning and preparing for work; doing operational check; and effective erection and dismantling of scaffolds. This is in order to provide work platforms, edge protection and access ways in accordance with industry standards. ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "1. Plan and prepare for operation 1.1 Occupational Safety and Health Standards (OSHS) requirements consistent to erect and dismantle scaffolding are verified and complied with 1.2 Site access and emergency routes are identified and confirmed 1.3 Work instruction is reviewed, confirmed and clarified with appropriate personnel 1.4 Operation to erect and dismantle scaffolding is determined and planned in line with job and site requirements 1.5 Purpose of scaffolding is confirmed and associated activities are identified 1.6 Equipment is selected in accordance with work requirements 1.7 Environmental protection measures are identified in line with environmental plan and regulations 1.8 Communication with others is established and maintained in accordance with OSHS requirements"
    },
    {
      "source_text": "-- PDF PAGE 40 --- SCAFFOLD ERECTION NC II Promulgated July 2007 38"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA 2. Erect scaffolding 2.1 Design loading on scaffold and supporting structure is confirmed using load tables following limits, standards and specifications 2.2 Scaffolding and components are inspected with damaged components are isolated, labeled, tagged and rejected 2.3 Footings are prepared in accordance with OSHS requirements, codes of practice, manufacturer specifications and engineer's instructions 2.4 Scaffolding is set out and erected in accordance with OSHS requirements and manufacturer specifications 2.5 Lifting devices are assembled and erected in accordance with manufacturer specifications and OSHS requirements 2.6 Fall protection devices are installed in accordance with job specification and OSHS requirements"
    },
    {
      "source_text": "3. Inspect, repair and / or alter scaffolding 3.1 Erected scaffolding is inspected for defects prior to use 3.2 Faulty components are reported to appropriate personnel in line with company safe operating procedure 3.3 Existing use of scaffolding is checked against original design to be in accordance with OSHS regulations 3.4 Scaffolding instability is reported to appropriate personnel in line with company safe operating procedure 3.5 Alterations and repairs are carried out on specified equipment following superior’s instruction to ensure regulatory compliance 3.6 Scaffolding checklist report is accomplished and submitted to appropriate personnel following company rules and regulations"
    },
    {
      "source_text": "-- PDF PAGE 41 --- SCAFFOLD ERECTION NC II Promulgated July 2007 39"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA 4. Dismantle scaffolding and clean up 4.1 Scaffolding is isolated and safety signs and barricades are put in place to ensure safe dismantling 4.2 Scaffolding is dismantled using reverse procedure as for erection 4.3 Work area is cleared and materials disposed of, re- used or recycled in accordance with OSHS requirements, codes of practice and job specifications 4.4 Tools and equipment are cleaned, checked, maintained and stored in accordance with manufacturer recommendations and standard work practices 4.5 Work completion procedures are applied and appropriate personnel notified of work completion 4.6 Advanced scaffolding operations and faults are recorded and reported to the appropriate personnel"
    },
    {
      "source_text": "-- PDF PAGE 42 --- SCAFFOLD ERECTION NC II Promulgated July 2007 40"
    },
    {
      "source_text": "RANGE OF VARIABLES VARIABLE RANGE 1. Scaffolding"
    },
    {
      "source_text": "May include but not be limited to: 1.1 Traveling 1.2 Suspended 1.3 Cantilever, jib, figure and bracket 1.4 Skips, brackets, boatswain chair 1.5 Ladderjack 1.6 Trestle 1.7 Outrigger 1.8 Bamboo"
    },
    {
      "source_text": "2. Appropriate personnel May include but not be limited to: 2.1 Leadman / Foreman 2.2 Supervisor 2.3 Engineer 2.4 Safety officer"
    },
    {
      "source_text": "3. Associated activities May include but are not limited to the provision of: 3.1 Work platform 3.2 Edge protection 3.3 Access ways 3.3.1 Falsework 3.3.2 Grandstands 3.3.3 Stages 3.3.4 Covered walkways 3.4 Debris net 3.5 Debris guard"
    },
    {
      "source_text": "4. Equipment May include but not be limited to: 4.1 Frame type 4.2 Tubular type 4.3 Tubes and fittings"
    },
    {
      "source_text": "5. Environmental protection measures May include but not be limited to: 5.1 Waste management 5.2 Noise management 5.3 Dust management"
    },
    {
      "source_text": "-- PDF PAGE 43 --- SCAFFOLD ERECTION NC II Promulgated July 2007 41"
    },
    {
      "source_text": "VARIABLE RANGE 6. Communication May include but not be limited to: 6.1 Face-to-face 6.2 Whistle 6.3 Two-way radio 6.4 Hand signal 6.5 Mobile phone"
    },
    {
      "source_text": "7. Footings May include but not be limited to: 7.1 Sole boards 7.2 Base plate 7.3 Caster wheel 7.4 Adjustable base jack"
    },
    {
      "source_text": "8. Erection May include but not be limited to: 8.1 Placement 8.2 Sequencing 8.3 Squaring 8.4 Leveling 8.5 Tying to structure"
    },
    {
      "source_text": "9. Fall protection devices 9.1 Safety belt 9.2 Full body harness 9.3 Working platform edge protection"
    },
    {
      "source_text": "10. Hazards May include but not be limited to: 10.1 Movement of equipment, goods or material 10.2 Uneven or unstable surface or terrain 10.3 Underground or overhead services 10.4 Buildings 10.5 Traffic 10.6 Force majeure"
    },
    {
      "source_text": "11. Defects 11.1 Corrosion 11.2 Wear 11.3 Non-compatibility"
    },
    {
      "source_text": "-- PDF PAGE 44 --- SCAFFOLD ERECTION NC II Promulgated July 2007 42"
    },
    {
      "source_text": "VARIABLE RANGE 12. Alterations and repairs Cause may include but are not limited to: 12.1 Storm damage 12.2 Accidents 12.3 Misuse 12.4 Process change 12.5 Wear and tear"
    },
    {
