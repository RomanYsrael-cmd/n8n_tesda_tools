    {
      "source_text": "UNIT OF COMPETENCY: OBSERVE PROCEDURES, SPECIFICATIONS AND MANUALS OF INSTRUCTIONS UNIT CODE : CON311201 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on identifying, interpreting, applying services to specifications and manuals and storing manuals."
