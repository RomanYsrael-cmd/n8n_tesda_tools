formance\n• Writing skills\n\n2. Perform\nvisual\ninspection\n\n2.1 Finished products are checked/\ninspected using appropriate\ninstruments/tools\n2.2 Physical defects are identified\nbased on product specifications\n2.3 Conforming and non-conforming\nproducts are identified and\nsegregated in accordance with\nproduction procedures\n2.4 Housekeeping procedures are\nobserved in accordance with 5S\ndiscipline and established\nprocedures.\n• Finished products\njudgment criteria on\nHDD production line\nFOL processes\n• Uses of appropriate\ninstruments/tools\n• Procedures on\nidentification and\nsegregation of non-\nconforming products in\nHDDs production line\nFOL operation\n•5S principles\n• Reading skills\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Detecting\nabnormality or\nnon-conformance\n• Writing skills\n• Skills in\nhousekeeping\nand 5S\n3. Complete\nHDD front-\nof-line lot\ntraceability\n\n3.1 Lot traceability are transacted in\naccordance with production\nprocedures\n3.2 Conforming and non-conforming\nproducts are identified and\nsegregated in accordance with\nproduction procedures\n3.3 Disposition of lots is determined\nin accordance with product\ncriteria\n• Lot traceability\n• Types of HDD\nproduction line FOL\nproduct defects\n• Process controls on\nlots traceability\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Detecting\nabnormality or\nnon-conformance\n• Writing skills\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 37\n\nRANGE OF VARIABLES\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nMonitored HDD front-of-line machine/ equipment operation\nbased on product requireme