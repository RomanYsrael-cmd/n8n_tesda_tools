        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nOperated HDD front-of-line machine/ equipment according to\nproduction requirements\n1.2\nPerformed HDD front-of-line manual processes in\naccordance with work instructions\n1.3\nRun HDD front-of-line sample units in accordance to product\norientation and specifications\n1.4\nLoaded HDD front-of-line production units in accordance to\nproduct orientation and specifications\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nAppropriate HDD FOL machine and equipment\n2.2\nTools (as indicated in the Range Of Variables)\n2.3\nAppropriate production units and materials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect Observation with oral questioning\n3.3\nExams and Tests\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 36\n\nUNIT OF COMPETENCY: CHECK QUALITY COMPLIANCE OF FRONT-OF-LINE (FOL)\nOPERATIONS FOR HARD DISK DRIVE (HDD) PRODUCTION\nLINE\n\nUNIT CODE :"
        },
        "source_text": "ELC313317\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed in\nperforming any process, either automated or manual, in front-of-\nline (FOL) operation for hard disk drive (HDD) production line. This\nincludes initializing/operating HDD FOL machine, running sample\nunits and loading production units. This also includes manual HDD\nFOL process, if applicable.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Initialize/\nOperate HDD\nFOL machine/\nequipment\n\n1.1 Safety requirements are\ncomplied with using the\noperation manual\n1.2 Appropriate PPE and ESD\napparels are used in the\nperformance of the job\n1.3 Appropriate tools and\nmaterials are used\naccording to process\nrequirements\n1.4 HDD FOL machine\nsettings are checked\naccording to product\nspecifications\n1.5 HDD FOL machine is\ninitialized/operated in\naccordance with manual of\noperation\n1.6 HDD FOL machine’s\ntroubles/ problems are\nimmediately recorded and\nreported to the appropriate\npersonnel\n• Awareness on safe working\nconditions\n• Awareness on hard disk\ndrives FOL machine safety\nfeatures and guidelines\n• Awareness on the following;\n5S, Material Safety Data\nSheet (MSDS), Personal\nProtective Equipment (PPE),\nElectro Static Discharge\n(ESD), Environmental Health\nSystems (EHS),\nOccupational Health and\nSafety (OHS)\n• Awareness on international\nquality standards\n• Quality Management System\n• Environmental Management\nSystem\n• Understanding HDD\nproduction line FOL product\nand process specification\n• Operation of HDD production\nline FOL machines\n• Basic HDD FOL machines/\nequipment troubles/\nbreakdowns\n• Interpreting of different\ngauges readings\n• Visual/mechanical criteria\n\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Observation\nSkills\n• Skills in\nmachine\nsettings and\nsafety\n• Writing skills\n• FOL Machine\nOperation skills\n\n2. Perform HDD\nFOL manual\nprocesses\n\n2.1 Safety requirements are\nobserved and followed\nusing the operation manual\n2.2 Appropriate PPE and ESD\napparels are used in the\nperformance of the job\n2.3 Appropriate tools and\nmaterials are used\naccording to task\n• HDD production line FOL\nprocesses\nSlider Fabrication\no Split & Trim\no Bow Correction Lapping\no Row Slice\no Advance Fine Lapping\no Photoresist Forming\no Ion Milling\n• Reading skills\n• Communication\nskills\n• Computer skills\n• Skills in FOL\nprocesses\n• Detecting\nabnormality or\nnon-\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 32\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\nrequirements\n2.4 HDD FOL manual\nprocesses are performed\nin accordance with work\ninstructions\n2.5 Production line issues are\nimmediately recorded and\nreported to the appropriate\npersonnel\no Row Quasi\no Row placing\no Chip Cutting\no Sorting\no Slider Dynamic Electrical\nTesting\nHead Gimbal Assembly\no Core Adhering\no Solder Ball Bonding\no Electrical Test\no Quasi Check\n• Understanding of OCAP on\nHDD production line FOL\nprocesses\nconformance\n• Writing skills\n\n3. Run HDD\nFOL sample\nunits\n\n3.1 HDD FOL sample output is\nchecked in accordance to\nproduct criteria\n3.2 HDD FOL sample unit is\nloaded to the equipment in\naccordance to product\norientation and\nspecifications\n3.3 Out of control action plan\n(OCAP) is followed in case\nof any non-conformance or\ndeviation to the process\n3.4 HDD FOL production forms\nare accomplished based\non production procedures\n• Product visual/ mechanical\ncriteria\n• Types of HDD production\nline FOL sample units\n• Product orientation\n• Understanding of OCAP on\nrunning HDD production line\nFOL sample units\n• Completeness and accuracy\nof information on production\nline form FOL for sample\nunits\n• Reading skills\n• Observation\nSkills\n• Observation\nSkills\n• FOL machine\noperation skills\n• Detecting\nabnormality or\nnon-\nconformance\n• Writing skills\n\n4\nLoad HDD\nFOL\nproduction\nunits\n\n4.1 HDD FOL production\noutput is checked in\naccordance to product\ncriteria\n4.2 HDD FOL production units\nare loaded to the\nequipment in accordance\nto product orientation and\nspecifications\n4.3 If applicable, manual HDD\nFOL process is performed\nin accordance with work\ninstructions and company\nprocedures\n4.4 Out of control action plan\n(OCAP) is followed in case\nof any non-conformance or\ndeviation to the process\n4.5 HDD FOL production\nforms are accomplished\nbased on production\nprocedures\n• HDD production line FOL\noperation process controls\n• Understanding of OCAP on\nHDD production line FOL\noperation\n• Completeness and accuracy\nof information on production\nline form for HDD FOL\nproduction units\n• Work values and ethics\no Attentiveness\no Time consciousness\no Cost-consciousness\no Quality-consciousness\n\n• Reading skills\n• Communication\nskills\n• Computer skills\n• Observation\nSkills\n• FOL machine\noperation skills\n• Detecting\nabnormality or\nnon-\nconformance\n• Writing skills\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 33\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\nPersonal protective equipment may include:\n1.1 Safety shoes\n1.2 Gloves\n1.3 Safety goggles\n1.4 Ear plugs\n2. ESD apparels\nESD apparels may include:\n2.1 Shoes\n2.2 Smock and Head cap\n2.3 ESD Jacket\n2.4 Bunny suit\n2.5 Face mask\n2.6 Wrist/Foot ground strap\n2.7 Gloves\n2.8 Hairnet\n3. Tools and materials\nAppropriate tools and materials may include:\n3.1\nTools\n3.1.1\nTweezers\n3.1.2\nVacuum Pen\n3.1.3\nMetric Allen Keys\n3.1.4\nCalculator\n3.1.5\nTorque driver\n3.1.6\nPliers\n3.1.7\nGlue dispenser\n3.2\nMaterials\n3.1.1\nAppropriate production components\n3.1.2\nESD apparels\n4. HDD FOL machines\nHDD production line FOL machines may include:\n4.1 Pick and place\n4.2 Dicing/Cutting/Slicing Machine\n4.3 Lapping Machine\n4.4 Etching Machine\n4.5 Vacuum Tools\n4.6 Photolithography Machine\n4.7 Wire Bonding\n4.8 Sorting Machine\n4.9 Testing Machine\n4.10 Cleaning Machine\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 34\n\nVARIABLE\nRANGE\n5. Processes\nHDD production line FOL processes may include:\n5.1 Slider Fabrication\n5.1.1 Split & Trim\n5.1.2 Bow Correction Lapping\n5.1.3 Row Slice\n5.1.4 Advance Fine Lapping\n5.1.5 Photoresist Forming\n5.1.6 Ion Milling\n5.1.7 Row Quasi\n5.1.8 Row placing\n5.1.9 Chip Cutting\n5.1.10 Sorting\n5.1.11 Slider Dynamic Electrical Testing\n5.2 Head Gimbal Assembly\n5.2.1 Core Adhering\n5.2.2 Solder Ball Bonding\n5.2.3 Electrical Test\n5.2.4 Quasi Check\n6. Product criteria\nProduct criteria may include:\n6.1 Electrical criteria\n6.2 Visual criteria\n6.3 Mechanical criteria\n7. Sample Unit\nSample units may include:\n7.1 Good Unit\n7.2 Reject Unit\n7.3 Dummy Unit\n7.4 Standard Unit\n8. Production forms\nProduction forms may include:\n8.1 Lot summary\n8.2 SPC checklist\n8.3 Monitoring checklist\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 35\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nOperated HDD front-of-line machine/ equipment according to\nproduction requirements\n1.2\nPerformed HDD front-of-line manual processes in\naccordance with work instructions\n1.3\nRun HDD front-of-line sample units in accordance to product\norientation and specifications\n1.4\nLoaded HDD front-of-line production units in accordance to\nproduct orientation and specifications\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nAppropriate HDD FOL machine and equipment\n2.2\nTools (as indicated in the Range Of Variables)\n2.3\nAppropriate production units and materials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect Observation with oral questioning\n3.3\nExams and Tests\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 36\n\nUNIT OF COMPETENCY: CHECK QUALITY COMPLIANCE OF FRONT-OF-LINE (FOL)\nOPERATIONS FOR HARD DISK DRIVE (HDD) PRODUCTION\nLINE\n\nUNIT CODE :"
