  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Hard Disk Drive (HDD) Front-of-Line (FOL) Operations NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1. Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2. Effective questioning,\nactive listening and\nspeaking skills are used to\ngather and convey\ninformation\n1.3. Appropriate medium is\nused to transfer\ninformation and ideas\n1.4. Appropriate non- verbal\ncommunication is used\n1.5. Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are identified\nand followed\n1.6. Defined workplace\nprocedures for the location\nand storage of\ninformation are used\n1.7. Personal interaction is\ncarried out clearly and\nconcisely\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational policies\n• Sources of information\n• Types of question\n• Medium of\ncommunication\n• Flow of\ncommunication\n• Storage system\n• Telephone courtesy\n\n• Follow simple\nspoken language\n• Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Gather and\nprovide\ninformation in\nresponse to\nworkplace\nrequirements\n• Listening skills\n• Questioning skills\n• Workplace\nlanguage skills\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 3\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are clearly\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of employment\nare asked and responded\nto according to\norganizational guidelines\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n• Communication\nprocedures and\nsystems\n• Meeting protocols\n• Nature of workplace\nmeetings\n• Barriers of\ncommunication\n• Workplace\ninteractions\n• Nonverbal\ncommunication\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n• Interpersonal\ncommunication\nskill\n• Observing\nmeeting protocols\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating to\nconditions of employment\nare completed accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements to\nsupervisor are completed\naccording to\norganizational guidelines\n• Technology relevant\nto the enterprise and\nthe individual’s work\n• Types of workplace\ndocuments and forms\n• Basic mathematical\nconcepts\n• Kinds of workplace\nreport\n\n• Apply basic\nmathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n• Data recording\n• Report writing\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format\nof the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n2. Resource\nImplications\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4.\nInternet\n3. Methods of\nAssessment\n3.1. Direct Observation\n3.2. Oral interview and written test\n4. Context for\nAssessment\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 5\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n : 500311106\n\nUNIT DESCRIPTOR\n :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Describe team\nrole and scope\n1.1. The role and objective of the\nteam is identified from available\nsources of information\n1.2. Team parameters, reporting\nrelationships and responsibilities\nare identified from team\ndiscussions and appropriate\nexternal sources\n\n• Team roles\n• Definition of Team\n• Difference between\nteam and group\n• Different sources of\ninformation\n• Objectives and goals\nof team\n• Describing the team\nrole and scope\n\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1 Individual role and responsibilities\nwithin the team environment are\nidentified\n2.2 Roles and responsibility of other\nteam members are identified and\nrecognized\n2.3 Reporting relationships within\nteam and external to team are\nidentified\n• Team structure\n• Roles and\nresponsibility of\nteam members\n• Teams in work\nenvironment\n• Fundamental rights\nat work including\ngender sensitivity\n• Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n• Identifying individual\nrole and\nresponsibility\n• Identifying external\nrelationship\n3. Work as a\nteam member\n3.1 Effective and appropriate forms of\ncommunications used and\ninteractions undertaken with team\nmembers who contribute to\nknown team activities and\nobjectives\n3.2 Effective and appropriate\ncontributions made to\ncomplement team activities and\nobjectives, based on individual\nskills and competencies and\nworkplace context\n3.3 Observed protocols in reporting\nusing standard operating\nprocedures\n3.4 Contribute to the development of\nteam work plans based on an\nunderstanding of team’s role and\nobjectives and individual\ncompetencies of the members.\n• Communication\nprocess\n• Group planning and\ndecision making\n• Team goals and\nobjectives\n• Understanding\nindividual\ncompetencies\nrelative to teamwork\n• Types of individuals\n• Role of leaders\n• Interacting\neffectively with\nothers\n• Setting team goals\nand expectations\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1. Work activities in a team environment with enterprise or\nspecific sector\n1.2. Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1. Standard operating and/or other workplace procedures\n2.2. Job procedures\n2.3. Machine/equipment manufacturer’s specifications and\ninstructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OHS and environmental standards\n3. Workplace context\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5. Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 7\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\n Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nObservation of the individual member in relation to the\nwork activities of the group\n3.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Integrate\npersonal\nobjectives with\norganizational\ngoals\n1.1. Personal growth and\nwork plans are pursued\ntowards improving the\nqualifications set for the\nprofession\n1.2. Intra- and interpersonal\nrelationships are\nmaintained in the course\nof managing oneself\nbased on performance\nevaluation\n1.3. Commitment to the\norganization and its goal\nis demonstrated in the\nperformance of duties\n• Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n• Understanding\npersonal objectives\n• Understanding\norganizational goals\n• Difference between\nintra and\ninterpersonal\nrelationship\n• Performance\nevaluation\n• Demonstrate Intra\nand Interpersonal\nskills at work\n• Demonstrate\npersonal\ncommitment in\nwork\n2. Set and meet\nwork priorities\n2.1 Competing demands are\nprioritized to achieve\npersonal, team and\norganizational goals and\nobjectives.\n2.2 Resources are utilized\nefficiently and effectively\nto manage work priorities\nand commitments\n2.3 Practices along economic\nuse and maintenance of\nequipment and facilities\nare followed as per\nestablished procedures\n• Company policies\n• Company operations,\nprocedures and\nstandards\n• Time management\n• Basic strategic\nplanning concepts\n• Resource utilization\nand management\n\n• Managing goals\nand time\n• Practice\neconomic use of\nresources and\nfacilities\n• Setting work\npriorities\n• Practice time\nmanagement\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1 Trainings and career\nopportunities are\nidentified and availed of\nbased on job\nrequirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as proof of\ncareer advancement\n3.3 Licenses and/or\ncertifications relevant to\njob and career are\nobtained and renewed\n• Career development\nopportunities\n• Company recognition\nand incentives\n• Information on\nrelevant licenses and\nor certifications\n• Determining\npersonal career\ndevelopment\nneeds\n• Identifying career\nopportunities\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 9\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Maintain\nprofessional\ngrowth and\ndevelopment\n4.1 Trainings and career\nopportunities are\nidentified and availed of\nbased on job requirements\n4.2 Recognitions are\nsought/received and\ndemonstrated as proof of\ncareer advancement\n4.3 Licenses and/or\ncertifications relevant to\njob and career are\nobtained and renewed\n• Career development\nopportunities\n• Company recognition\nand incentives\n• Information on\nrelevant licenses and\nor certifications\n• Determining\npersonal career\ndevelopment\nneeds\n• Identifying career\nopportunities\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 10\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 11\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 12\n\nUNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with\nregulatory and organizational requirements for occupational\nhealth and safety.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nhazards and\nrisks\n1.1 Safety regulations and\nworkplace safety and hazard\ncontrol practices and\nprocedures are clarified and\nexplained based on\norganization procedures\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding indicators are\nidentified to minimize or\neliminate risk to co-workers,\nworkplace and environment\nin accordance with\norganization procedures\n1.3 Contingency measures\nduring workplace accidents,\nfire and other emergencies\nare recognized and\nestablished in accordance\nwith organization procedures\n• OHS procedures and\npractices and\nregulations\n• Hazards/risks\nidentification and\ncontrol\n• OHS indicators\n• Organizational\ncontingency practices\n\n• Hazards/risks\nidentification and\ncontrol skills\n• Practice of\nsafety and health\nprocedures and\npersonal hygiene\n\n2. Evaluate\nhazards and\nrisks\n2.1 Terms of maximum tolerable\nlimits which when exceeded\nwill result in harm or damage\nare identified based on\nthreshold limit values (TLV)\n2.2 Effects of the hazards are\ndetermined\n2.3 OHS issues and/or concerns\nand identified safety\nhazards are reported to\ndesignated personnel in\naccordance with workplace\nrequirements and relevant\nworkplace OHS legislation\n• Threshold Limit Value\n-TLV\n• Effects of safety\nhazards\n\n• Communication\nskills\n• Reporting safety\nhazards\n3. Control\nhazards and\nrisks\n3.1 Occupational Health and\nSafety (OHS) procedures\nfor controlling hazards/risks\nin workplace are\nconsistently followed\n3.2 Procedures for dealing with\nworkplace accidents, fire\nand emergencies are\n• Personal hygiene\npractices\n• Organization safety\nand health protocol\n• Company emergency\nprocedure practices\n• Practice of\npersonal hygiene\n• Respond to\nemergency\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\n\n---------------------------------------------------------------------------------------------------------------------------------------------