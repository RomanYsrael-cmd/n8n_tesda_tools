        "source_text": "ELC311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to perform computer operations which include\ninputting, accessing, producing and transferring data using\nthe appropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntask to be\nundertaken\n1.1. Requirements of task are\ndetermined in accordance\nwith the required output.\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned\nand required outcome.\n1.3. Task is planned to ensure\nthat OH & S guidelines and\nprocedures are followed.\n1.4. Client -specific guidelines\nand procedures are\nfollowed.\n1.5. Required data security\nguidelines are applied in\naccordance with existing\nprocedures.\n• Main types of\ncomputers and basic\nfeatures of different\noperating systems\n• Main parts of a\ncomputer\n• Information on\nhardware and\nsoftware\n• Data security\nguidelines\n• Reading and\ncomprehension\nskills required to\ninterpret work\ninstruction and to\ninterpret basic user\nmanuals.\n• Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow instructions\nand receive\nfeedback.\n• Interpreting user\nmanuals and\nsecurity guidelines\n2. Input data\ninto computer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating\nprocedures\n2.3. Inputted data are stored in\nstorage media according to\nrequirements\n2.4. Work is performed within\nergonomic guidelines\n• Basic ergonomics of\nkeyboard and\ncomputer user\n• Storage devices and\nbasic categories of\nmemory\n• Relevant types of\nsoftware\n\n• Technology skills\nto use equipment\nsafely including\nkeyboard skills.\n• Entering data\n3. Access\ninformation\nusing\ncomputer\n3.1. Correct program/ application\nis selected based on job\nrequirements\n3.2. Program/application\ncontaining the information\nrequired is accessed\naccording to company\nprocedures\n• General security,\nprivacy legislation\nand copyright\n3.2 Productivity\nApplication\n• Business\nApplication\n• Accessing\ninformation\n• Searching and\nbrowsing files and\ndata\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 23\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3.3. Desktop icons are correctly\nselected, opened and closed\nfor navigation purposes\n3.4. Keyboard techniques are\ncarried out in line with OH &\nS requirements for safe use\nof keyboards\n4. Produce/\noutput data\nusing\ncomputer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as required\nusing computer\nhardware/peripheral devices\nin accordance with standard\noperating procedures\n4.3. Files, data are transferred\nbetween compatible\nsystems using computer\nsoftware, hardware/\nperipheral devices in\naccordance with standard\noperating procedures\n• Computer\napplication in\nprinting, scanning\nand sending\nfacsimile\n• Types and function\nof computer\nperipheral devices\n• Computer data\nprocessing\n• Printing of data\n• Transferring files\nand data\n5. Maintain\ncomputer\nequipment\nand systems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of consumables\nare implemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with standard\noperating procedures\n5.3. Basic file maintenance\nprocedures are implemented\nin line with the standard\noperating procedures\n• Computer\nequipment/system\nbasic maintenance\nprocedures\n• Viruses\n• OH & S principles\nand responsibilities\n• Calculating\ncomputer capacity\n• System Software\n• Basic file\nmaintenance\nprocedures\n• Removing\ncomputer viruses\nfrom infected\nmachines\n• Making backup\nfiles\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 24\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7. Mouse\n1.8.\nVoice/Data logger\n2. Software\nSoftware includes the following but not limited to:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n2.5.\nClient Specific Software\n3. OH & S guidelines\n3.1. OHS guidelines\n3.2. Enterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1. diskettes\n4.2. CDs\n4.3. zip disks\n4.4. hard disk drives, local and remote\n4.5.\nOptical drives\n5. Ergonomic guidelines\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5.\nVisual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1. directories/folders\n6.2. files\n6.3. network devices\n6.4. recycle bin\n6.5.\nprogram icons\n7. Maintenance\n7.1. Creating and managing more space in the hard\ndisk and other peripherals\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust