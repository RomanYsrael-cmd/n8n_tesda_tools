2015            34  \n      \n \n \n \n \nVARIABLE \nRANGE \n5. Processes \nHDD production line FOL processes may include: \n5.1 Slider Fabrication \n5.1.1 Split & Trim \n5.1.2 Bow Correction Lapping \n5.1.3 Row Slice \n5.1.4 Advance Fine Lapping \n5.1.5 Photoresist Forming \n5.1.6 Ion Milling \n5.1.7 Row Quasi \n5.1.8 Row placing \n5.1.9 Chip Cutting \n5.1.10 Sorting \n5.1.11 Slider Dynamic Electrical Testing \n5.2 Head Gimbal Assembly \n5.2.1 Core Adhering \n5.2.2 Solder Ball Bonding \n5.2.3 Electrical Test \n5.2.4 Quasi Check \n6. Product criteria \nProduct criteria may include: \n6.1 Electrical criteria \n6.2 Visual criteria \n6.3 Mechanical criteria \n7. Sample Unit \nSample units may include: \n7.1 Good Unit \n7.2 Reject Unit \n7.3 Dummy Unit \n7.4 Standard Unit \n8. Production forms \nProduction forms may include: \n8.1 Lot summary \n8.2 SPC checklist \n8.3 Monitoring checklist\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \n \n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New)           Promulgated Dec. 16, 2015            35  \n      \n \nEVIDENCE GUIDE \n       \n1.  Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nOperated HDD front-of-line machine/ equipment according to \nproduction requirements \n1.2 \nPerformed HDD front-of-line manual processes in \naccordance with work instructions \n1.3 \nRun HDD front-of-line sample units in accordance to product \norientation and specifications \n1.4 \nLoaded HDD front-of-line production units in accordance to \nproduct orientation and specifications \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1 \nAppropriate HDD FOL machine and equipment \n2.2 \nTools (as indicated in the Range Of Variables) \n2.3 \nAppropriate production units and materials