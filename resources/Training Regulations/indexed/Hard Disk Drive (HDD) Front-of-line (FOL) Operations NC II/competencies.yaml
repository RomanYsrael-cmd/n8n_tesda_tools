        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nGathered production tools and materials for HDD front-of-line\noperation according to approved production specifications\n1.2\nChecked and set up HDD front-of-line machine parameters\nand peripherals for production startup and usage\n1.3\nAccomplished HDD front-of-line production quality checklist\naccording to quality manuals and procedures\n1.4\nChecked machine’s basic physical condition in accordance to\nproduction line standards and performed daily maintenance\nactivity based on required time\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nAppropriate HDD FOL machine and equipment\n2.2\nTools (as indicated in the Range Of Variables)\n2.3\nMaterials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nPersonal Computer\n2.9\nPrinter\n2.10 Reporting forms\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect Observation with oral questioning\n3.3\nExams and Tests\n\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 31\n\nUNIT OF COMPETENCY: ANALYZE, CARRY-OUT AND MONITOR FRONT-OF-LINE (FOL)\nOPERATION FOR HARD DISK DRIVE (HDD) PRODUCTION LINE\n\nUNIT CODE :"
        },
        "source_text": "ELC313316\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed in\nsetting up the workplace for hard disk drive (HDD) front-of-line\n(FOL) operations. This includes gathering production tools\nand materials, setting up hard disk drive FOL machine\nparameters and peripherals, accomplishing hard disk drive\nFOL production line checklist and performing daily\nmaintenance activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Gather tools\nand\nmaterials for\nHDD front-\nof-line\nprocess\n\n1.1. Process requirements\nare determined\naccording to production\nspecifications\n1.2. Appropriate hand tools,\nPPE and materials are\nselected and completed\naccording to process\nrequirements and\nrequired time\n1.3. Quantity and quality of\nmaterials are checked\nin accordance to\nproduction\nspecifications\n1.4. Completeness and\naccuracy of documents\nare checked in\naccordance to\nproduction\nspecifications\n\n• Awareness of hard disk drive\nproduction line systems and\nprocesses\n• Familiarity with HDD\nproduction line FOL materials\n• Understanding bill of\nmaterials, travelers, check list\nand other applicable HDD\nproduction line FOL\ndocuments/ specifications.\n• Awareness of safe handling of\ntools and materials i.e. 5S,\nMaterial Safety Data Sheet\n(MSDS), Personal Protective\nEquipment (PPE), Electro\nStatic Discharge (ESD),\nEnvironmental Health\nSystems (EHS), Occupational\nHealth and Safety (OHS).\nCleanroom requirements and\ncontamination control (LCD\nassembly)\n• Understanding of IPC\nstandards\n• Awareness of international\nquality standards\no\nQuality Management\nSystem\no\nEnvironmental\nManagement System\n• Awareness of Visual criteria\n• Familiarity with HDD\nproduction line FOL tools\n• Time consciousness on set\nup time\n\n• Reading skills\n• Basic\nmathematical\nskills\n• Communication\nskills\n• Computer skills\n• Detecting\nabnormality or\nnon-conformance\n• Writing skills\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 27\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n2. Set-up HDD\nFOL\nmachine\nparameters\nand\nperipherals\n\n2.1 Walk-around check or\nvisual inspection of FOL\nmachine is done prior to\nproduction operations\n2.2 HDD FOL machine\nparameters are set\ncorrectly according to\nproduction\nspecifications\n2.3 HDD FOL machine\nparameters and\nperipherals are\nchecked according to\nproduction\nspecifications\n2.4 Any non-conformance\nto specifications are\nreported to appropriate\npersonnel\n• HDD FOL machine set up\nparameters\n• Awareness of safety\noperation of FOL machines\n• Reading of different gauges\n• Awareness of set up criteria\n• Awareness of applicable Out\nof Control Action Plan\n(OCAP)\n• Skills in basic\nmachine\noperation and\nset-up\n• Detecting\nabnormality or\nnon-conformance\n• Writing skills\n3. Accomplish\nHDD\nproduction\nline checklist\n\n3.1 All check items are\nperformed according to\nspecifications\n3.2 HDD production line\nchecklist are correctly\nfilled-out according to\nspecifications\n3.3 HDD production line\nchecklist is completed\nbased on required time\n3.4 Work turnover\nprocedure is performed\nfor next work shift\n• Completeness and accuracy\nof information on production\nline checklist\n• Work values and ethics\no\nAttentiveness\no\nTime consciousness\no\nCost-consciousness\no\nQuality-consciousness\n\n• Filling up\nappropriate\ninformation on\nchecklist/ lot\ntravelers\n\n4. Perform daily\nmaintenance\nactivity\n\n4.1 HDD machine basic\nphysical condition are\nchecked according to\nspecifications\n4.2 If necessary, daily\nmaintenance activity is\nperformed based on\nrequired time\n4.3 Any non-conformance\nto specifications are\nreported to appropriate\npersonnel\n4.4 Housekeeping\nprocedures are\nobserved in accordance\nwith 5S discipline and\nestablished procedures\n• Workplace organization\n(layout/arrangement of\nworkplace)\n• Understanding the applicable\nPM checklist\n• HDD FOL machine basic\nphysical conditions\n• Time consciousness\n• Awareness of applicable out\nof control action plan (OCAP)\n• 5S principles\n• Checking of\nmachine basic\nphysical\nconditions\n• Detecting\nabnormality or\nnon-conformance\n• Writing skills\n• Skills in\nhousekeeping\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nMaterials\n\nHDD Materials\n1.1\nWafer\n1.2\n Wires (Copper/Gold)\n\n2.\nProduction\nspecifications\n2.1\nMachine specifications\n2.2\nSet-up checklist\n2.3\nWork Instructions (WI)\n2.4\nProduction procedures\n2.5\nOut of Control Plan (OCAP) procedures\n2.6\nControl Plan procedures\n2.7\nStatistical Process Control (SPC) procedures\n2.8\nWork Manual\n2.9\nProduction Process and Flow Diagrams\n\n3.\nHand tools\n3.1\nTweezers\n3.2\nVacuum Pen\n3.3\nAllen Keys\n3.4\nCalculator\n3.5\nTorque driver\n3.6\nWafer handling tools\n3.7\nJigs and fixtures\n\n4.\nPPE\n4.1\nESD apparel\n4.1.1 Shoes\n4.1.2 Smock and Head cap\n4.1.3 ESD Jacket\n4.1.4 Bunny suit\n4.1.5 Face mask\n4.1.6 Wrist/Foot ground strap\n4.1.7 Gloves/ Finger cots\n4.2\nSafety shoes\n4.3\nGloves\n4.4\nSafety goggles\n4.5\nEar plugs\n\n5.\nProcess\n\nHDD front-of-line (FOL) process may include:\n5.1\nSlider Fabrication :\n5.1.1 Split & Trim\n5.1.2 Bow Correction Lapping\n5.1.3 Row Slice\n5.1.4 Advance Fine Lapping\n5.1.5 Photoresist Forming\n5.1.6 Ion Milling\n5.1.7 Row Quasi\n5.1.8 Row placing\n5.1.9 Chip Cutting\n5.1.10 Sorting\n5.1.11 Final Inspection\n5.1.12 Slider Dynamic Electrical Testing\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 29\n\nVARIABLE\nRANGE\n5.2\nHead Gimbal Assembly\n5.2.1 Core Adhering\n5.2.2 Solder Ball Bonding\n5.2.3 Electrical Test\n5.2.4 Physical Inspection\n5.2.5 Quasi Test\n5.2.6 OBA\n\n6.\nRequired time\n6.1\nSet up/ Change over time\n6.2\nProduction cycle time\n6.3\nProcess cycle time\n6.4\nMachine Uptime\n6.5\nCuring time\n7.\nDocuments\n7.1\nProduction form\n7.1.1 Lot traceability\n\n PM checklist\n7.1.2 Monitoring checklist\n7.1.3 SPC checklist\n7.2\nMaterial / Lot traveler\n7.3\nWork Instruction (WI)\n7.4\nSet up sheet\n\n8.\nMachine parameters\n8.1\nMachine type\n8.2\nMachine model\n8.3\nMachine settings\n8.4\nMaterial/ Product type\n8.5\nMaterial/ Product model\n\n9.\nPeripherals\nPeripherals may include:\n9.1\nJigs\n9.2\nFixtures\n10. Appropriate\npersonnel\n10.1 Immediate supervisor\n10.2 Maintenance personnel\n10.3 Engineer\n10.4 Quality Control personnel\n\n11. Machine basic\nphysical\nconditions\n11.1 Complete screws\n11.2 Fan is working\n11.3 No oil leakage\n11.4 No broken wire\n11.5 Free from foreign materials\n11.6 Industrial PC in good condition\n11.7 Dust free\n11.8 Appropriate peripherals\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 30\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nGathered production tools and materials for HDD front-of-line\noperation according to approved production specifications\n1.2\nChecked and set up HDD front-of-line machine parameters\nand peripherals for production startup and usage\n1.3\nAccomplished HDD front-of-line production quality checklist\naccording to quality manuals and procedures\n1.4\nChecked machine’s basic physical condition in accordance to\nproduction line standards and performed daily maintenance\nactivity based on required time\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nAppropriate HDD FOL machine and equipment\n2.2\nTools (as indicated in the Range Of Variables)\n2.3\nMaterials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nPersonal Computer\n2.9\nPrinter\n2.10 Reporting forms\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect Observation with oral questioning\n3.3\nExams and Tests\n\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 31\n\nUNIT OF COMPETENCY: ANALYZE, CARRY-OUT AND MONITOR FRONT-OF-LINE (FOL)\nOPERATION FOR HARD DISK DRIVE (HDD) PRODUCTION LINE\n\nUNIT CODE :"
      }
