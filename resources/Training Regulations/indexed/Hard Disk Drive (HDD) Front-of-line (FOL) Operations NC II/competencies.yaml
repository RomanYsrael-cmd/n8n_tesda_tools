          "source_text": "1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Method of assessment\nThe assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n2.1 Observation\n2.2 Questioning\n2.3 Practical demonstration\n3. Resource implication\n\nMaterials and component parts and equipment to be\nused in a real or simulated electronic production\nsituation\n4. Context of Assessment\n\nAssessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 22\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:"
