        "source_text": "500311106\n\nUNIT DESCRIPTOR\n :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Describe team\nrole and scope\n1.1. The role and objective of the\nteam is identified from available\nsources of information\n1.2. Team parameters, reporting\nrelationships and responsibilities\nare identified from team\ndiscussions and appropriate\nexternal sources\n\n• Team roles\n• Definition of Team\n• Difference between\nteam and group\n• Different sources of\ninformation\n• Objectives and goals\nof team\n• Describing the team\nrole and scope\n\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1 Individual role and responsibilities\nwithin the team environment are\nidentified\n2.2 Roles and responsibility of other\nteam members are identified and\nrecognized\n2.3 Reporting relationships within\nteam and external to team are\nidentified\n• Team structure\n• Roles and\nresponsibility of\nteam members\n• Teams in work\nenvironment\n• Fundamental rights\nat work including\ngender sensitivity\n• Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n• Identifying individual\nrole and\nresponsibility\n• Identifying external\nrelationship\n3. Work as a\nteam member\n3.1 Effective and appropriate forms of\ncommunications used and\ninteractions undertaken with team\nmembers who contribute to\nknown team activities and\nobjectives\n3.2 Effective and appropriate\ncontributions made to\ncomplement team activities and\nobjectives, based on individual\nskills and competencies and\nworkplace context\n3.3 Observed protocols in reporting\nusing standard operating\nprocedures\n3.4 Contribute to the development of\nteam work plans based on an\nunderstanding of team’s role and\nobjectives and individual\ncompetencies of the members.\n• Communication\nprocess\n• Group planning and\ndecision making\n• Team goals and\nobjectives\n• Understanding\nindividual\ncompetencies\nrelative to teamwork\n• Types of individuals\n• Role of leaders\n• Interacting\neffectively with\nothers\n• Setting team goals\nand expectations\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1. Work activities in a team environment with enterprise or\nspecific sector\n1.2. Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1. Standard operating and/or other workplace procedures\n2.2. Job procedures\n2.3. Machine/equipment manufacturer’s specifications and\ninstructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OHS and environmental standards\n3. Workplace context\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5. Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 7\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\n Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nObservation of the individual member in relation to the\nwork activities of the group\n3.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE :"
