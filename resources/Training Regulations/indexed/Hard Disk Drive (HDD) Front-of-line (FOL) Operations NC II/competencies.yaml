        "source_text": "ELC313318\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed in\nperforming front-of-line (FOL) operations for hard disk drive\n(HDD) production line. This includes monitoring machine/\nequipment operation, completing lot traceability and performing\nvisual machine inspection.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Monitor\nHDD front-\nof-line\noperation\n\n1.1. Output and yield are checked in\naccordance with production\nrequirements\n1.2. Out of control action plan (OCAP)\nis followed in case of any non-\nconformance or deviation to the\nprocess\n1.3. HDD FOL production forms are\naccomplished in accordance with\nprocess requirements\n\n• Yield requirement\n• Machine capacity\n• Understanding of\nOCAP on HDD\nproduction line FOL\nmachine/ equipment\noperation\n• Basic Statistical\nProcess Control (SPC)\n• Completeness and\naccuracy of information\non HDD production line\nform for unusual\nmachine operation\n• Reading skills\n• Communication\nskills\n• Monitoring skills\n• Detecting\nabnormality or\nnon-conformance\n• Writing skills\n\n2. Perform\nvisual\ninspection\n\n2.1 Finished products are checked/\ninspected using appropriate\ninstruments/tools\n2.2 Physical defects are identified\nbased on product specifications\n2.3 Conforming and non-conforming\nproducts are identified and\nsegregated in accordance with\nproduction procedures\n2.4 Housekeeping procedures are\nobserved in accordance with 5S\ndiscipline and established\nprocedures.\n• Finished products\njudgment criteria on\nHDD production line\nFOL processes\n• Uses of appropriate\ninstruments/tools\n• Procedures on\nidentification and\nsegregation of non-\nconforming products in\nHDDs production line\nFOL operation\n•5S principles\n• Reading skills\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Detecting\nabnormality or\nnon-conformance\n• Writing skills\n• Skills in\nhousekeeping\nand 5S\n3. Complete\nHDD front-\nof-line lot\ntraceability\n\n3.1 Lot traceability are transacted in\naccordance with production\nprocedures\n3.2 Conforming and non-conforming\nproducts are identified and\nsegregated in accordance with\nproduction procedures\n3.3 Disposition of lots is determined\nin accordance with product\ncriteria\n• Lot traceability\n• Types of HDD\nproduction line FOL\nproduct defects\n• Process controls on\nlots traceability\n• Communication\nskills\n• Computer skills\n• Observation Skills\n• Detecting\nabnormality or\nnon-conformance\n• Writing skills\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 37\n\nRANGE OF VARIABLES\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nMonitored HDD front-of-line machine/ equipment operation\nbased on product requirements\n1.2\nPerformed visual inspection in accordance to HDD production\nline standards\n1.3\nCompleted HDD front-of-line lot transaction in accordance\nwith production procedures\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1\nAppropriate HDD FOL machine and equipment\n2.2\nTools (as indicated in the Range Of Variables)\n2.3\nAppropriate production units and materials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nPersonal Computer\n2.9\nPrinter\n2.10 Reporting forms\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nDirect Observation with oral questioning\n3.3\nExams and Tests\n\n4. Context for\nAssessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\nVARIABLE\nRANGE\n1. Production forms\nProduction forms may include:\n1.1 Lot summary\n1.2 SPC checklist\n1.3\nMonitoring checklist\n2. Lot traceability\ntransaction\nTransaction may include:\n2.1 Manual\n2.2\nAutomated\n3. Disposition of lots\nDisposition of lots may include:\n3.1 Pass\n3.2 Failed\n3.3 Hold\n3.4 Scrap\n3.5\nRe-screen/ Re-work/Re-test\n4. Appropriate\ninstruments/tools\nAppropriate instruments/tools may include:\n4.1 Stereoscopic microscope\n4.2 magnifying lens\n4.3\nprofile projector/ comparator\n5. Physical defects\nPhysical defects may include:\n5.1 lead defects\n5.2 marking defects\n5.3\nmold defects\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 38"
      }
