ck quality compliance\nof back-end operations for\nHDD production line\n\nSet up Front-of-Line\n(FOL) Operations\nWorkplace for HDD\nProduction Line\nAnalyze, carry-out and\nmonitor Front-of-Line\n(FOL) Operations for HDD\nProduction Line\nCheck quality\ncompliance of Front-of-\nLine (FOL) operations\nfor HDD production line\n\n--- PDF PAGE 69 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 65\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies and labor groups who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERT COMMITTEE\n\nRUMELA G. GLORIANI\nTechnical Training Officer\nMaxim Integrated\nRONALD M. HILARIA\nHR Global Head, L&D\nIntegrated Microelectronics, Inc.\nEMMA JEAN M. ANCAJA\nHR Specialist\nSTMicroelectronics, Inc.\nNAPOLEON A. URBANO\nDepartment Manager\nRohm Electronics Philippines Inc.\n\nGLENN G. PANIBAWAN\nEquipment Engineer\nHGST\nRENAN I. FERRER\nAssistant Section Manager\nRohm Electronics Philippines Inc\nCATHERINE S. PINCA\nHR Training Specialist\nIntegrated Microelectronics, Inc.\nROSEMARIE S. BATHAN\nQuality Supervisor\nIntegrated Microelectronics, Inc.\n\nCHERRY L. GACUSAN\nOperative Line Training\nIntegrated Microelectronics, Inc.\nMC ANDREW G. PERYRA\nPMC IE - Training\nHGST\nLOVELLA G. GAMBOA\nIndustrial Engineer\nHGST\nMARIE ROSE D. DE JESUS\nIndustrial Engineer\nHGST\n\nDAISIE E. ALMENDRAS\nEngineering Specialist\nRohm Electronics Philippines, Inc.\nCHRISTINE V. SAÑEZ\nSenior Specialist, Technical\nToshiba\n\n• SEMICONDUCTOR AND ELECTRONICS INDUSTRIES IN THE PHILIPPINES, INC.