rm visual\ninspection\n\n• Use appropriate inspection tools\n• Identify types of HDD FOL product defects\n• Apply finished products judgment criteria on HDD FOL\nprocesses\n• Check/Inspect products using appropriate\ninstruments/tools\n• Perform procedures on identification and segregation of\nnon-conforming products in HDD FOL operation\n•\nApply 5S principles/ housekeeping procedures\n• Perform visual inspection\n•\nLecture\n•\nDiscussion\n•\nHands-on\n\n•\nWritten exam\n•\nPractical\nexam\n•\nOral\nquestioning\n10 hrs\n\n3.3 Complete HDD\nFOL lot\ntraceability\n• Perform lot traceability transaction\no Lot accounting steps\n• Accomplish production forms and documents\n• Identify and segregate conforming and non-conforming\nproducts\n• Learn and apply process controls on lots transaction\n•\nLecture\n•\nDiscussion\n•\nHands-on\n\n•\nWritten exam\n•\nPractical\nexam\nOral questioning\n\n2 hrs\n\n* Nominal duration excludes the number of hours for supervised-industry training (SIT) duration\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 55\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modality and its variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1.\nEnterprise-Based:\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed at least 10 yrs. basic education or an alternative\nlearning systems (ALS) certificate of achievement with grade 10\nequivalent holder\n•\nCan communicate orally & in writing\n•\nCan perform basic mathematical computations\n\n--- PDF PAGE 60 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 56\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n3.4.1 Recommended list of tools, equipment and materials for the training of 25\ntrainees for HDD Front-of-Line Operations NC II\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs\n\n5 pcs\n5 sets\n\