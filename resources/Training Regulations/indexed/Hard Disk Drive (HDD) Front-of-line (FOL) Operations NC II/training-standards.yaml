dustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modality and its variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1.\nEnterprise-Based:\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed at least 10 yrs. basic education or an alternative\nlearning systems (ALS) certificate of achievement with grade 10\nequivalent holder\n•\nCan communicate orally & in writing\n•\nCan perform basic mathematical computations\n\n--- PDF PAGE 60 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 56\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n3.4.1 Recommended list of tools, equipment and materials for the training of 25\ntrainees for HDD Front-of-Line Operations NC II\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs\n\n5 pcs\n5 sets\n\n25 pc