rs certification process\n•\nMust be at least two-year college level or two-year vocational course\ngraduate.\n•\nMust have at least 2-years relevant industry experience in the current field.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of the requirements of the units of competency. A certificate of\nachievement is issued for each unit of competency.\n\nThe result of the institutional assessment may be considered as evidence\nfor the assessment for national certification. As a matter of policy, graduates of\nprograms registered with TESDA under this training regulation are required to\nundergo mandatory national competency assessment upon completion of the\nprogram.\n\n--- PDF PAGE 62 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 58"
