    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for Hard Disk Drive (HDD) Front-of-Line\n(FOL) Operations NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: Hard Disk Drive (HDD) Front-of-Line Operations\nNC Level: NC II\n\nNominal Training Duration:\n16 hrs – Basic Competencies\n\n16 hrs – Common Competencies\n\n 48 hrs – Core Competencies\n\n ----------\n\n 80 hrs - Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes\nof a Hard Disk Drive (HDD) Front-of-Line (FOL) Operator, in accordance with industry\nstandards. It covers the basic & common competencies in addition to the core\ncompetencies such as preparing workplace, analyzing, carrying-out and monitoring\nfront-of-line machine/equipment operation and checking quality compliance for HDD\nFOL operations.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 43 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------