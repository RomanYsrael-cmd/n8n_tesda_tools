      "text": "Electrostatic discharge (ESD) is a swift discharge of electric current between two objects with different charges and different numbers of electrons. This exchange of electrons creates a large electromagnetic field buildup, resulting in ESD. Certain electronic devices are vulnerable to low-voltage ESD. For example, a hard drive is susceptible to just 10 volts. Integrated circuits (IC) are also prone to ESD and may be permanently damaged by high-voltage currents."
