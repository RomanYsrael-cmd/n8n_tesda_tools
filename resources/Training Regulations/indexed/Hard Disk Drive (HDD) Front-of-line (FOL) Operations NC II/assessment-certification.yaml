  "source_text": "SECTION 4: ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1. To attain the National Qualification of either Hard Disk Drives (HDD) Front-\nof-Line (FOL) Operations NC II, the candidate must demonstrate in all the\nunits listed in Section 1. Successful candidates shall be awarded a National\nCertificate II signed by the TESDA Director General.\n\n4.1.2. The qualification of Hard Disk Drives (HDD) Front-of-Line (FOL)\nOperations NC II can be attained through demonstration of competence\nthrough project-type assessment covering all the units required in the\nqualification.\n\n4.1.3. Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.1.4. The following are qualified to apply for assessment and certification:\na. Graduate of formal, non-formal, and informal including enterprise-\nbased education/training programs/courses.\nb. Experienced workers (wage employed or self-employed)\n\n4.1.5. The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\n\n--- PDF PAGE 63 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 59\n\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\nassessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 64 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 60\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n--- PDF PAGE 65 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 61\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n19) Resource Implication - refer to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n20) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n21) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and industry\nspecific skills\n\n24) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 66 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 62\n\nSECTOR SPECIFIC\n\n1) Cleanroom or clean room is an environment, typically used in manufacturing or\nscientific research, with a low level of environmental pollutants such as dust,\nairborne microbes, aerosol particles, and chemical vapors. More accurately, a\ncleanroom has a controlled level of contamination that is specified by the number\nof particles per cubic meter at a specified particle size.\n\n2) Electronic manufacturing services (EMS) is a term used for companies that\ndesign, test, manufacture, distribute, and provide return/repair services for\nelectronic components and assemblies for original equipment manufacturers\n(OEMs). The concept is also referred to as electronic contract manufacturing\n(ECM).\n\n3) Electrostatic discharge (ESD) is a swift discharge of electric current between two\nobjects with different charges and different numbers of electrons. This exchange of\nelectrons creates a large electromagnetic field buildup, resulting in ESD. Certain\nelectronic devices are vulnerable to low-voltage ESD. For example, a hard drive is\nsusceptible to just 10 volts. Integrated circuits (IC) are also prone to ESD and may\nbe permanently damaged by high-voltage currents.\n\n4) Front-end-of-line (FEOL) is the first portion of IC fabrication where the individual\ndevices (transistors, capacitors, resistors, etc.) are patterned in the semiconductor.\nFEOL generally covers everything up to (but not including) the depositions of metal\ninterconnect layers.\n\n5) Hard disk drive (HDD) is a data storage device used for storing and\nretrieving digital information using rapidly rotating disks (platters) coated with\nmagnetic material. An HDD retains its data even when powered off. Data is read in\na random-access manner, meaning individual blocks of data can be stored or\nretrieved in any order rather than sequentially. An HDD consists of one or more\nrigid (\"hard\") rapidly rotating disks (platters) with magnetic heads arranged on a\nmoving actuator arm to read and write data to the surfaces.\n\n6) A head-gimbal assembly of a hard disk drive includes a load beam connected to a\npivot arm, a slider on which a magnetic head is mounted, an elastic support\nmember having one end coupled to the load beam and the other free end portion at\nwhich the slider is supported, and a damper provided between the load beam and\nthe slider to attenuate vibration transferred between the load beam and the slider.\n\n7) IPC, the Association Connecting Electronics Industries, is a trade association\nwhose aim is to standardize the assembly and production requirements of\nelectronic equipment and assemblies. IPC is accredited by the American National\nStandards Institute (ANSI) as a standards developing organization and is known\nglobally for its standards. It publishes the most widely used acceptability standards\nin the electronics industry.\n\n8) In manufacturing, lot traceability is readily-available access to the complete history\nof all manufactured lots, batches and serialized units, spanning production in\nmultiple plants.\n\n--- PDF PAGE 67 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 63\n\n9) MSDS (an acronym for Material Safety Data Sheet) - is an important component\nof product stewardship and occupational safety and health. It is intended to provide\nworkers and emergency personnel with procedures for handling or working with\nthat substance in a safe manner, and includes information such as physical data\n(melting point, point, flash, etc.), toxicity, health effects, first aid, reactivity, storage,\ndisposal, protective equipment, and spill-handling procedures. It is a written\ndocument that outlines information and procedures for handling and working with\nchemicals.\nCurrent MSDS documents contain physical and chemical property information,\npotential hazard information, emergency procedures, and manufacturer contact\ninformation. MSDS formats can vary from source to source within a country\ndepending on national requirements.\n\n10) Out-of-control action plan (OCAP) - is a flowchart that guides employees'\nreactions to out-of-control situations. It consists of activators (which define out-of-\ncontrol conditions); checkpoints (which are likely causes for the conditions); and\nterminators (which contain the action that should resolve the conditions). OCAPs\nare dynamic. For example, Pareto analyses of OCAPs can identify commonly used\nterminators and suggests methods to eliminate frequent causes of problems or to\nmodify the OCAPs that react to common out-of-control situations. Benefits of\nOCAPs include the empowerment given to the operators to troubleshoot problems.\nOther benefits are increased process efficiency and standardization of problem\nsolving techniques.\n\n11) Personal Protective Equipment (PPE) - specialized clothing or equipment worn by\nemployees for protection against health and safety hazards. Personal protective\nequipment is designed to protect many parts of the body, i.e., eyes, head, face,\nhands, feet, and ears.\n\n12) Production line - is a set of sequential operations established in a manufacturing\nestablishment whereby materials are put through a process to produce an end-\nproduct. The machines and peripheral equipment are in the order they are used.\nThe process is not stopped and restarted for each new product as the line is\ndedicated to producing a single or small group of products.\n\n13) Quality management system (QMS) - is a collection of business processes\nfocused on achieving your quality policy and quality objectives — i.e. what your\ncustomer wants and needs. It is expressed as the organizational structure, policies,\nprocedures, processes and resources needed to implement quality management.\n\n14) Statistical process control (SPC) - is a method of quality control which\nuses statistical methods. SPC is applied in order to monitor and control a process.\nMonitoring and controlling the process ensures that it operates at its full potential.\n\n--- PDF PAGE 68 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR– HARD DIDK DRIVE (HDD) FRONT-OF-LINE (FOL) OPERATION NC II (New) Promulgated Dec. 16, 2015 64\n\nANNEX A - COMPETENCY MAP\nHDD Front-of-Line Operations NC II\n\nBASIC COMPETENCIES\n\nReceive and Respond\nto Workplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems Related\nto Work Activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop