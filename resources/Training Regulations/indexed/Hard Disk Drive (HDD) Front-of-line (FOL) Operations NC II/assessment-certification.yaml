      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of either Hard Disk Drives (HDD) Front- of-Line (FOL) Operations NC II, the candidate must demonstrate in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General. 4.1.2. The qualification of Hard Disk Drives (HDD) Front-of-Line (FOL) Operations NC II can be attained through demonstration of competence through project-type assessment covering all the units required in the qualification. 4.1.3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4. The following are qualified to apply for assessment and certification: a. Graduate of formal, non-formal, and informal including enterprise- based education/training programs/courses. b. Experienced workers (wage employed or self-employed) 4.1.5. The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”."
