  "source_text": "Section 1. Successful candidates shall be awarded National\nCertificate signed by the TESDA Director General\n\n4.2\nThe qualification of Dressmaking NC II may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in all of the\nfollowing areas:\n\n4.2.1.1\nDraft and Cut Pattern of Ladies' Casual Apparel\n4.2.1.1.1 Draft and Cut Pattern of Casual Apparel\n4.2.1.2\nCut and Sew Ladies' Casual Apparel\n4.2.1.2.1 Prepare and Cut Materials of Casual Apparel\n4.2.1.2.2 Sew Casual Apparel\n4.2.1.2.3 Apply Finishing Touches on Casual Apparel\nSuccessful candidates shall be awarded Certificates of\nCompetency (COC).\n\n4.2.2 Demonstration of competence through project-type assessment\ncovering all the required units of qualification.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs.\n\n4.4.2 Experienced workers (wage-employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 57 ---\nTR Dressmaking NC II (Garment Sector) 03/18/2005 Promulgated March 18, 2005\n55\n\nPerform\nbasic\nmaintenance\nSew\nFormal\nApparel\nSew\nCasual\nApparel\nApply Finishing\nTouches on\nCasual Apparel\nCOMPETENCY MAP\nGarment (Dressmaking/Tailoring) Sector\nDRESSMAKING NC II\nDraft and\nCut Pattern of\nFormal Apparel\nApply Finishing\nTouches on\nFormal Apparel\nDraft and\nCut Pattern of\nHigh Fashion\nApparel\nPrepare and\nCut Materials of\nCasual Apparel\nApply\nquality\nstandard\nCarry out\nmeasurements\nand calculation\nPrepare and\nCut Materials of\nHigh Fashion\nApparel\nSet-up and\noperate machines\nDraft and\nCut Pattern of\nCasual Apparel\nCOR\nE\nCOMPETENCIE\nS\nCOMMO\nN\nCOMPETENCIE\nS\nPrepare and\nCut Materials of\nFormal Apparel\nSew\nHigh Fashion\nApparel\nApply Finishing\nTouches on High\nFashion Apparel\nLead workplace\ncommunication\nWork with\nothers\nWork in team\nenvironment\nLead small\nteams\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nBASI\nC\nCOMPETENCIE\nS\nApply problem\nsolving\ntechniques to\nworkplace\nPlan and organize\nwork\nPractice career\nprofessionalism\nDemonstrate\nwork values\nPractice\noccupational health\nand safety\nprocedures\nDevelop and\npractice\nnegotiation skills\nUse\nmathematical\nmethod\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nskills\nDevelop team\nand individual\nCollect, analyze\nand organize\ninformation\nPromote\nenvironmental\nprotection\nPractice basic\nhousekeeping\nprocedures\n\n--- PDF PAGE 58 ---\n________________________________________________________________________________________________\nTR Dressmaking NC II (Garment Sector) 03/14/05 Promulgated March 18, 2005\n\n56\n\nDEFINITION OF TERMS\n\nFabric grain\nrefers to woven fabric compose of two sets of yarns\n(threads) that run at right angle to each other.\n\nManipulation\nthe process of producing another pattern adapting existing\nblocks pattern.\n\nWarp\nthe lengthwise yarn (threads) that run vertically in a woven\nfabric\nWeft\nthe crosswise yarn (threads) that run horizontally in a\nwoven fabric\n\nSelvedge\nedge of woven fabric finished to prevent raveling.\nDesign\na combination of lines or shapes to form a decoration\n\nOn grain\na fabric is on grain when the lengthwise threads run\nexactly at right angles to each other.\nOff grain\nwhen the two sets of grain do not run at right angle to each\nother\n\nSpecification Sheet\nrefers to a data containing the final instructions regarding\nsizes, stitches, etc.\n\nStyle/Design\nrefers to a kind of outlook based on printed materials,\nshows, trends and market choice.\nAccents\nrefer to accessories/materials used to enhance and\nglamorize dress. Examples are beads, pearls, rhinestones,\nmetals, laces and bias.\nDesign\nInterpretation\nrefers to sketches of design either white or colored\ninterpreted into pattern.\nMannequin\na three dimensional model of human form used for fitting\nclothes. It may be made of either fiber glass, ivory,\nporcelain, wood or paper mache.\nFinishing Touches\nrefer to work done on a dress to enhance the total quality\nfeature of a product.\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________\nTR Dressmaking NC II (Garment Sector) 03/14/05 Promulgated March 18, 2005\n\n57\n\nBlazer\nrefers to the kind of dress for women otherwise called as\novercoat.\nGown\nrefers to a long dress sometimes made of beads and\nexpensive materials.\n\nCasual Dress\nrefers to a dress used for everyday wear (vogue and\ncomfortable)\nWorkplace Quality\nStandards\nrefer to the expected characteristics of finished garment. The\nquality standard that applies in the candidate workplace is\nthe standard that is appropriate for assessment\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________\nTR Dressmaking NC II (Garment Sector) 03/14/05 Promulgated March 18, 2005\n\n58\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business,\nindustry, academe and government agencies who donated their time and\nexpertise to the development and validation of this Training Regulation\n\nTHE TESDA ADVISORY PANEL (TAP)\n\nMr. OSCAR R. PAPA\nTAP Chairman\nChairman of the Board, GBAP (Former)\n2004 Herrera Cityland Towers\nMakati City\nTel.# 8174127\nMr. LINO 