        "source_title": "PREPARE AND CUT MATERIALS FOR CASUAL APPAREL",
        "source_text": "--- PDF PAGE 35 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n33\n \nUNIT OF COMPETENCY:    PREPARE AND CUT MATERIALS FOR CASUAL  \n                                              APPAREL \n \nUNIT CODE:                         GRM743302  \n \nUNIT DESCRIPTOR       : \nThis unit covers the knowledge, skills and attitudes \nrequired in preparing and cutting of materials for \ncasual apparel. It details the requirements for \npreparing materials, lay-outing and marking of pattern \non material and cutting of materials. \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare materials \n(fabric) \n1.1 \nFabric is collected and checked in accordance \nwith job specification \n1.2 \nFabric width and quality are checked according to \ninstructions and if needed appropriate action is \ntaken in accordance with work requirements \n1.3 \nFabric is checked for quality, faults, width, \nselvedges, dye lot and marking requirement \naccording to workplace procedures \n1.4 \nFabric is soaked/drip dried and pressed in \naccordance with standard fabric care \n1.5 \nAccessories and accents are selected and \nprepared in accordance with specified garment \nstyle/design \n1.6 \nMeasuring tools are prepared in accordance with \njob requirements \n1.7 \nEquipment and tools are prepared according to \nprocedure\n2. Lay-out and mark \npattern on material \n2.1 \nCutting table is prepared and set-up  in \naccordance with company procedures \n2.2 \nPatterns are prepared and checked in accordance \nwith company’s specifications \n2.3 \nPatterns are laid out and pinned on the fabric in \naccordance with fabric grain line \n2.4 \nFabric is laid-up and alignment with pattern is \nchecked as per procedure \n2.5 \nPattern pieces are positioned manually in \naccordance with company’s procedures \n2.6 \nSeam allowances are marked on the fabric in \naccordance with job requirements \n2.7 \nDarts and pocket locations are traced/marked on \nthe fabric in accordance with specified garment \nstyle or design \n2.8 \nMarkings is placed in accordance with company’s \nprocedures\n\n--- PDF PAGE 36 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n34\n \n3. Cut materials \n3.1 \nGarment style or design is interpreted in \naccordance with customer’s specification  \n3.2 \nFabric is cut to meet design requirements and \nmeasurements of the pattern \n3.3 \nGarment parts are checked for completeness in \naccordance with specified garment design or \nstyles\n\n--- PDF PAGE 37 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n35\n \n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n \n1. Fabric specification \n \n1.1 \nCotton \n1.2 \nChaliz \n1.3 \nPolyester \n1.4 \nGabardine \n1.5 \nRayon \n \n2. Material checked  \n \n2.1 \nQuality \n2.2 \nFaults \n2.3 \nWidth \n2.4 \nSelvedges \n2.5 \nSoaked/drip dried \n \n3. Standard fabric care \n \n3.1 \nDry cleaning \n3.2 \nSoaking and drying \n3.3 \nMachine washed \n3.4 \nTumble - dried \n \n4. Accessories and \naccent \n \n4.1 \nZipper \n4.2 \nButtons \n4.3 \nBias tape \n4.4 \nHook and eye \n4.5 \nSnaps \n \n5. Tracing/Marking tools \n \n5.1 \nTracing wheel \n5.2 \nTracing paper \n5.3 \nTailor’s chalk \n \n6. Garment parts \n \n6.1 \nCollar \n6.2 \nPocket \n6.3 \nSleeves \n6.4 \nWaistband \n6.5 \nFigure\n\n--- PDF PAGE 38 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n36\n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nChecked fabric for quality, faults, width, selvedges \nand marking requirements \n1.2 \nSoaked, drip dried and pressed fabric in \naccordance with standard fabric care \n1.3 \nSelected and prepared accessories and accent of \nthe garment in accordance with specified garment \ndesign or style \n1.4 \nPrepared tools and equipment in accordance with \njob specifications \n1.5 \nLaid-out and pinned patterns on the fabric in \naccordance with fabric grain line \n1.6 \nMarked seam allowances on the fabric in \naccordance with job requirements \n1.7 \nTraced/marked darts and pocket locations on the \nfabric in accordance with specified garment style \nor design \n1.8 \nInterpreted garment design or style in accordance \nwith customer’s specifications \n1.9 \nCut fabric in accordance with the required \nstandard allowances\n2. Underpinning \nknowledge and \nattitudes \n2.1 \nTypes of pattern \n2.2 \nFabric properties such as weight, shrinkage, pile, \ngrain and pattern shapes \n2.3 \nSoaking and drying procedures \n2.4\nMarket trends on garment style\n3. Underpinning skills \n3.1 \nMeasuring, marking/tracing and cutting skills \n3.2 \nManipulating prepared pattern \n3.3\nLaying-up and cutting operations skills\n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately \nsimulated environment where assessment may \ntake place \n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1 \nDirect observation/demonstration of application of \ntasks and questioning related to underpinning \nknowledge \n5.2\nPortfolio\n6. Context for \nassessment \nCompetency may be assessed individually in the actual \nworkplace of simulated environment or in any TESDA \naccredited assessment center\n",
