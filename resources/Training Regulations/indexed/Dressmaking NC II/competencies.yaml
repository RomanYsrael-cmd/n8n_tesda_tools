satisfaction\n4.3\nGarment alteration is completed as per client’s\nsatisfaction\n\n--- PDF PAGE 41 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n39\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Parts of sewing\nmachine\n\n1.1\nFeed dog\n1.2\nBobbin case and spool\n1.3\nNeedle\n1.4\nLever\n1.5\nWheel\n\n2. Machine problem or\nfaults\n\n2.1\nPuckering\n2.2\nUneven stitch\n2.3\nLoose threads\n2.4\nSkipping stitch\n\n3. Types of sleeves\n\n3.1\nPuff sleeve\n3.2\nTailored sleeve\n3.3\nCup sleeve\n\n4. Types of collar\n\n4.1\nSports collar\n4.2\nBaby collar\n4.3\nFlat collar\n4.4\nTailored collar\n\n5. Types of pocket\n\n5.1\nPatch\n5.2\nFlap\n5.3\nWelt\n5.4\nPiped\n5.5\nBellows or Pouch\n\n--- PDF PAGE 42 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n40\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared pressed and pinned cut parts together in\naccordance with the specified garment\ndesign/style\n1.2\nSet-up and adjusted machines in accordance with\nwork specifications\n1.3\nAssembled, sewn garments in conformance with\nsewing standard procedures and company’s\ntimeframes\n1.4\nSewn sleeves are fitted and well hung from the\nedge of the shoulder and around the arm as per\nspecifications\n1.5\nSewn seated collar at the neckline and corners\nevenly and sharply sewn\n1.6\nCleaned pocket flaps corners with no raw edges\n1.7\nSewn zipper without puckered\n1.8\nNicked and flattened seams without wrinkles\n1.9\nEvenly sewn waistband width from end to end\nevenly\n1.10\nCompleted garment alteration\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of sewing machines\n2.2\nGarment parts\n2.3\nCharacteristics of fabrics, threads and other\nmaterials used in basic garment assembly\n3. Underpinning skills\n3.1\nSewing machine operations\n3.2\nThreading procedures\n3.3\nApply basic sewing techniques\n3.4\nCarry out work in accordance with OH&S policies\nand procedures\n3.5\nInterpret and apply defined procedures\n3.6\nApply safety precautions relevant to the task\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment may\ntake place\n4.2\nMaterials and equipment relevant to the proposed\nactivity or task\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect observations/demonstration of candidate’s\napplication of tasks and questioning related to\nunderpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center.\n\n--- PDF PAGE 43 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n41\n\nUNIT OF COMPETENCY : APPLY FINISHING TOUCHES ON CASUAL\nAPPAREL\n\nUNIT CODE: GRM743304\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired in applying finishing touches and detailing\non the requirements such as attaching the needed\naccessories and accent, trimming of excess threads,\npressing finished garment and packaging of finished\ngarment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Apply finishing touches\n\n1.1\nFinishing touches are checked in accordance\nwith garment design/style specifications\n1.2\nAccessories’ and accents’ positions are marked\nand attached in accordance with garment\ndesign/style specification\n1.3\nAccessories and accents are sewn by hand or by\nmachine in accordance with garment design/style\nspecifications\n1.4\nFinishing operations are performed in accordance\nwith customer’s specifications and company’s\nprocedures\n1.5\nGarment is checked for loose threads, missing\nbuttons and attachments.\n1.6\nBodice hem allowances and sleeves are folded\nand pinned in accordance with customer’s\nspecifications.\n1.7\nHemline allowances are sewn in accordance with\nthe given stitch/seam specifications\n\n2. Trim excess threads\n\n2.1\nTrimming tools are prepared in accordance with\ncompany’s procedures\n2.2\nGarments are trimmed of excess threads in\naccordance with sewing procedures\n2.3\nGarments are reversed and hanged in accordance\nwith company’s procedures\n\n--- PDF PAGE 44 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n42\n\n3. Press finished garment\n\n3.1\nFabric and pressing tools are prepared\naccording to standard operating procedures\n3.2\nPressing machines are setup, cleaned and\nchecked in accordance with company’s\nprocedures\n3.3\nFaults, spots and marks are identified and\nappropriate actions are taken in accordance with\ncompany’s procedures\n3.4\nHeat/Pressure is applied in accordance with\nproduct requirements, fabric specifications and\ncompany’s procedures\n3.5\nPressing is sequenced in accordance with work\nspecifications and company’s procedures\n\n4. Package finished\ngarment\n\n4.1\nFinished garments are packed in accordance with\npackaging standards/procedures\n4.2\nGarment packages are labeled in accordance\nwith company’s requirements\n\n--- PDF PAGE 45 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n43\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Finishing Touches\n\n1.1\nClosures\n1.2\nHemming\n1.3\nAccessories and accent\n1.4\nStitches\n\n2. Pressing Tools\n\n2.1\nFlat iron\n2.2\nIroning board\n2.3\nSleeve board\n2.4\nPress mitt\n2.5\nTailor’s ham\n\n3. Faults, spots and\nmarks\n\n3.1\nGrease/Oil\n3.2\nPuckering\n3.3\nLoose threads\n3.4\nMissing buttons\n3.5\nUneven stitches\n\n4. Heat/Pressure\n\n4.1\nLevel 1 – Silk\n4.2\nLevel 2 – Cotton\n4.3\nLevel 3 – Maong\n\n5. Packaging procedures\n\n5.1 Sorting of garments according to:\n5.1.1 Style\n5.1.2 Color\n5.1.3 Size\n5.2 Putting label tags\n\n6. Garment packages\n\n6.1 Blouse\n6.2 Skirt\n6.3 Trouser\n6.4 Culottes\n6.5 Shirt\n6.6 Short\n\n--- PDF PAGE 46 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n44\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked finishing touches in accordance with\ngarment design/style specifications\n1.2\nMarked and attached accessories and accent\npositions in accordance with garment design/style\nspecifications\n1.3\nPerformed finishing operations in accordance with\ncustomer’s specifications and company\nprocedures\n1.4\nFolded and pinned bodice hem allowances and\nsleeves in accordance with customer’s\ndesign/style specifications\n1.5\nSewn hemline allowances in accordance with the\ngiven stitch/seam specifications\n1.6\nTrimmed garments of excess threads in\naccordance with company’s procedures\n1.7\nIdentified faults, spots and marked and\nappropriate actions were taken in accordance with\ncompany’s procedures\n1.8\nPressed finished garment in accordance with\nproduct requirements, fabric specifications and\ncompany’s procedures\n1.9\nPacked and labeled finished garments in\naccordance with packaging standards/procedures\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of trimming and ironing tools\n2.2\nFabric and Styles\n2.3\nCharacteristics of typical fabric and other materials\nused in garment industry\n2.4\nPressing requirements procedure\n2.5\nPressing equipment functions\n2.6\nQuality standards and fabric/garment handling\nprocedures\n2.7\nTypes of hemming\n2.8\nFinishing touches procedure\n2.9\nLabeling requirements\n3. Underpinning skills\n3.1\nPressing operation/instruction\n3.2\nHand/machine sewing of accessories and accents\n3.3\nPackaging finished garments\n3.4\nMarking and attaching accessories and accents\n\n--- PDF PAGE 47 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n45\n\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment may\ntake place\n4.2\nMaterials and 