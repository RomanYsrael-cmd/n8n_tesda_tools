        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated in a team to complete workplace activity\n1.2 Worked effectively with others\n1.3 Conveyed information in written or oral form\n1.4 Selected and used appropriate workplace language\n1.5 Followed designated work plan for the job\n1.6 Reported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication process\n2.2 Team structure\n2.3 Team roles\n2.4 Group planning and decision making\n3. Underpinning Skills\n3.1 Communicate appropriately, consistent with the\nculture of the workplace\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n 4.2. Materials relevant to the proposed activity or\ntasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of the individual member in relation\nto the work activities of the group\n5.2 Observation of simulation and or role play\ninvolving the participation of individual member to\nthe attainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for\nAssessment\n6.1 Competency may be assessed in workplace or in\na simulated workplace setting\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE :"
        },
        "source_text": "500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1 The role and objective of the team is identified\nfrom available sources of information\n1.2 Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1 Individual role and responsibilities within the team\nenvironment are identified\n2.2 Roles and responsibility of other team members\nare identified and recognized\n2.3 Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1 Effective and appropriate forms of communications\nused and interactions undertaken with team\nmembers who contribute to known team activities\nand objectives\n3.2 Effective and appropriate contributions made to\ncomplement team activities and objectives, based\non individual skills and competencies and\nworkplace context\n3.3 Observed protocols in reporting using standard\noperating procedures\n3.4 Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1 Work activities in a team environment with\nenterprise or specific sector\n1.2 Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of\ninformation\n2.1 Standard operating and/or other workplace\nprocedures\n2.2 Job procedures\n2.3 Machine/equipment manufacturer’s specifications\nand instructions\n2.4 Organizational or external personnel\n2.5 Client/supplier instructions\n2.6 Quality standards\n2.7 OHS and environmental standards\n3. Workplace context\n3.1 Work procedures and practices\n3.2 Conditions of work environments\n3.3 Legislation and industrial agreements\n3.4 Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5 Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n7\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated in a team to complete workplace activity\n1.2 Worked effectively with others\n1.3 Conveyed information in written or oral form\n1.4 Selected and used appropriate workplace language\n1.5 Followed designated work plan for the job\n1.6 Reported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication process\n2.2 Team structure\n2.3 Team roles\n2.4 Group planning and decision making\n3. Underpinning Skills\n3.1 Communicate appropriately, consistent with the\nculture of the workplace\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n 4.2. Materials relevant to the proposed activity or\ntasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of the individual member in relation\nto the work activities of the group\n5.2 Observation of simulation and or role play\ninvolving the participation of individual member to\nthe attainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for\nAssessment\n6.1 Competency may be assessed in workplace or in\na simulated workplace setting\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE :"
