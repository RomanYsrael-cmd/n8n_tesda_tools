        "source_title": "DRAFT AND CUT PATTERN FOR CASUAL APPAREL",
        "source_text": "--- PDF PAGE 30 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n28\n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:      DRAFT AND CUT PATTERN FOR  CASUAL \nAPPAREL  \n \nUNIT CODE:                           GRM743301 \n \nUNIT DESCRIPTOR       :  This unit covers the outcomes required in drafting and \ncutting basic/block patterns for casual apparel. It \nincludes the requirements for planning garment \ndesign, taking body measurement, drafting basic/block \npattern and cutting final pattern. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in theRange of Variables \n1. Plan garment design \n1.1 \nCustomer’s job requirements are determined in \naccordance with company’s practice \n1.2 \nGarment design is prepared in accordance with the \nclient’s requirements \n1.3 \nDesign and fabric are discussed and selected \naccording to client’s specifications \n1.4 \nSpecial needs of the client are incorporated into \nthe design based on procedures \n2. Take client’s body \nmeasurements \n \n2.1 \nMeasuring tools are prepared in accordance with \njob requirements. \n2.2 \nBody measurements are taken based on \nprocedures \n2.3 \nBody measurements of client are taken in \nsequence according to  job requirements and \nstandard body measurement \n2.4 \nBody measurements are recorded in line with \ncompany requirements/practice   \n3. Draft basic/block \npattern \n3.1 \nDrafting pattern tools are selected in accordance \nwith job requirements \n3.2 \nBasic/Block pattern is drafted using appropriate \nequipment and customer’s specifications \n3.3 \nDrafted basic/block pattern is checked for accuracy \nbased on customer’s specification\n\n--- PDF PAGE 31 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n29\n \n \n \n4. Manipulate pattern \n \n4.1 \nBlock pattern is laid out in accordance with \ncompany procedures \n4.2 \nBlock  pattern is manipulated in accordance with \ncustomer’s specifications \n4.3 \nFinal pattern is labeled, filled and secured as per \nstandard operating procedures (SOPs) \n \n5. Cut final pattern \n \n5.1 \nTools for cutting pattern are selected in \naccordance with job requirements \n5.2 \nPattern is cut in accordance with customer’s \nspecifications/measurements\n\n--- PDF PAGE 32 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n30\n \n \nRANGE OF VARIABLES \n \nVARIABLE \n \nRANGE \n1. Job requirements \nInclude but not limited to: \n1.1 \nCasual Dress \n1.2 \nBlouse \n1.3 \nSkirt \n1.4 \nTrouser \n1.5 \nShirt \n1.6 \nShorts \n1.7\nCullottes\n2. Fabric \n2.1 \nCotton  \n2.2 \nPolyester \n2.3 \nChaliz \n2.4 \nRayon \n2.5\nSatin\n3. Special needs \nKinds of: \n3.1 \npocket \n3.2 \nstitch \n3.3 \ncollar \n3.4 \nsleeve \n3.5 \nskirt \n3.6\ncut\n4. Measuring tools \n4.1 \nTape measure \n4.2 \nHip curve rule \n4.3 \nL-square \n4.4\nMeter stick\n5. Standard body \nmeasurement \n5.1 \nShoulder \n5.2 \nNeck circumference \n5.3 \nChest width and bust circumference \n5.4 \nBust height and width \n5.5 \nFigure (front and back) \n5.6 \nWaistline \n5.7 \nHips \n5.8 \nLength of sleeve, blouse, skirt and casual dress \n5.9\nArmhole circumference\n\n--- PDF PAGE 33 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n31\n \n \n \n6. Drafting tools \n \n6.1 \nTailor’s chalk \n6.2 \nPattern paper \n6.3 \nRuler with grid \n6.4 \nTriangle (45º- 90º) \n6.5 \nHip curve \n6.6 \nFrench curve \n6.7 \nPencil \n \n7. Basic/block pattern \n \n7.1 \nBlouse \n7.2 \nSkirt \n7.3 \nTrouser \n7.4 \nShort \n7.5 \nCullottes \n7.6 \nShirt \n \n8. Cutting tools \n \n8.1 \nScissors \n \n \n9. Pattern cutting \n \n9.1 \nWith seam allowance \n9.2 \nWithout seam allowance\n\n--- PDF PAGE 34 ---\nTR Dressmaking NC II (Garment Sector)                                                                  Promulgated March 18, 2005 \n32\n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDetermined job requirements in accordance with \ncompany’s practice \n1.2 \nPrepared design in accordance with client’s \nrequirements \n1.3 \nPrepared/selected measuring, drafting and cutting \ntools in accordance with job requirements \n1.4 \nFollowed correct position and sequence in taking \nbody measurements \n1.5 \nDrafted basic/block pattern in accordance with \ncustomer’s specifications \n1.6 \nCut final pattern with/without seam allowance and \nin accordance with customer’s specifications \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nTypes of measuring, drafting and cutting tools and \ntheir uses \n2.2 \nSequence and position in taking body \nmeasurement \n2.3 \nPattern preparation \n3. Underpinning skills \n3.1 \nPosition in taking body measurement \n3.2 \nDrafting  basic/block pattern \n3.3 \nCutting pattern with seam allowance \n3.4 \nCommunicating effectively with client \n4. Resource implications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can \ntake place \n4.2 \nMaterials and equipment relevant to the proposed \nactivity or task \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1 \nDirect observation/demonstration of candidate’s \napplication of tasks and questioning related to \nunderpinning knowledge \n5.2 \nPortfolio \n6. Context for \nassessment \nCompetency may be assessed individually in the actual \nworkplace or simulated environment or in TESDA \naccredited assessment center\n",
