        "source_text": "GRM743303\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge and skills required in\npreparing and assembling cut parts, preparing sewing\nmachine\nfor\noperation,\nsewing\ngarments\nand\ncomponents using basic sewing techniques and\naltering completed garments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare cut parts\n\n1.1\nCut parts are prepared in accordance with the\nspecified garment design/style\n1.2\nCut parts are pressed in accordance with fabric\nspecifications\n1.3\nCut parts are pinned together in accordance with\ngarment design or style\n1.4\nAccessories and accents are prepared in\naccordance with garment design or style\n\n2. Prepare sewing\nmachine for operation\n\n2.1\nMachine parts are cleaned and lubricated in\naccordance with company’s requirements and\nmanufacturer’s cleaning and lubricating\ninstructions\n2.2\nMachines are set-up and adjusted in accordance\nwith work specifications\n2.3\nMachines are threaded in accordance with\ncompany procedures\n2.4\nMachine is started and stopped in accordance\nwith manufacturer’s and company’s requirements\n2.5\nSpeed of machines and work handling are\ncontrolled in accordance with company’s\nprocedures\n2.6\nMinor machine problem or fault is identified and\nrepaired in accordance with manufacturer’s\nmanual\n2.7\nMachine operation is monitored as per procedures\n2.8\nCompany’s health and safety policies and\nprocedures are followed as per standard operating\nprocedures (SOPs)\n\n--- PDF PAGE 40 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n38\n\n3. Sew and assemble\ngarment parts\n\n3.1\nGarment parts are assembled in accordance with\ngarment assembly instructions and pattern\nspecifications\n3.2\nGarments are sewn in conformance with sewing\nstandard procedures and company’s timeframes\n3.3\nSleeves, collars and pockets are identified and\nsewn according to customer’s specification\n3.4\nPocket flaps are sewn with clean corners and no\nraw edges\n3.5\nZipper is sewn without puckered according to\nsewing instructions\n3.6\nSeams edges are finished in accordance with job\nrequirements\n3.7\nWaistband width are evenly sewn from end to end\naccording to standard operating procedure (SOPs)\n\n4. Alter completed\ngarment\n\n4.1\nAlterations/modifications are done in accordance\nwith the client’s specifications\n4.2\nFinal fitting is conducted to ensure client’s\nsatisfaction\n4.3\nGarment alteration is completed as per client’s\nsatisfaction\n\n--- PDF PAGE 41 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n39\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Parts of sewing\nmachine\n\n1.1\nFeed dog\n1.2\nBobbin case and spool\n1.3\nNeedle\n1.4\nLever\n1.5\nWheel\n\n2. Machine problem or\nfaults\n\n2.1\nPuckering\n2.2\nUneven stitch\n2.3\nLoose threads\n2.4\nSkipping stitch\n\n3. Types of sleeves\n\n3.1\nPuff sleeve\n3.2\nTailored sleeve\n3.3\nCup sleeve\n\n4. Types of collar\n\n4.1\nSports collar\n4.2\nBaby collar\n4.3\nFlat collar\n4.4\nTailored collar\n\n5. Types of pocket\n\n5.1\nPatch\n5.2\nFlap\n5.3\nWelt\n5.4\nPiped\n5.5\nBellows or Pouch\n\n--- PDF PAGE 42 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n40\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared pressed and pinned cut parts together in\naccordance with the specified garment\ndesign/style\n1.2\nSet-up and adjusted machines in accordance with\nwork specifications\n1.3\nAssembled, sewn garments in conformance with\nsewing standard procedures and company’s\ntimeframes\n1.4\nSewn sleeves are fitted and well hung from the\nedge of the shoulder and around the arm as per\nspecifications\n1.5\nSewn seated collar at the neckline and corners\nevenly and sharply sewn\n1.6\nCleaned pocket flaps corners with no raw edges\n1.7\nSewn zipper without puckered\n1.8\nNicked and flattened seams without wrinkles\n1.9\nEvenly sewn waistband width from end to end\nevenly\n1.10\nCompleted garment alteration\n2. Underpinning\nknowledge and\nattitudes\n2.1\nTypes of sewing machines\n2.2\nGarment parts\n2.3\nCharacteristics of fabrics, threads and other\nmaterials used in basic garment assembly\n3. Underpinning skills\n3.1\nSewing machine operations\n3.2\nThreading procedures\n3.3\nApply basic sewing techniques\n3.4\nCarry out work in accordance with OH&S policies\nand procedures\n3.5\nInterpret and apply defined procedures\n3.6\nApply safety precautions relevant to the task\n4. Resource implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment may\ntake place\n4.2\nMaterials and equipment relevant to the proposed\nactivity or task\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1\nDirect observations/demonstration of candidate’s\napplication of tasks and questioning related to\nunderpinning knowledge\n5.2\nPortfolio\n6. Context for\nassessment\nCompetency may be assessed individually in the actual\nworkplace or simulated environment or in any TESDA\naccredited assessment center.\n\n--- PDF PAGE 43 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n41\n\nUNIT OF COMPETENCY : APPLY FINISHING TOUCHES ON CASUAL\nAPPAREL\n\nUNIT CODE:"
