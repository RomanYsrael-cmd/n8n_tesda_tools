cord information\n4.1 Basic information on the quality performance is\nrecorded in accordance with workplace procedures\n4.2 Records of work quality are maintained according to\nthe requirements of the company\n5. Study causes of quality\ndeviations\n5.1 Causes of deviations from final products are\ninvestigated and reported in accordance with\nworkplace procedures\n5.2 Suitable preventive action is recommended based on\nworkplace quality standards and identified causes of\ndeviation from specified quality standards of materials\nor final product\n\n--- PDF PAGE 28 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n26\n\nRANGE OF VARIABLES\n\nVARIABLES\n\nRANGE\n1. Quality check\n1.1 Visual inspection\n1.2 Physical measurements\n1.3 Check against patterns\n2. Quality standards\n2.1 Materials\n2.2 Component parts\n2.3 Final product\n2.4 Production processes\n3. Quality parameters\n3.1 Finish\n3.2 Fit\n3.3 Size\n3.4 Durability\n3.5 Product variations\n3.6 Materials\n3.7 Alignment\n3.8 Color\n3.9 Damage and imperfections\n\n--- PDF PAGE 29 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n27\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Checked completed work continuously against workplace\nstandard\n1.2 Identified and isolated faulty pieces or final product\n1.3 Checked received materials, component parts or final product\nagainst workplace standards\n1.4 Identified and applied corrective actions on the causes of\nidentified faults\n1.5 Measured materials, component parts or products\n1.6 Recorded basic information regarding quality performance\n1.7 Investigated causes of deviations of materials against standard\n1.8 Recommended suitable preventive actions\n2. Underpinning\nknowledge\n2.1 Relevant quality standards, policies and procedures\n2.2 Characteristics of materials used\n2.3 Safety environment aspects of production processes\n2.4 Relevant measurement techniques and quality checking\nprocedures\n2.5 Workplace procedures\n2.6 Reporting procedures\n3. Underpinning\nskills\n3.1 Interpret work instructions, specifications, standards and\npatterns appropriate to the assessee’s work\n3.2 Carry out relevant visual inspections of materials, component\nparts and final products\n3.3 Carry out relevant physical measurements\n3.4 Maintain accurate work records in accordance with procedures\n3.5 Meet work specifications\n3.6 Communicate effectively within defined workplace procedures\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2 Materials relevant to the proposed activity or task\n5. Methods of\nassessment\n5.1 Direct observation of work activities related to drafting and\ncutting of casual apparel pattern\n5.2 Authenticated transcript of relevant education/training\n6. Context for\nassessment\n6.1 Competency assessment may occur in workplace or in any\nappropriately simulated environment\n6.2 Assessment shall be done while task are being undertaken\n\n--- PDF PAGE 30 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n28\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: DRAFT AND CUT PATTERN FOR CASUAL\nAPPAREL\n\nUNIT CODE: GRM743301\n\nUNIT DESCRIPTOR : This unit covers the outcomes required in drafting and\ncutting basic/block patterns for casual apparel. It\nincludes the requirements for planning garment\ndesign, taking body measurement, drafting basic/block\npattern and cutting final pattern.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in theRange of Variables\n1. Plan garment design\n1.1\nCustomer’s job requirements are determined in\naccordance with company’s practice\n1.2\nGarment design is prepared in accordance with the\nclient’s requirements\n1.3\nDesign and fabric are discussed and selected\naccording to client’s specifications\n1.4\nSpecial needs of the client are incorporated into\nthe design based on procedures\n2. Take client’s body\nmeasurements\n\n2.1\nMeasuring tools are prepared in accordance with\njob requirements.\n2.2\nBody measurements are taken based on\nprocedures\n2.3\nBody measurements of client are taken in\nsequence according to job requirements and\nstandard body measurement\n2.4\nBody measurements are recorded in line with\ncompany requirements/practice\n3. Draft basic/block\npattern\n3.1\nDrafting pattern tools are selected in accordance\nwith job requirements\n3.2\nBasic/Block pattern is drafted using appropriate\nequipment and customer’s specifications\n3.3\nDrafted basic/block pattern is checked for accuracy\nbased on customer’s specification\n\n--- PDF PAGE 31 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n29\n\n4. Manipulate pattern\n\n4.1\nBlock pattern is laid out in accordance with\ncompany procedures\n4.2\nBlock pattern is manipulated in accordance with\ncustomer’s specifications\n4.3\nFinal pattern is labeled, filled and secured as per\nstandard operating procedures (SOPs)\n\n5. Cut final pattern\n\n5.1\nTools for cutting pattern are selected in\naccordance with job requirements\n5.2\nPattern is cut in accordance with customer’s\nspecifications/measurements\n\n--- PDF PAGE 32 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n30\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Job requirements\nInclude but not limited to:\n1.1\nCasual Dress\n1.2\nBlouse\n1.3\nSkirt\n1.4\nTrouser\n1.5\nShirt\n1.6\nShorts\n1.7\nCullottes\n2. Fabric\n2.1\nCotton\n2.2\nPolyester\n2.3\nChaliz\n2.4\nRayon\n2.5\nSatin\n3. Special needs\nKinds of:\n3.1\npocket\n3.2\nstitch\n3.3\ncollar\n3.4\nsleeve\n3.5\nskirt\n3.6\ncut\n4. Measuring tools\n4.1\nTape measure\n4.2\nHip curve rule\n4.3\nL-square\n4.4\nMeter stick\n5. Standard body\nmeasurement\n5.1\nShoulder\n5.2\nNeck circumference\n5.3\nChest width and bust circumference\n5.4\nBust height and width\n5.5\nFigure (