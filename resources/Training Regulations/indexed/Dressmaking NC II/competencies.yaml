              "source_text": "Competency must be assessed through: 5.1 Direct observations/demonstration of candidate’s application of tasks and questioning related to underpinning knowledge 5.2 Portfolio 6. Context for assessment Competency may be assessed individually in the actual workplace or simulated environment or in any TESDA accredited assessment center"
