  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in DRESSMAKING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE\nCOMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant information is accessed from appropriate\nsources\n1.2 Effective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3 Appropriate medium is used to transfer information and ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6 Defined workplace procedures for the location and storage of\ninformation are used\n1.7 Personal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4 Workplace interactions are conducted in a courteous manner\n2.5 Questions about simple routine workplace procedures & maters\nconcerning working conditions of employment are asked and\nresponded to\n2.6 Meetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2 Workplace data is recorded on standard workplace forms and\ndocuments\n3.3 Basic mathematical processes are used for routine calculations\n3.4 Errors in recording information on forms/ documents are identified\nand properly acted upon\n3.5 Reporting requirements to supervisor are completed according to\norganizational guidelines\n\n--- PDF PAGE 5 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1 Team members\n1.2 Suppliers\n1.3 Trade personnel\n1.4 Local government\n1.5 Industry bodies\n2. Medium\n2.1 Memorandum\n2.2 Circular\n2.3 Notice\n2.4 Information discussion\n2.5 Follow-up or verbal instructions\n2.6 Face to face communication\n3. Storage\n3.1 Manual filing system\n3.2 Computer-based filing system\n4. Forms\n4.1 Personnel forms, telephone message forms, safety\nreports\n5. Workplace interactions\n5.1 Face to face\n5.2 Telephone\n5.3 Electronic and two way radio\n5.4 Written including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1 Observing meeting\n6.2 Compliance with meeting decisions\n6.3 Obeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n4\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard\nformat of the organization\n1.2 Accessed information using communication\nequipment\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Effective communication\n2.2 Different modes of communication\n2.3 Written communication\n2.4 Organizational policies\n2.5 Communication procedures and systems\n2.6 Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1 Follow simple spoken language\n3.2 Perform routine workplace duties following simple\nwritten notices\n3.3 Participate in workplace meetings and discussions\n3.4 Complete work related documents\n3.5 Estimate, calculate and record routine workplace\nmeasures\n3.6 Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7 Ability to relate to people of social range in the\nworkplace\n3.8 Gather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1 Fax machine\n4.2 Telephone\n4.3 Writing materials\n4.4 Internet\n5. Methods of\nAssessment\n5.1 Direct Observation\n5.2 Oral interview and written test\n6. Context of\nAssessment\n6.1 Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n5\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1 The role and objective of the team is identified\nfrom available sources of information\n1.2 Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1 Individual role and responsibilities within the team\nenvironment are identified\n2.2 Roles and responsibility of other team members\nare identified and recognized\n2.3 Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1 Effective and appropriate forms of communications\nused and interactions undertaken with team\nmembers who contribute to known team activities\nand objectives\n3.2 Effective and appropriate contributions made to\ncomplement team activities and objectives, based\non individual skills and competencies and\nworkplace context\n3.3 Observed protocols in reporting using standard\noperating procedures\n3.4 Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1 Work activities in a team environment with\nenterprise or specific sector\n1.2 Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of\ninformation\n2.1 Standard operating and/or other workplace\nprocedures\n2.2 Job procedures\n2.3 Machine/equipment manufacturer’s specifications\nand instructions\n2.4 Organizational or external personnel\n2.5 Client/supplier instructions\n2.6 Quality standards\n2.7 OHS and environmental standards\n3. Workplace context\n3.1 Work procedures and practices\n3.2 Conditions of work environments\n3.3 Legislation and industrial agreements\n3.4 Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5 Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n7\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated in a team to complete workplace activity\n1.2 Worked effectively with others\n1.3 Conveyed information in written or oral form\n1.4 Selected and used appropriate workplace language\n1.5 Followed designated work plan for the job\n1.6 Reported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication process\n2.2 Team structure\n2.3 Team roles\n2.4 Group planning and decision making\n3. Underpinning Skills\n3.1 Communicate appropriately, consistent with the\nculture of the workplace\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n 4.2. Materials relevant to the proposed activity or\ntasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of the individual member in relation\nto the work activities of the group\n5.2 Observation of simulation and or role play\ninvolving the participation of individual member to\nthe attainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for\nAssessment\n6.1 Competency may be assessed in workplace or in\na simulated workplace setting\n6.2 Assessment shall be observed while task are\nbeing undertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are\nmaintained in the course of managing oneself based\non performance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3. Maintain professional\ngrowth and development\n3.1 Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2 Recognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.4 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n10\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in\nthe course of managing oneself based on\nperformance evaluation\n1.3 Completed trainings and career opportunities which\nare based on the requirements of the industries\n1.4 Acquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender\nsensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of Assessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 13 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n11\n\nUNIT OF COMPETENCY\n:\n PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE\n:\n 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 14 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with workplace accidents,\nfire and emergencies are followed in accordance\nwith organization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with\nestablished organization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated\nin accordance with workplace requirements\n\n--- PDF PAGE 15 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n13\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4 Ergonomics\n2.5 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.6 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency measures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 16 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n14\n\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n\n 6.1 Medical/Health records\n 6.2 Incident reports\n 6.3 Accident reports\n 6.4 OHS-related training completed\n\n--- PDF PAGE 17 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n15\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3 Recognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based\non threshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\n Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 18 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n16\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nCARRY OUT MEASUREMENTS & CALCULATIONS\nUNIT CODE:\nGRM743203\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\ntaking accurate measurements of the client and\ncalculating/estimating the materials, requirements cost.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain measurements\n1.1 Measurements are obtained to job instructions using\nmeasuring devices\n1.2 Type of measurement to be used is identified.\n2. Perform simple\ncalculations\n\n2.1 Simple calculations are carried out based on the\nrequirements of the situation\n2.2 Correctness of calculations verified based on\nproduction requirements\n3. Estimate approximate\nquantities\n3.1 Measurements or quantities are estimated on job\nrequirements\n\n3.2 Measurements are identified/recorded without error\n\n3.3 Quantities of materials suitable for work undertaken\nare calculated and recorded according to job\ninstructions\n\n3.4 Costs for simple project are estimated to within + or\n10%.\n\n--- PDF PAGE 19 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n17\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Measuring device\n\n1.1 Tape measure\n1.2 Meter stick\n2. Type of measurement\n2.1 English system\n2.2 Metric system\n3. Four fundamental\noperations\n\n3.1 Addition\n3.2 Subtraction\n3.3 Multiplication\n3.4 Division\n4. Points of measurement\nfor different types of\ngarments\n\n4.1 Casual\n4.2 Formal\n4.3 High fashion\n\n--- PDF PAGE 20 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n18\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Use of measuring devices effectively\n1.2 Took and recorded accurate measurements\n1.3 Performed simple calculations according to\nspecifications\n1.4 Estimated quantities and costs according to\nrequirement\n1.5 Communicate effectively to enable accurate\ncalculations and measurements\n2. Underpinning\nknowledge and\nattitudes\n2.1 Drawings and specifications\n2.2 Materials relevant to the construction processes\n2.3 Basic operation in measurement and calculations\n2.4 Costing relative to the construction process\n3. Underpinning skills\n3.1 Read and interpret drawings\n3.2 Measure and calculate manually\n3.3 Record measurement\n3.4 Operate electronic calculating devices\n3.5 Communicate effectively\n4. Resource implications\nThe following resources should be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment may take\nplace\n4.2 Materials relevant to the proposed activity or task\n5. Methods of\nassessment\n5.1 Direct observation of work activities related to\ndrafting and cutting of casual apparel pattern\n6. Context for\nassessment\n6.1 Competency assessment may occur in workplace or\nany appropriately simulated environment\n\n--- PDF PAGE 21 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n19\n\nUNIT OF COMPETENCY:\nSET UP AND OPERATE MACHINE/S\nUNIT CODE:\nGRM743204\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nsetting up and operating machines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Set machines\n1.1 Product specifications are interpreted in relation to\nmachine setting requirements\n\n1.2 Type of sewing machine to be set up is identified in\naccordance with the job requirement\n\n1.3 Machine is set in accordance with product\nspecifications, machine manufacturer’s instructions\nand company procedures\n2. Conduct sample run\n2.1 Materials to be used for sampling are obtained\n\n2.2 Machine is operated in accordance with\nmanufacturer’s and company instructions to produce\na specified sample\n3. Test machine output\n3.1 Machine outputs are tested or organized in\naccordance with company procedures to ensure\nrequired standards of quality are met\n4. Re-adjust machine\nsetting to meet\nrequirements\n4.1 Test results are interpreted to determine adjustment\nrequirements\n\n4.2 Adjustment changes are assessed in accordance\nwith product and machine specifications\n\n4.3 Appropriate production personnel are informed of\nthe availability of the newly set up machine in\naccordance with workplace procedures\n5. Maintain records\n5.1 Records are maintained and reports prepared in\naccordance with the company procedures\n\n--- PDF PAGE 22 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n20\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Type of Machines used\n1.1 Single needle lockstitch machine\n1.2 Double needle lockstitch machine\n1.3 Edging machine\n1.4 Button hole machine\n2. Machine output\n2.1 Product sample\n2.2 Service samples\n2.3 Machine operation\n\n--- PDF PAGE 23 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n21\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted product specifications in relation to\nmachine setting requirements\n1.2 Obtained materials to be used for sampling\n1.3 Operated machines\n1.4 Tested or organized sample to ensure quality\nstandards are met\n1.5 Interpreted test results\n1.6 Assessed adjustment changes\n1.7 Maintained records and prepared reports\n2. Underpinning\nknowledge\n2.1 Setting up and adjustment requirements for the\nrange of machines and equipment used in the\ncompany\n2.2 Quality requirements\n2.3 Machine manufacturer’s specifications\n2.4 Safety and environmental aspects of relevant\ncompany activities\n2.5 Workplace procedures and reporting processes\n2.6 Relevant OH&S legislation and codes of practice\n3. Underpinning skills\n3.1 Set and operate machines\n3.2 Test and analyze samples\n3.3 Apply all relevant safety practices when working in\nthe industry\n3.4 Communicate effectively with individuals, work\ngroups and supervisors\n3.5 Maintain records and document and transfer\ninformation\n3.6 Interpret and carry out established procedures\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2 Materials relevant to the proposed activity or task\n5. Methods of\nassessment\n5.1 Direct observation of work activities related to\ndrafting and cutting of casual apparel pattern\n5.2 Authenticated transcript of relevant\neducation/training\n6. Context for assessment\n6.1 Competency assessment may occur in the\nworkplace or any appropriately simulated\nenvironment\n6.2 Assessment shall be done while task are being\nundertaken\n\n--- PDF PAGE 24 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n22\n\nUNIT OF COMPETENCY\n:\nPERFORM BASIC MAINTENANCE\nUNIT CODE:\nGRM743205\nUNIT DESCRIPTOR:\nThis unit covers the knowledge and skills required in\nperforming minor maintenance of the machines used by\ndressmaker/tailor.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Operate machine and\nassess its performance 1.1 Machine is started and stopped in accordance with\nmanufacturer’s and enterprise requirements\n1.2 Machine operation is monitored to ensure that\ncorrect procedures are assessed and product meets\nquality standards\n1.3 Problem with machine is identified and reported in\naccordance with company procedures\n\n2. Clean and lubricate\nmachine\n2.1 Machine is cleaned and lubricated in accordance\nwith workplace requirements and manufacturer’s\ncleaning and lubricating instructions\n2.2 Machine operation is monitored to ensure correct\nprocedures are carried out and work meets quality\nstandards.\n\n3. Check machine\noperation\n3.1 Machine is checked to ensure correct operation\n3.2 Problems encountered and similar observations are\ndocumented and referred to supervisor or\nappropriate personnel\n\n--- PDF PAGE 25 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n23\n\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n1. Minor machine faults\n1.1 Loose threads\n1.2 Broken needle\n1.3 Machine control\n2. Major machine faults\n2.1 Electric motor defect\n2.2 Timing (not synchronized)\n2.3 Broken body parts\n\n--- PDF PAGE 26 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n24\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Started and stopped machine\n1.2 Monitored machine operations\n1.3 Identified and reported machine problems\n1.4 Identified and corrected minor machine and\nassociated equipment/tools faults\n1.5 Identified and documented major machine or\nproduct faults\n1.6 Recorded and documented machine maintenance\n1.7 Cleaned and lubricated machine\n2. Underpinning\nknowledge\n2.1 Procedures and guidelines for safe operation of\nmachines\n2.2 Typical fault conditions and related fault finding\nprocedures\n2.3 Basic machine maintenance and repair techniques\n2.4 Safety policies and procedures\n2.5 Quality standard procedures\n2.6 Workplace recording and reporting procedures\n3. Underpinning skills\n3.1 Assess operating performance of machine\n3.2 Start and stop machine according to specifications\n3.3 Monitor machine operations\n3.4 Recognize fault conditions\n3.5 Rectify minor machine 