      "text": "5 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”. --- PDF PAGE 57 --- TR Dressmaking NC II (Garment Sector) 03/18/2005 Promulgated March 18, 2005 55 Perform basic maintenance Sew Formal Apparel Sew Casual Apparel Apply Finishing Touches on Casual Apparel Garment (Dressmaking/Tailoring) Sector Draft and Cut Pattern of Formal Apparel Apply Finishing Touches on Formal Apparel Draft and Cut Pattern of High Fashion Apparel Prepare and Cut Materials of Casual Apparel Apply quality standard Carry out measurements and calculation Prepare and Cut Materials of High Fashion Apparel Set-up and operate machines Draft and Cut Pattern of Casual Apparel COR E S N S Prepare and Cut Materials of Formal Apparel Sew High Fashion Apparel Apply Finishing Touches on High Fashion Apparel Lead workplace communication Work with others Work in team environment Lead small teams Solve problems related to work activities Receive and respond to workplace communication Participate in workplace communication C S Apply problem solving techniques to workplace Plan and organize work Practice career professionalism Demonstrate work values Practice occupational health and safety procedures Develop and practice negotiation skills Use mathematical method Use relevant technologies Utilize specialized communication skills Develop team and individual Collect, analyze and organize information Promote environmental protection Practice basic housekeeping procedures --- PDF PAGE 58 --- ________________________________________________________________________________________________ TR Dressmaking NC II (Garment Sector) 03/14/05 Promulgated March 18, 2005 56 Fabric grain refers to woven fabric compose of two sets of yarns (threads) that run at right angle to each other. Manipulation the process of producing another pattern adapting existing blocks pattern. Warp the lengthwise yarn (threads) that run vertically in a woven fabric Weft the crosswise yarn (threads) that run horizontally in a woven fabric Selvedge edge of woven fabric finished to prevent raveling. Design a combination of lines or shapes to form a decoration On grain a fabric is on grain when the lengthwise threads run exactly at right angles to each other. Off grain when the two sets of grain do not run at right angle to each other Specification Sheet refers to a data containing the final instructions regarding sizes, stitches, etc. Style/Design refers to a kind of outlook based on printed materials, shows, trends and market choice. Accents refer to accessories/materials used to enhance and glamorize dress. Examples are beads, pearls, rhinestones, metals, laces and bias. Design Interpretation refers to sketches of design either white or colored interpreted into pattern. Mannequin a three dimensional model of human form used for fitting clothes. It may be made of either fiber glass, ivory, porcelain, wood or paper mache. Finishing Touches refer to work done on a dress to enhance the total quality feature of a product. --- PDF PAGE 59 --- ________________________________________________________________________________________________ TR Dressmaking NC II (Garment Sector) 03/14/05 Promulgated March 18, 2005 57 Blazer refers to the kind of dress for women otherwise called as overcoat. Gown refers to a long dress sometimes made of beads and expensive materials. Casual Dress refers to a dress used for everyday wear (vogue and comfortable) Workplace Quality Standards refer to the expected characteristics of finished garment. The quality standard that applies in the candidate workplace is the standard that is appropriate for assessment --- PDF PAGE 60 --- ________________________________________________________________________________________________ TR Dressmaking NC II (Garment Sector) 03/14/05 Promulgated March 18,