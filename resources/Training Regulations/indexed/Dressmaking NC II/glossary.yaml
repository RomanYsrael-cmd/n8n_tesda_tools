  "source_text": "DEFINITION OF TERMS\n\nFabric grain\nrefers to woven fabric compose of two sets of yarns\n(threads) that run at right angle to each other.\n\nManipulation\nthe process of producing another pattern adapting existing\nblocks pattern.\n\nWarp\nthe lengthwise yarn (threads) that run vertically in a woven\nfabric\nWeft\nthe crosswise yarn (threads) that run horizontally in a\nwoven fabric\n\nSelvedge\nedge of woven fabric finished to prevent raveling.\nDesign\na combination of lines or shapes to form a decoration\n\nOn grain\na fabric is on grain when the lengthwise threads run\nexactly at right angles to each other.\nOff grain\nwhen the two sets of grain do not run at right angle to each\nother\n\nSpecification Sheet\nrefers to a data containing the final instructions regarding\nsizes, stitches, etc.\n\nStyle/Design\nrefers to a kind of outlook based on printed materials,\nshows, trends and market choice.\nAccents\nrefer to accessories/materials used to enhance and\nglamorize dress. Examples are beads, pearls, rhinestones,\nmetals, laces and bias.\nDesign\nInterpretation\nrefers to sketches of design either white or colored\ninterpreted into pattern.\nMannequin\na three dimensional model of human form used for fitting\nclothes. It may be made of either fiber glass, ivory,\nporcelain, wood or paper mache.\nFinishing Touches\nrefer to work done on a dress to enhance the total quality\nfeature of a product.\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________\nTR Dressmaking NC II (Garment Sector) 03/14/05 Promulgated March 18, 2005\n\n57\n\nBlazer\nrefers to the kind of dress for women otherwise called as\novercoat.\nGown\nrefers to a long dress sometimes made of beads and\nexpensive materials.\n\nCasual Dress\nrefers to a dress used for everyday wear (vogue and\ncomfortable)\nWorkplace Quality\nStandards\nrefer to the expected characteristics of finished garment. The\nquality standard that applies in the candidate workplace is\nthe standard that is appropriate for assessment\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________\nTR Dressmaking NC II (Garment Sector) 03/14/05 Promulgated March 18, 2005\n\n58"
