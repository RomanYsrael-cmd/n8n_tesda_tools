    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Dressmaking NC II.\n\nThis includes information on curriculum design; training delivery; trainee\nentry requirements; tools and equipment; training facilities; and trainers\nqualification.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DRESSMAKING NC Level: NC II\nNominal Training Duration: 18 Hours (Basic)\n 17 Hours (Common)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nDressmaker in accordance with industry standards. It covers the basic, common\nand core competencies.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n\nDiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 49 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n47\n\nCOMMON COMPETENCY\n\nSector: GARMENTS\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Carry Out\nMeasurements &\nCalculations\n\n1.1 Read and interpret\ndrawings\n1.2 Obtain measurements\n1.3 Perform simple\ncalculation\n1.4 Estimate approximate\nquantities\n\nGroup\ndiscussion\n\nPractical\nExercises\n\nObservation\n\nWritten Exam.\n\n2. Apply Quality\nStandards\n\n2.1 Assess own work\nbase on workplace\nstandard\n2.2 Assess quality of\ncomponent parts and\ntake corrective actions\n2.3 Measure parts using\nappropriate instrument\n2.4 Record information in\naccordance to\nworkplace procedures\n2.5 Study causes of quality\ndeviations and\nrecommend\npreventive action\n\nGroup\ndiscussion\n\nInteraction\n\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n\n3. Perform Basic\nMaintenance\n\n3.1 Operate machine and\nassess its\nperformance\n3.2 Clean and lubricate\nmachine\n3.3 Check machine\noperation\n\nGroup\ndiscussion\n\nInteraction\n\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n4. Set up and operate\nmachines\n4.1 Set machines\n4.2 Conduct sample run\n4.3 Test machine output\n4.4 Re- adjust machine\nsetting to meet\nrequirements\n4.5 Maintain records and\nprepare report.\nGroup\ndiscussion\nInteraction\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n\n--- PDF PAGE 50 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n48\n\nCORE COMPETENCIES\n\nCourse Title: DRESSMAKING NC Level: NC II\n\nNominal Training Duration: 240 Hrs.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nDressmaker in accordance with industry standards. It covers specialized\ncompetencies on drafting and cutting pattern, preparing and cutting materials,\nsewing, and applying finishing touches for casual apparels.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Draft and cut\npattern for casual\napparel\n\n1.1 Plan garment design\n\n1.2 Take clients body\nmeasurement\n\n1.3 Draft basic/block\npattern\n\n1.4 Manipulate pattern\n\n1.5 Cut final pattern\n\nDiscussion\n\nDiscussion\nDemonstration\n\nDiscussion\nDemonstration\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nSketching/Actu\nal Designing\nDemonstration\nObservation\n\nDemonstration\nObservation\n\nDemonstration\n\nDemonstration\n\n2. Prepare and cut\nmaterials for\ncasual apparel\n\n2.1 Prepare materials\n(fabric)\n\n2.2 Layout and mark\npattern on material\n\n2.3 Cut materials\n\nDiscussion\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration\n\nDemonstration\n\nDemonstration\n\n--- PDF PAGE 51 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n49\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n3. Sew casual apparel\n\n3.1 Prepare cut parts\n\n3.2 Prepare sewing\nmachine for\noperation\n\n3.3 Sew and assemble\ngarment parts\n\n3.4 Alter completed\ngarment\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration\n\nDemonstration\n\nDemonstration\nActual sewing\n\nDemonstration\nActual sewing\n\n4. Apply finishing\ntouches on casual\napparel\n\n4.1 Apply finishing\ntouches\n\n4.2 Trim excess threads\n\n4.3 Press finished\ngarment\n\n4.4 Package the\nfinished garment\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\n--- PDF PAGE 52 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n50\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n--- PDF PAGE 53 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n51\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• can communicate both oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 TOOLS AND EQUIPMENT AND MATERIALS\nDRESSMAKING – NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Dressmaking - NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n25\npcs\nTape Measure\n25\nunits\nSingle Needle Lockstitch\nMachines\n25\npcs\nPencils\n25\npcs\nHip- curve\n10\nunits\nHigh Speed Machines\nAttachment\n25\nrolls\nPattern Paper\n10\npcs\nMeter stick\n5\nunits\n3 Threads over lock\nmachine\n25\npcs\nTailor’s Chalk\n25\npcs\nFrench curve\n5\nunits\nFlat Iron\n25\npacks\nDressmaker’s\nTracing Paper\n25\npairs\nScissors\n5\nunits\nSteam Press\n75\ncones\nThread\n(assorted\ncolors)\n25\npairs\nCutting Shears\n5\nunits\nIroning Board\n2\ngross\nButtons\n25\npcs\nL-square\n10\nunits\nCutting Table\n75\npcs\nZipper 8”\n25\npcs\nTransparent ruler\nwith grid 24\n25\npcs\nStools\n25\npcs\nRecord Book\n10\npcs\nBasin/Pail\n1\npc\nButton Holer\n75\npcs\nZipper 20”\n25\npcs\nSewing Box\n10\nunits\nBody Form/Model\n12.5\nyds\nFusible\nInterlining\n\n--- PDF PAGE 54 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n52\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n25\npcs\nTracing wheel\n25\npcs\nCalculator\n2 rolls\nBand Roll\n10 doz\nHanger\n3\nunits\nHanger Rack\n1 box\nHook and Eye\n(big)\n25 pcs\nScrew Driver flat\n(medium)\n25\npcs\nBobbin Case\n1 box\nHook and Eye\n(Small)\n25 pcs\nScrew Driver flat\n(small)\n50\npcs\nBobbin Spool\n3 gals\nMachine Oil\n25 pcs\nTriangle 16” 45 x\n90\n5\npcs\nButton holer\nAttachments\n25\npcs\nEraser\n5\npcs\nHand Spray\n5\npcs\nZipper foot\n8\npacks\nNeedle DB x1\n# 14\n25 pcs\nSeam Ripper\n5\npcs\nZipper foot invisible\n4\npacks\nNeedle DB x1\n# 11\n25 pcs\nPin Cushion\n5\npcs\nShirring foot\n3\npacks\nNeedle DCx1\n# 14\n\n10\npcs\nSleeve Board/Ham\n3\npacks\nNeedle\nDPx5# 14\n\n2\npcs\nDisplay Cabinet\n3\npacks\nHand Needle\n\nFabrics for\nBlouse\n\nFabric for\nSkirt\n\nFabric for\nDress\n10 m\nClothes line\n\n2\nboxes\nPin\n\n--- PDF PAGE 55 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n53\n\n3.5 TRAINING FACILITIES\nDRESSMAKING NC - II\n\nBased on a class intake of 25 students/trainees, the space requirements and\ntheir corresponding sizes are as follows\n\nSpace Requirement\n\nSize in Meters\n\nArea in Sq. Meters\n\nTotal Area in\nSq. Meters\n\nBuilding (permanent)\n\n176.25 sq. m.\n\nStudent/Trainee\nWorking Space\n\n1.5 x 1.5 m.\n\n2.25 sq. m.\n\n56.25 sq. m\n\nLecture/Demo Room\n\n1.5 x 2 m.\n\n3 sq. m.\n\n78 sq. m.\n\nLearning Resource\nCenter\n\n3 x 5 m.\n\n15 sq. m.\n\n15 sq. m.\n\nFacilities/Equipment/\nCirculation Area\n\n1.5 x 2 m.\n\n3 sq. m.\n\n27 sq. m.\n\n3.6 TRAINERS’ QUALIFICATION\nDRESSMAKING - NC II\n\nTRAINER QUALIFICATION (TQ II)\n\nTo qualify as trainer for dressmaking NC II, the person must:\n•\nbe a holder of NC III or its equivalent\n•\nhave undergone training on Training Methodology II (TM II)\n•\nbe physically and mentally fit\n•\n* have at least 2 years job/industry experience\n\n * Optional. Only when required by the hiring institution\n\n Reference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 56 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n54"
  },
