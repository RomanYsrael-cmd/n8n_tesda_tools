    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: DRESSMAKING NC Level: NC II\nNominal Training Duration: 18 Hours (Basic)\n 17 Hours (Common)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nDressmaker in accordance with industry standards. It covers the basic, common\nand core competencies.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n\nDiscussion\nInteraction\nDemonstration\nObservation\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 49 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n47\n\nCOMMON COMPETENCY\n\nSector: GARMENTS\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Carry Out\nMeasurements &\nCalculations\n\n1.1 Read and interpret\ndrawings\n1.2 Obtain measurements\n1.3 Perform simple\ncalculation\n1.4 Estimate approximate\nquantities\n\nGroup\ndiscussion\n\nPractical\nExercises\n\nObservation\n\nWritten Exam.\n\n2. Apply Quality\nStandards\n\n2.1 Assess own work\nbase on workplace\nstandard\n2.2 Assess quality of\ncomponent parts and\ntake corrective actions\n2.3 Measure parts using\nappropriate instrument\n2.4 Record information in\naccordance to\nworkplace procedures\n2.5 Study causes of quality\ndeviations and\nrecommend\npreventive action\n\nGroup\ndiscussion\n\nInteraction\n\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n\n3. Perform Basic\nMaintenance\n\n3.1 Operate machine and\nassess its\nperformance\n3.2 Clean and lubricate\nmachine\n3.3 Check machine\noperation\n\nGroup\ndiscussion\n\nInteraction\n\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n4. Set up and operate\nmachines\n4.1 Set machines\n4.2 Conduct sample run\n4.3 Test machine output\n4.4 Re- adjust machine\nsetting to meet\nrequirements\n4.5 Maintain records and\nprepare report.\nGroup\ndiscussion\nInteraction\nObservation\n\nDemonstration\n\nInterviews/\nQuestioning\n\n--- PDF PAGE 50 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n48\n\nCORE COMPETENCIES\n\nCourse Title: DRESSMAKING NC Level: NC II\n\nNominal Training Duration: 240 Hrs.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nDressmaker in accordance with industry standards. It covers specialized\ncompetencies on drafting and cutting pattern, preparing and cutting materials,\nsewing, and applying finishing touches for casual apparels.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Draft and cut\npattern for casual\napparel\n\n1.1 Plan garment design\n\n1.2 Take clients body\nmeasurement\n\n1.3 Draft basic/block\npattern\n\n1.4 Manipulate pattern\n\n1.5 Cut final pattern\n\nDiscussion\n\nDiscussion\nDemonstration\n\nDiscussion\nDemonstration\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nSketching/Actu\nal Designing\nDemonstration\nObservation\n\nDemonstration\nObservation\n\nDemonstration\n\nDemonstration\n\n2. Prepare and cut\nmaterials for\ncasual apparel\n\n2.1 Prepare materials\n(fabric)\n\n2.2 Layout and mark\npattern on material\n\n2.3 Cut materials\n\nDiscussion\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration\n\nDemonstration\n\nDemonstration\n\n--- PDF PAGE 51 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n49\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n3. Sew casual apparel\n\n3.1 Prepare cut parts\n\n3.2 Prepare sewing\nmachine for\noperation\n\n3.3 Sew and assemble\ngarment parts\n\n3.4 Alter completed\ngarment\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration\n\nDemonstration\n\nDemonstration\nActual sewing\n\nDemonstration\nActual sewing\n\n4. Apply finishing\ntouches on casual\napparel\n\n4.1 Apply finishing\ntouches\n\n4.2 Trim excess threads\n\n4.3 Press finished\ngarment\n\n4.4 Package the\nfinished garment\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration &\nQuestioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\nDemonstration\n& Questioning\n\n--- PDF PAGE 52 ---\nTR Dressmaking NC II (Garment Sector) Promulgated March 18, 2005\n50"
