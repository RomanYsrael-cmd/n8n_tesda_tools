result will be an even shade\nColor\nstripping\n- removing artificial color by bleaching or chemical color stripper\nColor test/tint\n- a method of determining the action of color on a small strand of hair\nConditioner\n- creams, waxes and oils which help protect and maintain the health\nand condition of the hair\nConditioning - the application of special chemical agents to the hair to help restore\nits strength and give it body in order to protect it against possible\nbreakage\nContour\nwinding\n- a loose wave, winding the perm rods to the contour of the head -\nshape\nCuticle\n- the outer layer of the hair; the hard skin at the base of the fingernail\nDesign\n- a plan or arrangement of a hairstyle\nDiffuser\n- an attachment on a blow dryer that “shatters’ the flow of air so that the\nhair can be soft styled\nDye\n- to color or stain the hair with tint\nElasticity\n- the ability of the hair to stretch and return to its original form without\nbreaking\nEmulsifying\n- a substance used to form an emulsion, e.g. shampoo\n\n--- PDF PAGE 82 ---\nTR - Hairdressing NC III\nAmended\n 78\nagent\nEnd paper\n- a small paper tissue used at the end of a strand of hair to assist the\nwinding of the perm rod\nFrosting\n- to lighten or darken small selected strands of hair over the entire head\nto blend with the root of the hair\nGraduation\n- the grade at which the hair is cut by degrees\nGuideline\n- a line to follow when shaping the balance of the hair\nHair analysis\n- an examination to determine the condition of the hair prior to a hair\ntreatment\nHair Density\n- the amount of hair strands per square inch on the scalp\nHair Cutting\n- a process to thinning, tapering and shortening of the hair into a\nbecoming shapes or styles\nHair\nExtension\n- process used to add volume or length to your hair by bonding\nsynthetic or real hair at your roots.\nHairstyling\n- a process of arranging the hair into a temporary design\n\n- Involves arranging the hair in a particular style, appropriately suited to\nthe cut, and may require the use of hairstyling aid such as hair spray,\ngel or mousse\nHair stylist\n- a person who designs and dresses the hair\nHot oil\ntreatment\n- a process of treating hair and scalp\nIrons\n- one of the most important hair tool inventions in the last 20 years.\nCreates poker straight hair as well as beautiful curls depending on\nwhich technique you use\nKeratin\n- keratin is a protein that your hair is made up of.\nLayer/\nLayering\n- holding the hair out from the head at a 90 degree angle and then\nremoving a defined amount to remove volume, give movement, and\nadded texture\nLysine\n- an animo acid found in hair\nMedulla\n- a hollow pith or core of the hair fibre.\nMelanin\n- the dark or black pigment in the epidermis and hair, and in the\nchoroids or coat of the eye\nNeutralizer\n- an agent capable of neutralizing another substance\nNormal hair\nshedding\n- a certain amount of hair is shed daily. This is nature’s method to make\nway for new hair. The average daily shedding is estimated at 50-80\nhairs. Hair loss beyond this estimated average indicates some scalp\nor hair trouble.\nLayering\n- is a technique used by hairdressers to change the thickness of the\nhair, creating either a thinning or thicker appearance. In this way the\nhair can be given a fuller appearance, more texture and movement.\nPatch or skin\ntest\n- test to prove that chemicals will have no allergic reaction on scalp\nPerm\n- abbreviation for permanent wave\nPorosity\n- ability of the hair to absorb moisture\nRebonding\n- rejoining the lines and bonds on the keratin chais – neutralizing\n\n--- PDF PAGE 83 ---\nTR - Hairdressing NC III\nAmended\n 79\nRelaxer\n- a chemical applied to the hair to remove the natural curl\nRetouch\n- to recolor the regrowth\nSectioning\n- sectioning your hair allows you to only pay attention to a particular\narea or panel of hair. You or your hairdresser will do this when blow-\ndrying, cutting or colouring your hair, and will section your hair by\ntaking a panel of hair and pinning or ignoring the rest.\nSetting lotion\n- a liquid used to facilitate setting, retaining the holding power of the set\n(or blow dry) by coating the hair fibre and thereby resisting the\nabsorption of moisture\nSerum\n- a serum is a smoothing product to stop your hair from frizzing,\nkeeping it smooth and straight. You’ll be able to find a serum that is\nspecifically designed to your own hair type.\nShimmering\n- shading or tinting parts of the hair to enhance the style\nShingling\n- is cutting the hair close to the nape and gradually longer toward the\ncrown, without showing a definite line\nSlithering\n- tapering the hair to graduated length with scissors\nSpiral\nwinding\n- winding the hair from roots to points.\nStack\nwinding\n- a method of permanent waving whereby the perm rod are built up on\ntop of each other, in a pile\nStreaking\n- layers or strands of hair with a contrasting color, usually placed so as\nto enhance the appearance\nSymmetrical\n- hair equally distributed on both sides of the head\nTaper\n- to diminish a strand of hair gradually toward the points by cutting.\nRemoving bulk from the ends of the hair\nThinning\n- removing bulk from the hair\nToners\n- the colors applied to hair which has been lightened – delicate pastel\nshades, e.g. champagne, beige, silver\nTexture\n- coarseness and fineness of the hair\nTexturizing\n- is performed after the over all cut has been completed. Thinning or\nnotching are used to create wispy or spiky effect.\nTreatment\n- a treatment is used in between Shampoo and Conditioner to put\nprotein back into the hair. You should leave the treatment in your hair\nfor approximately 5 minutes before using your conditioner. You’ll be\nable to find a treatment designed for your hair type.\nTrichologist\n- a person trained in the science of caring for the hair\nTrichology\n- the study of the structure and functions of the hair\nVent brush\n- a brush with widely spaced plastic bristles designed to be used while\nblow drying\nWig\n- An artificial covering for the head consisting of a newtwork of\ninterwoven hair\n\n--- PDF PAGE 84 ---\nTR - Hairdressing NC III\nAmended\n 80\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nINDUSTRY EXPERTS\n\nREVIEW PANEL (2010)\n\nEMMA P. ALBIOR\nMARIA EVANGELINE V. BERTUMEN\nPhilippine International Haircutters\nPhilippine International Haircutters Association\nAssociation (PIHA)\n(PIHA)\n#2 Anonas St., Project 3, Quezon City\n#2 Anonas St., Project 3, Quezon City\nLOURDES D. CO\nALEXANDER S. DUNGO\nTrainer/Expert\nPhilippine International Haircutters\nTony Galvez School of Cosmetology\nAssociation (PIHA)\n9th Ave., Cubao, Quezon City\n#2 Anonas St., Project 3, Quezon City\nANTONIO M. GALVEZ\nWILFREDO T. GARCIA\nOwner/Industry Expert\nPhilippine International Haircutters\nTony Galvez Salon/ Tony Galvez School\nAssociation (PIHA)\nof Cosmetology\n#2 Anonas St., Project 3, Quezon City\n(Member, International Cosmetology\nGEORGE A. MANUEL\nOrganization (ICLO))\nPhilippine International Cosmetologists\n9th Ave., Cubao, Quezon City\nAssociation (PICA)\nAZUCENA P. INOCENCIO\n#69 Scout Rallos St.\nPhilippine International Haircutters\nTomas Morato, Quezon City\nAssociation (PIHA)\nFRED ALLAN PENALES\n#2 Anonas St., Project 3, Quezon City\nPhilippine International Cosmetologists\nLUISITO C. ORTIZ\nAssociation (PICA)\nPhilippine International Cosmetologists\n#69 Scout Rallos St.\nAssociation (PICA)\nTomas Morato, Quezon City\n#69 Scout Rallos St.\nAMBROSIO G. POLICARPIO\nTomas Morato, Quezon City\nPhilippine International Cosmetologists\nLOURD RYAN A. RAMOS\nAssociation (PICA)\nPhilippine International Cosmetologists\n#69 Scout Rallos St.