  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of HAIRDRESSING NC III, the candidate must\ndemonstrate competence in all the units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate by the TESDA Director\nGeneral.\n\n4.2 The qualification of HAIRDRESSING NC III may be attained through demonstration of\ncompetence in a project-type assessment covering the following core units of the\nQualification:\n\n4.2.1 Perform creative hairstyling\n4.2.2 Perform advanced/creative haircutting\n4.2.3 Perform advanced/creative hair coloring\n4.2.4 Perform advanced/creative hair perming\n4.2.5 Perform advanced make-up\n\n4.3 Certificate of Competency (COC) can be issued to successful candidate who passes\nthe assessment in the core unit on Perform advanced make-up.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal and non-formal including enterprise-based training\nprograms\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 80 ---\nTR - Hairdressing NC III\nAmended\n 76\n\nPerform\nhair\nbleaching\nCOM PETENCY M AP\nHEALTH, SO CIAL AND OTHER CO M M UNITY DEV’T\nSERVICES SECTOR – COSM ETOLOG Y SUB-SECTOR\nHAIRDRESSING N C III\nMaintain an\neffective\nrelationship\nwith clients/\ncustom ers\nApply\nquality\nstandards\nManage\nown\nperform ance\nCOMMON\nCOMPETENCIES\nMaintain a safe,\nclean and\nefficient\nenvironm ent\nDem onstrate\nwork values\nPractice\nhousekeeping\nprocedures\nPar