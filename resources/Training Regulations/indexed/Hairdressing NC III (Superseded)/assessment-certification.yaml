hat the color result will be an even shade Color stripping - removing artificial color by bleaching or chemical color stripper Color test/tint - a method of determining the action of color on a small strand of hair Conditioner - creams, waxes and oils which help protect and maintain the health and condition of the hair Conditioning - the application of special chemical agents to the hair to help restore its strength and give it body in order to protect it against possible breakage Contour winding - a loose wave, winding the perm rods to the contour of the head - shape Cuticle - the outer layer of the hair; the hard skin at the base of the fingernail Design - a plan or arrangement of a hairstyle Diffuser - an attachment on a blow dryer that “shatters’ the flow of air so that the hair can be soft styled Dye - to color or stain the hair with tint Elasticity - the ability of the hair to stretch and return to its original form without breaking Emulsifying - a substance used to form an emulsion, e.g. shampoo --- PDF PAGE 82 --- TR - Hairdressing NC III Amended 78 agent End paper - a small paper tissue used at the end of a strand of hair to assist the winding of the perm rod Frosting - to lighten or darken small selected strands of hair over the entire head to blend with the root of the hair Graduation - the grade at which the hair is cut by degrees Guideline - a line to follow when shaping the balance of the hair Hair analysis - an examination to determine the condition of the hair prior to a hair treatment Hair Density - the amount of hair strands per square inch on the scalp Hair Cutting - a process to thinning, tapering and shortening of the hair into a becoming shapes or styles Hair Extension - process used to add volume or length to your hair by bonding synthetic or real hair at your roots. Hairstyling - a process of arranging the hair into a temporary design - Involves arranging the hair in a particular style, appropriately suited to the cut, and may require the use of hairstyling aid such as hair spray, gel or mousse Hair stylist - a person who designs and dresses the hair Hot oil treatment - a process of treating hair and scalp Irons - one of the most important hair tool inventions in the last 20 years. Creates poker straight hair as well as beautiful curls depending on which technique you use Keratin - keratin is a protein that your hair is made up of. Layer/ Layering - holding the hair out from the head at a 90 degree angle and then removing a defined amount to remove volume, give movement, and added texture Lysine - an animo acid found in hair Medulla - a hollow pith or core of the hair fibre. Melanin - the dark or black pigment in the epidermis and hair, and in the choroids or coat of the eye Neutralizer - an agent capable of neutralizing another substance Normal hair shedding - a certain amount of hair is shed daily. This is nature’s method to make way for new hair. The average daily shedding is estimated at 50-80 hairs. Hair loss beyond this estimated average indicates some scalp or hair trouble. Layering - is a technique used by hairdressers to change the thickness of the hair, creating either a thinning or thicker appearance. In this way the hair can be given a fuller appearance, more texture and movement. Patch or skin test - test to prove that chemicals will have no allergic reaction on scalp Perm - abbreviation for permanent wave Porosity - ability of the hair to absorb moisture Rebonding - rejoining the lines and bonds on the keratin chais – neutralizing --- PDF PAGE 83 --- TR - Hairdressing NC III Amended 79 Relaxer - a chemical applied to the hair to remove the natural curl Retouch - to recolor the regrowth Sectioning - sectioning your hair allows you to only pay attention to a particular area or panel of hair. You or your hairdresser will do this when blow- drying, cutting or colouring your hair, and will section your hair by taking a panel of hair and pinning or ignoring the rest. Setting lotion - a liquid used to facilitate setting, retaining the holding power of the set (or blow dry) by coating the hair fibre and thereby resisting the absorption of moisture Serum - a serum is a smoothing product to stop your hair from frizzing, keeping it smooth and straight. You’ll be able to find a serum that is specifically designed to your own hair type. Shimmering - shading or tinting parts of the hair to enhance the style Shingling - is cutting the hair close to the nape and gradually longer toward the crown, without showing a definite line Slithering - tapering the hair to graduated length with scissors Spiral winding - winding the hair from roots to points. Stack winding - a method of permanent waving whereby the perm rod are built up on top of each other, in a pile Streaking - layers or strands of hair with a contrasting color, usually placed so as to enhance the appearance Symmetrical - hair equally distributed on both sides of the head Taper - to diminish a strand of hair gradually toward the points by cutting. Removing bulk from the ends of the hair Thinning - removing bulk from the hair Toners - the colors applied to hair which has been lightened – delicate pastel shades, e.g. champagne, beige, silver Texture - coarseness and fineness of the hair Texturizing - is performed after the over all cut has been completed. Thinning or notching are used to create wispy or spiky effect. Treatment - a treatment is used in between Shampoo and Conditioner to put protein back into the hair. You should leave the treatment in your hair for approximately 5 minutes before using your conditioner. You’ll be able to find a treatment designed for your hair type. Trichologist - a person trained in the science of caring for the hair Trichology - the study of the structure and functions of the hair Vent brush - a brush with widely spaced plastic bristles designed to be used while blow drying Wig - An artificial covering for the head consisting of a newtwork of interwoven hair --- PDF PAGE 84 --- 