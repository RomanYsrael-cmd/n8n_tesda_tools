        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:\n1.1 Consulted client on desired prosthetics and special effects  \n         make-up \n1.2  Prepared tools, equipment and supplies/materials  \n         according to client’s requirements and OH&S     \n         requirements \n1.3 Performed prosthetic and special effect s make-up  \nprocedures and techniques according to client desired   \nresults, manufacturer’s specifications \n1.4 Performed cross checking and applied appropriate  \nfinishing touches \n1.5 Maintained hairpieces according to manufacturer’s  \ninstructions \n1.6 Used protective clothing according to health and  \nsanitation regulations \n1.7 Followed safety precautions to clients during the entire  \nprocess \n1.8  Applied appropriate measures in response to emergencies  \nor unavoidable circumstances \n1.9  Performed post-service activities according to OH&S  \nrequirements \n2. Underpinning \nknowledge  \n2.1     Different prosthetics\n2.2     Color design principles \n2.3     Products and color application techniques \n2.4     Cosmetic chemistry/ingredients relevant to make-up      \n          products in regard to the effects on the skin \n2.5     Physical appearance of various skin types \n2.6     Effects of lighting natural/artificial on make-up \n2.7     Facial areas requiring highlighting/shading \n2.8     Designs and make-up plans \n2.9     First aid treatment \n2.10   DOH and OH&S requirements \n2.11   Code of ethics   \n3. Underpinning \nskills \n3.1 Sketching and modeling\n3.2 Conducting research relevant to making prosthetics and \nspecial effects make-up \n3.3 Designing prosthetics and special effects make-u[ \n3.4 Apply basic understanding of anatomy and physiology of \nthe skin and skin structures as they relate  to make-up \nservices \n3.5 Interpreting production requirements \n3.6 Making, applying, fitting, cutting and sealing prosthetics \nand special effects make-up \n3.7 Complying with DOH and OH&S requirements \n3.8 Applying first-aid treatment \n3.9 Observing code of ethics\n4. Resource \nimplications \nThe following resources MUST be provided:\n4.1 Model \n4.2 Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3  Working area / facilities \n5. Method of \nassessment \nCompetency may be assessed through:\n5.1    Demonstration with  Oral Questioning \n5.2   Third-Party Report \n5.3  Portfolio\n6. Context of \nassessment\nCompetency may be assessed in the workplace or TESDA \naccredited assessment center",
