          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained a professional image\n1.2 Interpreted client/customer requirements from information\ncontained in the client brief and/or assignment instructions\n1.3 Dealt successfully with a variety of client/customer interactions\n1.4 Monitored and acted on changing client or customer needs\n1.5 Met client/customer requirements\n1.6 Built credibility with customers/clients\n2. Underpinning\nknowledge\nand attitudes\n2.1 Uniform and personal grooming requirements of the employer and\nthe client\n2.2 Occupational Health and safety requirement for the assignment\n2.3 Assignment Instructions\n3. Underpinning\nskills\n3.1 Attention to detail when completing client/employer documentation\n3.2 Interpersonal and communication skills required in client contact\nassignments\n3.3 Customer service skills required to meet client/customer needs\n3.4 Punctuality\n3.5 Customer Service\n3.6 Telephone Technique\n3.7 Problem Solving and Negotiation\n3.8 Maintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9 Assessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3Observation with questioning\n6. Context of\nassessment\n6.1 Company\n6.2 On-Site\n6.3 Assessment activities are carried out through TESDA accredited\nassessment centers/venues by using closely simulated\nworkplace environment.\n6.4 Continuous assessment in an institutional setting that stimulates\nthe conditions of performance describe in the elements,\nperformance criteria and range of variables statement that make\nup this unit.\n6.5 Continuous assessment in the workplace, taking into account the\nrange of variables affecting performance.\n6.6 Self-assessment on the same terms as those described above.\n6.7 Simulated assessment or critical incident assessment, provided\nthat the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria.\n\n--- PDF PAGE 26 ---\nTR - Hairdressing NC III\nAmended\n 22\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:"
        },
        "source_text": "HCS516201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin building and maintaining an effective relationship with\nclients, customers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a\nprofessional image\n\n1.1 Uniform and personal grooming maintained to\nassignment requirements\n1.2 Personal presence maintained according to employer\nstandards\n1.3 Visible work area kept tidy and uncluttered\n1.4 Equipment stored according to assignment\nrequirements\n2. Meet client/customer\nrequirements\n2.1 Client requirements identified and understood by\nreferral to the assignment instructions\n2.2 Client requirements met according to the assignment\ninstructions\n2.3 Changes to client’s needs and requirements\nmonitored and appropriate action taken\n2.4 All communication with the client or customer is clear\nand complies with assignment requirements\n3. Build credibility with\ncustomers/clients\n3.1 Client expectations for reliability, punctuality and\nappearance adhered to\n3.2 Possible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.3 Client fully informed of all relevant security matters in a\ntimely manner and according to agreed reporting\nprocedures\n\n--- PDF PAGE 24 ---\nTR - Hairdressing NC III\nAmended\n 20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1 Stance\n1.2 Posture\n1.3 Body Language\n1.4 Demeanour\n1.5 Grooming\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n3. Client Requirements\nMay include:\n3.1 Assignment Instructions\n3.2 Post Orders\n3.3 Scope to modify instructions/orders in light of changed\nsituations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1 Writing\n4.2 Verbally\n4.3 Electronically\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1 Implementing required changes\n6.2 Referral to appropriate employer personnel\n6.3 Clarification of client needs and instructions\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 25 ---\nTR - Hairdressing NC III\nAmended\n 21\nEVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained a professional image\n1.2 Interpreted client/customer requirements from information\ncontained in the client brief and/or assignment instructions\n1.3 Dealt successfully with a variety of client/customer interactions\n1.4 Monitored and acted on changing client or customer needs\n1.5 Met client/customer requirements\n1.6 Built credibility with customers/clients\n2. Underpinning\nknowledge\nand attitudes\n2.1 Uniform and personal grooming requirements of the employer and\nthe client\n2.2 Occupational Health and safety requirement for the assignment\n2.3 Assignment Instructions\n3. Underpinning\nskills\n3.1 Attention to detail when completing client/employer documentation\n3.2 Interpersonal and communication skills required in client contact\nassignments\n3.3 Customer service skills required to meet client/customer needs\n3.4 Punctuality\n3.5 Customer Service\n3.6 Telephone Technique\n3.7 Problem Solving and Negotiation\n3.8 Maintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9 Assessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3Observation with questioning\n6. Context of\nassessment\n6.1 Company\n6.2 On-Site\n6.3 Assessment activities are carried out through TESDA accredited\nassessment centers/venues by using closely simulated\nworkplace environment.\n6.4 Continuous assessment in an institutional setting that stimulates\nthe conditions of performance describe in the elements,\nperformance criteria and range of variables statement that make\nup this unit.\n6.5 Continuous assessment in the workplace, taking into account the\nrange of variables affecting performance.\n6.6 Self-assessment on the same terms as those described above.\n6.7 Simulated assessment or critical incident assessment, provided\nthat the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria.\n\n--- PDF PAGE 26 ---\nTR - Hairdressing NC III\nAmended\n 22\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:"
