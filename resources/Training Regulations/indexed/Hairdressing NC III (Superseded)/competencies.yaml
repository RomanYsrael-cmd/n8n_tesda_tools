        "source_title": "MAINTAIN A SAFE, CLEAN AND EFFICIENT WORK ENVIRONMENT",
        "source_text": "--- PDF PAGE 32 ---\nTR - Hairdressing NC III \nAmended    \n 28 \nUNIT OF COMPETENCY : \nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK \nENVIRONMENT \n \nUNIT CODE \n: \nHCS515205 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes needed \nto maintain client relations. The unit incorporates the work \nsafety guidelines. It encompasses competencies necessary \nto maintain a safe workplace for staff, clients and others. It \nalso involves the application of health regulations, including \npersonal hygiene practiced by staff members, provision of a \ncaring client environment and the efficient operation of the \nsalon. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Comply with health \nregulations \n \n1.1\nSalon policies and procedures for personal hygiene \napplied \n1.2 \nProcedures and practices implemented in a variety of \nsalon situations in accordance with state and local \ngovernment health regulations\n2.  Assess own work\n2.1 Reception, work areas and walkways maintained in a \nsafe, uncluttered and organized manner according to \nsalon policy \n2.2 All routines carried out safely, effectively with minimum \ninconvenience to clients and staff \n2.3 Waste is stored and disposed of according to OHSC \nrequirements \n2.4 Spills, food, waste, hair or potential hazards promptly \nremoved from floors according to salon policy \n2.5 Linen is stored, cleaned and disinfected in line with OHS \nrequirements and salon procedures. \n2.6 Refreshments are provided to all clients\n3.  Check and maintain \ntools and \nequipment \n3.1\nTools and equipment are stored safely and in position to \ncomply with salon requirements and local health \nregulations \n3.2 Tools and equipment are prepared for specific services \nas required \n3.3 Tools and equipment are checked for maintenance \nrequirements \n3.4\nTools and equipment are referred for repair as required\n4.  Check and maintain \nstocks \n \n4.1\nStock rotation procedures are carried out routinely and \naccurately according to salon procedures \n4.2 \nStock levels are accurately recorded according to salon \nprocedures \n4.3 \nUnder or over supplied stock items are notified \nimmediately to the salon supervisor \n4.4 \nIncorrectly ordered or delivered stock is referred to the \nsalon supervisor for return to supplier \n4.5 \nSafe lifting and carrying techniques maintained in line \nwith salon occupational health and safety policy and \ngovernment legislation\n5.  Provide a relaxed \nand caring \nenvironment \n5.1 Clients are made to feel comfortable according to salon \npolicy \n5.2 Clients needs are reported to \n5.3 Clients are consulted on specific desired service\n\n--- PDF PAGE 33 ---\nTR - Hairdressing NC III \nAmended    \n 29 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant Salon \nPolicies and \nProcedures \nMay include but not limited to: \n1.1 Hazard Policies and Procedures \n1.2 Emergency, Fire and Accident Procedures \n1.3 Personal Safety Procedures \n1.4 Procedures for the use of Personal protective Clothing \nand Equipment \n1.5 Hazard Identification \n1.6 Job Procedures\n2. Occupational Health \nand Safety \nProcedures \nMay include but not limited to: \n2.1 \nClient  \n2.2 Staff \n2.3 Equipment/Tools \n2.4 Premises \n2.5 Stock\n3. Potential hazards \nMay include but not limited to: \n3.1 Damaged Packaging Material or Containers \n3.2 Broken or Damaged Equipment \n3.3 Inflammable Materials and Fire Hazards \n3.4 Lifting Practices \n3.5 Spillages \n3.6 Waste including hair especially on floors \n3.7 Trolleys\n4. Linkage \nMay be related to the following: \n4.1 Institutional \n4.2 Organizational Linkage \n4.3 Social Services \n4.4 International Market\n\n--- PDF PAGE 34 ---\nTR - Hairdressing NC III \nAmended    \n 30 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nGenerated information on different client requirements \nand needs \n1.2 \nSelected and used strategies to accurately analyzed the \nclient requirements \n1.3 \nAssessed current product and services as against client \ndemand \n1.4 \nIdentified avenues to establish relevant linkage \n1.5 \nSelected promotional activities relevant to enhance \ncompetitiveness of salon \n1.6 \nAssisted clients on specific desired services \n1.7 \nChecked and prepared tools for the specific salon \nactivities\n2. Underpinning \nknowledge and \nattitudes \n2.1 Media Options \n2.2 Data Gathering \n2.3 Salon Policies \n2.4 International Market \n2.5 Skills Competition Rules and Procedures \n2.6 New Trends in Products and Services \n2.7 Ethical Limitations\n3. Underpinning skills\n3.1 Communication skills to identify lines of communication, \nrequest advice, follow instructions and receive feedback. \n3.2 Technology Skills \n3.3 Interpersonal Skills\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nClient \n4.3 Relevant Information \n4.4 Appropriate Products\n5.  Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2Practical Demonstration with questioning\n6.  Context of \nassessment\n6.1  Assessment may be conducted in the workplace or in a \nsimulated environment.\n",
