ovided to the client as per\nsalon policies and procedures\n1.6 Client is advised to remove all personal\naccessories\n2. Apply advanced make-\nup\n2.1 Hand is sanitized before actual application of make-\nup\n2.2 Make-up products and accessories, tools,\nsupplies and materials are selected and prepared\naccording to client’s make – up requirements\n2.3 Make-up application is performed in accordance\nwith established or acceptable procedures\n2.4 Make-up result is checked before application of\n finishing touches\n2.5 Client’s comfort and safety are ensured during the\nentire process\n3. Perform post -service\nactivities\n3.1 Client is advised on appropriate product and\nprocedure in applying retouch and removing make-\nup\n3.2 Make-up products, materials, tools and implements\nare cleaned and stored according to safety and\nsanitation rules and regulations\n3.3 Waste items are properly disposed of in accordance\nwith OH&S requirements\n3.4 Workstation is cleared and prepared for next\ncustomer\n\n--- PDF PAGE 52 ---\nTR - Hairdressing NC III\nAmended\n 48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Advanced /creative make-up\n1.1 TV Commercial\n1.2 Fashion Runway\n1.3 Evening Party\n1.4 Body\n1.5 Air-brush\n1.6 High-definition (Water proof/Porcelain)\n2. Shapes of face\n2.1 Rectangle or Elongated\n2.2 Inverted/Pear\n2.3 Heart\n2.4 Oval\n2.5 Triangular\n2.6 Square\n2.7 Diamond\n2.8 Round\n3. Skin type\n3.1 Dry\n3.2 Normal\n3.3 Oily\n4. Skin tones\n4.1 Fair\n4.2 Light\n4.3 Medium\n4.4 Dark\n5. Protective clothing\n5.1 Bath Towel\n5.2 Headband\n5.3 Smock Gown\n5.4 Face Towel or Towellette\n6. Personal Accessories\n6.1 Earrings\n6.2 Necklace\n6.3 Any pierced items in the face\n7. Make-up tools, supplies and\nmaterials\nTools\n7.1 Sharpener\n7.2 Eyelash Curler\n7.3 Powder Applicator\n7.4 Flat Brush and Foundation Brush\n7.4.1 Eye Liner Brush\n7.4.2 Eye Shadow Brush\n7.4.3 Large Angle Brush\n7.4.4 Small Eyebrow Brush\n\n--- PDF PAGE 53 ---\nTR - Hairdressing NC III\nAmend