sessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 43 ---\nTR - Hairdressing NC III\nAmended\n 39\nUNIT OF COMPETENCY :\nPERFORM ADVANCED/ CREATIVE HAIR COLORING\n\nUNIT CODE\n:\nHCS515319\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming advanced/creative hair coloring from preparing\nthe client to actual application of creative hair coloring and\npost-color application activities.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is consulted advised on color options and\nchecked for possible skin allergies\n1.2\nCondition of the hair and scalp is checked and\nanalyzed\n1.3\nClient is draped following established procedures\nto avoid stain from hair coloring\n1.4\nClient is advised to remove all personal\naccessories\n1.5\nWhere necessary, client’s hair is shampooed to\nremove remaining conditioners and styling\nproducts, making sure that the scalp is not\nscratched\n1.6\nHair is completely dried if shampooed\n2. Apply creative hair color\n2.1\nTools, materials, implements and protective\nclothings are prepared and used following OH &S\nrequirements\n2.2\nColor and developer are selected and mixed\naccording to client’s desired outcome and hair\ncondition and length\n2.3 Creative coloring is applied according to required\ntechniques, artistic/aesthetic criteria, product\nspecifications and established or acceptable\nprocedures\n2.5 Where necessary, hair is styled according to client’s\n particular requirements\n2.6 Client’s safety and comfort are ensured during the\nprocess\n3. Perform post- service\nactivities\n3.1 Client is advised on relevant hair care and\nmaintenance procedures\n3.2 Tools, materials and implements are cleaned,\nsanitized and stored according to OH & S\nrequirements\n3.3 Wastes are disposed of according to OH&S\nrequirements\n3.4\nWorkstation is cleaned and prepared for next\nactivity\n\n--- PDF PAGE 44 -