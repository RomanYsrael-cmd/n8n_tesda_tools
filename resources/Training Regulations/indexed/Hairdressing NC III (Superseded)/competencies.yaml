F VARIABLES \n \nVARIABLE \nRANGE \n1. External Clients \n            \n \nMay include but not limited to: \n1.1 Teenagers \n1.2 Adult Men \n1.3 Working Adult \n1.4 Child \n2. Faults \nMay include but not limited to: \n2.1 \nClient not satisfied \n2.2 Desired result is not within the desired result of client \n2.3 Procedures done but do not conform with any Salon \npolicies and procedures \n2.4 Damaged caused to client \n3. Documentation \n3.1 Organization Work Procedures \n3.2 Manufacturer’s Instruction Manual \n3.3 Client Requirements \n3.4 Forms \n4. Errors \nMay be related to the following: \n4.1 Deviation from the requirements of the client \n4.2 Deviation \nfrom \nthe \nrequirements \nof \nthe \nsalon/organization \n5. Quality Standards \nMay be related but not limited to the following: \n5.1 Supplies and Materials \n5.2 Facilities \n5.3 Salon Product \n5.4 Service Processes and Procedures \n5.5 Client Service \n5.6 Environmental Regulations \n6. Client \n6.1 Co-worker \n6.2 Supplier/Vendor \n6.3 Client \n6.4 Organization receiving the product or service\n\n--- PDF PAGE 31 ---\nTR - Hairdressing NC III \nAmended    \n 27 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Carried out work in accordance with the company’s \nstandard operating procedures \n1.2 Performed task according to specifications \n1.3 Reported errors or deviations not in accordance with \nstandard operating procedures \n1.4 Carried out work in accordance with the process \nimprovement\n2. Underpinning \nknowledge and \nattitudes \n2.1 Relevant Production Processes, Materials and Products \n2.2 Characteristics of Materials, Software and Hardware \nUsed in Production Processes \n2.3 Quality Checking Procedures \n2.4 Client Relations \n2.5 Work Place Procedures \n2.6 Safety and Environmental Aspects of Service \nProcesses \n2.7 Error Identification and Reporting \n2.8 Quality Improvement Processes\n3. Underpinning skills \n3.1 Reading skills required to interpret work instructions, \nproduct manufacturer’s requirements \n3.2 Communication skills needed to interpret and apply \ndefined work procedures \n3.3 Carry out work in accordance with OHS policies and \nprocedures \n3.4 Critical thinking \n3.5 Solution providing and decision making \n3.6 Interpersonal skills or dealing with varied type of clients\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Materials \n4.2 Product  \n4.3 Equipment\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 Observation with questioning \n5.2 Third Party Report \n5.3 Practical Demonstration with questioning\n6. Context of \nAssessment\n6.1  Assessment may be conducted in the workplace or in a \nsimulated environment.\n",
