        "source_text": "--- PDF PAGE 51 ---\nTR - Hairdressing NC III \nAmended    \n 47 \nUNIT OF COMPETENCY:   PERFORM ADVANCED MAKE-UP  \n \nUNIT CODE \n :   HCS515321 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitude in   \n                                             applying advanced facial make-up from preparing the   \n  client, application of advanced make-up and the  \n  performance of post-facial make-up activities. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Prepare client \n1.1   Client is advised to remove all personal accessories \n1.2   Client is consulted on specific advanced make-up    \n         requirements \n1.3   Shape of face and skin type / tones of client are \nanalyzed according to make-up requirements \n1.4   Client is seated in a comfortable position during the \nentire process \n1.5    Protective clothing is provided to the client as per  \nsalon policies and procedures \n1.6    Client is advised to remove all personal \naccessories\n2.  Apply advanced make-\nup \n2.1  Hand is sanitized before actual application of make-\nup \n2.2 Make-up products and accessories, tools, \nsupplies and materials are selected and prepared \naccording to client’s make – up requirements \n2.3 Make-up application is performed in accordance \nwith established or acceptable procedures \n2.4 Make-up result is checked before application of  \n        finishing touches \n2.5   Client’s comfort and safety are ensured during the \nentire process\n3.  Perform post -service \nactivities \n3.1   Client is advised on appropriate product and \nprocedure in applying retouch and removing make-\nup \n3.2   Make-up products, materials, tools and implements \nare cleaned and stored according to safety and \nsanitation rules and regulations \n3.3   Waste items are properly disposed of in accordance \nwith OH&S requirements \n3.4   Workstation is cleared and prepared for next \ncustomer\