        "source_text": "500311113\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin the application of mathematical concepts and\ntechniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nmathematical tools\nand techniques to\nsolve problem\n1.1\nProblem areas are identified based on given condition\n\n1.2\nMathematical techniques are selected based on the\ngiven problem\n2. Apply mathematical\nprocedure/solution\n2.1\nMathematical techniques are applied based on the\nproblem identified\n2.2\nMathematical computations are performed to the level\nof accuracy required for the problem\n2.3\nResults of mathematical computation is determined\nand verified based on job requirements\n3. Analyze results\n3.1\nResult of application is reviewed based on expected\nand required specifications and outcome\n3.2\nAppropriate action is applied in case of error\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1\nFour fundamental operations\n\nMeasurements\n1.2\nUse/Conversion of units of measurements\n1.3\nUse of standard formulas\n2. Appropriate action\n2.1\nReview in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2\nReport error to immediate superior for proper action\n\n--- PDF PAGE 19 ---\nTR - Hairdressing NC III\nAmended\n 15\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFundamental operation (addition, subtraction, division,\nmultiplication)\n2.2\nMeasurement system\n2.3\nPrecision and accuracy\n2.4\nBasic measuring tools/devices\n3. Underpinning\nskills\n3.1\nApplying mathematical computations\n3.2\nUsing calculator\n3.3\nUsing different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nCalculator\n4.2\nBasic measuring tools\n4.3\nCase Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nAuthenticated portfolio\n5.2\nWritten Test\n5.3\nInterview/Oral Questioning\n5.4\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 20 ---\nTR - Hairdressing NC III\nAmended\n 16\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\n\nUNIT CODE\n:"
