        "source_text": "HCS515321\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in\n applying advanced facial make-up from preparing the\n client, application of advanced make-up and the\n performance of post-facial make-up activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1 Client is advised to remove all personal accessories\n1.2 Client is consulted on specific advanced make-up\n requirements\n1.3 Shape of face and skin type / tones of client are\nanalyzed according to make-up requirements\n1.4 Client is seated in a comfortable position during the\nentire process\n1.5 Protective clothing is provided to the client as per\nsalon policies and procedures\n1.6 Client is advised to remove all personal\naccessories\n2. Apply advanced make-\nup\n2.1 Hand is sanitized before actual application of make-\nup\n2.2 Make-up products and accessories, tools,\nsupplies and materials are selected and prepared\naccording to client’s make – up requirements\n2.3 Make-up application is performed in accordance\nwith established or acceptable procedures\n2.4 Make-up result is checked before application of\n finishing touches\n2.5 Client’s comfort and safety are ensured during the\nentire process\n3. Perform post -service\nactivities\n3.1 Client is advised on appropriate product and\nprocedure in applying retouch and removing make-\nup\n3.2 Make-up products, materials, tools and implements\nare cleaned and stored according to safety and\nsanitation rules and regulations\n3.3 Waste items are properly disposed of in accordance\nwith OH&S requirements\n3.4 Workstation is cleared and prepared for next\ncustomer\n\n--- PDF PAGE 52 ---\nTR - Hairdressing NC III\nAmended\n 48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Advanced /creative make-up\n1.1 TV Commercial\n1.2 Fashion Runway\n1.3 Evening Party\n1.4 Body\n1.5 Air-brush\n1.6 High-definition (Water proof/Porcelain)\n2. Shapes of face\n2.1 Rectangle or Elongated\n2.2 Inverted/Pear\n2.3 Heart\n2.4 Oval\n2.5 Triangular\n2.6 Square\n2.7 Diamond\n2.8 Round\n3. Skin type\n3.1 Dry\n3.2 Normal\n3.3 Oily\n4. Skin tones\n4.1 Fair\n4.2 Light\n4.3 Medium\n4.4 Dark\n5. Protective clothing\n5.1 Bath Towel\n5.2 Headband\n5.3 Smock Gown\n5.4 Face Towel or Towellette\n6. Personal Accessories\n6.1 Earrings\n6.2 Necklace\n6.3 Any pierced items in the face\n7. Make-up tools, supplies and\nmaterials\nTools\n7.1 Sharpener\n7.2 Eyelash Curler\n7.3 Powder Applicator\n7.4 Flat Brush and Foundation Brush\n7.4.1 Eye Liner Brush\n7.4.2 Eye Shadow Brush\n7.4.3 Large Angle Brush\n7.4.4 Small Eyebrow Brush\n\n--- PDF PAGE 53 ---\nTR - Hairdressing NC III\nAmended\n 49\n\nVARIABLE\nRANGE\n\n7.4.5 Large Blusher Brush\n7.4.6 Powder Brush\n7.4.7 Brow with Comb Brush\n7.4.8 Body Brush\n7.4.9 Lip Brush\n7.5 Eye Brow Scissor\n7.6 Fun Brush\n7.7 Eye Brow Blade\n7.8 Tweezer\nSupplies and Materials\n7.9 Sponge\n7.9.1 Natural\n7.9.2 Sea Sponge\n7.10 Make-up Products\n8. Eyebrow may be defined\nthrough\n8.1 Plucking\n8.2 Threading\n8.3 Shaving\n9. Make-up Product\n10.1 Primer (Cream, liquid, mousse)\n10.2 Cake/Liquid/Cream to Powder/Powder/High\n Definition Foundation/Air Brush Foundation\n10.3 Concealer (Stick, cream, liquid, cream to\n powder, etc.)\n10.4 Eyeshadow (Cream, gel, powder, pencils)\n10.5 Blusher (Powder, cream, liquid, cream to\n powder, etc.)\n10.6 Eyeliner (Pencil, liquid, glittery, gel liner)\n10.7 Eyebrow (Powder, gel, pencil)\n10.8 Lip stick (Cream, matte, moisture, shimmer,\n glittery, glossy stick)\n10.9 Mascara (Volumizing, lengthening, water\n proof, water resistant, nylon based)\n10.10 Powder (Loose, shimmer, bronzing, dual,\n matte, high definition, mineral)\n10.11 Lip pencil (matte, cream, moisture)\n10.12 Lip gloss (Silicon-based, ultrashine, moisture\n rich, matte)\n10.13 Antishine (Compact or cream/liquid)\n10.14 Mattefying spray/water proof spray/ air brush\n finishes\n10. Accessories\n11.1 Glitter gel\n11.2 Special effect make-up (prosthetic enhancer,\nrubber, glue, plasters, gauze)\n11.3 Stoned glitter (Stones/glitters/lashes)\n11.4 Lashes glue or adhesive (Artificial)\n11.5 Color pigments (Powder, cream, liquid)ds\n\n--- PDF PAGE 54 ---\nTR - Hairdressing NC III\nAmended\n 50\n\nVARIABLE\nRANGE\n12. Established or acceptable\nprocedures in advanced\nmake-up application\nMay include but are not limited to:\n12.1 Clean or wash face using cleansing products\n12.2 Apply foundation and concealer evenly on\nface and neck\n12.3 Apply creative make-up techniques according\nto desired advanced make-up\n13. Make-up result\n13.1 Evenness of make-up application and proper\ndistribution (lightness and darkness of\nmake-up)\n13.2 Essential application of make-up\n13.3 Blending of colors\n13.4 Appropriateness of make-up with the\noccasion\n13.5 Symmetry and balance of eyebrow arc and\nshape, and blush-on\n13.6 Face and lips contouring is achieved\n\n--- PDF PAGE 55 ---\nTR - Hairdressing NC III\nAmended\n 51\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted clients on specific advanced facial make-up\nrequirements\n1.2 Performed analysis of clients face, skin tone and types in\naccordance with make-up requirements\n1.3 Prepared and used appropriate make-up tools, materials and\naccessories according to client’s make-up requirements\n1.4 Performed advanced make-up application in accordance\nwith established or acceptable procedures\n1.5 Performed checking and applied finishing touches to achieve\nbest result in accordance with client’s requirements\n1.6 Ensured client’s safety and comfort during the entire process\n1.7 Applied appropriate measures in response to emergencies\n or unavoidable circumstances\n1.8 Performed post-service activities according to salon policies\n and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1 Code of Ethics\n2.2 Different Facial Shapes\n2.3 Facial Skin and Type Analysis\n2.4 Advanced /Creative Make-up Techniques\n2.5 Make-Up Procedure/Sequence\n2.6 Make-Up Product Knowledge\n2.7 Make–Up Technique\n2.8 First-aid Treatment\n2.9 DOH-IRR and OH&S requirements\n3. Underpinning\nskills\n3.1 Handling clients\n3.2 Handling tools and materials\n3.3 Contouring of face\n3.4 Applying make-up/blending of color as per requirement\n3.5 Finishing touches/recommendation for touch-up\n3.6 Observing code of ethics\n3.7 Applying first-aid treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment centers\n\n--- PDF PAGE 56 ---\nTR - Hairdressing NC III\nAmended\n 52\nELECTIVE COMPETENCIES\nUNIT OF COMPETENCY :\nPERFORM HAIR EXTENSION ACTIVITIES\nUNIT CODE\n:"
