        "evidence_guide": {
          "source_text": "1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Consulted and prepared client on desired creative hairstyle \nand its procedures \n1.2 Determined client’s profile and events to be attended \n1.3 \nPrepared and used supplies, materials, tools and hair \nimplements according to desired creative hairstyle \nfollowing OH& S requirements \n1.4    Performed desired creative hairstyle following appropriate \ntechnique and established or acceptable procedures  \n1.5 Used hairstyle products, implements and accessories to \nachieve sturdy and best results \n1.6 Checked and applied final touch on the finished hairstyle \n1.7 Ensured client’s safety and comfort during the entire \nprocess \n1.8  Applied appropriate measures in response to   \n         emergencies or unavoidable circumstances \n1.9    Performed post-service activities in accordance with \nOH&S requirements\n2.  Underpinning \nknowledge  \n2.1 Code of Ethics \n2.2 Salon Policies and Procedures \n2.3 Customer Relations \n2.4 Different Shape of Face \n2.5 Different Creative Hair design/Hairstyles \n2.6 Creative Hair Design/Hairstyling Principles and Techniques \n2.7 Hair Analysis \n2.8 DOH and OH&S requirements \n2.9 Different Tools and Equipment \n2.10 First-aid Treatment\n3.  Underpinning \nskills \n3.1 Assessing client’s profile \n3.2 Checking  hair texture and volume \n3.3 Draping \n3.4 Shampooing \n3.5 Using appropriate tools and materials, implements and \nornaments/accessories \n3.6 Sectioning of hair \n3.7 Perform different creative hairstyling techniques \n3.8 Observing code of ethics \n3.9 Applying first-aid treatment\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nModel \n4.2 \nTools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3\nWork area/facilities\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1   Demonstration with Oral Questioning \n5,2   Third-Party Report \n5.3   Portfolio    \n6. Context of \nassessment\nCompetency may be assessed in the workplace or TESDA \naccredited assessment center",
