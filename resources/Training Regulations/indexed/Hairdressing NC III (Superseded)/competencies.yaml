        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on hair extension requirements\n1.2 Prepared tools, equipment and supplies/materials\naccording to client and OH&S requirements\n1.3 Performed hair extension procedures and techniques\naccording to client’s desired results and manufacturer’s\nspecifications\n1.4 Performed cross- checking and applied appropriate\nfinishing touches\n1.5 Used protective clothing according to health and sanitation\nregulations and salon procedures\n1.6 Followed safety precautions for clients and self during the\nentire process\n1.7 Performed post-service activities according to OH&S\nrequirements\n2. Underpinning\nknowledge\n2.1 Hair type concepts and designs\n2.2 Hair extension system and its components and applications\n2.3 Elements and principles of hair design\n2.4 Balancing hair length and volume\n2.5 Procedures in cleaning and maintenance of hair extension\n2.6 Different types of tools and materials in hair extension\n2.7 First- aid treatment\n2.8 DOH and OH&S requirements\n2.9 Code of ethics\n3. Underpinning\nskills\n3.1 Selecting, mixing and applying hair extensions\n3.2 Using and applying hair extension system\n3.3 Applying haircutting techniques to blend hair extensions\nand natural hair\n3.4 Using appropriate tools and materials\n3.5 Interpreting manufacturer’s specifications\n3.6 Performing different hair extension maintenance\n3.7 Applying first-aid treatment\n3.8 Complying with DOH-IRR and OH&S requirements\n3.9 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.4 Model\n4.5 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.6 Working area / facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.4 Demonstration with Oral Questioning\n5.5 Third-Party Report\n5.6 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 59 ---\nTR - Hairdressing NC III\nAmended\n 55\nUNIT OF COMPETENCY :\nPERFORM HAIRPIECE ATTACHMENT, STYLING AND\nMAINTENANCE\nUNIT CODE\n:"
        },
        "source_text": "HCS515401\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin selecting hair type and applying appropriate hair\nextensions.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1 Client is consulted according to his/her needs and\nexpectations\n1.2 Client is draped with styling cape\n1.3 Hair extension concept is designed in accordance\nwith client’s facial features, natural hair’s texture,\ndensity, length, shape and personal attributes\n1.4 Designed hair extension concept is discussed with\nclient to confirm that design meets the type of hair\nextension technique and client’s requirements\n1.5 Appropriate equipment, tools, supplies/materials\nand techniques are selected and used according to\nhair design\n1.6 Cost, maintenance requirements, features and\nbenefits of the service are identified and explained\nto client\n2. Execute hair extension\nactivities\n2.1 Client’s natural hair is shampooed without\nconditioner and blow-dried\n2.2 Client’s natural hair is sectioned according to\nconfirmed design\n2.3 Strands are attached and securely sealed according\nto manufacturer’s instructions and workplace\npolicies and procedures to match the confirmed\ndesign\n3. Complete hair design\n3.1 Cutting and finishing techniques are applied where\nrequired to blend extensions and natural hair, and to\nachieve desired result\n3.2 Client satisfaction is confirmed and adjustments are\nmade if required\n3.3 Maintenance procedures are clearly explained to\nthe client\n4. Perform post-service\nactivities\n4.1 Tools and materials are cleaned, sterilized and\nstored in accordance with salon policies\n4.2 Waste items are properly disposed of in accordance\nwith OH&S required practice\n4.3 Working area is cleaned in preparation for the next\nclient\n\n--- PDF PAGE 57 ---\nTR - Hairdressing NC III\nAmended\n 53\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hair extension concept\n1.1 Adding length\n1.2 Increasing density\n1.3 Adding color\n1.4 Applying to full or partial head\n2. Natural hair’s texture,\n. density, length and\nshape\n2.1 Texture\n - Fine\n - Medium\n - Thick\n - Wiry\n2.2 Density\n - Volume\n - Weight\n2.3 Length\n - Short\n - Medium\n - Long\n2.4 Shape\n - Round\n - Triangle\n - Square\n3. Personal attributes\n3.1 Age\n3.2 Personal image/Lifestyle\n3.3 Job or career\n4. Type of hair extension\ntechnique\n4.1 Clip-in\n4.2 Glue\n4.3 Adhesive/Bonding\n4.4 Rubber\n4.5 Weave/Braid\n4.6 Wefts\n4.7 Track- and- Sew method\n4.8 Keratin plastic\n5. Tools\n5.1 Blow dryers\n5.2 Brushes\n5.3 Combs/Tail Comb\n5.4 Crochet hook\n5.4 Hair extension clipper\n5.5 Hair clip\n6. Supplies/Materials\n\n6.1 Threads\n6.2 Styling products\n - Gel/Styling gel\n - Mousse\n - Spray net/Hair spray\n - Hair polish/Hair serum\n - Hair wax (wet and dry)\n6.3 Towel\n6.4 Tissues\n6.5 Shampoos\n6.6 Neck strip\n6.7 Styling cape\n7. Workplace policies and\nprocedures\n7.1 Client comfort and safety\n7.2 Health and hygiene\n7.3 Sanitation\n8. Desired result\n8.1 Symmetry/Balance\n8.2 Evenness\n8.3 Hair extension blends with natural hair\n8.4 No visible hair implements and attachments\n\n--- PDF PAGE 58 ---\nTR - Hairdressing NC III\nAmended\n 54\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on hair extension requirements\n1.2 Prepared tools, equipment and supplies/materials\naccording to client and OH&S requirements\n1.3 Performed hair extension procedures and techniques\naccording to client’s desired results and manufacturer’s\nspecifications\n1.4 Performed cross- checking and applied appropriate\nfinishing touches\n1.5 Used protective clothing according to health and sanitation\nregulations and salon procedures\n1.6 Followed safety precautions for clients and self during the\nentire process\n1.7 Performed post-service activities according to OH&S\nrequirements\n2. Underpinning\nknowledge\n2.1 Hair type concepts and designs\n2.2 Hair extension system and its components and applications\n2.3 Elements and principles of hair design\n2.4 Balancing hair length and volume\n2.5 Procedures in cleaning and maintenance of hair extension\n2.6 Different types of tools and materials in hair extension\n2.7 First- aid treatment\n2.8 DOH and OH&S requirements\n2.9 Code of ethics\n3. Underpinning\nskills\n3.1 Selecting, mixing and applying hair extensions\n3.2 Using and applying hair extension system\n3.3 Applying haircutting techniques to blend hair extensions\nand natural hair\n3.4 Using appropriate tools and materials\n3.5 Interpreting manufacturer’s specifications\n3.6 Performing different hair extension maintenance\n3.7 Applying first-aid treatment\n3.8 Complying with DOH-IRR and OH&S requirements\n3.9 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.4 Model\n4.5 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.6 Working area / facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.4 Demonstration with Oral Questioning\n5.5 Third-Party Report\n5.6 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 59 ---\nTR - Hairdressing NC III\nAmended\n 55\nUNIT OF COMPETENCY :\nPERFORM HAIRPIECE ATTACHMENT, STYLING AND\nMAINTENANCE\nUNIT CODE\n:"
