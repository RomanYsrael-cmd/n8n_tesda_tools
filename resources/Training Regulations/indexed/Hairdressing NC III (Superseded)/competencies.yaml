        "source_title": "PERFORM ADVANCED/ CREATIVE HAIR COLORING",
        "source_text": "--- PDF PAGE 43 ---\nTR - Hairdressing NC III \nAmended    \n 39 \nUNIT OF COMPETENCY : \nPERFORM  ADVANCED/ CREATIVE HAIR COLORING  \n \nUNIT CODE \n: \nHCS515319 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \nperforming advanced/creative hair coloring from preparing \nthe client to actual application of creative hair coloring and \npost-color application activities.  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare client \n1.1 \nClient is consulted advised on color options and \nchecked for possible skin  allergies \n1.2 \nCondition of the hair and scalp is checked and \nanalyzed \n1.3 \nClient is draped following established procedures \nto avoid stain from hair coloring  \n1.4 \nClient is advised to remove all personal \naccessories \n1.5 \nWhere necessary, client’s hair is shampooed to \nremove remaining conditioners and styling \nproducts, making sure that the scalp is not \nscratched \n1.6\nHair is completely dried if shampooed \n2. Apply  creative hair color \n2.1 \nTools, materials, implements and protective \nclothings are prepared and used following OH &S \nrequirements   \n2.2 \nColor and developer are selected and mixed \naccording to client’s desired outcome and hair \ncondition and length \n2.3    Creative coloring is applied according to required \ntechniques,  artistic/aesthetic criteria,  product \nspecifications and established or acceptable \nprocedures \n2.5   Where necessary, hair is styled according to client’s \n         particular requirements \n2.6 Client’s safety and comfort  are ensured during the \nprocess \n3. Perform post- service \nactivities \n3.1   Client is advised on relevant hair care and \nmaintenance procedures \n3.2   Tools, materials and  implements are cleaned, \nsanitized and stored according to OH & S \nrequirements  \n3.3    Wastes are disposed of according to OH&S \nrequirements \n3.4 \nWorkstation is cleaned and prepared for next \nactivity\n\n--- PDF PAGE 44 ---\nTR - Hairdressing NC III \nAmended    \n 40 \nRANGE OF VARIABLE \n  \nVARIABLE \nRANGE \n1.   Color Options/ Color \nproduct form \n1. 1  Cream \n1.1.1  Permanent \n1.1.2  Semi-permanent \n1.2    Liquid (Blackening shampoo) \n1.2.1  Organic dye \n1.2.2  Vegetable  \n1.3    Hena wax \n1.3.1  Conventional \n1.3.2  Improved \n2. Hair Condition \n2.1   Damaged \n2.2   Tinted \n2.3   Lightened \n2.4   Porous \n2.5   Dry \n2.6   Greasy or Oily \n2.7   Normal \n3.  Scalp condition \n3.1   Dry/Oily \n3.2   Dandruff \n3.3   Greasy \n3.4   Waxy \n3.5   Scaly \n4.  Established procedures \nin draping client \n4.1  Drape client with bath towel  \n4.2  Wrap around the neck of the client with protective  \n       material     \n4.3  Wrap around the should of the client with coloring \ncape \n5.  Styling Products \n5.1   Gel \n5.2   Hair wax \n5.3   Wet wax/Dry wax \n5.4   Hair serum \n5.5   Hair spray \n5.6   Mousse \n5.7   Leave-on conditioners \n5.8   Fiber gum \n6.  Tools, Materials and \nImplements \n6.1  Tools \n6.1.1  Tinting Brush \n6.1.2  Mixing Bowl \n6.1.3  Measuring Cap \n6.1.4  Timer \n6.1.5  Clips \n6.1.6  Clamps \n6.1.7  Frosting cap with hook \n6.1.8  Tail comb\n\n--- PDF PAGE 45 ---\nTR - Hairdressing NC III \nAmended    \n 41 \nVARIABLE \nRANGE \n \n6.2  Implements \n6.2.1  Blower \n6.2.2  Infrared \n6.2.3  Hair Steamer \n6.2.4  Straightening iron \n6.3  Supplies and Materials \n6.3.1  Squeezer \n6.3.2  Tissue \n6.3.3  Foil \n6.3.4  Cotton     \n6.3.5  Developers \n6.3.5.1  1.5%-5 volume \n6.3.5.2  3%-10 volume \n6.3.5.3  6%-20 volume \n6.3.5.4  9%-30 volume \n6.3.5.5  12%-40 volume \n \n7.   Protective clothings \n7.1   Cap Ear Pads/ Ear Cap \n7.2   Coloring Pads \n7.3   Towels \n7.4   Apron \n7.5   Cape \n7.6   Gloves \n \n8.  Creative coloring   \napplications   \n        \n8.1 Color correction \n8.2 Trend coloring/Placement of color design \n8.3 Full head bleaching/Procedures of coloring \ntechnique \n9.  Established or \nacceptable procedures in \ncreative hair coloring \nMay include but are not limited to: \n9.1   Section hair  \n9. 2  Sub-section hair and follow application techniques \n9.3   Emulsify product to achieve color balance \n9.4   Check evenness of color  through hair strand test  \n        and expose to proper lighting following the  \n         required development time \n9.5    Rinse hair thoroughly with shampoo and  \n        conditioner    \n10.  Hair care and     \n       maintenance  \n10.1   Leave-in or leave-on conditioner treatment \n10.2   Finishing/styling product \n10.3   Hair treatments  \n10.4   Hair spa \n10.5   Reborn \n10.6   Hair color serum \n10.7   Hair detox \n10.8   Styling aids\n\n--- PDF PAGE 46 ---\nTR - Hairdressing NC III \nAmended    \n 42 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate:\n1.1 Performed skin test prior to application of creative hair \ncoloring \n1.2 Checked and analyzed hair  and scalp condition prior to \ncreative hair coloring application \n1.3 Selected and handled necessary tools, materials and \nimplements according to job requirements \n1.4 Selected and mixed color products and developer based on \nclient’s desired outcome and hair condition following product \nspecifications \n1.5 Performed hair coloring following established or acceptable \nprocedures and product specifications \n1.6 Ensured client’s safety and comfort during the entire process \n1.7 Applied appropriate measures in response to emergencies \nor unavoidable circumstances \n1.8 Performed post-service activities according to salon policies \nand procedures, and OH&S requirements\n2. Underpinning \nknowledge  \n2.1 Skin test (Patch test as per client safety precautions)\n2.2 Hair Analysis (Consultation) \n2.3   Fundamentals and Principles in Hair Coloring \n2.4   Classification of Hair Coloring \n2.5   Creative Hair Coloring Principles and Procedures \n2.6 Color Product Knowledge \n2.7   Kinds of Developer and Their Uses \n2.8   Chemical Mixtures and Their Uses \n2.9   Mixing Procedures \n2.10 Color Development Timeline \n2.11 Mensuration Mixing Ratio and Proportion \n2.12 Basic Mathematics (Computation) \n2.13 Color Harmony \n2.14 Advanced Sectioning and Color Application \n2.15 Hair Maintenance Program \n2.16   DOH-IRR and OH&S rules and regulations \n2.17   Code of Ethics\n3. Underpinning \nskills \n3.1 Observing draping procedures\n3.2 Applying hair coloring techniques \n3.3 Applying shampooing/conditioning techniques \n3.4 Handling tools \n3.5 Observing hair sectioning \n3.6 Proper Storage of Products and Tools \n3.7 Observing mixing procedures \n3.8 Observing code of ethics\n4. Resource \nimplications \nThe following resources MUST be provided:\n4.1  Model \n4.2 Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3 Work area/facilities\n5. Method of \nassessment \nCompetency MUST be assessed through:\n5.1 Demonstration with Oral Questioning \n5.2 Third-Party Report \n5.3 Portfolio\n6. Context of \nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n",
