irstyling \n3.2  Up-style \n3.3  Curling \n3.4  Straightening \n3.5  Hair teasing \n3.6  Extension attachment \n3.7  Avante garde hairstyling\n4.  Supplies and Materials \n4.1   Setting lotion \n4.2   Shampoo \n4.3   Cotton \n4.4   Tissue\n5.  Tools / Implements \n5.1   Hairpin \n5.2   Roller Pin \n5.3   Single Prong Clip \n5.4   Double Prong Clip \n5.5   Duck Bill Clamp \n5.6   Rubber Band \n5.7   Cylinder Shaped Rollers (Long and Short) \n5.8   Large Tooth Comb \n5.9   All Purpose Comb \n5.10 Tail Comb \n5.11 Teasing Comb \n5.12 Spout Plastic Bottle Dispenser \n5.13 Press Spray Plastic Dispenser Bottle \n5.14 Roller Brush \n5.15 Natural Bristles \n5.16 Synthetic Bristles \n5.17 Small Size Hair Rollers Wire \n5.18 Medium Size Rollers\n\n--- PDF PAGE 37 ---\nTR - Hairdressing NC III \nAmended    \n 33 \nVARIABLE \nRANGE \n \n5.19 Large Size Rollers \n5.20 Jumbo Rollers \n5.21 Hair Dryer \n5.22 Hand Blower \n5.23 Crimpers \n5.24 Curling Iron \n5.25 Electric Curlers \n5.26 Triangle Net \n5.27 Invisible Pins \n5.28 Invisible Hairnet \n5.29 Wig\n6.   Established or acceptable \nprocedures in creative \nhairstyling \nMay include but are not limited to: \n6.1   Section hair depending on client’s hairstyle \nrequirements \n6.2   Fix and secure hair according to hair design \n6.3   Use hairstyle product and implements to achieve    \nbest results \n7.  Personal Accessories \n7.1   Fashion accessories (e.g. stones, beads, etc) \n7.2   Hair ornaments (e.g. pony tails, petals, pin curls,  \n       braids)\n8.  Protective Clothing \n8.1  Towel \n8.2  Cape \n8.3  Hair Spray Net Mask \n8.4  Headband \n8.5  Smock Gown\n9. Hairstyles Technique \n9.1   Finger Waving \n9.2   Pin Curls \n9.3   Diagonal Waves \n9.4   Waved Bangs \n9.5   Ridge Curls \n9.6   Skip Wave \n9.7   Cascade or Stand Up Curl \n9.8   Semi Stand-Up Curls \n9.9   Roller Curls \n9.10  Barrel Curls \n9.11  Hair Partings \n9.12  Back Combing\n10.  Hairstyling products and \nimplements \n10.1   Setting Lotion/Gel \n10.2   Hair wax \n10.2.1  Wet wax \n10.2.2  Dry wax \n10.3   Hair serum \n10.4   Hair spray \n10.5   Mousse \n10.6   Leave-on conditioners\n11.  Hairstyle Accessories \n11.1   Hairpiece (e.g. wig) \n11.2\n Hair Ornaments\n\n--- PDF PAGE 38 ---\nTR - Hairdressing NC III \nAmended    \n 34"
