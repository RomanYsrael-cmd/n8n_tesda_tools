\nmake-up)\n13.2 Essential application of make-up\n13.3 Blending of colors\n13.4 Appropriateness of make-up with the\noccasion\n13.5 Symmetry and balance of eyebrow arc and\nshape, and blush-on\n13.6 Face and lips contouring is achieved\n\n--- PDF PAGE 55 ---\nTR - Hairdressing NC III\nAmended\n 51\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted clients on specific advanced facial make-up\nrequirements\n1.2 Performed analysis of clients face, skin tone and types in\naccordance with make-up requirements\n1.3 Prepared and used appropriate make-up tools, materials and\naccessories according to client’s make-up requirements\n1.4 Performed advanced make-up application in accordance\nwith established or acceptable procedures\n1.5 Performed checking and applied finishing touches to achieve\nbest result in accordance with client’s requirements\n1.6 Ensured client’s safety and comfort during the entire process\n1.7 Applied appropriate measures in response to emergencies\n or unavoidable circumstances\n1.8 Performed post-service activities according to salon policies\n and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1 Code of Ethics\n2.2 Different Facial Shapes\n2.3 Facial Skin and Type Analysis\n2.4 Advanced /Creative Make-up Techniques\n2.5 Make-Up Procedure/Sequence\n2.6 Make-Up Product Knowledge\n2.7 Make–Up Technique\n2.8 First-aid Treatment\n2.9 DOH-IRR and OH&S requirements\n3. Underpinning\nskills\n3.1 Handling clients\n3.2 Handling tools and materials\n3.3 Contouring of face\n3.4 Applying make-up/blending of color as per requirement\n3.5 Finishing touches/recommendation for touch-up\n3.6 Observing code of ethics\n3.7 Applying first-aid treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment centers\n\n--- PDF PAGE 56 ---\nTR - Hairdressing NC III\nAmended\n 52\nELECTIVE COMPETENCIES\nUNIT OF COMPETENCY :\nPERFORM HAIR EXTENSION ACTIVITIES\nUNIT CODE\n:\nHCS515401\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin selecting hair type and applying appropriate hair\nextensions.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1 Client is consulted according to his/her needs and\nexpectations\n1.2 Client is draped with styling cape\n1.3 Hair extension concept is designed in accordance\nwith client’s facial features, natural hair’s texture,\ndensity, length, shape and personal attributes\n1.4 Designed hair extension concept is discussed with\nclient to confirm that design meets the type of hair\nextension technique and client’s requirements\n1.5 Appropriate equipment, tools, supplies/materials\nand techniques are selected and used according to\nhair design\n1.6 Cost, maintenance requirements, features and\nbenefits of the service are identified and explained\nto client\n2. Execute hair extension\nactivities\n2.1 Client’s natural hair is shampooed without\nconditioner and blow-dried\n2.2 Client’s natural hair is sectioned according to\nconfirmed design\n2.3 Strands are attached and securely sealed according\nto manufacturer’s instructions and workplace\npolicies and procedures to match the confirmed\ndesign\n3. Complete hair design\n3.1 Cutting and finishing techniques are applied where\nrequired to blend extensions and natural hair, and to\nachieve desired result\n3.2 Client satisfaction is confirmed and adjustments are\nmade if required\n3.3 Maintenance procedures are clearly explained to\nthe client\n4. Perform post-service\nactivities\n4.1 Tools and materials are cleaned, sterilized and\nstored in accordance with salon policies\n4.2 Waste items are properly disposed of in accordance\nwith OH&S required practice\n4.3 Working area is cleaned in preparation for the next\nclient\n\n--- PDF PAGE 57 ---\nTR - Hairdressing NC III\nAmended\n 53\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hair extension concept\n1.1 Adding length\n1.2 Increasing density\n1.3 Adding color\n1.4 Applying to full or partial head\n2. Natural hair’s texture,\n. density, length and\nshape\n2.1 Texture\n - Fine\n - Medium\n - Thick\n - Wiry\n2.2 Density\n - Volume\n - Weight\n2.3 Length\n - Short\n - Medium\n - Long\n2.4 Shape\n - Round\n - Triangle\n - Square\n3. Personal attributes\n3.1 Age\n3.2 Personal image/Lifestyle\n3.3 Job or career\n4. Type of hair extension\ntechnique\n4.1 Clip-in\n4.2 Glue\n4.3 Adhesive/Bonding\n4.4 Rubber\n4.5 Weave/Braid\n4.6 Wefts\n4.7 Track- and- Sew method\n4.8 Keratin plastic\n5. Tools\n5.1 Blow dryers\n5.2 Brushes\n5.3 Combs/Tail Comb\n5.4 Crochet hook\n5.4 Hair extension clipper\n5.5 Hair clip\n6. Supplies/Materials\n\n6.1 Threads\n6.2 Styling products\n - Gel/Styling gel\n - Mousse\n - Spray net/Hair spray\n - Hair polish/Hair serum\n - Hair wax (wet and dry)\n6.3 Towel\n6.4 Tissues\n6.5 Shampoos\n6.6 Neck strip\n6.7 Styling cape\n7. Workplace policies and\nprocedures\n7.1 Client comfort and safety\n7.2 Health and hygiene\n7.3 Sanitation\n8. Desired result\n8.1 Symmetry/Balance\n8.2 Evenness\n8.3 Hair extension blends with natural hair\n8.4 No visible hair implements and attachments\n\n--- PDF PAGE 58 ---\nTR - Hairdressing NC III\nAmended\n 54\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on hair extension requirements\n1.2 Prepared tools, equipment and supplies/materials\naccording to client and OH&S requirements\n1.3 Performed hair extension procedures and techniques\naccording to client’s desired results and manufacturer’s\nspecifications\n1.4 Performed cross- checking and applied appropriate\nfinishing touches\n1.5 Used protective clothing according to health and sanitation\nregulations and salon procedures\n1.6 Followed safety precautions for clients and self during the\nentire process\n1.7 Performed post-service activities according to OH&S\nrequirements\n2. Underpinning\nknowledge\n2.1 Hair type concepts and designs\n2.2 Hair extension system and its components and applications\n2.3 Elements and principles of hair design\n2.4 Balancing hair length and volume\n2.5 Procedures in cleaning and maintenance of hair extension\n2.6 Different types of tools and materials in hair extension\n2.7 First- aid treatment\n2.8 DOH and OH&S requirements\n2.9 Code of ethics\n3. Underpinning\nskills\n3.1 Selecting, mixing and applying hair extensions\n3.2 Using and applying hair extension system\n3.3 Applying haircutting techniques to blend hair extensions\nand natural hair\n3.4 Using appropriate tools and materials\n3.5 Interpreting manufacturer’s specifications\n3.6 Performing different hair extension maintenance\n3.7 Applying first-aid treatment\n3.8 Complying with DOH-IRR and OH&S requirements\n3.9 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.4 Model\n4.5 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.6 Working area / facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.4 Demonstration with Oral Questioning\n5.5 Third-Party Report\n5.6 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 59 ---\nTR - Hairdressing NC III\nAmended\n 55\nUNIT OF COMPETENCY :\nPERFORM HAIRPIECE ATTACHMENT, STYLING AND\nMAINTENANCE\nUNIT CODE\n:\nHCS515402\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nin hairpiece attachment and styling and in carrying out\ncleaning and maintenance of hairpieces.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1 Client is consulted according to his/her needs and\nexpectations\n1.2 Client is draped with styling cape\n1.3 Hairpiece and style is selected in accordance with\nclient’s facial features, natural hair, personal\nattributes and requirements\n1.4\nAppropriate equipment, tools, supplies/materials\nand techniques are selected and used according to\nclient’s requirements\n1.5\nCost, maintenance requirements, features and\nbenefits of the service are identified and explained\nto client\n2. Attach and style\nhairpieces\n\n2.1 Client’s head circumference is measured for wig\nfitting\n2.2 Selected hairpiece is attached securely to client’s\nhead following manufacturer’s specifications and\nand desired result\n2.2 Hairstyle is created following elements of design\nand client’s requirements\n2.3 Client’s satisfaction is confirmed and adjustments\nare made if required\n3. Maintain hairpieces\n\n3.1 Hairpiece’s condition is checked and adjustments\nare made if required\n3.2 Suitable product is identified and selected\nappropriate for type of hairpiece to be cleaned and\nmaintained\n3.3 Manufacturer’s instructions in using product is\nfollowed accordingly\n4. Perform post-service\nactivities\n4.1 Tools and materials are cleaned, sterilized and\nstored in accordance with salon policies\n4.2 Waste items are properly disposed of in accordance\nwith OH&S required practice\n4.3 Working area is cleaned in preparation for the next\n client\n\n--- PDF PAGE 60 ---\nTR - Hairdressing NC III\nAmended\n 56\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal attributes\n1.1 Age\n1.2 Personal image\n1.3 Job or career\n2. Hairpiece\n2.1 Full head wigs\n- Human hair\n- Synthetic\n2.2 Toupette/wiglets\n- Human hair\n - Synthetic\n3. Style\n3.1 Straight\n3.2 Wavy\n3.3 Curly\n4. Tools\n4.1 Blow dryers\n4.2 Brushes\n4.3 Combs\n5. Supplies/Materials\n5.1 Pins\n5.2 Duckbill\n5.3 Measuring tape\n5.4 Neck strip\n5.5 Styling cape\n5.6 Towel\n5.7 Tissues\n5.8 Styling product\n - Gel/Styling gel\n - Spray net\n5.9 Hairpiece ornaments\n - Ponytails\n - Braids\n - Ponytail wraps\n - Petals\n- Pin curls\n6. Desired result\n6.1 Symmetry/Balance\n6.2 Evenness\n6.3 Hairpiece blends with natural hair\n6.4 No visible hair implements and attachments\n6. Elements of design\n6.1 Line\n6.2 Colour\n6.3 Texture\n6.4 Shape\n6.5 Size\n\n--- PDF PAGE 61 ---\nTR - Hairdressing NC III\nAmended\n 57\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on hairpiece attachment and styling\n1.2 Prepared tools, equipment and supplies/materials according\n to client’s requirements and OH&S requirements\n1.3 Performed hairpiece attachment and styling procedures and\n techniques according to client desired results and\n manufacturer’s specifications\n1.4 Performed cross-checking and applied appropriate finishing\n touches\n1.5 Maintained hairpieces according to manufacturer’s\n instructions\n1.6 Used protective clothing according to health and sanitation\n regulations\n1.7 Followed safety precautions on clients during the entire\n process\n1.8 Performed post-service activities according to OH&S\n requirements\n2. Underpinning\nknowledge\n2.1 Different types of hairpieces and ornaments\n2.2 Different hairpiece attachment, styling procedures and\n techniques\n2.3 Procedures on taking wig measurements\n2.4 Elements and principles of hair design\n2.5 Balancing hair length and volume\n2.6 Procedures in cleaning and maintenance of hairpiece\n2.7 Different types of tools and materials in hairpiece\nattachment, styling and maintenance\n2.8 First- aid treatment\n2.9 DOH and OH&S requirements\n2.10 Code of ethics\n3. Underpinning\nskills\n3.1 Performing hairpiece attachment and styling procedures and\ntechniques\n3.2 Using appropriate tools and materials\n3.3 Interpreting manufacturer’s specifications\n3.4 Performing hairpiece maintenance\n3.5 Applying first-aid treatment\n3.6 Complying with DOH-IRR, health and sanitation\nrequirements\n3.7 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\n activity to be performed\n4.3 Working area / facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 62 ---\nTR - Hairdressing NC III\nAmended\n 58\nUNIT OF COMPETENCY :\nPERFORM PROSTHETICS AND SPECIAL EFFECTS\nMAKE-UP\nUNIT CODE\n:\nHCS515403\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nin designing, applying and removing prosthetic make-up for\nany production as required by the client.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1 Client is consulted on the prosthetics and special\neffects make-up requirements\n1.2 Design concept is created and agreed upon based\non consultation with the client’s prosthetics and\nspecial effects make-up requirements\n1.3 Make-up products and make-up test plan are\nprepared in consultation with the client\n1.4 Cost of the service are identified and explained to\nclient\n2. Make prosthetics\n2.1 Materials and equipment are prepared and used\nin accordance with prosthetic casting requirements\n2.2 Client’s comfort and protection from hazards are\nensured during the casting\n2.3 Cast is modeled and baked in accordance with\nprosthetic make-up design\n2.4 Prosthetic pieces are modeled/made from the cast\nusing the appropriate materials and equipment\nand following production requirements\n3. Prepare to apply\nprosthetics and special\neffects make-up\n\n3.1 Client’s requirements are confirmed prior to make-\nup application and testing\n3.2 Special effects products and equipment are\nselected and prepared in accordance with make-up\nplan to ensure sufficient quantity to meet the needs\nof the client\n3.3 Client is dressed with required protective covering\nmaterials\n3.4 Suitable cleansing product is used to cleanse\nclient’s face\n3.5 Health and hygiene procedures are identified for\nimplementation during preparation of make-up and\ncleansing procedure\n\n--- PDF PAGE 63 ---\nTR - Hairdressing NC III\nAmended\n 59\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Apply and maintain\nprosthetics and special\neffects make-up\n4.1 Prosthetic and products are applied in sequence\nwith appropriate applicators using appropriate\ntechniques in accordance with make-up plan,\nhygiene and procedures\n4.2 Final effect is checked and matched with the\nagreed prosthetic requirements\n4.3 Client’s acceptance is confirmed and adjustments\nare made if required\n4.4 Client’s safety and comfort are ensured during the\nentire process\n4.5 Health and hygiene procedures are applied/\nimplemented\n5. Remove prosthetics and\nspecial effects make-up\n5.1 Client is briefed on the removal of prosthetics and\nspecial effects make-up\n5.2 Client’s comfort is maintained during prosthetics\nand special effects make-up removal\n5.3 Edge is loosened using the adhesive remover for\nthe particular areas of skin, nature of prosthetic and\nadhesive used\n5.4 Make-up is removed using cleansing products\n5.5 Medical advice is sought in case of skin irritation or\nany other problem\n6. Perform post-service\n activities\n6.1 Make-up equipment is washed, disinfected and\nstored in accordance with salon policies and\nprocedures\n6.2 Waste items are properly disposed of in\naccordance with OH&S required practice\n6.3 Working area is cleaned in preparation for the next\n client\n\n--- PDF PAGE 64 ---\nTR - Hairdressing NC III\nAmended\n 60\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Prosthetics\nMay include but are not limited to:\n1.1 Solid prosthetics\n1.2 Single prosthetic such as nose, finger, ear, bald cap\n1.3 Soft prosthetics\n2. Special effects make-up\nMay be used to simulate:\n2.1 Scars\n2.2 Wounds\n2.3 Burns\n2.4 Cuts\n2.5 Grazes\n2.6 Skin disorders\n2.7 Fluids and solids\n2.8 Tears\n2.9 Ageing\n2.10 Body or facial features\n3. Make-up products\n3.1 Premake-up products\n3.2 Cleansers\n3.3 Toners\n3.4 Mositurizers\n3.5 Concealers\n3.6 Foundation (liquid/solid)\n3.7 Powders\n3.8 Fixative\n3.9 Eyeshadows (matt/frosted)\n3.10 Blushes\n3.11 Mascaras (powder, liquid, wand or block)\n3.12 Lipstick/lip glosses\n3.13 Eyebrow pencils\n3.14 Protective gels and creams\n3.15 Sun screen\n3.16 Casting plaster\n3.17 Latex\n3.18 Glues/gums\n\n--- PDF PAGE 65 ---\nTR - Hairdressing NC III\nAmended\n 61\nVARIABLE\nRANGE\n4. Materials and equipment\n4.1 Sponges\n4.2 Brushes\n4.3 Applicators\n4.4 Pallets or tiles\n4.5 Lash curlers\n4.6 Artificial lashes\n4.7 Latex\n4.8 Bald caps\n4.9 Tweezers\n4.10 Magnifying mirror\n4.11 Containers/tray etc\n4.12 Spatulas\n4.13 Make-up box\n4.14 Cotton buds\n4.15 Eye make-up remover pads\n4.16 Moist towelettes\n4.17 Powder puffs\n4.18 Pencil sharpener\n4.19 Towels\n4.20 Hairclips and bands\n4.21 Tissues\n4.22 Supply of water\n4.23 Protective bibs and smocks\n5. Production requirements\nMay include but are not limited to:\n5.1 Designers specifications\n5.2 Venue requirements\n5.3 Production schedule\n5.4 Client’s requirements\n5.5 Relevant health and hygiene requirements\n5.6 Lighting effects\n6. Types of production\nMay include but are not limited to:\n6.1 Feature films\n6.2 Documentaries\n6.3 Short films\n6.4 Commercials\n6.5 Filmed events or performances\n6.6 Music video\n6.7 Television productions (e.g. music, dance, comedy,\nvariety)\n6.8 Performances\n\n--- PDF PAGE 66 ---\nTR - Hairdressing NC III\nAmended\n 62\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on desired prosthetics and special effects\n make-up\n1.2 Prepared tools, equipment and supplies/materials\n according to client’s requirements and OH&S\n requirements\n1.3 Performed prosthetic and special effect s make-up\nprocedures and techniques according to client desired\nresults, manufacturer’s specifications\n1.4 Performed cross checking and applied appropriate\nfinishing touches\n1.5 Maintained hairpieces according to manufacturer’s\ninstructions\n1.6 Used protective clothing according to health and\nsanitation regulations\n1.7 Followed safety precautions to clients during the entire\nprocess\n1.8 Applied appropriate measures in response to emergencies\nor unavoidable circumstances\n1.9 Performed post-service activities according to OH&S\nrequirements\n2. Underpinning\nknowledge\n2.1 Different prosthetics\n2.2 Color design principles\n2.3 Products and color application techniques\n2.4 Cosmetic chemistry/ingredients relevant to make-up\n products in regard to the effects on the skin\n2.5 Physical appearance of various skin types\n2.6 Effects of lighting natural/artificial on make-up\n2.7 Facial areas requiring highlighting/shading\n2.8 Designs and make-up plans\n2.9 First aid treatment\n2.10 DOH and OH&S requirements\n2.11 Code of ethics\n3. Underpinning\nskills\n3.1 Sketching and modeling\n3.2 Conducting research relevant to making prosthetics and\nspecial effects make-up\n3.3 Designing prosthetics and special effects make-u[\n3.4 Apply basic understanding of anatomy and physiology of\nthe skin and skin structures as they relate to make-up\nservices\n3.5 Interpreting production requirements\n3.6 Making, applying, fitting, cutting and sealing prosthetics\nand special effects make-up\n3.7 Complying with DOH and OH&S requirements\n3.8 Applying first-aid treatment\n3.9 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3 Working area / facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 67 ---\nTR - Hairdressing NC III\nAmended\n 63"
