        "source_title": "PERFORM CREATIVE HAIRSTYLING",
        "source_text": "--- PDF PAGE 35 ---\nTR - Hairdressing NC III \nAmended    \n 31 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nPERFORM CREATIVE HAIRSTYLING \n \nUNIT CODE \n: \nHCS515307 \n \nUNIT DESCRIPTOR  \n: \nThis unit covers the knowledge, skills and attitude in the \nperformance of executing creative hairstyling. This involve \nassessing the needs of the client, executing the desired \nand agreed creative hair design and applying finishing \ntouches on the result. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Prepare client \n1.1 Shape of the client’s face and the head is assessed \n1.2 Texture and volume of clients’ hair is checked \nthrough touch and visual analysis \n1.3 Creative hairstyle options are presented to the client \n1.4 Desired hairstyle is determined according to clients \nprofile and events to be attended \n1.5 Client is advised to remove all personal accessories for \nsafety and comfort \n1.6 Client is draped and shampooed according to salon \nprocedures \n1.7 Tools and equipment, supplies and materials, \nimplements are selected and prepared according to \nhair design\n2.  Carry out creative \nhairstyling \n2.1 Hair is toweled, dried and exposed to heat then blow-dry \nfor best results \n2.2 Appropriate tools are used to perform various hairstyles \n2.3 Hairstyle is performed according to desired creative \nhairstyle and established or acceptable procedures \n2.4 Clients’ safety and comfort are ensured during the entire \nprocess \n3.  Apply finishing \ntouches \n3.1 Outcome is checked according to agreed hairstyle \n3.2 All hair implements and hairstyle accessories are \nplaced to enhance hairstyle \n3.3 Hairstyle is polished through application of hairstyling \nproduct\n4. Perform post-service \nactivities \n4.1 Client is advised on hair care and maintenance \naccording to salon procedures \n4.2 Tools, implements and equipments are cleaned, \nsterilized and stored in accordance with salon policy \n4.3 Waste items are properly disposed of in accordance with \nOH&S required practice \n4.4 Working area is cleaned in preparation for the next client\n\n--- PDF PAGE 36 ---\nTR - Hairdressing NC III \nAmended    \n 32 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Shape of face \n1.1 Oval    \n1.2 Round  \n1.3 Square \n1.4 Heart  \n1.5 Diamond \n1.6 Pear  \n1.7 Rectangular \n1.8 Triangular   \n2.  Texture and volume of    \nhair \n2.1 Fine \n2.2 Thick \n2.3 Medium \n2.4 Wiry\n3.  Creative hairstyle options \n3.1  Commercial hairstyling \n3.2  Up-style \n3.3  Curling \n3.4  Straightening \n3.5  Hair teasing \n3.6  Extension attachment \n3.7  Avante garde hairstyling\n4.  Supplies and Materials \n4.1   Setting lotion \n4.2   Shampoo \n4.3   Cotton \n4.4   Tissue\n5.  Tools / Implements \n5.1   Hairpin \n5.2   Roller Pin \n5.3   Single Prong Clip \n5.4   Double Prong Clip \n5.5   Duck Bill Clamp \n5.6   Rubber Band \n5.7   Cylinder Shaped Rollers (Long and Short) \n5.8   Large Tooth Comb \n5.9   All Purpose Comb \n5.10 Tail Comb \n5.11 Teasing Comb \n5.12 Spout Plastic Bottle Dispenser \n5.13 Press Spray Plastic Dispenser Bottle \n5.14 Roller Brush \n5.15 Natural Bristles \n5.16 Synthetic Bristles \n5.17 Small Size Hair Rollers Wire \n5.18 Medium Size Rollers\n\n--- PDF PAGE 37 ---\nTR - Hairdressing NC III \nAmended    \n 33 \nVARIABLE \nRANGE \n \n5.19 Large Size Rollers \n5.20 Jumbo Rollers \n5.21 Hair Dryer \n5.22 Hand Blower \n5.23 Crimpers \n5.24 Curling Iron \n5.25 Electric Curlers \n5.26 Triangle Net \n5.27 Invisible Pins \n5.28 Invisible Hairnet \n5.29 Wig\n6.   Established or acceptable \nprocedures in creative \nhairstyling \nMay include but are not limited to: \n6.1   Section hair depending on client’s hairstyle \nrequirements \n6.2   Fix and secure hair according to hair design \n6.3   Use hairstyle product and implements to achieve    \nbest results \n7.  Personal Accessories \n7.1   Fashion accessories (e.g. stones, beads, etc) \n7.2   Hair ornaments (e.g. pony tails, petals, pin curls,  \n       braids)\n8.  Protective Clothing \n8.1  Towel \n8.2  Cape \n8.3  Hair Spray Net Mask \n8.4  Headband \n8.5  Smock Gown\n9. Hairstyles Technique \n9.1   Finger Waving \n9.2   Pin Curls \n9.3   Diagonal Waves \n9.4   Waved Bangs \n9.5   Ridge Curls \n9.6   Skip Wave \n9.7   Cascade or Stand Up Curl \n9.8   Semi Stand-Up Curls \n9.9   Roller Curls \n9.10  Barrel Curls \n9.11  Hair Partings \n9.12  Back Combing\n10.  Hairstyling products and \nimplements \n10.1   Setting Lotion/Gel \n10.2   Hair wax \n10.2.1  Wet wax \n10.2.2  Dry wax \n10.3   Hair serum \n10.4   Hair spray \n10.5   Mousse \n10.6   Leave-on conditioners\n11.  Hairstyle Accessories \n11.1   Hairpiece (e.g. wig) \n11.2\n Hair Ornaments\n\n--- PDF PAGE 38 ---\nTR - Hairdressing NC III \nAmended    \n 34 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Consulted and prepared client on desired creative hairstyle \nand its procedures \n1.2 Determined client’s profile and events to be attended \n1.3 \nPrepared and used supplies, materials, tools and hair \nimplements according to desired creative hairstyle \nfollowing OH& S requirements \n1.4    Performed desired creative hairstyle following appropriate \ntechnique and established or acceptable procedures  \n1.5 Used hairstyle products, implements and accessories to \nachieve sturdy and best results \n1.6 Checked and applied final touch on the finished hairstyle \n1.7 Ensured client’s safety and comfort during the entire \nprocess \n1.8  Applied appropriate measures in response to   \n         emergencies or unavoidable circumstances \n1.9    Performed post-service activities in accordance with \nOH&S requirements\n2.  Underpinning \nknowledge  \n2.1 Code of Ethics \n2.2 Salon Policies and Procedures \n2.3 Customer Relations \n2.4 Different Shape of Face \n2.5 Different Creative Hair design/Hairstyles \n2.6 Creative Hair Design/Hairstyling Principles and Techniques \n2.7 Hair Analysis \n2.8 DOH and OH&S requirements \n2.9 Different Tools and Equipment \n2.10 First-aid Treatment\n3.  Underpinning \nskills \n3.1 Assessing client’s profile \n3.2 Checking  hair texture and volume \n3.3 Draping \n3.4 Shampooing \n3.5 Using appropriate tools and materials, implements and \nornaments/accessories \n3.6 Sectioning of hair \n3.7 Perform different creative hairstyling techniques \n3.8 Observing code of ethics \n3.9 Applying first-aid treatment\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nModel \n4.2 \nTools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3\nWork area/facilities\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1   Demonstration with Oral Questioning \n5,2   Third-Party Report \n5.3   Portfolio    \n6. Context of \nassessment\nCompetency may be assessed in the workplace or TESDA \naccredited assessment center\n",
