  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in HAIRDRESSING NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\n information about\n workplace processes\n1.1\nAppropriate communication method is selected.\n1.2\nMultiple operations involving several topics areas are\ncommunicated accordingly\n1.3\nQuestions are used to gain extra information\n1.4\nCorrect sources of information are identified\n1.5\nInformation is selected and organized correctly\n1.6\nVerbal and written reporting is undertaken when\nrequired\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1\nResponse to workplace issues is sought\n2.2\nResponse to workplace issues is provided\nimmediately\n2.3\nConstructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4\nGoals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1\nIssues and problems are identified as they arise\n3.2\nInformation regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3\nDialogue is initiated with appropriate personnel\n3.4\nCommunication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 7 ---\nTR - Hairdressing NC III\nAmended\n 3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2\nVerbal\n1.3\nFace to face\n1.4\nTwo-way radio\n1.5\nSpeaking to groups\n1.6\nUsing telephone\n1.7\nWritten\n1.8\nInternet\n\n--- PDF PAGE 8 ---\nTR - Hairdressing NC III\nAmended\n 4\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one\ntime.\n1.2\nMade constructive contributions in workplace issues.\n1.3\nSought workplace issues effectively.\n1.4\nResponded to workplace issues promptly.\n1.5\nPresented information clearly and effectively written form.\n1.6\nUsed appropriate sources of information.\n1.7\nAsked appropriate questions.\n1.8\nProvided accurate information.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning\nskills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of\nwritten and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group.\n\n--- PDF PAGE 9 ---\nTR - Hairdressing NC III\nAmended\n 5\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\n\nUNIT CODE\n:\n500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team leadership\n1.1\nWork requirements are identified and presented\nto team members\n1.2\nReasons for instructions and requirements are\ncommunicated to team members\n1.3\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude\nrequired to properly undertake the assigned task\nand according to company policy\n2.2\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based\non client needs and according to assignment\nrequirements\n3.2\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2\nTeam members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer\npolicy\n4.4\nTeam members are kept informed of any changes\nin the priority allocated to assignments or tasks\nwhich might impact on client/customer needs and\nsatisfaction\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met.\n4.6\nFollow-up communication is provided on all issues\naffecting the team\n4.7\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 10 ---\nTR - Hairdressing NC III\nAmended\n 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s\nconcerns\n2.1\nRoster/shift details\n3. Monitor\nperformance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 11 ---\nTR - Hairdressing NC III\nAmended\n 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2\nAssessed and monitored team and individual\nperformance against set criteria\n1.3\nRepresented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5\nSet and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment.\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group.\n\n--- PDF PAGE 12 ---\nTR - Hairdressing NC III\nAmended\n 8\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE\n:\n500311111\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required\nto collect information in order to negotiate to a desired\noutcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\nInformation on preparing for negotiation is identified\nand included in the plan\n1.2\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the\nplan\n1.3\nInformation on active listening is identified and\nincluded in the plan\n1.4\nInformation on different questioning techniques is\nidentified and included in the plan\n1.5\nInformation is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n\n2.1\nCriteria for successful outcome are agreed upon by\nall parties\n2.2\nDesired outcome of all parties are considered\n2.3\nAppropriate language is used throughout the\nnegotiation\n2.4\nA variety of questioning techniques are used.\n2.5\nThe issues and processes are documented and\nagreed upon by all parties\n2.6\nPossible solutions are discussed and their viability\nassessed\n2.7\nAreas for agreement are confirmed and recorded\n2.8\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 13 ---\nTR - Hairdressing NC III\nAmended\n 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\nBackground information on other parties to the\nnegotiation\n1.2\nGood understanding of topic to be negotiated\n1.3\nClear understanding of desired outcome/s\n1.4\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\nFriendly reception\n2.2\nWarm and welcoming room\n2.3\nRefreshments offered\n2.4\nLead in conversation before negotiation begins\n3. Active listening\n3.1\nAttentive\n3.2\nDon’t interrupt\n3.3\nGood posture\n3.4\nMaintain eye contact\n3.5\nReflective listening\n4. Questioning\ntechniques\n4.1\nDirect\n4.2\nIndirect\n4.3\nOpen-ended\n\n--- PDF PAGE 14 ---\nTR - Hairdressing NC III\nAmended\n 10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome.\n1.2\nParticipated in negotiation with at least one person to\nachieve an agreed outcome.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCodes of practice and guidelines for the organization\n2.2\nOrganizations policy and procedures for negotiations\n2.3\nDecision making and conflict resolution strategies\nprocedures\n2.4\nProblem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5\nFlexibility\n2.6\nEmpathy\n3. Underpinning\nskills\n3.1\nInterpersonal skills to develop rapport with other parties\n3.2\nCommunication skills (verbal and listening)\n3.3\nObservation skills\n3.4\nNegotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRoom with facilities necessary for the negotiation process\n4.2\nHuman resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation/demonstration and questioning\n5.2\nPortfolio assessment\n5.3\nOral and written questioning\n5.4\nThird party report\n6. Context of\nassessment\n6.1\nCompetency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 15 ---\nTR - Hairdressing NC III\nAmended\n 11\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\n\nUNIT CODE\n: 500311112\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to determine\nand resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1\nVariances are identified from normal operating\nparameters; and product quality\n1.2\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3\nProblems are clearly stated and specified\n2. Determine fundamental\ncauses of the problem\n2.1\nPossible causes are identified based on\nexperience and the use of problem solving tools /\nanalytical techniques\n2.2\nPossible cause statements are developed based\non findings\n2.3\nFundamental causes are identified per results of\ninvestigation conducted\n3. Determine corrective\naction\n3.1\nAll possible options are considered for resolution\nof the problem\n3.2\nStrengths and weaknesses of possible options are\nconsidered\n3.3\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and operating\nprocedures\n4. Provide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations is prepared\n4.2\nRecommendations are presented to appropriate\npersonnel\n4.3\nRecommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\nTR - Hairdressing NC III\nAmended\n 12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n\n2.1\nNon-routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 17 ---\nTR - Hairdressing NC III\nAmended\n 13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem.\n1.2\nDetermined the fundamental causes of the problem.\n1.3\nDetermined the correct / preventive action.\n1.4\nProvided recommendation to manager.\nThese aspects may be best assessed using a range of scenarios /\ncase studies / what ifs as a stimulus with a walk through forming part\nof the response. These assessment activities should include a range\nof problems, including new, unusual and improbable situations that\nmay have happened.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating parameters,\nand product quality to recognize non-standard situations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1 Relevant equipment and operational processes\n2.2.2 Enterprise goals, targets and measures\n2.2.3 Enterprise quality, OHS and environmental\nrequirement\n2.2.4 Principles of decision making strategies and\ntechniques\n2.2.5 Enterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well as\nbank of questions which will be used to probe the reason\nbehind the observable action.\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nCase studies on solving problems in the workplace\n5.2\nObservation\nThe unit will be assessed in a holistic manner as is practical and may\nbe integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations, which\nwill include disruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual workplace and\nwill include walk through of the relevant competency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 18 ---\nTR - Hairdressing NC III\nAmended\n 14\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\n\nUNIT CODE\n:\n500311113\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin the application of mathematical concepts and\ntechniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nmathematical tools\nand techniques to\nsolve problem\n1.1\nProblem areas are identified based on given condition\n\n1.2\nMathematical techniques are selected based on the\ngiven problem\n2. Apply mathematical\nprocedure/solution\n2.1\nMathematical techniques are applied based on the\nproblem identified\n2.2\nMathematical computations are performed to the level\nof accuracy required for the problem\n2.3\nResults of mathematical computation is determined\nand verified based on job requirements\n3. Analyze results\n3.1\nResult of application is reviewed based on expected\nand required specifications and outcome\n3.2\nAppropriate action is applied in case of error\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1\nFour fundamental operations\n\nMeasurements\n1.2\nUse/Conversion of units of measurements\n1.3\nUse of standard formulas\n2. Appropriate action\n2.1\nReview in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2\nReport error to immediate superior for proper action\n\n--- PDF PAGE 19 ---\nTR - Hairdressing NC III\nAmended\n 15\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nFundamental operation (addition, subtraction, division,\nmultiplication)\n2.2\nMeasurement system\n2.3\nPrecision and accuracy\n2.4\nBasic measuring tools/devices\n3. Underpinning\nskills\n3.1\nApplying mathematical computations\n3.2\nUsing calculator\n3.3\nUsing different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nCalculator\n4.2\nBasic measuring tools\n4.3\nCase Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nAuthenticated portfolio\n5.2\nWritten Test\n5.3\nInterview/Oral Questioning\n5.4\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 20 ---\nTR - Hairdressing NC III\nAmended\n 16\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\n\nUNIT CODE\n:\n500311114\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study/select\nappropriate\ntechnology\n1.1\nUsage of different technologies is determined based\non job requirements\n1.2\nAppropriate technology is selected as per work\nspecification\n2. Apply relevant\ntechnology\n\n2.1\nRelevant technology is effectively used in carrying\nout function\n2.2\nApplicable software and hardware are used as per\ntask requirement\n2.3\nManagement concepts are observed and practiced\nas per established industry practices\n3. Maintain/enhance\nrelevant technology\n3.1\nMaintenance of technology is applied in accordance\nwith the industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to\nensure its operative ability\n3.2\nUpdating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3\nTechnology failure/ defect is immediately reported to\nthe concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 21 ---\nTR - Hairdressing NC III\nAmended\n 17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1\nOffice technology\n1.2\nIndustrial technology\n1.3\nSystem technology\n1.4\nInformation technology\n1.5\nTraining technology\n2. Management\nconcepts\nMay include but not limited to:\n2.1\nReal Time Management\n2.2\nKAIZEN or continuous improvement\n2.3\n 5 S\n2.4\nTotal Quality Management\n2.5\nOther management/productivity tools\n3. Industry standard\noperating procedure\n3.1\nWritten guidelines relative to the usage of office\ntechnology/equipment\n3.2\nVerbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1\nWritten instruction/manuals of specific technology/\nequipment\n4.2\nGeneral instruction manual\n4.3\nVerbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health\nand safety procedure\n5.1\nRelevant statutes on OHS\n5.2\nCompany guidelines in using technology/equipment\n6. Appropriate action\n6.1\nImplementing preventive maintenance schedule\n6.2\nCoordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\nTR - Hairdressing NC III\nAmended\n 18\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nStudied and selected appropriate technology consistent\nwith work requirements.\n1.2\nApplied relevant technology.\n1.3\nMaintained and enhanced operative ability of relevant\ntechnology.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nAwareness on technology and its function\n2.2\nRepair and maintenance procedure\n2.3\nOperating instructions\n2.4\nApplicable software\n2.5\nCommunication techniques\n2.6\nHealth and safety procedure\n2.7\nCompany policy in relation to relevant technology\n2.8\nDifferent management concepts\n2.9\nTechnology adaptability\n3. Underpinning\nskills\n3.1\nRelevant technology application/implementation\n3.2\nBasic communication skills\n3.3\nSoftware applications skills\n3.4\nBasic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant technology\n4.2\nInterview and demonstration questionnaires\n4.3\nAssessment packages\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nInterview\n5.2\nActual demonstration\n5.3\nAuthenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1\nCompetency may be assessed in actual workplace or\nsimulated environment.\n\n--- PDF PAGE 23 ---\nTR - Hairdressing NC III\nAmended\n 19\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH\nCLIENTS/CUSTOMERS\n\nUNIT CODE\n:\nHCS516201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin building and maintaining an effective relationship with\nclients, customers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain a\nprofessional image\n\n1.1 Uniform and personal grooming maintained to\nassignment requirements\n1.2 Personal presence maintained according to employer\nstandards\n1.3 Visible work area kept tidy and uncluttered\n1.4 Equipment stored according to assignment\nrequirements\n2. Meet client/customer\nrequirements\n2.1 Client requirements identified and understood by\nreferral to the assignment instructions\n2.2 Client requirements met according to the assignment\ninstructions\n2.3 Changes to client’s needs and requirements\nmonitored and appropriate action taken\n2.4 All communication with the client or customer is clear\nand complies with assignment requirements\n3. Build credibility with\ncustomers/clients\n3.1 Client expectations for reliability, punctuality and\nappearance adhered to\n3.2 Possible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.3 Client fully informed of all relevant security matters in a\ntimely manner and according to agreed reporting\nprocedures\n\n--- PDF PAGE 24 ---\nTR - Hairdressing NC III\nAmended\n 20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\n\nMay include:\n1.1 Stance\n1.2 Posture\n1.3 Body Language\n1.4 Demeanour\n1.5 Grooming\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n3. Client Requirements\nMay include:\n3.1 Assignment Instructions\n3.2 Post Orders\n3.3 Scope to modify instructions/orders in light of changed\nsituations\n4. Assignment\nInstructions\nMay be conveyed in:\n4.1 Writing\n4.2 Verbally\n4.3 Electronically\n5. Client’s Needs and\nRequirements\nMay be detected by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n6. Appropriate Action\nMay include:\n6.1 Implementing required changes\n6.2 Referral to appropriate employer personnel\n6.3 Clarification of client needs and instructions\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 25 ---\nTR - Hairdressing NC III\nAmended\n 21\nEVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained a professional image\n1.2 Interpreted client/customer requirements from information\ncontained in the client brief and/or assignment instructions\n1.3 Dealt successfully with a variety of client/customer interactions\n1.4 Monitored and acted on changing client or customer needs\n1.5 Met client/customer requirements\n1.6 Built credibility with customers/clients\n2. Underpinning\nknowledge\nand attitudes\n2.1 Uniform and personal grooming requirements of the employer and\nthe client\n2.2 Occupational Health and safety requirement for the assignment\n2.3 Assignment Instructions\n3. Underpinning\nskills\n3.1 Attention to detail when completing client/employer documentation\n3.2 Interpersonal and communication skills required in client contact\nassignments\n3.3 Customer service skills required to meet client/customer needs\n3.4 Punctuality\n3.5 Customer Service\n3.6 Telephone Technique\n3.7 Problem Solving and Negotiation\n3.8 Maintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9 Assessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3Observation with questioning\n6. Context of\nassessment\n6.1 Company\n6.2 On-Site\n6.3 Assessment activities are carried out through TESDA accredited\nassessment centers/venues by using closely simulated\nworkplace environment.\n6.4 Continuous assessment in an institutional setting that stimulates\nthe conditions of performance describe in the elements,\nperformance criteria and range of variables statement that make\nup this unit.\n6.5 Continuous assessment in the workplace, taking into account the\nrange of variables affecting performance.\n6.6 Self-assessment on the same terms as those described above.\n6.7 Simulated assessment or critical incident assessment, provided\nthat the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria.\n\n--- PDF PAGE 26 ---\nTR - Hairdressing NC III\nAmended\n 22\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:\nHCS516202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin effectively managing own workload and quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n\n1.1\nTasks accurately identified\n1.2\nPriority allocated to each task\n1.3\nTime lines allocated to each task or series of tasks\n1.4\nTasks deadlines known and complied with whenever\npossible\n1.5\nWork schedules are known and