anced make-up application in accordance \nwith established or acceptable procedures \n1.5 Performed checking and applied finishing touches to achieve \nbest result in accordance with client’s requirements \n1.6 Ensured client’s safety and comfort during the entire process \n1.7   Applied appropriate measures in response to emergencies   \n        or unavoidable circumstances \n1.8   Performed post-service activities according to salon policies  \n       and procedures, and OH&S requirements\n2.  Underpinning \nknowledge  \n2.1 Code of Ethics \n2.2 Different Facial Shapes \n2.3 Facial Skin and Type Analysis \n2.4 Advanced /Creative Make-up Techniques \n2.5 Make-Up Procedure/Sequence \n2.6 Make-Up Product Knowledge \n2.7 Make–Up Technique \n2.8 First-aid Treatment \n2.9 DOH-IRR and OH&S requirements\n3.  Underpinning \nskills \n3.1 Handling clients \n3.2 Handling tools and materials \n3.3 Contouring of face \n3.4 Applying make-up/blending of color as per requirement \n3.5 Finishing touches/recommendation for touch-up \n3.6 Observing code of ethics \n3.7 Applying first-aid treatment\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1  Model \n4.2  Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3 Work area/facilities\n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1  Demonstration with Oral Questioning \n5.2  Third-Party Report \n5.3 Portfolio\n6.  Context of \nassessment\nCompetency may be assessed in the workplace or  TESDA \naccredited assessment centers\n",
