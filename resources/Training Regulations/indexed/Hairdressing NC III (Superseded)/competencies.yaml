          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Planned for completion of own workload\n1.2 Assessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3 Demonstrated capacity to complete task within specified\ntime frame\n1.4 Maintained quality of own performance\n2. Underpinning\nknowledge and\nattitudes\n2.1 Site and assignment requirements\n2.2 Employer policy on performance management\n2.3 Indicators of appropriate performance for each area of\nresponsibility\n2.4 Steps for improving or maintaining performance\n3. Underpinning\nskills\n3.1 Capacity to plan and prioritize security work loads and\nrequirements\n3.2 Time and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9 Assessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3Observation with questioning\n6. Context of\nassessment\n6.1 Company\n6.2 On-Site\n6.3 Assessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n6.4 Continuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit.\n6.5 Continuous assessment in the workplace, taking into\naccount the range of variables affecting performance.\n6.6 Self-assessment on the same terms as those described\nabove.\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment\nagainst performance criteria and an evaluation of\nunderpinning knowledge and skill required to achieve the\nrequired performance criteria.\n\n--- PDF PAGE 29 ---\nTR - Hairdressing NC III\nAmended\n 25\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
        },
        "source_text": "HCS516202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nin effectively managing own workload and quality of work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan for completion of\nown workload\n\n1.1\nTasks accurately identified\n1.2\nPriority allocated to each task\n1.3\nTime lines allocated to each task or series of tasks\n1.4\nTasks deadlines known and complied with whenever\npossible\n1.5\nWork schedules are known and completed within\nagreed time frames\n1.6\nWork plans developed according to assignment\nrequirements and employer policy\n1.7\nUncompleted work or tasks detailed and responsibility\nfor completion passed to incoming shift or other\nappropriate persons\n2. Maintain quality of\nown performance\n2.1\nPersonal performance continually monitored against\nagreed performance standards\n2.2\nAdvice and guidance sought when necessary to\nachieve or maintain agreed standards\n2.3\nGuidance from management applied to achieve or\nmaintain agreed standards\n2.4\nStandard of work clarified and agreed according to\nemployer policy and procedures\n3. Build credibility with\ncustomers/clients\n3.4 Client expectations for reliability, punctuality and\nappearance adhered to\n3.5 Possible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.6 Client fully informed of all relevant security matters in a\ntimely manner and according to agreed reporting\nprocedures\n\n--- PDF PAGE 27 ---\nTR - Hairdressing NC III\nAmended\n 23\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1\nMay identified through:\n1.1.1 Assignment instructions\n1.1.2 Verbal Instructions by senior officer\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self Assessment\n1.2\nMay be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1\nAssignment Instructions\n2.2\nProcedures established in policy documents\n\n--- PDF PAGE 28 ---\nTR - Hairdressing NC III\nAmended\n 24\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Planned for completion of own workload\n1.2 Assessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3 Demonstrated capacity to complete task within specified\ntime frame\n1.4 Maintained quality of own performance\n2. Underpinning\nknowledge and\nattitudes\n2.1 Site and assignment requirements\n2.2 Employer policy on performance management\n2.3 Indicators of appropriate performance for each area of\nresponsibility\n2.4 Steps for improving or maintaining performance\n3. Underpinning\nskills\n3.1 Capacity to plan and prioritize security work loads and\nrequirements\n3.2 Time and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9 Assessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3Observation with questioning\n6. Context of\nassessment\n6.1 Company\n6.2 On-Site\n6.3 Assessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n6.4 Continuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit.\n6.5 Continuous assessment in the workplace, taking into\naccount the range of variables affecting performance.\n6.6 Self-assessment on the same terms as those described\nabove.\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment\nagainst performance criteria and an evaluation of\nunderpinning knowledge and skill required to achieve the\nrequired performance criteria.\n\n--- PDF PAGE 29 ---\nTR - Hairdressing NC III\nAmended\n 25\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
