osed of in accordance  \nwith OH&S required practice \n4.3 Working area is cleaned in preparation for the next \nclient\n\n--- PDF PAGE 57 ---\nTR - Hairdressing NC III \nAmended    \n 53 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Hair extension concept\n1.1    Adding length\n1.2    Increasing density \n1.3    Adding color \n1.4    Applying to full or partial head\n2.  Natural hair’s texture,\n.    density, length and \nshape \n2.1   Texture\n        -  Fine \n        -  Medium \n        -  Thick \n        -   Wiry \n2.2  Density \n        -  Volume \n        -   Weight \n2.3   Length \n        -  Short  \n        -  Medium \n        -  Long \n2.4  Shape \n        -  Round \n        -  Triangle \n       - Square\n3.  Personal attributes\n3.1   Age\n3.2   Personal image/Lifestyle \n3.3   Job or career\n4.  Type of hair extension \ntechnique \n4.1    Clip-in\n4.2    Glue \n4.3    Adhesive/Bonding \n4.4    Rubber \n4.5    Weave/Braid \n4.6    Wefts \n4.7    Track- and- Sew method \n4.8    Keratin plastic \n5.  Tools \n5.1    Blow dryers\n5.2    Brushes \n5.3    Combs/Tail Comb \n5.4    Crochet hook \n5.4    Hair extension clipper  \n5.5    Hair clip\n6.   Supplies/Materials\n \n6.1  Threads\n6.2  Styling products \n       -  Gel/Styling gel \n       -  Mousse \n       -  Spray net/Hair spray  \n       -  Hair polish/Hair serum \n       -  Hair wax (wet and dry) \n6.3  Towel \n6.4  Tissues \n6.5  Shampoos \n6.6  Neck strip \n6.7  Styling cape\n7.  Workplace policies and \nprocedures \n7.1    Client comfort and safety\n7.2    Health and hygiene \n7.3    Sanitation\n8.  Desired result\n8.1    Symmetry/Balance\n8.2    Evenness \n8.3    Hair extension blends with natural hair \n8.4    No visible hair implements and attachments\n\n--- PDF PAGE 58 ---\nTR - Hairdressing NC III \nAmended    \n 54 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Consulted client on hair extension requirements \n1.2 Prepar