itudes\n2.1 Site and assignment requirements\n2.2 Employer policy on performance management\n2.3 Indicators of appropriate performance for each area of\nresponsibility\n2.4 Steps for improving or maintaining performance\n3. Underpinning\nskills\n3.1 Capacity to plan and prioritize security work loads and\nrequirements\n3.2 Time and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Assessment Centers/Venues\n4.2 Accredited Assessors\n4.3 Modes of Assessment\n4.4 Evaluation Reports\n4.5 Access to a relevant venue, equipment and materials\n4.6 Assignment Instructions\n4.7 Logbooks\n4.8 Operational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9 Assessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written Test/Examination\n5.2 Demonstration with questioning\n5.3Observation with questioning\n6. Context of\nassessment\n6.1 Company\n6.2 On-Site\n6.3 Assessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n6.4 Continuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit.\n6.5 Continuous assessment in the workplace, taking into\naccount the range of variables affecting performance.\n6.6 Self-assessment on the same terms as those described\nabove.\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment\nagainst performance criteria and an evaluation of\nunderpinning knowledge and skill required to achieve the\nrequired performance criteria.\n\n--- PDF PAGE 29 ---\nTR - Hairdressing NC III\nAmended\n 25\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nHCS515204\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes needed\nto apply quality standards in the workplace. The unit also\nincludes the application of relevant safety procedures and\nregulations, salon/organizational procedures and other\nclient requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess clients\nservice needs\n\n1.1 Work instruction is obtained and work is carried out in\naccordance with standard operating procedures\n1.2 Clients needs are checked against workplace\nstandards and specifications\n1.3 Faults on clients and any identified causes are\nrecorded and/or reported to the supervisor concerned\nin accordance with workplace procedures\n1.4 Clients profile and service extended to them are\ndocumented in accordance with workplace\nprocedures\n2. Assess own work\n2.1\nDocumentation relative to quality within the company\nis identified and used\n2.2\nCompleted work is checked against workplace\nstandards relevant to the task undertaken\n2.3\nErrors are identified and improved on\n2.4\nInformation on the quality and other indicators of\nindividual performance is recorded in accordance with\nworkplace procedures\n2.5\nIn cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ standard operating\nprocedures\n3. Engage in quality\nimprovement\n3.1 Process improvement procedures are participated in\nrelative to workplace assignment\n3.2 Work is carried out in accordance with process\nimprovement procedures\n3.3 Performance of operation or quality of product of service\nto ensure other client satisfaction is monitored\n\n--- PDF PAGE 30 ---\nTR - Hairdressing NC III\nAmended\n 26\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. External Clients\n\nMay include but not limited to:\n1.1 Teenagers\n1.2 Adult Men\n1.3 Working Adult\n1.4 Child\n2. Faults\nMay include but not limited to:\n2.1\nClient not satisfied\n2.2 Desired result is not within the desired result of client\n2.3 Procedures done but do not conform with any Salon\npolicies and procedures\n2.4 Damaged caused to client\n3. Documentation\n3.1 Organization Work Procedures\n3.2 Manufacturer’s Instruction Manual\n3.3 Client Requirements\n3.4 Forms\n4. Errors\nMay be related to the following:\n4.1 Deviation from the requirements of the client\n4.2 Deviation\nfrom\nthe\nrequirements\nof\nthe\nsalon/organization\n5. Quality Standards\nMay be related but not limited to the following:\n5.1 Supplies and Materials\n5.2 Facilities\n5.3 Salon Product\n5.4 Service Processes and Procedures\n5.5 Client Service\n5.6 Environmental Regulations\n6. Client\n6.1 Co-worker\n6.2 Supplier/Vendor\n6.3 Client\n6.4 Organization receiving the product or service\n\n--- PDF PAGE 31 ---\nTR - Hairdressing NC III\nAmended\n 27\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Carried out work in accordance with the company’s\nstandard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported errors or deviations not in accordance with\nstandard operating procedures\n1.4 Carried out work in accordance with the process\nimprovement\n2. Underpinning\nknowledge and\nattitudes\n2.1 Relevant Production Processes, Materials and Products\n2.2 Characteristics of Materials, Software and Hardware\nUsed in Production Processes\n2.3 Quality Checking Procedures\n2.4 Client Relations\n2.5 Work Place Procedures\n2.6 Safety and Environmental Aspects of Service\nProcesses\n2.7 Error Identification and Reporting\n2.8 Quality Improvement Processes\n3. Underpinning skills\n3.1 Reading skills required to interpret work instructions,\nproduct manufacturer’s requirements\n3.2 Communication skills needed to interpret and apply\ndefined work procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5 Solution providing and decision making\n3.6 Interpersonal skills or dealing with varied type of clients\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Materials\n4.2 Product\n4.3 Equipment\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Third Party Report\n5.3 Practical Demonstration with questioning\n6. Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 32 ---\nTR - Hairdressing NC III\nAmended\n 28\nUNIT OF COMPETENCY :\nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK\nENVIRONMENT\n\nUNIT CODE\n:\nHCS515205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed\nto maintain client relations. The unit incorporates the work\nsafety guidelines. It encompasses competencies necessary\nto maintain a safe workplace for staff, clients and others. It\nalso involves the application of health regulations, including\npersonal hygiene practiced by staff members, provision of a\ncaring client environment and the efficient operation of the\nsalon.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Comply with health\nregulations\n\n1.1\nSalon policies and procedures for personal hygiene\napplied\n1.2\nProcedures and practices implemented in a variety of\nsalon situations in accordance with state and local\ngovernment health regulations\n2. Assess own work\n2.1 Reception, work areas and walkways maintained in a\nsafe, uncluttered and organized manner according to\nsalon policy\n2.2 All routines carried out safely, effectively with minimum\ninconvenience to clients and staff\n2.3 Waste is stored and disposed of according to OHSC\nrequirements\n2.4 Spills, food, waste, hair or potential hazards promptly\nremoved from floors according to salon policy\n2.5 Linen is stored, cleaned and disinfected in line with OHS\nrequirements and salon procedures.\n2.6 Refreshments are provided to all clients\n3. Check and maintain\ntools and\nequipment\n3.1\nTools and equipment are stored safely and in