 Dark \n5. Protective clothing  \n5.1 Bath Towel \n5.2 Headband \n5.3 Smock Gown \n5.4 Face Towel or Towellette \n6. Personal Accessories \n6.1   Earrings \n6.2   Necklace \n6.3   Any pierced items in the face \n7.  Make-up tools, supplies and \nmaterials \nTools    \n7.1   Sharpener \n7.2   Eyelash Curler \n7.3   Powder Applicator \n7.4   Flat Brush and Foundation Brush \n7.4.1 Eye Liner Brush \n7.4.2 Eye Shadow Brush \n7.4.3 Large Angle Brush \n7.4.4 Small Eyebrow Brush\n\n--- PDF PAGE 53 ---\nTR - Hairdressing NC III \nAmended    \n 49 \n \nVARIABLE \nRANGE \n \n7.4.5 Large Blusher Brush \n7.4.6 Powder Brush \n7.4.7 Brow with Comb Brush \n7.4.8  Body Brush  \n7.4.9  Lip Brush  \n7.5   Eye Brow Scissor \n7.6   Fun Brush \n7.7   Eye Brow Blade \n7.8   Tweezer \nSupplies and Materials  \n7.9  Sponge \n7.9.1 Natural \n7.9.2 Sea Sponge \n7.10  Make-up Products \n8.  Eyebrow may be defined \nthrough \n8.1   Plucking \n8.2   Threading \n8.3   Shaving \n9. Make-up Product \n10.1 Primer (Cream, liquid, mousse) \n10.2 Cake/Liquid/Cream to Powder/Powder/High  \n          Definition Foundation/Air Brush Foundation \n10.3 Concealer (Stick, cream, liquid, cream to  \n         powder, etc.) \n10.4 Eyeshadow (Cream, gel, powder, pencils) \n10.5 Blusher (Powder, cream, liquid, cream to  \n         powder, etc.) \n10.6 Eyeliner (Pencil, liquid, glittery, gel liner) \n10.7 Eyebrow (Powder, gel, pencil) \n10.8 Lip stick (Cream, matte, moisture, shimmer,  \n         glittery, glossy stick) \n10.9 Mascara (Volumizing, lengthening, water  \n          proof, water resistant, nylon based) \n10.10 Powder (Loose, shimmer, bronzing, dual,  \n          matte, high definition, mineral) \n10.11 Lip pencil (matte, cream, moisture) \n10.12 Lip gloss (Silicon-based, ultrashine, moisture  \n          rich, matte) \n10.13 Antishine (Compact or cream/liquid)  \n10.14 Mattefying spray/water proof spray/ air brush  \n          finishes  \n10. Accessories \n11.1 Glitter gel \n11.2 Special effect make-up (prosthetic enhancer, \nrubber, glue, plasters, gauze) \n11.3 Stoned glitter (Stones/glitters/lashes) \n11.4 Lashes glue or adhesive (Artificial) \n11.5 Color pigments (Powder, cream, liquid)ds\n\n--- PDF PAGE 54 ---\nTR - Hairdressing NC III \nAmended    \n 50 \n \nVARIABLE \nRANGE \n12.  Established or acceptable \nprocedures in advanced \nmake-up application \nMay include but are not limited to: \n12.1  Clean or wash face using cleansing products \n12.2 Apply foundation and concealer evenly on \nface and neck \n12.3  Apply creative make-up techniques according \nto desired advanced make-up \n13.  Make-up result \n13.1 Evenness of make-up application and proper \ndistribution  (lightness   and darkness of \nmake-up) \n13.2 Essential application of make-up \n13.3 Blending of colors  \n13.4 Appropriateness of make-up with the \noccasion  \n13.5 Symmetry and balance of eyebrow arc and \nshape, and blush-on \n13.6 Face and lips contouring is achieved\n\n--- PDF PAGE 55 ---\nTR - Hairdressing NC III \nAmended    \n 51"
