          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on hairpiece attachment and styling\n1.2 Prepared tools, equipment and supplies/materials according\n to client’s requirements and OH&S requirements\n1.3 Performed hairpiece attachment and styling procedures and\n techniques according to client desired results and\n manufacturer’s specifications\n1.4 Performed cross-checking and applied appropriate finishing\n touches\n1.5 Maintained hairpieces according to manufacturer’s\n instructions\n1.6 Used protective clothing according to health and sanitation\n regulations\n1.7 Followed safety precautions on clients during the entire\n process\n1.8 Performed post-service activities according to OH&S\n requirements\n2. Underpinning\nknowledge\n2.1 Different types of hairpieces and ornaments\n2.2 Different hairpiece attachment, styling procedures and\n techniques\n2.3 Procedures on taking wig measurements\n2.4 Elements and principles of hair design\n2.5 Balancing hair length and volume\n2.6 Procedures in cleaning and maintenance of hairpiece\n2.7 Different types of tools and materials in hairpiece\nattachment, styling and maintenance\n2.8 First- aid treatment\n2.9 DOH and OH&S requirements\n2.10 Code of ethics\n3. Underpinning\nskills\n3.1 Performing hairpiece attachment and styling procedures and\ntechniques\n3.2 Using appropriate tools and materials\n3.3 Interpreting manufacturer’s specifications\n3.4 Performing hairpiece maintenance\n3.5 Applying first-aid treatment\n3.6 Complying with DOH-IRR, health and sanitation\nrequirements\n3.7 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\n activity to be performed\n4.3 Working area / facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 62 ---\nTR - Hairdressing NC III\nAmended\n 58\nUNIT OF COMPETENCY :\nPERFORM PROSTHETICS AND SPECIAL EFFECTS\nMAKE-UP\nUNIT CODE\n:"
        },
        "source_text": "HCS515402\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required\nin hairpiece attachment and styling and in carrying out\ncleaning and maintenance of hairpieces.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1 Client is consulted according to his/her needs and\nexpectations\n1.2 Client is draped with styling cape\n1.3 Hairpiece and style is selected in accordance with\nclient’s facial features, natural hair, personal\nattributes and requirements\n1.4\nAppropriate equipment, tools, supplies/materials\nand techniques are selected and used according to\nclient’s requirements\n1.5\nCost, maintenance requirements, features and\nbenefits of the service are identified and explained\nto client\n2. Attach and style\nhairpieces\n\n2.1 Client’s head circumference is measured for wig\nfitting\n2.2 Selected hairpiece is attached securely to client’s\nhead following manufacturer’s specifications and\nand desired result\n2.2 Hairstyle is created following elements of design\nand client’s requirements\n2.3 Client’s satisfaction is confirmed and adjustments\nare made if required\n3. Maintain hairpieces\n\n3.1 Hairpiece’s condition is checked and adjustments\nare made if required\n3.2 Suitable product is identified and selected\nappropriate for type of hairpiece to be cleaned and\nmaintained\n3.3 Manufacturer’s instructions in using product is\nfollowed accordingly\n4. Perform post-service\nactivities\n4.1 Tools and materials are cleaned, sterilized and\nstored in accordance with salon policies\n4.2 Waste items are properly disposed of in accordance\nwith OH&S required practice\n4.3 Working area is cleaned in preparation for the next\n client\n\n--- PDF PAGE 60 ---\nTR - Hairdressing NC III\nAmended\n 56\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal attributes\n1.1 Age\n1.2 Personal image\n1.3 Job or career\n2. Hairpiece\n2.1 Full head wigs\n- Human hair\n- Synthetic\n2.2 Toupette/wiglets\n- Human hair\n - Synthetic\n3. Style\n3.1 Straight\n3.2 Wavy\n3.3 Curly\n4. Tools\n4.1 Blow dryers\n4.2 Brushes\n4.3 Combs\n5. Supplies/Materials\n5.1 Pins\n5.2 Duckbill\n5.3 Measuring tape\n5.4 Neck strip\n5.5 Styling cape\n5.6 Towel\n5.7 Tissues\n5.8 Styling product\n - Gel/Styling gel\n - Spray net\n5.9 Hairpiece ornaments\n - Ponytails\n - Braids\n - Ponytail wraps\n - Petals\n- Pin curls\n6. Desired result\n6.1 Symmetry/Balance\n6.2 Evenness\n6.3 Hairpiece blends with natural hair\n6.4 No visible hair implements and attachments\n6. Elements of design\n6.1 Line\n6.2 Colour\n6.3 Texture\n6.4 Shape\n6.5 Size\n\n--- PDF PAGE 61 ---\nTR - Hairdressing NC III\nAmended\n 57\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on hairpiece attachment and styling\n1.2 Prepared tools, equipment and supplies/materials according\n to client’s requirements and OH&S requirements\n1.3 Performed hairpiece attachment and styling procedures and\n techniques according to client desired results and\n manufacturer’s specifications\n1.4 Performed cross-checking and applied appropriate finishing\n touches\n1.5 Maintained hairpieces according to manufacturer’s\n instructions\n1.6 Used protective clothing according to health and sanitation\n regulations\n1.7 Followed safety precautions on clients during the entire\n process\n1.8 Performed post-service activities according to OH&S\n requirements\n2. Underpinning\nknowledge\n2.1 Different types of hairpieces and ornaments\n2.2 Different hairpiece attachment, styling procedures and\n techniques\n2.3 Procedures on taking wig measurements\n2.4 Elements and principles of hair design\n2.5 Balancing hair length and volume\n2.6 Procedures in cleaning and maintenance of hairpiece\n2.7 Different types of tools and materials in hairpiece\nattachment, styling and maintenance\n2.8 First- aid treatment\n2.9 DOH and OH&S requirements\n2.10 Code of ethics\n3. Underpinning\nskills\n3.1 Performing hairpiece attachment and styling procedures and\ntechniques\n3.2 Using appropriate tools and materials\n3.3 Interpreting manufacturer’s specifications\n3.4 Performing hairpiece maintenance\n3.5 Applying first-aid treatment\n3.6 Complying with DOH-IRR, health and sanitation\nrequirements\n3.7 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\n activity to be performed\n4.3 Working area / facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Third Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 62 ---\nTR - Hairdressing NC III\nAmended\n 58\nUNIT OF COMPETENCY :\nPERFORM PROSTHETICS AND SPECIAL EFFECTS\nMAKE-UP\nUNIT CODE\n:"
