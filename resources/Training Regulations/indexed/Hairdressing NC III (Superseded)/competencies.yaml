          "source_text": "1.  Prepare client \n1.1 Client is consulted on the prosthetics and special \neffects make-up requirements  \n1.2  Design concept is created and agreed upon based \non consultation with the client’s prosthetics and \nspecial effects make-up requirements \n1.3 Make-up products and make-up test plan are \nprepared in consultation with the client \n1.4    Cost of the service are identified and explained to \nclient \n2.  Make prosthetics \n2.1    Materials and equipment are prepared and used \nin accordance with prosthetic casting requirements \n2.2    Client’s comfort and protection from hazards are \nensured during the casting \n2.3    Cast is modeled and baked in accordance with \nprosthetic make-up design \n2.4    Prosthetic pieces are modeled/made from the cast \nusing the appropriate materials and equipment   \nand  following production requirements \n3.  Prepare to apply \nprosthetics and special \neffects make-up \n \n \n3.1    Client’s requirements are confirmed prior to make-\nup application and testing \n3.2    Special effects products and equipment are \nselected and prepared in accordance with make-up \nplan to ensure sufficient quantity to meet the needs \nof the client \n3.3   Client is dressed with required protective covering \nmaterials \n3.4    Suitable cleansing product is used to cleanse \nclient’s face \n3.5    Health and hygiene procedures are identified for \nimplementation during preparation of make-up and \ncleansing procedure\n\n--- PDF PAGE 63 ---\nTR - Hairdressing NC III \nAmended    \n 59 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n4.  Apply and maintain \nprosthetics and special \neffects make-up \n4.1  Prosthetic and products are applied in sequence \nwith appropriate applicators using appropriate \ntechniques in accordance with make-up plan, \nhygiene and procedures \n4.2  Final effect is checked and matched with the \nagreed prosthetic requirements \n4.3  Client’s acceptance  is confirmed and adjustments \nare made if required \n4.4  Client’s safety and comfort  are ensured during the \nentire process \n4.5  Health and hygiene procedures are applied/ \nimplemented  \n5.  Remove prosthetics and \nspecial effects make-up \n5.1    Client is briefed on the removal of prosthetics and \nspecial effects make-up \n5.2    Client’s comfort is maintained during prosthetics \nand special effects make-up removal  \n5.3    Edge is loosened using the adhesive remover for \nthe particular areas of skin, nature of prosthetic and \nadhesive used \n5.4    Make-up is removed using cleansing products \n5.5    Medical advice is sought in case of skin irritation or \nany other problem \n6.  Perform post-service   \n     activities \n6.1 Make-up equipment is washed, disinfected and \nstored  in accordance with salon policies and \nprocedures \n6.2 Waste items are properly disposed of  in  \naccordance   with OH&S required practice \n6.3    Working area is cleaned in preparation for the next  \n         client\n\n--- PDF PAGE 64 ---\nTR - Hairdressing NC III \nAmended    \n 60 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Prosthetics \nMay include but are not limited to: \n1.1  Solid   prosthetics \n1.2  Single prosthetic such as nose, finger, ear, bald cap \n1.3  Soft prosthetics \n2.  Special effects make-up  \nMay be used to simulate: \n2.1  Scars \n2.2  Wounds \n2.3  Burns \n2.4  Cuts \n2.5  Grazes \n2.6  Skin disorders \n2.7  Fluids and solids \n2.8  Tears \n2.9  Ageing \n2.10  Body or facial features \n3.  Make-up products \n3.1  Premake-up products \n3.2  Cleansers \n3.3  Toners \n3.4  Mositurizers \n3.5  Concealers \n3.6  Foundation (liquid/solid) \n3.7  Powders \n3.8  Fixative \n3.9  Eyeshadows (matt/frosted) \n3.10 Blushes \n3.11 Mascaras (powder, liquid, wand or block) \n3.12 Lipstick/lip glosses \n3.13 Eyebrow pencils \n3.14 Protective gels and creams \n3.15 Sun screen \n3.16 Casting plaster \n3.17 Latex \n3.18 Glues/gums\n\n--- PDF PAGE 65 ---\nTR - Hairdressing NC III \nAmended    \n 61 \nVARIABLE \nRANGE \n4.  Materials and equipment \n4.1 Sponges \n4.2 Brushes \n4.3 Applicators  \n4.4 Pallets or tiles  \n4.5 Lash curlers \n4.6 Artificial lashes \n4.7 Latex \n4.8 Bald caps \n4.9 Tweezers \n4.10 Magnifying mirror \n4.11 Containers/tray etc \n4.12 Spatulas \n4.13 Make-up box \n4.14 Cotton buds \n4.15 Eye make-up remover pads \n4.16 Moist towelettes \n4.17 Powder puffs \n4.18 Pencil sharpener \n4.19 Towels \n4.20 Hairclips and bands \n4.21 Tissues \n4.22 Supply of water \n4.23 Protective bibs and smocks        \n5.  Production requirements \nMay include but are not limited to: \n5.1  Designers specifications \n5.2  Venue requirements \n5.3  Production schedule \n5.4  Client’s requirements \n5.5  Relevant health and hygiene requirements \n5.6  Lighting effects \n6.  Types of production \nMay include but are not limited to: \n6.1  Feature films \n6.2  Documentaries \n6.3  Short films \n6.4  Commercials \n6.5   Filmed events or performances \n6.6  Music video \n6.7  Television productions (e.g. music, dance, comedy,  \nvariety) \n6.8  Performances\n\n--- PDF PAGE 66 ---\nTR - Hairdressing NC III \nAmended    \n 62"
