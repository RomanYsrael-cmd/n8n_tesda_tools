        "source_title": "PERFORM ADVANCED/CREATIVE HAIR PERMING",
        "source_text": "--- PDF PAGE 47 ---\nTR - Hairdressing NC III \nAmended    \n 43 \nUNIT OF COMPETENCY : \nPERFORM ADVANCED/CREATIVE HAIR PERMING \nUNIT CODE                       : \nHCS515320 \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in \nperforming advanced/creative hair perming. It involves \nassessing and preparing the client, actual performance of \nhair perming, checking of result and doing necessary final \ntouches to achieve optimum result. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.   Prepare client \n1.1 Client is advised to remove all personal accessories \n1.2 Client is provided with  and advised to wear \nprotective clothing \n1.3 Condition and type of hair are checked and \nanalyzed \n1.4 Previous treatment applied on hair is determined \n1.5 Scalp condition is checked if free from scratches \nand open wounds \n1.6 Where necessary, client is advised to defer hair \nperming based on adverse scalp and health \nconditions \n1.7 Desired creative perm style is confirmed with client \nand recorded   \n2.   Perm hair \n2.1 Tools and equipment, supplies/ materials are \nprepared and used according to salon policies and \nprocedures and OH&S requirements \n2.2 Perm solution  is selected and prepared according \nclient’s hair type, texture/condition and product \nspecifications \n2.3 Creative hair perming is performed in accordance \nwith established or acceptable procedures, \nartistic criteria and product specifications \n2.4 Client’s safety and comfort are ensured during the      \n         entire process \n2.5   Where necessary, first-aid treatment is provided to \nthe client or referred to health personnel\n3.   Apply finishing touches \n3.1 Hair is checked according to client’s desired \noutcome \n3.2 Hair is tapered / trimmed and styled if necessary \n3.3 Client’s satisfaction is confirmed and adjustments \nare made if required\n4.   Perform post-service \nactivity \n4.1   Client is advised on hair care and maintenance \n4.2 Tools, materials, implements are cleaned, sanitized \nand stored according to OH&S requirements \n4.3    Wastes items are properly disposed of  in \naccordance with OH&S required practice \n4.4    Working area is cleaned in preparation for the next \nclient\n\n--- PDF PAGE 48 ---\nTR - Hairdressing NC III \nAmended    \n 44 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hair Condition \n1.1  Damaged \n1.2   Tinted \n1.3   Lightened \n1.4   Porous \n1.5   Dry \n1.6   Greasy or Oily \n1.7 Normal  \n2. Types of Hair \n2.1   Curly \n2.2   Wavy \n2.3   Straight \n3. Scalp Condition \n3.1 Dry or Oily\n3.2  Dandruff \n3.3 Greasy \n3.4 Waxy \n3.5 Scaly\n4.   Creative perm style \n4.1   Creative winding (Zigzag, spiral, apo, etc.) \n4.2   Digital Perming  \n5. Tools and Equipment \n5.1   Dryer \n5.1.1 Handheld, Hood, Infrared \n5.2    Curler \n5.2.1 Small, Medium, Large, Extension, Extra Large, \nJumbo \n5.2.2 Wooden Spindle, Nooping, Spiral, Zigzag, \nTelephone Wire \n5.3   Applicator \n5.4   Perming Cap \n5.5   Flannel Headband \n5.6   Drip Pan \n5.7   Cape \n5.8   Bath Towel \n5.9   Large Tooth Comb \n5.10  Razor/Scissor \n5.11  Hairclips \n5.12  Apron \n5.13  End Paper \n5.14  Ear Pads \n5.15  Tail Comb \n5.16  Rubber Band \n5.17  Rubber Gloves\n\n--- PDF PAGE 49 ---\nTR - Hairdressing NC III \nAmended    \n 45 \n \nVARIABLE \nRANGE \n6.  Supplies Materials \n6.1   Shampoo \n6.2   Perm Lotion \n6.3   Perm solution \n6.4   Neutralizer \n6.5   Conditioner \n6.6   End Paper \n6.7   Powder/Talcum Powder \n6.8   Tissue Roll \n6.9   Cotton \n6.10  Rubber Band \n6.11 Disposable Gloves \n7.   Established or \nacceptable procedures \nin creative hair perming \nMay include but are not limited to:\n7.1 \nShampoo hair without conditioner and without  \n    scratching the scalp \n7.2 \nTowel dry, section and wind hair according to \nselected type of creative hair perm style and apply \nselected perm solution \n7.3 \nCover wounded hair with plastic cap/cling wrap or \nexpose to dry heat \n7.4 \nCheck progress of wave from time to achieve \noptimum result \n7.5 \nRinse thoroughly without removing the curlers and \ntowel blot \n7.6 \nApply hair with neutralizer and leave-on on \nspecified time \n7.7 \nRemove curlers / rollers and slightly massage hair \nand scalp   \n7.8 \nShampoo and condition hair thoroughly, rinse and \ntowel-dry \n8.  Hair care and \nmaintenance  \n8.1    Use of wide toothed comb \n8.2    Application of hair polishing products \n8.3    Daily hair wash with appropriate shampoo and \nconditioner \n8.4    Regular hair treatment\n\n--- PDF PAGE 50 ---\nTR - Hairdressing NC III \nAmended    \n 46 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:\n1.1 Consulted and prepared client on desired creative perm \nstyle \n1.2 Assessed hair and scalp condition as free from scratches \nand open wounds \n1.3    Provided protective clothing to client  \n1.4    Selected and prepared perming products according to \nclient’s requirements and manufacturer’s specifications \n1.5    Performed creative hair perming in accordance with \nestablished or acceptable procedures and product \nspecifications \n1.6    Applied finishing touches on hair according to client’s \nrequirements \n1.7    Ensured clients safety and comfort throughout the process\n1.8    Applied appropriate measures in response to \nemergencies or unavoidable circumstances \n1.9    Performed post-service activities according to salon \npolicies and procedures, and OH&S requirements\n2. Underpinning \nknowledge and \nattitudes \n2.1 Code of Ethics\n2.2 Hair Texture / Condition \n2.3 Different Scalp Condition \n2.4 Different Creative Perm Style \n2.5 Heating Procedures \n2.6 Hair Perming Techniques \n2.7 Different Perming Products \n2.8 Different Perm Maintenance Program \n2.9 DOH-IRR and OH&S requirements \n2.10 Time Management \n2.11 Principles of Customer Relations     \n2.12 First-aid treatments\n3. Underpinning \nskills \n3.1 Listening and Questioning Skills\n3.2 Customer Relation Skills \n3.3 Observing hair sectioning  \n3.4 Applying winding techniques \n3.5 Applying massage techniques \n3.6 Tapering Trimming \n3.7 Applying shampoo and blow-drying technique \n3.8 Handling tools and equipment \n3.9 Using perming products \n3.10 Observing Code of Ethics \n3.11 Applying first-aid treatments\n4. Resource \nimplications \nThe following resources MUST be provided:\n4.1   Model \n4.2   Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3    Work area/facilities\n5. Methods of \nassessment \nCompetency may be assessed through:\n5.1    Demonstration with Oral Questioning \n5.2    Third-Party Report \n5.3   Portfolio\n6. Context of \nassessment\nCompetency may be assessed in the workplace or   TESDA \naccredited assessment center\n",
