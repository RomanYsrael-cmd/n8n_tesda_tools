          "source_text": "1.  Prepare client \n1.1 Appropriate courtesy is extended to the client at all times\n1.2 Shape of the client’s face, head, length and width are \nassessed according to his/her built and height \n1.3 Texture of hair is analyzed according to selected \nadvanced hair cut style \n1.4 Hair catalog is presented to the client for selection of \nadvanced haircut style \n1.5 Haircut style is agreed upon  by both client and \nhairdresser \n1.6   Protective clothing is provided and  used  \n        according to health and sanitation regulations  \n1.7   Hair is shampooed and/or conditioned following  \n        salon procedures \n2.  Cut hair \n2.1 Appropriate materials, tools and hair implements are \nprepared and used according to desired advanced \nhaircut style and OH&S requirements \n2.2    Haircut is performed according to creative haircut style \nand established or acceptable procedures \n2.3    Client’s safety and comfort is ensured during the entire \nprocess \n2.4    Where necessary, first-aid treatment is provided to the \nclient or referred to health personnel\n3.  Check hair and apply \nappropriate finishing \ntouches \n3.1 \nHair is blow- dried and checked for accuracy and \nfinishing touches \n3.2 \nFinishing cutting tools are used to achieve desired \nhaircut style \n3.3 \nHair finishing product is applied as per client’s \nrequirements and style \n3.4 \nIf required by the client, wig is applied appropriately \naccording to desired haircut style \n3.5 \nClient’s acceptance is confirmed and adjustments are \nmade if required\n4.  Perform post-service \nactivities \n4.1    Client is advised on proper hair care and maintenance  \n4.2 \nTools, implements and equipments are cleaned, \nsterilized and stored in accordance with salon policy \n4.3 \nWaste items are properly disposed of in accordance \nwith OH&S required practice \n4.4 \nWorking area is cleaned in preparation for the next \nclient\n\n--- PDF PAGE 40 ---\nTR - Hairdressing NC III \nAmended    \n 36 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Shape of  Face \n1.1 \nOval    \n1.2 \nRound  \n1.3 \nSquare \n1.4 \nHeart  \n1.5 \nDiamond \n1.6 \nInverted/Pear  \n1.7 \nRectangular or Elongated \n1.8 \nTriangular  \n2.  Hair Catalog  \n2.1     Men’s Cut Catalog \n2.2    Ladies Cut Catalog \n2.3    Kid’s Cut Catalog \n3.  Advanced haircut styles \nMay include but are not limited to: \n3.1   Layered \n3.1.1  Layered bob \n3.1.2  Increased layer \n3.1.3  Graduation layer \n3.2   Crop cut \n3.3   Round layer \n3.4   Disconnection haircuts \n3.5  Trend setting haircuts \n4.  Hair Texture  \n4.1   Fine \n4.2   Medium \n4.3   Coarse \n4.4   Wiry \n5.   Protective clothing \n5.1   Mask \n5.2   Smock Gown \n5.3   Apron \n6.  Materials, Tools and \nImplements  \n6.1   Supplies/Materials \n \n6.1.1 Clamps and Clips \n \n6.1.2 Tissue  \n6.1.3 Powder \n \n6.1.4 Blade  \n6.1.6 Bath Towel \n6.2.1 Cape \n6.3  Tools \n6.3.1  Combs \n6.3.2  Spray Gun \n6.3.3  Hair brush \n6.3.4  Barber brush   \n6.3.5  Blower\n\n--- PDF PAGE 41 ---\nTR - Hairdressing NC III \nAmended    \n 37 \n \n \n \nVARIABLE \nRANGE \n7.  Established or \nacceptable procedures \nin advanced/creative \nhaircutting \nMay include but are not limited to: \n7.1  Shampoo hair  \n7.2  Section hair following haircutting procedures  \n7.3  Apply cutting technique and style to achieve       \n       desired creative haircut \n8.  Finishing Cutting Tools \n8.1  Thinning scissor \n8.2  Cutting scissor \n8.3  Razors \n8.4  Clippers \n8.5  Razor blades \n9.  Hair Finishing Products \n9.1   Setting Lotion/Gel \n9.2   Hair wax (Wet and Dry) \n9.3   Hair serum \n9.4   Hair spray \n9.5   Mousse \n9.6   Leave-on conditioners \n9.7  Fiber gum\n\n--- PDF PAGE 42 ---\nTR - Hairdressing NC III \nAmended    \n 38"
        },
