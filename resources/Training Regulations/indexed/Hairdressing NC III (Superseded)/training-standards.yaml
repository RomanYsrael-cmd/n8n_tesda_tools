    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for HAIRDRESSING NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; trainer’s qualification; and\ninstitutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HAIRDRESSING\nNC Level: NC III\n\nSuggested Nominal Training Duration: 20 Hours (Basic)\n\n 18 Hours (Common)\n\n 400 Hours (Core)\n\n 200 Hours (Elective)\n\n 638 Total Hours\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of hairdressers\nin accordance with industry standards. It covers basic, common and core competencies\nin NC III.\n\nBASIC COMPETENCIES\n(20 Hours)\n\nUnit of\nCompeten\ncy\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1\nCommunicate\ninformation about\nworkplace processes.\n1.2\nLead workplace\ndiscussions.\n1.3\nIdentify and\ncommunicate issues\narising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 68 ---\nTR - Hairdressing NC III\nAmended\n 64\nUnit of\nCompeten\ncy\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Lead small\nteams\n2.1\nProvide team\nleadership.\n2.2\nAssign responsibilities\namong members\n2.3\nSet performance\nexpectation for team\nmembers\n2.4\nSupervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation skills\n3.1\nIdentify relevant\ninformation in planning\nnegotiations\n3.2\nParticipate in\nnegotiations\n3.3\nDocument areas for\nagreement\n• Direct\nobservation\n• Simulation/\nrole playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve workplace\nproblem related\nto work activities\n4.1\nExplain the analytical\ntechniques\n4.2\nIdentify the problem.\n4.3\nDetermine the\npossible cause/s of\nthe problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1\nExplain the analytical\ntechniques\n5.2\nIdentify mathematical\ntools and techniques\nto solve problem\n5.3\nApply mathematical\nprocedures/ solution\n5.4\nAnalyze results\n• Direct\nobservation\n• Simulation/ role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1\nIdentify appropriate\ntechnology\n6.2\nApply relevant\ntechnology\n6.3\nMaintain/ enhance\nrelevant technology\n• Direct\nobservation\n• Simulation/ role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 69 ---\nTR - Hairdressing NC III\nAmended\n 65\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/\ncustomers\n\n1.1 Maintain a professional\nimage\n1.2 Meet client/customer\nrequirements\n1.3 Build credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Manage own\nperformance\n8.4 Plan completion of own\nworkload\n8.5 Maintain quality of own\nperformance\n\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n•Interview\n3. Apply quality\nstandards\n3.1 Assess clients service\nneeds\n3.2 Assess own work\n3.3 Engage in quality\nimprovement\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Maintain a safe,\nclean and\nefficient work\nenvironment\n4.1 Comply with health\nregulations\n4.2 Prepare and maintain\nwork area\n4.3 Check and maintain\ntools and equipment\n4.4 Check and maintain\nstocks\n4.5 Provide a relaxed and\ncaring environment\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 70 ---\nTR - Hairdressing NC III\nAmended\n 66\nCORE COMPETENCIES\n(400 Hours)\n\nUnit of\nCompeten\ncy\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\ncreative\nhairstyling\n\n1.1 Prepare client\n1.2 Perform different hair\ndesign/style\n1.3 Perform final styling\n1.4 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n2. Perform\nadvanced/\ncreative\nhaircutting\n2.1 Prepare client\n2.2 Perform advanced/\n creative hair cut\n2.3 Apply final styling\n2.4 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n3. Perform\nadvanced/\n creative hair\ncoloring\n3.1 Prepare client\n3.2 Apply hair color\n3.3 Perform post -service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n4. Perform\nadvanced/\ncreative hair\nperming\nPrepare client\n4.2 Perform creative\n hair perming\n4.3 Perform final styling\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n5. Perform\nadvanced\nmake-up\n5.1 Prepare client\n5.2 Apply advanced\n make-up\n5.3 Perform post- service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 71 ---\nTR - Hairdressing NC III\nAmended\n 67\nELECTIVE COMPETENCIES\n(200 Hours)\n\nUnit of\nCompeten\ncy\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform hair\nextension\nactivities\n1.1 Prepare client\n1.2 Execute hair\nextension activities\n1.3 Complete hair\ndesign\n1.4 Perform post-\nservice activities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n2. Perform\n hairpiece\n attachment,\n styling and\n maintenance\n2.1 Prepare client\n2.2 Attach and style\nhairpieces\n2.3 Maintain hairpieces\n2.4 Perform post-\nservice activities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n3. Perform\nprosthetics and\nspecial effects\nmake-up\n3.1 Prepare client\n3.2 Design prosthetics\n3.3 Apply and maintain\nprosthetics and\nspecial effects\nmake-up\n3.4 Remove prosthetics\nand special effects\nmake-up\n3.5 Perform post-\nservice activities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 72 ---\nTR - Hairdressing NC III\nAmended\n 68\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n\n• Modular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer just facilitates the\ntraining delivery.\n\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n\n• Project-based instruction is an authentic instructional model strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n--- PDF PAGE 73 ---\nTR - Hairdressing NC III\nAmended\n 69\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should\npossess the following requirements:\n\n• Must be able to communicate effectively both orally and in written form\n• Must be physically, emotionally, psychologically and mentally fit\n• Must be able to perform basic mathematical computation (Fundamental\nOperations)\n•\nMust have completed Hairdressing NC II training program or its equivalent\n•\nMust secure a medical certificate for fitness to handle chemicals\nNote to students: Because many chemical sprays and airborne pollutants are found in this\nqualification, students are advised to consult their physicians as to possible\nproblems (i.e., allergies, asthma, dermatitis, etc.) before enrolling.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nHAIRDRESSING – NC III\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for Hairdressing NC III are as follows:\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n\nMannequin\n(Synthetic/\nHuman)\n\nBRUSH\n6 units Blower/Hair Dryer\n\nAlcohol, 500 ml.\n\nApplicator brush\n6 pcs.\nCrimpers\n\nAluminum foil\n\nBarber brush\n6 units Curling Iron\n\n Powder, 500 grams\n\nHair brush\n3 units Electric Curlers\n(optional)\n\nBlade\n\nPaddle brush\n6 units Hydraulic chair\n\nCling Wrap, rol\n\nRoller brush\n3 units High chair\n\nConditioner, 1 gal\n\nSkeleton brush\n6 units Stool\n\nColor product form:\nCream, Liquid &\nPowder\n\nTinting brush\n25 pcs.\nArm Chair\n\nTinting brush\nwith comb*\n2 sets\nShampoo bowl set\n\nTowel\n(Black and White)\n\nSilicon brush\n 1 unit Heating cap\n(optional)\n\n1 unit\nInfrared\n\nCurling rod\n1 unit\nIron Plate\n\nCAP\n1 unit\nHair steamer\n\nDeveloper , 6% 20\nvolumes; 9% 30\nvolumes; 12% 40\nvolumes, 500 ml.\neach\n\nFrosting Cap w/\nHook\n 1 unit\nSterilizer\n\nShower cap\n2 pcs.\nTimer\n\nEar pads\n\n--- PDF PAGE 74 ---\nTR - Hairdressing NC III\nAmended\n 70\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n\nEnd paper\nCLIPS\n\nBleaching product\n(powder, cream and\nliquid)\n\nHair clips, 1 doz.\nSingle prong clip\n(optional)\n\nSetting lotion\n\nDouble prong\nclip (optional)\n\nGauze mask\n\nCOMB\n\nGel, 500 ml.\n\nAll purpose\ncomb\n\nHairpiece\n\nBath comb\n\nHair polish\n\nApro comb\n\nHair wax, 500 ml.\n\nHaircutting\ncomb\n\nPaper strip\n\nLarge tooth\ncomb\n\nMousse\n\nTail comb\n\nPerm lotion w/\nneutralizer, 500 ml.\n\nTeasing comb\n\nWide toothed\ncomb\n\nPlastic applicator\nGLOVES\n\nPress spray plastic\ndispenser bottle\n\nDisposable\ngloves\n\nRubber band, box\n\nRubber gloves\n\nShampoo, gal\nMIRROR\n\nSpray net, 500 ml.\n\nModular mirror\n(movable)\n\nHand mirror\n\nTissue paper\nPIN\n\nTissue roll\n\nClamps\n\nWig\n\nHairpin, box\n\nHair treatment\nproducts\n\nDuck bill clamp\n\nInvisible pins\n\nPin curl clips, 5\ndoz.\n\nRoller pin, pcs.,\n5 doz\n\n--- PDF PAGE 75 ---\nTR - Hairdressing NC III\nAmended\n 71\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\nPROTECTIVE CLOTHING/\nACCESSORIES\n\nApron\nCape\n\nFlannel\nheadband\n\nHead band\nInvisible hairnet\nNeck strip\nPlastic cape\nSmock gown\nROLLERS\nTraining Materials:\n\nCylinder shaped\nrollers (long and\nshort)\n\nCATALOG\nJumbo rollers\n1\nMen’s Cut Catalog\n\nLarge size\nrollers\n\n1\nLadies Cut Catalog\n\nMedium size\nrollers\n\n1\nKid’s Cut Catalog\n\nSmall size hair\nrollers wire\n(optional)\n\nMagazines\nSCISSORS\n\nTextbooks/\nReferences\nCutting scissor\n\nThinning scissor\n\n1\npc.\nWhite board (big)\n\n5\npcs.\nMarkers (assorted\ncolors)\n\nClippers\n\n1\npc.\nEraser\nDrip pan\nMeasuring cup\nMixing bowls\nScoop\nRazors\nSpatula\nSqueezer\nSpray gun\n\n--- PDF PAGE 76 ---\nTR - Hairdressing NC III\nAmended\n 72\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\nMAKE - UP\n\nPowder\napplicator\n\nSponge\n(natural and sea)\n\nEyelash curler\nCotton buds\n\nShading brush\n(small, medium)\n\nAssorted color\nlipstick (palette,\nstick and pencil)\n\nContoured\nbrush\n\nConcealer\nfoundation\n\nEye liner brush\n•\nLiquid\n\nEyebrow pencil\nSharpener\n\n•\nCream\n\nLarge blusher\nbrush\n\n•\nCake\n\nPowder brush\n\nBlusher\n(powder and cake)\n\nFan brush\nEye brow pencil\n\nLip brush\n\nEye shadow\n(pencil and cake)\n\nEyebrow brush\n(Large and\nsmall)\n\nEye liner\n(pencil, liquid, cake)\n\nEye shadow\nbrush\n\nLip gloss\n\nEye brow\nscissor\n\nMascara\n\nAngle brush\nPowder\n\nEye brow blade\n•Pressed\n\nEyebrow\nTweezer\n\n•Loose powder\n\nTrolley/supply\ntray\n\n•Translucent\n\nSponge tip\nEyelash glue\n\nNatural /\nsynthetic\nbristles\n\nGlitter gel\n\nHair clips\nEye gel\n\nHair clipper with\nguide\n\nStoned glitter\n\nPowder glitter\n\nArtificial eye lashes\n\nTissue\n\nCotton\n\nAlcohol\n\nEyelashes glue /\nadhesive\n\nEye make remover\n\n--- PDF PAGE 77 ---\nTR - Hairdressing NC III\nAmended\n 73\n\nPROSTHETIC\n\nBody brush\nColor palettes\n\nProsthetic\nenhancer\n\nPlaster\n\nCrochet hook\n\nPrimer (cream,\nliquid, mousse)\n\nPowder puff\nProsthetic adhesive\n\nAdhesive remover\n\nliquid latex\n\nCotton wool\n\nLatex liquid rubber\n\nGrease paint\n\nRubber mask\ngrease paint\n\nFace Mask\n\nHAIR EXTENSION\n\nHairpiece (Human\nand Synthetic)\n\n- Full head\n- Toupee/\nwiglets\n\nHAIRPIECE\n\nHairpiece ornaments\n\n- Ponytails\n\n- Braids\n\n- Ponytails\nwraps\n\n- Petals\n\n-\n\n•\nAll tools, supplies and materials will be provided by the student and\n•\nAt least 1 set to be provided by the training center/institution for demo purposes.\n\n--- PDF PAGE 78 ---\nTR - Hairdressing NC III\nAmended\n 74\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\n\nStudent/Trainee Working\nSpace\n\n1 x 1 m.\n\n1 sq. m.\n\n25 sq. m\n\nLecture/Demo Room\n\n8 x 5 m.\n\n40 sq. m.\n\n40 sq. m.\n\nLearning Resource Center\n\n3 x 5 m.\n\n15 sq. m.\n\n15 sq. m.\n\nFacilities/Equipment/\nCirculation Area\n\n6 x 4 m.\n\n24 sq. m.\n\n24 sq. m.\nTotal :\n104 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR HAIRDRESSING NC III\n\nHAIRDRESSING – NC III\nTRAINER QUALIFICATION (TQ III)\n\n• Must have completed Trainer’s Methodology Course\n• *Must be a holder of Hairdressing NC III (Accreditation by endorsement)\n• Must be able to communicate effectively both orally and in written form\n• Must be physically, emotionally, psychologically and mentally fit\n• Must have at least three (3) years experience in the industry\n• Must possess good moral character\n\n* Accreditation by endorsement of trainer is accepted only during the transition period wherein\nthere's no holder of Hairdressing NC III or higher yet.\n\n3.7 Institutional Assessment\n\n Institutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 79 ---\nTR - Hairdressing NC III\nAmended\n 75"
