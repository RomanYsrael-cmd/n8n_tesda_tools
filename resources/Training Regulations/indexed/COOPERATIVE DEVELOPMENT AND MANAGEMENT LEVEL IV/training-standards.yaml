    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\n3.1\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the\nfollowing requirements.\n\n• For Micro to Small Cooperative\n-\nMust have basic communication skills\n-\nMust have basic arithmetic skills\n\n• For Medium to Macro Cooperative\n-\nMust have basic communication skills\n-\nMust have basic arithmetic skills\n-\nCertificate of Completion for completing 10 years of basic education or\nAlternative Learning System (ALS) with grade 10 equivalent holder.\n\nThe difference between the micro to small cooperatives and the medium to\nlarge cooperatives are due to levels of complexity and scope of the operations. Micro\nto small cooperatives having assets of 15 million below are engage in cooperative\nactivities and functions in lower level of complexities and smaller scope. On the other\nhand, medium to large cooperatives having assets of more than 15 million are\nhandling activities contrary to previously mentioned.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET program.\n\n3.2\nTRAINER’S QUALIFICATIONS FOR SOCIAL, COMMUNITY\nDEVELOPMENT AND OTHER SERVICES SECTOR\n\nTrainers who will deliver the training on COOPERATIVE DEVELOPMENT\nAND MANAGEMENT LEVEL IV should have the following:\n\n• Must have Trainer’s Methodology Certificate (TMC) OR training of trainers\ncertificate OR must be a practicing trainers for 2 years within the last 5\nyears and;\n• Must have at least 2 years cooperative development and management\nexperience within the last five (5) years.\n\n--- PDF PAGE 127 ---\nCooperative Development and Management Level IV 125\nGLOSSARY OF TERMS\n\n1) Exchange program\nRefers to Lakbay-aral\n.\n2) External to the cooperative\nRefers to non-cooperative institutions.\n\n3) Internal business\nprocesses\nRefers to the effectiveness of delivery of the\nproduct/service, and/or capacitating the workers.\n\n4) Movement protocol\nRefers to cooperatives and stakeholders\n(agencies, NGOs, local and international)\n\n5) Thematic areas\nRefers to the result of the members’ needs\nsurvey, advocacies, agenda of the cooperatives\nconsistent to the Vision of the cooperative sector.\n\n6) Training development plan\nRefers to the assessment or appraisal conducted.\n\n--- PDF PAGE 128 ---\nCooperative Development and Management Level IV 126\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would\nlike to recognize the commitment of industry stakeholders who provided their time\nand expertise for the development of this Competency Standards.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nEMME GRACE ALVERNE\nCooperative Development Authority\n(CDA)\n827 Aurora Blvd., Immaculate\nConcepcion, Quezon City\n\nMS. LUCIA G. FURO\nCity Government of Caloocan\n8th St., 8th Ave., EGP, Caloocan City\nMR. EDWIN A. BUSTILLOS\nPhilippine Cooperative Center\nc/o 90 Butz Aquino Bldg., Balete Drive\nExtension, cor. E. Rodriguez, Q.C.\nMS. MERCY GABASA\nCooperative Development Authority\n(CDA) – Regional Office 6\nValencia St., Leganes, Iloilo\n\nMS. ROSARIO D. CANADIDO\nPFCCONCR\n306, Seneca Plaza, E. Rodriguez Sr.\nAve. Ext., New Manila, Quezon City\nINOCENCIO M. MALAPIT\nCooperative Development Authority\n(CDA)\n827 Aurora Blvd., Immaculate\nConcepcion, Quezon City\n\nBEATRIZ SAMANTA CASTRO\nCooperative Development Authority\n(CDA)\n\nMS. REBECCA E. PALMA\nPolytechnic University of the Philippines\nMabini Campus, Sta. Mesa, Manila\nMR. CARLITOS DUENAS\nOffice of the Cong. Ben Canama\nMELISSA C. SANTOS\nCooperative Development Authority\n(CDA)\n827 Aurora Blvd., Immaculate\nConcepcion, Quezon City\n\nRAY R. ELEVAZO\nCooperative Development Authority\n(CDA)\n\nMS.MARIEL URSAL\nOffice of the Cong. Ben Canama"
