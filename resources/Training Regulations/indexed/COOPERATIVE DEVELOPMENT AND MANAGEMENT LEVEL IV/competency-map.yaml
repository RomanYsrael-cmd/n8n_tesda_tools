  "source_text": "Section 1\nCOOPERATIVE DEVELOPMENT AND MANAGEMENT LEVEL IV\nQUALIFICATIONS\n\nThe\nCOOPERATIVE\nDEVELOPMENT\nAND\nMANAGEMENT\nLEVEL\nIV\nQualification consists of competencies that a person must achieve to establish\ncooperative, develop quality products and services, develop human resources,\npractice good governance, ensure safe and sound operation, and contribute to\nsocial, economic, and environmental sustainability. These competencies applies\nboth to micro- and small cooperatives (with assets of 15M below) and medium and\nmacro- cooperatives (with more than 15M assets). However, differences on level of\ncomplexities and circumference of scope of works are very prominent due to their\nrespective assets.\n\nThe units of competency comprising this qualification include the following:\n\nCode\nBASIC COMPETENCIES\n500311401\nUtilize specialized communication skill\n500311402\nDevelop and lead teams\n500311403\nPerform higher-order thinking processes and apply techniques in\nthe workplace\n500311404\nContribute to the practice of social justice in the workplace\n500311405\nManage innovative work instructions\n500311406\nManage and evaluate usage of information\n500311407\nLead in improvement of occupational safety and health (OSH)\nprograms, policies and procedures\n500311408\nLead towards improvement of environmental work programs,\npolicies and procedures\n500311409\nSustain entrepreneurial skills\n\nCode\nCOMMON COMPETENCIES\nSOC941201\nProvide Quality Customer Service\nSOC941202\nComply with Quality and Ethical Standards\nSOC941203\nPerform Computer Operations\n\nCode\nCORE COMPETENCIES\nXXXXXXX\nEstablish Cooperative\nXXXXXXX\nDevelop Quality Products and Services\nXXXXXXX\nDevelop Human Resources\nXXXXXXX\nPractice Good Governance\nXXXXXXX\nEnsure Safe and Sound Operation\nXXXXXXX\nContribute to Social, Economic and Environmental Sustainability\n\n--- PDF PAGE 4 ---\nCooperative Development and Management Level IV\n2\n\nA person who has achieved this Qualification is competent to be:\n\no Chair\no Vice-Chair\no Board Member\no General Manager\no Committee Chair\no Committee Member\n\n--- PDF PAGE 5 ---\nCooperative Development and Management Level IV\n3"
}
