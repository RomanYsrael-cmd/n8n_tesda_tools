tive and presentation\nmedia based on client feedback.\n• Identify clearly and store securely all\ndesigns and applications in accordance with\ncompany procedures.\n\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n20 hours\n4.6. Finalize\nwireframe and\ndesign flow of\nthe selected\nuser experience\nmedia\n• Discuss:\no Using After Effects for presenting\nanimation\no Simple coding for web and apps\n• Submit final design flow\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n8hours\n5. Develop\ndesigns for\nproduct\npackaging\n\n5.1. Receive and\ninterpret the\nbrief\n• Identify design brief, and creative and\ntechnical requirements including product\nspecifications and references with relevant\npersonnel.\n• Identify and prepare all necessary\nequipment and required peripherals to be\nused according to task to be undertaken.\n• Lecture\n• Discussion\n• Viewing Multimedia\n• Actual demonstration\n\n• Written exam\n• Interviews /\n• Questioning\n\n4 hours\n\n--- PDF PAGE 102 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n98\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n68 hrs\n5.2. Develop design\nconcepts for\nspecific product\npackaging\n• Identify client’s/company’s logo brand\nspecifications\n• Identify\no Discuss:\no Form follows function\no Spatial Reasoning\no Types of packaging\no Drafting techniques\no Safety standards\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n24 hours\n5.3. Create specific\nproduct\npackaging\nmockup\n\n• Identify and select appropriate industry\nstandard vector or raster software including\ncomputer-assisted techniques for\nsustainability.\n• Discuss:\no Form follows function\no Spatial Reasoning\no Types of packaging\no Packaging Printing specifications\no What is a die line?\n• Create package design based on the design\nbrief, product specifications and company\nbrand specification, within the die line.\n• Arrange the layout of the design within the\nboundaries of the die line.\n\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n24 hours\n\n--- PDF PAGE 103 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n99\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.4. Finalize design\nfor specific\nproduct\npackaging\n\n• Identify and select appropriate industry\nstandard 3Dsoftware including computer-\nassisted techniques for sustainability.\n• Discuss:\no 3D software tools and techniques\no Create a die line of the package\n• Create 3D model using industry standard\nsoftware based on the prototype and brief\nrequirements.\n• Place layout design on to the 3D model.\n• File save and export\n• Print and cut the layout design with die line.\n• Assemble the final package design.\n\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n16 hours\n6. Design booth\nand product/\nwindow display\n\n70 hrs\n6.1. Receive and\ninterpret the\nbrief\n\n• Identify design brief, and creative and\ntechnical requirements including product\nspecifications and references with relevant\npersonnel.\n• Identify and prepare all necessary\nequipment and required peripherals to be\nused according to task to be undertaken.\n• Lecture\n• Discussion\n• Viewing Multimedia\n• Actual\ndemonstration\n\n• Written exam\n• Interviews /\n• Questioning\n\n4 hours\n6.2. Develop design\nconcepts for\nspecific booth\nand product\nwindow / display\n\n• Discuss:\n• Anthrometrics and Ergonomics\n• Design styles\n• Space guidelines\n• Form follows functions\n• Architecture\n• Interior design\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n24 hours\n\n--- PDF PAGE 104 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n100\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.3. Finalize selected\ndesign using\nprecise\nspecifications\nprovided\n\n• Discuss:\no Drafting\no Materials\no Utilities for booths\n• Identify range of materials needed in the\nconstruction of the booth\n• Identify lighting and electrical wiring of the\nbooth.\n• Identify dimensions of the booth\n• create Multi-view Orthographic drawings of\nthe selected design for arrangement &\nconstruction reference.\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n24 hours\n6.4. Produce colored\n3D model\nimages & views\nof the approved\nbooth or\nproduct/ window\ndisplay design\n\n• Discuss:\no Scale modelling\n• Identify and select appropriate industry\nstandard software including computer-\nassisted techniques for sustainability.\n• Create a precise colored 3D model\nimages.using industry standard software\nbased on the based on the approved multi-\nview orthographic drawings\n• File save and export\n• Identify and select materials that is\nappropriate for the design of the model.\n• Create a layout of each section scaled down\nto appropriate size based on the design\nspecifications.\n• Print each view of the colored 3D images\ncreated.\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n18 hours\n\n--- PDF PAGE 105 ---\n_________________________________________________________________________________\nTR-ICT (Visual Graphic Design NC III) (Version 01) Amended February 27, 2018\n101",
