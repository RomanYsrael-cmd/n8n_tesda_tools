estioning\n15 hours\n4.4. Create Page\ntemplate\n(wireframing)\n\n• Discuss:\no Grid specifications\no Wireframing techniques\no Media testing\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n16 hours\n4.5. Create page\ntemplate/ user\nexperience\nwireframing\n\n• Discuss:\no Presenting UX with motion graphic\nsoftware\no Presenting UX using code\n• Refine the interactive and presentation\nmedia based on client feedback.\n• Identify clearly and store securely all\ndesigns and applications in accordance with\ncompany procedures.\n\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n20 hours\n4.6. Finalize\nwireframe and\ndesign flow of\nthe selected\nuser experience\nmedia\n• Discuss:\no Using After Effects for presenting\nanimation\no Simple coding for web and apps\n• Submit final design flow\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n8hours\n5. Develop\ndesigns for\nproduct\npackaging\n\n5.1. Receive and\ninterpret the\nbrief\n• Identify design brief, and creative and\ntechnical requirements including product\nspecifications and references with relevant\npersonnel.\n• Identify and prepare all necessary\nequipment and required peripherals to be\nused according to task to be undertaken.\n• Lecture\n• Discussion\n• Viewing Multimedia\n• Actual demonstration\n\n• Written exam\n• Interviews /\n• Questioning\n\n4 hours\n\n--- PDF PAGE 102 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n98\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n68 hrs\n5.2. Develop design\nconcepts for\nspecific product\npackaging\n• Identify client’s/company’s logo brand\nspecifications\n• Identify\no Discuss:\no Form follows function\no Spatial Reasoning\no Types of packaging\no Drafting techniques\no Safety standards\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n24 hours\n5.3. Create specific\nproduct\npackaging\nmockup\n\n• Identify and select appropriate industry\nstandard vector or raster software including\ncomputer-assisted techniques for\nsustainability.\n• Discuss:\no Form follows function\no Spatial Reasoning\no Types of packaging\no Packaging Printing specifications\no What is a die line?\n• Create package design based on the design\nbrief, product specifications and company\nbrand specification, within the die line.\n• Arrange the layout of the design within the\nboundaries of the die line.\n\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n24 hours\n\n--- PDF PAGE 103 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n99\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.4. Finalize design\nfor specific\nproduct\npackaging\n\n• Identify and select appropriate industry\nstandard 3Dsoftware including computer-\nassisted techniques for sustainability.\n• Discuss:\no 3D software tools and techniques\no Create a die line of the package\n• Create 3D model using industry standard\nsoftware based on the prototype and brief\nrequirements.\n• Place layout design on to the 3D model.\n• File save and export\n• Print and cut the layout design with die line.\n• Assemble the final package design.\n\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n16 hours\n6. Design booth\nand product/\nwindow display\n\n70 hrs\n6.1. Receive and\ninterpret the\nbrief\n\n• Identify design brief, and creative and\ntechnical requirements including product\nspecifications and references with relevant\npersonnel.\n• Identify and prepare all necessary\nequipment and required peripherals to be\nused according to task to be undertaken.\n• Lecture\n• Discussion\n• Viewing Multimedia\n• Actual\ndemonstration\n\n• Written exam\n• Interviews /\n• Questioning\n\n4 hours\n6.2. Develop design\nconcepts for\nspecific booth\nand product\nwindow / display\n\n• Discuss:\n• Anthrometrics and Ergonomics\n• Design styles\n• Space guidelines\n• Form follows functions\n• Architecture\n• Interior design\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n24 hours\n\n--- PDF PAGE 104 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n100\nUnit of\nCompetency\nLearning Outcome\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.3. Finalize selected\ndesign using\nprecise\nspecifications\nprovided\n\n• Discuss:\no Drafting\no Materials\no Utilities for booths\n• Identify range of materials needed in the\nconstruction of the booth\n• Identify lighting and electrical wiring of the\nbooth.\n• Identify dimensions of the booth\n• create Multi-view Orthographic drawings of\nthe selected design for arrangement &\nconstruction reference.\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n24 hours\n6.4. Produce colored\n3D model\nimages & views\nof the approved\nbooth or\nproduct/ window\ndisplay design\n\n• Discuss:\no Scale modelling\n• Identify and select appropriate industry\nstandard software including computer-\nassisted techniques for sustainability.\n• Create a precise colored 3D model\nimages.using industry standard software\nbased on the based on the approved multi-\nview orthographic drawings\n• File save and export\n• Identify and select materials that is\nappropriate for the design of the model.\n• Create a layout of each section scaled down\nto appropriate size based on the design\nspecifications.\n• Print each view of the colored 3D images\ncreated.\n• Lecture/ Discussion\n• Practical exercises\n• Simulation\n• Demonstration\n• Observation\n• Practical\ndemonstration\n• Oral questioning\n18 hours\n\n--- PDF PAGE 105 ---\n_________________________________________________________________________________\nTR-ICT (Visual Graphic Design NC III) (Version 01) Amended February 27, 2018\n101\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\n• Course design is based on competency standards set by the industry or\nrecognized\nindustry\nsector;\n(Learning\nsystem\nis\ndriven\nby\ncompetencies written to industry standards)\n• Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n• Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n• Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency\nas the primary source of evidence.\n• Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain\nboth\nin-school\nand\nin-industry\ntraining\nor\nfieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n--- PDF PAGE 106 ---\n_________________________________________________________________________________\nTR-ICT (Visual Graphic Design NC III) (Version 01) Amended February 27, 2018\n102\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based:\n\n• Community-Based Training – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings\nsuch as barangay hall, basketball courts, etc. These programs can\nalso be mobile training program (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n• Must have completed at least 10 yrs. basic education or an alternative\nlearning systems (ALS) certificate of completion with grade 10\nequivalent holder\n• Must have drawing and drafting skills\n• can communicate either oral and written;\n• Must have computer operation skills and at least 1 graphic software\nknowledge and skills\n• must pass the aptitude and artistic/talent determination test given by the\ninstitution\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 107 ---\n_________________________________________________________________________________\nTR-ICT (Visual Graphic Design NC III) (Version 01) Amended February 27, 2018\n103\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of\n20 trainees for Visual Graphic Design – NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty\nDescription\nQty\nDescription\nQty\nDescription\n21\nMay include any of the\nfollowing OS:\n- Windows\n- Mac\n- Linux\n- ubuntu\n21\nComputer (software\ndependent specifications)\nwith at least 18” monitor\n10\nReference Book\n21\nErgonomic computer tables\nand chairs\n21\nAdobe PDF documents\n1\nLCD Projector\n21\nHand-outs\n1\nPrinter, color (DeskJet or\nlaser)\n50\nCD’s\nCD ROMs DVDs\n21\nInternet Browsers (Google\nChrome, Internet Explorer,\nMozilla Firefox)\n1\nScanner\n10\nPractice materials\n1\nDigital Camera\n10\nPrint media\n1\nMonitor calibrator (optional)\n1\nInternet\n21\nMust have any of the\nfollowing graphic software\napplications* such as:\n- Adobe Photoshop\n- Adobe Illustrator\n- Adobe In-design\n- Adobe Premiere\n- Adobe After Effects\n- Adobe Acrobat\n- CorelDraw\n- Gimp\n- Microsoft PowerPoint\n- Microsoft Publisher\n- Adobe Flash/Animate\n- Adobe Dreamweaver\n- 3D software application\nSketch Up\n\n1\nElectronic media\n• Web/online\n• CD- or DVD-based\n• Mobile or hand-held\nApps\n• Smart phones\n• Tablets\n• Smart TV\n\n10\nVarious printing media\n(e.g. photo-paper,\ntarpaulin, etc.)\nAs\nreq’\nd\nqty.\nPrinted materials\nBooks and magazines\nNewspapers\nBrochures and flyers\nBillboards and\ntarpaulins\n\n- Prototype materials\npapers/cardboards\n- plastic\n- textiles\n- styrofoam\n- actual product being\nsold\n- corrugated boxes\n- wood\n- ceramics\n- tarpaulin\n- electrical gadgets\n- neon lights\n- digital displays\n- metallic materials\n- actual product being\ndisplayed\n- mannequins\n- organic materials\n* Can be either educational, license and open-source software\n\nIn cases where there are specialized tools, equipment and facilities that are\nnot generally considered standard requirements or not absolute requisites for training,\nthe industry working group or TESDA may provide guidelines or specific advice on such\nmatters.\n\n--- PDF PAGE 108 ---\n_________________________________________________________________________________\nTR-ICT (Visual Graphic Design NC III) (Version 01) Amended February 27, 2018\n104\n3.5\nTRAINING FACILITIES\n\nThe Visual Graphic Design Workshop must be of concrete structure. Based on\nclass size of 20 students/trainees the space requirements for the teaching/learning\nand circulation areas are as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nLearning Resource Area\n3 x 5\n15\n1\n15\nWash & Toilet Area\n2 x 2\n4\n2\n8\n Total\n63\nFacilities / Equipment / Circulation**\n20\nTotal Area\n83\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATION\n\n●\nMust be a holder of National TVET Trainer Certificate (NTTC) level I in\nVisual Graphic Design NC III;\n●\nMust be computer literate and proficient user of graphic software;\n●\nMust have at least five (5)-years visual graphics/design industry experience\nwithin the last 7 years\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency. The institutional assessment is administered by the\ntrainer/assessor.\n\nThe result of the institutional assessment may be considered as evidence\nfor the assessment for national certification.\n\n--- PDF PAGE 109 ---\n_________________________________________________________________________________\nTR-ICT (Visual Graphic Design NC III) (Version 01) Amended February 27, 2018\n105"
