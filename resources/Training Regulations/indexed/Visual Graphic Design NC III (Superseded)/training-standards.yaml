      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude green technology, issues on health and drugs and catering to persons\nwith disabilities (PWD’s) to accompany in their curricula.\n\nCourse Title:\nVISUAL GRAPHIC DESIGN NC Level: NC III\nNominal Training\n Duration:\n\n 68 hrs\nBasic Competencies\n\n 28 hrs\nCommon Competencies\n\n405 hrs\nCore Competencies\n Total 501 hrs\n\nCourse Description:\nThis course is designed to develop & enhance the knowledge, skills, &\nattitudes of a Visual Graphic Design Provider in accordance with industry\nstandards. It covers the basic & common competencies in addition to the core\ncompetencies such as to develop designs for logo, develop designs for print\nmedia, develop designs for user interface and user experience as well as develop\ndesigns for product packaging and booth & product window display.\n\nThe nominal duration of 501 hours covers the required units at Visual\nGraphic Design NC III. TVET providers can however, offer a longer, ladderized\ncourse covering the NC III basic, common and core units.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 86 ---\n_________________________________________________________________________________\nTR - Visual Graphic Design NC III (Version 01) Amended February 27, 2018\n82\nBASIC COMPETENCIES\n(68 hrs)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1. Communicate\ninformation\nabout workplace\nprocesses\n• Lecture and discussion on:\no Effective verbal communication methods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for written and\nelectronic communication methods\n• Follow organization requirements for the use of\nwritten and electronic communication methods\n• Perform exercises on understanding and conveying\nintended meaning scenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Demonstration\n• Role Play\n• Written Test\n• Observation\n2 Hours\n1.2. Lead workplace\ndiscussions\n• Lecture and discussion on:\no Organizational policy on production, quality and\nsafety\no Goals/ objectives and action plan setting\n• Read effective verbal communication methods\n• Prepare/set action plans based on organizational\ngoals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral\nevaluation\n• Written Test\n• Observation\n2 Hours\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n• Lecture and discussion on:\no Organizational policy in dealing with issues and\nproblems\n• Read effective verbal communication methods\n• Practice organizing information\n• Perform exercises on understanding and conveying\nintended meaning scenario\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written Test\n• Observation\n2 Hours\n2. Lead small\nteam\n2.1. Provide team\nleadership\n• Lecture and discussion on:\no Company policies and procedures\n• Identify client expectations\n• Practice team building skills\n• Perform exercises on communication skills required\nfor leading teams\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral\nevaluation\n• Written\nexamination\n• Observation\n2 Hours\n2.2. Assign\nresponsibilities\n• Lecture and discussion on:\no Team member’s duties and responsibilities\n• Identify client expectations\n• Group\ndiscussion\n• Lecture\n• Oral\nevaluation\n• Written\n2 Hours\n\n--- PDF PAGE