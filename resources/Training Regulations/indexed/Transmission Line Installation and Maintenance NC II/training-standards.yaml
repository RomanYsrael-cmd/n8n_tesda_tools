      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: Transmission Line Installation and Maintenance NC Level: NC II\n\nNominal Training Duration:\n24 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n 240 hrs – Core Competencies\n\n ----------\n\n 324 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\ntransmission lineman, in accordance with industry standards. It covers the basic & common\ncompetencies in addition to the core competencies such inspection of transmission line\nstructures or towers and appurtenances, performance of ground transmission line works\nand performance of overhead maintenance works on 69 KV and below\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 50\nBASIC COMPETENCIES\n(24 hours)\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n1.1.1. Describe Organizational policies\n1.1.2. Read:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n1.1.3. Identify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n1.1.4. Prepare different Types of question\n1.1.5. Gather different sources of information\n1.1.6. Apply storage system in establishing\nworkplace information\n1.1.7. Demonstrate Telephone courtesy\n1.1.1. Group\ndiscussion\n1.1.2. Lecture\n1.1.3. Demonstration\n1.1.1. Oral\nevaluation\n1.1.2. Written\nexamination\n1.1.3. Observation\n2 hours\n1.2. Complete relevant\nwork related\ndocuments\n1.2.1. Describe Communication procedures\nand systems\n1.2.2. Read:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n1.2.3. Read instructions on work related\nforms/documents\n1.2.4. Practice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n1.2.1. Group\ndiscussion\n1.2.2. Lecture\n1.2.3. Demonstration\n1.2.4. Role play\n1.2.1. Oral\nevaluation\n1.2.2. Written\nexamination\n1.2.3. Observation\n2 hours\n\n--- PDF PAGE 55 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 51\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.2.5. Demonstrate office activities in:\no workplace meetings and discussions\nscenario\n1.2.6. Perform workplace duties scenario\nfollowing simple written notices\n1.2.7. Follow simple spoken language\n1.2.8. Identify the different Non-verbal\ncommunication\n1.2.9. Demonstrate ability to relate to people of\nsocial range in the workplace\n1.2.10. Gather and provide information in\nresponse to workplace