        "source_text": "50\n750\n1\n750\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n3 x 5\n15\n1\n15\n Total\n853\nFacilities / Equipment / Circulation*\n\n256\n Total Area\n\n1,109\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS\n\nTRANSMISSION LINE INSTALLATION AND MAINTENANCE NC II\n\n•\nMust be a holder of National TVET Trainer Certificate (NTTC) level I in\nTransmission Line Installation and Maintenance NCII;\n•\nMust have at least 3 years relevant industry experience within the last\n6 years;\n•\nMust have completed the 40 hours Construction Occupational Safety\nand Health (COSH) Course per Department Order No. 13 s. 1998,\nGuidelines Governing Occupational Safety and Health in the\nConstruction Industry conducted by OSHC and DOLE accredited\nSafety Training Organizations;\n•\nMust be computer literate; and\n•\nMust be physically fit.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency. The institutional assessment is administered by the\ntrainer/assessor.\n\nThe result of the institutional assessment may be considered as evidence\nfor the assessment for national certification.\n\n--- PDF PAGE 75 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 71"
