    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: Transmission Line Installation and Maintenance NC Level: NC II\n\nNominal Training Duration:\n24 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n 240 hrs – Core Competencies\n\n ----------\n\n 324 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\ntransmission lineman, in accordance with industry standards. It covers the basic & common\ncompetencies in addition to the core competencies such inspection of transmission line\nstructures or towers and appurtenances, performance of ground transmission line works\nand performance of overhead maintenance works on 69 KV and below\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 50\nBASIC COMPETENCIES\n(24 hours)\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n1.1.1. Describe Organizational policies\n1.1.2. Read:\no Effective communication\no Written communication\no Communication procedures and\