  "source_text": "GENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a\nparticular area of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by\nthe individual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual.\nIt provides information on critical aspects of competency, underpinning\nknowledge, underpinning skills, resource implications, assessment method and\ncontext of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 78 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 74\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work\nis to be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n19) Resource Implication - refer to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n20) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n21) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n24) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 79 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 75\nSECTOR SPECIFIC\n\n1.\nACSR - abbreviation of Aluminum Cable Steel Reinforced, a cable type having\naluminum strands and a core of one or more steel strands. ACSR are primarily\nused for medium and high voltage lines and may also be used for overhead\nservices to individual customers.\n2.\nAnchor Rod – used for securing a machine, structure or part to masonry or other\nmaterial.\n3.\nBlock and Tackle - is a combination or set of single or several sheaved blocks\nused to obtain a mechanical advantage in handling heavy loads.\n4.\nCable Height Meter - to determine the height of overhead cables\n5.\nConductor – is a conductive material usually made of aluminum or copper used to\ncarry current along the overhead transmission line\n6.\nFull Body Harness - form of protective equipment designed to protect a person\nfrom injury due to falling\n7.\nGrounding Cluster – used to protect personnel working in de-energized lines,\nfrom induced voltage, fault current feed, lightning strikes, erroneous switching &\naccidental contact with adjacent lines\n8.\nGround line maintenance work – refers to activities in the ground done by\ntransmission line personnel which do not require climbing activity\n9.\nGroundworks - a person working at ground level in support of a lineman working\noverhead.\n10. Guy Wire. The wire or cable normally used in a down guy is seven-strand\ngalvanized steel wire or seven-strand aluminum clad wire. Alum weld wire consists\nof steel wire strands coated with a layer of aluminum to prevent corrosion. Guy wire\nis used in various sizes with diameters from ¼ to 1 ¼ in.\n11. Guy-wire assembly -is a tensioned cable designed to add stability to structures\n(frequently ship masts, radio masts, wind turbines, utility poles, and tents). One end\nof the cable is attached to the structure, and the other is anchored to the ground at\na distance from the structure's base.\n12. Handline - used for lifting or lowering small objects and also for holding equipment\naway from the pole as it is being raised\n13. Hazard - a dangerous condition, potential or inherent, that can bring about an\ninterruption or interfere with the expected orderly progress of an activity. It is any\nwork materials, equipment, methods or practices that have the potential to cause\nharm to life, health, property or environment.\n14. Hazardous - an atmosphere that may expose employees to the risk of death,\natmosphere incapacitation, impaired ability to self-rescue unaided, injury, or acute\nillness.\n15. Insulator - a device that is used to electrically isolate a conductor or electrical\ndevice from ground or a different electrical potential. Insulators must support the\nconductors and withstand both the normal operating voltage and surges due to\nswitching and lightning. Insulators are broadly classified as either pin-type, which\nsupport the conductor above the structure, or suspension type, where the\nconductor hangs below the structure. Up to about 33 kV (69 kV in North America)\n\n--- PDF PAGE 80 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 76\nboth types are commonly used. At higher voltages only suspension-type insulators\nare common for overhead conductors. Insulators are usually made of wet-process\nporcelain or toughened glass, with increasing use of glass-reinforced polymer\ninsulators.\n16. Line to line clearance – refers to the distance of live conductors to another live\nconductor.\n17. Line to ground clearance - refers to the distance of live conductors to the ground\n18. Lineman - a payroll classification or title given a craftsperson whose duties include\nclimbing wood poles or steel structures to perform work on electric power\ntransmission and distribution circuits.\n19. OHSAS 18001 – is a framework for an Occupational Health and Safety (OHS)\nManagement Systems and is part of the OHSAS 18000 series of standards, along\nwith OHSAS 18002.\n20. Overhead ground wire (OHGW) – is an electrical conductor which provides\nprotection to transmission lines against direct lightning strokes.\n21. Personal Protective Equipment (PPE) - refers to protective clothing, helmets,\ngoggles, or other garment or equipment designed to protect line personnel from\njob-related occupational hazards\n22. Personal Protective Equipment (PPE) - the term shall include, but is not limited\nto, devices designed to be worn by workers for eye, face, head, respiratory, hand,\narm, body, leg, foot, and fall protection.\n23. Philippine Grid Code - establishes and documents the basic rules, requirements,\nprocedures and standards that govern the operation, maintenance and\ndevelopment of the high-voltage backbone transmission system in the Philippines\n(Republic Act No. 9136, also known as the “Electric Power Industry Reform Act of\n2001)\n24. Pole Dressing – refers to installation of structure components, such as cross\narms, insulators and etc.\n25. Pole Setting – refers to pole positioning, pole erection and pole facing.\n26. Pre-formed Armor Rod - a spiral-formed aluminum rod, a group of which is placed\naround a conductor at the point of suspension to minimize vibration and to protect\nthe conductor from burning in case of a flashover.\n27. Reeving - The operation of passing the rope around the sheaves of blocks.\n28. Rigging – is the term used to described the process of moving/lifting both heavy\nand light loads using rope, blocks, and other special equipment.\n29. Right of way (ROW) – the legal right, established by usage or grant, to pass along\na specific route through grounds or property belonging to another.\n30. Risks - a probability or threat of damage, injury, liability, loss or any other negative\noccurrence that is caused by external or internal vulnerabilities, and that may be\navoided through preemptive action.\n31. Slings - provide a method of attaching rigging tools to structures or equipment.\nThey can be made of rope, webbing or steel. Some slings are made with a\ncontinuous loop while others are made with an eye on each end.\n\n--- PDF PAGE 81 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 77\n32. Slope Protection – The protection of an embankment slope against wave action\nor erosion.\n33. Transmission line - is the material medium or structure that forms all or part of a\npath from one place to another for directing the transmission of energy, such as\nelectromagnetic waves or acoustic waves, as well as electric power transmission.\nComponents of transmission lines include wires, coaxial cables, dielectric slabs,\noptical fibers, electric power lines, and waveguides.\n34. Vibration Damper - a device used to dissipate the vibration of conductors on a\ntransmission line.\n35. Voltage Detector- is a sensor used to detect presence of electricity in a wire.\n\n--- PDF PAGE 82 ---\n-\n",
