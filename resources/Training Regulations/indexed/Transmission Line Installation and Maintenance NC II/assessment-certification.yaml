      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of Transmission Line Installation and Maintenance NC II, the candidate must demonstrate competency in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General. 4.1.2. The qualification of Transmission Line Installation and Maintenance NC II can be attained through demonstration of competence through project- type assessment covering all the units required. 4.1.3. Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4. Any of the following are qualified to apply for assessment and certification: 4.1.4.1 Graduate of formal or non-formal training in transmission line installation and maintenance or related training; 4.1.4.2 Worker with at least 6 months relevant experience in transmission line installation and maintenance. 4.1.5. The existing NCs or COCs in Transmission Line Installation and Maintenance NC II are still valid until the said NCs or COCs have expired. Individuals are advised to take the assessment for this amended/updated 4.1.6. The guidelines on assessment and certification are discussed in detail in the \"Operating Procedures on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\"."
    },
    {
