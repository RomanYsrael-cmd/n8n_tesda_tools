      "text": "Unit of Competency – is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF --- PDF PAGE 79 --- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ TR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 75 1. ACSR - abbreviation of Aluminum Cable Steel Reinforced, a cable type having aluminum strands and a core of one or more steel strands. ACSR are primarily used for medium and high voltage lines and may also be used for overhead services to individual customers. 2. Anchor Rod – used for securing a machine, structure or part to masonry or other material. 3. Block and Tackle - is a combination or set of single or several sheaved blocks used to obtain a mechanical advantage in handling heavy loads. 4. Cable Height Meter - to determine the height of overhead cables 5. Conductor – is a conductive material usually made of aluminum or copper used to carry current along the overhead transmission line 6. Full Body Harness - form of protective equipment designed to protect a person from injury due to falling 7. Grounding Cluster – used to protect personnel working in de-energized lines, from induced voltage, fault current feed, lightning strikes, erroneous switching & accidental contact with adjacent lines 8. Ground line maintenance work – refers to activities in the ground done by transmission line personnel which do not require climbing activity 9. Groundworks - a person working at ground level in support of a lineman working overhead."
