      "number": "4.1",
      "text": "1. To attain the National Qualification of Transmission Line Installation and Maintenance NC II, the candidate must demonstrate competency in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate II signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2. The qualification of Transmission Line Installation and Maintenance NC II can be attained through demonstration of competence through project- type assessment covering all the units required."
