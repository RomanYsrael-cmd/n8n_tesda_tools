ed for work\n1.2. Prepared T/L hardware, tools and equipment\n1.3. Performed pole climbing activities\n1.4. Performed line voltage detection\n1.5. Installed grounding clusters\n1.6. Conducted overhead maintenance work activities\n2. Resource\nimplications\nThe following resources must be available:\n2.1 Transmission line tools, equipment and hardware\n2.2 Safety tools and PPEs\n2.3 Work area\n2.4 Line truck\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 49"
