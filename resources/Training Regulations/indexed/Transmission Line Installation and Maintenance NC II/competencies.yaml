        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Prepared T/L hardware, tools and equipment\n1.3. Performed pole climbing activities\n1.4. Performed line voltage detection\n1.5. Installed grounding clusters\n1.6. Conducted overhead maintenance work activities\n2. Resource\nimplications\nThe following resources must be available:\n2.1 Transmission line tools, equipment and hardware\n2.2 Safety tools and PPEs\n2.3 Work area\n2.4 Line truck\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n4. Context of\nassessment\n4.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 49"
        },
        "source_text": "UTL741303\nDESCRIPTOR\n:\nThis unit covers the outcomes required for performing\nmaintenance of overhead transmission line. This involves\nworking with a team. The scope of this unit covers\nreplacement\nof\ndamaged/defective\ntransmission\nline\ncomponents on 69 KV and below.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are\nelaborated in the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\noverhead\nmaintenance\nwork\n1.1. Work instruction is secured\nand interpreted according to\njob requirements\n1.2. Relevant\noccupational health and\nsafety requirements are\nidentified following job\nspecifications\n1.3. Appropriate tools,\nequipment and hardware\nare identified and requested\nin accordance with job\nspecifications\n1.1. Usage and\nfunctions of\nappropriate tools,\nequipment and\nhardware.\n1.2. Design and\nspecification of\nT/L structures\n1.3. OSH\nrequirements\n1.4. Basic Math\n(MDAS)\n1.5. Written and oral\ncommunication\n1.1. Communication\nskills\n1.2. Interpretation\nskills\n1.3. Mathematical\nskills\n1.4. Skills in\nidentifying T/L\nhardware, tools\nand equipment\n2. Prepare\nhardware,\ntransmission\nline tools and\nequipment for\noverhead\nmaintenance\n2.1 Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n2.2 Appropriate tools,\nequipment and hardware\nare acquired and secured in\nline with job requirements\n2.3 Operational condition of\ntransmission line tools and\nequipment are checked in\naccordance with its\ncorresponding manual\n2.1 Usage of\nappropriate PPE\n2.2 Usage and\nfunctions of\nappropriate\nmaterials, tools\nand equipment\n2.3 OSH requirement\n2.4 Basic Math\n(MDAs)\n2.5 Written and oral\ncommunication\n2.1 Communication\nskills\n2.2 Interpretation\nskills\n2.3 Mathematical\nskills\n2.4 Skills in\nidentifying T/L\nhardware, tools\nand equipment\n3. Conduct\noverhead\nmaintenance\nworks\n\n3.1. Transmission line tools,\nequipment and hardware\nare used in line with job\nrequirements\n3.2. Personal protective\nequipment (PPE) are used\nfollowing job requirements\n3.3. Confirmation to proceed to\nwork is secured from\nappropriate personnel in\naccordance with company/\nindustry procedure.\n3.4. Pole climbing activities\nare performed in line with\noccupational health and\nsafety standards.\n3.1. DOLE-OSHS\nRule 1080 –\nPersonal\nProtective\nEquipment and\nDevices E\n3.2. Usage and\nfunctions of\nappropriate\nmaterials, tools\nand equipment\n3.3. Pole setting\nmethods\n3.4. Rigging\ntechnique\n3.1. Communication\nskills\n3.2. Interpretation\nskills\n3.3. Mathematical\nskills\n3.4. Rigging skills\n3.5. Climbing skills\n3.6. Skills in pole\nerection\n3.7. Basic Lineman\nSkills\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 45\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are\nelaborated in the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.5. Line voltage detection is\nperformed based on\noperational manual and\ncompany procedures.\n3.6. Grounding clusters are\ninstalled based on power\nindustry safety practices\n3.7. Overhead line\nmaintenance work\nactivities are performed\naccording to job\nspecifications\n3.8. Housekeeping procedure is\nperformed in line with power\nindustry procedure\n\n3.5. Pole erection\ntechnique\n3.6. Pole climbing\ntechniques\n3.7. Structural Design\nand Specification\n3.8. Armoring method\n3.9. Load Principle\n3.10. Simple Machine\nPrinciple\n3.11. Basic Electricity\nprinciple\n3.12. Basic Math\n(MDAS)\n3.13. Safe working\nload\n3.14. Written, oral\nand hand signal\ncommunication\n3.15. Two-way radio\ncommunication\n3.16. DOLE-OSHS\nRule 1080 –\nPersonal\nProtective\nEquipment and\nDevices\n3.17. DOLE-OSHS\nRule 1210 –\nElectrical Safety\n3.18. DOLE-OSHS\nRule 1428 -\nLines, Blocks,\nRigging\n3.19. Clean Air Act\n3.20. 5s and 3Rs\nprinciples\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 46\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\nMay include but not limited to:\n1.1\nPole setting\n1.2\nInstallation of guys\n1.3\nPole dressing\n1.4\nConductor/overhead(OHGW) stringing\n1.5\nConductor/overhead(OHGW) transfer/repair\n1.6\nRetirement of old cross arm/ poles and\nappurtenances\n2. Occupational health and safety\nrequirements\nMay include but not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1 Safety hat\n2.1.2 Safety goggles\n2.1.3 Safety gloves\n2.1.4 Safety shoes\n2.1.5 working clothes\n2.2 Safety tools\n2.2.1 Safety harness\n2.2.2 Fall arrest\n2.2.3 Climber set\n2.3 Voltage detection of de-energized line (with\nvoltage detector)\n2.4 Installation of grounding clusters\n2.5 DOLE-OSHS Rule 1210 – Electrical Safety\n2.6 DOLE-OSHS Rule 1428 - Lines, Blocks, Rigging\n2.7 OHSAS 18001 – Occupational Health and\nSafety Management System\n2.8 Philippine Grid Code\n3. Transmission line tools,\nequipment and hardware\nMay include but not limited to:\n3.1 Tools\n3.1.1 Pliers\n3.1.2 Screwdrivers\n3.1.3 Adjustable wrenches\n3.1.4 Ball peen hammer\n3.1.5 Auger bit\n3.1.6 Hacksaw/cutting tools\n3.1.7 Socket wrench\n3..1.8 Webbing sling\n3.2 Equipment\n3.2.1\nRatchet hoist\n3.2.2\nCapstan/Hand winch/Cable Puller\n3.2.3\nBlock and tackle\n3.2.4\nCompression tool\n3.2.5\nSnatch block\n3.2.6\nClimbing gears\n3.2.7\nHydraulic bolt cutter\n3.2.8\nLine truck/Boom truck\n3.2.9\nRope\n\n--- PDF PAGE 51 ---\n---------------------------------------------------------------------------------------------------------------------