nformation\nrequired is accessed\naccording to company\nprocedures\n3.3. Desktop icons are\ncorrectly selected, opened\n3.1. General security,\nprivacy legislation\nand copyright\n3.2. Productivity\nApplication\n3.3. Business\nApplication\n3.1. Accessing\ninformation\n3.2. Searching and\nbrowsing files\nand data\n\n--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 33\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\n\nREQUIRED SKILLS\nand closed for navigation\npurposes\n3.4. Keyboard techniques are\ncarried out in line with\nOH&S requirements for safe\nuse of keyboards\n4. Produce/\noutput data\nusing\ncomputer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as required\nusing computer\nhardware/peripheral devices\nin accordance with standard\noperating procedures\n4.3. Files, data are transferred\nbetween compatible\nsystems using computer\nsoftware, hardware/\nperipheral devices in\naccordance with standard\noperating procedures\n4.1. Computer\napplication in\nprinting, scanning\nand sending\nfacsimile\n4.2. Types and function\nof computer\nperipheral devices\n4.1. Computer data\nprocessing\n4.2. Printing of data\n4.3. Transferring files\nand data\n5. Maintain\ncomputer\nequipment\nand systems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of\nconsumables are\nimplemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with standard\noperating procedures\n5.3. Basic file maintenance\nprocedures are\nimplemented in line with the\nstandard operating\nprocedures\n5.1. Basic internet\noperation\n5.1.1. Web address\n5.1.2.