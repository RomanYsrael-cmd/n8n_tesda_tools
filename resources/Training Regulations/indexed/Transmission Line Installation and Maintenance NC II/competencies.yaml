e NC II Amended December 18, 2017 Page 7\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nObservation of the individual member in relation to the\nwork activities of the group\n3.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 8\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\nUNIT CODE : 500311107\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n1.1. Personal growth and work\nplans are pursued\ntowards improving the\nqualifications set for the\nprofession\n1.2. Intra- and interpersonal\nrelationships are\nmaintained in the course\nof managing oneself\nbased on performance\nevaluation\n1.3. Commitment to the\norganization and its goal\nis demonstrated in the\nperformance of duties\n1.1 Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n1.2 Understanding\npersonal objectives\n1.3 Understanding\norganizational\ngoals\n1.4 Difference between\nintra and\ninterpersonal\nrelationship\n1.5 Performance\nevaluation\n1.1 Demonstrate\nIntra and\nInterpersonal\nskills at work\n1.2 Demonstrate\npersonal\ncommitment in\nwork\n2. Set and meet\nwork priorities\n2.1. Competing demands are\nprioritized to achieve\npersonal, team and\norganizational goals and\nobjectives.\n2.2. Resources are utilized\nefficiently and effectively\nto manage work priorities\nand commitments\n2.3. Practices along economic\nuse and maintenance of\nequipment and facilities\nare followed as per\nestablished procedures\n2.1 Company policies\n2.2 Company\noperations,\nprocedures and\nstandards\n2.3 Time management\n2.4 Basic strategic\nplanning concepts\n2.5 Resource utilization\nand management\n2.1 Managing\ngoals and time\n2.2 Practice\neconomic use\nof resources\nand facilities\n2.3 Setting work\npriorities\n2.4 Practice time\nmanagement\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1. Trainings and career\nopportunities are\nidentified and availed of\nbased on job\nrequirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as proof of\ncareer advancement\n3.3 Licenses and/or\ncertifications relevant to\njob and career are\nobtained and renewed\n3.1 Career development\nopportunities\n3.2 Company\nrecognition and\nincentives\n3.3 Information on\nrelevant licenses\nand or certifications\n3.1 Determining\npersonal career\ndevelopment\nneeds\nIdentifying career\nopportunities\n\n--- PDF PAGE 13 ---\n--------------------------------------------------------------