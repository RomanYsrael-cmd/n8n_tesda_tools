nd \nfunctions of \nappropriate \nmaterials, tools \nand equipment \n2.3. OSH requirement \n2.4. Basic Math \n(MDAS) \n2.5. Written and oral \ncommunication \n2.1. Communication \nskills \n2.2. Interpretation \nskills \n2.3. Mathematical \nskills \n2.4. Skills in \nidentifying T/L \nhardware, tools \nand equipment \n3. Conduct \nground line      \nmaintenance  \nwork/ \nprocedure \n3.1. Transmission line tools, \nequipment and hardware \nare used in line with job \nrequirements \n3.2. Personal protective \nequipment (PPE) are used \nfollowing job requirements \n3.3. Ground line maintenance \nwork/procedure is \nperformed following job \nrequirements. \n3.4. Housekeeping procedure is \nperformed in line with \npower industry procedure \n \n \n3.1. Proper usage of \nappropriate PPE’s \n3.2. Proper usage of \nhand tools, \nhardware and \nequipment \n3.3. Company \nTransmission Line \nVegetation \nManagement \n3.4. Hauling and \ndragging \ntechniques \n3.5. Rigging technique \n3.6. Design and \nspecification of \nthe pole \nstructures \n3.1. Communication \nskills \n3.2. Interpretation \nskills \n3.3. Mathematical \nskills \n3.4. Rigging skills \n3.5. Skills in proper \nexcavation of \npole and \nanchor holes \n3.6. Hauling and \ndragging skills \n3.7. Skills in cutting, \ntrimming and \npruning of trees\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 41       \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are \nelaborated in the range of variables) \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.7. Excavation \nprocedure as per \ncompany \nstandards \n3.8. Soil bearing \ncapacity \n3.9. Basic Math \n(MDAS) \no Depth of hole \no Diameter of \npole hole \n3.10. Written, Oral and \nhand signal \ncommunication \n3.11. Two-way radio \ncommunication \n3.12. DENR \nregulations and \npermits for: \no Cutting, \ntrimming, \npruning of \ntrees \no Application of \ntree growth \nretardant \n3.13. Philippine \nCoconut \nAuthority - \npermit for cutting \nof coconut. \n3.14. DOLE-OSHS \nRule 1410 – \nConstruction \nSafety \no Excavation \no Construction \nEquipment \no Plant and \nEquipment \n3.15. DOLE-OSHS \nRule 1420 – \nLogging \no Use and \nMaintenance \nof Power Saw \no Lines, Blocks, \nRigging \n3.16. Clean Air Act \n3.17. 5s and 3Rs \nprinciples\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 42       \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Job requirements \nMay include but not limited to: \n1.1 \nReplacement of rusty and corroded guy wires  \n1.2 \nReplacement of pilfered guy wires and anchor rod \nand attachments \n1.3 \nReplacement and repair of structural ground \n1.4 \nCorrection of pole alignment \n1.5 \nCutting of obstructive vegetation \n1.6 \nRe-tensioning of loosed guy wires \n1.7 \nReinforced structure’s stability of slope protection \n1.8 \nLoading of steel poles \n1.9 \nTransport and dragging of steel poles to job site \n1.10 Perform pole staking and excavation \n1.11 Payout of ACSR and OHGW \n2. Occupational health     \nand safety requirements \nMay include but not limited to: \n2.1 \nPersonal protective equipment (PPE) \n2.1.1 Safety hat \n2.1.2 Safety goggles \n2.1.3 Safety gloves \n2.1.4 Safety shoes \n2.2 Safety tools \n2.1.5 Safety harness/strap \n2.2 \nCompany health and safety policies and \nprocedures \n2.3 \nDOLE-OSHS Rule 1080 – Personal Protective \nEquipment and Devices \n2.4 \nDOLE-OSHS Rule 1410 – Construction Safety \n2.5 \nDOLE-OSHS Rule 1420 – Logging \n2.6 \nOHSAS 18001 – Occupational Health and Safety \nManagement System \n2.7\nPhilippine Grid Code\n3. Transmission line tools, \nequipment and hardware\nMay include but not limited to: \n3.1 Hand tools   \n3.1.1 Pliers \n3.1.2 Screwdrivers \n3.1.3 Adjustable wrenches \n3.1.4 Ball peen hammer \n3.1.5 Hacksaw/cutting tools \n3.1.6 Bolo, axe  \n3.1.7 straight shovel \n3.1.8 Spoon shovel \n3.1.9 Digging bar \n3.1.10 spade shovel \n3.2 Equipment  \n3.2.1 Ratchet hoist \n3.2.2 Cum-along or wire grip \n3.2.2 Climbing gears/ladder \n3.2.3 Rope  \n3.2.4 Line truck\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 43       \nVARIABLE \nRANGE \n3.2.5 Chainsaw \n3.2.6 Block and tackle \n3.2.7 Snatch block \n3.2.8 Slings \n3.2.9 Trailer \n3.2.10 Pole Adaptor \n3.2.11 Hydraulic bolt cutter \n3.3.12   \n3.3 Hardware \n3.4.1 Guy wire  \n3.4.2 Anchor rod/anchor screw  \n3.4.3 Three bolts clamp/preformed guy grip   \n3.4.4 Anchor log \n4. Ground line maintenance \nwork/procedure \nMay include work/procedure in: \n4.1 \nPruning/cutting/trimming of trees  \n4.2 \nRe-tightening of guy wires  \n4.3 \nReplacement of pilfered hardware \n4.4 \nHauling of materials and hardware \n4.5 \nDragging of poles \n4.6 \nExcavation works \n4.7 \nRigging works \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of    \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Planned and prepared for work \n1.2. Prepared T/L hardware, tools and equipment \n1.3. Performed ground line maintenance work/procedure \n2. Resource \nImplications \nThe following resources must be available: \n2.1. Transmission line tools, equipment and hardware  \n2.2. Safety tools and PPEs \n2.3. Work area  \n2.4. Line truck  \n3. Method of \nassessment\n3.1. Demonstration with oral questioning \n3.2. Written test \n4. Context of \nassessment \n4.1. Competency may be assessed in the workplace or in a   \nsimulated workplace setting \n4.2. Assessment shall be undertaken either individually or part  \nof team under limited supervision\n",
