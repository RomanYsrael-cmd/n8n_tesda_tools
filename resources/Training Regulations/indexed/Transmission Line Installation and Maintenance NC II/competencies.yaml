  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Transmission Line Installation and Maintenance NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate sources\n1.2 Effective questioning ,\nactive listening and\nspeaking skills are used to\ngather and convey\ninformation\n1.3 Appropriate medium is\nused to transfer information\nand ideas\n1.4 Appropriate non- verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and colleagues\nare identified and followed\n1.6 Defined workplace\nprocedures for the location\nand storage of information\nare used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n1.1 Effective\ncommunication\n1.2 Different modes\nof communication\n1.3 Written\ncommunication\n1.4 Organizational\npolicies\n1.5 Sources of\ninformation\n1.6 Types of question\n1.7 Medium of\ncommunication\n1.8 Flow of\ncommunication\n1.9 Storage system\n1.10 Telephone\ncourtesy\n1.1 Follow simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Ability to relate to\npeople of social\nrange in the\nworkplace\n1.4 Gather and\nprovide information\nin response to\nworkplace\nrequirements\n1.5 Listening skills\n1.6 Questioning skills\n1.7 Workplace\nlanguage skills\n2. Participate\nin workplace\nmeetings\nand\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are clearly\nexpressed and those of\nothers are listened to\nwithout interruption\n2.3 Meeting inputs are\nconsistent with the meeting\npurpose and established\nprotocols\n2.4 Workplace interactions\nare conducted in a\ncourteous manner\n\n2.1. Communication\nprocedures and\nsystems\n2.2. Meeting protocols\n2.3. Nature of\nworkplace\nmeetings\n2.4. Barriers of\ncommunication\n2.5. Workplace\ninteractions\n2.6. Nonverbal\ncommunication\n2.1. Ability to relate to\npeople of social\nrange in the\nworkplace\n2.2. Interpersonal\ncommunication\nskill\n2.3. Observing meeting\nprotocols\n\n--- PDF PAGE 7 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2.5 Questions about simple\nroutine workplace\nprocedures and matters\nconcerning working\nconditions of employment\nare asked and responded to\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n3. Complete\nrelevant\nwork related\ndocuments\n3.1 Range of forms relating to\nconditions of employment\nare completed accurately\nand legibly\n3.2 Workplace data is recorded\non standard workplace\nforms and documents\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are identified\nand properly acted upon\n3.5 Reporting requirements to\nsupervisor are completed\naccording to organizational\nguidelines\n3.1 Technology\nrelevant to the\nenterprise and the\nindividual’s work\n3.2 Types of\nworkplace\ndocuments and\nforms\n3.3 Basic\nmathematical\nconcepts\n3.4 Kinds of workplace\nreport\n\n3.1 Apply basic\nmathematical\nprocesses of\naddition,\nsubtraction,\ndivision and\nmultiplication\n3.2 Data recording\n3.3 Report writing\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety\nreports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures, signals,\nsigns and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format\nof the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal or\ninformal communication\n2. Resource\nImplications\n2.1. Fax machine\n2.2. Telephone\n2.3. Writing materials\n2.4.\nInternet\n3. Methods of\nAssessment\n3.1. Direct Observation\n3.2. Oral interview and written test\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 5\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Describe\nteam role\nand scope\n1.1. The role and objective of\nthe team is identified from\navailable sources of\ninformation\n1.2. Team parameters, reporting\nrelationships and\nresponsibilities are identified\nfrom team discussions and\nappropriate external sources\n\n1.1 Team roles\n1.2 Definition of Team\n1.3 Difference between\nteam and group\n1.4 Different source of\ninformation\n1.5 Objectives and goals\nof team\n1.1 Describing the\nteam role and\nscope\n\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1. Individual role and\nresponsibilities within the\nteam environment are\nidentified\n2.2. Roles and responsibility of\nother team members are\nidentified and recognized\n2.3. Reporting relationships within\nteam and external to team are\nidentified\n\n2.1. Team structure\n2.2. Roles and\nresponsibility of team\nmembers\n2.3. Teams in work\nenvironment\n2.4. Fundamental rights at\nwork including gender\nsensitivity\n2.1. Communicate\nappropriately,\nconsistent with\nthe culture of\nthe workplace\n2.2. Identifying\nindividual role\nand\nresponsibility\n2.3. Identifying\nexternal\nrelationship\n3. Work as a\nteam\nmember\n3.1. Effective and appropriate\nforms of communications\nused and interactions\nundertaken with team\nmembers who contribute to\nknown team activities and\nobjectives\n3.2. Effective and appropriate\ncontributions made to\ncomplement team activities\nand objectives, based on\nindividual skills and\ncompetencies and workplace\ncontext\