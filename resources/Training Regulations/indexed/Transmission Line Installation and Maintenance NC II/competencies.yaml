          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Prepared T/L hardware, tools and equipment\n1.3. Performed ground line maintenance work/procedure\n2. Resource\nImplications\nThe following resources must be available:\n2.1. Transmission line tools, equipment and hardware\n2.2. Safety tools and PPEs\n2.3. Work area\n2.4. Line truck\n3. Method of\nassessment\n3.1. Demonstration with oral questioning\n3.2. Written test\n4. Context of\nassessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 44\nUNIT OF COMPETENCY :\nPERFORM OVERHEAD MAINTENANCE WORKS\nUNIT CODE\n:"
