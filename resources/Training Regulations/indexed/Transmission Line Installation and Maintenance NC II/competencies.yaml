        "source_text": "500311107\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Integrate\npersonal\nobjectives\nwith\norganizational\ngoals\n1.1. Personal growth and work\nplans are pursued\ntowards improving the\nqualifications set for the\nprofession\n1.2. Intra- and interpersonal\nrelationships are\nmaintained in the course\nof managing oneself\nbased on performance\nevaluation\n1.3. Commitment to the\norganization and its goal\nis demonstrated in the\nperformance of duties\n1.1 Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n1.2 Understanding\npersonal objectives\n1.3 Understanding\norganizational\ngoals\n1.4 Difference between\nintra and\ninterpersonal\nrelationship\n1.5 Performance\nevaluation\n1.1 Demonstrate\nIntra and\nInterpersonal\nskills at work\n1.2 Demonstrate\npersonal\ncommitment in\nwork\n2. Set and meet\nwork priorities\n2.1. Competing demands are\nprioritized to achieve\npersonal, team and\norganizational goals and\nobjectives.\n2.2. Resources are utilized\nefficiently and effectively\nto manage work priorities\nand commitments\n2.3. Practices along economic\nuse and maintenance of\nequipment and facilities\nare followed as per\nestablished procedures\n2.1 Company policies\n2.2 Company\noperations,\nprocedures and\nstandards\n2.3 Time management\n2.4 Basic strategic\nplanning concepts\n2.5 Resource utilization\nand management\n2.1 Managing\ngoals and time\n2.2 Practice\neconomic use\nof resources\nand facilities\n2.3 Setting work\npriorities\n2.4 Practice time\nmanagement\n3. Maintain\nprofessional\ngrowth and\ndevelopment\n3.1. Trainings and career\nopportunities are\nidentified and availed of\nbased on job\nrequirements\n3.2 Recognitions are\nsought/received and\ndemonstrated as proof of\ncareer advancement\n3.3 Licenses and/or\ncertifications relevant to\njob and career are\nobtained and renewed\n3.1 Career development\nopportunities\n3.2 Company\nrecognition and\nincentives\n3.3 Information on\nrelevant licenses\nand or certifications\n3.1 Determining\npersonal career\ndevelopment\nneeds\nIdentifying career\nopportunities\n\n--- PDF PAGE 13 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences\nand workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 14 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 10\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/scenarios\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Simulation/Role-plays\n3.4 Observation\n3.5 Third Party Reports\n3.6 Exams and Tests\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 11\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE :"
