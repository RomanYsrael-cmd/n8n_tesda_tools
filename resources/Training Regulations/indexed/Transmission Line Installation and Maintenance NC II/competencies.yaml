        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Prepared tools and equipment\n1.3. Performed inspection transmission line structures and\nappurtenances\n1.4. Performed inspection of illegal structures and vegetation\nwithin and beyond ROW corridor\n1.5. Performed inspection line to line and line to ground\nclearances\n1.6. Filled up inspection checklist\n2. Resource\nimplications\nThe following resources should be provided:\n2.1. Transmission line tools and equipment\n2.2. Safety tools and PPEs\n2.3. Work area\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n4. Context of\nassessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 40\nUNIT OF COMPETENCY : PERFORM GROUND TRANSMISSION LINE WORKS\nUNIT CODE\n:"
        },
        "source_text": "UTL741301\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitude required to\ninspect transmission line, poles, towers and appurtenances on\n69kv and below. This unit includes competencies planning and\npreparing for work, preparing tools and equipment and\nconducting inspection for transmission line.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are\nelaborated in the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n1.1 Work instruction is secured\nand interpreted according to\njob requirements\n1.2 Relevant occupational\nhealth and safety\nrequirements are identified\nfollowing job specifications\n1.3 Appropriate tools and\nequipment are identified\nand requested in accordance\nwith job specifications\n1.1. Usage of\nappropriate\nPPE’s\n1.2. Usage and\nfunction of tools\nand equipment\n1.3. Basic Math\n(MDAS)\n1.4. Written and oral\ncommunication\n1.5. DOLE-OSHS\nRule 1212 –\nElectrical Safety\nInspection\n1.1. Communication\nskills\n1.2. Interpretation\nskills\n1.3. Mathematical\nskills\n2. Prepare tools\nand equipment\n2.1 Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n2.2 Transmission line tools and\nequipment are acquired and\nsecured in line with job\nrequirements\n2.3 Tools and equipment\noperational conditions are\nchecked based on tools and\nequipment manual\n2.1 DOLE-OSHS\nRule 1080 –\nPersonal\nProtective\nEquipment and\nDevices\n2.2 Usage and\nfunction of tools\nand equipment\n2.3 Basic Math\n(MDAS)\n2.4 Written and oral\ncommunication\n2.1 Communication\nskills\n2.2 Interpretation\nskills\n2.3 Mathematical\nskills\n3. Conduct\ntransmission\nline inspection\n3.1 Transmission line tools and\nequipment are used in line\nwith job requirements\n3.2 Personal protective\nequipment (PPE) are used\nfollowing job requirements\n3.3 Structure and appurtenances\nare inspected based on\ntransmission line\ninspection procedures.\n3.1 Usage of\nappropriate\nPPE’s\n3.2 Usage and\nfunction of tools,\nhardware and\nequipment\n3.3 Structure\nDesign\nspecification\n3.1 Communication\nskills\n3.2 Interpretation\nskills\n3.3 Mathematical\nskills\n3.4 Climbing skills\n3.5 Skills in\nidentifying\ndefects\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 37\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are\nelaborated in the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.4 Illegal structures and\nvegetation within and beyond\nright of way (ROW) corridor\nare inspected based on\ntransmission line inspection\nprocedure\n3.5 Line to Ground and line to\nline clearances are inspected\nbased on transmission line\ninspection standards\n3.6 Pole/tower and vegetation\ninspection checklist is filled\nup and submitted to T/L\nforeman in accordance with\ncompany procedures\n\n3.4 Operation in\nheight\nmeasuring\nequipment\n3.5 Company\nVegetation\nManagement\n3.6 DOLE-OSHS\nRule 1212 –\nElectrical Safety\nInspection\n3.7 Transmission\nLine Inspection\nProcedure\n3.8 Arboriculture\n3.9 Basic Math\n(MDAS)\n3.10 Written and\nOral\nCommunication\n3.11 Local/City\nordinances\nregarding ROW\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\nMay include but not limited to:\n1.1. Inspection of structures and appurtenances\n1.2. Inspection of illegal structures and vegetation within and\nbeyond ROW corridor\n1.3. Inspection of line to line clearance\n1.4. Inspection of line to ground clearance\n2. Occupational\nhealth and safety\nrequirements\nMay include but not limited to:\n2.1. Personal protective equipment (PPE)\n2.1.1. Safety hat\n2.1.2. Safety goggles\n2.1.3. Safety gloves\n2.1.4. Safety shoes\n2.1.5. working clothes\n2.2. Safety tools\n2.2.1. Safety harness/strap\n2.3. Company health and safety policies and procedures\n2.4. DOLE-OSHS Rules 1210 – Electrical Safety\n2.5. OHSAS 18001 – Occupational Health and Safety\nManagement System\n2.6. Philippine Grid Code\n3. Transmission line\ntools and\nequipment\nMay include but not limited to:\n3.1. Tools\n3.1.1. Pliers\n3.1.2. Screwdrivers\n3.1.3. Adjustable wrenches\n3.1.4. Ball peen hammer\n3.1.5. Inspection checklist with ball pen\n3.1.6. Steel tape\n3.1.7. Bolo\n3.1.8. Binocular\n3.2. Equipment\n3.2.1 Cable height meter\n3.2.2 Climbing gears\n3.2.3 Range Finder\n3.2.4 Digital Camera\n4. Transmission line\ninspection\nstandards\nMay include:\n4.1. Safe procedure for line inspection\n4.2. Inspection procedure to include the following:\n4.2.1. Structure and appurtenances defects\n4.2.2. Vegetation encroachment\n4.2.3. Illegal structures\n4.2.4. Line to line clearance\n4.2.5. Line to ground clearance\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 39\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared for work\n1.2. Prepared tools and equipment\n1.3. Performed inspection transmission line structures and\nappurtenances\n1.4. Performed inspection of illegal structures and vegetation\nwithin and beyond ROW corridor\n1.5. Performed inspection line to line and line to ground\nclearances\n1.6. Filled up inspection checklist\n2. Resource\nimplications\nThe following resources should be provided:\n2.1. Transmission line tools and equipment\n2.2. Safety tools and PPEs\n2.3. Work area\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Written test\n4. Context of\nassessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or part\nof team under limited supervision\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC II Amended December 18, 2017 Page 40\nUNIT OF COMPETENCY : PERFORM GROUND TRANSMISSION LINE WORKS\nUNIT CODE\n:"
