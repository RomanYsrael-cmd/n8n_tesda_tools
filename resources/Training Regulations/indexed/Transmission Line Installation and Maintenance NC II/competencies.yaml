rkplace duties \nfollowing simple \nwritten notices \n1.3 Ability to relate to \npeople of social \nrange in the \nworkplace \n1.4 Gather and \nprovide information \nin response to \nworkplace \nrequirements \n1.5 Listening skills \n1.6 Questioning skills \n1.7 Workplace \nlanguage skills \n2. Participate \nin workplace \nmeetings \nand \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2 Own opinions are clearly \nexpressed and those of \nothers are listened to \nwithout interruption \n2.3 Meeting inputs are \nconsistent with the meeting \npurpose and established \nprotocols \n2.4 Workplace interactions \nare conducted in a \ncourteous manner  \n \n2.1. Communication \nprocedures and \nsystems \n2.2. Meeting protocols \n2.3. Nature  of \nworkplace \nmeetings \n2.4. Barriers of \ncommunication \n2.5. Workplace \ninteractions \n2.6. Nonverbal \ncommunication \n2.1. Ability to relate to \npeople of social \nrange in the \nworkplace  \n2.2. Interpersonal \ncommunication \nskill \n2.3. Observing meeting \nprotocols\n\n--- PDF PAGE 7 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 3       \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.5 Questions about simple \nroutine workplace \nprocedures and matters \nconcerning working \nconditions of employment \nare asked and responded to \n2.6 Meetings outcomes are \ninterpreted and \nimplemented \n3. Complete \nrelevant \nwork related \ndocuments \n3.1 Range of forms relating to \nconditions of employment \nare completed accurately \nand legibly \n3.2 Workplace data is recorded \non standard workplace \nforms and documents \n3.3 Basic mathematical \nprocesses are used for \nroutine calculations \n3.4 Errors in recording \ninformation on forms/ \ndocuments are identified \nand properly acted upon \n3.5 Reporting requirements to \nsupervisor are completed \naccording to organizational \nguidelines \n3.1 Technology \nrelevant to the \nenterprise and the \nindividual’s work \n3.2  Types of \nworkplace  \ndocuments and \nforms \n3.3 Basic \nmathematical \nconcepts \n3.4 Kinds of workplace \nreport \n \n \n3.1 Apply basic \nmathematical \nprocesses of \naddition, \nsubtraction, \ndivision and \nmultiplication \n3.2 Data recording \n3.3 Report writing\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 4       \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5.\nIndustry bodies\n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6.\nFace to face communication\n3. Storage \n3.1. \nManual filing system \n3.2.\nComputer-based filing system\n4. Forms \n4.1. \nPersonnel forms, telephone message forms, safety \nreports \n5. Workplace interactions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, instruction \nand forms, non-verbal including gestures, signals, \nsigns and diagrams\n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard format  \nof the organization \n1.2. Accessed information using communi