enting \nand monitoring \nenvironmental \nprotection \nprocedures \n2.5 Organizational \nstructure and \nsite layout \nothers on \nenvironmental \nprotection \nmatters \n2.7 identify and \ncorrectly use \nequipment and \nvehicles in \naccordance \nwith \nenvironmental \nprotection \nregulations and \nguidelines\n3. Implement and \nmonitor \nenvironmental \ncontrol \nprocedures \n3.1 Existing environmental \nprotection measures are \nimplemented, monitored \nand reviewed \n3.2 Work procedures to protect \nenvironment are \nimplemented and \nadherence to them by the \nwork group is monitored \n3.3 Required improvements to \nexisting control measures \nare identified, including \nrequired resources for \nimplementation, and \nreported to appropriate \npersonnel \n3.1 Relevant \nenvironmental \nprotection \nregulations & \ncodes of \npractice \n3.2 Workplace \nprocedures and \nguidelines for \nimplementing \nand monitoring \nenvironmental \ncontrol \nprocedures \n3.3 Equipment and \nresources \nrequired when \nimplementing \nand monitoring \nenvironmental \ncontrol \nprocedures \n3.4 Organizational \nstructure and \nsite layout \n3.1 Workplace \nreporting and \nrecording \nprocesses and \nprocedures \n3.2 Communication \nskills \n3.3 Accessing \ninformation and \ndata \n3.4 Problem solving \nskills \n3.5 Ability to: \n3.6 counsel, advise \nand inform \nothers on \nenvironmental \ncontrol \nprocedures \n3.7 identify and \ncorrectly use \nequipment and \nvehicles in \naccordance \nwith \nenvironmental \ncontrol \nprocedures, \nregulations and \nguidelines\n\n--- PDF PAGE 26 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 22       \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Environment \n \nEnvironment may include: \n1.1 \nIndoor \