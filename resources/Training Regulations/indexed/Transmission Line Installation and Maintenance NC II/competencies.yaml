        "source_title": "WORK IN TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 9 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 5       \nUNIT OF COMPETENCY:    WORK IN TEAM ENVIRONMENT \nUNIT CODE \n    :     500311106 \nUNIT DESCRIPTOR     : \nThis unit covers the skills, knowledge and attitudes to identify role \nand responsibility as a member of a team. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \nREQUIRED KNOWLEDGE \nREQUIRED SKILLS \n1. Describe \nteam role \nand scope \n1.1. The role and objective of \nthe team is identified from \navailable sources of \ninformation \n1.2. Team parameters, reporting \nrelationships and \nresponsibilities are identified \nfrom team discussions and \nappropriate external sources  \n \n1.1 Team roles \n1.2 Definition of Team \n1.3 Difference between \nteam and group \n1.4 Different source of \ninformation \n1.5 Objectives and goals \nof team \n1.1 Describing the \nteam role  and \nscope \n \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1. Individual role and \nresponsibilities within the \nteam environment are \nidentified \n2.2. Roles and responsibility of \nother team members are \nidentified and recognized \n2.3. Reporting relationships within \nteam and external to team are \nidentified \n \n2.1. Team structure  \n2.2. Roles and \nresponsibility of team \nmembers \n2.3. Teams in work \nenvironment \n2.4.  Fundamental rights at \nwork including gender \nsensitivity  \n2.1. Communicate \nappropriately, \nconsistent with \nthe culture of \nthe workplace \n2.2. Identifying \nindividual role \nand \nresponsibility \n2.3. Identifying \nexternal \nrelationship \n3. Work as a \nteam \nmember \n3.1. Effective and appropriate \nforms of communications \nused and interactions \nundertaken with team \nmembers who contribute to \nknown team activities and \nobjectives \n3.2. Effective and appropriate \ncontributions made to \ncomplement team activities \nand objectives, based on \nindividual skills and \ncompetencies and workplace \ncontext \n3.3. Observed protocols in \nreporting using standard \noperating procedures \n3.4. Contribute to the development \nof team work plans based on \nan understanding of  team’s \nrole and objectives and \nindividual competencies of the \nmembers\n3.1 Communication \nprocess \n3.2 Group planning and \ndecision making \n3.3 Team goals and \nobjectives \n3.4 Understanding \nindividual \ncompetencies relative \nto teamwork \n3.5 Types of individuals \n3.6 Role of leaders \n3.1 Interacting \neffectively with \nothers \n3.2  Setting team \ngoals and \nexpectations\n\n--- PDF PAGE 10 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 6       \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Role and objective of \nteam  \n1.1. \nWork  activities in a team environment with enterprise \nor specific sector \n1.2. \nLimited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a team \nenvironment \n2. Sources of \ninformation \n2.1. \nStandard operating and/or other workplace procedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s specifications and \ninstructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \n3.1. \nWork procedures and practices \n3.2. \nConditions of  work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 11 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – Transmission Line Installation and Maintenance NC II      Amended    December 18, 2017       Page 7       \nEVIDENCE GUIDE \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1. \nOperated in a team to complete workplace activity \n1.2. \nWorked effectively with others \n1.3. \nConveyed information in written or oral form \n1.4. \nSelected and used appropriate workplace language \n1.5. \nFollowed designated work plan for the job \n1.6. \nReported outcomes  \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1. \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2. \nMaterials relevant to the proposed activity or tasks \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. \nObservation   of the individual member in relation to the \nwork activities of the group \n3.2. \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3. \nCase studies and scenarios as a basis for discussion of    \nissues and strategies in teamwork \n4. Context for \nAssessment \n4.1. \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n4.2. \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
