n by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace and/or\nthrough adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary source\nof evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both on-\nand off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities and their variations/components may be\nadopted singly or in combination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate\nlearning and formal and non-formal training. Specific guidelines on this mode\nshall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 128 ---\nMold Making NC III\nRevision 00 Promulgated 05/21/2019\n124\n\n• The classroom-based or in-center instruction uses of learner-centered methods\nas well as laboratory or field-work components.\n\n2.2\n Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may\nbe written or oral and the master craftsperson commits to training the apprentice\nin all the skills relevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to contributing\nproductively to the work of the business. Training is integrated into the\nproduction process and apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the company in\naccordance with the requirements of the specific company. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program (MTP).\n\n--- PDF PAGE 129 ---\nMold Making NC III\nRevision 00 Promulgated 05/21/2019\n125\n\n3.2\nTRAINEE ENTRY REQUIREMENTS\n\n Trainees or students wishing to enroll in this course should possess the following\nrequirements:\n\n• Must have completed the 10-year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent holder\n• Can communicate orally and or in writing\n• Can perform mathematical computation\n• Must have competence in CNC Milling Machine Operation, CNC Lathe Machine\nOperation and EDM operation acquired through training or work experience or\ncertification)\n\n3.3\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 10 trainees\nfor MOLD MAKING NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n11\nunits\nCAD/CAM licensed\nsoftware\n 11\nunits\nWorkstation\n(As per minimum\nrequirement of design\nand manufacturing\nsoftware)\n\n1 lot\nBond paper (A3,A4)\n11\nunits\nComputer table\n2\nunits\nAir-Conditioning unit\n2HP\n1 lot\nPrinter ink\n11\nunit\nOffice chair\n1 unit Stand fan (18”)\n1 lot\nMarkers\n4\nunits\nSteel cabinet 4-\ndrawer\n1 lot\nWhite board with\nmarker and eraser\n10\npcs.\nUSB\n2\nunits\nOffice table\n(1600x700)\n2\nunits\nCNC Milling machine\n(travel of X=550,\nY=300, Z=350)\n2 pc.\nFace mill carbide\n(diameter 80)\n2 unit\nTool pre-setter (tool\nheight reference of\n400mm and\nreference diameter\nof 100mm)\n2 unit Air conditioning unit\n(3TR, package type)\n1 lot\nCarbide End mill\n(diameter 1 – 25,\nrelevant increment)*\n\n--- PDF PAGE 130 ---\nMold Making NC III\nRevision 00 Promulgated 05/21/2019\n126\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n2 unit Edge finder (10 mm\ndiameter)\n1 lot\nWhite board with set of\nmarkers and eraser\n1 lot\nCarbide Ball nose end\nmill (diameter 1 – 12,\nrelevant increment)*\n2 set Collet Chuck\n(diameter 3-25)\n1 unit Workstation\n1 lot\nDrill bits (diameter 1 –\n16, relevant\nincrement)*\n2 set Clamp down\n1 lot\nComputer table with\nchair\n1 lot\nCenter drill (#0 - #6,\nrelevant increment)*\n2 unit Machine vise\n(opening 200)\n2 unit Steel cabinet, 4 -\ndrawer\n1 lot\nMachine reamer H7,\ncarbide (3,5,6,8,10)\n2 unit X block (150 x 150\nx 100)\n2 unit Office table\n1 lot\nMachine tap Spiral\nfluted, carbide (M4 –\nM18, relevant\nincrement)*\n4\nPairs\nParallel bars (200 x\n12)\n1 unit\nCNC Lathe machine\