servation\n• Oral\nQuestioning\n\n4 hrs\n\n2.2 Prepare mold\ncomponents\n\n•\nIdentify and describe the\ndifferent mold components\n•\nApply workplace procedure\nin preparing mold\ncomponents\n• Lecture\n• Group\ndiscussion\n\n• Written\nExamination\n• Oral\nQuestioning\n40 hrs\n\n2.3 Set-up surface finishing\ntools and equipment\n\n•\nExplain and demonstrate\nhow to set-up equipment and\nrequired tools\n\n• Lecture-\nDiscussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral\nQuestioning\n• Demonstration\n• Evaluation\n40 hrs\n\n--- PDF PAGE 125 ---\nMold Making NC III\nRevision 00 Promulgated 05/21/2019\n121\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2.4 Perform surface finishing\n\n•\nPerform surface finishing\naccording to specifications\n•\nApply safety procedures and\nemploy personal protective\nequipment\n• Lecture-\nDiscussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral\nQuestioning\n• Demonstration\n• Evaluation\n40 hrs\n\n2.5 Perform equipment shut\ndown\n\n•\nShutdown equipment in\naccordance with standard\noperating procedures\n• Lecture-\nDiscussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral\nQuestioning\n4 hrs\n\n2.6 Perform house keeping\n\n•\nPerform housekeeping in\naccordance with workplace\nprocedures and\nenvironmental standards\n• Lecture-\nDiscussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral\nQuestioning\n4 hrs\n\n3. Fit and assemble\nmold\n3.1 Determine mold\ncomponents to be fitted\n\n•\nExplain and demonstrate the\nuse of assembly drawing to\ndetermine mold components\nto be fitted and assembled\n•\nExplain and demonstrate\nhow to perform the work\nrequirements\n• Lecture-\nDiscussion\n• Demonstration\n• Interaction\n• Practical\nExercises\n• Written\nExamination\n• Observation\n• Oral\nQuestioning\n16 hrs\n\n3.2 Perform mold\ncomponents 