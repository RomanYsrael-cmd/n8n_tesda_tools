orage room\n\nLocker room\n5 x 4\n20\n20\n20\nTotal workshop area\n\n201\n\nNote:\n\nTraining center may enter into a Memorandum of Understanding (MOU) with an institution/\ncompany with appropriate equipment and facilities.\n\n--- PDF PAGE 136 ---\nMold Making NC III\nRevision 00 Promulgated 05/21/2019\n132\n\n3.5 TRAINERS QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in MOLD MAKING NC III\n• At least technology graduate related to Mechanical Engineering\n• Must have at least 3 years industry experience in Mold making with working knowledge in\nCNC programming and operations or at least 5 years teaching experience and 240 hours\nrelevant training in Mold Making and Fabrication\n\n3.6 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 137 ---\nMold Making NC III\nRevision 00 Promulgated 05/21/2019\n133"
