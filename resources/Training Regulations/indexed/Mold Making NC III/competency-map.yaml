  "source_text": "COMPETENCY MAP\nMETALS AND ENGINEERING SECTOR\n MOLD MAKING NC III\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 140 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/20)\n\n136\n\nUtilize specialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nImplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\n\n--- PDF PAGE 141 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/20)\n\n137\n\nApply safety practices\nInterpret working drawings\nand sketches\nSelect/ cut workshop\nmaterials\nPerform shop computations\n(Basic)\nMeasure workpiece (Basic)\nPerform routine\nhousekeeping\n\nPerform shop computations\n(Intermediate)\nMeasure workpiece using\nangular measuring\ninstruments\nPerform shop computations\n(Advanced)\nMeasure workpiece using\ngages and surface texture\ncomparator\nPerform preventive and\ncorrective maintenance\nOperate a personal\ncomputer\nSelect and cut workshop\nmaterials\nPrepare cost estimates\nApply Safety Practices\nInterpret Drawings and\nSketches\nPerform Industry Calculations\nContribute to Quality System\nUse Hand Tools\nPrepare Weld Materials\nSetup Welding Equipment\nFit up Weld Materials\nRepair Welds\nPerform shop computations\n(Intermediate)\nMeasure workpiece\n(Intermediate)\nPerform preventive and\ncorrective Maintenance\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 142 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/20)\n\n138\nCreate drawing using CAD\nsoftware\nApply CAD/CAM program\nWrite basic CNC lathe\nmachine program\nSet-up CNC lathe machine,\nworkpiece and cutting tools\nPerform basic CNC lathe\nmachine operations\nWrite advanced CNC lathe\nmachine program\nSet-up multiple-axis CNC\nlathe machine, workpiece and\ncutting tools\nPerform advanced CNC lathe\nmachine operations\nWrite basic CNC milling\nmachine program\nSet-up CNC milling machine,\nworkpiece and cutting tools\nPerform basic CNC milling\nmachine operations\nWrite advanced CNC milling\nmachine program\nSet-up multiple-axis CNC\nmilling machine, workpiece and\ncutting tools\nPerform advanced CNC\nmilling machine operations\nWeld Carbon Steel Plates\nUsing FCAW\nWeld Carbon Steel Pipes\nUsing FCAW\nWeld Alloy Steel Plates Using\nFCAW\nWeld Alloy Steel Pipes Using\nFCAW\nPerform Gas Welding in\nCarbon Steel Plates and\nTubes\nPerform Gas Welding in Alloy\nSteel Plates and Tubes\nWeld Carbon Steel Plates\nUsing GMAW\n\nWeld Carbon Steel Pipes\nUsing GMAW\nWeld Alloy Steel Plates Using\nGMAW\nWeld Alloy Steel Pipes Using\nGMAW\nWeld Carbon Steel Plates\nUsing GTAW\nWeld Carbon Steel Pipes\nUsing GTAW\nWeld Alloy Steel Plates Using\nGTAW\nWeld Alloy Steel Pipes Using\nGTAW\nPerform bench work (Basic)\nTurn workpiece\nMill workpiece\nGrind workpiece\nShape workpiece\nRepair workpiece\nPerform bench work (Basic)\nPerform bench work\n(Complex)\nTurn workpiece (Basic)\nTurn workpiece\n(Intermediate)\nMill workpiece (Basic)\nMill workpiece (Intermediate)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 143 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/20)\n\n139\nGrind workpiece (Basic)\nGrind workpiece (Complex)\nTurn workpiece (Advanced)\nMill workpiece (Advanced)\nPrepare basic engineering\ndrafting\nPerform basic engineering\ndetail drafting\nPerform Preventive\nMaintenance\nPerform Planned and\nUnplanned (Emergency)\nMaintenance\nFabricate Simple Items\nInstall Machinery\n Perform press machine\nsetting\n Perform mechanical press\noperation\nWeld Plates Using SAW\nWeld Pipes Using SAW\nWeld Carbon Steel Plates\nUsing SMAW\nWeld Carbon Steel Plates\nand Pipes Using SMAW\nWeld Alloy Steel Plates Using\nSMAW\nWeld Alloy Steel Pipes Using\nSMAW\nMachine Die Components\nFit and Assemble Dies\nTest and Try Die\nMachine mold components\n\nImplement surface\nfinishing\n\nFit and assemble mold\n\nRectify mold flaws\n\n--- PDF PAGE 144 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/2019)\n\n140\nGLOSSARY OF TERMS\n\n1. Assembly\nA unit of fitted parts that make up a mechanism or machine\n\n2. Assembly\nDrawing\nAre used to show the position and functional relationship of parts\nin an assembly\n\n3. Bed\nOne of the principal parts of a machine tool, having accurately\nmachined ways or bearing surfaces for supporting and aligning\nother parts of the machine\n\n4. Bit, tool (cutter)\nA hardened steel bar or plate that is shaped according to the\noperation to be performed and the material to be machined.\n\n5. Caliper\nA device used to measure inside or outside dimensions.\n\n6. Collet\nA precision work holding chuck which centers finished round stock\nautomatically when tightened\n\n7. Coolant\nA common term given to the numerous cutting fluids or\ncompounds used with cutting tools to increase the tool life and to\nimprove surface finish on the material.\n\n8. Cutting speed\nThe surface speed of the workpiece in a lathe or a rotating cutter,\ncommonly expressed in feet per minute (FPM) and converted to\nrevolutions per minute (RPM) for proper setting on the machine\n\n9. Cutting tool\nA hardened piece of metal (tool steel) that is machined and ground\nso that it has the shape and cutting edges appropriate for the\noperation for which it is to be used\n\n10. Drill\nA pointed tool that is rotated to cut holes in material\n\n11. Ferrous\nA metal alloy in which iron is the major ingredient\n\n12. Flash\nAny excess material that is formed with and attached to the\ncomponent along a seam or mold parting line\n\n13. Formed cutters\n\nMilling cutters which will produce shaped surfaces with a single\ncut’, and so designed that they may be sharpened without.\nchanging their outline or shape\n\n14. Gage\n\nAny one of a large variety of devices for measuring or checking\nthe dimensions of objects\n\n15. Gate\nThe channel through which the molten resin flows from the runner\ninto the cavity.\n\n--- PDF PAGE 145 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/2019)\n\n141\n16. Indicator\nA precision instrument which shows variations of thousandths of\nan inch or less when testing the trueness or alignment of a\nworkpiece, fixture, or machine\n\n17. Machinist\n\nA person who is skilled in the operation of machine tools. He must\nbe able to plan his own procedures and have a knowledge of heat-\ntreating principles\n\n18. Mill\nThe act of performing an operation on the milling machine\n\n19. Nonferrous\nMetal containing no iron, such as brass and aluminum\n\n20. Part Drawing\nDetail drawing completely described a single parts with multiple\northographic projections\n\n21. Runner\nRefers to the feed channel, usually of circular cross section, which\nconnects the sprue with the cavity gate. The term is also used for\nthe plastic piece formed in this channel\n\n22. Setup\nThe preparation of a machine tool to complete a specific\noperation. It includes mounting the workpiece and necessary\n\n23. Sine bar\nA precision instrument for laying out, setting, testing, and\notherwise dealing with angular work\n\n24. Tap\nA tool used to cut threads on the inside of a round hole\n\n25. Tolerance\nThe range of permissible size\n\n26. Tool steel\n\nA general classification for high-carbon steel that can be heat\ntreated to a hardness required for metal cutting tools such as\npunches, dies, drills, taps, reamers, and so forth\n\n27. Void\nAn unfilled space within a solid material\n\n--- PDF PAGE 146 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/2019)\n\n142\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMOLD MAKING NC III\nQualification Code:\nMEEMOM319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nMold Making NC III\n2019-031 /\n05-21-2019\n\nLegend: *Description Types\n- Document Created\n\n--- PDF PAGE 147 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/2019)\n\n143\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTECHNICAL EXPERTS / TESDA EXPERTS PANEL\n\nFRED P. LIZA\nIndustry Expert\nChief, Prototyping Division\nDOST-MIRDC\nBicutan, Taguig City\nDANILO N. PILAR\nIndustry Expert\nChief,\nDOST-MIRDC\nBicutan, Taguig City\nROMANICO F. SALIDO\nIndustry Expert\nProject Consultant\nDOST-MIRDC\nBicutan, Taguig City\nREYNALDO DELA CRUZ\nIndustry Expert\nSupervising SRS,\nDOST-MIRDC\nBicutan, Taguig City\nGHARRY M. BATHAN\nIndustry Expert\nSr. SRS\nDOST-MIRDC\nBicutan, Taguig City\nVIRGILIO F. LANZUELA\nBoard of Trustee-Secretary\nPDMA, Inc.\nChairman\nRollmaster Machinery and Industrial\nServices, Corporation\n\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n• Aichi Forging Co. of Asia, Inc.\n Sta. Rosa, Laguna\n\n• MFI Technological Institute Inc.\n Pasig City\n\n• SMC Yamamura Fuso Molds Corp.\n Cavite City\n\n• Top Choice Training Inst. & Ass