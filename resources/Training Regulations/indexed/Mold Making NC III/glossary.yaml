  "source_text": "1. Assembly\nA unit of fitted parts that make up a mechanism or machine\n\n2. Assembly\nDrawing\nAre used to show the position and functional relationship of parts\nin an assembly\n\n3. Bed\nOne of the principal parts of a machine tool, having accurately\nmachined ways or bearing surfaces for supporting and aligning\nother parts of the machine\n\n4. Bit, tool (cutter)\nA hardened steel bar or plate that is shaped according to the\noperation to be performed and the material to be machined.\n\n5. Caliper\nA device used to measure inside or outside dimensions.\n\n6. Collet\nA precision work holding chuck which centers finished round stock\nautomatically when tightened\n\n7. Coolant\nA common term given to the numerous cutting fluids or\ncompounds used with cutting tools to increase the tool life and to\nimprove surface finish on the material.\n\n8. Cutting speed\nThe surface speed of the workpiece in a lathe or a rotating cutter,\ncommonly expressed in feet per minute (FPM) and converted to\nrevolutions per minute (RPM) for proper setting on the machine\n\n9. Cutting tool\nA hardened piece of metal (tool steel) that is machined and ground\nso that it has the shape and cutting edges appropriate for the\noperation for which it is to be used\n\n10. Drill\nA pointed tool that is rotated to cut holes in material\n\n11. Ferrous\nA metal alloy in which iron is the major ingredient\n\n12. Flash\nAny excess material that is formed with and attached to the\ncomponent along a seam or mold parting line\n\n13. Formed cutters\n\nMilling cutters which will produce shaped surfaces with a single\ncut’, and so designed that they may be sharpened without.\nchanging their outline or shape\n\n14. Gage\n\nAny one of a large variety of devices for measuring or checking\nthe dimensions of objects\n\n15. Gate\nThe channel through which the molten resin flows from the runner\ninto the cavity.\n\n--- PDF PAGE 145 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/2019)\n\n141\n16. Indicator\nA precision instrument which shows variations of thousandths of\nan inch or less when testing the trueness or alignment of a\nworkpiece, fixture, or machine\n\n17. Machinist\n\nA person who is skilled in the operation of machine tools. He must\nbe able to plan his own procedures and have a knowledge of heat-\ntreating principles\n\n18. Mill\nThe act of performing an operation on the milling machine\n\n19. Nonferrous\nMetal containing no iron, such as brass and aluminum\n\n20. Part Drawing\nDetail drawing completely described a single parts with multiple\northographic projections\n\n21. Runner\nRefers to the feed channel, usually of circular cross section, which\nconnects the sprue with the cavity gate. The term is also used for\nthe plastic piece formed in this channel\n\n22. Setup\nThe preparation of a machine tool to complete a specific\noperation. It includes mounting the workpiece and necessary\n\n23. Sine bar\nA precision instrument for laying out, setting, testing, and\notherwise dealing with angular work\n\n24. Tap\nA tool used to cut threads on the inside of a round hole\n\n25. Tolerance\nThe range of permissible size\n\n26. Tool steel\n\nA general classification for high-carbon steel that can be heat\ntreated to a hardness required for metal cutting tools such as\npunches, dies, drills, taps, reamers, and so forth\n\n27. Void\nAn unfilled space within a solid material\n\n--- PDF PAGE 146 ---\nMold Making NC III\nRevision 00 Promulgated (05/21/2019)\n\n142",
