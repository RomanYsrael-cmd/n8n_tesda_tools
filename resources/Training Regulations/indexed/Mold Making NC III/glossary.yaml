      "term": "Drawing",
      "definition": "Are used to show the position and functional relationship of parts in an assembly 3. Bed One of the principal parts of a machine tool, having accurately machined ways or bearing surfaces for supporting and aligning other parts of the machine 4. Bit, tool (cutter) A hardened steel bar or plate that is shaped according to the operation to be performed and the material to be machined. 5. Caliper A device used to measure inside or outside dimensions. 6. Collet A precision work holding chuck which centers finished round stock automatically when tightened 7. Coolant A common term given to the numerous cutting fluids or compounds used with cutting tools to increase the tool life and to improve surface finish on the material. 8. Cutting speed The surface speed of the workpiece in a lathe or a rotating cutter, commonly expressed in feet per minute (FPM) and converted to revolutions per minute (RPM) for proper setting on the machine 9. Cutting tool A hardened piece of metal (tool steel) that is machined and ground so that it has the shape and cutting edges appropriate for the operation for which it is to be used 10. Drill A pointed tool that is rotated to cut holes in material 11. Ferrous A metal alloy in which iron is the major ingredient 12. Flash Any excess material that is formed with and attached to the component along a seam or mold parting line 13. Formed cutters Milling cutters which will produce shaped surfaces with a single cut’, and so designed that they may be sharpened without. changing their outline or shape 14. Gage Any one of a large variety of devices for measuring or checking the dimensions of objects 15. Gate The channel through which the molten resin flows from the runner into the cavity."
    },
    {
      "term": "Mold Making NC III",
      "definition": "16. Indicator A precision instrument which shows variations of thousandths of an inch or less when testing the trueness or alignment of a workpiece, fixture, or machine 17. Machinist A person who is skilled in the operation of machine tools. He must be able to plan his own procedures and have a knowledge of heat- treating principles 18. Mill The act of performing an operation on the milling machine 19. Nonferrous Metal containing no iron, such as brass and aluminum 20. Part Drawing Detail drawing completely described a single parts with multiple orthographic projections 21. Runner Refers to the feed channel, usually of circular cross section, which connects the sprue with the cavity gate. The term is also used for the plastic piece formed in this channel 22. Setup The preparation of a machine tool to complete a specific operation. It includes mounting the workpiece and necessary 23. Sine bar A precision instrument for laying out, setting, testing, and otherwise dealing with angular work 24. Tap A tool used to cut threads on the inside of a round hole 25. Tolerance"
