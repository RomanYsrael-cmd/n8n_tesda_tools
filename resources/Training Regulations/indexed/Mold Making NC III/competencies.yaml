        "source_text": "--- PDF PAGE 10 ---\nMold Making NC III \nRevision 00                       Promulgated  05/21/2019 \n6 \nUNIT OF COMPETENCY  \n \n: \nLEAD SMALL TEAMS  \n \nUNIT CODE \n  \n:      \n400311320 \n \nUNIT DESCRIPTOR            \n \n:      \nThis unit covers the knowledge, skills and attitudes to  \n \n \n \n \nlead small teams including setting, maintaining and  \n \n \n \n \nmonitoring team and individual performance   \n                                                               standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Provide team \nleadership \n1.1   Work requirements \nare identified and \npresented to team \nmembers based on \ncompany policies and \nprocedures \n1.2   Reasons for \ninstructions and \nrequirements are \ncommunicated to team \nmembers based on \ncompany policies and \nprocedures \n1.3  Team members’ and \nleaders’ concerns \nare recognized, \ndiscussed and dealt \nwith based on \ncompany practices \n1.1  Facilitation of Team \nwork \n1.2  Company policies \nand procedures \nrelating to work \nperformance \n1.3  Performance \nstandards and \nexpectations \n1.4  Monitoring \nindividual’s and \nteam’s \nperformance vis a \nvis client’s and \ngroup’s \nexpectations \n1.1  Communication \nskills required for \nleading teams \n1.2  Group facilitation \nskills \n1.3  Negotiating skills \n1.4  Setting performance \nexpectation \n2. Assign \nresponsibilities \n2.1. Responsibilities are \nallocated having \nregard to the skills, \nknowledge and \naptitude required to \nundertake the \nassigned task based \non company policies. \n2.2. Duties are allocated \nhaving regard to \nindividual preference, \ndomestic and personal \nconsiderations, \nwhenever possible \n \n2.1  Work plan and \nprocedures \n2.2  Work requirements \nand targets \n2.2  Individual and \ngroup expectations \nand assignments \n2.3  Ways to improve \ngroup leadership \nand membership \n2.1  Communication \nskills \n2.2  Management skills \n2.3  Negotiating skills \n2.4  Evaluation skills \n2.5   Identifying team \nmember’s strengths \nand rooms for \nimprovement \n \n3. Set \nperformance \nexpectations for \nteam members \n3.1  Performance \nexpectations are \nestablished based on \nclient needs  \n3.2  Performance \nexpectations are based \non individual team \nmembers knowledge, \nskills and aptitude  \n3.1  One’s roles and \nresponsibilities in \nthe team \n3.2  Feedback giving \nand receiving \n3.3  Performance \nexpectation \n \n \n3.1  Communication \nskills \n3.2  Accurate empathy \n3.3  Congruence \n3.4  Unconditional \npositive regard \n3.5  Handling of \nFeedback\n\n--- PDF PAGE 11 ---\nMold Making NC III \nRevision 00                       Promulgated  05/21/2019 \n7 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.3  Performance \nexpectations are \ndiscussed and \ndisseminated to \nindividual team \nmembers \n4.  Supervise team \nperformance \n4.1 Performance is \nmonitored based on \ndefined performance \ncriteria and/or \nassignment instruction \n 4.2  Team members are \nprovided with \nfeedback, positive \nsupport and advice on \nstrategies to overcome \nany deficiencies based \non company practices \n4.3  Performance issues \nwhich cannot be \nrectified or addressed \nwithin the team are \nreferred to appropriate \npersonnel according to \nemployer policy \n4.4  Team members are \nkept informed of any \nchanges in the priority \nallocated to \nassignments or tasks \nwhich might impact on \nclient/customer needs \nand satisfaction \n4.5  Team operations are \nmonitored to ensure \nthat employer/client \nneeds and \nrequirements are met \n4.6   Follow-up \ncommunication is \nprovided on all issues \naffecting the team \n 4.7  All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany procedures \n \n4.1  Performance \nCoaching  \n4.2  Performance \nmanagement \n4.3  Performance Issues \n \n \n4.1  Communication \nskills required for \nleading teams \n4.2  Coaching skill\n\n--- PDF PAGE 12 ---\nMold Making NC III \nRevision 00                       Promulgated  05/21/2019 \n8 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \nMay include: \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s \nconcerns \nMay include: \n2.1. Roster/shift details \n3. Monitor performance \nMay include: \n3.1. Formal process \n3.2. Informal process \n4. Feedback \nMay include: \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \nMay include: \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service\n\n--- PDF PAGE 13 ---\nMold Making NC III \nRevision 00                       Promulgated  05/21/2019 \n9 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to \nnext level of management or appropriate specialist \nand to negotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5. Set and communicated performance expectations for \na range of tasks and duties within the team and \nprovided feedback to team members \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2. Materials relevant to the proposed activity or task \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning  \n3.3. Portfolio \n4. Context for Assessment \n4.1   Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
