  "source_section_text": "SECTION 1 MOLD MAKING NC III QUALIFICATION\n\nThe MOLD MAKING NC III qualification consists of competencies that workers\nmust achieve to enable them to perform tasks such as machining of mold components,\nimplementing surface finishing, fitting, rectifying mold components and assembling mold.\n\nThis qualification is packaged from the competency map of Mold making – Metals\nand engineering sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n400311322\nApply critical thinking and problem-solving techniques in the workplace\nWork in a diverse environment\n400311323\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in the organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE722201\nMEE722202\nMEE722203\nMEE722204\nMEE722205\nMEE722206\nMEE722207\nMEE722208\nMEE722210\nMEE722211\nICT311201\nApply safety practices\nInterpret working drawings and sketches\nSelect/ cut workshop materials\nPerform shop computations (Basic)\nMeasure workpiece (Basic)\nPerform routine housekeeping\nPerform shop computations (Intermediate)\nMeasure workpiece using angular measuring instruments\nMeasure workpiece using gages and surface texture comparator\nPerform preventive and corrective maintenance\nOperate a personal computer\nCODE NO.\nCORE COMPETENCIES\nMEE722317\nMEE722318\nMEE722319\nMEE722320\n\nMachine mold components\nImplement surface finishing\nFit and assemble mold\nRectify mold flaws\n\n--- PDF PAGE 6 ---\nMold Making NC III\nRevision 00 Promulgated 05/21/2019\n2\nA person who has achieved this qualification is competent to be:\n• CNC Machinist\n\n• CNC Lathe Machine Operator\n\n• CNC Milling Machine Operator\n• Mold Maker\n• CNC Programmer\n• Mold Assembler\n• Mold Setter\n• Grinding Machine Operator\n• CNC EDM Wire Cut/Sinker operator\n\n--- PDF PAGE 7 ---\nMold Making NC III\nRevision 00 Promulgated 05/21/2019\n3"
}
