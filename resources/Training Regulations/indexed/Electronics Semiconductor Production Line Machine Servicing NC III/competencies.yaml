tly identified.\n3.2. Correct drawing is identified,\nequipment are selected and\nused in accordance with job\nrequirements.\n3.1. Drawing\nconventions\n3.2. Dimensioning\nConventions\n3.3. Mathematics\no 4 Fundamental\nOperations\n- Percentage\n- Fraction\n- Algebra\n- Geometry\n3.1. Reading skills\nrequired to\ninterpret work\ninstruction\n3.2. Communication\nskills\n3.3. Preparing/Making\nelectrical/\nelectronic signs\nand symbols\n3.4. Computing\nformulas\n\n--- PDF PAGE 39 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 35\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Store\ntechnical\ndrawings and\nequipment/\ninstruments\n4.1. Care and maintenance of\ndrawings are undertaken\naccording to company\nprocedures.\n4.2. Technical drawings are\nrecorded and inventory is\nprepared in accordance with\ncompany procedures.\n4.3. Proper storage of\ninstruments is undertaken\naccording to company\nprocedures.\n\n4.1. Effective ways to\ncatalogue and store\ntechnical drawings\n4.2. Manual methods of\nhandling, storing an\nd maintaining paper\ndrawings\n4.3. Storing drawing in\ndigital forms\no Scanner\no CAD\n\n4.1. Handling and\nstoring of\ndrawings\n4.2. Scanning and\nstoring drawings\nin digital form\n4.3. Matching\nspecification\ndetails with\nexisting resources\n4.4. Handling of\ndrawing\ninstruments\n\n--- PDF PAGE 40 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 36\n\nRANGE OF VARIABLES\n\nVARIAB