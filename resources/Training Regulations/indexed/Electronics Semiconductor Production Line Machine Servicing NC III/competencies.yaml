e\nskills\n1.2. Reading skills\n1.3. Communication\nskills\n1.4. Detecting\nabnormality or\nnon-\nconformance\n2. Assess\nmachine\nperformance/\ncondition\n2.1 Previous PM activities and\nline performance are\nreviewed in accordance with\ncompany procedures.\n2.2 Previous breakdown history\nis analyzed in accordance\nwith machine maintenance\nmanual\n2.3 Appropriate action is\ndetermined based on the\nresults of the review and\nanalysis conducted.\n2.4 Current machine\nperformance/condition is\nassessed in accordance with\nuser feedback.\n\n2.1 PM standards and\nprocedures\n2.2 Machine preventive\nmaintenance manuals\n2.3 Knowledge in\nmachine mechanical/\nelectrical adjustment/\ncalibration and\nparameter fine tuning\n2.4 Knowledge in\nmachine\nspecifications and\noperation\n2.1 Reading skills\n2.2 Communication\nskills\n2.3 Detecting\nabnormality or\nnon-\nconformance\n3. Carryout\n3.1 Safety procedures are\n3.1 Safety procedures\n3.1 Read and\n\n--- PDF PAGE 76 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 72\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nmachine\npreventive\nmaintenance\nand calibration\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n3.2 Mechanical and\nelectrical/electronic parts\nare properly checked\naccording to machine and\nproduct specifications and\nrequired maintenance time\n3.3 PM check sheet items are\nexecuted in accordance with\nPM procedures and machine\nspecifications\n3.4 Calibration check sheet\nitems are executed in\naccordance with calibration\nprocedures and machine\nspecifications\n3.5 Any non-conformance to\nspecifications is reported to\nappropriate personnel.\n\nand standard