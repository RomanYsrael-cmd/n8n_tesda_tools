ques in\nanalyzing the\nresults\n3.2 Process in\nreviewing the\nresults\n3.3 Precision &\naccuracy\n3.4 Four fundamental\noperations\n3.5 Steps in solving\nproblem\n3.6 formulas\n3.7 Conversion\nmeasurement\n3.1 Analyzing the result\nbased on the\nspecified\nrequirements\n3.2 Interpreting and\ncommunicating the\nresults of the\nanalysis\n\n--- PDF PAGE 20 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 16\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Calculator\n2.2 Basic measuring tools\n2.3 Case Problems\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Authenticated portfolio\n3.2 Written Test\n3.3 Interview/Oral Questioning\n3.4 Demonstration\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 21 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 17\n\nUNIT OF C