        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1\nPrepared tools, instrument and machine\n1.2\nAssessed machine performance/condition\n1.3\nCarried out machine preventive maintenance and\ncalibration\n1.4\nBuyoff machine condition after maintenance\n\n2. Resource Implications\nThe following resources MUST be provided:\n2.1\nAppropriate machine and equipment\n2.2\nTools (as indicated in the Range of Variables)\n2.3\nMaterials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample PM checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nLaptop\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n3.2\nWritten Test\n\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\nNote: For assessment - Behavioral indicator should be observed for each task being performed.\n\n--- PDF PAGE 79 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 75"
        },
        "source_text": "ELC724367\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed\nin performing machine preventive maintenance (PM). This\nincludes preparing tools, instrument and machine, reviewing\nmachine performance, carrying out machine preventive\nmaintenance and calibration as well as buyoff machine\ncondition after maintenance.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare\nmaintenance\nand calibration\ntools,\ninstrument\nand machine\n1.1. Safety procedures are\nfollowed according to\nOccupational Safety and\nHealth (OSH) Standards.\n1.2. Tools, jigs, instrument and\nmachine for PM are\ndetermined based from the\nMaintenance Procedures\n1.3. Tools, instrument and\nmachines are checked prior\nto the performance of the\nscheduled PM\n1.4. Forms, check sheets,\nstandards, spare parts (if\napplicable), consumable\nparts and cleaning\nmaterials are prepared for\nuse in the preventive\nmaintenance and calibration\nworks\n1.1. Safety procedures\nand standards in\npreventive\nmaintenance of\nmachines.\n1.2. Familiarity with\nproduction line tools\nand/or equipment and\ntheir location.\n1.3. Understanding\nmachine manuals,\nprocedures, work\ninstructions and other\napplicable\ndocuments/\nspecifications\n1.4. Knowledge in the use\nof various PM forms\nand check sheets\n1.5. Knowledge on\ncleaning materials\n1.1. Safety practice\nskills\n1.2. Reading skills\n1.3. Communication\nskills\n1.4. Detecting\nabnormality or\nnon-\nconformance\n2. Assess\nmachine\nperformance/\ncondition\n2.1 Previous PM activities and\nline performance are\nreviewed in accordance with\ncompany procedures.\n2.2 Previous breakdown history\nis analyzed in accordance\nwith machine maintenance\nmanual\n2.3 Appropriate action is\ndetermined based on the\nresults of the review and\nanalysis conducted.\n2.4 Current machine\nperformance/condition is\nassessed in accordance with\nuser feedback.\n\n2.1 PM standards and\nprocedures\n2.2 Machine preventive\nmaintenance manuals\n2.3 Knowledge in\nmachine mechanical/\nelectrical adjustment/\ncalibration and\nparameter fine tuning\n2.4 Knowledge in\nmachine\nspecifications and\noperation\n2.1 Reading skills\n2.2 Communication\nskills\n2.3 Detecting\nabnormality or\nnon-\nconformance\n3. Carryout\n3.1 Safety procedures are\n3.1 Safety procedures\n3.1 Read and\n\n--- PDF PAGE 76 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 72\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nmachine\npreventive\nmaintenance\nand calibration\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n3.2 Mechanical and\nelectrical/electronic parts\nare properly checked\naccording to machine and\nproduct specifications and\nrequired maintenance time\n3.3 PM check sheet items are\nexecuted in accordance with\nPM procedures and machine\nspecifications\n3.4 Calibration check sheet\nitems are executed in\naccordance with calibration\nprocedures and machine\nspecifications\n3.5 Any non-conformance to\nspecifications is reported to\nappropriate personnel.\n\nand standards in\npreventive\nmaintenance and\ncalibration\n3.2 Familiarity with\nproduction line tools\nand/or equipment and\ntheir location.\n3.3 Knowledge in\nmachine mechanical\nand electrical\npreventive\nmaintenance and\ncalibration\n3.4 Knowledge on the\nuse of setup jigs.\n3.5 Understand machine\nmechanical / electrical\nparts and functions\n(especially moving\nparts).\n3.6 Knowledge with basic\npneumatic parts and\nsystems.\n3.7 Knowledge with basic\nhydraulic parts and\nsystem\n3.8 Awareness on safety\noperation of\n