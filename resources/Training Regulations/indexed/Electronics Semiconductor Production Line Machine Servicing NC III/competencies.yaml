ased on job \nrequirements\n2.1 Problem-based \nquestions \n2.2 Estimation \n2.3 Use of \nmathematical tools \nand standard \nformulas \n2.4 Mathematical \ntechniques \n \n2.1 Solving \nmathematical \ncomputations \n2.2 Converting Metric to \nEnglish \n2.3 Selecting and using \nappropriate and \nefficient techniques \nand strategies to \nsolve problems \n3. Analyze \nresults \n3.1 Result of application is \nreviewed based on \nexpected and required \nspecifications and outcome \n3.2 Appropriate action is \napplied in case of error \n3.1 Techniques in \nanalyzing the \nresults \n3.2 Process in \nreviewing the \nresults \n3.3 Precision & \naccuracy \n3.4 Four fundamental \noperations \n3.5 Steps in solving \nproblem \n3.6 formulas \n3.7 Conversion \nmeasurement\n3.1 Analyzing the result \nbased on the \nspecified \nrequirements \n3.2 Interpreting and \ncommunicating the \nresults of the \nanalysis\n\n--- PDF PAGE 20 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        16  \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Mathematical techniques \nMay include but are not limited to: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n2.  Appropriate action \n2.1  Review in the use of mathematical \ntechniques (e.g. recalculation, re-modeling) \n2.2  Report error to immediate superior for proper \naction \n \n \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Identified, applied and reviewed the use of \nmathematical concepts and techniques to workplace \nproblems \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1  Calculator \n2.2  Basic