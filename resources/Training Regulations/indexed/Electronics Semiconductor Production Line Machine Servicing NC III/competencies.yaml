        "source_title": "TERMINATE AND CONNECT ELECTRICAL WIRING AND ELECTRONICS CIRCUIT",
        "source_text": "--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        46  \n \nUNIT TITLE \n: \nTERMINATE AND CONNECT ELECTRICAL WIRING AND \nELECTRONICS CIRCUIT \nUNIT CODE \n: \nELC724202 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, attitudes and values \nneeded to terminate and connect electrical wiring and \nelectronic circuits \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and prepare \nfor termination/ \nconnection of \nelectrical wiring/ \nelectronics \ncircuits \n1.1. Materials are checked \naccording to specifications \nand tasks \n1.2. Appropriate tools and \nequipment are selected \naccording to tasks \nrequirements \n1.3. Task is planned to ensure \nOH & S guidelines and \nprocedures are followed \n1.4. Electrical wiring/electronic \ncircuits are correctly \nprepared for connecting/ \ntermination in accordance \nwith instructions and work \nsite procedures \n1.1. Use of tools \n1.2. Use of test \ninstruments / \nequipment \n1.3. Electrical theory \n1.4. Principals of AC \nand DC \n1.5. OH & S guidelines \nand procedures  \n1.6. Basic electrical \nand electronic \ndevices \n1.1. Reading skills \nrequired to \ninterpret work \ninstruction \n1.2. Checking \nmaterials for \nconformance to \nspecifications \n1.3. Checking \nexisting and \nnew installation \nsite for correct \nlocation and \nspecification \n2. Terminate/ \nconnect electrical \nwiring/ electronic \ncircuits \n2.1. \nSafety procedures in \nusing tools are observed \nat all times and \nappropriate personal \nprotective equipment \nare used \n2.2. \nWork is undertaken \nsafely in accordance with \nthe workplace and \nstandard procedures \n2.3. \nAppropriate range of \nmethods in termination/ \nconnection are used \naccording to \nspecifications, \nmanufacturer’s \nrequirements and safety \n2.4. \nCorrect sequence of \noperation is followed \naccording to job \nspecifications \n2.5. \nAccessories used are \nadjusted, if necessary \n2.6. \nConfirm termination/ \nconnection undertaken \nsuccessfully in \naccordance with job \nspecification \n2.1. Wiring \ntechniques \n2.2. OH & S \nprinciples \n2.3. Use of lead-free \nsoldering \ntechnology \n2.4. Specifications \nand methods for \nterminating \ndifferent \nmaterials \n2.1. Communication \nskills \n2.2. Marking, \ntagging and \nlabeling \nrequirements \nfor cables, \nwires, \nconductors and \nconnections\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        47  \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Test \ntermination/ \nconnections of \nelectrical wiring/ \nelectronics \ncircuits \n3.1. Testing of all completed \ntermination/ connections \nof electric wiring/electronic \ncircuits is conducted for \ncompliance with \nspecifications and \nregulations using \nappropriate procedures \nand equipment \n3.2. Wiring and circuits are \nchecked using specified \ntesting procedures \n3.3. Unplanned events or \nconditions are responded \nto in accordance with \nestablished procedures \n \n3.1. AC and DC \npower supplies \n3.2. Use of diagnostic \nequipment \n3.3. Surface mount \nsoldering \ntechniques \n3.4. Tests for wiring \nand connections  \n3.5. Wiring support \ntechniques and \nalternatives  \n3.1. Soldering \ntechniques \n3.2. Printed circuit \nboard repair \nand techniques \n3.3. Electronic \nassembly \nfunctional and \nquality testing \n3.4. Undertaking \ntesting of \nwiring and \nconnections for \nconformance \nto specification \n3.5. Using \nlanguage and \nliteracy skills to \ncomplete short \nreports and \nrequired \n3.6. Adjusting and \nfixing wiring \nsupports\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        48  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \n1.1 Materials included the following but not limited to: \n1.1.1 Soldering lead \n1.1.2 Cables \n1.1.3 Wires \n2. Tools and equipment \n2.1 Tools for measuring, cutting, drilling, \nassembling/disassembling.  Tool set includes the \nfollowing but not limited to: \n2.1.1 Pliers \n2.1.2 Cutters \n2.1.3 Screw drivers \n2.2 Equipment \n2.2.1 Soldering gun \n2.2.2 Multi-tester \n3. Personal protective \nequipment \n3.1 goggles \n3.2 gloves \n3.3 apron/overall \n4. Methods \n4.1 Clamping \n4.2 Pin connection \n4.3 Soldered joints \n4.4 Plugs \n5. Accessories \n5.1 Accessories may include the following but not \nlimited to: \n5.1.1 brackets \n5.1.2 clamps\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        49  \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n \n1.1. Undertook work safely and according to workplace \nand standard procedures \n1.2. Used appropriate termination/ connection methods\n1.3. Followed correct sequence in termination / \nconnection process \n1.4. Conducted testing of terminated connected \nelectrical wiring/electronic circuits using \nappropriate procedures and standards \n2. Method of assessment \nCompetency in this unit must be assessed through: \n2.1. Observation \n2.2. Oral Questioning \n2.3. Practical demonstration \n3. Resource implication \nTools for measuring, cutting, drilling, assembling/ \ndisassembling, connection. Tool set includes the \nfollowing but not limited to: \n3.1 \nscrew drivers \n3.2 \npliers \n3.3 \ncutters \n4. Context of Assessment \n4.1. Assessment may be conducted in the workplace \nor in a simulated   environment\n",
