ng \nparticipants of \nsuccessful \nstrategies\n\n--- PDF PAGE 33 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        29  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Authorized sources \nMay include: \n1.1 Stakeholders    \n1.2 Key personnel \n1.3 specialist \n2. Organization systems \nand procedures \nMay include: \n2.1 Supply chain, procurement and purchasing   \n2.2 Quality assurance \n2.3\nMaking recommendations and seeking approvals \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n \n1.1. Investigated current practices in relation to \nresource usage.  \n1.2. Set targets for improvements.  \n1.3. Implemented performance improvement \nstrategies \n1.4. Monitored performance \n2. Resource Implication \nThe following resources should  be provided: \n2.1. Workplace/Assessment location  \n2.2. Legislation, policies, procedures, protocols and \nlocal ordinances relating to environmental \nprotection  \n2.3. Case studies/scenarios relating to environmental \nprotection  \n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1. Written/ Oral Examination  \n3.2. Interview/Third Party Reports  \n3.3. Portfolio (citations/awards from GOs and NGOs, \ncertificate of  training – local and abroad)    \n3.4. Simulations and role-plays \n4. Context of Assessment \n \n4.1. Competency may be assessed in actual \nworkplace or at the designated TESDA center.\n",
