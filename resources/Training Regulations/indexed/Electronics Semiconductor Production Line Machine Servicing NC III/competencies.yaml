        "source_text": "ELC724205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ntest electronic components. It includes competencies in\ndetermining the criteria for testing electronics components,\nplanning an approach for component testing, testing the\ncomponents and evaluating the testing process.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\ncriteria for\ntesting\nelectronics\ncomponents\n1.1. Work instructions are\nobtained and clarified\nbased on job order or client\nrequirements\n1.2. Responsible person is\nconsulted for effective and\nproper work coordination\n1.3. Data sheets/Application\nnotes are obtained and\ninterpreted based on\nmanufacturer’s\nspecifications\n1.4. Testing criteria are\ndefined to ensure that\ncomponents meet technical\nand quality requirements\n1.5. Document and\ncommunicate testing\ncriteria to relevant\npersonnel\n1.1 Mensuration/ Mathematics\n1.1.1 Conversion of Units\n1.1.2 Applied Mathematics\n1.2 Safety\n1.2.1 Work Safety\nrequirements and\neconomy of\nmaterials with\ndurability\n1.3 Systems and Processes\n1.3.1 Principles of\nelectrical/ electronic\ncircuits\n1.3.2 Identifying sources\nof electricity\n1.3.3 Identifying\nconductors and\ninsulators\n1.3.4 Supplying different\nvoltage using\nvariable power\nsupply\n1.3.5 Measuring\nresistance using\nVOM\n1.3.6 Testing resistors\n1.3.7 Measuring current\nand voltage using\nVOM\n1.4 Testing Criteria\n1.4.1 controls\n1.4.2 effectiveness\n1.4.3 efficiency\n1.4.4 bug detection\n1.4.5 functionality,\nincluding flow\n1.4.6 interoperability\n1.4.7 performance\n1.4.8 reliability\n1.4.9 operating\nparameters\n1.1 Work efficiently\n& systematically\n1.2 Communication\nskills\n1.3 Use and\nmaintenance of\ntools and\nequipment\n1.4 Skills in testing\nelectronic\ncomponents\n1.5 Work safety\npractices and\ntime\nmanagement\n1.6 Problem solving\nskills\n1.7 Reading skills\n2. Plan an\n2.1 Various testing methods\n2.1. Safety\n2.1 Work efficiently\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 51\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\napproach for\ncomponent\ntesting\nare Identified based on\ntypes of electronic\ncomponents\n2.2 Characteristics and\nappropriateness of testing\nmethods to be used during\ndevelopment and on\ncompletion is determined\n2.3 Testing methods are\nconsidered/selected in\nrelation to appropriate\ntesting strategy\n2.4 Plan for testing\ncomponents is developed\nat specified points during\ndevelopment and on\ncompletion\n2.5 Required test &\nmeasuring instruments\nand tools are prepared\nand checked in accordance\nwith established\nprocedures\n2.6 Records system is\nestablished to document\ntesting results, including\nproblems and faults\n2.1.1. Work Safety\nrequirements and\neconomy of\nmaterials with\ndurability\n2.1.2. Knowledge in 5S\napplication and\nobservation of\nrequired timeframe\n2.2. Materials, tools and\nequipment uses and\nspecifications\n2.2.1. Proper care and\nuse of tools\n2.3. Types of electronic\ncomponents\n2.3.1. Passive\ncomponents\n2.3.2. Active components\n2.3.3. Dynamic\ncomponents\n2.3.4. Hybrid components\n2.4. Testing methods\n2.4.1. automated\n2.4.2. debugging\n2.4.3. inspection\n2.4.4. platform testing\n2.4.5. prototyping\n2.5. Systems and Processes\n2.5.1. Describing\nresistance and\nidentify resistors\n2.5.2. Describing\nalternating current\ncircuits\n2.5.3. Describing\ncapacitance and\nidentifying\ncapacitors\n2.5.4. Describing\ninductance and\nidentifying inductors\n2.5.5. describing the\ncharacteristic of\ntransf