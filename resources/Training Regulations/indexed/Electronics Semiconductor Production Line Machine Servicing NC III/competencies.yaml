ces \n3.12 5S principles\n3.1 Read and \ninterpret \nmechanical \ndrawings, \nschematic \ndiagrams \n3.2 Apply \nprocedures in \nmechanical \nmanuals \n3.3 Use proper \ntools for a \nspecific task \n3.4 Detect \nabnormality or \nnon-\nconformance \n3.5 Remove/install \nmechanical \nparts on \nmachine \n3.6 Determine \nmechanical/ \nelectrical parts \nfunction \n3.7 Determine \nmechanical \nparts \nclearance \nbased on \nstandards \n4. Carry out \nadjustment for \nnew parameter \nsettings \n \n4.1 New machine parameters \nare set based on latest \nadjustment/ replacement. \n4.2 Machine parts functionality \nbased on new parameters \nis confirmed through \nmanual mode  \n4.3 New machine parameters \nare saved on the machine \nmemory \n4.4 Machine parameter \nsettings adjustment is \ndocumented based on \ncompany procedures \n \n4.1 Safety procedures and \nstandards in machine \nparameters setting \n4.2 Awareness on safety \noperation of production \nline machines \n4.3 Electrical/Electronic \nmachine parameters \nsetup \n4.4 Readings of different \ngauges \n4.5 Awareness on setup \ncriteria \n4.1 Following \nsafety \nprocedures \n4.2 Setting \nmachine \nparameters \n4.3 Reading \ngauges \n4.4\n\n--- PDF PAGE 72 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        68  \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5. Test-run and \nmonitor \nmachine \n5.1 Safety procedures are \nfollowed according to \noccupational safety and \nhealth (OSH) standards  \n5.2 Outputs using \nsample/dummy units, if \nnecessary, are checked \naccording to product \ncriteria \n5.3 Initial production outputs \nare checked according to \nproduct criteria \n5.4 Completeness and \naccuracy of documents are \nchecked in accordance to \nrepair specifications \n5.5 Machine is turned over for \nproduction in accordance \nwith company procedures \n \n5.1 Safety procedures and \nstandards in machine \ntroubleshooting and \nrepair \n5.2 Knowledge in machine \noperations \n5.3 Knowledge in product \ncriteria \n5.4 Understanding of data \nlog results \n5.5 Product handling \n5.6 Documentation \nprocedures \n5.7 Awareness on \napplicable Out of \nControl Action Plan \n(OCAP) \n5.1 Observing \nsafety \nprocedures \n5.2 Can operate \nmachine being \nrepaired \n5.3 Document \ndata log \nresults \n5.4 Product \nhandling\n\n--- PDF PAGE 73 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        69  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools \nTools may include but not limited to: \nMechanical \n1.1 \nSet of Allen keys \n1.2 \nSet wrenches \n1.3 \nTweezers  \n1.4 \nTorque driver \n1.5 \nLevel gauge \n1.6 \nSteel rule/measuring tape \n1.7 \nPuller  \n1.8 \nHammer/mallet \n1.9 \nFeeler gauge \n1.10 Vernier/micrometer caliper  \n1.11 Peak tester \n1.12 Grease gun \n1.13 Air brush / gun \n1.14 Stop watch\n \nElectrical (including \naccessories) \n1.1 Set of screwdrivers \n1.2 Set of pliers \n1.3 Soldering iron \n1.4 Crimper  \n1.5 Cutter \n1.6 Electrical knife \n1.7 Cable ties \n1.8 Electrical tape \n1.9 Soldering lead \n2. Instruments \nMay include: \n2.1 \nOscilloscope \n2.2 \nVOM/DVM \n2.3 \nPower meter \n2.4 \nTemperature profile checker \n2.5 \nCharge plate monitor \n2.6 \nInfra-red (IR) camera \n2.7 \nVibration analyzer \n2.8 \nNoise checker/ ultrasonic tester \n2.9 \nClamp ammeter \n2.10 Tachometer \n2.11 Tension meter\n3. Problem solving \nand analysis tools \n \nProblem solving and analysis tools may include: \n3.1 \nRoot cause analysis \n3.2 \n5 Why analysis \n3.3 \nFish bone analysis \n3.4\nEquipment failure mode and effect analysis (EFMEA)\n4. Troubleshooting \nmethods \nTroubleshooting methods may include but not limited to: \n4.1 \nSensory method (sight, sound, touch, smell) \n4.2 \nSubstitution method/swapping \n4.3 \nSignal injection and tracing \n4.4 \nVoltage-current measurement \n4.5 \nContinuity testing \n4.6 \nResistance check \n4.7 \nProgram/software diagnostics  \n4.8\nMechanical measurement (e.g clearance, planarity, height)\n5. Electromechanical \nparts \nMay include but not limited to: \n5.1 \nPneumatic parts \n5.2 \nHydraulic parts \n5.3\nPumps\n\n--- PDF PAGE 74 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        70"
