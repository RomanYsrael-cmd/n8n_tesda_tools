its are\nchecked if in good working\ncondition and without\nphysical defects.\n\n1.1. Familiarity with production\nline tools, equipment and\nconversion kits and their\nlocation\n1.2. Understanding machine\nmanuals, procedures,\nwork instructions and\nother applicable\ndocuments/ specifications.\n1.3. Awareness on safe\nhandling of tools and\nmaterials i.e. 5S\nprinciples, Occupational\nHealth and Safety (OHS),\nMaterial Safety Data\nSheet (MSDS), Personal\nProtective Equipment\n(PPE), Electro Static\nDischarge (ESD),\nEnvironmental Health\nSystems (EHS),\nCleanroom requirements\nand contamination control\n1.4. Awareness on IPC\nstandards\n1.5. Awareness on\ninternational quality\nstandards\n1.5.1. Quality Management\nSystem\n1.5.2. Environmental\nManagement\nSystem\n1.6. Awareness on visual\ncriteria on parts and tools\n1.7. Time consciousness on\nsetup time\n1.1 Reading skills\n1.2 Basic\nmathematical\nskills\n1.3 Communicatio\nn skills\n1.4 Computer\nskills\n1.5 Detect\nabnormality or\nnon-\nconformance\n1.6 Writing skills\n2. Carryout\nmachine\nmechanical\nsetup/\nconversion\n2.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n2.2 Mechanical parts are\n2.1 Safety procedures and\nstandards in mechanical\nsetup/conversion\n2.2 Interpretation of\nmechanical drawings\n2.1 Read and\ninterpret\nmechanical\ndrawings\n2.2 Apply\n\n--- PDF PAGE 62 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 58\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n\nproperly installed according\nto machine and product\nspecifications and required\nsetup time\n2.3 Conversion parts/kits are\nproperly installed/replaced\naccording to machine and\nproduct specifications and\nrequired conversion time\n2.4 Any non-conformance to\nspecifications is reported to\nappropriate personnel.\n\n2.3 Knowledge in machine\nmechanical setup and\nconversion procedures\n2.4 Knowledge on the use of\nsetup jigs\n2.5 Understand machine\nmechanical parts and\nfunctions (especially\nmoving parts)\n2.6 Knowledge with basic\npneumatic parts and\nsystem\n2.7 Knowledge with basic\nhydraulic parts and system\n2.8 Awareness on safety\noperation of production line\nmachines\n2.9 Reading of different\ngauges\n2.10 Awareness on setup\ncriteria\n2.11 Awareness on applicable\nOut of Control Action\nPlan (OCAP)\nprocedures in\nmechanical\nmanuals\n2.3 Use proper\ntools for a\nspecific task\n2.4 Detect\nabnormality or\nnon-\nconformance\n2.5 Install\nmechanical\nparts on\nmachine\n3. Carryout\nmachine\nelectrical/\nelectronic\nsetup/\nconversion\n\n3.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n3.2 Electrical/Electronic parts\nare properly installed/\nreplaced according to\nmachine and product\nspecifications and required\ntime\n3.3 Electrical conversion\nparts/kits are properly\ninstalled/replaced according\nto machine and product\nspecifications and required\nconversion time\n3.4 Any non-conformance to\nspecifications is reported to\nappropriate personnel\n\n3.1 Safety procedures and\nstandards in electrical/\nelectronic setup\n3.2 Interpretation of electrical\ndiagrams\n3.3 Knowledge in machine\nelectrical/ electronic setup\nprocedures\n3.4 Understand machine\nelectrical/ electronic parts\nand functions\n3.5 Awareness on safety\noperation of production\nline machines\n3.6 Reading of different\ngauges\n3.7 Awareness on setup\ncriteria\n3.8 Awareness on applicable\nOut of Control Action Plan\n(OCAP)\n3.1 Read and\ninterpret\nelectrical\ndiagrams\n3.2 Apply\nprocedures in\nelectrical/\nelectronic\nmanuals\n3.3 Use proper\ntools for a\nspecific task\n3.4 Detect\nabnormality or\nnon-\nconformance\n3.5 Install\nelectrical/\nelectronic\nparts on\nmachine\n4. Carryout\nmachine\nparameters\nsetting\n\n4.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n4.2 Electrical/Electronic\nmachine parameters are\nsetup according to\nproduction\nspecifications/work\n4.1 Safety procedures and\nstandards in machine\nparameters setting\n4.2 Awareness on safety\noperation of production\nline machines\n4.3 Electrical/Electronic\nmachine parameters\nsetup\n4.1 Follow safety\nprocedures\n4.2 Set machine\nparameters\n4.3 Read gauges\n\n--- PDF PAGE 63 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 59\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\ninstructions\n4.3 Electrical/Electronic\nmachine parameters are\nchecked according to\nproduction\nspecifications/work\ninstructions\n4.4 Readings of different\ngauges\n4.5 Awareness on setup\ncriteria\n4.6 Awareness on applicable\nOut of Control Action Plan\n(OCAP)\n5. Perform\nproduction\nsetup buyoff\n5.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n5.2 Outputs using dummy\nunits, if applicable, are\nchecked according to\nproduct criteria\n5.3 Initial production outputs\nare checked according to\nproduct criteria\n5.4 Completeness and\naccuracy of documents are\nchecked in accordance to\nsetup/conversion\nspecifications\n5.1 Safety procedures and\nstandards in production\nsetup buyoff\n5.2 Knowledge in machine\noperations\n5.3 Knowledge in product\ncriteria\n5.4 Understanding of data log\nresults\n5.5 Product handling\n5.6 Documentation\nprocedures\n5.7 Awareness on applicable\nOut of Control Action Plan\n(OCAP)\n5.1 Observe\nsafety\nprocedures\n5.2 Operate\nmachine being\nsetup\n5.3 Document\ndata log\nresults\n5.4 Product\nhandling\n\n--- PDF PAGE 64 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 60\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools may include but not limited to:\n\nMechanical\n1.1\nSet of Allen keys\n1.2\nSet wrenches\n1.3\nTweezers\n1.4\nTorque driver\n1.5\nLevel gauge\n1.6\nSteel rule/measuring tape\n1.7\nPuller\n1.8\nHammer/mallet\n1.9\nFeeler gauge\n1.10 Vernier/micrometer caliper\n1.11 Peak tester\n\nElectrical\n1.1 Set of screwdrivers\n1.2 Set of pliers\n1.3 Soldering iron\n1.4 Crimper\n1.5 Cutter\n1.6 Electrical knife\n1.7 Cable ties\n1.8 Electrical tape\n\n2. Equipment\nEquipment may include but not limited to:\n2.1 Laptop\n2.2 Oscilloscope\n2.3 VOM\n2.4 Power meter\n2.5 Temperature profile checker\n2.6 Charge plate monitor\n2.7 Infra-red (IR) camera\n2.8 Vibration analyzer\n2.9 Noise checker/ ultrasonic tester\n3. Mechanical parts\nMay include but not limited to:\n2.1. Pneumatic parts\n2.2. Hydraulic parts\n2.3. Pumps\n2.4. Fabricated parts\n2.5. OEM / Catalogue parts\n4. Appropriate personnel\nMay include:\n3.1\nManager\n3.2\nEngineer\n3.3\nSupervisor\n3.4\nLead technician\n\n5. Product criteria\n4.1\nVisual check\n4.2\nPhysical check\n4.3\nMechanical check\n4.4\nElectrical check\n4.5\nDimension check\n4.6\nFunction check\n\n--- PDF PAGE 65 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 61\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared tools, equipment and conversion kit\n1.2\nCarried out machine mechanical setup/conversion\n1.3\nCarried out machine electrical/electronic setup/\nconversion\n1.4\nCarried out machine parameters setting\n1.5\nPerformed production setup buyoff\n2. Resource Implications\nThe following resources MUST be provided:\n2.1\nAppropriate machine and equipment\n2.2\nTools (as indicated in the Range of Variables)\n2.3\nMaterials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nLaptop\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n3.2\nWritten Test\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\nNote: For assessment - Behavioral indicator should be observed for each task being performed.\n\n--- PDF PAGE 66 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 62\n\nUNIT OF COMPETENCY: MONITOR MACHINE PERFORMANCE\n\nUNIT CODE\n : ELC724365\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed in\nmonitoring machine performance. This includes gathering\nand analyzing basic machine data and performing/\nrecommending machine performance adjustment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Gather\nmachine data\n1.1 Checklist and forms are\nprepared/ secured for\nmachine data gathering\n1.2 Performance log\nfiles/history are gathered\nfrom the machine based on\nmanufacturing procedures\n1.3 Machine data are gathered\nbased on key\nperformance index (KPI)\n1.1 Knowledge in machine\noperations\n1.2 Familiarity in machine\nfunctions.\n1.3 Manufacturing\nprocedures during\nmachine production\n1.4 Good understanding of\nKey Performance Index\nformulas\n1.5 Basic Statistical\nProcess Control (SPC)\n1.6 7 Quality Control (QC)\ntools\n\n1.1 Basic\nmathematical\nskills\n1.2 Computer skills\n1.3 Writing skills\n1.4 Communication\nskills\n\n2. Analyze\nbasic\nmachine data\n2.1. Benchmark data are\nprepared based on\nmachine standard\nregistration\n2.2. Gathered data are\nanalyzed and compared\nagainst the set targets\n2.3. Evaluation result is\ndocumented according to\nprocedure or out-of-control\naction plan (OCAP)\n2.4. KPI with non-conformance\nare identified and actions/\nrecommendations are\ndetermined based on\nmanufacturer’s procedures\n\n2.1. Procedures/\nTechniques in data\nanalysis\n2.2. Knowledge of\nappropriate evaluation\ntools\n2.3. Knowledge in\npreparation of\nevaluation result and\nrecommendation\n2.4. Knowledge on machine\nstandard registration\nsettings\n\n2.1. Processing,\nanalysis and\ninterpretation of\ndata\n2.2. Computer skills\n2.3. Basic analytical\nskills\n2.4. Troubleshooting\nskills\n2.5. Documentation\nskills\n\n3. Perform/\nrecommend\nmachine\nadjustment\n3.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n3.2 Tools are determined\naccording to machine\nspecifications\n3.3 Machine adjustment is\nperformed or\nrecommended for any non-\nconformance against set\nstandards\n3.1 Occupational safety\nand health (OSH)\nstandards for machine\nadjustment/ calibration\n3.2 Knowledge in machine\nmechanical/electrical\nadjustment/calibration\nand parameter fine-\ntuning.\n3.3 Knowledge in product\ncriteria.\n3.4 Knowledge in machine\n3.1 Implement\nsafety protocols\n3.2 Set machine\nparameters.\n3.3 Detect\nabnormality or\nnon-\nconformance\n3.4 Troubleshooting\nskills\n3.5 Documentation\nskills\n\n--- PDF PAGE 67 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 63\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.4 Where necessary, approval\nis sought before machine\nadjustment or calibration\nbased on company\nprocedures\n3.5 Machine adjustment or\ncalibration is documented\nbased on company\nprocedures/work\ninstructions\n\nspecifications and\noperation\n3.5 Knowledge of out-of-\ncontrol action plan\n(OCAP)\n\n--- PDF PAGE 68 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 64\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools may include but not limited to:\n\nMechanical\n1.1\nSet of Allen keys\n1.2\nSet wrenches\n1.3\nSet of screwdrivers\n(standard)\n1.4\nSet of jigs\n1.5\nTorque driver\n(mechanical)\n1.6\nLevel gauge\n1.7\nSteel rule/measuring\ntape\n1.8\nHammer/mallet\n1.9\nFeeler gauge\n1.10 Vernier/micrometer\ncaliper\n\n1.11 Tachometer\n1.12 Grease gun\n1.13 Air brush / gun\n1.14 Stop watch\n1.15 Dial gauge\n\nElectrical/Electronics\n1.1\nSet of screwdrivers\n(electrical)\n1.2\nTorque driver\n(electrical)\n1.3\nSet of pliers\n1.4\nVOM/DVM\n2. Key performance\nindex (KPI)\nKPI may include but not limited to:\n2.1 Capacity\n2.2 Load time\n2.3 RPM (rate per minute)\n2.4 Output\n2.5 MTBF (mean time between failures)\n2.6 MTBA (mean time between assist)\n2.7 MTTA (mean time to assist)\n2.8 MTTR (mean time to repair)\n2.9 Overall equipment effectiveness\n• availability/uptime\n• efficiency/performance\n• quality/yield\n3. Adjustment\nMachine adjustment may include:\n3.1 Tightening of bolts and screws\n3.2 Greasing and lubrication\n3.3 Cleaning and air brushing\n3.4 Parameter settings adjustment (e.g. speed, pressure,\ntemperature)\n3.5 Belt tensioning and tightening\n3.6 Mechanical alignment\n3.7 Sensor adjustment\n3.8 Machine program adjustments (e.g. X-Y coordinates)\n\n--- PDF PAGE 69 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 65\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Gathered machine data\n1.2 Analyzed basic machine data\n1.3 Performed/recommended machine adjustment\n2. Resource Implications\nThe following resources MUST be provided:\n2.1\nAppropriate machine and equipment\n2.2\nMachine manual, if necessary\n2.3\nTools (as indicated in the Range of Variables)\n2.4\nMaterials\n2.5\nWork Instructions Assessment rating sheet\n2.6\nSample production and/or maintenance checklist\n2.7\nApplicable forms for specific equipment or machines\n2.8\nProcedure and work instructions\n2.9\nLaptop\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n3.2\nWritten Test\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\nNote: For assessment - Behavioral indicator should be observed for each task being performed.\n\n--- PDF PAGE 70 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 66\n\nUNIT OF COMPETENCY:\nPERFORM MACHINE TROUBLESHOOTING & REPAIR\nUNIT CODE\n : ELC724366\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed in\nperforming machine troubleshooting and repair. This includes\npreparing tools and/or instruments, carrying out machine\nmechanical/ electrical/ program troubleshooting, adjustment\nand repair and new parameter settings. This also includes\ntest-running and monitoring the machine.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare\ntroubleshooting/\nrepair tools\nand/or\ninstruments\n1.1 Safety procedures are\nfollowed according to\nOccupational Safety and\nHealth (OSH) Standards.\n1.2 Appropriate tools and/or\ninstruments are prepared\nto be used in the repair.\n1.3 Tools and/or instruments\nare confirmed to be\ncalibrated and in good\ncondition.\n1.1 Safety procedures and\nstandards in machine\nsettings and calibration\n1.2 Familiarity with\nproduction line tools\nand/or instruments and\ntheir location\n1.3 Understanding\nmachine manuals,\nprocedures, work\ninstructions and other\napplicable documents/\nspecifications\n1.1 Safety\npractice skills\n1.2 Reading skills\n1.3 Communicati\non skills\n1.4 Detect\nabnormality\nor non-\nconformance\n2. Carry out\nmachine\nmechanical/\nelectrical/\nelectronic/\nprogram\ntroubleshooting\n2.1 Safety procedures are\nfollowed according to\nOccupational Safety and\nHealth (OSH) Standards.\n2.2 Machine troubles or\nsymptoms are analyzed\nand probable source of\nproblems are identified\n2.3 Different problem solving\nand analysis tools are\napplied based on machine\ncondition\n2.4 Tests are conducted on\nsuspected machine parts,\nunits or modules based on\nmachine standard\ncondition\n2.5 Defective machine/\nelectrical parts are\nidentified and located\nusing appropriate\ntroubleshooting\nmethods according to\nmachine/ electrical\ntroubleshooting manual.\n2.1 Safety procedures and\nstandards in\nmechanical/ electrical/\nelectronic\ntroubleshooting\n2.2 Machine troubles or\nsymptoms\n2.3 Machine\ntroubleshooting\nmethods\n2.4 Knowledge in use of\nmeasuring instruments\n2.5 Basic knowledge on\nelectronic components\n2.6 Basic PLC symbols,\ndiagrams and\nsequences\n2.7 Basic Motor control\nsystem\n2.8 Sensor technology\n2.9 Different problem\nsolving and analysis\ntools\n2.1 Troubleshooti\nng skills\n2.2 Reading and\ninterpreting\nmechanical\ndrawings and\nschematic\ndiagrams\n2.3 Applying\nproblem\nsolving and\nanalysis tools\n\n--- PDF PAGE 71 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 67\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Carry out\nmachine\nmechanical/\nelectrical/\nprogram\nadjustment and\nrepair\n\n3.1 Safety procedures are\nfollowed according to\nOccupational Safety and\nHealth (OSH) Standards.\n3.2 Electromechanical or\nmoving parts are aligned,\nadjusted or replaced when\nnecessary to achieve\nstandard machine\nconditions.\n3.3 Electrical settings of\nmachines are checked and\nadjusted to achieve\nstandard machine\nconditions.\n3.4 Specific instruments\nand/or tools are used to\nadjust the machine\n3.5 Machine adjustment,\ncalibration or parts\nreplacement is\ndocumented based on\ncompany procedures\n\n3.1 Safety procedures and\nstandards in\nmechanical / electrical\nadjustments.\n3.2 Familiarity with\nproduction line tools\nand/or equipment and\ntheir location.\n3.3 Interpretation of\nmechanical drawings\nand electrical diagrams.\n3.4 Knowledge in machine\nmechanical and\nelectrical\ntroubleshooting.\n3.5 Knowledge on the use\nof setup jigs.\n3.6 Understand machine\nmechanical / electrical\nparts and functions\n(especially moving\nparts).\n3.7 Knowledge with basic\npneumatic parts and\nsystems.\n3.8 Knowledge with basic\nhydraulic parts and\nsystem\n3.9 Awareness on safety\noperation of production\nline machines.\n3.10 Reading of different\ngauges.\n3.11 Basic PLC symbols,\ndiagrams and\nsequences\n3.12 5S principles\n3.1 Read and\ninterpret\nmechanical\ndrawings,\nschematic\ndiagrams\n3.2 Apply\nprocedures in\nmechanical\nmanuals\n3.3 Use proper\ntools for a\nspecific task\n3.4 Detect\nabnormality or\nnon-\nconformance\n3.5 Remove/install\nmechanical\nparts on\nmachine\n3.6 Determine\nmechanical/\nelectrical parts\nfunction\n3.7 Determine\nmechanical\nparts\nclearance\nbased on\nstandards\n4. Carry out\nadjustment for\nnew parameter\nsettings\n\n4.1 New machine parameters\nare set based on latest\nadjustment/ replacement.\n4.2 Machine parts functionality\nbased on new parameters\nis confirmed through\nmanual mode\n4.3 New machine parameters\nare saved on the machine\nmemory\n4.4 Machine parameter\nsettings adjustment is\ndocumented based on\ncompany procedures\n\n4.1 Safety procedures and\nstandards in machine\nparameters setting\n4.2 Awareness on safety\noperation of production\nline machines\n4.3 Electrical/Electronic\nmachine parameters\nsetup\n4.4 Readings of different\ngauges\n4.5 Awareness on setup\ncriteria\n4.1 Following\nsafety\nprocedures\n4.2 Setting\nmachine\nparameters\n4.3 Reading\ngauges\n4.4\n\n--- PDF PAGE 72 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 68\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Test-run and\nmonitor\nmachine\n5.1 Safety procedures are\nfollowed according to\noccupational safety and\nhea