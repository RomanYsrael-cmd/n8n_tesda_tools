r \n2.9 Noise checker/ ultrasonic tester\n3. Mechanical parts \nMay include but not limited to: \n2.1. Pneumatic parts \n2.2. Hydraulic parts \n2.3. Pumps \n2.4. Fabricated parts \n2.5. OEM / Catalogue parts \n4. Appropriate personnel \nMay include: \n3.1 \nManager \n3.2 \nEngineer \n3.3 \nSupervisor \n3.4 \nLead technician \n \n5. Product criteria \n4.1 \nVisual check \n4.2 \nPhysical check \n4.3 \nMechanical check \n4.4 \nElectrical check \n4.5 \nDimension check \n4.6 \nFunction check\n\n--- PDF PAGE 65 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        61"
