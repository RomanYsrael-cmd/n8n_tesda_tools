        "source_title": "PERFORM MACHINE TROUBLESHOOTING & REPAIR",
        "source_text": "--- PDF PAGE 70 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        66  \n \nUNIT OF COMPETENCY: \nPERFORM MACHINE TROUBLESHOOTING & REPAIR \nUNIT CODE  \n        :    ELC724366 \nUNIT DESCRIPTOR       :    This unit covers the knowledge, skills and attitudes needed in \nperforming machine troubleshooting and repair. This includes \npreparing tools and/or instruments, carrying out machine \nmechanical/ electrical/ program troubleshooting, adjustment \nand repair and new parameter settings. This also includes \ntest-running and monitoring the machine. \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare \ntroubleshooting/ \nrepair tools \nand/or \ninstruments \n1.1 Safety procedures are \nfollowed according to \nOccupational Safety and \nHealth (OSH) Standards. \n1.2 Appropriate tools and/or \ninstruments are prepared \nto be used in the repair. \n1.3 Tools and/or instruments \nare confirmed to be \ncalibrated and in good \ncondition. \n1.1 Safety procedures and \nstandards in machine \nsettings and calibration \n1.2 Familiarity with \nproduction line tools \nand/or instruments and \ntheir location \n1.3 Understanding \nmachine manuals, \nprocedures, work \ninstructions and other \napplicable documents/ \nspecifications \n1.1 Safety \npractice skills \n1.2 Reading skills \n1.3 Communicati\non skills \n1.4 Detect \nabnormality \nor non-\nconformance \n2. Carry out \nmachine \nmechanical/ \nelectrical/ \nelectronic/ \nprogram \ntroubleshooting \n2.1 Safety procedures are \nfollowed according to \nOccupational Safety and \nHealth (OSH) Standards. \n2.2 Machine troubles or \nsymptoms are analyzed \nand probable source of \nproblems are identified  \n2.3 Different problem solving \nand analysis tools are \napplied based on machine \ncondition \n2.4 Tests are conducted on \nsuspected machine parts, \nunits or modules based on \nmachine standard \ncondition \n2.5 Defective machine/ \nelectrical parts are \nidentified and located \nusing appropriate \ntroubleshooting \nmethods according to \nmachine/ electrical \ntroubleshooting manual. \n2.1 Safety procedures and \nstandards in \nmechanical/ electrical/ \nelectronic \ntroubleshooting \n2.2 Machine troubles or \nsymptoms \n2.3 Machine \ntroubleshooting \nmethods  \n2.4 Knowledge in use of \nmeasuring instruments \n2.5 Basic knowledge on \nelectronic components \n2.6 Basic PLC symbols, \ndiagrams and \nsequences \n2.7 Basic Motor control \nsystem \n2.8 Sensor technology \n2.9 Different problem \nsolving and analysis \ntools \n2.1 Troubleshooti\nng skills \n2.2 Reading and \ninterpreting \nmechanical \ndrawings and \nschematic \ndiagrams \n2.3 Applying \nproblem \nsolving and \nanalysis tools\n\n--- PDF PAGE 71 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        67  \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Carry out \nmachine \nmechanical/ \nelectrical/ \nprogram \nadjustment and \nrepair \n \n3.1 Safety procedures are \nfollowed according to \nOccupational Safety and \nHealth (OSH) Standards. \n3.2 Electromechanical or \nmoving parts are aligned, \nadjusted or replaced when \nnecessary to achieve \nstandard machine \nconditions. \n3.3 Electrical settings of \nmachines are checked and \nadjusted to achieve \nstandard machine \nconditions. \n3.4 Specific instruments \nand/or tools are used to \nadjust the machine \n3.5 Machine adjustment, \ncalibration or parts \nreplacement is \ndocumented based on \ncompany procedures \n \n \n \n \n3.1 Safety procedures and \nstandards in \nmechanical / electrical \nadjustments. \n3.2 Familiarity with \nproduction line tools \nand/or equipment and \ntheir location. \n3.3 Interpretation of \nmechanical drawings \nand electrical diagrams. \n3.4 Knowledge in machine \nmechanical and \nelectrical \ntroubleshooting. \n3.5 Knowledge on the use \nof setup jigs. \n3.6 Understand machine \nmechanical / electrical \nparts and functions \n(especially moving \nparts). \n3.7 Knowledge with basic \npneumatic parts and \nsystems. \n3.8 Knowledge with basic \nhydraulic parts and \nsystem \n3.9 Awareness on safety \noperation of production \nline machines. \n3.10 Reading of different \ngauges. \n3.11 Basic PLC symbols, \ndiagrams and \nsequences \n3.12 5S principles\n3.1 Read and \ninterpret \nmechanical \ndrawings, \nschematic \ndiagrams \n3.2 Apply \nprocedures in \nmechanical \nmanuals \n3.3 Use proper \ntools for a \nspecific task \n3.4 Detect \nabnormality or \nnon-\nconformance \n3.5 Remove/install \nmechanical \nparts on \nmachine \n3.6 Determine \nmechanical/ \nelectrical parts \nfunction \n3.7 Determine \nmechanical \nparts \nclearance \nbased on \nstandards \n4. Carry out \nadjustment for \nnew parameter \nsettings \n \n4.1 New machine parameters \nare set based on latest \nadjustment/ replacement. \n4.2 Machine parts functionality \nbased on new parameters \nis confirmed through \nmanual mode  \n4.3 New machine parameters \nare saved on the machine \nmemory \n4.4 Machine parameter \nsettings adjustment is \ndocumented based on \ncompany procedures \n \n4.1 Safety procedures and \nstandards in machine \nparameters setting \n4.2 Awareness on safety \noperation of production \nline machines \n4.3 Electrical/Electronic \nmachine parameters \nsetup \n4.4 Readings of different \ngauges \n4.5 Awareness on setup \ncriteria \n4.1 Following \nsafety \nprocedures \n4.2 Setting \nmachine \nparameters \n4.3 Reading \ngauges \n4.4\n\n--- PDF PAGE 72 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        68  \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5. Test-run and \nmonitor \nmachine \n5.1 Safety procedures are \nfollowed according to \noccupational safety and \nhealth (OSH) standards  \n5.2 Outputs using \nsample/dummy units, if \nnecessary, are checked \naccording to product \ncriteria \n5.3 Initial production outputs \nare checked according to \nproduct criteria \n5.4 Completeness and \naccuracy of documents are \nchecked in accordance to \nrepair specifications \n5.5 Machine is turned over for \nproduction in accordance \nwith company procedures \n \n5.1 Safety procedures and \nstandards in machine \ntroubleshooting and \nrepair \n5.2 Knowledge in machine \noperations \n5.3 Knowledge in product \ncriteria \n5.4 Understanding of data \nlog results \n5.5 Product handling \n5.6 Documentation \nprocedures \n5.7 Awareness on \napplicable Out of \nControl Action Plan \n(OCAP) \n5.1 Observing \nsafety \nprocedures \n5.2 Can operate \nmachine being \nrepaired \n5.3 Document \ndata log \nresults \n5.4 Product \nhandling\n\n--- PDF PAGE 73 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        69  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools \nTools may include but not limited to: \nMechanical \n1.1 \nSet of Allen keys \n1.2 \nSet wrenches \n1.3 \nTweezers  \n1.4 \nTorque driver \n1.5 \nLevel gauge \n1.6 \nSteel rule/measuring tape \n1.7 \nPuller  \n1.8 \nHammer/mallet \n1.9 \nFeeler gauge \n1.10 Vernier/micrometer caliper  \n1.11 Peak tester \n1.12 Grease gun \n1.13 Air brush / gun \n1.14 Stop watch\n \nElectrical (including \naccessories) \n1.1 Set of screwdrivers \n1.2 Set of pliers \n1.3 Soldering iron \n1.4 Crimper  \n1.5 Cutter \n1.6 Electrical knife \n1.7 Cable ties \n1.8 Electrical tape \n1.9 Soldering lead \n2. Instruments \nMay include: \n2.1 \nOscilloscope \n2.2 \nVOM/DVM \n2.3 \nPower meter \n2.4 \nTemperature profile checker \n2.5 \nCharge plate monitor \n2.6 \nInfra-red (IR) camera \n2.7 \nVibration analyzer \n2.8 \nNoise checker/ ultrasonic tester \n2.9 \nClamp ammeter \n2.10 Tachometer \n2.11 Tension meter\n3. Problem solving \nand analysis tools \n \nProblem solving and analysis tools may include: \n3.1 \nRoot cause analysis \n3.2 \n5 Why analysis \n3.3 \nFish bone analysis \n3.4\nEquipment failure mode and effect analysis (EFMEA)\n4. Troubleshooting \nmethods \nTroubleshooting methods may include but not limited to: \n4.1 \nSensory method (sight, sound, touch, smell) \n4.2 \nSubstitution method/swapping \n4.3 \nSignal injection and tracing \n4.4 \nVoltage-current measurement \n4.5 \nContinuity testing \n4.6 \nResistance check \n4.7 \nProgram/software diagnostics  \n4.8\nMechanical measurement (e.g clearance, planarity, height)\n5. Electromechanical \nparts \nMay include but not limited to: \n5.1 \nPneumatic parts \n5.2 \nHydraulic parts \n5.3\nPumps\n\n--- PDF PAGE 74 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        70  \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared tools and/or instruments \n1.2 \nCarried out machine mechanical/electrical \ntroubleshooting \n1.3 \nCarried out machine mechanical/ electrical adjustment \nand repair \n1.4 \nCarried out new parameter setting \n1.5 \nTest-run and monitored machine \n2.  Resource Implications The following resources MUST be provided: \n2.1 \nAppropriate machine and equipment \n2.2 \nTools (as indicated in the Range of Variables) \n2.3 \nMaterials  \n2.4 \nWork Instructions Assessment rating sheet \n2.5 \nSample production checklist \n2.6 \nApplicable forms for specific equipment or machines \n2.7 \nProcedure and quality manuals \n2.8 \nLaptop \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1 \nDemonstration/Observation with oral questioning \n3.2 \nWritten Test \n4.  Context for \nAssessment \n4.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting \n \nNote: For assessment - Behavioral indicator should be observed for each task being performed.\n",
