uction line\nPerform Front-of-Line\n(FOL) Operation for\nElectronics Production Line\nCheck quality compliance\nof Front-of-Line (FOL)\noperation for electronics\nproduction line\nSetup Backend Operation\nWorkplace for HDD\nProduction Line\nPerform Backend Operation\nfor Hard Disk Drives (HDD)\nProduction Line\nCheck quality compliance\nof backend operation for\nHDD production line\nPerform Machine\nSetup/Conversion\nPerform Machine\nTroubleshooting and\nRepair\nSetup Front-of-Line (FOL)\nOperation Workplace for\nHDD Production Line\nPerform Front-of-Line (FOL)\nOperation for HDD\nProduction Line\nCheck quality compliance\nof Front-of-Line (FOL)\noperation for HDD\nproduction line\nMonitor Machine\nPerformance\nPerform Machine\nPreventive Maintenance\nand Calibration\n\n--- PDF PAGE 119 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 115\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Electronics/Semiconductor Production Line Machine\nServicing NC III\nQualification Code: ELCESM317\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nElectronics/Semiconductor\nProduction Line Machine\nServicing NC III\n\nNot Applicable\n\nTB No. 2017-50/\nDecember 18, 2017\nTESDA Circular\nNo. __ s. 2018\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 120 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated Dec