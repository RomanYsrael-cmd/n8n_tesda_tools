ot cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify the\nproblem\n1.1. Variances are identified\nfrom normal operating\nparameters; and product\nquality\n1.2. Extent, cause and nature of\nthe problem are defined\nthrough observation,\ninvestigation and\nanalytical techniques\n1.3. Problems are clearly\nstated and specified\n\n1.1. Competence\nincludes a thorough\nknowledge and\nunderstanding of\nthe process, normal\noperating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n1.2. Competence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action\nand provision of\nrecommendations\n1.2.1. Relevant\nequipment\nand\noperational\nprocesses\n1.2.2. Enterprise\ngoals, targets\nand measures\n1.2.3. Enterprise\nquality, OHS\nand\nenvironmental\nrequirement\n1.2.4. Enterprise\ninformation\nsystems and\ndata collation\n1.2.5. Industry codes\nand standards\n1.3. Normal operating\nparameters and\nproduct quality\n\n1.1. Using range of\nformal problem\nsolving\ntechniques\n1.2. Identifying and\nclarifying the\nnature of the\nproblem\n1.3. Evaluating the\neffectiveness of a\npresent process in\nthe workplace\n1.4. Applying\nanalytical\ntechniques\n1.5. Identifying and\nclarifying the\nnature of problem\n\n--- PDF PAGE 16 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Determine\nfundamental\ncauses of the\nproblem\n2.1 Possible causes are\nidentified based on\nexperience and the use of\