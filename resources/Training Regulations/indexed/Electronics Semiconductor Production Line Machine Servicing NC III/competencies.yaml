        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant\nover an extended period of time, or a suitable method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies / what\nifs will be required as well as bank of questions which\nwill be used to probe the reason behind the observable\naction.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 19 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 15\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND TECHNIQUES\n\nUNIT CODE :"
        },
        "source_text": "500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to determine\nand resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify the\nproblem\n1.1. Variances are identified\nfrom normal operating\nparameters; and product\nquality\n1.2. Extent, cause and nature of\nthe problem are defined\nthrough observation,\ninvestigation and\nanalytical techniques\n1.3. Problems are clearly\nstated and specified\n\n1.1. Competence\nincludes a thorough\nknowledge and\nunderstanding of\nthe process, normal\noperating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n1.2. Competence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action\nand provision of\nrecommendations\n1.2.1. Relevant\nequipment\nand\noperational\nprocesses\n1.2.2. Enterprise\ngoals, targets\nand measures\n1.2.3. Enterprise\nquality, OHS\nand\nenvironmental\nrequirement\n1.2.4. Enterprise\ninformation\nsystems and\ndata collation\n1.2.5. Industry codes\nand standards\n1.3. Normal operating\nparameters and\nproduct quality\n\n1.1. Using range of\nformal problem\nsolving\ntechniques\n1.2. Identifying and\nclarifying the\nnature of the\nproblem\n1.3. Evaluating the\neffectiveness of a\npresent process in\nthe workplace\n1.4. Applying\nanalytical\ntechniques\n1.5. Identifying and\nclarifying the\nnature of problem\n\n--- PDF PAGE 16 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Determine\nfundamental\ncauses of the\nproblem\n2.1 Possible causes are\nidentified based on\nexperience and the use of\nproblem solving tools /\nanalytical techniques.\n2.2 Possible cause statements\nare developed based on\nfindings\n2.3 Fundamental causes are\nidentified per results of\ninvestigation conducted\n\n2.1 Relevant equipment\nand operational\nprocesses\n2.2 Enterprise goals,\ntargets and\nmeasures\n2.3 Enterprise quality,\nOHS and\nenvironmental\nrequirements\n2.4 Enterprise\ninformation systems\nand data collation\n2.5 Industry codes and\nstandards\n2.1 Analysis of root\ncauses\n3. Determine\ncorrective\naction\n3.1 All possible options are\nconsidered for resolution of\nthe problem\n3.2 Strengths and weaknesses\nof possible options are\nconsidered\n3.3 Corrective actions are\ndetermined to resolve the\nproblem and possible\nfuture causes\n3.4 Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and operating\nprocedures\n\n3.1 Understanding the\nprocedure in\nundertaking\ncorrective action\n3.2 Principles of\ndecision making\nstrategies and\ntechniques\n3.3 Enterprise\ninformation systems\nand data collation\n3.4 Action planning\n3.1 Identifying and\nclarifying the\nnature of the\nproblem\n3.2 Devising the best\nsolution\n3.3 Evaluating the\nsolution\n3.4 Implementing\ndeveloped plan to\nrectify the\nproblem\n3.5 Implementing\ncorrective and\npreventive actions\nbased on root\ncause analysis\n4. Provide\nrecommend-\nation/s to\nmanager\n4.1 Report on\nrecommendations is\nprepared according to\nprocedures.\n4.2 Recommendations are\npresented to appropriate\npersonnel.\n4.3 Recommendations are\nfollowed-up, if required\n4.1 How to make a\nreport and\nrecommendation\n4.1 Writing report and\nrecommendations\n\n--- PDF PAGE 17 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n-\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017\n13\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 18 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n-\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017\n14\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant\nover an extended period of time, or a suitable method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies / what\nifs will be required as well as bank of questions which\nwill be used to probe the reason behind the observable\naction.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 19 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 15\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND TECHNIQUES\n\nUNIT CODE :"
