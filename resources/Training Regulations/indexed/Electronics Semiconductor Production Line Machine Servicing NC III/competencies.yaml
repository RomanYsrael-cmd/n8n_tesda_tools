        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared tools, equipment and conversion kit\n1.2\nCarried out machine mechanical setup/conversion\n1.3\nCarried out machine electrical/electronic setup/\nconversion\n1.4\nCarried out machine parameters setting\n1.5\nPerformed production setup buyoff\n2. Resource Implications\nThe following resources MUST be provided:\n2.1\nAppropriate machine and equipment\n2.2\nTools (as indicated in the Range of Variables)\n2.3\nMaterials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nLaptop\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n3.2\nWritten Test\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\nNote: For assessment - Behavioral indicator should be observed for each task being performed.\n\n--- PDF PAGE 66 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 62\n\nUNIT OF COMPETENCY: MONITOR MACHINE PERFORMANCE\n\nUNIT CODE\n :"
        },
        "source_text": "ELC724364\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes needed in\nperforming machine setup/conversion. This includes preparing\ntools, equipment and conversion kits, carrying out machine,\nelectrical/ electronic setup/conversion and parameters setting as\nwell as performing production setup buyoff.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare\nsetup tools,\nequipment\nand\nconversion\nkits\n1.1 Tools, equipment and\nconversion kits are\ndetermined according to\nproduct and machine\nspecifications\n1.2 Appropriate tools,\nequipment and conversion\nkits are selected and\ncompleted according to\nproduct, machine and\nsetup time requirements\n1.3 Tools, equipment and\nconversion kits are\nchecked if in good working\ncondition and without\nphysical defects.\n\n1.1. Familiarity with production\nline tools, equipment and\nconversion kits and their\nlocation\n1.2. Understanding machine\nmanuals, procedures,\nwork instructions and\nother applicable\ndocuments/ specifications.\n1.3. Awareness on safe\nhandling of tools and\nmaterials i.e. 5S\nprinciples, Occupational\nHealth and Safety (OHS),\nMaterial Safety Data\nSheet (MSDS), Personal\nProtective Equipment\n(PPE), Electro Static\nDischarge (ESD),\nEnvironmental Health\nSystems (EHS),\nCleanroom requirements\nand contamination control\n1.4. Awareness on IPC\nstandards\n1.5. Awareness on\ninternational quality\nstandards\n1.5.1. Quality Management\nSystem\n1.5.2. Environmental\nManagement\nSystem\n1.6. Awareness on visual\ncriteria on parts and tools\n1.7. Time consciousness on\nsetup time\n1.1 Reading skills\n1.2 Basic\nmathematical\nskills\n1.3 Communicatio\nn skills\n1.4 Computer\nskills\n1.5 Detect\nabnormality or\nnon-\nconformance\n1.6 Writing skills\n2. Carryout\nmachine\nmechanical\nsetup/\nconversion\n2.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n2.2 Mechanical parts are\n2.1 Safety procedures and\nstandards in mechanical\nsetup/conversion\n2.2 Interpretation of\nmechanical drawings\n2.1 Read and\ninterpret\nmechanical\ndrawings\n2.2 Apply\n\n--- PDF PAGE 62 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 58\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n\nproperly installed according\nto machine and product\nspecifications and required\nsetup time\n2.3 Conversion parts/kits are\nproperly installed/replaced\naccording to machine and\nproduct specifications and\nrequired conversion time\n2.4 Any non-conformance to\nspecifications is reported to\nappropriate personnel.\n\n2.3 Knowledge in machine\nmechanical setup and\nconversion procedures\n2.4 Knowledge on the use of\nsetup jigs\n2.5 Understand machine\nmechanical parts and\nfunctions (especially\nmoving parts)\n2.6 Knowledge with basic\npneumatic parts and\nsystem\n2.7 Knowledge with basic\nhydraulic parts and system\n2.8 Awareness on safety\noperation of production line\nmachines\n2.9 Reading of different\ngauges\n2.10 Awareness on setup\ncriteria\n2.11 Awareness on applicable\nOut of Control Action\nPlan (OCAP)\nprocedures in\nmechanical\nmanuals\n2.3 Use proper\ntools for a\nspecific task\n2.4 Detect\nabnormality or\nnon-\nconformance\n2.5 Install\nmechanical\nparts on\nmachine\n3. Carryout\nmachine\nelectrical/\nelectronic\nsetup/\nconversion\n\n3.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n3.2 Electrical/Electronic parts\nare properly installed/\nreplaced according to\nmachine and product\nspecifications and required\ntime\n3.3 Electrical conversion\nparts/kits are properly\ninstalled/replaced according\nto machine and product\nspecifications and required\nconversion time\n3.4 Any non-conformance to\nspecifications is reported to\nappropriate personnel\n\n3.1 Safety procedures and\nstandards in electrical/\nelectronic setup\n3.2 Interpretation of electrical\ndiagrams\n3.3 Knowledge in machine\nelectrical/ electronic setup\nprocedures\n3.4 Understand machine\nelectrical/ electronic parts\nand functions\n3.5 Awareness on safety\noperation of production\nline machines\n3.6 Reading of different\ngauges\n3.7 Awareness on setup\ncriteria\n3.8 Awareness on applicable\nOut of Control Action Plan\n(OCAP)\n3.1 Read and\ninterpret\nelectrical\ndiagrams\n3.2 Apply\nprocedures in\nelectrical/\nelectronic\nmanuals\n3.3 Use proper\ntools for a\nspecific task\n3.4 Detect\nabnormality or\nnon-\nconformance\n3.5 Install\nelectrical/\nelectronic\nparts on\nmachine\n4. Carryout\nmachine\nparameters\nsetting\n\n4.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n4.2 Electrical/Electronic\nmachine parameters are\nsetup according to\nproduction\nspecifications/work\n4.1 Safety procedures and\nstandards in machine\nparameters setting\n4.2 Awareness on safety\noperation of production\nline machines\n4.3 Electrical/Electronic\nmachine parameters\nsetup\n4.1 Follow safety\nprocedures\n4.2 Set machine\nparameters\n4.3 Read gauges\n\n--- PDF PAGE 63 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 59\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\ninstructions\n4.3 Electrical/Electronic\nmachine parameters are\nchecked according to\nproduction\nspecifications/work\ninstructions\n4.4 Readings of different\ngauges\n4.5 Awareness on setup\ncriteria\n4.6 Awareness on applicable\nOut of Control Action Plan\n(OCAP)\n5. Perform\nproduction\nsetup buyoff\n5.1 Safety procedures are\nfollowed according to\noccupational safety and\nhealth (OSH) standards\n5.2 Outputs using dummy\nunits, if applicable, are\nchecked according to\nproduct criteria\n5.3 Initial production outputs\nare checked according to\nproduct criteria\n5.4 Completeness and\naccuracy of documents are\nchecked in accordance to\nsetup/conversion\nspecifications\n5.1 Safety procedures and\nstandards in production\nsetup buyoff\n5.2 Knowledge in machine\noperations\n5.3 Knowledge in product\ncriteria\n5.4 Understanding of data log\nresults\n5.5 Product handling\n5.6 Documentation\nprocedures\n5.7 Awareness on applicable\nOut of Control Action Plan\n(OCAP)\n5.1 Observe\nsafety\nprocedures\n5.2 Operate\nmachine being\nsetup\n5.3 Document\ndata log\nresults\n5.4 Product\nhandling\n\n--- PDF PAGE 64 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 60\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools may include but not limited to:\n\nMechanical\n1.1\nSet of Allen keys\n1.2\nSet wrenches\n1.3\nTweezers\n1.4\nTorque driver\n1.5\nLevel gauge\n1.6\nSteel rule/measuring tape\n1.7\nPuller\n1.8\nHammer/mallet\n1.9\nFeeler gauge\n1.10 Vernier/micrometer caliper\n1.11 Peak tester\n\nElectrical\n1.1 Set of screwdrivers\n1.2 Set of pliers\n1.3 Soldering iron\n1.4 Crimper\n1.5 Cutter\n1.6 Electrical knife\n1.7 Cable ties\n1.8 Electrical tape\n\n2. Equipment\nEquipment may include but not limited to:\n2.1 Laptop\n2.2 Oscilloscope\n2.3 VOM\n2.4 Power meter\n2.5 Temperature profile checker\n2.6 Charge plate monitor\n2.7 Infra-red (IR) camera\n2.8 Vibration analyzer\n2.9 Noise checker/ ultrasonic tester\n3. Mechanical parts\nMay include but not limited to:\n2.1. Pneumatic parts\n2.2. Hydraulic parts\n2.3. Pumps\n2.4. Fabricated parts\n2.5. OEM / Catalogue parts\n4. Appropriate personnel\nMay include:\n3.1\nManager\n3.2\nEngineer\n3.3\nSupervisor\n3.4\nLead technician\n\n5. Product criteria\n4.1\nVisual check\n4.2\nPhysical check\n4.3\nMechanical check\n4.4\nElectrical check\n4.5\nDimension check\n4.6\nFunction check\n\n--- PDF PAGE 65 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 61\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared tools, equipment and conversion kit\n1.2\nCarried out machine mechanical setup/conversion\n1.3\nCarried out machine electrical/electronic setup/\nconversion\n1.4\nCarried out machine parameters setting\n1.5\nPerformed production setup buyoff\n2. Resource Implications\nThe following resources MUST be provided:\n2.1\nAppropriate machine and equipment\n2.2\nTools (as indicated in the Range of Variables)\n2.3\nMaterials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nLaptop\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n3.2\nWritten Test\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\nNote: For assessment - Behavioral indicator should be observed for each task being performed.\n\n--- PDF PAGE 66 ---\n--------------------------------------------------------------------------------------------------------------------