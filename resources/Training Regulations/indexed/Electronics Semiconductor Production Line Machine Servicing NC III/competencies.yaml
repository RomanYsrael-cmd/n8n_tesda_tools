\n2.11 Tension meter\n3. Problem solving\nand analysis tools\n\nProblem solving and analysis tools may include:\n3.1\nRoot cause analysis\n3.2\n5 Why analysis\n3.3\nFish bone analysis\n3.4\nEquipment failure mode and effect analysis (EFMEA)\n4. Troubleshooting\nmethods\nTroubleshooting methods may include but not limited to:\n4.1\nSensory method (sight, sound, touch, smell)\n4.2\nSubstitution method/swapping\n4.3\nSignal injection and tracing\n4.4\nVoltage-current measurement\n4.5\nContinuity testing\n4.6\nResistance check\n4.7\nProgram/software diagnostics\n4.8\nMechanical measurement (e.g clearance, planarity, height)\n5. Electromechanical\nparts\nMay include but not limited to:\n5.1\nPneumatic parts\n5.2\nHydraulic parts\n5.3\nPumps\n\n--- PDF PAGE 74 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 70\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared tools and/or instruments\n1.2\nCarried out machine mechanical/electrical\ntroubleshooting\n1.3\nCarried out machine mechanical/ electrical adjustment\nand repair\n1.4\nCarried out new parameter setting\n1.5\nTest-run and monitored machine\n2. Resource Implications The following resources MUST be provided:\n2.1\nAppropriate machine and equipment\n2.2\nTools (as indicated in the Range of Variables)\n2.3\nMaterials\n2.4\nWork Instructions Assessment rating sheet\n2.5\nSample production checklist\n2.6\nApplicable forms for specific equipment or machines\n2.7\nProcedure and quality manuals\n2.8\nLaptop\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\nDemonstration/Observation with oral questioning\n3.2\nWritten Test\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the work place 