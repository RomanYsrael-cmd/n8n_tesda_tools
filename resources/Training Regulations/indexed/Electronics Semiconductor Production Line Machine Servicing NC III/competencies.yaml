          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare \ntroubleshooting/ \nrepair tools \nand/or \ninstruments \n1.1 Safety procedures are \nfollowed according to \nOccupational Safety and \nHealth (OSH) Standards. \n1.2 Appropriate tools and/or \ninstruments are prepared \nto be used in the repair. \n1.3 Tools and/or instruments \nare confirmed to be \ncalibrated and in good \ncondition. \n1.1 Safety procedures and \nstandards in machine \nsettings and calibration \n1.2 Familiarity with \nproduction line tools \nand/or instruments and \ntheir location \n1.3 Understanding \nmachine manuals, \nprocedures, work \ninstructions and other \napplicable documents/ \nspecifications \n1.1 Safety \npractice skills \n1.2 Reading skills \n1.3 Communicati\non skills \n1.4 Detect \nabnormality \nor non-\nconformance \n2. Carry out \nmachine \nmechanical/ \nelectrical/ \nelectronic/ \nprogram \ntroubleshooting \n2.1 Safety procedures are \nfollowed according to \nOccupational Safety and \nHealth (OSH) Standards. \n2.2 Machine troubles or \nsymptoms are analyzed \nand probable source of \nproblems are identified  \n2.3 Different problem solving \nand analysis tools are \napplied based on machine \ncondition \n2.4 Tests are conducted on \nsuspected machine parts, \nunits or modules based on \nmachine standard \ncondition \n2.5 Defective machine/ \nelectrical parts are \nidentified and located \nusing appropriate \ntroubleshooting \nmethods according to \nmachine/ electrical \ntroubleshooting manual. \n2.1 Safety procedures and \nstandards in \nmechanical/ electrical/ \nelectronic \ntroubleshooting \n2.2 Machine troubles or \nsymptoms \n2.3 Machine \ntroubleshooting \nmethods  \n2.4 Knowledge in use of \nmeasuring instruments \n2.5 Basic knowledge on \nelectronic components \n2.6 Basic PLC symbols, \ndiagrams and \nsequences \n2.7 Basic Motor control \nsystem \n2.8 Sensor technology \n2.9 Different problem \nsolving and analysis \ntools \n2.1 Troubleshooti\n