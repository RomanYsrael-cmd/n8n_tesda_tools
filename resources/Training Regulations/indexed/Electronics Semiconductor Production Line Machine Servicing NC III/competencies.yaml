\nto the supervisor \n3.1. Safety requirements in \nusing electronics hand \ntools and test equipment  \n3.2. Electronics hand tools \nfor adjusting, \ndismantling, assembling, \nfinishing, and cutting. \n3.3. Processes, Operations, \nSystems \n3.3.1. Proper usage and \ncare of hand tools \n3.3.2. Types and uses of \ntest equipment \n3.4. Common faults in the \nuse of hand tools\n3.1. Reading skills \nrequired to \ninterpret work \ninstruction and \nnumerical skills \n3.2. Using PPE \nproperly \n3.3. Problem \nsolving in \nemergency \nsituation \n4. Maintain \nhand tools  \n4.1. Tools are handled without \ndamage according to \nprocedures. \n4.2. Routine maintenance of tools \nis undertaken according to \nstandard operational \nprocedures, principles and \ntechniques \n4.3. Tools are stored safely in \nappropriate locations in \naccordance with \nmanufacturer’s specifications \nor standard operating \nprocedures \n4.1. Safety requirements in \nmaintenance of hand \ntools   \n4.2. Processes, Operations, \nSystems \n4.2.1. Maintenance of \ntools \n4.2.2. Storage of hand \ntools \n \n4.1. Checking and \ncleaning hand \ntools \n4.2. Storing hand \ntools properly\n\n--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Electronics/Semiconductor Production Line Machine Servicing NC III      Promulgated December 18, 2017        31  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hand tools \n1.1. Hand tools for adjusting, dismantling, assembling, \nfinishing, cutting. Tool set includes the following but \nnot limited to: screw drivers, pliers, punches, \nwrenches, files \n2. Personal Protective \nEquipment (PPE) \n2.1. Gloves \n2.2. Protective eyewear \n2.3. Apron/overall \n3. Maintenance \n3.1. Cleaning \n3.2. Lubricating \n3.3. Tightening \n3.4. Simple tool repairs \n3.5. Hand sharpening \n3.6. Adjustment using correct procedures \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n \n1.1. Demonstrated safe working practices at all times \n1.2. Communicated information about processes, \nevents or tasks being undertaken to ensure a \nsafe and efficient working environment \n1.3. Planned tasks in all situations and reviewed task \nrequirements as appropriate \n1.4. Performed all tasks to specification \n1.5. Maintained and stored tools in appropriate \nlocation \n2. Method of assessment \nCompetency in this unit must be assessed through: \n2.1. Observation \n2.2. Oral questioning \n3. Resource Implication \n3.1. Tools may include the following but not limited to: \n3.1.1. screw drivers  \n3.1.2. pliers \n3.1.3. punches  \n3.1.4. wrenches, files  \n4. Context of Assessment \n \n4.1. Assessment may be conducted in the workplace \nor in a simulated   environment\n",
