justment of hydraulic parts and\nsystems\n• Machine adjustments or\nreplacement\n• Perform Machine\nadjustments or\nreplacement\no Electronic/Electrical\n Boards, sensors,\nrelays, fuses,\nswitches, etc.\no Mechanical\n Timing belt,\ngears, screws,\nalignments,\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n24 hours\n\n• Supervised\nIndustry\nTraining (SIT)\n\n24 hours\n\n--- PDF PAGE 105 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 101\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\no Electronic/Electrical\n Boards, sensors, relays,\nfuses, switches, etc.\n Motor control\no Mechanical\n Timing belt, gears, screws,\nalignments, fluids/lubricants,\ncooling and heating system,\netc.\n Pneumatic and hydraulic\nsystem\no Software\n Parameters, programs,\nsettings, etc.\n• Readings of different gauges.\nfluids/lubricants,\ncooling and\nheating system,\netc.\no Software\n Parameters,\nprograms,\nsettings, etc.\n• Check completeness\nof repaired assembly\n• Completeness of\nscrews, fasteners,\nharnessing, etc.\n• Apply 5S principles\n\n3.4 Carry out new\nparameter\nsettings\n•\nSafety procedures and\nstandards in machine\nparameters setting\n•\nElectrical/Electronic machine\nparameters setup\n•\nMachine setup criteria\n• set new machine\nparameters\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n4 hours\n\n• Supervised\nIndustry\nTraining (SIT)\n\n16 hours\n\n3.5 Test-run and\nmonitor\nmachine\n• Machine safety features