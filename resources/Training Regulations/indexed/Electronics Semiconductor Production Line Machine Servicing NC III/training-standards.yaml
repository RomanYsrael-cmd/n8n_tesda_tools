place\nprocesses\n• Read\n• Lecture\n• Written Test\n2 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Lecture\n• Written Test\n\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Demonstration\n• Practical\nexercises\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Demonstration\n• Role Play\n• Observation\n\n1.2 Lead workplace\ndiscussions\n• Describe:\no Organizational policy on\nproduction, quality and safety\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\no Goals/ objectives and action plan\nsetting\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n• Prepare/set action plans based on\norganizational goals and objectives\n• Demonstration\n• Observation\n\n1.3 Identify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing\nwith issues and problems\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n--- PDF PAGE 81 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 77\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n\n• Demonstration\n• Role Play\n• Observation\n\n2. Lead small\nteam\n2.1 Provide team\nleadership\n• Describe:\no Company policies and procedures\n•