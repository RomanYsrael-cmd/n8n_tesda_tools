eventive maintenance standards\nand procedures\n• Machine preventive maintenance\nmanuals\n• Machine mechanical/ electrical\nadjustment/ calibration and\nparameter fine tuning\n• Machine specifications and\noperation\n• Review adjustment/\ncalibration and\nparameter fine tuning\nof the machine\n• Review machine\noperation performance\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n4 hours\n\n• Supervised\nIndustry\nTraining (SIT)\n\n8 hours\n\n4.3. Carryout\nmachine\npreventive\nmaintenance\nand calibration\n• Safety procedures and standards\nin preventive maintenance and\ncalibration\n• Mechanical and electronic\nmachine parts\n• Preventive Maintenance check\nsheet items\n• Preventive Maintenance\nprocedures and machine\nspecifications\n• Calibration procedures\n• Mechanical drawings and\n• Perform parts\nreplacement using\nmechanical drawings\nand electrical\ndiagrams as reference\n• Tag and label machine\nparts\n• Carry-out PM and\ncalibration to meet\nacceptance criteria\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n40 hours\n\n• Supervised\nIndustry\nTraining (SIT)\n\n16 hours\n\n--- PDF PAGE 107 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 103\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Contents\nPractical Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\nelectrical diagrams interpretation\n• Calibration and diagnostic\ninstruments\n\n4.4. Buyoff machine\ncondition after\nmaintenance\n• Machine safety features and\nstandards\n• Product and machine acceptance\ncriteria\n• Familiarization of data log results\n• Proper product handling\n• Documentation procedures\n\n• Activate machine\nsafety features\n• Perform machine\nbuyoff\n• Checking initial\nproduct outputs\n• Validate machine data\n• Update machine\nrecords\n• Turn-over machine to\nproduction\n• Lecture\n• Discussion\n• Hands-on/\nDemonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n8 hours\n\n• Supervised\nIndustry\nTraining (SIT)\n\n8 hours\n\n--- PDF PAGE 108 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 104\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS) which contain both in-school and in-industry\ntraining or fieldwork components. Details can be referred to the\nImplementing Rules and Regulations of the DTS Law and the TESDA\nGuidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as laboratory\nor field-work components.\n\n--- PDF PAGE 109 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 105\n\n2.2.\nEnterprise-Based:\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training\nthe apprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3.\nCommunity-Based:\n\n• Community-Based Training – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have any of the following requirement:\no be at least a graduate of 2-yrs. Technical course related in electronics,\nelectrical and/or mechanical area\no have at least 2-yrs. relevant industry work experience in electronics,\nsemiconductor, electrical and/or mechanical manufacturing area\n•\nAble to communicate orally & in writing both in English and Pilipino\n•\nAble to perform basic mathematical computations\n\nThis list does not include specific institutional requirements, such as height\nand age requirements, educational attainment, appropriate work experience and\nothers that may be required from the trainees by the school or training center\ndelivering the TVET program.\n\n--- PDF PAGE 110 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 106\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Electronics/Semiconductor Production Line Machine Servicing NC III:\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\nMechanical tools\n\nMechanical parts\n 25 set\nAllen keys\n 5 units\nLaptop\n1 lot\nPneumatic parts\n 25 set\nWrenches\n1 unit\nOscilloscope\n1 lot\nHydraulic parts\n 25 pcs\nTweezers\n1 unit\nPower meter\n1 lot\nPumps\n5 pcs\nTorque driver\n5 units\nTachometer\n1 lot\nFabricated parts\n 5 pcs\nLevel gauge\n 1 unit\nTemperature profile\nchecker\n1 lot\nOEM/Catalogue parts\n 5 pcs\nGrease gun\n1 unit\nCharge plate monitor\n\n5 pcs\nPuller\n1 unit\nInfra-red (IR) camera\nElectronic parts\n 5 pcs\nHammer/mallet\n 1 unit\nVibration analyzer\n1 lot\nSwitches\n 5 pcs\nVernier/ micrometer\ncaliper\n1 unit\nNoise checker/\nultrasonic tester\n1 lot\nSensors\n 5 pcs\nFiller gauge\n5 units\nTension meter\n1 lot\nRelays\n 5 pcs\nPeak tester\n5 units\nClamp ammeter\n1 lot\nAmplifiers\n5 set\njigs\n1 set\nPLC training module\n1 lot\nfuses\n 25 pcs\nSteel rule/\nmeasuring tape\n1 set\nPneumatic training\nmodule\nConsumable parts\n 5 pcs\nAir brush/gun\n1 set\nHydraulic training\nmodule\n 1 lot\nBolts, nuts and\nscrews\n5 pcs\nStop watch\n1 unit\ncompressor\n1 lot\nBushings\n\nAs\nprescribed\nElectronics/Semi-\nconductor production\nline equipment*\n1 lot\nLinear bearings\nElectrical tools\nPPE\n\n1 lot\nGrounding wires\n 25 set\nScrewdrivers\n25 pcs.\nSafety helmet\n1 lot\nLubricants\n 25 set\nPliers\n25 pairs\nSafety shoes\n1 lot\nSprings\n25 pcs\nSoldering iron and\nlead\n25 pcs.\nSafety glasses/\ngoggles\n1 lot\ngaskets\n5 pcs\nCrimper\n25 pcs.\nSafety harness\n1 lot\nCable ties\n25 pcs\nCutter\n25 pcs.\nEar plugs/ear muffs\n25 rolls\nElectrical tape\n25 pcs\nElectrical knife\n25 pcs.\nGas mask.\n1 lot\nTerminal plugs\n5 pcs\nVOM / DVM\n25 pairs\nCotton gloves\n* TVET provider may tie up with electronics/semiconductor manufacturing firm/s to have access to the prescribed\nequipment through a Memorandum of Agreement (MOA).\n\n--- PDF PAGE 111 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 107\n\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nLaboratory/Production Area\n5 x 8\n40\n1\n40\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n2 x 2\n4\n2\n8\nTotal\n128\nFacilities / Equipment / Circulation**\n38\nTotal Area\n162\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\nNOTE: Access to and use of equipment /facilities can be provided through company/\nenterprise arrangements or MOA with other partner- electronics/semiconductor\nplants/companies.\n\n3.6 TRAINER’S QUALIFICATIONS\n\nElectronics/Semiconductor Production Line Machine Servicing NC III\n\n•\nBe a holder of NTTC I in Electronics/Semiconductor Production Line\nMachine Servicing NC III;\n•\nMust have at least two (2) years relevant industry experience in the current\nfield of machine servicing.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. The institutional assessment is administered by the\ntrainer/assessor.\n\nThe result of the institutional assessment may be considered as evidence for\nthe assessment for national 