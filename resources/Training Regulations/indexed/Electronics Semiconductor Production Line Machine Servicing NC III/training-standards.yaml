  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Electronics/Semiconductor Production Line Machine\nServicing NC III.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title :\nElectronics/Semiconductor Production Line Machine Servicing\nNC Level\n:\nNC III\n\nNominal Training Duration:\n58 hrs – Basic Competencies\n\n52 hrs – Common Competencies\n\n 464 hrs – Core Competencies\n[including 240 hrs – Supervised Industry\nTraining (SIT)]\n\n -------------------------------------------------\n\n 574 hrs - Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan Electronics/Semiconductor Production Line Machine Technician, in accordance with\nindustry standards. It covers the basic & common competencies in addition to the core\ncompetencies such as performing machine setup/conversion, monitoring machine\nperformance, performing machine troubleshooting and repair as well as performing\npreventive maintenance and calibration.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 80 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 76\n\nBASIC COMPETENCIES\n(58 hours)\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace\nprocesses\n• Read\n• Lecture\n• Written Test\n2 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Lecture\n• Written Test\n\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Demonstration\n• Practical\nexercises\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Demonstration\n• Role Play\n• Observation\n\n1.2 Lead workplace\ndiscussions\n• Describe:\no Organizational policy on\nproduction, quality and safety\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\no Goals/ objectives and action plan\nsetting\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n• Prepare/set action plans based on\norganizational goals and objectives\n• Demonstration\n• Observation\n\n1.3 Identify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing\nwith issues and problems\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n--- PDF PAGE 81 ---\n----------------------------------------------------------------------------------------------------------------------------------------------------------------------------