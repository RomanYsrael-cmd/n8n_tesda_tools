    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title :\nElectronics/Semiconductor Production Line Machine Servicing\nNC Level\n:\nNC III\n\nNominal Training Duration:\n58 hrs – Basic Competencies\n\n52 hrs – Common Competencies\n\n 464 hrs – Core Competencies\n[including 240 hrs – Supervised Industry\nTraining (SIT)]\n\n -------------------------------------------------\n\n 574 hrs - Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan Electronics/Semiconductor Production Line Machine Technician, in accordance with\nindustry standards. It covers the basic & common competencies in addition to the core\ncompetencies such as performing machine setup/conversion, monitoring machine\nperformance, performing machine troubleshooting and repair as well as performing\npreventive maintenance and calibration.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 80 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 76\n\nBASIC COMPETENCIES\n(58 hours)\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace\nprocesses\n• Read\n• Lecture\n• Written Test\n2 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Lecture\n• Written Test\n\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Demonstration\n• Practical\nexercises\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Demonstration\n• Role Play\n• Observation\n\n1.2 Lead workplace\ndiscussions\n• Describe:\no Organizational policy on\nproduction, quality and safety\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\no Goals/ objectives and action plan\nsetting\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n• Prepare/set action plans based on\norganizational goals and objectives\n• Demonstration\n• Observation\n\n1.3 Identify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing\nwith issues and problems\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n--- PDF PAGE 81 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 77\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n\n• Demonstration\n• Role Play\n• Observation\n\n2. Lead small\nteam\n2.1 Provide team\nleadership\n• Describe:\no Company policies and procedures\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Identify client expectations\n• Lecture\n• Written examination\n\n• Practice team building skills\n• Demonstration\n• Observation\n\n• Perform exercises on communication\nskills required for leading teams\n• Demonstration\n• Role Play\n• Observation\n\n2.2 Assign\nresponsibilities\n• Describe:\no Team member’s duties and\nresponsibilities\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n\n• Identify client expectations\n• Lecture\n• Written examination\n\n• Practice negotiating skills\n• Demonstration\n• Observation\n\n• Perform group exercises showing the\nskills and techniques in promoting\nteam building\n\n• Demonstration\n• Role Play\n• Observation\n\n2.3 Set performance\n\nexpectations for\nteam members\n• Describe:\no Team member’s duties and\nresponsibilities\n• Group\ndiscussion\n• Oral evaluation\n2 Hour\n\no How performance expectations are\nset\n\n• Identify client expectations\n• Lecture\n• Written examination\n\n• Perform group exercises in setting\nindividual target/ expectation\n• Demonstration\n•\nRole Play\n• Observation\n\n• Read instruction and requirements in\nup to date dissemination to members\n\n• Lecture\n• Written examination\n\n--- PDF PAGE 82 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 78\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.4 Supervise team\nperformance\n• Describe listening and treating\nindividual team members concern\n• Group\ndiscussion\n• Oral evaluation\n2 Hour\n\n• Identify methods of Monitoring\nPerformance\n• Lecture\n• Written examination\n\n• Perform group exercises showing the\nskills in monitoring team performance\n\n• Demons