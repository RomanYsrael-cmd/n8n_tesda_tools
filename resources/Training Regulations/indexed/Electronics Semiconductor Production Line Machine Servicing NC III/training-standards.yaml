tton gloves\n* TVET provider may tie up with electronics/semiconductor manufacturing firm/s to have access to the prescribed\nequipment through a Memorandum of Agreement (MOA).\n\n--- PDF PAGE 111 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 107\n\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nLaboratory/Production Area\n5 x 8\n40\n1\n40\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n2 x 2\n4\n2\n8\nTotal\n128\nFacilities / Equipment / Circulation**\n38\nTotal Area\n162\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\nNOTE: Access to and use of equipment /facilities can be provided through company/\nenterprise arrangements or MOA with other partner- electronics/semiconductor\nplants/companies.\n\n3.6 TRAINER’S QUALIFICATIONS\n\nElectronics/Semiconductor Production Line Machine Servicing NC III\n\n•\nBe a holder of NTTC I in Electronics/Semiconductor Production Line\nMachine Servicing NC III;\n•\nMust have at least two (2) years relevant industry experience in the current\nfield of machine servicing.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. The institutional assessment is administered by the\ntrainer/assessor.\n\nThe result of the institutional assessment may be considered as evidence for\nthe assessment for national 