      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of Electronics/Semiconductor Production Line Machine Servicing NC III, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III signed by the TESDA Director General. 4.1.2. The qualification of Electronics/Semiconductor Production Line Machine Servicing NC III may be attained through demonstration of competence through project-type assessment covering all the units required in the qualification. 4.1.3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4. Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency. 4.1.5. Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/ assessment process. 4.1.6. The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. These include the following: a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements 4.1.7. The guidelines on assessment and certification are discussed in detail in the “Operating Procedures on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The Self-Assessment Guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior 4.2.2 Accredited Assessment Center. Only assessment center accredited by TESDA is authorized to manage the assessment activities of candidates for national certification. 4.2.3 Accredited Competency Assessor. Only competency assessor accredited by TESDA is authorized to assess the competencies of candidates for national certification."
    }
  ],
  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1. To attain the National Qualification of Electronics/Semiconductor\nProduction Line Machine Servicing NC III, the candidate must\ndemonstrate competence in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate III signed by the TESDA\nDirector General.\n\n4.1.2. The qualification of Electronics/Semiconductor Production Line Machine\nServicing NC III may be attained through demonstration of competence\nthrough project-type assessment covering all the units required in the\nqualification.\n\n4.1.3. Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.1.4. Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the relevant unit/s of competency.\n\n4.1.5. Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.1.6. The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. These include the\nfollowing:\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements\n\n4.1.7. The guidelines on assessment and certification are discussed in detail in the\n“Operating Procedures on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n--- PDF PAGE 113 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 109\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The Self-Assessment Guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only assessment center accredited by\nTESDA is authorized to manage the assessment activities of candidates\nfor national certification.\n\n4.2.3 Accredited\nCompetency\nAssessor.\nOnly\ncompetency\nassessor\naccredited by TESDA is authorized to assess the competencies of\ncandidates for national certification.\n\n--- PDF PAGE 114 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Electronics/Semiconductor Production Line Machine Servicing NC III Promulgated December 18, 2017 110\n\n"
