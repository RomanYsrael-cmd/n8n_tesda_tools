      "definition": "- an examination to determine the condition of the hair prior to a hair treatment Aniline Derivative Tints - are also known as penetrating tints, synthetic, organic tints and peroxide or oxidation tints and are commonly called tints in the industry Back Combing - combing the short hair toward the scalp while the hair strand is held in a vertical position also called teasing Barbering - should be done at eye level starting at the hairline. A method used in cutting the hair closed to the scalp and refer to as scissor over comb Baseline - the first/foundation line to be cut which subsequent sections are cut to Basic Hairshaping - Shaping the hair that is not too long or too short to different head shape Bleaching - removing the natural pigmentation Blunt cutting - all hair strands must direct at the same point. The hair appears to be the same length Bob - a level haircut above the shoulders Braid - to weave interlace or entwine together Chemical damage - damage to the hair fibre through the overuse of chemicals such as permanent waves, colour, hydrogen peroxide, ammonia Clippers - are like electric razors mostly used to smoothen the back of the neck Coiffure - an arrangement or dressing of the hair Cold waving - a system of permanent waving involving the use of chemicals, without the application of heat Color Fillers - are used if the hair is in damaged condition and there is doubt that the color result will be an even shade Color stripping - removing artificial color by bleaching or chemical color stripper Color test/tint - a method of determining the action of color on a small strand of hair Conditioner - creams, waxes and oils which help protect and maintain the health and condition of the hair Conditioning - the application of special chemical agents to the hair to help restore its strength and give it body in order to protect it against possible breakage Contour winding - a loose wave, winding the perm rods to the contour of the head - shape Cuticle - the outer layer of the hair; the hard skin at the base of the fingernail Design - a plan or arrangement of a hairstyle Diffuser - an attachment on a blow dryer that “shatters’ the flow of air so that the hair can be soft styled Dye - to color or stain the hair with tint"
