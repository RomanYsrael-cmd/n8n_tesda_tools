oo and Conditioner to put protein back into the hair. You should leave the treatment in your hair for approximately 5 minutes before using your conditioner. You’ll be able to find a treatment designed for your hair type. Trichologist - a person trained in the science of caring for the hair Trichology - the study of the structure and functions of the hair Vent brush - a brush with widely spaced plastic bristles designed to be used while blow drying Wig - An artificial covering for the head consisting of a newtwork of interwoven hair"
