        "source_text": "HCS516201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in building and maintaining an effective\nrelationship with clients, customers and the public.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Maintain professional\nimage\n\n1.1\nUniform and personal grooming maintained to\nassignment requirements\n1.2\nPersonal presence maintained according to\nemployer standards\n1.3\nVisible work area kept tidy and uncluttered in\naccordance with company procedures\n1.4\nEquipment stored according to assignment\nrequirements\n2. Meet client/customer\nrequirements\n2.1\nClient requirements identified and understood by\nreferral to the assignment instructions\n2.2\nClient requirements met according to the\nassignment instructions\n2.3\nChanges to client’s needs and requirements\nmonitored and appropriate action taken\n2.4\nAll communication with the client or customer is\nclear and complies with assignment requirements.\n2.5\nClients are made comfortable and relaxed before,\nduring and after service\n3. Build credibility with\ncustomers/clients\n3.1\nClient expectations for reliability, punctuality and\nappearance adhered to\n3.2\nPossible causes of client/customer dissatisfaction\nidentified, dealt with and recorded according to\nemployer policy\n3.3\nClient fully informed of all relevant security matters\nin a timely manner and according to agreed\nreporting procedures\n\n--- PDF PAGE 19 ---\nTR - Hairdressing NC II\nAmended November 2010\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal Presence\nMay include:\n1.1\nStance\n1.2\nPosture\n1.3\nBody Language\n1.4\nDemeanour\n1.5 Grooming\n\n2. Employer Standards\nMay include:\n2.1\nStanding Orders\n2.2\nCompany Policies and Procedures\n\n3. Client Requirements\nMay include:\n3.1\nAssignment Instructions\n3.2\nPost Orders\n3.3\nScope to modify instructions/orders in light of\nchanged situations\n\n4. Assignment Instructions\nMay be conveyed:\n4.1\nIn Writing\n4.2\nVerbally\n4.3\nElectronically\n\n5. Client’s Needs and\nRequirements\nMay be determined by:\n5.1\nReview of the client brief and/or assignment\ninstructions\n5.2\nDiscussion with the client/customer\n\n6. Appropriate Action\nMay include:\n6.1\nImplementing required changes\n6.2\nReferral to appropriate employer personnel\n6.3\nClarification of client needs and instructions\n\n7. Customers\nMay include:\n7.1\nAll members of the public\n\n--- PDF PAGE 20 ---\nTR - Hairdressing NC II\nAmended November 2010\n16\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained professional image\n1.2\nInterpreted client/customer requirements from information\ncontained in the client brief and/or assignment instructions\n1.3\nDealt successfully with a variety of client/customer interactions\n1.4\nMonitored and acted on changing client or customer needs\n1.5\nMet client/customer requirements\n1.6\nBuilt credibility with customers/clients\n2. Underpinning\nknowledge and\nattitudes\n2.1\nUniform and personal grooming requirements of the employer\nand the client\n2.2\nOccupational Health and safety requirement for the assignment\n2.3\nAssignment Instructions\n3. Underpinning skills\n3.1\nAttention to detail when completing client/employer\ndocumentation\n3.2\nInterpersonal and communication skills required in client\ncontact assignments\n3.3\nCustomer service skills required to meet client/customer needs\n3.4\nPunctuality\n3.5\nCustomer Service\n3.6\nTelephone Technique\n3.7\nProblem Solving and Negotiation\n3.8\nMaintaining Records\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’ instructions (if\nrelevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\nAssessment activities are carried out through TESDA\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in the\nelements, performance criteria and range of variables\nstatement that make up this unit.\n6.5\nContinuous assessment in the workplace, taking into account\nthe range of variables affecting performance.\n6.6\nSelf-assessment on the same terms as those described above.\n6.7\nSimulated assessment or critical incident assessment, provided\nthat the critical incident involves assessment against\nperformance criteria and an evaluation of underpinning\nknowledge and skill required to achieve the required\nperformance criteria.\n\n--- PDF PAGE 21 ---\nTR - Hairdressing NC II\nAmended November 2010\n17\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\nUNIT CODE\n:"
