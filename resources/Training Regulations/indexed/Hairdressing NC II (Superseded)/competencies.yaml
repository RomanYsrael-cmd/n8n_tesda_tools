          "source_text": "1.  Prepare client \n1.1 \nAppropriate courtesy is extended to the client at all \ntimes \n1.2 \nShape of the client’s face, head, length and width \nare assessed according to his/her built and height \n1.3 \nTexture of hair  is analyzed according to style \nrequirements and kind of cutting to be administered \n1.4 \nHair catalog is presented to the client and the hair \ncut style is selected and agreed upon by both \nparties  \n1.5 \nProtective clothing is provided and  used according \nto health and sanitation regulations \n1.6 \nHair is shampooed and/or conditioned following \nsalon procedures \n2.  Cut hair \n2.1 \nAppropriate materials, tools and hair implements \nare prepared and used according to client’s desired \nhaircut and OH&S requirements \n2.2     Haircut is performed according to haircut style and \nestablished or acceptable procedures \n2.3    Client’s safety and comfort are ensured during the \nentire process \n2.4    Where necessary, first-aid treatment is provided to \nthe client or referred to health personnel \n3.  Check hair and apply \nappropriate finishing \ntouches \n3.1 \nHair is blow-dried and checked for accuracy and \nfinishing touches \n3.2    Finishing cutting tools are used according to \nhaircut style \n3.6 \nHair finishing product is applied as per client’s \nrequirements and style \n3.4    Client’s acceptance is confirmed and adjustments \nare made if required \n \n4.  Perform post service \nactivities \n4.1 \nClient is advised on proper hair care and \nmaintenance  \n4.2 \nTools, implements and equipments are cleaned, \nsterilized and stored in accordance with salon policy \n4.3 \nWaste items are properly disposed of in accordance \nwith OH&S required practice \n4.4 \nWorking area is cleaned in preparation for the next \nclient\n\n--- PDF PAGE 45 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n41 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Protective clothing \n1.1   Towels \n1.2   Apron \n1.3   Cape \n4 \nHair Catalog  \n2.1     Men’s Cut Catalog \n2.2     Ladies Cut Catalog \n2.3     Kid’s Cut Catalog \nHair Cut Styles  \n3.1     Straight Cut                        \n3.1.1 \nLong straight cut            \n3.1.2 \nShort straight cut            \n3.2     Layered Cut                                \n3.2.1 \nLong layered cut            \n3.2.2 \nShort layered cut \n3.3     Graduated Layers \n4.  Hair Texture \n4.1    Fine       \n4.2    Medium  \n4.3    Coarse \n4.4    Wiry \n5.   Shape of face \n5.1 \nRectangle or Elongated \n5.2 \nInverted/Pear \n5.3 \nHeart \n5.4 \nOval \n5.5 \nTriangular \n5.6 \nSquare \n5.7 \nDiamond \n5.8 \nRound \n6 \nMaterials, Tools and \nImplements  \n7.1 \nSupplies/Materials \n7.1.1 \nPowder \n7.1.2 \nBlade \n7.2 \nImplements \n7.2.1 \nClamps \n7.2.2 \nClips \n7.3 \nTools \n7.4.1. \nBlower \n7.4.2. \nSpray Gun \n7.4.3. \nHair brush \n7.4.4. \nBarber brush \n7.4.5. \nComb   \n6.  Established or \nacceptable procedures \nin haircutting \nMay include but are not limited to: \n6.1 Shampoo hair and towel dry \n6.2   Section hair according to haircut style \n6.3   Apply cutting technique and style to achieve desired \nhaircut \n7.  Finishing Cutting Tools \n7.1   Thinning Scissor \n7.2    Cutting Scissor \n7.3    Razor \n7.4    Clippers \n8. Hair Finishing Products 8.1 \nGel/Styling gel \n8.2 \nMousse \n8.3 \nSpray Net/Hair spray \n8.4 \nHair Polish/hair serum \n8.5 \nHair Wax (wet and dry)\n\n--- PDF PAGE 46 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n42"
