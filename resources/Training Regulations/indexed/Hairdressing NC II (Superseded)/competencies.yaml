        "source_title": "PERFORM BASIC HAIR COLORING",
        "source_text": "--- PDF PAGE 40 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n36 \nUNIT OF COMPETENCY: \nPERFORM BASIC HAIR COLORING  \nUNIT CODE                     : \nHCS515304 \nUNIT DESCRIPTOR        : This unit covers the knowledge, skills and attitudes in the \nperformance of basic hair coloring.  This involves \npreparing the client prior to treatment, the actual \napplication of coloring and post-coloring activity. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare client \n1.1 \nClient is consulted and advised on color options, \nand checked for possible skin allergies \n1.2 \nCondition of the hair and scalp are checked and \nanalyzed \n1.3    Protective clothing and materials are prepared \nand used according to OH&S requirements \n1.4 \nClient is draped following established \nprocedures to avoid stains from hair coloring \n1.5    Where necessary, client’s hair is shampooed to \nremove remaining conditioners and styling \nproducts, making sure the scalp is not scratched \n \n2. Apply hair color \n2.1 \nTools, materials, implements are prepared and \nused following OH&S requirements \n2.2 \nColor and developer are selected and mixed \naccording to client’s hair condition and length and \ndesired outcome \n2.3    Color is applied according to product specifications \nand established or acceptable procedures \n2.4    Where necessary, hair is styled according to \nclient’s particular requirements \n2.4    Client’s safety and comfort are ensured during the \nprocess   \n \n3. Perform post-service \nactivities \n3.1 \nClient is advised on hair care and maintenance for \ncolored/dyed hair \n3.2 \nTools, materials, implements are cleared, sanitized \nand  stored according to OH&S rules and \nregulations \n3.3    Wastes are disposed of according to OH&S \nrequirements \n3.4    Workstation is cleaned and prepared for next \nactivity\n\n--- PDF PAGE 41 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n37 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Color Options \n1.1  Penetrating Tint                       \n1.1.1 Semi - permanent              \n1.1.2  Permanent                        \n1.2  Coating Dyes            \n1.2.1  Liquid (Blackening Shampoo) \n1.2.2  Powder                         \n1.3  Temporary \n \n2. Hair condition \n2.1   Damaged \n2.2   Tinted \n2.3   Lightened \n2.4   Porous \n2.5   Dry \n2.6   Greasy or Oily \n2.7   Normal  \n3.  Scalp condition \n3.1   Dry/Oily \n3.2   Dandruff \n3.3   Greasy \n3.4   Waxy \n3.5   Scaly \n \n4. Protective clothings \nand materials \n4.1  Ear Pads \n4.2  Coloring Pads \n4.3   Towels \n4.4   Apron \n4.5   Cape \n4.6   Gloves \n \n5.   Established \nprocedures in \ndraping \nMay include but are not limited to: \n5.1 Client is draped with bath towel with horizontal  \n        edge folded 2 inches outward \n5.2   Protective material is wrapped around the neck \n5.3   Coloring cape is wrapped around the shoulder \n \n6.  Styling products \n6.1   Gel/Setting Lotion \n6.2   Hair wax (Wet and Dry) \n6.3   Hair serum \n6.4   Hair spray \n6.5   Mousse \n6.6   Leave-on conditioner\n\n--- PDF PAGE 42 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n38 \n \nVARIABLE \nRANGE \n7.  Tools, materials and \nImplements \n7.1  Tinting Brush \n7.2  Mixing Bowl \n7.3  Measuring Cap \n7.4  Timer \n7.5  Clips \n7.6  Clamps \n7.7  Blower \n7.8  Infrared \n7.9 Frosting Cap w/ Hook \n7.10 Squeezer \n7.11 Tissue \n7.12 Foil \n7.13  Cotton  \n7.14  Colorants \n7.15  Kinds of Developers (depending on the brands)    \n8.  Color Applications  \n8.1 \nFullhead Color \n8.2 \nRegrowth/retouch \n8.3 \nHighligths (Frosting, streaking, wearing, slicing) \n8.4 \nColor Correction \n8.5 \nPre – pigmentation \n9.  Established or \nacceptable \nprocedures in hair \ncoloring  \nMay include but are not limited to: \n9.1 \nSection hair \n9.2 \nSub-section hair and follow application techniques  \n9.3     Emulsify product to achieve color balance \n9.4     Check evenness of color through hair strand test and \nexpose to proper lighting following the required \ndevelopment time \n9.5 \nRinse hair thoroughly with shampoo and conditioner \n10.  Hair maintenance \nproduct \n10.1  Shampoo and conditioner for colored hair \n10.2  Finishing Product \n10.3  Hot Oil \n10.4  Hair Spa \n10.5  Styling Aids\n\n--- PDF PAGE 43 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n39 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1    Consulted client on color options and performed skin test \nprior to hair coloring \n1.2    Checked and analyzed hair condition and scalp \n1.3    Selected, prepared and used tools, materials and \nimplements according to client’s requirements and OH&S \nrequirements \n1.4    Selected and mixed color products and developer based \non client’s desired outcome and hair condition following \nproduct specifications \n1.5    Performed hair coloring following established or \nacceptable procedures and product specifications \n1.6    Ensured client’s safety and comfort during the entire \nprocess \n1.7 \nApplied appropriate measures in response to \nemergencies or unavoidable circumstances \n1.8    Performed post-service activities in accordance with  \n         standard procedures and salon policies  \n2. Underpinning \nknowledge  \n2.1 \nSkin Test (Patch test as per client safety precautions) \n2.2 \nHair Analysis (Consultation) \n2.3    Fundamentals and Principles in Hair Coloring \n2.4    Classification of Hair Coloring \n2.5 \nColor Product Knowledge \n2.6    Kinds of Developer and Their Uses \n2.7    Chemical Mixtures and Their Uses \n2.8 \nColor Development Timeline \n2.9 \nMensuration, Mixing Ratio and Proportion \n2.10 Basic Mathematics (Computation) \n2.11 Color Theory/Harmony \n2.12 Hair Texture and Condition \n2.13  Basic Color Selection \n2.14  Basic Application of Hair Coloring \n2.15 Hair Maintenance Program \n2.16  DOH -IRR and OH&S rules and regulations \n2.17  Code of Ethics \n3. Underpinning \nskills \n3.1 \nApplying hair coloring techniques \n3.2 \nApplying shampooing techniques \n3.3 \nHandling tools \n3.4 \nObserving hair sectioning \n3.5 \nProper Storage of Products and Tools \n3.6 \nDraping Procedures \n3.7 \nPerforming Skin Test Procedures \n3.8 \nObserving mixing procedures \n3.9 \nObserving code of ethics \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nModel \n4.2 \nTools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3 \nWork area/facilities \n5. Method of \nassessment \nCompetency MUST be assessed either of the following: \n5.1 \nDemonstration with Oral Questioning \n5.2 \nPortfolio \n5.3 \nThird-Party Report \n6. Context of \nassessment \nCompetency may be assessed in the workplace or TESDA \naccredited assessment center\n",
