        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client and analyzed his/her hair and scalp\ncondition\n1.2\nSelected and used appropriate supplies, materials, tools,\nequipment and implements\n1.3\nPerformed proper mixing procedures of different bleaching\nproducts according to product specifications\n1.4\nPerformed hair bleaching according to client’s requirements,\nproduct specifications and established or set procedures\n1.7 Ensured client’s safety and comfort during the entire process\n1.8\nApplied appropriate measures in response to emergencies or\nunavoidable circumstances\n1.9 Performed post-service activities according to salon policies\nand procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nHair and Scalp Analysis\n2.2\nBleaching Procedures\n2.3\nLevels of Lightening\n2.4\nMixing Procedures\n2.5\nSafety Sanitation Rules\n2.6\nCode of Ethics\n2.7\nDifferent Forms of Bleaching Products\n2.8\nDifferent Types of Developers\n2.9\nDifferent Service Options\n2.10 Types of Hair and Scalp Conditions\n2.11 DOH-IRR and OH&S Rules and Regulations\n2.12 First-aid Treatment\n3. Underpinning\nskills\n3.1\nDifferent Methods of Application\n3.2\nHair Sectioning\n3.3\nHandling of Tools and Equipment\n3.4\nUsing of Supplies and Materials\n3.5\nWaste Disposal Practice\n3.6\nDraping Procedure\n3.7\nBleaching Application\n3.8\nObserving Code of Ethics\n3.9\nApplying First-aid Treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed either of the following:\n5.1\nDemonstration with Oral Questioning\n5.2\nPortfolio\n5.3\nThird -Party Report\n\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 51 ---\nTR - Hairdressing NC II\nAmended November 2010\n47\nUNIT OF COMPETENCY:\nPERFORM HAIR STRAIGHTENING\n\nUNIT CODE :"
        },
        "source_text": "HCS515306\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in the\nperformance of hair bleaching activity. It involves the\npreparation of the client, the actual bleaching of hair and\nperforming necessary post-bleaching activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1 Client is consulted on health condition and previous\nhair chemical treatment availed\n1.2 Client is advised on possible service options and\noutcome results\n1.3\nConditions of the hair and scalp is checked and\nanalyzed\n1.4 Client is advised to remove all personal accessories\n1.5 Client is provided with protective clothing and\ngadgets following salon procedures\n1.6 Where necessary, client’s hair is shampooed without\nscratching the scalp and blow-dried\n2. Bleach hair\n2.1\nSupplies, materials, tools, equipment, and\nimplements are prepared and used according to\nOH&S requirements\n2.2\nBleaching product is mixed with right volume of\ndeveloper according to manufacturers’ instructions\nand client’s hair texture\n2.3\nHair bleaching is performed according to\nestablished or acceptable procedures and product\nspecifications\n2.4 Clients’ safety and comfort are ensured during the\n process\n2.5 Where necessary, first-aid treatment is provided to\nclient or referred to health personnel\n\n3. Perform post-service\nactivities\n3.1 Client is advised on hair care and maintenance\n3.2\nTools and equipment and implements are sanitized\nand stored after use according to salon procedures\n3.3 Wastes are disposed of according to OH&S\nrequirements\n3.4 Workstation is cleaned and prepared for next activity\n\n--- PDF PAGE 48 ---\nTR - Hairdressing NC II\nAmended November 2010\n44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health Condition\n1.1\nPregnant\n1.2\nWith skin allergies/ irritation\n1.3\nWith Asthma\n\n2. Previous Hair Chemical\nTreatment\n2.1\nStraightening\n2.2\nPerming\n2.3\nRelax\n2.4\nColoring\n2.5\nRebonding\n2.6\nHair bleaching\n\n3. Hair Conditions\n3.1\nNormal\n3.2\nDry\n3.3\nPorous\n3.4\nDamaged\n3.5\nTinted\n\n4. Scalp conditions\n4.1\nOpen wounds\n4.2\nIrritated scalp\n4.3\nDried scalp\n4.4\nOily scalp\n\n5. Protective Clothing and\nGadgets\n5.1\nNeck Strip (Cloth/tissue)\n5.2\nCape\n5.3\nTowel (White)\n5.4\nApron\n5.5\nGloves\n5.6\nEar Pads\n5.7\nDisposable Mask\n\n6. Supplies/Materials\n6.1\nBleaching Product\n6.2\nDeveloper\n6.3\nShampoo\n6.4\nConditioner\n6.5\nCling Wrap\n6.6\nAluminum foil/Paper strip\n\n--- PDF PAGE 49 ---\nTR - Hairdressing NC II\nAmended November 2010\n45\n\nVARIABLE\nRANGE\n7. Tools, Equipment,\nImplements\n7.1\nGloves\n7.2\nMixing Bowl\n7.3\nTinting Brush\n7.4\nTimer\n7.5\nClamps or Clips\n7.6\nInfrared\n7.7\nBlower\n7.8\nMeasuring Glass\n7.9\nWeighing Cup\n7.10 Hook\n7.11 Frosting Cap\n7.12 Steamer\n8. Bleaching Product\n8.1\nPowder\n8.2\nCream\n8.3\nLiquid\n9. Developers\n6% or 20 volume\n\n9% or 30 volume\n\n12% or 40 volume\n10. Bleach Mixing Ratio\n10.1 1:1\n10.2 1:1.5\n10.3 1:2\n10.4 According to manufacturers’ instruction\n11. Established or\nacceptable procedures in\nhair bleaching\nMay include but are not limited to:\n11.1 Section hair\n11.2 Apply mixed bleaching product according to\nclient’s specification\n11.3 Determine bleaching development through visual\ncheck and touch following level of lightness\naccording to desired outcome\n11.4 Check bleached for evenness from roots to ends\nall over and corrective measures are applied on\nareas with uneven results\n11.5 Rinse hair thoroughly and dry according to\nclient’s requirement\n11.6 Where necessary, apply hairstyling product on\nbleached hair and style according to client’s\ndesire\n\n12. Hair care and\nmaintenance\n12.1 Hot Oil Treatment\n12.2 Hair Spa\n12.3 Hair Reborn / Hair reconstruction\n12.4 Daily application of hair care products\n\n--- PDF PAGE 50 ---\nTR - Hairdressing NC II\nAmended November 2010\n46\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client and analyzed his/her hair and scalp\ncondition\n1.2\nSelected and used appropriate supplies, materials, tools,\nequipment and implements\n1.3\nPerformed proper mixing procedures of different bleaching\nproducts according to product specifications\n1.4\nPerformed hair bleaching according to client’s requirements,\nproduct specifications and established or set procedures\n1.7 Ensured client’s safety and comfort during the entire process\n1.8\nApplied appropriate measures in response to emergencies or\nunavoidable circumstances\n1.9 Performed post-service activities according to salon policies\nand procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nHair and Scalp Analysis\n2.2\nBleaching Procedures\n2.3\nLevels of Lightening\n2.4\nMixing Procedures\n2.5\nSafety Sanitation Rules\n2.6\nCode of Ethics\n2.7\nDifferent Forms of Bleaching Products\n2.8\nDifferent Types of Developers\n2.9\nDifferent Service Options\n2.10 Types of Hair and Scalp Conditions\n2.11 DOH-IRR and OH&S Rules and Regulations\n2.12 First-aid Treatment\n3. Underpinning\nskills\n3.1\nDifferent Methods of Application\n3.2\nHair Sectioning\n3.3\nHandling of Tools and Equipment\n3.4\nUsing of Supplies and Materials\n3.5\nWaste Disposal Practice\n3.6\nDraping Procedure\n3.7\nBleaching Application\n3.8\nObserving Code of Ethics\n3.9\nApplying First-aid Treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed either of the following:\n5.1\nDemonstration with Oral Questioning\n5.2\nPortfolio\n5.3\nThird -Party Report\n\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 51 ---\nTR - Hairdressing NC II\nAmended November 2010\n47\nUNIT OF COMPETENCY:\nPERFORM HAIR STRAIGHTENING\n\nUNIT CODE :"
