        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client according to salon policies and\nprocedures\n1.2\nPrepared and used of tools, supplies/materials according\nto type of service and OH&S requirements\n1.3\nApplied correct techniques in draping, shampooing and/or\nconditioning and blow-drying of hair in accordance with\nservice requirements and established or acceptable\nprocedures\n1.4\nEnsured client’s safety and comfort during the entire\nprocess\n1.5\nApplied questioning and listening skills in assessing the\nneed of clients\n2. Underpinning\nknowledge\n2.1\nSalon Policies and Procedures\n2.2\nDifferent Types of Shampoo and Conditioners\n2.3\nProper Use of Tools, Supplies and Materials\n2.4\nCode of Ethics\n2.5\nDifferent Types and Condition of Hair\n2.6\nOH & S Rules and Regulations\n2.7\nHair Analysis\n2.8\nWater Temperature\n2.9\nProper Hygiene\n2.10 Hair Finishing Products\n2.11 Different Salon Services\n3. Underpinning\nskills\n3.1\nConducting hair analysis\n3.2\nCommunication skills\n3.3\nDraping technique\n3.4\nShampooing and conditioning technique\n3.5\nHair blow-drying technique\n3.6\nSetting and using of tools and equipment\n3.7\nFollowing salon policies and procedures\n3.8\nHair sectioning\n3.9\nUsing supplies/materials and implements\n3.10 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 33 ---\nTR - Hairdressing NC II\nAmended November 2010\n29\nUNIT OF COMPETENCY :\nPERFORM HAIR AND SCALP TREATMENT\nUNIT CODE\n:"
        },
        "source_text": "HCS515301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in\nperforming pre- and post-hair care activities. These\ninclude the draping of the client, the application of\nshampoo and conditioner on hair and the blow-drying of\nhair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is assisted in accordance with salon procedures\n1.2\nBuilt of the client is assessed to determine\nappropriate size of drapery to be used\n1.3\nAppropriate clothing is provided according to the\ndesired type of service, size and built of the client\n1.4\nClient is advised to remove all jewelries and\naccessories\n2. Apply shampoo\nand/or conditioner on\nthe client\n2.1\nNecessary tool, supplies and materials are selected\nand prepared according to the type of service\n2.2\nHair is checked and analyzed to determine appropriate\nshampoo and/or conditioner to be used in accordance\nwith the type of hair damage\n2.3\nHair is shampooed and or/conditioned in accordance\nwith the type of service and established or\nacceptable procedures\n2.4 Where necessary, first-aid treatment is provided to the\nclient or health personnel\n2.5 Client’s safety and comfort is ensured during the\nentire process\n3. Blow-dry hair\n3.1\nHair is toweled dried and combed according to service\nrequirements\n3.2\nHair is blow-dried according to service requirements\nand established or acceptable procedures\n3.3 Finishing product is applied on blow-dried hair\naccording to product specifications\n3.4 Client’s safety and comfort are ensured during the\nentire process\n4. Perform post-service\nactivities\n4.1\nTools and equipment are cleaned, sanitized and\nstored according to OH&S requirements\n4.2\nWaste materials are segregated and disposed\naccording to OH&S requirements\n\n--- PDF PAGE 31 ---\nTR - Hairdressing NC II\nAmended November 2010\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clients’ built\n1.1\nSmall\n1.2\nMedium\n1.3\nLarge\n1.4\nExtra Large\n2. Type of services\n2.1\nHair Treatment\n2.2\nHair Color\n2.3\nHair Bleach\n2.4\nPerming\n2.5\nStraightening\n2.6\nHair Cut\n3. Tools\n3.1 Blower\n3.2 Brush\n3.3 Skeleton Brush\n3.4\nRoller Brush\n3.5\nPaddle Brush\n3.6\nMirror\n3.7\nHand/back Mirror\n3\n4. Supplies/Materials\n4.1\nShampoo\n4.2\nConditioner\n4.3\nTowel\n4.4\nTissue/neck strip\n5. Established or\nacceptable\nprocedures in hair\nshampooing and/or\nconditioning\nMay include but are not limited to:\n5.1 Comb/brush hair to free from entanglement before\nactual shampooing and/or conditioning\n5.2 Apply shampoo and/or conditioner according to the\nclients’ hair length and volume, and type of service\n5.3 Apply appropriate water temperature\n5.4 Follow shampooing and/or conditioning technique\n5.5 Rinse hair thoroughly and towel dry\n6. Established or\nacceptable\nprocedures in blow-\ndrying hair\nMay include but are not limited to:\n6.1 Set blower with correct temperature\n6.2 Apply appropriate sectioning using hair implements to\nachieve optimum results\n6.3 Apply blow-dry technique according to service\n requirements\n7. Hair finishing\nproducts\n7.1 Gel/Hair setting lotion\n7.2 Mouse\n7.3 Spray Net/hair spray\n7.4 Hair Polish/Serum\n7.5 Hair wax (wet and dry)\n7.6 Leave-on conditioner\n\n--- PDF PAGE 32 ---\nTR - Hairdressing NC II\nAmended November 2010\n28\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client according to salon policies and\nprocedures\n1.2\nPrepared and used of tools, supplies/materials according\nto type of service and OH&S requirements\n1.3\nApplied correct techniques in draping, shampooing and/or\nconditioning and blow-drying of hair in accordance with\nservice requirements and established or acceptable\nprocedures\n1.4\nEnsured client’s safety and comfort during the entire\nprocess\n1.5\nApplied questioning and listening skills in assessing the\nneed of clients\n2. Underpinning\nknowledge\n2.1\nSalon Policies and Procedures\n2.2\nDifferent Types of Shampoo and Conditioners\n2.3\nProper Use of Tools, Supplies and Materials\n2.4\nCode of Ethics\n2.5\nDifferent Types and Condition of Hair\n2.6\nOH & S Rules and Regulations\n2.7\nHair Analysis\n2.8\nWater Temperature\n2.9\nProper Hygiene\n2.10 Hair Finishing Products\n2.11 Different Salon Services\n3. Underpinning\nskills\n3.1\nConducting hair analysis\n3.2\nCommunication skills\n3.3\nDraping technique\n3.4\nShampooing and conditioning technique\n3.5\nHair blow-drying technique\n3.6\nSetting and using of tools and equipment\n3.7\nFollowing salon policies and procedures\n3.8\nHair sectioning\n3.9\nUsing supplies/materials and implements\n3.10 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 33 ---\nTR - Hairdressing NC II\nAmended November 2010\n29\nUNIT OF COMPETENCY :\nPERFORM HAIR AND SCALP TREATMENT\nUNIT CODE\n:"
