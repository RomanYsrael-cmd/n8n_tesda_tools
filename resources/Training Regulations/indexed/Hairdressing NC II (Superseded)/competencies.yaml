ents\n2. Underpinning\nknowledge\n2.1\nHair and Scalp Analysis\n2.2\nBleaching Procedures\n2.3\nLevels of Lightening\n2.4\nMixing Procedures\n2.5\nSafety Sanitation Rules\n2.6\nCode of Ethics\n2.7\nDifferent Forms of Bleaching Products\n2.8\nDifferent Types of Developers\n2.9\nDifferent Service Options\n2.10 Types of Hair and Scalp Conditions\n2.11 DOH-IRR and OH&S Rules and Regulations\n2.12 First-aid Treatment\n3. Underpinning\nskills\n3.1\nDifferent Methods of Application\n3.2\nHair Sectioning\n3.3\nHandling of Tools and Equipment\n3.4\nUsing of Supplies and Materials\n3.5\nWaste Disposal Practice\n3.6\nDraping Procedure\n3.7\nBleaching Application\n3.8\nObserving Code of Ethics\n3.9\nApplying First-aid Treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed either of the following:\n5.1\nDemonstration with Oral Questioning\n5.2\nPortfolio\n5.3\nThird -Party Report\n\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 51 ---\nTR - Hairdressing NC II\nAmended November 2010\n47\nUNIT OF COMPETENCY:\nPERFORM HAIR STRAIGHTENING\n\nUNIT CODE :\nHCS515308\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in\nstraightening hair. This includes preparing the client,\napplying hair straightening product, ironing of hair and\nchecking and retouching on the result.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is advised to remove all personal accessories\n1.2\nProtective clothing and gadgets are used to ensure\nclients safety and comfort\n1.3\nClient hair texture and condition, together with scalp are\nchecked and analyzed\n1.4\nPrevious hair treatment is confirmed with the client before\ndoing the desired service\n1.5\nClient is draped and shampooed without scratching the\nscalp\n2. Apply hair\nstraightening\nproduct\n2.1\nNecessary tools and materials are prepared and used\naccording to OH&S requirements\n2.2\nDifferent forms of products are identified and/or mixed\nbased on types of hair and desired hair straightening\nservice in accordance with manufacturers’ instruction\n2.3\nHair straightening is performed in accordance with\nproduct specifications and established or acceptable\nprocedures\n2.4 Client’s safety and comfort are ensured during the\n entire process\n2.5 Where necessary, first-aid treatment is provided to client\nor referred to health personnel\n3. Iron Hair\n3.1\nHair is blow-dried according to salon procedures\n3.2\nProtective hair product is applied through the hair\nbefore actual ironing\n3.3\nIron plate is set in accordance with hair condition\n3.4\nHair is sub-sectioned according to salon procedures\n3.5\nHair is ironed in accordance with salon procedures\n4. Apply hair fixing\nsolution\n4.1\nFixing solution is applied on the hair in accordance with\nmanufacturer’s instructions\n4.2\nProcessing time is followed according to manufacturer’s\ninstructions\n4.3\nHair is rinsed thoroughly and applied with necessary\ntreatment\nproducts\naccording\nto\nmanufacturers’\ninstructions\n4.4\nResult is checked and hair is styled according to clients’\ndesired outcome\n5. Perform post\nservice activities\n5.1\nClient is advised on hair care and maintenance\n5.2\nTools, implements and equipments are cleaned,\nsterilized/sanitized and stored after use in accordance\nwith salon procedures\n5.3\nWaste items are properly disposed of in accordance with\nOH&S requirements\n5.4\nWorking area is cleaned in preparation for the next client\n\n--- PDF PAGE 52 ---\nTR - Hairdressing NC II\nAmended November 2010\n48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal accessories\n1.1\nEarrings\n1.2\nNecklace\n2.\nProtective clothing and\ngadgets\n2.1 Rubber Cape\n2.2 Bath Towel\n2.3 Ear Pads\n2.4 Apron\n2.5 Gloves\n2.6 Mask\n3. Hair Texture\n3.1\nFine\n3.2\nMedium\n3.3\nThick\n4. Hair Condition\n4.1\nDry\n4.2\nPorous / Damaged\n4.3\nSensitized\n5. Tools\n5.1 Mixing Bowl\n5.2 Scoop or Spatula\n5.3\nTail Comb\n5.4\nHand Blower\n5.5\nHair Brush\n5.6\nClips or Clamps\n5.7\nLarge Tooth Comb\n5.8\nHair Iron\n6. Supplies and Materials\n6.1 Shampoo\n6.2\nStraightening\n6.3\nConditioner\n6.4\nStyling Products\n6.5\nNeutralizer\n6.6\nTissue\n7. Different forms of\nstraightening product\n7.1 Cream\n7.2 Liquid\n7.3 Powder\n8. Types of hair\n8.1 Wavy\n8.2 Curly\n8.3 Straight\n9. Types of hair\nstraightening services\n9.1 Relaxing\n9.2 Rebonding\n9.3 Permanent Blow Dry\n10. Established or\nacceptable procedures\nin hair straightening\nMay include but are not limited to:\n10.1 Section hair\n10.2 Apply hair straightening product on the hair and leave-on\non specified time\n10.3 Check hair to monitor progress of straightening\n10.4 Follow development time according to product\nspecifications and hair condition\n10.5 Rinse hair thoroughly and towel dry\n11. Protective hair and scalp\nproduct\n11.1\nLiquid form\n11.2\nTalcum Powder\n11.3\nCream\n12. Setting of iron plate\ntemperature\n12.1 120 degrees F\n12.2\n160 degrees F\n12.3\n180 degrees F\n12.4\n200 degrees F\n13. Hair care and\nmaintenance program\nundergo weekly hair\ntreatment.\n13.1 Hair Spa\n13.2\nHair Reborn\n13.3\nHot-Oil Treatment\n13.4\nFrequent or Regular Salon Visit\n\n--- PDF PAGE 53 ---\nTR - Hairdressing NC II\nAmended November 2010\n49\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nConsulted and prepared client on the desired type of hair\nstraightening services and its procedures\n1.2 Prepared and used tools, supplies/materials and protective\nclothing according to job requirements and OH&S\nrequirements\n1.3 Selected and prepared hair-straightening products according\nto client’s type of hair and product specifications\n1.4 Performed hair straightening in accordance with established\nor acceptable procedures\n1.5 Applied protective product on the hair before ironing it\n1.6\n Ironed hair according to appropriate direction, timeline and\ntemperature following salon procedures\n1.7 Ensured client’s safety and comfort during the entire process\n1.8 Applied appropriate measures in response to emergencies\nand unavoidable circumstances\n1.9 Performed post-service activities according to salon policies\n and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nCode Of Ethics\n2.2\nSalon Procedures/Policies\n2.3\nHair Sectioning\n2.4\nHair Blow-dry Technique\n2.5\nHair Types and Texture\n2.6\nHair and Scalp Condition\n2.7\nDifferent Tools And Materials: Their uses and specifications\n2.8\nDifferent Supplies And Products\n2.9\nStraightening Product and Its Application Procedures\n2.10 DOH – IRR and OH&S Rules and Regulations\n2.11 Hair Iron Temperature\n2.12 Development Time Requirements\n2.13 First-aid Treatment\n\n3. Underpinning\nskills\n3.1\nConducting hair and scalp analysis\n3.2\nUsing tools and materials\n3.3\nUsing and applying straightening product of different forms\n3.4\nApplying hair and scalp protective products\n3.5\nPerforming hair sectioning\n3.6\nBlow-drying technique\n3.7\nIroning technique\n3.8\nShampooing technique\n3.9\nChecking of result\n3.10 Draping of clients\n3.11 Observing code of ethics\n3.12 Applying first-aid treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with Oral Questioning\n5.2\nPortfolio\n5.3\nThird-Party Report\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 54 ---\nTR - Hairdressing NC II\nAmended November 2010\n50\nUNIT OF COMPETENCY:\nAPPLY BASIC MAKE-UP\n\nUNIT CODE :\nHCS515314\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in\napplying basic facial make-up. It also involves the\npreparation of the client, application of make-up and the\nperformance of post-facial make-up activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is advised to remove all personal\naccessories\n1.2\nClient is consulted on specific make-up\nrequirements\n1.3\nShapes of face and skin type / tones of client are\nanalyzed according to make-up requirements\n1.4\nClient is seated in a comfortable position during the\nentire process\n1.5\nClient is provided with protective clothing following\nsalon procedures\n\n2. Apply make-up\n2.1\nHand is sanitized before actual application of make-\nup\n2.2\nMake-up products and accessories, tools,\nsupplies and materials are selected and prepared\naccording to client make – up requirement\n2.3\nMake-up application is performed in accordance with\nestablished or acceptable procedures\n2.4 Make-up result is checked before application of\n finishing touches\n2.5 Client’s comfort and safety are ensured during the\nentire process\n3. Perform post-service\nactivities\n4.1\nClient is advised on appropriate product and\nprocedure in applying retouch and removing make-\nup\n4.2\nMake-up products, tools, materials and implements\nare cleaned and stored after use in accordance with\nsalon procedures\n4.3\nWaste items are properly disposed of in accordance\nwith OH&S requirements\n4.4\nWorkstation is cleaned and prepared for next activity\n\n--- PDF PAGE 55 ---\nTR - Hairdressing NC II\nAmended November 2010\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Personal Accessories\n1.1\nEarrings\n1.2\nNecklace\n1.3\nAny pierced items in the face\n\n2 Basic make-up\nrequirements\n2.1\nDay Make-Up\n2.2\nEvening Make-Up\n2.3\nBridal\n\n3 Shapes of face\n3.1\nRectangle or Elongated\n3.2\nInverted/Pear\n3.3\nHeart\n3.4\nOval\n3.5\nTriangular\n3.6\nSquare\n3.7\nDiamond\n3.8\nRound\n\n4 Skin type\n4.1\nDry\n4.2\nNormal\n4.3\nOily\n\n5 Skin tones\n5.1\nFair\n5.2\nLight\n5.3\nMedium\n5.4\nDark\n\n6 Protective clothing\n6.1\nTowel\n6.2\nHeadband\n6.3\nBib\n\n7. Make-up Product and\naccessories\n7.1\nMake-up products may include but are not limited:\n7.1.1. Concealer\n7.1.2. Cake of Liquid Foundation\n7.1.3. Blusher\n7.1.4. Eyeshadow\n7.1.5. Eye Liner (liquid/pencil/cake)\n7.1.6. Eye Brow Pencil\n7.1.7. Lip Pencil\n7.1.8. Lip Stick\n7.1.9. Mascara\n7.1.10. Face Powder\n7.2\nMake-up accessories may include but are limited to:\n7.2.1. Eye Gel\n7.2.2. Powder Glitter\n7.2.3. Artificial eye lashes\n\n--- PDF PAGE 56 ---\nTR - Hairdressing NC II\nAmended November 2010\n52\n\nVARIABLE\nRANGE\n8. Make-up tools,\nsupplies and materials\n8.1\nSponge\n8.2\nSharpener\n8.3\nCotton Buds\n8.4\nEyelash Curler\n8.5\nPowder Applicator\n8.6\nFlat brush\n8.6.1. Lip Brush\n8.6.2. Eye Liner Brush\n8.6.3. Eye Shadow Brush\n8.6.4. Large Eyebrow Brush\n8.6.5. Small Eyebrow Brush\n8.6.6. Large Blusher Brush\n8.6.7. Powder Brush\n8.6.8. Brow with Comb Brush\n8.7\nEye Brow Scissor\n8.8\nEye Brow Blade\n8.9\nTweezers\n\n9. Established or\nacceptable procedures\nin basic make-up\napplication\nMay include but are not limited to:\n9.1\nClean or wash face using cleansing products\n9.2\nApply foundation and concealer evenly on face and\nneck\n9.3\nApply cheek rouge to cover dark spots of the face\n9.4\nApply eyeshadow\n9.5\nApply fresh powder\n8.6\nEnhance or curl eyelashes with mascara\n8.7\nDefine eyebrow\n8.8\nEnhance eyelid with eyeliner\n8.9\nApply lipstick\n\n10. Make-up result\n10.1 Evenness of make-up application and proper\ndistribution (lightness and darkness of make-up)\n10.2 Essential application of make-up\n10.3 Blending of colors\n10.4 Appropriateness of make-up with the occasion\n10.5 Symmetry and balance of eyebrow arc and shape,\nand blush-on\n10.6 Face and lips contouring is achieved\n\n--- PDF PAGE 57 ---\nTR - Hairdressing NC II\nAmended November 2010\n53\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted clients on specific basic make-up requirements\n1.2 Performed analysis of client’s face, skin tone and type in\naccordance with make-up requirements\n1.3 Prepared and used appropriate make-up tools, materials\nand accessories according to client’s make-up\nrequirements\n1.4 Applied make-up products based on product specifications\n1.5 Performed checking before applying finishing touches on\nclient\n1.6 Performed safe and sanitary procedures in handling client\n1,7 Applied appropriate measures in response to emergencies\n or unavoidable circumstances\n1.8 Performed post-service activities according to salon policies\nand procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1 Code of Ethics\n2.2 Different Facial Shapes\n2.3 Basic Facial Make-up Techniques\n2.4 Make-Up Procedure/Sequence\n2.5 Facial Skin and Type Analysis\n2.6 Make-Up Products\n2.7 Make–Up Techniques\n2.8 DOH- IRR and OH&S rules and regulations\n\n3. Underpinning\nskills\n3.1 Handling clients\n3.2 Contouring of face\n3.3 Handling of tools and materials\n3.4 Applying make-up/blending of colors as per requirement\n3.5 Finishing touches/recommendation for touch-up\n3.6 Observing code of ethics\n3.7 Applying first-aid treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools and supplies/materials relevant to the activity to be\nperformed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Portfolio\n5.3 Third -Party Report\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 58 ---\nTR - Hairdressing NC II\nAmended November 2010\n54"
