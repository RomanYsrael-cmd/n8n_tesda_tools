        "source_title": "PERFORM BASIC HAIR PERMING",
        "source_text": "--- PDF PAGE 36 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n32 \nUNIT OF COMPETENCY : \nPERFORM BASIC HAIR PERMING \nUNIT CODE                       : \nHCS515303 \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in \nperforming basic hair perming. It involves assessing and \npreparing the client, actual performance of hair perming, \nchecking of result and doing necessary finishing touches \nto achieve optimum result. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Prepare client \n1.1 \nClient is advised to remove all personal \naccessories \n1.2 \nClient is provided with and advised to wear \nprotective clothing \n1.3 \nCondition and type of hair are checked and \nanalyzed \n1.4 \nPrevious chemical treatment applied on hair is \ndetermined \n1.5 \nScalp condition is checked if free from scratches \nand open wounds \n1.6 \nWhere necessary, client is advised to defer hair \nperming based on adverse scalp and health \nconditions \n1.7 \nTypes of hair curls is confirmed with client and \nrecorded \n2.   Perm hair \n2.1 \nTools and equipment, supplies/ materials are \nprepared and used according to salon policies and \nprocedures and OH&S requirements \n2.2 \nPerm solution is selected and prepared according \nto client’s hair type, texture/condition and product \nspecifications \n2.3 \nHair perming is performed in accordance with \nestablished or acceptable procedures and \nproduct specifications \n2.4      Hair is rinsed thoroughly, towel-dried and  \n           conditioner is applied \n2.5      Clients’ safety and comfort are ensured during the  \n           entire process  \n3.  Apply finishing touches \n3.1 \nHair is checked according to client’s desired \noutcome \n3.2 \nHair is tapered / trimmed and styled if necessary \n3.3      Client’s satisfaction is confirmed and adjustments \nare made if required \n4. Perform post-service \nactivities \n4.1 \nClient is advised on hair and care maintenance  \n4.2 \nTools, equipment, supplies and materials are \ncleaned and stored after use in accordance with \nsalon procedures \n4.3 \nWaste items are properly disposed of  in \naccordance with OH&S requirements \n4.4   Workstation is cleaned and prepared for next  \n          activity\n\n--- PDF PAGE 37 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n33 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hair Conditions \n1.1  Damaged \n1.2   Tinted \n1.3   Lightened \n1.4   Porous \n1.5   Dry \n1.6   Greasy or Oily \n1.7   Normal    \n2. Scalp Condition \n2.1 \nDry or Oily \n2.2 \nDandruff \n2.3 \nGreasy \n2.4 \nWaxy \n2.5 \nScaly \n3.   Types of hair curls \n3.1 \nWavy \n3.2 \nCurly \n4.   Tools and \nEquipment \n4.1 \nDryer \n4.1.1 \nHandheld, Hood, Infrared \n4.2 \nCurler \n4.2.1 Small, Medium, Large, Extension, Extra Large, \nJumbo \n4.2.2 Wooden Spindle, Nooping, Spiral, Zigzag, \nTelephone Wire \n4.3 \nApplicator \n4.4 \nShower Cap \n4.5 \nFlannel Headband \n4.6 \nDrip Pan \n4.7 \nCape \n4.8 \nBath Towel \n4.9 \nBath Comb \n4.10 Razor/Scissor \n4.11 Hairclips \n4.12 Apron \n4.13 End Paper \n4.14 Ear Pads \n4.15 Tail Comb \n4.16 Rubber Band \n4.17 Rubber Gloves \n5 \nSupplies Materials \n5.1 \nShampoo \n5.2 \nPerm solution \n5.3 \nNeutralizer \n5.4 \nConditioner \n5.5 \nEnd Paper \n5.6 \nPowder \n5.7 \nRoll tissue \n5.8 \nCotton \n5.9 \nRubber Band \n5.10 Disposable Gloves \n6.   Established or \nacceptable \nprocedures in hair \nperming \nMay include but are not limited to: \n6.1 \nShampoo hair without conditioner and without \nscratching the scalp \n6.2 \nTowel dry, section and wind hair according to selected \ntypes of hair curls and apply selected perm solution \n6.3 \nCover wounded hair with plastic cap/cling wrap or \nexpose to dry heat\n\n--- PDF PAGE 38 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n34 \nVARIABLE \nRANGE \n6.4 \nCheck progress of wave from time to achieve optimum \nresult \n6.5 \nRinse thoroughly without removing the curlers and towel \nblot \n6.6 \nApply hair with neutralizer and leave-on on specified \ntime \n6.7 \nRemove curlers / rollers and slightly massage hair and \nscalp   \n6.8 \nShampoo and condition hair thoroughly, rinse and towel-\ndry  \n7. Hair care and \nmaintenance  \n7.1 \nUse of wide toothed comb \n7.2 \nApplication of hair polishing products \n7.3 \nDaily hair wash with appropriate shampoo and \nconditioner \n7.4 \nRegular hair treatment\n\n--- PDF PAGE 39 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n35 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1    Consulted client on the  type of curls required \n1.2 \nAssessed hair and scalp condition as free from scratches \nand open wounds   \n1.3 \nProvided protective clothing to client \n1.4 \nSelected and prepared perming solution according to \nclient’s requirements and manufacturer’s specifications \n1.5    Performed hair perming in accordance with established or  \n         acceptable procedures \n1.6 \nEnsured clients safety and comfort throughout the  whole \nprocess \n1.8    Applied final touch on hair according to client’s \nrequirements \n1.9    Applied appropriate measures in response to \nemergencies or unavoidable circumstances \n1.10  Performed post-service activities according to salon \npolicies and procedures, and OH&S requirements \n2. Underpinning \nknowledge  \n2.1 \nCode of Ethics \n2.2 \nOH & S Requirements \n2.3 \nHair Texture / Condition \n2.4 \nDifferent Scalp Condition \n2.5 \nHeating Procedures \n2.6 \nDifferent Perm Maintenance Program \n2.7 \nTime Management \n2.8 \nPrinciples of Customer Relations \n2.9 \nDifferent Perming Products \n2.10 DOH – IRR and OH&S rules and regulations \n2.11 First-aid treatments \n3. Underpinning \nskills  \n3.1 \nListening and Questioning Skills \n3.2 \nCustomer Relation Skills \n3.3 \nObserving hair sectioning \n3.4 \nApplying winding technique \n3.5 \nApplying massage technique \n3.6 \nTrimming \n3.7 \nApplying  shampooing and blow-drying techniques \n3.8 \nHandling Tools and Equipment \n3.9 \nUsing Perming Product \n3.10 Observing code of ethics \n3.11 Applying first-aid treatments \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nModel \n4.2 \nTools, equipment and supplies/materials relevant to the  \n           activity to be performed \n4.3 \nWork area/facilities  \n5. Methods of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with Oral Questioning \n5.2 \nPortfolio \n5.3 \nThird-Party Report \n6. Context of \nassessment \nCompetency may be assessed in the workplace or TESDA     \naccredited assessment center\n",
