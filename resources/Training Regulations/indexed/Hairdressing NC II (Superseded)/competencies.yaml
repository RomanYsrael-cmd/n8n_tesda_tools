        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client through consultation according to salon\npolicies and procedures\n1.2\nPrepared and used tools, equipment, supplies and\nmaterials for hair and scalp treatment according to\nspecifications and OH&S requirements\n1.3\nUsed appropriate protective clothing and gadget following\nsalon policies and procedure\n1.4\nPerformed hair and scalp treatment according to product\nspecifications and established or acceptable procedures\n1.5 Ensured client’s safety and comfort during the entire\n process\n1.6 Performed post-service activities according to salon\n policies and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nSafety Practices\n2.2\nDifferent Treatment Products\n2.3\nMeasurements/Ratio and Proportion\n2.4\nCode of Ethics\n2.5\nSalon Policies and Procedures\n2.6\nHair and Scalp Treatment Procedures and Processes\n2.7\nHair Analysis\n2.8\nHair types and condition\n2.9\nTime Management\n2.10 DOH and OH&S requirements\n3. Underpinning\nskills\n3.1\nProper handling of tools\n3.2\nOperation of equipment\n3.3\nCommunication skills\n3.4\nApplication of treatment product\n3.5\nApplication of massage technique\n3.6\nChecking of hair and scalp condition\n3.7\nCompliance with DOH, OH&S requirements\n3.8\nSafekeeping of equipment and tools\n3.9\nCompliance to target treatment timeline\n3.10 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nAssessment may be conducted in the actual workplace or\nTESDA accredited assessment center\n\n--- PDF PAGE 36 ---\nTR - Hairdressing NC II\nAmended November 2010\n32\nUNIT OF COMPETENCY :\nPERFORM BASIC HAIR PERMING\nUNIT CODE :"
        },
        "source_text": "HCS515302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to\ntreat a range of hair and scalp conditions of clients. It\ninvolves preparation of clients, tools and equipment,\nactual treatment of hair and scalp and performance of\npost-treatment activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient’s health and restrictions are determined\nthrough consultation\n1.2\nClient’s scalp and hair condition are analyzed\nfollowing salon safety policies and procedures\n1.3\nProtective clothing is prepared and used according\nto OH&S requirements and salon procedures\n\n2. Treat hair condition\n2.1\nSupplies/materials and hair treatment product are\nselected and prepared according to client’s hair\ncondition\n2.2\nHair treatment is performed in accordance with\nestablished or acceptable procedures\n2.3 Result is checked according to client’s desired\noutcome\n2.4 Client’s safety and comfort is ensured during the entire\nprocess\n2.5 Where necessary, first-aid treatment is provided to the\nclient or referred to health personnel\n3. Treat scalp condition\n3.1\nScalp treatment product is selected and prepared\nbased on client’s scalp condition\n3.2\nScalp treatment is performed in accordance with\nestablished or acceptable procedures\n3.3 Result is checked according to client desired outcome\n3.4 Clients’ comfort and safety is ensured during the\nprocess\n3.5 Where necessary, first-aid treatment is provided to the\nclient or referred to health personnel\n4. Perform post-service\nactivities\n4.1\nTreatment products used are stored following salon\nprocedures\n4.2\nTools and equipment are cleaned, sanitized and\nstored according to OH&S requirements\n4.3\nWaste materials are segregated and disposed\naccording to OH&S requirements\n4.4\nClient is advised on appropriate hair and scalp\nmaintenance\n\n--- PDF PAGE 34 ---\nTR - Hairdressing NC II\nAmended November 2010\n30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Type of client\n\n1.1\nAdult\n1.2\nYoung Adult\n1.3\nTeenager\n2. Scalp condition\n2.1 Normal\n2.2 Oily\n2.3 Dry\n3. Hair condition\n3.1 Porous / Damaged\n3.2 Dry\n3.3 Oily\n3.4 Normal\n3.5 Chemically Treated\n4. Protective clothing\n4.1 Facial mask\n4.2\nApron\n4.3\nBath Towel\n4.4\nHead Band\n5. Tools and equipment\n5.1\nSteamer\n5.2\nBlower\n5.3\nHair brush\n5.4\nWide Toothed Comb\n5.5\nMixing bowls\n5.6\nHair clamps & clips\n5.7\nSpatula\n6. Supplies and materials\n6.1 Aluminum Foil\n6.2 Tissue Paper\n6.3 Cling Wrap\n6.4 Silicon brush\n6.5 Different treatment products\n7. Hair and scalp treatment\nproduct form\n7.1 Cream Form\n7.2\nLiquid Form\n7.3\nGel Form\n8. Established or acceptable\nprocedures in hair and scalp\ntreatment\nMay include but are not limited to:\n8.1 Apply treatment product according to product\nspecifications and massage hair and/or scalp\n8.2 Expose hair and/or scalp to heat if necessary,\n according to product specifications\n8.3 Follow correct timeline according to product\n specification\n8.4 Rinse hair thoroughly and towel or blow dry.\n\n9. Waste\n9.1 Biodegradable\n9.2 Non-Biodegradable\n10. Hair and scalp\nmaintenance\nHair and Scalp Frequent Treatment\nUse of Hair and Scalp Treatment Product\n\n--- PDF PAGE 35 ---\nTR - Hairdressing NC II\nAmended November 2010\n31\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client through consultation according to salon\npolicies and procedures\n1.2\nPrepared and used tools, equipment, supplies and\nmaterials for hair and scalp treatment according to\nspecifications and OH&S requirements\n1.3\nUsed appropriate protective clothing and gadget following\nsalon policies and procedure\n1.4\nPerformed hair and scalp treatment according to product\nspecifications and established or acceptable procedures\n1.5 Ensured client’s safety and comfort during the entire\n process\n1.6 Performed post-service activities according to salon\n policies and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nSafety Practices\n2.2\nDifferent Treatment Products\n2.3\nMeasurements/Ratio and Proportion\n2.4\nCode of Ethics\n2.5\nSalon Policies and Procedures\n2.6\nHair and Scalp Treatment Procedures and Processes\n2.7\nHair Analysis\n2.8\nHair types and condition\n2.9\nTime Management\n2.10 DOH and OH&S requirements\n3. Underpinning\nskills\n3.1\nProper handling of tools\n3.2\nOperation of equipment\n3.3\nCommunication skills\n3.4\nApplication of treatment product\n3.5\nApplication of massage technique\n3.6\nChecking of hair and scalp condition\n3.7\nCompliance with DOH, OH&S requirements\n3.8\nSafekeeping of equipment and tools\n3.9\nCompliance to target treatment timeline\n3.10 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nAssessment may be conducted in the actual workplace or\nTESDA accredited assessment center\n\n--- PDF PAGE 36 ---\nTR - Hairdressing NC II\nAmended November 2010\n32\nUNIT OF COMPETENCY :\nPERFORM BASIC HAIR PERMING\nUNIT CODE :"
      },
