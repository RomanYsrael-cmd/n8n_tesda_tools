ediately to the salon supervisor\n4.4 Incorrectly ordered or delivered stock is referred to the\nsalon supervisor for return to supplier\n4.5 Safe lifting and carrying techniques maintained in line with\nsalon\noccupational\nhealth\nand\nsafety\npolicy\nand\ngovernment legislation\n5. Provide a relaxed\nand caring\nenvironment\n5.1 Clients are made to feel comfortable according to salon\npolicy\n5.2 Clients’ needs are attended to promptly\n5.3 Clients are consulted on specific desired service\n\n--- PDF PAGE 28 ---\nTR - Hairdressing NC II\nAmended November 2010\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Relevant Salon Policies\nand Procedures\n\nMay include but not limited to:\n1.1\nHazard Policies and Procedures\n1.2\nEmergency, Fire and Accident Procedures\n1.3\nPersonal Safety Procedures\n1.4\nProcedures for the use of Personal protective\nClothing and Equipment\n1.5\nHazard Identification\n1.6\nJob Procedures\n\n2. Occupational Health and\nSafety Procedures\nMay include but not limited to:\n2.1\nClient\n2.2\nStaff\n2.3\nEquipment/Tools\n2.4\nPremises\n2.5\nStock\n\n3. Potential Hazards\nMay include but are not limited to:\n3.1\nDamaged Packaging Material or Containers\n3.2\nBroken or Damaged Equipment\n3.3\nInflammable Materials and Fire Hazards\n3.4\nLifting Practices\n3.5\nSpillages\n3.6\nWaste including hair especially on floors\n3.7\nTrolleys\n\n--- PDF PAGE 29 ---\nTR - Hairdressing NC II\nAmended November 2010\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nGenerated information on different client requirements\nand needs\n1.2\nSelected and used strategies to accurately analyzed the\nclient requirements\n1.3\nAssessed current product and services as against client\ndemand\n1.4\nIdentified avenues to establish relevant linkage\n1.5\nSelected promotional activities relevant to enhance\ncompetitiveness of salon\n1.6\nAssisted clients on specific desired services\n1.7\nChecked and prepared 