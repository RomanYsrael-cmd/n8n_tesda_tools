ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nAssessed verbal or written work plan through observation\nand discussion of site and employer requirements\n1.3\nDemonstrated capacity to complete task within specified\ntime frame\n1.4\nMaintained quality of own performance\n2. Underpinning\nknowledge and\nattitudes\n2.1\nSite and assignment requirements\n2.2\nEmployer policy on performance management\n2.3\nIndicators of appropriate performance for each area of\nresponsibility\n2.4\nSteps for improving or maintaining performance\n3. Underpinning\nskills\n3.1\nCapacity to plan and prioritize security work loads and\nrequirements\n3.2\nTime and task management\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAssessment Centers/Venues\n4.2\nAccredited Assessors\n4.3\nModes of Assessment\n4.4\nEvaluation Reports\n4.5\nAccess to a relevant venue, equipment and materials\n4.6\nAssignment Instructions\n4.7\nLogbooks\n4.8\nOperational manuals and makers’/customers’\ninstructions (if relevant)\n4.9\nAssessment Instruments, including personal planner and\nassessment record book\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nWritten Test/Examination\n5.2\nDemonstration with questioning\n5.3\nObservation with questioning\n6. Context of\nassessment\n6.1\nCompany\n6.2\nOn-Site\n6.3\n Assessment activities are carried out through TESDA\n accredited assessment centers/venues by using closely\n simulated workplace environment\n6.4\nContinuous assessment in an institutional setting that\n stimulates the conditions of performance describe in the\n elements, performance criteria and range of variables\n statement that make up this unit\n6.5\nContinuous assessment in the workplace, taking into\n account the range of variables affecting performance.\n6.6\nSelf-assessment on the same terms as those described\n above\n6.7\nSimulated assessment or critical incident assessment,\nprovided that the critical incident involves assessment\nagainst performance criteria and an evaluation of\nunderpinning knowledge and skill required to achieve\nthe required performance criteria.\n\n--- PDF PAGE 24 ---\nTR - Hairdressing NC II\nAmended November 2010\n20\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:\nHCS515204\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nneeded to apply quality standards in the workplace. The\nunit also includes the application of relevant safety\nprocedures\nand\nregulations,\nsalon/organizational\nprocedures and other client requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess clients service\nneeds\n\n1.1 Work instruction is obtained and work is carried out\nin accordance with standard operating procedures\n1.2 Clients needs are checked against workplace\nstandards and specifications\n1.3 Faults on clients and any identified causes are\nrecorded\nand/or\nreported\nto\nthe\nsupervisor\nconcerned in accordance with workplace procedures\n1.4 Clients profile and service extended to them are\ndocumented in accordance with workplace\nprocedures\n2. Assess own work\n2.1 Documentation\nrelative\nto\nquality\nwithin\nthe\ncompany is identified and used\n2.2 Completed work is checked against workplace\nstandards relevant to the task undertaken\n2.3 Errors are identified and improved on\n2.4 Information on the quality and other indicators of\nindividual performance is recorded in accordance\nwith workplace procedures\n2.5 In cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ standard operating\nprocedures\n3. Engage in quality\nimprovement\n3.1 Process improvement procedures are participated in\nrelative to workplace assignment\n3.2 Work is carried out in accordance with process\nimprovement procedures\n3.3 Performance of operation or quality of product of\nservice to ensure other client satisfaction is\nmonitored\n\n--- PDF PAGE 25 ---\nTR - Hairdressing NC II\nAmended November 2010\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. External Clients\n\nMay include but are not limited to:\n1.1\nTeenagers\n1.2\nAdult Men\n1.3\nWorking Adult\n1.4\nChild\n\n2. Faults\nMay include but are not limited to:\n2.1\nClient not satisfied\n2.2\nDesired result is not within the desired result of\nclient\n2.3\nProcedures done but do not conform with any\nSalon policies and procedures\n2.4\nDamaged caused to client\n\n3. Documentation\n3.1\nOrganization Work Procedures\n3.2\nManufacturer’s Instruction Manual\n3.3\nClient Requirements\n3.4\nForms\n\n4. Errors\nMay be related to the following:\n4.1\nDeviation from the requirements of the client\n4.2\nDeviation\nfrom\nthe\nrequirements\nof\nthe\nsalon/organization\n\n5. Quality Standards\nMay be related but are not limited to the following:\n5.1\nSupplies and Materials\n5.2\nFacilities\n5.3\nSalon Product\n5.4\nService Processes and Procedures\n5.5\nClient Service\n5.6\nEnvironmental Regulations\n\n6. Client\n6.1\nCo-worker\n6.2\nSupplier/Vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 26 ---\nTR - Hairdressing NC II\nAmended November 2010\n22\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCarried out work in accordance with the company’s\nstandard operating procedures\n1.2\nPerformed task according to specifications\n1.3\nReported errors or deviations not in accordance with\nstandard operating procedures\n1.4\nCarried out work in accordance with the process\nimprovement\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nRelevant Production Processes, Materials and Products\n2.2\nCharacteristics of Materials, Software and Hardware\nUsed in Production Processes\n2.3\nQuality Checking Procedures\n2.4\nClient Relations\n2.5\nWork Place Procedures\n2.6\nSafety and Environmental Aspects of Service Processes\n2.7\nError Identification and Reporting\n2.8\nQuality Improvement Processes\n\n3. Underpinning skills 3.1\nReading skills required to interpret work instructions,\nproduct manufacturer’s requirements\n3.2\nCommunication skills needed to interpret and apply\ndefined work procedures\n3.3\nCarry out work in accordance with OHS policies and\nprocedures\n3.4\nCritical thinking\n3.5\nSolution providing and decision making\n3.6\nInterpersonal skills or dealing with varied type of clients\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nMaterials\n4.2\nProduct\n4.3\nEquipment\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nThird Party Report\n5.3\nDemonstration with questioning\n\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment.\n\n--- PDF PAGE 27 ---\nTR - Hairdressing NC II\nAmended November 2010\n23\nUNIT OF COMPETENCY :\nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK\nENVIRONMENT\nUNIT CODE\n:\nHCS515205\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nneeded to maintain client relations. The unit incorporates\nthe\nwork\nsafety\nguidelines.\nIt\nencompasses\ncompetencies necessary to maintain a safe workplace\nfor staff, clients and others. It also involves the\napplication of health regulations, including personal\nhygiene practiced by staff members, provision of a caring\nclient environment and the efficient operation of the\nsalon.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Comply with health\nregulations\n\n1.1 Salon policies and procedures for personal hygiene\napplied\n1.2 Procedures and practices implemented in a variety of\nsalon situations in accordance with national and local\ngovernment health regulations\n2. Assess own work\n2.1 Reception, work areas and walkways maintained in a safe,\nuncluttered and organized manner according to salon\npolicy\n2.2 All routines carried out safely, effectively with minimum\ninconvenience to clients and staff\n2.3 Waste is stored and disposed of according to OH & S\nrequirements\n2.4 Spills, food, waste, hair or other potential hazards\npromptly removed from floors according to salon policy.\n2.5 Linen is stored, cleaned and disinfected in line with OHS\nrequirements and salon procedures\n3. Check and maintain\ntools and\nequipment\n3.1 Tools and equipment are stored safely and in position to\ncomply with salon requirements and local health\nregulations\n3.2 Tools and equipment are prepared for specific services as\nrequired\n3.3 Tools and equipment are checked for maintenance\nrequirements\n3.4 Tools and equipment are referred for repair as required\n4. Check and maintain\nstocks\n\n4.1 Stock rotation procedures are carried out routinely and\naccurately according to salon procedures\n4.2 Stock levels are accurately recorded according to salon\nprocedures\n4.3 Under or over supplied stock items are notified\nimmediately to the salon supervisor\n4.4 Incorrectly ordered or delivered stock is referred to the\nsalon supervisor for return to supplier\n4.5 Safe lifting and carrying techniques maintained in line with\nsalon\noccupational\nhealth\nand\nsafety\npolicy\nand\ngovernment legislation\n5. Provide a relaxed\nand caring\nenvironment\n5.1 Clients are made to feel comfortable according to salon\npolicy\n5.2 Clients’ needs are attended to promptly\n5.3 Clients are consulted on specific desired service\n\n--- PDF PAGE 28 ---\nTR - Hairdressing NC II\nAmended November 2010\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Relevant Salon Policies\nand Procedures\n\nMay include but not limited to:\n1.1\nHazard Policies and Procedures\n1.2\nEmergency, Fire and Accident Procedures\n1.3\nPersonal Safety Procedures\n1.4\nProcedures for the use of Personal protective\nClothing and Equipment\n1.5\nHazard Identification\n1.6\nJob Procedures\n\n2. Occupational Health and\nSafety Procedures\nMay include but not limited to:\n2.1\nClient\n2.2\nStaff\n2.3\nEquipment/Tools\n2.4\nPremises\n2.5\nStock\n\n3. Potential Hazards\nMay include but are not limited to:\n3.1\nDamaged Packaging Material or Containers\n3.2\nBroken or Damaged Equipment\n3.3\nInflammable Materials and Fire Hazards\n3.4\nLifting Practices\n3.5\nSpillages\n3.6\nWaste including hair especially on floors\n3.7\nTrolleys\n\n--- PDF PAGE 29 ---\nTR - Hairdressing NC II\nAmended November 2010\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nGenerated information on different client requirements\nand needs\n1.2\nSelected and used strategies to accurately analyzed the\nclient requirements\n1.3\nAssessed current product and services as against client\ndemand\n1.4\nIdentified avenues to establish relevant linkage\n1.5\nSelected promotional activities relevant to enhance\ncompetitiveness of salon\n1.6\nAssisted clients on specific desired services\n1.7\nChecked and prepared tools for the specific salon\nactivities\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nMedia Options\n2.2\nData Gathering\n2.3\nSalon Policies\n2.4\nInternational Market\n2.5\nSkills Competition Rules and Procedures\n2.6\nNew Trends in Products and Services\n2.7\nEthical Limitations\n\n3. Underpinning skills 3.1\nCommunication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.2\nTechnology Skills\n3.3\nInterpersonal Skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nClient\n4.3\nRelevant Information\n4.4\nAppropriate Products\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in a\n simulated environment.\n\n--- PDF PAGE 30 ---\nTR - Hairdressing NC II\nAmended November 2010\n26\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM PRE- AND POST- HAIR CARE ACTIVITIES\nUNIT CODE\n:\nHCS515301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in\nperforming pre- and post-hair care activities. These\ninclude the draping of the client, the application of\nshampoo and conditioner on hair and the blow-drying of\nhair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is assisted in accordance with salon procedures\n1.2\nBuilt of the client is assessed to determine\nappropriate size of drapery to be used\n1.3\nAppropriate clothing is provided according to the\ndesired type of service, size and built of the client\n1.4\nClient is advised to remove all jewelries and\naccessories\n2. Apply shampoo\nand/or conditioner on\nthe client\n2.1\nNecessary tool, supplies and materials are selected\nand prepared according to the type of service\n2.2\nHair is checked and analyzed to determine appropriate\nshampoo and/or conditioner to be used in accordance\nwith the type of hair damage\n2.3\nHair is shampooed and or/conditioned in accordance\nwith the type of service and established or\nacceptable procedures\n2.4 Where necessary, first-aid treatment is provided to the\nclient or health personnel\n2.5 Client’s safety and comfort is ensured during the\nentire process\n3. Blow-dry hair\n3.1\nHair is toweled dried and combed according to service\nrequirements\n3.2\nHair is blow-dried according to service requirements\nand established or acceptable procedures\n3.3 Finishing product is applied on blow-dried hair\naccording to product specifications\n3.4 Client’s safety and comfort are ensured during the\nentire process\n4. Perform post-service\nactivities\n4.1\nTools and equipment are cleaned, sanitized and\nstored according to OH&S requirements\n4.2\nWaste materials are segregated and disposed\naccording to OH&S requirements\n\n--- PDF PAGE 31 ---\nTR - Hairdressing NC II\nAmended November 2010\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clients’ built\n1.1\nSmall\n1.2\nMedium\n1.3\nLarge\n1.4\nExtra Large\n2. Type of services\n2.1\nHair Treatment\n2.2\nHair Color\n2.3\nHair Bleach\n2.4\nPerming\n2.5\nStraightening\n2.6\nHair Cut\n3. Tools\n3.1 Blower\n3.2 Brush\n3.3 Skeleton Brush\n3.4\nRoller Brush\n3.5\nPaddle Brush\n3.6\nMirror\n3.7\nHand/back Mirror\n3\n4. Supplies/Materials\n4.1\nShampoo\n4.2\nConditioner\n4.3\nTowel\n4.4\nTissue/neck strip\n5. Established or\nacceptable\nprocedures in hair\nshampooing and/or\nconditioning\nMay include but are not limited to:\n5.1 Comb/brush hair to free from entanglement before\nactual shampooing and/or conditioning\n5.2 Apply shampoo and/or conditioner according to the\nclients’ hair length and volume, and type of service\n5.3 Apply appropriate water temperature\n5.4 Follow shampooing and/or conditioning technique\n5.5 Rinse hair thoroughly and towel dry\n6. Established or\nacceptable\nprocedures in blow-\ndrying hair\nMay include but are not limited to:\n6.1 Set blower with correct temperature\n6.2 Apply appropriate sectioning using hair implements to\nachieve optimum results\n6.3 Apply blow-dry technique according to service\n requirements\n7. Hair finishing\nproducts\n7.1 Gel/Hair setting lotion\n7.2 Mouse\n7.3 Spray Net/hair spray\n7.4 Hair Polish/Serum\n7.5 Hair wax (wet and dry)\n7.6 Leave-on conditioner\n\n--- PDF PAGE 32 ---\nTR - Hairdressing NC II\nAmended November 2010\n28\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client according to salon policies and\nprocedures\n1.2\nPrepared and used of tools, supplies/materials according\nto type of service and OH&S requirements\n1.3\nApplied correct techniques in draping, shampooing and/or\nconditioning and blow-drying of hair in accordance with\nservice requirements and established or acceptable\nprocedures\n1.4\nEnsured client’s safety and comfort during the entire\nprocess\n1.5\nApplied questioning and listening skills in assessing the\nneed of clients\n2. Underpinning\nknowledge\n2.1\nSalon Policies and Procedures\n2.2\nDifferent Types of Shampoo and Conditioners\n2.3\nProper Use of Tools, Supplies and Materials\n2.4\nCode of Ethics\n2.5\nDifferent Types and Condition of Hair\n2.6\nOH & S Rules and Regulations\n2.7\nHair Analysis\n2.8\nWater Temperature\n2.9\nProper Hygiene\n2.10 Hair Finishing Products\n2.11 Different Salon Services\n3. Underpinning\nskills\n3.1\nConducting hair analysis\n3.2\nCommunication skills\n3.3\nDraping technique\n3.4\nShampooing and conditioning technique\n3.5\nHair blow-drying technique\n3.6\nSetting and using of tools and equipment\n3.7\nFollowing salon policies and procedures\n3.8\nHair sectioning\n3.9\nUsing supplies/materials and implements\n3.10 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 33 ---\nTR - Hairdressing NC II\nAmended November 2010\n29\nUNIT OF COMPETENCY :\nPERFORM HAIR AND SCALP TREATMENT\nUNIT CODE\n:\nHCS515302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required to\ntreat a range of hair and scalp conditions of clients. It\ninvolves preparation of clients, tools and equipment,\nactual treatment of hair and scalp and performance of\npost-treatment activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient’s health and restrictions are determined\nthrough consultation\n1.2\nClient’s scalp and hair condition are analyzed\nfollowing salon safety policies and procedures\n1.3\nProtective clothing is prepared and used according\nto OH&S requirements and salon procedures\n\n2. Treat hair condition\n2.1\nSupplies/materials and hair treatment product are\nselected and prepared according to client’s hair\ncondition\n2.2\nHair treatment is performed in accordance with\nestablished or acceptable procedures\n2.3 Result is checked according to client’s desired\noutcome\n2.4 Client’s safety and comfort is ensured during the entire\nprocess\n2.5 Where necessary, first-aid treatment is provided to the\nclient or referred to health personnel\n3. Treat scalp condition\n3.1\nScalp treatment product is selected and prepared\nbased on client’s scalp condition\n3.2\nScalp treatment is performed in accordance with\nestablished or acceptable procedures\n3.3 Result is checked according to client desired outcome\n3.4 Clients’ comfort and safety is ensured during the\nprocess\n3.5 Where necessary, first-aid treatment is provided to the\nclient or referred to health personnel\n4. Perform post-service\nactivities\n4.1\nTreatment products used are stored following salon\nprocedures\n4.2\nTools and equipment are cleaned, sanitized and\nstored according to OH&S requirements\n4.3\nWaste materials are segregated and disposed\naccording to OH&S requirements\n4.4\nClient is advised on appropriate hair and scalp\nmaintenance\n\n--- PDF PAGE 34 ---\nTR - Hairdressing NC II\nAmended November 2010\n30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Type of client\n\n1.1\nAdult\n1.2\nYoung Adult\n1.3\nTeenager\n2. Scalp condition\n2.1 Normal\n2.2 Oily\n2.3 Dry\n3. Hair condition\n3.1 Porous / Damaged\n3.2 Dry\n3.3 Oily\n3.4 Normal\n3.5 Chemically Treated\n4. Protective clothing\n4.1 Facial mask\n4.2\nApron\n4.3\nBath Towel\n4.4\nHead Band\n5. Tools and equipment\n5.1\nSteamer\n5.2\nBlower\n5.3\nHair brush\n5.4\nWide Toothed Comb\n5.5\nMixing bowls\n5.6\nHair clamps & clips\n5.7\nSpatula\n6. Supplies and materials\n6.1 Aluminum Foil\n6.2 Tissue Paper\n6.3 Cling Wrap\n6.4 Silicon brush\n6.5 Different treatment products\n7. Hair and scalp treatment\nproduct form\n7.1 Cream Form\n7.2\nLiquid Form\n7.3\nGel Form\n8. Established or acceptable\nprocedures in hair and scalp\ntreatment\nMay include but are not limited to:\n8.1 Apply treatment product according to product\nspecifications and massage hair and/or scalp\n8.2 Expose hair and/or scalp to heat if necessary,\n according to product specifications\n8.3 Follow correct timeline according to product\n specification\n8.4 Rinse hair thoroughly and towel or blow dry.\n\n9. Waste\n9.1 Biodegradable\n9.2 Non-Biodegradable\n10. Hair and scalp\nmaintenance\nHair and Scalp Frequent Treatment\nUse of Hair and Scalp Treatment Product\n\n--- PDF PAGE 35 ---\nTR - Hairdressing NC II\nAmended November 2010\n31\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared client through consultation according to salon\npolicies and procedures\n1.2\nPrepared and used tools, equipment, supplies and\nmaterials for hair and scalp treatment according to\nspecifications and OH&S requirements\n1.3\nUsed appropriate protective clothing and gadget following\nsalon policies and procedure\n1.4\nPerformed hair and scalp treatment according to product\nspecifications and established or acceptable procedures\n1.5 Ensured client’s safety and comfort during the entire\n process\n1.6 Performed post-service activities according to salon\n policies and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nSafety Practices\n2.2\nDifferent Treatment Products\n2.3\nMeasurements/Ratio and Proportion\n2.4\nCode of Ethics\n2.5\nSalon Policies and Procedures\n2.6\nHair and Scalp Treatment Procedures and Processes\n2.7\nHair Analysis\n2.8\nHair types and condition\n2.9\nTime Management\n2.10 DOH and OH&S requirements\n3. Underpinning\nskills\n3.1\nProper handling of tools\n3.2\nOperation of equipment\n3.3\nCommunication skills\n3.4\nApplication of treatment product\n3.5\nApplication of massage technique\n3.6\nChecking of hair and scalp condition\n3.7\nCompliance with DOH, OH&S requirements\n3.8\nSafekeeping of equipment and tools\n3.9\nCompliance to target treatment timeline\n3.10 Observing code of ethics\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with oral questioning\n5.2 Third-Party Report\n5.3 Portfolio\n6. Context of\nassessment\nAssessment may be conducted in the actual workplace or\nTESDA accredited assessment center\n\n--- PDF PAGE 36 ---\nTR - Hairdressing NC II\nAmended November 2010\n32\nUNIT OF COMPETENCY :\nPERFORM BASIC HAIR PERMING\nUNIT CODE :\nHCS515303\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in\nperforming basic hair perming. It involves assessing and\npreparing the client, actual performance of hair perming,\nchecking of result and doing necessary finishing touches\nto achieve optimum result.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is advised to remove all personal\naccessories\n1.2\nClient is provided with and advised to wear\nprotective clothing\n1.3\nCondition and type of hair are checked and\nanalyzed\n1.4\nPrevious chemical treatment applied on hair is\ndetermined\n1.5\nScalp condition is checked if free from scratches\nand open wounds\n1.6\nWhere necessary, client is advised to defer hair\nperming based on adverse scalp and health\nconditions\n1.7\nTypes of hair curls is confirmed with client and\nrecorded\n2. Perm hair\n2.1\nTools and equipment, supplies/ materials are\nprepared and used according to salon policies and\nprocedures and OH&S requirements\n2.2\nPerm solution is selected and prepared according\nto client’s hair type, texture/condition and product\nspecifications\n2.3\nHair perming is performed in accordance with\nestablished or acceptable procedures and\nproduct specifications\n2.4 Hair is rinsed thoroughly, towel-dried and\n conditioner is applied\n2.5 Clients’ safety and comfort are ensured during the\n entire process\n3. Apply finishing touches\n3.1\nHair is checked according to client’s desired\noutcome\n3.2\nHair is tapered / trimmed and styled if necessary\n3.3 Client’s satisfaction is confirmed and adjustments\nare made if required\n4. Perform post-service\nactivities\n4.1\nClient is advised on hair and care maintenance\n4.2\nTools, equipment, supplies and materials are\ncleaned and stored after use in accordance with\nsalon procedures\n4.3\nWaste items are properly disposed of in\naccordance with OH&S requirements\n4.4 Workstation is cleaned and prepared for next\n activity\n\n--- PDF PAGE 37 ---\nTR - Hairdressing NC II\nAmended November 2010\n33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hair Conditions\n1.1 Damaged\n1.2 Tinted\n1.3 Lightened\n1.4 Porous\n1.5 Dry\n1.6 Greasy or Oily\n1.7 Normal\n2. Scalp Condition\n2.1\nDry or Oily\n2.2\nDandruff\n2.3\nGreasy\n2.4\nWaxy\n2.5\nScaly\n3. Types of hair curls\n3.1\nWavy\n3.2\nCurly\n4. Tools and\nEquipment\n4.1\nDryer\n4.1.1\nHandheld, Hood, Infrared\n4.2\nCurler\n4.2.1 Small, Medium, Large, Extension, Extra Large,\nJumbo\n4.2.2 Wooden Spindle, Nooping, Spiral, Zigzag,\nTelephone Wire\n4.3\nApplicator\n4.4\nShower Cap\n4.5\nFlannel Headband\n4.6\nDrip Pan\n4.7\nCape\n4.8\nBath Towel\n4.9\nBath Comb\n4.10 Razor/Scissor\n4.11 Hairclips\n4.12 Apron\n4.13 End Paper\n4.14 Ear Pads\n4.15 Tail Comb\n4.16 Rubber Band\n4.17 Rubber Gloves\n5\nSupplies Materials\n5.1\nShampoo\n5.2\nPerm solution\n5.3\nNeutralizer\n5.4\nConditioner\n5.5\nEnd Paper\n5.6\nPowder\n5.7\nRoll tissue\n5.8\nCotton\n5.9\nRubber Band\n5.10 Disposable Gloves\n6. Established or\nacceptable\nprocedures in hair\nperming\nMay include but are not limited to:\n6.1\nShampoo hair without conditioner and without\nscratching the scalp\n6.2\nTowel dry, section and wind hair according to selected\ntypes of hair curls and apply selected perm solution\n6.3\nCover wounded hair with plastic cap/cling wrap or\nexpose to dry heat\n\n--- PDF PAGE 38 ---\nTR - Hairdressing NC II\nAmended November 2010\n34\nVARIABLE\nRANGE\n6.4\nCheck progress of wave from time to achieve optimum\nresult\n6.5\nRinse thoroughly without removing the curlers and towel\nblot\n6.6\nApply hair with neutralizer and leave-on on specified\ntime\n6.7\nRemove curlers / rollers and slightly massage hair and\nscalp\n6.8\nShampoo and condition hair thoroughly, rinse and towel-\ndry\n7. Hair care and\nmaintenance\n7.1\nUse of wide toothed comb\n7.2\nApplication of hair polishing products\n7.3\nDaily hair wash with appropriate shampoo and\nconditioner\n7.4\nRegular hair treatment\n\n--- PDF PAGE 39 ---\nTR - Hairdressing NC II\nAmended November 2010\n35\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consulted client on the type of curls required\n1.2\nAssessed hair and scalp condition as free from scratches\nand open wounds\n1.3\nProvided protective clothing to client\n1.4\nSelected and prepared perming solution according to\nclient’s requirements and manufacturer’s specifications\n1.5 Performed hair perming in accordance with established or\n acceptable procedures\n1.6\nEnsured clients safety and comfort throughout the whole\nprocess\n1.8 Applied final touch on hair according to client’s\nrequirements\n1.9 Applied appropriate measures in response to\nemergencies or unavoidable circumstances\n1.10 Performed post-service activities according to salon\npolicies and procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1\nCode of Ethics\n2.2\nOH & S Requirements\n2.3\nHair Texture / Condition\n2.4\nDifferent Scalp Condition\n2.5\nHeating Procedures\n2.6\nDifferent Perm Maintenance Program\n2.7\nTime Management\n2.8\nPrinciples of Customer Relations\n2.9\nDifferent Perming Products\n2.10 DOH – IRR and OH&S rules and regulations\n2.11 First-aid treatments\n3. Underpinning\nskills\n3.1\nListening and Questioning Skills\n3.2\nCustomer Relation Skills\n3.3\nObserving hair sectioning\n3.4\nApplying winding technique\n3.5\nApplying massage technique\n3.6\nTrimming\n3.7\nApplying shampooing and blow-drying techniques\n3.8\nHandling Tools and Equipment\n3.9\nUsing Perming Product\n3.10 Observing code of ethics\n3.11 Applying first-aid treatments\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to the\n activity to be performed\n4.3\nWork area/facilities\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with Oral Questioning\n5.2\nPortfolio\n5.3\nThird-Party Report\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 40 ---\nTR - Hairdressing NC II\nAmended November 2010\n36\nUNIT OF COMPETENCY:\nPERFORM BASIC HAIR COLORING\nUNIT CODE :\nHCS515304\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in the\nperformance of basic hair coloring. This involves\npreparing the client prior to treatment, the actual\napplication of coloring and post-coloring activity.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare client\n1.1\nClient is consulted and advised on color options,\nand checked for possible skin allergies\n1.2\nCondition of the hair and scalp are checked and\nanalyzed\n1.3 Protective clothing and materials are prepared\nand used according to OH&S requirements\n1.4\nClient is draped following established\nprocedures to avoid stains from hair coloring\n1.5 Where necessary, client’s hair is shampooed to\nremove remaining conditioners and styling\nproducts, making sure the scalp is not scratched\n\n2. Apply hair color\n2.1\n