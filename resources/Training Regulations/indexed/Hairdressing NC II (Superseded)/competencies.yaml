ce program \nundergo weekly hair \ntreatment. \n13.1     Hair Spa \n13.2 \nHair Reborn \n13.3 \nHot-Oil Treatment \n13.4 \nFrequent or Regular Salon Visit\n\n--- PDF PAGE 53 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n49"
