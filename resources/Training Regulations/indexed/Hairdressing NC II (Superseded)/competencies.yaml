        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted clients on specific basic make-up requirements\n1.2 Performed analysis of client’s face, skin tone and type in\naccordance with make-up requirements\n1.3 Prepared and used appropriate make-up tools, materials\nand accessories according to client’s make-up\nrequirements\n1.4 Applied make-up products based on product specifications\n1.5 Performed checking before applying finishing touches on\nclient\n1.6 Performed safe and sanitary procedures in handling client\n1,7 Applied appropriate measures in response to emergencies\n or unavoidable circumstances\n1.8 Performed post-service activities according to salon policies\nand procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1 Code of Ethics\n2.2 Different Facial Shapes\n2.3 Basic Facial Make-up Techniques\n2.4 Make-Up Procedure/Sequence\n2.5 Facial Skin and Type Analysis\n2.6 Make-Up Products\n2.7 Make–Up Techniques\n2.8 DOH- IRR and OH&S rules and regulations\n\n3. Underpinning\nskills\n3.1 Handling clients\n3.2 Contouring of face\n3.3 Handling of tools and materials\n3.4 Applying make-up/blending of colors as per requirement\n3.5 Finishing touches/recommendation for touch-up\n3.6 Observing code of ethics\n3.7 Applying first-aid treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools and supplies/materials relevant to the activity to be\nperformed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Portfolio\n5.3 Third -Party Report\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 58 ---\nTR - Hairdressing NC II\nAmended November 2010\n54"
        },
        "source_text": "HCS515314\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude in\napplying basic facial make-up. It also involves the\npreparation of the client, application of make-up and the\nperformance of post-facial make-up activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare clients\n1.1\nClient is advised to remove all personal\naccessories\n1.2\nClient is consulted on specific make-up\nrequirements\n1.3\nShapes of face and skin type / tones of client are\nanalyzed according to make-up requirements\n1.4\nClient is seated in a comfortable position during the\nentire process\n1.5\nClient is provided with protective clothing following\nsalon procedures\n\n2. Apply make-up\n2.1\nHand is sanitized before actual application of make-\nup\n2.2\nMake-up products and accessories, tools,\nsupplies and materials are selected and prepared\naccording to client make – up requirement\n2.3\nMake-up application is performed in accordance with\nestablished or acceptable procedures\n2.4 Make-up result is checked before application of\n finishing touches\n2.5 Client’s comfort and safety are ensured during the\nentire process\n3. Perform post-service\nactivities\n4.1\nClient is advised on appropriate product and\nprocedure in applying retouch and removing make-\nup\n4.2\nMake-up products, tools, materials and implements\nare cleaned and stored after use in accordance with\nsalon procedures\n4.3\nWaste items are properly disposed of in accordance\nwith OH&S requirements\n4.4\nWorkstation is cleaned and prepared for next activity\n\n--- PDF PAGE 55 ---\nTR - Hairdressing NC II\nAmended November 2010\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Personal Accessories\n1.1\nEarrings\n1.2\nNecklace\n1.3\nAny pierced items in the face\n\n2 Basic make-up\nrequirements\n2.1\nDay Make-Up\n2.2\nEvening Make-Up\n2.3\nBridal\n\n3 Shapes of face\n3.1\nRectangle or Elongated\n3.2\nInverted/Pear\n3.3\nHeart\n3.4\nOval\n3.5\nTriangular\n3.6\nSquare\n3.7\nDiamond\n3.8\nRound\n\n4 Skin type\n4.1\nDry\n4.2\nNormal\n4.3\nOily\n\n5 Skin tones\n5.1\nFair\n5.2\nLight\n5.3\nMedium\n5.4\nDark\n\n6 Protective clothing\n6.1\nTowel\n6.2\nHeadband\n6.3\nBib\n\n7. Make-up Product and\naccessories\n7.1\nMake-up products may include but are not limited:\n7.1.1. Concealer\n7.1.2. Cake of Liquid Foundation\n7.1.3. Blusher\n7.1.4. Eyeshadow\n7.1.5. Eye Liner (liquid/pencil/cake)\n7.1.6. Eye Brow Pencil\n7.1.7. Lip Pencil\n7.1.8. Lip Stick\n7.1.9. Mascara\n7.1.10. Face Powder\n7.2\nMake-up accessories may include but are limited to:\n7.2.1. Eye Gel\n7.2.2. Powder Glitter\n7.2.3. Artificial eye lashes\n\n--- PDF PAGE 56 ---\nTR - Hairdressing NC II\nAmended November 2010\n52\n\nVARIABLE\nRANGE\n8. Make-up tools,\nsupplies and materials\n8.1\nSponge\n8.2\nSharpener\n8.3\nCotton Buds\n8.4\nEyelash Curler\n8.5\nPowder Applicator\n8.6\nFlat brush\n8.6.1. Lip Brush\n8.6.2. Eye Liner Brush\n8.6.3. Eye Shadow Brush\n8.6.4. Large Eyebrow Brush\n8.6.5. Small Eyebrow Brush\n8.6.6. Large Blusher Brush\n8.6.7. Powder Brush\n8.6.8. Brow with Comb Brush\n8.7\nEye Brow Scissor\n8.8\nEye Brow Blade\n8.9\nTweezers\n\n9. Established or\nacceptable procedures\nin basic make-up\napplication\nMay include but are not limited to:\n9.1\nClean or wash face using cleansing products\n9.2\nApply foundation and concealer evenly on face and\nneck\n9.3\nApply cheek rouge to cover dark spots of the face\n9.4\nApply eyeshadow\n9.5\nApply fresh powder\n8.6\nEnhance or curl eyelashes with mascara\n8.7\nDefine eyebrow\n8.8\nEnhance eyelid with eyeliner\n8.9\nApply lipstick\n\n10. Make-up result\n10.1 Evenness of make-up application and proper\ndistribution (lightness and darkness of make-up)\n10.2 Essential application of make-up\n10.3 Blending of colors\n10.4 Appropriateness of make-up with the occasion\n10.5 Symmetry and balance of eyebrow arc and shape,\nand blush-on\n10.6 Face and lips contouring is achieved\n\n--- PDF PAGE 57 ---\nTR - Hairdressing NC II\nAmended November 2010\n53\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Consulted clients on specific basic make-up requirements\n1.2 Performed analysis of client’s face, skin tone and type in\naccordance with make-up requirements\n1.3 Prepared and used appropriate make-up tools, materials\nand accessories according to client’s make-up\nrequirements\n1.4 Applied make-up products based on product specifications\n1.5 Performed checking before applying finishing touches on\nclient\n1.6 Performed safe and sanitary procedures in handling client\n1,7 Applied appropriate measures in response to emergencies\n or unavoidable circumstances\n1.8 Performed post-service activities according to salon policies\nand procedures, and OH&S requirements\n2. Underpinning\nknowledge\n2.1 Code of Ethics\n2.2 Different Facial Shapes\n2.3 Basic Facial Make-up Techniques\n2.4 Make-Up Procedure/Sequence\n2.5 Facial Skin and Type Analysis\n2.6 Make-Up Products\n2.7 Make–Up Techniques\n2.8 DOH- IRR and OH&S rules and regulations\n\n3. Underpinning\nskills\n3.1 Handling clients\n3.2 Contouring of face\n3.3 Handling of tools and materials\n3.4 Applying make-up/blending of colors as per requirement\n3.5 Finishing touches/recommendation for touch-up\n3.6 Observing code of ethics\n3.7 Applying first-aid treatment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Model\n4.2 Tools and supplies/materials relevant to the activity to be\nperformed\n4.3 Work area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration with Oral Questioning\n5.2 Portfolio\n5.3 Third -Party Report\n6. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 58 ---\nTR - Hairdressing NC II\nAmended November 2010\n54"
      }
