        "source_title": "PERFORM HAIR STRAIGHTENING",
        "source_text": "--- PDF PAGE 51 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n47 \nUNIT OF COMPETENCY: \nPERFORM HAIR STRAIGHTENING \n \nUNIT CODE                    : \nHCS515308 \n \nUNIT DESCRIPTOR       : \nThis unit covers the knowledge, skills and attitudes in \nstraightening hair.  This includes preparing the client, \napplying hair straightening product, ironing of hair and \nchecking and retouching on the result. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare client \n1.1 \nClient is advised to remove all personal accessories \n1.2 \nProtective clothing and gadgets are used to ensure \nclients safety and comfort \n1.3 \nClient hair texture and condition, together with scalp are \nchecked and analyzed \n1.4 \nPrevious hair treatment is confirmed with the client before \ndoing the desired service \n1.5 \nClient is draped and shampooed without scratching the \nscalp    \n2.  Apply hair \nstraightening \nproduct \n2.1 \nNecessary tools and materials are prepared and used \naccording to OH&S requirements \n2.2 \nDifferent forms of products are identified and/or mixed \nbased on types of hair and desired hair straightening \nservice in accordance with manufacturers’ instruction \n2.3 \nHair straightening is performed  in accordance with \nproduct specifications and established or acceptable \nprocedures \n2.4    Client’s safety and comfort are ensured during the  \n         entire process \n2.5    Where necessary, first-aid treatment is provided to client \nor referred to health personnel \n3.  Iron Hair \n3.1 \nHair is blow-dried according to salon procedures \n3.2 \nProtective hair product is applied through the hair \nbefore actual ironing \n3.3 \nIron plate is set in accordance with hair condition \n3.4 \nHair is sub-sectioned according to salon procedures \n3.5 \nHair is ironed in accordance with salon procedures \n4.  Apply hair fixing \nsolution \n4.1 \nFixing solution is applied on the hair in accordance with \nmanufacturer’s instructions \n4.2 \nProcessing time is followed according to manufacturer’s \ninstructions \n4.3 \nHair is rinsed thoroughly and applied with necessary \ntreatment \nproducts \naccording \nto \nmanufacturers’ \ninstructions \n4.4 \nResult is checked and hair is styled according to clients’ \ndesired outcome \n5.  Perform post \nservice activities \n5.1 \nClient is advised on  hair care and maintenance  \n5.2 \nTools, implements and equipments are cleaned, \nsterilized/sanitized and stored after use in accordance \nwith salon procedures \n5.3 \nWaste items are properly disposed of in accordance with \nOH&S requirements \n5.4 \nWorking area is cleaned in preparation for the next client\n\n--- PDF PAGE 52 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n48 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Personal accessories \n1.1 \nEarrings \n1.2 \nNecklace \n2. \nProtective clothing and  \ngadgets \n2.1    Rubber Cape \n2.2    Bath Towel \n2.3    Ear Pads \n2.4    Apron \n2.5    Gloves \n2.6     Mask \n3.  Hair Texture \n3.1 \nFine  \n3.2 \nMedium \n3.3 \nThick  \n4.   Hair Condition \n4.1 \nDry \n4.2 \nPorous / Damaged \n4.3 \nSensitized \n5.   Tools  \n5.1     Mixing Bowl \n5.2     Scoop or Spatula \n5.3 \nTail Comb \n5.4 \nHand Blower \n5.5 \nHair Brush \n5.6 \nClips or Clamps \n5.7 \nLarge Tooth  Comb  \n5.8 \nHair Iron \n6. Supplies and Materials \n6.1     Shampoo \n6.2 \nStraightening \n6.3 \nConditioner \n6.4 \nStyling Products \n6.5 \nNeutralizer \n6.6 \nTissue \n7. Different forms of \nstraightening product \n7.1     Cream \n7.2     Liquid \n7.3     Powder \n8.   Types of hair \n8.1     Wavy \n8.2     Curly \n8.3     Straight \n9.   Types of hair \nstraightening services \n9.1     Relaxing \n9.2     Rebonding \n9.3     Permanent Blow Dry \n10.  Established or \nacceptable procedures \nin hair straightening \nMay include but are not limited to: \n10.1 Section hair \n10.2 Apply hair straightening product on the hair and leave-on \non specified time \n10.3 Check hair to monitor progress of straightening \n10.4 Follow development time according to product \nspecifications and hair condition \n10.5 Rinse hair thoroughly and towel dry \n11. Protective hair and scalp \nproduct \n11.1 \nLiquid form  \n11.2 \nTalcum Powder \n11.3 \nCream \n12.   Setting of iron plate \ntemperature  \n12.1     120 degrees F \n12.2 \n160 degrees F         \n12.3 \n180 degrees F \n12.4 \n200 degrees F \n13. Hair care and \nmaintenance program \nundergo weekly hair \ntreatment. \n13.1     Hair Spa \n13.2 \nHair Reborn \n13.3 \nHot-Oil Treatment \n13.4 \nFrequent or Regular Salon Visit\n\n--- PDF PAGE 53 ---\nTR - Hairdressing NC II \nAmended  November 2010 \n49 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 \nConsulted  and prepared client on the desired type of hair \nstraightening services and its procedures \n1.2     Prepared and used tools, supplies/materials and protective \nclothing  according to job requirements and OH&S \nrequirements \n1.3    Selected and prepared hair-straightening products according    \nto client’s type of hair and product specifications \n1.4    Performed hair straightening in accordance with established \nor acceptable procedures \n1.5     Applied protective product on the hair before ironing it \n1.6 \n Ironed hair according to appropriate direction, timeline and \ntemperature following salon procedures \n1.7     Ensured client’s safety and comfort during the entire process \n1.8     Applied appropriate measures in response to emergencies \nand unavoidable circumstances  \n1.9     Performed post-service activities according to salon policies  \n          and procedures, and OH&S requirements \n2. Underpinning \nknowledge  \n2.1 \nCode Of Ethics \n2.2 \nSalon Procedures/Policies \n2.3 \nHair Sectioning \n2.4 \nHair Blow-dry Technique \n2.5 \nHair Types and Texture \n2.6 \nHair and Scalp Condition \n2.7 \nDifferent Tools And Materials: Their uses and specifications \n2.8 \nDifferent Supplies And Products \n2.9 \nStraightening Product and Its Application Procedures \n2.10 DOH – IRR and OH&S Rules and Regulations \n2.11 Hair Iron Temperature \n2.12 Development Time Requirements \n2.13 First-aid Treatment \n \n3. Underpinning \nskills \n3.1 \nConducting hair and scalp analysis \n3.2 \nUsing tools and materials \n3.3 \nUsing and applying straightening product of different forms \n3.4 \nApplying hair and scalp protective products \n3.5 \nPerforming hair sectioning \n3.6 \nBlow-drying technique \n3.7 \nIroning technique \n3.8 \nShampooing technique \n3.9 \nChecking of result \n3.10 Draping of clients \n3.11 Observing code of ethics \n3.12 Applying first-aid treatment \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nModel \n4.2     Tools, equipment and supplies/materials relevant to the \nactivity to be performed \n4.3      Work area/facilities  \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDemonstration with Oral Questioning \n5.2  \nPortfolio \n5.3  \nThird-Party Report \n6. Context of \nassessment \nCompetency may be assessed in the workplace or  TESDA \naccredited assessment center\n",
