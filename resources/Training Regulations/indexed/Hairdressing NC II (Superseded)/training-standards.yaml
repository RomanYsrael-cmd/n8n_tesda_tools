  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for HAIRDRESSING NC II.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; trainers qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: HAIRDRESSING\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hrs (Basic)\n\n 18 Hrs (Common)\n\n 620Hrs (Core)\n\n 656 Total Hours\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nhairdressers in accordance with industry standards. It covers the basic, common and\ncore competencies in Hairdressing NC II.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunicati\non\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role playing\n3. Practice\ncareer\nprofessionali\nsm\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Group\nDiscussion\n• Plant tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 59 ---\nTR - Hairdressing NC II\nAmended November 2010\n55\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply quality\nstandards\n\n1.1\nAssess clients service\nneeds\n1.2\nAssess own work\n1.3\nEngage in quality\nimprovement\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n2. Maintain a\nsafe, clean\nand efficient\nwork\nenvironment\n2.1\nComply with health\nregulations\n2.2\nPrepare and maintain\nwork area\n2.3\nCheck and maintain\ntools and equipment\n2.4\nCheck and maintain\nstocks\n2.5\nProvide a relaxed and\ncaring environment\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n3.1\nMaintain a professional\nimage\n3.2\nBuild credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n4. Manage own\nperformance\n4.1\nPlan completion of own\nworkload\n4.2\nMaintain quality of own\nperformance\n\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n--- PDF PAGE 60 ---\nTR - Hairdressing NC II\nAmended November 2010\n56\nCORE COMPETENCIES\n(620 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre\nand post hair\ncare\nactivities\n1.1 Prepare client\n1.2 Apply shampoo and/or\nconditioner to client\n1.3 Blow-dry hair\n• Lecture\n• Discussion\n• Demonstration\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n2. Perform hair\nand scalp\ntreatment\n2.1 Prepare client\n2.2 Treat hair and scalp\n condition\n2.3 Perform post-service\n activities\n• Lecture\n• Discussion\n• Demonstration\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Perform\nbasic hair\nperming\n3.1 Prepare client\n3.2 Perm hair\n3.3 Apply finishing touches\n3.4 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n4. Perform\nbasic hair\ncoloring\n4.1 Prepare client\n4.2 Apply hair color\n4.3 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n5. Perform\nbasic\n haircutting\n5.1 Prepare client\n5.2 Cut hair\n5.3 Check and apply\nappropriate finishing\ntouches\n5.4 Perform post- service\n activities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6. Perform hair\nbleaching\n\n6.1 Prepare client,\n6.2 Bleach hair\n6.3 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n7. Perform hair\nstraightening\n7.1 Prepare client\n7.2 Apply hair\n straightening product\n7.3 Iron hair\n7.4 Apply fixing solution\n7.5 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n8. Apply basic\nmake-up\n\n8.1 Prepare client\n8.2 Apply make-up\n8.3 Perform post-service\n activities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 61 ---\nTR - Hairdressing NC II\nAmended November 2010\n57\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or\ncomputer technologies.\n• Project-based instruction is an authentic instructional model strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 62 ---\nTR - Hairdressing NC II\nAmended November 2010\n58\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these qualifications should\n\npossess the following requirements:\n\n-\nMust be able to communicate effectively both orally and in written form\n-\nMust be physically, emotionally and mentally fit\n-\nMust\nbe\nable\nto\nperform\nbasic\nmathematical\ncomputations(Fundamental Operations)\n-\nMust secure a medical certificate for fitness to handle chemicals\n\nNote to students: Because many chemical sprays and airborne pollutants are found in this\nqualification, students are advised to consult their physicians as to possible\nproblems (i.e., allergies, asthma, dermatitis, etc.) before enrolling.\n\n3.4\nTOOLS, EQUIPMENT AND MATERIALS\nHAIRDRESSING – NC II\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for Hairdressing NC II are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nSUPPLIES AND\nMATERIALS\nBRUSH\n6 units Blower/Hair Dryer\n\nAlcohol, 500 ml.\n\nApplicator brush\n6 pcs.\nCrimpers\n\nAluminum foil\n\nBarber brush\n6 units Curling Iron\n\n Powder, 500 grams\n\nHair brush\n3 units Electric Curlers\n(optional)\n\nBlade\n\nPaddle brush\n6 units Hydraulic chair\n\nCling Wrap, rol\n\nRoller brush\n3 units High chair\n\nConditioner, 1 gal\n\nSkeleton brush\n6 units Stool\n\nColor product form:\nCream, Liquid &\nPowder\n\nTinting brush\n25 pcs. Arm Chair\n\nTinting brush\nwith comb*\n2 sets\nShampoo bowl set\n\nTowel*\n(Black and White)\nFor demo – 1 dozen\n\nSilicon brush\n 1 unit\nHeating cap\n(optional)\n\n1 unit\nInfrared\n\nCurling rod\n1 unit\nIron Plate\n\nCAP\n1 unit\nHair steamer\n\nDeveloper , 6% 20\nvolumes; 9% 30\nvolumes; 12% 40\nvolumes, 500 ml.\neach\n\nFrosting Cap w/\n 1 unit\nSterilizer\n\n--- PDF PAGE 63 ---\nTR - Hairdressing NC II\nAmended November 2010\n59\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nSUPPLIES AND\nMATERIALS\nHook\n\nShower cap\n2 pcs.\nTimer\n\nEar pads\n\nEnd paper\nCLIPS\n\nBleaching product\n(powder, cream and\nliquid)\n\nHair clips, 1 doz.\nSingle prong clip\n(optional)\n\nSetting lotion\n\nDouble prong\nclip (optional)\n\nGauze mask\n\nCOMB\n\nGel*, 500 ml.\n\nAll purpose\ncomb\n\nHairpiece\n\nBath comb\n\nHair polish\n\nApro comb\n\nHair wax, 500 ml.\n\nHaircutting\ncomb\n\nPaper strip\n\nLarge tooth\ncomb\n\nMousse\n\nTail comb\n\nPerm lotion w/\nneutralizer, 500 ml.\n\nTeasing comb\n\nWide toothed\ncomb\n\nPlastic applicator\nGLOVES\n\nPress spray plastic\ndispenser bottle\n\nDisposable\ngloves\n\nRubber band, box\n\nRubber gloves\n\nShampoo, gal\nMIRROR\n\nSpray net, 500 ml.\n\nModular mirror\n(movable)\n\n10\npcs.\nHand mirror\n\nTissue paper\nPIN\n\nTissue roll\n\nClamps\n\nWig\n\nHairpin, box\n\nHair treatment\nproducts\n\nDuck bill clamp\n\nInvisible pins\n\nPin curl clips, 5\ndoz.\n\nRoller pin, pcs.,\n\n--- PDF PAGE 64 ---\nTR - Hairdressing NC II\nAmended November 2010\n60\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nSUPPLIES AND\nMATERIALS\n5 doz\nPROTECTIVE CLOTHING/\nACCESSORIES\n\nApron\n\nCape\n\nFlannel\nheadband\n\nHead band\n\nInvisible hairnet\n\nNeck strip\n\nPlastic cape\n\nSmock gown\n\nROLLERS\n\nTraining Materials:\n\nCylinder shaped\nrollers (long and\nshort)\n\nCATALOG\n\nJumbo rollers\n\n1\nMen’s Cut Catalog\n\nLarge size\nrollers\n\n1\nLadies Cut Catalog\n\nMedium size\nrollers\n\n1\nKid’s Cut Catalog\n\nSmall size hair\nrollers wire\n(optional)\n\nMagazines\nSCISSORS\n\nTextbooks/\nReferences\n\nCutting scissor\n\nThinning scissor\n\n1 pc.\nWhite board (big)\n\n5 pcs.\nMarkers (assorted\ncolors)\n\nClippers\n\n1 pc.\nEraser\n\nDrip pan\n\nMeasuring cup\n\nMixing bowls\n\nScoop\n\nRazors\n\nSpatula\n\nSqueezer\n\nSpray gun\n\nMAKE - UP\n\nEyelash curler\n\nEye liner brush\n\nSponge\n(natural and sea)\n\nEyebrow pencil\nSharpener\n\nCotton buds\n\nLarge blusher\nbrush\n\nPowder applicator\n\nPowder brush\n\nAssorted color\nlipstick (palette,\n\n--- PDF PAGE 65 ---\nTR - Hairdressing NC II\nAmended November 2010\n61\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nSUPPLIES AND\nMATERIALS\nstick and pencil)\n\nFan brush\n\nConcealer\nfoundation\n\nLip brush\n\n• Liquid\n\nEyebrow brush\n(Large and\nsmall)\n\n• Cream\n\nEye shadow\nbrush\n\n• Cake\n\nEye brow\nscissor\n\nBlusher\n(powder and cake)\n\nAngle brush\n\nEye brow pencil\n\nEye brow blade\n\nEye shadow\n(pencil and cake)\n\nEyebrow\nTweezer\n\nEye liner\n(pencil, liquid, cake)\n\nTrolley/supply\ntray\n\nLip gloss\n\nMascara\n\nPowder\n\n• Pressed\n\n• Loose powder\n\n• Translucent\n\nEyelash glue\n\nGlitter gel\n\nEye gel\n\nStoned glitter\n\nPowder glitter\n\nArtificial eye lashes\n\nTissue\n\nCotton\n\nAlcohol\n\n•\nAll tools, supplies and materials will be provided by the students and\n•\nAt least 1 set to be provided by the training center/institution for demo purposes.\n\n--- PDF PAGE 66 ---\nTR - Hairdressing NC II\nAmended November 2010\n62\n3.5\nTRAINING FACILITIES\n\n Based on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nStudent/Trainee Working\nSpace\n\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource Center\n\n3 x 5 m.\n15 sq. m.\n15 sq. m.\n\nFacilities/Equipment/\nCirculation Area\n\n6 x 4 m.\n24 sq. m.\n24 sq. m.\nTotal :\n104 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR HAIR DRESSING NC II\n\n TRAINER QUALIFICATION (TQ II)\n\n• Must have completed Training Methodology Course\n• Must be able to communicate effectively both orally and in writing\n• Must be physically, emotionally and mentally fit\n• Must be a holder of Hairdressing NC III certificate\n• Must have at least two (2) years relevant teaching experience\n• Must possess good moral character\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is\n\nissued for each unit of competency.\n\n--- PDF PAGE 67 ---\nTR - Hairdressing NC II\nAmended November 2010\n63"
