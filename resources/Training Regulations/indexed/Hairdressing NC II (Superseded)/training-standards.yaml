    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: HAIRDRESSING\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hrs (Basic)\n\n 18 Hrs (Common)\n\n 620Hrs (Core)\n\n 656 Total Hours\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nhairdressers in accordance with industry standards. It covers the basic, common and\ncore competencies in Hairdressing NC II.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunicati\non\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Written test\n• Practical/\nperformance\ntest\n• Interview\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role playing\n3. Practice\ncareer\nprofessionali\nsm\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazards and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Group\nDiscussion\n• Plant tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 59 ---\nTR - Hairdressing NC II\nAmended November 2010\n55\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply quality\nstandards\n\n1.1\nAssess clients service\nneeds\n1.2\nAssess own work\n1.3\nEngage in quality\nimprovement\n• Group\nDiscussion\n• Interaction\n\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n2. Maintain a\nsafe, clean\nand efficient\nwork\nenvironment\n2.1\nComply with health\nregulations\n2.2\nPrepare and maintain\nwork area\n2.3\nCheck and maintain\ntools and equipment\n2.4\nCheck and maintain\nstocks\n2.5\nProvide a relaxed and\ncaring environment\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n3.1\nMaintain a professional\nimage\n3.2\nBuild credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n4. Manage own\nperformance\n4.1\nPlan completion of own\nworkload\n4.2\nMaintain quality of own\nperformance\n\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n--- PDF PAGE 60 ---\nTR - Hairdressing NC II\nAmended November 2010\n56\nCORE COMPETENCIES\n(620 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre\nand post hair\ncare\nactivities\n1.1 Prepare client\n1.2 Apply shampoo and/or\nconditioner to client\n1.3 Blow-dry hair\n• Lecture\n• Discussion\n• Demonstration\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n2. Perform hair\nand scalp\ntreatment\n2.1 Prepare client\n2.2 Treat hair and scalp\n condition\n2.3 Perform post-service\n activities\n• Lecture\n• Discussion\n• Demonstration\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n3. Perform\nbasic hair\nperming\n3.1 Prepare client\n3.2 Perm hair\n3.3 Apply finishing touches\n3.4 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n4. Perform\nbasic hair\ncoloring\n4.1 Prepare client\n4.2 Apply hair color\n4.3 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n5. Perform\nbasic\n haircutting\n5.1 Prepare client\n5.2 Cut hair\n5.3 Check and apply\nappropriate finishing\ntouches\n5.4 Perform post- service\n activities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n6. Perform hair\nbleaching\n\n6.1 Prepare client,\n6.2 Bleach hair\n6.3 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n7. Perform hair\nstraightening\n7.1 Prepare client\n7.2 Apply hair\n straightening product\n7.3 Iron hair\n7.4 Apply fixing solution\n7.5 Perform post-service\nactivities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n8. Apply basic\nmake-up\n\n8.1 Prepare client\n8.2 Apply make-up\n8.3 Perform post-service\n activities\n• Lecture/\nDemonstration\n• OJT\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 61 ---\nTR - Hairdressing NC II\nAmended November 2010\n57"
