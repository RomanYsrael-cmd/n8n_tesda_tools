ritten examination\n3.6\nRole Plays\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or\nany appropriately simulated environment\n\n--- PDF PAGE 21 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 17\nUNIT OF COMPETENCY\n: PROPOSE METHODS OF APPLYING LEARNING AND\nINNOVATION IN THE ORGANIZATION\n\nUNIT CODE\n: 400311323\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes\nrequired to assess general obstacles in the application of\nlearning and innovation in the organization and to propose\npractical methods of such in addressing organizational\nchallenges.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\ninnovative\npractices\n1.1 Reasons for innovation\nare incorporated to work\nprocedures\n1.2 Models of innovation\nare researched\n1.3 Gaps or barriers to\ninnovation in one’s work\narea are analysed\n1.4 Staff who can support\nand foster innovation in\nthe work procedure are\nidentified\n\n1.1 Seven habits of\nhighly effective\npeople\n1.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n1.3 Five minds of the\nfuture concepts\n(Gardner, 2007)\n1.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n1.5 Trans theoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992)\n1.1 Demonstrating\ncollaboration and\nnetworking skills.\n1.2 Applying basic\nresearch and\nevaluation skills\n1.3 Generating\ninsights on how to\nimprove\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n\n--- PDF PAGE 22 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 18\n2. Generate\npractical\naction plans\nfor improving\nwork\nprocedures,\nprocesses\n2.1 Ideas for innovative work\nprocedure to foster\ninnovation using\nindividual and group\ntechniques are\nconceptualized\n2.2 Range of ideas with\nother team members and\ncolleagues are evaluated\nand discussed\n2.3 Work procedures and\nprocesses subject to\nchange are selected\nbased on workplace\nrequirements (feasible\nand innovative)\n2.4 Practical action plans are\nproposed to facilitate\nsimple changes in the\nwork procedures,\nprocesses and systems\n2.5 Critical inquiry is\napplied and used to\nfacilitate discourse on\nadjustments in the\nsimple work procedures,\nprocesses and systems\n2.1 Seven habits of\nhighly effective\npeople\n2.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n2.3 Five minds of the\nfuture concepts\n(Gardner, 2007)\n2.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n2.5 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992)\n\n2.1 Assessing\nreadiness for\nchange on simple\nwork procedures,\nprocesses and\nsystems\n2.2 Generating\ninsights on how to\nimprove\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n2.3 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization\n\n--- PDF PAGE 23 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 19\n3. Evaluate the\neffectiveness\nof the\nproposed\naction plans\n3.1 Work structure is\nanalysed to identify the\nimpact of the new work\nprocedures\n3.2 Co-workers/key\npersonnel is consulted to\nknow who will be\ninvolved with or affected\nby the work procedure\n3.3 Work instruction\noperational plan of the\nnew work procedure is\ndeveloped and\nevaluated.\n3.4 Feedback and\nsuggestion are recorded\n3.5 Operational plan is\nupdated\n3.6 Results and impact on\nthe developed work\ninstructions are reviewed\n3.7 Results of the new work\nprocedure are evaluated\n3.8 Adjustments are\nrecommended based on\nresults gathered\n3.1 Five minds of the\nfuture concepts\n(Gardner, 2007)\n3.2 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n3.3 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992)\n3.1 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n3.2 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization\n3.3 Communicating\nresults of the\nevaluation of the\nproposed and\nimplemented\nchanges in the\nworkplace\nprocedures and\nsystems\n3.4 Developing action\nplans for\ncontinuous\nimprovement on\nthe basic\nsystems,\nprocesses and\nprocedures in the\norganization\n\n--- PDF PAGE 24 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Reasons\nMay include:\n1.1 Strengths and weaknesses of the current systems,\nprocesses and procedures.\n1.2 Opportunities and threats of the current systems,\nprocesses and procedures.\n2. Models of Innovation\nMay include:\n2.1 Seven habits of highly effective people.\n2.2 Five minds of the future concepts (Gardner, 2007).\n2.3 Neuroplasticity and adaptation strategies.\n3. Gaps or Barriers\nMay include:\n3.1 Machine\n3.2 Manpower\n3.3 Methods\n3.4 Money\n4. Critical Inquiry\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See our pages:\nVerbal Communication and Effective Speaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key part of\neffective negotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 25 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 21\nEVIDENCE GUI