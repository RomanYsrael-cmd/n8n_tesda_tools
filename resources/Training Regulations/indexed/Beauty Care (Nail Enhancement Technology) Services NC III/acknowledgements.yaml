e:\n2.1. Brainstorming\n2.2. Intuitions/Logic\n2.3. Cause and effect diagrams\n2.4. Pareto analysis\n2.5. SWOT analysis\n2.6. Gant chart, Pert CPM and graphs\n2.7. Scattergrams\n3. Problems\n\nMay include:\n3.1. Routine, non – routine and complex workplace and\nquality problems\n3.2. Equipment selection, availability and failure\n3.3. Teamwork and work allocation problem\n3.4. Safety and emergency situations and incidents\n3.5. Risk assessment and management\n4. Action Plans\n\nMay include:\n4.1. Priority requirements\n4.2. Measurable objectives\n4.3. Resource requirements\n4.4. Timelines\n4.5. Co-ordination and feedback requirements\n4.6. Safety requirements\n4.7. Risk assessment\n4.8. Environmental requirements\n\n--- PDF PAGE 17 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 13\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nExamined specific workplace challenges.\n1.2.\nAnalyzed the causes of specific workplace\nchallenges.\n1.3.\nFormulated resolutions to specific workplace\nchallenges.\n1.4.\nImplemented action plans and communicated\nresults on specific workplace challenges.\n2. Resource Implications\n2.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nObservation\n3.2.\nCase Formulation\n3.3.\nLife Narrative Inquiry\n3.4.\nStandardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over\na range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n\nThese assessment activities should include a range of\nproblems, including new, unusual and improbable\nsituations that may have happened.\n4. Context for\nAssessment\n4.1 In all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 18 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 14\nUNIT OF COMPETENCY : WORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n: 400311322\n\nUNIT DESCRIPTOR\n: This unit covers the outcomes required to work effectively in\na workplace characterized by diversity in terms of religions,\nbeliefs, races, ethnicities and other differences.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop an\nindividual’s\ncultural\nawareness\nand sensitivity\n1.1 Individual differences with\nclients, customers and\nfellow workers are\nrecognized and respected\nin accordance with\nenterprise policies and\ncore values\n1.2 Differences are\nresponded to in a\nsensitive and considerate\nmanner\n1.3 Diversity is\naccommodated using\nappropriate verbal and\nnon-verbal\ncommunication\n1.1 Understanding\ncultural diversity in\nthe workplace\n1.2 Norms of behavior\nfor interacting and\ndialogue with\nspecific groups\n(e. g., Muslims and\nother non-\nChristians, non-\nCatholics,\ntribes/ethnic\ngroups, foreigners)\n1.3 Different methods\nof verbal and non-\nverbal\ncommunication in\na multicultural\nsetting\n1.1 Applying cross-\ncultural\ncommunication\nskills (i.e.\ndifferent business\ncustoms, beliefs,\ncommunication\nstrategies)\n1.2 Showing affective\nskills –\nestablishing\nrapport and\nempathy,\nunderstanding,\netc.\n1.3 Demonstrating\nopenness and\nflexibility in\ncommunication\n1.4 Recognizing\ndiverse groups in\nthe workplace\nand community\nas defined by\ndivergent culture,\nreligion, traditions\nand practices\n2. Work effectively\nin an\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n2.1 Knowledge, skills and\nexperiences of others are\nrecognized and\ndocumented in relation to\nteam objectives\n2.2 Fellow workers are\nencouraged to utilize and\nshare their specific\nqualities, skills or\nbackgrounds with other\nteam members and\nclients to enhance work\noutcomes\n2.3 Relations with customers\nand clients are\n2.1 Value of diversity in\nthe economy and\nsociety in terms of\nWorkforce\ndevelopment\n2.2 Importance of\ninclusiveness in a\ndiverse environment\n2.3 Shared vision and\nunderstanding of\nand commitment to\nteam, departmental,\nand organizational\ngoals and objectives\n2.1 Demonstrating\ncross-cultural\ncommunication\nskills and active\nlistening\n2.2 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n2.3 Demonstrating\ncollaboration skills\n\n--- PDF PAGE 19 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 15\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nmaintained to show that\ndiversity is valued by the\nbusiness\n2.4 Strategies for\ncustomer service\nexcellence\n2.4 Exhibiting\ncustomer service\nexcellence\n3. Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n3.1 Diversity-related\nconflicts within the\nworkplace are effectively\naddressed and resolved.\n3.2 Discriminatory behaviors\ntowards\ncustomers/stakeholders\nare minimized and\naddressed accordingly\n3.3 Change management\npolicies are in place\nwithin the organization\n3.1 Value, and leverage\nof cultural diversity\n3.2 I