hair and\nscalp treatment\nPerform basic\nhair coloring\nPerform basic\nhair bleaching\nPerform basic\nhair perming\nPerform hair\nstraightening\nPerform basic\nhaircutting\nPerform advanced\nand creative\nhaircutting\nPerform\nadvanced and\ncreative hair\ncoloring\nPerform advanced\nand creative hair\nperming\nPerform basic\nmen’s\nhaircutting\nPerform shave\nand style beard\nand mustache\nPerform chair\nmanipulative\nrelaxing services\nPerform\nmanicure and\npedicure\nPerform hand\nand foot spa\nPerform\npreparatory\nactivities\nPrepare appropriate\nproducts, tools and\nequipment\nPerform nail\nenhancement\ntechnology\nprocedures\nPerform post\nservice activities\nPerform\nadvanced nail\npolish\nprocedures\nApply facial\nmake-up\nPerform body\nbleach\n\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 150 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 146\nGLOSSARY OF TERMS\n\nACCELERATOR\n-\nspeed increasing control: a pedal or control mechanism used to\ncause vehicle to increase speed.\nACRYLIC\n-\na synthetic textile fiber produced from acrylonitrile\nBUFF\n-\npolish something: to clean or polish something with a piece of soft\nmaterials.\nCALLUS\n-\npatch of thickened skin: a hard-thickened area of skin, especially on\nthe palm of the hand or the sole of the foot caused by repeated\npressure or friction.\nCOSMETICS\n-\nmeans any substance or preparation intended to be placed in\ncontact with the various external parts of the human body\nCUTICLE\n-\nSkin at base of nails: an edge of hard skin at the base of a fingernails\nor toenails.\nDEACTIVATOR\n-\nIngenious device: a small device that performs or aids a simple task\nDEHYDRATOR\n-\nan electrical appliance for drying, consisting of a stack of interlocking\ntrays through which heated air is circulated\nECOLOGICAL\nSOLID WASTE\nMATERIALS\n-\nshall refer to the systematic administration of activities which provide\nfor segregations at source, segregated transportation, storage,\ntransfer, processing, treatment, and disposal of solid waste and all\nother waste management activities which do not harm the\nenvironment.\nETHICS\n-\nstudy of morality’s effect on conduct: the study of moral standards\nand how they affect conduct.\nEXPIRY OR\nEXPIRATION\nDATE\n-\nmeans the date stated in the label of a drug or device after which the\ndrug is not expected to retain its claimed safety, efficacy and quality\nor potency or after which it is not permissible to sell the drug or device\n(As amended by E.O. 175)\nFIRST AID -\nmeans immediate assistance given in case of injury until Medical aid\nhas been obtained\nFREE EDGE\n-\nthe part of the nail that extends beyond the fingertips\nGEL POLISH\n-\nthese manicures are gentle to the natural nail and the polish stays\nintact on the nail for at least a couple of weeks with high shine and\nno cracking, peeling or chipping. (dry under direct UV or LED light\ncontact)\nGOGGLES\n-\nprotective eyeglasses: protective eyeglasses, usually made of\nplastic or glass and fitting tight to the face.\nHAZARDOUS\n-\nmeans likely to cause harm or injury in certain circumstances\nHAZARDOUS\nWASTE\n-\nshall refer to solid or combination of solid waste which because of its\nquantity, concentration, or physical, chemical or infectious\ncharacteristics may cause, or significantly contribute to an increase\nin mortality or an increase in serious irreversible, or incapacitating\nreversible, illness; or pose a substantial present or potential hazard\nto human health or the environment when improperly treated, stored,\ntransported, or disposed of, or otherwise managed.\nHYGIENE\n-\npreservation of health: the science dealing with the preservation of\nhealth.\nINFECTIOUS\n-\ncommunicable: describes a disease that is capable of being passed\nfrom one person to another\n\n--- PDF PAGE 151 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 147\nLABEL\n-\nmeans a display of written, printed, or graphic matter on the\nimmediate container, or to other materials affixed thereto, of any\narticle, Any word, statement or other information appearing on the\nlabel required under authority of the FDA Act of 2009 or other\nrelevant laws shall be deemed and complied with if such word,\nstatement or other information also appears on the outside container\nor wrapper, if any there be, of the retail package of such article, or\neasily legible through the outside container or wrapper.\nLED NAIL LAMP\n-\nit uses Light Emitting Diode to cure nails. These long-lasting bulbs\nproduce light of a particular frequency which is used to activate\nphotoreactions in gel polish to cause it to harden and remain in place\nfor long. They are typically expensive as they are more durable in the\nlong run.\nLUNULA\n-\nsemicircular mark: a semicircular mark, specially the white Crescent-\nshaped area at the base of the fingernails.\nMANICURE\n-\nhand and nail cosmetics treatment: a cosmetic treatment for the\nhands and nails that usually involves shaping and polishing the\nfingernails, pushing back the cuticles, and treating rough skin.\nMISBRANDING\n-\nmeans, in addition to definitions provided in the Foods, Drugs and\nDevices, and Cosmetics Act and in other relevant laws, giving\nunsubstantial claims, misinformation or misleading information on the\nlabel or other information materials, including those contained in\nbrand names or trademarks. It shall not refer to copyright, trademark,\nor other intellectual property-like instruments.\nNAIL\n-\nhard area on finger or toe; in humans and other primates, the thin\nhorny covering that grows on the upper surface of the end of each\nfinger\nNAIL BED\n-\nnail-producing tissue at base of nail: the layer of tissue at the base\nof a fingernail or toenail from which new nail materials develops.\nNAIL FILE\n-\nfile for fingernails: a small file used for smoothing and shaping the\nends of the fingernails.\nNAIL POLISH\n-\nvarnish for fingernails: a fast drying colored or transparent lacquer\nused to decorate fingernails or toenail.\nNAIL\nRESTORATION\n-\nprocess of repairing or fixing nails back to its good looking conditions.\nNAIL SCISSOR\n-\nsmall scissor for fingernails: small scissor, sometimes with curved\nblades, used for trimming fingernails or toenails.\nNAIL SCULPTING -\nprocess of carving and shaping nails using soft forming materials\nPERSONAL\nPROTECTIVE\nEQUIPMENT\n-\nmeans any clothing, device or another article that is intended to be\nworn or used by a worker to prevent injury or to facilitate rescue;\nPRIMER\n-\na paint or sealant used to prepare surface for painting or a similar\nprocess, or a coat of these materials\nRESIDUES\n-\nsomething left-over; something that remains after the process\ninvolving the removal of part of the original has been completed.\nRESIN\n-\nsynthetic resembling resin: a synthetic polymeric compound\nphysically resembling natural resin, e.g. polyvinyl, polystyrene, or\nepoxy. Use: manufacture of petrochemicals and plastics.\nSAFETY\n-\nthe condition of being free from danger and hazards which may cause\ninjuries or diseases.\n\n--- PDF PAGE 152 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 148\nSAFETY DATA\nSHEETS (SDS)\n-\nis a document that provides important physical characteristics,\necological, health, safety and toxicological information on chemical\nsubstances or mixtures of ingredients used at the workplace,\ntransported and maybe utilized by the consumer.\nSANITIZE\n-\nan effective bactericidal treatment to render surfaces of utensils, tools\nand equipment free pathogenic microorganisms\nSEGRAGATION\n-\nshall refer to sorting and segregation of different materials found in\nsolid waste in order to promote recycling and re-use of resources and\nto reduce the volume of waste collection and disposal.\nSOLVENT\n-\na common term of liquid substance used in dry cleaning process in\nplace of water.\nSCULPT\n-\nshape something naturally: to change the shape or contours of\nsomething by natural processes such as erosion.\nSTERILIZATION\n-\nany chemical and or physical process which kills and destroys all\nmicroorganisms.\nSURFACE\n-\nthin applied outer layer, relatively thin outer layer or coating applied\nto something, usually to give it smooth finish.\nTECHNOLOGY\n-\napplication of tools and methods: the study, development, and\napplication of devices, machines, and techniques for manufacturing\nand productive processes\nTONSORIAL AND\nBEAUTY\nESTABLISHMENT\n-\nincludes barber shop, parlors and other establishments engaged in\nthe physical make-over of an individual\nTOUCH UP\n-\nimprove something: to make a slight improvement to something, e.g.\nwith paint\nWORKFLOW\n-\nprogress of work: the progress or rate of progress of work done by a\nbusiness, department, or person.\n\n--- PDF PAGE 153 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 149\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend sincerest thank you and appreciation to the representatives of business, industry,\nacademe and government agencies who provided their time and expertise in the\ndevelopment and validation of this Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERT AND REVIEW PANEL\n\nMANOLITO “Ching” D. DONDONILLA\nTechnical Expert/Member\nPhilippine International Cosmetologists Assn. (PICA)\n\n ANDREW I. GALINDON\nTechnical Expert/Board Member\nPhilippine International Cosmetologists Assn. (PICA)\n\n CRISTINA P. MARPURI\nTechnical Expert/Member\nPhilippine International Cosmetologists Assn. (PICA)\n\nCLARINNA A. CABAYAN\nTechnical Expert / Beauty Therapy Coach\nTEAM PILIPINAS (ASC2014)\n\nRICHMOND E. SUIZO\nTechnical Expert / LMT\nBeauty Health Wellness Practitioners Organization of the Philippines (BHWPOP)\n\nThe PARTICIPANTS in the Validation of this Trainin