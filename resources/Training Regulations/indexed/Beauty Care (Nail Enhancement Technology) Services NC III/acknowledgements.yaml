R BEAUTY CARE (NAIL ENHANCEMENT\nTECHNOLOGY) SERVICES NC III\n\n• Must be a holder of National TVET Trainers Certificate (NTTC) Level I in Beauty\nCare (Nail Enhancement Technology) Services NC III\n• Must possess good communication skills\n• Must have at least two (2) years experience in beauty and wellness industry for\nthe last five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 146 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 142\nSECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of BEAUTY CARE (NAIL ENHANCEMENT\nTECHNOLOGY) SERVICES NC III, the candidate must demonstrate competence\nin all units listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to undergo assessment and certification:\n\n4.1.3.1\nGraduates of WTR-registered program, NTR-registered programs or\nformal/non-formal/informal including enterprise-based trainings related\nto\nBEAUTY\nCARE\n(NAIL\nENHANCEMENT\nTECHNOLOGY)\nSERVICES NC III.\n\n4.1.3.2\nExperienced workers (wage employed or self-employed) who gained\ncompetencies in providing nail enhancement technology services for\nat least two (2) years within the last five (5) years.\n\n4.1.4\nRecognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of nail enhancement technology services\nexperience within the last five (5) years may apply for recognition in this\nQualification through Portfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must be\nconsistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to Recognition\nof Prior Learning (RPL) within the TESDA Assessment and Certification System.\n\n4.1.5 Holders of National Certificate (NC) or Certificates of Competency (COC) in\nBeauty Care (Nail Enhancement Technology) Services NC III are required to\nundergo re-assessment under the amended Training Regulations (TRs), upon\nexpiration of their Certificates.\n\n--- PDF PAGE 147 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 143\n4.1.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are authorized\nby TESDA to manage the assessment for National Certification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 148 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 144\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nteam\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career\nand life\ndecisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health\npolicies and\nprocedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nWork in a\n