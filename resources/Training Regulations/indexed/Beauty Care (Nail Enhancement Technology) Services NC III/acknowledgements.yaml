iseases\n(contraindications to\nmanicure or pedicure\ntreatment)\nMay include:\n19.1 Fungal infections\n19.1.1 Tinea Pedis (Athlete’s Foot)\n19.1.2 Tinea Manus\n19.1.3 Tinea Unguium (Onychomycosis)\n19.2 Active bacterial infections\n19.3 Significant/severe viral infection/wart\n19.4 Scabies\n19.5 Severe eczema or Psoriasis\n19.6 Undiagnosed lump and swelling\n19.7 Swollen hands/feet\n19.8 Contagious diseases\n19.9 Infectious diseases\n19.10 Redness of hands/feet\n19.11 Severe wounds\n19.12 Severe nail trauma\n19.13 Rams Horn Nail (Onychogryposis)\n19.14 Severe Onycholysis\n19.15 Onychoptosis (shedding/falling of nail)\n19.16 Green Nail Syndrome (Pseudomonas)\n\n--- PDF PAGE 71 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 67\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n20. Appropriate Health Care\nProfessionals\nMay include:\n20.1 Podiatrists\n20.2 Dermatologists\n20.3 Physicians\n20.4 Orthopedic Surgeons\n20.5 Physical Therapists\n20.6 Occupational Therapists\n20.7 Nurses\n\n--- PDF PAGE 72 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 68\nEVIDENCE GUIDE\n\n1. Critical\nAspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned, disinfected and organized workstation following\nspa/salon policies and procedures in compliance with\napplicable laws and government regulations.\n1.2\nWore Personal Protective Equipment (PPE) following health\nand safety standards.\n1.3\nObserved proper personal and hand hygiene.\n1.4\nVentilated the workstation sufficiently to avoid or minimize\nexposure to hazardous airborne contaminants.\n1.5\nProvided adequate room lighting and lamp per table\nfollowing spa/salon policies and procedures.\n1.6\nProperly seated the client and ensure safety and comfort\nthroughout the entire service following salon/spa\nergonomics.\n1.7\nHanded over Personal Protective Equipment (PPE) to the\nclient in compliance with applicable laws and government\nregulations.\n1.8\nObtained client’s vital signs using appropriate instruments to\nassess general health and capacity to receive spa/salon\nservices.\n1.9\nEstablished workplace safety protocols to protect clients\nwho are at risk to chemical and biological exposures.\n1.10 Performed skin patch test to assess chemical allergens from\nnail products and the possible side effects to clients in\naccordance with applicable laws and government\nregulations.\n1.11 Assessed and identified client’s nail structure, shape and\ncondition.\n1.12 Identified contraindicated nail conditions/disorders and\ndiseases and referred to appropriate health care\nprofessionals.\n1.13 Established client preference that includes design, method,\nproducts and materials to be used.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Model\n2.2 Tools, equipment, supplies, materials and products relevant\nto the activity to be performed\n2.3 Work area/facilities\n3. Method of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Third Party Report\n3.3 Portfolio\n4. Context of\nassessment\n4.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 73 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 69\nUNIT OF COMPETENCY : PREPARE APPROPRIATE PRODUCTS, TOOLS AND\nEQUIPMENT\n\nUNIT CODE\n: SOC514314\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude in\npreparing product, tools and equipment procedures. This\nincludes preparing, checking, itemizing, and identifying\nappropriate products, tools and equipment on nail\nenhancement activity prior to procedures and understanding\nproducts specification and manufacturer’s manual of\ninstructions.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS