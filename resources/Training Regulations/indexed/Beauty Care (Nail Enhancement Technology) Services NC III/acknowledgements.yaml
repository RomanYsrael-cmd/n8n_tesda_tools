    {
      "source_text": "VARIABLE RANGE 1. Purpose and Benefit of Restoration on Specific Nail Conditions May include: 1.1 Nail plate protection from brittleness 1.2 Damaged/broken edges 1.3 Corrugated nails 1.4 Yellowish nail color 1.5 Extra reinforcement 1.6 Too short nails/bitten nails 2. Nail Restoration Procedures (using Nail Wraps) May include: 2.1 Prepping the nail 2.1.1 Cleanse fingernails with anti-bacterial spray. If there is a polish, remove with acetone. 2.1.2 Hands are cleaned, including the areas under the nails. 2.1.3 File nails to shape. 2.1.4 Push back the cuticles carefully. 2.1.5 Buff lightly to remove the shine and use alcohol to dehydrate the nail plate or use acetone to remove oil and dust. 2.2 Application: 2.2.1 Pick and match wraps to the shape and size of the nail. 2.2.2 Apply a thin coat of resin/base coat on the nail plate evenly without touching the cuticle. 2.2.3 Use the tweezers to place the wrap on the nail plate. 2.2.4 Press the wrap down with the tweezers or an orange stick. 2.2.5 Carefully pray the accelerator 6” away from the skin. 2.2.6 Use nail scissors to nip the excess wrap of the tip or sides of your finger. Use a file to file off any excess that can't be removed with the scissors. 2.2.7 Add two more coats of resin/base coat the same way as before. 2.2.8 Use a buffer to carefully buff the wrap smooth. 2.2.9 Apply cuticle oil around the cuticle. 3. Restorative Materials May include: 3.1 Silk 3.2 Linen 3.3 Fiberglass 4. Restorative Materials Removal Procedure May include: 4.1 Soak wrapped-nails in a bowl of acetone just enough to reach the cuticle for 2-3mins. 4.2 Dip a cotton ball into the acetone and wipe across the wrap. (repeat process as necessary until wrap floats from the nail surface) 4.3 Wash hands with warm soapy water."
