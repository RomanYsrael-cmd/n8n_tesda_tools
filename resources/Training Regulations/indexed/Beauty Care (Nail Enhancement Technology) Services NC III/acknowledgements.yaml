  "source_text": "ACKNOWLEDGEMENTS ……………………..……………………..………..…\n149 – 150\n\nTRAINING REGULATIONS DOCUMENT REVISION HISTORY ……………\n151\n\n--- PDF PAGE 5 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 1\nTRAINING REGULATIONS FOR\nBEAUTY CARE (NAIL ENHANCEMENT TECHNOLOGY) SERVICES NC III\n\nSECTION 1 BEAUTY CARE (NAIL ENHANCEMENT TECHNOLOGY)\nSERVICES NC III QUALIFICATION\n\nThe BEAUTY CARE (NAIL ENHANCEMENT TECHNOLOGY) SERVICES NC III\nQualification consists of competencies that a person must achieve to perform pre and post\nservice activities, prepare appropriate products, tools and equipment procedures, nail\nenhancement technology procedures and advance nail polish procedures.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUnit Code\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\nApply critical thinking and problem-solving techniques in the workplace\n400311322\nWork in a diverse environment\n400311323\n\nPropose methods of applying learning and innovation in the\norganization\n400311324\nUse information systematically\n400311325\nEvaluate occupational safety and health work practices\n400311326\nEvaluate environmental work practices\n400311327\nFacilitate entrepreneurial skills for micro-small-medium enterprises\n(MSMEs)\n\nUnit Code\nCOMMON COMPETENCIES\nSOC514201\nMaintain an effective relationship with clients/customers\nSOC514202\nManage own performance\nSOC514203\nApply quality standards\nSOC514204\nMaintain a safe, clean and efficient environment\n\nUnit Code\nCORE COMPETENCIES\nSOC514313\nPerform preparatory activities\nSOC514314\nPrepare appropriate products, tools and equipment\nSOC514315\nPerform nail enhancement technology procedures\nSOC514316\nPerform post service activities\n\n A person who has achieved this Qualification is competent to be:\n\n Nail Specialist\n\n--- PDF PAGE 6 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 2\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in BEAUTY CARE (NAIL ENHANCEMENT TECHNOLOGY)\nSERVICES NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n: 400311319\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto lead in the effective dissemination and discussion of ideas,\ninformation, and issues in the workplace. This includes\npreparation of written communication materials.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1 Relevant\ncommunication method\nis selected based on\nworkplace procedures\n1.2 Multiple operations\ninvolving several\ntopics/areas are\ncommunicated following\nenterprise requirements\n1.3 Questioning is applied to\ngain extra information\n1.4 Relevant sources of\ninformation are identified\nin accordance with\nworkplace/ client\nrequirements\n1.5 Information is selected\nand organized following\nenterprise procedures\n1.6 Verbal and written\nreporting is undertaken\nwhen required\n1.7 Communication and\nnegotiation skills are\napplied and maintained\nin all relevant situations\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Business writing\n1.4. Workplace\netiquette\n1.1 Organizing\ninformation\n1.2 Conveying\nintended\nmeaning\n1.3 Participating in a\nvariety of\nworkplace\ndiscussions\n1.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n1.5 Effective\nbusiness writing\n1.6 Effective\nclarifying and\nprobing skills\n1.7 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n\n--- PDF PAGE 7 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Lead\nworkplace\ndiscussions\n2.1 Response to workplace\nissues are sought\nfollowing enterprise\nprocedures\n2.2 Response to workplace\nissues are provided\nimmediately\n2.3 Constructive\ncontributions are made\nto workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4 Goals/objectives and\naction plans undertaken\nin the workplace are\ncommunicated promptly\n2.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n2.2 Effective verbal\ncommunication\nmethods\n2.3 Workplace etiquette\n2.1 Organizing\ninformation\n2.2 Conveying\nintended meaning\n2.3 Participating in\nvariety of\nworkplace\ndiscussions\n2.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n2.5 Effective clarifying\nand probing skills\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and\neffective communication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication\nproblems and issues are\nraised as they arise\n3.5 Identify barriers in\ncommunication to be\naddressed appropriately\n\n3.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2 Effective verbal\ncommunication\nmethods\n3.3 Workplace etiquette\n3.4 Communication\nproblems and issues\n3.5 Barriers in\ncommunication\n\n3.1 Organizing\ninformation\n3.2 Conveying\nintended meaning\n3.3 Participating in a\nvariety of\nworkplace\ndiscussions\n3.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n3.5 Effective\nclarifying and\nprobing skills\n3.6 Identifying issues\n3.7 Negotiation and\ncommunication\nskills\n\n--- PDF PAGE 8 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face-to-face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n2. Workplace\ndiscussions\nMay include:\n2.1. Coordination meetings\n2.2. Toolbox discussion\n2.3. Peer-to-peer discussion\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one\ntime\n1.2 Demonstrated leadership skills in workplace\ncommunication\n1.3 Made constructive contributions in workplace issues\n1.4 Sought workplace issues effectively\n1.5 Responded to workplace issues promptly\n1.6 Presented information clearly and effectively written\nform\n1.7 Used appropriate sources of information\n1.8 Asked appropriate questions\n1.9 Provided accurate information\n2. Resource Implications\nThe following resources should be provided:\n2.1 Variety of Information\n2.2 Communication tools\n2.3 Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Case problem\n3.2 Third-party report\n3.3 Portfolio\n3.4 Interview\n3.5 Demonstration/Role-playing\n4. Context for\nAssessment\n4.1. Competency may be assessed in the workplace or in\na simulated workplace environment\n\n--- PDF PAGE 9 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 5\n\nUNIT OF COMPETENCY : LEAD SMALL TEAMS\n\nUNIT CODE\n: 400311320\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting, maintaining and monitoring\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide\nteam\nleadership\n1.1 Work requirements are\nidentified and presented\nto team members based\non company policies and\nprocedures\n1.2 Reasons for instructions\nand requirements are\ncommunicated to team\nmembers based on\ncompany policies and\nprocedures\n1.3 Team members’ and\nleaders’ concerns are\nrecognized, discussed\nand dealt with based on\ncompany practices\n1.1 Facilitation of Team\nwork\n1.2 Company policies\nand procedures\nrelating to work\nperformance\n1.3 Performance\nstandards and\nexpectations\n1.4 Monitoring\nindividual’s and\nteam’s performance\nvis a vis client’s and\ngroup’s expectations\n1.1 Communication\nskills required for\nleading teams\n1.2 Group facilitation\nskills\n1.3 Negotiating skills\n1.4 Setting\nperformance\nexpectation\n2. Assign\nresponsibilities\n2.1 Responsibilities are\nallocated having regard to\nthe skills, knowledge and\naptitude required to\nundertake the assigned\ntask based on company\npolicies\n2.2 Duties are allocated\nhaving regard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n2.1 Work plan and\nprocedures\n2.2 Work requirements\nand targets\n2.2 Individual and\ngroup\nexpectations and\nassignments\n2.3 Ways to improve\ngroup leadership\nand membership\n2.1 Communication\nskills\n2.2 Management\nskills\n2.3 Negotiating skills\n2.4 Evaluation skills\n2.5 Identifying team\nmember’s\nstrengths and\nrooms for\nimprovement\n\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1 Performance expectations\nare established based on\nclient needs\n3.2 Performance expectations\nare based on individual\nteam members\nknowledge, skills and\naptitude\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n\n3.1 One’s roles and\nresponsibilities in\nthe team\n3.2 Feedback giving\nand receiving\n3.3 Performance\nexpectation\n\n3.1 Communication\nskills\n3.2 Accurate\nempathy\n3.3 Congruence\n3.4 Unconditional\npositive regard\n3.5 Handling of\nFeedback\n\n--- PDF PAGE 10 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 6\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Supervise\nteam\nperformance\n4.1 Performance is monitored\nbased on defined\nperformance criteria\nand/or assignment\ninstruction\n4.2 Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies based on\ncompany practices\n4.3 Performance issues\nwhich cannot be rectified\nor addressed within the\nteam are referred to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n4.7 All relevant\ndocumentation is\ncompleted in accordance\nwith company procedures\n\n4.1 Performance\ncoaching\n4.2 Performance\nmanagement\n4.3 Performance Issues\n\n4.1 Communication\nskills required for\nleading teams\n4.2 Coaching skill\n\n--- PDF PAGE 11 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Requirements\nMay include:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team Members’ and\nLeaders’ Concerns\nMay include:\n2.1. Roster/shift details\n3. Feedback\nMay include:\n3.1. Formal process\n3.2. Informal process\n4. Performance Issues\nMay include:\n4.1. Work output\n4.2. Work quality\n4.3. Team participation\n4.4. Compliance with workplace protocols\n4.5. Safety\n4.6. Customer service\n\n--- PDF PAGE 12 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 8\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Resource Implications The following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 13 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 9\nUNIT OF COMPETENCY : APPLY CRITICAL THINKING AND PROBLEM-SOLVING\nTECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n: 400311321\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto solve problems in the workplace including the application\nof problem-solving techniques and to determine and resolve\nthe root cause/s of specific problems in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1 Examine\nspecific\n