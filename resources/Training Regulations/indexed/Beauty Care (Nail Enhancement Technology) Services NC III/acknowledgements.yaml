      "source_text": "-- PDF PAGE 101 --- TR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 97 government regulations and follow recommendations. 7.4.2 Flammable products/chemicals must be stored in a separate, cool, ventilated and dry area away from direct sunlight, heat or sources of ignition 7.4.3 All chemicals should be kept in their original containers or in properly labeled containers of an appropriate type or in small bottles with small openings and label them with the information from the manufacturer’s label. 7.4.4 Close bottles tightly when you are not using them so the product does not spill or get into the air 7.4.5 Do not store liquids above solids to avoid contamination in the event of a leak and use spill trays, if applicable 7.4.6 Chemicals must be stored in secure and not overloaded shelves no higher than eye level inside a locked, labeled cupboard or room where it is accessible only to authorized persons and where breaking or tipping cannot happen. 7.4.7 Primers, acrylic liquids, and top coats require storage in an opaque container. This is because the products contain light-sensitive (“photo-chemically reactive”) chemicals that cause the product to weaken or prematurely harden when exposed to light. 7.4.8 Polymer lids should to be tightly closed so moisture in the air does not interact with the powder. Monomers can thicken and become gel like, begin to set too slowly or even completely harden when it is has gone bad whereas polymers tend to discolor and change in texture. 7.4.9 Gel polish bottles should be stored away from exposure to natural sunlight. Don't leave them sitting out in front of a window or in a bright room that gets a lot of light. Ideally they should be stored somewhere dark like in a closet, box or drawer. 8. Documentation Processes May include: 8.1 Products, supplies and materials logbook 8.2 Inventory reports 8.3 Client information e.g., consultation forms, service/treatment reco