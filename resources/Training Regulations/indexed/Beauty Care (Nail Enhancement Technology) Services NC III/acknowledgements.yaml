      "source_text": "1. Critical Aspects of Competency Assessment requires evidence that the candidate: 1.1 Evaluated finished work according to client’s desired outcome. 1.2 Advised client on proper nail care and maintenance following spa/salon policies. 1.3 Cleaned, disinfected and inspected equipment following spa/salon policies and procedures in accordance with manufacturer’s instructions. 1.4 Cleaned, sterilized, inspected and sealed tools using appropriate container/pouch following spa/salon policies and procedures in accordance with manufacturer’s instructions. 1.5 Collected, sorted and placed soiled materials in designated area for proper laundry processing. 1.6 Collected waste materials following proper waste management and disposal procedures. 1.7 Cleaned, disinfected and organized workstation for the next activity following workstation preparation procedures. 1.8 Store sanitized/sterilized equipment and tools following established storage procedures. 1.9 Handled and stored nail products, supplies and materials following established storage procedures. 1.10 Performed required documentation processes in accordance with spa/salon policies. 2. Resource Implications The following resources should be provided: 2.1 Model 2.2 Tools, equipment, supplies/materials relevant to the activity to be performed 2.3 Work area and facilities 3. Method of Assessment Competency in this unit may be assessed through: 3.1 Demonstration with oral questioning 3.2 Third Party Report 3.3 Portfolio 4. Context of Assessment 4.1 Assessment may be conducted in the workplace or in a simulated environment"
    },
