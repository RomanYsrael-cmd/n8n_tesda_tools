ainer\n7.6 Glass/clear plastic container for cotton\n7.7 Hand and foot towels\n7.8 Terry cloth\n7.9 Clean cloth\n7.10 Rubber/disposable slippers\n7.11 Cotton balls\n\n--- PDF PAGE 79 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 75\n7.12 Cotton pads/flat facial cotton\n7.13 Cotton balls\n7.14 Paper towel\n7.15 Foot and hand lotion\n7.16 Alcohol 70%\n7.17 Spray bottles\n7.18 Cuticle softener\n7.19 Tissue paper/wipes\n7.20 Trash bins (with self-closing lid)\n7.21 PVC aprons/Nail tech aprons\n7.22 Filter mask/respirator mask\n7.23 Latex hand gloves\n7.24 Open-toed gloves\n7.25 Googles\n7.26 Lint-free paper towels\n7.27 Pillows\n7.28 Hand cushion\n7.29 Hair net\n7.30 Wipes/lint-fee wipes/sanitized cloth\n7.31 Liquid soap\n7.32 Plastic/metal spatula\n8. Proper Handling of\nSupplies and\nMaterials\nMay include:\n8.1 Store supplies and materials properly\n8.2 Use appropriate PPE in handling supplies/materials\ncontaining hazardous chemicals\n8.3 Supplies that comes in large containers must be refilled\ninto smaller portion containers and properly labeled\n8.4 Containers must always be refilled with same product\n8.5 Never handle supplies and materials with wet, dirty,\nunsanitized or contaminated hands\n8.6 Use an appropriate tray in carrying or when working\nwith several supplies and materials\n8.7 Don’t share materials/supplies (e.g. towel) with other\nclients\n8.8 Avoid placing supplies and materials directly on\nworking surfaces, use trays or underliners to organize\nsupplies/materials and contain spills\n8.9 Don’t refill excess/surplus products back to mix with the\nremaining products in the container, use a separate\ncontainer or throw it away if contaminated\n8.10 Limit use of mixing and measuring tools to a particular\ntype of product only, clean it first before using them on\nother types of products\n8.11 Practice safety in handling supplies and materials\n8.12 Disposed of supplies and materials properly\n