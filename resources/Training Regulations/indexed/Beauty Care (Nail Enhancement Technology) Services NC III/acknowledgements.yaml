emicals use Butyl rubber gloves\n11.3.2 For skin product chemicals use Nitrile or Vinyl\ngloves\n11.4 Always read product labels for product specifications\nand directions of use\n11.5 Don’t cover up nail problems with artificial nails\n11.6 Use the right type and right amount of product for the\nactivity\n11.7 Follow industry standard procedures in working with\nnail technology products\n11.8 Store products properly\n11.9 Disposed of products properly\n\n--- PDF PAGE 82 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 78\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared required equipment and tools.\n1.2\nCarried out appropriate sanitation and disinfection of\nequipment; sterilization and sealing and tools using\nregistered sterilants/EPA and hospital grade\ndisinfectants.\n1.3\nObserved safety practices following spa/salon policies\nand procedures in compliance with applicable laws\nand government regulations.\n1.4\nImplemented proper handling of tools and equipment\nto avoid cross-infection/cross-contamination within the\nworkplace.\n1.5\nPrepared required supplies and materials following\nspa/salon policies and procedures in accordance with\nmanufacturers’ instructions.\n1.6\nImplemented proper handling of supplies and\nmaterials to avoid cross-infection/cross-contamination\nwithin the workplace.\n1.7\nPrepared required nail technology products following\nspa/salon policies and procedures in accordance with\nmanufacturers’ instructions.\n1.8\nImplemented precautions in handling nail technology\nproducts following spa/salon policies and procedures\nand manufacturers’ instructions in compliance with\napplicable laws and government regulations.\n2. Resource implications The following resources should be provided:\n2.1 Model\n2.2 Tools, equipment, supplies, materials and products\nrelevant to the activity to be performed\n2.3 Work area/facilities\n3. Method of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Third Party Report\n3.3 Portfolio\n4. Context of\nAssessment\n4.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 83 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 79\nUNIT OF COMPETENCY : PERFORM NAIL ENHANCEMENT TECHNOLOGY\nPROCEDURES\n\nUNIT CODE\n: SOC514315\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude in\nexecuting nail enhancement technology procedures by\nperforming nail restoration, nail extension, and nail sculpting\nmethods on fingernails and toenails. This involves preparing,\nselecting and applying appropriate treatments, curving,\nforming, product mixing and attachment of treatment products\nand artificial nails.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Perform Nail\nRestoration\nand\nRemoval\n\n1.1\nClient is consulted\nregarding purpose and\nbenefit of nail\nrestoration on\nspecific nail\nconditions following\nrestoration procedures.\n1.2\nClient’s hands and nails\nare cleaned, disinfected\nand towel-dried\n1.3\nEstablished nail\nrestoration\nprocedures are\nperformed following\nspa/salon policy and\nmanufacturer’s\ninstructions.\n1.4\nRestorative materials\nare removed following\nrestorative materials\nremoval procedure.\n1.5\nAccidental cuts/wounds\nare given immediate\nfirst-aid while serious\ncases are referred to\nappropriate health care\nprofessionals following\nspa/salon policies and\nprocedures\n1.6\nNail technology\nproducts are used with\ncaution following\nmanufacturers’\ninstructions in\ncompliance with\napplicable laws and\ngovernment\nregulations.\n1.1 Code of Ethics\n1.2 Code on\nSanitation of the\nPhilippines\n1.3 Applicable Laws\nand Government\nRegulations\n1.4 Time\nmanagement\n1.5 Communication\nand Basic Public\nRelations\n1.6 Customer Service\n1.7 Client Care\n1.8 Required\nEquipment, Tools,\nSupplies and\nMaterials\n1.9 Nail Product\nKnowledge\n1.10 Basic Nail\nAnatomy and\nPhysiology\n1.11 Common\nMicroorganisms\n1.12 Process of\nInfection\n1.13 Common Nail\nShapes\n1.14 Common Nail\nConditions\n1.15 Chemistry\n(evaluation of\nproduct labels of\ningredients)\n1.16 Hazardous\nChemicals\n1.1 Performing client\nconsultation on\nthe purpose and\nbenefit of nail\nrestoration\n1.2 Maintaining\neffective\ncommunication\nwith the client\n1.3 Understanding\nnon-verbal\ncommunication\n1.4 Cleaning and\ndisinfecting\nclient’s hands\nand nails\n1.5 Maintaining\nsafety and\nsanitation\n1.6 Interpreting\nproduct usage\nspecifications\n1.7 Applying nail\nproducts\n1.8 Using nail\nsupplies and\nmaterials\n1.9 Performing nail\nrestoration\n1.10 Removing\nrestorative\nmaterials\n1.11 Observing time\nmanagement\n1.12 Applying\nstandard first-aid\n\n--- PDF PAGE 84 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 80\n1.17 Chemical Allergic\nReactions\n1.18 Basic\nMathematics\n1.19 Spa/Salon\nPolicies and\nProcedures\n1.20 Nail Restoration\nProcedure\n1.21 Restorative\nMaterial Removal\nProcedure\n1.22 Standard First Aid\n1.23 Health Care\nProfessionals\nrelevant to\nSpa/Salon\nPractice\n1.24 Spa/Salon\nErgonomics\n1.13 Using nail\ntechnology\nproducts with\ncaution\n2 Perform Nail\nExtension\nand\nRemoval\n\n2.1 Client is consulted on\nthe type, design and\nshape of nail extension\nfollowing spa/salon\npolicies and procedures.\n2.2 Client’s hands and nails\nare cleaned, disinfected\nand towel-dried\n2.3 Established nail\nextension procedure is\nperformed following\nspa/salon policies and\nmanufacturer’s\ninstructions.\n2.4 Nail extensions are\nremoved following nail\nextension removal\nprocedure.\n2.5 Accidental cuts/wounds\nare given immediate\nfirst-aid while serious\ncases are referred to\nappropria