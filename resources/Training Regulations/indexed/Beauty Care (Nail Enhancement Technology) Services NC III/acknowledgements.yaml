erious\ncases are referred to\nappropriate health care\nprofessionals following\nspa/salon policies and\nprocedures\n3.6 Nail technology products\nare used with caution\nfollowing manufacturers’\ninstructions in\ncompliance with\napplicable laws and\ngovernment regulations.\n\n3.1 Code of Ethics\n3.2 Code on\nSanitation of the\nPhilippines\n3.3 Applicable Laws\nand Government\nRegulations\n3.4 Time\nmanagement\n3.5 Communication\nand Basic Public\nRelations\n3.6 Customer Service\n3.7 Client Care\n3.8 Required\nEquipment, Tools,\nSupplies and\nMaterials\n3.9 Nail Product\nKnowledge\n3.10 Basic Nail\nAnatomy and\nPhysiology\n3.11 Common\nMicroorganisms\n3.12 Process of\nInfection\n3.13 Common Nail\nShapes\n3.14 Common Nail\nConditions\n3.15 Chemistry\n(evaluation of\n3.1 Performing client\nconsultation on\ndesign, shape\nand color of\nacrylic nail\n3.2 Cleaning and\ndisinfecting\nclient’s hands and\nnails\n3.3 Performing nail\nsculpting\n3.4 Removing nail\nsculpt\n3.5 Applying standard\nfirst-aid\n3.6 Using nail\ntechnology\nproducts with\ncaution\n\n--- PDF PAGE 86 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 82\nproduct labels of\ningredients)\n3.16 Hazardous\nChemicals\n3.17 Chemical Allergic\nReactions\n3.18 Basic\nMathematics\n3.19 Spa/Salon\nPolicies and\nProcedures\n3.20 Nail Sculpting\nProcedure (using\nAcrylic and Nail\nGel)\n3.21 Acrylic Nail\nRemoval\nProcedure\n3.22 Gel Nail Removal\nProcedure\n3.23 Standard First Aid\n3.24 Health Care\nProfessionals\nrelevant to\nSpa/Salon\nPractice\n3.25 Spa/Salon\nErgonomics\n4. Create\nAdvanced\nNail Art\nPolish\nDesigns\n\n4.1 Client is consulted on\nnail art polish\ndesigns/techniques,\nshapes and colors in\naccordance with\nspa/salon policies and\nprocedures.\n4.2 Client’s hands are\ncleaned, disinfected and\ntowel-dried.\n4.3 Nails are cleaned,\ntrimmed, filed and\nshaped following client\npreference.\n4.4 Advanced nail art\npolish designs are\ncreated following client\npreference in\naccordance with product\nusage specifications.\n4.5 Excess polish is\nremoved around the\ncuticles and nails.\n4.6 Nail art polish design is\nremoved following\nremoval procedure.\n4.7 Accidental cuts/wounds\nare given immediate\nfirst-aid while serious\n4.1 Code of Ethics\n4.2 Code on\nSanitation of the\nPhilippines\n4.3 Applicable Laws\nand Government\nRegulations\n4.4 Time\nmanagement\n4.5 Communication\nand Basic Public\nRelations\n4.6 Customer Service\n4.7 Client Care\n4.8 Required\nEquipment, Tools,\nSupplies and\nMaterials\n4.9 Nail Product\nKnowledge\n4.10 Basic Nail\nAnatomy and\nPhysiology\n4.11 Common\nMicroorganisms\n4.12 Process of\nInfection\n4.1 Performing client\nconsultation on\nnail art\ndesigns/techniqu\nes and shapes\n4.2 Cleansing and\ndisinfecting\nClient’s hands\nand nails\n4.3 Trimming, filing\nand shaping\nnails\n4.4 Creating\nadvanced nail art\npolish designs\n4.5 Removing nail\nart polish design\n4.6 Applying\nstandard first-aid\n4.7 Using nail\ntechnology\nproducts with\ncaution\n\n--- PDF PAGE 87 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 83\ncases are referred to\nappropriate health care\nprofessionals following\nspa/salon policies and\nprocedures\n4.8 Nail products and\nsupplies are used\nfollowing manufacturers’\ninstructions in\ncompliance with\napplicable laws and\ngovernment regulations.\n\n4.13 Common Nail\nShapes\n4.14 Common Nail\nConditions\n4.15 Chemistry\n(evaluation of\nproduct labels of\ningredients)\n4.16 Hazardous\nChemicals\n4.17 Chemical Allergic\nReactions\n4.18 Basic\nMathematics\n4.19 Spa/Salon\nPolicies and\nProcedures\n4.20 Advance Nail Art\npolish Designs\n4.21 Standard First Aid\n4.22 Health Care\nProfessionals\nrelevant to\nSpa/Salon\nPractice\n4.23 Spa/Salon\nErgonomics\n\n--- PDF PAGE 88 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 84\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nPurpose and Benefit of\nRestoration on Specific\nNail Conditions\nMay include:\n1.1 Nail plate protection from brittleness\n1.2 Damaged/broken edges\n1.3 Corrugated nails\n1.4 Yellowish nail color\n1.5 Extra reinforcement\n1.6 Too short nails/bitten nails\n2.\nNail Restoration\nProcedures (using Nail\nWraps)\nMay include:\n2.1 Prepping the nail\n2.1.1 Cleanse fingernails with anti-bacterial spray. If\nthere is a polish, remove with acetone.\n2.1.2 Hands are cleaned, including the areas under\nthe nails.\n2.1.3 File nails to shape.\n2.1.4 Push back the cuticles carefully.\n2.1.5 Buff lightly to remove the shine and use\nalcohol to dehydrate the nail plate or use\nacetone to remove oil and dust.\n2.2 Application:\n2.2.1 Pick and match wraps to the shape and size of\nthe nail.\n2.2.2 Apply a thin coat of resin/base coat on the nail\nplate evenly without touching the cuticle.\n2.2.3 Use the tweezers to place the wrap on the nail\nplate.\n2.2.4 Press the wrap down with the tweezers or an\norange stick.\n2.2.5 Carefully pray the accelerator 6” away from the\nskin.\n2.2.6 Use nail scissors to nip the excess wrap of the\ntip or sides of your finger. Use a file to file off\nany excess that can't be removed with the\nscissors.\n2.2.7 Add two more coats of resin/base coat the\nsame way as before.\n2.2.8 Use a buffer to carefully buff the wrap smooth.\n2.2.9 Apply cuticle oil around the cuticle.\n3.\nRestorative Materials\nMay include:\n3.1 Silk\n3.2 Linen\n3.3 Fiberglass\n4.\nRestorative Materials\nRemoval Procedure\nMay include:\n4.1 Soak wrapped-nails in a bowl of acetone just\nenough to reach the cuticle for 2-3mins.\n4.2 Dip a cotton ball into the acetone and wipe across\nthe wrap. (repeat process as necessary until wrap\nfloats from the nail surface)\n4.3 Wash hands with warm soapy water.\n\n--- PDF PAGE 89 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 85\nVARIABLE\nRANGE\n4.4 Apply moisturizer on fingertips.\n5.\nFirst Aid (wounds and\ncuts)\nMay include:\n5.1 Closed wound (ICES)\n5.1.1 Ice application\n5.1.2 Compression\n5.1.3 Elevation\n5.1.4 Splinting\n5.2 Open cut/wound\n5.2.1 Wound with severe bleeding\n• Control bleeding with direct pressure and\nelevation\n• Cover the wound with dressing and\nbandage\n• Care for shock\n• Consult a physician\n5.2.2 Wound with bleeding not severe\n• Clean the wound with soap and water\n• Apply mild antiseptics\n• Cover wound with dressing and bandage\n5.3 Thermal burns (1st and second degree burns)\n5.3.1 Relieve pain by immersing the burned area in\ncold water or applying with a wet, cold cloth. If\ncold water in unavailable, use any cold liquid\nyou drink to reduce the burned skin’s\ntemperature.\n5.3.2 Cover the burn with a dry, non- sticking,\nsterile dressing or a clean cloth.\n6.\nType, Design and Shape\nof Nail Extension\nMay include:\n6.1 Type of Nail Extension\n6.1.1 Plastic Nail Tips (clear or colored)\n6.1.2 Acrylic Nail Tips\n6.1.3 Overlay with wraps (using acrylic and gel)\n6.2 Nail Extension Design and Shapes\n6.2.1 Rounded lipstick\n6.2.2 Ballerina\n6.2.3 Squoval\n6.2.4 Oval\n6.2.5 Stiletto\n6.2.6 Rounded\n6.2.7 Almond\n6.2.8 Mountain peak\n6.2.9 Swirled lipstick\n6.2.10 Edge\n6.2.11 Square\n6.2.12 Natural\n6.2.13 Flare\n6.2.14 Lipstick\n7.\nNail Extension Procedure\n(using plastic nail tip)\nMay include:\n7.1 Prepping the nail:\n\n--- PDF PAGE 90 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 86\nVARIABLE\nRANGE\n\n7.1.1 Gently push the cuticle back with cuticle\npusher, ensuring no cuticle remains on the\nnail bed, as the acrylic will not stick to it.\n7.1.2 Use a buffing block to remove all shine to the\nnail by softly swiping left and right over the\nentire nail bed.\n7.1.3 Remove dust either with manicure brush or\nwipe over with some acetone on a lint-free\npad.\n7.2 Applying NAIL TIP (Colored-Plastic or Clear\nAcrylic):\n7.2.1 Pick out the correct size of nail tips that fit\nyour nails snugly and lay them out ready.\n7.2.2 Apply a small amount of nail glue to the tip\nwhere it will meet the natural nail bed.\n7.2.3 Press and hold the nail tip (with nail glue on)\nfirmly to the nail for about 10 seconds or until\nthe tip has stuck.\n7.2.4 Use the pinching tool or an angled pair of\ntweezers to gently hold the wings down.\n7.2.5 Using nail tip cutters or nail scissors (trickier\nto use), cut/snip the nail tip to desired length.\n7.2.6 File down the nail tip to follow desired shape\nwhile supporting the tip to avoid from\ndetaching.\n\nNote: If using clear Acrylic Nail Tip, get a lint-free\npad and apply a small amount of pure acetone to it to\nmake the polish adhere to the surface.\n8.\nNail Extension Removal\nProcedure.\n\nMay include:\n8.1 Soak finger tips in soapy water and gently file off.\n8.2 Remove any residual glue with a nail buffer and\nsome acetone.\n8.3 For acrylic nails, simply soak in acetone to remove\nthe fake nails and file off any remaining gluey\nresidues.\n9.\nTypes of Nail Sculpt\nMay include:\n9.1 Acrylic powder\n9.2 Nail gel\n10. Nail Sculpting Procedure\n(using Acrylic and Nail\nGel)\n\nMay include:\n10.1 ACRYLIC\n10.1.1 Prepping the nail\n• Gently push the cuticle back with cuticle\npusher, ensuring no cuticle remains on the\nnail bed, as the acrylic will not stick to it.\n• Use a buffing block to remove all shine to the\nnail by softly swiping left and right over the\nentire nail bed.\n\n--- PDF PAGE 91 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 87\nVARIABLE\nRANGE\n• Remove dust either with manicure brush or\nwipe over with some acetone on a lint-free\npad.\n10.1.2 Applying the Acrylic\n• Pour acrylic liquid into dappen dish.\n• Dip the acrylic brush and push the tip to the\nbottom of the dappen dish to get the air\nbubbles out.\n• Swipe the brush on the edge of the dappen\ndish once to get the excess liquid off.\n• Dip the brush tip into the acrylic powder and\nstroke the brush through the powder until a\nball of acrylic is created, it should not be too\nwet or dry.\n• Press the brush (with acrylic powder ball on)\nto a lint-free pad to drain the excess liquid off.\n• Apply the ball of acrylic to the top of the nail\n(near the cuticle) and bring the bead down to\nthe very tip. Tilt the nail down as while doing\nthis procedure; it will prevent the acrylic from\ngetting too near the cuticles.\n• Sculpt the acrylic by pressing the brush flat to\nthe nail and gently move the acrylic to smooth\nout bumps and to spread it out evenly\n(remember to keep the brush clean by dipping\nit into the acrylic liquid while doing this).\n• If more acrylic is needed to cover the entire\nnail, repeat steps 2-7 until there is satisfactory\ncoverage of the nail.\n• Wait a little over 2 minutes for the acrylic to\ndry (tap it carefully- when it’s not dry it will\nsound hollow).\n• File the entire nail until it is smooth on the top\nand around the edges and to make the shape\nmore defined.\n• Add a top coat to seal in the acrylic. The two\nsteps below show 2 ways of doing this:\n If there’s no lamp to dry the acrylics:\n• Apply Air Dry Top Coat to the entire nail\nand leave to dry for about 2 minutes.\n If there’s a lamp:\no Apply Top Coat (Gloss or Matte)\no Put hand under the lamp and turn on.\no Leave to cure (dry) for 2 minutes under\na UV lamp (or 1 minute for an LED\nlamp).\no Finish off the look by adding a stroke of\ncuticle oil to the cuticle area of each\nnail and rub with fingers.\n\n--- PDF PAGE 92 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 88\nVARIABLE\nRANGE\n\n10.2 NAIL GEL\n10.2.1 Prepping the nail\n• Gently push the cuticle back with cuticle\npusher, ensuring no cuticle remains on the\nnail bed, as the acrylic will not stick to it.\n• Use a buffing block to remove all shine to the\nnail by softly swiping left and right over the\nentire nail bed.\n• Remove dust either with manicure brush or\nwipe over with some acetone on a lint-free\npad.\n10.2.2 Applying the Gel\n• Apply Gel Polish Base Coat in a very thin\napplication and seal the edges of the nails\nmaking sure the gel doesn't touch the cuticle.\n• Cure (by placing all fingers) in the UV Lamp\nfor 1 min or LED lamp for 30 seconds.\n• Apply Gel Polish Color in a very thin\napplication from cuticle to free edge. Be sure\nto seal the edges.\n• Place hand in an UV light for 3 minutes for\ndark colors or 2 mins for light colors. Or 30\nseconds for LED lamp.\n• To even the coverage, repeat step 3 and 4 as\nnecessary.\n• Apply a thin coat of Gel Polish Top Coat from\ncuticle to free edge.\n• Place hand in UV Lamp for 2 mins or 30\nseconds for LED light.\n• Wipe of the gluey surface with nail cleanser\nand lint free nail wipes.\n• Massage cuticle oil to the skin surrounding the\nnail.\n11. Nail Sculpt Removal\nProcedure\nMay include:\n11.1 Acrylic Nail\n11.1.1 File the top coat layer of the nail using an\nemery board (with side-to-side gentle motion\nacross the nail bed)\n11.1.2 Apply cuticle oil around the skin. Soak a nail-\nsize cotton pad in 100% acetone and place\non top of the nail bed, wrap each nail with foil\nand wait for 10-15 mins to soften the gel\npolish.\n\n--- PDF PAGE 93 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 89\nVARIABLE\nRANGE\n11.1.3 Once wrap is removed, file any tough areas\nwith remains lightly to avoid damaging the nail\nbed and re-soak for additional 5mins.\n11.1.4 Apply nail strengthener/hardener product to\nrehabilitate the nails.\n\n11.2 Nail Gel\n11.2.1 File down 30-50% of the nail gel carefully\nusing 100 grit file and buffer then remove the\nremains by using 100% acetone (not just an\nordinary polish remover).\n11.2.2 Apply a small amount of oil around the nail to\navoid excessive dryness, soak a cotton ball in\nthe acetone then put on top of the nail and\nsecurely wrap it with foil.\n11.2.3 Wait for 10 mins until the excess polish peels\noff on its own. An orange stick can also be\nused to gently lift the dried polish.\n11.2.4 Apply nail strengthening oil to nourish the\nnails.\n12. Nail Art Polish\nDesigns/Techniques and\nShapes\nMay include:\n12.1 Nail Art Designs/Techniques\n12.1.1 Fancy Nail Designs such as water marble\nand sponge bobbing\n12.1.2 Brush drawing\n12.1.3 Stamping\n12.1.4 Digital nail art printing\n12.1.5 Nail Art Decals and stickers\n12.1.6 Airbrush Nail Design\n12.1.7 Stencil Method\n12.2 Nail Shapes\n12.2.1 Oval\n12.2.2 Square\n12.2.3 Round\n12.2.4 Pointed\n12.2.5 Squoval\n13. Advanced Nail Art Polish\nDesigns (using Sponge-\nbobbing)\nMay include:\n13.1 Apply liquid latex (or PVA glue) all around the skin\nsurrounding the nail and apply base coat,\n13.2 Make sure that the sponge is damp,\n13.3 Apply enough amount of colored polish on the\nsponge (it may be in 2-3 different colors brushed\nbeside each other),\n13.4 Gently dub the sponge on the nail with light\nstroke, let dry for a few mins,\n13.5 Repeat dubbing until you achieve the desired\nresult,\n13.6 Clear the excess product around the nail using a\nflat brush with acetone,\n13.7 Apply top coat and quick-dry (when necessary)\n\n--- PDF PAGE 94 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 90\nVARIABLE\nRANGE\n14. Polish Removal Procedure\nMay include:\n14.1 Simply use an acetone to remove the nail product.\n14.2 Use an orange stick to carefully remove product\nalong the nail groove.\n14.3 Apply a dot of moisturizing serum and massage\nonto the nail.\n14.4 Clean the excess product surrounding the nail and\nlet the serum dry naturally.\n\n--- PDF PAGE 95 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 91\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted the client on the purpose and benefit of nail\nrestoration on specific nail conditions.\n1.2\nClient’s hands and nails are cleaned, disinfected and\ntowel-dried\n1.3\nPerformed nail restoration procedures following spa/salon\npolicy in and manufacturer’s instructions.\n1.4\nRemoved restorative materials.\n1.5\nGiven immediate first aid to accidental cuts and wounds\nand referred serious cases to appropriate health care\nprofessionals.\n1.6\nUsed nail technology products with caution following\nmanufacturer’s instructions in compliance with applicable\nlaws and government regulations.\n1.7\nConsulted the client on type, design and shape of nail\nextension.\n1.8\nPerformed nail extension procedures following spa/salon\npolicy and manufacturer’s instructions.\n1.9\nRemoved nail extensions.\n1.10 Consulted the client on design, shape and type of nail\nsculpts.\n1.11 Performed nail sculpting procedures following spa/salon\npolicy and manufacturer’s instructions.\n1.12 Removed nail sculpt.\n1.13 Consulted client on nail art polish designs/techniques and\nshapes.\n1.14 Cleaned, trimmed, filed and shaped nails following client’s\npreference.\n1.15 Created advanced nail art polish designs following client’s\npreference\nin\naccordance\nwith\nproduct\nusage\nspecifications.\n1.16 Removed nail art polish designs.\n2. Resource Implications\nThe following resources should be provided:\n2.1\nModel\n2.2\nTools, equipment, supplies/materials relevant to the\nactivity to be performed\n2.3\nWork area and facilities\n3. Method of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nThird Party Report\n3.3\nPortfolio\n4. Context of\nAssessment\n4.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 96 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 92\nUNIT OF COMPETENCY : PERFORM POST SERVICE ACTIVITIES\n\nUNIT CODE\n: SOC514316\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude in\nchecking, preparing, recording, documenting and storing\nproducts, supplies, materials, tools and equipment. It involves\nsafety practices by performing housekeeping, safekeeping,\ncomplying with the agencies’ rules and regulations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\n1. Perform\nclient\naftercare\n\n1.1 Finished work is\nevaluated according to\nclient’s desired outcome.\n1.2 Client is advised on\nproper nail care and\nmaintenance following\nspa/salon policies.\n1.3 Necessary update to\nclient record is made in\naccordance with\nspa/salon policies and\nprocedures.\n1.1 Code on\nSanitation of the\nPhilippines\n1.2 Code of Ethics\n1.3 Applicable laws\nand government\nregulations\n1.4 Spa/Salon\nPolicies and\nProcedures\n1.5 Nail Technology\nProduct\nknowledge\n1.6 Chemistry\n(evaluation of\nproduct labels of\ningredients)\n1.7 Hazardous\nChemicals\n1.8 Chemical Allergic\nReactions\n1.9 Basic\nMathematics\n1.10 PPE requirement\n1.11 Common\nMicroorganisms\n1.12 Process of\nInfection\n1.13 Infection control\npractices\n1.14 Spa/salon\ndocumentation\nand records\nmanagement\n1.1 Evaluating\nfinished work\n1.2 Advising client on\nproper nail care\nand maintenance\n1.3 Updating client\nrecords\n\n2. Perform\nhousekeepin\ng procedures\n\n2.1 Equipment are cleaned,\ndisinfected and inspected\nfollowing spa/salon\npolicies and procedures\nin accordance with\n2.1 Code on\nSanitation of the\nPhilippines\n2.2 Applicable laws\nand government\nregulations\n2.1 Cleaning and\ndisinfecting of\nequipment\n2.2 Cleaning,\nsterilizing and\n\n--- PDF PAGE 97 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 93\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\nmanufacturer’s\ninstructions.\n2.2 Tools are cleaned,\nsterilized, inspected and\nsealed using an\nappropriate container or\npouch following spa/salon\npolicies and procedures\nin accordance with\nmanufacturer’s\ninstructions.\n2.3 Products, supplies and\nmaterials are replenished\nfollowing spa/salon\npolicies and procedures\nin accordance with\nproduct specifications.\n2.4 Soiled materials are\ncollected, sorted and\nplaced in designated area\nfor proper laundry\nprocessing.\n2.5 Waste materials are\ncollected following proper\nwaste management and\ndisposal procedures in\ncompliance with\napplicable laws and\ngovernment regulations.\n2.6 Workstation is cleaned,\ndisinfected and organized\nfor the next activity\nfollowing workstation\npreparation procedure.\n\n2.3 Code of Ethics\n2.4 Spa/Salon\nPolicies and\nProcedures\n2.5 Disinfection and\nSterilization\nProcesses\n2.6 Nail Technology\nEquipment, Tools,\nSupplies and\nMaterials\n2.7 Nail Technology\nProduct\nknowledge\n2.8 Chemistry\n(evaluation of\nproduct labels of\ningredients)\n2.9 Hazardous\nChemicals\n2.10 Chemical Allergic\nReactions\n2.11 Basic\nMathematics\n2.12 PPE requirement\n2.13 Common\nMicroorganisms\n2.14 Process of\nInfection\n2.15 Infection control\npractices\n2.16 Spa/salon\ndocumentation\nand records\nmanagement\n2.17 5S (Sort, Set in\nOrder, Shine,\nStandardize,\nSustain)\n2.18 Waste\nManagement and\nDisposal\n2.19 Laundry\nManagement\nsealing sets of\ntools/implements\n2.3 Inspecting\nequipment and\ntools for faults and\nbreakdown\n2.4 Replenishing\nproducts, supplies\nand materials\n2.5 Performing\nhousekeeping\nprocedures (5S)\n2.6 Managing laundry\n2.7 Implementing\nproper waste\nmanagement and\ndisposal\n2.8 Cleaning,\ndisinfecting and\norganizing\nworkstation\n\n3. Perform\nstorage and\ndocumentati\non\nprocedures\n3.1 Sanitized/sterilized\nequipment and sealed\ntools are stored\nfollowing established\nstorage procedures in\naccordance with\nmanufacturer’s\n3.1 Code on\nSanitation of the\nPhilippines\n3.2 Applicable Laws\nand Government\nRegulations\n3.3 Code of Ethics\n3.1 Storing\nequipment and\nsealing of tools\n3.2 Storing nail\nproducts,\nsupplies and\nmaterials\n\n--- PDF PAGE 98 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 94\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\n REQUIRED\nSKILLS\ninstructions and\napplicable laws and\ngovernment regulations.\n3.2 Nail products, supplies\nand materials are\nhandled and stored\nfollowing the\nestablished storage\nprocedures.\n3.3 Required\ndocumentation\nprocesses are\nperformed in\naccordance with\nspa/salon policies.\n\n3.4 Spa/Salon\nPolicies and\nProcedures\n3.5 Time\nmanagement\n3.6 Chemistry\n(evaluation of\nproduct labels of\ningredients)\n3.7 Hazardous\nChemicals\n3.8 Chemical Allergic\nReactions\n3.9 Basic\nMathematics\n3.10 Nail Technology\nEquipment, Tools,\nSupplies and\nMaterials\n3.11 Nail Technology\nProduct\nKnowledge\n3.12 Proper Handling\nand Storage of\nProducts, Tools\nEquipment,\nSupplies and\nMaterials\n3.13 Spa/Salon\nDocumentation\nand Records\nManagement\n\n3.3 Managing\nspa/salon\nrecords\n\n--- PDF PAGE 99 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 95\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Proper Nail Care and\nMaintenance\nMay include:\n1.1 Regular spa/salon visits\n1.2 Regular application of lotion and oils\n1.3 Wear suitable gloves to protect hands from chemical\nexposure and accidents in performing activities\n1.4 Avoid using nails as tools in performing tasks\n1.5 Avoid biting nails\n1.6 Use of emery boards to remove ragged free edges\nto the nails\n1.7 Use of mild/gentle soap in washing hands\n1.8 Regular hand massage\n2. Soiled Materials\nMay include:\n2.1 Towels\n2.2 Washable face mask\n2.3 Washable PPEs\n3. Laundry Processing\n(Processes)\nMay include:\n3.1 Washing (water with detergents or other chemicals)\n3.2 Soaking\n3.3 Agitation\n3.4 Rinsing\n3.5 Drying\n3.6 Pressing/ironing\n3.7 Folding\n4. Waste Materials\nMay include:\n4.1 Contaminated/Residual wastes\n4.1.1 Disposable wipes\n4.1.2 Used tissues\n4.1.3 Used cling wraps\n4.1.4 Used cotton balls\n4.1.5 Nail trimmings\n4.1.6 Hair strands\n4.1.7 Removed cuticles\n4.2 Solid wastes\n4.2.1 Product packaging\n4.2.2 Bottles\n4.2.3 Plastics\n4.2.4 Caps\n4.3 Chemical wastes\n4.3.1 Used products\n4.3.2 Product residues\n4.3.3 Throw away product excess/surplus\n4.3.4 Contaminated or expired products\n5. Waste Management and\nDisposal\nMay include:\n5.1 Prevention\n5.2 Reduction\n5.3 Segregation\n5.4 Re-use\n\n--- PDF PAGE 100 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 96\n5.5 Recycling\n6. Workstation Preparation\nProcedure\nMay include:\n6.1 Remove all clutters and dispose of wastes and\ndisposable items properly\n6.2 Collect, sort and place soiled materials in designated\nlaundry baskets\n6.3 Clean and disinfect/sterilize all tools, equipment and\nemptied product containers, place in designated\nareas to dry\n6.4 Arrange tools by set and seal using “self-sealing”\nsterilization pouch or appropriate container\n6.5 Clean and disinfect working surfaces, including chairs\nand trolley surfaces\n6.6 Organize workstation to its standard presentation\ndepending on the type of activity or service\n7. Storage Procedures\nMay include:\n7.1 Equipment\n7.1.1 Inspect equipment for defect and damages\nbefore storing\n7.1.2 Must be turned off and detached from power\nsource with power cords and components\nsecured properly\n7.1.3 Read safety data sheet/manual on storage\ninstructions\n7.2 Tools\n7.2.1 Wash, disinfect/sterilize and pack/seal tools\nproperly before storing\n7.2.2 Store all sharp implements including heat-\nproducing tools and equipment separately in\ntheir designated place\n7.2.3 Label the storage cabinet or place correctly for\nimmediate finding\n7.2.4 Store in an accessible area, where it is easy to\nretrieve when needed\n7.2.5 Store in clean, dry area according to\nmanufacturer’s instructions and applicable laws\nand government regulations\n7.3 Supplies and Materials\n7.3.1 Store in clean, dry area according to\nmanufacturer’s instructions and applicable laws\nand government regulations\n7.3.2 Store according to type and frequency of use\n7.3.3 Thoroughly clean and dry containers before\nrefilling\n7.3.4 Observe FIFO method in organizing storage of\nproducts\n7.3.5 Do not return excess/surplus or contaminated\nproducts back into its original containers\n7.4 Products/Chemicals\n7.4.1 Read safety data sheet, manufacturer’s\ninstructions, and applicable laws and\n\n--- PDF PAGE 101 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 97\ngovernment regulations and follow\nrecommendations.\n7.4.2 Flammable products/chemicals must be stored\nin a separate, cool, ventilated and dry area\naway from direct sunlight, heat or sources of\nignition\n7.4.3 All chemicals should be kept in their original\ncontainers or in properly labeled containers of\nan appropriate type or in small bottles with\nsmall openings and label them with the\ninformation from the manufacturer’s label.\n7.4.4 Close bottles tightly when you are not using\nthem so the product does not spill or get into\nthe air\n7.4.5 Do not store liquids above solids to avoid\ncontamination in the event of a leak and use\nspill trays, if applicable\n7.4.6 Chemicals must be stored in secure and not\noverloaded shelves no higher than eye level\ninside a locked, labeled cupboard or room\nwhere it is accessible only to authorized\npersons and where breaking or tipping cannot\nhappen.\n7.4.7 Primers, acrylic liquids, and top coats require\nstorage in an opaque container. This is\nbecause the products contain light-sensitive\n(“photo-chemically reactive”) chemicals that\ncause the product to weaken or prematurely\nharden when exposed to light.\n7.4.8 Polymer lids should to be tightly closed so\nmoisture in the air does not interact with the\npowder. Monomers can thicken and become\ngel like, begin to set too slowly or even\ncompletely harden when it is has gone bad\nwhereas polymers tend to discolor and change\nin texture.\n7.4.9 Gel polish bottles should be stored away from\nexposure to natural sunlight. Don't leave them\nsitting out in front of a window or in a bright\nroom that gets a lot of light. Ideally they should\nbe stored somewhere dark like in a closet, box\nor drawer.\n8. Documentation Processes May include:\n8.1 Products, supplies and materials logbook\n8.2 Inventory reports\n8.3 Client information e.g., consultation forms,\nservice/treatment records, appointment logbooks,\ndigital client data base, client information sheets\n8.4 Sales and revenue reports\n8.5 Employee records e.g., attendance, 201 files,\nmemorandums and reports\n\n--- PDF PAGE 102 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 98\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated finished work according to client’s desired\noutcome.\n1.2\nAdvised client on proper nail care and maintenance\nfollowing spa/salon policies.\n1.3\nCleaned, disinfected and inspected equipment\nfollowing spa/salon policies and procedures in\naccordance with manufacturer’s instructions.\n1.4\nCleaned, sterilized, inspected and sealed tools using\nappropriate container/pouch following spa/salon\npolicies and procedures in accordance with\nmanufacturer’s instructions.\n1.5\nCollected, sorted and placed soiled materials in\ndesignated area for proper laundry processing.\n1.6\nCollected waste materials following proper waste\nmanagement and disposal procedures.\n1.7\nCleaned, disinfected and organized workstation for\nthe next activity following workstation preparation\nprocedures.\n1.8\nStore sanitized/sterilized equipment and tools\nfollowing established storage procedures.\n1.9\nHandled and stored nail products, supplies and\nmaterials following established storage procedures.\n1.10 Performed required documentation processes in\naccordance with spa/salon policies.\n2. Resource Implications\nThe following resources should be provided:\n2.1\nModel\n2.2\nTools, equipment, supplies/materials relevant to the\nactivity to be performed\n2.3\nWork area and facilities\n3. Method of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with oral questioning\n3.2\nThird Party Report\n3.3\nPortfolio\n4. Context of\nAssessment\n4.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 103 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 99\nSECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for BEAUTY CARE (NAIL ENHANCEMENT TECHNOLOGY)\nSERVICES NC III.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\n Delivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: BEAUTY CARE (NAIL ENHANCEMENT Level: NC III\n TECHNOLOGY) SERVICES\n\nNominal Training Duration:\n\n40 Hours (Basic Competencies)\n\n 24 Hours (Common Competencies)\n\n120 Hours (Core Competencies)\n\n184\n\n40 Supervised Industry Learning (SIL)\n\n224 TOTAL HOURS\n\nCourse Description:\n\n This course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in performing pre and post\nservice activities, preparing appropriate products, tools and equipment procedures,\nperforming nail enhancement technology procedures, and performing advanced nail\npolish procedures. This include classroom learning activities and practical work in\nactual work site or simulation area.\n\n Upon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 104 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 100\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout workplace\nprocesses\n• Read\no Effective verbal communication methods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for written\nand electronic communication methods\n• Follow organization requirements for the use\nof written and electronic communication\nmethods\n• Perform exercises on understanding and\nconveying intended meaning scenario\n• Lecture\n• Demonstration\n• Practical exercises\n• Role Play\n• Written Test\n• Observation\n2 hours\n\n1.2 Lead workplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan setting\n• Read\no Effective verbal communication methods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 hours\n\n1.3 Identify and\ncommunicate\nissues arising in\nthe workplace\n• Descr