mentation\nprocedures\n•\nLecture and discussion on the\n following topics:\no Code on Sanitation of the Philippines\no Applicable Laws and Government\nRegulations\no Code of Ethics\no Spa/Salon Policies and Procedures\no Time management\no Chemistry (evaluation of product labels\nof ingredients)\no Hazardous Chemicals\no Chemical Allergic Reactions\no Basic Mathematics\no Nail Technology Equipment, Tools,\nSupplies and Materials\no Nail Technology Product Knowledge\n•\nLecture\n•\nDiscussion\n•\nVideo\nPresentation\n•\nCase\nstudy/discussion\n•\nGroup discussion\n•\n(SLE)Self\nLearning\nExperience\n•\nReporting\n•\nDemonstration\nwith oral\nquestioning\n•\nInterview\n•\nOral evaluation\n\n 5 hours\n\n--- PDF PAGE 139 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 135\nUnit of\nCompetency\nLearning\nOutcome\nLearning Activity\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Proper Handling and Storage of\nProducts, Tools Equipment, Supplies\nand Materials\no Spa/Salon Documentation and Records\nManagement\n•\nPerform the following tasks;\no Storing equipment and sealing of tools\no Storing nail products, supplies and\nmaterials\no Managing spa/salon records\n•\nLecture/Review\n•\nDemonstration\n•\nVideo\nPresentation\n•\nSelf-Learning\n•\nCase study\n•\nGroup\ndemonstration\n•\n(SLE)Self\nLearning\nExperience\n•\nDemonstration\nwith return demo\n•\nRole-playing\n•\nObservation\n•\nDemonstration\nwith oral\nquestioning\n\n--- PDF PAGE 140 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 136\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\nb.\nTraining delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency – based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards\nspecified\nby\nthe\nindustry.\nThe\nfollowing\ntraining\nmodalities\nand\ntheir\nvariations/components may be adopted singly or combination with other modalities\nwhen designing and delivering training programs:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\n\n--- PDF PAGE 141 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 137\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n\n•\nThe traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship – is based on training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits\nto contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – short term programs conducted by Non-Government\nOrganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be Mobile Training Programs\n(MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the following\nrequirements:\n\n•\nCompleted at least ten (10) years of basic education or Holder of Alternative\nLearning System (ALS) certificate of completion with Grade 10 equivalent;\n•\nBasic communication skills\n\n--- PDF PAGE 142 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 138\n 3.4 TOOLS, MATERIALS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of 20 trainees for\nBEAUTY CARE (NAIL ENHANCEMENT TECHNOLOGY) SERVICES NC III.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their availability in\nthe local market.\n\n TOOLS\nQUANTITY UNIT\nDESCRIPTION/SPECIFICATION\n15\nPCS\nNipper\n15\nPCS\nNail cutter\n15\nPCS\nCuticle pusher (Spoon type)\n15\nPCS\nFinger nail cutter\n15\nPCS\nScissor (small)\n15\nPCS\nAbrasive board/Emery board\n15\nPCS\nBuffer block\n15\nPCS\nWooden/Metal pusher\n15\nPCS\nAbrasive nail and buffer\n15\nPCS\nTweezers\n15\nPCS\nNail brush (#4 or #6)\n15\nPCS\nChamois buffer\n15\nPCS\nGlass crystal file\n15\nPCS\nMetal file\n15\nPCS\nNail file (180 grit)\n15\nPCS\nNail file (120 grit)\n15\nPCS\nNail buffer\n15\nPCS\nEmery board\n15\nPCS\nPoint brush\n15\nPCS\nGel brush (334 #36)\n15\nPACKS\nOrange wood sick (3 pcs. Per pack)\n\n EQUIPMENT\nQUANTITY\nUNIT\nDESCRIPTION/SPECIFICATION\n15\nPCS\nNail service table\n15\nPCS\nClient chair\n15\nPCS\nStool\n15\nPCS\nSupply tray\n15\nPCS\nBin\n15\nPCS\nNail Dryer Lamp\n\n SUPPLIES AND MATERIALS\nQUANTITY\nUNIT\nDESCRIPTION/SPECIFICATION\n15\nPCS\nFinger bowl\n15\nPCS\nWipe container/container for cotton\n15\nPCS\nTerry cloth (disposable towel)\n15\nPCS\nCotton balls (100 pcs per pack)\n15\nPACKS\nFlat facial cotton (100 pcs per pack)\n\n--- PDF PAGE 143 ---\nTR -