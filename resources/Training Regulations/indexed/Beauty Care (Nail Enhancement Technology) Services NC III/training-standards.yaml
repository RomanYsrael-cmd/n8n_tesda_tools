d practices\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 hour\n4.2 Work effectively\nin an\nenvironment\nthat\nacknowledges\nand values\ncultural diversity\n• Explain the value of diversity in the economy\nand society in terms of Workforce\ndevelopment\n• Discuss the importance of inclusiveness in a\ndiverse environment\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n1 hour\n\n--- PDF PAGE 109 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 105\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Discuss the importance of shared vision and\nunderstanding of and commitment to team,\ndepartmental, and organizational goals and\nobjectives\n• Identify and exhibit strategies for customer\nservice excellence\n• Demonstrate cross-cultural communication\nskills and active listening\n• Recognize diverse groups in the workplace\nand community as defined by divergent\nculture, religion, traditions and practices\n• Demonstrate collaboration skills\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n4.3 Identify common\nissues in a\nmulticultural and\ndiverse\nenvironment\n• Explain the value, and leverage of cultural\ndiversity\n• Discuss the inclusivity and conflict resolution\n• Describe the workplace harassment\n• Explain the change management and cite\nways to overcome resistance to change\n• Demonstrate advanced strategies for\ncustomer service excellence\n• Address diversity-related conflicts in the\nworkplace\n• Eliminate discriminatory behavior towards\ncustomers and co-workers\n• Utilize change management policies in the\nworkplace\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1\nho\nur\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\nthe organization\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in terms\nof innovative\npractices\n\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheoretical model of behavior change)\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n1 hour\n\n--- PDF PAGE 110 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate collaboration and networking\nskills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly effective\npeople, character strengths that foster\nlearning and innovation, five minds of the\nfuture, adaptation concepts and\ntranstheor