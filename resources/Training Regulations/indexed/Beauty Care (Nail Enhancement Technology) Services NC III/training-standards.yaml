    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for BEAUTY CARE (NAIL ENHANCEMENT TECHNOLOGY)\nSERVICES NC III.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\n Delivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title: BEAUTY CARE (NAIL ENHANCEMENT Level: NC III\n TECHNOLOGY) SERVICES\n\nNominal Training Duration:\n\n40 Hours (Basic Competencies)\n\n 24 Hours (Common Competencies)\n\n120 Hours (Core Competencies)\n\n184\n\n40 Supervised Industry Learning (SIL)\n\n224 TOTAL HOURS\n\nCourse Description:\n\n This course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in performing pre and post\nservice activities, preparing appropriate products, tools and equipment procedures,\nperforming nail enhancement technology procedures, and performing advanced nail\npolish procedures. This include classroom learning activities and practical work in\nactual work site or simulation area.\n\n Upon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 104 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 100\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit o