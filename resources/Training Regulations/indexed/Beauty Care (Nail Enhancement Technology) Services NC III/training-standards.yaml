ojector\n2\nUNITS\nLaptop\n2\nUNITS\nWhite board (4ftx8ft.\n5\nPCS.\nCatalog\n\n *PPE (clothing/materials) and tools will be provided by the students.\n\nNAIL RESTORATION (over-lay and fillers Methods using Wrap, Acrylic, Gel,)\nNAIL EXTENSION (Plastic Tips, Nail Form and Gel, Acrylic)\nNAIL SCULPTING (Nail Form and Gel, Nail Form and Acrylic)\nADVANCED NAIL POLISH PROCEDURE (Nail Art designs/Ornament)\n\n--- PDF PAGE 145 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 141\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 20 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ. METERS\nContextual Learning Area\n(Lecture room)\n\n8 x 4\n\n32\n\n32\nWorking Area/Demo Room\n(Laboratory/Workshop/\nActivity area)\n\n8 x 5\n\n40\n\n40\nLearning Resource Area\n\n4 x 4\n\n16\n\n16\nStorage Area (Tool room &\nS/M storage area)\n\n2 x 2\n\n4\n\n4\nCirculation Area (30% of the\nTotal Building Area\n\n29\n29\nWash area/ comfort room\n(Male, Female, PWD)\n2 x 2\n4\n4\nGRAND TOTAL AREA:\n125 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR BEAUTY CARE (NAIL ENHANCEMENT\nTECHNOLOGY) SERVICES NC III\n\n• Must be a holder of National TVET Trainers Certificate (NTTC) Level I in Beauty\nCare (Nail Enhancement Technology) Services NC III\n• Must possess good communication skills\n• Must have at least two (2) years experience in beauty and wellness industry for\nthe last five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 146 ---\nTR - Beauty Care (Nail Enhancement Technology) Services NC III Revision 01 Promulgated (06/09/2020) 142"
