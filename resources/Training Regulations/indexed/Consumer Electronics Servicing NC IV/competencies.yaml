        "evidence_guide": {
          "source_text": "s)\n2.14 National and State guidelines , policies and imperatives\nrelating to the environment\n3. Appropriate\npersonnel\nIndividuals with responsibilities for co-ordination, design\ninstallation, maintenance, production, or servicing activities may\ninclude:\n3.1\nSite managers\n3.2\nProject managers\n3.3\nEngineers and technicians\n3.4\nTechnical experts\n3.5\nLine managers/supervisors\n3.6\nRegulatory personnel\n3.7\nTeam leaders\n3.8\nOther personnel designated by an organization or\nenterprise\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 46\n\n4. Consumer\nelectronics products\n4.1 Audio & video product\n4.2 Electronically-controlled domestic appliances\n4.3 Cellular phones\n5. Established\nprocedures\nFormal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done. These may\ninclude\n5.1\nQuality assurance systems incorporating, for example:\n5.1.1 Continues quality improvement procedures\n5.1.2 Work orders / instructions\n5.1.3 Reporting procedures\n5.1.4 Procurement procedures\n5.1.5 Accounting procedures\n5.1.6 Human resources development procedures\n5.2\nWork clearance systems incorporating, for example:\n5.2.1 Work permits\n5.2.2 Municipal permits\n5.2.3 Monitoring and clearance procedures\n5.2.4 Isolation procedures\n5.3\nOH&S practices\n5.4\nProcedures for operating safety systems, operating\nplant and equipment and reporting work activities\n5.5\nMaintenance, modification or supply of relevant\nschematic drawings and technical data\n5.6\nArrangements for dealing with emergency situations.\n\n6. Unplanned events\nor conditions\nMay include but not limited to:\n6.1\nAccidents/incidents\n6.2\nBrownout\n6.3\nEquipment breakdown\n6.4\nForce majeure e.g., earthquake, fire, typhoon\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 47\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared management of servicing and\nmaintenance in accordance with OH&S policies and\nprocedures\n1.2. Checked programs to be developed for servicing and\nmaintenance according to job requirements\n1.3. Identified and detailed tools, equipment and materials needed\nto carry out work as specified in the user’s manual and\nestablished procedures\n1.4. Used mechanisms to measure, record and report progress of\nactivities in relation to the agreed servicing and maintenance\nschedules and plans\n1.5. Maintained records and documentation of servicing and\nmaintenance activities\n1.6. Reported quality management issues and responses in\naccordance with established procedures\n\n2. Underpinning\nknowledge and\nattitude\n2.1. Basic Electronics\n2.2. Computer operations\n2.3. Flow charting\n2.4. Business plan development\n2.4.1. Marketing plan\n2.4.2. Production plan\n2.4.3. Organization and management plan\n2.4.4. Financial plan\n2.5. Laws, and regulation, Electrical and electronic code\n2.6. Quality improvement\n2.6.1. Continuous process Improvement Philosophies\nand principals\n2.6.2. Product/Service Development\n2.6.3. Manufacturing Product/providing services\n2.6.4. Inspection of raw materials and outgoing\nproduct\n2.7. Management\n2.7.1. HR Recourses management\n2.7.2. Fiscal management\n2.7.3. ISO 9000\n2.7.4. Procurement management\n2.7.5. Records management\n2.7.6. Property management\n\n--- PDF PAGE 50 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 48\n\n3. Underpinning skills\n3.1. Formulating Continuous Improvement policies and\nguidelines\n3.2.\nBenchmarking\n3.3.\nPreparing process capability control chart\n3.4.\nSkills in operation of Basic computer system\napplication\n3.5.\nDrawing system and process flow chart\n3.6.\nPartnering with suppliers\n4. Resource\nimplications\nIncludes but not limited to:\n4.1. Personal computer\n4.2. Working table\n4.3. Diagram/manuals and other repair reference of different\nconsumer electronic product\n4.4. ISO 9000 Handbook\n4.5. Work and financial plan\n5. Method of\nassessment\nThe assessor must select at least two of the following\nassessment methods to objectively assess the candidate:\n5.1. Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2. Case study problem/Written report\n5.3. Interview\n5.4. Portfolio\n5.5. Third Party Report\n6. Context of\nassessment\n6.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 49\n\nUNIT OF COMPETENCY :\nTRAIN SERVICE TECHNICIAN SUPERVISORS\nUNIT CODE\n:"
