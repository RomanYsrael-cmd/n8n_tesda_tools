          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPlanned and prepared training activities\n1.2.\nMentored technician service supervisor\n1.3.\nMonitored and check program\n1.4.\nDocument the training program\n1.5.\nProvide feedback technical supervisor\n1.6.\nSubmitted requirement report to responsible person\n2. Underpinning\nknowledge and\nattitude\n2.1\nFundamentals of maintaining and servicing audio-video\nproducts and systems\n2.2. Fundamentals of maintaining and servicing cellular\nphones\n2.3. Fundamentals of maintaining and servicing of\nelectronically-controlled domestic appliances\n2.4. Fundamentals of coaching and mentoring\n2.5. Theories of adult learning\n2.6. Methods of teaching\n2.7. Fundamentals of continues improvement\n2.8. Fundamentals of supervisor knowledge and skills\n2.9. Enterprise policies and guidelines\n\n3. Underpinning skills\n3.1.\nWork efficiency\n3.2.\nCommunication skills in providing instruction to service\ntechnician supervisor\n3.3.\nImplementing training plan\n3.4.\nSkills in troubleshooting consumer electronics\n3.5.\nApplying work safety practices and time management\n3.6.\nSkills in operation of basic computer software\napplication\n3.7.\nApplying principle of continuous quality improvement\n\n4. Resource\nimplications\nMay includes but not limited to:\n4.1. Lecture room\n4.2. monitoring report\n4.3. Training plan\n4.4. work procedures\n5. Method of\nassessment\nThe assessor must select at least two of the following\nassessment methods to objectively assess the candidate:\n5.1. Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2. Case Study/Written report\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC 