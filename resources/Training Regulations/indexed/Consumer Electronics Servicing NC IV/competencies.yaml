lan\n4.4. work procedures\n5. Method of\nassessment\nThe assessor must select at least two of the following\nassessment methods to objectively assess the candidate:\n5.1. Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2. Case Study/Written report\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 52\n\n5.3. Interview\n5.4. Portfolio\n5.5. Third Party Report\n\n6. Context of\nassessment\n6.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 53"
