ed environmental practices on a\nperiodic basis as per company guidelines\n1.5 Recommended solutions for the improvement of the\nprogram\n1.6 Monitored and reported to proper authorities any\nenvironmental incidents\n 2. Underpinning\nKnowledge\n2.1 Features of an environmental management strategy\n2.2 Environmental issues/concerns\n2.3 International Environmental Protocols (Montreal, Kyoto)\n2.4 Waste minimization hierarchy\n2.5 Environmental planning/management\n2.6 Community needs and expectations\n2.7 Resource availability\n2.8 Environment-friendly/environmental advocates\n2.9 5S of Good Housekeeping\n2.10 3Rs – Reduce, Reuse & Recycle\n 2.11 Sanitary Code\n2.12 Environmental Code of practice\n 3. Underpinning\n Skills\n3.1 Communicating effectively\n3.2 Performing research and analysis\n3.3 Reading / interpreting data and information\n3.4 Problem solving\n 4. Resource\nImplications\n The following resources MUST be provided:\n4.1 Workplace/Assessment location\n4.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n4.3 Case studies/scenarios relating to environmental\n protection\n 5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Written/ Oral Examination\n5.2 Interview/Third Party Reports\n5.3 Portfolio (citations/awards from GOs and NGOs,\ncertificate of training – local and abroad)\n 5.4 Simulations and role-plays\n 6. Context for\nAssessment\n6.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 27 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 25\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:\nELC724201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on the safe\nuse, handling and maintenance of tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntasks to be undertaken\n1.1. Tasks to be undertaken are properly identified\n1.2. Appropriate hand tools are identified and\nselected according to the task requirements\n2. Prepare hand tools\n2.1. Appropriate hand tools are checked for proper\noperation and safety\n2.2. Unsafe or faulty tools are identified and marked for\nrepair according to standard company procedure\n3. Use appropriate hand\ntools and test equipment\n3.1. Tools are used according to tasks undertaken\n3.2. All safety procedures in using tools are observed\nat all times and appropriate personal protective\nequipment (PPE) are used\n3.3. Malfunctions, unplanned or unusual events are\nreported to the supervisor\n4. Maintain hand tools\n4.1. Tools are handled without damage according to\nprocedures\n4.2. Routine maintenance of tools undertaken\naccording to standard operational procedures,\nprinciples and techniques\n4.3. Tools are stored safely in appropriate locations in\naccordance with manufacturer’s specifications or\nstandard operating procedures\n\n--- PDF PAGE 28 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 26\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\n1.1.\nHand tools for adjusting, dismantling, assembling,\nfinishing, cutting. Tool set includes the following\nbut not limited to: screw drivers, pliers, punches,\nwrenches, files\n2. Personal Protective\nEquipment (PPE)\n2.1.\nGloves\n2.2.\nProtective eyewear\n2.3.\nApron/overall\n3. Maintenance\n3.1.\nCleaning\n3.2.\nLubricating\n3.3.\nTightening\n3.4.\nSimple tool repairs\n3.5.\nHand sharpening\n3.6.\nAdjustment using correct procedures\n\n--- PDF PAGE 29 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 27\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes,\nevents or tasks being undertaken to ensure a\nsafe and efficient working environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate\nlocation\n2. Underpinning\nknowledge\n\n2.1. Safety\n2.1.1.\nSafety requirements in handling tools\n2.2. Tools :\n2.2.1. Function, Operation, Common faults\n2.3. Processes, Operations, Systems\n2.3.1.\nMaintenance of tools\n2.3.2.\nStorage of Tools\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction and numerical skills\n3.2. Communication skills\n3.3. Problem solving in emergency situation\n4. Method of assessment\nCompetency in this unit must be assessed through:\n4.1. Observation\n4.2. Oral questioning\n5. Resource Implication\n5.1. Tools may include the following but not limited to:\n5.1.1.\nscrew drivers\n5.1.2.\npliers\n5.1.3.\npunches\n5.1.4.\nwrenches, files\n6. Context of Assessment\n\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 30 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 28\n\nUNIT TITLE\n:\nPERFORM MENSURATION AND CALCULATION\nUNIT CODE\n: ELC311201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded identify, care, handle and use measuring instruments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Select measuring\ninstruments\n1.1. Object or component to be measured is\nidentified according to procedures\n1.2. Correct specifications are obtained from relevant\nsource\n1.3. Measuring tools are selected in line with job\nrequirements\n2. Carry out measurements\nand calculation\n2.1. Appropriate measuring instrument is selected\nto achieve required outcome\n2.2. Accurate measurements are obtained for job\n2.3. Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x),\nand division (/)\n2.4. Calculation involving fractions, percentages and\nmixed numbers are used to complete workplace\ntasks.\n2.5. Numerical computation is checked and corrected\nfor accuracy\n2.6. Instruments are read to the limit of accuracy of\nthe tool.\n3. Maintain measuring\ninstruments\n3.1. Measuring instruments are handled without\ndamage according to procedures\n3.2. Measuring instruments are cleaned before and\nafter using.\n3.3. Proper storage of instruments are undertaken\naccording to manufacturer’s specifications and\nstandard operating procedures.\n\n--- PDF PAGE 31 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 29\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\n1.1. Straight edge\n1.2. Torque gauge\n1.3. Try square\n1.4. Protractor\n1.5. Combination gauge\n1.6. Steel rule\n2. Calculation\n\nKinds of part mensuration includes the following\nbut not limited to\n2.1. Volume\n2.2. Area\n2.3. Displacement\n2.4. Inside diameter\n2.5. Circumference\n2.6. Length\n2.7. Thickness\n2.8. Outside diameter\n2.9. Taper\n2.10. Out of roundness\n\n--- PDF PAGE 32 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 30\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected proper measuring instruments\naccording to tasks\n1.2. Carried out measurement and calculations\n1.3. Maintained and stores instruments\n2. Underpinning knowledge\n2.1. Types of measuring instruments and their uses\n2.2. Safe handling procedures in using measuring\ninstruments\n2.3. Four fundamental operation of mathematics\n2.4. Formula for volume, area, perimeter and other\ngeometric figures\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Handling measuring instruments\n3.4. Performing mathematical calculations using\nthe four fundamental operations\n3.5. Visualizing objects and shapes\n3.6. Interpreting formulae\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Observation\n4.2. Oral questioning\n5. Resource implication\n5.1. Place of assessment\n5.2. Measuring instruments\n5.3. Straight edge\n5.4. Torque gauge\n5.5. Try square\n5.6. Protractor\n5.7. Combination gauge\n5.8. Steel rule\n6. Context of Assessment\n6.1. Assessment may be conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 33 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 31\n\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\nUNIT CODE\n: ELC311202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded to prepare/interpret diagrams, engineering abbreviation\nand drawings, symbols, dimension.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Identify different kinds of\ntechnical drawings\n1.1. Correct technical drawing is selected\naccording to job requirements.\n1.2. Technical drawings are segregated in\naccordance with the types and kinds of\ndrawings\n2. Interpret technical drawing\n2.1. Components, assemblies or objects are\nrecognized as required.\n2.2. Dimensions of the key features of the\nobjects depicted in the drawing are correctly\nidentified.\n2.3. Symbols used in the drawing are identified\nand interpreted correctly.\n2.4. Drawing is checked and validated against job\nrequirements or equipment in accordance\nwith standard operating procedures.\n3. Prepare/make changes to\nelectrical/electronic\nschematics and drawings\n3.1. Electrical/electronic schematic is drawn and\ncorrectly identified.\n3.2. Correct drawing is identified, equipment are\nselected and used in accordance with job\nrequirements.\n4. Store technical drawings and\nequipment /instruments\n4.1. Care and maintenance of drawings are\nundertaken according to company\nprocedures.\n4.2. Technical drawings are recorded and\ninventory is prepared in accordance with\ncompany procedures.\n4.3. Proper storage of instruments is undertaken\naccording to company procedures.\n\n--- PDF PAGE 34 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical drawings\nTechnical drawings include the following but not\nlimited to:\n\n1.1. Schematic diagrams\n1.2. Charts\n1.3. Block diagrams\n1.4. Lay-out plans\n1.5. Location plans\n1.6. Process and instrumentation diagrams\n1.7. Loop diagrams\n1.8. System Control Diagrams\n2. Dimensions\nDimensions may include but not limited to:\n\n2.1. Length\n2.2. Width\n2.3. Height\n2.4. Diameter\n2.5. Angles\n3. Symbols\nMay include but not limited to:\n\n3.1. NEC- National Electric Code\n3.2. IEC -International Electrotechnical Commission\n3.3. ASME - American Society of Mechanical\nEngineers\n3.4. IEEE - Institute of Electrical and Electronics\nEngineers\n3.5. ISA - Instrumentation System and Automation\nSociety\n4. Instruments/Equipment\n4.1. Components/dividers\n4.2. Drawing boards\n4.3. Rulers\n4.4. T-square\n4.5. Calculator\n\n--- PDF PAGE 35 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 33\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetencies\nAssessment requires evidence that the candidate:\n\n1.1. Selected correct technical drawing in line with job\nrequirements\n1.2. Correctly identified the objects represented in the\ndrawing\n1.3. Identified and interpreted symbols used in the\ndrawing correctly\n1.4. Prepared/Produced electrical/electronic drawings\nincluding all relevant specifications\n1.5. Stored diagrams/equipment\n2. Underpinning\nknowledge\n2.1. Drawing conventions\n2.2. Symbols\n2.3. Dimensioning Conventions\n2.4. Mark up/Notation of Drawings\n2.5. Mathematics\n2.5.1. Four fundamental operations\n2.5.2. Percentage\n2.5.3. Fraction\n2.5.4. Trigonometric Functions\n2.5.5. Algebra\n2.5.6. Geometry\n3. Underpinning skills\n3.1. Reading skills required to interpret work instruction\n3.2. Communication skills\n3.3. Interpreting electrical/electronic signs and symbols\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Practical tasks involving interpretation of a range of\ntechnical drawings\n4.2. Oral questioning\n5. Resource implication\n5.1. Drawings\n5.2. Diagrams\n5.3. Charts\n5.4. Plans\n6. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 36 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 34\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:\nELC315202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to apply quality standards in the workplace.\nThe unit also includes the application of relevant safety\nprocedures and regulations, organization procedures and\ncustomer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials or\ncomponents\n1.1. Work instructions are obtained and work is carried\nout in accordance with standard operating\nprocedures\n1.2. Received materials or component parts are\nchecked against workplace standards and\nspecifications\n1.3. Faulty material or components related to work are\nidentified and isolated\n1.4. Faults and any identified causes are recorded\nand/or reported to the supervisor concerned in\naccordance with workplace procedures\n1.5. Faulty materials or components are replaced in\naccordance with workplace procedures\n2. Assess own work\n2.1. Documentation relative to quality within the\ncompany is identified and used\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken\n2.3. Faulty pieces are identified and isolated\n2.4. Information on the quality and other indicators of\nproduction performance is recorded in accordance\nwith workplace procedures\n2.5. Deviations from specified quality standards,\ncauses are documented and reported in\naccordance with the workplace’ standards\noperating procedures\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated\nin relation to workplace assignment\n3.2. Work is carried out in accordance with process\nimprovement procedures\n3.3. Performance of operation or quality of product or\nservice to ensure customer satisfaction is\nmonitored\n\n--- PDF PAGE 37 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 35\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. wires\n1.1.2. cables, soldering lead\n1.1.3. electrical tape\n1.2. Components may include but not limited to:\n1.2.1. ICs\n1.2.2. Diodes\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Quality standards\n4.1. Quality standards may relate but not limited to\nthe following:\n4.1.1. materials\n4.1.2. component parts\n4.1.3. final product\n4.1.4. production processes\n5. Customer\n5.1. Co-worker\n5.2. Supplier\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 38 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 36\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Underpinning knowledge\n2.1. Relevant production processes, materials and\nproducts\n2.2. Characteristics of materials/component parts\nused in electronic production processes\n2.3. Quality checking procedures\n2.4. Workplace procedures\n2.5. Safety and environmental aspects of production\nprocesses\n2.6. Fault identification and reporting\n2.7. Quality improvement process\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills needed to interpret and\napply defined work procedures\n3.3. Carry out work in accordance with OHS policies\nand procedures\n4. Method of assessment\n4.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n\n5.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n6. Context of Assessment\n\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment.\n\n--- PDF PAGE 39 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 37\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n:\nELC311203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to perform computer operations which include\ninputting, accessing, producing and transferring data using the\nappropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Plan and prepare\nfor task to be\nundertaken\n1.1. Requirements of task are determined according to job\nspecifications\n1.2. Appropriate hardware and software are selected according\nto task assigned and required outcome\n1.3. Task is planned to ensure OH & S guidelines and\nprocedures are followed\n2. Input data into\ncomputer\n2.1. Data are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2. Accuracy of information is checked and information is saved\nin accordance with standard operating procedures\n2.3. Inputted data are stored in storage media according to\nrequirements\n2.4. Work is performed within ergonomic guidelines\n3. Access\ninformation using\ncomputer\n3.1. Correct program/application is selected based on job\nrequirements\n3.2. Program/application containing the information required is\naccessed according to company procedures\n3.3. Desktop icons are correctly selected, opened and closed\nfor navigation purposes\n3.4. Keyboard techniques are carried out in line with OH & S\nrequirements for safe use of keyboards\n4. Produce/output\ndata using\ncomputer system\n4.1. Entered data are processed using appropriate software\ncommands\n4.2. Data printed out as required using computer\nhardware/peripheral devices in accordance with standard\noperating procedures\n4.3. Files, data are transferred between compatible systems\nusing computer software, hardware/ peripheral devices in\naccordance with standard operating procedures\n5. Maintain computer\nequipment and\nsystems\n5.1. Systems for cleaning, minor maintenance and replacement\nof consumables are implemented\n5.2. Procedures for ensuring security of data, including regular\nback-ups and virus checks are implemented in accordance\nwith standard operating procedures\n5.3. Basic file maintenance procedures are implemented in line\nwith the standard operating procedures\n\n--- PDF PAGE 40 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 38\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and peripheral\ndevices\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7. Mouse\n2. Software\nSoftware includes the following but not limited to:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n3. OH & S guidelines\n3.1. OHS guidelines\n3.2.\nEnterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1. diskettes\n4.2. CDs\n4.3. zip disks\n4.4. hard disk drives, local and remote\n5. Ergonomic guidelines\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5. Visual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1. directories/folders\n6.2. files\n6.3. network devices\n6.4. recycle bin\n7. Maintenance\n7.1. Creating more space in the hard disk\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 41 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 39\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Selected and used hardware components\ncorrectly and according to the task requirement\n1.2. Identified and explained the functions of both\nhardware and software used, their general\nfeatures and capabilities\n1.3. Produced accurate and complete data in\naccordance with the requirements\n1.4. Used appropriate devices and procedures to\ntransfer files/data accurately\n1.5. Maintained computer system\n2. Underpinning knowledge\n2.1. Basic ergonomics of keyboard and computer use\n2.2. Main types of computers and basic features of\ndifferent operating systems\n2.3. Main parts of a computer\n2.4. Storage devices and basic categories of memory\n2.5. Relevant types of software\n2.6. General security\n2.7. Viruses\n2.8. OH & S principles and responsibilities\n2.9. Calculating computer capacity\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n4. Method of assessment\n4.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n5.1. Computer hardware with peripherals\n5.2. Appropriate software\n6. Context of Assessment\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 42 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 40\n\nUNIT TITLE\n:\nTERMINATE AND CONNECT ELECTRICAL WIRING AND\nELECTRONICS CIRCUIT\nUNIT CODE\n:\nELC724202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to terminate and connect electrical wiring and\nelectronic circuits\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntermination/connection of\nelectrical\nwiring/electronics circuits\n1.1. Materials are checked according to specifications\nand tasks\n1.2. Appropriate tools and equipment are selected\naccording to tasks requirements\n1.3. Task is planned to ensure OH & S guidelines and\nprocedures are followed\n1.4. Electrical wiring/electronic circuits are correctly\nprepared for connecting/termination in accordance\nwith instructions and work site procedures\n2. Terminate/connect\nelectrical wiring/electronic\ncircuits\n2.1. Safety procedures in using tools are observed at all\ntimes and appropriate personal protective\nequipment are used\n2.2. Work is undertaken safely in accordance with the\nworkplace and standard procedures\n2.3. Appropriate range of methods in\ntermination/connection are used according to\nspecifications, manufacturer’s requirements and\nsafety\n2.4. Correct sequence of operation is followed\naccording to job specifications\n2.5. Accessories used are adjusted, if necessary\n2.6. Confirm termination/connection undertaken\nsuccessfully in accordance with job specification\n3. Test\ntermination/connections\nof electrical\nwiring/electronics circuits\n3.1. Testing of all completed termination/ connections of\nelectric wiring/electronic circuits is conducted for\ncompliance with specifications and regulations\nusing appropriate procedures and equipment\n3.2. Wiring and circuits are checked using specified\ntesting procedures\n3.3. Unplanned events or conditions are responded to\nin accordance with established procedures\n\n--- PDF PAGE 43 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 41\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\n1.1 Materials included the following but not limited to:\n1.1.1 Soldering lead\n1.1.2 Cables\n1.1.3 Wires\n2. Tools and equipment\n2.1 Tools for measuring, cutting, drilling,\nassembling/disassembling. Tool set includes the\nfollowing but not limited to:\n2.1.1 Pliers\n2.1.2 Cutters\n2.1.3 Screw drivers\n2.2 Equipment\n2.2.1 Soldering gun\n2.2.2 Multi-tester\n3. Personal protective\nequipment\n3.1 goggles\n3.2 gloves\n3.3 apron/overall\n4. Methods\n4.1 Clamping\n4.2 Pin connection\n4.3 Soldered joints\n4.4 Plugs\n5. Accessories\n5.1 Accessories may include the following but not limited to:\n5.1.1 brackets\n5.1.2 clamps\n\n--- PDF PAGE 44 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 42\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Undertook work safely and according to workplace\nand standard procedures\n1.2. Used appropriate termination/ connection methods\n1.3. Followed correct sequence in termination /\nconnection process\n1.4. Conducted testing of terminated connected\nelectrical wiring/electronic circuits using\nappropriate procedures and standards\n2. Underpinning knowledge\n2.1. Use of tools\n2.2. Use of test instruments/equipment\n2.3. Electrical theory\n2.4. Single phase AC principles\n2.5. Wiring techniques\n2.6. DC power supplies\n2.7. Soldering\n3. Underpinning skills\n3.1. Reading skills required to interpret work instruction\n3.2. Communication skills\n3.3. Soldering techniques\n4. Method of assessment\n4.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Oral Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n5.1. Tools for measuring, cutting, drilling,\nassembling/disassembling, connecting. Tool set\nincludes the following but not limited to:\n5.1.1. screw drivers\n5.1.2. pliers\n5.1.3. cutters\n6. Context of Assessment\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 45 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 43\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nMANAGE SERVICING SYSTEMS FOR CONSUMER\nELECTRONICS PRODUCTS\nUNIT CODE\n: ELC724329\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to manage servicing system.\n\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare\nmanagement of\nservicing system\n\n1.1\nManagement of servicing and maintenance of OH&S\npolicies and procedures is planned and prepared to\nensure that the work sequence is in accordance with\nrequirements\n1.2\nAppropriate personnel are consulted and directed to\nensure the programs for servicing and maintenance are\ncoordinated effectively with others involved on the work\nsite\n1.3\nPrograms to be managed for servicing and\nmaintenance are checked against job requirements\n1.4\nMaterials necessary to complete the work are identified\nand detailed in accordance with established procedures\nand checked against job requirements\n1.5\nTools, equipment and testing devices needed to carry\nout the work are identified and detailed in accordance\nwith established procedures\n1.6\nProcurement management plan is formulated for\nservicing and maintenance in accordance with\nestablished procedures and checked against\nrequirements\n\n2\nManage and\nmonitor servicing\nsystem\n\n2.1\nNormal function of consumer electronics products\nand associated circuits are ascertained and detailed in\naccordance with requirements\n2.2\nMechanisms are used to measure, record and report\nprogress of activities in relation to the agreed servicing\nand maintenance schedules and plans\n2.3\nServicing and maintenance system is managed and\nmonitored in accordance with established procedures\nand requirements to achieve designated objectives\n2.4\nResponse to unplanned events or conditions in\naccordance with established procedures are detailed\n2.5\nRecords and documentation of servicing and\nmaintenance activities are maintained in accordance\nwith established procedures to facilitate quality\nmanagement and to provide an audit trail.\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 44\n\n2.6\nResults of routine maintenance activities are monitored\nin accordance with established procedures to determine\ncompliance with agreed quality standards\n2.7\nShortfalls in quality outcomes are acted upon in\naccordance with established procedures to enable\nappropriate action to be initiated\n\n3\nEvaluate and\ndocument\nservicing system\n\n3.1\nQuality management issues and responses are\nreported in accordance with established procedures\n3.2\nCompletion of servicing and maintenance is reported in\naccordance with established procedures\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 45\n\nRANGE OF VARIABLES\n\n1. OH&S policies and\nprocedures\nArrangements of an organization or enterprise to meet the legal\nand ethical obligations of ensuring that the workplace is safe\nand without risk to health. This may include:\n1.1\nHazardous and risk assessment mechanisms\n1.2\nImplementation of safety regulations\n1.3\nSafety training\n1.4\nSafety systems incorporating,\n1.4.1\nWork clearance procedures\n1.4.2\nIsolation procedures\n1.4.3\nGas and vapor\n1.4.4\nMonitoring/testing procedures\n1.4.5\nUse of protective equipment and clothing\n1.5\nUse of codes of practice\n2. Requirements\nRequirements may include:\n2.1\nstatutory regulations\n2.2\ncodes of practice\n2.3\nJob specifications\n2.4\nTransport documentation\n2.5\nStandards called-up in specifications\n2.6\nProcedures and work instructions\n2.7\nQuality assurance systems\n2.8\nManufacturers’ specifications\n2.9\nMaintenance manuals, schedules and\nspecifications/standards\n2.10 Circuit/cable schedules\n2.11 Design specifications\n2.12 Customer/client requirements and specifications\n2.13 Specified underpinning knowledge (specified in units’\nEvidence Guides)\n2.14 National and State guidelines , policies and imperatives\nrelating to the environment\n3. Appropriate\npersonnel\nIndividuals with responsibilities for co-ordination, design\ninstallation, maintenance, production, or servicing activities may\ninclude:\n3.1\nSite managers\n3.2\nProject managers\n3.3\nEngineers and technicians\n3.4\nTechnical experts\n3.5\nLine managers/supervisors\n3.6\nRegulatory personnel\n3.7\nTeam leaders\n3.8\nOther personnel designated by an organization or\nenterprise\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 46\n\n4. Consumer\nelectronics products\n4.1 Audio & video product\n4.2 Electronically-controlled domestic appliances\n4.3 Cellular phones\n5. Established\nprocedures\nFormal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done. These may\ninclude\n5.1\nQuality assurance systems incorporating, for example:\n5.1.1 Continues quality improvement procedures\n5.1.2 Work orders / instructions\n5.1.3 Reporting procedures\n5.1.4 Procurement procedures\n5.1.5 Accounting procedures\n5.1.6 Human resources development procedures\n5.2\nWork clearance systems incorporating, for example:\n5.2.1 Work permits\n5.2.2 Municipal permits\n5.2.3 Monitoring and clearance procedures\n5.2.4 Isolation procedures\n5.3\nOH&S practices\n5.4\nProcedures for operating safety systems, operating\nplant and equipment and reporting work activities\n5.5\nMaintenance, modification or supply of relevant\nschematic drawings and technical data\n5.6\nArrangements for dealing with emergency situations.\n\n6. Unplanned events\nor conditions\nMay include but not limited to:\n6.1\nAccidents/incidents\n6.2\nBrownout\n6.3\nEquipment breakdown\n6.4\nForce majeure e.g., earthquake, fire, typhoon\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 47\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared management of servicing and\nmaintenance in accordance with OH&S policies and\nprocedures\n1.2. Checked programs to be developed for servicing and\nmaintenance according to job requirements\n1.3. Identified and detailed tools, equipment and materials needed\nto carry out work as specified in the user’s manual and\nestablished procedures\n1.4. Used mechanisms to measure, record and report progress of\nactivities in relation to the agreed servicing and maintenance\nschedules and plans\n1.5. Maintained records and documentation of servicing and\nmaintenance activities\n1.6. Reported quality management issues and responses in\naccordance with established procedures\n\n2. Underpinning\nknowledge and\nattitude\n2.1. Basic Electronics\n2.2. Computer operations\n2.3. Flow charting\n2.4. Business plan development\n2.4.1. Marketing plan\n2.4.2. Production plan\n2.4.3. Organization and management plan\n2.4.4. Financial plan\n2.5. Laws, and regulation, Electrical and electronic code\n2.6. Quality improvement\n2.6.1. Continuous process Improvement Philosophies\nand principals\n2.6.2. Product/Service Development\n2.6.3. Manufacturing 