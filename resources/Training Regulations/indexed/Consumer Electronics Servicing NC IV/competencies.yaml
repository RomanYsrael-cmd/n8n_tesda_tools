        "source_title": "TRAIN SERVICE TECHNICIAN SUPERVISORS",
        "source_text": "--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  CONSUMER ELECTRONICS SERVICING NC IV   \n \n \n                        Page 49  \n \nUNIT OF COMPETENCY  : \nTRAIN SERVICE TECHNICIAN SUPERVISORS \nUNIT CODE \n:          ELC724330 \nDESCRIPTOR                    : \nThis unit covers the knowledge, skills and attitudes \nrequired to train service technician supervisors. \n \nELEMENTS \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Plan and prepare \ntraining activities \n \n1.1 \nRequired tools, materials and equipment are prepared in \nthe worksite. \n1.2 \nStage of development is determined from discussion with \nthe service technician supervisor, observation of the \nservice technician supervisor and/or a formal assessment \nbeing carried out  \n1.3 \nMeasures are taken to ensure the service technician \nsupervisor understands OH&S requirements and safe \nworking procedures and practices for the particular \nworksite and the activities to be undertaken  \n1.4 \nPreparation for particular training includes deciding which \nactivities are to be undertaken by the service technician \nsupervisor and the level of supervision  \n1.5 \nConfirmations from the service technician supervisor are \nsought regarding the level of understanding of the training \nactivity to be performed \n2 Guide/mentor \nservice technician \nsupervisors \n \n2.1 \nService technician supervisors training is conducted in \naccordance with training plan \n2.2 \nService technician supervisor is provided with clear \ninstructions on the work to be undertaken and the \nrespective responsibilities associated with the work and to \nothers involved  \n2.3 \nService technician supervisor is guided/mentored and on-\ngoing checks of performance(s) are made at a level \nappropriate to the stage of development in accordance \nwith industry standards \n2.4 \nMeasures are taken to ensure the service technician \nsupervisor completes relevant documentation of the work \nperformed in accordance with established procedures  \n3 Document and \nprovide feedback \n \n3.1 \nService technician supervisor progress is monitored in \naccordance with established procedures and \ndocumentation requirements \n3.2 \nWork activities and assessment undertaken are \ndocumented and verified in accordance with established \nprocedures  \n3.3 \nAssessment feedback is provided to service technician \nsupervisor and training evaluation report is submitted to \nresponsible person in accordance with established \nprocedures\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  CONSUMER ELECTRONICS SERVICING NC IV   \n \n \n                        Page 50  \n \nRANGE OF VARIABLES \n \n1. Established \nprocedures \nEstablished procedures may include: \n1.1 Quality assurance systems incorporating, for example: \n1.1.1 Specifications, requirements and procedures \n1.1.2 Work orders / instructions \n1.1.3 Reporting procedures \n1.1.4 Improvement mechanisms \n1.1.5 Compliance requirements \n1.1.6 Safety management \n1.2 Work clearance systems incorporating, for example: \n1.2.1 Work permits \n1.2.2 Monitoring and clearance procedures \n1.2.3 Isolation procedures \n1.3 OH&S practices \n1.4 Procedures for operating safety systems, operating plant and \nequipment and reporting work activities \n1.5 Maintenance, modification or supply of relevant schematic \ndrawings and technical data \n1.6 Arrangements for dealing with emergency situations. \n \n2. OH&S policies \nand \nprocedures \nArrangements of an organization or enterprise to meet their legal and \nethical obligations of ensuring the workplace is safe and without risk to \nhealth. This may include: \n2.1 \nHazardous and risk assessment mechanisms \n2.2 \nImplementation of safety regulations \n2.3 \nSafety training \n2.4 \nSafety systems incorporating, \n2.4.1 Work clearance procedures \n2.4.2 Isolation procedures \n2.4.3 Gas and vapor \n2.4.4 Monitoring/testing procedures \n2.4.5 Use of protective equipment and clothing \n2.5 Use of codes of practice \n \n3 Responsible \nperson \nIndividuals with responsibilities for coordination, design installation, \nmaintenance, production, or servicing activities may include: \n3.1 Site managers \n3.2 Project managers \n3.3 Engineers and technicians \n3.4 Technical experts \n3.5 Line managers/supervisors \n3.6 Regulatory personnel \n3.7 Team leaders \n3.8 Other personnel designated by an organization or enterprise \n4 Documentation \nrequirements \nRequirements may include: \n4.1 \nGANTT chart \n4.2 \nProgress chart/report \n4.3 \nTraining evaluation report \n4.4\nTraining plan\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  CONSUMER ELECTRONICS SERVICING NC IV   \n \n \n                        Page 51  \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nPlanned and prepared training activities  \n1.2. \nMentored technician service supervisor \n1.3. \nMonitored and check program \n1.4. \nDocument the training program \n1.5. \nProvide feedback technical supervisor \n1.6. \nSubmitted requirement report to responsible person \n2. Underpinning \nknowledge and \nattitude \n2.1 \nFundamentals of maintaining and servicing audio-video \nproducts and systems \n2.2. Fundamentals of maintaining and servicing cellular \nphones \n2.3. Fundamentals of maintaining and servicing of \nelectronically-controlled domestic appliances  \n2.4. Fundamentals of coaching and mentoring \n2.5. Theories of adult learning \n2.6. Methods of teaching \n2.7.  Fundamentals of continues improvement \n2.8.  Fundamentals of supervisor knowledge and skills \n2.9.  Enterprise policies and guidelines \n \n3. Underpinning skills \n3.1. \nWork efficiency  \n3.2. \nCommunication skills in providing instruction to service \ntechnician supervisor \n3.3. \nImplementing training plan \n3.4. \nSkills in troubleshooting consumer electronics  \n3.5. \nApplying work safety practices and time management \n3.6. \nSkills in operation of basic computer software \napplication \n3.7. \nApplying principle of continuous quality improvement  \n \n4. Resource \nimplications \nMay includes but not limited to: \n4.1. Lecture room \n4.2. monitoring report \n4.3. Training plan \n4.4. work procedures \n5. Method of \nassessment \nThe assessor must select at least two of the following \nassessment methods to objectively assess the candidate: \n5.1. Direct observation of application to tasks and questions \nrelated to underpinning knowledge \n5.2. Case Study/Written report\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  CONSUMER ELECTRONICS SERVICING NC IV   \n \n \n                        Page 52  \n \n5.3. Interview \n5.4. Portfolio \n5.5. Third Party Report \n \n6. Context of \nassessment \n6.1. Competency maybe assessed in the workplace or in a \nsimulated workplace setting\n",
