          "source_text": ") \n1. Plan and prepare \nmanagement of \nservicing system \n \n1.1 \nManagement of servicing and maintenance of  OH&S \npolicies and procedures is planned and prepared to \nensure that the work sequence is in accordance with \nrequirements  \n1.2 \nAppropriate personnel are consulted and directed to \nensure the programs for servicing and maintenance are \ncoordinated effectively with others involved on the work \nsite  \n1.3 \nPrograms to be managed for servicing and \nmaintenance are checked against job requirements \n1.4 \nMaterials necessary to complete the work are identified \nand detailed in accordance with established procedures \nand checked against job requirements \n1.5 \nTools, equipment and testing devices needed to carry \nout the work are identified and detailed in accordance \nwith established procedures  \n1.6 \nProcurement management plan is formulated  for \nservicing and maintenance in accordance with \nestablished procedures and checked against \nrequirements \n \n2 \nManage and \nmonitor servicing \nsystem  \n \n \n \n \n2.1 \nNormal function of consumer electronics products \nand associated circuits are ascertained and detailed in \naccordance with requirements \n2.2 \nMechanisms are used to measure, record and report \nprogress of activities in relation to the agreed servicing \nand maintenance schedules and plans  \n2.3 \nServicing and maintenance system is managed and \nmonitored in accordance with established procedures \nand requirements to achieve designated objectives  \n2.4 \nResponse to unplanned events or conditions in \naccordance with established procedures are detailed \n2.5 \nRecords and documentation of servicing and \nmaintenance activities are maintained in accordance \nwith established procedures to facilitate quality \nmanagement and to provide an audit trail.\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  CONSUMER ELECTRONICS SERVICING NC IV   \n \n \n                        Page 44  \n \n2.6 \nResults of routine maintenance activities are monitored \nin accordance with established procedures to determine \ncompliance with agreed quality standards  \n2.7 \nShortfalls in quality outcomes are acted upon in \naccordance with established procedures to enable \nappropriate action to be initiated \n \n3 \nEvaluate and \ndocument \nservicing system \n \n3.1 \nQuality management issues and responses are \nreported in accordance with established procedures  \n3.2 \nCompletion of servicing and maintenance is reported in \naccordance with established procedures\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  CONSUMER ELECTRONICS SERVICING NC IV   \n \n \n                        Page 45  \n \nRANGE OF VARIABLES \n \n1. OH&S policies and \nprocedures \nArrangements of an organization or enterprise to meet the legal \nand ethical obligations of ensuring that the workplace is safe \nand without risk to health. This may include: \n1.1 \nHazardous and risk assessment mechanisms \n1.2 \nImplementation of safety regulations \n1.3 \nSafety training \n1.4 \nSafety systems incorporating, \n1.4.1 \nWork clearance procedures \n1.4.2 \nIsolation procedures \n1.4.3 \nGas and vapor \n1.4.4 \nMonitoring/testing procedures \n1.4.5 \nUse of protective equipment and clothing \n1.5 \nUse of codes of practice \n2. Requirements \nRequirements may include: \n2.1 \nstatutory regulations \n2.2 \ncodes of practice \n2.3 \nJob specifications \n2.4 \nTransport documentation \n2.5 \nStandards called-up in specifications  \n2.6 \nProcedures and work instructions \n2.7 \nQuality assurance systems \n2.8 \nManufacturers’ specifications \n2.9 \nMaintenance manuals, schedules and \nspecifications/standards \n2.10 Circuit/cable schedules \n2.11 Design specifications \n2.12 Customer/client requirements and specifications \n2.13 Specified underpinning knowledge (specified in units’ \nEvidence Guides) \n2.14 National and State guidelines , policies and imperatives \nrelating to the environment \n3. Appropriate \npersonnel \nIndividuals with responsibilities for co-ordination, design \ninstallation, maintenance, production, or servicing activities may \ninclude: \n3.1 \nSite managers \n3.2 \nProject managers \n3.3 \nEngineers and technicians \n3.4 \nTechnical experts \n3.5 \nLine managers/supervisors \n3.6 \nRegulatory personnel \n3.7 \nTeam leaders \n3.8 \nOther personnel designated by an organization or \nenterprise\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  CONSUMER ELECTRONICS SERVICING NC IV   \n \n \n                        Page 46  \n \n4. Consumer \nelectronics products \n4.1 Audio & video product \n4.2 Electronically-controlled domestic appliances \n4.3 Cellular phones \n5. Established \nprocedures \nFormal arrangements of an organization, enterprise or \nstatutory authority of how work is to be done. These may \ninclude \n5.1 \nQuality assurance systems incorporating, for example: \n5.1.1 Continues quality improvement procedures \n5.1.2 Work orders / instructions \n5.1.3 Reporting procedures \n5.1.4 Procurement procedures \n5.1.5 Accounting procedures \n5.1.6 Human resources development procedures \n5.2 \nWork clearance systems incorporating, for example: \n5.2.1 Work permits \n5.2.2 Municipal permits \n5.2.3 Monitoring and clearance procedures \n5.2.4 Isolation procedures \n5.3 \nOH&S practices \n5.4 \nProcedures for operating safety systems, operating \nplant and equipment and reporting work activities \n5.5 \nMaintenance, modification or supply of relevant \nschematic drawings and technical data \n5.6 \nArrangements for dealing with emergency situations. \n \n6. Unplanned events \nor conditions \nMay include but not limited to: \n6.1 \nAccidents/incidents  \n6.2 \nBrownout \n6.3 \nEquipment breakdown \n6.4 \nForce majeure e.g., earthquake, fire, typhoon\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  CONSUMER ELECTRONICS SERVICING NC IV   \n \n \n                        Page 47"
