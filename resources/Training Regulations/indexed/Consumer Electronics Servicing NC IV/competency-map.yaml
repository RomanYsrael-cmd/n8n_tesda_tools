  "source_text": "Section 1. Successful candidates shall be awarded a National Certificate IV\nsigned by the TESDA Director General.\n\n4.2\nThe qualification of Consumer Electronics Servicing NC IV may be attained\nthrough demonstration of competence through a single comprehensive project-\ntype assessment covering all required units of competency of the qualification.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.4\nAccumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.5.2.\nExperienced workers (wage employed or self employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 63 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 61\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 64 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 62\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and\nindustry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 65 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 63\n\nSECTOR SPECIFIC\n\n1. Equipment - A component part of an installation used for a particular purpose.\nEquipment includes, but is not limited to, that contained in the following divisions. It\nwill necessarily include new and emerging technologies:\n\n• Audio/visual equipment including televisions, radios, monitors, cameras,\nclosed circuit television, mono and stereo sound systems, gaming\nmachines, electronic display panels, cassette recorders, video cassette\nrecorders, CDROM players, tape recorders, sound and video duplication\nequipment, digital versatile discs, digital audio tapes, professional and\ndomestic speaker systems, mixer desks.\n\n• Appliances including portable electric tools, motor driven pumps, vacuum\ncleaners, food preparation equipment, hair dryers, refrigerators, washing\nmachines, dish washers, paper shredders, water coolers, clothes dryers,\npest exterminators, electric motor driven industrial tools and equipment,\nsanitary disposal units, radial and tangential fans and blowers.\n\n2. Appliances - A fixed (for support only), hand-held (held in hand during normal\nuse), portable (moved whilst in operation or easily moved from one place to another\nwhile connected to the supply) or stationary (can be moved, but not easily)\nconsuming device, other than a lamp.\n\n3. Competent person - A person who has the relevant competencies described in\nthis competency\n\n4. Component - That portion of a unit of equipment, which has been designed as a\ndiscrete unit and that can be identified as such.\n\n5. Environment - The area surrounding the work site which can be directly or\nindirectly affected by occurrences at the work site. It includes the atmosphere, soils,\ndrains, underground water tables, and the ecosystem. Protection of the\nenvironment would require the proper disposal of waste materials, restriction of\nburning off, the correct handling of toxic substances, the containment of CFCs and\nthe like.\n\n6. Established procedures - Formal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done.\n\n7. Hazardous materials - Flammable gases and vapors and combustible dusts.\n\n8. Modifications - To make changes to the physical parameters or operational\nfunction of a device, component or piece of equipment or apparatus.\n\n9. Notification (notified) - Can include verbal, written, electronic or recorded\ninformation at completion of work which may be required to be completed in\naccordance with established procedures.\n\n--- PDF PAGE 66 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 64\n\n10. OH&S policies and procedures - Arrangements of an organization or enterprise\nto meet their legal and ethical obligations of ensuring the workplace is safe and\nwithout risk to health.\n\n11. Requirements - That to which equipment and procedures and their outcomes\nmust conform and includes statutory obligations and regulations and standards\ncalled-up by legislation or regulations.\n\n12. Servicing - Undertaking routine inspection, repair and maintenance of circuits,\nsystems or apparatus. Maintaining, fault finding and repair of equipment, plant and\nmachinery.\n\n13. Standards - Technical documents, which set out specifications and other criteria\nfor equipment, materials, and methods to ensure they consistently, perform as\nintended.\n\n14. System - A group or combination of inter-related, inter-dependent or interlocking\nelements forming a collective entity. Includes circuits, apparatus, equipment and\nthe like.\n\n15. Termination - The act by means of which an electrical connection to an apparatus\nis established; specifically a prepared joint or connection between a cable, cord or\nconductor and a point in an electrical circuit such as a terminal or connection point.\nSuch terminations include soldering, crimping, clamping, wire wrapping, insulation\npiercing/compression.\n\n16. Testing devices - Devices and instruments used to ensure safety requirements\nand operational functions are met, and to diagnose faults in apparatus, circuits or\nsystems.\n\n17. Wiring systems - Permitted cables, enclosures, supports and accessories for\npower, measurement, control or communications purposes.\n\n--- PDF PAGE 67 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 65\n\nANNEX A - COMPETENCY MAP – CONSUMER ELECTRONICS SERVICING NC IV\n\nBASIC COMPETENCIES\n\nReceive and\nRespond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication\nSkills\nDevelop Team and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize\ninformation\nPlan and Organize\nWork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nUse Hand Tools\nPerform\nMensuration and\nCalculation\nPrepare and\nInterpret Technical\nDrawing\nApply Quality\nStandards\nPerform Computer\nOperations\nTerminate and\nConnect Electrical\nWiring and\nElectronic Circuits\n\nCORE COMPETENCIES\n\nInstall\nInstrumentation and\nControl Devices\nCalibrate\nInstrumentation and\nControl Devices\nConfigure\nInstrumentation and\nControl Devices\nLoop Check\nInstrumentation and\nControl Devices\nMaintain and Repair\nInstrumentation &\nControl Devices\nStart-up\nInstrumentation and\nControl Systems\nDiagnose and\nTroubleshoot\nInstrumentation and\nControl Systems\nInstall Mechatronic\nDevices\nConfigure and Adjust\nMechatronic Devices\nDevelop Mechatronic\nControl Circuits and\nSoftware Application\nPrograms\nMaintain and Repair\nMechatronic Systems\nCommission\nMechatronic\nSystems\nDiagnose and\nTroubleshoot\nMechatronic\nSystems\nService and Repair\nAudio Systems and\nProducts\nService and Repair\nVideo Systems and\nProducts\nService and Repair\nBusiness Machines\nAssemble and\nDisassemble\nConsumer Electronic\nProducts\nMaintain and Repair\nElectronically\nControlled Domestic\nAppliances\nMaintain and Repair\nAudio-Video Products\nand Systems\nMaintain and Repair\nCellular Phones\nCommission\nConsumer Electronic\nProducts and\nSystems\nDevelop Servicing\nSystems for\nConsumer Electronic\nProducts\nTrain service\ntechnician\nManage Servicing\nSystems for\nConsumer\nElectronics\nProducts and\nSystems\nTrain service\ntechnician\nsupervisors\n\n--- PDF PAGE 68 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC IV\n\n Page 66\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe and\ngovernment agencies and labor groups who donated their time and expertise to the development\nand validation of these Training Regulations.\n\n• THE TECHNICAL EXPERT COMMITTEE\n\nENGR. ALEX S.E. SY-Chairperson\nPresident\nCATIA Foundation, Inc.\n\nENGR. JOEL B. BAJADOR-Member\nInstitute of Electronics Engineers of the\nPhilippines, Inc. (IECEP)\n\nENGR. EMMANUEL G. GONZALES-Member\nEngineering/ECT Faculty Coach\nAsian College of Science and Technology\n(ACSAT)\n\nENGR. RONALDO B. RACELIS-Member\nProprietor, RKNJ Cellphone Repair/\nFaculty, ACSAT\n\nMR. RESTITUTO P. VELASCO-Member\nConsumer Electronics Service Technician\nPrivate Practitioner\n\n• INSTITUTE OF ELECTRONICS ENGINEERS OF THE PHILIPPINES, INC.\n\n• ELECTRONIC INDUSTRIES ASSOCIATION OF THE PHILIPPINES,INC.\n\n• THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT\nCOMMITTEE\n\n• THE MANAGEMENT AND STAFF OF TESDA SECRETARIAT\n\n•\nQualifications and Standards Office\n (QSO)"
