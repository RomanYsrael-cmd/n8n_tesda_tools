  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for FLUX CORED ARC WELDING (FCAW) NC ll.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FLUX CORED ARC WELDING\n\nNC Level II\n\nSuggested Nominal Training Hours: 18 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 194 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes in\nFlux Cored Arc Welding NCll in accordance with industry standards. It covers core\ncompetencies such as Setting-up Welding Equipment, Preparing Weld Materials,\nFitting up Weld Materials, Welding Carbon Steel Plates Using FCAW, Welding\nCarbon Steel Plates and Pipes Using FCAW and Repairing Welds.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a\nteam member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth & development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 49 ---\nFcaw nc ii\n\n47\n4. Practice\noccupational\nhealth and\nsafety\n8.1 Evaluate hazard and\nrisks\n8.2 Control hazards and\nrisks\n8.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nwork safely\n1.1 Identify hazardous areas\nand conditions\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling of\ntools, equipment and\nmaterials\n1.4 Explain/perform first aid\nprocedure\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• demonstration\n2. Contribute\nto quality\nsystem\n2.1 Inspect work done\n2.2 Apply quality standards to\nwork\n2.3 Protect company/\ninstitution properties\n2.4 Protect customer interest\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n3. Use hand\ntools\n3.1 Use different handtools\n3.2 Maintain handtools\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n•Demonstration\n4. Interpret\nblueprints\n4.1 Interpret technical drawing.\n4.2 Interpret welding symbols\n\n• Lecturette\n\n• Practical\napplication\n• Oral\nquestioning\n• Written test\n\n5. Perform\n Industry\ncalculations\n5.1 Solve mathematical\nproblems\n5.2 Convert systems of\nmeasurement\n5.3 Measure workpiece\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n\n• Written test\n\n--- PDF PAGE 50 ---\nFcaw nc ii\n\n48\n6. Prepare\nweld\nmaterials\n6.1 Identify the different cutting\nequipment and\naccessories\n6.2 Identify types of mild steel\nelectrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective\nequipment\n6.5 Prepare welding\nconsumables, tools and\naccessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n• Lecturette\n• Practical\napplication\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up\nWelding\nEquipment\n7.1 Explain welding principles\nand concepts.\n7.2 Identify the parts of\nwelding machine\n7.3 Set up welding machine\nand accessories\n7.4 Set up welding positioners,\njigs and fixtures\n7.5 Set up pre-heating\nequipment (as required)\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\nbacking plate and\nstiffener.\n8.2 Explain the methods of\nstriking an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen,\nbacking plate and\nstiffener.\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n9. Repair\n Welds\n9.1 Identify causes and\nprevention of the different\nweld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and\nequipment\n9.4 Remove defects\n9.5 Perform re-welding\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nFcaw nc ii\n\n49\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld\ncarbon\nsteel pipes\nusing\nFCAW\n1.1 Perform groove weld on\npipe in different positions\n• 2G\n• 5G\n• 6G\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n\n--- PDF PAGE 52 ---\nFcaw nc ii\n\n50\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates the\ntraining delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n\n--- PDF PAGE 53 ---\nFcaw nc ii\n\n51\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• completed training in FCAW NC I or a holder of FCAW NC I\n• can communicate either oral and written\n• physically and mentally fit\n• can perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nFLUX CORED ARC WELDING - NC II\n\nRecommended list of tools and materials per trainee for FLUX CORED ARC\nWELDING - NC II\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12 units\nFCAW Welding\nmachine, FCAW\ngun and\naccessories\n1 reel\nFiller wire E71T-I\n(or equivalent)\n1mm dia.\n75 pcs.\nSteel brush\n12 pcs.\nWelding\npositioners\n30 pcs\nCarbon steel\npipe, schedule\n40, 150mm dia.\nX 150mm\n12 pcs.\nPlier/tongs\n12 units\nPortable disc\ngrinder\n18 pcs\nCarbon steel\npipe, schedule\n80, 150mm dia.\nX 150mm\n20 pcs. Files-bastard\ncut\n1 unit\nExhaust fan\n72 pcs.\nCutting disc\n3/32\" x 5/8\" x4\"\ndia.\n25 pcs.\nWelding Mask\n2 units\nWork bench w/\nbench vice on 4\ncorners\n36 pcs.\nGrinding disc\n1/4” x 5/8\" x 4\"\ndia.\n25 sets\nLeather\napron/jacket\n2 sets\nOxy-\nacetylene/Oxy-\nLPG cutting outfit\n5 cyl.\nShielding gas\n(75% argon 25%\nCO2)\n50 sets\nLeather gloves,\nlong\n1 unit\nPedestal /bench\ngrinding machine\n1 cyl.\noxygen\n5 pcs.\nSafety goggles,\nwide vision,\nclear\n1 unit\nIndustrial fan\n1 cyl.\nLPG or\nAcetylene\n5 pcs.\nOxy-acetylene\nGoggles\n\n3 pcs.\nDark glass\n12 pcs.\nTry square 300\nmm. Long\n\n46 pcs.\nLens clear glass\n\n--- PDF PAGE 54 ---\nFcaw nc ii\n\n52\n12 pcs.\nSteel square\n300 mm. long\n\n1 tube\nMetal marker\n12 pcs. Files-half round\n5 pcs.\nFillet gauge\n1 pc.\nWire Cutter\n1 pc.\nHand Hacksaw\n\nNote: Tools and equipment for all welding process.\n* for FCAW welding process\n\n3.5 TRAINING FACILITIES\nFLUX CORED ARC WELDING - NC II\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation Area*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M Storage\nArea*\n4 X 5\n20\n\n20\nLearning Resource Area*\n5 X 9\n45\n\n45\nWash Area /Comfort Room\n(male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\nTotal Workshop Area\n\n140\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 55 ---\nFcaw nc ii\n\n53\n3.6 TRAINERS QUALIFICATIONS FOR FCAW WELDER\n\nFLUX CORED ARC WELDING - NC II\n\nTRAINER QUALIFICATION (TQ II)\n\n• Must be a holder of FCAW NC II\n• Must have undergone training on Training Methodology II (TM II)\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine their\nachievement of units of competencies. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 56 ---\nFcaw nc ii\n\n54"
