  "source_text": "Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n4.2\nThe qualification of Beauty Care Services (Nail Care) NC II may be attained through\ndemonstration of competency through project-type assessment covering all the\nfollowing core units of the qualification:\n4.2.1\nPerform manicure\n4.2.2\nPerform pedicure\n4.3\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n4.4.1\nGraduates of formal, non-formal and informal including enterprise-\nbased training programs\n4.4.2\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 53 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 49 -\nPerform\nhair\nbleaching\n\nPerform\nhairpiece\nattachment,\nstyling and\nmaintenance\n\nPerform\nhair extension\nactivities\n\nApply\nbasic facial\nmake-up\nELECTIVE\nCOMPETENCIES\n\nPerform\nhair perming\nPerform men\npiece\nattachment,\nstyling and\nmaintenance\n\nPerform\nhair relaxing\n\nPerform\ntattooing\n\nPerform\nprosthetic facial\nmake-up\nCOMPETENCY MAP\n HEALTH, SOCIAL AND OTHER COMMUNITY DEV’T SERVICES SECTOR – COSMETOLOGY SUB-SECTOR\nBEAUTY CARE SERVICES (NAIL CARE) NC II\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\nParticipate\nin workplace\ncommunication\nWork\nin team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nReceive and\nrespond to\nworkplace\ncommunication\nPractice\noccupational\nhealth and\nsafety\nprocedures\nLead\nworkplace\ncommunication\nLead\nsmall teams\nBASIC\nCOMPETENCIES\nMaintain an\neffective\nrelationship with\nclients/ customers\nApply\nquality\nstandards\nManage\nown\nperformance\nCOMMON\nCOMPETENCIES\nMaintain a safe,\nclean and\nefficient\nenvironment\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\nCollect,\nanalyze and\norganize\ninformation\nPlan\nand organize\nwork\nApply\nproblem-\nsolving\ntechniques in\nthe workplace\nPromote\nenvironmental\nprotection\nCORE\nCOMPETENCIES\nPerform\nadvanced/\ncreative\n hair coloring\n\nProvide\nhair coloring\nservices\nProvide hair\nand scalp\ntreatment\nservices\n\nPerform\nhaircutting\nactivities\nPerform beard\nand moustache\nshaving and\nstyling\nPerform\nbasic\nhaircutting\nPerform\nhair\nbleaching\nPerform\nhair\nstraightening\nPerform\ncreative\nhairstyle\nPerform\nbasic\nhair coloring\nPerform\nbasic hair\nperming\nPerform\nadvanced/\ncreative\nhair perming\nPerform pre\nand post-\nbarbering\nactivities\nPerform\nadvanced/creati\nve haircutting\nPerform hair\nand scalp\ntreatment\nPerform\nbasic\nfacial treatment\nPerform\neyelash\nenhancement\nPerform\ntemporary hair\nremoval activity\nPerform\nbody bleach\nPerform\npre and post hair\ncare activities\nApply\nbasic\nmake-up\nPerform\neyebrow arching\nand shaping\nPerform\nadvanced facial\ntreatment\nPerform\nhand spa\nPerform\n nail extension\nPerform\nnail\nenhancement\nPerform\nnail wrap\ntreatment\nPerform\n foot spa\nPerform\ncreative nail\ndesign\n\nPerform\nchair spot\nmassage\n\nPerform\nbody massage\nPerform\nadvanced/\ncreative facial\nmake-up\nPerform\nmanicure and\npedicure\nPerform\n body scrub\n\n--- PDF PAGE 54 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 50 -\n\nDEFINITION OF TERMS\n\nBeauty care\n-\nAn overall beauty treatment intended to change or improve a\nperson’s appearance\nBody bleach\n-\nProcess used to lightens the color of hair to a light shade of blonde\nBody scrub\n-\nIs a process of removing dead skin cells and exfoliating the top\nlayer of the skin\nCallus\n-\na hardening of the skin through friction\nCuticle\n-\nOverlapping skin surrounding the nail. It protects the matrix from\ninvading bacteria and physical damage\nCosmetic\n-\nAre substances used to enhance the appearance or odor of the\nhuman body\nCosmetologist -\none who is skilled in the art of improving/enhancing a person’s\nappearance\nEyebrow\narching\n-\nIs a process of arching brows to produce a more precise and\nuniform shapes\nEyelashes\nextension\n-\nAre single strands of synthetic eyelashes that are curved to\nreplicate a natural eyelashes\nEyelashes\nperming\n-\nA procedure used to curl semi-permanent eyelashes\nFacial\n-\nCare for the face that usually involves cleansing and massage and\nthe application of cosmetic creams\nFacial make-\nup\n-\nUsed to enhance the beautiful part of face and hide defects\nFancy\nmanicure\n-\nthe art of applying nail polish in decorative fashion\nFoundation\n-\na cosmetic usually used as a base for make-up. It can be in a form\nof liquid, cream, gel, solid creams, in sticks and cakes.\nHand\nmassage\n-\nReplenishes moisture and also alleviates pain and helps you to\nrelax. An effective way of removing dead cells\nMake up\n-\nIs a sub-set of cosmetic which refers primarily to colored products\nintended to alter the user’s appearance\nManicure\n-\nit came from the latin word “manus” (hand) and “cura” (care) which\nmeans the care of the hands and nails\nMascara\n-\na cosmetic for covering the eyelashes\nMassage\n-\ninvolves the external manipulation of the body by rubbing, pinching,\nkneading and strolling with the use of hands or an instruments\nNail\n-\nImportant structure made of keratin that has 2 purposes –\nfingernails act as protective plate and enhance sensation of\nfingertips\nNail structure\n-\nCompose of free edge, nail plate, nail walls, lunula, cuticle,\nhyponychium, nail grove, nail bed, matrix and mantle\nPedicure\n-\nthe professional or artful care of the feet and toenails\nPlucking\n-\nMeans the process of removing hair by mechanically pulling the\nhair from owner’s body\nShaving\n-\nIs the removal of hair, by using a razor or any kind of bladed\nimplements, to slice it down to the level of the skin\nSpa\n-\nPlaces devoted to overall well-being through a variety of\nprofessional services that encourage the renewal of mind, body\nand spirit\nTattoo\n-\nIs a marking made by inserting indelible ink into the dermis layer of\nthe skin to change the pigment for decorative or other reason\nWaxing\n-\nIs the best temporary method of hair removal\n\n--- PDF PAGE 55 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nINDUSTRY EXPERTS\n\nREVIEW PANEL (2010)\n\nEMMA P. ALBIOR\nMARIA EVANGELINE V. BERTUMEN\nPhilippine International Haircutters\nPhilippine International Haircutters Association\nAssociation (PIHA)\n(PIHA)\n#2 Anonas St., Project 3, Quezon City\n#2 Anonas St., Project 3, Quezon City\nLOURDES D. CO\nALEXANDER S. DUNGO\nTrainer/Expert\nPhilippine International Haircutters\nTony Galvez School of Cosmetology\nAssociation (PIHA)\n9th Ave., Cubao, Quezon City\n#2 Anonas St., Project 3, Quezon City\nANTONIO M. GALVEZ\nWILFREDO T. GARCIA\nOwner/Industry Expert\nPhilippine International Haircutters\nTony Galvez Salon/ Tony Galvez School\nAssociation (PIHA)\nof Cosmetology\n#2 Anonas St., Project 3, Quezon City\n(Member, International Cosmetology\nGEORGE A. MANUEL\nOrganization (ICLO))\nPhilippine International Cosmetologists\n9th Ave., Cubao, Quezon City\nAssociation (PICA)\nAZUCENA P. INOCENCIO\n#69 Scout Rallos St.\nPhilippine International Haircutters\n