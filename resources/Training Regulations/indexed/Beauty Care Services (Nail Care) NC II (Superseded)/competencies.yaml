at\ntolerance\n2.3\nFoot spa is performed in accordance with\nestablished or acceptable procedure\n2.4\nClient’s safety and comfort is ensured during the\nentire process\n2.5\n Outcome of treatment is assessed against client’s\nrequirements and recorded following salon procedure\n\n3. Perform post service\nactivities\n3.1\nAfter care advice and homecare products are\nrecommended according to client’s needs\n3.2\nTools, equipment, supplies and materials are\ndisinfected and stored according to environment and\nsafety regulations\n3.3\nWorkstation is sanitized and prepared for the\nsucceeding salon activities\n3.4\nWastes are disposed according to environment and\nsafety regulations\n\n--- PDF PAGE 42 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 38 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Foot condition\n1.1\nNormal\n1.2\nDry\n1.3\nWith abrasions or cuts\n1.4\nWith fungal infection or wounds\n1.5\nWith open wound\n\n2. Tools and equipment\n2.1\nFoot Spa Machine\n2.2\nFoot File\n2.3\nFoot Stool\n2.4\nPumice Stone\n2.5\nRough Gloves\n2.6\nHand Brush\n2.7\nFoot Basin\n2.8\nFoot Towel\n2.9\nBowl\n2.10 Callous Scraper\n2.11 Foot brush\n\n3. Supplies and\nmaterials\n3.1\nFoot Toner\n3.2\nFoot Blush\n3.3\nWhitening Powder\n3.4\nMoisturizing Lotion\n3.5\nAntiseptics\n3.6 Foot Soak\n3.7\nFoot Lotion\n3.8\nFoot Scrub Lotion\n3.9\nOil\n3.10 Warm Water\n3.11 Henna Powder\n\n4. Establish and\nacceptable procedure\nMay include but are not limited to:\n4.1\nClean feet thoroughly by soaking in liquid soap and\nlukewarm water within timeline\n4.2\nFile feet thoroughly, rinse and dry after\n4.3\nApply scrubbing product and slightly massage with\nrough mittens\n4.4\nWash feet thoroughly and pat dried\n4.5\nApply foot blush on the sole\n4.6\nApply lotion and do the basic massage\n\n5. Homecare products\n5.1\nFoot Powder\n5.2\nFoot Spray/Sanitizer\n5.3\nFoot Lotion/Moisturizer\n\n--- PDF PAGE 43 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 39 -\nE