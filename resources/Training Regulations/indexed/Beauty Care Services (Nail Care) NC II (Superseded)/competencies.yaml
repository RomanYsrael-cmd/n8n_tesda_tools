        "source_text": "HCS515204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed\nto apply quality standards in the workplace. The unit also\nincludes the application of relevant safety procedures and\nregulations, salon/organizational procedures and other client\nrequirements\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Assess clients\nservice needs\n\n1.1\nWork instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2\nClients needs are checked against workplace\nstandards and specifications.\n1.3\nFaults on clients and any identified causes are\nrecorded and/or reported to the supervisor concerned\nin accordance with workplace procedures.\n1.4\nClients profile and service extended to them are\ndocumented in accordance with workplace\nprocedures.\n2. Assess own work\n2.1\nDocumentation relative to quality within the company\nis identified and used.\n2.2\nCompleted work is checked against workplace\nstandards relevant to the task undertaken.\n2.3\nErrors are identified and improved on.\n2.4\nInformation on the quality and other indicators of\nindividual performance is recorded in accordance with\nworkplace procedures.\n2.5\nIn cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ standard operating\nprocedures.\n3. Engage in quality\nimprovement\n3.1\nProcess improvement procedures are participated in\nrelative to workplace assignment.\n3.2\nWork is carried out in accordance with process\nimprovement procedures.\n3.3\nPerformance of operation or quality of product of\nservice to ensure other client satisfaction is\nmonitored.\n\n--- PDF PAGE 28 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 24 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. External Clients\n\nMay include but not limited to:\n1.1\nTeenagers\n1.2\nAdult men\n1.3\nWorking adult\n1.4\nChild\n\n2. Faults\nMay include but not limited to:\n2.1\nClient not satisfied\n2.2\nDesired result is not within the desired result of client\n2.3\nProcedures done but do not conform with any Salon\npolicies and procedures\n2.4\nDamaged caused to client\n\n3. Documentation\n3.1\nOrganization work procedures\n3.2\nManufacturer’s instruction manual\n3.3\nClient requirements\n3.4\nForms\n\n4. Errors\nMay be related to the following:\n4.1\nDeviation from the requirements of the client\n4.2\nDeviation from the requirements of the\nsalon/organization\n\n5. Quality Standards\nMay be related but not limited to the following:\n5.1\nSupplies and materials\n5.2\nFacilities\n5.3\nSalon Product\n5.4\nService Processes and Procedures\n5.5\nClient Service\n5.6\nEnvironmental Regulations\n\n6. Client\n6.1\nCo-worker\n6.2\nSupplier/vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 29 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 25 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCarried out work in accordance with the company’s\nstandard operating procedures.\n1.2\nPerformed task according to specifications.\n1.3\nReported errors or deviations not in accordance with\nstandard operating procedures.\n1.4\nCarried out work in accordance with the process\nimprovement.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nRelevant production processes, materials and\nproducts\n2.2\nCharacteristics of materials, software and hardware\nused in production processes\n2.3\nQuality checking procedures\n2.4\nClient relations\n2.5\nWork place procedures\n2.6\nSafety and environmental aspects of service\nprocesses\n2.7\nError identification and reporting\n2.8\nQuality improvement processes\n\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions,\nproduct manufacturer’s requirements\n3.2\nCommunication skills needed to interpret and apply\ndefined 