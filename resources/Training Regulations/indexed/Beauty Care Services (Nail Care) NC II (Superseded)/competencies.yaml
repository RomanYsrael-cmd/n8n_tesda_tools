        "source_title": "MAINTAIN A SAFE, CLEAN AND EFFICIENT WORK ENVIRONMENT",
        "source_text": "--- PDF PAGE 30 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 26 - \nUNIT OF COMPETENCY : \nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK \nENVIRONMENT \nUNIT CODE \n: \nHCS515205 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes needed to \nmaintain client relations. The unit incorporates the work safety \nguidelines. It encompasses competencies necessary to \nmaintain a safe workplace for staff, clients and others. It also \ninvolves the application of health regulations, including \npersonal hygiene practiced by staff members, provision of a \ncaring client environment and the efficient operation of the \nsalon. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold &Italicized fonts are elaborated in the Range of Variables \n1. Comply with health \nregulations \n \n1.1 \nSalon policies and procedures for personal hygiene \napplied. \n1.2 \nProcedures and practices implemented in a variety of \nsalon situations in accordance with state and local \ngovernment health regulations. \n \n2. Assess own work \n2.1 \nReception, work areas and walkways maintained in a \nsafe, uncluttered and organized manner according to \nsalon policy. \n2.2 \nAll routines carried out safely, effectively with \nminimum inconvenience to clients and staff. \n2.3 \nWaste is stored and disposed of according to OH&S \nrequirements. \n2.4 \nSpills, food, waste, hair or potential hazards \npromptly removed from floors according to salon \npolicy. \n2.5 \nSpills, food, waste, hair or other potential hazards \npromptly removed from floors according to salon \npolicy. \n2.6 \nLinen is stored, cleaned and disinfected in line with \nOHS requirements and salon procedures. \n2.7 \nRefreshments are provided to all clients. \n \n3. Check and maintain \ntools and equipment \n3.1 \nTools and equipment are stored safely and in position \nto comply with salon requirements and local health \nregulations. \n3.2 \nTools and equipment are prepared for specific \nservices as required. \n3.3 \nTools and equipment are checked for maintenance \nrequirements. \n3.4 \nTools and equipment are referred for repair as \nrequired.\n\n--- PDF PAGE 31 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 27 - \n \nELEMENT \nPERFORMANCE CRITERIA \nBold &Italicized fonts are elaborated in the Range of Variables \n4.  Check and maintain \nstocks \n \n4.1 \nStock rotation procedures are carried out routinely \nand accurately according to salon procedures. \n4.2 \nStock levels are accurately recorded according to \nsalon procedures. \n4.3 \nUnder or over supplied stock items are notified \nimmediately to the salon supervisor. \n4.4 \nIncorrectly ordered or delivered stock is referred to \nthe salon supervisor for return to supplier. \n4.5 \nSafe lifting and carrying techniques maintained in line \nwith salon occupational health and safety policy and \ngovernment legislation. \n \n5.  Provide a relaxed \nand caring \nenvironment \n5.1 \nClients are made to feel comfortable according to \nsalon policy. \n5.2 \nClients’ needs are reported to. \n5.3 \nClients are consulted on specific desired service.\n\n--- PDF PAGE 32 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 28 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant salon \npolicies and \nprocedures \n            \n \nMay include but not limited to: \n1.1 \nHazard Policies and Procedures \n1.2 \nEmergency, Fire and Accident Procedures \n1.3 \nPersonal Safety Procedures \n1.4 \nProcedures for the use of Personal protective \nClothing and Equipment \n1.5 \nHazard Identification \n1.6 \nJob Procedures \n \n2. Occupational health \nand safety \nprocedures \nMay include but not limited to: \n2.1 \nClient  \n2.2 \nStaff \n2.3 \nEquipment/Tools \n2.4 \nPremises \n2.5 \nStock \n \n3. Unsafe situations \nMay include but not limited to: \n3.1 \nDamaged Packaging Material or Containers \n3.2 \nBroken or Damaged Equipment \n3.3 \nInflammable Materials and Fire Hazards \n3.4 \nLifting Practices \n3.5 \nSpillages \n3.6 \nWaste including hair especially on floors \n3.7 \nTrolleys \n \n4. Linkage \nMay be related to the following: \n4.1 \nInstitutional \n4.2 \nOrganizational Linkage \n4.3 \nSocial Services \n4.4 \nInternational Market\n\n--- PDF PAGE 33 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 29 - \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nGenerated information on different client \nrequirements and needs. \n1.2 \nSelected and used strategies to accurately analyzed \nthe client requirements. \n1.3 \nAssessed current product and services as against \nclient demand. \n1.4 \nIdentified avenues to establish relevant linkage.. \n1.5 \nSelected promotional activities relevant to enhance \ncompetitiveness of salon. \n1.6 \nAssisted clients on specific desired services. \n1.7 \nChecked and prepared tools for the specific salon \nactivities. \n \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nMedia Options \n2.2 \nData Gathering \n2.3 \nSalon Policies \n2.4 \nInternational Market \n2.5 \nSkills Competition Rules and Procedures \n2.6 \nNew Trends in Products and Services \n2.7 \nEthical Limitations \n \n3. Underpinning skills \n3.1 \nCommunication skills to identify lines of \ncommunication, request advice, follow instructions \nand receive feedback. \n3.2 \nTechnology Skills \n3.3 \nInterpersonal Skills \n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nClient \n4.3 \nRelevant Information \n4.4 \nAppropriate Products \n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nObservation with questioning \n5.2 \nPractical Demonstration with questioning \n \n6. Context of \nassessment \n6.1      Assessment may be conducted in the workplace or in \na simulated environment\n",
