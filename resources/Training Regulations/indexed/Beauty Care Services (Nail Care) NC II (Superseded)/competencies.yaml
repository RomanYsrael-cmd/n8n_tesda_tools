ical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on desired nail service activity and\nspecific requirements\n1.2\nChecked and analyze nail condition, structure, shape\nand style\n1.3\nRecognized nail disorder and give advice or referral\nto appropriate personnel\n1.4\nSelected and prepared sanitized tools and equipment\nand appropriate supplies and materials\n1.5\nObserved proper handling of chemicals and\nprotection\n1.6\nCleaned and cut nails using appropriate tools and in\naccordance with established or acceptable\nprocedures\n1.7\nApplied nail polish in accordance with established or\nacceptable procedures\n1.8\nPerformed post-service activities\n1.9\nUsed questioning and listening skills to ensure client’s\nsafety and comfort during the entire process\n2. Underpinning\nknowledge\n2.1\nTypes of Nails\n2.2\nCondition of Nail\n2.3\nSkin Diseases around the nails\n2.4\nStructure, Shape and Styles of Nails\n2.5\nHand and Foot Massage Movements\n2.6\nCode of Ethics\n2.7\nAnalysis of Nail Disorder\n2.8\nD.O.H and OH&S requirements\n2.9\nFirst-aid treatment\n2.10 Salon Policies and Procedures\n2.11 Different Kinds of Antiseptic\n2.12 Environment and safety regulations\n• Occupational Health and safety\n• 5S Procedures\n• 3R Concepts\n3. Underpinning skills\n3.1\nMassaging techniques\n3.2\nApplying nail polish\n3.3\nNegotiations Skills\n3.4\nUsing appropriate tools and equipment\n3.5\nClient Relations\n3.6\nObserving code of ethics\n3.7\nCompliance on DOH and OH&S requirements\n3.8 Applying first-aid treatment in case cuts were done\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nModel\n4.2\nTools, equipment and supplies/materials relevant to\nthe activity to be performed\n4.3\nWork area/facilities\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDemonstration with oral questioning\n5.2\nThird -Party Report\n5.3\nPortfolio\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in\na simulated environment (TESDA Accredited Training\nCenters)\n\n--- PDF PAGE 38 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 34 -\nUNIT OF COMPETENCY :\nPERFORM HAND SPA\nUNIT CODE\n:\nHCS515326\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude in\nperforming spa for the hands. It also involves preparing the\nclient, application of hand spa products and performing post\nhand spa activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold &Italicized fonts are elaborated in the Range of Variables\n1. Prepare client\n1.1\nCondition of client’s hand and nails are checked\nand analyzed following salon policies and procedures\n1.2\nClient’s hand is washed with lukewarm water and\nsoap, and towel-dried before and after scrubbing\n1.3\nClient is advised to remove jewelries and accessories\n\n2. Apply hand treatment 2.1\nNecessary tools and supplies/materials are\nprepared and used according to OH&S requirements\n2.2\nHand spa machine is set to regulate heat to achieve\nrequired melting of wax\n2.3\nAppropriate temperature is determined and tested by\nclient respective heat tolerance\n2.4\n Hand Spa is performed in accordance with establish\nor acceptable procedure\n2.5\nClients’ safety and comfort is ensured during the\nentire process.\n2.6\nDesired service outcome is confirmed with client and\nrecorded\n\n3. Perform post service\nactivities\n3.1 Client is advised on after service maintenance\n3.2 Waste products are disposed according to\nenvironment and safety regulations\n3.3 Tools and equipment are sanitized and stored\nenvironment and safety regulations\n3.4 Workstation is cleaned and sanitized for next client\n\n--- PDF PAGE 39 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 35 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand conditions\n1.1\nCallous\n1.2\nNormal with no cuts or wounds\n1.3\nDry\n\n2. Clients\n2.3\nChild\n2.4\nMen\n2.5\nWomen\n2.6\nWorking Group\n2.7\nTeener\n2.8\nElderly\n\n3. Hand spa machine\nsetting\n3.1\nMelt\n3.2\nWarm\n\n4. Tools, equipment and\nsupplies/machine\n4.1\nTools\n4.1.1\nSmall basin\n4.1.2\nStool\n4.2\nEquipment\n4.2.1\nHand spa machine\n4.3\nSupplies/materials\n4.3.1 Mittens\n4.3.2 Transparent Plastic\n4.3.3 Hand Towel\n4.3.4 Softening Lotion\n4.3.5 Paraffin Wax\n4.3.6 Soap\n4.3.7 Scrub Lotion\n4.3.8 Skin Oil (e.g. Liniment Oil, Aromatherapy Oil,\nOlive Oil)\n4.3.9 Cling Wrap\n4.3.10 Rubbing Alcohol\n4.3.11 Rough gloves\n\n5. Establish or\nacceptable procedure\nHand Spa\n5.1\nSubmerge hand in hand spa machine with wax within\ntimeline.\n5.2\nWrap hand with plastic gloves and mittens as within\ntimeline\n5.3\nRemove wax from hand gradually\n5.4\nApply hand softening product and massage\n\n6. After service\nmaintenance\nprogram\n\n6.1\nFrequent Salon Visit (Twice a Month)\n6.2\n3-5 Times a day application of lotion.\n\n--- PDF PAGE 40 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 36 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked and analyzed hand and nail conditions\nfollowing salon policies and procedures\n1.2\nObserved proper handling of chemicals and\nprotection\n1.3\nPerformed washing, scrubbing and massaging of\nhand in accordance with established or acceptable\nprocedure\n1.4\nPerformed post-service activities\n1.5\nFollowed safety rules in setting and handling,\ncleaning and storing of tools and equipment\n1.6\nApplied salon policies and procedures and industry\ncodes of practice in application of hand and nail\ntreatment\n1.7\nConsistently used effective questioning and listening\ntechniques in ensuring client safety and comfort\nthroughout the service\n\n2. Underpinning\nknowledge\n2.1\nHand Analysis\n2.2\nCode of Ethics\n2.3\nD.O.H. and OH & S Regulations\n2.4\nFirst-aid treatment\n2.5\nSalon Practice and Procedures\n2.6\nDifferent Hand Treatments\n2.7\nDifferent Hand Conditions\n2.8\nEnvironment and safety regul