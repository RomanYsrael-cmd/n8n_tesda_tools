vironment.\n6.4\nContinuous assessment in an institutional setting that\nstimulates the conditions of performance describe in\nthe elements, performance criteria and range of\nvariables statement that make up this unit.\n6.5\nContinuous assessment in the workplace, taking into\naccount the range of variables affecting performance.\n6.6\nSelf-assessment on the same terms as those\ndescribed above.\n6.7\nSimulated assessment or critical incident\nassessment, provided that the critical incident\ninvolves assessment against performance criteria and\nan evaluation of underpinning knowledge and skill\nrequired to achieve the required performance criteria.\n\n--- PDF PAGE 23 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 19 -\nUNIT OF COMPETENCY :\nMANAGE OWN PERFORMANCE\n\nUNIT CODE\n:"
