        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCarried out work in accordance with the company’s\nstandard operating procedures.\n1.2\nPerformed task according to specifications.\n1.3\nReported errors or deviations not in accordance with\nstandard operating procedures.\n1.4\nCarried out work in accordance with the process\nimprovement.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nRelevant production processes, materials and\nproducts\n2.2\nCharacteristics of materials, software and hardware\nused in production processes\n2.3\nQuality checking procedures\n2.4\nClient relations\n2.5\nWork place procedures\n2.6\nSafety and environmental aspects of service\nprocesses\n2.7\nError identification and reporting\n2.8\nQuality improvement processes\n\n3. Underpinning skills\n3.1\nReading skills required to interpret work instructions,\nproduct manufacturer’s requirements\n3.2\nCommunication skills needed to interpret and apply\ndefined work procedures\n3.3\nCarry out work in accordance with OHS policies and\nprocedures\n3.4\nCritical thinking\n3.5\nSolution providing and decision making\n3.6\nInterpersonal skills or dealing with varied type of\nclients\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nMaterials\n4.2\nProduct\n4.3\nEquipment\n\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation with oral questioning\n5.2\nThird Party Report\n5.3\nPractical Demonstration\n\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in\na simulated environment.\n\n--- PDF PAGE 30 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 26 -\nUNIT OF COMPETENCY :\nMAINTAIN A SAFE, CLEAN AND EFFICIENT WORK\nENVIRONMENT\nUNIT CODE\n:"
