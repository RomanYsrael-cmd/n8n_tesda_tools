        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nGenerated information on different client\nrequirements and needs.\n1.2\nSelected and used strategies to accurately analyzed\nthe client requirements.\n1.3\nAssessed current product and services as against\nclient demand.\n1.4\nIdentified avenues to establish relevant linkage..\n1.5\nSelected promotional activities relevant to enhance\ncompetitiveness of salon.\n1.6\nAssisted clients on specific desired services.\n1.7\nChecked and prepared tools for the specific salon\nactivities.\n\n2. Underpinning\nknowledge and\nattitudes\n2.1\nMedia Options\n2.2\nData Gathering\n2.3\nSalon Policies\n2.4\nInternational Market\n2.5\nSkills Competition Rules and Procedures\n2.6\nNew Trends in Products and Services\n2.7\nEthical Limitations\n\n3. Underpinning skills\n3.1\nCommunication skills to identify lines of\ncommunication, request advice, follow instructions\nand receive feedback.\n3.2\nTechnology Skills\n3.3\nInterpersonal Skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nClient\n4.3\nRelevant Information\n4.4\nAppropriate Products\n\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nPractical Demonstration with questioning\n\n6. Context of\nassessment\n6.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 34 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 30 -\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM MANICURE AND PEDICURE\nUNIT CODE\n:"
