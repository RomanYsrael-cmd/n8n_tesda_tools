isor for return to supplier. \n4.5 \nSafe lifting and carrying techniques maintained in line \nwith salon occupational health and safety policy and \ngovernment legislation. \n \n5.  Provide a relaxed \nand caring \nenvironment \n5.1 \nClients are made to feel comfortable according to \nsalon policy. \n5.2 \nClients’ needs are reported to. \n5.3 \nClients are consulted on specific desired service.\n\n--- PDF PAGE 32 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 28 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant salon \npolicies and \nprocedures \n            \n \nMay include but not limited to: \n1.1 \nHazard Policies and Procedures \n1.2 \nEmergency, Fire and Accident Procedures \n1.3 \nPersonal Safety Procedures \n1.4 \nProcedures for the use of Personal protective \nClothing and Equipment \n1.5 \nHazard Identification \n1.6 \nJob Procedures \n \n2. Occupational health \nand safety \nprocedures \nMay include but not limited to: \n2.1 \nClient  \n2.2 \nStaff \n2.3 \nEquipment/Tools \n2.4 \nPremises \n2.5 \nStock \n \n3. Unsafe situations \nMay include but not limited to: \n3.1 \nDamaged Packaging Material or Containers \n3.2 \nBroken or Damaged Equipment \n3.3 \nInflammable Materials and Fire Hazards \n3.4 \nLifting Practices \n3.5 \nSpillages \n3.6 \nWaste including hair especially on floors \n3.7 \nTrolleys \n \n4. Linkage \nMay be related to the following: \n4.1 \nInstitutional \n4.2 \nOrganizational Linkage \n4.3 \nSocial Services \n4.4 \nInternational Market\n\n--- PDF PAGE 33 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 29 -"
