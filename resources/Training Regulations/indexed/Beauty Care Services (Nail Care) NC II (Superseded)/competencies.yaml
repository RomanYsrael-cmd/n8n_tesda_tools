        "source_title": "PERFORM FOOT SPA",
        "source_text": "--- PDF PAGE 41 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 37 - \nUNIT OF COMPETENCY : \nPERFORM FOOT SPA \nUNIT CODE \n: \nHCS515330 \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitude in \nperforming foot spa.  It involves the preparation of the \nclients, application of foot spa products and performing post \nfoot spa activities. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold &Italicized fonts are elaborated in the Range of Variables \n1.  Prepare client \n1.1 \nFoot condition is checked and analyzed following \nsalon policies and procedures \n1.2 \nWhere applicable, client is advised to defer massage \nat a later time \n1.3 \nClient is advised to remove jewelries and accessories \n1.4 \nClient’s foot is soaked in lukewarm water with soap \nbefore scrubbing \n \n2. Clean and scrub foot \n \n2.1 \nTools, equipment, supplies and materials are \nprepared and used according to salon procedures \n2.2 \nWater temperature is checked according to client heat \ntolerance \n2.3 \nFoot spa is performed in accordance with \nestablished or acceptable procedure \n2.4 \nClient’s safety and comfort is ensured during the \nentire process \n2.5 \n Outcome of treatment is assessed against client’s \nrequirements and recorded following salon procedure \n \n3. Perform post  service \nactivities \n3.1 \nAfter care advice and homecare products are \nrecommended according to client’s needs \n3.2 \nTools, equipment, supplies and materials are \ndisinfected and stored according to environment and \nsafety regulations \n3.3 \nWorkstation is sanitized and prepared for the \nsucceeding salon activities \n3.4 \nWastes are disposed according to environment and \nsafety regulations\n\n--- PDF PAGE 42 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 38 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Foot condition \n1.1 \nNormal \n1.2 \nDry \n1.3 \nWith abrasions or cuts \n1.4 \nWith fungal infection or wounds \n1.5 \nWith open wound \n \n2. Tools and equipment \n2.1 \nFoot Spa Machine \n2.2 \nFoot File \n2.3 \nFoot Stool \n2.4 \nPumice Stone \n2.5 \nRough Gloves \n2.6 \nHand Brush \n2.7 \nFoot  Basin \n2.8 \nFoot Towel \n2.9 \nBowl \n2.10 Callous Scraper \n2.11 Foot brush \n \n3. Supplies and \nmaterials \n3.1 \nFoot Toner \n3.2 \nFoot Blush \n3.3 \nWhitening Powder \n3.4 \nMoisturizing Lotion \n3.5 \nAntiseptics \n3.6      Foot Soak \n3.7 \nFoot Lotion \n3.8 \nFoot Scrub Lotion \n3.9 \nOil \n3.10 Warm Water \n3.11 Henna Powder \n \n4. Establish and \nacceptable procedure \nMay include but are not limited to: \n4.1 \nClean feet thoroughly by soaking in liquid soap and \nlukewarm water within timeline \n4.2 \nFile feet  thoroughly, rinse and dry after \n4.3 \nApply scrubbing product and slightly massage with \nrough mittens  \n4.4 \nWash feet thoroughly and pat dried \n4.5 \nApply foot blush on the sole \n4.6 \nApply lotion and do the basic massage   \n \n5. Homecare products \n5.1 \nFoot Powder \n5.2 \nFoot Spray/Sanitizer \n5.3 \nFoot Lotion/Moisturizer\n\n--- PDF PAGE 43 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 39 - \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nAnalyzed varied condition of the foot following salon \npolicies and procedures \n1.2 \nChecked, handled and stored appropriate tools, \nequipment, supplies, materials according to OHSC \nrequirements  \n1.3 \nObserved proper handling  of chemicals and \nprotection \n1.4 \nCleaned and scrubbed foot in accordance with the \nestablished or acceptable procedures \n1.5 \nApplied treatment product as per clients needs \nfollowing manufacturer’s instructions and safety \npractices \n1.6 \nApplied salon policies and procedures in performing \nfoot treatment \n1.7 \nApplied of safety rules and regulations during the \nentire process \n1.8 \nDisplayed the ability to use effective questioning and \nlistening skills in consulting and negotiating with \nclients    \n2. Underpinning \nknowledge and \nattitudes \n2.1 \nFoot Condition \n2.2 \nCode of Ethics \n2.3 \nOH&S and D.O.H. Rules and Regulations \nrequirements \n2.4 \nBasic Foot Massage Procedure \n2.5 \nSalon Policies and Procedures \n2.6 \nBasic Product Knowledge \n2.7 \nFirst-aid treatment \n2.8 \nTime Management \n2.9 \nEnvironment and safety regulations \n• Occupational Health and safety \n• 5S Procedures \n• 3R Concepts \n3. Underpinning skills \n3.1 \nApplying basic massage \n3.2 \nScrubbing procedures \n3.3 \nApplying proper massage procedure \n3.4 \nHandling of tools \n3.5 \nHandling client  \n3.6 \nManaging time  \n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nModel \n4.2 \nTools, equipment and supplies/materials relevant to \nthe activity to be performed \n4.3 \nWork area/facilities \n \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDemonstration with Oral Questioning \n5.2      Third Party Report  \n5.3      Portfolio \n6. Context of \nassessment \n6.1      Assessment may be conducted in the workplace or in \na simulated environment. (TESDA Accredited \nTraining Centers)\n",
