          "source_text": "1. Prepare clients \n \n \n1.1 \nClient is consulted on desired nail service activity \nand specific requirements and consultation record is \nagreed and signed \n1.2 \nClients’ hand nail structure and condition are \nchecked and analyzed \n1.3 \nClient is provided with protective materials for hygiene \npurposes \n1.4 \nNail disorder is recognized and if necessary, referred \nto appropriate personnel \n \n2. Perform cleaning and \ncutting of nails \n2.1 \nAppropriate sanitized tools and equipment, \nsupplies and materials are selected and prepared \naccording to salon procedures \n2.2 \nHands and feet are disinfected sanitized, cleaned and \ndried completely \n2.3 \nNails are cleaned in accordance with established or \nacceptable procedures. \n2.4 \nNails are trimmed and filed based on client’s desired \nshape. \n2.5 \nFingers are lightly massaged following prescribed \nmovements \n2.6 \nClient’s safety and comfort is ensured during the \nentire process. \n2.7 \nFirst-aid is applied in case of accidental cuts and \nwounds \n \n3. Apply nail polish \n3.1 \nColor of  nail polish is selected and agreed according \nto customer requirements \n3.2 \nNail polish is applied in accordance with established/ \nacceptable as procedure \n3.3 \nOutcome is checked and analyzed against agreed \nnail service result. \n \n4. Perform post-service \nactivities \n5.1 \nClient is advised on nail maintenance practices  \n5.2 \nWaste are properly disposed according to waste \nenvironment and safety regulations \n5.3 \nTools and materials are sanitized and stored in \naccordance with salon policies and procedures \n5.4 \nWorkstation is cleaned and sanitized in accordance \nwith OH&S requirements\n\n--- PDF PAGE 35 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 31 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Client \n1.1 \nLadies \n1.2 \nMen \n \n2. Nail service activity \n2.1 \nManicure \n2.2 \nPedicure \n \n3. Nail condition \n3.1 \nNormal nail \n3.2 \nHang nail \n \n4. Nail Disorder \n3.1 \nWavy Ridges - Corrugation \n3.2 \nDepression - Furrous \n3.3 \nWhite Spots - Leuconychia \n3.4 \nHypertrophy - Onychauxis \n3.5 \nWasting Away - Atrophy \n3.6 \nPterygium \n3.7 \nBitten Nails - Onycophay \n3.8 \nBrittle Nails – Onychorrhexis \n \n5. Equipment /Tools  \n \n5.1 \nManicuring Table \n5.2 \nAdjustable Lamp \n5.3 \nClients Chair \n5.4 \nManicurist Chair or Stool \n5.5 \nSupply Tray \n5.6 \nFinger Bowl \n5.7 \nContainer for Cotton \n5.8 \nWet Sanitizer \n5.9 \nGlass Container \n5.10 \nSterilizer \n5.11 \nCuticle pusher \n5.12 \nEmery board \n5.13 \nOrange wood stick \n5.14 \nCuticle nipper \n5.15 \nNail Cutter \n5.16 \nNail brush \n5.17 \nNail buffer \n5.18 \nToe nail separator \n5.19 \nNail file \n5.20 \nCuticle scissors \n \n6.  Supplies/Materials \n6.1 \nAntiseptic Solution \n6.2 \nCotton \n6.3 \nNail Polish Remover \n6.4 \nCuticle Oil \n6.5 \nCuticle Remover \n6.6 \nBase Coat \n6.7 \nTop Coat\n\n--- PDF PAGE 36 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 32 - \nVARIABLE \nRANGE \n6.8 \nHand and Foot Lotion \n6.9 \nSanitized Towel \n6.10 \nAlcohol \n6.11 \nColored Nail Polish \n6.12 \nCotton balls \n6.13 \nQuick dry \n6.14 \nNail solvent \n \n7. Established \nprocedure \n7.1 \nCleaning Nails  \n7.1.1 Remove old nail polish with nail polish remover \n7.1.2 Soak fingernails in lukewarm water with soap  \n7.1.3 Slightly push cuticles and dry skins and trim.  \n7.1.4 Cut nails and file following customer’s desired \nshape and style \n7.1.5 Massage hands and foot following different \nmassage movements  \n7.2 \nApplying Nail polish \n7.2.1 Apply nail polish  from the base to the edge of \nthe nail using light sweeping stroke around the \ncuticle \n7.2.2 Apply top or seal coat with long strokes in the \nsame manner as the base coat \n7.2.3 Remove excess nail polish around the cuticle \nand nail. \n7.2.4 Apply quick drying agent on each polished nail  \n \n8. Nail Shape \n8.1 \nOval \n8.2 \nSquare \n8.3 \nRound \n8.4 \nPointed \n \n9. Massage movements 9.1 \nEffleurage massage  \n9.2 \nPetrissage massage \n9.3 \nSliding \n9.4 \nCircular \n9.5 \nStretching \n9.6 \nFriction \n \n10. Client’s safety and \ncomfort \n10.1 During massage \n9.1.1 Maneuvering of customers during massage \n9.1.2 Confirmation of client allergies \n10.2 Determining skin disorders and ailments relevant to \nbeauty care treatment \n \n11 \nEnvironment and \nsafety regulations \n11.1 Occupational Health and safety \n11.2 5S Procedures \n11.3 3R Concepts\n\n--- PDF PAGE 37 ---\nTR Beauty Care Services (Nail Care) NC II \n          Promulgated   \n- 33 -"
