  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of BEAUTY CARE (NAIL CARE) SERVICES NC\nII, the candidate MUST demonstrate competence in all the units of competency\nlisted in Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n4.2\nThe qualification of Beauty Care Services (Nail Care) NC II may be attained through\ndemonstration of competency through project-type assessment covering all the\nfollowing core units of the qualification:\n4.2.1\nPerform manicure\n4.2.2\nPerform pedicure\n4.3\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n4.4.1\nGraduates of formal, non-formal and informal including enterprise-\nbased training programs\n4.4.2\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 53 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 49 -\nPerform\nhair\nbleaching\n\nPerform\nhairpiece\nattachment,\nstyling and\nmaintenance\n\nPerform\nhair extension\nactivities\n\nApply\nbasic facial\nmake-up\nELECTIVE\nCOMPETENCIES\n\nPerform\nhair perming\nPerform men\npiece\nattachment,\nstyling and\nmaintenance\n\nPerform\nhair relaxing\n\nPerform\ntattooing\n\nPerform\nprosthetic facial\nmake-up\n"
}
