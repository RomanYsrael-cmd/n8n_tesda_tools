      "text": "5 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”. --- PDF PAGE 53 --- TR Beauty Care Services (Nail Care) NC II Promulgated - 49 - Perform hair bleaching Perform hairpiece attachment, styling and maintenance Perform hair extension activities Apply basic facial make-up Perform hair perming Perform men piece attachment, styling and maintenance Perform hair relaxing Perform tattooing Perform prosthetic facial make-up HEALTH, SOCIAL AND OTHER COMMUNITY DEV’T SERVICES SECTOR – COSMETOLOGY SUB-SECTOR BEAUTY CARE SERVICES (NAIL CARE) NC II Demonstrate work values Practice housekeeping procedures Participate in workplace communication Work in team environment Practice career professionalism Work with others Receive and respond to workplace communication Practice occupational health and safety procedures Lead workplace communication Lead small teams Maintain an effective relationship with clients/ customers Apply quality standards Manage own performance Maintain a safe, clean and efficient environment Develop and practice negotiation skills Use mathematical concepts and techniques Use relevant technologies Solve problems related to work activities Develop teams and individuals Utilize specialized communication skills Collect, analyze and organize information Plan and organize work Apply problem- solving techniques in the workplace Promote environmental protection Perform advanced/ creative hair coloring Provide hair coloring services Provide hair and scalp treatment services Perform haircutting activities Perform beard and moustache shaving and styling Perform basic haircutting Perform hair bleaching Perform hair straightening Perform creative hairstyle Perform basic hair coloring Perform basic hair perming Perform advanced/ creative hair perming Perform pre and post- barbering activities Perform advanced/creati ve haircutting Perform hair and scalp treatment Perform basic facial treatment Perform eyelash enhancement Perform temporary hair removal activity Perform body bleach Perform pre and post hair care activities Apply basic make-up Perform eyebrow arching and shaping Perform advanced facial treatment Perform hand spa Perform nail extension Perform nail enhancement Perform nail wrap treatment Perform foot spa Perform creative nail design Perform chair spot massage Perform body massage Perform advanced/ creative facial make-up Perform manicure and pedicure Perform body scrub --- PDF PAGE 54 --- TR Beauty Care Services (Nail Care) NC II Promulgated - 50 - Beauty care - An overall beauty treatment intended to change or improve a person’s appearance Body bleach - Process used to lightens the color of hair to a light shade of blonde Body scrub - Is a process of removing dead skin cells and exfoliating the top layer of the skin Callus - a hardening of the skin through friction Cuticle - Overlapping skin surrounding the nail. It protects the matrix from invading bacteria and physical damage Cosmetic - Are substances used to enhance the appearance or odor of the human body Cosmetologist - one who is skilled in the art of improving/enhancing a person’s appearance Eyebrow arching - Is a process of arching brows to produce a more precise and uniform shapes Eyelashes extension - Are single strands of synthetic eyelashes that are curved to replicate a natural eyelashes Eyelashes perming - A procedure used to curl semi-permanent eyelashes Facial - Care for the face that usually involves cleansing and massage and the application of cosmetic creams Facial make- up - Used to enhance the beautiful part of face and hide defects Fancy manicure - the art of applying nail polish in decorative fashion Foundation - a cosmetic usually used as a base for make-up. It can be in a form of liquid, cream, gel, solid creams, in sticks and cakes. Hand massage - Replenishes moisture and also alleviates pain and helps you to relax. An effective way of removing dead cells Make up - Is a sub-set of cosmetic which refers primarily to colored products intended to alter the user’s appearance Manicure - it came from the latin word “manus” (hand) and “cura” (care) which means the care of the hands and nails Mascara - a cosmetic for covering the eyelashes Massage - involves the external manipulation of the body by rubbing, pinching, kneading and strolling with the use of hands or an instruments Nail - Important structure made of keratin that has 2 purposes – fingernails act as protective plate and enhance sensation of fingertips Nail structure - Compose of free edge, nail plate, nail walls, lunula, cuticle, hyponychium, nail grove, nail bed, matrix and mantle Pedicure - the professional or artful care of the feet and toenails Plucking - Means the process of removing hair by mechanically pulling the hair from owner’s body Shaving - Is the removal of hair, by using a razor or any kind of bladed implements, to slice it down to the level of the skin Spa - Places devoted to overall well-being through a variety of professional services that encourage the renewal of mind, body and spirit Tattoo - Is a marking made by inserting indelible ink into the dermis layer of the skin to change the pigment for decorative or other reason Waxing - Is the best temporary method of hair removal --- PDF PAGE 55 --- The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. REVIEW PANEL (2010) EMMA P. ALBIOR MARIA EVANGELINE V. BERTUMEN Philippine International Haircutters Philippine International Haircutters Association Association (PIHA) (PIHA) #2 Anonas St., Project 3, Quezon City #2 Anonas St., Project 3, Quezon City LOURDES