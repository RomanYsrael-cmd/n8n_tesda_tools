    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: BEAUTY CARE SERVICES (NAIL CARE)\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n 18 Hours (Common)\n\n 180 Hours (Core)\n\n150-in-school\n\n 30-SIT\n\n 216 Hours (Total)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nbeauticians in accordance with industry standards. It Covers basic, common and core\ncompetencies in NC II.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation.\n1.2 Participate in\nworkplace meeting\nand discussion.\n1.3 Complete relevant\nwork related\ndocuments.\n\n• Group\ndiscussion\n• Interaction\n\n• Written\nexamination\n• Practical/\nperformance\ntest\n• Interview\n\n--- PDF PAGE 45 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 41 -\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n2.2 Describe work as a\nteam member.\n\n• Group\ndiscussion\n• Interaction\n\n• Observation\n• Simulation\n• Role Playing\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment\n\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interview/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify hazards and\nrisks\n4.2 Evaluate hazards and\nrisks.\n4.3 Control hazards and\nrisks.\n4.4 Maintain occupational\nhealth and safety\nawareness.\n\n• Group\ndiscussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 46 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 42 -\n\nCOMMON COM