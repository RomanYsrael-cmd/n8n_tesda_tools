on\n• Interaction\n• Demonstration\n• Observation\n• Interview/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify hazards and\nrisks\n4.2 Evaluate hazards and\nrisks.\n4.3 Control hazards and\nrisks.\n4.4 Maintain occupational\nhealth and safety\nawareness.\n\n• Group\ndiscussion\n• Plant Tour\n• Symposium\n• Observation\n• Interviews\n\n--- PDF PAGE 46 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 42 -\n\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship\nwith clients/\ncustomers\n1.1\nMaintain a\nprofessional image\n1.2\nMeet client/customer\nrequirements\n1.3\nBuild credibility with\ncustomers/clients\n\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n2. Manage own\nperformance\n2.1\nPlan own workload\n2.2\nMaintain quality of\nown performance\n2.3\nEstablish credibility\nwith customers/\nclients\n\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\n• Questioning\n3. Apply quality\nstandards\n3.1\nAssess clients\nservice needs\n3.2\nAssess own work\n3.3\nEngage in quality\nimprovement\n\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n4. Maintain a safe,\nclean and\nefficient work\nenvironment\n4.1\nFollow hygiene\nprocedures\n4.2\nIdentify and prevent\nhygiene risks\n4.3\nPrepare and\nmaintain work area\n4.4\nCheck and maintain\ntools and equipment\n4.5\nCheck and maintain\nstocks\n4.6\nProvide a relaxed\nand caring\nenvironment\n\n• Group\nDiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 47 ---\nTR Beauty Care Services (Nail Care) NC II\n Promulgated\n- 43 -\nCORE COMPETENCIES\n(150 Hrs- in-school + 30 Hrs-SIT)\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApp