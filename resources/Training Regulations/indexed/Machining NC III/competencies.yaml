tive \ndevices.\n\n--- PDF PAGE 59 ---\nmachiii \n04/11/06 \n58\n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Materials \nMaterials used in benchwork operations include \n1.1 Ferrous \n1.2\nNon Ferrous\n2. Bench work tools and  \nEquipment \nEquipment and tools may include \n2.1   Drill Press \n2.2   Pedestal Grinder \n2.3   Surface plate \n2.4   Layout and marking tools \n2.5   Cutting tools (hacksaw, chisel, files) \n2.6   Drills, reamers, laps \n2.7   Thread cutting tools (taps and stock and die) \n2.8   Inspection and measuring tools (templates, vernier \ncaliper, micrometer, straight edge, gages, etc…)\n3. Workholding Devices \nWorkholding devices include the use of \n3.1   Clamps \n3.2   Vises\n4. Bench work operations \nBench work operations \n4.1   Layout and marking \n4.2   Cutting \n4.3   Chipping \n4.4   Filing  \n4.5   Drilling, boring, counterboring, spot-facing \n4.6   Lapping \n4.7   Reaming \n4.8   Thread cutting \n4.9   Off-hand grinding\n\n--- PDF PAGE 60 ---\nmachiii \n04/11/06 \n59"
