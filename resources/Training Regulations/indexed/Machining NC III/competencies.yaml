        "source_text": "MEE722307\n\nUNIT DESCRIPTOR: This unit covers the skills required to setup and mill workpiece to\ndrawing specifications . It details the requirements for performing\nmilling operations such as indexing, milling splines, equally-\nspaced grooves, 45 serrations in cylindrical workpiece, spur\ngear and rack, ratchets, converging faces, large radial slots,\ninternal radii and plain bevel gear.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine job\nrequirements\n1.1\n\n1.2\n\n1.3\n\nDrawings are interpreted to produce component to\nspecifications.\nSequence of operation is determined to produce\ncomponent to specifications.\nCutting tools are selected according to the\nrequirements of the operation.\n2.\nSetup workpiece\n2.1\n\n2.2\n\nWorkpiece is setup to required level of accuracy\nusing instruments/equipment according to work\nsite procedures.\nSetup\noperations\nare\nperformed\napplying\nknowledge on safety procedures and using\npersonal protective devices.\n3.\nPerform milling\noperations\n3.1\n3.2\n\n3.2\n\n3.4\n\nSpeeds and feeds are set appropriate to the job.\nMilling machine accessories used are\nappropriate to the requirements of the operation.\nMilling operations are performed to produce\ncomponent to specifications in the drawing.\nMilling operations are performed applying\nknowledge on safety procedures and using\npersonal protective devices.\n4.\nCheck/Measure\nworkpiece\n4.1\n\nWorkpiece is checked/measured for conformance\nto specification using appropriate techniques,\nmeasuring tools and equipment.\n\n--- PDF PAGE 83 ---\nmachiii\n04/11/06\n82\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Cutting Tools\nCutting tools used in milling operations include:\n1.1 Side and face cutters\n1.2 Gear cutter and other formed cutter\n1.3 Slitter\n1.4 Slot cutter\n2. Workpiece\nWorkpiece materials used in milling operations\n2.1 Ferrous\n2.2 Non-ferrous\n3. Milling machine\naccessories\n3.1 Workholding devices\n3.1.1 clamps\n3.1.2 vises\n3.1.3 angle plates\n3.2 Rotary tables\n3.3 Indexing head\n3.4 Footstock\n4. Milling Operations\nMilling operations\n4.1\nindexing\n4.2\nstraddle-milling\n4.3\nmilling using fly cutter\n4.4\nmilling splines\n4.5\nmilling equally-spaced grooves\n4.6\nmilling 45 serrarions on cylindrical workpiece\n4.7\nmilling spur gear and rack\n4.8\nmilling bevel gear\n4.9\nmilling ratchet\n4.10 milling converging faces\n4.11 milling large radial slots\n4.12 milling internal radii\n5. Measuring Tools\n5.1 Steel rule\n5.2 Vernier caliper\n5.3 Micrometer caliper\n5.4 Gages (bore, surface finish, radius, depth)\n5.5 Gear tooth caliper\n\n--- PDF PAGE 84 ---\nmachiii\n04/11/06\n83\nEVIDENCE GUIDE\n1.\nCritical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 determined job requirements\n1.2 setup the workpiece .\n1.3 performed milling operations\n1.4 checked/measured the workpiece\n2.\nUnderpinning\nknowledge\n2.1 Shop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n2.2 Drawing interpretation\n2.2.1 Alphabet of lines\n2.2.2 Drawing symbols\n2.2.3 Projections and views\n2.2.4 Fits and tolerances\n2.2.5 Surface texture\n2.2.6 Sketches and mechanical drawing\n\n2.3 Shop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n\n2.4 Measurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Dial indicator\n2.4.3 Precision square\n2.4.4 Bevel protractor\n2.4.5 Vernier height gage\n2.4.6 Gear tooth caliper\n\n2.5 Materials and related science\n2.5.1 Classification and mechanical properties of\nengineering materials\n2.5.2 Lubricants and coolants\n\n--- PDF PAGE 85 ---\nmachiii\n04/11/06\n84\n\n2.6 Milling operations\n2.6.1 Milling types and specifications\n2.6.2 Milling machine parts and functions\n2.6.3 Milling cutters and holders\n2.6.4 Setting cutting speed, rpm, feed rate\n2.6.5 Workholding devices\n2.6.6 Milling machine accessories, fixtures and\nattachments\n2.6.7 Indexing\n3.\nUnderpinning\nskills\n3.1 Selecting and setting cutting tools\n3.2 Using measuring instruments\n3.3 Verifying workpiece specifications\n3.4 Computation of feed, cutting speed and machine rpm\n4.\nResource\nimplications\nThe following resources MUST be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the proposed activity\n4.3 Drawings, sketches or blueprint\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation of milling activities\n5.2 written or oral short answer questions\n5.3 practical exercises\n5.4 identify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 86 ---\nmachiii\n04/11/06\n85\nUNIT OF COMPETENCY: Mill Workpiece (Advanced)\n\nUNIT CODE:"
