        "source_text": "--- PDF PAGE 39 ---\nmachiii \n04/11/06 \n38\n \nUNIT OF COMPETENCY:   PERFORM ROUTINE HOUSEKEEPING \n \nUNIT CODE:   MEE722206 \n \nUNIT DESCRIPTOR:   This unit covers the competencies required to maintain an \norganized and clean work area. \n \n \n    ELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nOrganize work area \n1.1 \n \n1.2 \n \n \n1.3 \nWork area maintained in a safe, uncluttered and \norganized manner according to workshop policy. \nAll tasks carried out safely, effectively and \nefficiently with minimum inconvenience according \nto workshop policy. \nWorkshop policies and procedures for tidying work \nareas and placing items in designated areas \napplied.  \n2. \nClean work area \n2.1 \n \n2.2 \n \n \n2.3 \n \n \n \n2.4 \n \n2.5 \n \n2.6 \nShop policies and procedures applied for cleaning \nwork area. \nWastes promptly removed and disposed of \naccording to shop policies and environmental \nrequirements. \nSpills, wastes and other potential hazards \nreported to appropriate personnel and removed \naccording to shop policies and environmental \nrequirements. \nSignage promptly displayed in regard to unsafe \nareas. \nConsumable materials maintained and stored \ncorrectly after use. \nTools and equipment (including guards) cleaned \nand used in accordance with manufacturer’s \ninstructions.\n\n--- PDF PAGE 40 ---\nmachiii \n04/11/06 \n39\n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1.   Workshop policy \nShop policy and procedure in regard to: \n1.1 Housekeeping practices \n1.2 Maintenance and storage of cleaning equipment \n1.3 Use and storage of cleaning chemicals \n2.   Work area \nWork area may include: \n2.1 Work benches \n2.2 Walkways and aisles  \n2.3 Fixtures and other working surfaces  \n3.  Tools and  \n     Equipment \nEquipment and tools may include: \n3.1 Drill Press \n3.2 Pedestal Grinder \n3.3 Surface plate \n3.4 Layout and marking tools \n3.5 Cutting tools (hacksaw, chisel, files) \n3.6 Inspection and measuring tools (templates, vernier \ncaliper, micrometer, straight edge, gages, etc…)\n\n--- PDF PAGE 41 ---\nmachiii \n04/11/06 \n40\n \nEVIDENCE GUIDE \n1. \nCritical aspects \nof competency  \nAssessment requires evidence that the candidate organized and \ncleaned work area according shop policies and environmental \nrequirements. \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1  Shop safety practices \n2.2 Machine shop equipment \n2.3 Shop policies regulations \n2.4 5-S \n2.5 Shop cleaning equipment \n3. \nUnderpinning \nskills \n3.1 Using and storing of cleaning equipment \n3.2 Using and storing chemicals, hazardous substances and \nflammable liquids  \n3.3 Literacy and numeracy skills in reading and understanding \nlabels and instructions for the handling and use of chemicals \nand hazardous substances \n3.4 Communication skills \n3.5 Organizing skills \n4. \nResource \nimplications \nThe following resources MUST be provided: \n4.1 Tools, equipment and facilities appropriate to processes or \nactivity \n4.2 Materials and documentation relevant to the proposed \nactivity \n4.3 Shop policy and/or procedures manual on housekeeping, \ncleaning and occupational health and safety \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1 direct observation  \n5.2 demonstration or role play \n5.3 written or oral short answer questions \n5.4  identify colleagues/clients who can be approached for the \ncollection of competency evidence, where appropriate \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
