        "source_text": "--- PDF PAGE 90 ---\nmachiii \n04/11/06 \n89\n \n \nUNIT OF COMPETENCY:    \nGrind Workpiece (Basic) \n \nUNIT CODE:    \nMEE722304 \n \nUNIT DESCRIPTOR:  This unit covers the skills required to setup and grind workpiece \nto drawing specifications . It details the requirements for grinding \nparallel surfaces, square surfaces, angles, radii and cutting off \nparts.  \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nDetermine job \nrequirements \n1.1 \n \n1.2 \n \n1.3 \n \nDrawings are interpreted to produce component to \nspecifications. \nSequence of operation is determined to produce \ncomponent to specifications. \nWorkholding devices are selected according to the \nrequirements of the operation. \n2. \nSelect wheels and \naccessories \n2.1 \n \n \n \n2.2 \n \n2.3 \n \nGrinding wheels are selected, inspected, \nmounted, dressed and trued according to worksite \nprocedures to produce component to \nspecifications. \nAccessories selected are appropriate to the \nrequirements of the operation. \nMachine guards, coolant and dust extraction \ndevices are checked according to worksite \nprocedure. \n3. \nPerform grinding  \noperations \n3.1 \n \n3.2 \n3.3 \n \n \n3.4 \n \nGrinding machine is setup and adjusted in \naccordance with worksite procedures. \nWorkpiece is held or clamped  to avoid damage. \nGrinding operations are performed safely, utilizing \nguards, safety procedures and personal protective \nclothing and devices. \nGrinding  operations are performed to produce \ncomponent to specifications in the drawing. \n4. \nCheck/Measure \ncomponent \n4.1 \n \n \nWorkpiece is checked/measured for conformance \nto specification using appropriate techniques, \nmeasuring tools and equipment.\n\n--- PDF PAGE 91 ---\nmachiii \n04/11/06 \n90\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Grinding wheels \nWheels are selected according to: \n1.1 types \n1.2 grades \n1.3 sizes \n2. Accessories \n2.1 magnetic chuck \n2.2 vices \n2.3 clamps \n2.4 angle plates \n2.5 adapter plates \n2.6 parallels \n2.7 wheel dresser \n3. Grinding machine \n3.1 Horizontal spindle surface grinder \n3.2 Vertical spindle surface grinder \n4. Grinding operations \nGrinding  \n4.1   parallel faces \n4.2   square surfaces \n4.3   angles \n4.4   to a square shoulder \n4.5   radii \n4.6   to cut off parts\n\n--- PDF PAGE 92 ---\nmachiii \n04/11/06 \n91\n \nEVIDENCE GUIDE \n1. \nCritical aspects \nof competency  \nAssessment requires evidence that the candidate:   \n1.1 determined job requirements \n1.2 selected wheels and accessories . \n1.3 performed grinding operations \n1.4 checked/measured the workpiece \n2. \nUnderpinning \nknowledge \n2.1   Shop safety practices \n2.1.1   Safe working habits \n2.1.2   Identification of hazardous areas \n2.1.3   Protective clothing and devices \n2.1.4   Safe handling of tools, equipment and materials \n2.1.5   Housekeeping \n2.1.6   First-aid \n2.1.7   Fire extinguishers \n \n2.2   Drawing interpretation \n2.2.1   Alphabet of lines \n2.2.2   Drawing symbols \n2.2.3   Projections and views \n2.2.4   Fits and tolerances \n2.2.5   Surface texture \n2.2.6   Sketches and mechanical drawing \n \n2.3   Shop mathematics \n2.3.1   Basic arithmetic operations \n2.3.2   Fractions and decimals \n2.3.3   Percentages and ratios \n2.3.4   Conversion of units (English to metric) \n2.3.5   Applying trigonometric functions \n \n2.4   Measurements \n2.4.1   Linear measuring tools (rules, vernier, micrometer) \n2.4.2   Dial indicator \n2.4.3   Precision square \n2.4.4   Bevel protractor \n2.4.5   Vernier height gage \n2.4.6   Gage blocks \n2.4.7   Sine bar \n2.4.8   Radius gage \n2.4.9   Precision square \n \n2.5   Materials and related science \n2.5.1   Classification and mechanical properties of \nengineering materials \n2.5.2   Lubricants and coolants\n\n--- PDF PAGE 93 ---\nmachiii \n04/11/06 \n92\n \n \n \n \n2.6   Grinding operations  \n2.6.1   Grinding machine types and specifications \n2.6.2   Grinding machine parts and functions \n2.6.3   Grinding wheels \n2.6.4   Workholding devices  \n2.6.5   Grinding machine accessories, fixtures and \nattachments \n3. \nUnderpinning \nskills \n3.1   Using measuring instruments \n3.2   Verifying workpiece specifications \n4. \nResource \nimplications \nThe following resources MUST be provided \n4.1   Tools, equipment and facilities appropriate to processes or \nactivities \n4.2   Materials relevant to the proposed activity \n4.3   Drawings, sketches or blueprint \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1   direct observation of milling activities \n5.2   written or oral short answer questions \n5.3   practical exercises \n5.4   identify colleagues/clients who can be approached for the \ncollection of competency evidence, where appropriate \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
