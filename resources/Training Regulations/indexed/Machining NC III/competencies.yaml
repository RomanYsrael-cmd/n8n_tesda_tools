        "source_title": "Perform Bench Work (Basic)",
        "source_text": "--- PDF PAGE 57 ---\nmachiii \n04/11/06 \n56\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:    \nPerform Bench Work (Basic) \n \nUNIT CODE:    \nMEE722301 \n \nUNIT DESCRIPTOR:       This unit covers the competencies required to determine job \nrequirements, perform basic bench work operations (i.e. \nlayout; cutting with hacksaw and chisel; filing; drilling; tapping \netc…)  and check the components for conformance to \nspecifications.  \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nLayout and mark \ndimensions/ \nfeatures on       \nworkpiece \n1.1 \n \n1.2 \n \n \n1.3 \n \n \nMaterials are selected according to the requirements \nspecified in the drawing. \nDimensions/features are laid out and marked in \naccordance with drawing specifications using bench \nwork tools and equipment. \nLayouting \nand \nmarking \nare \nperformed \napplying \nknowledge on safety procedures and using personal \nprotective devices. \n2. \nCut, chip and file \nflat, rectangular or \nround blocks \n2.1 \n \n2.2 \n \n2.3 \n \n2.4 \nWorkpieces are clamped in workholding devices to \navoid damage and accidents. \nWorkpieces are cut, chipped or filed to within tolerance \nspecified in the drawing. \nBroken or dull hacksaw blades are replaced according \nto requirements  \nBench work operations are performed applying \nknowledge on safety procedures and using personal \nprotective devices. \n \n3. \nDrill, ream and lap     \nholes \n3.1 \n \n3.2 \n \n3.3 \n  \nHole is drilled, reamed, spot-faced and lapped to \ndrawing specification. \nDrilling, reaming or lapping holes are performed \naccording to recommended sequence. \nOperations are performed applying knowledge on safety \nprocedures and using personal protective devices. \n4. \nCut threads using \ntap and stock and \ndie \n4.1 \n \n4.2 \n \n4.3 \nThread is cut to fit gage or mating screw, within \ntolerance given in the blueprint \nThread is cut in accordance with the recommended \ntapping sequence \nThread cutting operations are performed applying \nknowledge on safety procedures and using personal \nprotective devices.\n\n--- PDF PAGE 58 ---\nmachiii \n04/11/06 \n57\n \n \n5. \nOff-hand grind \ncutting tools \n5.1 \n5.2 \n5.3 \n5.4 \nCut edges are honed and free of burrs. \nCutter is sharpened to conform with specifications. \nCutters are ground using appropriate cooling agents.  \nCutting tool grinding is performed applying knowledge \non safety procedures and using personal protective \ndevices.\n\n--- PDF PAGE 59 ---\nmachiii \n04/11/06 \n58\n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Materials \nMaterials used in benchwork operations include \n1.1 Ferrous \n1.2\nNon Ferrous\n2. Bench work tools and  \nEquipment \nEquipment and tools may include \n2.1   Drill Press \n2.2   Pedestal Grinder \n2.3   Surface plate \n2.4   Layout and marking tools \n2.5   Cutting tools (hacksaw, chisel, files) \n2.6   Drills, reamers, laps \n2.7   Thread cutting tools (taps and stock and die) \n2.8   Inspection and measuring tools (templates, vernier \ncaliper, micrometer, straight edge, gages, etc…)\n3. Workholding Devices \nWorkholding devices include the use of \n3.1   Clamps \n3.2   Vises\n4. Bench work operations \nBench work operations \n4.1   Layout and marking \n4.2   Cutting \n4.3   Chipping \n4.4   Filing  \n4.5   Drilling, boring, counterboring, spot-facing \n4.6   Lapping \n4.7   Reaming \n4.8   Thread cutting \n4.9   Off-hand grinding\n\n--- PDF PAGE 60 ---\nmachiii \n04/11/06 \n59\n \nEVIDENCE GUIDE \n1. \nCritical aspects \nof competency  \nAssessment requires evidence that the candidate:   \n1.1 \nLaid-out and marked dimensions/features on the \nworkpiece \n1.2 \nCut, chipped and filed workpiece. \n1.3 \nDrilled, reamed and lapped holes. \n1.4 \nCut threads \n1.5 \nPerformed off-hand grinding \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1   Shop safety practices \n2.1.1   Safe working habits \n2.1.2   Identification of hazardous areas \n2.1.3   Protective clothing and devices \n2.1.4   Safe handling of tools, equipment and materials \n2.1.5   Housekeeping \n2.1.6   First-aid \n2.1.7   Fire extinguishers \n \n2.2   Drawing/Plans \n2.2.1   Standard drawing symbols \n2.2.2   Orthographic and isometric drawings \n \n2.3   Shop mathematics \n2.3.1   Basic arithmetic operations \n2.3.2   Fractions and decimals \n2.3.3   Percentages and ratios \n2.3.4   Conversion of units (English to metric) \n2.3.5   Trigonometric functions \n2.3.6   Computation of feed, cutting speed and machine \nrpm \n \n2.4   Measurements \n2.4.1   Linear measuring tools (rules, vernier, micrometer, \nheight gage) \n2.4.2   Geometrical tolerances \n \n2.5   Materials and related science \n2.5.1   Classification and mechanical properties of \nengineering materials \n \n2.6   Bench work  \nTheory, use and care of hand tools for: \n2.6.1   Layout and marking tools \n2.6.2   Sawing, chipping, filing, lapping \n2.6.3   Drilling, reaming, tapping \n2.6.4   External threading  \n2.6.5   Off-hand grinding\n\n--- PDF PAGE 61 ---\nmachiii \n04/11/06 \n60\n \n3. \nUnderpinning \nskills \n3.1   Using bench work tools and equipment \n3.2   Using measuring instruments  \n3.3   Operating drill press and grinders \n4. \nResource \nimplications \nThe following resources MUST be provided: \n4.1   Tools, equipment and facilities appropriate to processes or \n        activity \n4.2   Materials relevant to the proposed activity \n4.3   Drawings, sketches or blueprint \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1   direct observation of bench work activities \n5.2   written or oral short answer questions \n5.3   practical exercises \n5.4   project work \n5.5   identify colleagues/clients who can be approached for the \ncollection of competency evidence, where appropriate \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
