          "source_text": "1. \nDetermine job \nrequirements \n1.1 \n \n1.2 \n \n1.3 \n \nDrawings are interpreted to produce component to \nspecifications. \nSequence of operation is determined to produce \ncomponent to specifications. \nCutting tools are selected according to the \nrequirements of the operation. \n2. \nSetup workpiece \n2.1 \n \n \n2.2 \n \n \nWorkpiece is  mounted and centered in chuck to \nrequired level of accuracy using \ninstruments/equipment in accordance with \nworksite procedures. \nSetup operations are performed applying \nknowledge on safety procedures and using \npersonal protective devices. \n3. \nPerform turning \noperations \n3.1 \n \n3.2 \n \n3.2 \n \n3.4 \n \nSpeeds and feeds are calculated using appropriate \nmathematical techniques and reference material. \nLathe accessories used are appropriate to the \nrequirements of the operation. \nLathe operations are performed to produce \ncomponent to specifications in the drawing. \nOperations are performed applying knowledge on \nsafety procedures and using personal \nprotective devices. \n4. \nCheck/Measure \nworkpiece \n4.1 \n \n \nWorkpiece is checked/measured for conformance \nto specification using appropriate techniques, \nmeasuring tools and equipment.\n\n--- PDF PAGE 75 ---\nmachiii \n04/11/06 \n74\n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1.   Drawings \n1.1   Views and projections \n1.2   Drawing symbols \n1.3   Dimensions and features \n1.4   Tolerances and fits\n2.   Cutting Tools \nCutting tools used in lathe operations include: \n2.1   Cutting tools \n2.1.1   High speed steel  \n2.1.2   Inserts  \n2.2   Drills\n3.   Workpiece \nWorkpiece materials used in turning operations \n3.1 Ferrous \n3.2   Non-ferrous\n4.   Setup  \nSetup instrument/tools include \n4.1 Surface gage \n4.2\nDial indicator  on magnetic stand\n5.   Lathe Accessories \n5.1  3- and 4-jaw chucks \n5.2  lathe centers \n5.3  face plates \n5.4  drill chucks \n5.5  lathe dogs and counterweights \n5.6  boring bar \n5.7\nsteady rest\n6.   Lathe Operations \nMachining operations \n6.1   turning diameters using steady rest  \n6.2   turning eccentric diameters \n6.3 turn internal shapes and surfaces (cylinders, \nchamfers, grooves and radii) \n6.4 turn internal tapers \n6.5 drilling and boring \n6.6   cutting internal square, ACME and multi-start threads \n6.7   boring holes on stationary workpiece \n6.8   parting-off\n7.   Safety Procedures \nShop safety involves the handling of \n7.1   Equipment \n7.2   Tools \n7.3 Materials\n8 Personal Protective \nDevices \nPPE include \n8.1   Safety shoes \n8.2 Face shield/safety goggles\n9 Measuring Tools \n9.1    steel rule \n9.2    vernier caliper \n9.3    micrometer caliper \n9.4    vernier height gage  \n9.5 gages (thread, drill, depth, surface finish, radius, \nscrew pitch, slip or block, taper)\n\n--- PDF PAGE 76 ---\nmachiii \n04/11/06 \n75"
        },
        "evidence_guide": {
          "source_text": "1. \nCritical aspects \nof competency  \nAssessment requires evidence that the candidate:   \n1.1 determined job requirements \n1.2 setup the workpiece . \n1.3 performed turning operations \n1.4 checked/measured the workpiece \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1  Shop safety practices \n2.1.1  Safe working habits \n2.1.2   Identification of hazardous areas \n  2.1.3   Protective clothing and devices \n  2.1.4   Safe handling of tools, equipment and materials \n  2.1.5   Housekeeping \n2.1.6    First-aid \n2.1.7   Fire extinguishers \n \n2.2 Drawing interpretation \n2.2.1   Standard drawing scales, symbols and abbreviations \n2.2.2   Orthographic and isometric drawings \n2.2.3   1st and 3rd angle projections \n2.2.4   Assembly and detail drawings \n2.2.5   Interpreting tolerances, limits and fits \n \n2.3    Shop mathematics \n2.3.1   Basic arithmetic operations \n2.3.2   Fractions and decimals \n2.3.3   Percentages and ratios \n2.3.4   Conversion of units (English to metric) \n2.3.5   Applying trigonometric functions \n \n2.4   Measurements \n2.4.1   Linear measuring tools (rules, vernier, micrometer) \n2.4.2   Angle measuring tools \n2.4.3   Geometrical tolerances \n2.4.5   Dial indicator \n2.4.6   Slip gages \n2.4.7   Precision levels \n \n2.5   Materials and related science \n2.5.1   Classification and mechanical properties of \nengineering materials\n\n--- PDF PAGE 77 ---\nmachiii \n04/11/06 \n76\n \n \n2.6   Lathe machine operations  \n2.6.1   Lathe types and specifications \n2.6.2   Lathe parts and functions \n2.6.3   Setting cutting speed, rpm, feed rate \n2.6.4   Workholding and tool holding devices  \n2.6.5   Turning tools and tool geometry \n2.6.6   Tooling, set up and parameters in turning operations \n2.6.7   Lathe accessories, fixtures and attachments \n3. \nUnderpinning \nskills \n3.1   Selecting and sharpening cutting tools \n3.2   Using measuring instruments \n3.3   Verifying workpiece specifications \n3.4   Computation of feed, cutting speed and machine rpm  \n4. \nResource \nimplications \nThe following resources MUST be provided \n4.1   Tools, equipment and facilities appropriate to processes or \nactivities \n4.2   Materials relevant to the proposed activity \n4.3   Drawings, sketches or blueprint \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1   direct observation of lathe setting activities \n5.2   written or oral short answer questions \n5.3   practical exercises \n5.4   identify colleagues/clients who can be approached for the \ncollection of competency evidence, where appropriate \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n\n--- PDF PAGE 78 ---\nmachiii \n04/11/06 \n77\nUNIT OF COMPETNCY:    Mill Workpiece (Basic) \n \nUNIT CODE:    \nMEE722303 \n \nUNIT DESCRIPTOR:   This unit covers the skills required to setup and mill workpiece to \ndrawing specifications . It details the requirements for \nperforming milling operations such as drilling, boring, reaming \nand spot facing holes; milling blocks, shoulder, parallel and \nangled faces; milling slots, keys, serrations; and milling castings \nand circular slots and external radius.  \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nDetermine job \nrequirements \n1.1 \n \n1.2 \n \n1.3 \n \nDrawings are interpreted to produce component to \nspecifications. \nSequence of operation is determined to produce \ncomponent to specifications. \nCutting tools are selected according to the \nrequirements of the operation. \n2. \nSetup workpiece \n2.1 \n \n \n2.2 \n \nWorkpiece  is setup to required level of accuracy \nusing instruments/equipment according to work \nsite procedures. \nSetup operations are performed applying \nknowledge on safety procedures and using \npersonal protective devices. \n3. \nPerform milling  \noperations \n3.1 \n \n3.2 \n \n3.3 \n \n3.4 \n \nSpeeds and feeds are set to requirements of the \njob. \nMilling machine accessories used are \nappropriate to the requirements of the operation. \nMilling operations are performed to produce \ncomponent to specifications in the drawing. \nMilling operations are performed applying \nknowledge on safety procedures and using \npersonal protective devices. \n4. \nCheck/Measure \nworkpiece \n4.1 \n \n \nWorkpiece is checked/measured for conformance \nto specification using appropriate techniques, \nmeasuring tools and equipment.\n\n--- PDF PAGE 79 ---\nmachiii \n04/11/06 \n78\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.   Cutting Tools \nCutting tools used in milling operations include: \n1.1 Drills \n1.2 Reamers \n1.3 Slab mills \n1.4 End mills \n1.5 Shell mills \n1.6 Side and face cutters \n1.7 Formed cutter \n1.8 Slitter \n1.9 T-slot cutter \n2.   Workpiece \nWorkpiece materials used in milling operations \n2.1 Ferrous \n2.2   Non-ferrous \n3.   Milling machine \naccessories \n3.1 Workholding devices \n3.1.1 clamps \n3.1.2 vises \n3.1.3 angle plates \n3.2 Rotary tables \n4.   Milling Operations \nBasic milling operations \n4.1 drilling \n4.2 boring \n4.3 spot facing \n4.4 milling slot and keyways \n4.5 milling serrations \n4.6 milling vees \n4.7 parting-off \n4.8 milling circular slots \n5.   Safety Procedures \nShop safety involves the handling of \n5.1 Equipment \n5.2 Tools \n5.3 Materials \n5  Measuring Tools \n6.1 Steel rule \n6.2 Vernier caliper \n6.3 Micrometer caliper \n6.4 Gages (bore, surface finish, radius, depth)\n\n--- PDF PAGE 80 ---\nmachiii \n04/11/06 \n79\nEVIDENCE GUIDE \n1. \nCritical aspects \nof competency  \nAssessment requires evidence that the candidate:   \n1.1 determined job requirements \n1.2 setup the workpiece . \n1.3 performed turning operations \n1.4 checked/measured the workpiece \n2. \nUnderpinning \nknowledge \n2.1   Shop safety practices \n2.1.1   Safe working habits \n2.1.2   Identification of hazardous areas \n2.1.3   Protective clothing and devices \n2.1.4   Safe handling of tools, equipment and materials \n2.1.5   Housekeeping \n2.1.6   First-aid \n2.1.7   Fire extinguishers \n \n2.2   Drawing interpretation \n2.2.1   Alphabet of lines \n2.2.2   Drawing symbols \n2.2.3   Projections and views \n2.2.4   Fits and tolerances \n2.2.5   Surface texture \n2.2.6   Sketches and mechanical drawing \n \n2.3   Shop mathematics \n2.3.1   Basic arithmetic operations \n2.3.2   Fractions and decimals \n2.3.3   Percentages and ratios \n2.3.4   Conversion of units (English to metric) \n2.3.5   Applying trigonometric functions \n \n2.4   Measurements \n2.4.1   Linear measuring tools (rules, vernier, micrometer) \n2.4.2   Dial indicator \n2.4.3   Precision square \n2.4.4   Bevel protractor \n2.4.5   Vernier height gage \n \n2.5   Materials and related science \n2.5.1   Classification and mechanical properties of \nengineering materials \n2.5.2   Lubricants and coolants \n \n2.6   Milling operations  \n2.6.1   Milling types and specifications \n2.6.2   Milling machine parts and functions \n2.6.3   Milling cutters and holders \n2.6.4   Setting cutting speed, rpm, feed rate \n2.6.5   Workholding devices  \n2.6.6 Milling machine accessories, fixtures and attachments\n\n--- PDF PAGE 81 ---\nmachiii \n04/11/06 \n80\n \n \n3. \nUnderpinning \nskills \n3.1   Selecting and setting cutting tools \n3.2   Using measuring instruments \n3.3   Verifying workpiece specifications \n3.4   Computation of feed, cutting speed and machine rpm \n4. \nResource \nimplications \nThe following resources MUST be provided \n4.1   Tools, equipment and facilities appropriate to processes or \nactivities \n4.2   Materials relevant to the proposed activity \n4.3   Drawings, sketches or blueprint \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1   direct observation of milling activities \n5.2   written or oral short answer questions \n5.3   practical exercises \n5.4   identify colleagues/clients who can be approached for the \ncollection of competency evidence, where appropriate \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.",
