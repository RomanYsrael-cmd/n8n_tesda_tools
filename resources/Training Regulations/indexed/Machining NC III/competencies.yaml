        "source_text": "--- PDF PAGE 48 ---\nmachiii \n04/11/06 \n47\n \nUNIT OF COMPETENCY:   PERFORM SHOP COMPUTATIONS (ADVANCED) \n \nUNIT CODE:   MEE722209 \n \nUNIT DESCRIPTOR:   This unit covers the competencies required to perform \ncalculation involving gear ratio, indexing problems and \ngearing problems. \n \n \n    ELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nCalculate gear ratio \n1.1 \nGear ratio calculated using appropriate formula \n2. \nSolve indexing problems \n2.1 \n \n \nIndexing problems involving number of turns, \nspaces and circle plate are solved using \nappropriate formula  \n3. \nSolve gearing problems \n3.1 \nGearing problems are solved using appropriate \nformula \n4. \nUse geometrical \nprinciples in the solution \nof problems \n4.1 \nSolution to problems is obtained by applying \ngeometrical properties of angles, triangles and \ncircles in the calculation.\n\n--- PDF PAGE 49 ---\nmachiii \n04/11/06 \n48\n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1.   gear ratio \n1.1 addendum  \n1.2 clearance  \n1.3 dedendum \n1.4 diametral pitch \n1.5 module \n1.6 outside diameter \n1.7 pitch diameter \n1.8 root diameter \n1.9 number of teeth \n        etc. \n2.    indexing \n2.1 direct indexing \n2.2 simple indexing \n2.3 compound indexing  \n2.4 differential indexing\n\n--- PDF PAGE 50 ---\nmachiii \n04/11/06 \n49\nEVIDENCE GUIDE \n \n1. \nCritical aspects of \ncompetency  \nAssessment requires evidence that the candidate performed \ncalculations:   \n1.1 involving gear ratio \n1.2 involving indexing problems \n1.3 involving gearing problems \n1.4 involving geometrical properties of angles, triangles and \ncircles\n2. \nUnderpinning \nknowledge and \nattitude  \n2.1  English and metric system of measurements \n2.2    Geometrical shapes \n2.3    Gear types  \n3. \nUnderpinning skills \n3.1   Performing calculations using pen and paper or on a \ncalculator \n3.2     Reading and interpreting working drawings  \n4. \nResource \nimplications \nThe following resources MUST be provided: \n4.1 \nTools, equipment and facilities appropriate to \nprocesses or activity \n4.2 \nMaterials relevant to the proposed activity \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1    written or oral short answer questions \n5.2    practical exercises \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in \nsimulated workplace environment.\n",
