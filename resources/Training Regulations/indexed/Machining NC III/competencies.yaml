        "source_title": "LEAD SMALL TEAMS",
        "source_text": "--- PDF PAGE 8 ---\nmachiii \n04/11/06 \n7\n \nUNIT OF COMPETENCY \n:    LEAD SMALL TEAMS \n \nUNIT CODE \n        :    500311110 \n \nUNIT DESCRIPTOR \n   :   This unit covers the knowledge, skills and attitudes to \nlead small teams including setting and maintaining team \nand individual performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Provide team \nleadership \n1.1. \nWork requirements are identified and presented to \nteam members \n1.2. \nReasons for instructions and requirements are \ncommunicated to team members \n1.3. \nTeam members’ queries and concerns are \nrecognized, discussed and dealt with \n2. Assign responsibilities \n2.1. \nDuties,  and responsibilities are allocated having \nregard to the skills, knowledge and aptitude required to \nproperly undertake the assigned  task and according \nto company policy \n2.2. \nDuties are allocated having regard to individual \npreference, domestic and personal considerations, \nwhenever possible \n3. Set performance \nexpectations for team \nmembers \n3.1. \nPerformance expectations are established based on \nclient needs and according to assignment \nrequirements \n3.2. \nPerformance expectations are based on individual \nteam members duties and area of responsibility \n3.3. \nPerformance expectations are discussed and \ndisseminated to individual team members \n4. Supervised team \nperformance \n4.1. \nMonitoring of performance takes place against \ndefined performance criteria and/or assignment \ninstructions and corrective action taken if required \n4.2. \nTeam members are provided with feedback, positive \nsupport and advice on strategies to overcome any \ndeficiencies \n4.3. \nPerformance issues which cannot be rectified or \naddressed within the team are referenced to \nappropriate personnel according to employer policy \n4.4. \nTeam members are kept informed of any changes in \nthe priority allocated to assignments or tasks which \nmight impact on client/customer needs and satisfaction\n4.5. \nTeam operations are monitored to ensure that \nemployer/client needs and requirements are met \n4.6. \nFollow-up communication is provided on all issues \naffecting the team \n4.7. \nAll relevant documentation is completed in accordance \nwith company procedures\n\n--- PDF PAGE 9 ---\nmachiii \n04/11/06 \n8\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Work requirements \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s concerns \n2.1. Roster/shift details \n3. Monitor performance \n3.1. Formal process \n3.2. Informal process \n4. Feedback \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service\n\n--- PDF PAGE 10 ---\nmachiii \n04/11/06 \n9\nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to \nnext level of management or appropriate specialist \nand to negotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to  \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5. Set and communicated performance expectations for \na range of tasks and duties within the team and \nprovided feedback to team members\n2. Underpinning \nKnowledge \n2.1. Company policies and procedures \n2.2. Relevant legal requirements \n2.3. How performance expectations are set \n2.4. Methods of Monitoring Performance \n2.5. Client expectations \n2.6.\nTeam member’s duties and responsibilities\n3. Underpinning \nSkills \n3.1. Communication skills required for leading teams \n3.2. Informal performance counseling skills \n3.3. Team building skills \n3.4.\nNegotiating skills\n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n4.2.\nMaterials relevant to the proposed activity or task\n5. Method of \nAssessment \nCompetency may be assessed through: \n5.1. Direct observations of work activities of the individual \nmember in relation to the work activities of the group \n5.2. Observation of simulation and/or role play involving \nthe participation of individual member to the \nattainment of organizational goal \n5.3. Case studies and scenarios as a basis for discussion \nof issues and strategies in teamwork\n6. Context for \nAssessment \n6.1. Competency assessment may occur in workplace or \nany appropriately simulated environment \n6.2. Assessment shall be observed while task are being \nundertaken whether individually or in-group\n",
