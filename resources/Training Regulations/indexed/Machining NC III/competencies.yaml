        "source_title": "PERFORM PREVENTIVE AND CORRECTIVE MAINTENANCE",
        "source_text": "--- PDF PAGE 54 ---\nmachiii \n04/11/06 \n53\n \nUNIT OF COMPETENCY \nPERFORM PREVENTIVE AND CORRECTIVE \nMAINTENANCE \n \nUNIT CODE:   MEE722211 \n \nUNIT DESCRIPTOR:  \nThis unit covers the knowledge and skills required in \nperforming preventive and corrective maintenance \nsuch as inspection and repair of hand tools, cleaning \nand lubrication of machine parts and changing drive \npulley and belts. \n \n \n \n    ELEMENTS \n                    PERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nPerform inspection of \nmachine \n \n1.1 \n \n1.2 \nMachine inspected according to worksite \nprocedures. \nStatus/Report recorded on proforma or reported \norally according to worksite procedure. \n \n2. \nPerform cleaning and \nlubricating of machine \n \n2.1 \n \n \n2.2 \n \nMachines lubricated as per manufacturer’s \nrecommendation using appropriate tools and \nmaterials \nFluids and lubricants replaced and/or topped up \naccording to prescribed schedule.  \n3. \nPerform minor machine \nrepair and adjustments \n \n3.1 \n \n3.2 \n \nMinor machine repairs performed according to \nmanufacturer’s instruction or worksite procedures. \nMachine moving parts adjusted to manufacturer’s \nspecifications. \n4. \nMaintain hand tools \n4.1 \n4.2 \nTool cutting ground to recommended specifications \nHand tools lubricated and stored according to \nprescribed procedure \n.\n\n--- PDF PAGE 55 ---\nmachiii \n04/11/06 \n54\n \n \nRANGE OF VARIABLES \nVARIABLES\nRANGE\n1.  Inspected  \nInspected machine parts include: \n1.1 V-belt \n1.2 Bearing \n1.3 Gears \n1.4 Clutch  \n1.5 Drive pulley \n2.  Machines \nMachine include but not limited to: \n2.1  Lathe machine \n2.2  Milling machine \n2.3  Grinding machine \n2. Tools and materials \nTools and materials used include: \n3.1   Lubricants \n3.2   Oil can \n3.3   Grease gun \n3.4   Oil \n3.5   Coolant or compound\n\n--- PDF PAGE 56 ---\nmachiii \n04/11/06 \n55\nEVIDENCE GUIDE \n \n1.  Critical aspects of \n     competency \nAssessment requires evidence that that the candidate: \n1.1 Performed inspection of machine \n1.2 Performed cleaning and lubricating of machine \n1.3 Performed minor machine repairs and \nadjustments \n2.  Underpinning knowledge \n2.1  Proper cleaning and oiling \n2.2  Kinds of oil \n2.3  Parts and function of machine tools \n2.4  Cutting oil, coolant or compound \n2.5  Pulleys and belts \n2.6  Location of main switches of the machine \n2.7  Handling and storage of tools \n2.8  Checklist of safe working conditions \n2.9 Procedures in cleaning and disposal of waste \nmaterials \n3. Underpinning skills \n3.1   Inspecting and repairing hand tools \n3.2   Inspecting and changing drive pulleys and belts \n3.3   Replacing and adjusting machine parts \n3.4   Distinguishing old and new coolant \n3.5   Distinguishing odor of polluted coolant \n3.6   Selecting coolant, cutting oil or compounds \n3.7   Changing coolant \n3.8   Inspecting work area for safe working \nenvironment \n3.9   Cleaning work area \n3.10 Disposing metal scraps, chips and waste \n        materials. \n4. Resource Implications \nThe following resources MUST be provided: \n4.1  Tools, equipment and facilities appropriate to \n       processes  or activity \n4.2   Materials relevant to the proposed activity \n5. Method of Assessment \nCompetency may be assessed through: \n5.1   direct observation of activities \n5.2   oral or written questioning \n6. Context for Assessment \nCompetency may be assessed in the workplace or in \nsimulated workplace environment.\n",
