mpetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 48 ---\nmachiii\n04/11/06\n47\n\nUNIT OF COMPETENCY: PERFORM SHOP COMPUTATIONS (ADVANCED)\n\nUNIT CODE:"
