n curriculum developed from the competency standards;\n\n Learning is modular in its structure;\n\n Training delivery is individualized and self-paced;\n\n Training is based on work that must be performed;\n\n Training materials are directly related to the competency standards and curriculum\nmodules;\n\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n\n Training is based both on and off-the –job component;\n\n Allows for the recognition of prior learning ( RPL ) or current competencies;\n\n Training allows for multiple entry and exit ; and\n\n Approved training programs are nationally accredited.\n\n The competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the–job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in school and in-industry training of fieldwork\ncomponents. Details can be referred to the Dual Training System ( DTS )\nImplementing Rules and Regulations\n\n Modular / self-paced learning is a competency- based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n\n Peer teaching / mentoring is training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n Supervised industry training or on-the-hob training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n--- PDF PAGE 106 ---\nmachiii\n04/11/06\n105\n Distance learning is formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also stated.\nPassing entry written examinations may also be indicated if necessary.\n\n•\nMust be holder of Machining NCII\n•\nMust be high school graduate\n•\nWith good moral character\n•\nAbility to communicate\n•\nPhysically and mentally fit\n\n--- PDF PAGE 107 ---\nmachiii\n04/11/06\n106\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n MACHINING NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Machining NC III\n\n TOOLS\nQTY\nQTY\nQTY\n\n Drawing Instruments:\n5 pcs.\n• Drawing table\n5 pcs.\n• Protractor\n5 pcs\n• Compass\n5 pcs.\n• 30 x 60 degrees triangle\n5 pcs\n• Ruler\n2set\n• Drawing pencil\n5 pcs.\n• 45 degrees triangle\n5 pcs.\n• Scale Ruler 12 “\n\n Layout Tools:\n 1 pc. • Surface Plate\n 500x500 mm\n5 pcs.\n• Divider\n 5 pcs.\n• Steel square 6 “\n 2 sets\n• Center punch\n2 sets\n• Combination set\n2 pcs\n• V-block 50x75 mm\n2 sets\n• Prick punch\n2 units\n• Vernier Height\ngauge 12 “\n10 pcs\n• Ball peen hammer\n12 ounce\n2 sets\n• Scriber\n5 pcs.\n• Soft hammer\n\n Measuring Tools:\n10 pcs\n• Vernier caliper 150mm\n5 pcs.\n• Micrometer Caliper\n0-25\n3 Sets\n• Dial Indicator Plunger\ntype\nwith magnetic stand\n5 pcs.\n• Vernier caliper 200mm\n3 pcs.\n• Micrometer\nCaliper 25-50\n2 pcs\n• Drill gauge\n2 pcs.\n• Vernier caliper 150mm\n2 pcs.\n• Micrometer Caliper\n50-75\n2 pcs.\n• Screw pitch gauge\n2 pcs.\n• Drill gauge\n1 pc.\n• Bore gauge\n\n--- PDF PAGE 108 ---\nmachiii\n04/11/06\n107\n\n Bench Tools:\n10 pcs\n• Hack saw frame\n10 pcs\n• Bench vice\n6 pcs\n• Oil can\n3 pcs\n• Anvil\n10 pcs\n• Flat file\n10 pcs\n• Square file\n10 pcs\n• Round file\n10 pcs\n• Triangular file\n10 pcs\n• Half round file\n 2 sets\n• Needle file\