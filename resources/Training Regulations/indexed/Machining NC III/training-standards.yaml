    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: MACHINING NC Level: NC III\n\nNominal Training Duration: 342 Hours\n\nCourse Description:\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nof Machinist NC III.\n It covers the competencies required to Turn Workpiece ( Advanced ) and Mill\nWorkpiece ( Advanced ).\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Lead\nworkplace\ncommunication\n\n2. Lead small\nteams\n\n1.1 Communicate\n information about\n workplace processes\n1.2 Lead workplace\n discussions\n Identify and\n communicate issues\n arising in the\n workplace\n\n2.1 Provide team\nleadership\n2.2 Assign responsibilities\n2.3 Set performance\nexpectations for team\nmembers\n2.4 Supervised team\nperformance\n\n• Group\ndiscussion\n• Interaction\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n--- PDF PAGE 99 ---\nmachiii\n04/11/06\n98\n\n3. Develop and\npractice\nnegotiation\nskills\n\n4. Solve\nproblems\nrelated to work\nactivities\n\n5. Use\nmathematical\nconcepts and\ntechniques\n\n6. Use relevant\ntechnologies\n\n3.1 Plan negotiations\n3.2 Participate in\n negotiations\n\n4.1 Identify the problem\n4.2 Determine\n fundamental causes\n of the problem\n4.3 Determine corrective\n action\n4.4 Provide\n recommendation/s to\n manager\n\n5.1 Identify mathematical\n tools and techniques\n to solve problem\n5.2 Apply procedure /\n solution\n5.3 Analyze results\n\n6.1 Study / select\nappropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain / enhance\nrelevant technology\n\n• Group\ndiscussion\n• Interaction\n\n• Group\ndiscussion\n• Interaction\n\n• Group\ndiscussion\n• Interaction\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n• Demonstration\n• Observation\n• Interviews/\n Questioning\n\n• Demonstration\n• Observation\n• Interviews/\n questioning\n\n--- PDF PAGE 100 ---\nmachiii\n04/11/06\n99\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply safety\n practices\n\n2. Interpret\nworking\ndrawing and\nsketches\n\n3. Select / cut\nworkshop\nmaterials\n\n4. Perform shop\ncomputations\n(Basic)\n\n1.1 Identify hazards\n1.2 Use protective clothing\nand devices\n1.3 Perform safe handling\nof tools, equipment\nand materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n\n2.1 Interpret technical\n drawing\n2.2 Prepare freehand\nsketch of parts\n2.3 Interpret details from\n freehand sketch\n\n3.1 Determine requirement\n3.2 Select and measure\n materials\n3.3 Cut materials\n\n4.1 Perform four\nfundamentals\n operations\n4.2 Perform basic\ncalculations\n involving fractions and\n decimals\n4.3 Perform basic\ncalculations\n involving percentages\n4.4 Perform basic\ncalculation\n involving ration and\n proportion\n4.5 Perform calculations on\nalgebraic\n expressions\n\n• Lecture\n• Group\n discussion\n• Interaction\n• Role playing /\n Simulation\n\n• Lecture\n• Group\n discussion\n• Interaction\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Observation\n• Demonstration\n• Interview /\n Questioning\n\n• Observation\n• Interview /\n Questioning\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 101 ---\nmachiii\n04/11/06\n100\n\n5. Measure\n workpiece\n (Basic)\n\n6. Perform\nroutine\nhousekeeping\n\n7. Perform Shop\ncomputations\n(Intermediate)\n\n8. Measure\nworkpiece\nusing angular\nmeasuring\ninstruments\n\n9. Perform shop\n Computation\n (Advanced)\n\n5.1 Select and use\nmeasuring tools\n5.2 Clean and store\nmeasuring tools\n\n6.1 Organize work area\n6.2 Clean Work area\n\n7.1 Perform calculations\n involving triangles\n7.2 Calculate taper\n\n8.1 Select and use angular\n measuring tools\n8.2 Maintain angular\nmeasuring\n tools\n8.3 Clean and store\nmeasuring\n tools\n\n9.1 Calculate gear ratio\n9.2 Solve indexing\nproblems\n9.3 Solve gearing\nproblems\n9.4 Use geometrical\nprinciples in the\nsolution of problems\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Lecture\n• Group\n discussion\n• Simulation\n• Practical\n exercise\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 102 ---\nmachiii\n04/11/06\n101\n\n10. Measure\nworkpiece\n using gages\n and\n surface\n texture\n comparator\n\n11. Perform\npreventive\n and\n corrective\n maintenance\n\n10.1 Select and use fixed\nand adjustable gages\n10.2 Perform surface\ntexture measurements\n10.3 Clean and store\nmeasuring tools\n\n11.1 Perform inspection of\n machine\n11.2 Perform cleaning and\n lubricating of machine\n11.3 Perform minor\n machine repair and\n adjustments\n11.4 Maintain hand tools\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n\n• Lecture\n• Demonstration\n• Group\n discussion\n• Practical\n exercise\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n\n--- PDF PAGE 103 ---\nmachiii\n04/11/06\n102\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment Approach\n\n1.\nTurn workpiece\n\n2.\nMill Workpiece\n\n1.1 Determine job\nrequirements:\n• Determine causes and\n effect of vibration on\n machining\n• Explain the use of\n counter weights\n\n1.2 Setup Workpiece\n ( per operation )\n\n1.3 Perform turning\n operations:\n•\nTurn diameters using\n steady rest\n•\nTurn eccentric\n diameters\n•\nPerform drilling and\nboring\n Drill deep holes\n Bore both ends of shaft\n for bearing\n• Cut internal square,\n acme and multi – start\n threads\n• Bore hole on stationary\n workpiece\n• Part – off workpiece\n\n1.4 Check / Measure work\n piece\n• Perform procedure and\n techniques in measuring\n work piece\n\n2.1 Determine job\n requirements:\n• Compute lead of\n workpiece\n• Identify gear cutters and\n other form cutters\n• Solve differential\n indexing problems\n\n2.2 Setup Workpiece\n ( per operation )\n\n• Demonstration\n• Discussion\n\n• Demonstration\n\n• Discussion\n\n• Direct Observation\n\n• Written or oral\n\n• Demonstration\n\n• Direct Observation\n\n• Written / Oral\n\n• Demonstration\n\n--- PDF PAGE 104 ---\nmachiii\n04/11/06\n103\n\n2.3 Perform milling\n operations:\n• Mill helical gear\n• Mill bevel gear\n• Mill ratchet using\n differential indexing\n• Perform spiral milling\n\n2.4 Check / Measure work\n piece\n• Perform procedure and\n techniques in measuring\n work piece\n\n--- PDF PAGE 105 ---\nmachiii\n04/11/06\n104"
