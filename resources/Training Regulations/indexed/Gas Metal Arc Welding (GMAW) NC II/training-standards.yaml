    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for GAS METAL ARC WELDING\n(GMAW).\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainers qualification,\namong others.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: GAS METAL ARC WELDING\n\nNC Level II\n\nSuggested Nominal Training Hours: 18 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n194 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof trainees in Gas Metal Arc Welding in accordance with industry standards. It\ncovers core competencies such as Welding Carbon Steel Plates Using GMAW,\nWelding Carbon Steel Plates and Pipes Using GMAW.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a\nteam member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth & development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 49 ---\nWeldncii11-3\n\n47\n4. Practice\noccupational\nhealth and\nsafety\n8.1 Evaluate hazard and\nrisks\n8.2 Control hazards and\nrisks\n8.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nwork safely\n1.1Identify hazardous areas\nand conditions\n1.2 Use protective clothing and\ndevices\n1.3 Perform safe handling of\ntools, equipment and\nmaterials\n1.4 Explain/perform first aid\nprocedure\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• demonstration\n2. Contribute\nto quality\nsystem\n2.1 Inspect work done\n2.2 Apply quality standards to\nwork\n2.3 Protect company/\ninstitution properties\n2.4 Protect customer interest\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n3. Use hand\ntools\n3.1 Use different handtools\n3.2 Maintain handtools\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n•Demonstration\n4. Interpret\nBlueprints\n4.1 Interpret technical drawing.\n4.2 Interpret welding symbols\n\n• Lecturette\n\n• Practical\napplication\n• Oral\nquestioning\n• Written test\n\n5. Perform\n Com\nindustry\ncalculations\n5.1 Solve mathematical\nproblems\n5.2 Convert systems of\nmeasurement\n5.3 Measure workpiece\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n\n• Written test\n\n--- PDF PAGE 50 ---\nWeldncii11-3\n\n48\n6. Prepare\nWeld\nMaterials\n6.1 Identify the different cutting\nequipment and accessories\n6.2 Identify types of mild steel\nelectrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective equipment\n6.5 Prepare welding\nconsumables, tools and\naccessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n• Lecturette\n• Practical\napplication\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up\nWelding\nEquipment\n2.1 Explain welding principles\nand concepts.\n3.1 Identify the parts of welding\nmachine\n4.1 Set up welding machine and\naccessories\n5.1 Set up welding positioners,\njigs and fixtures\n6.1 Set up pre-heating\nequipment (as required)\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\nbacking plate and stiffener.\n8.2 Explain the methods of\nstriking an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen,\nbacking plate and stiffener.\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9.\nRepair\n Welds\n9.1 Identify causes and\nprevention of the different\nweld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and equipment\n9.4 Remove defects\n9.5 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nWeldncii11-3\n\n49\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld\nCarbon\nSteel Pipes\nUsing\nGMAW\n1.1 Weld plates in single pass\ngroove joints in overhead\npositions\n1.2 Weld pipe in 2G, 5G and 6G\npositions\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 52 ---\nWeldncii11-3\n\n50\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-\nbased TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 53 ---\nWeldncii11-3\n\n51\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into these course should possess\nthe following requirements:\n\n•\n completed training in GMAW NC I or a holder of GMAW NC I\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools and materials per trainee for GAS METAL ARC\nWELDING - NC II\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25\npcs.\nChipping\nHammer\n12\nunits\nGMAW/MIG\nWelding machine,\nMig gun and\naccessories\n5 reels\nFiller wire (solid)\n75\npcs.\nSteel brush\n12\npcs.\nWelding positioners\n38 pcs.\nMild steel plate\n10mm X 75mm X\n6m\n12\npcs.\nPlier/tongs\n12\nunits\nPortable disc grinder\n40 pcs.\nMild steel plate\n3.2mm X 75mm X\n6m\n20\npcs.\nFiles-bastard\ncut\n1 unit\nExhaust fan\n2 pcs.\n\nCarbon steel\npipe, dia. 150 X\n3m schedule 40\n25\npcs.\nWelding Mask\n2\nunits\nWork bench w/\nbench vice on 4\ncorners\n3 pcs.\nDark lens\n25\nsets\nLeather\napron/jacket\n2 sets\nOxy-acetylene/Oxy-\nLPG cutting outfit\n46 pcs.\nLens clear glass\n50\nsets\nLeather gloves,\nlong\n1 unit\nPedestal /bench\ngrinding machine\n38 pcs\nCutting disc 3/32”\nx 5/8” x 4” dia.\n5 pcs.\nSafety goggles,\nwide vision,\nclear\n1 unit Industrial fan\n\n19 pcs.\nGrinding disc 1/4”\nx 5/8” x 4” dia.\n5 pcs.\nOxy-acetylene\nGoggles\n\n5 cyl.\nCO2\n\n--- PDF PAGE 54 ---\nWeldncii11-3\n\n52\n12\npcs.\nTry square 300\nmm. long\n\n1 cyl.\noxygen\n12\npcs.\nSteel square\n300 mm. long\n\n1 cyl.\nLPG / Acetylene\n12\npcs.\nFiles-half round\n\n1 tube\nMetal marker\n5 pcs.\nFillet gauge\n1 pc.\nWire Cutter\n1 pc.\nHand Hacksaw\n\nNote: Tools and equipment for all welding process.\n* for GMAW process\n\n3.5 TRAINING FACILITIES\n\nGAS METAL ARC WELDING - NC II\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n5\n15\nGrinding Booth*\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area*\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area*\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n108\nCirculation Area**\n\n32\n\n--- PDF PAGE 55 ---\nWeldncii11-3\n\n53\nTotal Workshop Area\n\n140\n\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS FOR GMAW WELDER\n\nTRAINER QUALIFICATION (TQ II)\n\n• Must be a holder of GMAW Welder NC II\n• Must have undergone training on Training Methodology II (TM II)\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 56 ---\nWeldncii11-3\n\n54"
