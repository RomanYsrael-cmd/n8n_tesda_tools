g \nknowledge \n2.1   Fundamental operation (addition, subtraction, division, \nmultiplication) \n2.2   Measurement system \n2.3   Precision and accuracy \n2.4\nBasic measuring tools/devices\n3.  Underpinning skills \n3.1 \nApplying mathematical computations \n3.2 \nUsing calculator \n3.3\nUsing different measuring tools\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1   Calculator \n4.2   Basic measuring tools \n4.3\nCase Problems\n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nAuthenticated portfolio \n5.2 \nWritten Test \n5.3 \nInterview/Oral Questioning \n5.4\nDemonstration\n6.  Context of \nassessment\n6.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting\n",
