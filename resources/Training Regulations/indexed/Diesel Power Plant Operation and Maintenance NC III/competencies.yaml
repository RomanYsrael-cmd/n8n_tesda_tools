 ELECTRICAL WORKS\n\nUNIT CODE\n\n: UTL724201\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes in preparing\nmaterials, tools and equipment, testing electrical components and basic\nrepairing in electricity based on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Prepare electrical tools\nand test instruments\n\n1.1 Work plan is interpreted to determine job requirements\n1.2 Electrical tools and instruments are identified and\nprepared according to job requirements\n1.3 Electrical tools and instruments are checked for\nconditions and calibrated as required\n\n2. Test power supply and\nelectrical components\n\n2.1 Instruments are tested in accordance with PEC\n2.2 Power supply and electrical components are checked in\naccordance with manufacturer’s specifications/PEC\n2.3 Defects of power supply and electrical components are\nidentified and recorded\n2.4 Safe working habits is observed\n\n3. Perform basic electrical\nrepair\n\n3.1 Work instructions are followed to ensure safety work\n3.2 Loose connections are tightened in accordance with\nPEC\n3.3 Defective electrical components are replaced and tested\nin accordance with PEC\n3.4 Work place is cleaned and in safe state in line with\nOHSA regulations\n\n--- PDF PAGE 37 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Work plan\n\n1.1 Job requirements\n1.2 Schedule of work\n\n2. Materials\n\nMay include but not limited to:\n2.1 Solid, stranded wire\n2.2 Service plug/outlet\n2.3 Electrical components\n2.4 Soldering lead\n2.5 Terminal clips\n2.6 Terminal lugs\n2.7 Fuses\n2.8 PVC/Flexible non-metallic conduit\n2.9 Electrical tape\n\n3. Tools and equipment\n\nMay include but not limited to:\n3.1 Clamp ammeter\n3.2 Multi tester\n3.3 Insulation tester\n3.4 PPE\n3.5 Soldering gun/iron\n3.6 Wire stripper\n3.7 Measuring tool\n3.8 Markers\n3.9 Crimping tools\n3.10 Screw drivers\n3.11 Electrician pliers\n3.12 Electric drill\n3.13 Long nose\n\n4. Work instructions\nMay include but not limited to:\n4.1 Work plan\n4.2 Schematic diagrams\n4.3 Installation instruction\n\n--- PDF PAGE 38 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n34\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Interpreted work plan to determine job requirements\n1.2 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.3 Identified electrical tools and instruments are tested in\naccordance with PEC\n1.4 Replaced defective tools and instruments\n1.5 Checked power supply and electrical components in\naccordance with PEC\n1.6 Cleaned work place and left in safe state in line with OHSA\nregulations\n1.7 Completed wiring electrical system based in working\ndrawings and PEC\n1.8 Communicated effectively to ensure safety works\n2. Underpinning\nknowledge\n\n2.1 TRADE MATHEMATICS\n• Linear measurements\n• Dimensions\n• Unit conversion\n2.2 TRADE THEORY\n• Basic electricity\n2.3 SAFETY PRACTICES\n• PPE\n• Handling of tools and equipment\n•\nGood housekeeping\n3. Underpinning skills\n3.1 Installing and repairing electrical fixtures\n3.2 Communicating effectively\n3.3 Work safety\n3.4 Proper handling of materials, tools and equipment\n3.5 Preparing materials, tools and equipment\n3.6 Wiring components\n3.7 Testing power supply and electrical component\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Work place\n4.2 Work plan\n4.3 Materials, tools and equipment relevant to the proposed\nactivity/task\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Written test/questioning relevant to underpinning\nknowledge\n6. Context of\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 39 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n35\nCORE COMPETENCIES\n\nThis section gives the details of the contents of the core units of competency required in\nDIESEL POWER PLANT OPERATION AND MAINTENANCE NC III.\n\nUNIT OF COMPETENCY : TEND DIESEL ENGINE\nUNIT CODE\n\n: UTL723206\nUNIT DESCRIPTOR: This unit covers the required performance in executing the preparation\nand tending of diesel engine and its auxiliary equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform pre-operation\ncheck of diesel engine\nand auxiliary\nequipment\n1.1.\nWalk around check of plant system is performed in\naccordance with enterprise procedure.\n\n1.2.\nFluid deficiencies are refilled/ topped–up in accordance\nwith enterprise procedures\n\n1.3.\nNon-fluid deficiencies are identified and corrected in\naccordance with enterprise procedures.\n\n1.4.\nResult of walk around check are recorded and reported to\nshift in charge.\n2. Perform operation\ncheck\n\n2.1.\nEngine running condition is monitored for normal operation\nbased on indicating parameters.\n2.2.\nRoutine check is performed during operation in\naccordance with equipment checklist.\n2.3.\nUnit abnormalities are recorded and reported to shift in\ncharge.\n3. Perform post-\noperation procedure\n\n3.1.\nShutdown procedure is coordinated with the control\noperator in accordance with enterprise policy.\n3.2.\nEmergency stop push button is engaged in accordance\nwith the operations manual.\n3.3.\nDaily operation is recorded and reported in accordance\nwith the enterprise policy.\n\n--- PDF PAGE 40 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n36\nRANGE OF VARIABLES\n1. Walk-around check\nChecking may include the following:\n1.1 Pre-operation:\n1.1.1\nEmergency stop button initial position\n1.1.2\nCooling system\n1.1.3\nFuel system\n1.1.4\nLube oil system\n1.1.5\nAspiration system\n1.1.6\nDC system\n1.1.7\nSpeed regulating system\n1.1.8\nCompressed air system\n1.1.9\nLeaks\n1.1.10 Loose parts connection\n1.1.11 Missing parts\n2. Routine check\nRoutine check may include the following:\n2.1 Temperature and Pressure checking\n2.2 Leaks inspection\n2.3 Fuel level checking\n2.4 Oil level checking\n2.5 Coolant level checking\n2.6 Smoke emission monitoring\n2.7 Abnormal sound, smell and vibration monitoring\n3. Fluid deficiencies\n3.1 Coolant quality and level\n3.2 Impurities in fuel and fuel level\n3.3 Lube oil quality and level\n3.4 Electrolyte level\n4. Non-fluid deficiencies\n4.1 Activated air restriction indicator\n4.2 Incorrect belt tension\n4.3 Clogged fuel/water filter\n4.4 Dirty fuel/water separator\n4.5 Loose bolts, wiring connection and/or components\n4.6 Leaky components\n5. Indicating Parameters\nMay include but not limited to:\n5.1 Temperature\n5.2 Pressure\n6. Daily operation\nMay include but not limited to:\n6.1 Computation of fuel consumption\n6.2 Computation of lube oil consumption\n6.3 Consumption of water and inhibitor\n6.4 Records of parameter readings\n\n--- PDF PAGE 41 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n37\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1 Conducted walk-around check while the engine is running and\nnot running.\n1.2 Performed pre and post operation activities in diesel power plant\n1.3 Recorded power plant operation\n2. Underpinning\nKnowledge\n2.1 Diesel Power Plant Operation\n2.1.1\nduties and responsibilities\n2.1.2\npre-operation activities\n2.1.3\noperation activities\n2.1.4\npost-operation activities\n2.2 Familiarity with generating set operation with 15kW to 750 kW\nand 1.2 MW\n2.2.1\nPlant systems\n2.2.2\nSystem function\n2.2.3\nSystem flowpath\n2.2.4\nInterrelationship of plant systems/components\n2.2.5\nSystem component function, location and description\n2.2.6\nSystem controls and indications\n2.2.7\nRequired maintenance\n2.3 Plant Safety procedures and environmental awareness\n\n3. Underpinning\nSkills\n3.1 Checking of plant systems and components\n3.2 Correcting minor/operational defects in plant systems and\ncomponents\n3.3 Refilling of deficient fluid levels\n3.4 Replacing filters\n3.5 Recording operation activities\n3.6 Monitoring of generating set operation\n3.7 Cleaning and replacing battery terminals\n3.8 Using hand tools and test instruments\n\n4. Resource\nImplications\n4.1 Diesel generating set\n4.2 PPE\n4.3 Mechanical/electrical tools and test instruments\n4.4 Coolant, diesel fuel, lube oil and cleaning materials\n4.5 Diesel Power Plant Operation Manual\n\n5. Method of\nAssessment\n5.1 Written\n5.2 Direct observation with oral questioning\n5.3 Third party report\n5.4 Portfolio\n5.5 Interview\n5.6 Demonstration with oral questioning\n6. Context of\nAssessment\n6.1 Competency may be assessed on the job or simulated\nenvironment\n6.2 The assessment of practical skills may take place after a period\nof supervised practice and repetitive experience\n\n--- PDF PAGE 42 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n38\nUNIT OF COMPETENCY : OPERATE DIESEL POWER PLANT\nUNIT CODE\n\n: UTL723207\nUNIT DESCRIPTOR: This unit covers the performance required to operate diesel power plant\nin power generation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Run the unit\n1.1.\nConfirmation that line is ready from distribution utility is\nundertaken in accordance with enterprise protocol.\n1.2.\nUnit is started after ensuring that the initial conditions are\nachieved.\n1.3.\nUnit conditions are monitored based on indicating\nparameters.\n1.4.\nMain circuit breaker is switched ON after all unit\nrequirements are attained.\n2. Perform parallel\noperation of the\nunit\n2.1.\nSynchronization of units is performed in accordance with\nestablished procedure.\n2.2.\nGenerator voltage and frequency are adjusted in accordance\nwith system voltage and frequency requirements.\n2.3.\nLoad sharing adjustments are set according to load demand\nand unit dependable capability.\n3. Monitor and tend\nthe unit\n3.1.\nControl panel parameters are recorded in accordance with\nenterprise procedure.\n3.2.\nAbnormalities are responded to in accordance with\nenterprise policy.\n4. Shut down the unit\n\n4.1.\nIndicator readings are recorded in accordance with\nenterprise policy.\n4.2.\nLoad transfer procedure is performed in accordance with\nunit’s dependable capacity and in accordance with\nmanufacturer’s shutdown instruction.\n4.3.\nShutdown procedure is performed following manufacturer’s\ninstruction and corporate policies.\n4.4.\nResult of operation are computed and reported in\naccordance with enterprise policy.\n\n--- PDF PAGE 43 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n39\nRANGE OF VARIABLES\n1.\nUnit\nMay include but not limited to:\n1.1.\n15 kW ≈ 750 kW generating set\n1.2.\n1.2 MW generating set\n\n2.\nInitial conditions\nMay include but not limited to:\n2.1.\nMain Circuit Breaker are in OPEN position\n2.2.\nAlternator is preheated\n2.3.\nAll system are ready for operation\n3.\nIndicating\nparameters\nMay include but not limited to:\n3.1.\nVoltage\n3.2.\nFrequency\n3.3.\nCurrent\n3.4.\nPower factor\n3.5.\nPower\n3.6.\nEnergy\n3.7.\nReactive power\n3.8.\nRunning hours\n3.9.\nOther observable parameters like sound, vibration, odor and\nvisual\n4.\nAbnormalities\nThis may include but not limited to:\n4.1.\nOver/Under voltage\n4.2.\nOver/under frequency\n4.3.\nUnbalanced load current\n4.4.\nEarth-leakage fault\n4.5.\nReverse power\n4.6.\nLeading/low lagging power factor\n4.7.\nCharge failure\n4.8.\nHigh engine temperature\n4.9.\nLow oil pressure\n4.10. High oil temperature\n4.11. Abnormal sound/Knocking sound\n4.12. Excessive vibration\n4.13. Erratic speed/hunting\n4.14. Burnt odor\n4.15. Smokes, sparks, leaks and hot spots\n\n5.\nUnit\nrequirements\nMay include but not limited to:\n5.1.\nEngine temperature requirement\n5.2.\nOil pressure requirement\n5.3.\nVoltage and frequency requirements\n\n6.\nIndicator\nMay include but not limited to:\n6.1.\nVolt meter\n6.2.\nAmmeter\n6.3.\nKilowatt meter\n6.4.\nPower factor meter\n\n6.5.\nKilowatt hour meter\n6.6.\nRunning hours meter\n6.7.\nFrequency meter\n6.8.\nkVAR meter\n\n7.\nResult of\noperation\nMay include but not limited to:\n7.1.\nEnergy generated (gross/net)\n7.2.\nFuel, lube oil and water & inhibitor consumption\n7.3.\nAccumulated running hours\n7.4.\nStation used\n\n--- PDF PAGE 44 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n40\nEVIDENCE GUIDE\n1.\nCritical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1.\nRan the unit\n1.2.\nPerformed parallel operation of units\n1.3.\nMonitored and tended the unit\n1.4.\nShut down the unit\n1.5.\nRecorded power plant operation\n2.\nUnderpinning\nKnowledge\n2.1.\nDiesel Power Plant Operation\n2.1.1. duties and responsibilities\n2.1.2. pre-operation activities\n2.1.3. operation activities\n2.1.4. post-operation activities\n2.2.\nPlant Safety procedures and environmental awareness\n3.\nUnderpinning Skills\n3.1.\nMeter reading\n3.2.\nVoltage adjustment\n3.3.\nLoad adjustment\n3.4.\nPower factor adjustment\n3.5.\nFrequency adjustment\n3.6.\nOpening, closing and resetting of breakers\n3.7.\nSynchronizing and desynchronizing the unit with single\nand parallel operation\n3.8.\nCommunication skills\n4.\nResource\nImplications\n4.1.\nDiesel power plant units\n4.2.\nPPE\n4.3.\nMechanical/electrical tools and test instruments\n4.4.\nDiesel Power Plant Operation Manual\n4.5.\nLog sheet/log book\n5.\nMethod of\nAssessment\n5.1.\nWritten\n5.2.\nDirect observation with oral questioning\n5.3.\nThird party report\n5.4.\nPortfolio\n5.5.\nInterview\n5.6.\nDemonstration with oral questioning\n6.\nContext of\nAssessment\n6.1.\nCompetency may be assessed on the job or simulated\nenvironment\n6.2.\nThe assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 45 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n41\n UNIT OF COMPETENCY: MAINTAIN AND REPAIR DIESEL ENGINE SYSTEMS AND\nALTERNATOR\nUNIT CODE\n\n: UTL723208\nUNIT DESCRIPTOR: This unit identifies the competence required to maintain and service the\ndiesel engine systems and alternator. This includes servicing\naspiration system, lube oil system, cooling system, fuel system as well\nas performing minor servicing of alternator unit.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Service Aspiration\n(intake and exhaust)\nSystem\n1.1. Turbocharger is maintained based on PMS\n1.2. Cleaning or replacement of air filter is done as indicated by\nair restriction indicator\n1.3. Air filter casing is cleaned and freed of dust or foreign\nparticles as cleaning or replacement of filter occurs.\n2. Service Lube Oil\nSystem\n2.1. Oil cooler assembly is uninstalled and installed in\naccordance with the manufacturer’s instruction\n2.2. Oil cooler assembly are disassembled and assembled\nwithout causing damage to the fins, oil cooler tubes and oil\nseals (o-rings) and in accordance with manufacturer’s\ninstruction.\n2.3. Oil cooler tubes are cleaned and freed of scale or\nrestrictions.\n2.4.\nChange oil is performed according to SOP\n3. Service of Cooling\nSystem\n3.1. Cooling System is checked for leaks visually.\n3.2. Radiator is serviced following enterprise policy\n3.3. Thermostat is checked in accordance with its operating\ntemperature.\n3.4. Replace or repair system components based on test result.\n3.5. Coolant is refilled in accordance to the manufacturer’s\ninstruction.\n3.6. Maintain coolant pump in accordance with PMS.\n4. Service Fuel System\n\n4.1. Fuel filter is replaced in accordance with manufacturer’s\ninstruction and PMS.\n4.2. Fuel oil/water separator is drained to ensure that the system\nis free from foreign elements.\n4.3. Servicing and calibration of fuel injector is recommended in\naccordance with enterprise policy.\n5. Check condition of\nalternator\n5.1. Loose connections are remedied and restored to normal\nconditions in accordance with manufacturer’s instructions.\n5.2. Insulation and winding resistance are checked in\naccordance with manufacturer’s manual.\n5.3. Revolving diodes and bridge rectifiers are checked in\naccordance with manufacturer’s manual.\n5.4. AVR functionality is tested based on enterprise policy.\n5.5. Air gap clearances are checked in accordance with\nmanufacturer’s manual.\n5.6. Service report is prepared and submitted in accordance with\nenterprise policy.\n\n--- PDF PAGE 46 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n42\nRANGE OF VARIABLES\n\n1. PMS\nPreventive Maintenance schedules can be:\n1.1\n400 RH\n1.2\n1200 RH\n1.3\n2400 RH\n1.4\n4800 RH\n1.5\n9600 RH\n1.6\n20000 RH\n1.7\nother schedules indicated on the manual or enterprise policy\n\n2. Cooling System\nCooling system may consists of the following:\n2.1\nRadiator Assembly\n2.2\nOil Cooler Assembly\n2.3\nCoolant Pump Assembly\n2.4\nCoolant Rail & Thermostat\n2.5\nWater Jackets\n2.6\nCharged Air Cooler Assembly\n2.7\nCooling Fan\n\n3. Operating\nTemperature\n3.1\nThe first thermostatic valve opens at 78 – 79 ◦C\n3.2\nThe second thermostatic valve opens at 80 – 84 ◦C\n3.3\nThe third thermostatic valve fully opens at 92 – 98 ◦C\n\n4. Test Result\n4.1\nOperating Temperature of Thermostat\n4.2\nAxial/Radial Test of Coolant Pump Shaft\n4.3\nVisual Leak Test/Hydro Test\n\n5. Foreign Elements\nMay include but not limited to:\n5.1\nDirt\n5.2\nRust\n5.3\nGrease/Oil\n5.4\nWater\n\n6. Winding\n6.1\nPotential transformer windings\n6.2\nCurrent transformer windings\n6.3\nMain stator windings\n6.4\nMain rotor windings\n6.5\nExciter-rotor windings\n6.6\nExciter-stator windings\n6.7\nAuxiliary windings\n6.8\nCompounding transformer windings\n\n7. Air gap\nclearances\n7.1\nExciter rotor-stator air gap clearance\n7.2\nCompounding transformer air gap clearance\n\n--- PDF PAGE 47 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n43\nEVIDENCE GUIDE\n1. Critical Aspect of\nCompetency\nAssessment requires that the candidate serviced the following\nsystem :\n1.1. Cooling system\n1.2. Lube oil system\n1.3. Fuel system\n1.4. Aspiration\n1.5. Alternator\n2. Underpinning\nKnowledge\n2.1. Interpreting manufacturers manual & preparations of\nreports\n2.2. Diesel engine components operation\n2.3. Diesel engine systems operation\n2.4. Parts & assembly of diesel engine components\n2.5. Specifications of diesel engine components\n2.6. Parts of alternator\n2.7. Specifications of alternator and components\n2.8. Safety & environmental procedures related to servicing of\ndiesel engine components and alternator\n\n3. Underpinning Skills\n3.1. Handling of tools & equipment\n3.2. Handling of precision measuring tools & equipment\n3.3. Taking component measurements\n3.4. Analysis of acquired data\n3.5. Non-destructive testing such as visual inspection and dye-\npenetrant testing\n3.6. Communication skills\n4. Resource\nImplication\n4.1. Mechanical Tools\n4.2. Precision measuring tools\n4.3. Special tools\n4.4. Lubricants & coolant\n4.5. Gaskets & Sealants\n4.6. Dye penetrate, developer & solvent\n4.7. Cleaning tools & materials\n4.8. PPE\n4.9. Diesel engine with complete sub-assemblies\n4.10. Alternator\n\n5. Method of\nAssessment\n5.1. Written\n5.2. Direct Observation w/ oral questioning\n5.3. Third party report\n5.4. Portfolio\n5.5. Interview\n5.6. Demonstration with oral questioning\n\n--- PDF PAGE 48 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n44\n6. Context of\nAssessment\n6.1. Competency may be assessed on the job or simulated\nenvironment\n6.2. The assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 49 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n45"
