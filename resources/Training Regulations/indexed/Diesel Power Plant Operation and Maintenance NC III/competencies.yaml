        "source_title": "OPERATE DIESEL POWER PLANT",
        "source_text": "--- PDF PAGE 42 ---\nTR – Diesel Power Plant Operation and Maintenance NC III  \n38\nUNIT OF COMPETENCY :   OPERATE DIESEL POWER PLANT  \nUNIT CODE  \n   \n:   UTL723207 \nUNIT DESCRIPTOR:  This unit covers the performance required to operate diesel power plant \nin power generation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Run the unit  \n1.1. \nConfirmation that line is ready from distribution utility is \nundertaken in accordance with enterprise protocol. \n1.2. \nUnit is started after ensuring that the initial conditions are \nachieved. \n1.3. \nUnit conditions are monitored based on indicating \nparameters. \n1.4. \nMain circuit breaker is switched ON after all unit \nrequirements are attained.    \n2. Perform parallel \noperation of the \nunit \n2.1. \nSynchronization of units is performed in accordance with \nestablished procedure. \n2.2. \nGenerator voltage and frequency are adjusted in accordance \nwith system voltage and frequency requirements. \n2.3. \nLoad sharing adjustments are set according to load demand \nand unit dependable capability.\n3. Monitor and tend \nthe unit  \n3.1. \nControl panel parameters are recorded in accordance with \nenterprise procedure. \n3.2. \nAbnormalities are responded to in accordance with \nenterprise policy. \n4. Shut down the unit \n \n4.1. \nIndicator readings are recorded in accordance with \nenterprise policy. \n4.2. \nLoad transfer procedure is performed in accordance with \nunit’s dependable capacity and in accordance with \nmanufacturer’s shutdown instruction. \n4.3. \nShutdown procedure is performed following manufacturer’s \ninstruction and corporate policies. \n4.4. \nResult of operation are computed and reported in \naccordance with enterprise policy.\n\n--- PDF PAGE 43 ---\nTR – Diesel Power Plant Operation and Maintenance NC III  \n39\nRANGE OF VARIABLES \n1. \nUnit \nMay include but not limited to: \n1.1. \n15 kW ≈ 750 kW generating set \n1.2. \n1.2 MW generating set \n \n2. \nInitial conditions \nMay include but not limited to: \n2.1. \nMain Circuit Breaker are in OPEN position \n2.2. \nAlternator is preheated \n2.3.\nAll system are ready for operation\n3. \nIndicating \nparameters \nMay include but not limited to: \n3.1. \nVoltage \n3.2. \nFrequency \n3.3. \nCurrent \n3.4. \nPower factor \n3.5. \nPower \n3.6. \nEnergy \n3.7. \nReactive power \n3.8. \nRunning hours \n3.9. \nOther observable parameters like sound, vibration, odor and \nvisual\n4. \nAbnormalities \nThis may include but not limited to: \n4.1. \nOver/Under voltage \n4.2. \nOver/under frequency \n4.3. \nUnbalanced load current \n4.4. \nEarth-leakage fault \n4.5. \nReverse power \n4.6. \nLeading/low lagging power factor \n4.7. \nCharge failure \n4.8. \nHigh engine temperature \n4.9. \nLow oil pressure \n4.10. High oil temperature \n4.11. Abnormal sound/Knocking sound \n4.12. Excessive vibration \n4.13. Erratic speed/hunting \n4.14. Burnt odor \n4.15. Smokes, sparks, leaks and hot spots \n \n5. \nUnit \nrequirements \nMay include but not limited to: \n5.1. \nEngine temperature requirement \n5.2. \nOil pressure requirement \n5.3. \nVoltage and frequency requirements \n \n6. \nIndicator \nMay include but not limited to: \n6.1. \nVolt meter \n6.2. \nAmmeter \n6.3. \nKilowatt meter \n6.4. \nPower factor meter \n \n6.5. \nKilowatt hour meter \n6.6. \nRunning hours meter \n6.7. \nFrequency meter \n6.8. \nkVAR meter \n \n7. \nResult of \noperation \nMay include but not limited to: \n7.1. \nEnergy generated (gross/net) \n7.2. \nFuel, lube oil and water & inhibitor consumption \n7.3. \nAccumulated running hours \n7.4. \nStation used\n\n--- PDF PAGE 44 ---\nTR – Diesel Power Plant Operation and Maintenance NC III  \n40\nEVIDENCE GUIDE \n1. \nCritical Aspect of \nCompetency \nAssessment requires that the candidate: \n1.1. \nRan the unit \n1.2. \nPerformed parallel operation of units \n1.3. \nMonitored and tended the unit \n1.4. \nShut down the unit \n1.5. \nRecorded power plant operation  \n2. \nUnderpinning \nKnowledge \n2.1. \nDiesel Power Plant Operation \n2.1.1. duties and responsibilities \n2.1.2. pre-operation activities \n2.1.3. operation activities \n2.1.4. post-operation activities \n2.2. \nPlant Safety procedures and environmental awareness \n3. \nUnderpinning Skills \n3.1. \nMeter reading \n3.2. \nVoltage adjustment \n3.3. \nLoad adjustment \n3.4. \nPower factor adjustment \n3.5. \nFrequency adjustment \n3.6. \nOpening, closing and resetting of breakers \n3.7. \nSynchronizing and desynchronizing the unit with single \nand parallel operation \n3.8. \nCommunication skills \n4. \nResource \nImplications \n4.1. \nDiesel power plant units \n4.2. \nPPE \n4.3. \nMechanical/electrical tools and test instruments \n4.4. \nDiesel Power Plant Operation Manual \n4.5. \nLog sheet/log book \n5. \nMethod of \nAssessment \n5.1. \nWritten \n5.2. \nDirect observation with oral questioning \n5.3. \nThird party report \n5.4. \nPortfolio \n5.5. \nInterview \n5.6. \nDemonstration with oral questioning \n6. \nContext of \nAssessment \n6.1. \nCompetency may be assessed on the job or simulated \nenvironment \n6.2. \nThe assessment of practical skills may take place after a \nperiod of supervised practice and repetitive experience\n",
