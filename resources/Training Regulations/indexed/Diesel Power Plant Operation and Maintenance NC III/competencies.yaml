3.4\nBasic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRelevant technology\n4.2\nInterview and demonstration questionnaires\n4.3\nAssessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\nInterview\n5.2\nActual demonstration\n5.3\nAuthenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1\nCompetency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 24 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n20\n COMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n:\nUTL311202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in identifying\ncaring, handling and using measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select measuring\n\n instruments\n1.1\nObject or component to be measured is identified\n1.2\nCorrect specifications are obtained from relevant source\n1.3\nAppropriate measuring instrument is selected according\nto job requirements\n2. Carry out\n measurements\n and calculation\n\n2.1\nMeasuring tools are selected in line with job requirements\n2.2\nAccurate measurements are obtained in accordance with\njob requirements.\n2.3\nCalculation needed to complete work tasks are performed\nusing the four fundamental operation of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4\nCalculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks.\n2.5\nNumerical computation is self-checked and corrected for\naccuracy\n2.6\nInstruments are read to the limit of accuracy of the tool.\n3. Maintain measuring\ninstruments\n\n3.1\nMeasuring instruments are kept free from corrosion\n3.2\nMeasuring instruments are not dropped to avoid damage\n3.3\nMeasuring instruments are cleaned before and after using.\n\n--- PDF PAGE 25 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1\nMultitester\n1.2\nMicrometer (In-out, depth)\n1.3\nVernier caliper (Out, inside)\n1.4\nDial Gauge with Mag. Std.\n1.5\nPlastigauge\n1.6\nStraight Edge\n1.7\nThickness gauge\n1.8\nTorque Gauge\n1.9\nSmall Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14\nSteel rule\n2. Calculation\n\nKinds of part mensuration include:\n2.1\nVolume\n2.2\nArea\n2.3\nDisplacement\n2.4\nInside diameter\n2.5\nCircumference\n2.6\nLength\n2.7\nThickness\n2.8\nOutside diameter\n2.9\nTaper\n2.10 Out of roundness\n2.11 Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 26 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n22\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSelected measuring instruments\n1.2\nCarried-out measurements and calculations.\n1.3\nMaintained measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes of Measuring instruments and its uses\n2.2\nSafe handling procedures in using measuring instruments\n2.3\nFour fundamental operation of mathematics\n2.2\nFormula for Volume, Area, Perimeter and other geometric\nfigures\n3. Underpinning skills\n3.1\nCaring and Handling measuring instruments\n3.2\nCalibrating and using measuring instruments\n3.1\nPerforming calculation by Addition, Subtraction,\nMultiplication and Division\n3.2\nVisualizing objects and shapes\n3.3\nInterpreting formula for volume, area, perimeter and other\ngeometric figures\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace location\n4.2\nMeasuring instrument appropriate to servicing processes\n4.3\nInstructional materials relevant to the propose activity\n5. Method of\nassessment\n\nCompetency must be assessed through:\n5.1\nObservation with questioning\n5.2\