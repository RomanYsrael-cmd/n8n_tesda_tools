        "evidence_guide": {
          "source_text": "1.\nCritical Aspect of\nCompetency\nAssessment requires that the candidate:\n1.1.\nRan the unit\n1.2.\nPerformed parallel operation of units\n1.3.\nMonitored and tended the unit\n1.4.\nShut down the unit\n1.5.\nRecorded power plant operation\n2.\nUnderpinning\nKnowledge\n2.1.\nDiesel Power Plant Operation\n2.1.1. duties and responsibilities\n2.1.2. pre-operation activities\n2.1.3. operation activities\n2.1.4. post-operation activities\n2.2.\nPlant Safety procedures and environmental awareness\n3.\nUnderpinning Skills\n3.1.\nMeter reading\n3.2.\nVoltage adjustment\n3.3.\nLoad adjustment\n3.4.\nPower factor adjustment\n3.5.\nFrequency adjustment\n3.6.\nOpening, closing and resetting of breakers\n3.7.\nSynchronizing and desynchronizing the unit with single\nand parallel operation\n3.8.\nCommunication skills\n4.\nResource\nImplications\n4.1.\nDiesel power plant units\n4.2.\nPPE\n4.3.\nMechanical/electrical tools and test instruments\n4.4.\nDiesel Power Plant Operation Manual\n4.5.\nLog sheet/log book\n5.\nMethod of\nAssessment\n5.1.\nWritten\n5.2.\nDirect observation with oral questioning\n5.3.\nThird party report\n5.4.\nPortfolio\n5.5.\nInterview\n5.6.\nDemonstration with oral questioning\n6.\nContext of\nAssessment\n6.1.\nCompetency may be assessed on the job or simulated\nenvironment\n6.2.\nThe assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 45 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n41\n UNIT OF COMPETENCY: MAINTAIN AND REPAIR DIESEL ENGINE SYSTEMS AND\nALTERNATOR\nUNIT CODE\n\n:",
