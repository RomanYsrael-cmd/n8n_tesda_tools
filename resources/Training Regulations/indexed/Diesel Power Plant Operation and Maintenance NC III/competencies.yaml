tenance Procedure Manual\n1.4\nPeriodic Maintenance Manual\n1.5\nOperation and maintenance instructions manual\n1.6\nSpare Parts Catalogue\n\n--- PDF PAGE 29 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified and accessed manual/specification\n1.2\nInterpreted manuals\n1.3\nApplied information in manuals\n1.4\nStored manuals\n2. Underpinning\nknowledge\n2.1\nTypes of manuals used in automotive industry\n2.2\nIdentification of symbols used in the manuals\n3.1\n Identification of units of measurements\n3.2\n Unit conversion\n3. Underpinning skills\n\n3.1\nReading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2\nAccessing information and data\n4. Resource\nImplications\n\nThe following resources MUST be provided:\n4.1\n All manuals/catalogues relative to Automotive\n4.2\n Job order, requisitions\n4.3\n Actual vehicle or simulator\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n6. Context of\nassessment\n\n6.1\nAssessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2\nAssessment may be conducted in the workplace or a\nsimulated environment.\n\n--- PDF PAGE 30 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n26\n UNIT OF COMPETENCY :\nPERFORM SHOP MAINTENANCE\n\nUNIT CODE\n:\nUTL723205\n\nUNIT DESCRIPTOR\n:\nThis unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and checking of\ntools/ equipment and disposal of used materials are also\nincorporated in this competency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools cleaning\nrequirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop equipment\n1.1\nTools/equipment are checked and stored in their\nrespective shelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose of waste\nmaterials\n3.1\nContainers for used materials are visibly labeled\n3.2\nWaste materials are disposed as per workshop SOP\n4. Report damaged\ntools/equipment\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared have no error/discrepancy\n\n--- PDF PAGE 31 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Cleaning\nrequirement\n1.1\nCleaning solvent\n1.2\nInventory of supplies, tools, equipment, facilities\n1.3\nList of mechanics/technicians\n1.4\nRags\n1.5\nBroom\n1.6\nMap\n1.7\nPail\n1.8\nDust/waste bin\n\n--- PDF PAGE 32 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n28\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1\n5 S or Total Quality Management (TQM)\n2.2\nService procedures\n2.3\nRelevant technical information\n2.4\nSafe handling of Equipment and tools\n2.5\nEquipment safety requirements\n2.6\nWorkshop policies\n2.7\nPersonal safety procedures\n2.8\nFire Extinguishers and prevention\n2.9\nStorage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning skills\n3.1\nHandling/Storing of tools/equipment/supplies and material\n3.2\nDisposing of wastes and fluid\n3.3\nPreparing inventory of s/m and tools and equipment\n3.4\