        "source_text": "UTL723203\n\nUNIT DESCRIPTOR\n:\nThis unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and\nperiodic maintenance manual.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify and access\n manual/\n specification\n1.1\nAppropriate manuals are identified and accessed as per\njob requirements.\n1.2\nVersion and date of manual is checked to ensure correct\nspecification and procedure are identified.\n2. Interpret manuals\n2.1\nRelevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2\nInformation and procedure in the manual are interpreted\nin accordance to industry practices\n3. Apply information in\nmanual\n\n3.1\nManual is interpreted according to job requirements\n3.2\nWork steps are correctly identified in accordance with\nmanufacturer specification\n3.3\nManual data is applied according to the given task\n3.4\nAll correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n4. Store manuals\n4.1\nManual or specification are stored appropriately to ensure\nprevention of damage, ready access and updating of\ninformation when required in accordance with company\nrequirements\n\n--- PDF PAGE 28 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manuals\nKinds of manuals:\n1.1\nManufacturer’s specification manual\n1.2\nRepair manual\n1.3\nMaintenance Procedure Manual\n1.4\nPeriodic Maintenance Manual\n1.5\nOperation and maintenance instructions manual\n1.6\nSpare Parts Catalogue\n\n--- PDF PAGE 29 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified and accessed manual/specification\n1.2\nInterpreted manuals\n1.3\nApplied information in manuals\n1.4\nStored manuals\n2. Underpinning\nknowledge\n2.1\nTypes of manuals used in automotive industry\n2.2\nIdentification of symbols used in the manuals\n3.1\n Identification of units of measurements\n3.2\n Unit conversion\n3. Underpinning skills\n\n3.1\nReading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2\nAccessing information and data\n4. Resource\nImplications\n\nThe following resources MUST be provided:\n4.1\n All manuals/catalogues relative to Automotive\n4.2\n Job order, requisitions\n4.3\n Actual vehicle or simulator\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nInterview\n6. Context of\nassessment\n\n6.1\nAssessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2\nAssessment may be conducted in the workplace or a\nsimulated environment.\n\n--- PDF PAGE 30 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n26\n UNIT OF COMPETENCY :\nPERFORM SHOP MAINTENANCE\n\nUNIT CODE\n:"
