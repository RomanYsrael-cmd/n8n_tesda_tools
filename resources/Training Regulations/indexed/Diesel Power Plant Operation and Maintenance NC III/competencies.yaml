  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in Diesel Power Plant Operation and Maintenance NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nlead in the dissemination and discussion of ideas, information\nand issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1\nAppropriate communication method is selected\n1.2 Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when required\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided immediately\n2.3 Constructive contributions are made to workplace\ndiscussions on such issues as production, quality and safety\n2.4 Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are organized\ncoherently to ensure clear and effective communication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised as they\narise\n\n--- PDF PAGE 7 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1\nNon-verbal gestures\n1.2 Verbal\n1.3 Face to face\n1.4 Two-way radio\n1.5 Speaking to groups\n1.6 Using telephone\n1.7 Written\n1.8\nInternet\n\n--- PDF PAGE 8 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of\nwritten and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 9 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n5\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\n\nUNIT CODE\n:\n500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead small\nteams including setting and maintaining team and individual\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to team\nmembers\n1.2\nReasons for instructions and requirements are\ncommunicated to team members\n1.3\nTeam members’ queries and concerns are recognized,\ndiscussed and dealt with\n2. Assign\nresponsibilities\n2.1\nDuties, and responsibilities are allocated having regard to\nthe skills, knowledge and aptitude required to properly\nundertake the assigned task and according to company\npolicy\n2.2\nDuties are allocated having regard to individual preference,\ndomestic and personal considerations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on client\nneeds and according to assignment requirements\n3.2\nPerformance expectations are based on individual team\nmembers duties and area of responsibility\n3.3\nPerformance expectations are discussed and disseminated\nto individual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against defined\nperformance criteria and/or assignment instructions and\ncorrective action taken if required\n4.2\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3\nPerformance issues which cannot be rectified or addressed\nwithin the team are referenced to appropriate personnel\naccording to employer policy\n4.4\nTeam members are kept informed of any changes in the\npriority allocated to assignments or tasks which might impact\non client/customer needs and satisfaction\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6\nFollow-up communication is provided on all issues affecting\nthe team\n4.7\nAll relevant documentation is completed in accordance with\ncompany procedures\n\n--- PDF PAGE 10 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team\nmember’s\nconcerns\n2.1\nRoster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 11 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2\nAssessed and monitored team and individual performance\nagainst set criteria\n1.3\nRepresented concerns of a team and individual to next level\nof management or appropriate specialist and to negotiate\non their behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5\nSet and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nknowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning skills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 12 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n8\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE\n:\n500311111\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome and\nparticipate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\nInformation on preparing for negotiation is identified and\nincluded in the plan\n1.2\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the plan\n1.3\nInformation on active listening is identified and included in\nthe plan\n1.4\nInformation on different questioning techniques is\nidentified and included in the plan\n1.5\nInformation is checked to ensure it is correct and up-to-\ndate\n2. Participate in\nnegotiations\n2.1\nCriteria for successful outcome are agreed upon by all\nparties\n2.2\nDesired outcome of all parties are considered\n2.3\nAppropriate language is used throughout the negotiation\n2.4\nA variety of questioning techniques are used\n2.5\nThe issues and processes are documented and agreed\nupon by all parties\n2.6\nPossible solutions are discussed and their viability\nassessed\n2.7\nAreas for agreement are confirmed and recorded\n2.8\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 13 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\nBackground information on other parties to the negotiation\n1.2\nGood understanding of topic to be negotiated\n1.3\nClear understanding of desired outcome/s\n1.4\nPersonal attributes\n1.4.1\nself awareness\n1.4.2\nself esteem\n1.4.3\nobjectivity\n1.4.4\nempathy\n1.4.5\nrespect for others\n1.5\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6 Analytic skills\n1.6.1\nobserving differences between content and process\n1.6.2\nidentifying bargaining information\n1.6.3\napplying strategies to manage process\n1.6.4\napplying steps in negotiating process\n1.6.5\nstrategies to manage conflict\n1.6.6\nsteps in negotiating process\n1.6.7\noptions within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\nFriendly reception\n2.2\nWarm and welcoming room\n2.3\nRefreshments offered\n2.4\nLead in conversation before negotiation begins\n3. Active listening\n3.1\nAttentive\n3.2\nDon’t interrupt\n3.3\nGood posture\n3.4\nMaintain eye contact\n3.5\nReflective listening\n4. Questioning\ntechniques\n4.1\nDirect\n4.2\nIndirect\n4.3\nOpen-ended\n\n--- PDF PAGE 14 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2\nParticipated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nknowledge and\nattitude\n2.1\nCodes of practice and guidelines for the organization\n2.2\nOrganizations policy and procedures for negotiations\n2.3\nDecision making and conflict resolution strategies\nprocedures\n2.4\nProblem solving strategies on how to deal with unexpected\nquestions and attitudes during negotiation\n2.5\nFlexibility\n2.6\nEmpathy\n3. Underpinning skills\n3.1\nInterpersonal skills to develop rapport with other parties\n3.2\nCommunication skills (verbal and listening)\n3.3\nObservation skills\n3.1\nNegotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nRoom with facilities necessary for the negotiation process\n4.2\nHuman resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation/demonstration and questioning\n5.2\nPortfolio assessment\n5.3\nOral and written questioning\n5.4\nThird party report\n6. Context of\nassessment\n6.1\nCompetency to be assessed in real work environment or in\na simulated workplace setting.\n\n--- PDF PAGE 15 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n11\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n:\n500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required to\nsolve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the\nroot cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1\nVariances are identified from normal operating parameters;\nand product quality\n1.2 Extent, cause and nature are of the problem are defined\nthrough observation, investigation and analytical\ntechniques\n1.3 Problems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1 Possible causes are identified based on experience and the\nuse of problem solving tools / analytical techniques.\n2.2 Possible cause statements are developed based on\nfindings\n2.3 Fundamental causes are identified per results of\ninvestigation conducted\n3. Determine corrective\naction\n3.1 All possible options are considered for resolution of the\nproblem\n3.2 Strengths and weaknesses of possible options are\nconsidered\n3.3 Corrective actions are determined to resolve the problem\nand possible future causes\n3.4 Action plans are developed identifying measurable\nobjectives, resource needs and timelines in accordance\nwith safety and operating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1 Report on recommendations are prepared\n4.2 Recommendations are presented to appropriate personnel.\n4.3 Recommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2 Intuitions/Logic\n1.3 Cause and effect diagrams\n1.4 Pareto analysis\n1.5 SWOT analysis\n1.6 Gant chart, Pert CPM and graphs\n1.7 Scattergrams\n2. Problem\n\n2.1 Non – routine process and quality problems\n2.2 Equipment selection, availability and failure\n2.3 Teamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1 Priority requirements\n3.2 Measurable objectives\n3.3 Resource requirements\n3.4 Timelines\n3.5 Co-ordination and feedback requirements\n3.6 Safety requirements\n3.7 Risk assessment\n3.8 Environmental requirements\n\n--- PDF PAGE 17 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios /\ncase studies / what ifs as a stimulus with a walk through forming part\nof the response. These assessment activities should include a range\nof problems, including new, unusual and improbable situations that\nmay have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating parameters,\nand product quality to recognize non-standard situations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1\nRelevant equipment and operational processes\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental requirement\n2.2.4\nPrinciples of decision making strategies and techniques\n2.2.5\nEnterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well as\nbank of questions which will be used to probe the reason\nbehind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCase studies on solving problems in the workplace\n5.2\n Observation\nThe unit will be assessed in a holistic manner as is practical and may\nbe integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations, which\nwill include disruptions to normal, smooth operation. Simulation may\nbe required to allow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual workplace\nand will include walk through of the relevant competency\ncomponents.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 18 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n14\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\n\nUNIT CODE\n:\n500311113\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\nthe application of mathematical concepts and techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nmathematical tools\nand techniques to\nsolve problem\n1.1\nProblem areas are identified based on given condition\n1.2\nMathematical techniques are selected based on the given\nproblem\n2. Apply mathematical\nprocedure/solution\n2.1\nMathematical techniques are applied based on the problem\nidentified\n2.2\nMathematical computations are performed to the level of\naccuracy required for the problem\n2.3\nResults of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1\nResult of application is reviewed based on expected and\nrequired specifications and outcome\n3.2\nAppropriate action is applied in case of error\n\n--- PDF PAGE 19 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1\nFour fundamental operations\n1.2\nMeasurements\n1.3\nUse/Conversion of units of measurements\n1.4\nUse of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\n--- PDF PAGE 20 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n16\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4\nBasic measuring tools/devices\n3. Underpinning ski