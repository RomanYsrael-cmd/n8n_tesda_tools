        "evidence_guide": {
          "source_text": "1. Critical Aspect of\nCompetency\nAssessment requires that the candidate serviced the following\nsystem :\n1.1. Cooling system\n1.2. Lube oil system\n1.3. Fuel system\n1.4. Aspiration\n1.5. Alternator\n2. Underpinning\nKnowledge\n2.1. Interpreting manufacturers manual & preparations of\nreports\n2.2. Diesel engine components operation\n2.3. Diesel engine systems operation\n2.4. Parts & assembly of diesel engine components\n2.5. Specifications of diesel engine components\n2.6. Parts of alternator\n2.7. Specifications of alternator and components\n2.8. Safety & environmental procedures related to servicing of\ndiesel engine components and alternator\n\n3. Underpinning Skills\n3.1. Handling of tools & equipment\n3.2. Handling of precision measuring tools & equipment\n3.3. Taking component measurements\n3.4. Analysis of acquired data\n3.5. Non-destructive testing such as visual inspection and dye-\npenetrant testing\n3.6. Communication skills\n4. Resource\nImplication\n4.1. Mechanical Tools\n4.2. Precision measuring tools\n4.3. Special tools\n4.4. Lubricants & coolant\n4.5. Gaskets & Sealants\n4.6. Dye penetrate, developer & solvent\n4.7. Cleaning tools & materials\n4.8. PPE\n4.9. Diesel engine with complete sub-assemblies\n4.10. Alternator\n\n5. Method of\nAssessment\n5.1. Written\n5.2. Direct Observation w/ oral questioning\n5.3. Third party report\n5.4. Portfolio\n5.5. Interview\n5.6. Demonstration with oral questioning\n\n--- PDF PAGE 48 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n44\n6. Context of\nAssessment\n6.1. Competency may be assessed on the job or simulated\nenvironment\n6.2. The assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 49 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n45"
        },
        "source_text": "UTL723208\nUNIT DESCRIPTOR: This unit identifies the competence required to maintain and service the\ndiesel engine systems and alternator. This includes servicing\naspiration system, lube oil system, cooling system, fuel system as well\nas performing minor servicing of alternator unit.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Service Aspiration\n(intake and exhaust)\nSystem\n1.1. Turbocharger is maintained based on PMS\n1.2. Cleaning or replacement of air filter is done as indicated by\nair restriction indicator\n1.3. Air filter casing is cleaned and freed of dust or foreign\nparticles as cleaning or replacement of filter occurs.\n2. Service Lube Oil\nSystem\n2.1. Oil cooler assembly is uninstalled and installed in\naccordance with the manufacturer’s instruction\n2.2. Oil cooler assembly are disassembled and assembled\nwithout causing damage to the fins, oil cooler tubes and oil\nseals (o-rings) and in accordance with manufacturer’s\ninstruction.\n2.3. Oil cooler tubes are cleaned and freed of scale or\nrestrictions.\n2.4.\nChange oil is performed according to SOP\n3. Service of Cooling\nSystem\n3.1. Cooling System is checked for leaks visually.\n3.2. Radiator is serviced following enterprise policy\n3.3. Thermostat is checked in accordance with its operating\ntemperature.\n3.4. Replace or repair system components based on test result.\n3.5. Coolant is refilled in accordance to the manufacturer’s\ninstruction.\n3.6. Maintain coolant pump in accordance with PMS.\n4. Service Fuel System\n\n4.1. Fuel filter is replaced in accordance with manufacturer’s\ninstruction and PMS.\n4.2. Fuel oil/water separator is drained to ensure that the system\nis free from foreign elements.\n4.3. Servicing and calibration of fuel injector is recommended in\naccordance with enterprise policy.\n5. Check condition of\nalternator\n5.1. Loose connections are remedied and restored to normal\nconditions in accordance with manufacturer’s instructions.\n5.2. Insulation and winding resistance are checked in\naccordance with manufacturer’s manual.\n5.3. Revolving diodes and bridge rectifiers are checked in\naccordance with manufacturer’s manual.\n5.4. AVR functionality is tested based on enterprise policy.\n5.5. Air gap clearances are checked in accordance with\nmanufacturer’s manual.\n5.6. Service report is prepared and submitted in accordance with\nenterprise policy.\n\n--- PDF PAGE 46 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n42\nRANGE OF VARIABLES\n\n1. PMS\nPreventive Maintenance schedules can be:\n1.1\n400 RH\n1.2\n1200 RH\n1.3\n2400 RH\n1.4\n4800 RH\n1.5\n9600 RH\n1.6\n20000 RH\n1.7\nother schedules indicated on the manual or enterprise policy\n\n2. Cooling System\nCooling system may consists of the following:\n2.1\nRadiator Assembly\n2.2\nOil Cooler Assembly\n2.3\nCoolant Pump Assembly\n2.4\nCoolant Rail & Thermostat\n2.5\nWater Jackets\n2.6\nCharged Air Cooler Assembly\n2.7\nCooling Fan\n\n3. Operating\nTemperature\n3.1\nThe first thermostatic valve opens at 78 – 79 ◦C\n3.2\nThe second thermostatic valve opens at 80 – 84 ◦C\n3.3\nThe third thermostatic valve fully opens at 92 – 98 ◦C\n\n4. Test Result\n4.1\nOperating Temperature of Thermostat\n4.2\nAxial/Radial Test of Coolant Pump Shaft\n4.3\nVisual Leak Test/Hydro Test\n\n5. Foreign Elements\nMay include but not limited to:\n5.1\nDirt\n5.2\nRust\n5.3\nGrease/Oil\n5.4\nWater\n\n6. Winding\n6.1\nPotential transformer windings\n6.2\nCurrent transformer windings\n6.3\nMain stator windings\n6.4\nMain rotor windings\n6.5\nExciter-rotor windings\n6.6\nExciter-stator windings\n6.7\nAuxiliary windings\n6.8\nCompounding transformer windings\n\n7. Air gap\nclearances\n7.1\nExciter rotor-stator air gap clearance\n7.2\nCompounding transformer air gap clearance\n\n--- PDF PAGE 47 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n43\nEVIDENCE GUIDE\n1. Critical Aspect of\nCompetency\nAssessment requires that the candidate serviced the following\nsystem :\n1.1. Cooling system\n1.2. Lube oil system\n1.3. Fuel system\n1.4. Aspiration\n1.5. Alternator\n2. Underpinning\nKnowledge\n2.1. Interpreting manufacturers manual & preparations of\nreports\n2.2. Diesel engine components operation\n2.3. Diesel engine systems operation\n2.4. Parts & assembly of diesel engine components\n2.5. Specifications of diesel engine components\n2.6. Parts of alternator\n2.7. Specifications of alternator and components\n2.8. Safety & environmental procedures related to servicing of\ndiesel engine components and alternator\n\n3. Underpinning Skills\n3.1. Handling of tools & equipment\n3.2. Handling of precision measuring tools & equipment\n3.3. Taking component measurements\n3.4. Analysis of acquired data\n3.5. Non-destructive testing such as visual inspection and dye-\npenetrant testing\n3.6. Communication skills\n4. Resource\nImplication\n4.1. Mechanical Tools\n4.2. Precision measuring tools\n4.3. Special tools\n4.4. Lubricants & coolant\n4.5. Gaskets & Sealants\n4.6. Dye penetrate, developer & solvent\n4.7. Cleaning tools & materials\n4.8. PPE\n4.9. Diesel engine with complete sub-assemblies\n4.10. Alternator\n\n5. Method of\nAssessment\n5.1. Written\n5.2. Direct Observation w/ oral questioning\n5.3. Third party report\n5.4. Portfolio\n5.5. Interview\n5.6. Demonstration with oral questioning\n\n--- PDF PAGE 48 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n44\n6. Context of\nAssessment\n6.1. Competency may be assessed on the job or simulated\nenvironment\n6.2. The assessment of practical skills may take place after a\nperiod of supervised practice and repetitive experience\n\n--- PDF PAGE 49 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n45"
