    "source_text": "SECTION 3\nTRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for Diesel Power Plant Operation and Maintenance NCIII.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: DIESEL POWER PLANT OPERATION AND MAINTENANCE NC Level: NC III\n\nNominal Training Duration: 302 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of a trainee/student\nin tending diesel engine operation, operating diesel power plant, maintaining and repairing\ndiesel engine system and alternator.\n\nThis course also includes participating in workplace communication, working in a team\nenvironment, practicing career professionalism, practicing occupational health and safety\nprocedures and reading manuals.\n\nBASIC COMPETENCIES\n(56 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunicatio\nn\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the workplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n\n2.4\nSupervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.3 Identify relevant information in\nplanning negotiations\n3.4 Participate in negotiations\n3.5 Document areas for agreement\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem\nrelated to\nwork activities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible cause/s\nof the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 50 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n46\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n1.1 Identify appropriate technology\n1.2 Apply relevant technology\n1.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n(80 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand calculation\n\n 16 hours\n1.1 Select measuring\ninstrument and carry out\nmeasurement and\ncalculations\n1.2 Carry out measurement and\ncalculation\n1.3 Maintain measuring\ninstruments\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n2. Read, interpret\nand apply\nspecifications\nand manual\n\n16 hours\n2.1 Identify/access manuals and\ninterpret data and\nspecification\n2.2 Apply information accessed\nin manual\n2.3 Store manual\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n3. Perform shop\nmaintenance\n\n8 hours\n3.1 Inspect/clean tools and work\narea\n3.2 Store/arrange tools and\nshop equipment\n3.3 Dispose waste/used\nlubricants\n3.4 Report damaged\ntools/equipment\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n4. Perform basic\nbench work\n\n24 hours\n4.1. Prepare supplies, materials,\ntools, and equipment\n4.2. Layout necessary\ndimensions\n4.3. Perform grinding, cutting,\nfiling, drilling and boring\n• Lecture\n• Discussion\n• Demonstration\n\n• Interview\n• Demonstration\n• Direct\nObservation\n5. Perform basic\nelectrical works\n\n16 hours\n5.1. Test power supply and\nelectrical components\n5.2. Perform basic repairs and\ninstallation\n\n• Lecture\n• Discussion\n• Demonstration\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 51 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n47\nCORE COMPETENCIES\n(166 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Tend diesel\nengine\n\n1.1 Perform pre-operation check\nof diesel engine and\nauxiliary equipment\n1.2 Tend diesel engine\n• Lecture/\nDiscussion\n• Demonstration\n• Practical\napplication\n• Practicum\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Interview\n2. Operate diesel\npower plant\n2.1 Operate the unit\n2.2 Respond to operation\nabnormalities\n• Lecture/\nDiscussion\n• Demonstration\n• Practical\napplication\n• Practicum\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Interview\n3. Maintain and\nrepair diesel\nengine systems\nand alternator\n3.1. Service aspiration system\n3.2. Service lube oil system\n3.3. Service cooling system\n3.4. Service fuel system\n3.5. Check condition of\nalternator\n• Lecture/\nDiscussion\n• Demonstration\n• Practical\napplication\n• Practicum\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Interview\n\n--- PDF PAGE 52 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n48\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should\nbe guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified\nby the industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Practical application System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training\ndelivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed\nto enhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or computer technologies.\n\n--- PDF PAGE 53 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n49\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n•\ncan communicate both oral and written;\n•\nphysically and mentally fit;\n•\nwith good moral character; and\n•\ncan perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees\nby the school or training center delivering the TVET program.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nDIESEL ENGINE POWER PLANT OPERATION AND MAINTENANCE – NC III\n\nRecommended list of tools, equipment and materials for the training in Diesel Power\nPlant Operation and Maintenance – NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2\nsets\nPail and Funnel\n2\nunits\nDiesel generating set\n163 KW\n1 set\nTurbo charger repair\nkit\n1\nLube oil pump\n1 set\nPPE\n1 pc\nBearing\n1\nunit\nFuel pump\n1\nunit\nInjector calibrating\nequipment\n10\nsets\nO-rings and washers\n1 set\nCombination wrench (8-\n32)\n1\nunit\nAir compressor with\nspray gun\n1 set\nCoolant pump repair\nkit\n1 set\nPliers and screw driver\n1 set Insulation tester\n100\nltrs.\nLube oil\n1 set\nMicrometer 150mm\n(inside and outside)\n2 set\nHydraulic jack at least\n3 tonner\n420\nltrs.\nDiesel Fuel\n1 pc\nVernier Caliper 150 mm\n1 set\nMulti tester\n30 kg\nRags\n1 pc\nHydrometer\n1 pc\nChain block\n2 pcs\nScrubbing pad\n1\nunit\nMagnetic dial gauge\n\n1 set\nLog sheet/ Log book\nand writing tools\n1 set\nPail and dipper\n5 ltr\nInhibitor\n1\nBench vise\n500 ltr\nSoft water\n1\nBearing Puller\n\n4 units\nAutomotive Battery,\n12 V, 21-plates\n1 set\nSocket wrench (8-32”)\n\n3 ltr\nDistilled water\n1 set\nAllen wrench\n\n4 pcs\nLube filter\n1 set\nFeeler gauge\n2 pcs\nFuel filter\n1 set\nA-frame\n2 pc\nAir filter\n2 set\nSlings\n2 kg\nGrease\n2 set\nEye bolts and shackles\n2 kg\nHi temp grease\n2 set\nWooden blocks\n\n2 set\nBattery terminal lugs\nand clamps\n2 set\nHeater\n\n20 pc\nTerminal lugs, ½” dia,\n1\nBearing Puller\n2 m.\nBattery cable\n1\nunit\nBearing heater\n\n10 m.\nAutomotive wire, no.\n12 AWG\n\n--- PDF PAGE 54 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n50\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\nHacksaw\n\n1 can\nBattery terminal\ncleaner 16 oz\n1 set\nElectric hand drill with bits\n\n1 can\nContact cleaner\n2 set\nSlings\n\n3 can\nPenetrating oil\n2 set\nWooden blocks\n\n1 gal\nRust remover\n1 set\nCrimping tool\n\n1 gal\nCarbon remover\n2 set\nSoldering set\n1 roll\nFoam\n1\nunit\nTorque wrench, 0-300 ft-\nlb. , ½-drive, click-type\n\n1 gal\nCarbon remover\n1\nunit\nTorque wrench, 0-500 ft-\nlb., ¾-drive, click-type\n\n2 gal\nDescaler\n\n10 pc\nSteel brush\n\n3 set\nPaint Brush, asstd.\nsizes\n\n1 pc\nPlastic brush\n\n6 pcs\nNozzles\n\n20 ltr\nSafety Solvent\n\n15\ncans\nInsulating varnish,\naerosol type\n\n8 ltr\nElectrical enamel\n\n10 roll\nElectrical tapes\n\n10 roll\nRubber tapes\n\n3 roll\nCotton tapes\n\n5 m\nSpaghetti tube, 10 mm\n\n1 kit\nWire marker\n\n24 pc\nCable ties 6”\n\nOTHER MATERIALS\n\no manufacturing\nspecifications\n\no repair manual\n\no maintenance\nmanual\n\no periodic\nmaintenance\nmanual\n\nINSTRUCTIONAL\nMATERIALS\n\no reference books\n\no professional\nemergency\n\no learning guides\n\no modules\n\no CD’s, VHS tapes,\ntransparencies\n\n--- PDF PAGE 55 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n51\n3.5 TRAINING FACILITIES\nDIESEL POWER PLANT OPERATION AND MAINTENANCE – NC III\n\nThe workshop must be made of reinforced concrete or steel structure. The size must\nbe suited on the requirements of the competencies. The facility should accommodate a\nmaximum of 20 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop Component Areas\n• Laboratory/Workshop\nArea\n-\n-\n100.00\n•\nLecture Room\n6.00 x 5.00\n30.00\n30.00\n• Tool, Supply & Storage\nRoom\n4.00 X 5.00\n20.00\n20.00\n• Learning Resource\nCenter\n4.00 x 5.00\n20.00\n20.00\n•\nWash Room and Toilet\n2.00 X 5.00\n10.00\n10.00\nTotal (Workshop Component)\n180.00\n•\nCirculation Area (30% of Workshop Component Space)\n54.00\nGrand Total (Building Space)\n234.00\nNote: The entries in the size in meters column are recommendations only. The grand total (building space)\nis the minimum space requirement for registration.\n\n3.6 TRAINERS’ QUALIFICATION\nUTILITIES SECTOR\n\nDIESEL POWER PLANT OPERATION AND MAINTENANCE – NC III\nTRAINER QUALIFICATION (TQ III)\n• Must be a holder of Diesel Power Plant Operation and Maintenance NC III or\nequivalent\n• Must have undergone training on Training Methodology III (TM III)\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience related to Diesel Power Plant\nOperation and Maintenance specifically in generating set servicing\n• Must be a civil service eligible (for government position or appropriate professional\nlicense issued by the Professional Regulatory Commission)\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of\nunits of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 56 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n52"
