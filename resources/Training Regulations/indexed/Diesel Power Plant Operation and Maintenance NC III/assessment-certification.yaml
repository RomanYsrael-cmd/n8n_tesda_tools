  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Diesel Power Plant Operation and Maintenance\nNC III, the candidate must demonstrate competence in all the units of competency listed in\nSection 1. Successful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of Diesel Power Plant Operation and\nMaintenance NC III must acquire Certificate of Competency in all the following core units\nof the qualification. Candidates may apply for assessment in any accredited assessment\ncenter.\n\n4.2.1\nTend Diesel Engine\n4.2.2\nOperate Diesel Power Plant\n4.2.2.1\nTend Diesel Engine\n4.2.2.2\nOperate Diesel Power Plant\n4.2.3\nMaintain and Repair Diesel Engine Systems and Alternator\n4.2.3.1\nTend Diesel Engine\n4.2.3.2\nMaintain and Repair Diesel Engine Systems and Alternator\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of competency\ncomprising a qualification, an individual shall be issued the corresponding National\nCertificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based training\nprograms.\n\n4.5.2 Experienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the “Procedures\nManual on Assessment and Certification” and “Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTOQCS)”..\n\n--- PDF PAGE 57 ---\nTR – Diesel Power Plant Operation and Maintenance NC III\n53\n"
}
