        "source_text": "AFF321202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It includes\nselection, operation and preventive maintenance of farm\ntools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n•\nSelect and use\nfarm tools\n\n1.1 Appropriate farm\ntools are identified\naccording to\nrequirement/use\n1.2 Farm tools are\nchecked for faults\nand defective tools\nreported in\naccordance with\nfarm procedures\n1.3 Appropriate tools\nare safely used\naccording to job\nrequirements and\nmanufacturers\nconditions\n\n1.1 Types and uses of\nfarm tools\n1.2Characteristics of\nfunctional tools\n1.3Checking tools for\ndefects/faults\n1.4Segregation and\nreporting defective\ntools\n1.5Uses of tools and\nequipment\n\n1.1Identifying farm tools\nfor the work\n1.2Checking the\nconditions of tools\n1.3Reporting defective\ntools\n1.4Using tools\n2\nSelect and\noperate farm\nequipment\n2.1 Identify\nappropriate farm\nequipment\n2.2 Instructional\nmanual of the\nfarm tools and\nequipment are\ncarefully read\nprior to operation\n2.3 Pre-operation\ncheck-up is\nconducted in line\nwith\nmanufacturers\nmanual\n2.4 Faults in farm\nequipment are\nidentified and\nreported in line\n2.1Types and operations\nof farm equipment\n2.2Standards operating\nprocedures of farm\nequipment\n2.3Instructional manual\nof equipment\n2.4Pre-operation check-\nup\n2.5Equipment\nSpecification\n2.6Procedures in\ncalibrating and use of\nequipment\n2.7Equipment faults\nidentification and\nreporting\n2.8Operation of\nequipment\n2.1Identifying appropriate\nfarm equipment for\nthe work\n2.2Reading instructional\nmanual.\n2.3Conducting pre-\noperation check-up\n2.4Identifying\nfaults/defects of farm\nequipment\n2.5Reporting on\ndefective farm\nequipment\n2.6Operating farm\nequipment\n2.7Following safety\nprocedures.\n\n--- PDF PAGE 47 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nwith farm\nprocedures\n2.5 Farm equipment\nused according to\nits function\n2.6 Safety procedures\nare followed.\n2.9 Codes and\nRegulations on\nenvironmental\nprotection\n2.10 Safety and keeping\nof equipment every\nafter use\n2.11 Safety measures\n\n3\nPerform\npreventive\nmaintenance\n3.1 Tools and\nequipment are\ncleaned\nimmediately after\nuse in line with\nfarm procedures\n3.2 Routine check-up\nand maintenance\nare performed\n3.3 Tools and\nequipment are\nstored in\ndesignated areas\nin line with farm\nprocedures\n\n2.1 Cleaning procedures\nof tools and\nequipment\n3.2 Maintenance\nprocedures of farm\nequipment\n3.3 Storage of tools and\nequipment\n3.4 Designated storage\nareas\n\n3.1 Cleaning tools and\nequipment\n3.2 Performing routinary\ncheck-up of tools and\nequipment\n3.3 Maintaining farm\nequipment\n3.4 Storing tools and\nequipment\n\n--- PDF PAGE 48 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 44\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Farm equipment\n\nFarm equipment include:\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Farm tools\nFarm tools includes:\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5 Measuring tools\n2.6 Garden tools\n3. Pre-operation check-up\nPre-operation check –up includes:\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and\nequipment\n1.2\nOperated farm equipment according to manual\nspecification\n1.3\nPerformed preventive maintenance\n\n2. Resource Implications\nThe following resources should be provided:\n2.1\nService/operational manual of farm tools and\nequipment\n2.2\nTools and equipment\n2.3\nFarm implements\n\n3. Method of Assessment\n\nCompetency in this unit must be assessed through:\n3.1\nDirect observation\n3.2\nPractical demonstration\n3.3\nThird Party Report\n\n4. Context of Assessment\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 49 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 45\n\nUNIT OF COMPETENCY : PERFORM ESTIMATION AND BASIC CALCULATION\n\nUNIT CODE :"
