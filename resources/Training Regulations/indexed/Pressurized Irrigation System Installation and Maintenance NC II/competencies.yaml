        "source_text": "--- PDF PAGE 51 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 47 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: PERFORM INSTALLATION OF PUMPS AND FLOW \nCONTROL DEVICES \n \nUNIT CODE \n: AFF712257 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes  \nrequired to prepare work plan, select equipment and \ntools, install pumps and control devices, evaluate \ninstallation, perform minor repairs, and perform shutting \ndown activities. \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \nwork on \npumping and \nflow control \nsystems \n1.1  Work plan and \ntimetable is prepared \nbased on work \nrequirements \n1.2  Hazards are identified \n1.3  Equipment and tools \nare selected and \nchecked \n1.4  Personal protective \nequipment (PPE)  are \nselected and worn \nbased on Rule 1080 of \nOSHS  \n1.1 Interpretation of \nsymbols and use \nof a legend on \nsite plans and \nspecifications, \nparticularly in \nrelation to the \nlocation of \nexisting features  \n1.2 Understanding of \ncompass \ndirections and \nhow to locate \nNorth from a site \nplan  \n1.3 An awareness of \nother plans that \nmay be referred to \nwhen setting out a \nsite for irrigation  \n1.4 Recognition of \nsite features and \nactions that can \nbe taken to either \nclear the site or \nadjust the system \nto fit  \n1.5 Hazard \nidentification and \nsafe work \nprocedures. \n1.6 Rule 1080 of \nOSHS \n \n1.1 Preparing work \nplan and \ntimetable \n1.2 Identifying \nhazards \n1.3 Selecting and \nchecking \nequipment and \ntools \n1.4Selecting and \nwearing of \npersonal \nprotective \nequipment (PPE) \n1.5 Practicing \noccupational \nhealth, safety \nand hazards \nelimination\n\n--- PDF PAGE 52 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 48 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED \nSKILLS \n2. Carry out \ninstallation \ntasks for \npumps and \ncontrol \ndevices \n2.1  Installation tasks for \npumps are carried out \naccording to \nmanufacturer \nguidelines and \nlegislative \nrequirements \n2.2  Installation tasks for \ncontrol devices are \ncarried out according \nto manufacturer \nguidelines \n2.3  Pumps and control \ndevices are checked \nbased on \nfunctionality \n2.4 Safety practices on \nhandling of pumps and \ncontrol devices are \napplied following \nOSHS Rule 1150, \n1080 and Rule 1200  \n2.5  Electrical safety \npractices are applied \nfollowing PNS PAES \n129 \n2.1 Types of pumps \nand their function and \nuse \n2.1 Types of flow \ncontrol devices \nand their purpose \n2.2 Basic principles of \nhydraulics and the \noperation of flows \n2.3 System layout  \n2.4  Principles of     \nelectricity and \nsafe work \nprocedures \n2.5  Lock-out \nprocedures for \nmechanical and \nelectrical \ninstallations \n2.6  Effective \nworkplace \ncommunication \nprocesses \n2.7  Materials \nhandling \n2.8  Landscape and \nground structure \nof work area \n2.9 Risk factors and \npotential hazards \n2.10 Equipment \noperation, \ncapacity and \nlimitations \n2.11 Effects of \nweather and \nconditions on \noperation of \nsystem, site and \nplant \n2.12 Flow \nmeasurement \nprinciples and \nprocedures \n2.13 Layout and \nperformance of \npipes and fittings  \n2.14 Function of \n2.1 Installing pumps \nInstalling control \ndevices \n2.1 Checking pumps \nand control \ndevices \n2.2 Applying safety \npractices based \non OSHS Rule \n1150, Rule 1200, \nand Rule 1080  \n2.3 Applying electrical \nsafety practices \nbased on PNS \nPAES 129 \n2.4 Practicing \noccupational \nhealth, safety and \nhazards \nelimination\n\n--- PDF PAGE 53 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 49 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED \nSKILLS \ncontrol systems. \n2.15 PNS PAES 129 \n– Electric Motor \n2.16 \nOSHS  \n- \nRule 1200 \n- \nRule 1150 \n- \nRule 1080 \n3. Monitor \nrequired flows \nand water \npressure of \nirrigation \nsystems \n3.1  Installed pumps and \ncontrol devices are \nevaluated following \nmonitoring schedule \n3.2  Potential operational \nproblems are identified \n3.3  Water pressure is \nchecked through \npressure gauge \n3.4  Identified problems \nare recorded and \nreported to immediate \nauthorities \n3.5 PPEs are worn \nfollowing OSHS Rule \n1080 \n3.1Impact of the \nprinciples of \nhydraulics on the \noperation of flows \n3.2 System layout \n3.3 Risk factors and \npotential hazards \n3.4 Equipment    \noperation, \ncapacity and \nlimitations \n3.5 Effects of weather \nand conditions on \noperation of \nsystem and site \n3.6 System flow \ncontrol \nmechanisms \n3.7 Relevant lock-out \nprocedures for \nmechanical and \nelectrical \ninstallations \n3.8 OSHS \n– Rule 1080 \n- \nIRR of RA \n11058 \n3.1 Evaluating \ninstalled \npumps and \ncontrol \ndevices \n3.2 Identifying \npotential \noperational \nproblems \n3.3 Checking \nwater \npressure \n3.4 Recording \nand \nreporting \nidentified \nproblems \n3.5 Wearing of \nPPEs \nfollowing \nOSHS Rule \n1080 \n3.6 Practicing \noccupationa\nl health, \nsafety and \nhazards \nelimination \n5. Perform \nshutting down \nactivities \n5.1   Waste management \nis practiced according \nto Ecological Solid \nWaste Management \nAct of 2000. \n5.2   Good housekeeping \nis practiced following \n5S \n5.3   Work site is restored \nbased on \nenvironmental and \norganizational \nrequirements \n5.1 System flow \ncontrol \nmechanisms \n5.2 Relevant lock-\nout procedures \nfor mechanical \nand electrical \ninstallations \n5.3 OSHS \n– Rule 1080 \n5.3 Safety \norientation on \nBasic Health \n5.1 Disposing wastes \n5.2 Practicing good \nhousekeeping \n5.3 Restoring work \nsite \n5.4 Recording and \nreporting activities \n5.5 Practicing \noccupational \nhealth, safety and \nhazards \nelimination\n\n--- PDF PAGE 54 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 50 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED \nSKILLS \n5.4 Tools and equipment \nare clean and store \nfollowing workplace \nprocedures.   \n5.5  Activities are recorded \nand reported in \naccordance with \norganizational \nprocedures \nand Safety \nPractice \n5.4 Principles of 5S \n5.5 Effective \nCommunication \nand Record \nkeeping. \n \nRA 9003-\nEcological Solid \nWaste \nManagement Act \nof 2000\n\n--- PDF PAGE 55 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 51 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hazards \nHazards may include but not limited to: \n1.1 Snake bites \n1.2 Solar radiation \n1.3 Dust \n1.4 Noise \n1.5 Air- and soil-borne micro-organisms \n1.6 Chemicals \n1.7 Hazardous substances \n1.8 Sharp hand tools and equipment \n1.9 Holes \n1.10 Slippery \n1.11 Uneven surfaces \n2. PPEs \nPPEs may include but not limited to: \n2.1 Long sleeves \n2.2 Gloves \n2.3 Rubber boots \n2.4 Working hat \n2.5 Sun glasses \n3. Pumps \nPumps may include but not limited to: \n3.1 Centrifugal \n3.2 Archimedes screw type \n3.3 Submersible \n3.4 Positive displacement \n4. Control devices \nControl devices may include but not limited to: \n4.1 Regulators \n4.2 Valves \n4.3 Controller \n5. Functionality \nFunctionality may include but not limited to: \n5.1 Suction \n5.2 Discharge \n6. Evaluation of devices \nEvaluation of devices may include but not limited to: \n6.1 Using flow meter \n6.2 Timed-volume method\n\n--- PDF PAGE 56 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 52 \nEVIDENCE GUIDE \n \n1.  Critical aspects of competency Assessment requires evidence that the candidate: \n1.1   Planned and prepared for work on pumping and flow control \nsystems \n1.2   Carried out installation tasks for pumps and control devices \n1.3   Monitored required flows and water pressure of irrigation \nsystems \n1.4  Performed shutting down activities \n2.  Resource implications  \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools, materials, supplies and equipment needed to perform \nrequired tasks \n2.3 References and manuals \n2.4 PPEs \n2.5 First aid kit \n3.  Methods of assessment \nCompetency in this unit must be assessed through: \n3.1 Demonstration/direct observation with oral questioning \n3.2 Written examination \n \n4.  Context for assessment \n4.1 Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
