eck-up \nPre-operation check –up includes: \n3.1 Tires \n3.2 Brake fluid \n3.3 Fuel \n3.4 Water \n3.5 Oil \n3.6 Lubricants \n3.7 Battery \n \nEVIDENCE GUIDE \n1. Critical Aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nCorrectly identified appropriate farm tools and \nequipment \n1.2 \nOperated farm equipment according to manual \nspecification  \n1.3 \nPerformed preventive maintenance \n \n2. Resource Implications \nThe following resources should be provided: \n2.1 \nService/operational manual of farm tools and \nequipment \n2.2 \nTools and equipment \n2.3 \nFarm implements \n \n3. Method of Assessment \n \nCompetency in this unit must be assessed through: \n3.1 \nDirect observation  \n3.2 \nPractical demonstration \n3.3 \nThird Party Report \n \n4. Context of Assessment \nAssessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
