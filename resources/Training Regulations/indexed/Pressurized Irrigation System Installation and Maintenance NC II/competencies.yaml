        "source_text": "--- PDF PAGE 39 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 35 \nUNIT OF COMPETENCY \n: PRACTICE ENTREPRENEURIAL SKILLS IN THE \nWORKPLACE  \nUNIT CODE \n: 400311218 \nUNIT DESCRIPTOR \n: This \nunit \ncovers \nthe \noutcomes \nrequired \nto \napply \nentrepreneurial workplace best practices and implement \ncost-effective operations \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Apply     \n    entrepreneurial   \n    workplace best   \n    practices \n  \n1.1 Good practices \nrelating to workplace \noperations are \nobserved and \nselected following \nworkplace policy. \n1.2 Quality procedures \nand practices are \ncomplied with \naccording to \nworkplace \nrequirements.  \n1.3 Cost-conscious \nhabits in resource \nutilization are \napplied based on  \nindustry standards.  \n1.1 Workplace best \npractices, policies \nand criteria \n1.2 Resource utilization \n1.3Ways in fostering \nentrepreneurial \nattitudes: \n• \nPatience \n• \nHonesty \n• \nQuality-\nconsciousness \n• \nSafety-\nconsciousness \n• \nResourcefulness  \n1.1 Communication \nskills \n1.2 Complying with \nquality procedures \n \n \n \n2. Communicate \nentrepreneurial \nworkplace best \npractices  \n \n2.1 Observed good \npractices relating to \nworkplace operations \nare communicated to \nappropriate person. \n2.2 Observed quality \nprocedures and \npractices are \ncommunicated to  \nappropriate person \n2.3 Cost-conscious \nhabits in resource \nutilization are \ncommunicated based \non industry \nstandards.  \n2.1 Workplace best \npractices, policies \nand criteria \n2.2  Resource utilization \n2.3  Ways in fostering \nentrepreneurial \nattitudes: \n• \nPatience \n• \nHonesty \n• \nQuality-\nconsciousness \n• \nSafety-\nconsciousness \n• \nResourcefulness  \n2.1 Communication \nskills \n2.2 Complying with \nquality procedures \n2.3 Following \nworkplace \ncommunication \nprotocol\n\n--- PDF PAGE 40 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 36 \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Implement cost-\neffective operations \n3.1 Preservation and \noptimization of \nworkplace resources \nis implemented in \naccordance with  \nenterprise policy \n3.2 Judicious use of \nworkplace tools, \nequipment and \nmaterials are \nobserved according \nto manual and work \nrequirements. \n3.3 Constructive \ncontributions to office \noperations are made \naccording to \nenterprise \nrequirements. \n3.4 Ability to work within \none’s allotted time \nand finances is \nsustained.  \n \n3.1  Optimization of \nworkplace resources \n3.2  5S procedures and \nconcepts \n3.3  Criteria for cost-\neffectiveness \n3.4  Workplace \nproductivity \n3.5  Impact of \nentrepreneurial \nmindset to \nworkplace \nproductivity \n3.6  Ways in fostering \nentrepreneurial \nattitudes: \n• \nQuality-\nconsciousness \n• \nSafety-\nconsciousness \n3.1 Implementing \npreservation and \noptimizing \nworkplace \nresources \n3.2 Observing \njudicious use of \nworkplace tools, \nequipment and \nmaterials \n3.3 Making \nconstructive \ncontributions to \noffice operations \n3.4 Sustaining ability \nto work within \nallotted time and \nfinances\n\n--- PDF PAGE 41 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII                                January 11, 2019   \n \n 37 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.Good practices \nMay include: \n1.1 Economy in use of resources \n1.2 Documentation of quality practices  \n \n2.Resources utilization \nMay include: \n2.1 Consumption/ use of consumables \n2.2 Use/Maintenance of assigned equipment \nand furniture \n2.3 Optimum use of allotted /available time \n \n \nEVIDENCE GUIDE \n1.