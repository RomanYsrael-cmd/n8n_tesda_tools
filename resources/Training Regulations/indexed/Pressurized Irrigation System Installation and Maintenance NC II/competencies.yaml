        "source_text": "AFF321201\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to perform safety measures effectively and\nefficiently. It includes identifying areas, tools, materials,\ntime and place in performing safety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine\nareas of\nconcern for\nsafety measures\n1.1 Work tasks are\nidentified in line with\nfarm operations\n1.2 Place for safety\nmeasures are\ndetermined in line with\nfarm operations\n1.3 Time for safety\nmeasures are\ndetermined in line with\nfarm operations\n1.4 Appropriate tools,\nmaterials and outfits\nare prepared in line with\njob requirements\n1.1 Different work tasks\nin farm operations\n1.2 Place and time for\nimplementation of\nsafety measures\n1.3 Different hazards in\nthe workplace\n1.4 Types of tools,\nmaterials and outfits\n1.5 Preparation of tools,\nmaterials and outfits\n\n1.1 Identifying\nwork tasks in\nfarm\noperations\n1.2 Determining\nplace and\ntime for\nimplementati\non of safety\nmeasures\n1.3 Reading\nlabels,\nmanuals and\nother basic\nsafety\ninformation\n1.4 Identifying\neffective/functi\nonal tools,\nmaterials and\noutfit\n1.5 Preparing\ntools,\nmaterials and\noutfits\n1.6 Discarding\ndefective\ntools, and\nmaterials\n\n2. Apply\nappropriate\nsafety measures\n2.1Tools and materials are\nused according to\nspecifications and\nprocedures\n\n2.1Uses and functions\nof tools\n2.2Outfits and how to\nwear it.\n\n2.1Using tools\nand materials in\nthe workplace\n2.2Wearing of\noutfits\n\n--- PDF PAGE 43 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 39\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.2Outfits are worn according\nto farm requirements\n2.3 Effectivity/shelf\nlife/expiration of materials\nare strictly observed\n2.4 Emergency procedures\nare known and followed to\nensure a safe work\nrequirement\n2.5 Hazards in the workplace\nare identified and reported\nin line with farm guidelines\n2.3Expiration/shelf life\nof materials\n2.4Proper disposal of\nexpired materials\n2.5Environmental rules\nand regulations\n2.6Emergency\nprocedures\n2.7Hazards\nidentification and\nreporting\n2.8Communication skills\n2.9OSHS\n\n2.3 Observing\nexpiration/\nshelf life of\nmaterials\n2.4Disposing of\nexpired\nmaterials\n2.5Following\nemergency\nprocedures\n2.6Identifying and\nreporting of\nhazards in\nworkplace\narea.\n\n3. Safe keep\n/dispose tools,\nmaterials and\noutfit\n3.1Used tools and outfit are\ncleaned after use and\nstored in designated\nareas\n3.2Unused materials are\nproperly labeled and\nstored according to\nmanufacturers\nrecommendation and farm\nrequirements\n3.3 Waste materials are\ndisposed according to\nmanufacturers,\ngovernment and farm\nrequirements\n\n3.1Procedures of\ncleaning used tools\nand outfits\n3.2Label and storage\nunused materials\n3.3Disposal of wastes\nmaterials\n3.4Manufacturers\nrecommendation on\nkeeping materials\n3.5Environmental rules\nand regulations\n3.1Cleaning used\ntools and\noutfit\n3.2Labelling and\nstoring\nunused\nmaterials\n3.3Disposing\nwaste\nmaterials\n\n--- PDF PAGE 44 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the subsectors:\n1.1\nCrop Production\n1.2\nPost-harvest\n1.3\nAgri-marketing\n1.4\nFarm Equipment\n2. Place\n2.1\nStock room/storage areas/warehouse\n2.2\nField/farm/orchard\n3. Time\n3.1\nFertilizer and pesticides application\n3.2\nFeed mixing and feeding\n3.3\nHarvesting and hauling\n4. Tools, materials and outfits\n4.1\nTools\n4.1.1\nWrenches\n4.1.2\nScrew driver\n4.1.3\nPliers\n4.2\nOutfit\n4.2.1\nMasks\n4.2.2\nGloves\n4.2.3\nBoots\n4.2.4\nOverall coats\n4.2.5\nHat\n4.2.6\nEye goggles\n5. Emergency procedures\n5.1\nLocation of first aid kit\n5.2\nEvacuation\n5.3\nAgencies contract\n5.4\nFarm emergency procedures\n6. Hazards\n6.1\nChemical\n6.2\nElectrical\n6.3\nFalls\n\n--- PDF PAGE 45 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 41\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Cleaned and stored tools, materials and outfit in designated\nfacilities\n\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Farm location\n2.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Practical demonstration\n3.2 Third Party Report\n\n4. Context of\nAssessment\nAssessment may occur in the workplace or in a simulated workplace\nor as part of a team under limited supervision\n\n--- PDF PAGE 46 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 42\nUNIT OF COMPETENCY : USE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
