  "source_text": "1.\nFLOW\nThe movement of fluids, through pipe, fittings, valves or other\nvessels generally measured in Gallons Per Minute (GPM),\nGallons Per Hour (GPH), Cubic Feet Per Second (ft3/s), Cubic\nMeters Per Hour (m3/h), Liters Per Minute (l/m), or Liters Per\nSecond (l/s)\n\n2.\nFLOW CONTROL\nis a mechanism that regulates the flow or pressure of liquid. To\nbe able to effectively manage flow control, flow control valves\nare used. The flow control of liquids is regulated as these\nrespond to signals that are produced by independent devices\nlike temperature gauges as well as flow meters. Flow control is\nan important aspect in process plants where there are many\ncontrol loops that hold essential process variables like flow,\npressure, temperature and level. With proper flow control the\nquality of the end product can be guaranteed and disturbances\nthat could cause corrosion damage can be prevented.\n3.\nFLOW\nCONTROL VALVE\nregulates the flow or pressure of a fluid. Control valves normally\nrespond to signals generated by independent devices such as\nflow meters\n\n4.\nMAINLINE\nis pressurized pipe running from the point of connection to the\nzone control valves.\n\n5.\nMANIFOLD\nrefers to group of valves\n\n6.\nPRESSURE\nis measured with a pressure gauge and expressed in pounds\nper square inch (PSI), bars or kPa. It is the amount of energy\navailable to move water through pipe, valves, sprinklers or other\ncomponents. Static pressure is the pressure measured when no\nwater is flowing through a closed system. Dynamic pressure is\nthe pressure measured when the system is open, or water is\nflowing through the system.\n\n7.\nPRESSURIZED\nIRRIGATION SYSTEMS\nwater is pressurized and precisely applied to the plants under\npressure\nthrough\na system of\npipes. Pressurized\nirrigation systems, as opposed to the surface irrigation systems,\nare more effective in application of irrigation water to the crops\n\n8.\nPUMP\nis a mechanical device that converts mechanical forms of energy\ninto hydraulic energy.\n\n9.\nVALVE\nis a device to control flow.\n\n10. VOLUME\nis expressed in gallons per minute (GPM), gallons per hour\n(GPH) cubic feet per second (ft3/s), cubic meters per hour\nm3/h), liters per minute (l/m), or liters per second (l/s). Volume is\nused to describe either the amount of water available or the\namount of water used.\n\n--- PDF PAGE 100 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 96\n\nTRAINING REGULATIONS (TRs)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nPressurized Irrigation Installation and Maintenance NCII\nQualification Code:\nAFFPIM218\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces\nVersion\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\nCircular\n00\nDocument Created\nPressurized Irrigation\nInstallation and\nMaintenance NCII\nNot Applicable\nTB No. 2019-04\nJanuary 16,\n2019\nIn transit\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 101 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 97",
