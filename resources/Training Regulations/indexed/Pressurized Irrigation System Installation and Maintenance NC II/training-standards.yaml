    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude Technology, Science, Math, English/Communication, and Safety to\nEnvironment. Includes also green technology, issues on health and drugs and\ncater to person with disabilities (PWD’s).\n\nCourse Title: IRRIGATION SYSTEM INSTALLATION AND MAINTENANCE\nNC Level NC II\n\nNominal Training Duration:\n\n 37 hrs\nBasic Competencies\n\n 72 hrs\nCommon Competencies\n\n 70 hrs\nCore Competencies\n Total 179 hrs\n\nCourse Description:\n\nThis course is designed to provide the students/learner with knowledge,\ndesirable attitudes and skills required to perform the following competencies in\naccordance with industry standards: perform installation of pumps and flow control\ndevices, perform installation of pipelines and water distribution devices and perform\nmaintenance of pressurized irrigation system.\n\n To obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 66 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 62\nBASIC COMPETENCIES\n(37 HOURS)\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n•\nOral evaluation\n•\nWritten\nexamination\n•\nObservation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and procedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n\n• Group discussion\n• Lecture\n• Demonstration\n•\nOral evaluation\n•\nWritten\nexamination\n•\nObservation\n2 hours\n\n--- PDF PAGE 67 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 63\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1.3. Complete relevant\nwork related\ndocuments\n•\nDescribe Communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people of\nsocial range in the workplace\n•\nGather and provide information in\nresponse to workplace requirements\n•\nComplete work related documents\n•\nGroup discussion\n•\nLecture\n•\nDemonstration\n•\nRole play\n•\nOral\nevaluation\n•\nWritten\nexamination\n•\nObservation\n2 hours\n\n2. Work in a team\nenvironment\n2.1 Describe team role\nand scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the\ndifferent sources of information\n• Lecture/ Discussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n--- PDF PAGE 68 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 64\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Identify one’s role\nand responsibility\nwithin team\n•\nRole play :\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n•Role Play\n•Lecture/ Discussion\n• Role Play\n• Written Test\n1 hour\n\n2.3 Work as a team\nmember\n• Participate in group planning activities\n\n• Role play : Communication protocols\n\n• Participate in the discussion of standard\nwork procedures and practices\n• Group work\n• Role Play\n• Lecture/ Discussion\n• Role Play\n• Written Test\n1 hour\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Analyze routine/procedural problems\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n3.2 Look for solutions\nto routine problems\n• Review of the current industry hardware\nand software products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes\nand procedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n\n--- PDF PAGE 69 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 65\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Formulate possible solutions to problems\nand document procedures for reporting\n\n3.1 Recommend\nsolutions to\nproblems\n• Discuss standard operating procedures\nand documentation processes\n•Group discussion\n•Lecture\n•Demonstration\n•Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 hour\n4. Develop Career\nand Life\nDecisions\n4.3 Manage one’s\nemotion\n• Demonstrate self-management strategies\nthat assist in regulating behavior and\nachieving personal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger,\nworry, anxiety, etc.\n• Manage properly one’s emotions and\nrecognize situations that cannot be\nchanged and accept them and remain\nprofessional\n• Recall instances that demonstrate self-\ndiscipline, working independently and\nshowing initiative to achieve personal and\ncareer goals\n• Share experiences that show confidence,\nand resilience in the face of setbacks and\nfrustrations and other negative emotions\nand unpleasant situations in the workplace\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n\n--- PDF PAGE 70 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 66\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.4 Develop reflective\npractice\n• Enumerate strategies to improve one’s\nattitude in the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation,\nAnalysis, Conclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/ dislikes;\nthrough showing of self-confidence\n• Demonstrate self-acceptance and being\nable to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n•Brainstorming\n• Demonstration\n•5 Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n\n4.5 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-regulation\nbased on Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by\nStephen Covey, transactional analysis,\npsycho-spiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility,\nadaptability, etc.\n• Determine strengths and weaknesses\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n\n1 hour\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to do\nthings better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Appreciate positive impacts and challenges\nin innovation\n• Show mastery of the different types of\nchanges and levels of participation in the\nworkplace\n• Discuss 7 h