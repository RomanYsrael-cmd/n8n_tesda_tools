      "source_text": "3.2\nTRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Learning is modular in structure;\n\nc. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nd. Training is supplemented with appropriate instructional materials to carry-out\nindividualized and self-paced learning strategies;\n\ne. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nf. Criteria for assessment and promotion are based on the standards set by the\nindustry in competently performing a workplace function. Ways of collecting\nevidence may come in various forms.\n\ng. Assessment criteria, conditions and progress-monitoring mechanism are\ntransparent and explained in advance.\n\nh. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\ni. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\nj. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other modalities\nwhen designing and delivering training programs:\n\nSchool/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\n\n--- PDF PAGE 92 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 88\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\nThere would be no across-the-board SIT or OJT for all programs covered by\nthe TRs. Whether SIT/OJT along a particular qualification will be mandatory\nor not shall be defined in the TR to be promulgated. A curriculum mix with\ndominant practicum component is preferred.\n\nThe SIT or OJT component may be considered optional for the trainees who\nhave had previous relevant work experience in the qualification for a period of\ntime considered as sufficient by the qualified trainer concerned as indicated in\nthe Training regulations.\n\n• Project-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\nEnterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\nCommunity-Based – refers to short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 93 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 89"
