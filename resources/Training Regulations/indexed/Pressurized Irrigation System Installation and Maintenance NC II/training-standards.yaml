iver the training on PRESSURIZED IRRIGATION SYSTEM\nINSTALLATION AND MAINTENANCE NC II should have the following:\n\n• Must be a holder of National TVET Training Certification (NTTC) in\nPressurized Irrigation System Installation and Maintenance NC II\n\n• Must have at least two (2) years relevant industry experience within the last\nfive (5) years\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees in a structured learning\nprogram to determine their achievement of units of competencies. It is administered by\nthe trainer/assessor at end of each learning module.\n\nThe result of the institutional assessment may be considered as evidence for the\nassessment for national certification.\n\nAs a matter of policy, graduates of programs registered with TESDA under these\ntraining regulations are required to undergo mandatory national competency\nassessment upon completion of the program.\n\n--- PDF PAGE 96 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 92"
