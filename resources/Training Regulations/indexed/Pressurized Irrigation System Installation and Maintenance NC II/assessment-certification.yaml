  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to a full\nqualification or employable unit(s) of competency in partial fulfillment of the\nrequirements of the national qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all units of competency listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2 The qualification of Pressurized Irrigation System Installation and\nMaintenance NC II can be attained by demonstration of competence\nthrough full assessment covering all the units required.\n\n4.1.3 The qualification of Pressurized Irrigation System Installation and\nMaintenance NC II may be acquired through the accumulation of\nCertificates of Competency in the following units of competencies:\n\n COC 1 Perform installation of pumps and flow control devices\nCOC 2 Perform installation of pipes and water distribution devices\nCOC 3 Perform maintenance of pressurized irrigation system\n\nUpon accumulation and submission of the above COCs acquired, an\nindividual shall be issued the corresponding National Certificate signed by\nthe TESDA Director General. Certificates of Competency (COCs) shall be\nissued to candidates who have been assessed as competent in any of the\nabove COCs (COC 1, COC 2, COC 3).\n\n4.1.4 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.5 Any of following are qualified to apply for assessment :\n\n4.1.5.1\nGraduating students/trainees of WTR-registered programs,\ngraduates of NTR programs or graduates of formal/non-\nformal/informal including enterprise-based training programs\n\n--- PDF PAGE 97 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 93\nrelated\nto\nPRESSURIZED\nIRRIGATION\nSYSTEM\nINSTALLATION AND MAINTENANCE NCII\n\n4.1.5.2\nIndustry workers in PRESSURIZED IRRIGATION SYSTEM\nINSTALLATION AND MAINTENANCES NCII\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 98 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 94\n"
