rol the quality of the end product can be guaranteed and disturbances that could cause corrosion damage can be prevented. 3. regulates the flow or pressure of a fluid. Control valves normally respond to signals generated by independent devices such as flow meters 4. is pressurized pipe running from the point of connection to the zone control valves. 5. refers to group of valves 6. is measured with a pressure gauge and expressed in pounds per square inch (PSI), bars or kPa. It is the amount of energy available to move water through pipe, valves, sprinklers or other components. Static pressure is the pressure measured when no water is flowing through a closed system. Dynamic pressure is the pressure measured when the system is open, or water is flowing through the system. 7. water is pressurized and precisely applied to the plants under pressure through a system of pipes. Pressurized irrigation systems, as opposed to the surface irrigation systems, are more effective in application of irrigation water to the crops 8. is a mechanical device that converts mechanical forms of energy into hydraulic energy. 9. is a device to control flow."
