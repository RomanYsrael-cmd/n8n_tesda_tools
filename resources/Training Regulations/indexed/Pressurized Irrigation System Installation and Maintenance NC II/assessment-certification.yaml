      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The qualification of Pressurized Irrigation System Installation and Maintenance NC II can be attained by demonstration of competence through full assessment covering all the units required. 4.1.3 The qualification of Pressurized Irrigation System Installation and Maintenance NC II may be acquired through the accumulation of Certificates of Competency in the following units of competencies: COC 1 Perform installation of pumps and flow control devices COC 2 Perform installation of pipes and water distribution devices COC 3 Perform maintenance of pressurized irrigation system Upon accumulation and submission of the above COCs acquired, an individual shall be issued the corresponding National Certificate signed by the TESDA Director General. Certificates of Competency (COCs) shall be issued to candidates who have been assessed as competent in any of the above COCs (COC 1, COC 2, COC 3). 4.1.4 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.5 Any of following are qualified to apply for assessment : 4.1.5.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non- formal/informal including enterprise-based training programs PRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019"
