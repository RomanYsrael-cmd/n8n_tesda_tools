  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to a full\nqualification or employable unit(s) of competency in partial fulfillment of the\nrequirements of the national qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all units of competency listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2 The qualification of Pressurized Irrigation System Installation and\nMaintenance NC II can be attained by demonstration of competence\nthrough full assessment covering all the units required.\n\n4.1.3 The qualification of Pressurized Irrigation System Installation and\nMaintenance NC II may be acquired through the accumulation of\nCertificates of Competency in the following units of competencies:\n\n COC 1 Perform installation of pumps and flow control devices\nCOC 2 Perform installation of pipes and water distribution devices\nCOC 3 Perform maintenance of pressurized irrigation system\n\nUpon accumulation and submission of the above COCs acquired, an\nindividual shall be issued the corresponding National Certificate signed by\nthe TESDA Director General. Certificates of Competency (COCs) shall be\nissued to candidates who have been assessed as competent in any of the\nabove COCs (COC 1, COC 2, COC 3).\n\n4.1.4 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.5 Any of following are qualified to apply for assessment :\n\n4.1.5.1\nGraduating students/trainees of WTR-registered programs,\ngraduates of NTR programs or graduates of formal/non-\nformal/informal including enterprise-based training programs\n\n--- PDF PAGE 97 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 93\nrelated\nto\nPRESSURIZED\nIRRIGATION\nSYSTEM\nINSTALLATION AND MAINTENANCE NCII\n\n4.1.5.2\nIndustry workers in PRESSURIZED IRRIGATION SYSTEM\nINSTALLATION AND MAINTENANCES NCII\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in\nthe \"Procedures Manual on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 98 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 94\nCOMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR\n\nPerform installation of pumps\nand flow control devices\nPerform installation of\npipelines and water\ndistribution devices\nPerform maintenance of\npressurized irrigation system\nParticipate in workplace\ncommunication\nWork in team\nenvironment\nSolve/address general\nworkplace problems\nDevelop career and life\ndecisions\n\nContribute to workplace\ninnovation\nPresent relevant\ninformation\nPractice occupational safety\nand health policies and\nprocedures\nExercise efficient and\neffective sustainable\npractices in the workplace\nPractice\nentrepreneurial skills\nin the workplace\nApply Safety Measures in\nFarm Operations\nUse Farm Tools and\nEquipment\nPerform Estimation and Basic\nCalculation\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 99 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 95\nGLOSSARY OF TERMS\n\n1.\nFLOW\nThe movement of fluids, through pipe, fittings, valves or other\nvessels generally measured in Gallons Per Minute (GPM),\nGallons Per Hour (GPH), Cubic Feet Per Second (ft3/s), Cubic\nMeters Per Hour (m3/h), Liters Per Minute (l/m), or Liters Per\nSecond (l/s)\n\n2.\nFLOW CONTROL\nis a mechanism that regulates the flow or pressure of liquid. To\nbe able to effectively manage flow control, flow control valves\nare used. The flow control of liquids is regulated as these\nrespond to signals that are produced by independent devices\nlike temperature gauges as well as flow meters. Flow control is\nan important aspect in process plants where there are many\ncontrol loops that hold essential process variables like flow,\npressure, temperature and level. With proper flow control the\nquality of the end product can be guaranteed and disturbances\nthat could cause corrosion damage can be prevented.\n3.\nFLOW\nCONTROL VALVE\nregulates the flow or pressure of a fluid. Control valves normally\nrespond to signals generated by independent devices such as\nflow meters\n\n4.\nMAINLINE\nis pressurized pipe running from the point of connection to the\nzone control valves.\n\n5.\nMANIFOLD\nrefers to group of valves\n\n6.\nPRESSURE\nis measured with a pressure gauge and expressed in pounds\nper square inch (PSI), bars or kPa. It is the amount of energy\navailable to move water through pipe, valves, sprinklers or other\ncomponents. Static pressure is the pressure measured when no\nwater is flowing through a closed system. Dynamic pressure is\nthe pressure measured when the system is open, or water is\nflowing through the system.\n\n7.\nPRESSURIZED\nIRRIGATION SYSTEMS\nwater is pressurized and precisely applied to the plants under\npressure\nthrough\na system of\npipes. Pressurized\nirrigation systems, as opposed to the surface irrigation systems,\nare more effective in application of irrigation water to the crops\n\n8.\nPUMP\nis a mechanical device that converts mechanical forms of energy\ninto hydraulic energy.\n\n9.\nVALVE\nis a device to control flow.\n\n10. VOLUME\nis expressed in gallons per minute (GPM), gallons per hour\n(GPH) cubic feet per second (ft3/s), cubic meters per hour\nm3/h), liters per minute (l/m), or liters per second (l/s). Volume is\nused to describe either the amount of water available or the\namount of water used.\n\n--- PDF PAGE 100 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 96\n\nTRAINING REGULATIONS (TRs)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nPressurized Irrigation Installation and Maintenance NCII\nQualification Code:\nAFFPIM218\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces\nVersion\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\nCircular\n00\nDocument Created\nPressurized Irrigation\nInstallation and\nMaintenance NCII\nNot Applicable\nTB No. 2019-04\nJanuary 16,\n2019\nIn transit\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 101 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 97\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) would like\nto recognize the commitment of industry stakeholders who shared their time and\nexpertise for the development of this Training Regulations. This TR is also dedicated in\nmemory of Engr. George Q. Canapi, a member of technical experts panel.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nENGR. GEORGE Q. CANAPI (+)\nTechnical Expert\nAgricultural Machinery Manufacturers and\nDistributors Association (AMMDA), Inc.\nMakati City, Metro Manila\nENGR. AREODEAR RICO\nTechnical Expert\nPhilippine Society of Agricultural Engineers\nMetro Manila\n\nENGR. REYNALDO P. GREGORIO\nTechnical Expert\nPhilippine Center for Postharvest Development\nand Mechanization\nScience City of Muñoz, Nueva Ecija\n\n(+)Deceased\n\nTHE PARTICIPANTS OF NATIONAL VALIDATION\n\nMR. IRENEO C. AGULTO\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\n\nMR. ARMANDO N. CEPINO, JR.\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\nMS. MELISA E. AGULTO\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\n\nMR. MARVIN M. CINENSE\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\nMR. EMER-ROSE CORTEZ-ANG\nValidator\nDepartment of Agriculture-Central Agri-\nFishery Engineering Division\nQuezon City\n\nMR. JONATHAN V. FABULA\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\nMR. VICTORINO T. DAYLAN\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\n\nMS. VITALIANA U. MALAMOY\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\n\n--- PDF PAGE 102 ---\nPRESSURIZED IRRIGATION INSTALLATION AND MAINTENANCE NCII January 11, 2019\n\n 98\nMS. CLAIRE MARIE H. CASTILLO\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\nMR. WENDY C. MATEO\nValidator\nCentral Luzon State University\nScience City of Muñoz, Nueva Ecija\n\nThe Members of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n• Qualifications and Standards Office (QSO)\n\nTESDA – QSO Technical Facilitators\n\nCompetency Standards Development Division\n\nMS. BERNADETTE N. SERVAZ- AUDIJE\nMS. CHERRY L. TORALDE\nMS. MELCHRIS A. ATIS\n\nCompetency Programs and Standards Development Division\n\nMS. MERCEDES E. JAVIER\nMS. FORTUNATA L. BACO\n\n--- PDF PAGE 103 ---\nTraining Regulation are available in both printed and electronic copies\nFor more information please contact:\nTECHNICAL EDUCATION AND SKILLS DEVELOPMENT AUTHORITY (TESDA)\nTele Fax No.:818-7728\nor visit our website: www.tesda.gov.ph"
