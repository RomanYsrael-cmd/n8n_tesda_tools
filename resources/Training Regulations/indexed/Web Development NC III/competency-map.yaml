  "source_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate III level\nsigned by the TESDA Director-General.\n\n4.1.2 The qualification of Web Development NC III may be attained through:\n\n4.1.2.1 Accumulation of Certificates of Competency (COCs) in all the\nfollowing units of competencies:\n\nCOC-1. Developing Responsive Web Design\n• Utilize software methodologies\n• Develop responsive web design\n\nCOC-2. Creating Interactive Websites (using JavaScript)\n• Utilize software methodologies\n• Create interactive websites\n\nCOC-3. Developing website backend\n• Utilize software methodologies\n• Develop website backend\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\n4.1.2.2 Demonstration of competence through a single comprehensive\nproject-type assessment covering all required units of competency\nof this qualification.\n\n4.1.3 Upon accumulation and submission of all COCs acquired for all the\nrelevant units of competency comprising this qualification, an individual\nshall be issued the corresponding National Certificate.\n\n--- PDF PAGE 94 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n90\n4.1.4 Assessment shall cover all competencies, with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.5 Any of the following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal or non-formal including enterprise-based\ntraining programs.\n4.5.2 Experienced workers (wage employed or self-employed)\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in\nthe \"Operating Procedures on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment.\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to manage the assessment activities of candidates\nfor national certification.\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited\nby TESDA is authorized to assess the competencies of candidates for\nnational certification.\n\n--- PDF PAGE 95 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n91\nANNEX A. ICT COMPETENCY MAP – WEB DEVELOPMENT NC III\n\nBASIC COMPETENCIES\n\nReceive and Respond\nto Workplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize information\nPlan and Organize\nWork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nApply Critical\nThinking and Thought\nOrganization\nApply Quality\nStandards\nPerform Computer\nOperation\n\nCORE COMPETENCIES\n\nCommunicate\neffectively in a customer\ncontact center\nRender quality\ncustomer service\nUtilize enterprise/\ncompany technology\nConduct contact\ncenter campaign\nProvide specialized\nsupport and assistance\nto customers\nLead a contact center\nwork team\nManage the activities\nof a contact center\nwork team\nUse business\ntechnology\nUse medical\ntechnology to carry\nout task\nProduce text from audio\ntranscription\nReview/edit documents\nLead a team in\ndelivering quality\nservice\nApply traditional\ndrawing techniques\nfor animation\nProduce traditional\ncleaned-up drawings\nProduce traditional in-\nbetween drawings\nProduce Traditional key\nposes/drawings for\nanimation\nCreate 2D digital\nanimation\nExport Animation into\nVideo file format\nProduce digital\ncleaned-up drawings\nProduce digital in-\nbetween drawings\nProduce background\ndesigns\nComposite and edit\nanimation sequence\nCreate 3D digital\nanimation\nProduce storyboard\nfor animation\nCoordinate the\nproduction of animation\nProduce over-all\ndesigns for animation\nProduce key drawings\nfor animation\nCreate 3D models for\nanimation\nApply 3D texture and\nlighting to 3D models\nSet character rigging\nCreate 2D digital\nanimation\nProduce cleaned-up\nand in-between\ndrawings\nUse an authoring\ntool to create an\ninteractive sequence\nAnimate character\nComposite and render\nanimation sequence\nProduce key drawings\nfor animation\nUtilize Software\nMethodologies\nDevelop\nResponsive Web\nDesign\nCreate Interactive\nWebsites (Using JavaScript)\nDevelop Website\nBackend Systems\nDevelop designs for a\nlogo\nDevelop designs for\nprint media\nDevelop designs for\nuser experience\nDevelop designs for\nuser interface\nDevelop designs for\nproduct packaging\nDesign booth and\nproduct/window display\n\n--- PDF PAGE 96 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n92\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgements on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\n outcome terms the functions that a person performs in the workplace\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual.\nIt provides information on critical aspects of competency, underpinning\nknowledge, underpinning skills, resource implications, assessment method and\ncontext of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when\nevidence should be collected\n\n--- PDF PAGE 97 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n93\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualifications - is a cluster of units of competencies that meets job roles and are\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an\nindividual’s skills, knowledge and attitudes gained from life and work experiences\noutside registered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serve as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 98 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n94\nSECTOR SPECIFIC\n\n1. Attributes - a piece of information that determines the properties of a field or tag\nin a database or a string of characters in a display.\n2. Browser – a software package that provides the user interface for accessing\nInternet, intranet and extranet Web sites.\n3. Cloud server is a logical server that is built, hosted and delivered through a cloud\ncomputing platform over the Internet. Cloud servers possess and exhibit similar\ncapabilities and functionality to a typical server but are accessed remotely from a\ncloud service provider.\n4. Code minification, also called code minimization or code compression - is the\nprocess of removing all unnecessary characters from the source code. This\nincludes removing all unwanted white space characters, new line characters,\ncomments, etc. Code minification does not affect the functionality of the source\ncode. It however, improves load time (and your web app’s performance) because\nthe size of the file to be downloaded now reduces.\n5. Computer – a device that has the ability to accept data; internally store and\nexecute a program of instructions; perform mathematical, logical, and\nmanipulative operations on data; and report the results.\n6. Computer Terminal – any input/output device connected by telecommunications\nlinks to a computer.\n7. CSS – Cascading Style Sheet is a language that describes the style of an HTML\ndocument. CSS describes how HTML elements should be displayed.\n8. Data - objective measurements of the attributes (characteristics) of entities such\nas people, places, things, and events.\n9. Data structure - is a particular way of storing and organizing information in a\ncomputer so that it can be retrieved and used most productively. Different kinds of\ndata structures are meant for different kinds of applications, and some are highly\nspecialized to specific tasks.\n10. Database conceptual model - is also known as the data model as data model\ncan be used to describe the conceptual schema when a database system is\nimplemented. It hides the internal details of physical storage and targets on\ndescribing entities, datatype, relationships and constraints.\n11. Documentation – a collection of documents or information.\n12. Document object model (DOM) - is a programming API for HTML and XML\ndocuments. It defines the logical structure of documents and the way a document\nis accessed and manipulated. In the DOM specification, the term \"document\" is\nused in the broad sense - increasingly, XML is being used as a way of\nrepresenting many different kinds of information that may be stored in diverse\nsystems, and much of this would traditionally be seen as data rather than as\ndocuments. Nevertheless, XML presents this data as documents, and the DOM\nmay be used to manage this data.\n13. Domain name - is an identification string that defines a realm of administrative\nautonomy, authority or control within the Internet. Domain names are formed by\nthe rules and procedures of the Domain Name System (DNS). Any name\nregistered in the DNS is a domain name.\n14. Edit – to modify the form or format of data\n\n--- PDF PAGE 99 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n95\n15. Entity relationship diagram (ERD) - is a graphical representation of an\ninformation system that shows the relationship between people, objects, places,\nconcepts or events within that system. An ERD is a data modeling technique that\ncan help define business processes and can be used as the foundation for\na relational database.\n16. Ergonomics - the science and technology emphasizing the safety, comfort, and\nease of use of human-operated machines. The goal of ergonomics is to produce\nsystems that are user-friendly: safe, comfortable and easy to use.\n17. Firewall - A firewall is a network security device that grants or rejects network\naccess to traffic flows between an untrusted zone (e.g., the Internet) and a trusted\nzone (e.g., a private or corporate network).\n18. Front-end web development, also known as client-side development is the\npractice of producing HTML, CSS and JavaScript for a website\nor Web Application so that a user can see and interact with them directly\n19. FTP - the File Transfer Protocol (FTP) is a standard network protocol used for the\ntransfer of computer files from a server to a client using the Client–server model\non a computer network. FTP is built on a client-server model architecture and\nuses separate control and data connections between the client and the server.\n20. Full-stack web developer – somebody who is knowledgeable on both front-end\nand back-end web development.\n21. HTML – hypertext markup language, a markup language that is used to\ncreate documents on the World Wide Web incorporating text, graphics,\nsound, video, and hyperlinks.\n22. HTML tag - the <html> tag tells the browser that this is an HTML document. The\n<html> tag represents the root of an HTML document. The <html> tag is the\ncontainer for all other HTML elements (except for the <!DOCTYPE> tag).\n23. Hyperlink - is a reference to data that the reader can directly follow either by\nclicking, tapping, or hovering. A hyperlink points to a whole document or to a\nspecific element within a document. Hypertext is text with hyperlinks.\n24. Information – data placed in a meaningful and useful context for an end user.\n25. Information and Communication Technology (ICT) - refers to technologies\nassociated with the transmission and exchange of data in the form of sound, text,\nvisual images, signals or any combination of those forms through the use of\ndigital technology. It encompasses such services as telecommunications, posts,\nmultimedia, electronic commerce, broadcasting, and information technology.\n26. JavaScript (\"JS\" for short) is a full-fledged dynamic programming language that,\nwhen applied to an HTML document, can provide dynamic interactivity on\nwebsites. It is an interpreted programming language with object-oriented\ncapabilities.\n27. JavaScript syntax - the syntax of JavaScript is the set of rules that define a\ncorrectly structured JavaScript program. The examples below make use of the log\nfunction of the console object present is most browsers for standard text output.\nThe JavaScript standard library lacks an official standard text output function\n28. Lighttpd - is a secure, fast, compliant, and very flexible web-server that has\nbeen optimized for high-performance environments. It has a very low memory\nfootprint compared to other webservers and takes care of cpu-load. Its advanced\nfeature-set (FastCGI, CGI, Auth, Output-Compression, URL-Rewriting and many\n\n--- PDF PAGE 100 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n96\nmore) make lighttpd the perfect webserver-software for every server that suffers\nload problems.\n29. Modernizr - is a JavaScript library which is designed to detect HTML5 and CSS3\nfeatures in various browsers, which lets JavaScript avoid using unimplemented\nfeatures or use a workaround such as a shim to emulate them. Modernizr aims to\nprovide this feature detection in a complete and standardized manner.\n30. Model–view–controller (MVC) - is a software design pattern for implementing\nuser interfaces on computers. It divides a given application into three\ninterconnected parts in order to separate internal representations of information\nfrom the ways that information is presented to and accepted from the user. The\nMVC design pattern decouples these major components allowing for\nefficient code reuse and parallel development.\n31. Moodboard - an arrangement of images, materials, pieces of text, etc., intended\nto evoke or project a particular style or concept.\n32. MVC framework - the Model-View-Controller (MVC) architectural pattern\nseparates an application into three main components: the model, the view, and\nthe controller. The ASP.NETMVC framework provides an alternative to the\nASP.NET Web Forms pattern for creating Web applications.\n33. MVC Pattern stands for Model-View-Controller Pattern - is used to separate\napplication's concerns. Model - Model represents an object or JAVA POJO\ncarrying data. It can also have logic to update controller if its data changes.\n34. Normalization or database normalization - is the process of organizing the\ncolumns (attributes) and tables (relations) of a relational database to reduce data\nredundancy, insertion anomaly, update anomaly & deletion anomaly and\nimprove data integrity.\n35. Plug-in - a small piece of software that supplements a larger program (as a\nbrowser) program or makes a program work better\n36. Quality assurance – methods for ensuring that information system are free from\nerrors and fraud and provide information products of high quality.\n37. Script tag - the <script> tag is used to define a client-side script (JavaScript). The\n<script> element either contains scripting statements, or it points to an external\nscript file through the SRC attribute. Common uses for JavaScript are image\nmanipulation, form validation, and dynamic changes of content\n38. Search engine optimization (SEO) is the process of affecting the visibility of a\nwebsite or a web page in a web search engine's unpaid results—often referred to\nas \"natural\", \"organic\", or \"earned\" results.\n39. Server-side scripting - is a technique used in web development which involves\nemploying scripts on a web server which produce a response customized for\neach user's (client's) request to the website. ... Server-side scripting is often\nused to provide a customized interface for the user.\n40. Simulation - the process of imitating a real phenomenon with a set of\nmathematical formulas. Advanced computer programs can simulate weather\nconditions, chemical reactions, atomic reactions, and even biological processes.\n41. Sitemap is an XML file that lists URLs for a site along with additional metadata\nabout each URL (when it was last updated, how often it usually changes, and\nhow important it is, relative to other URLs in the site) so that search engines can\nmore intelligently crawl the site.\n\n--- PDF PAGE 101 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n97\n42. Sitemap - is a list of pages of a web site accessible to crawlers or users. It can be\neither a document in any form used as a planning tool for Web design, or a Web\npage that lists the pages on a website, typically organized in hierarchical fashion.\n43. Software – computer programs and procedures concerned with the operation of\nan information system.\n44. SQL (Structured Query Language) -is a domain-specific language used in\nprogramming and designed for managing data held in a relational database\nmanagement system (RDBMS), or for stream processing in a relational data\nstream management system (RDSMS).\n45. Standards – measures of performance developed to evaluate the progress of a\nsystem toward its objectives.\n46. Style guide (or manual of style) - is a set of standards for the writing and design\nof documents, either for general use or for a specific publication, organization, or\nfield. (It is often called a style sheet, though that term has other meanings.)\nA style guide establishes and enforces style to improve communication.\n47. System – an assembly of methods, procedures, or techniques unified by\nregulated interaction to form an organized whole\n48. Uptime - is the amount of time that a server has stayed up and running. This is\nusually listed as a percentage, like \"99.9% uptime.\" Uptime is a great measure of\nhow good a Web hosting provider is at keeping their systems up and running\n49. User experience (UX) refers to a person's emotions and attitudes about using a\nparticular product, system or service. It includes the practical, experiential,\naffective, meaningful and valuable aspects of human–computer interaction and\nproduct ownership.\n50. User- friendly – a characteristic of human-operated equipment and systems that\nmakes them safe, comfortable, and easy to use.\n51. Web analytics is the measurement, collection, analysis and reporting of\nweb data for purposes of understanding and optimizing web usage. Web\nanalytics is not just a process for measuring web traffic but can be used as a tool\nfor business and market research, and to assess and improve the effectiveness\nof a website. Web analytics also provides information about the number of visitors\nto a website and the number of page views. It helps gauge traffic and popularity\ntrends which is useful for market research.\n52. Web design is a process of conceptualizing, planning, and building a collection of\nelectronic files that determine the layout, colors, text styles, structure, graphics,\nimages, and use of interactive features that deliver pages to your site visitors.\n53. Web developer is a programmer who specializes in, or is specifically engaged in,\nthe development of World Wide Web applications, or distributed network\napplications that are run over HTTP from a web server to a web browser\n54. Web programming refers to the writing, markup and coding involved in Web\ndevelopment, which includes Web content, Web client and server scripting and\nnetwork security. The most common languages used for Web programming are\nXML, HTML, JavaScript, Perl 5 and PHP\n55. Web server - is a computer system that processes requests via HTTP, the\nbasic network protocol used to distribute information on the World Wide Web. The\nterm can refer to the entire system, or specifically to the software that accepts\nand supervises the HTTP requests.\n\n--- PDF PAGE 102 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n98\n56. Web service - is any piece of software that makes itself available over the\ninternet and uses a standardized XML messaging system. XML is used to encode\nall communications to a web service. For example, a client invokes a web\nservice by sending an XML message, and then waits for a corresponding XML\nresponse.\n57. Web service API (Application Programming Interface) - is the means by which\nthird parties can write code that interfaces with other code. A Web Service is a\ntype of API, one that almost always operates over HTTP (though some, like\nSOAP, can use alternate transports, like SMTP).\n58. Website is a collection of related web pages, including multimedia content,\ntypically identified with a common domain name, and published on at least\none web server. A website may be accessible via a public Internet Protocol (IP)\nnetwork, such as the Internet, or a private local area network (LAN), by\nreferencing a uniform resource locator (URL) that identifies the site.\n59. Wireframe – is a visual representation of a website. It allows designers and\ndevelopers to present proposed functions, graphics elements, structure, and\ncontent of a website with simple line drawings.\n60. W3C - the World Wide Web Consortium (W3C) is the main international\nstandards organization for the World Wide Web.\n\n--- PDF PAGE 103 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n99\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Web Development NC III\nQualification Code: ICTWBD318\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces\nVersion\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nWeb Development NC\nIII\nNot Applicable\nTB No. 2018-05/\nFebruary 27, 2018\nTESDA Circular\nNo. __ s. 2018\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 104 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n100\n ACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERT COMMITTEE – FY 2017\n\nMS. MARIE GRACE A. DIMARANAN\n\nBoard Director, Animation Council of the Philippines, Inc. (ACPI)\n\nMR. MIKHAIL JOSEPH T. TORRES\nManaging Director, EACOMM\n\nMR. KARLO MARTIN M. ROBOSA\nSenior Business Analyst, EACOMM\n\nMR. JONATHAN V. MARTIN\nSenior Product Marketing, Natural Intelligence Solutions/LLOOPP\n\nMR. ROMUALDO JOSE V. VERDAN II\nOwner/Manager, CADWEB Business Solutions\n\n• THE ANIMATION COUNCIL OF THE PHILIPPINES, INC. (ACPI)\n\n• THE PHILIPPINE SOFTWARE INDUSTRY ASSOCIATION (PSIA)\n\n• THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS\nDEVELOPMENT COMMITTEE\n\n• THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING\nREGULATION\n\nMs. Candice Michelle T. Garcia\n-\nPointwest Technologies Corp.\nMr. Alexis John Solis\n-\nPointwest Technologies Corp.\nMr. Jarek Boilo T. Cabautan\n-\nTen Rabbit\nMr. Raphael Angelo K. Warren\n-\nEACOMM Corporation\nMr. John Henry M. Pacay\n-\nEACOMM Corporation\nMr. Jotham M. Hernandez\n-\nPinwheel Developers\nMs. Niña Ana Marie Jocelyn A. Sales\n-\nIGDA Manila/DLSU/iAcademy/CIIT\n\n• THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT\n\n• Qualifications and Standards Office (QSO)\n\n1. DIR. IMELDA B. TAGANAS\n2. MR. JULFORD C. ABASOLO\n- QSO-TESDA\n- CSDD-QSO-TESDA\n3. MR. SAMUEL E. CALADO, JR.\n- CSDD-QSO-TESDA\n4. MR. VENZEL V. CONCOLES\n- CSDD-QSO-TESDA"
