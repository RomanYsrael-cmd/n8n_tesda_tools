      "definition": "in a database or a string of characters in a display. 2. Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. 3. Cloud server is a logical server that is built, hosted and delivered through a cloud computing platform over the Internet. Cloud servers possess and exhibit similar capabilities and functionality to a typical server but are accessed remotely from a cloud service provider. 4. Code minification, also called code minimization or code compression - is the process of removing all unnecessary characters from the source code. This includes removing all unwanted white space characters, new line characters, comments, etc. Code minification does not affect the functionality of the source code. It however, improves load time (and your web app’s performance) because the size of the file to be downloaded now reduces. 5. Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 6. Computer Terminal – any input/output device connected by telecommunications links to a computer. 7. CSS – Cascading Style Sheet is a language that describes the style of an HTML document. CSS describes how HTML elements should be displayed. 8. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. 9. Data structure - is a particular way of storing and organizing information in a computer so that it can be retrieved and used most productively. Different kinds of data structures are meant for different kinds of applications, and some are highly specialized to specific tasks. 10. Database conceptual model - is also known as the data model as data model can be used to describe the conceptual schema when a database system is implemented. It hides the internal details of physical storage and targets on describing entities, datatype, relationships and constraints. 11. Documentation – a collection of documents or information. 12. Document object model (DOM) - is a programming API for HTML and XML documents. It defines the logical structure of documents and the way a document is accessed and manipulated. In the DOM specification, the term \"document\" is used in the broad sense - increasingly, XML is being used as a way of representing many different kinds of information that may be stored in diverse systems, and much of this would traditionally be seen as data rather than as documents. Nevertheless, XML presents this data as documents, and the DOM may be used to manage this data. 13. Domain name - is an identification string that defines a realm of administrative autonomy, authority or control within the Internet. Domain names are formed by the rules and procedures of the Domain Name System (DNS). Any name registered in the DNS is a domain name. 14. Edit – to modify the form or format of data"
