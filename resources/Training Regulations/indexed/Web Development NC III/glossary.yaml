      "definition": "_________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 97 42. Sitemap - is a list of pages of a web site accessible to crawlers or users. It can be either a document in any form used as a planning tool for Web design, or a Web page that lists the pages on a website, typically organized in hierarchical fashion. 43. Software – computer programs and procedures concerned with the operation of an information system. 44. SQL (Structured Query Language) -is a domain-specific language used in programming and designed for managing data held in a relational database management system (RDBMS), or for stream processing in a relational data stream management system (RDSMS). 45. Standards – measures of performance developed to evaluate the progress of a system toward its objectives. 46. Style guide (or manual of style) - is a set of standards for the writing and design of documents, either for general use or for a specific publication, organization, or field. (It is often called a style sheet, though that term has other meanings.) A style guide establishes and enforces style to improve communication. 47. System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 48. Uptime - is the amount of time that a server has stayed up and running. This is usually listed as a percentage, like \"99.9% uptime.\" Uptime is a great measure of how good a Web hosting provider is at keeping their systems up and running 49. User experience (UX) refers to a person's emotions and attitudes about using a particular product, system or service. It includes the practical, experiential, affective, meaningful and valuable aspects of human–computer interaction and product ownership. 50. User- friendly – a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use. 51. Web analytics is the measurement, collection, analysis and reporting of web data for purposes of understanding and optimizing web usage. Web analytics is not just a process for measuring web traffic but can be used as a tool for business and market research, and to assess and improve the effectiveness of a website. Web analytics also provides information about the number of visitors to a website and the number of page views. It helps gauge traffic and popularity trends which is useful for market research. 52. Web design is a process of conceptualizing, planning, and building a collection of electronic files that determine the layout, colors, text styles, structure, graphics, images, and use of interactive features that deliver pages to your site visitors. 53. Web developer is a programmer who specializes in, or is specifically engaged in, the development of World Wide Web applications, or distributed network applications that are run over HTTP from a web server to a web browser 54. Web programming refers to the writing, markup and coding involved in Web development, which includes Web content, Web client and server scripting and network security. The most common languages used for Web programming are XML, HTML, JavaScript, Perl 5 and PHP 55. Web server - is a computer system that processes requests via HTTP, the basic network protocol used to distribute information on the World Wide Web. The term can refer to the entire system, or specifically to the software that accepts and supervises the HTTP requests."
