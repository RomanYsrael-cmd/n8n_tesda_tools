program or makes a program work better 36. Quality assurance – methods for ensuring that information system are free from errors and fraud and provide information products of high quality. 37. Script tag - the <script> tag is used to define a client-side script (JavaScript). The <script> element either contains scripting statements, or it points to an external script file through the SRC attribute. Common uses for JavaScript are image manipulation, form validation, and dynamic changes of content 38. Search engine optimization (SEO) is the process of affecting the visibility of a website or a web page in a web search engine's unpaid results—often referred to as \"natural\", \"organic\", or \"earned\" results. 39. Server-side scripting - is a technique used in web development which involves employing scripts on a web server which produce a response customized for each user's (client's) request to the website. ... Server-side scripting is often used to provide a customized interface for the user. 40. Simulation - the process of imitating a real phenomenon with a set of mathematical formulas. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, and even biological processes. 41. Sitemap is an XML file that lists URLs for a site along with additional metadata about each URL (when it was last updated, how often it usually changes, and how important it is, relative to other URLs in the site) so that search engines can more intelligently crawl the site."
