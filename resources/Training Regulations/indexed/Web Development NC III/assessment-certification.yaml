  "arrangements": [
    {
      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1 To attain the National Qualification of Web Development NC III, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III level signed by the TESDA Director-General."
    },
    {
      "number": "4.1",
      "text": "2 The qualification of Web Development NC III may be attained through:"
    },
    {
      "number": "4.1",
      "text": "2.1 Accumulation of Certificates of Competency (COCs) in all the following units of competencies: COC-1. Developing Responsive Web Design • Utilize software methodologies • Develop responsive web design COC-2. Creating Interactive Websites (using JavaScript) • Utilize software methodologies • Create interactive websites COC-3. Developing website backend • Utilize software methodologies • Develop website backend Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units."
    },
    {
      "number": "4.1",
      "text": "2.2 Demonstration of competence through a single comprehensive project-type assessment covering all required units of competency of this qualification."
    },
    {
      "number": "4.1",
      "text": "3 Upon accumulation and submission of all COCs acquired for all the relevant units of competency comprising this qualification, an individual shall be issued the corresponding National Certificate. --- PDF PAGE 94 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 90"
    },
    {
      "number": "4.1",
      "text": "4 Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "number": "4.1",
      "text": "5 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.5",
      "text": "1 Graduates of formal or non-formal including enterprise-based training programs."
    },
    {
      "number": "4.5",
      "text": "2 Experienced workers (wage employed or self-employed)"
    },
    {
      "number": "4.1",
      "text": "6 The guidelines on assessment and certification are discussed in detail in the \"Operating Procedures on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\"."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE"
    },
    {
      "number": "4.2",
      "text": "1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment."
    },
    {
      "number": "4.2",
      "text": "2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to manage the assessment activities of candidates for national certification."
    },
    {
      "number": "4.2",
      "text": "3 Accredited Competency Assessor. Only competency assessor accredited by TESDA is authorized to assess the competencies of candidates for national certification. --- PDF PAGE 95 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 91 ANNEX A. ICT COMPETENCY MAP – WEB DEVELOPMENT NC III Receive and Respond to Workplace Communication Work with Others Demonstrate work values Practice basic housekeeping procedures Participate in Workplace Communication Work in a Team Environment Practice career professionalism Practice occupational health and safety procedures Lead Workplace Communication Lead Small Team Develop and practice negotiation skills Solve Problems Related to Work Activities Use mathematical concepts and techniques Use relevant technologies Utilize Specialist Communication Skills Develop Team and Individuals Apply Problem Solving Techniques in the Workplace Collect, analyze and organize information Plan and Organize Work Promote environmental protection Apply Critical Thinking and Thought Organization Apply Quality Standards Perform Computer Operation Communicate effectively in a customer contact center Render quality customer service Utilize enterprise/ company technology Conduct contact center campaign Provide specialized support and assistance to customers Lead a contact center work team Manage the activities of a contact center work team Use business technology Use medical technology to carry out task Produce text from audio transcription Review/edit documents Lead a team in delivering quality service Apply traditional drawing techniques for animation Produce traditional cleaned-up drawings Produce traditional in- between drawings Produce Traditional key poses/drawings for animation Create 2D digital animation Export Animation into Video file format Produce digital cleaned-up drawings Produce digital in- between drawings Produce background designs Composite and edit animation sequence Create 3D digital animation Produce storyboard for animation Coordinate the production of animation Produce over-all designs for animation Produce key drawings for animation Create 3D models for animation Apply 3D texture and lighting to 3D models Set character rigging Create 2D digital animation Produce cleaned-up and in-between drawings Use an authoring tool to create an interactive sequence Animate character Composite and render animation sequence Produce key drawings for animation Utilize Software Methodologies Develop Responsive Web Design Create Interactive Websites (Using JavaScript) Develop Website Backend Systems Develop designs for a logo Develop designs for print media Develop designs for user experience Develop designs for user interface Develop designs for product packaging Design booth and product/window display --- PDF PAGE 96 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 92"
    },
    {
      "number": "1",
      "text": "Certification - is the process of verifying and validating the competencies of a person through assessment"
    },
    {
      "number": "2",
      "text": "Certificate of Competency (COC) – is a certification issued to individuals who pass the assessment for a single unit or cluster of units of competency"
    },
    {
      "number": "3",
      "text": "Common Competencies - are the skills and knowledge needed by all people working in a particular industry"
    },
    {
      "number": "4",
      "text": "Competency - is the possession and application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace"
    },
    {
      "number": "5",
      "text": "Competency Assessment - is the process of collecting evidence and making judgements on whether competency has been achieved"
    },
    {
      "number": "6",
      "text": "Competency Standard (CS) - is the industry-determined specification of competencies required for effective work performance"
    },
    {
      "number": "7",
      "text": "Context of Assessment - refers to the place where assessment is to be conducted or carried out"
    },
    {
      "number": "8",
      "text": "Core Competencies - are the specific skills and knowledge needed in a particular area of work - industry sector/occupation/job role"
    },
    {
      "number": "9",
      "text": "Critical aspects of competency - refers to the evidence that is essential for successful performance of the unit of competency"
    },
    {
      "number": "10",
      "text": "Elective Competencies - are the additional skills and knowledge required by the individual or enterprise for work"
    },
    {
      "number": "11",
      "text": "Elements - are the building blocks of a unit of competency. They describe in outcome terms the functions that a person performs in the workplace"
    },
    {
      "number": "12",
      "text": "Evidence Guide - is a component of the unit of competency that defines or identifies the evidences required to determine the competence of the individual. It provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, assessment method and context of assessment"
    },
    {
      "number": "13",
      "text": "Level - refers to the category of skills and knowledge required to do a job"
    },
    {
      "number": "14",
      "text": "Method of Assessment - refers to the ways of collecting evidence and when evidence should be collected --- PDF PAGE 97 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 93"
    },
    {
      "number": "15",
      "text": "National Certificate (NC) – is a certification issued to individuals who achieve all the required units of competency for a national qualification defined under the Training Regulations. NCs are aligned to specific levels within the PTQF"
    },
    {
      "number": "16",
      "text": "Performance Criteria - are evaluative statements that specify what is to be assessed and the required level of performance"
    },
    {
      "number": "17",
      "text": "Qualifications - is a cluster of units of competencies that meets job roles and are significant in the workplace. It is also a certification awarded to a person on successful completion of a course in recognition of having demonstrated competencies in an industry sector"
    },
    {
      "number": "18",
      "text": "Range of Variables - describes the circumstances or context in which the work is to be performed"
    },
    {
      "number": "19",
      "text": "Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s skills, knowledge and attitudes gained from life and work experiences outside registered training programs"
    },
    {
      "number": "20",
      "text": "Resource Implications - refers to the resources needed for the successful performance of the work activity described in the unit of competency. It includes work environment and conditions, materials, tools and equipment"
    },
    {
      "number": "21",
      "text": "Basic Competencies - are the skills and knowledge that everyone needs for work"
    },
    {
      "number": "22",
      "text": "Training Regulations (TR) – refers to the document promulgated and issued by TESDA consisting of competency standards, national qualifications and training guidelines for specific sectors/occupations. The TR serve as basis for establishment of qualification and certification under the PTQF. It also serves as guide for development of competency-based curricula and instructional materials including registration of TVET programs offered by TVET providers"
    },
    {
      "number": "25",
      "text": "Unit of Competency – is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF --- PDF PAGE 98 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 94"
    },
    {
      "number": "1",
      "text": "Attributes - a piece of information that determines the properties of a field or tag in a database or a string of characters in a display."
    },
    {
      "number": "2",
      "text": "Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites."
    },
    {
      "number": "3",
      "text": "Cloud server is a logical server that is built, hosted and delivered through a cloud computing platform over the Internet. Cloud servers possess and exhibit similar capabilities and functionality to a typical server but are accessed remotely from a cloud service provider."
    },
    {
      "number": "4",
      "text": "Code minification, also called code minimization or code compression - is the process of removing all unnecessary characters from the source code. This includes removing all unwanted white space characters, new line characters, comments, etc. Code minification does not affect the functionality of the source code. It however, improves load time (and your web app’s performance) because the size of the file to be downloaded now reduces."
    },
    {
      "number": "5",
      "text": "Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results."
    },
    {
      "number": "6",
      "text": "Computer Terminal – any input/output device connected by telecommunications links to a computer."
    },
    {
      "number": "7",
      "text": "CSS – Cascading Style Sheet is a language that describes the style of an HTML document. CSS describes how HTML elements should be displayed."
    },
    {
      "number": "8",
      "text": "Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events."
    },
    {
      "number": "9",
      "text": "Data structure - is a particular way of storing and organizing information in a computer so that it can be retrieved and used most productively. Different kinds of data structures are meant for different kinds of applications, and some are highly specialized to specific tasks."
    },
    {
      "number": "10",
      "text": "Database conceptual model - is also known as the data model as data model can be used to describe the conceptual schema when a database system is implemented. It hides the internal details of physical storage and targets on describing entities, datatype, relationships and constraints."
    },
    {
      "number": "11",
      "text": "Documentation – a collection of documents or information."
    },
    {
      "number": "12",
      "text": "Document object model (DOM) - is a programming API for HTML and XML documents. It defines the logical structure of documents and the way a document is accessed and manipulated. In the DOM specification, the term \"document\" is used in the broad sense - increasingly, XML is being used as a way of representing many different kinds of information that may be stored in diverse systems, and much of this would traditionally be seen as data rather than as documents. Nevertheless, XML presents this data as documents, and the DOM may be used to manage this data."
    },
    {
      "number": "13",
      "text": "Domain name - is an identification string that defines a realm of administrative autonomy, authority or control within the Internet. Domain names are formed by the rules and procedures of the Domain Name System (DNS). Any name registered in the DNS is a domain name."
    },
    {
      "number": "14",
      "text": "Edit – to modify the form or format of data --- PDF PAGE 99 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 95"
    },
    {
      "number": "15",
      "text": "Entity relationship diagram (ERD) - is a graphical representation of an information system that shows the relationship between people, objects, places, concepts or events within that system. An ERD is a data modeling technique that can help define business processes and can be used as the foundation for a relational database."
    },
    {
      "number": "16",
      "text": "Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use."
    },
    {
      "number": "17",
      "text": "Firewall - A firewall is a network security device that grants or rejects network access to traffic flows between an untrusted zone (e.g., the Internet) and a trusted zone (e.g., a private or corporate network)."
    },
    {
      "number": "18",
      "text": "Front-end web development, also known as client-side development is the practice of producing HTML, CSS and JavaScript for a website or Web Application so that a user can see and interact with them directly"
    },
    {
      "number": "19",
      "text": "FTP - the File Transfer Protocol (FTP) is a standard network protocol used for the transfer of computer files from a server to a client using the Client–server model on a computer network. FTP is built on a client-server model architecture and uses separate control and data connections between the client and the server."
    },
    {
      "number": "20",
      "text": "Full-stack web developer – somebody who is knowledgeable on both front-end and back-end web development."
    },
    {
      "number": "21",
      "text": "HTML – hypertext markup language, a markup language that is used to create documents on the World Wide Web incorporating text, graphics, sound, video, and hyperlinks."
    },
    {
      "number": "22",
      "text": "HTML tag - the <html> tag tells the browser that this is an HTML document. The <html> tag represents the root of an HTML document. The <html> tag is the container for all other HTML elements (except for the <!DOCTYPE> tag)."
    },
    {
      "number": "23",
      "text": "Hyperlink - is a reference to data that the reader can directly follow either by clicking, tapping, or hovering. A hyperlink points to a whole document or to a specific element within a document. Hypertext is text with hyperlinks."
    },
    {
      "number": "24",
      "text": "Information – data placed in a meaningful and useful context for an end user."
    },
    {
      "number": "25",
      "text": "Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology."
    },
    {
      "number": "26",
      "text": "JavaScript (\"JS\" for short) is a full-fledged dynamic programming language that, when applied to an HTML document, can provide dynamic interactivity on websites. It is an interpreted programming language with object-oriented capabilities."
    },
    {
      "number": "27",
      "text": "JavaScript syntax - the syntax of JavaScript is the set of rules that define a correctly structured JavaScript program. The examples below make use of the log function of the console object present is most browsers for standard text output. The JavaScript standard library lacks an official standard text output function"
    },
    {
      "number": "28",
      "text": "Lighttpd - is a secure, fast, compliant, and very flexible web-server that has been optimized for high-performance environments. It has a very low memory footprint compared to other webservers and takes care of cpu-load. Its advanced feature-set (FastCGI, CGI, Auth, Output-Compression, URL-Rewriting and many --- PDF PAGE 100 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 96 more) make lighttpd the perfect webserver-software for every server that suffers load problems."
    },
    {
      "number": "29",
      "text": "Modernizr - is a JavaScript library which is designed to detect HTML5 and CSS3 features in various browsers, which lets JavaScript avoid using unimplemented features or use a workaround such as a shim to emulate them. Modernizr aims to provide this feature detection in a complete and standardized manner."
    },
    {
      "number": "30",
      "text": "Model–view–controller (MVC) - is a software design pattern for implementing user interfaces on computers. It divides a given application into three interconnected parts in order to separate internal representations of information from the ways that information is presented to and accepted from the user. The MVC design pattern decouples these major components allowing for efficient code reuse and parallel development."
    },
    {
      "number": "31",
      "text": "Moodboard - an arrangement of images, materials, pieces of text, etc., intended to evoke or project a particular style or concept."
    },
    {
      "number": "32",
      "text": "MVC framework - the Model-View-Controller (MVC) architectural pattern separates an application into three main components: the model, the view, and the controller. The ASP.NETMVC framework provides an alternative to the ASP.NET Web Forms pattern for creating Web applications."
    },
    {
      "number": "33",
      "text": "MVC Pattern stands for Model-View-Controller Pattern - is used to separate application's concerns. Model - Model represents an object or JAVA POJO carrying data. It can also have logic to update controller if its data changes."
    },
    {
      "number": "34",
      "text": "Normalization or database normalization - is the process of organizing the columns (attributes) and tables (relations) of a relational database to reduce data redundancy, insertion anomaly, update anomaly & deletion anomaly and improve data integrity."
    },
    {
      "number": "35",
      "text": "Plug-in - a small piece of software that supplements a larger program (as a browser) program or makes a program work better"
    },
    {
      "number": "36",
      "text": "Quality assurance – methods for ensuring that information system are free from errors and fraud and provide information products of high quality."
    },
    {
      "number": "37",
      "text": "Script tag - the <script> tag is used to define a client-side script (JavaScript). The <script> element either contains scripting statements, or it points to an external script file through the SRC attribute. Common uses for JavaScript are image manipulation, form validation, and dynamic changes of content"
    },
    {
      "number": "38",
      "text": "Search engine optimization (SEO) is the process of affecting the visibility of a website or a web page in a web search engine's unpaid results—often referred to as \"natural\", \"organic\", or \"earned\" results."
    },
    {
      "number": "39",
      "text": "Server-side scripting - is a technique used in web development which involves employing scripts on a web server which produce a response customized for each user's (client's) request to the website. ... Server-side scripting is often used to provide a customized interface for the user."
    },
    {
      "number": "40",
      "text": "Simulation - the process of imitating a real phenomenon with a set of mathematical formulas. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, and even biological processes."
    },
    {
      "number": "41",
      "text": "Sitemap is an XML file that lists URLs for a site along with additional metadata about each URL (when it was last updated, how often it usually changes, and how important it is, relative to other URLs in the site) so that search engines can more intelligently crawl the site. --- PDF PAGE 101 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 97"
    },
    {
      "number": "42",
      "text": "Sitemap - is a list of pages of a web site accessible to crawlers or users. It can be either a document in any form used as a planning tool for Web design, or a Web page that lists the pages on a website, typically organized in hierarchical fashion."
    },
    {
      "number": "43",
      "text": "Software – computer programs and procedures concerned with the operation of an information system."
    },
    {
      "number": "44",
      "text": "SQL (Structured Query Language) -is a domain-specific language used in programming and designed for managing data held in a relational database management system (RDBMS), or for stream processing in a relational data stream management system (RDSMS)."
    },
    {
      "number": "45",
      "text": "Standards – measures of performance developed to evaluate the progress of a system toward its objectives."
    },
    {
      "number": "46",
      "text": "Style guide (or manual of style) - is a set of standards for the writing and design of documents, either for general use or for a specific publication, organization, or field. (It is often called a style sheet, though that term has other meanings.) A style guide establishes and enforces style to improve communication."
    },
    {
      "number": "47",
      "text": "System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole"
    },
    {
      "number": "48",
      "text": "Uptime - is the amount of time that a server has stayed up and running. This is usually listed as a percentage, like \"99.9% uptime.\" Uptime is a great measure of how good a Web hosting provider is at keeping their systems up and running"
    },
    {
      "number": "49",
      "text": "User experience (UX) refers to a person's emotions and attitudes about using a particular product, system or service. It includes the practical, experiential, affective, meaningful and valuable aspects of human–computer interaction and product ownership."
    },
    {
      "number": "50",
      "text": "User- friendly – a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use."
    },
    {
      "number": "51",
      "text": "Web analytics is the measurement, collection, analysis and reporting of web data for purposes of understanding and optimizing web usage. Web analytics is not just a process for measuring web traffic but can be used as a tool for business and market research, and to assess and improve the effectiveness of a website. Web analytics also provides information about the number of visitors to a website and the number of page views. It helps gauge traffic and popularity trends which is useful for market research."
    },
    {
      "number": "52",
      "text": "Web design is a process of conceptualizing, planning, and building a collection of electronic files that determine the layout, colors, text styles, structure, graphics, images, and use of interactive features that deliver pages to your site visitors."
    },
    {
      "number": "53",
      "text": "Web developer is a programmer who specializes in, or is specifically engaged in, the development of World Wide Web applications, or distributed network applications that are run over HTTP from a web server to a web browser"
    },
    {
      "number": "54",
      "text": "Web programming refers to the writing, markup and coding involved in Web development, which includes Web content, Web client and server scripting and network security. The most common languages used for Web programming are XML, HTML, JavaScript, Perl 5 and PHP"
    },
    {
      "number": "55",
      "text": "Web server - is a computer system that processes requests via HTTP, the basic network protocol used to distribute information on the World Wide Web. The term can refer to the entire system, or specifically to the software that accepts and supervises the HTTP requests. --- PDF PAGE 102 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 98"
    },
    {
      "number": "56",
      "text": "Web service - is any piece of software that makes itself available over the internet and uses a standardized XML messaging system. XML is used to encode all communications to a web service. For example, a client invokes a web service by sending an XML message, and then waits for a corresponding XML response."
    },
    {
      "number": "57",
      "text": "Web service API (Application Programming Interface) - is the means by which third parties can write code that interfaces with other code. A Web Service is a type of API, one that almost always operates over HTTP (though some, like SOAP, can use alternate transports, like SMTP)."
    },
    {
      "number": "58",
      "text": "Website is a collection of related web pages, including multimedia content, typically identified with a common domain name, and published on at least one web server. A website may be accessible via a public Internet Protocol (IP) network, such as the Internet, or a private local area network (LAN), by referencing a uniform resource locator (URL) that identifies the site."
    },
    {
      "number": "59",
      "text": "Wireframe – is a visual representation of a website. It allows designers and developers to present proposed functions, graphics elements, structure, and content of a website with simple line drawings."
    },
    {
      "number": "60",
      "text": "W3C - the World Wide Web Consortium (W3C) is the main international standards organization for the World Wide Web. --- PDF PAGE 103 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 99 TRAINING REGULATIONS (TR) Qualification Title : Web Development NC III Qualification Code: ICTWBD318 Revision No. Document Description Types* Replaces Version (TESDA Board Resolution No./ Date) New Version (TESDA Board Resolution No./ Date) Deployment Circular 00 Document Created – Web Development NC III Not Applicable TB No. 2018-05/ February 27, 2018 TESDA Circular No. __ s. 2018 Legend: *Description Types - Document Created - Document Amended --- PDF PAGE 104 --- _________________________________________________________________________________ TR – Web Development NC III (Version 00) Promulgated February 27, 2018 100 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL EXPERT COMMITTEE – FY 2017 MS. MARIE GRACE A. DIMARANAN Board Director, Animation Council of the Philippines, Inc. (ACPI) MR. MIKHAIL JOSEPH T. TORRES Managing Director, EACOMM MR. KARLO MARTIN M. ROBOSA Senior Business Analyst, EACOMM MR. JONATHAN V. MARTIN Senior Product Marketing, Natural Intelligence Solutions/LLOOPP MR. ROMUALDO JOSE V. VERDAN II Owner/Manager, CADWEB Business Solutions • THE ANIMATION COUNCIL OF THE PHILIPPINES, INC. (ACPI) • THE PHILIPPINE SOFTWARE INDUSTRY ASSOCIATION (PSIA) • THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS • THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING Ms. Candice Michelle T. Garcia - Pointwest Technologies Corp. Mr. Alexis John Solis - Pointwest Technologies Corp. Mr. Jarek Boilo T. Cabautan - Ten Rabbit Mr. Raphael Angelo K. Warren - EACOMM Corporation Mr. John Henry M. Pacay - EACOMM Corporation Mr. Jotham M. Hernandez - Pinwheel Developers Ms. Niña Ana Marie Jocelyn A. Sales - IGDA Manila/DLSU/iAcademy/CIIT • THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT • Qualifications and Standards Office (QSO)"
