      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of Web Development NC III, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III level signed by the TESDA Director-General. 4.1.2 The qualification of Web Development NC III may be attained through: 4.1.2.1 Accumulation of Certificates of Competency (COCs) in all the following units of competencies: COC-1. Developing Responsive Web Design • Utilize software methodologies • Develop responsive web design COC-2. Creating Interactive Websites (using JavaScript) • Utilize software methodologies • Create interactive websites COC-3. Developing website backend • Utilize software methodologies • Develop website backend Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units. 4.1.2.2 Demonstration of competence through a single comprehensive project-type assessment covering all required units of competency of this qualification. 4.1.3 Upon accumulation and submission of all COCs acquired for all the relevant units of competency comprising this qualification, an individual shall be issued the corresponding National Certificate."
