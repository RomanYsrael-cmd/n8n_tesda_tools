  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Web Development NC III.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM)\nto include green technology, issues on health and drugs and catering to persons\nwith disabilities (PWD’s) to accompany in their curricula.\n\nCourse Title: Web Development\n\nNC Level: NC III\n\nNominal Training Duration:\n68 hours – Basic Competencies\n\n 28 hours – Common Competencies\n\n 1,092 hours– Core Competencies\n\n ________________\n\n Total Nominal Duration - 1,188 hours\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, &\nattitudes of a Web developer in accordance with web development industry\nstandards. It covers the basic & common competencies in addition to the core\ncompetencies such as to develop responsive web design, utilize software\nmethodologies, create interactive websites and develop website backend.\n\nThe nominal duration of 1,188 hours covers the required units at Web\nDevelopment NC III. TVET providers can however, offer a longer, ladderized\ncourse covering the NC III basic, common and core units.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 68 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n64\nBASIC COMPETENCIES\n(68 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethods\nNominal\nDuration\n1. Lead workplace\ncommunication\n\n1.1. Communicate\ninformation\nabout workplace\nprocesses.\n• Lecture and discussion on:\no Effective verbal communication methods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for written and\nelectronic communication methods\n• Follow organization requirements for the use of\nwritten and electronic communication methods\n• Perform exercises on understanding and conveying\nintended meaning scenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Demonstration\n• Role Play\n• Written Test\n• Observation\n2 Hours\n1.2. Lead workplace\ndiscussions\n• Lecture and discussion on:\no Organizational policy on production, quality and\nsafety\no Goals/ objectives and action plan setting\n• Read effective verbal communication methods\n• Prepare/set action plans based on organizational\ngoals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n• Lecture and discussion on:\no Organizational policy in dealing with issues and\nproblems\n• Read effective verbal communication methods\n• Practice organizing information\n• Perform exercises on understanding and conveying\nintended meaning scenario\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n2. Lead small\nteams\n\n2.1. Provide team\nleadership.\n• Lecture and discussion on:\no Company policies and procedures\n• Identify client expectations\n• Practice team building skills\n• Perform exercises on communication skills required\nfor leading teams\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 69 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n65\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethods\nNominal\nDuration\n\n2.2. Assign\nresponsibilities\namong members\n• Lecture and discussion on:\no Team member’s duties and responsibilities\n• Identify client expectations\n• Practice negotiating skills\n• Perform group exercises showing the skills and\ntechniques in promoting team building\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n2.3. Set performance\nexpectation for\nteam members.\n• Lecture and discussion on:\no Team member’s duties and responsibilities\no How performance expectations are set\n• Identify client expectations\n• Perform group exercises in setting individual target/\nexpectation\n• Read instruction and requirements in up to date\ndissemination to members\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Observation\n• Written\nexamination\n2 Hours\n2.4. Supervise team\nperformance\n• Discuss listening and treating individual team\nmembers concern\n• Identify methods of Monitoring Performance\n• Perform group exercises showing the skills in\nmonitoring team performance\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n3. Develop and\npractice\nnegotiation\nskills\n\n3.1. Plan negotiations\n• Lecture and discussion on:\no codes of practice and guidelines for the\norganization\no differences between content and process\n• Read:\no Organizations policy and procedures for\nnegotiations\no Dec