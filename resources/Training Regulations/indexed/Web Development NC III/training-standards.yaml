Identify data and user privacy laws\n• Identify cybersecurity laws\n• Practice how to lead and manage meetings\n•Practice creating project planning documents\n• Lecture and\ndiscussions\n• Role playing\n• Case Studies\n\n• Written test\n• Written\nReport/Case\nStudy\n8 hours\n4.2 Configure a web or\ncloud server\n• Research how the internet and World Wide\nWeb works.\n• Identify types of web and cloud server\nproviders.\n• Identify web security concepts and best\npractices\n• Practice using the command line interface\n(CLI) and discuss most common commands\nand tools.\n• Perform how to register a domain name and\nconfiguring it to a server.\n• Practice configuring a web server:\no Select system specifications\no Select operating system\no Create a server user\no Install Web Server\no Install Server Side Scripting\no Install Database Server\no Install and configure Firewall\no Configure HTTPS/SSL\n\n• Lecture and\ndiscussion\n• Research\n• Demonstration\n• Hands-on\nPractice\n• Written Test\n• Practical /\nPerformance\nTest\n24 hours\n• Supervised-\nindustry training\n• Performance\nevaluation\n10 hours\n\n--- PDF PAGE 86 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n82\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n• Discussion on Service Level Agreements\nand concepts on server backup,\nredundancy, load balancing and disaster\nrecovery.\n\n4.3 Design databases\n• Identification and discussion on types of\nDatabases\n• Research database design concepts and\nprinciples:\no Database Functions and Features\no Data Analysis\no Data Modeling\no Data Redundancy\no Data Types and Data Structures\no Logical Design Concepts\n• Identify and practice SQL programming\n• Practice designing a database:\no Conceptual Model\no Logical Model\no Data Structures\no Queries and Reports\n• Lecture and\ndiscussion\n• Research\n• Demonstration\n• Hands-on\nPractice\n• Written Test\n• Practical /\nPerformance\nTest\n56 hours\n• Supervised-\nindustry training\n• Performance\nevaluation\n40 hours\n\n--- PDF PAGE 87 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n83\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n4.4 Develop server side\nscripts\n• Identify various types of Server Side\nScripting Languages\n• Research object oriented programming\n(OOP) concepts and principles\n• Research best practices in creating secure\nserver side scripts (How to prevent SQL\ninjection, cross-site scripting, encrypting\ndata, denial of service, etc.)\n• Practice server side scripts that create, read,\nupdate, and delete (CRUD) entries from a\ndatabase server\n• Practice creating standard-compliant Web\nServices/APIs using server side scripts.\n• Practice creating password-protected web\npages with secure passwords, cookies and\nsessions using Server-side scripts\n• Practice creating search engine applications\nusing server side scripts.\n• Practice creating shopping cart applications\nthat make use of sessions and cookies using\nserver side scripts\n• Lecture and\ndiscussion\n• Research\n• Demonstration\n• Hands-on\nPractice\n• Written Test\n• Practical /\nPerformance\nTest\n160 hours\n• Supervised-\nindustry training\n• Performance\nevaluation\n60 hours\n4.5 Develop web\napplication using\nMVC Frameworks\n• Identify types of MVC Frameworks\n• Practice installing MVC Frameworks\n• Practice developing a simple Content\nManagement System using a MVC\nFramework\n• Practice software documentation on\ncompleted web application\n• Lecture and\ndiscussion\n• Demonstration\n• Hands-on\nPractice\n• Written Test\n• Practical /\nPerformance\nTest\n40 hours\n\n--- PDF PAGE 88 ---\n______________________________________