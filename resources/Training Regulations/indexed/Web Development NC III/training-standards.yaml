 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n79\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n\n2.5 Use/Deploy website\ncontent management\nsystem (CMS)\n\n• Discussion on how to connect FTP to web\nhosting\n• Discussion on how to install CMS framework\nmanually\n• Discussion on how to install necessary\nplugins\n• Discussion on how to embed codes from\ngoogle analytics, web master tools and any\nrelated web policies needed to verify your\naccount\n• Identify content management system (CMS)\nand its usage/functions\n• Perform installation of CMS to client servers\n• Perform uploading of website content to CMS\n• Practice incorporating plugins to CMS\n• Lecture\n• Discussion\n• Viewing\nMultimedia\n• Actual\ndemonstration\n\n● Practical Exam\n● Interviews/\nQuestioning\n● Presentation\n● Hands-on\ndemonstration\n16 hours\n\n2.6 Perform search\nengine optimization\n(SEO)\n• Discussion on the basics of SEOs and\nanalytics\n• Checking of websites for conformity with\nSEO standards\n• Identify Search Engine Tools and its usage\n• Perform social media and website\nhousekeeping\n• Preparing reports and analytics\n\n• Lecture\n• Discussion\n• Viewing\nMultimedia\n• Actual\ndemonstration\n\n● Practical Exam\n● Interviews/\nQuestioning\n● Presentation\n● Hands-on\ndemonstration\n16 hours\n\n3. Create\ninteractive\nwebsites\n(using JavaScript)\n3.1 Inspect and analyze\nHTML/CSS files\n• Discuss the static web page used in HTML\nand CSS (If HTML/CSS has not been\ncreated, a simple page will do)\n• Practice how to check the files and how to\nhandle them\n• Practice how to analyze the files and how to\nhandle them\n• Practice on basic programming\n• Lecture and\ndiscussions\n• Hands-on\nPractice\n• Written test\n• Actual\npresentation\n8 hours\n\n--- PDF PAGE 84 ---\n____________________________