      "source_text": "TESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM)\nto include green technology, issues on health and drugs and catering to persons\nwith disabilities (PWD’s) to accompany in their curricula.\n\nCourse Title: Web Development\n\nNC Level: NC III\n\nNominal Training Duration:\n68 hours – Basic Competencies\n\n 28 hours – Common Competencies\n\n 1,092 hours– Core Competencies\n\n ________________\n\n Total Nominal Duration - 1,188 hours\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, &\nattitudes of a Web developer in accordance with web development industry\nstandards. It covers the basic & common competencies in addition to the core\ncompetencies such as to develop responsive web design, utilize software\nmethodologies, create interactive websites and develop website backend.\n\nThe nominal duration of 1,188 hours covers the required units at Web\nDevelopment NC III. TVET providers can however, offer a longer, ladderized\ncourse covering the NC III basic, common and core units.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 68 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n64\nBASIC COMPETENCIES\n(68 hours)\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethods\nNominal\nDuration\n1. Lead workplace\ncommunication\n\n1.1. Communicate\ninformation\nabout workplace\nprocesses.