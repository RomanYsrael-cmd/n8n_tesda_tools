rent techniques in checking documents\n• Edit and format information applying different\ntechniques\n• Proof read information applying different techniques\n\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written\nExamination\n• Presentation\n\n2 Hours\n\n--- PDF PAGE 75 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n71\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethods\nNominal\nDuration\n9. Work in a\ndiverse\nenvironment\n9.1. Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n• Lecture and discussion on:\no Enterprise policies and core values\no Awareness on individual cultures and world\ngeography\no Different methods of verbal and non-verbal\ncommunication in a multicultural setting\no Workplace Diversity Policy\n• Lecture\n• Group\nDiscussion\n• Oral evaluation\n• Written\nExamination\n• Presentation\n\n2 Hours\n9.2. Work effectively\nin an environment\nthat\nacknowledges\nand values\ncultural diversity\n• Lecture and discussion on:\no The value of diversity in the economy and society\nin terms of Workforce development\no Innovation\no Social justice\no Customer service excellence\no Teamwork and collaboration\n•Applying strategies for customer service excellence\n• Lecture\n• Group\nDiscussion\n• Oral evaluation\n• Written\nExamination\n• Presentation\n\n2 Hours\n9.3. Identify common\nissues in a\nmulticultural and\ndiverse\nenvironment\n• Lecture and discussion on:\no Diversity-related conflicts within the workplace\no Change management policies\no Advance strategies for customer service excellence\n• Identifying and addressing workplace harassment\n• Applying advance strategies for customer service\nexcellence\n\n• Lecture\n• Group\nDiscussion\n• Oral evaluation\n• Written\nExamination\n• Presentation\n\n2 Hours\n\nNote: 