          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Interview\n3.2. Actual demonstration\n3.3. Authenticated portfolio (related certificates of\ntraining/seminar)\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 26 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n22\nUNIT OF COMPETENCY : APPLY CRITICAL THINKING AND PROBLEM\nSOLVING TECHNIQUES IN THE WORKPLACE\nUNIT CODE\n :"
        },
        "source_text": "500311114\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills,\nand attitude required in selecting, sourcing and applying\nappropriate\nand\naffordable\ntechnologies\nin\nthe\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different\ntechnologies is\ndetermined based on job\nrequirements\n1.2 Appropriate technology\nis selected as per work\n specification\n\n1.1 Awareness on technology\nand its function\n1.2 Operating instructions\n1.3 Communication techniques\n1.4 Health and safety\nprocedure\n1.5 Company policy in relation\nto relevant technology\n1.1. Relevant\ntechnology\napplication/\nimplementation\n1.2. Basic\ncommunication\nskills\n1.3. Software\napplications\nskills\n\n2. Apply\nrelevant\ntechnology\n\n2.1 Relevant technology is\neffectively used in\ncarrying out function\n2.2 Applicable software and\nhardware are used as\nper task requirement\n2.3 Management concepts\nare observed and\npracticed as per\nestablished industry\npractices\n2.1. Knowledge on operating\ninstructions\n2.2. Understanding software\nand hardware system\n2.3. Communication\ntechniques\n2.4. Health and safety\nprocedure\n2.5. Company policy in relation\nto relevant technology\n2.6. Different management\nconcepts\n2.7. Technology adaptability\n2.8. Office technology\n2.9. Industrial technology\n2.10. System technology\n2.11. Training technology\n2.12. Different software/\nhardware\n2.13. 5S (Proper housekeeping)\n\n2.1 Applying\nrelevant\ntechnology\n2.2 Communicating\nskills\n2.3 Using software\napplications\nskills\n2.4 Conducting risk\nassessment\n\n3. Maintain/\nenhance\nrelevant\ntechnology\n3.1 Maintenance of\ntechnology is applied in\naccordance with the\nindustry standard\noperating procedure,\nmanufacturer’s\noperating guidelines\nand occupational health\nand safety procedure to\nensure its operative\nability\n3.1 Awareness on technology\nand its function\n3.2 Repair and maintenance\nprocedure\n3.3 Health and safety\nprocedure\n3.4 Company policy in relation\nto relevant technology\n3.5 Upgrading of technology\n3.6 Organizational set-up/work\nflow\n3.1 Performing basic\ntroubleshooting\nskills\n3.2 Identifying\nfailures or\ndefects\n3.3 Communication\nskills\n3.4 Applying\ncorrective and\n\n--- PDF PAGE 23 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n19\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Updating of technology is\nmaintained through\ncontinuing education or\ntraining in accordance\nwith job requirement\n3.3 Technology failure/\ndefect is immediately\nreported to the\nconcern/responsible\nperson or section for\nappropriate action\n\npreventive\nmaintenance\n\n--- PDF PAGE 24 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management\nconcepts\nMay include:\n2.1. Real Time Management\n2.2. KAIZEN or continuous improvement\n2.3. 5 S\n2.4. Total Quality Management\n2.5. Other management/productivity tools\n3. Industry standard\noperating procedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s\noperating guidelines/\ninstructions\n4.1 Written instruction/manuals of specific technology/\nequipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health\nand safety procedure\n5.1 Relevant statutes on OSH\n5.2 Company guidelines in using technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 25 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n21\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Interview\n3.2. Actual demonstration\n3.3. Authenticated portfolio (related certificates of\ntraining/seminar)\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 26 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n22\nUNIT OF COMPETENCY : APPLY CRITICAL THINKING AND PROBLEM\nSOLVING TECHNIQUES IN THE WORKPLACE\nUNIT CODE\n :"
