        "required_knowledge": null,
        "required_skills": [
          "1. Develop an individual’s cultural awareness and sensitivity 1.1. Individual differences with clients, customers and fellow workers are recognized and respected in accordance with enterprise policies and core values. 1.2. Differences are responded to in a sensitive and considerate manner 1.3. Diversity is accommodated using appropriate verbal and nonverbal communication. 1.4. Actions/decisions are maintained consistent with legislative requirements and enterprise guidelines. 1.1. Understanding cultural diversity in the workplace 1.2. Awareness of individual cultures and world geography 1.3. Norms of behavior for interacting and dialogue with specific groups (e.g., Muslims and other non- Christians, non- Catholics, tribes/ethnic groups, foreigners) 1.4. Different methods of verbal and non- verbal communication in a multicultural setting 1.5. Enterprise policies on workplace diversity (Workplace Diversity Policy) 1.1. Cross-cultural communication skills (i.e. different business customs, beliefs, communication strategies) 1.2. Communication skills – reading, writing, conversational skills 1.3. Affective skills – establishing rapport and empathy, understanding, etc. 1.4. Active Listening 1.5. Openness and flexibility in communication 1.6. Giving/receiving feedback 1.7. Identifying/ Recognizing diverse groups in the workplace and community as defined by divergent culture, religion, traditions and practices 2. Work effectively in an environment that acknowledges and values cultural diversity 2.1. Knowledge, skills and experiences of others are recognized and documented in relation to team objectives. 2.2. Fellow workers are encouraged to utilize and share their specific qualities, skills or backgrounds with other team members and clients to enhance work outcomes. 2.3. Relations with customers and clients are maintained to show that diversity is valued by the business. 2.1. Recognizing and explaining the value of diversity in the economy and society in terms of