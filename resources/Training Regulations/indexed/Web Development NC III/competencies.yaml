          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected and used hardware components correctly\nand according to the task requirement\n1.2. Identified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3. Produced accurate and complete data in accordance\nwith the requirements\n1.4. Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5. Maintained computer system\n2. Method of assessment\n2.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1.1.\nObservation\n2.1.2.\nQuestioning\n2.1.3.\nPractical demonstration\n3. Resource implication\n3.1.\nComputer hardware with peripherals\n3.2.\nAppropriate software\n4. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 45 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n41\nCORE COMPETENCIES\n\nUNIT TITLE\n:\nUTILIZE SOFTWARE METHODOLOGIES\nUNIT CODE\n\n:"
