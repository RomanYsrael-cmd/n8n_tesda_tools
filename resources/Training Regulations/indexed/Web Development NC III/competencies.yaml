) Program \nMay include: \n14.1. Filezilla \n14.2. Cyberduck \n14.3. WinSCP \n14.4. CuteFTP \n14.5. WSFTP\n15. Content management \nsystem (CMS) \nMay include: \n15.1. WordPress \n15.2. Joomla \n15.3. Drupal \n16. Keywords  \nMay include: \n16.1. word \n16.2. phrase \n16.3. sentence\n\n--- PDF PAGE 54 ---\n_________________________________________________________________________________ \nTR – Web Development NC III        (Version 00)                     Promulgated    February 27, 2018 \n \n50 \nVARIABLE \nRANGE \n17. SEO standards \nMay include: \n17.1. Use of search engine-friendly design (responsive \nweb design) \n17.2. Addition of meta tags - title, description, author, \nkeywords, etc \n17.3. Codes are checked for broken links, duplicate \npages, etc. \n17.4. Content checking \n17.5. Checking of site weight and speed, etc. \n17.6. Creation of sitemaps\n18. Search engine tools \nMay include: \n18.1. Web analytics \n18.2. Programs \n18.3. Services  (ex. Google Analytics, google business, \nweb master)\n19. Regular basis \nMay include: \n19.1. Monthly \n19.2. Quarterly\n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed research and analytics \n1.2 Identified and prepared design requirements \n1.3 Designed and developed user-friendly responsive \nweb interface \n1.4 Developed HTML/CSS website added wireframe \nwith client side scripting \n1.5 Used/Deployed website content management \nsystem  \n1.6\nPerformed search engine optimization\n2. Method of Assessment \nCompetency in this unit may be assessed through: \n2.1 Demonstration with oral questioning \n2.2 Written Exam \n2.3\nPortfolio with interview \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials  \n3.2 Applicable equipment \n3.3 Appropriate software \n3.4\nWorkplace or assessment area\n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace or \