        "evidence_guide": {
          "source_text": "1. Critical Aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determine project requirements and develop a\nproject plan.\n1.2 Configure a web/cloud server.\n1.3 Design databases\n1.4 Develop server-side scripts\n1.5 Develop web application using Model-View-\nController (MVC) framework\n2. Method of Assessment\nCompetency in this unit may be assessed through:\n2.1 Demonstration with oral questioning\n2.2 Portfolio with oral questioning\n2.3\nWritten exam\n3. Resource Implication\nThe following resources should be provided:\n3.1. Appropriate supplies and materials\n3.2. Applicable equipment\n3.3. Applicable software\n3.4. Workplace/Assessment area\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center.\n\n--- PDF PAGE 67 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n63"
