        "source_text": "ICT 251303\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude required to\ncreate interactive websites using JavaScript. This includes\ncompetencies to learn the basics of JavaScript for the web,\ncombining with the principles of analysis, design and\nprogramming so that developers will be able to understand, plan\nand build an interactive interface.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Inspect and\nanalyze\nHTML/CSS\nFiles\n1.1 Approved and complete\nlayout are inspected and\nanalyzed according to the\ninformation in the page\nsource.\n1.2 Goals, interaction of the\ncontents and presentation of\nthe web page are identified\naccording to the initial\nspecifications and plans.\n1.1. Oral communication\n1.2. Written\ncommunication\n1.3. Principles of Design\n1.4. Project Plans\n1.5. Basic programming\nlanguage\n1.6. Types of web\nplatforms\n1.7. Graphics software\n1.8. Office application\n1.9. Internet Literacy\n1.10. Project Planning\nSoftware\n1.11. Basic Mathematics\n1.1. Effective\ncommunications\n1.2. Presentation\nskills\n1.3. Computer\nOperations\n1.4. Planning and\norganizational\nskills\n\n2. Gather and\nreview\nspecifications\nand\nrequirements\n2.1. Functional and non-\nfunctional requirements\nare identified based on\nproject specifications.\n2.2. JavaScript Framework is\nselected based on the\nproject requirements for web-\napplication only\n2.3. Minimum requirements are\nadded using FURPS+\nchecklist to ensure overall\nscope of the project are\ndetermined completely.\n2.4. Budget and schedule are\ndetermined according to the\nwebsite requirements.\n2.5. Resources are identified\nbased on the project\nrequirements.\n2.6. Overall project plan is\nsubmitted to relevant\npersonnel.\n2.1. Oral communication\n2.2. Written\ncommunication\n2.3. Principles of Design\n2.4. Project Plans\n2.5. Copyright laws and\nregulation\n2.6. Data and user\nprivacy law\n2.7. Basic programming\nlanguage\n2.8. Types of web\nplatforms\n2.9. Office application\n2.10. Internet Literacy\n2.11. Project Planning\nSoftware\n2.12. Basic Mathematics\n\n2.1. Effective\ncommunications\n2.2. Presentation\nskills\n2.3. Computer\nOperations\n2.4. Planning and\norganizational\nskills\n3. Apply\nJavaScript to\nHTML/CSS\n3.1 Code editor is prepared\nusing web design and\napplication with\nappropriate major browser\n3.1. Basic programming\nlanguage\n3.2. Types of web\nplatforms\n3.1. Computer\nOperations\n3.2. Planning and\norganizational\nskills\n\n--- PDF PAGE 56 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n52\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Document object model\n(DOM) is applied on the web\npage\n3.3 JavaScript structures/\nlibraries, best practices and\nstyle guides with script tags\nare applied on the\nappropriate HTML areas.\n3.4 External JavaScript files\nlocated at the nearest folder\nare called-out.\n3.5 Backend data is accessed\nusing web service/API\n3.6 Basic JavaScript syntaxes\nare applied on the\nHTML/CSS page\n3.7 Document Object Model is\nrecalled to check the final\noutput\n3.8 JavaScript is applied on the\nCSS files\n\n3.3. Web design and\napplication\n3.4. Office application\n3.5. Internet Literacy\n3.6. Project Planning\nSoftware\n3.7. Basic Mathematics\n3.8. Computer Science\n3.8.1. Information\ntheory\n3.8.2. Data structure\n3.8.3. Algorithms\n\n4. Configure\nJavaScript\nEfficiency\n4.1 JavaScript syntax is tested\nusing a browser.\n4.2 Debugging software/\napplications and JavaScript\ncode checkers are used to fix\nerrors\n4.3 JavaScript code is minified\nusing minification tools, if\nneeded\n4.4 Content distribution\nnetwork (CDN) from servers\nis used to deliver JavaScript\n