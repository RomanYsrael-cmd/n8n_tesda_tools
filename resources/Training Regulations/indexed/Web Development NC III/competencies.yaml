        "source_text": "ELC311203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to perform computer operations which\ninclude inputting, accessing, producing and transferring\ndata using the appropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for task\nto be\nundertaken\n1.1. Requirements of task are\ndetermined according to job\nspecifications\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned\nand required outcome\n1.3. Task is planned to ensure\nOH&S guidelines and\nprocedures are followed\n1.4. Client -specific guidelines\nand procedures are\nfollowed.\n1.5. Required data security\nguidelines are applied in\naccordance with existing\nprocedures.\n1.1. Main types of\ncomputers and\nbasic features of\ndifferent operating\nsystems\n1.2. Main parts of a\ncomputer\n1.3. Information on\nhardware and\nsoftware\n1.4. Data security\nguidelines\n1.1. Reading and\ncomprehension\nskills required to\ninterpret work\ninstruction and\nto interpret\nbasic user\nmanuals.\n1.2. Communication\nskills to identify\nlines of\ncommunication,\nrequest advice,\nfollow\ninstructions and\nreceive\nfeedback.\n1.3. Interpreting user\nmanuals and\nsecurity\nguidelines\n2. Input data into\ncomputer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating\nprocedures\n2.3. Inputted data are stored in\nstorage media according\nto requirements\n2.4. Work is performed within\nergonomic guidelines\n2.1. Basic ergonomics of\nkeyboard and\ncomputer user\n2.2. Storage devices\nand basic\ncategories of\nmemory\n2.3. Relevant types of\nsoftware\n2.1. Technology\nskills to use\nequipment\nsafely including\nkeyboard skills.\n2.2. Entering data\n3. Access\ninformation\nusing computer\n3.1. Correct program/application\nis selected based on job\nrequirements\n3.2. Program/application\ncontaining the information\nrequired is accessed\naccording to company\nprocedures\n3.1. General security,\nprivacy legislation\nand copyright\n3.2. Productivity\nApplication\n3.3. Business\nApplication\n3.1. Accessing\ninformation\n3.2. Searching and\nbrowsing files\nand data\n\n--- PDF PAGE 42 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n38\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3. Desktop icons are\ncorrectly selected, opened\nand closed for navigation\npurposes\n3.4. Keyboard techniques are\ncarried out in line with\nOH&S requirements for\nsafe use of keyboards\n4. Produce/\noutput data\nusing computer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as required\nusing computer\nhardware/peripheral\ndevices in accordance with\nstandard operating\nprocedures\n4.3. Files, data are transferred\nbetween compatible\nsystems using computer\nsoftware, hardware/\nperipheral devices in\naccordance with standard\noperating procedures\n4.1. Computer\napplication in\nprinting, scanning\nand sending\nfacsimile\n4.2. Types and function\nof computer\nperipheral devices\n4.1. Computer data\nprocessing\n4.2. Printing of data\n4.3. Transferring\nfiles and data\n5. Maintain\ncomputer\nequipment and\nsystems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of\nconsumables are\nimplemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with standard\noperating procedures\n5.3. Basic file maintenance\nprocedures are\nimplemented in line with the\nstandard operating\nprocedu