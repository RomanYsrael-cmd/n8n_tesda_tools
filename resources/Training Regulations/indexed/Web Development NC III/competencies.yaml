content creations, photos and \ngraphics  \n2.6. Sitemap and moodboards are \ndeveloped based on design \n2.7. Content assets are compiled \nusing a Spreadsheet for \nproject planning \n2.1. Oral communication \n2.2. Written \ncommunication \n2.3. Principles of Design \n2.4. Project plans \n2.5. Copyright laws and \nregulation \n2.6. Data and user \nprivacy law \n2.7. Types of web \nplatforms \n2.8. Graphics software \n2.9. Office application \nsoftware \n2.10. Internet literacy \n2.11. Basic Mathematics \nMDAS \n2.1. Effective \ncommunication \nskills \n2.2. Presentation \nskills \n2.3. Computer \noperation skills \n2.4. Photo editing \nskills \n2.5. Planning and \norganizational \nskills \n3. Design and \ndevelop user-\nfriendly \nresponsive \nweb interface \n \n \n \n3.1 Design tools are identified \nand utilized based on project \nrequirements \n3.2 Draft mockups  are prepared \nbased on the project \n3.3 User interface components \nare applied to the mockups \nbased on project \nrequirements \n3.1 Oral communication \n3.2 Written \ncommunication \n3.3 Principles of Design \n3.4 Drawing principles \n3.5 Types of web \nplatforms \n3.6 Design tools \n3.7 Office application \nsoftware\n3.1 Effective \ncommunication \nskills \n3.2 Presentation \nskills \n3.3 Computer \noperation skills \n3.4 Planning and \norganizational \nskills\n\n--- PDF PAGE 50 ---\n_________________________________________________________________________________ \nTR – Web Development NC III        (Version 00)                     Promulgated    February 27, 2018 \n \n46 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.4 User experience principles \nare applied to the brand \nguidelines based on the \nproject requirements \n3.5 Mockups are finalized and \napproved by relevant \npersonnel \n3.6 Revisions are made based on \nclient’s requests, comments \nand suggestions\n3.8 Internet literacy \n3.9 User interface \ncomponents \n3.10 User experience \nprinciples \n3.11 Basic Geometry \n3.12 Behavioral science \n \n3.5 Drafting/ \nSketching skills\n \n4. Develop \nHTML/CSS \nwebsite \n4.1 Slicing of mockups are \nperformed based on \napproved design \n4.2 HTML pages are created \nbased on approved design \n4.3 CSS are created based on \napproved design \n4.4 Navigation menu and \nhyperlinks are enabled in the \npages \n4.5 Website contents are added \nto the pages based on the \napproved design. \n4.6 HTML/CSS are validated \nbased on W3C standards \n4.7 HTML/CSS website is \nsubmitted to relevant \npersonnel for checking and \napproval \n4.8 Revisions are implemented \nbased on relevant personnel \nfeedback \n4.9 Final HTML/CSS website is \nprepared for publishing \n4.10 File Transfer Protocol (FTP) \nProgram is utilized to upload \nfinal HTML/CSS website \n4.1 Oral communication \n4.2 Written \ncommunication \n4.3 Principles of Design \n4.4 HTML and CSS \n4.5 Types of web \nplatforms \n4.6 Graphics/Photo-\nediting software \n4.7 Office application \nsoftware \n4.8 Internet literacy \n4.9 User interface \ncomponents \n4.10 User experience \nprinciples \n4.11 File Transfer \nProtocol (FTP) \n4.12 Basic Geometry \n4.1 Effective \ncommunication \nskills \n4.2 Presentation \nskills \n4.3 Computer \noperation skills \n4.4 HTML and \nCSS coding \nskills \n4.5 Graphics/Photo \nediting skills \n4.6 Using FTP \nprograms \n \n5. Use/Deploy \nwebsite \ncontent \nmanagement \nsystem \n(CMS) \n \n5.1 Content management \nsystem (CMS) is identified \nbased on project \nrequirements \n5.2 CMS is installed to client \nserver using FTP \n5.3 Ready-made template is \nselected based on project \nrequirements \n5.4 Website contents are \nuploaded to CMS based on \nproject requirements \n5.5 Readymade plugins are \nincorporated to CMS  \n5.6 Website with CMS is \nsubmitted to relevant \n5.1 Oral communication \n5.2 Written \ncommunication \n5.3 Principles of Design \n5.4 CMS principles \n