2.1 Response to workplace \nissues are sought  \n2.2 Response to workplace \nissues are provided \nimmediately \n2.3 Constructive contributions \nare made to workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4 Goals/objectives and  \n        action plan undertaken in \nthe workplace are \ncommunicated \n \n2.1. Leading as a \nmanagement \nfunction \n2.2. Barriers of \ncommunication \n2.3. Effective verbal \ncommunication \nmethods \n2.4. Method/technique\ns of discussion \n2.5. How to lead \ndiscussion \n2.6. How to solicit \nresponse \n2.7. Goal setting and \naction planning\n2.1. Communicating \neffectively \n2.2. Consulting the crew \non the prepared \nmenu for the month\n\n--- PDF PAGE 7 ---\n_________________________________________________________________________________ \nTR – Web Development NC III        (Version 00)                     Promulgated    February 27, 2018 \n \n3 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Identify and \ncommunicate \nissues arising \nin the \nworkplace \n3.1 Issues and problems are \nidentified as they arise \n3.2 Information regarding \nproblems and issues are \norganized coherently to \nensure clear and effective \ncommunication \n3.3 Dialogue is initiated with \nappropriate personnel \n3.4 Communication problems \nand issues are raised as \nthey arise \n3.1. Types of issues \nand problems in \nthe workplace \n3.2. Written and \nelectronic \ncommunication \nmethods \n3.3. Communication \nbarriers affecting \nworkplace \ndiscussions \n3.1. Identifying cause \nof problems \n3.2. Identifying \nproblems and \nissues \n3.3. Organizing \ninformation on \nproblems and \nissues \n3.4. Relating problems \nand issues in the \nworkplace\n\n--- PDF PAGE 8 ---\n_________________________________________________________________________________ \nTR – Web Development NC III        (Version 00)                     