          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the\nproblem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\n\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that\nmay have happened.\n2. Method of assessment\nCompetency in this unit may be assessed through:\n2.1. Case studies on solving problems in the\nworkplace\n2.2. Observation\n\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over a\nrange of situations, which will include disruptions to normal,\nsmooth operation. Simulation may be required to allow for\ntimely assessment of parts of this unit of competency.\nSimulation should be based on the actual workplace and\nwill include walk through of the relevant competency\ncomponents.\n3. Resource Implication\n3.1. Assessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n\n4. Context of Assessment\n\n4.1. In all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units\n\n--- PDF PAGE 31 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n27\n\nUNIT OF COMPETENCY: USE INFORMATION CREATIVELY AND CRITICALLY\nUNIT CODE :"
