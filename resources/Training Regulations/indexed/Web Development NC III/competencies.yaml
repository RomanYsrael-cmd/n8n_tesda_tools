        "source_title": "CREATE INTERACTIVE WEBSITES",
        "source_text": "--- PDF PAGE 55 ---\n_________________________________________________________________________________ \nTR – Web Development NC III        (Version 00)                     Promulgated    February 27, 2018 \n \n51 \nUNIT TITLE  \n:   CREATE INTERACTIVE WEBSITES  \n \nUNIT CODE   \n:   ICT 251303                     \n \nUNIT DESCRIPTOR:  This unit covers the knowledge, skills and attitude required to \ncreate interactive websites using JavaScript. This includes \ncompetencies to learn the basics of JavaScript for the web, \ncombining with the principles of analysis, design and \nprogramming so that developers will be able to understand, plan \nand build an interactive interface. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Inspect and \nanalyze \nHTML/CSS \nFiles \n1.1 Approved and complete \nlayout are inspected and \nanalyzed according to the \ninformation in the page \nsource. \n1.2 Goals, interaction of the \ncontents and presentation of \nthe web page are identified \naccording to the initial \nspecifications and plans. \n1.1. Oral communication \n1.2. Written \ncommunication \n1.3. Principles of Design \n1.4. Project Plans \n1.5. Basic programming \nlanguage \n1.6. Types of web \nplatforms \n1.7. Graphics software \n1.8. Office application \n1.9. Internet Literacy \n1.10. Project Planning \nSoftware \n1.11. Basic Mathematics\n1.1. Effective \ncommunications \n1.2. Presentation \nskills \n1.3. Computer \nOperations \n1.4. Planning and \norganizational \nskills \n \n2. Gather and \nreview \nspecifications \nand \nrequirements \n2.1. Functional and non-\nfunctional requirements \nare identified based on \nproject specifications. \n2.2. JavaScript Framework is \nselected based on the \nproject requirements for web-\napplication only \n2.3. Minimum requirements are \nadded using FURPS+ \nchecklist to ensure overall \nscope of the project are \