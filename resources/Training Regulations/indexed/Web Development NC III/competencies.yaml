        "source_text": "500311110\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements are\nidentified and presented to\nteam members\n1.2 Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3 Team members’ queries\nand concerns are\nrecognized, discussed and\ndealt with\n\n1.1. Company policies and\nprocedures\n1.2. How performance\nexpectations are set\n1.3. Methods of Monitoring\nPerformance\n1.4. Client expectations\n1.5. Team member’s duties\nand responsibilities\n1.6. Definition of Team\n1.7. Skills and techniques\nin promoting team\nbuilding\n1.8. Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n1.9. Art of listening and\ntreating individual team\nmembers concern\n1.1. Communication\nskills required\nfor leading\nteams\n1.2. Team building\nskills\n1.3. Negotiating\nskills\n1.4. Evaluation skills\n2. Assign\nresponsibilities\n2.1. Duties and responsibilities\nare allocated having regard\nto the skills, knowledge\nand aptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2. Duties are allocated having\nregard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n2.1. Concept of delegation\n2.2. How to delegate\n2.3. Understanding\nindividual differences\n2.4. Methods of monitoring\nperformance\n2.5. Duties and\nresponsibilities of each\nteam member\n2.6. Knowledge in\nidentifying each team\nmember duties and\nresponsibilities\n2.1. Delegating\nskills\n2.2. Identifying\nindividual skills,\nknowledge and\nattitude as\nbasis for\nallocating\nresponsibilities\n2.3. Identifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1 Performance expectations\nare established based on\nclient needs and according\nto assignment\nrequirements\n3.1 Definition of\nperformance\nindicators/ criteria\n3.1 Identifying\nperformance\nindicators\n3.2 Evaluating\nperformance\n\n--- PDF PAGE 10 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Performance expectations\nare based on individual\nteam member’s duties and\narea of responsibility\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n\n3.2 Definition of team\ngoals and\nexpectations\n3.3 Methods of monitoring\nperformance\n3.4 Client expectations\n3.5 Team member’s\nduties and\nresponsibilities\n3.6 Defining performance\nexpectations criteria\n3.3 Setting\nindividual\nperformance\ntarget/\nexpectation\nindicators\n4. Supervise team\nperformance\n4.1. Monitoring of\nperformance takes place\nagainst defined\nperformance criteria\nand/or assignment\ninstructions and corrective\naction taken if required\n4.2 Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any deficiencies\n4.3 Performance issues which\ncannot be rectified or\naddressed within the team\nare referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n4.7 All relevant documentation\nis completed in\naccordance with company\nprocedures\n\n4.1 Understanding\nmonitoring of work\n4.2 How to undertake\ncorrective action\n4.3 Understanding\nfeedback and\nprocedure\n4.4 Feedback reporting\nprocedure\n4.5 Methods of monitoring\nperformance\n4.6 Team member’s\nduties and\nresponsibilities\n4.7 Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n4.1 Monitoring\nskills\n4.2 Setting\npriorities\n4.3 Evaluating\nperformance\n4.4 Informal/ formal\ncounseling\nskills\n\n--- PDF PAGE 11 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\n2.1 Roster/shift details\n3. Monitor performance\n3.1 Formal process\n3.2 Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1 Work output\n5.2 Work quality\n5.3 Team participation\n5.4 Compliance with workplace protocols\n5.5 Safety\n5.6 Customer service\n\n--- PDF PAGE 12 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n8\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n9\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\nUNIT CODE\n\n:"
