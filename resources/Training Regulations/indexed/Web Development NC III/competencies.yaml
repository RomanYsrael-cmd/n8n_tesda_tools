esign and \nplanning skills \n  \n2. Configure \nWeb/ Cloud \nServer \n \n \n \n2.1 Web/Cloud server provider \nis identified and utilized \nbased on project \nrequirements  \n2.2 Server specifications are \nselected based on project \nrequirements \n2.3 Server operating system is \nselected and installed based \non project requirements. \n2.4 Web server user access is \nconfigured based on \nweb/cloud server selected \nand project requirements. \n2.5 Web server software is \nselected and installed based \non project requirements \n2.6 Domain name is registered \nand configured based on \n2.1 Oral communication \n2.2 Written \ncommunication \n2.3 Service Level \nAgreements (SLA) \n2.4 Cybersecurity laws \n2.5 Data and user privacy \nlaws \n2.6 Types of web or cloud \nservers \n2.7 Operating system \ncommand line \ninterface (CLI) \n2.8 Best Practice in \ninstalling and \nconfiguration of web \nservers and \ncomponents. \n2.1 Effective \nCommunication \nskills \n2.2 Presentation \nskills \n2.3 Computer \noperation skills \n2.4 Planning and \norganizational \nskills \n2.5 Basic \nProgramming \nskills \n2.6 Problem-\nsolving skills \n2.7 Command line \ninterface skills\n\n--- PDF PAGE 61 ---\n_________________________________________________________________________________ \nTR – Web Development NC III        (Version 00)                     Promulgated    February 27, 2018 \n \n57 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nweb/cloud server selected \nand project requirements. \n2.7 Server side scripting \nlanguage software is \ninstalled and configured \nbased project requirements. \n2.8 Database server is installed \nand configured based on \nproject requirements. \n2.9 Security and firewalls are \ninstalled and configured \nbased on web/cloud server \nselected and project \nrequirements.  \n2.10 HTTPS/SSL is installed and \nconfigured based on \nweb/cloud server selected 