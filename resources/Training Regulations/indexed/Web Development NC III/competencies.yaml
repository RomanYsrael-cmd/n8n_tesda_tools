  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in WEB DEVELOPMENT NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311109\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1. Appropriate\ncommunication method\nis selected\n1.2. Multiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3. Questions are used to gain\nextra information\n1.4. Correct sources of\ninformation are identified\n1.5. Information is selected and\norganized correctly\n1.6. Verbal and written\nreporting is undertaken\nwhen required\n1.7. Communication skills are\nmaintained in all situations\n\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Methods of\nCommunication\n1.4. Types of\nQuestion\n1.5. Communication\nTools\n1.6. Questioning\nTechniques\n1.1. Organizing\ninformation\n1.2. Understanding and\nconveying intended\nmeaning\n1.3. Participating in\nvariety of workplace\ndiscussions\n1.4. Complying with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n1.5. Reporting\noccupational\nhazards during\nsafety meeting\n2. Lead\nworkplace\ndiscussions\n2.1 Response to workplace\nissues are sought\n2.2 Response to workplace\nissues are provided\nimmediately\n2.3 Constructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4 Goals/objectives and\n action plan undertaken in\nthe workplace are\ncommunicated\n\n2.1. Leading as a\nmanagement\nfunction\n2.2. Barriers of\ncommunication\n2.3. Effective verbal\ncommunication\nmethods\n2.4. Method/technique\ns of discussion\n2.5. How to lead\ndiscussion\n2.6. How to solicit\nresponse\n2.7. Goal setting and\naction planning\n2.1. Communicating\neffectively\n2.2. Consulting the crew\non the prepared\nmenu for the month\n\n--- PDF PAGE 7 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n3.1. Types of issues\nand problems in\nthe workplace\n3.2. Written and\nelectronic\ncommunication\nmethods\n3.3. Communication\nbarriers affecting\nworkplace\ndiscussions\n3.1. Identifying cause\nof problems\n3.2. Identifying\nproblems and\nissues\n3.3. Organizing\ninformation on\nproblems and\nissues\n3.4. Relating problems\nand issues in the\nworkplace\n\n--- PDF PAGE 8 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information\nat one time\n1.2 Made constructive contributions in workplace\nissues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively\nwritten form\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n2. Resource Implications\nThe following resources should be provided:\n2.1. Variety of Information\n2.2. Communication tools\n2.3. Simulated workplace\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Competency in this unit must be assessed\nthrough\n3.2 Direct Observation\n3.3 Interview\n4. Context for\nAssessment\n4.1. Competency may be assessed in the workplace\nor in simulated workplace environment\n\n--- PDF PAGE 9 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n5\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS (Guide and Lead Others/Be\nResponsible to Others)\nUNIT CODE\n\n:\n500311110\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements are\nidentified and presented to\nteam members\n1.2 Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3 Team members’ queries\nand concerns are\nrecognized, discussed and\ndealt with\n\n1.1. Company policies and\nprocedures\n1.2. How performance\nexpectations are set\n1.3. Methods of Monitoring\nPerformance\n1.4. Client expectations\n1.5. Team member’s duties\nand responsibilities\n1.6. Definition of Team\n1.7. Skills and techniques\nin promoting team\nbuilding\n1.8. Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n1.9. Art of listening and\ntreating individual team\nmembers concern\n1.1. Communication\nskills required\nfor leading\nteams\n1.2. Team building\nskills\n1.3. Negotiating\nskills\n1.4. Evaluation skills\n2. Assign\nresponsibilities\n2.1. Duties and responsibilities\nare allocated having regard\nto the skills, knowledge\nand aptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2. Duties are allocated having\nregard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n2.1. Concept of delegation\n2.2. How to delegate\n2.3. Understanding\nindividual differences\n2.4. Methods of monitoring\nperformance\n2.5. Duties and\nresponsibilities of each\nteam member\n2.6. Knowledge in\nidentifying each team\nmember duties and\nresponsibilities\n2.1. Delegating\nskills\n2.2. Identifying\nindividual skills,\nknowledge and\nattitude as\nbasis for\nallocating\nresponsibilities\n2.3. Identifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1 Performance expectations\nare established based on\nclient needs and according\nto assignment\nrequirements\n3.1 Definition of\nperformance\nindicators/ criteria\n3.1 Identifying\nperformance\nindicators\n3.2 Evaluating\nperformance\n\n--- PDF PAGE 10 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Performance expectations\nare based on individual\nteam member’s duties and\narea of responsibility\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n\n3.2 Definition of team\ngoals and\nexpectations\n3.3 Methods of monitoring\nperformance\n3.4 Client expectations\n3.5 Team member’s\nduties and\nresponsibilities\n3.6 Defining performance\nexpectations criteria\n3.3 Setting\nindividual\nperformance\ntarget/\nexpectation\nindicators\n4. Supervise team\nperformance\n4.1. Monitoring of\nperformance takes place\nagainst defined\nperformance criteria\nand/or assignment\ninstructions and corrective\naction taken if required\n4.2 Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any deficiencies\n4.3 Performance issues which\ncannot be rectified or\naddressed within the team\nare referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n4.7 All relevant documentation\nis completed in\naccordance with company\nprocedures\n\n4.1 Understanding\nmonitoring of work\n4.2 How to undertake\ncorrective action\n4.3 Understanding\nfeedback and\nprocedure\n4.4 Feedback reporting\nprocedure\n4.5 Methods of monitoring\nperformance\n4.6 Team member’s\nduties and\nresponsibilities\n4.7 Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n4.1 Monitoring\nskills\n4.2 Setting\npriorities\n4.3 Evaluating\nperformance\n4.4 Informal/ formal\ncounseling\nskills\n\n--- PDF PAGE 11 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\n2.1 Roster/shift details\n3. Monitor performance\n3.1 Formal process\n3.2 Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1 Work output\n5.2 Work quality\n5.3 Team participation\n5.4 Compliance with workplace protocols\n5.5 Safety\n5.6 Customer service\n\n--- PDF PAGE 12 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n8\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 13 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n9\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\nUNIT CODE\n\n:\n500311111\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nnegotiations\n1.1 Information on preparing\nfor negotiation is identified\nand included in the plan\n1.2 Information on creating non-\nverbal environments for\npositive negotiating is\nidentified and included in the\nplan\n1.3 Information on active\nlistening is identified and\nincluded in the plan\n1.4 Information on different\nquestioning techniques is\nidentified and included in the\nplan\n1.5 Information is checked to\nensure it is correct and up-\nto- date\n1.1. Knowledge on\nCodes of practice\nand guidelines for\nthe organization\n1.2. Knowledge of\norganizations policy\nand procedures for\nnegotiations\n1.3. Decision making\nand conflict\nresolution strategies\nprocedures\n1.4. Concept of\nnegotiation\n\n1.1. Communication\nskills (verbal and\nlistening)\n1.2. Active listening\n1.3. Setting conflict\n1.4. Preparing conflict\nresolution\n1.5. Problem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n1.6. Interpersonal\nskills to develop\nrapport with other\nparties\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed upon by\nall parties\n2.2 Desired outcome of all\nparties are considered\n2.3 Appropriate language is\nused throughout the\nnegotiation\n2.4 A variety of questioning\ntechniques are used\n2.5 The issues and processes\nare documented and agreed\nupon by all parties\n2.6 Possible solutions are\ndiscussed and their viability\nassessed\n2.7 Areas for agreement are\nconfirmed and recorded\n2.8 Follow-up action is agreed\nupon by all parties\n1.1. Outcome of\nnegotiation\n1.2. Knowledge on\nLanguage\n1.3. Different\nQuestioning\ntechniques\n1.4. Problem solving\nstrategies on how to\ndeal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n1.5. Flexibility\n1.6. Empathy\n1.7. Decision making\nand conflict\nresolution strategies\nprocedures\n2.1 Negotiating skill\n2.2 Communication\nskills (verbal\nand listening)\n2.3 Observation\nskills\n2.4 Interpersonal\nskills to develop\nrapport with\nother parties\n2.5 Applying\neffective\nquestioning\ntechniques\n2.6 Setting conflict\n\n--- PDF PAGE 14 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for negotiation\n1.1. Background information on other parties to the\nnegotiation\n1.2. Good understanding of topic to be negotiated\n1.3. Clear understanding of desired outcome/s\n1.4. Personal attributes\n1.4.1. self-awareness\n1.4.2. self esteem\n1.4.3. objectivity\n1.4.4. empathy\n1.4.5. respect for others\n1.5. Interpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non- verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self-disclosing\n1.6. Analytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non- verbal\nenvironments\n2.1. Friendly reception\n2.2. Warm and welcoming room\n2.3. Refreshments offered\n2.4. Lead in conversation before negotiation begins\n3. Active listening\n3.1. Attentive\n3.2. Don’t interrupt\n3.3. Good posture\n3.4. Maintain eye contact\n3.5. Reflective listening\n4. Questioning techniques\n4.1. Direct\n4.2. Indirect\n4.3. Open-ended\n\n--- PDF PAGE 15 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n11\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person\nto achieve an agreed outcome\n2. Resource Implications\nThe following resources should be provided:\n2.1 Room with facilities necessary for the negotiation\nprocess\n2.2 Human resources (negotiators)\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Observation/demonstration and questioning\n3.2 Portfolio assessment\n3.3 Oral and written questioning\n3.4 Third party report\n4. Context for Assessment\n4.1 Competency to be assessed in real work\nenvironment or in a simulated workplace setting.\n\n--- PDF PAGE 16 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n12\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nproblem\n1.1. Variances are identified\nfrom normal operating\nparameters; and product\nquality\n1.2. Extent, cause and\nnature are of the\nproblem are defined\nthrough observation,\ninvestigation and\nanalytical techniques\n1.3. Problems are clearly\nstated and specified\n1.1. Competence includes a\nthorough knowledge\nand understanding of\nthe process, normal\noperating parameters,\nand product quality to\nrecognize non-standard\nsituations\n1.2. Competence to include\nthe ability to apply and\nexplain, sufficient for\nthe identification of\nfundamental cause,\ndetermining the\ncorrective action and\nprovision of\nrecommendations\n1.3. Relevant equipment\nand operational\nprocesses\n1.4. Enterprise goals,\ntargets and measures\n1.5. Enterprise quality, OSH\nand environmental\nrequirement\n1.6. Enterprise information\nsystems and data\ncollation\n1.7. Industry codes and\nstandards\n1.8. Normal operating\nparameters and\nproduct quality\n1.1. Use range of\nformal problem\nsolving\ntechniques\n1.2. Identify and\nclarify the\nnature of the\nproblem\n1.3. Evaluate the\neffectiveness\nof a present\nprocess in the\ngalley\n1.4. Apply\nanalytical\ntechniques\n\n2. Determine\nfundamental\ncauses of the\nproblem\n2.1. Possible causes are\nidentified based on\nexperience and the use\nof problem solving tools /\nanalytical techniques.\n2.2. Possible cause\nstatements are\ndeveloped based on\nfindings\n2.1 Relevant equipment\nand operational\nprocesses\n2.2 Enterprise goals,\ntargets and measures\n2.3 Enterprise quality, OHS\nand environmental\nrequirements\n2.1 Analysis of root\ncauses\n\n--- PDF PAGE 17 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3. Fundamental causes are\nidentified per results of\ninvestigation conducted\n2.4 Enterprise information\nsystems and data\ncollation\n2.5 Industry codes and\nstandards\n3. Determine\ncorrective action\n3.1. All possible options are\nconsidered for resolution\nof the problem\n3.2. Strengths and\nweaknesses of possible\noptions are considered\n3.3. Corrective actions are\ndetermined to resolve the\nproblem and possible\nfuture causes\n3.4. Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and operating\nprocedures\n3.1. Understanding the\nprocedure in\nundertaking corrective\naction\n3.2. Principles of decision\nmaking strategies and\ntechniques\n3.3. Enterprise information\nsystems and data\ncollation\n3.4. Action planning\n3.1. Identifying and\nclarifying the\nnature of the\nproblem\n3.2. Devising the\nbest solution\n3.3. Evaluating the\nsolution\n3.4. Implementing\ndeveloped plan\nto rectify the\nproblem\n3.5. Implementing\ncorrective and\npreventive\nactions based\non root cause\nanalysis\n4. Provide\nrecommendations\nto manager\n4.1. Report on\nrecommendations are\nprepared\n4.2. Recommendations are\npresented to appropriate\npersonnel.\n4.3. Recommendations are\nfollowed-up, if required\n4.1 How to make a report\nand recommendation\n4.1 Writing report\nand\nrecommend-\nations\n\n--- PDF PAGE 18 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n14\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1. Brainstorming\n1.2. Intuitions/Logic\n1.3. Cause and effect diagrams\n1.4. Pareto analysis\n1.5. SWOT analysis\n1.6. Gant chart, Pert CPM and graphs\n1.7. Scattergrams\n\n2. Problem\n\n2.1. Non – routine process and quality problems\n2.2. Equipment selection, availability and failure\n2.3. Teamwork and work allocation problem\n2.4. Safety and emergency situations and incidents\n\n3. Action plans\n\n3.1. Priority requirements\n3.2. Measurable objectives\n3.3. Resource requirements\n3.4. Timelines\n3.5. Co-ordination and feedback requirements\n3.6. Safety requirements\n3.7. Risk assessment\n3.8. Environmental requirements\n\n--- PDF PAGE 19 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n15\n\nEVIDENCE GUIDE\n\n1. Critical\naspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified the problem\n1.2. Determined the fundamental causes of the problem\n1.3. Determined the correct / preventive action\n1.4. Provided recommendation to manager\nThese aspects may be best assessed using a range of scenarios\n/ case studies / what ifs as a stimulus with a walk through forming\npart of the response. These assessment activities should include\na range of problems, including new, unusual and improbable\nsituations that may have happened.\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A\nbank of scenarios / case studies / what ifs will be required as\nwell as bank of questions which will be used to probe the\nreason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Case studies on solving problems in the workplace\n3.2. Observation\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n4. Context for\nAssessment\n4.1. In all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 20 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n16\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\nUNIT CODE\n:\n500311113\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired in application of mathematical concepts and\ntechniques.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n1.1 Problem areas are\nidentified based on given\ncondition\n1.2 Mathematical techniques\nare selected based on the\ngiven problem\n\n1.1. Fundamental operation\n(addition, subtraction,\ndivision, multiplication)\n1.2. Units of measurement\nand its conversion\n1.3. Fundamental of units\n1.4. Standard formulas\n1.5. Basic measuring\ntools/devices\n1.6. Measurement system\n1.7. Basic measuring\ntools/devices\n1.8. Steps in solving problem\n1.1. Identifying and\nselecting different\nmeasuring tools\n1.2. Applying different\nformulas in solving\nproblems\n1.3. Describing the\nunits of\nmeasurement and\nfundamental units\n1.4. Stating arithmetic\ncalculations\ninvolving the\nfollowing; addition,\nsubtraction,\ndivision,\nmultiplication\n1.5. Applying theory\ninto actual\napplication on\nshipboard catering\nprocesses\n2. Apply\nmathematical\nprocedure/\n solution\n2.1 Mathematical techniques\nare applied based on the\nproblem identified\n2.2 Mathematical computations\nare performed to the level\nof accuracy required for the\nproblem\n2.3 Results of mathematical\ncomputation are\ndetermined and verified\nbased on job requirements\n2.1. Problem-based\nquestions\n2.2. Estimation\n2.3. Use of mathematical\ntools and standard\nformulas\n2.4. Mathematical techniques\n2.1. Solving\nmathematical\ncomputations\n2.2. Converting Metric\nto English\n2.3. Selecting and\nusing appropriate\nand efficient\ntechniques and\nstrategies to solve\nproblems\n3. Analyze results\n3.1 Results of application are\nreviewed based on\nexpected and required\nspecifications and outcome\n3.2 Appropriate action is\napplied in case of error\n\n3.1. Techniques in analyzing\nthe results\n3.2. Process in reviewing the\nresults\n3.3. Precision and accuracy\n3.4. Four fundamental\noperations\n3.5. Steps in solving problem\n3.6. Standard formulas\n3.7. Conversion\nmeasurement\n3.1. Analyzing the\nresult based on the\nspecified\nrequirements\n3.2. Interpreting and\ncommunicating the\nresults of the\nanalysis\n\n--- PDF PAGE 21 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n17\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Mathematical techniques May include:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\nMay include:\n2.1. Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2. Report error to immediate superior for proper action\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Resource Implications\nThe following resources should be provided:\n2.1 Calculator\n2.2 Basic measuring tools\n2.3 Case Problems\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Authenticated portfolio\n3.2 Written Test\n3.3 Interview/Oral Questioning\n3.4 Demonstration\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 22 ---\n_________________________________________________________________________________\nTR – Web Development NC III (Version 00) Promulgated February 27, 2018\n\n18\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\n\n(Apply technology effectively)\nUNIT CODE\n:\n500311114\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge, skills,\nand attitude required in