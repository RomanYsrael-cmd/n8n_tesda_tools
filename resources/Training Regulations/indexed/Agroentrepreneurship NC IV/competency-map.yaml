  "source_text": "Section 1\nAGROENTREPRENEURSHIP NCIV QUALIFICATION\n\nThe AGROENTREPRENEURSHIP NCIV Qualification consists of competencies that a\nperson must achieve to capacitate farmers, facilitate engagement of the Agroenterprise\nstakeholders, mobilize Agroenterprise community and monitor and evaluate Agroenterprise\nactivities.\n\nThis Qualification is packaged from the competency map of the Agriculture, Forestry and\nFishery Sector as shown in Annex A.\n\nThe units of competency comprising this qualification includes the following:\n\nCode\nBASIC COMPETENCIES\n500311115\nUtilize specialized communication skills\n500311116\nDevelop teams and individuals\n500311117\nApply problem solving techniques in the workplace\n500311118\nCollect, analyze and organize information\n500311119\nPlan and organize work\n500311120\nPromote environmental protection\n\nCode\nCOMMON COMPETENCIES\nAFF321201\nApply Safety Measures in Farm Operations\nAFF321203\nPerform Estimation and Basic Calculation\nHCS421201\nProvide Quality Customer Service\nHCS315202\nComply with Quality and Ethical Standards\n\nCode\nCORE COMPETENCIES\nAFF242301\nCapacitate Farmers\nAFF242302\nFacilitate Engagement of the Agroenterprise Stakeholders\nAFF242303\nMobilize Agroenterprise Community\nAFF242304\nMonitor and Evaluate Agroenterprise Activities\n\nA person who has achieved this Qualification is competent to be:\n\n• Agroenterprise Facilitator\n\n--- PDF PAGE 4 ---\nTR-Agroentrepreneurship NCIV\nPromulgated February 3, 2017\n\n3"
