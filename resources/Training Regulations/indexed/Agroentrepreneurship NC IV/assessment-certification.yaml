  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\n\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an employable\nunit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence in all the units of competency that\ncomprise the Training Regulations for AGROENTREPRENEURSHIP\nNCIV as follows:\n\nBASIC COMPETENCIES\nUtilize specialized communication skills\nDevelop teams and individuals\nApply problem solving techniques in the workplace\nCollect, analyze and organize information\nPlan and organize work\nPromote environmental protection\nCOMMON COMPETENCIES\nApply Safety Measures in Farm Operations\nPerform Estimation and Basic Calculation\nProvide Quality Customer Service\nComply with Quality and Ethical Standards\nCORE COMPETENCIES\nCapacitate Farmers\nFacilitate Engagement of the Agroenterprise\nStakeholders\nMobilize Agroenterprise Community\nMonitor and Evaluate Agroenterprise Activities\n\n\n4.1.2 Individuals wanting to be certified will have to be assessed in\naccordance with the requirements identified in the evidence guide of\nthe relevant unit/s of competency.\n\n--- PDF PAGE 136 ---\nTR-Agroentrepreneurship NC IV 135\n4.1.3 The following are qualified to apply for assessment and certification:\n\na. Graduating students/ trainees of WTR-registered programs or\ngraduates of NTR programs related to agro-entrepreneurship or\ngraduate of enterprise-based training programs or\nb. At least two (2) years work experience in facilitating Agroenterprise\ndevelopment or any related field (wage employed or self-employed).\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life\nexperiences may apply for recognition in a particular qualification\nthrough competency.\n\n4.1.5 The\nindustry\nshall\ndetermine\nassessment\nand\ncertification\nrequirements for each qualification with promulgated Training\nRegulations. It includes the following:\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as by industry.\n\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before\nthey are authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to assess\nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 137 ---\nTR-Agroentrepreneurship NC IV 136\n\n\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nSupermarket of Competencies\nAGRICULTURE, FORESTRY AND FISHERY SECTOR\n\nCapacitate\nFarmers\n\nFacilitate\nEngagement of\nthe\nAgroenterprise\nStakeholders\nMobilize\nAgroenterprise\nCommunity\nMonitor and\nEvaluate\nAgroenterprise\nActivities\nCOMMON\nCOMPETENCIES\nApply Safety\nMeasures in\nFarm\nOperations\nPerform\nEstimation and\nBasic Calculation\nDevelop teams\nand individuals\nUtilize specialized\ncommunication\nskills\nBASIC\nCOMPETENCIES\nApply problem\nsolving techniques\nin the workplace\n\nCollect, analyze and\norganize information\n\nPlan and\norganize work\n\nPromote\nenvironmental\nprotection\nProvide Quality\nCustomer\nService\nComply with\nQuality and\nEthical\nStandards\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 138 ---\nTR-Agroentrepreneurship NC IV 137\n"
