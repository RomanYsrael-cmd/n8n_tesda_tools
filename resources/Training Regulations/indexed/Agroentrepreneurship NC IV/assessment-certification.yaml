  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT \n \n \n \nCompetency Assessment is the process of collecting evidence and making \njudgments whether competency has been achieved. The purpose of assessment is \nto confirm that an individual can perform to the standards expected at the workplace \nas expressed in relevant competency standards. \n \nThe assessment process is based on evidence or information gathered to \nprove achievement of competencies. The process may be applied to an employable \nunit(s) of competency in partial fulfillment of the requirements of the national \nqualification. \n \n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS \n \n4.1.1 A National Certificate (NC) is issued when a candidate has \ndemonstrated competence in all the units of competency that \ncomprise the Training Regulations for AGROENTREPRENEURSHIP \nNCIV as follows: \n \nBASIC COMPETENCIES\nUtilize specialized communication skills \nDevelop teams and individuals \nApply problem solving techniques in the workplace \nCollect, analyze and organize information \nPlan and organize work \nPromote environmental protection \nCOMMON COMPETENCIES \nApply Safety Measures in Farm Operations \nPerform Estimation and Basic Calculation \nProvide Quality Customer Service \nComply with Quality and Ethical Standards \nCORE COMPETENCIES\nCapacitate Farmers\nFacilitate Engagement of the Agroenterprise \nStakeholders\nMobilize Agroenterprise Community\nMonitor and Evaluate Agroenterprise Activities\n \n \n4.1.2 Individuals wanting to be certified will have to be assessed in \naccordance with the requirements identified in the evidence guide of \nthe relevant unit/s of competency.\n\n--- PDF PAGE 136 ---\nTR-Agroentrepreneurship NC IV 135 \n4.1.3 The following are qualified to apply for assessment and certification: \n \na. Graduating students/ trainees of WTR-registered programs or \ngraduates of NTR programs related to agro-entrepreneurship or \ngraduate of enterprise-based training programs or \nb. At least two (2) years work experience in facilitating Agroenterprise \ndevelopment or any related field (wage employed or self-employed). \n \n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained \ncompetencies through informal training, previous work or life \nexperiences may apply for recognition in a particular qualification \nthrough competency. \n \n4.1.5 The \nindustry \nshall \ndetermine \nassessment \nand \ncertification \nrequirements for each qualification with promulgated Training \nRegulations. It includes the following: \na. entry requirements for candidates \nb. evidence gathering methods \nc. qualification requirements of competency assessors \nd. specific assessment and certification arrangements as by industry. \n \n \n4.2 COMPETENCY ASSESSMENT REQUISITE \n \n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is \naccomplished by the candidate prior to actual competency assessment. \nSAG is a pre-assessment tool to help the candidate and the assessor \ndetermine what evidence is available, where gaps exist, including \nreadiness for assessment. \n \n This document can: \n \na. Identify the candidate’s skills and knowledge \nb. Highlight gaps in candidate’s skills and knowledge \nc. Provide critical guidance to the assessor and candidate on the \nevidence that need to be presented \nd. Assist the candidate to identify key areas in which practice is needed \nor additional information or skills that should be gained prior \n \n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by \nTESDA is authorized to conduct competency assessment. Assessment \ncenters undergo a quality assured procedure for accreditation before \nthey are authorized by TESDA to manage the assessment for National \nCertification. \n \n4.2.3 Accredited Competency Assessor. Only accredited competency \nassessor is authorized to conduct assessment of competence. \nCompetency assessors undergo a quality assured system of \naccreditation procedure before they are authorized by TESDA to assess \nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 137 ---\nTR-Agroentrepreneurship NC IV 136 \n \n \n \nSupermarket of Competencies\nAGRI-FISHERY Sector\nSupermarket of Competencies \nAGRICULTURE, FORESTRY AND FISHERY SECTOR\n \nCapacitate \nFarmers \n \nFacilitate \nEngagement of \nthe \nAgroenterprise \nStakeholders\nMobilize \nAgroenterprise \nCommunity \nMonitor and \nEvaluate \nAgroenterprise \nActivities \nCOMMON \nCOMPETENCIES \nApply Safety \nMeasures in \nFarm \nOperations \nPerform \nEstimation and \nBasic Calculation\nDevelop teams \nand individuals\nUtilize specialized \ncommunication \nskills \nBASIC \nCOMPETENCIES \nApply problem \nsolving techniques \nin the workplace\n \nCollect, analyze and \norganize information\n \nPlan and \norganize work \n \nPromote \nenvironmental \nprotection \nProvide Quality \nCustomer \nService \nComply with \nQuality and \nEthical \nStandards\nCORE \nCOMPETENCIES\n\n--- PDF PAGE 138 ---\nTR-Agroentrepreneurship NC IV 137 \nDEFINITION OF TERMS \n \n1. \nAgroenterprise \nRefers to the business of organized farmers that actively \nwork with market actors, having relationships with buyers \nof their products and business service providers that \nsupport the movement of their products in the market \nchain at a profit. \n2. \nAgroenterprise \nobjective \nA one sentence statement that summarizes the targets for \nsales to the selected buyers, supply from the clustered \nfarmers, and projected net marketing income. \n3. \nAgroenterprise \nplan \nis a business plan for collective marketing that is \ncomprised of four component plans, namely: market plan, \nsupply plan, management plan and financial plan. \n4. \nAE service \nproviders \nis an organization, business or individual which offers \nservices on agro-enterprise to others in exchange for \npayment. \n5. \nBusiness action \nschedule \nA list of implementation activities needed to translate an \nagroenterprise plan into an actual marketing of the \nproducts. \n6. \nBusiness \nDevelopment \nServices (BDS) \nThe services that are necessary for the value chain to \nfunction. They include market information, market \nlinkages, research, extension and advisory services, credit \nand financial services, warehousing, input supply (seeds, \nfertilizers, etc), transport, certification and so on. \n \nDevelopment \nservice \ninstitutions \npresent \nin \nthe \ncommunity providing support services needed in farming \nactivities like financial, farm inputs, pre- and post-harvest \nfacilities, capacity development interventions. \n7. \nCapacity \nbuilding need \nis a planned development of (or increase in) knowledge, \noutput rate, management, skills, and other capability \nrequirement of an individual, organization or community \nthrough \nacquisition, \nincentives, \ntechnology, \nand/or \ntraining. \n8. \nCapacity \nbuilding \nprogram \nis a planned series of activies in developing and \nstrengthening the skills, instincts, abilities, processes and \nresources that an individual, organizations or communities \nneed to survive, adapt, and thrive in the fast-changing \nworld. \n9. \nClassroom \nTraining \nThis type of training is facilitated by an instructor either on-\nline or in a classroom setting. Instructor-led training allows\n\n--- PDF PAGE 139 ---\nTR-Agroentrepreneurship NC IV 138 \nfor learners and instructors or facilitators to interact and \ndiscuss the training material, either individually or in a \ngroup setting. \n10. Clusters \nis a group of 10-15 smallholder farmers who owned a farm \nor lease a farm that is family operated, willing to \nconsolidate some portion of their crop for collective \nmarketing. \n11. Collective \nMarketing \nIs the act of organizing small holder farmers in combining \ntheir produce to have a bigger volume and satisfy the \nrequirement of a particular market/buyer. \n \nis where a number of growers work together to sell their \ncombined crops. \n12. Engaged \nbuyers and \nBDS providers \nare the ones chosen after the interview and observation \ndone during the market visits because they provide \nbenefits of added income or are less risky to engage. \n13. Farmers \nRefers to farmer-member and cluster leader. \n14. Field activities/ \nfield work \npractical work/activities conducted by a student/trainee in \nthe natural environment, rather than in a room. \n15. Financial plan \nis a comprehensive evaluation of an investor's current and \nfuture financial state by using currently known variables to \npredict future cash flows, asset values and withdrawal \nplans. \n16. Formal markets \nA category of buyers characterized by their formal \narrangement with farmers before buying their product, and \nnegotiate prices that are agreed before a transaction is \ndone. \n17. Functional \norganization \nIs an organization with the following characteristics: \n-Registered either CDA, SEC, or DOLE \n-With Vision, Mission, Goals and Objectives \n-With services offered to members \n-With active set of officers and Management Staff \n-With functional Committees \n-With PSPs installed, implemented and updated \n-Conduct regular meetings \n18. Learnings \nis defined as knowledge gained from experience. \n19. Local Research \nTeam (LRT) \nis composed of selected cluster leaders and facilitators for \na total of 4 to 6 members. Of which 50% are farmers.\n\n--- PDF PAGE 140 ---\nTR-Agroentrepreneurship NC IV 139 \nA team comprised of at least two farmers and \nrepresentatives of local institutions supporting an \nagroenterprise who are tasked to gather and organize \ninformation on product supply and markets for use in \nbusiness planning, as well as presentation of all collective \nbusiness planning information to the farmers in the AE \ndevelopment process. \n20. Market chain \nTerm used to describe the multiple market channels \nthrough which market actors function to move a product or \nservice towards the consumers. \n21. Market chain \nactors \nThese are actors who undertake activities in the market \nchain. They are comprised of two kinds: (a) main chain \nactors or the actors who produce and those that add value \nto a product through buying and selling up until it reaches \nthe final consumer, and (b) business development \nservices which are the service providers that serve the \nneeds of the main chain actors and support the market \nchain to function effectively and efficiently. \n22. Market chain \nstudy \nIt is a process to gather information on the market actors \n(both buyers and BDS providers), their marketing \nactivities, costs and margins, and constraints and \nopportunities related to the movement of the selected \nproduct from the farmers up to the consumers. \n23. Market mapping\nThe drawing or a flow chart that illustrates the market \nactors, their linkages with one another and their core \nactivities to deliver a product to the buyers. \n24. Partnership \nBuilding \nactivities \nPartnership building activities may include: \n- MOA /MOU signing \n- Establish structure \n- Regular Meetings \n25. Post-test \nmarket \nassessment \nIt is a review after every sale of at least the first three test \nproduct deliveries that is focused on the differences \nbetween actual and planned results as specified in the \nagroenterprise plan. \n26. Practicum \na specialized field of study, that is designed to give \nstudents/ trainees supervised practical application of a \npreviously or concurrently studied theory. \n27. Production \nModule \na unit of measure in farm production that includes the \nrecommended farming practices, and cost and returns \nwith financing plan.\n\n--- PDF PAGE 141 ---\nTR-Agroentrepreneurship NC IV 140 \n28. Site Working \nGroup (SWG) \nThe Local partner institution that are willing to provide the \nof support to catalyze and assist the agroenterprise \ndevelopment process with the farmer. \n29. Smallholder \nfarmers \nOn agriculture: \nSmallholder Farmers are farmers with farmlands 3 \nhectares and below: \n \nOn aquaculture: \nSmall scale commercial fishing - fishing with passive or \nactive gear utilizing fishing vessels of 3.1 gross tons (GT) \nup to twenty (20) GT \n \nOn livestock: \nMost small farms usually keep 1 or 2 head of cattle \nmainly for draught, Raising of buffalo is predominantly a \nbackyard activity with 99.8 percent of the total population \nin the hands of smallholders, mainly the rice farmers. \nEach farm raises 1-3 buffalo according to the area they \ncultivate. \n \n \nOn Processed Products and as Business Firms (based \non assets) \nMicro - up to P3,000,000 \nSmall - P3,000,001 - P15,000,000 \n30. Standard \nprotocols \nare mandated, fixed procedure for completing a task. \n31. Traceability \nA system by which a product is tagged, such that it can be \ntraced from source of origin to final user. This process \nmay become mandatory in formalized food markets. \n32. Traditional \nbuyers \nA category of buyers with the common characteristics of \nhaving no formal arrangements with farmers before buying \ntheir product, and taking part in spot trading where prices \ncan change daily or hourly based on supply and demand. \n33. Value addition \nRefer to activities that increase the value of a product or \nservice as it flows along the market chain towards the \nconsumers. \n34. Value chain \nTerm used to describe a collaboration of market actors to \nbuild a mutually beneficial relationship to capture and \nshare value addition.\n\n--- PDF PAGE 142 ---\nTR-Agroentrepreneurship NC IV 141 \n35. Value chain \nupgrading \nRefer to incremental improvements of products, process \nand linkage that creates more value leading to increase in \nearnings and a relative advantage over competitors of the \nbusiness.\n\n--- PDF PAGE 143 ---\nTR-Agroentrepreneurship NC IV 142 \nACKNOWLEDGEMENTS \n \n \n \nThe Technical Education and Skills Development Authority (TESDA) wishes to \nextend gratitude and appreciation to the many representatives of business, industry, \nacademe and government agencies and labor groups who donated their time and \nexpertise to the development and validation of these Training Regulations. \n \nThis undertaking was also made possible through the collaborative project \nbetween TESDA and Department of Agrarian Reform (DAR). \n \n• THE TECHNICAL EXPERT PANEL (TEP) \n \n \nARNOLD AGBADA \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nElliptical Road, Diliman, Quezon City \nSUSANA E. LEONES \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nElliptical Rd. Diliman, Q.C. \nANDREA L. AQUINO \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nMabini Extention \nCabanatuan City, Nueva Ecija \nDENIZA J. LONGINO \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nElliptical Rd. Diliman, Q.C. \nCHONA L. BAHIAN \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nM. Suniel-Yakal Sts., Carmen, Cagayan \nde Oro City \nGLENDA T. ORLANES \nTechnical Expert \nXavier University Corrales Ave., \nCagayan de Oro City \nROY T. BOSQUE \nTechnical Expert \n \nLamac Multi-Purpose Cooperative \nLamac, Pinamungajan, Cebu \nBEATRIZ A. PABROS \nTechnical Expert \nUmingan Farmers Agrarian Reform \nCooperative (UFARC) \nBrgy. Luna Este, Umingan, Pangasinan\nEMILIA BULILAN \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nAplaya, Digos City, Davao del Sur \nCARMELA O. PAGULONG \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nElliptical Road, Diliman, Quezon City \n \nMA. ELENA C. CABAÑES \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nElliptical Road, Diliman, Quezon City \nNORBERTO S. QUITE \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nElliptical Road, Diliman, Quezon City \n \nONESIMO L. CUYCO \nTechnical Expert \nNational Livelihood Development \nCorporation (NLDC)\nAGNES U. ROJAS \nTechnical Expert \nDepartment of Agrarian Reform (DAR) \nElli