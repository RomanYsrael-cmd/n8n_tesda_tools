    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. TR-Agroentrepreneurship NC IV 136 Supermarket of Competencies AGRI-FISHERY Sector Supermarket of Competencies AGRICULTURE, FORESTRY AND FISHERY SECTOR Capacitate Farmers Facilitate Engagement of the Agroenterprise Stakeholders Mobilize Agroenterprise Community Monitor and Evaluate Agroenterprise Activities COMMON COMPETENCIES Apply Safety Measures in Farm Operations Perform Estimation and Basic Calculation Develop teams and individuals Utilize specialized communication skills BASIC COMPETENCIES Apply problem solving techniques in the workplace Collect, analyze and organize information Plan and organize work Promote environmental protection Provide Quality Customer Service Comply with Quality and Ethical Standards CORE COMPETENCIES TR-Agroentrepreneurship NC IV 137"
