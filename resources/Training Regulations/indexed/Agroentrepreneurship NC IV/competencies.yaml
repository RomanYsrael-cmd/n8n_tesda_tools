        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined information requirements based on \norganizational goals and objectives \n1.2 Used relevant forms and recording systems to gather data \n1.3 Processed data based on the objectives of the program \n1.4 Utilized relevant research methods based on the objective \nof the program \n1.5 Analyzed and organized information gathered \n1.6 Submitted/Disseminated technical reports to concerned \noffices \n2. Resource \nimplications \nThe following resources MUST be provided: \n2.1 Workplace or assessment location \n2.2 Access to office equipment and facilities relevant to the \nunit \n2.3 Case studies/scenarios \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written/ Oral Examination \n3.2 Interviews \n3.3 Portfolio \n4. Context of \nassessment \n4.1 Competency may be assessed in actual workplace or \nTESDA Accredited Assessment Center\n\n--- PDF PAGE 26 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n25\nUNIT OF COMPETENCY : \nPLAN AND ORGANIZE WORK \n \nUNIT CODE \n:"
        },
        "source_text": "500311118 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to process, \nanalyze, interpret and organize workplace information and \nother relevant data. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Study \ninformation \nrequirements \n1.1 Needs are identified \nusing established \nresearch \nprocedures \n1.2 Relevant forms and \nrecording systems \nare used to gather \nthe information \n1.3 Respondents are \nselected to implement \nsurvey/ research \nbased on established \nprocedures \n \n• Data processing, \nInformation analysis \nand interpretation \n• Research methods \no Qualitative \no Quantitative \no Statistical \n• Report writing \n• Use of relevant \nsoftware \no Spreadsheets \no Presentation \ngraphics \no Work processor \no Statistical \npackage \n• Communicating \neffectively \n• Performing research \n• Reading / \ninterpreting data and \ninformation \n• Problem solving \n2. Process data 2.1 Data are collected \nand collated based \non the prescribed \nmethod \n2.2 Relevant data are \nused as references in \naccordance with the \nobjectives of the \nprogram \n2.3 Information is \ncompiled according to \nthe required form \n \n• Data processing, \nInformation analysis \nand interpretation \n• Research methods \no Qualitative \no Quantitative \no Statistical \n• Report writing \n• Use of relevant \nsoftware \no Spreadsheets \no Presentation \ngraphics \no Work processor \no Statistical \npackage \n• Communicating \neffectively \n• Performing research \n• Reading / \ninterpreting data and \ninformation \n• Problem solving \n3. Analyze, \ninterpret and \norganize \ninformation \ngathered \n3.1 Data are analyzed \nusing relevant \nmethodologies \n3.2 Where applicable, \nstatistical \nanalysis/methods \nare employed \n• Data processing, \nInformation analysis \nand interpretation \n• Research methods \no Qualitative \no Quantitative \no Statistical \n• Communicating \neffectively \n• Performing research \n• Reading / \ninterpreting data and \ninformation \n• Problem solving\n\n--- PDF PAGE 23 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n22\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccording to the \nobjectives of the \nprogram \n3.3 Graphs and other \nvisual presentations \nare prepared to \nfacilitate analysis / \ninterpretation of \ninformation \n• Report writing \n• Use of relevant \nsoftware \no Spreadsheets \no Presentation \ngraphics \no Work processor \no Statistical \npackage \n4. Present \nfindings/ \nrecommendati\nons \n4.1 Findings/ \nrecommendations \nsummarized and \npresented/packaged \nin user-friendly \nmanner \n4.2 Relevant inputs \ngathered to finalize \nreport \n4.3 Draft report prepared \nbased on standard \nformat \n4.4 Technical reports are \nsubmitted and \ndisseminated to \nconcerned offices \n• Data processing, \nInformation analysis \nand interpretation \n• Research methods \no Qualitative \no Quantitative \no Statistical \n• Report writing \n• Use of relevant \nsoftware \no Spreadsheets \no Presentation \ngraphics \no Work processor \no Statistical \npackage \n• Communicating \neffectively \n• Performing research \n• Reading / \ninterpreting data and \ninformation \n• Problem solving\n\n--- PDF PAGE 24 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n23\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Research procedures \nMay include but are not limited to: \n1.1 TNA \n1.2 Front-end analysis \n1.3 Surveys \n1.4 Interviews \n1.5 Functional analysis \n1.6 DACUM research \n2. Forms \nMay include but are not limited to: \n2.1 Survey forms/Questionnaires \n2.2 Personal information/Profile \n2.3 Accident report form \n2.4 Requisition slip \n2.5 Job orders \n2.6 Purchase request form \n2.7 Incident report form \n3. Methodologies \n3.1 Qualitative methods \n3.2 Quantitative methods \n4. Statistical analysis/ \nmethods \n4.1. Averages (Mean, Median, Mode) \n4.2. Percentage \n4.3. Ranks \n4.4. Frequency Distribution \n4.5 Statistical test \n5. Data \n5.1. Raw Data \n6. Information \n6.1. Processed and packaged data\n\n--- PDF PAGE 25 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n24\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined information requirements based on \norganizational goals and objectives \n1.2 Used relevant forms and recording systems to gather data \n1.3 Processed data based on the objectives of the program \n1.4 Utilized relevant research methods based on the objective \nof the program \n1.5 Analyzed and organized information gathered \n1.6 Submitted/Disseminated technical reports to concerned \noffices \n2. Resource \nimplications \nThe following resources MUST be provided: \n2.1 Workplace or assessment location \n2.2 Access to office equipment and facilities relevant to the \nunit \n2.3 Case studies/scenarios \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written/ Oral Examination \n3.2 Interviews \n3.3 Portfolio \n4. Context of \nassessment \n4.1 Competency may be assessed in actual workplace or \nTESDA Accredited Assessment Center\n\n--- PDF PAGE 26 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n25\nUNIT OF COMPETENCY : \nPLAN AND ORGANIZE WORK \n \nUNIT CODE \n:"
