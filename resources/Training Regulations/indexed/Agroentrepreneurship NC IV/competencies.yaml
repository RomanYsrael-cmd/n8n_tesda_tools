          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Provide team \nleadership \n1.1 Learning and \ndevelopment needs \nare systematically \nidentified and \nimplemented in line \nwith organizational \nrequirements \n1.2 Learning plan to meet \nindividual and group \ntraining and \ndevelopmental needs \nis collaboratively \ndeveloped and \nimplemented \n1.3 Individuals are \nencouraged to self \nevaluate performance \nand identify areas for \nimprovement \n1.4 Feedback on \nperformance of team \nmembers is collected \nfrom relevant sources \nand compared with \nestablished team \nlearning process \n Coaching and \nmentoring \nprinciples \n Understanding how \nto work effectively \nwith team members \nwho have  diverse \nwork styles, \naspirations, cultures \nand perspective \n Understanding how \nto facilitate team \ndevelopment and \nimprovement \n Understanding \nmethods and \ntechniques for \neliciting and \ninterpreting \nfeedback \n Understanding \nmethods for \nidentifying and \nprioritizing personal \ndevelopment \nopportunities and \noptions \n Ability to read and \nunderstand a variety \nof texts, prepare \ngeneral information \nand documents \naccording to target \naudience; spell with \naccuracy; use \ngrammar and \npunctuation effective \nrelationships and \nconflict management \n Communication \nskills including \nreceiving feedback \nand reporting, \nmaintaining effective \nrelationships and \nconflict management \n Planning skills to \norganize required \nresources and \nequipment to meet \nlearning needs \n Coaching and \nmentoring skills to \nprovide support to \ncolleagues \n Reporting skills to \norganize information; \nassess information \nfor relevance and \naccuracy; identify \nand elaborate on \nlearning outcomes \n Facilitation skills to \nconduct small group \ntraining sessions\n\n--- PDF PAGE 10 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n9\nELEMENT \nPERFORMANCE \nCRITERIA \nItaliciz