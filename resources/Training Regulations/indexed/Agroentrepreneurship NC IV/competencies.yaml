        "source_text": "HCS315202 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes needed to \napply quality and ethical standards in the workplace. The unit \nalso includes the application of relevant safety procedures and \nregulations, organization procedures, client and industry \nrequirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n1. Assess \nquality of \nreceived \nmaterials \n1.1 Work instruction is \nobtained and carried \nout in accordance \nwith standard \noperating procedures \n1.2 Received materials \nare checked against \nworkplace standards \nand specifications \n1.3 Defective materials \nare identified, \nreported and isolated \n1.4 Defective materials \nare repaired/replaced \nin accordance with \nworkplace \nprocedures \n1.5 Defects and any \nidentified causes are \nrecorded and/or \nreported to the \nconcerned personnel \nin accordance with \nworkplace \nprocedures \n• Standard operating \nprocedures on receiving \nmaterials \n• Material descriptions \nand specifications \n• Proper handling of \nreceived materials \n• Procedures on \nassessing quality of \nreceived materials \n• Material defects and \ntheir causes \n• Dealing with defective \nmaterials \n• Reporting defective \nreceived materials \n• Total Quality \nManagement/Improvem\nent \n• Work values and ethics: \n Quality consciousness \n Honesty \n Integrity \n Concern for details \n• Comprehension \nskills \n• Communication \nskills \n• Critical thinking, \nproblem solving \nand decision-\nmaking skills \n• Technical skills \n• Interpersonal \nskills \n• Community \norganizing skills \n• Analytical skills \n• Quantitative \nskills \n• Qualitative skills \n2. Assess own \nwork/output \n2.1 Documentation \nrelative to quality \nwithin the company is \nidentified and used \n2.2 Completed work is \nchecked against \nworkplace standards \n2.3 Defects are identified \nand corrected in \naccordance with the \n• Organization’s vision, \nmission, goals and \nobjectives \n• Organization standards \non quality of \nwork/output \n• Rights, roles and \nresponsibilities of \nfarmers\n\n--- PDF PAGE 47 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n46\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \ncompany quality \nstandards \n• Assessment methods \non quality of \nwork/output \n• Procedures on \nassessing quality of \nwork/output \n• Procedures on \nidentification of work \ndefects/deviations \n• Common work/output \ndefects/deviations from \nstandards \n• Ways of rectifying \nwork/output \ndefects/deviations \n• Total Quality \nManagement/Improvem\nent \n• Work values and ethics: \n Honesty \n Integrity \n Commitment \n3. Submit \noneself to \nthird party \nassessment \n3.1 Information on the \nquality and other \nindicators of \nperformance are \nrecorded in \naccordance with \nworkplace \nprocedures \n3.2 In cases of deviations \nfrom specific quality \nstandards, causes \nare documented and \nreported in \naccordance with the \nworkplace’s \nstandards operating \nprocedures \n3.3 In cases of \nobjections/ \ndisagreements, \nreasons are \nexpressed thru \nwritten \ndocumentation \n• Organization’s vision, \nmission, goals and \nobjectives \n• Performance evaluation \nsystem and procedure \n• Performance key result \nareas and indicators \n• Procedures on third \nparty assessment of \nperformance \n• Documentation of work \ndefects/ deviations \n• Rectification of \nwork/output \ndefects/deviations and \ntheir causes \n• Total Quality \nManagement/Improvem\nent \n• Measures to improve \nwork performance \n• Work values and ethics: \n Humility \n Fairness\n\n--- PDF PAGE 48 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n47\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n3.4 Settlements are \nsought in accordance \nwith company \npolicies \n Integrity \n Quality consciousness \n4. Engage in \nquality \nimprovement \n4.1 Process improvement \nprocedures are \nparticipated in \nrelative to workplace \nassignment \n4.2 Work is carried out in \naccordance with \nprocess improvement \nprocedures \n4.3 Services are \ndelivered in \naccordance with \nethical standards \n4.4 Quality service is \nmonitored to ensure \nclient satisfaction \n4.5 Client’s needs are \nassessed through \nconduct of \nresearches, focus \ngroup discussions, \nand satisfaction \nsurveys/interviews \n4.6 Trainings, \norientations, and \nexposures are \nrendered to ensure \ntheir understanding/ \nfamiliarization on \nproducts, services \nand programs \n• Total Quality \nManagement/Improvem\nent \n• Methods of quality \nimprovement \n• Methods of monitoring \ncustomer satisfaction \n• Procedures in improving \nquality of customer \nservice: \n Assessment of clients’ \nneeds \n Monitoring quality of \nservice \n Identification of \nneeded improvement \nof quality \n Reporting of findings \nand recommendations \n e. Intervention to \nimprove quality \nservice to clients \n• Professional and ethical \nstandards in delivering \nservices to clients \n• Work values and ethics: \n Quality consciousness \n Integrity \n Commitment\n\n--- PDF PAGE 49 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n48\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \nMaterials may include but are not limited to: \n1.1 \nManuals, brochures, flyers, flipcharts, signages \nand tarpaulin \n1.2 \nWork orders \n1.3 \nStandard forms \n1.4 \nRecorded voice files/audio video presentations \n1.5 \nPowerPoint presentation materials \n1.6 \nDocumentations \n1.7 \nSoftware \n1.8 \nHardware \n1.9 \nOffice supplies \n1.10 Office equipment \n1.11 Holy Scri