n9. Selected market actors \nSelected market actors include at least: \n9.1 Three traditional local buyers \n9.2 Three traditional regional buyers \n9.3 Three formal markets \n9.4 Target BDS \n10. Appropriate safety measures \nAppropriate safety measures include but not limited to:\n\n--- PDF PAGE 73 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n72\n10.1 Handling of tools \n10.2 Handling of farm inputs \n10.3 Farming activities \n10.4 Pre and Post-production activities \n11. Workplace \nWorkplace include but not limited to: \n11.1 Farm production area \n11.2 Farm post-production/ processing area \n12. Assessment \nAssessment includes review of performance in: \n12.1 Marketing \n12.2 Supply \n12.3 Management \n12.4 Finance \n13. Adjustment \nAdjustment includes changes in the areas of: \n13.1 Market plan \n13.2 Supply plan \n13.3 Management plan \n13.4 Financial plan\n14. Product development \nProduct development may include but not limited to : \n14.1 Food processing \n14.2 Non-food processing \n14.3 By products \n14.4 Proper packaging and labeling\n15. Product diversification \nProduct diversification may include venturing into new or \nadditional: \n15.1 Crops \n15.2 Livestock \n15.3 Fishery products \n16. Additional market \nAdditional market may include but not limited to: \n16.1 Formal market (corporate, institutional) \n16.2 Informal markets (no business documentation)\n\n--- PDF PAGE 74 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n73\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Guided product selection \n1.2 Overseen in the development of Production Module \n1.3 Coached in the preparation of supply plan \n1.4 Lead Market Chain Study \n1.5 Supported Occupational Safety and Health (OSH) \nimplementation \n1.6 Directed test marketing activities \n1.7 Supported sustained marketing\n2. Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools, materials, supplies and equipment to be used to \ndemonstrate required tasks \n2.3 Reference materials (manual, guide book)\n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Oral questioning \n3.3 Demonstration \n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n\n--- PDF PAGE 75 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n74\nUNIT OF COMPETENCY \n:\nMONITOR AND EVALUATE AGROENTERPRISE \nACTIVITIES \nUNIT CODE \n:"
