nd \ninterpreting \nfeedback \n Understanding \nmethods for \nidentifying and \nprioritizing personal \ndevelopment \nopportunities and \noptions \n Knowledge of \ncareer paths and \ncompetency \nstandards in the \nindustry \naccording to target \naudience; spell with \naccuracy; use \ngrammar and \npunctuation effective \nrelationships and \nconflict management \n Communication \nskills including \nreceiving feedback \nand reporting, \nmaintaining effective \nrelationships and \nconflict management \n Planning skills to \norganize required \nresources and \nequipment to meet \nlearning needs \n Coaching and \nmentoring skills to \nprovide support to \ncolleagues \n Reporting skills to \norganize information; \nassess information \nfor relevance and \naccuracy; identify \nand elaborate on \nlearning outcomes \n Facilitation skills to \nconduct small group \ntraining sessions \n Ability to relate to \npeople from a range \nof social, cultural, \nphysical and mental \nbackgrounds  \n5.  Facilitate \naccomplishm\nent of \norganizational \ngoals \n5.1 Team members \nactively participated \nin team activities and \ncommunication \nprocesses \n5.2 Teams members \ndeveloped individual \nand joint \nresponsibility for their \nactions \n Coaching and \nmentoring \nprinciples \n Understanding how \nto work effectively \nwith team members \nwho have  diverse \nwork styles, \naspirations, cultures \nand perspective \n Ability to read and \nunderstand a variety \nof texts, prepare \ngeneral information \nand documents \naccording to target \naudience; spell with \naccuracy; use \ngrammar and \npunctuation effective\n\n--- PDF PAGE 13 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n12\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5.3 Collaborative efforts \nare sustained to \nattain organizational \ngoals \n Understanding how \nto facilitate team \ndevelopment and \nimprovement \n Understanding \nmethods and \ntechniques for \neliciting and \ninterpreting \nfeedback \n Understanding \nmethods for \nidentifying and \nprioritizing personal \ndevelopment \nopportunities and \noptions \n Knowledge of \ncareer paths and \ncompetency \nstandards in the \nindustry \nrelationships and \nconflict management \n Communication \nskills including \nreceiving feedback \nand reporting, \nmaintaining effective \nrelationships and \nconflict management \n Planning skills to \norganize required \nresources and \nequipment to meet \nlearning needs \n Coaching and \nmentoring skills to \nprovide support to \ncolleagues \n Reporting skills to \norganize information; \nassess information \nfor relevance and \naccuracy; identify \nand elaborate on \nlearning outcomes \n Facilitation skills to \nconduct small group \ntraining sessions \n Ability to relate to \npeople from a range \nof social, cultural, \nphysical and mental \nbackgrounds\n\n--- PDF PAGE 14 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n13\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.    Learning and  \n      development needs \n \n1.1 Coaching, mentoring and/or supervision \n1.2 Formal/informal learning program \n1.3 Internal/external training provision \n1.4 Work experience/exchange/opportunities \n1.5 Personal study \n1.6 Career planning/development \n1.7 Performance appraisals \n1.8 Workplace skills assessment \n1.9 Recognition of prior learning\n2.   Organizational      \n      requirements \n2.1 Quality assurance and/or procedures manuals \n2.2 Goals, objectives, plans, systems and processes \n2.3 Legal and organizational policy/guidelines and \nrequirements \n2.4 Safety policies, procedures and programs \n2.5 Confidentiality and security requirements \n2.6 Business and performance plans \n2.7 Ethical standards \n2.8 Quality and continuous improvement processes  \nand standards\n3.   Feedback on    \n      performance \n3.1 Formal/informal performance appraisals \n3.2 Obtaining feedback from supervisors and \ncolleagues \n3.3 Obtaining feedback from clients \n3.4 Personal and reflective behavior strategies \n3.5 Routine and organizational methods for \nmonitoring  service delivery\n4.   Learning delivery   \n     methods \n4.1 On the job coaching or mentoring \n4.2 Problem solving \n4.3 Presentation/demonstration \n4.4 Formal course participation \n4.5 Work experience \n4.6 Involvement in professional networks \n4.7 Conference and seminar attendance \n4.8 Induction\n\n--- PDF PAGE 15 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n14\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified and implemented learning opportunities for \nothers \n1.2 \nGave and received feedback constructively \n1.3 \nFacilitated participation of individuals in the work of the \nteam \n1.4 \nNegotiated learning plans to improve the effectiveness \nof learning \n1.5 \nPrepared learning plans to match skill needs \n1.6\nAccessed and designated learning opportunities\n2.  Resource \nimplications \nThe following resources MUST  be provided: \n2.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2\nMaterials relevant to the proposed activity or tasks\n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 \nObservation of work activities of the individual member \nin relation to the work activities of the group \n3.2 \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3 \nCase studies and scenarios as a basis for discussion of \nissues and strategies in teamwork\n4.  Context of \nassessment \n4.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group\n",
