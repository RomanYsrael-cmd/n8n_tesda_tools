        "source_title": "FACILITATE ENGAGEMENT OF THE AGROENTERPR STAKEHOLDERS",
        "source_text": "--- PDF PAGE 58 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n57\nUNIT OF COMPETENCY \n:\nFACILITATE ENGAGEMENT OF THE AGROENTERPR\nSTAKEHOLDERS \nUNIT CODE \n:\n AFF242302 \nUNIT DESCRIPTOR \n:\nThe unit deals with the knowledge, skills and attitudes \nrequired of AE facilitator to select project site, organize \nagroenterprise \nindustry \nstakeholders, \nmanage \npartnership sustainability, and lead the formalization of \nfarmers organization. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Select project \nsite \n1.1 Data are gathered \nbased on accepted \nindustry procedures \n1.2 Gathered data are \nprocessed using \nproject selection \ncriteria matrix based \non industry \nprocedures. \n1.3 Processed data are \nvalidated through \nconsultation with local \nAE stakeholders \n1.4 Analyzed data are \nused as basis for  \nrecommendation to \nAE stakeholders in \nselecting project site \n \n Sources of required \ndata/documents \n Methods and \nprocedures of data \ngathering \n Techniques in \nconducting \ninterviews, survey, \nfocus group \ndiscussion \n Basic statistics and \nstatistical analysis \n Procedures in using \nthe data for \nchoosing project \nsite \n Criteria in choosing \nproject site \n \nAttitudes: \n Hardworking \n Resourceful \n Committed \n Flexible \n Persistent \n Considerate \n Decisive \n Work oriented \n Realistic \n Analytical \n Optimistic \n Open-Minded \n Processing of data \n Validating of \nprocessed data \n Analyzing the data \ngathered \n Using the data for \nchoosing project site\n\n--- PDF PAGE 59 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n58\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2. Organize \nAgroenterpris\ne (AE) \nindustry \nstakeholders \n2.1 Profile of selected \nAgroenterprise \nIndustry \nstakeholders are \nreviewed  according \nto industry \nprocedures \n2.2 Buy-in session with \nstakeholders is \nconducted based on \nindustry procedure \n2.3  Site working group is \norganized following \nindustry practices \n2.4  Formal agreement is \nformulated based on \nindustry practice \n2.5 Formal Agreement \nsigning is facilitated to \nestablish partnership \n2.6  Farmers are \nclustered and \nprofiled according to \nindustry procedures \n2.7  Development of AE \npolicies of farmers is \nsupervised based on \nindustry standards \n Overview of the \nAgroenterprise \nClustering \nApproach \n Roles and \nresponsibilities of \nagroenterprise \nindustry \nstakeholders \n Industry procedures \nin identifying \nstakeholders \n Effective \nCommunication \nSkills \n Partnership \nPrinciples \n Partnership \nBuilding \n Different binding \ndocuments that \nsignify partnership \n(MOA/MOU) \n Classification of \nfarmers based on \ntenancy status \n Criteria in cluster \nformation \n Different Tools in \nprofiling \n Different policies \nrelated to AE   \n Procedure in \ndeveloping policies \nfor AE \n \nAttitudes: \n Diplomacy \n Respectful \n Resourceful \n Patience \n Committed \n Transparent \n Responsible \n Work-oriented \n Flexible \n Persistent \n Identifying AE \nindustry \nstakeholders \n Soliciting \ncommitment from \nlocal partners \n Establishing local \npartnership \n Clustering and \nprofiling of farmers \n Developing \nagroenterprise \npolicies \n Negotiating skills \n Organizing site \nworking group \n Facilitating formal \nagreement signing \n Formulating formal \nagreement\n\n--- PDF PAGE 60 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n59\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n Practical \n Open-minded \n3. Manage \npartnership \nsustainability \n3.1  Issues are analyzed \nand evaluated \naccording to \nestablished industry \nprocedures \n3.2  Policies are \ncommunicated  to \nindustry stakeholders \n3.3  Recommendations \nare gathered and \nproposed for policy \nimprovement based \non industry \nprocedures \n3.4 Conflicts among \nstakeholders are \nmanaged following \nthe agreed policies \nand procedures \n Different issues in \nimplementing \nAgroenterprise \n Procedures in \nanalyzing and \nevaluating issues \n Methods of problem \nsolving \n Different policies in \nimplementing \nAgroenterprise \n Updates or \nagreements for \nenhancement on \nexisting policies \n Conflict \nManagement \nconcept and tools \n \nAttitude:  \n Optimistic \n Disciplined \n Analytical \n Open-Minded \n Diplomaticy \n Respectful \n Resourceful \n Sensitive \n Patience \nImpartial\n Analyzing and \nevaluating issues \n Communicating \npolicies to AE \nPractitioners  \n Negotiating for \ncompromise \nagreements \n Managing conflicts \n4. Lead the \nregistration of \ninformal \nfarmer’s \norganization \n4.1  Formulation of \nStrategic Plan is \nfacilitated based on \nindustry procedures \n4.2. Farmers’ organization \nis assisted in the \nregistration \naccording to \ngovernment standard \nprocedures \n4.3  Formulation of \nInternal control \nmeasures is \nfacilitated following \nindustry procedures \n Components of \nstrategic plan \n Process of strategic \nplanning \n Government \nregulatory \nrequirements \n Advantages and \nbenefits of formal \nbusiness entity \n Approving and \nsigning authority \n Compliance \nprocedures \n Formulating \nStrategic Plan \n Assisting  the \nfarmers’ organization \nto register with \nappropriate \ngovernment \nagencies \n Formulating internal \ncontrol measures \n Accounting and \nanalytical skills \n Directing the \nimplementation of\n\n--- PDF PAGE 61 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n60\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n4.4  Enhancement of \nbusiness operation \nsystem is supervised \naccording to standard \nprocedures \n Checks and \nbalances \n Components of \nbusiness operation \nsystems \n Adoption policies, \nsystem, and \nprocedures \n Guidelines in the \nimplementation of \npolicies, systems \nand procedures \n \nAttitude: \n Resourceful \n Hardworking \n Committed \n Creative \n Proactive \n Responsive \n Patient \n Diligent \n Diplomatic \n Realistic \n Optimistic \nMotivated\nenhanced business \noperation system\n\n--- PDF PAGE 62 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n61\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Data \nData gathered may include: \n1.1 List of smallholder farmers \n1.2 Area (ha) cultivated \n1.3 Crops planted \n1.4 Institution who will initiate and take the lead to engage \nthe support of other institution \n1.5 Accessibility to markets \n1.6 Active Peoples Organizations/Farmers Organizations \n1.7 Supportive Local Government Units \n2. AE Industry stakeholders \nAE Industry stakeholders may include but not limited to: \n2.1 Farmer Organizations \n2.2 Non-government Organizations (NGOs) \n2.3 National Government Agencies \n2.4 Financing Institutions \n2.5 Local Government Units (LGUs) \n2.6 Association of Chamber of Commerce \n2.7 National Commission on Indigenous People \n2.8 State, Universities and Colleges (SUCs) \n3. Farmers \nFarmers may include but not limited to: \n3.1 Is a smallholder farmer \n3.2 Has a farm either owned or leased that is predominantly \nfamily operated \n3.3 Is willing to consolidate some portion of their crop for \ncollective marketing \n3.4 Is willing to work in a group \n3.5 Is respected in the community \n4. Clustering of farmers \nClustering of farmers may include: \n4.1 By products \n4.2 By Geographical  location \n5. Policies \nPolicies on agroenterprise developed but not limited to: \n5.1 Marketing Policies  \n5.2 Production Policies \n5.3 Finance-related policies \n5.4 Organizational and Management Policies \n5.4.1 Cluster membership \n5.4.2 Cluster organizational structure \n5.4.3 Meetings \n5.4.4 Record keeping \n5.4.5 Participation to collective marketing \n5.4.6 Career development goal \n5.4.7 Compensation and benefits \n \n6. Conflicts \nConflicts may include but not limited to the following: \n6.1 Non-compliance with formal agreement \n6.2 Non-attendance to meetings \n7. Strategic plan \nStrategic plan may include but not limited to: \n7.1 Vision \n7.2 Mission\n\n--- PDF PAGE 63 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n62\n7.3 Goals & Objectives \n7.4 3 year targets on sales \n8. Registration \nRegistration may include : \n8.1 Filing of documentary requirements \n8.2 Receipt of certificate of registration \n9. Internal Control \nInternal Control may include but not limited to: \n9.1 Approving and signing authority  \n9.2 Compliance procedures \n9.3 System of checks and balances \n10. Business operation system \nBusiness Operation system may include but not limited to: \n10.1 Manual of operation \n10.2 Policies System and procedures \n10.3 Internal Control measures \n11. Formal agreement \nMay include but not limited to: \n11.1 MOA \n11.2 MOU\n\n--- PDF PAGE 64 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n63\nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Selected project site \n1.2 Organized Agroenterprise (AE) industry stakeholders \n1.3 Managed partnership sustainability \n1.4 Led the formalization of  farmer’s organization \n2.  Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools, materials, supplies and equipment to be used to \ndemonstrate required tasks \n2.3 Reference materials (manual, guide book) \n3.  Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Demonstration \n3.3 Oral questioning \n3.4 Interview \n3.5 Portfolios \n4.  Context of Assessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n",
