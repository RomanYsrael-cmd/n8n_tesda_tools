        "source_text": "--- PDF PAGE 41 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n40\nUNIT OF COMPETENCY  \n: \nPROVIDE QUALITY CUSTOMER SERVICE  \n \nUNIT CODE  \n \n \n: \nHCS421201 \n \nUNIT DESCRIPTOR \n \n \n: \nThis unit covers the knowledge, skill and  \n \n \n \n \nattitudes required to provide effective and efficient  \n \n \n \n \nservices to the clients of the microfinance industry. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1.  Update \nknowledge of \nproducts and \nservices \n1.1 Products and/or \nservices to be \nmarketed are \nidentified, familiarized \nwith and fully \nunderstood \n1.2 Information on \nprograms is \naccessed \n1.3 Knowledge on \nproducts, services \nand programs are \nupdated \n1.4 Additional information \non products, services \nand programs are \nprepared \n Introduction to \nMicrofinance \n Terms and \ndefinitions \n Organization profile \n MFIs products and \nservices (financial \nand non-financial):  \n Loans \n Savings \n Insurance \n Trainings \n Marketing \nAssistance \n MFIs programs \n Organization \nprocedures and \nprocesses in \nproviding quality \ncustomer service \n Work values and \nethics: \n Quality \nconsciousness \n Proactive \n Patience \n Information \nawareness \n Effective oral \ncommunication skills \n Listening skills \n Motivational skills \n Interpersonal skills \n Presentation skills \n Demonstrating \ncost/benefits/ value \nto clients based on \nclient’s expectations \nand needs \n Generating several \nalternative solutions \nthat will meet \ncustomer’s needs \n Data gathering skills \n Computer literacy \n2.  Assess \nneeds of new \nand existing \nclients \n2.1 Active listening is \nused to gather \ninformation from \nclients \n2.2 Orientation on \nproducts/services, \nprogram and policies \nare conducted \n Terms and \ndefinitions \n Methods of \nassessing needs of \nnew and existing \nclient’s: \n Interviewing \n Observation\n\n--- PDF PAGE 42 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n41\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.3 Identified related or \napplicable needs of \nclients based on the \nproducts/services \nand program being  \noffered \n2.4 Provided clients with \ncourteous and \nprofessional \ntreatment throughout \nthe interaction using \ninteractive \ncommunication \n2.5 Inquiries, concerns \nand comments are \nresponded   to \npromptly and \naccurately in \naccordance with \norganization’s \npolicies \n2.6 Recorded all the \ngathered information \ngiven by the  clients   \n Focus Group \nDiscussion \n Needs Survey \n Procedures in \nconducting product \nand service \norientation of \nclients \n Procedures in \nassessing needs of \nnew and existing \nclient’s \n Procedure in \ninnovating products \nand services  \n Guidelines on \nrecording and \nreporting clients’ \nneeds \n Work values and \nethics: \n Quality \nconsciousness \n Proactive \n Clients focus \n Patience \n Vigilance \n Sincerity \n Integrity \n Commitment \n3.  Conduct \nclient \nsatisfaction \nsurvey \n3.1 Client satisfaction \nsurvey is \nadministered \n3.2 Survey results are \ncollated and analyzed\n3.3 Positive and negative \nresults are defined \n3.4 Negative feedbacks \nare well addressed  \nimmediately through \nappropriate \ncommunication  \nstrategies \n Terms and \ndefinitions \n Client satisfaction \nsurvey \nmethodologies: \n Interviewing \n Observation \n Focus Group \nDiscussion \n Structured Field \nSurvey \n Survey Process: \n Purpose of survey\n Designing survey \ninstruments\n\n--- PDF PAGE 43 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n42\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n Designing \ninterview and \nFGD guides \n Administering \nsurvey \ninstruments \n Interviewing \ntarget \nrespondents \n Conducting FGD \n Data processing, \nanalysis and \npresentation \n Recommendation\ns \n How feedback from \nsurvey results are \naddress  \n Work values and \nethics: \n Quality \nconsciousness \n Proactive \n Patience \n Sincerity \n Integrity \n Commitment  \n Courteous  \nProfessional\n\n--- PDF PAGE 44 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n43\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Product/services and \nprograms \nIncludes the following but are not limited to: \n1.1 Financial services \n1.2 Non-financial services \n2.  Clients \n2.1 Entrepreneurial poor \n3.  Needs \n3.1 Designing clients satisfaction survey instruments \n3.2 Procedure in administering clients satisfaction \nsurvey \n3.3 Processing clients satisfaction survey data \n3.4 Product/service knowledge \n3.5 Knowledge of programs \n4.  Interactive communication \n4.1 Information is gathered in a courteous and \nprofessional manner \n4.2 Probing skills \n4.3 Skills in effective questioning \n4.4 Consistent service quality for all types of \ncustomers \n4.5 Avoiding controversial issues like politics and \nreligion \n5.  Communication strategies \n5.1 One-on-one interaction \n5.2 Group meetings\n\n--- PDF PAGE 45 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n44\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Received, assessed and responded to client needs \n1.2 Applied organizational quality procedures and processes \nin providing quality service \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1 Meeting venue/s \n2.2 Equipment and furnishings appropriate to a microfinance \nset-up \n2.3 Complete information on products, services and programs \n2.4 Products, services and programs brochures \n2.5 Organization’s standard forms for clients \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1 Oral questioning \n3.2 Written test \n3.3 Practical demonstration \n4.  Context for \nassessment \n4.1 Competency may be assessed in the workplace or in a \nsimulated workplace environment\n",
