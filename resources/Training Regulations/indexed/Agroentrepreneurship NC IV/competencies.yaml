        "source_title": "COMPLY WITH QUALITY AND ETHICAL STANDARDS",
        "source_text": "--- PDF PAGE 46 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n45\nUNIT OF COMPETENCY : \nCOMPLY WITH QUALITY AND ETHICAL STANDARDS \n \nUNIT CODE  \n \n: \nHCS315202 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes needed to \napply quality and ethical standards in the workplace. The unit \nalso includes the application of relevant safety procedures and \nregulations, organization procedures, client and industry \nrequirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n1.  Assess \nquality of \nreceived \nmaterials \n1.1 Work instruction is \nobtained and carried \nout in accordance \nwith standard \noperating procedures \n1.2 Received materials \nare checked against \nworkplace standards \nand specifications \n1.3 Defective materials \nare identified, \nreported and isolated \n1.4 Defective materials \nare repaired/replaced \nin accordance with \nworkplace \nprocedures \n1.5 Defects and any \nidentified causes are \nrecorded and/or \nreported to the \nconcerned personnel \nin accordance with \nworkplace \nprocedures \n Standard operating \nprocedures on receiving \nmaterials \n Material descriptions \nand specifications \n Proper handling of \nreceived materials \n Procedures on \nassessing quality of \nreceived materials \n Material defects and \ntheir causes \n Dealing with defective \nmaterials \n Reporting defective \nreceived materials \n Total Quality \nManagement/Improvem\nent \n Work values and ethics: \n Quality consciousness \n Honesty \n Integrity \n Concern for details \n Comprehension \nskills \n Communication \nskills \n Critical thinking, \nproblem solving \nand decision-\nmaking skills \n Technical skills \n Interpersonal \nskills \n Community \norganizing skills \n Analytical skills \n Quantitative \nskills \n Qualitative skills \n2.  Assess own \nwork/output \n2.1 Documentation \nrelative to quality \nwithin the company is \nidentified and used \n2.2 Completed work is \nchecked against \nworkplace standards \n2.3 Defects are identified \nand corrected in \naccordance with the \n Organization’s vision, \nmission, goals and \nobjectives \n Organization standards \non quality of \nwork/output \n Rights, roles and \nresponsibilities of \nfarmers\n\n--- PDF PAGE 47 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n46\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \ncompany quality \nstandards \n Assessment methods \non quality of \nwork/output \n Procedures on \nassessing quality of \nwork/output \n Procedures on \nidentification of work \ndefects/deviations \n Common work/output \ndefects/deviations from \nstandards \n Ways of rectifying \nwork/output \ndefects/deviations \n Total Quality \nManagement/Improvem\nent \n Work values and ethics: \n Honesty \n Integrity \n Commitment \n3.  Submit \noneself to \nthird party \nassessment  \n3.1 Information on the \nquality and other \nindicators of \nperformance are \nrecorded in \naccordance with \nworkplace \nprocedures \n3.2 In cases of deviations \nfrom specific quality \nstandards, causes \nare documented and \nreported in \naccordance with the \nworkplace’s \nstandards operating \nprocedures \n3.3 In cases of \nobjections/ \ndisagreements, \nreasons are \nexpressed thru \nwritten \ndocumentation \n Organization’s vision, \nmission, goals and \nobjectives \n Performance evaluation \nsystem and procedure \n Performance key result \nareas and indicators \n Procedures on third \nparty assessment of \nperformance  \n Documentation of work \ndefects/ deviations  \n Rectification of \nwork/output \ndefects/deviations and \ntheir causes \n Total Quality \nManagement/Improvem\nent  \n Measures to improve \nwork performance \n Work values and ethics: \n Humility \n Fairness\n\n--- PDF PAGE 48 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n47\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n3.4 Settlements are \nsought in accordance \nwith company \npolicies \n Integrity \n Quality consciousness \n4.  Engage in \nquality \nimprovement \n4.1 Process improvement \nprocedures are \nparticipated in \nrelative to workplace \nassignment \n4.2 Work is carried out in \naccordance with \nprocess improvement \nprocedures \n4.3 Services are \ndelivered in \naccordance with \nethical standards \n4.4 Quality service is \nmonitored to ensure \nclient satisfaction \n4.5 Client’s needs are \nassessed through \nconduct of \nresearches, focus \ngroup discussions, \nand satisfaction \nsurveys/interviews \n4.6 Trainings, \norientations, and \nexposures are \nrendered to ensure \ntheir understanding/ \nfamiliarization on \nproducts, services \nand programs \n Total Quality \nManagement/Improvem\nent \n Methods of quality \nimprovement \n Methods of monitoring \ncustomer satisfaction \n Procedures in improving \nquality of customer \nservice:  \n Assessment of clients’ \nneeds \n Monitoring quality of \nservice  \n Identification of \nneeded improvement \nof quality \n Reporting of findings \nand recommendations \n e. Intervention to \nimprove quality \nservice to clients  \n Professional and ethical \nstandards in delivering \nservices to clients \n Work values and ethics: \n Quality consciousness \n Integrity \n Commitment\n\n--- PDF PAGE 49 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n48\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Materials \nMaterials may include but are not limited to: \n1.1 \nManuals, brochures, flyers, flipcharts, signages  \nand tarpaulin \n1.2 \nWork orders \n1.3 \nStandard forms \n1.4 \nRecorded voice files/audio video presentations \n1.5 \nPowerPoint presentation materials \n1.6 \nDocumentations  \n1.7 \nSoftware \n1.8 \nHardware \n1.9 \nOffice supplies  \n1.10 Office equipment \n1.11 Holy Scriptures\n2.  Defects/Irregularities \nDefects may include but are not limited to: \n2.1 \nDeviation from the requirements of the client  \n2.2 \nDeviation from the requirements and standard \noperating procedures of the \norganization/institution \n2.3 \nManuals containing incorrect/outdated \ninformation \n2.4 \nSoftware/hardware defects \n2.5 \nPoor employee interpersonal \nrelationships/conflicts among employees  \n2.6 \nLoose implementation of organizational policies \nand procedures \n2.7 \nPoor/inappropriate training designs \n2.8 \nNon-compliance of selection and recruitment \nprocedures of employees \n2.9 \nWork fatigue and lost of interest to work being \nexperience by the employee/s \n2.10 Lack of clear understanding about one’s role \nand responsibilities   \n2.11 Non-compliance of selection and recruitment \nprocedures of clients \n2.12 Undesirable work behavior of employees \n2.13 Breakdown of/barriers to communication \n2.14 Outdated work plans and schedules\n3.  Documentation \nIncludes the following but are not limited to: \n3.1 \nStandard Operating Procedures  \n3.2 \nQuality checklist \n3.3 \nMonitoring feedback sheet \n3.4 \nForms such as Loan Applications, CCI/BI, Cash \nFlows, Loan Utilization Checks, Client \nExits/Withdrawals, Work/Job Order, Client \nFeedback Notice, Material Requisition Form,\n\n--- PDF PAGE 50 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n49\nPerformance Appraisal Report, Training \nEvaluation Forms \n3.5 \nReports such as Financial Statements, \nOperational Assessments/Highlights and Plans, \nCash Position Reports \n3.6 \nMinutes of meetings (Board, Branch, \nDepartment/Units/Groups) \n3.7 \nSpecial orders, memorandums, notices, \nannouncements \n3.8 \nEmployee movements (promotion, demotion, \ndischarge, termination, suspension) \n3.9 \nLinkages such as Loan Verification, SSS and \nPhilhealth dues. \n3.10 Organizational Profile (Vision, Mission, Goals \nand Objectives) \n3.11 Electronic documentations e.g. Website \n3.12 Files/Employees’ Profile\n4.Quality standards \nQuality standards may be related but are not limited \nto the following: \n4.1 \nMaterials \n4.2 \nSoftware \n4.3 \nOffice supplies \n4.4 \nOffice facilities \n4.5 \nOffice equipment  \n4.6 \nOffice standard forms \n4.7 \nWork processes \n4.8 \nCustomer service \n4.9 \nProducts and services \n4.10 Work outputs \n4.11 Communication process \n4.12 Ethical and professional ethics \n4.13 Training program design and delivery \n4.14 Value added services/product innovations \n4.15 Organization’s policies and procedures manual\n5.Client \nIncludes the following but are not limited to: \n5.1 \nExternal clients (customers, partners, \nmembers, subscribers, end users, \ninvestors/funders, service providers, agencies) \n5.2 \nInternal clients (within the organization/co-\nemployees, immediate superiors, board of \ntrustees)\n\n--- PDF PAGE 51 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n50\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Performed work in accordance with the organization’s \nstandard operating procedures and specifications \n1.2 Identified and reported defects in accordance with \nstandard operating procedures \n1.3 Carried out work in accordance with the process \nimprovement procedures \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1 Product manuals and brochures \n2.2 Marketing and promotional materials \n2.3 Orientation and presentation materials \n2.4 Office standard forms and documentation \n2.5 Operational handbook/manuals \n2.6 Work plans and schedules \n2.7 Hardware \n2.8 Software \n3.Method of \nassessment \nCompetency may be assessed through: \n3.1 Written examination \n3.2 Interviews \n3.3 Audit report \n3.4 Monthly reports  \n3.5 Practical demonstration \n3.6 Performance evaluation \n4. Context for \nassessment \n4.1 Assessment may be conducted in the workplace or in a \nsimulated workplace environment\n",
