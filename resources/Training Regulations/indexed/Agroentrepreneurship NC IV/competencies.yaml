        "source_text": "--- PDF PAGE 4 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n3\nSECTION 2  \n \nCOMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in AGROENTREPRENEURSHIP NCIV. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nUTILIZE SPECIALIZED COMMUNICATION SKILLS \n \nUNIT CODE \n: \n500311115 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nto use specialized communication skills to meet specific \nneeds of internal and internal clients, conduct interviews, \nfacilitate group of discussions, and contribute to the \ndevelopment of communication strategies. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Meet common \nand specific \ncommunication \nneeds of clients \nand colleagues\n1.1 Specific \ncommunication needs \nof clients and \ncolleagues are \nidentified and met \n1.2 Different approaches \nare used to meet \ncommunication needs \nof clients and \ncolleagues \n1.3 Conflict is addressed \npromptly and in a \ntimely way and in a \nmanner which does \nnot compromise the \nstanding of the \norganization \n Communication \nprocess \n Dynamics of groups \nand different styles \nof group leadership \n Communication \nskills relevant to \nclient groups \n  \n Full range of \ncommunication \ntechniques including:\no Full range of \ncommunication \no Active listening \no Feedback \no Interpretation \no Role boundaries \nsetting \no Negotiation \no Establishing \nempathy \n Communication \nskills required to \nfulfill job roles as \nspecified by the \norganization\n2.  Contribute to \nthe \ndevelopment \nof \ncommunication \nstrategies \n2.1 Strategies for internal \nand external \ndissemination of \ninformation are \ndeveloped, promoted, \nimplemented and \nreviewed as required \n2.2 Channels of \ncommunication are \n Communication \nprocess \n Dynamics of groups \nand different styles \nof group leadership \n Communication \nskills relevant to \nclient groups \n Full range of \ncommunication \ntechniques including:\no Full range of \ncommunication \no Active listening \no Feedback \no Interpretation \no Role boundaries \nsetting\n\n--- PDF PAGE 5 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n4\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nestablished and \nreviewed regularly \n2.3 Coaching in effective \ncommunication is \nprovided  \n2.4 Work related network \nand relationship are \nmaintained as \nnecessary \n2.5 Negotiation and \nconflict resolution \nstrategies are used \nwhere required \n2.6 Communication with \nclients and colleagues \nis appropriate to \nindividual needs and \norganizational \nobjectives\no Negotiation \no Establishing \nempathy \n Communication \nskills required to \nfulfill job roles as \nspecified by the \norganization \n3.  Represent the \norganization \n3.1 When participating in \ninternal or external \nforums, presentation is \nrelevant, appropriately \nresearched and \npresented in a manner \nto promote the \norganization \n3.2 Presentation is clear \nand sequential and \ndelivered within a \npredetermined time \n3.3 Utilize appropriate \nmedia to enhance \npresentation \n3.4 Differences in views \nare respected \n3.5 Written \ncommunication is \nconsistent with \norganizational \nstandards \n3.6 Inquiries are \nresponded in a \nmanner consistent \nwith organizational \nstandard \n Communication \nprocess \n Dynamics of groups \nand different styles \nof group leadership \n Communication \nskills relevant to \nclient groups \n Full range of \ncommunication \ntechniques including:\no Full range of \ncommunication \no Active listening \no Feedback \no Interpretation \no Role boundaries \nsetting \no Negotiation \no Establishing \nempathy \n Communication \nskills required to \nfulfill job roles as \nspecified by the \norganization\n\n--- PDF PAGE 6 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n5\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.  Facilitate \ngroup \ndiscussion \n4.1 Mechanisms which \nenhance effective \ngroup interaction is \ndefined and \nimplemented \n4.2 Strategies which \nencourage all group \nmembers to \nparticipate are used \nroutinely \n4.3 Objectives and \nagenda for meetings \nand discussions are \nroutinely set and \nfollowed \n4.4 Relevant information \nis provided to group to \nfacilitate outcomes \n4.5 Evaluation of group \ncommunication \nstrategies is \nundertaken to promote \nparticipation of all \nparties \n4.6 Specific \ncommunication needs \nof individuals are \nidentified and \naddressed \n Communication \nprocess \n Dynamics of groups \nand different styles \nof group leadership \n Communication \nskills relevant to \nclient groups \n Full range of \ncommunication \ntechniques including:\no Full range of \ncommunication \no Active listening \no Feedback \no Interpretation \no Role boundaries \nsetting \no Negotiation \no Establishing \nempathy \n Communication \nskills required to \nfulfill job roles as \nspecified by the \norganization \n \n5.  Conduct \ninterview \n5.1 A range of appropriate \ncommunication \nstrategies are \nemployed in interview \nsituations \n5.2 Records of interviews \nare made and \nmaintained in \naccordance with \norganizational \nprocedures \n5.3 Effective questioning, \nlistening and \nnonverbal \ncommunication \ntechniques are used to \nensure that required \nmessage is \ncommunicated \n Communication \nprocess \n Dynamics of groups \nand different styles \nof group leadership \n Communication \nskills relevant to \nclient groups \n Full range of \ncommunication \ntechniques including:\no Full range of \ncommunication \no Active listening \no Feedback \no Interpretation \no Role boundaries \nsetting \no Negotiation \no Establishing \nempathy \n Communication \nskills required to \nfulfill job roles as \nspecified by the \norganization\n\n--- PDF PAGE 7 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n6\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Strategies  \n1.1 Recognizing own limitations \n1.2 Referral to specialists \n1.3 Utilizing techniques and aids \n1.4 Providing written drafts \n1.5 Verbal and non verbal communication \n2.  Effective  group interaction \n2.1 Identifying and evaluating what is occurring within an \ninteraction in a non judgmental way \n2.2 Using active listening \n2.3 Making decision about appropriate words, behavior \n2.4 Putting together response which is culturally \nappropriate \n2.5 Expressing an individual perspective \n2.6 Expressing own philosophy, ideology and background \nand exploring impact with relevance to  communication\n3.  Types of Interview \n3.1 Related to staff issues \n3.2 Routine \n3.3 Confidential  \n3.4 Evidential \n3.5 Non disclosure \n3.6 Disclosure\n4.  Interview situations \n4.1 Establish rapport \n4.2 Elicit facts and information \n4.3 Facilitate resolution of issues \n4.4 Develop action plans \n4.5 Diffuse potentially difficult situation\n\n--- PDF PAGE 8 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n7\nEVIDENCE GUIDE \n \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated effective communication skills with clients \naccessing service and work colleagues \n1.2 Adopted relevant communication techniques and strategies \nto meet client particular needs and difficulties\n2.  Resource \nimplications\n2.1 Access to appropriate workplace where assessment can \ntake place\n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Oral Interview\n4.  Context of \nassessment\n4.1 This unit should be assessed on the job through simulation\n",
