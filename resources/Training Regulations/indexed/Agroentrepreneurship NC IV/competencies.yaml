        "source_text": "--- PDF PAGE 16 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n15\n \nUNIT OF COMPETENCY : \nAPPLY PROBLEM SOLVING TECHNIQUES IN THE \nWORKPLACE \n \nUNIT CODE \n: \n500311117 \n \nUNIT DESCRIPTOR \n: \nThis competency covers the knowledge, skills and \nattitudes required to apply the process of problem solving \nand other problems beyond those associated directly with \nthe process unit.  It includes the application of structured \nprocesses and improvement tools.  This competency is \ntypically performed by an experienced technician, team \nleader or supervisor. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Analyze the \nproblem \n1.1 Issues/concerns are \nevaluated based on \ndata gathered \n1.2 Possible causes of \nproblem are identified \nwithin the area of \nresponsibility as \nbased on experience \nand the use of \nproblem solving \ntools/analytical \ntechniques \n1.3 Possible cause \nstatements are \ndeveloped based on \nfindings \n Broad \nunderstanding of \nsystems, \norganizational \nsystems and \nfunctions \n Broad knowledge of \nhelp desk and \nmaintenance \npractices \n Current industry \naccepted hardware \nand software \nproducts with broad \nand detailed \nknowledge of its \ngeneral features \nand capabilities  \n Broad knowledge of \nthe operating \nsystem \n Broad knowledge of \nthe client business \ndomain \n Broad knowledge \nbased incorporating \ncurrent industry \npractices related to \nescalation \nprocedures \n Decision making \nwithin a limited \nrange of options \n Communication is \nclear, precise and \nvaries according to \nthe type of audience \n Teamwork in \nreference to \npersonal \nresponsibility \n Time management \nas applied to self-\nmanagement. \n Analytical skills in \nrelation to routine \nmalfunctions. \n General customer \nservice skills \ndisplayed \n Questionin