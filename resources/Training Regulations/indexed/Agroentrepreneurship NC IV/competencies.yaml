        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nAnalyze the problem \n1.2 \nIdentified possible solutions \n1.3 \nImplemented solutions \n1.4 \nRecommended solutions to higher management \n1.5 \nOutcome evaluated/monitored \nEvidence of satisfactory performance in this unit can be \nobtained by observation of performance and questioning to \nindicate knowledge and understanding of the elements of the \ncompetency and performance criteria. \n2. Resource \nimplications \n2.1 \nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios/case studies/what ifs will \nbe required as well as bank of questions which will be \nused to probe the reasoning behind the observable \nactions.\n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 \nThrough direct observation of application to tasks and \nquestions related to underpinning knowledge \nUnder general guidance, checking various stages of \noperation and at the completion of the activity against \nperformance criteria and specifications\n4. Context of \nassessment \n4.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting \n4.2 \nAssessment shall be carried out through TESDA’s \nAccredited Assessment Centers/Venues while tasks are \nundertaken either individually or as part of a team under \nlimited supervision\n\n--- PDF PAGE 22 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n21\nUNIT OF COMPETENCY : \nCOLLECT, ANALYZE AND ORGANIZE INFORMATION \n \nUNIT CODE \n:"
