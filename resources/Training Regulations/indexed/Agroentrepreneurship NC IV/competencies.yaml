licies, procedures, protocols and local \nordinances relating to environmental protection \n2.3 Case studies/scenarios relating to environmental \nprotection \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written/ Oral Examination \n3.2 Interview/Third Party Reports \n3.3 Portfolio (citations/awards from GOs and NGOs, certificate \nof training – local and abroad) \n3.4 Simulations and role-plays \n4. Context of \nassessment \nCompetency may be assessed in actual workplace or at the \ndesignated TESDA center.\n\n--- PDF PAGE 35 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n34\nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nAPPLY SAFETY MEASURES IN FARM OPERATIONS \n \nUNIT CODE \n:"
