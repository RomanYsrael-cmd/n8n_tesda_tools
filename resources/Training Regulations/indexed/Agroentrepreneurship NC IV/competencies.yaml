ves \n7.4 3 year targets on sales \n8. Registration \nRegistration may include : \n8.1 Filing of documentary requirements \n8.2 Receipt of certificate of registration \n9. Internal Control \nInternal Control may include but not limited to: \n9.1 Approving and signing authority  \n9.2 Compliance procedures \n9.3 System of checks and balances \n10. Business operation system \nBusiness Operation system may include but not limited to: \n10.1 Manual of operation \n10.2 Policies System and procedures \n10.3 Internal Control measures \n11. Formal agreement \nMay include but not limited to: \n11.1 MOA \n11.2 MOU\n\n--- PDF PAGE 64 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n63"
