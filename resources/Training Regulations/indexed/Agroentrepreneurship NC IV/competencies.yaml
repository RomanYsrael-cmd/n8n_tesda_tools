        "source_title": "PROMOTE ENVIRONMENTAL PROTECTION",
        "source_text": "--- PDF PAGE 31 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n30\nUNIT OF COMPETENCY : \nPROMOTE ENVIRONMENTAL PROTECTION \n \nUNIT CODE \n: \n500311120 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nin adhering to environmental protection principles, strategies \nand guidelines \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Study \nguidelines for \nenvironmental \nconcerns \n1.1 Environmental \nlegislations/convent\nions and local \nordinances are \nidentified according to \nthe different \nenvironmental \naspects/impact \n1.2 Industrial standard/ \nenvironmental \npractices are \ndescribed according \nto the different \nenvironmental \nconcerns \n \n Features of an \nenvironmental \nmanagement strategy \n Environmental \nissues/concerns \n International \nEnvironmental \nProtocols (Montreal, \nKyoto)  \n Waste minimization \nhierarchy \n Environmental \nplanning/management \n Community needs and \nexpectations \n Resource availability \n Environment-\nfriendly/environmental \nadvocates \n 5S of Good \nHousekeeping \n 3Rs – Reduce, Reuse \n& Recycle \n Sanitary Code \n Environmental Code of \npractice \n Communicating \neffectively \n Performing \nresearch and \nanalysis \n Reading / \ninterpreting data \nand information \n Problem solving \n2. Implement \nspecific \nenvironmental \nprograms \n2.1 Programs/Activities \nare identified \naccording to \norganizations policies \nand guidelines \n2.2 Individual \nroles/responsibilities \nare determined and \nperformed based on \nthe activities \nidentified \n2.3 Problems/ constraints \nencountered are \n Features of an \nenvironmental \nmanagement strategy \n Environmental \nissues/concerns \n International \nEnvironmental \nProtocols (Montreal, \nKyoto)  \n Waste minimization \nhierarchy \n Environmental \nplanning/ management \n Communicating \neffectively \n Performing \nresearch and \nanalysis \n Reading / \ninterpreting data \nand information \n Problem solving\n\n--- PDF PAGE 32 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n31\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nresolved in \naccordance with \norganizations’ \npolicies and \nguidelines \n2.4 Stakeholders are \nconsulted based on \ncompany guidelines \n \n Community needs and \nexpectations \n Resource availability \n Environment-\nfriendly/environmental \nadvocates \n 5S of Good \nHousekeeping \n 3Rs – Reduce, Reuse \n& Recycle \n Sanitary Code \n Environmental Code of \npractice \n3.  Monitor \nactivities on \nenvironmental   \nprotection/pro\ngrams \n3.1 Activities are \nperiodically \nmonitored and \nevaluated according \nto the objectives of \nthe environmental \nprogram \n3.2 Feedback from \nstakeholders are \ngathered and \nconsidered in \nproposing \nenhancements to the \nprogram based on \nconsultations \n3.3 Data gathered are \nanalyzed based on \nevaluation \nrequirements \n3.4 Recommendations \nare submitted based \non the findings \n3.5 Management support \nsystems are \nset/established to \nsustain and enhance \nthe program \n3.6 Environmental \nincidents are \nmonitored and \nreported to \nconcerned/proper \nauthorities \n Features of an \nenvironmental \nmanagement strategy \n Environmental \nissues/concerns \n International \nEnvironmental \nProtocols (Montreal, \nKyoto)  \n Waste minimization \nhierarchy \n Environmental \nplanning/management \n Community needs and \nexpectations \n Resource availability \n Environment-\nfriendly/environmental \nadvocates \n 5S of Good \nHousekeeping \n 3Rs – Reduce, Reuse \n& Recycle \n Sanitary Code \n Environmental Code of \npractice \n Communicating \neffectively \n Performing \nresearch and \nanalysis \n Reading / \ninterpreting data \nand information \n Problem solving\n\n--- PDF PAGE 33 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n32\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Legislations/Conventions \nMay include but are not limited to: \n1.1 Clean Air act \n1.2 Clean Water Act  \n1.3 Solid Waste Management \n1.4 Montreal Protocol \n1.5 Kyoto Protocol \n2. Environmental  \naspects/impacts \n2.1 Air pollution \n2.2 Water pollution \n2.3 Noise pollution \n2.4 Solid waste  \n2.5 Flood control \n2.6 Deforestation/Denudation  \n2.7 Radiation/Nuclear /Radio Frequency/ Microwaves\n2.8 Situation  \n2.9 Soil erosion (e.g. Quarrying, Mining, etc.) \n2.10 Coral reef/marine life protection \n3. Industrial standards/ \nEnvironmental practices \n3.1 ECC standards \n3.2 ISO standards  \n3.3 company environmental management    systems \n(EMS) \n4. Periodic \n4.1 hourly \n4.2 daily \n4.3 weekly \n4.4 monthly \n4.5 quarterly \n4.6 yearly \n5. Programs/Activities \n5.1 Waste disposal (on-site and off-site) \n5.2 Repair and maintenance of equipment \n5.3 Treatment and disposal operations \n5.4 Clean-up activities \n5.5 Laboratory and analytical test \n5.6 Monitoring and evaluation \n5.7 Environmental advocacy programs\n\n--- PDF PAGE 34 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n33\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge of environmental legislations \nand local ordinances according to the different \nenvironmental issues/concerns \n1.2 Described industrial standard environmental practices \naccording to the different environmental issues/concerns \n1.3 Resolved problems/ constraints encountered based on \nmanagement  standard procedures \n1.4 Implemented and monitored environmental practices on a \nperiodic basis as per company guidelines \n1.5 Recommended solutions for the improvement of the   \nprogram \n1.6 Monitored and reported to proper authorities any \nenvironmental incidents \n2.  Resource \nimplications \nThe following resources MUST  be provided: \n2.1 Workplace/Assessment location \n2.2 Legislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n2.3 Case studies/scenarios relating to environmental \nprotection \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written/ Oral Examination \n3.2 Interview/Third Party Reports \n3.3 Portfolio (citations/awards from GOs and NGOs, certificate \nof  training – local and abroad) \n3.4 Simulations and role-plays \n4.  Context of \nassessment \nCompetency may be assessed in actual workplace or at the \ndesignated TESDA center.\n",
