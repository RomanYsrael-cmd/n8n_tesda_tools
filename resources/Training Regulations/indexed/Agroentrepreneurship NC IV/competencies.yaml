          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated knowledge of environmental legislations \nand local ordinances according to the different \nenvironmental issues/concerns \n1.2 Described industrial standard environmental practices \naccording to the different environmental issues/concerns \n1.3 Resolved problems/ constraints encountered based on \nmanagement standard procedures \n1.4 Implemented and monitored environmental practices on a \nperiodic basis as per company guidelines \n1.5 Recommended solutions for the improvement of the \nprogram \n1.6 Monitored and reported to proper authorities any \nenvironmental incidents \n2. Resource \nimplications \nThe following resources MUST be provided: \n2.1 Workplace/Assessment location \n2.2 Legislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n2.3 Case studies/scenarios relating to environmental \nprotection \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written/ Oral Examination \n3.2 Interview/Third Party Reports \n3.3 Portfolio (citations/awards from GOs and NGOs, certificate \nof training – local and abroad) \n3.4 Simulations and role-plays \n4. Context of \nassessment \nCompetency may be assessed in actual workplace or at the \ndesignated TESDA center.\n\n--- PDF PAGE 35 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n34\nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nAPPLY SAFETY MEASURES IN FARM OPERATIONS \n \nUNIT CODE \n:"
        },
