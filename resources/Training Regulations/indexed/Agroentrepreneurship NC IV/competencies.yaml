        "source_text": "500311119 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required in planning and \norganizing work. It may be applied to a small independent \noperation or to a section of a large organization. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Set \nobjectives \n1.1 Objectives are \nconsistent with and \nlinked to work \nactivities in \naccordance with \norganizational aims \n1.2 Objectives are stated \nas measurable \ntargets with clear time \nframes \n1.3 Support and \ncommitment of team \nmembers are \nreflected in the \nobjectives \n1.4 Realistic and \nattainable objectives \nare identified \n• Organization’s \nstrategic plan, \npolicies rules and \nregulations, laws \nand objectives for \nwork unit activities \nand priorities \n• Organizations \npolicies, strategic \nplans, guidelines \nrelated to the role of \nthe work unit \n• Team work and \nconsultation \nstrategies \n• Planning \n• Leading \n• Organizing \n• Coordinating \n• Communication \nSkills \n• Inter-and intra-\nperson/ motivation \nskills \n2. Plan and \nschedule \nwork activities \n2.1 Tasks/work activities \nto be completed are \nidentified and \nprioritized as directed \n2.2 Tasks/work activities \nare broken down into \nsteps in accordance \nwith set time frames \nachievable \ncomponents in \naccordance with set \ntime frames \n2.3 Resources are \nallocated as per \nrequirements of the \nactivity \n2.4 Schedule of work \nactivities is \ncoordinated with \npersonnel concerned \n• Organization’s \nstrategic plan, \npolicies rules and \nregulations, laws \nand objectives for \nwork unit activities \nand priorities \n• Organizations \npolicies, strategic \nplans, guidelines \nrelated to the role of \nthe work unit \n• Team work and \nconsultation \nstrategies \n• Planning \n• Leading \n• Organizing \n• Coordinating \n• Communication \nSkills \n• Inter-and intra-\nperson/motivation \nskills\n\n--- PDF PAGE 27 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n26\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Implement \nwork plans \n3.1 Work methods and \npractices are \nidentified in \nconsultation with \npersonnel concerned \n3.2 Work plans are \nimplemented in \naccordance with set \ntime frames, \nresources and \nstandards \n• Organization’s \nstrategic plan, \npolicies rules and \nregulations, laws \nand objectives for \nwork unit activities \nand priorities \n• Organizations \npolicies, strategic \nplans, guidelines \nrelated to the role of \nthe work unit \n• Team work and \nconsultation \nstrategies \n• Planning \n• Leading \n• Organizing \n• Coordinating \n• Communication \nSkills \n• Inter-and intra-\nperson/motivation \nskills \n4. Monitor work \nactivities \n4.1 Work activities are \nmonitored and \ncompared with set \nobjectives \n4.2 Work performance is \nmonitored \n4.3 Deviations from work \nactivities are reported \nand \nrecommendations are \ncoordinated with \nappropriate personnel \nand in accordance \nwith set standards \n4.4 Reporting \nrequirements are \ncomplied with in \naccordance with \nrecommended format \n4.5 Observe timeliness of \nreport \n4.6 Files are established \nand maintained in \naccordance with \nstandard operating \nprocedures \n• Organization’s \nstrategic plan, \npolicies rules and \nregulations, laws \nand objectives for \nwork unit activities \nand priorities \n• Organizations \npolicies, strategic \nplans, guidelines \nrelated to the role of \nthe work unit \n• Team work and \nconsultation \nstrategies \n• Planning \n• Leading \n• Organizing \n• Coordinating \n• Communication \nSkills \n• Inter-and intra-\nperson/motivation \nskills \n• Presentation skills \n5. Review and \nevaluate work \nplans and \nactivities \n5.1 Work plans, \nstrategies and \nimplementation are 