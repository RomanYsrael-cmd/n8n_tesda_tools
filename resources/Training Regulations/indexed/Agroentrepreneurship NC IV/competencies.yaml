        "source_text": "AFF242304 \nUNIT DESCRIPTOR \n:\nThe unit deals with the knowledge, skills and attitudes \nrequired of AE Facilitator to monitor AE development \nprogram, assess the development and implementation \nof AE program, and recommend corrective measures \nand improvement.\n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Monitor AE \nDevelopment \nProgram \n1.1 Partnership Building \nis monitored \naccording to agreed \nindustry standards \n1.2 Farmers \norganization is \nmonitored according \nto functionality based \non industry \nstandards \n1.3 AE Plan \nImplementation is \nmonitored based on \nindustry standards \n1.4 Field monitoring report \nis prepared \n• Partnership \nBuilding Concept \n• Monitoring & \nEvaluation tools \nand processes \n• Basic knowledge on \ncomputer \n• Community \norganizing \n• Types and \ncharacteristics of \norganization \n• Components of AE \nPlan \n \nAttitude: \n• Patience \n• Committed \n• Resourcefulness \n• Objective \n• Pro-active \n• Communicating \nSkills \n• Checking \npartnership building \nactivities \n• Checking the \nfunctionality of \nfarmers organization \n• Gathering of \ninformation \n• Computing skills \n• Data analysis \n• Documentation skills \n• Utilizing monitoring \ntools \n2. Assess the \ndevelopment \nand \nimplementatio\nn of AE \nProgram \n2.1 Partnership Building \nis assessed \naccording to agreed \nindustry standards \n2.2 Farmers organization \nis assessed \naccording to \nfunctionality based on \nindustry standards \n2.3 AE Plan \nImplementation is \nevaluated based on \nindustry practices \n• Compliance to \npartnership \nagreement \n• Procedures and \nguidelines in \nassessing \npartnership \n• Criteria of functional \norganization \n• Evaluation Tools \n \nAttitude: \n• Diligent \n• Assessing the \npartnership building \n• Evaluating the \nfunctionality of the \nfarmers organization \n• Assessing the AE \nPlan implementation \n• AE Plan Targets vs \nAccomplishments\n\n--- PDF PAGE 76 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n75\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.4 Evaluation report is \nprepared based on \nindustry procedure \n• Hardworking \n• Committed \n• Transparent \n3. Recommend \ncorrective \nmeasures \nand \nimprovement \n3.1 Preventive, \ncorrective \nmeasures and \nimprovement on \nPartnership is \nadvised based on \nthe monitoring and \nevaluation results \n3.2 Improvement of \nfarmers \norganization is \nrecommended \nbased on the \nmonitoring and \nevaluation results \n3.3 Enhancement on \nAE Plan \nImplementation is \nrecommended \nbased on the \nmonitoring and \nevaluation results \n• Needs/gaps of \npartnership \n• Appropriate \ncorrective \nmeasures \n• Improvement on \nPolicies, systems \nand procedures \n(PSPs) \n• Enhancement of \ncapacity building \non organizational \ndevelopment \n• Information on \nfuture needs of \nbusiness partners \n• Strategies to \nmaintain business \nrelationships \n \nAttitude: \n• Diligence \n• Hardworking \n• Committed \n• Transparent \n• Resourceful \n• Innovative \n• Patience \n• Recommending \ncorrective \nmeasures and \nimprovement \n(policies, \nstrategies) on \npartnership \n• Recommending \nimprovement of \nfarmers \norganization \n• Recommending \nthe enhancement \non AE Plan \nimplementation\n\n--- PDF PAGE 77 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n76\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Partnership \nPartnership includes but not limited to: \n1.1 SWG \n1.2 LRT \n1.3 National/local stakeholders \n1.4 Academe \n1.5 Financing institutions \n2. Farmers Organization \nFarmers Organization may include but not limited to: \n2.1 Cooperative \n2.2 Associations or ARB (Agrarian Reform Beneficiaries) \n2.3 Clusters \n3. Monitoring activities \nMonitoring activities include but not limited to: \n3.1 Quality and volume of products \n3.2 Product Delivery & sales \n3.3 Policies implementation \n3.4 Business Financial Performance \n3.5 Cluster leaders’ monitoring reports\n\n--- PDF PAGE 78 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n77\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Monitored AE Development Program \n1.2 Assessed the development and implementation of AE \nProgram \n1.3 Recommended corrective measures and improvement \n2. Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Training hall \n2.3 Tools, materials, supplies and equipment to be used to \ndemonstrate required tasks \n2.4 Reference and manuals \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Demonstration \n3.3 Oral questioning \n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center \nin a simulated workplace setting.\n\n--- PDF PAGE 79 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n78"
