tion of competency evidence) \n4. Context of \nassessment \n4.1 Competency may be assessed in the workplace or in \nsimulated work\n\n--- PDF PAGE 31 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n30\nUNIT OF COMPETENCY : \nPROMOTE ENVIRONMENTAL PROTECTION \n \nUNIT CODE \n:"
