ects \n2.5 \nPoor employee interpersonal \nrelationships/conflicts among employees \n2.6 \nLoose implementation of organizational policies \nand procedures \n2.7 \nPoor/inappropriate training designs \n2.8 \nNon-compliance of selection and recruitment \nprocedures of employees \n2.9 \nWork fatigue and lost of interest to work being \nexperience by the employee/s \n2.10 Lack of clear understanding about one’s role \nand responsibilities \n2.11 Non-compliance of selection and recruitment \nprocedures of clients \n2.12 Undesirable work behavior of employees \n2.13 Breakdown of/barriers to communication \n2.14 Outdated work plans and schedules\n3. Documentation \nIncludes the following but are not limited to: \n3.1 \nStandard Operating Procedures \n3.2 \nQuality checklist \n3.3 \nMonitoring feedback sheet \n3.4 \nForms such as Loan Applications, CCI/BI, Cash \nFlows, Loan Utilization Checks, Client \nExits/Withdrawals, Work/Job Order, Client \nFeedback Notice, Material Requisition Form,\n\n--- PDF PAGE 50 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n49\nPerformance Appraisal Report, Training \nEvaluation Forms \n3.5 \nReports such as Financial Statements, \nOperational Assessments/Highlights and Plans, \nCash Position Reports \n3.6 \nMinutes of meetings (Board, Branch, \nDepartment/Units/Groups) \n3.7 \nSpecial orders, memorandums, notices, \nannouncements \n3.8 \nEmployee movements (promotion, demotion, \ndischarge, termination, suspension) \n3.9 \nLinkages such as Loan Verification, SSS and \nPhilhealth dues. \n3.10 Organizational Profile (Vision, Mission, Goals \nand Objectives) \n3.11 Electronic documentations e.g. Website \n3.12 Files/Employees’ Profile\n4.Quality standards \nQuality standards may be related but are not limited \nto the following: \n4.1 \nMaterials \n4.2 \nSoftware \n4.3 \nOffice supplies \n4.4 \nOffice facilities \n4.5 \nOffice equipment \n4.6 \nOffice standard forms \n4.7 \nWork processes \n4.8 \nCustomer service \n4.9 \n