1.3 Market information \n1.4 Price \n1.5 Trending \n2. Guidelines \nGuidelines includes but not limited to: \n2.1 Resulting income \n2.2 Available market \n2.3 Commonly grown in the area \n2.4 Production capacity \n2.5 Sustainability \n3. Production Data \nProduction Data includes but not limited to: \n3.1 Farming Practices \n3.2 Production Cost & Income \n3.3 Marketing Practices\n4. Data analysis \nData analysis includes but not limited to the following: \n4.1 Yield results \n4.2 Sales, cost and income \n4.3 Breakeven levels \n4.4 Financing requirement\n5. Production module \nProduction module includes but not limited to: \n5.1 Recommended farming practices \n5.2 Production cost and income with financing plan \n5.3 Technologies \n5.4 Innovations \n6. Product supply \nProduct supply includes but not limited to: \n6.1 Number of production modules \n6.2 Estimated Total Yield \n6.3 Committed yield for group marketing \n6.4 Number of farmers \n7. Production program \nProduction program includes but not limited to: \n7.1 Planting schedule \n7.2 Market demand \n7.3 Harvest schedule \n7.4 Name of farmers \n7.5 Production modules\n8. Supply forecasting \nSupply forecasting includes but not limited to: \n8.1 Number of production modules \n8.2 Estimated Total Yield \n8.3 Committed yield for group marketing \n8.4 Supply period \n8.5 Buyer requirement \n8.6 Number of farmers \n9. Selected market actors \nSelected market actors include at least: \n9.1 Three traditional local buyers \n9.2 Three traditional regional buyers \n9.3 Three formal markets \n9.4 Target BDS \n10. Appropriate safety measures \nAppropriate safety measures include but not limited to:\n\n--- PDF PAGE 73 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n72\n10.1 Handling of tools \n10.2 Handling of farm inputs \n10.3 Farming activities \n10.4 Pre and Post-production activities \n11. Workplace \nWorkplace include but not limited to: \n11.1 Farm production area \n11.2 Farm post-production/ processing area \n12. Assessment \nAssessment includes review of performance in: \n12.1 Marketing \n12.2 Supply \n12.3 Management \n12.4 Finance \n13. Adjustment \nAdjustment includes changes in the areas of: \n13.1 Market plan \n13.2 Supply plan \n13.3 Management plan \n13.4 Financial plan\n14. Product development \nProduct development may include but not limited to : \n14.1 Food processing \n14.2 Non-food processing \n14.3 By products \n14.4 Proper packaging and labeling\n15. Product diversification \nProduct diversification may include venturing into new or \nadditional: \n15.1 Crops \n15.2 Livestock \n15.3 Fishery products \n16. Additional market \nAdditional market may include but not limited to: \n16.1 Formal market (corporate, institutional) \n16.2 Informal markets (no business documentation)\n\n--- PDF PAGE 74 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n73\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Guided product selection \n1.2 Overseen in the development of Production Module \n1.3 Coached in the preparation of supply plan \n1.4 Lead Market Chain Study \n1.5 Supported Occupational Safety and Health (OSH) \nimplementation \n1.6 Directed test marketing activities \n1.7 Supported sustained marketing\n2. Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools, materials, supplies and equipment to be used to \ndemonstrate required tasks \n2.3 Reference materials (manual, guide book)\n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Oral questioning \n3.3 Demonstration \n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n\n--- PDF PAGE 75 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n74\nUNIT OF COMPETENCY \n:\nMONITOR AND EVALUATE AGROENTERPRISE \nACTIVITIES \nUNIT CODE \n:\n AFF242304 \nUNIT DESCRIPTOR \n:\nThe unit deals with the knowledge, skills and attitudes \nrequired of AE Facilitator to monitor AE development \nprogram, assess the development and implementation \nof AE program, and recommend corrective measures \nand improvement.\n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Monitor AE \nDevelopment \nProgram \n1.1 Partnership Building \nis monitored \naccording to agreed \nindustry standards \n1.2 Farmers \norganization is \nmonitored according \nto functionality based \non industry \nstandards \n1.3 AE Plan \nImplementation is \nmonitored based on \nindustry standards \n1.4 Field monitoring report \nis prepared \n• Partnership \nBuilding Concept \n• Monitoring & \nEvaluation tools \nand processes \n• Basic knowledge on \ncomputer \n• Community \norganizing \n• Types and \ncharacteristics of \norganization \n• Components of AE \nPlan \n \nAttitude: \n• Patience \n• Committed \n• Resourcefulness \n• Objective \n• Pro-active \n• Communicating \nSkills \n• Checking \npartnership building \nactivities \n• Checking the \nfunctionality of \nfarmers organization \n• Gathering of \ninformation \n• Computing skills \n• Data analysis \n• Documentation skills \n• Utilizing monitoring \ntools \n2. Assess the \ndevelopment \nand \nimplementatio\nn of AE \nProgram \n2.1 Partnership Building \nis assessed \naccording to agreed \nindustry standards \n2.2 Farmers organization \nis assessed \naccording to \nfunctionality based on \nindustry standards \n2.3 AE Plan \nImplementation is \nevaluated based on \nindustry practices \n• Compliance to \npartnership \nagreement \n• Procedures and \nguidelines in \nassessing \npartnership \n• Criteria of functional \norganization \n• Evaluation Tools \n \nAttitude: \n• Diligent \n• Assessing the \npartnership building \n• Evaluating the \nfunctionality of the \nfarmers organization \n• Assessing the AE \nPlan implementation \n• AE Plan Targets vs \nAccomplishments\n\n--- PDF PAGE 76 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n75\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2.4 Evaluation report is \nprepared based on \nindustry procedure \n• Hardworking \n• Committed \n• Transparent \n3. Recommend \ncorrective \nmeasures \nand \nimprovement \n3.1 Preventive, \ncorrective \nmeasures and \nimprovement on \nPartnership is \nadvised based on \nthe monitoring and \nevaluation results \n3.2 Improvement of \nfarmers \norganization is \nrecommended \nbased on the \nmonitoring and \nevaluation results \n3.3 Enhancement on \nAE Plan \nImplementation is \nrecommended \nbased on the \nmonitoring and \nevaluation results \n• Needs/gaps of \npartnership \n• Appropriate \ncorrective \nmeasures \n• Improvement on \nPolicies, systems \nand procedures \n(PSPs) \n• Enhancement of \ncapacity building \non organizational \ndevelopment \n• Information on \nfuture needs of \nbusiness partners \n• Strategies to \nmaintain business \nrelationships \n \nAttitude: \n• Diligence \n• Hardworking \n• Committed \n• Transparent \n• Resourceful \n• Innovative \n• Patience \n• Recommending \ncorrective \nmeasures and \nimprovement \n(policies, \nstrategies) on \npartnership \n• Recommending \nimprovement of \nfarmers \norganization \n• Recommending \nthe enhancement \non AE Plan \nimplementation\n\n--- PDF PAGE 77 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n76\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Partnership \nPartnership includes but not limited to: \n1.1 SWG \n1.2 LRT \n1.3 National/local stakeholders \n1.4 Academe \n1.5 Financing institutions \n2. Farmers Organization \nFarmers Organization may include but not limited to: \n2.1 Cooperative \n2.2 Associations or ARB (Agrarian Reform Beneficiaries) \n2.3 Clusters \n3. Monitoring activities \nMonitoring activities include but not limited to: \n3.1 Quality and volume of products \n3.2 Product Delivery & sales \n3.3 Policies implementation \n3.4 Business Financial Performance \n3.5 Cluster leaders’ monitoring reports\n\n--- PDF PAGE 78 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n77\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Monitored AE Development Program \n1.2 Assessed the development and implementation of AE \nProgram \n1.3 Recommended corrective measures and improvement \n2. Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Training hall \n2.3 Tools, materials, supplies and equipment to be used to \ndemonstrate required tasks \n2.4 Reference and manuals \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Demonstration \n3.3 Oral questioning \n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center \nin a simulated workplace setting.\n\n--- PDF PAGE 79 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n78"
