        "source_text": "--- PDF PAGE 9 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n8\nUNIT OF COMPETENCY : \nDEVELOP TEAMS AND INDIVIDUALS \n \nUNIT CODE \n: \n500311116 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes \nrequired to determine individual and team development \nneeds and facilitate the development of the workgroup. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Provide team \nleadership \n1.1 Learning and \ndevelopment needs \nare systematically \nidentified and \nimplemented in line \nwith organizational \nrequirements \n1.2 Learning plan to meet \nindividual and group \ntraining and \ndevelopmental needs \nis collaboratively \ndeveloped and \nimplemented \n1.3 Individuals are \nencouraged to self \nevaluate performance \nand identify areas for \nimprovement \n1.4 Feedback on \nperformance of team \nmembers is collected \nfrom relevant sources \nand compared with \nestablished team \nlearning process \n Coaching and \nmentoring \nprinciples \n Understanding how \nto work effectively \nwith team members \nwho have  diverse \nwork styles, \naspirations, cultures \nand perspective \n Understanding how \nto facilitate team \ndevelopment and \nimprovement \n Understanding \nmethods and \ntechniques for \neliciting and \ninterpreting \nfeedback \n Understanding \nmethods for \nidentifying and \nprioritizing personal \ndevelopment \nopportunities and \noptions \n Ability to read and \nunderstand a variety \nof texts, prepare \ngeneral information \nand documents \naccording to target \naudience; spell with \naccuracy; use \ngrammar and \npunctuation effective \nrelationships and \nconflict management \n Communication \nskills including \nreceiving feedback \nand reporting, \nmaintaining effective \nrelationships and \nconflict management \n Planning skills to \norganize required \nresources 