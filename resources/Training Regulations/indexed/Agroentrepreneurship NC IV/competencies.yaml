ion, \npercentage and \nratio \n Material  takeoff  \n Materials costing   \n Compute bill of \nmaterials  \n Compute project \ncost\n\n--- PDF PAGE 40 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n39\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Four basic mathematical \noperation  \n1.1 Addition \n1.2 Subtraction \n1.3 Multiplication \n1.4 Division \n2.  System of measurement \n2.1 English \n2.2 Metric \n3.  Units of measurement \n3.1 Area \n3.2 Volume \n3.3 Weight \n3.4 Length \n \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed estimation \n1.2 Performed basic workplace calculation \n1.3 Applied corrective measures as maybe necessary \n2.  Method of \nAssessment \nCompetency in this unit must be assessed through: \n2.1 Practical demonstration \n2.2 Written examination \n3.  Resource \nImplications \n3.1 Relevant tools and equipment for basic calculation \n3.2 Recommended data \n4.  Context of \nAssessment \n4.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
