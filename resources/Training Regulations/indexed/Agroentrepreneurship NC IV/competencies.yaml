        "source_title": "MOBILIZE AGROENTERPRISE COMMUNITY",
        "source_text": "--- PDF PAGE 65 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n64\nUNIT OF COMPETENCY \n:\nMOBILIZE AGROENTERPRISE COMMUNITY  \nUNIT CODE \n:\n AFF242303 \n \nUNIT DESCRIPTOR \n:\nThe unit deals with the knowledge, skills and attitudes  \nrequired of AE facilitator to guide the product selection, \noversee the development of production module, \nsupport occupational safety and health (OSH) and \nimplementation, coach in the preparation of supply \nplan, lead the market chain study, direct preparation of \nAE plan for test marketing and its implementation, \nsupport sustained marketing, and supervise value \nadding activities.\n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n1. Guide product \nselection \n1.1 Cluster leaders are \nsupervised in \nextracting product \ndata from the farmers \ninformation profile \n1.2 Prioritization and \nscreening of extracted \nproduct data is \nfacilitated based on \nestablished \nGuidelines \n \n1.3 Prioritized products \nare recommended to \nfarmers \n Data collection and \nextraction of existing \nproducts from farmers \ninformation profile \n Criteria for product \nscreening \n Analytical tool \n(ANSOFF matrix) \n Procedures of \npresentation and \nscreening of the lists \nof products \n Data Analysis \n Decision making \nthrough consensus \n Facilitation process in \nconsensus decisions \n \nAttitude: \n Patience \n Camaraderie \n Open minded \n Diplomacy \n Fair \nNon-judgmental\n Supervising AE \nimplementers  in \ncollating and \nextracting existing \nproducts from the  \nfarmers \ninformation profile \n Guiding farmers \nin the prioritizing \nand screening of \nproducts \n Facilitating skills \nin supporting \nfarmers to select \nproducts by \nconsensus \n2. Oversee  in the \ndevelopment of \nProduction \nModule \n2.1  Farmers are assisted \nin benchmarking on \nproduction data \nbased on established \nguidelines  \n2.2  Farmers are guided \nin the analysis of best \n Making Guidelines for \nData Gathering \n Different methods of \nData Gathering \n Sources of Data \n Interview Techniques \n Guiding farmers \nin conducting \ninterview of Key \nInformants \n Assisting in the \ncalculation of\n\n--- PDF PAGE 66 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n65\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \npractices based on \nestablished \nguidelines \n2.3 Farmers are assisted \nin the drafting of the \nproduction module \naccording to industry \nstandards \n2.4  Farmers are guided \nin the validation  and \nfinalization of \nproduction module \n Documentation \ntechniques \n Data Collation & \nTabulation Procedure  \n Methods and \nprocedure of Data \nAnalysis \n Agri-Production \npractices \n Production Module \nGuide \n Good agriculture \npractice (GAP) \n Climate risk \nmanagement \nstrategies \n Cost & Income \nComputation with \nAnalysis \n Consensus in decision \nmaking \n \nAttitude: \n Information seeking \n Open minded \n Resourceful \n Good \nConversationalist \n Patience \n Resourcefulness \n Perseverance \n Honesty \n Social responsibility \n Commitment \n Patience \n Perseverance \nproduction cost \nand income  \n Assisting farmers \nin identifying \nbenchmarked \nbest practices \n Assisting farmers \nto  analyze data \nfor best farming \npractices to \nrecommend \n Guiding farmers \nin Collating & \nTabulating \ncollected data \n Assisting farmers \nin designing and \nProduction \nModule based on \nindustry \nstandards \n Presenting the \nresults of the \ndrafted production \nmodule \n Facilitating \nconsensus \nbuilding \n Guiding farmers \nin validation and \nfinalization of the \nproduction \nmodule \n3. Coach  in the \npreparation of \nsupply plan \n3.1  Estimation of \nproduct supply is \nguided based on \nmarket requirement \nand farmers \ncommitted \nproduction module \n3.2  Formulation of \nProduction program \nis guided based on \nthe supply plan \n Production Information \nData \n- \nMarket \nspecifications \n- \nPrices \n- \nProduction \ntechnologies \n Market-Supply \nMatching \n Methods of Computing \nproduct supply volume \n Assessing the \nproduct \nrequirement \nbased on market \ndemand and \nmarketing plan \n Coaching skills \n Matching market \nrequirement with \ntargeted product \nsupply\n\n--- PDF PAGE 67 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n66\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n3.3  Product supply \nforecasting is \nassisted to match \nsupply with the \nmarketing plan \n Guide in the Preparing \nProduct Supply Plan \n Guidelines for \npreparing Production \nProgram  \n Production Calendar \n Collective Marketing \nAgreement/ \nArrangement \n Marketing plan and \nagreements of supply \n Methods of monitoring \nthe farm production  \n Computation in \ncoming up with \nrealistic supply for the \nmarket \n Guide in the Preparing \nProduct Supply \nforecast \n \nAttitude; \n Credibility \n Honesty \n Committed \n Compliance to rules \nand regulations \n Computing the \nvolume of product \nsupply for \ncommitment of \nfarmers to the \nmarket \n Formulating \nProduction \nProgram based \non the prepared \nproduction \nmodule  \n Scheduling/ \nProgramming \n Skills in \nproduction \nmonitoring \n Skills in product \nsupply forecasting\n4. Lead the Market \nChain Study \n4.1  Market visits are \norganized for \nselected market \nactors according to \nindustry procedures \n4.2  Results of market \nvisits are discussed \nwith farmers \n4.3  Selected potential \nbuyers and business \ndevelopment service \n(BDS) providers are \nreviewed and \nrecommended based \non comparative table \n Leadership \n Adult learning \nmethods \n Marketing, market \nchain and its actors \nand activities \n Communication  \n Data gathering, \nconsolidation and \nanalysis \n Procedures in drawing \na market map \n Guidelines in selecting \nmarket actors for \nmarket chain study \n Effective organizing \nprinciples and \npractices \n Rapid market \nappraisal  \n Leading skills \n Facilitating skills \nwith adult learners\n Communication \nskills \n Data gathering \nskills \n Skills in \nidentifying market \nactors and \ndescribing the \nflow of activities in \nline with market \nmapping  \n Drawing a market \nmap \n Assessment skills \nas applied to \nselecting potential\n\n--- PDF PAGE 68 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n67\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n Communication \nprocesses \n Data gathering,  \nconsolidation and \nanalysis \n Activity planning \n Team building \nprinciples and \npractices  \n Procedures for \ninterview and \nobservation \n Marketing basics \n Value addition  and \nvalue chain \nrelationships \n Computation of sales, \ncost and income \n Guidelines in choosing \nbuyers and BDS to \nengage \n Market negotiation \nand forging \nagreements/ \narrangements \n Guidelines in \nexamining the \nengagement with \nbuyers and BDS \n \nAttitude \n Resourceful \n Expansive \n Open-minded \n Involved \n Enthusiastic \n Making available time \n Diplomatic \n Sensitive \n Positive \n Hardworking \n Expansive \n Diligence  \n Patience \n Business minded \nOpenness\nbuyers and BDS \nproviders \n Organizing skills \n Activity planning \nskills  \n Time \nmanagement \n Skills in \nconducting \ninterview and \nobservation  \n Data \nconsolidation \nskills  \n Organizing \nmarket visits \naccording to \nindustry \nprocedures \n Computation skills\n Data analysis \nskills according to \nindustry \nprocedures \n Negotiation skills  \n Selecting buyers \nand BDS \nproviders to \nengage \n Engaging  buyers \nand BDS \nproviders   \n Skills in \nexamining the \nbuyers and BDS \nproviders that are \nengaged\n\n--- PDF PAGE 69 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n68\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n Practical \n Decisive \n5. Support \nOccupational \nSafety and \nHealth (OSH) \nimplementation \n5.1  Orientation activities \non OSH are \ncoordinated following \nestablished industry \nprocedures \n5.2  Farmers are guided \nin establishing the \nappropriate safety \nmeasures applicable \nto the workplace \n5.3  OSH implementation \nis monitored in the \nworkplace \n Occupational Health \nand Safety Standards  \n Awareness on: \n- 5S  \n- 3Rs (Reduce, \nRecycle, Reuse) \n \nAttitude: \n Committed \n Compliance to rules \nand regulations \n Skills to \ncoordinate an \norientation activity \n Presentation skills\n Assisting farmers \nto check if OSH is \npracticed \n Supporting \nfarmers in \nestablishing \nappropriate safety  \nmeasures \n6. Direct test \nmarketing \nactivities \n6.1 Test marketing \npreparation is \nsupervised according \nto industry \nprocedures \n6.2  Selling of \nconsolidated products \nis supervised \naccording to industry \nprocedures \n6.3  Post-test marketing \nassessments are \nfacilitated according \nto industry \nprocedures \n Supervision theory \nand principles \n Procedures in the \npreparation of an AE \nplan  \n Agroenterprise \nobjective  \n Consensus building in \norganizational \ndecision making \n Facilitation process to \ngenerate consensus \n Business planning and \norganizing \n AE plan \n The business action \nschedules \n Market arrangements \n Product supply \nforecast \n Mathematics \n(computation of sales, \ncost and income) \n Operations \nmanagement in the \nproduct flow  \n Mathematics \n(computations on \nsales, cost and \nincome) \n Product quality \nmanagement\n Presenting the \nresults of the \nmarket chain \nstudy \n Formulating an \nAE objective \naccording to \nindustry \nprocedures \n Facilitating \nconsensus \nbuilding \n Making \nagreements or \narrangements \nwith buyers \n Forecasting \nproduct supply \n Computation skills\n Skills in the \npreparation of an \nAE plan and the \nbusiness action \nschedules \n Supervision skills \nas applied in \ncompleting the \ntest marketing \npreparation \n Documentation \nskills\n\n--- PDF PAGE 70 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n69\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \n Traceability \n Record keeping and \ndocumentation \n Procedure for post-\ntest marketing \nassessment \n \nAttitude: \n Business minded \n Diligent for detailed \nwork \n Realistic \n Motivated \n Committed \n Accountable \n Decisive \n Business minded \n Team work \n Work oriented \n Disciplined \n Vigilant \n Self-directed \n Cooperative \n Committed \n Hardworking \n Candid \n Responsive \n Endurance \n Openness \n Continuous learning \n Managing product \nflow to the buyers \n Managing product \nquality and setting \na system for \ntraceability \n Recording of \nproduct deliveries, \nsales, costs and \nincome and \npayment to \nfarmers   \n Supervision skills \nas applied in the \nselling of \nconsolidated \nproducts to \nbuyers \n Contingency \nplanning skills \n Problem solving \nskills \n Facilitation skills \nin the conduct of \npost-test \nmarketing \nassessment \n Assessment \nprocess \n Assessment of \nmarketing \nperformance\n7. Support \nsustained \nmarketing \n7.1. Farmers are assisted \nin adjusting \nAgroenterprise (AE) \nplan according to the \nresult of test \nmarketing \n7.2. Product deliveries are \noverseen based on \nthe adjusted AE plan \n 7.3. Setting up of the \nfarmers’ management \nstructure and the \nrecord keeping for \nagroenterprise \n Evaluation and \nplanning for business \nsustainability \n Value chain upgrading \n Business networking  \n Managing market \nrelationships \n Organizational \nconsensus \n Computation of sale, \ncost and income \n Procedures to improve \nthe AE plan \n Business efficiency \n Business \nnetworking skills \n Facilitating \norganizational \nconsensus  \n Computation skills\n Skills to review \nproduct deliveries \nbased on the \nimproved AE plan \n Researching skills\n Skills in price \nmonitoring and \nanalysis\n\n--- PDF PAGE 71 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n70\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED \nSKILL \nactivities are \nsupervised \n7.4. Preparation of \nsavings and capital \nbuild up plans are \nfacilitated \n7.5  Product \ndevelopment is \nrecommended based \non market \nrequirement \n 7.6  Product \ndiversification is \nsuggested based on \nmarket requirements \nand agro-ecological \nconditions \n7.7  Study of additional \nmarket is led  based \non product supply \ncapacity & market \nrequirement \n Data gathering, \nconsolidation and \nanalysis \n Price behavior and \nprice monitoring \n Governance and \naccountability \n Recordkeeping and \ninternal control  \n Management \nstructure, roles and \nresponsibilities \n Monitoring and \nreporting of the AE \nperformance \n Price monitoring \nprocess \n Capital and business \ngrowth \n Methods of savings \nand capital generation \n \nAttitude: \n Business minded \n Expansive \n Open-minded \n Flexible \n Committed \n Hardworking \n Passionate \n(motivated) \n Accountable \n Work oriented \n Goodwill \n Resourceful \n Cooperative \n Perseverance \n Discipline  \n Responsibility \n Transparency \n Documenting \nregular marketing \nactivities \n Setting up the \nmanagement \nstructure and \noperational \nsystem for AE in \nthe organization \n Supervision skills \nas applied in the \nsetting up of the \nmanagement \nstructure and the \nrecord keeping for \nagroenterprise \nactivities \n Computation skills\n Facilitation skills \nas applied in the \nsavings and \ncapital build up \nplanning of the \nfarmers\n\n--- PDF PAGE 72 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n71\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Information \nInformation includes but not limited to the following: \n1.1 Crops commonly grown in the locality \n1.2 Existing & Potential markets \n1.3 Market information \n1.4 Price \n1.5 Trending \n2. Guidelines \nGuidelines includes but not limited to: \n2.1 Resulting income \n2.2 Available market \n2.3 Commonly grown in the area \n2.4 Production capacity \n2.5 Sustainability \n3. Production Data \nProduction Data includes but not limited to: \n3.1 Farming Practices \n3.2 Production Cost & Income \n3.3 Marketing Practices\n4. Data analysis \nData analysis includes but not limited to the following: \n4.1 Yield results \n4.2 Sales, cost and income \n4.3 Breakeven levels \n4.4 Financing requirement\n5. Production module \nProduction module includes but not limited to: \n5.1 Recommended farming practices \n5.2 Production cost and income with financing plan \n5.3 Technologies \n5.4 Innovations \n6. Product supply \nProduct supply includes but not limited to: \n6.1 Number of production modules \n6.2 Estimated Total Yield \n6.3 Committed yield for group marketing \n6.4 Number of farmers \n7. Production program \nProduction program includes but not limited to: \n7.1 Planting schedule \n7.2 Market demand \n7.3 Harvest schedule \n7.4 Name of farmers \n7.5 Production modules\n8. Supply forecasting \nSupply forecasting includes but not limited to: \n8.1 Number of production modules \n8.2 Estimated Total Yield \n8.3 Committed yield for group marketing \n8.4 Supply period \n8.5 Buyer requirement \n8.6 Number of farmers \n9. Selected market actors \nSelected market actors include at least: \n9.1 Three traditional local buyers \n9.2 Three traditional regional buyers \n9.3 Three formal markets \n9.4 Target BDS \n10. Appropriate safety measures \nAppropriate safety measures include but not limited to:\n\n--- PDF PAGE 73 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n72\n10.1 Handling of tools \n10.2 Handling of farm inputs \n10.3 Farming activities \n10.4 Pre and Post-production activities \n11. Workplace \nWorkplace include but not limited to: \n11.1 Farm production area \n11.2 Farm post-production/ processing area \n12. Assessment \nAssessment includes review of performance in: \n12.1 Marketing \n12.2 Supply \n12.3 Management \n12.4 Finance \n13. Adjustment \nAdjustment includes changes in the areas of: \n13.1 Market plan \n13.2 Supply plan \n13.3 Management plan \n13.4 Financial plan\n14. Product development \nProduct development may include but not limited to :  \n14.1 Food processing \n14.2 Non-food processing \n14.3 By products \n14.4 Proper packaging and labeling\n15. Product diversification \nProduct diversification may include venturing into new or \nadditional: \n15.1 Crops \n15.2 Livestock  \n15.3 Fishery products \n16. Additional market \nAdditional market may include but not limited to: \n16.1 Formal market (corporate, institutional) \n16.2 Informal markets (no business documentation)\n\n--- PDF PAGE 74 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n73\nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Guided product selection \n1.2 Overseen  in the development of Production Module \n1.3 Coached  in the preparation of supply plan \n1.4 Lead Market Chain Study \n1.5 Supported Occupational Safety and Health (OSH) \nimplementation \n1.6 Directed test marketing activities \n1.7 Supported sustained marketing\n2.  Resource Implications \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools, materials, supplies and equipment to be used to \ndemonstrate required tasks \n2.3 Reference materials (manual, guide book)\n3.  Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Oral questioning \n3.3 Demonstration \n4.  Context of Assessment \n4.1  Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n",
