 \nrange of options\n\n--- PDF PAGE 18 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n17\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nhigher \nmanagement \ndocumentation are \nprepared \n3.2 Recommendations \nare presented to \nappropriate personnel\n3.3 Recommendations \nare followed-up, if \nrequired \norganizational \nsystems and \nfunctions \n Broad knowledge of \nhelp desk and \nmaintenance \npractices \n Current industry \naccepted hardware \nand software \nproducts with broad \nand detailed \nknowledge of its \ngeneral features \nand capabilities  \n Communication is \nclear, precise and \nvaries according to \nthe type of audience \n Teamwork in \nreference to \npersonal \nresponsibility \n Time management \nas applied to self-\nmanagement \n4.  Implement \nsolution \n4.1 Measurable \nobjectives are \nidentified \n4.2 Resource needs are \nidentified \n4.3 Timelines are \nidentified in \naccordance with plan \n Broad \nunderstanding of \nsystems, \norganizational \nsystems and \nfunctions \n Broad knowledge of \nhelp desk and \nmaintenance \npractices \n Current industry \naccepted hardware \nand software \nproducts with broad \nand detailed \nknowledge of its \ngeneral features \nand capabilities  \n Broad knowledge of \nthe operating \nsystem \n Broad knowledge of \nthe client business \ndomain \n Broad knowledge \nbased incorporating \ncurrent industry \npractices related to \nescalation \nprocedures \n Decision making \nwithin a limited \nrange of options \n Communication is \nclear, precise and \nvaries according to \nthe type of audience \n Teamwork in \nreference to \npersonal \nresponsibility \n Time management \nas applied to self-\nmanagement. \n Analytical skills in \nrelation to routine \nmalfunctions \n General customer \nservice skills \ndisplayed \n Questioning and \nactive listening is \nemployed to clarify \ngeneral information\n\n--- PDF PAGE 19 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n18\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n Broad knowledge \nbased of diagnostic \ntools \n General principles \nof OHS \n Divisional/unit \nresponsibilities \n5.  Evaluate/ \nMonitor \nresults and \noutcome \n5.1 Processes and \nimprovements are \nidentified based on \nevaluative \nassessment of \nproblem \n5.2 Recommendations \nare prepared and \nsubmitted to \nsuperiors \n Broad \nunderstanding of \nsystems, \norganizational \nsystems and \nfunctions \n Broad knowledge of \nhelp desk and \nmaintenance \npractices \n Current industry \naccepted hardware \nand software \nproducts with broad \nand detailed \nknowledge of its \ngeneral features \nand capabilities  \n Broad knowledge of \nthe operating \nsystem \n Broad knowledge of \nthe client business \ndomain \n Broad knowledge \nbased incorporating \ncurrent industry \npractices related to \nescalation \nprocedures \n Broad knowledge \nbased of diagnostic \ntools \n General principles \nof OHS \n Divisional/unit \nresponsibilities \n Decision making \nwithin a limited \nrange of options \n Communication is \nclear, precise and \nvaries according to \nthe type of audience \n Teamwork in \nreference to \npersonal \nresponsibility \n Time management \nas applied to self-\nmanagement. \n Analytical skills in \nrelation to routine \nmalfunctions \n General customer \nservice skills \ndisplayed \n Questioning and \nactive listening is \nemployed to clarify \ngeneral information\n\n--- PDF PAGE 20 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n19\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Area of responsibility \nVariables may include but are limited to:  \n1.1 Work environment \n1.2 Problem solution processes  \n1.3 Preventative maintenance and diagnostic policy  \n1.4 Roles and technical responsibilities  \n2.  Occupational Health and \nSafety \n2.1 As per company statutory and vendor \nrequirements. Ergonomic and environmental \nfactors must be considered during the \ndemonstration of this competency. \n3.  Communication  \nVariables may include but are not limited to: \n3.1 Written communication can involve both hand \nwritten and printed material, internal memos, \nelectronic mail, briefing notes and bulletin boards. \n4.  Documentation \n4.1 Audit trails \n4.2 Naming standards \n4.3 Version control\n\n--- PDF PAGE 21 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n20\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nAnalyze the problem \n1.2 \nIdentified possible solutions \n1.3 \nImplemented solutions \n1.4 \nRecommended solutions to higher management \n1.5 \nOutcome evaluated/monitored \nEvidence of satisfactory performance in this unit can be \nobtained by observation of performance and questioning to \nindicate knowledge and understanding of the elements of the \ncompetency and performance criteria. \n2.  Resource \nimplications \n2.1 \nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios/case studies/what ifs will \nbe required as well as bank of questions which will be \nused to probe the reasoning behind the observable \nactions.\n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 \nThrough direct observation of application to tasks and \nquestions related to underpinning knowledge \nUnder general guidance, checking various stages of \noperation and at the completion of the activity against \nperformance criteria and specifications\n4.  Context of \nassessment \n4.1 \nCompetency may be assessed in the work place or in a \nsimulated work place setting \n4.2 \nAssessment shall be carried out through TESDA’s \nAccredited Assessment Centers/Venues while tasks are \nundertaken either individually or as part of a team under \nlimited supervision\n",
