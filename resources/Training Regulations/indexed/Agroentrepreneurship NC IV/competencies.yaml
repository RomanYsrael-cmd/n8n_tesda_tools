r to provide capacity building \ninterventions to farmers, lead in accessing capacity \nbuilding services for AE practitioners, supervise accessing \nfinancial assistance and generate learnings. \n \nLEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Provide \nCapacity \nBuilding \nInterventions \nto farmers \n1.1 Capacity building \nneeds of farmers are \nanalyzed according to \nindustry procedures \n1.2 Capacity building \ninterventions are \nrecommended based \non the result of the \nanalyses \n1.3 Capacity building plan \nis developed \naccording to \nobjectives \n1.4 Capacity Building \nIntervention \nactivities are \nimplemented based \non plan. \n• Agroentrepreneurship \nand the Role of the \nAgroenterprise \nFacilitator \n• Ways to develop a \nTraining Needs \nAssessment \n• Importance of Training \nNeeds Assessment \n• Effective Facilitation \nSkills \n• Adult Learning \nPrinciples \n• Developing Training \nProgram and Proposals \n• Ways in developing \nlearning materials \n• AE development \n \nAttitude: \n• Patient \n• Confident \n• Hardworking \n• Disciplined \n• Open minded \n• Analytical Skills \n• Technical Writing \nskills \n• Module development\n• Computer literacy \n• Participatory \nLearning Activities \n• Facilitation skills \n• Communication \nskills \n2. Lead in \naccessing \ncapacity \nbuilding \nservices for \nfarmers \n2.1 Cluster leaders are \noriented on potential \nAE service \nproviders based on \nindustry procedures \n2.2 Cluster leaders are \noriented on Standard \nprotocols in availing \nthe capacity building \n• Resource accessing \n- Types of AE service \nproviders \n- Available programs \nand services from the \nprivate and public \nsector \no Common service \nfacility \n• Resource mobilizing \nskills \n• Communicating \nskills \n• Facilitating skills \n• Negotiating skills \n• Presentation skills \n• Public relations\n\n--- PDF PAGE 53 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n52\nLEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nservices following \nindustry procedures \n2.3 Cluster leaders are \nguided in preparing \ndocuments to avail \nthe services \naccording to industry \nprocedures \no Product \ndevelopment \no Marketing \n• Communication \nprotocols \n• Institutional procedures \n• Procedure in guiding \ndocument preparation \nand packaging \n \nAttitude: \n• Perseverance \n• Patience \n• Realistic \n• Positive \n• Punctual \n• Honest \n• Time management \nskills \n• Technical writing \nskills \n• Coaching skills \n• Guiding AE \nimplementers in \npreparing \ndocuments \n3. Supervise \naccessing \nfinancial \nassistance \n3.1 Farmers are assisted \nin the computation of \nthe Financial \nrequirements \naccording to the agro-\nenterprise activities \n3.2 Farmers are guided \nin the selection of the \nFinancial services \nbased on financial \nrequirement \n3.3 Farmers are guided in \npreparing financial \nanalysis according to \nindustry practice \n3.4 Farmers are \nsupervised in \npackaging of \nfinancial plan based \non industry \nprocedures \n3.5 Assistance in availing \nloan is provided \nbased on the \nrequirements of \nservice providers \n3.6 Farmers are advised \non loan settlement \nmeasures based on \nloan agreement \n• Identifying the various \ncosts involved \n• Simple Analysis \n• Simple decision making \n• Presentation of \nFinancial Plan \n• Filling-up of required \nforms \n• Basic loan requirement \n• Knowledge on loan \nprocess \n• Loan proposal \npresentation \n• Able to communicate \nclearly and \ndiplomatically \n \nAttitude: \n• Patient \n• Hardworking \n• Detail oriented \n• Calculated Risk taker \n• Discipline \n• Open minded \n• Frugal \n• Business minded \n• Systematic \n• Honest \n• Diligence \n• Identifying the \nvarious costs \ninvolved \n• Analytical skills \n• Sourcing of Financial \nServices \n• Packaging of \nFinancial Plan \n• Sourcing and \nIntegrating financial \nrequirement \n• Guiding in \ncompliance of \nfinancial loan \ndocuments \n• Communication \nSkills\n\n--- PDF PAGE 54 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n53\nLEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3.7 Formulation of \nproposal for capacity \ndevelopment fund is \nguided based on \nindustry standards \n• Accuracy \n• Diplomatic \n• Sense of urgency \n4. Generate \nlearning \n4.1 Tools and techniques \nto draw out learnings \nand insights are \nintroduced according \nto established \nindustry procedure \n4.2 Best, innovative, good \nand promising \npractices (BIGPPs) \nare shared based on \nexperiences \n4.3 Farmers’ evaluation is \nadministered to \nimprove performance \nbased on industry \nprocedures \n• Types of learnings \n• Partnership building and \nnetworking with \npartners, stakeholders \nand market \n• Partnership agreements \n• Strategies to build or \nmaintain business \nrelationships \n \nAttitude: \n• Confident \n• Realistic \n• Affectionate \n• Reliable \n• Responsive \n• Willingness \n• Selfless \n• Committed \n• Resourceful \n• Diplomatic \n• Systematic \n• Open minded \n• Honest \n• Persuasive \n• Persistence \n• Identifying learnings \n• Preparing \ndocuments \n• Learning Techniques \nin Sharing \n• Presentation of \nlearnings \n• Compiling of \ndocuments \n• Recommending \nstrategies to \nmaintain business \nrelationships \n• Communication \nskills \n• Convincing skills \n• Presentation skills \n• Listening skills\n\n--- PDF PAGE 55 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n54\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Capacity building intervention \nCapacity building intervention include but not limited to: \n1.1 Trainings \n1.2 Coaching and Mentoring activities \n1.3 Site visit \n1.4 Learning expedition \n1.5 Workshop \n1.6 Seminar \n2. Capacity Building Intervention \nactivities \nCapacity Building Intervention activities may include but \nnot limited to: \n2.1 Governance \n2.2 Good Agricultural Practices \n2.3 Occupational Safety and Health \n2.4 Leadership and Values \n2.5 Agroentrepreneurship \n2.6 Financial Management \n2.7 Marketing, Production and Quality Management \n2.8 Social protection \n3. AE Service Providers \nAE Service Providers may include but not limited to: \n3.1 FI \n3.2 Academe \n3.3 BDS \n3.4 NGAs \n3.5 NGOs \n3.6 Markets \n3.7 LGU \n3.8 Private sector \n4. Standard protocols \nStandard protocols may include but not limited to: \n4.1 Courtesy call \n4.2 Buy-in session \n4.3 Project presentation \n4.4 Documentary requirements \n5. Documents \nDocuments may include but not limited to: \n5.1 Project proposals \n5.2 Concept note \n5.3 Business plan \n5.4 Farm plan and budget \n6. Financial Requirement \nFinancial Requirement may include: but not limited to: \n6.1 Production \n6.2 Marketing \n6.3 Working capital \n6.4 Post-harvest facilities \n7. Financial Plan package \nFinancial Plan package may include but not limited to: \n7.1 Supply Plan \n7.2 volume \n7.3 Marketing Plan \n7.4 Working capital requirement\n\n--- PDF PAGE 56 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n55\n7.5 Farm facilities and equipment\n8. Requirements of providers \nRequirements of providers may include but not limited to: \n8.1 Group level \n8.1.1 Collateral (i.e. org property-warehouse and lot) \n8.1.2 Codified Approving and Signing Authority \n \n8.2 Individual Level \n8.2.1 Signed of Supply Commitment \n8.2.2 Collateral (i.e. land title, CR & OR) \n8.2.3 Farm plan and budget \n9. Assistance \nAssistance may include but not limited to: \n9.1 Loan application \n9.2 Completion of required documents \n9.3 Follow-up status \n9.4 Negotiation for better terms\n\n--- PDF PAGE 57 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n56\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Provide Capacity Building Interventions to farmers \n1.2 Lead in accessing capacity building services for farmers \n1.3 Supervise accessing financial assistance \n1.4 Generate learning \n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Tools, materials, supplies and equipment to be used to \ndemonstrate required tasks \n2.3 Reference materials (manual, guide book) \n3. Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written exam \n3.2 Demonstration \n3.3 Oral questioning \n4. Context of Assessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n\n--- PDF PAGE 58 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n57\nUNIT OF COMPETENCY \n:\nFACILITATE ENGAGEMENT OF THE AGROENTERPR\nSTAKEHOLDERS \nUNIT CODE \n:\n AFF242302 \nUNIT DESCRIPTOR \n:\nThe unit deals with the knowledge, skills and attitudes \nrequired of AE facilitator to select project site, organize \nagroenterprise \nindustry \nstakeholders, \nmanage \npartnership sustainability, and lead the formalization of \nfarmers organization. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Select project \nsite \n1.1 Data are gathered \nbased on accepted \nindustry procedures \n1.2 Gathered data are \nprocessed using \nproject selection \ncriteria matrix based \non industry \nprocedures. \n1.3 Processed data are \nvalidated through \nconsultation with local \nAE stakeholders \n1.4 Analyzed data are \nused as basis for \nrecommendation to \nAE stakeholders in \nselecting project site \n \n• Sources of required \ndata/documents \n• Methods and \nprocedures of data \ngathering \n• Techniques in \nconducting \ninterviews, survey, \nfocus group \ndiscussion \n• Basic statistics and \nstatistical analysis \n• Procedures in using \nthe data for \nchoosing project \nsite \n• Criteria in choosing \nproject site \n \nAttitudes: \n• Hardworking \n• Resourceful \n• Committed \n• Flexible \n• Persistent \n• Considerate \n• Decisive \n• Work oriented \n• Realistic \n• Analytical \n• Optimistic \n• Open-Minded \n• Processing of data \n• Validating of \nprocessed data \n• Analyzing the data \ngathered \n• Using the data for \nchoosing project site\n\n--- PDF PAGE 59 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n58\nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement\nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2. Organize \nAgroenterpris\ne (AE) \nindustry \nstakeholders \n2.1 Profile of selected \nAgroenterprise \nIndustry \nstakeholders are \nreviewed according \nto industry \nprocedures \n2.2 Buy-in session with \nstakeholders is \nconducted based on \nindustry procedure \n2.3 Site working group is \norganized following \nindustry practices \n2.4 Formal agreement is \nformulated based on \nindustry practice \n2.5 Formal Agreement \nsigning is facilitated to \nestablish partnership \n2.6 Farmers are \nclustered and \nprofiled according to \nindustry procedures \n2.7 Development of AE \npolicies of farmers is \nsupervised based on \nindustry standards \n• Overview of the \nAgroenterprise \nClustering \nApproach \n• Roles and \nresponsibilities of \nagroenterprise \nindustry \nstakeholders \n• Industry procedures \nin identifying \nstakeholders \n• Effective \nCommunication \nSkills \n• Partnership \nPrinciples \n• Partnership \nBuilding \n• Different binding \ndocuments that \nsignify partnership \n(MOA/MOU) \n• Classification of \nfarmers based on \ntenancy status \n• Criteria in cluster \nformation \n• Different Tools in