  "source_section_text": "SECTION 3. TRAINING ARRANGEMENTS \n \nThese guidelines are set to provide the Technical and Vocational Education and \nTraining (TVET) providers with information and other important requirements to consider \nwhen designing training programs for AGROENTREPRENEURSHIPNC IV. \n \n3.1 CURRICULUM DESIGN \n \nCourse Title: AGROENTREPRENEURSHIP NC Level NC IV \n \nNominal Training Duration: \n24 hrs–Basic Competencies \n \n \n \n \n 75 hrs– Common Competencies \n \n \n 616 hrs – Core Competencies \n \n \n ----------- \n \n \n 715 hrs – Total \nCourse Description: \n \nThis course is designed to enhance the knowledge, desirable attitudes and skills of \nagroenterprise facilitator. It includes competencies in capacitating farmers, facilitating \nengagement of the agroenterprise stakeholders, mobilizing agroenterprise community and \nmonitoring and evaluating agroenterprise activities.\n\n--- PDF PAGE 80 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n79\nBASIC COMPETENCIES \n24Hours \n \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nMethod \nNominal \nDuration \n1. Utilize \nspecialized \ncommunication \nskills \n1.1 Meet common and \nspecific communication \nneeds of clients and \ncolleagues \n1.2 Contribute to the \ndevelopment of \ncommunication \nstrategies \n• Read \no Communication \nprocess \no Dynamics of groups \nand different styles of \ngroup leadership\n• Lecture \n• Written \nexamination \n6 hrs. \n• Identify different \napproaches to meet the \nneeds of clients and \ncolleagues\n• Lecture \n• Written \nexamination \n \n• Apply communication \nskills to fulfill job roles \nas specified by the \norganization\n• Demonstration \n• Observation \n \n \n \n• Apply communication \ntechniques in \ncommunicating with \nclients and colleagues \no Active listening \no Feedback \no Interpretation \no Role boundaries \nsetting \no Negotiation \no Establishing empathy\n• Demonstration \n• Observation\n\n--- PDF PAGE 81 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n80\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nMethod\nNominal \nDuration\n \n \n• Describe strategies for \ninternal and external \ndissemination of \ninformation \n• Group \ndiscussion \n• Oral evaluation \n \n \n \n1.3 Represent the \norganization \n \n1.4 Facilitate group \ndiscussion \n• Describe criteria for a \ngood presentation\n• Group \ndiscussion\n• Oral evaluation \n \n• Prepare presentation \nmaterial for internal or \nexternal forums to \npromote the \norganization \n• Use appropriate media \nto enhance the \npresentation \n• Gather relevant \ninformation \n• Apply values in \nfacilitating differences in \nviews\n• Demonstration \n• Observation \n \n1.5 Conduct interview \n• Describe \ncommunication \nstrategies employed in \ninterview situations\n• Group \ndiscussion \n• Oral evaluation \n \n• Conduct interview \n• Demonstration \n• Observation \n \n• Apply organizations \nprocedure in \nmaintaining records of \ninterviews \n• Demonstration \n• Observation\n\n--- PDF PAGE 82 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n81\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nMethod\nNominal \nDuration\n• Use questioning, \nlistening and nonverbal \ncommunication \ntechniques to client \ngroups \n• Demonstration \n• Observation \n \n2. Develop teams \nand individuals \n2.1 Provide team \nleadership \n \n2.2 Foster individual and \norganizational growth \n• Describe \no Coaching and \nmentoring principles \no working effectively \nwith team members \nwho have diverse \nwork styles, \naspirations, cultures \nand perspective \no facilitating team \ndevelopment and \nimprovement\n• Group \ndiscussion \n• Oral evaluation \n4 hrs. \n• Read \no methods for \nidentifying and \nprioritizing personal \ndevelopment \nopportunities and \noptions \no methods and \ntechniques for \neliciting and \ninterpreting feedback\n• Lecture \n• Written \nexamination\n\n--- PDF PAGE 83 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n82\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nMethod\nNominal \nDuration\n• Apply communication \nskills in receiving \nfeedback and reporting, \nmaintaining effective \nrelationships and \nconflict management\n• Group \ndiscussion \n• Oral evaluation \n \n• Apply team leadership \nskills to support \ncolleagues: \no Planning skills \no Coaching and \nmentoring skills \no Reporting skills \no Facilitation skills\n• Group \ndiscussion \n• Oral evaluation \n \n• Describe Learning and \ndevelopment program \ngoals and objectives\n• Group \ndiscussion \n• Oral evaluation \n \n• Apply learning delivery \nmethods in preparing \nlearning and program \ngoals and objectives\n• Demonstration \n• Observation \n \n• Identify and prioritize \npersonal development \nopportunities and \noptions for career paths \nand competency \nstandards in the \nindustry\n• Lecture \n• Written \nexamination\n\n--- PDF PAGE 84 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n83\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nMethod\nNominal \nDuration\n \n2.3 Monitor and evaluate \nworkplace learning \n• Use feedback system to \nidentify and implement \nfuture learning \narrangements \nimprovements \n• Demonstration \n• Observation \n \n \n• Assess and record \noutcomes and \nperformance of \nindividuals/teams\n• Demonstration \n• Observation \n \n \n• Negotiate learning plan \nmodifications for \nlearning efficiency and \neffectiveness\n• Demonstration \n• Observation \n \n \n• Maintain records and \nreports of competency \n• Demonstration \n• Observation \n \n \n2.4 Develop team \ncommitment and \ncooperation \n• Use open \ncommunication \nprocesses to obtain and \nshare information by \nte