st\nmarketing assessment\n• Discuss contingency\nplanning and corrective\nactions\n• Explain the process to\nconduct post-test\nmarketing assessment\n• Guide the conduct of\nthe post-test marketing\nassessment\n3.7 Support sustained\nmarketing\n• Explain the importance\nof evaluation to guide\nplanning for business\nsustainability\n• Discuss the process of\nAE evaluation through\nreflection\n• Explain value chain\nupgrading and business\nnetworking for\nsustained marketing\n• Discuss consensus\nbuilding for renewed\ncommitment in\ncontinued marketing\n• Explain the process to\nadjust and improve the\nAE plan for sustained\nmarketing\n• Lecture\n• Discussion\n• Audio/Visual\npresentation\n• Role play\n• Exercise\n• Hands-on\n• On the job\ncoaching\n• Case study/\ncaselet\n• Written exam\n• Oral questioning\n\n--- PDF PAGE 126 ---\nTR-Agroentrepreneurship NCIV\nPromulgated February 3, 2017\n\n125\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Compute for the sales,\ncost and income\n• Review the AE plan\nimprovement\n• Explain strategies in\nmanaging good market\nrelations\n• Discuss management\nfor operational\nefficiency\n• Discuss price\nmonitoring and how to\nset up a price\nmonitoring system\n• Review recordkeeping\nand documentation of\nthe marketing\ntransactions\n• Review product\ndeliveries based on the\nimproved AE plan\n• Discuss governance\nand accountability\n• Explain the importance\nof internal controls\n• Explain management\nstructure, roles and\nresponsibilities\n\n--- PDF PAGE 127 ---\nTR-Agroentrepreneurship NCIV\nPromulgated February 3, 2017\n\n126\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Explain the importance\nof price monitoring\n• Discuss the importance\nof recording and\nreporting in\nagroenterprise\nsustainability\n• Supervise the setting up\nof the management\nstructure and the\nrecordkeeping of\nagroenterprise activities\n• Discuss the importance\nof savings for the\nindividual and capital\nbuild up for the\norganization\n• Explain best practices\nand examples of\ninternal capital\ngeneration\n• Facilitate the farmers\ncan agree on a plan to\ngenerate savings and\ncapital build-up\n4. Monitor and\nEvaluate\nAgroenterprise\nActivities\n4.1 Monitor AE\nDevelopment Program\n• Explain the Partnership\nBuilding Concepts and\nactivities\n• Explain the concepts of\nM & E\n• Lecture\n• Presentation\n• Workshop\n• Simulation\n• Written & oral\nexam\n• Documentation\n• Written\nTotal: 84\nhrs\n\nC: 24 hrs\nF: 60 hrs\n\n--- PDF PAGE 128 ---\nTR-Agroentrepreneurship NCIV\nPromulgated February 3, 2017\n\n127\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Discuss the Monitoring\n& evaluation tools and\nprocesses\n• Check presence of\npartnership building\nactivities\n• Explain the concepts\nand processes of\ncommunity organization\n• Discuss the types and\ncharacteristics of an\norganization\n• Identify the status and\nactivities of the farmers\norganization\n• Identify and explain the\ncomponents of AE Plan\n• Explain the importance\nof data gathering\n• Discuss the monitoring\ntools and processes to\nbe used\n• Administer the\nmonitoring tools\n• Fieldwork\n• Field visit\n• Discussion\n• FGD\n• Video\nPresentation\n• Oral\nQuestioning\n\n4.2 Assess the development\nand implementation of\nAE Program\n• Discuss the roles and\nresponsibilities of\npartnership\n• Discussion\n• Lecture\n• Power point\nPresentation\n•FGD\n• Written\n• Oral\nQuestioning\n\n--- PDF PAGE 129 ---\nTR-Agroentrepreneurship NCIV\nPromulgated February 3, 2017\n\n128\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Explain the procedures\nand guidelines in\nassessing partnership\n• Compare the plan vs.\nactual implementation\n• Explain the criteria of a\nfunctional organization\n• Discuss the evaluation\ntools\n• Evaluate the farmers\norganization based on\nfunctionality\n• Compare the AE Plan\ntargets with the\naccomplishments\n• Analyze the results of\nthe AE Plan\ncomparative data\n4.3 Recommend corrective\nmeasures and\nimprovement\n• Identify the needs/gaps\nof partnership\n• Explain the corrective\nmeasures\n• Administer the\nappropriate corrective\nmeasures on\npartnership\n• Discuss the\nimprovements on PSPs\n• Discussion\n• Lecture\n• Workshop\n• Power point\nPresentation\n• Written\n• Oral\nQuestioning\n\n--- PDF PAGE 130 ---\nTR-Agroentrepreneurship NCIV\nPromulgated February 3, 2017\n\n129\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Explain the\nenhancement of\ncapacity building on\norganizational\ndevelopment\n• Propose the\nenhancement of the\nfarmers’ organization\n• Identify gaps and issues\non AE Plan\nimplementation\n• Explain information on\nfuture needs of\nbusiness partners\n• Identify and discuss the\nstrategies to maintain\nbusiness relationships\n• Propose improvement\non the AE Plan\nimplementation\n\n--- PDF PAGE 131 ---\nTR-Agroentrepreneurship NC IV 130\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is\ndriven by the competency standards specified by the industry. The\nfollowing training modalities and their variations/components may be\nadopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills\nof the trainee through actual experience in the workplace to acquire\nspecific competencies as prescribed in the training regulations. It is\nimperative that the deployment of trainees in the workplace is\nadhered to training programs agreed by the institution and enterprise\nand status and progress of trainees are closely monitored by the\ntraining institutions to prevent opportunity for work exploitation.\n\n--- PDF PAGE 132 ---\nTR-Agroentrepreneurship NC IV 131\n• Project-based instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects that\nhave real world applications.\n\n2.2 Enterprise-Based:\n\n\n• Enterprise-based Training - where training is implemented within\nthe organization/institution in accordance with the requirements of\nthe specific organization/institution. Enterprise-based training may\nalso be taken to mean a school or training center with one or more\npartner enterprise or an enterprise or group of enterprises setting up\na common training facility or partnering with a school or training\ncenter.\n\n2.3 Community-Based –refers to a short program conducted or\ncoordinated by NGOs, LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a\ncommunity. Such programs are usually conducted in informal settings\nsuch as barangay hall, basketball courts and other available venues\nin a community.\n\n--- PDF PAGE 133 ---\nTR-Agroentrepreneurship NC IV 132\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\n\n\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• At least senior high school level or holder of AE NC III\n• Can communicate both orally and in writing\n• Can perform mensuration and calculation\n\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n\nAGROENTREPRENEURSHIP NCIV\n\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Agroentrepreneurship NCIV\n\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nQTY\nQTY.\n1pc\nScissor\n1 set LCD & white cloth\n25 pcs\nMarking pens (permanent)\n1pc\nStapler\n1 unit\ncomputer\n\n\n\n\n1 unit\nprinter\n5 pcs\nMarking pens\n(whiteboard)/ chalk\n1 pc\nPuncher\n1 set Portable speaker\nwith microphone\n25 pcs\nBallpens\n5 pcs\nCalculator 1 unit\nCamera phone\n25 pcs\nPencils\n\n\n1 unit\nWhite/ black board\n5 sets\nCrayon (8 pcs/box)\n\n\n\n\n25 pcs\nNotebooks\n\n\n\n\n5 pcs\nMasking tape (1 inch)\n\n\n\n\n5\nGlue\n\n\n\n\n1 roll\nFlipchart\n\n\n\n\n100 pcs\nManila paper\n\n\n\n\n25 pcs\nCartolina\n\n\n\n\n1 pc\nRecord book\n\n\n\n\n2reams\nBond paper\n\n\n\n\n1 box\nStaple wire\n\n\n\n\n1 pc\nMeter tape\n\n\n\n\n1 set\nPrinter Ink (black &\ncolored)\n\n\n\n\n5 samples\nProduction inputs (e.g.,\nseeds, Fertilizers,\nchemicals)\n\n\n\n\n5\nReference materials\n(manual, guide book)\n\n--- PDF PAGE 134 ---\nTR-Agroentrepreneurship NC IV 133\n3.5\nTRAINING FACILITIES\n\n\nAGROENTREPRENEURSHIP NC IV\n\n\nBased on a class intake of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nTOTAL\nAREA IN\nSQ.\nMETERS\nGRAND\nTOTAL AREA\nIN SQ.\nMETERS\nA. Building (permanent)\n\n125.00\n• Student/Trainee\nWorking Space\n2.00 x 1.00 per\nstudent/trainee\n2.00 per\nstudent\n50.00\n\n• Learning Resource\nCenter\n3.00 x 5.00\n15.00\n15.00\n\n• Activity Room\n(including facilities,\n- wash room, and\n- store room\n- rest room (male,\nfemale & PWD)\n\n\n2 x 1\n4 x 4\n3 x 4\n\n30.00\n\n2.00\n16.00\n12.00\n\nB.Demo Farm *\n500.00\n\n\nTOTAL:\n\n625.00\nNote: * Access to and use of equipment/facilities can be provided through cooperative arrangements\nof MOA with other partner enterprises/organizations/institutions.\n\n\n3.6\nTRAINER’S QUALIFICATIONS FOR AGRICULTURE SECTOR\n\n\nTrainers who will deliver the training on AGROENTREPRENEURSHIP NCIV\nshould possess the following:\n\n\n\n• Must be a holder of NTTC Level 1 (NC+TM 1) in Agroentrepreneurship NC IV\n• Must have 2 years job/industry experience in Agroentrepreneurship for the last\n5 years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency . A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 135 ---\nTR-Agroentrepreneurship NC IV 134"
