  "source_section_text": "SECTION 3. TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for AGROENTREPRENEURSHIPNC IV.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AGROENTREPRENEURSHIP NC Level NC IV\n\nNominal Training Duration:\n24 hrs–Basic Competencies\n\n\n\n\n 75 hrs– Common Competencies\n\n\n 616 hrs – Core Competencies\n\n\n -----------\n\n\n 715 hrs – Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\nagroenterprise facilitator. It includes competencies in capacitating farmers, facilitating\nengagement of the agroenterprise stakeholders, mobilizing agroenterprise community and\nmonitoring and evaluating agroenterprise activities.\n\n--- PDF PAGE 80 ---\nTR-Agroentrepreneurship NCIV\nPromulgated February 3, 2017\n\n79\nBASIC COMPETENCIES\n24Hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n1.1 Meet common and\nspecific communication\nneeds of clients and\ncolleagues\n1.2 Contribute to the\ndevelopment of\ncommunication\nstrategies\n• Read\no Communication\nprocess\no Dynamics of groups\nand different styles of\ngroup leadership\n• Lecture\n• Written\nexamination\n6 hrs.\n• Identify different\napproaches to meet the\nneeds of clients and\ncolleagues\n• Lecture\n• Written\nexamination\n\n• Apply communication\nskills to fulfill job roles\nas specified by the\norganization\n• Demonstration\n• Observation\n\n\n\n• Apply communication\ntechniques in\ncommunicating with\nclients and colleagues\no Active listening\no Feedback\no Interpretation\no Role boundaries\nsetting\no Negotiation\no Establishing empathy\n• Demonstration\n• Observation\n\n--- PDF PAGE 81 ---\nTR-Agroentrepreneurship NCIV\nPromulgated February 