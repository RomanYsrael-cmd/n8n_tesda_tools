al \nQuestioning\n\n--- PDF PAGE 129 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n128\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Explain the procedures \nand guidelines in \nassessing partnership \n• Compare the plan vs. \nactual implementation \n• Explain the criteria of a \nfunctional organization \n• Discuss the evaluation \ntools \n• Evaluate the farmers \norganization based on \nfunctionality \n• Compare the AE Plan \ntargets with the \naccomplishments \n• Analyze the results of \nthe AE Plan \ncomparative data\n4.3 Recommend corrective \nmeasures and \nimprovement \n• Identify the needs/gaps \nof partnership \n• Explain the corrective \nmeasures \n• Administer the \nappropriate corrective \nmeasures on \npartnership \n• Discuss the \nimprovements on PSPs\n• Discussion \n• Lecture \n• Workshop \n• Power point \nPresentation \n• Written \n• Oral \nQuestioning\n\n--- PDF PAGE 130 ---\nTR-Agroentrepreneurship NCIV \nPromulgated February 3, 2017 \n \n129\nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach\nNominal \nDuration\n• Explain the \nenhancement of \ncapacity building on \norganizational \ndevelopment \n• Propose the \nenhancement of the \nfarmers’ organization \n• Identify gaps and issues \non AE Plan \nimplementation \n• Explain information on \nfuture needs of \nbusiness partners \n• Identify and discuss the \nstrategies to maintain \nbusiness relationships \n• Propose improvement \non the AE Plan \nimplementation\n\n--- PDF PAGE 131 ---\nTR-Agroentrepreneurship NC IV 130",
