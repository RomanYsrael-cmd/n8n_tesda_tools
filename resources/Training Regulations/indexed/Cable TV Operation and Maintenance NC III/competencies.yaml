        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected proper measuring instruments\naccording to tasks\n1.2. Carried out measurement and calculations\n1.3. Maintained and stores instruments\n2. Underpinning knowledge\n2.1. Types of measuring instruments and their uses\n2.2. Safe handling procedures in using measuring\ninstruments\n2.3. Four fundamental operation of mathematics\n2.4. Formula for volume, area, perimeter and other\ngeometric figures\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Handling measuring instruments\n3.4. Performing mathematical calculations using\nthe four fundamental operations\n3.5. Visualizing objects and shapes\n3.6. Interpreting formulae\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Observation\n4.2. Oral questioning\n5. Resource implication\n5.1. Place of assessment\n5.2. Measuring instruments\n5.3. Straight edge\n5.4. Torque gauge\n5.5. Try square\n5.6. Protractor\n5.7. Combination gauge\n5.8. Steel rule\n6. Context of Assessment\n6.1. Assessment may be conducted in the\nworkplace or in a simulated work environment\n\n--- PDF PAGE 29 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 27\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\nUNIT CODE\n:"
        },
        "source_text": "ELC311201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded identify, care, handle and use measuring instruments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Select measuring\ninstruments\n1.1. Object or component to be measured is\nidentified according to procedures\n1.2. Correct specifications are obtained from relevant\nsource\n1.3. Measuring tools are selected in line with job\nrequirements\n2. Carry out measurements\nand calculation\n2.1. Appropriate measuring instrument is selected\nto achieve required outcome\n2.2. Accurate measurements are obtained for job\n2.3. Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x),\nand division (/)\n2.4. Calculation involving fractions, percentages and\nmixed numbers are used to complete workplace\ntasks.\n2.5. Numerical computation is checked and corrected\nfor accuracy\n2.6. Instruments are read to the limit of accuracy of\nthe tool.\n3. Maintain measuring\ninstruments\n3.1. Measuring instruments are handled without\ndamage according to procedures\n3.2. Measuring instruments are cleaned before and\nafter using.\n3.3. Proper storage of instruments are undertaken\naccording to manufacturer’s specifications and\nstandard operating procedures.\n\n--- PDF PAGE 27 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 25\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\n1.1. Straight edge\n1.2. Torque gauge\n1.3. Try square\n1.4. Protractor\n1.5. Combination gauge\n1.6. Steel rule\n2. Calculation\n\nKinds of part mensuration includes the following\nbut not limited to\n2.1. Volume\n2.2. Area\n2.3. Displacement\n2.4. Inside diameter\n2.5. Circumference\n2.6. Length\n2.7. Thickness\n2.8. Outside diameter\n2.9. Taper\n2.10. Out of roundness\n\n--- PDF PAGE 28 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 26\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected proper measuring instruments\naccording to tasks\n1.2. Carried out measurement and calculations\n1.3. Maintained and stores instruments\n2. Underpinning knowledge\n2.1. Types of measuring instruments and their uses\n2.2. Safe handling procedures in using measuring\ninstruments\n2.3. Four fundamental operation of mathematics\n2.4. Formula for volume, area, perimeter and other\ngeometric figures\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Handling measuring instruments\n3.4. Performing mathematical calculations using\nthe four fundamental operations\n3.5. Visualizing objects and shapes\n3.6. Interpreting formulae\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Observation\n4.2. Oral questioning\n5. Resource implication\n5.1. Place of assessment\n5.2. Measuring instruments\n5.3. Straight edge\n5.4. Torque gauge\n5.5. Try square\n5.6. Protractor\n5.7. Combination gauge\n5.8. Steel rule\n6. Context of Assessment\n6.1. Assessment may be conducted in the\nworkplace or in a simulated work environment\n\n--- PDF PAGE 29 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 27\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\nUNIT CODE\n:"
