        "source_title": "OPERATE CATV SYSTEM",
        "source_text": "--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 42  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \n \nUNIT OF COMPETENCY  : \nOPERATE CATV SYSTEM  \nUNIT CODE \n: \nMDA311302 \nDESCRIPTOR                    : \nThis unit covers the knowledge, skills and attitudes \nrequired to monitor, interpret/analyze, adjust and \ncalibrate CATV system’s performance in the day-to-day \noperation as well as monitoring and attending to \nsubscribers/customers’ complaints.  \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1 Monitor headend site \nfacilities  \n1.1 Emergency generator, antenna tower/TVRO, facility \ngrounding, air-con systems, security system and head-\nend building are checked and documented. \n1.2 Identified abnormal findings are documented and \nreported in accordance with company procedures. \n1.3 Where applicable, immediate remedies are made for the \nproblems encountered.  \n \n2 Monitor CATV system \nperformance  \n2.1 Appropriate PPE are selected and used in the \nperformance of the job. \n2.2 Equipment signal-levels are monitored for normal \nreadings based on established reference parameters. \n2.3 Normal and abnormal operations/readings are recorded \nand noted. \n2.4 Where applicable, immediate remedies are made to \nsustain normal operation. \n2.5 Action taken are logged and documented in accordance \nwith established procedures. \n \n3 Monitor customers’ \ncomplaints \n3.1 Customer complaints on technical problems are received \nand scheduled for implementation. \n3.2 Suspected area at fault is verified and specific device is \npinpointed as per customer complaint. \n3.3 Where applicable, immediate remedies are made to \nsustain normal operation. \n3.4 Job accomplishment is acknowledged and signed by \neach affected customer. \n3.5 Action taken are logged and documented in accordance \nwith established procedures.\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 43  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Immediate \nremedies  \nMay include: \n1.1 Adjustment of signal levels at particular channel/s \n1.2 Replacement with spare unit \n1.3 Tightening loose connections, cables/cords, plugs, switches \n1.4 Cleaning dirty surfaces and parts   \n1.5 Cutting in of emergency power \n1.6 Splicing cable cuts \n1.7 Replacement of corroded connectors \n1.8 Replacement of slow-blow fuses \n1.9 Resetting of circuit breakers \n2. Reference \nparameters \n2.1 Normal signal levels per channel (output side) \n2.2 Normal output composite signal level of satellite receiver \n2.3 Normal output signal levels of all VHF/UHF antenna pre-amps \n(broadband/narrowband) \n2.4 Difference between video and audio carrier signal levels (audio \ncarrier should be lower by 15 dB than video carrier)  \n2.5 Input and output signal levels of active devices \n2.6 End-of-line performance \n2.7 Normal supply voltages of active devices  \n2.8 Proof of performance (e. g., carrier-to-noise ratios, composite \ntriple beat, hum modulation, composite second-order harmonic \n(CSO))   \n2.9 Open-circuit voltages of standby batteries\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 44  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Maintained trouble-free continuous operation of CATV system \nand facilities \n1.2. \nMonitored and documented technical troubles encountered \n1.3. \nDelivered quick response/remedies for troubles encountered  \n1.4.\n2. Underpinning \nknowledge and \nattitude \n \n \n \n \n2.1 \nSafety Practices \n2.1.1 Work safety requirements \n2.1.2 Proper use of tools and equipment  \n2.2 \nMaterials, Tools and Equipment:  \n2.2.1 Uses and Specifications \n2.2.2 Identification of appropriate tools, equipment; and \ndevices and proper usage \n2.3 \nTheory and Practices \n2.3.1 Cable TV systems overview \n2.3.2 CATV system performance and monitoring \n2.3.3 CATV equipment and instrumentation \n2.3.4 Basic Electricity \n2.3.5 Coaxial cable handling \n2.3.6 TV set up \n2.4 \nCustomer service procedures \n2.4.1 Handling and prioritizing service requests \n2.5 \nDesirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n3. Underpinning \nskills \n3.1. Working efficiently and systematically \n3.2. Observing safety precautions  \n3.3. Proper handling and scheduling of customer requests and \nservice jobs \n3.4. Proper handling, use and maintenance of tools and equipment \n3.5. Communicating effectively \n3.6. Interpretation of plans and symbols \n3.7. Documentation skills \n4. Resource \nimplications \nThe following resources should be available: \n4.1. Access to CATV headend equipment, OSP equipment and \nassociated devices/facilities  \n4.2. Test equipment \n4.3. Work area  \n4.4. Service vehicle and traffic safety equipment  \n5. Method of \nassessment \n5.1. Direct observation/demonstration with oral questioning \n5.2. Written examinations  \n5.3. Third-Party Report \n5.4. Portfolio \n6. Context of \nassessment \n6.1. \nCompetency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be undertaken either individually or part of \nteam under limited supervision\n",
        "source_unit_code": "MDA311302",
