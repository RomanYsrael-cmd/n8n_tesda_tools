          "source_text": "1. Identify the problem \n1.1. Variances are identified from normal operating \nparameters; and product quality \n1.2. Extent, cause and nature of the problem are \ndefined through observation, investigation and \nanalytical techniques  \n1.3. Problems are clearly stated and specified \n2. Determine \nfundamental causes \nof the problem  \n2.1. Possible causes are identified based on \nexperience and the use of problem solving tools / \nanalytical techniques. \n2.2. Possible cause statements are developed based \non findings \n2.3. Fundamental causes are identified per results of \ninvestigation conducted \n3. Determine corrective \naction \n3.1. All possible options are considered for resolution \nof the problem \n3.2. Strengths and weaknesses of possible options \nare considered \n3.3. Corrective actions are determined to resolve the \nproblem and possible future causes \n3.4. Action plans are developed identifying \nmeasurable objectives, resource needs and \ntimelines in accordance with safety and operating \nprocedures \n4. Provide \nrecommendation/s to \nmanager \n4.1. Report on recommendations are prepared \naccording to procedures \n4.2. Recommendations are presented to appropriate \npersonnel. \n4.3. Recommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 12  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Analytical techniques \n1.1. \nBrainstorming \n1.2. \nIntuitions/Logic \n1.3. \nCause and effect diagrams \n1.4. \nPareto analysis \n1.5. \nSWOT analysis \n1.6. \nGant chart, Pert CPM and graphs \n1.7. \nScattergrams  \n2. Problem \n \n2.1. \nNon – routine process and quality problems \n2.2. \nEquipment selection, availability and failure \n2.3. \nTeamwork and work allocation problem \n2.4. \nSafety and emergency situations and \nincidents \n3. Action plans  \n \n3.1. \nPriority requirements \n3.2. \nMeasurable objectives \n3.3. \nResource requirements \n3.4. \nTimelines \n3.5. \nCo-ordination and feedback requirements \n3.6. \nSafety requirements \n3.7. \nRisk assessment \n3.8. \nEnvironmental requirements\n\n--- PDF PAGE 15 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 13  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr"
