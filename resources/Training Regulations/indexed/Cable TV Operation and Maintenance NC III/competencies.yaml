        "source_title": "COMMISSION CATV SYSTEM",
        "source_text": "--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 37  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nUNIT OF COMPETENCY  : \nCOMMISSION CATV SYSTEM  \nUNIT CODE \n: \nMDA311301 \nDESCRIPTOR                    : \nThis unit covers the knowledge, skills and attitudes \nrequired to perform commissioning of CATV system \nwhich may include headend and outside plant system. \nThis covers the activation of headend equipment, cable \npowering, energizing and adjustment of proper signal \nlevel.  \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Test-run headend \nequipment \n \n1.1 Test instruments and equipment are prepared and \nchecked prior to test run. \n1.2 Signal levels are measured and set per channel based on \nstandard headend parameters  \n1.3 Signals are combined/mixed in such a way that signal \nlevels are at the same prescribed level to properly drive \nthe launching amplifier.   \n1.4 Re-adjustments/re-alignments of questionable channels \nand equipment diagnosis are performed in case of \nabnormal test results \n1.5 Results of tests and measurements per channel are \ndocumented in accordance with company requirements. \n2. Test-run auxiliary \nequipment  \n \n2.1 Operation of air-conditioning system is tested and \ncompared with required ambient temperature for headend \nequipment operation.     \n2.2 Standby generator is test-run for proper voltage and \nfrequency regulation.  \n2.3 Test results are recorded and documented in accordance \nwith job requirements.  \n2.4 Problems encountered in operation of equipment \naccessories are documented and referred to concerned \npersonnel in accordance with company procedures.  \n3. Activate OSP \npower supplies \n3.1 Appropriate tools, test instrument, equipment, \nmaterials and PPE are prepared and checked prior to \nactivation of power. \n3.2 Power switch is switched on and input and output \nvoltages are measured and recorded. \n4 Energize OSP \ndistribution system  \n \n4.1 Trunk amplifiers are activated and energized to the \ncorrect signal level as per design plan \n4.2 Line extender amplifiers are activated and energized to \ndeliver proper signal level as per design plan \n4.3 Safety precautions are observed and followed in climbing \npoles and powering of each amplifier.      \n4.4 Measurements and results of tests are recorded and \ndocumented in accordance with established procedures\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 38  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nRANGE OF VARIABLES \n \n1 \nTest instruments \nand equipment \nThis may include: \n1.1 Signal-level meter (SLM) \n1.2 Volt-ohm meter (VOM) \n1.3 spectrum analyzer \n1.4 power meter \n \n2 \nStandard headend \nparameters \nThis may include: \n2.1 aural signal level (10 – 17 db below adjacent visual \nsignal level)  \n2.2 carrier-to-noise ratio (43 db) \n2.3 carrier-to-cross modulation (46 db) \n2.4 carrier-to-composite triple bit (46 db) \n2.5 hum modulation (1%) \n2.6 broadband frequency response (flat) \n2.7 percentage modulation (87%) \n \n3 \nAbnormal test \nresults \n3.1 Difference between audio and video carrier \n3.2 Difference in output signal level of each modulator \n4 \nProblems \nencountered \n4.1 Insufficient cooling temperature of air-conditioning \nsystem \n4.2 Hard starting characteristic of auxiliary generator \n4.3 Inability of auxiliary generator to operate for longer \nperiod of time \n4.4 Insufficient backup power of UPS \n \n5 \nTools, test \ninstruments, \nequipment, \nmaterials and PPE  \nMay include but not limited to: \nTools, test instrument and equipment: \n5.1 set of screw drivers \n5.2 electrical pliers \n5.3 set of wrenches \n5.4 digital VOM (rms) \n5.5 safety ladder \nMaterials: \n5.6 electrical tapes  \n5.7 fuses \n5.8 technical manuals \nPPE: \n5.9 safety belt \n5.10 rubber gloves \n5.11 safety shoes \n5.12 safety goggles \n5.13 hard hat/helmet \n5.14 proper working clothes\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 39  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \n \n6 \nMeasured voltages \n6.1 input voltage ~ (220 V, sine wave)   \n6.2 output voltage ~ (60 V, quasi-square wave) \n \n7 \nActivation and \nenergization  \nActivation and energization procedures are as follows: \n7.1 Trunk amplifiers and line extenders are powered up and \ninput voltage are measured and recorded \n7.2 DC output voltage is measured at test point of the power \npack supplying the active modules of the trunk and line \nextender amplifiers and is recorded.   \n7.3 Setting and alignment of trunk and line extender \namplifiers input and output signal level are performed, \nobserving the proper signal tilt. using input pad and line \nequalizer are performed as needed.\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 40  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Complied with job requirements and safety procedures \nat all times during commissioning activity \n1.2. Performed test-run on headend equipment and \naccessories prior to interconnection to the CATV outside \nplant system for commercial operation \n1.3. Activated and energized OSP power supplies and \ndistribution systems \n1.4. \nCommunicated and worked with relevant personnel \nconcerned\n2. Underpinning \nknowledge and \nattitude \n2.1 Safety Practices \n2.1.1 Work safety requirements \n2.1.2 Proper use of tools and equipment  \n2.2 Materials, Tools and Equipment:  \n2.2.1 Uses and Specifications \n2.2.2 Identification of appropriate tools, equipment; and \ndevices \n2.3 Theory and Practices \n2.3.1 Commissioning concepts and procedures \n2.3.2 Signal level measurement and adjustment  \n2.3.3 CATV system standard parameters \n2.3.4 CATV Headend equipment operation \n2.3.4.1 signal processors \n2.3.4.2 system converters \n2.3.4.3 modulators \n2.3.4.4 signal mixer \n2.3.4.5 audio equalizer \n2.3.4.6 automatic voltage regulators (AVR) \n2.3.4.7 antenna pre-amps (LNB/LNA and \nVHF/UHF pre-amps) \n2.3.4.8 Cable harness \n2.3.4.9 security alarm systems (optional) \n2.3.5 CATV OSP System \n2.3.5.1 Coaxial/fiber optic cable characteristics \n2.3.5.2 active and passive devices parameters \n2.3.5.3 Pole hardware \n2.3.5.4 Facility grounding and bonding \n2.3.5.5 System alignment and balancing \n2.4 Desirable work values and attitudes (cost conscious, \nsafety conscious, quality conscious, etc.)\n3. Underpinning skills \n3.1. \nWorking efficiently and systematically \n3.2. \nObserving safety precautions  \n3.3. \nProper handling and use of tools, test instruments and \nequipment \n3.4. \ninterpreting measurement and test results \n3.5.\ndocumentation skills\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 41  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \n \n4. Resource \nimplications \nThe following resources should be available: \n4.1. \nDesign plan \n4.2. \nTools, test equipment, materials and PPE  \n4.3. \nWork area  \n4.4. \nTechnical data \n5. Method of \nassessment \n5.1. \nDirect observation/demonstration with oral questioning  \n5.2. \nThird Party Report \n5.3. \nPortfolio \n6. Context of \nassessment \n6.1. \nCompetency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be undertaken either individually or \npart of team under limited supervision\n",
