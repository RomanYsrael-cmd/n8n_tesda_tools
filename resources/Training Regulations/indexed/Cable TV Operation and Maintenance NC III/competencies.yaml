        "evidence_guide": {
          "source_text": "1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Complied with job requirements and safety procedures at all \ntimes during corrective maintenance activity \n1.2. Analyzed, identified and implemented appropriate repair and \nadjustment to troubles/defects accordingly \n1.3. \nDocumented work done and submitted to appropriate \npersonnel. \n2. Underpinning \nknowledge and \nattitude \n \n \n \n \nThe candidate must be able to demonstrate knowledge on the \nfollowing: \n2.1 Safety Practices \n2.1.3 Work safety requirements \n2.1.4 Proper use of tools and equipment  \n2.2 Materials, Tools and Equipment:  \n2.2.1 Uses and Specifications \n2.2.2 Identification of appropriate tools, equipment; and \ndevices \n2.3 Theory and Practices \n2.3.1 CATV system operation \n2.3.2 Corrective maintenance concepts and procedures \n2.3.3 Troubleshooting and repair techniques \n2.3.4 Test and measurements \n \n2.4 Desirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n3. Underpinning \nskills \n3.1. \nWorking efficiently and systematically \n3.2. \nObserving safety precautions  \n3.3. \nProper handling and use of tools, test instruments and \nequipment \n3.4. \nAnalytical skills \n3.5. \nCommunicate effectively \n3.6.\nDocumentation skills\n4. Resource \nimplications \nThe following resources should be available: \n4.1. \nSpare equipment modules \n4.2. \nTools, test instruments, materials and PPE  \n4.3. \nWork area  \n4.4. \nReference signal and supply voltage level \n5. Method of \nassessment \n5.1. \nDirect observation/demonstration with oral questioning  \n5.2. \nThird Party Report \n5.3.\nPortfolio\n6. Context of \nassessment \n6.1. \nCompetency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be undertaken either individually or part of \nteam under limited supervision",
