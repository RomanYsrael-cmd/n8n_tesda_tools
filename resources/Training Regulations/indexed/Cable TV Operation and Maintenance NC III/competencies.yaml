        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Complied with job requirements and safety procedures at all times\nduring preventive maintenance implementation\n1.2. Implemented and strictly followed schedule of preventive\nmaintenance activities as per plan\n1.3.\nCommunicated and worked with relevant personnel\n2. Underpinning\nknowledge and\nattitude\n\nThe candidate must be able to demonstrate knowledge on the following:\n2.1\nSafety Practices\n2.1.1\nWork safety requirements\n2.1.2\nProper use of tools and equipment\n2.2\nMaterials, Tools and Equipment:\n2.2.1\nUses and Specifications\n2.2.2 Identification of appropriate tools, equipment; and devices\n2.3\nTheory and Practices\n2.3.1\nPreventive maintenance concepts and procedures\n2.3.2\nSystem sweeping\n2.3.3\nCATV Headend technology\n2.3.3.1\nSignal sources\n2.3.3.2\nSignal processing\n2.3.3.3\nSignal mixing\n2.3.3.4\nFacility grounding\n2.3.3.5\nAir-conditioning system\n2.3.3.6\nPower sources\n2.3.4\nCATV Outside Plant\n2.3.4.1\nDistribution cables\n2.3.4.2\nActive devices\n2.3.4.3\nPassive devices\n2.3.4.4\nPole hardware\n2.3.4.5\nGrounding and bonding\n2.3.4.6\nSystem alignment and balancing\n2.4\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1.\nWorking efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling, use and maintenance of tools and equipment\n3.4.\nAnalytical skills\n3.5.\nCommunicate effectively\n3.6.\ndocumentation skills\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, test instruments, equipment, materials and PPE\n4.2.\nWork area\n4.3.\nMaintenance log\n4.4.\nReference/Historical data (for work area or simulated CATV\nsystem)\n4.5.\nTechnical manuals (optional)\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nThird Party Report\n5.3.\nPortfolio\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a simulated\nworkplace setting\n6.2.\nAssessment shall be undertaken either individually or part of team\nunder limited supervision\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 50\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY :\nPERFORM CATV SYSTEM TROUBLESHOOTING\nAND REPAIR\nUNIT CODE\n:"
        },
        "source_text": "MDA311303\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to perform/implement preventive maintenance\nof cable television headend and outside plant.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1 Plan and prepare\nschedules for\nmaintenance\n1.1 Preventive maintenance checks are identified and\ndocumented based on established plan and procedures.\n1.2 Appropriate materials, tools, test instruments and\nequipment are identified and selected based on job\nrequirements.\n1.3 Inventory of spare equipment and materials are\nidentified and listed in accordance with job requirements.\n2 Carry out preventive\nmaintenance\n2.1 Appropriate personal protective equipment (PPE) is\nused in accordance with OHS requirements.\n2.2 Scheduled preventive maintenance activities are\nstrictly followed and implemented as per plan.\n2.3 Identified equipment and accessories that will cause\npotential problems are scheduled for repair and/or\nreplacement.\n2.4 Inventory of spare equipment and materials are\nmaintained in accordance with established industry\npractices.\n2.5 Unusual problems encountered are noted and referred\nto concerned personnel for appropriate action.\n3 Prepare preventive\nmaintenance report\n3.1 Preventive maintenance log book is properly\naccomplished.\n3.2 Inventory stock levels are recorded in the stock cards as\nper company policy.\n3.3 Recommendations for preventive maintenance are\nprepared and referred to concerned personnel.\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 46\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. preventive\nmaintenance\nchecks\nPreventive maintenance checks may include:\nHEADEND:\n1.1\nMechanical\n1.1.1. air-conditioning units\n1.1.2. emergency generator\n1.1.3. antenna tower structures\n1.1.4. building structures\n1.1.5. facility grounding and bonding\n1.1.6. lightning arresters\n1.1.7. satellite dish structures\n1.2\nElectrical/Electronics\n1.2.1. signal processing equipment\n1.2.2. satellite receivers\n1.2.3. modulators\n1.2.4. systems converters\n1.2.5. automatic voltage regulators (AVR)\n1.2.6. antenna pre-amps, LNB/LNA and downleads\n1.2.7. equipment interconnecting cables\n1.2.8. electrical wirings and lightings\n1.2.9. security alarm systems (optional)\nOUTSIDE PLANT:\n1.1\nMechanical\n1.1.1. equipment attachments\n1.1.2. cable attachments\n1.1.3. guying and bonding\n1.1.4. connectorization\n1.2\nElectrical/electronics\n1.2.1. power supplies\n1.2.2. active and passive devices\n1.2.3. grounding\n\n2. spare equipment\nand materials\nThis may include:\n2.1\nEquipment\n2.1.1. agile modulator\n2.1.2. agile demodulator\n2.1.3. satellite receiver\n2.1.4. signal processor\n2.1.5. super heterodyne processor\n2.1.6. low-noise block down converter (LNB)\n2.1.7. power divider\n2.1.8. AVR\n2.2\nMaterials\n2.2.1. RG-6 coaxial cable\n2.2.2. connectors\n2.2.3. hardware, supplies and spare parts\n2.2.4. heat shrink\n2.2.5. silicon gel\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 47\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n3. PPE\nPPE may include:\n3.1\nsafety belt\n3.2\nrubber gloves\n3.3\nsafety shoes\n3.4\nsafety ladder\n3.5\nhard hat\n3.6\nsafety goggles\n\n4. preventive\nmaintenance\nactivities\nActivities may include:\n4.1\nPest control activities (insects, rodents, birds, termites)\n4.2\nGrass trimming/cutting\n4.3\nTree branch trimming\n4.4\nCleaning/sweeping/vacuum-cleaning of floors and equipment\nsurfaces and air-con filters\n4.5\nLubrication of satellite dish mechanism and emergency\ngenerator\n4.6\nAnti-corrosion on grounding facilities\n4.7\nAdjustments of output levels of processors, modulators, and\nsatellite receivers\n4.8\nCheck standby power supplies for the following:\n4.8.1. Corrosion on battery terminals and power-supply housing\n4.8.2. Float and charging voltage of standby power supplies\n4.8.3. Open-circuit voltage of each standby battery (difference with\neach battery in the series should not be more than 0.5 VDC\nand each battery should not be less than 10.5 VDC); replace\nbatteries if more than 0.5 VDC difference\n4.8.4. Physical condition of AC capacitor [(oil leaks and deformed\nappearance) CAUTION: Beware of high voltages on the AC\ncapacitor]; recommend replacement of leaky capacitors.\n4.9 Signal test and voltage check of trunk amplifiers and line-\nextender amplifiers\n\n5. potential\nproblems\nPotential problems may include:\nHeadend:\n5.1 tree branches blocking satellite signal path\n5.2 corroded/rusty antenna structure\n5.3 loose antenna guy wires\n5.4 eroded/loose antenna foundation\n5.5 warped or dirty satellite dish\n5.6 bird droppings on satellite dish\n5.7 bird’s nest on feed-horn throat or harness\n5.8 leaking roofs\n5.9 flooding on floor of equipment room\nOSP:\n5.10 broken lashing wire\n5.11 tree branches in contact with cables\n5.12 dirty equipment\n5.13 corroded structures\n5.14 loose antenna structure\n5.15 sagging power lines and/or communication cables\n5.16 loose messenger wires\n\n--- PDF PAGE 50 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 48\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n6. unusual problems\nUnusual problems may include:\n6.1 conflict with other parties:\n6.1.1. government national and local regulations\n6.1.2. owner of subject vegetation that needs to be trimmed\n6.1.3. installation of other utility companies affecting the\nCATV cable lines\n6.2 accidents and unforeseen incidents\n6.3 Situations arising from poor peace and order conditions\n6.4 Poles that needs to be replaced or relocated\n7. concerned\npersonnel\nThis may include:\n7.1 supervisors and/or owner of CATV facilities\n7.2 town/barangay officials\n7.3 homeowner association officials\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 49\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Complied with job requirements and safety procedures at all times\nduring preventive maintenance implementation\n1.2. Implemented and strictly followed schedule of preventive\nmaintenance activities as per plan\n1.3.\nCommunicated and worked with relevant personnel\n2. Underpinning\nknowledge and\nattitude\n\nThe candidate must be able to demonstrate knowledge on the following:\n2.1\nSafety Practices\n2.1.1\nWork safety requirements\n2.1.2\nProper use of tools and equipment\n2.2\nMaterials, Tools and Equipment:\n2.2.1\nUses and Specifications\n2.2.2 Identification of appropriate tools, equipment; and devices\n2.3\nTheory and Practices\n2.3.1\nPreventive maintenance concepts and procedures\n2.3.2\nSystem sweeping\n2.3.3\nCATV Headend technology\n2.3.3.1\nSignal sources\n2.3.3.2\nSignal processing\n2.3.3.3\nSignal mixing\n2.3.3.4\nFacility grounding\n2.3.3.5\nAir-conditioning system\n2.3.3.6\nPower sources\n2.3.4\nCATV Outside Plant\n2.3.4.1\nDistribution cables\n2.3.4.2\nActive devices\n2.3.4.3\nPassive devices\n2.3.4.4\nPole hardware\n2.3.4.5\nGrounding and bonding\n2.3.4.6\nSystem alignment and balancing\n2.4\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1.\nWorking efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling, use and maintenance of tools and equipment\n3.4.\nAnalytical skills\n3.5.\nCommunicate effectively\n3.6.\ndocumentation skills\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, test instruments, equipment, materials and PPE\n4.2.\nWork area\n4.3.\nMaintenance log\n4.4.\nReference/Historical data (for work area or simulated CATV\nsystem)\n4.5.\nTechnical manuals (optional)\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nThird Party Report\n5.3.\nPortfolio\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a simulated\nworkplace setting\n6.2.\nAssessment shall be undertaken either individually or part of team\nunder limited supervision\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 50\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY :\nPERFORM CATV SYSTEM TROUBLESHOOTING\nAND REPAIR\nUNIT CODE\n:"
