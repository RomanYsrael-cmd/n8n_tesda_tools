  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for CATV OPERATION & MAINTENANCE NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4. Goals/objectives and action plan are undertaken in\nthe workplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 3\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 6 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 4\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written\nform\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge\n2.1.\nOrganization requirements for written and electronic\ncommunication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning\nSkills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace work environment\n\n--- PDF PAGE 7 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 5\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n : 500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1.\nWork requirements are identified and presented to\nteam members\n1.2.\nReasons for instructions and requirements are\ncommunicated to team members\n1.3.\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities 2.1.\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude required\nto properly undertake the assigned task and\naccording to company policy\n2.2.\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1.\nPerformance expectations are established based on\nclient needs and according to assignment\nrequirements\n3.2.\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3.\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1.\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2.\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3.\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer policy\n4.4.\nTeam members are kept informed of any changes in\nthe priority allocated to assignments or tasks which\nmight impact on client/customer needs and\nsatisfaction\n4.5.\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6.\nFollow-up communication is provided on all issues\naffecting the team\n4.7.\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 8 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 6\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 9 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 7\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n\n2. Underpinning\nKnowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6. Team member’s duties and responsibilities\n3. Underpinning\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4. Negotiating skills\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated work environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 8\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome\nand participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating non verbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and\nup-to- date\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 9\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 Self awareness\n1.4.2 Self esteem\n1.4.3 Objectivity\n1.4.4 Empathy\n1.4.5 Respect for others\nInterpersonal skills\n1.5.1 Listening/reflecting\n1.5.2 Non-verbal communication\n1.5.3 Assertiveness\n1.5.4 Behavior labeling\n1.5.5 Testing understanding\n1.5.6 Seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 Observing differences between content\nand process\n1.6.2 Identifying bargaining information\n1.6.3 Applying strategies to manage process\n1.6.4 Applying steps in negotiating process\n1.6.5 Strategies to manage conflict\n1.6.6 Steps in negotiating process\n1.6.7 Options within organization and externally\nfor resolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 12 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 10\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nSkills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 13 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 11\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to determine\nand resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1. Variances are identified from normal operating\nparameters; and product quality\n1.2. Extent, cause and nature of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3. Problems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1. Possible causes are identified based on\nexperience and the use of problem solving tools /\nanalytical techniques.\n2.2. Possible cause statements are developed based\non findings\n2.3. Fundamental causes are identified per results of\ninvestigation conducted\n3. Determine corrective\naction\n3.1. All possible options are considered for resolution\nof the problem\n3.2. Strengths and weaknesses of possible options\nare considered\n3.3. Corrective actions are determined to resolve the\nproblem and possible future causes\n3.4. Action plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and operating\nprocedures\n4. Provide\nrecommendation/s to\nmanager\n4.1. Report on recommendations are prepared\naccording to procedures\n4.2. Recommendations are presented to appropriate\npersonnel.\n4.3. Recommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 12\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 13\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1.\nRelevant equipment and operational\nprocesses\n2.2.2.\nEnterprise goals, targets and measures\n2.2.3.\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4.\nPrinciples of decision making strategies\nand techniques\n2.2.5.\nEnterprise information systems and data\ncollation\n2.2.6.\nIndustry codes and standards\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n\n--- PDF PAGE 16 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 14\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context for\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 17 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 15\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nin the application of mathematical concepts and techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 16\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 19 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 17\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nKnowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nSkills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 18\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude\nrequired\nin\nselecting,\nsourcing\nand\napplying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in\ncarrying out function\n2.2 Applicable software and hardware are used as\nper task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n3. Maintain/enhance of\nrelevant technology\n3.1 Maintenance of technology is applied in\naccordance with the industry standard\noperating procedure, manufacturer’s\noperating guidelines and occupational health\nand safety procedure to ensure its operative\nability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance\nwith job requirement\n3.3 Technology failure/ defect is immediately\nreported to the concern/responsible person or\nsection for appropriate action\n\n--- PDF PAGE 21 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 19\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 20\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n2 1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nSkills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context for\nAssessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 21\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:\nELC724201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on the safe\nuse, handling and maintenance of tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntasks to be undertaken\n1.1. Tasks to be undertaken are properly identified\n1.2. Appropriate hand tools are identified and\nselected according to the task requirements\n2. Prepare hand tools\n2.1. Appropriate hand tools are checked for proper\noperation and safety\n2.2. Unsafe or faulty tools are identified and marked for\nrepair according to standard company procedure\n3. Use appropriate hand\ntools and test equipment\n3.1. Tools are used according to tasks undertaken\n3.2. All safety procedures in using tools are observed\nat all times and appropriate personal protective\nequipment (PPE) are used\n3.3. Malfunctions, unplanned or unusual events are\nreported to the supervisor\n4. Maintain hand tools\n4.1. Tools are handled without damage according to\nprocedures\n4.2. Routine maintenance of tools undertaken\naccording to standard operational procedures,\nprinciples and techniques\n4.3. Tools are stored safely in appropriate locations in\naccordance with manufacturer’s specifications or\nstandard operating procedures\n\n--- PDF PAGE 24 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 22\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\n1.1.\nHand tools for adjusting, dismantling, assembling,\nfinishing, cutting. Tool set includes the following\nbut not limited to: screw drivers, pliers, punches,\nwrenches, files\n2. Personal Protective\nEquipment (PPE)\n2.1.\nGloves\n2.2.\nProtective eyewear\n2.3.\nApron/overall\n3. Maintenance\n3.1.\nCleaning\n3.2.\nLubricating\n3.3.\nTightening\n3.4.\nSimple tool repairs\n3.5.\nHand sharpening\n3.6.\nAdjustment using correct procedures\n\n--- PDF PAGE 25 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 23\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes,\nevents or tasks being undertaken to ensure a\nsafe and efficient working environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate\nlocation\n2. Underpinning\nknowledge\n\n2.1. Safety\n2.1.1.\nSafety requirements in handling tools\n2.2. Tools :\n2.2.1. Function, Operation, Common faults\n2.3. Processes, Operations, Systems\n2.3.1.\nMaintenance of tools\n2.3.2.\nStorage of Tools\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction and numerical skills\n3.2. Communication skills\n3.3. Problem solving in emergency situation\n4. Method of assessment\nCompetency in this unit must be assessed through:\n4.1. Observation\n4.2. Oral questioning\n5. Resource Implication\n5.1. Tools may include the following but not limited to:\n5.1.1.\nscrew drivers\n5.1.2.\npliers\n5.1.3.\npunches\n5.1.4.\nwrenches, files\n6. Context of Assessment\n\n6.1. Assessment may be conducted in the workplace\nor in a simulated work environment\n\n--- PDF PAGE 26 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 24\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT TITLE\n:\nPERFORM MENSURATION AND CALCULATION\nUNIT CODE\n: ELC311201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded identify, care, handle and use measuring instruments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Select measuring\ninstruments\n1.1. Object or component to be measured is\nidentified according to procedures\n1.2. Correct specifications are obtained from relevant\nsource\n1.3. Measuring tools are selected in line with job\nrequirements\n2. Carry out measurements\nand calculation\n2.1. Appropriate measuring instrument is selected\nto achieve required outcome\n2.2. Accurate measurements are obtained for job\n2.3. Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x),\nand division (/)\n2.4. Calculation involving fractions, percentages and\nmixed numbers are used to complete workplace\ntasks.\n2.5. Numerical computation is checked and corrected\nfor accuracy\n2.6. Instruments are read to the limit of accuracy of\nthe tool.\n3. Maintain measuring\ninstruments\n3.1. Measuring instruments are handled without\ndamage according to procedures\n3.2. Measuring instruments are cleaned before and\nafter using.\n3.3. Proper storage of instruments are undertaken\naccording to manufacturer’s specifications and\nstandard operating procedures.\n\n--- PDF PAGE 27 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 25\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\n1.1. Straight edge\n1.2. Torque gauge\n1.3. Try square\n1.4. Protractor\n1.5. Combination gauge\n1.6. Steel rule\n2. Calculation\n\nKinds of part mensuration includes the following\nbut not limited to\n2.1. Volume\n2.2. Area\n2.3. Displacement\n2.4. Inside diameter\n2.5. Circumference\n2.6. Length\n2.7. Thickness\n2.8. Outside diameter\n2.9. Taper\n2.10. Out of roundness\n\n--- PDF PAGE 28 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 26\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected proper measuring instruments\naccording to tasks\n1.2. Carried out measurement and calculations\n1.3. Maintained and stores instruments\n2. Underpinning knowledge\n2.1. Types of measuring instruments and their uses\n2.2. Safe handling procedures in using measuring\ninstruments\n2.3. Four fundamental operation of mathematics\n2.4. Formula for volume, area, perimeter and other\ngeometric figures\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Handling measuring instruments\n3.4. Performing mathematical calculations using\nthe four fundamental operations\n3.5. Visualizing objects and shapes\n3.6. Interpreting formulae\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Observation\n4.2. Oral questioning\n5. Resource implication\n5.1. Place of assessment\n5.2. Measuring instruments\n5.3. Straight edge\n5.4. Torque gauge\n5.5. Try square\n5.6. Protractor\n5.7. Combination gauge\n5.8. Steel rule\n6. Context of Assessment\n6.1. Assessment may be conducted in the\nworkplace or in a simulated work environment\n\n--- PDF PAGE 29 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 27\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\nUNIT CODE\n: ELC311202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded to prepare/interpret diagrams, engineering abbreviation\nand drawings, symbols, dimension.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Identify different kinds of\ntechnical drawings\n1.1. Correct technical drawing is selected\naccording to job requirements.\n1.2. Technical drawings are segregated in\naccordance with the types and kinds of\ndrawings\n2. Interpret technical drawing\n2.1. Components, assemblies or objects are\nrecognized as required.\n2.2. Dimensions of the key features of the\nobjects depicted in the drawing are correctly\nidentified.\n2.3. Symbols used in the drawing are identified\nand interpreted correctly.\n2.4. Drawing is checked and validated against job\nrequirements or equipment in accordance\nwith standard operating procedures.\n3. Prepare/make changes to\nelectrical/electronic\nschematics and drawings\n3.1. Electrical/electronic schematic is drawn and\ncorrectly identified.\n3.2. Correct drawing is identified, equipment are\nselected and used in accordance with job\nrequirements.\n4. Store technical drawings and\nequipment /instruments\n4.1. Care and maintenance of drawings are\nundertaken according to company\nprocedures.\n4.2. Technical drawings are recorded and\ninventory is prepared in accordance with\ncompany procedures.\n4.3. Proper storage of instruments is undertaken\naccording to company procedures.\n\n--- PDF PAGE 30 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 28\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical drawings\nTechnical drawings include the following but not\nlimited to:\n\n1.1. Schematic diagrams\n1.2. Charts\n1.3. Block diagrams\n1.4. Lay-out plans\n1.5. Location plans\n1.6. Process and instrumentation diagrams\n1.7. Loop diagrams\n1.8. System Control Diagrams\n2. Dimensions\nDimensions may include but not limited to:\n\n2.1. Length\n2.2. Width\n2.3. Height\n2.4. Diameter\n2.5. Angles\n3. Symbols\nMay include but not limited to:\n\n3.1. NEC- National Electric Code\n3.2. IEC -International Electrotechnical Commission\n3.3. ASME - American Society of Mechanical\nEngineers\n3.4. IEEE - Institute of Electrical and Electronics\nEngineers\n3.5. ISA - Instrumentation System and Automation\nSociety\n4. Instruments/Equipment\n4.1. Components/dividers\n4.2. Drawing boards\n4.3. Rulers\n4.4. T-square\n4.5. Calculator\n\n--- PDF PAGE 31 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 29\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetencies\nAssessment requires evidence that the candidate:\n\n1.1. Selected correct technical drawing in line with job\nrequirements\n1.2. Correctly identified the objects represented in the\ndrawing\n1.3. Identified and interpreted symbols used in the\ndrawing correctly\n1.4. Prepared/produced electrical/electronic drawings\nincluding all relevant specifications\n1.5. Stored diagrams/equipment\n2. Underpinning\nknowledge\n2.1. Drawing conventions\n2.2. Symbols\n2.3. Dimensioning Conventions\n2.4. Mark up/Notation of Drawings\n2.5. Mathematics\n2.5.1. Four fundamental operations\n2.5.2. Percentage\n2.5.3. Fraction\n2.5.4. Trigonometric Functions\n2.5.5. Algebra\n2.5.6. Geometry\n3. Underpinning skills\n3.1. Reading skills required to interpret work instruction\n3.2. Communication skills\n3.3. Interpreting electrical/electronic signs and symbols\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Practical tasks involving interpretation of a range of\ntechnical drawings\n4.2. Oral questioning\n5. Resource implication\n5.1. Drawings\n5.2. Diagrams\n5.3. Charts\n5.4. Plans\n6. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 32 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 30\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:\nELC315202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to apply quality standards in the workplace.\nThe unit also includes the application of relevant safety\nprocedures and regulations, organization procedures and\ncustomer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials or\ncomponents\n1.1. Work instructions are obtained and work is carried\nout in accordance with standard operating\nprocedures\n1.2. Received materials or component parts are\nchecked against workplace standards and\nspecifications\n1.3. Faulty material or components related to work are\nidentified and isolated\n1.4. Faults and any identified causes are recorded\nand/or reported to the supervisor concerned in\naccordance with workplace procedures\n1.5. Faulty materials or components are replaced in\naccordance with workplace procedures\n2. Assess own work\n2.1. Documentation relative to quality within the\ncompany is identified and used\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken\n2.3. Faulty pieces are identified and isolated\n2.4. Information on the quality and other indicators of\nproduction performance is recorded in accordance\nwith workplace procedures\n2.5. Deviations from specified quality standards,\ncauses are documented and reported in\naccordance with the workplace’ standards\noperating procedures\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated\nin relation to workplace assignment\n3.2. Work is carried out in accordance with process\nimprovement procedures\n3.3. Performance of operation or quality of product or\nservice to ensure customer satisfaction is\nmonitored\n\n--- PDF PAGE 33 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 31\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. Wires\n1.1.2. Cables, soldering lead\n1.1.3. Electrical tape\n1.2. Components may include but not limited to:\n1.2.1. ICs\n1.2.2. Diodes\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Quality standards\n4.1. Quality standards may relate but not limited to\nthe following:\n4.1.1. Materials\n4.1.2. Component parts\n4.1.3. Final product\n4.1.4. Production processes\n5. Customer\n5.1. Co-worker\n5.2. Supplier\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 34 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 32\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Underpinning knowledge\n2.1. Relevant production processes, materials and\nproducts\n2.2. Characteristics of materials/component parts\nused in electronic production processes\n2.3. Quality checking procedures\n2.4. Workplace procedures\n2.5. Safety and environmental aspects of production\nprocesses\n2.6. Fault identification and reporting\n2.7. Quality improvement process\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills needed to interpret and\napply defined work procedures\n3.3. Carry out work in accordance with OHS policies\nand procedures\n4. Method of assessment\n4.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n\n5.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n6. Context of Assessment\n\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment.\n\n--- PDF PAGE 35 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 33\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nSUPERVISE INSTALLATION OF CATV SYSTEM\nUNIT CODE\n: MDA311301\nDESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto supervise installation of CATV systems requiring\nplanning, implementation and evaluation of the job\nperformed.\n..\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1.\nPlan and prepare\nCATV system\ninstallation\n\n1.1 Installation procedures are planned and prepared based\non industry standards.\n1.2 Appropriate personnel are consulted to ensure the work is\ncoordinated effectively with others involved in the work site.\n1.3 Installation plan and materials are checked against\nrequirements\n1.4 Tools, equipment and testing devices needed to carry out\nthe installation work are obtained in accordance with\nestablished procedures and checked for correct operation\nand safety\n\n2\nOversee\ninstallation of\nCATV system\n\n2.1 OH&S policies and procedures are followed\n2.2 Materials, devices and equipment are checked, segregated\nand arranged for ease of installation.\n2.3 Installation activities are directed in accordance with the\nplan.\n2.4 CATV installers are provided with clear instructions on the\nwork to be done and the respective responsibilities\nassociated with the work and others who are involved\n2.5 CATV installers are guided/mentored and stage check is\nmade at a level appropriate to the stage of development in\naccordance with industry standards\n2.6 Unplanned events or conditions are responded to in\naccordance with established procedures and approval is\nobtained from appropriate personnel before any\ncontingencies are implemented\n\n3\nInspect and\ndocument\ncompletion of work\n\n3.1 Final inspections and performance checks are undertaken\nto ensure that the installation procedures of devices,\nmaterials and equipment conforms to industry standards\n3.2 Joint-pole agreement is strictly observed and provisions\nstipulated on the NTC provisional authority is complied\n3.3 Work completion is documented and reported to personnel\nconcerned in accordance with established procedures\n\n--- PDF PAGE 36 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 34\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\n1. Installation\nprocedures\nInstallation procedures may include but not limited to:\n1.1\nInstallation of pole hardware\n1.2\nInstallation and layout of cables\n1.3\nInstallation of active and passive devices\n1.4\nInstallation of subscriber drop lines\n1.5\nInstallation of devices for SDU and MDU\n1.6\nInstallation of headend equipment and auxiliary devices\n2. Appropriate\nperson\nMay include:\n2.1 System Manager\n2.2 Project engineer\n2.3 Technical supervisor\n2.4 Technicians\n2.5 Installers\n2.6 Other personnel designated by an organization or enterprise\n\n3. Established\nprocedures\nFormal arrangements of an organization, enterprise or statutory\nauthority on task performances.\n4.1 Quality assurance systems incorporating, for example:\n4.1.1\nSpecifications, requirements and procedures\n4.1.2\nWork orders / instructions\n4.1.3\nReporting procedures\n4.1.4\nImprovement mechanisms\n4.1.5\nCompliance requirements\n4.1.6\nSafety management\n4.2 Work clearance systems incorporating, for example:\n4.2.1\nWork permits\n4.2.2\nMonitoring and clearance procedures\n4.2.3\nIsolation procedures\n4.3 Joint Pole Agreement\n4.4 OH&S practices\n4.5 Procedures for operating safety systems, operating plant\nand equipment and reporting work activities\n4.6 Maintenance, modification or supply of relevant schematic\ndrawings and technical data\n4.7 Arrangements for dealing with emergency situations.\n\n4. Unplanned\nevents or\nconditions\nMay include but not limited to:\n5.1 Accidents/incidents\n5.2 Brownout\n5.3 Equipment breakdown\n5.4 Force majeure e.g., earthquake, fire, typhoon\n\n--- PDF PAGE 37 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 35\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Planned installation procedures in line with job\nrequirements\n1.2 Prepared/obtained materials, PPE, tools, equipment and\ntesting devices in line with established procedures\n1.3 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.4 Directed installation activities in line with established\nprocedures and job requirements\n1.5 Performed final inspection to ensure installation of CATV\nsystem meet job requirements\n1.6 Communicated effectively with others to ensure safe and\neffective work operations\n2. Underpinning\nknowledge and\nattitude\n2.1. Design plan interpretation\n2.2. Appropriate knowledge in procedure on:\n2.2.1. Installation of pole hardware\n2.2.2. Installation and layout of cables\n2.2.3. Installation of active and passive devices\n2.2.4. Installation of subscriber drop lines\n2.2.5. Installation of devices for SDU and MDU\n2.2.6. Installation of headend equipment and auxiliary\ndevices\n2.3. System and processes\n2.3.1. Headend assembly and practices\n2.3.2. Antenna system installation procedures\n2.3.3. Facility grounding and bonding practices\n2.4. Safety\n2.4.1. Work safety requirements and economy of\nmaterials with durability\n2.4.2. Knowledge in 5S application and observation of\nrequired timeframe\n2.5. Materials, Tools and Equipment: Uses and Specifications\n2.5.1. Identification of appropriate tools, equipment and\ndevices\n2.6. Laws and regulations\n2.6.1. NTC Memorandum Circulars\n2.6.2. Local Ordinance\n2.6.3. DTI Regulations\n2.6.4. RA 9292\n2.6.5. Philippine Electrical code\n2.6.6. Philippine Electronic code\n\n--- PDF PAGE 38 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 36\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n3. Underpinning skills\n3.1. Work efficiency\n3.2. Communication skills in interpreting service manual and\ndealing with the client\n3.3. Skills in the installation procedures\n3.4. Supervisory skills\n3.5. Applying work safety practices and time management\n3.6. Interpreting design plan in relation to job requirements\n4. Resource\nimplications\nIncludes but not limited to:\n4.1. Work area\n4.2. Design plan, technical manuals, schematic diagrams\n4.3. Tools, equipment and test instruments and devices\n4.4. Materials\n4.5. Personal protective equipment (PPE)\n4.6. Service vehicle (as needed)\n5. Method of\nassessment\nThe assessor must select at least two of the following\nassessment methods to objectively assess the candidate:\n5.1. Case study/ Written Report\n5.2. Portfolio\n5.3. Third Party Report\n6. Context of\nassessment\n6.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 39 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 37\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY :\nCOMMISSION CATV SYSTEM\nUNIT CODE\n:\nMDA311301\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to perform commissioning of CATV system\nwhich may include headend and outside plant system.\nThis covers the activation of headend equipment, cable\npowering, energizing and adjustment of proper signal\nlevel.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Test-run headend\nequipment\n\n1.1 Test instruments and equipment are prepared and\nchecked prior to test run.\n1.2 Signal levels are measured and set per channel based on\nstandard headend parameters\n1.3 Signals are combined/mixed in such a way that signal\nlevels are at the same prescribed level to properly drive\nthe launching amplifier.\n1.4 Re-adjustments/re-alignments of questionable channels\nand equipment diagnosis are performed in case of\nabnormal test results\n1.5 Results of tests and measurements per channel are\ndocumented in accordance with company requirements.\n2. Test-run auxiliary\nequipment\n\n2.1 Operation of air-conditioning system is tested and\ncompared with required ambient temperature for headend\nequipment operation.\n2.2 Standby generator is test-run for proper voltage and\nfrequency regulation.\n2.3 Test results are recorded and documented in accordance\nwith job requirements.\n2.4 Problems encountered in operation of equipment\naccessories are documented and referred to concerned\npersonnel in accordance with company procedures.\n3. Activate OSP\npower supplies\n3.1 Appropriate tools, test instrument, equipment,\nmaterials and PPE are prepared and checked prior to\nactivation of power.\n3.2 Power switch is switched on and input and output\nvoltages are measured and recorded.\n4 Energize OSP\ndistribution system\n\n4.1 Trunk amplifiers are activated and energized to the\ncorrect signal level as per design plan\n4.2 Line extender amplifiers are activated and energized to\ndeliver proper signal level as per design plan\n4.3 Safety precautions are observed and followed in climbing\npoles and powering of each amplifier.\n4.4 Measurements and results of tests are recorded and\ndocumented in accordance with established procedures\n\n--- PDF PAGE 40 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 38\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\n1\nTest instruments\nand equipment\nThis may include:\n1.1 Signal-level meter (SLM)\n1.2 Volt-ohm meter (VOM)\n1.3 spectrum analyzer\n1.4 power meter\n\n2\nStandard headend\nparameters\nThis may include:\n2.1 aural signal level (10 – 17 db below adjacent visual\nsignal level)\n2.2 carrier-to-noise ratio (43 db)\n2.3 carrier-to-cross modulation (46 db)\n2.4 carrier-to-composite triple bit (46 db)\n2.5 hum modulation (1%)\n2.6 broadband frequency response (flat)\n2.7 percentage modulation (87%)\n\n3\nAbnormal test\nresults\n3.1 Difference between audio and video carrier\n3.2 Difference in output signal level of each modulator\n4\nProblems\nencountered\n4.1 Insufficient cooling temperature of air-conditioning\nsystem\n4.2 Hard starting characteristic of auxiliary generator\n4.3 Inability of auxiliary generator to operate for longer\nperiod of time\n4.4 Insufficient backup power of UPS\n\n5\nTools, test\ninstruments,\nequipment,\nmaterials and PPE\nMay include but not limited to:\nTools, test instrument and equipment:\n5.1 set of screw drivers\n5.2 electrical pliers\n5.3 set of wrenches\n5.4 digital VOM (rms)\n5.5 safety ladder\nMaterials:\n5.6 electrical tapes\n5.7 fuses\n5.8 technical manuals\nPPE:\n5.9 safety belt\n5.10 rubber gloves\n5.11 safety shoes\n5.12 safety goggles\n5.13 hard hat/helmet\n5.14 proper working clothes\n\n--- PDF PAGE 41 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 39\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n6\nMeasured voltages\n6.1 input voltage ~ (220 V, sine wave)\n6.2 output voltage ~ (60 V, quasi-square wave)\n\n7\nActivation and\nenergization\nActivation and energization procedures are as follows:\n7.1 Trunk amplifiers and line extenders are powered up and\ninput voltage are measured and recorded\n7.2 DC output voltage is measured at test point of the power\npack supplying the active modules of the trunk and line\nextender amplifiers and is recorded.\n7.3 Setting and alignment of trunk and line extender\namplifiers input and output signal level are performed,\nobserving the proper signal tilt. using input pad and line\nequalizer are performed as needed.\n\n--- PDF PAGE 42 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 40\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Complied with job requirements and safety procedures\nat all times during commissioning activity\n1.2. Performed test-run on headend equipment and\naccessories prior to interconnection to the CATV outside\nplant system for commercial operation\n1.3. Activated and energized OSP power supplies and\ndistribution systems\n1.4.\nCommunicated and worked with relevant personnel\nconcerned\n2. Underpinning\nknowledge and\nattitude\n2.1 Safety Practices\n2.1.1 Work safety requirements\n2.1.2 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment:\n2.2.1 Uses and Specifications\n2.2.2 Identification of appropriate tools, equipment; and\ndevices\n2.3 Theory and Practices\n2.3.1 Commissioning concepts and procedures\n2.3.2 Signal level measurement and adjustment\n2.3.3 CATV system standard parameters\n2.3.4 CATV Headend equipment operation\n2.3.4.1 signal processors\n2.3.4.2 system converters\n2.3.4.3 modulators\n2.3.4.4 signal mixer\n2.3.4.5 audio equalizer\n2.3.4.6 automatic voltage regulators (AVR)\n2.3.4.7 antenna pre-amps (LNB/LNA and\nVHF/UHF pre-amps)\n2.3.4.8 Cable harness\n2.3.4.9 security alarm systems (optional)\n2.3.5 CATV OSP System\n2.3.5.1 Coaxial/fiber optic cable characteristics\n2.3.5.2 active and passive devices parameters\n2.3.5.3 Pole hardware\n2.3.5.4 Facility grounding and bonding\n2.3.5.5 System alignment and balancing\n2.4 Desirable work values and attitudes (cost conscious,\nsafety conscious, quality conscious, etc.)\n3. Underpinning skills\n3.1.\nWorking efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling and use of tools, test instruments and\nequipment\n3.4.\ninterpreting measurement and test results\n3.5.\ndocumentation skills\n\n--- PDF PAGE 43 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 41\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nDesign plan\n4.2.\nTools, test equipment, materials and PPE\n4.3.\nWork area\n4.4.\nTechnical data\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nThird Party Report\n5.3.\nPortfolio\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 44 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 42\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY :\nOPERATE CATV SYSTEM\nUNIT CODE\n:\nMDA311302\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to monitor, interpret/analyze, adjust and\ncalibrate CATV system’s performance in the day-to-day\noperation as well as monitoring and attending to\nsubscribers/customers’ complaints.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1 Monitor headend site\nfacilities\n1.1 Emergency generator, antenna tower/TVRO, facility\ngrounding, air-con systems, security system and head-\nend building are checked and documented.\n1.2 Identified abnormal findings are documented and\nreported in accordance with company procedures.\n1.3 Where applicable, immediate remedies are made for the\nproblems encountered.\n\n2 Monitor CATV system\nperformance\n2.1 Appropriate PPE are selected and used in the\nperformance of the job.\n2.2 Equipment signal-levels are monitored for normal\nreadings based on established reference parameters.\n2.3 Normal and abnormal operations/readings are recorded\nand noted.\n2.4 Where applicable, immediate remedies are made to\nsustain normal operation.\n2.5 Action taken are logged and documented in accordance\nwith established procedures.\n\n3 Monitor customers’\ncomplaints\n3.1 Customer complaints on technical problems are received\nand scheduled for implementation.\n3.2 Suspected area at fault is verified and specific device is\npinpointed as per customer complaint.\n3.3 Where applicable, immediate remedies are made to\nsustain normal operation.\n3.4 Job accomplishment is acknowledged and signed by\neach affected customer.\n3.5 Action taken are logged and documented in accordance\nwith established procedures.\n\n--- PDF PAGE 45 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 43\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Immediate\nremedies\nMay include:\n1.1 Adjustment of signal levels at particular channel/s\n1.2 Replacement with spare unit\n1.3 Tightening loose connections, cables/cords, plugs, switches\n1.4 Cleaning dirty surfaces and parts\n1.5 Cutting in of emergency power\n1.6 Splicing cable cuts\n1.7 Replacement of corroded connectors\n1.8 Replacement of slow-blow fuses\n1.9 Resetting of circuit breakers\n2. Reference\nparameters\n2.1 Normal signal levels per channel (output side)\n2.2 Normal output composite signal level of satellite receiver\n2.3 Normal output signal levels of all VHF/UHF antenna pre-amps\n(broadband/narrowband)\n2.4 Difference between video and audio carrier signal levels (audio\ncarrier should be lower by 15 dB than video carrier)\n2.5 Input and output signal levels of active devices\n2.6 End-of-line performance\n2.7 Normal supply voltages of active devices\n2.8 Proof of performance (e. g., carrier-to-noise ratios, composite\ntriple beat, hum modulation, composite second-order harmonic\n(CSO))\n2.9 Open-circuit voltages of standby batteries\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 44\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Maintained trouble-free continuous operation of CATV system\nand facilities\n1.2.\nMonitored and documented technical troubles encountered\n1.3.\nDelivered quick response/remedies for troubles encountered\n1.4.\n2. Underpinning\nknowledge and\nattitude\n\n2.1\nSafety Practices\n2.1.1 Work safety requirements\n2.1.2 Proper use of tools and equipment\n2.2\nMaterials, Tools and Equipment:\n2.2.1 Uses and Specifications\n2.2.2 Identification of appropriate tools, equipment; and\ndevices and proper usage\n2.3\nTheory and Practices\n2.3.1 Cable TV systems overview\n2.3.2 CATV system performance and monitoring\n2.3.3 CATV equipment and instrumentation\n2.3.4 Basic Electricity\n2.3.5 Coaxial cable handling\n2.3.6 TV set up\n2.4\nCustomer service procedures\n2.4.1 Handling and prioritizing service requests\n2.5\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1. Working efficiently and systematically\n3.2. Observing safety precautions\n3.3. Proper handling and scheduling of customer requests and\nservice jobs\n3.4. Proper handling, use and maintenance of tools and equipment\n3.5. Communicating effectively\n3.6. Interpretation of plans and symbols\n3.7. Documentation skills\n4. Resource\nimplications\nThe following resources should be available:\n4.1. Access to CATV headend equipment, OSP equipment and\nassociated devices/facilities\n4.2. Test equipment\n4.3. Work area\n4.4. Service vehicle and traffic safety equipment\n5. Method of\nassessment\n5.1. Direct observation/demonstration with oral questioning\n5.2. Written examinations\n5.3. Third-Party Report\n5.4. Portfolio\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 45\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY :\nIMPLEMENT PREVENTIVE MAINTENANCE OF CATV\nSYSTEM\nUNIT CODE\n:\nMDA311303\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to perform/implement preventive maintenance\nof cable television headend and outside plant.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1 Plan and prepare\nschedules for\nmaintenance\n1.1 Preventive maintenance checks are identified and\ndocumented based on established plan and procedures.\n1.2 Appropriate materials, tools, test instruments and\nequipment are identified and selected based on job\nrequirements.\n1.3 Inventory of spare equipment and materials are\nidentified and listed in accordance with job requirements.\n2 Carry out preventive\nmaintenance\n2.1 Appropriate personal protective equipment (PPE) is\nused in accordance with OHS requirements.\n2.2 Scheduled preventive maintenance activities are\nstrictly followed and implemented as per plan.\n2.3 Identified equipment and accessories that will cause\npotential problems are scheduled for repair and/or\nreplacement.\n2.4 Inventory of spare equipment and materials are\nmaintained in accordance with established industry\npractices.\n2.5 Unusual problems encountered are noted and referred\nto concerned personnel for appropriate action.\n3 Prepare preventive\nmaintenance report\n3.1 Preventive maintenance log book is properly\naccomplished.\n3.2 Inventory stock levels are recorded in the stock cards as\nper company policy.\n3.3 Recommendations for preventive maintenance are\nprepared and referred to concerned personnel.\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 46\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. preventive\nmaintenance\nchecks\nPreventive maintenance checks may include:\nHEADEND:\n1.1\nMechanical\n1.1.1. air-conditioning units\n1.1.2. emergency generator\n1.1.3. antenna tower structures\n1.1.4. building structures\n1.1.5. facility grounding and bonding\n1.1.6. lightning arresters\n1.1.7. satellite dish structures\n1.2\nElectrical/Electronics\n1.2.1. signal processing equipment\n1.2.2. satellite receivers\n1.2.3. modulators\n1.2.4. systems converters\n1.2.5. automatic voltage regulators (AVR)\n1.2.6. antenna pre-amps, LNB/LNA and downleads\n1.2.7. equipment interconnecting cables\n1.2.8. electrical wirings and lightings\n1.2.9. security alarm systems (optional)\nOUTSIDE PLANT:\n1.1\nMechanical\n1.1.1. equipment attachments\n1.1.2. cable attachments\n1.1.3. guying and bonding\n1.1.4. connectorization\n1.2\nElectrical/electronics\n1.2.1. power supplies\n1.2.2. active and passive devices\n1.2.3. grounding\n\n2. spare equipment\nand materials\nThis may include:\n2.1\nEquipment\n2.1.1. agile modulator\n2.1.2. agile demodulator\n2.1.3. satellite receiver\n2.1.4. signal processor\n2.1.5. super heterodyne processor\n2.1.6. low-noise block down converter (LNB)\n2.1.7. power divider\n2.1.8. AVR\n2.2\nMaterials\n2.2.1. RG-6 coaxial cable\n2.2.2. connectors\n2.2.3. hardware, supplies and spare parts\n2.2.4. heat shrink\n2.2.5. silicon gel\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 47\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n3. PPE\nPPE may include:\n3.1\nsafety belt\n3.2\nrubber gloves\n3.3\nsafety shoes\n3.4\nsafety ladder\n3.5\nhard hat\n3.6\nsafety goggles\n\n4. preventive\nmaintenance\nactivities\nActivities may include:\n4.1\nPest control activities (insects, rodents, birds, termites)\n4.2\nGrass trimming/cutting\n4.3\nTree branch trimming\n4.4\nCleaning/sweeping/vacuum-cleaning of floors and equipment\nsurfaces and air-con filters\n4.5\nLubrication of satellite dish mechanism and emergency\ngenerator\n4.6\nAnti-corrosion on grounding facilities\n4.7\nAdjustments of output levels of processors, modulators, and\nsatellite receivers\n4.8\nCheck standby power supplies for the following:\n4.8.1. Corrosion on battery terminals and power-supply housing\n4.8.2. Float and charging voltage of standby power supplies\n4.8.3. Open-circuit voltage of each standby battery (difference with\neach battery in the series should not be more than 0.5 VDC\nand each battery should not be less than 10.5 VDC); replace\nbatteries if more than 0.5 VDC difference\n4.8.4. Physical condition of AC capacitor [(oil leaks and deformed\nappearance) CAUTION: Beware of high voltages on the AC\ncapacitor]; recommend replacement of leaky capacitors.\n4.9 Signal test and voltage check of trunk amplifiers and line-\nextender amplifiers\n\n5. potential\nproblems\nPotential problems may include:\nHeadend:\n5.1 tree branches blocking satellite signal path\n5.2 corroded/rusty antenna structure\n5.3 loose antenna guy wires\n5.4 eroded/loose antenna foundation\n5.5 warped or dirty satellite dish\n5.6 bird droppings on satellite dish\n5.7 bird’s nest on feed-horn throat or harness\n5.8 leaking roofs\n5.9 flooding on floor of equipment room\nOSP:\n5.10 broken lashing wire\n5.11 tree branches in contact with cables\n5.12 dirty equipment\n5.13 corroded structures\n5.14 loose antenna structure\n5.15 sagging power lines and/or communication cables\n5.16 loose messenger wires\n\n--- PDF PAGE 50 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 48\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n6. unusual problems\nUnusual problems may include:\n6.1 conflict with other parties:\n6.1.1. government national and local regulations\n6.1.2. owner of subject vegetation that needs to be trimmed\n6.1.3. installation of other utility companies affecting the\nCATV cable lines\n6.2 accidents and unforeseen incidents\n6.3 Situations arising from poor peace and order conditions\n6.4 Poles that needs to be replaced or relocated\n7. concerned\npersonnel\nThis may include:\n7.1 supervisors and/or owner of CATV facilities\n7.2 town/barangay officials\n7.3 homeowner association officials\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 49\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Complied with job requirements and safety procedures at all times\nduring preventive maintenance implementation\n1.2. Implemented and strictly followed schedule of preventive\nmaintenance activities as per plan\n1.3.\nCommunicated and worked with relevant personnel\n2. Underpinning\nknowledge and\nattitude\n\nThe candidate must be able to demonstrate knowledge on the following:\n2.1\nSafety Practices\n2.1.1\nWork safety requirements\n2.1.2\nProper use of tools and equipment\n2.2\nMaterials, Tools and Equipment:\n2.2.1\nUses and Specifications\n2.2.2 Identification of appropriate tools, equipment; and devices\n2.3\nTheory and Practices\n2.3.1\nPreventive maintenance concepts and procedures\n2.3.2\nSystem sweeping\n2.3.3\nCATV Headend technology\n2.3.3.1\nSignal sources\n2.3.3.2\nSignal processing\n2.3.3.3\nSignal mixing\n2.3.3.4\nFacility grounding\n2.3.3.5\nAir-conditioning system\n2.3.3.6\nPower sources\n2.3.4\nCATV Outside Plant\n2.3.4.1\nDistribution cables\n2.3.4.2\nActive devices\n2.3.4.3\nPassive devices\n2.3.4.4\nPole hardware\n2.3.4.5\nGrounding and bonding\n2.3.4.6\nSystem alignment and balancing\n2.4\nDesirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1.\nWorking efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling, use and maintenance of tools and equipment\n3.4.\nAnalytical skills\n3.5.\nCommunicate effectively\n3.6.\ndocumentation skills\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nTools, test instruments, equipment, materials and PPE\n4.2.\nWork area\n4.3.\nMaintenance log\n4.4.\nReference/Historical data (for work area or simulated CATV\nsystem)\n4.5.\nTechnical manuals (optional)\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nThird Party Report\n5.3.\nPortfolio\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a simulated\nworkplace setting\n6.2.\nAssessment shall be undertaken either individually or part of team\nunder limited supervision\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 50\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY :\nPERFORM CATV SYSTEM TROUBLESHOOTING\nAND REPAIR\nUNIT CODE\n:\nMDA311304\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to perform corrective maintenance for CATV\nsystems which includes scheduling of works, analyzing\nand identifying trouble/defect and implementing\nappropriate repair or correction.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1 Receive and\nacknowledge service-\nrequest job orders\n1.1 Sort out the received job orders, arrange and plan\neffective/efficient route to implement the required job.\n1.2 Service requests are prioritized according to urgency of\nrequest and volume of complaints per service area.\n1.3 Necessary equipment, tools and materials are\nrequested from stock room in accordance with company\npolicies and procedures.\n2 Access location of\nproblem and rectify\nfaults\n2.1 Where necessary, signal-strength measurements are\nmade to locate trouble source.\n2.2 Subject trouble/defect is analyzed, identified and\nappropriate repair or correction is implemented in\naccordance with good engineering practices.\n2.3 Appropriate PPE are selected and used in the\nperformance of the job order.\n2.4 Work is completed in accordance with safety procedures\nfor both subscriber and service personnel.\n2.5 Where necessary, additional information on trouble is\nrequested from subscriber.\n2.6 Work/Repairs performed are documented and\ntested/verified with subscriber/s concerned and signed by\nboth parties.\n2.7 Unusual situations/problems encountered are noted\nand reported to concerned personnel.\n3 Perform post-service\nprocedures per\ncompany policy\n3.1 At the end of the day, all accomplished job orders are\nsummarized on the daily job accomplishment report form\nand submitted to technical supervisor/office manager.\n3.2 Unused/pulled-out equipment and/or materials are\ndocumented and returned to the stock man for\nacknowledgment.\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 51\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Necessary\nequipment, tools\nand materials\nMay include but not limited to:\n1.1 Field intensity meter\n1.2 Digital voltmeter\n1.3 TV receiver/monitor\n1.4 Set of hand tools\n1.4.1. long nose pliers\n1.4.2. diagonal side cutter\n1.4.3. screwdrivers\n1.4.4. wrenches\n1.5 Spare active and passive devices\n1.6 Coaxial cables\n1.7 Connectors\n1.8 Weatherproofing materials\n1.9\nSpare power supply module\n2. Trouble/defect\nMay include but is not limited to:\n2.1 Poor or no reception\n2.2 Cross modulation\n2.3 Intermittent reception\n2.4 Poor or no signal on some channels\n2.5 Clear picture but no sound or vice versa\n2.6 Black-and-white picture in color TV set\n\n3. Repair/correction\n3.1 Restoration of electric power to subscriber’s residence\n3.2 Repair/replacement of subscriber’s TV receiver\n3.3 Amplifier alignment\n3.4 Replacement of defective equipment and materials (e. g.,\ncorroded connectors, defective tap-offs, coaxial cable, CATV\nsystem power supply, trunk/feeder amplifier)\n\n4. PPE\n4.1 safety belt\n4.2 rubber gloves\n4.3 safety shoes\n4.4 safety ladder\n4.5 hard hat\n4.6\nsafety goggles\n5. Unusual\nsituations/\nproblems\nUnusual problems may include:\n5.1 Accidents and unforeseen incidents\n5.2 Situations arising from poor peace and order conditions\n5.3 Poles that needs to be replaced or rehabilitated\n5.4 Fallen trees/branches\n5.5 Wild fires\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 52\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Complied with job requirements and safety procedures at all\ntimes during corrective maintenance activity\n1.2. Analyzed, identified and implemented appropriate repair and\nadjustment to troubles/defects accordingly\n1.3.\nDocumented work done and submitted to appropriate\npersonnel.\n2. Underpinning\nknowledge and\nattitude\n\nThe candidate must be able to demonstrate knowledge on the\nfollowing:\n2.1 Safety Practices\n2.1.3 Work safety requirements\n2.1.4 Proper use of tools and equipment\n2.2 Materials, Tools and Equipment:\n2.2.1 Uses and Specifications\n2.2.2 Identification of appropriate tools, equipment; and\ndevices\n2.3 Theory and Practices\n2.3.1 CATV system operation\n2.3.2 Corrective maintenance concepts and procedures\n2.3.3 Troubleshooting and repair techniques\n2.3.4 Test and measurements\n\n2.4 Desirable work values and attitudes (cost conscious, safety\nconscious, quality conscious, etc.)\n3. Underpinning\nskills\n3.1.\nWorking efficiently and systematically\n3.2.\nObserving safety precautions\n3.3.\nProper handling and use of tools, test instruments and\nequipment\n3.4.\nAnalytical skills\n3.5.\nCommunicate effectively\n3.6.\nDocumentation skills\n4. Resource\nimplications\nThe following resources should be available:\n4.1.\nSpare equipment modules\n4.2.\nTools, test instruments, materials and PPE\n4.3.\nWork area\n4.4.\nReference signal and supply voltage level\n5. Method of\nassessment\n5.1.\nDirect observation/demonstration with oral questioning\n5.2.\nThird Party Report\n5.3.\nPortfolio\n6. Context of\nassessment\n6.1.\nCompetency maybe assessed in the workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be undertaken either individually or part of\nteam under limited supervision\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 53\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr"
}
