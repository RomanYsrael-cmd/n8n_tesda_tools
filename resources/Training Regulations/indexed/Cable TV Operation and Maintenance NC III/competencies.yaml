 in accordance with \ncompany procedures. \n4.3. Proper storage of instruments is undertaken \naccording to company procedures.\n\n--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 28  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technical drawings \nTechnical drawings include the following but not \nlimited to: \n \n1.1. Schematic diagrams \n1.2. Charts \n1.3. Block diagrams \n1.4. Lay-out plans \n1.5. Location plans \n1.6. Process and instrumentation diagrams \n1.7. Loop diagrams \n1.8. System Control Diagrams \n2. Dimensions   \nDimensions may include but not limited to: \n \n2.1. Length \n2.2. Width \n2.3. Height \n2.4. Diameter \n2.5. Angles \n3. Symbols \nMay include but not limited to: \n \n3.1. NEC- National Electric Code \n3.2. IEC -International Electrotechnical Commission\n3.3. ASME - American Society of Mechanical \nEngineers \n3.4. IEEE - Institute of Electrical and Electronics \nEngineers \n3.5. ISA - Instrumentation System and Automation \nSociety \n4. Instruments/Equipment \n4.1. Components/dividers \n4.2. Drawing boards \n4.3. Rulers \n4.4. T-square \n4.5. Calculator\n\n--- PDF PAGE 31 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 29  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. 