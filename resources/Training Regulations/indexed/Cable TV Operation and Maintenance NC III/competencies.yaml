        "source_title": "SUPERVISE INSTALLATION OF CATV SYSTEM",
        "source_text": "--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 33  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY  : \nSUPERVISE INSTALLATION OF CATV SYSTEM \nUNIT CODE \n:    MDA311301 \nDESCRIPTOR                    : This unit covers the knowledge, skills and attitudes required \nto supervise installation of CATV systems requiring \nplanning, implementation and evaluation of the job \nperformed.  \n.. \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. \nPlan and prepare \nCATV system \ninstallation  \n \n1.1 Installation procedures are planned and prepared based \non industry standards.  \n1.2 Appropriate personnel are consulted to ensure the work is \ncoordinated effectively with others involved in the work site. \n1.3 Installation plan and materials are checked against \nrequirements \n1.4 Tools, equipment and testing devices needed to carry out \nthe installation work are obtained in accordance with \nestablished procedures and checked for correct operation \nand safety  \n \n2 \nOversee \ninstallation of \nCATV system \n \n \n \n2.1 OH&S policies and procedures are followed  \n2.2 Materials, devices and equipment are checked, segregated \nand arranged for ease of installation.  \n2.3 Installation activities are directed in accordance with the \nplan.  \n2.4 CATV installers are provided with clear instructions on the \nwork to be done and the respective responsibilities \nassociated with the work and others who are involved  \n2.5 CATV installers are guided/mentored and stage check is \nmade at a level appropriate to the stage of development in \naccordance with industry standards \n2.6 Unplanned events or conditions are responded to in \naccordance with established procedures and approval is \nobtained from appropriate personnel before any \ncontingencies are implemented  \n \n3 \nInspect and \ndocument \ncompletion of work \n \n3.1 Final inspections and performance checks are undertaken \nto ensure that the installation procedures of devices, \nmaterials and equipment conforms to industry standards \n3.2 Joint-pole agreement is strictly observed and provisions \nstipulated on the NTC provisional authority is complied \n3.3 Work completion is documented and reported to personnel \nconcerned in accordance with established procedures\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 34  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nRANGE OF VARIABLES \n \n1. Installation \nprocedures \nInstallation procedures may include but not limited to: \n1.1 \nInstallation of pole hardware  \n1.2 \nInstallation and layout of cables  \n1.3 \nInstallation of active and passive devices \n1.4 \nInstallation of subscriber drop lines \n1.5 \nInstallation of devices for SDU and MDU \n1.6\nInstallation of headend equipment and auxiliary devices\n2. Appropriate \nperson \nMay include: \n2.1 System Manager \n2.2 Project engineer \n2.3 Technical supervisor \n2.4 Technicians \n2.5 Installers \n2.6 Other personnel designated by an organization or enterprise \n \n3. Established \nprocedures \nFormal arrangements of an organization, enterprise or statutory \nauthority on task performances. \n4.1 Quality assurance systems incorporating, for example: \n4.1.1 \nSpecifications, requirements and procedures \n4.1.2 \nWork orders / instructions \n4.1.3 \nReporting procedures \n4.1.4 \nImprovement mechanisms \n4.1.5 \nCompliance requirements \n4.1.6 \nSafety management \n4.2 Work clearance systems incorporating, for example: \n4.2.1 \nWork permits \n4.2.2 \nMonitoring and clearance procedures \n4.2.3 \nIsolation procedures \n4.3 Joint Pole Agreement \n4.4 OH&S practices \n4.5 Procedures for operating safety systems, operating plant \nand equipment and reporting work activities \n4.6 Maintenance, modification or supply of relevant schematic \ndrawings and technical data \n4.7 Arrangements for dealing with emergency situations. \n \n4. Unplanned \nevents or \nconditions \nMay include but not limited to: \n5.1 Accidents/incidents  \n5.2 Brownout \n5.3 Equipment breakdown \n5.4 Force majeure e.g., earthquake, fire, typhoon\n\n--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 35  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Planned installation procedures in line with job \nrequirements \n1.2 Prepared/obtained materials, PPE, tools, equipment and \ntesting  devices in line with established procedures \n1.3 Demonstrated compliance with safety regulations \napplicable to worksite operations \n1.4 Directed installation activities in line with established  \nprocedures  and job requirements \n1.5 Performed final inspection to ensure installation of CATV \nsystem meet job requirements \n1.6 Communicated effectively with others to ensure safe and  \neffective work operations \n2. Underpinning \nknowledge and \nattitude \n2.1. Design plan interpretation \n2.2. Appropriate knowledge in procedure on:  \n2.2.1. Installation of pole hardware  \n2.2.2. Installation and layout of cables  \n2.2.3. Installation of active and passive devices \n2.2.4. Installation of subscriber drop lines \n2.2.5. Installation of devices for SDU and MDU \n2.2.6. Installation of headend equipment and auxiliary \ndevices \n2.3. System and processes \n2.3.1. Headend assembly and practices \n2.3.2. Antenna system installation procedures \n2.3.3. Facility grounding and bonding practices \n2.4. Safety \n2.4.1. Work safety requirements and economy of \nmaterials with durability \n2.4.2. Knowledge in 5S application and observation of \nrequired timeframe \n2.5. Materials, Tools and Equipment: Uses and Specifications \n2.5.1. Identification of appropriate tools, equipment and \ndevices \n2.6. Laws and regulations \n2.6.1. NTC Memorandum Circulars \n2.6.2. Local Ordinance \n2.6.3. DTI Regulations \n2.6.4. RA 9292 \n2.6.5. Philippine Electrical code \n2.6.6. Philippine Electronic code\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 36  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \n \n3. Underpinning skills \n3.1. Work efficiency  \n3.2. Communication skills in interpreting service manual and \ndealing with the client \n3.3. Skills in the installation procedures  \n3.4. Supervisory skills \n3.5. Applying work safety practices and time management \n3.6. Interpreting design plan in relation to job requirements\n4. Resource \nimplications \nIncludes but not limited to: \n4.1. Work area \n4.2. Design plan, technical manuals, schematic diagrams \n4.3. Tools, equipment and test instruments and devices \n4.4. Materials \n4.5. Personal protective equipment (PPE) \n4.6. Service vehicle (as needed) \n5. Method of \nassessment \nThe assessor must select at least two of the following \nassessment methods to objectively assess the candidate: \n5.1. Case study/ Written Report \n5.2. Portfolio \n5.3. Third Party Report \n6. Context of \nassessment \n6.1. Competency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. Assessment shall be undertaken either individually or \npart of team under limited supervision\n",
