        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Planned installation procedures in line with job \nrequirements \n1.2 Prepared/obtained materials, PPE, tools, equipment and \ntesting  devices in line with established procedures \n1.3 Demonstrated compliance with safety regulations \napplicable to worksite operations \n1.4 Directed installation activities in line with established  \nprocedures  and job requirements \n1.5 Performed final inspection to ensure installation of CATV \nsystem meet job requirements \n1.6 Communicated effectively with others to ensure safe and  \neffective work operations \n2. Underpinning \nknowledge and \nattitude \n2.1. Design plan interpretation \n2.2. Appropriate knowledge in procedure on:  \n2.2.1. Installation of pole hardware  \n2.2.2. Installation and layout of cables  \n2.2.3. Installation of active and passive devices \n2.2.4. Installation of subscriber drop lines \n2.2.5. Installation of devices for SDU and MDU \n2.2.6. Installation of headend equipment and auxiliary \ndevices \n2.3. System and processes \n2.3.1. Headend assembly and practices \n2.3.2. Antenna system installation procedures \n2.3.3. Facility grounding and bonding practices \n2.4. Safety \n2.4.1. Work safety requirements and economy of \nmaterials with durability \n2.4.2. Knowledge in 5S application and observation of \nrequired timeframe \n2.5. Materials, Tools and Equipment: Uses and Specifications \n2.5.1. Identification of appropriate tools, equipment and \ndevices \n2.6. Laws and regulations \n2.6.1. NTC Memorandum Circulars \n2.6.2. Local Ordinance \n2.6.3. DTI Regulations \n2.6.4. RA 9292 \n2.6.5. Philippine Electrical code \n2.6.6. Philippine Electronic code\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 36  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \n \n3. Underpinning skills \n3.1. Work efficiency  \n3.2. Communication skills in interpreting service manual and \ndealing with the client \n3.3. Skills in the installation procedures  \n3.4. Supervisory skills \n3.5. Applying work safety practices and time management \n3.6. Interpreting design plan in relation to job requirements\n4. Resource \nimplications \nIncludes but not limited to: \n4.1. Work area \n4.2. Design plan, technical manuals, schematic diagrams \n4.3. Tools, equipment and test instruments and devices \n4.4. Materials \n4.5. Personal protective equipment (PPE) \n4.6. Service vehicle (as needed) \n5. Method of \nassessment \nThe assessor must select at least two of the following \nassessment methods to objectively assess the candidate: \n5.1. Case study/ Written Report \n5.2. Portfolio \n5.3. Third Party Report \n6. Context of \nassessment \n6.1. Competency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. Assessment shall be undertaken either individually or \npart of team under limited supervision",
