        "source_title": "PERFORM CATV SYSTEM TROUBLESHOOTING AND REPAIR",
        "source_text": "--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 50  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nUNIT OF COMPETENCY  : \nPERFORM CATV SYSTEM TROUBLESHOOTING \nAND REPAIR \nUNIT CODE \n: \nMDA311304 \nDESCRIPTOR                    : \nThis unit covers the knowledge, skills and attitudes \nrequired to perform corrective maintenance for CATV \nsystems which includes scheduling of works, analyzing \nand identifying trouble/defect and implementing \nappropriate repair or correction. \n \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1 Receive and \nacknowledge service-\nrequest job orders \n1.1 Sort out the received job orders, arrange and plan \neffective/efficient route to implement the required job. \n1.2 Service requests are prioritized according to urgency of \nrequest and volume of complaints per service area. \n1.3 Necessary equipment, tools and materials are \nrequested from stock room in accordance with company \npolicies and procedures.  \n2 Access location of \nproblem and rectify \nfaults  \n2.1 Where necessary, signal-strength measurements are \nmade to locate trouble source. \n2.2 Subject trouble/defect is analyzed, identified and \nappropriate repair or correction is implemented in \naccordance with good engineering practices. \n2.3 Appropriate PPE are selected and used in the \nperformance of the job order. \n2.4 Work is completed in accordance with safety procedures \nfor both subscriber and service personnel.  \n2.5 Where necessary, additional information on trouble is \nrequested from subscriber. \n2.6 Work/Repairs performed are documented and \ntested/verified with subscriber/s concerned and signed by \nboth parties.    \n2.7 Unusual situations/problems encountered are noted \nand reported to concerned personnel. \n3 Perform post-service \nprocedures per \ncompany policy  \n3.1 At the end of the day, all accomplished job orders are \nsummarized on the daily job accomplishment report form \nand submitted to technical supervisor/office manager. \n3.2 Unused/pulled-out equipment and/or materials are \ndocumented and returned to the stock man for \nacknowledgment.\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 51  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Necessary \nequipment, tools \nand materials \nMay include but not limited to: \n1.1 Field intensity meter \n1.2 Digital voltmeter \n1.3 TV receiver/monitor \n1.4 Set of hand tools \n1.4.1. long nose pliers \n1.4.2. diagonal side cutter \n1.4.3. screwdrivers \n1.4.4. wrenches \n1.5 Spare active and passive devices \n1.6 Coaxial cables \n1.7 Connectors \n1.8 Weatherproofing materials \n1.9\nSpare power supply module\n2. Trouble/defect  \nMay include but is not limited to: \n2.1 Poor or no reception \n2.2 Cross modulation \n2.3 Intermittent reception \n2.4 Poor or no signal on some channels \n2.5 Clear picture but no sound or vice versa \n2.6 Black-and-white picture in color TV set \n \n3. Repair/correction \n3.1 Restoration of electric power to subscriber’s residence \n3.2 Repair/replacement of subscriber’s TV receiver \n3.3 Amplifier alignment \n3.4 Replacement of defective equipment and materials (e. g., \ncorroded connectors, defective tap-offs, coaxial cable, CATV \nsystem power supply, trunk/feeder amplifier) \n \n4. PPE \n4.1 safety belt \n4.2 rubber gloves \n4.3 safety shoes \n4.4 safety ladder \n4.5 hard hat \n4.6\nsafety goggles\n5. Unusual \nsituations/ \nproblems \nUnusual problems may include: \n5.1 Accidents and unforeseen incidents \n5.2 Situations arising from poor peace and order conditions \n5.3 Poles that needs to be replaced or rehabilitated \n5.4 Fallen trees/branches \n5.5 Wild fires\n\n--- PDF PAGE 54 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III  \n          Promulgated     December 2007            Page 52  \nhttp://www.tesda.gov.ph/downloads/default.asp                                                                / secjr \n \n \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Complied with job requirements and safety procedures at all \ntimes during corrective maintenance activity \n1.2. Analyzed, identified and implemented appropriate repair and \nadjustment to troubles/defects accordingly \n1.3. \nDocumented work done and submitted to appropriate \npersonnel. \n2. Underpinning \nknowledge and \nattitude \n \n \n \n \nThe candidate must be able to demonstrate knowledge on the \nfollowing: \n2.1 Safety Practices \n2.1.3 Work safety requirements \n2.1.4 Proper use of tools and equipment  \n2.2 Materials, Tools and Equipment:  \n2.2.1 Uses and Specifications \n2.2.2 Identification of appropriate tools, equipment; and \ndevices \n2.3 Theory and Practices \n2.3.1 CATV system operation \n2.3.2 Corrective maintenance concepts and procedures \n2.3.3 Troubleshooting and repair techniques \n2.3.4 Test and measurements \n \n2.4 Desirable work values and attitudes (cost conscious, safety \nconscious, quality conscious, etc.) \n3. Underpinning \nskills \n3.1. \nWorking efficiently and systematically \n3.2. \nObserving safety precautions  \n3.3. \nProper handling and use of tools, test instruments and \nequipment \n3.4. \nAnalytical skills \n3.5. \nCommunicate effectively \n3.6.\nDocumentation skills\n4. Resource \nimplications \nThe following resources should be available: \n4.1. \nSpare equipment modules \n4.2. \nTools, test instruments, materials and PPE  \n4.3. \nWork area  \n4.4. \nReference signal and supply voltage level \n5. Method of \nassessment \n5.1. \nDirect observation/demonstration with oral questioning  \n5.2. \nThird Party Report \n5.3.\nPortfolio\n6. Context of \nassessment \n6.1. \nCompetency maybe assessed in the workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be undertaken either individually or part of \nteam under limited supervision\n",
