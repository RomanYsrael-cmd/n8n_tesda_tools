        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1.\nRelevant equipment and operational\nprocesses\n2.2.2.\nEnterprise goals, targets and measures\n2.2.3.\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4.\nPrinciples of decision making strategies\nand techniques\n2.2.5.\nEnterprise information systems and data\ncollation\n2.2.6.\nIndustry codes and standards\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n\n--- PDF PAGE 16 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 14\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context for\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 17 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 15\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
        },
        "source_text": "500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to determine\nand resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1. Variances are identified from normal operating\nparameters; and product quality\n1.2. Extent, cause and nature of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3. Problems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1. Possible causes are identified based on\nexperience and the use of problem solving tools /\nanalytical techniques.\n2.2. Possible cause statements are developed based\non findings\n2.3. Fundamental causes are identified per results of\ninvestigation conducted\n3. Determine corrective\naction\n3.1. All possible options are considered for resolution\nof the problem\n3.2. Strengths and weaknesses of possible options\nare considered\n3.3. Corrective actions are determined to resolve the\nproblem and possible future causes\n3.4. Action plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and operating\nprocedures\n4. Provide\nrecommendation/s to\nmanager\n4.1. Report on recommendations are prepared\naccording to procedures\n4.2. Recommendations are presented to appropriate\npersonnel.\n4.3. Recommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 12\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 13\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1.\nRelevant equipment and operational\nprocesses\n2.2.2.\nEnterprise goals, targets and measures\n2.2.3.\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4.\nPrinciples of decision making strategies\nand techniques\n2.2.5.\nEnterprise information systems and data\ncollation\n2.2.6.\nIndustry codes and standards\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n\n--- PDF PAGE 16 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 14\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context for\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 17 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 15\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
