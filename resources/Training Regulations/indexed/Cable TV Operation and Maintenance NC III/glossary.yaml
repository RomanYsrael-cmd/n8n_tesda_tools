    {
      "term": "SECTOR SPECIFIC",
      "definition": "1. Amplifier – an electronic device used to increase the strength of a signal. 2. Audio/visual equipment - includes televisions, radios, monitors, cameras, closed circuit television, mono and stereo sound systems, gaming machines, electronic display panels, cassette recorders, video cassette recorders, CDROM players, sound and video duplication equipment, digital versatile discs, professional and domestic speaker systems, mixer desks. 3. Bridger amplifier – a device which extracts a portion of the signal from the trunk, amplifies it to a higher level, and feeds it to the distribution system. 4. Cable – is used for the distribution of television signals from the headend to the subscribers. The nominal characteristic impedance used in CATV system must be 75- ohms. 5. CATV – any facility that, in whole or in part, receives directly or indirectly over the air, and amplifies or otherwise modifies (improves) the signals transmitting programs broadcast by one or more television, satellite or radio stations and distributes such signals by wire or cable to subscribing members of the public who pay for such service or services. 6. Component - That portion of a unit of equipment, which has been designed as a discrete unit and that can be identified as such. 7. Connectorization – proper preparation of cable for installation of appropriate type of connectors. 8. Directional couplers – is a device used to divide the power unequally into two paths. 9. Drop cable – a small-diameter cable leading from the tap-off in the cable plant to the subscribers’ TV receivers. A drop cable used by the CATV system should be either RG- 59 or RG-6, 75-ohms coaxial cable (foam). 10. Environment - The area surrounding the work site which can be directly or indirectly affected by occurrences at the work site. It includes the atmosphere, soils, drains, underground water tables, and the ecosystem. Protection of the environment would require the proper disposal of waste materials, restriction of burning off, the correct handling of toxic substances, the containment of CFCs and the like. 11. Established procedures - Formal arrangements of an organization, enterprise or statutory authority of how work is to be done. 12. Hazardous materials - Flammable gases and vapors and combustible dusts. 13. Headend – is the main site at which all the signals from the various program sources are received, assembled, processed and combined for transmission through the distribution network. It is the originating point for all services carried on a cable television system 14. Line extender amplifier – extends further the feederline from the trunk bridger."
    },
    {
      "term": "TRAINING REGULATIONS",
      "definition": "CATV OPERATION & MAINTENANCE NC III http://www.tesda.gov.ph/downloads/default.asp / secjr 15. Modifications - To make changes to the physical parameters or operational function of a device, component or piece of equipment or apparatus. 16. Notification (notified) - Can include verbal, written, electronic or recorded information at completion of work which may be required to be completed in accordance with established procedures. 17. OH&S policies and procedures - Arrangements of an organization or enterprise to meet their legal and ethical obligations of ensuring the workplace is safe and without risk to health. 18. Outside Plant (OSP) – is a part of CATV system that provides for the distribution of television signals from the headend to the paying subscribers. 19. Requirements - That to which equipment and procedures and their outcomes must conform and includes statutory obligations and regulations and standards called-up by legislation or regulations. 20. Servicing - Undertaking routine inspection, repair and maintenance of circuits, systems or apparatus. Maintaining, fault finding and repair of equipment, plant and machinery. 21. Splitter – is a passive device used to divide the power equally into two path. 22. Standards - Technical documents, which set out specifications and other criteria for equipment, materials, and methods to ensure them consistently, perform as intended. 23. Subscriber – a person who pays a fee for cable services. 24. Subscriber terminal – the cable television system terminal to which a subscriber’s equipment is connected. 25. System - A group or combination of inter-related, inter-dependent or interlocking elements forming a collective entity. Includes circuits, apparatus, equipment and the like. 26. Tap-off – is a device that extracts a small portion of the signal from the feeder cable and provides signal to the subscriber’s TV set. 27. Termination - The act by means of which an electrical connection to an apparatus is established; specifically a prepared joint or connection between a cable, cord or conductor and a point in an electrical circuit such as a terminal or connection point. Such terminations include soldering, crimping, clamping, wire wrapping, insulation piercing/compression. 28. Testing devices - Devices and instruments used to ensure safety requirements and operational functions are met, and to diagnose faults in apparatus, circuits or systems. 29. Trunk amplifier – a low distortion amplifier that amplifies RF signals for long distance transport."
