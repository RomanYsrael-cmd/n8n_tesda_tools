  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title:\nCATV Operation & Maintenance NC Level: NC III\n\nNominal Training Duration:\n36 hrs – Basic Competencies\n\n44 hrs – Common Competencies\n\n612 hrs – Core Competencies\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\nCATV Technician, in accordance with industry standards. It covers the basic & common\ncompetencies in addition to the core competencies such as commissioning consumer\nelectronic products and systems, developing servicing system for consumer electronic\nproducts and training service technicians. The nominal duration of 176 hours covers the\nrequired units at Cable Television Operation & Maintenance NC III. TVET providers can\nhowever, offer a longer, ladderized course covering both NC II and NC III basic, common\nand core units.\n\nBASIC COMPETENCIES\n36 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n\n2.4 Supervise team\nperformance\n\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 56 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 54\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance\nrelevant technology\n\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n44 hrs\nNote:\nThose who have completed the course on CATV Installation NC II or have acquired the\nCATV Installation NC II qualification can skip this portion on common competencies\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1 Apply Quality\nStandards\n1.1 Check materials and\nreplace faulty ones in\naccordance with\nworkplace standards and\nrequirements\n1.2 Carry out work\nassignments in\naccordance with standard\noperating procedures\n1.3 Check completed work\nagainst standards and\nspecifications\n1.4 Document and prepare a\nreport on deviations from\nspecific quality standards\n Field trip\n Symposium\n Film showing\n Simulation\n On-the-job\ntraining\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n\n--- PDF PAGE 57 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 55\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n2 Use Hand\nTools\n2.1 Identify tasks to be\nundertaken and the\nappropriate tools to\nperform the task\n2.2 Prepare and check the\nrequired hand tools and\nuse them properly\n2.3 Use appropriate hand\ntools and test equipment\nin accordance with safety\nrules and procedure\n2.4 Perform basic\nmaintenance procedures\non hand tools and test\nequipment\n Lecture /\nDemonstration\n Distance\nlearning\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n Observation and\nquestioning\n\n3 Perform\nMensuration\nand\nCalculation\n3.1 Identify tasks to be\nperformed and the\nappropriate measuring\ninstruments required\n3.2 Perform measurement and\ncalculation tasks\naccording to specifications\nand requirements\n3.3 Perform basic\nmaintenance tasks on\nmeasuring instruments\naccording to established\nrules and procedure\n\n Self- paced/\nmodular\n Lecture/\nDemonstration\n Small group\ndiscussion\n Distance\nlearning\n Written/Oral\nexamination\n Practical\ndemonstration\n\n4 Prepare and\nInterpret\nTechnical\nDrawings\n4.1 Identify and select the\nappropriate technical\ndrawing required\n4.2 Identify symbols and\nInterpret the technical\ndrawing properly\n4.3 Check and validate\ndrawing requirements and\nprepare/make changes on\nelectrical/electronic\nschematics and drawings\n4.4 Explain how to record and\nstore technical drawings,\nequipment and\ninstruments properly\n\n Lecture/\ndemonstration\n Dualized\ntraining\n Distance\nlearning\n Written /oral\n examinations\n Direct\n observation\n Project method\n interview\n\n--- PDF PAGE 58 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 56\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\nCORE COMPETENCIES\n612 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1 Supervise\ninstallation of\nCATV systems\n\n1.1 Plan and prepare CATV\nsystem installation\n1.2 Oversee installation of CATV\nsystem\n1.3 Inspect and document\ncompletion of work\n• Lecture\n• Discussion\n• Demonstration\n• Practicum\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n2 Operate CATV\nSystem\n\n2.1 Identify functions, uses and\nspecifications of equipment,\ntesting instruments, materials\n& tools and PPE needed for\nCATV system operation\n2.2 Monitor signal quality and\nmake adjustments as\nneeded at headend\n2.3 Monitor end-of-line\nperformance of outside plant\n2.4 Monitor CATV system\nperformance\n2.5 Provide quick response to\nsubscribers’ complaints\n• Lecture\n• Discussion\n• Demonstration\n• Practicum\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n3 Implement\npreventive\nmaintenance of\nCATV system\n\n3.1 Identify the tools, equipment,\ntest instruments, materials\nand PPE needed for\nmaintenance.\n3.2 Perform preventive\nmaintenance procedures\n3.3 Document PM activities\n• Lecture\n• Discussion\n• Demonstration\n• Practicum\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n4 Perform CATV\nsystem\ntroubleshooting\nand repair\n\n4.1 Interpret/Analyze service\nrequests and subscriber\ncomplaints\n4.2 Locate and rectify faults at\nheadend\n4.3 Locate and rectify outside-\nplant faults\n4.4 Document repair work done\n• Lecture\n• Discussion\n• Demonstration\n• Practicum\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n5 Commission\nCATV system\n\n5.1 Perform test run of headend\nequipment for each channel\n5.2 Perform adjustments and\nalignments of headend\nsystem output\n5.3 Test-run auxiliary systems\n5.4 Activate OSP power supplies\n5.5 Energize OSP distribution\nsystem\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n\n--- PDF PAGE 59 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 57\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nonly facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire a specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 60 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – CATV OPERATION & MAINTENANCE NC III\n Promulgated December 2007 Page 58\nhttp://www.tesda.gov.ph/downloads/default.asp / secjr\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed Cable TV Installation NCII program or equivalent\n•\ncan communicate either oral or written;\n•\nmust be physically and mentally fit to undergo training\n•\nhigh school graduate or equivalent\n•\nwith basic computer skills; and\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be required\nfrom the trainees by the school or training center delivering the TVET program.\n\n3.4