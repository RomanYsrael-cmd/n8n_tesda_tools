        "source_text": "--- PDF PAGE 31 ---\nTR – CNC Lathe Machine Operation NC II  \n29  \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY :   Write Basic CNC Lathe Machine Program  \nUNIT CODE  \n \n:   MEE 821301 \n \nUNIT DESCRIPTOR  \n: This unit covers the skills required to write basic CNC lathe \n                                              program to drawing specifications. It details the \n                                              requirements for performing simple CNC lathe  \n                                              programming such as facing and straight and contour \n                                              turning, cutting grooves, drilling, boring, and cutting \n                                              threads. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nDetermine job \nrequirements \n \nEdit basic CNC lathe \nmachine programs \n1.1 \n \n1.2 \n \n1.3 \n \n1.4 \n \n1.5 \n \nDrawings are interpreted to produce component to \nspecifications. \nSequence of operation is determined to produce \ncomponent according to specification. \nCutting tools are selected according to the \nrequirements of the process. \nCutting speed and feed rate calculated based on \nworkpiece and cutting tool material. \nProcess / job / adjustment sheets are filled up with \nrelevant machine, tool and raw material data. \n2 \nWrite  basic CNC lathe \nmachine program \n2.1 \n \n \n2.2 \n \n \nCoordinates calculated for simple tool path or basic \nmachining functions based on part or product to be \nproduced. \nProgram written in standard CNC lathe \noperations, code format in accordance with \nstandard operating procedures. \n \n3 \nEdit basic CNC lathe \nmachine programs \n3.1 \n \n3.2 \n \n3.3 \nProgram is simulated and edited according to \nstandard operating procedures. \nProgram is saved according to standard operating \nprocedures. \nProgram is downloaded to the machine according \nto standard operating procedures.(Optional)\n\n--- PDF PAGE 32 ---\nTR – CNC Lathe Machine Operation NC II  \n30  \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.   Drawings \nReading and interpretation \n1.1 Dimensions and symbols \n1.2 Tolerances  \n2.   Cutting Tools \nCutting tools used in lathe operations include: \n2.1 External and internal cutting tools \n2.2 Grooving tools \n2.3 Drilling tools \n2.4   Tapping tools \n2.5   Threading tools \n2.6   Parting - off tool \n3.   Workpiece \nWorkpiece materials used in turning operations \n3.1 Ferrous metals \n3.2   Non-ferrous metals \n3.3   Non – metallic materials \n4.   Lathe Operations \nBasic lathe operations \n4.1   facing (transversal) \n4.2   Straight turning (longitudinal/plain) \n4.3   contour turning (circular, taper) \n4.4   recess, shoulders, grooves, fillets and chamfers,      \n         drilling, boring \n4.5   thread cutting \n4.6   parting-off\n\n--- PDF PAGE 33 ---\nTR – CNC Lathe Machine Operation NC II  \n31  \nEVIDENCE GUIDE \n1. \nCritical aspects \nof evidence  \nAssessment requires evidence that the candidate:   \n1.1 determined job requirements \n1.2 wrote basic CNC lathe machine program \n1.3 edited basic CNC lathe machine programs \n \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1  Drawing interpretation \n2.1.1 Standard drawing scales, symbols and abbreviations \n2.1.2 Orthographic and isometric drawings \n2.1.3  Assembly and detailed drawings \n2.1.4  Interpreting tolerances  \n2.1.5  Geometrical Tolerances (form and position) \n2.1.6  Surface condition (surface finish/texture) \n2.1.7  limits and fits \n \n2.2   Shop mathematics \n2.2.1   Four fundamental operation \n2.2.2   Fractions and decimals \n2.2.3   Percentages and ratios \n2.2.4   Conversion of units (English to metric) \n2.2.5   Pythagorean theorem \n2.2.6   Basic trigonometric function \n \n2.3   Materials and related science \n2.3.1   Classification and mechanical properties of \nengineering materials \n \n2.4   Lathe machine operations  \n2.4.1  Calculation of cutting speed, rpm, feed rate \n2.4.2  Classification/selection of cutting tools and tool  \ngeometry \n2.4.3  Lathe operation processes  \n3. \nUnderpinning \nskills \n3.1   Identification of cutting tools \n3.2   Computation of feed, cutting speed and machine rpm \n3.3   Application of G – codes and M – codes \n4. \nResource \nimplications \nThe following resources must be provided \n4.1  Drawings, sketches or blueprint/ materials \n4.2  Computers and simulation software’s \n5. \nMethod of \nassessment \nCompetency must be assessed through: \n5.1   direct observation with questioning \n5.2   written exam  \n5.3   demonstration (actual programming) \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
