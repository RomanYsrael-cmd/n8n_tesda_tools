ting tools\nWrite basic CNC lathe\nmachine program\nPerform basic CNC lathe\nmachine operations\nCORE\nCOMPETENCIES\nCompetency Map\nMetals and Engineering Sector\nReceive and respond\nto workplace\ncommunication\nLead in workplace\ncommunication\nWork with others\nLead small teams\nSolve problems\nrelated to\nworkplace activities\nParticipate in\nworkplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team and\nindividual\nApply problem-solving\ntechniques in the\nworkplace\nDemonstrate\nwork values\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply safety\npractices\nPerform routine\nhousekeeping\nMeasure workpiece\n(Basic)\nInterpret working\ndrawings and\nsketches\nSelect and cut\nworkshop materials\nPerform shop\ncomputations (Basic)\nPerform preventive\nand corrective\nmaintenance\nPerform shop\ncomputations\n(Advanced)\nPerform shop\ncomputations\n(Intermediate)\nMeasure workpiece\nusing gages and\ncomparators\nMeasure workpiece\nusing angular measuring\ninstruments\nPractice occupational\nhealth and\nsafety procedures\nDevelop and practice\nnegotiation skills\nUse relevant\ntechnologies\nCollect, analyze\nand organize\ninformation\nPlan and\norganize work\nPractice career\nprofessionalism\nUse mathematical\nconcepts and\ntechniques\nPromote\nenvironmental\nprotection\nPractice\nhousekeeping\nprocedures\nTurn workpiece\n(Basic)\nTurn workpiece\n(Intermediate)\nMill workpiece\n(Basic)\nMill workpiece\n(Intermediate)\nGrind workpiece\n(Basic)\nPerform bench work\n(Basic)\nGrind workpiece\n(Complex)\nPerform bench work\n(Complex)\nTurn workpiece\n(Advanced)\nMill workpiece\n(Advanced)\nCNC Lathe Machine Operation NC II\nSet-up CNC lathe\nmachine, work- piece and\ncutting tools\nWrite basic CNC milling\nmachine program\nPerform basic CNC milling\nmachine operations\nSet-up multiple-axis CNC lathe\nmachine, workpiece and cutting\ntools\nWrite advanced CNC\nLathe Machine program\nPerform advanced CNC\nLathe Machine operations\nSet-up multiple-axis CNC milling\nmachine, work-piece and cutting\ntools\nWrite advanced CNC\nMilling machine program\nPerform advanced CNC\nMilling Machine operation\nApply CAD/CAM\nprogram\nCreate drawing using\nCAD software\nPrepare cost estimates\nPrepare cost estimates\n\n--- PDF PAGE 49 ---\nTR – CNC Lathe Machine Operation NC II\n47\nDefinition of Terms\n\nbench work\nthe operations incident to the process of laying out, fitting,\nassembling, etc… when the work is placed on the bench or\nin a bench vise\n\nboring\nis the operation of enlarging a hole by means of an\nadjustable cutting tool with only one cutting edge\n\nchipping\nis the operation of removing/cutting metal using hammer\nand chisel\ncounter boring\nis the operation of enlarging the end of a hole cylindrically\n\ndrilling\nis the operation of producing a circular hole by removing\nsolid metal\n\nfacing\nthe lathe operation of finishing the ends of the work, to\nmake the piece the right length. Also known as squaring\n\ngrinding\nrefers to the removal of material from a workpiece with\ngrinding wheel\n\nlaying out\nterm used to include the marking or scribling of center\npoints, circles, arcs, or straight lines upon metal surfaces,\neither curved or flat, for the guidance of the worker\n\nmilling\nrefers to removal of metal by feeding a workpiece through\nthe periphery of rotating circular cutter\n\nreaming\nis an operation of sizing and finishing a hole by means of a\ncutting tool having several cutting edges. reaming serves to\nmake the hole smoother, straighter, and more accurate\n\nspot-facing\nis the operation of smoothing and squaring the surface\naround a hole\n\ntapping\nis the operation of forming internal threads by means of a\ntool called tap\n\nturning\nrefers to shaping a workpiece by gripping it in a\nworkholding device and rotating it under power against a\nsuitable cutting tool\n\nCNC machining\nrefers to the fabrication of work piece either turning, milling\nor any other machining process with the use of\nComputerized Numerically Controlled machine tools\n\nprogramming\nthe process of coding machining conditions in which\ninformations such as cutter dimensions, cutter movement ,\nprocessing orders, federate or spindle speed all under fixed\nregulation or specified format which refers to the\nworkpiece drawing to instruct Numerically Controlled\nmachine tool\n\nCAD\nComputer Aided Design – the use of graphics-oriented\ncomputer software for designing and drafting applications\n\nCAM\nComputer Aided Manufacturing- computer software that\ngenerates programs for the operation of NC (numerical\ncontrol) machine tools\n\n--- PDF PAGE 50 ---\nTR – CNC Lathe Machine Operation NC II\n48\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nINDUSTRY EXPERTS:\n\nDR. FELICIANO JAPITANA\nChief, MWTD\nMetal Industry Research and Development\nCenter\nEngr. ROGELITO AQUINO\nEngineer III, MSFS\nMetal Industry Research and\nDevelopment Center\nRAMON MARTIN\nCNC Expert\nMetal Industry Research and Development\nCenter\nHECTOR D. MALONZO\nPresident\nHDM Technologies, Inc.\n\nALANO CABANBAN\nVICTORIANO YAP\nSME\nCHARLIE POLICARPIO\nSME\nOSCAR UNAS\nSME\nTIMOTEO INTALAN\nMetalworking Industries Association of the\nPhilippines, Inc.\nANTONIO TERANIA\nMetalworking Industries Association\nof the Philippines, Inc.\nVIRGILIO LANZUELA\nPresident / General Manager\nVL Industech Corporation\nENRIQUE PINGOL\nPAA\n\n--- PDF PAGE 51 ---\nTR – CNC Lathe Machine Operation NC II\n49\n\nTECHNICAL EXPERTS:\n\nCHARLES A. ANTONIO\nCEMMT Trainer\nTTCTCE\nMODESTO A. VELASQUEZ Jr.\nCEMMT Trainer\nTTCTCE\nFERDINAND E. ESTACIO\nSupervising TESD Specialist / Trainer\nNTTA\nRAMON R. SANTIAGO\nCEMMT Trainer\nTTCTCE\nLOREN