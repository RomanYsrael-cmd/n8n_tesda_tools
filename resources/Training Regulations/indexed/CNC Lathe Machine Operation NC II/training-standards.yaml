erformed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 44 ---\nTR – CNC Lathe Machine Operation NC II\n42\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and their educational\nattainment. Other requirements like health and physical requirements are also\nstated. Passing entry written entrance examinations may also be indicated if\nnecessary.\n\n•\nMust be high school graduate\n•\nWith good moral character;\n•\nAble to communicate in writing\n•\nPhysically and mentally fit; and\n•\nMust have knowledge and skills in conventional lathe machine operation and\nbasic computer operation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nCNC LATHE MACHINE OPERATION NC II\n\nRecommended list of tools, equipment and materials for the training of 16\ntrainees for CNC Lathe Machine Operation NC II\n\nEQUIPMENT\nQTY\nDescription\nQTY\nDescription\n8 units\n2-axis CNC Lathe Machine with\ncomplete standard accessories\n1 unit\nOHP/LCD Projector\n1 unit\nPower Hack saw\n\nSUPPLIES AND MATERIALS\n\nQTY\nDescription\nQTY\nDescription\nQTY\nDESCRIPTION\n2 pcs.\nRound Bar CRS\n50mm dia. X 6m\n2 pcs.\nRound bar CRS\n38mm dia x 6m\n2\npcs.\nRound bar CRS\n25.4mm dia x 6m\n2 pcs.\nAluminum bar\n45mm dia. X 5m,T6\n2 pcs.\nAluminum bar 22mm\ndia x 5m, T6\n2\npcs.\nAluminum bar\n30mm dia x 5m, T6\n16\npcs.\n256 mb flash drive\n16\npcs.\nPaint brush 2” width\n1\nbox\nWhiteboard marker\nBlack, Blue and red\ncolor\n10\nkgs.\nRags\n\nTRAINING MATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDESCRIPTION\n8 pcs.\nTeachers Guide\n6 pcs.\nManuals\n16pcs.\nCNC simulation\nsoftware\nReference books\nCatalogs\nBrochures\nModules/ LEs\nCDs/ Video tapes\nHandouts\n\n--- PDF PAGE 45 ---\nTR – CNC Lathe Machine Operation NC II\n43\n\nTOOLS\n\nQTY\nDescription\nQTY\nDescription\nQTY\nDESCRIPTION\n2\nboxes\neach\nCarbide inserts for\naluminum\n- finishing\n- roughing\n- threading\n(internal,externa\nl)\n- parting-off\n- grooving\n-\nboring\n2 sets\neach\nHand taps\n- M5 x .75mm\n- M6 x 1mm\n- M8 x 1.25\n- M10 x 1.5\n- M12 x 1.75\n2 sets\nDrill bits\n1mm – 12 mm\n(.5mm increment)\n2\nboxes\neach\nCarbide inserts for\nSteel\n- finishing\n- roughing\n- threading\n(i