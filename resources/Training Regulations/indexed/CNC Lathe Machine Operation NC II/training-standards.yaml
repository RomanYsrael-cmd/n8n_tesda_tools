    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: CNC LATHE MACHINE OPERATION NC Level: NC II\n\nTraining Duration: 18 Hours (Basic)\n\n138 Hours (Common)\n\n 80 Hours (Core)\n 236 Hours\n\nCourse Description:\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nin CNC Lathe Machine Operation NC II.\nIt covers the competencies required to write basic CNC Lathe program, set-up\nmachine, workpiece and cutting tools and perform basic CNC lathe machine\nOperations.\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion.\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\n team role and\n responsibility in a team.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\n objectives with\n organizational goals.\n3.2 Set and meet work\n priorities.\n3.3 Maintain professional\n growth and development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 41 ---\nTR – CNC Lathe Machine Operation NC II\n39\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\n risks\n4.2 Control hazards and\n risks\n4.3 Maintain occupational\n health and safety\n awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\nworking\ndrawings and\nsketches\n1.1 Interpret technical\ndrawing\n1.2 Prepare freehand\nsketch of parts\n1.3 Interpret details from\nfreehand sketch\n• Lecture\n• Group\nDiscussion/\ninteraction\n\n• Observation\n• Interview\n• Interview/\nQuestioning\n2. Select and cut\n workshop\n materials\n2.1 Determine requirements\n2.2 Select and measure\nmaterials\n2.3 Cut materials\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n3. Perform shop\n computations\n (Basic)\n3.1 Perform four\nfundamental operations\n3.2 Perform basic\ncalculations involving\nfractions and decimals\n3.3 Perform basic\ncalculations involving\npercentages\n3.4 Perform basic\ncalculation involving\nratio and proportion\n3.5 Perform calculations on\nalgebraic expressions\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n4. Measure\nworkpiece\n (Basic)\n4.1 Select and use\nmeasuring instruments\n4.2 Clean and store\nmeasuring\ninstruments\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n--- PDF PAGE 42 ---\nTR – CNC Lathe Machine Operation NC II\n40\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Perform shop\ncomputations\n(Intermediate)\n5.1 Perform calculations\ninvolving triangles\n5.2 Calculate taper\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n6. Measure\nworkpiece\nusing\nangular\nmeasuring\ninstruments\n6.1 Select and use angular\nmeasuring tools.\n6.2 Maintain angular\nmeasuring tools\n6.3 Clean and store\nmeasuring tools\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n7. Perform\npreventive\nand corrective\n maintenance\n7.1 Perform inspection of\nmachine\n7.2 Perform cleaning and\nlubricating of machine\n7.3 Perform minor machine\nrepair and adjustments\n7.4 Maintain hand tools\n• Lecture\n• Demonstration\n• Group\ndiscussion\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Write basic CNC\nlathe machine\nprogram\n1.1 Determine job\n requirements\n1.2 Write Basic CNC Lathe\n machine program\n1.3 Edit Basic CNC Lathe\n machine programs\n• Lecture\n• Group\nDiscussion/\ninteraction\n\n• Observation\n• Interview\n• Interview/\nQuestioning\n2. Set-up CNC\nlathe machine,\nworkpiece and\ncutting tools\n2.1 St-up machine and\n cutting tools\n2.2 Downoad program\n2.3 Set-up workpiece\n2.4 Dry-run workpiece\n2.5 Perform trial cut on\nworkpiece\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n3 Perform basic\nCNC lathe\nmachine\noperations\n\n3.1 Turn workpiece\n3.2 Check and measure\nworkpiece\n\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n--- PDF PAGE 43 ---\nTR – CNC Lathe Machine Operation NC II\n41"
