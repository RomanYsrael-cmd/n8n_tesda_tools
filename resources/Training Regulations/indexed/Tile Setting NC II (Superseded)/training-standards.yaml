      "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Tile Setting Level: NC II\n\nNominal Training Duration: 82 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable work\nattitude of a tile setter. It covers the basic, common and core competencies i.e. lay\nand repair floor and wall tiles, tile corners and curved surfaces.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility in\na team\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 56 ---\nTILE SETTING NC II 55\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain\nprofessional growth\nand development\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain\noccupational health\nand safety\nawareness\n\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 57 ---\nTILE SETTING NC II 56\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and\ninspect materials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n2. Observe\nprocedures,\nspecifications\nand manuals\nof\ninstructions\n2.1 Identify and access\nspecification/\nmanuals\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n3. Perform\nmensuration\nand\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 58 ---\nTILE SETTING NC II 57\n4. Maintain tools\nand\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Sharpen edge and\ntooth cutting tools\n4.4 Store tools and\nequipment\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation of\napplication of\ntasks\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Read / Interpret\nblueprints and plans\n5.2 Perform freehand\n sketching\nLecture\nDemonstration\nPractical\nexercises\nDemonstration and oral\nquestioning\nWritten test\n\n--- PDF PAGE 59 ---\nTILE SETTING NC II 58\nCORE COMPETENCIES\n(40 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lay and repair\nwall and floor\ntiles\n1.1 Plan and prepare for\n tiling works\n1.2 Lay floor tiles\n1.3 Install wall tiles\n1.4 Repair tile works\n• Simulation\n• Self –paced\ninstructions\n• Discussion\n• Practical\nexercises\n\n• Written test\n• Observation\n• Interview\n2. Tile corners\n2.1 Lay / install tile\ninternal corners\n2.2 Lay / install tile\nexternal corners\n• Simulation\n• Self –paced\ninstructions\