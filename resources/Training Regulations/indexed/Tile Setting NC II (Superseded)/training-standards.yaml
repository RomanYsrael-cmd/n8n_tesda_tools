    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Tile Setting NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Tile Setting Level: NC II\n\nNominal Training Duration: 82 Hours\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable work\nattitude of a tile setter. It covers the basic, common and core competencies i.e. lay\nand repair floor and wall tiles, tile corners and curved surfaces.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility in\na team\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 56 ---\nTILE SETTING NC II 55\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain\nprofessional growth\nand development\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain\noccupational health\nand safety\nawareness\n\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 57 ---\nTILE SETTING NC II 56\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and\ninspect materials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n2. Observe\nprocedures,\nspecifications\nand manuals\nof\ninstructions\n2.1 Identify and access\nspecification/\nmanuals\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n3. Perform\nmensuration\nand\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 58 ---\nTILE SETTING NC II 57\n4. Maintain tools\nand\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Sharpen edge and\ntooth cutting tools\n4.4 Store tools and\nequipment\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation of\napplication of\ntasks\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Read / Interpret\nblueprints and plans\n5.2 Perform freehand\n sketching\nLecture\nDemonstration\nPractical\nexercises\nDemonstration and oral\nquestioning\nWritten test\n\n--- PDF PAGE 59 ---\nTILE SETTING NC II 58\nCORE COMPETENCIES\n(40 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lay and repair\nwall and floor\ntiles\n1.1 Plan and prepare for\n tiling works\n1.2 Lay floor tiles\n1.3 Install wall tiles\n1.4 Repair tile works\n• Simulation\n• Self –paced\ninstructions\n• Discussion\n• Practical\nexercises\n\n• Written test\n• Observation\n• Interview\n2. Tile corners\n2.1 Lay / install tile\ninternal corners\n2.2 Lay / install tile\nexternal corners\n• Simulation\n• Self –paced\ninstructions\n• Discussion\n• Practical\nexercises\n\n• Written test\n• Observation\n• Interview\n3. Tile curved\nsurfaces\n3.1 Lay / install tiles on\n curved surfaces\n3.2 Install mosaic tiles on\n curved surfaces\n• Simulation\n• Self –paced\ninstructions\n• Discussion\n• Practical\nexercises\n\n• Observation\n• Interview\n\n--- PDF PAGE 60 ---\nTILE SETTING NC II 59\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET:\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach\nin training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\n--- PDF PAGE 61 ---\nTILE SETTING NC II 60\n• Distance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin the same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• Good moral character\n• Ability to communicate\n• Physically fit and mentally healthy\n• Can perform basic mathematical computation and mensuration\n\n--- PDF PAGE 62 ---\nTILE SETTING NC II 61\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR TILE SETTING NC II\n\n TOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n5 pcs.\nNotched trowel\n5 pcs. Angle grinder\n25\nboxes\nGlazed wall tiles (20\ncm x 20 cm)\n5 pcs.\nTile cutter\n25\nsets\nPPE\n25\nboxes\nVitrified floor tiles (20\ncm x 20 cm)\n25 pcs.\nMetal tape\n\n150\npcs.\nMosaic tiles (12” x 12”)\n5 pcs.\nNipper\n\n30\nkilos\nTile adhesive\n5 pcs.\nPlumb bob\n\n1 bag\nTile plastic spacer\n5 pcs.\nSpirit level\n\n5 pcs.\nCarburandum\n5 pcs.\nTri-square\n\n25 pcs Pencil\n5 pcs.\nPlier\n\n5 kilos\nTile grout\n5 pcs.\nRubber squeegee\n\n25 pcs. Foam\n5 pcs.\nRubber mallet\n\n10 pcs. Tile trim\n\n5 rolls\nNylon string\n\n1 kilo\nCotton rags\n\n5 pcs.\nWater pail\n\n3.5 TRAINING FACILITIES\n\nThe training facility is based on the size of class of 25 students / trainees.\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nContextual Learning\nLaboratory / Lecture Room\n\n40\n40\nLearning Resource\nCenter\n\n20\n20\nTool Room/Storage\n\n10\n10\nWash room\n\n20\n20\nCirculation area\n\n50\n50\nShop room\n\n60\n60\n\nTOTAL AREA\n200\n\n--- PDF PAGE 63 ---\nTILE SETTING NC II 62\n\n3.6 TRAINER’S QUALIFICATION FOR TILE SETTING NC II\n\n• Must have undergone training on Training Methodology II (TM II)\n• Must be a holder of National Certificate Level II or its equivalent\n• Good moral character\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have 1 year industry experience and/or teaching experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 64 ---\nTILE SETTING NC II 63"
