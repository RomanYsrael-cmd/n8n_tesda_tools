rk activity \n \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Observation thru practical demonstration of skills \n5.2 Oral questioning \n5.3 Portfolio \n5.4 Third party report \n \n6.  Context  for \nAssessment \n6.1 Competency may be assessed in the workplace\n",
