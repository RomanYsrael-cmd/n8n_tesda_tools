        "source_title": "TILE CURVED SURFACES",
        "source_text": "--- PDF PAGE 50 ---\nTILE SETTING NC II                                                                                                                                             49 \nUNIT OF COMPETENCY  : \nTILE CURVED SURFACES \nUNIT CODE                       : \nCON713334 \nUNIT DESCRIPTOR          : \nThis unit specifies the knowledge, skills and attitude \nrequired to tile curved surfaces  \nELEMENT \nPERFORMANCE CRITERIA \nItalicized and bold terms are elaborated in the  \nRange of Variables \n \n1. Plan and prepare  for  \n     work  \n1.1 Work instruction is secured and interpreted in line  \n      with job requirements. \n1.2  Safety and quality requirements are identified in line  \n      with Occupational Safety and Health Standards  \n      (OSHS) and company standard operating procedures \n1.3  Material tiles, tools and equipment are identified in  \n       accordance with job requirements. \n \n2.  Tile curved wall and \nfloor surfaces  \n2.1 Level line is set out around the wall by intermediate \nmarking using leveling equipment. \n2.2 Location of tiles is set out to determine balanced \ndesign and cutting requirements, if necessary.  \n2.3 Template is made to form accurate curve line to tiled \nsurface around the wall. \n2.4 Method for installing tiles is determined with \nidentification of location of the first tile. \n2.5 Cement-based adhesive is prepared following \nmanufacturer's specifications. \n2.6 Guide board is installed to level set out and template \ncurve to specifications. \n2.7 Minimum voids are maintained in mortar tile beds and \ntiles are fixed, plumb (wall), and flush. \n2.8 Floor tiles are laid to set out grid with perimeter tiles \nmarked and cut to fit curve wall. \n2.9 Tile grout is mixed with water and applied to joints \naccording to specifications, to provide flush and \nsmooth finish. \n2.10 Tiled surface is polished and cleaned to  \n        specifications and manufacturer’s recommendations.\n\n--- PDF PAGE 51 ---\nTILE SETTING NC II                                                                                                                                             50 \n \n3.  Tile circular volume, \nwall and arches \n3.1 Template is set out, cut, positioned and checked to \nmaintain conformity to tile surface for curve. \n3.2 Guide board is positioned and installed to line to \nmaintain uniform spacing. \n3.3 Tiles are marked and cut, where applicable, installed \ninto place to specifications. \n3.4 Tiles are installed on walls and plumb, maintaining \nlevels and curvature of wall to specifications. \n3.5 Tiles are installed to archways, maintaining line and \ncurvature to specifications. \n3.6 Tile grout is mixed with water and applied to joints of \ntiled surfaces and tiled surface is finished to \nspecifications. \n3.7 Tiled surface is polished and cleaned to  \n       specifications and manufacturer’s recommendations. \n \n4.  Install mosaic tiles on a \ncircular column  \n4.1 Surface is checked from protrusions and from \nplastering imperfections.  \n4.2 Template is prepared for column tiling diameter to \nspecifications. \n4.3 Mortar is applied evenly to the required tiling diameter \nthickness and finished to curve based on prepared \ntemplate specifications. \n4.4 Guide board is positioned and installed to maintain \nlevel line. \n4.5 Mosaic tiles are installed to column maintaining even \nspacing and level finish to specifications. \n4.6 Tile grout is mixed with water and applied to tiled \nsurface and tile surface is finished to specifications. \n4.7 Tiled surface is polished and cleaned to  \n       specifications and manufacturer’s recommendations \n \n5.  Clean up \n5.1 Work area is cleaned as per OSHS requirements \n5.2 Waste and unwanted materials are disposed of  \n      following company standard operating procedure  \n      and OSHS requirements \n5.3 Unused materials are stored / stacked according to  \n      enterprise procedures \n5.4 Tools and equipment are cleaned and maintained  \n      following manufacturer's specifications\n\n--- PDF PAGE 52 ---\nTILE SETTING NC II                                                                                                                                             51 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Job requirements \n1.1 Drawings \n1.2 Specifications \n \n2. Quality requirements  \n2.1 Workplace operations and procedures \n2.2 Quality of materials \n2.3 Control of handling procedures \n2.4 Use and maintenance of equipment  \n2.5 Attention to specifications of work \n \n3. OSHS requirements  \n3.1 Workplace environment and safety \n3.2 Protective clothing and equipment \n3.3 Use of tools and equipment \n3.4 Handling of materials \n3.5 Working platforms and scaffoldings \n3.6 Hazardous materials \n \n4. Material tiles  \nMay include but not limited to: \n4.1 Ceramic tiles \n4.2 Porcelain tiles \n4.3 Mosaic  \n4.4 Tile adhesive  \n4.5 Tile grout \n4.6 Tile trims  \n4.7 End caps / bull nose \n \n5. Tools and equipment \nMay include but not limited to: \n5.1 Tile cutters and scribers \n5.2 Masonry drill bits \n5.3 Measuring tape / rule \n5.4 Trowels \n5.5 Straight edge \n5.6 Spirit level \n5.7 Light hand roller \n5.9 Scrapers \n5.10 Sand paper  \n5.11 Pencil  \n5.12 Scaffolding \n5.13 Steel square \n5.14 String or chalk line\n\n--- PDF PAGE 53 ---\nTILE SETTING NC II                                                                                                                                             52 \n \n6. Leveling equipment \n6.1 Spirit level \n6.2 Water level \n6.3 Plumb bob \n \n7. Surface \nMay include but not limited to: \n7.1 Plasterboard \n7.2 Fiber cement sheet \n7.3 Brickwork \n7.4 Block work \n7.5 Concrete \n7.6 Plastered face \n7.7 Marine plywood \n7.8 Gypsum board \n7.9 Styropor board\n\n--- PDF PAGE 54 ---\nTILE SETTING NC II                                                                                                                                             53 \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to interpret job requirements \n1.2 Demonstrates ability to comply OSHS requirements \n1.3 Demonstrates ability to perform procedures for tiling \ncurved wall and floor surfaces  \n1.4 Demonstrates ability to perform procedures for tiling \ncircular volume, wall and arches \n1.5 Demonstrates ability to perform procedures to install \nmosaic tiles for a circular column \n1.6 Demonstrates ability to follow company standard \noperating procedures \n \n2. Underpinning  \nknowledge  \n2.1 Mensuration and trade Mathematics \n2.2 Occupational Health and ‘Safety Standards requirements \n2.3 Procedures for tiling curved and floor surfaces \n2.4 Procedures for tiling circular volume, wall and arches \n2.5 Procedures for installing mosaic tiles on a circular  \n      column \n2.6 Company standard operating procedures \n2.7 Manufacturer’s recommendations / specifications \n \n3. Underpinning Skills \n3.1 Applying mensuration and trade Mathematics \n3.2 Interpreting plans specifications and drawings \n3.2 Complying OSHS requirements \n3.3 Performing procedures for tiling curved and floor surface \n3.4 Performing procedures for tiling circular volume, wall and \narches \n3.5 Performing procedures for installing mosaic tiles \n3.6 Following company rules and regulations \n3.7 Following manufacturer’s specifications and  \n      recommendations \n \n4. Resource Implications The following resources MUST be provided: \n4.1 Plans and specifications \n4.2 Work area \n4.3 Material, tools and equipment relevant to the activity \n \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Observation of practical skills \n5.2 Oral questioning \n \n6.  Context  for \nAssessment \n6.1 Competency may be assessed in the workplace\n",
