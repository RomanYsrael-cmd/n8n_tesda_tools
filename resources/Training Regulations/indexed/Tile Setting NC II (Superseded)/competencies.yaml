REPAIR WALL AND FLOOR TILES\nUNIT CODE :\nCON713332\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude\nrequired to lay and repair wall and floor tiles.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized and bold terms are elaborated in the\nRange of Variables\n\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured and interpreted in line with\njob requirements\n1.2 Safety and quality requirements are identified in line\nwith Occupational Safety and Health Standards\n(OSHS) and company standard operating procedures\n1.3 Material tiles, tools and equipment are identified in\naccordance with job requirements\n\n2. Lay out tiling job\n2.1 Area(s) to be tiled is checked in line with job\nrequirements\n2.2 Tiles are laid out in line with specifications\n\n3. Install wall tiles\n\n3.1 Cement or cement based adhesive is prepared\n according to manufacturer’s instructions or\n recommendation then applied to tile / wall surface\n3.2 Tiles are prepared and installed with guide /\n batterboard set to level alignment\n3.3 Horizontal joint is checked for straightness and tile\n edges and surface alignment are checked\n3.4 Tiles are fixed to alignment retaining designed pattern\n to specifications\n3.5 Even margins are shown around openings, frames\n and fittings, where applicable\n3.6 Special cut tile is installed to create a square corner in\n accordance with drawings and specifications, where\n applicable\n3.7 Vertical tiles are finished according to plumbness and\n square corner requirements\n3.8 All joints are maintained straight and uniform in width\n considering allowance for tolerance of tile\n3.9 Expansion gaps are maintained following\n specifications\n3.10 Tiled surface is polished and cleaned to\n specifications and manufacturer’s recommendations.\n\n--- PDF PAGE 40 ---\nTILE SETTING NC II 39\n\n4. Cut tiles\n4.1 Tiles are cut according to required specifications\n4.2 Recess hole or curve cut by hand or machine is in\n required tolerance\n4.3 Miter joints are prepared, retaining glazing on miter\n with no chips and uniform in size\n4.4 Special cut tile is prepared in accordance with\n drawings and specifications, where applicable\n4.5 Tile is jolly-edged to form a miter to prevent the\n tile body from being exposed at the joint\n4.6 Safety precautions are applied in line with\n Occupational Safety and Health Standards\n\n5. Grout space between\n tiles\n5.1 Joints are cleaned and prepared for grouting following\n manufacturer's specifications\n5.2 Grout is mixed and applied according to\n manufacturer's specifications\n5.3 Tiles are cleaned and polished to specifications,\n removing all dust from surface and joints\n\n6. Install vertical mosaic\n sheets\n6.1 Paper-faced or mesh-backed mosaics are fixed to\n background with tile adhesive\n6.2 Adjustments are made to ensure spacing is uniform\n and pattern and alignment are maintained\n6.3 Area is finished with mosaics level to line, if\n applicable, surface straight and flat and grout are\n finished to specifications\n\n7. Lay floor tiles\n7.1 Adhesive is selected based on specifications, tile type\n and climatic condition\n7.2 Surface is cleaned from residue and protrusions\n7.3 Adhesive is mixed following manufacturer's\n specifications\n7.4 Tiles are laid to manufacturer's specifications and\n expansion gaps maintained between walls and tiles\n7.5 Grout is mixed and applied to clean joints and surface\n according to manufacturer's specifications\n7.6 Finished tile work is polished and cleaned to\n specifications and manufacturer recommendations\n\n--- PDF PAGE 41 ---\nTILE SETTING NC II 40\n\n8. Tile treads, risers,\n steps and thresholds\n8.1 Risers and steps are calculated and determined\n from concrete steps / stairs\n8.2 Steps are laid out for uniform rise and take even cut\n on both sides\n8.3 Step riser packing or render support is placed, where\n necessary, and riser tiles are installed according to\n alignment\n8.4 Treads are installed in line with the top edge of risers\n within the required tolerance\n8.5 Grout is applied to wet joints and finished flush with\n tiles to a smooth finish.\n8.6 Finished tilework is cleaned and polished and free of\n pitted, chipped, cracked or scratched tile resulting\n from laying operation\n8.9 Tiled surface is polished and cleaned to\n specifications and manufacturer’s recommendations.\n\n9. Repair damaged tile\n work\n9.1 Damaged tiles removal procedure is performed\n following established / recommended practices\n9.2 Old bedding is cleaned and cleared for placement of\n replacement tile\n9.3 Replacement tiles are selected and cut, if\n necessary, following existing pattern and face\n9.4 Tiles are fitted and installed to maintain alignment\n with joints for uniform spacing\n9.5 Grouting is performed and tile face is cleaned from\n dirt and other residues\n9.6 Tiled surface is polished and cleaned to\n specifications and manufacturer’s recommendations.\n\n10. Clean up\n10.1 Work area is cleaned as per OSHS requirements\n10.2 Waste and unwanted materials are disposed of\n following company standard operating procedure\n and OSH and environmental requirements\n10.3 Unused materials are stored / stacked according to\n enterprise procedures\n10.4 Tools and equipment are cleaned and maintained\n following manufacturer's specifications\n\n--- PDF PAGE 42 ---\nTILE SETTING NC II 41\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Job requirements\n\n1.1 Drawings\n1.2 Specifications\n\n2. Quality requirements\n2.1 Condition of tile\n2.2 Quality of prepared surface\n2.3 Quality of materials\n2.4 Setting out procedures\n2.5 Application procedures\n2.6 Specified finish\n2.7 Attention given to specification of work\n2.8 Workplace operations and procedures\n\n3. Occupational Safety and\n Health Standards\n3.1 Protective clothing and equipment\n3.2 Use of tools and equipment\n3.3 Handling of materials\n3.4 hazardous materials\n3.5 Working platforms\n\n4. Tools and equipment\nMay include but not