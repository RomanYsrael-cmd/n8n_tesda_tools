      "source_text": "SECTION 1 HEAVY EQUIPMENT OPERATION (HYDRAULIC EXCAVATOR)"
    },
    {
      "source_text": "The HEAVY EQUIPMENT OPERATION (HYDRAULIC EXCAVATOR) NC II qualification consists of competencies that workers must achieve to enable them to perform tasks such as inspection, basic preventive maintenance, excavating, trenching, leveling, loading and lifting of materials in construction sites or other locations with the use of a hydraulic excavator for both wheel and crawler types."
    },
    {
      "source_text": "This qualification is packaged from the competency map of Construction - Heavy Equipment sub-sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES 400311210 Participate in workplace communication 400311211 400311212 400311213 400311214 400311215 400311216 400311217"
    },
    {
      "source_text": "400311218 Work in a team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and proced Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311202 Interpret technical drawings and plans CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES CON834219 Perform pre and post-operation procedures for hydraulic excavator CON834220 Perform basic preventive maintenance servicing for hydraulic excavator CON834221 Perform productive operation for hydraulic excavator"
    },
    {
