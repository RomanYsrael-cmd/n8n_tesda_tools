      "source_text": "-- PDF PAGE 114 --- HEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019) 109 Glossary of Terms"
    },
    {
      "source_text": "For the purpose of this Competency Standard, the words"
    },
    {
      "source_text": "1. Various attachment Refers to mechanism which is attached to carriage, either permanently or temporarily, to help in proper engagement of the load"
    },
    {
      "source_text": "2. Hydraulic excavator"
    },
    {
      "source_text": "Refers to heavy equipment consisting of a boom, stick, bucket and cab on a rotating platform known as the \"upper structure\". The upper structure sits atop an undercarriage or lower structure with tracks or wheels."
    },
    {
      "source_text": "3. Standard Refers to a degree or level of requirement set by the manufacturer."
    },
    {
      "source_text": "4. Hazards"
    },
    {
      "source_text": "5. Load chart"
    },
    {
      "source_text": "6. Upper structure"
    },
    {
      "source_text": "7. Lower structure"
    },
    {
      "source_text": "8. Computer Literate"
    },
    {
      "source_text": "Refers to situation that poses threat to life, health, property, or environment."
    },
    {
      "source_text": "Refers to schematic or graphic device to indicate the working load limit to be performed by hydraulic excavator."
    },
    {
      "source_text": "Refers to the “house” of hydraulic excavator which includes the operator cab, counterweight, engine, fuel and hydraulic oil tanks. The upper structure attaches to the undercarriage by way of a center pin."
    },
    {
      "source_text": "Refers to the “undercarriage” of hydraulic excavator which includes the blade , tracks, track frame, and final drives."
    },
    {
      "source_text": "Is defined as the knowledge and ability to utilize computers and related technology efficiently, with a range of skills covering levels from elementary use to computer programming and advanced problem solving."
