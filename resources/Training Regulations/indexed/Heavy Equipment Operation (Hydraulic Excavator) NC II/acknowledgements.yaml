    {
      "source_text": "3.2 TRAINING DELIVERY"
    },
    {
      "source_text": "1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be guided by the principles of competency-based TVET."
    },
    {
      "source_text": "a. Course design is based on competency standards set by the industry or recognized industry sector; (Learning system is driven by competencies written to industry standards)"
    },
    {
      "source_text": "b. Training delivery is learner-centered and should accommodate individualized and self-paced learning strategies;"
    },
    {
      "source_text": "c. Training can be done on an actual workplace setting, simulation of a workplace and/or through adoption of modern technology."
    },
    {
      "source_text": "d. Assessment is based in the collection of evidence of the performance of work to the industry required standards;"
    },
    {
      "source_text": "e. Assessment of competency takes the trainee’s knowledge and attitude into account but requires evidence of actual performance of the competency as the primary source of evidence."
    },
    {
      "source_text": "f. Training program allows for recognition of prior learning (RPL) or current competencies;"
    },
    {
      "source_text": "g. Training completion is based on satisfactory performance of all specified competencies."
    },
    {
      "source_text": "2. The competency-based TVET system recognizes various types of delivery modes, both on-and off-the-job as long as the learning is driven by the competency standards specified by the industry. The following training modalities and their variations/components may be adopted singly or in combination with other modalities when designing and delivering training programs:"
    },
    {
      "source_text": "2.1 Institution-Based:"
    },
    {
      "source_text": "Dual Training System (DTS)/Dualized Training Program (DTP) which contain both in-school and in-industry training or fieldwork components. Details can be referred to the Implementing Rules and Regulations of the DTS Law and the TESDA Guidelines on the DTP;"
    },
    {
      "source_text": "Distance learning is a formal education process in which majority of the instruction occurs when the students and instructor are not in the same place. Distance learning may employ correspondence study, audio, video, computer technologies or other modern technology that can be used to facilitate learning and formal and non-formal training. Specific guidelines on this mode shall be issued by the TESDA Secretariat."
    },
    {
      "source_text": "The classroom-based or in-center instruction uses of learner-centered methods as well as laboratory or field-work components."
    },
    {
      "source_text": "-- PDF PAGE 104 --- HEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019) 99 2.1 Enterprise-Based:"
    },
    {
      "source_text": "Formal Apprenticeship – Training within employment involving a contract between an apprentice and an enterprise on an approved apprenticeable occupation."
    },
    {
      "source_text": "Informal Apprenticeship - is based on a training (and working) agreement between an apprentice and a master craftsperson wherein the agreement may be written or oral and the master craftsperson commits to training the apprentice in all the skills relevant to his or her trade over a significant period of time, usually between one and four years, while the apprentice commits to contributing productively to the work of the business. Training is integrated into the production process and apprentices learn by working alongside the experienced craftsperson."
    },
    {
      "source_text": "Enterprise-based Training- where training is implemented within the company in accordance with the requirements of the specific company. Specific guidelines on this mode shall be issued by the TESDA Secretariat."
    },
    {
      "source_text": "2.2 Community-Based – Community-Based – short term programs conducted by non-government organizations (NGOs), LGUs, training centers and other TVET providers which are intended to address the specific needs of a community. Such programs can be conducted in informal settings such as barangay hall, basketball courts, etc. These programs can also be mobile training program (MTP)."
    },
    {
      "source_text": "-- PDF PAGE 105 --- HEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019) 100 3.3 TRAINEE ENTRY REQUIREMENTS"
    },
    {
      "source_text": "Trainees or students who wish to enter this training should possess the following requirements:"
    },
    {
      "source_text": "At least Junior High School Level Completer or an Alternative Learning System (ALS) Certificate of Completion with grade 10 equivalent holder"
    },
    {
      "source_text": "Must possess good communication skills"
    },
    {
      "source_text": "Can perform basic mathematical computation"
    },
    {
      "source_text": "Physically fit"
    },
    {
