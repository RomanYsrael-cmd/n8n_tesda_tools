ctical\nexercises\n• Oral\nevaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\no Reporting requirements to a\nrange of audiences\no Recommendations for\npossible improvements\n• Analysis and comparison of interim\nand final reports’ outcomes\n• Reporting of data findings\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical\nexercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n\n--- PDF PAGE 94 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n89\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7. Practice\nOccupational\nSafety And\nHealth Policies\nAnd Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n• Lecture\n• Group\nDiscussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n Questioning\n1 Hour\n\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety\nmaterials, tools and equipment\n• Handling of safety control\nresources\n\n• Lecture\n• Group\nDiscussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH\nStandards and Principles\n• Performing industry related work\nactivities in accordance with OSH\nStandards\n• Lecture\n• Group\nDiscussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource utilization\n- Discussion on the process how\nEnvironmental Policies coherence\nis achieved\n•