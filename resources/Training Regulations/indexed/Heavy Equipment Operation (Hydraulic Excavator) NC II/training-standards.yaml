 is power on\n• Perform operation of hydraulic\nexcavator components and safety\ndevices\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 100 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n95\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n1.5 Perform post-\n Operation\n procedures\n•\nExplain walk around procedures\nwhile engine is cooling down\n•\nExplain and perform parking and\nshut-down procedures\n•\nExplain how to accomplish\nDETR\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2. Perform basic\npreventive\nmaintenance\nservicing for\nhydraulic\nexcavator\n\n2.1 Perform\n adjustment or\n replacement for\n noted defects\n\n• Explain procedures in performing\nadjustments or replacements for\nnoted defects\n• Explain usage of basic hand tools\nand portable powered tools\n• Perform adjustments or\nreplacements for minor defects\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n24 hours\n2.2 Perform basic\n preventive\n maintenance\n servicing (PMS)\n\n•\nExplain procedures in basic\npreventive maintenance\nservicing\n•\nEnumerate Operator’s\nServiceable parts\n•\nExecute basic preventive\nmaintenance servicing (PMS)\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2.3 Prepare\nequipment\n reports\n\n•\nExplain procedures in\naccomplishing equipment\nreports\n•\nExplain how to accomplish\nequipment reports\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 101 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n96\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Ac