ta\n• Classifying signs, symbols and data\n\n• Discussion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n3.2 Interpret drawings\nand plans\n• Identifying tools, supplies, materials\nand equipment\n• Recognizing components,\nassemblies or objects\n• Identifying dimensions\n• Discussion\n• Demonstration\n• Demonstration\nwith oral\nquestioning\n• Written\nexamination\n2 Hours\n\n4.Perform\nmensurations\nand calculations\n4.1 Select measuring\ninstruments\n\n• Selecting measuring instruments\n• Lecture-\ndemonstration\n• Group\ndiscussion\n• Demonstration\nwith oral\nquestioning\n\n2 Hours\n\n4.2 Carry out\nmeasurements\nand calculations\n\n• Interpreting formulas for volume,\nareas, perimeters of plane and\ngeometric figures\n• Handling of measuring instruments\n\n• Group\ndiscussion\n• Practical Lab\n• Demonstration\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n--- PDF PAGE 98 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n93\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Maintain tools\nand equipment\n5.1 Check condition\nof tools and\nequipment\n\n• Maintaining tools and equipment\n• Handling of tools and equipment\n• Identifying tools and equipment\ndefects\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n5.2 Perform basic\npreventive\nmaintenance\n• Handling of tools and equipment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and equipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 99 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n94\nCORE COMPETENCIES\n (120 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform pre- and\npost-operation\n procedures for\n Hydraulic\nexcavator\n1.1 Perform visual\ncheck\n\n• Select personal protective equipment\n• Select hydraulic excavator capacity\n• Identify and explain operator\nserviceable parts\n• Perform inspection of equipment\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n16 hours\n1.2 Perform “B L O W\nA F” check\n\n• Explain and perform procedures in\nBLOWAF check for engine type\n• Explain and perform procedures in\nchecking battery-operated type\nhydraulic excavator\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n1.3 Perform visual\ncheck for\n upper, lower\nstructure and\nattachments\n• Explain procedures in visual check\nfor upper, lower structure and\nattachments\n• Identify abnormal conditions\n• Perform visual check upper, lower\nstructure and attachments\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1.4 Perform operation\n check\n\n• Explain and perform start-up and\nwarming procedures\n• Explain procedures in conducting\nwalk-around check while the\nhydraulic excavator is power on\n• Perform operation of hydraulic\nexcavator components and safety\ndevices\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 100 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n95\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n1.5 Perform post-\n Operation\n procedures\n•\nExplain walk around procedures\nwhile engine is cooling down\n•\nExplain and perform parking and\nshut-down procedures\n•\nExplain how to accomplish\nDETR\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2. Perform basic\npreventive\nmaintenance\nservicing for\nhydraulic\nexcavator\n\n2.1 Perform\n adjustment or\n replacement for\n noted defects\n\n• Explain procedures in performing\nadjustments or replacements for\nnoted defects\n• Explain usage of basic hand tools\nand portable powered tools\n• Perform adjustments or\nreplacements for minor defects\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n24 hours\n2.2 Perform basic\n preventive\n maintenance\n servicing (PMS)\n\n•\nExplain procedures in basic\npreventive maintenance\nservicing\n•\nEnumerate Operator’s\nServiceable parts\n•\nExecute basic preventive\nmaintenance servicing (PMS)\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2.3 Prepare\nequipment\n reports\n\n•\nExplain procedures in\naccomplishing equipment\nreports\n•\nExplain how to accomplish\nequipment reports\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 101 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n96\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n3. Perform\nproductive\n operation for\n hydraulic\n excavator\n\n3.1 Travel the\nhydraulic\nexcavator\n• Enumerate different road and\nweather conditions\n• Identify potential hazards in work\narea\n• Explain procedures in responding to\nunexpected situations\n• Perform travel operation\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n80 hours\n3.2 Load and unload\nhydraulic\nexcavator to low-\nbed trailer/truck\n• Perform loading and unloading of\nhydraulic excavator to low-bed trailer\n• Explain and perform securing of\nhydraulic excavator\n• Explain and demonstrate verbal\ninstructions and signals\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.3 Perform\nexcavation work\n\n• Explain and perform positioning of\nwork equipment\n• Explain and perform excavation work\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 102 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n97\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\n• Assessment\nMethods\nNominal\nDuration\n\n3.4 Perform loading\noperation\n\n• Explain and perform positioning\nof hydraulic excavator\n• Explain and perform loading\noperation procedures\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.5 Perform lifting\n operation\n• Explain how to determine weight\nand classification of the load\n• Explain how to read and interpret\nload chart\n• Explain and perform lifting\noperation procedures\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.6 Perform operation\nusing various\nattachments\n• Explain usage of various\nattachment\n• Explain and perform operation\nusing various attachment\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 103 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n98"
