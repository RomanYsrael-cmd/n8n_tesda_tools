  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the\nrequirements identified in the relevant unit/s of competency.\n\n4.1.3 Assessment shall cover all the competencies of the qualification with the basic\nand common units integrated or assessed concurrently with the core units of\ncompetency.\n\n4.1.4 The following are qualified to apply for assessment and certification:\n• Graduates of formal, non-formal and informal institutions and enterprise-based\ntraining programs\n• Experienced Workers (wage employed or self-employed)\n\n4.1.5\nFor the renewal of valid or expired National Certificate (NC) in Heavy Equipment\nOperation (Hydraulic Excavator) NC II, the individual/holder will have to undergo\nassessment in the amended TR for Heavy Equipment Operation (Hydraulic\nExcavator) NC II.\n\n4.1.6\nThe industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations: It includes the following:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by industry\n\n--- PDF PAGE 110 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n105\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 111 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n106\nANNEX A\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth policies\nand\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork\npractices\n\nFacilitate\nentrepreneurial\nskills for\nmicro-small-\nmedium\nenterprises\n(MSMEs)\n\nCOMPETENCY MAP - CONSTRUCTION Sector\n(HEAVY EQUIPMENT OPERATION)\n HEAVY EQUIPMENT OPERATION (HYDRAULIC EXCAVATOR) NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 112 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n107\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice\nof social\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth\nProgram,\nPolicies and\nProcedures\nLead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementatio\nn of OSH\nprograms in\nthe workplace\nManage\nimplementatio\nn of\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nPrepare\nconstruction\nmaterials and tools\n\nObserve\nprocedures,\nspecifications and\nmanual of\ninstructions\n\nInterpret technical\ndrawings and plans\nPerform\nmensurations and\ncalculations\n\nMaintain tools and\nequipment\n\nBASIC COMPETENCIES\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 113 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n108\n\nPerform pre and post\noperation procedures for\ntruck mounted crane\n\nPerform basic preventive\nmaintenance servicing\nfor truck mounted crane\n\nPerform productive\noperation for truck\nmounted crane\n\nPerform pre and post\noperation procedures for\nrough terrain crane\n\nPerform basic preventive\nmaintenance servicing\nfor rough terrain crane\n\nPerform productive\noperation for rough\nterrain crane\n\nPerform pre and post\noperation procedures for\ncrawler crane\n\nPerform basic preventive\nmaintenance servicing\nfor crawler crane\n\nPerform productive\noperation for crawler\ncrane\n\nPerform pre and post\noperation procedures for\nforklift\n\nPerform basic preventive\nmaintenance servicing\nfor forklift\n\nPerform productive\noperation for forklift\n\nPerform pre and post\noperation procedures for\ntower crane\n\nPerform basic preventive\nmaintenance servicing\nfor tower crane\nPerform productive\noperation for tower care\n\nPerform pre and post\noperation procedures for\noverhead and gantry\ncrane\nPerform basic preventive\nmaintenance servicing\noverhead and gantry\ncrane\n\nPerform productive\noperation for overhead\nand gantry crane\n\nPerform pre and post\noperation procedures for\nhydraulic excavator\n\nPerform basic preventive\nmaintenance servicing\nfor hydraulic excavator\nPerform productive\noperation for hydraulic\nexcavator\n\nPerform pre and post\noperation procedures for\non-highway dump truck\n(rigid)\nPerform basic preventive\nmaintenance servicing\nfor on-highway dump\ntruck (rigid)\nPerform productive\noperation for on-highway\ndump truck (rigid)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 114 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019) 109\nGlossary of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Various\nattachment\nRefers to mechanism which is attached to carriage, either\npermanently or temporarily, to help in proper engagement of the\nload\n\n2. Hydraulic\nexcavator\n\nRefers\nto heavy\nequipment consisting\nof\na boom,\nstick, bucket and cab on a rotating platform known as the\n\"upper\nstructure\".\nThe\nupper\nstructure\nsits\natop\nan\nundercarriage or lower structure with tracks or wheels.\n\n3. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n\n4. Hazards\n\n5. Load chart\n\n6. Upper structure\n\n7. Lower structure\n\n8. Computer Literate\n\nRefers to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to schematic or graphic device to indicate the working\nload limit to be performed by hydraulic excavator.\n\nRefers to the “house” of hydraulic excavator which includes the\noperator cab, counterweight, engine, fuel and hydraulic oil tanks.\nThe upper structure attaches to the undercarriage by way of a\ncenter pin.\n\nRefers to the “undercarriage” of hydraulic excavator which\nincludes the blade , tracks, track frame, and final drives.\n\nIs defined as the knowledge and ability to utilize computers and\nrelated technology efficiently, with a range of skills covering\nlevels from elementary use to computer programming and\nadvanced problem solving.\n\n--- PDF PAGE 115 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019) 110\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHeavy Equipment Operation (Hydraulic Excavator ) NC II\nQualification Code:\nCONHEO219\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHEO (Hydraulic\nExcavator ) NC II\n2007-20 /\nN/A\n01\nDocument Amended\n\nHEO (Hydraulic\nExcavator ) NC II\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 116 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019) 111\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nREVIEW PANEL\n\nENGR. SEBASTIAN Q. ALAMPAYAN, JR.\nSafety & Training Manager-\nIndustry Expert\nFirst Balfour, Inc.\nParañaque City\nEDUARDO C. EMAS\nTrainer/ Assessor\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\nENGR. CORNELIO D. PADUA\nDepartment Head - Industry Expert\nManila’s Finest Construction, Inc.\nParañaque City\n\nMARY LOU C. URLANDA\nTrainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\n\nJESUS C. SALVACION\nLifting Superintendent\nRoyal Cargo Inc.\nBatangas City /\nRigging Gears Specialist\nAssessment Center Inc.\nChairman/ AC Manager\nROBENSON S. LIM\nManpower Head/ Trainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\n\n--- PDF PAGE 117 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019) 112\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n• Anseca Development Corp.\n Cebu City\n\n• Civic Merchandising Inc.\n Quezon City\n\n• EEI Corporation\n Calamba City\n\n• First Balfour Inc.\n Parañaque City\n\n• J.E. Manalo and Co. Inc.\nPasig City\n\n• M.D.C. Asia Pro\nPas