  "source_text": "SECTION 1 HEAVY EQUIPMENT OPERATION (HYDRAULIC EXCAVATOR)\n\nThe HEAVY EQUIPMENT OPERATION (HYDRAULIC EXCAVATOR) NC II\nqualification consists of competencies that workers must achieve to enable them to perform\ntasks such as inspection, basic preventive maintenance, excavating, trenching, leveling,\nloading and lifting of materials in construction sites or other locations with the use of a\nhydraulic excavator for both wheel and crawler types.\n\nThis qualification is packaged from the competency map of Construction - Heavy\nEquipment sub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\n400311212\n400311213\n400311214\n400311215\n400311216\n400311217\n\n400311218\nWork in a team environment\nSolve/address general workplace problems\nDevelop career and life decisions\nContribute to workplace innovation\nPresent relevant information\nPractice occupational safety and health policies and proced\nExercise efficient and effective sustainable practices in\nthe workplace\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311202\nInterpret technical drawings and plans\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON834219\nPerform pre and post-operation procedures for hydraulic\nexcavator\nCON834220\nPerform basic preventive maintenance servicing for\nhydraulic excavator\nCON834221\nPerform productive operation for hydraulic excavator\n\nA person who has achieved this Qualification is competent to be a –\n\n❑ Hydraulic excavator operator\n\n--- PDF PAGE 7 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n2"
