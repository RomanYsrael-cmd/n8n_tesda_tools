        "source_text": "CON311202\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes in\nanalyzing and interpreting symbols, data and work plan\nbased on the required performance standards.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Analyze signs,\nsymbols and data\n\n1.1 Signs, symbols and\ndata are identified\naccording to job\nspecifications\n1.2 Signs, symbols\nand data are\ndetermined\naccording to site\nregulations\n1.1 Signs and\nsymbols\n1.2 Rules and\nregulations\n\n1.1 Interpreting\nworking drawing\n2 Interpret drawings\nand plans\n2.1 Necessary tools\nand materials are\nidentified according\nto the work plan\n2.2 Supplies and\nmaterials are listed\naccording to\nspecifications\n2.3 Components,\nassemblies or\nobjects are\nrecognized as\nrequired\n2.4 Dimensions are\nidentified as\nappropriate to the\nplan\n2.5 Specification\ndetails are matched\nwith\nexisting/available\nresources and in\nline with job\nrequirements\n\n2.1 Systems of\nmeasurement\n2.2 Linear\nmeasurement\n2.3 Dimension\n2.4 Unit conversion\n\n2.1 Interpreting\ndrawing\n2.2 Matching\nspecification\ndetails with\nexisting\nresources\n\n--- PDF PAGE 48 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n43\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Signs and\nsymbols\nMay include:\n1.1 Speed limit\n1.2 Direction/Road\n1.3 Warnings\n2. Site regulations\nMay include:\n2.1 Instructions\n2.2 Signages\n2.3 Work schedules\n2.4 Work bulletin boards\n2.5 Charts\n2.6 Memos\n2.7 Site Map\n2.8 Emergency response plan\n2.9 Permits\n3 Tools and\nmaterials\nMay include:\n3.1 Rulers\n3.2 Protractor\n3.3 Steel tape\n3.4 Calculator\n3.5 Pencil\n4 Work plan\n\nMay include:\n4.1 Job requirements\n4.2 Installation instructions\n4.3 Components instruction\n\n--- PDF PAGE 49 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n44\n EVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data according\nto work plan and job requirements\n1.2 Identified tools and materials in accordance with job\nrequirements\n1.3 Demonstrated ability to determine job specifications based on\nworking drawing\n2. Resource\nImplications\nThe following resources should be provided:\n1.1 Workplace\n1.2 Drawings and specification relevant to task\n1.3 Materials and instrument relevant to proposed activity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 50 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n45\nUNIT OF COMPETENCY\n:\nPERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n\n:"
