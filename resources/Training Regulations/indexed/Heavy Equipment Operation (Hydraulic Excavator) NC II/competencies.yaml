        "source_text": "400311216\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto identify OSH compliance requirements, prepare OSH\nrequirements for compliance, perform tasks in accordance\nwith relevant OSH policies and procedures\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations,\npolicies and\nprocedures are\nidentified in\naccordance with\nworkplace policies\nand procedures\n1.2 OSH activity non-\nconformities are\nconveyed to\nappropriate\npersonnel\n 1.3 OSH preventive\nand control\nrequirements are\nidentified in\naccordance with\nOSH work policies\nand procedures\n\n1.1. OSH preventive\nand control\nrequirements\n1.2. Hierarchy of\nControls\n1.3. Hazard\nPrevention and\nControl\n1.4. General OSH\nprinciples\n1.5. Work standards\nand procedures\n1.6. Safe handling\nprocedures of\ntools, equipment\nand materials\n1.7. Standard\nemergency plan\nand procedures\nin the workplace\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n\n--- PDF PAGE 31 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n26\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Prepare OSH\nrequirements for\ncompliance\n\n2.1 OSH work activity\nmaterial, tools and\nequipment\nrequirements are\nidentified in\naccordance with\nworkplace policies\nand procedures\n2.2. Required OSH\nmaterials, tools\nand equipment are\nacquired in\naccordance with\nworkplace policies\nand procedures\n2.3. Required OSH\nmaterials, tools\nand equipment are\narranged/ placed in\naccordance with\nOSH work\nstandards\n2.1. Resources\nnecessary to\nexecute hierarchy\nof controls\n2.2. General OSH\nprinciples\n2.3. Work standards\nand procedures\n2.4. Safe handling\nprocedures of\ntools, equipment\nand materials\n2.5. Different OSH\ncontrol measures\n\n2.1. Communication\nskills\n2.2. Estimation skills\n2.3. Interpersonal\nskills\n2.4. Critical thinking\nskills\n2.5. Observation\nskills\n2.6. Material, tool\nand equipment\nidentification\nskills\n\n3. Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n\n3.1 Relevant OSH\nwork procedures\nare identified in\naccordance with\nworkplace policies\nand procedures\n3.2 Work Activities are\nexecuted in\naccordance with\nOSH work\nstandards\n3.3 Non-compliance\nwork activities are\nreported to\nappropriate\npersonnel\n3.1. OSH work\nstandards\n3.2. Industry related\nwork activities\n3.3. General OSH\nprinciples\n3.4. OSH Violations\n Non-compliance\nwork activities\n\n3.1 Communication\nskills\n3.3 Interpersonal\nskills\n3.4 Troubleshooting\nskills\n3.5 Critical thinking\nskills\n3.6 Observation\nskills\n\n--- PDF PAGE 32 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n27\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies\nand Procedures\nMay include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPermit to Operate\n1.6\nPhilippine Occupational Safety and Health Standards\n1.7\nDepartment Order No. 13 (Construction Safety and\nHealth)\n1.8\nECC regulations\n2. Appropriate Personnel May include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n3. OSH Preventive and\nControl Requirements\nMay include:\n3.1 Resources needed for removing hazard effectively\n3.2 Resources needed for substitution or replacement\n3.3 Resources needed to establishing engineering controls\n3.4 Resources needed for enforcing administrative controls\n3.5 Personal Protective equipment\n4. Non OSH-Compliance\nWork Activities\nMay include non-compliance or observance of the following\nsafety measures:\n4.1 Violations that may lead to serious physical harm or\ndeath\n4.2 Fall Protection\n4.3 Hazard Communication\n4.4 Respiratory Protection\n4.5 Power Industrial Trucks\n4.6 Lockout/Tag-out\n4.7 Working at heights (use of ladder, scaffolding)\n4.8 Electrical Wiring Methods\n4.9 Machine Guarding\n4.10 Electrical General Requirements\n4.11 Asbestos work requirements\n4.12 Excavations work requirements\n\n--- PDF PAGE 33 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n28\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Convey OSH work non-conformities to appropriate\npersonnel\n1.2. Identify OSH preventive and control requirements in\naccordance with OSH work policies and procedures\n1.3. Identify OSH work activity material, tools and\nequipment requirements in accordance with\nworkplace policies and procedures\n1.4. Arrange/Place required OSH materials, tools and\nequipment in accordance with OSH work standards\n1.5. Execute work activities in accordance with OSH\nwork standards\n1.6. Report OSH activity non-compliance work activities\nto appropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary\nfor the activity\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 34 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n29\nUNIT OF COMPETENCY :\nEXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE\nPRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:"
