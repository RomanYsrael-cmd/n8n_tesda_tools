        "source_text": "400311217\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers knowledge, skills and attitude to identify the\nefficiency and effectiveness of resource utilization, determine\ncauses of inefficiency and/or ineffectiveness of resource\nutilization and Convey inefficient and ineffective environmental\npractices\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n\n1.1 Required resource\nutilization in the\nworkplace is\nmeasured using\nappropriate\ntechniques\n1.2 Data are recorded in\naccordance with\nworkplace protocol\n1.3 Recorded data are\ncompared to\ndetermine the\nefficiency and\neffectiveness of\nresource utilization\naccording to\nestablished\nenvironmental\nwork procedures\n1.1. Importance of\nEnvironmental\nLiteracy\n1.2. Environmental\nWork\nProcedures\n1.3. Waste\nMinimization\n1.4. Efficient Energy\nConsumptions\n1.1 Recording\nSkills\n1.2 Writing Skills\n1.3 Innovation\nSkills\n\n2. Determine\ncauses of\ninefficiency\nand/or\nineffectiveness of\nresource\nutilization\n2.1 Potential causes of\ninefficiency and/or\nineffectiveness are\nlisted\n2.2 Causes of\ninefficiency and/or\nineffectiveness are\nidentified through\ndeductive reasoning\n2.3 Identified causes of\ninefficiency and/or\nineffectiveness are\nvalidated thru\nestablished\nenvironmental\nprocedures\n\n2.1 Causes of\nenvironmental\ninefficiencies\nand\nineffectiveness\n\n2.1 Deductive\nReasoning\nSkills\n2.2 Critical\nthinking\n2.3 Problem\nSolving\n2.4 Observation\nSkills\n\n--- PDF PAGE 35 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n30\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Convey\ninefficient and\nineffective\nenvironmental\npractices\n\n3.1 Efficiency and\neffectiveness of\nresource utilization\nare reported to\nappropriate\npersonnel\n3.2 Concerns related\nresource utilization\nare discussed with\nappropriate\npersonnel\n3.3 Feedback on\ninformation/\nconcerns raised are\nclarified with\nappropriate\npersonnel\n3.1 Appropriate\nPersonnel to\naddress the\nenvironmental\nhazards\n3.2 Environmental\ncorrective\nactions\n3.1 Written and\nOral\nCommunicatio\nn Skills\n3.2 Critical\nthinking\n3.3 Problem\nSolving\n3.4 Observation\nSkills\n3.5 Practice\nEnvironmental\nAwareness\n\n--- PDF PAGE 36 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1 Utilization of Energy, Water, Fuel\nProcedures\n1.2 Waster Segregation Procedures\n1.3 Waste Disposal and Reuse Procedures\n1.4 Waste Collection Procedures\n1.5 Usage of Hazardous Materials Procedures\n1.6 Chemical Application Procedures\n1.7 Labeling Procedures\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n\n--- PDF PAGE 37 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n32\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nMeasured required resource utilization in the workplace\nusing appropriate techniques\n1.2.\nRecorded data in accordance with workplace protocol\n1.3.\nIdentified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4.\nValidate the identified causes of inefficiency and/or\nineffectiveness thru established environmental procedures\n1.5.\nReport efficiency and effectives of resource utilization to\nappropriate personnel\n1.6.\nClarify feedback on information/concerns raised with\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nWorkplace\n2.2\nTools, materials and equipment relevant to the tasks\n2.3\nPPE\n2.4\nManuals and references\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration\n3.2\nOral questioning\n3.3\nWritten examination\n4. Context for\nAssessment\n4.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n4.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 38 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n33\nUNIT OF COMPETENCY\n: PRACTICE ENTREPRENEURIAL SKILLS IN THE\nWORKPLACE\n\nUNIT CODE\n:"
