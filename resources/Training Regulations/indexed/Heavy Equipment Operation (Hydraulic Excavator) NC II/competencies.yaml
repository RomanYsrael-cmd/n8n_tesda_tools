ding based on\nmanufacturer's\nspecifications.\n2.5 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n\n2.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n2.2 Hand signals\n2.3 Site and weather\nconditions\n2.4 Clearance and\ndistances\n2.5 Speed limit\n2.6 Procedures in\nloading and\nunloading\n2.7 Factors affecting\nproductivity\n2.8 Productivity work\nmeasurements\n2.9 Ways of\nimproving\nproductivity\n\n2.1 Following verbal\ninstructions and\nsignals\n2.2 Operating skills in\nloading and\nunloading\nhydraulic\nexcavator to low-\nbed trailer/truck\n2.3 Using PPE\n2.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 78 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n73\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Perform excavation\nwork\n\n3.1 Site and weather\nconditions are\nconsidered before\nexcavating\n3.2 Engine RPM is set at\ndesired operating\ncondition.\n3.3 Safe work procedures\nand practices are\nobserved during\nexcavation operation\nbased on OSH\nstandards and\nmanufacturer’s manual\n3.4 Work equipment is\npositioned according to\noperating procedures.\n3.5 Bucket penetration\nangle position is\nobserved.\n3.6 Operation of arm and\nboom is observed\nduring scooping of\nexcavated materials.\n3.7 Required excavation\ndimensions are\nobserved according to\nwork specifications.\n3.8 Unexpected situations\nare responded in line\nwith company rules and\nregulations\n3.9 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n\n3.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n3.2 Signs and\nsymbols\n3.3 Company rules\nand regulations\n3.4 Manufacturer’s\nmanual\n3.5 Site and weather\nconditions\n3.6 Conversion of\nunits\n3.7 Clearance and\ndistances\n3.8 Safety devices\n3.9 Procedures in\nexcavation\n3.10 Factors affecting\nproductivity\n3.11 Productivity work\nmeasurements\n3.12 Ways of\nimproving\nproductivity\n\n3.1 Performing\nexcavation work\n3.2 Interpreting\nsignals and\nsymbols\n3.3 Identifying\naspects and\nhazards\n3.4 Following\ncompany rules\nand regulations\n3.5 Interpreting\nmanufacturer’s\nmanual\n3.6 Using PPE\n3.7 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 79 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n74\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Perform loading\noperation\n\n4.1 Hydraulic Excavator is\nproperly positioned\naccording to ground\ncondition\n4.2 Engine RPM is set at\ndesired operating\ncondition\n4.3 Swing angle is\nmaintained according to\nthe required distance\nand position of mobile/\nstationary equipment.\n4.4 Loading sequence is\nobserved based on\nstandard operating\nprocedure\n4.5 Unexpected situations\nare responded to in line\nwith company rules and\nregulations in a manner\nthat minimizes risk to\npersonnel and\nequipment\n4.6 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n\n4.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n4.2 Signs and\nsignals\n4.3 Company rules\nand regulations\n4.4 Manufacturer’s\nmanual\n4.5 Site and weather\nconditions\n4.6 Conversion of\nunits\n4.7 Clearance and\ndistances\n4.8 Safety devices\n4.9 Procedures in\nloading operation\n4.10 Factors\naffecting\nproductivity\n4.11 Productivity\nwork\nmeasurements\n4.12 Ways of\nimproving\nproductivity\n4.1 Performing\nloading operation\n4.2 Interpreting\nsignals and\nsymbols\n4.3 Identifying\naspects and\nhazards\n4.4 Following\nc