        "source_text": "CON311204\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance\nand storing of construction painting tools and\nequipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Check condition of\ntools and\nequipment\n\n1.1 Materials, tools and\nequipment are\nidentified according to\nclassification and job\nrequirements\n1.2 Non-functional tools\nand equipment are\nsegregated and labeled\naccording to\nclassification\n1.3 Safety of tools and\nequipment are\nobserved in\naccordance with\nmanufacturer's\ninstructions\n1.4 Condition of Personal\nProtective Equipment\n(PPE) are checked in\naccordance with\nmanufacturer's\ninstructions\n\n1.1 Use of PPE\n1.2 Handling of tools\nand equipment\n1.3 Good\nhousekeeping\n1.4 Types and uses\nof lubricants\n1.5 Types and uses\nof cleaning\nmaterials\n\n1.1 Maintaining tools\nand equipment\n1.2 Handling of tools\nand equipment\n1.3 Identifying tools\nand equipment\ndefects\n\n--- PDF PAGE 55 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n50\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform basic\npreventive\nmaintenance\n2.1 Appropriate lubricants\nare identified according\nto types of equipment\n2.2 Tools and equipment\nare lubricated\naccording to\npreventive\nmaintenance schedule\nor manufacturer's\nspecifications\n2.3 Measuring instruments\nare checked and\ncalibrated in\naccordance with\nmanufacturer’s\ninstructions\n2.4 Tools are cleaned and\nlubricated according to\nstandard procedures\n2.5 Defective instruments,\nequipment and\naccessories are\ninspected and replaced\naccording to\nmanufacturer’s\nspecifications\n2.6 Tools are inspected,\nrepaired and replaced\nafter use\n2.7 Work place is cleaned\nand kept in safe state\nin line with\nOccupational Safety\nand Health (OSHS)\n\n2.1 Use of PPE\n2.2 Handling of tools\nand equipment\n2.3 Good\nhousekeeping\n2.4 Types and uses\nof lubricants\n2.5 Types and uses\nof cleaning\nmaterials\n2.6 Methods and\ntechniques\n2.7 Procedures\n\n2.1 Handling of tools\nand equipment\n2.2 Performing\npreventive\nmaintenance\n\n--- PDF PAGE 56 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n51\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3 Store tools and\nequipment\n\n3.1 Inventory of tools,\ninstruments and\nequipment are\nconducted and\nrecorded as per\ncompany practices\n3.2 Tools and equipment\nare stored safely in\nappropriate locations in\naccordance with\nmanufacturer's\nspecifications or\ncompany procedures\n\n3.1 Use of PPE\n3.2 Handling of tools\nand equipment\n3.3 Storing\nprocedures and\ntechniques\n3.4 Storage\nconditions/\nlocations\n\n3.1 Storing tools and\nequipment\n3.2 Handling of tools\nand equipment\n\n--- PDF PAGE 57 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw\nBoring tools - brace, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n3. Personal Protective\nEquipment (PPE)\nMay include:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Reflectorized Vest\n\n--- PDF PAGE 58 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n53\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and equipment\nto carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and equipment and\nsafety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OSHA regulations\n1.8 Stored tools and equipment safely in appropriate locations and in\naccordance with company practices\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Maintenance schedule\n2.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n3.2 Written Examination\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 59 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n54\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPERFORM PRE AND POST-OPERATION\nPROCEDURES FOR HYDRAULIC EXCAVATOR\n\nUNIT CODE\n\n:"
