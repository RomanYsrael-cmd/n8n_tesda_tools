        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed adjustment or replacement for noted minor defects\n1.2 Performed basic preventive maintenance servicing (PMS)\n1.3 Prepared equipment reports\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Access to hydraulic excavator and manuals\n2.2 Access to hydraulic excavator\n2.3 Basic hand tools and portable powered tools\n2.4 Fluids and lubricants\n2.5 PPE\n2.6 Safety signage’s/barricades\n\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Direct observation / Demonstration with Oral Questioning\n\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 76 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n71\nUNIT OF COMPETENCY\n:\nPERFORM PRODUCTIVE OPERATION FOR\nHYDRAULIC EXCAVATOR\n\nUNIT CODE\n\n:"
