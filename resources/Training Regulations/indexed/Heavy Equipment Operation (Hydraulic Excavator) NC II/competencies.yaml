        "source_text": "CON834220\n\nUNIT DESCRIPTOR\n\n:\nThis unit involves the knowledge, skills and attitudes\nrequired in cleaning, greasing, adjusting and replacing\noperator-serviceable (OS) parts of hydraulic excavator.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform adjustment\nor replacement for\nnoted defects\n\n1.1 Minor defects are\nidentified and\nrepaired/replaced in\naccordance with\nmanufacturer’s\nprocedures.\n1.2 Basic hand tools\nand portable\npowered tools are\nselected based on job\nrequirements.\n1.3 Major defects are\nidentified using\nchecklist and referred\nto authorized\npersonnel for action.\n1.4 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n1.5 Daily equipment time\nrecord/report (DETR)\nis\naccomplished/submitte\nd according to\ncompany rules and\nregulations\n\n1.1 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n1.2 Waste disposal\nprocedures\n1.3 Volume/Capacity\n1.4 Clearance and\ndistances\n1.5 Types of fluids and\nlubricants\n1.6 Procedures in\nperforming\nadjustments or\nreplacements for\nnoted defects.\n1.7 Types and uses of\nbasic hand tools\nand portable\npowered tools\n1.8 Structure and\nfunction of\nhydraulic\nexcavator\ncomponents\n1.9 Factors affecting\nproductivity\n1.10 Productivity work\nmeasurements\n1.11 Ways of improving\nproductivity\n1.1 Application of\ndifferent basic\nhand tools and\nportable powered\ntools\n1.2 Identifying defects\n1.3 Performing\nadjustments or\nreplacements for\nminor defects\n1.4 Handling,\nsegregation and\ndisposal of\nhazardous waste\n1.5 Applying\nproductive\nmethods and\ntechniques\n1.6 Accomplishing\nequipment\nchecklist (DETR)\n1.7 Using PPE\n\n--- PDF PAGE 70 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n65\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform basic\npreventive\nmaintenance\nservicing (PMS)\n\n2.1 Operator’s\nServiceable parts are\nidentified and serviced\naccording to\nmanufacturer’s\nrecommendations.\n2.2 Standard parameters\nare checked according\nto manufacturer’s\nrecommendations.\n2.3 Fluids and lubricants\nare used based on\nmanufacturer’s\nmanual.\n2.4 Basic hand tools,\nportable powered tools\nand consumable\nmaterials are identified\nand used in\naccordance with job\nrequirements.\n2.5 Basic preventive\nmaintenance\nservicing (PMS) is\ncarried out in\naccordance with\nmanufacturer’s and\nsite regulations\n2.6 Site conditions are\nconsidered during\nPMS\n2.7 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n2.8 Daily equipment time\nrecord/report (DETR)\nis\naccomplished/submitte\nd according to\ncompany rules and\nregulations\n\n2.1 Understanding\nOperator’s\nMaintenance\nManual (OMM)\n2.2 Site and weather\nconditions\n2.3 Waste disposal\nprocedures\n2.4 Volume/capacity\n2.5 Clearance and\ndistances\n2.6 Types of fluids and\nlubricants\n2.7 Procedures in\nbasic preventive\nmaintenance\nservicing\n2.8 Types and uses of\nbasic hand tools\nand portable\npowered tools\n2.9 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n2.10 Factors affecting\nproductivity\n2.11 Productivity work\nmeasurements\n2.12 Ways of improving\nproductivity\n2.1 Performing basic\npreventive\nmaintenance\nservicing (PMS)\n2.2 Application of\nbasic hand tools\nand portable\npowered tools\n2.3 Application of\nfluids and\nlubricants\n2.4 Handling,\nsegregation and\ndisposal of\nhazardous waste\n2.5 Applying\nproductive\nmethods and\ntechniques\n2.6 Accomplishing\nequipment\nchecklist (DETR)\n2.7 Using PPE\n\n--- PDF PAGE 71 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n66\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Prepare equipment\nreports\n\n3.1 Equipment checklist is\naccomplished in\naccordance with\nmanufacturer’s/\nCompany\nrequirements.\n3.2 Equipment defects are\nreported to appropriate\npersonnel.\n3.3 Document control\nprocedures is observed\nbased on company\nrequirements\n3.4 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n\n3.1 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n3.2 Completion of\nchecklist and\ndefects reports\n3.3 Document control\nprocedures\n\n3.1 Accomplishing\nequipment checklist\n3.2 Using PPE\n\n--- PDF PAGE 72 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n67\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Minor defects\n\nMay include:\n1.1 Weak battery\n1.2 Tire inflation\n1.3 Belt tension\n1.4 Clogged air cleaner\n1.5 Defective radiator cap\n1.6 Loose battery clamps\n1.7 Bolts and mountings\n1.8 Presence of water in fuel separator\n\n2. Basic hand tools\nand portable\npowered tools\nMay include:\n2.1 Hand tools\n 2.1.1 Wrenches\n 2.1.2 Pliers\n 2.1.3 Brush (steel, paint)\n 2.1.4 Grease gun\n 2.1.5 Hammer (ball-peen, rubber, test)\n 2.1.6 Vice grip\n 2.1.7 Meter tape\n 2.1.8 Screw driver (Philips and flat tip)\n 2.1.9 Tire gauge (instrument)\n2.2 Portable Powered Tools\n 2.2.1High pressure washer\n2.3 Air compressor\n2.4 Battery charger\n3. Major defects\n\nMay include:\n3.1 Busted hydraulic hose\n3.2 Hard starting engine\n3.3 Excessive engine oil consumption\n3.4 Leakage on\n 3.4.1 Air\n 3.4.2 Fuel\n 3.4.3 Cooling\n 3.4.4 Hydraulic system\n3.5 Weak brakes\n3.6 Busted/flat tires\n3.7 Defective electrical system\n 3.7.1 Charging\n 3.7.2 Lighting\n3.7.3 Starting\n 3.7.4 Gauges\n4. Authorized\npersonnel\n\nMay include:\n4.1 Equipment supervisor\n4.2 Equipment Dispatcher/Foreman\n4.3 Equipment Maintenance personnel\n\n--- PDF PAGE 73 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n68\nVARIABLE\nRANGE\n5. Operator\nserviceable (OS)\nparts\n\nMay include:\n5.1 Battery clamps, battery distilled water\n5.2 Belts\n5.3 Filters\n5.3.1 Air cleaner\n5.3.2 Water fuel separator/drain valve\n5.3.3 Hydraulic filter\n5.3.4 Fuel filter\n5.4 All fluid caps\n5.5 All grease points and fittings\n5.6 Tire inflation\n\n6. Standard\nparameters\nMay include:\n6.1 Oil pressure\n6.2 Air pressure\n6.3 Temperatures\n6.4 Tension\n6.5 Clearance and distances\n\n7. Fluids and\nlubricants\nMay include:\n7.1 Engine oil\n7.2 Hydraulic oil\n7.3 Brake fluid\n7.4 Grease\n7.5 Coolant\n7.6 Battery solutions\n7.7 Transmission oil\n7.8 Differential oil\n7.9 Power steering oil\n\n8. Basic preventive\nmaintenance\nservicing\nMay include:\n8.1 Check battery clamps\n8.2 Check fan belt conditions (cracked or worn-out)\n8.3 Adjust belt tensions (if necessary)\n8.4 Clean/replace filters\n 8.4.1 Air cleaner\n 8.4.2 Water separator\n 8.4.3 Hydraulic filter\n 8.4.4 Fuel filter\n8.5 Replace defective fluid caps\n8.6 Grease all fittings on lube points\n8.7 Tire inflation/Tire air pressure\n\n--- PDF PAGE 74 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n69\nVARIABLE\nRANGE\n9. Site regulations\nMay include:\n9.1 Instructions\n9.2 Signages\n9.3 Work schedules\n9.4 Work bulletin boards\n9.5 Charts\n9.6 Memos\n9.7 Site Map\n9.8 Emergency response plan\n9.9 Permits\n\n10. Site conditions\nMay include:\n10.1 Dusty\n10.2 Windy\n10.3 Sunny\n10.4 Rainy\n10.5 Crowded\n10.3 Terrain (muddy and slippery)\n\n--- PDF PAGE 75 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n70\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed adjustment or replacement for noted minor defects\n1.2 Performed basic preventive maintenance servicing (PMS)\n1.3 Prepared equipment reports\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Access to hydraulic excavator and manuals\n2.2 Access to hydraulic excavator\n2.3 Basic hand tools and portable powered tools\n2.4 Fluids and lubricants\n2.5 PPE\n2.6 Safety signage’s/barricades\n\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Direct observation / Demonstration with Oral Questioning\n\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 76 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n71\nUNIT OF COMPETENCY\n:\nPERFORM PRODUCTIVE OPERATION FOR\nHYDRAULIC EXCAVATOR\n\nUNIT CODE\n\n:"
