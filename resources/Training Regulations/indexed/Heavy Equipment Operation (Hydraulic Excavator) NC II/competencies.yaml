  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in\nHEAVY EQUIPMENT OPERATION (HYDRAULIC EXCAVATOR) NC II. These units of\ncompetency are categorized into basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311210\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is\naccessed from\nappropriate sources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non-\nverbal communication\nis used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\n procedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating, calculating\nand recording routine\nworkplace measures\n1.6 Relating/ Interacting\nwith people of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to workplace\nrequirements\n1.8 Basic business writing\nskills\n1.9 Interpersonal skills in\nthe workplace\n2.0 Active-listening skills\n\n--- PDF PAGE 8 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n3\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are read\nand interpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are followed\nbased on established\nprocedures\n2.3 Feedback is given to\nworkplace supervisor\nbased instructions/\ninformation received\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters concerning\nconditions of\nemployment are sought\nand asked from\nappropriate\n sources\n2.6 Meetings outcomes\nare interpreted and\nimplemented\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace meetings\nand discussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating, calculating\nand recording routine\nworkplace measures\n2.6 Relating/ Responding\nto people of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding information\nin response to\nworkplace\nrequirements\n2.8 Basic\nquestioning/querying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n\n--- PDF PAGE 9 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Complete\nrelevant\nwork\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions\nof employment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Errors in recording\ninformation on forms/\ndocuments are\nidentified and acted\nupon\n3.4 Reporting\nrequirements to\nsupervisor are\ncompleted according\nto organizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace policies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n\n3.1 Completing work-\nrelated documents\n3.2 Applying operations\nof addition,\nsubtraction, division\nand multiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 10 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n5\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Appropriate\nsources\nMay include:\n1.1.\nTeam members\n1.2.\nSupervisor/Department Head\n1.3.\nSuppliers\n1.4.\nTrade personnel\n1.5.\nLocal government\n1.6.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation dissemination\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace-to-face communication\n2.7.\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace\ninteractions\nMay include:\n4.1.\nFace-to-face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic means, memos, instruction and\nforms\n4.5.\nNon-verbal including gestures, signals, signs and diagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message forms, safety\nreports\n\n--- PDF PAGE 11 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard format of the\norganization\n1.2. Accessed information using workplace communication\nequipment/systems\n1.3. Made use of relevant terms as an aid to transfer information\neffectively\n1.4. Conveyed information effectively adopting formal or informal\ncommunication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Notebook\n2.4. Writing materials\n2.5. Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Interview\n3.3. Written test\n3.4. Third-party report\n\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the actual\nworkplace or through an accredited institution\n\n--- PDF PAGE 12 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n7\nUNIT OF COMPETENCY\n:\nWORK IN A TEAM ENVIRONMENT\n\nUNIT CODE\n: 400311211\n\nUNIT DESCRIPTOR\n :\nThis unit covers the skills, knowledge and attitudes to\n\nidentify one’s roles and responsibilities as a member of a\n\nteam.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe team\nrole and scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified from\nteam discussions\nand appropriate\nexternal sources\n1.1 Group structure\n1.2 Group development\n1.3 Sources of\ninformation\n1.1 Communicating with\nothers,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways in\nimproving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s role\nand responsibility\nwithin a team\n2.1 Individual roles\nand responsibilities\nwithin the team\nenvironment are\nidentified\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified based on\nteam discussions\nand appropriate\nexternal sources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating with\nothers,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2 Developing ways in\nimproving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n--- PDF PAGE 13 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n8\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Work as a\nteam member\n3.1 Effective and\nappropriate\nforms of\ncommunications\nare used and\ninteractions\nundertaken with\nteam members\nbased on\ncompany\npractices.\n3.2 Effective and\nappropriate\ncontributions\nmade to\ncomplement\nteam activities\nand objectives,\nbased on\nworkplace\ncontext\n3.3 Protocols in\nreporting are\nobserved based\non standard\ncompany\npractices.\n3.4 Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding of\nteam’s role and\nobjectives\n\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning\nand\n decision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace\ncontext\n\n3.1 Communicating\n appropriately,\n consistent with the\n culture of the\n workplace\n3.2 Interacting effectively\nwith others\n3.3 Deciding as an\nindividual and as a\ngroup using group\nthink strategies and\ntechniques\n3.4 Contributing to\nResolution of issues\nand concerns\n\n--- PDF PAGE 14 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and\nobjective of team\nMay include:\n1.1.\nWork activities in a team environment with enterprise or\nspecific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\nMay include:\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace\ncontext\nMay include:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 15 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n10\n EVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe follo