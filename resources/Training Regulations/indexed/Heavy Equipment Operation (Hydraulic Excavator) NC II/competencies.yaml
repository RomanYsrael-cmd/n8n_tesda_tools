ound\n2. Unexpected\nsituations\nMay include:\n2.1 Sudden engine breakdown\n2.2 Busted hydraulic hose and oil leakages\n2.3 Hitting high tension wire\n2.6 Sudden ground failure\n2.8 Force majeure e.g., earthquake, tornado, typhoon\n2.9 Operator fatigue or sickness/condition\n2.10 Accidents/incidents\n3. Attachments\nMay include:\n3.1 Bucket\n3.2 Hammer\n3.3 Pulverizers\n3.4 Augers\n3.5 Shears\n3.6 Grapples\n3.7 Magnets\n3.8 Breaker\n4. Work equipment\nMay include:\n4.1 Boom\n4.2 Arm\n4.3 Bucket\n4.4 Blade (small and medium size unit)\n5. Excavated\nmaterials\nMay include:\n5.1 Boulders\n5.2 Soil\n5.3 Sand\n5.4 Limestone\n5.5 Debris\n5.6 Coal\n5.7 Landfill\n5.8 Ore\n5.9 Silt\n\n--- PDF PAGE 83 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n78\n\nVARIABLE\nRANGE\n6. Excavation\ndimensions\nMay include:\n6.1 Depth\n6.2 Reach\n6.3 Width\n6.4 Height\n7. Ground condition\n7.1 Soft\n7.2 Hard\n7.3 Muddy\n7.4 Rocky\n6.5 Loose\n8. Mobile/stationary\n equipment\n8.1 Rigid and articulated hauler truck\n8.2 Dump truck\n8.3 Hopper\n8.4 Conveyor\n8.5 Bottom dump trailer\n\n9. Classification of\nthe load\nMay include:\n9.1 Reinforced concrete pipes\n9.2 Rebars\n9.3 Steel pipes\n9.4 Water pump\n10. Load information\nMay include:\n10.1 Bill of ladings\n10.2 Packing and shipping list\n10.3 Delivery receipt\n10.4 Dimension\n\n--- PDF PAGE 84 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n79\nEVIDENCE GUIDE\n\n1. Critical aspects\nof evidence to be\nconsidered\n\nAssessment requires evidence that the candidate:\n1.1 Travelled the hydraulic excavator\n1.2 Load and unload hydraulic excavator to low-bed trailer/truck\n1.3 Perform excavation work\n1.4 Performed loading operation\n1.5 Performed lifting operation\n1.6 Observed safety measures applicable to worksite operation\n1.7 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following