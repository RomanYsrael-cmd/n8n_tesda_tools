        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual check\n1.2 Performed “BLOWAF” check\n1.3 Performed visual check for upper, lower structure and\nattachments\n1.4 Performed operation check\n1.5 Performed post-operation procedures\n1.6 Observed safety measures applicable to worksite operation\n1.7 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Work area for hydraulic excavator operation\n2.2 Access to hydraulic excavator and manuals\n2.3 Basic hand tools and portable powered tools\n2.4 PPE\n2.5 Safety signage/barricades\n\n3. Method of\nassessment\n\nThe following resources should be provided:\n3.1 Written Examination\n3.2 Direct observation /Demonstration with Oral Questioning\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 69 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n64\nUNIT OF COMPETENCY\n:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR HYDRAULIC EXCAVATOR\n\nUNIT CODE\n\n:"
        },
        "source_text": "CON834219\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming visual and operation check before and after\nproductive operation of hydraulic excavator.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform visual check\n\n1.1\nSize and capacity of\nhydraulic excavator\nis selected based on\njob requirements.\n1.2\nOperator-\nserviceable (OS)\nparts are checked in\naccordance with\nequipment checklist\nand manufacturer’s\nprocedures.\n1.3\nInspection of\nequipment is\nperformed with\nchecklist while engine\nis stopped/not running\n1.4\nPersonal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080\nOccupational Safety\nand Health Standards\n1.5\nRequired output is\ncompleted based on\naccomplished\nchecklist\n1.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n1.2 Procedures in\nconducting visual\nand walk-around\ncheck\n1.3 Sizes versus\ncapacity\n1.4 Familiarization of\nparts and\ncomponents of\nhydraulic\nexcavator\n1.5 Factors affecting\nproductivity\n1.6 Productivity work\nmeasurements\n1.7 Ways of\nimproving\nproductivity\n\n1.1 Performing visual\nand walk-around\nchecking\nprocedures\n1.2 Calculating the\ncapacity of\nhydraulic\nexcavator\n1.3 Identifying parts\nand components\nof hydraulic\nexcavator and its\nfunctions\n1.4 Accomplishing\nequipment\nchecklist\n1.5 Applying\nproductive\nmethods and\ntechniques\n1.6 Using PPE\n\n--- PDF PAGE 60 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n55\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform\n “B L O W A F” check\n\n2.1\n“BLOWAF” check\nis performed using\nchecklist with\nengine stopped/not\nrunning.\n2.2\nFluid levels are\nmaintained in\naccordance with\nequipment\nmaintenance\nmanual.\n2.3\nAbnormal\nconditions noted in\nchecklist and\nreported to\nauthorized\nperson.\n2.4\nPPE is used in\naccordance with\nRule 1080\nOccupational\nSafety and Health\nStandards\n2.5\nDaily equipment\ntime record/report\n(DETR) is\naccomplished/sub\nmitted according to\ncompany rules and\nregulations\n\n2.1 Procedures in\nperforming\n“BLOWAF” check\n2.2 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n2.3 Waste disposal\nprocedures\n2.4 Fluid’s level and\ncontamination\n2.5 Factors affecting\nproductivity\n2.6 Productivity work\nmeasurements\n2.7 Ways of improving\nproductivity\n\n2.1 Accomplishing\nequipment\nchecklist (DETR)\n2.2 Applying waste\ndisposal\nprocedures\n2.3 Following\n“BLOWAF”\nchecking\nprocedures\n2.4 Determining fluid\nlevel and\ncontamination\n2.5 Applying\nproductive\nmethods and\ntechniques\n2.6 Using PPE\n\n3. Perform visual check\nfor upper, lower\nstructure and\nattachments\n3.1\nUpper, lower\nstructure and\nattachments are\nchecked in\naccordance with\nchecklist and\nmanufacturer’s\nprocedures\n3.2\nupper, lower\nstructure and\nattachments are\nsecured for safe\noperation\n3.3\nAbnormal\nconditions are\nnoted in checklist\nand reported to\nauthorized person\n3.4\nPPE is used in\naccordance with\n3.1 Procedures in\nvisual check for\nupper, lower\nstructure and\nattachments\n3.2 Functions of\nattachments\n3.3 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n3.4 Factors affecting\nproductivity\n3.5 Productivity work\nmeasurements\n\n3.1 Following visual\nchecking for upper,\nlower structure and\nattachments\n3.2 Identifying parts\nand functions\n3.3 Applying\nproductive\nmethods and\ntechniques\n3.4 Accomplishing\nequipment\nchecklist (DETR)\n3.5 Using PPE\n\n--- PDF PAGE 61 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n56\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nRule 1080\nOccupational\nSafety and Health\nStandards\n3.5\nDaily equipment\ntime record/report\n(DETR) is\naccomplished/sub\nmitted according to\ncompany rules and\nregulations\n\n3.6 Ways of improving\nproductivity\n\n--- PDF PAGE 62 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n57\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Perform operation\ncheck\n\n4.1\nStarting/running\ncheck is performed\nwith checklist and in\naccordance with\nmanufacturer’s\nrecommendations.\n4.2\nControls are checked\nfor normal function\nwhile engine is\nrunning\n4.3\nSafety devices are\nchecked for proper\nfunctions in\naccordance with safe\noperating procedures.\n4.4\nPPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n4.5\nDaily equipment time\nrecord/report (DETR)\nis\naccomplished/submitt\ned according to\ncompany rules and\nregulations\n\n4.1 Start-up and\nwarming\nprocedures\n4.2 Procedures in\nOperation check\n4.3 Signs and symbols\n4.4 Functions of all\ncomponents and\nsafety devices\n4.5 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n4.6 Factors affecting\nproductivity\n4.7 Productivity work\nmeasurements\n4.8 Ways of improving\nproductivity\n4.1 Following\ninspection\nprocedures while\nthe engine is\nrunning\n4.2 Testing of\nhydraulic\nexcavator\n4.3 Applying\nproductive\nmethods and\ntechniques\n4.4 Accomplishing\nequipment\nchecklist (DETR)\n4.5 Using PPE\n\n5. Perform post-\noperation\nprocedures\n5.1 Hydraulic excavator is\nparked and turned off\nafter productive operation\nin accordance to\nmanufacturer’s manual.\n5.2 Controls are set into\nne