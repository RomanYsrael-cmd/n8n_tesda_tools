        "evidence_guide": {
          "source_text": "1. Critical aspects\nof evidence to be\nconsidered\n\nAssessment requires evidence that the candidate:\n1.1 Travelled the hydraulic excavator\n1.2 Load and unload hydraulic excavator to low-bed trailer/truck\n1.3 Perform excavation work\n1.4 Performed loading operation\n1.5 Performed lifting operation\n1.6 Observed safety measures applicable to worksite operation\n1.7 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Access to hydraulic excavator and job site/terrain\n2.2 Available loads\n2.3 Informative signages\n2.4 PPE\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Direct observation / Demonstration with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 85 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n80"
        },
        "source_text": "CON834221\n\nUNIT DESCRIPTOR\n\n:\nThis unit involves the knowledge, skills and attitudes\nin excavation work, loading and lifting operation using\nhydraulic excavator.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Travel the hydraulic\nexcavator\n\n1.1 Road conditions are\nconsidered before\ntravelling the hydraulic\nexcavator.\n1.2 Work area is surveyed\nfor potential hazards\nin accordance with safe\noperating procedures.\n1.3 Travel distance, speed\nand position of\nhydraulic excavator are\nobserved in\naccordance with\n manufacturer’s manual\nand/or company rules\nand regulations\n1.4 Unexpected situations\nare responded in\n line with company rules\nand regulations.\n1.5 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080\nOccupational Safety\nand Health Standards\n1.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n1.2 Company rules\nand regulations\n1.3 Site and weather\nconditions\n1.4 Road worthiness\n1.5 Clearance and\ndistances\n1.6 Speed limit\n1.7 Procedures in\ntravelling and\npositioning of\nhydraulic\nexcavator\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10 Ways of\nimproving\nproductivity\n\n1.1 Following\ncompany rules\nand regulations\n1.2 Travelling the\nhydraulic\nexcavator\n1.3 Using PPE\n1.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 77 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n72\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Load and unload\nhydraulic excavator\nto low-bed\ntrailer/truck\n2.1 Low-bed trailer /truck for\ntransporting the\nhydraulic excavator is\nselected according to\njob requirements.\n2.2 Attachments are\npositioned and secured\nbased on\nmanufacturer’s manual.\n2.3 Verbal instructions and\nsignals are conveyed\nwith authorized spotter\nduring loading and\nunloading as per\nstandard operating\nprocedures.\n2.4 All safety locks and\ncontrol levers are\nsecured at neutral\nposition before and after\nloading based on\nmanufacturer's\nspecifications.\n2.5 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n\n2.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n2.2 Hand signals\n2.3 Site and weather\nconditions\n2.4 Clearance and\ndistances\n2.5 Speed limit\n2.6 Procedures in\nloading and\nunloading\n2.7 Factors affecting\nproductivity\n2.8 Productivity work\nmeasurements\n2.9 Ways of\nimproving\nproductivity\n\n2.1 Following verbal\ninstructions and\nsignals\n2.2 Operating skills in\nloading and\nunloading\nhydraulic\nexcavator to low-\nbed trailer/truck\n2.3 Using PPE\n2.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 78 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n73\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Perform excavation\nwork\n\n3.1 Site and weather\nconditions are\nconsidered before\nexcavating\n3.2 Engine RPM is set at\ndesired operating\ncondition.\n3.3 Safe work procedures\nand practices are\nobserved during\nexcavation operation\nbased on OSH\nstandards and\nmanufacturer’s manual\n3.4 Work equipment is\npositioned according to\noperating procedures.\n3.5 Bucket penetration\nangle position is\nobserved.\n3.6 Operation of arm and\nboom is observed\nduring scooping of\nexcavated materials.\n3.7 Required excavation\ndimensions are\nobserved according to\nwork specifications.\n3.8 Unexpected situations\nare responded in line\nwith company rules and\nregulations\n3.9 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n\n3.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n3.2 Signs and\nsymbols\n3.3 Company rules\nand regulations\n3.4 Manufacturer’s\nmanual\n3.5 Site and weather\nconditions\n3.6 Conversion of\nunits\n3.7 Clearance and\ndistances\n3.8 Safety devices\n3.9 Procedures in\nexcavation\n3.10 Factors affecting\nproductivity\n3.11 Productivity work\nmeasurements\n3.12 Ways of\nimproving\nproductivity\n\n3.1 Performing\nexcavation work\n3.2 Interpreting\nsignals and\nsymbols\n3.3 Identifying\naspects and\nhazards\n3.4 Following\ncompany rules\nand regulations\n3.5 Interpreting\nmanufacturer’s\nmanual\n3.6 Using PPE\n3.7 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 79 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n74\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Perform loading\noperation\n\n4.1 Hydraulic Excavator is\nproperly positioned\naccording to ground\ncondition\n4.2 Engine RPM is set at\ndesired operating\ncondition\n4.3 Swing angle is\nmaintained according to\nthe required distance\nand position of mobile/\nstationary equipment.\n4.4 Loading sequence is\nobserved based on\nstandard operating\nprocedure\n4.5 Unexpected situations\nare responded to in line\nwith company rules and\nregulations in a manner\nthat minimizes risk to\npersonnel and\nequipment\n4.6 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n\n4.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n4.2 Signs and\nsignals\n4.3 Company rules\nand regulations\n4.4 Manufacturer’s\nmanual\n4.5 Site and weather\nconditions\n4.6 Conversion of\nunits\n4.7 Clearance and\ndistances\n4.8 Safety devices\n4.9 Procedures in\nloading operation\n4.10 Factors\naffecting\nproductivity\n4.11 Productivity\nwork\nmeasurements\n4.12 Ways of\nimproving\nproductivity\n4.1 Performing\nloading operation\n4.2 Interpreting\nsignals and\nsymbols\n4.3 Identifying\naspects and\nhazards\n4.4 Following\ncompany rules\nand regulations\n4.5 Interpreting\nmanufacturer’s\nmanual\n4.6 Using PPE\n4.7 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 80 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n75\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n5. Perform lifting\noperation\n5.1 Engine RPM is set at\ndesired operating\ncondition\n5.2 Weight and\nclassification of the\nload is determined\naccording to load\ninformation\n5.3 Interpreting load chart is\nobserved based on\nmanufacturer’s manual\n5.4 Rigging of load is\nobserved in accordance\nwith safe lifting\nprocedures\n5.5 Tipping radius is\nchecked and confirmed\naccording to lifting\ncapacity of the hydraulic\nexcavator\n5.6 Unexpected situations\nare responded to in line\nwith company rules and\nregulations in a manner\nthat minimizes risk to\npersonnel and\nequipment\n5.7 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n\n5.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n5.2 Signs and\nsignals\n5.3 Company rules\nand regulations\n5.4 Manufacturer’s\nmanual\n5.5 Load chart\n5.6 Site and weather\nconditions\n5.7 Conversion of\nunits\n5.8 Clearance and\ndistances\n5.9 Safety devices\n5.10\nProcedures in\nlifting operation\n5.11 Factors\naffecting\nproductivity\n5.12 Productivity\nwork\nmeasurements\n5.13 Ways of\nimproving\nproductivity\n5.1 Performing lifting\noperation\n5.2 Interpreting\nsignals and\nsymbols\n5.3 Identifying\naspects and\nhazards\n5.4 Following\ncompany rules\nand regulations\n5.5 Interpreting\nmanufacturer’s\nmanual\n5.6 Interpreting load\nchart\n5.7 Using PPE\n5.8 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 81 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n76\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n6. Perform operation\nusing various\nattachments\n6.1 Site and weather\nconditions are\nconsidered before\noperation\n6.2 Engine RPM is set at\ndesired operating\ncondition.\n6.3 Safe work procedures\nand practices are\nobserved during\noperation based on\nOSH standards and\nmanufacturer’s manual\n6.4 Hydraulic excavator is\npositioned according to\noperating procedures.\n6.5 Various attachments are\npositioned according to\nmanufacturer’s manual\n6.6 Operation of various\nattachments are\nobserved during\noperation\n6.7 Unexpected situations\nare responded in line\n with company rules and\n regulations\n6.8 PPE is used in\naccordance with Rule\n1080 Occupational\nSafety and Health\nStandards\n6.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n6.2 Signs and\nsymbols\n6.3 Company rules\nand regulations\n6.4 Manufacturer’s\nmanual\n6.5 Site and weather\nconditions\n6.6 Conversion of\nunits\n6.7 Clearance and\ndistances\n6.8 Safety devices\n6.9 Procedures in\nusing various\nattachments\n6.10 Factors\naffecting\nproductivity\n6.11 Productivity\nwork\nmeasurements\n6.12 Ways of\nimproving\nproductivity\n6.1 Performing\noperation using\nvarious\nattachments\n6.2 Interpreting sign\nand symbols\n6.3 Identifying\naspects and\nhazards\n6.4 Following\ncompany rules\nand regulations\n6.5 Interpreting\nmanufacturer’s\nmanual\n6.6 Using PPE\n6.7 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 82 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n77\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Potential hazards\n\nMay include:\n1.1 Other equipment\n1.2 Building\n1.3 Deep excavation\n1.4 Sloping ground\n1.5 Uneven terrain\n1.6 Overhead “live” electrical wires\n1.7 Underground utilities\n1.8 Unstable ground\n2. Unexpected\nsituations\nMay include:\n2.1 Sudden engine breakdown\n2.2 Busted hydraulic hose and oil leakages\n2.3 Hitting high tension wire\n2.6 Sudden ground failure\n2.8 Force majeure e.g., earthquake, tornado, typhoon\n2.9 Operator fatigue or sickness/condition\n2.10 Accidents/incidents\n3. Attachments\nMay include:\n3.1 Bucket\n3.2 Hammer\n3.3 Pulverizers\n3.4 Augers\n3.5 Shears\n3.6 Grapples\n3.7 Magnets\n3.8 Breaker\n4. Work equipment\nMay include:\n4.1 Boom\n4.2 Arm\n4.3 Bucket\n4.4 Blade (small and medium size unit)\n5. Excavated\nmaterials\nMay include:\n5.1 Boulders\n5.2 Soil\n5.3 Sand\n5.4 Limestone\n5.5 Debris\n5.6 Coal\n5.7 Landfill\n5.8 Ore\n5.9 Silt\n\n--- PDF PAGE 83 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n78\n\nVARIABLE\nRANGE\n6. Excavation\ndimensions\nMay include:\n6.1 Depth\n6.2 Reach\n6.3 Width\n6.4 Height\n7. Ground condition\n7.1 Soft\n7.2 Hard\n7.3 Muddy\n7.4 Rocky\n6.5 Loose\n8. Mobile/stationary\n equipment\n8.1 Rigid and articulated hauler truck\n8.2 Dump truck\n8.3 Hopper\n8.4 Conveyor\n8.5 Bottom dump trailer\n\n9. Classification of\nthe load\nMay include:\n9.1 Reinforced concrete pipes\n9.2 Rebars\n9.3 Steel pipes\n9.4 Water pump\n10. Load information\nMay include:\n10.1 Bill of ladings\n10.2 Packing and shipping list\n10.3 Delivery receipt\n10.4 Dimension\n\n--- PDF PAGE 84 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n79\nEVIDENCE GUIDE\n\n1. Critical aspects\nof evidence to be\nconsidered\n\nAssessment requires evidence that the candidate:\n1.1 Travelled the hydraulic excavator\n1.2 Load and unload hydraulic excavator to low-bed trailer/truck\n1.3 Perform excavation work\n1.4 Performed loading operation\n1.5 Performed lifting operation\n1.6 Observed safety measures applicable to worksite operation\n1.7 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Access to hydraulic excavator and job site/terrain\n2.2 Available loads\n2.3 Informative signages\n2.4 PPE\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Direct observation / Demonstration with Oral Questioning\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 85 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n80"
