        "source_text": "400311218\n\nUNIT DESCRIPTOR\n: This unit covers the outcomes required to apply\nentrepreneurial workplace best practices and implement\ncost-effective operations\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Apply\n entrepreneurial\n workplace best\n practices\n\n1.1 Good practices\nrelating to\nworkplace\noperations are\nobserved and\nselected following\nworkplace policy.\n1.2 Quality\nprocedures and\npractices are\ncomplied with\naccording to\nworkplace\nrequirements.\n1.3 Cost-conscious\nhabits in\nresource\nutilization are\napplied based on\nindustry\nstandards.\n1.1 Workplace best\npractices,\npolicies and\ncriteria\n1.2 Resource\nutilization\n1.3Ways in fostering\nentrepreneurial\nattitudes:\n•\nPatience\n•\nHonesty\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n•\nResourcefulness\n\n1.1 Communication\nskills\n1.2 Complying with\nquality\nprocedures\n\n2. Communicate\nentrepreneurial\nworkplace best\npractices\n\n2.1 Observed good\npractices relating\nto workplace\noperations are\ncommunicated to\nappropriate\nperson.\n2.2 Observed quality\nprocedures and\npractices are\ncommunicated to\nappropriate\nperson\n\n2.1 Workplace best\npractices,\npolicies and\ncriteria\n2.2 Resource\nutilization\n2.3 Ways in fostering\nentrepreneurial\nattitudes:\n•\nPatience\n•\nHonesty\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n•\nResourcefulness\n\n2.1 Communication\nskills\n2.2 Complying with\nquality\nprocedures\n2.3 Following\nworkplace\ncommunication\nprotocol\n\n--- PDF PAGE 39 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n34\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n2.3 Cost-conscious\nhabits in resource\nutilization are\ncommunicated\nbased on industry\nstandards.\n\n3. Implement cost-\neffective operations\n3.1 Preservation and\noptimization of\nworkplace\nresources is\nimplemented in\naccordance with\nenterprise policy\n3.2 Judicious use of\nworkplace tools,\nequipment and\nmaterials are\nobserved\naccording to\nmanual and work\nrequirements.\n3.3 Constructive\ncontributions to\noffice operations\nare made\naccording to\nenterprise\nrequirements.\n3.4 Ability to work\nwithin one’s\nallotted time and\nfinances is\nsustained.\n\n3.1 Optimization of\nworkplace\nresources\n3.2 5S procedures\nand concepts\n3.3 Criteria for cost-\neffectiveness\n3.4 Workplace\nproductivity\n3.5 Impact of\nentrepreneurial\nmindset to\nworkplace\nproductivity\n3.6 Ways in fostering\nentrepreneurial\nattitudes:\n•\nQuality-\nconsciousness\n•\nSafety-\nconsciousness\n3.1 Implementing\npreservation\nand optimizing\nworkplace\nresources\n3.2 Observing\njudicious use of\nworkplace tools,\nequipment and\nmaterials\n3.3 Making\nconstructive\ncontributions to\noffice\noperations\n3.4 Sustaining\nability to work\nwithin allotted\ntime and\nfinances\n\n--- PDF PAGE 40 ---\nHEAVY EQUIPMENT OPERATION (Hydraulic Excavator) NC II Revision 01 Promulgated (11/07/2019)\n35\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.Good practices\nMay include:\n1.1 Economy in use of resources\n1.2 Documentation of quality practices\n\n2.Resources utilization\nMay include:\n2.1 Consumption/ use of consumables\n2.2 Use/Maintenance of assigned equipment and\nfurniture\n2.3 Optimum use of allotted /available time\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify and sustain cost-\neffective activities in the workplace\n1.2 Demonstrated ability to practice entrepreneurial\nknowledge, skills and attitudes in the workplace.\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References a