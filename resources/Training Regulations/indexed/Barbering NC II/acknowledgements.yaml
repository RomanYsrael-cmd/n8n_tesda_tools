    {
      "source_text": "-- PDF PAGE 94 --- TR – Barbering NC II Revision 01 Promulgated (06/09/2020) 90 VARIABLE RANGE 9.4 Apply shaving cream, lotion or gel according to product specification or manufacturer’s manual of instructions to retain moisture and reduce friction of the blade against the skin. 9.5 Apply enough quantity of shaving cream into the hand and spread over the area to be shaved. 9.6 Start at the neck, using the fingers and apply appropriate shaving stroke until you cover all the areas and rub for about 1 to 2 minutes until chosen texture is achieved. 9.7 When using a straight razor, you can either use a free hand or backhand stroke. Hold the razor then turn the client’s face to the left while you are standing at the right side. 9.8 Check sharpness of the blade and replace if necessary. 9.9 Begin at the hairline at the right side. Stretch the area of the skin to be shaved then use a gliding diagonal stroke and shave toward the corner of the mouth to the jawbone. 9.10 Remain in the same position and wipe the razor clean using a tissue paper. 9.11 Stretch the skin and hold the razor in a backhand position. Using diagonal strokes, shave to the right side from the angle of the mouth down to the chin. 9.12 Wipe the razor using a tissue paper. Maintaining the same body position, hold the razor in the freehand position. 9.13 Shave the hair underneath the nostril using a slight diagonal strokes following the curves of the face. Use the fingers of the left hand to stretch the underlying skin. 9.14 Wipe the razor Stand to the right side of the client and turn the client’s face upward to shave the upper left lip 9.15 Using a backhand position, push the tip of the nose lightly to the right using the thumb while the fingers of the left hand stretch the skin. Shave the upper left side of the tip. 9.16 Gently turn the face of the client to the right, stretch the skin with the fingers of the left hand to prevent digging in along the ear. 9.17 Stretch the skin and shave downward and slightly forward toward the corner of the mouth and jawbone 9.18 Position yourself behind the client chair. Hold the razor for the reverse stroke. Stretch the skin below the chin and shave upward on the lower part of the neck. Stretch the skin away from the"
