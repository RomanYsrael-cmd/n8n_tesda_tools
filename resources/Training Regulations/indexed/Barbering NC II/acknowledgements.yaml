ng resources should be provided:\n2.1 Live Model\n2.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n2.3 Working area / facilities\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Observation with Oral Questioning\n3.3 Interview\n3.4 Portfolio\n3.5\nThird-Party Report\n4. Context of\nAssessment\n4.1 Competency may be assessed in the workplace or\nTESDA accredited assessment center\n\n--- PDF PAGE 87 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n83\nUNIT OF COMPETENCY : PERFORM SHAVE AND STYLE BEARD AND\nMUSTACHE\n\nUNIT CODE\n: SOC514321\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude required to\nshave or design/style beard and mustache. It involves the\npreparation of client, the actual shaving, styling and designing\nbeards and mustache. Perform post service activity. It\nincludes practicing proper and ethical behavior in accordance\nwith code of ethics.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare\nworkstation\n1.1\nSupplies and\nmaterials are\nprepared, checked and\nrecorded in\naccordance with\nshaving and styling\nbeard and mustache\nprocedure, FDA\nnotification following\nDOH, DTI and OSH\npolicies and guidelines\n1.2\nShaving products\nform are prepared,\nchecked and recorded\nin accordance with\nshaving and styling\nbeard and mustache\nprocedure, product\nspecification with FDA\nnotification\n1.3\nEquipment are\nprepared, checked, set\nand recorded\naccording to\nmanufacturer’s manual\nof instructions and\nshaving, styling beard\nand mustache\nprocedures\n1.4\nCutting tools for\nshaving and styling\nare checked,\nprepared, recorded\nand sanitized in\naccordance with\nshaving and styling\nbeard and mustache\nprocedure, products\n1.1\nCode of ethics\n1.2\nFamiliarization of\nsalon policies and\nprocedures\n