      "source_text": "3.6 TRAINER’S QUALIFICATIONS FOR BARBERING NC II"
    },
    {
      "source_text": "Must be a holder of National TVET Trainers Certificate (NTTC) Level I in Barbering NC II"
    },
    {
      "source_text": "Must possess good communication skills"
    },
    {
      "source_text": "Must have at least two (2) years experience in barbering industry for the last five (5) years"
    },
    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional Assessment is gathering of evidences to determine the achievements of the requirements of the qualification to enable the trainer make judgement whether the trainee is competent or not competent"
    },
    {
      "source_text": "-- PDF PAGE 167 --- TR – Barbering NC III Revision 01 Promulgated (06/09/2020) 163 SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT"
    },
    {
      "source_text": "Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards. The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to an employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1.1 To attain the national qualification of BARBERING NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in cluster of related units of competency, namely:"
    },
    {
      "source_text": "COC 1 Provide assistant barbers’ services"
    },
    {
      "source_text": "Perform hair and scalp treatment"
    },
    {
      "source_text": "Perform basic hair coloring"
    },
    {
      "source_text": "COC 2 Provide assistant barbers’ services"
    },
    {
      "source_text": "Perform basic men’s haircutting"
    },
    {
      "source_text": "Perform shave and style of beard and mustache"
    },
    {
      "source_text": "Perform chair manipulative relaxing services"
    },
    {
      "source_text": "Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification."
    },
    {
      "source_text": "4.1.3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "source_text": "4.1.4 Any of the following are qualified to undergo assessment and certification:"
    },
    {
      "source_text": "4.1.4.1 Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise- based trainings related to BARBERING NC II."
    },
    {
      "source_text": "4.1.4.2 Experienced workers (wage employed or self-employed) who gained competencies in providing barbering services for at least two (2) years within the last five (5) years."
    },
    {
      "source_text": "4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least three (3) years of barbering experience within the"
    },
    {
