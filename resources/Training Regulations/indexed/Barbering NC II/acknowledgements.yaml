  "source_text": "ACKNOWLEDGEMENTS ………………………………….……..…………\n 169 – 170\n\nTRAINING REGULATIONS DOCUMENT REVISION HISTORY ……….\n171\n\n--- PDF PAGE 5 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n1\nTRAINING REGULATIONS FOR\nBARBERING NC II\n\nSECTION 1 BARBERING NC II QUALIFICATION\n\nThe BARBERING NC II Qualification consists of competencies that a person must\nachieve to perform hair and scalp treatment, basic hair coloring, basic men’s haircutting,\nshave and style beard and mustache and perform chair manipulative relaxing services.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUnit Code\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the workplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nUnit Code\n\nCOMMON COMPETENCIES\nSOC514201\nMaintain an effective relationship with client/customer\nSOC514202\nManage own performance\nSOC514203\nApply quality standards\nSOC514204\nMaintain a safe, clean and efficient environment\n\nUnit Code\n\nCORE COMPETENCIES\nSOC514318\nPerform hair and scalp treatment\nSOC514319\nPerform basic hair coloring\nSOC514320\nPerform basic men’s haircutting\nSOC514321\nPerform shave and style beard and mustache\nSOC514322\nPerform chair manipulative relaxing services\n\nA person who has achieved this Qualification is competent to be:\n\n Assistant Barber (Scalp and Hair Treatment and Basic Hair Coloring)\n Assistant Barber (Men’s Haircutting, Shave and Style Beard and Mustache, Chair\nManipulative Relaxing Services)\n Barber\n\n--- PDF PAGE 6 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n2\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in BARBERING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n: 400311210\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non-verbal\ncommunication is used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\n procedures for the\nlocation and storage of\ninformation are used\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n\n1.1 Effective verbal and\nnonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in the\nworkplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n1.8 Workplace etiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing\nroutine workplace\nduties following\nsimple written\nnotices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated\ndocuments\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n\n--- PDF PAGE 7 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.8 Applying basic\nbusiness writing\nskills\n1.9 Applying\ninterpersonal\nskills in the\nworkplace\n1.10 Performing\nactive-listening\nskills\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are read\nand interpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are followed\nbased on established\nprocedures\n2.3 Feedback is given to\nworkplace supervisor\nbased instructions/\ninformation received\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and matters\nconcerning conditions\nof employment are\nsought and asked from\nappropriate sources\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n2.1 Effective verbal and\nnon-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in the\nworkplace\n2.4 Organizational/\nworkplace policies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n2.8 Effective questioning\ntechniques (clarifying\nand probing)\n2.9 Workplace etiquette\n\n2.1 Following simple\nspoken\ninstructions\n2.2 Performing\nroutine workplace\nduties following\nsimple written\nnotices\n2.3 Participating in\nworkplace\nmeetings and\ndiscussions\n2.4 Completing work-\nrelated\ndocuments\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Applying basic\nquestioning/\nquerying\n2.9 Applying skills in\nreading for\ninformation\n2.10 Applying skills in\nlocating\n\n--- PDF PAGE 8 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Complete\nrelevant\nwork-\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Errors in recording\ninformation on forms/\ndocuments are\nidentified and acted\nupon\n3.4 Reporting requirements\nto supervisor are\ncompleted according to\norganizational\nguidelines\n3.1 Effective verbal and\nnon-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms and\ndocuments\n3.4 Organizational/\nWorkplace policies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n\n3.1 Completing work-\nrelated documents\n3.2 Applying\noperations of\naddition,\nsubtraction,\ndivision and\nmultiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Applying Effective\nrecord keeping\nskills\n\n--- PDF PAGE 9 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n5\n RANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Appropriate\nSources\nMay include:\n1.1\nTeam members\n1.2\nSupervisor/Department Head\n1.3\nSuppliers\n1.4\nTrade personnel\n1.5\nLocal government\n1.6\nIndustry bodies\n2. Medium\nMay include:\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation dissemination\n2.5\nFollow-up or verbal instructions\n2.6\nFace-to-face communication\n2.7\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Workplace\nInteractions\nMay include:\n4.1\nFace-to-face\n4.2\nTelephone\n4.3\nElectronic and two-way radio\n4.4\nWritten including electronic means, memos, instruction\nand forms\n4.5\nNon-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1\nHR/Personnel forms, telephone message forms, safety\nreports\n\n--- PDF PAGE 10 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n6\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard\nformat of the organization\n1.2 Accessed information using workplace communication\nequipment/systems\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Notebook\n2.4 Writing materials\n2.5 Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Written test\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n7\nUNIT OF COMPETENCY : WORK IN A TEAM ENVIRONMENT\n\nUNIT CODE\n: 400311211\n\nUNIT DESCRIPTOR\n: This unit covers the skills, knowledge and attitudes to identify\none’s roles and responsibilities as a member of a team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and\nobjective of the team\nis identified from\navailable sources of\ninformation\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources\n1.1 Group structure\n1.2 Group development\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles and\nresponsibilities within\nthe team environment\nare identified\n2.2 Roles and objectives of\nthe team is identified\nfrom available sources\nof information\n2.3 Team parameters,\nreporting relationships\nand responsibilities are\nidentified based on\nteam discussions and\nappropriate external\nsources\n2.1 Team roles and\nobjectives\n2.2 Team structure and\nparameters\n2.3 Team development\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n3. Work as a\nteam\nmember\n3.1 Effective and\nappropriate forms of\ncommunications are\nused and interactions\nundertaken with team\nmembers based on\ncompany practices\n3.2 Effective and\nappropriate\ncontributions made to\ncomplement team\nactivities and\nobjectives, based on\nworkplace context\n3.3 Protocols in reporting\nare observed based on\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning and\n decision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace context\n\n3.1 Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as a\ngroup using group\nthink strategies and\ntechniques\n3.4 Contributing to\nResolution of\n\n--- PDF PAGE 12 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n8\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nstandard company\npractices\n3.4 Contribute to the\ndevelopment of t