lic)\n8.7\nClamps\n8.8\nHair clips\n8.9\nUltraviolet lamp or Ultraviolet sterilizer\n9. Supplies and Materials\nMay include:\n9.1\nTissue Paper\n9.2\nShampoo\n9.3\nConditioner\n9.4\nApplicator brush\n9.5\nHair and Scalp Treatment products\n10. Personal Protective\nClothing\nMay include but not limited to:\n10.1 Face mask\n10.2 Apron\n10.3 Cape\n10.4 Shoulder pad\n10.5 Bath Towel\n10.6 Face shield\n11. Workstation\nMay include:\n11.1 Shampoo bowl\n11.2 Client chair\n11.3 Trash Bin\n11.4 Trolley\n11.5 Towel\n11.6 Shampoo\n11.7 Conditioner\n11.8 Hair Blower\n11.9 Cape\n11.10 Apron\n12. Established Draping\nProcedures\nMay include:\n12.1 Client is draped with bath towel with\nhorizontal Edge folded 2 inches outward.\n12.2 Protective material/clothing is wrapped around\nthe neck.\n12.3 Appropriate Cape is wrapped around the\nshoulder in accordance with type of service.\n13. Treatment Product\nMay include:\n13.1\nCream Form\n13.2\nLiquid Form\n13.3\nGel Form\n14. Established Hair and\nScalp Treatment\nProcedures\nMay include:\n14.1 Apply treatment product according to product\nspecifications and manipulative relaxing motion\nis performed on hair and/or scalp.\n14.2 Expose hair or scalp to required source of heat\nwhen necessary, according to product\nspecifications and manufacturer’s manual\ninstructions\n14.3 Follow correct time requirement according to\nproduct specification and manufacturer’s\nmanual instructions.\n14.4 Client hair is rested after heat exposure\naccording to the required allotted time.\n\n--- PDF PAGE 67 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n63\n14.5 Rinse hair, towel or blow-dry\n15. Manipulative Relaxing\nMotion\nMay include:\n15.1 Circular motion\n15.2 Pressing\n15.3 Sliding\n16. Hair and Scalp\nMaintenance\nMay include:\n16.1 Hair and Scalp Frequent Treatment\n16.2 Other form of hair and scalp treatment\n17. Waste Materials\nMay include:\n17.1 Biodegradable\n17.2 Non-Biodegradable\n\n--- PDF PAGE 68 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n64\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Ensured client’s safety and comfort during the entire\nprocess, in accordance with DOH, DTI and OSH protocols\nand guidelines.\n1.2 Prepared client through consultation, analyzing hair and\nrecording client’s form in accordance with salon policies\nand procedures.\n1.3 Prepared and used tools, equipment, supplies and\nmaterials for hair and scalp treatment according to product\nspecifications, manufacturer’s manuals of instructions of\nequipment, DOH, DTI and OSH requirements.\n1.4 Used appropriate personal protective equipment (clothing\nand materials) following DOH, DTI and OSH requirements.\n1.5 Applied hair treatment product and performed hair and\nscalp treatment procedures with manipulative relaxing\nmotion according to product specifications and established\nhair and scalp treatment procedures.\n1.6 Operated machine/equipment when necessary, according\nto manufacturer’s manual of instructions.\n1.7 Performed post-service activities according to salon\npolicies and procedures, DOH, DTI and OSH\nrequirements.\n2. Resource Implications\nThe following resources should be provided:\n2.1 Live Model\n2.2\nTools, equipment and supplies/materials relevant to the\nactivity to be performed\n2.3\nWork area/facilities\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Third-Party Report\n3.3 Portfolio\n4. Context of\nAssessment\n4.1 Assessment may be conducted in the actual workplace or\nTESDA accredited assessment center\n\n\\\n\n--- PDF PAGE 69 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n65\nUNIT OF COMPETENCY : PERFORM BASIC HAIR COLORING\n\nUNIT CODE\n: SOC514319\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes in the\nperformance of basic hair coloring. This involves preparing\nand assessing the cl