nVARIABLE\nRANGE\n1 Supplies and Materials\nMay include:\n1.1\nTowel\n1.2\nPowder\n2 Type of Chair\nManipulative Relaxing\nServices\nMay include:\n2.1\nHead and scalp\n2.2\nArms and back\n3 Equipment\nMay include:\n3.1 Client chair (reclining chair)\n3.2 Stool\n4 Manipulative Relaxing\nProducts\nMay include:\n4.1 Lotion\n4.2 Powder\n4.3 Oil\n4.3.1 Aromatic Oil\n 4.3.2 Mentholated Oil\n 4.3.3 Herbal Oil\n5 Personal Protective\nEquipment\n(clothing/materials)\nMay include but not limited to:\n5.1\nFace Towel\n5.2\nGauze Mask\n5.3\nHead Band\n5.4\nApron\n5.5\nFace shield\n6 Workstation\nMay include:\n6.1\nClient chair (reclining chair)\n6.2\nTowel\n6.3\nTrolley\n7 Health and Body Condition May include:\n7.1\nHeart condition\n7.2\nBlood pressure\n7.3\nBone damage\n7.4\nAny skin related disorder\n8 Manipulative Relaxing\nMotion\nMay include:\n8.1\nPressing\n8.2\nSliding\n8.3\nCircular motion\n8.4\nTapping\n8.5\nKneading\n9 Manipulative Relaxing\nMotion technique\n\nMay include:\n9.1\n Soft Pressure\n9.2\nHard Pressure\n10 Established Chair\nManipulative Relaxing\nService Procedures\nMay include:\n10.1 SHOULDER\n Begin with your hands parallel to each other and\nslide them down each side of the spine. in\nmanipulating relaxing technique all the way down\nto lower back and buttocks. Then slide your hands\nup and all the way to the neck, over the shoulders\n\n--- PDF PAGE 104 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n100\nVARIABLE\nRANGE\nand down the arms to the fingertips. Repeat this\nmotion at least six times.\n10.2 NECK AND HEAD\n Maintain contact as you move up the spine to the\nneck. Using light to moderate kneading work the\nmuscles along the sides and back of the neck,\nfrom the shoulder to the base of the skull and\nbelow the ears. Pay special attention to the small\nmuscles at the base of the skull before working the\nhead. Using fingertip strokes, run across the scalp\nfrom forehead to neck. A zigzag movement with\nthe fingers can be done here, and often provide\nextra stimulation to the scalp as well as\ninvigorating the client. This should be one minute\nto 90 seconds long.\n Complete the manipulative relaxing service with\nseveral relaxing motion from the shoulders to the\nhips a sort of conclusion stroke before helping the\nclient sit up from the chair\n11 Health/Body Care\nMaintenance\nMay include:\n11.1 Body Lotion\n11.2 Healthy Food\n12. Waste Materials\nMay include:\n12.1 Biodegradable\n12.2 Non-Biodegradable\n\n--- PDF PAGE 105 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n101\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nConsulted client on the desired type of chair\nmanipulative relaxing services\n1.2\nPrepared and used supplies and materials according\nto product specification, DOH and OSH requirements\n1.3\nManipulative relaxing products are used and applied\nto client in accordance with chair manipulative\nrelaxing procedures, product specification, FDA\nnotification, with DOH and OSH requirements\n1.4\nPerformed chair manipulative relaxing procedures\nand applied manipulative relaxing service motion and\ntechnique according to prescribed direction, product\nspecification with DOH and OSH requirements.\n1.5\nObserved timeline according to established chair\nmanipulative relaxing procedures, product\nspecification\n1.6\nEnsured client’s comfort and safety during the entire\nprocess in accordance with DOH and OSH\nrequirements\n1.7\nAdvised clients on safety precautions after\nmanipulative relaxing procedures\n1.8\nAcknowledged and responded to any pain or\ncomplains made by the client\n1.9\nPerformed post-service activities in accordance with\nsalon management, DOH and OSH requirements\n2 . Resource\nImplications\nThe following resources should be provided:\n2.1 Model\n2.2 Tools, equipment and supplies/materials relevant to\nthe activity to be performed\n2.3 Work area/facilities\n3. Method of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with Questioning\n3.2 Third-Party Report\n3.3 Portfolio\n4. Context of\nAssessment\n4.1 Competency may be assessed in the simulated work\narea or TESDA accredited assessment center\n\n--- PDF PAGE 106 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n102\nSECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for BARBERING NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany the curricula.\n\n Course Title: BARBERING\n Level: NC II\n\n Nominal Training Duration:\n\n37 Hours (Basic Competencies)\n 24 Hours (Common Competencies)\n224 Hours (Core Competencies)\n285\n40 Supervised Industry Learning (SIL)\n325 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable in performing work activities involve in performing hair and\nscalp treatment, basic hair coloring, basic men’s haircutting, shave and shape beard\nand mustache and chair spot manipulative relaxing services. This include classroom\nlearning activities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must 