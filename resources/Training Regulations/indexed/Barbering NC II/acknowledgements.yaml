      "source_text": "-- PDF PAGE 104 --- TR – Barbering NC II Revision 01 Promulgated (06/09/2020) 100 VARIABLE RANGE and down the arms to the fingertips. Repeat this motion at least six times. 10.2 NECK AND HEAD Maintain contact as you move up the spine to the neck. Using light to moderate kneading work the muscles along the sides and back of the neck, from the shoulder to the base of the skull and below the ears. Pay special attention to the small muscles at the base of the skull before working the head. Using fingertip strokes, run across the scalp from forehead to neck. A zigzag movement with the fingers can be done here, and often provide extra stimulation to the scalp as well as invigorating the client. This should be one minute to 90 seconds long. Complete the manipulative relaxing service with several relaxing motion from the shoulders to the hips a sort of conclusion stroke before helping the client sit up from the chair 11 Health/Body Care Maintenance May include: 11.1 Body Lotion 11.2 Healthy Food 12. Waste Materials May include: 12.1 Biodegradable 12.2 Non-Biodegradable"
