area)\n\n2 x 2\n\n4\n\n4\nCirculation Area (30% of the\nTotal Building Area\n\n29\n29\nWash area/ comfort room\n(Male, Female, PWD)\n2 x 2\n4\n4\nGRAND TOTAL AREA:\n125 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR BARBERING NC II\n\n• Must be a holder of National TVET Trainers Certificate (NTTC) Level I in\nBarbering NC II\n• Must possess good communication skills\n• Must have at least two (2) years experience in barbering industry for the\nlast five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent\n\n--- PDF PAGE 167 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n163\nSECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of BARBERING NC II, the candidate\nmust demonstrate competence in all units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals\nwho were assessed as competent in cluster of related units of competency,\nnamely:\n\n COC 1 Provide assistant barbers’ services\n• Perform hair and scalp treatment\n• Perform basic hair coloring\n\n COC 2 Provide assistant barbers’ services\n• Perform basic men’s haircutting\n• Perform shave and style of beard and mustache\n• Perform chair manipulative relaxing services\n\nUpon accumulation and submission of all the COCs acquired, an individual\nshall be issued the corresponding National Certificate for the Qualification.\n\n4.1.3 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to undergo assessment and certification:\n\n4.1.4.1\nGraduates\nof\nWTR-registered\nprogram,\nNTR-registered\nprograms or formal/non-formal/informal including enterprise-\nbased trainings related to BARBERING NC II.\n\n4.1.4.2\nExperienced workers (wage employed or self-employed) who\ngained competencies in providing barbering services for at least\ntwo (2) years within the last five (5) years.\n\n4.1.5\nRecognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of barbering experience within the\n\n--- PDF PAGE 168 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n164\nlast five (5) years may apply for recognition in this Qualification through\nPortfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must\nbe consistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System.\n\n4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC)\nin Barbering NC II are required to undergo re-assessment under the\namended Training Regulations (TRs), upon expiration of their Certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in\nthe “Procedures Manual on Assessment and Certification” and “Guidelines\non the Implementation of the “Philippine TVET Competency Assessment\nand Certification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 169 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n165\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nteam\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career\nand life\ndecisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health\npolicies and\nprocedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying learning\nand innovation in\nthe organization\nUse information\nsystematically\nEvaluate occupational\nsafety and health\nwork practices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\nUtilize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice of\nsocial justice in\nthe workplace\nManage\ninnovative work\ninstructions\nManage and\nevaluate usage\nof information\nLead in improvement\nof Occupational\nSafety and Health\nProgram, Policies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork procedures\nDevelop\nsystems in\nmanaging and\nmaintaining\ninformation\nManage\nimplementation of\noccupational safety\nand health programs\nin the workplace\nManage\nimplementation of\nenvironmental\nprograms in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nMaintain an effective\nrelationship with\nclients/customers\nManage own performance\nApply quality standards\nMaintain a safe, clean and\nefficient environment\nCOMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR\nBARBERING NC II\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 170 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n166\nPerform facial\ncleansing\nPerform temporary\nhair removal activity\nPerform body\nscrub\nPerform pre and\npost hair care\nactivities\nPerform hair and\nscalp treatment\nPerform basic\nhair coloring\nPerform basic\nhair bleaching\nPerform basic\nhair perming\nPerform hair\nstraightening\nPerform basic\nhaircutting\nPerform advanced\nand creative\nhaircutting\nPerform\nadvanced and\ncreative hair\ncoloring\nPerform advanced\nand creative hair\nperming\nPerform basic\nmen’s\nhaircutting\nPerform shave\nand style beard\nand mustache\nPerform chair\nmanipulative\nrelaxing services\nPerform\nmanicure and\npedicure\nPerform hand\nand foot spa\nPerform\npreparatory\nactivities\nPrepare appropriate\nproducts, tools and\nequipment\nPerform nail\nenhancement\ntechnology\nprocedures\nPerform post\nservice activities\nPerform\nadvanced nail\npolish\nprocedures\nApply facial\nmake-up\nPerform body\nbleach\n\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 171 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n167\nGLOSSARY OF TERMS\n\nAniline\nDerivative\nTints\n-\nare also known as penetrating tints, synthetic, organic tints and\nperoxide or oxidation tints and are commonly called tints in the\nindustry\nBack Combing\n-\ncombing the short hair toward the scalp while the hair strand is held\nin a vertical position also called teasing\nBarbering\n-\nshould be done at eye level starting at the hairline. A method used\nin cutting the hair closed to the scalp and refer to as scissor over\ncomb\nBaseline\n-\nthe first/foundation line to be cut which subsequent sections are\ncut to\nBasic Hair\nShaping\n-\nshaping the hair that is not too long or too short to different head\nshape\nClippers\n-\nelectric razors mostly used to smoothen the back of the neck\nColor Fillers\n-\nare used if the hair is in damaged condition and there is doubt that\nthe color result will be an even shade\nColor Test/Tint\n-\na method of determining the action of color on a small strand of\nhair\nConditioner\n-\ncreams, waxes and oils which help protect and maintain the health\nand condition of the hair\nConditioning\n-\nthe application of special chemical agents to the hair to help restore\nits strength and give it body in order to protect it against possible\nbreakage\nCuticle\n-\nthe outer layer of the hair; the hard skin at the base of the fingernail\nDye\n-\nto color or stain the hair with tint\nElasticity\n-\nthe ability of the hair to stretch and return to its original form without\nbreaking\nEmulsifying\nAgent\n-\na substance used to form an emulsion, e.g. shampoo\nImplements\n-\na tool, utensil or other piece of equipment, especially as used for a\nparticular purpose\nFirst-Aid\n-\nmeans immediate assistance given in case of injury until medical\naid has been obtained\nGuideline\n-\na line to follow when shaping the balance of the hair\nHair Analysis\n-\nan examination to determine the condition of the hair prior to a hair\ntreatment\nHair Cutting\n-\na process of thinning, tapering and shortening the hair into different\nshapes or styles\nMedulla\n-\na hollow pith or core of the hair fiber\nPatch or Skin\nTest\n-\na procedure to test chemical reaction on scalp and skin\nPersonal\nProtective\nEquipment\n-\nmeans any clothing, device or other article that is intended to be\nworn or used by a worker to prevent injury or to facilitate rescue\nShimmering\n-\nshading or tinting parts of the hair to enhance the style\n\n--- PDF PAGE 172 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n168\nSlithering\n-\ntapering the hair to graduated length with scissors\nStraight Razor\n-\na razor with a rigid steel cutting blade hinged to a case that forms\na handle when the razor is open for use\nOccupational\nSafety & Health\n(OSH)\n-\nis define as the A.) promotion and maintenance of the highest\ndegree of physical, mental and social well-being of workers in all\noccupations B.) prevention among its workers of any departures\nfrom health cause by their working conditions; C.) protection\namong workers in their employment from risks usually from factors\nadverse health and; D.) placing and maintenance of the worker in\nan occupational environment adapted to his/her physiological\nability\nTaper\n-\nto diminish a strand of hair gradually toward the points by cutting.\nRemoving bulk from the ends of the hair\nThinning\n-\nremoving bulk from the hair\nTexture\n-\ncoarseness and fineness of the hair\nTexturizing\n-\nthinning or notching are used to create wispy or spiky effect.\nTrichologists\n-\na person trained in the science of caring for the hair\nTrichology\n-\nthe study of the structure and functions of the hair\nWig\n-\nan artificial covering for the head consisting of interwoven hair\nWorkplace\n-\nrefers to the office. Premises or worksite where a worker is\ntemporary or habitually assigned. Where is no a fixed or definite\nworkplace, the term shall include the place where the worker\nactually performs regular work, or where he regularly reports to\nrender service or to take assignment\n\n--- PDF PAGE 173 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n169\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend sincerest thank you and appreciation to the representatives of business, industry,\nacademe and government agencies who provided their time and expertise in the\ndevelopment and validation of this Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERT AND REVIEW PANEL\n\nMANOLITO “Ching” D. DONDONILLA\nTechnical Expert/Member\nPhilippine International Cosmetologists Assn. (PICA)\n\n ANDREW I. GALINDON\nTechnical Expert/Board Member\nPhilippine International Cosmetologists Assn. (PICA)\n\n CRISTINA P. MARPURI\nTechnical E