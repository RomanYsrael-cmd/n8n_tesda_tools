’s needs and\nrequirements\n•\nClear and comply with assignment\nrequirements of all communications with\nthe client or customer\n1.3 Build credibility\nwith clients\n\n•\nLecture and discussion on the following\ntopics:\no Interpersonal skills\no Customer service skills\no Telephone etiquette\no Maintaining records\n•\nAdhere to client expectations for\nreliability, punctuality and appearance\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n\n--- PDF PAGE 119 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n115\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nIdentify, attend and record possible\ncauses of client/customer dissatisfaction\naccording to employer policy\n•\nInform client of all relevant security\nmatters in a timely manner and\naccording to agreed reporting\nprocedures\n1.4 Establish\nprofessional\nrelationship with\nthe client\n\n•\nLecture and discussion on the following\ntopics:\no Types of Client\no Main Components of Client\nRelationship\no Relative Intelligence\no Effect on Customer Satisfaction\no Benefits of Customer\nRelationship Management\no Improving Client Relationship\n• Demonstrate the ability to establish\nprofessional relationship with client\n• Demonstrate the ability of genuine\nconcern for the welfare of the clients\n• Demonstrate the ability required in\nhandling clients\n• Demonstrate the ability required in\nrendering client service skills\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n1.5 Manage client\ninteractions\n\n•\nLecture and discussion on the following\ntopics:\no Manage client interactions\no Causes of client/customer\ndissatisfaction\no Assignment Instructions\no Reporting procedures\n•\nPerform the following skills:\n• Lecture\n• Disc